schemaVersion: model-routing-v1
reviewedAt: 2026-09-24
policy:
  - Use the cheapest model that reliably preserves structure and evidence references.
  - Escalate only failed leaves, unresolved claims, or cross-source conflicts; never rerun a whole report on a premium model by default.
  - Keep provider prices out of executable logic because prices and promotional rates change independently of this repository.
profiles:
  workflow-orchestration:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-5.6-sol-fast
    rationale: Candidate selection and deterministic pipeline orchestration are easy to verify; use Sol Fast only for unresolved conflicts.
  search-planning:
    defaultCopilotModel: gemini-3.5-flash
    reasoningEffort: minimal
    escalateTo: gpt-6-luna
    rationale: Query expansion, URL triage, and source classification are high-volume and easy to verify.
  evidence-extraction:
    defaultCopilotModel: gemini-3.5-flash
    reasoningEffort: minimal
    escalateTo: gpt-6-luna
    rationale: Atomic claim extraction is structured and checked by chapter validators.
  chapter-synthesis:
    defaultCopilotModel: gpt-5.4-mini
    reasoningEffort: medium
    escalateTo: gpt-5.6-sol-fast
    rationale: Production benchmarking found Mini cleared all strict chapter gates without escalation; GPT-6 Luna failed all eight chapters and required premium regeneration.
  chapter-synthesis-fast:
    defaultCopilotModel: gpt-5.4-mini
    reasoningEffort: medium
    escalateTo: gpt-5.6-sol-fast
    rationale: Mini remains the measured low-cost fast route; GPT-6 Luna was slower after every chapter required Sol Fast escalation.
  translation-draft:
    defaultCopilotModel: gemini-3.8-flash
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Gemini 3.8 Flash produced a faithful, substantially more natural long-form repair at the bulk-translation tier; compact table and figure leaves still need a concise-model pass.
  translation-compact:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-5.6-sol-fast
    rationale: Luna handles compact table and figure leaves; use Sol Fast only when preserving an explicit relationship needs more context.
  translation-qa:
    defaultCopilotModel: gpt-5.6-luna
    reasoningEffort: default
    escalateTo: gpt-5.6-sol-fast
    rationale: Review only meaning-sensitive leaves that survive deterministic checks or sound unnatural in cover-English review; reserve Sol Fast for unresolved semantic conflicts.
apiAlternatives:
  lowestCostBulk:
    recommendation: Gemini Flash-class model.
    useFor: Query planning, extraction, classification, and first-pass translation.
  balancedSynthesis:
    recommendation: GPT-5.4 Mini with GPT-5.6 Sol Fast escalation.
    useFor: Chapter drafting and report-level synthesis.
  chineseTranslation:
    recommendation: Gemini 3.8 Flash drafts with GPT-6 Luna editorial repair.
    useFor: Simplified Chinese overlays followed by deterministic repository quality gates.
