schemaVersion: model-routing-v1
reviewedAt: 2026-10-26
policy:
  - Use GPT-6 Luna exclusively for all automation stages and bounded repairs.
  - Retry only failed leaves, unresolved claims, or cross-source conflicts with higher reasoning effort on the same model.
  - Keep provider prices out of executable logic because prices and promotional rates change independently of this repository.
profiles:
  workflow-orchestration:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna for candidate selection, orchestration, and bounded conflict resolution.
  chapter-synthesis:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna for source-grounded chapter synthesis and isolated chapter repairs.
  chapter-synthesis-fast:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna for fast-profile chapter synthesis with the existing source and quality gates.
  report-finalization:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: medium
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna for report finalization and bounded higher-effort repairs.
  translation-draft:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna for source-faithful drafts with deterministic quality gates.
  translation-compact:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna for compact table and figure leaves and bounded semantic repairs.
  translation-qa:
    defaultCopilotModel: gpt-6-luna
    reasoningEffort: default
    escalateTo: gpt-6-luna
    rationale: Use GPT-6 Luna to review meaning-sensitive leaves and repair unresolved semantic conflicts.
apiAlternatives:
  lowestCostBulk:
    recommendation: GPT-6 Luna.
    useFor: Query planning, extraction, classification, and first-pass translation.
  balancedSynthesis:
    recommendation: GPT-6 Luna chapters, finalization, and bounded higher-effort repairs.
    useFor: Evidence-grounded chapter drafting and report-level synthesis.
  chineseTranslation:
    recommendation: GPT-6 Luna drafts, editorial review, and targeted repair.
    useFor: Simplified Chinese overlays followed by deterministic repository quality gates.
