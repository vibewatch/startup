schemaVersion: search-strategy-v1
principles:
  - Use broad search only to discover candidate URLs; fetch every retained URL with fetch-url before citing it.
  - Prefer primary and independent evidence, then use semantic or deep search only to close named gaps.
  - Reuse cached search results inside a run, but re-fetch volatile facts and direct evidence on every refresh.
providers:
  anysearch:
    role: Default low-cost broad discovery and unified vertical routing.
    env: ANYSEARCH_API_KEY
    supportsAnonymous: true
  brave:
    role: Fresh web and news discovery with date filters and an independent index.
    env: BRAVE_SEARCH_API_KEY
    supportsAnonymous: false
  tavily:
    role: Content-rich search for fast source triage and gap filling.
    env: TAVILY_API_KEY
    supportsAnonymous: false
  exa:
    role: Semantic company, people, financial-report, and deep gap searches.
    env: EXA_API_KEY
    supportsAnonymous: false
routing:
  broad: [anysearch, brave, tavily, exa]
  freshness: [brave, anysearch, tavily, exa]
  primary: [brave, anysearch, exa, tavily]
  semantic: [exa, tavily, anysearch, brave]
  adverse: [brave, exa, anysearch, tavily]
budgets:
  cacheTtlHours: 24
  profiles:
    fast:
      globalQueries: 3
      freshQueriesPerChapter: 2
      refreshQueriesPerChapter: 2
      maxGapQueriesPerChapter: 1
      maxResultsPerQuery: 8
      concurrency: 8
    deep:
      globalQueries: 3
      freshQueriesPerChapter: 5
      refreshQueriesPerChapter: 3
      maxGapQueriesPerChapter: 2
      maxResultsPerQuery: 10
      concurrency: 4
chapterFocus:
  company-overview:
    - founders leadership funding headquarters company profile
    - launch history investors team governance
  market-analysis:
    - database market SQLite edge cloud adoption
    - serverless database market demand developer trends
  competitors:
    - alternatives competitors Cloudflare D1 PlanetScale Neon Supabase
    - database comparison libSQL SQLite
  financials:
    - pricing funding revenue investors business model
    - customers startup program commercial traction
  product-tech:
    - architecture libSQL SQLite benchmarks documentation
    - open source GitHub database technical design
  customers:
    - customer case study adoption users partners
    - customer story production workload
  risks:
    - outage security limitations complaints migration
    - libSQL issues GitHub reliability
  valuation:
    - funding investors valuation financing
    - funding round seed series acquisition
quality:
  requireIntents: [primary, freshness, adverse]
  highReputationDomains:
    - bloomberg.com
    - ft.com
    - github.com
    - reuters.com
    - sec.gov
    - techcrunch.com
    - thenewstack.io
    - wsj.com
  lowSignalDomains:
    - buildmvpfast.com
    - cbinsights.com
    - cloudyunicorn.com
    - comparedge.com
    - comparetiers.com
    - crunchbase.com
    - facebook.com
    - firstsales.io
    - founden.ai
    - freestuff.dev
    - geo.sig.ai
    - headsup.bot
    - indihunt.in
    - instantdomainsearch.com
    - instagram.com
    - joinnextdev.com
    - linkedin.com
    - notice.co
    - o.parsers.vc
    - pitchbook.com
    - pkgpulse.com
    - producthunt.com
    - saasworthy.com
    - saaspricepulse.com
    - semrush.com
    - slashdot.org
    - solatatech.com
    - sourceforge.net
    - startupintros.com
    - stocktitan.net
    - tianpan.co
    - tiktok.com
    - trysignalbase.com
    - vantainsights.com
    - vibe-eval.com
    - vibeappscanner.com
    - youtube.com
    - zoominfo.com
    - explainx.ai
  sourceFunnel:
    - Official site, filings, regulator, legal, technical docs, and first-party announcements.
    - Independent news, analyst or market data, customer proof, and partner proof.
    - Adverse evidence, complaints, outages, litigation, and regulatory records.
    - Semantic or deep search only for unresolved questions after the first three passes.
