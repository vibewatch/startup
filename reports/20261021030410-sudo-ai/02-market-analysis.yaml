company:
  name: "Sudo AI"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Sudo AI addresses a narrow embodied-manipulation wedge inside China's much larger industrial-robotics base, with an initial developer and integration route rather than a proven direct-production sales motion. Industry evidence points to strong policy and production momentum, but pilot-stage adoption, incumbent fixed automation, concentrated shipments, and irreconcilable top-down forecasts prevent a defensible company-specific TAM, SAM, or SOM."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable boundary is not the entire robotics market. Sudo AI's stated wedge is
      simulation-trained manipulation that transfers directly to hardware, while investor and
      industry reporting identify industrial sorting, depalletizing, battery production, and
      logistics as candidate workflows. This includes manipulation software, controls, developer
      tooling, integration, and the hardware needed to execute variable-object tasks. It excludes
      unrelated mobile robots, robot components sold without a manipulation system, and general
      consumer robotics. The principal status-quo substitute is fixed, task-specific industrial
      automation: IFR says these systems remain faster and more reliable for repetitive,
      millimetre-precision work. Sudo therefore competes first where variability and changeover
      costs matter enough to offset the maturity of incumbent automation, not wherever a robot
      could theoretically be used.
    claimRefs: ["CM001", "CM002", "CM003", "CM014", "CM015"]
    tableRefs: ["TM001"]
  - id: "evidence-constrained-sizing"
    title: "Sizing through multiple constrained lenses"
    body: >-
      Public evidence supports boundary indicators rather than a company-addressable revenue
      estimate. IFR reports an installed base of roughly two million industrial robots in China,
      54% of worldwide annual installations, and a rise in local suppliers' domestic installation
      share from 30% in 2020 to 57% in 2024. TrendForce separately forecasts Chinese humanoid
      output growth of as much as 94% in 2026 and nearly 80% shipment concentration in Unitree and
      AgiBot. These measures describe installed stock, annual installation share, supplier share,
      output growth, and shipment concentration; they are not interchangeable with spend or Sudo
      AI revenue. The Robot Report's juxtaposition of a greater-than-US$5 trillion and roughly
      US$4 billion 2030 humanoid-market forecast illustrates why a broad headline TAM would be
      misleading without original methodologies and consistent category definitions.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM008", "CM010", "CM011"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption-path"
    title: "Buyers, users, payers, and route to adoption"
    body: >-
      The clearest near-term route is developer- and integrator-led. LeiFeng reported that Sudo AI
      was opening software capabilities to developers while partners built applications for
      specific scenarios. QbitAI reported joint development with CATL across battery-production
      and logistics workflows, while an investor-issued account named industrial sorting and
      warehouse depalletizing as target uses. These reports establish candidate users and
      workflows, but none identifies procurement authority, contract values, paid production
      deployments, or recurring budget ownership. A useful adjacent benchmark is Unitree: The
      Robot Report says its systems start at US$16,000 and have traction in education, research
      and development, and facilities inspection. That evidence suggests early budgets can sit
      outside core factory automation, but it does not establish Sudo AI pricing or reachable
      demand.
    claimRefs: ["CM012", "CM013", "CM014", "CM015", "CM016"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Demand is helped by China's large automation base, rising domestic-supplier penetration,
      policy support for embodied intelligence, and manufacturer interest in flexible handling.
      Sudo AI's pure-simulation proposition could reduce task-specific data collection and customer
      data exposure if it survives production conditions. The counterweight is timing and proof:
      IFR characterizes current real-world humanoid capability as demonstrations or pilots, expects
      traditional industrial robots to remain the manufacturing backbone, and places broad
      humanoid commercialization toward the end of China's 2026-2030 plan. TrendForce expects the
      industry's focus to shift toward tangible user value in the second half of 2026, underscoring
      that technical demonstrations do not yet equal scaled demand. Valuation should therefore be
      anchored to verified deployments, utilization, pricing, integration cost, and repeat orders,
      not broad market forecasts or financing enthusiasm.
    claimRefs: ["CM002", "CM003", "CM006", "CM007", "CM008", "CM009"]
