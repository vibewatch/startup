callouts:
  - calloutType: "risk"
    title: "A broad headline TAM is not decision-grade"
    body: "The retained evidence places two 2030 humanoid-market forecasts at roughly US$4 billion and above US$5 trillion. Without original methodologies or a Sudo-specific bottom-up bridge, neither value should anchor valuation."
    claimRefs: ["CM010", "CM011"]
  - calloutType: "insight"
    title: "The near-term wedge is partner-led"
    body: "Public reporting points to developer software, application partners, and joint development in industrial workflows; it does not establish a repeatable direct-sales engine or disclosed budget owner."
    claimRefs: ["CM014", "CM015"]
