      - ["Traditional industrial robots", "Task-specific automation with mature reliability and precision", "General-purpose embodied systems where flexibility is not required", "Manufacturers with repetitive, precision-driven processes", "Primary status-quo substitute and adoption hurdle"]
      - ["General humanoid and legged robots", "Platforms, mobility, manipulation, research, education, and inspection", "Unrelated consumer devices and components sold without a system", "Adjacent evidence includes education, R&D, facilities inspection, automotive, electronics, and logistics", "Useful demand context, but broader than Sudo AI's addressable market"]
    notes: "Boundary is analytical and evidence-constrained; no public source discloses Sudo AI pricing, contract scope, procurement authority, or production revenue."
    claimRefs: ["CM001", "CM002", "CM003", "CM012", "CM013", "CM014", "CM015"]
