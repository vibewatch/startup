company:
  name: Sudo AI
chapter:
  number: 3
  title: Competitors
  summary: >-
    Sudo AI's public differentiation is a simulation-trained manipulation model presented as
    generalizing without customer-specific real-robot data, but the retained evidence still
    describes Sudo R1 as a prototype without public pricing or shipment terms. Better-capitalized
    and more commercial competitors already disclose customer sites, orders, deliveries, or
    manufacturing expansion, so Sudo's moat remains a technical hypothesis rather than a
    demonstrated distribution advantage.
sections:
  - id: landscape-and-positioning
    title: Landscape and positioning
    body: >-
      The competitive set spans more than manipulation-model startups. Unitree is building a broad
      humanoid, quadruped, and components portfolio while pursuing a capital-intensive public-market
      path; Agility Robotics has Digit operating at nine customer sites; and UBTECH reports sizeable
      Walker orders and initial industrial deliveries. Kepler and Siasun add further Chinese
      industrial-robot alternatives, while manufacturers can still rely on internal integration,
      fixed automation, or manual workflows. Sudo occupies a narrower position: a dual-arm research
      system and software capability offered primarily through developers and partners. With more
      than 150 humanoid-robot companies reported in China and current policy attention on smart
      manufacturing, likely entrants and adjacent hardware vendors are a continuing pressure rather
      than a remote scenario.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP015]
    tableRefs: [TP001]
  - id: capability-and-commercial-proof
    title: Capability differentiation versus commercial proof
    body: >-
      Sudo's strongest reported point of difference is the claim that a simulation-only model
      achieved about 98% first-attempt success during a long, varied grasping test. The ICRA
      demonstration adds evidence that the system can handle randomly placed objects and that the
      hardware integrates dual seven-degree-of-freedom arms with cameras in the grippers. Those
      observations are useful, but they are not a controlled head-to-head benchmark against
      Unitree, Agility, UBTECH, Kepler, or Siasun. The public commercial evidence runs in the
      opposite direction: Agility discloses sites and orders, while UBTECH discloses orders and
      deliveries. The positioning map therefore scores public proof separately from claimed
      manipulation breadth and does not convert either axis into an engineering benchmark.
    claimRefs: [CP002, CP006, CP007, CP008, CP009, CP010, CP011]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching economics
    body: >-
      An apples-to-apples price comparison is not currently possible. Sudo has not published a
      product configuration, commercial price, customer-availability policy, or shipment terms;
      the retained competitor sources likewise provide financing, order, or capacity figures rather
      than unit prices and contract structures. Those quantities must not be treated as price,
      revenue, or installed-base substitutes. Sudo's reported developer-first, partner-delivered
      model could broaden reach, but it also gives integrators influence over application quality,
      customer ownership, and switching. No retained source discloses SDK terms, interoperability,
      service-level commitments, data portability, integration cost, or realized discounts. The
      resulting uncertainty prevents a supported conclusion about lock-in, multi-homing, or whether
      Sudo can underprice vertically integrated competitors.
    claimRefs: [CP001, CP004, CP005, CP016]
    tableRefs: [TP003]
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      Sudo's simulation-led approach could reduce dependence on expensive real-robot data and make
      adaptation faster, but the evidence does not establish exclusive data, proprietary supply,
      protected distribution, or durable customer switching costs. Sector-wide constraints also
      remain material: the retained industry report cites short operating endurance, high system
      costs, dexterity limits, and the need to find repeatable use cases. Those constraints can
      delay Sudo, while incumbents with manufacturing scale and customer deployments continue to
      improve. The key adverse case is commoditization: if hardware vendors or integrators reproduce
      adequate simulation-to-real performance, Sudo's model advantage may become a feature inside a
      broader platform. The moat should therefore be underwritten only after independent benchmark,
      paid-deployment, retention, and integration evidence is produced.
    claimRefs: [CP001, CP002, CP004, CP005, CP009, CP010, CP011, CP013, CP014]
