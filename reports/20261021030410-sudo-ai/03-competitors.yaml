      answersQuestionRefs: [QP005]
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: >-
        Comparable vendor quotes covering hardware, software, integration, support, discounts,
        uptime commitments, and contract duration for a defined workflow.
      whyItMatters: >-
        Without common units and scope, buyer ROI and relative price-performance cannot be assessed.
      diligencePath: >-
        Obtain three matched proposals for the same site, task, throughput, safety, and support
        requirements, then reconcile one-time and recurring costs.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: switching-and-lock-in
      missingEvidence: >-
        Executed customer terms and technical documentation for APIs, data portability,
        interoperability, retraining, maintenance, integrator replacement, and termination.
      whyItMatters: >-
        The partner-led model may reduce deployment friction or transfer customer control to
        integrators; the retained public evidence cannot distinguish those outcomes.
      diligencePath: >-
        Review SDK and integration agreements, interview at least two deployment partners, and
        test export and replacement procedures in a production-like pilot.
      relatedQuestionRefs: [QP009]
    - type: missing-source
      severity: material
      topic: independent-benchmark
      missingEvidence: >-
        Independent, reproducible head-to-head testing on identical tasks, objects, sites,
        intervention rules, safety constraints, and time windows.
      whyItMatters: >-
        Vendor demonstrations and differently scoped commercial disclosures cannot establish a
        durable technical lead or production reliability.
      diligencePath: >-
        Commission a blinded benchmark against at least two production alternatives and disclose
        failures, interventions, cycle time, uptime, and confidence intervals.
      relatedQuestionRefs: [QP002, QP004, QP008]
      relatedTableRefs: [TP002]
