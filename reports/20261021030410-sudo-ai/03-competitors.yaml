figures:
  - id: FP001
    title: Competitive positioning by public proof and claimed manipulation breadth
    type: quadrant
    summary: >-
      Evidence-backed ordinal scores separate disclosed commercial proof from the breadth of
      manipulation or industrial-task evidence; they are not engineering measurements.
    data:
      xAxis: "Public commercial proof: 1 (limited) to 5 (strongest in retained evidence)"
      yAxis: "Manipulation / task breadth: 1 (narrow) to 5 (broadest reported)"
      points:
        - label: Sudo R1
          x: 1
          y: 5
          note: Broad reported grasping generalization, but prototype status and no public shipments.
        - label: Unitree
          x: 3
          y: 4
          note: Broad robot portfolio and IPO funding plan; deployment proof absent from retained source.
        - label: Agility Robotics
          x: 5
          y: 3
          note: Nine customer sites and substantial orders; retained evidence is not a grasp benchmark.
        - label: UBTECH
          x: 4
          y: 3
          note: Orders, initial deliveries, and industrial tasks provide commercial evidence.
        - label: Kepler
          x: 2
          y: 2
          note: Industrial handling demonstrations reported; commercial scale remains unknown.
        - label: Siasun
          x: 2
          y: 2
          note: Industrial handling demonstrations reported; commercial scale remains unknown.
    approximationNotes: >-
      Ordinal 1–5 scores are analyst classifications from the retained disclosures, not measured
      market shares, prices, technical benchmarks, or equally spaced quantitative values.
    claimRefs: [CP001, CP002, CP007, CP008, CP009, CP010, CP011]
callouts:
  - calloutType: risk
    title: Technical promise is not yet a distribution moat
    body: >-
      Sudo needs independent benchmark replication, paid production deployments, transparent
      integration terms, and retention evidence before its simulation advantage can be treated as
      durable against better-capitalized robot manufacturers and integrator-led substitutes.
    claimRefs: [CP001, CP002, CP005, CP009, CP010, CP011, CP013]
