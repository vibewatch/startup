  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 仅纳入公开证实的缓解措施后，对六项最重要剩余风险的定性比较。
    data:
      columns:
        - id: impact
          label: 影响
          detail: 对生产准备度或投资结果的影响
        - id: likelihood
          label: 可能性
          detail: 基于证据的定性可能性；缺少一手证据时记为未知
        - id: mitigation
          label: 缓解成熟度
          detail: 经公开验证的缓解措施强度
      rows:
        - label: 生产可靠性
          note: 演示证据不等于现场可靠性分布
          values:
            - 高
            - 高
            - 早期
        - label: 仿真到真实操作的保真度
