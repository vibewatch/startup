chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Shanghai Sudo Technology Co., Ltd.（以 Sudo AI 运营）于 2025 年 5 月 19 日注册成立，注册地址位于上海市杨浦区。其首款产品 Sudo R1
              是一套围绕物体抓取和操控型基础模型打造的软硬件一体化机器人系统。公司将抓取视为拓展更广泛物理操控能力的入口，并称模型完全在仿真环境中训练。ICRA 演示报道还显示出一条近期市场路径：Sudo AI
              主要向开发者开放软件能力，由合作伙伴针对具体场景开发应用。这些证据支持“平台加系统”的定位，但无法证明当前定价、确认收入、出货量，或软件、硬件与集成收入的构成。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO012
              - CO016
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录显示，公司同时拥有连续创业和学术、工业机器人专长。Han Zheng 被列为联合创始人兼 CEO，Hao Su 被列为首席技术顾问。独立资料介绍了 Han 过往创办公司及退出经历，以及 Su 在
              3D
              视觉、仿真和机器人基准领域的工作。对一家以仿真为先的机器人公司而言，这种组合与创始人—市场匹配度相关，但也让可见的战略叙事集中在两个人身上。现有资料没有披露完整高管名单、董事会构成、投票权、投资人同意权或继任安排。因此，无法对治理质量作出确定判断，关键人物依赖应被视为尽调问题，而不是量化结论。
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: 融资与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Sudo AI 的融资记录规模可观，但分散在日期和范围各不相同的报道中。LeiPhone 报道称，公司于 2024 年完成种子轮融资，并在 2025 年完成多轮融资。2026 年 4 月的报道显示估值超过
              US$2 billion 亿美元，并列出 Alibaba、Tencent、CATL、GL Ventures 和 IDG 等投资人。随后 10 月的一篇报道提到另一轮超过人民币 10 亿元的融资，由 Futeng
              Capital、上海国投先导基金和国泰海通领投，但明确表示未披露投后估值。因此，最新一轮金额不能视为累计融资额，4 月估值也不应被表述为已确认的 10
              月估值。留存证据无法提供股权结构表、稀释情况、清算优先权、债务、老股转让和累计融资额。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO016
