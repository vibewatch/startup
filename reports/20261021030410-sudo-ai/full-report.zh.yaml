      - number: '8.3'
        title: 避免虚假精确的情景分析
        blocks:
          - type: paragraph
            body: >-
              指定的公开证据无法推导出可辩护的数值估值区间。乐观情景需要独立生产验证、具名付费部署、可重复的单位经济性，以及能留下可信持股和退出路径的融资条款；只有这样，才能用前瞻运营指标检验报道估值。基准情景是技术持续进步并与合作伙伴集成，但财务披露不足以为股权定价，因而支持继续跟踪，或在低于估值标题的水平按里程碑入场。悲观情景是演示表现无法转化为可重复的工业部署，规模化竞争者吸收需求，而融资继续资本密集。随着
              AI 系统成为需要承担设计、警示和供应链义务的已部署产品，产品责任风险还会增加另一条下行通道。
