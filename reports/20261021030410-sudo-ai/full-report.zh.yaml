      - number: '3.3'
        title: 定价、分销与切换经济性
        blocks:
          - type: paragraph
            body: >-
              目前无法进行同口径的价格比较。Sudo
              尚未公布产品配置、商业价格、客户供货政策或出货条款；留存的竞争对手来源同样提供的是融资、订单或产能数字，而非单价和合同结构。这些数字不能被当作价格、收入或装机量的替代指标。Sudo
              据报道采用开发者优先、合作伙伴交付的模式，可能扩大触达范围，但也会让集成商影响应用质量、客户归属和切换。没有留存来源披露 SDK
              条款、互操作性、服务水平承诺、数据可移植性、集成成本或实际折扣。因此，现有不确定性不足以支持对锁定效应、多平台并用，或 Sudo 能否低价击败垂直整合竞争者作出结论。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP016
          - type: table
