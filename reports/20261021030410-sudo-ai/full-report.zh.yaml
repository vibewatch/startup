        - 仿真驱动训练可能降低对昂贵真实世界数据的依赖。
        - 跨任务、跨环境的独立生产测试证实迁移性能。
      - - 正论
        - 由合作伙伴主导的软件模式可能拓宽应用开发。
        - 具名合作伙伴把集成转化为可重复的付费部署。
      - - 正论
        - 预计中国人形机器人产量将在 2026 年大幅增长。
        - 需求在试点之外持续存在，且主要不是由规模化龙头获取。
      - - 反论
        - 报道中的估值没有与已披露收入、客户、现金消耗或资金续航期挂钩。
        - 经审计财务数据和按客户批次拆分的合同证据支撑未来经济性。
      - - 反论
        - 预计出货量集中在 Unitree 和 AgiBot。
        - Sudo 在明确的工业工作流中证明自身拥有可守住的份额。
      - - 反论
        - AI 产品部署可能带来设计、警示和供应链责任。
        - 有记录的安全测试、警示、保险和合同责任分配能控制风险敞口。
    notes: 这些论点结合了 Sudo 专属报道、市场背景和法律语境；市场预测及竞争对手结果并不能直接证明 Sudo 的经济性。
