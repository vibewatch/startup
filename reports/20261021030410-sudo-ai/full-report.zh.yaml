            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: 里程碑与证据边界
        blocks:
          - type: paragraph
            body: >-
              公司在约一年内从注册成立走到公开发布产品并完成国际演示。Sudo AI 称，在一项 60 分钟评估中，首次抓取成功率约为 98%，两次尝试内成功率接近
              100%，训练未使用真实世界演示数据。进展速度值得关注，但证据边界同样重要：Korthos 将该测试界定为公司发布的结果，而非独立基准，并表示结果尚未在生产环境中验证。LeiPhone 对 ICRA
              的报道确认了针对不同物体的公开现场演示，但并未弥合生产验证缺口。10 月融资报道称，资金部分将用于真实工业验证，这进一步说明规模化、经第三方验证的部署仍是未来尽调里程碑，而非已经确立的运营事实。
