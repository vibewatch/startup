      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Sudo
              的仿真驱动方案可能减少对昂贵真实机器人数据的依赖，并加快适配，但证据没有证明其拥有独家数据、专有供应、受保护的分销渠道或持久的客户切换成本。行业层面的约束也很明显：留存行业报告提到运行续航短、系统成本高、灵巧性有限，以及必须找到可重复的使用场景。这些约束可能拖慢
              Sudo，而拥有制造规模和客户部署的现有企业仍在进步。最不利的情景是商品化：如果硬件供应商或集成商能够复现足够的仿真到现实性能，Sudo
              的模型优势可能只是更大平台中的一个功能。因此，只有拿到独立基准、付费部署、留存和集成证据后，才能把这项护城河纳入投资判断。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: 展示
        blocks:
