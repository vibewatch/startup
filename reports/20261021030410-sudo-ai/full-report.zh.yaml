      - number: '8.2'
        title: 正方论点、反方论点与可比背景
        blocks:
          - type: paragraph
            body: >-
              正方论点是，Sudo AI 的仿真驱动方案可能降低真实世界数据采集成本，而合作伙伴主导的软件模式可以拓宽部署路径。市场背景也有利：TrendForce 预测中国人形机器人产量将在 2026 年增长
              94%。反方论点是，商业化可能集中到已具规模的领导者手中，Unitree 和 AgiBot 预计将拿下接近 80% 的出货量。公开可比案例也说明，估值标题不能替代运营证据。Agility 待完成的 25
              亿美元交易伴随大量现金需求和或有订单，这些订单被明确排除在当期收入之外；UBTech 尽管持续亏损、Walker
              销量有限，仍达到更高的公开市场市值。这些只是参照点，而非直接估值基准，因为商业模式、成熟度、地域、披露质量和交易结构都不同。
