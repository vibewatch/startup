  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界并不是整个机器人市场。Sudo AI
              自称的切入点是经过仿真训练、可直接迁移到硬件上的操控能力；投资人和行业报道则把工业分拣、拆垛、电池生产和物流列为候选工作流。这一边界包括操控软件、控制系统、开发者工具、集成服务，以及执行多变物体任务所需的硬件；不包括无关的移动机器人、不带操控系统单独销售的机器人组件，也不包括通用消费机器人。现状的主要替代方案是固定、专用的工业自动化。IFR
              表示，这类系统在重复性高、要求毫米级精度的工作上仍更快、更可靠。因此，Sudo 首先要竞争的是那些任务变化和换线成本足以抵消现有自动化成熟度的场景，而不是理论上任何机器人都能使用的地方。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: 用多个受限视角估算规模
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是边界指标，而不是公司可触达收入的估算。IFR 报告称，中国工业机器人保有量约 200 万台，占全球年安装量的 54%；本土供应商在国内安装量中的份额也从 2020 年的 30% 升至 2024
              年的 57%。TrendForce 另行预测，中国人形机器人产量将在 2026 年增长最多 94%，Unitree 和 AgiBot 的出货集中度接近
              80%。这些指标分别描述存量、年度安装份额、供应商份额、产量增速和出货集中度，不能与支出或 Sudo AI 收入混为一谈。The Robot Report 并列展示了超过 US$5 trillion 和约
              US$4 billion 的 2030 年人形机器人市场预测；没有原始方法论和一致的分类定义，笼统的 TAM 标题会误导判断。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
