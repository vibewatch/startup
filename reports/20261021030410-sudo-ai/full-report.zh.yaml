  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪，信心低至中等、风险高，且估值偏高。两篇近期报道将 Sudo AI 最新估值置于 20 亿美元以上，但留存的 Sudo
              专题来源没有披露收入、ARR、付费客户数、烧钱、现金跑道或股权结构表。这种错配使决策对价格高度敏感：技术潜力和投资人支持足以支持继续尽调，但不能确立可投资的入场价。98%
              的首次抓取结果是公司发起、由媒体报道的业绩主张，而非独立生产基准。因此，分阶段流程应把任何投资建立在商业、财务、治理和优先权证据之上，而不是从融资轮次标题推断价值。
