      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              当前资料集没有证明退出准备度。Agility 拟议的 SPAC 说明公开市场可能接受纯机器人标的，但交易仍待完成，初始材料也没有披露收入。UBTech 的 IPO
              展示了另一条路径，同时说明上市可以与重大亏损和低旗舰机销量并存。对 Sudo
              AI，尽调应取得经审计或管理层财务报表、逐客户部署桥接表、独立任务级可靠性结果、完整股权结构表、债务、清算优先权、反稀释权、董事会控制权和资金用途。论点被打破的触发条件包括：无法将合作伙伴开发转化为付费且可重复的生产、独立可靠性显著弱于公开演示、融资条款损害普通股回报，或下一轮融资时仍缺乏运营披露。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
