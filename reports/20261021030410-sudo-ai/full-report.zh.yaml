      - number: '5.3'
        title: 部署模式与差异化
        blocks:
          - type: paragraph
            body: >-
              最清晰的差异化逻辑是，大量使用仿真训练可以减少对远程操控、人工标注和反复采集客户现场数据的依赖。Leiphone 报道称，Sudo 当前主要向开发者开放软件能力，由合作伙伴开发特定场景应用。一篇由投资人发布、经
              Sina 转发的公告称，公司正在建设国内和国际开发者中心，开放模型与工具，并支持工业制造和物流客户进行二次开发。这是一条平台导向的市场路径，但审阅过的来源没有提供公开 API
              文档、发布历史、软件包活动、集成规格、明确的生产在线率或支持承诺。Stanford 的一个项目独立证明仿真到现实的强化学习可以用于操控，同时也说明公开方法通常会披露任务级结果和失败率，而 Sudo
              尚未发布这些信息。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: 可靠性、信任与技术风险
        blocks:
          - type: paragraph
            body: >-
              核心技术风险在于成功的受控演示与可重复生产运营之间存在鸿沟。TechCrunch
              报道称，由于机器人训练数据稀缺，合成数据被广泛使用，但真实世界数据采集仍不可或缺，机器人软件的可靠性也仍落后于硬件。该报道还指出，持久采用要靠稳定、可重复的价值，而不是一次性展示。TrendForce
              同样预计，随着商业化加速，行业关注点将转向可量化的用户价值。因此，Sudo
              仍需提供按任务分层的成功率、干预频率、周期时间、平均故障间隔、环境限制和独立客户验收测试。现有证据无法证明正式安全认证、网络安全控制、隐私治理、在线率目标、事故历史或质量管理体系；这些都应继续作为尽调缺口，不能从“不需要本地数据采集”的说法中推断。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
