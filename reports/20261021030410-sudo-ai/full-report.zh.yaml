              - CM008
              - CM016
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的近期路径由开发者和集成商牵引。LeiFeng 报道称，Sudo AI 正向开发者开放软件能力，同时由合作伙伴针对具体场景开发应用。QbitAI 报道了公司与 CATL
              在电池生产和物流工作流上的联合开发，一篇投资人发布的文章则把工业分拣和仓库拆垛列为目标用途。这些报道确定了候选用户和工作流，但没有一篇说明采购决策权、合同金额、付费生产部署或持续预算归属。Unitree
              可作为相邻参照：The Robot Report 称其系统起价 16,000 美元，并已在教育、研发和设施巡检领域获得采用。早期预算可能来自核心工厂自动化之外，但不能据此确定 Sudo AI 的定价或可触达需求。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              中国庞大的自动化基础、不断提升的本土供应商渗透率、对具身智能的政策支持，以及制造商对柔性操作的兴趣，都在支撑需求。如果能经受生产环境考验，Sudo AI
              的纯仿真方案或可减少特定任务的数据采集和客户数据暴露。制约因素在于时间和证据：IFR 将当前人形机器人在真实世界的能力界定为演示或试点，预计传统工业机器人仍将是制造业主力，并认为人形机器人的广泛商业化要到中国
              2026—2030 年规划后期才会出现。TrendForce 预计行业将在 2026
              年下半年转向可量化的用户价值，这说明技术演示尚不等于规模化需求。因此，估值应锚定已验证部署、利用率、定价、集成成本和复购订单，而不是宽泛的市场预测或融资热度。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 宽泛的 TAM 标题不足以支持决策
            body: 留存证据将两项 2030 年人形机器人市场预测分别置于约 40 亿美元和超过 5 万亿美元。没有原始方法论或针对 Sudo 的自下而上推导，任何一个数字都不应作为估值锚点。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
          - type: callout
            title: 近期切入点由合作伙伴牵引
            body: 公开报道指向开发者软件、应用合作伙伴和工业工作流联合开发，但没有证明存在可重复的直销引擎或已披露的预算负责人。
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与定位
        blocks:
          - type: paragraph
            body: >-
              竞争对手不止操控模型初创公司。Unitree 正在打造覆盖人形机器人、四足机器人和零部件的广泛产品组合，同时寻求资本密集型的公开市场路径；Agility Robotics 的 Digit 已在 9
              个客户地点运行；UBTECH 则披露了规模可观的 Walker 订单和初步工业交付。Kepler 和 Siasun 进一步增加了中国工业机器人替代方案，而制造商仍可依靠内部集成、固定自动化或人工工作流。Sudo
              的定位更窄：主要通过开发者和合作伙伴提供双臂研究系统及软件能力。据报道，中国已有超过 150 家人形机器人公司；在当前政策持续关注智能制造的背景下，潜在进入者和相邻硬件供应商将持续施压，并非遥远情景。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
