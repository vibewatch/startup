        blocks:
          - type: paragraph
            body: >-
              独立机器人研究支持 Sudo AI 方案背后的总体前提：大规模真实世界数据采集和模仿学习可能昂贵、耗费人力且难以扩展，而仿真到现实的强化学习是一种潜在替代方案。             
              这对训练数据经济性有利，但不能证明 Sudo AI 的毛利率。以仿真为先的模式可能把支出转向算力、模型开发、机器人硬件、验证、集成、现场支持和可靠性修复。公开资料没有量化任何一类成本。工作场所 AI
              的法律分析还表明，客户可能面临合规和审查负担，从而延长部署时间或增加实施费用。因此，现有证据无法说明数据采集节省是否超过交付链其他环节新增的成本。
