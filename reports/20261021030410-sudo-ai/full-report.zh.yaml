            title: 演示成功不是可靠性分布
            body: 报道中的抓取结果没有披露任务权重、干预规则、周期时间、失败恢复、耐久性或客户验收标准。因此，评估生产准备度需要原始测试日志和独立试验，不能从公开视频外推。
