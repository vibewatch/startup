            - 中
            - 未披露
        - label: 合作伙伴主导的部署
          note: 应用归属和客户集中度未知
          values:
            - 高
            - 中
            - 早期
        - label: 法律、安全与合规
          note: 没有指定一手法律或认证来源
          values:
            - 高
            - Unknown
            - 未披露
    approximationNotes: 各类别是分析师的定性判断，不是测量得到的概率或基准分数；保留“未知”，而不是将其转换成数字值。
