  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 在所报道估值具备支持可投资建议的依据之前，技术潜力和市场增长仍不足以弥补已暴露的验证与披露缺口。
    data:
      nodes:
        - id: technical-signal
          label: 技术信号
          detail: 在受控公开演示中，据报道首次尝试抓取成功率为 98%。
        - id: deployment-path
          label: 部署路径
          detail: 软件目前主要向开发者开放，合作伙伴负责构建应用。
        - id: market-tailwind
          label: 市场顺风
          detail: TrendForce 预计 2026 年中国人形机器人产量增长 94%。
        - id: commercial-proof-gap
          label: 商业化证明缺口
          detail: 保留的 Sudo 来源没有披露收入、付费客户数量、现金消耗或 runway。
        - id: price-test
          label: 价格检验
          detail: 报道中的 20 亿美元以上估值缺乏公开经营数据支撑。
        - id: recommendation
          label: 跟踪 / 估值偏高
          detail: 在进行量化投资判断前，要求先看到里程碑、财务数据和融资条款。
    approximationNotes: 这是有序的决策逻辑，不是按概率加权的模型或与价值成比例的图示。
