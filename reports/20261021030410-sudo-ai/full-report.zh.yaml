          detail: 据报道，高保真虚拟环境和合成交互数据构成主要训练基础。
          items:
            - 仿真场景
            - 物体变化
            - 物理与动力学
        - label: 基础模型训练核心
          detail: 已发表报道描述了一款操作基础模型，将世界模型概念与强化学习结合起来。
          items:
            - 世界模型
            - 强化学习
            - 通用操作策略
        - label: 感知
          detail: 据报道，公开展示的实体采用视觉感知，包括集成在夹爪中的多台摄像头。
          items:
            - 更新后的观测
            - 物体感知
            - 放置空间感知
        - label: 闭环控制
          detail: Korthos 报告称，动作更新频率为 15-25 Hz，并具备障碍物感知和轨迹适配能力。
          items:
            - 动作更新
            - 障碍物感知
            - 轨迹适配
        - label: 机器人实体
          detail: ICRA 系统被描述为双臂结构，每条手臂有 7 个自由度。
          items:
            - 双臂
            - 每条手臂 7 个自由度
            - 夹爪
        - label: 开发者与工业应用
          detail: 据报道，软件能力主要面向开发者开放，合作伙伴正在将系统适配到制造和物流场景。
          items:
            - 开发者工具
            - 合作伙伴集成
            - 工业应用
    approximationNotes: 仅为概念性排序；没有来源披露完整的实现图或经验证的接口边界。
