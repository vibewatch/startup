        title: 展示
        blocks:
          - type: callout
            title: 技术与融资快速推进
            body: 注册成立约 17 个月后，Sudo AI 已公开推出 Sudo R1，在 ICRA 上进行演示，并据报道完成了一轮超过人民币 10 亿元的融资。
