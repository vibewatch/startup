  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Sudo R1 被描述为一套一体化机器人系统，而非独立模型：公开产品边界包括机器人硬件、软件和专注操控的基础模型。其目标工作流是用仿真训练和对陌生物体及环境的零样本部署，替代反复采集特定现场演示数据。QbitAI
              报道称，在公司一次 60 分钟、抓取次数超过 200 次的演示中，首次成功率约 98%，两次尝试内成功率接近 100%。这些数字描述的是阶段性测试，而非生产服务水平。2026 年 ICRA 上，Leiphone
              另行报道了对不同材质和形状、随机摆放物体的成功抓取；这增加了现场事件证据，但仍不能证明持续工业吞吐量或失败率。
            claimRefs:
