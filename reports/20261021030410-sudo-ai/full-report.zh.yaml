      - number: '7.4'
        title: 财务、合作伙伴与执行依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露 Sudo 的收入、毛利率、烧钱、现金跑道、营运资金、保修准备金或已签订单经济性。一份合作伙伴发布的公告反而强调估值超过 20 亿美元；QbitAI 报道与 CATL
              联合开发，却没有公布合同范围、生产状态、经济性或集中度。可比证据说明这些区别为何重要：Agility 初步未经审计的 2025 年运营费用约为 1.11 亿美元，现金消耗约 1 亿美元，而超过 3
              亿美元的承诺订单被明确排除在当期收入之外。应检验 Sudo
              的合作伙伴主导应用模式和未披露的制造计划是否依赖集成商、少数工业合作伙伴、零部件供应商和持续外部资本。投资批准应要求经过核对的运营计划和具名部署证据，而不是从融资参与推断商业持久性。
