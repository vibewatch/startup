              最强的公开信号来自技术演示和潜在部署效率，而不是订单或收入。与投资人相关的报道声称，避免使用客户敏感数据可以缩短实施周期并降低自动化改造成本；独立报道则介绍了开发者访问和合作伙伴开发的应用。如果这些主张在生产环境中成立，可能改善销售速度和实施经济性，但没有来源报告销售周期、转化率、渠道抽成率、获客成本、回收期、利用率、装机量、ARR、收入或
              GMV。信息缺口使得无法评估可重复性或销售效率。成功演示不能视为已签约部署，平台可用也不能视为已确认的软件收入。
