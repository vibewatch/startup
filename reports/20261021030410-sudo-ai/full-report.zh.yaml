            body: 如果 Sudo 无法提供经独立见证、达到约定可靠性和安全阈值的生产试验、经过核对的烧钱与现金跑道计划、一手法律和合规证据，以及证明报道中的工业开发已超越无偿或探索性试点的合同级证据，不应继续推进。
