          value: Target use cases
          touchpoints:
            - Investor-described application scenarios
            - Industry demand and readiness research
        - id: evaluation
          label: 技术评估
          stage: Demonstration
          detail: ICRA 演示和公开操作测试构成了评估入口。
          value: Publicly documented
          touchpoints:
            - ICRA 2026 demonstration
            - Developer-facing technical exposure
        - id: integration
          label: 开发者集成
          stage: Ecosystem
          detail: 据报道，软件能力向开发者开放，用于构建场景应用。
          value: Reported
          touchpoints:
            - Developer software access
            - Planned interfaces and tools
        - id: pilot
          label: 联合开发
          stage: Validation
          detail: 在保留证据中，CATL 是唯一明确列出的公司相关工业关系。
          value: One named report
          touchpoints:
            - Battery production
            - Logistics scenarios
        - id: production
          label: 生产采购
          stage: Commercial deployment
          detail: 保留证据中没有发现付费或生产部署。
          value: Not verified
          touchpoints:
            - Production acceptance
            - Contract and unit economics
        - id: expansion
          label: 续约与扩张
          stage: Durability
