      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 独立可靠性证据、具名的付费生产部署、可重复的单位经济性，以及条款清晰的融资。
        - 用已验证的未来指标检验报道中的估值；目前没有公开证据支持量化区间。
        - 规模化和安全性能可能落后于演示结果。
        - 指定公开证据尚未证实。
      - - 基准
        - 技术进展和合作伙伴主导的集成继续推进，但商业和财务披露仍然有限。
        - 以低于缺乏支撑的报道估值跟踪，或按里程碑分阶段入场。
        - 资金需求和竞争集中度推迟回报可见性。
        - 与当前证据最一致。
      - - 悲观
        - 演示结果无法推广到生产，合作伙伴没有转化为付费客户，融资继续高度消耗资本。
        - 下轮融资或资本减值风险占主导；没有基于证据的量化下限。
        - 规模化竞争对手获取需求，法律风险推高部署成本。
        - 可比公司亏损、现金消耗及或有订单限制均表明这一路径具有合理可能性。
    notes: 定性情景有意避开缺乏支撑的概率、倍数和估值区间；量化投资判断需要管理层数据。
