      - number: '3.2'
        title: 能力差异化与商业证明
        blocks:
          - type: paragraph
            body: >-
              报道中 Sudo 最突出的差异点，是其声称仅用仿真训练的模型在一次时间长、对象多变的抓取测试中取得约 98% 的首次成功率。ICRA
              演示进一步表明，系统能够处理随机摆放的物体，硬件则将两条七自由度机械臂与夹爪内置摄像头集成在一起。这些观察有价值，但并不是与 Unitree、Agility、UBTECH、Kepler 或 Siasun
              进行的受控正面对比基准。公开商业证据反而指向另一方向：Agility 披露了运行地点和订单，UBTECH 披露了订单和交付。因此，定位图将公开证明与声称的操控广度分开评分，也不把任一轴线当作工程基准。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
