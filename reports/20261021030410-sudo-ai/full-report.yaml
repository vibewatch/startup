              - CM007
              - CM008
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and route to adoption
        blocks:
          - type: paragraph
            body: >-
              The clearest near-term route is developer- and integrator-led. LeiFeng reported that Sudo AI was opening
              software capabilities to developers while partners built applications for specific scenarios. QbitAI
              reported joint development with CATL across battery-production and logistics workflows, while an
              investor-issued account named industrial sorting and warehouse depalletizing as target uses. These reports
              establish candidate users and workflows, but none identifies procurement authority, contract values, paid
              production deployments, or recurring budget ownership. A useful adjacent benchmark is Unitree: The Robot
              Report says its systems start at US$16,000 and have traction in education, research and development, and
              facilities inspection. That evidence suggests early budgets can sit outside core factory automation, but
              it does not establish Sudo AI pricing or reachable demand.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is helped by China's large automation base, rising domestic-supplier penetration, policy support
              for embodied intelligence, and manufacturer interest in flexible handling. Sudo AI's pure-simulation
              proposition could reduce task-specific data collection and customer data exposure if it survives
              production conditions. The counterweight is timing and proof: IFR characterizes current real-world
              humanoid capability as demonstrations or pilots, expects traditional industrial robots to remain the
              manufacturing backbone, and places broad humanoid commercialization toward the end of China's 2026-2030
              plan. TrendForce expects the industry's focus to shift toward tangible user value in the second half of
              2026, underscoring that technical demonstrations do not yet equal scaled demand. Valuation should
              therefore be anchored to verified deployments, utilization, pricing, integration cost, and repeat orders,
              not broad market forecasts or financing enthusiasm.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A broad headline TAM is not decision-grade
            body: >-
              The retained evidence places two 2030 humanoid-market forecasts at roughly US$4 billion and above US$5
              trillion. Without original methodologies or a Sudo-specific bottom-up bridge, neither value should anchor
              valuation.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
          - type: callout
            title: The near-term wedge is partner-led
            body: >-
              Public reporting points to developer software, application partners, and joint development in industrial
              workflows; it does not establish a repeatable direct-sales engine or disclosed budget owner.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              The competitive set spans more than manipulation-model startups. Unitree is building a broad humanoid,
              quadruped, and components portfolio while pursuing a capital-intensive public-market path; Agility
              Robotics has Digit operating at nine customer sites; and UBTECH reports sizeable Walker orders and initial
              industrial deliveries. Kepler and Siasun add further Chinese industrial-robot alternatives, while
              manufacturers can still rely on internal integration, fixed automation, or manual workflows. Sudo occupies
              a narrower position: a dual-arm research system and software capability offered primarily through
              developers and partners. With more than 150 humanoid-robot companies reported in China and current policy
              attention on smart manufacturing, likely entrants and adjacent hardware vendors are a continuing pressure
              rather than a remote scenario.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
