        title: Financing and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Sudo AI's financing record is substantial but fragmented across reports with different dates and scopes.
              LeiPhone reports a 2024 seed financing and multiple rounds during 2025. April 2026 coverage reported a
              valuation above US$2 billion and named Alibaba, Tencent, CATL, GL Ventures, and IDG among investors. A
              later October report described a separate round exceeding RMB1 billion, led by Futeng Capital, the
              Shanghai Guotou Xian-dao Fund, and Guotai Haitong, but explicitly said no post-money valuation was
              disclosed. The latest round amount therefore must not be treated as total capital raised, and the April
              valuation should not be presented as a confirmed October valuation. The cap table, dilution, liquidation
              preferences, debt, secondaries, and cumulative funding remain unavailable in the retained evidence.
