chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Shanghai Sudo Technology Co., Ltd., operating as Sudo AI, was incorporated on May 19, 2025 and is
              registered in Shanghai's Yangpu District. Its initial product is Sudo R1, an integrated
              hardware-and-software robot system built around object picking and a manipulation-centric foundation
              model. The company presents picking as the gateway primitive for broader physical manipulation and says
              the model is trained entirely in simulation. Reporting from the ICRA demonstration adds a near-term route
              to market: Sudo AI was primarily opening software capabilities to developers while partners built
              applications for specific settings. That evidence supports a platform-plus-system positioning, but it does
              not establish current pricing, recognized revenue, shipment volume, or the mix between software, hardware,
              and integration income.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO012
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership record combines serial entrepreneurship with academic and industrial robotics
              expertise. Han Zheng is identified as co-founder and chief executive, while Hao Su is identified as chief
              technology adviser. Independent profiles describe Han's prior company-building and exits and Su's work in
              3D vision, simulation, and robotics benchmarks. This pairing is relevant founder-market fit for a
              simulation-first robotics company, but it also concentrates the visible strategic narrative around two
              people. The available pool does not disclose a complete executive roster, board composition, voting
              rights, investor consent rights, or succession arrangements. Those omissions prevent a firm judgment on
              governance quality and make key-person dependence a diligence issue rather than a quantified conclusion.
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
