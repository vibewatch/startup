              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: Capability differentiation versus commercial proof
        blocks:
          - type: paragraph
            body: >-
              Sudo's strongest reported point of difference is the claim that a simulation-only model achieved about 98%
              first-attempt success during a long, varied grasping test. The ICRA demonstration adds evidence that the
              system can handle randomly placed objects and that the hardware integrates dual seven-degree-of-freedom
              arms with cameras in the grippers. Those observations are useful, but they are not a controlled
              head-to-head benchmark against Unitree, Agility, UBTECH, Kepler, or Siasun. The public commercial evidence
              runs in the opposite direction: Agility discloses sites and orders, while UBTECH discloses orders and
              deliveries. The positioning map therefore scores public proof separately from claimed manipulation breadth
              and does not convert either axis into an engineering benchmark.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
