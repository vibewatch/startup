              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Pricing, distribution, and switching economics
        blocks:
          - type: paragraph
            body: >-
              An apples-to-apples price comparison is not currently possible. Sudo has not published a product
              configuration, commercial price, customer-availability policy, or shipment terms; the retained competitor
              sources likewise provide financing, order, or capacity figures rather than unit prices and contract
              structures. Those quantities must not be treated as price, revenue, or installed-base substitutes. Sudo's
              reported developer-first, partner-delivered model could broaden reach, but it also gives integrators
              influence over application quality, customer ownership, and switching. No retained source discloses SDK
              terms, interoperability, service-level commitments, data portability, integration cost, or realized
              discounts. The resulting uncertainty prevents a supported conclusion about lock-in, multi-homing, or
              whether Sudo can underprice vertically integrated competitors.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP007
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Sudo's simulation-led approach could reduce dependence on expensive real-robot data and make adaptation
              faster, but the evidence does not establish exclusive data, proprietary supply, protected distribution, or
              durable customer switching costs. Sector-wide constraints also remain material: the retained industry
              report cites short operating endurance, high system costs, dexterity limits, and the need to find
              repeatable use cases. Those constraints can delay Sudo, while incumbents with manufacturing scale and
              customer deployments continue to improve. The key adverse case is commoditization: if hardware vendors or
              integrators reproduce adequate simulation-to-real performance, Sudo's model advantage may become a feature
              inside a broader platform. The moat should therefore be underwritten only after independent benchmark,
              paid-deployment, retention, and integration evidence is produced.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical promise is not yet a distribution moat
            body: >-
              Sudo needs independent benchmark replication, paid production deployments, transparent integration terms,
              and retention evidence before its simulation advantage can be treated as durable against
              better-capitalized robot manufacturers and integrator-led substitutes.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
              - CP010
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible only in outline
        blocks:
          - type: paragraph
            body: >-
              Public reporting points to an enterprise model in which Sudo AI exposes software capabilities, system
              interfaces, and developer tools while partners build applications for particular industrial settings. That
              supports several possible revenue streams: software or model access, robot-system sales or leases,
              integration, and recurring support. None is accompanied by a list price, fee schedule, contract term,
              realized price, or revenue-recognition policy. The distinction matters because a platform license could
              carry materially different gross-margin and working-capital characteristics from a
              hardware-plus-integration project. Current evidence supports the delivery architecture, not a proven
              monetization mix, and no retained source identifies a paid production customer or disclosed contract
              value.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
