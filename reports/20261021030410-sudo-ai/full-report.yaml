      - number: '1.4'
        title: Milestones and proof boundary
        blocks:
          - type: paragraph
            body: >-
              The company moved from incorporation to a public product reveal and international demonstration in roughly
              one year. Sudo AI reports about 98% first-attempt picking success and nearly 100% success within two
              attempts in its 60-minute evaluation, using no real-world demonstrations for training. The timeline is
              notable for speed, yet the evidence boundary matters: Korthos characterizes the test as company-published
              rather than an independent benchmark and says the results have not been validated in production
              environments. LeiPhone's ICRA account confirms a live public demonstration across varied objects, but it
              does not close the production-validation gap. The October financing report says capital is intended partly
              for real industrial validation, reinforcing that scaled, third-party-verified deployment is still a
              forward diligence milestone rather than an established operating fact.
