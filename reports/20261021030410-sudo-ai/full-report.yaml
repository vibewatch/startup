  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is not the entire robotics market. Sudo AI's stated wedge is simulation-trained
              manipulation that transfers directly to hardware, while investor and industry reporting identify
              industrial sorting, depalletizing, battery production, and logistics as candidate workflows. This includes
              manipulation software, controls, developer tooling, integration, and the hardware needed to execute
              variable-object tasks. It excludes unrelated mobile robots, robot components sold without a manipulation
              system, and general consumer robotics. The principal status-quo substitute is fixed, task-specific
              industrial automation: IFR says these systems remain faster and more reliable for repetitive,
              millimetre-precision work. Sudo therefore competes first where variability and changeover costs matter
              enough to offset the maturity of incumbent automation, not wherever a robot could theoretically be used.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Sizing through multiple constrained lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports boundary indicators rather than a company-addressable revenue estimate. IFR
              reports an installed base of roughly two million industrial robots in China, 54% of worldwide annual
              installations, and a rise in local suppliers' domestic installation share from 30% in 2020 to 57% in 2024.
              TrendForce separately forecasts Chinese humanoid output growth of as much as 94% in 2026 and nearly 80%
              shipment concentration in Unitree and AgiBot. These measures describe installed stock, annual installation
              share, supplier share, output growth, and shipment concentration; they are not interchangeable with spend
              or Sudo AI revenue. The Robot Report's juxtaposition of a greater-than-US$5 trillion and roughly US$4
              billion 2030 humanoid-market forecast illustrates why a broad headline TAM would be misleading without
              original methodologies and consistent category definitions.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
