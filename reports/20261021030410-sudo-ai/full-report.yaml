  - id: FE001
    title: Reported Sudo R1 product architecture
    type: stack
    summary: >-
      A conceptual stack from simulation inputs to partner-delivered applications, with unverified implementation
      boundaries.
    data:
      layers:
        - label: Simulation and task environments
          detail: >-
            High-fidelity virtual environments and synthetic interaction data are reported as the primary training
            substrate.
          items:
            - simulated scenes
            - object variation
            - physics and dynamics
        - label: Foundation-model training core
          detail: >-
            Published accounts describe a manipulation foundation model combining world-model concepts and reinforcement
            learning.
          items:
            - world model
            - reinforcement learning
            - generalized manipulation policy
        - label: Perception
          detail: >-
            The public embodiment is reported to use visual perception, including multiple cameras integrated into the
            grippers.
          items:
            - updated observations
            - object perception
            - placement-space awareness
        - label: Closed-loop control
          detail: Korthos reports action updates at 15-25 Hz with obstacle awareness and trajectory adaptation.
          items:
            - action updates
            - obstacle awareness
            - trajectory adaptation
        - label: Robot embodiment
          detail: The ICRA system was described as dual-arm, with seven degrees of freedom per arm.
          items:
            - dual arms
            - seven degrees of freedom per arm
            - grippers
        - label: Developer and industrial applications
          detail: >-
            Software capabilities are reported as developer-facing, with partners adapting the system to manufacturing
            and logistics scenarios.
          items:
            - developer tools
            - partner integration
            - industrial applications
    approximationNotes: Conceptual ordering only; no source discloses a complete implementation diagram or verified interface boundaries.
