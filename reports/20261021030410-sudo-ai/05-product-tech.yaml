callouts:
  - calloutType: "risk"
    title: "Demo success is not a reliability distribution"
    body: >-
      The reported grasping results do not disclose task weighting, intervention
      rules, cycle time, failure recovery, endurance, or customer acceptance criteria.
      Production-readiness underwriting therefore requires raw test logs and
      independent trials rather than extrapolation from the public video.
    claimRefs: [CE004, CE005, CE013, CE016]
