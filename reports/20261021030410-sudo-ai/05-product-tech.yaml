company:
  name: "Sudo AI"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Sudo R1 is presented as an integrated manipulation system spanning proprietary
    hardware, software, simulation, a foundation model, perception, and closed-loop
    control. Public demonstrations and event reporting support technical promise, but
    the evidence remains materially short of independent production reliability,
    security, safety, and quality validation.
sections:
  - id: "product-and-workflow"
    title: "Product definition and user workflow"
    body: >-
      Sudo R1 is described as an integrated robotic system rather than a stand-alone
      model: the public product boundary combines robot hardware, software, and a
      manipulation-focused foundation model. The intended workflow replaces repeated
      site-specific demonstration collection with simulation-led training and
      zero-shot deployment to unseen objects and environments. QbitAI reported about
      98% first-attempt success and nearly 100% success within two attempts in a
      60-minute, 200-plus-grasp company demonstration. Those figures describe a
      staged test, not a production service level. At ICRA 2026, Leiphone separately
      reported successful grabs of randomly placed objects with different materials
      and forms, which adds firsthand event evidence but still does not establish
      sustained industrial throughput or failure rates.
    claimRefs: [CE001, CE002, CE004, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-maturity"
    title: "Architecture and technical maturity"
    body: >-
      The reported architecture begins with simulated environments and synthetic
      interaction data, then combines a world-model approach with reinforcement
      learning, perception, and closed-loop control on the robot. Korthos reports
      that R1 updates actions from observations at 15-25 Hz while reasoning about
      obstacles and placement space. Leiphone described a dual-arm embodiment with
      seven degrees of freedom per arm and cameras integrated into the grippers.
      These accounts are consistent enough to outline the stack, but they do not
      expose model size, simulator fidelity, training compute, component suppliers,
      latency distribution, safety interlocks, or hardware endurance. The result is
      a credible public prototype architecture whose implementation boundaries and
      production maturity remain only partially observable.
    claimRefs: [CE002, CE003, CE007, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "deployment-and-differentiation"
    title: "Deployment model and differentiation"
    body: >-
      The clearest differentiation thesis is that simulation-heavy training can
      reduce dependence on teleoperation, manual labeling, and repeated collection
      of customer-site data. Leiphone reports that Sudo currently exposes software
      capabilities mainly to developers, with partners building scenario-specific
      applications. An investor-issued release syndicated by Sina says the company
      is building domestic and international developer centers, opening models and
      tools, and supporting industrial manufacturing and logistics customers in
      secondary development. This is a platform-oriented route to market, but no
      reviewed source provides public API documentation, release history, package
      activity, integration specifications, named production uptime, or support
      commitments. A Stanford project independently demonstrates that sim-to-real
      reinforcement learning can work for manipulation, while also illustrating
      that published methods usually disclose task-level results and failure rates
      that Sudo has not yet released.
    claimRefs: [CE008, CE009, CE010, CE012]
  - id: "reliability-trust-and-risks"
    title: "Reliability, trust, and technical risks"
    body: >-
      The central technical risk is the gap between a successful controlled
      demonstration and repeatable production operation. TechCrunch reports that
      synthetic data is widely used because robot training data are scarce, while
      real-world collection remains essential and robotics software still trails
      hardware reliability. It also frames durable adoption around stable,
      repeatable value rather than one-off showcases. TrendForce similarly expects
      the sector's focus to move toward tangible user value as commercialization
      accelerates. Sudo therefore still needs task-stratified success rates,
      intervention frequency, cycle time, mean time between failures, environmental
      limits, and independent customer acceptance tests. The assigned evidence does
      not establish formal safety certification, cybersecurity controls, privacy
      governance, uptime targets, incident history, or a quality-management system;
      each should remain a diligence gap rather than be inferred from the claim that
      local data collection is unnecessary.
    claimRefs: [CE013, CE014, CE015, CE016]
