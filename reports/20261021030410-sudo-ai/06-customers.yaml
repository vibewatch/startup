            - Contract and unit economics
        - id: expansion
          label: Renewal and expansion
          stage: Durability
          detail: No retention, renewal, cross-site expansion, or concentration metric is disclosed.
          value: Not disclosed
          touchpoints:
            - Renewal and NRR
            - Multi-site replication
    approximationNotes: >-
      This is an evidence-status journey, not an observed cohort or conversion funnel; stage order
