      missingEvidence: >-
        Customer-signed references, contracts, purchase orders, production acceptance records, or
        deployment telemetry identifying stage, sites, units, duration, and measurable outcomes.
      whyItMatters: >-
        Without customer-side proof, joint development and target use cases cannot establish paid
        production adoption or repeatable demand.
      diligencePath: >-
        Request a complete customer roster under NDA, select the largest and newest deployments,
        and conduct reference calls with operations, procurement, and finance contacts.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
