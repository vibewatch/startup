        - Sorting, picking, and depalletizing
        - Target use cases described by an investor; no named operator retained
        - Labor flexibility and lower scenario-specific data collection
        - Throughput, uptime, integration cost, and customer outcome unverified
      - - Robotics developers and system integrators
