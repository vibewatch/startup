company:
  name: Sudo AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows an early commercialization motion built around developers, integration
    partners, and industrial use cases, with one reported named relationship involving CATL.
    It does not establish paid production deployments, customer count, retention, contract value,
    or concentration, so commercial durability remains unverified.
sections:
  - id: customer-segments-and-buying-motion
    title: Customer segments and buying motion
    body: >-
      Sudo AI's visible customer surface is oriented toward industrial manufacturers,
      warehouse and logistics operators, and the developers or integrators that adapt robot
      software to specific workflows. LeiPhone reported that the company was opening software
      capabilities to developers while partners built scenario applications, which points to an
      ecosystem-assisted route to market rather than a fully disclosed direct-sales motion.
      An investor-issued Hengdian Capital article described industrial sorting and warehouse
      depalletizing as target applications and claimed that deployment could avoid collecting
      sensitive customer production data; these are relevant buying propositions, but they are
      not independent evidence of purchase or production use. Current hiring adds directional
      support: the official careers page listed major-account, supermarket-robot incubation, and
      data-scenario ecosystem roles. The buyer, user, and payer nevertheless remain inferred by
      workflow because no public pricing, contract, or procurement record was retained.
    claimRefs: [CU003, CU004, CU006, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-evidence
    title: Adoption evidence is still pre-scale
    body: >-
      The strongest company-specific commercial evidence is QbitAI's report that Sudo AI and
      CATL were conducting joint development across battery-manufacturing and logistics
      scenarios. The article does not identify whether this work is paid, a pilot, a proof of
      concept, or a production deployment, and the source attributes the information to unnamed
      market contacts. LeiPhone separately documented a public ICRA 2026 demonstration and said
      human participants randomly placed the objects, but an exhibition demonstration measures
      technical behavior rather than customer adoption. The official careers page displayed 96
      open positions, including commercialization-adjacent roles, yet vacancies are an operating
      signal rather than a customer or revenue denominator. No retained source supplied active
      account counts, deployed robot counts, locations, utilization, repeat purchases, or a
      time-series adoption metric for Sudo AI.
    claimRefs: [CU002, CU005, CU007, CU015, CU016]
    tableRefs: [TU002]
  - id: proof-quality-and-durability
    title: Named proof, durability, and concentration
    body: >-
      The retained public record supports only one named company-linked industrial validation
      relationship: CATL. Other references are either unnamed partners, investor commentary,
      target use cases, or broader industry demand signals. This distinction matters because a
      logo, investor relationship, joint-development statement, and paid production contract
      imply very different revenue quality. No retained source reports NRR, GRR, churn, renewal
      rates, contract length, customer satisfaction, top-customer share, or channel economics.
      As a result, expansion and concentration cannot be quantified. Gartner's January 2026
      forecast is an adverse benchmark for the category: it expected fewer than 20 companies to
      put humanoid robots live in supply-chain and manufacturing production by 2028 and cited
      integration complexity, high costs, lower throughput, and lower uptime as barriers.
      Sudo AI must therefore be underwritten as an unverified pilot-to-production conversion
      story until customer-signed evidence closes these gaps.
    claimRefs: [CU009, CU010, CU014, CU015]
    tableRefs: [TU003]
  - id: expansion-path-and-diligence
    title: Expansion path and diligence implications
    body: >-
      The plausible expansion loop is developer evaluation, application integration, a bounded
      joint-development or pilot phase, production procurement, and then replication across
      workstations or sites. Sudo AI has public signals for the first four steps, but none proves
      the final two. QbitAI reported that the company planned system interfaces and developer
      tools, while the official hiring page showed ecosystem and major-account roles; together
      these suggest that integration support and partner enablement are intended to bridge
      technical evaluation to commercial deployment. Market conditions do not remove company-
      specific execution risk. TrendForce projected rapid Chinese humanoid output growth and
      concentrated shipments among two established leaders, while Xinhua described a large,
      partnership-seeking robotics exhibition ecosystem. The investment case therefore needs
      customer-signed evidence of stage, economics, and repeatability rather than substituting
      category momentum for Sudo AI adoption.
    claimRefs: [CU001, CU003, CU008, CU011, CU012, CU013]
