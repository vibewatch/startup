        - Controlled pilot for high-variance manipulation
        - Gartner identifies high-risk-appetite companies as the near-term archetype
        - Early design-partner feedback
        - Market archetype only; not proof of a Sudo AI customer
    notes: >-
      Segments are an evidence-based analytical classification, not a disclosed customer roster;
      public scale signals distinguish named reports from target use cases and market archetypes.
