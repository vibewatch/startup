  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Full cap table, round size, security type, liquidation preferences, anti-dilution
        rights, debt, investor ownership, board rights, and use-of-proceeds.
      whyItMatters: >-
        Headline valuation does not reveal effective entry price, dilution, downside priority,
        governance control, or common-equity return potential.
      diligencePath: >-
        Obtain executed financing documents, the fully diluted capitalization table, debt
        schedule, option pool, side letters, and a pro forma ownership waterfall.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: commercial-disclosure
      missingEvidence: >-
        Audited or management financials, revenue quality, paid-customer count, signed contract
        value, backlog conversion, gross margin, burn, runway, and unit economics.
      whyItMatters: >-
        Numeric valuation, return, dilution, and scenario probabilities cannot be underwritten
        without a measured operating base and capital-needs forecast.
      diligencePath: >-
        Review monthly financial statements, bank records, customer contracts, invoices,
        deployment cohorts, bill of materials, service costs, and a board-approved forecast.
      relatedQuestionRefs: [QV002, QV005, QV007, QV008]
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: >-
        Independent customer-side task success, uptime, intervention rate, safety events,
        cycle time, and performance across materially different production environments.
      whyItMatters: >-
        A controlled public demonstration cannot establish scalable reliability, labor
        substitution, deployment cost, or repeatable customer value.
      diligencePath: >-
        Commission witnessed tests at named customer sites with fixed protocols, raw logs,
        failure taxonomies, baseline comparisons, and repeat testing over production shifts.
      relatedQuestionRefs: [QV003, QV006]
    - type: access-blocked
      severity: minor
      topic: source-access-gap
      missingEvidence: >-
        The assigned Tencent News URL returned an application-download landing page rather
        than the article body needed to evaluate its financing assertions.
      whyItMatters: >-
        The inaccessible article cannot be used to corroborate financing amount, valuation,
        investor, or commercialization claims.
      diligencePath: >-
        Obtain the original publisher text or a preserved issuer copy in a future authorized
        source-discovery run and compare its assertions with financing documents.
      relatedQuestionRefs: [QV001]
