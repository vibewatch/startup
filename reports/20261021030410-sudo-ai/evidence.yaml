evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue, revenue run-rate, gross margin, burn, runway, customer count, shipment volume, headcount, and
      operating-site data.
    whyItMatters: >-
      Without operating metrics, financing momentum and technical demonstrations cannot be translated into commercial
      scale or capital efficiency.
    diligencePath: >-
      Request audited financials, a monthly management pack, payroll roster, customer and shipment ledger, and site list
      through the data room.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board composition, cap table, voting controls, investor consent rights, liquidation preferences, debt,
      secondaries, and succession plan.
    whyItMatters: >-
      The visible leadership is concentrated and the economic and control implications of repeated financings cannot be
      assessed from public reporting.
    diligencePath: >-
      Obtain the charter, shareholder register, financing documents, board minutes, option pool schedule, and key-person
      succession plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A current, complete executive and board roster with responsibilities, start dates, employment status, and decision
      rights.
    whyItMatters: Two visible leaders do not establish full functional coverage or reveal management gaps.
    diligencePath: Request an organization chart, executive biographies, board observer list, and reporting-line map.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: A complete investor list with check sizes, ownership percentages, instruments, and governance rights by round.
    whyItMatters: Public name lists do not establish ownership concentration, dilution, or strategic obligations.
    diligencePath: Reconcile the shareholder register and financing closing sets against the public investor list.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: production-validation
    missingEvidence: >-
      Independent, task-level production results across customer sites, shifts, object distributions, failure modes, and
      safety incidents.
    whyItMatters: >-
      Company-run demonstrations cannot establish sustained reliability, deployment economics, or safe operation in
      production.
    diligencePath: >-
      Arrange reference calls and review timestamped deployment logs, intervention rates, incident records, and
      third-party acceptance tests.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: company-specific-sizing
    missingEvidence: >-
      Sudo AI pricing, signed contract values, qualified pipeline, reachable account count, deployment utilization, and
      renewal or expansion data.
    whyItMatters: >-
      Without these denominators, broad robot-industry indicators cannot be converted into a defensible company-specific
      SAM, SOM, or revenue adoption curve.
    diligencePath: >-
      Obtain a management pipeline export, pricing sheets, signed order forms, deployment-level utilization, and
      customer reference calls, then build a bottom-up site and workflow model.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: forecast-conflict
    missingEvidence: >-
      Original definitions, geography, unit assumptions, price assumptions, and adoption curves behind the retained 2030
      humanoid-market forecasts.
    whyItMatters: >-
      The secondary forecasts differ by more than three orders of magnitude and cannot support valuation without
      reconciling their categories and methods.
    diligencePath: >-
      Acquire the original forecast reports and normalize category, geography, units, price, and deployment assumptions
      before using either estimate.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercial-adoption
    missingEvidence: >-
      Named paid production deployments, procurement owners, integration timelines, realized ROI, failure rates, and
      repeat orders for Sudo AI.
    whyItMatters: >-
      Public demonstrations, partner statements, and reported joint development do not establish repeatable production
      demand or budget ownership.
    diligencePath: >-
      Request named customer references, production acceptance records, paid invoices, integration logs, and
      cohort-level expansion evidence.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable vendor quotes covering hardware, software, integration, support, discounts, uptime commitments, and
      contract duration for a defined workflow.
    whyItMatters: Without common units and scope, buyer ROI and relative price-performance cannot be assessed.
    diligencePath: >-
      Obtain three matched proposals for the same site, task, throughput, safety, and support requirements, then
      reconcile one-time and recurring costs.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-and-lock-in
