  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: "Audited revenue, revenue run-rate, gross margin, burn, runway, customer count, shipment volume, headcount, and operating-site data."
      whyItMatters: "Without operating metrics, financing momentum and technical demonstrations cannot be translated into commercial scale or capital efficiency."
      diligencePath: "Request audited financials, a monthly management pack, payroll roster, customer and shipment ledger, and site list through the data room."
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Complete board composition, cap table, voting controls, investor consent rights, liquidation preferences, debt, secondaries, and succession plan."
      whyItMatters: "The visible leadership is concentrated and the economic and control implications of repeated financings cannot be assessed from public reporting."
      diligencePath: "Obtain the charter, shareholder register, financing documents, board minutes, option pool schedule, and key-person succession plan."
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO002, TO003]
    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: "A current, complete executive and board roster with responsibilities, start dates, employment status, and decision rights."
      whyItMatters: "Two visible leaders do not establish full functional coverage or reveal management gaps."
      diligencePath: "Request an organization chart, executive biographies, board observer list, and reporting-line map."
      relatedQuestionRefs: [QO003, QO009]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: investors
      missingEvidence: "A complete investor list with check sizes, ownership percentages, instruments, and governance rights by round."
      whyItMatters: "Public name lists do not establish ownership concentration, dilution, or strategic obligations."
      diligencePath: "Reconcile the shareholder register and financing closing sets against the public investor list."
      relatedQuestionRefs: [QO004, QO005, QO009]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: production-validation
      missingEvidence: "Independent, task-level production results across customer sites, shifts, object distributions, failure modes, and safety incidents."
      whyItMatters: "Company-run demonstrations cannot establish sustained reliability, deployment economics, or safe operation in production."
      diligencePath: "Arrange reference calls and review timestamped deployment logs, intervention rates, incident records, and third-party acceptance tests."
      relatedQuestionRefs: [QO008]
