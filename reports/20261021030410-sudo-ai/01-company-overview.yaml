company:
  name: Sudo AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Sudo AI is a Shanghai embodied-AI company incorporated in May 2025 and centered on
    simulation-trained robotic manipulation through its Sudo R1 system. Public evidence supports
    strong financing momentum and a technically experienced leadership team, but valuation reports
    remain secondary, production validation is not independent, and core operating metrics are undisclosed.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: >-
      Shanghai Sudo Technology Co., Ltd., operating as Sudo AI, was incorporated on May 19, 2025
      and is registered in Shanghai's Yangpu District. Its initial product is Sudo R1, an integrated
      hardware-and-software robot system built around object picking and a manipulation-centric
      foundation model. The company presents picking as the gateway primitive for broader physical
      manipulation and says the model is trained entirely in simulation. Reporting from the ICRA
      demonstration adds a near-term route to market: Sudo AI was primarily opening software
      capabilities to developers while partners built applications for specific settings. That evidence
      supports a platform-plus-system positioning, but it does not establish current pricing, recognized
      revenue, shipment volume, or the mix between software, hardware, and integration income.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The public leadership record combines serial entrepreneurship with academic and industrial
      robotics expertise. Han Zheng is identified as co-founder and chief executive, while Hao Su is
      identified as chief technology adviser. Independent profiles describe Han's prior company-building
      and exits and Su's work in 3D vision, simulation, and robotics benchmarks. This pairing is relevant
      founder-market fit for a simulation-first robotics company, but it also concentrates the visible
      strategic narrative around two people. The available pool does not disclose a complete executive
      roster, board composition, voting rights, investor consent rights, or succession arrangements.
      Those omissions prevent a firm judgment on governance quality and make key-person dependence a
      diligence issue rather than a quantified conclusion.
    claimRefs: [CO005, CO006]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing and stakeholders
    body: >-
      Sudo AI's financing record is substantial but fragmented across reports with different dates and
      scopes. LeiPhone reports a 2024 seed financing and multiple rounds during 2025. April 2026 coverage
      reported a valuation above US$2 billion and named Alibaba, Tencent, CATL, GL Ventures, and IDG
      among investors. A later October report described a separate round exceeding RMB1 billion, led by
      Futeng Capital, the Shanghai Guotou Xian-dao Fund, and Guotai Haitong, but explicitly said no
      post-money valuation was disclosed. The latest round amount therefore must not be treated as total
      capital raised, and the April valuation should not be presented as a confirmed October valuation.
      The cap table, dilution, liquidation preferences, debt, secondaries, and cumulative funding remain
      unavailable in the retained evidence.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO016]
    tableRefs: [TO003]
  - id: milestones-and-proof-boundary
    title: Milestones and proof boundary
    body: >-
      The company moved from incorporation to a public product reveal and international demonstration in
      roughly one year. Sudo AI reports about 98% first-attempt picking success and nearly 100% success
      within two attempts in its 60-minute evaluation, using no real-world demonstrations for training.
      The timeline is notable for speed, yet the evidence boundary matters: Korthos characterizes the
      test as company-published rather than an independent benchmark and says the results have not been
      validated in production environments. LeiPhone's ICRA account confirms a live public demonstration
      across varied objects, but it does not close the production-validation gap. The October financing
      report says capital is intended partly for real industrial validation, reinforcing that scaled,
      third-party-verified deployment is still a forward diligence milestone rather than an established
      operating fact.
    claimRefs: [CO003, CO009, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
