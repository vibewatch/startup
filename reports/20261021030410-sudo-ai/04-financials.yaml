    notes: "Mechanisms are evidence-based possibilities, not confirmed revenue lines; every price, mix, and contract term remains undisclosed."
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, List price, Realized price, Contract model, Discounts or unknowns, Underwriting implication]
    rows:
      - ["Developer software access", null, null, "Not publicly disclosed", "Usage metric, minimum commitment, and renewal terms unknown", "Cannot model recurring software revenue"]
      - ["Sudo R1 robot system", null, null, "Sale, lease, or bundled deployment unknown", "Hardware, warranty, and financing components unknown", "Cannot separate product from financing revenue"]
      - ["Application integration", null, null, "Partner or project economics unknown", "Channel take rate and implementation scope unknown", "Cannot estimate services mix or contribution margin"]
      - ["Ongoing support", null, null, "Subscription or SLA structure unknown", "Support intensity and failure obligations unknown", "Cannot estimate retention or service-delivery cost"]
    notes: "Null means no value was disclosed in the retained public sources; it does not mean zero price or zero revenue."
    claimRefs: [CI003, CI004, CI007, CI010]
  - id: TI003
    title: Unit economics and capital adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - ["Revenue / ARR", null, "Unavailable", "Separates technical interest from paid adoption", "Monthly recognized revenue, ARR bridge, bookings, billings, and deferred revenue"]
      - ["Gross margin", null, "Unavailable", "Tests whether the model is software-like or project-and-hardware heavy", "Product, software, integration, and support gross margin by cohort"]
      - ["CAC and payback", null, "Unavailable", "Measures enterprise sales efficiency and financing need", "Fully loaded CAC, sales cycle, win rate, and gross-margin payback"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines next-round dependency", "Bank statements, monthly net burn, restricted cash, and downside runway"]
      - ["Deployment cost per site", null, "Unavailable", "Tests whether simulation savings survive integration and field support", "Installation labor, compute, validation, travel, and support hours per deployment"]
    notes: "All values are unavailable rather than estimated; comparative research provides only directional context, not Sudo AI-specific economics."
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
