callouts:
  - calloutType: risk
    title: Capital is not the same as runway
    body: >-
      A high reported valuation and prominent investors signal financing access, but
      without round proceeds, cash, burn, debt, and deployment economics they do not
      establish capital adequacy.
    claimRefs: [CI001, CI002, CI011]
