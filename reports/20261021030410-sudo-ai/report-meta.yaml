companyProfile:
  summary: >-
    Sudo AI is a Shanghai embodied-AI company incorporated in May 2025. Its Sudo R1 system combines robot hardware,
    software, simulation-led training, and a manipulation-focused foundation model. Public reporting shows rapid product
    and financing progress, while commercial scale, production reliability, governance, and operating economics remain
    largely undisclosed.
