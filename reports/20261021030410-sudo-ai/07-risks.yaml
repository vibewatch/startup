  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure / trigger
    rows:
      - - Demo performance fails to transfer to continuous production
        - Event demo plus reported 98% first-attempt grasping; no customer uptime series
        - High
        - High
        - Early
        - Stop if an independent customer trial misses agreed uptime, intervention, or cycle-time thresholds
      - - Pure-simulation training misses real manipulation edge cases
        - Industry analysis calls sim-to-real manipulation an open problem
        - Medium-high
        - High
        - Early
        - Require soft, reflective, deformable, and changing-environment stress tests with failure logs
      - - Integration quality varies by developer or application partner
        - LeiFeng reports partners build scenario applications on Sudo software
        - Medium
        - Medium-high
        - Early
        - Require named accountable integrators, acceptance criteria, support SLAs, and rollback procedures
      - - Manufacturing and field-support scale trails competitors
        - Competitor evidence includes deployments and a 10,000-unit rollout
        - Medium-high
        - High
        - Undisclosed
        - Stop if qualified suppliers, pilot build yield, service coverage, or spares plans remain unverified
    notes: >-
      Qualitative likelihood and severity are analyst assessments anchored to the cited demo,
      industry, and comparator evidence; Sudo has not published production failure-rate denominators.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Public evidence
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation / residual exposure
    rows:
      - - Application delivery
        - Unnamed developer and scenario partners
        - Partners reportedly build applications on Sudo software
        - Unknown
        - Integration failures prevent repeatable production deployment
        - High
        - Contract ownership, certification, support obligations, and partner redundancy are undisclosed
      - - Industrial validation
        - CATL
        - QbitAI reports joint development in manufacturing and logistics scenarios
        - Unknown
        - Development work does not convert into paid production volume
        - High
        - Obtain signed scope, stage, acceptance results, economics, and production decision timeline
      - - External capital
        - Strategic and financial investors
        - Partner-originated coverage reports valuation above US$2 billion
        - Unknown
        - Financing momentum obscures cash needs or weakens entry economics
        - High
        - Reconcile cash, burn, runway, preferences, board rights, and milestone-linked financing needs
      - - Components and production ramp
        - Unnamed suppliers and manufacturers
        - TrendForce attributes a rival's ramp to a standardized, dedicated supply chain
        - Unknown
        - Component scarcity, yield, or quality blocks field scale
        - High
        - Obtain BOM concentration, sole-source list, yield history, capacity reservations, and second-source plan
    notes: >-
      Public sources do not provide Sudo contract values, production volumes, supplier shares, or
      dependency denominators; all concentration entries therefore remain unknown.
    claimRefs: [CR002, CR010, CR012, CR013, CR014, CR015, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative comparison of the six most consequential residual risks after considering only
      publicly evidenced mitigations.
    data:
      columns:
        - id: impact
          label: Impact
          detail: Consequence for production readiness or investment outcome
        - id: likelihood
          label: Likelihood
          detail: Evidence-based qualitative likelihood; unknown where primary evidence is absent
        - id: mitigation
          label: Mitigation maturity
          detail: Strength of publicly verified mitigation
      rows:
        - label: Production reliability
          note: Demo evidence is not a field reliability distribution
          values: [High, High, Early]
        - label: Sim-to-real manipulation fidelity
          note: Independent analysis describes manipulation transfer as unresolved
          values: [High, Medium-high, Early]
        - label: Manufacturing and support scale
          note: Competitors show a materially higher public proof bar
          values: [High, Medium-high, Undisclosed]
        - label: Capital intensity
          note: Sudo burn and runway are not publicly disclosed
          values: [High, Medium, Undisclosed]
        - label: Partner-led deployment
          note: Application ownership and customer concentration are unknown
          values: [High, Medium, Early]
        - label: Legal, safety, and compliance
          note: No primary legal or certification source was assigned
          values: [High, Unknown, Undisclosed]
    approximationNotes: >-
      Categories are qualitative analyst judgments, not measured probabilities or benchmark scores;
      "Unknown" is preserved rather than converted to a numeric value.
    claimRefs: [CR003, CR005, CR006, CR008, CR009, CR011, CR012, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Investment kill criteria
    body: >-
      Do not advance if Sudo cannot provide an independently witnessed production trial with agreed
      reliability and safety thresholds, a reconciled burn/runway plan, primary legal and compliance
      evidence, and contract-level proof that reported industrial development has converted beyond
      an unpaid or exploratory pilot.
    claimRefs: [CR005, CR011, CR012, CR013, CR014, CR016]
