company:
  name: Sudo AI
chapter:
  number: 7
  title: Risks
  summary: >-
    Sudo AI's principal disclosed risk is the distance between a strong, mostly demo-based
    manipulation result and dependable production operation. The retained evidence also leaves
    company-specific safety, legal, financial, customer-concentration, and incident history
    unresolved, while better-scaled competitors set a demanding commercialization benchmark.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest residual risk is production reliability. Independent event reporting observed
      Sudo's robot handling varied, randomly placed objects, while QbitAI reported a roughly 98%
      first-attempt result and training without real-robot data. Those are meaningful technical
      signals, but they are not field uptime, safety, throughput, or repeatability evidence.
      Bessemer's industry analysis uses 99.9% as the production reliability threshold and calls
      sim-to-real manipulation an open research problem. Competitive scale is the next major
      exposure: TrendForce expects rapid Chinese output growth and unusually concentrated
      shipments among two leaders. Capital intensity ranks third because the closest public
      comparator disclosed sharply rising operating expense and substantial cash use before
      profitability. Legal and safety assurance remains high-impact but likelihood-unknown because
      the assigned evidence contains no Sudo-specific regulator, court, certification, recall, or
      incident record.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR008, CR009, CR012, CR013]
    figureRefs: [FR001]
  - id: operational-and-technical
    title: Operational, quality, and technical exposure
    body: >-
      Sudo's public proof is concentrated in controlled manipulation demonstrations. LeiFeng
      reported that the ICRA setup handled materials and shapes selected and placed by people at
      the event, but the same account said Sudo was primarily opening software capabilities to
      developers while partners built scenario applications. That delivery model adds integration,
      support, and partner-execution dependencies around the core model. The pure-simulation route
      may reduce data-collection cost and customer-data exposure, yet independent industry analysis
      warns that manipulation fidelity for soft objects, fabrics, and liquids is not solved. The
      diligence standard should therefore be sustained, independently observed performance in a
      customer environment, including intervention rate, cycle time, failure taxonomy, safety
      events, recovery behavior, and uptime rather than another curated success-rate demonstration.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: legal-regulatory-and-safety
    title: Legal, regulatory, and safety assurance
    body: >-
      The retained pool does not establish a Sudo-specific regulatory or legal posture. No assigned
      source is a regulator, court, patent office, safety certifier, sanctions authority, privacy
      auditor, or incident registry, so the absence of a reported event cannot be treated as proof
      that no event exists. The closest safety benchmark is Agility Robotics' reported adoption of
      NVIDIA's Halos safety system for barrier-free human proximity; it is a comparator, not
      evidence that Sudo meets the same standard. Sudo's zero-real-data training claim also does not
      establish deployed privacy controls. Before investment, counsel and technical diligence
      should verify product-safety standards, workplace integration obligations, data flows,
      intellectual-property ownership, export controls, insurance, litigation, and incident
      disclosure directly.
    claimRefs: [CR004, CR005, CR011]
    tableRefs: [TR001]
  - id: financial-partner-and-execution
    title: Financial, partner, and execution dependencies
    body: >-
      Public evidence does not disclose Sudo revenue, gross margin, burn, runway, working capital,
      warranty reserves, or signed order economics. A partner-originated release instead emphasizes
      a valuation above US$2 billion, while QbitAI reports joint development with CATL without
      publishing contract scope, production status, economics, or concentration. Comparator
      evidence shows why those distinctions matter: Agility's preliminary unaudited 2025 operating
      expense was about US$111 million and cash use about US$100 million, while more than US$300
      million of committed orders was explicitly not current-period revenue. Sudo's partner-led
      application model and undisclosed manufacturing plan should be tested for dependence on
      integrators, a small set of industrial partners, component suppliers, and continuing external
      capital. Investment approval should require a reconciled operating plan and named deployment
      evidence rather than infer commercial durability from financing participation.
    claimRefs: [CR002, CR010, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
