      - number: '5.2'
        title: Product Lines, Modules, and Enterprise Workflows
        blocks:
          - type: paragraph
            body: >-
              The Redpanda commercial product portfolio has evolved from an event streaming engine into a multi-tiered
              platform designed to operationalize enterprise data for human applications and autonomous AI agents. The
              platform is organized into three primary operational modules: the core Redpanda Streaming Data Platform,
              Redpanda Connect, and the Redpanda Agentic Data Plane (ADP). Redpanda Connect provides a visual pipeline
              composer and more than 300 pre-built connectors that bridge enterprise databases, SaaS applications, and
              data lakes into real-time streams with full change data capture (CDC) semantics and direct Apache Iceberg
              output. Building atop this connectivity layer, the Agentic Data Plane introduces an AI Gateway that acts
              as a centralized policy and routing hub between enterprise AI models, Model Context Protocol (MCP)
              servers, and private operational data. For analytical querying, Redpanda SQL brings PostgreSQL-compatible
              ad-hoc query capabilities directly inside customer environments. While third-party estimates indicate
              Redpanda achieved approximately $26.1 million in annual revenue as of 2025, commercial attach rates and
              standalone ARR contributions for the Agentic Data Plane remain undisclosed private metrics requiring
              direct diligence confirmation.
            claimRefs:
