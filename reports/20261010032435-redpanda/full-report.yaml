  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundary Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The event streaming and stream processing market encompasses infrastructure software and cloud services
              that ingest, persist, route, and transform continuous data feeds in real time. Redpanda defines its core
              commercial boundaries around high-throughput, low-latency log persistence and messaging, offering an
              API-compatible replacement for Apache Kafka that removes JVM operational overhead and ZooKeeper
              dependencies. Within this scope, included addressable spend covers enterprise streaming broker licenses,
              cloud-managed streaming clusters, Bring Your Own Cloud (BYOC) control planes, high-volume data connectors
              through Redpanda Connect, and emerging agentic data governance infrastructure. Conversely, adjacent spend
              categories—such as long-term analytical object storage, distributed query processing (e.g., Snowflake,
              BigQuery), and specialized operational databases—are excluded from core broker budgets, functioning
              instead as downstream ingestion endpoints. By cleanly separating the data plane in customer VPCs from the
              cloud control plane, Redpanda captures enterprise budgets prioritizing data sovereignty without requiring
              customer infrastructure teams to manage underlying distributed storage engines.
            claimRefs:
              - CM001
              - CM006
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM011
      - number: '2.2'
        title: Addressable Market Sizing, Growth Trajectories, and Disconnects
        blocks:
          - type: paragraph
            body: >-
              Market sizing for streaming infrastructure exhibits substantial divergence depending on whether
              researchers measure standalone software revenue or the broader ecosystem of managed deployment and
              consulting services. Independent market research from Dataintelo valued the global managed Redpanda
              services market at $612.4M in 2024, forecasting a 28.7% CAGR to reach approximately $4,961.2M by 2033.
              Similarly, Growth Market Reports estimated the 2025 market baseline at $529M, projecting expansion at a
              28.4% CAGR to $4,912M by 2034, with North America representing the largest regional demand center at $208M
              (39.3% share). However, these top-down figures conflate third-party systems integration, cloud hosting
              pass-through, and external professional services with Redpanda's pure proprietary software subscriptions.
              In contrast, technographic data from 6sense identified only 278 enterprise domains actively deploying
              Redpanda software in stream processing, corresponding to a modest 0.47% category market share (#13 rank)
              compared to incumbent platforms such as Apache Spark (57.50%) and Spark Streaming (8.92%). This disconnect
              highlights that while industry-wide tailwinds are robust, Redpanda's isolated software revenue represents
              a narrow slice of aggregate managed services spend.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM009
              - CM010
              - CM014
