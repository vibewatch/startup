      - number: '5.3'
        title: Technical Governance, Operating Infrastructure, and Reliability
        blocks:
          - type: paragraph
            body: >-
              As enterprises shift autonomous AI agents from experimental sandboxes into production workflows,
              infrastructure requirements transition from model capability to strict governance, safety, and operational
              control. Redpanda addresses this challenge through the Agentic Data Plane's dedicated trust and security
              infrastructure. Every agent, user, and service account is authenticated using OpenID Connect (OIDC)
              identity standards, enforcing granular authorization policies rather than relying on unrotated static API
              credentials. To govern agent tool execution, Redpanda introduced an industry-first Out-of-Band Policy
              Engine (OBPE) that intercepts requests at the MCP boundary, ensuring that autonomous agents cannot
              inspect, modify, or bypass organizational guardrails or spend ceilings. Complete operational
              explainability is maintained by emitting full-fidelity execution metrics, traces, and interaction
              transcripts using the OpenTelemetry Protocol (OTLP), enabling real-time auditing and instant kill-switch
              activation. However, deployment maturity remains geographically and architecturally bifurcated: while
              Redpanda SQL is generally available across both AWS and Google Cloud in customer VPCs, core Agentic Data
              Plane capabilities are currently limited to select design partners on AWS Bring Your Own Cloud, with
              multi-cloud and on-premises support deferred to future release cycles.
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE009
              - CE013
