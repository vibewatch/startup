        title: Exhibits
        blocks:
          - type: callout
            title: Agentic Autonomy Threshold and Kill-Switch Architecture
            body: >-
              Redpanda Agentic Data Plane isolates agent credentials and routes transactions above dollar thresholds to
              human approval, mitigating prompt injection risks but introducing latency and throughput overheads that
              lack production benchmark data.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: CNCF Governance and Rollback Rigor
            body: >-
              Independent DevSecOps reviews emphasize that Redpanda's CNCF Landscape listing carries no project maturity
              endorsement, requiring enterprise operators to maintain explicit verification of upgrade paths, persistent
              state backups, and rollback runbooks.
            calloutType: insight
            claimRefs:
