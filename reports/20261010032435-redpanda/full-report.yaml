  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Analysis
        blocks:
          - type: paragraph
            body: >-
              Redpanda faces expanding compliance and regulatory obligations as enterprise customers adopt its streaming
              engine and Agentic Data Plane across regulated environments. The European Union AI Act imposes strict
              governance, transparency, and risk management mandates on providers and deployers of high-risk AI
              architectures, elevating accountability from IT operations to board-level fiduciary risk. Redpanda
              distributes compliance frameworks and guidance analyzing provider versus deployer liabilities under EU
              mandates, but financial institutions operating under GLBA, GDPR, and FINRA standards confront steep
              regulatory hurdles when bridging legacy mainframe silos to real-time event brokers. Furthermore, while
              Redpanda is cataloged within the CNCF Landscape, third-party DevSecOps reviews confirm that inclusion does
              not constitute a regulatory or security certification, requiring diligence teams to verify software
              licensing boundaries under the Business Source License transition alongside audit compliance documentation
              under non-disclosure agreements.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
