        title: Named Customer Proof and Mission-Critical Workload Validation
        blocks:
          - type: paragraph
            body: >-
              Named enterprise customer deployments provide concrete technical verification that Redpanda can sustain
              production-scale throughput across demanding commercial environments. In the financial sector, the New
              York Stock Exchange (NYSE) runs Redpanda Self-Managed Enterprise to power NYSE Cloud Streaming, validating
              sub-millisecond data delivery where execution latency directly affects trading outcomes. Similarly,
              digital media platform LiveRamp deployed Redpanda Cloud Bring-Your-Own-Cloud (BYOC) to support
              high-throughput customer data collaboration while maintaining complete tenant data sovereignty and zero
              credential exposure. In the digital entertainment sector, online gaming platform Chess.com migrated to
              Redpanda BYOC to eliminate unpredictable billing overages and maintain cost predictability across volatile
              live match concurrency. These verified production references confirm that Redpanda has moved well beyond
              early developer experimentation into core transactional workflows, though public disclosures rarely reveal
              specific multi-year contract values or cluster node counts.
