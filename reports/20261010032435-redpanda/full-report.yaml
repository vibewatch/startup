      - number: '7.3'
        title: Platform, Cloud, and Ecosystem Dependencies
        blocks:
          - type: paragraph
            body: >-
              Redpanda maintains critical strategic and technical dependencies across cloud hyperscalers, frontier AI
              model providers, and open-source interface standards. While Redpanda provides self-managed software and
              Bring Your Own Cloud (BYOC) deployment models, customer success and managed cloud operations concentrate
              heavily on AWS, Google Cloud Platform, and Microsoft Azure infrastructure. In agentic workflows, the
              Agentic Data Plane mediates calls to external model providers such as OpenAI and Anthropic alongside Model
              Context Protocol (MCP) tool servers; breaking changes or outages in external model APIs directly degrade
              autonomous workflow execution. On the protocol layer, Redpanda relies on strict compatibility with Apache
              Kafka client APIs and community connectors. While its C++ architecture avoids Java Virtual Machine and
              ZooKeeper maintenance overheads, Redpanda must maintain flawless continuous compatibility with upstream
              Kafka protocol versions to avoid fracturing customer client ecosystems.
            claimRefs:
