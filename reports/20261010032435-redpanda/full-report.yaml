chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Redpanda (originally incorporated as Vectorized) was founded in January 2019 in San Francisco, California,
              by distributed systems engineer Alexander Gallego with the mission of engineering a modern streaming data
              platform. Designed as a drop-in replacement for Apache Kafka, Redpanda eliminated the operational
              complexity of JVM memory management and ZooKeeper dependencies by implementing a thread-per-core,
              hardware-aware architecture written entirely in C++. Over its commercial lifecycle, the company has
              broadened its core infrastructure footprint from high-throughput log streaming into a comprehensive
              Agentic Data Plane that provides centralized governance, AI observability, Model Context Protocol (MCP)
              tooling, and an integrated AI Gateway for enterprise AI agents. Redpanda monetizes its software through
              commercial enterprise subscriptions distributed across self-managed on-premises environments, fully
              managed cloud clusters on major hyperscalers, and Bring Your Own Cloud (BYOC) deployments that ensure
              strict enterprise data sovereignty.
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO012
