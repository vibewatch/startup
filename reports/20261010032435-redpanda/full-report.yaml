      - number: '2.3'
        title: Buyer Persona Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics for streaming data infrastructure vary significantly by organizational scale and
              technical maturity. In large enterprise environments, the economic buyer is typically the VP of
              Infrastructure, Head of Platform Engineering, or Chief Data Officer, while the day-to-day users are site
              reliability engineers (SREs), distributed systems developers, and data platform architects. Purchasing
              decisions are driven by total cost of ownership (TCO) reductions, Kafka cluster consolidation, and
              sub-millisecond tail latency SLAs required for real-time fraud detection and financial transaction
              processing. Redpanda addresses enterprise security and compliance concerns through its Bring Your Own
              Cloud (BYOC) deployment model, allowing regulated financial and healthcare buyers to retain data within
              private VPCs while offloading operational management. Operational telemetry is monitored via
              low-cardinality /public_metrics Prometheus endpoints, ensuring that platform engineers maintain
              transparent cluster health visibility. As organizations expand their AI initiatives, emerging AI
              application developers and Chief AI Officers are increasingly co-owning streaming budgets to ensure
              dependable context ingestion and agent tool auditing.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
