        title: Exhibits
        blocks:
          - type: callout
            title: The BYOC Paradox in Enterprise Sizing
            body: >-
              Redpanda's Bring Your Own Cloud (BYOC) architecture satisfies enterprise data sovereignty requirements by
              keeping the data plane inside customer VPCs, but it inherently obscures public technographic
              detection—meaning web-crawled market share metrics materially understate true production adoption.
