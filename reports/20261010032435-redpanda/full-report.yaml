  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Redpanda Data monetizes its streaming engine through a multi-tiered commercial software architecture that
              bridges developer adoption and enterprise infrastructure. The foundation of the business is its C++
              Kafka-compatible engine, which eliminates ZooKeeper and JVM operational complexity. While the core binary
              is freely distributed under source-available licensing, commercial revenue is derived from three primary
              streams: self-managed Enterprise software licenses, fully managed Redpanda Cloud hosting, and Bring Your
              Own Cloud (BYOC) deployments where data remains in customer-controlled cloud environments. Commercial
              pricing is structured on cluster compute, core capacity, and tiered feature entitlements including
              advanced data sovereignty, Tiered Storage, and dedicated 24/7 SLAs. More recently, Redpanda has expanded
              its monetization surface into AI agent governance with the Agentic Data Plane and acquired Oxla to
              incorporate real-time SQL execution into its data pipeline.
