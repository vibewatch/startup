      - number: '1.3'
        title: Financing Trajectory, Capital Structure, and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              Since its initial seed capital in 2020, Redpanda has raised approximately $265.4M to $265.5M in cumulative
              equity financing across five institutional venture rounds. Early progression included a $3.0M Seed round
              in February 2020 and a combined Seed and Series A financing of $12.4M to $15.5M announced in January 2021,
              led by Lightspeed Venture Partners with GV participation. Growth capital accelerated with a $50M Series B
              in February 2022, followed by a $100M Series C in June 2023 that doubled company headcount to 160. In
              April 2025, Redpanda closed a $100M Series D funding round led by GV with participation from Lightspeed
              Venture Partners, establishing a $1.0B post-money valuation across Series D and D-1 preferred share
              issuances. Secondary private liquidity tracked on platforms such as Forge Global demonstrates limited
              trading volumes and unquoted bid-ask spreads, reflecting tight institutional holding among lead venture
              backers.
