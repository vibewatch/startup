  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Redpanda delivers a mission-critical real-time streaming data platform engineered from first principles in
              C++ to overcome the operational and performance constraints of legacy Java-based streaming architectures.
              By replacing the JVM runtime, complex garbage collection tuning, and external ZooKeeper coordination with
              a single self-contained binary running native Raft consensus, Redpanda provides 100% Apache Kafka API wire
              compatibility while maximizing hardware resource saturation via thread-per-core execution. The platform's
              operating model is structured across six integrated functional layers, spanning the physical storage and
              consensus substrate, native streaming connectivity through Redpanda Connect, real-time SQL analytics
              enhanced by the acquisition of Oxla, and an advanced mediation plane for enterprise AI agents. Packaging
              and distribution follow modern developer workflows, offering prebuilt packages for Debian, RPM, and macOS,
              alongside rpk command-line utilities and Bazel-based open-source build tooling. This unified foundation
              enables enterprises to process streaming telemetry, financial transactions, and operational logs with
              sub-millisecond predictability while significantly reducing total compute and memory footprints across
              multi-cloud and bare-metal environments.
