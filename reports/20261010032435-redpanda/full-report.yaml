        title: Executive Leadership, Key-Person Exposure, and Governance
        blocks:
          - type: paragraph
            body: >-
              Redpanda operates under the executive direction of founder and Chief Executive Officer Alexander Gallego,
              who previously founded Concord Systems (acquired by Akamai Technologies in 2016) and served as Principal
              Software Engineer for platform infrastructure at Akamai. Gallego represents the central technological
              visionary and public spokesperson for the organization, concentrating substantial key-person dependence
              within early architecture and executive decision-making. To support commercial scaling and corporate
              maturation ahead of eventual public liquidity, Redpanda announced key C-suite additions in May 2026,
              recruiting Kyle Corcoran as Chief Financial Officer, Melissa Czapiga as Chief Marketing Officer, and Raghu
              Nandan as Vice President of Product. Corporate governance is reinforced by institutional representation
              across lead investment partners, including Arif Janmohamed of Lightspeed Venture Partners and Dave
              Munichiello of GV (Google Ventures), though comprehensive voting control agreements and independent
              director allocations remain undisclosed.
