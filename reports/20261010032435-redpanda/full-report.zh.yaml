  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 在估值与竞争阻力约束下，从技术优势推导出“跟踪”建议的决策流程。
    data:
      nodes:
        - id: tech-foundation
          label: 1. 核心 C++ 性能优势
          description: 兼容 Kafka API 的单二进制架构无需 JVM 或 ZooKeeper 开销，可带来 10 倍尾延迟改善。
        - id: product-expansion
          label: 2. 战略平台扩张
          description: 引入 Agentic Data Plane 与 Oxla SQL 引擎，瞄准企业 AI 代理治理与分析。
        - id: incumbent-barriers
          label: 3. 企业切换壁垒
          description: Apache Kafka 生态根深蒂固，加上 AWS MSK 的托管竞争，限制企业快速替换。
        - id: capitalization-status
          label: 4. 资本结构与 $1.0B 估值定价
          description: Series D 以 $1.0B 估值募集 $100M，确认一线资本支持，但也显示估值倍数趋平。
        - id: data-gaps
          label: 5. 私有财务与留存数据缺口
          description: 毛利率、NRR、CAC 及单位经济未披露，按当前条款无法完成机构投资判断。
