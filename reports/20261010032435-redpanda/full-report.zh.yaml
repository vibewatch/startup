              Redpanda 商业产品组合已从事件流引擎演进为多层平台，旨在让企业数据服务于人工应用和自主 AI 智能体。平台由三大运营模块构成：核心 Redpanda Streaming Data
              Platform、Redpanda Connect 和 Redpanda Agentic Data Plane（ADP）。Redpanda Connect 提供可视化管道编排器和 300
              多个预构建连接器，把企业数据库、SaaS 应用和数据湖接入实时流，并提供完整的变更数据捕获（CDC）语义和直接 Apache Iceberg 输出。在这一连接层之上，Agentic Data Plane 引入
              AI Gateway，在企业 AI 模型、Model Context Protocol（MCP）服务器与私有运营数据之间充当集中式策略和路由枢纽。Redpanda SQL 则把兼容 PostgreSQL
              的即席查询能力直接带入客户环境。尽管第三方估算显示 Redpanda 2025 年年收入约为 2,610 万美元，Agentic Data Plane 的商业附加率和独立 ARR
