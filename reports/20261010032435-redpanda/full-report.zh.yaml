      - number: '5.3'
        title: 技术治理、运营基础设施与可靠性
        blocks:
          - type: paragraph
            body: >-
              随着企业把自主 AI 智能体从实验沙盒推向生产工作流，基础设施要求也从模型能力转向严格的治理、安全和运营控制。Redpanda 通过 Agentic Data Plane
              的专用信任与安全基础设施应对这一挑战。每个智能体、用户和服务账户都使用 OpenID Connect（OIDC）身份标准进行认证，执行细粒度授权策略，而不是依赖不会轮换的静态 API
              凭证。为治理智能体工具执行，Redpanda 推出业界首个 Out-of-Band Policy Engine（OBPE），在 MCP 边界拦截请求，确保自主智能体无法检查、修改或绕过组织护栏或支出上限。平台通过
              OpenTelemetry Protocol（OTLP）发出完整保真度的执行指标、追踪和交互记录，实现完整运营可解释性、实时审计与即时 kill switch
              激活。不过，部署成熟度仍存在地域和架构分化：Redpanda SQL 已在客户 VPC 的 AWS 和 Google Cloud 上全面可用，而核心 Agentic Data Plane 能力目前仅限 AWS
              Bring Your Own Cloud 上的少数设计合作伙伴，多云与本地部署支持推迟到未来发布周期。
