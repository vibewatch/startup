chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Redpanda（最初注册名为 Vectorized）由分布式系统工程师 Alexander Gallego 于 2019 年 1 月在美国加利福尼亚州旧金山创立，目标是打造现代流式数据平台。Redpanda
              被设计成 Apache Kafka 的即插即用替代品：通过完全以 C++ 编写、采用每核一线程且感知硬件的架构，消除了 JVM 内存管理和 ZooKeeper
              依赖带来的运维复杂度。随着商业化推进，公司已将核心基础设施从高吞吐日志流扩展为完整的 Agentic Data Plane，提供集中式治理、AI 可观测性、Model Context
              Protocol（MCP）工具以及面向企业 AI 智能体的集成式 AI Gateway。Redpanda
              通过商业企业订阅实现软件变现，覆盖自管本地环境、主要超大规模云厂商上的全托管云集群，以及确保严格企业数据主权的 Bring Your Own Cloud（BYOC）部署。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO012
