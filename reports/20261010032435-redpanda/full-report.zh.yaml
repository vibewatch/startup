      - Redpanda 平台方案
      - 可量化收益
      - 技术局限
    rows:
      - - 实时事件流
        - 多 broker Apache Kafka 集群，需要调优 JVM，并管理 ZooKeeper/KRaft 法定人数
        - 采用每核心线程 Seastar 风格架构和 Raft 共识的单二进制 C++ broker
        - 消除 JVM 垃圾回收暂停，减少运维所需的 broker 数量
        - 需要针对直接 I/O 和异步轮询优化的 Linux 内核环境
      - - 企业 AI Agent 数据访问治理
        - API 密钥散落在各个 agent 框架中硬编码，并直接连接数据库
        - Agentic Data Plane 充当集中式中介层和 MCP 服务器注册表
        - 跨模型执行任务级权限、token 预算和审计日志
        - 初始部署仅限 AWS BYOC 上的部分设计合作伙伴
      - - 事件流实时即席分析
        - 复杂 ETL 管道将流数据导出到外部分析型数据仓库
        - 部署在客户云 VPC 账户内、兼容 PostgreSQL 的 Redpanda SQL 引擎
        - 在 8 个节点上处理重型查询实现 7x 加速，流式数据无需离开 VPC
        - 相较成熟云数据仓库，引擎成熟度和分析查询方言仍有限
      - - 多系统数据摄取与转换
        - 自定义连接器脚本或第三方托管 ETL 服务增加延迟和成本
        - 配备可视化管道编排器和 300+ 个原生连接器的 Redpanda Connect
        - 原生 CDC 语义和直接输出到 Iceberg，每天搬运数十亿事件
        - 自主管理集群中的高吞吐连接器管道需要专门进行计算资源配置
