        - GV 与 Lightspeed 领投、累计获得 $262.5M-$276M 资本支持，开发资金储备充足
        - $1.0B 估值相较 2023 年 $1.1B 定价持平或小幅下调，显示基础设施软件倍数承压
        - 披露可持续的经营利润率，或 ARR 增长重新加速至数百个百分点
    notes: 正论点综合技术基准、融资历史及流式市场竞争动态得出。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 关键下行 / 上行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - Agentic Data Plane 被企业快速采用；ARR 增长持续达到 70%+；Redpanda Cloud 成为 GenAI 管道的默认流式引擎
        - 上市退出或战略技术收购时，按 15x-20x 远期 ARR 倍数计算企业价值 $1.8B - $2.5B
        - 对 Confluent Cloud 保持压倒性胜率，BYOC 企业业务快速扩张
        - 20%
      - - 基准情景
        - 延迟敏感型工作负载持续迁移 Kafka；ADP 附加率中等；ARR 达到 $45M-$60M，现金消耗收窄
        - 未来 3-5 年估值区间为 $900M - $1.2B（8x-12x 远期收入倍数），足以支撑当前 $1.0B Series D 入场定价
        - 增长保持稳定，但持续受到 Amazon MSK 与 Confluent 的竞争
        - 55%
      - - 悲观情景
        - Kafka 根深蒂固导致企业迁移停滞；Agentic Data Plane 变现失败；云计算托管消耗过高
        - $400M - $600M 估值区间，对应下轮融资资本重组或 acquihire 并购退出
        - 失去核心开发者心智、超大规模云厂商压价，或流动性受限
        - 25%
    notes: 情景展示流式数据与企业 AI 市场采用路径下的示意性投资评估期限。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Redpanda 从 Kafka 兼容流式引擎发展为企业 Agentic Data Plane 的时间演进（2019-2026）。
    data:
      items:
        - label: 公司成立
          date: 2019-01
          detail: Alexander Gallego 在旧金山创立 Redpanda（原名 Vectorized），开发 C++ Kafka 替代方案。
          tone: positive
        - label: 种子轮融资
          date: 2020-02
          detail: 获 Lightspeed Venture Partners 领投的 $3.0M 种子轮融资，用于完善核心 C++ 存储引擎。
          tone: positive
        - label: Series A 与正式商用
          date: 2021-01
          detail: 宣布 Kafka 兼容流式平台正式商用，并获 Lightspeed 与 GV 领投的 $15.5M 种子轮 / Series A 资本。
          tone: positive
        - label: Series B 增长轮
          date: 2022-02
          detail: 完成 $50M Series B 融资，加速面向企业工作负载的云部署与 BYOC（自带云）部署。
          tone: positive
        - label: Series C 规模化融资
          date: 2023-06
          detail: 公司员工数翻倍至 160 人后，完成 Lightspeed、GV 与 Haystack 领投的 $100M Series C 融资。
          tone: positive
        - label: 收购 Benthos
          date: 2024-05
          detail: 收购开源流处理平台 Benthos（更名为 Redpanda Connect），扩大连接器生态。
          tone: positive
        - label: Series D 与独角兽估值
          date: 2025-04
          detail: 完成 GV 领投的 $100M Series D，投后估值 $1.0B，并公布 Agentic Enterprise 数据战略。
          tone: positive
        - label: FY27 第一季度势头与高管增员
          date: 2026-05
          detail: 公布 ARR 同比增长 70%、创纪录的七位数订单，并任命新 CFO、CMO 与产品副总裁。
          tone: positive
    approximationNotes: 日期依据 2019 至 2026 年官方新闻公告及公司披露月份。
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO006
      - CO007
      - CO011
      - CO012
