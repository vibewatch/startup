        blocks:
          - type: paragraph
            body: >-
              Redpanda 由创始人兼首席执行官 Alexander Gallego 负责经营；他此前创立 Concord Systems（2016 年被 Akamai Technologies 收购），并在 Akamai
              任平台基础设施首席软件工程师。Gallego 是公司的核心技术愿景提出者和公开发言人，早期架构与高管决策因此高度依赖这一关键人物。为在未来实现公开流动性前支持商业扩张和公司成熟，Redpanda 于 2026 年
              5 月宣布补充 C-suite，聘任 Kyle Corcoran 为首席财务官、Melissa Czapiga 为首席营销官、Raghu Nandan 为产品副总裁。机构投资方也参与公司治理，包括
              Lightspeed Venture Partners 的 Arif Janmohamed 和 GV（Google Ventures）的 Dave
              Munichiello；但完整的投票控制协议和独立董事席位分配仍未披露。
            claimRefs:
