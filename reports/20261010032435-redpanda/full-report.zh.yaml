        title: 融资轨迹、资本结构与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              自 2020 年获得种子资金以来，Redpanda 已通过五轮机构风险投资累计融资约 $265.4M 至 $265.5M。早期包括 2020 年 2 月的 $3.0M Seed 轮，以及 2021 年 1
              月公布、由 Lightspeed Venture Partners 领投并有 GV 参与的 $12.4M 至 $15.5M Seed 和 Series A 合并融资。随后增长资本加速：2022 年 2 月完成
              $50M Series B， 2023 年 6 月完成 $100M Series C，公司员工数翻倍至 160 人。2025 年 4 月，Redpanda 完成由 GV 领投、Lightspeed Venture
              Partners 参与的 $100M Series D 融资；Series D 及 D-1 优先股发行对应投后估值 $1.0B。Forge Global
              等平台上的私募二级流动性显示交易量有限、买卖报价未公开，反映出主要风险投资支持方持股集中。
