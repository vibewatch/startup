      - number: '2.3'
        title: 买方画像细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              流式数据基础设施的采购方式随组织规模和技术成熟度显著变化。在大型企业中，经济买方通常是基础设施副总裁、平台工程负责人或首席数据官；日常使用者则包括站点可靠性工程师（SRE）、分布式系统开发者和数据平台架构师。采购决策由总拥有成本（TCO）下降、Kafka
              集群整合，以及实时欺诈检测和金融交易处理所需的亚毫秒级尾延迟 SLA 驱动。Redpanda 通过 Bring Your Own
              Cloud（BYOC）部署模式解决企业安全与合规问题，让受监管的金融和医疗买方把数据留在私有 VPC 中，同时把运维管理外包。平台工程师通过低基数 /public_metrics Prometheus
              端点监控运营遥测，从而透明掌握集群健康。随着企业扩大 AI 计划，新兴 AI 应用开发者和首席 AI 官正越来越多地共同掌管流式预算，以确保上下文摄取可靠、智能体工具可审计。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM012
      - number: '2.4'
        title: 增长催化剂、运营摩擦与尽调考量
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的市场采用受两股力量推动：从传统批量分析向实时事件流的结构性转变，以及企业对 AI 和机器学习系统爆发式增长的需求。调查数据显示，实时分析（71%）是当前最主要的采用驱动因素；未来 12 至
              24 个月，AI/ML 集成将成为流式基础设施投资的首要催化剂。此外，欧盟 AI 法案等监管框架正迫使企业为自主智能体建立不可篡改的审计日志和运行时治理，为 Redpanda 的 Agentic Data
              Plane
              创造从零开始的机会。不过，明显阻力仍在：技术决策者对数据隐私（42%）、分区故障下的一致性（35%）、基础设施总支出（36%）以及专业的内部集成工程人才短缺（34%）表示强烈担忧。对尽调人员而言，尚未解决的关键问题是：Redpanda
              能否在面对根深蒂固的 Kafka 既有厂商时，把免费开发者集群快速转化为持续产生收入的七位数商业合同。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业规模测算中的 BYOC 悖论
            body: >-
              Redpanda 的 Bring Your Own Cloud（BYOC）架构通过把数据平面留在客户 VPC
              内满足企业数据主权要求，但也天然遮蔽了公开技术画像检测——因此基于网页抓取的市场份额指标会显著低估真实生产采用度。
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM011
          - type: callout
            title: 既有厂商的市场固守与切换惯性
            body: >-
              尽管 Redpanda 延迟低 10 倍且兼容 Kafka 协议，品类支出仍由 Apache Spark、Spark Streaming 和 Confluent
              等既有厂商主导；客户采用也受内部技术技能短缺（34%）和数据迁移一致性风险（35%）限制。
            calloutType: risk
            claimRefs:
              - CM002
              - CM010
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 流式基础设施版图与既有厂商动态
        blocks:
          - type: paragraph
            body: >-
              事件流和流式数据基础设施市场建立在企业广泛采用 Apache Kafka 协议的基础上，Confluent 历来作为领先企业级 Kafka 厂商占据商业主导地位。Redpanda
              以激进的替代策略切入这一成熟市场，将自身定位为即插即用替代品：保留既有 Kafka API，同时消除 Java Virtual Machine（JVM）调优和 Apache ZooKeeper 集群开销。IBM
              以 110 亿美元企业估值收购 Confluent 后，市场格局发生明显变化，主要事件流既有厂商直接纳入 IBM 企业软件生态。除 Confluent 外，主要云超大规模厂商也提供原生流式服务，例如 AWS 上的
              Amazon Kinesis 和 Google Cloud Dataflow；Aiven 等托管服务商则在各云上提供托管 Apache Kafka 实例。面对这些替代品，Redpanda
              试图把完整协议兼容性与独立的多云、本地部署灵活性结合起来，形成差异化。
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
      - number: '3.2'
        title: 架构差异化与 AI 工作负载定位
        blocks:
          - type: paragraph
            body: >-
              Redpanda 的核心技术护城河在于每核一线程的 C++ 引擎：它避免 JVM 垃圾回收暂停，并把数据存储与分区管理统一到单一二进制中。在 Redpanda Streaming 26.1
              中，公司推出多模态流式引擎 Redpanda One，提供面向关键延迟数据流的 Write Caching、平衡本地磁盘与云对象存储的 Tiered Storage、可直接查询湖仓的 Iceberg
              Topics，以及用于降低跨可用区网络出口成本的 Cloud Topics。为支持新兴智能体 AI 工作负载，Redpanda 扩展了 Agentic Data Plane，并于 2025 年 10 月收购分布式
              SQL 引擎开发商 Oxla，用于打造 Redpanda SQL，以便对实时流和历史 Iceberg 表执行实时连接查询。Redpanda Cloud 通过 Bring Your Own
              Cloud（BYOC）部署模式把数据隔离在客户管理的 VPC 中，配合覆盖 2025 年 7 月至 2026 年 6 月的正式 SOC 2 Type II 审计报告，支撑企业信任和数据主权；外部子处理商包括
              Pylon、OpenAI 和 Anthropic。
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP012
      - number: '3.3'
        title: 商业定价不透明与总拥有成本
        blocks:
          - type: paragraph
            body: >-
              对 Redpanda 的商业评估呈现出透明开发者入口与不透明企业商业层级之间的分化。Redpanda 提供可查看源代码的 Community Edition，可免费自托管，并在不收取许可费的情况下提供完整
              Kafka 兼容性，形成有效的自下而上开发者采用入口。相比之下，Redpanda
              的商业企业层和托管云层采用定制合同，按用量收取吞吐量和存储费用，要求直接对接销售并提交估算器数据。软件评测目录显示其用户口碑较强：截至 2026 年 3 月，G2 上 22 条评价的综合评分为
              4.8/5；客户案例还声称，相比传统 Kafka 部署可降低 30% 至 55% 的运营成本。但在合同谈判前，实际 TCO 仍难以独立验证。这种不透明增加了采购团队将 Redpanda
              与公开、可预测消费价目表的厂商进行比较时的摩擦。
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
