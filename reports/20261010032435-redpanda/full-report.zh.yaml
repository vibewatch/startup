  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界范围与支出分类
        blocks:
          - type: paragraph
            body: >-
              事件流和流处理市场涵盖实时摄取、持久化、路由和转换连续数据流的基础设施软件与云服务。Redpanda 将核心商业边界定义在高吞吐、低延迟的日志持久化与消息传递上，并提供兼容 API 的 Apache Kafka
              替代品，去除 JVM 运维开销和 ZooKeeper 依赖。在这一范围内，可服务支出包括企业流式 broker 许可证、云托管流式集群、Bring Your Own Cloud（BYOC）控制平面、通过
              Redpanda Connect 处理的大容量数据连接器，以及新兴的智能体数据治理基础设施。相反，长期分析型对象存储、分布式查询处理（如
              Snowflake、BigQuery）和专用运营数据库等相邻支出类别，不计入核心 broker 预算，而是作为下游摄取端点。通过清晰分离客户 VPC 内的数据平面与云控制平面，Redpanda
              能够获取重视数据主权的企业预算，同时不要求客户基础设施团队管理底层分布式存储引擎。
            claimRefs:
              - CM001
              - CM006
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM011
      - number: '2.2'
        title: 可服务市场规模、增长轨迹与错位
        blocks:
          - type: paragraph
            body: >-
              流式基础设施的市场规模取决于研究者衡量的是独立软件收入，还是更广泛的托管部署与咨询服务生态，因此差异很大。Dataintelo 的独立市场研究估计，全球托管 Redpanda 服务市场 2024 年规模为
              6.124 亿美元，并预测按 28.7% 的 CAGR 增长，到 2033 年达到约 49.612 亿美元。Growth Market Reports 也估计 2025 年市场基数为 5.29 亿美元，预计按
              28.4% 的 CAGR 增长，到 2034 年达到 49.12 亿美元；其中北美是最大区域需求中心，规模为 2.08 亿美元（占 39.3%）。但这些自上而下的数字把第三方系统集成、云托管转售和外部专业服务，与
              Redpanda 的纯自有软件订阅混在了一起。相比之下，6sense 的技术画像数据只识别出 278 个正在积极部署 Redpanda 流处理软件的企业域名，对应的品类市场份额仅为 0.47%（排名第
              13），远低于 Apache Spark（57.50%）和 Spark Streaming（8.92%）等既有平台。这一错位说明，尽管行业整体顺风强劲，Redpanda
              的独立软件收入仍只是托管服务总支出的狭窄切片。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM009
              - CM010
              - CM014
