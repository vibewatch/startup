            body: Redpanda 相较 Apache Kafka 展现出有说服力的技术性能优势，但 $1.0B 估值相对于预估收入仍对应偏高倍数。在客户 cohort 留存率和云业务毛利率得到验证披露前，投资人应继续跟踪观察。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
