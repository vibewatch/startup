      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业 TCO 中有吸引力的经济护城河
            body: >-
              Akamai Technologies（相对 Confluent Cloud 降本 55%）和 Johnson Controls（Azure 上节省 50% 至 80%
              成本）的经验证生产案例表明，Redpanda 的单二进制 C++ 架构为企业从复杂 Apache Kafka 集群迁移提供了即时且可验证的经济理由。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: 缺少经审计的客户群持久性与客户集中度披露
            body: >-
              NYSE、LiveRamp 和 Chess.com 等标杆生产客户 logo 验证了高端技术能力，但 Redpanda
              没有公开披露客户群层面的净收入留存率（NRR）或客户集中度指标，因此锚定客户之外扩张收入的持久性仍存疑。
            calloutType: risk
            claimRefs:
              - CU009
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险分析
        blocks:
          - type: paragraph
            body: >-
              随着企业客户在受监管环境中采用 Redpanda 流式引擎和 Agentic Data Plane，公司面临不断增加的合规与监管义务。欧盟 AI 法案对高风险 AI
              架构的提供者和部署者施加严格的治理、透明度和风险管理要求，把责任从 IT 运维提升为董事会层面的受托风险。Redpanda 分发合规框架和指南，分析欧盟要求下提供者与部署者的责任；但在 GLBA、GDPR 和
              FINRA 标准下运营的金融机构，在把传统主机孤岛连接到实时事件 broker 时仍会遭遇很高的监管门槛。此外，虽然 Redpanda 被列入 CNCF Landscape，第三方 DevSecOps
              评测确认，这一收录不等于监管或安全认证；尽调团队仍需在 Business Source License 过渡期间核实软件许可边界，以及保密协议下的审计合规文件。
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 运营、质量与安全失效模式
        blocks:
          - type: paragraph
            body: >-
              运营与系统安全风险主要来自自主 AI 智能体的不可预测性，以及分布式集群在负载下的稳定性。现代自主智能体容易遭受提示注入、指令误解和越狱攻击，却能以机器速度操作企业 API。Redpanda 通过 Agentic
              Data Plane 将安全元数据、工具级策略检查和审计记录带到带外，使智能体无法检查或篡改治理约束。为遏制失控自动化，平台设置紧急 kill switch，让运营人员在智能体超出 token
              预算或突破执行阈值时冻结智能体。但衡量生产工作负载中网关中介造成的确切延迟和金钱成本开销的正式基准仍未披露。基础设施运维中，Redpanda 明确警告不要在生产环境运行预发布候选版本；Technical
              Customer Success Managers 则持续监控集群遥测，以提前发现容量耗尽、节点分区故障和客户 SLA 升级。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
