  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从开发者试用到关键任务企业扩张及采用代理式 AI 数据平面的六阶段生命周期。
    claimRefs:
      - CU002
      - CU008
      - CU010
      - CU011
      - CU012
    approximationNotes: 综合 Redpanda 客户成功运营模式、开发者上手路径及合作伙伴集成得出。
    data:
      nodes:
        - label: 开发者探索与本地原型
          stage: Discovery
          description: 工程师通过 Docker 或 rpk 命令行二进制启动轻量 Redpanda 容器，不依赖 Zookeeper 或 JVM。
          touchpoints:
            - Docker Hub
            - GitHub Repository
            - Developer Documentation
            - Community Slack
        - label: 试点与基准测试
          stage: Evaluation
          description: 团队在高吞吐流式工作负载中，将 p99 尾延迟与资源消耗同 Kafka、Confluent 对比测试。
          touchpoints:
            - Self-hosted Benchmarks
            - PeerSpot Reviews
            - Jepsen Safety Reports
            - Community Forums
        - label: 首次生产部署
          stage: Adoption
          description: 部门首次部署 Redpanda Self-Managed 或 Cloud BYOC，消除运维开销与意外超额费用。
          touchpoints:
            - BYOC Cloud Console
            - Terraform Provider
            - Technical Customer Success Onboarding
            - Support SLAs
        - label: 生态与管道集成
          stage: Integration
          description: 通过 Redpanda Connect 集成 ClickHouse、Snowflake、Decodable、Pinecone 等企业数据汇聚端与流处理器。
          touchpoints:
            - Redpanda Connect
            - Kafka Client Libraries
            - Partner Connectors
            - Grafana Observability
        - label: 企业工作负载扩张
          stage: Expansion
          description: 从单应用消息队列扩展到全公司流式骨干及多区域金融 / 遥测枢纽。
          touchpoints:
            - Quarterly Business Reviews
            - Technical Success Usage Audits
            - Enterprise Tiered Storage
            - Multi-Region BYOC
        - label: 代理式 AI 与治理成熟
          stage: Governance
          description: 采用 Agentic Data Plane，为企业自主 AI 代理提供中介式数据访问、策略防护与审计日志。
          touchpoints:
            - Agentic Data Plane Gateway
            - Unified Auth/AuthZ
            - Model Kill Switch
            - Compliance Audit Logs
