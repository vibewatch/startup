  - id: FE001
    title: 产品架构图
    type: stack
    summary: Redpanda 数据与代理治理平台的六层运营架构。
    data:
      layers:
        - label: 治理与策略引擎
          detail: 带外策略引擎，执行 MCP 防护规则、token 支出上限与紧急停机控制
        - label: AI Gateway 与中介层
          detail: 聚合 Model Context Protocol、OIDC 身份认证及延迟工具执行路由
        - label: Redpanda SQL 分析引擎
          detail: 基于收购的 Oxla 技术，提供兼容 PostgreSQL API 的实时临时查询
        - label: Redpanda Connect 集成平面
          detail: 可视化管道编排与 300+ 个流式连接器，原生支持 Iceberg CDC 语义
        - label: C++ 存储与 Raft 共识核心
          detail: 原生每核心一线程流式引擎，无需 JVM 即可实现 100% Kafka 协议兼容
        - label: 多云基础设施底座
          detail: 客户自管 Bring Your Own Cloud（AWS/GCP）、自管 Linux 软件包及托管云
    approximationNotes: 概念性功能拆解，展示平台子系统与逻辑运营边界。
