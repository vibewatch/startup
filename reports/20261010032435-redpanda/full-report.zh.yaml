        title: 核心架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Redpanda 以 C++ 从底层打造关键任务实时流式数据平台，旨在克服传统 Java 流式架构的运营和性能限制。它用运行原生 Raft 共识的单一自包含二进制，替代 JVM 运行时、复杂垃圾回收调优和外部
              ZooKeeper 协调，同时提供 100% Apache Kafka API 线级兼容，并通过每核一线程执行最大化硬件资源利用。平台运营模式分为六个集成功能层，覆盖物理存储与共识底座、通过 Redpanda
              Connect 实现的原生流式连接、由收购 Oxla 强化的实时 SQL 分析，以及面向企业 AI 智能体的高级中介平面。产品包装和分发遵循现代开发者工作流，提供 Debian、RPM 和 macOS
              预构建包，以及 rpk 命令行工具和基于 Bazel 的开源构建工具。统一底座让企业能以亚毫秒级的可预测性处理流式遥测、金融交易和运营日志，并显著降低多云与裸机环境中的总计算和内存占用。
