evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited GAAP financial statements, verified annual recurring revenue (ARR), gross margin percentage, net revenue
      retention (NRR), and cash burn rate.
    whyItMatters: >-
      Without primary revenue and margin disclosures, valuation models must rely on third-party estimates (such as
      GetLatka's $26.1M ARR estimate), obscuring true revenue multiples on the $1B Series D valuation.
    diligencePath: >-
      Request confidential management financial package under NDA, including historical income statements, ARR bridge,
      and cash runway projections.
    relatedQuestionRefs:
      - QO007
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: >-
      Full board of directors roster, independent director seats, voting share distribution, and comprehensive cap
      table.
    whyItMatters: >-
      Public sources confirm board participation by venture partners Arif Janmohamed (Lightspeed) and Dave Munichiello
      (GV), but full governance composition and protective voting provisions remain unverified.
    diligencePath: >-
      Obtain company Certificate of Incorporation, investor rights agreements, and current board composition roster
      during legal diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: tam-sam-som-methodology-divergence
    missingEvidence: >-
      Independent primary sizing data isolating Redpanda's pure commercial software and cloud platform addressable spend
      (SAM/SOM) from broad third-party managed services, consulting, and cloud infrastructure pass-through revenue.
    whyItMatters: >-
      Broad market sizing estimates of $4.9B+ for 'Managed Redpanda Services' conflate external systems integration,
      hyperscaler compute/storage billing, and partner services with software license demand, obscuring Redpanda's
      standalone ARR potential.
    diligencePath: >-
      Request customer contract breakdowns from management detailing software subscription versus managed hosting
      pass-through fees, alongside workload renewal and expansion cohort analysis.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-conversion-and-byoc-retention
    missingEvidence: >-
      Corroborated enterprise conversion data quantifying the migration rate of free community Redpanda developers into
      high-margin Enterprise BYOC and managed cloud contracts.
    whyItMatters: >-
      While technographic detection identifies only 278 visible public domains (0.47% share), Redpanda's core enterprise
      revenue is driven by private BYOC clusters inside corporate VPCs that cannot be audited from external web crawls.
    diligencePath: >-
      Review vendor-supplied customer pipeline metrics, average contract value (ACV) distributions across top 50
      accounts, and net expansion rates within Fortune 500 accounts under NDA.
    relatedQuestionRefs:
      - QM008
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: migration-costs-switching
    missingEvidence: >-
      Audited customer migration timelines, multi-homing transition runbooks, and precise switching cost accounting for
      migrating multi-terabyte production Kafka clusters to Redpanda.
    whyItMatters: >-
      While Kafka API drop-in compatibility removes code rewrites, operational switching costs including dual-running
      costs, schema registry migration, and pipeline validation remain uncorroborated by independent public case
      studies.
    diligencePath: >-
      Request customer references who completed full cluster cutovers to inspect actual migration duration, dual-cloud
      transit fees, and staff re-training investments.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, gross margin, cash burn, CAC payback, and customer cohort
      retention.
    whyItMatters: >-
      Without audited financial disclosures, underwriting must rely on third-party estimates that cannot verify
      operating leverage or cash runway.
    diligencePath: >-
      Request audited financial statements, board decks, and SaaS metrics dashboards under non-disclosure agreement
      during confirmatory diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: commercial-attach-rates
    missingEvidence: Commercial attach rates and revenue contribution of Redpanda Connect and Agentic Data Plane products.
    whyItMatters: Assessing whether new product introductions expand net expansion or remain niche experimental capabilities.
    diligencePath: Obtain SKU-level revenue breakdown, expansion ARR reports, and customer product adoption telemetry.
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: agentic-data-plane-attach-rate
    missingEvidence: >-
      Standalone customer adoption counts, SKU-level ARR attach rates, and consumption metrics for the Agentic Data
      Plane and Redpanda Connect.
    whyItMatters: >-
      Prevents independent validation of whether the AI governance expansion is driving new commercial ACV or
      functioning primarily as a positioning layer for core streaming contracts.
    diligencePath: >-
      Request management reporting on Agentic Data Plane SKU attach rate, BYOC deployment conversion, and standalone ADP
      consumption billing.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration-metrics
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross renewal rates, annual logo churn, and top-five customer
      revenue concentration percentages.
    whyItMatters: >-
      Without audited retention curves and concentration percentages, assessing whether rapid revenue growth is durable
      or dependent on a small handful of financial anchor accounts is impossible from public data alone.
    diligencePath: >-
      Request confidential historical cohort retention waterfalls and top-ten customer revenue contribution schedules
      under NDA during confirmatory sponsor diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-census
    missingEvidence: >-
      Complete enterprise customer registry detailing contract ARR bands, cluster node counts, and production workload
      categories beyond self-selected public case studies.
    whyItMatters: >-
      Public case study references highlight marquee enterprise successes but obscure the distribution of contract sizes
      and conversion rates from free community rpk binaries to paid enterprise licenses.
    diligencePath: >-
      Review Redpanda's CRM pipeline logs, customer account listings, and renewal schedules provided in the virtual data
      room.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: agentic-ai-performance-overhead
    missingEvidence: >-
      Quantitative benchmarks measuring the exact latency and monetary cost overheads introduced by Redpanda Agentic
      Data Plane gateway mediation.
    whyItMatters: >-
      Without production benchmarks, enterprises cannot evaluate the performance degradation or operational costs of
      routing agent tool calls through out-of-band proxy layers.
    diligencePath: >-
      Request customer deployment telemetry and synthetic benchmark results from Redpanda engineering measuring p99
      latency deltas under load.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete public repository of formal regulatory filings, SOC 2 Type II audit report, and international
      jurisdiction compliance certifications.
    whyItMatters: >-
      Enterprise FSI procurement requires audited compliance reports to verify that data residency, tenant isolation,
      and regulatory mandates are met.
    diligencePath: >-
      Execute non-disclosure agreement to inspect Redpanda's full SOC 2 Type II examination report, ISO 27001
      certificate, and penetration testing summaries.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing gross margins, net revenue retention (NRR), customer acquisition cost
      (CAC), and cash burn rate.
    whyItMatters: >-
      Without verified unit economics and margin structure, justifying a $1.0B enterprise valuation against legacy and
      cloud incumbents relies on uncorroborated top-line expansion.
    diligencePath: >-
      Request confidential disclosure of audited income statement, cohort retention schedules, and cloud gross margins
      during investor diligence.
    relatedQuestionRefs:
