        - VP of Infrastructure, Platform Engineering Director
        - 'High: Forms the core foundational platform replacement for legacy Apache Kafka and Apache Spark streaming clusters.'
      - - Managed Cloud & BYOC Streaming Services
        - Fully managed cloud cluster consumption, Bring Your Own Cloud control-plane subscriptions, and enterprise VPC networking.
