callouts:
  - calloutType: insight
    title: The BYOC Paradox in Enterprise Sizing
    body: Redpanda's Bring Your Own Cloud (BYOC) architecture satisfies enterprise data sovereignty requirements by keeping the data plane inside customer VPCs, but it inherently obscures public technographic detection—meaning web-crawled market share metrics materially understate true production adoption.
    claimRefs:
      - CM006
      - CM009
      - CM011
  - calloutType: risk
    title: Incumbent Market Entrenchment and Switching Inertia
    body: Despite Redpanda's 10x lower latency and Kafka protocol compatibility, category spending remains dominated by entrenched incumbents like Apache Spark, Spark Streaming, and Confluent, while customer adoption is constrained by in-house technical skill shortages (34%) and data migration consistency risks (35%).
    claimRefs:
      - CM002
      - CM010
      - CM012
