companyProfile:
  summary: >-
    Redpanda was founded in 2019 by Alexander Gallego to build a C++ Kafka-compatible streaming platform and has since
    expanded into self-managed software, managed cloud, BYOC, and an Agentic Data Plane for enterprise AI governance.
    The company remains privately held and disclosure-light on core financials, but its April 2025 Series D and 2026
    product expansion point to a late-stage infrastructure business with meaningful enterprise adoption.
