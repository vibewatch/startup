callouts:
  - calloutType: strength
    title: "Native C++ Engine Eliminates JVM Overhead and Simplifies Operational Topologies"
    body: "Redpanda's core architecture eliminates the operational tax historically associated with Apache Kafka deployments by replacing the JVM runtime, garbage collection tuning, and external ZooKeeper/KRaft coordination with a unified C++ binary and native Raft consensus. This delivers predictable sub-millisecond latencies and simplified deployment workflows across bare-metal, Kubernetes, and cloud environments."
    claimRefs:
      - CE001
      - CE011
  - calloutType: risk
    title: "Agentic Data Plane Deployment Surface Remains Constrained to AWS Design Partners"
    body: "While Redpanda's core streaming engine is mature and broadly available across clouds, its strategic Agentic Data Plane expansion remains restricted to select design partners on AWS Bring Your Own Cloud deployments as of 2026. Enterprise buyers operating on Microsoft Azure, Google Cloud Platform, or sovereign on-premises infrastructure face delayed availability, creating a temporary adoption barrier for multi-cloud AI agent governance."
    claimRefs:
      - CE008
      - CE009
      - CE013
