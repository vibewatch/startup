  title: "Product & Technology"
  summary: "Redpanda delivers an Apache Kafka-compatible streaming data platform engineered in C++ without JVM or ZooKeeper overhead, now expanded with an Agentic Data Plane providing centralized AI Gateway routing, Out-of-Band Policy Engine governance, and PostgreSQL-compatible real-time SQL analytics."
sections:
  - id: "core-architecture-and-operating-model"
    title: "Core Architecture and Operating Model"
    body: "Redpanda delivers a mission-critical real-time streaming data platform engineered from first principles in C++ to overcome the operational and performance constraints of legacy Java-based streaming architectures. By replacing the JVM runtime, complex garbage collection tuning, and external ZooKeeper coordination with a single self-contained binary running native Raft consensus, Redpanda provides 100% Apache Kafka API wire compatibility while maximizing hardware resource saturation via thread-per-core execution. The platform's operating model is structured across six integrated functional layers, spanning the physical storage and consensus substrate, native streaming connectivity through Redpanda Connect, real-time SQL analytics enhanced by the acquisition of Oxla, and an advanced mediation plane for enterprise AI agents. Packaging and distribution follow modern developer workflows, offering prebuilt packages for Debian, RPM, and macOS, alongside rpk command-line utilities and Bazel-based open-source build tooling. This unified foundation enables enterprises to process streaming telemetry, financial transactions, and operational logs with sub-millisecond predictability while significantly reducing total compute and memory footprints across multi-cloud and bare-metal environments."
    claimRefs:
      - CE001
      - CE007
      - CE011
      - CE014
    figureRefs:
      - FE001
  - id: "product-lines-and-enterprise-workflows"
    title: "Product Lines, Modules, and Enterprise Workflows"
    body: "The Redpanda commercial product portfolio has evolved from an event streaming engine into a multi-tiered platform designed to operationalize enterprise data for human applications and autonomous AI agents. The platform is organized into three primary operational modules: the core Redpanda Streaming Data Platform, Redpanda Connect, and the Redpanda Agentic Data Plane (ADP). Redpanda Connect provides a visual pipeline composer and more than 300 pre-built connectors that bridge enterprise databases, SaaS applications, and data lakes into real-time streams with full change data capture (CDC) semantics and direct Apache Iceberg output. Building atop this connectivity layer, the Agentic Data Plane introduces an AI Gateway that acts as a centralized policy and routing hub between enterprise AI models, Model Context Protocol (MCP) servers, and private operational data. For analytical querying, Redpanda SQL brings PostgreSQL-compatible ad-hoc query capabilities directly inside customer environments. While third-party estimates indicate Redpanda achieved approximately $26.1 million in annual revenue as of 2025, commercial attach rates and standalone ARR contributions for the Agentic Data Plane remain undisclosed private metrics requiring direct diligence confirmation."
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE010
      - CE012
    tableRefs:
      - TE001
      - TE002
  - id: "technical-governance-and-infrastructure"
    title: "Technical Governance, Operating Infrastructure, and Reliability"
    body: "As enterprises shift autonomous AI agents from experimental sandboxes into production workflows, infrastructure requirements transition from model capability to strict governance, safety, and operational control. Redpanda addresses this challenge through the Agentic Data Plane's dedicated trust and security infrastructure. Every agent, user, and service account is authenticated using OpenID Connect (OIDC) identity standards, enforcing granular authorization policies rather than relying on unrotated static API credentials. To govern agent tool execution, Redpanda introduced an industry-first Out-of-Band Policy Engine (OBPE) that intercepts requests at the MCP boundary, ensuring that autonomous agents cannot inspect, modify, or bypass organizational guardrails or spend ceilings. Complete operational explainability is maintained by emitting full-fidelity execution metrics, traces, and interaction transcripts using the OpenTelemetry Protocol (OTLP), enabling real-time auditing and instant kill-switch activation. However, deployment maturity remains geographically and architecturally bifurcated: while Redpanda SQL is generally available across both AWS and Google Cloud in customer VPCs, core Agentic Data Plane capabilities are currently limited to select design partners on AWS Bring Your Own Cloud, with multi-cloud and on-premises support deferred to future release cycles."
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE009
      - CE013
    tableRefs:
      - TE003
  - id: "differentiation-and-technical-risks"
    title: "Technical Differentiation, Developer Ecosystem, and Unresolved Technical Risks"
    body: "Redpanda's core competitive differentiation rests on three architectural pillars: native C++ execution speed, developer-centric operational simplicity, and proactive enterprise AI agent governance. Against incumbent streaming solutions like Apache Kafka and Confluent, Redpanda delivers substantial total cost of ownership reductions by eliminating JVM heap overhead, reducing node counts, and embedding native schema and connector management directly into the broker architecture. The acquisition of Oxla further sharpens this technical edge by embedding high-performance analytical query processing into event streams, allowing organizations to run ad-hoc SQL transformations without exporting data to third-party data warehouses. Furthermore, its early establishment of an out-of-band policy engine at the MCP boundary positions Redpanda ahead of generic API gateways that lack streaming context. Nonetheless, meaningful technical and adoption risks persist. Enterprise agent governance remains an emerging, rapidly shifting category where standard protocols like MCP and A2A continue to evolve. Furthermore, Redpanda's phased deployment rollout across cloud providers creates a window of vulnerability where competing streaming and API gateway providers could introduce rival governance features before Redpanda achieves broad multi-cloud general availability."
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE009
      - CE011
      - CE013
