- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - What would change the view
  rows:
  - - Large and growing onchain-perps market
    - Supports premium strategic value for category leaders
    - Evidence that share gains are temporary or incentive-only would weaken this
  - - Technically differentiated product and Ethereum-settled verifiability
    - Could justify durable premium versus shallow-copy DEXs
    - Evidence of outages, poor fills, or weak retention would weaken it
  - - Public scale proxies are meaningful
    - Volume and activity support seriousness
    - If fee conversion is poor, scale may not translate into value
  - - Regulatory perimeter is severe
    - Can impair access, product scope, and investability quickly
    - A clean outside-counsel memo and strong blocker controls would help
  - - Economics remain under-disclosed
    - Prevents confident underwriting of the current price
    - Revenue mix, margins, and cohort retention could materially improve the call
  notes: The thesis table is intentionally balanced; each positive point is paired with a falsifier.
