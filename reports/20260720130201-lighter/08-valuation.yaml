- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Named regulatory action
    - Any formal action involving Lighter’s core products or blocked-jurisdiction access
    - Directly attacks market access and valuation support
    - Pause / likely pass unless clearly containable
  - - Revenue-quality miss
    - Management cannot show healthy paid-flow conversion from public scale
    - Undermines bull and base-case monetization logic
    - Lower fair-value band materially
  - - Liquidity concentration reveal
    - Small number of market makers / partners drive most economics
    - Raises fragility of customer and revenue story
    - Assume higher risk and lower multiple
  - - Operational integrity issue
    - Repeated stale-price, outage, or liquidation-control controversy
    - Damages trust premium and retention outlook
    - Re-rate downward quickly
  - - Treasury stress
    - Runway or incentive burden materially weaker than implied by late-2025 round
    - Reduces ability to buy growth and absorb shocks
    - Treat as financing-overhang signal
  notes: Triggers are intentionally concrete so they can be monitored after diligence begins.
