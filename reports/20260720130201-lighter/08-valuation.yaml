- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Lighter sustains share gains, converts premium/API flow efficiently, expands RWA carefully, and avoids material regulatory setbacks
    - ~$1.8B-$2.6B EV range; 2025 mark looks fair-to-attractive
    - Still sensitive to regulation and concentration
    - Possible but needs management proof
  - - Base
    - Scale remains real, but revenue quality and concentration are only moderate, with regulation manageable but unresolved
    - ~$1.0B-$1.6B EV range; 2025 mark looks roughly full to modestly stretched
    - Monetization durability and legal overhang
    - Most defensible on public evidence
  - - Bear
    - Regulatory pressure rises, premium/API concentration is high, and incentive-driven flow proves less sticky
    - ~$0.5B-$0.9B EV range; 2025 mark looks rich
    - Enforcement, thinning liquidity, weak retention
    - Cannot be ruled out from public evidence
  notes: Scenario bands are judgmental framing ranges, not audited-company outputs or DCF point estimates.
