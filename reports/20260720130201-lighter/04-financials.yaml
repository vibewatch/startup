- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial case for Lighter is therefore a mix of strength and uncertainty. Strength comes from a large market, strong reported volume, visible fee mechanics, publicly observable protocol-fee proxies, and a well-subscribed late-2025 round from elite investors. Uncertainty comes from the fact that almost every private-company underwriting input still matters: how much of volume is durable, what share comes from subsidized retail, how much premium/API flow is recurring, whether partner economics are attractive, and how much capital is required to keep the venue competitive against deeper-liquidity rivals. The zero-fee posture is strategically smart, but it can hide a real revenue-quality question if the venue cannot convert free usage into sticky, profitable flow.


    Accordingly, the right near-term verdict is not that Lighter lacks a business model. It clearly has one. The verdict is that public evidence proves monetization pathways and some realized economic activity, but not enough to underwrite margin path, cash efficiency, or long-term capital intensity with confidence. Any investment call still needs direct management diligence on revenue mix, burn, runway, and balance-sheet resilience.'
