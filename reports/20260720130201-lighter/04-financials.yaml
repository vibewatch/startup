  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue quality
    missingEvidence: Management revenue bridge showing premium/API/partner/pool/token-related economics, plus gross margin and cohort retention.
    whyItMatters: Public proxies show activity, but not whether that activity converts into attractive, durable company economics.
    diligencePath: Request monthly revenue mix, unit-economics dashboard, and cohort retention by user class.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI011
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash on hand, burn, runway, and any liabilities or treasury constraints.
    whyItMatters: Capital adequacy cannot be underwritten from a funding headline alone.
    diligencePath: Request treasury schedule, monthly burn, stress scenario, and minimum operating-liquidity policy.
    relatedQuestionRefs:
    - QI014
    - QI024
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Volume and revenue mix by retail, API, partner, and top-account cohorts.
    whyItMatters: The business could look very different if a small set of professional users drive most economics.
    diligencePath: Request top-account concentration and cohort revenue tables.
    relatedQuestionRefs:
    - QI020
    - QI023
    relatedTableRefs:
    - TI005
