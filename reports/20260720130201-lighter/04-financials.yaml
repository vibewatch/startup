- id: capital-adequacy-and-financing-dependence
  title: Capital Adequacy and Financing Dependence
  body: 'The best-supported capital fact is the November 2025 financing. Yahoo/Fortune, The Block, FinanceFeeds, Wilson Sonsini, and Tracxn all support a $68 million round at about a $1.5 billion valuation, with total capital raised reaching roughly $89-90 million. That is a meaningful late-stage equity base for a still-private exchange infrastructure company and suggests Lighter has enough capital to fund product expansion, liquidity programs, and engineering hiring through a growth phase. The financing narrative also explicitly tied future plans to spot expansion, new derivative markets, UI improvement, and liquidity infrastructure.


    What the public record does not provide is just as important: cash on hand, burn, runway, minimum operating liquidity, exchange treasury composition, token liability exposure, or debt. There is no public debt facility, project-finance structure, or cash bridge comparable to what mature exchanges or public fintechs disclose. That means capital adequacy can only be judged in relative, not absolute, terms. Relative to other venture-backed DeFi venues, Lighter looks well financed. Relative to the information needed for hard underwriting, it remains highly opaque.'
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI022
