  title: Pricing / monetization table
  columns:
  - Mechanic
  - Public number or rule
  - Implication
  - Gap
  rows:
  - - Standard account trading
    - 0 maker / 0 taker
    - Strong retail acquisition lever
    - No public conversion rate from free to monetized usage
  - - Premium account fees
    - Maker and taker fees with staking discounts
    - Direct monetization of more professional flow
    - Actual take rate by cohort undisclosed
  - - Partner fees
    - Perp markets up to 10 bps and spot up to 1% via integrator configuration
    - Revenue can be layered through distribution partners
    - Adoption and average fee capture unknown
  - - Public-pool operator fee
    - Profit-share based operator compensation
    - Managed-capital packaging can monetize without pure trading fees
    - Protocol share of those economics unclear
  - - LIT-linked benefits
    - 1 LIT staked unlocks up to 10 USDC LLP access
    - Token utility can support monetization and retention
    - Need separation of protocol economics from token speculation
  notes: Public pricing is clear enough to map mechanics, but not to derive realized ARPU or gross margin.
