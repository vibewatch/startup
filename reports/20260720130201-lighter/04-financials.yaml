- id: traction-fee-proxies-and-unit-economics
  title: Traction, Fee Proxies, and Unit-Economics
  body: 'Public traction proxies are strong but incomplete. FinanceFeeds’ late-2025 funding coverage cited company data of about $279.5 billion of trailing 30-day volume and roughly $1.15 billion of TVL, while DefiLlama’s access-date page showed heavy recent activity and its public fees and revenue APIs provide real time-ish monetization proxies. On 2026-07-20, the fees endpoint showed about $38,043 of 24-hour fees and $2.66 million over 30 days, while the revenue endpoint showed about $32,677 of 24-hour revenue and roughly $2.04 million over 30 days. Those figures indicate that Lighter is generating meaningful protocol-level economic activity even while retail list pricing is zero.


    But these are still proxies, not audited financials. They do not reveal customer-acquisition cost, sales efficiency, paid partner economics, or the share of activity driven by incentives, APIs, or one-off market volatility. Nor do they provide standard SaaS-style measures such as ARR, NRR, or gross margin. The right interpretation is that Lighter has public evidence of monetizable flow, not that it has public evidence of revenue quality. Investors can underwrite economic potential; they cannot yet underwrite mature unit economics from public sources alone.'
  claimRefs:
