- id: capital-formation-valuation-and-stakeholders
  title: Capital Formation, Valuation, and Stakeholders
  body: 'The capital story is the clearest part of the company overview. Yahoo/Fortune, The Block, FinanceFeeds, Wilson Sonsini, Crunchbase, and Tracxn all support the same late-2025 step-up: Lighter announced a $68 million round on November 11, 2025, led by Founders Fund and Ribbit Capital, at an implied roughly $1.5 billion fully diluted valuation. The Block and Fortune add that Haun Ventures and Robinhood participated, while Wilson Sonsini confirms the date and financing headline from the company’s own legal counsel. FinanceFeeds and Tracxn further report that a previously undisclosed earlier round lifts total capital raised to roughly $89-90 million.


    That financing mattered because it came after a year in which perpetual DEX volumes exploded and Lighter moved from beta experiment to serious market-share contender. But there is still a material gap between the valuation mark and the public disclosure package. The round reportedly included equity plus token warrants, and Tracxn pegs the business as Series B, yet no public source reviewed here provides ownership percentages, liquidation preferences, governance rights, or a clean reconciliation between equity value and token-linked optionality. Investors can take the round as real and high-signal; they cannot underwrite the full capital structure from public evidence alone.'
