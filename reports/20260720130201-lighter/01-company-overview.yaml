    - QO026
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: Entity-detail confirmation for Elliot Technologies, Inc. including incorporation date, state, and registered agent.
    whyItMatters: The terms page names the operating entity, but corporate-registry confirmation is still incomplete in public fetches.
    diligencePath: Pull official Delaware entity detail and certificate-of-good-standing documents directly from the corporate registry.
    relatedQuestionRefs:
    - QO008
  - type: conflicting-data
    severity: material
    topic: metric-reconciliation
    missingEvidence: A reconciled explanation for the gap between late-2025 TVL claims and the lower 2026 access-date DefiLlama chain-bucket snapshot.
    whyItMatters: Liquidity quality and valuation support depend on understanding whether the gap reflects timing, methodology, or deterioration.
    diligencePath: Obtain company-defined TVL methodology, historical snapshots, and chain-level wallet mapping; compare with DefiLlama adapter logic.
