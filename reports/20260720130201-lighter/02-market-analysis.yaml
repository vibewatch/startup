- id: growth-drivers-constraints-and-what-makes-the-market-hard
  title: Growth Drivers, Constraints, and What Makes the Market Hard
  body: 'The strongest growth drivers are structural. Traders have more reason than before to tolerate on-chain UX when the reward is transparent execution, self-custody, and lower counterparty risk. Lighter’s zero-fee retail pricing, verified-matching pitch, and widening market set help it benefit from that migration. Expansion into RWA-linked markets and RFQ-style large-size trading is especially important because those features differentiate Lighter from a pure crypto-perps clone and raise the chance of capturing higher-value flow.


    The constraints are just as real. The on-chain perpetuals market is still concentrated, with Hyperliquid setting the liquidity benchmark and rival venues using aggressive incentives to buy share. CleanSky explicitly warns that volume alone can be incentive-inflated, which is why open interest matters. Regulation is also not theoretical: the CFTC has already said smart contracts do not make unlawful digital-asset derivatives lawful, while SIFMA and FinCEN-linked guidance keep AML, KYC, and fragmentation questions open. For Lighter, the hard part of the market is not proving that demand exists; it is proving that the demand can be retained with enough depth, compliance discipline, and product breadth to justify premium valuation when incentives cool.'
