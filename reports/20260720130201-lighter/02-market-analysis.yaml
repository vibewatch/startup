chapter:
  number: 2
  title: Market Analysis
  summary: Lighter competes in the fast-growing on-chain perpetual futures market rather than in generic crypto exchange or broad DeFi categories. Public market data shows decentralized perpetuals expanding from a niche to a meaningful share of global derivatives activity in 2025-2026, while Lighter is also pushing into adjacent RWA and large-ticket execution niches. The opportunity is large enough to support a unicorn outcome, but the realistic underwriteable market is the subset of global perps that migrates on-chain without being blocked by liquidity concentration, regulatory constraints, or incentive-driven churn.
sections:
- id: market-boundary-and-what-lighter-is-actually-selling
  title: Market Boundary and What Lighter Is Actually Selling
  body: 'The right market boundary for Lighter is not all crypto trading and not even all decentralized exchanges. Lighter’s own documents place it inside a narrower and more technically demanding category: on-chain leveraged trading, initially perpetual futures, delivered through a verified order-book architecture on Ethereum Layer 2. The homepage and docs frame the product around verifiable matching, liquidations, and low-latency performance, while the market-facing product set now includes RWA markets, public pools, and perpRFQ for large-size orders. That means the closest substitutes are perpetual DEXs and adjacent high-performance derivatives venues rather than spot-only DEX aggregators.


    The boundary also expands at the edges. By 2026, Lighter is clearly trying to move beyond pure crypto-perps flow into cross-asset and structured-liquidity use cases. Even so, the current economic engine still sits in leveraged trading volume and liquidity participation. In practical underwriting terms, Lighter is selling exchange performance, self-custody, and transparency to users who would otherwise trade on Hyperliquid, dYdX, GMX, Drift, Aster, or centralized futures venues.'
