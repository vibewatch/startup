- id: market-size-and-adoption-trajectory
  title: Market Size and Adoption Trajectory
  body: 'The most credible sizing lens starts with perpetuals, not DeFi in the abstract. CoinGecko’s 2025 annual report says top-10 perpetual DEX volume reached $6.7 trillion in 2025, up 346% from 2024, while the perp DEX to perp CEX ratio rose to 7.8% from 2.5% a year earlier. VanEck describes an even sharper structural shift, saying DEX-to-CEX share in perpetuals more than tripled during 2025. CleanSky’s July 2026 snapshot puts the rolling 30-day on-chain perpetuals market at roughly $576.8 billion, while TokenInsight shows derivatives still made up 82% of overall exchange activity in Q1 2026 despite a market cooldown.


    These figures imply a huge theoretical TAM but a narrower SAM and SOM. TAM is global perpetuals. SAM is the on-chain subset willing to trade with self-custody and protocol-specific execution models. SOM is the share Lighter can actually capture inside order-book-led on-chain perps and adjacent RWA-linked leverage. Because the terms geoblock U.S. users and because liquidity remains concentrated around Hyperliquid, the realistic near-term market is not all derivatives turnover but the portion of on-chain flow that values Ethereum-settled verifiability enough to accept a challenger venue.'
  claimRefs:
