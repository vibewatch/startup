    - API positioning and signer tooling
    - Needs reliable liquidity and operations
  - - Pool participant / liquidity allocator
    - Yield and managed strategy exposure
    - Risk capital allocator
    - Public pools and LIT-linked access
    - Depends on operator quality and risk controls
  - - Integrator / affiliate frontend
    - User acquisition and fee-sharing
    - Distribution budget
    - Partner-program logic and open access
    - Needs stable economics and policy clarity
  - - RWA / large-size trader
    - Access to non-crypto tickers and block execution
    - Prop or sophisticated trader capital
    - RWA docs and perpRFQ
    - Liquidity may be thinner and more event-sensitive
  notes: The buyer map separates user, payer, and distribution roles because Lighter is not just a single-screen retail product.
