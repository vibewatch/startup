- id: buyer-segments-adoption-path-and-budget-owners
  title: Buyer Segments, Adoption Path, and Budget Owners
  body: 'Lighter has multiple user segments, and they do not all buy the same thing. Retail directional traders are attracted by zero standard-account fees, self-custody, and a centralized-exchange-like interface. API and higher-frequency users care more about latency, key management, and deterministic execution, which is why the API documentation discusses account indexes, signer clients, nonce handling, and colocation. A third segment consists of capital allocators and strategy operators using public pools or LLP-linked staking access. A fourth segment is cross-asset or event-driven traders using RWA markets and perpRFQ to source size.


    The adoption path therefore looks more like a layered market than a simple top-of-funnel consumer app. Retail can enter through the frontend, professional users can scale through API connectivity, partners can acquire users through attribution rails, and strategy capital can enter through pools and RFQ workflows. This is strategically helpful because it diversifies demand, but it also means Lighter must satisfy several audiences at once: ease of use for retail, execution quality for professionals, and believable capital-efficiency for partners and pools.'
