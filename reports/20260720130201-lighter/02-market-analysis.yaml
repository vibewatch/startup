- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters
  - Risk if wrong
  rows:
  - - Perp DEX adoption growth
    - Driver
    - CoinGecko, VanEck, CleanSky
    - The category is becoming large enough to support major winners
    - If growth stalls, premium valuations compress
  - - Zero-fee retail pricing
    - Driver
    - Lighter docs and launch coverage
    - Cuts onboarding friction and can accelerate share capture
    - Can attract mercenary flow without durable monetization
  - - RWA and RFQ breadth
    - Driver
    - Lighter RWA and perpRFQ docs
    - Expands beyond pure crypto perps into higher-value niches
    - May not scale if liquidity fragments
  - - Regulatory pressure
    - Constraint
    - CFTC, FinCEN, SIFMA
    - Can shrink addressable users or raise compliance cost
    - A harsh enforcement turn could impair growth
  - - Liquidity concentration
    - Constraint
    - VanEck, CleanSky, clob.ink
    - Top venues benefit from self-reinforcing depth
    - Lighter may struggle to keep serious traders
  - - Incentive sensitivity
    - Constraint
    - CoinGecko, CleanSky
    - Reported volume can outrun durable user intent
    - Share can reverse when rewards change
  notes: Drivers and constraints are paired because the same features that accelerate adoption can also distort the quality of that adoption.
