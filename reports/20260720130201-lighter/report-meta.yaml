companyProfile:
  summary: |
    Lighter is a Miami-based private crypto trading company founded in 2022 and led by founder-CEO
    Vladimir Novakovski. The company built an Ethereum-settled Layer 2 exchange focused on
    decentralized perpetual futures, with custom ZK proof infrastructure, non-custodial exits,
    premium/API trading tiers, partner-routed distribution, public pools, and expanding cross-asset
    / RWA product surfaces. Public-mainnet launch coverage in October 2025 said the platform had
    already reached more than 188,000 registered accounts and about 50,000 daily active users.
    In November 2025, Lighter announced a $68M financing led by Founders Fund and Ribbit Capital at
    roughly a $1.5B valuation, placing it among crypto's late-2025 unicorns.
  foundedDate: '2022-01-01'
  founders:
    - name: Vladimir Novakovski
      role: Founder and CEO
      background: Public sources identify him as the founder-CEO who started Lighter in 2022 and led the company through its mainnet launch and 2025 financing.
      claimRefs: [CO005]
  foundingLocation: Miami, Florida
  headquarters: Miami, Florida
  productSummary: |
    Lighter sells access to a decentralized trading venue: perpetual futures and adjacent cross-asset
    markets executed through a custom proving engine and anchored to Ethereum for settlement and
    exits. The product surface includes zero-fee standard frontend trading, premium/API trading,
    partner-integrator routing, unified trading accounts, multi-asset margin, public pools, and RWA
    / pre-IPO market extensions.
  customerFocus: Retail and professional crypto traders, market makers, partner-integrator frontends, pooled-capital participants, and cross-asset / RWA traders.
  businessModel: Zero-fee standard accounts for retail acquisition, with monetization through premium/API trading fees, partner fee routing, pool-linked economics, and token-linked premium / staking programs.
  stage: Series B / post-unicorn private company
  fundingStatus: $68M November 2025 round at roughly $1.5B valuation; total reported funding about $89-90M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO005, CO006, CO008, CO009, CO010, CO012, CO013, CO014, CO015, CO040, CU001, CU002, CU003, CU004, CU005, CI007]

summary:
  headline: |
    Lighter has enough public scale, technical differentiation, and investor validation to merit
    serious continued diligence, but the $1.5B valuation is not fully cleared by public evidence
    because revenue quality, customer concentration, and regulatory durability remain under-disclosed.
