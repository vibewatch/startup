  topStrengths:
    - 'Category-relevant scale: CoinGecko''s 2025 report put Lighter at about $1.3T of annual trading volume, and public activity proxies show the venue is meaningfully live.'
    - 'Technically differentiated architecture: Ethereum-settled, non-custodial trading with custom ZK proof infrastructure, documented exit protections, and unusually detailed public mechanism docs.'
    - 'Clear multi-segment product design spanning retail, premium/API, partner, pool, and cross-asset / RWA workflows.'
    - 'Elite investor validation through the November 2025 round led by Founders Fund and Ribbit Capital.'
    - 'Visible control surface: security disclosure policy, security.txt, public audits, documented pricing / liquidation logic, and staged collateral controls.'
  topRisks:
    - 'Regulatory perimeter risk is severe for a derivatives-focused DEX, especially as Lighter expands into RWA and pre-IPO style markets.'
    - 'Public financial evidence still relies on external proxy metrics rather than audited revenue, margin, burn, or runway disclosure.'
    - 'Economics may be concentrated in premium, API, market-maker, or partner-routed cohorts despite broad retail acquisition.'
    - 'Operational trust still depends on sequencer, oracle, liquidity, and proving-stack performance under stress, without public uptime or incident-history reporting.'
    - 'The 2025 valuation can look stretched if monetization durability or regulatory resilience proves weaker than the strategic story implies.'
  unresolvedGaps:
    - 'Revenue mix, realized take rates, gross margin, and audited company financials are not public.'
    - 'Customer concentration, retention, and cohort durability by standard, premium, API, partner, and pool segments are not public.'
    - 'Outside-counsel regulatory analysis for perpetuals, RWAs, and pre-IPO markets is not public.'
    - 'Public incident history, latency / uptime reporting, and detailed audit-remediation evidence are not available.'
    - 'Cap-table, liquidation preferences, treasury composition, and runway remain undisclosed.'

