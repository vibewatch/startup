  topStrengths:
    - 品类相关规模：CoinGecko 2025 年报告认为 Lighter 年交易量约 $1.3T，公开活动代理指标也显示交易场所已具备实质活跃度。
    - 技术架构差异化：交易在 Ethereum 结算、非托管，配有自定义 ZK 证明基础设施、成文退出保护，以及少见详尽的公开机制文档。
    - 产品设计横跨多个客群：零售、premium/API、partner、pool，以及 cross-asset / RWA 工作流。
    - 2025 年 11 月由 Founders Fund 和 Ribbit Capital 领投的一轮融资，提供了顶级投资人背书。
    - 控制面可见：安全披露政策、security.txt、公开审计、成文定价 / 清算逻辑，以及分阶段抵押品控制。
  topRisks:
    - 面向衍生品的 DEX 监管边界风险很高，Lighter 向 RWA 和 pre-IPO 风格市场扩张后尤其如此。
    - 公开财务证据仍依赖外部代理指标，而不是经审计收入、利润率、烧钱速度或现金跑道披露。
    - 即便零售获客广，经济性也可能集中在 premium、API、做市商或合作伙伴导流队列。
    - 运营信任仍要靠 sequencer、oracle、流动性和证明栈在压力下扛住，但公开资料没有 uptime 或事故历史报告。
    - 如果变现耐久性或监管韧性弱于战略叙事，2025 年估值就可能显得偏高。
  unresolvedGaps:
    - 收入结构、实际 take rates、毛利率和经审计公司财务均未公开。
    - 按 standard、premium、API、partner 和 pool 分层的客户集中度、留存和队列耐久性未公开。
    - 针对永续合约、RWA 和 pre-IPO 市场的外部律师监管分析未公开。
    - 公开事故历史、latency / uptime 报告和详细审计整改证据均不可得。
    - 股权结构表、清算优先权、金库构成和现金跑道仍未披露。
