- id: adoption-trajectory-and-activation-proof
  title: Adoption Trajectory and Activation Proof
  body: 'The strongest public adoption evidence comes from the mainnet transition and on-chain activity proxies. Independent launch coverage said Lighter moved from roughly 100 traders in beta to more than 188,000 registered accounts and over 50,000 daily active users by the time public mainnet launched in October 2025. FinanceFeeds separately reported that invite-only access and capped deposits were removed at launch, turning Lighter from a gated beta product into an open venue. On the current-access side, DefiLlama showed 8,003 active addresses and about 1.07 million transactions over 24 hours on the run date, while CoinGecko continues to track the venue as a meaningful exchange surface. None of these figures alone prove paying-customer quality, but together they clearly show that Lighter has moved beyond a trivial testnet-style user base.


    The official incentive surfaces reinforce that conclusion. Retail points, market-maker points, liquidity-partner rewards, LIT fee credits, and funding-rate rebates all suggest that the company is actively managing distinct behavior loops by segment. That can be interpreted two ways. On the positive side, it means the team has instrumented customer acquisition, liquidity depth, and cross-asset usage. On the adverse side, it means public adoption may still be partially subsidy-shaped. Public evidence supports real activation and breadth; it does not yet fully distinguish durable organic use from incentive-sensitive use.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
