    - Acquisition can rise faster than revenue quality
    - Official app surfaces exist
    - Request channel-level MAU and fee mix
  - - Premium and staking-linked upgrades
    - Economics may cluster in a small pro cohort
    - Customer concentration could be hidden by free retail headline
    - Fee credits and premium-only programs are documented
    - Request revenue by standard vs premium/API cohort
  - - Partner distribution
    - Embedded frontends can accelerate reach
