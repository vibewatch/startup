- id: segment-level-customer-proof-is-stronger-than-logo-proof
  title: Segment-Level Customer Proof Is Stronger Than Logo Proof
  body: 'Traditional diligence often wants named logos, production deployments, and measured outcomes. Lighter mostly offers a different kind of proof. The strongest evidence is segment-level and mechanism-level: there are documented reward programs for market makers, official fee and rebate programs for premium accounts and RWA traders, partner approval flows for embedded frontends, and public-pool tooling for operator-managed capital. Those are not generic marketing claims; they are operational mechanics that would not exist unless the company expected those customer types to matter. The RWA and pre-IPO documentation also shows that Lighter is deliberately courting traders who want exposure beyond headline crypto assets, including synthetic access to commodities, FX, tech equities, and private-market names.


    That said, the chapter still has to acknowledge what is missing. The reviewed public record does not provide named institutional market-makers, third-party integrator case studies, or depositor outcome reports that would convert this into classic enterprise-grade customer proof. So the right conclusion is not that proof is weak. It is that the proof is structurally different: stronger on observable participant classes and exchange design, weaker on named logos and published outcomes. For a DEX, that is meaningful evidence—but still incomplete evidence.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
