tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Standard frontend traders
    - User and sometimes payer
    - Directional crypto-perp trading
    - Zero-fee standard-account docs plus mainnet growth stats
    - Large acquisition funnel and community depth
    - No public conversion rate into monetized cohorts
  - - Premium / market-making accounts
    - Buyer, user, and payer
    - High-volume trading, liquidity provision, tighter latency / fee tiers
    - Market-maker points and liquidity-partner program docs
    - Likely economically important because paid surfaces sit here
    - No public revenue split
  - - API / integrator-routed clients
    - Integrator plus end trader
    - Programmatic trading through third-party apps
    - Partner integration and attribution docs
    - Distribution leverage without owning all frontends
    - No disclosed partner volumes
  - - Public-pool operators and depositors
    - Operator and capital provider split
    - Managed trading / pooled-capital strategies
    - Public-pools docs
    - Can create stickier capital workflows
    - No pool AUM or operator roster
  - - Cross-asset / RWA traders
    - User and payer
    - Synthetic access to equities, commodities, FX, pre-IPO, and prelaunch markets
    - RWA and pre-IPO/prelaunch docs
    - Broadens TAM beyond plain-vanilla crypto perps
    - No public segment-level retention or revenue
  notes: The segmentation map is built around exchange-participant classes because public DEX evidence rarely names enterprise customers.
