    - Broader catalog may improve expansion
    - Higher-complexity products can be incentive-sensitive and regulatory-sensitive
    - RWA/pre-IPO/prelaunch docs exist
    - Request volume and retention by product family
  notes: Expansion vectors are visible, but public concentration disclosure is weak.
