- id: TU003
  title: Named customer proof table
  columns:
  - Customer / participant class
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome or proof
  - Limitation
  rows:
  - - Retail frontend traders
    - Mass-market traders
    - Zero-fee interface trading plus points participation
    - Production
    - Live public mainnet, active-address and transaction proxies, and ongoing retail reward structure
    - No public retention or paying-user conversion
  - - Premium market makers
    - Liquidity providers / pro traders
    - Tight-spread quoting, maker-volume points, liquidity-partner rewards
    - Production
    - Dedicated points pool, weekly reward pool, and fee / latency upgrade tools
    - No named firms or disclosed share of venue liquidity
  - - API / integrator clients
    - Embedded-distribution users
    - Third-party apps route client orders through approved fee settings
    - Production
    - Permissionless partner flow with max-four-partner approvals per client
    - No named partner case studies or routed-volume data
  - - Public-pool participants
    - Managed-capital depositors and operators
    - Capital pooled under whitelisted operators
    - Production
    - Operator-fee and no-lockup mechanics indicate live participation path
    - No public operator list or AUM
  - - RWA / specialty traders
    - Cross-asset and frontier-market users
    - Trade commodities, FX, equities, pre-IPO, and experimental prelaunch markets
    - Production / early production
    - Documented market catalog and programmatic rebates targeted to these traders
    - No public segment adoption counts
  notes: This enumeration is segment-level because the public record does not provide named enterprise logos or customer-side case studies for Lighter.
