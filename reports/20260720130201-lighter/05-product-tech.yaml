- id: maturity-roadmap-and-technical-gaps
  title: Maturity, Roadmap, and Technical Gaps
  body: 'The documentation set also suggests a product that is shipping quickly. Unified Trading Accounts are available on web now and framed as the first step toward broader spot-collateral support. Multi-asset margin launched first with ETH and conservative caps, implying staged rollout discipline rather than an immediate everything-on model. The self-trade-prevention page documents a live default-behavior change with a timestamp, while the docs sitemap shows frequent 2026 updates across funding, RWA, and execution pages. Mobile and desktop distribution surfaces indicate that Lighter is extending beyond browser-only access. This pattern is consistent with an ambitious venue still in active product expansion.


    The main maturity questions are about scale evidence and dependency depth rather than roadmap activity. Public docs do not quantify sustained throughput, outage history, latency percentiles, or sequencer failover performance. Developers can inspect repositories and SDKs, but public community and package signals still look modest relative to the venue''s claimed scale. Likewise, official security materials are real, but public control disclosure still stops short of enterprise-grade reliability reporting. The right conclusion is that Lighter appears further along technically than many venture-backed DEXs, but there is still a meaningful gap between mechanism transparency and fully proven production maturity.'
