  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Lighter solution
  - Measurable benefit
  - Limitation
  rows:
  - - Take directional perpetual exposure
    - Place market / limit / stop orders on perp markets
    - Order types plus mark-price-linked triggers
    - Closer to pro-trader exchange workflow
    - Public slippage and fill-quality data are unavailable
  - - Work a large order with lower impact
    - Slice execution through TWAP / advanced TWAP
    - Time-based slicing with configurable behavior
    - Potentially lower market impact than single-shot execution
    - No public quantitative execution study
  - - Route flow through a third-party app
    - Client approves an integrator, partner routes orders and collects fees
    - Permissionless partner integration and partner-attribution system
    - Lets Lighter embed into external distribution
    - Unknown real partner penetration
  - - Trade spot and perps with one balance
    - Enable Unified Trading Account
    - Shared USDC balance across spot and perps
    - Simpler capital management
    - Currently web-only and still early-stage
  - - Use existing asset holdings as collateral
    - Deposit supported non-USDC assets into margin balance
    - Multi-Asset Margin with LTV/LT/LF controls
    - Reduces forced USDC conversion for some strategies
    - At launch supports limited assets and conservative caps
  notes: Benefits are product-mechanism benefits, not independently audited user outcomes.
