figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Layered view of how Lighter combines custody, sequencing, proving, APIs, and Ethereum settlement.
  data:
    layers:
    - label: Layer 1 — Ethereum Contracts
      detail: Hold assets, verify proofs, store canonical state root, and enforce exits
    - label: Layer 2 — Sequencer
      detail: Orders transactions FIFO and provides soft finality for exchange operations
    - label: Layer 3 — Matching / Risk Engines
      detail: Execute exchange logic, risk checks, and order-margin controls deterministically
    - label: Layer 4 — Witness Generators + Prover
      detail: Prepare circuit-friendly inputs and generate parallel execution proofs
    - label: Layer 5 — APIs / Apps / Integrations
      detail: Expose low-latency market data and order routing to web, mobile, and partner surfaces
  approximationNotes: The stack condenses several whitepaper and docs components into five functional layers for readability.
