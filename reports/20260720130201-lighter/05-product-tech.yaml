company:
  name: Lighter
chapter:
  number: 5
  title: Product & Technology
  summary: 'Lighter delivers a non-custodial perpetual-trading stack that tries to combine centralized-exchange responsiveness with Ethereum-settled verifiability. Public docs now expose materially more technical detail than many crypto venues publish: a custom proving engine, a sequencer, priority-request exits, detailed liquidation logic, multi-asset margin, and explicit market-integrity controls. That transparency is a product strength. The remaining technical debate is less about whether the architecture exists and more about whether it can sustain scale, mobile distribution, and market integrity without reintroducing central points of failure.'
sections:
- id: product-surface-and-user-jobs
  title: Product Surface and User Jobs
  body: 'Lighter is not just a bare perpetual-order-book interface anymore. The official surfaces now show a broader product bundle aimed at several user jobs. Retail traders get zero-fee frontend trading and now a mobile app, while higher-intensity users can access APIs, partner-routed workflows, unified trading accounts, and non-USDC collateral features. Public docs also show market breadth beyond core crypto pairs through real-world-asset and prelaunch-market documentation, while the apps surface suggests that Lighter is increasingly positioning itself as an ecosystem rather than a single webpage. That matters because it changes the underwriting question from ''is there a product?'' to ''how many workflows can one exchange core support without degrading reliability?''


    At the workflow level, the product aims to make complex derivatives trading feel operationally familiar to pro users while remaining onchain. The docs describe market, limit, stop, TWAP, advanced TWAP, and atomic orders; partner integration for third-party frontends; and unified account architecture intended to bridge spot and perp activity. In other words, Lighter is trying to deliver the feature density of a serious trading venue, not a simple speculative app. The product case is therefore strongest where trading performance, collateral efficiency, and distribution tooling matter more than consumer simplicity alone.'
