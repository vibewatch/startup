      - number: '7.2'
        title: Operational, Security, and Market-Structure Risks Are Real but Partly Mitigated
        blocks:
          - type: paragraph
            body: >-
              Operationally, Lighter looks more serious than a lightly documented DeFi app. The company publishes a
              security-disclosure process, a security.txt contact file, a PGP key, and a multi-report audit surface; its
              docs describe mark-price construction, liquidation states, priority-request exits, and sequencer-driven
              proof generation in unusual detail. These are meaningful mitigants because they make the system more
              inspectable and less obviously ad hoc. They also signal that management knows exchange integrity is a
              product requirement, not just a legal one.


              But the mitigants do not erase core operational dependencies. The architecture still relies on a
              sequencer, proving infrastructure, external oracle inputs, and liquid markets for orderly exits and
              liquidations. RWA pricing can shift from oracle inputs toward internal pricing when feeds go stale, and
              some RWA markets explicitly waive last-oracle price caps. Futures-linked markets roll exposure between
              contracts over time, which introduces model risk on top of basic exchange risk. The technical question is
              therefore not whether the system has safeguards—it does—but whether those safeguards remain robust during
              volatile periods, stale-price events, mobile growth, or incentive-driven surges in activity.
            claimRefs:
              - CR013
