      - number: '8.4'
        title: Final Diligence Asks and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              What would move the call? First, direct financial diligence: revenue mix, true take rates, gross margin,
              burn, and runway. Second, concentration and durability evidence: what share of activity and revenue comes
              from premium/API/market-maker cohorts, and how sticky are those users after incentives normalize? Third,
              legal diligence: product-by-product regulatory analysis for perpetuals, RWA markets, and any pre-IPO
              exposures. Fourth, operational evidence: incident history, stale-price events, and latency or uptime
              reporting. These are not nice-to-haves. They are the difference between underwriting a promising platform
              and underwriting a defensible price.


              The thesis-break conditions are also straightforward. Any concrete enforcement action, persistent
              market-structure failure, or evidence that incentives are masking weak organic retention would justify a
              materially lower valuation or a pass. Conversely, if management can show clean revenue conversion, low
              concentration, strong controls, and credible legal posture, the call can improve quickly. Lighter is
              therefore a company to take seriously, but a price to test hard.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
