      - number: '1.4'
        title: Milestones, Scale, and Disclosure Tensions
        blocks:
          - type: paragraph
            body: >-
              Lighter’s 2025 milestone arc is impressive. Secondary coverage says the protocol spent roughly eight
              months in closed beta, then launched its public Ethereum Layer 2 mainnet in October 2025 with more than
              188,000 accounts and about 50,000 daily active users. The launch also reportedly removed deposit caps and
              invite requirements, even if referral mechanics and points incentives continued. CoinGecko’s 2025 annual
              report then placed Lighter among the top 10 largest perpetual exchanges by annual volume, citing roughly
              $1.3 trillion of 2025 volume and stating that Lighter surpassed Hyperliquid in Q4. FinanceFeeds’ November
              2025 funding coverage adds company-reported scale markers of roughly $279.5 billion in trailing 30-day
              volume and about $1.15 billion in TVL at that time.


              The tension is that the disclosure picture is noisier than the growth picture. CCN still described Lighter
              as invite-only in November 2025, in conflict with launch reporting that access had opened. DefiLlama’s
              access-date snapshot lists much lower current chain-bucket TVL than the November funding-coverage number,
              implying either methodology differences or genuinely fast-moving balances. Combined with the official
              terms’ prohibition on U.S. users despite the company’s Miami identity, the picture is not of fraud but of
              a company scaling faster than its public communications have fully standardized.
