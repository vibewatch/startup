      - number: '1.2'
        title: Leadership, Entity Structure, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              The founder signal is unusually strong, but the governance package is unusually light. Yahoo/Fortune says
              Vladimir Novakovski founded Lighter in 2022, serves as CEO, entered Harvard at 16, graduated early, and
              began working at Citadel at age 18. That profile helps explain why Lighter’s external narrative mixes
              quantitative trading, low-latency systems, and crypto-market structure rather than consumer-crypto
              branding. It is plausible founder-market fit for building a derivatives venue. At the same time, public
              materials reveal much less about the broader executive bench, the board, committee structure, investor
              control rights, or exact beneficial ownership than an investor would typically expect at a $1.5 billion
              valuation.


              The official terms identify Elliot Technologies, Inc. as the service provider, but the company does not
              publicly foreground a full corporate profile page with officer roster, incorporation details, or
              governance documents. Delaware and Florida registry search surfaces are available, yet the public fetches
              here do not resolve a clean entity-detail record for Lighter beyond those search portals and the
              terms-page entity name. The result is a split picture: strong technical-founder credibility and clear
              product leadership, but material diligence gaps around legal domicile, board oversight, cap-table control,
              and whether the corporate wrapper has matured as quickly as the protocol narrative.
