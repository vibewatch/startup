      - number: '3.3'
        title: Switching Costs, Moat, and Where Lighter’s Edge Is Real
        blocks:
          - type: paragraph
            body: >-
              Lighter’s real edge is not simply 'better tech.' It is a combination of Ethereum settlement, ZK-verifiable
              execution, zero-fee retail acquisition, and a design that tries to preserve centralized-exchange
              responsiveness while remaining non-custodial. That can matter to users who want transparent matching and
              liquidations without leaving the Ethereum ecosystem. The adjacent RWA and RFQ products also raise the
              possibility of more differentiated, stickier flow than generic crypto-perp speculation.


              The problem is that perpetual DEX moats are rarely static. VanEck describes Hyperliquid’s moat as
              liquidity depth plus a reflexive fee-to-buyback flywheel. CleanSky and clob.ink both show that market
              share can move quickly when incentives, volume, or new product surfaces change. Lighter’s switching costs
              are therefore real but incomplete. API users, integrators, and pool operators may build process around the
              venue. Yet if order-book depth, funding, or collateral efficiency lag peers, even technically satisfied
              users can move capital. The right view is that Lighter has meaningful product differentiation but not yet
              an unassailable competitive moat.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
