            body: >-
              Lighter is not just a bare perpetual-order-book interface anymore. The official surfaces now show a
              broader product bundle aimed at several user jobs. Retail traders get zero-fee frontend trading and now a
              mobile app, while higher-intensity users can access APIs, partner-routed workflows, unified trading
              accounts, and non-USDC collateral features. Public docs also show market breadth beyond core crypto pairs
              through real-world-asset and prelaunch-market documentation, while the apps surface suggests that Lighter
              is increasingly positioning itself as an ecosystem rather than a single webpage. That matters because it
              changes the underwriting question from 'is there a product?' to 'how many workflows can one exchange core
              support without degrading reliability?'


              At the workflow level, the product aims to make complex derivatives trading feel operationally familiar to
              pro users while remaining onchain. The docs describe market, limit, stop, TWAP, advanced TWAP, and atomic
              orders; partner integration for third-party frontends; and unified account architecture intended to bridge
              spot and perp activity. In other words, Lighter is trying to deliver the feature density of a serious
              trading venue, not a simple speculative app. The product case is therefore strongest where trading
              performance, collateral efficiency, and distribution tooling matter more than consumer simplicity alone.
