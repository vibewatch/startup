      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The core architecture is unusually explicit by private-crypto standards. The technical architecture page
              and whitepaper describe a system in which Ethereum is the settlement anchor, smart contracts hold assets
              and the canonical state root, and a custom proving engine generates succinct proofs for exchange-state
              transitions. A sequencer provides first-in-first-out ordering and soft finality, API servers expose
              low-latency data, witness generators prepare circuit inputs, and the prover plus aggregation engine
              compress many execution proofs into a single batch proof that is verified on Ethereum. That is a coherent
              design for a performance-sensitive exchange that still wants strong public verifiability.


              Several other public docs fill in the operating details that make the architecture more credible.
              Order-matching docs show not only user-facing order types but also post-trade risk checks and order-margin
              logic. Fair-price-marking docs show how impact prices, index prices, and external centralized-exchange
              marks are combined to limit manipulation. Funding and liquidation docs explain hourly funding,
              pre-liquidation states, zero-price formulas, and the LLP insurance fund / ADL backstop. Together, these
              sources suggest that Lighter has documented more than marketing-level architecture; it has published
              enough mechanism detail to let sophisticated users understand how the exchange should behave under stress.
