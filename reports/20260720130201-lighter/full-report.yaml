  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the Public Record Supports About the Price
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor is the November 2025 financing: multiple sources support a $68
              million round at roughly a $1.5 billion implied valuation, with total capital raised around $89-90
              million. That price was not set in a vacuum. Independent market research put Lighter at about $1.3
              trillion of annual trading volume in 2025, and both market-wide and competitor-specific sources show that
              decentralized perpetual trading gained material share during 2025. Public activity proxies and revenue
              proxies also show a real business, not an empty token shell. Those are all legitimate reasons why
              investors were willing to pay a unicorn-plus price for an exchange infrastructure company.


              The problem is not that the mark is obviously absurd. The problem is that the most important underwriting
              bridge from usage to durable company value is still missing. Public sources do not show audited revenue,
              margin, retention, or customer concentration. DefiLlama’s fee and revenue endpoints are useful, but they
              are still external methodology-based proxies rather than management financials. So the round price is best
              understood as an informed private-market bet on category leadership, product differentiation, and future
              monetization—not as a price the public evidence can fully verify on its own.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
