  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the Customers Are and How They Pay
        blocks:
          - type: paragraph
            body: >-
              Lighter’s customer base is best understood as a stack of user classes rather than a list of enterprise
              logos. The most obvious users are self-directed traders who access the frontend and, according to the
              official fee schedule, can trade with zero maker and taker fees on standard accounts. But the docs reveal
              several other economically important segments. Premium accounts, market makers, and API users sit on a
              more monetizable tier through trading fees, staking-linked benefits, fee credits, and programmatic
              routing. Integrators can embed Lighter into their own frontends, while public pools let operators manage
              third-party capital under profit-sharing economics. RWA, pre-IPO, and prelaunch-market docs imply another
              segment: traders looking for differentiated cross-asset exposure rather than only crypto-beta speculation.


              That segmentation matters for diligence because buyer, user, and payer are not always the same person. A
              retail trader is both user and payer only if they upgrade or interact with paid surfaces. In an integrator
              workflow, the end trader is the user while a partner captures and remits economics. In public pools, the
              depositor provides capital while an operator controls strategy. The customer chapter therefore needs to
              evaluate Lighter as a multi-segment exchange ecosystem, not just a single retail trading app.
            claimRefs:
