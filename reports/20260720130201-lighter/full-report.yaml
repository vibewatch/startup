        title: Trust, Security, and Market-Integrity Controls
        blocks:
          - type: paragraph
            body: >-
              Trust controls are a major part of the product promise because Lighter is asking traders to believe not
              just its user interface but its matching logic, liquidation behavior, APIs, and mobile flows. The public
              trust surface is stronger than average for a private DEX. Lighter publishes a vulnerability-disclosure
              policy with safe-harbor language, PGP key material, in-scope assets, and expected triage behavior. It also
              publishes a security-audits page listing multiple 2025 audit reports across core, bridge, wrapper, exit,
              and spot-related components. Independent coverage further says the company open-sourced its zero-knowledge
              proof circuits after those audits, which materially improves inspectability for technically sophisticated
              users.


              Operational controls are also visible inside the trading docs. Self-trade prevention is documented
              explicitly, including a default-rule change effective in May 2026. Fair-price marking uses a blend of
              impact prices, oracles, and external exchange marks to resist manipulation. The liquidation docs describe
              staged health states rather than a black-box margin call. Still, trust remains partly incomplete. There is
              no public uptime page, SOC 2-style control report, or public incident history in the reviewed sources. The
              product therefore looks technically serious and control-aware, but still not institutionally transparent
              in the way mature public-market infrastructure vendors often are.
