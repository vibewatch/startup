      - number: '7.4'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The good news is that Lighter already has several real mitigants: explicit perimeter restrictions,
              published audits, a structured security intake process, conservative collateral caps, documented risk
              formulas, and onchain exit protections. Those reduce the probability that the business is casually
              ignoring key failure modes. The less good news is that the most investment-relevant risks are the ones
              public materials cannot fully clear. No public license position, no incident-history dashboard, no
              customer concentration disclosure, and no public treasury data mean a committee still has to rely on
              management diligence for several thesis-critical answers.


              The right kill criteria should therefore be concrete. A formal enforcement action or a clear regulatory
              interpretation covering Lighter’s core products would materially worsen the thesis. Repeated outages,
              stale-price episodes, or visible ADL/liquidation problems would weaken the trust proposition.
              Deterioration in market-maker support or evidence that incentives are masking organic retention would
              weaken the customer-quality story. In other words, Lighter’s risk picture is not abstract: it is
              monitorable, but it is only partly monitorable from public sources today.
            claimRefs:
