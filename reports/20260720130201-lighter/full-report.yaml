  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and What Is Publicly Monetized
        blocks:
          - type: paragraph
            body: >-
              Lighter is not a classic transaction-fee exchange in the simplest sense. The public docs show a
              deliberately segmented monetization design. Standard accounts trade with zero maker and taker fees, which
              means the platform is using free access as an acquisition lever for retail flow. Premium accounts, by
              contrast, do pay maker and taker fees and can earn discounts through LIT staking. The partner-attribution
              program also allows third-party integrators to build frontends on top of Lighter and configure fees within
              global limits, while public pools create an operator-fee layer on managed capital. The LIT utility page
              adds another dimension: token staking grants LLP-linked access and the protocol says trading-fee revenue
              funds buybacks.


              The result is a multi-stream revenue model even before fully disclosed financial statements exist. Some
              revenue appears to come from direct trading fees on premium or API-driven activity, some from operational
              fees around transfers or withdrawals according to DefiLlama methodology notes, and some from partner
              economics or token-linked features. That is strategically interesting because it reduces dependence on a
              single retail-taker-fee schedule. It also makes analysis harder, because public pricing is visible while
              realized revenue mix is not.
