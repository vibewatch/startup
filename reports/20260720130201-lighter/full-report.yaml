              million over 30 days. Those figures indicate that Lighter is generating meaningful protocol-level economic
              activity even while retail list pricing is zero.


              But these are still proxies, not audited financials. They do not reveal customer-acquisition cost, sales
              efficiency, paid partner economics, or the share of activity driven by incentives, APIs, or one-off market
