chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Current Positioning
        blocks:
          - type: paragraph
            body: >-
              Lighter’s official surfaces consistently describe the product as a decentralized exchange and trading
              platform built on custom zero-knowledge infrastructure anchored to Ethereum. The homepage emphasizes zero
              fees, verifiable matching and liquidations, and exchange-grade performance, while the docs introduction
              describes Lighter as the first exchange to offer verifiable order matching and liquidations with
              performance comparable to traditional exchanges. The terms page adds the most important legal precision:
              Elliot Technologies, Inc. operates the website-hosted interface, API, LIT token surfaces, and related
              services, while the protocol itself is framed as autonomous software running on a Layer 2 Ethereum
              blockchain. That distinction matters because the investment target is not only a protocol brand but also a
              corporate wrapper with compliance, IP, hiring, and fund-raising responsibilities.


              Public company-profile sources are directionally consistent but not fully official. Yahoo/Fortune, Tracxn,
              Crunchbase’s November 2025 unicorn board, and Gaebler all place Lighter in Miami and identify Vladimir
              Novakovski as founder-CEO. The company appears best understood as a post-unicorn, still-private
              market-structure bet: a corporate entity building exchange infrastructure, an Ethereum-settled L2 network,
              and a user-facing DEX brand. The unresolved issue is not what Lighter does, but how much legal-entity and
              governance detail it is willing to expose relative to the scale narrative surrounding it.
