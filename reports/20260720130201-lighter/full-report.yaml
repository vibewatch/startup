  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Lighter Is Actually Selling
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Lighter is not all crypto trading and not even all decentralized exchanges.
              Lighter’s own documents place it inside a narrower and more technically demanding category: on-chain
              leveraged trading, initially perpetual futures, delivered through a verified order-book architecture on
              Ethereum Layer 2. The homepage and docs frame the product around verifiable matching, liquidations, and
              low-latency performance, while the market-facing product set now includes RWA markets, public pools, and
              perpRFQ for large-size orders. That means the closest substitutes are perpetual DEXs and adjacent
              high-performance derivatives venues rather than spot-only DEX aggregators.


              The boundary also expands at the edges. By 2026, Lighter is clearly trying to move beyond pure
              crypto-perps flow into cross-asset and structured-liquidity use cases. Even so, the current economic
              engine still sits in leveraged trading volume and liquidity participation. In practical underwriting
              terms, Lighter is selling exchange performance, self-custody, and transparency to users who would
              otherwise trade on Hyperliquid, dYdX, GMX, Drift, Aster, or centralized futures venues.
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
