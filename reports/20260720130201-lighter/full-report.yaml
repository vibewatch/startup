  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who Actually Competes With Lighter
        blocks:
          - type: paragraph
            body: >-
              Lighter’s competitive set is not every exchange that lists crypto. The direct peers are high-performance
              on-chain perpetual venues that promise some mix of self-custody, low latency, and deep leverage.
              Hyperliquid is the clearest benchmark because it already combines large-scale liquidity, an
              order-book-first experience, and a strong value-capture flywheel. dYdX remains relevant as an established
              decentralized perpetual platform with its own chain and deep market breadth. GMX matters because it
              embodies the pool-and-oracle model rather than the order-book model, showing that many traders do not
              insist on the same architecture if liquidity and simplicity are good enough. Drift matters because it
              shows Solana-native performance and institutional-grade messaging can support a multi-product trading hub.
              Aster matters because it is pushing a multi-chain, privacy, high-throughput narrative that overlaps with
              Lighter’s ambition to go beyond simple crypto perps.


              That direct set should be separated from adjacencies such as centralized futures venues, because serious
              traders will still benchmark against CEX execution even when they prefer on-chain custody. The
              underwriting question is not whether Lighter has competitors, but which competitor class wins if users
              prioritize scale, fees, product breadth, or trust.
            claimRefs:
