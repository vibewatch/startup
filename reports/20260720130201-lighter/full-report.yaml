      - number: '8.3'
        title: Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The evidence-backed recommendation is not a hard pass, but it is also not a clean buy at the public mark.
              Lighter has three things many startups do not: visible market scale, a technically differentiated product
              story, and blue-chip investor validation. The anti-thesis is equally strong: regulatory perimeter risk is
              severe, customer durability remains partly unproven, and public revenue-quality evidence is too thin to
              underwrite margin path confidently. Those tensions lead to a middle recommendation. The company is
              attractive enough to stay engaged with, but the current public-evidence package does not justify treating
              the $1.5 billion valuation as plainly cheap.


              Accordingly, the best stance is research more / track with medium confidence and a high risk rating. In a
              bull case—continued share gains, successful premium/API monetization, stable regulation, and durable RWA
              expansion—the 2025 mark could look fair or even conservative. In a base case, it looks roughly full to
              modestly stretched. In a bear case, where legal friction rises or economics prove concentrated and
              incentive-sensitive, it can look meaningfully rich. The price is therefore not disproven, but it is not
              yet cleared.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV027
              - CV032
              - CV033
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV021
