      - number: '8.2'
        title: Comparable Set and Scenario Logic
        blocks:
          - type: paragraph
            body: >-
              Comparable work for Lighter is inherently messy because no single peer is cleanly right. Public exchange
              equities such as Coinbase, Robinhood, CME Group, and Interactive Brokers are much larger, regulated, and
              more diversified than a private DEX. Tokenized onchain venues such as Hyperliquid, GMX, dYdX, and Gains
              Network are closer in product spirit, but token market caps and FDVs are not the same thing as
              private-company enterprise value. That means the comparable set can frame valuation, but it cannot settle
              it. Its biggest value is showing dispersion: high-quality exchange or trading assets can be worth a great
              deal, but market value also spreads massively based on liquidity leadership, regulation, monetization
              quality, and product breadth.


              On that basis, Lighter’s 2025 mark sits in the middle of an unusually wide band. It is far below mature
              public trading infrastructure companies and well below Hyperliquid’s current public-token value, but well
              above smaller onchain-derivatives-token comps. That is directionally coherent if one believes Lighter has
              a real shot at becoming a durable top-tier onchain venue. It becomes harder to defend if one assumes
              monetization remains narrow, regulation tightens, or customer economics prove concentrated in a small pro
              cohort. The scenario work therefore has to be explicitly assumption-driven rather than fake-precise.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
