      - number: '7.3'
        title: Partner, Dependency, Financial, and Execution Risk Sit Beneath the Regulatory Layer
        blocks:
          - type: paragraph
            body: >-
              Below the legal layer, the next risk cluster is dependence on other actors and on incentive-sensitive
              market structure. Lighter’s books need professional liquidity. The liquidity partner program, market-maker
              points, and premium-only fee or rebate tools all indicate that a meaningful share of quality and economics
              may be driven by a narrower pro cohort rather than by broad retail participation. Public pools create
              another dependency on operators and depositors, while partner routing adds a distribution layer that may
              eventually concentrate in a small number of integrators. This is not unusual for an exchange, but it does
              mean customer breadth can look healthier than underlying economic concentration.


              Financial and execution risks compound the dependency story. Lighter raised substantial capital in late
              2025, which reduces immediate financing pressure, but public burn, runway, treasury, and incident-cost
              data remain unavailable. The terms also reserve broad discretion to change or discontinue interface
              features and promotional programs. For a fast-moving private venue, that may be operationally sensible.
              From an investor perspective, it means several important risks—liquidity durability, incentive efficiency,
              capital intensity, and governance discipline—still require direct diligence rather than inference from
              surface-level traction.
            claimRefs:
              - CR025
