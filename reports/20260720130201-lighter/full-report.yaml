      - number: '3.4'
        title: Why Share Can Shift Fast in On-Chain Perps
        blocks:
          - type: paragraph
            body: >-
              On-chain perpetuals are unusually sensitive to reflexive loops. Better liquidity attracts more traders;
              more traders create tighter books and more volume; more volume funds better incentives or token economics;
              and the resulting narrative pulls in the next wave of users. Hyperliquid’s dominance is the clearest
              example, but the same dynamic can temporarily lift challengers such as Aster or Lighter when fee design
              and incentives align with trader sentiment. CoinGecko, CleanSky, and clob.ink all show that Lighter
              already became large enough to matter, yet still remains far smaller than the category leader on the
              hardest-to-fake liquidity measures.


              That means Lighter’s competitive risk is not just that bigger players exist. It is that buyer preferences
              can re-rank quickly around one or two decisive variables: fee burden, open interest, collateral
              efficiency, asset breadth, or regulatory comfort. The most credible anti-thesis for Lighter is
              commoditization inside a market where traders are loyal only as long as the books, tools, and incentives
              stay superior. The most credible pro-thesis is that its Ethereum-based, verifiable, zero-fee design plus
              cross-asset expansion creates a distinct enough lane to retain a high-value subset of the market even
              without becoming the absolute category leader.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
