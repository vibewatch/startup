  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Is the Top-Ranked Risk
        blocks:
          - type: paragraph
            body: >-
              For a derivatives-focused DEX, legal and regulatory risk has to rank first. Lighter’s own terms make clear
              that the service is unavailable in the United States and other major jurisdictions, and the broader
              regulatory backdrop explains why. The CFTC has already pursued DeFi derivatives platforms and has said
              explicitly that novel smart-contract structures do not make unlawful derivatives trading lawful. FinCEN’s
              convertible-virtual-currency guidance keeps AML and money-transmission questions alive for certain crypto
              business models. The SEC remains relevant too, not only because of general crypto-jurisdiction questions
              but because Lighter is extending into RWA, equity-linked, and pre-IPO-style markets that can widen the
              number of regimes potentially implicated.


              This does not mean Lighter is doomed. It does mean the company operates inside a moving perimeter where
              product breadth can raise legal complexity faster than product-market fit creates strategic safety. The
              strongest mitigating fact is that Lighter has explicit restriction language and seems conscious of
              perimeter risk. The strongest adverse fact is that U.S. precedent suggests geoblocking and disclaimers
              alone may not be enough if regulators believe prohibited users can still gain access or if the product is
              deemed to sit inside a registration regime. That asymmetry is the core legal risk to underwrite.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
