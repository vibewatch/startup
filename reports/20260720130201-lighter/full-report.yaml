        title: Exhibits
        blocks:
          - type: callout
            title: The 2025 Price Is Plausible, Not Yet Cleared
            body: >-
              Lighter’s $1.5 billion mark fits a strong strategic narrative, but the public record still leaves too much
              uncertainty on monetization quality and regulatory durability for a clean buy call.
