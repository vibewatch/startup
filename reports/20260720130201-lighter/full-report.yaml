            body: >-
              Durability is the hardest part of the customer story. There is no public NRR, GRR, churn, or renewal data,
              and there are no clear public disclosures of how much volume or fee generation comes from retail frontend
              users versus premium/API market participants. That matters because Lighter’s zero-fee standard-account
              design makes top-of-funnel adoption easier, but it also raises the possibility that a disproportionate
              share of economics comes from a smaller set of premium traders, market makers, or partner-routed clients.
              The market-maker, fee-credit, and funding-rebate programs make strategic sense; they also highlight where
              customer concentration might sit.


              There are also access and jurisdiction constraints that shape the customer base. The terms page explicitly
              excludes the United States and several other major jurisdictions, while the invite-only narrative lingered
              in some late-2025 coverage even after public mainnet. Those constraints do not negate adoption, but they
              do affect who can realistically use the venue and how fast distribution can broaden. Lighter therefore has
              clear evidence of acquisition and segment breadth, partial evidence of expansion loops, and only weak
              public evidence on durability and concentration. That is good enough to underwrite real usage, but not
              enough to underwrite customer-quality permanence.
