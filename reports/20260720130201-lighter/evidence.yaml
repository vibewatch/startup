evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Board roster, committee structure, shareholder rights, and preference stack for the November 2025 financing.
    whyItMatters: >-
      A $1.5 billion private valuation cannot be fully underwritten without governance and downside-protection
      visibility.
    diligencePath: Request board materials, cap-table summary, financing documents, and investor-rights agreement.
    relatedQuestionRefs:
      - QO009
      - QO026
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: >-
      Entity-detail confirmation for Elliot Technologies, Inc. including incorporation date, state, and registered
      agent.
    whyItMatters: >-
      The terms page names the operating entity, but corporate-registry confirmation is still incomplete in public
      fetches.
    diligencePath: >-
      Pull official Delaware entity detail and certificate-of-good-standing documents directly from the corporate
      registry.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: metric-reconciliation
    missingEvidence: >-
      A reconciled explanation for the gap between late-2025 TVL claims and the lower 2026 access-date DefiLlama
      chain-bucket snapshot.
    whyItMatters: >-
      Liquidity quality and valuation support depend on understanding whether the gap reflects timing, methodology, or
      deterioration.
    diligencePath: >-
      Obtain company-defined TVL methodology, historical snapshots, and chain-level wallet mapping; compare with
      DefiLlama adapter logic.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: access-status
    missingEvidence: Standardized company statement on whether any invite gating remained after the October 2025 public-mainnet launch.
    whyItMatters: The inconsistency does not break the thesis, but it clouds customer-access and growth-stage interpretation.
    diligencePath: >-
      Review the official launch thread, archived onboarding pages, and any referral-policy updates from
      October-November 2025.
    relatedQuestionRefs:
