  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: moat durability
    missingEvidence: Retention, share-of-wallet, and switching data for Lighter users versus peers.
    whyItMatters: Without user-level retention evidence, it is hard to know whether Lighter’s differentiation is durable or merely promotional.
    diligencePath: Request venue-level cohort retention, API-user stickiness, and integrator- or pool-level retention metrics.
    relatedQuestionRefs:
    - QP019
    - QP020
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: peer economics
    missingEvidence: Comparable public revenue and take-rate disclosure for Lighter versus the leading peers.
    whyItMatters: Pricing advantage is only attractive if the venue can still monetize or justify customer-acquisition cost.
    diligencePath: Request net revenue, fee mix, and promotional-spend disclosures; compare with public protocol-fee dashboards where available.
    relatedQuestionRefs:
    - QP010
    - QP011
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: feature-breadth disclosure
    missingEvidence: Primary-source confirmation for every peer feature cell in the matrix.
    whyItMatters: Competitors do not publish to a uniform disclosure standard, so some cells remain qualitative rather than audited.
    diligencePath: Pull official product docs for each major peer and normalize capability definitions before investment committee use.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP002
