chapter:
  number: 3
  title: Competitors
  summary: Lighter sits in an unusually dynamic competitive set where architecture, liquidity, and incentive design matter as much as brand. Hyperliquid remains the category benchmark on scale, while Aster, dYdX, GMX, Drift, and hybrid venues each define different threat classes. Lighter’s core differentiation is Ethereum-settled, zero-fee, ZK-verified order-book trading plus adjacent RWA and RFQ features, but its moat is still less proven than the marketing narrative suggests because liquidity depth and trader retention can move quickly between perp venues.
sections:
- id: who-actually-competes-with-lighter
  title: Who Actually Competes With Lighter
  body: 'Lighter’s competitive set is not every exchange that lists crypto. The direct peers are high-performance on-chain perpetual venues that promise some mix of self-custody, low latency, and deep leverage. Hyperliquid is the clearest benchmark because it already combines large-scale liquidity, an order-book-first experience, and a strong value-capture flywheel. dYdX remains relevant as an established decentralized perpetual platform with its own chain and deep market breadth. GMX matters because it embodies the pool-and-oracle model rather than the order-book model, showing that many traders do not insist on the same architecture if liquidity and simplicity are good enough. Drift matters because it shows Solana-native performance and institutional-grade messaging can support a multi-product trading hub. Aster matters because it is pushing a multi-chain, privacy, high-throughput narrative that overlaps with Lighter’s ambition to go beyond simple crypto perps.


    That direct set should be separated from adjacencies such as centralized futures venues, because serious traders will still benchmark against CEX execution even when they prefer on-chain custody. The underwriting question is not whether Lighter has competitors, but which competitor class wins if users prioritize scale, fees, product breadth, or trust.'
