- id: feature-pricing-and-distribution-comparison
  title: Feature, Pricing, and Distribution Comparison
  body: 'On paper, Lighter compares well. Its zero-fee standard-account model is more aggressive than the explicit taker-fee schedules most peers disclose. Its docs also show a broader product surface than many traders may assume: public pools, RWA-linked markets, and perpRFQ suggest it is trying to serve retail, professional, and cross-asset users with one exchange core. But the comparison changes depending on what the buyer values. Hyperliquid’s strength is raw scale and liquidity. dYdX still has strong pro-trader brand recognition and large market breadth. GMX’s simpler pooled-liquidity design appeals to users who care less about order-book microstructure and more about straightforward access. Drift leans into Solana speed plus institutional-grade messaging, while Aster emphasizes privacy, multi-chain access, and a broad frontier-market catalog.


    Distribution is also different across platforms. Lighter’s partner-attribution and public-pool features imply a strategy of embedding its infrastructure into partner frontends and operator workflows. That is useful, but it only becomes durable if the underlying venue remains attractive after promotions fade. In perpetual DEXs, a feature matrix can look strong long before the order book is strong enough to retain large flow.'
