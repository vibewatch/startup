      - number: '3.4'
        title: 为什么链上永续份额会快速转移
        blocks:
          - type: paragraph
            body: >-
              链上永续合约对反身性循环异常敏感。更好的流动性吸引更多交易者；更多交易者带来更紧的订单簿和更多交易量；更多交易量又为更好的激励或 Token 经济供血；随之而来的叙事再拉来下一波用户。Hyperliquid
              的主导地位是最清楚的例子，但当费用设计和激励与交易者情绪同频时，同一动力也会暂时抬升 Aster 或 Lighter 等挑战者。CoinGecko、CleanSky 和 clob.ink 都显示，Lighter
              已经大到不能忽视，但在最难造假的流动性指标上，仍远小于品类领导者。


              这意味着，Lighter 的竞争风险不只是有更大的玩家存在。更大的风险是买方偏好可能围绕一两个决定变量快速重排：费用负担、未平仓合约、抵押品效率、资产宽度或监管舒适度。最可信的 Lighter
              反向逻辑是：在一个交易者只在订单簿、工具和激励保持领先时才忠诚的市场里，公司可能被商品化。最可信的正向逻辑则是：其基于
              Ethereum、可验证、零费用的设计，加上跨资产扩张，创造了一条足够独特的赛道，即使不成为绝对品类第一，也能留住高价值市场子集。
