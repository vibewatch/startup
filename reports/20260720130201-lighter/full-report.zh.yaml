  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 估值 / 状态
      - 可比意义
      - 局限
    rows:
      - - Lighter 私募轮
        - 私募估值
        - ~$1.5B（Nov 2025）
        - 公司直接交易锚点
        - 私募轮价格可能含优先权和不透明假设
      - - Hyperliquid
        - 代币市值 / FDV
        - ~$13.5B 市值 / ~$58.0B FDV
        - 最接近的链上永续合约规模龙头，且产品野心更广
        - 代币网络价值不等于私人公司 EV
      - - Coinbase
        - 公开股票市值
        - ~$41.3B
        - 展示受监管且多元化的大型交易所资产能有多大
        - 商业模式、监管和披露差异很大
      - - Robinhood
        - 公开股票市值
        - ~$90.3B
        - 为零售分发和交易应用估值提供参照
        - 不是链上交易场所，业务也宽得多
      - - CME Group / Interactive Brokers
        - 公开市场市值
        - ~$87.4B / ~$157.3B
        - 成熟交易基础设施资产的上沿参照
        - 比 Lighter 成熟、盈利、受监管得多
      - - GMX / Gains / dYdX 同类项目
        - 代币市值 / FDV
        - ~$67.5M / ~$14.2M / ~$3.6M 市值
        - 显示链上衍生品价值分布的长尾
        - 代币结构、金库设计和产品范围差异很大
    notes: 本表用于三角校验，不用于直接套用倍数。
    enumerationScope:
      coverage: sample
      basis: >-
        The comp set is intentionally mixed across direct tokenized DEX comps and public trading-infrastructure comps
        because no single peer group is cleanly sufficient.
