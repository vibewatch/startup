  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开记录能支撑怎样的价格
        blocks:
          - type: paragraph
            body: >-
              最强的公开估值锚，是 2025 年 11 月融资：多个来源支撑一轮 $68 million 融资，隐含估值约 $1.5 billion，累计融资约 $89-90
              million。这个价格不是凭空定出来的。独立市场研究估计 Lighter 2025 年年交易量约 $1.3 trillion；市场整体和竞品来源也显示，去中心化永续合约交易在 2025
              年显著拿到更多份额。公开活跃度代理和收入代理同样说明这是一门真实业务，不是空的代币壳。这些都足以解释投资人为何愿意为一家交易所基础设施公司支付独角兽以上价格。


              问题不在于这个估值显然荒谬。问题在于，从使用量走向持久公司价值，投资判断必须跨过的关键桥梁仍然缺失。公开来源没有给出经审计收入、利润率、留存或客户集中度。DefiLlama
              的费用和收入端点有用，但仍是基于外部方法论的代理指标，不是管理层财务数据。因此，这轮价格最好理解为私募市场基于品类领导、产品差异化和未来变现做出的有信息押注，而不是一个公开证据本身就能充分验证的价格。
            claimRefs:
