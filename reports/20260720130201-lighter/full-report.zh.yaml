    summary: 分层展示 Lighter 如何把资产托管、排序、证明、API 和 Ethereum 结算组合起来。
    data:
      layers:
        - label: 第 1 层 — Ethereum 合约
          detail: 持有资产、验证证明、存储规范状态根，并执行退出规则
        - label: 第 2 层 — 排序器
          detail: 按 FIFO 排序交易，并为交易所操作提供软终局性
        - label: 第 3 层 — 撮合 / 风险引擎
          detail: 确定性地执行交易所逻辑、风险检查和订单保证金控制
        - label: 第 4 层 — 见证生成器 + 证明器
          detail: 准备适配电路的输入，并生成并行执行证明
        - label: 第 5 层 — API / 应用 / 集成
          detail: 向 Web、移动端和合作伙伴端开放低延迟行情数据与订单路由
    approximationNotes: 为便于阅读，该架构栈把白皮书和文档中的多个组件压缩成五个功能层。
