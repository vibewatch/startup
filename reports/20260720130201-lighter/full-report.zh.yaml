  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险排在首位
        blocks:
          - type: paragraph
            body: >-
              Lighter 是聚焦衍生品的 DEX，法律与监管风险必须排第一。Lighter 自己的条款明确写着，服务不面向美国和其他主要司法辖区开放；更大的监管背景也解释了原因。CFTC 已经追究过 DeFi
              衍生品平台，并明确表示，新型智能合约结构不会让违法衍生品交易变合法。FinCEN 的可兑换虚拟货币指引让部分加密商业模式继续面对 AML 和资金传输问题。SEC
              也仍然相关：不只是一般加密管辖权问题，Lighter 还在扩展到 RWA、股票挂钩和类 pre-IPO 市场，可能牵涉更多监管体系。


              这不意味着 Lighter 注定失败。它意味着公司处在一条不断移动的边界内，产品宽度抬高法律复杂度的速度，可能快过产品市场匹配带来的战略安全。最强缓释事实是 Lighter
              有明确限制语言，而且似乎意识到边界风险。最强反向事实是，美国先例显示，如果监管方认为受禁用户仍能访问，或把产品视为落入注册制度，单靠地理封锁和免责声明可能不够。这种不对称，就是投资判断里必须承受的核心法律风险。
