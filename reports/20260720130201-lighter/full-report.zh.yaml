  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Lighter 实际销售的东西
        blocks:
          - type: paragraph
            body: >-
              Lighter 的正确市场边界不是所有加密交易，也不是所有去中心化交易所。Lighter 自己的文件把它放进一个更窄、技术要求更高的类别：链上杠杆交易，初始形态是永续合约，由 Ethereum Layer 2
              上的可验证订单簿架构交付。官网和文档围绕可验证撮合、清算与低延迟性能来定义产品；面向市场的产品集现在还包括 RWA 市场、公共池和服务大额订单的 perpRFQ。因此，最接近的替代品是永续 DEX
              和相邻的高性能衍生品场所，而不是只做现货的 DEX 聚合器。


              边界在边缘处也在扩张。到 2026 年，Lighter 显然试图从纯加密永续流量走向跨资产和结构化流动性用例。即便如此，当前经济引擎仍在杠杆交易量和流动性参与上。落到承销实践，Lighter
              卖给用户的是交易所性能、自托管和透明度；这些用户本来可能在 Hyperliquid、dYdX、GMX、Drift、Aster 或中心化期货场所交易。
