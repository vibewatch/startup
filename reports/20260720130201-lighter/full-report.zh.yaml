      - number: '6.2'
        title: 采用轨迹与激活证明
        blocks:
          - type: paragraph
            body: >-
              最强的公开采用证据来自主网迁移和链上活动代理指标。独立上线报道称，到 2025 年 10 月公开主网上线时，Lighter 已从 beta 阶段约 100 名交易者，增长到超过 188,000 个注册账户和超过
              50,000 名日活用户。FinanceFeeds 另行报道称，邀请制访问和存款上限在上线时被移除，Lighter 从封闭 beta 产品变成开放场所。当前访问侧，DefiLlama 在运行日显示 24 小时内有
              8,003 个活跃地址、约 1.07M 笔交易；CoinGecko 也继续把该场所作为有意义的交易所界面追踪。单独看，这些数字都不能证明付费客户质量；合在一起，它们清楚说明 Lighter
              已经不再是微不足道的测试网式用户基础。


              官方激励界面强化了这个结论。散户积分、做市商积分、流动性伙伴奖励、LIT
              费用抵扣和资金费率返利都说明，公司正在按分层主动管理不同的行为循环。这个信号可以两面解读。正面看，团队已经把获客、流动性深度和跨资产使用工具化。反面看，公开采用可能仍部分由补贴塑形。公开证据支持真实激活和宽度；它还不能完全区分持久自然使用与对激励敏感的使用。
