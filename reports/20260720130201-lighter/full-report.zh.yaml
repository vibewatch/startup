        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              支撑最强的资本事实是 2025 年 11 月融资。Yahoo/Fortune、The Block、FinanceFeeds、Wilson Sonsini 和 Tracxn 都支持一轮 $68M 融资，估值约
              $1.5B，累计融资达到约 $89-90M。对于一家仍未上市的交易基础设施公司，这是有分量的后期股权基础，也说明 Lighter
              有足够资本在增长阶段支持产品扩张、流动性计划和工程招聘。融资叙事还明确把未来计划连接到现货扩张、新衍生品市场、UI 改进和流动性基础设施。


              公开记录没有提供的东西同样重要：账上现金、烧钱速度、现金跑道、最低运营流动性、交易所金库组成、Token
              负债敞口或债务。没有公开债务额度、项目融资结构或现金过桥，可以类比成熟交易所或上市金融科技公司披露的内容。因此，资本充足性只能相对判断，不能绝对判断。相对其他风投支持的 DeFi 场所，Lighter
              资金看起来充足；相对硬承销所需信息，它仍高度不透明。
