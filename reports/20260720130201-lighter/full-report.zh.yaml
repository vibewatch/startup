      - number: '4.4'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              因此，Lighter 的财务案例是强项与不确定性的混合。强项来自大市场、强劲披露交易量、可见费用机制、公开可观察的协议费用代理指标，以及顶级投资人在 2025
              年末超额认购的融资。不确定性来自几乎所有私营公司承销输入仍然关键：多少交易量可持续，多少来自受补贴散户，多少 Premium/API
              流量会复现，伙伴经济是否有吸引力，以及要投入多少资本才能在流动性更深的对手面前保持竞争力。零费用姿态在战略上聪明，但如果场所无法把免费使用转成黏性且有利可图的流量，它也可能遮住真实的收入质量问题。


              因此，近期正确结论不是 Lighter
              没有商业模式。它显然有。结论是，公开证据证明了变现路径和一部分已实现经济活动，但还不足以有信心承销利润率路径、现金效率或长期资本强度。任何投资判断仍需要直接管理层尽调，穿透收入结构、烧钱速度、现金跑道和资产负债表韧性。
