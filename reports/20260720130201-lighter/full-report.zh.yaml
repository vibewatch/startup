        title: 运营、安全与市场结构风险真实存在，但已有部分缓释
        blocks:
          - type: paragraph
            body: >-
              运营层面，Lighter 比一个文档粗糙的 DeFi 应用更严肃。公司发布安全披露流程、security.txt 联系文件、PGP
              密钥和多份审计报告覆盖面；文档罕见地详细说明标记价格构建、清算状态、优先请求退出以及排序器驱动的证明生成。这些都是有意义的缓释项：它们让系统更可检查，也不那么像临时拼凑。它们还说明管理层知道，交易所完整性既是产品要求，也是法律要求。


              但这些缓释项没有抹掉核心运营依赖。架构仍依赖排序器、证明基础设施、外部预言机输入，以及能支撑有序退出和清算的流动市场。RWA 定价在价格源失效时可能从预言机输入转向内部定价，部分 RWA
              市场还明确豁免最后预言机价格上限。期货挂钩市场会随时间在合约间滚动敞口，在基础交易所风险之上又加了一层模型风险。因此，技术问题不是系统有没有防护——它有——而是这些防护在剧烈波动、价格源失效、移动端增长或激励驱动的活动激增中是否仍然稳得住。
