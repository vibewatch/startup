  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 点名监管行动
        - 任何涉及 Lighter 核心产品或受限司法辖区访问的正式行动
        - 直接冲击市场准入和估值支撑
        - 暂停 / 除非明确可控，否则大概率放弃
      - - 收入质量不达标
        - 管理层无法证明公开规模能健康转化为付费流量
        - 削弱乐观和基准情景的变现逻辑
        - 大幅下调公允价值区间
      - - 流动性集中度暴露
        - 少数做市商 / 合作伙伴贡献大部分经济收益
        - 客户和收入叙事更脆弱
        - 假设更高风险、更低倍数
      - - 运营完整性问题
        - 反复出现陈旧价格、宕机或清算控制争议
        - 损害信任溢价和留存前景
        - 迅速下调评级
      - - 资金库压力
        - 现金跑道或激励负担明显弱于 late-2025 轮融资暗示
        - 削弱买增长和吸收冲击的能力
        - 视为融资压力信号
    notes: 触发器刻意具体，方便尽调启动后持续监控。
