      - number: '3.3'
        title: 切换成本、护城河与 Lighter 真正的优势
        blocks:
          - type: paragraph
            body: >-
              Lighter 真正的优势不只是“技术更好”。它是几件事的组合：Ethereum 结算、ZK 可验证执行、零费用散户获客，以及在非托管前提下尽量保留中心化交易所响应速度的设计。对于想要透明撮合和清算、又不想离开
              Ethereum 生态的用户，这可能很重要。相邻的 RWA 和 RFQ 产品也提高了出现差异化、更黏性流量的可能性，而不只是泛泛的加密永续投机。


              问题在于，永续 DEX 护城河很少是静态的。VanEck 把 Hyperliquid 的护城河描述为流动性深度加费用回购飞轮。CleanSky 和 clob.ink
              都显示，当激励、交易量或新产品界面变化时，市场份额可以快速移动。因此 Lighter 的切换成本真实但不完整。API
              用户、集成商和池子运营者可能围绕该场所搭流程。但如果订单簿深度、资金费率或抵押品效率落后同行，即便技术上满意的用户也会搬走资金。正确看法是，Lighter 有有意义的产品差异化，但还没有不可撼动的竞争护城河。
