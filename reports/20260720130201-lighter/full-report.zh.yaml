      - number: '7.4'
        title: 缓释项、监控指标与止损标准
        blocks:
          - type: paragraph
            body: >-
              好消息是，Lighter
              已有几项实质缓释：明确的边界限制、公开审计、结构化安全接收流程、保守抵押品上限、成文风险公式和链上退出保护。这些降低了企业随意忽视关键失败模式的概率。没那么好的消息是，最影响投资判断的风险，公开材料无法完全清掉。没有公开牌照立场、没有事故历史仪表盘、没有客户集中度披露、没有公开金库数据，意味着委员会仍要依赖管理层尽调来回答几个决定投资逻辑的问题。


              正确的止损标准应当具体。正式执法行动，或清晰覆盖 Lighter 核心产品的监管解释，都会实质削弱投资逻辑。反复宕机、价格失效事件或可见的
              ADL/清算问题，会削弱信任主张。做市商支持恶化，或有证据表明激励掩盖了自然留存，也会削弱客户质量叙事。换句话说，Lighter 的风险图谱并不抽象：它可监控，但今天只有一部分能靠公开来源监控。
