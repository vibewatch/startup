            body: >-
              传统尽调往往想要具名客户、生产部署和可量化结果。Lighter 提供的大多是另一种证明。最强证据在分层和机制层面：做市商有记录在案的奖励计划，Premium 账户和 RWA
              交易者有官方费用和返利计划，嵌入式前端有伙伴审批流程，运营者管理资本有公共池工具。这些不是泛泛的营销主张；除非公司预期这些客户类型重要，否则不会存在这些运营机制。RWA 和 pre-IPO
              文档也显示，Lighter 有意争取那些想获得头部加密资产之外敞口的交易者，包括对大宗商品、FX、科技股和私募市场名称的合成访问。


              不过，本章仍必须承认缺口。本次审阅的公开记录没有提供具名机构做市商、第三方集成商案例，或存款人结果报告，无法把这些证据转换成经典企业级客户证明。因此，正确结论不是证明弱，而是证明结构不同：在可观察参与者类别和交易所设计上更强，在具名客户和公开结果上更弱。对
