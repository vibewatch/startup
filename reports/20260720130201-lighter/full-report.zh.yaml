  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户是谁以及如何付费
        blocks:
          - type: paragraph
            body: >-
              Lighter 的客户基础最好理解为一组用户类别堆栈，而不是一串企业客户名单。最显眼的用户是自助交易者，他们访问前端，并且按官方费率表，可以在标准账户上用零 maker 和 taker
              费用交易。但文档揭示了其他几个在经济上重要的分层。Premium 账户、做市商和 API 用户处在更可变现的一层，收入来自交易费、质押相关权益、费用抵扣和程序化路由。集成商可以把 Lighter
              嵌入自己的前端，公共池让运营者按利润分享经济管理第三方资本。RWA、pre-IPO 和预上线市场文档还暗示了另一类用户：寻找差异化跨资产敞口、而不只是加密 beta 投机的交易者。


              这种分层对尽调重要，因为买方、用户和付款方并不总是同一个人。散户交易者只有在升级或接触付费界面时，才同时是用户和付款方。在集成商工作流中，终端交易者是用户，伙伴捕获并上缴经济收益。在公共池中，存款人提供资本，运营者控制策略。因此，客户章节需要把
              Lighter 作为多分层交易所生态来评估，而不只是一个单一散户交易应用。
