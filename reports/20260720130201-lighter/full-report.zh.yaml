      - number: '5.4'
        title: 成熟度、路线图与技术缺口
        blocks:
          - type: paragraph
            body: >-
              文档集也显示，产品出货速度很快。Unified Trading Accounts 已在网页端可用，并被描述为迈向更广泛现货抵押支持的第一步。多资产保证金先从 ETH
              和保守上限启动，意味着分阶段推出纪律，而不是立即全量上线。自成交预防页面记录了一次带时间戳的实时默认行为变更，文档站点地图则显示 2026 年资金费率、RWA
              和执行页面频繁更新。移动端和桌面端分发表明，Lighter 正在从纯浏览器访问向外延伸。这种模式符合一个雄心很大、仍在主动扩展产品的交易场所。


              主要成熟度问题不在路线图活动，而在规模证据和依赖深度。公开文档没有量化持续吞吐、故障历史、延迟分位数或排序器故障切换表现。开发者可以查看代码仓库和
              SDK，但公开社区和包信号相对于场所宣称规模仍显温和。同样，官方安全材料真实存在，但公开控制披露仍未达到企业级可靠性报告。正确结论是：Lighter 技术上似乎比许多风投支持的 DEX
              走得更远，但机制透明与完全证明的生产成熟度之间，仍有明显差距。
