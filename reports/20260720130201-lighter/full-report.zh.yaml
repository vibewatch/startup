  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁真正与 Lighter 竞争
        blocks:
          - type: paragraph
            body: >-
              Lighter 的竞争集合不是所有上架加密资产的交易所。直接对手是高性能链上永续场所，它们都承诺某种组合：自托管、低延迟和深杠杆。Hyperliquid
              是最清晰的标杆，因为它已经把大规模流动性、订单簿优先体验和强价值捕获飞轮结合起来。dYdX 仍然重要，它是成熟的去中心化永续平台，有自有链和足够宽的市场覆盖。GMX
              重要，是因为它代表池子加预言机模型，而非订单簿模型；只要流动性和易用性足够好，很多交易者并不坚持同一种架构。Drift 重要，是因为它证明 Solana 原生性能加机构级叙事可以支撑多产品交易枢纽。Aster
              重要，是因为它推进多链、隐私和高吞吐叙事，与 Lighter 超越简单加密永续的野心重叠。


              这个直接集合应与中心化期货场所等相邻选项分开，因为严肃交易者即便偏好链上托管，仍会拿 CEX 执行作基准。承销问题不是 Lighter
              有没有竞争者，而是当用户优先考虑规模、费用、产品宽度或信任时，哪一类竞争者会赢。
