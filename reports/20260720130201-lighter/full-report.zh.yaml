            body: >-
              公开牵引力代理指标强，但不完整。FinanceFeeds 的 2025 年末融资报道引用公司数据，称过去 30 天交易量约 $279.5B、TVL 约 $1.15B；DefiLlama
              在访问日页面显示近期活动很重，其公开费用和收入 API 也提供接近实时的变现代理指标。2026-07-20，费用端点显示 24 小时费用约 $38,043、30 天费用约 $2.66M；收入端点显示 24
              小时收入约 $32,677、30 天收入约 $2.04M。这些数字表明，即便散户表价为零，Lighter 仍在产生有意义的协议层经济活动。


              但这些仍是代理指标，不是经审计财务。它们不披露获客成本、销售效率、付费伙伴经济，或由激励、API、一次性市场波动驱动的活动占比。它们也不给出 ARR、NRR 或毛利率等标准 SaaS
              指标。正确解读是：Lighter 有公开证据证明流量可以变现，但还没有公开证据证明收入质量。投资人可以承销经济潜力；仅靠公开来源，还无法承销成熟单位经济。
