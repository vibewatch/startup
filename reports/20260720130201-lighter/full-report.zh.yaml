companyProfile:
  summary: >
    Lighter 是一家位于 Miami 的私营加密交易公司，成立于 2022 年，由创始人兼 CEO Vladimir Novakovski 领导。公司搭建了一个以 Ethereum 结算的 Layer 2
    交易所，聚焦去中心化永续合约，配套自研 ZK 证明基础设施、非托管退出、Premium/API 交易层级、伙伴路由分发、公共池，以及正在扩展的跨资产 / RWA 产品界面。2025 年 10 月公有主网上线报道称，平台当时已超过
    188,000 个注册账户、约 50,000 名日活用户。2025 年 11 月，Lighter 宣布完成 $68M 融资，由 Founders Fund 和 Ribbit Capital 领投，估值约 $1.5B，跻身加密行业
    2025 年末的独角兽之列。
