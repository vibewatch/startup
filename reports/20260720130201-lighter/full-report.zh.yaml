  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 真实收入、抽成率、毛利率和费用结构
        - 需要用来把规模换算成价值
        - 管理层 + 财务尽调
      - - 客户耐久度
        - 按标准 / 高级 / API / 合作伙伴用户分层的队列留存和集中度
        - 需要判断公开规模是否耐久
        - 增长 / 客户分析尽调
      - - 监管姿态
        - 外部律师备忘录和拦截器有效性
        - 最重要的下行闸门
        - 法律尽调
      - - 运营韧性
        - 事故历史、延迟、陈旧价格事件、审计整改
        - 需要用来支撑信任溢价判断
        - 工程 / 安全尽调
      - - 资本充足性
        - 现金、烧钱速度、现金跑道、金库构成、激励义务
        - 需要判断稀释和下行支撑
        - 财务 / 金库尽调
    notes: 这些问题是把建议明显上调所需的最低材料包。
