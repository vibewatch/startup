      - number: '2.2'
        title: 市场规模与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              最可信的测算视角应从永续合约开始，而不是抽象谈 DeFi。CoinGecko 2025 年年度报告称，前 10 大永续 DEX 在 2025 年交易量达到 $6.7T，较 2024 年增长 346%；perp
              DEX 与 perp CEX 的交易量比从一年前的 2.5% 升至 7.8%。VanEck 描述的结构迁移更陡，称 2025 年永续合约里 DEX 对 CEX 的份额增长到三倍以上。CleanSky 2026 年
              7 月快照把滚动 30 天链上永续合约市场估为约 $576.8B；TokenInsight 显示，尽管市场降温，衍生品在 2026 年 Q1 仍占整体交易所活动的 82%。


              这些数字意味着理论 TAM 巨大，但 SAM 和 SOM 更窄。TAM 是全球永续合约。SAM 是愿意用自托管和协议特定执行模型交易的链上子集。SOM 是 Lighter 在订单簿驱动的链上永续合约及相邻 RWA
              杠杆里真正能拿到的份额。由于条款封锁美国用户，也由于流动性仍集中在 Hyperliquid 附近，现实的近期市场不是所有衍生品成交额，而是那部分足够看重 Ethereum
              结算可验证性、愿意接受挑战者场所的链上流量。
