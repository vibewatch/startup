      - number: '8.2'
        title: 可比资产组与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              给 Lighter 找可比资产很难，因为没有一个同业完全干净适配。Coinbase、Robinhood、CME Group、Interactive Brokers
              等上市交易所股票体量大得多，也更受监管、更分散；Hyperliquid、GMX、dYdX、Gains Network 等代币化链上交易场所在产品精神上更接近，但代币市值和 FDV
              不等于私营公司的企业价值。这意味着可比组能框定估值，却不能给出定案。它最大的价值在于展示分散度：高质量交易所或交易资产可以很值钱，但市场价值也会因流动性领导地位、监管、变现质量和产品宽度而巨大分化。


              在这个基础上，Lighter 的 2025 年估值位于一条异常宽的区间中部。它远低于成熟上市交易基础设施公司，也明显低于 Hyperliquid
              当前公开代币价值，但又明显高于较小的链上衍生品代币可比对象。如果相信 Lighter
              真有机会成为持久的一线链上交易场所，这个位置方向上说得通。如果假设变现仍然狭窄、监管收紧，或客户经济性集中在一小群专业用户手里，它就更难辩护。因此，情景测算必须明确由假设驱动，而不能伪装成精确。
