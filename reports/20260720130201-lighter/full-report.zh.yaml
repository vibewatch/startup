      - number: '7.3'
        title: 合作伙伴、依赖、财务与执行风险位于监管层之下
        blocks:
          - type: paragraph
            body: >-
              法律层之下，下一个风险簇是对其他参与方以及激励敏感型市场结构的依赖。Lighter 的订单簿需要专业流动性。流动性合作伙伴计划、做市商积分、仅面向 premium
              的费用或返佣工具都说明，相当一部分质量和经济性可能由更窄的专业用户群体驱动，而不是由广泛零售参与驱动。公共池又让平台依赖运营方和存款人，合作伙伴路由则叠加一层分发，最后可能集中在少数集成商手里。交易所常见这种结构，但也意味着客户广度看起来可能比底层经济集中度更健康。


              财务与执行风险进一步放大依赖问题。Lighter 在 2025
              年末融资不少，缓解了即时融资压力，但公开烧钱速度、现金跑道、金库和事故成本数据都缺失。条款还保留广泛自由裁量权，可以变更或停止界面功能和推广计划。对一个快速演进的私营交易场所，这可能符合运营逻辑。从投资者视角看，几项重要风险——流动性持久性、激励效率、资本强度和治理纪律——仍需要直接尽调，不能靠表层牵引力推断。
