        title: 领导层、实体结构与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人信号异常强，但治理披露异常轻。Yahoo/Fortune 称，Vladimir Novakovski 于 2022 年创立 Lighter，担任 CEO，16 岁进入 Harvard，提前毕业，18
              岁开始在 Citadel 工作。这个履历解释了为什么 Lighter
              对外叙事混合了量化交易、低延迟系统和加密市场结构，而不是消费级加密品牌。做衍生品交易场所，这算得上合理的创始人与市场匹配。与此同时，公开材料对更广泛的高管梯队、董事会、委员会结构、投资人控制权或确切受益所有权披露得少得多，低于投资人在
              $1.5B 估值下通常会期待的水平。


              官方条款把 Elliot Technologies, Inc. 标为服务提供方，但公司没有在官网显著展示完整公司资料页，高管名单、注册信息或治理文件都缺位。Delaware 和 Florida
              注册检索入口可用，但本次公开抓取除了这些检索入口和条款页实体名称，并没有解析出 Lighter
              清晰的实体明细记录。因此图景被拆成两半：技术创始人的可信度强，产品领导力清楚；但法定住所、董事会监督、股权控制，以及公司壳是否像协议叙事一样快速成熟，仍是实质尽调缺口。
