      - number: '3.2'
        title: 功能、定价与分发对比
        blocks:
          - type: paragraph
            body: >-
              纸面上，Lighter 对比不错。它的零费用标准账户模式比多数同行披露的显性 taker 费率表更激进。文档也显示，产品界面比许多交易者想象得更宽：公共池、RWA 相关市场和 perpRFQ
              表明它试图用一个交易所核心服务散户、专业用户和跨资产用户。但比较结果取决于买方看重什么。Hyperliquid 的强项是原始规模和流动性。dYdX 仍有强专业交易者品牌认知和较大的市场宽度。GMX
              更简单的池化流动性设计吸引那些不太在意订单簿微观结构、更重视直接访问的用户。Drift 借 Solana 速度和机构级叙事发力；Aster 则强调隐私、多链访问和宽阔的前沿市场目录。


              各平台的分发也不同。Lighter 的伙伴归因和公共池功能意味着，它的策略是把基础设施嵌入伙伴前端和运营者工作流。这有用，但只有底层场所在促销褪去后仍具吸引力，才会变得持久。在永续 DEX
              里，功能矩阵可以很强，但订单簿可能还没强到足以留住大额流量。
