      - number: '8.4'
        title: 最后尽调问题与投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              什么会改变判断？第一，直接财务尽调：收入结构、真实抽佣率、毛利率、烧钱速度和现金跑道。第二，集中度与持久性证据：活动和收入中有多少来自
              premium/API/做市商群体，激励正常化后这些用户有多黏？第三，法律尽调：针对永续合约、RWA 市场和任何 pre-IPO
              敞口逐产品做监管分析。第四，运营证据：事故历史、价格失效事件、延迟或正常运行时间报告。这些不是锦上添花，而是决定你是在承销一个有前景平台，还是在承销一个站得住脚的价格。


              投资逻辑破坏条件也很直接。任何具体执法行动、持续市场结构失灵，或激励掩盖弱自然留存的证据，都足以支持大幅下调估值或放弃。反过来，如果管理层能证明收入转化干净、集中度低、控制强、法律立场可信，判断也能很快改善。因此，Lighter
              是一家值得认真对待的公司，但价格必须用力检验。
