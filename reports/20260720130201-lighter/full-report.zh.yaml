  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开可见的变现方式
        blocks:
          - type: paragraph
            body: >-
              Lighter 不是最简单意义上的经典交易费交易所。公开文档显示，它有一套刻意分层的变现设计。标准账户 maker 和 taker 费率为零，平台用免费访问撬动散户流量。Premium 账户则支付 maker 和
              taker 费用，并可通过 LIT 质押获得折扣。伙伴归因计划还允许第三方集成商在 Lighter 之上搭建前端，并在全局上限内配置费用；公共池则在托管资本上形成运营者费用层。LIT
              用途页面又增加一层：Token 质押授予 LLP 相关访问权，协议称交易费收入用于回购。


              因此，即使没有完整披露的财务报表，收入模型也已经是多流的。一部分收入似乎来自 Premium 或 API 驱动活动的直接交易费，一部分来自 DefiLlama
              方法说明中的转账或提现等运营费用，另有一部分来自伙伴经济或 Token 相关功能。战略上这很有意思，因为它降低了对单一散户 taker 费率表的依赖。但分析也更难，因为公开定价看得见，实际收入结构看不见。
