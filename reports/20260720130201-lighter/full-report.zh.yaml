chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与当前定位
        blocks:
          - type: paragraph
            body: >-
              Lighter 的官方界面一直把产品描述为一个建立在自研零知识基础设施之上、锚定 Ethereum 的去中心化交易所和交易平台。官网强调零费用、可验证撮合与清算、交易所级性能；文档导言则称，Lighter
              是首个提供可验证订单撮合和清算、性能可比传统交易所的交易所。条款页补上了最关键的法律边界：Elliot Technologies, Inc. 运营网站托管界面、API、LIT Token
              界面及配套服务，协议本身则被定义为运行在 Ethereum Layer 2 区块链上的自治软件。这个区分很重要，因为投资标的不只是一个协议品牌，也是一层承担合规、IP、招聘和融资责任的公司壳。


              公开公司资料的方向一致，但并非完全官方。Yahoo/Fortune、Tracxn、Crunchbase 2025 年 11 月独角兽榜和 Gaebler 都把 Lighter 放在 Miami，并认定
              Vladimir Novakovski 为创始人兼 CEO。更合适的理解是：Lighter 是一个已跨过独角兽门槛、仍属私营的市场结构下注——公司实体在搭建交易基础设施、以 Ethereum 结算的 L2
              网络，以及面向用户的 DEX 品牌。未解决的问题不是 Lighter 做什么，而是围绕它的规模叙事已经很大，公司愿意披露多少法律实体和治理细节。
