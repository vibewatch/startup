      - number: '5.3'
        title: 信任、安全与市场诚信控制
        blocks:
          - type: paragraph
            body: >-
              信任控制是产品承诺的核心组成部分，因为 Lighter 要求交易者相信的不只是用户界面，还包括撮合逻辑、清算行为、API 和移动端流程。对一个私营 DEX 来说，公开信任界面强于平均水平。Lighter
              发布了漏洞披露政策，包含安全港表述、PGP 密钥材料、范围内资产和预期分诊行为。它还发布了安全审计页，列出 2025 年针对 core、bridge、wrapper、exit 和 spot
              相关组件的多份审计报告。独立报道进一步称，公司在审计后开源了零知识证明电路，这显著提高了技术成熟用户的可检查性。


              运营控制也能在交易文档里看到。自成交预防有明确文档，包括 2026 年 5
              月生效的一次默认规则变更。公平价格标记混合使用冲击价格、预言机和外部交易所标记，抵御操纵。清算文档描述了分阶段健康状态，而不是黑箱保证金催缴。尽管如此，信任仍不完整。审阅来源中没有公开可用性页面、SOC 2
              式控制报告或公开事故历史。因此，产品看起来技术上严肃、控制意识强，但还没有像成熟公开市场基础设施供应商那样具备机构级透明度。
