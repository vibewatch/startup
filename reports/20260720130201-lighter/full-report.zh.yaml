      - number: '2.3'
        title: 买方分层、采用路径与预算归属
        blocks:
          - type: paragraph
            body: >-
              Lighter 有多个用户分层，而且买的不是同一种东西。散户方向性交易者被零标准账户费用、自托管和近似中心化交易所的界面吸引。API 和更高频用户更在意延迟、密钥管理和确定性执行，所以 API
              文档会讨论账户索引、签名客户端、nonce 处理和机房共置。第三类是使用公共池或 LLP 相关质押访问的资金配置者和策略运营者。第四类是使用 RWA 市场和 perpRFQ 获取大额成交的跨资产或事件驱动交易者。


              因此，采用路径更像分层市场，而不是简单的消费者应用漏斗。散户可以从前端进入，专业用户可以通过 API 连接扩容，伙伴可以借助归因轨道获客，策略资金可以通过池子和 RFQ
              工作流进入。战略上这有帮助，因为需求来源更多元；但它也意味着 Lighter 必须同时满足几类受众：散户要易用，专业用户要执行质量，伙伴和池子要可信的资本效率。
