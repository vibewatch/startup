            body: >-
              Lighter 已不只是一个裸的永续订单簿界面。官方界面现在展示的是一个更宽的产品包，面向多类用户任务。散户拿到零费用前端交易和现在的移动应用；更高强度的用户可以使用 API、伙伴路由工作流、统一交易账户和非
              USDC 抵押功能。公开文档还显示，市场宽度已超出核心加密交易对，延伸到 RWA 和预上线市场文档；应用页面也暗示 Lighter
              越来越把自己定位成一个生态，而不是单一网页。这很重要，因为承销问题从“有没有产品？”变成了“一个交易所核心能支撑多少工作流，且不牺牲可靠性？”


              在工作流层面，产品试图让复杂衍生品交易对专业用户保持操作熟悉感，同时仍留在链上。文档描述了市价、限价、止损、TWAP、高级 TWAP
              和原子订单；描述了第三方前端的伙伴集成；也描述了旨在打通现货与永续活动的统一账户架构。换句话说，Lighter
              想交付的是严肃交易场所的功能密度，而不是简单投机应用。因此，在交易性能、抵押品效率和分发工具比单纯消费者易用性更重要的场景里，产品逻辑最强。
