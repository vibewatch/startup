      - number: '6.4'
        title: 持久性、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              持久性是客户故事里最难的部分。没有公开 NRR、GRR、流失或续约数据，也没有清楚披露多少交易量或费用生成来自散户前端用户，多少来自 Premium/API 市场参与者。这很重要，因为 Lighter
              的零费用标准账户设计让漏斗顶部采用更容易，但也提高了一种可能性：经济贡献不成比例地来自较小一群 Premium
              交易者、做市商或伙伴路由客户。做市商、费用抵扣和资金费率返利计划在战略上说得通；它们也提示客户集中可能在哪里。


              访问和司法辖区约束也塑造客户基础。条款页明确排除美国和其他几个主要司法辖区，而邀请制叙事在部分 2025
              年末报道中仍有残留，即便公开主网已经上线。这些约束不会否定采用，但会影响谁能现实使用场所，以及分发能多快变宽。因此，Lighter
              有清楚的获客和分层宽度证据，有部分扩张循环证据，但关于持久性和集中度的公开证据仍弱。足以承销真实使用，不足以承销客户质量的长期稳定。
