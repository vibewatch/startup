      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              以私营加密公司标准看，核心架构披露得异常具体。技术架构页和白皮书描述了一个系统：Ethereum
              是结算锚点，智能合约持有资产和规范状态根，自研证明引擎为交易所状态转换生成简洁证明。排序器提供先入先出排序和软最终性，API
              服务器提供低延迟数据，见证生成器准备电路输入，证明器加聚合引擎把大量执行证明压缩成一个在 Ethereum 上验证的批量证明。对于既追求性能又想保持强公开可验证性的交易所，这是一个连贯设计。


              其他几份公开文档补齐了运营细节，让架构更可信。订单撮合文档不仅展示面向用户的订单类型，还展示交易后风控检查和订单保证金逻辑。公平价格标记文档说明如何组合冲击价格、指数价格和外部中心化交易所标记，以限制操纵。资金费率和清算文档解释小时级资金费、预清算状态、零价公式，以及
              LLP 保险基金 / ADL 后盾。合在一起，这些来源说明 Lighter 披露的不只是营销层面的架构；它发布了足够多机制细节，让成熟用户能够理解交易所在正常和压力条件下应如何运行。
