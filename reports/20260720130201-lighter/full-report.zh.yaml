      - number: '2.4'
        title: 增长驱动、约束与市场难点
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动是结构性的。只要回报是透明执行、自托管和更低的交易对手风险，交易者比过去更有理由忍受链上 UX。Lighter 的零费用散户定价、可验证撮合叙事和不断扩大的市场集合，都让它受益于这轮迁移。向 RWA
              相关市场和 RFQ 式大额交易扩张尤其重要，因为这些功能把 Lighter 从纯加密永续克隆中区分开来，也提高了捕获高价值流量的概率。


              约束同样真实。链上永续合约市场仍然集中，Hyperliquid 定义了流动性标杆，竞争场所则用激进激励买份额。CleanSky
              明确提醒，单看交易量可能被激励放大，所以未平仓合约更重要。监管也不是理论风险：CFTC 已经表示，智能合约不会让非法数字资产衍生品变合法；SIFMA 和 FinCEN 相关指引仍让 AML、KYC
