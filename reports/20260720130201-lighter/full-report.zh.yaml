      - number: '8.3'
        title: 建议、信心与估值立场
        blocks:
          - type: paragraph
            body: >-
              证据支持的建议不是坚决放弃，但也不是按公开估值直接买入。Lighter
              有很多初创公司没有的三样东西：可见市场规模、技术差异化产品叙事、蓝筹投资人背书。反向逻辑同样强：监管边界风险严峻，客户持久性部分未证，公开收入质量证据太薄，无法有信心地承销利润率路径。这些张力导向一个中间建议。公司足够有吸引力，值得继续跟进；但当前公开证据包不足以把
              $1.5 billion 估值视作明显便宜。


              因此，最佳立场是继续研究 / 观察，信心中等、风险评级高。乐观情景下——份额继续提升、premium/API 变现成功、监管稳定、RWA 扩张持久——2025
              年估值可能显得合理，甚至保守。基准情景下，它大致充分，略偏紧。悲观情景下，如果法律摩擦上升，或经济性被证明集中且对激励敏感，它可能明显偏高。因此，价格尚未被证伪，但也尚未过关。
