- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory enforcement
    - Formal allegation of unregistered derivatives / exchange / AML violations
    - Any named action involving Lighter or core products
    - Escalate to thesis break / pause investment
  - - Market integrity failure
    - Visible stale-price event, repeated ADL controversy, or liquidation malfunction
    - Two or more credible public incidents without convincing remediation
    - Reduce confidence materially
  - - Liquidity concentration
    - Sharp decline in market-maker support or partner-routed depth
    - Material deterioration in depth / spread quality after incentives change
    - Re-underwrite customer quality and revenue durability
  - - Treasury stress
    - Evidence of shortened runway or reliance on increasingly expensive incentives
    - Runway falls below prudent threshold or incentive dependence rises sharply
    - Assume financing overhang and lower valuation support
  - - Governance / disclosure weakness
    - Management cannot produce regulator, security, or concentration diligence answers
    - Repeated inability to answer core diligence asks
    - Treat as execution red flag and potential pass
  notes: Kill criteria are designed to be observable by an investment committee rather than abstract theoretical concerns.
