chapter:
  number: 3
  title: Competitors
  summary: Andela competes against three direct named peers—Toptal, Turing, and Upwork Enterprise's Lifted—plus adjacent substitutes such as Deel Hire, internal hiring, specialist consultancies, and enterprise upskilling stacks. Its best wedge is the combination of Africa-origin supply branding, assessments, managed AI delivery, and upskilling, but that wedge is conditional because compliance is increasingly commoditized and AI tools can push routine engineering work back in-house.
sections:
- id: landscape-and-solution-classes
  title: Landscape and Solution Classes
  body: 'Andela is not competing inside one neat peer bucket. The most direct named peers in the retained set are Toptal, Turing, and Lifted, the Upwork Enterprise successor. Each goes after enterprise buyers that need flexible technical capacity, but they solve the job with different center-of-gravity assumptions. Toptal frames itself as a rigorously vetted high-skill marketplace with flexible engagements. Turing frames itself as AI-native infrastructure for frontier labs and enterprises that need evals, post-training data, and talent. Lifted leans into enterprise program management, access to a very large pool, and compliance support. Around those direct peers sits a second ring of substitutes: Deel Hire for sourcing plus employment infrastructure, Catalant-style consulting for scoped project work, internal hiring for buyers that trust their own recruiting engine, and internal upskilling or mobility tools for buyers that would rather reskill teams than buy external capacity. The practical
    lesson is that Andela competes on more than staffing. It competes on whether the buyer wants a blended source of talent, assessment, delivery, and enablement or prefers to assemble those parts separately.'
