- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Integrated talent + delivery + upskilling stack
    - Buyers can unbundle sourcing, EOR, consulting, and internal L&D across multiple vendors
    - High
    - Weakens hard lock-in and keeps multi-homing viable
    - Ask for attach rates showing how often Andela actually sells multiple modules into the same account
  - - Assessment IP from Qualified and Woven
    - AI-assisted coding may compress the value of generic screening while peers improve vetting too
    - High
    - Assessment differentiation has to remain predictive, not merely procedural
    - Request evidence that assessment scores correlate with production outcomes and renewals
  - - Africa-origin supply brand
    - Broader global talent pools and better remote workflows can commoditize geographic differentiation
    - Medium
    - Brand matters only if it still improves speed, quality, or cost on scarce roles
    - Request win-loss data by geography-sensitive role families and customer cohorts
  - - Cross-border workflow and compliance support
    - Deel-like EOR platforms can absorb compliance as a separate commodity layer
    - High
    - If compliance can be bought elsewhere, Andela must win on talent quality and execution
    - Ask how often Andela loses when a buyer already has Deel, Remote, or another EOR layer
  - - Enterprise AI-native positioning
    - Turing and internal AI tooling can capture the highest-value AI budget or reduce external need for generic coding
    - High
    - This is the core adverse route for Andela's newer premium narrative
    - Request revenue mix and growth by AI-native roles, managed AI work, and commodity engineering roles
  - - Named customer proof and branded logos
    - Public logos do not reveal customer concentration, spend, or renewal durability
    - Medium
    - Brand proof helps pipeline quality but does not prove durable unit economics
    - Request top-customer concentration, renewal rates, and expansion behavior by cohort
  notes: The register emphasizes risks surfaced by direct peers, substitutes, and adverse evidence rather than hypothetical future entrants.
