- id: switching-costs-and-distribution
  title: Switching Costs, Distribution, and Supply Access
  body: Andela's defensibility is more operational than technical. The company can plausibly create switching costs when it combines predictive assessments, AI-native role taxonomy, continuous training, and cross-border workflow support into one buying motion. That matters most after a customer has already aligned internal teams around a vendor's profiles, scorecards, and delivery rhythms. But those switching costs are not absolute because enterprises can multi-home. They can keep a premium network like Toptal for a few critical roles, rely on Deel for global employment mechanics, use a consultancy for a contained project, and keep internal recruiters searching in parallel. Distribution power is similarly mixed. Toptal benefits from its long-standing high-skill marketplace brand, Turing from the current AI wave, Lifted from large-pool procurement familiarity, and Deel from compliance ubiquity. Andela's distribution edge is most credible where buyers explicitly value Africa-linked supply,
    enterprise-ready screening, and the ability to attach training or managed work to hiring. It is weakest where the buyer sees compliance as the real problem and treats talent sourcing as interchangeable.
  claimRefs:
  - CP004
