tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target customer
  - Differentiation
  - Limitation
  rows:
  - - Andela
    - AI-native talent marketplace plus managed delivery and upskilling
    - 17K AI-native engineers; 200K+ trained; 2,000+ global client MSAs
    - Enterprises needing scarce technical talent, managed AI execution, or workforce upskilling
    - Combines sourcing, assessments, managed teams, and training with Africa-linked supply brand
    - Opaque realized pricing and no public win-loss data
  - - Toptal
    - Vetted on-demand talent marketplace
    - Top 3% network; 98% trial-to-hire success claim; under-48-hour hiring claim
    - Buyers needing fast access to individual experts or flexible project staffing
    - Longstanding vetting brand and flexible engagement models across multiple knowledge-work categories
    - Less explicit AI-native delivery and upskilling narrative than Andela
  - - Turing
    - AI-native talent and model-enablement platform
    - 4M+ vetted profiles; 100+ countries; 97% engagement success; ~4 days from scope to start
    - Frontier labs and enterprises deploying AI systems
    - Strongest direct AI-native narrative, including evals, datasets, and deployment support
    - Public pricing transparency remains thin and traditional staffing breadth is less emphasized
  - - Lifted (Upwork Enterprise)
    - Enterprise talent program and marketplace access
    - Large global talent pool plus dedicated program team
    - Procurement-heavy enterprises wanting centralized freelancer or contractor programs
    - Program governance, scale, and global compliance solutions
    - Little retained public evidence on AI-native specialization or technical-assessment depth
  - - Deel Hire
    - Global talent sourcing plus employment infrastructure
    - +40,000 customers at Deel level; AI matching and recruiter-partner model; global payroll scale
    - Companies that need cross-border hiring, onboarding, and legal infrastructure
    - Can source candidates and then employ them in one workflow
    - Core differentiation still centers on compliance breadth more than premium engineering vetting
  - - Internal hiring
    - Status-quo substitute
    - Uses existing recruiting budget and employer brand
    - Buyers with confident internal recruiting and technical interview loops
    - Maximum control over culture, compensation, and roadmap alignment
    - Slow for scarce AI roles and expensive when time-to-fill matters
  - - Catalant / specialist consultancies
    - Project-based expertise and consulting substitute
    - Flexible consulting marketplace in independent review set
    - Buyers solving scoped strategic or delivery projects instead of building embedded teams
    - Can buy expertise for a defined outcome rather than staffing capacity
    - Often weaker fit for long-lived embedded engineering relationships
  - - Internal upskilling / mobility stack
    - Reskilling and workforce optimization substitute
    - AI-driven skills and career-path tools surfaced in independent review set
    - Enterprises preferring to upgrade existing teams before external hiring
    - Keeps capability building in-house and can reduce external dependency
    - Does not solve immediate specialist scarcity when teams lack near-term execution depth
  notes: Partial landscape focused on the direct peers and substitute classes emphasized in the chapter brief; it is not a full census of every regional staffing firm or consultancy.
