- id: moat-durability-and-adverse-routes
  title: Moat Durability and Adverse Routes
  body: 'The adverse case is credible and should remain central to underwriting. Internal hiring can disintermediate Andela when enterprises believe AI tools, better developer experience, and stronger internal training let them keep more routine engineering work in-house. Deel-like EOR vendors can strip away the compliance layer that once made cross-border talent partners harder to replace. Lifted can win when procurement wants a large talent pool and dedicated program management rather than a differentiated supply-side story. Turing is especially important because it competes for the highest-value AI-native budget with a narrative that sounds closer to Andela''s new frontier than Toptal or Lifted do. Andela still has a meaningful wedge: Africa-origin supply branding, assessment IP from Qualified and Woven, visible AI-upskilling language, and proof that it can sell managed teams into branded enterprises. But that wedge looks durable only if buyers keep paying for quality-filtering, role-specialized
    AI talent, and integrated enablement. If AI tooling keeps commoditizing generic coding work, Andela''s differentiation narrows toward screening quality, customer intimacy, and services execution rather than toward scarce platform ownership.'
