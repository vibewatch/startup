      - number: '1.2'
        title: 领导层、治理与资本形成
        blocks:
          - type: paragraph
            body: >-
              当前事实模式里最重要的领导层事件，是 2024 年 8 月 CEO 从联合创始人 Jeremy Johnson 交棒给 Carrol Chang。Chang 带来 Uber
              的规模化市场运营经验，这在战略上相关，因为 Andela 自身现在更像双边人才与交付市场，而不是 fellowship 时代的培训公司。公司还在 2024 年任命 Kishore Rachapudi
              为首席收入官，并在 2026 年突出更广的 C-suite 扩充，显示重点从纯社区增长转向企业级 go-to-market 纪律。资本历史相对清楚：2016 年 $24 million Series B、2017
              年 $40 million Series C、2019 年 $100 million Series D，以及 2021 年由 SoftBank Vision Fund 2 领投、估值 $1.5 billion 的
              $200 million Series
              E。留存公开证据未显示后续定价轮。这带来晚期私有公司的常见张力：治理和投资人支持看起来真实，但最后一次硬估值标记已经足够久，投资人必须判断在没有新价格发现时，应把多少当前经营进展资本化。也就是说，判断谁在实践中真正控制下一轮融资和退出决策时，内部董事会材料比新闻稿更重要。
