  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - AI Academy 产出、专业人才需求和企业交付改善增长与组合，使 Andela 可在更大收入基数上获得 7x-9x 收入框架。
        - 价值走向约 $1.8B-$2.4B，陈旧标记开始显得保守而非苛刻。
        - 需要真实利润率改善、清晰竞争胜单，且没有不利股权结构表意外。
        - 低
      - - 基准
        - 收入维持在所引约 ~$264M 水平，AI 带来一些提振，但披露仍私有，经济账仍未证明。
        - 价值集中在约 $1.3B-$1.6B；只有业务质量守住时，旧 $1.5B 标记才算合理。
        - 即便执行尚可，也未必能抵消陈旧定价和有限披露。
        - 中
      - - 熊市
        - 通用 AI 编码、买家平台替代、定价不透明或利用率压力，把感知质量压向 3x-4x 收入框架。
        - 价值跌向约 $0.8B-$1.1B，明显低于 2021 年一级市场标记。
        - 如果差异化变弱或利润率不及预期，即便需求不崩，压缩也会发生。
        - 中
    notes: 情景使用收入倍数区间，因为公开证据太薄，无法支撑现金流或利润率正常化模型。
    claimRefs:
