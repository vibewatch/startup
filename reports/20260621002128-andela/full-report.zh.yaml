  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 通用需求压缩
        - 来自商品化人员扩充与 AI-native / 托管 / 培训工作的胜单组合
        - 如果管理层无法在未来 12 个月内证明组合转向高溢价 AI-native 工作
        - 假设利润率压缩、终局差异化下降
      - - 评估 / 质量缺口
        - AI-native 角色的安置成功率、监督负担和安置后流失
        - 如果关键客户反复反馈监督摩擦，或 AI 角色部署后续约质量转弱
        - 下调对转型的信心，并削减增长假设
      - - 跨境合规失效
        - 分类争议、薪资漏付、隐私投诉或事件披露
        - 任何与 AOR、隐私或 AI 服务控制有关的重大法律索赔、监管询问或客户事件
        - 立即重估法律风险，并要求有律师背书的修复方案
      - - 陈旧估值叠加经济账不透明
        - 新融资、二级市场标记或经审计盈利数据仍缺位
        - 如果增长故事仅依赖 AI 叙事，却没有新估值或可信经济证据出现
        - 把 2021 年估值视为不可执行，并扩大下行情景
      - - 客户续约不透明
        - 头部客户集中度、NRR、流失和合同期限披露仍不可得
        - 如果管理层沟通后，尽调仍无法验证续约质量或集中度
        - 假设存在隐性续约风险，即便营收故事积极也限制确信度
      - - 品牌 / 人才信任恶化
        - 人才社区的申请、推荐、评论情绪和自愿流失恶化
        - 如果培训和评估要求加重时，供给侧信任削弱
        - 预期匹配速度和质量恶化，伙伴杠杆上升
    notes: 该表把叙事风险转成可衡量的否决标准，投资者可随新的私有尽调或公开信号更新确信度。
