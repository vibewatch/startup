  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Andela 的市场边界已经拓宽，用普通 staffing 标签会低估上行，也会低估风险。公司自己的 2026 年定位把四个相连桶放在一起：远程工程人员派驻、AI 原生人才市场、托管 AI
              交付、企业技能提升。这意味着相关支出不只来自合同招聘方或项目制开发者派驻，也来自需要前线部署工程师的 AI 项目负责人、需要托管执行的工程高管，以及需要员工准备度的学习或转型负责人。边界仍要守住纪律。纯
              payroll 或 EOR 基础设施、仅供内部使用的 HR 套件、广义 staffing 软件，应视为替代品或相邻品类，而非核心 TAM。Deel 这类一体化平台展示了买家可以把 sourcing
              与跨境雇佣打包的方向；当买家认为稀缺性、筛选或速度可以内部管理时，内部招聘仍是基线替代方案。这一框架重要，因为 Andela
              最好的市场不是全部劳动力支出，而是稀缺技术人才、可信筛选和执行支持必须合并交付的那一部分。
