      - number: '8.4'
        title: 最终尽调和上调路径
        blocks:
          - type: paragraph
            body: >-
              从跟踪上调到买入是可能的，但取决于公开材料今天没有包含的证据。投资者需要知道，公司自 2021 年 Series E 以来是否守住或改善了经济性，2021 年之后是否已经发生任何内部或二级市场定价重置，以及 AI
              定位是否转化为更好的赢率和账户质量，而不只是更好的营销语言。他们还需要员工数、利用率和留存数据，判断 Andela
              是不是变得更高效，还是只是换了叙事、经济性仍然偏服务。这些缺失信息很重要，因为建议不是公司质量评分，而是进入价格纪律判断。如果管理层能展示有韧性的利润率、耐久的利用率、正向的竞争输赢数据和干净的股权条款，陈旧估值可能从偏紧转向公允。在那之前，公司值得密切跟踪，但审慎投资者应坚持先看到新数据，再为尚未用申报级证据验证的上行付钱。
