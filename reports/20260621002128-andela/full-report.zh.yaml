  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 需求压缩和模式风险
        blocks:
          - type: paragraph
            body: >-
              Andela 最大的承保风险在于，AI 改变的不只是软件编写方式，也改变了外部人才买方还需要什么。第三方用工和开发者信号显示，市场仍然很大，但分化越来越明显。AI-native
              工程需求在上升，买方想要更快匹配，供应商也在从简历供给转向解决方案型工作。与此同时，AI
              辅助开发、低代码和业务技术人员工作流，可以吸收一部分过去支撑通用外包工程需求的常规应用积压。这不意味着外部人才会消失，而是价值会迁移到专业化、有治理、企业可用的工作。Andela 的官方回应很清晰：押注
              AI-native 人才、前线部署工程师、评估和技能升级。问题是，这次重新定位还没有被完全证明。独立评测证据称，Andela 在获取和规模上仍强于在可靠区分真正 AI-native
              工程师与通用远程人才上。如果这个缺口持续，公司可能遭遇典型后期挤压：新 logo 增长放慢、价格比较增多、续约质量下降、利润率走弱，即便市场大标题仍然健康。因此，投资问题不是 AI 是否总体创造更多工程工作，而是
              Andela 能否在通用人员扩充商品化之前，拿到高溢价那一块。
