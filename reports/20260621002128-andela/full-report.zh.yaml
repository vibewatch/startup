          tone: neutral
        - label: 9x 收入倍数估值
          value: 2376
          detail: 仅当增长和经济性都明显改善时，才以 USD 百万计。
          tone: positive
    approximationNotes: 敏感性分析基于引用的 2024 年约 $264M 数字，做简单收入倍数测算；这不是贴现现金流模型。
