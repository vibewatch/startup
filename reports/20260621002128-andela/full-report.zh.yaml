        blocks:
          - type: paragraph
            body: >-
              承销姿态应当纪律化，而不是一概否定。Andela 确实看起来有真实收入模式，且具备多条企业变现车道：嵌入式 placement、托管交付、培训与评估、承包商付款支持。第三方收入估计接近 $264
              million，加上明确的企业结果主张和对分析工具的持续投入，说明平台仍有商业相关性。这比只能依赖创始人叙事或普通 TAM slides 来写财务章节的创业公司强得多。


              但本章无法关闭核心承销问题。公开材料仍未披露按 stream 划分的收入 mix、实际价格与营销主张的差距、毛利率、现金
              burn、runway、债务、净留存或客户集中度。围绕裁员和定价不透明的负面证据不证明模式已坏，却说明投资人不应把公司声称的效率直接转成假定盈利能力。2021
              年之后没有公开可见的新定价轮，因此资本故事恰好在最关键处变旧。正确的财务结论是，Andela
              的商业模式看起来可变现且有战略相关性；但利润率路径和资本充足性仍被私有指标堵住，管理层必须直接提供这些指标，严肃承销或估值工作才可信。
