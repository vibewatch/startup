      - number: '3.2'
        title: 能力、信任与商业对比
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争权衡是广度与专业化。Andela 的公开叙事在同组中最宽，因为它横跨 AI 原生人才部署、托管 AI 系统工作、评估、合规支持和员工技能提升。Toptal
              覆盖的人才类别很宽，但仍更偏市场中心。Turing 在传统 staffing 上更窄，在 AI 原生执行语言上更强，因此是高端 AI 预算上最锋利的直接威胁。Lifted 和 Deel
              最强的场景，是采购、合同和全球雇佣基础设施主导购买决策。公开信任信号的质地也不同。Andela 通过 GitHub、Google Workspace 和企业 logo 展示可见客户证明；Toptal 和
              Turing 强调品牌信任，但留存证据中没有可比的公开客户数量。商业上，公开语料对 packaging 的信息远多于实际价格。Deel Hire
              提供了留存证据中唯一可见的入门价格；Andela、Toptal、Turing 和 Lifted 大多仍由销售主导，净费率、折扣和最低期限不透明。
