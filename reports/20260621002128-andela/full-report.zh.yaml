          low: 800
          mid: 950
          high: 1100
          displayValue: $0.8B-$1.1B
          detail: AI 去中介化或竞争压力把 Andela 推向质量更低的人力外包倍数。
          tone: negative
        - label: 基准情形
          low: 1300
          mid: 1450
          high: 1600
          displayValue: $1.3B-$1.6B
          detail: 业务守住规模，也吃到部分 AI 提振，但新证据还不足以证明估值应高于这一定价已久的标记。
          tone: warning
        - label: 乐观情形
          low: 1800
          mid: 2100
          high: 2400
          displayValue: $1.8B-$2.4B
          detail: AI 原生执行和技能升级带来更强的业务组合、更好的增长，并支撑更高的可比估值。
          tone: positive
    approximationNotes: 区间来自按情景做出的收入倍数测算，供投委会讨论使用，不是管理层指引。
    claimRefs:
