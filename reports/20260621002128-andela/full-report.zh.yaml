  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 方向
      - 什么会改变观点
    rows:
      - - AI-native 定位叠加企业技能提升，可能把 Andela 推向比通用人员扩充更高价值的工作。
        - 正向论点
        - 经验证组合迁移、更好利润率，以及 AI Academy 产出正在货币化的证据，会强化该判断。
      - - 跨境需求和人才稀缺仍支撑买家对精选技术网络的兴趣。
        - 正向论点
        - 远程或外包需求显著恶化，会削弱需求底线。
      - - 按所引 2024 年收入计算，陈旧标记仅约 5.7x；若平台真有差异化 AI 人才属性，并非明显不可能。
        - 正向论点
        - 经审计收入或新融资事件会让该倍数可信得多。
      - - 上一次硬估值已经过时，也没有当前股权结构表、利润率或留存披露支撑。
        - 反向论点
        - 新一级市场定价或投资者级经济数据，能显著降低陈旧价格风险。
      - - AI 工具可能把软件工作的部分环节商品化，让通用远程工程师中介更容易被替代。
        - 反向论点
        - 如果赢单 / 输单数据证明 Andela 因 AI-native 执行而拿份额，该担忧会缓和。
      - - 合同刚性和定价不透明可能缩窄买家群，即便技术人才质量真实存在。
        - 反向论点
        - 更短承诺、更清晰定价和更低转化摩擦，会改善商业投资论证。
    notes: 这些论点围绕旧标记已经假设了什么，而不是讨论 Andela 绝对意义上是否是一家可信公司。
    claimRefs:
