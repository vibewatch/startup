  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Andela 上一次硬标记
        - 私有估值 / 所引 2024 年收入
        - 以 $1.5B 和所引约 $264M 2024 年收入计算约 ~5.7x
        - 当前争论的最佳锚点，因为它把陈旧标记与唯一留存的公开收入估计连在一起。
        - 使用 2021 年价格和替代数据收入，而不是新的经审计披露。
      - - Turing
        - 私有估值 / 官方运营状态
        - 2025 年报道称估值 $2.2B；官网显示 AI 人才和模型训练规模
        - 留存材料中最接近 AI-native 叙事的可比公司。
        - 业务模式比 Andela 更宽，抓取的新闻项细节有限。
      - - Toptal
        - 官方网络状态
        - 高端精选人才网络；抓取材料未披露当前估值
        - 可用于比较精英网络经济性和快速匹配。
        - 没有留存收入或估值数据，价格锚定不完整。
      - - Upwork / Upwork Enterprise 竞品
        - 公开市场平台状态 + 企业单元
        - 公开 IR、SEC 申报文件和活跃的 2026 年 AI 产品 / 新闻节奏；企业单元更名为 Lifted
        - 最接近的公开企业市场平台工作流参照，也能说明上市平台正在把 AI 嵌入人才发现。
        - 上市公司组合比企业单元更宽，无法隔离类似 Andela 托管交付的经济性。
      - - Fiverr / Fiverr Pro
        - 公开市场平台 + 高端自由职业状态
        - 公开 IR 节奏和 2026 年 6 月 AI 专业人才需求信号；此处未引用直接 EV / 收入桥
        - 相关的公开人才市场平台可比对象，可见 AI 专业人才和灵活招聘模式需求。
        - 自由职业市场平台经济性不同于 Andela 的托管交付和人员扩充组合，因此可比性有限。
      - - Deel 人才寻源
        - 官方平台状态
        - 40,000+ 客户；150+ 国家；从寻源到雇佣的一体化工作流
        - 可用于比较更广义人才基础设施竞争，以及买家对捆绑工作流的偏好。
        - 人才模块只是 Deel 的一部分，留存材料没有当前估值数据。
      - - ADP
        - 公开劳动力平台状态
        - 140+ 国家、1.1M+ 客户；公开多元化劳动力平台
        - 可作为更广义劳动力基础设施规模和披露水平的上限参照。
        - 远比 Andela 更宽，不是直接市场平台或 AI 人才同行。
      - - Freelancer
        - 公开上市市场平台状态
        - ASX 上市公开自由职业市场平台，可见 1Q26 和年报材料
        - 可作为更广义人才市场平台参照，观察上市聚合平台如何披露业绩和治理。
        - 众包和自助式自由职业与 Andela 的企业匹配和托管交付模式存在实质差异。
      - - Remote
        - 一体化全球 HR / EOR 平台状态
        - 一站式全球 HR 和 EOR 工作流；在本材料包中不是直接估值可比对象
        - 可作为替代压力参照，因为部分买家可能选择拥有工作流，而不是另买人才市场平台。
        - 主要是 HR 和合规基础设施，不是 Andela 式工程人才精选。
      - - Freelancer Enterprise 竞品
        - 公开企业市场平台状态
        - 53M+ 云端劳动力，官方企业定位中无年费
        - 可作为更广义人才市场平台参照，比较规模和企业友好定价。
        - 众包模型和自助流动性不同于 Andela 的匹配和托管交付重点。
    notes: 可比组刻意混合，因为没有单一公开或私有同行能干净匹配 Andela 的人才市场平台、托管交付和 AI 技能提升组合。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful comparables available in the retained June 2026 pack, but it is not
        exhaustive because several peers lack like-for-like revenue, margin, or fresh valuation disclosure.
