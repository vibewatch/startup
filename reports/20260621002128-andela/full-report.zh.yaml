  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 这项推荐反映了真实需求证明，与陈旧定价、经济性可见性偏弱和竞争压力上升之间的冲突。
    data:
      nodes:
        - id: demand
          label: 需求证明
          detail: Andela 仍有客户证明、跨境需求和 AI 技能提升动能。
          tone: positive
        - id: ai-shift
          label: AI 重新定位
          detail: 管理层正尝试从人员配置转向 AI 执行和专家部署。
          tone: positive
        - id: stale-price
          label: 陈旧价格锚
          detail: 最近一次硬估值标记仍是 2021 年估值 $1.5B 的 Series E。
          tone: warning
        - id: econ-gap
          label: 经济性缺口
          detail: 公开材料仍缺少经审计利润率、烧钱速度和清算优先权数据。
          tone: warning
        - id: competition
          label: 竞争压力
          detail: Turing、Toptal、Deel、Upwork 和 AI 赋能的自助服务都在挤压差异化。
          tone: warning
        - id: decision
          label: 跟踪
          detail: 保持接触，但在为上行空间付费前，必须看到新的价格发现或私下尽调。
          tone: neutral
