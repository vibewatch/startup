      - number: '8.2'
        title: 估值背景和可比公司限制
        blocks:
          - type: paragraph
            body: >-
              最有用的估值视角，是从陈旧锚点出发，反问它今天需要代表什么样的业务。按引用的 2024 年 $264 million 收入基础，旧的 $1.5 billion 估值约等于 5.7x 收入。对一个差异化 AI
              人才故事来说，这不自动荒谬；但对一个服务和市场属性很重、利润率不透明的业务来说，也并不显然便宜。可比性是核心挑战。Turing 是最接近的 AI-native
              定位参照，即便保留证据有限，也显示它拥有更宽的平台、更高的 $2.2 billion 名义估值、模型训练敞口，以及大得多的人才档案主张。Toptal 更像策展式网络类比；Upwork Enterprise 和
              Deel 更适合衡量工作流和平台压力，而不是干净锚定价格。ADP
              展示了多元化劳动力平台一旦拥有耐久的记录系统关系后能做到多大，但它太宽泛，不能当作直接同行。因此，可比表只是给讨论划边界，而不是证明一个单一公允倍数；覆盖不完整本身也在警示，陈旧价格风险仍然很高。Upwork 和
              Fiverr 这类公开市场同行至少提供投资者关系页面、定期业绩日程和活跃的 AI 主题商业更新，这让 Andela 的披露缺口成为估值辩论的一部分，而不是旁注。
