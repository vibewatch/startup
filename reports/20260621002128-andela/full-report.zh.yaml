      - - 实际定价和折扣
        - 没有真实费率表、折扣阶梯和合同条款，营销主张无法转成收入预测
        - 要求提供 MSA、SOW、账单费率表和转化费政策样本
      - - 毛利率和抽成率
        - 无法承销利润率路径、服务强度或软件杠杆
        - 要求按服务线、地域和客户细分提供毛利率桥
      - - 现金、烧钱、资金跑道和债务
        - 尽管有历史融资，资本充足性仍不透明
        - 要求提供最新资产负债表、现金流量表、债务明细和资金跑道情景测算
      - - 客户集中度和留存
        - 如果少数账户主导支出，大客户名称并不能证明经常性经济性持久
