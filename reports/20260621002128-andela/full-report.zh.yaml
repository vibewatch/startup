chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与战略演进
        blocks:
          - type: paragraph
            body: >-
              今天的 Andela 更应被理解为一家私有 AI 人才基础设施公司，根子在非洲开发者培训运动。公司创立于 2014
              年，早期靠筛选和培训非洲软件工程师建立品牌，随后扩展为连接全球企业和远程技术人才的更大市场。这个起点仍然重要，因为它解释了公司在新兴市场供给侧的可信度；但当前产品叙事已经明显换挡。2026 年主页、AI
              原生人才页和 why-Andela 页面都把业务框在三条相连动作上：部署 AI 原生工程师、构建生产级 AI 系统、提升落后于 AI 转型的企业团队技能。尽调要抓住这一点：Andela
              不再只是卖远程用工。它在推一个把市场、托管交付、评估和学习基础设施混在一起的产品。若企业想要一体化 AI 执行，这一转向会抬高上行空间；但也改变了投资人要承销的东西：不只是人才入口，而是当 AI
              工程和培训都变得拥挤时，Andela 能否继续拉开差异。身份变化还意味着历史对比可能误导：较早来源描述的是远程工程师网络，较新页面描述的是企业 AI 的人力计算层。两者都是真的，只是对应公司今天演进的不同阶段。
