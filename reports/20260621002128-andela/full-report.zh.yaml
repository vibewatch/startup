  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构和优先权
        - 2021 年后要约收购、优先权堆栈、保护性条款以及任何内部估值标记
        - 最新价格发现和清算条款决定过期估值是否还能投资。
        - 向 CFO / 法务资料室索取，并拿到最新版股权结构包。
      - - 经济性质量
        - 按产品线拆分的毛利率、贡献利润率、烧钱速度和 cohort 留存
        - 如果缺少利润率质量，即便有收入，也可能只配更低的服务型倍数。
        - 财务尽调，结合审计报表和月度 KPI 包。
      - - 人员规模和利用率
        - 当前员工、承包商结构、利用率、闲置产能和流失率
        - 仅靠叙事证据，无法判断经营杠杆和交付风险。
        - 按地区和服务线查看 HR 与运营仪表盘。
      - - 竞争胜负
        - 近期企业客户赢单和输单，相比 Turing、Toptal、Deel、Upwork 以及内部招聘
        - 验证 Andela 的 AI 定位是否真正被市场买单。
        - 销售领导层 QBR 和正式竞争情报复盘。
      - - AI Academy 变现
        - 学员转化为可计费安置、服务或培训收入的情况
        - 把战略叙事和真实收入、利润率提升区分开。
        - 自学院扩张以来的产品和 Revenue Ops cohort 分析。
      - - 客户集中度和续约质量
        - 头部账户结构、续约 cohort、NRR，以及对少数大型项目的暴露
        - 如果客户账本集中，估值可能看似稳定，直到某个买方暂停采购。
        - 前 20 大账户复盘和续约 cohort 走查。
    notes: 每个尽调问题都服务于一个判断：2021 年的过期价格应上调、下调，还是应视为无关。
    claimRefs:
      - CV005
      - CV009
      - CV030
      - CV032
      - CV039
      - CV041
