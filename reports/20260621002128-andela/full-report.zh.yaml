  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行路径从 AI 驱动的买方行为和执行失误出发，传导到获胜率走弱、利用率下降、利润率承压，以及融资或估值压力。
    data:
      nodes:
        - id: automation
          label: AI 自动化和低代码
          detail: 常规工作被压缩，或从经典人员扩充转向别处。
          tone: warning
        - id: positioning
          label: AI 原生重新定位
          detail: Andela 必须拿下高溢价角色，而不是泛化远程用工需求。
          tone: neutral
        - id: quality
          label: 评估与交付质量
          detail: 匹配质量和人工验证决定高溢价定价能否站得住。
          tone: warning
        - id: renewal
          label: 续约质量
          detail: 集中度不透明或续约偏弱，会很快传导到信心。
          tone: warning
        - id: margin
          label: 利润率与现金生成
          detail: 定价压力、监督成本和解决方案组合共同决定经济性。
          tone: warning
        - id: financing
          label: 融资 / 估值
