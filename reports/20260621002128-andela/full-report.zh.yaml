      - number: '2.3'
        title: 买方分层、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一招聘负责人复杂。痛点是软件交付积压或专业人才稀缺时，初始 sponsor 通常是 CIO、CTO 或工程领导团队。问题具体落在企业 AI 交付时，数据和 AI
              负责人会成为直接经济买方，因为他们需要前线部署工程师、生产级 AI 运营者或快速技能提升。交易变成多国、托管服务或 SOW 形态后，采购开始重要；HR 和人才获取仍然相关，因为远程岗位更容易补齐，AI
              工具也越来越嵌入招聘运营。调研证据支持这种更宽的购买动作：Andela 的企业调查发现，跨境 sourcing 兴趣强，对外包依赖有意义，全球触达和经筛选人才池的重要性很高。买家找的不只是
              headcount。他们要 24/7 访问、可扩展性、短期灵活性，以及不用等全职招聘周期走完就拿到难找技能。这解释了为什么 Andela 最强的动作不是一次性
              placement，而是从人才缺口诊断推进到试点部署，再进入托管交付、员工赋能和更长寿命的企业关系。
