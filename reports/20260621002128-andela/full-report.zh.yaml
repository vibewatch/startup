      - number: '6.2'
        title: 具名客户证明与采用证据
        blocks:
          - type: paragraph
            body: >-
              GitHub 是留存证据中最清楚的公开生产证明，尽调时应给更高权重。Andela 的案例研究描述了一项从 2024 年 4 月开始的持续 engagement，使用 56 名专家，每年清理约 100,000
              张工单，同时维持 4.61 CSAT、100% SLA 表现和三倍更快解决时间。披露的工作也比普通承包商 placement 更复杂。Andela 工程师在 GitHub 的
              Zendesk、Linux、KQL、Splunk 和 debugging stack 内运营；2025 年 GitHub 伙伴培训发布还明确引用 GitHub 客户成功负责人，称公司使用 Andela
              优化内部支持流程。TechTrendsKE 的报道把解读再往前推：价值不只是获得人才，而是改善开发者支持周边的运营环境。这是证明 Andela 能为高要求企业客户支持 AI 赋能运营转型的最强证据。


              离开 GitHub 后，证明质量明显下降。Mindshare 有有意义的高管引语和清楚买方 persona——全球高级分析领导——但没有披露 KPI。Goldman Sachs、International
              Service Group 和 The Weather Channel 以具名 testimonial 出现在 why-Andela 页面，并带有数据、技术或 CTO
              级头衔；但留存公开材料没有揭示部署范围、项目时长或可衡量结果。Mastercard Foundry 在 2024 到 2026 年官方新闻和证明清单中反复出现，说明该 logo 是 Andela
              企业故事的耐久部分，但用例仍未披露。Cloudflare 出现在 2021 年融资报道中，被列为使用 Andela 的领先公司之一，这有助于说明长期 logo 质量，但对当前新鲜度较弱。


              这种模式使具名客户表必然是部分且异质的。它包含一个量化、当前的生产案例研究；一个由 testimonial 支撑的 Mindshare 平台证明点；几个缺少运营深度的高级买方
              testimonial；以及少数反复出现在官方材料中、商业细节不透明的 logo。这个 logo 集合在战略上仍有帮助，因为它显示 Andela 的 reference 不是匿名的，也不只是
              startup-grade。但投资人不应把 logo grid 过度解读为续约证明。在留存证据中，Andela
              的公开客户证据足以证明可识别企业采用，以及与高级数据或技术买方的匹配；但不足以得出多数账户规模大、粘性强或持续扩张的结论。
