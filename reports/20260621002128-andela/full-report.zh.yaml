      - number: '8.3'
        title: 情景逻辑和下行传导
        blocks:
          - type: paragraph
            body: >-
              牛市、基准和熊市情景都围绕同一组张力展开：Andela 可能正在战略上朝正确方向移动，但 AI 也同时让通用人才中介更容易被攻击。上行情景假设，公司能用 AI
              Academy、专业化定位和企业交付叙事，把收入结构推向更高价值工作，并获得 7x 到 9x 收入的溢价框架。基准情景没那么戏剧化。它假设 Andela 大致守住引用的收入基础，捕捉部分 AI
              相关增长，避免再次大幅收缩，但仍缺少利润率证明，无法支撑旧估值之上的跃升。下行情景更容易从公开证据中辩护，因为它不需要需求消失。它只需要陈旧定价遇上增长放慢、合同刚性，或买方转向整合式或 AI-native
              替代方案。2023 年裁员、关于锁定和不透明定价的反向评测，以及 AI 工具的广泛扩散，都说明如果公司无法证明经济性优于通用市场或用工公司，差异化会多快受到质疑。
