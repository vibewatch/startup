      - number: '6.3'
        title: 留存、耐久性与重复使用代理指标
        blocks:
          - type: paragraph
            body: >-
              留存披露是 Andela 客户章节的最大弱点。公司发布了采用代理指标——2,000 多份客户 MSA、98% 满意度、97% ROI、招聘快 66%、项目时间线快
              33%——但没有公开给出投资人通常用于耐久性分析的核心经常性收入指标。留存来源都没有提供 NRR、GRR、churn、renewal rate、平均合同长度或 top-account 收入集中度。即便规模
              headline 也难以标准化，因为“client MSAs”背后的分母没有解释；它可能包括不活跃、历史或未扩张协议。


              话虽如此，留存证据确实提供了一些有用代理指标。GitHub engagement 从 2024 年 4 月持续到案例研究发布窗口，账户层结果显示它是持续嵌入运营，而不是一次性 pilot。在清理大量
              backlog 的同时维持 100% SLA 和 4.61 CSAT，说明这段服务关系重要到会影响 GitHub 的续约经济性。Forrester TEI
              研究虽然由公司委托，也指向同一方向：如果客户确实每次人才招聘节省约 $80,000 并显著加快项目，续约激励应当存在。不过，该研究被框为 composite，不能证明 Andela 真实组合的实际留存。


              来自 Google Workspace 的元证明有帮助，但只是间接的。它显示 Andela 自身作为分布式、多国企业客户使用协作软件，并获得可衡量生产率提升。这说明 Andela
              理解它向大型账户销售的工作流纪律和远程运营复杂度。但这不能替代来自付费客户的收入留存证据。因此，正确尽调结论是不对称的：客户价值实现足够可信，可以承销采用；但客户耐久性仍是开放问题。任何假设强续约或扩张的模型，都应以获得管理层提供的
              cohort 数据、合同长度披露和 top-customer 续约历史为条件。
