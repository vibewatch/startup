  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方分层、角色与客户 mix
        blocks:
          - type: paragraph
            body: >-
              Andela 当前客户故事比经典远程工程师市场更宽。公司现在向企业买家销售三条相连界面：部署 AI 原生工程师、生产级 AI 系统托管交付，以及面向客户员工的 AI 技能提升。这个 packaging
              重要，因为留存证据反复指向高级技术和转型负责人——不只是人才获取团队——作为有效买方。Andela why-Andela 页面上的 testimonial 集合点名了 International Service
              Group 的 Chief Data and Analytics Officer、Goldman Sachs 的 VP of Data Engineering、一名 GitHub 高级合作伙伴负责人，以及 The
              Weather Channel 前 CTO。Talent Cloud 发布又加入 Mindshare 全球高级分析高管的引语，进一步说明数据和分析领导层是真实购买中心。这些角色正是大型企业内部拥有 AI
              平台产能、数据工作流和转型预算的人。


              可见细分 mix 也偏向具有实质运营复杂度的企业账户。公开引用横跨开发者基础设施和支持运营（GitHub、Cloudflare）、金融服务和数据主导团队（Goldman Sachs、Mastercard
              Foundry）、媒体和营销组织（Mindshare、The Weather Channel），以及咨询或分析密集环境（International Service Group）。官方证明进一步强调 Fortune
              500、独角兽和成熟运营公司，而不是长尾 SMB logo。地理位置是 pitch 的一部分：Andela 主张其覆盖 175
              多个国家、集中在非洲和拉丁美洲的人才基础，能提供时区重叠和本地市场语境，这对全球产品团队尤其相关。GitHub 早期关于在新兴开发者地区需要本地存在的引语，让这一价值主张更具体。


              CEO Carrol Chang 领导下的战略转向，似乎把客户定位进一步推向需要 AI 项目执行产能的 CIO、CTO、数据和工程负责人，而不只是寻找低成本远程劳动力。AI Academy 和
              training-as-a-service 信息补足了这一动作：客户今天可以租用稀缺 AI 交付产能，同时为明天重训内部团队。这个组合支持一个论点：Andela 正试图成为 AI 转型的登记供应商，而不只是
              staffing 中介。权衡在于，公司公开细分披露仍是定性的。它没有量化每个 vertical 有多少活跃账户、收入中 AI 特定工作与经典工程支持各占多少，或 2,000 多份 MSA 是否对应当前正在
              engagement 的客户。


              当前 newsroom hub 强化了对客户 mix 的上述解读。它强调的 coverage 不再是普通远程工作，而是明确围绕人类主导的 AI 转型、AI 瓶颈和买方准备度。这一框架与面向 CIO、CTO
              和数据领导预算的销售动作一致，而不是一次性承包商 requisition。


              International Service Group 自己的网站让 testimonial 集合的解读更锋利。ISG 自称是一家以 AI 为中心的全球技术研究和咨询公司，聚焦
              sourcing、benchmarking、governance 和 speed to value。这使 ISG 引用不只是普通 logo：它暗示 Andela 能打动那些以评估技术供应商和外包策略为职业的买家。
