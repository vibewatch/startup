  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现层，以及定价仍然隐藏的内容
        blocks:
          - type: paragraph
            body: >-
              Andela 的公开财务故事不是单一抽成市场。当前官方界面至少显示四条可见收入动作：placement 或嵌入式人才部署、全托管 AI 交付、员工技能提升与评估，以及通过 agent-of-record
              式工作流支持承包商付款。共同主题是，Andela 卖的是稀缺技术劳动力入口，加上让跨境部署更容易的运营外壳。这比简单 job board 的收入质量故事更强，但也意味着投资人需要 mix 数据，而不是一个混合
              headline。


              定价可见度仍然差。Andela 的主页和 AI 原生人才页面不公布标准费率卡、培训包或实施费用。公开记录转而依赖结果营销：97% ROI、招聘快 66%、成本低 30-50%、72
              小时内组队。这些是有用的需求信号，但不是实现价格。AOR 产品增加了另一条变现车道，因为它可以在现有 MSA
              下签约并支付外部人才；但即便这里，公开证据也止于工作流机制，而不是费率抽成。正确的财务解读是，Andela 显然有多种方式变现企业需求，但 placement 费、托管交付、培训、评估和付款支持之间的收入 mix
              仍未披露。
