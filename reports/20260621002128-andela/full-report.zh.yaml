      - number: '4.3'
        title: 公开 traction 可信，但资本充足性仍主要靠推断
        blocks:
          - type: paragraph
            body: >-
              Traction 图景足够强，值得认真对待；但还不足以完整承销。第三方另类数据提供商通常把 2024 年收入或 ARR 放在约 $264 million，并继续引用 $1.5 billion
              估值。官方页面进一步说明这不是空壳：Andela 声称有 17,000 名认证 AI 原生工程师、超过 200,000 名受训技术人员、650 多家 Fortune 500
              客户，以及面向客户、追踪活跃人才和总支出的 dashboard。合在一起，公司看起来有实质规模。但投资人应把标签分清楚。这些是公司主张、第三方报告估计和推断经营信号的混合体，不是审计财务报表。


              资本充足性是披露缺口最关键的地方。留存证据中的最后一次公开定价轮仍是 2021 年 9 月 $200 million Series E。公开来源没有显示后续定价融资、当前现金余额、月度 burn、runway
              或债务义务。主要负面公开线索是历史性的，而非当前：2020 年裁员报道记录了 135 人被裁、高级员工降薪 10-30%，以及管理层关于新业务大幅放缓的评论。这不能证明当前困境，但显示 Andela
              过去不得不管理需求波动。实际结论是，Andela 可能已经大到足以支撑多条收入动作，但仅凭公开材料，投资人仍无法判断业务是自我供血、接近盈亏平衡，还是依赖另一轮私募。
