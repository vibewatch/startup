      - number: '5.4'
        title: 信任控制、隐私姿态与开放风险
        blocks:
          - type: paragraph
            body: >-
              公开信任姿态真实，但仍不完整。Andela 现在有当前隐私和条款文件，明确覆盖 AI 服务，解释可能处理的数据类别，描述多条披露路径，并警告 AI
              输出可能不准确、可变，或在客户之间相似。方向上这是正面的，因为它显示公司把 AI 特定法律暴露当作一线问题，而不是旧 staffing
              合同的隐性延伸。产品和培训页面也使用企业买家期待的治理、韧性、合规、可审计性和访问控制语言。缺口在于，这些表述仍更接近政策和能力语言，而不是硬运营证明。来源集没有公开 status
              reporting、uptime 承诺、事件历史、按 AI 角色划分的 placement 质量指标，或评估栈能可靠预测 AI
              原生岗位表现的第三方验证。因此，负面角度不是平台缺乏实质，而是围绕可靠性、伙伴依赖、课程演进和长期买方匹配的核心尽调点，在公开层面比营销界面暗示的更薄。承销时，这让产品故事有趣，但还没有完全去风险。
