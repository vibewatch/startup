      - number: '1.3'
        title: 规模、里程碑与注意事项
        blocks:
          - type: paragraph
            body: >-
              Andela 当前披露规模把强公司主张和较薄的第三方验证混在一起。官方材料现在称有 17,000 名 AI 原生工程师、200,000 名接受新兴技术培训的技术人员、5.6 million 开发者生态、2,000
              多份客户 MSA、98% 客户满意度和 97% 三年客户 ROI。外部另类数据提供商通常引用约 $264 million 的 2024 年收入或 ARR，并继续提及 2021 年 $1.5 billion
              估值。这些信号指向一家仍有实质规模的公司，但不能替代审计财务、客户 cohort 或当前 cap table 标记。里程碑记录也有正反两面。Andela 向平台软件、评估收购、欧洲市场覆盖和 AI
              技能提升伙伴关系扩张，都支撑了再造叙事。但 2023
              年裁员说明，该模式并非免疫于远程科技放缓。这个负面数据点重要，因为它显示市场重估人才供给时，管理层不得不缩小公司规模。它也再次说明，晚期私有、软件赋能的服务公司在企业招聘骤然放缓时，仍可能遭遇利用率和成本的尖锐冲击。结果是：这家公司有可信品牌资产和重新抬头的战略相关性，但仍必须尽调盈利能力、集中度以及
              AI 前置重新定位能否持续。
