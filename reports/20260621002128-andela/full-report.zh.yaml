      - number: '7.3'
        title: 交付、质量和依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Andela 必须证明自己的 AI-native 叙事在买方真正感知的层面成立：匹配质量、安全规范、培训新鲜度和交付可靠性。AI Academy 和 CNCF
              项目显示公司认真投入供给创造，但底层工具链变化极快，也让执行变成一条跑步机。独立来源和调查来源解释了这为什么重要。开发者广泛使用 AI
              工具，但许多人不信任输出准确性，也抱怨答案看似接近、仍需要人工修正。这意味着买方在为生产级 AI 工作采购人才时，可能需要更多审查，而不是更少。独立评测证据还称，Andela
              的评估方法仍在追赶，现场出现了监督需求、时区摩擦、人员流动和质量不一致。依赖风险会进一步叠加。Andela 依赖企业
              MSA、可信的全球合规轨道、培训伙伴关系、薪资基础设施，以及一个足够强的品牌，在此前裁员之后继续吸引技术人才和买方。Deel 等替代平台和 ADP
              等大型既有公司从侧翼进攻，拥有更深的合规或薪资规模；拥挤的人才平台市场又降低了切换成本。实际风险不是单点失效，而是累积的运营拖累，压低转化、续约质量和定价权。
