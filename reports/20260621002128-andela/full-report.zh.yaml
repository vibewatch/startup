  - id: TV005
    title: 论点破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 新一级或二级定价重置到 2021 年标记以下
        - 任何经验证的融资、要约收购或董事会定价标记显著低于 $1.5B
        - 直接证明陈旧价格下行，并压缩估值底线。
        - 暂停任何上调，并围绕新标记重新做投资论证。
      - - 毛利率或贡献利润率披露偏弱
        - 私有尽调显示服务属性重、经营杠杆有限
        - 削弱 AI 定位应享受溢价倍数的判断。
        - 把业务更像人员扩充 / 服务，而不是 AI 基础设施来处理。
      - - AI 重新定位后利用率或留存恶化
        - 待命人员、流失或客户留存数据表现出的质量弱于叙事
        - 说明增长可能靠低效率或人员周转买来。
        - 在经济性稳定前，把结论从跟进调到规避。
      - - 相比一体化平台或 AI 原生对手，竞争胜率走弱
        - 近期交易持续流向 Deel、Turing、Toptal，或被企业内部招聘体系吸收
        - 说明 Andela 的差异化还没有被市场充分买单。
        - 将可比公司重估为倍数更低的工作流或人力服务同业。
      - - 合同摩擦仍然偏高
        - 客户继续提到定价不透明、长期锁定或惩罚性转化费
        - 增加 GTM 摩擦，也缩小买方范围。
        - 支付溢价前，先要求看到定价和流程改革证据。
      - - AI 去中介化快过专业人才需求
        - 买方行为显示，通用工程工作借助 AI 工具回流内部的速度，快于 Andela 向高端市场上移的速度
        - 会压缩足以支撑高溢价市场经济性的收入池。
        - 默认用熊市情景作为承销框架。
    notes: 这些触发点聚焦于足以打破估值论证的证据；即使软件或 AI 劳动力总体需求仍然健康，也可能触发重估。
    claimRefs:
