  - id: TV001
    title: 建议摘要表
    columns:
      - 决策字段
      - 当前观点
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 维持尽调覆盖，但不要把陈旧的 2021 年标记自动视为可执行价格。
      - - 信心
        - 中
        - 关键运营和估值输入仍来自替代数据或公司背书，而不是申报文件级别证据。
      - - 风险评级
        - 高
        - 下行可能来自陈旧定价、利润率不透明、AI 脱媒或合同摩擦。
      - - 估值立场
        - 偏高
        - 公开证据尚未证明经济质量足以支撑从旧标记出发的实质上行。
      - - 持有 / 退出姿态
        - 等待新价格发现或私有尽调
        - 更干净的入场点大概率需要股权结构表、利润率和利用率证据。
      - - 上调路径
        - 新融资标记或经验证单位经济
        - 更好的判断需要新估值证据，再加上证明 AI 定位改善的是质量，而不只是叙事。
    notes: 该建议明确对价格敏感，并在新证据重置估值信心之前，把 2021 年标记视为陈旧。
