          value: 1056
          detail: 按约 $264M 收入和压缩后、类似人员配置的框架计算，单位为百万美元。
          tone: negative
        - label: 5.7x 收入倍数下的价值
          value: 1505
          detail: 基于所引收入基础，由陈旧的 $1.5B 硬估值标记隐含得出，单位为百万美元。
          tone: warning
        - label: 7x 收入倍数下的价值
