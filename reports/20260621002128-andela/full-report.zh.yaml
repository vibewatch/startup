      - number: '7.2'
        title: 法律、监管和隐私暴露面
        blocks:
          - type: paragraph
            body: >-
              Andela 的法律风险，与其说来自公开可见的诉讼案卷，不如说来自商业模式自身嵌入的广泛义务。Andela 明确销售跨境承包商聘用、支付和合规支持，覆盖 100
              多个国家。这自然带来劳动者分类、数据传输、隐私和客户责任问题。公司的政策栈本身就把风险面展示出来。隐私政策称，Andela 会处理职业、设备和敏感数据，可能向服务提供商、关联伙伴、广告商和政府主体披露数据，并提供
              CCPA 以及欧盟、英国、瑞士权利处理。使用条款还加入强制仲裁、集体诉讼弃权，并警告 AI 输出可能不准确或不完整。条款还允许将提交内容用于 AI
              和机器学习改进。这些都不能证明法律失败；但它说明，合规不是边缘职能，而是核心产品基础设施。本文保留的公开来源没有显示公司特定的现行执法或诉讼时间表，因此投资者不应把沉默过度解读为已经过关。正确尽调姿态是：Andela
              似乎意识到法律暴露面，但仍需要由律师背书的证据，覆盖分类控制、数据传输架构、事件响应和客户赔偿边界。
