      - number: '7.4'
        title: 财务可见度、陈旧估值和否决标准
        blocks:
          - type: paragraph
            body: >-
              财务模型风险偏高，主要因为公开证据栈在投资者最需要精度的地方很薄。Andela 最近一次公开估值锚点是 2021 年 $1.5 billion 的 Series E，保留的 2024–2026
              年材料没有显示更新的定价轮。按后期私营公司标准，这个估值已经陈旧，尤其是公司此后经历了裁员、管理层变动，并战略转向 AI-native
              人才。公开来源也没有披露烧钱速度、盈利能力、现金跑道或客户续约指标，外部人无法检验重新定位是否改善了经济性。独立评测证据又加了一层：不透明定价、较长合同最低期限和转化费，可能有助于短期收入质量，但企业客户正重新思考用工、自动化和采购承诺时，它们也正好加大买方摩擦。因此，评估这家公司最干净的方式是触发条件式。如果
              Andela 能证明高溢价 AI-native
              匹配、强续约质量、合同灵活性改善，以及法律控制成熟，且不需要新的外部资本，风险图景会迅速改善。反之，如果公司仍然估值陈旧、经济性不透明，并依赖一个市场不再奖励的叙事，利润率、融资和品牌信心的下行传导会很严重。
