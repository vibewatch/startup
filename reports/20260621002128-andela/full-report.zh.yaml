  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Andela 仍有一个可信的运营故事。公司已经围绕 AI-native 工程师、生产级 AI
              系统和企业技能升级重新定位，官方材料仍指向有意义的客户基础、招聘速度主张和庞大培训管线。这些因素足以支持继续贴近观察，而不是把它当作远程办公退潮后的受害者直接排除。但投资判断必须对价格敏感。最后一个硬估值锚点仍是
              2021 年 9 月 $1.5 billion 的 Series E；抓取包里最佳外部当前收入锚点，是一项替代数据估算的 2024 年约 $264
              million。这能支撑讨论，不能支撑确信。公开记录尚未提供经审计利润率、现金转化或更新后的优先权条款，投资者无法判断这个陈旧锚点是保守、公允，还是已经充分定价。因此，正确姿态是以中等信心和高风险继续跟踪：需求证据足以让人持续监控，但新鲜价格发现不足，不能在旧估值之上、甚至不能干净地按旧估值评估买入判断。
