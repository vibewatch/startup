      - number: '2.2'
        title: 规模测算视角、供给，以及数字为何分歧
        blocks:
          - type: paragraph
            body: >-
              Andela 市场的公开规模测算，最好看成一叠视角，而不是一个权威数字。留存证据中最窄的主流视角，是 Mordor 对 2026 年 IT staffing 市场 USD 127.75 billion
              的估计，其中软件开发者是最大细分，生成式 AI 角色增长快于其他岗位。Second Talent 的宽口径视角则指向约 USD 559 billion 的 2026 年支出，把 staffing 与更广的 IT
              服务和外包类别混在一起。Verified Market Reports 的另一条软件赋能匹配视角，将人才市场平台估为 2025 年 USD 9.60 billion、2033 年 USD 22.09
              billion。这些类别没有一个能干净等同于 Andela。它们描述的是同一机会的重叠层。需求背景仍具建设性：Korn Ferry 的 85 million 工人短缺论、Kissflow 的 4.3
              million TMT 缺口，以及 Andela 自己的 AI 人才评论，都指向持续稀缺。供给也在扩大，尤其来自 GitHub 的全球增长和非洲毕业生管线；但更广供给不会消除市场对懂
              AI、能上生产环境的人才溢价。因此，正确尽调动作是保留公开估计作为区间，并记录 Andela 处在这些区间之间的哪一层，而不是硬造一个点估 TAM 或 SOM。
