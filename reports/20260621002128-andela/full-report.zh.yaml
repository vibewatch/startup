      - 包含内容
      - 未知项 / 证据缺口
      - 买方含义
    rows:
      - - Andela
        - 定制企业合同；人才或全托管团队合作
        - 寻源、筛选、评估、跨境工作流支持、托管团队和可选技能提升
        - 留存材料没有公开实际费率表、折扣安排或最低期限
        - 当覆盖广度和速度比逐项透明更重要时最合适
      - - Toptal
        - 灵活的按小时、兼职或全职合作，并带试用期
