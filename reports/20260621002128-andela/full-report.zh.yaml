  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 类别
      - 规模 / 融资信号
      - 目标客户
      - 差异化
      - 局限
    rows:
      - - Andela
        - AI 原生人才市场，叠加托管交付和技能提升
        - 1.7 万名 AI 原生工程师；20 万+ 人接受培训；2,000+ 份全球客户 MSA
        - 需要稀缺技术人才、托管 AI 执行或员工技能提升的企业
        - 把寻源、评估、托管团队和培训结合起来，并带有非洲供给品牌
        - 实际定价不透明，也没有公开赢单 / 输单数据
      - - Toptal
        - 经筛选的按需人才市场
        - Top 3% 人才网络；声称试用转聘成功率 98%；声称 48 小时内完成招聘
        - 需要快速获得单个专家或灵活项目用人的买方
        - 长期积累的筛选品牌，以及跨多个知识工作类别的灵活合作模式
        - 相比 Andela，AI 原生交付和技能提升叙事不够明确
      - - Turing
        - AI 原生人才和模型赋能平台
        - 400 万+ 经筛选档案；100+ 国家；97% 合作成功率；从范围确定到启动约 4 天
        - 部署 AI 系统的前沿实验室和企业
        - 最强的直接 AI 原生叙事，覆盖评测、数据集和部署支持
        - 公开定价透明度仍弱，对传统用人广度的强调较少
      - - Lifted（Upwork Enterprise）
        - 企业人才项目和市场访问
        - 大型全球人才池，叠加专属项目团队
        - 希望集中管理自由职业者或承包商项目、且采购权重高的企业
        - 项目治理、规模和全球合规解决方案
        - 留存公开证据很少能证明 AI 原生专业化或技术评估深度
      - - Deel Hire
        - 全球人才寻源，叠加雇佣基础设施
        - Deel 层面 +40,000 客户；AI 匹配和招聘伙伴模式；全球薪资规模
        - 需要跨境招聘、入职和法律基础设施的公司
        - 能在同一工作流中寻源候选人并雇佣他们
        - 核心差异化仍更集中在合规广度，而不是高端工程筛选
      - - 内部招聘
        - 现状替代方案
        - 使用现有招聘预算和雇主品牌
        - 对内部招聘和技术面试流程有信心的买方
        - 对文化、薪酬和路线图匹配拥有最大控制权
        - 稀缺 AI 岗位招聘慢；当招聘周期重要时，成本高
      - - Catalant / 专业咨询公司
        - 项目制专业能力和咨询替代方案
        - 独立评测集中提到的灵活咨询市场
        - 解决有明确范围的战略或交付项目，而不是组建嵌入式团队的买方
        - 能为明确结果购买专业能力，而不是购买用人产能
        - 通常不太适合长期嵌入式工程关系
      - - 内部技能提升 / 流动性技术栈
        - 再培训和员工优化替代方案
        - 独立评测集中出现的 AI 驱动技能和职业路径工具
        - 希望先升级现有团队、再外部招聘的企业
        - 把能力建设留在内部，并可减少对外部的依赖
        - 团队短期执行深度不足时，无法解决眼前的专才稀缺
    notes: 部分格局聚焦章节简报强调的直接同行和替代类别；它不是对每一家区域用人公司或咨询公司的完整普查。
