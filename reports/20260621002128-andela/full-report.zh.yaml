      - number: '4.2'
        title: GTM 动作和单位经济学通过代理指标可见，而非审计指标
        blocks:
          - type: paragraph
            body: >-
              Andela 提供了大量销售效率和买方结果主张，但几乎全是营销层代理指标，而不是直接经济指标。最强官方代理指标是 Andela 引用的 Forrester TEI 工作：97% ROI、招聘周期快
              66%、项目时间线快 33%，以及每次人才招聘节省约 $80,000。2024 年 CRO 任命公告和更早的 Talent Cloud 发布，用不同形式重复同一核心论点，承诺招聘快 70%、成本低
              30-50%。2023 年买方调查又提供了一个 GTM 线索：企业称它们已经外包大部分工作负载，并且经常想要端到端管理、项目设计和短期合同灵活性。


              缺失的是这些主张与 Andela 自身单位经济学之间的桥。公开来源没有披露平均 bill rate、take rate、按服务线划分的毛利率、人才利用率、客户集中度、CAC、payback 或 expansion
              revenue。新的 Executive Dashboard 证明管理层掌握当前客户的支出和 pipeline 遥测，但不能证明外部投资人看得到。独立市场数据有正反两面：它支持向 SOW 和 AI 原生
              staffing 转移，也显示更快匹配正在变成桌面筹码，工资通胀会压缩利润率。因此，现有证据说明 Andela 可能拥有真实的企业 GTM 引擎，但公开指标不足以把这台引擎翻译成可防御的利润率路径。
