      - number: '3.3'
        title: 切换成本、分销与供给入口
        blocks:
          - type: paragraph
            body: >-
              Andela 的防御性更偏运营，而非技术。公司若把预测性评估、AI 原生岗位
              taxonomy、持续培训和跨境工作流支持合成一次购买动作，就有可能创造切换成本。客户已经围绕某个供应商的画像、评分卡和交付节奏对齐内部团队之后，这一点最重要。但这些切换成本不是绝对的，因为企业可以多家并用。它们可以让
              Toptal 这样的高端网络覆盖少数关键岗位，让 Deel 处理全球雇佣机制，用咨询公司做一个封闭项目，同时保留内部招聘团队并行搜索。分销力同样有混合特征。Toptal 受益于长期高技能市场品牌，Turing
              受益于当前 AI 浪潮，Lifted 受益于大池子采购熟悉度，Deel 受益于合规无处不在。Andela
              的分销优势在买家明确重视非洲相关供给、企业级筛选，以及能把培训或托管工作接到招聘上时最可信；当买家把合规视为真正问题，并把人才 sourcing 视为可互换时，它最弱。
