- id: scale-milestones-and-caveats
  title: Scale, Milestones, and Caveats
  body: Andela’s current disclosed scale mixes strong company claims with thin third-party verification. Official materials now cite 17,000 AI-native engineers, 200,000 technologists trained on emerging technologies, a 5.6 million developer ecosystem, 2,000-plus client MSAs, 98% client satisfaction, and 97% three-year client ROI. External alt-data providers commonly cite roughly $264 million of 2024 revenue or ARR and continue to reference the 2021 $1.5 billion valuation. Those signals imply a still-material business, but they are not substitutes for audited financials, customer cohorts, or a current cap-table mark. The milestone record is also mixed. Andela’s expansion into platform software, assessment acquisitions, European marketplace coverage, and AI-upskilling partnerships all support the narrative of reinvention. Yet the 2023 layoffs show that the model was not immune to the remote-tech slowdown. That adverse datapoint is important because it shows management had to resize the company
    while the market was repricing talent supply. It also reinforces that later-stage private software-enabled services companies can still face sharp utilization and cost shocks when enterprise hiring slows abruptly. The result is a business with credible brand equity and renewed strategic relevance, but one that still demands diligence on profitability, concentration, and the sustainability of its AI-forward repositioning.
