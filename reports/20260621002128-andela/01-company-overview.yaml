  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Audited EBITDA, cash balance, burn, and gross-margin history since the 2021 Series E.
    whyItMatters: Capital adequacy and valuation quality cannot be underwritten from public materials alone.
    diligencePath: Request board materials, audited financial statements, and monthly KPI packs.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Account concentration, renewal rates, and sector mix for current revenue.
    whyItMatters: A marketplace with a few large enterprise anchors can look durable in logos but still be fragile economically.
    diligencePath: Request top-10 customer concentration, retention cohorts, and pipeline segmentation.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current employee count after the 2023 staff cuts and later hiring.
    whyItMatters: Headcount is a useful proxy for operating leverage and service-delivery intensity.
    diligencePath: Request HR dashboard snapshots and global employment counts by function.
    relatedQuestionRefs:
    - QO021
  - type: stale
    severity: minor
    topic: secondary-valuation
    missingEvidence: Verified secondary-market pricing or a later primary round after 2021.
    whyItMatters: Without updated pricing, investors anchor on a stale post-money figure despite business-model changes.
    diligencePath: Request cap table updates, secondary tender history, or recent board 409A materials.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: minor
    topic: investor-ownership
    missingEvidence: Current ownership percentages, board seats, and protective provisions by major investor.
    whyItMatters: Control rights affect future financing flexibility and exit paths.
    diligencePath: Request the latest cap table, voting agreements, and board observer schedule.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership enumeration for TO002 remains partial because public materials do not fully disclose the board, founder ownership, or every current executive seat.
    missingEvidence: A complete public roster of directors, committee assignments, and founder ownership roles.
    whyItMatters: Incomplete governance visibility makes it harder to judge control, succession, and key-person concentration.
    diligencePath: Request the latest board deck, committee schedule, and management org chart.
    relatedQuestionRefs:
    - QO005
    - QO018
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology for TO004 is partial because private-company operating milestones and internal restructuring events are not disclosed comprehensively.
    missingEvidence: Board-approved operating timeline covering internal restructurings, product launches, and post-2021 financing or tender activity.
    whyItMatters: A thinner chronology can hide when strategic pivots happened relative to layoffs, acquisitions, and revenue changes.
