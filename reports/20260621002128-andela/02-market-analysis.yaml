- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Value / range
  - Vintage
  - What it captures
  - Why it matters
  - Limitation
  rows:
  - - Broad IT staffing / services lens
    - USD ~559B; 4-6% growth
    - '2026'
    - Large outsourcing and staffing spend for technical labor
    - Shows the ceiling if market boundary is drawn very broadly
    - Too broad for a company-specific Andela underwriting case
  - - Narrow IT staffing lens
    - USD 127.75B in 2026; USD 152.47B by 2031
    - 2026-2031
    - Staffing-specific demand with segment detail
    - Closer to Andela’s contract and staffing heritage
    - Undercaptures upskilling and software-enabled marketplace value
  - - AI-specialist subsegment inside staffing
    - 11.75% CAGR for generative-AI roles; software developers 37.05% of 2025 share
    - 2025-2031
    - Where spend mix is moving within IT staffing
    - Supports premium pricing for AI-native talent
    - Growth rate is a segment signal, not a standalone TAM
  - - Talent marketplace platform lens
    - USD 9.60B in 2025 to USD 22.09B by 2033
    - 2025-2033
    - Software-enabled talent matching and marketplace workflows
    - Relevant to Andela’s platformized matching layer
    - Category includes vendors with less services exposure than Andela
  - - Africa remote-talent supply lens
    - 12M+ graduates annually; 40-60% cost advantage; strong US/EU timezone overlap
    - '2026'
    - Supply expansion and cost arbitrage rather than direct spend
    - Explains why Africa remains a strategic source pool
    - Supply metric rather than direct revenue market size
  - - Talent shortage / delivery gap lens
    - 85M worker shortage; USD 8.5T revenue at risk; 4.3M TMT shortfall
    - 2030 outlook
    - Structural scarcity that pushes enterprises toward external partners
    - Shows why shortage can sustain demand even when budgets fluctuate
    - Gap metrics are not interchangeable with TAM estimates
  notes: Rows intentionally mix spend, growth, supply, and labor-gap lenses because no single third-party category cleanly equals Andela’s blended market position.
