chapter:
  number: 2
  title: Market Analysis
  summary: Andela’s market is best framed as the overlap of remote engineering staffing, AI-native talent marketplaces, managed AI services, and enterprise upskilling. Public sizing data spans from a narrow USD 127.75 billion IT staffing lens to a much broader USD 559 billion outsourcing-style lens, so the valuation-relevant move is to preserve ranges and then diligence where Andela’s higher-value AI slice actually wins budget.
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: 'Andela’s market boundary has widened enough that a generic staffing label now understates both upside and risk. The company’s own 2026 positioning combines four linked buckets: remote engineering staffing, an AI-native talent marketplace, managed AI delivery, and enterprise upskilling. That means the relevant spend is not limited to contract recruiters or project-based developer placements. It also includes budget that sits with AI program leaders who need forward-deployed engineers, with engineering executives who need managed execution, and with learning or transformation owners who need workforce readiness. The boundary still needs discipline. Pure payroll or EOR infrastructure, internal-only HR suites, and broad staffing software should be treated as substitutes or adjacencies rather than core TAM. Integrated platforms such as Deel show where buyers can bundle sourcing with cross-border employment, while internal hiring remains the baseline alternative whenever the buyer believes
    scarcity, vetting, or speed is manageable in-house. This framing matters because Andela’s best market is not all labor spend. It is the portion where scarce technical talent, trusted screening, and execution support have to be combined.'
  claimRefs:
