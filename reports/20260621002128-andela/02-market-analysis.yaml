tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for Andela
  rows:
  - - Remote engineering staffing
    - Contract, embedded, or project-based software, data, cloud, and AI engineering labor sourced across borders or distributed teams
    - Generalist non-technical temp labor and unrelated BPO work
    - CTO, CIO, engineering, procurement
    - Historical core budget pool and still the base motion for many accounts
  - - AI-native talent marketplace
    - Matching, vetting, assessment, and marketplace economics for scarce AI-capable engineers and forward-deployed talent
    - Internal-only career marketplaces and generic ATS or HCM suites
    - Engineering leaders, data or AI leaders, TA
    - Matches Andela’s current positioning around vetted AI-native talent
  - - Managed AI services
    - SOW or managed-delivery work to build, deploy, or operationalize production AI systems
    - Pure strategy consulting without talent deployment
    - AI program lead, product, CTO
    - Raises Andela’s relevance when buyers need execution, not just candidates
  - - Enterprise upskilling / TaaS
    - AI Academy, team enablement, curriculum, coaching, and training tied to delivery outcomes
    - Broad consumer learning subscriptions or formal degrees
    - Engineering leadership, L&D, transformation office
    - Extends revenue beyond placement into workforce readiness
  - - Adjacent substitutes
    - EOR, payroll, compliance, staffing software, and bundled talent platforms
    - Not part of core Andela sizing unless paired with scarce-talent or managed-delivery value
    - HR, procurement, finance
    - Important substitute pressure but should not be mistaken for core Andela TAM
  notes: The table separates core market layers from substitutes and adjacencies so later sizing does not double-count payroll, HR SaaS, or generic staffing software.
