- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI adoption outpaces internal capability
    - Driver
    - Immediate
    - Increases demand for AI engineers, FDE-style operators, and structured upskilling
    - Request Andela’s placement mix between staffing, managed AI services, and training
  - - Specialist shortage and global developer scarcity
    - Driver
    - Structural
    - Supports premium pricing and cross-border sourcing for high-skill roles
    - Request utilization, fill-rate, and wage-inflation data by role family
  - - Remote normalization plus SOW shift
    - Driver
    - Near term
    - Extends market beyond contract staffing into project and solutions work
    - Request revenue split by staff augmentation, SOW, and managed delivery
  - - Africa-linked cost and supply advantage
    - Driver
    - Structural
    - Keeps the supply side attractive if vetting and workflow compatibility are strong
    - Request realized savings and customer satisfaction by geography and role
  - - Trust, IP, security, and compliance scrutiny
    - Constraint
    - Immediate
    - Can slow vendor approval, data access, and expansion into sensitive workloads
    - Request security posture, indemnities, and data-handling controls
  - - Fragmentation, native tools, and AI automation pressure
    - Constraint
    - Structural
    - Compresses generic staffing economics and rewards differentiated managed capability
    - Request win/loss data versus agencies, internal build, Deel-like stacks, and self-service tools
  notes: The table pairs each market force with a concrete underwriting ask because category growth alone does not prove Andela captures the highest-value slice.
