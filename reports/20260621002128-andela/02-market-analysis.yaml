- id: sizing-lenses
  title: Sizing Lenses, Supply, and Why the Numbers Disagree
  body: 'Public sizing for Andela’s market is best treated as a stack of lenses, not as one authoritative number. The narrowest major lens in the retained set is Mordor’s IT staffing market at USD 127.75 billion in 2026, with software developers as the biggest segment and generative-AI roles growing faster than the rest. A much broader lens from Second Talent points to roughly USD 559 billion of 2026 spend when staffing is blended with wider IT services and outsourcing categories. A separate software-enabled matching lens from Verified Market Reports sizes talent marketplace platforms at USD 9.60 billion in 2025 and USD 22.09 billion by 2033. None of those categories cleanly equals Andela. They describe overlapping layers of the same opportunity. The demand backdrop is still constructive: Korn Ferry’s 85 million worker shortage thesis, Kissflow’s 4.3 million TMT gap, and Andela’s own AI talent commentary all point to persistent scarcity. Supply is also broadening, especially through GitHub’s
    global growth and Africa’s graduate pipeline, but broader supply does not eliminate the premium on AI-fluent, production-ready talent. The right diligence move is therefore to preserve the public estimates as ranges and document where Andela sits between them, rather than to force an artificial point TAM or SOM.'
