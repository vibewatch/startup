  - CM011
  - CM013
  - CM039
- calloutType: risk
  title: Generic staffing is where pressure will be highest
  body: The biggest structural risk is that buyers use self-service hiring tools, integrated talent stacks, or internal processes for commodity roles and reserve premium budgets only for trusted, higher-value execution partners.
