      - number: '6.2'
        title: Named Customer Proof and Adoption Evidence
        blocks:
          - type: paragraph
            body: >-
              GitHub is the clearest public production proof in the retained set and deserves disproportionate weight in
              diligence. Andela’s case study describes an ongoing engagement that began in April 2024, uses 56
              specialists, and cleared roughly 100,000 tickets per year while maintaining 4.61 CSAT, 100% SLA
              performance, and threefold faster resolution times. The disclosed work is also more sophisticated than
              ordinary contractor placement. Andela’s engineers operated inside GitHub’s Zendesk, Linux, KQL, Splunk,
              and debugging stack, and the 2025 GitHub-partner training release explicitly quotes GitHub’s
              customer-success leadership saying the company has used Andela to optimize internal support processes.
              TechTrendsKE’s write-up pushes the interpretation further: the value was not merely access to talent, but
              improving the operating environment around developer support. This is the strongest evidence that Andela
              can support AI-enabled operational transformation for a demanding enterprise customer.


              Outside GitHub, the proof quality falls off sharply. Mindshare has a meaningful executive quote and a
              clear buyer persona—global advanced analytics leadership—but no disclosed KPI. Goldman Sachs,
              International Service Group, and The Weather Channel appear as named testimonials on the why-Andela page
              with data, technology, or CTO-level titles, but the retained public materials do not reveal deployment
              scope, project duration, or measurable outcomes. Mastercard Foundry appears repeatedly in official press
              and proof lists across 2024 to 2026, suggesting the logo is a durable part of Andela’s enterprise story,
              yet the use case remains undisclosed. Cloudflare appears in historical 2021 funding coverage as one of the
              leading companies using Andela, which is useful for long-run logo quality but weaker for present-tense
              freshness.


              That pattern makes the named-customer table necessarily partial and heterogeneous. It contains one
              quantified, current production case study; one testimonial-backed platform proof point from Mindshare;
              several senior-buyer testimonials without operating depth; and a handful of repeated official logos whose
              commercial details are opaque. The logo set is still strategically helpful because it shows that Andela’s
              references are not anonymous or purely startup-grade. Yet investors should not over-read a logo grid as
              renewal proof. In the retained set, Andela’s public customer evidence is good enough to demonstrate
              adoption by recognizable enterprises and alignment with senior data or technology buyers, but not good
              enough to conclude that most of those accounts are large, sticky, or expanding over time.
