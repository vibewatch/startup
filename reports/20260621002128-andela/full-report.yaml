  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Andela’s current product is best understood as a blended operating stack rather than a single software
              application. The buyer-facing promise now has three explicit surfaces: deploy AI-native engineers, build
              production AI systems, and upskill internal teams through training-as-a-service. That is a material change
              from the older remote-talent narrative because it means the company is selling execution capacity,
              workflow support, and workforce transformation in one bundle. The public pages describe concrete labor
              categories on the deployment side, a defined systems-delivery workflow on the solutions side, and a
              curriculum-led learning motion on the training side. In practice, the customer journey appears to start
              with a skills or delivery gap, move through sourcing and assessment, and then branch into one of three
              outcomes: embedded engineers inside an existing team, a managed delivery pod building or operating AI
              systems, or structured upskilling for an internal workforce that cannot pause roadmap execution. The
              important analytical distinction is that the software layer mainly coordinates this journey, while the
              human layer still performs the core delivery, validation, and change-management work.
