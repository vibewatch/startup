  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Andela still has a credible operating story. The company has repositioned around AI-native engineers,
              production AI systems, and enterprise upskilling, and its official materials still point to a meaningful
              customer base, hiring-speed claims, and a large training pipeline. Those factors justify staying close to
              the name rather than dismissing it as a post-remote-work casualty. But the investment call has to be
              price-sensitive. The last hard valuation mark is still the September 2021 Series E at $1.5 billion, while
              the best external current revenue anchor in the fetched pack is an alt-data estimate of roughly $264
              million for 2024. That can support a conversation, not conviction. The public record does not yet provide
              audited margins, cash conversion, or updated preference terms that would let an investor decide whether
              the stale mark is conservative, fair, or already fully valued. That is why the right posture is track with
              medium confidence and high risk: there is enough demand evidence to keep monitoring, but not enough fresh
              price discovery to underwrite a buy call above or even cleanly at the old mark.
            claimRefs:
