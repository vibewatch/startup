  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization layers, and what pricing still hides
        blocks:
          - type: paragraph
            body: >-
              Andela’s public financial story is not a single take-rate marketplace. The current official surfaces show
              at least four visible revenue motions: placement or embedded talent deployment, fully managed AI delivery,
              workforce upskilling and assessments, and contractor-pay support through an agent-of-record style
              workflow. The common theme is that Andela sells access to scarce technical labor plus the operating
              wrappers that make cross-border deployment easier. That is a stronger revenue-quality story than a simple
              job board, but it also means investors need mix data rather than one blended headline.


              Pricing visibility remains poor. Andela’s homepage and AI-native talent pages do not publish standard rate
              cards, training packages, or implementation fees. Instead, the public record leans on outcome marketing:
              97% ROI, 66% faster hiring, 30-50% lower cost, and teams assembled within 72 hours. Those are useful
              demand signals, but they are not realized pricing. The AOR product adds another monetization lane because
              it can contract and pay outside talent under existing MSAs, yet even here the public evidence stops at
              workflow mechanics rather than fee take rates. The correct financial read is that Andela clearly has
              multiple ways to monetize enterprise demand, but the revenue mix between placement fees, managed delivery,
              training, assessment, and payment support remains undisclosed.
            claimRefs:
              - CI001
              - CI003
