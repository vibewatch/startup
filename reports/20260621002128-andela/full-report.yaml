      - number: '3.3'
        title: Switching Costs, Distribution, and Supply Access
        blocks:
          - type: paragraph
            body: >-
              Andela's defensibility is more operational than technical. The company can plausibly create switching
              costs when it combines predictive assessments, AI-native role taxonomy, continuous training, and
              cross-border workflow support into one buying motion. That matters most after a customer has already
              aligned internal teams around a vendor's profiles, scorecards, and delivery rhythms. But those switching
              costs are not absolute because enterprises can multi-home. They can keep a premium network like Toptal for
              a few critical roles, rely on Deel for global employment mechanics, use a consultancy for a contained
              project, and keep internal recruiters searching in parallel. Distribution power is similarly mixed. Toptal
              benefits from its long-standing high-skill marketplace brand, Turing from the current AI wave, Lifted from
              large-pool procurement familiarity, and Deel from compliance ubiquity. Andela's distribution edge is most
              credible where buyers explicitly value Africa-linked supply, enterprise-ready screening, and the ability
              to attach training or managed work to hiring. It is weakest where the buyer sees compliance as the real
              problem and treats talent sourcing as interchangeable.
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP015
              - CP016
              - CP029
              - CP030
              - CP031
              - CP033
              - CP035
      - number: '3.4'
        title: Moat Durability and Adverse Routes
        blocks:
          - type: paragraph
            body: >-
              The adverse case is credible and should remain central to underwriting. Internal hiring can
              disintermediate Andela when enterprises believe AI tools, better developer experience, and stronger
              internal training let them keep more routine engineering work in-house. Deel-like EOR vendors can strip
              away the compliance layer that once made cross-border talent partners harder to replace. Lifted can win
              when procurement wants a large talent pool and dedicated program management rather than a differentiated
              supply-side story. Turing is especially important because it competes for the highest-value AI-native
              budget with a narrative that sounds closer to Andela's new frontier than Toptal or Lifted do. Andela still
              has a meaningful wedge: Africa-origin supply branding, assessment IP from Qualified and Woven, visible
              AI-upskilling language, and proof that it can sell managed teams into branded enterprises. But that wedge
              looks durable only if buyers keep paying for quality-filtering, role-specialized AI talent, and integrated
              enablement. If AI tooling keeps commoditizing generic coding work, Andela's differentiation narrows toward
              screening quality, customer intimacy, and services execution rather than toward scarce platform ownership.
