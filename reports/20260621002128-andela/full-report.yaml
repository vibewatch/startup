  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main downside path runs from AI-driven buyer behavior and execution misses into weaker win rates, lower
      utilization, margin pressure, and financing or valuation stress.
    data:
      nodes:
        - id: automation
          label: AI automation and low-code
          detail: Routine work is compressed or redirected away from classic staff augmentation.
          tone: warning
        - id: positioning
          label: AI-native repositioning
          detail: Andela must win premium roles rather than generic remote staffing demand.
          tone: neutral
        - id: quality
          label: Assessment and delivery quality
          detail: Match quality and human verification determine whether premium pricing is justified.
          tone: warning
        - id: renewal
          label: Renewal quality
          detail: Opaque concentration or weak renewals transmit quickly into confidence.
          tone: warning
        - id: margin
          label: Margin and cash generation
          detail: Pricing pressure, oversight cost, and solutions mix determine economics.
          tone: warning
        - id: financing
          label: Financing / valuation
          detail: Without a fresh mark or economics proof, narrative slippage widens downside.
          tone: warning
        - id: brand
          label: Brand and talent trust
          detail: Layoff memory and buyer friction can weaken both supply and demand quality.
          tone: warning
      edges:
        - from: automation
          to: positioning
        - from: positioning
          to: quality
        - from: quality
          to: renewal
        - from: quality
          to: margin
        - from: renewal
          to: margin
        - from: margin
          to: financing
        - from: brand
          to: quality
        - from: brand
          to: renewal
    approximationNotes: null
    claimRefs:
      - CR005
      - CR010
      - CR018
      - CR037
      - CR044
      - CR049
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: >-
      Andela’s risk surface depends on enterprise renewals, compliance rails, assessment fidelity, and training
      credibility more than on one single supplier.
    data:
      nodes:
        - id: buyers
          label: Enterprise buyers / MSAs
          detail: Large accounts govern renewal quality, procurement pace, and pricing leverage.
          tone: warning
        - id: aor
          label: AOR compliance rails
          detail: Cross-border contracts, payments, and classification workflows sit inside the service promise.
          tone: warning
        - id: privacy
          label: Privacy / terms stack
          detail: Policy commitments shape what data can be processed, retained, and disclosed.
          tone: warning
        - id: assessment
          label: Assessment stack
          detail: Qualified, Woven, and internal tooling determine fit confidence.
          tone: warning
        - id: training
          label: Training partners and academy
          detail: GitHub and CNCF-linked programs help keep supply relevant.
          tone: neutral
        - id: incumbents
          label: Bundled platform substitutes
          detail: Deel, ADP, and similar platforms compete on compliance simplicity and global scale.
          tone: warning
        - id: talent
          label: Technologist supply trust
          detail: Brand, learning quality, and payout reliability affect the supply side.
          tone: neutral
      edges:
        - from: training
          to: talent
        - from: assessment
          to: buyers
        - from: aor
          to: buyers
        - from: privacy
          to: buyers
        - from: talent
          to: assessment
        - from: incumbents
          to: buyers
        - from: privacy
          to: aor
        - from: buyers
          to: talent
    approximationNotes: null
    claimRefs:
      - CR025
      - CR027
      - CR038
      - CR039
      - CR046
      - CR050
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation reflects real demand proof colliding with stale pricing, weak economics visibility, and rising
      competitive pressure.
    data:
      nodes:
        - id: demand
          label: Demand proof
          detail: Andela still shows customer-proof, cross-border demand, and AI-upskilling momentum.
          tone: positive
        - id: ai-shift
          label: AI repositioning
          detail: Management is trying to move from staffing toward AI execution and specialist deployment.
          tone: positive
        - id: stale-price
          label: Stale price anchor
          detail: The last hard valuation mark is still the 2021 $1.5B Series E.
          tone: warning
        - id: econ-gap
          label: Economics gap
          detail: Audited margin, burn, and preference data are still missing from the public pack.
          tone: warning
        - id: competition
          label: Competitive pressure
          detail: Turing, Toptal, Deel, Upwork, and AI-enabled self-service all pressure differentiation.
          tone: warning
        - id: decision
          label: Track
          detail: Stay engaged, but require fresh price discovery or private diligence before paying for upside.
          tone: neutral
      edges:
        - from: demand
          to: decision
        - from: ai-shift
          to: decision
        - from: stale-price
          to: decision
        - from: econ-gap
          to: decision
        - from: competition
          to: decision
    approximationNotes: null
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV017
      - CV021
      - CV033
      - CV038
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Small multiple changes create large value swings when the only public revenue anchor is alt-data and the mark is
      stale.
    data:
      items:
        - label: Value at 4x revenue
          value: 1056
          detail: USD millions using roughly $264M revenue and a compressed staffing-like frame.
          tone: negative
        - label: Value at 5.7x revenue
          value: 1505
          detail: USD millions implied by the stale $1.5B hard mark on the cited revenue base.
          tone: warning
        - label: Value at 7x revenue
          value: 1848
          detail: USD millions if AI differentiation earns a moderate premium.
          tone: neutral
        - label: Value at 9x revenue
          value: 2376
          detail: USD millions only if growth and economics both improve materially.
          tone: positive
    approximationNotes: >-
      Sensitivity uses simple revenue-multiple math on the cited ~$264M 2024 figure; it is not a discounted-cash-flow
      model.
    claimRefs:
      - CV003
      - CV004
      - CV042
      - CV043
      - CV044
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Public evidence supports a wide range because stale pricing and economics opacity matter almost as much as demand.
    data:
      items:
        - label: Bear case
          low: 800
          mid: 950
          high: 1100
          displayValue: $0.8B-$1.1B
          detail: AI disintermediation or competitive pressure pushes Andela toward a lower-quality staffing multiple.
          tone: negative
        - label: Base case
          low: 1300
          mid: 1450
          high: 1600
          displayValue: $1.3B-$1.6B
          detail: >-
            The business preserves scale and some AI uplift, but fresh evidence does not yet justify re-rating above the
            stale mark.
          tone: warning
        - label: Bull case
          low: 1800
          mid: 2100
          high: 2400
          displayValue: $1.8B-$2.4B
          detail: AI-native execution and upskilling create stronger mix, better growth, and premium comp support.
          tone: positive
    approximationNotes: Ranges are scenario-based revenue-multiple outputs for investment-committee discussion, not management guidance.
    claimRefs:
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Andela scores best on market need and strategic repositioning, but worse on economics clarity and valuation
      support.
    data:
      items:
        - label: Market demand
          score: 7
          detail: Global talent scarcity and cross-border demand remain real.
          tone: positive
        - label: Customer proof
          score: 6
          detail: ROI and hiring-speed signals exist, but they are still largely company-sponsored.
          tone: neutral
        - label: AI positioning
          score: 7
          detail: The company is moving toward specialist and AI-execution work rather than generic staffing.
          tone: positive
        - label: Economics visibility
          score: 3
          detail: Public evidence is weak on margin, burn, cap-table terms, and retention quality.
          tone: warning
        - label: Competitive durability
          score: 4
          detail: Rivals span curated networks, integrated platforms, and AI-native specialists.
          tone: warning
        - label: Valuation support
          score: 4
          detail: The stale 2021 mark can be rationalized, but not fully underwritten, on public evidence alone.
          tone: warning
    approximationNotes: Scores are analytical summaries of the retained evidence rather than mechanically weighted outputs.
    claimRefs:
      - CV010
      - CV011
      - CV017
      - CV021
      - CV027
      - CV038
      - CV039
      - CV040
