      - number: '7.3'
        title: Delivery, quality, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Andela has to prove that its AI-native story is real at the level that buyers actually
              feel: match quality, security hygiene, training freshness, and delivery reliability. The AI Academy and
              CNCF programs show serious investment in supply creation, but they also create an execution treadmill
              because the underlying toolchain is changing extremely quickly. Independent and survey sources highlight
              why that matters. Developers are using AI tools broadly, yet many distrust output accuracy and complain
              about almost-right answers that still require human correction. That means buyers may need more review,
              not less, when they source talent for production AI work. Independent review evidence also says Andela’s
              assessment approach is still catching up, with oversight needs, time-zone friction, turnover, and quality
              inconsistency showing up in the field. Dependency risk compounds this. Andela depends on enterprise MSAs,
              trusted global-compliance rails, training partnerships, payroll infrastructure, and a brand strong enough
              to keep both technologists and buyers engaged after prior layoffs. Substitute platforms such as Deel and
              large incumbents like ADP attack from the side with deeper compliance or payroll scale, while a crowded
              talent-platform market reduces switching costs. The practical risk is not single-point failure; it is
              cumulative operational drag that lowers conversion, renewal quality, and pricing power.
