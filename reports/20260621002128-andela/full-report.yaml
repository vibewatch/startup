  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Andela’s market boundary has widened enough that a generic staffing label now understates both upside and
              risk. The company’s own 2026 positioning combines four linked buckets: remote engineering staffing, an
              AI-native talent marketplace, managed AI delivery, and enterprise upskilling. That means the relevant
              spend is not limited to contract recruiters or project-based developer placements. It also includes budget
              that sits with AI program leaders who need forward-deployed engineers, with engineering executives who
              need managed execution, and with learning or transformation owners who need workforce readiness. The
              boundary still needs discipline. Pure payroll or EOR infrastructure, internal-only HR suites, and broad
              staffing software should be treated as substitutes or adjacencies rather than core TAM. Integrated
              platforms such as Deel show where buyers can bundle sourcing with cross-border employment, while internal
              hiring remains the baseline alternative whenever the buyer believes scarcity, vetting, or speed is
              manageable in-house. This framing matters because Andela’s best market is not all labor spend. It is the
              portion where scarce technical talent, trusted screening, and execution support have to be combined.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
