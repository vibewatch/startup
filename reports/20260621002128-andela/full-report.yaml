chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Strategic Evolution
        blocks:
          - type: paragraph
            body: >-
              Andela is now best understood as a private AI-talent infrastructure company with roots in Africa’s
              developer-training movement. The company was founded in 2014, built its early brand by selecting and
              training African software engineers, and later expanded into a broader marketplace matching global
              enterprises with remote technical talent. That origin still matters because it explains the company’s
              supply-side credibility in emerging markets, but the current product narrative has shifted materially. The
              2026 homepage, AI-native-talent page, and why-Andela page all frame the business around three linked
              motions: deploy AI-native engineers, build production AI systems, and upskill enterprise teams that are
              lagging the AI transition. This matters for diligence because Andela is no longer selling only remote
              staffing. It is pitching a hybrid of marketplace, managed delivery, assessment, and learning
              infrastructure. That pivot raises the upside ceiling if enterprises want integrated AI execution, but it
              also changes what investors must underwrite: not simply talent access, but whether Andela can remain
              differentiated as AI engineering and training become crowded categories. The identity shift also means
              historical comparisons can mislead: older sources describe a remote-engineering network, while newer pages
              describe a human-compute layer for enterprise AI. Both are true, but they apply to different stages of the
              company’s evolution today.
