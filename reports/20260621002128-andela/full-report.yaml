      - number: '1.2'
        title: Leadership, Governance, and Capital Formation
        blocks:
          - type: paragraph
            body: >-
              The most important leadership event in the current fact pattern is the August 2024 CEO transition from
              co-founder Jeremy Johnson to Carrol Chang. Chang arrived with scaled-marketplace operating experience from
              Uber, which is strategically relevant because Andela itself now behaves more like a two-sided
              talent-and-delivery marketplace than a fellowship-era training company. The company also added Kishore
              Rachapudi as chief revenue officer in 2024 and highlighted broader C-suite expansion in 2026, signaling an
              emphasis on enterprise go-to-market discipline rather than pure community growth. Capital history remains
              straightforward: a $24 million Series B in 2016, $40 million Series C in 2017, $100 million Series D in
              2019, and a $200 million Series E in 2021 at a $1.5 billion valuation led by SoftBank Vision Fund 2.
              Public evidence in the retained set does not show a later priced round. That creates a familiar late-stage
              private-company tension: governance and investor support look real, but the last hard valuation mark is
              old enough that investors must decide how much current operating progress to capitalize without fresh
              price discovery. It also means internal board materials matter more than press releases when judging who
              really controls the next financing and exit decisions in practice.
