      - number: '3.2'
        title: Capability, Trust, and Commercial Comparison
        blocks:
          - type: paragraph
            body: >-
              The most important competitive tradeoff is breadth versus specialization. Andela's public narrative is the
              broadest of the group because it spans AI-native talent deployment, managed AI system work, assessments,
              compliance support, and workforce upskilling. Toptal is broad across talent categories but remains more
              marketplace-centric. Turing is narrower on traditional staffing and stronger on AI-native execution
              language, which makes it the sharpest direct threat for premium AI budgets. Lifted and Deel are strongest
              where procurement, contracts, and global employment infrastructure dominate the buying decision. Public
              trust signals also differ in texture. Andela has visible customer proof through GitHub, Google Workspace,
              and enterprise logos, while Toptal and Turing emphasize brand trust without comparable public customer
              counts in the retained set. Commercially, the public corpus is far more informative on packaging than on
              realized price. Deel Hire offers the only visible entry price in the retained set, while Andela, Toptal,
              Turing, and Lifted mostly remain sales-led and opaque on net rates, discounting, and minimum terms.
