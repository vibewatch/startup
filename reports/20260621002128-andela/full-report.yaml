    title: Pricing / packaging comparison
    columns:
      - Route
      - Price / contract model
      - What is included
      - Unknowns / evidence gap
      - Buyer implication
    rows:
      - - Andela
        - Custom enterprise contracts; talent or fully managed team engagements
        - Sourcing, vetting, assessments, cross-border workflow support, managed teams, and optional upskilling
        - No public realized rate cards, discount schedules, or minimum terms in retained set
        - Best when breadth and speed matter more than line-item transparency
      - - Toptal
        - Flexible hourly, part-time, or full-time engagements with trial period
        - Hand-selected talent, centralized billing, NDAs, and flexible scaling
        - No public card pricing in retained pages despite clear contract-shape language
        - Useful for buyers that want flexible expert staffing without a broad services stack
      - - Turing
        - Sales-led enterprise packaging
        - AI-native talent, evals, datasets, and deployment-oriented services
        - Public rate transparency is absent in retained set
        - Fits buyers prioritizing frontier-AI execution over generic staffing
      - - Lifted
        - Existing enterprise contracts remain in force through rebrand
        - Dedicated program team, large pool access, and global compliance solutions
        - No visible public unit pricing or technical-assessment economics in retained page
        - Appeals to procurement-led buyers that value program governance and pool scale
      - - Deel Hire
        - From $599 per user per month in independent review coverage, plus sourcing economics that vary by workflow
        - AI matching or recruiter-partner sourcing plus onboarding and compliance infrastructure
        - Public review price may not capture full recruiter or EOR costs
        - More transparent than most peers on entry price, especially for infrastructure-led buyers
      - - Internal hiring
        - Salary, recruiter, interview, and employer-brand spend
        - Full control over candidate sourcing and team design
