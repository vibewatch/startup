      - number: '4.4'
        title: 'Financial verdict: real monetization, thin disclosure, and clear diligence blockers'
        blocks:
          - type: paragraph
            body: >-
              The underwriting posture should be disciplined rather than dismissive. Andela does appear to have a real
              revenue model with multiple enterprise monetization lanes: embedded placements, managed delivery, training
              and assessment, and contractor-pay support. Third-party revenue estimates near $264 million, combined with
              explicit enterprise outcome claims and continued investment in analytics tooling, suggest the platform
              still has commercial relevance. That is materially better than a startup whose financial chapter would
              rely only on founder narrative or generic TAM slides.


              But the chapter cannot close the core underwriting questions. Public materials still do not disclose
              revenue mix by stream, realized pricing versus marketing claims, gross margin, cash burn, runway, debt,
              net retention, or customer concentration. The adverse evidence around layoffs and pricing opacity does not
              prove a broken model, yet it does show why investors should resist turning company-claimed efficiency into
              assumed profitability. No new priced round is publicly visible after 2021, so the capital story is stale
              exactly where it matters most. The right financial verdict is therefore that Andela’s business model looks
              monetizable and strategically relevant, while its margin path and capital adequacy remain blocked by
              private metrics that management must provide directly before any serious underwriting or valuation work
              can be trusted.
