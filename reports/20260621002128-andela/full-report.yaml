      - number: '2.3'
        title: Buyer Segmentation, Budgets, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more complex than a single recruiting owner. When the pain is software-delivery backlog
              or specialist scarcity, the initial sponsor is usually the CIO, CTO, or engineering leadership team. When
              the problem is specifically enterprise AI delivery, data and AI leaders become the direct economic buyer
              because they need forward-deployed engineers, production AI operators, or rapid upskilling. Procurement
              matters once the deal becomes multi-country, managed-service, or SOW-shaped, while HR and talent
              acquisition stay relevant because remote roles are easier to fill and AI tooling is increasingly embedded
              in recruiting operations. Survey evidence supports the broader buying motion: Andela’s enterprise survey
              found strong interest in sourcing across borders, meaningful reliance on outsourcing, and high importance
              attached to global reach and vetted talent pools. Buyers are not only looking for headcount. They want
              24/7 access, scalability, short-term flexibility, and access to hard-to-find skills without waiting for
              full-time hiring cycles to clear. That explains why Andela’s strongest motion is not one-off placement. It
              is a progression from talent-gap diagnosis to pilot deployment, then into managed delivery, workforce
              enablement, and longer-lived enterprise relationships.
