            body: >-
              The public trust posture is real but still incomplete. Andela now has current privacy and terms documents
              that explicitly cover AI services, explain what data categories may be processed, describe multiple
              disclosure paths, and warn that AI outputs can be inaccurate, variable, or similar across customers. That
              is directionally positive because it shows the company is treating AI-specific legal exposure as a
              first-class issue rather than as an unspoken extension of older staffing contracts. Product and training
              pages also use the language enterprise buyers expect around governance, resilience, compliance,
              auditability, and access controls. The gap is that these statements are still closer to policy and
              capability language than to hard operating proof. The source set does not expose public status reporting,
              uptime commitments, incident history, placement-quality metrics by AI role, or third-party validation that
              the assessment stack reliably predicts AI-native job performance. The adverse angle therefore is not that
              the platform lacks substance; it is that core diligence points around reliability, partner dependence,
