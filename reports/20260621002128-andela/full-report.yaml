      - number: '6.3'
        title: Retention, Durability, and Repeat-Usage Proxies
        blocks:
          - type: paragraph
            body: >-
              Retention disclosure is the largest weakness in Andela’s customer chapter. The company publishes adoption
              proxies—2,000 plus client MSAs, 98% satisfaction, 97% ROI, 66% faster hiring, 33% faster project
              timelines—but it does not publicly provide the core recurring-revenue metrics investors normally want for
              durability analysis. No retained source gives NRR, GRR, churn, renewal rate, average contract length, or
              top-account revenue concentration. Even the scale headline is hard to normalize because the denominator
              behind “client MSAs” is not explained; it may include inactive, historic, or non-expanded agreements.


              That said, the retained evidence does provide some useful proxies. GitHub’s engagement is ongoing from
              April 2024 through the case-study publication window, and the account-level outcomes suggest sustained
              operational embedding rather than a one-off pilot. Maintaining 100% SLA performance and 4.61 CSAT while
              clearing a large backlog implies a service relationship important enough to matter to GitHub’s renewal
              economics. The Forrester TEI study, while company-commissioned, also points in the same direction: if
              customers truly save around $80,000 per talent hire and accelerate projects meaningfully, renewal
              incentives should exist. Still, the study is framed as a composite and does not prove realized retention
              for Andela’s live portfolio.


              Meta-proof from Google Workspace is helpful but only indirectly. It shows Andela itself running as a
              distributed, multi-country enterprise customer of collaboration software and realizing measurable
              productivity gains. That indicates Andela understands the workflow discipline and remote-operating
              complexity it sells into large accounts. It does not, however, substitute for revenue retention evidence
              from paying clients. The correct diligence conclusion is therefore asymmetric: customer value realization
              is credible enough to underwrite adoption, but customer durability is still an open question. Any model
              that assumes strong renewal or expansion should be conditioned on receiving cohort data, contract-length
              disclosure, and top-customer renewal history from management.
