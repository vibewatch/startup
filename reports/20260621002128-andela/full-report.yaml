  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Fresh primary or secondary pricing resets below the 2021 mark
        - Any verified financing, tender, or board-priced mark materially below $1.5B
        - Directly proves stale-price downside and compresses the valuation floor.
        - Pause any upgrade and re-underwrite around the new mark.
      - - Gross-margin or contribution-margin disclosure is weak
        - Private diligence shows services-heavy economics with limited operating leverage
        - Undermines the case that AI positioning deserves a premium multiple.
        - Treat the business more like staffing/services than AI infrastructure.
      - - Utilization or retention deteriorates after AI repositioning
        - Bench, churn, or customer retention data show weaker quality than the narrative implies
        - Suggests growth is being bought with inefficiency or turnover.
        - Move the call from track toward avoid until economics stabilize.
      - - Competitive win rates weaken versus integrated platforms or AI-native rivals
        - Recent deals consistently go to Deel, Turing, Toptal, or internalized hiring stacks
        - Signals that Andela's differentiation is not clearing the market.
        - Re-rate the comp set toward lower-multiple workflow or staffing peers.
      - - Contract friction remains high
        - Customers continue to cite opaque pricing, long lock-ins, or punitive conversion fees
        - Raises go-to-market friction and narrows the buyer universe.
        - Require evidence of pricing/process reform before paying a premium.
      - - AI disintermediation outpaces specialist demand
        - >-
          Buyer behavior shows generic engineering work moving in-house with AI tools faster than Andela can move
          upmarket
        - Shrinks the revenue pool that can justify premium marketplace economics.
        - Use the bear case as the default underwriting frame.
    notes: >-
      Triggers focus on evidence that can break the valuation thesis even if overall demand for software or AI labor
      remains healthy.
    claimRefs:
