- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Generic-demand compression
    - Mix of wins sourced from commodity staff augmentation versus AI-native / managed / training work
    - If management cannot show mix shift toward premium AI-native work within the next 12 months
    - Assume margin compression and lower terminal differentiation
  - - Assessment / quality gap
    - Placement success, oversight burden, and post-placement churn on AI-native roles
    - If key accounts report repeated oversight friction or if renewal quality weakens after AI-role deployments
    - Reduce confidence in the repositioning and haircut growth assumptions
  - - Cross-border compliance failure
    - Classification disputes, payroll misses, privacy complaints, or incident disclosures
    - Any material legal claim, regulator inquiry, or customer incident tied to AOR, privacy, or AI-service controls
    - Re-rate legal risk immediately and require counsel-backed remediation
  - - Stale valuation plus opaque economics
    - New financing, secondary marks, or audited profitability data remain absent
    - If no fresh valuation or credible economics evidence appears while growth story depends on AI narrative alone
    - Treat the 2021 valuation as non-actionable and widen downside case
  - - Customer-renewal opacity
    - Top-account concentration, NRR, churn, and contract-length disclosure remain unavailable
    - If diligence still cannot verify renewal quality or concentration after management sessions
    - Assume hidden renewal risk and cap conviction despite positive top-line stories
  - - Brand / talent trust deterioration
    - Applications, referrals, review sentiment, and voluntary attrition around the talent community worsen
    - If supply-side trust weakens while training and assessment demands intensify
    - Expect matching speed and quality to deteriorate and partner leverage to rise
  notes: The table converts narrative risk into measurable kill criteria so investors can update conviction as new private diligence or public signals arrive.
