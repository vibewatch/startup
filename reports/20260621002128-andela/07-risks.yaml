- id: legal-and-compliance-surface
  title: Legal, regulatory, and privacy surface
  body: The legal risk in Andela is less about a publicly visible lawsuit docket and more about the breadth of obligations embedded in the business model itself. Andela is explicitly selling cross-border contractor engagement, payments, and compliance support across more than 100 countries. That naturally raises worker-classification, data-transfer, privacy, and customer-liability questions. The company’s own policy stack makes the risk surface visible. The privacy policy says Andela processes professional, device, and sensitive data, may disclose data to service providers, affiliate partners, advertisers, and government actors, and offers CCPA plus EU, UK, and Swiss rights handling. The terms of use add binding arbitration, class-action waiver, and warnings that AI outputs may be inaccurate or incomplete. They also permit use of submissions for AI and machine-learning improvement. None of this proves a legal failure. It does show that compliance is not a side function; it is core product
    infrastructure. Public sources retained here do not surface active company-specific enforcement or litigation schedules, so investors should avoid over-reading silence as clearance. The right diligence stance is that Andela appears aware of the legal surface, but still needs counsel-backed evidence on classification controls, data-transfer architecture, incident response, and customer indemnity boundaries.
