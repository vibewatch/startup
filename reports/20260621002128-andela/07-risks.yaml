company:
  name: Andela
chapter:
  number: 7
  title: Risks
  summary: Andela’s biggest risks cluster around AI compressing demand for generic outsourced engineering, execution slippage in the shift toward AI-native talent, stale valuation and economics visibility, cross-border compliance/privacy burden, and opaque customer-renewal quality. The company has real mitigants in brand, global reach, training investment, and legal/product buildout, but the evidence still supports a high-residual-risk view until premium AI-native differentiation and renewal durability are proven publicly or in diligence.
sections:
- id: demand-and-model-risk
  title: Demand compression and model risk
  body: 'Andela’s biggest underwriting risk is that AI changes not just how software gets written, but which outside talent buyers still need. Third-party staffing and developer-signal sources show a market that is still large, but increasingly bifurcated. AI-native engineering demand is rising, buyers want faster matching, and providers are moving toward solutions work rather than simple resume supply. At the same time, AI-assisted development, low-code, and business-technologist workflows can absorb part of the routine application backlog that once supported generic outsourced engineering demand. That does not mean external talent disappears. It means value migrates toward specialist, governed, enterprise-ready work. Andela’s official response is clear: lean into AI-native talent, forward-deployed engineers, assessment, and upskilling. The problem is that this repositioning is not fully proven yet. Independent review evidence says Andela still looks stronger at access and scale than at
    reliably distinguishing truly AI-native engineers from generalist remote talent. If that gap persists, the company could face classic late-stage squeeze dynamics: slower new-logo growth, more price comparison, lower renewal quality, and weaker margins even while the market headline still looks healthy. This is why the investment question is not whether AI creates more engineering work in aggregate, but whether Andela captures the premium slice before generic staff augmentation is commoditized.'
