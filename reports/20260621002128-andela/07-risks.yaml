- id: financial-visibility-and-kill-criteria
  title: Financial visibility, stale valuation, and kill criteria
  body: 'Financial-model risk is elevated mainly because the public evidence stack is thin where investors most need precision. Andela’s last public valuation mark is the 2021 $1.5 billion Series E, and the retained 2024-2026 corpus does not show a newer priced round. That makes the valuation stale by late-stage private-company standards, especially because the business has since moved through layoffs, management change, and a strategic pivot toward AI-native talent. Public sources also do not disclose burn, profitability, cash runway, or customer-renewal metrics in a way that lets outsiders test whether the repositioning is improving economics. Independent review evidence adds another layer: opaque pricing, long contract minimums, and a conversion fee can help short-term revenue quality, but they also increase buyer friction precisely when enterprise customers are rethinking staffing, automation, and procurement commitments. The clean way to underwrite this company is therefore trigger-based.
    If Andela can prove premium AI-native matching, strong renewal quality, improving contract flexibility, and legal-control maturity without needing new outside capital, the risk picture improves quickly. If instead the company remains valuation-stale, economically opaque, and dependent on a narrative that the market no longer rewards, the downside transmission into margin, financing, and brand confidence is severe.'
