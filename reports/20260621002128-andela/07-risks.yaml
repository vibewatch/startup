  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-register-coverage
    missingEvidence: A counsel-backed jurisdiction matrix covering worker classification, tax, privacy transfer, and enterprise indemnity boundaries for the AOR and AI-service stack.
    whyItMatters: The public register shows the legal surface but not how Andela operationalizes it country by country or where exceptions exist.
    diligencePath: Request external counsel summaries, DPA templates, customer indemnity schedules, and any historical classification or privacy disputes by geography.
    relatedQuestionRefs:
    - QR008
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-visibility
    missingEvidence: Audited revenue, gross margin, burn, cash runway, and any internal board view on profitability or financing timing.
    whyItMatters: The 2021 valuation is stale, and public sources do not show whether the AI-native repositioning improves economics or simply changes narrative.
    diligencePath: Obtain board deck excerpts, audited or reviewed financial statements, and monthly KPI trendlines tied to staffing, managed services, and training mix.
    relatedQuestionRefs:
    - QR007
  - type: missing-source
    severity: material
    topic: customer-renewal-opacity
    missingEvidence: Top-customer concentration, renewal rates, contract length, churn, NRR, and revenue split between staffing, managed services, and training.
    whyItMatters: A company can look strategically relevant while still carrying hidden renewal or concentration risk that only appears in account-level data.
    diligencePath: Request top-10 account concentration, cohort renewals, pipeline conversion, and service-line revenue mix before relying on the MSA count narrative.
    relatedQuestionRefs:
    - QR019
    - QR029
  - type: missing-source
    severity: minor
    topic: security-control-visibility
    missingEvidence: Public or private evidence on SOC 2 / ISO status, pen-test cadence, incident-response SLAs, and historical material incidents.
    whyItMatters: Distributed AI-enabled work and large amounts of personal and professional data make control maturity central to enterprise trust.
    diligencePath: Ask for trust-center artifacts, security questionnaire responses, and any notable incident postmortems shared with customers.
    relatedQuestionRefs:
    - QR013
  - type: stale
    severity: material
    topic: valuation-mark-freshness
    missingEvidence: A newer priced round, secondary mark, debt financing disclosure, or audited proof that supports or rejects the 2021 valuation context.
    whyItMatters: Without a fresher economic signal, investors risk anchoring on an obsolete late-stage valuation while market structure is changing.
    diligencePath: Request cap-table updates, any 2024-2026 financing materials, and current investor-mark or 409A context.
    relatedQuestionRefs:
    - QR005
    - QR006
