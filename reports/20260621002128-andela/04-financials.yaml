  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized pricing and revenue mix
    missingEvidence: Realized bill rates, take rates, discount ladders, and revenue mix across placement, managed delivery, training, and AOR support.
    whyItMatters: Without realized pricing and mix, investors cannot tell whether Andela’s strongest growth comes from durable high-value work or lower-margin staffing activity.
    diligencePath: Request product-line revenue mix, sample MSAs and SOWs, bill-rate schedules, and cohort-level expansion data.
    relatedQuestionRefs:
    - QI003
    - QI005
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: gross margin and sales efficiency
    missingEvidence: Gross margin by service line, talent utilization, CAC, payback, retention, and average account expansion curves.
    whyItMatters: Buyer-outcome claims can look attractive while the actual margin stack or customer-acquisition efficiency remains weak.
    diligencePath: Request gross-margin bridge, utilization by role family, CAC and payback by segment, and NRR or logo-retention cohorts.
    relatedQuestionRefs:
    - QI010
    - QI016
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: critical
    topic: cash burn and runway
    missingEvidence: Current cash, monthly burn, runway cases, debt, and any working-capital facilities or guarantees.
    whyItMatters: Capital adequacy cannot be underwritten from public evidence without a live liquidity bridge.
    diligencePath: Request the latest balance sheet, monthly cash-flow bridge, debt schedule, and board runway scenarios.
    relatedQuestionRefs:
    - QI020
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: current headcount and operating leverage
    missingEvidence: Current employee count, contractor count, and function-level headcount split after the 2024-2026 repositioning.
    whyItMatters: Historical headcount snapshots are inconsistent enough that investors cannot infer present operating leverage or services intensity.
    diligencePath: Request an HR dashboard export with employees, contractors, bench, and utilization by geography and function.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: enumeration-incomplete
    severity: minor
    topic: revenue stream enumeration for TI001 remains partial because public sources show motions but not internal revenue segmentation or every contract wrapper.
    missingEvidence: A management-approved revenue taxonomy with stream definitions, contribution shares, and attach rates between staffing, managed delivery, training, dashboard, and AOR.
    whyItMatters: Without a complete revenue taxonomy, investors can misread Andela as either a pure staffing marketplace or an enterprise platform with more recurring mix than actually exists.
    diligencePath: Request a revenue bridge by stream, attach-rate analysis, and account-level mix progression from initial hire to broader spend.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI005
    relatedTableRefs:
    - TI001
  - type: enumeration-incomplete
    severity: minor
    topic: pricing enumeration for TI002 remains partial because current public surfaces do not show list prices, discounts, or conversion economics.
    missingEvidence: Current public or private pricing schedules covering seat rates, managed-team pricing, training packages, AOR fees, and conversion terms.
    whyItMatters: A quote-led commercial model can still be attractive, but opacity raises the risk that gross margin, contract rigidity, or discounting differ materially by account.
    diligencePath: Request sample pricing appendices, rate cards, discount ladders, and any direct-hire conversion terms for representative customers.
