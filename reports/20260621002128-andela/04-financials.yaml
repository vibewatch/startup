- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Revenue mix by stream
    - Without placement versus managed delivery versus training versus AOR mix, investors cannot judge revenue quality or cyclicality
    - Request quarterly revenue mix, gross billings, and average contract value by product line
  - - Realized pricing and discounts
    - Marketing claims cannot be turned into revenue forecasts without actual rate cards, discount ladders, and contract terms
    - Request sample MSAs, SOWs, bill-rate schedules, and conversion-fee policies
  - - Gross margin and take rate
    - No way to underwrite margin path, services intensity, or software leverage
    - Request gross margin bridge by service line, geography, and customer segment
  - - Cash, burn, runway, and debt
    - Capital adequacy remains opaque despite historical funding
    - Request latest balance sheet, cash-flow statement, debt schedule, and runway casework
  - - Customer concentration and retention
    - Large logos do not prove durable recurring economics if a few accounts dominate spend
    - Request top-10 customer concentration, NRR, logo retention, and expansion cohorts
  - - Current headcount, utilization, and contractor mix
    - Operating leverage cannot be inferred cleanly from public snapshots
    - Request current employee and contractor counts by function, bench levels, and utilization by role family
  notes: Every row names a blocking private metric rather than a speculative estimate; these are the minimum asks before serious underwriting.
