- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Placement / embedded talent
    - Andela matches individual technical talent into client teams through marketplace-style sourcing and vetting
    - Per hire, seat, or engagement
    - Core current motion on official surfaces; public mix undisclosed
    - Visible mechanism, opaque mix
    - Break out placement-fee share, average bill rate, and conversion to longer-term spend
  - - Fully managed teams / AI delivery
    - Clients can augment teams or deploy fully managed AI engineering teams to build and scale systems
    - Project, team, or SOW
    - Explicitly marketed across homepage, AI-native talent, and Talent Cloud surfaces
    - High strategic relevance, low pricing visibility
    - Disclose share of revenue from managed delivery, utilization, and margin by delivery model
  - - Training, assessments, and TaaS
    - Andela markets workforce upskilling, AI training, and assessment-led talent qualification
    - Program, cohort, or assessment package
    - Publicly visible but no standalone public price sheet
    - Real offering, unclear monetization depth
    - Provide list pricing, attach rate to staffing deals, and renewal or repeat-purchase data
  - - Talent Cloud workflow
    - Platform workflow covers sourcing, qualifying, hiring, managing, and paying talent in one system
    - Software-enabled hiring workflow
    - Capability is public; standalone software monetization not disclosed
    - Platform value is visible, software economics are not
    - Separate software subscription or platform-fee revenue from service revenue
  - - Pay / AOR contractor support
    - Andela contracts and pays global contractors on behalf of clients, including talent sourced outside Andela
    - Monthly contractor administration
    - Live current product with monthly USD invoicing and MSA coverage
    - Clear admin workflow, unknown take rate
    - Disclose fee basis points, float economics, compliance cost, and attach rate
  - - Executive dashboard / analytics layer
    - Dashboard surfaces spend, time-to-hire, active talent, and funnel metrics for existing clients
    - Analytics or governance add-on
    - Publicly launched for clients; packaging not disclosed
    - Retention-supporting feature, unclear direct revenue
    - Clarify whether dashboard is bundled, upsold, or priced into enterprise tiers
