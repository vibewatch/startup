- id: gtm-proxies-and-unit-economics
  title: GTM motion and unit economics are visible through proxies, not audited metrics
  body: 'Andela has supplied plenty of sales-efficiency and buyer-outcome claims, but almost all of them are marketing-layer proxies rather than direct economics. The strongest official proxy is the Forrester TEI work cited by Andela: 97% ROI, 66% faster time to hire, 33% faster project timelines, and about $80,000 of savings per talent hire. The 2024 CRO announcement and earlier Talent Cloud release repeat the same core thesis in a different form, promising 70% faster hiring and 30-50% lower cost. The 2023 buyer survey adds another GTM clue because enterprises said they already outsource large portions of workloads and frequently want end-to-end management, project design, and short-term contracting flexibility.


    What is missing is the bridge from those claims to Andela’s own unit economics. Public sources do not disclose average bill rate, take rate, gross margin by service line, talent utilization, customer concentration, CAC, payback, or expansion revenue. The new Executive Dashboard proves management has spend and pipeline telemetry for current clients, but not that outside investors can see it. Independent market data cuts both ways: it supports the shift toward SOW and AI-native staffing, yet it also shows faster matching is becoming table stakes and that wage inflation can compress margins. So the available evidence says Andela likely has a real enterprise GTM engine, but not enough public metrics to translate that engine into a defensible margin path.'
