- id: public-traction-and-capital-adequacy
  title: Public traction is credible, but capital adequacy is still mostly inference
  body: 'The traction picture is strong enough to take seriously but not strong enough to underwrite in full. Third-party alt-data providers commonly place 2024 revenue or ARR around $264 million and continue to cite a $1.5 billion valuation. Official pages reinforce that this is not an empty shell: Andela claims 17,000 certified AI-native engineers, more than 200,000 technologists trained, 650-plus Fortune 500 customers, and a client-facing dashboard that tracks active talent and total spend. Taken together, that makes the company look materially scaled. But investors should keep the labels straight. Those are a mix of company claims, third-party-reported estimates, and inferred operating signals, not audited financial statements.


    Capital adequacy is where the disclosure gap becomes most consequential. The last public priced round in the retained evidence is still the $200 million Series E from September 2021. Public sources do not show a later priced financing, current cash balance, monthly burn, runway, or debt obligations. The main adverse public clue is historical rather than current: 2020 layoff coverage documented 135 cuts, 10-30% salary reductions for senior staff, and management commentary about new business slowing dramatically. That does not prove current distress, but it does show Andela has had to manage demand volatility before. The practical conclusion is that Andela may be large enough to fund several revenue motions, yet investors still cannot tell from public materials whether the business is self-funding, near break-even, or dependent on another private round.'
