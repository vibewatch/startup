- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Last priced round
    - $200M Series E at $1.5B valuation in Sep 2021
    - High
    - Latest hard price discovery still anchors external expectations
    - Confirm whether any later primary financing, tender, or structured secondary changed the cap table
  - - Total public funding
    - Official round history supports ~$381M; alt-data stretches to ~$419M
    - Medium
    - Funding base informs how much dilution and cash support may still exist
    - Reconcile official round totals, secondaries, debt, and any off-balance-sheet capital
  - - Current cash on hand
    - Not publicly disclosed
    - Low
    - Cash is the first solvency input
    - Provide latest balance-sheet cash and restricted cash
  - - Monthly burn and runway
    - Not publicly disclosed
    - Low
    - Runway determines financing dependency and urgency of next round
    - Provide trailing-12-month burn, current monthly cash use, and base/bear runway scenarios
  - - Historical cost-discipline signal
    - 2020 layoffs and 10-30% senior pay cuts after business slowdown
    - Medium
    - Shows management will resize cost base when demand weakens
    - Explain what current fixed-cost structure would allow if demand softens again
  - - Current headcount anchor
    - Public snapshots range from 1.2K to 1.5K historically; 2025 alt-data says ~1.3K
    - Low
    - Internal scale is a proxy for service-delivery intensity and operating leverage
    - Provide current headcount by function, geography, and contractor versus employee status
  - - Debt / project-finance obligations
    - No debt or similar obligations surfaced in retained public evidence
    - Low
    - Undisclosed leverage can change runway and covenant risk materially
    - Disclose debt, vendor financing, guarantees, and any working-capital facilities
  notes: The table distinguishes hard historical capital facts from the present liquidity metrics that remain private.
