    - Need reference architectures, pricing mechanics, and reliability metrics by workstream
  - - AI Academy / Training as a Service
    - Engineering leaders, L&D, transformation teams
    - Expanded in 2025-2026
    - Uses project-based curricula tied to real enterprise tooling and delivery outcomes
    - Need enterprise cohort case studies and curriculum refresh cadence
  - - Assessment engine (Qualified + Woven + playback)
    - Talent acquisition, hiring managers, solution architects
    - Actively expanding
    - Turns technical screening into observed process data with code playback and AI-era scenarios
    - Need independent proof that assessment scores predict job performance in production
  - - Talent Cloud workflow layer
