  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: product-module-enumeration
    missingEvidence: >-
      A full SKU or internal product catalog showing every sellable module, internal tooling dependency, and packaging boundary inside Andela’s AI-native stack.
    whyItMatters: >-
      Public pages reveal the main surfaces but not every submodule or which capabilities are bundled versus custom-scoped per client.
    diligencePath: Request the internal product taxonomy, SKU matrix, and solution-architecture deck used by sales engineering.
    relatedQuestionRefs:
    - QE002
    - QE003
    - QE026
    relatedTableRefs:
    - TE001
  - type: enumeration-incomplete
    severity: material
    topic: roadmap-enumeration
    missingEvidence: >-
      A dated internal roadmap for assessment releases, curriculum refreshes, partner dependency milestones, and reliability instrumentation beyond public press releases.
    whyItMatters: >-
      Without a private roadmap investors cannot tell which capabilities are shipped, which are partner-dependent, and which still live mostly in narrative form.
    diligencePath: >-
      Request quarterly product roadmaps, release notes, and customer rollout calendars across Talent Cloud, assessment, and Academy products.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE023
    - QE026
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: >-
      Public uptime, placement-quality, model-evaluation, escalation, or incident metrics for Andela’s AI system delivery and workflow-support services.
    whyItMatters: >-
      Enterprise buyers and investors need proof that the platform and managed-delivery layers are reliable, not just that policy pages and case studies exist.
    diligencePath: >-
      Request SLA dashboards, incident logs, customer scorecards, evaluation artifacts, and support-operating metrics by service line.
    relatedQuestionRefs:
    - QE021
    - QE026
  - type: missing-source
    severity: material
    topic: assessment-validation
    missingEvidence: >-
      Independent validation that Qualified and Woven predict AI-native job performance in real customer environments rather than only in assessment scenarios.
    whyItMatters: >-
      Assessment credibility is central to Andela’s differentiation claim, especially as competitors also promise faster AI-native hiring.
    diligencePath: >-
      Request validation studies, false-positive and false-negative analysis, benchmark retention data, and customer back-tests linking assessments to on-job outcomes.
    relatedQuestionRefs:
    - QE023
    - QE025
    - QE026
  - type: stale
    severity: minor
    topic: partner-dependence
    missingEvidence: >-
      Evidence showing how quickly Andela refreshes partner-linked curricula when GitHub, model vendors, or orchestration frameworks change.
    whyItMatters: If the curriculum lags fast-moving tools, Andela’s marketed AI fluency could decay faster than enterprise buyers expect.
    diligencePath: >-
      Review curriculum version histories, partner update cadences, and examples of how prior toolchain changes were rolled into production training.
    relatedQuestionRefs:
    - QE022
