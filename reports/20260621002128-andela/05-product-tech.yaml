- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Key risk
  rows:
  - - Developer ecosystem and matching
    - Creates the top-of-funnel talent pool and routes people into roles with AI plus human sourcing
    - 5.6M ecosystem data, recruiter operations, community signals
    - Matching quality is hard to audit externally and may vary across role families
  - - Assessment foundation
    - Screens for coding skill, AI fluency, and job fit through tests, scenarios, and rubrics
    - Qualified, Woven, Codewars, playback telemetry, proctoring
    - Public evidence that scores predict real production performance is still thin
  - - Curriculum and learning engine
    - Reskills network talent and powers enterprise TaaS programs
    - GitHub, CNCF, Linux Foundation, model and tooling partners, mentors
    - Curriculum can lag fast-changing AI tools or become over-dependent on partners
  - - Talent Cloud operations layer
    - Coordinates sourcing, qualification, workflow analytics, spend visibility, and lifecycle management
    - Dashboarding, workflow instrumentation, platform integrations, ops staff
    - Acts more as orchestration software than a standalone moat, so feature parity risk exists
  - - Managed delivery and FDE layer
    - Turns assessed talent into embedded engineers or pods that execute in customer environments
    - Delivery managers, secure access, customer systems, role archetypes
    - Public proof is concentrated in a few named examples rather than a wide reliability ledger
  - - Policy and trust layer
    - Sets legal, privacy, AI output, and data handling boundaries for all services
    - Terms, privacy policy, internal governance processes
    - Public artifacts are mostly legal disclosures instead of independently verified controls
  notes: >-
    Architecture is reconstructed from product pages, assessment acquisitions, policy documents, and case materials; no public engineering diagram or API documentation package is exposed in the retained set.
