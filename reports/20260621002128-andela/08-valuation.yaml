- id: final-diligence-and-upgrade-path
  title: Final diligence and upgrade path
  body: An upgrade from track to buy is possible, but it depends on evidence the public pack does not contain today. Investors need to know whether the company has preserved or improved economics since the 2021 Series E, whether any post-2021 internal or secondary pricing resets have already happened, and whether AI positioning is translating into better win rates and account quality instead of just better marketing language. They also need headcount, utilization, and retention data to judge whether Andela is becoming more operationally efficient or simply shifting its narrative while maintaining service-heavy economics. That missing information matters because the recommendation is not a company-quality score. It is an entry-discipline judgment. If management can show resilient margins, durable utilization, positive competitive win-loss data, and clean cap-table terms, the stale mark could move from stretched toward fair. Until then, the company is worth tracking closely, but the prudent
    investor stance is to insist on fresh data before paying for upside that has not yet been verified in filing-grade form.
