- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - AI-native positioning plus enterprise upskilling could move Andela toward higher-value work than generic staffing.
    - thesis
    - Verified mix shift, better margins, and proof that AI Academy output is monetizing would strengthen this case.
  - - Cross-border demand and talent scarcity still support buyer interest in curated technical networks.
    - thesis
    - A meaningful deterioration in remote or outsourced demand would weaken the demand floor.
  - - The stale mark only implies about 5.7x on cited 2024 revenue, which is not visibly impossible for a differentiated AI-talent platform.
    - thesis
    - Audited revenue or a fresh financing event would make the ratio much more credible.
  - - The last hard valuation is old and not supported by current cap-table, margin, or retention disclosure.
    - anti-thesis
    - Fresh primary pricing or investor-grade economics could reduce stale-price risk materially.
  - - AI tooling can commoditize portions of software work and make generic remote-engineer intermediation easier to replace.
    - anti-thesis
    - Win-loss data proving Andela is taking share because of AI-native execution would soften this concern.
  - - Contract rigidity and opaque pricing can narrow the buyer set even if technical talent quality is real.
    - anti-thesis
    - Shorter commitments, clearer pricing, and lower conversion friction would improve the commercial underwrite.
  notes: Arguments are framed around what the old mark already assumes rather than whether Andela is a credible company in absolute terms.
