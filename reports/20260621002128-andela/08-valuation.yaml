chapter:
  number: 8
  title: Valuation
  summary: Andela still shows enough demand proof and strategic reinvention to merit investor attention, but the last hard price remains the 2021 $1.5 billion Series E while the best external revenue anchor is only an alt-data estimate of roughly $264 million for 2024. That combination supports a track recommendation with medium confidence, high risk, and a stretched valuation stance until fresh price discovery or filing-grade economics emerge.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Andela still has a credible operating story. The company has repositioned around AI-native engineers, production AI systems, and enterprise upskilling, and its official materials still point to a meaningful customer base, hiring-speed claims, and a large training pipeline. Those factors justify staying close to the name rather than dismissing it as a post-remote-work casualty. But the investment call has to be price-sensitive. The last hard valuation mark is still the September 2021 Series E at $1.5 billion, while the best external current revenue anchor in the fetched pack is an alt-data estimate of roughly $264 million for 2024. That can support a conversation, not conviction. The public record does not yet provide audited margins, cash conversion, or updated preference terms that would let an investor decide whether the stale mark is conservative, fair, or already fully valued. That is why the right posture is track with medium confidence and high risk: there is enough demand
    evidence to keep monitoring, but not enough fresh price discovery to underwrite a buy call above or even cleanly at the old mark.'
