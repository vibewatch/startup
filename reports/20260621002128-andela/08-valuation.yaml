  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current liquidation preferences, investor rights, secondary tender history, and any post-2021 internal pricing marks.
    whyItMatters: Fresh price discovery and preference terms determine whether the stale 2021 mark is still investable or already overhung.
    diligencePath: Request the latest cap table, stockholders' agreement, tender history, and any 409A or board pricing materials.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Verified gross margin, contribution margin, burn, free cash flow, and cohort retention by product line.
    whyItMatters: Without economics quality, the stale price can only be framed on revenue heuristics rather than investment-grade underwriting.
    diligencePath: Request audited financials, monthly KPI packs, and product-line margin bridges since 2023.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: headcount-and-utilization
    missingEvidence: Current employee count, utilization, bench levels, attrition, and contractor mix after the layoff period.
    whyItMatters: Headcount and utilization reveal whether Andela is gaining operating leverage or merely preserving narrative momentum.
    diligencePath: Request HR dashboards, bench reports, and utilization cohorts by region and service line.
    relatedQuestionRefs:
    - QV029
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: Public win-loss data versus Turing, Toptal, Deel, and Upwork Enterprise for AI talent or managed delivery deals.
    whyItMatters: Narrative differentiation is not enough if buyers are actually picking integrated or AI-native alternatives at the point of sale.
    diligencePath: Request recent enterprise deal reviews, churn reasons, and formal competitive-intelligence summaries from sales leadership.
    relatedQuestionRefs:
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage is partial because the fetched pack lacks like-for-like valuation and revenue data for several competitors and public platform substitutes.
    missingEvidence: Comparable revenue, margin, and current valuation or public-multiple data for Toptal, Upwork Enterprise, Deel, and ADP talent-specific segments.
    whyItMatters: The comp set is directionally useful, but partial coverage can overstate or understate how stretched the stale Andela mark really is.
    diligencePath: Add current investor materials, private-market marks, or segment disclosures for the closest peers before treating the comp table as exhaustive.
    relatedQuestionRefs:
    - QV016
    - QV017
    - QV018
    - QV019
    - QV020
    - QV030
    relatedTableRefs:
    - TV004
