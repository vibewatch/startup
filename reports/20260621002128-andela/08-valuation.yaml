- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Cap table and preferences
    - Post-2021 tenders, preference stack, protective provisions, and any internal marks
    - Fresh price discovery and liquidation terms determine whether the stale mark is investable.
    - CFO / legal room request plus latest cap-table package.
  - - Economics quality
    - Gross margin, contribution margin, burn, and cohort retention by product line
    - Revenue without margin quality can still deserve a lower services-like multiple.
    - Finance diligence with audited statements and monthly KPI packs.
  - - Headcount and utilization
    - Current employees, contractor mix, utilization, bench, and attrition
    - Operating leverage and delivery risk cannot be judged from narrative proof alone.
    - HR and operations dashboards by region and service line.
  - - Competitive win-loss
    - Recent enterprise wins and losses versus Turing, Toptal, Deel, Upwork, and internal hiring
    - Validates whether Andela's AI positioning is actually clearing the market.
    - Sales leadership QBRs and formal competitive-intelligence reviews.
  - - AI Academy monetization
    - Conversion of trainees into billable placements, services, or training revenue
    - Separates strategic storytelling from real revenue and margin uplift.
    - Product and revenue-ops cohort analysis since the academy expansion.
  - - Customer concentration and renewal quality
    - Top-account mix, renewal cohorts, NRR, and exposure to a few large programs
    - A concentrated book can make valuation look stable until one buyer pauses.
    - Top-20 account review and renewal cohort walk-through.
  notes: Every diligence ask is designed to determine whether the stale 2021 price should be revised up, revised down, or treated as irrelevant.
