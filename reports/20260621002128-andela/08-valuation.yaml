- id: valuation-context-and-comparables
  title: Valuation context and comparable limits
  body: The most useful valuation lens is to start with the stale mark and ask what kind of business it would need to represent today. On the cited $264 million 2024 revenue base, the old $1.5 billion mark implies about 5.7x revenue. That is not automatically absurd for a differentiated AI-talent story, but it is not obviously cheap for a services- and marketplace-heavy business with opaque margins either. Comparability is the central challenge. Turing is the closest AI-native positioning reference, and even the limited retained evidence suggests a broader platform with a higher $2.2 billion headline valuation, model-training exposure, and much larger talent-profile claims. Toptal is a better curated-network analog, while Upwork Enterprise and Deel are more useful for workflow and platform pressure than for clean price anchoring. ADP shows how large diversified workforce platforms become once they own durable system-of-record relationships, but it is far too broad to treat as a direct peer.
    The comp table therefore bounds the discussion rather than proving a single fair multiple, and its partial coverage is itself a warning sign that stale-price risk remains high. Public marketplace peers such as Upwork and Fiverr at least offer investor-relations pages, regular results calendars, and active AI-themed commercial updates, which makes Andela's disclosure gap part of the valuation debate rather than a side note.
