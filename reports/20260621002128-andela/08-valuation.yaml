- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - AI Academy output, specialist demand, and enterprise delivery improve growth and mix, allowing Andela to earn a 7x-9x revenue framework on a larger base.
    - Value moves toward roughly $1.8B-$2.4B and the stale mark starts to look conservative rather than demanding.
    - Requires real margin improvement, clear competitive wins, and no adverse cap-table surprises.
    - low
  - - Base
    - Revenue holds near the cited ~$264M level with some AI uplift, but disclosure remains private and economics stay unproven.
    - Value clusters around roughly $1.3B-$1.6B, leaving the old $1.5B mark fair only if the business quality has held.
    - Even decent execution may not offset stale pricing and limited disclosure.
    - medium
  - - Bear
    - Generic AI coding, buyer platform substitution, pricing opacity, or utilization pressure compress perceived quality toward a 3x-4x revenue frame.
    - Value falls toward roughly $0.8B-$1.1B, well below the 2021 primary mark.
    - Compression can happen without demand collapse if differentiation weakens or margins disappoint.
    - medium
  notes: Scenarios use revenue-multiple ranges because public evidence is too thin for a cash-flow or margin-normalized model.
