- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Andela last hard mark
    - Private valuation / cited 2024 revenue
    - ~5.7x on $1.5B and ~$264M cited 2024 revenue
    - Best anchor for the current debate because it ties the stale mark to the only retained public revenue estimate.
    - Uses a 2021 price and alt-data revenue rather than fresh audited disclosure.
  - - Turing
    - Private valuation / official operating status
    - Reported $2.2B valuation in 2025; official site shows AI-talent and model-training scale
    - Closest AI-native narrative comp in the retained pack.
    - Broader business model than Andela and the fetched news item provides limited detail.
  - - Toptal
    - Official network status
    - Premium curated talent network; no current valuation disclosed in fetched pack
    - Useful comp for elite-network economics and fast matching.
    - No retained revenue or valuation data, so price anchoring is incomplete.
  - - Upwork / Upwork Enterprise
    - Public marketplace status + enterprise unit
    - Public IR, SEC filings, and active 2026 AI-product/news cadence; enterprise unit rebranded as Lifted
    - Closest public enterprise-marketplace workflow reference and useful signal that listed platforms are embedding AI in talent discovery.
    - Public-company mix is broader than the enterprise unit and does not isolate economics for Andela-like managed delivery.
  - - Fiverr / Fiverr Pro
    - Public marketplace + premium freelance status
    - Public IR cadence and June 2026 AI-specialist demand signal; no direct EV/revenue bridge cited here
    - Relevant public talent-marketplace comp with visible demand for AI-specialist talent and flexible hiring models.
    - Freelance-marketplace economics differ from Andela’s managed-delivery and staffing mix, so comparability is partial.
  - - Deel talent sourcing
    - Official platform status
    - 40,000+ customers; 150+ countries; integrated sourcing-to-employment workflow
    - Useful comp for broader talent-infrastructure competition and buyer preference for bundled workflows.
    - Talent module is only part of Deel and current valuation data is absent from the retained pack.
  - - ADP
    - Public workforce-platform status
    - 1.1M+ clients across 140+ countries; public diversified workforce platform
    - Upper-bound reference for what scale and disclosure look like in broader workforce infrastructure.
    - Far broader than Andela and not a direct marketplace or AI-talent peer.
  - - Freelancer
    - Public listed marketplace status
    - ASX-listed public freelancer marketplace with 1Q26 and annual-report materials visible
    - Useful broader talent-marketplace reference for how a listed aggregation platform discloses results and governance.
    - Crowdsourcing and self-serve freelancing differ materially from Andela’s enterprise matching and managed-delivery model.
  - - Remote
    - Integrated global HR / EOR platform status
    - All-in-one global HR and EOR workflow; not a direct valuation comp in this pack
    - Useful substitute-pressure reference because some buyers may choose workflow ownership over a separate talent marketplace.
    - Primarily HR and compliance infrastructure rather than Andela-style engineering talent curation.
  - - Freelancer Enterprise
    - Public enterprise marketplace status
    - 53M+ worker cloud workforce and no annual fees in official enterprise positioning
    - Broader talent-marketplace reference for scale and enterprise-friendly pricing contrast.
    - Crowdsourcing model and self-serve liquidity differ from Andela’s matching and managed-delivery emphasis.
  notes: The comp set is intentionally mixed because no single public or private peer cleanly matches Andela's talent marketplace, managed delivery, and AI-upskilling blend.
  enumerationScope:
    coverage: partial
    basis: This table covers the most decision-useful comparables available in the retained June 2026 pack, but it is not exhaustive because several peers lack like-for-like revenue, margin, or fresh valuation disclosure.
