- id: scenario-logic-and-downside
  title: Scenario logic and downside transmission
  body: 'The bull, base, and bear cases all turn on the same tension: Andela may be strategically moving in the right direction just as AI also makes generic talent intermediation easier to attack. The upside case assumes the company can use the AI Academy, specialist positioning, and enterprise-delivery narrative to push mix toward higher-value work and earn a premium 7x to 9x revenue framework. The base case is less dramatic. It assumes Andela keeps roughly its cited revenue base, captures some AI-related growth, and avoids another major contraction, but still lacks the margin proof needed to justify a step-change above the old valuation. The downside case is easier to defend from public evidence because it does not require demand to disappear. It only requires stale pricing to meet slower growth, contract rigidity, or buyers shifting toward integrated or AI-native alternatives. The 2023 layoffs, the adverse review on lock-ins and opaque pricing, and the broad spread of AI tooling all
    show how quickly differentiation can be questioned if the company cannot prove better economics than a generic marketplace or staffing firm.'
