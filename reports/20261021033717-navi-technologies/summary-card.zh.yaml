  topStrengths:
    - Navi Finserv 披露 FY26 管理资产规模（AUM）为 INR 13,138 crore，税后利润为 INR 292 crore。
    - 据报道，Navi 在 2026 年 7 月的消费者 UPI 交易份额达到 4%。
    - 这款应用覆盖支付、贷款、保险和投资，具备可信的交叉销售空间。
  topRisks:
    - 尽管收入增长 16%，FY26 合并净亏损仍扩大至 INR 466 crore。
    - RBI 在 2024 年限制放贷后，监管问题再次出现的风险仍然不小。
    - 据称，第三方支付网关漏洞造成了 INR 14.26 crore 的欺诈损失。
    - 据报道的融资和估值缺少公开签署条款，产品层面的单位经济性仍未披露。
  unresolvedGaps:
    - 2026 年 8 月已签署的融资条款、监管批准、当前股权结构表和投资者权利。
    - 经审计的 FY26 集团账目、当前流动性、现金消耗，以及产品层面的贡献利润率。
    - 当前信贷批次表现、逾期曲线、催收结果和压力损失。
    - 各产品的活跃客户、留存率、附加购买率、集中度，以及经独立验证的结果数据。
    - 支付网关修复、模型表现、正常运行时间和集团层面安全控制仍缺乏独立验证。
