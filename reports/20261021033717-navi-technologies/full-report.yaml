chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Navi was founded in Bengaluru in 2018 by Sachin Bansal and Ankit Agarwal, and the consumer app is now
              owned by Navi Limited, formerly Navi Technologies Limited. The app combines UPI payments, cash and home
              loans, health insurance, and mutual funds rather than operating as a single-product lender. Regulatory
              responsibility is distributed across group entities: Navi Limited is the NPCI-approved UPI application
              provider, Navi Finserv is the RBI-regulated non-deposit-taking NBFC, Navi General Insurance is registered
              with IRDAI, and the mutual-fund complex uses SEBI-registered entities. This breadth creates cross-sell
              potential, but it also means consolidated identity must not be confused with the performance or regulatory
              status of any one subsidiary.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
