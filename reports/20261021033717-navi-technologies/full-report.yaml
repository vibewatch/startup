      - - Confidence
        - Medium-low
        - Key valuation inputs are secondary, conflicting, or private
      - - Risk rating
        - High
        - Require credit, regulatory, governance, and financing diligence
      - - Valuation stance
        - Insufficiently supported
        - Treat the reported $1.3B mark as a reference, not fair value
    notes: >-
      Assessments are analytical judgments as of 2026-10-21; no signed round terms, audited FY26 filing, or fully
      diluted cap table was available in the assigned evidence.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV013
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Diversified lending, payments, insurance, and wealth products create several monetization paths
        - Verified retention, cross-sell, and segment contribution margins
      - - Thesis
        - >-
          Reported institutional capital and renewed IPO preparation can improve external validation and liquidity
          options
        - Closed financing, disclosed terms, and a regulator-ready IPO filing
      - - Anti-thesis
        - Reported FY26 loss and prior lending restrictions weaken confidence in premium pricing
        - Audited sustained profitability plus stable post-remediation credit performance
      - - Anti-thesis
        - Conflicting public financial summaries prevent a defensible revenue or earnings multiple
        - Audited consolidated statements reconciled to operating subsidiaries
    notes: >-
      The table separates observed or reported evidence from conditions that would change the investment view; product
      breadth does not prove cross-sell economics.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: Bull, base, and bear decision bands
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited profitability, resilient credit vintages, closed Prosus round, and credible IPO execution
        - Reported $1.3B mark or a modest premium becomes underwritable only with a documented return bridge
        - Not yet evidenced
        - IPO delay or failure to sustain profitability
      - - Base
        - Product breadth persists, but profitability, terms, and segment economics remain unresolved
        - Require a meaningful discount to the reported $1.3B mark plus investor protections
        - Best fit with current public evidence
        - Losses widen or financing terms are materially dilutive
      - - Bear
        - Renewed restrictions, weaker asset quality, or constrained debt/equity access
        - Avoid even below the reported mark until recapitalization and operating repair are verified
        - Plausible but unquantified
        - New supervisory action, rising write-offs, or covenant stress
    notes: >-
      These are evidence-conditioned decision bands, not probability-weighted fair-value estimates; exact ranges and
      target returns require private financing and operating data.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
