  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Navi's relevant market is not a single fintech category. It includes balance-sheet lending, UPI payments,
              health insurance and mutual funds, with each activity carrying a different revenue pool, regulator and
              payer. Lending includes interest-bearing personal, home and property-backed credit; it excludes deposits
              and should not be combined with payment volume. Insurance is bounded by gross written premium, while asset
              management is bounded by assets under management and fee yield. Status-quo substitutes include bank
              branches, NBFCs, agents, fund distributors and separate specialist apps. This boundary matters because UPI
              reach can widen Navi's funnel without itself proving monetization in credit, protection or investments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The most complete sizing evidence is the March 2022 DRHP, which embeds company-commissioned RedSeer
              estimates. It projected FY2026 Indian retail-loan AUM of US$1.15-1.25 trillion, health insurance gross
              written premium of US$17.6 billion and mutual-fund AUM of US$1.0 trillion. A narrower forecast put digital
              disbursals across personal loans, home loans and loans against property at US$107 billion, while
              personal-loan originations were projected at US$164 billion. These measures mix stocks and annual flows
              and cannot be added. They indicate large addressable pools, but the expired forecast horizon and
              commissioned methodology preclude a current SOM estimate.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
