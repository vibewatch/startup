            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: Posted packaging is transparent; relative value is not
        blocks:
          - type: paragraph
            body: >-
              Navi's public packaging makes its own proposition legible. The official site lists cash loans up to INR 20
              lakh, rates up to 26%, and repayment periods up to 84 months; loan-against-property terms extend to INR 5
              crore, rates up to 22%, terms up to 20 years, and loan-to-value up to 70%. Mutual-fund entry starts at INR
              100, while health cover is advertised up to INR 1 crore with a monthly starting price of INR 522. These
              are list terms, not realised customer pricing, approval rates, or economics. No comparable current peer
              price cards were present in the assigned pool, preventing a defensible claim that Navi is cheaper. Trust
              also remains a competitive input: the 2024 RBI lending restriction and its later removal are evidence of
              remediation, but also of regulatory scar tissue that bank and specialist brands can exploit.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.4'
        title: The moat depends on execution across regulated balance sheets
        blocks:
          - type: paragraph
            body: >-
              Navi's integrated app and owned regulated businesses create operational control, yet the durability case
              is constrained by structural economics. The IPO filing states that larger competitors may have lower-cost
              funding, broader reach, stronger partnerships, and more financing products. It also describes insurance
              competition as a contest in brand, underwriting, pricing, distribution, service, capital, and technology,
              while low entry barriers and fee pressure can commoditise asset management. Independent secondary data
              further suggests that lending interest supplied 85% of FY2025 revenue, making product breadth less
              economically diversified than the interface appears. The defensible thesis is therefore conditional: UPI
              can lower engagement friction and the app can expose multiple products, but lasting advantage requires
              better funding, measured cross-sell, compliant underwriting, and service quality. Until those metrics are
              disclosed, multi-homing and specialist displacement remain material risks rather than remote scenarios.
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth creates option value, not proven lock-in
            body: >-
              Navi can expose a payments user to lending, insurance, and investments in one app, but the assigned
              evidence does not quantify cross-sell, retention, or multi-product cohorts.
            calloutType: insight
            claimRefs:
              - CP005
              - CP016
          - type: callout
            title: Incumbent economics can neutralise app speed
            body: >-
              Larger competitors may pair lower funding costs, wider distribution, and stronger brands with similar
              digital journeys, pressuring both lending margins and fee-based products.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Growth has not yet translated into consolidated profit
        blocks:
          - type: paragraph
            body: >-
              FY26 revenue from operations rose 16% to ₹2,982 crore and total income rose 15% to ₹3,091 crore, yet
              consolidated net loss widened from ₹126 crore in FY25 to ₹466 crore in FY26. Reporting attributes the
              deterioration mainly to spending on UPI and other diversification initiatives, so the loss is an
              accounting result rather than a disclosed cash-burn measure. Management said the group reached operating
              break-even in the March quarter without one-off gains or investment cuts, but that point-in-time claim
              does not reconcile the full-year loss. Unsecured lending remains the principal earnings contributor, while
              insurance premium and mutual-fund AUM show adjacent scale without establishing revenue quality or margins.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
