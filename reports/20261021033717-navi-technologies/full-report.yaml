  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Navi progressed from founding and product assembly to scaled lending, regulatory interruption, and a reported
      first institutional equity round.
    data:
      items:
        - date: 2018-12
          label: Founded
          detail: Sachin Bansal and Ankit Agarwal founded the Bengaluru company.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2019'
          label: Lending platform assembled
          detail: CRIDS, later Navi Finserv, was acquired by Sachin Bansal.
          tone: neutral
          claimRefs:
            - CO001
            - CO011
        - date: '2020'
          label: Digital personal loans launched
          detail: The group launched its digital personal-loan product and expanded regulated financial-services operations.
          tone: positive
          claimRefs:
            - CO003
            - CO004
        - date: '2021'
          label: Product breadth expanded
          detail: Digital housing loans and the health-insurance proposition joined the broader app-led offering.
          tone: positive
          claimRefs:
            - CO003
            - CO004
        - date: 2022-03
          label: IPO draft filed
          detail: Navi filed a draft to raise INR 3,350 crore; the filing did not establish a completed IPO.
          tone: neutral
          claimRefs:
            - CO016
        - date: 2024-10
          label: RBI lending restriction
          detail: New loan sanctions and disbursements at Navi Finserv were barred.
          tone: risk
          claimRefs:
            - CO015
        - date: 2024-12
          label: Operations resumed
          detail: Navi Finserv reports that business operations resumed after the regulatory interruption.
          tone: neutral
          claimRefs:
            - CO015
        - date: 2025-02
          label: Group leadership transition
          detail: Sachin Bansal moved to chairman and Rajiv Naresh was appointed group CEO.
          tone: neutral
          claimRefs:
            - CO005
        - date: 2025-07
          label: Debt financing
