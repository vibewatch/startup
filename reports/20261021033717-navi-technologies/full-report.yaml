          label: Discover the Navi app
          detail: Retail consumers encounter a multi-product financial app rather than a single-purpose lending interface.
          touchpoints:
            - App
            - Referral
        - id: pay
          label: Use UPI payments
          detail: Instant transfers and payment rewards provide a frequent engagement surface.
          touchpoints:
            - UPI transfer
            - Merchant payment
        - id: reward
          label: Receive Navi Coins
          detail: >-
            Scratch-card rewards are designed to reinforce repeat transactions, although the teardown flags perceived
            reward-value disappointment.
          touchpoints:
            - Scratch card
            - Coin balance
        - id: borrow
          label: Consider credit
          detail: The app presents cash and property-backed lending as adjacent needs.
          touchpoints:
            - Cash loan
            - Loan against property
        - id: invest
          label: Begin investing
          detail: Mutual funds have a company-stated starting amount of ₹100.
          touchpoints:
            - Mutual fund
            - Portfolio dashboard
        - id: protect
          label: Add protection
          detail: Health insurance extends the relationship into household protection.
          touchpoints:
            - Health cover
            - Claims support
    approximationNotes: >-
