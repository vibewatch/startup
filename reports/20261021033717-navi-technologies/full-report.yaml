        title: Milestones, regulatory scar tissue, and open diligence
        blocks:
          - type: paragraph
            body: >-
              Navi's path has moved from a 2018 founding through acquisitions and product launches to a 2022 IPO filing,
              rapid lending growth, a 2024 regulatory interruption, and fresh institutional equity in 2026. The RBI
              lending restriction is the most important adverse milestone: independent coverage says new sanctions and
              disbursements were barred in October 2024, while the lending subsidiary says operations resumed in
              December 2024 after changes to underwriting and risk architecture. The timeline shows recovery and scale,
