  - id: FU001
    title: Consumer adoption surfaces and intended expansion loop
    type: journey-map
    summary: >-
      The app can acquire frequent-use customers through payments and refer them into higher-value financial products,
      but the assigned evidence does not quantify conversion or retention.
    data:
      nodes:
