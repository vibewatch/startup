      - number: '2.3'
        title: Buyers, users and adoption path
        blocks:
          - type: paragraph
            body: >-
              Navi historically targeted young, digitally connected middle-class consumers, but budget ownership differs
              by product: borrowers accept interest and repayment obligations, households pay insurance premiums,
              investors allocate savings, and merchants or ecosystem participants may fund payment economics. In FY2026
              reporting, Navi described UPI as a customer-acquisition channel and the other products as the monetization
              layer. Its consumer UPI share reached 4% in July 2026, while reported mutual-fund AUM was about ₹9,000
              crore and gross insurance premium about ₹200 crore. Those signals show activity in multiple lines, but do
              not disclose cohort-level conversion, retention or attach rates.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Smartphone distribution, paperless onboarding, low investment minimums and cross-product availability
              lower access friction. The principal constraint is that customer acquisition and regulated balance-sheet
              capacity must convert into durable margin. Navi Finserv's FY2026 operating revenue grew 17%, yet
              consolidated profit after tax fell 46%; at group level, Navi Technologies' net loss widened to ₹466 crore
              as UPI and diversification spending increased. Regulation can also interrupt supply: the RBI stopped Navi
              Finserv from issuing new loans in October 2024 before lifting the restriction in December. Market growth
              therefore has valuation value only if Navi can sustain compliant underwriting, fund credit economically
              and demonstrate cross-sell after acquisition.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: UPI is a funnel, not the earnings pool
            body: >-
              Management's reported model uses frequent payment activity to acquire users, while lending, insurance and
              investments are intended to monetize them.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: Growth does not remove regulated-balance-sheet risk
            body: >-
              The 2024 lending restriction and FY2026 profit compression show that distribution scale must be paired
              with compliant pricing, credit discipline and affordable funding.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A portfolio of contests, not one competitor set
        blocks:
          - type: paragraph
            body: >-
              Navi does not face a single clean peer group. Its own filing defines the competitive field broadly across
              banks, NBFCs, housing-finance companies, insurers, asset managers, small-finance banks, microfinance
              institutions, and other financial institutions. At the consumer-app layer, reporting and secondary
              analysis identify PhonePe, Google Pay, Paytm, CRED, Groww, PolicyBazaar, and Zerodha as overlapping
              specialists. The assigned evidence also leaves two non-vendor alternatives in view: informal credit for
              consumers outside organised finance and internal or partner-led builds enabled by India Stack. The
              practical implication is that Navi's breadth is unusual, but each vertical is benchmarked against a
              focused leader or a better-funded incumbent, not against another identical full-stack company.
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: Scale is credible in lending and UPI, but leadership remains vertical-specific
        blocks:
          - type: paragraph
            body: >-
              Navi has evidence of meaningful scale in two important distribution engines. Navi Finserv reported INR
              13,138 crore of assets under management for FY2026, while independent reporting placed the Navi app fourth
              in UPI in July 2026, behind PhonePe, Google Pay, and Paytm, with more than 947 million transactions that
              month. Those facts support a serious challenger position, but not category leadership. The same app spans
              UPI, cash and secured loans, mutual funds, and health insurance, creating more cross-sell surfaces than a
              single-product app. However, the assigned evidence does not disclose active cross-product users, attach
              rates, retention, or a peer-normalised funding base, so breadth should be treated as distribution
              potential rather than a demonstrated lock-in moat.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
