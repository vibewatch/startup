              - CE006
              - CE007
              - CE011
      - number: '5.2'
        title: Decisioning and delivery architecture
        blocks:
          - type: paragraph
            body: >-
              The disclosed lending architecture combines digital data collection, machine-learning credit decisioning,
              automated workflows, cloud infrastructure, and digital servicing. Navi's engineering article describes
              alternate inputs including bureau, geolocation, financial-history, and behavioral data, with models
              intended to identify identity, income, employment, collateral, and straw-borrower anomalies. The FY2026
              subsidiary report provides a fresher but still company-issued description of data orchestration, scalable
              cloud infrastructure, AI/ML risk assessment, portfolio monitoring, GenAI voice bots, Smart eNACH mandate
              orchestration, and an expanded co-lending stack. The architecture therefore appears vertically integrated
              around lending operations, but no retained source provides model accuracy, latency distributions,
              change-failure rates, or independent system benchmarks.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE014
      - number: '5.3'
        title: Deployment maturity and external dependencies
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates operating products rather than a roadmap-only platform, but maturity is unevenly
              evidenced. A September 2026 joint announcement says Navi and IndusInd Bank added a new UPI payment switch
              to diversify the payments stack, with a phased Android and iOS rollout. That is a concrete integration and
              deployment event, yet it also exposes reliance on bank and payment-ecosystem participants. Lending depends
              on digital identity and consent flows, multiple data sources, cloud services, funding and co-lending
              institutions, and automated collections. The reviewed material does not quantify failover behavior,
              switch-level service levels, recovery objectives, vendor concentration, or product-by-product release
              cadence, so claims of resilience and scale remain assertions rather than independently tested outcomes.
            claimRefs:
              - CE007
              - CE008
              - CE014
          - type: table
            tableRef: TE003
