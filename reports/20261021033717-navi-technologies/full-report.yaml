        title: Funding, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The clearest new financing event is the reported USD 100 million Prosus investment in August 2026,
              described variously as a first institutional equity round, pre-IPO financing, or Series C. Public
              aggregators do not reconcile total capital raised: their totals range from USD 100 million to USD 150
