        blocks:
          - type: paragraph
            body: >-
              Founder influence remains material. Public profiles identify Sachin Bansal as executive chairman, Rajiv
              Naresh as the holding-company CEO after the February 2025 leadership transition, and Abhishek Dwivedi as
              CEO and managing director of Navi Finserv. The lending subsidiary's March 2026 board had seven directors,
              four described as independent, providing regulated-entity oversight beyond the founders. That structure is
              useful but not a substitute for a current holdco committee map, reserved-matters schedule, or verified
              post-Prosus cap table. The diligence focus should therefore remain on how authority is divided among the
              founder-chairman, group CEO, regulated subsidiary boards, and new institutional capital.
