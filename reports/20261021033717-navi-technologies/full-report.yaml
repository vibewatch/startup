              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.2'
        title: UPI is the acquisition layer; lending is still the monetization engine
        blocks:
          - type: paragraph
            body: >-
              Navi is using UPI primarily to acquire and engage consumers, with lending, insurance, and investments
              positioned as the monetization layer. Its consumer UPI share reached a reported 4% in July, while
              management said incremental acquisition and retention costs were declining and revenue per active user
              from bill payments, recharges, gift cards, advertising, and related services was rising month on month.
              These directional statements support the strategic logic but do not disclose CAC, payback, cohort
              retention, conversion, or contribution profit. Historical filing evidence shows cross-sell potential, not
              current unit economics: in the nine months ended December 2021, 71.69% of home-loan customers and 52.67%
              of retail health-insurance customers came from the personal-loan-interested user base.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Public pricing is visible, realized economics are not
        blocks:
          - type: paragraph
            body: >-
              Navi's official surface lists cash loans of up to ₹20 lakh at interest rates up to 26%,
              loan-against-property products of up to ₹5 crore at rates up to 22%, and mutual-fund entry from ₹100.
              These are list terms and entry thresholds, not realized yields, revenue, or margin. The latest detailed
              filing available in the assigned evidence is historical: for the nine months ended December 2021,
              advertising, marketing, and publicity expense was ₹3,055.71 million, finance cost was ₹1,371.05 million,
              and impairment on financial instruments was ₹1,042.74 million. The mix identifies acquisition spend,
              funding cost, and credit loss as material economic levers, but it cannot substitute for FY26 product-level
              contribution margins.
            claimRefs:
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI008
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI015
      - number: '4.4'
        title: Capital access is visible, capital adequacy is not
        blocks:
          - type: paragraph
            body: >-
              A third-party database reports a $100 million Prosus-led financing in August 2026 at a $1.3 billion
              valuation. That is evidence of financing access, not evidence of cash available on the run date, because
              closing, use of funds, cash balances, debt maturities, and restrictions are not disclosed in the assigned
              current evidence. The 2024 RBI interruption to new lending, followed by removal of restrictions in
              December, also shows that revenue capacity can be constrained by compliance outcomes. The financial
              verdict is therefore mixed: growing income and an identifiable lending engine are positives, but the
              widening group loss and missing liquidity, credit-vintage, and product-margin data make margin durability,
              runway, and the next capital trigger material diligence blockers.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue growth is not runway
            body: >-
              FY26 operating revenue growth and a reported financing do not disclose cash burn or cash available.
              Underwriting requires current liquidity, debt-service, covenant, and downside-runway evidence.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Navi's current website positions one consumer app as the entry point for UPI payments, mutual funds,
              health insurance, cash loans, home loans, and loans against property. Independent reference material also
              describes digital loans, home loans, mutual funds, health insurance, digital gold, and UPI, supporting the
              breadth of the surface without proving cross-product attachment or a single shared backend. The customer
              proposition is workflow compression: transfer money, apply for credit, invest, or obtain cover through
              digital journeys rather than branch-led processes. For lending, the FY2026 Navi Finserv report describes
              paperless personal-loan and digitally enabled secured-loan journeys, while the homepage advertises 24/7
              support. These are observable product claims, not evidence of realized approval speed, support quality,
              retention, or economic benefit.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
