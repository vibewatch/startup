callouts:
  - calloutType: strength
    title: Regulated-product breadth with scaled lending
    body: >-
      Navi combines payments, lending, insurance, and mutual funds, while Navi
      Finserv reports INR 13,138 crore of AUM and positive FY26 profit after tax.
    claimRefs: [CO003, CO004, CO011, CO012]
