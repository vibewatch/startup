slug: navi-technologies
runDate: 2026-10-21
company:
  name: Navi Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Navi is a Bengaluru-founded, app-led financial-services group spanning UPI,
    lending, health insurance, and mutual funds. Its regulated lending arm
    reported INR 13,138 crore of FY26 AUM and INR 292 crore of profit after tax,
    while conflicting funding, valuation, and workforce figures leave important
    cover metrics unverified.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Navi was founded in Bengaluru in 2018 by Sachin Bansal and Ankit Agarwal,
      and the consumer app is now owned by Navi Limited, formerly Navi
      Technologies Limited. The app combines UPI payments, cash and home loans,
      health insurance, and mutual funds rather than operating as a
      single-product lender. Regulatory responsibility is distributed across
      group entities: Navi Limited is the NPCI-approved UPI application
      provider, Navi Finserv is the RBI-regulated non-deposit-taking NBFC, Navi
      General Insurance is registered with IRDAI, and the mutual-fund complex
      uses SEBI-registered entities. This breadth creates cross-sell potential,
      but it also means consolidated identity must not be confused with the
      performance or regulatory status of any one subsidiary.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Founder influence remains material. Public profiles identify Sachin Bansal
      as executive chairman, Rajiv Naresh as the holding-company CEO after the
      February 2025 leadership transition, and Abhishek Dwivedi as CEO and
      managing director of Navi Finserv. The lending subsidiary's March 2026
      board had seven directors, four described as independent, providing
      regulated-entity oversight beyond the founders. That structure is useful
      but not a substitute for a current holdco committee map, reserved-matters
      schedule, or verified post-Prosus cap table. The diligence focus should
      therefore remain on how authority is divided among the founder-chairman,
      group CEO, regulated subsidiary boards, and new institutional capital.
    claimRefs: [CO005, CO006]
    tableRefs: [TO002, TO003]
  - id: funding-and-scale
    title: Funding, valuation, and operating scale
    body: >-
      The clearest new financing event is the reported USD 100 million Prosus
      investment in August 2026, described variously as a first institutional
      equity round, pre-IPO financing, or Series C. Public aggregators do not
      reconcile total capital raised: their totals range from USD 100 million to
      USD 150 million because they count founder infusions, debt, and tracked
      rounds differently. A July 2025 INR 170 crore debt raise is separately
      reported. At the operating level, a third-party profile reports FY26
      consolidated revenue of INR 2,982 crore and an accounting loss of INR 466
      crore; this loss is not a cash-burn measure. Navi Finserv's own annual
      report shows INR 13,138 crore of AUM and INR 292 crore of profit after tax,
      underscoring why group and subsidiary metrics must remain separate.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
  - id: milestones-and-open-diligence
    title: Milestones, regulatory scar tissue, and open diligence
    body: >-
      Navi's path has moved from a 2018 founding through acquisitions and
      product launches to a 2022 IPO filing, rapid lending growth, a 2024
      regulatory interruption, and fresh institutional equity in 2026. The RBI
      lending restriction is the most important adverse milestone: independent
      coverage says new sanctions and disbursements were barred in October 2024,
      while the lending subsidiary says operations resumed in December 2024
      after changes to underwriting and risk architecture. The timeline shows
      recovery and scale, not proof that remediation is durable. Signed round
      terms, a current cap table, active-customer counts, product-level
      retention, and a reconciled group headcount remain unavailable in the
      assigned evidence.
    claimRefs: [CO001, CO003, CO007, CO009, CO011, CO015, CO016]
    figureRefs: [FO001]
