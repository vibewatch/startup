      - number: '1.2'
        title: 领导层、治理与关键人物暴露
        blocks:
          - type: paragraph
            body: >-
              创始人的影响力仍然很大。公开资料显示，Sachin Bansal 担任执行主席；2025 年 2 月领导层交接后，Rajiv Naresh 任控股公司 CEO；Abhishek Dwivedi 任 Navi
              Finserv CEO 兼董事总经理。放贷子公司 2026 年 3 月的董事会有 7 名董事，其中 4
              名被描述为独立董事，为受监管实体提供了超越创始人的监督。这一结构有帮助，但不能替代最新的控股公司委员会架构、保留事项清单或经核实的 Prosus 投资后股权结构表。因此，尽调重点仍应放在创始人兼董事长、集团
              CEO、受监管子公司董事会和新机构资本之间如何分配权力。
