        - 中，因为实施证据由公司提供，规则变化可能改变经济性
        - 梳理每项牌照和受监管实体；审查合规测试、投诉、同意日志和资本 情景
    notes: 根据指定 2024-2026 证据发现的重大公开监管和法律风险仅为部分列举；这 不是完整的诉讼、牌照或监管机构案卷，严重程度是与证据挂钩的分析师评估。
