  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 增长尚未转化为合并利润
        blocks:
          - type: paragraph
            body: >-
              FY26 经营收入增长 16% 至 ₹2,982 crore，总收入增长 15% 至 ₹3,091 crore，但合并净亏损从 FY25 的 ₹126 crore 扩大至 FY26 的 ₹466
              crore。报道将恶化主要归因于 UPI 和其他多元化投入，因此这是会计结果，而非已披露的现金消耗指标。管理层称，集团在 3
              月季度实现经营盈亏平衡，且没有依靠一次性收益或削减投资；但这一时点判断无法解释全年亏损。无抵押放贷仍是主要盈利贡献来源，保险保费和共同基金 AUM 只说明相邻业务有规模，不能证明收入质量或利润率。
            claimRefs:
