        title: 监管疤痕仍是首要投资风险
        blocks:
          - type: paragraph
            body: >-
              最具决策意义的监管事实，不只是 Navi 在受监管行业运营，而是监管干预已经发生。Economic Times 报道称，RBI 对 Navi Finserv
