  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户流程
        blocks:
          - type: paragraph
            body: >-
              Navi 当前网站把一个消费者应用定位为 UPI 支付、共同基金、健康保险、现金贷、住房贷款和房产抵押贷款的入口。独立参考资料还描述了数字贷款、住房贷款、共同基金、健康保险、数字黄金和
              UPI，支持产品界面的广度，但不能证明产品之间存在绑定或共用后端。客户价值主张是压缩流程：用户可以通过数字化旅程转账、申请信贷、投资或购买保障，而不是走网点流程。放贷方面，FY2026 Navi Finserv
              报告描述了无纸化个人贷款和数字化抵押贷款流程，首页则宣传 24/7 支持。这些是可观察的产品主张，不是实际审批速度、支持质量、留存或经济收益的证据。
            claimRefs:
              - CE001
