  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 立场
      - 论点
      - 改变判断的条件
    rows:
      - - 正方论点
        - 多元化的借贷、支付、保险和财富管理产品创造多条变现路径
        - 经验证的留存、交叉销售和分部贡献利润率
      - - 正方论点
        - 据报的机构资本和重启的 IPO 准备工作可以改善外部验证和流动性 选择
        - 已完成融资、已披露条款，以及可供监管审阅的 IPO 申报文件
      - - 反方论点
        - 据报的 FY26 亏损和此前的放贷限制削弱了对溢价定价的信心
        - 经审计的持续盈利，加上整改后稳定的信贷表现
      - - 反方论点
        - 相互冲突的公开财务摘要无法支持可信的收入或盈利倍数
        - 经审计的合并报表与运营子公司完成勾稽
    notes: 该表将观察到的或据报的证据，与会改变投资判断的条件分开；产品 范围广不等于交叉销售经济性已得到证明。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: 乐观、中性和悲观决策区间
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的盈利、韧性的信贷账龄批次、已完成的 Prosus 轮融资，以及可信的 IPO 执行
        - 只有在有书面回报桥接分析时，报告中的 $1.3B 估值或小幅溢价才值得纳入投资判断
        - 尚未有证据支持
        - IPO 延迟或无法维持盈利
      - - 中性
        - 产品范围保持不变，但盈利、条款和分部经济性仍未解决
        - 要求相对于报告中的 $1.3B 估值有实质折价，并附带投资者保护条款
        - 最符合当前公开证据
        - 亏损扩大或融资条款造成重大摊薄
      - - 悲观
        - 限制措施重启、资产质量走弱，或债务 / 股权融资受限
        - 在资本重组和运营修复得到验证前，即使低于报告估值也应回避
        - 有可能但未量化
        - 新的监管行动、核销增加或契约压力
    notes: 这些是受证据约束的决策区间，不是按概率加权的公允价值估计；精确区间和 目标回报需要私人融资和运营数据。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
