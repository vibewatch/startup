      - number: '3.2'
        title: 放贷和 UPI 规模可信，但领先地位仍取决于垂直领域
        blocks:
          - type: paragraph
            body: >-
              Navi 在两个重要分发引擎上已有可观规模证据。Navi Finserv 报告 FY2026 AUM 为 13,138 crore；独立报道则称，2026 年 7 月 Navi 应用在 UPI 排名第四，位于
              PhonePe、Google Pay 和 Paytm 之后，当月交易量超过 9.47 亿笔。这些事实支持其成为有分量的挑战者，但不能证明其品类领先。同一应用覆盖
              UPI、现金贷和抵押贷款、共同基金及健康保险，交叉销售触点多于单一产品应用。然而，指定证据没有披露跨产品活跃用户、附加率、留存率或按同业标准化的资金基础，因此应把广度视为分发潜力，而不是已经验证的锁定型护城河。
