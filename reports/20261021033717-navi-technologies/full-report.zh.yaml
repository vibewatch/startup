      - number: '5.2'
        title: 决策与交付架构
        blocks:
          - type: paragraph
            body: >-
              披露的放贷架构结合了数字数据采集、机器学习信贷决策、自动化工作流、云基础设施和数字化服务。Navi
              工程文章称，替代输入包括征信、地理位置、财务历史和行为数据，模型旨在识别身份、收入、就业、抵押物及“稻草人借款人”异常。FY2026
              子公司报告提供了更新但仍由公司发布的描述，包括数据编排、可扩展云基础设施、AI/ML 风险评估、组合监控、GenAI 语音机器人、Smart eNACH
              授权编排和扩展后的联合放贷技术栈。因此，架构看起来围绕放贷运营实现了纵向整合，但保留的来源没有提供模型准确率、延迟分布、变更失败率或独立系统基准。
            claimRefs:
