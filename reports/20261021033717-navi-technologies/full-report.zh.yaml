  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Navi 的相关市场不是单一金融科技品类，而是包括资产负债表放贷、UPI
              支付、健康保险和共同基金；每项业务的收入池、监管机构和付款方都不同。放贷包括计息的个人贷款、住房贷款和房产抵押贷款，不包括存款，也不应与支付金额相加。保险以毛承保保费为边界，资产管理以管理资产规模和费率收益为边界。现有替代方案包括银行网点、NBFC、代理人、基金分销商和独立专业应用。这个边界很重要：UPI
              的触达可以扩大 Navi 的漏斗，但不能单独证明信贷、保障或投资业务已经变现。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
