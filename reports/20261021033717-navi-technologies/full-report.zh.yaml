        blocks:
          - type: paragraph
            body: >-
              最新融资中最明确的一笔，是报道中的 Prosus 于 August 2026 投资 USD 100 million；不同来源将其称为首轮机构股权融资、IPO 前融资或 C
              轮。公开聚合网站无法对募资总额达成一致：由于对创始人注资、债务和跟踪轮次的计入方式不同，金额从 USD 100 million 到 USD 150 million 不等。另有报道称，July 2025 完成
              INR 170 crore 债务融资。经营层面，第三方资料称 FY26 合并营收为 INR 2,982 crore、会计亏损为 INR 466 crore；该亏损并不等于现金消耗。Navi Finserv
              年报显示 AUM 为 INR 13,138 crore、税后利润为 INR 292 crore，说明集团指标与子公司指标必须分开看待。
