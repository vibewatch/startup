      - number: '6.4'
        title: 持久性是尚未解决的关键客户问题
        blocks:
          - type: paragraph
            body: >-
              指定证据池没有披露产品层面的留存、流失、重复借款、续保、同期组 活跃度、交叉销售或集中度。这一缺口很重要，因为应用活动 标题 可能与低奖励驱动忠诚度、一次性借款、不活跃投资账户或对补贴敏感的 UPI
              使用并存。2024 年 10 月新贷款批准和放款被监管中断、12 月解除，也具体提醒我们，客户连续性取决于合规的信贷运营。投资判断仍应取决于按产品划分的月度
              同期组、续保和重复使用曲线、获客渠道经济性，以及对任何主导合作伙伴、渠道或客户群的暴露。
