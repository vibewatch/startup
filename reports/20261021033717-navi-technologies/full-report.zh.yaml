      - number: '5.4'
        title: 信任、控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Navi Finserv 披露了多层控制，包括多因素认证、端点防护、网络分段、加密、24x7 安全运营监控、CERT-In 认可的漏洞测试、多区域连续性规划和灾难恢复演练。公司还称其治理符合 RBI 指引和
              ISO 27001 标准；这并不等同于每个 Navi 产品当前都拥有独立认证。历史监管证据对技术论点很重要：第三方来源记录了 RBI 于 2024 年 10 月限制放贷，并于 2024 年 12 月解除；Navi
              自己的工程文章则指出，完整还款周期的延迟限制了承保模型学习。因此尽调优先级应是控制有效性：模型验证、定价公平、事件历史、经过测试的恢复结果和集团范围的隐私保障，而不只是文件化控制是否存在。
