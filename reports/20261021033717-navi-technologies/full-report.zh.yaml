        title: 里程碑、监管疤痕与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              Navi 的发展路径从 2018 年创立，经历收购和产品发布，走到 2022 年 IPO 申报、快速放贷增长、2024 年监管中断，以及 2026 年新的机构股权融资。RBI
              对放贷的限制是最重要的不利里程碑：独立报道称，2024 年 10 月禁止新增放贷批准和放款；放贷子公司则称，在调整承保和风险架构后，业务于 2024 年 12
