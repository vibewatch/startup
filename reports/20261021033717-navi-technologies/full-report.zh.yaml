      - number: '3.3'
        title: 公开产品条款透明，相对价值不透明
        blocks:
          - type: paragraph
            body: >-
              Navi 的公开产品包装让自身定位清晰。官网列出最高 20 lakh 印度卢比的现金贷、最高 26% 的利率和最长 84 个月的还款期；房产抵押贷款最高 5 crore、利率最高 22%、期限最长 20
              年、贷款价值比最高 70%。共同基金 100 印度卢比起投；健康险宣传最高 1 crore，月起价为 522
              印度卢比。这些是标价条款，不是实际客户定价、审批率或经济性。指定证据池没有可比的最新同业价格卡，因此无法有把握地宣称 Navi 更便宜。信任同样是竞争变量：2024 年 RBI
              放贷限制及其后解除既说明整改，也留下银行和专业品牌可以利用的监管疤痕。
            claimRefs:
