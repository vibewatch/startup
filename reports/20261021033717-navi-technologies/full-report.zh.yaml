            body: >-
              指定证据中最强的实名用户材料，是 Navi
              自己的共同基金用户评价轮播。它列出个人消费者，描述易用性、组合统一管理、客户支持和长期投资习惯，但样本选择和呈现均由公司控制。审阅过的独立资料讨论的是总体采用情况、产品广度或目标客群，而不是独立记录实名客户结果。这是有用的定性产品证据，但不足以证明代表性、实际财务结果或持续使用。高质量客户资料包应把获得同意的实名用户与使用年限、活跃度、结果定义及可独立核验的记录放在一起。
