            body: >-
              Navi Finserv FY2026 披露对受监管放贷机构而言方向上令人安心：GNPA 1.25%、NNPA 0.16%、拨备覆盖率 87.48%、资本充足率
              23.76%，且减值费用下降。但不能把这些证据泛化到合并后的 Navi Technologies。级别较低的独立报道称，母公司 FY2025 经营收入为 2,565 crore、净亏损为 126
              crore，融资成本和减值挤压了利润；这些数字需要与经审计集团报表核对。放贷机构账面有 11,480 crore 未偿债务、70 多家资金机构和 5
              家活跃联合放贷伙伴，原则上降低了单一来源依赖，但公开证据没有量化交易对手份额、契约余量或滚动续借暴露。因此，在审阅逐家机构明细和压力流动性阶梯前，投资判断应把多元化视为尚未验证。
