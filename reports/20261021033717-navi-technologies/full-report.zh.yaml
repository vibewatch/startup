              Navi 的客户界面覆盖支付用户、无抵押及房产借款人、零售投资者和健康险购买者。官网通过一个应用呈现这些产品，但不同客群的购买需求、风险画像、使用频率和可能的经济价值差异很大：UPI
              是高频互动界面，放贷从获批借款人身上变现，共同基金面向长期储蓄者，保险面向寻求保障的家庭。独立资料还同时描述城市数字放贷用户和历史上的农村小额信贷借款人，但在小额信贷边界变化后，不应假定旧分群仍代表当前集团。因此，尽调应按产品索取活跃、交易和贡献收入的客户数，而不是接受一个混合用户总数。
