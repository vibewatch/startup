chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Navi 于 2018 年在 Bengaluru 由 Sachin Bansal 和 Ankit Agarwal 创立；如今消费者应用由 Navi Limited 持有，原名 Navi Technologies
              Limited。该应用同时提供 UPI 支付、现金贷和住房贷款、健康保险及共同基金，而非只做单一产品放贷。监管责任分布在多个集团实体：Navi Limited 是获 NPCI 批准的 UPI 应用服务商，Navi
              Finserv 是受 RBI 监管的非吸收存款 NBFC，Navi General Insurance 在 IRDAI 注册，共同基金业务使用在 SEBI
              注册的实体。这种广度带来交叉销售潜力，但也意味着不能把集团统一身份与任何单一子公司的经营表现或监管状态混为一谈。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
