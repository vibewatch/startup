            body: >-
              证据显示产品已经在运营，而不是只有路线图的平台，但成熟度的证据并不均衡。2026 年 9 月的一份联合公告称，Navi 与 IndusInd Bank 增加了新的 UPI
              支付交换机，以分散支付技术栈，并分阶段推送 Android 和 iOS
