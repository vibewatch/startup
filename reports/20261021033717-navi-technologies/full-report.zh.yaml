      - - TPAP 支付欺诈调查 / 印度班加罗尔
        - 据报道，2024 年 12 月 10–24 日期间发生据称 Rs 14.26 crore 损失后，警方已立案
        - 已发生；是否复发未知
        - 高
        - 一份较低等级报告称 Navi 启动了内部审查并联系 TPAP
        - 在警方结论、根因、追回金额和独立复测形成记录前为高
        - 审阅投诉、调查状态、保险赔付追回、事故报告和端到端授权测试
      - - 数字贷款、网络安全、隐私和资本规则变化 / 印度、RBI
