      - number: '4.4'
        title: 融资渠道可见，资本充足性不可见
        blocks:
          - type: paragraph
            body: >-
              第三方数据库称，Prosus 主导的 $100 million 融资于 August 2026 完成，估值为 $1.3
              billion。这证明融资渠道存在，不证明报告日可用现金，因为交割、资金用途、现金余额、债务到期和限制条件在指定当前证据中均未披露。2024 年 RBI 对新放贷的中断，以及 12
              月解除限制，也说明收入能力可能受合规结果约束。因此财务判断是混合的：收入增长和清晰可见的放贷引擎是积极因素，但集团亏损扩大，加上流动性、信贷 账龄批次
              和产品利润数据缺失，使利润率持久性、资金续航和下一次资本触发点成为重要尽调阻塞项。
