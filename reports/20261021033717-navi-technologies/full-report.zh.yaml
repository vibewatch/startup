      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Navi 历史上面向年轻、数字化程度高的中产消费者，但各产品的预算承担者不同：借款人承担利息和还款义务，家庭支付保险费，投资者配置储蓄，商户或生态参与者可能承担支付经济性。FY2026 报告中，Navi 将
              UPI 描述为获客渠道，将其他产品描述为变现层。2026 年 7 月消费者 UPI 份额达到 4%；据报道，共同基金 AUM 约为 ₹9,000 crore，毛保险保费约为 ₹200
              crore。这些信号说明多条业务线都有活动，但没有披露同期组层面的转化、留存或附加率。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              智能手机分发、无纸化开户、较低投资门槛和多产品可用性降低了准入摩擦。核心约束在于，获客和受监管资产负债表能力必须转化为持久利润率。Navi Finserv FY2026 经营收入增长 17%，但合并税后利润下降
              46%；集团层面，随着 UPI 和多元化投入增加，Navi Technologies 净亏损扩大至 ₹466 crore。监管也可能中断供给：RBI 于 2024 年 10 月停止 Navi Finserv
              发放新贷款，12 月才解除限制。因此，只有当 Navi 能持续合规承保、以经济可行的方式获得信贷资金，并证明获客后能交叉销售，市场增长才具有估值价值。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: UPI 是漏斗，不是盈利池
            body: 管理层披露的模式是用高频支付活动获取用户，再由放贷、保险和投资实现变现。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: 增长不能消除受监管资产负债表风险
            body: 2024 年放贷限制和 FY2026 利润压缩表明，分发规模必须与合规定价、信贷纪律和可负担的资金成本配套。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 多场竞争，而非单一竞争集
        blocks:
          - type: paragraph
            body: >-
              Navi 并不存在一个整齐划一的可比组。公司自己的申报文件把竞争范围定义得很广，包括银行、NBFC、住房金融公司、保险公司、资产管理机构、小型金融银行、小额信贷机构及其他金融机构。从消费者应用看，报道和二手分析将
              PhonePe、Google Pay、Paytm、CRED、Groww、PolicyBazaar 和 Zerodha
              列为重叠的专业玩家。指定证据还保留了两类非供应商替代方案：正规金融体系之外消费者使用的非正式信贷，以及由 India Stack 支持的内部或合作伙伴自建系统。实际含义是，Navi
              的广度不寻常，但每个垂直领域都要对标专注型龙头或资金更充足的在位者，而不是另一家完全相同的全栈公司。
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP015
