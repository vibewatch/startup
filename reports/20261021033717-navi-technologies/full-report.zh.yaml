        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              最完整的规模证据来自 March 2022 的 DRHP，其中包含公司委托 RedSeer 制作的估算。该文件预测 FY2026 印度零售贷款 AUM 为 US$1.15-1.25
              trillion、健康保险毛承保保费为 US$17.6 billion、共同基金 AUM 为 US$1.0 trillion。另一组更窄的预测称，个人贷款、住房贷款和房产抵押贷款的数字化放款额为 US$107
              billion，个人贷款发放额为 US$164 billion。这些指标混合了存量和年度流量，不能相加。它们说明可触达市场很大，但预测期已过，且方法由公司委托，因而无法据此估算当前 SOM。
