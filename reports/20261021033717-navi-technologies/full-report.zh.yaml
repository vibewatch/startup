      - number: '4.3'
        title: 公开定价可见，实际经济性不可见
        blocks:
          - type: paragraph
            body: >-
              Navi 官网列出最高 ₹20 lakh、利率最高 26% 的现金贷，最高 ₹5 crore、利率最高 22% 的房产抵押贷款，以及 ₹100
              起投的共同基金。这些是标价条款和准入门槛，不是实际收益率、收入或利润率。指定证据中最新的详细申报仍是历史资料：截至 2021 年 12 月的九个月，广告、营销和宣传费用为 ₹3,055.71
              million，融资成本为 ₹1,371.05 million，金融工具减值为 ₹1,042.74 million。这一组合说明获客投入、资金成本和信用损失是重要经济杠杆，但不能替代 FY26
              产品层面的贡献利润率。
