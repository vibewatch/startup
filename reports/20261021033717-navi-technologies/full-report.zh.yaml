      - number: '4.2'
        title: UPI 是获客层，放贷仍是变现引擎
        blocks:
          - type: paragraph
            body: >-
              Navi 主要用 UPI 获取并激活消费者，把放贷、保险和投资定位为变现层。其消费者 UPI 份额据报道 7 月达到
              4%；管理层称，新增获客和留存成本正在下降，来自账单支付、充值、礼品卡、广告及相关服务的活跃用户收入环比上升。这些方向性表述支持战略逻辑，但没有披露 CAC、回本期、同期组
              留存、转化率或贡献利润。历史申报文件显示的是交叉销售潜力，而非当前单位经济性：截至 2021 年 12 月的九个月中，71.69% 的住房贷款客户和 52.67% 的零售健康险客户来自对个人贷款感兴趣的用户群。
            claimRefs:
