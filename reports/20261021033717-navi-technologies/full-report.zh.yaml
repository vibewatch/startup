      items:
        - label: 零售贷款 AUM
          value: US$1.15-1.25T
          detail: FY2026 预计存量；较 FY2021 的 CAGR 为 18-20%
        - label: 共同基金 AUM
          value: US$1.0T
          detail: FY2026 预计存量；较 FY2021 的 CAGR 为 17%
        - label: 个人贷款发放额
          value: US$164B
          detail: FY2026 预计年度流量；CAGR 为 27%
        - label: 数字贷款发放额
          value: US$107B
          detail: FY2026 预计年度流量，覆盖个人、住房和房产抵押贷款
        - label: 非寿险 GWP
          value: US$51B
          detail: FY2026 预计年度保费池
        - label: 健康保险 GWP
          value: US$17.6B
          detail: FY2026 预计年度保费池，也是非寿险的一部分
    approximationNotes: 未添加、换算任何数值，也未将其视为连续漏斗阶段；这些都是 2022 年 3 月对 FY2026 的预测 但分母各不相同。
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM016
  - id: FP001
    title: 按产品范围和数字即时性划分的竞争定位
    type: quadrant
    summary: 序数 x 轴分数代表所覆盖金融需求的广度，序数 y 轴分数代表数字即时性， 两者均采用方向性的 1-5 量表。
    data:
      points:
        - label: Navi
          x: 5
          'y': 5
          detail: 应用组合广泛，具备数字支付和借贷规模。
        - label: UPI 领先者
          x: 1
          'y': 5
          detail: 指定证据中的高即时性支付专家。
        - label: 银行 / NBFC / HFC
          x: 4
          'y': 3
          detail: 融资能力广泛；数字化协同性各异且未经验证。
        - label: 投资领域专家
          x: 2
          'y': 4
          detail: 专注于数字财富管理流程，而非 Navi 的完整产品广度。
        - label: 非正式现状
          x: 1
          'y': 1
          detail: 本地渠道可以替代有组织的信贷，不需要广泛的 App 产品。
        - label: 内部 / 合作伙伴搭建
          x: 3
          'y': 3
          detail: 开放基础设施支持组装，但表现未经验证。
    approximationNotes: 分析师序数分数，不是经过测量的市场基准。分数依据所引产品覆盖、数字交付和 在位者优势证据；不量化市场份额、客户偏好或财务实力。
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP012
      - CP014
      - CP015
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: UPI 活动旨在带来直接附加收入，并向借贷、保险和投资交叉销售， 融资、信贷损失、营销和运营成本共同决定合并利润。
    data:
      nodes:
        - id: consumer-activity
          label: 消费者 UPI 活动
          detail: 据报 7 月消费者 UPI 交易占比为 4%
        - id: payment-revenue
          label: 支付侧变现
          detail: 账单支付、充值、礼品卡、广告和其他服务；已实现收入未披露
        - id: lending
          label: 借贷交叉销售
          detail: 无担保贷款仍是主要盈利贡献来源
        - id: insurance
          label: 保险交叉销售
          detail: FY26 毛保费约为 ₹200 crore；承保利润率未披露
        - id: investments
          label: 投资交叉销售
          detail: 共同基金 AUM 约为 ₹9,000 crore；费用实现额未披露
        - id: gross-economics
          label: 产品毛经济性
          detail: 利息和费用、支付收入、保险经济性以及 AUM 费用
        - id: cost-base
          label: 成本与损失基础
          detail: 获客、留存、融资、信贷减值、claims（理赔）和运营
        - id: group-result
          label: 合并结果
          detail: FY26 净亏损 ₹466 crore；管理层报告称 3 月季度运营层面实现盈亏平衡
      edges:
        - from: consumer-activity
          to: payment-revenue
          label: 直接附加变现
        - from: consumer-activity
          to: lending
          label: 交叉销售
        - from: consumer-activity
          to: insurance
          label: 交叉销售
        - from: consumer-activity
          to: investments
          label: 交叉销售
        - from: payment-revenue
          to: gross-economics
        - from: lending
          to: gross-economics
        - from: insurance
          to: gross-economics
        - from: investments
          to: gross-economics
        - from: gross-economics
          to: group-result
        - from: cost-base
          to: group-result
          label: 扣除项与损失
    approximationNotes: 该流程展示管理层报告的运作机制，而非按价值比例呈现的经济性；产品转化、收入 占比、毛利率和 CAC / 回本期未披露。
    claimRefs:
      - CI005
      - CI006
      - CI008
      - CI009
      - CI010
  - id: FE001
    title: 从消费者界面到受监管通道的产品交付栈
    type: stack
    summary: 基于来源边界梳理已披露层级：这些层级将 App 交互转化为借贷和支付运营，同时让 外部依赖保持可见。
    data:
      layers:
        - label: 消费者体验
          items:
            - Navi 移动 App
            - UPI、借贷、共同基金和健康保险界面
          detail: 数字入口；跨产品转化和统一身份设计未披露
        - label: 产品流程
          items:
            - 无纸化借贷申请
            - 数字化服务与还款
          detail: 公司描述的个人贷款和有担保贷款客户旅程。
        - label: 身份与同意
          items:
            - VKYC
            - 访问控制和同意管理
          detail: Navi Finserv 描述的受监管开户和数据使用边界。
        - label: 决策与监控
          items:
            - 数据编排
            - AI 和机器学习信贷模型
            - 组合监控
          detail: 模型表现、偏差测试和漂移阈值未公开。
        - label: 服务与催收
          items:
            - AI 聊天和语音机器人
            - Smart eNACH 授权编排
          detail: 自动化结果为自述，未提供客户伤害或回款率分母。
        - label: 平台基础设施
          items:
            - 云基础设施
            - 领域驱动微服务
            - CI/CD 和韧性实践
          detail: 公司架构披露没有经审计的可用性指标配套。
        - label: 外部受监管通道
          items:
            - IndusInd 支持的 UPI 支付交换机
            - 联合放贷机构
          detail: 支付交换机已宣布分阶段在 Android 和 iOS 上推出。
    approximationNotes: 概念性排序综合已披露组件，不主张未披露的服务边界、数据 流向或完整生产拓扑。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE014
  - id: FU001
    title: 消费者采用界面与预期扩张回路
    type: journey-map
    summary: 该 App 可以通过支付吸引高频使用客户，再将其导向价值更高的金融产品， 但指定证据没有量化转化或留存。
    data:
      nodes:
        - id: discover
          label: 发现 Navi App
          detail: 零售消费者接触到的是多产品金融 App，而非单一用途的借贷界面。
          touchpoints:
            - App
            - Referral
        - id: pay
          label: 使用 UPI 支付
          detail: 即时转账和支付奖励提供高频互动场景。
          touchpoints:
            - UPI transfer
            - Merchant payment
        - id: reward
          label: 获得 Navi Coins
          detail: 刮刮卡奖励旨在强化重复交易，但拆解分析指出用户感知的 奖励价值可能令人失望。
          touchpoints:
            - Scratch card
            - Coin balance
        - id: borrow
          label: 考虑信贷
          detail: 该 App 将现金贷款和房产抵押贷款呈现为相邻需求。
          touchpoints:
            - Cash loan
            - Loan against property
        - id: invest
          label: 开始投资
          detail: 公司称共同基金起投金额为 ₹100。
          touchpoints:
            - Mutual fund
            - Portfolio dashboard
        - id: protect
          label: 增加保障
          detail: 健康保险将关系延伸至家庭保障。
          touchpoints:
            - Health cover
            - Claims support
    approximationNotes: 这是定性的产品旅程，不是经过测量的漏斗。指定证据中没有转化、流程频率或交叉销售 率数据。
    claimRefs:
      - CU002
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性热力图将观察到的事件与公司报告的缓解措施分开；评级不是概率 ，且仍受所列尽调缺口约束。
    data:
      columns:
        - label: 可能性
          detail: 分析师根据观察到的复发信号和风险敞口作出的序数评估。
        - label: 影响
          detail: 对运营、资本、客户或投资论点的潜在影响。
        - label: 缓解证据
          detail: 公开证据对控制措施正在运行的支持强度。
        - label: 剩余严重程度
          detail: 仅计入已披露缓解措施后的风险。
      rows:
        - label: 监管定价
          note: 此前 RBI 干预使复发成为可监测风险，而非假设情景。
          values:
            - label: 中
              note: 据报完成整改后限制已解除。
            - label: 关键
              note: 重新实施制裁可能会停止新增贷款业务。
            - label: 部分
              note: 重新开放和模型变更均为公司报告。
            - label: 高
              note: 当前监管结案证据未公开。
        - label: TPAP 支付完整性
          note: 一份警方投诉称，金额不匹配已造成实际损失。
          values:
            - label: 中
              note: 一宗已报告事件；复发数据不可得。
            - label: 高
              note: 直接财务损失和客户信任后果。
            - label: 弱
              note: 据报已完成内部审查；独立复测不可得。
            - label: 高
              note: 交易层面的闭环仍未经验证。
        - label: 无担保信贷
          note: 改善后的时点指标需要账龄验证。
          values:
            - label: 中
              note: 消费信贷表现具有周期性。
            - label: 高
              note: 损失影响盈利、资本和融资信心。
            - label: 中等
              note: FY2026 资产质量和拨备有所改善。
            - label: 中
              note: 没有独立的整改后群组数据。
        - label: 融资流动性
          note: 关系数量无法揭示到期结构或交易对手集中度。
          values:
            - label: 中
              note: 多种工具分散融资渠道。
            - label: 高
              note: 新增发放依赖持续融资。
            - label: 中等
              note: 据报有 70 多家机构和多种融资工具。
            - label: 中
              note: 主要提供方占比和压力梯度不可得。
        - label: IT 控制复杂度
          note: 审计师用语指出，自动化程度和系统规模带来固有风险。
          values:
            - label: 中
              note: 复杂的自动化环境会持续带来控制风险。
            - label: 高
              note: 可能影响财务报告和运营。
            - label: 中等
              note: 公司描述了 ITGC、SIEM、EDR、VAPT 和业务连续性控制。
            - label: 中高
              note: 控制测试结果未公开披露。
        - label: 集团盈利能力
          note: 独立来源对 FY2025 的报道需要与经审计的集团账目核对。
          values:
            - label: 中高
              note: 报道中的成本和减值损失压低了盈利。
            - label: 高
              note: 亏损可能压缩融资能力和战略灵活性。
            - label: 弱
              note: 指定证据中没有公开的集团层面利润率桥接分析。
            - label: 高
              note: 放款方的改善不能推广到母公司。
    approximationNotes: 截至 2026-10-21，序数标签综合了引用的公开证据；它们不是经过测量的概率， 公司提出的缓解措施也未经独立验证。
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR008
      - CR010
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策从已展现的产品广度出发，经过融资和财务质量测试，最终得到有条件的推进结论。
    data:
      nodes:
        - id: product-scale
          label: 产品广度
          detail: UPI、贷款、共同基金和保险都是活跃产品。
        - id: institutional-signal
          label: 机构信号
          detail: 据报道，August 2026 的一笔 $100M 投资对应 $1.3B 估值。
        - id: earnings-test
          label: 盈利质量测试
          detail: 报道中的 FY26 收入和亏损需要经审计核对。
        - id: risk-test
          label: 监管与信贷测试
          detail: 过往限制和报道中的核销损失，需要整改后的历史批次证据。
        - id: valuation-test
          label: 条款与可比公司测试
          detail: 已签署条款、优先股堆叠、股权结构表和有说服力的估值倍数均不可得。
        - id: decision
          label: 推进 / 继续研究
          detail: 只有补齐缺失证据后，才能为这项机会定价。
    approximationNotes: 仅表示有序逻辑；节点顺序不代表概率、规模或转化率。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV009
      - CV011
      - CV014
