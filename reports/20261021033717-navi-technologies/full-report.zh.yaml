              年报称，业务当月恢复，重启初期用于完善承保、风险架构和机器学习模型。这些是具体的缓释信号，但来自公司披露，未说明当前监管发现。因此我们将复发评为高影响、中等可能性：再次受罚会直接限制贷款发放，而干净的最新 RBI
              往来和定价审计将显著降低剩余风险。
