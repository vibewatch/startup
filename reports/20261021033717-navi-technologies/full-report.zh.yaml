      - number: '3.4'
        title: 护城河取决于受监管资产负债表上的执行
        blocks:
          - type: paragraph
            body: >-
              Navi 的一体化应用和自有受监管业务带来运营控制，但其持久性受到结构性经济性的约束。IPO
              申报文件称，大型竞争者可能拥有更低的资金成本、更广的触达、更强的合作关系和更多融资产品。文件还将保险竞争描述为品牌、承保、定价、分发、服务、资本和技术的综合较量；而低进入壁垒和费率压力可能使资产管理商品化。独立二手数据进一步暗示，放贷利息占
              FY2025 收入的 85%，说明产品广度在经济上并不像界面呈现的那么多元。因而，最可辩护的判断是有条件的：UPI
              可以降低互动摩擦，应用可以展示多个产品，但持久优势仍需要更好的资金来源、可衡量的交叉销售、合规承保和服务质量。在这些指标披露前，多头使用和专业玩家替代仍是重大风险，而非遥远情景。
