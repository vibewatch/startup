      - number: '7.4'
        title: 监控应聚焦复发、账龄批次、流动性与控制证据
        blocks:
          - type: paragraph
            body: >-
              投资后，四项指标应主导风险决策。第一，监控 RBI 观察意见、实际贷款定价、投诉趋势，以及任何对批准或放款的限制；监管行动重启将打破运营论点。第二，要求月度信贷 账龄批次、30 天以上和 90
              天以上逾期曲线、核销和催收效率，因为时点 GNPA 和公司描述的模型改进无法证明持久性。第三，在最大资金方和联合放贷交易对手退出的情景下测试 12 个月流动性，而不是只看合作关系数量。第四，取得独立证据，证明
              2024 年网关缺陷已在所有支付路径上闭环。任何重复交易完整性故障、拨备覆盖率或资本余量明显恶化，或未披露的交易对手集中度，都会把案例从可监控的高风险推向论点破坏。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR013
              - CR016
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 首要止损标准
            body: 任何对贷款批准或放款的 RBI 限制再次出现，或支付伙伴造成另一笔交易完整性损失，都会打破“2024 年整改具有持久性”的投资论点。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
          - type: callout
            title: 不要把放贷机构指标外推到集团
            body: Navi Finserv FY2026 的资产质量和资本披露属于子公司指标，不能证明合并后的 Navi Technologies 盈利能力、现金生成或产品层面风险。
            calloutType: assumption
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持跟踪/继续研究的建议、偏低的中等置信度和高风险评级，而不是立即投资。Navi 覆盖 UPI、放贷、共同基金和保险，业务确实够广；当前官网也显示它有一套正在运营的产品，而非单一产品概念。但据报道，2026
              年 8 月 Prosus 以约 13 亿美元估值投资 1 亿美元，这仍是二手报道，且交易受交割条件和监管批准约束。因此该估值只能作为参考点，而非已验证价格。投资前应要求已签署融资文件、经审计的合并及分部业绩、信贷
              账龄批次 证据和下行保护，之后才能评估回报。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV009
              - CV011
              - CV014
      - number: '8.2'
        title: 正论、反论与证据质量
        blocks:
          - type: paragraph
            body: >-
              核心论点是，Navi 可以用广泛的消费金融产品组合创造多条变现路径，外部机构投资者也可能改善融资和 IPO 准备度。反论点比普通执行风险更强：已报道的 FY26
              亏损、此前监管干预、直接的资产负债表信贷暴露，以及相较于 2024 年报道的估值目标似乎出现下调，都在挑战溢价定价。公开财务摘要还存在重大冲突，包括同一汇编中的两组 FY25
              收入数字，以及另一份资料中明显更低的收入数字。这些差异使来源质量本身成为估值风险的一部分，也阻碍可靠的收入倍数或盈利正常化。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: 融资背景与可比性限制
        blocks:
          - type: paragraph
            body: >-
              最强的当前融资信号是约 $1.3 billion 估值下的 $100 million 融资；有用的历史流动性参考是 Navi 2022 年申报文件中约 INR 33.5 billion、即 $440
              million 的
              IPO。两者都不是可比公司估值：前者是据报道的私募交易，后者是发行规模。指定证据没有提供可辩护的上市公司倍数、私募轮次条款或相关并购估值倍数，也没有核对股权融资、创始人资本、债务融资和可用现金。因此，公开证据无法确定稀释、清算优先权悬置、所有权，或据报道的交易价格是否能带来有吸引力的目标回报。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
      - number: '8.4'
        title: 情景、退出准备度与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              情景区间围绕据报道的 $1.3 billion 估值表达为决策带，而不是捏造点估值。只有在经审计盈利、稳健的信贷账龄批次和可信的 IPO
              执行得到证明后，乐观情景才支持该估值或小幅溢价。中性情景要求相对该估值打折，因为亏损、融资结构和分部经济性仍未解决。无论表面折价多少，只要监管限制复发、信贷损失恶化或融资渠道转弱，悲观情景都应回避。最终尽调应取得已签署轮次文件、完全稀释股权结构表和优先股堆叠、经审计
              FY26 报表、分部利润率、借款到期日、逾期和核销 账龄批次，以及带监管状态的 IPO 时间表。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 决策铰链
            body: 只有已签署融资条款和经审计经营证据把据报道的 13 亿美元估值转化为可承销的所有权和回报案例后，投资判断才会改善。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV013
          - type: callout
            title: 不要把融资与流动性混为一谈
            body: 公开资料把股权、创始人资本和债务混在宽泛的募资总额中；其中没有任何一项能证明可用现金、稀释或清算优先权。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
