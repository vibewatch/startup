figures:
  - id: FP001
    title: "Competitive positioning by product breadth and digital immediacy"
    type: quadrant
    summary: >-
      Ordinal x scores represent breadth of financial needs served and ordinal y
      scores represent digital immediacy, each on a directional 1-5 scale.
    data:
      points:
        - label: "Navi"
          x: 5
          y: 5
          detail: "Broad app portfolio with digital payments and lending scale."
        - label: "UPI leaders"
          x: 1
          y: 5
          detail: "High-immediacy payment specialists in the assigned evidence."
        - label: "Banks / NBFCs / HFCs"
          x: 4
          y: 3
          detail: "Broad financing capacity; digital cohesion varies and is unverified."
        - label: "Investment specialists"
          x: 2
          y: 4
          detail: "Focused digital wealth workflows rather than full Navi breadth."
        - label: "Informal status quo"
          x: 1
          y: 1
          detail: "Local access can substitute for organised credit without app breadth."
        - label: "Internal / partner build"
          x: 3
          y: 3
          detail: "Open infrastructure enables assembly, but performance is unverified."
    approximationNotes: >-
      Analyst ordinal scores, not measured market benchmarks. Scores use cited
      product coverage, digital delivery, and incumbent-advantage evidence; they do
      not quantify market share, customer preference, or financial strength.
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP012
      - CP014
      - CP015
callouts:
  - calloutType: insight
    title: "Breadth creates option value, not proven lock-in"
    body: >-
      Navi can expose a payments user to lending, insurance, and investments in one
      app, but the assigned evidence does not quantify cross-sell, retention, or
      multi-product cohorts.
    claimRefs:
      - CP005
      - CP016
  - calloutType: risk
    title: "Incumbent economics can neutralise app speed"
    body: >-
      Larger competitors may pair lower funding costs, wider distribution, and
      stronger brands with similar digital journeys, pressuring both lending margins
      and fee-based products.
    claimRefs:
      - CP012
      - CP013
