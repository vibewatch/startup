callouts:
  - calloutType: insight
    title: UPI is a funnel, not the earnings pool
    body: "Management's reported model uses frequent payment activity to acquire users, while lending, insurance and investments are intended to monetize them."
    claimRefs: [CM007, CM008]
  - calloutType: risk
    title: Growth does not remove regulated-balance-sheet risk
    body: "The 2024 lending restriction and FY2026 profit compression show that distribution scale must be paired with compliant pricing, credit discipline and affordable funding."
    claimRefs: [CM013, CM014, CM015, CM016]
