    title: Recommendation logic
    type: flow
    summary: "The decision moves from demonstrated product breadth through financing and financial-quality tests to a conditional track outcome."
    data:
      nodes:
        - id: product-scale
          label: Product breadth
          detail: "UPI, lending, mutual funds, and insurance are active offerings."
        - id: institutional-signal
          label: Institutional signal
          detail: "A $100M investment at a reported $1.3B mark was reported in August 2026."
        - id: earnings-test
          label: Earnings quality test
          detail: "Reported FY26 revenue and loss require audited reconciliation."
        - id: risk-test
          label: Regulatory and credit test
          detail: "Prior restrictions and reported write-offs require post-remediation vintage evidence."
        - id: valuation-test
          label: Terms and comparables test
          detail: "Signed terms, preferences, cap table, and defensible multiples are unavailable."
        - id: decision
          label: Track / research more
          detail: "Price the opportunity only after the missing evidence closes."
    approximationNotes: "Ordered logic only; node order does not represent probability, magnitude, or a conversion rate."
    claimRefs: [CV002, CV004, CV007, CV009, CV011, CV014]
callouts:
  - calloutType: recommendation
    title: Decision hinge
    body: >-
      The call can improve only when signed financing terms and audited operating evidence
      convert the reported $1.3 billion mark into an underwritable ownership and return case.
    claimRefs: [CV003, CV005, CV013]
  - calloutType: risk
    title: Do not confuse funding with liquidity
    body: >-
      Public profiles mix equity, founder capital, and debt under broad funding totals; none
      establishes cash available, dilution, or liquidation preferences.
    claimRefs: [CV007, CV008]
