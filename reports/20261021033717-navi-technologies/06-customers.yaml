    claimRefs: ["CU002", "CU011", "CU012", "CU013"]
callouts:
  - calloutType: "risk"
    title: "Do not equate activity with durability"
    body: "The pool contains no product-level NRR, GRR, churn, renewal, repeat-borrowing, cohort-retention, attach-rate, or concentration disclosure. The 2024 lending restriction also shows that regulatory operations can interrupt customer acquisition even when demand exists."
    claimRefs: ["CU015", "CU016"]
