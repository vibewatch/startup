company:
  name: "Navi Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: "Navi addresses multiple Indian retail-finance segments through one consumer app, with the clearest dated adoption signals in mutual funds and UPI. The public record remains weak on retention, cohort durability, customer concentration, and independently verified outcomes, so reported scale should not be read as proof of durable economics."
sections:
  - id: "customer-segments"
    title: "A broad retail funnel, not one homogeneous customer base"
    body: >-
      Navi's customer surface spans payments users, unsecured and property borrowers,
      retail investors, and health-insurance buyers. The official site presents those
      products through one app, but the buyer need, risk profile, cadence, and likely
      economic value differ materially by segment: UPI is a frequent engagement surface,
      lending monetizes approved borrowers, mutual funds target long-duration savers, and
      insurance targets households seeking protection. Independent profiles also describe
      both urban digital-lending users and historically rural microfinance borrowers, but
      that older segmentation should not be assumed to describe the current group after
      changes in the microfinance perimeter. Diligence should therefore request active,
      transacting, and revenue-contributing customers by product rather than accept one
      blended user total.
    claimRefs: ["CU001", "CU004", "CU005", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-trajectory"
    title: "Dated signals show reach, but the measures are not a cohort"
    body: >-
      The available trajectory is assembled from unlike measures and must not be converted
      into a funnel. StartupTalky reported 36 lakh satisfied customers, more than 105,000
      health policies, and one million mutual-fund investors, while a later third-party
      product teardown listed 20 million monthly active users and 243 million UPI
      transactions for January 2025. These figures use different populations, periods, and
      source methods; none supplies a common denominator or reconciliation to paying
      customers. The product teardown also describes UPI rewards as an acquisition and
      engagement mechanism, while another profile attributes customer growth to referrals
      rather than mass marketing. Together they indicate broad reach and cross-product
      intent, not verified conversion, retention, or revenue quality.
    claimRefs: ["CU002", "CU006", "CU007", "CU008", "CU009", "CU010", "CU011", "CU012", "CU013"]
    tableRefs: ["TU002"]
    figureRefs: ["FU001"]
  - id: "named-proof"
    title: "Named proof is consumer testimony, not independent deployment evidence"
    body: >-
      The strongest named-user material in the assigned evidence is Navi's own mutual-fund
      testimonial carousel. It names individual consumers and describes ease of use,
      consolidated portfolio management, customer support, and a long-running investment
      habit, but the company controls selection and presentation. The reviewed independent
      profiles discuss aggregate adoption, product breadth, or target segments rather than
      independently documenting named customer outcomes. This is useful qualitative
      product evidence but weak proof of representativeness, realized financial outcomes,
      or continued use. A reference-quality customer pack should pair consented named users
      with tenure, activity, outcome definitions, and an independently checkable record.
    claimRefs: ["CU003", "CU016"]
    tableRefs: ["TU003"]
  - id: "durability-and-concentration"
    title: "Durability is the decisive unresolved customer question"
    body: >-
      Public evidence in the assigned pool does not disclose product-level retention,
      churn, repeat borrowing, renewal, cohort activity, cross-sell, or concentration.
      That absence matters because headline app activity can coexist with low reward-driven
      loyalty, one-time borrowing, inactive investment accounts, or subsidy-sensitive UPI
      use. The October 2024 regulatory interruption to new loan sanctions and disbursals,
      followed by a December lifting, is also a concrete reminder that customer continuity
      depends on compliant credit operations. Investment judgment should remain conditional
      on monthly cohorts by product, renewal and repeat-use curves, acquisition-channel
      economics, and exposure to any dominant partner, channel, or customer group.
    claimRefs: ["CU015", "CU016"]
