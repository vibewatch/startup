      - [Cash and personal loans, "Consumers seeking unsecured credit", "Operating; paperless digital journey and limits up to INR 20 lakh advertised", "Automated underwriting and digital origination through the app", "No approval-time distribution, model accuracy, or current cohort loss curve"]
      - [Home loans, "Home buyers seeking secured credit", "Operating; digital application and loan amounts up to INR 10 crore described by Navi Finserv", "Digital onboarding applied to a longer-tenure secured product", "No geography coverage, turnaround distribution, or completion-rate disclosure"]
      - [Loan against property, "Property owners seeking secured liquidity", "Operating; homepage advertises amounts up to INR 5 crore", "Extends the app-led lending surface into collateral-backed credit", "No collateral workflow, valuation-vendor, or realized pricing evidence"]
      - [Mutual funds, "Retail investors", "Operating product linked from Navi's current homepage", "Investment access inside the same branded consumer surface", "No retained technical documentation, assets by app cohort, or attach-rate evidence"]
      - [Health insurance, "Individuals and families seeking health cover", "Operating product linked from Navi's current homepage", "Insurance access inside the same branded consumer surface", "No retained claims-system architecture, service-level, or conversion evidence"]
    notes: >-
      Product status and limits are company or partner disclosures current to the cited pages;
      they do not establish realized customer outcomes, shared infrastructure, or audited uptime.
    claimRefs: [CE001, CE002, CE003, CE007, CE008]
  - id: TE002
    title: Customer workflow and evidence boundary
    columns:
      - User job
      - Publicly described workflow
      - Navi solution surface
      - Measurable benefit claimed
      - Limitation
    rows:
      - [Make a payment, "Initiate a UPI transfer in the Navi app", "UPI product with an additional IndusInd-supported payment switch", "Partner says the switch is intended to improve resilience and scalability", "No independently measured success rate, latency, or downtime"]
      - [Obtain unsecured credit, "Apply, complete verification, receive a decision, and manage repayment digitally", "Cash/personal-loan journey in the Navi app", "Company describes paperless processing and rapid offers for eligible users", "No approval distribution, decline reason analysis, or fairness benchmark"]
      - [Finance a home or property, "Apply and verify digitally for a secured facility", "Home loan and loan-against-property products", "Company describes faster approvals and digitally enabled servicing", "Collateral operations and end-to-end completion times are not disclosed"]
      - [Invest or insure, "Select a mutual-fund or health-insurance product from the app surface", "Mutual-fund and health-insurance modules", "Company emphasizes one accessible digital destination", "No retained evidence of cross-product conversion, retention, or shared data controls"]
      - [Resolve delinquency, "Receive digital reminders or automated contact across repayment cycles", "AI chat and voice bots plus Smart eNACH orchestration", "Company reports improved collection efficiency", "No bot containment, complaint, cure-rate, or consumer-harm denominator"]
    notes: >-
      Benefits are reported as company or partner claims; unavailable outcome denominators are
      shown as diligence limitations rather than estimated.
    claimRefs: [CE001, CE002, CE003, CE006, CE007, CE011]
  - id: TE003
    title: Technology and operating architecture risk register
    columns:
      - Layer or component
      - Disclosed role
      - Key dependency
      - Evidence status
      - Technical or operating risk
    rows:
      - [Consumer app, "Unified access to payments, lending, investment, and insurance surfaces", "Mobile operating systems and product-specific regulated entities", "Current company surface; breadth independently described", "Shared identity, entitlement, and data-boundary design is undisclosed"]
      - [Digital onboarding and VKYC, "Paperless identity and verification for lending", "Identity data, device connectivity, consent, and regulatory rules", "Company filing disclosure", "Completion, false-reject, fraud, and fallback performance are unavailable"]
      - [Credit decisioning, "Risk assessment, pricing support, and portfolio monitoring", "Bureau and alternate data plus labeled repayment outcomes", "Company disclosure with low-tier third-party corroboration", "Learning lag, drift, bias, explainability, and pricing-fairness controls require testing"]
      - [Cloud and microservices, "Scalable transaction and servicing platform", "Cloud regions, deployment tooling, observability, and service ownership", "Company engineering and annual-report disclosure", "No audited availability, dependency map, or change-failure metrics"]
      - [Payments switch, "Route UPI transactions and diversify the payments stack", "IndusInd Bank and wider UPI participants", "Current joint partner announcement", "Phased rollout lacks public SLA, capacity, and failover test results"]
      - [Collections automation, "Digital engagement and mandate orchestration across repayment cycles", "Messaging, voice, eNACH, analytics, and human escalation", "Company annual-report disclosure", "Consumer-treatment outcomes and bot escalation quality are not quantified"]
      - [Security and continuity, "Protect data and sustain operations", "SOC, endpoints, networks, encryption, auditors, and recovery regions", "Company annual-report disclosure only", "Certification scope, incident history, RTO/RPO achievement, and control exceptions are unavailable"]
    notes: >-
      Architecture is reconstructed only from retained public disclosures; dependencies and risks
      are analytical classifications, not a representation supplied or independently audited by Navi.
    claimRefs: [CE004, CE005, CE006, CE009, CE013, CE014]
figures:
  - id: FE001
    title: Product delivery stack from consumer surface to regulated rails
    type: stack
    summary: >-
      A source-bounded view of the disclosed layers that turn app interactions into lending and
      payment operations, with external dependencies kept visible.
    data:
      layers:
        - label: Consumer experience
          items:
            - Navi mobile app
            - UPI, lending, mutual-fund, and health-insurance surfaces
          detail: "Digital entry point; cross-product conversion and shared identity design are not disclosed."
        - label: Product workflows
          items:
            - Paperless lending application
            - Digital servicing and repayment
          detail: "Company-described customer journeys for personal and secured lending."
        - label: Identity and consent
          items:
            - VKYC
            - Access controls and consent management
          detail: "Regulated onboarding and data-use boundary described by Navi Finserv."
        - label: Decisioning and monitoring
          items:
            - Data orchestration
            - AI and machine-learning credit models
            - Portfolio monitoring
          detail: "Model performance, bias testing, and drift thresholds are not public."
        - label: Servicing and collections
          items:
            - AI chat and voice bots
            - Smart eNACH mandate orchestration
          detail: "Automation outcomes are asserted without customer-harm or cure-rate denominators."
        - label: Platform infrastructure
          items:
            - Cloud infrastructure
            - Domain-driven microservices
            - CI/CD and resilience practices
          detail: "Company architecture disclosures are not accompanied by audited availability metrics."
        - label: External regulated rails
          items:
            - IndusInd-supported UPI payment switch
            - Co-lending institutions
          detail: "The payment-switch rollout was announced as phased across Android and iOS."
    approximationNotes: >-
      Conceptual ordering synthesizes disclosed components and does not assert undocumented
      service boundaries, data flows, or a complete production topology.
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE008, CE014]
callouts:
  - calloutType: strength
    title: Breadth is visible; integration quality is not
    body: >-
      Navi has a demonstrably broad consumer product surface and concrete disclosures for
      digital lending and payments infrastructure. The retained evidence does not show whether
      those modules share a durable platform, identity layer, or cross-product data model.
    claimRefs: [CE001, CE004, CE007, CE012]
  - calloutType: risk
    title: Control effectiveness is the underwriting question
    body: >-
      Company disclosures describe substantial security, resilience, and model-governance
      controls, but the historical RBI intervention and the absence of independent technical
      metrics make tested outcomes more important than control inventories.
    claimRefs: [CE009, CE010, CE013]
