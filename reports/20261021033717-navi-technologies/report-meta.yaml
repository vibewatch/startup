  topStrengths:
    - Navi Finserv reported INR 13,138 crore of FY26 AUM and INR 292 crore of profit after tax.
    - Navi reached a reported 4% share of consumer UPI transactions in July 2026.
    - The app spans payments, lending, insurance, and investments, creating a credible cross-sell surface.
  topRisks:
    - FY26 consolidated net loss widened to INR 466 crore despite 16% revenue growth.
    - Regulatory recurrence remains material after the RBI's 2024 lending restriction.
    - A third-party payment-gateway bug was alleged to have caused an INR 14.26 crore fraud loss.
    - >-
      The reported financing and valuation lack public signed terms, and product-level unit economics remain
      undisclosed.
  unresolvedGaps:
    - Signed August 2026 financing terms, regulatory approvals, current cap table, and investor rights.
    - Audited FY26 group accounts, current liquidity, cash burn, and product-level contribution margins.
    - Current credit-vintage performance, delinquency curves, collections outcomes, and stress losses.
    - Active-customer, retention, attach-rate, concentration, and independently verified outcome data by product.
    - >-
      Independent validation of payment-gateway remediation, model performance, uptime, and group-wide security
      controls.
