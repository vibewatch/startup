  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      No retained source establishes a public code repository, package-registry footprint, engineering-community
      activity, or a credible practitioner proxy for Navi's current stack.
    whyItMatters: >-
      Public engineering activity would help test delivery cadence, platform maturity, and whether the disclosed
      architecture is actively maintained.
    diligencePath: >-
      Request engineering release metrics and repository evidence, then verify any public organization, package,
      conference talk, or practitioner-community footprint.
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Audited uptime, transaction-success rate, latency distribution, incident history, dependency concentration, and
      tested RTO/RPO results are not present in the retained sources.
    whyItMatters: >-
      Resilience and scalability claims cannot be underwritten without measured production outcomes and failure-recovery
      evidence.
    diligencePath: >-
      Obtain 24-month service-level reports, incident postmortems, dependency maps, capacity tests, and
      disaster-recovery exercise results by product.
  - type: private-evidence-only
    severity: material
    topic: model-risk
    missingEvidence: >-
      Model validation, drift thresholds, fairness testing, explainability, override rates, and pricing-control results
      are not disclosed.
    whyItMatters: >-
      Underwriting automation is a core differentiator and a potential source of credit, consumer-treatment, and
      regulatory risk.
    diligencePath: >-
      Review model inventory, validation reports, monitoring dashboards, adverse-action logic, policy overrides, and
      post-2024 pricing-remediation evidence.
