    whyItMatters: >-
      Company-reported control inventories do not establish operating effectiveness across payments, lending,
      investments, and insurance.
    diligencePath: >-
      Obtain current ISO certification and scope, SOC or equivalent assurance, VAPT summaries, privacy-control testing,
