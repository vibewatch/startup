    severity: material
    topic: credit-quality
    missingEvidence: >-
      Post-remediation delinquency curves, stage-3 assets, write-offs, collections, and vintage performance for
      unsecured and secured lending.
    whyItMatters: >-
      Lending is the earnings engine, and the regulatory interruption makes current credit and conduct outcomes central
      to margin durability.
    diligencePath: >-
      Review monthly loan tapes, vintage curves, roll rates, recovery performance, write-off policy, and regulator
      correspondence through FY26.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
