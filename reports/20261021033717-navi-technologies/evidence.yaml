evidenceGaps:
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Signed 2026 equity-round documents, a reconciled funding history, post-money valuation, current cap table, and
      comparable active-customer counts.
    whyItMatters: Public profile totals cannot establish ownership, investor rights, capital currently available, or customer scale.
    diligencePath: >-
      Obtain the executed Prosus subscription documents, company secretary cap table, bank and debt schedule, and
      monthly product-level active-user reporting.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated group-wide employee census reconciled by legal entity, employment status, and geography.
    whyItMatters: >-
      The 1,737 and 643 public figures have unexplained scope differences and cannot support an operating-efficiency
      judgment.
    diligencePath: Request the current HRIS export and reconcile it to payroll and legal entity records.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete current holdco and subsidiary leadership roster, committee memberships, delegated authorities, and
      succession coverage.
    whyItMatters: Public evidence cannot fully separate founder dependence from delegated management and regulated-entity oversight.
    diligencePath: >-
      Obtain organization charts, board and committee charters, reserved matters, succession plans, and recent board
      minutes.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: Complete post-Prosus shareholder, lender, option-pool, and beneficial ownership schedules.
    whyItMatters: >-
      Publicly named stakeholders do not reveal current control, liquidation rights, dilution, debt covenants, or
      refinancing exposure.
    diligencePath: Review the statutory register, capitalization model, shareholder agreements, debt documents, and security filings.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: current-market-sizing
    missingEvidence: >-
      Independent FY2026 actual market sizes for retail lending, digital disbursals, health-insurance premium and
      mutual-fund AUM using compatible definitions.
    whyItMatters: >-
      The DRHP forecasts have reached their terminal year and cannot establish current TAM, forecast accuracy or Navi's
      market share.
    diligencePath: >-
      Rebase each market with FY2026 RBI, IRDAI and AMFI actuals, then reconcile stock and flow metrics before
      estimating SAM or SOM.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-economics
    missingEvidence: >-
      Current UPI-acquired cohort conversion, retention, product attach rates, customer-acquisition cost and
      lifetime-value data by product.
    whyItMatters: >-
      UPI scale creates value only if acquired users convert to profitable regulated products at acceptable retention
      and risk.
    diligencePath: >-
      Request monthly cohort tables from management and reconcile them to product-level revenue, marketing spend and
      active-user definitions.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitor comparability
    missingEvidence: >-
      Current matched peer pricing, product terms, funding scale, active users, retention, and cross-sell rates for the
      named competitors.
    whyItMatters: >-
      Without like-for-like peer data, Navi's price leadership, distribution efficiency, and economic differentiation
      cannot be underwritten.
    diligencePath: >-
      Run a product-level mystery shop and request a management cohort pack with peer-normalised pricing, acquisition
      cost, retention, and attach rates.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching costs
    missingEvidence: Product-level multi-homing, primary-app share, repeat usage, cross-product conversion, and churn cohorts.
    whyItMatters: These data distinguish a broad catalogue from actual customer lock-in and durable distribution economics.
    diligencePath: >-
      Request monthly cohorts by acquisition channel and first product, including active usage, second-product attach,
      churn, and reacquisition.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: stale
    severity: material
    topic: competitive risk
    missingEvidence: >-
      A current filed competitor-risk discussion replacing the 2022 IPO filing's market structure and fee-pressure
      analysis.
    whyItMatters: >-
      The older filing is useful for structural mechanisms but cannot establish every competitor's 2026 strategy or
      relative strength.
    diligencePath: >-
      Obtain the latest board strategy materials, lender presentations, and any new offering document with product-level
      competitive benchmarks.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly cash burn, committed facilities, debt maturities, covenant headroom, and
      downside runway.
    whyItMatters: >-
      Funding raised is not cash available, and the widening accounting loss cannot be converted into a cash-burn or
      runway estimate.
    diligencePath: >-
      Obtain the latest audited balance sheet, monthly cash-flow bridge, debt schedule, facility documents, covenant
      calculations, and board-approved downside plan.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current product-level realized yield, CAC, payback, retention, cross-sell conversion, contribution margin, and
      gross-margin bridge.
    whyItMatters: >-
      Directional improvements and historical cross-sell do not establish whether UPI-led acquisition or each regulated
      product earns an acceptable return.
    diligencePath: >-
      Request FY26 monthly cohort economics by acquisition channel and product, reconciled to audited consolidated
      revenue and cost lines.
    relatedQuestionRefs:
