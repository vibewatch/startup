    - type: "private-evidence-only"
      severity: "material"
      topic: "payment gateway remediation"
      missingEvidence: >-
        Independent root-cause closure, end-to-end payment authorisation test
        results, recovered-loss detail, and control-owner sign-off after the 2024 incident.
      whyItMatters: >-
        Public descriptions of an internal review and general security controls do
        not establish that the specific amount-integrity defect cannot recur.
      diligencePath: >-
        Review the incident report, TPAP contract and postmortem, police-case status,
        insurer recovery, reconciliations, penetration-test scope, and independent
        retest evidence for every affected payment path.
      relatedQuestionRefs:
        - "QR009"
    - type: "private-evidence-only"
      severity: "material"
      topic: "counterparty concentration"
      missingEvidence: >-
        Funding-provider, co-lender, payment-gateway, and cloud/platform exposure by
        counterparty, maturity, volume, revenue contribution, covenant, and termination right.
      whyItMatters: >-
        Counts of counterparties do not show whether a small number of relationships
        can constrain liquidity, originations, or transaction processing.
      diligencePath: >-
        Obtain the lender and partner concentration schedule, contractual termination
        rights, covenant headroom, stressed maturity ladder, and tested replacement plans.
