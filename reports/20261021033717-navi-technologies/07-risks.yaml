figures:
  - id: "FR001"
    title: "Residual risk heatmap"
    type: "matrix"
    summary: >-
      Qualitative heatmap separating observed events from company-reported mitigations;
      ratings are not probabilities and remain subject to the listed diligence gaps.
    data:
      columns:
        - label: "Likelihood"
          detail: "Analyst ordinal assessment from observed recurrence signals and exposure."
        - label: "Impact"
          detail: "Potential effect on operations, capital, customers, or the investment thesis."
        - label: "Mitigation evidence"
          detail: "Strength of public evidence that controls are operating."
        - label: "Residual severity"
          detail: "Risk after giving credit only to disclosed mitigation."
      rows:
        - label: "Regulatory pricing"
          note: "Prior RBI intervention makes recurrence monitorable rather than hypothetical."
          values:
            - label: "Medium"
              note: "Restriction was lifted after reported remediation."
            - label: "Critical"
              note: "A renewed sanction could stop new loan activity."
            - label: "Partial"
              note: "Reopening and model changes are company-reported."
            - label: "High"
              note: "Current supervisory closure evidence is not public."
        - label: "TPAP payment integrity"
          note: "A police complaint alleged a realized loss from an amount mismatch."
          values:
            - label: "Medium"
              note: "One reported incident; recurrence data unavailable."
            - label: "High"
              note: "Direct financial loss and customer-trust consequences."
            - label: "Weak"
              note: "Internal review reported; independent retest unavailable."
            - label: "High"
              note: "Transaction-specific closure remains unverified."
        - label: "Unsecured credit"
          note: "Improved point-in-time metrics need vintage validation."
          values:
            - label: "Medium"
              note: "Consumer-credit performance is cyclical."
            - label: "High"
              note: "Losses affect earnings, capital, and funding confidence."
            - label: "Moderate"
              note: "FY2026 asset quality and provisions improved."
            - label: "Medium"
              note: "No independent post-remediation cohort data."
        - label: "Funding liquidity"
          note: "Relationship count does not reveal maturity or counterparty concentration."
          values:
            - label: "Medium"
              note: "Multiple instruments diversify access."
            - label: "High"
              note: "Origination depends on continuous funding."
            - label: "Moderate"
              note: "More than 70 institutions and multiple instruments are reported."
            - label: "Medium"
              note: "Top-provider shares and stress ladder are unavailable."
        - label: "IT control complexity"
          note: "Auditor language identifies inherent risk from automation and system volume."
          values:
            - label: "Medium"
              note: "Complex automated environments create persistent control risk."
            - label: "High"
              note: "Could affect financial reporting and operations."
            - label: "Moderate"
              note: "Company describes ITGC, SIEM, EDR, VAPT, and continuity controls."
            - label: "Medium-high"
              note: "Control-test results are not publicly disclosed."
        - label: "Group profitability"
          note: "Independent reporting on FY2025 requires reconciliation to audited group accounts."
          values:
            - label: "Medium-high"
              note: "Reported costs and impairment pressured earnings."
            - label: "High"
              note: "Losses can narrow funding and strategic flexibility."
            - label: "Weak"
              note: "No public group-level margin bridge in the assigned evidence."
            - label: "High"
              note: "Lender improvement cannot be generalized to the parent."
    approximationNotes: >-
      Ordinal labels synthesize cited public evidence as of 2026-10-21; they are not
      measured probabilities, and company-issued mitigation has not been independently verified.
    claimRefs:
      - "CR001"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR010"
      - "CR014"
      - "CR016"
callouts:
  - calloutType: "risk"
    title: "Primary kill criterion"
    body: >-
      Any renewed RBI restriction on sanctioning or disbursement, or another
      transaction-integrity loss caused by a payment partner, would break the
      thesis that 2024 remediation was durable.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR010"
      - "CR011"
  - calloutType: "assumption"
    title: "Do not extrapolate lender metrics to the group"
    body: >-
      Navi Finserv's FY2026 asset-quality and capital disclosures are subsidiary
      metrics; they do not establish consolidated Navi Technologies profitability,
      cash generation, or product-level risk.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
