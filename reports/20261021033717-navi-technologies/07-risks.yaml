slug: "navi-technologies"
runDate: "2026-10-21"
company:
  name: "Navi Technologies"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Navi's highest-priority risks are regulatory recurrence and third-party payment
    integrity: the RBI's 2024 lending restriction was later lifted, but a separate
    December 2024 payment-gateway bug was alleged to have caused a Rs 14.26 crore
    loss. Navi Finserv reports stronger FY2026 credit and capital metrics, yet the
    residual case depends on independently validating remediation, partner
    concentration, and group-level profitability.
sections:
  - id: "regulatory-scar-tissue"
    title: "Regulatory scar tissue remains the lead investment risk"
    body: >-
      The most decision-relevant regulatory fact is not merely that Navi operates
      in a regulated sector, but that supervisory intervention has already occurred.
      The Economic Times reported that RBI restrictions on Navi Finserv followed
      material supervisory concerns including excessive loan pricing and were
      lifted on 2 December 2024 after deficiencies were rectified. Navi Finserv's
      FY2026 annual report says business operations resumed that month and that the
      early reopening period was spent refining underwriting, risk architecture,
      and machine-learning models. Those are concrete mitigation signals, but they
      are company-reported and do not disclose current supervisory findings. We
      therefore rank recurrence as high impact with medium likelihood: a repeat
      sanction would directly constrain loan originations, while clean current RBI
      correspondence and pricing audits would materially reduce residual risk.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR001"
  - id: "cyber-and-control-resilience"
    title: "The payment-gateway incident turns dependency controls into a proven loss vector"
    body: >-
      The December 2024 fraud allegation makes third-party transaction integrity an
      observed exposure rather than a generic cybersecurity concern. The Hindu
      reported that customers allegedly changed payable amounts to Rs 1 after
      leaving the Navi app, while the third-party payment provider still returned a
      success response that caused Navi to make the full selected payment; the
      complaint alleged a Rs 14.26 crore loss over fourteen days. Navi Finserv now
      describes layered controls including MFA, tokenised PII, DLP, SIEM, EDR,
      multi-region continuity planning, and CERT-In-empanelled vulnerability
      testing. These measures are relevant but do not independently demonstrate
      that transaction-authorisation invariants, reconciliation alerts, and gateway
      change controls were retested after the incident. The kill criterion is any
      repeat amount-integrity incident or an inability to produce independent
      root-cause closure and control-test evidence.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "credit-funding-and-partner-dependencies"
    title: "Improved lender metrics do not remove group-level model and funding risk"
    body: >-
      Navi Finserv's FY2026 disclosure is directionally reassuring at the regulated
      lender: it reports GNPA of 1.25%, NNPA of 0.16%, an 87.48% provision coverage
      ratio, a 23.76% capital adequacy ratio, and lower impairment expense. That
      evidence should not be generalized to consolidated Navi Technologies.
      Lower-tier independent reports say the parent recorded FY2025 operating
      revenue of Rs 2,565 crore but a Rs 126 crore net loss, with finance costs and
      impairment pressuring earnings; these figures require reconciliation to
      audited group filings. At the lender, Rs 11,480 crore of outstanding debt,
      more than 70 funding institutions, and five active co-lending partners reduce
      single-source dependence in principle, but public evidence does not quantify
      counterparty shares, covenant headroom, or rollover exposure. Investment
      underwriting should therefore treat diversification as unverified until a
      lender-by-lender schedule and stressed liquidity ladder are reviewed.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR003"
  - id: "monitoring-and-thesis-breaks"
    title: "Monitoring should focus on recurrence, vintages, liquidity, and proof of control"
    body: >-
      Four indicators should govern the risk decision after investment. First,
      monitor RBI observations, effective loan pricing, grievance trends, and any
      restriction on sanctioning or disbursement; renewed supervisory action breaks
      the operating thesis. Second, require monthly credit vintages, 30-plus and
      90-plus delinquency curves, write-offs, and collection efficiency, because
      point-in-time GNPA and company-described model improvements cannot establish
      durability. Third, test twelve-month liquidity under loss of the largest
      funding and co-lending counterparties rather than relying on the number of
      relationships. Fourth, obtain independent evidence that the 2024 gateway
      defect was closed across all payment paths. A repeated transaction-integrity
      failure, material deterioration in provision coverage or capital headroom,
      or undisclosed counterparty concentration would each move the case from
      monitorable high risk to thesis-breaking.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR013"
      - "CR016"
