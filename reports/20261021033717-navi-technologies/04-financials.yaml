company:
  name: "Navi Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: "Navi's FY26 revenue from operations grew 16% to ₹2,982 crore, but consolidated net loss widened to ₹466 crore as UPI and diversification spending increased. Lending remains the earnings engine while payments is an acquisition channel; the absence of current cash, burn, credit-cohort, CAC/payback, and product-margin disclosure prevents a complete capital-adequacy or unit-economics underwriting."
sections:
  - id: "financial-trajectory"
    title: "Growth has not yet translated into consolidated profit"
    body: >-
      FY26 revenue from operations rose 16% to ₹2,982 crore and total income rose
      15% to ₹3,091 crore, yet consolidated net loss widened from ₹126 crore in
      FY25 to ₹466 crore in FY26. Reporting attributes the deterioration mainly
      to spending on UPI and other diversification initiatives, so the loss is an
      accounting result rather than a disclosed cash-burn measure. Management
      said the group reached operating break-even in the March quarter without
      one-off gains or investment cuts, but that point-in-time claim does not
      reconcile the full-year loss. Unsecured lending remains the principal
      earnings contributor, while insurance premium and mutual-fund AUM show
      adjacent scale without establishing revenue quality or margins.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI009", "CI010"]
    tableRefs: ["TI001"]
  - id: "acquisition-and-monetization"
    title: "UPI is the acquisition layer; lending is still the monetization engine"
    body: >-
      Navi is using UPI primarily to acquire and engage consumers, with lending,
      insurance, and investments positioned as the monetization layer. Its
      consumer UPI share reached a reported 4% in July, while management said
      incremental acquisition and retention costs were declining and revenue per
      active user from bill payments, recharges, gift cards, advertising, and
      related services was rising month on month. These directional statements
      support the strategic logic but do not disclose CAC, payback, cohort
      retention, conversion, or contribution profit. Historical filing evidence
      shows cross-sell potential, not current unit economics: in the nine months
      ended December 2021, 71.69% of home-loan customers and 52.67% of retail
      health-insurance customers came from the personal-loan-interested user base.
    claimRefs: ["CI006", "CI007", "CI008", "CI015"]
    figureRefs: ["FI001"]
  - id: "pricing-costs-and-unit-economics"
    title: "Public pricing is visible, realized economics are not"
    body: >-
      Navi's official surface lists cash loans of up to ₹20 lakh at interest rates
      up to 26%, loan-against-property products of up to ₹5 crore at rates up to
      22%, and mutual-fund entry from ₹100. These are list terms and entry
      thresholds, not realized yields, revenue, or margin. The latest detailed
      filing available in the assigned evidence is historical: for the nine
      months ended December 2021, advertising, marketing, and publicity expense
      was ₹3,055.71 million, finance cost was ₹1,371.05 million, and impairment
      on financial instruments was ₹1,042.74 million. The mix identifies
      acquisition spend, funding cost, and credit loss as material economic
      levers, but it cannot substitute for FY26 product-level contribution
      margins.
    claimRefs: ["CI011", "CI012", "CI013"]
    tableRefs: ["TI002", "TI003"]
  - id: "capital-adequacy-and-verdict"
    title: "Capital access is visible, capital adequacy is not"
    body: >-
      A third-party database reports a $100 million Prosus-led financing in August
      2026 at a $1.3 billion valuation. That is evidence of financing access, not
      evidence of cash available on the run date, because closing, use of funds,
      cash balances, debt maturities, and restrictions are not disclosed in the
      assigned current evidence. The 2024 RBI interruption to new lending,
      followed by removal of restrictions in December, also shows that revenue
      capacity can be constrained by compliance outcomes. The financial verdict
      is therefore mixed: growing income and an identifiable lending engine are
      positives, but the widening group loss and missing liquidity, credit-vintage,
      and product-margin data make margin durability, runway, and the next capital
      trigger material diligence blockers.
    claimRefs: ["CI001", "CI003", "CI005", "CI014", "CI016"]
