    claimRefs: ["CI006", "CI008", "CI011", "CI012"]
  - id: "TI003"
    title: "Unit economics and capital underwriting"
    columns: ["Metric", "Public value or direction", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["FY26 consolidated net loss", "₹466 crore, versus ₹126 crore in FY25", "Medium", "Shows growth did not cover group investment and operating costs", "Audited FY26 statements and loss bridge by business"]
      - ["March-quarter operating break-even", "Management says group operating costs were covered without one-offs or investment cuts", "Medium", "Potential inflection, but not reconciled to full-year loss", "Monthly P&L bridge and definition of operating break-even"]
      - ["UPI acquisition economics", "Incremental acquisition and retention costs reportedly declined; revenue per active user reportedly rose month on month", "Medium", "Determines whether payments can become a self-funding funnel", "CAC, payback, retention cohorts, ARPU, and contribution profit"]
      - ["Historical cross-sell", "71.69% of home-loan and 52.67% of retail health-insurance customers came from the personal-loan-interested base in the nine months ended December 2021", "High", "Demonstrates historical funnel reuse but is too old to underwrite FY26", "Refresh the same cohorts for FY26 with conversion and profitability"]
      - ["Cash, burn, and runway", null, "Low", "Required to assess financing dependency and next-round timing", "Cash and unrestricted liquidity, monthly cash burn, debt service, committed facilities, covenants, and downside runway"]
    notes: "Null means the assigned public evidence did not disclose a current value; historical cross-sell is not presented as a current cohort metric."
    claimRefs: ["CI003", "CI004", "CI008", "CI015"]
