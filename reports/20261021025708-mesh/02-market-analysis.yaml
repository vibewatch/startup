      - Adoption trigger
    rows:
      - ["Consumer wallet", "Wallet platform", "Wallet holder", "Consumer funds purchase; commercial fee incidence undisclosed", "Enable pay-from-balance with background Visa credential", "Payments or product leader; not publicly verified", "Broader utility without operating a card program"]
      - ["Centralized exchange", "Exchange platform", "Exchange account holder", "Consumer funds purchase; contract economics undisclosed", "Authenticate account, select assets, fund and convert", "Payments or product leader; not publicly verified", "Turn held balances into checkout utility"]
      - ["Merchant payment provider", "PSP or gateway", "Merchant customer and shopper", "Shopper pays; platform pricing undisclosed", "Embed one integration for wallet and exchange sources", "Product or payments leader; not publicly verified", "Avoid separate source and conversion integrations"]
      - ["Enterprise merchant", "Merchant or its PSP", "Shopper", "Shopper pays merchant", "Receive configured stablecoin, fiat, or ordinary Visa payment", "Payments, treasury, or finance; not publicly verified", "No new hardware and less reconciliation complexity"]
      - ["Crypto or fintech platform", "Platform operator", "Platform customer", "Customer funds transaction", "Use Mesh instead of building a standalone card program", "Product, engineering, or payments; not publicly verified", "Faster route to conventional merchant acceptance"]
      - ["Infrastructure ecosystem member", "Chain, issuer, wallet, or exchange", "Enterprise client", "Commercial allocation undisclosed", "Join shared interoperability and routing layer", "Partnerships or engineering; not publicly verified", "Reduce bespoke cross-chain engineering"]
    notes: >-
      Buyer roles are evidence-backed at the segment level, but budget ownership, contract payer,
      pricing, and procurement thresholds remain private-evidence gaps rather than verified facts.
    claimRefs: [CM003, CM004, CM011, CM013, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Market reach and adoption evidence ladder
    type: pyramid
    summary: >-
      Broad ecosystem reach narrows to observed channel activity and Mesh's disclosed network scale,
      but the evidence does not bridge these levels into company-specific market share.
    data:
      items:
        - label: Global crypto owners
          value: 774
          unit: million people
          detail: Reported as of June 2026; ownership is not payment adoption.
        - label: Visa merchant footprint
          value: 175
          unit: million-plus locations
          detail: Overall Visa acceptance network, not locations live on Mesh.
        - label: Crypto card volume
          value: 1.5
          unit: USD billion per month
          detail: Reported late-2025 channel activity with geography unspecified.
        - label: Mesh connected sources
          value: 300
          unit: wallet and exchange sources
          detail: Company product claim; connectivity is not transaction volume.
        - label: Mesh enterprise users
          value: 200
          unit: enterprises
          detail: Company-reported network users, not disclosed as paying Visa-service customers.
        - label: Mesh asset-network reach
          value: 24
          unit: networks
          detail: Company claim paired with 120-plus supported tokens.
    approximationNotes: >-
      Values are publisher-reported and deliberately retain unlike units. Pyramid order is an
      evidence ladder only; it does not imply nested populations, conversion rates, or proportional
      market size, and no SAM or SOM is calculated.
    claimRefs: [CM001, CM002, CM007, CM008, CM009, CM011, CM016]
callouts:
  - calloutType: risk
    title: Broad rail scale is not Mesh revenue
    body: >-
      Visa's acceptance footprint and payment volume show distribution potential, but rollout timing,
      enabled platforms, pricing, take rate, and active spend are still undisclosed. Underwriting
      Mesh from the full rail totals would therefore overstate its evidenced opportunity.
    claimRefs: [CM009, CM010, CM012, CM016]
