      - ["Mesh release via PR Newswire", "2025", "Global", "Stablecoin transaction volume", ">$27T annual", "Company release cites aggregate on-chain transaction volume", "Medium", "Includes non-payment transfers and is not Mesh volume"]
      - ["Mesh/Visa release citing Crypto.com", "June 2026", "Global", "Crypto owners", "774M", "Reported count of people owning crypto", "Medium", "Owners are not necessarily active payment users"]
