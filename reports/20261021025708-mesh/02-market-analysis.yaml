schemaVersion: "report-v2"
artifact: market-analysis
slug: mesh
runDate: 2026-10-21
company:
  name: Mesh
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Mesh addresses the interoperability layer between fragmented crypto balances and merchant
    settlement rather than the whole payments stack. The evidence shows a large potential user
    and acceptance footprint, but it does not support a company-specific SAM, SOM, fee pool, or
    adoption forecast, so valuation should not treat the broad market proxies as Mesh revenue.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Mesh's addressable category is crypto-payment orchestration: connecting balances held in
      wallets and exchanges, selecting a route, converting the source asset, and delivering the
      merchant's configured stablecoin or local currency. The boundary includes source-account
      connectivity, routing, conversion, settlement metadata, and the planned link into conventional
      Visa acceptance. It excludes the full economics of card acquiring, stablecoin issuance,
      blockchain infrastructure, and Visa's existing payment volume. Status-quo substitutes are
      cashing out to a bank account, preloading a platform-specific card, accepting a specified token
      on a specified chain, or building separate wallet, exchange, conversion, and card-program
      integrations. Mesh's claimed breadth of more than 300 funding endpoints and 120-plus tokens
      across 24-plus networks gives the product a broad integration surface, but those counts measure
      connectivity rather than payment demand or monetizable spend.
    claimRefs: [CM001, CM002, CM003, CM004, CM013, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      The available numbers are useful market lenses but not a top-down valuation model. The reported
      774 million crypto owners describe a possible user pool, while roughly $1.5 billion of monthly
      crypto-card volume describes a much narrower observed spending channel. Visa's 175 million
      merchant locations and $14.2 trillion of fiscal-2025 payment volume describe the incumbent
      acceptance network, not locations already enabled by Mesh and not Mesh-addressable revenue.
      Likewise, Mesh's release cites a $300 billion stablecoin market capitalization and more than
      $27 trillion of 2025 transaction volume, but stock value and transfer volume are not merchant
      payments. These differently defined measures cannot be converted into a defensible SAM or SOM
      without eligible transaction mix, geography, take-rate, rollout, and adoption data.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The immediate enterprise buyer is a wallet, exchange, payment platform, or merchant-facing
      provider that wants crypto balances to work at checkout without operating every connection or
      a standalone card program. Consumers are the users and underlying payers; merchants receive a
      conventional Visa payment in the planned Visa path or a configured stablecoin or local currency
      in Mesh's native payment path. Product, engineering, payments, finance, and compliance teams are
      likely stakeholders, but the public sources do not identify the contractual budget owner or
      procurement threshold. Adoption therefore depends on a platform integrating Mesh, enabling the
      experience for eligible users, and demonstrating that reduced integration work and fewer
      checkout steps outweigh pricing, compliance, counterparty, and switching costs. Mesh reports
      more than 200 enterprise users of its network, but that is not a disclosed count of paying
      customers using the planned Visa service.
    claimRefs: [CM003, CM004, CM011, CM013, CM015, CM016]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      The central demand driver is fragmentation: users hold multiple assets across incompatible
      wallets, exchanges, and chains, while merchants prefer one stable settlement asset and an
      unchanged checkout. Mesh can benefit if platforms prefer one orchestration integration over
      custom conversion, bridge, compliance, and card-program work. The Visa partnership could expand
      distribution materially because the proposed service uses existing merchant hardware and
      workflows. The constraint is timing and proof: the sources say initial platforms, supported
      devices, and launch timing remain unannounced, and the retained evidence contains no public fee
      schedule, realized conversion lift, company-specific market share, or transaction-level revenue
      evidence. The Alliance release also frames cross-chain engineering as a months-long burden, but
      that remains a company-issued rationale rather than an independent ROI benchmark. Any valuation
      premium should therefore be tied to verified rollout, active-user spend, retained enterprise
      cohorts, take rate, and gross margin rather than broad crypto ownership or Visa network scale.
    claimRefs: [CM012, CM013, CM014, CM015, CM016]
