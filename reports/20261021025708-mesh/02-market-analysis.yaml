    rows:
      - ["Wallet and exchange connectivity", "Access to balances across 300+ supported sources", "All assets held outside supported accounts", "Wallets, exchanges, platforms", "Core source-side aggregation layer"]
      - ["Payment orchestration", "Route selection across cost, speed, reliability, and available liquidity", "Independent proof of optimization outcomes", "Platforms and merchant payment providers", "Core SmartFunding workflow"]
      - ["Conversion and settlement", "Source-asset conversion into configured stablecoin or local currency", "Stablecoin issuance and all underlying chain economics", "Merchant or merchant-facing platform", "Core merchant value proposition"]
      - ["Visa-linked wallet spending", "Planned funding and conversion into a conventional Visa payment", "Visa acquiring economics and all Visa payment volume", "Participating wallet or platform; consumer pays", "Large adjacency, not yet a disclosed live footprint"]
      - ["Status quo and substitutes", "Cash-out, platform cards, single-token checkout, or internal integrations", "Unrelated retail payment methods", "Platform or merchant chooses implementation", "Sets switching-cost and ROI hurdle"]
    notes: >-
      Boundary is synthesized from Mesh product claims and independent coverage; broad rail metrics
      are excluded from Mesh-addressable spend unless a source explicitly connects them to live usage.
    claimRefs: [CM001, CM002, CM003, CM004, CM013, CM015]
