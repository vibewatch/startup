companyProfile:
  summary: >-
    Founded in 2020, Mesh operates an interoperability and transaction-orchestration layer for digital-asset payments.
    Its public evidence supports broad wallet and exchange connectivity, a recently financed expansion plan, and
    significant partner optionality, but does not establish audited revenue quality, margins, retention, current
    liquidity, or a completed Visa rollout.
