        title: Capital base and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Mesh announced a $75 million Series C on January 27, 2026, led by Dragonfly Capital and joined by
              Paradigm, Moderne Ventures, Coinbase Ventures, SBI Investment, and Liberty City Ventures. Both the company
              release and The Block report a $1 billion valuation and more than $200 million raised in total; The Block
