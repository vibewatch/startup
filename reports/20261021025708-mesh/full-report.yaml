      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The immediate enterprise buyer is a wallet, exchange, payment platform, or merchant-facing provider that
              wants crypto balances to work at checkout without operating every connection or a standalone card program.
              Consumers are the users and underlying payers; merchants receive a conventional Visa payment in the
              planned Visa path or a configured stablecoin or local currency in Mesh's native payment path. Product,
              engineering, payments, finance, and compliance teams are likely stakeholders, but the public sources do
              not identify the contractual budget owner or procurement threshold. Adoption therefore depends on a
              platform integrating Mesh, enabling the experience for eligible users, and demonstrating that reduced
              integration work and fewer checkout steps outweigh pricing, compliance, counterparty, and switching costs.
              Mesh reports more than 200 enterprise users of its network, but that is not a disclosed count of paying
              customers using the planned Visa service.
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The central demand driver is fragmentation: users hold multiple assets across incompatible wallets,
              exchanges, and chains, while merchants prefer one stable settlement asset and an unchanged checkout. Mesh
              can benefit if platforms prefer one orchestration integration over custom conversion, bridge, compliance,
              and card-program work. The Visa partnership could expand distribution materially because the proposed
              service uses existing merchant hardware and workflows. The constraint is timing and proof: the sources say
              initial platforms, supported devices, and launch timing remain unannounced, and the retained evidence
              contains no public fee schedule, realized conversion lift, company-specific market share, or
              transaction-level revenue evidence. The Alliance release also frames cross-chain engineering as a
              months-long burden, but that remains a company-issued rationale rather than an independent ROI benchmark.
              Any valuation premium should therefore be tied to verified rollout, active-user spend, retained enterprise
              cohorts, take rate, and gross margin rather than broad crypto ownership or Visa network scale.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad rail scale is not Mesh revenue
            body: >-
              Visa's acceptance footprint and payment volume show distribution potential, but rollout timing, enabled
              platforms, pricing, take rate, and active spend are still undisclosed. Underwriting Mesh from the full
              rail totals would therefore overstate its evidenced opportunity.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than named crypto-payment processors. A buyer can use a
              conventional gateway that asks the customer to provide a specific asset on a specific chain, issue or
              adopt a dedicated crypto card, require users to cash out through a bank, assemble wallet, bridge, swap,
              compliance, and settlement integrations internally, or use a card-network-linked API such as the Visa and
              Bridge route reported by Unchained. Mesh attacks this fragmentation with authenticated account connections
              and asset routing rather than requiring a raw-address payment flow. That gives Mesh a distinct
              orchestration position, but retained evidence does not establish that these rails are exclusive or that
              internal-build and card-linked alternatives cannot reproduce the workflow. The practical contest is
              therefore over integration burden, distribution access, reliability, and compliance execution, not merely
              token coverage.
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP014
              - CP016
