chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Mesh was founded in 2020 and presents itself as an interoperability layer for digital-asset payments,
              connecting wallets, exchanges, chains, and financial-services platforms while allowing merchants to
              receive stablecoins or local currency. Its website claims support for more than 300 platforms, more than
              100 tokens, and more than 100 partners. Those figures describe network coverage and relationships rather
              than active merchants, paying customers, or transaction volume. A later independent article reports that
              more than 200 enterprises use the network, but the underlying definition, activity threshold, and
              reporting period are not disclosed. The retained evidence therefore supports a broad infrastructure
              footprint but not a normalized customer count or a current operating scale estimate.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO016
