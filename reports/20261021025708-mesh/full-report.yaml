  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Mesh's addressable category is crypto-payment orchestration: connecting balances held in wallets and
              exchanges, selecting a route, converting the source asset, and delivering the merchant's configured
              stablecoin or local currency. The boundary includes source-account connectivity, routing, conversion,
              settlement metadata, and the planned link into conventional Visa acceptance. It excludes the full
              economics of card acquiring, stablecoin issuance, blockchain infrastructure, and Visa's existing payment
              volume. Status-quo substitutes are cashing out to a bank account, preloading a platform-specific card,
              accepting a specified token on a specified chain, or building separate wallet, exchange, conversion, and
              card-program integrations. Mesh's claimed breadth of more than 300 funding endpoints and 120-plus tokens
              across 24-plus networks gives the product a broad integration surface, but those counts measure
              connectivity rather than payment demand or monetizable spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available numbers are useful market lenses but not a top-down valuation model. The reported 774
              million crypto owners describe a possible user pool, while roughly $1.5 billion of monthly crypto-card
              volume describes a much narrower observed spending channel. Visa's 175 million merchant locations and
              $14.2 trillion of fiscal-2025 payment volume describe the incumbent acceptance network, not locations
              already enabled by Mesh and not Mesh-addressable revenue. Likewise, Mesh's release cites a $300 billion
              stablecoin market capitalization and more than $27 trillion of 2025 transaction volume, but stock value
              and transfer volume are not merchant payments. These differently defined measures cannot be converted into
              a defensible SAM or SOM without eligible transaction mix, geography, take-rate, rollout, and adoption
              data.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
