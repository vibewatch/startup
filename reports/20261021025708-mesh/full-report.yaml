        blocks:
          - type: paragraph
            body: >-
              The public milestone sequence moves from formation in 2020 and a reported Series B in 2024 to the January
              2026 Series C, a June enterprise interoperability program, and an October Visa partnership. The capital
              was described as supporting product development and expansion in Latin America, Asia, and Europe. The Visa
              design would provision a credential behind participating wallets while Mesh handles funding, conversion,
