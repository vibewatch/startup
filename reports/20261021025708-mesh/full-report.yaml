      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Bam Azizi is consistently identified as Mesh's co-founder and chief executive, making him the only named
              operating leader established across the retained company and independent coverage. His public remarks
              frame the strategy around removing fragmentation among wallets, chains, and assets, which ties founder
              leadership directly to product positioning. The same evidence does not identify the other founder or
              founders, a chief financial, compliance, or technology executive, the board chair, independent directors,
              or investor board rights. That disclosure gap prevents an assessment of succession depth, functional
              coverage, and checks on a visibly founder-led strategy; it should not be read as evidence that those roles
              or controls are absent.
