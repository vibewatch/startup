        title: Capability, distribution, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Mesh's official product surface claims access to more than 300 wallets and exchanges, more than 120 tokens
              across more than 24 networks, and the ability to combine up to five funding sources inside one
              transaction. Its recent strategic direction adds distribution layers: settlement on and off Base, an
              alliance intended to reduce bespoke cross-network work, and an announced Visa design in which a credential
              is provisioned behind participating wallets. The Visa announcement is meaningful distribution proof, but
              Visa's 175 million merchant locations are the size of Visa's acceptance network, not a live Mesh
              footprint. Independent coverage consistently notes that initial availability, devices, and participating
              platforms remain unannounced. This makes partner execution and rollout conversion central competitive
              dependencies rather than completed advantages.
