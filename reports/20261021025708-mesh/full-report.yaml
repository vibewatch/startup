  - id: FE001
    title: Mesh product architecture and settlement handoff
    type: stack
    summary: >-
      The publicly observable stack moves from client experience through session, connectivity, authorization, and
      routing services to a customer-configured destination and downstream operations.
    data:
      layers:
        - label: Client experience
          items:
            - Web SDK
            - iOS SDK
            - Android SDK
            - React Native SDK
            - Flutter SDK
          detail: Link presents connection, verification, transfer, and completion states.
        - label: Session configuration
          items:
            - Link Token
          detail: A server-issued, ten-minute, single-use token configures the journey.
        - label: Connectivity
          items:
            - Exchange integrations
            - Self-custody wallet integrations
          detail: Mesh handles authentication flows and provider API calls.
        - label: Managed authorization
          items:
            - Mesh Managed Tokens
          detail: A stable tokenId supports repeat sessions while Mesh refreshes underlying access.
        - label: Funding orchestration
          items:
            - SmartFunding
            - Transfer type
            - Network and fee selection
          detail: Routing evaluates balance, compatibility, fees, and speed.
        - label: Destination and operations
          items:
            - Merchant or application address
            - Transfer webhooks
            - Refund address
          detail: The customer supplies the destination and consumes events for downstream posting.
    approximationNotes: >-
      This is a source-bounded logical stack, not a claim about Mesh's internal service topology, custody model, or
      control boundaries.
    claimRefs:
