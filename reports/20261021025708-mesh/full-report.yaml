      - number: '4.2'
        title: Distribution and conversion economics
        blocks:
          - type: paragraph
            body: >-
              Mesh sells into payment processors, exchanges, wallets, brokerages, payroll platforms, and other
              enterprises, while end users encounter the product inside partner experiences. That distribution model can
              concentrate sales effort and expand addressable transaction flow, but it also leaves economics dependent
              on negotiated partner terms and activation. Mesh reported more than 200 enterprises on its network when
              announcing the Visa partnership. The arrangement could extend participating wallet balances toward Visa's
              acceptance footprint, yet independent coverage stresses that no launch date, supported-device list, or
              initial platform roster had been announced. Visa's 175 million merchant locations are therefore
              distribution potential, not live Mesh-enabled locations or processed volume. The strongest economic
              interpretation is a scalable orchestration opportunity whose realized conversion, take rate, and partner
              concentration remain unproven.
            claimRefs:
              - CI007
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Sacra characterizes Mesh as relatively asset-light and non-custodial, which should avoid hardware
              manufacturing, merchant receivables funding, and some custody or chargeback costs. That does not make
              delivery cost negligible. Publicly described obligations include maintaining hundreds of exchange and
              wallet integrations, reacting to third-party API changes, operating blockchain and bridge infrastructure,
              sustaining security and compliance controls, supporting enterprise implementations, and absorbing or
              passing through liquidity, conversion, gas, and partner-rail charges. The assigned sources provide no
              realized take rate, gross margin, contribution margin, CAC, sales-cycle, payback, retention, loss, or
              support-cost metric. Those omissions prevent testing whether transaction growth creates operating leverage
              or merely scales variable rail and service-delivery expense. Unit economics should consequently be treated
              as unavailable, not inferred from volume, funding, integrations, or merchant reach.
            claimRefs:
              - CI007
              - CI008
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI008
              - CI013
              - CI014
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Mesh said its Series C proceeds would support geographic expansion, product development, and network
              growth. Those proceeds improve capacity to fund integration-heavy expansion, but funding raised is not
              equivalent to current cash available. The assigned public evidence does not establish cash on hand,
              monthly burn, runway, debt or credit facilities, liquidation preferences, or the operating milestones that
              would trigger another round. The Alliance Program also claims that shared routing can reduce cost, improve
              speed, and lower operational risk, but supplies no measured savings or reliability series. Independent
              commentary calls for payment success, effective cost, settlement time, outage, fraud-loss, and provider
              concentration data. The financial verdict is therefore mixed: plausible usage-based scale and ample recent
              equity financing are positives, while revenue verification, margin conversion, capital adequacy, and unit
              economics remain blocking diligence items for a valuation-grade underwriting case.
            claimRefs:
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding does not establish runway
            body: >-
              Recent equity financing does not disclose current unrestricted cash, monthly burn, debt, preferences, or
              the next financing trigger.
            calloutType: risk
            claimRefs:
              - CI013
          - type: callout
            title: Require a transaction-to-gross-profit reconciliation
            body: >-
              Before underwriting revenue quality, obtain a monthly bridge from eligible processed volume through
              realized take rate, net revenue, direct rail costs, losses, support costs, and gross profit by product.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI008
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Mesh's documented product starts with Link, a hosted user experience embedded by a client application. A
              server creates a short-lived, single-use Link Token that configures the transfer type, destination, amount
              constraints, and display currency; one of five client SDKs then presents account connection, wallet
              verification, transfer preview, compliance steps, and completion states. The supported journeys include
              deposits, fixed-amount payments, on-ramp flows, withdrawal-address retrieval, and wallet verification. For
              repeat users, Mesh Managed Tokens preserve a stable token identifier while Mesh refreshes the underlying
              authorization. SmartFunding adds routing across available balances using network compatibility, fees, and
              speed. This combination reduces the integration burden at the experience layer, but the customer still
              needs to define settlement destinations, ledger treatment, and operational controls around the resulting
              transfer events.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE009
              - CE013
              - CE015
      - number: '5.2'
        title: Architecture, deployment, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is an orchestration stack rather than a custody system. Mesh connects to
              exchanges and self-custody wallets, handles their authentication and API calls, applies session
              configuration through Link Tokens, selects funding paths through SmartFunding, and reports transfer state
              through webhooks. Sub-clients provide separate API credentials, branding, compliance settings, and data
              isolation for payment-service-provider use cases. A production-like sandbox supports integration testing
              without moving real assets. Operationally, the documentation warns that an SDK completion callback is not
              sufficient evidence of final transfer posting because exchanges may take seconds to days; clients are told
              to consume server-to-server webhooks before crediting a user or releasing inventory. The architecture
              therefore depends on external exchange availability, chain finality, destination-wallet readiness, and the
              client's own idempotent event processing and reconciliation.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
              - CE014
          - type: table
            tableRef: TE003
