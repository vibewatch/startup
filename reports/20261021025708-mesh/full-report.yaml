      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Mesh's most defensible public evidence is network breadth combined with a routing layer and enterprise
              partnerships, supported by more than 200 enterprises claimed on its network and fresh Base, alliance, and
              Visa initiatives. Funding capacity also matters: Mesh and The Block report a $75 million Series C at a $1
              billion valuation, taking total capital raised above $200 million. Yet the announced Visa experience
              depends on wallet participation, credential provisioning, and a rollout that had not been scheduled
              publicly by the run date. Visa also has a stablecoin-linked card partnership with Bridge, a Stripe
              company, showing that a major distribution partner can support multiple infrastructure routes. The moat
              case is therefore conditional: Mesh can compound integration and liquidity coverage if deployments go
              live, but card networks, vertically integrated wallets, gateways, and internal builds can compress
              differentiation if orchestration becomes standardized or partners control customer access.
            claimRefs:
