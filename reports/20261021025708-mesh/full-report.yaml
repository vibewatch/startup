  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Mesh's disclosed model is transaction-led rather than conventional subscription SaaS. Sacra describes
              per-transaction or basis-point charges on payments, deposits, conversions, and payouts, supplemented by
              verification fees and negotiated enterprise commitments. Customers may also configure their own client
              fee, which can make Mesh both infrastructure cost and monetization surface for a processor or marketplace.
              Sacra estimates $52 million of annualized revenue in June 2026 versus roughly $31 million at the end of
              2025, but explicitly characterizes the figure as a current transaction run rate rather than contracted
              ARR. No audited financial statement, metric methodology, or revenue-mix disclosure is present in the
              assigned evidence. The estimate therefore indicates possible commercial scale, not verified recurring
              revenue quality, and public list pricing cannot be used to bridge the gap because Mesh negotiates
              enterprise terms.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
