  - id: FR001
    title: Qualitative residual-risk matrix
    type: matrix
    summary: >-
      High impact is consistent across the four leading exposures; observed launch uncertainty is separated from
      probabilities that cannot be quantified with the assigned evidence.
    data:
      columns:
        - id: impact
          label: Impact
        - id: likelihood-signal
          label: Likelihood or signal
        - id: mitigation-maturity
          label: Mitigation maturity
      rows:
        - id: regulatory-control
          label: Regulatory control boundary
          values:
            - value: High
              detail: Wallet verification, KYC, conversion, and transaction processing touch regulated flows.
              tone: risk
            - value: Unquantified
              detail: No regulator test, exception rate, or control-failure history was retained.
              tone: warning
            - value: Company-described
              detail: Signature verification and non-custodial orchestration are described but not independently tested here.
              tone: warning
        - id: visa-rollout
          label: Visa rollout execution
          values:
            - value: High
              detail: The partnership is strategically visible and tied to broad acceptance claims.
              tone: risk
            - value: Elevated
              detail: No launch date, supported devices, or initial participating platforms were announced.
              tone: risk
            - value: Pre-launch
              detail: Roles are described, but production scope and acceptance evidence remain pending.
              tone: warning
        - id: routing-reliability
          label: Routing and reliability
          values:
            - value: High
              detail: Failure can interrupt verification, conversion, routing, or settlement across partners.
              tone: risk
            - value: Unquantified
              detail: No independent Mesh uptime, payment-success, loss, or incident history was retained.
              tone: warning
            - value: Claims only
              detail: Routing controls are company-issued, while the advisor uptime metric applies to Bluvo.
              tone: warning
        - id: partner-concentration
          label: Partner concentration
          values:
            - value: High
              detail: Visa, Revolut, connected platforms, and routing partners are central to distribution and execution.
              tone: risk
            - value: Unquantified
              detail: No counterparty-level revenue, gross-profit, or routed-volume shares were disclosed.
              tone: warning
            - value: Breadth claimed
              detail: Client and endpoint counts indicate breadth but do not establish economic diversification.
              tone: neutral
        - id: acquisition-integration
          label: Bluvo acquisition integration
          values:
            - value: Medium
              detail: The acquired exchange-connectivity stack and team must be integrated without weakening controls.
              tone: warning
            - value: Unquantified
              detail: The acquisition was announced eight days before the run date, with no post-close performance history.
              tone: warning
            - value: Team retained
              detail: Bluvo's founders joined Mesh, but migration and retention milestones were not disclosed.
              tone: neutral
        - id: capital-execution
          label: Capital and expansion execution
          values:
            - value: High
              detail: Geographic expansion, product work, network growth, and integration all consume capital.
              tone: risk
            - value: Unquantified
              detail: Funding is disclosed, but cash, burn, runway, revenue, and margins are not.
              tone: warning
            - value: Funding raised
              detail: The Series C increases resources but does not establish cash available or unit economics.
              tone: neutral
    approximationNotes: >-
      Qualitative categories reflect only the cited role boundaries, explicit rollout uncertainty, and evidence gaps;
      they are not incident-frequency estimates or modeled probabilities.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong financing and distribution signals narrow into a research-more decision because deployment and operating
      economics remain unverified.
    data:
      nodes:
        - id: financing
          label: Financing proof
          detail: $75 million Series C at a $1 billion valuation.
        - id: distribution
          label: Distribution option
          detail: PayPal and Visa relationships broaden potential reach.
        - id: deployment
          label: Deployment uncertainty
          detail: Visa-linked service lacked a disclosed launch date and initial platforms.
        - id: economics
          label: Economics gap
          detail: Revenue, margins, retention, burn, and cash were not disclosed in retained evidence.
        - id: price
          label: Price discipline
          detail: The last-round mark is not an intrinsic-value model.
        - id: decision
          label: Research more
          detail: Require operating, cap-table, and rollout evidence before pricing.
    approximationNotes: >-
      The flow is a qualitative decision chain; it does not assign probabilities or imply that partner-network scale
      equals Mesh transaction volume.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV015
