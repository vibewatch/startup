              - CP014
              - CP015
      - number: '3.3'
        title: Pricing, switching cost, and lock-in
        blocks:
          - type: paragraph
            body: >-
              Public packaging evidence is weak. Mesh's payments page routes prospects to Contact Sales and does not
              disclose a list price, unit fee, minimum commitment, volume discount, foreign exchange spread, or
              implementation fee. The retained evidence likewise does not provide comparable prices for conventional
              gateways, dedicated cards, internal builds, or the Visa-Bridge alternative. Mesh argues that one
              integration replaces repeated custom work and that added chains and venues become routing options without
              merchant code changes; this can lower integration burden and create operational stickiness. It is not
              proof of contractual lock-in, realized savings, or high switching costs. Buyers should treat breadth and
              orchestration as a potentially valuable bundle while requiring transaction-level pricing, service-level
              terms, migration rights, and observed implementation effort before concluding that Mesh has a cost
              advantage.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
