      - number: '5.3'
        title: Maturity, differentiation, and technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              External evidence validates parts of the integration proposition but does not close enterprise-control
              diligence. A 2026 World App integration says users can fund wallets from hundreds of supported exchanges
              and wallets, while Mesh's Alliance announcement describes a shared connectivity and routing layer across
              chains, wallets, exchanges, issuers, and platforms. Fireblocks, a direct competitor rather than an
              independent benchmark, nonetheless credits Mesh's five-SDK developer experience and SmartFunding while
              asserting that merchants bring their own destination or custody and that public compliance,
              reconciliation, and certification disclosures are thin. Mesh's own Core-team recruiting language also
              shows that expanding exchange and wallet coverage and standardizing routing remain active execution work.
              Independent reporting on the Visa partnership adds a potentially broad distribution path, but it also
              states that launch timing, supported devices, and initial participants were not disclosed. The investment
              conclusion is a credible and increasingly deployed connectivity layer whose operational maturity, control
              environment, and production performance still require primary diligence.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise controls remain a diligence gate
            body: >-
              The assigned evidence does not establish audited uptime, transaction failure rates, reconciliation
              coverage, named screening providers, incident history, or company-disclosed SOC/ISO certifications. Treat
              these as open control questions rather than proof that a control is absent.
            calloutType: risk
            claimRefs:
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Mesh operates a multi-sided customer model rather than selling to one homogeneous buyer. Wallets,
              exchanges, and other platforms are the integration customers: they use Mesh to let their users pay from
              balances already held on those platforms. Consumers are the end users, while merchants receive
              conventional payment or their preferred settlement asset without managing the underlying crypto route. The
              Visa arrangement adds a major acceptance-network partner, but the announced product remains
              consumer-oriented and does not yet demonstrate business-card controls. This structure broadens
              distribution while making adoption dependent on platforms activating the integration and bringing their
              own users into the payment flow.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.2'
        title: Adoption scale and named-account proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows breadth of connectivity more clearly than transaction depth. Mesh says more than 200
              enterprises use its network, that it connects hundreds of wallets and exchanges, and that its broader
              network reaches more than 900 million users. The Tokenstore announcement is the clearest named merchant
              example in the assigned evidence: it describes a single Mesh integration reaching more than 300 exchanges
              and wallets and a saved-payment flow for repeat purchases. Visa materially enlarges the potential
              acceptance surface, but neither Visa nor Mesh had announced the first participating wallets, devices, or
              launch date by the run date. Network reach should therefore be treated as enabled distribution, not
              realized active usage.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU010
              - CU016
