  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "regulatory perimeter"
      missingEvidence: "Primary regulator records, a jurisdiction-by-jurisdiction license matrix, legal-entity funds-flow diagrams, and legal opinions allocating AML, sanctions, Travel Rule, data, and remediation duties."
      whyItMatters: "Company descriptions of verification and non-custodial orchestration do not establish the legal perimeter or liability allocation."
      diligencePath: "Obtain the product and entity funds-flow maps, licenses, regulator correspondence, outsourcing agreements, control RACI, legal opinions, and independent compliance testing for each launch market."
      relatedQuestionRefs:
        - QR004
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: "financial capacity"
      missingEvidence: "Cash balance, monthly burn, runway, revenue, gross margin, working-capital exposure, transaction losses, reserves, and partner-level unit economics."
      whyItMatters: "Funding raised does not reveal cash available or whether Mesh can complete geographic expansion, acquisition integration, and the Visa rollout without further financing."
      diligencePath: "Review current bank statements, monthly management accounts, board-approved plan, cohort contribution margins, cash forecast, loss and reserve schedules, debt, preferences, and financing scenarios."
      relatedQuestionRefs:
        - QR009
    - type: private-evidence-only
      severity: material
      topic: "reliability and security"
      missingEvidence: "Independent Mesh-wide uptime, payment-success rates, chain and partner error rates, incident and loss history, audit reports, penetration tests, and disaster-recovery evidence."
      whyItMatters: "Company routing claims and an advisor-presented Bluvo uptime metric do not establish combined-platform reliability or absence of incidents."
      diligencePath: "Obtain independently tested SOC and security materials, twelve months of service-level data, incident postmortems, loss logs, fallback tests, recovery objectives, and post-acquisition control validation."
    - type: private-evidence-only
      severity: material
      topic: "partner concentration"
      missingEvidence: "Top-five customer and partner shares by revenue, gross profit, payment volume, and routed transactions, together with renewal, termination, pricing, and minimum-commitment terms."
      whyItMatters: "A broad endpoint and client count can coexist with economic dependence on a small number of regulated applications or payment partners."
      diligencePath: "Reconcile customer- and partner-level revenue, volume, and margin cohorts to signed contracts and test downside cases for loss or repricing of Visa, Revolut, or another major counterparty."
