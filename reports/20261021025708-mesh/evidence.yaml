evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      A complete founder, executive, and board roster with biographies, reporting lines, committee roles, and
      investor-designated seats.
    whyItMatters: >-
      Without the roster, succession depth, functional coverage, independence, and key-person concentration cannot be
      assessed.
    diligencePath: >-
      Request the current organization chart, board and committee list, founder biographies, and board-observer or
      consent-right schedule.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Current revenue, ARR, take rate, gross margin, growth, headcount, cash balance, monthly burn, runway, and debt or
      credit terms.
    whyItMatters: Financing proceeds and network counts do not establish commercial scale, capital efficiency, or liquidity.
    diligencePath: >-
      Obtain monthly management accounts, bank and debt statements, headcount records, cohort revenue, payment volume,
      and take-rate reconciliations.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: identity
    missingEvidence: >-
      The current headquarters, legal-entity structure, and jurisdiction-by-jurisdiction licensing or registration
      matrix.
    whyItMatters: Corporate identity and regulatory perimeter are necessary to assess enforcement exposure and operating authority.
    diligencePath: >-
      Request formation records, subsidiary chart, principal-office confirmation, and regulator-issued license or
      registration records.
    relatedQuestionRefs:
      - QO001
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: >-
      Ownership percentages, liquidation preferences, option dilution, board rights, vetoes, debt, and secondary-sale
      terms.
    whyItMatters: >-
      Named investors and total funding do not reveal control, preference overhang, or proceeds available to the
      company.
    diligencePath: Review the fully diluted cap table, charter, investor-rights agreements, financing documents, and debt schedule.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: rollout-risk
    missingEvidence: >-
      Live launch date, enabled wallet cohort, supported devices and markets, transaction volume, pricing, failure
      rates, and compliance allocation for the Visa service.
    whyItMatters: Visa's total network footprint cannot be treated as live Mesh distribution or commercial traction.
    diligencePath: >-
      Obtain production launch notices, named-wallet confirmations, merchant and transaction telemetry, commercial
      agreements, and compliance responsibility matrices.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A dated primary-source chronology for product releases, regulatory events, partnerships, and adverse incidents
      before 2024.
    whyItMatters: The retained public record is financing-heavy and may omit operational reversals or earlier execution history.
    diligencePath: >-
      Request a company milestone register and reconcile it to archived newsroom, regulator, litigation, and customer
      records.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Eligible payment volume by geography and channel, platform rollout assumptions, active-user spend, pricing, take
      rate, and realistic penetration ranges.
    whyItMatters: >-
      Without these denominators, broad ownership, stablecoin, and Visa metrics cannot yield a company-specific SAM,
      SOM, revenue pool, or valuation multiple.
    diligencePath: >-
      Obtain management's cohort-level transaction model and contracts, reconcile it to processor statements, and
      rebuild bottom-up scenarios by live platform and geography.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Contracting entity, budget owner, procurement threshold, implementation cost, pricing, and renewal authority for
      each target segment.
    whyItMatters: >-
      Buyer interest does not establish budget availability, sales-cycle length, implementation friction, or durable
      willingness to pay.
    diligencePath: >-
      Review signed contracts and pipeline records, then interview product, payments, finance, and compliance owners at
      representative wallet, exchange, PSP, and merchant customers.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: rollout
    missingEvidence: >-
      A live date, named initial platforms, eligible devices and geographies, transaction volume, active users, and
      merchant acceptance performance for the Mesh-Visa service.
    whyItMatters: >-
      The announced Visa footprint is distribution potential rather than evidence of current Mesh adoption, processed
      volume, or revenue.
    diligencePath: >-
      Request the launch plan and weekly rollout dashboard, and verify production activity with participating platforms
      and Visa settlement records.
    relatedQuestionRefs:
      - QM008
      - QM010
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Mesh and named alternatives' realized take rates, spreads, minimum commitments, integration fees, volume
      discounts, SLA credits, and renewal terms.
    whyItMatters: >-
      Without comparable realized commercial terms, diligence cannot establish whether Mesh wins on price, packaging, or
      total cost of ownership.
    diligencePath: >-
      Obtain redacted contracts and invoices for at least three comparable enterprise deployments, plus competitive
      quotes using one transaction and settlement specification.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: compliance
    missingEvidence: >-
      An independent jurisdiction-by-jurisdiction licensing matrix, security attestations, compliance testing, incident
      record, and like-for-like competitor evidence.
    whyItMatters: >-
      Company statements about onboarding, KYC, and compliance signals do not establish regulatory coverage or superior
      trust posture against alternative providers.
    diligencePath: >-
      Review licenses, regulator registers, SOC reports, penetration-test summaries, compliance policies, program
      agreements, and independent control testing for Mesh and shortlisted peers.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited monthly revenue, revenue recognition policy, product mix, and reconciliation from processed volume to net
      revenue.
    whyItMatters: The only current revenue value is an external annualized estimate that is explicitly not ARR.
    diligencePath: Obtain audited statements, monthly management accounts, invoices, and a product-level volume-to-revenue bridge.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized pricing, take rate, gross margin, contribution margin, CAC, payback, retention, losses, and direct
      service-delivery costs.
    whyItMatters: Without these metrics, transaction growth cannot be translated into durable gross profit or sales efficiency.
    diligencePath: >-
      Review customer cohorts, contracts, processor statements, cost ledgers, implementation hours, and gross-profit
      waterfalls by product.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, monthly burn, runway, debt and credit facilities, liquidation preferences, committed spend, and
      next-round trigger.
    whyItMatters: Capital raised does not establish current liquidity, downside protection, or financing dependency.
    diligencePath: >-
      Inspect bank statements, capitalization records, debt documents, board budget, cash forecast, and downside
      financing plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Independently verified payment success, effective cost, settlement time, outages, fraud losses, and provider
      concentration.
    whyItMatters: >-
      Announced network reach and program benefits do not demonstrate live throughput, reliability, or economic
      performance.
    diligencePath: >-
      Request monthly service-level reports, incident logs, loss data, corridor-level performance, and third-party
      customer confirmations.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
