callouts:
  - calloutType: strength
    title: Financing and ecosystem validation
    body: >-
      The $75 million Series C, repeat institutional investors, and announced Visa distribution
      design provide credible external signals that Mesh occupies a strategic infrastructure layer,
      even though they do not establish current revenue or unit economics.
    claimRefs: [CO006, CO007, CO008, CO009, CO013]
  - calloutType: risk
    title: Rollout and disclosure risk
    body: >-
      Visa's 175 million merchant locations describe Visa's network, not live Mesh acceptance.
      Launch timing, participating platforms, financial performance, governance, and cash runway
      remain unavailable in the retained evidence.
    claimRefs: [CO014, CO015]
