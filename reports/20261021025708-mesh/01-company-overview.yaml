artifact: company-overview
slug: mesh
runDate: 2026-10-21
company:
  name: Mesh
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Mesh is a 2020-founded crypto payments infrastructure company whose public record now includes
    a $75 million Series C at a $1 billion valuation, more than $200 million of disclosed capital,
    and announced distribution initiatives with Visa and an enterprise alliance program. The
    strongest evidence establishes financing and product scope, while headquarters, board
    composition, revenue, margins, headcount, debt, and rollout conversion remain undisclosed.
sections:
  - id: identity-and-operating-scope
    title: Identity and operating scope
    body: >-
      Mesh was founded in 2020 and presents itself as an interoperability layer for digital-asset
      payments, connecting wallets, exchanges, chains, and financial-services platforms while
      allowing merchants to receive stablecoins or local currency. Its website claims support for
      more than 300 platforms, more than 100 tokens, and more than 100 partners. Those figures
      describe network coverage and relationships rather than active merchants, paying customers,
      or transaction volume. A later independent article reports that more than 200 enterprises use
      the network, but the underlying definition, activity threshold, and reporting period are not
      disclosed. The retained evidence therefore supports a broad infrastructure footprint but not
      a normalized customer count or a current operating scale estimate.
    claimRefs: [CO001, CO003, CO004, CO005, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Bam Azizi is consistently identified as Mesh's co-founder and chief executive, making him the
      only named operating leader established across the retained company and independent coverage.
      His public remarks frame the strategy around removing fragmentation among wallets, chains,
      and assets, which ties founder leadership directly to product positioning. The same evidence
      does not identify the other founder or founders, a chief financial, compliance, or technology
      executive, the board chair, independent directors, or investor board rights. That disclosure
      gap prevents an assessment of succession depth, functional coverage, and checks on a visibly
      founder-led strategy; it should not be read as evidence that those roles or controls are absent.
    claimRefs: [CO002, CO003]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital base and stakeholder map
    body: >-
      Mesh announced a $75 million Series C on January 27, 2026, led by Dragonfly Capital and joined
      by Paradigm, Moderne Ventures, Coinbase Ventures, SBI Investment, and Liberty City Ventures.
      Both the company release and The Block report a $1 billion valuation and more than $200 million
      raised in total; The Block also reports an $82 million Series B led by Paradigm in 2024.
      Funding raised is not cash available, and none of the retained sources supplies cash balance,
      burn, runway, debt, liquidation preferences, ownership, or board-control terms. Visa is an
      important distribution counterparty rather than a disclosed investor, and the announced
      partnership remains subject to rollout details.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-execution
    title: Milestones and execution status
    body: >-
      The public milestone sequence moves from formation in 2020 and a reported Series B in 2024 to
      the January 2026 Series C, a June enterprise interoperability program, and an October Visa
      partnership. The capital was described as supporting product development and expansion in
      Latin America, Asia, and Europe. The Visa design would provision a credential behind
      participating wallets while Mesh handles funding, conversion, onboarding, and identity
      checks, allowing merchants to receive conventional Visa payments. This is an announced
      operating model, not evidence of live distribution: independent coverage states that launch
      timing, supported devices, and initial platforms had not yet been announced as of the run
      date. Execution diligence should focus on actual activation, volume, economics, and compliance
      ownership rather than Visa's total acceptance footprint.
    claimRefs: [CO001, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
