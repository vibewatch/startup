  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-evidence-gap
      missingEvidence: >-
        Audited revenue, ARR, take rate, gross margin, retention, cash, burn, customer
        concentration, capitalization, liquidation preferences, and board rights.
      whyItMatters: >-
        These inputs determine whether the $1 billion financing mark can produce an
        acceptable risk-adjusted return and how downside is allocated.
      diligencePath: >-
        Obtain audited financial statements, monthly operating cohorts, bank statements,
        the fully diluted cap table, charter, investor rights agreements, and financing
        documents in the data room.
      relatedQuestionRefs:
        - QV006
      relatedTableRefs:
        - TV001
        - TV003
    - type: missing-source
      severity: material
      topic: comparator
      missingEvidence: >-
        Comparable public-company metrics, private-round terms, and M&A outcomes normalized
        for product mix, growth, margin, geography, and stage.
      whyItMatters: >-
        A single early-stage orchestration company does not provide a defensible valuation
        multiple or exit benchmark for Mesh.
      diligencePath: >-
        Commission a transaction-comps data-room extract and normalize enterprise value
        against verified revenue, gross profit, growth, and payment volume.
    - type: access-blocked
      severity: minor
      topic: access-limitation
      missingEvidence: >-
        Substantive article bodies from the two allocated net-new IQ.wiki and CalculatorAI pages.
      whyItMatters: >-
        Their prefetched pages exposed only shell text and therefore could not substantiate
        valuation or distribution claims.
      diligencePath: >-
        Replace them in a future permitted discovery cycle with accessible, independent
        valuation or rollout evidence; do not rely on snippets alone.
acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      Two required net-new pages exposed only shell text; they document the access gap,
      are not used for operating claims, and keep restricted sources below thirty percent.
