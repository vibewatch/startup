  topStrengths:
    - 钱包、交易所、资产和网络之间广泛且有据可查的连接能力，支撑了差异化的编排定位。
    - 机构融资，以及与大型平台和支付网络已宣布的分销关系，带来了可观的商业期权价值。
    - 只要合作伙伴激活能转化为持续且可变现的支付量，以交易为核心的模式就有一条可行的规模化路径。
  topRisks:
