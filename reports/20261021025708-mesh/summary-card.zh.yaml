    - 公开证据无法确认 Mesh 在各司法辖区的监管边界，也无法确认其安全与可靠性控制经过独立测试。
    - 客户与合作伙伴集中度、合同经济条款、终止权以及优先权悬置仍未披露。
  unresolvedGaps:
    - 经审计的月度收入、收入确认、产品组合、实际抽成率、毛利率、贡献利润率，以及从处理量到净收入的勾稽表。
    - 账户层面的留存、客户与合作伙伴集中度、合同期限、续约、排他性、定价和终止条款。
    - 不受限现金、月度现金消耗、现金跑道、债务与授信额度、资本结构、清算优先权、所有权和董事会权利。
    - 一份已签约的 Visa 上线计划，明确首批参与平台、支持设备、地域顺序、激活里程碑和线上交易经济模型。
    - 监管机构出具的牌照证据、法律控制分配、独立安全审计、正常运行时间与支付成功记录、欺诈损失和事故记录。
