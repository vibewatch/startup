schemaVersion: "report-v2"
artifact: financials
slug: mesh
runDate: "2026-10-21"
company:
  name: Mesh
chapter:
  number: 4
  title: Financials
  summary: >-
    Mesh appears to monetize transaction orchestration through usage-based fees, but the only
    current revenue figure in the assigned evidence is Sacra's unaudited $52 million annualized
    estimate. The $75 million Series C improves financing capacity, yet cash, burn, runway, debt,
    realized pricing, and gross-margin evidence remain material underwriting gaps.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      Mesh's disclosed model is transaction-led rather than conventional subscription SaaS.
      Sacra describes per-transaction or basis-point charges on payments, deposits, conversions,
      and payouts, supplemented by verification fees and negotiated enterprise commitments.
      Customers may also configure their own client fee, which can make Mesh both infrastructure
      cost and monetization surface for a processor or marketplace. Sacra estimates $52 million
      of annualized revenue in June 2026 versus roughly $31 million at the end of 2025, but
      explicitly characterizes the figure as a current transaction run rate rather than
      contracted ARR. No audited financial statement, metric methodology, or revenue-mix
      disclosure is present in the assigned evidence. The estimate therefore indicates possible
      commercial scale, not verified recurring revenue quality, and public list pricing cannot be
      used to bridge the gap because Mesh negotiates enterprise terms.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
  - id: distribution-and-conversion-economics
    title: Distribution and conversion economics
    body: >-
      Mesh sells into payment processors, exchanges, wallets, brokerages, payroll platforms, and
      other enterprises, while end users encounter the product inside partner experiences. That
      distribution model can concentrate sales effort and expand addressable transaction flow,
      but it also leaves economics dependent on negotiated partner terms and activation. Mesh
      reported more than 200 enterprises on its network when announcing the Visa partnership.
      The arrangement could extend participating wallet balances toward Visa's acceptance
      footprint, yet independent coverage stresses that no launch date, supported-device list, or
      initial platform roster had been announced. Visa's 175 million merchant locations are
      therefore distribution potential, not live Mesh-enabled locations or processed volume.
      The strongest economic interpretation is a scalable orchestration opportunity whose
      realized conversion, take rate, and partner concentration remain unproven.
    claimRefs: [CI007, CI009, CI010]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Sacra characterizes Mesh as relatively asset-light and non-custodial, which should avoid
      hardware manufacturing, merchant receivables funding, and some custody or chargeback costs.
      That does not make delivery cost negligible. Publicly described obligations include
      maintaining hundreds of exchange and wallet integrations, reacting to third-party API
      changes, operating blockchain and bridge infrastructure, sustaining security and compliance
      controls, supporting enterprise implementations, and absorbing or passing through
      liquidity, conversion, gas, and partner-rail charges. The assigned sources provide no
      realized take rate, gross margin, contribution margin, CAC, sales-cycle, payback, retention,
      loss, or support-cost metric. Those omissions prevent testing whether transaction growth
      creates operating leverage or merely scales variable rail and service-delivery expense.
      Unit economics should consequently be treated as unavailable, not inferred from volume,
      funding, integrations, or merchant reach.
    claimRefs: [CI007, CI008, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Mesh said its Series C proceeds would support geographic expansion, product development,
      and network growth. Those proceeds improve capacity to fund integration-heavy expansion,
      but funding raised is not equivalent to current cash available. The assigned public evidence does not
      establish cash on hand, monthly burn, runway, debt or credit facilities, liquidation
      preferences, or the operating milestones that would trigger another round. The Alliance
      Program also claims that shared routing can reduce cost, improve speed, and lower operational
      risk, but supplies no measured savings or reliability series. Independent commentary calls
      for payment success, effective cost, settlement time, outage, fraud-loss, and provider
      concentration data. The financial verdict is therefore mixed: plausible usage-based scale
      and ample recent equity financing are positives, while revenue verification, margin
      conversion, capital adequacy, and unit economics remain blocking diligence items for a
      valuation-grade underwriting case.
    claimRefs: [CI012, CI013, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Payments and deposits, "Transaction or basis-point fee", "Per transaction or payment volume", "Described by Sacra; amount undisclosed", "Usage-based and volume-sensitive", "Invoice sample, realized take rate, refunds, and net revenue definition"]
      - [Conversions and routing, "Conversion and SmartFunding routing fee", "Per conversion or routed value", "Described by Sacra; amount undisclosed", "Potentially recurring with flow but exposed to rail costs", "Gross versus net presentation, spread capture, slippage, and liquidity cost"]
      - [Payouts, "Transaction or basis-point fee", "Per payout or payout value", "Described by Sacra; amount undisclosed", "Usage-based with partner and corridor dependence", "Volume by corridor, partner fee schedule, and contribution margin"]
      - [Verification and enterprise access, "Per-verification fee plus possible platform commitment", "Verification or annual commitment", "Described by Sacra; terms negotiated", "Potentially more predictable but unquantified", "Contracted minimums, renewal rate, implementation revenue, and mix"]
    notes: "Partial public model based primarily on Sacra analysis; no audited mix, realized pricing, or accounting-recognition policy was available."
    claimRefs: [CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Element, Public evidence, List versus realized, Key unknown]
    rows:
      - [Core transaction fees, "Per-transaction or basis-point structure reported", "No public list price; realized terms unavailable", "Tiering, minimums, rebates, and net take rate"]
      - [Verification charges, "Per-verification fee reported", "No public list price; realized terms unavailable", "Unit price, bundled allowances, and verification volume"]
      - [Enterprise commitments, "Minimum annual spend and tiered API access may apply", "Negotiated enterprise terms", "Average contract value, duration, renewal, and implementation fees"]
      - [Customer-added fee, "Mesh terms reportedly permit a configurable client fee", "Customer-controlled markup, not Mesh revenue by default", "Revenue share, disclosure requirements, and impact on demand"]
    notes: "Pricing mechanisms are reported by Sacra; the table does not treat suggested structures as realized revenue or margin."
    claimRefs: [CI003, CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Annualized revenue, "$52M in June 2026; Sacra estimate", Low, "Only current scale proxy and explicitly not ARR", "Monthly recognized revenue, audited statements, and reconciliation to processed volume"]
      - [Gross margin and contribution margin, null, Low, "Tests whether conversion and rail costs permit operating leverage", "Margin by payments, deposits, payouts, conversion, and verification"]
      - [Realized take rate, null, Low, "Links payment volume to net revenue quality", "Gross and net revenue divided by eligible processed volume with exclusions"]
      - [CAC and payback, null, Low, "Tests enterprise GTM efficiency", "Fully loaded CAC, sales cycle, implementation cost, and gross-margin payback"]
      - [Cash and monthly burn, null, Low, "Required to convert financing history into runway", "Current unrestricted cash, trailing six-month burn, and committed spend"]
      - [Runway and next-round trigger, null, Low, "Determines financing dependency", "Base and downside runway plus board-approved financing milestones"]
      - [Debt and preference overhang, null, Low, "May alter downside recovery and effective capital cost", "Debt schedule, credit facilities, liquidation preferences, and covenants"]
    notes: "Null means the metric was not established by the assigned public evidence; financing raised is not treated as cash available."
    claimRefs: [CI001, CI004, CI008, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge from enterprise integration to fee opportunity
    type: flow
    summary: >-
      The public model converts partner-distributed customer activity into several fee
      opportunities, but no source quantifies the conversion from activity to gross profit.
    data:
      nodes:
        - id: enterprise-platform
          label: Enterprise platform
          detail: "Processor, exchange, wallet, brokerage, payroll, gaming, or other embedded channel."
        - id: user-activity
          label: Payment activity
          detail: "A user initiates a payment, deposit, payout, conversion, or verification workflow."
        - id: funding-source
          label: Funding-source access
          detail: "Mesh connects balances held across supported wallets, exchanges, and platforms."
        - id: orchestration
          label: Routing and conversion
          detail: "SmartFunding coordinates asset selection, swaps, bridging, and preferred settlement."
        - id: settlement
          label: Recipient settlement
          detail: "The merchant or recipient receives a configured stablecoin, local currency, or standard payment."
        - id: monetization
          label: Fee opportunity
          detail: "Transaction, basis-point, conversion, routing, verification, or enterprise commitment fees may apply."
    approximationNotes: "Conceptual sequence only; node order does not quantify conversion, take rate, revenue, or gross profit."
    claimRefs: [CI003, CI006, CI007, CI008, CI009]
callouts:
  - calloutType: risk
    title: Funding does not establish runway
    body: >-
      Recent equity financing does not disclose current unrestricted cash, monthly burn, debt,
      preferences, or the next financing trigger.
    claimRefs: [CI013]
  - calloutType: recommendation
    title: Require a transaction-to-gross-profit reconciliation
    body: >-
      Before underwriting revenue quality, obtain a monthly bridge from eligible processed volume
      through realized take rate, net revenue, direct rail costs, losses, support costs, and gross
      profit by product.
    claimRefs: [CI004, CI008, CI014, CI016]
