  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: production-performance
      missingEvidence: Audited uptime, latency percentiles, transfer failure and recovery rates, routing-quality benchmarks, and reconciliation accuracy by product and integration.
      whyItMatters: These metrics determine whether the documented orchestration layer performs reliably under production volume and provider outages.
      diligencePath: Request twelve months of service-level reports, incident logs, route-level completion data, webhook delivery statistics, and customer reconciliation samples.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: security-and-compliance
      missingEvidence: Current independent audit reports, security certifications, named transaction-screening providers, control ownership, and jurisdiction-specific compliance responsibilities.
      whyItMatters: The product handles authorization and asset movement across external platforms, so enterprise adoption depends on verifiable control design and operating effectiveness.
      diligencePath: Obtain SOC reports or equivalent audits, penetration-test summaries, vendor and subprocessor lists, compliance-control matrices, and incident-response evidence under NDA.
      relatedQuestionRefs: [QE006, QE008]
