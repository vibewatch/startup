callouts:
  - calloutType: risk
    title: Enterprise controls remain a diligence gate
    body: The assigned evidence does not establish audited uptime, transaction failure rates, reconciliation coverage, named screening providers, incident history, or company-disclosed SOC/ISO certifications. Treat these as open control questions rather than proof that a control is absent.
    claimRefs: [CE012, CE016]
