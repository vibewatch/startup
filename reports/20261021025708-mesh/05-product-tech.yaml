  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal risk
    rows:
      - ["Client SDK and Link", "Render the hosted connection and transfer journey", "Correct client initialization and callback handling", "Client-side completion may be mistaken for final transfer posting"]
      - ["Session control", "Configure each journey through a Link Token", "Secure server-side issuance and ten-minute validity", "Token leakage or incorrect destination parameters"]
      - ["Integration connectors", "Authenticate and call exchanges and self-custody wallets", "External APIs, wallet protocols, and connector maintenance", "Coverage, availability, and behavioral drift across providers"]
      - ["Authorization management", "Persist and refresh exchange authorization through MMT", "Provider token policies and Mesh credential controls", "Revocation, compromise, and stale authorization handling"]
      - ["Routing and settlement handoff", "Select funding source and deliver assets to a configured destination", "Asset liquidity, network compatibility, fees, bridges, and destination wallet", "Slippage, failed conversion, chain finality, and customer-owned custody controls"]
      - ["Events and downstream operations", "Notify clients of transfer state and final posting", "Webhook availability and idempotent client processing", "Delayed exchange posting, duplicate delivery, and incomplete reconciliation"]
    notes: "Architecture is reconstructed from Mesh's public concepts documentation and company-issued technical recruiting material; no source in the assigned pool provides an audited end-to-end control design."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE014]
