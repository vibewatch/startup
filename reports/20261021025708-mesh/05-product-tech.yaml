company:
  name: Mesh
chapter:
  number: 5
  title: Product & Technology
  summary: Mesh exposes a documented orchestration layer for moving assets from connected wallets and exchanges into merchant or application destinations, with hosted UX, five client SDKs, managed authorization, routing, sandbox, and webhook primitives. The public record is materially weaker on audited reliability, reconciliation, security certifications, and named compliance controls, while the announced Visa distribution surface had not yet disclosed rollout details.
sections:
  - id: product-workflow
    title: Product surface and customer workflow
    body: >-
      Mesh's documented product starts with Link, a hosted user experience embedded by a client application. A server creates a short-lived, single-use Link Token that configures the transfer type, destination, amount constraints, and display currency; one of five client SDKs then presents account connection, wallet verification, transfer preview, compliance steps, and completion states. The supported journeys include deposits, fixed-amount payments, on-ramp flows, withdrawal-address retrieval, and wallet verification. For repeat users, Mesh Managed Tokens preserve a stable token identifier while Mesh refreshes the underlying authorization. SmartFunding adds routing across available balances using network compatibility, fees, and speed. This combination reduces the integration burden at the experience layer, but the customer still needs to define settlement destinations, ledger treatment, and operational controls around the resulting transfer events.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operations
    title: Architecture, deployment, and operating dependencies
    body: >-
      The observable architecture is an orchestration stack rather than a custody system. Mesh connects to exchanges and self-custody wallets, handles their authentication and API calls, applies session configuration through Link Tokens, selects funding paths through SmartFunding, and reports transfer state through webhooks. Sub-clients provide separate API credentials, branding, compliance settings, and data isolation for payment-service-provider use cases. A production-like sandbox supports integration testing without moving real assets. Operationally, the documentation warns that an SDK completion callback is not sufficient evidence of final transfer posting because exchanges may take seconds to days; clients are told to consume server-to-server webhooks before crediting a user or releasing inventory. The architecture therefore depends on external exchange availability, chain finality, destination-wallet readiness, and the client's own idempotent event processing and reconciliation.
    claimRefs: [CE003, CE005, CE006, CE007, CE008, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-risk
    title: Maturity, differentiation, and technical diligence risks
    body: >-
      External evidence validates parts of the integration proposition but does not close enterprise-control diligence. A 2026 World App integration says users can fund wallets from hundreds of supported exchanges and wallets, while Mesh's Alliance announcement describes a shared connectivity and routing layer across chains, wallets, exchanges, issuers, and platforms. Fireblocks, a direct competitor rather than an independent benchmark, nonetheless credits Mesh's five-SDK developer experience and SmartFunding while asserting that merchants bring their own destination or custody and that public compliance, reconciliation, and certification disclosures are thin. Mesh's own Core-team recruiting language also shows that expanding exchange and wallet coverage and standardizing routing remain active execution work. Independent reporting on the Visa partnership adds a potentially broad distribution path, but it also states that launch timing, supported devices, and initial participants were not disclosed. The investment conclusion is a credible and increasingly deployed connectivity layer whose operational maturity, control environment, and production performance still require primary diligence.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016]
