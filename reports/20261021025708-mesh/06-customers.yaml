schemaVersion: "report-v2"
artifact: customers
slug: mesh
runDate: 2026-10-21
company:
  name: Mesh
chapter:
  number: 6
  title: Customers
  summary: >-
    Mesh presents credible evidence of distribution through more than 200 enterprises, hundreds
    of connected wallets and exchanges, and named relationships including Tokenstore and Visa.
    Those reach indicators do not establish active usage, retention, revenue concentration, or
    the commercial durability of individual accounts, so customer quality remains only partly
    underwritten.
sections:
  - id: customer-segments
    title: Customer segments and buying centers
    body: >-
      Mesh operates a multi-sided customer model rather than selling to one homogeneous buyer.
      Wallets, exchanges, and other platforms are the integration customers: they use Mesh to let
      their users pay from balances already held on those platforms. Consumers are the end users,
      while merchants receive conventional payment or their preferred settlement asset without
      managing the underlying crypto route. The Visa arrangement adds a major acceptance-network
      partner, but the announced product remains consumer-oriented and does not yet demonstrate
      business-card controls. This structure broadens distribution while making adoption dependent
      on platforms activating the integration and bringing their own users into the payment flow.
    claimRefs: [CU001, CU003, CU005, CU012, CU013]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption scale and named-account proof
    body: >-
      Public evidence shows breadth of connectivity more clearly than transaction depth. Mesh says
      more than 200 enterprises use its network, that it connects hundreds of wallets and exchanges,
      and that its broader network reaches more than 900 million users. The Tokenstore announcement
      is the clearest named merchant example in the assigned evidence: it describes a single Mesh
      integration reaching more than 300 exchanges and wallets and a saved-payment flow for repeat
      purchases. Visa materially enlarges the potential acceptance surface, but neither Visa nor
      Mesh had announced the first participating wallets, devices, or launch date by the run date.
      Network reach should therefore be treated as enabled distribution, not realized active usage.
    claimRefs: [CU002, CU003, CU004, CU005, CU007, CU008, CU010, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability and expansion mechanics
    body: >-
      The expansion mechanism is plausible: one integration can expose a merchant or platform to
      more wallets, exchanges, assets, and geographies as Mesh adds network participants. Tokenstore
      says customers connect an account once and can reuse it for subsequent purchases, while Mesh
      handles conversion and routing so Tokenstore receives its settlement asset. The Mesh Alliance
      Program adds more than 50 ecosystem partners that may widen available routes. Yet the public
      record provides no NRR, GRR, churn, renewal, contract-term, cohort, or satisfaction metric.
      Consequently, the evidence supports a land-and-expand product mechanism but not demonstrated
      account durability or expansion revenue.
    claimRefs: [CU006, CU007, CU008, CU009, CU014]
    figureRefs: [FU001]
  - id: concentration-and-diligence
    title: Concentration, channel dependence, and diligence priorities
    body: >-
      The customer thesis is exposed to activation and concentration questions that public reach
      figures cannot answer. Mesh names several enterprises and major partners, but it does not
      disclose revenue by customer, the share of volume routed through leading wallets or exchanges,
      or dependence on Visa and other channels. Nor does the reviewed evidence quantify the number
      of active enterprises, active end users, production deployments, or repeat-payment cohorts.
      Diligence should reconcile contracted accounts to live accounts and payment volume, then test
      gross and net retention, top-ten revenue and volume concentration, partner termination rights,
      implementation time, and the proportion of Visa-enabled platforms that have committed to launch.
    claimRefs: [CU004, CU011, CU014, CU015, CU016]
