figures:
  - id: FU001
    title: Customer activation and expansion journey
    type: journey-map
    summary: "The path from a stored balance to repeat merchant use depends on platform activation, routing, settlement, and evidence of repeat behavior."
    data:
      nodes:
        - id: balance
          label: "Balance already held"
          detail: "A consumer holds crypto, stablecoin, or fiat in a participating wallet, exchange, or platform."
          touchpoints: ["Wallet", "Exchange", "Financial platform"]
        - id: platform-integration
          label: "Platform integrates Mesh"
          detail: "The platform uses one integration rather than maintaining separate connections to each asset source or payment route."
          touchpoints: ["Platform product team", "Mesh integration"]
        - id: onboarding
          label: "User onboarding and identity checks"
          detail: "Mesh says it handles onboarding and KYC for the planned Visa experience; rollout specifics remain pending."
          touchpoints: ["Consumer", "Identity verification"]
        - id: funding-routing
          label: "Funding, conversion, and routing"
          detail: "Mesh selects and converts the supported balance and routes the transaction to the settlement endpoint."
          touchpoints: ["Mesh orchestration", "Wallet balance", "Settlement asset"]
        - id: merchant-payment
          label: "Merchant checkout and settlement"
          detail: "The merchant receives a standard payment or preferred settlement asset without changing the checkout flow."
          touchpoints: ["Online checkout", "Contactless terminal", "Merchant settlement"]
        - id: repeat-expansion
          label: "Repeat use and network expansion"
          detail: "Tokenstore describes saved-account repeat checkout, while added platforms and partners can widen reach; retention and expansion revenue remain unreported."
          touchpoints: ["Repeat purchase", "New platform", "New geography"]
    approximationNotes: "Conceptual sequence based on announced workflows; it is not a measured funnel and does not imply conversion rates or completed rollout."
    claimRefs: [CU004, CU006, CU007, CU008, CU009, CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: Reach is not retention
    body: >-
      The largest published customer metrics describe connected enterprises, potential users, and
      acceptance endpoints. None establishes active use, cohort retention, or recurring customer
      revenue.
    claimRefs: [CU002, CU010, CU014, CU016]
  - calloutType: recommendation
    title: Reconcile integrations to durable economics
    body: >-
      Require account-level evidence that bridges signed, integrated, live, transacting, retained,
      and expanding customers, plus top-customer revenue and volume concentration.
    claimRefs: [CU014, CU015]
