      - ["Visa", "Acceptance-network partner", "Provision a Visa credential behind participating wallet apps for in-store and online payment", "Strategic partnership announced; rollout details pending", "Potential access to Visa's 175 million-plus merchant locations", "Potential network coverage is not a live Mesh merchant or transaction count"]
