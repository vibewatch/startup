    notes: "Reported values preserve the issuers' metric definitions; no row should be read as revenue, retained customers, active users, or completed payment volume."
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU010, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named organization
      - Segment
      - Deployment or use case
      - Production versus pilot
      - Public outcome
      - Limitation
    rows:
