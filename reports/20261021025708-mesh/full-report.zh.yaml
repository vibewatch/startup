      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Mesh 最有说服力的公开证据，是网络广度与路由层、企业合作伙伴的组合，网络上所称超过 200 家企业，以及 Base、联盟和 Visa 新计划也提供支持。资金能力同样重要：Mesh 和 The Block 报告
              $75 million C 轮、$1 billion 估值，累计融资超过 $200 million。然而，已宣布的 Visa 体验依赖钱包参与、凭证配置以及截至运行日仍未公开排期的上线。Visa 还与
              Stripe 旗下 Bridge 建立稳定币卡合作，说明大型分销伙伴可以支持多条基础设施路径。因此护城河判断仍有条件：若部署上线，Mesh
              可积累集成和流动性覆盖；但若编排标准化或合作伙伴控制客户入口，卡网络、垂直整合钱包、网关和内部自建都可能压缩差异化。
