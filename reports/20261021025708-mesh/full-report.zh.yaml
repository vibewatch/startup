      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              Sacra 将 Mesh 描述为相对轻资产、非托管，这应能避免硬件制造、商户应收融资以及部分托管或拒付成本。但这不代表交付成本可以忽略。公开描述的义务包括维护数百个交易所和钱包集成、应对第三方 API
              变化、运行区块链和跨链基础设施、维持安全与合规控制、支持企业实施，以及承担或转嫁流动性、兑换、gas
              和合作通道费用。指定来源没有实际抽成率、毛利率、贡献利润率、CAC、销售周期、回本期、留存、损失或支持成本指标。因此无法判断交易增长会带来经营杠杆，还是只会放大可变通道和服务交付费用。单位经济应视为不可得，不能从交易量、融资、集成或商户覆盖推断。
            claimRefs:
              - CI007
              - CI008
              - CI014
