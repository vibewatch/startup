  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              影响最大的风险是监管和交易边界上的控制失败。Mesh 称会为 Revolut 验证钱包所有权；Visa 安排的独立报道称 Mesh
              将处理开户、身份检查、兑换和交易处理。这些职能可能带来重大合规、欺诈和服务连续性后果，但指定证据没有监管许可矩阵、检查结果或法律意见。因此无法从公开记录量化概率；影响为高，因为控制直接位于受监管客户流程中。

              排名第二的风险是执行。独立报道称，截至运行日 Visa 服务没有公布上线日期、支持设备或首批参与平台，并澄清 Visa 的 175 million 个商户网点是底层受理网络，而非已完成的 Mesh
              上线。若管理层无法提供签署的上线计划、指定首批群组、控制责任矩阵和可衡量的验收标准，论点就会失效。若可靠性或安全证据实质性违约，也会破坏论点；公开顾问材料中的可靠性指标属于被收购的
              Bluvo，并明确未经独立验证。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
