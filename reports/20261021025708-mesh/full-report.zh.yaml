  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开进展
        blocks:
          - type: paragraph
            body: >-
              Mesh 披露的是交易驱动模型，而非传统订阅 SaaS。Sacra 描述支付、存款、兑换和出款按交易或基点收费，另加验证费和协商确定的企业承诺。客户还可以自行设置客户端费用，使 Mesh
              同时成为处理商或市场平台的基础设施成本和变现界面。Sacra 估计 2026 年 6 月年化收入为 $52 million，2025 年底约 $31 million，但明确称这是当前交易运行率而非签约
              ARR。指定证据中没有经审计财报、指标方法或收入结构披露。因此，该估算只说明可能存在商业规模，不能证明经常性收入质量；由于 Mesh 协商企业条款，公开标价也不能弥合这一缺口。
