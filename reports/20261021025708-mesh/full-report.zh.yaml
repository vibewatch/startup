  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Mesh 面向的可服务类别是加密支付编排：连接钱包和交易所中的余额，选择路径、转换源资产，并向商户交付其设定的稳定币或本地货币。边界包括源账户连接、路由、兑换、结算元数据，以及计划接入传统 Visa
              受理。它不包括银行卡收单、稳定币发行、区块链基础设施和 Visa 现有支付量的全部经济性。替代方案包括提现至银行、预装特定平台卡、在指定链上接受指定代币，或自行搭建钱包、交易所、兑换和卡项目整套集成。Mesh
              所称超过 300 个资金端点、覆盖 24+ 网络的 120+ 代币，说明集成面广，却不等于支付需求或可变现支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有数字可作为市场观察窗口，却不能构成自上而下的估值模型。报告中的 774 million 加密资产持有者代表潜在用户池；约 $1.5 billion 的月度加密卡交易量则是更窄的已观察支出渠道。Visa 的
              175 million 个商户网点和 fiscal-2025 的 $14.2 trillion 支付量描述现有受理网络，不代表 Mesh 已启用的网点或其可服务收入。Mesh 公告还引用 $300 billion
              稳定币市值和 2025 年超过 $27 trillion 的交易量，但存量价值与转账量都不是商户支付。没有合格交易结构、地域、费率、上线和采用数据，无法把这些不同口径转换成可靠的 SAM 或 SOM。
