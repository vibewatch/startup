      - number: '4.2'
        title: 分销与转化经济性
        blocks:
          - type: paragraph
            body: >-
              Mesh 面向支付处理商、交易所、钱包、券商、薪资平台及其他企业销售，终端用户则在合作伙伴体验中接触产品。这种模式可集中销售投入并扩大可服务交易流，但经济性也取决于协商的伙伴条款和激活。Mesh 宣布 Visa
              合作时称网络有超过 200 家企业。该安排可能把参与钱包余额延伸到 Visa 受理覆盖，但独立报道强调没有公布上线日期、支持设备清单或首批平台。Visa 的 175 million
              个商户网点因此是分销潜力，不是已启用的 Mesh 网点或已处理交易量。最稳妥的经济解读是：这是可扩展的编排机会，但实际转化、费率和合作伙伴集中度仍未经证明。
            claimRefs:
              - CI007
              - CI009
              - CI010
