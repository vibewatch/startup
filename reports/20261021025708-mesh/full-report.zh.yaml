  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”，而不是不考虑价格的认可。Mesh 宣布 $75 million C 轮、估值 $1 billion，这证明能获得机构融资，却不能建立运营价值底线。分销证明有意义：Mesh 描述了覆盖
              PayPal 加密结账和计划中的 Visa 钱包体验的集成。但 175 million 个商户网点和 fiscal 2025 的 $14.2 trillion 支付量属于 Visa 整体网络，不属于
              Mesh；              独立报道称新服务尚未覆盖该网络，也没有披露上线日期。因此，在判断目标回报或估值区间前，应要求已验证经常性收入、费率、毛利率、留存、现金烧钱和融资条款。在这些数据出现前，$1
              billion 应视为上一轮融资参考点，而非独立验证的公允价值。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: 投资论点、反论点与可比背景
        blocks:
          - type: paragraph
            body: >-
              投资论点是 Mesh 能成为碎片化钱包、交易所、区块链、稳定币和传统受理网络之间的中立编排层。公司证据指向超过 200
              家企业、数百个已连接平台和大型分销关系；若转化为重复且可变现的支付量，这些信号可能形成网络效应。反论点是，已宣布的触达可能只是伙伴期权价值，而非 Mesh 收入。独立文章中的 Visa
              项目没有披露上线日期、参与钱包或支持设备，留存来源也没有经审计交易量、收入、利润、留存或集中度数据。FinTech Futures 报道 HoneyCoin 在融资 $4.9 million 种子轮时每月处理
              $150 million、服务超过 350 家企业，但阶段、产品、地域、增长和经济性差异很大，不适合直接套用估值倍数。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.3'
        title: 情景、退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              由于指定证据无法支持精确估值区间或回报概率，情景框架有意保持定性。乐观情景要求伙伴广泛上线，并披露经常性收入增长、持久费率、有吸引力的毛利率和低集中度；只有这样，超过上一轮 $1 billion
              融资估值才具备分析上的合理性。基准情景假设技术和伙伴证明可信，但单位经济仍不透明，上一轮估值只是谈判锚点而非估值结论。悲观情景由上线延迟、已宣布触达未能转成付费活动、利润率恶化、伙伴依赖集中或优先股堆叠把下行风险转给普通股东触发。退出准备度同样未经证明：来源没有经审计财务、股权结构表、治理细节或可比并购结果。最终尽调应取得客户群组收入、费率、毛利率、留存、伙伴集中度、现金和烧钱、资本结构及清算优先权、董事会权利、合规负债，以及独立核对的处理交易量。
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 继续研究。在没有独立验证的运营经济性和股权条款前，不应把 $1 billion 融资估值当作公允价值。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV012
