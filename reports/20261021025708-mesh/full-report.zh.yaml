      - number: '3.3'
        title: 定价、切换成本与锁定
        blocks:
          - type: paragraph
            body: >-
              公开定价证据很弱。Mesh 支付页面把潜在客户引向 Contact Sales，没有披露标价、单次费用、最低承诺、批量折扣、外汇价差或实施费。现有证据也没有传统网关、专用卡、内部自建或 Visa-Bridge
              替代方案的可比价格。Mesh
              称一次集成可以替代反复定制工作，新增链和场所可变成无需改商户代码的路由选项；这可能降低集成负担并形成运营黏性，但不是合同锁定、实际节省或高迁移成本的证明。得出成本优势结论前，买方应要求交易级定价、服务条款、迁移权和实际实施投入。
            claimRefs:
