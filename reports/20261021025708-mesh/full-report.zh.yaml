        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              Mesh 成立于 2020 年，自称是数字资产支付的互操作层，连接钱包、交易所、区块链和金融服务平台，同时让商户接收稳定币或本地货币。公司网站称支持超过 300 个平台、超过 100 种代币和超过 100
              个合作伙伴。这些数字反映网络覆盖和关系数量，不等于活跃商户、付费客户或交易量。后一篇独立文章称超过 200
              家企业使用该网络，但定义、活跃门槛和统计期间均未披露。因此，现有证据支持其基础设施覆盖较广，却不足以归一化客户数或估算当前运营规模。
