      - number: '7.2'
        title: 监管与法律控制边界
        blocks:
          - type: paragraph
            body: >-
              Mesh 将钱包所有权验证描述为帮助 Revolut 满足欧盟 Travel Rule 自托管钱包要求的机制。它称客户在资金转移前签名一次以证明控制权，Mesh
              作为指令和编排层，不进入资金流。这些是相关缓解措施，但仍是公司描述。记录没有说明哪个 Mesh 实体在各市场签约，谁承担 AML、制裁、Travel
              Rule、消费者补救或数据保护责任，也没有证明监管机构测试过控制。

              Visa 关系扩大了尽调范围。独立报道把客户开户、KYC、资金来源选择、兑换和交易处理交给
              Mesh，而上线司法辖区和参与平台仍未披露。投资前，律师应在每个上线辖区，把产品层资金流图与许可、代理或外包安排、处理商义务、数据处理条款和赔偿条款核对。无法提供这套材料是终止投资标准，因为非托管描述本身不能确定法律边界。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
