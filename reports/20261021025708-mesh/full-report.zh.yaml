      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资终止标准
            body: 若 Mesh 无法证明辖区许可和控制边界、提供有合同约束的 Visa 上线计划及首批群组、提供独立测试的安全和可靠性证据、披露伙伴集中度，或证明能跑完计划中的扩张和集成里程碑，停止投资判断。
