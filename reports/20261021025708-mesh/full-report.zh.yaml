      - number: '7.3'
        title: 运营、安全与集成风险
        blocks:
          - type: paragraph
            body: >-
              随着连接资产、区块链、钱包、交易所和结算路径增多，Mesh 的运营挑战也会增加。公司称覆盖 300+ 个钱包和交易所、120+ 个代币及 24+ 个网络，Alliance
              路由按成本、速度和可用性选择结算路径。覆盖广度可能减少客户集成工作，却扩大第三方故障面，使监控、对账、备用路由和事故响应成为核心控制。指定资料没有独立支付成功率、Mesh
              正常运行历史、损失率、安全审计、渗透测试或事故登记；缺少证据不代表没有发生事故。

              Bluvo 收购同时带来能力和集成风险。FT Partners 报告 Bluvo 创始人加入 Mesh，并给出 Bluvo 超过 99.999% 的正常运行时间指标，而非 Mesh
              指标；同一顾问也声明部分来源信息未经独立验证。因此，尽调应测试迁移计划、特权访问控制、租户隔离、交易所凭证处理、区域故障切换、错误预算和收购后员工留存，不能把顾问指标当作 Mesh 全面的服务等级。
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
