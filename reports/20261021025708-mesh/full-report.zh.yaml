      - number: '7.4'
        title: 伙伴、集中度与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Mesh 位于受监管应用、钱包和交易所服务商、资产发行方及支付通道之间。Revolut 提供突出受监管场景，Visa 提供受理基础设施，Alliance 和 Bluvo
              交易扩展连接层。这使商业触达依赖于交易对手，而其合同、经济性、服务水平、终止权和收入集中度均未披露。超过 200
              家企业客户的报道可作为广度证据，却不能回答少数伙伴是否驱动交易量或毛利。管理层应提供前五大客户和伙伴按收入、交易量、毛利和路由交易数计算的占比，以及续约和终止条款。

              融资降低近期募资压力，却不能证明偿付能力或单位经济。独立和公司来源称 $75 million C 轮、估值 $1
              billion，资金用于地域扩张、产品开发和网络增长。融资额不等于可用现金。指定证据没有现金余额、月度烧钱、现金跑道、收入、毛利率、营运资金敞口、损失准备或转化经济数据。若现金跑道不足以完成披露的扩张和 Visa
              上线而需再次融资，或伙伴调整后的规模化利润率仍为负，论点就会失效。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR007
              - CR010
              - CR012
              - CR015
              - CR016
