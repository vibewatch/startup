            body: >-
              Mesh 官方产品页面称可接入超过 300 个钱包和交易所、覆盖 24+ 网络的 120+ 代币，并能在一次交易中组合最多五个资金来源。近期战略方向增加了分销层：在 Base
              上下线结算、旨在减少跨网络定制工作的联盟，以及在参与钱包后配置凭证的 Visa 方案。Visa 公告是有意义的分销证明，但 175 million 个商户网点是 Visa 受理网络规模，不是 Mesh
