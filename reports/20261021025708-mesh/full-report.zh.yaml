      - CM016
  - id: FP001
    title: 买方解决方案路径的方向性定位
    type: quadrant
    summary: 已宣布的卡网络分发提升了 Mesh 的触达潜力，但内部构建和提现路径仍承担更高的用户或工程负担。
    data:
      xAxis:
        label: 集成与用户负担降低程度（1 低，5 高）
        min: 1
        max: 5
      yAxis:
        label: 分发杠杆（1 低，5 高）
        min: 1
        max: 5
      points:
        - label: Mesh 编排
          x: 4
          'y': 3
          detail: 连接账户的路由范围广，但独立分发取决于参与平台。
        - label: Mesh 加 Visa，已宣布
          x: 5
          'y': 5
          detail: 卡网络触达潜力高；可用性和参与者尚未公布。
        - label: 专用加密卡
          x: 2
          'y': 3
          detail: 受理方式熟悉，但需要独立的卡路径或绑定平台的卡路径。
        - label: 提现至银行
          x: 1
          'y': 2
          detail: 使用成熟通道，但增加出售、转账和等待步骤。
        - label: 内部构建多通道
          x: 1
          'y': 1
          detail: 买方控制力最高，但工程和运营负担反复增加。
        - label: Visa / Bridge 路径
          x: 4
          'y': 5
          detail: 依托现有分发、定位为单一 API；同口径范围尚未确立。
    approximationNotes: 1-5 的序数评分是分析师根据已记录的工作流负担和分发机制设定的方向性位置，不是实测基准；等距不代表经济差异相等。
    claimRefs:
      - CP004
      - CP005
      - CP007
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: 从企业集成到收费机会的收入模型桥接
    type: flow
    summary: 公开模型将合作伙伴分发的客户活动转化为多种收费机会，但没有来源量化从活动到毛利的转化。
    data:
      nodes:
        - id: enterprise-platform
          label: 企业平台
          detail: 处理商、交易所、钱包、经纪商、薪资、游戏或其他嵌入式渠道。
        - id: user-activity
          label: 支付活动
          detail: 用户发起支付、入金、付款、转换或验证流程。
        - id: funding-source
          label: 资金来源接入
          detail: Mesh 连接分布在支持的钱包、交易所和平台中的余额。
        - id: orchestration
          label: 路由与转换
          detail: SmartFunding 协调资产选择、兑换、跨链和优选结算。
        - id: settlement
          label: 收款方结算
          detail: 商户或收款方收到配置好的稳定币、本地货币或标准支付。
        - id: monetization
          label: 收费机会
          detail: 可能收取交易费、基点费、转换费、路由费、验证费或企业承诺费。
    approximationNotes: 仅为概念顺序；节点顺序不量化转化、抽成率、收入或毛利。
    claimRefs:
      - CI003
      - CI006
      - CI007
      - CI008
      - CI009
  - id: FE001
    title: Mesh 产品架构与结算交接
    type: stack
    summary: 可公开观察的技术栈从客户端体验，经过会话、连接、授权和路由服务，延伸到客户配置的目的地及下游运营。
    data:
      layers:
        - label: 客户端体验
          items:
            - Web SDK
            - iOS SDK
            - Android SDK
            - React Native SDK
            - Flutter SDK
          detail: Link 展示连接、验证、转账和完成状态。
        - label: 会话配置
          items:
            - Link Token
          detail: 服务器签发的十分钟单次令牌用于配置流程。
        - label: 连接
          items:
            - 交易所集成
            - 自托管钱包集成
          detail: Mesh 处理认证流程和供应商 API 调用。
        - label: 托管授权
          items:
            - Mesh Managed Tokens
          detail: 稳定的 tokenId 支持重复会话，同时由 Mesh 刷新底层访问权限。
        - label: 资金编排
          items:
            - SmartFunding
            - 转账类型
            - 网络与费用选择
          detail: 路由评估余额、兼容性、费用和速度。
        - label: 目的地与运营
          items:
            - 商户或应用地址
            - 转账 Webhook
            - 退款地址
          detail: 客户提供目的地，并消费事件以完成下游记账。
    approximationNotes: 这是受来源约束的逻辑技术栈，不构成对 Mesh 内部服务拓扑、托管模式或控制边界的主张。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE008
      - CE009
      - CE015
  - id: FU001
    title: 客户激活与扩张旅程
    type: journey-map
    summary: 从已存余额到重复商户使用的路径，取决于平台激活、路由、结算以及重复行为证据。
    data:
      nodes:
        - id: balance
          label: 已持有余额
          detail: 消费者在参与的钱包、交易所或平台中持有加密货币、稳定币或法币。
          touchpoints:
            - Wallet
            - Exchange
            - Financial platform
        - id: platform-integration
          label: 平台集成 Mesh
          detail: 平台只需一次集成，无需分别维护各资产来源或支付路径的连接。
          touchpoints:
            - Platform product team
            - Mesh integration
        - id: onboarding
          label: 用户开户与身份核验
          detail: Mesh 称会为计划中的 Visa 体验处理开户和 KYC；上线细节仍待公布。
          touchpoints:
            - Consumer
            - Identity verification
        - id: funding-routing
          label: 资金、转换与路由
          detail: Mesh 选择并转换支持的余额，再将交易路由至结算端点。
          touchpoints:
            - Mesh orchestration
            - Wallet balance
            - Settlement asset
        - id: merchant-payment
          label: 商户结账与结算
          detail: 商户收到标准支付或偏好的结算资产，无需改变结账流程。
          touchpoints:
            - Online checkout
            - Contactless terminal
            - Merchant settlement
        - id: repeat-expansion
          label: 重复使用与网络扩张
          detail: Tokenstore 描述了已保存账户的重复结账；新增平台和合作伙伴可以扩大触达，但留存和扩张收入仍未见报道。
          touchpoints:
            - Repeat purchase
            - New platform
            - New geography
    approximationNotes: 基于已宣布工作流的概念顺序；这不是实测漏斗，也不代表转化率或已完成上线。
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 定性剩余风险矩阵
    type: matrix
    summary: 四项主要暴露的影响均较高；已观察到的上线不确定性与无法用指定证据量化的概率分开列示。
    data:
      columns:
        - id: impact
          label: 影响
        - id: likelihood-signal
          label: 可能性或信号
        - id: mitigation-maturity
          label: 缓解措施成熟度
      rows:
        - id: regulatory-control
          label: 监管控制边界
          values:
            - value: High
              detail: 钱包验证、KYC、转换和交易处理都触及受监管流程。
              tone: risk
            - value: Unquantified
              detail: 未留存监管机构测试、例外率或控制失效历史。
              tone: warning
            - value: Company-described
              detail: 描述了签名验证和非托管编排，但本报告未作独立测试。
              tone: warning
        - id: visa-rollout
          label: Visa 上线执行
          values:
            - value: High
              detail: 该合作具有战略可见度，并与广泛受理网络的说法相连。
              tone: risk
            - value: Elevated
              detail: 尚未公布上线日期、支持设备或首批参与平台。
              tone: risk
            - value: Pre-launch
              detail: 角色已有描述，但生产范围和受理证据仍待确认。
              tone: warning
        - id: routing-reliability
          label: 路由与可靠性
          values:
            - value: High
              detail: 失效可能中断跨合作伙伴的验证、转换、路由或结算。
              tone: risk
            - value: Unquantified
              detail: 未留存 Mesh 独立的可用率、支付成功率、损失或事故历史。
              tone: warning
            - value: Claims only
              detail: 路由控制由公司发布，而顾问的可用率指标针对 Bluvo。
              tone: warning
        - id: partner-concentration
          label: 合作伙伴集中度
          values:
            - value: High
              detail: Visa、Revolut、连接平台和路由合作伙伴是分发与执行的核心。
              tone: risk
            - value: Unquantified
              detail: 未披露交易对手层面的收入、毛利或路由交易量占比。
              tone: warning
            - value: Breadth claimed
              detail: 客户和端点数量体现广度，但不能证明经济多元化。
              tone: neutral
        - id: acquisition-integration
          label: Bluvo 收购整合
          values:
            - value: Medium
              detail: 收购的交易所连接技术栈和团队必须在不削弱控制的前提下完成整合。
              tone: warning
            - value: Unquantified
              detail: 收购在运行日期前八天宣布，尚无交割后的绩效历史。
              tone: warning
            - value: Team retained
              detail: Bluvo 创始人加入 Mesh，但迁移和留任里程碑未披露。
              tone: neutral
        - id: capital-execution
          label: 资本与扩张执行
          values:
            - value: High
              detail: 地域扩张、产品工作、网络增长和整合都会消耗资本。
              tone: risk
            - value: Unquantified
              detail: 已披露融资，但未披露现金、烧钱、现金跑道、收入和利润率。
              tone: warning
            - value: Funding raised
              detail: C 轮增加了资源，但不能证明可用现金或单位经济性。
              tone: neutral
    approximationNotes: 定性类别仅反映引用来源中的角色边界、明确的上线不确定性和证据缺口；不是事故频率估计或模型概率。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 强劲的融资和分发信号最终仍指向继续研究，因为部署和运营经济性尚未验证。
    data:
      nodes:
        - id: financing
          label: 融资证明
          detail: 7500 万美元 C 轮，估值 10 亿美元。
        - id: distribution
          label: 分发选项
          detail: PayPal 和 Visa 关系扩大了潜在触达。
        - id: deployment
          label: 部署不确定性
          detail: 与 Visa 相关的服务缺少已披露的上线日期和首批平台。
        - id: economics
          label: 经济性缺口
          detail: 留存证据未披露收入、利润率、留存、烧钱和现金。
        - id: price
          label: 价格纪律
          detail: 上一轮估值不是内在价值模型。
        - id: decision
          label: 继续研究
          detail: 定价前要求提供运营、股权表和上线证据。
    approximationNotes: 该流程是定性的决策链；不分配概率，也不代表合作伙伴网络规模等于 Mesh 交易量。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
      - CV015
