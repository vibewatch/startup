            body: >-
              Mesh 的文档化产品从 Link 开始，这是嵌入客户应用的托管用户体验。服务器创建短期、一次性的 Link Token，配置转账类型、目的地、金额约束和显示货币；五种客户端 SDK
              之一随后展示账户连接、钱包验证、转账预览、合规步骤和完成状态。支持存款、固定金额支付、入金、提取地址获取和钱包验证。重复用户可用 Mesh Managed Tokens 保持稳定的 token 标识，由 Mesh
              刷新底层授权。SmartFunding 根据网络兼容性、费用和速度，在可用余额间路由。该组合降低体验层集成负担，但客户仍需定义结算目的地、账务处理和转账事件的运营控制。
