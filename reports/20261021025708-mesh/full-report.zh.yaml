      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              直接企业买方是钱包、交易所、支付平台或面向商户的服务商：它希望加密余额能在结账时使用，却不想自行维护每条连接或独立卡项目。消费者是用户和最终付款方；在计划中的 Visa 路径中，商户收到常规 Visa 支付，在
              Mesh 原生路径中则收到设定的稳定币或本地货币。产品、工程、支付、财务和合规团队可能参与，但公开来源没有确认预算负责人或采购门槛。因此，采用取决于平台接入
              Mesh、为合格用户启用体验，并证明减少集成工作和结账步骤足以抵消价格、合规、交易对手和迁移成本。Mesh 报告网络有超过 200 家企业用户，但这不是使用计划中 Visa 服务的付费客户数。
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动是碎片化：用户的多种资产分散在不兼容的钱包、交易所和区块链中，而商户偏好一种稳定结算资产和不变的结账体验。若平台更愿意采用一次编排集成，而不是自建兑换、跨链、合规和卡项目，Mesh 就能受益。Visa
              合作可能借助现有商户硬件和流程显著扩大分销。约束在于时间和证明：来源称首批平台、支持设备和上线时间仍未公布，现有证据没有公开费率、实际转化提升、公司份额或交易级收入。Alliance
              公告称跨链工程需要数月，但这仍是公司提出的理由，不是独立 ROI 基准。估值溢价应绑定已验证的上线、活跃用户支出、留存企业群组、费率和毛利率，而不是泛化的加密资产持有量或 Visa 网络规模。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 广泛通道规模不等于 Mesh 收入
            body: Visa 的受理覆盖和支付量说明分销潜力，但上线时间、已启用平台、定价、费率和活跃支出仍未披露。用整个通道的总量给 Mesh 做投资判断，会夸大已有证据支持的机会。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不止于知名加密支付处理商。买方可以使用要求客户在指定链上提供指定资产的传统网关，发行或采用专用加密卡，要求用户经银行提现，在内部拼接钱包、跨链、兑换、合规和结算集成，或采用 Unchained 报道的
              Visa 与 Bridge 等卡网络 API。Mesh
              用经过认证的账户连接和资产路由解决碎片化，而非要求原始地址支付。因此它形成了独特的编排位置，但现有证据不能证明这些通道具有排他性，也不能证明内部自建或卡连接方案无法复制流程。实际竞争在集成负担、分销入口、可靠性和合规执行，而不只是代币覆盖。
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP014
              - CP016
