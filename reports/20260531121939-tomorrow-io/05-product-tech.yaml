  - id: data-quality-validation
    title: Data Quality, Validation, and Government Integration
    body: |
      Tomorrow.io's satellite data has been independently evaluated by three U.S. government
      bodies through 2025 and 2026, establishing the strongest independent quality record of
      any commercial weather satellite company. NOAA's January 2026 mid-term Commercial Data
      Pilot evaluation found TMS instruments produce data "well-calibrated, generally comparable
      to ATMS" — NOAA's flagship Advanced Technology Microwave Sounder — with strong cross-satellite
      consistency, radiometric accuracy, and low noise in water vapor channels. Level-2 products
      from TMS data met requirements used in NOAA's Joint Polar Satellite System program.
      NOAA highlighted Tomorrow.io's ability to capture Hurricane Erin's rapid intensification
      when reconnaissance aircraft were grounded and legacy sensors were offline.

      The Joint Center for Satellite Data Assimilation (JCSDA), funded by NOAA, NASA, the U.S.
      Air Force, and the U.S. Navy, conducted a six-month evaluation (September 2024–February
      2025) finding "overwhelming positive impact on the system" — improving temperature, water
      vapor, and wind forecast accuracy across all atmospheric levels globally. In December 2025,
      Tomorrow.io's satellite data entered NOAA's AWIPS2 operational system — the same interface
      used by the National Hurricane Center — for real-time testing. A $2.27 million NOAA NESDIS
      CWDP contract (October 2024) and a May 2025 extension covering the Atlantic hurricane season
      provide both revenue validation and ongoing quality evaluation infrastructure.
