  - id: satellite-tech-stack
    title: Satellite and Sensing Technology Stack
    body: |
      Tomorrow.io's space layer consists of two distinct satellite types. Eleven Tomorrow.io
      Microwave Sounder (TMS) satellites operate across 91–204 GHz frequencies (W-, F-, and
      G-band channels) measuring atmospheric temperature via oxygen absorption and water vapor
      profiles via H₂O bands. As of January 12, 2026, this eleven-satellite microwave sounder
      constellation achieved a 60-minute global weather revisit rate — matching cadences that
      previously required national-scale government programs — and provides the majority of
      global microwave sounder data available at any given moment. Two dedicated Ka-band
      (35.5–36 GHz) precipitation radar satellites (TR1 and TR2) operate at approximately
      550 km sun-synchronous orbit, delivering 4.5 km ground footprint at 250 m vertical
      resolution and governed by NASA CSDA End User License Agreements.

      The satellite architecture is vertically integrated: Tomorrow.io designs the hardware,
      processes raw radiometric data through proprietary pipelines, feeds into AI-native
      modeling systems, and delivers output directly to customer-facing dashboards and APIs.
      The Pathfinder mission in May 2023 validated this space-to-decision architecture before
      operational satellites launched in August 2024. TMS heritage traces to NASA/MIT Lincoln
      Laboratory's TROPICS mission, with Tomorrow.io achieving factor-of-2–3 improvements
      in F-band calibration. The platform is designed for compatibility with JEDI-MPAS,
      FV3-JEDI, and 3DEnVar numerical weather prediction frameworks, enabling direct
      assimilation into government forecasting systems globally.
