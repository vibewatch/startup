      - number: '4.3'
        title: Government Contracts
        blocks:
          - type: paragraph
            body: >-
              Government contracts represent Tomorrow.io's best-documented revenue stream, anchored by two US agencies:
              the Air Force (via AFLCMC/HN's APFIT program) and NOAA. The APFIT contract — awarded approximately March
              2023 for $10.2 million — covers the manufacturing and launch of two operational demonstration weather
              satellites with microwave sounder and radar payloads, qualifying as a fixed-price program with defined
              deliverables. NOAA's Commercial Weather Data Pilot (CWDP) awarded Tomorrow.io $2.27 million in September
              2024 for commercial microwave sounder data, with a contract extension in May 2025 covering the 2025
              hurricane season and a subsequent $899,000 radar validation contract in January 2026. Cumulative disclosed
              government contract value through May 2026 is approximately $33–35 million across NOAA and DoD. Government
              contracts are high-quality revenue: milestone-gated, non-recurring in structure but often renewed, and
              validated by operational NOAA adoption. The NOAA extension in May 2025 signals that CWDP data met NOAA's
              technical requirements — a strong independent credibility signal. The primary concentration risk is
              government budget dependency: if NOAA funding cuts (proposed 17% budget reduction under Trump 2026 budget)
              or DoD reprioritization reduce contract flow, Tomorrow.io has no confirmed commercial replacement for this
              revenue at scale.
