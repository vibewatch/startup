        - label: Space / Sensing Layer
          detail: >-
            11 TMS microwave sounder satellites (91–204 GHz); 2 Ka-band radar satellites (TR1/TR2 at 550 km SSO, 35.5–36
            GHz); 60-min global revisit rate (Gen1); DeepSky multi-modal constellation in development
        - label: Data Ingestion and Processing Layer
          detail: >-
            Proprietary radiometric calibration pipeline; L1/L2 product generation; JEDI-MPAS, FV3-JEDI, and 3DEnVar NWP
            assimilation compatibility; real-time data feeds to NOAA AWIPS2 under CWDP pilot
        - label: AI Modeling Layer
          detail: >-
            Physics-based and generative AI forecasting models; Gale agentic AI engine; NVIDIA Earth-2 integration with
            StormCast km-scale severe weather model; near-real-time atmospheric digital twin; continuously trained on
            live satellite data
        - label: Platform and API Layer
          detail: >-
            REST/JSON Weather API with 60+ data layers, 99.9% uptime claim, 14-day forecast, global coverage; Enterprise
            SaaS with SAML SSO, custom SLAs, geofence alerting; AWS Marketplace and Azure Marketplace availability;
            developer free tier
        - label: Industry Intelligence Layer
          detail: >-
            Altitude (aviation): Lufthansa network, METAR/TAF/SIGMETs/WAFS, rule-based API alerting; Agriculture: 5-day
            advance warning, 20% crop loss reduction claim; Government/Defense: Palantir FedStart FedRAMP/IL delivery;
            Logistics: route monitoring, supply chain disruption alerting
  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: standard
    summary: >-
      End-to-end workflow showing how an enterprise customer (aviation operator) ingests Tomorrow.io weather
      intelligence — from satellite sensing to agentic alert to operational decision — illustrating the embedded rather
      than consultative delivery model.
    claimRefs:
      - CE011
      - CE013
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
    data:
      nodes:
        - id: n1
          label: Satellite observation pass
          detail: >-
            TMS satellite overflies region; 91–204 GHz microwave sounding captures temperature and water vapor profiles;
            Ka-band radar captures precipitation structure; 60-minute global revisit ensures continuous atmospheric
            picture
        - id: n2
          label: Data ingestion and AI modeling
          detail: >-
            Raw radiometric data processed through proprietary calibration pipeline; L1/L2 products fed into Gale AI
            engine and physics-based models; NVIDIA Earth-2 StormCast provides km-scale severe weather forecasting;
            output: high-resolution impact-level forecast for any location
        - id: n3
          label: Rule-based alert trigger (Gale)
          detail: >-
            Altitude monitors airline's full route network against operator-configured rules (e.g., crosswind thresholds
            at specific runways, SIGMETs on active routes); Gale engine evaluates continuously and surfaces only
            actionable alerts; alert delivered via API into existing dispatch or OCC tools
        - id: n4
          label: Operational decision (airline OCC)
          detail: >-
            Lufthansa operations control receives proactive alert with relevant context; no manual global scanning
            required; operator focuses on judgment and action; decision: reroute, delay, or proceed with confidence;
            estimated diversion cost avoided: $22K–$240K per affected flight
        - id: n5
          label: Outcome and feedback loop
          detail: >-
            Weather outcome recorded; platform performance evaluated against forecast accuracy; Gale engine continuously
            trained on live satellite data improving future alerts; Tomorrow.io constellation provides denser, more
            frequent observations with each expansion, compounding AI model quality improvement
      edges:
        - source: n1
          target: n2
          label: Raw radiometric data
        - source: n2
          target: n3
          label: Impact forecast + satellite data
        - source: n3
          target: n4
          label: Automated API alert
        - source: n4
          target: n5
          label: Decision outcome
        - source: n5
          target: n2
          label: Continuous model improvement loop
