    name: Growth Drivers and Constraints Table
    slug: growth-drivers-and-constraints-table
    notes: >-
      Timing estimates are editorial judgments based on news reporting and analyst context; not sourced from a single
      authoritative publication.
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for Tomorrow.io
      - Diligence Ask
    rows:
      - - NOAA FY2026 budget cuts (~27% proposed)
        - Tailwind
        - 2026–2028 (procurement lag)
        - Government demand for commercial data; NOAA IDIQ expansion
        - Confirm contract pipeline uplift from budget displacement
      - - Climate volatility — rising weather-driven operational disruptions
        - Tailwind
        - Ongoing
        - Larger ROI case for premium weather APIs in logistics, insurance, energy
        - Validate customer NPS and retention vs. free-tier switching
      - - Weather API segment growing at ~15% CAGR (faster than overall market)
        - Tailwind
        - 2024–2033
        - API-first GTM aligns with fastest-growing sub-segment
        - Confirm API vs. managed-service revenue split
      - - Enterprise integration friction (ERP/TMS connectors)
        - Headwind
        - 12–24 month sales cycles
        - Lengthens time-to-revenue; increases CAC for mid-market
        - Map integration partner ecosystem and pre-built connector inventory
      - - IBM Weather Company incumbent relationships
        - Headwind
        - Ongoing
        - Displacement requires 3–6 month parallel-test period; churn risk if accuracy gaps found
        - Source competitive win/loss data and IBM contract renewal cadence
      - - Satellite revisit limitations (60-min vs. GOES-East sub-15-min for severe convection)
        - Headwind
        - 2026–2029 (constellation expansion)
        - Accuracy ceiling for severe-convection nowcasting until constellation grows
        - Validate DeepSky Phase 2 launch timeline and funding sufficiency
      - - Cost-per-query pricing model volatility
        - Headwind
        - Ongoing
        - High-frequency users (logistics, retail) face unpredictable costs; ACV ceilings
        - Confirm pricing model evolution toward usage-capped enterprise contracts
