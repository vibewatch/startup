chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io is a Boston, Massachusetts-based weather intelligence company operating at the
              intersection of commercial space technology, generative AI, and enterprise software. Founded in
              2016 under the name ClimaCell, the company rebranded as Tomorrow.io in March 2021 to signal an
              ambition that extends beyond raw weather data into actionable operational intelligence — "not just
              to forecast the future, but to help governments, industries, and communities act on it," as CEO
              Shimon Elkabetz stated at the Series F announcement.

              The company's mission is to transform how the planet is observed and to make weather intelligence
              foundational infrastructure for governments, industries, and communities worldwide. Its positioning
              statement is the "world's leading Resilience Platform™" — a framing designed to elevate weather
              data beyond a commodity input into a mission-critical decision layer comparable in status to
              cybersecurity infrastructure.

              The operating model is vertically integrated across three layers: (1) proprietary space hardware —
              a constellation of Ka-band radar and microwave sounder satellites, (2) AI-driven modeling —
              physics-based and generative AI forecasting engines that convert raw satellite observations into
              impact predictions, and (3) enterprise software — dashboards, APIs, automated alerts, and
              agentic workflow products. This full-stack architecture means Tomorrow.io generates its own
              upstream data rather than depending solely on government weather services, a strategic moat that
              competitors such as AccuWeather and The Weather Company — which rely primarily on NOAA/NWS data —
              do not possess.

              Revenue is generated through a combination of enterprise software subscriptions and government
              data-as-a-service contracts. By the time of the February 2026 Series F, the company reported
              approximately $100 million in annual recurring revenue, serving more than 250 organizations. More
              than half of the top ten Fortune 500 companies use the platform, and the company holds approximately
              $30 million in cumulative U.S. Department of Defense contracts for space-based weather sensing.

              The headquarters is in Boston. The company also maintains a development center in Tel Aviv, Israel,
              with total headcount estimated at 150–200 employees as of early 2026. A legal entity is registered
              as Tomorrow Companies Inc. (the entity named in U.S. Air Force contracts).
