      - number: '6.3'
        title: Customer Growth and Adoption Trajectory
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io's public customer count has grown from early enterprise pilots in 2018–2020
              to a claimed 250+ enterprise and government organizations as of mid-2026, alongside a
              30,000+ developer API user base and six of the top ten Fortune 500 companies. The 250+
              figure is company-claimed and lacks an independent count or time-series breakdown. The
              Fast Company Most Innovative Logistics Company award in 2024 and the TIME 100 Most
              Influential Companies recognition in 2024 both cite the customer base as evidence of
              market validation, though these are editorial endorsements rather than third-party audits.

              The most concrete adoption signal is the JetBlue trajectory: a single-airport pilot
              in 2018 grew to ten airports within eighteen months, then to a full-enterprise contract
              covering all global operations — demonstrating both product-market fit and the capacity
              for multi-year expansion within a single account. JetBlue Ventures participated in
              Tomorrow.io's Series A, evidencing confidence in the platform beyond the commercial
              relationship. Lufthansa's March 2026 network-wide Altitude™ deployment is the most
              recent major named deployment, adding one of Europe's largest carriers to the
              production reference roster.

              Government adoption is growing via formal procurement channels. The DoD APFIT contract
              (May 2024, $10.2M via AFLCMC Hanscom) funds satellite manufacturing, while NOAA has
              extended its Commercial Weather Data Pilot contract multiple times, most recently in
              May 2025. The Carahsoft channel partnership broadens government reach without requiring
              direct federal contracting infrastructure at Tomorrow.io. International government
              growth is most visible in the Philippines (NIA partnership, June 2025) and Nigeria
              (NiMet DCAS rollout and co-design workshop, February 2026), with active expansion
              into oil and gas, maritime, construction, and insurance sectors in Nigeria.
