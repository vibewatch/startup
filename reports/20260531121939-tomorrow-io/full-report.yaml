      - number: '1.2'
        title: Founders, Leadership, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io was founded in 2016 by three veterans of elite Israeli Defense Forces intelligence
              units who met through shared professional networks in Israel. All three founders remain active
              executive officers as of the run date.

              Shimon Elkabetz (CEO and Co-Founder) is the public face and strategic lead of the company.
              He holds an economics degree from Ben Gurion University of the Negev and an MBA from Harvard
              Business School. Elkabetz drives the company's go-to-market strategy, investor relationships,
              and mission narrative. He is the key-person risk concentration for executive leadership; his
              departure or incapacitation would represent a material governance disruption.

              Rei Goffer (Co-Founder and Chief Strategy Officer) serves as the technical and product
              evangelist. Goffer is the most frequent media spokesperson for the satellite constellation
              program, has presented the SpaceNews DeepSky announcement, and is quoted extensively in coverage
              of the Series F and Gen1 completion. His background in IDF intelligence informs the company's
              intelligence-layer framing of weather data.

              Itai Zlotnik (Co-Founder and Chief Operating Officer) manages internal operations and execution.
              Zlotnik is less prominent in external media but is cited alongside Elkabetz and Goffer in most
              primary press releases and investor statements, including the HarbourVest Series F quote ("excited
              to partner with Shimon, Itai, Rei, and the team").

              The founding team has remained intact for nine years — a notable governance positive relative to
              high-attrition AI startup peer companies. No disclosed board composition or independent director
              roster is available from public sources. Goldman Sachs & Co. LLC served as exclusive financial
              advisor to Tomorrow.io in connection with the Series F financing. Goodwin Procter LLP served as
              legal counsel. These advisors signal institutional-quality governance processes surrounding
              capital events, but independent board governance details remain a diligence gap.

              Key-person concentration is moderately high: the co-founder trio operates with complementary
              functional coverage (strategy/CEO, product/CSO, operations/COO), which partially offsets individual
              departure risk, but the company has not publicly disclosed a succession plan or bench depth below
              the C-suite.
