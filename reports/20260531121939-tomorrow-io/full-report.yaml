        title: Pricing and GTM
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io's publicly accessible pricing page shows one free API tier with rate limits and no access to
              enterprise platform features; all commercial plans require contacting sales. No enterprise list pricing,
              per-seat pricing, or usage-based pricing is published, making benchmarking against industry peers such as
              The Weather Company (which lists $500/month for 1 million API calls) impossible. This pricing opacity is
              consistent with a high-ACV sales motion targeting enterprise procurement teams with multi-year contract
              terms and custom integrations — a pattern typical of vertical SaaS companies with average contract values
              above $50,000. The sales cycle is estimated to be three to nine months for enterprise accounts based on
              the complexity of weather workflow integration, though no official sales efficiency metrics have been
              disclosed. Tomorrow.io offers a free developer API tier as a top-of-funnel acquisition channel; the
              conversion mechanism from free to paid enterprise is not documented publicly and must be treated as an
              information gap. No disclosed sales efficiency metrics — customer acquisition cost, payback period, sales
              headcount, or quota attainment — are available. International revenue exists (Philippines government
              partnership for AI-powered agricultural weather forecasting) but is not quantified in any public source.
