      - number: '8.3'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              Public comps for Tomorrow.io sit primarily in the satellite data and space-based analytics segment, with
              some reference to commercial weather data incumbents. Spire Global (NYSE: SPIR), the closest public
              pure-play in satellite weather data, trades at approximately $846M enterprise value on last-twelve-month
              revenue of $75M, implying an EV/Revenue multiple of approximately 11×. Spire reported Q4 2025 GAAP revenue
              of $15.8M and full-year 2025 revenue of $71.6M; its 2026 guidance of $75–$85M implies 50%+ revenue growth
              from continuing operations after divesting its maritime business. BlackSky Technology (NYSE: BKSY)
              provides a higher-multiple benchmark: enterprise value of approximately $2 billion on LTM revenue of $119M
              implies an EV/Revenue multiple of ~17×. Planet Labs (NYSE: PL) trades at approximately 18.5× forward
              price-to-sales on FY2026 revenue of $308M, the highest multiple in the peer set and reflective of its
              scaled recurring government contract backlog exceeding $900M. These public comps establish a defensible
              range of 11–18× EV/Revenue for high-growth, government-contract-anchored satellite data companies. On the
              private side, the IBM Weather Company was sold to Francisco Partners in February 2024 at an estimated
              valuation above $1 billion — providing a relevant M&A comp for a scaled commercial weather data business.
              Tomorrow.io's $1B mark implies 10× on $100M ARR (the company-claimed figure), at the floor of the public
              comp range, or 41× on the GetLatka $24.4M figure, materially above the comp ceiling. A mid-case ARR of
              $60M would imply ~17×, which is at the high end of the public comp range but defensible if the DeepSky
              constellation enables a premium data-as-infrastructure multiple rather than a pure SaaS multiple.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV019
