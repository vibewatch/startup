  - id: FR002
    title: Risk Transmission Map — How Primary Risks Flow to Revenue and Valuation
    type: dag
    layout: wide
    summary: >-
      Shows how Tomorrow.io's upstream risk nodes (NOAA policy, SpaceX launch, capital markets) transmit through
      intermediate operational and product layers to downstream revenue, customer, and valuation impacts. Edges
      represent causal or enabling transmission paths.
    claimRefs:
      - CR006
      - CR007
      - CR013
      - CR018
      - CR019
      - CR021
      - CR033
    data:
      nodes:
        - id: r1
          label: DOGE / NOAA Budget Cuts
          detail: >-
            DOGE cuts fire up to 20% of NOAA workforce; suspend weather balloon launches; threaten NCEP facility;
            degrade public weather data baseline that Tomorrow.io models still partly consume
        - id: r2
          label: NWS Data Quality Degradation
          detail: >-
            Reduction in balloon launch frequency, NCEP model update cadence, and radar network coverage reduces the
            quality of NOAA public data inputs feeding Tomorrow.io's hybrid AI forecast models
        - id: r3
          label: Forecast Accuracy Impact
          detail: >-
            Degraded NWS inputs reduce Tomorrow.io forecast accuracy in NWS-dependent regions; R1 bias (-22%) amplifies
            this in early customers; platform trust erodes if customers experience missed alerts
        - id: r4
          label: Customer Churn / Non-Renewal Risk
          detail: >-
            Enterprise customers (aviation, logistics, government) experiencing forecast accuracy degradation or alert
            lateness may decline renewal or reduce contract scope; government procurement may shift to multi-vendor or
            alternative providers
        - id: r5
          label: NOAA Government Revenue Loss
          detail: >-
            Annual NOAA data contracts ($899K, $2.27M) are competitively renewed; SBEM IDIQ creates multi-vendor market
            structure; any procurement pause or elimination directly reduces government revenue
        - id: r6
          label: SpaceX Launch Risk / Delay
          detail: >-
            Falcon 9 anomaly or Starship delay pushes DeepSky launch manifest; Politico reports $8B in space investment
            at risk from Starship delays; DeepSky cannot achieve full global coverage by 2028 target on schedule
        - id: r7
          label: Revenue Shortfall / Burn Rate Pressure
          detail: >-
            Combined impact of customer churn, government revenue loss, and DeepSky delay increases cash burn against
            the $210M Series F runway; if revenue is below plan at 18-24 months post-close, Series G raise becomes
            urgent
        - id: r8
          label: Valuation Compression / Funding Risk
          detail: >-
            Revenue shortfall, delayed profitability, and competitive pressure from Spire and open-source models reduce
            the justification for a Series G at or above the ~$825M-$1B post-money valuation; down round or bridge
            financing risk increases
      edges:
        - source: r1
          target: r2
          label: Degrades public data inputs
        - source: r2
          target: r3
          label: Reduces AI model accuracy
        - source: r3
          target: r4
          label: Triggers enterprise non-renewal
        - source: r1
          target: r5
          label: NOAA procurement freeze or elimination
        - source: r6
          target: r3
          label: Delays DeepSky data density improvement
        - source: r4
          target: r7
          label: Reduces ARR and NRR
        - source: r5
          target: r7
          label: Reduces government revenue line
        - source: r7
          target: r8
          label: Triggers investor valuation reassessment
