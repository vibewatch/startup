      - number: '1.5'
        title: Milestone Timeline and Adverse Events
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io's nine-year history divides into four phases: (1) software-only weather intelligence
              startup (2016–2021), (2) rebrand and space strategy announcement (2021–2022), (3) satellite
              constellation build-out and first commercial launches (2023–2025), and (4) unicorn status,
              constellation completion, and DeepSky program (2026–present).

              The most significant adverse event in the company's history was the SPAC termination in March
              2022. Tomorrow.io and Pine Technology Acquisition Corp. had announced a merger in December 2021
              at a $1.2 billion valuation targeting 32 radar satellites, but withdrew due to poor market
              conditions for growth-stage technology companies and paid $1.5 million in termination fees. This
              episode delayed public market access by at least four years (the company remains private as of
              May 2026).

              A second category of adverse context emerged in March 2025 when Forbes published an article
              examining whether Tomorrow.io — and commercial weather companies broadly — could substitute
              for the National Weather Service following DOGE-orchestrated cuts to NOAA that fired up to 20%
              of NOAA staff. The article concluded: "There simply isn't any private company that can provide
              weather data at the scale of NWS." Elkabetz himself stated: "I don't want anyone reading this
              article to think that companies like Tomorrow.io are here to take business from NOAA." This
              coverage highlights both a reputational and regulatory dependency risk: Tomorrow.io's platform
              incorporates government weather data (NOAA, NWS) as inputs, and degradation of public data
              infrastructure would constrain the company's own forecasting quality even as it creates demand.

              On the positive side, the constellation build-out has proceeded on plan: 13 satellites launched
              between April 2023 and January 2026, achieving the 60-minute global revisit milestone without
              reported on-orbit failures. The Series F at unicorn valuation, combined with the $35 million
              Series F extension in May 2026, demonstrates continued investor confidence and validates the
              commercial satellite weather data market thesis.

              TIME named Tomorrow.io one of the 100 Most Influential Companies in 2024. Fast Company ranked
              Tomorrow.io the #1 Most Innovative Logistics Company in 2024 and the #1 Most Innovative Space
              Company in both 2025 and 2026. The company was also named to TIME's America's Top GreenTech
              Companies 2026 list.
