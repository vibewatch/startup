  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io's revenue architecture rests on two disclosed streams: commercial enterprise SaaS and direct
              US government contracts. The commercial segment sells weather intelligence as an API, platform
              subscription, and alerting service to enterprises across aviation, insurance, energy, logistics, and
              construction. No publicly available breakdown of commercial ARR by vertical, customer count, or contract
              size exists. The government segment is better-documented by virtue of public contract awards: Tomorrow.io
              has received disclosed government contract value of approximately $33–35 million across NOAA and the US
              Air Force's AFLCMC/HN (APFIT program) through May 2026. A third nascent stream — space infrastructure data
              from the DeepSky constellation — has been announced but carries no disclosed pricing or contracted revenue
              as of the research date. Potential additional streams such as data licensing to third parties,
              professional services, and international government partnerships are referenced in public sources but
              without financial quantification. The 4× discrepancy between the company-claimed $100M ARR (cited in
              Series F marketing materials, February 2026) and GetLatka's CEO-verified figure of $24.4M (2025) is the
              single most material unresolved financial risk in this chapter and prevents reliable revenue-multiple
              valuation without audited financials.
