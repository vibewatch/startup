  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Financing Overhang
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io closed its Series F in two tranches totaling $210 million: a $175 million lead round in
              February 2026 anchored by Stonecourt Capital and HarbourVest Partners, followed by a $35 million extension
              in May 2026 from Pitango Venture Capital and Harel Insurance. Forge Global's secondary market platform
              records the resulting post-money valuation at $1.04 billion as of May 2026, placing Tomorrow.io firmly in
              unicorn territory. Total capital raised since inception is approximately $498–535 million across all
              rounds from seed (2016) through Series F. The $210 million Series F is one of the largest single-round
              financings in commercial weather intelligence to date. Disclosed use of proceeds is DeepSky satellite
              constellation manufacturing, launch, and operations — a capital-intensive program with multi-year
              execution risk and no firm all-in cost cap publicly stated. Preference stack details are not disclosed
              publicly; no 409A or independent third-party valuation has been cited alongside the $1 billion figure,
              meaning common-stock and option-pool discounts from the headline post-money number remain unknown. At
              $210M raised against a $1.04B post-money, the implied pre-money was approximately $830M and the Series F
              represented approximately 20% dilution in aggregate, though actual dilution depends on terms such as
              liquidation preferences, anti-dilution provisions, and option-pool refresh. Forge's secondary market shows
              limited market activity and no matched prices as of May 2026, indicating limited private secondary
              liquidity for existing shareholders. The combination of a large financing overhang, undisclosed preference
              mechanics, and a capital-intensive satellite program creates meaningful dilution risk for any new investor
              entering at or near the current mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
              - CV018
              - CV026
          - type: table
            tableRef: TV001
            claimRefs: []
      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Tomorrow.io rests on three pillars. First, proprietary data asset: Tomorrow.io
              has deployed an operational microwave sounder constellation validated by NOAA for commercial weather data
              program use — a technically differentiated asset that requires years and hundreds of millions of dollars
              to replicate. This creates a defensible moat that pure-software weather companies cannot easily match.
              Second, market structure: commercial weather intelligence is an underpenetrated and expanding category
              estimated at $3–5 billion in addressable spend, growing as climate volatility increases demand from
              aviation, insurance, energy, logistics, and government sectors. No other private company has executed both
              satellite constellation deployment and an enterprise SaaS platform at comparable scale. Third, revenue
              quality signal: NOAA's extension of its commercial weather data pilot contract through the 2025 hurricane
              season and the subsequent January 2026 radar validation contract represent independent technical
              validation with milestone-gated revenue — a higher-quality revenue signal than commercial SaaS alone. The
              anti-thesis is equally material. The 4× ARR discrepancy between company-claimed $100M and
              GetLatka-verified $24.4M means the valuation is effectively unanchored: at $24M ARR the implied multiple
              of ~41× exceeds every public comparable and implies a speculative premium that cannot be justified on
              current financials. Gross margin by segment is undisclosed, meaning the blended margin impact of
              capital-intensive satellite operations on the software-like SaaS margin is unknown. The failed 2022 SPAC
              at $1.2B suggests the company has already attempted one exit mechanism that did not succeed, and the
              current $1B private mark is only marginally below that failed public valuation. NOAA budget concentration
              and Trump-era proposed 17% NOAA funding cuts add a government revenue risk that could directly impair the
              highest-quality revenue stream.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV030
              - CV031
          - type: table
            tableRef: TV002
            claimRefs: []
          - type: figure
            figureRef: FV001
            claimRefs:
