            BlackSky 17×, Planet Labs 18.5× P/S
        - id: n6
          label: Conditional Interest — Watch
          description: >-
            Actionable only with data room confirmation of audited ARR ≥$80M, gross margin ≥55%, runway ≥24 months, and
            preference waterfall review
