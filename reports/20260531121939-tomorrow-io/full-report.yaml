  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Vertical Mix
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io serves customers across seven distinct verticals: aviation, logistics
              and supply chain, energy, insurance, agriculture, sports and entertainment, and
              government and defense. The company claims more than 250 enterprise and government
              organizations and separately reports over 30,000 developers accessing the Weather
              API through its free and paid tiers. Six of the top ten Fortune 500 companies are
              described as customers, though the specific identities of all six are not confirmed
              in public disclosures; named Fortune 500 references include JetBlue (NYSE-listed but
              outside Fortune 500), Lufthansa, Delta, United, Uber, Ford, BNSF Railway, and Amazon,
              alongside Fox Sports and the New England Patriots.

              Geographically, the customer base is anchored in North America but spans Europe
              (Lufthansa, Azul in South America), the Philippines (National Irrigation Administration
              partnership, June 2025), Nigeria (NiMet/Federal Ministry of Agriculture partnership,
              February 2026), and the Bahamas (disaster preparedness). Government and institutional
              customers in the United States include NOAA, NASA, and the U.S. Air Force, which fund
              Tomorrow.io through both data purchase contracts and satellite development programs.
              Carahsoft Technology Corporation acts as a reseller for US government procurement,
              enabling access through GSA Schedule, GovWin, and related contract vehicles.

              The developer segment — primarily through the Weather API — operates on a freemium
              model with a free tier and paid plans, generating high-volume usage with lower per-unit
              revenue. Enterprise customers (aviation, logistics, government) generate the bulk of
              recurring revenue through multi-year subscription and services contracts. The agriculture
              vertical is an emerging segment reached primarily through government partnerships and
              agri-tech intermediaries such as Agrilever in the Philippines.
