      - number: '1.3'
        title: Capital Base, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io has raised approximately $535 million in total capital across seven distinct rounds
              spanning 2017 to May 2026, making it the most heavily capitalized private weather technology
              company in the world, according to satellite industry analyst Chris Quilty (Forbes, 2025).

              The funding history began with a Seed round in approximately 2017 and a Series A of $15 million
              led by Canaan Partners in November 2017. The company raised a Series B of approximately $45 million
              in October 2018 and a Series C of approximately $23 million in July 2020. The pivotal Series D
              of $77 million in March 2021 was concurrent with the ClimaCell-to-Tomorrow.io rebrand; Stonecourt
              Capital was among the investors in that round. A Series E of $87 million closed in June 2023,
              led by Activate Capital, with participation from RTX Ventures, Seraphim Space, and Chemonics;
              existing investors SquarePeg Capital, Canaan, ClearVision, JetBlue Ventures, and Pitango also
              participated.

              The landmark Series F closed February 3, 2026 at $175 million, led by Stonecourt Capital and
              HarbourVest Partners, establishing a post-money valuation above $1 billion — formally conferring
              unicorn status. Forge Global identified Tomorrow.io as a Q1 2026 new unicorn, with share price
              at $5.45 as of the Series F close date. Wikipedia's editorial record, citing Calcalist, confirms
              total funding reached approximately $508 million at the February 2026 close, and ARR was
              approximately $100 million at announcement. In May 2026, the Series F was extended by $35 million
              from Pitango alongside Harel Group, HarbourVest, and Stonecourt, bringing the round to $210 million
              and total raised to approximately $535 million (per Calcalist May 2026 reporting).

              An adverse financing event occurred in December 2021 when Tomorrow.io announced a SPAC merger
              with Pine Technology Acquisition Corp. at a $1.2 billion valuation. The deal was terminated in
              March 2022 due to poor market conditions for growth-stage public listings; Tomorrow.io paid
              $1.5 million in termination fees. This episode confirms management's willingness to pursue
              liquidity when conditions warrant and to withdraw when conditions do not.

              No secondary transactions, debt facilities, or revenue-based financing have been publicly disclosed.
              Goldman Sachs served as exclusive financial advisor for the Series F.
