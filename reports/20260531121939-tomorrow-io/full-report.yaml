  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Module Map
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io's product portfolio spans three tiers that share a common data backbone
              derived from its proprietary satellite constellation and AI-driven modeling stack.
              The first tier is the Weather API — a REST/JSON interface offering 60+ data layers
              including precipitation, temperature, wind, air quality, pollen, solar irradiance,
              lightning, soil moisture, road conditions, fire risk index, and flood risk for any
              location globally. The API supports a free developer tier with rate-limited access
              to core endpoints, plus enterprise plans customized via direct sales with SAML-based
              SSO, custom SLAs, and on-demand rate per second scaling. The platform is available
              on both the AWS Marketplace and Microsoft Azure Marketplace as a cloud-native SaaS
              product, enabling enterprise procurement through existing cloud billing relationships.

              The second tier is the enterprise Weather Intelligence Platform — a no-code dashboard
              and workflow layer that adds monitored locations, rule-based alerting across point,
              polygon, and polyline geographies, insights automation, and weather event tracking.
              The third tier comprises industry-specific intelligence suites: Altitude for aviation,
              dedicated agriculture workflows, logistics route monitoring, and government/defense
              integrations. Customers include six of the top ten Fortune 500 companies. All three
              tiers are fed by the same proprietary atmospheric data layer, creating a coherent
              data-to-decision value chain that distinguishes Tomorrow.io from pure data resellers.
