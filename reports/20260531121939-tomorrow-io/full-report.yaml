      - number: '1.4'
        title: Products, Technology, and Customer Base
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io's core commercial product is the Weather Intelligence Platform — an enterprise
              SaaS offering providing real-time, historical, and predictive weather data through a web
              dashboard, API, and automated alerts. The platform translates raw atmospheric data into
              impact-based action recommendations tailored to specific industries: for airlines, it recommends
              flight diversions or deicing preparation; for railway operators, speed restrictions at specific
              mile markers under crosswind risk; for insurance carriers, preemptive policyholder alerts
              before hail events. The company markets the platform under product names including Altitude™
              (aviation-specific) and described the product strategy as increasingly "agentic" — AI agents
              embedded into customer operational systems.

              The satellite constellation forms the upstream data moat. Tomorrow.io launched its first radar
              satellite (Tomorrow-R1) on April 15, 2023 on SpaceX Transporter-7, becoming the first
              commercially built weather radar satellite to orbit. A second radar satellite (R2) followed on
              June 12, 2023 on Transporter-8. Microwave sounder satellites S1 and S2 (6U CubeSats) launched
              in August 2024 on SpaceX Transporter-11. By January 12, 2026, the company announced completion
              of its first constellation (13 satellites) achieving 60-minute global revisit rate — a cadence
              historically requiring national space programs.

              NOAA independently validated the constellation in January 2026, finding that Tomorrow.io's
              Microwave Sounder (TMS) instruments produce "well-calibrated data, generally comparable to ATMS,"
              NOAA's flagship Advanced Technology Microwave Sounder. Tomorrow.io also holds a vendor position in
              NASA's Commercial Satellite Data Acquisition (CSDA) program and has received approximately
              $30 million in DoD contracts, including a $10.2 million AFLCMC/APFIT contract awarded July 2024
              to build two microwave sounder satellites for the U.S. Air Force Weather Systems Branch.

              On January 20, 2026, Tomorrow.io announced DeepSky — its next-generation constellation described
              as the "world's first AI-native, space-based atmospheric and oceanic sensing network." DeepSky
              will feature larger satellites (nearer to car-sized versus current shoebox-to-minifridge models),
              multi-modal sensors spanning much of the electromagnetic spectrum, and dramatically higher revisit
              rates. In March 2025, Tomorrow.io announced a technical collaboration with NVIDIA centered on the
              Earth-2 platform for AI-accelerated weather and climate modeling. A Palantir partnership announced
              in mid-2025 integrates Tomorrow.io's satellite intelligence into Palantir's FedRAMP and IL-accredited
              environments for defense, government, and enterprise use. Lufthansa deployed Tomorrow.io's Altitude™
              product across its network in March 2026. The FIA (Fédération Internationale de l'Automobile)
              announced an official motorsport weather safety partnership in February 2026.

              Customer verticals include aviation, logistics, energy, insurance, agriculture, sports, and
              government. Named enterprise clients include JetBlue Airways, Delta Air Lines, United Airlines,
              Uber, Ford Motor Company, BNSF Railway, Amazon, Fox Sports, and the New England Patriots.
              Government clients include the U.S. Department of Defense, U.S. Air Force, and municipal
              governments including Hoboken, NJ. The company also partners with NiMet (Nigeria) and the
              Philippine National Irrigation Administration to deliver agricultural weather intelligence
              to farmers in the developing world.
