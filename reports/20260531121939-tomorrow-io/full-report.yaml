        - Company general counsel and CFO; standard data room item for late-stage diligence
      - - DeepSky Capex Schedule and Government Contract Pipeline
        - >-
          All-in cost to deploy full DeepSky constellation; current manufacturing status; identified government contract
          pipeline (NOAA, DoD, international) for constellation data
        - >-
          If constellation cost exceeds $300M total and additional equity raises are required, serial dilution will
          erode Series F entry returns even at bull-case exit
        - Company business development and technical team; cross-reference DoD and NOAA procurement records
