            body: |
              Tomorrow.io's customer-facing ROI claims are best documented for aviation. JetBlue's
              VP of System Operations attributed "$300,000 every month, 3.7 million in a year" in
              savings to the platform, with de-icing optimization estimated at $50,000 per hub per
              month during volatile-weather months. SimpleFlying's independent coverage (December
              2023) cited JetBlue's $4M annual savings estimate and confirmed the Boston snowstorm
              case study in which Tomorrow.io's forecast diverged from all major meteorological
              services, enabling JetBlue to keep flights on schedule while competitors sat grounded.
              Tomorrow.io has separately claimed one unnamed airline saved $2 million during a single
              weather event.

              Lufthansa's outcome framing is architectural rather than quantified: Dirk Dewald
              emphasized eliminating manual globe-scanning and unifying weather operations under
              a single global standard, with downstream benefits across fuel, crew scheduling,
              passenger compensation, and network performance. The agriculture vertical claims
              include 20% less crop loss due to unexpected freezes or hail and $41 saved per acre
              in wasted irrigation costs, as stated on the Tomorrow.io agriculture product page.
              In the Philippines, the agriculture initiative addresses an addressable loss of
              PHP 57.78 billion ($1.04 billion) in annual agricultural damage from weather disturbances
              affecting 1.4 million farmers and fishers.

              Government and defense outcomes are documented through validation reports: the JCSDA
              evaluation found "overwhelming positive impact" on temperature, water vapor, and wind
              forecast accuracy from TMS satellite data assimilation. NOAA's mid-term evaluation
              described TMS data as "well-calibrated, generally comparable to ATMS." For Uber,
              Nick Johnson (Maps & Technology Partnerships) stated the platform enables "more accurate
              ETAs based on insights from their on-demand forecasts." For Ford, Adam LeClercq
