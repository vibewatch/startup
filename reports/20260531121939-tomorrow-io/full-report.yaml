      - number: '4.5'
        title: Cost Structure and Verdict
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io's cost structure is not publicly disclosed, but its revenue model has two distinct cost
              layers. The software-first layer — cloud infrastructure, model compute, platform operations, and sales and
              marketing for the SaaS business — carries typical SaaS COGS of 20–40%. The satellite layer —
              manufacturing, launch, ground operations, and in-orbit maintenance for the DeepSky constellation — adds
              significant capital expenditure and operating cost that compresses blended gross margins well below SaaS
              benchmarks. The GetLatka-reported $24.4 million ARR, if accurate, implies an ARR multiple of approximately
              40× on the $1 billion post-money valuation, which is at the high end for capital-intensive
              hardware/software hybrid companies. The company's financial verdict for underwriting purposes carries
              three key blockers: first, the unresolved 4× ARR discrepancy requires audited financial data before any
              revenue multiple can be applied; second, gross margin by segment (software versus satellite) is
              unavailable, preventing margin-path modeling; third, burn rate and runway are undisclosed, making capital
              adequacy assessment dependent on assumptions. Revenue quality is above average for the government segment
              (milestone-gated, NOAA-validated) and uncertain for the commercial segment given the ARR conflict.
              Investor base breadth (Stonecourt, HarbourVest, Pitango, Harel) and unicorn status are positive capital
              signals, but financing dependency on continued equity rounds creates dilution risk for common
              shareholders.
