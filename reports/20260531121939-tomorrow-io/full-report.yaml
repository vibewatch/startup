      - number: '5.6'
        title: Roadmap, Technical Dependencies, and Technology Risks
        blocks:
          - type: paragraph
            body: |
              DeepSky is Tomorrow.io's next-generation constellation announced January 2026, targeting
              100+ satellites with multi-modal sensing across the full electromagnetic spectrum including
              new sensor types historically limited to one-off science missions. The constellation is
              designed to provide sub-hourly global revisit rates, AI-native data streams that continuously
              improve forecasting models with each orbital pass, and sensing capabilities that the company
              describes as exceeding the baseline observational requirements of major government and
              international customers. Development is underway with phased deployment planned; no launch
              schedule or satellite count milestones were publicly disclosed as of May 2026.

              Primary technology risks include: (1) launch dependency on SpaceX Transporter rideshare
              vehicles, which is the established but single-provider path for constellation expansion;
              (2) government data quality programs (NOAA CWDP, NASA CSDA) remain the primary independent
              validation channel, creating dependency on continued program funding and relevance; (3) data
              assimilation framework integration with NWP systems (JEDI-MPAS, UFS) remains in evaluation
              phase, not yet in operational production at NOAA; (4) FedRAMP accreditation status for
              direct commercial enterprise is not publicly disclosed; (5) as noted by Forbes in March 2025,
              nearly all commercial weather companies — including Tomorrow.io — still rely partly on
              NOAA/NWS public data to power forecasting models, creating a dependency on continued
              government data provision even as proprietary satellite data expands.
            claimRefs:
