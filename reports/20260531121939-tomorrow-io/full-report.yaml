            body: >-
              Tomorrow.io has raised approximately $535 million in equity across five or more identifiable rounds from
              seed (2016) through Series F (2026), with no publicly disclosed debt financing. The Series F closed in two
              tranches: a $175 million lead round in February 2026 anchored by Stonecourt Capital and HarbourVest
              Partners at a post-money valuation exceeding $1 billion, followed by a $35 million extension in May 2026
              from Pitango Venture Capital and Harel Insurance. Combined, the $210 million Series F is one of the
              largest single-round financings in commercial weather intelligence and places Tomorrow.io firmly in
              unicorn territory. The stated use of proceeds is DeepSky satellite constellation manufacturing, launch,
              and operations — a capital-intensive program with multi-year execution risk. No information on cash
              position, monthly burn, or runway is publicly available; estimated runway post-raise is 18–36 months
              depending on undisclosed burn rate. The company attempted to go public via SPAC in 2021–2022 but
              terminated the merger with Pine Technology Acquisition Corp in March 2022, paying a $1.5 million
              termination fee. The SPAC termination and subsequent reliance on private equity through 2026 indicates the
              company was not yet public-market-ready by its own assessment; the subsequent four years of private growth
