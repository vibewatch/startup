      - number: '3.2'
        title: Direct Platform Peers — The Weather Company, DTN, and Climavision
        blocks:
          - type: paragraph
            body: >-
              The Weather Company (TWC), now under Francisco Partners private equity ownership following its 2024
              acquisition from IBM, is the largest commercial weather intelligence provider by estimated scale. TWC
              claims 415 million monthly users across consumer properties (Weather Channel app, Weather Underground,
              Storm Radar) and a substantial enterprise data business serving 10,000+ enterprise customers globally,
              with thousands of daily commercial flights relying on its aviation products. Its API pricing is publicly
              listed at $500/month for the Standard Annual Plan (1 million API calls/month), with enterprise pricing
              customized for major airlines and large-volume users. TWC's competitive advantages include the deepest
              observational data asset base (270,000+ personal weather stations, 200,000+ aircraft observations) and
              distribution via IBM Watsonx integrations retained after the sale. Its primary weakness post-acquisition
              is investment uncertainty: private equity ownership typically implies a shorter time horizon and may
              constrain R&D spending, creating an opening for Tomorrow.io to outpace TWC on AI model innovation. TWC
              does not operate a proprietary satellite constellation and relies on third-party data providers for
              microwave sounder observations.


              DTN, a private global data and technology company, is the dominant vendor in agriculture, energy, and
              utilities through its Weather Hub decisioning platform, WeatherSentry, and ProphetX product lines. DTN has
              integrated NVIDIA Earth-2 on AWS for AI-driven cyclone tracking, a capability deployed to production in
              June 2025, giving it credible AI differentiation in near-term operational forecasting. DTN's competitive
              strength derives from deep vertical integration — its meteorologist-backed, sector-tuned forecast system
              and its position as a trusted data steward for utility grid operators and agricultural commodity traders.
              DTN pricing is not publicly disclosed; enterprise contracts are bespoke and multi-year. DTN does not own
              satellite assets and sources upstream observational data from government and commercial providers
              including, in some configurations, Spire Global. DTN's weakness relative to Tomorrow.io is the absence of
              an owned satellite constellation and a platform that skews toward data delivery rather than agentic
              automation.


              Climavision, a Louisville-based weather technology company with approximately $100 million raised
              including backing from TPG's The Rise Fund, occupies a differentiated niche: a private radar network
              filling 15-state coverage gaps left by NOAA's NEXRAD system. Climavision's Horizon AI and Horizon AI HIRES
              models combine NWP and generative AI and deliver hyper-local forecasts and severe weather alerts for
              energy traders, utilities, and grid operators via subscription API and custom forecast contracts.
              CenterPoint Energy and Enverus are disclosed customers. Climavision processes 1.5 billion+ datasets daily
              and has integrated with National Weather Service software tools as of January 2026. It is largely
              complementary to Tomorrow.io today, with minimal vertical overlap outside utilities. The risk is
              horizontal expansion: if Climavision adds aviation, insurance, or government verticals backed by its radar
              observation advantage, it would become a more direct rival.
