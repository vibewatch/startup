    title: Investment KPIs — IC-Ready Scoring Across Key Dimensions
    type: kpi
    summary: >-
      Scoring across eight investment committee dimensions for Tomorrow.io as of May 2026, based on public evidence
      only. Items marked Low confidence carry wide uncertainty bands. A green signal requires data room confirmation
      before execution.
    data:
      items:
        - label: Market Opportunity
          value: High (4/5)
          note: >-
            $3–5B+ addressable commercial weather intelligence; climate risk expanding demand; structural tailwind
            confirmed
        - label: Technical / Product Moat
          value: Strong (4/5)
          note: >-
            NOAA-validated operational constellation; dual hardware-plus-software moat; no direct private-market
            replicant identified
        - label: Revenue Quality
          value: Mixed (3/5)
          note: >-
            Government contracts are high-quality (milestone-gated, technically validated); commercial SaaS ARR is
            disputed and unaudited
        - label: Financial Transparency
          value: Poor (1/5)
          note: >-
            4× ARR discrepancy; no gross margin, burn rate, or preference waterfall disclosed; blocking for any
            investment decision
        - label: Valuation vs Comps
          value: Conditional (2/5)
          note: >-
            Defensible at 10× if $100M ARR confirmed; indefensible at 41× if $24M ARR confirmed; uncertainty range too
            wide to score definitively
        - label: Exit Readiness
          value: Low (2/5)
          note: No IPO timeline; SPAC failed at $1.2B in 2022; secondary market inactive; M&A path viable but speculative
        - label: Risk Profile
          value: High Risk (2/5)
          note: >-
            Satellite execution risk; NOAA funding concentration; serial dilution from DeepSky capex; ARR opacity; SPAC
            failure precedent
        - label: Investor Quality
          value: Good (4/5)
          note: >-
            HarbourVest, Stonecourt, Pitango, Harel — institutional quality; Pitango insider re-investment signals
            conviction; no disclosed anchor LP concerns
    approximationNotes: >-
      Scores are qualitative assessments based on public evidence as of May 2026. No audited financial data, cap table,
      or data room materials were available. Score improvement is conditional on data room access. Overall signal: do
      not invest without data room.
