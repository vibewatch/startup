      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Three scenarios bracket the valuation and return space. The bull case assumes Tomorrow.io's ARR reaches
              $150M by fiscal year 2028, with DeepSky delivering operational data in 2027 as planned, government
              contracts expanding under normalized NOAA funding, and the company achieving gross margins above 60% on
              the blended SaaS-plus-data business. In this scenario, a 15–20× ARR exit multiple is achievable, yielding
              an exit valuation of $2.25–3.0 billion and a 2–3× return for Series F investors over a 3–4 year hold. The
              base case assumes ARR lands in the $60–80M range by 2028, representing a reconciliation between the
              company-claimed $100M and the GetLatka $24.4M, with 30–40% annual growth, some DeepSky delay risk, and
              stable government contracts. A 10–12× ARR multiple implies an exit valuation of $600M–960M — below the
              current $1B mark and representing a loss-of-principal scenario for late-stage investors. This makes the
              base case return-negative at the current entry price without substantial multiple re-rating. The bear case
              assumes the ARR discrepancy resolves to the lower end ($24–35M), DeepSky faces significant launch delays
              or cost overruns requiring an additional capital raise at a flat or down-round valuation, NOAA budget cuts
              materialize, and public market comps compress to 8–10× EV/Revenue by 2028 as interest rates remain
              elevated. Exit valuation in this scenario is $400–600M, implying a 40–60% capital loss from the $1B entry.
              Probability-weighted across bull (20%), base (50%), and bear (30%), the expected exit value is
              approximately $950M–$1.2B, implying flat-to-modest returns at the current $1B mark for a Series F investor
              — insufficient for most institutional late-stage return thresholds without data room confirmation of the
              $100M ARR narrative.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
          - type: table
            tableRef: TV003
            claimRefs: []
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV035
      - number: '8.5'
        title: Exit Readiness and Return Profile
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io has no announced IPO timeline or public S-1 filing as of May 2026. The company's most recent
              public exit attempt — a December 2021 SPAC merger with Pine Technology Acquisition Corp at a $1.2B
              valuation — was terminated in March 2022 after citing poor market conditions. Peer space SPACs (Virgin
              Orbit, Terran Orbital) saw redemption rates exceeding 80%, and industry analysis (Quilty Space, 2024)
              concluded Tomorrow.io was fortunate to avoid this outcome. The current $1B private mark is only $200M
              below the abandoned $1.2B SPAC valuation, compressing the potential appreciation from any IPO path unless
              the company achieves material revenue growth before listing. Forge Global lists market activity as limited
              with no matched secondary transactions, meaning early investors cannot easily access partial liquidity.
              Acquisition by a strategic buyer — major cloud providers (AWS, Google, Microsoft), defense primes, or
              PE-backed weather data consolidators — represents the most probable near-term exit for existing investors.
              The Francisco Partners acquisition of IBM Weather Company at >$1B establishes a reasonable M&A comp for a
              scaled commercial weather data business, though Tomorrow.io's constellation infrastructure adds both
              optionality and execution risk relative to that comp. A 3× return for a Series F investor at $1B entry
              requires a $3B exit valuation, which is achievable only in the bull case and implies a 2028–2030 timeline.
              At the base case exit of $600M–$960M, Series F investors would face a markdown. Pitango's re-investment as
              an existing insider in the May 2026 extension is a positive conviction signal, but cannot substitute for
              audited financials in a diligence context.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV027
              - CV028
              - CV029
              - CV035
          - type: table
            tableRef: TV005
            claimRefs: []
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.6'
        title: Recommendation and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The overall investment recommendation for new capital entering at the $1B Series F mark is Conditional
              Interest — Watch. The evidence supports a company with a genuinely differentiated technical asset,
              institutional-quality investors, NOAA-validated operational data, and a large if unproven addressable
              market. These are thesis-affirming signals. However, three blocking diligence gaps prevent a constructive
              rating: (1) the 4× ARR discrepancy — the single most important metric for any revenue-multiple valuation —
              is unresolved and material; (2) gross margin by segment is unknown, meaning the drag from satellite
              capital-intensive operations on SaaS-like economics cannot be modeled; (3) burn rate and runway
              post-Series F are undisclosed, making capital adequacy and dilution timeline assessment impossible. An
              investor committing at $1B without these data points is effectively investing in a narrative rather than a
              model. If the data room confirms $100M ARR with audited support, 60%+ blended gross margin, 24+ months
              runway at current burn, and manageable preference waterfall, the investment becomes actionable at a
              cautious constructive rating with a 10–12× ARR exit multiple target of $1.5–2.0B. If audited ARR lands
              below $40M, the entry price is indefensible against the public comp set and a hard pass is warranted. The
              recommendation therefore hinges entirely on data room access and financial audit. Risk rating is High
              regardless of scenario, driven by satellite execution risk, ARR opacity, government concentration, SPAC
              failure history, and the dilutive capital requirements of DeepSky. Confidence in the current
              recommendation is Medium — sufficient evidence exists to form a view but not to execute without additional
              diligence.
            claimRefs:
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV006
            claimRefs: []
