summary:
  headline: >-
    Tomorrow.io 拥有 NOAA 验证的差异化卫星技术护城河，也拿到机构投资人认可并站上独角兽规模；但 4× ARR 差异未解释、毛利率未披露，加上资本密集的 DeepSky 计划，在 data room 确认前无法证明以
    $1B 投入合理。
