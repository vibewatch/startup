    type: matrix
    layout: wide
    summary: >-
      Positions Tomorrow.io's eight primary risk categories across a likelihood–impact
      grid with residual exposure after mitigations. High-impact, high-likelihood risks
      (top-right) represent investment-grade concerns requiring active monitoring;
      low-likelihood, low-impact risks (bottom-left) are watch-list items.
    claimRefs:
      - CR001
      - CR006
      - CR013
      - CR018
      - CR023
      - CR028
      - CR033
      - CR036
    data:
      columns:
        - Likelihood (H/M/L)
        - Impact Before Mitigation
        - Mitigation Maturity
        - Residual Exposure
        - Thesis-Break Potential
      rows:
        - label: Government Policy and NOAA Dependency
          values:
            - High
            - Critical
            - Low
            - High — DOGE cuts active; SBEM IDIQ compresses pricing
            - "Yes — NOAA procurement freeze eliminates revenue and degrades data inputs"
        - label: Capital Intensity and Financial Risk
          values:
            - Medium
            - High
            - Medium
            - Medium-High — DeepSky requires continued capital through 2028
            - "Conditional — if equity markets tighten before profitability"
        - label: Partner / Infrastructure Dependency
