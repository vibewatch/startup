    columns:
      - Risk Category
      - Mitigation in Place
      - Kill Criterion (thesis-break threshold)
      - Monitoring Signal
    rows:
      - - Government policy / NOAA dependency
        - Multi-contract diversification (Air Force, NASA, international), Palantir
          channel for federal market, DeepSky proprietary data reducing NOAA
          supplemental input share over time
        - NOAA eliminates the Commercial Weather Data Pilot program OR Congress blocks
          all commercial weather data procurement for one full fiscal year
        - NOAA budget appropriation status (annual); SBEM IDIQ award list; DOGE
          announcement of NOAA program eliminations
      - - Capital intensity / financial risk
        - $210M Series F raised in 2026; Goldman Sachs as financial advisor; 40+
          institutional investor base reduces single-investor dependency
        - Inability to raise Series G at ≥$750M valuation within 24 months of Series F
          close, or confirmed cash runway below 6 months with no signed term sheet
        - Monthly burn rate vs. cash position; Series G timeline vs. DeepSky capex
          schedule; public market comparables for space-weather companies
      - - SpaceX / launch dependency
        - Falcon 9 is operationally proven with ~160 launches/year in 2026; rideshare
          market provides some optionality
        - Falcon 9 grounding for >6 months concurrent with DeepSky launch window, OR
          SpaceX terminates commercial rideshare program
        - SpaceX launch cadence and anomaly disclosures; rideshare manifest bookings;
          Starship operational readiness milestones
      - - Palantir FedStart / federal access
        - Palantir has deep, long-term government standing; FedRAMP accreditation is
          continuously maintained; FedStart is a commercial SaaS offering
        - Palantir loses FedRAMP authorization or is excluded from federal procurement
          OR Palantir terminates the FedStart commercial agreement with Tomorrow.io
        - Palantir FedRAMP status on marketplace.fedramp.gov; Palantir Q-earnings
          government segment revenue; FedStart customer list updates
      - - Forecast accuracy / trust
        - R2 radar at -6% bias approved by NASA for scientific use; NOAA operational
          validation of microwave sounder data in AWIPS2; DeepSky will replace R1
          data share as constellation scales
        - Three or more named enterprise customers publicly cite forecast inaccuracy
          as cause for contract non-renewal, OR regulator issues adverse finding on
          AI decision system accuracy in aviation or defense use case
        - Customer churn announcements; NTSB or FAA investigation involving
          Tomorrow.io weather data; competitive benchmark publications showing
          systematic accuracy shortfall vs. NWS or IBM TWC

