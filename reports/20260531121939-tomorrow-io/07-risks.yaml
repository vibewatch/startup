            - Low-Medium
            - High — no backup launch provider; NOAA triple dependency unmitigated
            - "Conditional — SpaceX or NOAA simultaneous failure is thesis-breaking"
        - label: Forecast Accuracy and Product Trust
          values:
            - Medium
            - Medium
            - Medium
