    - gap: >-
        No public documentation of ITAR export control authorizations, FCC spectrum
        licenses, or ITU frequency coordination filings for Tomorrow.io's Ka-band radar
        and microwave sounder satellite payloads has been found; these are material
        regulatory compliance gaps for a company operating a commercial remote sensing
        constellation with potential dual-use implications.
      dimension: regulatory compliance
      severity: high
      relatedQuestionRefs: [QR017]
      relatedTableRefs: [TR001]
      diligenceAsk: >-
        Request ITAR classification determinations for satellite payloads, any export
        license applications, FCC license numbers, and ITU filing documentation for the
        full constellation frequency bands.

    - gap: >-
        No pending or historical litigation, IP disputes, or regulatory enforcement
        actions involving Tomorrow.io or ClimaCell have been confirmed; the absence
        of public disclosure is expected for a private company but does not constitute
        a clean bill of health.
      dimension: legal
      severity: medium
      relatedQuestionRefs: [QR022]
      diligenceAsk: >-
        Request a litigation summary from legal counsel, IP freedom-to-operate opinion
        for the core AI weather modeling stack, and any regulatory correspondence with
        the FAA, FCC, DoS, or CISA.

    - gap: >-
