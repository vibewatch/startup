  - id: TU005
    title: Expansion and Concentration Risk
    notes: >-
      Risk assessments are inferred from public disclosures, news coverage, and government
      contract databases as of May 2026. Revenue percentages are not publicly disclosed;
      risk ratings are qualitative.
    claimRefs: [CU004, CU016, CU017, CU018, CU019, CU029, CU032]
    columns:
