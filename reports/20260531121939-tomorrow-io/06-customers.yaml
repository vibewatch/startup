        - Medium — alternative channels exist but would require rebuilding contracting relationships
        - Understand Carahsoft contract vehicle terms, renewal timeline, and exclusivity
      - - Aviation customer concentration
        - JetBlue and Lufthansa are the two best-documented customers; loss of either would reduce both revenue and reference quality
        - Aviation vertical
        - Medium — JetBlue EWINS is a sole-source contract; replacement risk exists if contract not renewed
        - Confirm JetBlue and Lufthansa contract terms, renewal dates, and NPS
      - - International government monetization uncertainty
        - Philippines NIA and Nigeria NiMet partnerships are government-mediated with licensing models; commercial terms and renewal path not disclosed
        - International agriculture and government
        - Low-to-medium — strategic for brand and data expansion but unlikely to drive significant near-term revenue
        - Request revenue contribution and renewal terms for international government partnerships

figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      How a Tomorrow.io enterprise customer moves from weather disruption pain awareness
      through pilot, production deployment, outcomes realization, and multi-year expansion,
      with key actors, touchpoints, and expansion triggers at each stage.
    claimRefs: [CU007, CU008, CU010, CU013, CU014, CU022, CU023]
    data:
      items:
        - label: Awareness
          actor: Operations Lead / VP Operations / CTO
          touchpoints:
            - Weather event causes costly disruption (flight cancellation, supply chain delay)
            - Peer referral from another airline, logistics, or government operations team
            - Industry conference or Fast Company / TIME 100 editorial coverage
            - Inbound SDR outreach or Carahsoft government channel introduction
          painpoint: Existing weather data is too coarse, too slow, or too fragmented to drive automated operational decisions; manual workflows fail at scale
          opportunity: Tomorrow.io offers block-by-block, minute-by-minute forecasts with workflow automation and a single source of weather truth
        - label: Evaluation
          actor: Operations Lead + IT / Procurement
          touchpoints:
            - Free API trial or developer sandbox test
            - Proof-of-concept at one hub or location
            - RFP / request-for-purchase process comparing Tomorrow.io to IBM Weather Company, DTN, or other providers
            - JetBlue Ventures reference check or customer story review
          painpoint: Procurement requires demonstrable ROI and data accuracy validation against existing meteorological services
          opportunity: JetBlue $3.7M savings case study and Boston snowstorm accuracy story provide concrete proof points; Lufthansa Altitude pilot evidence available as of 2026
        - label: Initial Deployment
          actor: Operations Team + Tomorrow.io Implementation Team
          touchpoints:
            - API integration into dispatch or OCC dashboards
            - Configuring rule-based automated alerts to operational protocols
            - Single-location or single-hub production rollout
            - Staff training and protocol embedding
          painpoint: Integration complexity with legacy airline / logistics systems; staff adoption of new weather data workflows
          opportunity: Standardized API and Altitude™ platform reduce integration friction; Gale AI engine automates alert routing
        - label: Production and Outcomes
          actor: VP of Operations / Senior Director
          touchpoints:
            - Measurable delay reduction, de-icing cost savings, or ETA accuracy improvement
            - Proactive weather alert eliminates a costly decision error
            - Quarterly business review with Tomorrow.io account team
            - Testimonial or case study publication (JetBlue, Lufthansa, Uber, Ford)
          painpoint: Demonstrating ROI to finance leadership; transitioning from pilot SLA to enterprise contract
          opportunity: Documented $50k/month per hub savings for JetBlue; Lufthansa cites unified global standard with no manual scanning
        - label: Expansion
          actor: Executive Sponsor (VP/SVP) + Tomorrow.io Strategic Account Team
          touchpoints:
            - Expansion from one hub to all network locations (JetBlue: 1 → 10 airports → all operations)
            - New use-case addition (de-icing → flight routing → sustainability planning)
            - JetBlue Ventures Series A investment deepens relationship
            - Nigeria NiMet: agriculture DCAS → oil and gas, maritime, construction, insurance
          painpoint: Budget justification for expanded contract scope; multi-year enterprise commitment
          opportunity: Land-and-expand with documented account-growth track record; weather intelligence becomes embedded infrastructure
        - label: Strategic Embedding
          actor: CTO / CDO
          touchpoints:
            - Sole-source or preferred-vendor contract for entire vertical (JetBlue EWINS)
            - Platform becomes foundational infrastructure ("something no major airline will be able to operate without" — Lufthansa)
            - Data feedback loop from customer operations informs model training
            - Future Altitude™ expansion to other carriers referencing Lufthansa deployment
          painpoint: Lock-in concerns from procurement; alternative provider evaluation risk
          opportunity: Deep API and workflow integration creates high switching cost; satellite data advantage grows with constellation scale

  - id: FU002
    title: Adoption and Deployment Funnel
    type: funnel
    layout: standard
