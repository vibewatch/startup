  evidenceGaps:
    - gap: >-
        Tomorrow.io has not publicly disclosed NRR, GRR, churn rate, or cohort retention
        data for any customer segment; the absence of these metrics makes it impossible
        to independently verify claims of enterprise account durability beyond the JetBlue
        and government renewal signals.
      dimension: retention
      severity: high
      relatedQuestionRefs: [QU009]
      diligenceAsk: >-
        Request NRR and GRR by segment (aviation, government, logistics, developer API),
        cohort data for enterprise customers, and annual churn events since 2020.

    - gap: >-
        Revenue breakdown by customer type (enterprise vs. government vs. developer API)
        and by named customer is not publicly disclosed; this prevents assessment of
        true government concentration risk and customer lifetime value by segment.
      dimension: revenue concentration
      severity: high
      relatedQuestionRefs: [QU020]
      diligenceAsk: >-
        Request revenue by segment, top-10 customer revenue concentration, and average
        contract value by vertical.

    - gap: >-
        Named outcome evidence for Delta, United, BNSF Railway, and Amazon is absent;
        these customers are listed by name but no case study, savings claim, or testimonial
        with quantified impact has been published. No named commercial agriculture customer
        evidence beyond government partnership announcements has been found.
      dimension: named customer proof depth
      severity: medium
      relatedQuestionRefs: [QU025]
      relatedTableRefs: [TU002]
      diligenceAsk: >-
        Request customer success reports or testimonials for Delta, United, BNSF, Amazon,
        and commercial agriculture accounts; confirm production deployment status and
        contract renewal history.

    - gap: >-
        The commercial terms, pricing, and renewal conditions for international government
        partnerships (Philippines NIA, Nigerian NiMet, Bahamas) are not publicly disclosed,
        making it unclear whether these represent scalable recurring revenue or event-driven
        government grants.
      dimension: international government revenue model
      severity: medium
      diligenceAsk: >-
        Request contract terms, annual contract value, and renewal structure for NIA
        Philippines, NiMet Nigeria, and Bahamas government partnerships.

    - gap: >-
        No independent review (G2, Gartner Peer Insights, Capterra) of Tomorrow.io's
        enterprise weather platform with sufficient review volume exists; the only third-party
        satisfaction reference is FeaturedCustomers (4.8/5.0, methodology unaudited).
      dimension: independent satisfaction evidence
      severity: medium
      diligenceAsk: >-
        Commission or source G2/Gartner Peer Insights reviews from the JetBlue, Lufthansa,
        or DoD accounts; request NPS data from the account management team.
