      - Description
      - Affected Customer / Segment
      - Impact if Materialized
      - Diligence Path
    rows:
      - - US Government concentration
        - NOAA, Air Force, and NASA represent a structurally significant share of revenue; all three counterparties can cancel or not renew contracts unilaterally
        - Federal government customers
        - High — loss of NOAA CWDP would remove revenue and remove validation pipeline feeding enterprise sales
        - Request revenue breakdown by customer type; understand CWDP renewal schedule
      - - NOAA/NWS data dependency
        - Nearly all forecasting models depend on NOAA/NWS public data; DOGE cuts degrading NWS quality force Tomorrow.io into a role it is not resourced for
        - Enterprise and government customers globally
        - High — degraded public data could require expensive proprietary substitute; DOGE scenario actively discussed (Forbes, March 2025)
        - Assess resilience of forecasting models if NOAA balloon launches are suspended; test model accuracy under reduced public data conditions
      - - Carahsoft channel dependency
        - US government sales routed through Carahsoft; changes in distributor's contract vehicles or financial condition would disrupt government pipeline
