figures:
  - id: FM001
    name: Market Sizing Lens
    type: kpi
    approximationNotes: >-
      KPI items represent the consensus midpoint of each market estimate range from five
      independent publishers; do not represent Tomorrow.io's internal view.
    data:
      items:
        - label: Global Weather Forecasting Services TAM (2025 consensus mid)
          value: "$2.9B"
          detail: Midpoint of $2.50–$3.49B range across five publishers; 7.0% CAGR consensus
          tone: neutral
          claimRefs: [CM001, CM002, CM003]
        - label: North American TAM (est. 32% share)
          value: "$930M"
          detail: Based on GVR 32% NA share applied to $2.9B mid estimate
          tone: neutral
          claimRefs: [CM004]
        - label: Weather Information Technologies (broad incl. hardware/compute)
          value: "$9.2B"
          detail: Grand View Research broader scope; not directly addressable by Tomorrow.io
          tone: neutral
          claimRefs: [CM005]
        - label: Weather API Sub-segment (2024 est.)
          value: "$2.0B"
          detail: IntelMarketResearch estimate; 15% CAGR; $6B projected by 2033
          tone: positive
          claimRefs: [CM006]
        - label: Tomorrow.io ARR vs. Narrow TAM (implied penetration)
          value: "~3.5%"
          detail: Company-claimed ~$100M ARR divided by $2.9B TAM mid; unverified figure
          tone: neutral
          claimRefs: [CM007]
        - label: Spire Global FY2025 Revenue (public comparable)
          value: "$71.6M"
          detail: Per Spire Q4 2025 press release; 2026 guidance $75–85M
          tone: neutral
          claimRefs: [CM031]

  - id: FM002
