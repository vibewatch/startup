  - id: FM004
    name: Adoption Funnel / Value-Chain Map
    type: flow
    approximationNotes: >-
      Represents generalized enterprise weather-platform sales stages; actual stage names and
      durations vary by customer vertical and deal size.
    data:
      nodes:
        - id: n1
          label: Market Awareness
          detail: Weather event triggers internal review; buyer learns about commercial alternatives to NOAA
