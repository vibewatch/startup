slug: tomorrow-io
runDate: '2026-05-31'
company:
  name: Tomorrow.io
chapter:
  number: 2
  title: Market Analysis
  summary: |
    The commercial weather intelligence market is a $2.5–3.5 billion global addressable opportunity
    (weather forecasting services TAM, 2025 consensus) growing at 6.5–7.4% CAGR, with an API/software
    sub-segment growing faster at ~15% CAGR. North America represents 29–38% of spend, implying an
    $800M–$1.1B regional market. Five publisher estimates show methodological divergence of up to $1B
    depending on scope decisions around embedded analytics, hardware, and government services.
    Tomorrow.io's company-disclosed ~$100M ARR (unverified by third parties) implies ~3.5% penetration
    of the narrow global TAM. The market is fragmented across full-stack platforms, satellite data
    aggregators, and vertical specialists; IBM Weather Company dominates by scale (revenue estimated
    at $600–900M but undisclosed). The NOAA FY2026 budget reduction of ~27% ($4.5B request) creates
    a medium-term public-sector displacement opportunity for commercial providers, with a likely 2–4
    year procurement lag. Adoption constraints include enterprise integration friction, incumbent
    switching costs, satellite revisit limitations, and unverified unit economics.

sections:
  - id: market-boundary
    title: Market Boundary and Definitional Scope
    body: >-
      The commercial weather intelligence market sits at the intersection of three spend categories:
      weather data access (raw observations and model outputs), weather analytics platforms
      (interpretation, alerting, decisioning), and weather-embedded services (insurance parametrics,
      supply-chain APIs, aviation dispatch tools). Tomorrow.io competes primarily in the analytics
      platform layer, where it sells proprietary model output and API access augmented by its own
      satellite constellation — differentiating it from pure data brokers such as Spire Global.


      The included spend definition covers: enterprise subscriptions to weather API and alerting
      platforms; commercial satellite data licensing for atmospheric sensing; weather-driven
      risk-analytics modules sold into insurance, logistics, energy, and aviation; and government
      commercial weather data procurement (e.g. NOAA IDIQ contracts). Excluded spend includes:
      broadcast-media weather services for consumer audiences, agricultural commodity analytics
      not tied to field-level weather forecasting, and the broad climate-risk financial disclosures
      market (TCFD/ESG overlapping segment). The status-quo substitute is free public-sector data
      from NOAA, national met services, and free-tier weather APIs (OpenWeatherMap), which cover
      most consumer and small-business needs but lack the resolution, latency, and vertical-workflow
      integration demanded by enterprise operators.

    tableRefs: [TM001]
    figureRefs: []

  - id: market-sizing
    title: Market Sizing — Multiple Lenses and Contradictory Estimates
    body: >-
      Five independent market research publishers converge on a 2025 global weather-forecasting
      services TAM in the $2.5–3.5 billion range, growing at 6.5–7.4% CAGR. Grand View Research
      estimates $2.91 billion with 7.0% CAGR; Mordor Intelligence pegs it at $3.49 billion at 7.06%;
      Fortune Business Insights at $2.77 billion at 7.4%; IMARC Group at $2.50 billion at 6.9%; and
      Future Market Insights at $2.80 billion at 6.5%. The spread reflects different scope decisions:
      Mordor includes embedded weather-driven analytics modules that GVR excludes; IMARC uses a narrower
      definition focused on pure forecasting services. North America represents 28–38% of global
      spend (consensus ~32%), yielding a $800M–$1.1B North American TAM.


      A broader "weather information technologies" framing — which adds sensing hardware, NWP compute,
      and government-facing systems — is sized by Grand View Research at $9.23 billion globally with
      9.5% CAGR, showing what happens when scope boundaries differ. The weather API sub-segment alone
      is estimated by IntelMarketResearch at ~$2.0 billion (2024) growing at ~15% CAGR, projecting to
      ~$6 billion by 2033 — driven by proliferating data-dependent applications in retail, construction,
      and e-commerce. Tomorrow.io's company-disclosed ~$100 million ARR represents roughly 3.4–4.0% of
      the narrow weather-forecasting services TAM and ~5% of the North American SAM, indicating
      meaningful share in a fragmented market. None of these estimates successfully isolates a pure
      enterprise-SaaS weather-intelligence SAM; that figure remains a diligence gap.

    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: buyer-segmentation
    title: Buyer Segmentation and Budget Ownership
    body: >-
      Enterprise weather buyers fall into five primary verticals by revenue concentration. Aviation and
      aerospace (commercial airlines, cargo carriers, MRO providers, air traffic management) represent
      the largest segment at roughly 23–26% of weather-services spend, per Mordor Intelligence and
      Future Market Insights. These buyers purchase operational dispatch tools, turbulence alerting,
      and fuel-burn optimization APIs; budget owners are flight operations and safety departments,
      with procurement cycles of 12–24 months and high switching costs due to FAA/EASA operational
      procedure integration. Tomorrow.io counts JetBlue and Delta among its aviation customers.


      Energy and utilities (grid operators, renewable asset owners, oil-and-gas logistics) account
      for roughly 20% of spend. Buyers seek probabilistic load forecasts, storm-track routing, and
      renewable-generation nowcasts; budget owners are operational technology and risk teams. Logistics
      and transportation (last-mile delivery, rail, shipping) seek disruption forecasting and route
      optimization; BNSF Railway is a disclosed Tomorrow.io customer. Insurance and financial
      (parametric weather triggers, cat-bond underwriting) seek high-resolution historical and
      real-time data for contract settlement; this segment is growing fastest as parametric products
      expand beyond catastrophe into everyday operational risk. Government and defense represent a
      distinct channel — Tomorrow.io reported ~$30 million in Department of Defense contracts at
      Series F — with procurement through IDIQ vehicles and OTAs.

    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: growth-drivers
    title: Growth Drivers and Adoption Constraints
    body: >-
      The primary demand driver is the acceleration of weather-sensitive decision systems in sectors
      that have historically relied on free public-sector data. Climate volatility is increasing the
      frequency of weather-driven operational disruptions — the 2023–2025 period saw record-setting
      hurricane, wildfire, and flooding events that imposed direct operational costs on logistics,
      energy, and insurance buyers, creating a stronger ROI case for premium weather intelligence.
      Simultaneously, the NOAA FY2026 proposed budget reduction of ~27% ($4.5 billion request,
      down from approximately $6.1 billion FY2025 enacted) — including potential elimination of the
      Office of Oceanic and Atmospheric Research ($700 million) and 2,300+ positions — is creating
      a public-sector capability vacuum that commercial providers are positioned to fill.


      Adoption constraints are significant. Enterprise weather APIs require data-pipeline integration
      into existing operational systems (ERP, TMS, dispatch tools), creating implementation friction
      that lengthens sales cycles beyond 6–12 months for large accounts. Cost-per-query pricing models
      create unpredictable spend for high-frequency users (e.g., logistics platforms making millions
      of API calls daily), triggering budget scrutiny. Trust and accuracy verification is a barrier:
      enterprise buyers run parallel tests against incumbent data providers for 3–6 months before
      switching, and incumbents such as IBM Weather Company have deep institutional relationships.
      Finally, satellite-based observational data remains constrained by revisit-time limitations
      even for Tomorrow.io's 13-satellite DeepSky constellation — 60-minute revisit does not yet
      match the sub-15-minute cadence of GOES-East for severe convection.

    tableRefs: [TM004]
    figureRefs: [FM004]

  - id: market-structure-gaps
    title: Market Structure and Evidence Gaps
    body: >-
      The commercial weather intelligence market is fragmented among three tiers: full-stack platforms
      (Tomorrow.io, IBM Weather Company/The Weather Company), data aggregators and satellite operators
      (Spire Global, Planet Labs, Maxar), and vertical specialists (DTN for agriculture/energy, Climavision
      for mid-latitude gap-filling, Baron Weather for broadcast/emergency). IBM's Weather Company
      subsidiary controls the largest commercial dataset (270,000+ personal weather stations, 200,000+
      aircraft observations) and deep enterprise distribution, but has deprioritized enterprise-API
      investment since the 2022 separation from IBM. Spire Global reported $71.6 million in FY2025
      revenue with $75–85 million guidance for 2026, indicating a materially smaller scale than
      Tomorrow.io's claimed $100 million ARR but broader satellite footprint (110+ satellites,
      multi-domain including AIS, GNSS-RO).


      Critical evidence gaps: (1) No independent verification of Tomorrow.io's $100 million ARR —
      the figure is company-disclosed and was not confirmed by third-party filings or analysts at time
      of research. (2) Enterprise-SaaS weather-intelligence SAM — distinguishing the addressable
      market for commercial weather platforms from the broader forecasting-services market — has not
      been isolated by any publisher; the $2.5–3.5 billion figures mix government, broadcast, and
      consumer spend. (3) IBM Weather Company revenue is not separately disclosed post-2022; proxy
      estimates from analyst notes suggest $600–900 million annually, making it 6–9x larger than
      Tomorrow.io if accurate. (4) The regulatory displacement risk from NOAA budget cuts has not
      yet translated into measurable commercial contract uplift; the timing of re-procurement is
      uncertain and could take 2–4 years.

    tableRefs: []
    figureRefs: []

