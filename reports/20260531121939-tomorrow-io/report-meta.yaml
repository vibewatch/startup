summary:
  headline: >-
    Tomorrow.io has a technically differentiated satellite moat validated by NOAA and institutional
    investors at unicorn scale, but an unresolved 4× ARR discrepancy, undisclosed gross margin,
    and capital-intensive DeepSky program make commitment at $1B unjustifiable without data-room confirmation.
