companyProfile:
  summary: >-
    Tomorrow.io (formerly ClimaCell) is a Boston, Massachusetts-based weather intelligence company
    founded in 2016 by three Israeli Air Force veterans — Shimon Elkabetz (CEO), Rei Goffer (CSO),
    and Itai Zlotnik (COO). The company builds an end-to-end AI-powered weather intelligence platform
    combining a proprietary Ka-band radar and microwave sounder satellite constellation (13 satellites,
    60-minute global revisit rate as of January 2026), physics-based and generative AI forecasting
    models, and enterprise decision-support software. In February 2026 Tomorrow.io closed a $175 million
    Series F led by Stonecourt Capital and HarbourVest Partners at a post-money valuation exceeding
    $1 billion, achieving unicorn status; the round was extended by $35 million in May 2026, bringing
    total Series F proceeds to $210 million and cumulative capital raised to approximately $535 million.
    The company reports approximately $100 million in annual recurring revenue — a figure disputed by
    GetLatka's CEO-verified database ($24.4M for 2025). Customers include over 250 organizations across
    aviation, logistics, energy, insurance, and government, including the U.S. Department of Defense,
    U.S. Air Force, NASA, JetBlue, Delta, Uber, Ford, and BNSF Railway. A SPAC merger with Pine
    Technology Acquisition Corp was announced in December 2021 and terminated in March 2022 at a
    $1.5 million termination fee due to poor market conditions.
  foundedDate: '2016-01-01'
  founders:
