  foundingLocation: Boston, Massachusetts
  headquarters: Boston, Massachusetts
  productSummary: >-
    Tomorrow.io sells weather intelligence as enterprise SaaS (API, dashboard, automated alerts)
    under the Weather Intelligence Platform and Altitude™ (aviation-specific) product names. The
    platform combines proprietary satellite data from a 13-satellite Ka-band radar and microwave
    sounder constellation with AI and physics-based forecasting to deliver impact-based operational
    recommendations. Government data-as-a-service contracts (NOAA CWDP, DoD APFIT) represent a
    second revenue stream. The next-generation DeepSky constellation is in development using
    Series F proceeds.
  customerFocus: >-
    Enterprise customers in aviation, logistics, energy, insurance, construction, and U.S. government
    (DoD, Air Force, NOAA, NASA CSDA). More than 250 organizations; company claims more than half of
    the top ten Fortune 500 companies use the platform.
  businessModel: >-
    Enterprise SaaS subscriptions (API and platform, priced via sales engagement with no public list
    pricing) and U.S. government data-as-a-service contracts (milestone-gated, multi-year programs
    with NOAA and the DoD APFIT program). A free developer tier serves as a top-of-funnel channel.
