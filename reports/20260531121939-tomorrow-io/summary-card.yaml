  topStrengths:
    - >-
      Proprietary 13-satellite Ka-band radar and microwave sounder constellation validated by NOAA as "well-calibrated,
      generally comparable to ATMS" — a technically defensible moat requiring years and hundreds of millions to
      replicate.
    - >-
      Institutional-quality Series F investors (Stonecourt Capital, HarbourVest Partners) and Goldman Sachs as exclusive
      financial advisor signal rigorous capital-raise process and governance credibility.
    - >-
      NOAA contract extensions through the 2025 hurricane season and a January 2026 radar validation contract provide
      milestone-gated, independently validated government revenue — highest-quality revenue in the mix.
    - >-
      Founding team intact for nine years with complementary IDF/MBA pedigree, reducing key-person concentration risk
      relative to typical AI-startup peers.
    - >-
      Named Fast Company's most innovative space company in 2025 and 2026; TIME 100 Most Influential Companies 2024 —
      strong brand positioning in a growing climate-risk market.
    - >-
      Addressable commercial weather intelligence market estimated at $3–5 billion, growing structurally as climate
      volatility increases enterprise demand.
  topRisks:
    - >-
      4× ARR discrepancy (company-claimed ~$100M versus GetLatka CEO-verified $24.4M for 2025) is the single most
      material unresolved financial risk; $1B valuation is indefensible at ~41× implied ARR if the lower figure is
      accurate.
    - >-
      Gross margin by segment undisclosed — blended margin drag from capital-intensive satellite operations on SaaS-like
      unit economics cannot be modeled from public data alone.
    - >-
      Government revenue concentration (NOAA CWDP, DoD APFIT ~$33–35M cumulative) faces Trump-era proposed 17% NOAA
      budget cut, potentially impairing the highest-quality disclosed revenue stream.
    - >-
      DeepSky next-generation constellation has multi-year execution risk, no disclosed all-in cost cap, and is the
      stated use of $210M Series F proceeds — compounding capital intensity and dilution risk.
    - >-
      Failed 2022 SPAC exit at $1.2B creates adverse exit precedent; current $1B private mark sits just below the failed
      public valuation, implying limited upside compression to a future exit.
    - >-
      Burn rate and runway post-Series F are undisclosed, making capital adequacy and dilution timeline assessment
      impossible from public evidence.
  unresolvedGaps:
    - >-
      Audited ARR for FY2024 and FY2025 with revenue recognition methodology, reconciling the company's $100M claim
      against GetLatka's $24.4M CEO-verified figure.
    - >-
      Gross margin by segment (commercial SaaS vs. government data-as-a-service vs. satellite infrastructure) and
      blended EBITDA or operating loss.
    - >-
      Burn rate and post-Series F runway, given $210M raised against undisclosed operating costs of a satellite
      manufacturing and launch program.
    - >-
      Preference waterfall, liquidation preferences, anti-dilution provisions, and common-stock discount from the $1.04B
      headline post-money valuation.
    - Independent board composition, governance structure, and any succession planning below the three co-founders.
