company:
  name: Tomorrow.io
chapter:
  number: 8
  title: Valuation
  summary: |
    Tomorrow.io's May 2026 post-money valuation is $1.04 billion (Series F, $210M total),
    confirmed by Forge Global and investor disclosures. The central valuation challenge is
    an unresolved 4× ARR discrepancy: the company cites ~$100M ARR in Series F materials
    while GetLatka's CEO-verified database records $24.4M for 2025 and a third-party SaaS
    tracker estimates $35.1M for 2026. At $24M ARR the implied multiple is ~41×, which
    exceeds all public comparable benchmarks; at $100M ARR the multiple is ~10×, which is
    defensible for a high-growth, dual-revenue-stream company with a proprietary satellite
    asset. Public comps (Spire Global ~11× EV/Rev, BlackSky ~17×, Planet Labs ~18.5× P/S)
    provide a range of 11–18× for high-growth space data companies; Tomorrow.io sits at the
    floor of that range if the $100M figure is accurate and well above if it is not. The 2022
    SPAC termination at $1.2B is an adverse precedent for exit execution. No IPO S-1 has been
    filed as of May 2026. Conditional interest is warranted only with data room access: audited
    ARR, gross margin by segment, burn rate, and preference waterfall must be verified before
    commitment. Recommendation is Conditional Interest — Watch; risk rating High.

sections:
  - id: valuation-context-financing-overhang
    title: Valuation Context and Financing Overhang
    body: >-
      Tomorrow.io closed its Series F in two tranches totaling $210 million: a $175 million lead
      round in February 2026 anchored by Stonecourt Capital and HarbourVest Partners, followed by
      a $35 million extension in May 2026 from Pitango Venture Capital and Harel Insurance.
      Forge Global's secondary market platform records the resulting post-money valuation at
      $1.04 billion as of May 2026, placing Tomorrow.io firmly in unicorn territory. Total capital
      raised since inception is approximately $498–535 million across all rounds from seed (2016)
      through Series F. The $210 million Series F is one of the largest single-round financings
      in commercial weather intelligence to date. Disclosed use of proceeds is DeepSky satellite
      constellation manufacturing, launch, and operations — a capital-intensive program with
      multi-year execution risk and no firm all-in cost cap publicly stated. Preference stack
      details are not disclosed publicly; no 409A or independent third-party valuation has been
      cited alongside the $1 billion figure, meaning common-stock and option-pool discounts from
      the headline post-money number remain unknown. At $210M raised against a $1.04B post-money,
      the implied pre-money was approximately $830M and the Series F represented approximately
      20% dilution in aggregate, though actual dilution depends on terms such as liquidation
      preferences, anti-dilution provisions, and option-pool refresh. Forge's secondary market
      shows limited market activity and no matched prices as of May 2026, indicating limited
      private secondary liquidity for existing shareholders. The combination of a large financing
      overhang, undisclosed preference mechanics, and a capital-intensive satellite program
      creates meaningful dilution risk for any new investor entering at or near the current mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV017, CV018, CV026]
    tableRefs: [TV001]


  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      The investment thesis for Tomorrow.io rests on three pillars. First, proprietary data asset:
      Tomorrow.io has deployed an operational microwave sounder constellation validated by NOAA
      for commercial weather data program use — a technically differentiated asset that requires
      years and hundreds of millions of dollars to replicate. This creates a defensible moat that
      pure-software weather companies cannot easily match. Second, market structure: commercial
      weather intelligence is an underpenetrated and expanding category estimated at $3–5 billion
      in addressable spend, growing as climate volatility increases demand from aviation, insurance,
      energy, logistics, and government sectors. No other private company has executed both
      satellite constellation deployment and an enterprise SaaS platform at comparable scale.
      Third, revenue quality signal: NOAA's extension of its commercial weather data pilot contract
      through the 2025 hurricane season and the subsequent January 2026 radar validation contract
      represent independent technical validation with milestone-gated revenue — a higher-quality
      revenue signal than commercial SaaS alone. The anti-thesis is equally material. The 4× ARR
      discrepancy between company-claimed $100M and GetLatka-verified $24.4M means the valuation
      is effectively unanchored: at $24M ARR the implied multiple of ~41× exceeds every public
      comparable and implies a speculative premium that cannot be justified on current financials.
      Gross margin by segment is undisclosed, meaning the blended margin impact of capital-intensive
      satellite operations on the software-like SaaS margin is unknown. The failed 2022 SPAC at
      $1.2B suggests the company has already attempted one exit mechanism that did not succeed,
      and the current $1B private mark is only marginally below that failed public valuation. NOAA
      budget concentration and Trump-era proposed 17% NOAA funding cuts add a government revenue
      risk that could directly impair the highest-quality revenue stream.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV030, CV031]
    tableRefs: [TV002]
    figureRefs: [FV001]

  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis
    body: >-
      Public comps for Tomorrow.io sit primarily in the satellite data and space-based analytics
      segment, with some reference to commercial weather data incumbents. Spire Global (NYSE: SPIR),
      the closest public pure-play in satellite weather data, trades at approximately $846M enterprise
      value on last-twelve-month revenue of $75M, implying an EV/Revenue multiple of approximately
      11×. Spire reported Q4 2025 GAAP revenue of $15.8M and full-year 2025 revenue of $71.6M;
      its 2026 guidance of $75–$85M implies 50%+ revenue growth from continuing operations after
      divesting its maritime business. BlackSky Technology (NYSE: BKSY) provides a higher-multiple
      benchmark: enterprise value of approximately $2 billion on LTM revenue of $119M implies an
      EV/Revenue multiple of ~17×. Planet Labs (NYSE: PL) trades at approximately 18.5× forward
      price-to-sales on FY2026 revenue of $308M, the highest multiple in the peer set and reflective
      of its scaled recurring government contract backlog exceeding $900M. These public comps establish
      a defensible range of 11–18× EV/Revenue for high-growth, government-contract-anchored satellite
      data companies. On the private side, the IBM Weather Company was sold to Francisco Partners in
      February 2024 at an estimated valuation above $1 billion — providing a relevant M&A comp for
      a scaled commercial weather data business. Tomorrow.io's $1B mark implies 10× on $100M ARR
      (the company-claimed figure), at the floor of the public comp range, or 41× on the GetLatka
      $24.4M figure, materially above the comp ceiling. A mid-case ARR of $60M would imply ~17×,
      which is at the high end of the public comp range but defensible if the DeepSky constellation
      enables a premium data-as-infrastructure multiple rather than a pure SaaS multiple.
    claimRefs: [CV013, CV014, CV015, CV016, CV019]
    tableRefs: [TV004]
    figureRefs: [FV002]

  - id: scenario-analysis
    title: Bull, Base, and Bear Scenario Analysis
    body: >-
      Three scenarios bracket the valuation and return space. The bull case assumes Tomorrow.io's
      ARR reaches $150M by fiscal year 2028, with DeepSky delivering operational data in 2027 as
      planned, government contracts expanding under normalized NOAA funding, and the company achieving
      gross margins above 60% on the blended SaaS-plus-data business. In this scenario, a 15–20×
      ARR exit multiple is achievable, yielding an exit valuation of $2.25–3.0 billion and a
      2–3× return for Series F investors over a 3–4 year hold. The base case assumes ARR lands in the
      $60–80M range by 2028, representing a reconciliation between the company-claimed $100M and the
      GetLatka $24.4M, with 30–40% annual growth, some DeepSky delay risk, and stable government
      contracts. A 10–12× ARR multiple implies an exit valuation of $600M–960M — below the current
      $1B mark and representing a loss-of-principal scenario for late-stage investors. This makes the
      base case return-negative at the current entry price without substantial multiple re-rating.
      The bear case assumes the ARR discrepancy resolves to the lower end ($24–35M), DeepSky faces
      significant launch delays or cost overruns requiring an additional capital raise at a flat or
      down-round valuation, NOAA budget cuts materialize, and public market comps compress to
      8–10× EV/Revenue by 2028 as interest rates remain elevated. Exit valuation in this scenario
      is $400–600M, implying a 40–60% capital loss from the $1B entry. Probability-weighted across
      bull (20%), base (50%), and bear (30%), the expected exit value is approximately $950M–$1.2B,
      implying flat-to-modest returns at the current $1B mark for a Series F investor — insufficient
      for most institutional late-stage return thresholds without data room confirmation of the $100M
      ARR narrative.
    claimRefs: [CV020, CV021, CV022, CV023, CV024, CV025]
    tableRefs: [TV003]
    figureRefs: [FV003]

  - id: exit-readiness-and-return-profile
    title: Exit Readiness and Return Profile
    body: >-
      Tomorrow.io has no announced IPO timeline or public S-1 filing as of May 2026. The company's
      most recent public exit attempt — a December 2021 SPAC merger with Pine Technology Acquisition
      Corp at a $1.2B valuation — was terminated in March 2022 after citing poor market conditions.
      Peer space SPACs (Virgin Orbit, Terran Orbital) saw redemption rates exceeding 80%, and
      industry analysis (Quilty Space, 2024) concluded Tomorrow.io was fortunate to avoid this
      outcome. The current $1B private mark is only $200M below the abandoned $1.2B SPAC valuation,
      compressing the potential appreciation from any IPO path unless the company achieves material
      revenue growth before listing. Forge Global lists market activity as limited with no matched
      secondary transactions, meaning early investors cannot easily access partial liquidity.
      Acquisition by a strategic buyer — major cloud providers (AWS, Google, Microsoft), defense
      primes, or PE-backed weather data consolidators — represents the most probable near-term exit
      for existing investors. The Francisco Partners acquisition of IBM Weather Company at >$1B
      establishes a reasonable M&A comp for a scaled commercial weather data business, though
      Tomorrow.io's constellation infrastructure adds both optionality and execution risk relative
      to that comp. A 3× return for a Series F investor at $1B entry requires a $3B exit valuation,
      which is achievable only in the bull case and implies a 2028–2030 timeline. At the base case
      exit of $600M–$960M, Series F investors would face a markdown. Pitango's re-investment as an
      existing insider in the May 2026 extension is a positive conviction signal, but cannot substitute
      for audited financials in a diligence context.
    claimRefs: [CV005, CV006, CV007, CV027, CV028, CV029, CV035]
    tableRefs: [TV005]
    figureRefs: [FV004]

  - id: recommendation-and-diligence-asks
    title: Recommendation and Final Diligence Asks
    body: >-
      The overall investment recommendation for new capital entering at the $1B Series F mark is
      Conditional Interest — Watch. The evidence supports a company with a genuinely differentiated
      technical asset, institutional-quality investors, NOAA-validated operational data, and a
      large if unproven addressable market. These are thesis-affirming signals. However, three
      blocking diligence gaps prevent a constructive rating: (1) the 4× ARR discrepancy — the
      single most important metric for any revenue-multiple valuation — is unresolved and material;
      (2) gross margin by segment is unknown, meaning the drag from satellite capital-intensive
      operations on SaaS-like economics cannot be modeled; (3) burn rate and runway post-Series F
      are undisclosed, making capital adequacy and dilution timeline assessment impossible. An
      investor committing at $1B without these data points is effectively investing in a narrative
      rather than a model. If the data room confirms $100M ARR with audited support, 60%+ blended
      gross margin, 24+ months runway at current burn, and manageable preference waterfall, the
      investment becomes actionable at a cautious constructive rating with a 10–12× ARR exit
      multiple target of $1.5–2.0B. If audited ARR lands below $40M, the entry price is
      indefensible against the public comp set and a hard pass is warranted. The recommendation
      therefore hinges entirely on data room access and financial audit. Risk rating is High
      regardless of scenario, driven by satellite execution risk, ARR opacity, government
      concentration, SPAC failure history, and the dilutive capital requirements of DeepSky.
      Confidence in the current recommendation is Medium — sufficient evidence exists to form a
      view but not to execute without additional diligence.
    claimRefs: [CV032, CV033, CV034]
    tableRefs: [TV006]


