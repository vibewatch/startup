        - plannedFigures/valuation-sensitivity
      status: answered
      keyQuote: >-
        At 11x Spire floor needs $91M; at 17x BlackSky needs $61M; at 18.5x Planet Labs
        needs $56M — all require 2-4x growth from $24M GetLatka baseline.

    - id: QV029
