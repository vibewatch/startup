  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited annual recurring revenue
      missingEvidence: >-
        No audited ARR or investor-deck ARR with contractual definition has been publicly disclosed.
        The 4× discrepancy between company-claimed $100M and GetLatka CEO-verified $24.4M (2025)
        cannot be resolved without data room access to financial statements.
      whyItMatters: >-
        Revenue-multiple valuation is impossible without confirmed ARR; the entire valuation
        analysis depends on which ARR figure is accurate. At $24M, the multiple is indefensible;
        at $100M, the entry price is at the floor of the public comp range.
      diligencePath: >-
        Request audited financial statements FY2023-FY2025 or investor-deck ARR schedule with
        contractual definition and revenue recognition policy from CFO in data room.
      relatedQuestionRefs: [QV003, QV005, QV014]
      relatedTableRefs: [TV001, TV002]

    - type: private-evidence-only
      severity: blocking
      topic: gross margin by segment and burn rate
      missingEvidence: >-
        No segment P&L distinguishing SaaS software gross margin from satellite operations cost
        of revenue has been disclosed. Monthly burn rate and runway post-Series F are undisclosed.
      whyItMatters: >-
        Satellite operations could compress blended gross margin below 40%, fundamentally
        changing the path-to-profitability model; burn rate determines dilution timeline and
        capital adequacy, both critical for return modeling.
      diligencePath: >-
        Request segment P&L for commercial SaaS vs government and satellite operations from
        CFO; compare to Spire Global's disclosed 41% blended gross margin.
      relatedQuestionRefs: [QV012, QV021]
      relatedTableRefs: [TV006]

    - type: private-evidence-only
      severity: important
      topic: preference waterfall and cap table
      missingEvidence: >-
        Full cap table, liquidation preference terms, option pool size, and warrant grants
        from Series A through F are not publicly disclosed. No 409A or independent valuation
        has been cited alongside the $1.04B post-money figure.
      whyItMatters: >-
        Headline post-money valuation may materially overstate common-stock value; preference
        waterfall determines actual investor returns at various exit prices below $2B.
      diligencePath: >-
        Request full cap table and investor rights agreement from general counsel in data room.
      relatedQuestionRefs: [QV010, QV021, QV025]
      relatedTableRefs: [TV001, TV006]
    - type: data-gap
      severity: important
      topic: comparable company set coverage — missing private weather data comps
      missingEvidence: >-
        No private pure-play weather SaaS company with disclosed financials was identified for
        direct comparison to Tomorrow.io. The comparable table (TV004) relies entirely on
        public satellite data companies (Spire, BlackSky, Planet Labs) and one M&A transaction
        (IBM Weather Company), none of which exactly match Tomorrow.io's software-plus-satellite
        hybrid business model. Direct private comparables (ClimaCell's prior self before rename,
        DTN, Baron Weather) are not publicly valued.
      whyItMatters: >-
        Without a precise private comparable, the EV/Revenue range of 11–18.5× may overstate
        or understate the appropriate private-market discount; the table therefore cannot provide
        a definitive anchor multiple, only a reference range with wide uncertainty.
      diligencePath: >-
        Conduct proprietary channel checks with weather data industry analysts (Fitch Solutions,
        Wood Mackenzie Energy) to identify private transaction multiples; request Spire's
        Weather-as-a-Service segment breakout when available.
      relatedQuestionRefs: [QV008, QV009, QV029, QV030]
      relatedTableRefs: [TV004]
