        Forge secondary market: limited activity, no matched prices as of May 2026; no public
        announcement of employee tender offer or secondary block transaction.

    - id: QV024
      question: >-
        How does Tomorrow.io's $1.04B valuation compare in aggregate to Spire, BlackSky, and
        Planet Labs as a sanity check against the public satellite data peer set?
      type: comparison
      targets:
        - contentRequirements/4
        - plannedFigures/valuation-sensitivity
      status: answered
      keyQuote: >-
        $1.04B mark is: 23% below Spire EV at 1× revenue (if ARR = $100M, Spire at 11×);
        at comp-floor if ARR = $100M; above comp-ceiling if ARR = $24M. Market-consistent
        only with audited $100M ARR.

    - id: QV025
      question: >-
        What are analyst and market-level concerns about late-stage deep-tech hardware-software
        hybrid valuations in 2026 that are relevant to assessing Tomorrow.io's entry risk?
      type: adverse
      targets:
        - contentRequirements/1
        - plannedTables/thesis-anti-thesis-table
      status: partial
      keyQuote: >-
        2026 late-stage VC market has seen widespread flat or down rounds for capital-intensive
        deep-tech companies; SPAC failures 2022–2023 precedent; multiple compression for
        unprofitable satellite companies is documented in Spire and Planet Labs histories.

    - id: QV026
      question: >-
        How does Tomorrow.io's capital efficiency (total raised vs valuation) compare to
        public comparable satellite data companies?
      type: comparison
      targets:
        - contentRequirements/2
        - plannedFigures/investment-kpis
      status: answered
      keyQuote: >-
        $498–535M raised at $1.04B valuation implies approximately 2x invested-capital-to-mark
        ratio; Spire Global raised significantly more capital to reach comparable scale.

    - id: QV027
      question: >-
