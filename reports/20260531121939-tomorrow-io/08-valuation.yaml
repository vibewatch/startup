  - id: TV005
    title: Thesis-Break and Kill Triggers
    notes: >-
      Triggers are defined as observable, measurable events or disclosures that would
      materially change the investment view. Monitoring should be ongoing through the
      diligence period and post-investment.
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR confirmed below $40M under audit
        - Audited ARR < $40M for most recent fiscal year
        - >-
          Implies 26×+ ARR multiple at $1B entry; exceeds all comp benchmarks; narrative
          valuation undefendable; down-round risk in next raise
        - Hard pass at current price; revisit if valuation corrects to 10–15× on confirmed ARR
      - - NOAA contract non-renewal or material cut
        - "More than 50% reduction in NOAA-sourced revenue or cancellation of CWDP program"
        - >-
          Eliminates highest-quality revenue stream; degrades data-validation credibility
          used in investor materials; triggers customer confidence risk in enterprise SaaS
        - Exit position or require remediation plan and government replacement revenue before committing
      - - DeepSky constellation delay exceeding 18 months
        - First full constellation operational date slips past mid-2028
        - >-
          Extends cash burn without revenue contribution from constellation data;
          requires incremental capital raise; serial dilution damages equity value for all investors
        - Reduce conviction; require updated capex schedule and remaining-capital bridge before committing
      - - New Series F or bridge round at valuation below $1B
        - >-
          Any equity financing priced at post-money <$1B (down round)
        - >-
          Confirms market repricing; activates anti-dilution provisions for earlier investors;
          common holders face increased dilution; thesis that $1B was fair is invalidated
        - Full stop on investment; monitor for price reset and improved entry point
      - - Executive attrition of CEO (Shimon Elkabetz) or CTO
        - Announced departure of Elkabetz or core founding technical leader
        - >-
          Founder-led strategy pivot risk; NOAA and government relationships may be
          relationship-dependent; DeepSky execution accountability gap
        - Pause and assess succession before committing; management continuity is a gating condition

  - id: TV006
    title: Final Diligence Asks
    notes: >-
      Items are ranked by materiality. Items 1–3 are blocking — investment cannot be underwritten
      without them. Items 4–5 are important but context-dependent. All requests should be
      directed to company management and investor relations.
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited ARR and Revenue Breakdown
        - >-
          Audited annual financial statements or signed investor-deck ARR schedule with
          contractual definition distinguishing SaaS ARR from government contract TCV
        - >-
          Resolves 4× discrepancy between $24.4M (GetLatka) and $100M (company claim);
          without this, no revenue-multiple analysis is possible and valuation is narrative-only
        - Company CFO; request pre-NDA data room teaser; require definitional clarity on ARR
      - - Gross Margin by Segment
        - >-
          Segment P&L separating SaaS software gross margin from satellite operations cost
          of revenue; hardware COGS schedule for DeepSky manufacturing
        - >-
          Blended margin is unknown; satellite operations could compress consolidated margin
          to below 40%, fundamentally changing the path-to-profitability model and exit multiple
        - Company CFO; compare to Spire Global disclosed 41% blended gross margin as a benchmark
      - - Burn Rate and Runway
        - >-
          Monthly cash burn for most recent quarter; projected runway at current trajectory
          post-Series F; bridge financing scenarios
        - >-
          $210M raise at unknown burn rate means capital adequacy is opaque; if burn exceeds
          $15M/month the runway is <18 months and another raise may dilute Series F investors materially
        - Company CFO and board; validate against headcount and satellite COGS
      - - Preference Waterfall and Cap Table
        - >-
          Full cap table including option pool, warrants, convertible notes, and
          liquidation preference terms for Series A through F; any anti-dilution provisions
        - >-
          $1.04B post-money is a headline number; actual common-stock value after preference
          waterfall could be materially lower; critical for modelling return at various exit prices
        - Company general counsel and CFO; standard data room item for late-stage diligence
      - - DeepSky Capex Schedule and Government Contract Pipeline
        - >-
          All-in cost to deploy full DeepSky constellation; current manufacturing status;
          identified government contract pipeline (NOAA, DoD, international) for constellation data
        - >-
          If constellation cost exceeds $300M total and additional equity raises are required,
          serial dilution will erode Series F entry returns even at bull-case exit
        - Company business development and technical team; cross-reference DoD and NOAA procurement records

