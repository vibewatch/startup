  - id: TP004
    name: Moat Durability and Competitive Risk Register
    slug: moat-risk-register
    notes: >-
      Severity scale: High (threatens revenue or differentiation materially within 24 months),
      Medium (meaningful risk within 3–5 years), Low (unlikely or structurally constrained).
      Assessments are editorial based on available public evidence; independent validation needed.
    columns:
      - Moat Claim
      - Evidence
      - Competitive Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Proprietary satellite constellation (data supply moat)
        - "13 satellites; 60-min global revisit; claimed majority of global microwave sounder data; DeepSky next-gen in development; $210M Series F"
        - More constellations launching (Planet, Vantor/Maxar, government programs); Spire expanding microwave sounder payloads
        - Medium
        - Verify data exclusivity window; assess revisit-rate advantage vs. GOES-East and planned competitors; DeepSky execution timeline
      - - AI-native vertical SaaS suites (Altitude, Shield, Gale)
        - "Altitude launched March 2026 with Lufthansa; Shield for P&C carriers; Gale agentic AI; MCP server Spring 2026; native MCP first-mover claim"
        - TWC can launch similar agentic features; DTN's NVIDIA Earth-2 integration is credible AI competition; Google DeepMind GraphCast is open
        - Medium
        - Validate customer switching friction after Altitude/Shield integration; assess contract renewal rates in aviation; measure Gale adoption rate
      - - Government and defense channel ($30M+ DoD contracts)
        - "AFLCMC contract; NASA CSDA vendor; Palantir partnership for defense weather intel; Series F government ARR disclosure"
        - Spire is a larger government prime with $151B SHIELD IDIQ ceiling; government budget volatility (NOAA cuts) cuts both ways
        - Low–Medium
        - Confirm classified vs. unclassified contract mix; assess ITAR/security clearance dependencies; validate contract pipeline
      - - Vertical workflow lock-in (operational integration)
        - "JetBlue, Lufthansa, BNSF Railway, Delta cited as customers; Altitude integrates with airline IOCC and dispatch tools"
        - Multi-homing is widespread; TWC runs parallel to Tomorrow.io at multiple enterprise accounts; buyers can switch data layer without switching workflow
        - Medium
        - Measure NRR and gross revenue retention; assess number of accounts where Tomorrow.io is sole provider vs. running parallel with TWC or DTN
      - - Supply / data advantage from proprietary observation network
        - "Majority of global microwave sounder data claim; NOAA operational-grade validation of constellation; 60-min global revisit completed Jan 2026"
        - AI forecast models (GraphCast, Pangu-Weather) have been shown to match NWP accuracy without dense proprietary observations; open NOAA data free
        - Medium
        - Test whether proprietary satellite data demonstrably improves forecast skill vs. open sources; quantify accuracy premium for paying customers

