  evidenceGaps:
    - id: GP001
      description: >-
        No direct evidence exists of specific deal losses by Tomorrow.io to competitors; no
        customer churn data, competitive displacement records, or public RFP losses are
        available. Tomorrow.io does not disclose win/loss rates or named accounts lost
        to The Weather Company or DTN.
      relatedQuestionRefs: [QP020]
      severity: medium
      diligenceAsk: >-
        Request management disclosure of gross revenue retention rate, net revenue retention
        rate, and representative win/loss log across the last 4 quarters from the data room.

    - id: GP002
      description: >-
        No independent scientific comparison exists confirming that Tomorrow.io's proprietary
        microwave sounder satellite data demonstrably improves forecast accuracy versus
        open-source NWP model output (ECMWF, GFS) combined with Spire Global data.
        Tomorrow.io's accuracy claims are self-reported and not confirmed by independent
        meteorological skill score publications as of the research date.
      relatedQuestionRefs: [QP024]
      severity: medium
      diligenceAsk: >-
        Request NOAA validation reports, RMSE/skill score benchmarks versus open NWP models,
        and any third-party operational testing results for Tomorrow.io's proprietary forecast
        model with and without satellite input data.
