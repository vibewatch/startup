      - number: '5.6'
        title: 路线图、技术依赖与技术风险
        blocks:
          - type: paragraph
            body: |
              DeepSky 是 Tomorrow.io 于 2026 年 1 月宣布的下一代星座，目标是
              100+ 颗卫星，具备覆盖完整电磁频谱的多模态传感能力，包括历史上仅限
              一次性科学任务的新传感器类型。该星座设计用于提供亚小时级全球重访率、
              可随每次轨道经过持续改进预报模型的 AI 原生数据流，以及公司描述为
              超过主要政府和国际客户基线观测要求的传感能力。开发正在进行，并计划
              分阶段部署；截至 2026 年 5 月，未公开披露发射时间表或卫星数量里程碑。

              主要技术风险包括：（1）发射依赖 SpaceX Transporter 拼车运载工具，
              这是星座扩张既定但单一供应商路径；（2）政府数据质量项目（NOAA CWDP、
              NASA CSDA）仍是主要独立验证渠道，形成对持续项目资金和相关性的依赖；
              （3）与 NWP 系统（JEDI-MPAS、UFS）的数据同化框架集成仍处于评估阶段，
              尚未在 NOAA 运行生产中使用；（4）直接商业企业的 FedRAMP 认证状态未公开披露；
              （5）正如 Forbes 在 2025 年 3 月指出，几乎所有商业天气公司——包括
              Tomorrow.io——仍部分依赖 NOAA/NWS 公共数据来驱动预报模型，尽管自有
              卫星数据在扩张，这仍构成对持续政府数据供应的依赖。
