      - 已有缓释措施
      - 终止标准（打破投资逻辑的阈值）
      - 监测信号
    rows:
      - - 政府政策 / NOAA 依赖
        - 多合同分散（美国空军、NASA、国际客户）、Palantir 联邦市场渠道，以及 DeepSky 自研数据，随着时间推移降低 NOAA 补充输入占比
        - NOAA 取消 Commercial Weather Data Pilot 计划，或美国国会在完整财年内阻止所有商业天气数据采购
        - NOAA 年度预算拨款状态；SBEM IDIQ 中标名单；DOGE 公告 NOAA 项目裁撤
      - - 资本密集度 / 财务风险
        - 2026 年完成 $210M Series F；Goldman Sachs 担任财务顾问；40+ 家机构投资者降低单一投资人依赖
        - Series F 交割后 24 个月内无法以 ≥$750M 估值完成 Series G，或确认现金跑道低于 6 个月且没有已签署投资意向书
        - 月度烧钱速度与现金余额；Series G 时间表与 DeepSky 资本开支计划；太空天气公司公开市场可比对象
      - - SpaceX / 发射依赖
        - Falcon 9 已完成运营验证，2026 年约 160 次发射；拼车发射市场提供一定备选空间
        - DeepSky 发射窗口期内 Falcon 9 停飞 >6 个月，或 SpaceX 终止商业拼车发射计划
        - SpaceX 发射节奏与异常披露；拼车任务舱单预订；Starship 运营就绪里程碑
      - - Palantir FedStart / 联邦准入
        - Palantir 在政府客户中积累深、周期长；FedRAMP 认证持续维护；FedStart 是商业 SaaS 产品
        - Palantir 失去 FedRAMP 授权或被排除在联邦采购之外，或 Palantir 终止与 Tomorrow.io 的 FedStart 商业协议
        - marketplace.fedramp.gov 上的 Palantir FedRAMP 状态；Palantir 季度财报中政府业务收入；FedStart 客户名单更新
      - - 预报准确性 / 信任
        - R2 雷达 -6% 偏差获 NASA 批准用于科研；NOAA 在 AWIPS2 中完成微波探测仪数据运营验证；星座扩容后，DeepSky 将替代 R1 数据份额
        - 三家或更多具名企业客户公开称预报不准确是未续约原因，或监管机构就航空或国防用例中的 AI 决策系统准确性作出反向结论
        - 客户流失公告；涉及 Tomorrow.io 天气数据的 NTSB 或 FAA 调查；竞争基准报告显示其准确性系统性落后于 NWS 或 IBM TWC
  - id: TV001
    title: 建议摘要
    notes: 所有评估仅基于公开证据。若能进入资料室，置信度会显著提高。即便资料室结果向好，卫星执行风险和政府收入集中仍使风险评级维持高。
