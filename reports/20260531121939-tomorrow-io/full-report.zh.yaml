  - id: TV002
    title: 投资逻辑与反向逻辑
    notes: 论点基于截至 2026 年 5 月的公开证据：Series F 披露、NOAA 合同记录、GetLatka ARR 数据和公开可比公司分析。
    columns:
      - 支柱
      - 投资逻辑论点
      - 反向逻辑论点
      - 证据质量
    rows:
      - - 自研数据资产
        - 运营中的微波探测仪星座已获 NOAA 验证；复制需要数年和数亿美元投入；尚无专注该赛道的民营竞争者达到同等水平
        - 卫星资产也是资本负担：DeepSky 星座需要连续融资，持续稀释股权；星座数据尚未贡献已确认收入
        - 中
      - - 收入质量
        - NOAA CWDP 和 DoD APFIT 合同（累计约 $33–35M）按里程碑付款，并经过技术验证；NOAA 2025 年 5 月续约证明数据有用
        - 政府客户集中风险；NOAA 拟削减 17% 预算；非经常性合同结构意味着每个周期都要重新赢单
        - 高
      - - ARR 规模
        - 公司在 Series F 材料（2026 年 2 月）披露约 $100M ARR，对应 $1B 估值约 10× 倍数——处于公开可比公司区间下沿
        - GetLatka 经 CEO 验证的 2025 年 ARR 为 $24.4M，第三方 2026 年估计为 $35.1M，对应 30–41× 倍数，显著高于所有可比基准
        - 低 — 4× 差异未解决
      - - 市场机会
        - 全球商业天气智能可服务市场达 $3–5B+；气候波动扩大航空、保险、物流、农业等行业需求
        - 市场规模口径偏宽，更多是 TAM；已打穿的 SAM 不清楚；The Weather Company、AccuWeather、DTN 等老牌厂商资金充足、位置稳固
        - 中
      - - 退出路径
        - >-
          HarbourVest、Stonecourt 等机构质量较高且具备基础设施投资授权；AWS、云厂商、国防主承包商等战略买家动机清晰；IBM Weather Company 以 >$1B 出售给 Francisco
          Partners，是相关 M&A 可比案例
        - 2022 年 3 月，$1.2B SPAC 合并失败；当前估值仅比放弃的 SPAC 价格低 $200M；尚未提交 IPO S-1；Forge 老股市场活动有限，未显示撮合成交
        - 中
      - - 投资人信心
        - 既有投资人 Pitango 和 Harel Insurance 在 2026 年 5 月延伸轮中加码；HarbourVest 和 Stonecourt 领投 2026 年 2 月那一档——均为高质量机构资本
        - 内部投资人参与 $35M 延伸轮，可能反映外部新钱需求有限，而不只是信心；$1B 投后估值旁未披露独立估值（409A）
        - 中
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析
    notes: 所有区间均为估计，依据公开可比倍数和已披露财务数据。ARR 区间反映公司口径与第三方验证数字之间仍未解决的差异。概率权重仅为定性判断。
