  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的收入架构建立在两条已披露收入线上：商业企业 SaaS 和美国政府直接合同。商业板块把天气智能作为 API、平台订阅和预警服务，卖给航空、保险、能源、物流和建筑等企业。公开资料没有拆出商业
              ARR 的垂直行业、客户数或合同规模。政府板块因公共合同授予而更可验证：截至 2026 年 5 月，Tomorrow.io 在 NOAA 和美国空军 AFLCMC/HN（APFIT
              计划）下获得的已披露政府合同金额约 $33–35 million。第三条新生收入线——来自 DeepSky
              星座的空间基础设施数据——已经宣布，但截至研究日没有披露定价或签约收入。公开资料提到的潜在额外收入流还包括向第三方授权数据、专业服务和国际政府伙伴关系，但都没有财务量化。公司声称的 $100M ARR（2026
              年 2 月 F 轮营销材料引用）与 GetLatka 经 CEO 验证的 $24.4M（2025）相差 4×，这是本章单一最重大的未解决财务风险；没有经审计财务前，无法可靠使用收入倍数估值。
