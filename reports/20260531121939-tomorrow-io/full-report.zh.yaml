      - number: '1.2'
        title: 创始人、管理层与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              Tomorrow.io 由三名以色列国防军精英情报单位老兵于 2016 年创立，三人通过以色列的共同职业网络相识。截至报告日期，三位创始人仍全部担任高管。


              Shimon Elkabetz（CEO 兼联合创始人）是公司的公开面孔和战略负责人。他拥有 Ben Gurion University of the Negev 经济学学位和 Harvard Business
              School MBA。Elkabetz 负责公司的 GTM 策略、投资者关系和使命叙事。高管层的关键人物风险集中在他身上；如果他离职或失去履职能力，公司治理会受到实质性冲击。


              Rei Goffer（联合创始人兼首席战略官）承担技术和产品布道角色。Goffer 是卫星星座计划最常见的媒体发言人，曾发布 SpaceNews DeepSky 公告，并在 F 轮和 Gen1
              完成的报道中被大量引用。他在以色列国防军情报体系的背景，塑造了公司把天气数据包装成情报层的叙事。


              Itai Zlotnik（联合创始人兼首席运营官）管理内部运营和执行。Zlotnik 在外部媒体中的曝光较少，但多数核心新闻稿和投资者表述都会把他与 Elkabetz、Goffer 一起列出，包括
              HarbourVest 的 F 轮引述（「很高兴与 Shimon、Itai、Rei 和团队合作」）。


              创始团队九年保持完整——相较高流失率的 AI 创业公司同业，这是一个值得注意的治理正面信号。公开资料没有披露董事会构成或独立董事名单。Goldman Sachs & Co. LLC 担任 Tomorrow.io
              F 轮融资的独家财务顾问；Goodwin Procter LLP 担任法律顾问。这些顾问说明公司在资本事件周围具备机构级治理流程，但独立董事会治理细节仍是尽调缺口。


              关键人物集中度中等偏高：三位联合创始人在职能上互补（战略 / CEO、产品 / CSO、运营 / COO），能部分抵消单人离职风险；但公司没有公开继任计划，也没有披露 C-suite 以下的管理梯队深度。
