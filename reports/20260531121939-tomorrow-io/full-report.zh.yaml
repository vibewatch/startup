      - number: '5.2'
        title: 卫星与传感技术栈
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的空间层由两种不同卫星类型构成。十一颗 Tomorrow.io
              Microwave Sounder（TMS）卫星在 91–204 GHz 频率范围内运行（W、F 和
              G 波段通道），通过氧吸收测量大气温度，并通过 H₂O 波段测量水汽
              廓线。截至 2026 年 1 月 12 日，这一十一星微波探测仪星座实现了
              60 分钟全球天气重访率——达到过去需要国家级政府项目才能实现的
              观测节奏——并在任一给定时刻提供全球大部分可用微波探测仪数据。
              两颗专用 Ka 波段（35.5–36 GHz）降水雷达卫星（TR1 和 TR2）运行在约
              550 km 太阳同步轨道，提供 4.5 km 地面足迹和 250 m 垂直分辨率，
              并受 NASA CSDA 终端用户许可协议管辖。

              卫星架构是垂直整合的：Tomorrow.io 设计硬件，
              通过自研管线处理原始辐射计数据，输入 AI 原生
              建模系统，并将输出直接交付给面向客户的仪表盘和 API。
              2023 年 5 月的 Pathfinder 任务在 2024 年 8 月运行卫星发射之前
              验证了这一从空间到决策的架构。TMS 技术传承可追溯至 NASA/MIT Lincoln
              Laboratory 的 TROPICS 任务，Tomorrow.io 在 F 波段校准上实现了
              2–3 倍改进。该平台设计为兼容 JEDI-MPAS、FV3-JEDI 和 3DEnVar
              数值天气预报框架，使其能够直接同化进全球政府预报系统。
