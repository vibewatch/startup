        - 上市地球观测
        - $308M (FY2026)
        - ~$5.7B (18.5× P/S)
        - 18.5×
        - 规模最大的上市同业；政府待交付订单 >$900M；已达到盈利里程碑
        - 规模大得多；产品不同（影像 vs. 天气）；高溢价倍数未必可迁移
      - - IBM Weather Company → Francisco Partners（并购可比）
        - 私营 M&A 可比案例
        - 未披露（收入估计 $1B+）
        - '>$1B'
        - 未披露
        - 为规模化商业天气数据资产提供 M&A 底价参照
        - 规模和产品组合不同；财务细节未公开披露；2024 年交易
      - - Tomorrow.io（当前估值标记）
        - 私营 — Series F
        - $24M–$100M（有争议）
        - $1.04B
        - 10×（若 ARR 为 $100M）至 41×（若 ARR 为 $24M）
        - 直接研究对象；为可比表提供锚定语境
        - ARR 争议导致倍数区间极宽；无审计时估值缺乏锚
  - id: TV005
    title: 打破投资逻辑与终止触发项
    notes: 触发项定义为可观察、可衡量，且会实质改变投资判断的事件或披露。监测应贯穿尽调期和投后。
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 审计确认 ARR 低于 $40M
        - 最近财年审计 ARR < $40M
        - 按 $1B 入场对应 26×+ ARR 倍数；超过所有可比基准；叙事型估值站不住；下一轮有下轮风险
        - 当前价格坚决放弃；若估值按已确认 ARR 回调至 10–15×，再重新评估
      - - NOAA 合同未续约或实质削减
        - NOAA 来源收入减少超过 50%，或 CWDP 计划取消
        - 最高质量收入流消失；投资人材料中的数据验证可信度下降；触发企业 SaaS 客户信心风险
        - 退出持仓，或在投入前要求补救计划和政府替代收入
      - - DeepSky 星座延误超过 18 个月
        - 首个完整星座投入运营时间滑到 2028 年中之后
        - 星座数据尚无收入贡献，烧钱期被拉长；需要增量融资；连续稀释损害所有投资人的股权价值
        - 下调信心；投入前要求更新资本开支计划和剩余资金缺口桥接方案
      - - 新 Series F 或过桥轮估值低于 $1B
        - 任何按投后估值 <$1B 定价的股权融资（下轮）
        - 确认市场重定价；触发早期投资人的反稀释条款；普通股持有人承受更高稀释；$1B 估值合理这一逻辑失效
        - 立即停止投资；跟踪价格重置和更好的入场点
      - - CEO（Shimon Elkabetz）或 CTO 离职
        - Elkabetz 或核心创始技术负责人宣布离职
        - 创始人主导战略存在转向风险；NOAA 和政府关系可能依赖个人关系；DeepSky 执行问责出现缺口
        - 暂停，投入前评估继任安排；管理层连续性是门槛条件
  - id: TV006
    title: 最终尽调要求
    notes: 事项按重要性排序。第 1–3 项为阻断项——没有这些材料就无法承做投资。第 4–5 项重要但取决于具体语境。所有请求应发给公司管理层和投资者关系团队。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 审计 ARR 与收入拆分
        - 审计年度财务报表，或经签署的投资人材料 ARR 明细表，并用合同定义区分 SaaS ARR 与政府合同 TCV
        - 解决 $24.4M（GetLatka）与 $100M（公司主张）之间 4× 差异；没有该材料，就无法做收入倍数分析，估值只能停留在叙事
        - 公司 CFO；索取 NDA 前资料室概要材料；要求明确 ARR 定义
      - - 分业务毛利率
        - 分业务 P&L，拆出 SaaS 软件毛利率与卫星运营收入成本；DeepSky 制造硬件 COGS 明细
        - 综合毛利率未知；卫星运营可能把合并毛利率压到 40% 以下，从根本上改写盈利路径模型和退出倍数
        - 公司 CFO；以 Spire Global 披露的 41% 综合毛利率作基准对照
      - - 烧钱速度与现金跑道
        - 最近一个季度月度现金消耗；Series F 后按当前轨迹预测的现金跑道；过桥融资情景
        - $210M 融资对应未知烧钱速度，资本充足性不透明；若每月烧钱超过 $15M，现金跑道将 <18 个月，下一轮融资可能显著稀释 Series F 投资人
        - 公司 CFO 和董事会；用员工数和卫星 COGS 交叉验证
      - - 优先清算瀑布与股权结构表
        - 完整股权结构表，覆盖期权池、认股权证、可转债，以及 Series A 到 F 的清算优先权条款；任何反稀释条款
        - $1.04B 投后估值只是表面数字；经过优先清算瀑布后，普通股实际价值可能低得多；这是按不同退出价格建模回报的关键
        - 公司总法律顾问和 CFO；后期尽调的标准资料室材料
      - - DeepSky 资本开支计划与政府合同管线
        - 部署完整 DeepSky 星座的全口径成本；当前制造状态；已识别的星座数据政府合同管线（NOAA、DoD、国际）
        - 若星座总成本超过 $300M 且需要继续股权融资，即便乐观情景退出，连续稀释也会侵蚀 Series F 入场回报
        - 公司业务拓展和技术团队；与 DoD、NOAA 采购记录交叉核对
