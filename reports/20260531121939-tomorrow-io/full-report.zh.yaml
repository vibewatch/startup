  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块图谱
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的产品组合横跨三个层级，三者共享同一个数据骨干，
              该骨干来自其自有卫星星座和 AI 驱动建模栈。
              第一层是 Weather API——一个 REST/JSON 接口，提供 60+ 数据层，
              包括降水、温度、风、空气质量、花粉、太阳辐照度、
              闪电、土壤湿度、道路状况、火灾风险指数以及全球任意
              位置的洪水风险。该 API 支持免费开发者层级，可对核心端点
              进行限速访问；同时提供通过直销定制的企业计划，包含基于 SAML 的
              SSO、自定义 SLA，以及按需每秒速率扩展。该平台作为云原生 SaaS
              产品同时在 AWS Marketplace 和 Microsoft Azure Marketplace 上可用，
              使企业能够通过既有云账单关系完成采购。

              第二层是企业 Weather Intelligence Platform——一个无代码仪表盘
              和工作流层，增加了受监控位置、跨点、多边形和折线地理区域的
              基于规则告警、洞察自动化以及天气事件跟踪。第三层包括行业专用
              智能套件：面向航空的 Altitude、专用农业工作流、物流路线监控，
              以及政府/国防集成。客户包括 Fortune 500 前十名中的六家公司。
              三个层级全部由同一自有大气数据层供给，形成连贯的数据到决策
              价值链，使 Tomorrow.io 区别于纯数据转售商。
