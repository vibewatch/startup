      - number: '8.5'
        title: 退出准备度与回报画像
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Tomorrow.io 没有宣布 IPO 时间表，也没有公开 S-1 申报。公司最近一次公开退出尝试，是 2021 年 12 月以 $1.2B 估值与 Pine Technology
              Acquisition Corp 进行 SPAC 合并；该交易在 2022 年 3 月以市场环境不佳为由终止。同业太空 SPAC（Virgin Orbit、Terran Orbital）赎回率超过
              80%，行业分析（Quilty Space，2024）认为 Tomorrow.io 避开这一结果算是幸运。当前 $1B 私募估值只比已放弃的 $1.2B SPAC 估值低
              $200M，若公司上市前不能实现实质收入增长，IPO 路径的潜在上行会被压缩。Forge Global
              显示市场活动有限且无已撮合二级交易，意味着早期投资人难以获得部分流动性。战略买方收购——大型云厂商（AWS、Google、Microsoft）、国防主承包商，或 PE
              支持的天气数据整合者——是现有投资人近期最可能的退出路径。Francisco Partners 以 >$1B 收购 IBM Weather Company，为规模化商业天气数据业务建立了合理 M&A
              可比；不过，相比该可比，Tomorrow.io 的星座基础设施既增加可选性，也增加执行风险。Series F 投资人以 $1B 入场若要取得 3× 回报，需要 $3B 退出估值；只有乐观情景可达到，且意味着
              2028–2030 年时间线。若按 $600M–$960M 的基准退出，Series F 投资人将面临减记。Pitango 作为现有内部投资人在 2026 年 5
              月扩展轮中继续加码，是正面的信心信号，但在尽调语境中不能替代经审计财务。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV027
              - CV028
              - CV029
              - CV035
          - type: table
            tableRef: TV005
            claimRefs: []
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.6'
        title: 投资建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              对于按 $1B Series F 估值进入的新资金，整体投资建议是有条件关注——观察。证据支持这样一家公司：技术资产确实差异化，投资人质量达到机构级，运营数据经 NOAA
              验证，可触达市场庞大但仍未证明。这些信号支持投资逻辑。但三个阻断性尽调缺口让评级无法转为正面：（1）4× ARR
              差异仍未解决且影响重大——对任何收入倍数估值来说，这是最关键指标；（2）分业务毛利率未知，卫星重资本运营对 SaaS 式经济性的拖累无法建模；（3）Series F
              后烧钱速度和现金跑道未披露，资本充足性和稀释时间线无法评估。若投资人在没有这些数据点的情况下按 $1B 投入，本质上是在投叙事，而不是投模型。若数据室以经审计材料确认 $100M ARR、60%
              以上混合毛利率、按当前烧钱速度还有 24 个月以上现金跑道，且优先权清算瀑布可控，投资可进入可执行状态，评级为审慎正面，退出倍数目标为 10–12× ARR、对应 $1.5–2.0B。若经审计 ARR 低于
              $40M，相比上市可比公司，入场价无法自洽，应坚决放弃。因此，建议完全取决于数据室访问和财务审计。无论情景如何，风险评级均为高，驱动因素包括卫星执行风险、ARR 不透明、政府集中度、SPAC 失败记录，以及
              DeepSky 的稀释性资本需求。当前建议的置信度为中——证据足以形成观点，但不足以在没有额外尽调的情况下执行。
            claimRefs:
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV006
            claimRefs: []
