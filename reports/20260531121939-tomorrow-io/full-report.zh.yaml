        - 若共同创始人在战略、估值或退出时点上分歧，离职风险会相关；投资人或董事会推动的变革可能触发多人同时离开
        - 低至中
        - 高
        - 机构董事会（HarbourVest、Stonecourt、Pitango）提供治理监督；后期轮次通常配有长期股权归属安排
        - 索取归属时间表、联合创始人锁定协议，以及股东协议中针对联合创始人离职情形的条款
      - - 卫星运营和 AI 天气建模的技术人才留存
        - SpaceX、Maxar、Planet Labs 以及大型 AI 公司争抢深科技和 ML 人才；公司总部在波士顿，还要与旧金山 / 西雅图 AI 人才中心竞争
        - 中（行业普遍挑战）
        - 中
        - 以色列科技生态（公司创立于以色列，核心研发部分仍在当地）以及 NVIDIA/AWS 合作叙事，有助于吸引人才；有竞争力的薪酬可能已由 Series F 资金覆盖
        - 索取按职能拆分的流失率、2022 年以来关键岗位招聘记录，并对比录用通知接受率与往年水平
  - id: TR005
    title: 缓释措施与终止标准表
    notes: 终止标准指触发后会实质推翻投资逻辑的阈值事件。监测信号是可观察的领先指标。缓释成熟度评级反映截至 2026 年 5 月可取得的证据。
    claimRefs:
      - CR006
      - CR008
      - CR009
      - CR013
      - CR020
