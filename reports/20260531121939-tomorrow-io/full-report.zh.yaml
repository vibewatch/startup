      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的上市可比公司主要落在卫星数据和天基分析板块，同时参考部分商业天气数据在位公司。Spire Global (NYSE: SPIR) 是最接近的卫星天气数据上市纯标的，企业价值约
              $846M，过去十二个月收入 $75M，隐含 EV/Revenue 约 11×。Spire 报告 2025 年 Q4 GAAP 收入 $15.8M，2025 全年收入 $71.6M；其 2026 年
              $75–$85M 指引意味着剥离海事业务后的持续经营业务收入增长 50% 以上。BlackSky Technology (NYSE: BKSY) 提供更高倍数参照：企业价值约 $2 billion，LTM 收入
              $119M，隐含 EV/Revenue 约 17×。Planet Labs (NYSE: PL) 以 FY2026 收入 $308M 计，远期市销率约 18.5×，是同业中最高倍数，反映其超过 $900M
              的规模化经常性政府合同积压。这些上市可比公司为高增长、政府合同支撑的卫星数据公司划出 11–18× EV/Revenue 的可辩护区间。私募侧，IBM Weather Company 于 2024 年 2
              月出售给 Francisco Partners，估计估值超过 $1 billion，为规模化商业天气数据业务提供了相关 M&A 可比。Tomorrow.io 的 $1B 估值若按公司声称的 $100M ARR
              计算为 10×，落在上市可比区间底部；若按 GetLatka 的 $24.4M 计算为 41×，显著高于可比上限。若采用 $60M 的中性 ARR，则约为 17×，处在上市可比区间高端；如果 DeepSky
              星座能支撑数据即基础设施的溢价倍数，而不是纯 SaaS 倍数，这一水平仍可辩护。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV019
