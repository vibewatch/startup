            figureRef: FM001
            claimRefs: []
          - type: figure
            figureRef: FM002
            claimRefs: []
      - number: '2.3'
        title: 买方分层与预算归属
        blocks:
          - type: paragraph
            body: >-
              按收入集中度看，企业天气买方落在五个主要垂直行业。航空与航天（商业航空公司、货运承运商、MRO 服务商、空中交通管理）是最大板块，按 Mordor Intelligence 和 Future Market
              Insights 的口径，约占天气服务支出的 23–26%。这些买方采购运营签派工具、湍流预警和燃油消耗优化 API；预算归属飞行运营和安全部门，采购周期 12–24 个月。由于 FAA/EASA
              运营流程集成，切换成本较高。Tomorrow.io 将 JetBlue 和 Delta 列为航空客户。


              能源和公用事业（电网运营商、可再生能源资产所有者、油气物流）约占支出
              20%。买方需要概率负荷预测、风暴路径路由和可再生能源发电临近预报；预算归属运营技术和风险团队。物流和运输（最后一公里配送、铁路、航运）需要中断预报和路线优化；BNSF Railway 是已披露的
              Tomorrow.io 客户。保险和金融（参数化天气触发、巨灾债承销）需要高分辨率历史和实时数据来结算合同；随着参数化产品从巨灾扩展到日常运营风险，这一板块增长最快。政府和国防是单独渠道——Tomorrow.io
              在 F 轮时披露约 $30 million 国防部合同——采购通过 IDIQ 载体和 OTA 完成。
            claimRefs: []
          - type: table
            tableRef: TM003
            claimRefs: []
          - type: figure
            figureRef: FM003
            claimRefs: []
      - number: '2.4'
        title: 增长驱动因素与采纳约束
        blocks:
          - type: paragraph
            body: >-
              主要需求驱动来自天气敏感型决策系统的加速部署，这些行业过去长期依赖免费公共部门数据。气候波动正在提高天气驱动运营中断的频率——2023–2025
              年间，飓风、野火和洪水事件屡创纪录，给物流、能源和保险买方造成直接运营成本，也让高端天气智能的 ROI 更容易成立。与此同时，NOAA FY2026 拟议预算削减约 27%（申请 $4.5 billion，低于
              FY2025 已批约 $6.1 billion），包括可能取消 Office of Oceanic and Atmospheric Research（$700 million）以及 2,300+
              个岗位，正在制造公共部门能力真空，商业供应商正好可以补位。


              采纳约束同样显著。企业天气 API 必须把数据管道接入既有运营系统（ERP、TMS、签派工具），实施摩擦会把大客户销售周期拉长到 6–12 个月以上。按查询计费会让高频用户（例如每天发出数百万次 API
              调用的物流平台）支出不可预测，引发预算审查。信任和准确性验证也是门槛：企业买方切换前会与既有数据供应商并行测试 3–6 个月，IBM Weather Company 等老玩家又拥有深厚机构关系。最后，即便是
              Tomorrow.io 的 13 颗 DeepSky 星座，基于卫星的观测数据仍受重访时间限制——60 分钟重访还无法匹配 GOES-East 在强对流天气上的 15 分钟以内节奏。
            claimRefs: []
          - type: table
            tableRef: TM004
            claimRefs: []
          - type: figure
            figureRef: FM004
            claimRefs: []
      - number: '2.5'
        title: 市场结构与证据缺口
        blocks:
          - type: paragraph
            body: >-
              商业天气智能市场分散在三层玩家之间：全栈平台（Tomorrow.io、IBM Weather Company/The Weather Company）、数据聚合商和卫星运营商（Spire
              Global、Planet Labs、Maxar），以及垂直专家（面向农业 / 能源的 DTN、填补中纬度空白的 Climavision、面向广播 / 应急的 Baron Weather）。IBM 的
              Weather Company 子公司掌握最大的商业数据集（270,000+ 个个人气象站、200,000+ 架飞机观测）和深厚企业分销，但自 2022 年从 IBM 分拆后，企业 API
              投入优先级下降。Spire Global 披露 FY2025 收入 $71.6 million，并给出 2026 年 $75–85 million 指引；这说明其规模明显小于 Tomorrow.io 声称的
              $100 million ARR，但卫星足迹更广（110+ 颗卫星，覆盖 AIS、GNSS-RO 等多域）。


              关键证据缺口：（1）Tomorrow.io 的 $100 million ARR 没有独立验证——该数字由公司披露，研究时没有第三方文件或分析师确认。（2）企业 SaaS 天气智能
              SAM——也就是把商业天气平台的可服务市场与更宽的预报服务市场区分开——没有任何机构单独拆出；$2.5–3.5 billion 数字混合了政府、广播和消费者支出。（3）IBM Weather Company
              2022 年后没有单独披露收入；分析师笔记的代理估算为年收入 $600–900 million，若准确，则是 Tomorrow.io 的 6–9x。（4）NOAA
              预算削减带来的监管替代风险还没有转化为可量化的商业合同增量；重新采购时间不确定，可能需要 2–4 年。
            claimRefs: []
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合定义与市场结构
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io
              所处市场有五类竞争者，每类带来的替代风险、战略意图和客户重叠都不同。第一类也是风险最高的一类，是直接平台对手：全栈天气智能供应商，销售把数据、模型、预警和工作流工具组合起来的企业订阅。The Weather
              Company（2024 年被 Francisco Partners 从 IBM 收购）和 DTN 是主要直接同业，竞争同一批企业买方和用例。第二类是卫星数据聚合商和上游数据供应商——Spire
              Global、Meteomatics 和 Planet Labs——它们销售原始或轻度处理的大气数据，既可能替代 Tomorrow.io 的
              API，也可能被竞争对手用来搭建对手平台。第三类是垂直专家：Climavision（为公用事业和能源填补雷达空白）、Baron Weather（广播和应急管理）以及 Xweather /
              Vaisala（闪电和道路天气）。这些专家今天大体互补，但一旦拓宽范围，会带来相邻市场风险。第四类是现状替代方案：NOAA 的 National Weather Service、European Centre
              for Medium-Range Weather Forecasts（ECMWF）和 OpenWeatherMap
              提供的免费公共部门数据。多数小企业和开发者用例只需要「够用」的替代方案；这也是可转化非客户中最大的一池。第五类是可能进入者：超大规模云厂商（Google、Microsoft Azure）、AI
              基础模型实验室（Google DeepMind 的 GraphCast、Huawei Pangu-Weather、NVIDIA
              Earth-2）以及拥有卫星项目的国防主承包商。市场顶部仍然碎片化：按收入估计，没有单一供应商份额超过
              25–30%；多供应商并用很普遍——大型企业通常同时从两个或更多供应商采购天气数据，这限制了部分账户的独占性和切换成本。
            claimRefs: []
          - type: table
            tableRef: TP001
            claimRefs: []
