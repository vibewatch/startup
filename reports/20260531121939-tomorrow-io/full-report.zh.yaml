      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              三个情景框住估值和回报空间。乐观情景假设 Tomorrow.io 的 ARR 到 2028 财年达到 $150M，DeepSky 按计划在 2027 年交付运营数据，政府合同在 NOAA 资金正常化后扩张，公司在
              SaaS 加数据的混合业务上实现 60% 以上毛利率。该情景下，15–20× ARR 退出倍数可实现，对应 $2.25–3.0 billion 退出估值，Series F 投资人持有 3–4 年可获得 2–3×
              回报。基准情景假设 2028 年 ARR 落在 $60–80M 区间，即在公司声称 $100M 与 GetLatka $24.4M 之间折中；年增长 30–40%，DeepSky
              存在部分延误风险，政府合同稳定。10–12× ARR 倍数对应 $600M–960M 退出估值，低于当前 $1B
              估值，并构成后期投资人的本金亏损情景。若没有显著倍数重估，基准情景在当前入场价下回报为负。悲观情景假设 ARR 差异最终落向低端（$24–35M），DeepSky
              出现显著发射延误或成本超支，需要以持平或下轮估值追加融资，NOAA 预算削减落地，且利率维持高位使公开市场可比公司到 2028 年压缩至 8–10× EV/Revenue。该情景退出估值为
              $400–600M，意味着相对 $1B 入场价损失 40–60% 资本。按乐观（20%）、基准（50%）、悲观（30%）加权，预期退出价值约 $950M–$1.2B，意味着 Series F 投资人在当前 $1B
              估值下只能拿到持平到小幅正回报——若数据室不能确认 $100M ARR 叙事，这不足以满足多数机构后期投资回报门槛。
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
          - type: table
            tableRef: TV003
