      - number: '5.3'
        title: 数据质量、验证与政府集成
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的卫星数据在 2025 年和 2026 年由三个美国政府机构
              独立评估，建立了所有商业气象卫星公司中最强的独立质量记录。
              NOAA 2026 年 1 月的 Commercial Data Pilot 中期评估发现，TMS 仪器
              生成的数据“校准良好，整体上可与 ATMS 相比”——ATMS 是 NOAA 旗舰
              Advanced Technology Microwave Sounder——并具备强跨卫星一致性、
              辐射精度以及水汽通道低噪声。来自 TMS 数据的 Level-2 产品
              满足 NOAA Joint Polar Satellite System 项目使用的要求。
              NOAA 强调 Tomorrow.io 在侦察机停飞且传统传感器离线时捕捉
              Hurricane Erin 快速增强的能力。

              Joint Center for Satellite Data Assimilation（JCSDA）由 NOAA、NASA、美国
              空军和美国海军资助，进行了六个月评估（2024 年 9 月–2025 年 2 月），
              发现其对系统产生“压倒性正面影响”——在全球所有大气层级提升温度、
              水汽和风预报准确性。2025 年 12 月，Tomorrow.io 的卫星数据进入 NOAA
              的 AWIPS2 运行系统——National Hurricane Center 使用的同一界面——用于
              实时测试。一份 $2.27 million 的 NOAA NESDIS CWDP 合同（2024 年 10 月）
              以及 2025 年 5 月覆盖大西洋飓风季的延期，同时提供了收入验证和持续
              质量评估基础设施。
