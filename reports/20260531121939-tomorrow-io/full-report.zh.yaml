      - number: '6.6'
        title: 政府集中度与采购风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的政府收入流在结构上集中于少数美国联邦交易对手：
              NOAA（Commercial Weather Data Pilot 合同，多次延期）、美国空军 / AFLCMC
              （DoD APFIT 合同，$10.2M，2024 年 5 月）和 NASA（CSDA 计划）。
              这三段关系同时为持续卫星数据采购和底层卫星制造计划提供资金，
              后者驱动 Tomorrow.io 的技术差异化。NOAA CWDP 合同的终止或不续约
              将同时削弱收入和支撑企业销售的验证可信度。Forbes 文章（2025 年 3 月）
              明确警告，几乎所有商业天气公司——包括 Tomorrow.io——仍依赖 NOAA/NWS
              公共数据作为预报模型的原料，即使自有卫星能力增长，这种依赖也无法
              完全消除。

              DOGE 推动的 NOAA 削减（截至 2025 年 2 月，最多 20% 员工被解雇，
              并提出终止设施租约）创造了一种情景：政府数据质量下降，Tomorrow.io
              被迫以其并非为此设计的规模替代国家气象服务。CEO Elkabetz 在 Forbes
              中承认“地球 90% 区域没有实时、高质量数据”，并表示取代 NWS
              “不是我的工作”。如果 DOGE 削减加速，这会带来声誉和运营暴露。

              除联邦集中度外，Carahsoft 渠道为美国政府销售引入分销商依赖；
              Carahsoft 的 GSA Schedule 或财务状况变化可能扰乱政府管线。
              国际政府客户（菲律宾、尼日利亚、巴哈马）处于早期、事件驱动阶段，
              主要通过许可协议而非经常性企业 SaaS 合同变现。政府采购延迟常见——
              AFLCMC 合同在 2021 年开始先前接触后直到 2024 年 5 月才落地——而
              扩展国际政府客户的采购周期可能沿用多年时间线，续约条款不确定。
