      - number: '3.3'
        title: 相邻玩家、卫星数据供应商与替代品
        blocks:
          - type: paragraph
            body: >-
              Spire Global（NYSE: SPIR）是结构上最重要的相邻竞争者：这家上市卫星数据公司运营 110+ 颗卫星星座，载荷覆盖无线电掩星、AIS、GNSS-RO 以及新兴高光谱微波探测。Spire 披露
              FY2025 收入 $71.6 million，同比下降 35%，原因是 2025 年 4 月剥离海事业务；但剔除海事后，收入增长 44%。其 2026 年收入指引为 $75–85
              million，反映公司目标是核心业务增长超过 50%。Spire 的主要政府合同包括 NOAA 的无线电掩星和海风数据奖项；EUMETSAT 续签了 EUR 3 million 天气数据合同。Spire
              的天气业务服务政府机构（NOAA、EUMETSAT、NASA）和商业企业（AiDASH，用于公用事业电网植被风险）。不过，Spire 的产品主要是数据供给——天气 API、大气剖面、ShipView
              海事路由——而不是一体化企业决策平台。这让 Spire 同时是数据授权合同竞争者，也可能成为平台（历史上包括 Tomorrow.io）的底层数据供应商。如果 Spire 把平台从数据 API
              纵向延伸进决策软件，它对 Tomorrow.io 的竞争风险会升高。


              Meteomatics（瑞士，私营）和 Xweather / Vaisala（芬兰集团）服务数据科学和开发者 API 层。Meteomatics 提供 1,800+
              个天气参数、自研高分辨率模型（EURO1k、US1k）、历史档案，以及适合 AI/ML 训练工作流的多边形和路线查询能力。企业定价定制。Xweather（前 AerisWeather，后被 Vaisala
              收购）靠 Vaisala 自有闪电探测网络数据——一项自有观测资产——以及专门的道路天气、冰雹和恶劣天气 API 做差异化。Xweather 定位为开发者优先 API，同时具备企业 SLA，在 IoT
              和嵌入式分析的精准天气数据中有竞争力。Meteomatics 和 Xweather 都没有 Tomorrow.io 已经搭出的垂直 SaaS 套件、智能体自动化或卫星星座。


              AccuWeather for Business 服务活动、零售和学校，分层套餐据称入门计划接近每月 $25，并可扩展到定制企业定价。AccuWeather 对 SMB 和中端市场买方是强品牌，但缺少定义
              Tomorrow.io 2026 年定位的超本地卫星数据、智能体 AI 能力和行业专用决策工具。NOAA 和各国气象服务是覆盖最广的替代品：免费公共部门数据能满足多数消费者和小企业用例。NOAA FY2026
              拟议预算削减约 27%，正在压缩公共数据可用性、强化商业化论证，但替代不会立刻发生——政府和大型企业重新采购的周期估计为 2–4 年。
            claimRefs: []
      - number: '3.4'
        title: 能力、定价与分销对比
        blocks:
          - type: paragraph
            body: >-
              放在整个竞争集合中看，Tomorrow.io 平台靠四项累积优势拉开差异，且很难被同时复制：（1）自有卫星观测资产（13 颗 Gen1 星座，DeepSky 已宣布）；（2）AI 原生垂直套件（面向航空的
              Altitude、面向保险的 Shield）；（3）智能体 AI 能力（Gale AI assistant、MCP server 集成于 2026 年春季推出）；（4）政府 / 国防收入渠道（F 轮时 $30M+
              DoD 相关合同）。2026 年没有单一竞争对手同时匹配四个维度。The Weather Company 在数据深度和企业分销上匹配，但缺少自有卫星星座，也没有推出智能体功能。DTN
              在垂直深度和运营智能上匹配，但缺少卫星资产和政府 / 国防规模。Spire 在卫星深度上匹配，但缺少垂直 SaaS 和智能体能力。


              竞争集合中的定价信号跨度很大。The Weather Company 公开的 Standard API 层每月 $500，可调用 1 million 次；企业和主要航空公司合同未披露。AccuWeather
              for Business 入门套餐约每月 $25。Meteomatics 和 Xweather 采用定制企业报价，没有公开定价。DTN 和 Climavision 只做企业定制。Tomorrow.io
              不公开定价，采用 SaaS + 企业定制模式，与其约 $100M ARR 说法一致。整个竞争集合的定价不透明限制了直接比较；关键尽调缺口是 Tomorrow.io
              的平均合同金额、总留存率和扩张收入率相对直接同业的表现。


              分销模式差异明显。TWC 借 IBM 企业关系和自身每天 50 million 消费者触点提升品牌认知。DTN 通过直接企业销售和私人气象学家网络分销。Spire 通过政府直接采购（IDIQ 载体、OTA
              合同）和商业 API 渠道分销。Tomorrow.io 已宣布原生 MCP server，可接入 AI 智能体框架；如果企业 AI 部署加速，这会成为分销优势。Tomorrow.io 还与 Palantir
              合作国防情报集成、与 NVIDIA 合作 AI 模型基础设施，获得 DTN 或 Climavision 无法匹配的国防和企业 AI 渠道曝光。
