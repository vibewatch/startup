  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与垂直行业组合
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 服务七个不同垂直行业的客户：航空、物流
              与供应链、能源、保险、农业、体育与娱乐，以及
              政府与国防。公司称拥有超过 250 家企业和政府
              组织客户，并另称有超过 30,000 名开发者通过免费和付费层级访问
              Weather API。Fortune 500 前十名中的六家公司被描述为客户，
              但所有六家具体身份并未在公开披露中确认；具名的 Fortune 500
              相关参考包括 JetBlue（NYSE 上市但不在 Fortune 500 内）、Lufthansa、
              Delta、United、Uber、Ford、BNSF Railway 和 Amazon，
              以及 Fox Sports 和 New England Patriots。

              从地域看，客户基础以北美为核心，但覆盖欧洲
              （Lufthansa、南美的 Azul）、菲律宾（National Irrigation Administration
              合作，2025 年 6 月）、尼日利亚（NiMet/Federal Ministry of Agriculture
              合作，2026 年 2 月）和巴哈马（灾害准备）。美国的政府和机构
              客户包括 NOAA、NASA 和美国空军，它们通过数据采购合同和卫星开发计划
              向 Tomorrow.io 提供资金。Carahsoft Technology Corporation 作为美国政府
              采购的转售商，帮助其通过 GSA Schedule、GovWin 及相关合同载体获得访问。

              开发者分部——主要通过 Weather API——采用免费增值
              模式，有免费层和付费计划，带来高容量使用但单位收入较低。
              企业客户（航空、物流、政府）通过多年订阅和服务合同贡献大部分
              经常性收入。农业垂直行业是一个新兴分部，主要通过政府合作和
              菲律宾 Agrilever 等农业科技中介触达。
