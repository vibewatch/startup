      - number: '5.4'
        title: Altitude 航空智能平台
        blocks:
          - type: paragraph
            body: |
              Altitude 是 Tomorrow.io 面向航空的专用智能产品，其定位不是天气数据源，
              而是直接嵌入航空公司系统、决策工作流和网络运营中的运营基础设施。
              该平台由 Tomorrow.io 的 AI 引擎 Gale 驱动，并建立在自有卫星星座和
              快速刷新 AI 驱动天气模型之上。Altitude 通过标准化 API、围绕每家运营商
              特定运营逻辑配置的基于规则告警，以及无需人工扫描或数据聚合的持续
              全网监控，交付全球一致的高分辨率预报。

              截至 2026 年 3 月，Lufthansa 已在其整个网络中部署 Altitude，覆盖约
              800 个日航班和超过 150,000 名日乘客——将天气视为“运营内部的可编程层”，
              而非参考工具。Aviation Suite 包括 METAR/TAF 集成、SIGMET、来自全球 VAAC
              中心的火山灰警报、湍流和结冰层、带阵风阈值的跑道特定侧风监控、
              World Area Forecast System（WAFS/ICAO 合规）高空数据、地面锋面可视化，
              以及航班时刻叠加。单次基于不完整天气情报的备降决策会让航空公司每个航班
              损失 $22,000 到 $240,000，为嵌入式运营智能创造可衡量的经济正当性。
              其他航空客户包括 JetBlue 和 Delta，均在公司披露的航空公司关系之列。
