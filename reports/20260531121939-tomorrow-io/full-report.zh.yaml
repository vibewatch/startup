chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              Tomorrow.io 总部位于美国马萨诸塞州波士顿，业务交汇在商业航天技术、生成式 AI 和企业软件之间。公司 2016 年以 ClimaCell 之名创立，2021 年 3 月更名为
              Tomorrow.io，释放的信号是：它的野心不止于原始天气数据，而是要把数据变成可执行的运营智能。CEO Shimon Elkabetz 在 F
              轮公告中说，公司「不只是预报未来，而是帮助政府、行业和社区据此行动」。


              公司的使命是改变地球观测方式，让天气智能成为全球政府、行业和社区的基础设施。它给自己的定位是「全球领先的韧性平台™」——这一表述有意把天气数据从商品化输入抬高为关键任务决策层，地位接近网络安全基础设施。


              运营模式纵向整合三层：（1）自研空间硬件——Ka 波段雷达和微波探测卫星星座；（2）AI 驱动建模——基于物理和生成式 AI
              的预报引擎，把原始卫星观测转成影响预测；（3）企业软件——仪表盘、API、自动预警和智能体工作流产品。全栈架构意味着 Tomorrow.io
              自己生产上游数据，而不只依赖政府气象服务；这构成一条战略护城河，主要依赖 NOAA/NWS 数据的 AccuWeather 和 The Weather Company 并不具备。


              收入来自企业软件订阅和政府数据即服务合同。到 2026 年 2 月 F 轮时，公司披露 ARR 约 $100 million，服务 250 多家组织。美国 Fortune 500
              前十名中超过半数使用该平台；公司还持有约 $30 million 的美国国防部太空天气感知累计合同。


              总部设在波士顿。公司还在以色列 Tel Aviv 设有研发中心，截至 2026 年初员工数估计为 150–200 人。法律实体注册为 Tomorrow Companies Inc.（美国空军合同中列明的实体）。
