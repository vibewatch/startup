    approximationNotes: 所有区间均为定性估计，基于公开可比公司倍数套用 ARR 情景。实际回报取决于优先股清算瀑布、未来融资摊薄、退出时点，以及 IPO 或 M&A 时的公开市场环境。基准和悲观情景代表 Series F 投资人低于入场价的回报。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV035
  - id: FV004
    title: 投资 KPI — 投委会可用的关键维度评分
    type: kpi
    summary: 基于截至 2026 年 5 月的公开证据，对 Tomorrow.io 八个投委会维度打分。标为低置信度的项目不确定区间很宽。执行前，绿色信号也必须由资料室确认。
    data:
      items:
        - label: 市场机会
          value: High (4/5)
          note: $3–5B+ 可触达商业天气智能市场；气候风险扩大需求；结构性顺风已确认
        - label: 技术 / 产品护城河
          value: Strong (4/5)
          note: NOAA 验证的运营级星座；硬件加软件双重护城河；未发现直接私营市场复制者
        - label: 收入质量
          value: Mixed (3/5)
          note: 政府合同质量高（里程碑门控、技术验证）；商业 SaaS ARR 存在争议且未经审计
        - label: 财务透明度
          value: Poor (1/5)
          note: ARR 存在 4× 差异；未披露毛利率、烧钱速度或优先股清算瀑布；足以阻断任何投资决策
        - label: 估值 vs 可比公司
          value: Conditional (2/5)
          note: 若 $100M ARR 确认，10× 可辩护；若 $24M ARR 确认，41× 无法辩护；不确定区间太宽，无法最终打分
        - label: 退出准备度
          value: Low (2/5)
          note: 没有 IPO 时间表；2022 年 SPAC 在 $1.2B 估值失败；二级市场不活跃；M&A 路径可行但偏猜测
        - label: 风险画像
          value: High Risk (2/5)
          note: 卫星执行风险；NOAA 资金集中；DeepSky 资本开支导致连续稀释；ARR 不透明；SPAC 失败先例
        - label: 投资人质量
          value: Good (4/5)
          note: HarbourVest、Stonecourt、Pitango、Harel — 机构质量；Pitango 内部人再投资传递信心；未披露锚定 LP 风险
    approximationNotes: 评分是基于截至 2026 年 5 月公开证据的定性评估。没有可用的经审计财务数据、股权结构表或资料室材料。评分改善取决于能否进入资料室。总体信号：没有资料室不投。
