      - number: '1.4'
        title: 产品、技术与客户基础
        blocks:
          - type: paragraph
            body: >
              Tomorrow.io 的核心商业产品是 Weather Intelligence Platform——一套企业 SaaS，通过网页仪表盘、API
              和自动预警提供实时、历史和预测性天气数据。平台把原始大气数据转成按行业定制、以影响为中心的行动建议：面向航空公司，建议备降或除冰准备；面向铁路运营商，在横风风险下给出特定里程标的限速；面向保险公司，在冰雹事件前提前提醒保单持有人。公司用
              Altitude™（航空专用）等名称营销平台，并把产品策略描述为越来越「智能体化」——AI 智能体嵌入客户运营系统。


              卫星星座构成上游数据护城河。Tomorrow.io 的首颗雷达卫星 Tomorrow-R1 于 2023 年 4 月 15 日搭乘 SpaceX Transporter-7
              发射，成为首颗入轨的商业建造天气雷达卫星。第二颗雷达卫星 R2 于 2023 年 6 月 12 日搭乘 Transporter-8 发射。微波探测卫星 S1 和 S2（6U CubeSat）于 2024 年 8
              月搭乘 SpaceX Transporter-11 发射。到 2026 年 1 月 12 日，公司宣布完成首个星座（13 颗卫星），实现全球 60 分钟重访——这一节奏过去通常需要国家级航天计划才能做到。


              NOAA 于 2026 年 1 月独立验证该星座，认为 Tomorrow.io 的 Microwave Sounder（TMS）仪器产出「校准良好、总体可与 ATMS 相比」的数据；ATMS 是 NOAA 旗舰
              Advanced Technology Microwave Sounder。Tomorrow.io 也进入 NASA Commercial Satellite Data
              Acquisition（CSDA）计划供应商名单，并获得约 $30 million DoD 合同，包括 2024 年 7 月授予的 $10.2 million AFLCMC/APFIT 合同，为美国空军
              Weather Systems Branch 建造两颗微波探测卫星。


              2026 年 1 月 20 日，Tomorrow.io 发布 DeepSky——它称之为「全球首个 AI 原生、基于太空的大气与海洋感知网络」。DeepSky
              将采用更大的卫星（相比当前鞋盒到迷你冰箱大小的型号，更接近汽车大小）、覆盖大部分电磁频谱的多模态传感器，以及大幅提升的重访频率。2025 年 3 月，Tomorrow.io 宣布与 NVIDIA 围绕
              Earth-2 平台开展技术合作，用于 AI 加速天气和气候建模。2025 年中宣布的 Palantir 合作，把 Tomorrow.io 卫星情报集成进 Palantir 的 FedRAMP 和 IL
              认证环境，服务国防、政府和企业场景。Lufthansa 于 2026 年 3 月在全网络部署 Tomorrow.io 的 Altitude™ 产品。FIA（Fédération Internationale de
              l'Automobile）于 2026 年 2 月宣布与其建立官方赛车天气安全合作伙伴关系。


              客户垂直行业包括航空、物流、能源、保险、农业、体育和政府。已披露的企业客户包括 JetBlue Airways、Delta Air Lines、United Airlines、Uber、Ford Motor
              Company、BNSF Railway、Amazon、Fox Sports 和 New England Patriots。政府客户包括美国国防部、美国空军，以及包括 Hoboken, NJ
              在内的市政府。公司还与 NiMet（Nigeria）和 Philippine National Irrigation Administration 合作，向发展中地区农民提供农业天气智能。
