      - number: '7.2'
        title: 政府政策、NOAA 与数据依赖风险
        blocks:
          - type: paragraph
            body: |
              对美国政府数据基础设施的结构性依赖是 Tomorrow.io 最复杂且由外部驱动的风险。
              Forbes（2025 年 3 月）记录称，“几乎所有商业天气公司，从 Tomorrow [.io] 到你手机上的
              天气应用，都依赖 [NOAA/NWS] 数据来驱动其预报模型”——这是 Tomorrow.io 自身 CEO 也承认的
              依赖，他表示如果 NOAA 的削减阻碍可靠数据交付，可能“别无选择”只能填补空白。
              DOGE 推动的 NOAA 人员削减已解雇 NOAA 约 11,000 名员工中的最多 20%
              （规划文件中曾提出总削减 50% 的目标），暂停 Alaska 的天气气球发射，
              并威胁 Maryland 的 National Centers for Environmental Prediction 设施租约——
              该设施是 NWS 模型计算中心。这些削减直接削弱了补充 Tomorrow.io 自有卫星观测的
              公共数据层。

              在收入侧，Tomorrow.io 的政府合同是短期且竞争性的。
              2026 年 1 月 NOAA 雷达合同（1305M226C0004）价值 $899,189，为期一年，
              通过 21 个投标的充分公开竞争授予。此前 $2.27M Microwave
              Sounder Data Pilot 合同是一项为期一年的研究，并需竞争性续约。NESDIS
              于 2026 年 3 月发布 SBEM IDIQ 征求提案草案，明确设计为
              授予多供应商商业数据合同——表明 NOAA 正构建未来采购以避免单一供应商依赖。
              这有利于该行业的合法性，但会压缩 Tomorrow.io 的定价能力，并形成永久的
              竞争性续约风险。

              私有化辩论放大了更长期的不确定性。Project 2025 关于“拆解” NOAA 并将天气服务
              私有化的建议，把 Tomorrow.io 这类公司置于非计划的兜底位置，引发政治审视、
              关于付费墙后生命安全警报的公平性担忧，以及来自国会和州政府的监管关注。
              公司并非为替代 NWS 的角色而建；Undark（2025 年 8 月）观察到，私营公司
              “无法匹配 NOAA/NWS 的公共使命”，且商业激励结构与免费公共生命安全警报存在
              结构性错位。
