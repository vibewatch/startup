      - number: '6.2'
        title: 具名客户证据与生产部署
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 最强的具名客户证据集中在商业航空。
              JetBlue 大约自 2018 年起使用 Tomorrow.io 平台，从 Boston Logan 的
              单一机场试点开始，扩展到十个最繁忙机场，并最终签约 Tomorrow.io
              作为其所有全球地面和飞行运营的端到端天气预报提供商，包括现场
              EWINS（Enhanced Weather Information and Notification System）项目。
              JetBlue 系统运营副总裁引用称，该平台带来“每月 $300,000，一年 3.7 million”
              的节省，案例研究记录 Tomorrow.io 准确预测 Boston Logan 二月暴风雪
              提前结束——使 JetBlue 得以避免取消航班，而竞争航空公司仍停飞。
              JetBlue Ventures 参与了 Tomorrow.io 的 A 轮融资，形成股权绑定，
              加深了战略关系。

              Lufthansa 的 Altitude™ 部署于 2026 年 3 月 26 日宣布，代表其
              全网络推出，覆盖近 800 个日航班和 150,000+ 名日乘客。
              Dirk Dewald（Lufthansa 高级总监）引用称：“Tomorrow.io 让我们能够
              在单一全球标准下统一运营，应用我们自己的特定运营规则——因此我们
              不再需要人工扫描全球。”Lufthansa 指出，基于不完整天气数据的单次
              备降决策每个航班可造成 $22,000 到 $240,000 成本，从运营风险角度
              描述了平台价值。

              Delta Air Lines 和 United Airlines 被具名为客户，使用 Tomorrow.io
              进行超详细、逐街区天气情报和除冰决策支持。巴西航司 Azul Airlines
              也被引用。在物流领域，BNSF Railway 和 Amazon 使用该平台提升供应链韧性，
              Uber 集成 Tomorrow.io 以提高 ETA 准确性（Maps & Technology Partnerships 的
              Nick Johnson 被引用），Ford 则将其用于 NASCAR 比赛策略和制造设施规划
              （全球供应链的 Adam LeClercq 被引用）。体育客户包括 New England Patriots、
              Fox Sports 和 NASCAR；FIA 于 2026 年 2 月成为官方赛车天气安全合作伙伴。
