      - number: '6.3'
        title: 客户增长与采用轨迹
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的公开客户数已从 2018–2020 年的早期企业试点
              增长到截至 2026 年中声称的 250+ 家企业和政府组织，同时还有
              30,000+ 名开发者 API 用户基础，以及 Fortune 500 前十名中的六家公司。
              250+ 这一数字为公司声称，缺乏独立计数或时间序列拆分。
              2024 年 Fast Company Most Innovative Logistics Company 奖项和
              2024 年 TIME 100 Most Influential Companies 认可都将客户基础作为
              市场验证证据，尽管这些是编辑背书而非第三方审计。

              最具体的采用信号是 JetBlue 轨迹：2018 年的单一机场试点
              在十八个月内增长到十个机场，随后成为覆盖所有全球运营的全企业合同——
              证明了产品市场匹配以及在单一客户内多年扩张的能力。JetBlue Ventures
              参与 Tomorrow.io 的 A 轮，体现出对平台超越商业关系的信心。
              Lufthansa 2026 年 3 月全网络 Altitude™ 部署是最近一次重大具名部署，
              将欧洲最大航空公司之一加入生产参考客户名单。

              政府采用正通过正式采购渠道增长。DoD APFIT 合同
              （2024 年 5 月，通过 AFLCMC Hanscom，$10.2M）为卫星制造提供资金，
              而 NOAA 已多次延长其 Commercial Weather Data Pilot 合同，最近一次在
              2025 年 5 月。Carahsoft 渠道合作扩大了政府触达，而不要求 Tomorrow.io
              自建直接联邦合同基础设施。国际政府增长在菲律宾（NIA 合作，2025 年 6 月）
              和尼日利亚（NiMet DCAS 推出及共同设计研讨会，2026 年 2 月）最为明显，
              并积极扩展到尼日利亚的油气、海事、建筑和保险行业。
