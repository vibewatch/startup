      - number: '3.2'
        title: 直接平台同业——The Weather Company、DTN 与 Climavision
        blocks:
          - type: paragraph
            body: >-
              The Weather Company（TWC）如今归 Francisco Partners 私募股权所有；它 2024 年从 IBM 手中被收购。按估计规模看，TWC 是最大的商业天气智能供应商。TWC
              称其消费者产品（Weather Channel app、Weather Underground、Storm Radar）每月有 415 million 用户，并拥有可观的企业数据业务，全球服务 10,000+
              家企业客户，每天有数千架商业航班依赖其航空产品。其 API 定价公开列出 Standard Annual Plan，每月 $500，可调用 1 million 次；主要航空公司和大规模用户采用定制企业定价。TWC
              的竞争优势包括最深的观测数据资产基础（270,000+ 个个人气象站、200,000+ 架飞机观测），以及出售后保留下来的 IBM Watsonx
              集成分销。收购后的主要弱点是投资不确定性：私募股权所有权通常意味着更短时间视角，并可能压缩 R&D 支出，给 Tomorrow.io 在 AI 模型创新上跑赢 TWC 留出窗口。TWC
              不运营自有卫星星座，微波探测观测依赖第三方数据供应商。


              DTN 是一家私营全球数据和技术公司，凭 Weather Hub 决策平台、WeatherSentry 和 ProphetX 产品线，在农业、能源和公用事业中占据主导地位。DTN 已在 AWS 上集成
              NVIDIA Earth-2，用于 AI 驱动的气旋跟踪；该能力于 2025 年 6 月投入生产，使其在近实时运营预报中具备可信的 AI 差异化。DTN
              的竞争强项来自深度垂直集成——其由气象学家背书、按行业调校的预报系统，以及在公用事业电网运营商和农产品交易商中作为可信数据管家的位置。DTN 定价未公开；企业合同为定制且多年期。DTN
              不拥有卫星资产，上游观测数据来自政府和商业供应商，某些配置中包括 Spire Global。相较 Tomorrow.io，DTN 的弱项是没有自有卫星星座，平台也更偏数据交付，而不是智能体自动化。


              Climavision 是一家位于 Louisville 的天气技术公司，累计融资约 $100 million，包括 TPG 的 The Rise Fund 支持。它占据差异化细分：建设私有雷达网络，填补
              NOAA NEXRAD 系统留下的 15 个州覆盖缺口。Climavision 的 Horizon AI 和 Horizon AI HIRES 模型结合 NWP 与生成式 AI，通过订阅 API
              和定制预报合同，向能源交易员、公用事业和电网运营商提供超本地预报和恶劣天气预警。已披露客户包括 CenterPoint Energy 和 Enverus。Climavision 每天处理 1.5 billion+
              个数据集，并截至 2026 年 1 月已与美国 National Weather Service 软件工具集成。今天它与 Tomorrow.io 基本互补，除公用事业外垂直重叠很少。风险在于横向扩张：如果
              Climavision 借助雷达观测优势进入航空、保险或政府垂直，它会变成更直接的对手。
