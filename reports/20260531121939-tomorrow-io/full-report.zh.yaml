      - number: '1.3'
        title: 资本基础、估值与投资者图谱
        blocks:
          - type: paragraph
            body: >
              Tomorrow.io 从 2017 年到 2026 年 5 月共完成七个不同轮次，累计融资约 $535 million。按卫星行业分析师 Chris
              Quilty（Forbes，2025）的说法，它是全球融资最多的私营天气技术公司。


              融资历史始于约 2017 年的种子轮，以及 2017 年 11 月由 Canaan Partners 领投的 $15 million A 轮。公司 2018 年 10 月完成约 $45 million B
              轮，2020 年 7 月完成约 $23 million C 轮。关键的 $77 million D 轮发生在 2021 年 3 月，与 ClimaCell 更名为 Tomorrow.io
              同步；Stonecourt Capital 是该轮投资方之一。2023 年 6 月，公司完成 $87 million E 轮，由 Activate Capital 领投，RTX Ventures、Seraphim
              Space 和 Chemonics 参投；老股东 SquarePeg Capital、Canaan、ClearVision、JetBlue Ventures 和 Pitango 也继续参与。


              里程碑式的 F 轮于 2026 年 2 月 3 日完成，规模 $175 million，由 Stonecourt Capital 和 HarbourVest Partners 领投，投后估值超过 $1
              billion，正式进入独角兽行列。Forge Global 将 Tomorrow.io 列为 2026 年 Q1 新晋独角兽，F 轮交割日股价为 $5.45。Wikipedia 编辑记录引用
              Calcalist，确认 2026 年 2 月交割时总融资约 $508 million，公告时 ARR 约 $100 million。2026 年 5 月，Pitango 与 Harel
              Group、HarbourVest、Stonecourt 一起追加 $35 million，使 F 轮总额达到 $210 million，累计融资约 $535 million（据 Calcalist 2026 年
              5 月报道）。


              2021 年 12 月，Tomorrow.io 宣布按 $1.2 billion 估值与 Pine Technology Acquisition Corp.
              合并，这是一次后来转为反向信号的融资事件。由于成长型公司公开上市市场环境不佳，交易于 2022 年 3 月终止；Tomorrow.io 支付 $1.5 million
              终止费。该事件说明，条件合适时管理层愿意追求流动性，条件不合适时也会撤回。


              公开资料没有披露老股交易、债务额度或收入分成融资。Goldman Sachs 担任 F 轮独家财务顾问。
