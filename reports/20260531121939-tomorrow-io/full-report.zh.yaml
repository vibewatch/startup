      - number: '4.3'
        title: 政府合同
        blocks:
          - type: paragraph
            body: >-
              政府合同是 Tomorrow.io 记录最充分的收入来源，由两个美国机构支撑：空军 （通过 AFLCMC/HN 的 APFIT 计划）和 NOAA。APFIT 合同——大约于 2023 年 3 月授予， 金额为
              $10.2 million——覆盖两颗搭载微波探测仪和雷达载荷的运行演示气象卫星的制造与 发射，符合具有明确交付物的固定价格项目。NOAA 的 Commercial Weather Data
              Pilot（CWDP） 于 2024 年 9 月向 Tomorrow.io 授予 $2.27 million，用于商业微波探测仪数据，并在 2025 年 5 月延长合同以覆盖 2025 年飓风季，随后又在
              2026 年 1 月签署 $899,000 的雷达 验证合同。截至 2026 年 5 月，NOAA 和 DoD 已披露的政府合同累计价值约为 $33–35 million。
              政府合同属于高质量收入：按里程碑把关，结构上非经常性但经常续约，并由 NOAA 的运营采用 进行验证。NOAA 在 2025 年 5 月的延期表明 CWDP 数据满足 NOAA 的技术要求——这是强有力的
              独立可信度信号。主要集中度风险是对政府预算的依赖：如果 NOAA 资金削减（Trump 2026 预算下拟议削减 17%）或 DoD 重新排序优先级导致合同流减少，Tomorrow.io 没有已确认的
              商业收入可以在规模上替代这部分收入。
