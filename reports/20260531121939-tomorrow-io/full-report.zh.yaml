      - number: '7.4'
        title: 合作伙伴与基础设施依赖风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的全栈模型对少数关键外部方形成集中依赖，
              每一方都代表一个有意义的单点故障。SpaceX Falcon 9 是 Tomorrow.io
              当前星座和近期 DeepSky 建设唯一公开具名的发射提供商。没有公开披露
              备用发射提供商或多发射清单策略。Politico（2026 年 3 月）报道，
              估计有 $8 billion 的航天领域投资面临 SpaceX Starship 延误风险，
              影响那些 DeepSky 规模部署经济性依赖 Starship 所承诺高容量、低成本发射清单的公司——
              这一风险直接适用于 Tomorrow.io 的 100+ 卫星星座目标。

              Palantir 的 FedStart 计划提供合规基础设施，使 Tomorrow.io 能够在不维护自身
              FedRAMP 授权的情况下服务美国联邦雇员。该安排加速联邦销售周期，但创造了
              次级依赖：Palantir 的政府地位、FedRAMP 认证或与 Tomorrow.io 的商业关系若发生
              任何中断，都会直接削弱联邦访问。Palantir 自身的前瞻性陈述披露
              （包含在合作新闻稿中）承认，“Palantir 平台未能满足客户或按预期运行”以及
              “客户修改或终止合同的能力”是明确风险。

              NOAA 代表三重依赖：它同时是收入客户（数据采购合同）、数据供应商
              （补充 Tomorrow.io 卫星的公共天气模型输入）以及 Tomorrow.io 卫星数据质量的
              主要外部验证者。没有单一缓解策略能同时处理这三类暴露向量。AWS 可能是
              主要云基础设施提供商（根据 AWS Marketplace 列表），增加了第四个主要
              合作伙伴依赖，而公开风险披露未处理这一点。
