      - number: '7.3'
        title: 资本密集度与财务风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 已通过 20+ 轮融资筹集超过 $467 million，包括 2026 年 2 月
              $175M F 轮（由 Stonecourt Capital 和 HarbourVest 领投）以及 2026 年 5 月
              Pitango 和 Harel Insurance 参与的 $35M F 轮延展。CBInsights 估计的
              2024 年收入约 $120M，使公司相对于累计融资处于约 3-4x 收入倍数——
              对一家基础设施密集型深科技公司而言偏高。公司尚未确认盈利；CEO Elkabetz
              在 2025 年 3 月表示，公司预计“未来 12 个月内”实现现金流转正，暗示在该日期
              尚未达到。

              资本模型在结构上要求很高。$175M F 轮明确指定用于“加速 DeepSky 部署”——
              意味着新增资本大部分流向卫星硬件和发射成本，而非运营杠杆或利润率扩张。
              DeepSky 到 2028 年实现全球覆盖的 100+ 卫星目标，没有披露单星成本、卫星数量
              或绑定发射时间表；按计划建设很可能在星座达到商业成熟前还需要一次或多次
              额外融资。这会形成对风险投资和成长股权市场、投资者对空间天气逻辑的信心、
              以及 SpaceX 可用发射排期的持续依赖。

              2022 年失败的 SPAC 交易（以 $1.5M 成本终止，协议时 SPAC 估值为 $1.2B）
              使公司保持私有，推迟任何二级流动性事件。CBInsights 估计投后估值介于
              $825M 和 $1B 之间——对于一家已融资近 5 亿美元且仍必须建成 DeepSky 星座的公司
              来说并不激进。如果技术时间表滑坡、客户增长停滞或股权市场环境收紧，
              2026 年 F 轮及延展提供的现金跑道可能不足以在需要再次融资之前达到自我供血规模。
