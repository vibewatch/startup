  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义范围
        blocks:
          - type: paragraph
            body: >-
              商业天气智能市场位于三类支出的交汇处：天气数据访问（原始观测和模型输出）、天气分析平台（解读、预警、决策）以及嵌入天气的服务（保险参数化产品、供应链 API、航空签派工具）。Tomorrow.io
              主要竞争的是分析平台层，它销售自有模型输出和 API 访问，并叠加自有卫星星座；这让它区别于 Spire Global 这类纯数据经纪商。


              本报告纳入的支出定义包括：企业对天气 API 和预警平台的订阅；面向大气感知的商业卫星数据授权；销售给保险、物流、能源和航空的天气驱动风险分析模块；以及政府商业天气数据采购（如 NOAA IDIQ
              合同）。排除的支出包括：面向消费者的广播媒体天气服务、未绑定田块级天气预报的农业商品分析，以及宽泛的气候风险金融披露市场（与 TCFD/ESG 重叠的板块）。现状替代方案是 NOAA、各国气象服务和免费层天气
              API（OpenWeatherMap）提供的免费公共部门数据，它们覆盖多数消费者和小企业需求，但缺少企业运营者要求的分辨率、时延和垂直工作流集成。
            claimRefs: []
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: 市场规模——多种口径与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              五家独立市场研究机构对 2025 年全球天气预报服务 TAM 的判断集中在 $2.5–3.5 billion 区间，CAGR 为 6.5–7.4%。Grand View Research 估计为 $2.91
              billion、CAGR 7.0%；Mordor Intelligence 给出 $3.49 billion、CAGR 7.06%；Fortune Business Insights 给出 $2.77
              billion、CAGR 7.4%；IMARC Group 给出 $2.50 billion、CAGR 6.9%；Future Market Insights 给出 $2.80 billion、CAGR
              6.5%。差异来自范围取舍：Mordor 纳入了 GVR 排除的嵌入式天气驱动分析模块；IMARC 采用更窄定义，聚焦纯天气预报服务。北美占全球支出的 28–38%（共识约 32%），对应 $800M–$1.1B
              的北美 TAM。


              更宽的「天气信息技术」口径会加入感知硬件、NWP 计算和面向政府的系统；Grand View Research 在这一口径下给出全球 $9.23 billion、CAGR
              9.5%，显示边界一变，市场规模也随之放大。单看天气 API 子板块，IntelMarketResearch 估计 2024 年约 $2.0 billion，CAGR 约 15%，到 2033 年可达约 $6
              billion——零售、建筑和电商中依赖数据的应用增加，是主要驱动。Tomorrow.io 披露的约 $100 million ARR 约占狭义天气预报服务 TAM 的 3.4–4.0%，约占北美 SAM 的
              5%，说明它在碎片化市场中已有实质份额。这些估算都没有成功隔离纯企业 SaaS 天气智能 SAM；该数字仍是尽调缺口。
            claimRefs: []
          - type: table
            tableRef: TM002
            claimRefs: []
