      - number: '1.5'
        title: 里程碑时间线与反向事件
        blocks:
          - type: paragraph
            body: >
              Tomorrow.io
              九年历史可分为四个阶段：（1）纯软件天气智能创业公司（2016–2021）；（2）更名并宣布太空战略（2021–2022）；（3）建设卫星星座并完成首批商业发射（2023–2025）；（4）进入独角兽、完成星座，并推进
              DeepSky 计划（2026 至今）。


              公司历史上最重要的反向事件是 2022 年 3 月 SPAC 终止。Tomorrow.io 与 Pine Technology Acquisition Corp. 于 2021 年 12 月宣布按 $1.2
              billion 估值合并，目标是部署 32 颗雷达卫星；但因成长型科技公司公开市场环境不佳撤回，并支付 $1.5 million 终止费。这一事件至少推迟了四年的公开市场通道（截至 2026 年 5
              月，公司仍为私营）。


              第二类反向背景出现在 2025 年 3 月。Forbes 发表文章，考察在 DOGE 主导的 NOAA 裁员（最多裁掉 NOAA 20% 员工）之后，Tomorrow.io 以及商业天气公司整体能否替代美国
              National Weather Service。文章结论是：「根本没有任何私营公司能以 NWS 的规模提供天气数据。」Elkabetz 本人表示：「我不希望任何读到这篇文章的人以为 Tomorrow.io
              这类公司是来抢 NOAA 生意的。」这篇报道同时凸显声誉风险和监管依赖风险：Tomorrow.io 的平台把政府天气数据（NOAA、NWS）作为输入，公共数据基础设施退化会限制公司自身预报质量，即便需求同时增加。


              正面看，星座建设按计划推进：2023 年 4 月至 2026 年 1 月之间，公司发射 13 颗卫星，达到全球 60 分钟重访里程碑，且没有披露在轨失败。按独角兽估值完成 F 轮，再加上 2026 年 5 月
              $35 million F 轮追加，显示投资者信心仍在，也验证了商业卫星天气数据市场的投资逻辑。


              TIME 将 Tomorrow.io 评为 2024 年 100 家最具影响力公司之一。Fast Company 将 Tomorrow.io 评为 2024 年 #1 最具创新力物流公司，并在 2025 年和
              2026 年连续评为 #1 最具创新力太空公司。公司还入选 TIME 的 America's Top GreenTech Companies 2026 榜单。
