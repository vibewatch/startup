      - number: '7.5'
        title: 预报准确性、数据质量与产品信任风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 自有卫星数据的准确性是投资逻辑的核心。NASA 独立的
              2026 年 3 月 Quality Assessment Report 记录，R1 Ka 波段降水雷达存在
              -22% 反射率偏差，而 R2 雷达存在 -6% 偏差；两颗卫星的地理定位精度
              与数字高程模型参考均显示出优秀相关性（0.98）。NASA 批准数据“用于科学用途，
              前提是与科学目标和应用需求一致”——这一有条件批准突出了 R1 卫星的剩余
              准确性担忧。从 R1 到 R2 的偏差趋势显示迭代改进，但也确认早期客户和 NOAA
              评估基于偏差更高的数据，且 R2 部署前提出的预报准确性主张应据此解读。

              除卫星数据质量外，企业和 API 用户评论也提出产品体验担忧。
              AITools.xyz 和 JustUseApp 上的用户指出告警延迟（通知在降水已经开始后才到达）、
              高峰使用期间应用缓慢、客户支持响应不足，以及定价对“小型组织来说过于昂贵”。
              这些担忧集中在非企业用户中，但如果 Tomorrow.io 试图扩大其中端市场可服务基础，
              或者大型企业客户遭遇任务关键型故障，它们表明平台可靠性和可扩展性存在缺口。

              Forbes（2025 年 3 月）将 Tomorrow.io 的模型描述为在自有卫星数据之外还“分析
              来自 NWS 的公开可用数据”，这削弱了公司“地球 90% 区域没有高质量数据”的定位——
              如果 Tomorrow.io 模型仍依赖 NWS 数据，那么削弱 NWS 输出的 NOAA 削减将直接影响
              预报准确性，在本章识别的政策风险和产品信任风险之间形成反馈回路。
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
      - number: '7.6'
        title: 竞争与商品化风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 所处市场有资本充足的既有企业、获得融资的卫星初创公司
              和免费替代方案。IBM The Weather Company（自 IBM 2023 年出售后独立）
              仍在企业航空、能源和金融服务领域拥有深厚渗透，并具备长期客户关系和
              与 IBM 基础设施栈的集成。Spire Global（SPIR，NYSE）报告 2025 年 Q4 收入
              为 $15.8M，并正凭借其 CubeSat 星座和扩大的 NOAA 数据合同积极瞄准
              2026 年 50% 收入增长。Spire 是政府天气数据市场的直接竞争对手，竞争
              Tomorrow.io 所瞄准的同一批 SBEM IDIQ 名额。AccuWeather、DTN、ClimaVision
              和 XWeather 在企业和开发者天气 API 领域竞争，却无需承担 Tomorrow.io 的
              卫星资本支出负担。

              更结构性的商品化风险来自开源神经天气模型。
              Google DeepMind 的 GraphCast、Huawei 的 Pangu-Weather 以及 ECMWF 的开放 AI 模型
              正在实现接近或超过传统 NWP 模型的预报准确性提升——且它们以零成本公开可用。
              随着这些模型集成免费可用的 NOAA 和 Copernicus 数据，企业商业平台与免费替代方案
              在非超本地用例中的差距会缩小。Tomorrow.io 的差异化依赖自有卫星数据（超本地补盲）、
              运营 AI 自动化（Gale 智能体系统）和行业专用工作流集成——这些护城河需要持续投资，
              且竞争对手在资本充足时可以复制。

              NOAA 于 2026 年 3 月宣布的多供应商 SBEM IDIQ 采购结构明确设计为防止
              单一供应商锁定，并将商业气象卫星数据商品化。随着政府同时从多家供应商采购，
              Tomorrow.io 从早期 CWDP 试点独占中获得的定价能力和验证溢价将被压缩。
              科技融资文章指出 ClimaVision 获得后续资本，DTN 在农业和能源市场有深度渗透；
              二者都不承担 Tomorrow.io 的卫星开销。
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
      - number: '7.7'
        title: 人员、执行与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 的三位联合创始人同时担任三个最高运营职位：
              Shimon Elkabetz（CEO）、Rei Goffer（首席战略官）和 Itai Zlotnik（首席
              客户官）。没有为这三个职位中的任何一个公开披露具名继任者、副 CEO 或
              继任计划。如此程度的联合创始人集中度会产生相关关键人物风险：两位或三位
              联合创始人因分歧、健康、竞争性邀约或投资者压力同时离职，可能以单一关键人物
              离职不会造成的方式扰乱战略方向、投资者信心和企业客户关系。

              DeepSky 执行复杂度是主要运营执行风险。该项目横跨卫星硬件工程
              （被描述为与 Gen1 CubeSats 相比“完全不同级别”的新多传感器载荷）、
              尚未商业化实现的数据密度下的 AI 模型训练，以及企业 SaaS 扩展——
              这是三个不同技术领域，每个都需要专业深度人才。截至 2026 年 5 月，
              未公开披露 DeepSky 的卫星数量、单星传感器规格或绑定发射清单。
              2028 年全面覆盖目标由公司提出，没有独立验证。三个领域中任何一个执行滑坡
              都会削弱支撑 F 轮估值的竞争定位。

              投资者应监控的投资逻辑破裂触发因素包括：NOAA 采购冻结或资金悬崖，消除
              政府收入和数据访问；SBEM IDIQ 在首轮竞争周期未向 Tomorrow.io 授予合同；
              重大卫星故障或发射异常导致 DeepSky 延误超过 12 个月；失去 Palantir FedStart
              认证；过渡期内联合创始人离职；或无法按与 $825M–$1B 投后估值一致的条款完成
              Series G 融资以支持 2026 年资本部署。Undark（2025 年）关于私营天气公司在结构上
              无法匹配 NOAA/NWS 公共产品使命的描述，若 NWS 弱化叙事继续加剧，将构成持续声誉风险。
