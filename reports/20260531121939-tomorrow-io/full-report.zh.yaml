      - number: '4.4'
        title: 资本结构
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 从种子轮（2016 年）到 F 轮（2026 年）在五轮或更多可识别轮次中累计股权融资 约 $535 million，没有公开披露的债务融资。F 轮分两批完成：2026 年 2 月由
              Stonecourt Capital 和 HarbourVest Partners 锚定的 $175 million 领投轮，投后估值超过 $1 billion；随后是 2026 年 5 月 Pitango
              Venture Capital 和 Harel Insurance 参与的 $35 million 延展轮。 合计 $210 million 的 F 轮是商业天气智能领域最大单轮融资之一，使
              Tomorrow.io 稳居独角兽 行列。资金用途声明为 DeepSky 卫星星座制造、发射和运营——这是资本密集型项目，具有多年
              执行风险。没有关于现金头寸、月度烧钱速度或现金跑道的公开信息；融资后现金跑道估计为 18–36 个月，取决于未披露的烧钱速度。公司曾在 2021–2022 年尝试通过 SPAC 上市，但在 2022 年 3
              月终止与 Pine Technology Acquisition Corp 的合并，并支付 $1.5 million 终止费。 SPAC 终止以及随后到 2026
              年继续依赖私募股权表明，公司按其自身评估当时尚未达到公开市场 准备状态；此后四年的私募增长轮意味着在任何流动性事件之前仍存在持续资本依赖。
