  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 处在三个快速收紧的监管领域交汇处：
              地理空间数据处理、AI 自动化决策以及关键基础设施服务。
              截至 2026 年，超过 20 个美国州已颁布综合隐私法——包括
              Indiana、Kentucky 和 Rhode Island——对处理位置相关或敏感数据的平台
              施加新的风险评估、数据共享披露、退出机制和同意要求。
              Tomorrow.io 的企业平台为超过 250 家组织处理地理位置情境化的运营数据，
              触发多州合规义务，而公司未在公开披露中处理这些义务。

              欧盟 AI Act 已最终确定并在 2026 年进入执法阶段，专门针对具有真实
              运营后果的自动化 AI 决策工具。Tomorrow.io 的 Gale 智能体 AI——它会
              自主启动航班停场、供应链改道和灾害响应协议——可能落入高风险 AI 分类，
              需要强制透明度文件、人类覆盖机制和合格评定。公司总部位于欧盟的客户
              （Lufthansa）带来对 EU AI Act 执法的直接暴露。

              在政府准入方面，Tomorrow.io 于 2025 年加入 Palantir 的 FedStart 计划，
              在 Palantir 的 FedRAMP 和 Impact Level 认证环境中运行其联邦产品。
              虽然这通过外包合规基础设施缓解了最尖锐的联邦合规风险，但也引入了
              Palantir 依赖（在合作伙伴章节讨论）。在可访问公共记录中，未发现
              待决诉讼、知识产权争议、监管执法行动、卫星载荷 ITAR 出口管制认证或
              FCC 频谱许可证披露的证据；这些构成优先尽调询问项。嵌入关键基础设施
              （航空、国防、电网运营）的天气智能服务正受到更多 CISA 审查和行业特定
              事故报告义务影响，带来额外潜在合规成本。
