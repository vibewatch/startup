      - number: '6.5'
        title: 先落地后扩张动态与留存证据
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 最明显的留存和扩张信号是 JetBlue 客户生命周期：
              约五年时间从单一机场试点发展为覆盖所有全球地面和飞行运营的
              企业级独家合同。JetBlue Ventures 在扩张阶段投资 Tomorrow.io 的 A 轮，
              使关系超越供应商安排，通过股权和运营依赖形成机构粘性。
              JetBlue 在授予端到端合同前运行的明确采购请求流程——其中 tomorrow.io
              与其他天气方案同场评估——提供了一个竞争验证数据点。

              Lufthansa 的 Altitude™ 部署是最近一次先落地后扩张成功案例：
              该客户将其表述为“航空的基础设施——没有任何大型航空公司能够在没有它的情况下运营”，
              显示其有意随时间加深依赖。尼日利亚的 NiMet 关系始于聚焦农业的
              Digital Climate Advisory Services 试点，并正明确扩展到油气、海事、
              建筑和保险——说明政府垂直行业也存在同样模式。

              Tomorrow.io 未公开披露 NPS 分数、净留存率（NRR）、总留存率（GRR）
              或队列流失数据。公司在 G2 或 Gartner Peer Insights 上没有足够评论量，
              无法推导满意度代理指标。FeaturedCustomers 列出 35 个案例研究和客户故事，
              在 86 个参考项中参考评分为 4.8/5.0，但该网站方法论未经独立审计。
              天气 SaaS 企业合同通常为两到四年并附续约选项；Tomorrow.io 的政府 CWDP
              合同已多次延期，显示基于绩效的续约成功。缺乏公开留存指标是重大尽调缺口。
