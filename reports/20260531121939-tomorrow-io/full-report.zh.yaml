  - id: FR002
    title: 风险传导图 — 主要风险如何流向收入和估值
    type: dag
    layout: wide
    summary: 展示 Tomorrow.io 上游风险节点（NOAA 政策、SpaceX 发射、资本市场）如何穿过中游运营和产品层，传导到下游收入、客户和估值影响。边表示因果或赋能传导路径。
    claimRefs:
      - CR006
      - CR007
      - CR013
      - CR018
      - CR019
      - CR021
      - CR033
    data:
      nodes:
        - id: r1
          label: DOGE / NOAA 预算削减
          detail: DOGE 削减导致 NOAA 最多 20% 员工被解雇，暂停气象气球发射，威胁 NCEP 设施，并削弱 Tomorrow.io 模型仍部分依赖的公共天气数据基线
        - id: r2
          label: NWS 数据质量下降
          detail: 气象气球发射频率、NCEP 模型更新节奏和雷达网络覆盖减少，削弱输入 Tomorrow.io 混合 AI 预测模型的 NOAA 公共数据质量
        - id: r3
          label: 预测准确性受冲击
          detail: NWS 输入退化会降低 Tomorrow.io 在依赖 NWS 地区的预测准确性；R1 偏差（-22%）在早期客户中放大这一问题；若客户遭遇漏报预警，平台信任会被侵蚀
        - id: r4
          label: 客户流失 / 不续约风险
          detail: 遭遇预测准确性下降或预警延迟的企业客户（航空、物流、政府）可能拒绝续约或缩小合同范围；政府采购也可能转向多供应商或替代供应商
        - id: r5
          label: NOAA 政府收入流失
          detail: 年度 NOAA 数据合同（$899K、$2.27M）以竞争方式续签；SBEM IDIQ 形成多供应商市场结构；任何采购暂停或取消都会直接减少政府收入
        - id: r6
          label: SpaceX 发射风险 / 延误
          detail: >-
            Falcon 9 异常或 Starship 延误会推迟 DeepSky 发射计划；Politico 报道，Starship 延误使 $8B 太空投资面临风险；DeepSky 无法按 2028
            年目标如期实现完整全球覆盖
        - id: r7
          label: 收入缺口 / 烧钱速度压力
          detail: 客户流失、政府收入损失和 DeepSky 延误叠加，会增加对 $210M Series F 现金跑道的消耗；若交割后 18–24 个月收入低于计划，Series G 融资会变得紧迫
        - id: r8
          label: 估值压缩 / 融资风险
          detail: 收入缺口、盈利延后，以及 Spire 和开源模型带来的竞争压力，会削弱 Series G 以约 $825M–$1B 投后估值或更高估值融资的理由；估值下调轮或过桥融资风险上升
      edges:
        - source: r1
          target: r2
          label: 削弱公共数据输入
        - source: r2
          target: r3
          label: 降低 AI 模型准确性
        - source: r3
          target: r4
          label: 引发企业客户不续约
        - source: r1
          target: r5
          label: NOAA 采购冻结或取消
        - source: r6
          target: r3
          label: 延后 DeepSky 数据密度提升
        - source: r4
          target: r7
          label: 降低 ARR 和 NRR
        - source: r5
          target: r7
          label: 压低政府收入线
        - source: r7
          target: r8
          label: 触发投资人重估估值
  - id: FR003
    title: 依赖图 — 关键外部合作伙伴和交易对手
    type: dag
    layout: wide
    summary: 梳理 Tomorrow.io 运营模型中的六个关键外部依赖，展示每个交易对手承担的角色，以及单点故障如何传导到公司的核心能力（星座运行、预测交付、联邦市场准入和资本结构）。
    claimRefs:
      - CR018
      - CR020
      - CR021
      - CR022
      - CR003
      - CR013
    data:
      nodes:
        - id: d1
          label: SpaceX（Falcon 9 + Starship）
          detail: 所有星座建设中唯一公开具名的发射供应商；Gen1（13 颗卫星）和 DeepSky（目标 100+ 颗卫星）都依赖 SpaceX 拼车发射清单可用性和定价；公开披露中没有确认的备用发射供应商
        - id: d2
          label: NOAA / NESDIS
          detail: 三重角色：（1）通过 CWDP / SBEM 数据采购合同贡献收入的客户；（2）补充自有卫星观测的公共数据供应方；（3）提供运营级验证的外部验证方，支撑政府和企业信任主张
        - id: d3
          label: Palantir FedStart
          detail: >-
            为美国联邦产品交付提供 FedRAMP 和 Impact Level 认证环境；让 Tomorrow.io 无需独立经历 18–24 个月认证周期即可服务联邦人员；Palantir
            也是面向国防和政府客户的联合销售渠道
        - id: d4
          label: Amazon Web Services（推断）
          detail: 已在 AWS Marketplace 上架；推断其为 AI 模型训练、推理和实时数据交付的主要云基础设施；AWS 客户 Amazon 也是 Tomorrow.io 具名企业客户，可能带来渠道冲突敏感性
        - id: d5
          label: Goldman Sachs（资本市场）
          detail: 担任 $175M Series F 的独家财务顾问；未来 Series G 或 IPO 事件中可能担任首席顾问；能接触全球成长股权和公开市场投资人，对 DeepSky 到 2028 年融资至关重要
        - id: d6
          label: Tomorrow.io 核心平台
          detail: 同时依赖五个上游节点：SpaceX 交付星座数据；NOAA 提供验证和公共数据基线；Palantir 提供联邦交付基础设施；AWS 提供云计算；Goldman Sachs 支撑星座扩张所需资本结构
      edges:
        - source: d1
          target: d6
          label: 把卫星送入轨道，启用自有数据层
        - source: d2
          target: d6
          label: 提供公共数据基线输入和运营验证
        - source: d3
          target: d6
          label: 通过 FedRAMP 基础设施打开联邦市场准入
        - source: d4
          target: d6
          label: 为 AI 推理和实时交付提供云计算
        - source: d5
          target: d6
          label: 支撑 DeepSky 扩大星座所需融资
  - id: FV001
    title: 推荐逻辑 — 从证据到投资结论的链条
    type: flow
    summary: 从五类证据——市场、技术资产、财务透明度、退出背景和估值——推导 Tomorrow.io Series F 的有条件兴趣（观察）建议。每个节点反映截至 2026 年 5 月公开证据的权重。
    data:
      nodes:
        - id: n1
          label: 市场证据
          description: $3–5B+ 可触达商业天气智能市场；气候风险推动航空、保险、能源、物流的结构性需求增长
        - id: n2
          label: 技术资产质量
          description: NOAA 验证的运营级微波探测仪星座；DeepSky 已获资金；硬件加软件双重护城河；未发现直接的私营市场复制者
        - id: n3
          label: 财务透明度
          description: ARR 存在 4× 差异（$24M vs $100M）未解决；未披露毛利率、烧钱速度或优先股清算瀑布；缺少审计时估值无法锚定
        - id: n4
          label: 退出背景
          description: 2022 年 SPAC 在 $1.2B 估值失败；未提交 S-1；二级市场有限；M&A 路径可行（Francisco Partners 可比交易 >$1B）；IPO 时间最早也在 2027+
        - id: n5
          label: 估值 vs 可比公司
          description: >-
            $1.04B 标记：若 ARR 为 $100M，则为 10×（处于公开可比公司下限）；若 ARR 为 $24M，则为 41×（高于可比公司上限）；Spire 11×、BlackSky 17×、Planet Labs
            18.5× P/S
        - id: n6
          label: 有条件兴趣 — 观察
          description: 只有在资料室确认经审计 ARR ≥$80M、毛利率 ≥55%、现金跑道 ≥24 个月，并完成优先股清算瀑布审查后才可行动
      edges:
        - from: n1
          to: n6
          label: 支撑投资逻辑；市场顺风已确认
        - from: n2
          to: n6
          label: 支撑投资逻辑；自有护城河经 NOAA 验证
        - from: n3
          to: n6
          label: 阻断因素；没有资料室就无法给出建设性评级
        - from: n4
          to: n6
          label: 风险因素；SPAC 历史和流动性不足压低信心
        - from: n5
          to: n6
          label: 中性偏谨慎；只有 $100M ARR 经审计才可接受
    claimRefs:
      - CV030
      - CV031
      - CV032
