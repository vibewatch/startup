      basis: >-
        Comparable set drawn from public satellite data companies (Spire Global, BlackSky, Planet Labs) and one private
        M&A transaction (IBM Weather Company). Coverage is partial; no direct pure-play private weather SaaS company
        with disclosed financials was identified. Tomorrow.io is included as the reference subject, not a peer comp.
    claimRefs:
