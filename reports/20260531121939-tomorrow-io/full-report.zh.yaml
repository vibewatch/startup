      - number: '4.2'
        title: 定价与 GTM
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的公开定价页显示一个免费 API 层级，带有速率限制，且不包含企业平台功能； 所有商业计划都需要联系销售。没有公布企业标价、按席位定价或基于用量的定价，因此无法 与 The Weather
              Company 等行业同业进行基准比较（其列出 100 万次 API 调用为 $500/月）。 这种定价不透明与面向企业采购团队、采用多年合同期限和定制集成的高 ACV 销售动作一致 ——这是平均合同价值高于
              $50,000 的垂直 SaaS 公司常见模式。基于天气工作流集成的复杂性， 企业客户的销售周期估计为三到九个月，但没有披露官方销售效率指标。Tomorrow.io 提供免费 开发者 API
              层级作为漏斗顶部获客渠道；从免费转化为付费企业的机制没有公开记录，必须视为 信息缺口。没有披露任何销售效率指标——获客成本、回本周期、销售人员数量或配额达成率。 国际收入确实存在（菲律宾政府的 AI
              驱动农业天气预报合作），但任何公开来源都未量化。 截至 2026 年 5 月，企业客户总数未公开披露。
