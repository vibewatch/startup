  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资压力
        blocks:
          - type: paragraph
            body: >-
              Tomorrow.io 的 Series F 轮分两笔完成，合计 $210 million：2026 年 2 月由 Stonecourt Capital 和 HarbourVest Partners 锚定的
              $175 million 领投轮，随后 2026 年 5 月 Pitango Venture Capital 与 Harel Insurance 追加 $35 million。Forge Global
              的二级市场平台记录，2026 年 5 月对应投后估值为 $1.04 billion，使 Tomorrow.io 明确进入独角兽区间。自 2016 年种子轮至 Series F，累计融资约 $498–535
              million。$210 million 的 Series F 是迄今商业天气智能领域最大单轮融资之一。披露资金用途为 DeepSky
              卫星星座的制造、发射和运营——这是重资本项目，执行风险跨多年，公开资料没有给出明确总成本上限。优先股堆叠细节未公开；$1 billion 估值旁也没有引用 409A
              或独立第三方估值，因此普通股和期权池相对投后头部数字的折价仍未知。按 $210M 融资和 $1.04B 投后计算，隐含投前约 $830M，Series F 合计约 20%
              稀释；实际稀释仍取决于清算优先权、反稀释条款、期权池刷新等条款。Forge 二级市场截至 2026 年 5
              月显示市场活动有限、无撮合价格，说明现有股东的私募二级流动性有限。大额融资形成的估值悬顶、未披露的优先权机制和重资本卫星项目叠加，使任何按当前估值或接近当前估值进入的新投资人面临实质稀释风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
              - CV018
              - CV026
