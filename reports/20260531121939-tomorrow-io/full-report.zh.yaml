      - number: '6.4'
        title: 客户成效与价值证据
        blocks:
          - type: paragraph
            body: |
              Tomorrow.io 面向客户的 ROI 主张在航空领域记录最充分。JetBlue 的
              系统运营副总裁将“每月 $300,000，一年 3.7 million”的节省归因于
              该平台，并估计在天气波动月份，除冰优化每个枢纽每月可节省 $50,000。
              SimpleFlying 的独立报道（2023 年 12 月）引用了 JetBlue 每年节省 $4M
              的估计，并确认了 Boston 暴风雪案例研究，其中 Tomorrow.io 的预报
              与所有主要气象服务不同，使 JetBlue 能够按时运行航班，而竞争对手停飞。
              Tomorrow.io 另称一家未具名航空公司在单一天气事件中节省了 $2 million。

              Lufthansa 的成效表述是架构性的而非量化的：Dirk Dewald
              强调消除人工全球扫描，并在单一全球标准下统一天气运营，
              下游收益覆盖燃油、机组排班、乘客赔偿和网络表现。农业垂直行业
              主张包括因意外霜冻或冰雹导致的作物损失减少 20%，以及每英亩节省
              $41 的浪费灌溉成本，这些均来自 Tomorrow.io 农业产品页。
              在菲律宾，农业计划针对的是每年由天气扰动造成、影响 1.4 million
              农民和渔民的 PHP 57.78 billion（$1.04 billion）农业损失。

              政府和国防成效通过验证报告记录：JCSDA 评估发现，TMS 卫星数据同化
              对温度、水汽和风预报准确性产生“压倒性正面影响”。NOAA 的中期评估
              将 TMS 数据描述为“校准良好，整体上可与 ATMS 相比”。对于 Uber，
              Nick Johnson（Maps & Technology Partnerships）表示，该平台基于其按需预报
              的洞察实现“更准确的 ETA”。对于 Ford，Adam LeClercq（全球供应链）
              引用了“今天”用于制造设施的天气规划能力。具名成效证据在航空领域较强，
              但在物流、保险和能源垂直行业较稀疏。
