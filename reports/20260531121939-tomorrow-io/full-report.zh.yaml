companyProfile:
  summary: >-
    Tomorrow.io（前身为 ClimaCell）是一家总部位于美国马萨诸塞州波士顿的天气智能公司，由三名以色列空军老兵 Shimon Elkabetz（CEO）、Rei Goffer（CSO）和 Itai
    Zlotnik（COO）于 2016 年创立。公司打造端到端、AI 驱动的天气智能平台，把自研 Ka 波段雷达和微波探测卫星星座（截至 2026 年 1 月为 13 颗卫星、全球 60 分钟重访）、基于物理和生成式 AI
    的预报模型，以及企业决策支持软件组合在一起。2026 年 2 月，Tomorrow.io 完成由 Stonecourt Capital 和 HarbourVest Partners 领投的 $175 million F
    轮融资，投后估值超过 $1 billion，跻身独角兽；2026 年 5 月该轮又追加 $35 million，F 轮总额达到 $210 million，累计融资约 $535 million。公司称 ARR 约 $100
    million，但 GetLatka 经 CEO 验证的数据库给出不同数字（2025 年 $24.4M）。客户超过 250
    家，覆盖航空、物流、能源、保险和政府，包括美国国防部、美国空军、NASA、JetBlue、Delta、Uber、Ford 和 BNSF Railway。公司曾在 2021 年 12 月宣布与 Pine Technology
    Acquisition Corp 合并上市，后因市场环境不佳于 2022 年 3 月终止，并支付 $1.5 million 终止费。
