  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Tomorrow.io 企业客户如何从意识到天气扰动痛点，走过试点、生产部署、结果兑现和多年扩张；列出各阶段关键角色、触点和扩张触发因素。
    claimRefs:
      - CU007
      - CU008
      - CU010
      - CU013
      - CU014
      - CU022
      - CU023
    data:
      items:
        - label: 认知
          actor: 运营负责人 / 运营 VP / CTO
          touchpoints:
            - 天气事件造成高成本中断（航班取消、供应链延误）
            - 来自另一家航空、物流或政府运营团队的同业推荐
            - 行业会议或 Fast Company / TIME 100 编辑报道
            - 入站 SDR 触达或 Carahsoft 政府渠道介绍
          painpoint: >-
            Existing weather data is too coarse, too slow, or too fragmented to drive automated operational decisions;
            manual workflows fail at scale
          opportunity: >-
            Tomorrow.io offers block-by-block, minute-by-minute forecasts with workflow automation and a single source
            of weather truth
        - label: 评估
          actor: 运营负责人 + IT / 采购
          touchpoints:
            - 免费 API 试用或开发者沙箱测试
            - 在一个枢纽或地点做概念验证
            - RFP / 采购申请流程，将 Tomorrow.io 与 IBM Weather Company、DTN 或其他提供商比较
            - JetBlue Ventures 背书核验或客户故事审查
          painpoint: Procurement requires demonstrable ROI and data accuracy validation against existing meteorological services
          opportunity: >-
            JetBlue $3.7M savings case study and Boston snowstorm accuracy story provide concrete proof points;
            Lufthansa Altitude pilot evidence available as of 2026
        - label: 初始部署
          actor: 运营团队 + Tomorrow.io 实施团队
          touchpoints:
            - 将 API 接入签派或 OCC 仪表盘
            - 按运营协议配置规则型自动告警
            - 单地点或单枢纽生产上线
            - 员工培训并嵌入操作规程
          painpoint: Integration complexity with legacy airline / logistics systems; staff adoption of new weather data workflows
          opportunity: Standardized API and Altitude™ platform reduce integration friction; Gale AI engine automates alert routing
        - label: 生产使用与结果
          actor: 运营 VP / 高级总监
          touchpoints:
            - 可衡量的延误减少、除冰成本节省或 ETA 准确性提升
            - 主动天气告警避免一次高成本决策错误
            - 与 Tomorrow.io 客户团队做季度业务回顾
            - 发布推荐语或案例研究（JetBlue、Lufthansa、Uber、Ford）
          painpoint: Demonstrating ROI to finance leadership; transitioning from pilot SLA to enterprise contract
          opportunity: >-
            Documented $50k/month per hub savings for JetBlue; Lufthansa cites unified global standard with no manual
            scanning
        - label: 扩张
          actor: 高管赞助人（VP/SVP）+ Tomorrow.io 战略客户团队
          touchpoints:
            - Expansion from one hub to all network locations (JetBlue: 1 → 10 airports → all operations)
            - 新增用例（除冰 → 航线规划 → 可持续性规划）
            - JetBlue Ventures Series A 投资加深关系
            - Nigeria NiMet: agriculture DCAS → oil and gas, maritime, construction, insurance
          painpoint: Budget justification for expanded contract scope; multi-year enterprise commitment
          opportunity: >-
            Land-and-expand with documented account-growth track record; weather intelligence becomes embedded
            infrastructure
        - label: 战略嵌入
          actor: CTO / CDO
          touchpoints:
            - 整个垂直行业的单一来源或首选供应商合同（JetBlue EWINS）
            - 平台成为基础设施（Lufthansa 称“没有一家大型航空公司能够在没有它的情况下运营”）
            - 客户运营数据反馈闭环反哺模型训练
            - 未来 Altitude™ 向其他航空公司扩张时引用 Lufthansa 部署
          painpoint: Lock-in concerns from procurement; alternative provider evaluation risk
          opportunity: >-
            Deep API and workflow integration creates high switching cost; satellite data advantage grows with
            constellation scale
