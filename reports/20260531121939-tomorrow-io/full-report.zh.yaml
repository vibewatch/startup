    data:
      layers:
        - label: 太空 / 感知层
          detail: >-
            11 颗 TMS 微波探测卫星（91–204 GHz）；2 颗 Ka-band 雷达卫星（TR1/TR2 位于 550 km SSO，35.5–36 GHz）；60 分钟全球重访率（Gen1）；DeepSky
            多模态星座开发中
        - label: 数据接入与处理层
          detail: 自研辐射定标管线；生成 L1/L2 产品；兼容 JEDI-MPAS、FV3-JEDI 和 3DEnVar NWP 同化；在 CWDP 试点下向 NOAA AWIPS2 实时供数
        - label: AI 建模层
          detail: 基于物理和生成式 AI 的预测模型；Gale 智能体 AI 引擎；与 NVIDIA Earth-2 集成 StormCast 公里级强天气模型；近实时大气数字孪生；持续用实时卫星数据训练
        - label: 平台与 API 层
          detail: >-
            REST/JSON Weather API 覆盖 60+ 数据层，声称 99.9% 可用性、14 天预报、全球覆盖；企业 SaaS 支持 SAML SSO、自定义 SLA、地理围栏告警；上架 AWS
            Marketplace 和 Azure Marketplace；开发者免费层
        - label: 行业智能层
          detail: >-
            Altitude（航空）：Lufthansa 网络、METAR/TAF/SIGMETs/WAFS、规则型 API 告警；农业：提前 5 天预警，声称降低 20% 作物损失；政府 / 国防：Palantir
            FedStart FedRAMP/IL 交付；物流：路线监控、供应链中断告警
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 端到端流程展示企业客户（航空运营商）如何接入 Tomorrow.io 气象智能——从卫星感知到智能体告警，再到运营决策——说明交付模式嵌入业务，而不是咨询式服务。
    claimRefs:
      - CE011
      - CE013
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
    data:
      nodes:
        - id: n1
          label: 卫星观测过境
          detail: TMS 卫星飞越区域；91–204 GHz 微波探测捕捉温度和水汽廓线；Ka-band 雷达捕捉降水结构；60 分钟全球重访确保大气图像连续
        - id: n2
          label: 数据接入与 AI 建模
          detail: 原始辐射数据经自研定标管线处理；L1/L2 产品输入 Gale AI 引擎和基于物理的模型；NVIDIA Earth-2 StormCast 提供公里级强天气预测；输出：任意地点的高分辨率影响级预报
        - id: n3
          label: 规则型告警触发（Gale）
          detail: Altitude 按运营商配置规则监控航空公司的完整航线网络（例如特定跑道侧风阈值、活跃航线 SIGMETs）；Gale 引擎持续评估，只浮出可行动告警；告警经 API 送入既有签派或 OCC 工具
        - id: n4
          label: 运营决策（航空公司 OCC）
          detail: Lufthansa 运营控制中心收到带关键上下文的主动告警；无需人工全球扫描；运营人员专注判断和行动；决策：改航、延误或有信心继续飞行；估计避免的改航成本：每受影响航班 $22K–$240K
        - id: n5
          label: 结果与反馈闭环
          detail: 记录天气结果；按预报准确性评估平台表现；Gale 引擎持续用实时卫星数据训练，改善后续告警；Tomorrow.io 星座每次扩张都提供更密、更高频的观测，复利提升 AI 模型质量
      edges:
        - source: n1
          target: n2
          label: 原始辐射数据
        - source: n2
          target: n3
          label: 影响预报 + 卫星数据
        - source: n3
          target: n4
          label: 自动 API 告警
        - source: n4
          target: n5
          label: 决策结果
        - source: n5
          target: n2
          label: 持续模型改进闭环
