      Node labels and flow paths are based on publicly disclosed commercial activity, pricing
      page structure, and government contract announcements. Revenue magnitudes are disputed
      (see ARR conflict) and not encoded in this flow diagram. The flow represents the
      qualitative conversion path from customer demand to revenue recognition.
    claimRefs: [CI001, CI002, CI003, CI006, CI007]
    data:
      nodes:
        - id: n1
          label: Enterprise customer demand (aviation, insurance, energy, logistics)
          detail: >-
            250+ enterprise customers disclosed; commercial vertical mix unquantified;
            free developer API tier as top-of-funnel
        - id: n2
          label: Weather intelligence platform (SaaS subscription + API)
          detail: >-
            Enterprise plans via direct sales; no published list pricing; free tier
            rate-limited; conversion mechanism undisclosed
        - id: n3
          label: Government agencies (NOAA, DoD / AFLCMC)
          detail: >-
            Fixed-price and milestone-gated contracts; CWDP $2.27M, APFIT $10.2M;
            cumulative disclosed ~$33–35M
        - id: n4
          label: Revenue recognition (ARR / contract)
          detail: >-
            Commercial ARR disputed: $24.4M (GetLatka) vs ~$100M (company-claimed);
            government revenue milestone-gated and confirmed
        - id: n5
          label: Gross profit (blended, undisclosed)
          detail: >-
            Blended margin unknown; SaaS layer estimated 60–80%; satellite ops
            compress blended margin — no public disclosure
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5

  - id: FI002
    name: Unit Economics Bridge
    type: flow
    approximationNotes: >-
      All nodes represent qualitative placeholders. Specific metrics (CAC, payback period,
      LTV, net revenue retention) are unavailable from public sources. Node detail fields
      summarize the diligence gap for each unit-economics dimension.
