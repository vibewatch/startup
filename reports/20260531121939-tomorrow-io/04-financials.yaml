  evidenceGaps:
    - id: GI001
      description: >-
        The ARR discrepancy between company-claimed $100M (Series F marketing, Feb 2026) and
        GetLatka CEO-verified $24.4M (2025) cannot be resolved from public sources. Neither
        audited financial statements nor an investor-deck ARR definition with contractual backing
        are publicly available. This gap prevents application of revenue multiples and revenue
        quality assessment for the commercial segment.
      relatedQuestionRefs: [QI002]
      severity: high
      diligenceAsk: >-
        Request audited annual financial statements for FY2024 and FY2025, or an investor-deck
        ARR schedule with the contractual definition used (total contract value vs. recognized
        revenue vs. run-rate) and a reconciliation to GetLatka's figure.

    - id: GI002
      description: >-
        The mechanism by which Tomorrow.io converts free-tier API users to paid enterprise
        accounts is not documented publicly. No conversion rate, average time-to-contract,
        trial-to-paid funnel data, or sales qualification criteria are disclosed. This gap
        prevents assessment of GTM efficiency and commercial ARR growth sustainability.
      relatedQuestionRefs: [QI006]
      severity: medium
      diligenceAsk: >-
        Request sales funnel data including free-to-paid conversion rate, average enterprise
        sales cycle length, quota attainment, and the proportion of enterprise pipeline
        originating from free-tier developer signups.

    - id: GI003
      description: >-
        Net revenue retention (NRR) and gross revenue retention (GRR) are not disclosed by
        Tomorrow.io in any public-facing material. Without NRR, it is impossible to assess
        whether commercial ARR growth is driven by new customer acquisition or existing
        customer expansion, a critical distinction for SaaS valuation.
      relatedQuestionRefs: [QI007]
      severity: high
      diligenceAsk: >-
        Request trailing-twelve-month NRR and GRR by customer cohort, and the proportion
        of ARR growth attributable to expansion versus new logo acquisition.

    - id: GI004
      description: >-
        Tomorrow.io's monthly cash burn rate is not disclosed in any public source. Without
        burn rate, runway calculation post-$210M Series F depends entirely on benchmark
        assumptions, which vary widely based on headcount, satellite capex schedule, and
        cloud infrastructure spend. This gap creates material capital adequacy uncertainty.
      relatedQuestionRefs: [QI012]
      severity: high
      diligenceAsk: >-
        Request monthly cash flow statements for the past six months, including operating
        burn, capex, and ending cash balance; or a management bridge showing post-Series F
        runway at current and projected burn rates.

    - id: GI005
      description: >-
        Tomorrow.io's LTV/CAC ratio and enterprise customer payback period are not disclosed.
        No sales efficiency metrics — customer acquisition cost, quota attainment, payback
        period, or sales headcount by channel — are available from public sources. This gap
        prevents GTM efficiency benchmarking against comparable SaaS companies.
      relatedQuestionRefs: [QI025]
      severity: medium
      diligenceAsk: >-
        Request enterprise CAC by channel (inbound vs. outbound vs. government RFP),
        average payback period at current gross margin, and LTV at current NRR and
        average contract value.
