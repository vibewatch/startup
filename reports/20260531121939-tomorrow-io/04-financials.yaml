artifact: financials
slug: tomorrow-io
runDate: '2026-05-31'
company:
  name: Tomorrow.io
chapter:
  number: 4
  title: Financials
  summary: |
    Tomorrow.io has raised approximately $535 million in equity through May 2026, most recently a
    $210 million Series F ($175M in February 2026 led by Stonecourt Capital and HarbourVest Partners,
    extended by $35M in May 2026 from Pitango and Harel Insurance), at a post-money valuation
    exceeding $1 billion. The company reports approximately $100M ARR in Series F marketing
    materials, but GetLatka's CEO-verified database records $24.4M ARR for 2025 — a 4× discrepancy
    that is the single most material unresolved financial risk in this chapter. Government contracts
    (NOAA CWDP: $2.27M + extensions, DoD APFIT: $10.2M, cumulative government ~$33–35M) represent
    the best-documented revenue stream, offering milestone-gated, technically validated income.
    Commercial SaaS pricing is opaque: enterprise plans require contacting sales with no list prices
    published. No gross margin, burn rate, runway, or customer count is publicly disclosed. The
    company terminated a SPAC merger with Pine Technology Acquisition Corp in March 2022 at a $1.5M
    termination fee. Financial underwriting is blocked by three gaps: (1) unaudited ARR that diverges
    4× from third-party intelligence; (2) no gross margin or segment P&L; (3) no burn rate or
    runway data post-raise. Revenue quality is above average for the government segment and
    uncertain for the commercial segment.

