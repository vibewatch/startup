      ARR figures for commercial segment are disputed: company-claimed ~$100M (February 2026
      Series F marketing) versus GetLatka CEO-verified $24.4M (2025). Government contract
      values are from public contract award announcements. DeepSky data stream is pre-commercial
      with no disclosed pricing or contracted revenue as of May 2026.
    claimRefs: [CI001, CI002, CI004, CI005, CI015]
    columns:
      - Stream
      - Mechanism
      - Unit / Metric
      - Current Value / Status
      - Revenue Quality
      - Diligence Ask
    rows:
      - - Commercial SaaS / API
        - Subscription + API calls to enterprise buyers
        - ARR (annual recurring revenue)
        - $24.4M (GetLatka 2025) vs $100M (company-claimed Feb 2026)
        - Recurring, scalable — but disputed magnitude
        - Audited ARR or investor-deck ARR with definition
      - - Government direct (NOAA + DoD)
        - Fixed-price and cost-plus US government contracts
        - $ contract value per award
        - "~$33–35M cumulative disclosed (APFIT $10.2M, NOAA CWDP $2.27M+)"
        - "High quality: milestone-gated, non-cancellable mid-term"
        - Full contract list, share of recurring base
      - - Data licensing / resale
        - License processed weather data to third parties or white-label
        - Revenue per dataset / per API call
        - Not publicly disclosed
        - Potentially recurring — entirely unknown
        - Any licensing revenue, white-label contracts, API resellers
      - - DeepSky space data
        - Monetize satellite constellation data via subscriptions
        - Per access / per satellite pass
        - Pre-commercial; no disclosed pricing or contracts
        - Not yet realized; high future potential
        - Pricing model, anchor customer pipeline, commercialization timeline
      - - Professional services / international
        - Implementation, custom models, international gov partnerships
        - One-time or retainer fees
        - Not disclosed; Philippines partnership confirmed, no revenue quantified
        - Low-margin, non-recurring
        - Size, trend, and strategic intent

