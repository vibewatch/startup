        - Audited revenue schedule or investor-deck ARR with contractual definition
      - - Blended gross margin
        - Not disclosed; SaaS-only benchmark 60–80%; satellite ops compress blended
        - Unavailable — no public disclosure
        - Path to profitability and capital intensity measure
        - Gross margin by segment (software vs. space infrastructure)
      - - Monthly cash burn
        - Not disclosed; estimated range $5–20M+/month based on headcount proxies
        - Very low — estimated only
        - Runway calculation; capital adequacy assessment
        - Monthly cash flow statements or management burn disclosure
      - - Estimated runway (post Series F)
        - 18–36 months depending on undisclosed burn rate
        - Low — estimated based on $210M raise and benchmark burn ranges
        - Next financing trigger; dilution risk for existing shareholders
