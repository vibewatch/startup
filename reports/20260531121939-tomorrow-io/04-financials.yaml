      - Impact on Underwriting
      - Diligence Path
    rows:
      - - Audited ARR or verified revenue schedule
        - Cannot apply revenue multiples; 4× ARR conflict makes company valuation unanchored
        - Request audited annual financial statements or investor-deck ARR with contractual backing
      - - Gross margin by segment (SaaS vs. satellite operations)
        - Cannot model path to profitability; blended margin unknown; satellite COGS could compress to sub-40%
