      - - Enterprise SaaS platform
        - Contact sales; no published price
        - Undisclosed
        - Volume discounts, multi-year terms, and vertical-specific bundles assumed but unconfirmed
        - SI001
      - - DoD APFIT contract (fixed-price)
        - $10.2M total contract value
        - Contracted — fixed price with defined deliverables
        - Manufacturing and launch cost breakdown, overrun risk unknown
        - SI007, SI013
      - - NOAA CWDP contract (base + extension)
        - $2.27M base (Sep 2024) + extension (May 2025) + $899K radar (Jan 2026)
        - Contracted — milestone-gated
        - Extension terms, renewal probability, and multi-year escalation unknown
        - SI004, SI006
      - - DeepSky satellite data (future)
        - Not yet priced publicly
        - Pre-commercial
        - Anchor pricing, minimum contract size, and data licensing structure absent
