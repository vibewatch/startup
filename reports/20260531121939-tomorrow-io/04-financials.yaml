    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI025]
    columns:
      - Metric
      - Value
      - Source
      - Confidence
      - Diligence Ask
    rows:
      - - Total equity raised (cumulative)
        - "~$535M (seed 2016 through Series F May 2026)"
        - SI003, SI017
        - High — sum of disclosed rounds
        - Exact cap table with dilution by round; preferred stack; option pool
      - - Series F total (Feb + May 2026)
        - $210M ($175M tranche 1 + $35M tranche 2)
        - SI003, SI017
        - High — confirmed by two independent press releases
        - "Series F terms: liquidation preference, anti-dilution, board rights, ratchets"
      - - Post-money valuation (Feb 2026)
        - ">$1 billion (unicorn)"
        - SI015
        - Medium — investor-disclosed, no 409A or independent valuation cited
        - 409A valuation; preferred vs. common waterfall; option-pool discount
      - - Debt obligations
        - None publicly disclosed
        - SI018
        - Low — absence of disclosure does not confirm absence of debt
        - Confirm no project-finance, venture debt, or revenue-based financing
      - - Planned use of proceeds
        - DeepSky satellite manufacturing, launch, and constellation operations
        - SI017, SI003
        - Medium — stated in press releases; milestone schedule not public
        - Capex timeline, satellite count targets, launch windows, and milestone triggers

  - id: TI005
    name: Public Financial Gaps Table
    slug: public-financial-gaps-table
    notes: >-
      Financial gaps listed represent information that is material to underwriting but
      unavailable from public sources as of May 2026. All gaps require data-room or
      management disclosure to resolve.
    claimRefs: [CI027, CI028, CI029, CI032]
    columns:
