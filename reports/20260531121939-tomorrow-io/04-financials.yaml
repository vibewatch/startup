      - - Monthly burn rate and cash runway
        - Cannot assess capital adequacy post-$210M raise; next-round timing indeterminate
        - Monthly cash flow statements; trailing 3-month average burn; current bank balance
      - - Customer concentration and revenue mix
        - Revenue quality risk; government concentration above 50% implies policy risk; single-customer risk unknown
