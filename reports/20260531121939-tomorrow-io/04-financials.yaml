sections:
  - id: revenue-streams
    title: Revenue Streams
    body: >-
      Tomorrow.io's revenue architecture rests on two disclosed streams: commercial enterprise
      SaaS and direct US government contracts. The commercial segment sells weather intelligence
      as an API, platform subscription, and alerting service to enterprises across aviation,
      insurance, energy, logistics, and construction. No publicly available breakdown of commercial
      ARR by vertical, customer count, or contract size exists. The government segment is
      better-documented by virtue of public contract awards: Tomorrow.io has received disclosed
      government contract value of approximately $33–35 million across NOAA and the US Air Force's
      AFLCMC/HN (APFIT program) through May 2026. A third nascent stream — space infrastructure
      data from the DeepSky constellation — has been announced but carries no disclosed pricing or
      contracted revenue as of the research date. Potential additional streams such as data
      licensing to third parties, professional services, and international government partnerships
      are referenced in public sources but without financial quantification. The 4× discrepancy
      between the company-claimed $100M ARR (cited in Series F marketing materials, February 2026)
      and GetLatka's CEO-verified figure of $24.4M (2025) is the single most material unresolved
      financial risk in this chapter and prevents reliable revenue-multiple valuation without
      audited financials.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]

  - id: pricing-and-gtm
    title: Pricing and GTM
    body: >-
      Tomorrow.io's publicly accessible pricing page shows one free API tier with rate limits
      and no access to enterprise platform features; all commercial plans require contacting
      sales. No enterprise list pricing, per-seat pricing, or usage-based pricing is published,
      making benchmarking against industry peers such as The Weather Company (which lists
      $500/month for 1 million API calls) impossible. This pricing opacity is consistent with a
      high-ACV sales motion targeting enterprise procurement teams with multi-year contract terms
      and custom integrations — a pattern typical of vertical SaaS companies with average contract
      values above $50,000. The sales cycle is estimated to be three to nine months for enterprise
      accounts based on the complexity of weather workflow integration, though no official sales
      efficiency metrics have been disclosed. Tomorrow.io offers a free developer API tier as a
      top-of-funnel acquisition channel; the conversion mechanism from free to paid enterprise
      is not documented publicly and must be treated as an information gap. No disclosed sales
      efficiency metrics — customer acquisition cost, payback period, sales headcount, or quota
      attainment — are available. International revenue exists (Philippines government partnership
      for AI-powered agricultural weather forecasting) but is not quantified in any public source.
      Total enterprise customer count is not publicly disclosed as of May 2026.
    claimRefs: [CI006, CI007, CI033, CI034, CI035]
    tableRefs: [TI002]

  - id: government-contracts
    title: Government Contracts
    body: >-
      Government contracts represent Tomorrow.io's best-documented revenue stream, anchored by
      two US agencies: the Air Force (via AFLCMC/HN's APFIT program) and NOAA. The APFIT
      contract — awarded approximately March 2023 for $10.2 million — covers the manufacturing
      and launch of two operational demonstration weather satellites with microwave sounder and
      radar payloads, qualifying as a fixed-price program with defined deliverables. NOAA's
      Commercial Weather Data Pilot (CWDP) awarded Tomorrow.io $2.27 million in September 2024
      for commercial microwave sounder data, with a contract extension in May 2025 covering the
      2025 hurricane season and a subsequent $899,000 radar validation contract in January 2026.
      Cumulative disclosed government contract value through May 2026 is approximately $33–35
      million across NOAA and DoD. Government contracts are high-quality revenue: milestone-gated,
      non-recurring in structure but often renewed, and validated by operational NOAA adoption.
      The NOAA extension in May 2025 signals that CWDP data met NOAA's technical requirements —
      a strong independent credibility signal. The primary concentration risk is government budget
      dependency: if NOAA funding cuts (proposed 17% budget reduction under Trump 2026 budget) or
      DoD reprioritization reduce contract flow, Tomorrow.io has no confirmed commercial replacement
      for this revenue at scale.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]

  - id: capital-structure
    title: Capital Structure
    body: >-
      Tomorrow.io has raised approximately $535 million in equity across five or more identifiable
      rounds from seed (2016) through Series F (2026), with no publicly disclosed debt financing.
      The Series F closed in two tranches: a $175 million lead round in February 2026 anchored
      by Stonecourt Capital and HarbourVest Partners at a post-money valuation exceeding $1
      billion, followed by a $35 million extension in May 2026 from Pitango Venture Capital and
      Harel Insurance. Combined, the $210 million Series F is one of the largest single-round
      financings in commercial weather intelligence and places Tomorrow.io firmly in unicorn
      territory. The stated use of proceeds is DeepSky satellite constellation manufacturing,
      launch, and operations — a capital-intensive program with multi-year execution risk. No
      information on cash position, monthly burn, or runway is publicly available; estimated
      runway post-raise is 18–36 months depending on undisclosed burn rate. The company attempted
      to go public via SPAC in 2021–2022 but terminated the merger with Pine Technology Acquisition
      Corp in March 2022, paying a $1.5 million termination fee. The SPAC termination and
      subsequent reliance on private equity through 2026 indicates the company was not yet
      public-market-ready by its own assessment; the subsequent four years of private growth
      rounds suggest continued capital dependency before any liquidity event.
    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: cost-structure-and-verdict
    title: Cost Structure and Verdict
    body: >-
      Tomorrow.io's cost structure is not publicly disclosed, but its revenue model has two
      distinct cost layers. The software-first layer — cloud infrastructure, model compute,
      platform operations, and sales and marketing for the SaaS business — carries typical
      SaaS COGS of 20–40%. The satellite layer — manufacturing, launch, ground operations,
      and in-orbit maintenance for the DeepSky constellation — adds significant capital
      expenditure and operating cost that compresses blended gross margins well below SaaS
      benchmarks. The GetLatka-reported $24.4 million ARR, if accurate, implies an ARR multiple
      of approximately 40× on the $1 billion post-money valuation, which is at the high end for
      capital-intensive hardware/software hybrid companies. The company's financial verdict for
      underwriting purposes carries three key blockers: first, the unresolved 4× ARR discrepancy
      requires audited financial data before any revenue multiple can be applied; second, gross
      margin by segment (software versus satellite) is unavailable, preventing margin-path
      modeling; third, burn rate and runway are undisclosed, making capital adequacy assessment
      dependent on assumptions. Revenue quality is above average for the government segment
      (milestone-gated, NOAA-validated) and uncertain for the commercial segment given the
      ARR conflict. Investor base breadth (Stonecourt, HarbourVest, Pitango, Harel) and
      unicorn status are positive capital signals, but financing dependency on continued
      equity rounds creates dilution risk for common shareholders.
    claimRefs: [CI026, CI027, CI028, CI029, CI030, CI031, CI032, CI036, CI037]
    tableRefs: [TI005]
    figureRefs: [FI001, FI002, FI004]

tables:
