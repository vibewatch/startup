  title: "Product & Technology"
  summary: "Semperis delivers a specialized hybrid identity resilience platform that safeguards Active Directory, Entra ID, and Okta across the attack lifecycle, combining real-time threat interception with automated forest disaster recovery that reduces downtime by up to 90%."
sections:
  - id: "sec-product-overview"
    title: "Product Platform and Core Delivery Architecture"
    body: "Semperis delivers a specialized hybrid identity resilience platform focused on securing, defending, and recovering Microsoft Active Directory and Microsoft Entra ID environments alongside Okta. Because Active Directory was originally architected for centralized enterprise administration rather than continuous nation-state cyberattacks, modern ransomware operators routinely compromise domain controllers to establish persistence, move laterally, and seize administrative control across enterprise systems. Semperis provides a comprehensive defense-in-depth platform that spans the entire attack lifecycle, dividing capabilities into pre-attack posture assessment, real-time threat detection and auto-remediation, post-breach forest recovery, and crisis coordination. By decoupling directory backup metadata from vulnerable operating system states and maintaining immutable storage options, the platform addresses systemic directory vulnerabilities that legacy backup tools cannot resolve."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE012"
      - "CE013"
    figureRefs:
      - "FE001"
  - id: "sec-modules-matrix"
    title: "Modular Capabilities and Enterprise Migration Tooling"
    body: "The commercial product suite is anchored by Directory Services Protector (DSP) for continuous threat detection and Active Directory Forest Recovery (ADFR) for automated disaster reconstitution. In September 2026, Semperis expanded its modular footprint with Migrator for Active Directory 2.0, a ground-up architectural rebuild designed to treat cross-forest migrations as high-risk security boundaries rather than routine data copy tasks. Built natively on Kubernetes, Migrator 2.0 introduces wave-based Directory Synchronization Sets, comprehensive change-staging reports, and in-place endpoint cutover agents that eliminate costly device reimaging during corporate consolidations and M&A integrations. Furthermore, Semperis supports practitioner adoption through community tools like Purple Knight and Forest Druid, enabling security teams to audit directory exposure across hundreds of vulnerability indicators before deploying commercial runtime defense."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE014"
    tableRefs:
      - "TE001"
  - id: "sec-operational-workflows"
    title: "Operational Workflows, Zero Trust, and Deployment Dynamics"
    body: "Under conventional operational models, enterprise recovery following a domain-wide ransomware incident requires manual server re-imaging, forest schema reconstruction, and trust re-establishment, taking an average of twenty-one days and incurring massive business interruption costs. Semperis replaces this manual sequence with orchestrated, cyber-first forest restoration that restores directory databases to pristine environments in hours, delivering an estimated ninety percent reduction in downtime. In threat prevention workflows, Directory Services Protector inspects replication streams to intercept suspicious attribute changes, privilege escalations, and rogue credential creation, executing automated rollbacks without taking domain controllers offline. These workflows align closely with zero-trust mandates and regulatory frameworks such as SEC Regulation S-P, which compel organizations to maintain rigorously tested disaster recovery mechanisms capable of resuming operations within strict reporting windows."
    claimRefs:
      - "CE002"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"
  - id: "sec-resilience-risks"
    title: "Technical Differentiation, Security Controls, and Architecture Risks"
    body: "Semperis's core technological defensibility stems from its proprietary understanding of Active Directory internals and its patent-backed recovery engine that restores directory state without restoring underlying operating system binaries that may harbor persistent malware. However, this specialized architecture creates inherent platform risks. Semperis is tightly coupled to Microsoft's directory protocols, Kerberos implementation choices, and Entra ID Graph APIs. As Microsoft enforces security deprecations—such as the phased elimination of legacy RC4 Kerberos encryption—enterprises face complex migration blockers and coexistence failures that require proactive configuration. Additionally, running deep privileged monitoring agents across mission-critical domain controllers creates potential blast-radius concerns, demanding rigorous change governance and reliable third-party validation to ensure automated remediation routines never inadvertently disrupt legitimate administrative access."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
