        - Yes (Hybrid multi-cloud identity protection)
        - No (Strictly restricted to Microsoft ecosystem)
        - No (Focuses exclusively on Windows Active Directory)
        - Yes (Broad identity provider integration support)
        - Partial (Generic OS filesystem and hypervisor coverage)
