  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / Capitalization
      - Target Segment
      - Key Differentiation
      - Primary Limitation
    rows:
      - - Microsoft (Defender for Identity / Entra ID)
        - Incumbent Platform
        - Trillion-dollar enterprise scale; ubiquitous cloud directory footprint
        - Global enterprises using Windows and Microsoft 365 environments
        - Zero procurement friction via Microsoft 365 E5 bundling; native cloud integration
        - Lacks automated forest-wide disaster reconstruction; recovery requires extensive manual intervention
      - - Quest Software (Recovery Manager for AD)
        - Legacy Incumbent
        - Mature enterprise footprint; backed by private equity ownership
        - Traditional on-premises Windows enterprise infrastructure teams
        - Longstanding presence in directory object-level rollback and forest backup
        - Legacy architectural paradigm; lacks advanced real-time attack path graph analysis
      - - CrowdStrike (Falcon Identity / Preempt)
        - Endpoint / XDR Platform
        - Public company ($60B+ market cap); $3B+ ARR cybersecurity platform
        - Enterprise SOC, threat intelligence, and unified endpoint security buyers
        - Single lightweight agent correlating endpoint telemetry with identity traffic
        - Does not provide automated Active Directory forest rebuilding or offline state recovery
      - - Enterprise Backup (Rubrik / Veeam / Cohesity)
        - Data Protection Appliance
        - Multi-billion dollar data management providers (Rubrik public; Cohesity growth)
        - Enterprise IT infrastructure, storage, and disaster recovery executives
        - Massive storage scalability, immutable air-gapped snapshots, and unified backup
        - Treats Active Directory as generic VM payload; cannot cleanse AD database from logical corruption
      - - Silverfort / Tenable (Alsid)
        - Specialized Identity Security
        - Well-funded scale (Silverfort Series D; Tenable public enterprise security)
        - Identity architects, IAM teams, and compliance auditing officers
        - Agentless MFA enforcement across legacy protocols and continuous posture auditing
        - Zero disaster recovery capability; focus remains strictly on pre-attack prevention and MFA
    notes: Comparative profile of primary direct, incumbent, and adjacent alternative solutions across hybrid identity security and directory resilience, based on vendor technical disclosures and analyst evaluations.
