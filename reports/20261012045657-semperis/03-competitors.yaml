        - Partial (Multi-step server restoration with manual scripting)
        - No (No disaster recovery capability offered)
        - Partial (Bare-metal server image restore, risks reinfection)
      - - Hybrid AD & Entra ID Continuous Threat Detection
        - Yes (Direct replication stream monitoring via DSP)
        - Yes (Native telemetry sensors embedded in Entra ID)
        - Partial (Change tracking requiring separate agent plugin)
        - Yes (Real-time network and endpoint sensor analysis)
        - No (Periodic snapshot anomaly detection only)
      - - Active Directory Attack Path & Graph Analysis
        - Yes (Forest Druid & Purple Knight graph modeling)
        - Partial (Entra ID identity governance recommendations)
