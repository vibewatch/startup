    rows:
      - - Semperis Identity Resilience Platform
        - Subscription SaaS / Term License
        - Per-enabled user / directory object per year
        - Directory Services Protector (DSP) + AD Forest Recovery (ADFR)
        - Premium specialized resilience pricing; multi-year enterprise volume discounts
        - High ROI for organizations with severe downtime penalties; treated as cyber insurance
      - - Microsoft Defender for Identity
        - Enterprise Suite Bundle
        - Per-user per-month (M365 E5 / Security SKU)
        - Identity threat detection, sensor telemetry, unified M365 portal
        - Zero marginal software cost for existing E5 enterprise agreement holders
        - Imposes severe pricing resistance on Semperis DSP standalone threat detection module
      - - Quest Recovery Manager for AD (RMAD)
        - Perpetual + Maintenance / Subscription
        - Per-user or per-forest deployment unit
        - Forest disaster recovery edition, object recovery, change tracking
        - Aggressively discounted in legacy enterprise renewals; lower initial list price
        - Cost-effective for legacy on-premises IT shops lacking modern hybrid identity exposure
      - - CrowdStrike Falcon Identity Protection
        - Platform Module Subscription
        - Per-endpoint / per-user annual subscription
        - Identity threat detection, conditional access enforcement, Falcon console
        - Heavily bundled and discounted in broad Falcon enterprise consolidation deals
        - Direct competitive headwind during SOC consolidation initiatives across enterprise accounts
