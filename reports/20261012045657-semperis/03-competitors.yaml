        - Yes (Falcon identity threat graph correlation)
        - No (No understanding of directory schema relationships)
      - - Malware-Free Clean Forest Restoration
        - Yes (State-only restore bypassing contaminated OS binaries)
        - No (Relies on Microsoft Support manual remediation)
