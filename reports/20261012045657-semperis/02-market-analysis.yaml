company:
  name: "Semperis"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Semperis addresses a specialized identity-resilience market centered on protecting and recovering Active Directory and cloud identity systems rather than the full identity-and-access-management category. The assigned evidence shows a large installed directory base and rising AI-related identity exposure, but it does not support a defensible dollar TAM, SAM, SOM, CAGR, or market-share estimate."
sections:
  - id: "market-boundary"
    title: "A Narrow Identity-Resilience Boundary"
    body: >-
      The investable market boundary is narrower than identity and access management as a whole. Semperis positions its platform around preventing, detecting, responding to, and recovering from attacks on Active Directory, Entra ID, Okta, and Ping, while independent reporting describes Active Directory as the directory backbone for more than 90% of Fortune 1000 companies. Included spend therefore covers directory threat detection, cyber-first forest recovery, cloud-identity object and policy recovery, and crisis response. Generic single sign-on, routine identity provisioning, endpoint detection, SIEM, and ordinary infrastructure backup are adjacencies or substitutes, not part of a supportable core-market estimate. This boundary matters because broad IAM totals would materially overstate Semperis-addressable spend.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM011"
      - "CM016"
    tableRefs:
      - "TM001"
    figureRefs: []
  - id: "evidence-constrained-sizing"
    title: "Sizing Through Adoption Proxies, Not an Invented TAM"
    body: >-
      The assigned evidence supports several demand and deployment lenses but no independent market-spend series. TechCrunch and SiliconANGLE reported in 2024 that Semperis protected about or more than 100 million identities, while a May 2026 company release said more than 1,200 organizations relied on the platform. A June 2026 company-issued release used the looser wording “more than 1,000,” so both are best treated as lower-bound disclosures rather than an exact customer count. The Entra recovery product page separately reports 260 million users protected, but its denominator and overlap with company-wide identity counts are not explained. These figures establish scale and relevance; they cannot be converted into revenue, market share, or TAM without pricing, contract-value, deployment-overlap, and addressable-organization data.
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM012"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      The buying path crosses security, identity administration, infrastructure, and continuity functions. TechCrunch reports that CISOs are shifting attention toward identity resilience, while Semperis describes IT and security administrators as the operational users of Entra object and policy recovery. This implies a security-led purchase that must be validated by directory operators and justified through recovery readiness, outage exposure, or a failed control assessment. Semperis also describes an entirely channel-focused sales approach, making partners an important route into enterprise budgets and implementation workflows. Large hybrid estates and cloud-only Entra environments share the recovery problem, but procurement ownership, average contract value, renewal economics, and the split between security and disaster-recovery budgets remain undisclosed.
    claimRefs:
      - "CM011"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM003"
    figureRefs: []
  - id: "drivers-and-constraints"
    title: "Growth Drivers, Constraints, and Valuation Relevance"
    body: >-
      AI adoption is a plausible demand catalyst, but the available measurements are company-issued survey results rather than independent market forecasts. In a Semperis-reported Censuswide survey of 1,100 organizations across eight countries, 74% expected AI to increase attacks on identity infrastructure, 93% already used or planned to use AI agents for sensitive security tasks, only 32% were very confident they could regain control after administrator credentials were exposed, and 83% made AI identity governance a near-term priority. The gap between adoption and recovery confidence strengthens the case for dedicated resilience controls. Constraints are equally material: buyers may rely on native recovery assumptions, TechnologyAdvice flags limited automation for offloading recovery data, specialized tools compete with broader platform budgets, and no assigned source quantifies category spending or willingness to pay.
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM015"
    tableRefs: []
    figureRefs: []
