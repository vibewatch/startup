      - "CM006"
      - "CM012"
  - calloutType: "insight"
    title: "Recovery Confidence Lags AI-Agent Adoption"
    body: "The same company-issued survey reports 93% use or planned use of AI agents for sensitive tasks, but only 32% were very confident they could regain control after administrator credentials were exposed. This gap supports the urgency of identity recovery, while the issuer relationship limits its value as independent demand validation."
    claimRefs:
      - "CM008"
      - "CM009"
