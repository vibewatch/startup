    title: "No Defensible Dollar TAM in the Assigned Evidence"
    body: "The available sources support installed-base, deployment, and survey-demand proxies but do not disclose category revenue, CAGR, pricing, contract values, market share, or a count of qualified buyers. Applying a broad IAM market estimate or multiplying customer counts by an assumed contract value would create false precision."
