      - - Cloud Tenant Disaster Recovery (DRET / MightyID)
        - Annual SaaS Subscription
        - Per Protected Cloud Tenant / Seat
        - High-growth expansion stream across Entra ID & Okta
        - High (pure SaaS delivery with automated recurring billings)
        - Audit cloud tenant attach rate among existing on-prem ADFR customers.
      - - Federal & Public Sector Licensing
        - Government Contract Vehicles (SEWP V, ITES-SW2)
        - Agency-wide / Tiered Enterprise License
        - Active across defense contractors, states, and federal pilots
        - High (multi-year appropriations; FedRAMP 2026 pending)
        - Request contract vehicle delivery orders and agency pipeline conversion.
      - - Incident Response & Specialized Forensics
        - Fixed Retainer / Time & Materials
        - Incident Engagement / Hourly Rate
        - Tactical customer on-ramp following ransomware attacks
        - Moderate (non-recurring services with high gross margin variance)
        - Isolate professional services revenue contribution from subscription ARR.
    notes: Categorizes core subscription ARR vs cloud disaster recovery expansion and services.
