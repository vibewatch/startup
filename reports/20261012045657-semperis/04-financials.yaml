company:
  name: Semperis
chapter:
  number: 4
  title: Financials
  summary: Semperis achieved centaur status by surpassing $100M in annual recurring revenue (ARR) with a 100% channel distribution model, supported by $125M in June 2024 growth financing at a $1B+ valuation. However, key private SaaS metrics including gross margin, net revenue retention, and monthly cash burn rate remain undisclosed, creating material underwriting diligence gaps.
sections:
  - id: revenue-streams-and-pricing-architecture
    title: Revenue Model, Pricing Mechanics, and Product Monetization Streams
    body: Semperis generates the substantial majority of its revenue through multi-year enterprise software subscriptions protecting critical identity directory infrastructure. The core commercial engine is anchored by Directory Services Protector (DSP) for threat detection and posture management, and Active Directory Forest Recovery (ADFR) for automated bare-metal disaster recovery across hybrid Active Directory and Entra ID environments. These software licenses are priced on a recurring annual per-enabled-user subscription basis, with tiered pricing schedules that scale with enterprise identity counts. Customer deployments span more than 1,000 enterprise organizations and protect over 100 million user identities globally. Official pricing remains strictly list-based, with enterprise contract pricing realized through volume discounting, multi-year commitments, and enterprise license agreements (ELAs). Beyond core Active Directory protection, Semperis has expanded its monetization footprint into adjacent SaaS tenant recovery for Entra ID, Okta, and Ping Identity, diversifying subscription streams while preserving high recurring revenue quality.
    claimRefs:
      - CI001
      - CI004
      - CI011
      - CI014
    tableRefs:
      - TI001
      - TI002
    figureRefs: []
  - id: gtm-motion-and-channel-economics
    title: Go-to-Market Economics, Channel Leverage, and Sales Efficiency
    body: Semperis executes an indirect go-to-market motion utilizing a 100% two-tier channel partner distribution architecture worldwide. Rather than fielding an exclusively direct enterprise sales force with high fixed customer acquisition costs (CAC), the company leverages global systems integrators, value-added resellers (VARs), and specialized security distributors to deliver its platform. In the public sector and federal defense market, Semperis partners with master government aggregator Carahsoft, securing placement on foundational contract vehicles including NASA SEWP V and Army ITES-SW2. While this channel strategy substantially compresses sales cycles, scales procurement velocity, and enables access to federal agencies, independent industry analysis indicates that procurement expansion alone does not resolve the operational governance and accountability gap required for directory resilience and crisis recovery. Furthermore, Semperis is pursuing FedRAMP authorization in 2026 through a 3PAO gap remediation plan to accelerate civilian federal adoption.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI009
    tableRefs: []
    figureRefs:
      - FI001
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Unit Economics Proxies, and Private Metric Gaps
    body: The cost structure of Semperis exhibits the typical operating leverage of high-margin enterprise infrastructure software, tempered by specialized hybrid deployment requirements. Cost of goods sold (COGS) comprises cloud hosting for SaaS telemetry and Entra ID tenant recovery, dedicated customer success engineering, and specialized incident response personnel who assist customers during catastrophic directory outages. Based on enterprise security peer benchmarks, core software gross margins are estimated in the 75% to 80% range, though professional services for complex forest recovery tabletop exercises and incident response carry lower margins. While commercial data aggregator CompWorth projects annualized revenue at $151 million with over 500 personnel, official company disclosures confirm only the $100M+ ARR milestone. Critical SaaS unit economics—specifically Net Revenue Retention (NRR), gross revenue retention, customer acquisition payback periods, and top-customer ARR concentration—remain tightly held private data, posing significant underwriting challenges.
    claimRefs:
      - CI001
      - CI008
      - CI012
      - CI013
    tableRefs:
      - TI003
    figureRefs: []
  - id: capital-adequacy-and-financial-verdict
    title: Capital Adequacy, Financing Dependency, and Underwriting Verdict
    body: Semperis demonstrates robust capital adequacy following its $125 million strategic growth financing in June 2024 from J.P. Morgan and Hercules Capital. Notably, this round combined equity and non-dilutive debt financing, allowing the company to fortify its balance sheet, invest in R&D, and expand global distribution while minimizing equity dilution ahead of an anticipated initial public offering. TechCrunch confirmed the financing valued Semperis at over $1 billion, establishing unicorn status. To prepare for public company governance, Semperis recruited experienced public-market executives including CFO Jeff Bray, CRO Mike DeGaetano, and CLO Annabel Lewis. From an investment underwriting perspective, Semperis represents high revenue quality given its mission-critical Active Directory lock-in and 100% channel leverage, but opacity surrounding ongoing monthly cash burn, debt covenant structures, and organic ARR acceleration makes the financial profile a diligence priority prior to underwriting.
    claimRefs:
      - CI002
      - CI003
      - CI010
      - CI012
    tableRefs: []
    figureRefs: []
