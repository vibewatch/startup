callouts:
  - calloutType: insight
    title: 100% Channel Distribution Shields GTM Margin
    body: Semperis leverages a 100% two-tier channel partner distribution model alongside master government aggregators like Carahsoft. This architecture reduces direct enterprise sales overhead and customer acquisition costs, improving operating leverage as ARR scales past $100M.
    claimRefs:
      - CI005
      - CI006
  - calloutType: risk
    title: Opaque Cash Burn and Runway Dependency
    body: While Semperis raised $125M in combined debt and equity growth financing in mid-2024, the absence of public disclosure on monthly burn rate, customer churn, and exact debt servicing obligations represents a key diligence blocker for private underwriting.
    claimRefs:
      - CI002
      - CI012
