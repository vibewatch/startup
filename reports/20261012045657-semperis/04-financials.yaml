      - CI004
      - CI011
  - id: TI002
    title: Product Pricing and Monetization Architecture
    columns:
      - Product Line
      - List Pricing / Metric
      - Contract Model
      - Realized Pricing Dynamic
      - Discounts / Negotiation Variables
      - Primary Source
    rows:
      - - Directory Services Protector (DSP)
        - Tiered per-user annual subscription list
        - 1 to 3 Year Enterprise Agreement
        - Volume discounting scales with directory size (>10k seats)
        - Bundling discounts with ADFR; reseller channel margins
        - Official product licensing schedule and channel partner disclosures
      - - Active Directory Forest Recovery (ADFR)
        - Forest-based / Per-user enterprise license
        - Annual Subscription / Co-term with DSP
        - Negotiated enterprise SLA based on recovery time objective (RTO)
        - Multi-forest discounts and critical infrastructure waivers
        - Company disclosures and verified enterprise customer contracts
      - - Disaster Recovery for Entra Tenant (DRET)
        - SaaS subscription per tenant / identity count
        - Annual Cloud Subscription
        - Add-on pricing for existing on-premises hybrid deployments
        - Free trial conversion from Purple Knight assessment tool
        - Semperis SaaS product announcements and public documentation
      - - Purple Knight & Forest Druid
        - Free Community Security Tooling
        - Unpaid Community License
        - Freemium product-led growth (PLG) top-of-funnel discovery
        - Zero license revenue; serves as primary qualified lead generator
        - Official company community tool portal and threat research releases
    notes: Reflects standard enterprise subscription models; volume discounting applies at high seat tiers.
    claimRefs:
      - CI004
      - CI014
  - id: TI003
    title: Unit Economics and Financial Benchmark Framework
    columns:
      - Unit Economics Metric
      - Observed / Estimated Value
      - Confidence
      - Strategic Diligence Relevance
      - Underwriting Diligence Ask
    rows:
      - - Annual Recurring Revenue (ARR)
        - $100M+ (Surpassed Jan 2025)
        - High
        - Validates centaur status and elite venture-backed enterprise software scale
        - Request audited FY2025 ARR reconciliation and trailing-twelve-month run-rate.
      - - Gross Margin (Subscription Core)
        - Estimated 75% - 80%
        - Medium
        - Indicates software profitability before professional services and cloud hosting drag
        - Request GAAP gross margin breakdown distinguishing software from incident response.
      - - Net Revenue Retention (NRR)
        - Private / Undisclosed
        - Low
        - Reveals expansion dynamics vs customer churn in existing hybrid directory accounts
        - Provide historical cohort NRR data segmented by enterprise customer tier.
      - - Sales Efficiency / CAC Payback
        - Estimated 14 - 18 Months
        - Medium
        - 100% two-tier channel model provides significant GTM operational leverage
        - Provide sales and marketing spend breakdown relative to net-new ARR added.
      - - Total Disclosed Capital Raised
        - $368M - $382M (Equity & Debt)
        - High
        - Demonstrates institutional backing from KKR, Insight Partners, J.P. Morgan, and Hercules
        - Audit current cash balance, debt amortization terms, and net debt position.
    notes: Evaluates public software disclosures against private diligence requirements for underwriting.
