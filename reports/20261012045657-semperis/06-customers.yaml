figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Enterprise adoption pathway from initial community vulnerability assessment to full hybrid identity resilience platform deployment."
    approximationNotes: "Journey stages, touchpoints, and expansion mechanics synthesized from published customer case studies, partner documentation, and commercial disclosures."
    data:
      nodes:
        - label: "Initial Assessment & Vulnerability Audit"
          touchpoints:
            - "Purple Knight free vulnerability assessment"
            - "Forest Druid Tier-0 attack path analysis"
            - "Discovery of legacy Active Directory misconfigurations"
          description: "Enterprise identifies unpatched attack paths and identity drift across on-premises Active Directory."
        - label: "Procurement & Security Mandate"
          touchpoints:
            - "CISO board-level risk briefing"
            - "Cyber insurance policy resilience prerequisites"
            - "DORA and NIST framework compliance requirements"
          description: "Ransomware threat awareness and regulatory mandates drive dedicated budget allocation for identity defense."
        - label: "Forest Recovery Deployment"
          touchpoints:
            - "Automated forest backup implementation"
            - "Isolated clean-OS recovery simulation testing"
            - "90% downtime reduction operational validation"
          description: "Organization deploys Semperis ADFR to ensure rapid, non-destructive recovery in the event of ransomware lockout."
        - label: "Continuous Threat Detection & Response"
          touchpoints:
            - "Directory Services Protector (DSP) agent rollout"
            - "Real-time Entra ID and Active Directory change auditing"
            - "Enterprise SIEM and SOAR workflow integration"
          description: "Customer expands contract from post-incident recovery to proactive threat detection and real-time rollback."
        - label: "Identity Migration & Infrastructure Modernization"
          touchpoints:
            - "Migrator for AD 2.0 wave-based project deployment"
            - "M&A directory consolidation without provisioning disruption"
            - "Mitigation of deprecated Kerberos RC4 encryption dependencies"
          description: "Enterprise leverages Semperis to consolidate acquired directories and modernize legacy identity infrastructure."
        - label: "Multi-Cloud Governance & Platform Resilience"
          touchpoints:
            - "Okta and Ping Identity federation defense"
            - "Automated bot-versus-bot defense against agentic AI attacks"
            - "Out-of-band crisis coordination during critical outages"
          description: "Customer attains full platform resilience, securing hybrid directories and emerging autonomous software agents."
