chapter:
  number: 6
  title: "Customers"
  summary: "Semperis has expanded its hybrid identity resilience customer base to more than 1,200 enterprise organizations, protecting over 100 million user identities across critical infrastructure, healthcare, transportation, and finance. High-profile production references including Lenovo, Starbucks, United Airlines, and Sharp Healthcare demonstrate strong mission-critical retention, though opaque disclosure on net revenue retention (NRR) and ARR concentration leaves private expansion quality as an ongoing diligence question."
sections:
  - id: "customer-segmentation-and-target-buyers"
    title: "Customer Segmentation and Enterprise Buyer Personas"
    body: "Semperis targets enterprise organizations that operate mission-critical, hybrid identity infrastructure where Active Directory and Entra ID represent single points of operational failure. Primary buyers are Chief Information Security Officers (CISOs), Identity and Access Management (IAM) infrastructure leaders, and enterprise disaster recovery architects across regulated sectors. Customer segmentation divides into four primary tiers: Global 1000 enterprises facing complex multi-forest environments, healthcare systems safeguarding clinical availability, public sector institutions defending citizen services, and mid-market enterprises modernizing legacy directory architectures. Enterprise adoption is characterized by high operational switching costs, as Semperis integrates deeply into directory replication engines, backup storage vaults, and security operations workflows. Buyers prioritize automated, non-destructive recovery over traditional manual rebuilds to prevent prolonged enterprise downtime during ransomware extortion events."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-scale-and-growth-trajectory"
    title: "Adoption Trajectory, Identity Scale, and Market Penetration"
    body: "Semperis' commercial adoption trajectory reflects rapid enterprise expansion following its 2020 Series B financing. The company scaled its customer base from approximately 50 enterprise customers in 2019 to over 1,200 organizations by 2026, while expanding protected user identities beyond 100 million across North America, Europe, and Asia-Pacific. Market penetration is particularly pronounced among elite global enterprises, with more than 25 percent of the 100 largest U.S. corporations deploying Semperis solutions to defend critical directory tiers. This customer expansion underpinned Semperis crossing the $100 million annual recurring revenue (ARR) milestone in January 2025. Customer adoption is typically initiated through free community assessment tools like Purple Knight before procurement teams commit to enterprise-wide Directory Services Protector and Active Directory Forest Recovery platform licenses. Independent economic analyses confirm substantial operational return on investment, highlighted by a 90 percent reduction in post-attack directory downtime."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-production-proof-and-case-studies"
    title: "Production Case Studies and Sector Reference Validation"
    body: "Verified production deployments substantiate Semperis' capabilities across diverse commercial, healthcare, and industrial operating environments. Notable public commercial references include Lenovo Group Ltd., Starbucks Corp., Sanofi, Hertz Global Holdings Inc., and United Airlines Holdings Inc., each relying on Semperis to protect core directory services from operational disruptions. In the healthcare sector, where ransomware attacks directly threaten patient care, deployments at Sharp Healthcare, Prime Healthcare, and Independence Blue Cross highlight the vendor's focus on clinical resilience. For instance, Sharp Healthcare leveraged Semperis Migrator for AD during complex hospital acquisition integrations to synchronize directory contacts and maintain unbroken clinical provisioning without compromising Kerberos authentication protocols. Similarly, industrial manufacturing conglomerate Dürr Group adopted Semperis following a subsidiary security breach to eliminate blind spots across hybrid Active Directory and Entra ID environments, establishing resilient forensics and rapid recovery readiness."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risk"
    title: "Durability, Land-and-Expand Dynamics, and Concentration Risks"
    body: "Customer retention durability is structurally supported by the architectural lock-in of Active Directory backup architectures and the specialized expertise required to safely restore compromised directory forests without reinfecting clean domain controllers. Third-party review aggregators record high customer sentiment, evidenced by a 4.8 out of 5.0 score across more than 1,200 reference evaluations on FeaturedCustomers. Platform expansion follows an identifiable land-and-expand trajectory, where initial forest recovery contracts expand into continuous threat monitoring, automated migration management, and multi-cloud identity defense across Okta and Ping Identity. However, Semperis maintains private disclosure regarding net revenue retention (NRR), gross churn cohorts, and top-customer ARR concentration. Furthermore, aggressive competition from comprehensive platform providers like CrowdStrike and Microsoft poses ongoing renewal friction, making explicit visibility into customer retention cohorts a mandatory diligence requirement for prospective investors."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
