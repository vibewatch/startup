evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-enumeration
    missingEvidence: Complete disclosure of extended board of directors, independent directors, and advisory board composition.
    whyItMatters: Governs corporate oversight and independent board guidance ahead of potential public market listing.
    diligencePath: Request confidential board roster, committee charters, and voting control agreements during management diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-capitalization
    missingEvidence: >-
      Detailed capitalization table showing exact equity percentages, debt covenants from Hercules Capital, and
      liquidation preferences.
    whyItMatters: >-
      Debt repayment obligations and preferred return hurdles directly affect common equity value and dilution in an
      exit scenario.
    diligencePath: Review full cap table, debt facility terms with Hercules Capital, and investor rights agreements under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming exact ARR, net revenue retention (NRR), gross margins, and monthly cash
      burn rate.
    whyItMatters: >-
      Private valuation multiples and runway sustainability cannot be verified without audited income and cash flow
      statements.
    diligencePath: Obtain audited FY2024-FY2025 financial statements and quarterly cohort retention metrics from CFO Jeff Bray.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: market-spend-sizing
    missingEvidence: >-
      Independent category revenue, CAGR, addressable-organization counts, and spending data specific to identity threat
      detection and directory recovery.
    whyItMatters: >-
      Without an independent spend denominator, the available installed-base and deployment metrics cannot be converted
      into a defensible TAM, SAM, SOM, or market share.
    diligencePath: >-
      Obtain current third-party analyst category definitions and market models, then reconcile their included products
      and geographies with the chapter's narrow market boundary.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-budget
    missingEvidence: >-
      Semperis average contract value, pricing units, procurement-cycle duration, renewal rates, and the actual budget
      owners funding purchases.
    whyItMatters: >-
      These private inputs are necessary for bottom-up market sizing and for testing whether adoption proxies translate
      into durable paid demand.
    diligencePath: >-
      Review anonymized contracts, pipeline cohorts, win-loss data, renewal records, and customer procurement interviews
      by segment.
    relatedQuestionRefs:
      - QM002
      - QM003
  - type: conflicting-data
    severity: minor
    topic: customer-lower-bound
    missingEvidence: A dated exact customer count with a consistent definition of customer or organization.
    whyItMatters: >-
      The May and June 2026 company disclosures use different lower bounds, preventing an exact penetration or
      market-share calculation.
    diligencePath: >-
      Request a customer cohort schedule that defines paying organizations, subsidiaries, proof-of-concept accounts, and
      the measurement date.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: competitive-win-loss-rates
    missingEvidence: >-
      Audited head-to-head win/loss rates, customer displacement statistics, and discounting levels versus Microsoft
      Defender for Identity and CrowdStrike Falcon in enterprise procurement bake-offs.
    whyItMatters: >-
      Without empirical win/loss data, assessing whether Semperis is sustaining pricing power against bundled Microsoft
      E5 security and consolidating XDR platforms remains an underwriting uncertainty.
    diligencePath: >-
      Request anonymized enterprise sales win/loss logs, competitive takeout case studies, and renewal retention
      breakdowns from Semperis commercial leadership under NDA.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: burn-rate-and-unit-economics
    missingEvidence: >-
      Audited breakdown of ongoing monthly cash burn rate, gross margin by revenue stream, net revenue retention (NRR),
      and top-20 customer ARR concentration.
    whyItMatters: >-
      Without verified net revenue retention and burn rate data, investors cannot determine whether ARR expansion is
      driven by efficient expansion vs costly new logo acquisition, nor precisely evaluate cash runway.
    diligencePath: Request audited GAAP financials, cohort retention data, SaaS metrics dashboard, and debt covenant terms under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: third-party-benchmarks
    missingEvidence: >-
      Independent laboratory benchmarks evaluating Semperis Directory Services Protector false-positive rates, alert
      processing latency, and auto-remediation accuracy across complex multi-forest Active Directory topologies.
    whyItMatters: >-
      Without independent performance verification, buyers must rely on vendor claims regarding operational overhead and
      detection efficacy when defending against advanced threat actors.
    diligencePath: >-
      Request customer deployment test data, POC telemetry reports, and third-party lab evaluations (such as MITRE
      ATT&CK evaluations or independent cyber testing labs).
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: customer-retention-nrr
    missingEvidence: Audited Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) cohort data for enterprise contracts.
    whyItMatters: >-
      Without disclosed NRR or churn rates, the quality and durability of Semperis' expansion revenue cannot be
      independently validated.
    diligencePath: >-
      Request customer cohort retention schedules, gross renewal rates, and expansion ACV benchmarks during management
      diligence.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: named-customer-disclosure
    missingEvidence: >-
      Comprehensive production deployment audit covering the full 1,200+ customer roster, including contract size and
      top-customer ARR concentration.
    whyItMatters: >-
      Public disclosures are restricted to voluntary case studies and enterprise reference samples, obscuring customer
      concentration in top accounts.
    diligencePath: Request top-20 customer revenue concentration breakdown and pilot-to-production conversion logs.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: >-
      Current regulator, court, authorization, certification, privacy, intellectual-property, claims, and incident
      records across all operating jurisdictions.
    whyItMatters: >-
      The bounded assigned pool can describe compliance use cases but cannot establish Semperis' complete legal and
      regulatory exposure.
    diligencePath: >-
      Obtain counsel and claims schedules, search applicable court and regulator registries, verify authorization
      listings, and reconcile results to management representations.
    relatedQuestionRefs:
      - QR005
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financing-and-operating-economics
    missingEvidence: >-
      Current cash, monthly burn, gross margin, retention, customer concentration, debt principal, maturity, interest,
      covenants, and covenant headroom.
    whyItMatters: >-
      A historical financing amount does not reveal current liquidity, capital efficiency, debt-service capacity, or
      downside resilience.
    diligencePath: >-
      Review current audited financials, debt agreements, covenant certificates, cash forecasts, cohort retention,
      receivables aging, and top-customer schedules.
    relatedQuestionRefs:
      - QR010
  - type: private-evidence-only
    severity: material
    topic: operational-validation
    missingEvidence: >-
      Independent recovery benchmarks, failed-change rates, rollback times, support escalations, and partner-level
      deployment quality metrics.
    whyItMatters: >-
      Vendor-described controls do not establish production performance during a severe directory compromise or complex
      migration.
    diligencePath: >-
      Run a witnessed recovery exercise, inspect anonymized incident and support data, and conduct reference calls with
      complex multi-forest customers.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited income statements detailing gross margins, monthly cash burn, and net revenue retention rates.
    whyItMatters: >-
      Without public disclosure of unit economics or cash burn, runway duration and operating leverage cannot be
      independently validated.
    diligencePath: >-
      Request confidential quarterly financial packages, cohort retention waterfalls, and audited GAAP statements under
      NDA.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: minor
    topic: competitive-benchmarks
    missingEvidence: >-
      Direct win/loss telemetry and displacement rates against Microsoft Entra ID native resilience features and
      CrowdStrike Falcon identity protection.
    whyItMatters: >-
      Assessing whether enterprise buyers consolidate identity tools into broader security platform agreements impacts
      long-term terminal value multiples.
    diligencePath: >-
      Interview enterprise CISOs and channel partners regarding budget allocation priorities between standalone identity
      recovery tools and integrated platform suites.
    relatedQuestionRefs:
      - QV002
