      - number: '6.3'
        title: Production Case Studies and Sector Reference Validation
        blocks:
          - type: paragraph
            body: >-
              Verified production deployments substantiate Semperis' capabilities across diverse commercial, healthcare,
              and industrial operating environments. Notable public commercial references include Lenovo Group Ltd.,
              Starbucks Corp., Sanofi, Hertz Global Holdings Inc., and United Airlines Holdings Inc., each relying on
              Semperis to protect core directory services from operational disruptions. In the healthcare sector, where
              ransomware attacks directly threaten patient care, deployments at Sharp Healthcare, Prime Healthcare, and
              Independence Blue Cross highlight the vendor's focus on clinical resilience. For instance, Sharp
              Healthcare leveraged Semperis Migrator for AD during complex hospital acquisition integrations to
              synchronize directory contacts and maintain unbroken clinical provisioning without compromising Kerberos
              authentication protocols. Similarly, industrial manufacturing conglomerate Dürr Group adopted Semperis
              following a subsidiary security breach to eliminate blind spots across hybrid Active Directory and Entra
              ID environments, establishing resilient forensics and rapid recovery readiness.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
