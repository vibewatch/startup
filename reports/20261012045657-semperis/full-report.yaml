              - CU003
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption Trajectory, Identity Scale, and Market Penetration
        blocks:
          - type: paragraph
            body: >-
              Semperis' commercial adoption trajectory reflects rapid enterprise expansion following its 2020 Series B
              financing. The company scaled its customer base from approximately 50 enterprise customers in 2019 to over
              1,200 organizations by 2026, while expanding protected user identities beyond 100 million across North
              America, Europe, and Asia-Pacific. Market penetration is particularly pronounced among elite global
              enterprises, with more than 25 percent of the 100 largest U.S. corporations deploying Semperis solutions
              to defend critical directory tiers. This customer expansion underpinned Semperis crossing the $100 million
              annual recurring revenue (ARR) milestone in January 2025. Customer adoption is typically initiated through
              free community assessment tools like Purple Knight before procurement teams commit to enterprise-wide
              Directory Services Protector and Active Directory Forest Recovery platform licenses. Independent economic
              analyses confirm substantial operational return on investment, highlighted by a 90 percent reduction in
              post-attack directory downtime.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU010
              - CU011
