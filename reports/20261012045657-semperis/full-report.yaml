  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: A Narrow Identity-Resilience Boundary
        blocks:
          - type: paragraph
            body: >-
              The investable market boundary is narrower than identity and access management as a whole. Semperis
              positions its platform around preventing, detecting, responding to, and recovering from attacks on Active
              Directory, Entra ID, Okta, and Ping, while independent reporting describes Active Directory as the
              directory backbone for more than 90% of Fortune 1000 companies. Included spend therefore covers directory
              threat detection, cyber-first forest recovery, cloud-identity object and policy recovery, and crisis
              response. Generic single sign-on, routine identity provisioning, endpoint detection, SIEM, and ordinary
              infrastructure backup are adjacencies or substitutes, not part of a supportable core-market estimate. This
              boundary matters because broad IAM totals would materially overstate Semperis-addressable spend.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
