              - CO006
              - CO007
      - number: '1.4'
        title: Operational Scale, Strategic Milestones, and Architectural Risks
        blocks:
          - type: paragraph
            body: >-
              Since its commercial service launch in 2015, Semperis has expanded its operational footprint to safeguard
              mission-critical enterprise environments, serving landmark customers including Lenovo, Starbucks, United
              Airlines, and the Michigan state government. Beyond commercial platform deployments, the company earned
              widespread community goodwill through its free Purple Knight directory assessment tool, which evaluates
              Active Directory security posture across thousands of global practitioners. However, independent
              cybersecurity analysis underscores that over-reliance on legacy Active Directory architectures creates an
              acute systemic blast radius: because directory infrastructure was architected for administrative trust
              rather than sustained nation-state pressure, any compromise of core directory authorities threatens to
              invalidate downstream Zero Trust controls across the entire enterprise.
