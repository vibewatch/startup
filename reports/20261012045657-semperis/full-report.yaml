      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              The company is guided by co-founder and Chief Executive Officer Mickey Bresman, who established Semperis's
              technical architecture around identity-first operational resilience. In June 2024, Semperis significantly
              bolstered its executive bench with three senior C-suite appointments designed to establish corporate
              governance and readiness for an eventual initial public offering. Chief Financial Officer Jeff Bray brings
              extensive public and private market experience from Rapid7, Imprivata, and Invicti Security, having
              managed over $1 billion in capital markets transactions. Chief Revenue Officer Mike DeGaetano previously
              led global sales organizations at Broadcom, Forcepoint, and Zscaler both before and after its IPO, while
              Chief Legal Officer Annabel Lewis contributes two decades of governance, compliance, and M&A leadership
              across Trustwave and Onapsis. While executive depth is substantially strengthened, day-to-day strategic
              direction remains heavily dependent on Bresman's founder-market fit.
            claimRefs:
