      - number: '1.3'
        title: Capitalization Structure, Valuation, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Semperis has raised over $325 million in total cumulative capital across its institutional financing
              history, supported by leading technology sponsors and growth equity funds. Following a pivotal $200
              million Series C financing in 2022 led by global investment firm KKR, the company secured an additional
              $125 million growth financing facility in June 2024. Structured as a balanced blend of growth equity and
              venture debt from J.P. Morgan and Hercules Capital, the 2024 transaction confirmed Semperis's post-money
              valuation above the $1 billion unicorn benchmark. This capitalization strategy minimized equity dilution
              for founders and employees while expanding balance-sheet reserves for product development, global sales
              channel enablement, and strategic research and development across North America and Israel.
            claimRefs:
              - CO006
              - CO007
              - CO008
