chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Stage, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Semperis is an enterprise cybersecurity vendor specializing in hybrid Active Directory and Entra ID
              identity threat detection, incident response, and cyber-resilient disaster recovery. Founded in 2013 and
              headquartered in Hoboken, New Jersey, the company was established by Mickey Bresman, Guy Teverovsky, and
              Matan Liberman to defend critical identity fabrics from destructive cyberattacks. Operating at a
              late-stage growth posture, Semperis protects more than 100 million user identities across global
              enterprises spanning healthcare, finance, transportation, and public sector infrastructure. The company
              delivers its Directory Services Protection Platform through a dedicated 100% channel partner distribution
              model, avoiding direct sales conflict while scaling enterprise procurement across global markets.
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO011
              - CO013
