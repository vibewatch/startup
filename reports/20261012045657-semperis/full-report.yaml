  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-layer functional architecture of the Semperis platform from exposure discovery to crisis coordination.
    data:
      layers:
        - label: 'Layer 1: Identity Attack Surface Exposure & Community Assessment'
          detail: >-
            Free community posture assessment tools including Purple Knight and Forest Druid evaluating 218+ security
            indicators.
        - label: 'Layer 2: Continuous Identity Threat Detection & Posture Hardening'
          detail: >-
            Directory Services Protector (DSP) and Lightning Intelligence for real-time change tracking and attack path
            reduction.
        - label: 'Layer 3: Real-Time Threat Interception & Automated Remediation'
          detail: >-
            In-memory directory change interception engine executing immediate rollback of malicious privilege
            escalations.
        - label: 'Layer 4: Automated Cyber-First Disaster Recovery'
          detail: >-
            Active Directory Forest Recovery (ADFR) rebuilding directory state to clean, isolated hardware enclaves in
            hours.
        - label: 'Layer 5: Cross-Environment Migration & Consolidation'
          detail: >-
            Migrator for Active Directory 2.0 utilizing Kubernetes runtime, Directory Synchronization Sets, and in-place
            endpoint agents.
        - label: 'Layer 6: Enterprise Crisis Orchestration & Out-of-Band Coordination'
          detail: >-
            Ready1 critical incident platform for secure out-of-band coordination when core corporate infrastructure is
            impaired.
    approximationNotes: null
    claimRefs:
