      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              AI adoption is a plausible demand catalyst, but the available measurements are company-issued survey
              results rather than independent market forecasts. In a Semperis-reported Censuswide survey of 1,100
              organizations across eight countries, 74% expected AI to increase attacks on identity infrastructure, 93%
              already used or planned to use AI agents for sensitive security tasks, only 32% were very confident they
              could regain control after administrator credentials were exposed, and 83% made AI identity governance a
              near-term priority. The gap between adoption and recovery confidence strengthens the case for dedicated
              resilience controls. Constraints are equally material: buyers may rely on native recovery assumptions,
              TechnologyAdvice flags limited automation for offloading recovery data, specialized tools compete with
              broader platform budgets, and no assigned source quantifies category spending or willingness to pay.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
