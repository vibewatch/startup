      - number: '7.2'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              Semperis sells into failure scenarios where weak implementation can itself create material disruption. Its
              migration release identifies RC4-dependent service-account failures, cross-forest authentication
              breakdowns, and coexistence disruption as migration-window hazards, while describing staging, change
              previews, searchable logs, and deployment validation as mitigations. A separate company-issued release
              says legacy service accounts can accumulate excessive privileges and static credentials; the product
              response is inventory, monitoring, exposure detection, and automated rollback. Those controls are
              directionally relevant but are not independently benchmarked in the assigned evidence. The diligence
              standard should therefore be measured recovery exercises, failed-change and rollback logs, false-positive
              rates, time-to-clean-restore distributions, and reference calls from complex multi-forest customers rather
              than product descriptions alone.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
