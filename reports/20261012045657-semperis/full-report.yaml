              - CR006
              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: Regulatory, legal, and assurance gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports customer compliance use cases, not a conclusion that Semperis itself has cleared
              every relevant authorization or legal risk. Company material explains that stale users and loose
              administrative controls can place customers at risk of non-compliance, and an independent profile reports
              public-sector availability through Carahsoft contract listings. The assigned pool does not establish
              current FedRAMP status, certification scope, privacy assessments, litigation, enforcement,
              intellectual-property disputes, or a complete incident record. Absence from this bounded source set is not
              evidence of absence. Before investment, counsel should review regulatory correspondence, material claims
              and disputes, security attestations, privacy impact assessments, incident notifications, and the precise
              representations and liability caps used in regulated-customer contracts.
            claimRefs:
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
