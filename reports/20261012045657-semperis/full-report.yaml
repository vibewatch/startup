              - CU008
              - CU009
      - number: '6.4'
        title: Durability, Land-and-Expand Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention durability is structurally supported by the architectural lock-in of Active Directory
              backup architectures and the specialized expertise required to safely restore compromised directory
              forests without reinfecting clean domain controllers. Third-party review aggregators record high customer
              sentiment, evidenced by a 4.8 out of 5.0 score across more than 1,200 reference evaluations on
              FeaturedCustomers. Platform expansion follows an identifiable land-and-expand trajectory, where initial
              forest recovery contracts expand into continuous threat monitoring, automated migration management, and
              multi-cloud identity defense across Okta and Ping Identity. However, Semperis maintains private disclosure
              regarding net revenue retention (NRR), gross churn cohorts, and top-customer ARR concentration.
              Furthermore, aggressive competition from comprehensive platform providers like CrowdStrike and Microsoft
              poses ongoing renewal friction, making explicit visibility into customer retention cohorts a mandatory
              diligence requirement for prospective investors.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dominant Footprint in Critical Infrastructure and Tier-1 Enterprises
            body: >-
              Semperis has secured mission-critical deployments across Fortune 100 corporations, global hospital
              networks, international transport carriers, and municipal governments. By positioning Active Directory
              forest recovery as an existential business continuity requirement rather than an incremental IT tool, the
              company achieves deep enterprise lock-in with low displacement risk.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Absence of Disclosed Net Retention Metrics and ARR Concentration
            body: >-
              While Semperis reports surpassing $100M ARR and scaling to 1,200+ enterprise accounts, the company
              maintains private disclosure regarding net revenue retention (NRR), gross churn, and top-customer ARR
              concentration. Investors must rigorously evaluate whether growth is predominantly driven by new enterprise
              logo acquisition or sustainable multi-product expansion across installed accounts.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk prioritization and residual exposure
        blocks:
          - type: paragraph
            body: >-
              The most investable risk is strategic concentration, not a demonstrated product failure. An independent
              review characterizes Semperis as strongest where Active Directory is the critical identity tier, but says
              the value proposition weakens when Active Directory or Entra ID is not central and that broad
              multi-identity-provider detection requires another tool. Semperis counters that boundary with coverage of
              Active Directory, Entra ID, Okta, and Ping Identity, yet that statement is company-issued and does not
              establish equivalent depth across platforms. The residual exposure is therefore a narrowing standalone
              role if customers favor broader suites. A thesis break would be repeated losses in directory-led recovery
              deals, declining attachment outside Microsoft estates, or evidence that native platform recovery meets the
              same operational need at materially lower total cost.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
