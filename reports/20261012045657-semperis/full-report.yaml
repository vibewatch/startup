  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Platform and Core Delivery Architecture
        blocks:
          - type: paragraph
            body: >-
              Semperis delivers a specialized hybrid identity resilience platform focused on securing, defending, and
              recovering Microsoft Active Directory and Microsoft Entra ID environments alongside Okta. Because Active
              Directory was originally architected for centralized enterprise administration rather than continuous
              nation-state cyberattacks, modern ransomware operators routinely compromise domain controllers to
              establish persistence, move laterally, and seize administrative control across enterprise systems.
              Semperis provides a comprehensive defense-in-depth platform that spans the entire attack lifecycle,
              dividing capabilities into pre-attack posture assessment, real-time threat detection and auto-remediation,
              post-breach forest recovery, and crisis coordination. By decoupling directory backup metadata from
              vulnerable operating system states and maintaining immutable storage options, the platform addresses
              systemic directory vulnerabilities that legacy backup tools cannot resolve.
            claimRefs:
              - CE001
              - CE002
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE013
      - number: '5.2'
        title: Modular Capabilities and Enterprise Migration Tooling
        blocks:
          - type: paragraph
            body: >-
              The commercial product suite is anchored by Directory Services Protector (DSP) for continuous threat
              detection and Active Directory Forest Recovery (ADFR) for automated disaster reconstitution. In September
              2026, Semperis expanded its modular footprint with Migrator for Active Directory 2.0, a ground-up
              architectural rebuild designed to treat cross-forest migrations as high-risk security boundaries rather
              than routine data copy tasks. Built natively on Kubernetes, Migrator 2.0 introduces wave-based Directory
              Synchronization Sets, comprehensive change-staging reports, and in-place endpoint cutover agents that
              eliminate costly device reimaging during corporate consolidations and M&A integrations. Furthermore,
              Semperis supports practitioner adoption through community tools like Purple Knight and Forest Druid,
              enabling security teams to audit directory exposure across hundreds of vulnerability indicators before
              deploying commercial runtime defense.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
