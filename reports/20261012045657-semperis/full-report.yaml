      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buying path crosses security, identity administration, infrastructure, and continuity functions.
              TechCrunch reports that CISOs are shifting attention toward identity resilience, while Semperis describes
              IT and security administrators as the operational users of Entra object and policy recovery. This implies
              a security-led purchase that must be validated by directory operators and justified through recovery
              readiness, outage exposure, or a failed control assessment. Semperis also describes an entirely
              channel-focused sales approach, making partners an important route into enterprise budgets and
              implementation workflows. Large hybrid estates and cloud-only Entra environments share the recovery
              problem, but procurement ownership, average contract value, renewal economics, and the split between
              security and disaster-recovery budgets remain undisclosed.
