              - CR016
      - number: '7.4'
        title: Partner, financing, and monitoring implications
        blocks:
          - type: paragraph
            body: >-
              Delivery and capital structure add execution risks that public disclosures do not quantify. Semperis
              describes Migrator for Active Directory as partner-first, with enablement and certification for delivery
              partners that retain the customer relationship, and says availability depends on regional ordering,
              support, and deployment requirements. That model expands reach but places implementation quality,
              capacity, and escalation discipline partly outside Semperis. Separately, TechCrunch reported that the June
              2024 financing mixed equity and debt at a valuation above $1 billion, while two publications identified
              J.P. Morgan and Hercules Capital as financing providers. Funding raised is not cash available: covenants,
              amortization, burn, gross margin, retention, and current liquidity remain gaps. Monthly monitoring should
              cover partner-led deployment slippage, recovery-test outcomes, platform mix, renewals, cash consumption,
              covenant headroom, and material security events.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence quality limits severity calibration
            body: >-
              Most operating mitigations in the assigned pool are company-issued or syndicated company releases. Treat
              feature descriptions as evidence of intended controls, not proof of recovery speed, control effectiveness,
              partner quality, or incident-free operation.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR015
          - type: callout
            title: Kill criteria
            body: >-
              Pause an investment process if customer recovery tests materially miss contracted objectives,
              directory-led win rates deteriorate, partner-caused deployments repeatedly slip, a material undisclosed
              incident or legal matter emerges, or financing diligence shows inadequate covenant headroom under a
              downside case.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR011
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The central investment thesis for Semperis centers on the critical vulnerability of enterprise directory
              infrastructure. Because Microsoft Active Directory remains the core authentication backbone for
              approximately 90% of enterprise environments, it represents an inescapable single point of failure during
              modern ransomware campaigns. Semperis provides specialized cyber resilience and rapid forest recovery
              technology that minimizes catastrophic enterprise downtime. With more than 1,000 enterprise organizations
              relying on its platform, including over 25% of the 100 largest United States corporations, Semperis has
              established significant operational validation. Furthermore, its February 2026 acquisition of MightyID
              expands this defensive perimeter into multi-cloud Okta and Ping architectures. Conversely, the anti-thesis
              highlights long-term platform consolidation risk. Dominant cybersecurity platforms including Palo Alto
              Networks and CrowdStrike are aggressively building out identity protection capabilities, while Microsoft
              continues enhancing native Entra ID recovery tooling. If enterprise chief information security officers
              choose to consolidate point solutions into broader enterprise license agreements, Semperis could
              experience elongated sales cycles and pricing compression.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: Valuation and Capital Structure Context
        blocks:
          - type: paragraph
            body: >-
              Semperis has raised a cumulative total of $373 million in capital through June 2024, reflecting steady
              investor support across its development lifecycle. After closing a $40 million Series B funding round in
              2020 that brought total funding to $54 million, the company secured a $200 million Series C financing led
              by KKR in 2022, which initially pushed its valuation past the $1 billion milestone. In June 2024, Semperis
              secured an additional $125 million in growth financing from J.P. Morgan and Hercules Capital. Critically,
              this latest round was structured as a combination of equity and growth debt rather than a pure equity
              round. Taking structured debt financing allowed leadership to fund accelerated research, development, and
              international channel expansion while minimizing equity dilution and avoiding an aggressive equity
              valuation repricing in a selective private software market. Commercial tracking data indicates a workforce
              of approximately 690 employees in 2026, indicating disciplined headcount scaling relative to its capital
              base.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
      - number: '8.3'
        title: Scenario Modeling and Valuation Multiples
        blocks:
          - type: paragraph
            body: >-
              Evaluating Semperis across probabilistic operational scenarios provides a grounded framework for entry
              discipline and return expectations. In the base case scenario, Semperis compounds annual recurring revenue
              at a steady 18% to 22% rate while maintaining high renewal rates among its Global 2000 customer base.
              Assuming a public enterprise multiple between 8.0x and 10.0x annual recurring revenue, the company
              supports a justified enterprise valuation between $1.2 billion and $1.5 billion. The bull case scenario
              envisions accelerated international expansion, successful cross-selling of MightyID cloud resilience
              across its channel partner network, and market share gains from legacy backup tools, achieving ARR growth
              above 30% and supporting an exit valuation between $1.8 billion and $2.2 billion at 12.0x to 14.0x ARR.
              Conversely, the bear case scenario accounts for aggressive bundling by Microsoft and endpoint security
              platforms, which could slow annual growth below 10% and compress terminal valuation multiples to 4.5x to
              6.0x ARR, yielding an enterprise valuation between $600 million and $850 million.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              We conclude with an explicit investment recommendation of research-more with medium confidence and a
              medium risk rating. While Semperis possesses high technical defensibility and proven enterprise traction,
              the prevailing valuation exceeding $1 billion leaves little margin of safety given that critical financial
              indicators remain undisclosed. The company does not publicly disclose GAAP gross margins, cash burn
              velocity, or net revenue retention cohorts. However, governance actions signal active preparation for a
              future liquidity event. In conjunction with its growth financing, Semperis appointed seasoned C-suite
              executives including Chief Financial Officer Jeff Bray, Chief Revenue Officer Mike DeGaetano, and Chief
              Legal Officer Annabel Lewis, each possessing direct cybersecurity public company and initial public
              offering execution experience. Prior to committing growth capital or acquiring secondary shares,
              prospective investors must complete targeted diligence verifying unit economics, contract renewal
              waterfalls, and customer displacement rates against native cloud directory alternatives.
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More'
            body: >-
              While Semperis exhibits robust category leadership in hybrid Active Directory cyber resilience with over
              1,000 enterprise customers, the private valuation of over $1 billion represents an elevated entry multiple
              that requires verifiable confirmation of gross margins and net retention before committing growth capital.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV011
          - type: callout
            title: Platform Vendor Consolidation Risk
            body: >-
              The primary threat to long-term valuation realization is aggressive bundling by Microsoft and endpoint
              security platforms such as CrowdStrike and Palo Alto Networks, which could squeeze standalone identity
              resilience pricing and lengthen enterprise sales cycles.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV013
