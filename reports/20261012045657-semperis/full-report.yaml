  - id: TV002
    title: Investment thesis and anti-thesis matrix
    columns:
      - Strategic Pillar
      - Core Investment Thesis
      - Anti-Thesis Counterpoint
      - Thesis Break Trigger
    rows:
      - - Identity Core Moat
        - Active Directory remains the operational backbone for 90% of enterprises with severe ransomware vulnerability
        - Enterprises may accelerate cloud-native migration away from legacy Active Directory infrastructure
        - Rapid decline in hybrid AD enterprise deployments in favor of pure cloud identity
      - - Enterprise Adoption
        - Over 1,000 enterprise customers including 25% of top 100 U.S. companies trust Semperis for recovery
        - Specialized point solutions face budget consolidation pressure from corporate IT procurement teams
        - Deceleration in annual logo acquisition or rising customer churn to platform suites
      - - Multi-Cloud Expansion
        - Acquisition of MightyID extends cyber resilience across Okta and Ping cloud identity architectures
        - Integrating heterogeneous identity providers increases product complexity and professional service overhead
        - Integration friction resulting in customer retention decline or margin degradation
      - - Exit & Capital Path
        - Executive additions with cybersecurity IPO backgrounds establish viable public listing governance
        - Debt financing alongside equity highlights sensitivity to private equity dilution and valuation caps
        - Inability to achieve public market liquidity resulting in down-round recapitalization
    notes: Strategic evaluation of primary value drivers against commercial and platform risks.
