  - id: FE001
    title: 产品架构图
    type: stack
    summary: Semperis 平台从暴露发现到危机协调的六层功能架构。
    data:
      layers:
        - label: 第 1 层：身份攻击面暴露与社区评估
          detail: 免费社区态势评估工具，包括 Purple Knight 和 Forest Druid，用于评估 218+ 项安全指标。
        - label: 第 2 层：持续身份威胁检测与态势加固
          detail: Directory Services Protector（DSP）和 Lightning Intelligence 用于实时变更跟踪和攻击路径缩减。
        - label: 第 3 层：实时威胁拦截与自动修复
          detail: 基于内存的目录变更拦截引擎，可立即回滚恶意权限提升。
        - label: 第 4 层：自动化网络安全优先灾难恢复
          detail: Active Directory Forest Recovery（ADFR）在数小时内将目录状态重建到干净、隔离的硬件环境。
        - label: 第 5 层：跨环境迁移与整合
          detail: Migrator for Active Directory 2.0 使用 Kubernetes 运行时、Directory Synchronization Sets 和原位端点代理。
        - label: 第 6 层：企业危机编排与带外协调
          detail: Ready1 关键事件平台，用于核心企业基础设施受损时的安全带外协调。
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业从初次社区漏洞评估，到完整混合身份韧性平台部署的采用路径。
    approximationNotes: 旅程阶段、触点和扩张机制综合自已发布的客户案例、伙伴文档和商业披露。
    data:
      nodes:
        - label: 初始评估与漏洞审计
          touchpoints:
            - Purple Knight free vulnerability assessment
            - Forest Druid Tier-0 attack path analysis
            - Discovery of legacy Active Directory misconfigurations
          description: 企业识别本地 Active Directory 中未修补的攻击路径和身份漂移。
        - label: 采购与安全要求
          touchpoints:
            - CISO board-level risk briefing
            - Cyber insurance policy resilience prerequisites
            - DORA and NIST framework compliance requirements
          description: 勒索软件威胁认知和监管要求推动企业为身份防御划拨专门预算。
        - label: 林恢复部署
          touchpoints:
            - Automated forest backup implementation
            - Isolated clean-OS recovery simulation testing
            - 90% downtime reduction operational validation
          description: 组织部署 Semperis ADFR，以确保遭遇勒索软件锁定时能够快速、无破坏地恢复。
        - label: 持续威胁检测与响应
          touchpoints:
            - Directory Services Protector (DSP) agent rollout
            - Real-time Entra ID and Active Directory change auditing
            - Enterprise SIEM and SOAR workflow integration
          description: 客户将合同从事后事件恢复扩展到主动威胁检测和实时回滚。
        - label: 身份迁移与基础设施现代化
          touchpoints:
            - Migrator for AD 2.0 wave-based project deployment
            - M&A directory consolidation without provisioning disruption
            - Mitigation of deprecated Kerberos RC4 encryption dependencies
          description: 企业借助 Semperis 整合收购而来的目录，并使传统身份基础设施现代化。
        - label: 多云治理与平台韧性
          touchpoints:
            - Okta and Ping Identity federation defense
            - Automated bot-versus-bot defense against agentic AI attacks
            - Out-of-band crisis coordination during critical outages
          description: 客户获得完整的平台韧性，保护混合目录和新兴的自主软件代理。
    claimRefs:
      - CU001
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 对六项投资关键风险的影响、可能性和缓解成熟度进行定性展示；未知项保持明确。
    data:
      columns:
        - label: 可能性
          detail: 基于指定证据的定性评估
        - label: 影响
          detail: 对客户结果或投资价值的潜在影响
        - label: 缓解成熟度
          detail: 有公共文档支持的证据，未经独立核实的表现
      rows:
        - label: Microsoft 目录集中度
          note: 独立相关性取决于 AD 和 Entra 是否继续居于核心。
          values:
            - label: 中
            - label: 高
            - label: 已记录的战略；残余范围风险
        - label: 多 IdP 覆盖缺口
          note: 独立评估称，广泛检测可能需要另一套工具。
          values:
            - label: 中
            - label: 高
            - label: 厂商所称扩张；平价尚未核实
        - label: 迁移切换失败
          note: RC4 和未记录的服务账户被列为失败模式。
          values:
            - label: 中
            - label: 高
            - label: 已记录分阶段部署和验证
        - label: 服务账户被入侵
          note: 清点和监控不能证明轮换或生命周期控制。
          values:
            - label: 高
            - label: 高
            - label: 已记录检测；治理不完整
        - label: 伙伴交付差异
          note: 伙伴优先的执行方式将部分实施控制转移到外部。
          values:
            - label: 中
            - label: 高
            - label: 已记录赋能；缺少表现数据
        - label: 债务与流动性约束
          note: 融资组合已有报道，但义务和现金消耗未披露。
          values:
            - label: Unknown
            - label: 高
            - label: 没有公开契约或现金跑道证据
    approximationNotes: 仅为分析师的定性分类；可能性不是概率，公共证据不足时保留未知值。
    claimRefs:
      - CR015
      - CR016
  - id: FV001
    title: 建议决策逻辑流程
    type: flow
    summary: 将市场规模、运营证明、资本结构和风险因素连接至最终“继续研究”立场的决策架构。
    data:
      nodes:
        - id: n1
          label: 企业市场需求
          detail: 90% 的企业依赖 Active Directory 基础设施
        - id: n2
          label: 已证明的客户规模
          detail: 1,000+ 个组织，包括美国前 100 大企业
        - id: n3
          label: 多云扩张
          detail: 收购 MightyID，增加 Okta 和 Ping 覆盖
        - id: n4
          label: 融资与估值
          detail: $1B+ 估值，含债务在内的增长融资为 $125M
        - id: n5
          label: 平台风险与尽调缺口
          detail: 厂商捆绑威胁，以及未披露的毛利率 / NRR
        - id: n6
          label: 最终立场：继续研究
          detail: 有吸引力的技术护城河，但需要经审计的财务证明
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 代表投资评估关卡的顺序框架，而非定量概率。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV010
      - CV011
      - CV013
