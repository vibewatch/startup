      - number: '5.4'
        title: 技术差异化、安全控制与架构风险
        blocks:
          - type: paragraph
            body: >-
              Semperis 的核心技术防御力来自其对 Active Directory
              内部机制的专有理解，以及能够恢复目录状态、但不恢复可能藏有持久化恶意软件的底层操作系统二进制文件的专利恢复引擎。然而，这种专业架构也带来固有平台风险。Semperis 与 Microsoft
              的目录协议、Kerberos 实现选择和 Entra ID Graph API 紧密耦合。随着 Microsoft 执行安全弃用政策，例如分阶段淘汰传统 RC4 Kerberos
              加密，企业会面临复杂的迁移障碍和共存失败，需要主动配置。此外，在任务关键型域控制器上运行深度特权监控 agent
              可能扩大爆炸半径，因此必须严格治理变更并进行可靠的第三方验证，确保自动修复流程不会意外中断合法管理访问。
            claimRefs:
              - CE009
              - CE010
              - CE011
