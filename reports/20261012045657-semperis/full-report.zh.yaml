        title: 展示项
        blocks:
          - type: callout
            title: 混合 Active Directory 韧性领域的领先地位
            body: Semperis 已成为专注于 Active Directory 和 Entra ID 的网络韧性平台，并以经过验证的 90% 停机时间下降，保护超过 1 亿个企业身份。
            calloutType: strength
            claimRefs:
              - CO001
              - CO010
          - type: callout
            title: 传统基础设施中的架构爆炸半径与集中度
            body: Active Directory 韧性至关重要，但独立安全评估强调，将权威信任过度集中在传统目录底层，会让企业在目录恢复路径遭到入侵时暴露于系统性故障。
            calloutType: risk
            claimRefs:
              - CO009
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 狭窄的身份韧性边界
        blocks:
          - type: paragraph
            body: >-
              可投资的市场边界比完整的身份与访问管理市场更窄。Semperis 围绕 Active Directory、Entra ID、Okta 和 Ping
              的攻击防御、检测、响应与恢复来定位平台；独立报道则称，Active Directory 是超过 90% 的 Fortune 1000
              公司的目录骨干。因此，可计入的支出包括目录威胁检测、网络安全优先的森林恢复、云身份对象和策略恢复以及危机响应。通用单点登录、日常身份配置、端点检测、SIEM
              和普通基础设施备份属于相邻领域或替代方案，不应纳入可支撑的核心市场估算。这个边界很重要，因为宽泛的 IAM 总额会严重高估 Semperis 可触达的支出。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM016
