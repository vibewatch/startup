  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 身份安全与网络韧性竞争格局
        blocks:
          - type: paragraph
            body: >-
              身份韧性市场涵盖多个供应商类别，它们以不同技术架构解决企业目录安全问题。由于企业目录基础设施仍是超过 90% 的 Global Fortune 1000
              组织的主要攻击面，安全负责人需要在四类主要替代方案之间选择：Microsoft 的原生目录供应商工具，Quest Software 等厂商的传统目录备份工具，Rubrik、Veeam 和 Cohesity
              等企业数据保护设备，以及 CrowdStrike、Tenable 和 Silverfort 等专门的身份威胁检测与响应（ITDR）厂商。Tracxn 的行业跟踪显示，广义数据保护和网络安全领域有超过 1,000
              家活跃竞争者，但真正能自动执行 Active Directory 森林恢复的直接同业极少。Microsoft Defender for Identity 和 Entra ID
              是企业环境中最普遍的基线方案，但其架构重心是运行时遥测和身份验证监控，而非自动裸机或全森林灾难重建。因此，Semperis
              与其说是目录服务的直接替代，不如说是企业安全架构师为防范域控制器灾难性损坏而购买的不可或缺的网络韧性层。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 核心架构能力与威胁检测差异化
        blocks:
          - type: paragraph
            body: >-
              身份安全领域的技术差异化，核心在于运营备份、运行时检测与攻击后状态恢复之间的架构分离。Veeam、Rubrik 和 Commvault 等传统企业备份方案会捕获完整操作系统磁盘镜像或虚拟机快照；但恢复受污染的
              OS 镜像，往往会重新引入攻击者在持续入侵 Active Directory 期间植入的休眠 rootkit 和恶意载荷。相比之下，Semperis 首创自动化 Active Directory Forest
              Recovery（ADFR）机制，隔离纯目录状态数据，并将森林拓扑重建到干净、与硬件无关的目标实例上，使平均灾难恢复停机时间最多下降 90%。在威胁检测环节，Semperis Directory Services
              Protector（DSP）直接监控 Active Directory 复制流，绕过 Windows Event Log 审计；复杂攻击者经常在这里隐藏持久化机制。CrowdStrike Falcon
              Identity Protection 等端点检测平台擅长凭证窃取遥测和实时条件访问执行，但不会尝试森林灾难恢复。同样，Semperis 开发的免费社区工具 Purple Knight 和 Forest
              Druid 也是强大的漏斗顶部获客机制，能发现商业套件经常漏掉的隐藏目录攻击路径和凭证委派风险。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
              - CP013
      - number: '3.3'
        title: 商业模式、定价结构与渠道分销动态
        blocks:
          - type: paragraph
            body: >-
              Semperis 采用 100% 渠道驱动的市场进入模式，与增值经销商、系统集成商和包括 Carahsoft 在内的主要公共部门聚合商密切合作。商业定价按用户、按年订阅，覆盖 Directory Services
              Protector（DSP）和 Active Directory Forest Recovery（ADFR）模块，通常随目录对象复杂度及混合环境中受保护身份总数扩大。政府合同层面，Semperis 将
              Identity Resilience Platform 加入 Carahsoft 的 SEWP V 和 ITES-SW2 采购车辆，扩大了在国防和民用机构中的覆盖。这个渠道布局与 Microsoft
              形成直接对比：Microsoft 靠广泛的 Microsoft 365 E5 企业许可捆绑变现身份能力。对企业 CISO 而言，捆绑的 Microsoft Defender 功能看似没有增量成本，给
              Semperis 的独立检测能力带来强烈的降价压力。为了守住定价权和毛利率，Semperis 将原生平台许可不覆盖的灾难恢复和事件响应保障打包进产品，把平台定位为运营韧性保险，而不是日常安全监控。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 切换成本、平台捆绑与替代风险
        blocks:
          - type: paragraph
            body: >-
              Semperis 竞争壁垒的持久性，很大程度上依靠较高的企业切换成本，以及与灾难恢复预案的深度集成。企业一旦采用 Semperis 执行 Active Directory
              森林恢复，迁移到替代厂商就需要重新设计隔离气隙备份存储、验证新的恢复自动化脚本，并依据 NIST SP 800-207 和网络保险承保标准重新取得合规认证。此外，与 Cohesity
              等厂商的战略存储合作能建立不可变、隔离气隙的身份保险库，防止勒索软件攻击期间发生恶意加密。尽管存在这些技术壁垒，替代风险仍沿两个方向存在：供应商整合和云迁移。在 CFO
              要求精简工具的经济环境下，安全高管会受到组织激励，转而接受 CrowdStrike 或 Palo Alto Networks 等现有端点平台的“够用”安全，而不是继续维护专用点方案。与此同时，随着企业逐步将传统
              Active Directory 工作负载迁移到云原生 Entra ID，Microsoft 持续增强原生租户韧性功能，可能在多年时间跨度内压缩 Semperis 的本地恢复优势和可触达空间。
            claimRefs:
