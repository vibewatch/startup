        - 股权融资之外叠加债务融资，凸显对私募股权稀释和估值上限的敏感性
        - 无法实现公开市场流动性，导致下轮融资式资本重组
    notes: 针对商业和平台风险，对主要价值驱动因素进行战略评估。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: 估值情景分析与回报画像
    columns:
      - 情景案例
      - 关键运营假设
      - 隐含 ARR 倍数
      - 隐含估值区间
      - 概率权重
    rows:
      - - 乐观情景
        - ARR 年增长超过 30%；MightyID 交叉销售成功；IPO 成功上市
        - 12.0x - 14.0x ARR 倍数
        - $1.8B - $2.2B
        - 25%
      - - 基准情景
        - ARR 年增长维持在 18-22%；企业稳步扩张；市场倍数趋稳
        - 8.0x - 10.0x ARR 倍数
        - $1.2B - $1.5B
        - 50%
      - - 悲观情景
        - 增长降至 10% 以下；平台捆绑压力；企业预算审查趋严
        - 4.5x - 6.0x ARR 倍数
        - $600M - $850M
        - 20%
      - - 严重下行情景
        - 重大产品中断或核心 IP 泄露；厂商激进替代；下轮融资事件
        - < 3.5x ARR
        - < $500M
        - 5%
    notes: 基于企业网络安全软件同业标准倍数的情景估值建模。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Semperis 从 2013 年成立到 2026 年的公司、融资、产品和联邦韧性里程碑。
    data:
      items:
        - date: '2013'
          label: 公司成立
          detail: Semperis 由 Mickey Bresman、Guy Teverovsky 和 Matan Liberman 于新泽西州霍博肯创立。
          tone: neutral
        - date: '2015'
          label: 商业服务上线
          detail: Semperis 开始提供面向企业的目录安全和灾难恢复服务。
          tone: opportunity
        - date: '2021'
          label: Purple Knight 工具发布
          detail: 免费的社区 Active Directory 安全评估工具上线，并获得业界广泛采用。
          tone: opportunity
        - date: 2022-05
          label: C 轮融资（$200M）
          detail: 完成由 KKR 领投的 $200M C 轮融资，用于加速企业身份保护。
          tone: opportunity
        - date: 2024-06
          label: 增长融资（$125M）与独角兽地位
          detail: 从 J.P. Morgan 和 Hercules Capital 筹得 $125M 增长轮融资；估值确认超过 $1B。
          tone: opportunity
        - date: 2024-06
          label: 为 IPO 做准备的高管扩充
          detail: 任命上市公司老将 Jeff Bray（CFO）、Mike DeGaetano（CRO）和 Annabel Lewis（CLO）。
          tone: neutral
        - date: 2026-05
          label: 联邦采购合同扩张
          detail: 解决方案加入 Carahsoft SEWP V 和 ITES-SW2 合同，以简化公共部门采购渠道。
          tone: opportunity
        - date: 2026-06
          label: 联邦身份风险建议
          detail: 独立评估强调传统 Active Directory 的系统性脆弱性和治理缺口。
          tone: adverse
    approximationNotes: 里程碑日期和融资详情依据公开披露的新闻稿及新闻报道；早期运营日期依据创始人访谈。
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO008
      - CO009
      - CO014
  - id: FM001
    title: 市场需求与部署的证据阶梯
    type: pyramid
    summary: 六项已披露的代理指标显示，目录基础根基深厚、公司部署规模可观，并出现 AI 相关需求信号；不据此声称美元口径的 TAM。
    data:
      items:
        - label: 《财富》1000 强企业的 Active Directory 普及率
          value: 90
          unit: '%+'
          note: TechCrunch 报道的存量基础代理指标；不是支出估计。
        - label: 2024 年报道中的受保护身份数量
          value: 100
          unit: M+ identities
          note: TechCrunch 和 SiliconANGLE 报道的公司覆盖规模代理指标。
        - label: 2026 年 5 月依赖 Semperis 的组织
          value: 1200
          unit: + organizations
          note: 公司发布的下限数据，覆盖超过 40 个国家。
        - label: 预计 AI 会增加身份攻击的组织
          value: 74
          unit: '%'
          note: Semperis 报道的调查，覆盖八个国家的 1,100 个组织。
        - label: 已使用或计划为敏感任务使用 AI 代理的组织
          value: 93
          unit: '%'
          note: 同一项 Semperis 报道调查的样本。
        - label: 非常确信自己能够重新夺回控制权的组织
          value: 32
          unit: '%'
          note: 同一项调查；较低的信心意味着恢复准备存在缺口。
    approximationNotes: 各项使用不同单位和分母，彼此不可相加、不可嵌套，也不代表比例关系。该金字塔是证据阶梯，不是 TAM/SAM/SOM 计算。
