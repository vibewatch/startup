            body: >-
              商业产品套件以负责持续威胁检测的 Directory Services Protector（DSP）和负责自动灾难重建的 Active Directory Forest
              Recovery（ADFR）为核心。2026 年 9 月，Semperis 通过 Migrator for Active Directory 2.0
              扩大模块覆盖；该产品从底层重建架构，将跨森林迁移视为高风险安全边界，而不是普通数据复制任务。Migrator 2.0 原生构建于 Kubernetes，引入基于波次的 Directory
              Synchronization Sets、完整的变更分阶段报告，以及就地端点切换 agent，从而在企业整合和并购集成期间省去昂贵的设备重镜像。此外，Semperis 还通过 Purple Knight 和
              Forest Druid 等社区工具推动从业者采用，使安全团队能在部署商业运行时防御前，依据数百项漏洞指标审计目录暴露情况。
