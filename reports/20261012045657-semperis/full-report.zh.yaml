            body: >-
              Semperis 提供专门的混合身份韧性平台，重点保护、捍卫和恢复 Microsoft Active Directory、Microsoft Entra ID 以及 Okta 环境。Active
              Directory 最初按集中式企业管理而非持续应对民族国家级网络攻击设计，现代勒索软件运营者因此经常入侵域控制器，建立持久化、横向移动并夺取企业系统的管理控制权。Semperis
              提供覆盖完整攻击生命周期的纵深防御平台，将能力拆分为攻击前态势评估、实时威胁检测与自动修复、入侵后森林恢复及危机协调。平台将目录备份元数据与易受攻击的操作系统状态解耦，并提供不可变存储选项，从而解决传统备份工具无法处理的系统性目录漏洞。
            claimRefs:
              - CE001
