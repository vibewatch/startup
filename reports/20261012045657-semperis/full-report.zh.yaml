              Active Directory 和 Entra ID 环境自动裸机灾难恢复的 Active Directory Forest
              Recovery（ADFR）构成。这些软件许可按启用用户数收取年度经常性订阅费，分级价格随企业身份数量扩大。客户部署覆盖超过 1,000 家企业组织，全球保护超过 1
              亿个用户身份。官方价格严格以价目表为基础，企业合同价格则通过批量折扣、多年承诺和企业许可协议（ELA）实现。除核心 Active Directory 保护外，Semperis 还将变现范围扩展到 Entra
              ID、Okta 和 Ping Identity 的相邻 SaaS 租户恢复业务，在分散订阅收入来源的同时保持较高的经常性收入质量。
