      - number: '5.3'
        title: 运营流程、Zero Trust 与部署动态
        blocks:
          - type: paragraph
            body: >-
              按照传统运营模式，企业在全域勒索软件事件后的恢复需要手动重装服务器、重建森林架构并重新建立信任，平均耗时 21 天，并带来巨大的业务中断成本。Semperis
              用编排式、网络安全优先的森林恢复取代这套手工流程，在数小时内将目录数据库恢复到干净环境，预计可减少九成停机时间。在威胁防御流程中，Directory Services Protector
              检查复制流，拦截可疑属性变更、权限提升和恶意凭证创建，并在不使域控制器下线的情况下执行自动回滚。这些流程与 Zero Trust 要求及 SEC Regulation S-P
              等监管框架高度一致；后者要求组织维持经过严格测试、能够在严苛报告窗口内恢复运营的灾难恢复机制。
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
