      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              AI 采用可能成为需求催化剂，但现有测量来自公司发布的调查结果，而非独立市场预测。在 Semperis 报道的 Censuswide 调查中，来自 8 个国家的 1,100 家组织里，74% 预计 AI
              会增加对身份基础设施的攻击，93% 已在使用或计划使用 AI agent 处理敏感安全任务，只有 32% 对管理员凭证暴露后重新夺回控制权非常有信心，83% 将 AI
              身份治理列为近期优先事项。采用率与恢复信心之间的差距，强化了专用韧性控制的必要性。约束同样明显：买方可能依赖原生恢复假设，TechnologyAdvice
              指出卸载恢复数据的自动化能力有限，专用工具还要与更宽泛的平台预算竞争，而且指定来源没有量化该品类支出或付费意愿。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 指定证据中没有可支撑的美元 TAM
            body: 现有来源支持装机基数、部署和调查需求代理指标，但没有披露品类收入、CAGR、定价、合同价值、市场份额或合格买方数量。套用宽泛的 IAM 市场估算，或用假定合同价值乘以客户数量，都会制造虚假的精确度。
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM012
          - type: callout
            title: 恢复信心落后于 AI agent 采用
            body: >-
              同一份公司发布的调查显示，93% 的组织已使用或计划使用 AI agent 执行敏感任务，但只有 32%
              对管理员凭证暴露后重新夺回控制权非常有信心。这一差距支持身份恢复的紧迫性，但发布方与调查结果的关系限制了它作为独立需求验证的价值。
            calloutType: insight
            claimRefs:
