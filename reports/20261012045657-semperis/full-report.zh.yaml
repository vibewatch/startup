chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Semperis 是一家企业网络安全厂商，专注于混合 Active Directory 和 Entra ID 的身份威胁检测、事件响应与网络韧性灾难恢复。公司成立于 2013 年，总部位于新泽西州
              Hoboken，由 Mickey Bresman、Guy Teverovsky 和 Matan Liberman 创办，旨在防御破坏性网络攻击对关键身份体系的摧毁。Semperis
              处于后期增长阶段，为覆盖医疗、金融、交通和公共部门基础设施的全球企业保护超过 1 亿个用户身份。公司通过专门的 100% 渠道合作伙伴分销模式交付 Directory Services Protection
              Platform，在扩大全球企业采购的同时避免与直销发生冲突。
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO011
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO010
              - CO012
      - number: '1.2'
        title: 创始人、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              公司由联合创始人兼首席执行官 Mickey Bresman 领导；他围绕身份优先的运营韧性搭建了 Semperis 的技术架构。2024 年 6 月，Semperis 任命三位资深 C-suite
              高管，强化管理层，为公司治理和未来首次公开募股做准备。首席财务官 Jeff Bray 曾在 Rapid7、Imprivata 和 Invicti Security 任职，拥有丰富的公私募市场经验，曾管理超过
              $1B 的资本市场交易。首席营收官 Mike DeGaetano 曾在 Broadcom、Forcepoint 和 Zscaler 领导全球销售组织，覆盖其 IPO 前后阶段；首席法务官 Annabel
              Lewis 则在 Trustwave 和 Onapsis 积累了二十年的治理、合规和并购经验。管理层纵深明显增强，但日常战略方向仍高度依赖 Bresman 的创始人与市场匹配度。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: 资本结构、估值与投资者联合体
        blocks:
          - type: paragraph
            body: >-
              Semperis 在机构融资历程中累计募资超过 $325M，背后有领先科技投资方和成长型股权基金支持。2022 年，在全球投资公司 KKR 牵头完成关键的 $200M C 轮融资后，公司于 2024 年 6
              月又获得 $125M 增长融资额度。2024 年交易由 J.P. Morgan 和 Hercules Capital 提供成长股权与风险债务的均衡组合，使 Semperis 的投后估值超过 $1B
              独角兽门槛。这一资本策略在扩大产品开发、全球销售渠道赋能以及北美和以色列战略研发的资产负债表储备时，也减少了创始人和员工的股权稀释。
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO006
              - CO007
      - number: '1.4'
        title: 运营规模、战略里程碑与架构风险
        blocks:
          - type: paragraph
            body: >-
              自 2015 年商业服务上线以来，Semperis 持续扩大运营覆盖，保护任务关键型企业环境，客户包括 Lenovo、Starbucks、United Airlines
              和密歇根州政府。除商业平台部署外，公司还凭借免费的 Purple Knight 目录评估工具赢得广泛社区认可；该工具为全球数千名从业者评估 Active Directory
              的安全态势。然而，独立网络安全分析指出，过度依赖传统 Active Directory
              架构会带来严重的系统性爆炸半径：目录基础设施原本按管理信任而非持续应对民族国家级压力设计，因此核心目录权限一旦遭到入侵，整个企业下游的 Zero Trust 控制都可能失效。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO014
          - type: figure
