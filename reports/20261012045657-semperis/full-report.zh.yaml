      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采购路径横跨安全、身份管理、基础设施和业务连续性职能。TechCrunch 报道，CISO 正将更多注意力转向身份韧性；Semperis 则将 IT 和安全管理员描述为 Entra
              对象与策略恢复的运营用户。因此，采购由安全团队牵头，但必须由目录运营人员验证，并以恢复准备度、停机暴露或控制评估失败为购买理由。Semperis
              还采用完全聚焦渠道的销售方式，使渠道合作伙伴成为进入企业预算和实施流程的重要路径。大型混合环境与纯云 Entra
              环境面临相同的恢复问题，但采购归属、平均合同价值、续约经济性，以及安全预算与灾难恢复预算的分配仍未披露。
            claimRefs:
              - CM011
              - CM013
              - CM014
