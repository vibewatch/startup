callouts:
  - calloutType: "risk"
    title: "Evidence quality limits severity calibration"
    body: "Most operating mitigations in the assigned pool are company-issued or syndicated company releases. Treat feature descriptions as evidence of intended controls, not proof of recovery speed, control effectiveness, partner quality, or incident-free operation."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR015"
  - calloutType: "recommendation"
    title: "Kill criteria"
    body: "Pause an investment process if customer recovery tests materially miss contracted objectives, directory-led win rates deteriorate, partner-caused deployments repeatedly slip, a material undisclosed incident or legal matter emerges, or financing diligence shows inadequate covenant headroom under a downside case."
    claimRefs:
      - "CR001"
      - "CR011"
      - "CR013"
      - "CR016"
