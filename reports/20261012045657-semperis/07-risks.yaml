company:
  name: "Semperis"
chapter:
  number: 7
  title: "Risks"
  summary: "Semperis' specialization in Active Directory and Entra ID creates both differentiation and platform concentration: an independent review says its value drops when those directories are not central and broad multi-IdP detection may require another tool. Public evidence also leaves legal history, financing terms, operating economics, customer concentration, and independently tested recovery outcomes unresolved, so the highest-priority mitigations are customer validation, contract review, and crisis-recovery testing rather than reliance on vendor claims."
sections:
  - id: "risk-prioritization"
    title: "Risk prioritization and residual exposure"
    body: >-
      The most investable risk is strategic concentration, not a demonstrated product failure.
      An independent review characterizes Semperis as strongest where Active Directory is the
      critical identity tier, but says the value proposition weakens when Active Directory or
      Entra ID is not central and that broad multi-identity-provider detection requires another
      tool. Semperis counters that boundary with coverage of Active Directory, Entra ID, Okta,
      and Ping Identity, yet that statement is company-issued and does not establish equivalent
      depth across platforms. The residual exposure is therefore a narrowing standalone role if
      customers favor broader suites. A thesis break would be repeated losses in directory-led
      recovery deals, declining attachment outside Microsoft estates, or evidence that native
      platform recovery meets the same operational need at materially lower total cost.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR015"
    tableRefs:
      - "TR003"
    figureRefs:
      - "FR001"
  - id: "operational-security"
    title: "Operational, quality, and security execution"
    body: >-
      Semperis sells into failure scenarios where weak implementation can itself create material
      disruption. Its migration release identifies RC4-dependent service-account failures,
      cross-forest authentication breakdowns, and coexistence disruption as migration-window
      hazards, while describing staging, change previews, searchable logs, and deployment
      validation as mitigations. A separate company-issued release says legacy service accounts
      can accumulate excessive privileges and static credentials; the product response is
      inventory, monitoring, exposure detection, and automated rollback. Those controls are
      directionally relevant but are not independently benchmarked in the assigned evidence.
      The diligence standard should therefore be measured recovery exercises, failed-change and
      rollback logs, false-positive rates, time-to-clean-restore distributions, and reference
      calls from complex multi-forest customers rather than product descriptions alone.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "regulatory-legal"
    title: "Regulatory, legal, and assurance gaps"
    body: >-
      The evidence supports customer compliance use cases, not a conclusion that Semperis itself
      has cleared every relevant authorization or legal risk. Company material explains that
      stale users and loose administrative controls can place customers at risk of non-compliance,
      and an independent profile reports public-sector availability through Carahsoft contract
      listings. The assigned pool does not establish current FedRAMP status, certification scope,
      privacy assessments, litigation, enforcement, intellectual-property disputes, or a complete
      incident record. Absence from this bounded source set is not evidence of absence. Before
      investment, counsel should review regulatory correspondence, material claims and disputes,
      security attestations, privacy impact assessments, incident notifications, and the precise
      representations and liability caps used in regulated-customer contracts.
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "dependencies-financial-monitoring"
    title: "Partner, financing, and monitoring implications"
    body: >-
      Delivery and capital structure add execution risks that public disclosures do not quantify.
      Semperis describes Migrator for Active Directory as partner-first, with enablement and
      certification for delivery partners that retain the customer relationship, and says
      availability depends on regional ordering, support, and deployment requirements. That
      model expands reach but places implementation quality, capacity, and escalation discipline
      partly outside Semperis. Separately, TechCrunch reported that the June 2024 financing mixed
      equity and debt at a valuation above $1 billion, while two publications identified J.P.
      Morgan and Hercules Capital as financing providers. Funding raised is not cash available:
      covenants, amortization, burn, gross margin, retention, and current liquidity remain gaps.
      Monthly monitoring should cover partner-led deployment slippage, recovery-test outcomes,
      platform mix, renewals, cash consumption, covenant headroom, and material security events.
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
