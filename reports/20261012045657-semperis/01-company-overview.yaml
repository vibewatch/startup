company:
  name: Semperis
chapter:
  number: 1
  title: Company Overview
  summary: Semperis is an enterprise cyber-resilience pioneer protecting hybrid Active Directory and Entra ID environments for over 100 million identities across Fortune 500 enterprises. Founded in 2013 and headquartered in Hoboken, New Jersey, the company attained unicorn status ($1B+ valuation) following a $125 million growth financing in June 2024 from J.P. Morgan and Hercules Capital. With seasoned executive appointments from Rapid7 and Zscaler preparing the business for public markets, Semperis balances strong channel momentum against the systemic blast-radius risks inherent in legacy directory dependencies.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity, Stage, and Operating Model
    body: Semperis is an enterprise cybersecurity vendor specializing in hybrid Active Directory and Entra ID identity threat detection, incident response, and cyber-resilient disaster recovery. Founded in 2013 and headquartered in Hoboken, New Jersey, the company was established by Mickey Bresman, Guy Teverovsky, and Matan Liberman to defend critical identity fabrics from destructive cyberattacks. Operating at a late-stage growth posture, Semperis protects more than 100 million user identities across global enterprises spanning healthcare, finance, transportation, and public sector infrastructure. The company delivers its Directory Services Protection Platform through a dedicated 100% channel partner distribution model, avoiding direct sales conflict while scaling enterprise procurement across global markets.
    claimRefs:
      - CO001
      - CO006
      - CO008
      - CO010
      - CO011
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, Executive Leadership, and Governance Architecture
    body: The company is guided by co-founder and Chief Executive Officer Mickey Bresman, who established Semperis's technical architecture around identity-first operational resilience. In June 2024, Semperis significantly bolstered its executive bench with three senior C-suite appointments designed to establish corporate governance and readiness for an eventual initial public offering. Chief Financial Officer Jeff Bray brings extensive public and private market experience from Rapid7, Imprivata, and Invicti Security, having managed over $1 billion in capital markets transactions. Chief Revenue Officer Mike DeGaetano previously led global sales organizations at Broadcom, Forcepoint, and Zscaler both before and after its IPO, while Chief Legal Officer Annabel Lewis contributes two decades of governance, compliance, and M&A leadership across Trustwave and Onapsis. While executive depth is substantially strengthened, day-to-day strategic direction remains heavily dependent on Bresman's founder-market fit.
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO002
  - id: capitalization-and-investor-syndicate
    title: Capitalization Structure, Valuation, and Investor Syndicate
    body: Semperis has raised over $325 million in total cumulative capital across its institutional financing history, supported by leading technology sponsors and growth equity funds. Following a pivotal $200 million Series C financing in 2022 led by global investment firm KKR, the company secured an additional $125 million growth financing facility in June 2024. Structured as a balanced blend of growth equity and venture debt from J.P. Morgan and Hercules Capital, the 2024 transaction confirmed Semperis's post-money valuation above the $1 billion unicorn benchmark. This capitalization strategy minimized equity dilution for founders and employees while expanding balance-sheet reserves for product development, global sales channel enablement, and strategic research and development across North America and Israel.
    claimRefs:
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO003
  - id: operational-scale-and-resilience-risks
    title: Operational Scale, Strategic Milestones, and Architectural Risks
    body: 'Since its commercial service launch in 2015, Semperis has expanded its operational footprint to safeguard mission-critical enterprise environments, serving landmark customers including Lenovo, Starbucks, United Airlines, and the Michigan state government. Beyond commercial platform deployments, the company earned widespread community goodwill through its free Purple Knight directory assessment tool, which evaluates Active Directory security posture across thousands of global practitioners. However, independent cybersecurity analysis underscores that over-reliance on legacy Active Directory architectures creates an acute systemic blast radius: because directory infrastructure was architected for administrative trust rather than sustained nation-state pressure, any compromise of core directory authorities threatens to invalidate downstream Zero Trust controls across the entire enterprise.'
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO014
    figureRefs:
      - FO001
