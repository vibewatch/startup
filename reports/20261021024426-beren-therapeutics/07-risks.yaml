company:
  name: Beren Therapeutics
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest-evidence risk is regulatory: FDA extended adrabetadex's review to
    November 17, 2026 after classifying Beren's response to an information request
    as a Major Amendment. The investment case also carries material clinical-design,
    safety, commercialization, and single-asset execution exposure, while public
    evidence remains insufficient to resolve manufacturing readiness, launch
    capacity, capital runway, IP, or litigation risk.
sections:
  - id: regulatory-and-evidentiary-risk
    title: Regulatory timing and evidentiary risk
    body: >-
      Regulatory timing is the clearest near-term thesis risk. Beren disclosed that
      FDA moved the PDUFA target from August 17 to November 17, 2026 after treating
      the company's response to an information request as a Major Amendment. The
      extension is not a rejection, but it proves that the review required
      additional time and leaves approval, labeling, and post-marketing obligations
      unresolved. The evidentiary path also deserves a high residual-risk rating:
      Beren's survival analysis compared 72 treated patients with 119 matched
      external controls, and independent reporting notes recent FDA resistance to
      external-control strategies in other programs. Adrabetadex therefore faces
      both binary review risk and a more specific risk that FDA discounts the
      non-randomized survival evidence. The mitigation is active agency engagement,
      but public materials do not show the outstanding review questions or their
      closure.
    claimRefs: [CR001, CR002, CR004, CR005, CR006]
    tableRefs: [TR001]
  - id: clinical-operational-and-quality-risk
    title: Clinical, operational, and quality risk
    body: >-
      The benefit case and the operating burden must be evaluated together. Beren
      reports a 43% reduction in annual neurologic progression over 52 weeks, but
      that result is company-issued and does not eliminate the acknowledged adverse
      events of hearing impairment, post-dose fatigue, and ataxia. Intrathecal
      delivery, a heterogeneous and frequently delayed diagnosis, and the need for
      multidisciplinary care raise site-readiness, patient-identification, and
      persistence risks even if approval is secured. Continued expanded access is
      useful operational experience, yet it is not evidence of scalable commercial
      administration or manufacturing. No retained source discloses commercial
      batch validation, supply redundancy, quality-system inspection status, or
      launch-site capacity. Those items remain diligence gaps rather than negative
      factual findings.
    claimRefs: [CR003, CR009, CR010, CR013, CR016]
    tableRefs: [TR002]
  - id: competition-partners-and-financing
    title: Competition, dependencies, and financing exposure
    body: >-
      Beren is entering an NPC market that already has FDA-approved therapies.
      Miplyffa with miglustat became the first FDA-approved NPC treatment in 2024,
      and NORD also records approval of Aqneursa for neurological symptoms. Those
      products do not establish direct substitutability for infantile-onset
      adrabetadex, but they raise the proof bar for differentiation, reimbursement,
      and treatment sequencing. Execution is also concentrated around a single
      regulator, specialist treatment infrastructure, and one disclosed clinical
      asset. Zevra's observed public-market capitalization of $0.62 billion in
      October 2026 provides context for the sponsor of Miplyffa, not a valuation for
      Beren. It illustrates that competitor capital-market capacity is observable
      while Beren's cash availability, burn, runway, structured obligations, and
      commercial funding needs remain undisclosed in the retained evidence.
    claimRefs: [CR007, CR008, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring indicators and thesis-break triggers
    body: >-
      The first monitoring date is November 17, 2026. A complete response letter,
      another material delay, a materially narrower-than-expected label, or onerous
      confirmatory requirements would weaken the approval thesis. Post-approval,
      the thesis should break if hearing toxicity proves difficult to manage,
      specialist sites cannot deliver repeated intrathecal treatment at practical
      scale, or payer access trails the addressable infantile-onset population.
      Before investment, diligence should obtain FDA correspondence, clinical and
      external-control sensitivity analyses, CMC and inspection readiness, launch
      capacity by site, safety-management protocols, product-liability coverage,
      freedom-to-operate work, litigation schedules, and a fully diluted cash and
      runway bridge. Scientific meetings provide a channel for continued external
      scrutiny of lysosomal-disease data, but conference participation alone does
      not validate Beren's filing or resolve these private-evidence gaps.
    claimRefs: [CR001, CR003, CR005, CR009, CR010, CR011, CR014, CR016]
    figureRefs: [FR001]
