              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.4'
        title: Investment read-through and open diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term evidence is regulatory momentum paired with financing sized for launch
              preparation; the weakest area is transparent company-level economics. The assigned sources do not disclose
              a valuation, revenue or revenue run-rate, customer count, total headcount, burn, or unrestricted runway.
              The $300 million announcement should therefore be read as a capital package, not total raised, enterprise
              value, or cash on hand. Safety also remains consequential: company materials identify hearing impairment
              among adrabetadex's main adverse events, and an independent preclinical study found dose-dependent
              hearing-threshold increases with HPbetaCD in cats. Diligence should prioritize FDA correspondence, the
              equity capitalization table, facility draw conditions, royalty sensitivity, launch-site capacity, a full
              leadership and board roster, and audited liquidity.
