  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue status and quality
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish current product revenue. Beren described adrabetadex as
              unapproved by any health authority in February 2026, while Fierce Biotech later reported that FDA moved
              the decision date to November 17 after classifying the company's response to an information request as a
              major amendment. That sequence makes approval, label breadth, launch timing, and payer access
              prerequisites to any commercial revenue rather than current recurring economics. Beren also says it has
              supported an expanded-access program, but the public record does not disclose whether that program is
              reimbursed, supplied at cost, or free. Accordingly, expanded access is evidence of operating activity, not
              proof of recognized revenue, demand, or margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
