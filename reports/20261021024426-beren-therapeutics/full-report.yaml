              - CI003
              - CI004
      - number: '4.2'
        title: Market and monetization context
        blocks:
          - type: paragraph
            body: >-
              The addressable market is clinically important but narrow and hard to size from incidence alone. NORD
              estimates NPC at one in 100,000 to 120,000 live births and cautions that misdiagnosis and underdiagnosis
              obscure true frequency; this is not a count of diagnosed, label-eligible infantile-onset patients. FDA
              approval of Miplyffa and NORD's record of both Miplyffa and Aqneursa show that Beren would enter an
              already treated market, not a greenfield category. Evaluate's global orphan-drug sales outlook and Zevra's
              public market capitalization provide category and competitor context only. Neither metric is a proxy for
              Beren revenue, enterprise value, price, penetration, or cash generation.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI011
              - CI012
              - CI013
