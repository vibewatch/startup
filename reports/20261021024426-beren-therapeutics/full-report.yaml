  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not the full lysosomal-storage-disease category and cannot be inferred from all
              Niemann-Pick disease care. Beren defines infantile-onset NPC as neurological onset before age six, whereas
              the broader disorder can present from the perinatal period through adulthood. The core commercial boundary
              is therefore a disease-modifying therapy for that infantile subgroup. Adjacent spend includes approved
              neurological-symptom therapy, diagnosis, multidisciplinary care, and family support, but those categories
              are not interchangeable adrabetadex revenue. Miplyffa plus miglustat is already FDA-approved for adults
              and children age two and older, so the status quo includes an approved pharmaceutical option as well as
              supportive care. Clinical research and expanded access show ecosystem activity, not paid commercial
              demand.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM014
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              NORD estimates NPC incidence at one case per 100,000-120,000 live births, but also warns that misdiagnosis
              and underdiagnosis make true frequency difficult to establish. That incidence is an all-NPC starting point
              rather than an I-NPC patient count, treated prevalence, or revenue TAM. The current ClinicalTrials.gov
              search returned 43 studies, including six recruiting and four active-but-not-recruiting records, which
              indicates sustained scientific activity but cannot be converted into unique patients or commercial demand.
              The retained evidence does not disclose diagnosed U.S. I-NPC patients, annual initiations, eligible
              treatment-center capacity, price, gross-to-net deductions, or persistence. A numerical TAM/SAM/SOM would
              therefore add false precision; the defensible sizing stack stops at sourced epidemiology and explicitly
              marks each unresolved narrowing step.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM007
              - CM008
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The patient and family are the beneficiaries, but adoption runs through a multi-party system: diagnosing
              clinicians, neurologists and other specialists, treatment sites, regulators, and third-party payers. NORD
              describes coordinated care across pediatric, neurologic, pulmonary, gastrointestinal, and other
              specialties, underscoring that a prescription alone does not create access. Beren's announced
              commercial-readiness programs target diagnosis, a single family contact, local sites of care, real-world
              evidence, and peer learning. Those priorities are useful evidence of the expected adoption bottlenecks,
              but they are company plans rather than proof that payer coverage, site capacity, referral throughput, or
              family uptake exists. Budget ownership and reimbursement mechanics remain material diligence items.
            claimRefs:
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM012
              - CM014
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are disease severity, underdiagnosis that leaves room for better case
              finding, and a differentiated mechanistic claim in a subgroup with limited options. Near-term realization
              is nevertheless binary and operationally demanding. The FDA moved the PDUFA date to November 17, 2026
              after treating Beren's response to an information request as a major amendment, extending the review by
              three months. Beren raised equity and arranged milestone-dependent debt and approval-contingent royalty
              capital, signaling both launch intent and capital intensity; the full headline financing is not equivalent
              to cash currently available. Hercules' venture-lending positioning shows that specialist capital can
              bridge life-science milestones, but staged funding, royalty leakage, undisclosed pricing, and an
              unquantified eligible population constrain valuation. Approval should not be modeled as immediate
              penetration without evidence on diagnosis, reimbursement, sites, and persistence.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Approval does not equal immediate market capture
            body: >-
              The three-month review extension, unquantified diagnosed I-NPC population, and undisclosed pricing,
              reimbursement, and site capacity make near-term penetration the key market risk.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set now includes two approved drugs
        blocks:
          - type: paragraph
            body: >-
              Beren competes at several layers rather than against one like-for-like molecule. The direct benchmark is
              Zevra's Miplyffa, the first FDA-approved NPC drug, used with miglustat for neurological symptoms in
              patients aged two years and older. NORD also identifies Aqneursa as FDA-approved for neurological symptoms
              in adults and children weighing at least 15 kilograms. Those approvals invalidate older descriptions of
              NPC as having no approved disease-modifying option and shift adrabetadex's pitch toward a narrower
              infantile-onset population and a distinct intrathecal route. Beyond these drugs, miglustat,
              multidisciplinary symptom management, diagnostic programs, and clinical-center care pathways remain
              substitutes or complements. Public evidence does not establish a complete list of sponsors, prices, market
              shares, or current treated-patient counts, so the landscape is directional rather than exhaustive.
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP011
              - CP012
              - CP015
      - number: '3.2'
        title: Route and regulatory maturity define the clearest trade-off
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex is Beren's only disclosed clinical asset and is described as an intrathecal hydroxypropyl
              beta-cyclodextrin for infantile-onset NPC. That route may support a differentiated biological and
              age-segment thesis, but it also creates administration and site-capacity demands that are absent from oral
              Miplyffa, which the FDA says is taken three times daily with miglustat. Aqneursa adds another approved
              neurological option, although the retained public source does not provide a comparable regimen or sponsor
              profile. The resulting position is not simply efficacy versus efficacy: buyers and families must weigh
              regulatory certainty, treatment burden, age eligibility, diagnostic access, and continuity of specialist
              care. The ordinal map therefore scores evidence-backed maturity and treatment directness, not clinical
              superiority or market share.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP011
              - CP012
              - CP016
      - number: '3.3'
        title: Commercial access may matter as much as product differentiation
        blocks:
          - type: paragraph
            body: >-
              The retained sources disclose no comparable list prices, rebates, gross-to-net assumptions, or realized
              treatment costs for these options. That absence is a material diligence gap rather than evidence of price
              parity. Packaging and delivery are nevertheless visibly different: Miplyffa is an oral, weight-adjusted
              regimen combined with miglustat, whereas adrabetadex is intrathecal and still investigational. Beren's
              Test for NPC program could improve diagnosis and patient finding, creating an access advantage before
              launch, but the evidence is a patient-organization page carrying company updates rather than an
              independent measure of enrollment or conversion. Switching costs are likely rooted in specialist
              relationships, administration logistics, and treatment continuity; public comparative persistence, payer
              coverage, and multi-homing data remain unavailable.
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Regulatory execution and incumbent proof constrain moat durability
        blocks:
          - type: paragraph
            body: >-
              Beren's most important displacement risk is execution against already-approved alternatives. The FDA moved
              the adrabetadex decision date to November 17, 2026 after classifying Beren's response to an information
              request as a major amendment. Fierce Biotech also reports that the inherited phase 2/3 program failed in
              2018 and that the current filing relies on an external-control survival comparison. The reported five-year
              survival difference is large, but external controls have drawn FDA objections in other recent programs,
              making approval and labeling breadth less certain than an approved-competitor matrix alone implies.
              Zevra's roughly $620 million October 2026 market capitalization is only a scale proxy, not product revenue
              or competitive share. More broadly, orphan-drug sales remain substantial while sector growth is slowing,
              which supports demand but not durable pricing power for Beren.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: External-control evidence is the decisive competitive risk
            body: >-
              The survival comparison supports adrabetadex's filing, but the absence of a concurrent control and the FDA
              review extension leave uncertainty around approval, label breadth, and how confidently prescribers can
              compare it with approved drugs.
            calloutType: risk
            claimRefs:
              - CP005
              - CP007
              - CP008
          - type: callout
            title: Underwrite access execution, not an empty-market thesis
            body: >-
              Diligence should test administration-site capacity, payer coverage, specialist adoption, and
              patient-finding conversion against oral approved options before assigning value to Beren's route or
              platform differentiation.
            calloutType: recommendation
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP011
