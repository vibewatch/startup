      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public sources are insufficient to underwrite gross margin or sales efficiency. NORD notes that NPC care
              can require coordinated input from pediatric, neurologic, ophthalmic, pulmonary, gastrointestinal, and
              other specialists, indicating a complex treatment environment; however, the assigned evidence does not
              quantify Beren-specific site activation, administration, manufacturing, distribution, patient-support, or
              pharmacovigilance costs. The earlier phase 2/3 failure reported by Fierce Biotech also illustrates the
              long development path behind the current filing, but accounting loss and historic development spending are
              not disclosed here and must not be labeled burn. CAC, payback, gross-to-net, gross margin, working
              capital, and capex therefore remain diligence inputs rather than modeled outputs.
            claimRefs:
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy cannot be inferred from financing headlines. Tracxn's public profile is internally
              inconsistent: one passage reports $135 million raised across two rounds, while another says Beren secured
              $165 million in June 2026. The same page identifies a conventional debt round but masks its amount.
              Funding raised is not cash on hand, and neither figure reveals transaction fees, deployed capital,
              restricted cash, debt service, or future milestones. Fierce Biotech reports that Mandos acquired the asset
              in 2021 through Mallinckrodt's bankruptcy process, but provides no current liquidity data. The financial
              verdict is therefore that revenue quality, margin path, and runway are unscorable from public evidence;
              approval timing and a complete capitalization-and-cash schedule are the immediate underwriting blockers.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not liquidity
            body: >-
              Conflicting third-party funding totals and an undisclosed debt amount cannot establish cash available or
              runway. Obtain bank statements, the fully diluted capitalization table, debt documents, monthly cash burn,
              and the approval-to-launch operating plan before sizing the next financing need.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and patient workflow
        blocks:
          - type: paragraph
            body: >-
              The public product surface is concentrated in adrabetadex, which Beren describes as a proprietary mixture
              of 2-hydroxypropyl-beta-cyclodextrin isomers and IntuitionLabs identifies as the lead program developed
              through subsidiary Mandos. The intended job is disease modification rather than symptom-only management:
              Beren says the candidate is designed to re-establish intracellular cholesterol trafficking, the core
              cellular defect described by NORD and FDA. Public evidence does not establish the commercial
              administration protocol, site requirements, dose schedule, device needs, or support model. That omission
              matters because NPC patients can have severe neurologic and swallowing impairment, so delivery,
              monitoring, caregiver burden, and specialist-site capacity are part of the product rather than peripheral
              launch details.
            claimRefs:
