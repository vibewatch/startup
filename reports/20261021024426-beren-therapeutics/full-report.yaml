      - number: '5.2'
        title: Therapeutic and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a four-part operating model: diagnose a genetically and phenotypically heterogeneous
              lysosomal disorder; deliver a derivatized cyclodextrin composition; measure neurologic progression,
              survival, and treatment-emergent effects; and maintain regulatory, manufacturing, and patent controls.
              Beren's mechanism statement is plausible against the disease biology, but the available pool does not
              contain an independent adrabetadex pharmacology paper, formulation specification, manufacturing validation
              package, or public comparability data. The architecture should therefore be read as an evidence map, not a
              verified process design. The most important technical diligence is the link from composition and exposure
              to clinical effect, including how hearing impairment and post-dose fatigue or ataxia are monitored and
              managed.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE012
