      - number: '5.3'
        title: Maturity, reliability, and regulatory readiness
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex is late-stage but not de-risked. Beren reported that FDA accepted the NDA for Priority Review
              in February 2026 and assigned a November 17, 2026 target date; the same release said the product was not
              approved by any health authority at publication. Fierce Biotech reported that the target moved from August
              after FDA treated Beren's response to a request for updated and clarified documentation as a major
              amendment. The filing's reported survival case compares treated patients with an external control, while
              the underlying Phase 2/3 trial had failed in 2018. Those facts make data provenance, cohort comparability,
              sensitivity analyses, and post-approval evidence generation the principal reliability questions; Priority
              Review is a review status, not evidence of approval or efficacy.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, intellectual property, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Beren's clearest claimed technical moat is formulation and process intellectual property. Its August 2026
              release says eight new U.S. patents increased the domestic portfolio to more than 30, with the global
              estate spanning compositions, formulations, manufacturing processes, biomarkers, and treatment methods and
              claimed protection through 2046 before extensions. This is breadth, not yet freedom-to-operate or
              enforceability proof, because the assigned pool contains no patent claims, prosecution histories, or legal
              opinions. The treatment workflow also competes with approved oral products: FDA describes Miplyffa as an
              oral medicine used with miglustat, while Mayo describes levacetylleucine as a powder for suspension. Beren
              must therefore show that adrabetadex's clinical benefit and manageable safety burden offset any
              administration complexity. No credible public developer or practitioner-community proxy was available in
              the assigned evidence.
            claimRefs:
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory maturity is not technical validation
            body: >-
              The extended review, prior failed trial, and external-control evidence base make cohort comparability and
              FDA's assessment of the amended package the decisive near-term technical issues.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Patient, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex addresses a narrow care pathway rather than a conventional account base. The end beneficiaries
              are people with infantile-onset Niemann-Pick disease type C and their caregivers; the operating users are
              specialist clinicians and treatment centers; and the eventual economic buyers would be payers or health
              systems if the product is approved. NORD estimates NPC across all onset groups at one case per
              100,000-120,000 live births and warns that misdiagnosis and underdiagnosis make true frequency uncertain.
              Diagnosis can require specialist suspicion, biomarker testing, and genetic confirmation, while treatment
              may involve neurologists and several other specialties. That pathway makes referral timing, center
              readiness, reimbursement, and family support central to adoption. Public evidence does not quantify the
              infantile-onset subset, eligible U.S. patients, treating-center count, payer mix, or willingness to
              reimburse adrabetadex.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU009
              - CU010
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
              - CU016
      - number: '6.2'
        title: Exposure and outcome proof
        blocks:
          - type: paragraph
            body: >-
              The most concrete adoption proxy is treatment exposure reported by Beren, not commercial use. An October
              2026 company release described 76 individuals treated for up to 11 years, including 29 lower-severity
              participants reported at 100% five-year survival. It separately described 25 people treated for at least
              five years and two sisters followed for roughly a decade. These are meaningful duration signals and
              indicate that some families and clinical sites sustained an invasive treatment pathway over many years.
              They are not customer metrics: the release does not disclose unique active patients at the run date,
              discontinuations, site counts, payer approvals, paid prescriptions, or revenue. The evidence is also
              company-issued and includes small uncontrolled case reports and observational analyses, so it supports
              proof of exposure but not a commercial retention rate or causal effectiveness estimate.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
              - CU010
          - type: table
            tableRef: TU003
