      financing, and a delayed FDA target date.
    data:
      items:
        - date: '2009'
          label: Cyclodextrin disease-onset finding
          detail: Research reported that a cyclodextrin delayed clinical disease onset in mice.
          tone: neutral
          claimRefs:
            - CO014
        - date: '2015'
          label: Vtesse launch and Phase 2/3 start
          detail: Vtesse launched with $25 million and moved the program into a Phase 2/3 trial.
          tone: positive
          claimRefs:
            - CO014
        - date: '2016'
          label: Original Breakthrough Therapy Designation
          detail: Adrabetadex received an earlier designation under a prior sponsor.
          tone: positive
          claimRefs:
            - CO013
        - date: '2017'
          label: Two ownership transactions
          detail: Sucampo acquired Vtesse, then Mallinckrodt agreed to acquire Sucampo.
          tone: neutral
          claimRefs:
            - CO014
        - date: '2018'
          label: Phase 2/3 trial failed
          detail: The pivotal program did not meet its objective, creating the need for a different regulatory path.
          tone: negative
          claimRefs:
            - CO014
        - date: '2021'
          label: Mandos acquired adrabetadex
          detail: Beren's subsidiary acquired the program from Mallinckrodt.
          tone: neutral
          claimRefs:
            - CO004
        - date: '2024-09-20'
          label: Miplyffa approved
          detail: The FDA approved the first treatment for NPC, establishing an approved competitor.
          tone: negative
          claimRefs:
            - CO012
        - date: '2025-12-09'
          label: Breakthrough designation regranted
          detail: The FDA granted a new designation after reviewing external-control survival analyses.
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-02-24'
          label: NDA accepted for Priority Review
          detail: The FDA accepted the adrabetadex NDA for infantile-onset NPC.
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-06-10'
          label: $300 million financing announced
          detail: Beren announced equity, senior-secured debt, and contingent royalty capital.
          tone: positive
          claimRefs:
            - CO006
            - CO007
            - CO008
            - CO009
        - date: '2026'
          label: FDA target extended
          detail: A major amendment moved the target action date from August 17 to November 17.
          tone: negative
          claimRefs:
            - CO005
            - CO015
    approximationNotes: >-
      Dates are source-stated; the FDA extension article did not expose an exact publication date in the fetched text,
      so that event is shown at year precision.
    claimRefs:
