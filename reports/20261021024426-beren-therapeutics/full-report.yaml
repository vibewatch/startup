  - id: FM001
    title: Evidence-constrained market sizing hierarchy
    type: pyramid
    summary: >-
      The available evidence narrows from all-NPC incidence to Beren's filed infantile segment but stops before a
      defensible treated-patient or revenue estimate.
    data:
      items:
        - label: Genetic incidence baseline
          value: 1 in 100000-120000 live births
          detail: All NPC; geography not specified by NORD
        - label: Clinical population
          value: Perinatal through adult onset
          detail: Broader than Beren's filed segment
        - label: Diagnosed population
          value: Not quantified
          detail: Misdiagnosis and underdiagnosis limit prevalence certainty
        - label: U.S. treatment segment
          value: Age 2 years and older
          detail: Existing Miplyffa plus miglustat approval scope, not a patient count
        - label: Beren filed segment
          value: Neurological onset before age 6
          detail: Infantile-onset NPC definition in Beren materials
        - label: Adrabetadex revenue market
          value: Not supportable
          detail: Diagnosed patients, price, gross-to-net, persistence, and site capacity are undisclosed
    approximationNotes: >-
      This is a boundary hierarchy, not a proportional funnel. Text values preserve different denominators and cannot be
      multiplied or converted into revenue without missing patient, utilization, pricing, and access inputs.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM016
  - id: FP001
    title: Competitive positioning by treatment directness and US maturity
    type: quadrant
    summary: >-
      Approved oral options occupy the highest maturity positions, while adrabetadex is highly direct to its stated
      infantile-onset segment but remains preapproval.
    data:
      points:
        - label: Adrabetadex
          x: 5
          'y': 2
          note: Direct infantile-onset investigational therapy; NDA decision pending
        - label: Miplyffa plus miglustat
          x: 4
          'y': 5
          note: FDA-approved neurological regimen for patients age 2+
        - label: Aqneursa
          x: 3
          'y': 5
          note: FDA-approved neurological option; retained regimen detail incomplete
        - label: Miglustat alone
          x: 2
          'y': 3
          note: Established adjunct; standalone US NPC position not established here
        - label: Symptom-directed care
          x: 1
          'y': 4
          note: Mature care pathway without a disease-modifying claim
        - label: Test for NPC program
          x: 1
          'y': 3
          note: Diagnostic enablement rather than treatment
    approximationNotes: >-
      Analyst ordinal scores from 1 (low) to 5 (high), based only on retained evidence. X measures directness as an NPC
      treatment, and Y measures US regulatory or care-path maturity; scores do not represent efficacy, market share,
      price, or clinical rank.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP009
      - CP011
      - CP012
      - CP016
  - id: FI001
    title: Evidence-bounded revenue model bridge
    type: flow
    summary: >-
      Six sequential gates separate broad disease occurrence from revenue and gross profit; most company-specific
      conversion and economic inputs remain undisclosed.
    data:
      nodes:
        - id: disease-occurrence
          label: Overall NPC occurrence
          detail: NORD estimates 1 in 100,000-120,000 live births, with underdiagnosis caveats.
        - id: diagnosed-label-eligible
          label: Diagnosed, label-eligible patients
          detail: Infantile-onset count and final approved label are not established.
        - id: payer-and-site-access
          label: Payer and treatment-site access
          detail: Coverage criteria, site capacity, and patient-support economics are not disclosed.
        - id: patient-starts
          label: Treated patient starts
          detail: Expanded access confirms activity but not reimbursed commercial starts.
        - id: net-revenue
          label: Recognized net revenue
          detail: List price, gross-to-net, dosing unit, and recognition policy are unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Manufacturing, logistics, royalties, and delivery-support costs are unavailable.
      edges:
        - from: disease-occurrence
          to: diagnosed-label-eligible
        - from: diagnosed-label-eligible
          to: payer-and-site-access
        - from: payer-and-site-access
          to: patient-starts
        - from: patient-starts
          to: net-revenue
        - from: net-revenue
          to: gross-profit
    approximationNotes: >-
      This is a dependency flow, not a quantitative funnel; no conversion rate, patient count, revenue, or gross-profit
      value is inferred.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI016
  - id: FE001
    title: Adrabetadex product architecture evidence map
    type: stack
    summary: Six evidence layers connect disease biology to the controls required for a durable product.
    data:
      layers:
        - label: Disease biology
          modules:
            - NPC1/NPC2 dysfunction
            - Defective intracellular lipid trafficking
          detail: Independent disease sources support the target biology.
        - label: Therapeutic composition
          modules:
            - 2-hydroxypropyl-beta-cyclodextrin isomer mixture
          detail: Composition description is company-issued.
        - label: Intended mechanism
          modules:
            - Re-establish intracellular cholesterol trafficking
          detail: Mechanism is designed and claimed, not independently validated by this pool.
        - label: Clinical evidence
          modules:
            - Historical Phase 2/3
            - Expanded access
            - External-control survival analysis
          detail: The prior controlled program failed; the filing relies on later survival evidence.
        - label: Safety and monitoring
          modules:
            - Hearing impairment
            - Post-dose fatigue and/or ataxia
          detail: Rates, severity, and monitoring protocol remain unavailable.
        - label: Regulatory and IP controls
          modules:
            - Priority Review NDA
            - Formulation and manufacturing patents
          detail: Review remains pending in the dated evidence; patent breadth is company-reported.
    approximationNotes: Conceptual evidence stack; layer order does not imply validated causality or relative technical importance.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
  - id: FU001
    title: Evidence-backed patient access journey
    type: journey-map
    summary: >-
      The pathway moves from hard-to-recognize disease through specialist confirmation, treatment selection,
      administration, reimbursement, and long-term support.
    data:
      nodes:
        - id: recognition
          label: Symptom recognition
          detail: Variable neurological and visceral presentation can delay suspicion.
          touchpoints:
            - Family
            - Pediatrician
        - id: referral
          label: Specialist referral
          detail: Neurology and multidisciplinary assessment shape diagnosis and care.
          touchpoints:
            - Neurologist
            - Specialty center
        - id: confirmation
          label: Diagnostic confirmation
          detail: Biomarker and NPC1 or NPC2 genetic testing support confirmation.
          touchpoints:
            - Laboratory
            - Genetic counselor
        - id: selection
          label: Treatment selection
          detail: Existing oral therapies and investigational adrabetadex create a multi-therapy decision.
          touchpoints:
            - Clinician
            - Caregiver
        - id: administration
          label: Sustained administration
          detail: Public adrabetadex evidence reflects years of clinical exposure, not paid utilization.
          touchpoints:
            - Treatment center
            - Patient
        - id: access-support
          label: Reimbursement and support
          detail: Beren is funding patient-access and family-support infrastructure, but coverage evidence is absent.
          touchpoints:
            - Payer
            - Family support
    approximationNotes: >-
      Conceptual sequence based on cited care-pathway evidence; it does not quantify conversion, timing, or patient
      volumes.
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU010
      - CU011
      - CU016
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative likelihood, impact, and mitigation maturity based only on retained evidence; unknowns remain unknown
      rather than being assigned false precision.
    data:
      columns:
        - key: likelihood
          label: Likelihood
          detail: Evidence-based likelihood category
        - key: impact
          label: Impact
          detail: Potential investment impact
        - key: mitigation
          label: Mitigation maturity
          detail: Publicly evidenced mitigation maturity
      rows:
        - label: FDA review delay or adverse action
          note: Review was already extended after a Major Amendment.
          values:
            - value: High
              tone: risk
            - value: High
              tone: risk
            - value: Developing
              tone: warning
        - label: External-control evidence discounted
          note: Filing relies in part on matched external controls.
          values:
            - value: Medium-high
              tone: warning
            - value: High
              tone: risk
            - value: Developing
              tone: warning
        - label: Safety or administration limits uptake
          note: Hearing impairment, fatigue, ataxia, and specialist delivery matter.
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: risk
            - value: Partial
              tone: warning
        - label: Approved alternatives constrain adoption
          note: Two FDA-approved NPC treatments are documented.
          values:
            - value: Medium-high
              tone: warning
            - value: Medium-high
              tone: warning
            - value: Unclear
              tone: neutral
        - label: Manufacturing or site capacity shortfall
          note: No commercial readiness metrics are public in the retained pool.
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: risk
            - value: Not evidenced
              tone: neutral
        - label: Capital or legal overhang
          note: Cash runway, financing terms, IP, and litigation remain unresolved.
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: risk
            - value: Not evidenced
              tone: neutral
    approximationNotes: >-
      Qualitative categories are analytical judgments, not statistical probabilities; unknown categories identify
      missing public evidence.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR008
      - CR012
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The path from clinical need to a track recommendation is constrained by regulatory evidence risk and missing
      transaction economics.
    data:
      nodes:
        - id: need
          label: Severe rare disease
          detail: NPC is progressive and incidence estimates remain uncertain.
        - id: catalyst
          label: Accepted NDA
          detail: Adrabetadex is under FDA review.
        - id: evidence
          label: External-control reliance
          detail: The filing follows a failed Phase 2/3 trial and uses a survival comparison.
        - id: gate
          label: Extended FDA review
          detail: A major amendment moved the decision date to November 17, 2026.
        - id: price
          label: No defensible entry price
          detail: Private valuation, preferences, dilution, cash, and launch economics are undisclosed.
        - id: decision
          label: Track
          detail: Reassess after regulatory resolution and financing disclosure.
    approximationNotes: >-
      Ordered analytical sequence, not a probability model; the FDA archive does not provide a pending-application
      success rate and no node is value-weighted.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV016
