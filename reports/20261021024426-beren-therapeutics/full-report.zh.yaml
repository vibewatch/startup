  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场不是完整的溶酶体贮积病类别，也不能从所有 Niemann-Pick disease 的治疗需求推算。Beren 将婴儿起病型 NPC 定义为 6
              岁前出现神经系统症状，而更广泛的疾病可从围产期一直到成年发病。因此，核心商业边界是针对这一婴儿亚组的疾病修饰疗法。相邻支出包括获批的神经症状疗法、诊断、多学科护理和家庭支持，但这些类别不能等同于
              adrabetadex 收入。Miplyffa 联合 miglustat 已获 FDA 批准，用于成人和 2
              岁及以上儿童，因此现状既包括获批药物，也包括支持性护理。临床研究和扩大使用说明生态活跃，但不代表付费商业需求。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM014
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              NORD 估计 NPC 的发生率为每 100,000–120,000 名活产婴儿 1 例，但也警告误诊和漏诊使真实频率难以确定。这个发生率是所有 NPC 的起点，不是 I-NPC 患者数、治疗患病率或收入
              TAM。当前 ClinicalTrials.gov 搜索返回 43 项研究，其中包括 6 项招募中和 4 项活跃但未招募的记录，说明科学活动持续存在，却不能转换成独立患者数或商业需求。现有证据没有披露美国已确诊
              I-NPC 患者数、年度新启动治疗数、符合条件的治疗中心容量、价格、gross-to-net 扣减或治疗持续性。              因此，数值化的 TAM/SAM/SOM
              会带来虚假的精确度；可辩护的规模估算链只能停留在有来源支持的流行病学，并明确标出每个尚未解决的收窄步骤。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM007
              - CM008
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              患者和家庭是受益者，但采用要经过多方系统：负责诊断的临床医生、神经科及其他专科医生、治疗地点、监管机构和第三方付款方。NORD
              描述了儿科、神经科、肺科、胃肠科及其他专科之间的协同护理，说明单靠处方并不能创造可及性。Beren
              已宣布的商业准备项目瞄准诊断、单一家庭联系人、本地护理地点、真实世界证据和同业学习。这些重点说明了预期的采用瓶颈，但它们是公司计划，不是付款方覆盖、地点容量、转诊吞吐量或家庭接受度已经存在的证明。预算归属和报销机制仍是重要尽调事项。
            claimRefs:
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM012
              - CM014
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动因素是疾病严重程度、漏诊带来的病例发现空间，以及在治疗选择有限的亚组中形成差异化机制主张。不过，近期兑现既具有二元性，也对运营要求很高。FDA 将 Beren 对信息请求的回复视为重大修订，并将
              PDUFA 日期推迟至 2026 年 11 月 17 日，使审查延长 3 个月。Beren 筹集股权并安排了依赖里程碑的债务和以批准为条件的特许权使用费资本，既显示上市意图，也说明资本密集；融资 headline
              的全部金额不等于当前可用现金。Hercules
              的风险贷款定位说明专业资本可以跨越生命科学里程碑，但分阶段融资、特许权使用费泄漏、未披露的定价和未量化的合资格人群都会限制估值。在没有诊断、报销、治疗地点和持续性证据之前，不应把批准建模为立即渗透。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 获批不等于立即占领市场
            body: 审查延长 3 个月、已确诊 I-NPC 人群规模未量化，以及定价、报销和地点容量未披露，使近期渗透成为市场的主要风险。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合如今包括两种获批药物
        blocks:
          - type: paragraph
            body: >-
              Beren 面临的是多个层次的竞争，而非单一同类分子。直接基准是 Zevra 的 Miplyffa，这是首个获 FDA 批准的 NPC 药物，与 miglustat 联用，用于 2
              岁及以上患者的神经症状。NORD 还指出，Aqneursa 已获 FDA 批准，用于成人和体重至少 15 千克儿童的神经症状。这些批准推翻了 NPC 没有获批疾病修饰选项的旧描述，并把 adrabetadex
              的定位收窄到婴儿起病型人群，并转向不同的鞘内给药路径。除此之外，miglustat、多学科症状管理、诊断项目和临床中心护理路径仍是替代方案或互补方案。公开证据没有确认完整的发起方名单、价格、市场份额或当前治疗患者数，因此这幅竞争图景是方向性的，不是穷尽性的。
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP009
              - CP011
              - CP012
              - CP015
      - number: '3.2'
        title: 给药路径与监管成熟度构成最清晰的权衡
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex 是 Beren 唯一公开披露的临床资产，被描述为针对婴儿起病型 NPC 的鞘内 hydroxypropyl beta-cyclodextrin。             
              该路径可能支持差异化的生物学和年龄分层逻辑，但也带来口服 Miplyffa 不具备的给药和地点容量要求；FDA 表示 Miplyffa 与 miglustat 联用、每日口服 3 次。Aqneursa
              又增加了一项获批的神经系统选项，但保留的公开来源没有提供可比的给药方案或发起方画像。因此，核心权衡不只是疗效对疗效：买方和家庭必须权衡监管确定性、治疗负担、年龄资格、诊断可及性和专科护理连续性。序数图评估的是有证据支持的成熟度和治疗直接性，而不是临床优越性或市场份额。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP011
              - CP012
              - CP016
      - number: '3.3'
        title: 商业可及性可能与产品差异化同样重要
        blocks:
          - type: paragraph
            body: >-
              保留的来源没有披露这些选项可比的目录价格、返利、gross-to-net 假设或实际治疗成本。这一缺口是重要的尽调问题，不是价格相等的证据。不过，包装和交付方式明显不同：Miplyffa 是与 miglustat
              联用、按体重调整剂量的口服方案，而 adrabetadex 为鞘内给药且仍在研究中。Beren 的 Test for NPC
              项目可能改善诊断和患者发现，在上市前形成可及性优势，但其证据来自一张承载公司更新的患者组织网页，而不是独立的招募或转化测量。转换成本可能来自专科关系、给药物流和治疗连续性；公开的比较性持续性、付款方覆盖和多重使用数据仍不可得。
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: 监管执行与现有产品证明限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Beren 最重要的替代风险，是与已经获批的替代方案竞争时能否执行到位。FDA 在将 Beren 对信息请求的回复归类为重大修订后，把 adrabetadex 的决策日期推迟到 2026 年 11 月 17
              日。Fierce Biotech 还报道称，继承而来的 Phase 2/3 项目于 2018 年失败，当前申报依赖外部对照生存比较。报告的五年生存差异很大，但 FDA
              近期曾在其他项目中反对外部对照，使批准和标签范围不像单看获批竞争者矩阵那样确定。              Zevra 2026 年 10 月约 $620 million
              的市值只能作为规模参照，而不是产品收入或竞争份额。更广泛地说，孤儿药销售额仍然可观，但行业增长正在放缓，这支持需求，却不能证明 Beren 具备持久定价权。
            claimRefs:
              - CP005
              - CP006
