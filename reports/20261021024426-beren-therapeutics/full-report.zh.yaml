              在将公司对信息请求的回复归类为重大修订后，把决策日期推迟到 11 月 17 日。这一过程说明，批准、标签范围、上市时间和付款方可及性都是商业收入的前置条件，而非当前的经常性经济性。Beren
              还表示支持过扩大使用项目，但公开记录没有披露该项目是获得报销、按成本供药还是免费提供。因此，扩大使用只能证明运营活动，不能证明已确认收入、需求或利润率。
