figures:
  - id: FO001
    title: Adrabetadex 公司与监管里程碑
    type: timeline
    summary: 该资产经历了多次所有权变更、关键研究失败、监管认定重新授予、融资，以及 FDA 目标日期延期。
    data:
      items:
        - date: '2009'
          label: 环糊精延缓疾病起病的发现
          detail: 研究报告称，环糊精延缓了小鼠临床疾病的起病。
          tone: neutral
          claimRefs:
            - CO014
        - date: '2015'
          label: Vtesse 上市与 Phase 2/3 启动
          detail: Vtesse 获得 $25 million 融资并将项目推进至 Phase 2/3 试验。
          tone: positive
          claimRefs:
            - CO014
        - date: '2016'
          label: 最初的突破性疗法认定
          detail: Adrabetadex 在前任申办方旗下获得过更早的认定。
          tone: positive
          claimRefs:
            - CO013
        - date: '2017'
          label: 两次所有权交易
          detail: Sucampo 收购 Vtesse，随后 Mallinckrodt 同意收购 Sucampo。
          tone: neutral
          claimRefs:
            - CO014
        - date: '2018'
          label: Phase 2/3 试验失败
          detail: 关键项目未达到目标，因此需要寻找不同的监管路径。
          tone: negative
          claimRefs:
            - CO014
        - date: '2021'
          label: Mandos 收购 adrabetadex
          detail: Beren 旗下子公司从 Mallinckrodt 手中收购了该项目。
          tone: neutral
          claimRefs:
            - CO004
        - date: '2024-09-20'
          label: Miplyffa 获批
          detail: FDA 批准了 NPC 的首个治疗方案，由此形成一个已获批的竞争对手。
          tone: negative
          claimRefs:
            - CO012
        - date: '2025-12-09'
          label: 突破性疗法认定重新授予
          detail: FDA 审查外部对照生存分析后，重新授予了认定。
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-02-24'
          label: NDA 获受理并进入优先审查
          detail: FDA 受理了针对婴儿起病型 NPC 的 adrabetadex NDA。
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-06-10'
          label: 宣布 $300 million 融资
          detail: Beren 宣布了股权、优先担保债务和或有特许权使用费资本。
          tone: positive
          claimRefs:
            - CO006
            - CO007
            - CO008
            - CO009
        - date: '2026'
          label: FDA 目标日期延期
          detail: 一项重大修订将目标行动日期从 August 17 推迟至 November 17。
          tone: negative
          claimRefs:
            - CO005
            - CO015
    approximationNotes: 日期来自来源原文；FDA 延期文章的抓取文本未显示确切发布日期，因此该事件仅精确到年份。
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO012
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: 受证据约束的市场规模层级
    type: pyramid
    summary: 现有证据从 NPC 总体发病率逐步收窄至 Beren 申报的婴儿起病型细分市场，但尚不足以得出可信的治疗患者数或收入估计。
