              Mandos 开发的主力项目。它要解决的是疾病修饰，而非只管理症状：Beren 称该候选药物旨在重新建立细胞内胆固醇运输，这是 NORD 和 FDA
              描述的核心细胞缺陷。公开证据没有确认商业化给药方案、地点要求、剂量安排、设备需求或支持模式。这一缺口很重要，因为 NPC
              患者可能存在严重神经功能和吞咽障碍，因此交付、监测、照护者负担和专科地点容量都属于产品本身，而非外围的上市细节。
