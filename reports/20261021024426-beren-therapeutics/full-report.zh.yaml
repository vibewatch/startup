            body: >-
              Adrabetadex 已进入后期，但风险尚未解除。Beren 报告称 FDA 于 2026 年 2 月接受 NDA 并给予 Priority Review，目标日期为 2026 年 11 月 17
              日；同一公告称，产品在发布时尚未获任何卫生主管机构批准。Fierce Biotech 报道，FDA 将目标日期从 8 月推迟，因为 FDA 将 Beren
              对更新和澄清文件请求的回复视为重大修订。申报中报告的生存证据比较了治疗患者与外部对照，而底层 Phase 2/3 试验在 2018
              年失败。这些事实使数据来源、队列可比性、敏感性分析和批准后证据生成成为主要可靠性问题；Priority Review 是审查状态，不是批准或疗效证据。
