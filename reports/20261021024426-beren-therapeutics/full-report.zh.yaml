              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.4'
        title: 投资启示与待完成尽调
        blocks:
          - type: paragraph
            body: >-
              近期最强证据是监管进展与为上市准备而设计的融资相互配合；最薄弱的环节是透明的公司层面经济性。指定来源没有披露估值、收入或收入运行率、客户数、员工总数、烧钱或不受限制的 runway。因此，应将 $300
              million 的公告理解为资本方案，而不是累计融资、企业价值或手头现金。安全性同样关键：公司材料将听力损伤列为 adrabetadex 的主要不良事件之一，独立临床前研究则发现 HPbetaCD
              在猫中会导致与剂量相关的听阈上升。尽调应优先获取 FDA 往来文件、股权结构表、融资提取条件、特许权使用费敏感性、上市地点容量、完整的领导层和董事会名单，以及经审计的流动性数据。
