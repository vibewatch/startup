        title: 展示材料
        blocks:
          - type: callout
            title: 价格纪律压倒公司质量
            body: 跟踪 Beren，等待 2026 年 11 月 17 日 FDA 决定，并在进行投资评估前要求完整融资条款。所有权、优先权、现金需求、定价和上市成本未知时，单独获批并不能证明回报有吸引力。
            calloutType: recommendation
            claimRefs:
