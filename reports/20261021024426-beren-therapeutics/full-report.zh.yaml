        title: 患者、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex 面向的是一条狭窄的护理路径，而不是传统的客户账户基础。最终受益者是婴儿起病型 Niemann-Pick disease type C
              患者及其照护者；运营使用者是专科临床医生和治疗中心；如果产品获批，最终经济买方则会是付款方或医疗系统。NORD 估计所有发病类型的 NPC 发生率为每 100,000–120,000 名活产婴儿 1
              例，并警告误诊和漏诊使真实频率不确定。诊断可能需要专科医生怀疑、生物标志物检测和基因确认，治疗则可能涉及神经科医生及其他多个专科。这条路径使转诊时间、中心准备度、报销和家庭支持成为采用的核心。公开证据没有量化婴儿起病型亚组、符合条件的美国患者、治疗中心数量、付款方组合或付款方报销
              adrabetadex 的意愿。
