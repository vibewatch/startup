  - id: FI001
    title: 受证据约束的收入模型桥接
    type: flow
    summary: 六道连续关卡将广义疾病发生与收入、毛利分开；多数公司特定的转化和经济输入仍未披露。
    data:
      nodes:
        - id: disease-occurrence
          label: NPC 总体发生率
          detail: NORD 估计每 100,000-120,000 例活产中有 1 例，但提示存在漏诊。
        - id: diagnosed-label-eligible
          label: 已确诊且符合标签的患者
          detail: 婴儿起病型患者数和最终获批标签尚未确定。
        - id: payer-and-site-access
          label: 支付方与治疗点准入
          detail: 覆盖标准、治疗点容量和患者支持经济性均未披露。
        - id: patient-starts
          label: 启动治疗的患者
          detail: 扩大使用确认了治疗活动，但不等于有报销的商业化治疗启动。
        - id: net-revenue
          label: 确认的净收入
          detail: 标价、毛收入到净收入、给药单位和收入确认政策均不可得。
        - id: gross-profit
          label: 毛利
          detail: 制造、物流、特许权使用费和交付支持成本均不可得。
      edges:
        - from: disease-occurrence
          to: diagnosed-label-eligible
        - from: diagnosed-label-eligible
          to: payer-and-site-access
        - from: payer-and-site-access
          to: patient-starts
        - from: patient-starts
          to: net-revenue
        - from: net-revenue
          to: gross-profit
    approximationNotes: 这是依赖关系流，而不是定量漏斗；没有推算转化率、患者数、收入或毛利。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI016
  - id: FE001
    title: Adrabetadex 产品架构证据图
    type: stack
    summary: 六层证据将疾病生物学与打造持久产品所需的控制环节连接起来。
    data:
      layers:
        - label: 疾病生物学
          modules:
            - NPC1/NPC2 功能障碍
            - 细胞内脂质运输缺陷
          detail: 独立疾病来源支持该靶点生物学。
        - label: 治疗组成
          modules:
            - 2-hydroxypropyl-beta-cyclodextrin 异构体混合物
          detail: 组成描述由公司发布。
        - label: 预期机制
          modules:
            - 重建细胞内胆固醇运输
          detail: 该机制经过设计并由公司主张，但未获本证据池独立验证。
        - label: 临床证据
          modules:
            - 历史 Phase 2/3
            - 扩大使用
            - 外部对照生存分析
          detail: 此前的对照项目失败；申报依赖后续生存证据。
        - label: 安全性与监测
          modules:
            - 听力损伤
            - 给药后疲劳和 / 或共济失调
          detail: 发生率、严重程度和监测方案仍不可得。
        - label: 监管与 IP 控制
          modules:
            - 优先审查 NDA
            - 配方与制造专利
          detail: 截止日期所对应的证据显示审查仍在进行；专利范围来自公司报道。
    approximationNotes: 概念性证据堆栈；层级顺序不代表因果关系已验证，也不代表技术重要性排序。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
  - id: FU001
    title: 有证据支持的患者准入路径
    type: journey-map
    summary: 这条路径从难以识别的疾病出发，经过专科确认、治疗选择、给药、报销和长期支持。
    data:
      nodes:
        - id: recognition
          label: 识别症状
          detail: 神经和内脏表现多变，可能延误怀疑和识别。
          touchpoints:
            - Family
            - Pediatrician
        - id: referral
          label: 转诊专科
          detail: 神经科及多学科评估决定诊断与护理路径。
          touchpoints:
            - Neurologist
            - Specialty center
        - id: confirmation
          label: 确认诊断
          detail: 生物标志物及 NPC1 或 NPC2 基因检测支持确诊。
          touchpoints:
            - Laboratory
            - Genetic counselor
        - id: selection
          label: 选择治疗
          detail: 现有口服疗法与研究性 adrabetadex 共同构成多疗法决策。
          touchpoints:
            - Clinician
            - Caregiver
        - id: administration
          label: 持续给药
          detail: 公开的 adrabetadex 证据反映多年临床暴露，而不是付费使用。
          touchpoints:
            - Treatment center
            - Patient
        - id: access-support
          label: 报销与支持
          detail: Beren 正资助患者准入和家庭支持基础设施，但没有覆盖证据。
          touchpoints:
            - Payer
            - Family support
    approximationNotes: 基于所引护理路径证据的概念性顺序；不量化转化率、时间或患者量。
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU010
      - CU011
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 仅依据留存证据判断定性可能性、影响和缓释成熟度；未知仍是未知，不赋予虚假的精确度。
    data:
      columns:
        - key: likelihood
          label: 可能性
          detail: 基于证据的可能性类别
        - key: impact
          label: 影响
          detail: 潜在投资影响
        - key: mitigation
          label: 缓释成熟度
          detail: 有公开证据支持的缓释成熟度
      rows:
        - label: FDA 审查延期或采取不利行动
          note: 重大修订后，审查已经延期。
          values:
            - value: High
              tone: risk
            - value: High
              tone: risk
            - value: Developing
              tone: warning
        - label: 外部对照证据被打折
          note: 申报部分依赖匹配的外部对照。
          values:
            - value: Medium-high
              tone: warning
            - value: High
              tone: risk
            - value: Developing
              tone: warning
        - label: 安全性或给药限制放量
          note: 听力损伤、疲劳、共济失调和专科给药都会影响执行。
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: risk
            - value: Partial
              tone: warning
        - label: 已获批替代方案限制采用
          note: 已记录两种 FDA 批准的 NPC 治疗方案。
          values:
            - value: Medium-high
              tone: warning
            - value: Medium-high
              tone: warning
            - value: Unclear
              tone: neutral
        - label: 制造或治疗点容量不足
          note: 留存证据池中没有公开的商业准备度指标。
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: risk
            - value: Not evidenced
              tone: neutral
        - label: 资本或法律悬置
          note: 现金续航、融资条款、IP 和诉讼仍未解决。
          values:
            - value: Unknown
              tone: neutral
            - value: High
              tone: risk
            - value: Not evidenced
              tone: neutral
    approximationNotes: 定性类别是分析判断，不是统计概率；未知类别标识缺失的公开证据。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR008
      - CR012
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从临床需求到继续跟踪建议的路径，受监管证据风险和缺失的交易经济数据约束。
    data:
      nodes:
        - id: need
          label: 严重罕见病
          detail: NPC 具有进行性，发病率估计仍不确定。
        - id: catalyst
          label: NDA 获受理
          detail: Adrabetadex 正接受 FDA 审查。
        - id: evidence
          label: 依赖外部对照
          detail: 申报是在 Phase 2/3 试验失败后提出，并采用生存比较。
        - id: gate
          label: FDA 审查延期
          detail: 一项重大修订将决策日期推迟至 November 17, 2026。
        - id: price
          label: 没有可信的入场价格
          detail: 私人估值、优先权、稀释、现金和上市经济性均未披露。
        - id: decision
          label: 继续跟踪
          detail: 监管结果和融资披露后重新评估。
    approximationNotes: 有序的分析序列，而非概率模型；FDA 档案没有提供待决申请的成功率，各节点也未按价值加权。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV016
