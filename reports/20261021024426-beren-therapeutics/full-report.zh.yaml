  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点与决策姿态
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑很窄：Beren 将 adrabetadex 从已终止项目带回到已获接受的 NDA 阶段，公司时间线和独立报道都确认该申请正在接受 FDA 审查。这是真实的期权价值，但不等于批准或商业证明。Fierce
              Biotech 报道，FDA 将 Beren 对信息请求的回复视为重大修订，并将决策日期从 8 月 17 日推迟到 2026 年 11 月 17 日。同一报道称，该申报依赖外部对照生存比较，而此前的 Phase
              2/3 试验已经失败。指定证据没有披露股权价格、投后估值、优先股堆叠、现金余额或上市经济性，因此恰当姿态是跟踪而非买入。信心为中低，风险为高，因为下一次监管事件可能大幅改变资产价值，而入场价格仍未知。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV016
      - number: '8.2'
        title: 投资逻辑、反方逻辑与证据质量
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在一种严重、进行性疾病、持续未满足需求和差异化监管路径之上。NORD 估计 NPC 发生率为每 100,000 至 120,000 名活产婴儿 1
              例，但警告误诊和漏诊使真实频率不确定。反方逻辑同样具体。FDA 已批准 Miplyffa，NORD 还确认 Aqneursa，因此 adrabetadex
              进入的是已有治疗而不是空白的类别。更重要的是，Fierce 报道五年生存比较为 adrabetadex 84% 对外部对照 42%，同时指出 FDA 近期对外部对照方法持怀疑态度。FDA 关于 Miplyffa
              的公告描述了一项随机、双盲、安慰剂对照试验，使这一证据对比与风险相关，尽管两种疗法及其终点并不直接可比。因此，获批会验证资产，但不会自动证明优越性、采用率、定价权或任何入场估值下的诱人回报。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.3'
        title: 估值背景与情景纪律
        blocks:
          - type: paragraph
            body: >-
              可用的公开基准是背景参照，而不是直接可比对象。CompaniesMarketCap 报告 Zevra Therapeutics 于 2026 年 10 月 20 日的市值约为 $0.62 billion；FDA
              于 2024 年批准 Zevra 的 Miplyffa，成为首个获批的 NPC 药物。Zevra 是拥有获批产品的上市公司，而 Beren 是私有公司，主力候选药物仍在审查中，因此直接套用 Zevra 市值作为
              Beren 估值，会忽略批准状态、资本结构、收入、稀释和产品组合差异。FDA 的 priority-approval archive 也列出已完成的年度批准，而不是待审申请的成功概率，因此不能支持 Beren
              的精确成功率。Bull、base 和 bear 结果应表达为决策条件，而不是捏造的美元区间。要形成有价格的判断，需要当前融资文件、完全摊薄所有权、优先权、现金和 runway、上市定价、gross-to-net
              假设及可信的商业化计划。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与逻辑失效点
        blocks:
          - type: paragraph
            body: >-
              退出准备度取决于事件。FDA 作出有利决定可能引发战略或融资兴趣，但公开证据没有确认出售流程、IPO 时间表或批准后的商业画像。近期尽调材料应包括 FDA
              信息请求及回复、外部对照构建的敏感性分析、地点层面的治疗容量、报销和定价工作、制造准备度、完整股权结构表、清算优先权、反稀释条款、债务或结构化资本义务，以及现金
              runway。遭到拒绝、再次重大延期，或证据表明生存比较不足以支持标签或报销，都会令投资逻辑失效。如果融资条款将大部分批准上行空间转给高级资本，或获批替代方案实质限制符合条件的患者，逻辑也会削弱。只有当监管结果和融资透明度允许计算风险调整回报，而不是进行公司质量判断时，观点才会升级。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV008
