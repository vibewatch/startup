        - 上市执行、报销、治疗能力和稀释。
        - FDA 获批，加上已披露的融资和上市证据。
      - - 基准
        - 决策仍在等待，或获批时仍存在重大商业不确定性。
        - 继续跟踪；现金需求、优先权、市场准入和符合条件的患者群体明确前，暂不定价。
        - 进一步的信息要求、缓慢放量和融资悬置。
