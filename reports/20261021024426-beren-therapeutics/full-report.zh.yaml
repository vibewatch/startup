              多项；全球专利布局覆盖组合物、制剂、制造工艺、生物标志物和治疗方法，并据称在延期前保护至 2046 年。这体现的是广度，但尚未证明 freedom-to-operate
              或可执行性，因为指定材料没有专利主张、审查历史或法律意见。治疗流程还要与获批口服产品竞争：FDA 将 Miplyffa 描述为与 miglustat 联用的口服药，Mayo 则将 levacetylleucine
              描述为混悬粉。因此，Beren 必须证明 adrabetadex 的临床获益和可管理的安全负担足以抵消给药复杂性。指定证据中没有可信的公开开发者或执业者社区 proxy。
