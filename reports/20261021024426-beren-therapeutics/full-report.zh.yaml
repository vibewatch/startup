            body: >-
              首个监测日期是 2026 年 11 月 17
              日。完整回复信、另一次重大延期、明显窄于预期的标签，或负担沉重的确认性要求，都会削弱批准逻辑。批准后，如果听力毒性难以管理，专科地点无法在实际规模下重复实施鞘内治疗，或付款方可及性落后于婴儿起病型目标人群，投资逻辑就应失效。投资前，尽调应取得
              FDA 往来文件、临床和外部对照敏感性分析、CMC 和检查准备度、按地点划分的上市容量、安全管理方案、产品责任保险、freedom-to-operate 工作、诉讼清单，以及完全摊薄的现金和 runway
              bridge。科学会议为持续外部审视溶酶体疾病数据提供渠道，但仅参加会议不能验证 Beren 的申报，也不能解决这些私有证据缺口。
            claimRefs:
