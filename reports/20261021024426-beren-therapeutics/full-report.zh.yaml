chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Beren Therapeutics P.B.C. 称自己是一家由创始人主导、总部位于加州 Thousand Oaks 的生物科技公司，旗下有子公司 Mandos LLC，adrabetadex
              是其首个项目。公司的商业化前运营模式高度集中：公开证据只确认一项针对婴儿起病型 Niemann-Pick disease type C 的主力环糊精疗法，而非多元化临床管线。Jason Camm
              是公开点名的创始人兼首席执行官。Mandos 于 2021 年从 Mallinckrodt 收购该项目，使现有发起方接手的是一项存续已久的资产，而非新开发的分子。公开材料没有确认 Beren
              的成立日期、完整高管名单、董事会构成、员工人数，或 Thousand Oaks 总部以外的地点，因此组织深度和继任能力尚无法评估。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO013
      - number: '1.2'
        title: 监管定位与开发历程
        blocks:
          - type: paragraph
            body: >-
              Adrabetadex 正在接受 FDA Priority Review，目标行动日期为 2026 年 11 月 17 日；此前 FDA 将 Beren
              对信息请求的回复视为重大修订。延期很重要，因为这份申报来自一条非线性的开发轨迹：早期的 Breakthrough Therapy Designation 在一项为期 12 个月的 Phase 2b/3
              试验后被撤销，该试验于 2018 年失败，而更新后的申报依赖外部对照生存分析。公司报告称，接受治疗患者的五年总生存率为 84%，对照组为
              42%，但该比较仍由发起方提供，且取决于监管机构认可。目标疾病已有获批的神经系统疗法，包括 Miplyffa，因此 adrabetadex 进入的是已有治疗的市场，而不是首次提供 NPC 疗法。
            claimRefs:
              - CO005
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.3'
        title: 融资与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              Beren 于 2026 年 6 月宣布了 $300 million 的组合融资，但这个融资总额不等于可立即使用的现金。方案包括 $135 million 股权融资，以及来自 Hercules
              Capital、最高 $165 million 的结构化资本。其中，最高 $110 million 的定期贷款在宣布时仅提取了 $30 million，另有 $55 million 的特许权使用费融资以 FDA
              批准为条件。若完成融资，该特许权使用费将收取美国净销售额的 7.5% 以及美国以外销售额的 5%，到 2031 年受 1.75x
              上限约束，并附带提前赎回条款。该结构增强了上市准备，但也让债务、里程碑付款和特许权使用费主张优先于尚未验证的商业爬坡。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
