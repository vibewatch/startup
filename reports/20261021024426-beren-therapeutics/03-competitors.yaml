    claimRefs: [CP002, CP003, CP004, CP007, CP009, CP010, CP012]
  - id: TP003
    title: Pricing, packaging, and access comparison
    columns:
      - Option
      - Public price or unit
      - Packaging or contract model
      - Discount or coverage evidence
      - Competitive implication
    rows:
      - [Adrabetadex, Unknown, "Intrathecal investigational therapy; launch package undisclosed", Unknown, "Site capacity and payer pathway require diligence"]
      - [Miplyffa plus miglustat, Unknown, "Weight-adjusted oral dosing three times daily", Unknown, "Approved oral regimen sets an access and convenience benchmark"]
      - [Aqneursa, Unknown, "Approved product; retained regimen detail unavailable", Unknown, "Approval creates an alternative despite incomplete packaging data"]
