  topStrengths:
    - Adrabetadex has an accepted NDA under FDA Priority Review with a defined near-term action date.
    - The announced $300 million financing package expands approval and launch-preparation capacity.
    - Beren reports long-duration treated exposure, including 76 individuals treated for up to 11 years.
  topRisks:
    - >-
      The filing follows a failed Phase 2/3 trial and relies on an external-control survival analysis that remains
      exposed to FDA scrutiny.
    - >-
      Beren is a single-asset, precommercial company entering an NPC market with two documented FDA-approved
      neurological therapies.
    - >-
      Conditional debt and royalty capital can subordinate equity upside, while cash, burn, runway, valuation,
      preferences, and dilution remain undisclosed.
    - >-
      Hearing impairment and repeated intrathecal administration create safety, site-capacity, and patient-access
      execution risk.
  unresolvedGaps:
    - >-
      FDA correspondence, the final approval decision, label, post-marketing obligations, and sensitivity analyses for
      the external-control evidence.
    - >-
      Equity price, post-money valuation, fully diluted capitalization, liquidation preferences, anti-dilution terms,
      and complete Hercules facility obligations.
    - Cash balance, monthly burn, committed funding, total headcount, and approval-to-launch runway.
    - >-
      Launch price, gross-to-net assumptions, payer coverage, named treatment sites, throughput, manufacturing
      readiness, and supply redundancy.
    - A named post-adrabetadex pipeline with ownership, development stage, and stage-gated milestones.
