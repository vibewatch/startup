company:
  name: Beren Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Beren Therapeutics is a founder-led, precommercial rare-disease biotechnology
    company whose near-term value is concentrated in adrabetadex and its November
    17, 2026 FDA action date. A $300 million announced financing materially expands
    launch capacity, but much of the facility is conditional or structured capital,
    while valuation, operating scale, governance depth, and commercial economics
    remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Beren Therapeutics P.B.C. describes itself as a founder-led biotechnology
      company headquartered in Thousand Oaks, California, with Mandos LLC as its
      subsidiary and adrabetadex as its first program. The operating model is
      precommercial and unusually concentrated: public evidence identifies one
      lead cyclodextrin therapy for infantile-onset Niemann-Pick disease type C
      rather than a diversified clinical pipeline. Jason Camm is the named founder
      and chief executive officer. Mandos acquired the program from Mallinckrodt in
      2021, giving the current sponsor a long-lived asset rather than a newly
      originated molecule. The public materials do not establish Beren's founding
      date, complete executive roster, board composition, employee count, or
      locations beyond the Thousand Oaks headquarters, so organizational depth and
      succession capacity cannot yet be assessed.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO002]
  - id: regulatory-position-and-development-arc
    title: Regulatory position and development arc
    body: >-
      Adrabetadex is under FDA Priority Review with a November 17, 2026 target
      action date after the agency treated Beren's response to an information
      request as a major amendment. That delay is material because the filing
      follows a nonlinear development history: an earlier Breakthrough Therapy
      Designation was rescinded after a 12-month Phase 2b/3 trial, the trial failed
      in 2018, and the renewed filing relies on an external-control survival
      analysis. The company reported five-year overall survival of 84% for treated
      patients versus 42% for controls, but that comparison remains sponsor-derived
      and regulator-dependent. The addressable disease already has approved
      neurological therapies, including Miplyffa, so adrabetadex would enter an
      established treatment landscape rather than create the first NPC therapy.
    claimRefs: [CO005, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
  - id: financing-and-stakeholder-structure
    title: Financing and stakeholder structure
    body: >-
      Beren announced $300 million of combined financing in June 2026, but the
      headline is not equivalent to cash immediately available. The package
      consists of $135 million of equity and up to $165 million of structured
      capital from Hercules Capital. Within the latter, only $30 million of as much
      as $110 million in term loans was drawn at announcement, while a $55 million
      royalty financing is contingent on FDA approval. If funded, the royalty takes
      7.5% of U.S. net sales and 5% of sales outside the United States, subject to a
      1.75x cap through 2031 and early-redemption provisions. This structure
      strengthens launch readiness but creates debt, milestone, and royalty claims
      ahead of an unproven commercial ramp.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: investment-readthrough-and-open-diligence
    title: Investment read-through and open diligence
    body: >-
      The strongest near-term evidence is regulatory momentum paired with financing
      sized for launch preparation; the weakest area is transparent company-level
      economics. The assigned sources do not disclose a valuation, revenue or
      revenue run-rate, customer count, total headcount, burn, or unrestricted
      runway. The $300 million announcement should therefore be read as a capital
      package, not total raised, enterprise value, or cash on hand. Safety also
      remains consequential: company materials identify hearing impairment among
      adrabetadex's main adverse events, and an independent preclinical study found
      dose-dependent hearing-threshold increases with HPbetaCD in cats. Diligence
      should prioritize FDA correspondence, the equity capitalization table,
      facility draw conditions, royalty sensitivity, launch-site capacity, a full
      leadership and board roster, and audited liquidity.
    claimRefs: [CO006, CO007, CO008, CO009, CO011, CO016]
    tableRefs: [TO001]
