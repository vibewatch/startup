callouts:
  - calloutType: strength
    title: Launch financing is substantial but structured
    body: >-
      The announced package can fund launch preparation, yet only the equity and
      drawn debt should be treated as immediately evidenced capital; undrawn loans
      require milestones and the royalty tranche requires FDA approval.
    claimRefs: [CO006, CO007, CO008, CO009]
  - calloutType: risk
    title: Regulatory concentration dominates the company profile
    body: >-
      A delayed FDA decision, external-control evidence, prior trial failure,
      hearing-risk evidence, and approved NPC alternatives make the November 2026
      action the central value and financing catalyst.
    claimRefs: [CO005, CO012, CO013, CO014, CO015, CO016]
