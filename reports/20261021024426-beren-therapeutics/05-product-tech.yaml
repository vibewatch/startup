      - ["Assess clinical benefit", "Track neurologic function, progression, and survival", "NDA evidence includes a reported external-control survival comparison", "Fierce reports five-year survival of 84% treated versus 42% external control", "Nonrandomized external-control comparability and the failed Phase 2/3 study require scrutiny"]
      - ["Manage treatment burden and safety", "Coordinate specialist care and monitor neurologic function", "Company says hearing impairment can be managed with hearing aids when necessary", "Company identifies hearing impairment and post-dose fatigue and/or ataxia as main adverse events", "Incidence, severity, reversibility, dose relationship, and real-world monitoring protocol were unavailable"]
    notes: "Benefits and limitations preserve each source's population and evidence design; the survival comparison is company-generated evidence reported by Fierce Biotech, not a randomized head-to-head result."
    claimRefs: [CE003, CE004, CE005, CE010, CE011, CE012, CE013, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or component, Role, Public dependency, Principal risk]
    rows:
      - ["Disease identification", "Find patients with NPC1 or NPC2 dysfunction and characterize progression", "Specialist recognition, biomarker screening, and molecular confirmation", "Phenotypic variability and diagnostic delay can complicate cohort definition"]
      - ["Active composition", "Use a 2-hydroxypropyl-beta-cyclodextrin isomer mixture", "Controlled formulation and manufacturing processes", "Public evidence does not disclose composition controls, release specifications, or comparability"]
      - ["Clinical evidence package", "Connect treatment to survival and neurologic outcomes", "Historical Phase 2/3 data, expanded access experience, and external controls", "Prior trial failure and external-control bias weaken causal certainty"]
      - ["Regulatory and lifecycle controls", "Maintain NDA, safety surveillance, manufacturing readiness, and exclusivity", "FDA review responses plus patent and quality systems", "Major-amendment delay and unverified patent/FTO detail can affect launch timing and durability"]
    notes: "Architecture is reconstructed only from the assigned public evidence and flags every component whose implementation detail was not available."
    claimRefs: [CE002, CE004, CE005, CE009, CE010, CE011, CE014, CE015]
