  topStrengths:
    - Adrabetadex 的 NDA 已获 FDA 优先审评受理，并确定了近期行动日期。
    - 已宣布的 $300 million 融资方案扩大了公司推进审批和筹备上市的能力。
    - Beren 报告称患者接受治疗的时间较长，其中 76 人的治疗时长最长达 11 年。
  topRisks:
    - 这份申报是在一项失败的 2/3 期试验之后提交的，并依赖仍可能受到 FDA 审查的外部对照生存分析。
    - Beren 是一家商业化前的单资产公司，进入的 NPC 市场已有两种有据可查、获 FDA 批准的神经系统疗法。
    - 附带条件的债务和特许权使用费融资可能挤压股权上行空间，而现金、烧钱速度、现金跑道、估值、优先权和稀释情况仍未披露。
    - 听力损伤和反复鞘内给药带来安全性、治疗点容量和患者可及性方面的执行风险。
  unresolvedGaps:
    - FDA 往来文件、最终审批决定、药品标签、上市后义务，以及外部对照证据的敏感性分析。
    - 股权价格、投后估值、完全摊薄后股本、清算优先权、反稀释条款，以及 Hercules 融资安排的完整义务。
    - 现金余额、月度烧钱速度、已承诺资金、员工总数，以及从获批到上市的现金跑道。
    - 上市价格、从总额到净额的假设、支付方覆盖范围、已命名治疗点、处理能力、生产准备度和供应冗余。
    - Adrabetadex 之后的明确管线，包括所有权、开发阶段和分阶段里程碑。
