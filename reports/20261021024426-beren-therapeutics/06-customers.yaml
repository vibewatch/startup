company:
  name: Beren Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    Beren remains precommercial, so the strongest demand-side proof is patient exposure
    through clinical and expanded-access use rather than paying-customer traction. Company-issued
    data describe 76 treated individuals and a 25-patient long-duration subgroup, but named
    customers, reimbursement decisions, retention, revenue concentration, and commercial
    conversion remain undisclosed.
sections:
  - id: patient-and-stakeholder-segments
    title: Patient, user, and payer segmentation
    body: >-
      Adrabetadex addresses a narrow care pathway rather than a conventional account base.
      The end beneficiaries are people with infantile-onset Niemann-Pick disease type C and
      their caregivers; the operating users are specialist clinicians and treatment centers;
      and the eventual economic buyers would be payers or health systems if the product is
      approved. NORD estimates NPC across all onset groups at one case per 100,000-120,000 live
      births and warns that misdiagnosis and underdiagnosis make true frequency uncertain.
      Diagnosis can require specialist suspicion, biomarker testing, and genetic confirmation,
      while treatment may involve neurologists and several other specialties. That pathway
      makes referral timing, center readiness, reimbursement, and family support central to
      adoption. Public evidence does not quantify the infantile-onset subset, eligible U.S.
      patients, treating-center count, payer mix, or willingness to reimburse adrabetadex.
    claimRefs: [CU008, CU009, CU010, CU011, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: exposure-and-outcome-proof
    title: Exposure and outcome proof
    body: >-
      The most concrete adoption proxy is treatment exposure reported by Beren, not commercial
      use. An October 2026 company release described 76 individuals treated for up to 11 years,
      including 29 lower-severity participants reported at 100% five-year survival. It separately
      described 25 people treated for at least five years and two sisters followed for roughly
      a decade. These are meaningful duration signals and indicate that some families and clinical
      sites sustained an invasive treatment pathway over many years. They are not customer metrics:
      the release does not disclose unique active patients at the run date, discontinuations,
      site counts, payer approvals, paid prescriptions, or revenue. The evidence is also
      company-issued and includes small uncontrolled case reports and observational analyses,
      so it supports proof of exposure but not a commercial retention rate or causal effectiveness
      estimate.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU016]
    tableRefs: [TU002, TU003]
  - id: conversion-durability-and-risk
    title: Commercial conversion, durability, and concentration risk
    body: >-
      Beren says its 2026 financing will fund commercial readiness, patient-access infrastructure,
      and family support, showing that reimbursement and care coordination are recognized launch
      dependencies. The same materials do not disclose pricing, formulary status, contracts,
      revenue, renewal, churn, treatment-center commitments, or top-payer concentration. Market
      entry also occurs after two FDA-approved neurological treatments: oral Miplyffa with
      miglustat and oral levacetylleucine. Beren portrays adrabetadex as potentially complementary,
      but that combination evidence is company-issued and does not establish payer willingness to
      fund concurrent therapy. Regulatory timing is an additional conversion risk: Fierce Biotech
      reported a three-month review extension after the FDA treated Beren's response as a major
      amendment, and noted the earlier phase 2/3 trial failure and reliance on an external control
      comparison. Until approval, reimbursement, and paid utilization are evidenced, concentration
      and durability should be treated as unknown rather than inferred from clinical exposure.
    claimRefs: [CU005, CU006, CU007, CU010, CU011, CU012, CU013, CU014, CU015, CU016]
