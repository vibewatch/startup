  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercial-retention
      missingEvidence: Active paid patients, discontinuations, renewals, treatment persistence, contract duration, and revenue-retention metrics.
      whyItMatters: Clinical exposure cannot establish durable commercial adoption or recurring economics.
      diligencePath: Request a blinded patient-level persistence bridge, launch cohort plan, discontinuation definitions, and post-approval retention dashboard.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named treatment centers, investigators, payer decisions, reimbursed prescriptions, and referenceable family or clinician outcomes.
      whyItMatters: Anonymous clinical cases and cohorts do not prove production launch readiness or paid deployment.
      diligencePath: Request a complete U.S. center map, reference calls, expanded-access site roster, and payer evidence room.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: reimbursement-and-concentration
      missingEvidence: Launch price, gross-to-net assumptions, formulary status, distribution model, top-payer exposure, and administration reimbursement.
      whyItMatters: These inputs determine conversion, affordability, channel dependence, and concentration risk.
      diligencePath: Review pricing research, payer advisory-board minutes, draft contracts, distribution agreements, and reimbursement coding strategy.
      relatedQuestionRefs: [QU005, QU008]
    - type: access-blocked
      severity: minor
      topic: prevalence
      missingEvidence: Usable text and denominators from the prefetched U.S. prevalence study at PubMed.
      whyItMatters: The NORD estimate covers all NPC onset groups and does not size Beren's infantile-onset addressable population.
      diligencePath: Obtain the original prevalence paper through an authorized source and reconcile its U.S. assumptions to diagnosed infantile-onset cases.
      relatedQuestionRefs: [QU009]
