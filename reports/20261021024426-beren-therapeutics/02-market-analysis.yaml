      - [Multidisciplinary supportive care, Neurology and other specialist care used by affected families, Disease-modifying drug revenue, Providers families and third-party payers, Status quo and complementary care]
      - [Clinical research and expanded access, Trial and access-program activity, Paid commercial demand, Sponsors investigators and treatment sites, Evidence-generation channel not a revenue market]
    notes: >-
      Boundary is evidence-constrained: included categories describe the potential adrabetadex
      commercial pathway, while adjacent care is not counted as product TAM; payer ownership and
      reimbursement terms are not disclosed in the retained evidence.
    claimRefs: [CM003, CM004, CM005, CM006, CM012, CM014, CM016]
  - id: TM002
    title: Sizing lenses and limitations
    columns: [Evidence lens, Metric, Period and geography, Analytical use, Limitation]
    rows:
      - [All-NPC incidence, 1 in 100000-120000 live births, NORD update 2024; geography not specified, Upper-level epidemiology anchor, Not I-NPC prevalence and underdiagnosis makes true frequency uncertain]
      - [Clinical-research footprint, 43 registered studies, ClinicalTrials.gov snapshot accessed 2026-10-21, Ecosystem activity indicator, Records are not unique patients or commercial demand]
      - [Active research subset, 6 recruiting and 4 active not recruiting, ClinicalTrials.gov snapshot accessed 2026-10-21, Current research and referral signal, Status counts do not establish treatment eligibility]
      - [Approved substitute scope, Adults and children age 2 years and older for Miplyffa plus miglustat, United States approval 2024, Defines an existing treated segment, No patient count price or infantile-only split]
      - [Beren filed segment, Neurological onset before age 6, United States NDA review 2026, Narrows all NPC to Beren's target subgroup, No diagnosed patient count annual incidence or payer mix]
    notes: >-
      Values retain their original populations and dates. They are separate lenses, not additive
      TAM layers; no revenue estimate is calculated because patient-count, treatment-rate, price,
      gross-to-net, and site-capacity inputs are unavailable.
    claimRefs: [CM001, CM002, CM004, CM005, CM007, CM008, CM016]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns: [Segment, User or beneficiary, Economic decision maker, Workflow, Adoption trigger, Evidence status]
    rows:
