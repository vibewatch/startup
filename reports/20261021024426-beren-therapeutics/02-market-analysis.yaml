      - [Diagnosing clinicians, Pediatric and genetic or metabolic clinicians, Provider system or sponsor support not disclosed, Suspect test confirm and refer, Better case finding and clear referral pathway, Underdiagnosis documented; throughput unknown]
      - [Treatment specialists and sites, Neurologists and multidisciplinary care teams, Site and payer economics not disclosed, Confirm eligibility administer and monitor therapy, Local access and operational readiness, Beren plans local access; capacity unverified]
      - [Payers and access teams, Coverage reviewers and patient-support staff, Public or private third-party payer, Coverage authorization reimbursement and family navigation, Regulatory approval and value evidence, Beren plans support; coverage policy and price absent]
      - [Regulator and evidence network, FDA investigators registries and real-world-evidence participants, Sponsor and public research funding, Review approval evidence generation and post-launch learning, Accepted benefit-risk case and longitudinal evidence, Review date current; outcome and postmarket requirements unknown]
    notes: >-
      This is a partial stakeholder map based on public disease-care and company launch-readiness
      evidence. Specific U.S. payer policies, named treatment sites, capacity, referral conversion,
      and budget ownership require primary diligence.
    claimRefs: [CM002, CM009, CM010, CM012, CM014, CM016]
figures:
  - id: FM001
    title: Evidence-constrained market sizing hierarchy
    type: pyramid
    summary: >-
      The available evidence narrows from all-NPC incidence to Beren's filed infantile segment but
      stops before a defensible treated-patient or revenue estimate.
    data:
      items:
        - label: Genetic incidence baseline
          value: 1 in 100000-120000 live births
          detail: All NPC; geography not specified by NORD
        - label: Clinical population
          value: Perinatal through adult onset
          detail: Broader than Beren's filed segment
        - label: Diagnosed population
          value: Not quantified
          detail: Misdiagnosis and underdiagnosis limit prevalence certainty
        - label: U.S. treatment segment
          value: Age 2 years and older
          detail: Existing Miplyffa plus miglustat approval scope, not a patient count
        - label: Beren filed segment
          value: Neurological onset before age 6
          detail: Infantile-onset NPC definition in Beren materials
        - label: Adrabetadex revenue market
          value: Not supportable
          detail: Diagnosed patients, price, gross-to-net, persistence, and site capacity are undisclosed
    approximationNotes: >-
      This is a boundary hierarchy, not a proportional funnel. Text values preserve different
      denominators and cannot be multiplied or converted into revenue without missing patient,
      utilization, pricing, and access inputs.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM016]
callouts:
  - calloutType: risk
    title: Approval does not equal immediate market capture
    body: >-
      The three-month review extension, unquantified diagnosed I-NPC population, and undisclosed
      pricing, reimbursement, and site capacity make near-term penetration the key market risk.
    claimRefs: [CM009, CM010, CM016]
