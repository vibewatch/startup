companyProfile:
  summary: >-
    Beren Therapeutics P.B.C. is a founder-led, precommercial biotechnology company headquartered in Thousand Oaks,
    California. Its disclosed value is concentrated in adrabetadex, an intrathecal therapy under FDA Priority Review for
    infantile-onset Niemann-Pick disease type C, with a November 17, 2026 target action date. Beren announced a $300
    million financing package for launch preparation, but substantial debt and royalty capacity remains conditional and
    the company's valuation, cash, burn, headcount, and commercial economics are undisclosed.
  founders:
    - name: Jason Camm
      role: Founder and chief executive officer
      background: null
      claimRefs:
        - CO003
  foundingLocation: null
  headquarters: Thousand Oaks, California, United States
  productSummary: >-
    Adrabetadex is Beren's first publicly identified program, an investigational intrathecal cyclodextrin therapy for
    infantile-onset Niemann-Pick disease type C.
  customerFocus: Patients with infantile-onset Niemann-Pick disease type C, their families, specialist treatment centers, and payers.
  businessModel: >-
    Potential prescription-product revenue if adrabetadex is approved and launched; pricing, reimbursement, and
    recognized revenue remain undisclosed.
  stage: Precommercial; adrabetadex NDA under FDA Priority Review
  fundingStatus: >-
    $300 million combined financing announced in June 2026, comprising $135 million of equity and up to $165 million of
    senior-secured debt and royalty financing; only $30 million of the term-loan facility was drawn at announcement and
    the $55 million royalty tranche depends on FDA approval.
