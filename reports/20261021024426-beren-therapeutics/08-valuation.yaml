  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Current term sheet, post-money valuation, fully diluted cap table, liquidation
        preferences, anti-dilution provisions, debt obligations, cash, burn, and runway.
      whyItMatters: >-
        Without price and seniority economics, neither ownership-adjusted return nor
        downside loss can be calculated.
      diligencePath: >-
        Obtain the current financing documents, capitalization schedule, debt agreements,
        and management-approved cash forecast in the investor data room.
      relatedQuestionRefs: [QV004]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: >-
        Launch price, gross-to-net assumptions, eligible-patient estimate, treatment-site
        capacity, reimbursement plan, manufacturing readiness, and commercial cost base.
      whyItMatters: >-
        Approval cannot be converted into revenue, margin, or exit-value assumptions
        without a supportable launch model.
      diligencePath: >-
        Review the launch plan, payer research, pricing work, site onboarding schedule,
        manufacturing validation package, and risk-adjusted operating model.
      relatedQuestionRefs: [QV006, QV007]
    - type: access-blocked
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        Usable full text for the assigned U.S. NPC prevalence study; the prefetched
        PubMed record did not expose the study abstract or numerical findings.
      whyItMatters: >-
        A U.S.-specific prevalence estimate would improve the addressable-patient bridge
        but would still require diagnosis-rate and label assumptions.
      diligencePath: >-
        Obtain the original publication through an authorized library or the publisher
        and reconcile its denominator and methodology with NORD’s global incidence range.
