    claimRefs: [CV001, CV002, CV003, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - [Thesis, "Accepted NDA creates a near-term regulatory catalyst.", "Company timeline and independent reporting both place adrabetadex under FDA review.", "Approval with a commercially usable label would strengthen the thesis."]
      - [Thesis, "Severe progressive disease supports clinical value if benefit is confirmed.", "NORD describes NPC as progressive and potentially life-threatening, with incidence estimates subject to underdiagnosis.", "Weak reimbursement evidence or very limited eligible population would reduce value."]
      - [Anti-thesis, "Regulatory evidence is vulnerable to external-control scrutiny.", "Fierce reports a major-amendment delay and reliance on an external-control survival comparison after a failed Phase 2/3 trial.", "Robust FDA acceptance of the analysis and supportive sensitivity results would reduce this risk."]
      - [Anti-thesis, "The category already has approved alternatives.", "FDA approved Miplyffa in 2024 and NORD also identifies Aqneursa.", "Evidence of differentiated labeling, outcomes, or addressable patients would improve the competitive case."]
    notes: >-
      The table separates source-observed facts from analyst implications; approved
      products are not assumed to be clinically interchangeable with adrabetadex.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV007, CV008, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Timely approval; usable label; credible launch plan; investor-friendly financing terms.", "Positive option value, but no dollar range is supportable without ownership, price, and commercial assumptions.", "Launch execution, reimbursement, treatment capacity, and dilution.", "FDA approval plus disclosed financing and launch evidence."]
      - [Base, "Decision remains pending or approval arrives with material commercial uncertainty.", "Track; defer pricing until cash needs, preferences, market access, and eligible population are known.", "Further information requests, slow uptake, and financing overhang.", "Current major-amendment extension and incomplete public economics."]
      - [Bear, "Rejection, another material delay, weak label, or adverse financing terms.", "Downside could be severe for a single-asset private company, but loss magnitude is not quantifiable without entry terms.", "External-control rejection, competitive pressure, and capital scarcity.", "Regulatory setback or terms that subordinate new equity."]
    notes: >-
      Scenarios are qualitative because the assigned public sources disclose neither a
      Beren valuation nor the capitalization, cash, launch pricing, and margin inputs
      required for defensible ranges or target returns.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV009, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The path from clinical need to a track recommendation is constrained by regulatory
      evidence risk and missing transaction economics.
    data:
      nodes:
        - id: need
          label: Severe rare disease
          detail: "NPC is progressive and incidence estimates remain uncertain."
        - id: catalyst
          label: Accepted NDA
          detail: "Adrabetadex is under FDA review."
        - id: evidence
          label: External-control reliance
          detail: "The filing follows a failed Phase 2/3 trial and uses a survival comparison."
        - id: gate
          label: Extended FDA review
          detail: "A major amendment moved the decision date to November 17, 2026."
        - id: price
          label: No defensible entry price
          detail: "Private valuation, preferences, dilution, cash, and launch economics are undisclosed."
        - id: decision
          label: Track
          detail: "Reassess after regulatory resolution and financing disclosure."
    approximationNotes: >-
      Ordered analytical sequence, not a probability model; the FDA archive does not
      provide a pending-application success rate and no node is value-weighted.
    claimRefs: [CV004, CV008, CV010, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline dominates company quality
    body: >-
      Track Beren through the November 17, 2026 FDA decision and request full financing
      terms before underwriting. Approval alone does not establish an attractive return
      when ownership, preferences, cash needs, pricing, and launch costs are unknown.
    claimRefs: [CV002, CV014, CV016]
