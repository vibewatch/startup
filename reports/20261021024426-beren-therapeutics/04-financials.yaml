schemaVersion: "report-v2"
artifact: financials
slug: beren-therapeutics
runDate: 2026-10-21
company:
  name: Beren Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Beren remains a precommercial, single-asset biotechnology company whose near-term economics
    depend on an FDA decision now reported for November 17, 2026. Public evidence supports a
    financing history and a potentially valuable orphan-drug category, but it does not establish
    cash on hand, runway, launch price, realized revenue, gross margin, or debt terms.
sections:
  - id: revenue-status-and-quality
    title: Revenue status and quality
    body: >-
      The retained evidence does not establish current product revenue. Beren described
      adrabetadex as unapproved by any health authority in February 2026, while Fierce Biotech
      later reported that FDA moved the decision date to November 17 after classifying the
      company's response to an information request as a major amendment. That sequence makes
      approval, label breadth, launch timing, and payer access prerequisites to any commercial
      revenue rather than current recurring economics. Beren also says it has supported an
      expanded-access program, but the public record does not disclose whether that program is
      reimbursed, supplied at cost, or free. Accordingly, expanded access is evidence of operating
      activity, not proof of recognized revenue, demand, or margin.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: market-and-monetization-context
    title: Market and monetization context
    body: >-
      The addressable market is clinically important but narrow and hard to size from incidence
      alone. NORD estimates NPC at one in 100,000 to 120,000 live births and cautions that
      misdiagnosis and underdiagnosis obscure true frequency; this is not a count of diagnosed,
      label-eligible infantile-onset patients. FDA approval of Miplyffa and NORD's record of both
      Miplyffa and Aqneursa show that Beren would enter an already treated market, not a
      greenfield category. Evaluate's global orphan-drug sales outlook and Zevra's public market
      capitalization provide category and competitor context only. Neither metric is a proxy for
      Beren revenue, enterprise value, price, penetration, or cash generation.
    claimRefs: [CI005, CI006, CI007, CI011, CI012, CI013]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Public sources are insufficient to underwrite gross margin or sales efficiency. NORD notes
      that NPC care can require coordinated input from pediatric, neurologic, ophthalmic,
      pulmonary, gastrointestinal, and other specialists, indicating a complex treatment
      environment; however, the assigned evidence does not quantify Beren-specific site
      activation, administration, manufacturing, distribution, patient-support, or pharmacovigilance
      costs. The earlier phase 2/3 failure reported by Fierce Biotech also illustrates the long
      development path behind the current filing, but accounting loss and historic development
      spending are not disclosed here and must not be labeled burn. CAC, payback, gross-to-net,
      gross margin, working capital, and capex therefore remain diligence inputs rather than
      modeled outputs.
    claimRefs: [CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Capital adequacy cannot be inferred from financing headlines. Tracxn's public profile is
      internally inconsistent: one passage reports $135 million raised across two rounds, while
      another says Beren secured $165 million in June 2026. The same page identifies a conventional
      debt round but masks its amount. Funding raised is not cash on hand, and neither figure
      reveals transaction fees, deployed capital, restricted cash, debt service, or future
      milestones. Fierce Biotech reports that Mandos acquired the asset in 2021 through
      Mallinckrodt's bankruptcy process, but provides no current liquidity data. The financial
      verdict is therefore that revenue quality, margin path, and runway are unscorable from public
      evidence; approval timing and a complete capitalization-and-cash schedule are the immediate
      underwriting blockers.
    claimRefs: [CI008, CI009, CI010, CI014]
callouts:
  - calloutType: risk
    title: Financing is not liquidity
    body: >-
      Conflicting third-party funding totals and an undisclosed debt amount cannot establish cash
      available or runway. Obtain bank statements, the fully diluted capitalization table, debt
      documents, monthly cash burn, and the approval-to-launch operating plan before sizing the
      next financing need.
    claimRefs: [CI008, CI009, CI010]
tables:
  - id: TI001
    title: Revenue streams and commercialization status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Adrabetadex commercial sales
        - Prescription-product revenue if approved and launched
        - Per patient, dose, or course; not disclosed
        - FDA decision reported for November 17, 2026; no retained evidence of approval or sales
        - Contingent and currently unestablished
        - Provide label scenario, launch date, units, gross-to-net assumptions, and revenue-recognition policy
      - - Expanded access
        - Company-supported patient access before approval
        - Billing basis not disclosed
        - Beren states that it has supported an expanded-access program
        - Access activity is not evidence of revenue
        - Provide program volume, reimbursement, free-drug, and cost-accounting treatment
      - - Other marketed products
        - Product sales or licensing
        - Not established
        - No other marketed product is established by the assigned evidence
        - Unavailable; do not treat silence as proof of absence
        - Provide product and licensing schedule with recognized revenue by stream
      - - Future pipeline monetization
        - Product sales, licensing, or partnership economics
        - Not disclosed
        - Company release mentions plans to expand its pipeline without public economics
        - Speculative until assets and terms are evidenced
        - Provide named assets, ownership, milestones, royalties, and development budgets
    notes: >-
      Status reflects only the assigned public sources as of 2026-10-21; null or undisclosed fields
      are gaps, and expanded access is not classified as revenue without accounting evidence.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence versus contextual benchmarks
    columns:
      - Metric
      - Value and period
      - Denominator or unit
      - What it supports
      - What it does not support
    rows:
      - - Adrabetadex list price
        - Unavailable
        - Per vial, dose, course, or year not disclosed
        - A specific diligence request
        - No inference about realized revenue or affordability
      - - Adrabetadex realized net price
        - Unavailable
        - Gross-to-net and payer mix not disclosed
        - A specific diligence request
        - No gross-margin or revenue forecast
      - - Global orphan-drug sales outlook
        - $185 billion in 2024; about $270 billion projected for 2028
        - Global prescription orphan-drug sales
        - Category scale and growth context
        - Not Beren revenue, ARR, TAM, or market share
      - - Zevra Therapeutics market capitalization
        - $0.62 billion in October 2026
        - Public equity market capitalization
        - A dated public-competitor reference point
        - Not Beren valuation, enterprise value, or transaction benchmark
    notes: >-
      Evaluate and CompaniesMarketCap figures are third-party category and public-equity context;
      they use different denominators and must not be combined into a Beren revenue or valuation estimate.
    claimRefs: [CI011, CI012, CI013]
  - id: TI003
    title: Unit economics and capital-adequacy diligence matrix
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Cumulative funding
        - Conflicting $135 million and $165 million third-party figures
        - Low
        - Funding raised is not cash available
        - Reconcile round-by-round gross and net proceeds to the capitalization table
      - - Conventional debt
        - Existence reported; amount and terms masked
        - Low
        - Debt service and covenants can constrain launch liquidity
        - Provide principal, draw status, interest, maturity, covenants, liens, and warrants
      - - Cash on hand
        - Unavailable
        - Low
        - Starting liquidity is required to calculate runway
        - Provide current unrestricted and restricted cash with bank support
      - - Monthly cash burn
        - Unavailable
        - Low
        - Operating loss and cash burn are not interchangeable
        - Provide monthly operating, investing, and financing cash flows through 2027
      - - Runway
        - Unavailable
        - Low
        - Approval and launch obligations may create a step-up in spending
        - Provide base, delayed-approval, and launch scenarios with next-round triggers
      - - Gross margin
        - Unavailable
        - Low
        - Manufacturing and service-delivery economics determine value capture
        - Provide COGS by component, yield, royalties, logistics, administration support, and gross-to-net
      - - Patient denominator
        - NPC estimated at 1 in 100,000-120,000 live births
        - Medium for overall disease occurrence; low for Beren eligibility
        - Diagnosis, age, label, access, and site capacity narrow the revenue population
        - Provide diagnosed infantile-onset patients by geography and payer with treatment eligibility
    notes: >-
      Public values are source-reported or explicitly unavailable; no row estimates cash, burn,
      runway, margin, or label-eligible patients from funding, incidence, or category sales.
    claimRefs: [CI007, CI008, CI009, CI010, CI016]
figures:
  - id: FI001
    title: Evidence-bounded revenue model bridge
    type: flow
    summary: >-
      Six sequential gates separate broad disease occurrence from revenue and gross profit; most
      company-specific conversion and economic inputs remain undisclosed.
    data:
      nodes:
        - id: disease-occurrence
          label: Overall NPC occurrence
          detail: NORD estimates 1 in 100,000-120,000 live births, with underdiagnosis caveats.
        - id: diagnosed-label-eligible
          label: Diagnosed, label-eligible patients
          detail: Infantile-onset count and final approved label are not established.
        - id: payer-and-site-access
          label: Payer and treatment-site access
          detail: Coverage criteria, site capacity, and patient-support economics are not disclosed.
        - id: patient-starts
          label: Treated patient starts
          detail: Expanded access confirms activity but not reimbursed commercial starts.
        - id: net-revenue
          label: Recognized net revenue
          detail: List price, gross-to-net, dosing unit, and recognition policy are unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Manufacturing, logistics, royalties, and delivery-support costs are unavailable.
      edges:
        - from: disease-occurrence
          to: diagnosed-label-eligible
        - from: diagnosed-label-eligible
          to: payer-and-site-access
        - from: payer-and-site-access
          to: patient-starts
        - from: patient-starts
          to: net-revenue
        - from: net-revenue
          to: gross-profit
    approximationNotes: >-
      This is a dependency flow, not a quantitative funnel; no conversion rate, patient count,
      revenue, or gross-profit value is inferred.
    claimRefs: [CI004, CI005, CI006, CI007, CI016]
