evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: >-
      Verified founding date, complete executive and board roster, ownership percentages, governance rights, and
      succession plan.
    whyItMatters: >-
      The public profile is founder-led and single-asset, making leadership depth and governance important to execution
      and key-person risk.
    diligencePath: >-
      Request formation documents, current organization chart, board minutes and charters, management biographies, cap
      table, and succession materials.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: >-
      Current valuation, equity price and terms, revenue, customer or treated-patient count, headcount, cash balance,
      burn, and unrestricted runway.
    whyItMatters: >-
      Without these metrics, the financing package cannot be translated into enterprise value, operating scale,
      dilution, or runway.
    diligencePath: >-
      Obtain the financing term sheet, capitalization table, audited financials, bank statements, operating plan,
      payroll roster, and launch forecast.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: epidemiology
    missingEvidence: U.S. diagnosed and living infantile-onset NPC patients by age, phenotype, and treatment eligibility.
    whyItMatters: The all-NPC incidence range cannot establish adrabetadex's eligible or reachable patient population.
    diligencePath: >-
      Obtain an epidemiology study or registry extract stratified by neurological onset before age six and U.S.
      diagnosis status.
    relatedQuestionRefs:
      - QM001
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-reimbursement
    missingEvidence: Expected list price, gross-to-net deductions, payer mix, coverage criteria, and patient out-of-pocket burden.
    whyItMatters: These inputs determine revenue per treated patient, access friction, and any credible revenue TAM.
    diligencePath: Review Beren's launch pricing dossier, payer research, draft coverage policies, and gross-to-net model.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: treatment-site-capacity
    missingEvidence: >-
      Named launch sites, annual patient throughput, administration burden, staffing, geographic coverage, and time to
      activation.
    whyItMatters: >-
      A very small patient population can still face material bottlenecks if specialist administration capacity is
      scarce.
    diligencePath: >-
      Obtain the site-launch roster and interview treating centers on activation timing and sustainable annual
      throughput.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: clinical-research
    missingEvidence: >-
      Deduplicated study participants and records stratified to U.S. infantile-onset NPC and current treatment
      eligibility.
    whyItMatters: Registry record counts demonstrate research activity but cannot proxy for unique patients or commercial demand.
    diligencePath: Export the 43 study records and deduplicate cohorts, sponsors, age criteria, geographies, and enrollment periods.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-comparison
    missingEvidence: >-
      Comparable list and realized prices, payer coverage, rebates, treated-patient counts, market shares, launch
      staffing, administration-site capacity, and competitor funding are not disclosed in the retained evidence.
    whyItMatters: >-
      Without these inputs, commercial switching cost, access advantage, and relative launch readiness cannot be
      quantified.
    diligencePath: >-
      Request Beren's launch plan and payer research, then obtain specialty-pharmacy, claims, formulary, and
      treatment-center evidence for approved alternatives.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: access-blocked
    severity: minor
    topic: NPC-prevalence
    missingEvidence: >-
      The assigned PubMed prevalence URL returned only a vulnerability-disclosure page, so its study methods,
      denominator, and estimate could not be verified.
    whyItMatters: >-
      A verified US prevalence denominator would improve assessment of competitive saturation and patient-finding
      headroom.
    diligencePath: >-
      Obtain the original article or another successful assigned source in a future evidence refresh before using any
      prevalence quantity.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Adrabetadex list and realized pricing, dosing economics, payer mix, gross-to-net, manufacturing COGS, royalties,
      delivery support, working capital, capex, and gross margin.
    whyItMatters: >-
      Without these inputs, revenue quality, contribution margin, patient-level economics, and the approval-to-launch
      financing requirement cannot be underwritten.
    diligencePath: >-
      Obtain the launch model, payer research, supply agreements, COGS build, accounting policy, and downside cases
      reconciled to management's operating budget.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Reconciled gross and net financing proceeds, current unrestricted cash, monthly cash burn, debt principal and
      terms, launch obligations, and next-round trigger.
    whyItMatters: >-
      Conflicting funding totals and a masked debt amount cannot establish liquidity, runway, dilution, covenant risk,
      or the ability to fund launch after a delayed decision.
    diligencePath: >-
      Review the capitalization table, financing and debt documents, bank statements, audited cash-flow history, monthly
      forecast, and approval-delay sensitivity.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: disease-frequency
    missingEvidence: >-
      The prefetched PubMed prevalence record returned only an HHS vulnerability-disclosure page, so its study methods,
      period, geography, and prevalence estimate could not be reviewed.
    whyItMatters: >-
      The NORD occurrence estimate is useful context but does not replace a reviewed U.S. prevalence study or establish
      Beren's diagnosed and label-eligible patient population.
    diligencePath: >-
      Obtain the original journal article or a usable archival copy and verify its cohort, denominator, date, and
      applicability before using it in market or revenue modeling.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
