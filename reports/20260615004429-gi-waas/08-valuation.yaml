- id: recommendation-exit-readiness-and-thesis-breaks
  title: Recommendation, exit readiness, and final diligence asks
  body: The clean recommendation is track / research-more, with medium confidence, high risk, and a stretched valuation stance. The reason is not that GI lacks promise; it is that the available evidence supports category demand, technology ambition, and some deployment proof much more clearly than it supports investor pricing. On current facts, the company does not look ready for near-term public-market scrutiny. Even a local disclosed water operator such as Miahona publishes far more operational framing than GI currently does, and every U.S. comparable in the reference set also has an active 10-K trail. That does not eliminate the possibility of a strong private round or strategic financing; it simply means the next diligence step has to focus on signed economics rather than storytelling. The key questions are whether GI’s recurring contracted volume is real, whether margins and cash conversion are attractive enough for a premium multiple, and whether round terms leave late investors exposed
    to preference or dilution overhang. Until that package is visible, the unicorn headline should be tracked as a claim to verify, not a price to accept.
