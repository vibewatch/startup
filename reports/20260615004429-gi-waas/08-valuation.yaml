- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - Key assumptions
  - Main failure mode
  rows:
  - - Bear
    - 25%
    - $0.2B-$0.4B
    - The reported unicorn round proves sponsor interest but not strong economics; recurring contracted volume is limited and investor protections are heavy.
    - Diligence reveals thin revenue quality, heavy preferences, or showcase-heavy commercialization.
  - - Base
    - 55%
    - $0.4B-$0.8B
    - GI has real deployments, real policy tailwinds, and strategic value, but public evidence still cannot justify paying the full headline mark.
    - Margins, cash conversion, or backlog quality fail to support premium private-market underwriting.
  - - Bull
    - 20%
    - $0.8B-$1.2B
    - Private diligence confirms real recurring volumes, strong reuse economics, scalable deployment, and clean round terms.
    - Commercial proof remains anecdotal or capital intensity overwhelms service margins.
  - - Probability-weighted central view
    - 100%
    - approx. $0.5B-$0.7B
    - Weighted to the base because market demand looks real while GI-specific economics remain undisclosed.
    - Overpaying near the headline mark before diligence closes the gaps leaves little margin of safety.
  notes: These are deliberately broad scenario bands designed to preserve uncertainty. They are not a precise mark-to-model output.
