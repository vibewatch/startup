- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak round-document evidence
    - Signed documents show punitive preferences, unusual dilution, or effective flat/down economics versus the headline story.
    - The unicorn mark stops being a quality signal and becomes a warning about late-entry risk.
    - Rebase to the bear case or walk away.
  - - Revenue-quality miss
    - Recurring billed volumes, margin, or collections quality are much weaker than the service narrative implies.
    - The company starts to look like a low-visibility project developer instead of a premium recurring platform.
    - Do not pay strategic-premium pricing.
  - - Showcase-to-contract gap
    - Aramco, PIF, export, and deployment stories do not convert into contracted backlog.
    - Commercial proof remains anecdotal and valuation support collapses.
    - Keep to track / research-more or avoid.
  - - Disclosure hygiene remains weak
    - Website contamination, inconsistent project facts, or management unwillingness to share primary documents persists.
    - Confidence in governance and reporting quality falls further.
    - Require hard governance rights or disengage.
  - - Saudi cost-recovery or PPP economics worsen
    - Tariff pressure, procurement slippage, or return compression reduces project attractiveness.
    - Even a good technology stack may not earn premium equity outcomes.
    - Cut bull-case weighting and reassess the framework.
  notes: Each trigger is monitorable and tied to whether the current base case should survive the next diligence cycle.
  claimRefs:
