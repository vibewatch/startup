  evidenceGaps:
  - type: missing-source
    severity: material
    topic: round-documents
    missingEvidence: Signed Series A term sheet, cap table, board rights, liquidation preference, anti-dilution terms, and exact post-money.
    whyItMatters: Without the legal round package, the reported unicorn mark cannot be translated into investor economics or downside protection.
    diligencePath: Obtain executed financing documents from the company and confirm investor-side copies with Al Zamil and Al Qunaibet.
    relatedQuestionRefs:
    - QV021
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: financial-proof
    missingEvidence: Current revenue, volume billed, gross margin, contribution margin, cash burn, and runway by business line.
    whyItMatters: These are the minimum inputs required to judge whether GI deserves an infrastructure-style, industrial-tech, or premium strategic valuation framework.
    diligencePath: Request a monthly revenue bridge, project-level P&Ls, and board reporting pack for 2025-2026.
    relatedQuestionRefs:
    - QV011
    - QV029
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: contracted-backlog
    missingEvidence: Signed customer contracts, recurring minimum-volume commitments, backlog, and pipeline conversion metrics beyond showcase deployments.
    whyItMatters: The public case proves technical activity, but not yet the contracted recurring cash flows needed to defend the headline valuation.
    diligencePath: Request customer contracts, backlog schedule, and pipeline stage definitions with conversion history.
    relatedQuestionRefs:
    - QV010
    - QV030
  - type: conflicting-data
    severity: minor
    topic: factory-scale-precision
    missingEvidence: Reconciled factory site size, capex, and export ramp documents for the Al Kharj platform.
    whyItMatters: Factory-scale ambiguity does not break the thesis alone, but it weakens confidence in headline commercialization precision.
    diligencePath: Request the Modon allocation letter, buildout plan, and latest capex schedule for the export platform.
    relatedQuestionRefs:
    - QV009
