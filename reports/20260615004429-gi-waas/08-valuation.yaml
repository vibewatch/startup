tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more; do not underwrite the headline unicorn mark as a clean buy today.
    - Wait for verified economics or materially better terms before paying for upside.
  - - Valuation stance
    - Stretched on current public evidence; only supportable in the bull case.
    - Treat >$1B as a reported headline, not as a diligence-cleared price.
  - - Confidence
    - Medium.
    - There is enough evidence to be skeptical, but not enough to produce a precise mark.
  - - Risk rating
    - High.
    - Missing economics, website QA issues, and unknown preference stack create asymmetric downside.
  - - Best supportable framing
    - Capital-intensive water-services / industrial-water platform, not software.
    - Use scenario ranges and structure protections rather than a single target multiple.
  - - Entry discipline
    - Either invest at a material discount to the reported unicorn mark or require senior protections and milestone tranching.
    - Do not accept price-only exposure at headline terms.
  - - Likely exit path
    - Another private or strategic financing looks more plausible than a near-term IPO.
    - Underwrite to a private-market continuation, not immediate public-market readiness.
  - - Upgrade trigger
    - Signed data-room evidence of recurring contracted volume, margins, and clean round terms.
    - Would make a price closer to the headline mark easier to defend.
  - - Primary downside trigger
    - Evidence that the round terms were weak, preferences are heavy, or recurring economics are thin.
    - Would push the case toward the bear range and potentially to avoid.
  notes: The recommendation is explicitly evidence-sensitive and price-sensitive; it is not a statement that GI lacks real technology or market opportunity.
