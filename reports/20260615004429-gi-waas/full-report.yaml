              early 2026 plus factory-scale ambitions in Al-Kharj, although public figures conflict on the exact site
              footprint. The same public packet also reveals adverse signals. Aramco and PIF-related pages describe
              meetings and solution showcases rather than booked contracts, and the official site still contains
              pest-control copy, bug-extermination testimonials, and unrelated album pages. For a self-described water
              unicorn, that mix of bold scale claims and weak disclosure hygiene should be treated as a real diligence
              risk rather than a cosmetic issue.
