      - number: '2.5'
        title: Diligence gaps and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The central underwriting conclusion is not that Saudi and MENA water demand are small; it is that GI WaaS
              still needs a narrower contract-level lens than public sources can provide. The strongest public evidence
              proves that state-backed PPP procurement, TSE expansion, industrial concessions, and O&M are active
              categories. What it does not prove is a GI WaaS-specific SAM or SOM broken down by buyer, utilization,
              tariff, churn, or margin. That gap matters because a narrow recurring-revenue model can look very
              different from a plant-development or EPC model even inside the same sector. Investors should therefore
              underwrite GI WaaS from the bottom up: target segment by segment, anchor on counterparties and contract
              structures, and treat broad market reports as context rather than as investable revenue forecasts.
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
