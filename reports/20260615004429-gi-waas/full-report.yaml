      - number: '3.3'
        title: Incumbents and substitutes bring distribution, procurement trust, and lock-in power
        blocks:
          - type: paragraph
            body: >-
              The most structurally dangerous rivals for GI may be the ones that do not market themselves as startup
              WaaS peers at all. Metito openly describes itself as a PPP and long-term concession specialist using BOT,
              BOO, BOOT, and TOT structures across emerging markets. ACWA's Ras Mohaisen project shows what that buying
              motion looks like in practice: a 25-year water purchase agreement, reverse-osmosis capacity of 300,000
              m3/day, and a state procurement machine that drew interest from 44 companies before narrowing to 13
              qualified bidders. SWPC's broader prequalification program and 70-company shortlist make the point even
              more strongly. In GI's home market, outsourced water is not a blank greenfield; it is a crowded,
              institutionally mediated procurement arena that favors bidders with financing depth, consortium-building
              capacity, and patience for long tender cycles.


              Veolia and Xylem add another kind of pressure. Veolia reported €44.4 billion of 2025 revenue and singled
              out Water Technologies as a growth engine, while Xylem publicly highlights more than 23,000 colleagues,
              operations in roughly 150 countries, and full annual-report disclosure. Even when those companies do not
              use the same WaaS branding, they offer buyers something GI still cannot show publicly at the same depth:
              proven scale, reporting transparency, and broad service capacity. The substitute path is also credible.
              Jacobs and AECOM both market full-water-cycle delivery including reuse and desalination, which means many
              buyers can still choose an engineer-led or owner-operated path rather than a long-term outsourced
              platform. That substitute pressure keeps GI from pricing like a monopoly and increases the importance of
              proving lower lifecycle cost or faster deployment.
