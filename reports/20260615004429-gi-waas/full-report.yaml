      - number: '1.3'
        title: Funding claims, investor map, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              GI WaaS is widely described as having crossed the unicorn threshold after an early-2025 Series A round,
              with Enterprise AM citing a $1.03 billion valuation and an eight-figure cash investment for 5.8% equity,
              while other outlets repeat the broader claim of a valuation above $1 billion. The named backers are
              consistent across coverage: Al Zamil and Alqunaibet. What is not consistent or independently verifiable is
              the depth of primary evidence. No investor-authored announcement, public cap table, or regulatory filing
              surfaced in the reviewed source pack. That weakness is amplified by the company's thin operating
              disclosure: public materials emphasize valuation, technology, and project examples, but do not publish GI
              WaaS revenue, ARR, customer count, or standalone headcount. The investor map therefore matters less as a
              proof of capitalization than as a map of who to diligence directly if this report is to move beyond
              company-curated narratives.
