      - number: '3.2'
        title: Direct WaaS competitors win on commercial simplicity; industrial challengers win on process depth
        blocks:
          - type: paragraph
            body: >-
              Seven Seas is the clearest direct public comparator in this source pack. Its official WaaS materials are
              unusually explicit: customers invest no upfront capital, receive guaranteed price or volume terms, and can
              use BOO or BOOT structures while Seven Seas handles design, upgrades, operations, compliance, and repairs.
              Ekopak offers a narrower but still meaningful version of the same logic for industrial customers, claiming
              customers pay only for liters consumed and citing a first major French WaaS project as proof that
              usage-based water contracts are not unique to GI. Those two companies matter because they validate that GI
              is not inventing the service model; they also weaken any moat based solely on saying water can be sold as
              a managed service instead of as equipment.


              Gradiant is different. Its overlap with GI comes less from financing language and more from the claim that
              it can solve difficult industrial water problems end-to-end across reuse, ZLD, PFAS, UPW, and AI-enabled
              optimization. For buyers in semiconductors, chemicals, mining, or advanced manufacturing, that technical
              breadth can matter more than the exact billing model. In other words, Seven Seas is the sharper commercial
              comparator, while Gradiant is the sharper capability comparator. GI's public materials make a strong case
              for decentralized nanotech-enabled reuse, but the retained evidence does not yet show the same breadth of
              disclosed reference verticals, contract structures, or industrial operating history that Seven Seas and
              Gradiant have put into the public domain.
