      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is concentrated rather than diffuse. In public water production, transmission, storage, and
              sewage projects, the payer is usually a sovereign-backed entity such as SWPC or a state utility, and the
              user is the system operator rather than the household receiving the water. That centralization is
              important because it makes the market bankable but also concentrates go-to-market risk around a small set
              of institutional counterparties. Private demand is visible, but mostly through industrial and quasi-public
              sites rather than a broad SMB base. Miahona’s public project list shows industrial city concessions, a
              refinery-linked industrial wastewater plant at Ras Tanura, airport desalination, economic-city sewage
              treatment, and municipal O&M. Reuse and TSE are especially relevant because they target industrial and
              irrigation use cases where freshwater substitution has clear economic logic. Managed O&M, NRW reduction,
              and meter-to-cash also look closer to recurring service revenue than one-off plant construction.
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
