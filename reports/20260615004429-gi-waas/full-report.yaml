  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape segmentation: direct WaaS peers, industrial adjacencies, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to read GI WaaS's battlefield is to separate the market into four layers. First are
              direct Water-as-a-Service peers that explicitly sell usage-based or no-upfront-capital water
              infrastructure: Seven Seas Water Group and Ekopak are the strongest retained comparators because both
              publicly describe customers paying only for water consumed while the vendor carries design, operating, and
              maintenance responsibility. Second are industrial advanced-treatment challengers such as Gradiant, which
              is not framed around the same financing story but overlaps wherever buyers want high-performance reuse,
              ZLD, PFAS, UPW, or AI-enabled process optimization. Third are project-finance and desalination incumbents
              such as Metito and the ACWA/SWPC ecosystem, where the buying motion revolves around consortia,
              prequalification, long-term water purchase agreements, and bankable BOO or BOOT structures. Fourth are
              substitutes: owners can still keep control through EPC and internal-build paths via firms such as Jacobs
              or AECOM, or bolt on digital optimization from Pani instead of outsourcing the full asset.


              That segmentation matters because GI is not trying to beat every rival on the same axis. Its public
              materials emphasize decentralized wastewater reuse, nanotechnology, and pay-per-cubic-meter billing. The
              hardest practical competition therefore depends on customer archetype: Seven Seas and Ekopak are the most
              direct comparators on commercial model, Gradiant is the toughest industrial capability overlap, Metito and
              ACWA are strongest where procurement and financing govern the award, and Jacobs, AECOM, and Pani preserve
              the status quo by letting buyers keep more control. The profile table and positioning map below show that
              the real threat is not one company but many alternative ways to avoid betting on a young platform.
