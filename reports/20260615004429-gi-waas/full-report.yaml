      - number: '1.2'
        title: Leadership visibility and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is concentrated around Dr. Sherif Desouky. Enterprise AM quotes him as GI Aqua Tech
              CEO, Arab News quotes him on export and factory plans, and conference biographies position him as
              President of GI Aqua Tech and Executive Chairman or founding partner of GP Holding. The German registry
              also identifies named management for GI Aqua Tech GmbH, including Ibrahim Serifoglu and Yacine Tej. Beyond
              that, transparency drops off sharply. Reviewed public materials do not surface a GI WaaS board, a Saudi
              management roster, or a documented ownership chain linking the German legal entity to the Saudi operating
              company. This creates obvious key-person dependency and a governance diligence burden: the market can
              identify who tells the story, but not who formally controls the Saudi business, who sits on its board, or
              what investor rights accompany the reported unicorn valuation.
