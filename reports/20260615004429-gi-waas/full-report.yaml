  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing signal and why the headline unicorn mark is weakly supported
        blocks:
          - type: paragraph
            body: >-
              GI has a real financing headline but a thin public support package. Multiple public sources repeat that GI
              WaaS crossed the $1 billion threshold after its Series A, and Enterprise AM goes further by citing a
              roughly $1.03 billion valuation plus an eight-figure investment for 5.8% equity from Al Zamil and Al
              Qunaibet. That is enough to treat a unicorn mark as a reported market signal, not enough to treat it as a
              fully diligence-ready price. The same source pack that celebrates the round does not disclose revenue,
              gross margin, cash burn, or contracted recurring volume. Even the strongest commercialization proof still
              comes from project pages and interviews: Riyadh industrial reuse, the Hajj slaughterhouse treatment case,
              the Jeddah neighborhood plant, the ARASCO site, and a France export plan. Those datapoints support
              existence, technical activity, and some commercial motion. They do not yet prove the scale, repeatability,
              or investor economics required to carry a premium private valuation with confidence. The
              website-contamination evidence also matters here: if the official domain still hosts pest-control
              testimonials, investors should assume disclosure QA remains a real diligence risk, not a cosmetic issue.
            claimRefs:
