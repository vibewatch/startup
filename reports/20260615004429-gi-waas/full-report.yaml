        title: Exhibits
        blocks:
          - type: callout
            title: Headline water spend overstates GI WaaS
            body: >-
              Saudi water demand and PPP activity are large, but monetizable GI WaaS revenue is concentrated in a
              narrower set of sovereign-backed, utility, and industrial contracts.
            calloutType: risk
