      - number: '8.3'
        title: Bull, base, and bear framing with explicit entry discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: GI already has public deployment references, a service model aligned
              with Saudi reuse priorities, export evidence, and a category story that benefits from heavy sovereign
              water spending. If those deployments are backed by real contracted recurring volumes, attractive reuse
              economics, and a clean preference stack, then the reported unicorn mark may turn out to have been early
              rather than inflated. The anti-thesis is stronger on current public evidence. GI still looks more like an
              emerging project developer with promising water technology than a transparently disclosed platform
              business. Comparable public equities are valued on disclosed revenue and filings; Saudi PPP economics are
              attractive but banked on structured offtake and infrastructure-like returns. That gap is why scenario
              ranges should stay broad. A bear case around $0.2B-$0.4B fits a weakly documented narrative round with
              limited contractual proof. A base case around $0.4B-$0.8B fits real traction but missing economics. A bull
              case around $0.8B-$1.2B requires the private data room to validate both scale and quality. Entry
              discipline should therefore be ruthless: either buy far below the headline mark, or demand hard
              structuring protections if access only exists near it.
            claimRefs:
