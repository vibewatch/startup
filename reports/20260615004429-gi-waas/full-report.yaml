            body: >-
              GI has real public deployment proof, and that is the strongest part of the chapter. The Jeddah El Musa
              page provides a decentralized urban case tied to a Saudi Water Authority context, irrigation-quality
              reuse, and a monitoring framework; Riyadh Industrial City provides a larger underground industrial case
