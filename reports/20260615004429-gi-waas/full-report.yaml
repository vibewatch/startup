            title: Disclosure risk is the first thesis-breaker, not a side issue
            body: >-
              GI may prove to be a strong Saudi wastewater business, but the public evidence pack still behaves like a
              marketing deck rather than like investor-grade infrastructure disclosure. That matters because the next
              financing event will likely be judged not only on growth ambition but on whether revenue quality,
              structure, and operating reliability can finally be reconciled. Until then, governance risk should be
              treated as a core underwriting variable.
