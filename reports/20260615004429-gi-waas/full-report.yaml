      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The investable positive case is straightforward: GI has a credible problem statement, a service-oriented
              pricing concept, visible project proof, and supportive Saudi-sector momentum around reuse, tariffs, and
              PPP-backed water infrastructure. The most important public proof points are not just the unicorn
              valuation, but the named ARASCO and Riyadh projects plus the announced France export, because they show
              customers are willing to test GI in real operating environments.


              The negative case is that almost every underwriting-critical metric is absent. There is no public revenue,
              ARR, gross margin, cash runway, debt schedule, recurring contract count, or customer concentration
              disclosure. The France export item also complicates the story by implying some mixture of service
              economics and project-delivery economics. That means public investors should not model GI as a software
              business and should not assume that pay-per-m3 automatically means high-quality recurring revenue. The
              correct frame is a capital-intensive infra-service company whose margin path depends on deployment
              utilization, contract structure, and financing cost. Diligence should therefore focus first on revenue
              recognition, realized price per m3, asset ownership by contract, cohort renewals, and the funding stack
              behind each major deployment. Until those data are provided, the right financial verdict is promising
              demand-side positioning paired with high disclosure risk and high financing dependency.
