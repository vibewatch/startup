      - number: '8.2'
        title: Public comparables and Saudi project-finance anchors point to infrastructure-style underwriting
        blocks:
          - type: paragraph
            body: >-
              The best external anchors here are not generic software comps but disclosed water, environmental-services,
              and infrastructure operators plus the Saudi PPP framework that funds large water assets. On policy, the
              Saudi setup is supportive: the U.S. trade guide highlights sustained sector demand and privatization
              momentum, while SWA and SWPC materials describe a sovereign-backed offtaker model. World Construction
              Network and Utility Business MENA go further, describing guaranteed offtake, standardized contracts, and
              expected private returns in the 7%-10% range. That is valuable because it makes projects bankable; it is
              also cautionary because it points toward infrastructure economics, not hyper-growth software valuation
              logic. The public comparable set tells a similar story. June 2026 market-cap-to-revenue ratios cluster at
              roughly 1.4x for Tetra Tech, 2.8x-2.9x for Mueller Water Products and Xylem, and 4.3x-4.6x for Badger
              Meter and Ecolab. Those are large, disclosed, filing-backed operators. GI may deserve a strategic premium
              for growth and novelty, but without disclosed revenue the burden of proof still sits with the company, not
              with the investor.
