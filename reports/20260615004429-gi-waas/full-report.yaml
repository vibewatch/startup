      - number: '6.4'
        title: Expansion path, channel dependence, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The upside case is that GI appears to have found several decentralized niches where speed, compact
              footprint, odor-free operation, and reuse economics matter more than megaproject scale. ARASCO, Jeddah El
              Mousa, Samhan Hotel, and the Hajj sites all point to customers or sponsors that care about difficult
              wastewater streams, constrained sites, or urgent deployment. That is an attractive expansion wedge because
              it plays to modular deployment rather than to the giant PPP balance sheets that dominate Saudi
              desalination and heavy industrial reuse. ARASCO’s sustainability posture also suggests GI can sell into
              buyers with explicit water-efficiency mandates, while the French cosmetics deal hints that technically
              demanding industrial niches may travel internationally.


              The caution is that the visible proof set is still small and heavily Saudi-centric. Trade.gov, Smart
              Water, Sharakat, Metito, Veolia, Miahona, and Zawya all describe a market where larger wastewater buyers
              often procure through long-tenor PPP or concession structures with local-content, licensing, and
              tender-readiness requirements. That means GI may need partners, channels, or selective niche positioning
              rather than a pure direct-sales motion as account size rises. Bahrain already looks partner-led through
              Tahliya, while NetZero and Aramco are relationship signals rather than closed contracts. The public
              evidence therefore supports real adoption and plausible expansion, but it also supports explicit caution
              on channel dependence, flagship-site concentration, and the risk that a few showcase projects overstate
              customer diversification.
            claimRefs:
              - CU032
              - CU033
