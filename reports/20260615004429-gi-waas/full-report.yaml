      - number: '2.2'
        title: Multiple sizing lenses instead of one TAM
        blocks:
          - type: paragraph
            body: >-
              Public sizing for Saudi water services is real but not harmonized. Official sources describe a system
              already operating at national scale, while commercial trackers describe different submarkets with
              different boundaries. SWA says the water system already exceeds 16.14 million cubic meters per day of
              production capacity and more than 7.81 million cubic meters per day of licensed wastewater-treatment
              capacity. Trade.gov frames the policy objective around 90 percent desalination reliance by 2030 and cites
              an $80 billion project push, while Arab News places MENA-wide desalination investment on a path from $39.3
              billion in 2022 to $100 billion by 2030. Commercial publishers then layer on narrower slices: 6Wresearch
              estimates a $4.0 billion Saudi water-treatment market in 2026, while Ken Research values desalination
              technology and services at $6 billion on a 2024 base-year lens. Those figures are useful as lenses, not as
              a clean TAM/SAM/SOM stack, because they measure different scopes and time horizons.
