chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              GI WaaS presents itself as a Saudi water-infrastructure startup using a water-as-a-service model, but the
              public evidence base centers on GI Aqua Tech's corporate website and event materials rather than on a
              standalone GI WaaS disclosure package. Third-party coverage consistently describes GI WaaS as affiliated
              with or a subsidiary of Germany's GI Aqua Tech, while the official contact page shows both a Riyadh office
              and a German head office in Groß-Gerau. That split footprint matters because the visible corporate history
              is layered: GI Aqua Tech's own company page says the business was established in 2016, yet the currently
              visible German GmbH registry entry dates from late 2021. The one-line model is clearer than the legal
              structure: GI WaaS markets decentralized wastewater treatment on a pay-per-cubic-meter or zero-CAPEX
              basis, with GI Aqua Tech deploying and operating the units for clients across municipal, industrial,
              hospitality, and event-driven use cases. The review therefore treats GI WaaS as a real operating platform
              with visible Saudi activity, but not yet as a transparently documented standalone corporate issuer.
