      - number: '5.2'
        title: Process and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The most specific public technical disclosure is the G-NANO process narrative. GI’s technology page breaks
              the process into pH conditioning, oxidation, a positively charged capture stage, flocculation, sludge
              separation, and sludge-volume minimization, while the companion blog reiterates a non-biological treatment
              logic that converts contaminants into compact reusable sludge. Those steps are still marketing-level
              descriptions rather than a full engineering datasheet, but they are specific enough to establish that GI
              is selling a chemical-physical treatment architecture, not an activated-sludge software overlay. The
              packaging architecture around that core is also reasonably clear: G-NANO can be wrapped into containerized
              units, mobile units, underground industrial plants, and bolt-on capacity modules. Public claims of
              integrated sensors, predictive alarms, built-in water testing, and quality frameworks suggest some
              instrumentation layer exists, but GI does not publish network architecture, SCADA interfaces, historian
              integrations, or API documentation. For diligence, that means the process core is better described than
              the digital integration layer.
