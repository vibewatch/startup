  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              GI WaaS should not be benchmarked against all water or infrastructure spending in Saudi Arabia. The
              investable market is the subset of water activity where an operator is paid for delivered treatment,
              reuse, reliability, or network performance under concession, BOOT, PPP, or managed O&M structures. That
              includes desalinated bulk-water offtake, treated-sewage-effluent reuse, industrial wastewater treatment,
              transmission or storage assets contracted on a service basis, and recurring O&M or non-revenue-water
              programs. It excludes consumer bottled water, household point-of-use devices, generic EPC revenue without
              a service relationship, and broad agricultural water consumption that never becomes a contracted service
              line. The substitute set is important because buyers can still rely on groundwater, self-owned plants,
              municipal supply, trucking, or defer reuse through cheaper efficiency fixes. That is why the relevant
              market is a service-governed reliability and compliance budget, not the whole national water balance.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
