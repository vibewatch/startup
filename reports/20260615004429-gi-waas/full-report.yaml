      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public GTM evidence is project-led and consultative. GI names industrial and semi-industrial deployments
              such as ARASCO in Al Kharj and Riyadh Industrial City, and the export story adds a cosmetics-manufacturing
              use case in France plus future GCC expansion. Those are not the footprints of a low-touch subscription
              motion; they look more like technical enterprise sales where engineering fit, compliance, site
              customization, and reuse economics drive the buying process. Sector comparators reinforce that
              interpretation: Seven Seas, Metito, and Miahona all describe water-service contracts as combinations of
              design, operations, compliance, metering, and concession management, which are won through structured
              procurement or complex business development rather than short online sales cycles.


              The sales-efficiency problem is therefore not whether the motion exists; it is that the public record
              gives no hard productivity metrics. There is no disclosed CAC, payback, ACV distribution, logo count,
              renewal rate, or average procurement cycle length. Named projects and a prominent funding round imply
              demand generation is real, but they do not show whether GI can convert pilot-style wins into repeatable
              margins. For this chapter, the right stance is to treat enterprise traction as credible but sales
              efficiency as opaque. Until management provides signed-contract summaries, cohort renewals, and booked
              revenue by deployment type, capital deployment pace may outrun evidence of repeatable sales economics.
            claimRefs:
              - CI005
