      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The public capital story is headline-rich but underwriting-poor. Independent coverage confirms that GI
              closed a Series A in 2025 with Al Zamil Industrial, Trade & Transport Company, and Al Qunaibet Investment
              Fund and crossed the $1 billion valuation threshold. The stated use of funds is expansion across Saudi
              Arabia plus continued solution development. That is enough to show investor appetite and strategic
              backing, but it is not enough to judge solvency. No reviewed source discloses cash on hand, monthly burn,
              runway, debt facilities, project-level guarantees, customer prepayments, or whether the company uses
              off-balance-sheet structures to fund deployments.


              The broader Saudi context offers both tailwind and warning. Tariff reform, centralized SWA regulation, and
              a deep PPP pipeline make private participation more viable over time. SWPC and legal-market sources
              portray long-term, bankable contracts and significant private investment across desalination, wastewater,
              and transmission. But the same context also shows why financing dependency matters: tariffs move under
              regulatory oversight, cost pass-through is politically sensitive, and large projects often rely on
              concession structures with long payback periods. GI therefore appears directionally well-positioned in a
              market that wants more private water infrastructure, yet impossible to capitalize confidently from public
              evidence alone. Without visibility on cash, debt, or project obligations, the correct conclusion is not
              “undercapitalized” but “unverifiable and likely financing-dependent.”
