      - number: '7.3'
        title: Operational, capital-intensity, and technology-validation risk
        blocks:
          - type: paragraph
            body: >-
              GI’s product story is directionally attractive, but the operating burden looks much closer to industrial
              infrastructure than to light software deployment. The broader water sector is openly grappling with large
              capital needs, slower delivery cycles, staffing constraints, and tougher regulatory timelines. Comparable
              WaaS narratives reinforce the same lesson: even when customer demand is real, the provider still has to
              finance assets, manage permitting, maintain reliability over long periods, and absorb working-capital
              stress before recurring cash flow is proven. Bluefield’s Ekopak note is especially relevant because it
              shows how a reuse company can run into liquidity pressure and disclosure scrutiny while a flagship project
              is still proving itself. GI’s own public pack does not provide uptime, SLA, failure-rate, or independent
              validation data that would neutralize those concerns. The France export and planned Gulf expansion are
              positive commercial signals, but they also widen the execution envelope before the company has publicly
              demonstrated a broad installed base with repeatability and operating statistics.
