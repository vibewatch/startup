  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Series A legal package
        - Executed term sheet, cap table, board rights, liquidation preference, anti-dilution, and exact post-money.
        - Transforms the headline valuation into actual investor economics.
        - Collect company copies and confirm against investor-side versions.
      - - Revenue and margin bridge
        - Monthly revenue, volume billed, gross margin, contribution margin, and cash conversion by deployment type.
        - Determines whether GI deserves infrastructure, industrial-tech, or premium strategic valuation treatment.
        - Review management accounts, board pack, and project-level P&Ls.
      - - Backlog and contracted volume
        - Signed customer contracts, minimum-volume commitments, backlog, and pipeline conversion history.
        - Separates real recurring economics from showcase-driven storytelling.
        - Request contract schedule and CRM-to-revenue conversion data.
      - - Factory and export economics
        - Capex schedule, utilization plan, export orders, and manufacturing margin assumptions.
        - Validates whether the export/factory story materially changes valuation support.
        - Review Modon documents, plant budget, and signed export purchase orders.
      - - Governance and reporting
        - Board composition, investor consent rights, audit process, and internal KPI reporting cadence.
        - Explains whether current disclosure weaknesses are growing pains or structural governance issues.
        - Interview management and inspect governance package.
      - - Exit path evidence
        - Potential strategic buyers, likely next-round investors, and IPO-readiness gap assessment.
        - Defines whether the underwriting horizon is a continuation financing, trade sale, or long hold.
        - Build a buyer / sponsor map and compare GI’s readiness with listed disclosure norms.
    notes: >-
      These asks are intentionally concrete because the public evidence is too thin to support firm underwriting on its
      own.
