  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              GI’s public product is best understood as an on-site wastewater treatment service built around modular
              plants rather than as a pure software platform or a one-off EPC plant sale. The recurring customer job is
              to take a hard wastewater stream—urban district sewage, industrial effluent, slaughterhouse waste, or
              concrete-plant washwater—treat it on site, and then reuse or safely discharge the water without forcing
              the customer to build a conventional permanent plant first. The portable, mobile, scalable, and
              new-generation product pages create a coherent delivery map: temporary or remote needs get containerized
              or vehicle-mobile units; overloaded installed plants get brownfield upgrade modules; and larger municipal
              or industrial users get compact higher-capacity plants. Independent IFAT and Aquatech materials partially
              corroborate that framing by describing zero-CAPEX WaaS positioning, sector breadth, and distinct mobile
              versus portable capacity ranges. What remains asserted rather than verified is the exact contract
              structure behind each workflow—public pages do not publish tariff sheets, minimum volume commitments, or
              service-level agreements.
