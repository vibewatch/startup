      - number: '2.4'
        title: Growth drivers, privatization logic, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The growth case is policy-backed and operationally grounded. Scarcity, urban growth, and industrial
              diversification all push Saudi Arabia toward desalination, wastewater reuse, and tighter network
              performance. Privatization and PPP law matter because they define the bankable delivery model;
              localization also matters because public sponsors want a domestic industrial base, not only imported
              plants. At the same time, the constraints are material. Desalination remains energy intensive, creates
              brine, and often requires long inland transmission routes plus strategic storage to reach demand centers.
              Reuse expansion is also not just a treatment-plant question; it requires networks, offtakers, quality
              assurance, and public or regulatory acceptance. For a GI WaaS entrant, this means timing matters: markets
              may be large on paper, but contracts clear only where offtake certainty, infrastructure readiness, and
              acceptable lifecycle economics line up.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
