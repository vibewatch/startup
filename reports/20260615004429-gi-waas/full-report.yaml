              load. Independent export coverage adds two more useful signals: first, that a French cosmetics plant was
              publicly announced at about €5 million under a per-cubic-meter treatment model; second, that Bahrain and
              wider GCC shipments were positioned for early 2026. These sources verify that GI is not purely conceptual.
              But the same record stops short of proving uptime, maintenance staffing, spare-parts resilience, alarm
