        title: Operating deployments, milestones, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The best evidence that GI WaaS is more than a concept comes from operating deployments. Official materials
              describe a December 2022 Riyadh Industrial STP, a Hajj 1444 slaughterhouse deployment that reportedly
              treated about 80,000 m³ in 84 hours, a 2025 ARASCO unit in Al Kharj, a Jeddah neighborhood plant serving
