      - number: '7.4'
        title: Regulatory, competitive, and market risk
        blocks:
          - type: paragraph
            body: >-
              Saudi Arabia is a strong demand environment for water infrastructure, but it is also a highly governed
              one. MEWA, SWA, NWC, SWPC, Sharakat, and environmental-permitting functions all matter in who can build,
              operate, and monetize assets at scale. That creates two-sided risk. Policy support can open doors, but it
              can also slow a startup that lacks licenses, reference economics, or the balance sheet to handle long
              procurement and compliance cycles. The market structure also raises the competitive bar. Incumbents such
              as Miahona disclose more about operating model and financial posture than GI does today, while comparable
              international players such as Seven Seas and Fluence frame the same customer problem with mature financing
              and delivery language. In other words, GI is not only competing on technology. It is competing on
              bankability, disclosure quality, and execution stamina. If the company cannot convert showcase-project
              momentum into a wider, more transparent operating record, then better-capitalized infrastructure operators
              can crowd out the startup narrative even in a favorable market.
