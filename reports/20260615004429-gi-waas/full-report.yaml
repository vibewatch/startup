      - number: '4.3'
        title: Cost structure, margin path, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              GI’s public value proposition implies a cost structure with both attractive and dangerous traits. On the
              attractive side, the company says G-NANO is non-biological, modular, energy-efficient, and capable of 100%
              reuse on specific projects; the France export story adds a claim of up to 80% energy savings and sharply
              reduced footprint. Reuse economics can be compelling in Saudi Arabia because treated effluent can displace
              more energy-intensive alternatives such as desalination or long-distance water transport when industrial
              reuse is feasible. Comparators such as Seven Seas and Miahona also show that well-run water-service
              providers can turn long-duration treatment, O&M, and reuse services into recurring cash flows once the
              asset base is established.


              The dangerous side is capital intensity. A provider-funded pay-per-m3 model means someone must finance
              fabrication, deployment, commissioning, performance guarantees, spare parts, chemicals, labor, and
              receivables before usage billing scales. The Arab News export story alone is enough to show meaningful
              hardware content: a single France project was described at about €5 million, and the Al Kharj
              manufacturing buildout was tied to roughly €150 million of expected investment. Public comparators confirm
              that sector margins can become healthy only after scale and contract maturity: Miahona reported SAR 699.7
              million revenue and SAR 177.8 million adjusted EBITDA in 2025, but it still carried SAR 149.3 million of
              capex commitment. That is the core margin-path lesson for GI: list-model elegance does not remove the need
              for balance-sheet depth, project finance discipline, and tight utilization management.
            claimRefs:
