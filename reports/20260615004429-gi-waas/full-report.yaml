  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track / research-more; do not underwrite the headline unicorn mark as a clean buy today.
        - Wait for verified economics or materially better terms before paying for upside.
      - - Valuation stance
        - Stretched on current public evidence; only supportable in the bull case.
        - Treat >$1B as a reported headline, not as a diligence-cleared price.
      - - Confidence
        - Medium.
        - There is enough evidence to be skeptical, but not enough to produce a precise mark.
      - - Risk rating
        - High.
        - Missing economics, website QA issues, and unknown preference stack create asymmetric downside.
      - - Best supportable framing
        - Capital-intensive water-services / industrial-water platform, not software.
        - Use scenario ranges and structure protections rather than a single target multiple.
      - - Entry discipline
        - >-
          Either invest at a material discount to the reported unicorn mark or require senior protections and milestone
          tranching.
        - Do not accept price-only exposure at headline terms.
      - - Likely exit path
        - Another private or strategic financing looks more plausible than a near-term IPO.
        - Underwrite to a private-market continuation, not immediate public-market readiness.
      - - Upgrade trigger
        - Signed data-room evidence of recurring contracted volume, margins, and clean round terms.
        - Would make a price closer to the headline mark easier to defend.
      - - Primary downside trigger
        - Evidence that the round terms were weak, preferences are heavy, or recurring economics are thin.
        - Would push the case toward the bear range and potentially to avoid.
    notes: >-
      The recommendation is explicitly evidence-sensitive and price-sensitive; it is not a statement that GI lacks real
      technology or market opportunity.
    claimRefs:
      - CV034
      - CV039
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Financing signal
        - The company was publicly reported above $1B after Series A, implying real sponsor appetite.
        - The detailed economics came from thin secondary coverage rather than disclosed investor documents.
        - Investor-side confirmation of signed terms and full cap table.
      - - Product and service model
        - Pay-per-cubic-meter treatment and modular G.NANO units fit a large underserved wastewater and reuse problem.
        - The public pack proves the narrative better than it proves durable unit economics.
        - Verified customer cohorts, gross margin by deployment type, and retention/renewal data.
      - - Commercial proof
        - Riyadh, Hajj, Jeddah, ARASCO, and export references suggest GI is operating in the field.
        - Showcase projects and factory narratives are not the same as contracted recurring cash flow.
        - Backlog, minimum-volume commitments, and customer-level revenue bridges.
      - - Market structure
        - Saudi water demand, privatization, and SWPC-style procurement create real demand tailwinds.
        - >-
          Saudi water PPPs are bankable but point toward infrastructure returns and long-cycle execution, not software
          velocity.
        - Proof that GI can scale with attractive returns despite infrastructure-like cost and timeline realities.
      - - Comparable framing
        - Public water and environmental comps show that large equity values are possible in the category.
        - Those comps disclose revenue and filings; GI does not, so the strategic premium burden is high.
        - A disclosed revenue base that makes relative valuation possible.
      - - Disclosure quality
        - The company has enough public material to show ambition, deployments, and policy alignment.
        - >-
          Official-domain contamination and unknown preference overhang reduce confidence in management-quality
          signaling.
        - A cleaned-up disclosure surface and audited / investor-grade diligence package.
    notes: >-
      The anti-thesis is driven mainly by evidence quality and capital-intensity concerns, not by disbelief that Saudi
      wastewater reuse is an important market.
