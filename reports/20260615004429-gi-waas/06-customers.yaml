- id: TU003
  title: Named customer proof table
  columns:
  - Customer / project
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof quality
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Rows cover the named GI customer or project references with concrete site or use-case detail visible in fetched 2022-2026 sources; confidential customers, unnamed export buyers, and purely pipeline conversations are excluded.
  rows:
  - - ARASCO Al Kharj
    - Agro-industrial campus
    - 500 m3/day STP for domestic and agro-industrial wastewater
    - Delivered operating site
    - Named Saudi customer with concrete capacity and vertical fit
    - Mostly company-side proof; no customer-side quote or procurement notice
  - - Riyadh Industrial City
    - Industrial-zone infrastructure
    - 1,200 m3/day underground STP with 100% reuse
    - Delivered operating site
    - Best public industrial durability proxy because it dates to 2022 and is repeated in later coverage
    - Commercial owner and contract form are still unclear
  - - Jeddah El Mousa district
    - Community / public-service wastewater
    - 1,000 m3/day decentralized domestic wastewater treatment
    - Delivered operating site
    - Strong problem-solution proof for unsewered districts and irrigation reuse
    - Public pack does not show a buyer-side award record or payment model
  - - Hajj slaughterhouse operations
    - Seasonal public-service operator
    - Mobile containerized treatment during pilgrimage peak loads
    - Delivered operating deployment
    - Operationally strong proof under extreme conditions
    - Episodic seasonal use is not the same as durable enterprise account retention
  - - French cosmetics facility
    - International industrial manufacturer
    - €5 million export plant using per-cubic-meter industrial reuse model
    - Announced / pending live operation
    - Strongest fresh independent corroboration and best export signal
    - End customer remains unnamed and live operating proof is not yet public
  - - Bab Samhan Hotel
    - Hospitality / real-estate asset
    - Treats greywater, blackwater, kitchen, and laundry flows for reuse
    - Operating reference
    - Useful hospitality proof and one-year operating proxy cited by external coverage
    - Single-site evidence; Marriott-chain expansion is only an opportunity signal
  - - Tahliya / Bahrain expansion
    - Partner-led channel entry
    - Strategic partnership to introduce GI Water as a Service in Bahrain
    - Pre-deployment partnership
    - Important route-to-market signal for Gulf expansion
    - Not yet named end-customer proof
  notes: This table ranks named proof by actual site or customer specificity. A named partnership or export announcement is counted, but not treated as equivalent to a long-running operating site.
