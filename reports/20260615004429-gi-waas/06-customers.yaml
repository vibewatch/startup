- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and the quality of named customer proof
  body: 'The strongest customer proof comes from dated operating references rather than from generic growth language. Riyadh Industrial is the clearest long-lived proof in the pack because the company dates delivery to December 2022 and multiple later articles still cite the site as a working 100% reuse reference. ARASCO adds fresher 2025 agro-industrial proof, Jeddah El Mousa adds a community-scale public-utility use case, and Bab Samhan adds a hospitality application that is narrow in scale but useful in proving wastewater-type flexibility. The Hajj slaughterhouse case is operationally impressive because it shows GI handling peak seasonal loads that would overwhelm ordinary biological systems, but it still does not look like a conventional recurring enterprise account.


    France and Bahrain should be treated more carefully. The France cosmetics-facility deal is well corroborated and fresh, but it is still announcement-stage export proof rather than publicly documented live operation. Bahrain is even earlier: the Tahliya partnership and GWECCC pages show geographic expansion and channel-building, yet they do not disclose a live Bahraini customer site. NetZero and the Aramco dialogue page add valuable adjacency signals, but neither should be counted as named paying-customer proof. The right diligence conclusion is that GI has real production-grade references in Saudi Arabia and credible 2025-2026 expansion signals, while the newest international proofs remain ahead of independently visible operating history.'
