- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Use case
  - Strategic value
  - Gap
  rows:
  - - Agro-industrial operator
    - Buyer and user are likely ARASCO operating units; payer likely site owner / plant operator
    - ARASCO Al Kharj 500 m3/day STP
    - Treat domestic plus agro-industrial wastewater for reuse
    - Shows fit with water-sensitive food and feed campuses
    - No public tariff, tenure, or customer-side performance data
  - - Industrial-zone / factory cluster
    - Buyer may be industrial-zone operator or site developer; users are tenant industries
    - Riyadh Industrial City 1,200 m3/day STP
    - Underground industrial wastewater treatment with 100% reuse
    - Best public proof for long-lived industrial operation
    - No buyer-side award notice or commercial terms disclosed
  - - Community / utility-adjacent public service
    - Public authority or district sponsor buys; residents use sanitation service; irrigation body benefits from treated output
    - Jeddah El Mousa district aligned with SWA and irrigation reuse
    - Serve unsewered district wastewater and irrigate landscaping
    - Shows GI can plug into Saudi public-service water loops
    - Public proof does not show whether revenue comes from authority contract, fees, or grant-backed deployment
  - - Seasonal public-service operator
    - Public or event-linked operator buys; slaughterhouse users generate the wastewater; state bodies oversee compliance
    - Hajj slaughterhouse deployments
    - Rapid high-load treatment during pilgrimage peaks
    - Proves GI can win urgent, difficult, high-profile operating environments
    - Looks episodic and project-like rather than recurring monthly subscription revenue
  - - Hospitality / real-estate asset owner
    - Hotel operator pays; guests and facilities teams are end users
    - Bab Samhan Hotel in Diriyah / Riyadh
    - Treat greywater, blackwater, kitchen, and laundry flows for reuse
    - Extends GI into premium real-estate and hospitality niches
    - Single-site proof does not yet show chain-wide rollout
  - - International industrial / channel-led expansion
    - Local manufacturer or partner may buy; GI may supply technology and operating model through partner
    - France cosmetics facility; Bahrain Tahliya partnership
    - Exported industrial reuse plant and local partner-led Gulf expansion
    - Shows GI can move beyond Saudi proof set
    - Public evidence is announcement-heavy and not yet a broad installed-base record
  notes: Rows separate buyer, user, and payer where the public record implies split roles. The table maps visible archetypes, not total account count.
