- id: retention-durability-and-freshness-gaps
  title: 'Retention, durability, and freshness: what is proven and what is still missing'
  body: 'Public durability evidence is meaningfully weaker than public deployment evidence. None of the reviewed sources discloses customer count, NRR, GRR, churn, renewal rates, average contract length, minimum-volume commitments, or top-account revenue share. The best durability proxy is elapsed operating time at Riyadh Industrial, followed by the independent claim that Samhan Hotel has handled all wastewater types for a full year. Those are useful because they indicate that GI can stay on site beyond commissioning, but they are not substitutes for renewal or billing evidence.


    The Hajj pages are directionally helpful but also a warning. GI maintains separate pages for 1444H and 1445H slaughterhouse treatment, which suggests repeatability in the use case, yet the public record does not make it clear whether those pages represent consecutively renewed contracts, different annual deployments, or partially duplicated case storytelling. Likewise, France and Bahrain show expansion into new geographies, not retention inside the original Saudi installed base. Investors should therefore use the public pack to rank proof quality and freshness, not to infer cohort economics. Retention remains a private-diligence issue, and the absence of customer-side testimonials, review-platform data, or buyer-side award notices keeps satisfaction and stickiness mostly unverified.'
