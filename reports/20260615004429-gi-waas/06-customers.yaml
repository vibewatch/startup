  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics-gap
    missingEvidence: Customer count, NRR, GRR, churn, and logo-retention data by cohort or segment.
    whyItMatters: Without cohort metrics, public deployment proof cannot be translated into recurring-revenue durability.
    diligencePath: Request a retention bridge by year, segment, and geography plus top-20 customer list with start dates.
  - type: private-evidence-only
    severity: material
    topic: contract-terms-gap
    missingEvidence: Average contract term, minimum-volume commitments, renewal clauses, and service-level economics for major deployments.
    whyItMatters: Per-cubic-meter pricing can still mask short-tenor or low-commitment contracts that do not behave like durable revenue.
    diligencePath: Request anonymized top-10 contract summaries covering tariff, term, minimum offtake, renewal, and asset-ownership structure.
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: A fuller list of named customers, buyer-side confirmations, and procurement award notices beyond the visible showcase references.
    whyItMatters: The public proof table is partial, so concentration risk may be either overstated or understated.
    diligencePath: Collect buyer-owned case studies, award notices, or customer references for the current installed base.
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: procurement-visibility-gap
    missingEvidence: Tender-level buyer details hidden behind login-gated procurement portals.
    whyItMatters: Public visibility into Saudi buyer pipelines and award confirmations is thinner than in more transparent software or equipment markets.
    diligencePath: Use registered procurement access or management-provided award documents to verify buyer-side contract history.
  - type: stale
    severity: material
    topic: expansion-conversion-status
    missingEvidence: Live operating status, commissioning dates, and follow-on orders for the France export and Bahrain expansion items after announcement.
    whyItMatters: Expansion proof is fresh and narratively strong, but installation and repeat-usage proof have not yet caught up publicly.
    diligencePath: Re-check 2026-2027 customer-side references, commissioning notices, or operating updates for France, Bahrain, and other GCC units.
