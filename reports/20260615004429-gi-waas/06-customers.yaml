company:
  name: GI WaaS
chapter:
  number: 6
  title: Customers
  summary: 'GI WaaS has credible named customer and project proof across industrial, public-service, community, hospitality, and early export channels, with Riyadh Industrial, ARASCO, Jeddah El Mousa, Hajj slaughterhouse operations, and Samhan Hotel showing more than logo-only marketing. What remains thin is durability evidence: public sources do not disclose customer count, contract term, NRR/GRR, or revenue concentration, so expansion proof is fresher and stronger than retention proof.'
sections:
- id: segment-buyer-user-payer-map
  title: 'Customer segments: who buys, who uses, and who likely pays'
  body: 'GI’s named proof set is more diverse by use case than by customer count. The public record supports at least six buyer archetypes: agro-industrial operators such as ARASCO; industrial-zone or city-infrastructure stakeholders such as Riyadh Industrial City and the Saudi Water Authority-linked Jeddah El Mousa project; seasonal public-service operators around the Hajj slaughterhouse workload; hospitality or real-estate operators such as Bab Samhan Hotel; international industrial manufacturers such as the unnamed French cosmetics facility; and partner-led Gulf expansion through Tahliya in Bahrain. In each case, buyer, user, and payer are not necessarily the same party. A hotel operator may pay while guests never see the system; a public authority may sponsor a community installation while irrigation or sanitation bodies consume the output; and a partner-led export may rely on a local channel to own the customer relationship.


    That role-splitting matters because it makes GI look less like a simple SaaS-style account base and more like a project-led infrastructure seller using a service wrapper. The GI project index reinforces that reading by grouping work across domestic, industrial, agricultural, and seasonal applications. Trade.gov and Sharakat/SWPC materials also show that larger Saudi water opportunities are procurement-driven and often mediated by public bodies, PPP structures, or local-market intermediaries. The consequence is that GI’s public segment breadth is credible, but the commercial ownership of the end customer remains uneven across segments.'
