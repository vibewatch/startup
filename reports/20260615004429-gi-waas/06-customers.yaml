- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric or proxy
  - Public value / status
  - Confidence
  - What it suggests
  - Diligence ask
  rows:
  - - Customer count
    - Not publicly disclosed
    - Low
    - Breadth of installed base cannot be underwritten from public sources
    - Request active customer count split by Saudi vs international and by segment
  - - NRR / GRR / churn
    - Not publicly disclosed
    - Low
    - No public proof of cohort economics or stickiness
    - Request logo churn, gross retention, and net retention by year
  - - Average contract term / minimum volume
    - Not publicly disclosed
    - Low
    - Per-cubic-meter model could still be short-tenor or heavily volume-variable
    - Request top-10 contract term sheet summary and minimum-commitment language
  - - Elapsed operating-time proxy
    - Riyadh Industrial dates to Dec 2022; Samhan external coverage cites one year of operation
    - Medium
    - Some references appear live beyond commissioning
    - Request site start dates, uptime, and any renewals or scope extensions
  - - Repeat seasonal-demand proxy
    - Separate Hajj 1444H and 1445H pages exist, but renewal path is unclear
    - Low
    - Use case may recur annually, but contract continuity is not proven
    - Request customer name, number of seasons served, and whether contracts were renewed or rebid
  - - Customer-side testimonial / satisfaction signal
    - No robust external review corpus or customer-owned case study found in the fetched pack
    - Low
    - Satisfaction is largely inferred from deployment survival, not from buyer testimony
    - Request reference calls, NPS / CSAT, and buyer-side case studies
  notes: Null-like “not publicly disclosed” entries are deliberate. The chapter can prove use-case adoption more easily than revenue durability or customer satisfaction.
