- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Public evidence
  - Impact
  - Why it matters
  - Diligence path
  rows:
  - - Replicable decentralized niche expansion
    - ARASCO, Jeddah, Samhan, and Hajj all reward speed, compact footprint, and reuse benefits
    - Positive
    - GI may win where megaproject incumbents are too heavy
    - Map segment-level win rates by industrial site, hotel, district, and seasonal project type
  - - Flagship-site concentration
    - Named public proof is still a small set of Saudi flagship references plus one export announcement
    - High risk
    - A few showcase deployments can overstate commercial breadth
    - Request top-customer revenue share and number of plants live by segment
  - - Public / regulated-interface dependence
    - Jeddah, irrigation reuse, Hajj, and industrial-zone references all touch authorities or regulated systems
    - Medium-high risk
    - Permits, buyer processes, and compliance can slow scaling
    - Request approvals matrix and average cycle time by customer type
  - - Partner-led Gulf expansion
    - Tahliya in Bahrain plus NetZero and Aramco relationship pages indicate partner-heavy adjacency building
    - Medium-high risk
    - Channel partners can accelerate entry but dilute direct customer ownership
    - Request partner economics, exclusivity, and who controls renewal and upsell rights
  - - Saudi procurement structure
    - Trade.gov, Sharakat, SWPC, Metito, Veolia, and Zawya all point to PPP or concession-heavy large-account procurement
    - High risk
    - Larger accounts may favor capitalized consortia rather than a startup direct-sale motion
    - Request pipeline split between direct decentralized deals and PPP-linked opportunities
  - - International conversion risk
    - France and planned GCC units are fresh but still announcement-stage
    - Medium risk
    - Export proof is strong for narrative but weak for installed-base durability today
    - Track commissioning dates, second-site wins, and any customer-side references in 2026-2027
  notes: The table separates upside from risk. Expansion is visible, but most of the unresolved underwriting questions are concentration, channel ownership, and procurement friction.
