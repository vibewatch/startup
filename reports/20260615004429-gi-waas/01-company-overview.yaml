callouts:
- calloutType: strength
  title: Service model is easier to understand than the legal structure
  body: Across official pages, brochures, and event materials, GI WaaS consistently explains its value proposition as decentralized wastewater treatment sold on a pay-per-cubic-meter or zero-CAPEX basis. That clarity helps later diligence on customer ROI even though governance and cap-table disclosure remain sparse.
  claimRefs:
  - CO005
  - CO029
  - CO030
- calloutType: risk
  title: Unicorn narrative is much stronger than the supporting disclosure package
  body: The billion-dollar valuation, investor names, and expansion story are repeated across public coverage, but no investor-authored release, cap-table disclosure, audited financials, or standalone GI WaaS KPI deck surfaced in this review. Public operating metrics remain notably thin for a self-described unicorn.
  claimRefs:
  - CO011
  - CO012
  - CO014
  - CO033
  - CO039
- calloutType: insight
  title: Website contamination is a real diligence signal, not a cosmetic footnote
  body: The official GI Aqua Tech site still contains pest-control copy, unrelated albums, and bug-extermination testimonials. Because public evidence is otherwise sparse, this weakens confidence in the rigor of other self-published claims and increases the need for primary diligence materials.
  claimRefs:
  - CO031
  - CO032
