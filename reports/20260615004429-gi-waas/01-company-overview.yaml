- id: leadership-and-governance
  title: Leadership visibility and governance opacity
  body: 'Leadership visibility is concentrated around Dr. Sherif Desouky. Enterprise AM quotes him as GI Aqua Tech CEO, Arab News quotes him on export and factory plans, and conference biographies position him as President of GI Aqua Tech and Executive Chairman or founding partner of GP Holding. The German registry also identifies named management for GI Aqua Tech GmbH, including Ibrahim Serifoglu and Yacine Tej. Beyond that, transparency drops off sharply. Reviewed public materials do not surface a GI WaaS board, a Saudi management roster, or a documented ownership chain linking the German legal entity to the Saudi operating company. This creates obvious key-person dependency and a governance diligence burden: the market can identify who tells the story, but not who formally controls the Saudi business, who sits on its board, or what investor rights accompany the reported unicorn valuation.'
  claimRefs:
  - CO003
  - CO008
  - CO009
  - CO010
  - CO038
  tableRefs:
  - TO002
- id: funding-and-disclosure-quality
  title: Funding claims, investor map, and disclosure quality
  body: 'GI WaaS is widely described as having crossed the unicorn threshold after an early-2025 Series A round, with Enterprise AM citing a $1.03 billion valuation and an eight-figure cash investment for 5.8% equity, while other outlets repeat the broader claim of a valuation above $1 billion. The named backers are consistent across coverage: Al Zamil and Alqunaibet. What is not consistent or independently verifiable is the depth of primary evidence. No investor-authored announcement, public cap table, or regulatory filing surfaced in the reviewed source pack. That weakness is amplified by the company''s thin operating disclosure: public materials emphasize valuation, technology, and project examples, but do not publish GI WaaS revenue, ARR, customer count, or standalone headcount. The investor map therefore matters less as a proof of capitalization than as a map of who to diligence directly if this report is to move beyond company-curated narratives.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
