- id: deployments-milestones-and-adverse-signals
  title: Operating deployments, milestones, and adverse signals
  body: The best evidence that GI WaaS is more than a concept comes from operating deployments. Official materials describe a December 2022 Riyadh Industrial STP, a Hajj 1444 slaughterhouse deployment that reportedly treated about 80,000 m³ in 84 hours, a 2025 ARASCO unit in Al Kharj, a Jeddah neighborhood plant serving irrigation reuse, and a Diriyah hospitality installation. Arab News adds an export milestone to France in early 2026 plus factory-scale ambitions in Al-Kharj, although public figures conflict on the exact site footprint. The same public packet also reveals adverse signals. Aramco and PIF-related pages describe meetings and solution showcases rather than booked contracts, and the official site still contains pest-control copy, bug-extermination testimonials, and unrelated album pages. For a self-described water unicorn, that mix of bold scale claims and weak disclosure hygiene should be treated as a real diligence risk rather than a cosmetic issue.
