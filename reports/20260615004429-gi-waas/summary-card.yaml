  topStrengths:
    - >-
      GI WaaS has named operating references across Riyadh Industrial, ARASCO, Jeddah El Mousa, Hajj, and hospitality
      deployments rather than a purely conceptual product story.
    - >-
      The pay-per-cubic-meter / zero-CAPEX model fits Saudi reuse, decentralization, and privatization priorities in a
      water-stressed market.
    - >-
      Public sources consistently describe a modular G.NANO platform with multiple deployment formats and visible
      2025-2026 commercialization momentum.
  topRisks:
    - >-
      The reported >$1B valuation is supported mainly by company-linked and secondary coverage rather than investor-side
      filings, cap-table documents, or disclosed economics.
    - >-
      Governance, ownership chain, revenue, margin, customer-count, and headcount disclosure are all materially weaker
      than the headline financing narrative.
    - >-
      Water-as-a-service in Saudi Arabia still carries infrastructure-style capital intensity, procurement friction, and
      regulatory dependence that do not justify software-like valuation assumptions by default.
    - >-
      Official-domain quality issues, including unrelated website content, raise real diligence questions about
      disclosure controls and management rigor.
  unresolvedGaps:
    - >-
      Investor-side confirmation of Series A size, price, ownership percentages, liquidation preferences, and governance
      rights.
    - Revenue, gross margin, cash burn, runway, and contracted recurring-volume evidence by project or customer cohort.
    - >-
      Exact Saudi legal entity structure and the control chain linking GI WaaS to GI Aqua Tech GmbH and any Saudi
      operating companies.
    - Customer durability metrics such as contract length, renewal, concentration, and backlog.
