- id: process-architecture
  title: Process and operating architecture
  body: 'The most specific public technical disclosure is the G-NANO process narrative. GI’s technology page breaks the process into pH conditioning, oxidation, a positively charged capture stage, flocculation, sludge separation, and sludge-volume minimization, while the companion blog reiterates a non-biological treatment logic that converts contaminants into compact reusable sludge. Those steps are still marketing-level descriptions rather than a full engineering datasheet, but they are specific enough to establish that GI is selling a chemical-physical treatment architecture, not an activated-sludge software overlay. The packaging architecture around that core is also reasonably clear: G-NANO can be wrapped into containerized units, mobile units, underground industrial plants, and bolt-on capacity modules. Public claims of integrated sensors, predictive alarms, built-in water testing, and quality frameworks suggest some instrumentation layer exists, but GI does not publish network architecture,
    SCADA interfaces, historian integrations, or API documentation. For diligence, that means the process core is better described than the digital integration layer.'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE023
  - CE024
  - CE027
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: deployment-proof-reliability
  title: Deployment proof, integration, and reliability signals
  body: 'GI has real public deployment proof, and that is the strongest part of the chapter. The Jeddah El Musa page provides a decentralized urban case tied to a Saudi Water Authority context, irrigation-quality reuse, and a monitoring framework; Riyadh Industrial City provides a larger underground industrial case built around 100% reuse and odor-free operation; ARASCO provides a smaller 500 m³/day industrial reference; and the Hajj slaughterhouse case shows mobile containerized deployment under peak seasonal load. Independent export coverage adds two more useful signals: first, that a French cosmetics plant was publicly announced at about €5 million under a per-cubic-meter treatment model; second, that Bahrain and wider GCC shipments were positioned for early 2026. These sources verify that GI is not purely conceptual. But the same record stops short of proving uptime, maintenance staffing, spare-parts resilience, alarm response, or support SLAs. Reliability is therefore evidenced by named
    deployments and repeat use cases, not by public operating statistics.'
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
