- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in system
  - Primary dependency
  - Public proof level
  - Risk / missing detail
  rows:
  - - pH buffering and conditioning
    - Normalizes influent before downstream treatment
    - Chemical dosing and influent characterization
    - Explicitly described on technology page
    - No public reagent consumption or tolerance bands
  - - Oxidation stage
    - Breaks down organics and lowers biological load
    - Process chemistry and residence time
    - Explicitly described on technology page
    - No public oxidant selection or byproduct controls
  - - Charge-cloud capture plus flocculation
    - Aggregates pathogens, oils, and suspended solids into removable flocs
    - Mixing and coagulant/flocculant control
    - Explicitly described on technology page and blog
    - No public parameter windows or removal curve data
  - - Sludge separation and reuse / disposal layer
    - Concentrates solids into compact sludge and supports reuse narrative
    - Dewatering, haulage, or Sludge+ handling
    - Publicly described at high level in technology and event materials
    - No public sludge mass balance or end-market economics
  - - Plant packaging layer
    - Wraps treatment into portable, mobile, upgrade, or larger fixed formats
    - Fabrication, transport, and site integration
    - Publicly visible across four product families
    - No public module interchangeability or lead-time data
  - - Monitoring and quality layer
    - Feeds alarms, water testing, and operating adjustments
    - Sensors, remote control, and local handoff process
    - Claimed on tech page, Jeddah page, and Aquatech profile
    - No public SCADA/API, cybersecurity, or uptime documentation
  notes: The architecture table uses only layers explicitly visible in reviewed materials. It intentionally separates the chemistry/process narrative from the packaging and control layers because the public surface is far more detailed on process marketing than on digital integration.
