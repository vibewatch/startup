- id: trust-quality-compliance
  title: Trust, safety, compliance, privacy, and explicit public gaps
  body: 'GI’s public product pages do make quality and compliance claims: Jeddah states irrigation-quality effluent and a monitoring framework; Riyadh claims regulatory-compliant discharge or reuse; domestic wastewater marketing emphasizes continuous monitoring and health protection; and IFAT materials promise compliance-oriented deployment. But the reviewed public surface does not publish the lab reports, downloadable certificates, or public audit packages that would let an outside diligence team independently validate those outcomes. The biggest trust gap is not in wastewater chemistry but in the digital and legal surface around the website itself. The privacy policy is template-branded “Interim Agency,” the terms page is branded “Verdant,” and both retain placeholder fields that should have been finalized before publication. That does not disprove GI’s plant quality, but it weakens confidence in public governance hygiene and makes it harder to credit generic website security language.
    Likewise, the reviewed surface exposes no public status page, trust portal, uptime history, or machine-readable certification registry. The chapter therefore treats public compliance claims as directionally positive but incompletely evidenced.'
