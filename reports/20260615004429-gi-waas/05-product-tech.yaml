- id: differentiation-roadmap
  title: Differentiation, brownfield roadmap, and what is asserted versus verified
  body: 'The public differentiation story is consistent across official and independent materials: GI claims faster deployment than conventional plants, lower land intensity, lower energy use, odor-free operation, modular expansion, and recovery or reuse of sludge byproducts. Some of those assertions are at least partially triangulated—Aquatech and IFAT profiles repeat remote control, predictive alarms, and product-size distinctions, while the export coverage repeats the France use case, 100% reuse framing, and energy-savings narrative. The 2026 IFAT Munich campaign is especially important because it broadens GI’s narrative from greenfield decentralized plants toward upgrading existing wastewater assets without new land or downtime. That opens a larger operating wedge inside installed infrastructure. Still, several differentiators remain insufficiently verified for underwriting: the public surface does not disclose patent numbers, detailed certification files, measured long-run OPEX, or
    module-level failure rates. The right reading is that GI’s strategic direction and market positioning are visible, but its deepest technical moats remain more asserted than evidenced in public.'
  claimRefs:
