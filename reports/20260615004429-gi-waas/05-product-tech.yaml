    - id: n4
      label: Monitoring and quality handoff
      detail: Public materials cite integrated sensors, alarms, water testing, and local quality frameworks
    - id: n5
      label: Reuse / compliant discharge
      detail: Irrigation reuse, industrial reuse, or compliant discharge closes the customer workflow
