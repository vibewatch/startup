figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: GI’s public product architecture stacks process chemistry, plant packaging, controls, and sludge handling into one modular operating system.
  data:
    layers:
    - label: Customer influent and site constraints
      detail: Industrial, domestic, slaughterhouse, concrete, and energy-sector wastewater streams create the operating boundary for the plant.
    - label: G-NANO treatment core
      detail: pH buffering, oxidation, charge-cloud capture, flocculation, and sludge concentration form the claimed non-biological process chain.
    - label: Packaging layer
      detail: The same core is wrapped into portable, mobile, capacity-upgrade, and new-generation plant formats.
    - label: Monitoring and quality layer
      detail: Integrated sensors, quality frameworks, predictive alarms, and built-in water testing are publicly claimed for selected formats.
    - label: Reuse and recovery outputs
      detail: Outputs are framed as irrigation-quality or industrial reuse water plus compact sludge with zero-waste ambitions.
  approximationNotes: This map is a synthesis of public product pages and exhibitor materials. GI does not publish a full engineering block diagram, so the stack reflects only the layers that are explicitly described.
  claimRefs:
  - CE002
  - CE007
  - CE009
  - CE023
  - CE027
