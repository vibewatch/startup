  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ip-verification-gap
    missingEvidence: Patent numbers, filing jurisdictions, claim scope, and downloadable certificate files for G-NANO or related treatment modules.
    whyItMatters: Without patent or certificate detail, it is hard to judge whether GI has a durable technical moat or merely a strong marketing narrative.
    diligencePath: Request patent schedule, certificate copies, and legal owner mapping for every cited technology or approval.
    relatedQuestionRefs:
    - QE016
  - type: private-evidence-only
    severity: material
    topic: support-sla-gap
    missingEvidence: Public or private service-level agreement templates, maintenance responsibilities, spare-parts model, and escalation workflow for deployed plants.
    whyItMatters: The product is sold as an operated service, so support performance is part of the product itself rather than a secondary back-office issue.
    diligencePath: Request standard MSA/SLA packs, support org chart, and incident response examples from the last 12 months.
    relatedQuestionRefs:
    - QE017
  - type: missing-source
    severity: material
    topic: security-disclosure-gap
    missingEvidence: Named certifications, system architecture, uptime history, security owner contact, and public trust/status documentation for GI’s digital monitoring surface.
    whyItMatters: Utilities and industrial buyers will evaluate digital controls and availability alongside treatment performance, especially when reuse workflows rely on monitoring and alerts.
    diligencePath: Request trust-center materials, certification register, SCADA / remote-control architecture, and any customer-facing uptime reports.
    relatedQuestionRefs:
    - QE020
  - type: private-evidence-only
    severity: material
    topic: maturity-assessment
    missingEvidence: Module-level installed base counts, failure rates, reference uptime, commissioning durations, and utilization history by plant family.
    whyItMatters: Public pages show that the modules exist, but they do not show whether each family is repeatable at scale or still bespoke around a few references.
    diligencePath: Request installed-base ledger by module, commissioning backlog, performance warranty claims, and cohort-level service metrics.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: compliance-evidence-gap
    missingEvidence: Lab reports, regulator acceptance letters, odor measurements, and third-party test files behind reuse and compliance claims.
    whyItMatters: The chapter can acknowledge quality claims, but final investment judgment should rest on auditable performance data rather than marketing copy.
    diligencePath: Request project dossiers for Jeddah, Riyadh, Hajj, and the France export with test protocols and result sets.
