tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity / proof
  - Differentiation claim
  - Diligence gap
  rows:
  - - Portable WWT plants
    - Remote or temporary site operator
    - Public product page plus Aquatech profile
    - Containerized, no construction, reusable or discharge-ready treatment
    - No public BOM, setup time distribution, or service staffing model
  - - Mobile WWT plants
    - Emergency, rotating, or multi-site operator
    - Public product page
    - Can serve multiple locations in a day via compact mobile setup
    - No public relocation cost, throughput derating, or vehicle spec
  - - Capacity upgrade modules
    - Existing municipal or compound plant owner
    - Public product page plus IFAT Munich campaign
    - Adds capacity without new land, shutdown, or civil works
    - No public case study with before/after hydraulic data
  - - New-generation plants
    - Industrial park or large municipality
    - Public product page
    - Higher-capacity compact plants with up to 80% less land
    - No public maximum capacity envelope or failure-rate data
  - - G-NANO treatment core
    - All GI deployments
    - Technology page, blog, and project pages
    - Non-biological process with compact sludge and reuse orientation
    - No public patent numbers, reagent schedule, or long-run consumables data
  - - Sludge / recovery layer
    - Projects where sludge handling matters
    - Event and exhibitor materials only
    - Zero-waste / reusable byproduct narrative alongside treatment
    - No public standalone datasheet or project-level economics
  notes: Rows separate verified product families from adjacent recovery claims. Public proof is strongest on plant-family existence and named project use; it is weakest on module internals, sizing limits, and service operations.
