  rows:
  - - GI WaaS
    - Decentralized wastewater-reuse WaaS startup
    - Company-claimed $1B valuation after Series A; Saudi/MENA unicorn narrative
    - Industrial and community users needing managed treatment and reuse
    - G-NANO nanotech plus pay-per-cubic-meter billing and decentralized delivery
    - Public pack does not disclose installed base, customer count, or contract tenure
  - - Seven Seas Water Group
    - Direct outsourcing / WaaS incumbent
    - 200+ owned plants; 20+ years of WaaS deployment; EQT backing
    - Municipal, developer, industrial, hospitality, island/coastal users
    - Explicit no-upfront-capital, guaranteed performance, BOO/BOOT, full-cycle operations
    - Broader municipal and desalination profile may be heavier than GI for smaller decentralized deployments
  - - Ekopak
    - Industrial WaaS challenger
    - Public references across Belgium, France, Indonesia, Pakistan
    - Industrial water recycling and process-water users
    - Per-liter WaaS pricing and strong circular-water positioning
    - Public evidence is more Europe-centric and narrower than Seven Seas on plant-ownership history
  - - Gradiant
    - Industrial advanced-treatment challenger
    - Second unicorn in water per GI source; broad industrial source pack
    - Semiconductor, chemicals, mining, pharma, energy, data centers
    - End-to-end reuse, ZLD, UPW, PFAS, AI/ML optimization
    - Less explicit on simple usage-based outsourcing than Seven Seas or GI
  - - Metito Utilities
    - PPP / concession incumbent
    - Emerging-markets PPP specialist with BOT, BOO, BOOT, TOT structures
    - Utilities, wastewater, long-term concessions, Vision 2030 projects
    - Bankable concession and O&M experience in water infrastructure
    - Public pricing and smaller-site decentralized deployment evidence are limited
  - - ACWA + SWPC ecosystem
    - Desalination / PPP award machine
    - 25-year WPA structures; state-backed prequalification and large bidder pools
    - Large-scale RO and public-private water projects in Saudi Arabia
    - Financing depth, procurement access, and long contract lock-in
    - Focused on large PPP projects rather than nimble decentralized reuse
  - - Veolia + Xylem
    - Global incumbent alternatives
    - €44.4B Veolia revenue; Xylem >23K staff and ~150 countries
    - Industrial, municipal, utility buyers seeking trusted vendors
    - Installed-base trust, disclosure depth, service capacity, and broad portfolios
    - Not positioned as simple pure-play WaaS and may be costlier or less tailored for niche deployments
  - - Jacobs / AECOM / internal build
    - Status-quo substitute
    - Long-lived engineering brands with full-water-cycle delivery
    - Owners that prefer EPC or retained control
    - Familiar procurement, desalination/reuse capability, and owner control
    - Keeps capital, compliance, and operating burden with the customer
  notes: Scale fields use only retained public signals; where exact revenue, customer count, or backlog are not public, the row uses the strongest disclosed proxy instead of fabricated precision.
