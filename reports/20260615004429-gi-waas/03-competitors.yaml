- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Route
  - Public pricing clue
  - Contract model
  - What is bundled
  - Implication
  rows:
  - - GI WaaS
    - Pay-per-use by cubic meters treated
    - Managed service / decentralized treatment
    - Treatment plus reuse orientation and reduced upfront investment
    - Commercial pitch is clear, but public terms, tenure, and discounts are not disclosed
  - - Seven Seas
    - Guaranteed price per 1,000 gallons in Alice example; no upfront capital
    - BOO / BOOT / long-term performance-based WaaS
    - Design, build, finance, operate, maintain, compliance, repairs
    - The strongest retained benchmark for how a water-outsourcing contract can replace design-build
  - - Ekopak
    - Customers pay only for liters consumed
    - Industrial Water-as-a-Service
    - On-site circular-water solution plus support and monitoring
    - Shows that usage-based billing is replicable and not unique to GI
  - - Metito / ACWA / SWPC
    - No public list tariff; project-level WPA economics
    - PPP / concession / BOO with long offtake
    - Financing, construction, operations, storage, and project-company equity
    - Pricing power comes from bankable bids and long contracts, not transparent catalog rates
  - - Veolia / Xylem / Gradiant
    - Low public list-price visibility
    - Project, service, and technology bundles
    - Treatment equipment, operations, service, analytics, and water-tech products
    - Incumbents and industrial challengers compete on outcomes and trust more than posted prices
  - - Internal build / EPC
    - Capital budget plus ongoing O&M burden
    - Design-bid-build or owner-operated EPC
    - Equipment, construction, handoff, then customer-owned operations
    - May look cheaper upfront, but keeps staffing, compliance, and repair risk on the buyer
  notes: The public record does not support fabricated tariff precision. This table focuses on contract shape and burden transfer, because that is what the retained sources actually disclose.
