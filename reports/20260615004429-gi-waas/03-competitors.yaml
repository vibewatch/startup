  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Contract-level pricing, discounting, and realized unit economics for GI, Seven Seas, Metito, Gradiant, and incumbent alternatives.
    whyItMatters: Without bid-level or customer-level economics, the chapter can compare burden transfer and contract shape but cannot underwrite margin durability or actual price competitiveness.
    diligencePath: Request anonymized proposals, signed water-service contracts, or customer references that disclose tariff structure, minimum volumes, escalation clauses, and operating guarantees.
    relatedQuestionRefs:
    - QP010
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: gi-disclosure-gap
    missingEvidence: Independent or customer-backed evidence on GI installed base, customer count, renewal history, and average contract tenure.
    whyItMatters: The strongest public competitive narratives from incumbents rely on referenceability and operating footprint, while GI's retained public pack is thin on those trust signals.
    diligencePath: Obtain customer logos with deployment detail, project list by segment, operating fleet metrics, and cohort-level renewal or uptime data from management.
    relatedQuestionRefs:
    - QP005
  - type: private-evidence-only
    severity: material
    topic: compliance-benchmarking
    missingEvidence: Side-by-side compliance, uptime, and lifecycle-cost benchmarks across GI, Seven Seas, Ekopak, and industrial challengers.
    whyItMatters: Direct rivals all claim compliance and sustainability benefits, but public marketing copy does not reveal whether one model produces measurably better operating outcomes.
    diligencePath: Ask for independent engineering reports, monthly compliance records, or customer scorecards comparing downtime, permit incidents, and reuse economics across vendors.
    relatedQuestionRefs:
    - QP013
  - type: missing-source
    severity: minor
    topic: gi-valuation
    missingEvidence: Independent reporting or filing-based corroboration of GI's claimed $1B valuation and unicorn status.
    whyItMatters: The valuation headline helps trust positioning, but investor or media corroboration would separate a promotional milestone from a verified market signal.
    diligencePath: Fetch independent funding coverage, investor announcements, or cap-table documentation that confirms round size, lead investors, and post-money valuation.
