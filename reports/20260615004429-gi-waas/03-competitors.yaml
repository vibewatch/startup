- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - GI moat or risk
  - Primary threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Decentralized nanotech process wedge
    - Gradiant and broader industrial-treatment incumbents can match reuse / compliance narratives
    - High
    - If outcomes are similar, larger references and procurement trust can dominate
    - Demand third-party performance data showing G-NANO changes cost, uptime, or reuse rates
  - - Usage-based commercial simplicity
    - Seven Seas and Ekopak already market comparable usage-based or no-capex structures
    - High
    - Commercial model alone is not proprietary
    - Test whether GI wins on deployment speed or customer segment fit rather than pricing language
  - - Saudi home-market positioning
    - SWPC prequalification and 70-firm shortlists favor capitalized, patient bidders
    - Very high
    - PPP ecosystems can screen out smaller entrants before product differentiation matters
    - Map GI's route to market by project size and by whether it can avoid formal PPP procurement
  - - Analytics / AI differentiation
    - Pani, Jacobs, Gradiant, and Xylem all market optimization or analytics layers
    - Medium to high
    - AI language can commoditize quickly if not tied to asset performance
    - Separate software features from plant-level economic outcomes during diligence
  - - Trust and disclosure gap
    - Veolia and Xylem provide far more public scale and reporting evidence
    - High
    - Large buyers often prefer vendors with stronger referenceability and public reporting
    - Obtain customer references, retention data, and disclosed operating metrics from GI
  - - Switching-cost upside if GI lands assets
    - Long-term WPA / BOO structures show that asset awards can create real lock-in
    - Medium opportunity, high execution bar
    - Winning early long-duration contracts could create durable revenue if GI can access them
    - Verify GI's balance-sheet capacity, financing partners, and contract-tenure history
  notes: Severity reflects underwriting danger, not a modelled probability. Each row is grounded in the retained public evidence plus the material information still missing from the record.
