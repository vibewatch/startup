- id: buyer-user-and-payer-map
  title: Buyer, user, and payer segmentation
  body: The buyer map is concentrated rather than diffuse. In public water production, transmission, storage, and sewage projects, the payer is usually a sovereign-backed entity such as SWPC or a state utility, and the user is the system operator rather than the household receiving the water. That centralization is important because it makes the market bankable but also concentrates go-to-market risk around a small set of institutional counterparties. Private demand is visible, but mostly through industrial and quasi-public sites rather than a broad SMB base. Miahona’s public project list shows industrial city concessions, a refinery-linked industrial wastewater plant at Ras Tanura, airport desalination, economic-city sewage treatment, and municipal O&M. Reuse and TSE are especially relevant because they target industrial and irrigation use cases where freshwater substitution has clear economic logic. Managed O&M, NRW reduction, and meter-to-cash also look closer to recurring service revenue
    than one-off plant construction.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
  tableRefs:
  - TM003
  figureRefs:
  - FM003
- id: growth-drivers-and-adoption-constraints
  title: Growth drivers, privatization logic, and adoption constraints
  body: 'The growth case is policy-backed and operationally grounded. Scarcity, urban growth, and industrial diversification all push Saudi Arabia toward desalination, wastewater reuse, and tighter network performance. Privatization and PPP law matter because they define the bankable delivery model; localization also matters because public sponsors want a domestic industrial base, not only imported plants. At the same time, the constraints are material. Desalination remains energy intensive, creates brine, and often requires long inland transmission routes plus strategic storage to reach demand centers. Reuse expansion is also not just a treatment-plant question; it requires networks, offtakers, quality assurance, and public or regulatory acceptance. For a GI WaaS entrant, this means timing matters: markets may be large on paper, but contracts clear only where offtake certainty, infrastructure readiness, and acceptable lifecycle economics line up.'
  claimRefs:
  - CM019
  - CM020
  - CM021
  - CM022
