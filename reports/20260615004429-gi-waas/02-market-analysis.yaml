company:
  name: GI WaaS
chapter:
  number: 2
  title: Market Analysis
  summary: GI WaaS should be underwritten against a narrow Saudi/MENA outsourced water-services market—especially desalination and treatment PPPs, TSE reuse, industrial concessions, and recurring O&M—rather than against all water infrastructure spend. Saudi policy and SWPC-led procurement create a large, state-backed pipeline, but public sizing data remain inconsistent because sources measure different slices of the stack, and adoption is still constrained by energy, transmission, and missing contract-level economics.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: GI WaaS should not be benchmarked against all water or infrastructure spending in Saudi Arabia. The investable market is the subset of water activity where an operator is paid for delivered treatment, reuse, reliability, or network performance under concession, BOOT, PPP, or managed O&M structures. That includes desalinated bulk-water offtake, treated-sewage-effluent reuse, industrial wastewater treatment, transmission or storage assets contracted on a service basis, and recurring O&M or non-revenue-water programs. It excludes consumer bottled water, household point-of-use devices, generic EPC revenue without a service relationship, and broad agricultural water consumption that never becomes a contracted service line. The substitute set is important because buyers can still rely on groundwater, self-owned plants, municipal supply, trucking, or defer reuse through cheaper efficiency fixes. That is why the relevant market is a service-governed reliability and compliance budget, not
    the whole national water balance.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM001
- id: evidence-constrained-sizing
  title: Multiple sizing lenses instead of one TAM
  body: 'Public sizing for Saudi water services is real but not harmonized. Official sources describe a system already operating at national scale, while commercial trackers describe different submarkets with different boundaries. SWA says the water system already exceeds 16.14 million cubic meters per day of production capacity and more than 7.81 million cubic meters per day of licensed wastewater-treatment capacity. Trade.gov frames the policy objective around 90 percent desalination reliance by 2030 and cites an $80 billion project push, while Arab News places MENA-wide desalination investment on a path from $39.3 billion in 2022 to $100 billion by 2030. Commercial publishers then layer on narrower slices: 6Wresearch estimates a $4.0 billion Saudi water-treatment market in 2026, while Ken Research values desalination technology and services at $6 billion on a 2024 base-year lens. Those figures are useful as lenses, not as a clean TAM/SAM/SOM stack, because they measure different scopes
    and time horizons.'
  claimRefs:
