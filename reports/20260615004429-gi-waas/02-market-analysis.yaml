  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A harmonized contract-type market map that separates desalination services, reuse/TSE delivery, transmission, and O&M into one GI-relevant SAM/SOM framework.
    whyItMatters: Public estimates range from roughly $4B to $6B but measure different boundaries, so underwriting off one number risks overstating or understating GI’s true serviceable market.
    diligencePath: Request management’s revenue split by contract archetype, geography, and buyer segment, then rebuild SAM/SOM from actual pipeline categories instead of external top-down reports.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Plant-level utilization, tariff reset mechanics, renewal history, customer churn, and gross-margin data for industrial reuse and managed O&M contracts.
    whyItMatters: The difference between an attractive WaaS business and a capital-heavy utility contractor often sits in utilization and renewal economics that public sources do not disclose.
    diligencePath: Obtain contract samples, cohort economics, and utilization reports from management or from public investors with direct plant-level disclosure.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: material
    topic: industrial-buyer-budgets
    missingEvidence: Public budget authority or water-spend disclosure for industrial cities, airports, and refinery-linked sites that would let investors rank buyer segments by addressable annual spend.
    whyItMatters: Buyer examples exist, but without disclosed water budgets it is difficult to size which end segment should be the first go-to-market wedge.
    diligencePath: Collect procurement records, concession disclosures, or customer interviews for industrial cities, airports, and giga-project utilities to estimate annual outsourced-water budgets.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: access-blocked
    severity: minor
    topic: listed-operator-filings
    missingEvidence: Directly fetchable local annual-report PDFs or richer investor decks for Saudi operators that would corroborate reuse volumes and contract economics beyond marketing pages.
    whyItMatters: Public operator websites prove segment presence, but richer filing-level artifacts would improve confidence in scale and economics claims.
    diligencePath: Pull IR PDFs or exchange disclosures directly from management or local filing systems and compare them with website project summaries.
    relatedQuestionRefs:
    - QM025
