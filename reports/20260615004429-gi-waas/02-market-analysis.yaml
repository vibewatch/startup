- id: diligence-gaps-and-underwriting
  title: Diligence gaps and underwriting implications
  body: 'The central underwriting conclusion is not that Saudi and MENA water demand are small; it is that GI WaaS still needs a narrower contract-level lens than public sources can provide. The strongest public evidence proves that state-backed PPP procurement, TSE expansion, industrial concessions, and O&M are active categories. What it does not prove is a GI WaaS-specific SAM or SOM broken down by buyer, utilization, tariff, churn, or margin. That gap matters because a narrow recurring-revenue model can look very different from a plant-development or EPC model even inside the same sector. Investors should therefore underwrite GI WaaS from the bottom up: target segment by segment, anchor on counterparties and contract structures, and treat broad market reports as context rather than as investable revenue forecasts.'
  claimRefs:
  - CM036
  - CM037
  - CM038
  - CM039
  - CM040
tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to GI WaaS
  rows:
  - - Desalinated bulk-water services
    - Long-term water offtake, BOOT/IWP operations, performance-linked supply
    - Generic EPC without service revenue, retail bottled water
    - SWPC / sovereign-backed offtaker
    - Core public-sector service market
  - - Wastewater and TSE reuse
    - STPs, ISTPs, reuse networks, recycled-water delivery
    - Untreated sewer collection without service monetization
    - Utilities, industrial sites, municipal or zone operators
    - Core reuse and circular-water wedge
  - - Industrial water outsourcing
    - Industrial wastewater treatment, refinery and industrial-city concessions, plant O&M
    - Standalone process equipment sales
    - Industrial-city operator, refinery, airport, economic-zone SPV
    - High-priority private or quasi-public wedge
  - - Transmission and strategic storage
    - IWTP and ISWR concessions where operator is paid for availability and throughput
    - Conventional civil works with no operating contract
    - SWPC, WTTCO, public sponsors
    - Adjacent but important because it unlocks inland demand
  - - Network and NRW services
    - Managed O&M, leak detection, meter-to-cash, service-quality programs
    - Ordinary municipal staffing and non-contracted maintenance
    - NWC or local utility budget owner
    - Recurring service revenue line
  - - Excluded broad water economy
    - General irrigation demand, household devices, bottled water, generic construction capex
    - N/A
    - Varies
    - Too broad to represent GI WaaS monetization
  notes: Boundary logic separates contracted water-service revenue from broader water demand, infrastructure capex, and consumer products.
