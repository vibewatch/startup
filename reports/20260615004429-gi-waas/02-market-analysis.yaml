      detail: MENA desalination and related water investment is scaling toward a $100B 2030 backdrop.
    - label: Saudi national system scale
      detail: Saudi water-system production already exceeds 16.14m m3/day with large wastewater and transmission footprints.
    - label: Saudi PPP and treatment pipeline
      detail: SWPC-linked desalination, ISTP, SSTP, pipeline, and storage programs define the bankable project pool.
    - label: GI WaaS near-term serviceable wedge
      detail: Industrial reuse/TSE, recurring O&M, and PPP-adjacent industrial or utility contracts are more realistic than the whole water stack.
  approximationNotes: The layers are lenses rather than additive revenue buckets; they intentionally move from sector scale to the narrower recurring-service wedge relevant to GI WaaS.
