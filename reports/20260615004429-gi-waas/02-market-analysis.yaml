- id: FM004
  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: The market only becomes recurring GI WaaS revenue after a water problem turns into a qualified site, a financed contract, and a live operating asset.
  data:
    items:
    - label: Water-stress or compliance problem
      value: 100
      unit: index
      note: Scarcity, reuse targets, or service-quality gaps create budget attention.
    - label: Institutional sponsor and project framing
      value: 72
      unit: index
      note: A utility, sovereign offtaker, or industrial site defines scope and procurement path.
    - label: Qualified network or site readiness
      value: 48
      unit: index
      note: Transmission, TSE network, or industrial integration must be technically feasible.
    - label: Financed long-term contract
      value: 26
      unit: index
      note: PPP, concession, or managed O&M terms need bankable economics and counterparty clarity.
    - label: Recurring service revenue at scale
      value: 12
      unit: index
      note: Only a small subset converts into repeatable GI-style recurring service revenue.
  approximationNotes: Index values are illustrative stage weights rather than observed conversion rates; they summarize where the reviewed evidence suggests contracts narrow.
