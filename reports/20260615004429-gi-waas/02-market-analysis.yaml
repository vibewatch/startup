- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for GI WaaS
  - Diligence ask
  rows:
  - - Structural water scarcity and groundwater depletion
    - Positive
    - Now through 2030
    - Supports durable demand for desalination, reuse, and network efficiency
    - Which segments have the most urgent non-potable substitution needs?
  - - SWPC-led PPP and privatization framework
    - Positive
    - Now through 2030
    - Improves bankability and creates repeatable procurement channels
    - Where can GI partner rather than bid as a primary asset developer?
  - - Renewable-powered RO and tariff declines
    - Positive
    - Near term
    - Improves lifecycle economics for service operators
    - Which projects truly have renewable integration and bankable energy assumptions?
  - - Localization and local-content requirements
    - Mixed
    - Current
    - Can favor partnership-led entry and local execution capacity
    - What local-content threshold will GI need to meet in target tenders?
  - - Energy intensity, brine, and transmission distance
    - Negative
    - Current and structural
    - Raises operating risk and slows pure desalination-led expansion
    - Which GI offerings reduce energy, brine, or inland-delivery burden?
  - - TSE network, utilization, and data opacity
    - Negative
    - Current
    - Reuse opportunity is real but public data do not reveal realized margins or utilization
    - What are actual contracted volumes, tariffs, and renewal rates by segment?
  notes: The constraint rows matter as much as the growth rows because GI WaaS must win on delivered economics and contract quality, not just on macro water scarcity.
