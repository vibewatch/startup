        - 若合同持续服务，可能形成经常性用量收入
        - 要求提供前 10 大合同，包括水价、期限、最低承购量和续约机制
      - - 交钥匙水厂 / 出口项目交付
        - 特定项目的水厂交付或出口里程碑收入
        - 法国出口据报约 €5M
        - 可能在服务费之外形成不均匀的里程碑收入
        - 要求提供项目会计政策，以及设备与服务收入拆分
      - - 工业场站 O&M 与托管运营
        - 供应商为客户运营、维护并优化水务资产
        - 行业可比方提供方向性支持；GI 特定披露有限
        - 若嵌入长期合同，可能平滑收入
        - 要求提供 O&M 范围、人力模型，以及按合同类型的利润率桥
      - - 移动 / 临时部署服务
        - 为缺少永久管网的场站提供快速部署处理单元
        - 官方移动水厂定位和 Jeddah 快速部署叙事支持这一点
        - 可能拿到溢价定价，但也可能推高物流成本和利用率风险
        - 要求提供利用率历史、运输成本和停机指标
      - - 回用 / ESG 绑定的伙伴服务
        - 回用绩效绑定可持续或净零项目
        - NetZero MoU 已公开，但商业条款未公开
        - 潜在相邻收入层仍未验证
        - 要求提供伙伴主导项目的已签商业排期或试点发票
    notes: 各行将公开计费逻辑与仍不清楚的收入确认拆开。公开证据至少支持一条按用量计费的服务收入流和一条项目交付收入流；但未披露已实现定价、合同期限或收入结构。
