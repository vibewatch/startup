  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - GI 护城河或风险
      - 主要威胁
      - 严重程度
      - 重要性
      - 缓释措施 / 尽调问题
    rows:
      - - 去中心化纳米技术工艺切口
        - Gradiant 和更广泛的工业处理既有玩家可以匹配回用 / 合规叙事
        - 高
        - 若结果相近，更大的案例基础和采购信任会占上风
        - 要求第三方绩效数据，证明 G-NANO 改变成本、正常运行时间或回用率
      - - 按用量计费的商业简洁性
        - Seven Seas 和 Ekopak 已在营销类似的按用量或零资本开支结构
        - 高
        - 单靠商业模式并不专有
        - 测试 GI 赢单靠的是部署速度或客户细分匹配，而不是定价话术
      - - 沙特本土市场定位
        - SWPC 预审和 70 家公司短名单偏向资本充足、耐心较强的投标方
        - 很高
        - PPP 生态可能在产品差异化发挥作用前，就筛掉较小进入者
        - 按项目规模以及能否绕开正式 PPP 采购，梳理 GI 的市场进入路径
      - - 分析 / AI 差异化
        - Pani、Jacobs、Gradiant 和 Xylem 都在营销优化或分析层
        - 中至高
        - 若 AI 话术没有绑定资产绩效，可能很快商品化
        - 尽调时将软件功能与水厂层面的经济结果拆开
      - - 信任与披露缺口
        - Veolia 和 Xylem 提供的公开规模与报告证据多得多
        - 高
        - 大型买方往往偏好案例可核验、公开报告更强的供应商
        - 向 GI 获取客户推荐、留存数据和已披露运营指标
      - - 若 GI 落地资产，切换成本存在上行空间
        - 长期 WPA / BOO 结构显示，资产中标可以形成真实锁定
        - 中等机会，执行门槛高
        - 如果 GI 能拿到早期长周期合同，可能创造耐久收入
        - 核验 GI 的资产负债表承载力、融资伙伴和合同期限历史
    notes: 严重程度反映承销风险，而不是模型化概率。每行都基于保留下来的公开证据，以及记录中仍缺失的重大信息。
