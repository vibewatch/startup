        - 沙特大型 RO 和公私合营水务项目
        - 融资纵深、采购入口和长合同锁定
        - 重心在大型 PPP 项目，而非灵活的去中心化回用
      - - Veolia + Xylem
        - 全球既有替代方案
        - Veolia 收入 €44.4B；Xylem 员工 >23K，覆盖约 150 个国家
        - 寻找可信供应商的工业、市政、公用事业买方
        - 装机基础信任、披露深度、服务能力和宽产品组合
        - 并非简单纯 WaaS 定位；对小众部署可能更贵或定制程度更低
      - - Jacobs / AECOM / 自建
        - 现状替代方案
        - 长寿命工程品牌，交付覆盖全水周期
        - 偏好 EPC 或保留控制权的业主
        - 熟悉的采购方式、海水淡化 / 回用能力和业主控制
        - 资本、合规和运营负担仍留给客户
