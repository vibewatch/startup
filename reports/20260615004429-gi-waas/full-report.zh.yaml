      - number: '8.3'
        title: 牛市、基准与熊市框架，以及明确入场纪律
        blocks:
          - type: paragraph
            body: >-
              牛市情形很直接：GI
              已经有公开部署案例、与沙特复用优先事项一致的服务模式、出口证据，以及受益于主权水务重投入的品类故事。如果这些部署背后有真实签约的经常性处理量、有吸引力的复用经济性和干净的清算优先权结构，那么被报道的独角兽估值可能最终会显得是早了，而不是虚高。反方假设在当前公开证据上更强。GI
              目前更像一个掌握有前景水务技术的新兴项目开发商，而不是披露透明的平台型企业。公开可比股票按已披露收入和申报文件定价；沙特 PPP
              经济性有吸引力，但建立在结构化承购和基础设施式回报之上。这个缺口说明情景区间应保持宽。约 $0.2B-$0.4B 的熊市情形，适合证据薄弱的叙事轮和有限合同证明；约 $0.4B-$0.8B
              的基准情形，适合已有真实进展但经济性缺失；约 $0.8B-$1.2B
              的牛市情形，则要求私有数据室同时验证规模和质量。因此，入场纪律必须冷酷：要么以远低于标题估值的价格买入，要么在只能接近标题估值进入时，要求硬性的结构性保护。
