        - 大型纯水务技术基准，拥有真实公用事业和工业暴露。
        - 比 GI 多元化得多，披露也充分得多。
      - - Ecolab
        - $74.69B
        - $16.08B
        - ~4.6x
        - 高端水务与卫生相邻运营商，展示更高质量公开市场倍数可能是什么样。
        - 更广的化学品和卫生业务组合让它估值更丰富，也与 GI 可比性更弱。
      - - Tetra Tech
        - $7.37B
        - $5.13B
        - ~1.4x
        - 基础设施和环境服务基准，适合对照项目执行较重的企业。
        - 咨询和工程组合不同于 GI 的模块化处理模式。
      - - Mueller Water Products
        - $4.04B
        - $1.46B
        - ~2.8x
        - 水务基础设施硬件和网络基准，有助于框定中档公开市场倍数。
        - 产品较重，利润结构和客户周期不同。
      - - Badger Meter
        - $3.84B
        - $0.89B
        - ~4.3x
        - 较高倍数的智能水务 / 计量可比公司，显示质量和披露能够获得什么定价。
        - 计量和数据组合比 GI 资本密集型污水部署更干净。
    notes: 公开市场倍数只作为方向性支撑。GI 缺少已披露收入基数，无法把这些倍数直接映射成单一公允价值。
