      - number: '5.3'
        title: 部署验证、集成与可靠性信号
        blocks:
          - type: paragraph
            body: >-
              GI 有真实公开部署验证，这是本章最强部分。Jeddah El Musa 页面提供了一个去中心化城市案例，关联 Saudi Water Authority 场景、灌溉水质回用和监测框架；Riyadh
              Industrial City 提供了一个更大的地下工业案例，围绕 100% 回用和无异味运营展开；ARASCO 提供较小的 500 m³/day 工业参考；Hajj
              屠宰场案例展示了峰值季节负荷下的移动集装箱化部署。独立出口报道又增加两个有用信号：第一，法国化妆品厂项目按每立方米处理模式公开宣布，金额约 €5 million；第二，Bahrain 和更广泛 GCC
              发货被定位在 2026 年初。这些来源证明 GI 并非纯概念。但同一记录尚未证明正常运行时间、维护人员配置、备件韧性、警报响应或支持 SLA。可靠性因此由具名部署和重复使用场景支撑，而不是由公开运营统计支撑。
