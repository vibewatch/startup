      - number: '5.2'
        title: 工艺与运营架构
        blocks:
          - type: paragraph
            body: >-
              最具体的公开技术披露，是 G-NANO 工艺叙事。GI 的技术页把流程拆成 pH
              调节、氧化、带正电捕获阶段、絮凝、污泥分离和污泥减量；配套博客重申了非生物处理逻辑，即把污染物转化为紧凑、可再利用污泥。这些步骤仍是营销级描述，而不是完整工程数据表，但已经足以说明 GI
              销售的是化学-物理处理架构，而不是活性污泥的软件覆盖层。围绕核心工艺的包装架构也相当清楚：G-NANO
              可封装为集装箱化单元、移动单元、地下工业水厂和外挂增容模块。关于集成传感器、预测性警报、内置水质测试和质量框架的公开说法，暗示某种仪表化层存在；但 GI 没有发布网络架构、SCADA 接口、historian
              集成或 API 文档。对尽调来说，这意味着工艺核心比数字集成层描述得更清楚。
