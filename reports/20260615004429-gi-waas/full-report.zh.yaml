  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：谁购买、谁使用、谁可能付款
        blocks:
          - type: paragraph
            body: >-
              GI 的具名验证集在用例上比在客户数量上更多元。公开记录至少支持六类买方原型：ARASCO 等农工业运营商；Riyadh Industrial City 和 Saudi Water Authority 关联的
              Jeddah El Mousa 项目等工业区或城市基础设施相关方；围绕 Hajj 屠宰场负荷的季节性公共服务运营方；Bab Samhan Hotel
              等酒店或地产运营商；未具名法国化妆品工厂等国际工业制造商；以及通过 Bahrain 的 Tahliya
              进行的伙伴主导海湾扩张。在每个案例中，买方、用户和付款方未必是同一方。酒店运营商可能付款，而客人永远看不到系统；公共机构可能赞助社区安装，而灌溉或卫生主体使用产出；伙伴主导的出口可能依赖本地渠道拥有客户关系。


              这种角色拆分很关键，因为它让 GI 更像一个套着服务包装的项目型基础设施销售方，而不是简单的 SaaS 式账户基础。GI 项目索引按生活、工业、农业和季节性应用分组，也强化了这一判断。Trade.gov 和
              Sharakat/SWPC 材料还显示，更大的沙特水务机会由采购驱动，并常受公共机构、PPP 结构或本地市场中介居中影响。结果是，GI 的公开细分宽度可信，但终端客户的商业所有权在各细分之间并不均衡。
