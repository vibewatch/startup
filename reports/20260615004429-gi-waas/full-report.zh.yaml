  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究；今天不应把头部独角兽估值作为干净买入价来承销。
        - 等到经济性被验证，或条款显著改善后，再为上行付费。
      - - 估值立场
        - 以当前公开证据看偏紧；只有牛市情景能支撑。
        - 把 >$1B 视为已报道的头部数字，而非尽调清算后的价格。
      - - 置信度
        - 中。
        - 证据足以支撑怀疑，但不足以给出精确估值。
      - - 风险评级
        - 高。
        - 经济性缺失、网站 QA 问题和未知优先权堆栈，形成不对称下行。
      - - 最可支撑的定位
        - 资本密集型水务服务 / 工业水务平台，不是软件。
        - 用情景区间和结构保护，而不是单一目标倍数。
      - - 进入纪律
        - 要么以明显低于已报道独角兽估值的折扣投资，要么要求高级别保护和里程碑分批出资。
        - 不接受按头部条款只暴露在价格上的结构。
      - - 可能退出路径
        - 再来一轮私募或战略融资，看起来比近期 IPO 更可信。
        - 按私募市场延续来承销，而不是按立即具备公开市场准备度来承销。
      - - 上调触发项
        - 数据室签署文件证明经常性合约水量、利润率和干净轮次条款。
        - 会让接近头部估值的价格更容易辩护。
      - - 主要下行触发项
        - 证据显示轮次条款偏弱、优先权很重，或经常性经济性偏薄。
        - 会把案例推向熊市区间，甚至转向回避。
    notes: 该建议明确依赖证据和价格；并不是说 GI 没有真实技术或市场机会。
    claimRefs:
      - CV034
      - CV039
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 维度
      - 牛市论点
      - 反向论点
      - 什么会改变判断
    rows:
      - - 融资信号
        - 公司在 Series A 后被公开报道估值超过 $1B，暗示真实赞助方兴趣。
        - 详细经济性来自薄弱的二手报道，而不是已披露的投资人文件。
        - 投资人侧确认签署条款和完整股权结构。
      - - 产品与服务模式
        - 按立方米付费处理和模块化 G.NANO 单元，契合庞大且供给不足的污水与回用问题。
        - 公开材料更能证明叙事，而不是证明持久单位经济性。
        - 经验证的客户批次、按部署类型拆分的毛利率，以及留存 / 续约数据。
      - - 商业证明
        - Riyadh、Hajj、Jeddah、ARASCO 和出口参照表明 GI 已在现场运营。
        - 展示项目和工厂叙事不等于已签约的经常性现金流。
        - 待履约订单、最低用量承诺和客户级收入桥。
      - - 市场结构
        - 沙特水务需求、私有化和 SWPC 式采购，带来真实需求顺风。
        - 沙特水务 PPP 可以融资，但指向的是基础设施回报和长周期执行，不是软件速度。
        - 证明 GI 即便面对类似基础设施的成本和时间线，也能以有吸引力的回报扩张。
      - - 可比定位
        - 公开水务和环境可比公司显示，该类别可以出现较大权益价值。
        - 这些可比公司披露收入和文件；GI 没有，因此战略溢价的举证压力很高。
        - 披露收入基数，使相对估值成为可能。
      - - 披露质量
        - 公司已有足够公开材料展示野心、部署和政策契合。
        - 官方域名污染和未知优先权包袱，削弱了管理质量信号的可信度。
        - 清理后的披露界面，以及经审计 / 投资人级别尽调包。
    notes: 反向论点主要由证据质量和资本密集度担忧驱动，并非不相信沙特污水回用是重要市场。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV011
      - CV012
      - CV015
      - CV018
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间
      - 关键假设
      - 主要失败模式
    rows:
      - - 熊市
        - 25%
        - $0.2B-$0.4B
        - 已报道的独角兽轮次证明赞助方兴趣，但不能证明经济性强；经常性合约水量有限，投资人保护很重。
        - 尽调发现收入质量薄、优先权重，或商业化过度依赖展示项目。
      - - 基准
        - 55%
        - $0.4B-$0.8B
        - GI 有真实部署、真实政策顺风和战略价值，但公开证据仍无法证明值得支付完整头部估值。
        - 利润率、现金转化或待履约订单质量无法支撑高溢价私募市场承销。
      - - 牛市
        - 20%
        - $0.8B-$1.2B
        - 私有尽调确认真实经常性水量、强回用经济性、可扩张部署和干净轮次条款。
        - 商业证明仍停留在轶事，或资本密集度吞噬服务利润率。
      - - 概率加权中心观点
        - 100%
        - 约 $0.5B-$0.7B
        - 权重偏向基准情景，因为市场需求看起来真实，而 GI 自身经济性仍未披露。
        - 尽调补齐缺口前，如果按接近头部估值高价进入，安全边际很薄。
    notes: 这些情景区间有意设得很宽，用来保留不确定性；并非精确的模型估值输出。
    claimRefs:
      - CV034
      - CV036
      - CV037
      - CV039
      - CV040
      - CV042
      - CV043
      - CV045
  - id: TV004
    title: 可比估值表
    columns:
