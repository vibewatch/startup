      - number: '7.5'
        title: 监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              对 GI
              的监测逻辑应该极其务实。投资人不需要完美信息来判断风险是上升还是下降；他们需要一小组可观察触发点。第一是披露改善：如果公司仍不能提供客户集中度、合同期限、收入结构和股权结构清晰度，时间就没有在帮投资假设。第二是证据广度：再多一个样板项目，不如看到重复部署、更干净的运营指标，以及老场址持续在线的证据。第三是融资质量：一家真正具备基础设施级可重复性的公司，应当能按与其公开叙事匹配的条件筹到项目或资产资本。第四是领导层冗余。如果
              Dr. Sherif Desouky 仍是唯一清晰可见的高管锚点，而增长计划又在地域上扩宽，关键人风险会继续高企。因此，审慎承销应把 GI
              视为「继续研究」，直到这些指标朝正确方向移动；如果合规、融资或领导层连续性恶化，则应转为更坚决的放弃。
