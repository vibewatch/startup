    sections:
      - number: '1.1'
        title: 身份、版图与运营模式
        blocks:
          - type: paragraph
            body: >-
              GI WaaS 自称是一家采用 water-as-a-service 模式的沙特水务基础设施初创公司，但公开证据主要来自 GI Aqua Tech 的企业网站和活动资料，而不是独立的 GI WaaS
              披露包。第三方报道一致将 GI WaaS 描述为德国 GI Aqua Tech 的关联方或子公司，官方联系页则同时列出利雅得办公室和德国 Groß-Gerau
              总部。这个双重版图很关键，因为可见公司历史有层次：GI Aqua Tech 自己的公司页称业务成立于 2016 年，但当前可见的德国 GmbH 注册记录始于 2021 年末。商业模式比法律结构清楚得多：GI
              WaaS 以按立方米付费或零 CAPEX 模式销售去中心化污水处理，由 GI Aqua Tech 为市政、工业、酒店和活动驱动场景的客户部署并运营设备。因此，本报告将 GI WaaS
              视为一个真实运营、有沙特活动可见的平台，但尚不能视为一家披露透明的独立企业发行主体。
