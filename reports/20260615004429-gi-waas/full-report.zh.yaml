      - number: '2.2'
        title: 用多组测算视角替代单一 TAM
        blocks:
          - type: paragraph
            body: >-
              沙特水务服务的公开规模真实存在，但口径并不统一。官方来源描述的是已经在全国尺度运行的系统，商业追踪机构则用不同边界描述不同子市场。SWA 称水系统产能已超过每日 16.14 million
              m³，持牌污水处理能力超过每日 7.81 million m³。Trade.gov 将政策目标框定为到 2030 年 90% 依赖海水淡化，并引用 $80B 项目推进；Arab News 则认为 MENA
              海水淡化投资将从 2022 年的 $39.3B 走向 2030 年的 $100B。商业出版商再叠加更窄切片：6Wresearch 估计 2026 年沙特水处理市场为 $4.0B，Ken Research 则以
              2024 年基年视角将海水淡化技术与服务估为 $6B。这些数字适合作为观察镜头，而不是干净的 TAM/SAM/SOM 分层，因为它们衡量的范围和时间跨度不同。
