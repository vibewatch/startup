      - number: '2.4'
        title: 增长驱动、私有化逻辑与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑有政策背书，也有运营基础。水资源稀缺、城市增长和工业多元化都推动沙特走向海水淡化、污水回用和更严格的管网绩效。私有化和 PPP
              法律很重要，因为它们定义了可融资的交付模式；本地化同样重要，因为公共赞助方想要的是本土工业基础，而不只是进口水厂。与此同时，约束也很实在。海水淡化仍然耗能高，会产生浓盐水，并且常需要长距离内陆输水和战略储水才能触达需求中心。回用扩张也不只是处理厂问题；它还需要管网、承购方、质量保证，以及公众或监管接受度。对
              GI WaaS 这样的进入者来说，时机因此很关键：市场纸面规模可能很大，但只有当承购确定性、基础设施就绪度和可接受全生命周期经济性同时对齐时，合同才会落地。
