      - number: '5.5'
        title: 信任、安全、合规、隐私与明确公开缺口
        blocks:
          - type: paragraph
            body: >-
              GI 的公开产品页确实提出质量和合规主张：Jeddah 称有灌溉水质出水和监测框架；Riyadh 声称合规排放或回用；生活污水营销强调连续监测和健康保护；IFAT
              材料承诺以合规为导向的部署。但审阅到的公开层面没有发布实验室报告、可下载证书或公开审计包，外部尽调团队无法独立验证这些结果。最大的信任缺口不在污水化学，而在网站本身的数字和法律表层。隐私政策仍带有
              “Interim Agency” 模板品牌，条款页标着 “Verdant”，两者还保留本应发布前填完的占位字段。这并不能否定 GI
              水厂质量，但会削弱外部对公开治理卫生的信心，也让笼统的网站安全话术更难被采信。同样，审阅范围未暴露任何公开状态页、信任门户、正常运行时间历史或机器可读认证登记。因而，本章把公开合规主张视为方向上正面，但证据不完整。
