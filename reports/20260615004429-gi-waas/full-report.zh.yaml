  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              GI 的公开产品最好理解为围绕模块化处理厂搭建的现场污水处理服务，而不是纯软件平台或一次性 EPC
              水厂销售。客户反复要完成的工作，是把难处理污水流——城市片区污水、工业废水、屠宰场废水或混凝土厂冲洗水——在现场处理，然后回用或安全排放，而不必先建一座传统永久水厂。便携式、移动式、可扩展和新一代产品页拼出一张连贯交付图：临时或偏远需求用集装箱化或车载移动单元；超负荷既有水厂用棕地升级模块；更大的市政或工业用户用紧凑型高容量水厂。独立
              IFAT 和 Aquatech 材料部分印证了这一框架，描述了零 CAPEX WaaS
              定位、行业宽度，以及移动式与便携式的不同产能范围。仍停留在声称、尚未验证的，是每个工作流背后的具体合同结构——公开页面不发布费率表、最低水量承诺或服务级别协议。
