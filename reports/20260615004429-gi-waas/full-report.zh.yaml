      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方图谱较集中，而不是分散。在公共供水、输水、储水和污水项目中，付款方通常是 SWPC 或国有公用事业等主权支持实体，用户则是系统运营方，而不是最终收到水的家庭。这种集中度很关键：它让市场具备可融资性，也把
              go-to-market 风险集中到少数机构交易对手。私人需求可见，但主要来自工业和准公共场地，而非广泛 SMB 客群。Miahona 的公开项目清单包括工业城特许经营、Ras Tanura
              炼厂相关工业污水厂、机场海水淡化、经济城污水处理和市政 O&M。回用和 TSE 尤其相关，因为它们面向工业和灌溉场景，淡水替代有明确经济逻辑。托管 O&M、NRW 降低和 meter-to-cash
              也比一次性建厂更接近经常性服务收入。
