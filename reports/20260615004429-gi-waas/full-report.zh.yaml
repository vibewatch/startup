      - number: '3.4'
        title: 护城河耐久度取决于证明 GI 不只是融资包装或 AI 叙事
        blocks:
          - type: paragraph
            body: >-
              GI 最好的公开护城河主张，是去中心化纳米技术处理、回用与合规定位，以及按立方米付费商业包装的组合。这是一个真实切入口，尤其适合想要水处理、但不愿承担沉重前期 CAPEX
              或内部运营复杂度的客户。但保留的负面证据也很有分量。Seven Seas 证明，供应商持有资产、按绩效付费的水务外包已有长期运营历史和大规模已装水厂数量。Metito 和 ACWA
              证明，在海湾地区，采购可能早在奖励初创公司新意之前，就先偏向融资方和联合体组织者。Veolia 和 Xylem 证明，在位者仍拥有资本、服务密度和披露纪律，足以把技术叙事吸收到更大的平台里。


              另一项风险来自功能层商品化。Gradiant、Xylem、Jacobs 和 Pani 都使用围绕分析、优化、AI 或运营智能的话术。如果这些功能变成标配，GI 就不能只靠数字化语言；它需要证明 G-NANO
              加去中心化交付能改变总成本、许可摩擦、正常运行时间或回用结果，而且通用在位者无法快速复制。公开盲点在这里很关键。保留的 GI
              来源没有披露已装机基数、客户数量或合同期限，独角兽说法在本资料包中仍来自公司自述。除非用独立推荐和客户证据补上这些洞，否则 GI 的护城河看起来有希望，但尚不足以耐久到可以排除商品化或替代风险。
