      - number: '7.2'
        title: 披露、治理与公司结构风险
        blocks:
          - type: paragraph
            body: >-
              第一类硬风险是治理质量信号。GI
              的官方网站足以传达野心，却不足以建立尽调信心。评论页被污染不是外观问题；它说明公开披露界面的质量控制很弱。同样模式也出现在融资材料里：估值报道的标题存在，但核心经营披露缺失。更重要的是，公开材料没有清楚串起德国
              GmbH
              注册记录、沙特运营公司，以及在沙特日益收紧透明度制度下会被关注的受益所有权链条。这一点很关键，因为沙特监管现在要求受益所有权数据在注册、税务、银行和牌照记录之间保持同步。公司可以业务真实，但如果所有权地图、控制权和法律实体难以对齐，仍会制造严重尽调风险。对一家被按独角兽规模讨论的创业公司来说，这是实质性治理缺口，不是普通私营公司披露不足。
