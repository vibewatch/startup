      - number: '5.4'
        title: 差异化、棕地路线图，以及哪些是声称、哪些已验证
        blocks:
          - type: paragraph
            body: >-
              公开差异化故事在官方和独立材料之间保持一致：GI 声称比传统水厂部署更快、占地更少、能耗更低、无异味运营、可模块化扩容，并能回收或回用污泥副产物。其中部分主张至少得到局部交叉印证——Aquatech 和 IFAT
              资料重复了远程控制、预测性警报和产品尺寸区分，出口报道也重复了法国用例、100% 回用框架和节能叙事。2026 年 IFAT Munich 活动尤其重要，因为它把 GI
              叙事从绿地去中心化水厂拓宽到在不新增土地或停机的情况下升级既有污水资产。这在已安装基础设施内部打开了更大的运营切口。不过，若用于承销，若干差异化点仍验证不足：公开层面没有披露专利号、详细认证文件、长期实测
              OPEX 或模块级故障率。正确读法是，GI 的战略方向和市场定位清晰可见，但最深的技术护城河在公开材料中更多是声称，而非证据。
