      - number: '3.3'
        title: 在位者和替代方案带来渠道、采购信任与锁定能力
        blocks:
          - type: paragraph
            body: >-
              对 GI 结构性威胁最大的竞争者，可能根本不把自己包装成初创 WaaS 同行。Metito 公开称自己是 PPP 和长期特许经营专家，在新兴市场采用 BOT、BOO、BOOT 和 TOT 结构。ACWA 的
              Ras Mohaisen 项目展示了这种采购动作的实际形态：25 年购水协议、300,000 m3/day 反渗透产能，以及吸引 44 家公司表达兴趣、再缩小到 13 家合格投标人的国家采购机器。SWPC
              更广泛的预审项目和 70 家公司短名单进一步强化了这一点。在 GI 本土市场，外包水务不是一片空白绿地；它是一个拥挤、由机构居中撮合的采购场，偏好具备融资深度、联合体组建能力，并能承受漫长招标周期的投标方。


              Veolia 和 Xylem 带来另一种压力。Veolia 报告 2025 年收入 €44.4B，并把 Water Technologies 列为增长引擎；Xylem 公开强调拥有超过 23,000
              名员工、业务覆盖约 150 个国家，并披露完整年报。即便这些公司不使用同样的 WaaS 品牌，它们仍能给买方提供 GI
              目前无法以同等公开深度证明的东西：已验证规模、报告透明度和广泛服务能力。替代路径同样可信。Jacobs 和 AECOM
              都销售覆盖回用和海水淡化的全水周期交付，这意味着许多买方仍可选择工程师主导或业主自营路径，而不是长期外包平台。替代压力限制了 GI 的垄断式定价，也提高了证明更低全生命周期成本或更快部署的必要性。
