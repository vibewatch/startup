      - number: '6.3'
        title: 留存、耐久性与新鲜度：已证明什么、仍缺什么
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据明显弱于公开部署证据。审阅来源均未披露客户数、NRR、GRR、流失、续约率、平均合同期限、最低水量承诺或头部账户收入占比。最好的耐久性代理指标，是 Riyadh Industrial
              已运行时间，其次是 Samhan Hotel 处理所有污水类型满一年的独立说法。这些信息有用，因为它们表明 GI 能在调试后继续留在现场，但它们不能替代续约或计费证据。


              Hajj 页面方向上有帮助，但也提出警示。GI 分别维护 1444H 和 1445H
              屠宰场处理页面，暗示该用例具备重复性；但公开记录没有讲清这些页面代表连续续约合同、不同年度部署，还是部分重复的案例叙事。同样，France 和 Bahrain
              展示的是进入新地域，而不是原有沙特安装基础内的留存。投资者应使用公开资料包排序证据质量和新鲜度，而不是推断队列经济性。留存仍是私人尽调问题；缺少客户侧证言、评论平台数据或买方侧授标通知，也让满意度和粘性大多无法验证。
