            body: >-
              GI
              最终可能证明自己是一家强劲的沙特废水处理企业，但公开证据包目前仍像营销材料，而不是投资级基础设施披露。这很重要，因为下一次融资事件很可能不仅看增长野心，也会看收入质量、结构和运营可靠性能否终于对齐。在那之前，治理风险应被当作核心承销变量。
