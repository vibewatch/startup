      - number: '7.3'
        title: 运营、资本强度与技术验证风险
        blocks:
          - type: paragraph
            body: >-
              GI 的产品故事方向上有吸引力，但运营负担更接近工业基础设施，而不是轻量软件部署。整个水务行业正在公开面对大额资本需求、更慢交付周期、人员约束和更严监管时点。可比 WaaS
              叙事也给出同一教训：即使客户需求真实，服务商仍要为资产融资、管理许可、长期维护可靠性，并在经常性现金流被证明前承受营运资本压力。Bluefield 关于 Ekopak
              的说明尤其相关，因为它展示了一家复用公司如何在旗舰项目仍在验证时，就遭遇流动性压力和披露审查。GI
              自己的公开材料没有给出可抵消这些担忧的正常运行时间、SLA、故障率或独立验证数据。法国出口和计划中的海湾扩张是正面商业信号，但也在公司公开证明广泛装机基础、可重复性和运营统计数据之前，就把执行边界拉宽了。
