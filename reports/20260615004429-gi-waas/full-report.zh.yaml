      - number: '6.4'
        title: 扩张路径、渠道依赖与集中风险
        blocks:
          - type: paragraph
            body: >-
              乐观情形是，GI 似乎已经找到几个去中心化细分场景：速度、占地小、无异味运行和复用经济性，比大型项目规模更重要。ARASCO、Jeddah El Mousa、Samhan Hotel 和 Hajj
              场址都指向一类客户或赞助方——他们面对的是难处理废水、受限场地，或必须快速部署。这是一条有吸引力的扩张切口，因为 GI 打的是模块化部署，而不是沙特海水淡化和重工业复用里常见的巨型 PPP
              资产负债表。ARASCO 的可持续发展姿态也说明，GI 能卖给有明确节水要求的买方；法国化妆品交易则暗示，技术门槛高的工业细分场景可能也能跨境复制。


              需要谨慎的是，可见证据集仍然很小，而且高度集中在沙特。Trade.gov、Smart Water、Sharakat、Metito、Veolia、Miahona 和 Zawya
              描述的都是同一个市场：大型废水买方往往通过长期 PPP 或特许经营结构采购，同时附带本地化、牌照和投标准备要求。也就是说，账户规模变大后，GI
              可能需要合作伙伴、渠道，或选择性卡位细分场景，而不是单纯直销。巴林已经通过 Tahliya 呈现出伙伴驱动特征，NetZero 和 Aramco
              也更像关系信号，而不是已签合同。因此，公开证据支持真实采用和可行扩张，但也要求明确警惕渠道依赖、旗舰场址集中，以及少数样板项目夸大客户多元化的风险。
