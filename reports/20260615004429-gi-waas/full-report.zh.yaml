        - id: n5
          label: 合作伙伴牵头或相邻行业跟进
        - id: n6
          label: 持久、多元化的项目组合收入
    approximationNotes: 这张图反映公开证据暗示的采用顺序，而不是公司披露的内部销售漏斗。
