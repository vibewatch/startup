  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局分层：直接 WaaS 同行、工业邻近者、在位巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              读懂 GI WaaS 战场，最清晰的方法是把市场拆成四层。第一层是直接 Water-as-a-Service 同行，明确销售按使用量计费或无需前期资本投入的水务基础设施：Seven Seas Water
              Group 和 Ekopak 是保留的最强可比公司，因为两者都公开描述客户只为已消耗水量付费，由供应商承担设计、运营和维护责任。第二层是 Gradiant
              等工业高级处理挑战者；它们不围绕同一融资叙事展开，但在买方需要高性能回用、ZLD、PFAS、UPW 或 AI 驱动流程优化时会重叠。第三层是 Metito 以及 ACWA/SWPC
              生态等项目融资和海水淡化在位者；其采购动作围绕联合体、预审、长期购水协议，以及可融资 BOO 或 BOOT 结构展开。第四层是替代方案：业主仍可通过 Jacobs 或 AECOM 等公司的 EPC
              和自建路径保留控制权，或接入 Pani 的数字优化，而不是外包整项资产。


              这种分层很重要，因为 GI 并不是在同一轴线上挑战所有对手。其公开材料强调去中心化污水回用、纳米技术和按立方米付费。最难的实际竞争取决于客户原型：Seven Seas 和 Ekopak
              在商业模式上最直接可比；Gradiant 是能力重叠最强的工业对手；采购和融资决定中标时，Metito 与 ACWA 最强；Jacobs、AECOM 和 Pani
              则让买方保留更多控制权，从而维持现状。下方的公司画像表和定位图显示，真正威胁不是某一家公司，而是许多绕开押注年轻平台的替代路径。
