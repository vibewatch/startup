      - number: '8.2'
        title: 公开可比公司和沙特项目融资锚点指向基础设施式承销
        blocks:
          - type: paragraph
            body: >-
              这里最好的外部锚点，不是通用软件可比公司，而是已披露的水务、环境服务和基础设施运营商，以及为大型水务资产融资的沙特 PPP 框架。政策层面，沙特环境有支持性：美国贸易指南强调持续的行业需求和私有化势能，SWA 和
              SWPC 材料则描述主权支持的承购方模式。World Construction Network 和 Utility Business MENA 进一步提到保证承购、标准化合同，以及 7%-10%
              区间的预期私人回报。这很有价值，因为它让项目可融资；同时也提醒投资人，这更像基础设施经济性，而不是高增长软件估值逻辑。公开可比公司也讲了类似故事。2026 年 6 月，市值 / 收入倍数大致集中在 Tetra
              Tech 的 1.4x、Mueller Water Products 和 Xylem 的 2.8x-2.9x，以及 Badger Meter 和 Ecolab 的
              4.3x-4.6x。这些都是规模大、披露充分、有文件支撑的运营商。GI 可能因增长和新颖性获得战略溢价，但在没有披露收入之前，举证责任仍在公司，而不是投资人。
