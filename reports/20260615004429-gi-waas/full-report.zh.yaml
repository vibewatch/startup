  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 GI WaaS 对标整个沙特水务或基础设施支出。可投资市场是水务活动中的一个子集：运营方在特许经营、BOOT、PPP 或托管 O&M
              结构下，因交付处理、回用、可靠性或网络绩效而获得付费。它包括海水淡化大宗供水采购、处理后污水（TSE）回用、工业污水处理、以服务方式签约的输配或储水资产，以及经常性 O&M
              或非收益水项目。它不包括消费瓶装水、家庭终端设备、没有服务关系的一般 EPC
              收入，以及从未变成合同服务线的广义农业用水。替代方案很重要，因为买方仍可依赖地下水、自有水厂、市政供水、卡车运输，或用更便宜的效率提升推迟回用。因此，相关市场是由服务合同约束的可靠性与合规预算，而不是全国水量平衡本身。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
