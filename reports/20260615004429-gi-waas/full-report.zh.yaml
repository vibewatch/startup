  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资信号，以及为什么标题里的独角兽估值支撑偏弱
        blocks:
          - type: paragraph
            body: >-
              GI 有真实的融资标题，但公开支撑材料偏薄。多家公开来源重复称，GI WaaS 在 Series A 后跨过 $1 billion 门槛；Enterprise AM 进一步提到约 $1.03 billion
              估值，以及 Al Zamil 和 Al Qunaibet 以八位数投资换取 5.8%
              股权。这足以把独角兽估值视为一个被报道的市场信号，但不足以把它视为已经尽调充分的价格。庆祝这一轮融资的同一组来源，并未披露收入、毛利率、现金消耗或已签约经常性处理量。即便最强的商业化证据，仍来自项目页面和访谈：Riyadh
              工业复用、Hajj 屠宰场处理案例、Jeddah 社区工厂、ARASCO
              场址，以及法国出口计划。这些数据点支持公司存在、技术活动和一定商业进展。它们还不能证明支撑高溢价私募估值所需的规模、可重复性或投资人经济性。网站污染证据在这里也重要：如果官方网站仍托管害虫防治用户评价，投资人就应假设披露质控仍是真实尽调风险，而非外观问题。
