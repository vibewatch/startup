  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险总览与打破投资假设的条件
        blocks:
          - type: paragraph
            body: >-
              GI WaaS 的公开证据足以跨过「真实公司、真实项目」这条线，但还不足以跨过「可完整承销的基础设施平台」这条线。关键不对称在于，正面故事直观且营销到位——沙特废水复用需求真实，GI
              有可见项目背书，按立方米付费的表述也贴合政策叙事；负面情形则建立在证据缺口上。公司仍没有公开收入桥、披露利润率、积压订单排期、股权结构透明度，也没有模块化工厂的公开可靠性数据。因此，主要破局风险并不复杂。它们都是基础设施公司的常见失误点：一两个旗舰场址延期，合规或牌照收紧，资产融资更难获取，或在更宽的管理梯队可见之前，可见领导核心先变薄。换句话说，GI
              最大的风险不是没有需求；而是投资人可能按软件故事给它定价，但证据看起来仍像一个早期基础设施平台，且样板项目集中度很高。
