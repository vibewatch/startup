      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              可投资的正面 case 很直接：GI 面向可信的问题，提出服务化定价概念，有可见项目验证，也受益于沙特围绕回用、费率和 PPP 支持水务基础设施的行业动能。最重要的公开验证点不只是独角兽估值，而是具名
              ARASCO、Riyadh 项目和已宣布的法国出口，因为它们显示客户愿意在真实运营环境中测试 GI。


              负面 case 是，几乎所有承销关键指标都缺席。公开材料没有收入、ARR、毛利率、现金
              runway、债务计划、经常性合同数或客户集中度披露。法国出口项目还让叙事复杂化，因为它暗示服务经济性和项目交付经济性混在一起。这意味着公开市场投资者不应把 GI 建模成软件公司，也不应假设 pay-per-m3
              自动等于高质量经常性收入。正确框架是资本密集型基础设施服务公司，其利润率路径取决于部署利用率、合同结构和融资成本。因此，尽调应先聚焦收入确认、每 m3
              实际价格、按合同划分的资产所有权、队列续约，以及每个主要部署背后的资金栈。拿到这些数据之前，合适的财务结论是：需求侧定位有前景，但披露风险高，融资依赖也高。
