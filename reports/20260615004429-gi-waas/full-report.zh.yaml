      - number: '4.3'
        title: 成本结构、利润率路径与资本强度
        blocks:
          - type: paragraph
            body: >-
              GI 的公开价值主张意味着一种同时有吸引力也有危险的成本结构。吸引力在于，公司称 G-NANO 非生物、模块化、节能，并能在特定项目中实现 100% 回用；法国出口故事又声称最高节能
              80%，占地显著减少。在沙特，回用经济性可以很强，因为工业回用可在可行时替代海水淡化或长距离输水等更耗能方案。Seven Seas 和 Miahona
              等可比公司也显示，经营良好的水务服务提供商一旦资产基础建立，就能把长期处理、O&M 和回用服务转化为经常性现金流。


              危险面是资本强度。由服务商出资的 pay-per-m3 模式意味着，在使用量计费放大前，必须有人先为制造、部署、调试、绩效保证、备件、化学品、人工和应收款融资。仅 Arab News
              的出口故事就足以说明硬件含量不低：单个法国项目被描述为约 €5 million，Al Kharj 制造扩建则关联约 €150 million
              预期投资。公开可比公司确认，行业利润率只有在规模和合同成熟后才可能变健康：Miahona 2025 年报告收入 SAR 699.7 million、调整后 EBITDA SAR 177.8
              million，但仍承担 SAR 149.3 million CAPEX 承诺。这是 GI 利润率路径的核心教训：清单式商业模式再优雅，也不能消除对资产负债表深度、项目融资纪律和严格利用率管理的需求。
