      - number: '3.2'
        title: 直接 WaaS 竞争者赢在商业简单；工业挑战者赢在流程深度
        blocks:
          - type: paragraph
            body: >-
              Seven Seas 是本资料包中最清晰的直接公开可比公司。其官方 WaaS 材料异常明确：客户无需投入前期资本，可获得保证价格或水量条款，并可采用 BOO 或 BOOT 结构，同时由 Seven Seas
              负责设计、升级、运营、合规和维修。Ekopak 为工业客户提供范围更窄但仍有意义的同类逻辑，称客户只为消耗的升数付费，并引用首个法国大型 WaaS 项目来证明，按使用量付费的水务合同并非 GI
              独有。这两家公司很重要，因为它们验证了 GI 并未发明服务模式；也削弱了任何仅靠“水可以作为托管服务而非设备出售”来建立的护城河。


              Gradiant 不同。它与 GI 的重叠不主要来自融资话术，而来自其声称可端到端解决困难工业水问题，覆盖回用、ZLD、PFAS、UPW 和 AI
              驱动优化。对半导体、化工、采矿或先进制造买方而言，这种技术宽度可能比具体计费模式更重要。换句话说，Seven Seas 是更尖锐的商业可比对象，Gradiant 是更尖锐的能力可比对象。GI
              的公开材料有力论证了去中心化、纳米技术驱动的回用，但保留证据尚未显示出 Seven Seas 和 Gradiant 已公开披露的参考垂直行业、合同结构或工业运营历史那样的宽度。
