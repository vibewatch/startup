companyProfile:
  summary: >-
    GI WaaS 是一家沙特水务基础设施公司，关联 GI Aqua Tech，以 water-as-a-service 模式销售去中心化污水处理。公开材料称，公司基于 G.NANO
    的模块化处理厂已用于工业、社区、酒店和峰值负荷公共服务场景；客户按处理水量付费，而不是一次性投入全部前期 CAPEX。公司看起来确有沙特运营活动，并在 2025 年初据称以独角兽估值完成 Series
    A，但公开尽调包在治理、法律结构、收入和利润率披露上异常单薄。
  headquarters: Riyadh, Saudi Arabia (with GI Aqua Tech group head office in Groß-Gerau, Germany)
  productSummary: 模块化去中心化污水处理厂及配套运营服务，基于 G.NANO 处理平台，以经常性的 water-as-a-service 或按立方米付费模式销售。
  customerFocus: 沙特阿拉伯及相邻 GCC 市场的工业运营商、市政或社区开发项目、酒店场地，以及特殊活动 / 公共服务污水处理场景。
  businessModel: GI 为客户部署并运营去中心化处理单元，按处理水量或零 CAPEX 服务经济性收费，目标是拿到基础设施式经常性收入，而不是一次性设备销售。
  stage: Series A (private, privately disclosed)
