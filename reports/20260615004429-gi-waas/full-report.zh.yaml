  - id: TR005
    title: 监测指标与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值或事件
      - 行动含义
    rows:
      - - 披露不透明持续
        - 到下一次融资事件前，仍不披露收入结构、利润率、客户数量或股权结构。
        - 新一轮融资或重大客户公告仍省略核心经济性。
        - 维持继续研究建议，或转向放弃。
      - - 旗舰站点未能扩成组合
        - 6-12 个月后的公开证据仍围绕同一批展示项目。
        - 除 Riyadh、ARASCO、Hajj、Jeddah 和法国外，没有新的带运营数据的重复部署。
        - 将客户集中视为论点关键。
      - - 许可或合规受挫
        - 披露任何许可问题、运营限制或环境调查。
        - 收到 SWA、MEWA 相关实体或环境主管部门的正式通知。
        - 上调监管风险，并暂停估值承销。
      - - 资产融资压力显现
        - 项目管线扩张，但融资透明度没有同步提升。
        - 过桥资金需求、投产延迟或供应商付款拉长变得可见。
        - 立即建模稀释或流动性压力。
      - - 技术证明仍停留在轶事
        - 仍没有正常运行时间、SLA 或第三方验证包。
        - 又有 2-3 个公开项目公告，但没有运营统计。
        - 假设技术风险尚未降险。
      - - 关键人集中恶化
        - CEO 或其他高曝光领导离职，或接班梯队仍不公开。
        - Sherif Desouky 离开，或公司无法说出运营接班人。
        - 提高执行风险权重，并复核治理权利。
      - - 可比警示信号出现
        - GI 开始依赖叙事很重的披露，而项目经济性仍不透明。
        - 融资故事再一次领先证据故事。
        - 在下行情景中采用 Ekopak 式警示。
      - - 国家采购依赖上升
        - 多数大型机会需要 PPP 相关交易对手或公共招标节奏。
        - 私营直销增长仍有限，而 PPP 暴露上升。
        - 按基础设施节奏承销，而不是按创投节奏承销。
    notes: 这些触发项用于两次报告刷新之间的实时监测；多数无需访问机密内部系统即可观察。
