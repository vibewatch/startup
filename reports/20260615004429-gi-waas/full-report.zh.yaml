        - 按合同类型和工厂批次提供毛利桥
      - - 已披露项目的回用率
        - Riyadh Industrial STP 和出口法国系统声称 100%
        - 中
        - 若可复制，可支撑客户价值和 ESG 叙事
        - 提供第三方调试和合规报告
      - - 相对既有工艺的节能
        - 出口文章声称最高 80%
        - 中
        - 支付意愿和运营成本优势的主要驱动因素
        - 提供客户能源基线、测量方法和经审计案例研究
      - - 客户避免资本开支
        - 方向上正面；去中心化模式被营销为客户轻资本开支
        - 中
        - 解释即使 GI 承担更多前期资产成本，客户仍会采用
        - 提供一个已签约客户的项目前后经济性
      - - 部署速度 / 占地
        - 公开声称部署快、占地紧凑
        - 中
        - 可缩短收入落地时间，但可能以定制成本为代价
        - 提供平均安装时间、工程工时和场地准备要求
      - - 收入结构：服务 vs 项目交付
        - 公开记录同时显示按 m3 收费服务和 €5M 出口项目，因此不清晰
        - 中
        - 经常性使用收入和里程碑项目的收入质量差异很大
        - 提供 FY2025 / FY2026 按服务、设备和 O&M 拆分的收入
      - - CAC / 回本期 / 销售周期
