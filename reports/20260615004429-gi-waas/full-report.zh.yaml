      - number: '7.4'
        title: 监管、竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              沙特是水务基础设施的强需求环境，但也是高度监管的市场。MEWA、SWA、NWC、SWPC、Sharakat
              以及环境许可职能，都会影响谁能大规模建设、运营和变现资产。这带来双向风险。政策支持可以打开门，也可能拖慢一家缺少牌照、参考经济性或资产负债表实力的创业公司，使其难以穿过长期采购和合规周期。市场结构也抬高了竞争门槛。Miahona
              等在位企业对运营模式和财务状态的披露，比 GI 当前更多；Seven Seas 和 Fluence 等可比国际玩家，也用更成熟的融资和交付语言描述同一个客户问题。也就是说，GI
              不只是拼技术。它还在拼可融资性、披露质量和执行耐力。如果公司不能把样板项目势能转成更广、更透明的运营记录，资本更厚的基础设施运营商即使在有利市场里，也能挤压这家创业公司的叙事。
