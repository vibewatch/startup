      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开资本故事标题很多，承销材料很少。独立报道确认，GI 在 2025 年完成 Series A，投资方包括 Al Zamil Industrial, Trade & Transport Company 和 Al
              Qunaibet Investment Fund，并跨过 $1B 估值门槛。资金用途据称是扩张沙特业务并继续开发方案。这足以显示投资者兴趣和战略支持，但不足以判断偿付能力。审阅来源没有披露账上现金、月度
              burn、runway、债务融资、项目级担保、客户预付款，或公司是否使用表外结构为部署融资。


              更广泛的沙特背景既是顺风，也是警示。费率改革、SWA 集中监管和深厚 PPP 管线，都会让私人参与随时间更可行。SWPC
              和法律市场来源描绘了长期、可融资合同，以及海水淡化、污水和输配领域的大量私人投资。但同一背景也说明融资依赖为何重要：费率在监管监督下调整，成本转嫁具有政治敏感性，大型项目通常依赖回收期很长的特许经营结构。因此，GI
              在一个希望引入更多私人水务基础设施的市场中方向上位置不错，但仅凭公开证据无法自信判断资本化水平。没有现金、债务或项目义务能见度时，正确结论不是“资本不足”，而是“无法验证且很可能依赖融资”。
