  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 轮次文件证据薄弱
        - 已签署文件显示惩罚性优先权、异常稀释，或相对头部故事实质持平 / 下行的经济性。
        - 独角兽估值不再是质量信号，而变成后进入风险警告。
        - 重置到熊市案例，或直接离场。
      - - 收入质量不达标
        - 经常性开票水量、利润率或回款质量远弱于服务叙事暗示。
        - 公司开始像低可见度项目开发商，而不是高端经常性平台。
        - 不支付战略溢价定价。
      - - 展示到合同的缺口
        - Aramco、PIF、出口和部署故事未转化为已签约待履约订单。
        - 商业证明仍停留在轶事，估值支撑坍塌。
        - 维持跟踪 / 继续研究，或回避。
      - - 披露卫生仍弱
        - 网站污染、项目事实不一致，或管理层不愿分享一手文件的问题持续存在。
        - 对治理和报告质量的信心进一步下降。
        - 要求硬性治理权，或退出接触。
      - - 沙特成本回收或 PPP 经济性恶化
        - 关税压力、采购滑坡或回报压缩降低项目吸引力。
        - 即便技术栈优秀，也未必能赚到高端权益回报。
        - 下调牛市权重，并重新评估框架。
    notes: 每个触发项都可监测，并对应当前基准案例能否撑过下一轮尽调周期。
    claimRefs:
      - CV012
      - CV021
      - CV025
      - CV034
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - Series A 法律文件包
        - 已执行投资条款书、股权结构、董事会权利、清算优先权、反稀释，以及精确投后估值。
        - 将头部估值转化为真实投资人经济性。
        - 收集公司版本，并与投资人侧版本核对。
      - - 收入和利润率桥
        - 按部署类型拆分的月收入、开票水量、毛利率、贡献利润率和现金转化。
        - 决定 GI 应按基础设施、工业技术，还是高端战略估值处理。
        - 复核管理账、董事会材料和项目级 P&L。
      - - 积压订单与签约量
        - 已签客户合同、最低用量承诺、积压订单，以及销售管线转化历史。
        - 把真实的经常性经济性与样板项目叙事拆开。
        - 索取合同清单，以及 CRM 到收入的转化数据。
      - - 工厂与出口经济性
        - Capex 排期、利用率计划、出口订单，以及制造毛利假设。
        - 验证出口 / 工厂叙事是否实质改变估值支撑。
        - 审阅 Modon 文件、工厂预算，以及已签出口采购订单。
      - - 治理与报告
        - 董事会构成、投资人同意权、审计流程，以及内部 KPI 汇报节奏。
        - 解释当前披露短板只是成长阵痛，还是结构性治理问题。
        - 访谈管理层，并检查治理资料包。
      - - 退出路径证据
        - 潜在战略买家、可能的下一轮投资人，以及 IPO 准备度缺口评估。
        - 界定承销周期对应的是延续融资、贸易出售，还是长期持有。
        - 搭建买家 / 发起人地图，并将 GI 的准备度与上市披露规范对比。
    notes: 这些索取项刻意写得很具体，因为公开证据本身太薄，无法支撑确定性承销。
    claimRefs:
      - CV013
      - CV014
      - CV034
      - CV041
      - CV043
      - CV044
