  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价逻辑
        blocks:
          - type: paragraph
            body: >-
              GI WaaS
              在公开叙事中被框定为按服务销售的污水处理公用事业，而不是纯设备供应商。公司自己的行业独角兽公告，加上独立融资报道，反复描述一种按立方米付费的模式：去中心化单元部署到客户现场，账单随处理水量扩大。这个方向有吸引力，因为它让客户支出与交付产出对齐，并相较完全由客户出资建厂降低采用门槛。同一官方叙事还称，去中心化处理可避开部分污水管网
              CAPEX，并让本来不会自建永久基础设施的客户也能获得高级处理能力。


              但公开记录不够干净，不能把 GI 简单视为经常性收入公用事业。2026 年 1 月 Arab News 报道称，首个法国出口项目价值约 €5
              million，同时仍称系统按每立方米处理收费。这意味着在持续使用量计费之外，至少可能混有里程碑式项目收入、设备 / 制造收入或交钥匙交付费用。由于 GI 未披露合同期限、最低承购量、调价条款，或项目究竟是
              BOO/BOOT/纯服务安排，最审慎的读法是：公司有以服务为主导的商业承诺，但收入确认组合仍未解开。尽调中，这一区分比独角兽标题更重要，因为服务收入可以复利增长，而项目收入可能波动大且占用营运资本。
