      - number: '8.4'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              清晰建议是跟踪 / 继续研究，置信度中等，风险高，估值偏紧。原因不是 GI
              没有潜力；而是现有证据更清楚地支持品类需求、技术野心和部分部署证明，却远不足以支持投资人定价。按当前事实，公司看起来还没有准备好接受近期公开市场审视。即使是 Miahona
              这样的本地已披露水务运营商，发布的运营框架也远多于 GI 当前披露；参考集里每一家美国可比公司也都有持续 10-K
              记录。这并不排除强劲私募轮或战略融资的可能，只是说明下一步尽调必须聚焦已签经济性，而不是故事讲述。关键问题是，GI
              的经常性签约处理量是否真实，利润率和现金转化是否足以支撑高溢价倍数，以及轮次条款是否让后期投资人暴露在清算优先权或稀释悬空风险之下。在这套材料可见之前，独角兽标题应被当作一个待验证主张，而不是可以接受的价格。
