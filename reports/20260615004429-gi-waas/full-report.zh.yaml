      - number: '2.5'
        title: 尽调缺口与承销含义
        blocks:
          - type: paragraph
            body: >-
              核心承销结论不是沙特和 MENA 水务需求小，而是 GI WaaS 仍需要比公开来源更窄的合同级视角。最强的公开证据证明，国家支持的 PPP 采购、TSE 扩张、工业特许经营和 O&M
              都是活跃类别。但这些证据没有证明 GI WaaS 专属的 SAM 或 SOM，也没有按买方、利用率、费率、流失或利润率拆分。这个缺口很关键，因为即便在同一行业内，窄口径经常性收入模式也可能与水厂开发或 EPC
              模式截然不同。因此，投资者应自下而上承销 GI WaaS：逐一锁定目标细分，锚定交易对手和合同结构，把广义市场报告当作背景，而不是可投资收入预测。
            claimRefs:
              - CM036
