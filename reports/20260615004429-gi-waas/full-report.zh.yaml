      - number: '6.2'
        title: 采用轨迹与具名客户证据质量
        blocks:
          - type: paragraph
            body: >-
              最强的客户证据来自有日期的运营参考，而不是泛泛的增长语言。Riyadh Industrial 是资料包中最清晰的长期验证点，因为公司把交付日期写到 2022 年 12 月，且后续多篇文章仍把该场地列为 100%
              回用的运行参考。ARASCO 增加了更新的 2025 年农工业验证，Jeddah El Mousa 增加了社区级公用事业用例，Bab Samhan 则提供了规模较窄但有助于证明污水类型灵活性的酒店应用。Hajj
              屠宰场案例在运营上令人印象深刻，因为它显示 GI 能处理会压垮普通生物系统的峰值季节负荷，但它仍不像传统经常性企业账户。


              France 和 Bahrain 应更谨慎看待。法国化妆品厂交易有充分交叉印证且时间新，但仍是公告阶段出口验证，而不是公开记录的上线运行。Bahrain 更早期：Tahliya 合作和 GWECCC
              页面显示地理扩张和渠道搭建，但没有披露任何已上线 Bahrain 客户现场。NetZero 和 Aramco 对话页提供了有价值的邻近信号，但两者都不应计入具名付费客户证据。正确的尽调结论是，GI
              在沙特有真实生产级参考，并有可信的 2025-2026 扩张信号；但最新国际验证仍走在可独立看见的运营历史前面。
