      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据显示，销售是项目驱动且偏咨询式的。GI 点名 ARASCO（Al Kharj）和 Riyadh Industrial City 等工业与半工业部署，出口故事又加入法国化妆品制造场景和未来 GCC
              扩张。这些不是低接触订阅动作的足迹；更像技术型企业销售，由工程适配、合规、现场定制和回用经济性推动采购。行业可比公司也强化了这个判断：Seven Seas、Metito 和 Miahona
              都把水务服务合同描述为设计、运营、合规、计量和特许经营管理的组合，通过结构化采购或复杂商务开发赢得，而不是短周期线上销售。


              因此，销售效率问题不是动作是否存在，而是公开记录没有给出硬生产率指标。没有披露 CAC、回本期、ACV 分布、logo 数、续约率或平均采购周期。具名项目和一轮醒目融资暗示需求生成真实存在，但它们没有证明 GI
              能把试点式胜利转化为可复制利润率。本章的正确立场，是将企业牵引力视为可信，但销售效率仍不透明。管理层拿出已签合同摘要、队列续约和按部署类型拆分的入账收入之前，资本投放速度可能跑在可复制销售经济性证据前面。
