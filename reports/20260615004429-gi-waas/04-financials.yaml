- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Realized revenue per m3
    - null
    - Low
    - Determines whether the service model clears operating and financing cost
    - Provide tariff cards, invoices, and monthly billed volume by top customer
  - - Gross margin per m3
    - null
    - Low
    - Separates attractive utility economics from underpriced bespoke projects
    - Provide gross-margin bridge by contract type and plant cohort
  - - Reuse rate on named projects
    - 100% claimed on Riyadh Industrial STP and exported France system
    - Medium
    - Supports customer value and ESG case if reproducible
    - Provide third-party commissioning and compliance reports
  - - Energy savings versus incumbent process
    - Up to 80% claimed on export article
    - Medium
    - Major driver of willingness to pay and operating cost advantage
    - Provide customer energy baseline, measurement method, and audited case study
  - - Customer capex avoidance
    - Directionally positive; decentralized model marketed as capex-light for customer
    - Medium
    - Explains adoption case even when GI bears more upfront asset cost
    - Provide before/after project economics for one signed customer
  - - Deployment speed / footprint
    - Rapid deployment and compact footprint publicly claimed
    - Medium
    - Can shorten time to revenue but may trade off with customization cost
    - Provide average install time, engineering hours, and site-prep requirements
  - - 'Revenue mix: service vs project delivery'
    - Ambiguous because public record shows both per-m3 service and €5M export project
    - Medium
    - Revenue quality differs materially between recurring usage and milestone projects
    - Provide FY2025/FY2026 revenue split by service, equipment, and O&M
  - - CAC / payback / sales cycle
    - null
    - Low
    - Tests whether capital-efficient growth exists beyond pilot wins
    - Provide funnel metrics, procurement cycle, win rate, and payback by segment
  notes: Null means not publicly disclosed rather than zero. The public record is rich enough to identify the economic levers but not to quantify margin, utilization, or sales efficiency with underwriting confidence.
