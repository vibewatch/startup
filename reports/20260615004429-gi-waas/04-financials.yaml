- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Status / value
  - Why it matters
  - Diligence ask
  rows:
  - - Latest equity funding
    - Series A with named investors
    - Closed in 2025 at >$1B valuation
    - Confirms external backing but not solvency or dilution terms
    - Request round size, post-money cap table, and investor rights summary
  - - Cash on hand
    - No public disclosure
    - null
    - Core runway input is missing
    - Request latest monthly cash balance and unrestricted cash definition
  - - Monthly burn
    - No public disclosure
    - null
    - Needed to convert funding story into runway reality
    - Request trailing-12-month monthly cash burn and burn split by SG&A / capex / project development
  - - Runway months
    - Not calculable from public data
    - null
    - Cannot underwrite financing risk without it
    - Request board-approved operating plan and downside runway case
  - - Stated use of funds
    - Saudi expansion and new solution development
    - Directional only
    - Tells where capital may be consumed first
    - Request detailed use-of-proceeds budget by geography and function
  - - Project finance / debt facilities
    - No GI-specific public disclosure
    - Unknown / partial
    - Model likely needs asset or concession financing at scale
    - Request debt schedule, guarantees, covenants, and project-SPV structure
  - - Manufacturing / deployment capex signal
    - Al Kharj program tied to ~€150M expected investment
    - Material capex indicator
    - Shows scale-up may need more than working capital
    - Request capex phasing, committed vs aspirational spend, and funding source
  - - Customer prepayments / offtake guarantees
    - No public disclosure
    - null
    - Could materially de-risk provider-funded deployments if present
    - Request payment terms, deposits, take-or-pay clauses, and receivable aging
  notes: This table intentionally avoids restating old funding chronology. The question is not whether GI has raised money; it is whether the current funding base and any project-finance stack are sufficient to support a provider-funded deployment model.
  claimRefs:
  - CI012
  - CI015
  - CI023
  - CI025
  - CI040
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public status
  - Underwriting impact
  - Exact diligence path
  - Related topic
  rows:
  - - Revenue / ARR / booked backlog
    - Not disclosed
    - Prevents any clean multiple-based valuation or growth-quality test
    - Request monthly revenue by stream, signed backlog, and contracted annualized run rate
    - revenue-quality
  - - Gross margin by contract type
    - Not disclosed
    - Masks whether per-m3 service is truly profitable after chemicals, power, labor, and depreciation
    - Request margin bridge for top deployments and consolidated gross profit waterfall
    - margin-path
  - - Cash balance / burn / runway
    - Not disclosed
    - Blocks solvency and next-round timing assessment
    - Request current cash, monthly burn, and downside runway model
    - capital-adequacy
  - - Customer concentration / renewal history
    - Not disclosed
    - Could turn a few showcase projects into concentrated risk
    - Request top-10 customer revenue share and renewal / churn table
    - revenue-quality
  - - Average contract term and minimum-volume commitments
    - Not disclosed
    - Without term and offtake, service revenue may be less recurring than the narrative suggests
    - Request master service agreements and offtake schedules
    - pricing-visibility
  - - Debt, guarantees, and project-SPV obligations
    - Not disclosed
    - Unseen leverage could subordinate equity and reduce cash flexibility
    - Request debt schedule, project finance documents, and parent guarantees
    - financing-risk
  notes: These gaps are the main reasons the chapter stops short of a positive underwriting conclusion. The public record supports commercial promise and sector tailwinds, but not investable revenue quality or capital adequacy.
  claimRefs:
  - CI031
  - CI032
  - CI034
  - CI040
  - CI042
