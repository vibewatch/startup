  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: revenue-mix
    missingEvidence: Executed customer contracts showing whether GI books revenue as pure per-m3 service fees, turnkey plant milestones, O&M retainers, or some combination of the three.
    whyItMatters: The public record supports both service-style and project-style monetization. Without contract mechanics, recurring revenue quality and margin durability cannot be underwritten.
    diligencePath: Request the top five signed contracts, revenue-recognition memo, and monthly invoicing data that splits usage fees, equipment/milestone revenue, and O&M revenue.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, gross margin, EBITDA, cash balance, monthly burn, backlog, and customer concentration for GI WaaS.
    whyItMatters: Without these metrics the valuation headline cannot be tied to a real revenue base, profitability profile, or solvency view.
    diligencePath: Obtain FY2024-FY2026 management accounts, monthly KPI pack, cohort renewal tables, and the current signed-backlog schedule from the data room.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI015
    - QI024
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: financing-stack
    missingEvidence: Debt schedule, project-finance arrangements, guarantees, customer prepayments, and any special-purpose vehicle structure behind major deployments.
    whyItMatters: A provider-funded wastewater model can look capital-light to customers while being highly leveraged or guarantee-heavy at the company level.
    diligencePath: Request debt agreements, covenant schedules, guarantee letters, customer payment terms, and any project-SPV waterfall documents.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, ACV distribution, win rate, sales-cycle length, and procurement-stage funnel conversion by segment.
    whyItMatters: Named projects prove demand existence, but they do not prove repeatable, capital-efficient go-to-market performance.
    diligencePath: Request funnel dashboards, CRM conversion reports, signed-order calendar, and post-implementation expansion metrics for at least two cohorts.
    relatedQuestionRefs:
    - QI007
    - QI008
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, renewal history, utilization by plant, compliance audits, and realized savings case studies signed by customers.
    whyItMatters: Revenue quality depends on whether GI has diversified, renewing customers with measurable savings or a small number of showcase deployments.
    diligencePath: Request top-10 customer revenue share, utilization logs, compliance certificates, and customer-attributed ROI studies for ARASCO, Riyadh Industrial, and export deployments.
    relatedQuestionRefs:
    - QI005
    - QI011
    - QI024
    relatedTableRefs:
    - TI005
