- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer or benchmark
  - Public price / unit
  - List vs realized pricing
  - Why it matters
  - Source status
  rows:
  - - GI WaaS treatment service
    - Pay-per-cubic-meter; exact tariff not disclosed
    - List logic only; realized price unknown
    - Core underwriting variable for revenue quality
    - Confirmed by official and independent coverage
  - - France export project
    - ~€5M project value
    - Project headline only; unit economics unknown
    - Shows hardware / milestone revenue may coexist with service billing
    - Independent news only
  - - Saudi industrial wastewater benchmark
    - SAR 3.64 per m3
    - External market tariff, not GI pricing
    - Lower-bound benchmark for wastewater-related service value in Jubail/Yanbu
    - Corroborated by Zawya and Argaam
  - - Saudi potable/process industrial water benchmark
    - SAR 8.04 per m3
    - External market tariff, not GI pricing
    - Upper reference point for industrial water service willingness to pay
    - Corroborated by Zawya and Argaam
  - - SWPC desalination BOO benchmark
    - $0.41 per m3 levelized tariff
    - Large-plant PPP benchmark, not GI pricing
    - Shows how competitive tariffs can become under long-tenor project finance
    - SWPC interview / PPP context
  - - Saudi desalinated-water cost reference
    - ~$1.50 per m3
    - Sector cost reference, not customer contract price
    - Highlights cost pressure that makes reuse attractive but also politically sensitive
    - Independent adverse commentary
  notes: Only the billing unit is public for GI itself. The tariff and desalination rows are external benchmarks included to frame what Saudi industrial customers and project financiers already see in the market; they should not be mistaken for GI realized pricing.
