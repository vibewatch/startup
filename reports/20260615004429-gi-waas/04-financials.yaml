runDate: '2026-06-15'
company:
  name: GI WaaS
chapter:
  number: 4
  title: Financials
  summary: 'GI WaaS has a clear public revenue concept—pay-per-cubic-meter wastewater treatment delivered through decentralized units—and a public funding headline of a 2025 Series A at a valuation above $1 billion. What remains unproven is the core underwriting set: realized price per m3, recurring revenue versus project-delivery mix, gross margin, cash runway, and financing obligations. Saudi tariff and PPP benchmarks suggest a large addressable market but also a capital-intensive, politically sensitive cost-recovery environment, so the public record supports demand potential more than revenue quality.'
sections:
- id: revenue-model-pricing
  title: Revenue model and pricing logic
  body: 'GI WaaS is publicly framed as a wastewater-treatment utility sold on a service basis rather than as a pure equipment vendor. Its own sector-unicorn announcement, plus independent funding coverage, repeatedly describe a pay-per-cubic-meter model in which decentralized units are deployed to customer sites and billing scales with treated volume. That is directionally attractive because it aligns customer spend with delivered output and can lower the adoption hurdle relative to fully customer-funded plant construction. The same official narrative also says decentralized treatment can avoid some sewer-network capex and make advanced treatment accessible to customers that would not build permanent infrastructure on their own.


    The public record is not clean enough, however, to treat GI as a simple recurring-revenue utility. The January 2026 Arab News report describes a first France export project valued at roughly €5 million while still saying the system operates on a per-cubic-meter treatment basis. That suggests at least some mix of milestone-based project revenue, equipment/manufacturing revenue, or turnkey delivery fees alongside ongoing usage billing. Because GI has not disclosed contract duration, minimum offtake, escalation clauses, or whether projects are BOO/BOOT/service-only arrangements, the most prudent read is that the company has a service-led commercial promise with unresolved revenue-recognition mix. In diligence, this distinction matters more than the unicorn headline because service revenue can compound while project revenue can be lumpy and working-capital heavy.'
  claimRefs:
  - CI001
  - CI002
  - CI004
  - CI008
  - CI033
  - CI034
  tableRefs:
  - TI001
  - TI002
  figureRefs:
