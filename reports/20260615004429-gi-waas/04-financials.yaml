- id: gtm-sales-proxies
  title: GTM motion and sales-efficiency proxies
  body: 'Public GTM evidence is project-led and consultative. GI names industrial and semi-industrial deployments such as ARASCO in Al Kharj and Riyadh Industrial City, and the export story adds a cosmetics-manufacturing use case in France plus future GCC expansion. Those are not the footprints of a low-touch subscription motion; they look more like technical enterprise sales where engineering fit, compliance, site customization, and reuse economics drive the buying process. Sector comparators reinforce that interpretation: Seven Seas, Metito, and Miahona all describe water-service contracts as combinations of design, operations, compliance, metering, and concession management, which are won through structured procurement or complex business development rather than short online sales cycles.


    The sales-efficiency problem is therefore not whether the motion exists; it is that the public record gives no hard productivity metrics. There is no disclosed CAC, payback, ACV distribution, logo count, renewal rate, or average procurement cycle length. Named projects and a prominent funding round imply demand generation is real, but they do not show whether GI can convert pilot-style wins into repeatable margins. For this chapter, the right stance is to treat enterprise traction as credible but sales efficiency as opaque. Until management provides signed-contract summaries, cohort renewals, and booked revenue by deployment type, capital deployment pace may outrun evidence of repeatable sales economics.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI041
  - CI042
  tableRefs: []
  figureRefs:
  - FI002
- id: cost-structure-capital-intensity
  title: Cost structure, margin path, and capital intensity
  body: 'GI’s public value proposition implies a cost structure with both attractive and dangerous traits. On the attractive side, the company says G-NANO is non-biological, modular, energy-efficient, and capable of 100% reuse on specific projects; the France export story adds a claim of up to 80% energy savings and sharply reduced footprint. Reuse economics can be compelling in Saudi Arabia because treated effluent can displace more energy-intensive alternatives such as desalination or long-distance water transport when industrial reuse is feasible. Comparators such as Seven Seas and Miahona also show that well-run water-service providers can turn long-duration treatment, O&M, and reuse services into recurring cash flows once the asset base is established.


    The dangerous side is capital intensity. A provider-funded pay-per-m3 model means someone must finance fabrication, deployment, commissioning, performance guarantees, spare parts, chemicals, labor, and receivables before usage billing scales. The Arab News export story alone is enough to show meaningful hardware content: a single France project was described at about €5 million, and the Al Kharj manufacturing buildout was tied to roughly €150 million of expected investment. Public comparators confirm that sector margins can become healthy only after scale and contract maturity: Miahona reported SAR 699.7 million revenue and SAR 177.8 million adjusted EBITDA in 2025, but it still carried SAR 149.3 million of capex commitment. That is the core margin-path lesson for GI: list-model elegance does not remove the need for balance-sheet depth, project finance discipline, and tight utilization management.'
  claimRefs:
  - CI003
  - CI010
  - CI017
  - CI020
