tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Current public status
  - Revenue-recognition implication
  - Diligence ask
  rows:
  - - Per-m3 wastewater treatment service
    - Customer pays for cubic meters treated on deployed decentralized units
    - Publicly confirmed billing concept; exact tariff undisclosed
    - Likely recurring usage revenue if contract remains in service
    - Request top-10 contracts with tariff, term, minimum offtake, and renewal mechanics
  - - Turnkey plant / export project delivery
    - Project-specific plant delivery or export milestone revenue
    - France export reported at about €5M
    - Could create lumpy milestone revenue alongside service fees
    - Request project accounting policy and breakdown of equipment vs service revenue
  - - Industrial-site O&M and managed operations
    - Provider operates, maintains, and optimizes water assets for customer
    - Directionally supported by sector comparators; GI-specific disclosure limited
    - Could smooth revenue if embedded in long-term contracts
    - Request O&M scope, staffing model, and margin bridge by contract type
  - - Mobile / temporary deployment services
    - Rapid-deployment treatment units for sites without permanent networks
    - Supported by official mobile-plant positioning and Jeddah rapid-deployment narrative
    - Could command premium pricing but may raise logistics cost and utilization risk
    - Request utilization history, transport cost, and downtime metrics
  - - Reuse / ESG-linked partnership services
    - Reuse performance tied to sustainability or net-zero programs
    - NetZero MoU is public but commercial terms are not
    - Potential adjacent revenue layer remains unproven
    - Request signed commercial schedules or pilot invoices for partner-led programs
  notes: Rows separate public billing logic from still-unclear revenue recognition. Public evidence supports at least one usage-based service stream and one project-delivery stream; it does not disclose realized pricing, contract term, or revenue mix.
