companyProfile:
  summary: GI WaaS is a Saudi water-infrastructure venture affiliated with GI Aqua Tech that markets decentralized wastewater treatment under a water-as-a-service model. Public materials describe modular G.NANO-based plants deployed for industrial, community, hospitality, and peak-load public-service use cases, with customers paying on treated-volume economics instead of funding full upfront capex. The business appears to have real Saudi operating activity and a reported early-2025 Series A at a unicorn valuation, but the public diligence package remains unusually thin on governance, legal structure, revenue, and margin disclosure.
  headquarters: Riyadh, Saudi Arabia (with GI Aqua Tech group head office in Groß-Gerau, Germany)
  productSummary: Modular decentralized wastewater-treatment plants and related operating services, sold as a recurring water-as-a-service or pay-per-cubic-meter offering using the G.NANO treatment platform.
  customerFocus: Industrial operators, municipalities or community developments, hospitality sites, and special-event/public-service wastewater use cases in Saudi Arabia and adjacent GCC markets.
  businessModel: GI deploys and operates decentralized treatment units for customers on treated-volume or zero-CAPEX service economics, seeking recurring infrastructure-style revenue rather than one-time equipment sales.
  stage: Series A (private, privately disclosed)
  fundingStatus: Public coverage says GI WaaS crossed a $1B valuation after an early-2025 Series A backed by Al Zamil and Al Qunaibet, but no investor-side announcement or regulatory filing was found in the reviewed public record.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO011, CO012, CO014, CO033]
summary:
  headline: GI WaaS has credible wastewater-treatment activity and Saudi market tailwinds, but the reported unicorn valuation outruns the quality of its public disclosure.
