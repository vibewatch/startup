- id: monitoring-and-kill-criteria
  title: Monitoring indicators and kill criteria
  body: 'The monitoring logic for GI should be brutally practical. Investors do not need perfect information to decide whether risk is rising or falling; they need a short list of observable triggers. The first is disclosure improvement: if the company still cannot provide customer concentration, contract tenor, revenue mix, and cap-table clarity, then time is not helping the thesis. The second is breadth of proof: one more showcase project is less important than seeing repeat deployments, cleaner operating metrics, and evidence that older sites stayed online. The third is financing quality: a company that truly has infrastructure-grade repeatability should be able to raise project or asset capital on terms that match its public narrative. The fourth is leadership redundancy. If Dr. Sherif Desouky remains the only clearly visible executive anchor while growth plans widen geographically, key-person risk will stay elevated. A sober underwriting view should therefore treat GI as ''research
    more'' until those indicators move in the right direction, and should move to a harder pass if compliance, financing, or leadership continuity deteriorates.'
  claimRefs:
  - CR032
  - CR033
  - CR039
  - CR040
