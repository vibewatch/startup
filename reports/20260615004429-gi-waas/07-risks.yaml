- id: TR005
  title: Monitoring indicators and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Disclosure opacity persists
    - No revenue-mix, margin, customer-count, or cap-table disclosure by next financing event.
    - Another round or major customer announcement still omits core economics.
    - Keep recommendation at research-more or move toward pass.
  - - Flagship sites fail to broaden into a portfolio
    - Public evidence after 6-12 months still centers on the same showcase projects.
    - No new repeat deployments with operating data beyond Riyadh, ARASCO, Hajj, Jeddah, and France.
    - Treat customer concentration as thesis-critical.
  - - Permitting or compliance setback
    - Any disclosed permit issue, operating restriction, or environmental investigation.
    - Formal notice from SWA, MEWA-linked entities, or environmental authorities.
    - Escalate regulatory risk and halt valuation underwriting.
  - - Asset-financing strain emerges
    - Project pipeline expands without matching financing transparency.
    - Need for bridge capital, delayed commissioning, or vendor-payment stretch becomes visible.
    - Model dilution or liquidity stress immediately.
  - - Technology proof remains anecdotal
    - Still no uptime, SLA, or third-party validation package.
    - Another 2-3 public project announcements with no operating statistics.
    - Assume technology risk has not de-risked.
  - - Key-person concentration worsens
    - CEO or other visible leaders depart, or no bench becomes public.
    - Sherif Desouky exits or the company cannot name operating successors.
    - Raise execution-risk weighting and review governance rights.
  - - Comparable warning signs appear
    - GI begins to rely on narrative-heavy disclosure while project economics stay opaque.
    - Funding story leads evidence story by another cycle.
    - Use Ekopak-style caution in downside case.
  - - State-procurement dependence rises
    - Most large opportunities require PPP-linked counterparties or public-tender timing.
    - Private direct-sales growth remains limited while PPP exposure climbs.
    - Underwrite to infrastructure tempo, not venture tempo.
  notes: These triggers are intended for live monitoring between report refreshes; most are observable without access to confidential internal systems.
