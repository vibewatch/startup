- id: disclosure-governance-and-structure
  title: Disclosure, governance, and corporate structure risk
  body: 'The first hard risk bucket is governance-quality signaling. GI’s official web presence is good enough to communicate ambition, but not good enough to inspire diligence confidence. The reviews-page contamination is not a cosmetic issue; it is evidence that quality control on the public disclosure surface is weak. The same pattern shows up in the financial pack: headline valuation coverage exists, yet core operating disclosures do not. More importantly, the public materials do not clearly reconcile the German GmbH registry record, the Saudi operating company, and the beneficial ownership chain that would matter under Saudi Arabia’s tightening transparency regime. That matters because Saudi authorities now expect beneficial-ownership data to stay synchronized across registry, tax, banking, and licensing records. A company can have a real business and still create serious diligence risk if its ownership map, control rights, and legal entities are not easy to reconcile. For a startup
    being discussed at unicorn scale, that is a material governance gap rather than a routine private-company omission.'
  claimRefs:
  - CR003
  - CR004
