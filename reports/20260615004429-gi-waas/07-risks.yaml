chapter:
  number: 7
  title: Risks
  summary: GI WaaS has real commercialization signals and strong Saudi policy tailwinds, but the public evidence still leaves the company looking more like an early infrastructure platform than a cleanly underwritable unicorn. The main risks are disclosure and ownership opacity, capital intensity and project concentration, regulatory gatekeeper dependence, thin public reliability evidence for the nanotech platform, and key-person concentration around a highly visible CEO.
sections:
- id: risk-overview
  title: Risk overview and thesis-breaker conditions
  body: 'GI WaaS has enough public evidence to clear the ''real company, real projects'' bar, but not enough to clear the ''fully underwritable infrastructure platform'' bar. The key asymmetry is that the positive story is intuitive and well marketed—Saudi wastewater reuse demand is real, GI has visible project references, and its pay-per-cubic-meter framing fits the policy narrative—while the negative case is grounded in missing evidence. The company still has no public revenue bridge, no disclosed margins, no backlog schedule, no cap-table transparency, and no public reliability data for its modular plants. That means the main thesis-breakers are not exotic. They are ordinary infrastructure-company failure points: one or two flagship sites slip, compliance or licensing tightens, asset finance becomes harder to source, or the visible leadership nucleus thins before a broader bench is visible. In that sense, GI’s biggest risk is not demand absence; it is that investors may price it like
    a software story while the evidence still looks like an early infrastructure platform with showcase-project concentration.'
  claimRefs:
