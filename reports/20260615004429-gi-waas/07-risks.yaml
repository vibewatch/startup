  evidenceGaps:
  - type: missing-source
    severity: material
    topic: corporate-structure
    missingEvidence: A full legal-entity chart linking GI Aqua Tech GmbH, the Saudi operating entity or entities, beneficial owners, and investor stakes.
    whyItMatters: Without a reconciled structure map, governance rights, AML/UBO exposure, and cap-table control cannot be underwritten confidently.
    diligencePath: Request the latest cap table, entity chart, shareholder register, and any Saudi beneficial-owner filings or confirmations.
    relatedQuestionRefs:
    - QR005
  - type: private-evidence-only
    severity: blocking
    topic: business-model-proof
    missingEvidence: Revenue mix, gross margin, pricing logic, contract tenor, minimum-volume commitments, and backlog by project or cohort.
    whyItMatters: These are the minimum inputs required to know whether GI is a real recurring WaaS platform or a project-heavy services business.
    diligencePath: Obtain data-room financials, customer contract summaries, cohort bridge, and project-finance assumptions.
    relatedQuestionRefs:
    - QR002
    - QR004
    - QR030
  - type: missing-source
    severity: material
    topic: technology-validation
    missingEvidence: Independent validation datasets, acceptance-test reports, and uptime/SLA history for major deployed sites.
    whyItMatters: Technology and reliability risk cannot be separated from narrative strength without third-party or customer-side operating proof.
    diligencePath: Request customer acceptance reports, compliance test packs, maintenance records, and third-party lab or engineering validations.
    relatedQuestionRefs:
    - QR022
    - QR023
  - type: private-evidence-only
    severity: material
    topic: key-person
    missingEvidence: Org chart, senior leadership retention terms, succession plans, and engineering/operations bench depth below the CEO.
    whyItMatters: A capital-intensive scale-up with cross-border projects should not rely visibly on one executive persona.
    diligencePath: Request current org chart, management bios, retention packages, and board-level succession planning materials.
    relatedQuestionRefs:
    - QR026
    - QR029
  - type: access-blocked
    severity: material
    topic: site-compliance
    missingEvidence: Site-level permit and compliance history from the relevant Saudi operating and environmental authorities.
    whyItMatters: Public policy commentary establishes the rule set, but project-level compliance posture still cannot be seen from public summaries alone.
    diligencePath: Request permit registers and correspondence, and check site-specific records directly with regulators or through local counsel.
    relatedQuestionRefs:
    - QR011
    - QR013
    relatedTableRefs:
    - TR006
