callouts:
- title: Disclosure risk is the first thesis-breaker, not a side issue
  body: GI may prove to be a strong Saudi wastewater business, but the public evidence pack still behaves like a marketing deck rather than like investor-grade infrastructure disclosure. That matters because the next financing event will likely be judged not only on growth ambition but on whether revenue quality, structure, and operating reliability can finally be reconciled. Until then, governance risk should be treated as a core underwriting variable.
  calloutType: risk
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR033
  - CR039
- title: Ekopak is the closest public warning sign for this model class
  body: 'Bluefield’s Ekopak note is useful not because GI and Ekopak are identical, but because it shows how a water-reuse / WaaS company can move from exciting narrative to liquidity and disclosure stress while a flagship project is still maturing. The lesson is simple: project concentration plus weak transparency can turn a financing question into a valuation problem very quickly.'
  calloutType: risk
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR043
