- id: TR002
  title: Disclosure gap assessment
  columns:
  - Metric or disclosure item
  - Public status
  - Why it matters
  - Risk implication
  rows:
  - - Revenue / ARR
    - Not disclosed
    - Needed to test whether GI is a recurring platform or project-led services business.
    - Valuation and financing risk stay elevated.
  - - Gross margin / unit economics
    - Not disclosed
    - Needed to know whether pay-per-cubic-meter pricing clears capex, opex, and maintenance burden.
    - Infrastructure-like downside may be masked.
  - - Customer count / concentration
    - Only named showcases disclosed
    - Needed to separate publicity cases from portfolio breadth.
    - A small number of sites may dominate perception and cash flow.
  - - Contract tenor / minimum-volume commitments
    - Not disclosed
    - Needed to judge durability of recurring revenue claims.
    - Revenue quality cannot be underwritten.
  - - Cap table / entity chain / beneficial owners
    - Not clearly reconciled publicly
    - Needed for control, governance, and AML/UBO compliance review.
    - Structure opacity can delay diligence and financing.
  - - Permits, certifications, and site-level compliance history
    - Not assembled publicly
    - Needed to test scaling readiness in a regulated utility environment.
    - Regulatory and operational risk remain open.
  - - Uptime / SLA / failure-rate data
    - Not disclosed
    - Needed to test whether the technology works repeatedly outside showcase narration.
    - Technology and maintenance risk remain unpriced.
  - - Headcount / org chart / succession bench
    - Not disclosed
    - Needed to evaluate whether one visible CEO is backed by enough operating depth.
    - Key-person and execution risk remain high.
  notes: Statuses refer only to the public evidence pack reviewed for this run; a private data room could close several of these gaps quickly.
