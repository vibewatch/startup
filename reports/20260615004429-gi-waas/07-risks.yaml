- id: TR003
  title: Competitive displacement and comparable warning table
  columns:
  - Comparator or signal
  - What it shows
  - Why it matters for GI
  - Risk read-through
  rows:
  - - Miahona
    - Public Saudi water operator with filings, concessions, O&M, reuse, and integrated-water positioning.
    - Shows the local market already has disclosed operators with institutional reporting habits.
    - GI has to compete on disclosure quality as well as technology.
  - - Seven Seas Water Group
    - Mature WaaS framing built around flexible financing, faster delivery, and customer pain-point transfer.
    - Shows customers expect financing competence, not just treatment IP.
    - Bankability gap can weaken GI even if technology is real.
  - - Fluence
    - Emphasizes regulatory timelines, staffing pressure, and capacity constraints in decentralized wastewater planning.
    - Shows deployment friction comes from utility realities, not just equipment selection.
    - Execution risk may stay high after a sale is won.
  - - Ekopak / Bluefield warning
    - Liquidity stress, disclosure scrutiny, and flagship-project dependence can destabilize a reuse/WaaS story.
    - Provides a concrete cautionary analogue for GI’s model class.
    - Project concentration plus weak disclosures can become financing risk quickly.
  - - Saudi PPP gatekeepers
    - SWPC, Sharakat, and NWC shape who can scale large assets and on what terms.
    - GI does not control the procurement frame by itself.
    - Policy support can still translate into long-cycle dependency.
  notes: This table compares business-model and market-structure signals, not product feature parity. The purpose is to identify where GI can be displaced or de-risked by better-capitalized players.
