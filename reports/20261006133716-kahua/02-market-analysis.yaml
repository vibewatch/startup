company:
  name: Kahua
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Kahua addresses owner-led construction and capital-program management rather than the whole construction-software market. The allocated evidence supports meaningful operating scale and a regulated-enterprise buyer focus, but it does not support a defensible revenue TAM, SAM, or SOM; technographic, customer, project, and capital-program figures therefore remain separate sizing lenses."
sections:
  - id: market-boundary
    title: "Market Boundary and Status-Quo Alternatives"
    body: >-
      Kahua's evidenced core market is software used by asset owners and their delivery
      teams to govern complex capital programs across planning, funding, cost and risk
      control, project delivery, portfolio reporting, and handover. This boundary includes
      construction PMIS and capital-program workflows, especially where regulated or
      mission-critical owners need a governed system of record. It does not treat all
      construction technology, design authoring, contractor estimating, general ERP, or
      facilities maintenance as directly addressable spend merely because those categories
      touch the same asset lifecycle. The principal status-quo substitute is the fragmented
      combination of disconnected systems and processes described by Kahua itself; lighter
      horizontal project tools are another substitute where program governance is not the
      buying priority. Construction Industry AI independently characterizes the primary
      buyer as the organization paying for the asset while recognizing contractors as
      delivery participants, which supports an owner-centered boundary without proving a
      universal customer mix.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM016
    tableRefs:
      - TM001
    figureRefs: []
  - id: sizing-lenses
    title: "Evidence-Constrained Sizing Lenses"
    body: >-
      No successful source in the assigned pool isolates annual owner-side PMIS software
      spend, so a precise TAM, SAM, or SOM would be invented. The usable evidence instead
      provides non-comparable lenses. Kahua reports more than 2,500 customers, more than
      70,000 projects, and more than $400 billion of capital managed on the platform.
      These are operating-scale indicators, not annual software revenue or addressable
      spend. Separately, 6sense detects 283 customer domains, estimates 0.56% category
      share, and ranks Kahua number 24 in its broad Construction Management category.
      That technographic denominator is plainly different from Kahua's self-reported
      customer denominator. Tracxn's 2,262 active competitors, including 165 funded and
      100 exited, indicates a broad and crowded category but cannot be converted into
      market dollars. The retained figures therefore constrain the opportunity narrative
      without supplying a bottom-up valuation denominator.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM012
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: "Buyer Segments, Users, and Adoption Drivers"
    body: >-
      The official product surface identifies federal, state and local, transportation,
      education, healthcare, commercial real-estate, data-center, utility, and industrial
      programs as relevant verticals. Across those segments, the likely economic buyer is
      the asset-owning organization, while project managers, delivery teams, contractors,
      and compliance stakeholders participate in the workflow. Exact budget ownership and
      procurement authority are not documented in the allocated sources and remain a
      diligence item rather than a fact. Adoption is supported by the need to connect
      funding, controls, documents, portfolio visibility, and handover in one record.
      Capterra's review corpus identifies project management, multiple-project management,
      and document management as the three most frequently rated critical or important
      category features, aligning with Kahua's multi-program positioning. The 2026 product
      and certification cadence also shows the company investing in secure AI, information
      management, and connected field records for governance-sensitive buyers.
    claimRefs:
      - CM003
      - CM013
      - CM015
      - CM016
    tableRefs:
      - TM003
    figureRefs: []
  - id: adoption-constraints
    title: "Adoption Constraints and Valuation Relevance"
    body: >-
      The same enterprise characteristics that can make a system of record durable can
      slow initial adoption. Construction Industry AI describes public-owner procurement
      cycles in quarters and switching costs in years; this is third-party analysis, not a
      measured Kahua cohort statistic. RFP.wiki's comparison content also flags rollout
      learning curves, configuration complexity, performance complaints, and governance
      overhead. Because that page is a comparison publisher rather than an independent
      product benchmark, these signals are directional and retained at low confidence.
      Regulatory and mission-critical complexity can therefore operate as both a driver
      and a constraint: it raises the value of governed workflows while lengthening
      procurement, implementation, and change management. For valuation, the evidence
      supports a thesis of enterprise relevance and potential switching friction, but not
      a quantified penetration rate, segment growth rate, or independently measured
      retention premium.
    claimRefs:
      - CM004
      - CM014
      - CM015
      - CM016
    tableRefs: []
    figureRefs: []
