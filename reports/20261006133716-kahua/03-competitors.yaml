callouts:
  - calloutType: strength
    title: Institutional Moat in Public and Regulated Capital Programs
    body: >-
      Kahua's FedRAMP authorization, ISO 27001 information security validation, and ISO 19650 Kitemark certification establish a formidable regulatory moat against commercial-first competitors. For federal civilian and defense agencies, municipal authorities, and healthcare systems, these compliance baselines disqualify lighter construction tools and insulate Kahua from aggressive commodity pricing pressure.
    claimRefs:
      - CP001
      - CP007
      - CP008
  - calloutType: risk
    title: Total Cost and Rollout Friction Dampen Mid-Market Expansion
    body: >-
      Kahua's high total cost of ownership ($20,000 to $100,000 Year 1 TCO for 10 users) and recorded implementation friction—including user-reported UI lag and extended learning curves—limit its penetration among mid-market commercial contractors. In non-mandated private environments, agile point solutions and lower-cost competitors like Procore or JobTread capture buyer demand when rapid out-of-the-box adoption is prioritized.
    claimRefs:
      - CP003
      - CP005
      - CP006
      - CP011
      - CP012
