evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-governance-enumeration
    missingEvidence: >-
      Full organizational chart, exhaustive roster of board of directors, and complete executive leadership team details
      beyond top officers.
    whyItMatters: >-
      Complete visibility into executive governance, committee structures, and non-founder board representatives is
      necessary to evaluate independent oversight.
    diligencePath: >-
      Request the complete executive leadership directory, board committee charters, and formal governance rosters in
      diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: historical-funding-and-cap-table
    missingEvidence: >-
      Audited record of early venture rounds, total equity capital invested prior to 2026, and exact post-money
      ownership distribution.
    whyItMatters: >-
      Understanding prior dilution and capitalization structure is critical to determining founder alignment, investor
      liquidation preferences, and net exit returns.
    diligencePath: >-
      Request confidential cap table disclosures, certificate of incorporation amendments, and investor rights
      agreements from Kahua investor relations.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: profitability-and-cash-burn
    missingEvidence: >-
      GAAP income statements, gross margins, EBITDA, and free cash flow conversion associated with the $100M annualized
      revenue milestone.
    whyItMatters: >-
      High annualized revenue in enterprise SaaS can mask high professional services costs or capital expenditure burn
      associated with FedRAMP compliance and custom deployments.
    diligencePath: >-
      Obtain audited historical financial statements, SaaS cohort metrics, and gross margin breakdowns between software
      licenses and partner services.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Independent annual software-spend estimates that isolate owner-side construction PMIS or capital-program
      management by geography and buyer segment.
    whyItMatters: >-
      Without a consistent revenue denominator, managed capital, projects, customer counts, and technographic detections
      cannot support a defensible TAM, SAM, SOM, penetration rate, or growth rate.
    diligencePath: >-
      Obtain relevant analyst market datasets and reconstruct a bottom-up model from verified target-account counts,
      contract values, deployment rates, and geographic eligibility.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-denominators
    missingEvidence: >-
      Definitions, account hierarchy, period, and methodology behind Kahua's 2,500+ customers and 6sense's 283 detected
      customers.
    whyItMatters: The incompatible denominators prevent a reliable installed-base share or account-penetration calculation.
    diligencePath: >-
      Reconcile CRM account definitions with a dated customer roster and request 6sense methodology and coverage
      documentation.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-and-budget-ownership
    missingEvidence: >-
      Verified procurement records identifying economic buyers, budget owners, contract values, implementation duration,
      and renewal authority by segment.
    whyItMatters: Segment-level budget ownership and adoption timing are necessary for a bottom-up SAM and sales-cycle model.
    diligencePath: >-
      Sample executed contracts, procurement files, win-loss records, and customer interviews across public and
      commercial owner segments.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Detailed breakdown of GAAP cost of goods sold, cloud infrastructure hosting expenses, customer support overhead,
      and professional services delivery margins.
    whyItMatters: >-
      Gross margin determines the long-term unit profitability and cash generation power of Kahua's $100 million revenue
      base.
    diligencePath: >-
      Request audited GAAP income statements and cost-of-revenue schedules under non-disclosure agreement in private
      management meetings.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: net-revenue-retention
    missingEvidence: >-
      Historical net dollar retention (NDR) and gross dollar retention (GDR) cohort metrics across annual customer
      vintages.
    whyItMatters: >-
      Without retention data, underwriters cannot determine whether revenue growth is fueled by durable organic account
      expansion or masked customer churn.
    diligencePath: Inspect 3-year historical revenue retention cohort analyses and contract renewal logs.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: cash-flow-and-burn
    missingEvidence: >-
      Operating cash flow, free cash flow, EBITDA margins, and monthly net cash burn prior to the Bain Capital
      financing.
    whyItMatters: >-
      Cash burn trajectory determines whether the $250 million capital infusion provides indefinite self-funded runway
      or finances ongoing operating deficits.
    diligencePath: Review audited cash flow statements, balance sheet debt facilities, and operating budget forecasts.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal-proxy
    missingEvidence: >-
      Public developer repository signals (GitHub releases, contributor counts, package downloads) or dedicated
      open-source developer forum metrics are not maintained for Kahua's proprietary enterprise PaaS.
    whyItMatters: >-
      Independent developer adoption velocity, external plugin ecosystem growth, and practitioner community sentiment
      cannot be audited through open software registry signals.
    diligencePath: >-
      Request private kStore marketplace transaction volumes, certified third-party developer headcount, and partner SDK
      release notes directly in diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: sla-and-uptime-metrics
    missingEvidence: >-
      Audited historical uptime figures, formal SLA commitment schedules, and recovery time objectives (RTO/RPO) across
      multi-tenant and federal cloud environments are not publicly published.
    whyItMatters: >-
      Prospective buyers and investors cannot independently verify system reliability track records or disaster recovery
      latency during major infrastructure disruptions.
    diligencePath: >-
      Request SOC 2 Type II audit reports, FedRAMP continuous monitoring reports, and 36-month historical
      incident/outage logs under NDA.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo churn, and cohort expansion rates across
      owner vs contractor accounts.
    whyItMatters: >-
      Without audited retention and churn figures, it is impossible to independently verify whether the $100M revenue
      scale is driven by high-margin software seat expansion or services-heavy implementations.
    diligencePath: >-
      Request confidential SaaS cohort data, gross/net retention benchmarks, and revenue renewal rates by customer
      segment during investor diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top 10 customer revenue concentration breakdown and federal agency account share of annualized recurring revenue.
    whyItMatters: >-
      High revenue concentration in a few large federal or state transportation programs could pose substantial contract
      renewal and budget volatility risks.
    diligencePath: Review customer revenue concentration schedule and federal contract expiration schedule in confidential data room.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-enumeration
    missingEvidence: Exhaustive roster of enterprise customer accounts and active project values across all 2,500 client organizations.
    whyItMatters: >-
      Public case studies highlight successful institutional deployments but omit discontinued accounts, failed
      implementations, or dormant licenses.
    diligencePath: >-
      Request customer master list with active license counts, historical go-live dates, and implementation partner
      records.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-compliance-and-sla-performance
    missingEvidence: >-
      Historical multi-tenant cloud uptime percentages, SLA penalty payouts, and mean time to recovery (MTTR) figures
      across Kahua's government and commercial clusters, as well as complete statutory regulatory audit logs for table
      TR001.
    whyItMatters: >-
      Unavailability of the PMIS during active construction halts statutory safety reporting, daily field observations,
      and contract submittal reviews.
    diligencePath: >-
      Request SOC 2 Type II compliance reports, complete FedRAMP 3PAO assessment packages, and 3-year historical cloud
      outage logs under NDA.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Exact percentage of total annual revenue derived from Kahua's top 10 customers, specifically anchor public agency
      contracts like the GSA.
    whyItMatters: >-
      Heavy public sector concentration exposes Kahua to legislative appropriation shifts, contract recompete cycles,
      and federal procurement policy changes.
    diligencePath: Obtain customer concentration schedules and contract renewal schedules directly from company management.
    relatedQuestionRefs:
      - QR005
      - QR006
  - type: private-evidence-only
    severity: material
    topic: software-gross-margins
    missingEvidence: >-
      Breakdown of gross margin performance between pure software subscription licensing and customized implementation
      or support services.
    whyItMatters: >-
      If high onboarding friction forces excessive professional services overhead, structural unit profitability will
      fall below peer SaaS benchmarks.
    diligencePath: Review audited GAAP financial statements and revenue recognition schedules for subscription vs services revenue.
    relatedQuestionRefs:
      - QR005
      - QR006
  - type: private-evidence-only
    severity: material
    topic: retention-and-gross-margins
    missingEvidence: >-
      Audited gross margin percentages, subscription vs professional services revenue split, and historical net revenue
      retention (NRR) cohorts.
    whyItMatters: >-
      Without retention and gross margin data, allocators cannot verify whether the 10.0x valuation multiple is
      supported by high-margin software operating leverage or diluted by heavy services delivery.
    diligencePath: >-
      Request historical 3-year audited financial statements and cohort retention waterfall matrices in confidential
      management meetings.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV001
  - type: private-evidence-only
    severity: material
    topic: cash-flow-and-burn-rate
    missingEvidence: >-
      Free cash flow conversion, adjusted EBITDA, and monthly net cash burn trajectory preceding the Bain Capital
      transaction.
    whyItMatters: >-
      Verifying cash flow characteristics determines whether the growth investment funds runway expansion or subsidizes
      ongoing operating deficits.
    diligencePath: Examine audited cash flow statements, debt covenant schedules, and management budget projections.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: minor
    topic: capitalization-table-and-preferences
    missingEvidence: Fully diluted capitalization table, class-specific liquidation preferences, and employee option pool sizing.
    whyItMatters: >-
      Preferred equity liquidation overhang could materially alter common equity return economics in down-market or
      multiple-compression exit scenarios.
    diligencePath: >-
      Inspect the updated certificate of incorporation and investor rights agreements filed pursuant to the
      Series/Growth round.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV001
