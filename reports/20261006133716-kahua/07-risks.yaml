callouts:
  - calloutType: "risk"
    title: "Regulatory System of Record Exposure in Life-Safety and Federal Governance"
    body: |
      Serving as the mandatory system of record for federal civilian infrastructure like the GSA elevates Kahua's risk profile beyond standard productivity software. Handling Fire & Life Safety (FLS) accident reporting, hot work permits, and safety incident notifications requires flawless availability and strict audit integrity. Any unmitigated data loss or workflow breakdown could expose both agency clients and the platform to severe regulatory penalties and legal scrutiny.
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR012"
  - calloutType: "insight"
    title: "Low-Code Flexibility vs Implementation and Performance Friction"
    body: |
      Kahua's kBuilder low-code architecture represents both its greatest commercial differentiator and its primary source of operational friction. While configurable applications allow capital program owners to mirror bespoke internal governance, independent review data indicates that rollouts require significant process discipline and training. Furthermore, handling large enterprise portfolios with complex historical records creates noticeable UI lag and task processing delays.
    claimRefs:
      - "CR001"
      - "CR006"
      - "CR007"
      - "CR016"
