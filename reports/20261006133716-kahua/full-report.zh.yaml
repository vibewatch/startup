      - number: '7.3'
        title: 运营平台稳定性、可用性摩擦与生态依赖
        blocks:
          - type: paragraph
            body: >
              Kahua 的低代码平台即服务（PaaS）模式为复杂资本项目提供了无可比拟的灵活性，但这种可配置性也带来显著的运营和技术风险 [CR001, CR006, CR016]。RFP.wiki
              上的独立软件评测和经核实的用户评论显示，软件性能长期存在摩擦：拥有数千项任务和大量历史工作分解结构的大型企业项目会出现页面卡顿、任务处理变慢和界面冻结 [CR006,
              CR007]。客户反馈还指出，初始学习曲线陡峭；与轻量、开箱即用的项目管理工具相比，部署 Kahua 需要更强的组织纪律、管理员培训和定制化应用治理 [CR006, CR007]。Kahua
              虽然提供丰富的平台报表向导、临时报表构建器和定时分发工具，但跨应用的复杂报表仍需要专门访问底层 Data Store，并依赖专职管理员协助 [CR016]。


              生态系统依赖又增加了一层运营脆弱性 [CR008, CR009]。为了把资产全生命周期治理从资本规划延伸到运营，Kahua 深度依赖企业合作伙伴平台的互操作性，尤其是 IBM
              Maximo，用于数字资产移交和计算机化维护管理（CMMS）[CR008]。Kahua 还依赖 Esri ArcGIS 的专业集成来绘制基础设施空间地图，并连接 DocuSign、Bluebeam 和 Sage
              会计软件 [CR007, CR009]。如果合作伙伴 API 接口发生破坏性变更，或关键企业连接器在项目收尾期间失效，客户就可能面临数字资产移交中断，以及运营设施启用延迟 [CR008, CR009]。
            claimRefs:
