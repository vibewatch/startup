      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 双重竞争壁垒：深度 PaaS 可配置性与 FedRAMP 安全边界
            body: >-
              Kahua 采用低代码平台即服务（PaaS）架构，而不是僵化的单点应用，因此形成了显著的企业进入壁垒。再加上高保障等级的 FedRAMP 和 StateRAMP 授权， Kahua
              能服务联邦、交通和医疗等高度受监管项目，成为可信的事实记录系统；竞争对手若无多年安全复认证，很难轻易进入。
            calloutType: strength
            claimRefs:
              - CO001
              - CO003
              - CO008
          - type: callout
            title: 实施摩擦与用户上手负担
            body: >-
              独立从业者评测和买方评价显示，Kahua 的高度可配置性带来较陡的用户学习曲线、复杂的管理治理，以及大型项目记录中的偶发浏览器性能问题。 缺少专职项目控制管理员的组织，相比开箱即用的 SaaS
              工具，可能需要更久才能实现价值。
            calloutType: risk
            claimRefs:
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              有证据支持的 Kahua 核心市场，是资产所有者及其交付团队用于管理复杂资本项目的软件，覆盖规划、融资、成本与风险控制、项目交付、组合报告和移交。 这一边界包括建筑 PMIS
              和资本项目工作流，尤其适用于受监管或承担关键使命、需要受治理事实记录系统的业主。不能因为某些类别触及同一资产生命周期， 就把所有建筑科技、设计创作、承包商估算、通用 ERP
              或设施维护都视为可直接争取的支出。主要现状替代方案，是 Kahua 自身描述的彼此割裂的系统与流程组合； 当项目治理不是采购重点时，轻量级横向项目工具也是替代方案。Construction Industry AI
              将主要买方定义为支付资产费用的组织，同时将承包商视为交付参与者， 这支持以业主为中心的边界，但不能证明客户构成普遍如此。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              指定来源池中没有可靠来源单独测算业主侧 PMIS 年度软件支出，因此精确的 TAM、SAM 或 SOM 都会变成臆测。现有证据只能提供不可比的几个视角。 Kahua 报告客户超过 2,500 家、项目超过
              70,000 个、平台管理资本超过 $400 billion；这些是运营规模指标，不是年度软件收入或可服务支出。 另一方面，6sense 检测到 283 个客户域名，估算品类份额为 0.56%，并在宽泛的
              Construction Management 类别中将 Kahua 排名第 24。 这一技术图谱分母显然不同于 Kahua 自报的客户分母。Tracxn 记录的 2,262 家活跃竞争者（其中 165
              家获得融资、100 家退出）说明品类广泛且拥挤， 但不能换算成市场金额。因此，保留的数字可以约束机会叙事，却无法提供自下而上的估值分母。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
      - number: '2.3'
        title: 买方细分、用户与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              官方产品页面将联邦、州和地方政府、交通、教育、医疗、商业地产、数据中心、公用事业和工业项目列为相关垂直领域。在这些领域中，
              可能的经济买方是资产所有组织；项目经理、交付团队、承包商和合规利益相关者参与工作流。指定来源没有记录确切的预算归属和采购权限，
              这些仍是尽调事项而非事实。采用动力来自把资金、控制、文件、组合可视性和移交连接到同一条记录的需求。Capterra 的评测语料显示， 项目管理、多项目管理和文档管理是最常被评为关键或重要的三项功能，与 Kahua
              的多项目定位一致。2026 年的产品与认证节奏也显示， 公司在安全 AI、信息管理和互联现场记录上持续投入，以服务重视治理的买方。
            claimRefs:
              - CM003
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              能让事实记录系统保持持久性的企业特征，也可能拖慢早期采用。Construction Industry AI 称公共业主的采购周期以季度计、切换成本以年计； 这是第三方分析，不是 Kahua
              的队列统计。RFP.wiki 的对比内容还指出上线学习曲线、配置复杂度、性能投诉和治理负担。由于该页面是对比出版方而非独立产品基准，
              这些信号仅具方向性，因此按低置信度保留。监管和关键使命的复杂性既可能是驱动因素，也是约束：它提高受治理工作流的价值，同时拉长采购、实施和变更管理周期。
              对估值而言，证据支持企业相关性和潜在切换摩擦的判断，但不支持量化渗透率、细分增长率或独立测量的留存溢价。
            claimRefs:
              - CM004
              - CM014
              - CM015
              - CM016
