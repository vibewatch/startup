      - number: '1.3'
        title: 资本化、规模里程碑与企业采用取舍
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，Kahua 达到关键规模门槛，年化收入达到 $100 million；不久后，Bain Capital Tech Opportunities 以超过 $1 billion
              的企业估值进行战略少数股权成长投资 [CO009, CO010]。这笔资金将用于加速产品创新、市场拓展、客户成功和嵌入式人工智能；2026 年主要平台发布包括 360 度实景采集工具 kCapture、 Noa
              AI 助手和 kBuilder Canvas 无代码工作流环境 [CO008, CO010, CO011]。在受监管资本项目中，Kahua 的企业网络安全和合规能力构成竞争壁垒， 包括 FedRAMP
              授权、StateRAMP 认证、ISO 27001，以及 BSI Kitemark 的 ISO 19650 信息管理认证 [CO003, CO008]。不过，独立软件评测和企业用户评价指出， Kahua
              的全面可配置性也带来较陡的上手学习曲线、大型项目数据集中的偶发界面延迟，以及相较简单工具更高的管理负担 [CO012]。年化收入（$100 million）
              和投后估值（$1B+）已获确认，但历史融资轮次、累计募资额和确切净利润率仍未披露 [CO010, CO013]。
