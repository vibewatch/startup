  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 企业建筑与资本项目版图
        blocks:
          - type: paragraph
            body: >-
              资本项目和建筑管理软件市场分为业主驱动的资本项目管理系统（PMIS）、承包商中心的项目交付平台，以及重型土木控制解决方案。 Kahua 处于专业化位置，主要面向资产所有者、项目管理者、公共机构和商业总承包商
              [CP001, CP002]。Kahua 不只关注现场执行或分包商协同， 其架构更强调多年资本项目融资、成本控制、治理和资产生命周期跟踪 [CP001, CP004]。直接竞争包括
              Procore、Autodesk Construction Cloud 等成熟企业建筑平台， 以及 InEight 等基础设施控制套件 [CP003, CP004, CP005]。买方对比基准中，Kahua 的
              ITQlick 得分为 83/100，在建筑项目管理中 73 家供应商里排名第 1； 在 RFP.wiki 的 Construction and Engineering 榜单中则在 41 家供应商里排名第
              10，综合评分 4.4 [CP003, CP006]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
