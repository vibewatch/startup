      - number: '7.2'
        title: 监管、法定合规与法律责任概况
        blocks:
          - type: paragraph
            body: >
              Kahua 的企业壁垒与其在联邦政府、州交通机构和国防机构中的合规态势紧密相连 [CR001, CR005]。公共部门部署要求 Kahua 在获认证的 FedRAMP 边界内运行， 并接受 StateRAMP
              认证和正式机构监督 [CR003, CR005]。在联邦民政项目中，例如 U.S. General Services Administration（GSA）国家资本项目， Kahua 是 Fire & Life
              Safety（FLS）报告、事故跟踪、动火请求和安全事件通知的强制官方事实记录系统 [CR005, CR012]。
              作为生命安全事件的事实记录系统运行，意味着公司承担重大责任；任何云端宕机、数据丢失或工作流路由损坏，都可能直接威胁联邦生命安全和环境法规合规 [CR005, CR012]。

              就法律责任和合同而言，Kahua 通过严格的公共网站条款和协商形成的企业主服务协议（MSA）主动管理风险 [CR013, CR014]。
              其公开条款明确排除适销性、特定用途适用性及不间断或无病毒运行等默示保证，并将非合同网站互动的责任严格限制在 $100 以内 [CR013, CR014]。
              在企业客户协议中，公共部门机构通常会就数据主权、FedRAMP 持续监控义务和赔偿安排协商定制条款 [CR005, CR013]。 但随着 Kahua 通过 Noa 助手和 kCapture
              实景采集将嵌入式人工智能加入平台，公司也面临数据泄漏、自动化决策偏见，以及新兴行政命令和 NIST 指南下联邦 AI 治理合规方面 更严格的监管审查 [CR003, CR010, CR015]。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR010
              - CR012
