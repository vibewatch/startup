            body: >
              作为 GSA 等联邦民用基础设施的强制事实记录系统，Kahua
              的风险画像高于普通生产力软件。处理消防与生命安全（FLS）事故报告、动火许可证和安全事件通知时，系统必须始终可用，审计记录也必须严密完整。任何未缓解的数据丢失或工作流中断，都可能让机构客户和平台面临严重监管处罚及法律审查。
