      - number: '5.4'
        title: 信任、网络安全治理与法定合规态势
        blocks:
          - type: paragraph
            body: >
              在高治理要求的资本建设中，监管合规和信息安全是企业采购不可谈判的前提 [CE004, CE005]。Kahua 建立了专门满足民政、国防和受监管基础设施需求的领先信任体系 [CE005, CE007]。Kahua
              Government Network 同时获得联邦风险与授权管理计划（FedRAMP）和 StateRAMP 授权，使包括 General Services Administration（GSA） 和 U.S.
              Army Corps of Engineers 在内的 16 家联邦机构，能够在多租户云环境中安全管理拨款资本项目 [CE005, CE007]。 在英国，Kahua 获得国防部网络安全认证（Target of
              Assurance），支持公共基础设施项目 [CE005]。

              这一法定基础还由国际认可的合规认证加固 [CE005]。2026 年 3 月，Kahua 完成独立审计并取得 ISO 27001 信息安全管理体系（ISMS）认证， 验证数据保护、威胁管理和业务连续性的企业级控制
              [CE005]。2026 年 9 月，Kahua 获得英国标准协会颁发的 ISO 19650 合规 BSI Kitemark 认证， 验证建筑信息模型（BIM）工作流中的结构化数字信息管理
              [CE005]。独立评估者给 Kahua 的安全与风险管理评分为 4.7/5，认可其细粒度基于角色的访问、 最小权限管理控制和用于争议解决的完整审计轨迹
              [CE004]。不过，这套严格合规架构也带来管理负担，正式治理审查可能拉长较简单商业项目的部署周期 [CE004]。
            claimRefs:
              - CE004
              - CE005
              - CE007
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 专有 kBuilder 低代码引擎与联邦枢纽到枢纽主权
            body: >-
              Kahua 作为可扩展 PaaS 的架构基础，使其区别于传统僵化的 SaaS PMIS 套件。借助 kBuilder 提供超过 600 个自定义应用，并通过 kBuilder Canvas 引入可视化无代码设计，
              Kahua 让复杂业主无需代码分支即可定制工作流。关键在于，其枢纽到枢纽联邦数据库模型确保业主和总承包商在收尾时仍拥有项目记录主权，避免单方数据锁定。
            calloutType: strength
