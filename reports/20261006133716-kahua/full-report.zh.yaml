    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营与增长假设
      - 估值倍数与退出逻辑
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 在 4 年内以 28-32% CAGR 增长至 $225M；AI 模块推动 NRR 达到 120%+；公共部门资本项目激增
        - 通过科技 IPO 或战略合并，以 10.0x-12.0x ARR 退出（企业价值 $2.25B-$2.70B）
        - 企业 IT 支出冻结；联邦基础设施拨款严重延迟
        - 25%（取决于联邦业务快速扩张和 AI 加售率较高）
      - - 基准情景
        - ARR 在 4 年内以 18-22% CAGR 增长至 $165M；核心 PMIS 稳定续约，AI 附加模块适度附着
        - 通过二级私募股权收购，以 7.0x-8.0x ARR 退出（企业价值 $1.15B-$1.32B）
        - 销售周期拉长；企业垂直软件整体倍数压缩
        - 50%（反映多年期公共合同的黏性和成熟垂直 SaaS 的增长）
      - - 悲观情景
        - ARR 增速降至 <8% CAGR（4 年内为 $115M）；实施摩擦和界面延迟导致客户流失
        - 在困境整合或下轮融资重组中，以 4.0x-5.0x ARR 退出（企业价值 $460M-$575M）
        - 安全认证遭到破坏；Procore 面向业主的产品激烈竞争
        - 25%（反映对高初始估值和未经核实留存指标的脆弱性）
    notes: 投资判断情景以 4 年持有期为假设起点，基准是 2026 年 9 月 Bain Capital 的增长投资。
