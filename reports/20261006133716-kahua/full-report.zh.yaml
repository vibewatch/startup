  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、资本生命周期覆盖与解决方案模块图
        blocks:
          - type: paragraph
            body: >
              Kahua 是面向企业的资本项目和建筑项目管理平台，覆盖从早期资本规划到运营移交的完整资产生命周期 [CE001, CE003]。传统建筑管理解决方案主要关注 承包商现场管理和分包商沟通，而 Kahua
              的产品重心是机构资产所有者，包括联邦机构、交通管理部门、医疗网络、高等教育机构和商业项目开发商 [CE001, CE003,
              CE004]。平台提供统一事实记录系统，覆盖六个主要解决方案领域：资本规划与资金分配、成本与风险控制、完整项目交付、 组合与绩效分析、资产生命周期与移交，以及可配置低代码工作流设计 [CE001, CE003,
              CE006]。

              在这些解决方案支柱下，Kahua 将运营能力组织成离散的功能应用，可在 Web 工作站和移动设备上使用，以连接现场与办公室团队 [CE001, CE006]。
              平台跟踪资本规划分配、资金来源分摊、设计审查、投标、合同、变更单、RFI、提交件和现场观察 [CE001, CE004, CE006]。 通过资产中心项目管理（ACPM）范式，Kahua
              在施工交付期间就整理资产标签、设备保修和调试数据，而不是等到项目收尾才收集记录 [CE001, CE002, CE005]。 2026 年 8 月，Kahua 推出 kCapture，把 360
              度实景采集直接嵌入项目文档记录 [CE005]。商业包装覆盖业主、项目管理者、总承包商和分包商的定制层级， 服务超过 2,500 家客户组织和 70,000 个活跃项目 [CE001, CE006]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
