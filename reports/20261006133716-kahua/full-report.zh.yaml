            title: 市场规模仍是尽调缺口
            body: 现有证据证明了平台规模和品类竞争，却没有单独测算业主侧 PMIS 年度软件支出。估值工作不应把管理资本、项目数或技术图谱检测结果转换成收入 TAM。
            calloutType: risk
