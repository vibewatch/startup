              - CP004
              - CP005
              - CP006
              - CP011
      - number: '3.2'
        title: 架构差异化与供应商能力
        blocks:
          - type: paragraph
            body: >-
              Kahua 通过灵活的低代码可配置性和严格的公共部门合规资质，塑造企业价值主张 [CP002, CP007, CP008]。不同于僵化的传统套件或标准承包商工具， Kahua
              允许资本项目业主设计自定义应用和工作流自动化；最近又加入 kCapture 360 度实景采集，并成为首个在安全联邦边界内启用 AI 的 FedRAMP 认证建筑 PMIS [CP007,
              CP008]。相比之下，市场老牌 Procore 在总承包商中的普及度更高，拥有超过 8,700 条评价，并提供深入的移动端现场到办公室执行能力， 但其历史定位仍偏向承包商，而非由业主管理 [CP005,
              CP006]。InEight 面向重工业、矿业和电力行业的超大型项目资本控制，管理项目价值超过 $1 trillion， 但配置负担重、上手曲线陡峭 [CP004, CP006]。Buildertrend
              等住宅和轻型商业替代方案面向规模较小的建造商、价格更低，却缺少多百万美元机构资本项目所需的企业级扩展能力 [CP004, CP005]。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
