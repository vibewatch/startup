              - CU009
          - type: callout
            title: 总承包商网络中的现场采用脆弱性
            body: >-
              资本项目业主看重 Kahua 的可审计性和资金来源控制，但其在总承包商和分包商网络中的现场采用仍是运营脆弱点 (CU002)。 市场评价反复指出处理延迟、过时的移动端体验和复杂的管理设置是痛点，促使现场团队考虑
              Procore 或 INGENIOUS.BUILD 等更轻量的替代方案 (CU002, CU003, CU004)。
