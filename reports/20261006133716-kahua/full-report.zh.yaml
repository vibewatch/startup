  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现来源与商业架构
        blocks:
          - type: paragraph
            body: >
              Kahua 是一家基于云的 B2B 企业软件即服务（SaaS）平台，面向资本项目业主、项目管理者和总承包商。主要收入引擎是经常性软件订阅，
              让客户使用其协作式项目管理信息系统（PMIS）和低代码工作流引擎。Kahua 不按建筑价值收取交易百分比，而是按组织规模、用户席位、
              功能模块组合（如资本规划、成本控制、采购和现场管理）及资本项目组合规模，对年度和多年订阅许可进行定价。

              在官方披露中，Kahua 宣布截至 2026 年 9 月达到 $100 million 年化收入里程碑。平台支持超过 2,500 家企业客户，
              这些客户在交通、医疗、教育、国防和数字基础设施等受监管资产领域共同管理超过 $400 billion 的资本项目。不过，Kahua 的公开网站完全没有披露
              公共合同价格表和目录价档位；所有商业合作都通过定制化企业报价和协商式 RFP 提案完成。第三方评价汇总显示，小团队认可可配置的上手体验，
              但企业上线需要大量实施服务、合作伙伴系统集成和管理定制，说明其销售模式较重，并附带可观的专业服务。
            claimRefs:
              - CI001
