chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营根基与核心平台
        blocks:
          - type: paragraph
            body: >-
              Kahua 是一家软件开发和企业云公司，总部位于佐治亚州阿尔法利塔，分布式团队为美国、加拿大、英国和欧洲各地的资本项目提供支持 [CO001, CO002]。公司成立于 2009 年，名称源自夏威夷语
              kahua，字面意为“基础”或“平台”，传达出结构化行业最佳实践与开放灵活性的双重理念 [CO001]。Kahua 从创立之初就不是僵化的单点解决方案，也不是工作流固定的传统 SaaS
              应用，而是一个可配置的平台即服务（PaaS）和低代码环境， 用来适配复杂的组织治理和不断变化的资本项目需求 [CO001, CO003]。该平台贯穿资本资产全生命周期，作为统一事实记录系统，整合长期资本规划、
              资金来源分配、成本控制、进度管理、设计审查、现场执行和结构化运营移交 [CO004]。在企业网络中，Kahua 管理的资本项目超过 $400 billion， 覆盖超过 70,000 个活跃项目，服务逾
              2,500 家客户组织，并得到 500 多家认证行业合作伙伴支持 [CO004, CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
