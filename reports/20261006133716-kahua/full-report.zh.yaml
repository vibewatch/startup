      - number: '6.3'
        title: 采用轨迹、可用性摩擦与持久性
        blocks:
          - type: paragraph
            body: >-
              Kahua 最近的商业规模体现在 2026 年 9 月达到 $100 million 年化收入，同时获得 Bain Capital Tech Opportunities 的少数股权成长投资，估值超过 $1
              billion (CU006)。但独立客户反馈揭示了影响广泛用户采用的运营摩擦 (CU002, CU003)。在软件评测目录中，Kahua 的总评分为 4.3 至 4.6/5， 但仅基于 20 至 65
              条相对少量的评价，说明客户集中于大型企业买方，而非广泛的承包商群体 (CU002, CU003)。评价情绪呈现明显差异： 评测者对运营灵活性和易用性的评分持续高于对设置和管理便捷性的评分
              (CU002)。独立分析强调，平台完全配置后很稳健，但维护自定义应用和构建工作流所需的管理投入， 造成陡峭的学习曲线和上线延迟 (CU002,
              CU003)。用户经常提到任务繁重日子的处理延迟，以及外部分包商复杂的上手过程 (CU002, CU003)。
              多年项目的企业业主因配置锁定和审计留存要求而具备较高合同持久性，但向分包商层级扩展时，会受到更简单的一体化替代方案阻力 (CU002, CU004)。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
