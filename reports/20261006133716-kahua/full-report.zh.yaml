      - number: '7.4'
        title: 财务模型不透明、论点失效触发器与尽调路线图
        blocks:
          - type: paragraph
            body: >
              在 Bain Capital Tech Opportunities 以超过 $1B 估值进行少数股权成长投资、且 Kahua 于 2026 年 9 月实现 $100M
              年化收入后，其偿付能力和近期融资风险实际上已经消除 [CR010, CR011]。但由于完全没有公开披露 GAAP 毛利率、净收入留存率（NRR）、获客成本和经营现金消耗，结构性财务风险仍未得到监测
              [CR010, CR011]。企业软件中的高接触式联邦部署和定制化低代码实施，通常伴随高昂的专业服务成本和持续的管理支持开销，可能把毛利率压到纯 SaaS 基准以下 [CR006, CR010]。


              为保护资本，潜在投资者和企业承销方必须监测与可量化运营及治理事件挂钩的明确论点失效触发器 [CR005, CR010, CR011]。以下情况会发出论点失效信号：（1）FedRAMP 或 StateRAMP
              授权丧失或暂停，这会立即叫停新的联邦民用和国防机构采购；（2）主要公共机构客户流失或合同不续约，例如 GSA 或 USACE
              将资本项目转移到竞争平台；（3）未经缓解的软件扩展性瓶颈导致持续平台中断，或大型项目客户普遍不满；（4）私有数据室发现软件毛利率低于 65%，或净客户留存率恶化至 100% 以下 [CR005, CR006,
              CR010, CR011]。尽调应优先取得经审计财务报表、历史客户群留存表和独立第三方渗透测试结果 [CR010, CR011]。
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
      - number: '7.5'
        title: 展示材料
        blocks:
