      - number: '4.2'
        title: 市场进入、销售效率代理指标与利润结构
        blocks:
          - type: paragraph
            body: >
              Kahua 依靠企业直销，同时借助增值经销商（VAR）、认证系统集成商和 IBM 等战略联盟伙伴。IBM 的合作伙伴披露显示，其 VAR、经销商和解决方案提供商关系 将 Kahua 与 IBM Maximo
              集成，用于资产移交。公共机构、医疗系统和高等教育业主的企业销售周期通常为 6 至 18 个月，因为正式采购和 FedRAMP 安全合规要求较多。

              从投资判断角度看，Kahua 的底层单位经济仍是信息不透明的尽调难题。Multiples.vc 的第三方可比数据显示，Kahua 的收入倍数为 10.0x （$100 million 年化收入对应 $1.0
              billion 估值），与垂直 B2B SaaS 的溢价估值中位数相符。但毛利率、净收入留存（NRR）、获客成本（CAC）、 CAC 回收期和专业服务毛利等核心经营指标，均未向公众披露。RFP.wiki
              记录的用户情绪显示，企业上线需要严格的流程纪律和管理员培训； 用户在处理复杂的多项目组合时，偶尔遇到软件卡顿和性能冻结。这些运营摩擦意味着持续的客户支持、基础设施托管和实施开销，可能把毛利率压到纯 SaaS
              平均水平以下。
            claimRefs:
              - CI007
