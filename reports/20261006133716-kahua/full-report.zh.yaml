              - CO005
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: 管理层、治理与关键人物连续性
        blocks:
          - type: paragraph
            body: >-
              Kahua 由首席执行官 Scott Unger 和总裁 Brian Moore 联合创办。两位连续创业者此前创办并打造了 Constructware——业内首个基于 Web 的协作式建筑项目管理系统， 该公司于
              2006 年被 Autodesk 收购 [CO001, CO006]。在首席技术官 Colin Whitlatch、高级品牌与传播总监 Sonya Lehner 及成熟运营团队的支持下，
              管理层为企业建筑技术带来罕见的领域资历和深厚的行业信誉；公司员工规模为 201 至 500 人 [CO002, CO006, CO007, CO008]。 2026 年 9 月，Kahua 获得 Bain
              Capital Tech Opportunities 的战略少数股权成长投资，强化机构治理和资本支持，并将 Bain Capital 合伙人 Philip Meicler 纳入投资者网络和治理圈 [CO009,
              CO010]。Unger 与 Moore 长期的运营资历带来强大的战略一致性和客户信任，但两位创始人同时主导 产品与市场，也形成明显的关键人物依赖。随着年化收入超过 $100
              million，长期继任规划和高管梯队深度成为重要尽调事项 [CO006, CO010]。
            claimRefs:
