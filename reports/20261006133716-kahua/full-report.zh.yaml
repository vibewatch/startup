  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 观点
      - 核心论点与结构性驱动因素
      - 支持证据与指标
      - 会推翻该观点的条件
    rows:
      - - 投资论点
        - 面向业主的资本项目具备高治理壁垒，公共部门和机构资产所有者黏性强
        - FedRAMP 授权、ISO 19650 认证、2,500+ 企业客户、$400B+ 管理项目和 $100M 年化收入
        - FedRAMP 安全授权失效，或企业客户大量流失至横向承包商平台
      - - 投资论点
        - 产品创新与嵌入式 AI 变现扩大了复杂资本资产中的软件钱包份额
        - 商业化推出嵌入式 AI 助手 Noa、kCapture 可视化现实捕捉和低代码 kBuilder Canvas 平台
        - 客户对 AI 附加模块采用率低，或通用无人机 / 摄像工具使生成式可视化文档商品化
      - - 反论点
        - 在留存率和毛利率完全不透明的情况下，较高的入场倍数没有安全边际
        - 10.0x 收入倍数（$100M 年化收入对应 $1.0B 估值），但 GAAP 毛利、NRR 和现金消耗均未披露
        - 经审计确认订阅毛利率 >80%、净收入留存率 >120%，且 GAAP 经营利润持续为正
      - - 反论点
        - 企业部署复杂度与软件性能滞后造成采用瓶颈，并推高服务交付成本
        - RFP.wiki 评价记录了任务处理延迟、应用冻结和繁重的管理员配置负担
        - 证明客户实现价值所需时间缩短，且独立基准测试显示界面响应速度处于行业领先水平
    notes: 结构性核心论点以已验证的公司披露与第三方软件评价为依据，截至 2026 年 10 月。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV010
