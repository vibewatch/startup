  - id: FE001
    title: Kahua PaaS 运营栈与治理架构
    type: stack
    summary: 分层呈现 Kahua 的企业技术栈，涵盖信任边界、数据主权、核心 PMIS 服务、低代码扩展能力和界面层。
    data:
      layers:
        - label: 客户互动与现场捕捉界面
          detail: 连接办公室高管与现场人员的全渠道访问层
          items:
            - 响应式 Web 工作站（Chrome、Edge、Firefox）
            - 原生移动现场应用（iOS 与 Android 离线同步）
            - kCapture 360 度现实采集现场界面
            - 按角色划分的高管仪表盘与项目组合门户
        - label: 可扩展性与嵌入式智能层
          detail: 可配置的应用开发与 AI 辅助框架
          items:
            - kBuilder Canvas 可视化无代码解决方案设计器
            - kBuilder 低代码应用开发运行时
            - Noa 嵌入式 AI 助手（自然语言查询与草稿生成）
            - kStore 预构建社区与合作伙伴应用市场
        - label: PMIS 核心业务与资本管理引擎
          detail: 面向特定领域的资本项目控制与全生命周期业务逻辑
          items:
            - 资本规划与多来源资金分摊
            - 成本变更管理、WBS 与预算审计控制
            - 文档管理、RFI、提交件与图纸登记簿
            - 资产中心项目管理（ACPM）移交引擎
        - label: 企业集成与生态系统总线
          detail: 基于标准的互操作连接器与 API 网关
          items:
            - Esri ArcGIS 双向空间数据同步
            - CMMS 移交连接器（IBM Maximo 与 Nuvolo）
            - 财务与 ERP 桥接（Sage 会计与总账）
            - 面向定制企业数据管道的安全 RESTful API 网关
        - label: 数据主权与 Hub-to-Hub 持久化层
          detail: 确保企业拥有数据所有权的联邦数据库架构
          items:
            - 租户隔离的关系数据库实例
            - Hub-to-Hub 联邦式组织间数据共享
            - 不可篡改的交易审计日志与修订追踪
            - 静态数据（AES-256）与传输中数据（TLS 1.3）自动加密
        - label: 认证安全与法定合规基础
          detail: 严格的政府与国际合规边界
          items:
            - FedRAMP 授权联邦云安全边界
            - StateRAMP 认证公共部门安全基础设施
            - ISO 27001 认证信息安全管理体系
            - BSI Kitemark 认证 ISO 19650 信息管理
    approximationNotes: 架构分层综合自 Kahua 平台白皮书、技术合作披露（Esri、IBM、Microsoft）及第三方采购审计。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程与采用生命周期图
    type: journey-map
    summary: 展示资本项目中客户入驻阶段、运营界面、行政负担与扩张驱动因素。
    data:
      items:
        - label: 1. 采购与合规审查
          detail: 业主重点评估 FedRAMP 安全性、资金来源追踪能力与可审计性要求。
          stage: 采购
          touchpoints:
            - RFP 合规核验
            - FedRAMP 安全审计
            - 资金来源映射
        - label: 2. 配置与工作流设计
          detail: 实施阶段利用 kBuilder Canvas 定制审批层级与自定义表单。
          stage: 入驻
          touchpoints:
            - kBuilder 应用配置
            - ERP 连接器范围界定
            - 管理员培训路径
        - label: 3. 系统集成与上线
          detail: 在 SI 合作伙伴支持下，把项目控制接入企业财务骨干系统。
          stage: 部署
          touchpoints:
            - 财务 ERP 集成
            - 历史项目数据迁移
            - 项目启动
        - label: 4. 日常执行与 AI 辅助
          detail: 日常完成从现场到办公室的文档处理、成本追踪，以及 Noa AI 辅助的搜索与摘要生成。
          stage: 活跃运营
          touchpoints:
            - RFI 与提交件流转
            - 变更订单审批
            - Noa 自动录入数据
        - label: 5. 项目组合汇总与多年期扩张
          detail: 跨项目组合的高管仪表盘，以及向多年期资本融资周期扩展。
          stage: 扩张
          touchpoints:
            - 高管项目组合报告
            - 合作伙伴生态应用附加模块
            - 多年期合同续签
        - label: 6. 现场采用难题
          detail: 与专业承包商持续存在摩擦，需要持续管理变更并培训人员。
          stage: 风险面
          touchpoints:
            - 分包商入驻滞后
            - 移动端 UX 摩擦
            - 管理员资源需求
    approximationNotes: 阶段与触点综合自客户案例、实施合作伙伴披露及经核实的市场用户评价。
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU007
      - CU009
