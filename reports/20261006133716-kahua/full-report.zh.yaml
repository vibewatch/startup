              - CE006
              - CE007
          - type: callout
            title: 运营学习曲线、管理负担与界面延迟
            body: >-
              Kahua 低代码引擎的灵活性也造成可衡量的运营摩擦。RFP.wiki 的独立软件评测和经验证用户反馈一再指出，陡峭学习曲线要求专职管理责任。
              此外，用户在运行历史记录丰富的大型项目时报告系统迟缓、浏览器冻结和导航延迟，而原生 ERP 集成广度仍窄于通用工作平台。
            calloutType: risk
