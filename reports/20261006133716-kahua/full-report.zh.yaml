  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 系统化的投资判断逻辑从运营规模与竞争护城河出发，经由风险因素推导观察建议。
    data:
      nodes:
        - id: operating-scale
          label: 企业级 PMIS 规模
          role: Operating foundation ($100M annualized revenue, 2,500+ customers, $400B+ managed capital programs)
          value: Scale Moat
        - id: compliance-moat
          label: 高治理合规
          role: Regulatory lock-in (FedRAMP authorized, ISO 19650 certified, public agency adoption)
          value: Barrier to Entry
        - id: valuation-pricing
          label: 估值与资本结构
          role: Bain Capital minority growth round ($1.0B+ valuation at 10.0x annualized revenue multiple)
          value: Premium Entry Price
        - id: opacity-risk
          label: 私有财务信息不透明
          role: Undisclosed GAAP gross margins, unknown net revenue retention, and hidden cash burn
          value: Diligence Blocker
        - id: rollout-friction
          label: 实施开销
          role: Third-party customer evidence of steep learning curve, task lag, and complex admin setup
          value: Margin Headwind
        - id: final-recommendation
          label: 观察建议
          role: Maintain coverage and monitor private operating disclosures before committing capital at 10x revenue
          value: Track / Medium Confidence
      edges:
        - from: operating-scale
          to: compliance-moat
        - from: compliance-moat
          to: valuation-pricing
        - from: valuation-pricing
          to: opacity-risk
        - from: opacity-risk
          to: rollout-friction
        - from: rollout-friction
          to: final-recommendation
    approximationNotes: 逻辑决策树将经核实的运营成果与有记录的风险因素连接至机构投资建议。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV009
      - CV010
