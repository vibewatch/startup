      - number: '5.2'
        title: 运营模式、kBuilder Canvas 与企业 AI 架构
        blocks:
          - type: paragraph
            body: >
              Kahua 的核心技术差异化来自底层平台即服务（PaaS）架构，由专有的 kBuilder 低代码应用开发平台驱动 [CE006, CE007, CE008]。 不同于模式硬编码的僵化 SaaS
              工具，或难以定期升级的单租户定制代码分支，Kahua 在可扩展的元数据驱动模型中运行应用 [CE006, CE007]。 客户和实施伙伴已在 kBuilder 上开发超过 600 个私有及公共业务应用，并通过
              kStore 应用市场分发和安装 [CE006]。 在架构上，Kahua 采用创新的“枢纽到枢纽”联邦数据库设计，而非传统的“枢纽辐射”仓库 [CE006]。在这一架构下，参与组织分别拥有各自数据库实例的主权；
              项目文件和工作流在交付期间跨实例连接，确保每个参与方在项目收尾时都保留可验证的历史记录 [CE006]。

              2026 年 2 月，Kahua 推出 kBuilder Canvas，这是一个 AI 辅助的无代码解决方案设计环境，功能分析师和系统集成商可以用自然语言提示可视化设计、 模拟和调整自定义应用，无需编写代码
              [CE007]。在 Canvas 中创建的解决方案继承 Kahua 原生治理、基于角色的访问和数据模式规则 [CE007]。 2026 年 5 月，Kahua 又推出由 Kahua AI 智能层驱动的嵌入式 AI
              助手 Noa [CE005]。对公共部门和企业用户而言，关键在于 Kahua 成为首个获得联邦授权、 能在安全政府边界内嵌入 AI 的 FedRAMP 认证建筑 PMIS [CE005]。此外，技术管理层强调与
              Microsoft 合作推进负责任企业 AI， 确保生成式和自动化能力严格遵守联邦数据驻留与访问控制 [CE005, CE008]。
            claimRefs:
              - CE005
              - CE006
              - CE007
