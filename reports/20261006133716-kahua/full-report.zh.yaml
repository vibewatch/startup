  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险分类与综合暴露
        blocks:
          - type: paragraph
            body: >
              评估 Kahua 这一企业资本项目管理平台，需要在其可守住的公共部门地位与明确的运营、监管和财务暴露之间权衡。Kahua 运营于超过 $400 billion 的资本项目中， 覆盖 2,500
              多个客户部署，并为高度受审查的公共机构、医疗网络和基础设施业主提供关键任务事实记录系统 [CR001, CR002]。
              公共和国防资本项目受到严格法定监督，因此软件稳定性失效、采购延迟或伙伴集成故障，都会直接影响项目进度和资本投放 [CR003, CR004]。

              Kahua 面临的主要风险分为四类。第一，监管与法律风险集中在维持 FedRAMP 和 StateRAMP 双重授权、遵守严格的联邦信息安全现代化法案（FISMA）控制，
              以及应对强制性的公共机构审计框架；管理疏漏可能危及多年机构合同 [CR003, CR005]。第二，运营与平台风险源于 Kahua kBuilder 低代码架构的内在复杂性；
              从业者反馈持续指出用户上手曲线陡峭、大型组合运营时界面延迟和管理负担 [CR006, CR007]。第三，伙伴与技术依赖风险来自 Kahua 对商业云基础设施、 IBM Maximo 等企业 CMMS 桥接，以及
              Esri ArcGIS 等专业集成的依赖；这些组件共同支撑端到端资产生命周期治理 [CR008, CR009]。 第四，财务与资本风险反映私营 SaaS 经济模型的结构性不透明：尽管年化收入达到 $100
              million，私有单位指标、核心联邦客户集中度和历史毛利率仍未披露 [CR010, CR011]。
