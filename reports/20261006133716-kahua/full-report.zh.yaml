        title: 展示项
        blocks:
          - type: callout
            title: 两个客户数，两个分母
            body: Kahua 报告的 2,500+ 家公司客户与 6sense 检测到的 283 个客户域名不可互换。差距可能来自定义、账户层级、检测覆盖或时间点； 指定证据没有说明哪一种解释占主导。
            calloutType: insight
