      - number: '3.3'
        title: 定价模式、总拥有成本与采用摩擦
        blocks:
          - type: paragraph
            body: >-
              总拥有成本和商业许可模式，是企业建筑管理软件竞争与比较中的关键摩擦点 [CP005, CP009, CP010]。Kahua 为业主与项目管理者、总承包商和专业承包商提供定制版本， 并配套专业套件附加模块
              [CP002]。行业定价情报显示，Kahua 主要采用按用户订阅的模式，起价约为每用户每年 $690（每个项目起价 $5,000+）， 100 用户的企业层部署，重复性软件费用可达 $69,000 或更高
              [CP003, CP009]。计入完整实施、数据迁移和管理员培训后，10 个企业席位的首年 TCO 预计为 $20,000 至 $100,000；相较标准承包商工具，年度许可承诺可能高出 $10,000 至
              $30,000 [CP003, CP005, CP009]。 不过，这笔高额前期投入，加上覆盖公共机构与主要承包商的定制工作流和跨利益相关者协作，一旦成功落地，就会形成巨大的切换成本和平台锁定 [CP001,
              CP006, CP011]。反过来，从业者反馈持续提示上线复杂度、系统卡顿和陡峭学习曲线，可能拖慢初始价值实现 [CP006, CP011, CP012]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
