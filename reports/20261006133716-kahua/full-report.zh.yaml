      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 企业 PMIS 采用中的可配置性悖论
            body: >-
              Kahua 通过 kBuilder Canvas 实现的低代码架构，是无法使用现成软件的复杂机构业主的主要竞争壁垒。但同一可配置性也构成管理门槛： 缺少内部专职 PMIS 管理员的组织，会面临更长的部署周期、对
              OnIndus 等专业实施伙伴的依赖，以及习惯僵化但熟悉工具的分包商抵触 (CU002, CU009)。
            calloutType: insight
