chapter:
  number: 6
  title: "Customers"
  summary: "Kahua serves over 2,500 customer organizations managing more than $400 billion in capital programs across regulated public infrastructure, federal defense, healthcare, and commercial sectors. While owner-side adoption is anchored by deep workflow configurability and compliance controls, independent reviews highlight substantial administrative overhead and field-adoption friction across general contractor networks."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Enterprise and Institutional Customer Base"
    body: "Kahua focuses primarily on capital program owners, public agencies, institutional healthcare and education systems, and program managers handling large-scale capital assets rather than broad trade contractor networks (CU001, CU002). The company reports supporting over 2,500 customer organizations and 500 certified partners across more than 70,000 capital projects, representing an aggregate of over $400 billion in capital program volume managed on the platform (CU001, CU006). Public sector and regulated infrastructure form the platform's core wedge, driven by compliance capabilities such as sources-of-funds tracking and federal security authorizations (CU002, CU008). Institutional deployments include large transportation authorities like the Pennsylvania Turnpike Commission and public universities such as the University of Colorado Anschutz and University of Illinois (CU005, CU007, CU009). Commercial real estate and enterprise general contractors also utilize Kahua for high-complexity projects, exemplified by Clark Construction's deployment for cost change management on the Chase Center and enterprise technology evaluations by CBRE (CU005). However, Kahua's footprint remains heavily concentrated in asset owners and capital program leaders who require rigid governance, leaving field-first general contractors susceptible to lighter alternative solutions (CU002)."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU001"
  - id: "named-deployments-and-production-proof"
    title: "Named Deployments and Production Outcomes"
    body: "Verified customer case studies and partner disclosures establish that Kahua is deployed across multi-year capital programs requiring structured financial governance and system integration (CU002, CU007). At the University of Colorado Anschutz, Kahua's embedded AI assistant Noa was deployed into the institution's project management information system (PMIS) to automate routine project documentation and create targeted workflow applications while maintaining strict institutional data governance boundaries (CU007). In state transportation infrastructure, the Pennsylvania Turnpike Commission utilizes the platform to standardize field-to-office operations and align workflows with statutory standards (CU005). Complex commercial construction projects have also demonstrated production adoption, including Clark Construction leveraging Kahua to streamline cost change management and maintain visibility into budget variances during construction of San Francisco's Chase Center (CU005). Furthermore, systems integration partner OnIndus has supported production deployments connecting Kahua's PMIS with institutional ERP backbones, such as the phased enterprise finance integration executed at the University of Illinois (CU009). These deployments confirm that Kahua operates as a mission-critical system of record once configured, though enterprise rollouts require extensive implementation services and dedicated administration (CU002, CU009)."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU007"
      - "CU009"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "adoption-friction-and-retention-dynamics"
    title: "Adoption Trajectory, Usability Friction, and Durability"
    body: "Kahua's recent commercial scale is highlighted by achieving $100 million in annualized revenue alongside a minority growth investment from Bain Capital Tech Opportunities valuing the business above $1 billion in September 2026 (CU006). However, independent customer feedback reveals operational friction that impacts broad user adoption (CU002, CU003). Across software evaluation directories, Kahua holds aggregate ratings between 4.3 and 4.6 out of 5 stars based on a relatively small volume of 20 to 65 reviews, indicating concentration among large enterprise buyers rather than widespread contractor adoption (CU002, CU003). Review sentiment demonstrates a pronounced disparity: reviewers consistently award higher scores to operational flexibility and ease of use than to ease of setup and administration (CU002). Independent analyses emphasize that while the platform is robust once fully configured, the administrative effort required to maintain custom apps and build workflows creates a steep learning curve and rollout delays (CU002, CU003). Users frequently cite processing lag on task-heavy days and complex onboarding for external subcontractors (CU002, CU003). While enterprise owners with multi-year programs exhibit high contractual durability due to configuration lock-in and audit retention requirements, customer expansion into subcontractor tiers faces headwinds from simpler, all-in-one alternatives (CU002, CU004)."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU006"
    tableRefs:
      - "TU002"
