callouts:
  - calloutType: "insight"
    title: "The Configurability Paradox in Enterprise PMIS Adoption"
    body: "Kahua's low-code architecture via kBuilder Canvas represents its principal competitive moat for complex institutional owners who cannot use off-the-shelf software. However, this same configurability creates an administrative barrier: organizations that lack dedicated internal PMIS administrators face protracted deployment timelines, reliance on specialized implementation partners like OnIndus, and field resistance from subcontractors accustomed to rigid but familiar tools (CU002, CU009)."
    claimRefs:
      - "CU002"
      - "CU009"
  - calloutType: "risk"
    title: "Field Adoption Vulnerability Across General Contractor Networks"
    body: "While capital program owners value Kahua's auditability and sources-of-funds controls, field adoption across general contractor and subcontractor networks remains an operational vulnerability (CU002). Marketplace reviews consistently identify processing latency, dated mobile experiences, and complex administrative setup as recurring pain points, prompting field teams to consider lighter alternatives like Procore or INGENIOUS.BUILD (CU002, CU003, CU004)."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
