callouts:
  - calloutType: "strength"
    title: "Dual Competitive Moat: Deep PaaS Configurability and FedRAMP Security Perimeter"
    body: "Kahua's architectural positioning as a low-code platform-as-a-service (PaaS) rather than a rigid point application provides an exceptional enterprise barrier to entry. Combined with high-assurance FedRAMP and StateRAMP authorizations, Kahua serves as a trusted system of record for highly regulated federal, transportation, and healthcare programs that competitors cannot easily penetrate without multi-year security recertification."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO008"
  - calloutType: "risk"
    title: "Implementation Friction and User Onboarding Overhead"
    body: "Independent practitioner reviews and buyer evaluations indicate that Kahua's extensive configurability creates operational trade-offs, including a steep user learning curve, complex administrative governance, and occasional browser performance friction on large project records. Organizations lacking dedicated project controls administrators may face delayed time-to-value compared to simpler out-of-the-box SaaS tools."
    claimRefs:
      - "CO012"
