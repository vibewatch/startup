chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2009 by the veteran team behind Constructware, Kahua provides an enterprise project and program management information system (PMIS) for owners and contractors overseeing complex capital programs. In September 2026, the company surpassed $100 million in annualized revenue and secured a minority growth investment from Bain Capital Tech Opportunities at a valuation exceeding $1 billion."
sections:
  - id: "identity-and-market-position"
    title: "Corporate Identity, Operating Roots, and Core Platform"
    body: "Kahua is a software development and enterprise cloud company headquartered in Alpharetta, Georgia, with distributed team members supporting capital programs across the United States, Canada, the United Kingdom, and Europe [CO001, CO002]. Founded in 2009, the company takes its name from the Hawaiian word kahua, which literally translates to 'foundation' or 'platform,' representing a dual ethos of structured industry best practices and open flexibility [CO001]. Rather than introducing a rigid point solution or another traditional SaaS application with static workflows, Kahua was architected from inception as a configurable platform-as-a-service (PaaS) and low-code environment designed to adapt to complex organizational governance and evolving capital program requirements [CO001, CO003]. The platform acts as a unified system of record spanning the entire capital asset lifecycle, integrating long-range capital planning, funding source allocations, cost controls, schedule management, design review, field execution, and structured operational handover [CO004]. Across its enterprise network, Kahua manages more than $400 billion in capital programs across more than 70,000 active projects, serving over 2,500 customer organizations and supported by more than 500 certified industry partners [CO004, CO005]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Continuity"
    body: "Kahua was co-founded by Chief Executive Officer Scott Unger and President Brian Moore, serial entrepreneurs who previously founded and built Constructware, the industry's pioneer web-based collaborative construction project management system, which was acquired by Autodesk in 2006 [CO001, CO006]. The executive team brings rare domain longevity and deep industry credibility to enterprise construction technology, supported by Chief Technology Officer Colin Whitlatch, Senior Director of Brand and Communications Sonya Lehner, and an established operational team overseeing 201 to 500 employees [CO002, CO006, CO007, CO008]. In September 2026, Kahua strengthened its institutional governance and capital backing by securing a strategic minority growth investment from Bain Capital Tech Opportunities, adding Bain Capital Partner Philip Meicler to its investor network and governance circle [CO009, CO010]. While the extensive operational tenure of Unger and Moore provides formidable strategic cohesion and customer trust, their dual founder-market leadership creates a meaningful key-person dependency, making long-term succession planning and executive bench depth vital areas of diligence as the company scales past $100 million in annualized revenue [CO006, CO010]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capitalization-and-strategic-expansion"
    title: "Capitalization, Scale Milestones, and Enterprise Adoption Trade-offs"
    body: "In September 2026, Kahua crossed a defining scale threshold by reaching $100 million in annualized revenue, shortly followed by a strategic minority growth investment from Bain Capital Tech Opportunities at an enterprise valuation above $1 billion [CO009, CO010]. The capital infusion is earmarked to accelerate product innovation, go-to-market initiatives, customer success, and embedded artificial intelligence, following major 2026 platform releases including kCapture for 360-degree reality capture, the Noa AI assistant, and the kBuilder Canvas no-code workflow environment [CO008, CO010, CO011]. A cornerstone of Kahua's competitive moat in regulated capital programs is its enterprise cybersecurity and compliance posture, including FedRAMP authorization, StateRAMP certification, ISO 27001, and BSI Kitemark certification for ISO 19650 information management [CO003, CO008]. However, independent software evaluations and enterprise user reviews highlight operational trade-offs, noting that Kahua's comprehensive configurability introduces a steep onboarding learning curve, occasional interface latency in massive project datasets, and administrative overhead compared to simpler tools [CO012]. While headline annualized revenue ($100 million) and post-money valuation ($1B+) are confirmed, historical funding rounds, cumulative equity raised, and exact net margins remain undisclosed [CO010, CO013]."
    claimRefs:
      - "CO003"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
