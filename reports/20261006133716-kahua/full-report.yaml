  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Taxonomy and Comprehensive Exposure Profile
        blocks:
          - type: paragraph
            body: >
              Evaluating Kahua as an enterprise capital program management platform requires balancing its defensible
              public-sector position against clear operational, regulatory, and financial exposures. Operating in
              capital programs exceeding $400 billion across more than 2,500 customer deployments, Kahua serves as a
              mission-critical system of record for highly scrutinized public agencies, healthcare networks, and
              infrastructure owners [CR001, CR002]. Because public and defense capital programs involve strict statutory
              oversight, failure modes in software stability, procurement delays, or partner integrations carry direct
              consequences for program schedules and capital deployment [CR003, CR004].


              The principal risks confronting Kahua stratify into four distinct categories. First, regulatory and legal
              risks center on maintaining dual FedRAMP and StateRAMP authorizations, adhering to strict Federal
              Information Security Modernization Act (FISMA) controls, and navigating mandatory public agency audit
              frameworks where administrative lapses can jeopardize multi-year agency contracts [CR003, CR005]. Second,
              operational and platform risks arise from the inherent complexity of Kahua's kBuilder low-code
              architecture; practitioner feedback consistently flags steep user onboarding curves, interface latency
              during large-scale portfolio operations, and administrative overhead [CR006, CR007]. Third, partner and
              technical dependency risks stem from Kahua's reliance on commercial cloud infrastructure, enterprise CMMS
              bridges such as IBM Maximo, and specialized integrations like Esri ArcGIS to deliver end-to-end asset
              lifecycle governance [CR008, CR009]. Fourth, financial and capital risks reflect the structural opacity of
              Kahua's private SaaS economics, where private unit metrics, customer concentration among anchor federal
              accounts, and historical gross margins remain undisclosed despite reaching $100 million in annualized
              revenue [CR010, CR011].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
