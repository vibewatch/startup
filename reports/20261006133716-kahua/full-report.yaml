      - number: '3.2'
        title: Architectural Differentiation and Vendor Capabilities
        blocks:
          - type: paragraph
            body: >-
              Kahua differentiates its enterprise value proposition through flexible, low-code configurability and
              rigorous public-sector compliance credentials [CP002, CP007, CP008]. Unlike rigid legacy suites or
              standard contractor tools, Kahua allows capital program owners to design custom applications and workflow
              automations, recently adding kCapture for 360-degree reality capture and becoming the first
              FedRAMP-certified construction PMIS to enable AI within a secure federal boundary [CP007, CP008]. In
              contrast, market incumbent Procore leads in general contractor ubiquity, drawing over 8,700 reviews and
              offering deep mobile field-to-office execution, but Procore remains historically contractor-centric rather
              than owner-governed [CP005, CP006]. InEight serves mega-project capital controls across heavy industrial,
              mining, and power sectors with over $1 trillion in managed project value, yet requires heavy configuration
              and steep onboarding [CP004, CP006]. Residential and lightweight commercial alternatives like Buildertrend
              cater to smaller builders at lower price points but lack enterprise scalability for multi-million-dollar
              institutional capital programs [CP004, CP005].
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
