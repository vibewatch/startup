              - CI010
      - number: '4.2'
        title: Go-to-Market Motion, Sales Efficiency Proxies, and Margin Structure
        blocks:
          - type: paragraph
            body: >
              Kahua's go-to-market motion relies on direct enterprise field sales complemented by value-added resellers
              (VARs), certified systems integrators, and strategic alliance partners such as IBM. In partner
              disclosures, IBM highlights its VAR, reseller, and solution provider relationship integrating Kahua with
              IBM Maximo for asset handover. Enterprise sales cycles for public agencies, healthcare systems, and higher
              education owners typically extend from 6 to 18 months due to formal procurement and FedRAMP security
              compliance requirements.


              From an underwriting perspective, Kahua's underlying unit economics remain an opaque diligence challenge.
              Third-party market comps from Multiples.vc benchmark Kahua at a 10.0x revenue multiple ($1.0 billion
              valuation on $100 million annualized revenue), matching median premium vertical B2B SaaS valuations.
              However, fundamental operational metrics—including gross margin percentage, net revenue retention (NRR),
              customer acquisition cost (CAC), CAC payback duration, and professional services gross margin—are
              completely withheld from public view. User sentiment recorded on RFP.wiki notes that enterprise rollouts
              require significant process discipline and admin training, with users reporting occasional software lag
              and performance freezes when handling complex multi-project portfolios. These operational friction points
              suggest ongoing customer support, infrastructure hosting, and implementation overhead that could constrain
              gross margins below pure-play SaaS averages.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI010
              - CI015
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >
              On September 29, 2026, Kahua announced a landmark $250 million minority growth investment led by Bain
              Capital Tech Opportunities, representing the firm's largest outside institutional capital infusion to date
              and valuing Kahua at above $1.0 billion. Prior to this round, Kahua had raised approximately $30 million
              to $55 million across several early-stage venture rounds and credit facilities, having been valued at
              approximately $100 million in 2019. The $250 million equity injection fundamentally eliminates near-term
              solvency and financing dependency risks, providing extensive runway to fund aggressive investments in
              generative AI capabilities (including its Noa assistant and kCapture reality capture), international
              go-to-market expansion, and talent acquisition.


              Despite exceptional top-line revenue scale ($100 million annualized revenue) and top-tier private equity
              sponsorship, underwriting Kahua requires acknowledging critical information gaps. Because Kahua is a
              closely held private company, historical GAAP gross profit, cash burn, adjusted EBITDA, debt obligations,
              and revenue renewal rates remain strictly undisclosed. Investors cannot verify whether the $100 million
              milestone was achieved with positive operating cash flow or subsidized by sustained operating losses.
              Until audited financial statements and retention cohort matrices are reviewed in private data rooms, Kahua
              must be evaluated as a high-growth, highly capitalized vertical SaaS leader with strong top-line
              validation but unverified profitability and retention dynamics.
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI014
              - CI015
              - CI016
