      - number: '6.3'
        title: Adoption Trajectory, Usability Friction, and Durability
        blocks:
          - type: paragraph
            body: >-
              Kahua's recent commercial scale is highlighted by achieving $100 million in annualized revenue alongside a
              minority growth investment from Bain Capital Tech Opportunities valuing the business above $1 billion in
              September 2026 (CU006). However, independent customer feedback reveals operational friction that impacts
              broad user adoption (CU002, CU003). Across software evaluation directories, Kahua holds aggregate ratings
              between 4.3 and 4.6 out of 5 stars based on a relatively small volume of 20 to 65 reviews, indicating
              concentration among large enterprise buyers rather than widespread contractor adoption (CU002, CU003).
              Review sentiment demonstrates a pronounced disparity: reviewers consistently award higher scores to
              operational flexibility and ease of use than to ease of setup and administration (CU002). Independent
              analyses emphasize that while the platform is robust once fully configured, the administrative effort
              required to maintain custom apps and build workflows creates a steep learning curve and rollout delays
              (CU002, CU003). Users frequently cite processing lag on task-heavy days and complex onboarding for
              external subcontractors (CU002, CU003). While enterprise owners with multi-year programs exhibit high
              contractual durability due to configuration lock-in and audit retention requirements, customer expansion
              into subcontractor tiers faces headwinds from simpler, all-in-one alternatives (CU002, CU004).
