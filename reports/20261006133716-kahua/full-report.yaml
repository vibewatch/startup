  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Kahua's evidenced core market is software used by asset owners and their delivery teams to govern complex
              capital programs across planning, funding, cost and risk control, project delivery, portfolio reporting,
              and handover. This boundary includes construction PMIS and capital-program workflows, especially where
              regulated or mission-critical owners need a governed system of record. It does not treat all construction
              technology, design authoring, contractor estimating, general ERP, or facilities maintenance as directly
              addressable spend merely because those categories touch the same asset lifecycle. The principal status-quo
              substitute is the fragmented combination of disconnected systems and processes described by Kahua itself;
              lighter horizontal project tools are another substitute where program governance is not the buying
              priority. Construction Industry AI independently characterizes the primary buyer as the organization
              paying for the asset while recognizing contractors as delivery participants, which supports an
              owner-centered boundary without proving a universal customer mix.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              No successful source in the assigned pool isolates annual owner-side PMIS software spend, so a precise
              TAM, SAM, or SOM would be invented. The usable evidence instead provides non-comparable lenses. Kahua
              reports more than 2,500 customers, more than 70,000 projects, and more than $400 billion of capital
              managed on the platform. These are operating-scale indicators, not annual software revenue or addressable
              spend. Separately, 6sense detects 283 customer domains, estimates 0.56% category share, and ranks Kahua
              number 24 in its broad Construction Management category. That technographic denominator is plainly
              different from Kahua's self-reported customer denominator. Tracxn's 2,262 active competitors, including
              165 funded and 100 exited, indicates a broad and crowded category but cannot be converted into market
              dollars. The retained figures therefore constrain the opportunity narrative without supplying a bottom-up
              valuation denominator.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
