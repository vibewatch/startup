  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise and Institutional Customer Base
        blocks:
          - type: paragraph
            body: >-
              Kahua focuses primarily on capital program owners, public agencies, institutional healthcare and education
              systems, and program managers handling large-scale capital assets rather than broad trade contractor
              networks (CU001, CU002). The company reports supporting over 2,500 customer organizations and 500
              certified partners across more than 70,000 capital projects, representing an aggregate of over $400
              billion in capital program volume managed on the platform (CU001, CU006). Public sector and regulated
              infrastructure form the platform's core wedge, driven by compliance capabilities such as sources-of-funds
              tracking and federal security authorizations (CU002, CU008). Institutional deployments include large
              transportation authorities like the Pennsylvania Turnpike Commission and public universities such as the
              University of Colorado Anschutz and University of Illinois (CU005, CU007, CU009). Commercial real estate
              and enterprise general contractors also utilize Kahua for high-complexity projects, exemplified by Clark
              Construction's deployment for cost change management on the Chase Center and enterprise technology
              evaluations by CBRE (CU005). However, Kahua's footprint remains heavily concentrated in asset owners and
              capital program leaders who require rigid governance, leaving field-first general contractors susceptible
              to lighter alternative solutions (CU002).
