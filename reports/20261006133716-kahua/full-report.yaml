      - number: '5.4'
        title: Trust, Cybersecurity Governance, and Statutory Compliance Posture
        blocks:
          - type: paragraph
            body: >
              In high-governance capital construction, regulatory compliance and information security serve as
              non-negotiable prerequisites for enterprise procurement [CE004, CE005]. Kahua has established an
              industry-leading trust posture specifically engineered to satisfy civilian, defense, and regulated
              infrastructure requirements [CE005, CE007]. The Kahua Government Network holds dual authorizations under
              the Federal Risk and Authorization Management Program (FedRAMP) and StateRAMP, enabling 16 federal
              agencies—including the General Services Administration (GSA) and the U.S. Army Corps of Engineers—to
              securely manage appropriated capital programs in a multi-tenant cloud environment [CE005, CE007]. In the
              United Kingdom, Kahua achieved Ministry of Defence cybersecurity accreditation (Target of Assurance) to
              support public infrastructure programs [CE005].


              This statutory foundation is reinforced by internationally recognized compliance certifications [CE005].
              In March 2026, Kahua completed an independent audit achieving ISO 27001 certification for its Information
              Security Management System (ISMS), validating enterprise-grade controls for data protection, threat
              management, and business continuity [CE005]. In September 2026, Kahua earned the prestigious BSI Kitemark
              certification from the British Standards Institution for ISO 19650 compliance, validating structured
              digital information management across Building Information Modeling (BIM) workflows [CE005]. Independent
              evaluators award Kahua a 4.7 out of 5 rating for Security and Risk Management, citing its granular
              role-based access, least-privilege administrative controls, and comprehensive audit trails for dispute
              resolution [CE004]. However, this rigorous compliance architecture imposes administrative overhead,
              requiring formal governance reviews that can extend deployment timelines for less complex commercial
              programs [CE004].
            claimRefs:
              - CE004
              - CE005
              - CE007
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary kBuilder Low-Code Engine and Federated Hub-to-Hub Sovereignty
            body: >-
              Kahua's architectural foundation as an extensible PaaS sets it apart from traditional rigid SaaS PMIS
              suites. By enabling over 600 custom applications via kBuilder and introducing visual no-code design with
              kBuilder Canvas, Kahua allows complex owners to tailor workflows without code forks. Crucially, its
              hub-to-hub federated database model ensures that owners and general contractors retain sovereign ownership
              of their project records at closeout, avoiding single-party data lock-in.
