      - number: '1.3'
        title: Capitalization, Scale Milestones, and Enterprise Adoption Trade-offs
        blocks:
          - type: paragraph
            body: >-
              In September 2026, Kahua crossed a defining scale threshold by reaching $100 million in annualized
              revenue, shortly followed by a strategic minority growth investment from Bain Capital Tech Opportunities
              at an enterprise valuation above $1 billion [CO009, CO010]. The capital infusion is earmarked to
              accelerate product innovation, go-to-market initiatives, customer success, and embedded artificial
              intelligence, following major 2026 platform releases including kCapture for 360-degree reality capture,
              the Noa AI assistant, and the kBuilder Canvas no-code workflow environment [CO008, CO010, CO011]. A
              cornerstone of Kahua's competitive moat in regulated capital programs is its enterprise cybersecurity and
              compliance posture, including FedRAMP authorization, StateRAMP certification, ISO 27001, and BSI Kitemark
              certification for ISO 19650 information management [CO003, CO008]. However, independent software
              evaluations and enterprise user reviews highlight operational trade-offs, noting that Kahua's
              comprehensive configurability introduces a steep onboarding learning curve, occasional interface latency
              in massive project datasets, and administrative overhead compared to simpler tools [CO012]. While headline
              annualized revenue ($100 million) and post-money valuation ($1B+) are confirmed, historical funding
              rounds, cumulative equity raised, and exact net margins remain undisclosed [CO010, CO013].
