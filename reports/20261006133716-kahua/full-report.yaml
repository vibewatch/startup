      - number: '2.3'
        title: Buyer Segments, Users, and Adoption Drivers
        blocks:
          - type: paragraph
            body: >-
              The official product surface identifies federal, state and local, transportation, education, healthcare,
              commercial real-estate, data-center, utility, and industrial programs as relevant verticals. Across those
              segments, the likely economic buyer is the asset-owning organization, while project managers, delivery
              teams, contractors, and compliance stakeholders participate in the workflow. Exact budget ownership and
              procurement authority are not documented in the allocated sources and remain a diligence item rather than
              a fact. Adoption is supported by the need to connect funding, controls, documents, portfolio visibility,
              and handover in one record. Capterra's review corpus identifies project management, multiple-project
              management, and document management as the three most frequently rated critical or important category
              features, aligning with Kahua's multi-program positioning. The 2026 product and certification cadence also
              shows the company investing in secure AI, information management, and connected field records for
              governance-sensitive buyers.
            claimRefs:
              - CM003
