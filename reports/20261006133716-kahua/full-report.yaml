      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Continuity
        blocks:
          - type: paragraph
            body: >-
              Kahua was co-founded by Chief Executive Officer Scott Unger and President Brian Moore, serial
              entrepreneurs who previously founded and built Constructware, the industry's pioneer web-based
              collaborative construction project management system, which was acquired by Autodesk in 2006 [CO001,
              CO006]. The executive team brings rare domain longevity and deep industry credibility to enterprise
              construction technology, supported by Chief Technology Officer Colin Whitlatch, Senior Director of Brand
              and Communications Sonya Lehner, and an established operational team overseeing 201 to 500 employees
              [CO002, CO006, CO007, CO008]. In September 2026, Kahua strengthened its institutional governance and
              capital backing by securing a strategic minority growth investment from Bain Capital Tech Opportunities,
              adding Bain Capital Partner Philip Meicler to its investor network and governance circle [CO009, CO010].
              While the extensive operational tenure of Unger and Moore provides formidable strategic cohesion and
              customer trust, their dual founder-market leadership creates a meaningful key-person dependency, making
              long-term succession planning and executive bench depth vital areas of diligence as the company scales
              past $100 million in annualized revenue [CO006, CO010].
            claimRefs:
              - CO001
              - CO002
              - CO006
