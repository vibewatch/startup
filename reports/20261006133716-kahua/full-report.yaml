  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Capital Lifecycle Coverage, and Solution Modular Map
        blocks:
          - type: paragraph
            body: >
              Kahua is architected as an enterprise-grade capital program and construction project management platform
              built to serve the entire asset lifecycle from early capital planning to operational handover [CE001,
              CE003]. While conventional construction management solutions focus primarily on contractor field
              administration and subcontractor communications, Kahua's product center of gravity is established around
              the institutional asset owner—such as federal agencies, transportation authorities, healthcare networks,
              higher education institutions, and commercial program developers [CE001, CE003, CE004]. The platform
              provides a unified system of record spanning six primary solution domains: Capital Planning & Funding
              Allocation, Cost & Risk Controls, Complete Project Delivery, Portfolio & Performance Analytics, Asset
              Lifecycle & Handover, and Configurable Low-Code Workflow Design [CE001, CE003, CE006].


              Across these solution pillars, Kahua organizes operational capabilities into discrete functional
              applications available across web workstations and mobile devices to bridge field and office teams [CE001,
              CE006]. The platform tracks capital planning allocations, source-of-funds apportionments, design reviews,
              bids, contracts, change orders, RFIs, submittals, and field observations [CE001, CE004, CE006]. Through
              its Asset Centric Project Management (ACPM) paradigm, Kahua structures asset tags, equipment warranties,
              and commissioning data during active construction delivery rather than postponing record collection to
              project closeout [CE001, CE002, CE005]. In August 2026, Kahua expanded this functional footprint with
              kCapture, which embeds 360-degree reality capture directly into project documentation records [CE005].
              Commercial packaging spans tailored tiers for Owners, Program Managers, General Contractors, and
              Subcontractors, scaling across more than 2,500 customer organizations and 70,000 active projects [CE001,
              CE006].
