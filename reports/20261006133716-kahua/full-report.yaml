      - number: '5.2'
        title: Operating Model, kBuilder Canvas, and Enterprise AI Architecture
        blocks:
          - type: paragraph
            body: >
              The core technical differentiation of Kahua lies in its underlying Platform-as-a-Service (PaaS)
              architecture, driven by the proprietary kBuilder low-code application development platform [CE006, CE007,
              CE008]. Unlike rigid SaaS tools with hardcoded schemas or custom-coded single-tenant forks that resist
              regular upgrades, Kahua executes applications within an extensible metadata-driven model [CE006, CE007].
              Customers and implementation partners have developed over 600 private and public business applications on
              kBuilder, which are distributed and installed via the kStore application marketplace [CE006].
              Architecturally, Kahua utilizes an innovative 'hub-to-hub' federated database design rather than a
              traditional 'hub-and-spoke' repository [CE006]. Under this architecture, participating organizations
              maintain sovereign ownership of their respective database instances; project documents and workflows link
              across instances during active delivery, ensuring that each participant retains a verifiable historical
              record upon project closeout [CE006].


              In February 2026, Kahua introduced kBuilder Canvas, an AI-assisted no-code solution design environment
              that allows functional analysts and system integrators to visually design, simulate, and adapt custom
              applications using natural language prompts without writing code [CE007]. Solutions authored in Canvas
              inherit Kahua's native governance, role-based access, and data schema rules [CE007]. This was augmented in
              May 2026 by Noa, an embedded AI assistant powered by the Kahua AI intelligence layer [CE005]. Crucially
              for public-sector and enterprise adopters, Kahua became the first FedRAMP-certified construction PMIS to
              receive federal authorization for embedded AI inside its secure government perimeter [CE005]. Furthermore,
              technical leadership has highlighted its collaboration with Microsoft on responsible enterprise AI,
              ensuring that generative and automated capabilities adhere strictly to federal data residency and access
              controls [CE005, CE008].
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
