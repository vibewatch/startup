            title: 'Dual Competitive Moat: Deep PaaS Configurability and FedRAMP Security Perimeter'
            body: >-
              Kahua's architectural positioning as a low-code platform-as-a-service (PaaS) rather than a rigid point
              application provides an exceptional enterprise barrier to entry. Combined with high-assurance FedRAMP and
              StateRAMP authorizations, Kahua serves as a trusted system of record for highly regulated federal,
              transportation, and healthcare programs that competitors cannot easily penetrate without multi-year
              security recertification.
            calloutType: strength
            claimRefs:
