  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Enterprise Construction and Capital Program Landscape
        blocks:
          - type: paragraph
            body: >-
              The capital program and construction management software landscape is segmented between owner-driven
              capital program management systems (PMIS), contractor-centric project delivery platforms, and heavy-civil
              controls solutions. Kahua occupies a specialized position as an enterprise platform tailored primarily for
              asset owners, program managers, public agencies, and commercial general contractors [CP001, CP002]. Rather
              than focusing solely on field execution or subcontractor coordination, Kahua's architecture emphasizes
              multi-year capital program funding, cost controls, governance, and asset lifecycle tracking [CP001,
              CP004]. Direct competition spans established enterprise construction platforms such as Procore and
              Autodesk Construction Cloud, as well as specialized infrastructure control suites like InEight [CP003,
              CP004, CP005]. On buyer comparison benchmarks, Kahua achieves an ITQlick score of 83/100, ranking #1 of 73
              in construction project management, while holding a #10 rank out of 41 providers on RFP.wiki's
              Construction and Engineering leaderboard with a 4.4 composite rating [CP003, CP006].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
