chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Roots, and Core Platform
        blocks:
          - type: paragraph
            body: >-
              Kahua is a software development and enterprise cloud company headquartered in Alpharetta, Georgia, with
              distributed team members supporting capital programs across the United States, Canada, the United Kingdom,
              and Europe [CO001, CO002]. Founded in 2009, the company takes its name from the Hawaiian word kahua, which
              literally translates to 'foundation' or 'platform,' representing a dual ethos of structured industry best
              practices and open flexibility [CO001]. Rather than introducing a rigid point solution or another
              traditional SaaS application with static workflows, Kahua was architected from inception as a configurable
              platform-as-a-service (PaaS) and low-code environment designed to adapt to complex organizational
              governance and evolving capital program requirements [CO001, CO003]. The platform acts as a unified system
              of record spanning the entire capital asset lifecycle, integrating long-range capital planning, funding
              source allocations, cost controls, schedule management, design review, field execution, and structured
              operational handover [CO004]. Across its enterprise network, Kahua manages more than $400 billion in
              capital programs across more than 70,000 active projects, serving over 2,500 customer organizations and
              supported by more than 500 certified industry partners [CO004, CO005].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
