      - number: '8.2'
        title: Financing Context, Entry Multiples, and Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >
              Kahua's recent capitalization marks a major inflection in institutional backing and market recognition.
              The September 2026 minority growth equity round led by Bain Capital Tech Opportunities established Bain
              Capital as Kahua's largest institutional partner, introducing Bain Capital Partner Philip Meicler to
              company governance [CV003, CV006]. Market commentary highlights that this $1.0 billion-plus benchmark
              represents a roughly tenfold valuation expansion from Kahua's reported $100 million valuation in 2019,
              reflecting cumulative platform expansion, public-sector PMIS adoption, and continuous ARR scaling to $100
              million [CV003, CV006, CV007].


              At 10.0x annualized revenue, Kahua trades at the upper decile of private vertical B2B software
              transactions [CV005, CV006]. While public enterprise peers like Procore trade on public exchanges, Kahua's
              owner-centric model and low-code PaaS architecture insulate it from commoditized subcontractor
              point-solution competition [CV001, CV004]. Nonetheless, entering at or above 10.0x revenue leaves minimal
              margin of safety if organic ARR growth decelerates below 25% or if professional services delivery costs
              dilute software operating leverage [CV005, CV008, CV010]. Additionally, Kahua's lifetime equity financing
              before the Bain Capital transaction remains undisclosed, obscuring preferred return hurdles and
              liquidation preferences that could impact common equity recoveries in secondary or downside scenarios
              [CV005, CV007].
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Exit Pathways, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              To frame risk-adjusted returns, we model three distinct underwriting scenarios across a 3- to 5-year
              investment horizon [CV009, CV011, CV012]. In the bull case, Kahua accelerates ARR expansion past $220
              million by deepening enterprise penetration across federal civilian infrastructure, defense programs, and
              private data center owners, successfully upselling embedded AI modules (Noa) and visual reality capture
              (kCapture) [CV002, CV004, CV011]. Under this scenario, sustained 30%+ organic ARR growth and verified
              115%+ NRR support an enterprise exit valuation of $2.2 billion to $2.6 billion at a 10.0x to 12.0x exit
              multiple via an initial public offering (IPO) or strategic sponsor recapitalization [CV011].


              In the base case, Kahua achieves steady 18% to 22% annual ARR growth, reaching approximately $160 million
              in revenue as multi-year enterprise contracts renew, but multiple compression brings the exit multiple
              down to 7.0x to 8.0x, yielding an exit valuation of $1.15 billion to $1.30 billion and a modest
              mid-single-digit IRR [CV009, CV012]. In the bear case, complex implementation rollouts and platform
              performance lag drive enterprise customer churn, slowing ARR growth to under 8% while public sector
              procurement delays stall new pipeline conversion [CV008, CV012]. Downside multiple compression to 4.0x
              yields an enterprise valuation of $450 million to $550 million, risking down-round dilution or liquidation
              preference impairment for junior equityholders [CV006, CV010, CV012]. Critical thesis-break triggers that
              would force an immediate downgrade to avoid include any FedRAMP authorization lapse, verified deceleration
              of net new ARR below 10%, or documented loss of flagship public agency accounts [CV004, CV010, CV012].
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Discipline: Track Pending Margin and Retention Verification'
            body: >-
              While Kahua's $100 million annualized revenue milestone and $1.0 billion Bain Capital valuation confirm
              market leadership in capital program software, underwriting an investment at 10.0x revenue without audited
              retention cohorts, gross margins, or cash flow figures creates unacceptable risk. Allocators should
              maintain a track posture until data room access confirms durable unit economics.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
          - type: callout
            title: Implementation Friction and Platform Latency Trade-offs
            body: >-
              Customer reviews document real implementation friction, including interface freezes and a steep onboarding
              learning curve during large program deployments. For institutional investors, high deployment complexity
              increases customer churn vulnerability and signals potentially heavy professional services overhead that
              could constrain software gross margins.
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
