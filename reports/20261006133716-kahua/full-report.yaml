      - number: '2.4'
        title: Adoption Constraints and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The same enterprise characteristics that can make a system of record durable can slow initial adoption.
              Construction Industry AI describes public-owner procurement cycles in quarters and switching costs in
              years; this is third-party analysis, not a measured Kahua cohort statistic. RFP.wiki's comparison content
              also flags rollout learning curves, configuration complexity, performance complaints, and governance
              overhead. Because that page is a comparison publisher rather than an independent product benchmark, these
              signals are directional and retained at low confidence. Regulatory and mission-critical complexity can
              therefore operate as both a driver and a constraint: it raises the value of governed workflows while
              lengthening procurement, implementation, and change management. For valuation, the evidence supports a
              thesis of enterprise relevance and potential switching friction, but not a quantified penetration rate,
              segment growth rate, or independently measured retention premium.
            claimRefs:
              - CM004
              - CM014
              - CM015
              - CM016
