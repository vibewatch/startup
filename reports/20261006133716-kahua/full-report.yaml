      - number: '7.2'
        title: Regulatory, Statutory Compliance, and Legal Liability Profile
        blocks:
          - type: paragraph
            body: >
              Kahua's enterprise moat is intimately tied to its compliance posture within the federal government, state
              transportation authorities, and defense agencies [CR001, CR005]. Public-sector deployment mandates that
              Kahua operate within an accredited FedRAMP boundary, supported by StateRAMP certification and formal
              agency oversight [CR003, CR005]. In federal civilian projects, such as the U.S. General Services
              Administration (GSA) national capital program, Kahua serves as the mandatory official system of record for
              Fire & Life Safety (FLS) reporting, accident tracking, hot work requests, and safety incident
              notifications [CR005, CR012]. Operating as a system of record for life-safety events creates substantial
              accountability; any cloud downtime, data loss, or corrupted workflow routing directly threatens compliance
              with federal life-safety and environmental regulations [CR005, CR012].


              From a legal liability and contractual perspective, Kahua actively manages exposure through rigorous
              public website terms and negotiated enterprise Master Services Agreements (MSAs) [CR013, CR014]. In its
              public terms, Kahua explicitly disclaims all implied warranties of merchantability, fitness for a
              particular purpose, and uninterrupted or virus-free operation, while imposing strict limitations of
              liability capped at $100 for non-contractual website interactions [CR013, CR014]. In enterprise customer
              agreements, public sector agencies typically negotiate customized terms regarding data sovereignty,
              FedRAMP continuous monitoring obligations, and indemnification [CR005, CR013]. However, as Kahua
              integrates embedded artificial intelligence into its platform via the Noa assistant and kCapture reality
              capture, it faces heightened regulatory scrutiny regarding data leakage, automated decision bias, and
              federal AI governance compliance under emerging executive orders and NIST guidelines [CR003, CR010,
              CR015].
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
