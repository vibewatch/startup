      - number: '3.3'
        title: Pricing Models, TCO Realities, and Adoption Friction
        blocks:
          - type: paragraph
            body: >-
              Total cost of ownership and commercial licensing models represent critical points of friction and
              competitive comparison across enterprise construction management software [CP005, CP009, CP010]. Kahua
              packages its commercial offering into tailored editions for Owners & Program Managers, General
              Contractors, and Specialty Contractors, supplemented by add-on specialty suites [CP002]. Industry pricing
              intelligence indicates that Kahua operates primarily on a per-user subscription model, starting from
              approximately $690 per user annually ($5,000+ per project entry), with enterprise tier deployments for 100
              users reaching $69,000 or more in recurring software fees [CP003, CP009]. When full implementation, data
              migration, and administrator training are factored in, first-year TCO for 10 enterprise seats is estimated
              between $20,000 and $100,000, creating an annual license commitment that can be $10,000 to $30,000 higher
              than standard contractor tools [CP003, CP005, CP009]. However, this extensive upfront investment, combined
              with customized workflows and cross-stakeholder collaboration spanning public agencies and prime
              contractors, creates immense switching costs and platform lock-in once successfully operationalized
              [CP001, CP006, CP011]. Conversely, practitioner feedback documents persistent watch-outs regarding rollout
              complexity, system lag, and a steep learning curve that can slow initial time-to-value [CP006, CP011,
              CP012].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP009
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional Moat in Public and Regulated Capital Programs
            body: >-
              Kahua's FedRAMP authorization, ISO 27001 information security validation, and ISO 19650 Kitemark
              certification establish a formidable regulatory moat against commercial-first competitors. For federal
              civilian and defense agencies, municipal authorities, and healthcare systems, these compliance baselines
              disqualify lighter construction tools and insulate Kahua from aggressive commodity pricing pressure.
            calloutType: strength
            claimRefs:
              - CP001
              - CP007
              - CP008
          - type: callout
            title: Total Cost and Rollout Friction Dampen Mid-Market Expansion
            body: >-
              Kahua's high total cost of ownership ($20,000 to $100,000 Year 1 TCO for 10 users) and recorded
              implementation friction—including user-reported UI lag and extended learning curves—limit its penetration
              among mid-market commercial contractors. In non-mandated private environments, agile point solutions and
              lower-cost competitors like Procore or JobTread capture buyer demand when rapid out-of-the-box adoption is
              prioritized.
            calloutType: risk
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Streams, and Commercial Architecture
        blocks:
          - type: paragraph
            body: >
              Kahua operates as a cloud-based B2B enterprise software-as-a-service (SaaS) platform targeting capital
              program owners, program managers, and general contractors. The primary revenue engine is recurring
              software subscriptions that grant access to its collaborative Project Management Information System (PMIS)
              and low-code workflow engine. Rather than charging transactional percentages of construction value, Kahua
              commercializes its platform through annual and multi-year subscription licenses scaled by organization
              size, user seats, functional module bundles (such as capital planning, cost control, procurement, and
              field management), and capital program portfolio scale.


              In official disclosures, Kahua announced that it reached the benchmark milestone of $100 million in
              annualized revenue as of September 2026. The platform supports more than 2,500 enterprise customers who
              collectively govern more than $400 billion in capital programs across regulated asset sectors, including
              transportation, healthcare, education, defense, and digital infrastructure. However, public contract
              pricing schedules and list price tiers are completely undisclosed on Kahua's public domain; all commercial
              engagements are structured via customized enterprise quotes and negotiated RFP proposals. Third-party
              review aggregations indicate that while small teams appreciate configurable onboarding, enterprise
              rollouts require substantial implementation services, partner systems integration, and administrative
              customization, indicating a high-touch sales motion with significant professional services attach.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
