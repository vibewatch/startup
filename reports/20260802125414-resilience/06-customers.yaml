    - Risk-sharing structure and primary-manufacturer language are unusually strong
    - Later gene-therapy retrenchment weakens continuity of this proof
  - - Labcorp
    - Workflow / channel partner
    - End-to-end customer service offering across preclinical, clinical, and manufacturing steps
    - Joint offering / channel proof
    - Both parties described reduced repeat work, flexibility, and faster path planning
    - Not direct proof of recurring production revenue
  - - Parvus Therapeutics
    - Development-stage biotech sponsor
    - Development and manufacturing support for PVT401 after earlier program work
    - Development-stage
    - Second program expansion shows repeat relationship logic
    - No public batch counts or contract value
  - - CARGO Therapeutics
    - Development-stage cell-therapy sponsor
    - Support for novel allogeneic CAR-T platform
    - Development-stage support
    - Shows relevance to cutting-edge cell-therapy customers
    - Support statement does not quantify manufacturing scope
  - - Takeda plasma-derived therapies unit
    - Large-pharma / specialty therapies relationship
    - Multi-product development and manufacturing collaboration
    - Undisclosed stage
    - Signals modality breadth beyond biologics and cell therapy
    - Public detail is sparse and current scale is unclear
  notes: Named proof is strongest where customer quotes, site transfers, or output milestones are public.
