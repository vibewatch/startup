- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Lilly KwikPen expansion plus existing vial / PFS output
    - Anchor-customer dependence
    - Very positive for utilization, but increases account concentration
    - Quantify current and pro forma Lilly revenue share
  - - Blue Ash device assembly and packaging buildout
    - Ohio-site concentration
    - Deepens share of wallet per customer while increasing single-region dependency
    - Request customer-to-site mapping and contingency plan
  - - AstraZeneca transferred commercial supply
    - Legacy-account continuity risk
    - Provides diversification relative to Lilly but current depth is unclear
    - Request current volumes and contract end dates
  - - Development-stage biotech portfolio (Parvus, CARGO, others)
    - Pipeline conversion risk
    - Can mature into larger accounts, but many programs may never commercialize
    - Request stage-gated backlog and win-rate by modality
  - - Historical gene-therapy customer base
    - Post-reset coverage shrinkage
    - Durham sale suggests some modality-specific customer demand or fit deteriorated
    - Request lost-customer analysis around 2025 restructuring
  notes: The main debate is whether Resilience is concentrating into higher-quality work or into too few relationships.
