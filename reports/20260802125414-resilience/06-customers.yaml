- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Gap
  rows:
  - - Large-pharma commercial anchor
    - Global pharma manufacturing / supply leadership
    - Sterile injectable fill-finish, packaging, device assembly, domestic supply continuity
    - Highest verified strategic value; Lilly is the clearest anchor
    - No disclosed revenue share or contract economics
  - - Transferred commercial supply customer
    - Originating pharma site owner plus Resilience ops team
    - Continuity manufacturing for existing commercial medicines
    - AstraZeneca provides a meaningful second proof point
    - Current production share and duration are undisclosed
  - - Development-stage biotech sponsors
    - Biotech CMC / technical operations teams
    - Clinical manufacturing, process transfer, scale-up, modality-specific development
    - Broadens future revenue pool across cell therapy, autoimmune, and rare disease
    - Public volume and renewal evidence is thin
  - - Workflow / channel partners
    - Joint customer-facing service partners such as Labcorp
    - Integrated preclinical-to-commercial offering and lead generation
    - Can improve funnel quality and reduce workflow fragmentation
    - Not all such partners are direct recurring revenue customers
  - - Academic / translational ecosystem
    - Cancer centers and research institutions
    - Technology development, translational programs, early pipeline access
    - Supports origination and technical credibility
    - These relationships should not be conflated with commercial customer count
  notes: Segments are grouped by economic role in the workflow, not by logo count alone.
