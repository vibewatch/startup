company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 6
  title: Customers
  summary: 'Resilience has real customer proof, but the proof is uneven. The Lilly relationship is the clearest commercial anchor: a partnership begun in 2023, expanded in 2026 with a $750 million joint investment, more than 150 million doses already supplied, and a planned KwikPen line in Ohio. AstraZeneca provides second-tier commercial evidence through the West Chester transfer and multi-year supply agreement. Beyond those anchors, the public roster shifts toward development-stage biotech and ecosystem collaborations—BridgeBio, Parvus, CARGO, Labcorp, and several academic cancer centers—where the evidence shows technical engagement but not disclosed revenue durability. That mix supports a conclusion of genuine market adoption with high strategic concentration, thin retention disclosure, and meaningful uncertainty about how much of Resilience’s narrowed post-2025 network is supported by repeat multiyear spend versus milestone-driven project work.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Resilience’s customer universe is best understood as a layered mix rather than a broad, diversified roster of equal accounts. At the top is large-pharma commercial manufacturing, where Lilly is now the clearest anchor and AstraZeneca is the strongest additional proof point. Under that sits a development-stage biotech layer—BridgeBio historically in gene therapy, Parvus in autoimmune disease, and CARGO in allogeneic CAR-T—where Resilience is positioned as a manufacturing and scale-up partner rather than merely a late-stage packager. A third layer consists of channel or workflow partners such as Labcorp and academic or translational relationships with MD Anderson, CHOP, and the Parker Institute; these relationships matter because they can feed programs into the network, but they should not all be counted as equivalent paying production customers.


    The public evidence therefore supports a segmentation model by buyer maturity and workflow position. Large commercial customers appear to buy reliable Ohio-based fill-finish, packaging, device assembly, and domestic supply capacity. Emerging biotechs appear to buy development-stage manufacturing know-how, process transfer, and platform access. Research-system partners appear to expand origination and technical relevance. This segmentation is useful for diligence because it shows why customer proof can look deceptively broad: logos and alliances span several categories, but only a subset prove repeat commercial revenue at scale.'
