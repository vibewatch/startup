figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How typical Resilience customers move from initial need to expanded manufacturing scope.
  data:
    items:
    - label: 1. Need recognition
      stage: Need recognition
      actor: Biopharma CMC / supply leader
      action: Seeks domestic manufacturing capacity, development help, or backup supply
      pain: Complex modalities, limited internal capacity, supply-chain risk
      outcome: Screens Resilience for modality and site fit
    - label: 2. Technical evaluation
      stage: Technical evaluation
      actor: Technical operations / process development
      action: Matches program needs to biologics, cell therapy, or drug-product workflow
      pain: Vendor fragmentation and transfer risk
      outcome: Selects a facility path or joint-service workflow
    - label: 3. Initial engagement
      stage: Initial engagement
      actor: Sponsor and Resilience team
      action: Begins PAD, transfer, or early manufacturing support
      pain: Uncertain timing, assay readiness, and batch economics
      outcome: Program enters development or transfer work
    - label: 4. Production / launch support
      stage: Production / launch support
      actor: Manufacturing, quality, and supply teams
      action: Runs GMP, fill-finish, packaging, or commercial supply operations
      pain: Scale, quality, and reliability pressure
      outcome: Commercial or clinical product delivered
    - label: 5. Expansion
      stage: Expansion
      actor: Account team / customer leadership
      action: Adds device assembly, packaging, commercial continuity, or additional programs
      pain: Concentration and site-capacity trade-offs
      outcome: Higher share of wallet and longer workflow lock-in
