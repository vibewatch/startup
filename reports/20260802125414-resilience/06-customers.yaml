- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: 'Durability is where the public record gets materially weaker. Resilience does not disclose customer count, top-customer revenue share, GRR, NRR, churn, renewal rates, or average contract length. What it does disclose implies concentration. Lilly is large enough to drive repeated Ohio capital investment, site expansion, headcount growth, and a fresh 2026 co-investment around a specific delivery device. JobsOhio’s 2023 project note said Resilience had secured manufacturing agreements with several new customers, but those customers were not named. The Blue Ash expansion in 2025 also suggests land-and-expand within existing downstream programs, especially around packaging, cold-chain support, and device-adjacent operations.


    That means the best-supported customer thesis is not “many visible recurring accounts,” but “one very strong commercial anchor, one meaningful transferred commercial relationship, and a longer tail of development-stage or ecosystem relationships that may expand but are not yet well disclosed.” The June 2025 six-site closure reinforces the need for caution: if historical demand had fully matched the original network buildout, such a reset likely would not have been necessary. Customer proof is therefore directionally positive but economically underdisclosed.'
