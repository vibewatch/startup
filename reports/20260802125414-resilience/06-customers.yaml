    - Production / expansion
    - 150M+ doses produced; 2026 $750M expansion and direct customer quote
    - Economics, pricing, and exclusivity are undisclosed
  - - AstraZeneca
    - Transferred commercial supply customer
    - West Chester site transfer plus multi-year supply agreement for select medicines
