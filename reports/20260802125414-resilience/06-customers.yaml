- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption signals
  body: 'The strongest named proof is Lilly. Resilience and Lilly say their partnership, first established in 2023, has already produced more than 150 million doses for U.S. patients in vial and pre-filled syringe formats. The July 2026 expansion adds KwikPen production, creates at least 400 new jobs, and deepens the Ohio buildout. AstraZeneca is the next-most concrete account because the original West Chester transaction included a multi-year supply agreement for select AstraZeneca medicines and preserved an operating commercial site inside Resilience’s network.


    After those two, the evidence shifts from volume proof toward workflow proof. BridgeBio publicly described Resilience as the primary future commercial manufacturer for specific gene-therapy programs under a cost- and risk-sharing structure, though later retrenchment in gene therapy means that proof is now partly historical. Labcorp framed the joint offer as an end-to-end customer service package across preclinical, clinical, and commercial stages. Parvus, CARGO, and Takeda show continued relevance to advanced-therapy sponsors, but public materials remain thin on batch counts, annual contract value, or renewal depth. Adoption is real; transparency on magnitude beyond the anchor accounts is not.'
