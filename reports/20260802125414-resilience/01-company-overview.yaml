  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Current share price, post-money valuation, ownership concentration, and preference stack.
    whyItMatters: A current investment judgment cannot assess entry discipline or dilution risk without a valuation anchor.
    diligencePath: Request the latest board deck, cap table, and any debt-equity intercreditor summary.
    relatedQuestionRefs:
    - QO016
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue run rate, gross margin, site utilization, and full company headcount.
    whyItMatters: These are the core metrics needed to determine whether the streamlined footprint is economically healthy.
    diligencePath: Request a 12-month operating KPI pack broken down by Ohio, Toronto, and Philadelphia.
    relatedQuestionRefs:
    - QO017
  - type: conflicting-data
    severity: minor
    topic: facility-size
    missingEvidence: A reconciled Blue Ash footprint definition showing current square footage versus planned expansion.
    whyItMatters: Footprint scale is a shorthand investors may over-read; inconsistent public numbers reduce confidence in capacity comparisons.
    diligencePath: Ask management for an updated site map and square-footage schedule by function.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: mubadala
