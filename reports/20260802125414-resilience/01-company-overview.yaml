runDate: '2026-08-02'
company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 1
  title: Company Overview
  summary: National Resilience, Inc. is a privately held North American biomanufacturing CDMO that launched publicly in November 2020 with unusually large initial capitalization and an explicit mission to harden medicine supply chains. By August 2026 the company had narrowed its footprint to four core sites, relocated its headquarters to Blue Ash, Ohio, deepened its Eli Lilly partnership around KwikPen production, and layered significant debt financing on top of earlier venture and government capital. The core diligence tension is that Resilience now has real sterile-injectable scale and anchor-customer proof, but it also carries visible scars from overexpansion, leadership change, facility closures, and a low-priced Durham asset sale.
sections:
- id: identity-and-footprint
  title: Identity, operating model, and current footprint
  body: 'Resilience describes itself as a North American contract development and manufacturing organization focused on advanced therapies, spanning biologics drug substance, cell-based therapies, and aseptic drug product manufacturing for small- and large-molecule medicines. The original launch framing in November 2020 was broader and more ambitious: management and founding backers positioned the company as a manufacturing-and-technology platform built to protect biopharma supply chains and accelerate complex medicines from concept to commercialization. That framing still matters because it explains why Resilience assembled a network rather than a single plant and why it raised infrastructure-scale capital before disclosing mature operating metrics.


    The current footprint is much tighter than the original expansion map. Current Resilience capability pages highlight four operating nodes: Blue Ash, Ohio as headquarters and packaging/supply operation; Cincinnati/West Chester, Ohio as the commercially licensed drug-product hub; Philadelphia as the cell-therapy center; and Toronto for PAD and GMP biologics manufacturing. The Ohio releases add scale detail around the go-forward network: Blue Ash anchors a packaging and supply operation, West Chester is the core sterile manufacturing site, and the broader Cincinnati region now functions as the company’s main operating hub. That concentration is strategically coherent because it matches where Lilly and local economic-development partners are actively investing, but it also confirms that Resilience has abandoned the earlier national-footprint sprawl in favor of a smaller, execution-oriented network.'
