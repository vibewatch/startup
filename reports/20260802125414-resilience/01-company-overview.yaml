- id: founders-leadership-and-governance
  title: Founders, leadership transition, and governance map
  body: 'The founding group combined operating and venture-building DNA. The 2020 launch release identified Rahul Singhvi as co-founder and chief executive officer, Robert Nelsen as founder and chairman, Patrick Y. Yang as co-founder and vice chairman, and Drew Oetting as a founding backer from 8VC. That mix matters because Resilience was never designed as a conventional single-site CDMO; it was incubated by investors and operators who explicitly wanted to redesign manufacturing infrastructure. The same source pack shows why the early strategy could move quickly: backers were willing to fund a platform thesis rather than demand a narrow, asset-light service model.


    Leadership risk became more visible in late 2024. Resilience announced on December 5, 2024 that William S. Marth would become president and chief executive officer, succeeding the founding-era leadership posture with a seasoned big-pharma and CDMO operator who had run AMRI/Curia and senior Teva businesses. Current team materials position Marth as a commercial and operational turnaround leader rather than a science-first founder. That is probably the right profile for the present company because the immediate challenge is not incubation but disciplined execution across sterile manufacturing, customer delivery, and capital structure. Still, the CEO transition is material because it marks a break from the original architecture and implicitly acknowledges that the platform needed a different operating playbook after the 2021-2024 land grab.'
  claimRefs:
