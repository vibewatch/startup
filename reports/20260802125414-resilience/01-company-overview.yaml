  - type: missing-source
    severity: material
    topic: TO002 governance completeness
    missingEvidence: A current board roster and direct disclosure of any founder or board-role changes after the CEO transition.
    whyItMatters: Leadership continuity and board composition matter because the post-restructuring company now depends on disciplined oversight and creditor confidence.
