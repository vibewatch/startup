  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation anchors—and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The public evidence around Resilience’s value is mostly indirect. There are several real capital and
              strategic signals: the 2022 Series D and previously undisclosed Series C, the 2023 DoD/DFC financing,
              Mubadala’s 2023 equity investment, the 2025 Oak Hill debt package, and the 2026 Lilly expansion. These
              prove that serious capital providers and counterparties have repeatedly funded or partnered with the
              business. However, they do not all answer the same question. Equity rounds and equity-linked investments
              speak to common-equity appetite at the time they were struck. Debt speaks more to lender confidence in
              recoverability and go-forward operating plans. Strategic manufacturing expansions with a customer such as
              Lilly prove industrial relevance, but they are not direct marks on Resilience’s standalone equity.


              That distinction is especially important after the 2025 reset. A company can retain high strategic utility
              while still suffering a large implied equity-value haircut if debt has increased, legacy assets were
              overbuilt, or investors lost confidence in the original narrative. In Resilience’s case, the six-site
              closure and Durham exit mean the valuation question must be asked on the post-reset footprint, not on the
              expansion-era ambition.
            claimRefs:
              - CV001
              - CV002
              - CV003
