  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape overview: giants, specialists, and adjacencies'
        blocks:
          - type: paragraph
            body: >-
              Resilience does not face a single monolithic competitor. Its competitive set splits into at least three
              classes. First are global diversified CDMOs such as Lonza, Samsung Biologics, Catalent, and Patheon/Thermo
              Fisher that compete on network breadth, regulatory infrastructure, and the ability to support clients from
              early development through large-scale commercial supply. Second are focused advanced-therapy or modality
              specialists such as OXB, AGC Biologics, and WuXi in selected workflows, especially cell therapy, viral
              vectors, or high-complexity biologics. Third are adjacent players like CordenPharma or Emergent that may
              not mirror Resilience across every modality but still compete for overlapping budgets in sterile
              injectables, lipid-enabled delivery, or domestic preparedness-oriented manufacturing.


              That fragmentation matters for diligence. Toronto biologics should not be benchmarked against the same
              peer set as West Chester fill-finish or Philadelphia cell therapy. It also means Resilience cannot be
              fairly described as simply "smaller than Lonza"; it is smaller than every global benchmark, but it may
              still be relevant in narrower domestic niches where proximity, device assembly, or anchor-customer proof
              carry disproportionate weight.
