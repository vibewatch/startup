      - number: '8.3'
        title: Scenario range and equity uncertainty
        blocks:
          - type: paragraph
            body: >-
              Because revenue, EBITDA, leverage terms, and working-capital needs are not public, a precise
              comparable-multiple model would be false precision. A scenario framework is more honest. The downside case
              assumes the 2025 reset reveals a business with real assets but weaker-than-expected utilization, heavy
              dependence on Lilly, and constrained equity optionality under secured debt. The base case assumes the
              narrowed platform works: Ohio sterile and device-adjacent operations fill, Lilly remains strong, Toronto
              and Philadelphia stay relevant, and lenders remain constructive. The upside case assumes Resilience
              becomes one of the scarce domestic high-volume sterile manufacturing nodes for biopharma, with proven
              multi-account utilization and a strategic premium for reshoring and supply reliability.


              Even with those scenarios, enterprise value is easier to discuss than equity value. The more debt and
              debt-like obligations sit ahead of common shareholders, the wider the possible equity outcomes become.
              That is why the valuation conclusion here should be phrased in ranges and conditioned on diligence, not as
              a single point estimate.
            claimRefs:
