      - number: '1.5'
        title: Open questions and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence now supports a cleaner top-level picture of what Resilience is and where it is focused,
              but several company-level disclosure gaps remain material. No reviewed public source gives a current
              equity valuation, companywide revenue run rate, gross margin, or full employee count. LinkedIn confirms
              headquarters and location breadcrumbs and shows a substantial public following, yet it does not resolve
              operating metrics in a way that can substitute for management disclosure. Even some footprint data need
              care: the company’s capability pages still describe Blue Ash as a 190,000-square-foot packaging facility
              with planned expansion, while the June 2026 JobsOhio relocation release describes a Blue Ash operation
              spanning more than 450,000 square feet. That may reflect phased expansion or different boundary
              definitions, but it is a diligence follow-up, not a number to quote casually.


              The correct overview judgment is therefore mixed. Resilience has stronger customer proof, Ohio scale, and
              manufacturing relevance than many venture-backed biomanufacturing peers. But it also shows classic
              symptoms of an overbuilt platform that is being recapitalized and re-scoped around its strongest surviving
              assets. Later chapters should therefore treat Ohio sterile manufacturing, Lilly dependence, and
              debt-supported stabilization as the current ground truth, while carrying forward explicit uncertainty
              around revenue, valuation, utilization, and full post-restructuring economics.
            claimRefs:
