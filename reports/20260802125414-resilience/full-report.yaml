      - number: '2.4'
        title: Growth drivers, bottlenecks, and why Resilience fits this moment
        blocks:
          - type: paragraph
            body: >-
              Three growth drivers stand out in the 2026 evidence pack. First, biologics and advanced modalities
              continue to expand faster than the broader CDMO market. Second, GLP-1 and other chronic injectable
              products are creating persistent downstream pressure on sterile fill-finish, device assembly, and
              cold-chain operations. Third, BIOSECURE, tariffs, and broader reshoring priorities are pushing buyers
              toward U.S. and allied manufacturing capacity. Resilience fits all three themes: it has biologics and
              cell-therapy exposure, an Ohio sterile-injectables base, and a Lilly partnership that explicitly
              references domestic supply, high-demand medicines, and device manufacturing.


              The constraints are just as important. Vector and other industry voices say many cell and gene therapy
              CDMOs remained underutilized in 2025 because funding tightened and sponsors narrowed pipelines. Alira says
              capacity access and reliability—not just added square footage—have become the differentiator. Public
              reimbursement pressure around some advanced therapies and uncertainty around policy implementation add
              more risk. That mixed backdrop explains why Resilience could simultaneously close facilities in 2025 and
              still win major investment tied to Lilly in 2026: the market is not broadly easy, but selected niches with
              real sterile-drug-product demand, credible domestic execution, and anchor-customer proof remain
              attractive.
