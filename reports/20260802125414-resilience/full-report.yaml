      - number: '3.3'
        title: How Resilience compares on capability, geography, and buying criteria
        blocks:
          - type: paragraph
            body: >-
              Resilience cannot credibly win a head-to-head scale contest with Lonza, Samsung, Catalent, or Patheon. It
              has fewer sites, less public financial firepower, and greater concentration around Ohio plus two non-Ohio
              nodes. The better way to think about the company is as a focused North American advanced-manufacturing
              platform that now concentrates on three commercially coherent capabilities: Ohio sterile drug product and
              device-adjacent work, Toronto biologics, and Philadelphia cell therapy. That is materially narrower than
              the original network thesis but clearer competitively.


              The strongest current proof point is Lilly. A private CDMO with disclosed 150 million-plus doses already
              produced and a $750 million expansion around KwikPen manufacturing can claim real downstream execution,
              not just theoretical capacity. This is especially relevant in a market where multiple analysts say sterile
              fill-finish, device assembly, and reliability are the real bottlenecks. Buyers who value domestic
              location, rapid Ohio scale-up, and commercial injectable experience may see Resilience as more relevant
              than its size alone implies. But those same buyers also have alternatives with broader geographic spread,
              stronger balance sheets, and similar integrated-partner narratives.
