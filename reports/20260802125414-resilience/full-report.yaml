      - number: '3.4'
        title: Moat durability, substitutes, and competitive risks
        blocks:
          - type: paragraph
            body: >-
              The most defensible moat for Resilience after restructuring is not scale; it is fit. The company now
              aligns with a part of the market where U.S. location, quality execution, and a major anchor customer
              matter. That can be durable if management proves the narrowed network runs at high utilization. But the
              moat is also fragile. Global players can absorb underutilization better, spread fixed costs across more
              products and customers, and fund expansion from larger cash flows. Adjacent firms like CordenPharma can
              contest pieces of the sterile-injectable or lipid-enabled workflow. Emergent can compete for certain
              domestic or government-oriented manufacturing relationships even if it is not a direct like-for-like
              biologics peer.


              Policy adds another layer. BIOSECURE is a real tailwind against China-linked competitors, yet it should
              not be mistaken for a permanent competitive shield. If implementation softens, dual sourcing persists, or
              customers keep using WuXi outside sensitive programs, the structural benefit narrows. The Durham sale to
              OXB is another caution: focused competitors can create value from assets Resilience chose to abandon.
              Investors should therefore treat domestic execution, Lilly proof, and modality focus as the positive
              case—while recognizing that concentration, opacity on pricing, and the power of scaled incumbents remain
              the central competitive risks.
