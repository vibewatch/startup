      - number: '1.3'
        title: Capital base, investors, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              Resilience’s capital history is exceptional for a private CDMO. The launch announcement said the company
              had raised more than $800 million at formation. In June 2022 Resilience disclosed a $625 million Series D
              and, critically, also revealed a previously unannounced $600 million Series C completed in August 2021. In
              March 2023 the company added a $410 million long-term finance agreement supported by the U.S. Department
              of Defense and Development Finance Corporation, and in 2023 it also announced an equity investment from
              Mubadala tied to a UAE manufacturing collaboration. These financings show that the company’s early
              strategy was built on the assumption that geographic breadth and multi-modality manufacturing would create
              long-duration strategic value.


              The later financing mix is more defensive and more revealing. June 2025 restructuring coverage said
              investors provided $250 million of bridge financing as Resilience consolidated six underutilized
              facilities. October 2025 then brought up to $825 million of long-term debt financing from Oak Hill
              Advisors, including a $600 million first-lien commitment and a $525 million initial tranche. The positive
              interpretation is that sophisticated capital providers still see enduring asset value in the core Ohio and
              Toronto footprint. The negative interpretation is leverage: by late 2025 the company was no longer just a
              well-funded venture build, but a company relying on secured credit to stabilize and accelerate a narrower
              go-forward strategy. Either way, Lilly, JobsOhio, and major counterparties now matter almost as much as
              equity investors because their demand, partnership credibility, and ecosystem support all shape the
              company’s survivability.
