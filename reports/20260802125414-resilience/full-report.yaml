      - number: '7.4'
        title: Financial/model risk and monitoring
        blocks:
          - type: paragraph
            body: >-
              Financial and model risk now sits at the intersection of capital intensity and disclosure opacity.
              Resilience is private, has no public operating statements, and has layered government-linked financing,
              venture history, and large secured debt on top of one another. The Oak Hill package may have bought time
              and strategic flexibility, but first-lien debt is unforgiving if utilization lags, working capital
              stretches, or customers delay programs. Because so much of the current commercial story is tied to
              site-specific execution and a few critical partners, any stumble can transmit directly into covenant
              headroom, refinancing options, and valuation.


              The right response is not generic caution; it is monitored diligence. Investors should track inspection
              outcomes, line utilization, customer mix, hiring progress, and debt terms as hard kill criteria. If the
              company can convert the Ohio-centered reset into stable multi-account utilization while avoiding quality
              and customer shocks, the risk profile improves quickly. If not, the same concentration that makes the
              story legible could make the downside abrupt.
            claimRefs:
              - CR004
