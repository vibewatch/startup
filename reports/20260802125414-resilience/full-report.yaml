  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The most important risk question is not whether biomanufacturing is attractive in the abstract; it is
              whether Resilience’s narrowed post-2025 platform can generate durable utilization before leverage,
              customer concentration, and execution complexity overwhelm the reset. The six-site closure in June 2025 is
              the strongest disconfirming fact in the file. It shows that at least part of the earlier network was not
              adequately utilized, which turns all current scale claims into “go-forward” claims rather than proof that
              the original model worked. The October 2025 Durham sale compounds that signal because it effectively
              monetized a gene-therapy asset at a price far below earlier expectations.


              That does not make the company uninvestable, but it changes the burden of proof. The current thesis is now
              concentrated around Ohio sterile injectables and downstream device-adjacent work, with Toronto and
              Philadelphia preserving biologics and cell-therapy relevance. The biggest thesis breakers are
              straightforward: another major demand reset, quality or inspection issues at the Ohio hub, meaningful
              deterioration in the Lilly relationship, or leverage that constrains operations before utilization catches
              up.
