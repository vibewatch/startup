      - number: '2.2'
        title: Market sizing, growth, and concentration
        blocks:
          - type: paragraph
            body: >-
              Accessible public sources support a multi-lens sizing view rather than a clean single TAM. Vision
              Lifesciences puts the global CDMO market around $210 billion in 2025 and roughly $330 billion by 2030,
              while Alira says the biologics CDMO segment alone reached $20.7 billion in 2024 after 11% annual growth.
              Within that, Alira says advanced therapies grew 37% year over year to $3.7 billion and already represent
              18% of biologics CDMO value. These figures are not perfectly comparable, but they consistently show the
              same structure: the total market is very large, biologics is a faster-growing subset, and advanced
              therapies are smaller but growing quickest.


              The market is also concentrating. Alira says the top eight CDMOs captured 51% of biologics CDMO revenue in
              2024, and Vision says outsourcing penetration has risen to about 40% of total pharma manufacturing. That
              combination means scale increasingly matters, because sponsors prefer CDMOs with integrated capabilities,
              regulatory maturity, and dependable commercial execution. For Resilience, this is both opportunity and
              warning: the served markets are growing, but scaled incumbents absorb a large share of the demand and set
              the competitive bar for quality systems, footprint, and capital discipline.
