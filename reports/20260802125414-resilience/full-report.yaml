    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Resilience’s customer universe is best understood as a layered mix rather than a broad, diversified roster
              of equal accounts. At the top is large-pharma commercial manufacturing, where Lilly is now the clearest
              anchor and AstraZeneca is the strongest additional proof point. Under that sits a development-stage
              biotech layer—BridgeBio historically in gene therapy, Parvus in autoimmune disease, and CARGO in
              allogeneic CAR-T—where Resilience is positioned as a manufacturing and scale-up partner rather than merely
              a late-stage packager. A third layer consists of channel or workflow partners such as Labcorp and academic
              or translational relationships with MD Anderson, CHOP, and the Parker Institute; these relationships
              matter because they can feed programs into the network, but they should not all be counted as equivalent
              paying production customers.


              The public evidence therefore supports a segmentation model by buyer maturity and workflow position. Large
              commercial customers appear to buy reliable Ohio-based fill-finish, packaging, device assembly, and
              domestic supply capacity. Emerging biotechs appear to buy development-stage manufacturing know-how,
              process transfer, and platform access. Research-system partners appear to expand origination and technical
              relevance. This segmentation is useful for diligence because it shows why customer proof can look
              deceptively broad: logos and alliances span several categories, but only a subset prove repeat commercial
              revenue at scale.
