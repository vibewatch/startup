      - number: '6.4'
        title: Customer verdict and diligence path
        blocks:
          - type: paragraph
            body: >-
              Overall, Resilience clears the bar for real customer adoption but not for broad customer-quality
              transparency. The company has enough named relationships to prove market relevance, and Lilly in
              particular is a powerful commercial validation signal because it combines output, capital commitment, and
              customer quotation about quality and delivery. However, the public record does not support strong
              conclusions about retention, account-level profitability, or how much of the current network is filled by
              repeat multiyear manufacturing programs rather than milestone-based or precommercial engagements.


              For diligence, the key next step is to separate relationship breadth from economic depth. Management
              should be asked for the top-10 customer revenue mix, contract duration by account type, renewal history,
              backlog by modality, and site-level utilization by customer. Investors should also request a bridge from
              the pre-2025 broader network to the post-restructuring four-site model so they can determine which
              customer segments survived the reset, which migrated, and which effectively disappeared with the
              gene-therapy retrenchment. Until then, the customer story should be treated as credible but concentrated.
