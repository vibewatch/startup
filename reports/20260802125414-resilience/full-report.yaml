  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product modules and site map
        blocks:
          - type: paragraph
            body: >-
              Resilience's current product definition is unusually physical and modular for a startup-style diligence
              case. Instead of one monolithic "platform," the company now presents named solution packages layered on
              top of four retained operating sites. The broad service pillars are biologics drug substance, sterile drug
              product, and cell therapy. But the more revealing framing is in the named offers: Sprout Solutions for
              next-step drug substance or fill/finish support, Auto-T for T-cell clinical readiness, DAR-T for
              accelerated autologous CAR-T manufacturing, Idea to Clinic for biologics time savings, and Build Your
              Resilience for secondary-supplier readiness. That productization matters because it translates technical
              capabilities into buyer-facing workflows.


              The facilities map aligns closely with that modularization. Blue Ash is packaging-oriented with planned
              visual inspection, device assembly, and cold storage. Cincinnati is the commercially licensed fill/finish
              and drug-product engine. Philadelphia is the autologous/allogeneic cell-therapy center. Toronto serves
              monoclonal antibodies, recombinant proteins, and other complex molecules. In other words, the product line
              is not just service categories; it is a site-anchored operating architecture meant to route different
              classes of programs through different physical capabilities.
