      - number: '1.4'
        title: Milestones, restructuring, and the current state of the network
        blocks:
          - type: paragraph
            body: >-
              The milestone record splits cleanly into buildout and reset. From 2020 through 2023, Resilience launched,
              financed the platform repeatedly, expanded in West Chester, added AstraZeneca’s Ohio site, signed
              manufacturing and research partnerships, and positioned itself as a domestic-capacity answer for advanced
              medicines. The July 2026 Lilly expansion shows that part of the strategy did create real traction.
              Resilience says its multi-year partnership with Lilly has already produced more than 150 million doses for
              U.S. patients and that the next phase adds KwikPen production, at least 400 new jobs, and full operations
              in early 2027. Those are not theoretical milestones; they are late-stage, capacity-anchored proof points.


              The reset is equally real. In June 2025 Resilience said it would shutter six underutilized sites because
              capacity expansion had outpaced demand, leaving the company to concentrate operations around Cincinnati
              and Toronto. Fierce Pharma reported that the closures reflected a misread of the broader biotech and CDMO
              trajectory, while BioPharma Dive documented layoffs and asset monetization around the same period. The
              October 2025 Durham sale to OXB sharpened the signal further: a former Resilience/bluebird asset that once
              fit the gene-therapy expansion thesis was sold for only $4.5 million. Taken together, the milestones show
              that Resilience is no longer best understood as a network-scale builder. It is now a concentrated CDMO
              attempting to convert the strongest remaining assets—especially sterile injectables in Ohio—into a durable
              operating company.
