              Durability is where the public record gets materially weaker. Resilience does not disclose customer count,
              top-customer revenue share, GRR, NRR, churn, renewal rates, or average contract length. What it does
              disclose implies concentration. Lilly is large enough to drive repeated Ohio capital investment, site
              expansion, headcount growth, and a fresh 2026 co-investment around a specific delivery device. JobsOhio’s
