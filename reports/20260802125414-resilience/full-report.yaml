companyProfile:
  summary: >-
    Resilience is a private North American biomanufacturing CDMO that emerged in 2020 with unusually large capital
    ambitions and then reset sharply in 2025. The current business is best understood as a narrower, Ohio-centered
    manufacturing platform backed by Toronto biologics capability and Philadelphia cell-therapy capability rather than
    as the sprawling network originally envisioned. Public proof is strongest around sterile drug product, packaging,
    and device-adjacent work in Ohio, especially through the expanded Lilly relationship, while the company still
    markets biologics and cell-therapy workflows for sponsors that need development, transfer, and commercial support.
