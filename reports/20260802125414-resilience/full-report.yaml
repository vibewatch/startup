    type: dag
    layout: wide
    summary: How operational and policy risks propagate into customer outcomes, financing, and valuation.
    data:
      nodes:
        - id: a
          label: Utilization / ramp shortfall
          detail: Post-reset capacity or ramp milestones miss expectations
        - id: b
          label: Quality or inspection issue
          detail: Deviation, audit problem, or warning action reduces trust
        - id: c
