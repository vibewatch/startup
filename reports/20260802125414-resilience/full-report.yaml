      - number: '4.4'
        title: Financial verdict and disclosure blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Resilience looks stronger at the asset and customer-proof level than at the
              company-disclosure level. The Ohio platform has real throughput and a credible anchor customer. The
              narrowed network probably needs less capital than the original sprawl. And the Lilly investment suggests
              important assets remain strategic enough to attract more spending. But the adverse side is equally
              visible: the company had to close sites because capacity outpaced demand, sold Durham for only $4.5
              million, relied on bridge capital during restructuring, and layered secured debt onto the remaining
              platform.


              That leaves a simple verdict. Revenue quality may be improving because the surviving network is more
              commercial and more concentrated around real demand, but the margin path and capital adequacy are still
              obscured by missing disclosure. Investors cannot underwrite true earnings power without backlog,
              utilization, top-customer concentration, debt covenants, and site-level economics. The anti-thesis is not
              abstract: if Ohio demand does not absorb fixed costs rapidly enough, the credit layer magnifies downside
              even after the reset. That is why the next diligence step is financial transparency, not more theoretical
              market sizing.
