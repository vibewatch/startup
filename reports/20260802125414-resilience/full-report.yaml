  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, mix, and recognition logic
        blocks:
          - type: paragraph
            body: >-
              Resilience is best understood financially as a manufacturing-services company with several tiers of
              revenue, not as a single-product biotech. Public materials show four monetization buckets: biologics
              drug-substance work, sterile drug-product and device-adjacent manufacturing, cell-therapy development/GMP
              supply, and project-based partnership work. The Lilly relationship is the clearest commercial anchor
              because it references very large downstream volume, Ohio employment, and device-oriented expansion. By
              contrast, BridgeBio, CARGO, and Parvus imply smaller, development-stage or program-specific revenue
              streams that may be higher margin per batch but less predictable in timing and scale.


              The public record does not disclose revenue, backlog, price per batch, or gross margin, so the mix can
              only be inferred. Still, the economic logic is visible: Ohio likely drives the most mature commercial
              manufacturing revenue, while Toronto and Philadelphia support lower-volume but strategically valuable
              biologics and cell-therapy programs. Lilly's 10-K also provides a useful accounting analogue because it
              describes supply arrangements where revenue is recognized over time as product is manufactured. That does
              not prove Resilience uses the same treatment, but it highlights why long-duration manufacturing
              relationships can behave differently from milestone-only biotech collaborations.
