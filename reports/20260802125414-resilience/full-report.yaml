      - number: '4.2'
        title: Capital stack, leverage, and adequacy
        blocks:
          - type: paragraph
            body: >-
              The company's financing history now looks like infrastructure finance more than ordinary venture funding.
              Resilience launched with more than $800 million, later disclosed a prior $600 million Series C alongside a
              $625 million Series D, added a $410 million DoD/DFC financing layer, took an undisclosed Mubadala equity
              investment, reportedly needed a $250 million bridge during restructuring, and then announced up to $825
              million of secured long-term financing from Oak Hill Advisors. That is an unusually complex stack for a
              private CDMO and demonstrates how capital intensive the original buildout was.


              The later layers matter most for current underwriting. The bridge financing suggests capital dependence
              during the 2025 reset. The OHA package—with a first-lien tranche and a large initial draw—signals that the
              company is now relying on secured credit to stabilize and accelerate a smaller network. The right
              interpretation is mixed: lenders and partners still see durable asset value in Ohio and Toronto, but
              leverage raises the penalty for poor utilization. The public record gives no cash balance, runway, or
              covenant detail, so capital adequacy cannot be cleanly underwritten from public evidence alone.
