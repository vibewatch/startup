  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the slice Resilience actually serves
        blocks:
          - type: paragraph
            body: >-
              Resilience does not participate in the entire outsourced pharmaceutical manufacturing universe. Its own
              offering pages constrain the relevant market to advanced biologics drug substance, sterile drug-product
              manufacturing, device assembly and packaging, plus cell-therapy development and GMP operations. That
              matters because generic references to a giant "CDMO market" can be misleading for underwriting: a company
              built around biologics, aseptic fill-finish, and cell therapy should not be valued against every
              small-molecule API contractor or broad formulation shop.


              The serviceable scope is better understood as the intersection of three narrower pools. First is
              outsourced biologics manufacturing for monoclonal antibodies and recombinant proteins, where Toronto
              provides process and GMP relevance. Second is sterile injectable and combination-device manufacturing,
              where West Chester and Blue Ash align with prefilled syringes, cartridges, device assembly, and now
              Lilly's KwikPen expansion. Third is cell-therapy manufacturing, where Philadelphia gives Resilience a
              place in autologous and allogeneic workflows. Taken together, those services position the company inside
              attractive but operationally demanding segments of the market rather than the whole CDMO category.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM035
