      - number: '2.3'
        title: Buyer segmentation, adoption triggers, and value drivers
        blocks:
          - type: paragraph
            body: >-
              The main buyers for Resilience-relevant services are not retail drug brands or hospital customers; they
              are CMC leaders, technical operations teams, manufacturing executives, and regulatory groups inside
              biotech and pharma companies. Emerging biotech sponsors buy because they cannot fund internal GMP
              infrastructure or do not want to wait three to five years and hundreds of millions of dollars to build it.
              Larger pharma buyers use CDMOs when internal networks are full, when a modality sits outside their
              existing know-how, or when policy and supply resilience require another manufacturing geography. The
              purchase decision therefore centers on time to clinic, technical complexity, quality confidence, and
              location.


              Recent industry sources also show that buyers increasingly want more than capacity. They want CDMOs that
              can support process development, analytical work, regulatory execution, and ultimately commercial
              continuity so they do not have to re-transfer a program between vendors. That "start here, stay here"
              logic matters for Resilience because its offering bundle is broader than a single fill-finish line. It can
              sell biologics, drug-product, and cell-therapy capabilities as an integrated relationship, which is
              strategically stronger than competing as a spot-capacity provider alone.
