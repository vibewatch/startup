              These themes line up with the compliance stack. Resilience publishes an OIG-aligned compliance program
              with a compliance officer, executive committee, code of conduct, customer-obligation controls,
              California-law declarations, and supplier human-rights expectations. FDA cGMP regulations remain the
              governing external frame. Together, this suggests that the company's trust argument is based on a
