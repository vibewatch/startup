      - number: '7.3'
        title: Operational, customer, and people risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Resilience now depends heavily on the success of a smaller set of sites and relationships.
              Ohio has become the center of gravity for sterile drug product, packaging, device assembly, and much of
              the company’s growth messaging. That concentration is powerful when things go well, but it also means a
              disruption in West Chester or Blue Ash could ripple through the most important customer relationships
              quickly. Customer risk is tightly linked. Lilly is both the clearest validation signal and the clearest
              concentration risk. AstraZeneca provides additional diversification, but the public record still suggests
              the current commercial story is dominated by a small number of high-value relationships and a longer tail
              of earlier-stage programs.


              People and execution risk are also nontrivial. William Marth’s appointment and the post-reset messaging
              point to a more disciplined operating stance, but a narrowed network still needs manufacturing leaders,
              quality leaders, validation staff, and enough technicians to fill expanded lines. JobsOhio’s repeated
              emphasis on workforce development suggests the talent problem is real, not incidental. The core question
              is whether Resilience can scale the right people faster than it accumulates complexity in a much more
              focused footprint.
