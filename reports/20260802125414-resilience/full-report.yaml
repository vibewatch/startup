  headquarters: Blue Ash, Ohio, USA
  productSummary: >-
    Resilience sells biologics drug-substance development/manufacturing, sterile drug-product fill-finish, packaging,
    device assembly, commercial continuity support, and cell-therapy development/manufacturing workflows across its
    retained sites in Ohio, Toronto, and Philadelphia.
  customerFocus: >-
    Primary customers are large biopharma manufacturers and development-stage biotech sponsors that need domestic
    sterile manufacturing, biologics scale-up, cell-therapy process support, and end-to-end workflow integration.
  businessModel: >-
