      - number: '6.4'
        title: 客户结论与尽调路径
        blocks:
          - type: paragraph
            body: >-
              总体看，Resilience 达到了真实客户采用的门槛，但没有达到宽口径客户质量透明度的门槛。公司拥有足够多具名关系来证明市场相关性，尤其 Lilly
              是一个强商业化验证信号，因为它同时包含产出、资本承诺，以及客户关于质量和交付的引述。不过，公开记录不足以支撑关于留存、账户级盈利能力，或当前网络有多少由重复多年制造项目填充、而不是里程碑式或商业化前合作填充的强结论。


              对尽调而言，关键下一步是把关系广度和经济深度拆开。应要求管理层提供前十大客户收入组合、按账户类型划分的合同期限、续约历史、按模态划分的在手订单，以及按客户划分的站点级利用率。投资人还应要求公司搭一座桥，把
              2025 年前的宽版图网络连接到重组后的四站点模型，以判断哪些客户细分熬过了重置，哪些迁移了，哪些随着基因治疗收缩实际消失。在此之前，客户故事应被视为可信但集中。
