  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点——以及它们不能证明什么
        blocks:
          - type: paragraph
            body: >-
              围绕 Resilience 价值的公开证据大多是间接的。真实的资本和战略信号确实存在：2022 年 Series D 和此前未披露的 Series C、2023 年 DoD/DFC 融资、Mubadala
              2023 年股权投资、2025 年 Oak Hill 债务包，以及 2026 年 Lilly
              扩张。这些信号证明，严肃的资本方和交易对手反复给这家公司投钱或合作。但它们回答的不是同一个问题。股权轮和股权相关投资，说明的是当时普通股风险偏好；债务更说明贷款人对可回收性和未来经营计划有信心。与 Lilly
              这样的客户一起做战略制造扩张，证明工业相关性，但并不直接给 Resilience 独立股权定价。


              2025 年重置之后，这个区分尤其重要。一家公司可以保留很高的战略效用，同时如果债务增加、历史资产建得过重，或投资人不再相信最初叙事，隐含股权价值仍可能大幅打折。放到 Resilience
              身上，六个基地关闭、退出 Durham，都意味着估值问题必须基于重置后的版图来问，而不是基于扩张期的雄心来问。
            claimRefs:
