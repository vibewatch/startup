      - number: '1.4'
        title: 里程碑、重组与网络现状
        blocks:
          - type: paragraph
            body: >-
              里程碑记录可以清楚分成建设和重置两段。2020 年到 2023 年，Resilience 启动，多轮融资，扩张 West Chester，接手 AstraZeneca 的 Ohio
              站点，签下制造和研究合作，并把自己定位为先进药物的本土产能答案。2026 年 7 月 Lilly 扩建说明，战略中的一部分确实跑出了真实牵引力。Resilience 称，它与 Lilly
              的多年合作已为美国患者生产超过 150 million 剂量；下一阶段会增加 KwikPen 生产、至少 400 个新岗位，并在 2027 年初全面运营。这些不是理论里程碑，而是晚期、以产能为锚的验证点。


              重置同样真实。2025 年 6 月，Resilience 称将关闭六个利用率不足的站点，因为产能扩张跑在需求前面，公司将围绕 Cincinnati 和 Toronto 集中运营。Fierce Pharma
              报道称，这些关闭反映了对更广泛生物技术和 CDMO 轨迹的误判；BioPharma Dive 则记录了同一时期的裁员和资产变现。2025 年 10 月 Durham 出售给 OXB
              让信号更尖锐：一个曾经符合基因治疗扩张论、原属 Resilience/bluebird 的资产，仅以 $4.5 million 出售。合在一起看，这些里程碑说明 Resilience
              已不再适合被理解为网络规模建设者。它现在是一家集中的 CDMO，试图把剩余最强资产——尤其是 Ohio 无菌注射剂——转化为一家耐久运营公司。
