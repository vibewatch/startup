      - number: '5.2'
        title: 工作流与运营架构
        blocks:
          - type: paragraph
            body: >-
              Resilience 销售的不只是单元操作。公司一直把自身角色描述为能够从工艺和分析开发一路承接到 GMP 制造、技术转移和商业化支持的伙伴。Labcorp 合作把这一点说得很明确：它把临床前和临床开发服务与
              Resilience 制造结合起来，让客户减少重复工作，并更早规划开发连续体。MD Anderson、Parker Institute 和 CHOP
              关系进一步说明，公司试图更早嵌入创新周期，而不只是接收后期批次。


              这种运营模式很重要，因为复杂疗法常常在发现、工艺开发、分析和制造被拆给太多交易对手时失败。Resilience 自己的早期细胞治疗指南认为，内部建设 GMP
              站点慢、贵且风险高，阶段匹配的工艺和分析开发应尽早与制造伙伴协调。应聚焦的架构正是这一点：PAD、分析、开发阶段制造、放大和下游商业化支持的组合，并把它组织成长期关系，而不是一次性批次交易。
