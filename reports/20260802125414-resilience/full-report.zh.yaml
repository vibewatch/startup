      - number: '3.3'
        title: Resilience 在能力、地理和购买标准上的对比
        blocks:
          - type: paragraph
            body: >-
              Resilience 无法可信地与 Lonza、Samsung、Catalent 或 Patheon 正面比拼规模。它站点更少，公开财务火力更弱，也更集中在 Ohio 加两个非 Ohio
              节点。更好的理解方式是，把公司看作一个聚焦的北美先进制造平台，如今集中在三项商业上连贯的能力：Ohio 无菌制剂和器械相邻业务、Toronto 生物药，以及 Philadelphia
              细胞治疗。这比原始网络论窄得多，但竞争定位更清楚。


              当前最强验证点是 Lilly。一家私营 CDMO 已披露生产超过 150 million 剂量，并围绕 KwikPen 制造进行 $750 million
              扩建，可以主张自己有真实下游执行，而不只是理论产能。在多位分析师认为无菌灌装、器械组装和可靠性才是真瓶颈的市场里，这一点尤其相关。重视本土地点、Ohio 快速放量和商业化注射剂经验的买方，可能会认为
              Resilience 的相关性高于其体量所暗示的水平。但这些买方也有其他选择，那些选择拥有更广地理覆盖、更强资产负债表和相似的一体化伙伴叙事。
