  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局概览：巨头、专科玩家与邻近玩家
        blocks:
          - type: paragraph
            body: >-
              Resilience 面对的不是一个单一、巨大的竞争者。它的竞争集合至少分成三类。第一类是全球多元化 CDMO，如 Lonza、Samsung Biologics、Catalent 和
              Patheon/Thermo Fisher，它们靠网络广度、监管基础设施，以及从早期开发支持到大规模商业化供应的能力竞争。第二类是聚焦先进疗法或特定模态的专科玩家，如 OXB、AGC Biologics
              和部分工作流中的 WuXi，尤其是细胞治疗、病毒载体或高复杂度生物药。第三类是 CordenPharma 或 Emergent 这类邻近玩家，它们未必在每一种模态上复制
              Resilience，但仍会争夺无菌注射剂、脂质递送或本土应急导向制造中的重叠预算。


              这种碎片化对尽调很重要。Toronto 生物药不应与 West Chester 灌装或 Philadelphia 细胞治疗使用同一套同业基准。它也意味着，不能公平地把 Resilience 简化成“比 Lonza
              小”；它确实小于所有全球基准，但在更窄的本土细分中，距离、器械组装或锚定客户验证可能有超比例权重，公司仍可能有相关性。
