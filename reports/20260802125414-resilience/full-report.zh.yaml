  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Resilience 的客户宇宙更适合理解为分层组合，而不是一张宽泛、多元、账户权重相同的名单。最上层是大型药企商业化制造，Lilly 现在是最清楚的锚，AstraZeneca
              是最强的额外验证点。下面是一层开发阶段生物技术公司——历史上基因治疗里的 BridgeBio、自免疾病里的 Parvus、异体 CAR-T 里的 CARGO——Resilience
              在这里被定位为制造和放大伙伴，而不只是后期包装商。第三层是 Labcorp 这样的渠道或工作流伙伴，以及与 MD Anderson、CHOP、Parker Institute
              的学术或转化关系；这些关系重要，因为它们可以把项目导入网络，但不应全部等同为付费生产客户。


              因此，公开证据支持按买方成熟度和工作流位置建模。大型商业客户购买的似乎是可靠的 Ohio 灌装、包装、器械组装和本土供应产能。新兴生物技术公司购买的似乎是开发阶段制造
              know-how、工艺转移和平台准入。研究体系伙伴则扩展项目来源和技术相关性。这种分层对尽调有用，因为它说明客户验证为什么会显得宽得有些误导：logo
              和联盟横跨多个类别，但只有其中一部分证明了规模化重复商业收入。
