  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Resilience 实际服务的切片
        blocks:
          - type: paragraph
            body: >-
              Resilience 并不参与整个外包制药制造宇宙。公司自己的产品页面把相关市场限制在先进生物药原液、无菌制剂制造、器械组装和包装，以及细胞治疗开发与 GMP
              运营。这个边界很重要，因为笼统引用一个巨大的“CDMO 市场”会误导承销判断：一家围绕生物药、无菌灌装和细胞治疗搭建的公司，不应按所有小分子 API 承包商或宽口径制剂厂来估值。


              可服务范围更适合理解为三个较窄市场池的交集。第一是单克隆抗体和重组蛋白的外包生物药制造，Toronto 在这里提供工艺和 GMP 相关性。第二是无菌注射剂和组合器械制造，West Chester 和 Blue
              Ash 对应预灌封注射器、药筒、器械组装，以及现在 Lilly 的 KwikPen 扩建。第三是细胞治疗制造，Philadelphia 让 Resilience
              进入自体和异体工作流。合在一起，这些服务把公司放进市场中有吸引力但运营要求很高的细分，而不是整个 CDMO 类别。
