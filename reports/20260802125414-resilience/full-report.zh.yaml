chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模式与当前版图
        blocks:
          - type: paragraph
            body: >-
              Resilience 自称是一家北美合同开发与制造组织，聚焦先进疗法，覆盖生物药原液、细胞疗法，以及小分子和大分子药物的无菌制剂制造。2020 年 11
              月启动时的叙事更宽、更激进：管理层和创始支持者把公司定位为制造与技术平台，目标是保护生物制药供应链，并推动复杂药物从概念走向商业化。这个叙事仍然重要，因为它解释了 Resilience
              为什么组建网络而不是单一工厂，也解释了公司为什么在披露成熟运营指标之前就融到基础设施级资本。


              当前版图比最初的扩张地图收紧得多。Resilience 现有能力页面突出四个运营节点：Blue Ash, Ohio 是总部和包装 / 供应运营；Cincinnati/West Chester, Ohio
              是获商业许可的制剂枢纽；Philadelphia 是细胞治疗中心；Toronto 负责 PAD 和 GMP 生物药制造。Ohio 相关公告还补充了前进网络的规模细节：Blue Ash 承载包装和供应运营，West
              Chester 是核心无菌制造站点，更广义的 Cincinnati 地区现在是公司的主要运营枢纽。这种集中在战略上说得通，因为它对应 Lilly 和本地经济发展伙伴正在投入的地方；但它也确认，Resilience
              已放弃早期全国版图式扩张，转向更小、更重执行的网络。
