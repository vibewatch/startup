      - number: '7.3'
        title: 运营、客户与人员风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Resilience 现在更依赖少数几个基地和客户关系能否跑通。Ohio 已经成为无菌药品、包装、器械组装，以及公司大部分增长叙事的重心。顺风时，集中投入能放大效率；但 West Chester 或
              Blue Ash 一旦中断，也会很快波及最重要的客户关系。客户风险也绑得很紧。Lilly 既是最清晰的验证信号，也是最明显的集中度风险。AstraZeneca
              带来额外分散，但公开记录仍显示，当前商业故事主要由少数高价值关系主导，后面跟着一串更早期项目。


              人才和执行风险同样不小。William Marth 上任，加上重置后的表述，说明公司运营姿态更讲纪律；但网络收窄之后，仍需要制造负责人、质量负责人、验证人员，以及足够技师把扩产产线填起来。JobsOhio
              多次强调 workforce development，说明人才问题是真问题，不是边角问题。核心问题在于，Resilience 能否在更集中的版图里，比复杂度累积更快地扩充合适的人。
