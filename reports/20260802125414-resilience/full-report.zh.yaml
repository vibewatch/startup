      - number: '2.3'
        title: 买方分层、采用触发点与价值驱动因素
        blocks:
          - type: paragraph
            body: >-
              Resilience 相关服务的主要买方不是零售药品品牌或医院客户，而是生物技术和制药公司内部的 CMC 负责人、技术运营团队、制造高管和监管团队。新兴生物技术赞助方采购，是因为他们无法自建 GMP
              基础设施，或不想等三到五年、花数亿美元去搭建。大型药企在内部网络满载、某种模态超出既有 know-how，或政策和供应韧性要求另一处制造地理位置时，会使用
              CDMO。因此，购买决策围绕到临床时间、技术复杂度、质量信心和地点展开。


              近期行业来源也显示，买方想要的不只是产能。他们希望 CDMO 能支持工艺开发、分析工作、监管执行，并最终提供商业化连续性，这样项目就不必在供应商之间反复转移。这种“从这里开始、留在这里”的逻辑对
              Resilience 很重要，因为它的产品组合比单条灌装线更宽。公司可以把生物药、制剂和细胞治疗能力作为一段整合关系来销售，战略上强于单纯作为现货产能提供方竞争。
