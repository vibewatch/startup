      - number: '6.3'
        title: 耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录明显变弱的地方。Resilience 不披露客户数、头部客户收入占比、GRR、NRR、流失、续约率或平均合同期限。它披露的内容暗示了集中度。Lilly 足够大，能够推动 Ohio
              反复资本投入、站点扩张、员工增长，以及 2026 年围绕特定给药器械的新共同投资。JobsOhio 2023 年项目说明称 Resilience 已与数个新客户签订制造协议，但没有点名这些客户。2025 年
              Blue Ash 扩张也暗示现有下游项目中存在 land-and-expand，尤其围绕包装、冷链支持和器械相邻运营。


              这意味着，最有证据支撑的客户论不是“许多可见的经常性账户”，而是“一个非常强的商业化锚、一个有意义的转移商业关系，以及一条更长的开发阶段或生态关系尾部；这些尾部可能扩张，但尚未充分披露”。2025 年 6
              月关闭六个站点进一步要求谨慎：如果历史需求完全匹配最初网络建设，这种重置大概率不会必要。因此，客户验证方向正面，但经济性披露不足。
