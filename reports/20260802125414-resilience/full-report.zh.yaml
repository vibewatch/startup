      - number: '4.3'
        title: 运营代理指标与外部单位经济基准
        blocks:
          - type: paragraph
            body: >-
              Resilience 披露的运营数据刚好足以证明核心资产真实存在，但不足以说明这些资产有多赚钱。Ohio 材料描述，两处区域设施合计近 1 million 平方英尺，区域员工约 1,000
              人。制剂页面称业务每年可支持超过 100 million 支西林瓶和预灌封注射器，并已完成超过 250 个灌装批次。细胞治疗页面又称自 2023 年以来已放行 150-plus GMP
              批次。这些数字重要，因为它们确认了有意义的吞吐量和商业化就绪度。但它们没有揭示利用率、实际价格、营运资本拖累或质量成本负担。


              要锚定经济性，公开同行比 Resilience 自身更有帮助。Catalent 的公开申报显示，在一个规模化运营季度，调整后 EBITDA 利润率为 12.2%，生物药部门 EBITDA 利润率为
              10.5%；Samsung 的收入和营业利润则展示了真正大型生物药制造经济性可能长什么样。Resilience
              几乎肯定远低于那个规模，也很可能对生产线利用率敏感得多。在高固定成本业务里，可靠性有帮助，但闲置套间和负荷不足的产线会很快毁掉回报。
