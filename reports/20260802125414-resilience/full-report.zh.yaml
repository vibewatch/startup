      - number: '8.4'
        title: 估值判断与尽调路径
        blocks:
          - type: paragraph
            body: >-
              目前最合理的判断是，Resilience 很可能仍保有相当大的企业价值，因为稀缺的无菌制造资产、公共部门支持和 Lilly
              关系都是真实存在的。但估值不能假设最初的网络论证已经跑通。在公司证明重置后版图能持续被利用、质量和检查表现强劲、债务不需要英雄假设也能管理之前，它相对健康的公开同业应有明显折价。投资人不应把累计融资额当作当前价值的替代指标；变化已经太多。


              实际含义很简单：一笔交易在有意义的估值上仍可能成立，但尽调负担非常高。公开记录足以证明这里有一项严肃资产；但不足以证明，在债务、客户集中度和重组影响都纳入之后，这项资产价值到底有多少属于股权持有人。
