      - number: '8.3'
        title: 情景区间与股权不确定性
        blocks:
          - type: paragraph
            body: >-
              收入、EBITDA、杠杆条款和营运资本需求都不公开，精确的可比倍数模型只会制造伪精确。情景框架更诚实。下行情景假设 2025 年重置暴露出这样一家公司：资产真实，但利用率弱于预期，对 Lilly
              依赖很重，担保债务之下股权选择权受限。基准情景假设收窄后的平台跑通：Ohio 无菌和器械相邻业务填满，Lilly 关系保持强势，Toronto 和 Philadelphia
              仍有相关性，贷款人继续建设性支持。上行情景假设 Resilience 成为美国本土少数高通量无菌制造节点之一，已经验证多客户利用率，并因生产回流本土和供应可靠性获得战略溢价。


              即便有这些情景，企业价值也比股权价值更容易讨论。排在普通股股东之前的债务和类债务义务越多，股权结果的可能区间就越宽。因此，这里的估值结论应该写成区间，并以尽调为条件，而不是给出单点估计。
