      - number: '8.2'
        title: 公开可比公司与市场语境
        blocks:
          - type: paragraph
            body: >-
              公开可比分析有参考价值，但天然很杂。2025–2026 年的 biologics CDMO 公开市场，已经不再只按扩张公告给公司定价；Alira 的市场更新强调选择性重估、forward EV/EBITDA
              离散度扩大，以及规模、可靠性和可见制造交付的溢价。这个框架对 Resilience
              很关键，因为它现在更像资产与执行故事，而不是叙事增长故事。最有用的公开锚点不是很小的临床前服务公司，而是更偏制造的较大企业，它们的估值反映被市场信任的交付能力。


              即便如此，规模差距仍然巨大。Thermo Fisher 和 Lilly 体量太大、业务太分散，不能直接当作可比公司，但它们展示了全球制造可信度在公开市场中的价值。Lonza 和 Samsung Biologics
              方向上更相关，因为它们以制造为中心，市值仍大约在 $48 billion。Catalent 私有化前最后已知的公开市值，为大型 drug-product 平台提供了更现实的天花板；Emergent
              则说明，一旦信任或经济性断裂，制造价值会塌得多快。WuXi Biologics 表明，即使面临政策摩擦，规模化 CDMO 资产仍能保留实质价值。
