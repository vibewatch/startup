      - number: '7.4'
        title: 财务 / 模型风险与监控
        blocks:
          - type: paragraph
            body: >-
              财务和模型风险现在卡在资本开支强度与披露不透明的交汇处。Resilience 是私营公司，没有公开经营报表，又把政府相关融资、风险投资历史和大额担保债务叠在一起。Oak Hill
              的融资包或许为公司买到时间和战略灵活性，但如果利用率落后、营运资本拉长，或客户推迟项目，第一留置权债务不会宽容。当前商业故事很大一部分都绑在特定基地执行和少数关键伙伴上，任何失误都可能直接传导到契约余量、再融资选择和估值。


              正确应对不是泛泛谨慎，而是持续跟踪的尽调。投资人应把检查结果、产线利用率、客户组合、招聘进展和债务条款作为硬性否决条件来盯。如果公司能把以 Ohio
              为中心的重置转化为稳定的多客户利用率，同时避开质量和客户冲击，风险画像会迅速改善。否则，让故事变清晰的同一种集中度，也会让下行来得很急。
            claimRefs:
              - CR004
              - CR005
              - CR020
              - CR026
