      - number: '4.4'
        title: 财务结论与披露阻断点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Resilience 在资产和客户验证层面强于公司披露层面。Ohio 平台有真实吞吐量和可信锚定客户。收窄后的网络所需资本可能低于原先的铺张版图。Lilly
              投资也表明，关键资产仍有足够战略价值，能吸引更多支出。但负面同样清楚：公司因产能跑在需求前面而关闭站点，以仅 $4.5 million 出售 Durham，在重组期间依赖过桥资本，并把有担保债务叠到剩余平台上。


              这留下一个简单结论。收入质量可能正在改善，因为存活下来的网络更商业化，也更集中在真实需求周围；但利润率路径和资本充足性仍被缺失披露遮住。没有在手订单、利用率、头部客户集中度、债务契约和站点级经济性，投资人无法承销真实盈利能力。反题并不抽象：如果
              Ohio 需求不能足够快吸收固定成本，信贷层会在重置之后继续放大下行。这就是为什么下一步尽调应是财务透明度，而不是更多理论市场规模测算。
