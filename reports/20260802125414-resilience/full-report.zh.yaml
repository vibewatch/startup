  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与站点地图
        blocks:
          - type: paragraph
            body: >-
              以创业公司式尽调来看，Resilience
              当前的产品定义异常物理、也很模块化。公司现在不是呈现一个巨大的“平台”，而是在四个保留运营站点上叠加具名解决方案包。宽口径服务支柱是生物药原液、无菌制剂和细胞治疗。但更有信息量的是具名产品：Sprout
              Solutions 支持下一阶段原液或灌装，Auto-T 面向 T 细胞临床就绪，DAR-T 加速自体 CAR-T 制造，Idea to Clinic 帮生物药节省时间，Build Your Resilience
              支持第二供应商就绪。这种产品化很重要，因为它把技术能力翻译成买方面前的工作流。


              设施地图与这种模块化高度一致。Blue Ash 偏包装，并计划加入目检、器械组装和冷库。Cincinnati 是获商业许可的灌装和制剂引擎。Philadelphia 是自体 / 异体细胞治疗中心。Toronto
              服务单克隆抗体、重组蛋白和其他复杂分子。换句话说，产品线不只是服务类别；它是一套由站点锚定的运营架构，用不同物理能力承接不同类型项目。
            claimRefs:
