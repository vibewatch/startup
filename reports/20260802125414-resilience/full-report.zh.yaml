      - number: '1.2'
        title: 创始人、领导层交接与治理图谱
        blocks:
          - type: paragraph
            body: >-
              创始团队同时带有运营和风险孵化基因。2020 年启动公告将 Rahul Singhvi 列为联合创始人兼首席执行官，Robert Nelsen 列为创始人兼董事长，Patrick Y. Yang
              列为联合创始人兼副董事长，Drew Oetting 则是来自 8VC 的创始支持者。这种组合很关键，因为 Resilience 从来不是按传统单站点 CDMO
              来设计；它由投资人和运营者孵化，目标明确是重做制造基础设施。同一组来源也解释了早期战略为什么能推进很快：支持者愿意为平台论下注，而不是要求公司走狭窄的轻资产服务模型。


              到 2024 年末，领导层风险变得更显眼。Resilience 于 2024 年 12 月 5 日宣布 William S. Marth 将出任总裁兼首席执行官，接替创始阶段的领导姿态。Marth
              是经验丰富的大药企和 CDMO 运营者，曾管理 AMRI/Curia 和 Teva 的高级业务。当前团队材料把 Marth
              定位为商业与运营转型领导者，而不是科学家型创始人。对现在的公司而言，这大概率是合适画像，因为眼前挑战不是孵化，而是在无菌制造、客户交付和资本结构上纪律化执行。不过，CEO
              交接依然重要，因为它标志着公司与原始架构切开，也隐含承认 2021-2024 年的圈地之后，平台需要一套不同的运营打法。
