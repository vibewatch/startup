      - number: '1.3'
        title: 资本基础、投资人与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Resilience 的资本历史在私营 CDMO 中很特殊。启动公告称公司成立时已融资超过 $800 million。2022 年 6 月，Resilience 披露 $625 million Series
              D；更关键的是，公司同时披露了此前未宣布、于 2021 年 8 月完成的 $600 million Series C。2023 年 3 月，公司又获得由 U.S. Department of Defense 和
              Development Finance Corporation 支持的 $410 million 长期融资协议；2023 年还宣布 Mubadala 进行股权投资，并绑定 UAE
              制造合作。这些融资说明，公司早期战略建立在一个假设上：地理广度和多模态制造会创造长期战略价值。


              后续融资组合更防守，也更有信息量。2025 年 6 月的重组报道称，投资人为 Resilience 提供 $250 million 过桥融资，同时公司整合六个利用率不足的设施。2025 年 10 月，Oak
              Hill Advisors 又提供最高 $825 million 长期债务融资，包括 $600 million 第一留置权承诺和 $525 million 初始提款。正面解读是，成熟资本提供方仍在核心 Ohio
              和 Toronto 版图中看到持久资产价值。负面解读是杠杆：到 2025 年末，公司不再只是资金充足的风险孵化项目，而是在依靠有担保信贷稳定并加速一个更窄的前进战略。无论如何，Lilly、JobsOhio
              和主要交易对手现在几乎和股权投资人一样重要，因为它们的需求、合作可信度和生态支持共同影响公司的存活能力。
