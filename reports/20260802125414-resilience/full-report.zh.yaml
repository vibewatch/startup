      - number: '1.5'
        title: 未决问题与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据现在足以支撑一个更清楚的顶层图像：Resilience 是什么、重点在哪里。但几个公司层面的披露缺口仍然重大。已审阅的公开来源没有给出当前股权估值、公司整体收入运行率、毛利率或完整员工数。LinkedIn
              确认了总部和地点线索，也显示出相当大的公开关注度，但它无法提供足以替代管理层披露的运营指标。甚至部分版图数据也需要谨慎处理：公司能力页面仍称 Blue Ash 是一座 190,000
              平方英尺的包装设施，并有扩建计划；而 2026 年 6 月 JobsOhio 搬迁公告称 Blue Ash 运营面积超过 450,000
              平方英尺。这可能反映分阶段扩建或边界定义不同，但属于尽调追问项，不能随意引用为一个确定数字。


              因此，正确的概览判断是混合的。与许多风投支持的生物制造同行相比，Resilience 拥有更强客户验证、Ohio
              规模和制造相关性。但它也呈现出一个过度建设平台的典型症状：公司正在围绕存活下来的最强资产重资本化、重划边界。后续章节因此应把 Ohio 无菌制造、Lilly
              依赖和债务支持下的稳定作为当前事实基础，同时保留对收入、估值、利用率和重组后完整经济性的明确不确定性。
