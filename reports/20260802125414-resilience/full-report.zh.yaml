  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与打破论点的因素
        blocks:
          - type: paragraph
            body: >-
              最重要的风险问题不是生物制造在抽象意义上是否有吸引力，而是 Resilience 收窄后的 2025 年后平台，能否在杠杆、客户集中和执行复杂度压垮重置之前跑出耐久利用率。2025 年 6
              月关闭六个站点，是文件中最强的反证事实。它说明早期网络至少有一部分没有被充分利用，这让所有当前规模主张都变成“前进”主张，而不是原始模型已经跑通的证据。2025 年 10 月 Durham
              出售又加重了这一信号，因为它实际上以远低于早期期待的价格变现了一个基因治疗资产。


              这并不意味着公司不可投资，但它改变了证明负担。当前论点现在集中在 Ohio 无菌注射剂和下游器械相邻业务上，Toronto 和 Philadelphia
              保留生物药和细胞治疗相关性。最大的论点破坏项很直接：又一次重大需求重置、Ohio 枢纽出现质量或检查问题、Lilly 关系显著恶化，或杠杆在利用率追上来之前约束运营。
