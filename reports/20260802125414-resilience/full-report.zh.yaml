companyProfile:
  summary: >-
    Resilience 是一家私营北美生物制造 CDMO，2020 年带着异常庞大的资本野心起步，并在 2025 年大幅重置。现在更应把公司理解为一个更窄、以 Ohio 为中心的制造平台，背后配有 Toronto 生物药能力和
    Philadelphia 细胞治疗能力，而不是最初设想的庞大网络。公开验证最强的部分在 Ohio 的无菌制剂、包装和器械相邻业务，尤其是扩大的 Lilly
    关系；同时，公司仍面向需要开发、转移和商业化支持的赞助方销售生物药和细胞治疗工作流。
