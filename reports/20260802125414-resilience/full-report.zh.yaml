        - label: 2. 技术评估
          stage: 技术评估
          actor: 技术运营 / 工艺开发
          action: Matches program needs to biologics, cell therapy, or drug-product workflow
          pain: Vendor fragmentation and transfer risk
          outcome: Selects a facility path or joint-service workflow
        - label: 3. 初始合作
          stage: 初始合作
          actor: 赞助方和 Resilience 团队
          action: Begins PAD, transfer, or early manufacturing support
          pain: Uncertain timing, assay readiness, and batch economics
          outcome: Program enters development or transfer work
        - label: 4. 生产 / 上市支持
          stage: 生产 / 上市支持
          actor: 制造、质量和供应团队
          action: Runs GMP, fill-finish, packaging, or commercial supply operations
          pain: Scale, quality, and reliability pressure
          outcome: Commercial or clinical product delivered
        - label: 5. 扩张
          stage: 扩张
          actor: 客户团队 / 客户高层
          action: Adds device assembly, packaging, commercial continuity, or additional programs
          pain: Concentration and site-capacity trade-offs
          outcome: Higher share of wallet and longer workflow lock-in
