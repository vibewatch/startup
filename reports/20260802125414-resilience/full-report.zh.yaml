  - id: TV005
    title: 哪些因素会实质性推动估值
    columns:
      - 尽调项
      - 向上解读
      - 向下解读
      - 为什么重要
    rows:
      - - 前十大客户收入结构
        - Lilly 之外还有多个规模化客户
        - Lilly 对经济性影响超过预期
        - 直接改变集中度折价
      - - 债务契约和净债务
        - 有余量，条款灵活
        - 契约偏紧或摊还激进
        - 决定有多少 EV 能流向股权
      - - 按产线划分的基地利用率
        - 收窄后的布局确实在填满
        - 关键产线仍未充分利用
        - 检验重置是否修复了核心问题
      - - 检查和审计历史
        - 质量记录强，CAPA 有限
        - 近期有严重发现或反复问题
        - 质量风险直接影响战略溢价
      - - Lilly 之外的积压订单 / 已签约扩张
        - 多客户需求具备耐久性
        - 叙事主要依赖单一锚定客户
        - 区分战略资产和单一客户故事
    notes: 这五个尽调问题，比泛泛市场评论更可能撬动估值。
    claimRefs:
