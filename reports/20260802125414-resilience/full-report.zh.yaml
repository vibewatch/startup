      - number: '2.4'
        title: 增长驱动、瓶颈，以及 Resilience 为什么适合此刻
        blocks:
          - type: paragraph
            body: >-
              2026 年证据包中有三个增长驱动尤其突出。第一，生物药和先进模态继续跑赢更广泛的 CDMO 市场。第二，GLP-1
              和其他慢病注射产品持续压迫无菌灌装、器械组装和冷链运营等下游环节。第三，BIOSECURE、关税和更广泛的回流优先事项正把买方推向美国及盟友制造产能。Resilience
              贴合这三个主题：它有生物药和细胞治疗暴露，有 Ohio 无菌注射剂基础，还有一项 Lilly 合作，明确提到本土供应、高需求药物和器械制造。


              约束同样重要。Vector 和其他行业声音称，2025 年许多细胞和基因治疗 CDMO 仍处于利用率不足状态，因为融资收紧，赞助方收窄管线。Alira
              称，产能可获得性和可靠性——不只是新增平方英尺——已经成为差异化因素。部分先进疗法的公共报销压力以及政策执行不确定性又增加了风险。这种混合背景解释了为什么 Resilience 可以在 2025
              年关闭设施，同时又在 2026 年拿到与 Lilly 绑定的重大投资：市场并非普遍容易，但真正有无菌制剂需求、可信本土执行和锚定客户验证的精选小生态，仍然有吸引力。
