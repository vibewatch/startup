      - CR006
      - CR007
      - CR022
      - CR023
      - CR037
  - id: FV001
    title: 估值瀑布图
    type: waterfall
    layout: wide
    summary: 从战略资产价值出发，经过折价和债务包袱之后，推演到不确定的股权价值。
    data:
      items:
        - label: 战略资产基础
          value: 100
          detail: 国内稀缺的无菌、包装和生物制品 / 细胞治疗基础设施
        - label: + 客户验证
          value: 20
          detail: Lilly 和其他具名关系提升了相关性的可信度
        - label: + 回流本土 / 政策顺风
          value: 10
          detail: BIOSECURE 和国内供应优先事项可能支撑战略溢价
        - label: '- 重组折价'
          value: -25
          detail: 关闭六个厂区削弱了市场对原扩张逻辑的信任
        - label: '- 基因治疗减值'
          value: -10
          detail: Durham 出售显示价值下修风险
        - label: '- 披露不透明'
          value: -15
          detail: 没有公开运营申报，也没有清晰收入基础
        - label: '- 债务包袱'
          value: -20
          detail: 有担保债务可能吃掉企业价值的很大一部分
        - label: '= 剩余股权选择权'
          value: 60
          detail: 仍有意义，但对私下尽调输入高度敏感
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV018
      - CV020
      - CV021
      - CV037
      - CV040
  - id: FV002
    title: 战略稀缺性 vs 披露不透明
    type: quadrant
    layout: wide
    summary: 沿稀缺性和透明度两个维度，定性定位 Resilience 及公开地标公司。
    data:
      xAxis: 披露 / 透明度（1=低，5=高）
      yAxis: 战略制造稀缺性（1=低，5=高）
      points:
        - label: Resilience
          x: 1.5
          'y': 4.5
          detail: 资产稀缺且有锚定客户，但私营公司不透明，近期又经历重置
        - label: Lonza
          x: 4.8
          'y': 4.7
          detail: 上市、规模化、多元化的制造龙头
        - label: Samsung Biologics
          x: 4.6
          'y': 4.8
          detail: 大型上市生物制品制造平台
        - label: Catalent（私有化前）
          x: 4.3
          'y': 4
          detail: 私有化前的上市制造基准
        - label: Emergent
          x: 4.2
          'y': 2
          detail: 公开可见，但战略和财务都承压
        - label: WuXi Biologics
          x: 4.4
          'y': 4.1
          detail: 规模化 CDMO，政策摩擦不小
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 示意性估值区间
    type: range
    layout: standard
    summary: 企业价值区间很宽，反映仅靠公开信息承保时的不确定性很高。
    data:
      items:
        - label: 悲观
          low: 2
          high: 3
          unit: USD billions
        - label: 基准
          low: 3
          high: 4.5
          unit: USD billions
        - label: 乐观
          low: 4.5
          high: 6.5
          unit: USD billions
    approximationNotes: 区间是低置信度的分析估计，不是市场报价或管理层指引。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV040
  - id: FV004
    title: 上市可比公司市值地标
    type: bar
    layout: wide
    summary: 选取若干公开市场市值地标，为 Resilience 估值判断划定边界。
    data:
      items:
        - label: Emergent
          value: 0.37
          unit: USD billions
        - label: Catalent
          value: 11.52
          unit: USD billions
        - label: WuXi Biologics
          value: 20.24
          unit: USD billions
        - label: Lonza
          value: 48.63
          unit: USD billions
        - label: Samsung Biologics
          value: 47.71
          unit: USD billions
        - label: Thermo Fisher
          value: 213.42
          unit: USD billions
        - label: Eli Lilly
          value: 1024
          unit: USD billions
    approximationNotes: Catalent 使用私有化前最后已知公开市值；其他数值反映本报告使用的已抓取公开快照。
    claimRefs:
      - CV012
