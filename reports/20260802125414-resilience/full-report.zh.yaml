  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、组合与确认逻辑
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Resilience 更像一家有多层收入的制造服务公司，而不是单一产品生物技术公司。公开材料显示四个变现桶：生物药原液业务、无菌制剂和器械相邻制造、细胞治疗开发 / GMP
              供应，以及项目制合作业务。Lilly 关系是最清楚的商业锚，因为它指向很大的下游产量、Ohio 就业和器械导向扩张。相比之下，BridgeBio、CARGO 和 Parvus
              暗示的是更小、处于开发阶段或按项目绑定的收入流，单批次利润率可能更高，但时间和规模更难预测。


              公开记录没有披露收入、在手订单、单批价格或毛利率，因此只能推断组合。不过，经济逻辑可见：Ohio 很可能贡献最成熟的商业化制造收入，而 Toronto 和 Philadelphia
              支撑低量但有战略价值的生物药和细胞治疗项目。Lilly 的 10-K 也提供了有用的会计类比，因为它描述了供应安排中收入随产品制造进度分期确认。这不能证明 Resilience
              采用同样处理，但能说明为什么长期制造关系的表现不同于只有里程碑的生物技术合作。
