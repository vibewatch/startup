      - number: '3.4'
        title: 护城河耐久性、替代品与竞争风险
        blocks:
          - type: paragraph
            body: >-
              重组后，Resilience
              最可防守的护城河不是规模，而是契合度。公司现在对准了一个市场切片：美国地点、质量执行和一个大型锚定客户都很重要。如果管理层证明收窄后的网络能维持高利用率，这一点可以耐久。但护城河也脆弱。全球玩家更能吸收利用率不足，把固定成本摊到更多产品和客户上，并用更大的现金流为扩张融资。CordenPharma
              等邻近公司可以争夺无菌注射剂或脂质递送工作流的一部分。Emergent 即便不是完全一对一的生物药同行，也能竞争某些本土或政府导向制造关系。


              政策又加了一层。BIOSECURE 是对中国关联竞争者的真实顺风，但不应被误读成永久竞争护盾。如果执行放松、双源采购延续，或客户在非敏感项目中继续使用 WuXi，结构性收益会收窄。Durham 出售给 OXB
              也是一个警示：聚焦竞争者可以从 Resilience 选择放弃的资产中创造价值。因此，投资人应把本土执行、Lilly 验证和模态聚焦视为正面情景，同时承认集中度、定价不透明和规模化既有企业的力量仍是核心竞争风险。
