        title: 既有玩家画像与规模基准
        blocks:
          - type: paragraph
            body: >-
              大市值对照组很有压迫感。Lonza 仍把自己营销为最早的 CDMO，在五大洲拥有约 20,000 名员工。Samsung Biologics 披露 145-plus 全球客户、5,800-plus 员工、845
              kL 产能，以及数万亿韩元年收入和营业利润。Catalent 宣传近 40 个站点、每年交付超过 60 billion 剂量，并申报 2025 财年 Q1 收入超过 $1
              billion，其中包括规模可观的生物药部门。Patheon/Thermo Fisher 强调全球网络、科学与监管专家，以及从开发到供应的一体化 360-degree 支持。这些玩家靠规模、广度和财务韧性竞争。


              专科层不同，但同样强悍。WuXi Biologics 把自己定位为从概念到商业化的单一来源提供方。Fujifilm 营销从临床前到商业化的端到端支持，并继续扩张美国制造。AGC Biologics
              把生物药与细胞和基因治疗、病毒载体、质量体系和灌装结合起来。OXB 则通过吸收前 Durham 资产，加码美国病毒载体和灌装能力。合在一起，这些同行说明 Resilience
              不只在和超大规模网络竞争，也在和模态主张更锋利的聚焦运营者竞争。
