      - number: '4.2'
        title: 资本结构、杠杆与充足性
        blocks:
          - type: paragraph
            body: >-
              公司的融资历史现在更像基础设施融资，而不是普通风险融资。Resilience 启动时融资超过 $800 million，后来在 $625 million Series D 旁披露此前的 $600 million
              Series C，又叠加 $410 million DoD/DFC 融资层，拿到金额未披露的 Mubadala 股权投资，据报道在重组期间需要 $250 million 过桥融资，随后宣布从 Oak Hill
              Advisors 获得最高 $825 million 有担保长期融资。对一家私营 CDMO 来说，这是一套异常复杂的资本栈，也说明原始建设有多烧钱。


              对当前承销最重要的是后续层。过桥融资暗示 2025 年重置期间公司依赖资本。OHA 融资包——带第一留置权分层和大额初始提款——说明公司现在依靠有担保信贷来稳定并加速更小的网络。正确解读是混合的：贷款方和伙伴仍在
              Ohio 与 Toronto 看到耐久资产价值，但杠杆会放大利用率不佳的惩罚。公开记录没有给出现金余额、跑道或契约细节，因此不能仅凭公开证据干净承销资本充足性。
