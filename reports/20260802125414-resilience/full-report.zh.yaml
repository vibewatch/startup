      - number: '2.2'
        title: 市场规模、增长与集中度
        blocks:
          - type: paragraph
            body: >-
              可访问的公开来源支持一种多视角规模判断，而不是干净的单一 TAM。Vision Lifesciences 估计全球 CDMO 市场 2025 年约 $210 billion，到 2030 年约 $330
              billion；Alira 则称，生物药 CDMO 细分在 2024 年经 11% 年增长后已达 $20.7 billion。其中，Alira 称先进疗法同比增长 37% 至 $3.7
              billion，已经占生物药 CDMO 价值的 18%。这些数字并非完全可比，但稳定指向同一结构：总市场很大，生物药是增长更快的子集，先进疗法规模更小但增长最快。


              市场也在集中。Alira 称，2024 年前八大 CDMO 拿走了生物药 CDMO 收入的 51%；Vision 称，外包渗透率已升至制药制造总量约
              40%。这组组合意味着规模越来越重要，因为赞助方偏好能力整合、监管成熟、商业化执行可靠的 CDMO。对 Resilience
              来说，这既是机会也是警告：所服务市场在增长，但规模化既有企业吸收了很大一部分需求，也设定了质量体系、版图和资本纪律的竞争门槛。
