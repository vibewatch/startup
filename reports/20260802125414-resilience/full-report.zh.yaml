      - number: '6.2'
        title: 具名客户验证与采用信号
        blocks:
          - type: paragraph
            body: >-
              最强具名验证是 Lilly。Resilience 和 Lilly 称，双方 2023 年首次建立的合作已用西林瓶和预灌封注射器格式，为美国患者生产超过 150 million 剂量。2026 年 7 月扩建增加
              KwikPen 生产，创造至少 400 个新岗位，并深化 Ohio 建设。AstraZeneca 是第二个最具体的账户，因为最初的 West Chester 交易包含针对部分 AstraZeneca
              药物的多年供应协议，并把一个运营中的商业化站点保留在 Resilience 网络中。


              这两个之后，证据从产量验证转向工作流验证。BridgeBio 曾公开描述 Resilience
              是特定基因治疗项目未来的主要商业化制造商，采用成本和风险共担结构；不过，基因治疗后续收缩意味着这项验证现在部分属于历史。Labcorp
              把联合产品描述为贯穿临床前、临床和商业化阶段的端到端客户服务包。Parvus、CARGO 和 Takeda
              显示公司对先进疗法赞助方仍有相关性，但公开材料在批次数、年度合同价值或续约深度上仍然很薄。采用是真实的；锚定账户之外的规模透明度并不真实。
