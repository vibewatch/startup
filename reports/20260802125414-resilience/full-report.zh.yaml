      - number: '7.2'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              Resilience 承担的监管负担对 CDMO 来说常规，但对投资人依然高度重大。cGMP 规则管制造系统、文件记录、放行纪律、调查和
              CAPA。行业内的警告信显示，质量失败可以多快变成公开、昂贵且伤害客户的事件。Resilience 发布了一个与 OIG
              风格治理语言对齐的公司合规项目，方向上正面，但发布项目不等于拥有干净检查记录。这个区分很重要，因为决定生产连续性是否能维持的，是第三方审计和客户质量团队，而不是网站文案。


              法律和政策背景又加了一层。只要受监管医疗供应链、公共资金或政府关联支持参与其中，虚假申报和医疗欺诈理论就相关。2023 年 DoD/DFC
              融资和更广泛的本土制造姿态提高了战略相关性，但也可能增加审查。与此同时，BIOSECURE Act 和相关国家安全控制可能让美国 CDMO
              受益，因为它们会让使用某些中国供应商变复杂；但政策时间和范围仍不确定。投资人应把 BIOSECURE 视为潜在需求顺风，而不是有保证的收入项目。
