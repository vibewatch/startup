  topStrengths:
    - Lilly 通过产量、客户引述和一项绑定 Ohio 制造资产的 2026 年大型扩产，为一家私营 CDMO 提供了罕见强度的公开验证。
    - 平台收窄后，在美国无菌药品、包装以及贴近器械的下游产能上，仍显得具备战略稀缺性。
    - 公开融资历史显示，公司多次拿到成熟资本和政策绑定支持，包括 DoD/DFC 与 Oak Hill。
    - Toronto 和 Philadelphia 让公司在 Ohio 商业核心之外，仍保留生物制剂和细胞疗法相关性。
  topRisks:
    - 2025 年 6 月关闭 10 座设施中的 6 座，是很强的反向信号：最初网络可能跑在需求或利用率前面太多。
    - Oak Hill 第一顺位留置权融资和整体不透明的资本结构，让企业价值最终有多少归属股权高度不确定。
    - 公开客户证据很集中，Lilly 远远是最强商业锚点。
    - 收入、EBITDA、客户集中度、合同经济性和检查历史仍未披露，无法干净承销。
    - Durham 基因疗法退出说明，技术路线战略和资产价值都可能急转向。
  unresolvedGaps:
    - 业务重置后的当前收入、EBITDA、现金消耗、资本开支和营运资本情况
    - Oak Hill 融资下的净债务、契约条款、摊还计划和债权人保护
    - 前 10 大客户集中度、主要账户毛利率，以及合同期限 / 续约证据
    - Blue Ash 和 West Chester 的站点级利用率、已签 backlog 和逐线爬坡状态
    - 保留运营版图内近期检查、审计和 CAPA 历史
