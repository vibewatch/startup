- id: incumbent-and-specialist-profiles
  title: Incumbent profiles and scale benchmarks
  body: 'The large-cap comparison group is intimidating. Lonza still markets itself as the original CDMO with around 20,000 employees across five continents. Samsung Biologics discloses 145-plus global clients, 5,800-plus employees, 845 kL of capacity, and multibillion-won annual revenue and operating profit. Catalent advertises nearly 40 sites, more than 60 billion doses delivered annually, and filed Q1 fiscal 2025 revenue above $1 billion, including a substantial biologics segment. Patheon/Thermo Fisher emphasizes a global network, scientific and regulatory experts, and integrated 360-degree development through supply. These players compete on scale, breadth, and financial resilience.


    The specialist layer is different but still formidable. WuXi Biologics positions itself as a single-source provider from concept to commercialization. Fujifilm markets end-to-end support from pre-clinical through commercialization and continues to expand U.S. manufacturing. AGC Biologics combines biologics with cell and gene therapy, viral vectors, quality systems, and fill-finish. OXB has doubled down on U.S. viral-vector and fill-finish capability by absorbing the former Durham asset. Together, these peers show that Resilience is not only competing against megascale networks but also against focused operators with sharper modality claims.'
