  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: No public win/loss data showing which competitors Resilience most often beats or loses to by modality.
    whyItMatters: Competitive theory is weaker than customer-level evidence when assessing moat durability.
    diligencePath: Request top-20 opportunity data split by competitor, modality, and reason won/lost.
    relatedQuestionRefs:
    - QP018
    - QP024
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public competitor materials do not disclose realized pricing, discounts, or margin structure.
    whyItMatters: A company can appear differentiated yet still lose on price or earn weak contribution margins.
    diligencePath: Request sample MSAs, slot-pricing benchmarks, and margin by service line.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Resilience's revenue concentration by Lilly and by modality is not disclosed.
    whyItMatters: Competitive position is inseparable from customer concentration in a project-based CDMO model.
    diligencePath: Request top-customer concentration and contracted capacity by site.
    relatedQuestionRefs:
    - QP021
    - QP022
  - type: conflicting-data
    severity: minor
    topic: cross-modality-peer-set
    missingEvidence: A single apples-to-apples peer set that cleanly benchmarks biologics, sterile injectables, and cell therapy on the same basis.
    whyItMatters: Resilience spans multiple service lines, so any one ranking can overstate or understate its position.
    diligencePath: Use service-line-level peer groups rather than one composite ranking.
    relatedQuestionRefs:
    - QP018
    - QP023
  - type: missing-source
    severity: material
    topic: policy-tailwind-durability
    missingEvidence: Exact revenue impact from BIOSECURE-linked customer wins or losses is unavailable.
    whyItMatters: Investors need to know whether policy creates transient lead flow or enduring booked capacity.
    diligencePath: Request pipeline notes identifying deals with explicit policy / domestic-sourcing rationale.
    relatedQuestionRefs:
    - QP019
    - QP025
    relatedTableRefs:
    - TP004
