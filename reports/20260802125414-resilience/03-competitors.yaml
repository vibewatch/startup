company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 3
  title: Competitors
  summary: 'Resilience sits in a crowded competitive field where the true comparison set depends on modality. Global incumbents such as Lonza, Samsung Biologics, Catalent, and Patheon/Thermo Fisher dominate on scale, network breadth, and disclosed financial firepower. Specialists such as OXB, AGC Biologics, and WuXi matter more in particular workflows like viral vectors, cell therapy, or integrated development-to-commercial support. Adjacent players like CordenPharma and Emergent can still compete for overlapping sterile-injectable, LNP, or domestic-manufacturing budgets. Resilience is clearly smaller than the first tier, but the post-2025 reset gives it a more coherent wedge: a North American footprint focused on Ohio sterile drug product and device-adjacent work, Toronto biologics, and Philadelphia cell therapy, reinforced by unusually strong private-company proof from Lilly. The central underwriting question is therefore not whether Resilience is the biggest CDMO—it is whether that narrower,
    domestic, execution-led position can hold pricing and utilization against larger and better-capitalized rivals.'
sections:
- id: landscape-and-classes
  title: 'Landscape overview: giants, specialists, and adjacencies'
  body: 'Resilience does not face a single monolithic competitor. Its competitive set splits into at least three classes. First are global diversified CDMOs such as Lonza, Samsung Biologics, Catalent, and Patheon/Thermo Fisher that compete on network breadth, regulatory infrastructure, and the ability to support clients from early development through large-scale commercial supply. Second are focused advanced-therapy or modality specialists such as OXB, AGC Biologics, and WuXi in selected workflows, especially cell therapy, viral vectors, or high-complexity biologics. Third are adjacent players like CordenPharma or Emergent that may not mirror Resilience across every modality but still compete for overlapping budgets in sterile injectables, lipid-enabled delivery, or domestic preparedness-oriented manufacturing.


    That fragmentation matters for diligence. Toronto biologics should not be benchmarked against the same peer set as West Chester fill-finish or Philadelphia cell therapy. It also means Resilience cannot be fairly described as simply "smaller than Lonza"; it is smaller than every global benchmark, but it may still be relevant in narrower domestic niches where proximity, device assembly, or anchor-customer proof carry disproportionate weight.'
