- id: regulatory-legal-and-policy-risks
  title: Regulatory, legal, and policy risks
  body: 'Resilience operates under a regulatory burden that is ordinary for a CDMO but still highly material for investors. cGMP rules govern manufacturing systems, documentation, release discipline, investigations, and CAPA. Warning letters across the sector show how quickly quality failures can become public, expensive, and customer-damaging. Resilience publishes a corporate compliance program aligned with OIG-style governance language, which is directionally positive, but a published program is not the same as a clean inspection record. That distinction matters because third-party audits and customer quality teams, not website copy, decide whether production continuity survives.


    The legal and policy backdrop adds another layer. False-claims and healthcare-fraud theories are relevant whenever regulated healthcare supply chains, public funds, or government-linked support are involved. The 2023 DoD/DFC financing and broader domestic-manufacturing posture increase strategic relevance but can also increase scrutiny. Meanwhile, the BIOSECURE Act and related national-security controls may advantage U.S.-based CDMOs by complicating use of certain Chinese suppliers, yet policy timing and scope remain uncertain. Investors should treat BIOSECURE as a potential demand tailwind, not a guaranteed revenue line item.'
