company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 7
  title: Risks
  summary: 'Resilience’s risk profile is dominated by one fact: the company has already had to radically reset its original strategy. The June 2025 closure of six of ten facilities, followed by the Durham gene-therapy asset sale, is the clearest signal that earlier demand, capital allocation, or modality mix did not meet expectations. Against that backdrop, the current thesis rests on a narrower four-site network, heavy Ohio operating concentration, a very large Lilly relationship, and an $825 million first-lien debt package from Oak Hill Advisors. Regulatory and quality risk are inherent because the business sits inside cGMP manufacturing, while policy shifts such as the BIOSECURE Act may create both demand tailwinds and forecasting noise. The company’s public compliance posture is respectable, but underwriting still depends on private diligence around inspection history, debt terms, customer concentration, and the exact customer losses or migrations behind the 2025 reset.'
sections:
- id: risk-overview-and-thesis-breakers
  title: Risk overview and thesis-breakers
  body: 'The most important risk question is not whether biomanufacturing is attractive in the abstract; it is whether Resilience’s narrowed post-2025 platform can generate durable utilization before leverage, customer concentration, and execution complexity overwhelm the reset. The six-site closure in June 2025 is the strongest disconfirming fact in the file. It shows that at least part of the earlier network was not adequately utilized, which turns all current scale claims into “go-forward” claims rather than proof that the original model worked. The October 2025 Durham sale compounds that signal because it effectively monetized a gene-therapy asset at a price far below earlier expectations.


    That does not make the company uninvestable, but it changes the burden of proof. The current thesis is now concentrated around Ohio sterile injectables and downstream device-adjacent work, with Toronto and Philadelphia preserving biologics and cell-therapy relevance. The biggest thesis breakers are straightforward: another major demand reset, quality or inspection issues at the Ohio hub, meaningful deterioration in the Lilly relationship, or leverage that constrains operations before utilization catches up.'
