- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Utilization failure
    - Line or site utilization
    - If key Ohio lines remain materially underfilled after 2027 ramp window
    - Re-underwrite growth case and debt service capacity
  - - Quality / regulatory event
    - FDA/customer audit outcome
    - Warning letter, major 483 pattern, or large customer CAPA escalation
    - Pause underwriting until remediation evidence is available
  - - Customer concentration shock
    - Anchor-account change
    - Material Lilly scope reduction, repricing, or delay
    - Rebase revenue durability and valuation assumptions
  - - Leverage stress
    - Debt covenant headroom / refinancing posture
    - Need for distressed amendment or punitive refinance terms
    - Treat as thesis-break risk
  - - Execution slippage
    - Blue Ash / KwikPen ramp milestones
    - Missed qualification timeline or repeated staffing delays
    - Reduce confidence in go-forward Ohio strategy
  notes: These kill criteria translate abstract risk into monitorable events investors can track over time.
