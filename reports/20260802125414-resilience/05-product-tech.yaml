- id: roadmap-differentiation-and-gaps
  title: Roadmap, differentiation, and remaining gaps
  body: 'The clearest current roadmap is not a return to the earlier multi-site land grab. It is a deepening of the narrowed network around the most useful present capabilities. Blue Ash and Cincinnati are being enhanced around commercial downstream execution, especially through the Lilly/KwikPen expansion. Toronto and Philadelphia continue to give the network biologics and cell-therapy relevance, but the public messaging now emphasizes speed, modularity, secondary-supplier readiness, and integrated customer workflows rather than a giant national footprint. That is a meaningful strategic change from the company''s original buildout posture.


    Differentiation therefore appears to rest on modular operating products, deep analytics, downstream U.S. commercial execution, and partner integration. It does not currently rest on a fully public patent estate or a visible developer ecosystem. The company has no open-source code surface; the nearest practitioner signal is LinkedIn plus a steady stream of operator-facing technical content. For diligence, that means product-tech confidence should remain moderate until management discloses inspection history, line-level automation data, patent coverage, and current throughput by suite.'
