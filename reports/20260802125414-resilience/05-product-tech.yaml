company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 5
  title: Product & Technology
  summary: 'Resilience''s product and technology story is now best described as a site-anchored operating system for complex biologics, sterile drug product, and cell therapies rather than as a diffuse manufacturing network. Public materials show three modality pillars—biologics drug substance, sterile drug product, and cell therapy—packaged into named customer solutions such as Sprout Solutions, Auto-T, DAR-T, Idea to Clinic, and Build Your Resilience. The architecture is physical and workflow-driven: Blue Ash and Cincinnati handle packaging, device-adjacent downstream work, and fill/finish; Philadelphia anchors autologous and allogeneic cell-therapy development and release testing; Toronto supports PAD and GMP manufacturing for mAbs and recombinant proteins. Technical content around Annex 1, aseptic filling, digital twins, fill/finish constraints, and cell-therapy cost reduction suggests a differentiation strategy based on execution, analytics, and manufacturability know-how. Trust controls
    are visible through the public compliance program, but line-level inspection, automation, and IP data remain important gaps.'
sections:
- id: product-modules-and-sites
  title: Product modules and site map
  body: 'Resilience''s current product definition is unusually physical and modular for a startup-style diligence case. Instead of one monolithic "platform," the company now presents named solution packages layered on top of four retained operating sites. The broad service pillars are biologics drug substance, sterile drug product, and cell therapy. But the more revealing framing is in the named offers: Sprout Solutions for next-step drug substance or fill/finish support, Auto-T for T-cell clinical readiness, DAR-T for accelerated autologous CAR-T manufacturing, Idea to Clinic for biologics time savings, and Build Your Resilience for secondary-supplier readiness. That productization matters because it translates technical capabilities into buyer-facing workflows.


    The facilities map aligns closely with that modularization. Blue Ash is packaging-oriented with planned visual inspection, device assembly, and cold storage. Cincinnati is the commercially licensed fill/finish and drug-product engine. Philadelphia is the autologous/allogeneic cell-therapy center. Toronto serves monoclonal antibodies, recombinant proteins, and other complex molecules. In other words, the product line is not just service categories; it is a site-anchored operating architecture meant to route different classes of programs through different physical capabilities.'
