  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: inspection-history
    missingEvidence: Current FDA, EMA, or customer inspection history by facility and line.
    whyItMatters: Public quality language is useful, but inspection outcomes are the real trust signal in regulated manufacturing.
    diligencePath: Request most recent regulatory and customer audit summaries plus CAPA status.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: ip-portfolio
    missingEvidence: A current patent list, freedom-to-operate summary, or public IP map for any proprietary process elements.
    whyItMatters: Differentiation claims are easier to underwrite when there is clear process/IP defensibility.
    diligencePath: Request patent schedule and any process-proprietary differentiation memo.
    relatedQuestionRefs:
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: line-level-performance
    missingEvidence: Automation level, deviation rate, uptime, batch failure rate, and cycle time by major line or suite.
    whyItMatters: Operating maturity cannot be judged from throughput headlines alone.
    diligencePath: Request line-level operational KPI dashboard for Ohio, Toronto, and Philadelphia.
    relatedQuestionRefs:
    - QE013
    - QE018
    - QE025
  - type: missing-source
    severity: minor
    topic: developer-signal-limitations
    missingEvidence: No public codebase, package registry, or open developer ecosystem comparable to a software platform.
    whyItMatters: The required developer/practitioner signal must be interpreted differently for a regulated manufacturer.
    diligencePath: Use hiring, practitioner content, conference talks, and integration partnerships as the proxy signal set.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: customer-adoption-by-solution
    missingEvidence: Adoption and revenue by named solution (Auto-T, DAR-T, Idea to Clinic, Build Your Resilience).
    whyItMatters: Named packaging can be meaningful differentiation or just marketing unless customer uptake is known.
    diligencePath: Request customer counts, conversion metrics, and win rates by named solution.
    relatedQuestionRefs:
    - QE006
    - QE007
    relatedTableRefs:
    - TE001
