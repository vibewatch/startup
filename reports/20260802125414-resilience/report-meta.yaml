  topStrengths:
  - Lilly provides unusually strong public validation for a private CDMO through output, customer quotation, and a large 2026 expansion tied to Ohio manufacturing assets.
  - The narrowed platform still appears strategically scarce in U.S. sterile drug product, packaging, and device-adjacent downstream capacity.
  - Public financing history shows repeated access to sophisticated capital and policy-linked support, including DoD/DFC and Oak Hill.
  - Toronto and Philadelphia preserve biologics and cell-therapy relevance beyond the Ohio commercial core.
  topRisks:
  - The June 2025 closure of six of ten facilities is a major disconfirming signal that the original network overshot demand or utilization.
  - The Oak Hill first-lien financing and broader opaque capital stack create high uncertainty about how much enterprise value actually accrues to equity.
  - Public customer proof is concentrated, with Lilly far and away the strongest commercial anchor.
  - Revenue, EBITDA, customer concentration, contract economics, and inspection history remain undisclosed, preventing clean underwriting.
  - The Durham gene-therapy exit shows that modality strategy and asset value can reverse sharply.
  unresolvedGaps:
  - Current revenue, EBITDA, cash burn, capex, and working-capital profile for the post-reset business
  - Net debt, covenant package, amortization schedule, and lender protections under the Oak Hill financing
  - Top-10 customer concentration, margin by major account, and contract duration / renewal evidence
  - Site-level utilization, booked backlog, and line-by-line ramp status for Blue Ash and West Chester
  - Recent inspection, audit, and CAPA history across the retained operating footprint
