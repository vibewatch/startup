  headquarters: Blue Ash, Ohio, USA
  productSummary: Resilience sells biologics drug-substance development/manufacturing, sterile drug-product fill-finish, packaging, device assembly, commercial continuity support, and cell-therapy development/manufacturing workflows across its retained sites in Ohio, Toronto, and Philadelphia.
  customerFocus: Primary customers are large biopharma manufacturers and development-stage biotech sponsors that need domestic sterile manufacturing, biologics scale-up, cell-therapy process support, and end-to-end workflow integration.
  businessModel: Fee-for-service and project-based CDMO revenue model spanning process and analytical development, tech transfer, GMP manufacturing, commercial supply, packaging, and device-adjacent downstream operations, with some strategic partnerships structured around longer-term manufacturing continuity.
  stage: private, post-restructuring growth reset
  fundingStatus: Publicly disclosed capital signals include the 2022 Series D and previously undisclosed 2021 Series C, a 2023 $410M DoD/DFC financing, a 2023 Mubadala equity investment of undisclosed size, a 2025 Oak Hill financing package of up to $825M, and a 2026 $750M Lilly-linked manufacturing expansion that validates strategic relevance but does not directly price common equity.
