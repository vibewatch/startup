company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 2
  title: Market Analysis
  summary: 'Resilience competes in a narrower slice of the broad CDMO universe than top-down market headlines suggest: outsourced biologics, sterile drug product and device assembly, and cell-therapy manufacturing centered on North American supply resilience. Public market sources consistently show strong structural demand in these segments—Vision estimates the global CDMO market at roughly $210 billion in 2025, while Alira says biologics CDMO reached $20.7 billion in 2024 and advanced therapies grew 37% year over year to $3.7 billion. At the same time, the market has changed shape. Sponsors now care more about location, reliability, and integrated regulatory/manufacturing support than about announced capacity alone; GLP-1 demand is straining sterile fill-finish and device assembly; and BIOSECURE plus reshoring concerns are redirecting some buying behavior toward U.S. and allied suppliers. Resilience fits those themes through its Ohio sterile hub, Toronto biologics base, Philadelphia cell-therapy
    site, and Lilly partnership, but the company still faces the same headwinds cited across the market: concentrated competition, underutilized CGT capacity, policy uncertainty, and unclear site-level utilization after its 2025 reset.'
sections:
- id: market-boundary-and-serviceable-scope
  title: Market boundary and the slice Resilience actually serves
  body: 'Resilience does not participate in the entire outsourced pharmaceutical manufacturing universe. Its own offering pages constrain the relevant market to advanced biologics drug substance, sterile drug-product manufacturing, device assembly and packaging, plus cell-therapy development and GMP operations. That matters because generic references to a giant "CDMO market" can be misleading for underwriting: a company built around biologics, aseptic fill-finish, and cell therapy should not be valued against every small-molecule API contractor or broad formulation shop.


    The serviceable scope is better understood as the intersection of three narrower pools. First is outsourced biologics manufacturing for monoclonal antibodies and recombinant proteins, where Toronto provides process and GMP relevance. Second is sterile injectable and combination-device manufacturing, where West Chester and Blue Ash align with prefilled syringes, cartridges, device assembly, and now Lilly''s KwikPen expansion. Third is cell-therapy manufacturing, where Philadelphia gives Resilience a place in autologous and allogeneic workflows. Taken together, those services position the company inside attractive but operationally demanding segments of the market rather than the whole CDMO category.'
