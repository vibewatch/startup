- id: FM004
  title: Adoption funnel / value-chain map
  type: flow
  layout: standard
  summary: Flow diagram showing how sponsors move from program need to commercial supply and where Resilience's offerings participate.
  data:
    nodes:
    - id: n1
      label: Program need identified
      detail: Sponsor reaches clinical or commercial inflection and lacks the right in-house manufacturing or regulatory capacity.
    - id: n2
      label: Process / analytical development
      detail: CDMO helps define manufacturable process, assays, and comparability strategy.
    - id: n3
      label: Regulatory and cGMP preparation
      detail: Quality systems and CMC work determine whether the sponsor can move into clinical or commercial supply.
    - id: n4
      label: Clinical or commercial manufacture
      detail: Biologics DS, cell therapy, or sterile DP capacity becomes the core purchased service.
    - id: n5
      label: Device assembly / packaging / scale reliability
      detail: For high-volume injectables, downstream device and packaging steps become critical constraints.
    - id: n6
      label: Long-term partner retention
      detail: Sponsors prefer to avoid later tech transfer if quality, geography, and economics stay attractive.
    - id: n7
      label: 'Bottleneck: capacity access + policy + funding'
      detail: Validation lead times, BIOSECURE/reshoring shifts, and biotech funding weakness shape timing and utilization.
