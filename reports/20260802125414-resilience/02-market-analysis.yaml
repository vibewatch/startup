  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: A company-specific SAM, SOM, bookings mix, and site-level revenue by modality for Resilience.
    whyItMatters: Public market estimates are too broad to show how much of the opportunity Resilience can realistically capture.
    diligencePath: Request management's internal market segmentation deck and current pipeline split by biologics, drug product, and cell therapy.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: buyer-budget-owners
    missingEvidence: Public documents describe buyer needs qualitatively but do not quantify exact budget owners or procurement cycles by segment.
    whyItMatters: Buying authority affects sales-cycle length and margin durability.
    diligencePath: Interview current customers or request a sales-cycle analysis by segment and stage.
    relatedQuestionRefs:
    - QM022
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: utilization
    missingEvidence: Current post-restructuring utilization rates for Ohio, Toronto, and Philadelphia are not publicly disclosed.
    whyItMatters: Underutilized capacity is one of the main adverse signals in this market, especially for advanced therapies.
    diligencePath: Request utilization, backlog, and line-level capacity by site.
    relatedQuestionRefs:
    - QM019
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: minor
    topic: mixed-market-lenses
    missingEvidence: A single audited market source harmonizing global CDMO, biologics CDMO, and advanced-therapy subsets.
    whyItMatters: The public record uses overlapping but not identical categories, which limits precision in top-down sizing.
    diligencePath: Use paid market-intelligence subscriptions or banker materials to harmonize category definitions.
    relatedQuestionRefs:
    - QM005
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: customer-concentration-by-market-pool
    missingEvidence: Public sources do not show how much of Resilience's demand comes from Lilly versus other buyer pools.
    whyItMatters: A company can look well positioned in the market yet still be overexposed to one customer or one modality.
    diligencePath: Request the top-10 customer and top-10 program concentration report by revenue and booked capacity.
    relatedQuestionRefs:
    - QM021
    - QM025
