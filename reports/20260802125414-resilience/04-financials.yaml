- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Annual revenue and backlog
    - Prevents meaningful valuation-multiple or revenue-quality analysis
    - Request audited or NDA revenue and backlog summary by site and modality
  - - Gross margin and EBITDA by site
    - Blocks view on whether the reset created a healthy operating core
    - Request site-level P&L or contribution margin bridge
  - - Cash on hand, burn, and runway
    - Prevents assessment of capital adequacy independent of announced financings
    - Request cash waterfall, budget, and 12-month runway model
  - - Debt covenants and interest burden
    - Prevents understanding of downside triggers and lender control rights
    - Request OHA term sheet and covenant package
  - - Top-customer concentration
    - Prevents assessment of revenue durability and downside from Lilly dependence
    - Request top-10 customer / program concentration report
  notes: These are the core blockers that keep the chapter from producing a high-confidence underwriting verdict.
