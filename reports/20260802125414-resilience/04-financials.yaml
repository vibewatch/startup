company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 4
  title: Financials
  summary: 'Resilience has the capital structure of an infrastructure-heavy private manufacturer rather than a light operating startup. Public evidence shows an early equity buildout (launch capital above $800 million, a previously undisclosed $600 million Series C, and a $625 million Series D), government-backed financing through a $410 million DoD/DFC facility, a strategic Mubadala investment with undisclosed economics, a reported $250 million bridge during the 2025 restructuring, and up to $825 million of secured Oak Hill Advisors financing. At the same time, public company-style financial disclosure is missing: there is no verified revenue, backlog, gross margin, cash balance, burn rate, or covenant detail. The business clearly has real assets—Ohio downstream scale, 100M+ vial/PFS annual capability, 250+ fill-finish batches, 150+ GMP cell-therapy batches since 2023, and a major Lilly expansion—but the underwriting gap remains whether those assets now convert into durable, debt-supporting
    earnings.'
sections:
- id: revenue-model-and-mix
  title: Revenue model, mix, and recognition logic
  body: 'Resilience is best understood financially as a manufacturing-services company with several tiers of revenue, not as a single-product biotech. Public materials show four monetization buckets: biologics drug-substance work, sterile drug-product and device-adjacent manufacturing, cell-therapy development/GMP supply, and project-based partnership work. The Lilly relationship is the clearest commercial anchor because it references very large downstream volume, Ohio employment, and device-oriented expansion. By contrast, BridgeBio, CARGO, and Parvus imply smaller, development-stage or program-specific revenue streams that may be higher margin per batch but less predictable in timing and scale.


    The public record does not disclose revenue, backlog, price per batch, or gross margin, so the mix can only be inferred. Still, the economic logic is visible: Ohio likely drives the most mature commercial manufacturing revenue, while Toronto and Philadelphia support lower-volume but strategically valuable biologics and cell-therapy programs. Lilly''s 10-K also provides a useful accounting analogue because it describes supply arrangements where revenue is recognized over time as product is manufactured. That does not prove Resilience uses the same treatment, but it highlights why long-duration manufacturing relationships can behave differently from milestone-only biotech collaborations.'
