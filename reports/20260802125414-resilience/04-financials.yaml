- id: operating-proxies-and-unit-economics
  title: Operating proxies and external unit-economics benchmarks
  body: 'Resilience discloses just enough operating data to prove that the core assets are real but not enough to show how profitable they are. The Ohio materials describe nearly 1 million square feet across two regional facilities and roughly 1,000 regional workers. The drug-product page says the business can support more than 100 million vials and prefilled syringes annually and has completed more than 250 fill-finish batches. The cell-therapy page adds 150-plus GMP batches released since 2023. Those figures matter because they confirm meaningful throughput and commercial readiness. They do not, however, reveal utilization, realized price, working-capital drag, or quality-cost burden.


    To anchor economics, public peers help more than Resilience itself. Catalent''s public filing showed 12.2% adjusted EBITDA margin and 10.5% biologics segment EBITDA margin in a scaled operating quarter, while Samsung''s revenue and operating profit illustrate what truly large biologics manufacturing economics can look like. Resilience is almost certainly far below that scale and likely much more sensitive to line utilization. In a business with high fixed costs, reliability helps, but idle suites and underloaded lines can destroy returns quickly.'
