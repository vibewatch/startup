tables:
- id: TV001
  title: Public financing and capital-stack timeline
  columns:
  - Date / event
  - Publicly described capital signal
  - What it does prove
  - What it does not prove
  rows:
  - - Nov 2020 launch
    - Launch and early funding narrative around manufacturing transformation
    - Strong early investor ambition and platform belief
    - Current equity value after restructuring
  - - Aug 2021 / Jun 2022 Series C + D disclosures
    - Large private equity appetite before the reset
    - Expansion-era financing support and network-building confidence
    - Whether those marks still hold post-2025
  - - Mar 2023 DoD/DFC financing
    - Government-linked debt support for domestic capacity
    - Strategic relevance and policy alignment
    - Common-equity valuation
  - - Jan 2023 Mubadala investment
    - External sovereign-linked equity interest plus UAE facility plan
    - Third-party strategic interest in the platform
    - How much value remained after later reset
  - - Oct 2025 Oak Hill package
    - Up to $825M secured debt with large first-lien commitment
    - Lender belief in asset recoverability and go-forward plan
    - Standalone equity mark or low leverage
  - - Jul 2026 Lilly expansion
    - $750M joint investment tied to Ohio manufacturing expansion
    - High strategic customer validation and asset scarcity
    - A clean market-clearing price for all of Resilience
  notes: Each capital event carries different information content; debt, equity, and customer capex should not be treated as interchangeable valuation marks.
