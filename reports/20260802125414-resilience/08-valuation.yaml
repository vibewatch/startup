- id: TV005
  title: What would move valuation materially
  columns:
  - Diligence item
  - Upward read-through
  - Downward read-through
  - Why it matters
  rows:
  - - Top-10 customer revenue mix
    - Multiple scaled accounts beyond Lilly
    - Lilly dominates economics more than expected
    - Directly changes concentration discount
  - - Debt covenants and net debt
    - Headroom and flexible terms
    - Tight covenants or aggressive amortization
    - Determines how much EV reaches equity
  - - Site-level utilization by line
    - Narrowed footprint is actually filling
    - Key lines still underutilized
    - Tests whether reset fixed the core problem
  - - Inspection and audit history
    - Strong quality record with limited CAPAs
    - Recent serious findings or recurring issues
    - Quality risk directly affects strategic premium
  - - Backlog / contracted expansion beyond Lilly
    - Multi-account demand durability
    - Narrative depends mainly on one anchor
    - Separates strategic asset from single-customer story
  notes: These are the five diligence asks most likely to shift valuation more than generic market commentary.
