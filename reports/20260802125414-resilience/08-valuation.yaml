- id: valuation-verdict-and-diligence-path
  title: Valuation verdict and diligence path
  body: 'The best current verdict is that Resilience likely retains substantial enterprise value because scarce sterile manufacturing assets, public-sector support, and the Lilly relationship are all real. But it should not be valued as if the original network thesis worked. The company deserves a meaningful discount to healthy public peers until it proves that the post-reset footprint is sustainably utilized, that quality and inspection performance are strong, and that debt is manageable without heroic assumptions. Investors should resist using total capital raised as a proxy for current value; too much has changed.


    The practical implication is simple: a transaction can still make sense at a meaningful valuation, but the diligence burden is very high. The public record is sufficient to establish that there is a serious asset here. It is not sufficient to establish exactly how much of that asset value belongs to equity holders after debt, customer concentration, and restructuring effects are considered.'
