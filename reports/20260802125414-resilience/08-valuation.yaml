company:
  name: National Resilience, Inc. (Resilience)
chapter:
  number: 8
  title: Valuation
  summary: Resilience is one of the harder valuation cases in this repo because the company is private, highly capital intensive, recently restructured, and financed with a mix of equity, government-linked debt, and large secured private credit. The public record proves strategic importance more clearly than intrinsic value. Lilly’s 2026 expansion, the 2025 Oak Hill financing, the 2023 DoD/DFC loan, and prior equity raises all show that sophisticated counterparties still see meaningful asset value in the narrowed platform. But none of those events cleanly price common equity, and the 2025 six-site closure plus Durham gene-therapy sale argue for a major discount to expansion-era expectations. Public CDMO benchmarks suggest that scaled high-trust biologics and sterile-manufacturing assets can command very large valuations, but Resilience lacks the disclosure quality, diversification, and de-risked operating record needed to claim a peer-level multiple. The most defensible output is therefore
    a wide, low-confidence enterprise-value range rather than a tight equity value estimate.
sections:
- id: valuation-anchors-and-what-they-do-not-prove
  title: Public valuation anchors—and what they do not prove
  body: 'The public evidence around Resilience’s value is mostly indirect. There are several real capital and strategic signals: the 2022 Series D and previously undisclosed Series C, the 2023 DoD/DFC financing, Mubadala’s 2023 equity investment, the 2025 Oak Hill debt package, and the 2026 Lilly expansion. These prove that serious capital providers and counterparties have repeatedly funded or partnered with the business. However, they do not all answer the same question. Equity rounds and equity-linked investments speak to common-equity appetite at the time they were struck. Debt speaks more to lender confidence in recoverability and go-forward operating plans. Strategic manufacturing expansions with a customer such as Lilly prove industrial relevance, but they are not direct marks on Resilience’s standalone equity.


    That distinction is especially important after the 2025 reset. A company can retain high strategic utility while still suffering a large implied equity-value haircut if debt has increased, legacy assets were overbuilt, or investors lost confidence in the original narrative. In Resilience’s case, the six-site closure and Durham exit mean the valuation question must be asked on the post-reset footprint, not on the expansion-era ambition.'
