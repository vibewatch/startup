    - Different asset mix and pre-acquisition market conditions
  - - Emergent BioSolutions
    - ~$0.37B market cap in Aug 2026
    - Illustrates downside for troubled manufacturing platforms
    - Not a direct operational match; partly a distress marker
  - - WuXi Biologics
    - ~$20.2B market cap in Aug 2026
    - Shows how scaled CDMO assets can still retain value amid policy friction
    - Different policy exposure and global footprint
  notes: These are landmarks, not plug-and-play valuation comps.
