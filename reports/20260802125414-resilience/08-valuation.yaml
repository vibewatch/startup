- id: public-comparable-and-market-context
  title: Public comparable and market context
  body: 'Public comp work is informative but inherently messy. The biologics CDMO public market in 2025-2026 no longer priced companies on expansion announcements alone; Alira’s market update emphasizes selective repricing, wider dispersion in forward EV/EBITDA, and a premium for scale, reliability, and visible manufacturing delivery. That framework matters for Resilience because it now resembles an asset-and-execution story more than a narrative-growth story. The most useful public landmarks are not tiny preclinical service firms; they are larger manufacturing-oriented businesses whose valuation reflects trusted delivery capacity.


    Even so, the gap in scale is huge. Thermo Fisher and Lilly are far too large and diversified to be direct comps, but they show what global manufacturing credibility is worth in public markets. Lonza and Samsung Biologics are more relevant directionally because they are manufacturing-centric and still command roughly $48 billion market caps. Catalent’s last known public market cap before its private transition offers a more realistic ceiling for a large drug-product platform, while Emergent illustrates how quickly manufacturing value can collapse when trust or economics break. WuXi Biologics shows that scaled CDMO assets can retain material value even amid policy friction.'
