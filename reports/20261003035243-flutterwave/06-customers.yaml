  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Cohort-level NRR, GRR, logo and revenue churn, renewal rate, contract duration, segment
        revenue, and top-10 customer contribution for at least the last eight quarters.
      whyItMatters: >-
        Transaction activity and named logos cannot establish durable recurring economics or
        whether growth depends on a small number of accounts.
      diligencePath: >-
        Obtain a customer-level quarterly cohort export reconciled to audited revenue, then sample
        contracts, renewals, churned accounts, and expansion events with finance and sales operations.
      relatedQuestionRefs: [QU005, QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        A current, complete named-customer roster with production status, implementation date,
        payment volume, revenue, renewal date, and reference consent.
      whyItMatters: >-
        Public customer pages and technographic listings do not distinguish active production
        relationships from historical, pilot, logo-only, or discontinued accounts.
      diligencePath: >-
        Reconcile CRM and processor records, then confirm a stratified sample directly with named
        enterprise, SMB, fintech, and consumer-product references.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: >-
        Independently verified payment-success, uptime, complaint-resolution, fraud-loss, pricing,
        and satisfaction metrics by market and customer segment.
      whyItMatters: >-
        Volume and API activity do not reveal service quality, customer welfare, or the operational
        friction that could drive churn.
      diligencePath: >-
        Request market-level service dashboards, incident and complaint logs, customer surveys, and
        third-party reference calls, with definitions and denominators preserved.
      relatedQuestionRefs: [QU008, QU009]
