callouts:
  - calloutType: "insight"
    title: "Infrastructure Disintermediation Drives Long-Term Margin Defensibility"
    body: "Flutterwave's acquisition of 34 U.S. Money Transmitter Licenses and a national microfinance bank license in Nigeria directly attacks its largest cost driver: intermediary fees paid to third-party commercial banks and processors. By shifting from a software wrapper to an authorized deposit-holding and settlement entity, Flutterwave captures greater margin across core payment flows."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
  - calloutType: "risk"
    title: "Audited Metric Opacity Hinders Rigorous Valuation Underwriting"
    body: "Despite processing over $50 billion in cumulative transactions and commanding a private valuation of $3.2 billion following Series E funding, Flutterwave does not disclose audited revenue, gross margins, or customer retention metrics. Underwriters must treat public top-line figures as analyst proxies until formal audited statements are made available in diligence."
    claimRefs:
      - "CI007"
      - "CI014"
      - "CI015"
      - "CI016"
