      - number: '6.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 最具代表性的客户落地成效
            body: >-
              PiggyVest 是既有证据库中最具参考价值的公开案例，因为公司发布的案例研究给出了启用年份、客户实名员工、具体支付方式，以及 2021 年至 2022 年超过 53%
              的成效指标。但这仍属于未经审计的供应商单方材料，并非独立的留存衡量指标。
            calloutType: strength
            claimRefs:
