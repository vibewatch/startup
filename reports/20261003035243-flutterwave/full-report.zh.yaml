      - number: '5.3'
        title: 集成体验、安全风控与系统韧性
        blocks:
          - type: paragraph
            body: >-
              在与 Paystack 等区域同行的技术产品比对中，Flutterwave 的差异化优势主要体现在国际货币覆盖面及泛非代付通道广度，而非开发者入驻的便捷性。Paystack 采用 HMAC SHA-512
              加密载荷签名，而 Flutterwave 则使用静态 verif-hash 密钥头进行 webhook
              校验；若日志记录不慎泄露请求头，会带来轻微的安全隐患。此外，平台分账路由存在特定边界问题：若子账户配置的固定扣费金额超过结算总额，Flutterwave
              会将整笔结算资金划转至主账户而非执行部分扣除，这要求商户自行构建防御性对账逻辑。Laravel 及 Odoo 等 ERP 平台的开发者社区工具证实，其 REST v3
              端点稳妥支持标准、订阅及担保交易流程，而第三方智能体工具（如 Composio Rube
              MCP）可自动化触发交易验证。合规层面依托尼日利亚央行支付解决方案服务商（PSSP）监管框架运行，在未获单独许可前禁止钱包资金留存，并严格遵守 PCI-DSS 标准和区域数据隐私规范。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: 图表展示
        blocks:
          - type: callout
            title: Webhook 静态密钥架构要求客户端实现幂等性
            body: >-
              不同于采用 HMAC SHA 载荷哈希签名的现代 webhook 架构（如 Stripe 或 Paystack），Flutterwave 依赖在控制台配置的静态 verif-hash
              请求头。接入方的工程团队必须像对待 API 密钥一样严加保密该令牌，并在数据库中严格实现幂等性与服务端校验，以防范伪造或重放的 webhook 事件。
            calloutType: risk
            claimRefs:
              - CE011
