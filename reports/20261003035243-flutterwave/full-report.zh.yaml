  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 泛非竞争格局与同业客群拆解
        blocks:
          - type: paragraph
            body: >-
              非洲数字支付的竞争格局涵盖五种各异的运营模式：区域 API 优先聚合商、境内转接垄断机构、电信运营商主导的移动钱包体系、国家级零售账单支付网络，以及国际商户网关。Flutterwave
              属于跨境聚合商，依托单一接入点将 33+ 个非洲市场的商户连通至全球银行卡、本地银行账户和移动钱包。历史上其在开发者优先收单领域的主要风投同行竞争对手是 Paystack，后者被 Stripe 以超过 $200
              million 收购，成为 Stripe 在非洲市场的战略支点。与高度聚焦单一市场商户收银的区域网关不同，Flutterwave 将泛非收单与代付、虚拟卡、电商建站以及 Send
              跨境汇款融为一体。为加深企业护城河、应对银行转账优于银行卡的主流替代支付方式，Flutterwave 以全股票方式战略收购了非洲领先的开放银行基础设施提供商 Mono。此项收购使 Flutterwave
              能够将直接账户间支付发起、身份核验及金融数据访问嵌入其商户收银组件。然而，Flutterwave 仍面临根深蒂固的本土传统巨头，例如尼日利亚的 Interswitch、埃及的零售账单支付网络
              Fawry，以及东非由 Safaricom 的 M-Pesa 统治的闭环电信网络。这些传统机构在各自核心辖区享有结构性分发优势，迫使聚合商只能与之对接合作，而无法取而代之。
            claimRefs:
