      - number: '3.3'
        title: 定价经济学、切换成本与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              非洲各支付网关的商业定价结构主要按单笔交易计费，而非固定 SaaS 订阅。Flutterwave 公布的商业条款因商户注册国、货币通道和底层支付方式不同而存在显著差异。在南非，标准本地银行卡收单费率为每笔
              2.9% + ZAR 1，EFT/ACH 转账为 2.5%，国际银行卡处理费为 4.8%，银行代付转账加收 R10 等固定费用。在尼日利亚，境内卡处理标价为 2.0%（由 1.4% 交易处理费和 0.6%
              平台费构成），国际卡则按 4.8% 计费。由于国际银行卡承受约 4.8%
              的高额商户扣率，随着海外支付规模增长，企业的综合变现率快速攀升。跨境汇率加价、增值税以及单笔代付转账费进一步推高了总拥有成本。标准网页收银组件的切换成本相对较低，催生了多接入风险：大型商户倾向于将境内流量分流至成本更低的本地处理商，仅将跨境交易留给
              Flutterwave。因此，Flutterwave 真正的持久护城河不在于银行卡收银独占性，而在于深度集成 ERP 与 CRM 工作流、跨国资金代付以及嵌入式开放银行账户通道所构筑的高切换成本。
