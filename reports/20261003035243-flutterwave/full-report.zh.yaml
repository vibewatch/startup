  - id: TV003
    title: 情景估值分析与回报测算
    columns:
      - 情景
      - 增长与运营假设
      - 隐含估值
      - 概率信号
      - 下行催化因素
    rows:
      - - 乐观情景
        - TPV 规模突破 $75B，RLUSD 稳定币结算通道以 40%+ 利润率变现，2027 年完成双重上市 IPO。
        - $4.5B - $5.5B（基于预计 $350M+ ARR 给予 12-15x 收入倍数）
        - 低至中等（20%）
        - 全球长期维持高利率、尼日利亚汇率剧烈贬值，或公开上市路演推迟。
      - - 基准情景
        - 维持非洲大型企业商户领先地位，费率利润平稳变现，IPO 窗口延至 2027+ 年。
        - $2.5B - $3.2B（按估计 $300M 收入给予 6-8x 收入倍数）
        - 高（55%）
        - 全球金融科技对标公司估值倍数承压，且本土转接清算费率竞争加剧。
      - - 悲观情景
        - 外汇持续大幅波动、核心市场面临监管阻力、利润率遭侵蚀，以及老股市场重新定价。
        - $1.0B - $1.6B（流血融资估值，更接近 Series C/D 轮基准）
        - 中等（25%）
        - 关键支付牌照被吊销、发生严重网络安全事件，或高管治理纠纷久拖不决。
    notes: 各情景估值与概率权重是基于同业金融科技公司（Adyen、Block、PayPal）倍数的分析测算，不代表经审计的预测数据。
