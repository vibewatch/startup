      - number: '1.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 战略定位：从传统支付轨道走向多币种稳定币操作系统
            body: >-
              Flutterwave 从单一的银行卡及移动钱包支付网关演进为综合金融操作系统，成为对冲撒哈拉以南非洲宏观经济波动的战略屏障。2022 年至 2025
              年间尼日利亚奈拉购买力大幅贬值，跨境商户承受着严重的外汇滑点和代理行业务结算延迟。Flutterwave 与 Ripple 达成股权合作并嵌入 RLUSD 稳定币结算，再结合新近取得的 CBN
              银行牌照及对开放银行服务商 Mono 的收购，使公司得以连通传统法币银行网络与即时数字资产流动性，减轻海内外商户的营运资金占用负担。
            calloutType: insight
            claimRefs:
              - CO006
              - CO008
              - CO013
          - type: callout
            title: 治理审查、监管牌照缺口与 IPO 现实考量
            body: >-
              尽管 Flutterwave 保持着非洲支付基础设施的市场领导地位，但仍在应对复杂的监管与运营阻力。2022 年肯尼亚银行账户冻结事件（尽管已于 2023
              年初被完全撤回）暴露出关键的商户合规和反洗钱（AML）监控漏洞，导致肯尼亚等核心区域市场的正式支付服务商牌照仍处于待批状态。此外，公开上市规划已从原定的 Nasdaq
              路演放缓为择期在本土尼日利亚证券交易所（NGX）挂牌，伴随非核心区域分支机构估计约 50% 的人员裁撤，以此压缩运营亏损并展现 GAAP 准则下的盈利能力。
            calloutType: risk
            claimRefs:
              - CO011
              - CO014
              - CO015
