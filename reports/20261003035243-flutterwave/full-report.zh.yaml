      - CV005
      - CV006
      - CV008
      - CV009
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 2016 至 2026 年间 Flutterwave 在企业沿革、融资、产品及监管历程中的关键里程碑。
    data:
      items:
        - label: 公司创立与入选 Y Combinator
          date: 2016-08
          detail: 由 Olugbenga Agboola 和 Iyinoluwa Aboyeji 创立；入选 Y Combinator，专注打造 API 优先的非洲支付网络通道。
          tone: positive
        - label: Series A 轮融资
          date: 2017-07
          detail: 完成由 Green Visor Capital 和 Greycroft 领投的 $19.2M Series A 轮融资，用于扩充开发者 API。
          tone: positive
        - label: Series B 轮融资与全球战略合作
          date: 2020-01
          detail: 获 Greycroft 与 eVentures 联合领投的 $35M Series B 轮融资；与 Visa 及 FIS/Worldpay 签署商业合作协议。
          tone: positive
        - label: Series C 轮融资跨入独角兽行列
          date: 2021-03
          detail: 以 $1B+ 估值完成由 Avenir Growth 和 Tiger Global 领投的 $170M Series C 轮融资，累计处理交易量超过 $9B。
          tone: positive
        - label: Series D 轮融资与 $3B 估值
          date: 2022-02
          detail: 以 $3B 估值完成由 B Capital Group 领投的 $250M Series D 轮融资，使 Flutterwave 跃升为非洲估值最高的科技初创企业。
          tone: positive
        - label: 监管审查与高管不当行为调查
          date: 2022-07
          detail: 肯尼亚资产追回局（ARA）就反洗钱指控冻结其账户资金 $51.9M；虽然相关案件于 2023 年 2 月遭撤销，但合规隐患由此曝光。
          tone: adverse
        - label: 收购 Mono 与稳定币网络通道
          date: 2026-01
          detail: 收购开放银行 API 龙头 Mono，并联手 Turnkey 与 Nuvion 推出商户稳定币钱包解决方案。
          tone: positive
        - label: 获 CBN 银行牌照批准
          date: 2026-04
          detail: 获尼日利亚中央银行颁发银行牌照，获准吸收存款并直接开立银行账户。
          tone: positive
        - label: Series E 轮融资与 Ripple 战略合作
          date: 2026-06
          detail: 在 $250M Series E 轮融资中以 $3.2B 估值完成首期 $123M 交割，Ripple 作为战略股权投资者入局以支持 RLUSD 布局。
          tone: positive
        - label: 全球 CFO 人事任命
          date: 2026-09
          detail: 任命 Morounke Olufemi 为全球 CFO，主抓财务治理、资金纪律与可持续盈利能力。
          tone: positive
    approximationNotes: 日期与交易金额均来自官方企业公告及经核实的财务报道。
