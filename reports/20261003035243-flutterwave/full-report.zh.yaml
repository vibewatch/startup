            body: >-
              管理层由创始人兼 CEO Olugbenga 'GB' Agboola 领导。他曾供职于非洲多家金融机构及 Google，从事银行与工程岗位，2010 年萌生创业构想，并于 2016
              年正式注册成立公司。治理与财务监管架构在 2026 年 9 月迎来重大调整：原欧洲、中东及非洲（EMEA）地区 CFO Morounke Olufemi 接替 Mitesh
              Popat，出任全球首席财务官（CFO）。Olufemi 拥有 24 年银行及企业财务经验，曾任 Access Holdings Plc 集团
              CFO，主导过多项标志性的资本重组、募资及养老金并购交易。公司董事会和顾问网络历史上曾吸纳多位国际支付行业资深人士，包括 Visa 前首席执行官 Joe
              Saunders。尽管高管团队扩充强化了内部制度管控与合规就绪度，但管理层仍高度依赖关键人物 Agboola，同时还需持续应对过往管理争议并妥善处理区域监管关系。
