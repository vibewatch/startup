  - id: FV001
    title: Flutterwave 估值与投资建议决策链
    type: flow
    summary: 递进式分析逻辑：从业务规模出发，贯穿财务不透明与估值倍数承压，最终指向对价格敏感的“观察”建议。
    data:
      nodes:
        - id: scale
          label: 业务规模护城河
          description: 在 34+ 个非洲国家累计处理超 $50B 交易额，交易笔数超 1B+，接入多家 tier-1 银行
          tone: positive
        - id: licensing
          label: 机构支持与业务扩张
          description: 在 $3.2B 估值下获 Ripple 与 Circle 的 Series E 融资支持，并持有尼日利亚银行牌照
          tone: positive
        - id: opacity
          label: 经审计财务不透明
          description: 公开申报文件中完全未披露经审计收入、毛利率或现金消耗数据
          tone: risk
        - id: multiples
          label: 公开市场倍数承压
          description: 全球金融科技对标公司交易倍数降至 4-8x EV/Revenue，令其 $3.2B 私募估值显著承压
          tone: risk
        - id: liquidity
          label: 老股市场抛压
          description: 私募老股交易存在大幅流动性折价，且 IPO 路线图尚未确认
          tone: risk
        - id: recommendation
          label: 投资建议：观察
          description: 暂不追加成长期资金；持续跟进经审计披露与老股定价，等待更具吸引力的入场时机
          tone: neutral
    approximationNotes: 该分析流程归纳了关键投资决策依据；各节点反映基于公开证据与老股市场约束所得出的定性评估。
    claimRefs:
      - CV002
      - CV003
      - CV009
      - CV010
      - CV011
      - CV014
