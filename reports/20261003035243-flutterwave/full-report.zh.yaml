              收取 2.0% 的综合处理费（由 1.4% 基础处理费和 0.6% 平台费组成），境内转账代付单笔加收 N10 至 N50 的小额固定费用。在加纳，GHS 500,000 以内的境内银行卡收单费率为 2.3%，而
              MTN 和 AirtelTigo 的移动钱包处理费为 1.85%，Vodafone 为 2.2%。跨境支付是平台的核心利润引擎，国际卡交易享有高达 4.8%
              的显著溢价，反映出非洲支付通道固有的结构性摩擦、对手方结算成本和外汇兑换风险。除标准处理费外，Flutterwave 还通过企业配套工具、Send App 汇款平台的外汇买卖差价，以及 Flutterwave
