  - id: TV002
    title: 核心投资逻辑与反向逻辑
    columns:
      - 视角
      - 核心论点
      - 证据基础
      - 证伪条件
    rows:
      - - 投资逻辑（乐观）
        - 泛非支付基础设施具有垄断地位，在 34+ 个国家拥有经证实的规模，并有一线战略资本背书。
        - 处理的 TPV 超过 $50B，累计交易达 1B+ 笔，并获得 Ripple 与 Circle 的 Series E 轮战略投资。
        - 失去非洲核心一级银行集成接口，或交易处理增速持续放缓。
      - - 投资逻辑（乐观）
        - 借助央行牌照及原生 RLUSD 稳定币跨境结算通道，拓宽监管与产品护城河。
        - 收购 Mono 后取得 CBN 商业银行牌照，并完成 Send App 稳定币底层架构部署。
        - 稳定币结算遭遇监管限制，或面临不利的央行合规执法行动。
      - - 反向逻辑（悲观）
        - 公司所有公开渠道均未披露经审计的收入、毛利率、EBITDA 或单体经济模型数据。
        - 老股经纪商披露证实其估值依赖预估收入模型，且未提交公开财务申报文件。
        - 发布经核实的 IFRS 或 US GAAP 财务审计报告，证明其具备可持续的经营盈利能力。
      - - 反向逻辑（悲观）
        - Pre-IPO 股权缺乏流动性、锁定期较长，且全球支付可比公司估值倍数普遍承压。
        - UpMarket 上的 Pre-IPO 老股交易数据显示流动性受限，且未见确认的 IPO 招股说明书申报。
        - 正式向主要国际交易所提交 S-1 文件或注册草案，明确可流通退出的时间表。
    notes: 正反投资论点均立足于已核实的 Series E 轮融资公告、UpMarket 老股风险披露及据报道的交易里程碑数据。
