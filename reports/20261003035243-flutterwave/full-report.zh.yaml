              的名义网关标价形成鲜明反差，表明所处理交易量中超过 80% 属于低毛利的企业资金调拨、代理行资金过桥及大宗汇款通道 CM010 CM011。综合考量家庭购买力、35% 至 50%
              的商户数字化渗透率及年交易频次的可变现市场模型测算显示，在核心市场中，对应高毛利网关变现率的实际可变现交易总额上限在 $3.5 billion 至 $4.5 billion 之间 CM009 CM012。
