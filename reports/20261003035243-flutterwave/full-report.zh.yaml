      - number: '4.2'
        title: 成本结构与毛利扩张杠杆
        blocks:
          - type: paragraph
            body: >-
              Flutterwave
              的直接成本结构受制于卡组织费用、向发卡行支付的交换费、移动通信运营商抽成，以及合作银行为开立虚拟账户和清算流动性收取的服务费。历史上，对第三方银行中间商的严重依赖导致各大主要市场的费率承压并带来运营脆弱性。为此，Flutterwave
              实施战略转型，转向自主拥有基础设施与直接获取监管牌照，旨在剔除高成本中间环节并提升营业利润率。关键监管里程碑包括在美国各辖区获得 34
              张资金汇兑牌照，以及取得尼日利亚中央银行颁发的全国性小额信贷银行牌照。尼日利亚小额信贷银行牌照尤具变革意义：它允许 Flutterwave
              留存商户存款并直接清算交易，从而绕开商业银行对虚拟账户和结算通道收取的费用。独立财务评论指出，得益于严格的费用控制与去中介化，截至 2025 年 6 月，月度营业利润率相比 2024
              年平均水平实现翻倍，同时银行转账解决方案的交易量大幅攀升。然而，Flutterwave 仍面临负面成本冲击，包括 2023 年至 2024 年间因未授权转账和 POS 漏洞利用造成的财务损失合计超过 ₦21.2
              billion，以及持续上升的监管合规与反欺诈支出。
