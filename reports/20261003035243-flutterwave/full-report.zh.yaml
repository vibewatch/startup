chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、业务版图与核心基础设施架构
        blocks:
          - type: paragraph
            body: >-
              Flutterwave 是一家跨境支付基础设施服务商，由 Olugbenga Agboola 与 Iyinoluwa Aboyeji 于 2016
              年创立。公司采取双总部架构，法定总部设于美国加利福尼亚州旧金山，主要运营总部设于尼日利亚拉各斯；其支付技术支持企业在 34+ 个非洲国家收付款项。技术架构以统一 API
              和嵌入式收银台为核心，将国际商户及区域企业接入分散的非洲金融网络，支持通过银行卡、银行账户、移动钱包和 USSD 处理 150+ 种货币。商业产品覆盖企业收单（Flutterwave for Business /
              Rave）、个人汇款（Send App）、虚拟卡发卡（Barter）以及无代码商户工具（Flutterwave Store）。2026 年初，Flutterwave 收购开放银行 API 服务商 Mono，并借助
              Turnkey 和 Nuvion 集成推出商户稳定币钱包，进一步深化数字化能力；与此同时，公司积极推进尼日利亚中央银行（CBN）的转接清算与银行牌照布局。
