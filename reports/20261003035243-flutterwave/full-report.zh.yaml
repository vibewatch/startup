  - id: FE001
    title: Flutterwave 技术架构栈
    type: stack
    summary: Flutterwave 支付基础设施分层架构图，涵盖从客户端展示到银行网络通道各层。
    data:
      layers:
        - label: 客户端与集成层
          detail: 托管收银台、Vue.js 仪表盘、移动端 App（Send/Barter）、第三方 SDK（Laravel、Odoo、MCP）
        - label: API 与流量接入网关
          detail: RESTful API v3、限流、JWT/OAuth2 鉴权、静态 verif-hash Webhook 分发
        - label: 核心应用服务层
          detail: Node.js/TypeScript 微服务、支付生命周期引擎、分账路由、合规过滤器
        - label: 事件流与缓存层
          detail: Apache Kafka、RabbitMQ、BullMQ 消息队列、Redis 内存状态与幂等性存储
        - label: 数据持久化层
          detail: MySQL 关系型账本（Sequelize）、MongoDB 文档存储、交易审计日志
        - label: 外部金融网络通道
          detail: NIBSS 与 CBN 清算、泛非移动货币（M-Pesa）、国际卡组织网络（Visa、Mastercard）
    approximationNotes: 架构组件推断自官方招聘说明、技术集成拆解分析以及系统吞吐指标。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE010
      - CE013
      - CE014
  - id: FU001
    title: 客户采纳与扩张路径
    type: journey-map
    summary: 公开证据显示其拥有多条获客与扩张路径，但客户留存率与集中度仍未有明确衡量。
    data:
      nodes:
        - label: 客群准入
          detail: 大型企业、中小微商户、金融科技平台与个人用户分别接入不同产品。
          touchpoints:
            - APIs and enterprise checkout
            - Stores, invoices, and payment links
        - label: 入驻建档
          detail: 客户选用免代码工具或直接集成支付 API。
          touchpoints:
            - Dashboard setup
            - Developer integration
        - label: 支付激活
          detail: 商户接收付款，消费者使用本地与国际支付方式。
          touchpoints:
            - Checkout
            - Pay by Bank Transfer
        - label: 日常运营
          detail: 企业监控支付、转账与对账动态。
          touchpoints:
            - Payment dashboard
            - Customer support
        - label: 业务扩张
          detail: 引入更多支付方式、拓展地域与支持渠道，配合增购及交叉销售，可进一步加深使用。
          touchpoints:
            - Method expansion
            - Regional support
        - label: 韧性检验
          detail: 公开来源未披露留存、续约、队列扩张或集中度指标。
          touchpoints:
            - Renewal
            - Churn and complaints
    approximationNotes: 根据已披露产品与支持界面梳理的概念流程；不代表测算过阶段转化率、步骤完成度或队列留存率。
    claimRefs:
      - CU001
      - CU002
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
