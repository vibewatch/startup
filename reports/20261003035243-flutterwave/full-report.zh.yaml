        title: 融资历程、股东结构与企业发展轨迹
        blocks:
          - type: paragraph
            body: >-
              Flutterwave 经历多轮股权融资，累计募资超过 $500 million：从 2016 年入选 Y Combinator 孵化营起步，先后完成 Series A 轮（2017 年，$20
              million）、Series B 轮（2020 年，$35 million）、Series C 轮（2021 年，$170 million，以 $1 billion+ 独角兽估值完成），以及由 B
              Capital Group 领投的 Series D 轮（2022 年，$250 million，估值 $3 billion）。2026 年年中，Flutterwave 在目标规模 $250 million 的
              Series E 轮融资中完成首期 $123 million 资金交割，投后估值 $3.2 billion，并引入区块链支付公司 Ripple 作为战略股权合作伙伴，推进 RLUSD
              稳定币集成。尽管市场传闻有主权资金注资，Flutterwave 已公开澄清，并未敲定任何来自尼日利亚联邦政府的 $75 million 投资。与此同时，公开上市策略已从近期赴 Nasdaq
