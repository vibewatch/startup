          - type: callout
            title: 公开数据不足以支撑客户持久性研判
            body: 留存来源均未披露 NRR、GRR、客户流失率、续约率、合同期限、分部收入或头部客户集中度。在将广泛的客户覆盖视作持久的经常性商业价值之前，投资尽调必须调取分群及账户层面的具体数据。
            calloutType: risk
            claimRefs:
