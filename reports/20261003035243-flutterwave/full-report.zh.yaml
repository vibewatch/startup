  - id: TP003
    title: 定价与商业模式对比：区域网关与非洲本地通道
    columns:
      - 支付方式 / 业务走廊
      - Flutterwave 公开定价
      - 市场基准 / 竞品模式
      - 底层成本动因 / 费率机制
      - 对大客户企业的商业影响
    rows:
      - - 尼日利亚本地银行卡
        - 2.0%（1.4% 处理费 + 0.6% 平台费）
        - Paystack：1.5% + NGN 100（封顶 NGN 2,000）
        - 刷卡手续费、本地卡组织网络费、本地银行转接清算费
        - 大交易量本地商户通常同时接入多家渠道以摊薄处理费
      - - 南非本地银行卡
        - 每笔交易 2.9% + ZAR 1.00
        - 南非本地网关：2.7% - 3.2% + 固定费用
        - 刷卡手续费、本地卡组织网络评估费、本地收单加成
        - 费率与本地网关相当；企业无需在南非单独签署本地合同
      - - 南非银行转账（EFT/ACH）
        - 每笔交易 2.5%
        - 即时 EFT 服务商：1.5% - 2.0% 封顶
        - 开放银行 / 账户对账户（A2A）处理成本
        - 比银行卡交易失败率更低的替代支付方式
      - - 国际卡（跨境）
        - 每笔交易 4.8%
        - Paystack / 全球网关：3.9% - 4.5% + 外汇差价
        - 跨境交换费、卡组织跨境费、货币兑换风险
        - 显著推高跨境 SaaS 及在线旅游平台的综合商家扣率（MDR）
      - - Mobile Money（M-Pesa、MTN、Airtel）
        - 因国家走廊而异（通常为 1.5% - 3.0%）
        - 电信运营商直连：1.0% - 2.0% + 运营商接入成本
        - 电信运营商网络费、聚合商加价、钱包 API 成本
        - 尽管存在聚合商加价，仍是东非及西非的核心支付通道
      - - 本地银行出款 / 转账
        - 每笔转账固定收费（例如南非为 ZAR 10）
        - 本地银行批量转账：每批次收取固定象征性费用
        - ACH / NIP / 清算交换中心单笔清算规费
        - 对平台电商商户结算及零工薪酬发放具备高性价比
