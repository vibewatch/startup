  - id: "TV002"
    title: "Core Investment Thesis and Anti-Thesis"
    columns:
      - "Perspective"
      - "Core Argument"
      - "Evidence Foundation"
      - "Falsification Trigger"
    rows:
      - - "Thesis (Bull)"
        - "Pan-African payments infrastructure monopoly with verified scale across 34+ countries and Tier-1 strategic backing."
        - "Over $50B in processed TPV, 1B+ transactions, and Series E strategic financing from Ripple and Circle."
        - "Loss of core African tier-one bank integrations or sustained deceleration in transaction processing growth."
      - - "Thesis (Bull)"
        - "Regulatory and product moat expanded via central banking license and native RLUSD stablecoin cross-border settlement rails."
        - "CBN commercial banking license secured post-Mono acquisition and Send App stablecoin architecture deployment."
        - "Regulatory restrictions on stablecoin settlement or adverse central bank compliance enforcement actions."
      - - "Anti-Thesis (Bear)"
        - "Complete absence of audited revenue, gross margins, EBITDA, or unit economic data across public corporate channels."
        - "Secondary broker disclosures confirming reliance on estimated revenue models and absence of public financial filings."
        - "Release of verified IFRS or US GAAP financial audits demonstrating sustainable operating profitability."
      - - "Anti-Thesis (Bear)"
        - "Pre-IPO share illiquidity, extended lockup windows, and multiple compression across global payments comparables."
        - "UpMarket pre-IPO secondary data indicating restricted liquidity and absence of confirmed IPO prospectus filing."
        - "Official filing of S-1 or draft registration with major international exchange confirming liquid exit timeline."
    notes: "Thesis and anti-thesis points anchored on verified Series E funding announcements, UpMarket secondary risk disclosures, and reported transaction milestones."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV007"
      - "CV010"
      - "CV013"

  - id: "TV003"
    title: "Scenario Valuation Analysis and Return Outcomes"
    columns:
      - "Scenario"
      - "Growth & Operating Assumptions"
      - "Implied Valuation"
      - "Probability Signal"
      - "Downside Catalysts"
    rows:
      - - "Bull Case"
        - "TPV scales above $75B, RLUSD stablecoin corridors monetize at 40%+ margins, successful dual-listing IPO in 2027."
        - "$4.5B - $5.5B (12-15x revenue multiple on projected $350M+ ARR)"
        - "Low to Moderate (20%)"
        - "Prolonged high global interest rates, adverse Nigerian FX devaluation, or delayed public listing roadshow."
      - - "Base Case"
        - "Maintains African enterprise merchant leadership, gradual fee margin monetization, IPO window deferred to 2027+."
        - "$2.5B - $3.2B (6-8x revenue multiple on estimated $300M revenue)"
        - "High (55%)"
        - "Multiple compression across global fintech comparables and increased domestic interchange competition."
      - - "Bear Case"
        - "Persistent FX volatility, regulatory headwinds in key markets, margin erosion, and secondary market repricing."
        - "$1.0B - $1.6B (down-round valuation closer to Series C/D baseline)"
        - "Moderate (25%)"
        - "Revocation of key payment licenses, severe cybersecurity incident, or protracted executive governance dispute."
    notes: "Scenario valuations and probability weights are analytical estimates based on peer fintech multiples (Adyen, Block, PayPal) and do not represent audited projections."
    claimRefs:
