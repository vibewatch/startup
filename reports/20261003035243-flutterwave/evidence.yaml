evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited annual financial statements disclosing GAAP revenue, net revenue, gross margin, operating expenses,
      EBITDA, and cash runway.
    whyItMatters: >-
      Without audited financial disclosures, valuation multiples and long-term capital sustainability cannot be
      independently calculated.
    diligencePath: Request confidential audited financial statements or pre-IPO disclosure pack from management under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete disclosure of subsidiary managing directors, executive committee composition, and independent board
      directors below the executive suite.
    whyItMatters: >-
      Organizational bench strength and formal committee oversight determine governance resilience during regulatory
      reviews.
    diligencePath: Review corporate governance filings, statutory board disclosures, or request an organizational management chart.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Full cap table detailing exact shareholder ownership percentages, liquidation preference seniority, and secondary
      transaction volume.
    whyItMatters: >-
      Preferential economic terms for Series E strategic investors impact common shareholder dilution and net proceeds
      upon exit.
    diligencePath: >-
      Examine cap table registers, investor rights agreements, and audited capitalization exhibits under
      confidentiality.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited financial statements and precise gross margin breakdowns per processing corridor and currency.
    whyItMatters: >-
      Without audited financial disclosures, blended take-rate estimates and segment net margins rely entirely on
      third-party analytical models.
    diligencePath: >-
      Request confidential audited income statements and corridor-level TPV reconciliation during institutional
      diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-discounts
    missingEvidence: Non-public enterprise contract rate cards and volume discount tiers for high-volume cross-border merchants.
    whyItMatters: >-
      Large merchants process at negotiated rates below standard 2.0% - 4.8% list pricing, directly impacting gross take
      rate and net revenue yield.
    diligencePath: Request anonymized cohort billing schedules or enterprise customer rate cards under bilateral diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: audited-market-share
    missingEvidence: >-
      Audited multi-country transaction processing volumes (TPV) comparing Flutterwave directly against Paystack and
      Interswitch across shared African markets.
    whyItMatters: >-
      Prevents independent verification of market share shifts between Flutterwave and Stripe-owned Paystack in key
      jurisdictions like Nigeria and Ghana.
    diligencePath: Analyze Central Bank of Nigeria (CBN) and Bank of Ghana annual switching and payment system statistical bulletins.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited FY2023, FY2024, and FY2025 financial statements (income statement, balance sheet, and cash flow) verified
      by an independent accounting firm.
    whyItMatters: >-
      Without audited financial statements, reported revenue and margin figures remain third-party analyst estimates,
      preventing institutional underwriting.
    diligencePath: Request audited consolidated financial statements and auditor management letters under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular take-rate analysis, gross margin by payment corridor, customer acquisition cost (CAC), and cohort-level
      net revenue retention (NRR).
    whyItMatters: >-
      Prevents independent verification of unit contribution profitability across domestic mobile money versus
      cross-border enterprise processing.
    diligencePath: >-
      Obtain cohort-level revenue retention schedules, processing interchange cost breakdowns, and merchant acquisition
      cost reports.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-audit
    missingEvidence: >-
      Third-party technical audit reports and remediation verification following historical security and fraud
      incidents.
    whyItMatters: >-
      Direct verification of system integrity, database access controls, and anti-fraud monitoring is required to
      validate enterprise platform reliability.
    diligencePath: >-
      Request executive summary of latest SOC 2 Type II audit, PCI-DSS Level 1 compliance attestation, and external
      penetration test reports.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: infrastructure-telemetry
    missingEvidence: >-
      Real-time infrastructure availability telemetry and incident latency statistics across specific African banking
      corridors.
    whyItMatters: >-
      Pan-African payment processing success rates fluctuate significantly based on national switch reliability and
      partner uptime.
    diligencePath: Review historical monthly status page incident logs and corridor-level payment success rate SLA disclosures.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Cohort-level NRR, GRR, logo and revenue churn, renewal rate, contract duration, segment revenue, and top-10
      customer contribution for at least the last eight quarters.
    whyItMatters: >-
      Transaction activity and named logos cannot establish durable recurring economics or whether growth depends on a
      small number of accounts.
    diligencePath: >-
      Obtain a customer-level quarterly cohort export reconciled to audited revenue, then sample contracts, renewals,
      churned accounts, and expansion events with finance and sales operations.
    relatedQuestionRefs:
      - QU005
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A current, complete named-customer roster with production status, implementation date, payment volume, revenue,
      renewal date, and reference consent.
    whyItMatters: >-
      Public customer pages and technographic listings do not distinguish active production relationships from
      historical, pilot, logo-only, or discontinued accounts.
    diligencePath: >-
      Reconcile CRM and processor records, then confirm a stratified sample directly with named enterprise, SMB,
      fintech, and consumer-product references.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Independently verified payment-success, uptime, complaint-resolution, fraud-loss, pricing, and satisfaction
      metrics by market and customer segment.
    whyItMatters: >-
      Volume and API activity do not reveal service quality, customer welfare, or the operational friction that could
      drive churn.
    diligencePath: >-
      Request market-level service dashboards, incident and complaint logs, customer surveys, and third-party reference
      calls, with definitions and denominators preserved.
    relatedQuestionRefs:
      - QU008
      - QU009
  - type: missing-source
    severity: material
    topic: kenya-regulatory-licensing
    missingEvidence: >-
      Official gazette publication or audited confirmation from the Central Bank of Kenya certifying full Payment
      Service Provider authorization and permanent resolution of historical asset freeze inquiries.
    whyItMatters: >-
      Kenya represents Flutterwave's primary East African operational and settlement hub; operating under provisional or
      contested status elevates regulatory disruption and counterparty banking risk.
    diligencePath: >-
      Inspect Central Bank of Kenya public registry of authorized Payment Service Providers, review pending regulatory
      filings with Kenya's Assets Recovery Agency, and request formal compliance clearance certificates from Flutterwave
      counsel.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements under IFRS or US GAAP detailing annual net revenue, gross margins, EBITDA, and net
      cash burn.
    whyItMatters: >-
      Without audited financial disclosures, fundamental valuation multiples cannot be computed, leaving investors
      reliant on unverified transaction volumes and estimated revenue proxies.
    diligencePath: >-
      Request audited financial statements and auditor management letters under non-disclosure agreement during formal
      diligence.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Detailed capitalization table disclosing Series D and Series E liquidation preferences, senior debt covenants, and
      employee option pool dilution.
    whyItMatters: >-
      Senior liquidation preferences from late-stage strategic investors could create significant preference overhang
      for secondary common share buyers in a modest exit scenario.
    diligencePath: Review full capitalization table and certificate of incorporation amendments via corporate secretarial inspection.
    relatedQuestionRefs:
      - QV004
