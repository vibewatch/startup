callouts:
  - calloutType: "risk"
    title: "Webhook Static Secret Architecture Demands Client-Side Idempotency"
    body: "Unlike modern webhook architectures that employ HMAC SHA payload hashing (such as Stripe or Paystack), Flutterwave relies on a dashboard-configured static verif-hash header. Integrating engineering teams must treat this token with the strict confidentiality of an API key and implement rigorous database-level idempotency and server-side verification to protect against spoofed or replayed webhook events."
    claimRefs:
      - "CE011"
