      - number: '3.2'
        title: Product Scope, Technical Depth, and Open Banking Differentiation
        blocks:
          - type: paragraph
            body: >-
              Evaluating Flutterwave against enterprise payments alternatives reveals clear structural trade-offs
              between pan-African breadth and localized specialized depth. Global payment gateways like NMI or Worldpay
              offer sophisticated acquirer-agnostic routing, advanced fraud tooling, and deep omnichannel point-of-sale
              certifications in North American and European markets. However, these international providers lack native
              domestic settlement rails, local banking licenses, and direct integration into African mobile money
              networks like MTN Mobile Money, Airtel Money, and M-Pesa. Conversely, national switching incumbents like
              Interswitch maintain sovereign infrastructure roles in Nigeria but possess limited presence across
              Francophone or East African corridors. Flutterwave's core technological differentiation rests on
              aggregating fragmented payment rails—spanning 150+ currencies and 15+ payment methods—behind a single
              RESTful API suite. By incorporating Mono's open banking capabilities, Flutterwave offers bank-native
              identity verification and direct bank account-to-account transfers, significantly lowering merchant
              dependence on expensive international card rails. Nonetheless, buyer feedback compiled across technical
              RFP evaluations reveals that Flutterwave's multi-country abstraction incurs operational trade-offs:
              merchants encounter friction around compliance verification, occasional delays in edge-case settlement
              reconciliations, and ticket resolution delays during peak volume incidents.
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
