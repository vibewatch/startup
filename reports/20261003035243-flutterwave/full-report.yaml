            claimRefs:
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Expansion loops and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Expansion can occur through additional payment methods, more geographic coverage, API integration, and
              broader customer-service capacity. AVOXI's supplier case study describes Flutterwave moving from an
              enterprise-only model into SMB and consumer/remittance segments, then using centralized voice
              infrastructure across more than 34 countries for support, reactivation, upselling, and cross-selling. That
              is evidence of an operating expansion mechanism, not proof of net revenue retention. None of the retained
              sources supplies NRR, GRR, churn, renewal rates, contract length, segment revenue, or top-customer
              concentration. Recent independent commentary also calls for market-level disclosure of availability,
              payment success, complaints, fraud loss, and pricing. Those omissions prevent a defensible conclusion
              about cohort durability or concentration risk.
            claimRefs:
              - CU011
              - CU012
              - CU015
