      - number: '4.2'
        title: Cost Structure and Margin Expansion Levers
        blocks:
          - type: paragraph
            body: >-
              The direct cost structure of Flutterwave is heavily dictated by payment scheme fees, interchange paid to
              issuing banks, mobile network operator commissions, and partner bank charges for virtual account
              provisioning and liquidity settlement. Historically, heavy reliance on third-party banking intermediaries
              created fee compression and operational vulnerability across major markets. In response, Flutterwave
              executed a strategic shift toward direct infrastructure ownership and regulatory licensing to eliminate
              costly middlemen and expand operating margins. Key regulatory milestones include securing 34 Money
              Transmitter Licenses across United States jurisdictions and obtaining a national microfinance banking
              license from the Central Bank of Nigeria. The Nigerian microfinance banking charter is particularly
              transformative: by allowing Flutterwave to hold merchant deposits and clear transactions directly, the
              company bypasses commercial bank fees for virtual accounts and settlement rails. Independent financial
              commentary indicates that disciplined overhead containment and disintermediation allowed monthly operating
              margins to double by June 2025 compared to the 2024 average, while transaction volume for bank transfer
              solutions surged. Nevertheless, Flutterwave remains exposed to adverse cost drivers, including historical
              financial losses from unauthorized transfers and POS exploitation totaling over ₦21.2 billion across 2023
              and 2024, alongside escalating regulatory compliance and fraud mitigation expenses.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
