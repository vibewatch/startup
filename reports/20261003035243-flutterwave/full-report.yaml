        title: Exhibits
        blocks:
          - type: callout
            title: Strongest customer outcome
            body: >-
              PiggyVest is the best public reference in the assigned pool because the company-issued case study supplies
              an adoption year, a named customer employee, a specific payment method, and a greater-than-53% 2021-2022
              outcome. It remains unaudited supplier evidence rather than an independent retention measure.
            calloutType: strength
            claimRefs:
