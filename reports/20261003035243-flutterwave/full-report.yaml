  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Flutterwave generates the vast majority of its revenue by capturing transaction fees, interchange margins,
              and payout surcharges across pan-African and global corridors. In its primary operating markets, the
              company employs a tiered fee schedule that bifurcates domestic collections from international and
              cross-border flows. For domestic card transactions and local bank transfers in Nigeria, Flutterwave
              charges an aggregate processing fee of 2.0% (comprising a 1.4% base processing fee and a 0.6% platform
              charge), alongside nominal flat payouts ranging from N10 to N50 for domestic transfers. In Ghana, domestic
              card acceptance is billed at 2.3% up to GHS 500,000, while mobile money processing commands 1.85% for MTN
              and AirtelTigo, and 2.2% for Vodafone. Cross-border payments represent the core profit engine of the
              platform, commanding a significant pricing premium of up to 4.8% on international card transactions. This
              premium reflects the structural friction, counterparty settlement overhead, and foreign exchange
              conversion risks inherent in African payment corridors. In addition to standard processing fees,
              Flutterwave monetizes ancillary enterprise tooling, foreign exchange spreads on its Send App remittance
              platform, and e-commerce transactions through Flutterwave Store. However, official pricing tables
              represent list rates rather than realized net take rates, which are subject to confidential volume
              discounts for enterprise anchor clients such as Uber and Microsoft.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
