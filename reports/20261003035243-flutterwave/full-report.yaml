      - number: '2.2'
        title: Market Sizing Lenses and the Volume Monetization Reality
        blocks:
          - type: paragraph
            body: >-
              Evaluating the African payment infrastructure market requires distinguishing nominal gross transaction
              throughput from economically monetizable fee pools CM008 CM009. Third-party industry analyses observe that
              while Flutterwave processed $31 billion to $34 billion in reported total payment volume in 2024, its
              generated revenue of $95.3 million implied an effective blended take rate of only 0.28% to 0.31% CM009
              CM010. This stands in sharp contrast to nominal gateway rack pricing of 2.9% for domestic transactions and
              3.8% for cross-border transactions, indicating that over 80% of processed volume represents low-margin
              enterprise treasury movement, correspondent banking throughput, and wholesale remittance corridors CM010
              CM011. Economic addressable market models that factor in household purchasing power, merchant digital
              adoption rates of 35% to 50%, and annual transaction frequency indicate an effective monetizable gross
              volume ceiling of $3.5 billion to $4.5 billion for high-margin gateway take rates in core markets CM009
              CM012.
