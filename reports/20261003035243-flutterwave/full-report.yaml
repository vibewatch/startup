              - CE010
              - CE013
              - CE014
      - number: '5.3'
        title: Integration Experience, Security Controls, and Operational Resilience
        blocks:
          - type: paragraph
            body: >-
              In technical product evaluations against regional peers such as Paystack, Flutterwave differentiates
              primarily on international currency reach and pan-African payout rail breadth rather than developer
              onboarding simplicity. While Paystack utilizes HMAC SHA-512 cryptographic payload signing, Flutterwave
              implements a static verif-hash secret header for webhook verification, presenting minor security hygiene
              risks if logging practices inadvertently expose headers. Furthermore, marketplace split payment routing
              exhibits specific edge-case behavior: if a sub-account is configured for a flat fee deduction that exceeds
              the gross settlement amount, Flutterwave routes the entire settlement to the main account rather than
              executing a partial deduction, requiring merchants to build defensive reconciliation logic. Developer
              community tooling across Laravel and ERP platforms like Odoo confirms robust REST v3 endpoint coverage for
              standard, recurring, and escrow flows, while third-party agent skills (such as Composio Rube MCP) automate
              transaction verification triggers. Regulatory compliance operates within the Central Bank of Nigeria
              Payment Solution Service Provider (PSSP) framework, precluding wallet fund-holding without distinct
              licenses and demanding strict adherence to PCI-DSS standards and regional data privacy policies.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Webhook Static Secret Architecture Demands Client-Side Idempotency
            body: >-
              Unlike modern webhook architectures that employ HMAC SHA payload hashing (such as Stripe or Paystack),
              Flutterwave relies on a dashboard-configured static verif-hash header. Integrating engineering teams must
              treat this token with the strict confidentiality of an API key and implement rigorous database-level
              idempotency and server-side verification to protect against spoofed or replayed webhook events.
            calloutType: risk
            claimRefs:
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying segments
        blocks:
          - type: paragraph
            body: >-
              Flutterwave serves a two-sided set of users: businesses accept, route, monitor, and reconcile payments,
              while individuals pay, shop, buy tickets, or send money. The official product surface ranges from API-led
              enterprise checkout and transfers to no-code stores, invoices, and payment links for smaller merchants.
              Historical company material also names Uber, Wakanow, Booking.com, and Flywire, but naming a company does
              not establish current production volume, contract duration, or revenue contribution. A third-party
              technographic database broadens the apparent footprint to smaller professional-services and hospitality
              users, yet its entries are vendor-database records rather than customer-confirmed references. The
              resulting segmentation is credible at the use-case level but not measurable by active accounts or segment
              revenue.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
          - type: table
