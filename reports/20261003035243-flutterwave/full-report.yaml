      - number: '6.3'
        title: Named deployments, outcomes, and reference quality
        blocks:
          - type: paragraph
            body: >-
              PiggyVest is the strongest named proof in the assigned evidence: Flutterwave's December 2023 case study
              identifies a 2019 adoption and attributes a greater-than-53% increase in savings and investments between
              2021 and 2022 to use of Pay by Bank Transfer alongside other factors. The article includes a named
              customer employee quotation, although Flutterwave remains the issuer and the metric is not independently
              audited. Other named accounts have materially thinner proof. Company pages identify major brands, while
              Apps Run The World records several smaller website implementations; neither source discloses current
              volumes, renewal status, or economic outcomes for those accounts. Public logos and implementation records
              therefore support adoption breadth more strongly than durability.
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
