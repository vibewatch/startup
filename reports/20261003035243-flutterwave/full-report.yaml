      - number: '1.3'
        title: Capitalization History, Stakeholder Map, and Corporate Trajectory
        blocks:
          - type: paragraph
            body: >-
              Flutterwave has raised cumulative capital in excess of $500 million across multiple equity rounds,
              progressing from Y Combinator's accelerator program in 2016 through Series A ($20 million in 2017), Series
              B ($35 million in 2020), Series C ($170 million in 2021 at a $1 billion+ unicorn valuation), and Series D
              ($250 million in 2022 at a $3 billion valuation led by B Capital Group). In mid-2026, Flutterwave closed a
              first tranche of $123 million toward a targeted $250 million Series E round at a $3.2 billion post-money
              valuation, bringing in blockchain payments firm Ripple as a strategic equity partner to accelerate RLUSD
              stablecoin integration. Despite rumors regarding sovereign capital commitments, Flutterwave publicly
              clarified that no $75 million investment from Nigeria's Federal Government had been finalized.
              Concurrently, public listing strategies have shifted from a near-term Nasdaq debut toward a potential
              listing on the Nigerian Exchange (NGX) in Lagos, as the company emphasizes operational profitability,
              restructuring in non-core regional hubs, and resolution of lingering regulatory licensing hurdles across
              East and Southern Africa.
