            title: Durability cannot be underwritten from public data
            body: >-
              No retained source reports NRR, GRR, churn, renewals, contract duration, segment revenue, or top-customer
              concentration. Investment diligence should require cohort and account-level data before treating customer
              breadth as durable recurring economics.
