      - number: '6.2'
        title: Adoption trajectory and operating scale
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows a rising sequence of company-reported scale indicators, but the measures are
              not a single comparable cohort. Flutterwave reported 290,000 merchants, 500,000 registered Barter users,
              and more than 140 million transactions worth over $9 billion in March 2021. Its current website displays
              more than 20 million API calls per day and an average of more than 500,000 payments daily. A 2025
              independent marketing article repeats broader claims of more than one million supported businesses and
              more than 200 million transactions worth over $16 billion, without exposing the underlying dataset. These
              figures indicate platform reach and throughput, not retained merchants, recurring revenue, or transaction
              success rates.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
