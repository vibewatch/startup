figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Key evolutionary milestones in Flutterwave's corporate, funding, product, and regulatory history from 2016 to
      2026.
    data:
      items:
        - label: Company Founding & Y Combinator
          date: 2016-08
          detail: >-
            Founded by Olugbenga Agboola and Iyinoluwa Aboyeji; accepted into Y Combinator to build API-first African
            payment rails.
          tone: positive
        - label: Series A Financing
          date: 2017-07
          detail: Closed $19.2M Series A round led by Green Visor Capital and Greycroft to expand developer APIs.
          tone: positive
        - label: Series B & Global Strategic Partnerships
          date: 2020-01
          detail: >-
            Raised $35M Series B co-led by Greycroft and eVentures; signed commercial partnership agreements with Visa
            and FIS/Worldpay.
          tone: positive
        - label: Series C Unicorn Milestone
          date: 2021-03
          detail: >-
            Secured $170M Series C led by Avenir Growth and Tiger Global at a $1B+ valuation, processing over $9B in
            cumulative volume.
          tone: positive
        - label: Series D & $3B Valuation
          date: 2022-02
          detail: >-
            Closed $250M Series D led by B Capital Group at a $3B valuation, making Flutterwave Africa's most valuable
            tech startup.
          tone: positive
        - label: Regulatory & Executive Misconduct Scrutiny
          date: 2022-07
          detail: >-
            Kenyan Assets Recovery Agency froze $51.9M in accounts over AML allegations; cases dismissed in Feb 2023,
            but exposed compliance scrutiny.
          tone: adverse
        - label: Mono Acquisition & Stablecoin Rails
          date: 2026-01
          detail: >-
            Acquired open-banking API leader Mono and introduced merchant stablecoin wallet solutions via Turnkey and
            Nuvion partnerships.
          tone: positive
        - label: CBN Banking License Approval
          date: 2026-04
          detail: >-
            Granted banking license by the Central Bank of Nigeria, allowing deposit-taking and direct banking account
            origination.
          tone: positive
        - label: Series E Investment & Ripple Partnership
          date: 2026-06
          detail: >-
            Closed $123M initial tranche of $250M Series E at a $3.2B valuation with Ripple joining as a strategic
            equity investor for RLUSD.
          tone: positive
        - label: Global CFO Executive Transition
          date: 2026-09
          detail: >-
            Appointed Morounke Olufemi as Global CFO to spearhead financial governance, capital discipline, and
            sustainable profitability.
          tone: positive
    approximationNotes: Dates and transaction values derived from official corporate announcements and verified financial reporting.
    claimRefs:
