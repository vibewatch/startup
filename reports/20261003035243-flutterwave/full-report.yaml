  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Customer Workflow Architecture
        blocks:
          - type: paragraph
            body: >-
              Flutterwave structures its product delivery around dual operating surfaces tailored to corporate merchants
              and individual consumers. For enterprises and regional businesses, the primary interface is Flutterwave
              for Business (formerly Rave), accessible via dashboard and RESTful APIs, which orchestrates payment
              collection across 150 currencies and diverse payment modes including debit and credit cards, bank
              accounts, mobile money wallets (such as M-Pesa), bank transfers, and USSD. Merchant workflows initiate
              checkout sessions server-side to generate authorized payment links, hosted checkout modals, or embedded
              direct API calls. On the consumer and individual front, Flutterwave offers Send (for remittances) and
              consumer payment tools alongside Barter, an application that pioneered virtual US dollar card issuance
              funded in local currencies for international subscriptions and peer-to-peer transfers. These combined
              surfaces enable domestic checkout, marketplace transaction splitting across sub-accounts, and automated
              multi-currency cross-border payouts.
            claimRefs:
