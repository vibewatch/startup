      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Management Bench
        blocks:
          - type: paragraph
            body: >-
              Executive leadership is led by Founder and Chief Executive Officer Olugbenga 'GB' Agboola, who conceived
              the company in 2010 and incorporated it in 2016 following professional banking and engineering roles at
              several African financial institutions and Google. Governance and financial oversight experienced a
              material structural transition in September 2026, when Morounke Olufemi, previously CFO for Europe, the
              Middle East, and Africa (EMEA), succeeded Mitesh Popat as Global Chief Financial Officer. Olufemi brought
              24 years of banking and corporate finance experience, including serving as Group CFO at Access Holdings
              Plc where she led landmark recapitalization, capital raising, and pension M&A transactions. The company's
              board of directors and advisory network historically incorporated international payments veterans,
              including former Visa Chief Executive Officer Joe Saunders. While executive additions have strengthened
              institutional controls and compliance readiness, management remains subject to significant key-person
              reliance on Agboola, alongside ongoing requirements to navigate historical management controversies and
              regional regulatory relationships.
