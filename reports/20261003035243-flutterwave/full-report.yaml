  - id: TV002
    title: Core Investment Thesis and Anti-Thesis
    columns:
      - Perspective
      - Core Argument
      - Evidence Foundation
      - Falsification Trigger
    rows:
      - - Thesis (Bull)
        - >-
          Pan-African payments infrastructure monopoly with verified scale across 34+ countries and Tier-1 strategic
          backing.
        - Over $50B in processed TPV, 1B+ transactions, and Series E strategic financing from Ripple and Circle.
        - Loss of core African tier-one bank integrations or sustained deceleration in transaction processing growth.
      - - Thesis (Bull)
        - >-
          Regulatory and product moat expanded via central banking license and native RLUSD stablecoin cross-border
          settlement rails.
        - CBN commercial banking license secured post-Mono acquisition and Send App stablecoin architecture deployment.
        - Regulatory restrictions on stablecoin settlement or adverse central bank compliance enforcement actions.
      - - Anti-Thesis (Bear)
        - >-
          Complete absence of audited revenue, gross margins, EBITDA, or unit economic data across public corporate
          channels.
        - >-
          Secondary broker disclosures confirming reliance on estimated revenue models and absence of public financial
          filings.
        - Release of verified IFRS or US GAAP financial audits demonstrating sustainable operating profitability.
      - - Anti-Thesis (Bear)
        - >-
          Pre-IPO share illiquidity, extended lockup windows, and multiple compression across global payments
          comparables.
        - >-
          UpMarket pre-IPO secondary data indicating restricted liquidity and absence of confirmed IPO prospectus
          filing.
        - >-
          Official filing of S-1 or draft registration with major international exchange confirming liquid exit
          timeline.
    notes: >-
      Thesis and anti-thesis points anchored on verified Series E funding announcements, UpMarket secondary risk
      disclosures, and reported transaction milestones.
