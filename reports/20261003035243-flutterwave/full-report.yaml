        title: Exhibits
        blocks:
          - type: callout
            title: Open Banking Infrastructure as a Defensive Moat
            body: >-
              Flutterwave's acquisition of Mono represents a strategic defensive maneuver against card-fee compression
              and telco mobile money dominance. In markets where card penetration is low and bank transfers or mobile
              wallets dominate consumer adoption, owning the account-to-account verification and payment rail enables
              Flutterwave to capture direct transaction flow, reduce merchant processing costs, and improve onboarding
              KYC reliability.
            calloutType: insight
            claimRefs:
              - CP004
              - CP007
              - CP008
          - type: callout
            title: Multi-Homing and Take-Rate Pressure in Enterprise Accounts
            body: >-
              Enterprise merchants operating across Africa face negligible technical switching costs between online
              checkout widgets. Because Flutterwave's international card MDR reaches 4.8% and local card fees face
              competition from domestic gateways and direct bank rails, high-volume merchants frequently adopt
              multi-homing routing strategies to minimize fee drag, capping Flutterwave's pricing power.
            calloutType: risk
            claimRefs:
