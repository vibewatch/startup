      - number: '3.3'
        title: Pricing Economics, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial pricing structures across African payment gateways are predominantly pay-as-you-go
              per-transaction fee models rather than fixed SaaS subscriptions. Flutterwave's published commercial terms
              demonstrate substantial variance depending on the merchant origin country, currency corridor, and
              underlying payment method. In South Africa, standard local card acquiring fees are set at 2.9% + ZAR 1 per
              transaction, EFT/ACH transfers at 2.5%, and international card processing at 4.8%, with bank payout
              transfers carrying fixed fees such as R10. In Nigeria, domestic card processing is listed at 2.0%
              (comprising a 1.4% transaction processing component and a 0.6% platform fee), while international cards
              are billed at 4.8%. Because international cards carry high merchant discount rates of approximately 4.8%,
              an enterprise's blended take rate rises rapidly as foreign payment volume increases. Cross-border FX
              markups, value-added taxes, and per-payout transfer fees further increase total cost of ownership.
              Switching costs for standard web checkout widgets remain modest, creating multi-homing risks where large
              merchants route domestic traffic to lower-cost local processors while reserving Flutterwave for
              cross-border flows. Flutterwave's durable moat therefore relies not on card checkout exclusivity, but on
              high switching costs in integrated ERP and CRM workflows, multi-country treasury payouts, and embedded
              open banking account rails.
            claimRefs:
              - CP001
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
