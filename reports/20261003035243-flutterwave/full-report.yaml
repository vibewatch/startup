chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Footprint, and Core Infrastructure Model
        blocks:
          - type: paragraph
            body: >-
              Flutterwave is a cross-border payments infrastructure provider founded in 2016 by Olugbenga Agboola and
              Iyinoluwa Aboyeji. Operating under a dual geographic structure with corporate headquarters in San
              Francisco, California, and primary operational headquarters in Lagos, Nigeria, the company provides
              payment technology enabling businesses to accept and disburse funds across 34+ African countries. Its
              technical architecture centers on unified APIs and drop-in checkouts connecting international merchants
              and regional enterprises to fragmented African financial networks, supporting 150+ currencies via cards,
              bank accounts, mobile money, and USSD. Commercial offerings span enterprise acquiring (Flutterwave for
              Business / Rave), consumer money transfer (Send App), virtual card issuance (Barter), and no-code merchant
              tools (Flutterwave Store). In early 2026, Flutterwave deepened its digital capabilities through the
              acquisition of open-banking API provider Mono and the launch of merchant stablecoin wallets via Turnkey
              and Nuvion integrations, progressing alongside Central Bank of Nigeria (CBN) switching and banking
              licenses.
            claimRefs:
              - CO001
