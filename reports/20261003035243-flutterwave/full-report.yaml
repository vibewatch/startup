  - id: TV003
    title: Scenario Valuation Analysis and Return Outcomes
    columns:
      - Scenario
      - Growth & Operating Assumptions
      - Implied Valuation
      - Probability Signal
      - Downside Catalysts
    rows:
      - - Bull Case
        - >-
          TPV scales above $75B, RLUSD stablecoin corridors monetize at 40%+ margins, successful dual-listing IPO in
          2027.
        - $4.5B - $5.5B (12-15x revenue multiple on projected $350M+ ARR)
        - Low to Moderate (20%)
        - Prolonged high global interest rates, adverse Nigerian FX devaluation, or delayed public listing roadshow.
      - - Base Case
        - >-
          Maintains African enterprise merchant leadership, gradual fee margin monetization, IPO window deferred to
          2027+.
        - $2.5B - $3.2B (6-8x revenue multiple on estimated $300M revenue)
        - High (55%)
        - Multiple compression across global fintech comparables and increased domestic interchange competition.
      - - Bear Case
        - Persistent FX volatility, regulatory headwinds in key markets, margin erosion, and secondary market repricing.
        - $1.0B - $1.6B (down-round valuation closer to Series C/D baseline)
        - Moderate (25%)
        - Revocation of key payment licenses, severe cybersecurity incident, or protracted executive governance dispute.
    notes: >-
      Scenario valuations and probability weights are analytical estimates based on peer fintech multiples (Adyen,
      Block, PayPal) and do not represent audited projections.
