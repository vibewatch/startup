              rails, regional mid-market platforms requiring multi-currency collection APIs, and local small merchants
              utilizing mobile wallets and hosted storefronts CM002 CM005. The addressable market boundary is tightly
              circumscribed by regional digital infrastructure and regulatory licensing requirements across central
              banks CM006 CM007.
