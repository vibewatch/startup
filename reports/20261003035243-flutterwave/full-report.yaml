        title: Market Boundary, Addressable Spend, and Segment Definitions
        blocks:
          - type: paragraph
            body: >-
              Flutterwave defines its primary market opportunity around digital payment infrastructure, domestic gateway
              processing, cross-border business collections, and mobile wallet enablement across Sub-Saharan Africa and
              adjacent global corridors CM001 CM002. The addressable payment volume comprises commercial transactions
              conducted via mobile money, card networks, virtual accounts, and real-time bank transfers, but explicitly
              excludes informal cash-based physical transactions and closed-loop non-monetizable intra-bank settlements
