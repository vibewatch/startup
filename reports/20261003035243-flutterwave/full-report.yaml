      - number: '4.3'
        title: Capital Adequacy and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Flutterwave has raised substantial private growth capital across multiple rounds, including a $170 million
              Series C in March 2021 and a $250 million Series D in February 2022 that initially established its $3
              billion valuation. In June 2026, the company closed its Series E funding round with a strategic investment
              from Ripple, lifting its private valuation to $3.2 billion and bringing cumulative equity financing to
              over $500 million. The Ripple partnership integrates USD-backed stablecoin RLUSD rails across the XRP
              Ledger, aiming to reduce capital-intensive correspondent banking dependencies and lower cross-border
              liquidity costs. In secondary markets, shares continue to trade among accredited investors via private
              platforms including UpMarket and EquityZen. Public traction metrics are substantial, with cumulative
              processed payment volume surpassing $50 billion across more than 1 billion transactions. However, from an
              underwriting perspective, private metric opacity remains a decisive blocker: Flutterwave does not publish
              audited income statements, balance sheets, customer acquisition costs, or dollar-based net retention
              rates. Furthermore, analyst-reported top-line growth to $95.3 million in 2024 represents third-party
              estimates rather than audited filings. Direct balance sheet diligence and confirmation of audited gross
              margins are mandatory prerequisites for public market valuation underwriting.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure Disintermediation Drives Long-Term Margin Defensibility
            body: >-
              Flutterwave's acquisition of 34 U.S. Money Transmitter Licenses and a national microfinance bank license
              in Nigeria directly attacks its largest cost driver: intermediary fees paid to third-party commercial
              banks and processors. By shifting from a software wrapper to an authorized deposit-holding and settlement
              entity, Flutterwave captures greater margin across core payment flows.
            calloutType: insight
            claimRefs:
