callouts:
- calloutType: risk
  title: Regulatory Account Freezes and Jurisdictional Contagion
  body: Historical enforcement actions in Kenya, where over $40 million was frozen in 2022 under anti-money laundering statutes,
    demonstrate the catastrophic liquidity and reputational consequences of regulatory scrutiny in emerging payment corridors.
    While Flutterwave denied wrongdoing and regularly engages oversight agencies, failure to secure unencumbered central bank
    licensing across expansion jurisdictions creates an acute operational vulnerability.
  claimRefs:
  - CR001
  - CR002
- calloutType: insight
  title: Settlement Delay Dynamics and Merchant Operating Friction
  body: Compliance friction and transaction reviews represent underappreciated total-cost-of-ownership drivers for Flutterwave
    merchants. In addition to headline card processing fees reaching 4.8% for cross-border transactions, automated risk holds
    and merchant verification protocols can delay payout cycles, forcing enterprise users to absorb working capital drag or
    expand dedicated finance staffing.
  claimRefs:
  - CR004
  - CR006
