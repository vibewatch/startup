callouts:
  - calloutType: "insight"
    title: "The Monetization Dilemma of African Payment Volume"
    body: "Flutterwave's $31 billion to $34 billion in reported annual transaction volume positions it as a market leader in throughput, but its 0.28% to 0.31% blended take rate reveals that top-line GMV is heavily diluted by low-margin wholesale corporate and remittance flows CM009 CM010. Expanding into higher-margin data services through open banking and direct banking licenses is a structural necessity to elevate revenue density CM007 CM014."
    claimRefs:
      - "CM007"
      - "CM009"
      - "CM010"
      - "CM014"
  - calloutType: "risk"
    title: "Regulatory Fragmentation and Compliance Overhead"
    body: "Operating across 34 countries exposes Flutterwave to substantial regulatory variance and currency risk, where regulatory actions like the 2022 Kenyan asset freeze demonstrate the operational fragility of cross-border infrastructure providers navigating sovereign monetary controls CM007 CM015."
    claimRefs:
      - "CM007"
      - "CM015"
