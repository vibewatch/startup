company:
  name: Antares Nuclear
chapter:
  number: 1
  title: Company Overview
  summary: Antares Nuclear is a Los Angeles-based nuclear startup developing compact microreactors for defense and remote-power use. Assigned evidence shows a rapid progression from a 2023 founding and government-backed development path to Mark-0 criticality in June 2026 and a $470 million Series C financing, while commercial operating performance, full leadership coverage, and the precise value of its orderbook remain undisclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and regulatory posture
    body: >-
      Antares Nuclear is described by the NRC as a Los Angeles, California company developing a
      kilowatt-class microreactor, with pre-application interactions beginning in May 2025. Other
      assigned reporting describes the company as founded in 2023 and focused on factory-built,
      compact reactors for military installations and remote locations. The Mark-0 design is
      described as modular, off-grid, and capable of 100 kW to 1 MW over a four- to six-year
      period, using TRISO fuel in the reported demonstration configuration. These descriptions
      establish product intent and regulatory engagement, not commercial deployment or operating
      economics. The NRC page identifies a regulatory engagement plan and docket, while the
      assigned articles describe DOE and defense-program pathways that may shorten development
      cycles. A proposed NRC framework could make licensing more repeatable, but independent
      sector evidence still identifies permitting, fuel availability, new-build cost, and
      developer-funded pilot expenses as execution dependencies rather than solved problems.
    claimRefs: [CO001, CO002, CO003, CO004, CO015, CO016]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: financing-and-scale
    title: Financing, facilities, and government-linked scale
    body: >-
      The available financing record is substantial but should not be read as revenue or cash
      available. Washington Technology reports a $470 million Series C completed in July 2026,
      consisting of $370 million of equity and $100 million of debt; Nuclear Engineering
      International reports prior Series A and Series B financing and total backing above
      $600 million. The same sources describe a 145,000-square-foot Torrance facility designed
      for up to ten factory-sealed units per year, offices in Idaho Falls and Aiken, and a
      government-facing customer network. Reported program participation includes the DOE
      Reactor Pilot Program, DIU's advanced nuclear supplier cohort, AFRL work, ANPI, and
      Project Janus. The record supports financing and planned manufacturing capacity, but not
      recognized revenue, margin, burn, runway, shipment volume, or the monetary value and
      enforceability of the stated committed orderbook.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence
    title: Milestones, leadership coverage, and unresolved diligence
    body: >-
      Antares has reached a meaningful hardware milestone: assigned reporting says Mark-0
      achieved initial criticality at Idaho National Laboratory on June 4, 2026, after the
      company became the first Reactor Pilot Program participant to reach that milestone and
      after its Documented Safety Analysis was approved. The reported plan is to pursue useful
      electricity from Mark-1 in 2027 and military-base power by 2028, but these are targets,
      not delivered commercial outcomes. Jordan Bramble is identified as CEO and co-founder,
      while the assigned sources do not provide a complete executive roster, board composition,
      ownership structure, or control-rights map. The principal diligence gap is therefore not
      identity but conversion: whether criticality becomes reliable six-plus-year operation,
      licensed deployment, contracted revenue, and repeatable manufacturing. Sector-level
      constraints are adverse context, not evidence of a company-specific failure; the retained
      pool does not establish a company-specific incident, enforcement action, or customer loss.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO016]
    tableRefs: []
    figureRefs: []
