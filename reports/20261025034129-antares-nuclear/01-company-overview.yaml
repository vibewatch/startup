callouts:
  - calloutType: strength
    title: Hardware milestone achieved
    body: "Initial criticality at Idaho National Laboratory is a material de-risking milestone relative to a pre-demonstration concept, although it does not establish useful electricity production or commercial reliability."
    claimRefs: [CO010, CO011]
  - calloutType: risk
    title: Financing is not operating traction
    body: "The reported $470M Series C includes $100M of debt, and the assigned sources do not disclose revenue, burn, runway, valuation, or the enforceable value of the committed orderbook."
    claimRefs: [CO005, CO007]
  - calloutType: assumption
    title: Government pathway remains execution-dependent
    body: "DOE, NRC, and defense-program participation creates an unusually visible development pathway, but deployment still depends on licensing, fuel, contract, manufacturing, and multi-year reliability evidence."
    claimRefs: [CO001, CO003, CO009, CO012, CO015, CO016]
