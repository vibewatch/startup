    title: Pricing, sales motion, and unit-economics availability
    columns: [Metric or lever, Public evidence, Value, Confidence, Diligence ask]
    rows:
      - [Reactor list price, "No assigned source reports a price per unit", null, "Unavailable", "Request price book, configuration assumptions, and customer-specific discounts"]
      - [Energy or service price, "Sources describe power delivery but no tariff or service fee", null, "Unavailable", "Request contracted $/kWh or fixed availability fee and escalation terms"]
      - [Sales cycle and procurement, "DOE, Army, Air Force, and SBIR pathways are described", "Government-led; duration not quantified", "Medium for channel, low for timing", "Obtain procurement stage, site approvals, award dates, and conversion probabilities"]
      - ["CAC, payback, and gross margin", "No assigned source discloses these metrics", null, "Unavailable", "Obtain unit cost, deployment cost, fuel/service cost, realized price, and cohort payback"]
    notes: "Official program participation demonstrates a route to customers but does not establish commercial pricing, customer acquisition cost, payback, utilization, or margin. Unavailable cells require diligence rather than zero imputation."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Capital, cost structure, and liquidity evidence
    columns: [Item, Public value/status, What it supports, What it does not support, Diligence ask]
    rows:
      - [Series C financing, "$470M; $370M equity and $100M debt", "Funding capacity for Mark-1 and planned deployments", "Cash on hand, unrestricted liquidity, valuation, or runway", "Obtain financing documents, closing conditions, cash balance, and debt schedule"]
      - [SBIR portfolio, "$3,913,600 total awarded; 100 employees listed on the SBIR profile", "Government-funded development and a disclosed staffing datapoint", "Current headcount, burn, payroll cost, or commercial scale", "Reconcile current headcount and monthly operating expense"]
      - [Direct-to-Phase-II award, "$1,217,133 for Nuclear Systems for High Power Space Applications", "Restricted R&D support and space-adaptation work", "Unrestricted working capital or product revenue", "Map award reimbursement, cost share, and follow-on probability"]
      - [Major cost drivers, "Engineering, fuel, testing, licensing, facilities, manufacturing, and deployment are implicated by the sources", "Areas requiring a project cost model", "Actual unit cost, gross margin, working capital, and capex amount", "Request bottom-up BOM, schedule, capex plan, contingency, and vendor terms"]
    notes: "Financing and award amounts are capital sources with different restrictions and obligations. They are not interchangeable with revenue, cash available, or cash burn; the cost-driver row is an evidence-backed diligence map, not a quantified estimate."
    claimRefs: [CI009, CI010, CI011, CI012]
