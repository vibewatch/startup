company:
  name: Antares Nuclear
chapter:
  number: 4
  title: Financials
  summary: Antares has public evidence of substantial defense-backed development funding and a near-term path from reactor criticality to electricity production, but no public revenue, realized pricing, margin, burn, runway, or project-level cash disclosure was found in the assigned evidence. The underwriting case therefore depends on converting grants, equity, debt, and government programs into repeatable commercial deployments.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: Antares appears to be pursuing a project-based nuclear hardware and power-delivery model rather than a software subscription model. The assigned evidence describes a 300kWe unit, possible microgrids, a Mark-1 electricity-producing reactor, and intended military deployments, but it does not disclose a list price, realized customer price, power-purchase tariff, recurring service fee, revenue recognition policy, or recognized revenue. The $1.2 million SBIR award and other government awards are contract or grant funding signals, not evidence of commercial revenue. The company-issued financing announcement says it has secured firm contracts and a committed orderbook, but it provides no contract value, backlog accounting convention, milestone schedule, margin, cancellation, or acceptance terms. Those omissions leave revenue quality and forecastability ununderwritten rather than demonstrably weak.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-sales-and-unit-economics
    title: Pricing, sales motion, and unit economics
    body: >-
      The commercial motion is visibly enterprise and government-led: Antares is working with DOE, Idaho National Laboratory, BWXT, the U.S. Army, and Air Force-oriented programs, while its SBIR portfolio shows competitive government awards for microreactor and space applications. That channel can validate mission need, but public evidence does not establish a standard price per reactor, deployment fee, energy price, service contract, sales cycle, customer acquisition cost, payback, or gross margin. The described design target of more than six years of operation and autonomous deployment is a potential value proposition, not a measured customer-economics outcome. A buyer may value resilience and avoided fuel logistics, yet the assigned sources do not quantify those avoided costs or show a signed commercial unit-economics case.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: >-
      The latest financing evidence supports a large development-capital base but not a cash balance or runway calculation. The July 2026 Series C announcement reports $470 million of equity and debt, split into $370 million of equity and $100 million of debt; the same announcement says the capital is intended to fund Mark-1 electricity production in 2027 and initial defense deployments in 2028. Earlier award evidence shows at least $3.9 million of SBIR awards in the portfolio and a separate $1.217 million Phase II award, but government awards are restricted-purpose program funding and cannot be treated as unrestricted cash. Cost drivers are likely to include reactor engineering, fuel, testing, licensing, facilities, manufacturing, deployment, and long-lived service obligations; the sources do not disclose their amounts, gross margin, debt covenants, interest burden, or working-capital needs. The capital stack therefore lowers near-term financing uncertainty while leaving project economics and refinancing dependence unresolved.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict-and-gaps
    title: Underwriting verdict
    body: >-
      Antares has cleared a meaningful technical milestone and attracted a large financing round, but financial underwriting remains milestone-dependent. The DOE and EIA evidence places Antares inside a federally supported advanced-reactor pilot and military microreactor procurement context; Fox News reports initial criticality and the company's planned electricity milestone, while the financing coverage describes deployment objectives. None of those sources supplies audited financial statements, recognized revenue, cash on hand, burn, runway, backlog dollars, customer concentration, or realized unit costs. The appropriate financial stance is to track rather than underwrite a mature recurring-revenue profile: the upside is a government-anchored path to repeat deployments, while the principal risks are cost overruns, schedule slippage, debt service, regulatory/site delays, fuel or supply-chain constraints, and the possibility that an orderbook does not convert into profitable deliveries.
    claimRefs: [CI013, CI014]
callouts:
  - calloutType: strength
    title: Capital supports the next technical-commercial step
    body: The disclosed $470 million Series C, including $100 million of debt, is explicitly directed toward Mark-1 electricity production and initial defense deployments rather than only early laboratory work.
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Core financial underwriting data is private
    body: No assigned source discloses recognized revenue, realized pricing, gross margin, cash balance, burn, runway, or contract value, so a financing total cannot be converted into a profitability or liquidity conclusion.
    claimRefs: [CI003, CI012, CI014]
