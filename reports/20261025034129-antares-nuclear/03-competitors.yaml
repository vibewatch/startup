      - [BWXT, direct military microreactor peer, "1.5 MW Project Pele prototype; initial testing reported", "U.S. military installations", "Transportable TRISO-fueled design", "Commercial licensing and operating economics not established"]
      - [Radiant Industries, direct portable microreactor peer, "Series C funding brought total venture funding to $160M", "Remote sites, hospitals, military, data centers", "1 MW high-temperature gas-cooled Kaleidos; passive cooldown demonstration", "Full-power, long-duration operation remains future work"]
      - [Westinghouse, incumbent / direct advanced-reactor peer, "eVinci completed DOE FEEED process; AP1000 fleet experience", "Utilities and advanced-reactor deployments", "Established nuclear supply-chain and licensing experience", "Microreactor deployment timing and realized pricing are not disclosed here"]
      - [X-energy, adjacent advanced-reactor peer, "Xe-100 described as 80 MW; projects with Dow and Energy Northwest", "Industrial heat and utility-scale power", "TRISO-X fuel and larger industrial deployments", "Larger scale is not directly comparable to Antares' microreactor use case"]
      - [Oklo, direct / adjacent peer, "Aurora fast-reactor design; selected for military and commercial applications", "Military, data centers, commercial power", "Compact fast-reactor approach and military collaboration", "NRC licensing and operating economics remain unresolved"]
      - [Kairos Power, direct advanced-reactor peer, "Fluoride salt-cooled design in ANPI candidate set", "Military and commercial advanced power", "Alternative coolant and reactor architecture", "No cited commercial operating history"]
      - [Aalo Atomics, DOE pilot peer, "Reached criticality by the July 4 target; full-power test expected in 2027", "Microreactor and multireactor deployments", "Fast pilot execution and stated 2028 commercial deployment ambition", "Production scale and economics are not independently validated"]
      - [Grid plus diesel backup, status quo substitute, "Existing infrastructure rather than a new reactor", "Military installations and remote loads", "Known procurement and operating model", "Vulnerable to grid outages and fuel logistics"]
    notes: "Sources are a mixed snapshot of public milestones and program descriptions from 2025-2026; dollar amounts are funding, not revenue or available cash, and unknown cells are not estimates."
    enumerationScope:
      coverage: partial
      basis: "Publicly described U.S. advanced-reactor peers and the principal military-grid substitute in the assigned 2026 evidence pool."
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP007, CP008, CP010, CP011, CP016]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Antares, Radiant, Westinghouse, X-energy, Oklo, Evidence limitation]
    rows:
      - [Military installation fit, "Selected for Air Force ANPI; JBSA proposal", "Selected / discussed for military applications", "ANPI candidate", "ANPI candidate", "Military and commercial applications", "Program selection is not deployment or contract award"]
      - [Technical milestone, "Mark-0 zero-power fueled criticality on June 4, 2026", "DOME prototype testing planned; passive cooldown demonstrated", "FEEED completed for eVinci", "Fuel and project development milestones", "Aurora design and program participation", "Milestones are not equivalent operating tests"]
      - [Electricity-producing demonstration, "Mark-1 targeted for 2027", "Full-scale, full-power extended-duration test slated", "Not disclosed in assigned sources", "Project generation dates vary by deployment", "Not disclosed in assigned sources", "Future targets are company or program statements"]
      - [Transportability / footprint, "Factory-built, truck-deliverable; proposed system under 50 MW", "Portable 1 MW class", "eVinci microreactor path", "80 MW class Xe-100", "Compact Aurora", "Design details are not consistently comparable"]
      - [Fuel / coolant, "HALEU TRISO; sodium heat-pipe cooled Mark-0", "TRISO; high-temperature gas cooled", "eVinci design details not retained here", "TRISO-X; high-temperature gas cooled", "Metallic fuel fast reactor", "No independent fuel qualification comparison"]
      - [Licensing posture, "Commercial licensing activities planned", "DOE / INL testing pathway", "Established AP1000 licensing experience", "Regulatory path in development", "Commercial NRC path unresolved", "No cited design has full NRC certification for the ANPI class"]
      - [Operating history, "No electricity-producing operating history in pool", "No commercial operating history in pool", "Large-reactor history, not eVinci operating history", "No commercial Xe-100 operating history", "No commercial Aurora operating history", "Absence of evidence is not evidence of absence"]
    notes: "Capability cells retain source-backed milestones only. 'Not disclosed' and 'unresolved' are evidence gaps, not negative performance findings; vendor comparisons are not independent benchmarks."
    claimRefs: [CP003, CP005, CP006, CP007, CP008, CP009, CP011]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Option, Price or contract model, Included capability, Switching or lock-in factor, Buyer implication]
    rows:
      - ["Antares microreactor", "Unknown; government contracts and orderbook described but not priced", "Factory-built nuclear power system plus deployment and operations path", "Licensing, fuel, site approvals, and long operating commitments", "Underwriting requires contract value, delivery obligations, and lifecycle-cost disclosure"]
      - [Radiant Kaleidos, Unknown; $160M venture funding is not customer pricing, Portable 1 MW reactor with factory ambitions, Technical qualification and fuel supply, Compare delivered power and lifecycle service terms]
      - ["Westinghouse advanced reactor", "Unknown in assigned pool", "Reactor design, licensing, and established supplier ecosystem", "Large-project procurement and regulatory process", "Incumbent trust may reduce buyer risk but not prove microreactor economics"]
      - [X-energy Xe-100, Unknown in assigned pool, Larger industrial or utility deployment, Site-scale infrastructure and licensing, Better fit for industrial loads than small-base loads may reduce direct comparability]
      - [Grid plus diesel, Existing utility tariffs and backup procurement; site-specific, Continuous grid supply plus standby generation, Existing assets and fuel logistics, Lowest switching friction but exposed to outage resilience limits]
    notes: "No assigned source provides comparable list prices, realized prices, contract values, or total cost of ownership; all price cells remain unknown except the description of existing tariff and backup procurement."
    claimRefs: [CP010, CP011, CP012, CP013, CP015, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: "Ordinal positioning uses publicly described deployment focus and observable technical or licensing milestones; it is not a market-share or performance score."
    data:
      xAxis: "Deployment focus: commercial / industrial to military / remote"
      yAxis: "Observable maturity: program/design to fueled criticality or operating heritage"
      points:
        - {label: "Antares", x: 4, y: 4, note: "Military focus and 2026 fueled criticality; no electricity-producing operating history in the assigned pool"}
        - {label: "Radiant", x: 4, y: 3, note: "Military and remote applications; prototype and passive-cooldown milestones, future full-power test"}
        - {label: "BWXT / Pele", x: 5, y: 3, note: "Military transportable reactor and initial testing reported"}
        - {label: "Oklo", x: 3, y: 2, note: "Military and commercial applications; design and licensing milestones, no operating history cited"}
        - {label: "Westinghouse", x: 2, y: 3, note: "Incumbent licensing and supply-chain heritage; eVinci operating status not disclosed"}
        - {label: "X-energy", x: 1, y: 2, note: "Industrial and utility focus; larger Xe-100 projects, no commercial operating history cited"}
    approximationNotes: "Coordinates are ordinal analyst placements anchored to the cited program, design, and test milestones; they do not imply a common quantitative scale or rank."
    claimRefs: [CP002, CP005, CP006, CP007, CP008, CP009]
callouts:
  - calloutType: strength
    title: First-mover technical signal
    body: "Antares reached zero-power fueled criticality first among the DOE Reactor Pilot Program participants described in the assigned evidence, improving its schedule credibility without proving commercial operation."
    claimRefs: [CP003, CP004]
  - calloutType: risk
    title: The moat is not yet durable
    body: "Competitors are advancing through criticality, safety-analysis, testing, or industrial partnerships, while fuel supply, licensing, waste, and one-to-20-megawatt economics remain shared constraints."
    claimRefs: [CP009, CP011, CP012, CP013]
