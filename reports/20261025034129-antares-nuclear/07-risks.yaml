callouts:
  - calloutType: risk
    title: Commercial proof remains the decisive risk
    body: The criticality milestone is encouraging, but the public record does not yet establish useful electricity, sustained availability, binding orderbook economics, or a fully resolved licensing and fuel pathway.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR007]
  - calloutType: assumption
    title: Government demand is not risk elimination
    body: Defense relationships may accelerate procurement, but they do not by themselves establish final site authorization, indemnity, fuel security, or economic performance.
    claimRefs: [CR004, CR008, CR011, CR015]
