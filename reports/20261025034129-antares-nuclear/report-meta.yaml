companyProfile:
  summary: >-
    Antares Nuclear is a Los Angeles-area nuclear startup developing compact, factory-produced microreactors for defense
    installations and remote-power applications. The company has reached reported Mark-0 criticality and raised
    substantial government-linked and private financing, while commercial operation, licensing completion, realized
    revenue, and repeatable deployment remain unproven in the assigned public evidence.
