callouts:
  - calloutType: insight
    title: Product thesis
    body: "Antares has made the reactor architecture and development sequence unusually legible for a private nuclear company, but the investment-relevant proof point remains full-power electricity production with qualified thermal, fuel, safety, and manufacturing systems."
    claimRefs: [CE005, CE007, CE008, CE009]
  - calloutType: risk
    title: Main technical risk
    body: "The design combines first-of-a-kind reactor integration with constrained HALEU/TRISO supply, specialized sodium heat pipes, and an incomplete public safety case; schedule slippage in any one dependency can delay the entire deployment workflow."
    claimRefs: [CE010, CE011]
