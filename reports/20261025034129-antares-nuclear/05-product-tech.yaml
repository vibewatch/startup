company:
  name: Antares Nuclear
chapter:
  number: 5
  title: Product & Technology
  summary: Antares is developing a factory-produced, sodium-heat-pipe microreactor with a clearly described component architecture and a staged path from criticality to electricity production. Independent evidence supports Mark-0 criticality and the design-review and supply-chain diligence need, but the public record still leaves the formal safety case and full-power qualification unproven.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      Antares positions the R1 as a modular, transportable power system for defense-critical,
      remote, space, and undersea applications. Its stated output range is 100 kWe to 1 MWe
      with a six-plus-year operating target, so the buyer workflow is not a conventional
      utility sale: a mission owner must select a site, transport and install a packaged
      reactor, connect conditioned power to a local microgrid, and operate it under nuclear
      quality and security controls. The company describes a transport cradle, power
      management and distribution node, and low-maintenance heat-transfer path; these are
      product requirements, not proof of deployed customer performance. The R1 profile from
      Nuclear Scaling Initiative independently describes the same 1 MWe sodium heat-pipe
      concept as intended for defense, critical infrastructure, and remote off-grid power,
      while scoring the design as an early-stage first-of-a-kind demonstration. The product
      therefore has a coherent target workflow, but the measurable customer benefit remains
      a deployment hypothesis until electricity-producing operation and site performance are
      documented.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture and maturity
    body: >-
      The published architecture is unusually specific for an early-stage reactor: graphite
      and boron-carbide control drums with independent actuator motors regulate a prismatic
      graphite core containing TRISO coated-particle fuel; sodium heat pipes provide passive
      high-temperature heat transfer; a fin-and-tube primary heat exchanger feeds a
      recuperated nitrogen Brayton cycle below 300 psi; and a power-management node connects
      the output to local microgrids. Antares also claims in-house nuclear-grade graphite
      machining and hardware-in-the-loop digital twins, which could shorten iteration loops if
      the capabilities are production-qualified. The 2026 public roadmap claims a first
      reactor demonstration at Idaho National Laboratory and qualification of heat pipes, heat
      exchanger, and power-conversion hardware before electricity production in 2027. INL's
      GAIN record provides independent technical context: ORNL was to audit core neutronics
      and thermal-hydraulics calculations before larger hardware demonstrations. The NSI
      profile, however, records no commercial precedent for sodium heat-pipe microreactors,
      no completed nuclear prototype, and only early formal regulatory engagement. That
      undated profile is overtaken on one milestone by Washington Technology's July 2026
      report that Mark-0 achieved criticality on June 4, but criticality does not establish
      full-power electricity production or production-system qualification. The combined
      evidence supports material reactor progress, not a verified full-power maturity claim.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: dependencies-and-controls
    title: Dependencies, quality, and diligence risks
    body: >-
      The critical dependencies are fuel, specialized thermal hardware, qualification, and
      regulatory acceptance. NSI identifies limited HALEU/TRISO commercial scale and a
      specialized sodium heat-pipe supply chain, and it notes that TRISO spent-fuel disposal
      has no licensed precedent. Antares' own updates list multi-year HALEU supply agreements
      and repeated design, safety-analysis, and heat-pipe milestones, but those announcements
      remain company-issued evidence. Public hiring signals show the organization is building
      manufacturing process development, heat-exchanger validation, nuclear quality,
      supplier qualification, embedded hardware-in-the-loop software, and inspection
      capabilities. That breadth is consistent with a hardware company moving from prototype
      toward production, but job postings are not evidence that each process is complete or
      independently audited. The strongest diligence gate is therefore a traceable package of
      test results: nuclear prototype operating data, heat-pipe and power-conversion
      qualification, regulator-approved safety documentation, fuel delivery evidence, and
      production-quality records. The fetched NRC URL resolved to a general NRC homepage, so
      this chapter does not claim an Antares-specific NRC status from it.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: []
  - id: exhibits
    title: Exhibits
    body: >-
      The architecture map is a structured summary of the components and dependencies that
      must work together for the stated product workflow. It does not imply that the layers
      have reached the same maturity or that passive behavior, safety, cost, and reliability
      have been demonstrated at full power. The map should be read alongside the qualification
      gaps: an architecture can be coherent on paper while fuel availability, thermal cycling,
      regulator acceptance, and production traceability remain unresolved. This distinction is
      especially important for a first-of-a-kind nuclear system whose customer value depends on
      safe, repeatable operation at an installed site rather than on a component list alone.
    claimRefs: []
