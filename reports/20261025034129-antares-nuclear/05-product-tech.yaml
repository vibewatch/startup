      - [Sodium heat pipes, "Thermal-management and reactor teams", "Subsystem testing and qualification in progress", "Passive, redundant high-temperature heat transfer", "Long-duration thermal cycling and failure containment"]
      - [Fin-and-tube primary heat exchanger, "Power-conversion and manufacturing teams", "Qualification planned for 2026", "Compact thermal interface", "Thermal, structural, materials, and inspection records"]
      - [Nitrogen Brayton cycle, "Electricity user and balance-of-plant operator", "Planned power-conversion subsystem", "Recuperated closed cycle below 300 psi", "Efficiency, transient, maintenance, and safety data"]
      - [Power management and distribution node, "Site or microgrid operator", "Architecture described; field integration unproven", "Flexible local-microgrid connection", "Grid-interconnection and cybersecurity evidence"]
      - [Antares Prime / in-house graphite machining, "Manufacturing and engineering teams", "Facility and capability claimed by company", "Vertical integration and faster design iteration", "Throughput, yield, quality-system, and cost records"]
    notes: "Company descriptions and independent NSI/INL records are mixed; status labels distinguish design or roadmap claims from independently described maturity."
    claimRefs: [CE001, CE005, CE006, CE010, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Supply resilient power to a defense-critical asset", "Dependence on grid or diesel logistics", "Transportable modular fission power", "Stated 100 kWe-1 MWe output and six-plus-year target", "No public deployed-unit uptime or cost"]
      - ["Power remote or austere infrastructure", "Fuel delivery and generator maintenance", "Factory-built reactor with passive heat transfer", "Reduced maintenance and logistics are design objectives", "Site licensing, security, and fuel logistics remain open"]
      - ["Connect generation to a local microgrid", "Separate generation and distribution equipment", "Power management and distribution node", "Flexible conditioned-power interface is claimed", "Interconnection and control performance unverified"]
      - ["Advance a reactor from design to fueled demonstration", "Sequential analysis and hardware-test campaigns", "CDR, EDU, core audit, and DOE pilot path", "Mark-0 criticality and an independent audit plan are reported", "No public full-power electricity-production data in assigned sources"]
      - ["Scale repeated reactor manufacture", "Project-specific nuclear construction", "Vertical integration and production-oriented tooling", "In-house machining and manufacturing roles support the thesis", "Production rate, yield, and supplier qualification not disclosed"]
    notes: "Benefits are stated targets or workflow hypotheses, not measured customer outcomes; no public contract-level realized performance was retained in this pool."
    claimRefs: [CE001, CE003, CE007, CE009, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Fuel and core, "TRISO particles in prismatic graphite generate heat", "HALEU enrichment and TRISO fabrication", "Supply scale and spent-fuel licensing precedent"]
      - [Reactivity control, "Control drums and independent motors manage reactivity", "Actuator qualification and control software", "Failure modes and demonstrated shutdown behavior"]
      - [Primary heat transport, "Sodium heat pipes passively move heat", "Specialized qualified heat-pipe suppliers", "Long-duration degradation and thermal transients"]
      - [Heat rejection and conversion, "Heat exchanger feeds nitrogen Brayton cycle", "Materials, fabrication, qualification testing", "Power-conversion efficiency and reliability"]
      - [Electrical interface, "Power-management node conditions output", "Microgrid integration and controls", "Field integration, cybersecurity, and protection coordination"]
      - [Manufacturing and verification, "Graphite machining, tooling, inspection, and digital twins", "Quality system, traceability, and supplier network", "Scale-up yield and nuclear-grade records"]
    notes: "Architecture is assembled from the company's component description, INL's independent-analysis record, NSI's technology assessment, and public hiring signals; it is not a verified as-built configuration."
    claimRefs: [CE005, CE006, CE007, CE010, CE012]
