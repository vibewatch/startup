      - ["Air Force Research Laboratory", "National-security space and propulsion", "Nuclear electric propulsion research under NEPADSO", "Research contract", "$4.2M firm-fixed-price R&D contract reported", "Research funding is not proof of a production spacecraft or recurring customer revenue"]
