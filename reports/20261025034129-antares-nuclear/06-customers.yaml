figures:
  - id: FU001
    title: Customer journey from program access to durable deployment
    type: journey-map
    summary: Public evidence supports a staged path from government eligibility to technical demonstration and proposed deployment, with durable operating adoption still unverified.
    data:
      items:
        - {id: "stage-1", label: "Program access", detail: "DIU names Antares among eight ANPI-eligible companies", claimRefs: [CU001, CU002]}
        - {id: "stage-2", label: "Research contracts", detail: "AFRL propulsion R&D and earlier SBIR activity are reported", claimRefs: [CU012]}
        - {id: "stage-3", label: "Technical proof", detail: "Mark-0 reached criticality at INL", claimRefs: [CU008]}
        - {id: "stage-4", label: "Proposed installation", detail: "ANPI and Army programs define military-installation use cases", claimRefs: [CU003, CU005, CU011]}
        - {id: "stage-5", label: "Power delivery", detail: "Mark-1 electricity target is reported for 2027", claimRefs: [CU008]}
        - {id: "stage-6", label: "Durable adoption", detail: "Operating utilization, renewals, and customer outcomes are not disclosed", claimRefs: [CU013, CU014]}
    approximationNotes: "This is an ordered evidence map, not a conversion funnel; stages have different units and are not quantitatively comparable."
    claimRefs: [CU001, CU003, CU008, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: Government demand is unusually legible
    body: "DIU eligibility, Army program design, and the federal 2028 operating mandate provide identifiable procurement pathways rather than only aspirational market language."
    claimRefs: [CU001, CU003, CU005]
  - calloutType: risk
    title: Adoption is ahead of retention proof
    body: "The public record does not establish production deployment, realized customer outcomes, renewal, utilization, or the denominator behind the committed-orderbook language."
    claimRefs: [CU009, CU013, CU014]
