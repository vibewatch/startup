company:
  name: Antares Nuclear
chapter:
  number: 6
  title: Customers
  summary: Antares has identifiable government and government-adjacent demand signals, but the available evidence is primarily program eligibility, contracts, and announced partnerships rather than recurring commercial use or retention. The customer thesis is therefore anchored in defense procurement milestones while leaving production deployment, realized outcomes, concentration, and durability as material diligence gaps.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Antares is pursuing a concentrated institutional customer model rather than a broad
      consumer or utility customer base. The clearest buyer and payer path is the U.S.
      defense ecosystem: DIU, the Army, the Air Force, and related military-installation
      programs can sponsor, procure, regulate, or host microreactors. End users are
      installation operators and mission teams that need resilient power for critical
      loads, while the wider beneficiary is the warfighter. A second, earlier-stage
      segment is national-security space, where Exlabs is designing a spacecraft that
      could accommodate an Antares reactor. These relationships demonstrate access to
      defined use cases, not yet repeat purchases or delivered operating assets. The
      federal policy environment is supportive, but appropriations, licensing, host-site
      selection, and transition decisions still mediate conversion from program access
      into revenue.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU011, CU012]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and deployment trajectory
    body: >-
      The adoption sequence is visible as a chain of technical demonstration, eligibility,
      contracted research, proposed installation, and eventual operations. Antares'
      Mark-0 reached criticality at Idaho National Laboratory, while public reporting
      describes a target for a first electricity-producing Mark-1 in 2027 and military
      deployments from 2028. Those are important milestones, but criticality is not
      commercial electricity delivery, and a proposed or eligible program is not a
      production deployment. DIU's ANPI framework explicitly contemplates design,
      licensing, construction, and operation, and its objective includes serving all
      critical loads; the evidence does not establish that Antares has achieved any of
      those outcomes. The Army's Janus model may improve procurement velocity through
      milestone payments, but commercial ownership and operation also leave execution,
      qualification, and long-term service performance to be proven.
    claimRefs: [CU005, CU006, CU008, CU009, CU011, CU014]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, expansion, and durability
    body: >-
      Named counterparties provide stronger evidence than an undifferentiated logo list.
      DIU names Antares among eight eligible companies, Antares reports government
      relationships spanning the Air Force, Space Force, DIU, and NASA, and Exlabs
      publicly describes a specific spacecraft integration path. The evidence is still
      weighted toward company statements and program announcements: it does not disclose
      delivered reactor units, operating utilization, renewal rates, gross or net
      retention, customer satisfaction, contract duration, realized revenue, or the
      denominator behind the claimed orderbook. DefenseScoop's account of Project Pele
      also shows that a military prototype can remain subject to a later transition
      decision. Antares therefore has a credible land motion into strategic programs,
      but expansion and durability should be underwritten only after signed contract
      schedules, acceptance criteria, payment history, deployment data, and customer
      references are obtained.
    claimRefs: [CU009, CU010, CU012, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
