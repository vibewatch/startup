          unit: "target years"
          valueNote: "Company and government-program timing; not a guaranteed delivery date"
    approximationNotes: "Items are ordered from broad context to company-relevant lens; widths are not proportional and no conversion rate or market share is inferred."
    claimRefs: [CM005, CM006, CM010]
callouts:
  - calloutType: insight
    title: Government-led beachhead, not a proven mass market
    body: Antares has the clearest evidence of demand in defense and national-security programs; commercial adjacency is strategically plausible but not quantified by disclosed orders or revenue.
    claimRefs: [CM002, CM003, CM004]
  - calloutType: risk
    title: Cost and execution remain valuation gates
    body: Policy reform and load growth improve timing, but unsubsidized renewable cost leadership, fuel constraints, licensing uncertainty, and project capital intensity can delay or narrow adoption.
    claimRefs: [CM007, CM008, CM009, CM012]
