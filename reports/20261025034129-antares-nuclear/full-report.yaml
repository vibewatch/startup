  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Antares appears to be pursuing a project-based nuclear hardware and power-delivery model rather than a
              software subscription model. The assigned evidence describes a 300kWe unit, possible microgrids, a Mark-1
              electricity-producing reactor, and intended military deployments, but it does not disclose a list price,
              realized customer price, power-purchase tariff, recurring service fee, revenue recognition policy, or
              recognized revenue. The $1.2 million SBIR award and other government awards are contract or grant funding
              signals, not evidence of commercial revenue. The company-issued financing announcement says it has secured
              firm contracts and a committed orderbook, but it provides no contract value, backlog accounting
              convention, milestone schedule, margin, cancellation, or acceptance terms. Those omissions leave revenue
              quality and forecastability ununderwritten rather than demonstrably weak.
            claimRefs:
