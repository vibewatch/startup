  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Antares positions the R1 as a modular, transportable power system for defense-critical, remote, space, and
              undersea applications. Its stated output range is 100 kWe to 1 MWe with a six-plus-year operating target,
              so the buyer workflow is not a conventional utility sale: a mission owner must select a site, transport
              and install a packaged reactor, connect conditioned power to a local microgrid, and operate it under
              nuclear quality and security controls. The company describes a transport cradle, power management and
              distribution node, and low-maintenance heat-transfer path; these are product requirements, not proof of
              deployed customer performance. The R1 profile from Nuclear Scaling Initiative independently describes the
              same 1 MWe sodium heat-pipe concept as intended for defense, critical infrastructure, and remote off-grid
              power, while scoring the design as an early-stage first-of-a-kind demonstration. The product therefore has
              a coherent target workflow, but the measurable customer benefit remains a deployment hypothesis until
              electricity-producing operation and site performance are documented.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
