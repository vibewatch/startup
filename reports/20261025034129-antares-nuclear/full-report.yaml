        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The comparison below preserves unknowns where the assigned evidence does not disclose list pricing,
              realized customer economics, or a complete peer-by-peer capability test. The positioning figure is an
              evidence-backed ordinal view: it uses milestone and deployment signals from the cited sources, not an
              invented quantitative performance score. This distinction matters because a vendor's criticality date,
              funding total, or program selection is not the same thing as customer revenue, full-power availability, or
              a delivered lifecycle cost. The exhibits therefore separate observed milestones from unresolved commercial
              diligence questions.
            claimRefs:
