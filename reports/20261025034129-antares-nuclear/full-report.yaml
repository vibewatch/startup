              - CE012
      - number: '5.2'
        title: Architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The published architecture is unusually specific for an early-stage reactor: graphite and boron-carbide
              control drums with independent actuator motors regulate a prismatic graphite core containing TRISO
              coated-particle fuel; sodium heat pipes provide passive high-temperature heat transfer; a fin-and-tube
              primary heat exchanger feeds a recuperated nitrogen Brayton cycle below 300 psi; and a power-management
              node connects the output to local microgrids. Antares also claims in-house nuclear-grade graphite
              machining and hardware-in-the-loop digital twins, which could shorten iteration loops if the capabilities
              are production-qualified. The 2026 public roadmap claims a first reactor demonstration at Idaho National
              Laboratory and qualification of heat pipes, heat exchanger, and power-conversion hardware before
              electricity production in 2027. INL's GAIN record provides independent technical context: ORNL was to
              audit core neutronics and thermal-hydraulics calculations before larger hardware demonstrations. The NSI
              profile, however, records no commercial precedent for sodium heat-pipe microreactors, no completed nuclear
              prototype, and only early formal regulatory engagement. That undated profile is overtaken on one milestone
              by Washington Technology's July 2026 report that Mark-0 achieved criticality on June 4, but criticality
              does not establish full-power electricity production or production-system qualification. The combined
              evidence supports material reactor progress, not a verified full-power maturity claim.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
      - number: '5.3'
        title: Dependencies, quality, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              The critical dependencies are fuel, specialized thermal hardware, qualification, and regulatory
              acceptance. NSI identifies limited HALEU/TRISO commercial scale and a specialized sodium heat-pipe supply
              chain, and it notes that TRISO spent-fuel disposal has no licensed precedent. Antares' own updates list
              multi-year HALEU supply agreements and repeated design, safety-analysis, and heat-pipe milestones, but
              those announcements remain company-issued evidence. Public hiring signals show the organization is
              building manufacturing process development, heat-exchanger validation, nuclear quality, supplier
              qualification, embedded hardware-in-the-loop software, and inspection capabilities. That breadth is
              consistent with a hardware company moving from prototype toward production, but job postings are not
              evidence that each process is complete or independently audited. The strongest diligence gate is therefore
              a traceable package of test results: nuclear prototype operating data, heat-pipe and power-conversion
              qualification, regulator-approved safety documentation, fuel delivery evidence, and production-quality
              records. The fetched NRC URL resolved to a general NRC homepage, so this chapter does not claim an
              Antares-specific NRC status from it.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The architecture map is a structured summary of the components and dependencies that must work together
              for the stated product workflow. It does not imply that the layers have reached the same maturity or that
              passive behavior, safety, cost, and reliability have been demonstrated at full power. The map should be
              read alongside the qualification gaps: an architecture can be coherent on paper while fuel availability,
              thermal cycling, regulator acceptance, and production traceability remain unresolved. This distinction is
              especially important for a first-of-a-kind nuclear system whose customer value depends on safe, repeatable
              operation at an installed site rather than on a component list alone.
            claimRefs: []
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product thesis
            body: >-
              Antares has made the reactor architecture and development sequence unusually legible for a private nuclear
              company, but the investment-relevant proof point remains full-power electricity production with qualified
              thermal, fuel, safety, and manufacturing systems.
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE009
          - type: callout
            title: Main technical risk
            body: >-
              The design combines first-of-a-kind reactor integration with constrained HALEU/TRISO supply, specialized
              sodium heat pipes, and an incomplete public safety case; schedule slippage in any one dependency can delay
              the entire deployment workflow.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Antares is pursuing a concentrated institutional customer model rather than a broad consumer or utility
              customer base. The clearest buyer and payer path is the U.S. defense ecosystem: DIU, the Army, the Air
              Force, and related military-installation programs can sponsor, procure, regulate, or host microreactors.
              End users are installation operators and mission teams that need resilient power for critical loads, while
              the wider beneficiary is the warfighter. A second, earlier-stage segment is national-security space, where
              Exlabs is designing a spacecraft that could accommodate an Antares reactor. These relationships
              demonstrate access to defined use cases, not yet repeat purchases or delivered operating assets. The
              federal policy environment is supportive, but appropriations, licensing, host-site selection, and
              transition decisions still mediate conversion from program access into revenue.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU011
      - number: '6.2'
        title: Adoption and deployment trajectory
        blocks:
          - type: paragraph
            body: >-
              The adoption sequence is visible as a chain of technical demonstration, eligibility, contracted research,
              proposed installation, and eventual operations. Antares' Mark-0 reached criticality at Idaho National
              Laboratory, while public reporting describes a target for a first electricity-producing Mark-1 in 2027 and
              military deployments from 2028. Those are important milestones, but criticality is not commercial
              electricity delivery, and a proposed or eligible program is not a production deployment. DIU's ANPI
              framework explicitly contemplates design, licensing, construction, and operation, and its objective
              includes serving all critical loads; the evidence does not establish that Antares has achieved any of
              those outcomes. The Army's Janus model may improve procurement velocity through milestone payments, but
              commercial ownership and operation also leave execution, qualification, and long-term service performance
              to be proven.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
              - CU011
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU011
              - CU012
      - number: '6.3'
        title: Named proof, expansion, and durability
        blocks:
          - type: paragraph
            body: >-
              Named counterparties provide stronger evidence than an undifferentiated logo list. DIU names Antares among
              eight eligible companies, Antares reports government relationships spanning the Air Force, Space Force,
              DIU, and NASA, and Exlabs publicly describes a specific spacecraft integration path. The evidence is still
              weighted toward company statements and program announcements: it does not disclose delivered reactor
              units, operating utilization, renewal rates, gross or net retention, customer satisfaction, contract
              duration, realized revenue, or the denominator behind the claimed orderbook. DefenseScoop's account of
              Project Pele also shows that a military prototype can remain subject to a later transition decision.
              Antares therefore has a credible land motion into strategic programs, but expansion and durability should
              be underwritten only after signed contract schedules, acceptance criteria, payment history, deployment
              data, and customer references are obtained.
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
