      - number: '4.2'
        title: Pricing, sales motion, and unit economics
        blocks:
          - type: paragraph
            body: >-
              The commercial motion is visibly enterprise and government-led: Antares is working with DOE, Idaho
              National Laboratory, BWXT, the U.S. Army, and Air Force-oriented programs, while its SBIR portfolio shows
              competitive government awards for microreactor and space applications. That channel can validate mission
              need, but public evidence does not establish a standard price per reactor, deployment fee, energy price,
              service contract, sales cycle, customer acquisition cost, payback, or gross margin. The described design
              target of more than six years of operation and autonomous deployment is a potential value proposition, not
              a measured customer-economics outcome. A buyer may value resilience and avoided fuel logistics, yet the
              assigned sources do not quantify those avoided costs or show a signed commercial unit-economics case.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
