              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Government demand is unusually legible
            body: >-
              DIU eligibility, Army program design, and the federal 2028 operating mandate provide identifiable
              procurement pathways rather than only aspirational market language.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU005
          - type: callout
            title: Adoption is ahead of retention proof
            body: >-
              The public record does not establish production deployment, realized customer outcomes, renewal,
              utilization, or the denominator behind the committed-orderbook language.
            calloutType: risk
