  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying logic
        blocks:
          - type: paragraph
            body: >-
              This chapter defines the relevant market as factory-built advanced microreactors and small modular
              reactors sold for resilient, off-grid or behind-the-meter power, with adjacent demand from defense
              installations, remote industrial sites, and high-load commercial facilities. It excludes conventional
              gigawatt-scale utility reactors, grid-scale renewables, and nuclear propulsion unless those programs share
              a deployable fission-power buyer and budget. The boundary matters because a broad “nuclear market”
              estimate would combine unlike projects, capacities, regulatory paths, and revenue models. Antares' buyer
              evidence is strongest in government and defense: its reported customer network includes the Air Force,
              Space Force, DIU, and NASA, while the ANPI program targets resilient power at military installations. The
              payer is therefore commonly a public agency or prime contractor, the user is an installation or mission
              operator, and the adoption trigger is resilience or mission capability rather than lowest levelized cost
              alone. Commercial data centers and industrial users are plausible adjacency markets, but the sources do
              not establish their purchase commitments or budget ownership.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses, demand drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence is best treated as multiple lenses rather than one additive TAM. Wood Mackenzie
              forecasts 21% power-demand growth through 2030 in a base case driven largely by AI data-center deployment,
              while EnergyTech cites forecasts of as much as 125 GW of new load over the next decade. Those figures
              describe system load, not microreactor revenue, so they cannot be converted directly into Antares'
              addressable market. A narrower deployment lens is the reported U.S. defense timetable: Antares is
              competing for an installation program targeting operation at an Air Force base by 2030, and its reported
              design range for one installation is 100 kW to 1 MW. The NRC's proposed Part 57 framework could shorten
              licensing and deployment to 6–12 months and allow fleets of identical reactors, but it remains a proposed
              framework in the cited source. Cost competition is also a constraint: Lazard says renewables remain the
              most cost-competitive unsubsidized new-build generation, while Wood Mackenzie highlights fuel
              availability, long lead times, and waste disposal as continuing nuclear obstacles. Antares therefore has a
              credible policy and resilience wedge, but timing and economics remain execution-dependent.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM010
      - number: '2.3'
        title: What the market evidence implies for adoption and valuation
        blocks:
          - type: paragraph
            body: >-
              The investable market is likely to develop through contracted projects, qualification milestones, and
              repeatable manufacturing rather than a software-like recurring-revenue funnel. Antares reports a
              145,000-square- foot facility designed to produce up to 10 units per year, and Washington Technology
              reports a committed orderbook and contracts, but neither source discloses the orderbook's value, backlog
              conversion, customer payment terms, or recognized revenue. Forge reports a July 2026 Series C-1 post-money
              valuation of $2.06 billion and a $320 million Series C round, but its legal notice says the valuation is
              an estimate based on company-submitted certificates of incorporation and is not independently audited.
              That valuation should therefore be read against execution milestones, not against the broad power-demand
              figures. The core adoption constraints are regulatory approval, fuel qualification and availability,
              capital intensity, long project cycles, and proof that a unit can operate reliably for the required
              deployment life. The evidence supports a government-anchored beachhead and substantial adjacency
              optionality; it does not support a precise SOM, unit economics, or market-share forecast.
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate market definition, external sizing lenses, and buyer workflow so that unlike units
              and time bases are not presented as a single funnel. Values retain their reported geography, period, and
              qualification. Null or unknown cells are intentional evidence gaps rather than zeroes. The
              market-definition table distinguishes core defense demand from commercial adjacency, while the sizing
              table keeps demand forecasts, licensing estimates, and generation-cost comparisons in their original
              units. This presentation avoids treating a power-load forecast as a reactor order, or a proposed
              regulatory timeline as a guaranteed deployment date. It also makes clear where Antares-specific evidence
              stops and where diligence must obtain private contract and budget information.
            claimRefs:
              - CM001
              - CM005
              - CM010
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Government-led beachhead, not a proven mass market
            body: >-
              Antares has the clearest evidence of demand in defense and national-security programs; commercial
              adjacency is strategically plausible but not quantified by disclosed orders or revenue.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM004
          - type: callout
            title: Cost and execution remain valuation gates
            body: >-
              Policy reform and load growth improve timing, but unsubsidized renewable cost leadership, fuel
              constraints, licensing uncertainty, and project capital intensity can delay or narrow adoption.
