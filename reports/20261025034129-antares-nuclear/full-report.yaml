      - number: '1.3'
        title: Milestones, leadership coverage, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Antares has reached a meaningful hardware milestone: assigned reporting says Mark-0 achieved initial
              criticality at Idaho National Laboratory on June 4, 2026, after the company became the first Reactor Pilot
              Program participant to reach that milestone and after its Documented Safety Analysis was approved. The
              reported plan is to pursue useful electricity from Mark-1 in 2027 and military-base power by 2028, but
              these are targets, not delivered commercial outcomes. Jordan Bramble is identified as CEO and co-founder,
              while the assigned sources do not provide a complete executive roster, board composition, ownership
              structure, or control-rights map. The principal diligence gap is therefore not identity but conversion:
              whether criticality becomes reliable six-plus-year operation, licensed deployment, contracted revenue, and
              repeatable manufacturing. Sector-level constraints are adverse context, not evidence of a company-specific
              failure; the retained pool does not establish a company-specific incident, enforcement action, or customer
              loss.
