  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              Antares Nuclear is described by the NRC as a Los Angeles, California company developing a kilowatt-class
              microreactor, with pre-application interactions beginning in May 2025. Other assigned reporting describes
              the company as founded in 2023 and focused on factory-built, compact reactors for military installations
              and remote locations. The Mark-0 design is described as modular, off-grid, and capable of 100 kW to 1 MW
              over a four- to six-year period, using TRISO fuel in the reported demonstration configuration. These
              descriptions establish product intent and regulatory engagement, not commercial deployment or operating
              economics. The NRC page identifies a regulatory engagement plan and docket, while the assigned articles
              describe DOE and defense-program pathways that may shorten development cycles. A proposed NRC framework
              could make licensing more repeatable, but independent sector evidence still identifies permitting, fuel
              availability, new-build cost, and developer-funded pilot expenses as execution dependencies rather than
              solved problems.
