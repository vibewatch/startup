  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              Antares has crossed a meaningful physics milestone, but criticality is not the same as useful electricity,
              multi-year operation, or a licensed customer deployment. Company-issued reporting says Mark-0 reached
              criticality at Idaho National Laboratory on June 4, 2026, while the stated path is first electricity in
              2027 and military deployment by 2028. The same reporting describes a committed orderbook and firm
              contracts without disclosing contract values, take-or-pay terms, cancellation rights, or acceptance
              criteria. Independent SMR evidence indicates that schedule and cost overruns are common and that operating
              experience is limited. The kill criterion is a missed electricity-producing milestone or failure to
              demonstrate sustained output, availability, and safety under the proposed deployment conditions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR009
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, liability, and nuclear-security exposure
        blocks:
          - type: paragraph
            body: >-
              Antares's defense framing may create a government customer pathway, but it does not remove nuclear safety,
              security, fuel, or liability obligations. Congressional Research Service describes Price-Anderson as a
              capped compensation system in which current commercial reactor coverage can reach about $16.3 billion per
              incident, with congressional action needed above the cap; the treatment of small modular reactor plants
              can also differ from large reactors. This is not evidence that Antares is covered on identical terms.
              Independent technical criticism highlights possible gaps around containment, emergency planning, physical
              security, and extreme-event behavior, while Science authors warn that broad HALEU adoption creates
              proliferation and terrorism concerns. Diligence must establish the applicable licensing authority,
              indemnity, emergency planning basis, safeguards, and fuel custody chain before treating the 2028 target as
              bankable.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, quality, and supply-chain risk
        blocks:
          - type: paragraph
            body: >-
              The operating model depends on factory production, specialized nuclear-grade quality systems, reliable
              components, fuel availability, and safe long-duration operation at sites that may be remote or
              strategically exposed. Reporting describes factory-production capacity and a design intended to run
              autonomously for years, but those are claims about intended architecture rather than independently
              verified fleet performance. UCS analysis argues that novel SMRs may require decades of operating
              experience before matching the reliability of the existing light-water fleet, and that HALEU-intensive
              designs can consume substantially more natural uranium per unit of output. Antares's cited government
              relationships reduce customer-acquisition risk but increase counterparty, procurement, and schedule
              dependence. Monitoring should include fuel qualification and delivery, supplier nonconformances,
              test-to-production changes, availability, forced outages, and safety reportability.
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Investment implications and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The central risk is not whether Antares can attract capital or reach a single demonstration; it is whether
              it can convert that demonstration into repeatable, licensed, economically competitive power without
              transferring hidden cost and liability to taxpayers or military customers. The current Series C includes
              both equity and debt, so financing runway cannot be inferred from the headline raise without burn,
              drawdown, covenants, and milestone budgets. Independent analyses compare SMRs unfavorably with
              alternatives on cost and schedule, while company-issued materials emphasize customer relationships and a
              committed orderbook. The investment thesis breaks if Antares misses the electricity or deployment dates,
              cannot secure qualified HALEU and waste arrangements, receives materially narrower licensing or indemnity
              treatment than assumed, or cannot publish auditable operating and contract evidence. Until then, track
              rather than underwrite a completed commercialization case.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof remains the decisive risk
            body: >-
              The criticality milestone is encouraging, but the public record does not yet establish useful electricity,
              sustained availability, binding orderbook economics, or a fully resolved licensing and fuel pathway.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: callout
            title: Government demand is not risk elimination
            body: >-
              Defense relationships may accelerate procurement, but they do not by themselves establish final site
              authorization, indemnity, fuel security, or economic performance.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR008
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on a rare sequence of hardware and customer milestones. Independent coverage
              reports that Antares achieved criticality for its Mark-0 reactor at Idaho National Laboratory, raised $470
              million split between $370 million of equity and $100 million of debt, and was selected as a potential
              developer for the Air Force's Advanced Nuclear Power for Installations initiative. The market backdrop is
              also supportive: Axios reports more than $4.5 billion invested in 81 nuclear startups in 2026, while S&P
              Global projects global data-center power demand to nearly double from 2024 to 2030. The anti-thesis is
              that these are financing, demonstration, and policy signals rather than recognized revenue or full-power
              operating economics. Antares' quoted committed orderbook is not independently quantified, and the company
              remains exposed to licensing, manufacturing, schedule, and debt execution risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV019
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest financing evidence supports runway but not a price. Washington Technology reports the Series C
              as $370 million equity plus $100 million debt after a $96 million Series B. Nuclear Engineering
              International separately says Antares is backed by more than $600 million in funding and describes a
              Torrance facility designed for up to 10 factory-sealed units per year. None of the assigned sources states
              Antares' post-money valuation, share price, preference stack, dilution, cash balance, burn, revenue, or
              margin. Those omissions prevent a defensible enterprise-value-to-revenue or project-return calculation.
              Public-market and private-market comparables can set context rather than substitute for company price
              discovery: StockAnalysis reports Oklo at an $8.03 billion market cap on July 14, 2026, while TechCrunch
              reports Valar Atomics was discussing a roughly $6 billion valuation amid staged financing. These are
              different companies, capital structures, and evidence qualities, so they should not be treated as direct
              multiples for Antares.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV019
              - CV020
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              A disciplined underwriting decision should be milestone- and price-sensitive. The bull case requires
              Antares to convert criticality into electricity production, win or execute a military deployment, and
              demonstrate reliable operation at a commercially relevant design while preserving financing capacity. The
              base case assumes continued government-backed development but slower commercialization and additional
              capital needs. The bear case combines licensing or construction delay with unproven unit economics, debt
              pressure, or a nuclear-startup funding shakeout. The regulatory setup may improve: ANS reports that the
              NRC's proposed Part 57 framework would support fleet approvals and could reduce licensing and deployment
              to 6–12 months, but that is a proposed framework, not Antares-specific approval. Lazard says renewables
              remain the most cost-competitive unsubsidized new-build generation, reinforcing the need to prove
              resilience, mission value, or other differentiated customer economics. Before investing, obtain a priced
              financing package, audited or management financials, orderbook contracts, licensing schedule, full-power
              test data, fuel and supply commitments, and customer payment terms.
            claimRefs:
              - CV013
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV017
              - CV018
              - CV022
      - number: '8.4'
        title: Decision and final diligence
        blocks:
          - type: paragraph
            body: >-
              On the assigned evidence, Antares merits tracking rather than buying. The recommendation is not a judgment
              that the technology lacks value; it reflects a missing denominator for valuation and a still-unproven
              transition from government-supported demonstration to repeatable commercial cash generation. A financing
              commitment should be reconsidered only after the company supplies valuation and preference terms,
              reconciles equity and debt proceeds to cash runway, and provides independently checkable deployment
              milestones. The most important thesis-break triggers are a missed operating date without a credible
              recovery plan, failure to convert a potential military selection into a firm paid contract, evidence that
              reactor cost or reliability cannot meet the target use case, or a financing round at materially worse
              terms. Conversely, a transparent priced round, demonstrated electricity production, and customer-backed
              economics would support moving from research-more to a more positive call.
            claimRefs:
              - CV019
              - CV020
              - CV022
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not buy on current evidence
            body: >-
              Antares has unusually strong early hardware and government signals, but the assigned sources do not
              establish a current valuation, operating revenue, or return case.
            calloutType: recommendation
            claimRefs:
              - CV019
              - CV020
              - CV022
          - type: callout
            title: Missing price denominator
            body: >-
              The key valuation blocker is not a lack of financing headlines; it is the absence of post-money price,
              capitalization, preference, runway, and operating-financial disclosure.
            calloutType: risk
            claimRefs:
              - CV007
              - CV011
              - CV020
