      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The latest financing evidence supports a large development-capital base but not a cash balance or runway
              calculation. The July 2026 Series C announcement reports $470 million of equity and debt, split into $370
              million of equity and $100 million of debt; the same announcement says the capital is intended to fund
              Mark-1 electricity production in 2027 and initial defense deployments in 2028. Earlier award evidence
              shows at least $3.9 million of SBIR awards in the portfolio and a separate $1.217 million Phase II award,
              but government awards are restricted-purpose program funding and cannot be treated as unrestricted cash.
              Cost drivers are likely to include reactor engineering, fuel, testing, licensing, facilities,
              manufacturing, deployment, and long-lived service obligations; the sources do not disclose their amounts,
              gross margin, debt covenants, interest burden, or working-capital needs. The capital stack therefore
              lowers near-term financing uncertainty while leaving project economics and refinancing dependence
              unresolved.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Antares has cleared a meaningful technical milestone and attracted a large financing round, but financial
              underwriting remains milestone-dependent. The DOE and EIA evidence places Antares inside a federally
              supported advanced-reactor pilot and military microreactor procurement context; Fox News reports initial
              criticality and the company's planned electricity milestone, while the financing coverage describes
              deployment objectives. None of those sources supplies audited financial statements, recognized revenue,
              cash on hand, burn, runway, backlog dollars, customer concentration, or realized unit costs. The
              appropriate financial stance is to track rather than underwrite a mature recurring-revenue profile: the
              upside is a government-anchored path to repeat deployments, while the principal risks are cost overruns,
              schedule slippage, debt service, regulatory/site delays, fuel or supply-chain constraints, and the
              possibility that an orderbook does not convert into profitable deliveries.
            claimRefs:
              - CI013
              - CI014
