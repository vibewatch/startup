    claimRefs:
      - CV007
      - CV008
      - CV013
      - CV019
      - CV020
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Hardware proof
        - Mark-0 achieved criticality at INL
        - Full-power electricity production with independently checkable performance data
      - - Government demand
        - Antares was selected as a potential ANPI developer and is reported to have military contracts
        - A firm paid deployment contract with disclosed scope and payment terms
      - - Capital access
        - $470M Series C comprised $370M equity and $100M debt
        - A priced round with valuation, dilution, preferences, and runway disclosure
      - - Commercialization risk
        - Microreactor licensing and deployment remain a policy and execution dependency
        - Approved schedule, qualified supply chain, and demonstrated unit economics
    notes: >-
      Rows separate company-reported or quoted milestones from independent context; the change conditions are diligence
      tests, not forecasts.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV013
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Criticality converts to reliable electricity; military deployment proceeds; customer economics validate repeat
          production
        - Potential for a re-rating, but no numeric range is supportable without price and operating data
        - 'Low-to-medium: multiple milestones remain ahead'
        - Missed deployment or failed reliability evidence
      - - Base
        - Government-backed development continues; commercialization takes longer and requires more capital
        - Track until priced terms and cash-generation evidence permit a model
        - 'Medium: best fit to currently disclosed evidence'
        - Debt or dilution rises before commercial revenue
      - - Bear
        - Licensing, construction, supply, or reliability delays coincide with a nuclear-startup funding shakeout
        - Capital impairment risk is high at an undisclosed entry price
        - 'Medium: sector timing and execution uncertainty are material'
        - Down round, contract loss, or inability to fund milestones
      - - Decision threshold
        - Transparent financing, paid contracts, full-power tests, and credible cost data
        - Could support a higher-confidence entry assessment
        - Required evidence rather than a probability estimate
        - Any unresolved price, preference, or runway gap
    notes: >-
      These are qualitative scenarios because the assigned sources do not disclose Antares valuation, revenue, margin,
      burn, or cash balance; no numeric return or valuation range is invented.
    claimRefs:
      - CV013
      - CV017
      - CV018
      - CV022
