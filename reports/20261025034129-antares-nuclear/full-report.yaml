  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Antares R1's stated product stack from fuel and reactivity control through passive heat transport, conversion, and
      microgrid delivery.
    data:
      layers:
        - label: Fuel and core
          detail: The nuclear heat source and moderating structure.
          modules:
            - label: TRISO fuel
              detail: TRISO coated-particle fuel in a prismatic graphite core.
            - label: Graphite moderator
              detail: Graphite core and in-house graphite machining are described by the company.
        - label: Reactivity control
          detail: The control layer for managing reactor reactivity.
          modules:
            - label: Control drums
              detail: Graphite and boron carbide drums with independent actuator motors.
        - label: Passive heat transport
          detail: The sealed thermal path from the core to the conversion system.
          modules:
            - label: Sodium heat pipes
              detail: Redundant, high-temperature, passive heat transfer.
            - label: Primary heat exchanger
              detail: Fin-and-tube heat exchanger; qualification remains a diligence item.
        - label: Power conversion
          detail: The thermal-to-electric conversion subsystem.
          modules:
            - label: Nitrogen Brayton cycle
              detail: Recuperated closed cycle described as operating below 300 psi.
        - label: Site delivery
          detail: The interface between the reactor and the host site.
          modules:
            - label: Power management and distribution
              detail: Conditioned electricity connects to local microgrids.
        - label: Verification and production
          detail: The test, quality, and manufacturing layer needed for deployment.
          modules:
            - label: Digital twins and inspection
              detail: >-
                Hardware-in-the-loop controls, inspection, and nuclear-quality processes are evidenced through company
                capabilities and hiring signals.
    claimRefs:
      - CE005
      - CE006
