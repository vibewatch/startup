  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded field with different deployment niches
        blocks:
          - type: paragraph
            body: >-
              Antares does not compete with one homogeneous peer set. The military microreactor field includes
              transportable and fixed-site designs from BWXT, Oklo, Radiant, Westinghouse, X-energy, Kairos Power,
              General Atomics, and Antares, while the broader DOE pilot field includes Aalo Atomics, Valar Atomics, and
              Deployable Energy. The Air Force program initially evaluated eight vendors, which means Antares must win
              on deployment readiness as well as reactor physics. The competitive set also includes large established
              reactor suppliers and the status quo of grid power plus diesel backup. Antares' Mark-0 reached zero-power
              fueled criticality, but that is an early technical gate rather than proof of useful electricity, operating
              reliability, or economic competitiveness. The next meaningful comparison is therefore not a generic
              technology ranking; it is which supplier can move from a test article to a licensed, fueled, operated
              system at a military site on the required schedule.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Capability, trust, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              The available evidence separates competitors by maturity and application rather than by a single
              performance score. Antares has demonstrated criticality first in the DOE pilot cohort and is targeting a
              Mark-1 electricity-producing test in 2027. Radiant describes a one-megawatt, high-temperature gas-cooled
              design and has reported a passive cooldown demonstration, while Westinghouse brings an established
              large-reactor licensing and supply-chain position but its eVinci microreactor remains a separate
              development path. X-energy offers a larger 80-megawatt class design aimed at industrial and utility-scale
              deployments, not only base resilience. DOE reporting also shows that several peers have advanced through
              safety-analysis or criticality milestones, so Antares' lead can narrow quickly. Trust is consequently tied
              to independently observable test results, regulatory engagement, fuel availability, and operating history.
              No source in this pool establishes commercial pricing for Antares or its peers; price and realized unit
              economics remain unknown rather than a basis for a favorable comparison.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.3'
        title: Switching costs, substitutes, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The buyer's alternative is often not another reactor. Military installations can continue using
              commercial-grid power with diesel generators, while a site can select a different vendor through a
              government program or delay the deployment. The commercially owned ANPI structure shifts reactor
              financing, licensing, construction, operations, and decommissioning responsibility toward vendors, which
              raises the capital and execution burden for every entrant. HALEU supply and the untested economics of
              one-to-20-megawatt systems are shared constraints, not unique Antares advantages. Antares' early
              criticality and focused military relationships may create schedule and learning advantages, but they are
              not yet a durable moat: competitors have their own Air Force, Army, DOE, or industrial partnerships, and
              no cited source demonstrates multi-year commercial operation. The adverse case is that a technically
              successful design still loses if licensing, fuel, community acceptance, waste handling, or cost prevents
              repeatable deployment.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
