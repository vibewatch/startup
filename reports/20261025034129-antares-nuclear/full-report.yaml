            title: The moat is not yet durable
            body: >-
              Competitors are advancing through criticality, safety-analysis, testing, or industrial partnerships, while
              fuel supply, licensing, waste, and one-to-20-megawatt economics remain shared constraints.
            calloutType: risk
            claimRefs:
