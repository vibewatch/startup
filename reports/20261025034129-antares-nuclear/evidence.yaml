evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: finance
    missingEvidence: Recognized revenue, gross margin, cash burn, runway, current valuation, and cap-table or preference-stack terms.
    whyItMatters: Raised capital and debt do not establish operating traction, cash availability, or investor returns.
    diligencePath: >-
      Request audited or management financial statements, latest capitalization table, debt agreements, and
      board-approved operating plan.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: Complete executive roster, board composition, governance rights, succession coverage, and current headcount.
    whyItMatters: >-
      The reported CEO-led narrative does not establish functional coverage or key-person resilience for a
      safety-critical hardware company.
    diligencePath: >-
      Obtain an organization chart, board materials, biographies, ownership schedule, and succession or retention
      arrangements.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: contracts
    missingEvidence: >-
      Signed contract values, milestone schedules, cancellation provisions, and the composition of the reported
      committed orderbook.
    whyItMatters: Government selections and statements of customer relationships may not equal funded, enforceable revenue backlog.
    diligencePath: Review executed contracts, task orders, award notices, options, and customer acceptance criteria under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: deployment
    missingEvidence: >-
      Post-criticality operating results, useful-electricity demonstration, licensing status, fuel supply, and
      reliability data.
    whyItMatters: Initial criticality is distinct from sustained power production and six-plus-year field operation.
    diligencePath: >-
      Request test reports, DSA follow-up records, licensing milestones, fuel qualification evidence, and independently
      witnessed performance data.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: Company-specific litigation, sanctions, recalls, incidents, and adverse customer or regulator findings.
    whyItMatters: >-
      Assigned adverse evidence is sector-level and does not constitute a complete company-specific legal or operational
      check.
    diligencePath: >-
      Run current court, procurement, regulator, sanctions, and incident searches and reconcile them to company
      disclosures.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A primary or independent bottom-up estimate of annual U.S. microreactor procurement by segment, capacity, and
      deployment date.
    whyItMatters: System load forecasts cannot establish Antares' serviceable market, expected unit volume, or market share.
    diligencePath: >-
      Obtain procurement plans, awarded contract values, and installation-level capacity forecasts from defense,
      industrial, and data-center buyers.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-demand-gap
    missingEvidence: Contract-level orderbook value, backlog conversion, payment terms, and customer concentration.
    whyItMatters: A committed orderbook could support demand, but its economic value and conversion risk are not public.
    diligencePath: Review executed contracts, milestones, termination rights, and funded versus contingent backlog under NDA.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Reconciled financing and valuation records across reported rounds and private-market databases.
    whyItMatters: >-
      Forge's estimate is qualified and differs in scope from other reported financing totals, affecting valuation
      interpretation.
    diligencePath: >-
      Reconcile cap-table extracts, round instruments, debt terms, and post-money share counts with the company and lead
      investors.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable delivered-power prices, contract values, lifecycle service fees, and customer economics for Antares and
      peers.
    whyItMatters: >-
      Without realized pricing and cost data, capability comparisons cannot establish a cost advantage or commercial
      moat.
    diligencePath: Obtain executed or redacted customer contracts, total-cost-of-ownership models, and peer bid terms.
    relatedQuestionRefs:
      - QP005
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: operating-history
    missingEvidence: >-
      Independent long-duration electricity-producing test results and operating availability for Antares and direct
      peers.
    whyItMatters: >-
      Zero-power criticality and design milestones do not prove reliable useful power, which is the buyer's core
      switching decision.
    diligencePath: >-
      Request test protocols, uptime data, transient results, and third-party validation from INL or the relevant
      customer.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: licensing
    missingEvidence: >-
      Current NRC licensing status, site approvals, and regulatory milestones for each commercially operated military
      microreactor proposal.
    whyItMatters: The ANPI commercial-operator structure makes licensing a deployment bottleneck shared by the field.
    diligencePath: Review NRC preapplication records, licensing schedules, environmental reviews, and signed site agreements.
    relatedQuestionRefs:
      - QP004
      - QP007
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: Complete international, utility-scale, and non-nuclear substitute enumeration with comparable public data.
    whyItMatters: >-
      The assigned pool supports a U.S.-focused military and advanced-reactor comparison but not a complete global
      landscape.
    diligencePath: >-
      Expand discovery to international SMR vendors, diesel-plus-grid providers, batteries, and long-duration storage
      alternatives.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Audited or management revenue by stream, contract backlog value, revenue-recognition policy, and realized pricing
      for deployed or contracted systems.
    whyItMatters: >-
      Without recognized revenue and contract economics, the financing cannot be translated into growth quality,
      forecastability, or valuation support.
    diligencePath: >-
      Request audited financial statements, revenue ledger by contract, signed orderbook schedule, and customer
      acceptance terms under NDA.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI006
    relatedTableRefs:
