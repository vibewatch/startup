              公开记录支持其是一个真实的区域运营商，并且 B2B 用例正在形成，但不能证明当前股权估值。在确定入场价、目标回报、持有期或退出价值前，应要求经审计的经济数据、核对后的资本化和优先权瀑布、完整 HSBC
