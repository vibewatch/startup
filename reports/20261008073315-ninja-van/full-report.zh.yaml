      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              已审阅证据无法证明公司已具备退出准备度。材料没有经审计财务报表、当前二级交易、IPO 申报、战略收购要约、资本化瀑布、清算优先权表或 HSBC
              契约包。这是指定公开证据的限制，不代表这些记录或流程不存在。因此，尽调闸门很明确：取得经审计的分部经济数据和流动性数据；把每轮融资与法定股权结构表逐一核对；检查优先权和反稀释条款；审阅债务协议、使用情况、契约和担保；并验证
              URC 试点是否转化为持续且盈利的货量。只有当这些记录支持下行情景和可信退出路径后，才能给出有价格的建议。
