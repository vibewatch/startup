          goal: Integrate storefront or ERP with Ninja Van API for automated label creation and pickup scheduling
          touchpoints:
            - 商户 API 集成门户
            - 定制费率卡与取件协议
        - label: 订单创建与首公里取件
          actor: 商户与 Ninja 物流车队
          goal: Generate parcel tracking barcodes or scan-to-print B2B labels and execute scheduled warehouse pickup
          touchpoints:
            - Ninja Dashboard 包裹清单
            - 首公里厢式车队调度
        - label: 枢纽自动分拣
          actor: Ninja Van 分拣运营团队
          goal: Measure, weigh, and sort parcels via automated conveyor systems across regional gateway hubs
          touchpoints:
            - 自动分拣传送带
            - 尺寸与重量扫描系统
        - label: 干线运输与海关转运
          actor: 枢纽间物流与海关团队
          goal: Execute domestic trunk haulage or cross-border customs clearance and freight forwarding
          touchpoints:
            - 跨境出口与进口清关
            - 城际干线车队追踪
        - label: 末公里路线优化
          actor: Ninja Van 司机车队
          goal: Sequence package delivery stops using algorithmic routing and mobile driver applications
          touchpoints:
            - Ninja Driver 移动路线应用
            - 预测性运力分配
        - label: 收件人配送与货到付款收款
          actor: 消费者收件人 / 零售门店
          goal: Complete doorstep delivery, retail restocking handover, and cash-on-delivery reconciliation
          touchpoints:
            - SMS 和消息追踪通知
            - 货到付款与电子签收证明
  - id: FR001
    title: 风险热力图：证据、影响与缓释成熟度
    type: matrix
    summary: 定性投资判断矩阵，将已观察到的风险信号与公开缓释措施的成熟度分开。
    data:
      columns:
        - 可能性 / 证据信号
        - 影响
        - 缓释 / 剩余风险
      rows:
        - label: 流动性与盈利压力
          values:
            - label: 高：据报道 FY2025 收入下降且现金减少
              score: 4
              tone: risk
            - label: 高：确切现金续航期和融资额度余量未知
              score: 4
              tone: risk
            - label: 亏损收窄，但现金流充足性仍未验证
              score: 2
              tone: warning
        - label: 电商去中介化
          values:
            - label: 高：据报道，内部物流竞争加剧且退出两个市场
              score: 4
              tone: risk
            - label: 高：业务量走弱可能削弱固定网络的成本吸收能力
              score: 4
              tone: risk
            - label: 可见 B2B 和冷链转向；经济效益未披露
              score: 2
              tone: warning
        - label: 配送质量
          values:
            - label: 中等信号：反复出现自行选择的投诉，没有分母
              score: 3
              tone: warning
            - label: 高：失败可能影响商户声誉和续约
              score: 4
              tone: risk
            - label: 公开证据不一；缺少经审计的 SLA 和恢复数据
              score: 2
              tone: warning
        - label: B2B 转型执行
          values:
            - label: 中等：已披露技术和合作仍处于试点阶段
              score: 3
              tone: warning
            - label: 高：转化和服务质量决定多元化价值
              score: 4
              tone: risk
            - label: 已有路由控制，但缺少试点结果和单位经济效益
              score: 2
              tone: warning
        - label: 隐私与数据治理
          values:
            - label: 中等：个人数据处理不可避免；事件发生率未知
              score: 3
              tone: warning
            - label: 高：重大事件可能损害信任和监管地位
              score: 4
              tone: risk
            - label: 已有书面政策；没有集团范围的审计证据
              score: 2
              tone: warning
        - label: 规划与报告控制
          values:
            - label: 中等：已披露历史上存在电子表格碎片化
              score: 3
              tone: warning
            - label: 中等：整合薄弱可能延迟纠偏决策
              score: 3
              tone: warning
            - label: Workday 集中化已实施；性能测试未披露
              score: 3
              tone: neutral
    approximationNotes: 分数是分析师按 1-5 级作出的定性定位，不是测量得出的事件概率；完成管理层尽调后，应重新评估影响和缓释情况。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR007
      - CR009
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从运营证明，经融资不确定性，最终导向“继续研究”的建议。
    data:
      nodes:
        - id: regional-footprint
          label: 六市场版图
          detail: 公司报告的区域运营覆盖
        - id: adjacency-proof
          label: B2B 试点证据
          detail: URC 补货试点和处于试点阶段的 scan-to-print
        - id: capital-history
          label: 可观的资本历史
          detail: 各机构统计总额在 $987 million 至 $1.1 billion 之间
        - id: stale-equity-mark
          label: 历史股权估值
          detail: Tracxn 记录 2021 年 9 月投后估值为 $1.85 billion
        - id: later-debt
          label: 后续债务，未有新估值
          detail: 2024 年 10 月 $50 million 的传统债务
        - id: decision
          label: 继续研究
          detail: 需要经审计的经济效益、股权结构表、债务条款和退出证据
      edges:
        - from: regional-footprint
          to: adjacency-proof
          label: 支持
        - from: adjacency-proof
          to: capital-history
          label: 提供背景
        - from: capital-history
          to: stale-equity-mark
          label: 不更新
        - from: stale-equity-mark
          to: later-debt
          label: 后续为
        - from: later-debt
          to: decision
          label: 不足以定价
    approximationNotes: 数值复现所引融资记录；该图不估算当前估值、可用现金或回报概率。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
