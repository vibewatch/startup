      - number: '8.3'
        title: 融资背景与情景
        blocks:
          - type: paragraph
            body: >-
              融资记录具有参考价值，但不同聚合平台之间并不一致。Startup Fundraising 报告披露融资额为 $987 million，并称其记录止于 2021 年 9 月 Series E；Clay 报告至少为
              $1.0246 billion；Tracxn 报告九轮合计 $1.1 billion。Tracxn 另记录了一轮 $578 million 的 Series E，投后估值为 $1.85 billion，以及
              2024 年 10 月 $50 million
              的传统债务融资。不能假设这些总额可以直接调和，因为各平台可能采用了不同的轮次分类和覆盖范围。因此，情景分析只使用明确的运营条件，不编造估值区间或概率；经审计的经济数据和交易条款是数值定价的前提。
