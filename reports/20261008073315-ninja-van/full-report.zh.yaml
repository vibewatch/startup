  - id: TV003
    title: 牛市、基准与熊市情景框架
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号与下行触发因素
    rows:
      - - 牛市
        - B2B 试点转化为多个市场的经常性业务量，经审计的单位经济效益为正，且债务容量仍然充足。
        - 目前还无法支持任何数值区间；只有取得经审计数据和交易条款后，才能采用经过验证的收入或现金流基准。
        - 未量化；正面信号应是经独立验证的盈利性复制，以及契约余量。
      - - 基准
        - 六市场网络继续运营，B2B 扩张保持渐进，经济效益仍未披露。
        - 将 2021 年 $1.85 billion 的估值视为历史背景，而非当前锚点；暂缓给出目标回报和持有期结果。
        - 未量化；下行信号将是持续依赖融资，同时没有经审计的利润率和流动性披露。
      - - 熊市
        - 邻接业务无法走出试点，竞争压缩经济效益，或债务与优先权条款限制股权回收。
        - 在缺乏债务优先级和优先权瀑布的情况下，不存在站得住脚的公开估值下限；普通股回收可能受到重大损害。
        - 未量化；触发因素包括契约压力、下行轮、对股权不利的优先权条款，或无法证明 B2B 业务量可经常性盈利。
    notes: 这些是有条件的投资判断情景，不是预测；由于现有证据缺少经审计的运营指标和当前交易条款，特意不提供数值估值区间和概率。
