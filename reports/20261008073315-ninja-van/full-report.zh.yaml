companyProfile:
  summary: >-
    Ninja Van 是一家总部位于新加坡、2014 年成立的东南亚物流公司，业务覆盖包裹配送、跨境运输、履约、冷链和 B2B
    补货。现有证据支持其拥有真实的区域运营平台、历史融资能力和网络规模，但公开披露仍无法厘清当前估值、经审计盈利能力、现金续航、股权结构和治理状况。
