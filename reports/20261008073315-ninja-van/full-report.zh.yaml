      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，覆盖六个市场的物流网络可以复用于相邻服务；反论点则是，现有证据仍处于早期，且主要来自公司。URC 公告介绍了南吕宋的门店直送补货，并称 scan-to-print
              虚拟履约仍是试验阶段，后续预计还要继续调整。这是有用的客户和产品证据，但不能证明已签约规模、留存、贡献利润率或区域复制能力。             
              融资上，公司持续吸引机构资本，但已筹资金不等于可用现金。Clay 也把竞争、扩张复杂度、财务可持续性和监管变化列为挑战，进一步说明在赋予价值前必须取得运营和流动性证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
