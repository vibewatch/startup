  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与物流支出分类
        blocks:
          - type: paragraph
            body: >-
              Ninja Van
              将自身的运营边界定义为技术驱动的第三方快递物流中介，把东南亚各地的线上和线下商业商户与区域收件人连接起来。公司主要聚焦定时小包干线运输、枢纽分拣和末端送货上门，并有意避开重工业货运、大宗干货和原材料运输。历史上，核心货量主要来自新加坡、马来西亚、菲律宾、印度尼西亚、泰国和越南的消费电商包裹履约；近年来公司又将运营边界扩展到企业对企业的零售补货和温控冷链配送。这一结构性扩张瞄准需要向分散的小型零售店频繁补货的快消品牌和药品分销商。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM010
              - CM011
      - number: '2.2'
        title: 可服务市场规模：电商增长与快递物流 TAM
        blocks:
          - type: paragraph
            body: >-
              过去十年，东南亚电商配送的总可服务市场快速扩大，区域数字连接提升、消费者人口超过 600 million 是主要推动力。Business Insider Intelligence 的独立行业预测以及 Google
              和 Temasek Holdings 的联合研究预计，东南亚电商 GMV 将从 2017 年约 $10 billion 飙升至 2025 年 $88 billion 至 $100 billion
              以上。快递物流通常占电商商品总价值约 10%–15% 的可服务支出，对应区域内 $10 billion–$15 billion 的物流池。在网络吞吐高峰期，Ninja Van 曾在六个运营地区日均处理约 200
              万件包裹，展现出区域规模。但 FY2025 实现收入同比下降 3% 至 US$702 million，说明平台自营和区域激烈的价格竞争严重压制了市场机会向实际收入的转化。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 客户分层、采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              Ninja Van 服务三类不同的商业客户，各自有独立的采购流程、采用触发点和预算负责人。跨境电商卖家需要自动化 API 集成、区域清关和货到付款收款能力，以满足东南亚多元市场的高频购物需求；越南跨境渗透率达到
              74%，新加坡达到 67%。国内中小企业商户更看重便捷发货、自动测量称重和可靠揽件，采购决策由电商经理主导，平均客单价从新加坡的 $52 到印度尼西亚的 $18
              不等。相比之下，企业快消品制造商和零售品牌所有者按固定企业补货周期运营，由供应链高管签约，把货物直接配送到门店，并完成多 SKU 的 scan-to-print 分拣和数千家便利店、杂货店的可预测补货。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: 增长催化剂、采用障碍与结构性逆风
        blocks:
          - type: paragraph
            body: >-
              东南亚技术驱动物流的长期增长，受消费者数字化采用扩大、中产阶级可支配支出增加，以及菲律宾 Ninja Van Cabuyao
              等现代自动化分拣枢纽建设的支持。但这些结构性顺风被严重的运营和竞争约束抵消。印度尼西亚和菲律宾的群岛地理带来多岛运输摩擦、联运处理费用和持续的城市交通瓶颈，推高末端履约成本。同时，Shopee 和 Lazada
              等主导电商平台积极扩建自营物流体系（Shopee Express 和 Lazada Logistics），把高利润的自有货量留在内部，并引发激烈的快递价格战。这些压力挤压第三方服务商的运营利润率，促使 Ninja
              Van 执行有纪律的重组，包括退出越南快递业务、削减新加坡总部 12% 的员工，并加快向 B2B 和冷链垂直领域多元化。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台自营物流造成的结构性利润率挤压
            body: Shopee、Lazada 等区域主导电商平台积极扩充自有物流车队，结构性压缩了可服务的 3PL 包裹池，迫使 Ninja Van 承受收入下降，并把配送能力从同质化的 B2C 快递转向专业化 B2B 补货。
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: 从电商货量转向 B2B 基础设施
            body: Ninja Van 的商业轨迹显示，公司正从追逐疫情期间的电商货量，转向高门槛的 B2B 补货和温控物流；同时利用 Cabuyao 等自动化分拣基础设施，抵御区域快递价格战。
            calloutType: insight
            claimRefs:
              - CM004
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 平台自营车队与区域快递整合
        blocks:
          - type: paragraph
            body: >-
              东南亚快递物流的竞争格局在结构上分成两类：主导平台拥有的内部物流体系，以及独立第三方物流商。以 Shopee 的 SPX Express 和 Lazada Logistics
              为主的平台自营网络，加上高货量、低成本的 J&T Express，到 2025 年约占区域包裹量的 67%。这种激烈的自营整合让 Ninja Van、Flash Express、JNE、SiCepat 和 Pos
              Malaysia 等独立快递商只能争夺剩余电商货量，定价议价能力大幅削弱。随着大型电商平台把更高比例的标准配送量导向自营车队，非自营服务商只能接受商户更低的定价，或把资产转向差异化的企业供应链流程。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 规模、成本结构与运营适应
        blocks:
          - type: paragraph
            body: >-
              核心配送走廊上的激烈价格竞争直接挤压了财务利润率，也推动区域同行采取降本措施。Ninja Van FY2025 收入同比下降 3% 至 US$702 million，连续第二年收入收缩；在持续 18 至 24
              个月的定价、客户选择和运营缩编之后，税前会计亏损收窄 32% 至 US$102 million。面对平台物流压力，公司加快向自动化仓储、企业扫描和菲律宾 Cabuyao
              等高密度分拣枢纽投入资本和技术，力求提升六个核心区域市场中电商包裹处理和企业 B2B 履约的运营吞吐。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP007
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
      - number: '3.3'
        title: 企业定价框架与 B2B 补货防御力
        blocks:
          - type: paragraph
            body: >-
              为抵御零售快递同质化对利润率的侵蚀，Ninja Van 为企业客户提供定制分层：每月发运超过 150
              个包裹的账户可以协商低于标准公开费率的定制方案。主要商业机制包括协商最低收费、体积重量除数调整、分区封顶和服务水平协议打包。同时，Ninja Restock
              通过利用现有快递分拣基础设施完成部分托盘库存的合装和配送，绕开传统整车货运的摩擦，服务现代渠道和低货量零售触点；Universal Robina Corporation 等消费食品饮料制造商的合作就是例证。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 平台电商自营造成的结构性利润率压缩
            body: >-
              SPX Express、J&T Express 和 Lazada Logistics 掌握区域包裹吞吐量的
              67%，没有专属平台自有货量的独立快递商面临严重定价限制。电商平台有强烈动机把高利润、高密度路线留在内部，非自营 3PL 只能承接分散或低利润的长尾配送，除非由专业化企业合同提供保护。
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP004
          - type: callout
            title: B2B 库存补货作为可防御的基础设施对冲
            body: >-
              Ninja Van 部署 Ninja Restock 和 scan-to-print 技术，利用现有分拣基础设施为 FMCG 企业补货，不必另建干线网络。通过为 Universal Robina
              Corporation 等全国品牌提供零担直送门店，公司建立了不易受零售平台结账竞争影响的商业关系。
            calloutType: insight
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价机制
        blocks:
          - type: paragraph
            body: >-
              Ninja Van
              主要按每票货物向线上商户、电商平台和企业发货方收取末端及跨境快递费。在新加坡、马来西亚、印度尼西亚、泰国、越南和菲律宾六个核心东南亚市场，公司通过分层配送费、货到付款收款费和履约附加费将货量变现。为摆脱竞争激烈的消费包裹物流，公司推出
              Ninja Restock，与 Universal Robina Corporation 等快消品制造商试点门店补货，让企业客户合装部分托盘，并仅按实际使用的车辆容量付费，无须承诺整车运输。Ninja
              Direct 则补充了商业变现，向数字商户提供跨境商品采购、清关和批发贸易融资。
            claimRefs:
