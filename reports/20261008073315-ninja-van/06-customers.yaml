      - CU002
      - CU005
      - CU011
      - CU013
    data:
      items:
        - label: Merchant Onboarding & API Integration
          actor: Shipper / Brand Merchant
          goal: Integrate storefront or ERP with Ninja Van API for automated label creation and pickup scheduling
          touchpoints:
            - Merchant API integration portal
            - Custom rate card and pickup agreement
        - label: Order Creation & First-Mile Pickup
          actor: Merchant & Ninja Logistics Fleet
          goal: Generate parcel tracking barcodes or scan-to-print B2B labels and execute scheduled warehouse pickup
          touchpoints:
            - Ninja Dashboard parcel manifest
            - First-mile van fleet dispatch
        - label: Automated Hub Sortation
          actor: Ninja Van Sorting Operations
          goal: Measure, weigh, and sort parcels via automated conveyor systems across regional gateway hubs
          touchpoints:
            - Automated sortation conveyor belts
            - Dimensioning weight scanning systems
        - label: Line-Haul & Customs Transit
          actor: Inter-Hub Logistics & Customs Teams
          goal: Execute domestic trunk haulage or cross-border customs clearance and freight forwarding
          touchpoints:
            - Cross-border export and import clearance
            - Inter-city line-haul fleet tracking
        - label: Last-Mile Route Optimization
          actor: Ninja Van Driver Fleet
          goal: Sequence package delivery stops using algorithmic routing and mobile driver applications
          touchpoints:
            - Ninja Driver mobile routing app
            - Predictive capacity allocation
        - label: Recipient Delivery & COD Collection
          actor: Consumer Recipient / Retail Store
          goal: Complete doorstep delivery, retail restocking handover, and cash-on-delivery reconciliation
          touchpoints:
            - SMS and messaging tracking notifications
            - Cash-on-delivery and digital proof of delivery
callouts:
  - calloutType: risk
    title: Marketplace Concentration and Operational Restructuring
    body: >-
      Ninja Van faces substantial customer concentration risk from dominant regional e-commerce platforms such as Shopee
      and Lazada, which have steadily expanded in-house logistics arms (SPX Express and Lazada Logistics). Furthermore,
      adverse operational developments—including the September 2024 suspension of operations at its Vietnam subsidiary
      over unpaid salaries and multiple tech layoff rounds—highlight execution friction as the group pivots toward
      enterprise B2B restocking.
    claimRefs:
      - CU003
      - CU012
  - calloutType: insight
    title: B2B Restock as Strategic Margin Diversification
    body: >-
      The rollout of Ninja Restock and scan-to-print technology, evidenced by commercial trials with Universal Robina
      Corporation in the Philippines, represents a critical strategic pivot away from commoditized consumer e-commerce
      parcels toward higher-margin, predictable B2B FMCG store replenishment.
    claimRefs:
      - CU004
      - CU005
