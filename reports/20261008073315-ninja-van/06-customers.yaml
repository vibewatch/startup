        - Ninja Restock B2B delivery to retail touchpoints in South Luzon with scan-to-print sorting
        - Pilot (Trial phase)
        - Enables direct-to-store restocking for smaller retail formats without full truckloads
        - Trial phase limited to South Luzon; long-term commercial terms unconfirmed
      - - iHerb
        - Cross-Border Health & Wellness
        - Customs clearance and last-mile delivery services for supplement orders in the Philippines
        - Production
        - Reliable cross-border clearance and door-to-door delivery for international brand
        - Vulnerable to Philippine import regulatory changes and de minimis threshold shifts
      - - Manscaped
        - Cross-Border Men's Grooming
        - Import customs clearance and urban last-mile delivery services in Singapore
        - Production
        - Fast market access and urban fulfillment without local distribution infrastructure
        - Singapore market scale is small relative to broader regional parcel volumes
      - - In the Box Global
        - Regional D2C Home Goods
        - Cross-border expansion from Singapore into Malaysia supported by Ninja Fulfilment warehousing
        - Production
        - End-to-end inventory receipt, storage, picking, packing, and cross-border delivery
        - Single merchant proof; does not demonstrate widespread adoption of Ninja Fulfilment
