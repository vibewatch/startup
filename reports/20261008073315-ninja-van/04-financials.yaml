callouts:
  - calloutType: risk
    title: Private Financial Opacity and Capital Dependency
    body: >-
      Ninja Van has not publicly filed audited financial statements for 2023–2026, leaving prospective underwriters
      unable to verify whether post-2021 volume gains and B2B diversification achieved sustainable operating
      profitability or whether competitive pricing in Southeast Asia continues to drain cash reserves.
    claimRefs:
      - CI007
      - CI010
      - CI012
  - calloutType: insight
    title: Strategic Shift Toward B2B Restocking to Protect Unit Economics
    body: >-
      The commercial rollout of Ninja Restock represents an intentional operational pivot to utilize existing express
      sorting and linehaul capacity for high-density store deliveries, aiming to capture higher-margin, recurring B2B
      contracts that offset intense price erosion in consumer e-commerce parcels.
    claimRefs:
      - CI005
      - CI006
