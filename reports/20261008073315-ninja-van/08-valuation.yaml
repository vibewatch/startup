  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Probability signal and downside trigger"
    rows:
      - ["Bull", "The B2B trial converts into recurring multi-market volume, audited unit economics are positive, and debt capacity remains ample.", "No numeric range is supportable yet; apply verified revenue or cash-flow benchmarks only after audited data and transaction terms are obtained.", "Unquantified; positive signal would be independently verified profitable replication and covenant headroom."]
      - ["Base", "The six-market network continues operating while B2B expansion remains gradual and economics stay undisclosed.", "Treat the 2021 $1.85 billion mark as historical context, not a current anchor; defer target return and holding-period outputs.", "Unquantified; downside signal would be continued reliance on financing without audited margin and liquidity disclosure."]
      - ["Bear", "Adjacencies do not move beyond trials, competition compresses economics, or debt and preference terms constrain equity recoveries.", "No defensible public valuation floor exists without debt priority and preference waterfalls; common-equity recovery could be materially impaired.", "Unquantified; triggers are covenant pressure, a down round, adverse preference terms, or failure to demonstrate recurring profitable B2B volume."]
    notes: "These are conditional underwriting cases, not forecasts; numeric valuation ranges and probabilities are intentionally withheld because the assigned evidence lacks audited operating metrics and current transaction terms."
    claimRefs:
