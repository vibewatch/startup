      - ["Capital access versus overhang", "Third parties record substantial historical equity funding and a $50 million 2024 debt financing.", "A reconciled cap table, preference waterfall, debt utilization, security, covenants, and current liquidity."]
    notes: "Operating proof is company-issued and limited to disclosed scope; funding totals vary by provider and do not represent cash currently available."
