company:
  name: "Ninja Van"
chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence supports a research-more recommendation rather than a numeric valuation: third-party databases disagree on cumulative funding, the last disclosed equity mark in the assigned evidence is Tracxn's $1.85 billion September 2021 post-money valuation, and the later $50 million 2024 financing was debt with no disclosed valuation. Ninja Van has credible regional and B2B trial evidence, but the reviewed pool does not disclose the operating economics, capital preferences, or debt terms required to price the equity."
sections:
  - id: "decision-and-price-discipline"
    title: "Decision and Price Discipline"
    body: "The appropriate decision is research-more, not buy or avoid, because the evidence establishes operating reach and historical access to capital but does not establish today's equity price or an investable return. Ninja Van says it operates in six Southeast Asian markets, and a company release documents a B2B restocking trial with Universal Robina Corporation. Those facts support strategic relevance, but they do not reveal revenue quality, margins, free cash flow, or the durability of the new service. The assigned sources also provide no current equity transaction price. Any target return, holding period, or exit multiple would therefore be an unsupported output rather than an underwriting conclusion."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: "The thesis is that a six-market logistics footprint can be reused for adjacent services, while the anti-thesis is that the available proof is early and company-issued. The URC release describes direct-to-store restocking in South Luzon and calls scan-to-print virtual fulfilment a trial-stage technology for which further tweaks are expected. That is useful customer and product evidence, but it is not evidence of contracted scale, retention, contribution margin, or regional replication. On financing, the company has repeatedly attracted institutional capital, yet funding raised is not cash available. Clay also identifies competition, scaling complexity, financial sustainability, and regulatory change as challenges, reinforcing the need for operating and liquidity evidence before assigning value."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV013"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "financing-and-scenarios"
    title: "Financing Context and Scenarios"
    body: "The financing record is informative but internally inconsistent across aggregators. Startup Fundraising reports $987 million of disclosed funding and says its record ends with the September 2021 Series E; Clay reports at least $1.0246 billion; Tracxn reports $1.1 billion across nine rounds. Tracxn separately records a $578 million Series E at a $1.85 billion post-money valuation and a $50 million conventional-debt round in October 2024. These totals should not be reconciled by assumption because they may use different round classifications and coverage. The scenarios consequently use explicit operational conditions but no fabricated valuation ranges or probabilities; audited economics and transaction terms are prerequisites to numerical pricing."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Final Diligence"
    body: "The reviewed evidence cannot establish exit readiness. It contains no audited financial statements, current secondary transaction, IPO filing, strategic offer, capitalization waterfall, liquidation-preference schedule, or HSBC covenant package. This is a limitation of the assigned public evidence, not proof that such records or processes do not exist. The gating diligence is therefore concrete: obtain audited segment economics and liquidity; reconcile every financing round to the legal cap table; inspect preference and anti-dilution terms; review the debt agreement, utilization, covenants, and security; and test whether the URC trial converted into recurring profitable volume. A priced recommendation should follow only when those records support a downside case and a credible exit path."
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
    figureRefs:
      - "FV001"
