company:
  name: "Ninja Van"
chapter:
  number: 7
  title: "Risks"
  summary: "The highest-evidence risks are FY2025 revenue contraction and lower cash, ecommerce-platform disintermediation, and uneven delivery quality; public evidence does not quantify cash runway, incident rates, or customer concentration. Workday-based planning, a written Malaysian privacy policy, and B2B routing technology are visible mitigations, but the retained evidence does not establish their operating effectiveness across the group."
sections:
  - id: "ranked-risk-profile"
    title: "Ranked Risk Profile and Financial Exposure"
    body: >-
      Financial and market-model risk ranks first because Tech in Asia reported FY2025 revenue of
      US$702 million, down 3%, alongside a substantial but unquantified decline in cash. The same
      source reported a 32% improvement in net losses; that accounting-loss improvement is not
      evidence of positive cash flow or adequate runway. Competitive exposure ranks alongside
      liquidity: Ninja Van closed delivery services in Vietnam and Thailand while shifting toward
      B2B logistics and cold chain as ecommerce platforms expanded in-house delivery. The public
      record supports contraction and strategic repositioning, but not current segment margins,
      cash available, covenant headroom, or the revenue needed to absorb fixed network costs.
      Underwriting should therefore remain conditional on audited FY2025 accounts and a funded
      liquidity plan rather than treating narrower losses as proof that financial risk has cleared.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR008"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory, Legal, and Privacy Exposure"
    body: >-
      The clearest retained legal evidence is Ninja Van's Malaysian privacy policy, not a regulator
      decision or compliance audit. The policy says the company receives recipient data from
      shippers and other service providers and may share data with operating vendors, advisers,
      regulators, and law enforcement for stated purposes. It also describes security standards and
      requires relevant third parties to follow the policy, the Malaysian PDPA, and confidentiality
      requirements. Those are company-issued controls, not independent proof that every market
      complies or that no incident has occurred. Tech in Asia separately reported proposed ecommerce
      commission restrictions in Thailand and Indonesia; those proposals concern platform economics,
      not a Ninja Van enforcement action, but they could change marketplace subsidy and parcel-volume
      incentives. Complete diligence still requires country-level licenses, privacy audits, claims,
      investigations, and incident records.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-transition-risk"
    title: "Operational Quality and B2B Transition Risk"
    body: >-
      Delivery quality is a material reputation and renewal risk, but the evidence must be read
      carefully. The retained Trustpilot snapshot contains multiple unprompted allegations of missed
      collections, delayed or lost parcels, misdelivery, and difficult service recovery. These
      reports identify plausible failure modes; they are self-selected user submissions without a
      shipment denominator and cannot establish a group-wide incident rate. Company-selected
      evidence is more favorable: a Moss Fashion founder praised an account manager's effectiveness,
      professionalism, and responsibility. The contrast makes audited on-time-delivery, loss,
      damage, complaint, and renewal data essential. B2B diversification also remains an execution
      risk because the URC Restock arrangement and scan-to-print technology were described as a
      trial, with further adjustments expected as deliveries generated learning.
    claimRefs:
      - "CR009"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "dependencies-mitigation-and-kill-criteria"
    title: "Dependencies, Mitigation Maturity, and Thesis-Break Triggers"
    body: >-
      The dependency stack spans ecommerce channels, enterprise trial partners, third-party data
      handoffs, and planning software. Ninja Van itself has warned that aggressive ecommerce-logistics
      pricing can damage long-term growth and innovation. Workday Adaptive Planning addresses a
      documented legacy weakness in spreadsheet-based regional consolidation, while scan-to-print
      routing and shipper visibility address manual B2B sorting risk. Neither source discloses tested
      recovery performance, error rates, vendor exit plans, or portfolio concentration. Monitor
      quarterly revenue and unrestricted cash, marketplace parcel share, on-time and loss rates per
      10,000 shipments, B2B trial-to-contract conversion, SLA credits, privacy incidents, and monthly
      close exceptions. Thesis-break triggers are failure to evidence sufficient funded runway,
      repeated SLA deterioration without corrective action, failure to convert B2B trials on economic
      terms, a material unresolved privacy event, or reliance on one channel or customer beyond an
      investment-committee-approved limit.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
