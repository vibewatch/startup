evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Current fully diluted cap table, cumulative primary and secondary funding, valuation, debt, preference stack, cash
      balance, burn, and runway.
    whyItMatters: Historical round amounts do not establish current ownership, liquidity, financing risk, or investable price.
    diligencePath: >-
      Obtain the latest board-approved cap table, financing documents, debt schedule, audited accounts, and current
      management liquidity bridge.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board membership, independent-director status, voting control, founder responsibilities,
      and succession plan.
    whyItMatters: >-
      Public founder identity does not establish decision rights, oversight quality, leadership depth, or continuity
      under key-person loss.
    diligencePath: >-
      Request the organization chart, board and committee rosters, shareholder voting agreements, delegated-authority
      matrix, and succession materials.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Exhaustive current investor list, ownership percentages, board rights, preference terms, and material
      commercial-partner economics.
    whyItMatters: >-
      A sample of named participants cannot establish control, liquidation outcomes, related-party exposure, or partner
      concentration.
    diligencePath: >-
      Reconcile the legal cap table and shareholder register to financing documents, then obtain the top partner
      contracts and concentration schedule.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      Current revenue, revenue mix, margin, customer count, parcel volume, active country footprint, workforce, and
      location count with common measurement dates.
    whyItMatters: Undated company statements and 2021 operating metrics cannot support a current scale or growth assessment.
    diligencePath: >-
      Obtain audited 2025 accounts, 2026 management reporting, country-level volume and customer cohorts, payroll
      records, and an active-facility register.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: segment-margins-and-unit-economics
    missingEvidence: >-
      Audited segment breakdowns separating B2C express parcel delivery revenue from B2B restocking and cold chain
      services, along with unit economics and gross margins for FY2025.
    whyItMatters: >-
      Without segmented revenue and margin disclosure, evaluating the financial viability and margin profile of the B2B
      logistics pivot relative to declining core parcel delivery remains speculative.
    diligencePath: >-
      Review future statutory filings in Singapore (ACRA) or investor disclosures accompanying the projected mid-2026
      profitability milestone.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: b2b-segment-financials
    missingEvidence: >-
      Audited financial breakdown of revenue contribution, operating gross margin, and volume split for Ninja Van's B2B
      logistics and cold chain units.
    whyItMatters: >-
      Without segmented revenue disclosures, underwriters cannot verify whether higher-margin B2B restocking offsets
      ongoing margin compression in retail e-commerce parcels.
    diligencePath: >-
      Request management accounts detailing business unit gross margin, customer acquisition cost, and revenue mix
      across e-commerce vs B2B Restock.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: financial-underwriting
    missingEvidence: Audited consolidated income statement, balance sheet, and cash flow statement for fiscal years 2023 through 2025.
    whyItMatters: >-
      Without audited financial disclosures, investors cannot determine whether post-Series E revenue growth has
      achieved operational profitability or if ongoing burn threatens liquidity.
    diligencePath: >-
      Obtain statutory audited filings from Singapore's Accounting and Corporate Regulatory Authority (ACRA) or request
      audited data room packs from management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular per-parcel unit economics detailing average revenue per delivery, linehaul cost, driver compensation, and
      net contribution margin.
    whyItMatters: >-
      Per-parcel contribution economics dictate whether scale increases cash generation or merely multiplies variable
      delivery losses amid intense regional pricing pressure.
    diligencePath: >-
      Request unit economics breakdown by country subsidiary and customer category from the company's financial planning
      and analysis team.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: current-cloud-topology
    missingEvidence: >-
      A current production inventory showing workload ownership, data flows, data residency, failover, and control
      responsibilities across Google Cloud, Huawei Cloud, and any remaining providers.
    whyItMatters: >-
      The assigned sources span several years and do not show whether the disclosed Google and Huawei components
      coexist, replaced one another, or serve separate acquired environments.
    diligencePath: >-
      Request a dated production architecture diagram, cloud spend allocation, recovery design, and service ownership
      matrix under NDA.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: formal-security-certifications
    missingEvidence: >-
      Public third-party audit reports or verification of formal security certifications (such as ISO/IEC 27001 or SOC 2
      Type II) across Ninja Van's regional cloud environments.
    whyItMatters: Enterprise and FMCG B2B customers require rigorous data security and information governance compliance.
    diligencePath: Obtain SOC 2 Type II or ISO 27001 compliance summary reports from Ninja Van's security officer.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: Contractual retention and cohort renewal rates
    missingEvidence: >-
      Audited gross retention rates, net revenue retention (NRR), customer churn by tier, and cohort-level volume decay
      curves.
    whyItMatters: >-
      Without contractual retention or cohort renewal data, investors cannot verify whether shipper volume is durable or
      vulnerable to competitor discounting and platform in-housing.
    diligencePath: >-
      Request confidential commercial cohort analysis, merchant churn logs, and top-50 shipper contract renewal
      histories under NDA.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table and enterprise deployment scale
    missingEvidence: >-
      Comprehensive registry of named enterprise shippers, ACVs, shipment volumes, and production conversion rates for
      B2B Restock trials.
    whyItMatters: >-
      Current customer disclosures rely on selective case studies (URC, iHerb, Manscaped, In the Box Global) without
      disclosing total commercial revenue contributions or production retention.
    diligencePath: >-
      Obtain customer concentration schedule by revenue tier and production verification for all named enterprise
      pilots.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Authoritative country-by-country courier licenses, privacy audits, enforcement matters, litigation, claims, and
      incident records.
    whyItMatters: >-
      The assigned evidence supports one national privacy policy and indirect marketplace regulation, not a complete
      legal-risk inventory.
    diligencePath: >-
      Request the legal entity and license schedule, search regulator and court dockets in each active market, and
      reconcile results to management's claims register.
    relatedQuestionRefs:
      - QR001
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Audited FY2025 cash and equivalents, operating cash flow, monthly burn, restricted cash, debt maturities, covenant
      headroom, and committed facilities.
    whyItMatters: >-
      Revenue and accounting-loss direction do not establish cash runway or the capital needed to complete the portfolio
      transition.
    diligencePath: >-
      Obtain audited statements, current management accounts, the 24-month cash forecast, lender certificates, and
      downside liquidity sensitivities.
    relatedQuestionRefs:
      - QR004
  - type: private-evidence-only
    severity: material
    topic: delivery-quality
    missingEvidence: >-
      Market-level shipment denominators, on-time rates, loss and damage rates, complaint volume, resolution time, SLA
      credits, and renewal impact.
    whyItMatters: Self-selected reviews reveal failure modes but cannot establish their incidence or financial consequence.
    diligencePath: >-
      Reconcile raw scan events, claims, support tickets, enterprise scorecards, SLA credits, and customer renewals for
      at least eight quarters.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: dependency-concentration
    missingEvidence: >-
      Revenue, parcel volume, gross margin, and contractual concentration by marketplace, enterprise customer, shipper,
      processor, and critical software vendor.
    whyItMatters: >-
      The public record identifies dependency roles but cannot quantify the loss from a counterparty exit or platform
      allocation change.
    diligencePath: >-
      Review top-20 concentration schedules, channel contracts, trial conversion, vendor exit plans, and downside
      scenarios approved by the board.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      The legal cap table, liquidation preferences, anti-dilution terms, HSBC facility agreement, utilization, security,
      covenants, and current liquidity.
    whyItMatters: >-
      Debt priority and investor preferences determine downside equity recovery and whether historical post-money
      valuations are relevant to a new investor.
    diligencePath: >-
      Reconcile financing records to corporate filings and obtain the capitalization waterfall, shareholder agreements,
      debt documents, compliance certificates, and current treasury schedule from the company data room.
    relatedQuestionRefs:
      - QV003
  - type: missing-source
    severity: material
    topic: valuation-comparables
    missingEvidence: >-
      Comparable public-company operating multiples, relevant private secondary transactions, logistics acquisitions,
      and metric definitions matched to Ninja Van's audited revenue and earnings.
    whyItMatters: >-
      A comparable range is meaningful only when business mix, geography, growth, margin, period, and denominator are
      aligned.
    diligencePath: >-
      Obtain audited segment financials, then build a dated comparable set from issuer filings and transaction
      announcements using matched revenue, EBITDA, and cash-flow definitions.
    relatedQuestionRefs:
      - QV008
