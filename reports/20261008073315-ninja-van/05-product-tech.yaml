chapter:
  number: 5
  title: "Product & Technology"
  summary: "Ninja Van's disclosed product stack combines regional parcel delivery, a trial-stage B2B restocking workflow, and a containerized software platform that a 2024 partner case study described as 200 microservices across 15 GKE clusters. The architecture is technically specific in company and cloud-partner materials, but current topology, independent reliability benchmarks, and third-party security assurance remain unverified."
sections:
  - id: "core-logistics-offering"
    title: "Core Logistics Services and B2B Restocking Offerings"
    body: "Ninja Van describes itself as a third-party logistics provider that performs deliveries for online and offline merchants, with an official Vietnam page naming six Southeast Asian markets. The clearest adjacent product evidence is Ninja Restock: in a January 2025 company release, a URC trial used pickup, sorting, co-loading, and direct-to-store distribution across South Luzon. The same release describes scan-to-print virtual fulfillment that assigns a destination-linked tracking ID to each case or box, while explicitly stating that the technology remained in trial and required further tuning. This supports a real workflow extension, but not a claim of region-wide commercial maturity or independently measured customer benefit."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "technology-infrastructure"
    title: "Microservices Architecture, Multi-Cloud Infrastructure, and Telemetry"
    body: "The public engineering record shows a progression from CoreOS and Fleet to self-managed Kubernetes and then managed Google Kubernetes Engine. A 2024 Google Cloud partner case study, written in Ninja Van's voice, describes 200 microservices in 15 clusters managed by 10 engineers, centralized logging and monitoring, a dedicated DevOps cluster, configurable production approvals, test gates, and KEDA autoscaling. A July 2026 sponsored Tech in Asia Studios article separately says Ninja Van uses Huawei Cloud CCE Turbo and object storage to integrate acquired companies' technology. Those disclosures establish named components, but they do not publish a current system inventory or explain how Google and Huawei environments divide production workloads, data residency, recovery, and control-plane responsibility."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "operational-reliability"
    title: "Operational Reliability, Data Governance, and Diligence Risks"
    body: "A 2022 Ninja Van engineering post gives meaningful developer signal: parcel-lifecycle telemetry produces trillions of data points daily, with Istio metrics feeding Prometheus, Thanos long-term storage, and Grafana Apdex dashboards. Company and partner materials also describe tests in CI/CD, managed-cluster upgrades, automated scaling, and deployment freezes around peak shopping events. These are control descriptions rather than audited outcomes. The Malaysia privacy policy identifies recipient and shipment data, requires shipper warranties regarding consent, permits specified operational and legal disclosures, and claims strict security standards. No assigned source provides an external security audit, certification, public status history, incident-rate series, recovery objective, or service-level attainment, so reliability and security maturity cannot be independently benchmarked."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
