    title: "Architecture Specificity Exceeds Outcome Verification"
    body: "Ninja Van and its cloud partners disclose unusually specific infrastructure components, including GKE clusters, CI/CD controls, Istio telemetry, and Huawei CCE Turbo. That specificity supports technical diligence, but sponsored and partner case studies are not independent benchmarks: the current cloud split, availability record, security assurance, and claimed Huawei efficiency gains still require primary operating data or external verification."
    claimRefs:
