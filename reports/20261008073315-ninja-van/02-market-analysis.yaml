callouts:
  - calloutType: risk
    title: Structural Margin Squeeze from Marketplace Logistics Insourcing
    body: The aggressive expansion of captive in-house logistics fleets by dominant regional e-commerce platforms like Shopee and Lazada has structurally compressed the addressable 3PL parcel pool, forcing Ninja Van to absorb top-line revenue declines and reallocate delivery capacity away from commoditized B2C parcel express toward specialized B2B replenishment.
    claimRefs:
      - CM001
      - CM002
      - CM003
  - calloutType: insight
    title: Strategic Transition from E-Commerce Volume to B2B Infrastructure
    body: Ninja Van commercial trajectory demonstrates a strategic transition from pandemic-era e-commerce volume chasing toward high-barrier B2B restocking and temperature-controlled logistics, leveraging automated sorting infrastructure such as its Cabuyao facility to offset regional courier price wars.
    claimRefs:
      - CM004
      - CM011
      - CM012
