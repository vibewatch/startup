  - id: TM003
    title: Segment / Buyer Map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget Owner
      - Adoption Trigger
    rows:
      - - Cross-Border E-Commerce Merchants
        - Sellers and regional exporters
        - Fulfillment teams and overseas shippers
        - Merchant or platform seller
        - API booking, customs documentation, cross-border line-haul, regional hub sorting
        - Head of Logistics / E-Commerce Operations
        - Need for regional door-to-door tracking and cash-on-delivery handling
      - - Domestic Online Retailers & SMEs
        - Independent e-commerce merchants and direct-to-consumer brands
        - Store warehouse staff and parcel dispatchers
        - Merchant shipper (passed to consumer via checkout fee)
        - Automated pick-up scheduling, dim-weighing sortation, last-mile doorstep delivery
        - Small Business Owner / E-Commerce Director
        - Demand for reliable parcel transit times and automated merchant dashboard
      - - Enterprise FMCG Manufacturers
        - Corporate supply chain executives (e.g. Universal Robina Corporation)
        - Distribution coordinators and brand delivery managers
        - Corporate logistics budget
        - Scan-to-print SKU tracking, co-loading, direct-to-store restocking of small-door formats
        - VP of Supply Chain / National Logistics Director
        - Inefficiency of legacy full-truckload distribution to small-format stores
      - - Consumer Recipients (End Users)
        - Online shoppers and recipients
        - Everyday household consumers
        - Consumer (direct shipping fee or embedded merchandise cost)
        - Online parcel tracking, driver dispatch, SMS delivery notification, doorstep handover
        - Household Consumer
        - Desire for real-time tracking visibility and flexible delivery rescheduling
    notes: Mapping synthesizes commercial customer workflows from Ninja Van enterprise announcements, privacy policy definitions of shippers versus recipients, and published case studies.
