      - number: '6.2'
        title: Adoption Trajectory and Regional Delivery Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Ninja Van's delivery network is characterized by rapid volume scaling across
              its six core Southeast Asian operating geographies. According to corporate operational data, the platform
              achieved a delivery volume of two million parcels per day across Singapore, Malaysia, the Philippines,
              Indonesia, Thailand, and Vietnam, backed by claimed 100% regional network coverage. Cross-border delivery
              demand experienced explosive growth, expanding by 1,100% from 2019 to 2020 and sustaining an additional
              20% growth between 2020 and 2021 despite severe pandemic-era border restrictions. Consumer purchasing
              patterns differ substantially across these markets, with average basket sizes ranging from USD 18 in
              Indonesia to USD 52 in Singapore. To accommodate this scale and improve sorting throughput, Ninja Van
              committed US$50 million to automate parcel processing across nine regional gateway facilities.
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named Customer Deployments and B2B Restock Expansion
        blocks:
          - type: paragraph
            body: >-
              While much of Ninja Van's historical volume has been driven by anonymous small-to-medium enterprise
              merchants and marketplace routing, the company has established referenceable customer deployments across
              direct brands and corporate supply chains. In cross-border e-commerce, international brands such as iHerb
              rely on Ninja Van for customs brokerage and last-mile distribution in the Philippines, while Manscaped
              utilizes its import clearance and fulfillment services in Singapore. In consumer goods manufacturing,
              Ninja Van Philippines launched an enterprise trial with Universal Robina Corporation (URC), deploying its
              flagship Ninja Restock B2B service to replenish retail outlets across South Luzon. Supported by newly
              developed scan-to-print technology that automates case-level SKU routing, this deployment enables consumer
              goods producers to supply small-door retail formats without requiring full truckload shipments.
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
      - number: '6.4'
        title: Customer Journey Architecture and Platform Retention Risks
        blocks:
          - type: paragraph
            body: >-
              Ninja Van's customer journey links merchant storefronts to recipient doorsteps through automated cloud
              infrastructure deployed across Google Cloud and Huawei Cloud containerized environments. Historical
              dispatch records and driver mobility data are analyzed continuously to forecast staffing demand and
              prevent delivery bottlenecks during seasonal surges such as Singles' Day 11.11, when transaction volumes
              can spike by up to tenfold. However, the commercial durability of this workflow is constrained by
              structural retention vulnerabilities. In addition to high platform concentration among regional e-commerce
              marketplaces that are aggressively building proprietary delivery networks, Ninja Van has experienced
              operational disruptions, including the September 2024 suspension of operations at its Vietnam subsidiary
              over unpaid salaries. Combined with the absence of disclosed contract renewal or net retention metrics,
              these operational strains underscore the need for verifiable customer retention data.
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
