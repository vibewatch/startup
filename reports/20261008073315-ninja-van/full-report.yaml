  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Ninja Van segments its customer base into distinct commercial categories, serving online retailers,
              marketplace platforms, cross-border brands, and brick-and-mortar merchants across Southeast Asia. In the
              core consumer e-commerce segment, the company's primary enterprise counterparties have historically been
              dominant regional platforms including Shopee and Lazada, who utilize Ninja Van's API integration and
              express line-haul network for last-mile delivery. In addition to marketplace volume, Ninja Van serves
              direct-to-consumer cross-border brands such as iHerb and Manscaped, providing customs clearance,
              cross-border trucking, and domestic delivery to end shoppers. Across all segments, Ninja Van acts as a
              third-party logistics provider performing pickups from commercial shippers and delivering to consumer
              individual recipients, though the company does not publicly disclose contract renewal rates, gross
              retention, or cohort-level merchant churn.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU014
          - type: table
