      - number: '4.3'
        title: Capital Adequacy and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Ninja Van has accumulated substantial institutional backing, raising $1.1B across nine funding rounds
              according to private market data from Tracxn, including a $274 million round in 2020 and a US$578 million
              Series E round in September 2021 co-led by Alibaba Group Holdings, GeoPost/DPDgroup, and B Capital Group.
              While these rounds elevated private post-money valuation to approximately $1.85B and funded major capital
              expenditures in automation and micro-supply chain software, the postponement of anticipated public market
              listings and lack of audited 2023–2026 financial filings leave cash on hand, current burn rate, debt
              service covenants, and net capital runway unverified. For investment underwriting, the absence of verified
              unit contribution margins, realized parcel yields, and customer concentration data represents a material
              diligence gap that prevents confirming self-funded runway without access to audited corporate accounts.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI010
