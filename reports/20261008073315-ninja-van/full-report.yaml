      - number: '4.2'
        title: Cost Structure and Operating Leverage
        blocks:
          - type: paragraph
            body: >-
              The company's operational cost structure is heavily weighted toward frontline labor, sorting hub
              automation, fleet linehaul, and multi-country facilities. Operating across six territories requires
              managing localized delivery personnel, warehouse sorting equipment, and regional hub infrastructure such
              as the Cabuyao automated hub in the Philippines. Historical financial disclosures compiled by VentureCap
              and reported by regional media indicate that Ninja Van recorded a net loss of US$84.1 million against
              US$149.3 million in revenue in 2019, illustrating the substantial fixed overhead and operating losses
              incurred during aggressive market expansion. While management targeted operational break-even following
              pandemic parcel volume surges, severe price competition from regional competitors such as SiCepat, J&T
              Express, and platform-owned captive fleets has pressured per-parcel gross margins, making productivity
              gains and automated sorting critical to operating sustainability.
            claimRefs:
              - CI003
