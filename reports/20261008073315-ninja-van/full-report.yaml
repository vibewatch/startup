              - CU002
              - CU005
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace Concentration and Operational Restructuring
            body: >-
              Ninja Van faces substantial customer concentration risk from dominant regional e-commerce platforms such
              as Shopee and Lazada, which have steadily expanded in-house logistics arms (SPX Express and Lazada
              Logistics). Furthermore, adverse operational developments—including the September 2024 suspension of
              operations at its Vietnam subsidiary over unpaid salaries and multiple tech layoff rounds—highlight
              execution friction as the group pivots toward enterprise B2B restocking.
            calloutType: risk
            claimRefs:
              - CU003
              - CU012
          - type: callout
            title: B2B Restock as Strategic Margin Diversification
            body: >-
              The rollout of Ninja Restock and scan-to-print technology, evidenced by commercial trials with Universal
              Robina Corporation in the Philippines, represents a critical strategic pivot away from commoditized
              consumer e-commerce parcels toward higher-margin, predictable B2B FMCG store replenishment.
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Profile and Financial Exposure
        blocks:
          - type: paragraph
            body: >-
              Financial and market-model risk ranks first because Tech in Asia reported FY2025 revenue of US$702
              million, down 3%, alongside a substantial but unquantified decline in cash. The same source reported a 32%
              improvement in net losses; that accounting-loss improvement is not evidence of positive cash flow or
              adequate runway. Competitive exposure ranks alongside liquidity: Ninja Van closed delivery services in
              Vietnam and Thailand while shifting toward B2B logistics and cold chain as ecommerce platforms expanded
              in-house delivery. The public record supports contraction and strategic repositioning, but not current
              segment margins, cash available, covenant headroom, or the revenue needed to absorb fixed network costs.
              Underwriting should therefore remain conditional on audited FY2025 accounts and a funded liquidity plan
              rather than treating narrower losses as proof that financial risk has cleared.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
