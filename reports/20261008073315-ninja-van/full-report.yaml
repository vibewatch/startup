      - number: '3.3'
        title: Enterprise Pricing Framework and B2B Restocking Defensibility
        blocks:
          - type: paragraph
            body: >-
              To defend operating margins against retail courier commoditization, Ninja Van offers tailored business
              enterprise tiering where accounts shipping over 150 parcels per month negotiate customized rate plans
              below standard public tariffs. Key commercial mechanisms include negotiated minimum charge floors,
              volumetric weight divisor adjustments, zone capping, and service level agreement bundling. Concurrently,
              Ninja Van's B2B inventory restocking service, Ninja Restock, bypasses traditional full-truckload freight
              friction by utilizing its existing express sorting infrastructure to co-load and distribute partial-pallet
              inventory to modern trade and low-volume retail touchpoints, demonstrated in partnerships with consumer
              food and beverage manufacturers such as Universal Robina Corporation.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Margin Compression from Platform E-Commerce Insourcing
            body: >-
              With SPX Express, J&T Express, and Lazada Logistics commanding 67% of regional parcel throughput,
              independent couriers without dedicated captive marketplace volume face severe pricing limitations.
              E-commerce platforms maintain strong incentives to route profitable delivery dense routes internally,
              leaving non-captive 3PLs with fragmented or lower-margin tail deliveries unless shielded by specialized
              enterprise contracts.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP004
          - type: callout
            title: B2B Inventory Restocking as a Defensible Infrastructure Hedge
            body: >-
              Ninja Van's deployment of Ninja Restock and scan-to-print technology leverages existing sorting
              infrastructure to serve FMCG enterprise restocking without requiring separate line-haul networks. By
              enabling less-than-truckload direct-to-store deliveries for national brands like Universal Robina
              Corporation, the firm creates commercial relationships insulated from retail platform checkout
              competition.
            calloutType: insight
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Mechanisms
        blocks:
          - type: paragraph
            body: >-
              Ninja Van generates commercial revenue primarily by charging online merchants, e-commerce platforms, and
              enterprise shippers on a per-consignment basis for last-mile and cross-border express parcel delivery.
              Across its six core Southeast Asian markets—Singapore, Malaysia, Indonesia, Thailand, Vietnam, and the
              Philippines—the company monetizes volume through tiered delivery rates, cash-on-delivery collection fees,
              and fulfillment surcharges. To diversify beyond competitive consumer parcel logistics, Ninja Van launched
              Ninja Restock, a B2B store replenishment service piloted with fast-moving consumer goods manufacturers
              such as Universal Robina Corporation, allowing enterprise clients to co-load partial pallets and pay only
              for utilized vehicle capacity rather than committing to full truckloads. Commercial monetization is
              supplemented by Ninja Direct, which provides cross-border product sourcing, customs clearance, and
              wholesale trade financing for digital merchants.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
