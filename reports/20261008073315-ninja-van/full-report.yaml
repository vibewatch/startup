    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Ninja Van was founded in 2014 by Lai Chang Wen, Shaun Chong, and Boxian Tan. Reuters and independent
              profile sources place the headquarters in Singapore, while a Malaysian group privacy policy describes the
              operating model as third-party delivery for online and offline merchants. The company about page names six
              key markets: Singapore, Malaysia, Indonesia, Vietnam, the Philippines, and Thailand, and says the
              workforce exceeds 5,000. Those scale statements are undated company disclosures rather than independently
              verified current counts. The main website's region-and-language selector is consistent with a localized
              regional operating model, but it does not itself establish shipment volume or active-country coverage.
