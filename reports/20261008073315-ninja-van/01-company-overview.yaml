company:
  name: "Ninja Van"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Ninja Van is a Singapore-headquartered logistics company founded in 2014 by
    Lai Chang Wen, Shaun Chong, and Boxian Tan, with company materials describing
    a six-market Southeast Asian footprint. Public evidence establishes substantial
    historical funding and parcel scale, but the available pool does not establish
    a current valuation, total capital raised, financial performance, board
    composition, or current fully diluted ownership.
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and operating footprint"
    body: >-
      Ninja Van was founded in 2014 by Lai Chang Wen, Shaun Chong, and Boxian Tan.
      Reuters and independent profile sources place the headquarters in Singapore,
      while a Malaysian group privacy policy describes the operating model as
      third-party delivery for online and offline merchants. The company about page
      names six key markets: Singapore, Malaysia, Indonesia, Vietnam, the Philippines,
      and Thailand, and says the workforce exceeds 5,000. Those scale statements are
      undated company disclosures rather than independently verified current counts.
      The main website's region-and-language selector is consistent with a localized
      regional operating model, but it does not itself establish shipment volume or
      active-country coverage.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "capital-and-stakeholders"
    title: "Capital history and stakeholder signals"
    body: >-
      The strongest independent financing record in the assigned evidence is
      historical. Wikipedia's cited chronology reports a $279 million Series D in
      May 2020, and Reuters reported a $578 million late-stage round in September
      2021. Reuters also identified Alibaba as a new investor and GeoPost/DPDgroup,
      Monk's Hill Ventures, and B Capital Group as existing participants. A separate
      registry lists a $2.4 billion September 2021 valuation, but its own page is
      incomplete and contains inconsistent investor counts, so the figure is retained
      only as a low-confidence historical datapoint. No assigned source establishes
      the current valuation, cumulative raised amount, debt, preferences, or fully
      diluted ownership as of the run date.
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "leadership-and-key-person-dependence"
    title: "Leadership and key-person dependence"
    body: >-
      Founder identity is well corroborated, but current governance disclosure is
      thin. Reuters identified Lai Chang Wen as co-founder and group chief executive
      in 2021, and an independent 2026 founder profile describes his prior role as a
      Barclays trader. The available materials do not provide current operating
      responsibilities for Shaun Chong or Boxian Tan, a complete executive roster,
      board membership, independent-director representation, voting control, or
      succession arrangements. The public narrative therefore remains founder-centric:
      Lai is the only founder for whom the pool provides both a leadership title and
      career background. That creates a diligence need around delegation, governance,
      and key-person resilience rather than proof of a governance defect.
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "milestones-and-operating-stress"
    title: "Milestones, adjacency expansion, and operating stress"
    body: >-
      The milestone record shows scale followed by evidence of operating pressure and
      business-model expansion. Reuters reported about two million parcels delivered
      per day in September 2021. Wikipedia records a second 2024 layoff round after an
      earlier reduction and a Vietnam operating suspension associated with delayed
      salaries; because this evidence is an encyclopedia summary rather than the
      underlying reports, both events remain low-confidence adverse signals requiring
      direct verification. In January 2025, Ninja Van Philippines announced a South
      Luzon Ninja Restock trial with Universal Robina Corporation and described a
      scan-to-print capability as still in trial. The juxtaposition suggests regional
      execution risk alongside deliberate expansion from parcel delivery into B2B
      restocking, not evidence that the adjacency is already material or profitable.
    claimRefs:
      - "CO011"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
