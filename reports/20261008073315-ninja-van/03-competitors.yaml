callouts:
  - calloutType: "risk"
    title: "Structural Margin Compression from Platform E-Commerce Insourcing"
    body: "With SPX Express, J&T Express, and Lazada Logistics commanding 67% of regional parcel throughput, independent couriers without dedicated captive marketplace volume face severe pricing limitations. E-commerce platforms maintain strong incentives to route profitable delivery dense routes internally, leaving non-captive 3PLs with fragmented or lower-margin tail deliveries unless shielded by specialized enterprise contracts."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP004"
  - calloutType: "insight"
    title: "B2B Inventory Restocking as a Defensible Infrastructure Hedge"
    body: "Ninja Van's deployment of Ninja Restock and scan-to-print technology leverages existing sorting infrastructure to serve FMCG enterprise restocking without requiring separate line-haul networks. By enabling less-than-truckload direct-to-store deliveries for national brands like Universal Robina Corporation, the firm creates commercial relationships insulated from retail platform checkout competition."
    claimRefs:
      - "CP011"
      - "CP012"
