- id: durability-and-satisfaction
  title: Durability, Satisfaction, and What Public Metrics Can Actually Show
  body: Public durability evidence is decent but indirect. Postman exposes analytics primitives such as active users, active workspaces, API calls, successful users, partner onboarding funnels, and response-code mixes. Customer stories add durable-use proxies such as PayPal’s fork counts, HubSpot’s API-call growth, Medibank’s embedded CI workflows, and ZEISS’s repeated test execution. Reviews across G2, TrustRadius, and Software Advice also show that users keep valuing organization, collaboration, and documentation once they adopt the product. But investors should not confuse these signals with formal retention disclosure. There is still no public NRR, GRR, logo churn, seat expansion, or contract-length dataset that would let an outsider model cohort behavior with precision. The right read is that Postman has strong evidence of repeated operational use and developer habit formation, but weak evidence on monetized durability by segment. That distinction matters because developer love and
    enterprise spend persistence are related, not identical.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
