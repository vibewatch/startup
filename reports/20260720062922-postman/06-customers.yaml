- id: named-customer-proof
  title: Named Customer Proof and Production Usage
  body: The strongest public customer proof comes from organizations whose businesses are already deeply API-centric. PayPal uses Postman to support external and partner developers at global scale and ties the platform directly to lower time to first call, faster testing, and large public-collection fork counts. Autodesk shows how Postman can power partner workspaces and scale partner transactions rather than only internal testing. Medibank demonstrates internal standardization across development and QA with CI/CD and GitHub integration. HubSpot uses a public workspace and workspace analytics to drive and measure developer adoption. ZEISS shows fit in a regulated environment, and Cover Genius shows configuration and partner-integration efficiency gains. These are not all independent sources—most are company-authored case studies—but they are still materially stronger than generic logo walls because they include operational detail, named functions, and concrete outcomes. External customer-domain
    documentation from Autodesk, Box, and Microsoft further strengthens the picture by showing that major API publishers treat Postman collections and workspaces as real onboarding surfaces for developers.
