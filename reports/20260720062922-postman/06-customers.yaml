chapter:
  number: 6
  title: Customers
  summary: 'Postman’s public customer record is unusually rich for a private devtools company because it blends company-scale metrics, public workspace analytics, and detailed customer stories from API-centric enterprises. Official sources point to 40 million developers and 500,000 companies or organizations, while customer stories from PayPal, Autodesk, Medibank, HubSpot, ZEISS, and Cover Genius show real production usage with measurable onboarding and testing outcomes. The biggest remaining weakness is durability transparency: public signals on adoption and usage are strong, but contract length, NRR, churn, and concentration remain largely undisclosed.'
sections:
- id: segmentation-and-scale
  title: Customer Segmentation and Scale
  body: 'Postman’s customer base is best understood as a layered ecosystem rather than as a single buyer segment. The company serves individual developers, internal engineering and QA teams, API platform owners, external developer communities, and partner-facing API programs. Official scale claims are large and reasonably consistent across company properties: 40 million developers and 500,000 companies or organizations. Third-party adoption trackers also support a broad footprint, though they lag and sometimes disagree on absolute counts. Landbase shows thousands of verified named companies and a wide sector mix, while Ramp suggests especially high adoption among enterprise organizations inside its DevOps category. The important diligence takeaway is not the exact vanity metric but the pattern: Postman has penetrated a very wide base of API-related users, and the product appears to cross from hobbyist use into serious enterprise standardization when collaboration, partner onboarding, or
    governance becomes important. That breadth supports a diversified customer funnel even if public contract and spend data remain hidden.'
  claimRefs:
