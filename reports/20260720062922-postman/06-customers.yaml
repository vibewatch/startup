  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: monetized-retention
    missingEvidence: NRR, GRR, logo churn, seat expansion, and contract duration by segment.
    whyItMatters: Public evidence is strong on adoption and workflow value but weak on monetized durability, which is the core customer-quality question for a SaaS investment case.
    diligencePath: Request cohort tables by self-serve, team, enterprise, and partner-program accounts with renewals and seat expansion.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: conversion-from-public-usage
    missingEvidence: Conversion from public workspace and fork usage into paid accounts or expansion ARR.
    whyItMatters: Forks, API calls, and successful responses show engagement, but not whether external developer activity converts into revenue.
    diligencePath: Ask for attribution data linking public workspace usage, public collections, or partner-workspace activity to new pipeline and expansion revenue.
    relatedQuestionRefs:
    - QU008
    - QU014
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: minor
    topic: concentration-disclosure
    missingEvidence: Any public disclosure of top-customer concentration or revenue distribution by vertical/geography.
    whyItMatters: Named logos are broad, but logo breadth is not the same as revenue breadth.
    diligencePath: Request top-10 customer share, vertical mix, and geographic ARR split.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: user-count-drift
    missingEvidence: A reconciled explanation for why official properties cite 40 million developers while some third-party datasets still cite 25 million.
    whyItMatters: The gap probably reflects staleness, but investor materials should still use one canonical scale metric.
    diligencePath: Confirm the latest internally approved scale metrics and the date when they were last updated externally.
    relatedQuestionRefs:
    - QU001
    relatedTableRefs:
    - TU002
  - type: stale
    severity: minor
    topic: post-2026-customer-proof
    missingEvidence: New customer stories or independent customer-domain references published after 2026-07-20.
    whyItMatters: Most current proof is company-authored and benefits from periodic refresh with fresher external corroboration.
    diligencePath: Monitor newly published customer stories, public workspace analytics references, and customer-domain collection docs in the next refresh cycle.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
