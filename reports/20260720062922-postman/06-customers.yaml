- id: expansion-and-friction
  title: Expansion, Concentration, and Procurement Friction
  body: 'The public record suggests a healthy land-and-expand motion. Customer stories repeatedly point to public workspaces, partner workspaces, GitHub integration, monitoring, governance, identity controls, and analytics as the surfaces that move users from simple request sending into broader organizational deployment. That is encouraging because it implies Postman can deepen revenue inside accounts without needing every user to start on an enterprise plan. Public concentration risk looks low: the visible customer set spans payments, healthcare, SaaS, manufacturing, optics, and insurtech, and there is no sign that one or two logos dominate the story. The main commercial risk is at the low end. Reviews and pricing commentary continue to show that some teams experience the platform as heavy or increasingly paywalled once collaboration becomes mandatory. So the customer chapter ends with a split verdict: Postman has unusually strong public production proof and cross-vertical logo breadth,
    but still lacks the hard monetized retention disclosures needed to distinguish broad adoption from broad expansion efficiency.'
