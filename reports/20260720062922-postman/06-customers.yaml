- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Buyer / user / payer
  - Typical use case
  - Scale signal
  - Gap
  rows:
  - - Individual developers
    - 'User: developer; payer: none or manager'
    - Send requests, explore APIs, fork public collections
    - 40M+ developer reach claimed by Postman
    - No public conversion data from individual to paid team
  - - Internal engineering / QA teams
    - 'User: developers and testers; payer: engineering leadership'
    - Shared collections, CI tests, governance, environments
    - Medibank and ZEISS show internal standardization
    - No public seat counts by team size
  - - API platform / partner teams
    - 'User: partner integration and DevRel teams; payer: platform or product'
    - Public workspaces, partner workspaces, onboarding, documentation
    - PayPal, Autodesk, HubSpot, and Cover Genius are strong examples
    - Public sources do not break out revenue by partner-led accounts
  - - Regulated enterprises
    - 'User: engineering plus security and compliance'
    - SSO, SCIM, governance, audit, secure sharing
    - ZEISS and Medibank highlight compliance features
    - No public win-rate data versus security-conscious competitors
  - - External developer communities
    - 'User: third-party developers; payer: API publisher'
    - Fork collections, run examples, reduce TTFC
    - PayPal, Microsoft Graph, Box, Autodesk, and HubSpot all expose official Postman assets
    - No public monetization split between external and internal developer programs
  notes: Segments are inferred from official scale claims, customer stories, and external customer-domain docs. They describe who uses Postman and why, not the exact commercial packaging by account.
