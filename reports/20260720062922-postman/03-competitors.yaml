callouts:
- calloutType: insight
  title: Postman’s true rival is stack fragmentation
  body: No single competitor reproduces the entire Postman pitch, but a buyer can mix design, gateway, testing, and local-client tools to avoid full standardization. That makes cross-workflow context the real moat battleground.
  claimRefs:
  - CP016
  - CP025
  - CP026
  - CP027
  - CP036
- calloutType: strength
  title: Scale and workflow context still separate Postman from point tools
  body: A claimed base of 40M+ users and 500,000 organizations, plus repository and workflow layers, is the clearest public evidence that Postman can compete above the client layer where open-source substitutes are strongest.
  claimRefs:
  - CP016
  - CP028
  - CP030
  - CP037
- calloutType: risk
  title: Public reviews show the moat is not frictionless
  body: Pricing complaints, complexity complaints, and occasional trust damage from cloud data issues mean the installed base does not automatically convert into durable monetization.
