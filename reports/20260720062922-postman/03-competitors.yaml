  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-churn
    missingEvidence: Head-to-head win-rate, replacement, and churn data by competitor and segment.
    whyItMatters: Without competitor-specific retention or displacement data, moat quality remains partly narrative-driven.
    diligencePath: Request competitive intelligence summaries, churn coding, and top-deal battlecards.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: module-attach-rates
    missingEvidence: Attach rates for repository, workflows, AI features, and enterprise controls within paying accounts.
    whyItMatters: The moat thesis depends on customers buying more than the client layer.
    diligencePath: Request product adoption dashboards by plan and account cohort.
    relatedQuestionRefs:
    - QP021
    - QP024
  - type: stale
    severity: minor
    topic: future-ai-moves
    missingEvidence: A post-2026 roadmap showing how rivals respond to Agent Mode and AI Engineer.
    whyItMatters: AI positioning is moving quickly and could reshape the rivalry set within one refresh cycle.
    diligencePath: Monitor competitor launch pages and next-year user conferences.
    relatedQuestionRefs:
    - QP015
    - QP025
  - type: private-evidence-only
    severity: material
    topic: price-elasticity-vs-free-tools
    missingEvidence: Conversion and downgrade behavior among free, Solo, and Team users facing open-source alternatives.
    whyItMatters: Low-end commoditization is the most obvious monetization risk in the public record.
