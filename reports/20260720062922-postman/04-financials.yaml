- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Top-of-funnel scale
    - 40M+ developers, 500k+ organizations, 98% of Fortune 500 in official positioning
    - Medium
    - A huge installed base can lower customer acquisition cost if conversion is efficient
    - Provide active monthly users, active workspaces, and paid-account conversion rates
  - - Collaboration pain proxy
    - 93% of teams struggle with API collaboration in the 2025 State of API report
    - Medium
    - Supports willingness to pay for shared workflows and governance
    - Show which collaboration features correlate most with paid conversion
  - - API monetization demand proxy
    - 65% of organizations generate revenue from APIs
    - Medium
    - Suggests paid API platforms can map to business-critical workflows
    - Disclose enterprise buyer mix and revenue concentration by use case
  - - Gross margin benchmark
    - GitLab 2026 companyfacts imply roughly 87% gross margin on $955.2M revenue
    - Medium
    - Late-stage devtools SaaS can be very high margin even while still investing heavily
    - Disclose Postman gross margin and hosting/support burden by plan
  - - Sales intensity benchmark
    - GitLab 2026 companyfacts show $434.7M selling and marketing expense
    - Medium
    - Scaled devtools SaaS is often go-to-market intensive even when capex-light
    - Provide CAC, payback, and S&M as a percentage of revenue
  - - Revenue-per-employee estimate
    - Growjo estimates $228.8k revenue per employee on $506.1M revenue and 2,212 employees
    - Low
    - Useful only as a rough external efficiency datapoint because the inputs are disputed
    - Replace with audited headcount and LTM revenue per FTE
  notes: Most unit-economics metrics are absent from public disclosures, so this table mixes official demand proxies with public-comp and database proxies. Low-confidence rows should be replaced by management data in diligence.
