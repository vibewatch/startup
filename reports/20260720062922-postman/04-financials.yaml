company:
  name: Postman
chapter:
  number: 4
  title: Financials
  summary: Postman's public financial picture is directionally strong but still too opaque for clean underwriting. Official pricing and product pages show a classic freemium-to-enterprise SaaS model, while third-party datasets imply revenue scaled from roughly $102.7 million in 2022 to $171.7 million in 2023 and $313.1 million in 2024. The main complication is that other secondary-market reporting placed 2024 ARR materially lower, around $120-150 million, suggesting either definitional mismatch or weaker monetization than headline user growth implies.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Architecture
  body: 'Postman monetizes as a cloud software platform with a large free top of funnel and progressively higher paid collaboration, governance, and AI tiers. The live pricing page shows a 2026 structure of Free, Solo, Team, and Enterprise plans, with paid upgrades unlocking collaboration, governance controls, larger AI-credit pools, and more operational limits. Product pages for Enterprise, Workspaces, and the API Repository make clear that the monetizable surface is not just sending requests; it is shared asset management, private API discovery, governance, and organization-wide workflow context. That matters because the company''s user growth is already enormous. A free plan can still seed adoption, but revenue has to come from converting API work from an individual utility into a system of record for teams and enterprises. External pricing commentary from Apidog and Dev Tools is self-interested and low-confidence, but it is directionally useful because it highlights exactly where Postman
    is pushing harder on monetization in 2026: collaboration now starts at the Team tier, not the old small-team free motion. The core financial question is therefore not whether Postman has reach; it is whether collaboration, governance, and AI assistance produce enough durable willingness to pay across that reach.'
  claimRefs:
