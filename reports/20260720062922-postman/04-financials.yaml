  - type: private-evidence-only
    severity: material
    topic: retention-and-discounting
    missingEvidence: Net revenue retention, gross revenue retention, cohort expansion, and realized discounting by plan.
    whyItMatters: List pricing says little about revenue quality without retention and ASP realization.
