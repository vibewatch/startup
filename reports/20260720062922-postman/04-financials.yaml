- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Plan / mechanism
  - List price or status
  - Included monetization lever
  - What it signals
  - Source / caveat
  rows:
  - - Free
    - $0
    - Solo usage, limited AI credits, top-of-funnel adoption
    - Still optimized for adoption, but collaboration has been carved out
    - Official pricing page is authoritative; external blogs highlight 2026 packaging changes
  - - Solo
    - $9 per user/month annual
    - Adds higher AI-credit pool and individual premium features
    - Targets power users before team standardization
    - Price is explicit on official page; realized usage is undisclosed
  - - Team
    - $19 per user/month annual
    - Cheapest path to multi-user collaboration and shared workspaces
    - This is the real entry point for paid collaboration
    - Multiple external reviews flag this as the conversion cliff for small teams
  - - Enterprise
    - $49 per user/month annual plus sales-led packaging
    - Adds Private API Network, org controls, governance, and higher pooled AI credits
    - Supports larger ACVs and stronger switching costs
    - Actual enterprise discounting and true average selling price are unknown
  - - AI overages
    - $0.05, $0.04, or $0.035 per credit by tier on the live page
    - Usage-based upsell on top of seat revenue
    - Can raise ARPU if AI features become habitual
    - Public sources do not disclose current attach or overage contribution
  notes: Pricing is list pricing captured from the live 2026 page and triangulated with external commentary on the March 2026 packaging changes. It does not represent realized net pricing after discounts.
