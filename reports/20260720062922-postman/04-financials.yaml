callouts:
- calloutType: strength
  title: Freemium at unusual scale
  body: Postman already appears to own a massive developer top of funnel, which can make monetization more efficient than field-sales-only SaaS models if paid conversion and expansion are healthy.
  claimRefs:
  - CI006
  - CI014
  - CI020
- calloutType: risk
  title: Monetization proof still trails adoption proof
  body: Public user and organization counts are much more mature than public economics. Revenue, ARR, NRR, burn, and realized pricing remain under-disclosed relative to company scale.
  claimRefs:
  - CI031
  - CI032
  - CI040
- calloutType: recommendation
  title: Treat list pricing as packaging, not economics
  body: The live pricing page is useful for understanding strategy, but an investment decision should rely on realized ASPs, discounting, retention, and gross margin, not on list prices alone.
  claimRefs:
  - CI003
  - CI004
  - CI038
  - CI040
