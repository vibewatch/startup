- id: public-traction-and-financial-verdict
  title: Public Traction, Revenue Quality, and Bottom-Line Verdict
  body: 'The best public growth line available is still the Latka sequence: roughly $52 million in 2021, $102.7 million in 2022, $171.7 million in 2023, and $313.1 million in 2024. If directionally correct, that would make Postman a very large private devtools SaaS company with meaningful scale and still-strong expansion. But the number set is not clean. Growjo publishes a much higher forward revenue estimate and a very different employee count; Economic Times cites people close to the company''s financials who estimated only $120-150 million of annualized recurring revenue and explicitly tied the gap to slower-than-expected monetization. Those are not rounding differences. They suggest either different definitions, different periods, or a real mismatch between user adoption and paid revenue conversion. Secondary-market valuation trackers then show wide dispersion in implied marks, which is exactly what one would expect when the business is private, liquid discovery is thin, and official
    financial reporting is absent. The practical verdict is that Postman probably has attractive gross-margin potential and large enterprise monetization upside, but revenue quality, retention quality, and current cash efficiency remain unresolved until management shares audited or banker-grade operating data.'
