- id: cost-structure-and-capital-adequacy
  title: Cost Structure, Margin Path, and Capital Adequacy
  body: 'Postman''s delivery model should be structurally capex-light. Nothing in the public product record points to inventory, hardware manufacturing, project finance, or heavy on-premise service delivery. The platform is delivered as software, with value concentrated in cloud collaboration, repository management, monitoring, documentation, governance, and AI-assisted productivity. That does not mean the company is cheap to run. The more relevant public benchmark is a scaled devtools SaaS comp like GitLab, whose 2026 SEC XBRL disclosures show high gross profit but also continued heavy spending on selling, marketing, and R&D. Postman is earlier and private, so its exact ratios could differ materially, yet the likely shape is similar: gross margins should be attractive, while growth investment remains people-intensive rather than asset-intensive. Capital adequacy is much harder to judge. Postman has not publicly disclosed cash, burn, debt, or runway, and recent secondary transactions do
    not put money into company coffers. The 2021 Series D and the absence of any later primary round imply the current balance sheet has had to carry the company through a long valuation reset cycle. Without management data, investors can only say that the business looks operationally capital-light but disclosure-light on liquidity.'
