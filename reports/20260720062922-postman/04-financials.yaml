tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue stream
  - Mechanism
  - Current public value / status
  - Revenue quality read
  - Diligence ask
  rows:
  - - Free-to-paid seat conversion
    - Solo or Team upgrades from free users
    - Very large top of funnel; 40M+ developers and 500k+ organizations in official positioning
    - Potentially strong if collaboration pain converts into paid seats; unproven publicly
    - Request free-to-paid conversion, active team workspace count, and seat-expansion cohorts
  - - Team subscriptions
    - Per-user annual plan for collaboration
    - Team listed at $19 per user/month billed annually
    - Good recurring profile if expansion and retention are healthy
    - Provide average paid seats per account, churn, and discounting by segment
  - - Enterprise subscriptions
    - Per-user enterprise plan plus governance and org controls
    - Enterprise listed at $49 per user/month billed annually plus contact-sales motion
    - Likely highest-ACV stream with better retention and governance stickiness
    - Break out enterprise ARR, contract length, and percentage of seats under annual commitments
  - - AI credit overages
    - Usage-based consumption above plan allotments
    - Pricing page lists pay-as-you-go AI overages
    - Adds incremental monetization but may still be early and volatile
    - Show AI-credit consumption, overage attachment, and margin profile
  - - API program expansion
    - Partner APIs, private networks, monitoring, governance, and repository adoption inside large accounts
    - Enterprise page explicitly ties partner APIs and scale programs to monetization outcomes
    - Could support land-and-expand economics if modules attach after initial adoption
    - Disclose attach rates for governance, monitoring, and API network features
  notes: Rows summarize how Postman converts developer adoption into recurring SaaS revenue. Public sources describe the mechanisms but do not disclose realized mix or net retention by stream.
