  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, free cash flow, debt, and board runway planning.
    whyItMatters: Capital adequacy is the single biggest unresolved financial underwriting question for a late-stage private company in a reset valuation market.
    diligencePath: Request the latest board package or monthly management reporting with cash, burn, and base/stress runway assumptions.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: arr-vs-revenue-bridge
    missingEvidence: A reconciled bridge between Latka revenue estimates, the Economic Times ARR estimate, and any internal ARR definition.
    whyItMatters: The gap materially changes how investors interpret monetization quality and entry multiples.
    diligencePath: Obtain banker or CFO materials that define ARR, GAAP revenue, billings, and deferred revenue consistently.
    relatedQuestionRefs:
    - QI010
    - QI012
    relatedTableRefs:
