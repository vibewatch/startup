- id: TI004
  title: Capital Adequacy Table
  columns:
  - Item
  - Public value / status
  - What is known
  - Implication
  - Diligence ask
  rows:
  - - Total funding
    - ~$433M to $434M
    - GetLatka, Craft, and Tracxn cluster around this lifetime total
    - Meaningful historical capitalization, but not a current liquidity answer
    - Reconcile total primary capital, secondary volume, and remaining balance-sheet cash
  - - Last primary round
    - $225M Series D at $5.6B in August 2021
    - Official blog and TechCrunch corroborate the event
    - No later primary round found, so 2021 cash has had to stretch across the reset cycle
    - Request current cash balance and board-approved financing plan
  - - Secondary activity
    - Discounted secondary trades reported in 2024-2026
    - Economic Times and valuation trackers show pricing pressure but no cash to company
    - Secondary liquidity can help employees/investors but does not fund operations
    - Break out primary versus secondary liquidity and any tender mechanics
  - - Debt / project finance
    - No public debt or project-finance obligation found
    - The software model does not obviously require asset-backed financing
    - Positive sign for capital intensity, but absence of evidence is not proof of zero debt
    - Confirm whether venture debt, credit lines, or off-balance-sheet commitments exist
  - - Cash / burn / runway
    - Undisclosed
    - No public source reviewed disclosed current cash, burn, or runway
    - This is the main blocker to underwriting capital adequacy from open sources
    - Provide monthly burn, free cash flow, runway, and next-round triggers under base and stress cases
  notes: Capital adequacy cannot be closed from public sources. Secondary-market commentary is useful for price discovery but not for liquidity because those trades do not add operating cash.
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI030
  - CI031
  - CI040
- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Why it matters
  - Current public signal
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Audited ARR / revenue bridge
    - Needed to reconcile conflicting outside estimates
    - Latka, Growjo, and ET imply very different scale numbers
    - Without a bridge, current revenue quality stays uncertain
    - Obtain management financial pack and banker deck with ARR, revenue, and billing definitions
  - - Gross margin
    - Determines how much room Postman has to spend on AI, support, and sales
    - No public company disclosure found
    - Margin path is inferred rather than measured
    - Request gross margin by product, hosting spend, and support/service burden
  - - Net revenue retention / churn
    - The core test of land-and-expand durability
    - No public NRR, GRR, or cohort disclosures found
    - Seat growth may look strong while net retention disappoints
    - Request logo churn, seat churn, NRR, and enterprise cohort expansion
  - - Cash balance and runway
    - Capital adequacy is unknowable without it
    - No public cash or burn data reviewed
    - Investors cannot assess financing urgency
    - Request monthly burn, cash, and downside runway assumptions
  - - Discounting and realized ASPs
    - List pricing is not economic truth for late-stage enterprise SaaS
    - Only list pricing is public
    - Revenue multiples and conversion efficiency may be overstated if discounts are deep
    - Request ASP by plan, average discount rate, and channel / direct mix
  notes: Every row here is a real underwriting blocker rather than a cosmetic omission. The public record is rich on product and pricing, but thin on realized economics.
  claimRefs:
  - CI024
  - CI031
  - CI032
  - CI038
  - CI040
