  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台覆盖面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Postman 现在把自己营销成覆盖完整 API 生命周期的统一平台，而不是单一 API 客户端。产品页把设计、测试、文档、监控、治理、协作和 AI
              打包到一个表面里；存储库页面也说明，这些不是挂在断裂数据上的独立附加件。平台围绕集合、规范、环境、工作区和存储库状态展开，这些资产可以在设计、测试、发布和监控之间复用。对用户而言，产品叙事是减少工具碎片化，并让
              API 工作保持同步。对买家而言，Postman 试图销售的是 API 工作的记录系统。这一转变重要，因为它解释了 Postman
              为什么能在不放弃原始请求运行器切入点的情况下，持续扩大平台足迹。客户工作流从请求和集合开始，但可变现价值越来越多地落在共享上下文、可审阅性和组织可见性上，而不只是原始请求发送。
            claimRefs:
              - CE001
              - CE002
              - CE003
