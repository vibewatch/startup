      - number: '5.3'
        title: AI 原生方向与 2026 发布弧线
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年最重要的技术故事，是 Postman 正围绕 AI 原生上下文重做产品。Agent Mode 已经能跨集合、规范、环境和历史行动。Postbot 处理请求排障、测试生成、文档和可视化。AI
              Engineer 再上一个层级，使用常驻上下文图、沙盒执行和审核队列控制，帮助团队探索系统、运行 QA、处理 PR。2026 年 3 月 roadmap 和之后的“new
              Postman”发布，把这套逻辑扩展到完整平台：API Catalog 成为实时地图，本地和 CI 模拟服务器连接开发与测试循环，统一工作台把集合、规范、模拟、Flows
              和文件放在一处。结果是，产品不再只是帮助开发者发起 API 调用；它试图成为人类和智能体理解并改变 API 系统的上下文层。这个野心有差异化，但也抬高了对可靠性、权限和信息架构的要求。
