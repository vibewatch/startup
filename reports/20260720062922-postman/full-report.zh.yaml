              项目。官方规模声明很大，并且在公司资产之间相当一致：40 million 开发者和 500,000 家公司或组织。第三方采用跟踪器也支持其广泛足迹，尽管它们滞后，且有时在绝对数量上不一致。Landbase
              显示数千家已验证具名公司和广泛行业组合，Ramp 则暗示在其 DevOps 品类中的企业组织采用尤其高。重要的尽调结论不是精确虚荣指标，而是模式：Postman 已经渗透了非常广泛的 API
              相关用户基础；当协作、合作伙伴接入或治理变得重要时，产品似乎会从爱好者使用跨入严肃企业标准化。即使公开合同和支出数据仍被隐藏，这种广度也支持一个多元化客户漏斗。
