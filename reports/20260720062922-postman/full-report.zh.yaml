      - number: '5.2'
        title: 架构、格式与生态工具
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的架构模式，是 Postman 已经围绕可复用资产模型标准化。集合仍是基本单元，变量跨环境界定行为，API Repository 充当中央对象存储，构建器、网络、监控器和 AI
              功能都围着它运行。schema site、Collection SDK、openapi-to-postman converter、Newman CLI 和 Postman API 都指向同一个方向：Postman
              希望自己的对象足够可编程、可携带，可以插入更广的工程工作流；同时又足够一致，让团队留在共同格式族里。原生 Git 工作流和 Collection v3 的推进进一步靠近代码相邻开发，降低了“Postman 只在云
              UI 里好用”的批评。即便如此，设计仍带有明确取向。最丰富的价值依赖资产住在或同步经过 Postman 控制平面，治理、编目、权限、评论和 AI
              才能作用于这些资产。这对企业标准化是优势，对偏好更薄本地优先工具链的团队则是取舍。
