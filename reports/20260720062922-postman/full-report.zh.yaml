      - CV020
      - CV027
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV005
    title: 投资逻辑破裂与终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新股轮或要约定价低于当前老股集群
        - 投后低于 ~$2.0B
        - 确认下调重定价的不只是老股跟踪器，而是整个市场
        - 将估值立场重估为“昂贵”，并重审头寸规模
      - - 披露收入显著低于低位估计
        - FY2025/2026 ARR 低于 ~$120M
        - 连本章敏感性区间中的悲观收入假设也被打穿
        - 在完成更完整的收入调和前，将建议调向回避
      - - 到 2027 年仍无资本事件或经审计披露
        - 再过 24+ 个月仍没有任何新融资 / 披露信号
        - 披露缺口继续拉长，已经无法给出锁价判断
        - 维持观察 / 继续研究；不要仅因时间推移就上调建议
      - - 老股折价明显扩大，超出当前区间
        - 新成交价较 2021 年标记折价超过 ~50%
        - 会让 Postman 接近甚至超过 PitchBook 统计的 2021 年同批平均下调幅度
        - 按悲观情景得到验证处理，并相应重配概率
      - - 治理或安全事件在当前风险记录上继续叠加
        - 新的重大泄露、诉讼败诉或领导层离职
        - 会叠加到风险章节已有的中等严重度风险集群，并可能损害企业信任
        - 将风险评级上调至高 / 危急，并暂停任何新承诺
      - - 确认 IPO 申报或路演公告
        - S-1 申报或公开路演披露
        - 经审计且监管审核过的数据会替代本章披露缺口
        - 一旦有申报级数据，完整重跑本估值章节分析
    notes: 这些触发器按投资人可监控的公开证据阈值设定；截至 2026 年 7 月访问日期均未发生。
    claimRefs:
      - CV042
      - CV044
      - CV021
      - CV024
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径 / 负责人
    rows:
      - - 经审计或管理层审阅的收入
        - GAAP 收入、按分部划分的 ARR，以及对 2024 年 $120-150M vs. $313.1M 两组估计的调和
        - 决定估值敏感性区间哪一端更现实
        - 通过管理层数据室或签署 NDA 覆盖的财务包索取
      - - 股权结构表和清算优先权
        - 当前董事会构成、优先股堆叠、股息和参与分配条款
        - 会改变下行情景或收购情景下普通股实际回款
        - 向公司律师索取股权结构摘要，或通过有数据访问权的老股市场中介获取
      - - 已确认 2025-2027 年新股融资或要约
        - 2021 年 Series D 之后任何定价轮、结构化融资或公司发起的要约
        - 会用市场出清信号替代陈旧的 2021 年定价和稀薄的老股跟踪估计
        - 监控 SEC EDGAR、新闻稿和老股市场平台；直接询问公司 IR
      - - 留存和扩张指标
        - 净收入留存、客户 logo 留存，以及按分部划分的客户集中度
        - 验证较高的 GetLatka 收入轨迹是否可持续，还是由一次性扩张前置拉动
        - 索取队列级留存数据，或开展客户访谈计划
      - - AI 功能变现证明
        - Agent Mode / AI Engineer 的采用率、ARPU 提升或附加销售率数据
        - 检验近期 AI 投资是在守住或扩大护城河，还是在面对商品化定价压力
        - 索取产品使用遥测，或围绕 AI 功能变现开展管理层问答
      - - IPO 或战略退出意图
        - 任何内部时间表、投行接触或路演规划信号
        - 决定短期流动性事件是否足够现实，可纳入回报模型
        - 直接询问管理层或接近董事会的消息源；每季度监控 EDGAR S-1 申报
    notes: 这些问题按它们对本章估值区间的直接影响排序，而不是按获取难度排序。
    claimRefs:
      - CV043
      - CV044
      - CV039
      - CV042
