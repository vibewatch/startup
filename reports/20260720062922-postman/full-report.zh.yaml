      - number: '8.5'
        title: 可比估值视角
        blocks:
          - type: paragraph
            body: >-
              没有一个公开或私有同行能完全匹配 Postman 的产品组合和披露画像，因此本章混合使用几个视角。直接私有融资方面，Postman 自己竞争集合中点名的 Kong Inc. 于 2024 年 11 月完成
              $175 million Series E，估值 $2 billion，由 Tiger Global 领投、Balderton 联合领投；这说明品类层面的私人资本通道并未消失。相邻的 API
              生命周期与质量工具厂商 SmartBear 仍由 Francisco Partners 和 Vista Equity Partners 各半持有，完全没有披露估值，显示部分 PE 持股同行对外披露得多么有限。


              公开可比公司方面，GitLab 的市值约为其 $955.2 million 2026 财年收入的 5.8x（市值 $5.52 billion）；Atlassian 对 $6.19 billion
              过去十二个月收入的直接披露市销率为 3.82x（市值 $23.67 billion，同比下跌 52.65%）；Datadog 的市值约为其 $3.67 billion 过去十二个月收入的 25x（市值
              $92.08 billion）。超过 6x 的跨度说明，相比平面的行业倍数，增长质量和品类位置更重要。IBM 以约 $11 billion 收购 Confluent，约为其披露收入运行率的 11x，也为数据 /
              API 基础设施资产提供了战略买方 M&A 锚点。合起来，这些视角给出可行倍数边界，但无法解决 Postman 自身应该按哪一个倍数交易。
