      - number: '2.3'
        title: 买家、用户与需求驱动
        blocks:
          - type: paragraph
            body: >-
              Postman 自己的调查数据提供了最强的公开需求驱动信号。测试、开发和文档占用 API 团队大量时间，93% 的团队又表示协作仍然困难，这让协调痛点变成真实问题，而不是营销文案。同一份报告认为，API
              正在从成本中心管道转向收入资产：65% 的组织现在从 API 创收，其中多数还从 API
              获得有意义的公司收入占比。这把买家从一线开发者扩展到平台负责人、架构团队、产品负责人、安全和治理利益方，他们关心可发现性、复用和政策控制。Postman 的 Free、Solo、Team 和 Enterprise
              包装也显示出买家阶梯：个人可以低成本开始，但真正的变现机会在组织标准化。AI 进一步强化了这一点，因为当智能体调用 API 时，文档完善、受治理、可发现的接口价值会明显上升。
