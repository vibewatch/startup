        - label: 2021 年 Series D 峰值（参考）
          value: 5.6
          detail: 已确认的新股轮估值，不是当前估计。
          tone: positive
    approximationNotes: 收入 x 倍数柱只是供投资委员会讨论的简单桥接输出，不是折现现金流或公司指引数字；单位为十亿美元。
    claimRefs:
