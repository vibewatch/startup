    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与规模
        blocks:
          - type: paragraph
            body: >-
              Postman 最适合被理解为统一 API 平台，而不是单一测试工具。官方关于页面和产品页面把它描述成一个用于构建和使用 API 的平台，覆盖设计、测试、分发、文档、监控和治理；定价页也清楚显示，Postman
              跨免费、个人、团队和企业层级变现。公司称现在服务超过 40 million 用户和 500,000 个组织，包括 98% 的 Fortune 500，这把平台定位成 API
              工作的广义记录系统层，而不是一个点状工具。Craft 和 LinkedIn 佐证了公司的私有状态、San Francisco 总部和全球足迹，不过最新规模指标仍主要来自公司披露，并非独立审计。LinkedIn
              2026 年 7 月页面给出了最强的当前员工数信号：3,523 人；这个方向上与 Postman 成长期办公室扩张和 2025 年总部公告一致。
