            body: Postman 在本章访问日期前约八个月内，宣布与 Microsoft、Anthropic 的 AI 合作集成，并完成两笔收购（Fern、liblab）；虽然 2021 年后没有新资本事件确认，产品侧仍有动能。
            calloutType: strength
            claimRefs:
              - CV039
              - CV040
          - type: callout
            title: 继续研究，不是买入或回避
            body: 收入估计相差超过 2x，治理 / 优先权条款未披露时，强融资历史和可比市场通道不足以支撑锁价下注；与证据一致的结论是以中等置信度继续研究。
