      - number: '1.3'
        title: 融资、估值与披露质量
        blocks:
          - type: paragraph
            body: >-
              Postman 的资本历史已经由其 2021 年公告和 TechCrunch 报道充分确立。公司完成由 Insight Partners 领投的 $225 million Series D，估值 $5.6
              billion；GetLatka、Craft 等第三方数据库也都指向约 $433 million 的累计融资。更不确定的是当前变现水平。Economic Times 报道称，近期老股交易相对 2021 年估值以
              30-40% 折价成交，并援引了解公司财务的人士，把年经常性收入（ARR）定在 $120-150 million。相比之下，GetLatka 估计 2024 年收入为 $313.1 million，此前估计
              2023 年收入为 $171.7
              million。这些数字不是小差异：前者暗示，相对于过大的上一轮估值，变现速度偏慢；后者则暗示规模大得多。在没有经审计收入、烧钱速度、利润率或留存披露之前，合理姿态是把两者都当成有用但低置信度的信号，避免把任一估算过度嵌入核心公司快照。
