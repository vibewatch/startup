      - number: '2.4'
        title: 约束、商品化与可投资切片
        blocks:
          - type: paragraph
            body: >-
              关键市场约束在于，并不是每一美元 API 工作流支出都属于 Postman。Insomnia、Bruno、Hoppscotch 等开源和本地优先工具，让个人或小团队很容易完全绕开 SaaS
              支出；Stoplight 和 Swagger 继续争夺设计预算，Kong 则让基础设施预算与协作支出分离。公开评论又增加了第二层摩擦：一些用户认为 Postman
              越来越按企业级定价，另一些用户反馈大型集合或成熟工作区会变慢、变压迫。最后，AI 在抬高市场机会的同一时刻也抬高治理风险。Postman 自己的报告显示，团队更担心未经授权的智能体访问，安全团队也把 AI
              智能体就绪度当成真实运营议题。因此，可投资市场不是 API 相关活动的整体大盘，而是其中协作、治理和工作流自动化价值足以支撑付费平台标准化的子集。这个更高价值层，正是企业预算、政策需求和 AI
              工作流复杂度在今天实际压过免费工具替代品的地方。
            claimRefs:
