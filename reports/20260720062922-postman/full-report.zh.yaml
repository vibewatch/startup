        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 公共工作区凭证泄露
          values:
            - label: 高
              tone: negative
              detail: 第三方研究反复记录密钥暴露。
            - label: 严重
              tone: negative
              detail: 可直接让未经授权者访问系统和数据。
            - label: 中
              tone: warning
              detail: 控制措施存在，但仍高度依赖用户行为。
            - label: 高
              tone: negative
              detail: 仍是公开记录中最清晰的单一风险。
        - label: 第三方供应商事件
          values:
            - label: 中
              tone: warning
              detail: Klue 事件证明风险真实存在。
            - label: 高
              tone: negative
              detail: 即便核心平台未被攻破，信任也会受损。
            - label: 中
              tone: warning
              detail: 已有门户透明度和事件响应机制。
            - label: 中高
              tone: warning
              detail: 剩余暴露仍分布在各子处理方。
        - label: AI 权限 / 治理漂移
          values:
            - label: 中
              tone: warning
              detail: AI 暴露面扩张很快。
            - label: 高
              tone: negative
              detail: 一次有问题的自动化操作可能迅速影响大量资产。
            - label: 早期
              tone: warning
              detail: 公开材料描述了控制措施，但内部细节不足。
            - label: 中高
              tone: warning
              detail: 需要更深的技术尽调。
        - label: 本地优先竞品替代
          values:
