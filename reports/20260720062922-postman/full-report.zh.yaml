      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              本章证据支持对 Postman 采取“继续研究 /
              观察”的建议，置信度中等，风险评级中高，估值立场介于合理和偏高之间，且高度取决于投资者相信哪一个收入估计。这种姿态不是为对冲而对冲：它直接来自把强且相互印证充分的融资与规模证据，和公开来源无法填补的收入、治理、资本事件缺口放在一起比较。本章流程图的建议逻辑追踪的正是这条链：一边是融资和可比市场证据，另一边是收入与治理披露缺口，最后得出的是对价格敏感、而非对公司好感敏感的判断。


              投资 KPI 记分卡反映同样的不对称：融资历史和可比市场准入得分都高；老股市场支撑处在中位（低于峰值，但高于 2021 年独角兽整体减记均值）；收入清晰度、治理清晰度和退出准备信号得分都低。截至 2026 年 7
              月访问日期，没有已确认的 IPO 申报、路演或新融资事件；以公司名检索 EDGAR，也未返回 S-1
              申报。在收入、股权结构表或资本事件三个缺口至少填补一个之前，目标回报、持有或退出立场都无法负责任地量化；在此之前，合适动作是跟踪仓位，并在出现可披露级新证据时立即重审结论。
