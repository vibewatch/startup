            body: >-
              目前最好的公开增长线仍是 Latka 序列：2021 年约 $52 million，2022 年 $102.7 million，2023 年 $171.7 million，2024 年 $313.1
              million。如果方向正确，Postman 就是一家非常大型的私有开发者工具 SaaS 公司，规模有意义，扩张仍强。但这组数字并不干净。Growjo
              发布了高得多的前瞻收入估算和非常不同的员工数；Economic Times 援引接近公司财务的人士，估计年化经常性收入只有 $120-150
              million，并明确把差距归因于低于预期的变现速度。这些不是四舍五入差异。它们暗示口径不同、期间不同，或者用户采用与付费收入转化之间真的不匹配。随后，二级市场估值跟踪器显示隐含标记大幅分散；当公司是私有、流动性发现很薄、官方财务报告缺席时，这正是可以预期的结果。实际判断是，Postman
