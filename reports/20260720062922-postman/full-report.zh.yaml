companyProfile:
  summary: >-
    Postman 是一家私有 API 平台公司，2014 年成立，目前总部位于 San Francisco。公司最初是一个简化 API 测试的开发者工具，后来扩展成覆盖 API 设计、文档、测试、监控、存储库管理、工作流编排和 AI
    辅助 API 工作的广义生命周期平台。公开来源显示，Postman 被非常广泛采用——超过 40 million 用户和 500,000 个组织——并且有可观的企业渗透；但财务和治理画像仍不透明。自 2021 年以 $5.6
    billion 估值完成 $225 million Series D 以来，Postman 增加了 AI 原生产品层，并收购 Orbit、liblab 和 Fern，拓宽社区、SDK 与文档工作流。
  foundedDate: '2014-01-01'
  founders:
    - name: Abhinav Asthana
      role: 联合创始人兼 CEO
      background: 把 Postman 作为简化 API 测试的副业项目做出来，至今仍领导公司。
