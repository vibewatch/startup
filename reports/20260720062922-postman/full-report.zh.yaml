      - number: '4.3'
        title: 成本结构、利润率路径与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Postman 的交付模式在结构上应当是轻资本开支。公开产品记录中没有任何迹象指向库存、硬件制造、项目融资或重型本地部署服务交付。平台以软件形式交付，价值集中在云协作、存储库管理、监控、文档、治理和 AI
              辅助生产力上。这并不意味着公司运营便宜。更相关的公开基准是 GitLab 这样的规模化开发者工具 SaaS 可比公司；其 2026 年 SEC XBRL
              披露显示毛利润高，但销售、营销和研发仍持续重投入。Postman
              更早期且是私有公司，所以具体比例可能有实质差异；但可能的形态相似：毛利率应有吸引力，而增长投入仍偏人力密集，不是资产密集。资本充足性更难判断。Postman
              没有公开披露现金、烧钱速度、债务或现金跑道，近期老股交易也不会把钱放进公司账上。2021 年 Series D
              和之后没有新股融资，意味着当前资产负债表必须扛着公司穿过一段漫长估值重置周期。没有管理层数据，投资者只能说，这门生意在运营上看起来轻资本，但在流动性披露上很轻。
