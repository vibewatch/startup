          tone: negative
        - label: 高估计 x 低倍数（以 $313.1M 套 3.8x）
          value: 1.19
          detail: GetLatka 收入估计套 Atlassian 类倍数。
          tone: warning
        - label: 高估计 x 中位倍数（以 $313.1M 套 5.8x）
