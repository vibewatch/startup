      - number: '7.3'
        title: 依赖、锁定效应与竞争压力
        blocks:
          - type: paragraph
            body: >-
              Postman 最大的战略依赖不只是 AWS 这类基础设施厂商，还包括把公司做大的那些产品假设：云端托管的共享工作区模型、中心化对象格式，以及越来越由 AI
              介入的工作流。这些假设让很多团队协作起来几乎没有摩擦，也让平台暴露在本地优先挑战者的冲击下。Bruno 坚持只离线、Git 原生，明确反驳云同步风险和厂商托管状态。Thunder Client 从 VS Code
              内部提出同样主张；Insomnia 在 Kong 旗下开始主打灵活存储模式、身份控制和 MCP 支持。GitHub Copilot 又叠加一层压力：它把 AI
              辅助打包进一个大得多的开发者平台。这些替代方案不需要做到完整功能对等才会产生影响。它们只要足够满足更简单的团队、隐私敏感团队或 Git 原生团队，Postman
              相比之下就会显得更重或更贵。低端支付意愿会被削弱；如果组织把请求运行、文档和治理拆到多种工具里，而不是只标准化到 Postman，扩张上限也会被压住。
