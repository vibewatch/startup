      - number: '8.6'
        title: 退出准备度与最终尽调请求
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 7 月访问日期，Postman 没有公开退出准备信号。公司自己的媒体新闻页列出截至 2026 年 4 月的产品和合作公告，没有提到 IPO；一个专门的第三方 IPO
              追踪器返回的是机器人拦截响应，而不是可用数据；将 SEC EDGAR 公司名检索限制在 Form S-1 后，也没有找到匹配的申报人或文件。缺少证据本身值得记录，但不能据此假设 IPO 即将发生或已经被排除。


              本章的否决触发表列出六个具体、可监控阈值：低于 $2.0 billion 的新股定价、披露收入低于悲观情景下限、再过两年仍无资本事件、老股折价显著扩大、治理或安全事件叠加，或确认 IPO
              申报。任何一个出现，都应把建议推向明确方向，而不是触发含糊重估。最终尽调请求表把本章开放问题转成具体要求：经审计或管理层复核、能对齐两个冲突 2024 年估计的收入；当前股权结构表和优先股堆叠摘要；确认
              2025-2027 年是否有任何新股融资或要约流动性交易；留存和集中度指标；AI 功能变现证明；以及 IPO 或战略退出意图的任何信号。即便只解决其中两三个，下一次刷新时本章置信度也会明显更清晰。
