  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、法律与安全暴露
        blocks:
          - type: paragraph
            body: >-
              核心风险主题是，Postman 的增长模型和风险模型部分是同一件事。公共工作区、API
              可发现性、fork、示例和共享集合让接入变快，但也为有效令牌和敏感数据的意外暴露制造了耐久表面。第三方研究者在这里罕见地一致：CloudSEK、Truffle Security、AppSentinels
              和后续报道都描述了公开 Postman 资产上大规模密钥暴露。重要的是，大多数证据并没有指控 Postman
              核心基础设施被黑。更不舒服的结论是，平台让用户很容易快速创造业务价值，因此当共享默认设置、令牌处理或环境语义被误解时，也很容易快速制造业务伤害。法律和监管风险叠加在这个运营现实之上。CCPA、Data
              Privacy Framework 承诺、AI 条款和其他演进中的合同表面意味着，未来任何涉及受监管个人数据或客户凭据的事件，都可能带来超出纯声誉损伤的执法和合同后果。
