  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Postman 作为云软件平台变现，漏斗顶部有庞大的免费用户，再逐步抬升到付费协作、治理和 AI 层级。实时定价页显示，2026 年结构包括 Free、Solo、Team 和 Enterprise
              计划；付费升级解锁协作、治理控制、更大的 AI credit 池和更多运营上限。Enterprise、Workspaces 和 API Repository
              产品页面清楚说明，可变现表面不只是发送请求，而是共享资产管理、私有 API 发现、治理和组织级工作流上下文。这一点重要，因为公司的用户增长已经巨大。免费计划仍能播种采用，但收入必须来自把 API
              工作从个人工具转化为团队和企业的记录系统。Apidog 和 Dev Tools 的外部定价评论带有自身利益，置信度低，但方向上有用，因为它恰好突出 Postman 在 2026 年更用力推动变现的地方：协作现在从
              Team 层开始，而不是过去面向小团队的免费路径。因此，核心财务问题不是 Postman 有没有触达，而是协作、治理和 AI 辅助能否在这种触达上产生足够耐久的支付意愿。
