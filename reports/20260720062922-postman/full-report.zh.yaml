      - number: '1.2'
        title: 领导层、治理与依赖
        blocks:
          - type: paragraph
            body: >-
              公开记录仍把 Postman 与创始团队紧紧绑在一起。关于页面称 Abhinav Asthana 启动了该项目，随后招募 Ankit Sobti 和 Abhijit Kane，三位创始人至今仍领导公司。Craft
              只补充了少数具名高管，包括首席收入官 Zac Auger；但董事会构成、优先股权利和继任规划仍不透明。这种不透明很重要，因为 Postman 当前转向 AI
              原生工作流的产品再定位，以及并购整合计划，看起来都高度依赖创始人愿景。公司规模已经足够大，这种集中并不意味着日常执行脆弱；但董事席位、投票结构或股权结构机制未披露，仍给投资者留下实质性治理尽调缺口。实际来看，公开信息足以确认创始人连续性和企业
              GTM 深度，却不足以支撑对控制权或交接规划的判断。
