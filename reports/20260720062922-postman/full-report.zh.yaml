  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从融资与规模的强证据出发，经过两个未解决证据缺口，落到价格敏感的「继续研究」判断。
    data:
      nodes:
        - id: scale
          label: 融资与规模证据
          detail: 已确认 2021 年 Series D：$225M 融资、$5.6B 估值；累计融资因追踪平台而异，为 $352-433M。
          tone: positive
        - id: comps
          label: 可比公司背景
          detail: Kong（私募估值 $2B）、GitLab（~5.8x）、Atlassian（3.82x）、Datadog（~25x）框定了一个合理倍数区间。
          tone: positive
        - id: secondary
          label: 二级市场信号
          detail: Forge/Yahoo 聚集在 ~$2.22B，过去各观察窗口下降 24-33%；据报道较峰值折价 30-40%。
          tone: warning
        - id: revenue_gap
          label: 收入披露缺口
          detail: GetLatka 为 $313.1M，Economic Times 隐含 2024 ARR 为 $120-150M，二者尚未对账。
          tone: negative
        - id: governance_gap
          label: 治理 / 优先权缺口
          detail: 没有披露股权结构表、董事会构成，也没有确认优先权条款。
          tone: negative
        - id: macro
          label: 宏观折价背景
          detail: PitchBook：2021 年批次独角兽平均折价 -68.2%；Postman 隐含折价约 -60%，幅度小于该平均水平。
          tone: neutral
        - id: decision
          label: 继续研究 / 观察
          detail: 证据支持价格敏感、受披露约束的姿态，而不是买入或回避判断。
          tone: warning
      edges:
        - from: scale
          to: comps
          label: 锚定一组可信可比公司
        - from: comps
          to: decision
          label: 框定区间，但不消除分歧
        - from: secondary
          to: decision
          label: 确认下行重定价
        - from: revenue_gap
          to: decision
          label: 阻碍有把握地选择倍数
        - from: governance_gap
          to: decision
          label: 阻碍有把握地下行情景建模
        - from: macro
          to: secondary
          label: 把跌幅放在板块相对背景下，而非公司特有问题
    approximationNotes: 节点语气反映对证据方向的定性判断，不是打分模型。
    claimRefs:
      - CV001
      - CV020
      - CV024
      - CV025
      - CV043
      - CV044
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 采用哪组收入估计，比选择哪个单一倍数更能左右 Postman 的隐含估值。
