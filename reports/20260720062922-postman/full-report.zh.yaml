      - number: '1.4'
        title: 战略轨迹与品类定位
        blocks:
          - type: paragraph
            body: >-
              公司近期策略，是把 API 协作升级成 AI 原生系统层。Postman 2025 State of the API 报告提出，API 战略正在变成 AI 战略；报告自己的调查数据也把 API
              描述成创收资产，且越来越需要协作和机器可读结构。Postman 随后把这个叙事落进产品：TechCrunch 报道了 2025 年 1 月 AI Agent Builder 的发布，Postman
              自己的材料也推出 Agent Mode 和 AI Engineer，把它们定位成能够跨集合、规范、环境和工作流资产行动的助手。Orbit、liblab 和 Fern 的收购也贴合这条弧线。Orbit
              拓宽社区和开发者互动能力，liblab 增加 SDK 生成，Fern 增加文档和 SDK 自动化。合在一起，这些动作显示 Postman 想占据 API 生产者、API 消费者和将调用这些 API 的 AI
              智能体之间更多表面积。
