          - type: callout
            title: 老股折价与同代减记背景
            body: >-
              Postman 报道中的 30-40% 老股折价是典型老股折价的两到三倍；但把 PitchBook 对 2021 年独角兽的平均 68.2% 减记套到 $5.6B 峰值上，对应约 $1.8B——低于所有已追踪
              2026 年估计。因此，即便下行真实存在，公司表现仍好于同代广义平均。
            calloutType: risk
