      - CV013
      - CV018
      - CV019
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持从悲观到乐观的宽估值带，因为收入基数和适用倍数都存在争议。
    data:
      items:
        - label: 悲观情景
          low: 0.5
          mid: 1.2
          high: 1.8
          displayValue: $0.5B-$1.8B
          detail: 低收入估计、压缩倍数，且/或向 PitchBook 2021 年批次平均折价靠拢。
          tone: negative
        - label: 基准情景
          low: 2
          mid: 2.6
          high: 3.3
          displayValue: $2.0B-$3.3B
          detail: 大致匹配 Forge/Yahoo/Premier Alternatives 二级市场簇。
          tone: warning
        - label: 乐观情景
          low: 4
          mid: 4.8
          high: 5.6
          displayValue: $4.0B-$5.6B
          detail: 收入向 GetLatka 较高估计靠拢，资本事件把公司重估至 UpMarket 模型或 2021 年峰值附近。
          tone: positive
        - label: 2021 年 Series D 峰值（参考，不是情景）
          low: 5.6
          mid: 5.6
          high: 5.6
          displayValue: $5.6B
          detail: 已确认的新股估值；仅作为所有折扣 / 折价数字的固定参考点。
          tone: neutral
    approximationNotes: 区间基于本章有来源支撑的主张搭出情景桥接，用于投资委员会讨论，不是管理层指引或 DCF 输出。
    claimRefs:
      - CV050
      - CV051
      - CV024
      - CV025
      - CV020
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Postman 在融资历史和可比市场可及性上得分较好，但经济性清晰度和治理披露偏弱。
    data:
      items:
        - label: 融资与规模证据
          score: 8
          detail: 已确认 $225M / $5.6B 的 Series D；多个追踪平台给出的累计融资区间一致，约 $352-433M。
          tone: positive
        - label: 可比市场可及性
          score: 7
          detail: 直接竞品 Kong 和相邻上市可比公司在 2026 年仍能拿到可信估值 / 倍数。
          tone: positive
        - label: 二级市场支撑
          score: 5
          detail: 多个追踪平台收敛在 $2.2-3.3B 附近，低于 $5.6B 峰值，但高于 PitchBook 2021 年批次平均折价水平。
          tone: neutral
        - label: 收入清晰度
          score: 3
          detail: 同一 2024 财年，两项独立估计相差超过 2x。
          tone: negative
        - label: 治理 / 优先权清晰度
          score: 2
          detail: 未披露股权结构表、董事会构成，也没有确认清算优先权条款。
          tone: negative
        - label: 退出准备度信号
          score: 3
          detail: 截至 2026 年 7 月访问日，没有确认的 IPO 申请、路演或新融资事件。
          tone: negative
        - label: 证据质量（本章）
          score: 6
          detail: 覆盖 26+ 个域名的 32 个来源，但数个追踪平台存在内部不一致，已在本章主张中明确标出。
          tone: neutral
    approximationNotes: 分数是 0-10 分的分析师判断，综合了本章有来源支撑的主张，不是公司发布或第三方综合评分。
    claimRefs:
      - CV001
      - CV020
      - CV027
      - CV005
      - CV043
      - CV042
      - CV020
