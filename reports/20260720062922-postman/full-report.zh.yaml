  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Postman 实际卖的是什么
        blocks:
          - type: paragraph
            body: >-
              分析 Postman 时，最容易犯的错误是把市场过窄地定义为 API 客户端软件。Postman 的产品页面把它放在更宽的 API 生命周期品类里，包括设计、测试、文档、分发、监控和治理。API
              Repository 与 Flows 页面进一步说明，这不只是一个单用户请求运行器：公司卖的是共享资产管理、可发现性、工作流执行和跨团队可见性。这个更宽的框架很重要，因为市场本身是碎片化的。企业买家可以从
              Swagger 或 Stoplight 采购设计能力，从 ReadyAPI 采购测试，从 Kong 采购网关，从 Insomnia、Bruno 或 Hoppscotch 采购轻量客户端。因此，Postman
              的服务市场更适合被描述为广义 API 管理和 API 开发经济中的协作与工作流中心切片。它赢在组织需要团队与机器之间的共同上下文，而不只是需要一种发起 HTTP 请求的方式。
