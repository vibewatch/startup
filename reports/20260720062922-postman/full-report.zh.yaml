      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设收入更接近 GetLatka 的 $313.1 million 2024 年估计，并且 2026-2027 年的新股轮或 IPO 把公司重新定价到 UpMarket 自己 $4.8 billion
              的模型估计，或回到 2021 年 $5.6 billion 峰值附近；在这条路径下，倍数扩张和收入增长彼此强化，报道中的老股折价也收窄回典型的
              10-15%。基准情景假设收入落在两个冲突估计之间，老股价格只是维持在 Forge、Yahoo Finance 和 Premier Alternatives 已经显示的位置附近——$2.0-3.3 billion
              区间——主要风险在于，没有任何已确认资本事件会让这个标记长期陈旧、实际上无法验证。


              悲观情景假设收入更接近 Economic Times 报道暗示的较低 $120-150 million ARR 估计，并且 Postman 估值向 PitchBook 报告的 2021 年独角兽平均 68.2%
              减记靠拢，对应约 $1.8 billion
              或更低。治理、安全或客户集中度冲击（其中几项已在本报告风险章节中作为未解决的中等严重暴露出现）会加速这条路径。仅凭公开证据，三个情景都无法分配精确概率；但基准情景是多个独立且日期仍新的追踪方最直接印证的情景。
