      - number: '2.2'
        title: 市场规模、增长与估算分歧
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估算方向一致，但量级不同。The Business Research Company、Strategic Market Research、Fortune Business Insights 和
              Mordor Intelligence 都显示未来十年会有双位数或更高增长，但它们给出的 2025 年市场数字从约 $5.24 billion 到 $8.86 billion
              不等。这个跨度太大，不能忽略。它很可能反映了各家在 API 管理软件、API 网关、生命周期工具和企业服务上的口径选择不同。尽调中重要的结论不是单点
              TAM，而是增长方向的一致性：每个来源都指向一个仍随数字化转型、云原生架构和 AI 驱动集成需求扩大的市场。因此，Postman 应被视为处在一个大型且扩张中的品类里，但这个品类边界足够模糊，精确 TAM
              计算会夸大确定性。区间视角比一座带着假精度的单点堆叠金字塔更诚实。
