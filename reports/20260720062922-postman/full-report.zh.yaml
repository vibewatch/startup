      - number: '1.5'
        title: 负面事件与可靠性信号
        blocks:
          - type: paragraph
            body: >-
              最近最有意义的负面信号已经不再是假设。Postman 自己的信任门户表明，第三方 Klue 遭入侵导致 2026 年 6 月 Salesforce 中的客户联系和销售信息被外泄，尽管 Gong
              中的产品或核心客户数据未被访问。CloudSEK、Cyber Security News 和 Treblle 的外部报道也保留了 2024
              年公共工作区暴露事件：数以万计的公开可访问工作区浮现出令牌、密钥和其他敏感材料。这些报道并不意味着 Postman
              本身独特地不安全；相当一部分暴露看起来来自用户行为和薄弱的密钥卫生。但它们确实说明，公共协作带来真实治理风险，尤其是对一个鼓励广泛共享的平台而言。抵消这一点的是，Postman
              状态页在审阅时显示核心服务运行正常，桌面端在过去 90 天窗口中可用时间为 100%。因此风险姿态是混合的：运营连续性强，但平台扩张并变得更智能体化之后，安全治理负担也在上升。
