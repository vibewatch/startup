      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Postman 的每一次估值讨论都必须从同一个锚点开始：2021 年 8 月完成的 $225 million Series D，投后估值 $5.6 billion，由 Insight Partners
              领投，Coatue、Battery Ventures 和 BOND 作为新投资者加入。Forge Global 自己的融资表给出较低的仅新股部分数字（$145 million，$17.54/share，投后
              $5.57 billion）和较低的累计融资数（$352 million，而 Craft.co、GetLatka 和 Inc42 为 $433
              million）。这个缺口最可能反映新股部分与整轮总额的口径差异，而不是已经解决的矛盾；但仅凭公开证据，本章无法完全对齐。


              自 2021 年峰值后，没有新的新股轮得到确认。相反，五个独立老股市场追踪方（Forge、Yahoo Finance、Public.com、Notice.co、Premier Alternatives 和
              UpMarket）现在给出的 2026 年估计大约落在 $2.2 billion 到 $4.8 billion 之间；Economic Times 另行报道，老股交易以较 2021 年标记 30-40%
              的折价成交——这是典型老股折价的两到三倍。因此，入场纪律必须同时计入很宽的估值区间，以及一个未解决、可能为不参与或参与型的优先股堆叠，且没有任何来源完整披露。这正是稀释 /
              优先权悬而未决的类型，任何仓位都应保持价格敏感，而不是按高确信度做大。
            claimRefs:
