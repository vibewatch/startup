      - number: '7.4'
        title: 财务 / 模型风险与投资逻辑破裂指标
        blocks:
          - type: paragraph
            body: >-
              公开记录仍留下一个重要风险未解：经营模型在压力下的韧性。Economic Times 报道了实质性的老股市场折价，ARR
              也显著低于部分外部增长追踪方给出的水平；当前烧钱速度、现金跑道和债务仍未披露。这一点重要，因为信任冲击、定价反弹或企业转化放缓，公司现金充裕时更容易扛过去；如果公司已经面对估值重置，难度会高得多。实际含义是，投资者不应孤立看
              Postman 的风险。公司若缺少财务弹性，安全暴露、低端客户流失，或来自大型平台的 AI
              竞争都会被放大。因此，投资逻辑破裂事件很具体：再次出现大规模凭证暴露循环；有证据显示客户信任长期受损；定价驱动的用户流出更急；或一次融资事件确认公司价值已明显低于上一轮新股估值，同时又没有耐久自由现金流的相应证明。
