          detail: GetLatka 收入估计套 GitLab 类倍数。
          tone: warning
        - label: 当前 Forge/Yahoo 二级市场估值标记
          value: 2.22
          detail: 直接观察到的 2026 年二级市场估值簇。
          tone: neutral
        - label: Premier Alternatives 当前估值数据
          value: 3.3
          detail: 独立追踪平台给出的当前估值（与自身页面标题内部不一致）。
          tone: neutral
        - label: UpMarket 模型估计
          value: 4.8
