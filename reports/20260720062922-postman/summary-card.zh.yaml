  topStrengths:
    - Postman 在同类里拥有最宽的公开可见分发面，用户超过 40M，组织超过 500K。
    - 产品已从请求客户端扩展为覆盖仓库、工作流和 AI 原生工具的 API 生命周期平台。
    - 公司仍受益于强融资历史和可识别投资人基础，2021 年 Series D 是主要锚点。
    - 客户证据覆盖主要 API 中心型企业，以及内部和外部开发者用例。
    - API 对收入越来越关键，也越来越处在 AI 智能体工作流中心，品类顺风仍在。
  topRisks:
    - 公开 revenue 和 ARR 估计分歧很大，当前商业化质量还没有解开。
    - 治理、股权结构、董事会、清算优先权和现金跑道披露仍太薄，无法承销。
    - 低端 API 客户端功能正被开源和 local-first 替代品快速商品化。
    - 公司有可见的安全和信任负担，包括 2024 年 workspace 暴露批评，以及 2026 年与 Klue 相关的数据事件。
    - 二级市场折价说明，即便没有新的新股定价，2021 年估值也已经向下重置。
  unresolvedGaps:
    - 经审计或管理层认证的收入、ARR、毛利率、烧钱速度和现金跑道数据。
