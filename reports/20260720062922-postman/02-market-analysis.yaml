- id: market-size-growth
  title: Market Size, Growth, and Why Estimates Vary
  body: 'Public market-size estimates all point the same direction but disagree on magnitude. The Business Research Company, Strategic Market Research, Fortune Business Insights, and Mordor Intelligence all show double-digit or better expansion into the next decade, yet their 2025 market numbers span from roughly $5.24 billion to $8.86 billion. That spread is too large to ignore. It likely reflects different scoping choices around API management software, API gateways, lifecycle tooling, and enterprise services. For diligence purposes, the important conclusion is not the single-number TAM but the consistency of growth direction: each source points to a market still scaling with digital transformation, cloud-native architecture, and AI-driven integration demand. Postman should therefore be treated as operating inside a large and expanding category, but one whose exact edge is blurry enough that precision TAM math would overstate certainty. A range-based view is more honest than a single stacked
    pyramid with false accuracy.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyers-and-demand-drivers
  title: Buyers, Users, and Demand Drivers
  body: 'Postman''s own survey data provides the strongest public signal on demand drivers. Testing, development, and documentation consume substantial time for API teams, while 93% of teams say collaboration is still difficult, making coordination a legitimate pain point rather than marketing copy. The same report argues APIs are moving from cost-center plumbing toward revenue assets: 65% of organizations now generate revenue from APIs, and most of those derive a meaningful share of company revenue from them. That shifts the buyer from only frontline developers toward platform leaders, architecture teams, product owners, security, and governance stakeholders who care about discoverability, reuse, and policy control. Postman''s Free, Solo, Team, and Enterprise packaging also points to a buyer ladder: individuals can begin cheaply, but the real monetization opportunity is organizational standardization. AI reinforces the case, because when agents call APIs, the value of well-documented, governed,
    discoverable interfaces rises materially.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM013
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
