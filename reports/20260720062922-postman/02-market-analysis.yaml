callouts:
- calloutType: insight
  title: The API market is large enough, but not all of it is monetizable by Postman
  body: Every market report points to strong category growth, but the low end is full of open-source and local-first substitutes. Postman's real opportunity is the higher-value collaboration and governance layer, not every API call or client download.
  claimRefs:
  - CM003
  - CM007
  - CM024
  - CM025
  - CM033
  - CM035
- calloutType: strength
  title: AI makes structured APIs more valuable, not less
  body: 'Postman''s own survey results and its 2025 product moves align on the same thesis: as agents become API consumers, discoverability, documentation, testing, and governance become more economically important.'
  claimRefs:
  - CM012
  - CM014
  - CM021
  - CM022
  - CM036
- calloutType: risk
  title: Commoditization pressure is real at the individual-developer layer
  body: Insomnia, Bruno, and Hoppscotch all market cheap or free alternatives, while public reviews show some frustration with Postman's paid-feature drift and workspace complexity. That means enterprise expansion has to carry the market story.
  claimRefs:
  - CM024
  - CM025
  - CM029
  - CM030
  - CM031
  - CM032
  - CM033
