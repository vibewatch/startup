  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-definition-gap
    missingEvidence: A clean analyst methodology for the specific API collaboration or lifecycle collaboration segment that Postman actually leads.
    whyItMatters: Broad API-management TAM estimates are directionally useful but too noisy to anchor precise share assumptions.
    diligencePath: Request management's internal category definition and third-party analyst support for the addressable collaboration/governance layer.
    relatedQuestionRefs:
    - QM004
    - QM025
  - type: private-evidence-only
    severity: material
    topic: paying-customer-segment-mix
    missingEvidence: Breakdown of paying customers by self-serve, team, and enterprise cohorts plus expansion rates by cohort.
    whyItMatters: The central market question is whether enterprise standardization outweighs free-tool commoditization.
    diligencePath: Request ARR by plan, seat mix, and top cohort retention/expansion metrics.
    relatedQuestionRefs:
    - QM022
    - QM023
  - type: stale
    severity: minor
    topic: ai-specific-demand-split
    missingEvidence: A more current breakdown of how much usage growth comes from AI-agent workflows versus legacy API collaboration jobs.
    whyItMatters: The size of the AI-specific wedge affects how durable Postman's premium positioning may become.
    diligencePath: Monitor the next State of the API refresh and ask management for AI feature adoption metrics.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: international-buyer-distribution
    missingEvidence: Regional paying-customer distribution by geography and enterprise size.
    whyItMatters: Public reports imply global relevance but do not show where monetization is concentrated.
    diligencePath: Ask for ARR split by geography and deal size.
    relatedQuestionRefs:
    - QM019
  - type: private-evidence-only
    severity: material
    topic: pricing-elasticity
    missingEvidence: Actual conversion, churn, and downgrade behavior around free-to-paid and team-to-enterprise transitions.
    whyItMatters: Public reviews show pricing friction, but only internal conversion data can show whether that friction is strategic or harmful.
    diligencePath: Request cohort conversion and churn waterfalls by plan tier.
    relatedQuestionRefs:
    - QM018
    - QM023
