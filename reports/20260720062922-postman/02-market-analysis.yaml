  - - Gateway / runtime API management
    - Gateways, traffic control, hybrid/serverless runtime connectivity
    - Lifecycle collaboration assets
    - Infrastructure and platform operations
    - Relevant adjacent market but bought differently
  - - Local / open-source clients
    - Individual request execution, collection storage, git-native workflows
    - Enterprise governance and organization-wide asset management
    - Individual developers, small teams
    - Defines the low-end substitute set
