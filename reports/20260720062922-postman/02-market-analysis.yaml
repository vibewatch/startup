company:
  name: Postman
chapter:
  number: 2
  title: Market Analysis
  summary: 'Postman sits in a fast-growing but fuzzy API lifecycle market that third-party analysts size anywhere from roughly $5 billion to nearly $9 billion in 2025 depending on whether the lens centers on API management, design, testing, or broader lifecycle tooling. Postman''s own 2025 survey evidence supports strong secular demand: APIs are revenue-bearing assets, collaboration remains broken for most teams, and AI agents are raising the value of structured, discoverable APIs. The main market caveat is that low-end request tooling is already commoditized by open-source and local-first alternatives, so the investable portion of the market is the higher-value collaboration, governance, and enterprise workflow layer.'
sections:
- id: market-boundary
  title: Market Boundary and What Postman Actually Sells Into
  body: 'The easiest analytical mistake with Postman is to define its market too narrowly as API-client software. Postman''s product pages put it in a much wider API lifecycle category that includes design, testing, documentation, distribution, monitoring, and governance. The API Repository and Flows pages reinforce that this is not just a single-user request runner: the company is selling shared asset management, discoverability, workflow execution, and cross-team visibility. That broader framing matters because the market is fragmented. Enterprise buyers can source design from Swagger or Stoplight, testing from ReadyAPI, gateways from Kong, and lightweight clients from Insomnia, Bruno, or Hoppscotch. Postman''s served market is therefore best described as the collaborative and workflow-centric slice of the broader API management and API development economy. It wins when organizations need common context across teams and machines, not merely a way to fire HTTP requests.'
  claimRefs:
  - CM001
  - CM002
  - CM017
  - CM018
  - CM019
