- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Public-secret exposure
    - New external research or trust notice
    - Evidence that large-scale public workspace leakage persists or worsens despite mitigations
    - Re-open investment thesis and demand leakage-rate trend data
  - - Operational trust
    - Status or trust-portal pattern
    - Repeat incident or prolonged multi-surface outage affecting key collaboration or AI services
    - Downgrade confidence and test customer references for trust erosion
  - - Competitive pressure
    - Customer or review signal
    - Growing movement toward Bruno, Insomnia, Thunder Client, or GitHub-native workflows in target segments
    - Question low-end expansion and price realization assumptions
  - - Model / financing risk
    - Secondary or financing event
    - Down-round, tender markdown, or disclosed ARR/burn profile materially below expectations
    - Reset valuation and examine runway contingencies
  - - AI governance risk
    - Internal or external incident
    - Agent- or AI-driven change creates a security or compliance failure with customer impact
    - Treat as thesis-break unless controls and blast radius are immediately demonstrably contained
  notes: These kill criteria are designed for ongoing monitoring after diligence, not just for one-time screening.
