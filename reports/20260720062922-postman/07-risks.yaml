chapter:
  number: 7
  title: Risks
  summary: Postman’s clearest risks are not generic SaaS issues but platform-shape issues created by public API discovery, collaborative workspaces, and an increasingly AI-active control plane. Third-party research on exposed public workspaces and leaked secrets is extensive enough to make secrets hygiene the top operational and legal concern, even though most of the root cause appears to be misconfiguration rather than a breach of Postman’s own core systems. Competitive pressure from local-first, Git-native, and AI-bundled alternatives adds a second major risk axis, while the company’s private financial opacity makes it hard to judge how much room it has to absorb trust shocks or pricing friction.
sections:
- id: privacy-legal-and-security
  title: Privacy, Legal, and Security Exposure
  body: 'The central risk theme is that Postman’s growth model and its risk model are partially the same thing. Public workspaces, API discoverability, forks, examples, and shared collections make onboarding fast, but they also create a durable surface for accidental exposure of live tokens and sensitive data. Third-party researchers are unusually aligned here: CloudSEK, Truffle Security, AppSentinels, and follow-on coverage all describe large-scale secret exposure on public Postman assets. Importantly, most of this evidence does not allege that Postman’s core infrastructure was hacked. The more uncomfortable conclusion is that the platform makes it easy for users to create business value quickly, and therefore easy to create business harm quickly when sharing defaults, token handling, or environment semantics are misunderstood. Legal and regulatory risk sits on top of that operational reality. The CCPA, Data Privacy Framework commitments, AI terms, and other evolving contract surfaces mean
    that any future incident involving regulated personal data or customer credentials could carry enforcement and contractual consequences beyond pure reputation damage.'
