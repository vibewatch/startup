  rows:
  - - API client + collections
    - Developers and testers
    - Core / mature
    - Large installed base; reusable collections tied to broader platform assets
    - Need active usage split between simple request sending and broader lifecycle use
  - - API Repository + Builder
    - Platform engineers and API owners
    - Core / mature
    - Central source of truth plus native Git sync across specs, docs, tests, and code
    - Need data on adoption of builder workflows versus standalone collection usage
  - - Flows
    - Developers, onboarding, partner teams
    - Scaling
    - Turns workflow docs into executable assets and AI-ready wrappers
    - Need usage and retention for flows-heavy workspaces
  - - Agent Mode + Postbot
    - Developers and QA
    - Early but rapidly expanding
    - Acts on workspace context to generate tests, fix requests, and create docs
    - Need measured productivity gains and guardrail metrics
  - - AI Engineer + API Catalog
    - Platform and enterprise engineering leaders
    - Beta / new 2026 surface
    - Context graph, review controls, and live API map create a system-of-record moat
    - Need clarity on rollout status, model providers, and production usage depth
  notes: This table maps the major product surfaces visible in 2026 public materials. Maturity labels are analytical judgments based on documentation depth and launch language, not company-announced lifecycle tags.
