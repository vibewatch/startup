chapter:
  number: 5
  title: Product & Technology
  summary: Postman has evolved well beyond an API request client into an increasingly unified control plane for API design, testing, documentation, governance, and AI-assisted workflow execution. Official product and docs pages show a central repository-and-collection data model, a growing ecosystem of CLI and SDK tooling, and a 2026 roadmap centered on native Git workflows, API Catalog, Agent Mode, and AI Engineer. The main technical tradeoff is that the platform is becoming more powerful precisely by becoming more context-heavy and cloud-managed, which creates both stickier enterprise value and more complexity for teams that preferred lighter or more local-first tooling.
sections:
- id: platform-surface
  title: Platform Surface and Customer Workflow
  body: Postman now markets itself as a unified platform across the full API lifecycle rather than as a single API client. The product page bundles design, testing, documentation, monitoring, governance, collaboration, and AI into one surface, while the repository page makes clear that these are not separate bolt-ons sitting on disconnected data. The platform centers on collections, specs, environments, workspaces, and repository state that can be reused across design, testing, publication, and monitoring. For users, that means the product narrative is about reducing tool fragmentation and keeping API work synchronized. For buyers, it means Postman is trying to sell a system of record for API work. This shift matters because it explains why Postman has been able to keep expanding its platform footprint without abandoning its original request-runner wedge. The customer workflow starts with requests and collections, but the monetizable value increasingly sits in shared context, reviewability,
    and organizational visibility rather than in raw request sending alone.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE005
  - CE007
  - CE008
  - CE016
  - CE018
  tableRefs:
