  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Strength
  - Risk
  rows:
  - - Collections + schema
    - Portable asset format for requests and workflows
    - Postman schema and SDK ecosystem
    - Makes artifacts reusable across UI, CLI, and code
    - Format influence can feel like soft lock-in
  - - Repository + workspaces
    - Central state and permissions layer
    - Postman cloud account and workspace model
    - Single source of truth for teams
    - Advanced value depends on cloud-managed state
  - - Builder + spec sync
    - Design and source control bridge
    - OpenAPI / GraphQL / RAML plus Git integration
    - Keeps specs, docs, and tests aligned
    - Requires disciplined repo and review practices
  - - Runtime tooling
    - Execute collections locally and in CI
    - Node.js, Newman, Postman CLI, Postman API
    - Supports local, automated, and pipeline execution
    - Tooling split between Newman and CLI can confuse teams
  - - AI context layer
    - Grounds agents across assets and services
    - Context graph, API Catalog, review queues, model infrastructure
    - Differentiates Postman on system context
    - Public disclosure on model-serving internals remains thin
