- id: exit-readiness-and-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: 'Postman shows no public exit-readiness signal as of the July 2026 access date. Its own press-media page lists product
    and partnership announcements through April 2026 with no IPO reference, a dedicated third-party IPO tracker returned a
    bot-blocked response rather than usable data, and an SEC EDGAR company-name search restricted to Form S-1 returned no
    matching filer or filing. That absence of evidence is itself evidence worth recording, not a basis for assuming an IPO
    is either imminent or ruled out.


    The kill-trigger table in this chapter lays out six concrete, monitorable thresholds -- a below-$2.0 billion primary print,
    disclosed revenue below the bear-case floor, two more years with no capital event, a materially wider secondary discount,
    a compounding governance or security event, or a confirmed IPO filing -- any of which should move the recommendation in
    a specific direction rather than triggering a vague reassessment. The final diligence asks table converts the chapter''s
    open questions into concrete requests: audited or management-reviewed revenue reconciling the two conflicting 2024 estimates,
    a current cap table and preference-stack summary, confirmation of any 2025-2027 primary financing or tender, retention
    and concentration metrics, AI-feature monetization proof, and any signal of IPO or strategic-exit intent. Closing even
    two or three of these would materially sharpen this chapter''s confidence level on the next refresh.'
  claimRefs:
  - CV039
  - CV041
  - CV042
  - CV043
