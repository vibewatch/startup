  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure-gap
    missingEvidence: No public source discloses Postman's current board composition, a full cap table, or resolved liquidation-preference
      and dividend terms; the only public preference detail (a 1.0x multiplier on one secondary-market tracker) is presented
      ambiguously.
    whyItMatters: Preference stacking and board control materially change realized common-equity outcomes in a downside scenario,
      and cannot be estimated from public sources alone.
    diligencePath: Request the current cap table, preference stack, and board composition directly from Postman or a diligence-room
      data package before underwriting a specific return outcome.
