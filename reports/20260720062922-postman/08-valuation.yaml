  - type: missing-source
    severity: blocking
    topic: revenue-disclosure-gap
    missingEvidence: No public source provides audited GAAP revenue, gross margin, cash balance, or burn-rate data for Postman;
      only third-party ARR/revenue estimates exist, and they diverge by more than 2x ($120-150M vs. $313.1M for 2024).
    whyItMatters: Any revenue-multiple valuation is only as reliable as the revenue figure it is built on; a 2x+ spread means
      the same multiple framework can produce wildly different verdicts.
    diligencePath: Request management-reviewed or audited revenue, ARR-by-segment, and gross margin figures, plus clarification
      on how each third-party tracker defines 'revenue' versus 'ARR.'
