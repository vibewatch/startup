- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - New primary round or tender priced below current secondary cluster
    - Below ~$2.0B post-money
    - Confirms the market, not just secondary trackers, has repriced the company downward
    - Reassess valuation stance toward 'expensive' and revisit position sizing
  - - Disclosed revenue materially below the low estimate
    - Below ~$120M ARR for FY2025/2026
    - Undercuts even the bear-case revenue assumption used in this chapter's sensitivity range
    - Move recommendation toward avoid pending a fuller revenue reconciliation
  - - No capital event or audited disclosure through 2027
    - 24+ further months with zero new financing/disclosure signal
    - Extends the disclosure gap that already prevents a price-committed call
    - Maintain track/research-more; do not upgrade recommendation on time alone
  - - Secondary discount widens materially beyond current range
    - Discount exceeds ~50% to the 2021 mark on a fresh print
    - Would put Postman closer to or beyond the PitchBook 2021-vintage average markdown
    - Treat as confirmation of the bear scenario and reweight probability accordingly
  - - Governance or security event compounds beyond current risk record
    - A new material breach, litigation loss, or leadership departure
    - Would add to the risks chapter's existing cluster of medium-severity exposures and could impair enterprise trust
    - Escalate risk rating to high/critical and pause any new commitment
  - - Confirmed IPO filing or roadshow announcement
    - An S-1 filing or public roadshow disclosure
    - Would replace this chapter's disclosure gaps with audited, regulator-reviewed data
    - Re-run this valuation chapter's analysis entirely once filing-grade data exists
  notes: Triggers are framed as public-evidence thresholds an investor could monitor; none has occurred as of the July 2026
    access date.
  claimRefs:
  - CV042
  - CV044
  - CV021
  - CV024
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path / owner
  rows:
  - - Audited or management-reviewed revenue
    - GAAP revenue, ARR by segment, and a reconciliation of the $120-150M vs. $313.1M 2024 estimates
    - Determines which end of the valuation-sensitivity range is realistic
    - Request via management data room or a signed NDA-covered financial package
  - - Cap table and liquidation preference
    - Current board composition, preference stack, dividend and participation terms
    - Changes realized common-equity payout in any downside or acquisition scenario
    - Request cap-table summary from company counsel or via a secondary-market intermediary with data access
  - - Confirmed 2025-2027 primary financing or tender
    - Any priced round, structured financing, or company-run tender since the 2021 Series D
    - Would replace stale 2021 pricing and thin secondary-tracker estimates with a market-clearing signal
    - Monitor SEC EDGAR, press releases, and secondary-market platforms; ask company IR directly
  - - Retention and expansion metrics
    - Net revenue retention, logo retention, and customer concentration by segment
    - Validates whether the higher GetLatka revenue trajectory is durable or front-loaded by one-time expansion
    - Request cohort-level retention data or a customer-reference call program
  - - AI-feature monetization proof
    - Adoption, ARPU uplift, or attach-rate data for Agent Mode / AI Engineer
    - Tests whether recent AI investment is defending or expanding the moat versus commoditizing pricing
    - Request product-usage telemetry or a management Q&A focused specifically on AI-feature monetization
  - - IPO or strategic-exit intent
    - Any internal timeline, banker engagement, or roadshow planning signal
    - Determines whether a near-term liquidity event is realistic for return-modeling purposes
    - Ask management or board-adjacent sources directly; monitor EDGAR S-1 filings each quarter
  notes: Asks are ordered by how directly they would move the valuation range in this chapter, not by ease of collection.
  claimRefs:
  - CV043
  - CV044
  - CV039
  - CV042
