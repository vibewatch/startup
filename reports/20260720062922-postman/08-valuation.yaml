- id: comparable-valuation-lenses
  title: Comparable Valuation Lenses
  body: 'No single public or private peer matches Postman''s exact product mix and disclosure profile, so this chapter blends
    several lenses. On direct private financing, Kong Inc. -- a named competitor in Postman''s own competitive set -- closed
    a $175 million Series E in November 2024 at a $2 billion valuation led by Tiger Global and co-led by Balderton, a useful
    signal that category-level private capital access has not disappeared. SmartBear, an adjacent API-lifecycle and quality-tooling
    vendor, remains privately owned in equal parts by Francisco Partners and Vista Equity Partners with no disclosed valuation
    at all, illustrating how little some PE-held peers reveal publicly.


    On public comparables, GitLab trades at roughly 5.8x its $955.2 million fiscal 2026 revenue (market cap $5.52 billion),
    Atlassian trades at a directly reported 3.82x price-to-sales on $6.19 billion trailing revenue (market cap $23.67 billion,
    down 52.65% year over year), and Datadog trades at roughly 25x its $3.67 billion trailing revenue (market cap $92.08 billion)
    -- a more than 6x spread that shows how much growth quality and category positioning matter versus a flat sector multiple.
    IBM''s roughly $11 billion acquisition of Confluent, at about 11x its reported revenue run rate, adds a strategic-buyer
    M&A anchor for data/API infrastructure assets. Together these lenses bound plausible multiples without resolving which
    one Postman itself should trade at.'
  claimRefs:
  - CV027
  - CV028
  - CV029
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
