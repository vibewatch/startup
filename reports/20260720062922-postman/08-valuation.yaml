- id: recommendation-confidence-risk-and-valuation-stance
  title: Recommendation, Confidence, Risk Rating, and Valuation Stance
  body: 'This chapter''s evidence supports a research-more / track recommendation for Postman, with medium confidence, a medium-high
    risk rating, and a fair-to-stretched valuation stance that depends heavily on which revenue estimate an investor believes.
    That posture is not a hedge for its own sake: it follows directly from stacking strong, well-corroborated financing and
    scale proof against unresolved revenue, governance, and capital-event gaps that public sources simply do not close. The
    recommendation logic in this chapter''s flow figure traces that exact chain -- financing and comparable-market proof on
    one side, revenue and governance disclosure gaps on the other, resolving into a price-sensitive rather than admiration-sensitive
    call.


    The investment KPI scorecard reflects the same asymmetry: financing history and comparable-market access both score well,
    secondary-market support sits in the middle (down from peak but ahead of the broad 2021-vintage markdown average), while
    revenue clarity, governance clarity, and exit-readiness signal all score poorly. No confirmed IPO filing, roadshow, or
    new financing event exists as of the July 2026 access date, and an EDGAR search under the company name returned no S-1
    filing. A target return, hold, or exit stance cannot be responsibly quantified until at least one of the revenue, cap-table,
    or capital-event gaps closes; until then, the appropriate action is to track the position and revisit this call the moment
    new disclosure-grade evidence appears.'
  claimRefs:
  - CV042
  - CV046
  - CV047
  - CV048
  tableRefs:
  - TV001
  figureRefs:
  - FV001
  - FV004
- id: financing-and-valuation-context
  title: Financing and Valuation Context
  body: 'Every valuation discussion of Postman has to start from the same anchor: a $225 million Series D closed in August
    2021 at a $5.6 billion post-money valuation, led by Insight Partners with Coatue, Battery Ventures, and BOND joining as
    new investors. Forge Global''s own funding table shows a lower primary-only figure ($145 million at $17.54/share, $5.57
    billion post-money) and a lower total-funding figure ($352 million versus $433 million from Craft.co, GetLatka, and Inc42),
    a gap that most likely reflects a primary-versus-total-round distinction rather than a resolved contradiction, but it
    is not something this chapter can fully reconcile from public evidence.


    Since that 2021 peak, no new primary round has been confirmed. Instead, five independent secondary-market trackers (Forge,
    Yahoo Finance, Public.com, Notice.co, Premier Alternatives, and UpMarket) now show 2026 estimates spanning roughly $2.2
    billion to $4.8 billion, and the Economic Times separately reported secondary transactions clearing at a 30-40% discount
    to the 2021 mark -- two to three times a typical secondary discount. Entry-discipline logic therefore has to price in
    both a wide valuation band and an unresolved, potentially non-participating-or-participating preference stack that no
    source fully discloses, which is exactly the kind of dilution/preference overhang that should keep any position price-sensitive
    rather than conviction-sized.'
  claimRefs:
  - CV001
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
