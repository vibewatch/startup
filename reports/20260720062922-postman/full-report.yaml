      - number: '7.4'
        title: Financial / Model Risk and Thesis-Break Indicators
        blocks:
          - type: paragraph
            body: >-
              The public record still leaves one important risk category unresolved: model resilience under stress. The
              Economic Times reported a material secondary-market discount and significantly lower ARR than some outside
              growth trackers suggest, while current burn, runway, and debt remain undisclosed. That matters because
              trust shocks, pricing backlash, or slower enterprise conversion can all be survived more easily by a
              company with abundant cash and harder by a company already facing a valuation reset. The practical
              implication is that investors should not look at Postman’s risks in isolation. Security exposure, customer
              churn at the low end, or AI competition from larger platforms all matter more if the company lacks
              financial flexibility. The thesis-break events are therefore concrete: a repeat large-scale
              credential-exposure cycle, evidence of prolonged customer trust loss, a sharper pricing-driven user
              outflow, or a financing event that confirms the business is worth materially less than its last primary
              round without corresponding proof of durable free cash flow.
