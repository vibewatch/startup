          - type: paragraph
            body: >-
              The central risk theme is that Postman’s growth model and its risk model are partially the same thing.
              Public workspaces, API discoverability, forks, examples, and shared collections make onboarding fast, but
              they also create a durable surface for accidental exposure of live tokens and sensitive data. Third-party
              researchers are unusually aligned here: CloudSEK, Truffle Security, AppSentinels, and follow-on coverage
              all describe large-scale secret exposure on public Postman assets. Importantly, most of this evidence does
              not allege that Postman’s core infrastructure was hacked. The more uncomfortable conclusion is that the
              platform makes it easy for users to create business value quickly, and therefore easy to create business
              harm quickly when sharing defaults, token handling, or environment semantics are misunderstood. Legal and
              regulatory risk sits on top of that operational reality. The CCPA, Data Privacy Framework commitments, AI
              terms, and other evolving contract surfaces mean that any future incident involving regulated personal
              data or customer credentials could carry enforcement and contractual consequences beyond pure reputation
              damage.
            claimRefs:
