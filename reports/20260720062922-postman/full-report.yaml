      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes revenue tracks closer to GetLatka's $313.1 million 2024 estimate and that a
              2026-2027 primary round or IPO re-rates the company toward UpMarket's own $4.8 billion model estimate or
              back toward the $5.6 billion 2021 peak; under that path, multiple expansion and revenue growth reinforce
              each other and the reported secondary discount narrows back toward a typical 10-15%. The base case assumes
              revenue lands between the two conflicting estimates and secondary pricing simply stays close to where
              Forge, Yahoo Finance, and Premier Alternatives already show it -- a $2.0-3.3 billion cluster -- with the
              main risk being that the lack of any confirmed capital event keeps that mark stale and effectively
              unverifiable indefinitely.


              The bear case assumes revenue proves closer to the lower $120-150 million ARR estimate implied by Economic
              Times reporting, and that Postman's valuation drifts toward PitchBook's reported 68.2% average markdown
              for 2021-vintage unicorns, implying roughly $1.8 billion or below. A governance, security, or
              customer-concentration shock (several of which already sit in this report's risks chapter as unresolved
              medium-severity exposures) would accelerate that path. None of the three scenarios can be assigned a
              precise probability from public evidence alone, but the base case is the one most directly corroborated by
              multiple independent, currently dated trackers.
            claimRefs:
              - CV005
              - CV019
              - CV020
