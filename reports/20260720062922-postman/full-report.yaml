      - number: '1.4'
        title: Strategic Trajectory and Category Positioning
        blocks:
          - type: paragraph
            body: >-
              The company's recent strategy is to turn API collaboration into an AI-native systems layer. Postman's 2025
              State of the API report argues that API strategy is becoming AI strategy, and the report's own survey data
              describes APIs as revenue-generating assets that increasingly need collaboration and machine-readable
              structure. Postman then translated that narrative into product: TechCrunch covered the January 2025 launch
              of AI Agent Builder, and Postman's own materials introduced Agent Mode and AI Engineer as assistants that
              can act across collections, specs, environments, and workflow assets. The acquisitions of Orbit, liblab,
              and Fern fit the same arc. Orbit broadened community and developer-engagement capabilities, liblab added
              SDK generation, and Fern added documentation plus SDK automation. Together, these moves indicate that
              Postman is trying to own more of the surface area between API producers, API consumers, and AI agents that
              will invoke those APIs.
