  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Residual severity is highest where public sharing, credential handling, and regulatory exposure overlap.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Public workspace credential leaks
          values:
