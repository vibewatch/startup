      - CV050
      - CV051
      - CV024
      - CV025
      - CV020
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Postman scores well on financing history and comparable-market access, but poorly on economics clarity and
      governance disclosure.
    data:
      items:
        - label: Financing & scale proof
          score: 8
          detail: Confirmed $225M/$5.6B Series D and consistent ~$352-433M total-funding range across trackers.
          tone: positive
        - label: Comparable-market access
          score: 7
          detail: A direct competitor (Kong) and adjacent public comps still command credible valuations/multiples in 2026.
          tone: positive
        - label: Secondary-market support
          score: 5
          detail: >-
            Multiple trackers converge near $2.2-3.3B, down from the $5.6B peak but above the PitchBook 2021-vintage
            average markdown level.
          tone: neutral
        - label: Revenue clarity
          score: 3
          detail: Two independent estimates disagree by more than 2x for the same fiscal year 2024.
          tone: negative
        - label: Governance / preference clarity
          score: 2
          detail: No disclosed cap table, board composition, or confirmed liquidation-preference terms.
          tone: negative
        - label: Exit-readiness signal
