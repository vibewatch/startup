  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Postman Actually Sells Into
        blocks:
          - type: paragraph
            body: >-
              The easiest analytical mistake with Postman is to define its market too narrowly as API-client software.
              Postman's product pages put it in a much wider API lifecycle category that includes design, testing,
              documentation, distribution, monitoring, and governance. The API Repository and Flows pages reinforce that
              this is not just a single-user request runner: the company is selling shared asset management,
              discoverability, workflow execution, and cross-team visibility. That broader framing matters because the
              market is fragmented. Enterprise buyers can source design from Swagger or Stoplight, testing from
              ReadyAPI, gateways from Kong, and lightweight clients from Insomnia, Bruno, or Hoppscotch. Postman's
              served market is therefore best described as the collaborative and workflow-centric slice of the broader
              API management and API development economy. It wins when organizations need common context across teams
              and machines, not merely a way to fire HTTP requests.
