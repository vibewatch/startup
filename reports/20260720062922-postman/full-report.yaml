companyProfile:
  summary: >-
    Postman is a private API platform company founded in 2014 and now headquartered in San Francisco. The company
    started as a developer tool to simplify API testing and has expanded into a broad lifecycle platform spanning API
    design, documentation, testing, monitoring, repository management, workflow orchestration, and AI-assisted API work.
    Public sources show very broad adoption—more than 40 million users and 500,000 organizations—plus meaningful
    enterprise penetration, but they also show a still-opaque financial and governance profile. Since its 2021 $225
    million Series D at a $5.6 billion valuation, Postman has added AI-native product layers and acquired Orbit, liblab,
    and Fern to broaden community, SDK, and documentation workflows.
