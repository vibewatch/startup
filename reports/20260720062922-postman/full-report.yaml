  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation moves from strong financing/scale proof through two unresolved evidence gaps to a
      price-sensitive research-more call.
    data:
      nodes:
        - id: scale
          label: Financing & scale proof
          detail: Confirmed $225M/$5.6B Series D (2021); $352-433M total funding depending on tracker.
          tone: positive
        - id: comps
          label: Comparable context
          detail: Kong ($2B private), GitLab (~5.8x), Atlassian (3.82x), Datadog (~25x) bound a plausible multiple range.
          tone: positive
        - id: secondary
          label: Secondary-market signal
          detail: Forge/Yahoo cluster ~$2.22B, down 24-33% across trailing windows; 30-40% reported discount to peak.
          tone: warning
        - id: revenue_gap
          label: Revenue disclosure gap
          detail: GetLatka $313.1M vs. Economic-Times-implied $120-150M ARR for 2024, unreconciled.
          tone: negative
        - id: governance_gap
          label: Governance / preference gap
          detail: No disclosed cap table, board composition, or confirmed preference terms.
          tone: negative
        - id: macro
          label: Macro markdown context
          detail: >-
            PitchBook: 2021-vintage unicorns average -68.2%; Postman's ~-60% implied decline is smaller than that
            average.
          tone: neutral
        - id: decision
          label: Research-more / track
          detail: Evidence supports a price-sensitive, disclosure-gated posture rather than a buy or avoid call.
          tone: warning
      edges:
        - from: scale
          to: comps
          label: Anchors a plausible comp set
        - from: comps
          to: decision
          label: Bounds but does not resolve the range
        - from: secondary
          to: decision
          label: Confirms downside repricing
        - from: revenue_gap
          to: decision
          label: Blocks confident multiple selection
        - from: governance_gap
          to: decision
          label: Blocks confident downside modeling
        - from: macro
          to: secondary
          label: Contextualizes the decline as sector-relative, not company-specific
    approximationNotes: Node tones reflect qualitative judgment about evidence direction, not a scored model.
    claimRefs:
      - CV001
      - CV020
      - CV024
      - CV025
      - CV043
      - CV044
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Postman's implied valuation is far more sensitive to which revenue estimate is used than to any single multiple
      choice.
    data:
      items:
        - label: Low estimate x low multiple (3.8x on $130M)
          value: 0.49
          detail: 'Bear-leaning: Economic-Times-implied ARR low end x Atlassian-like P/S.'
          tone: negative
        - label: Low estimate x mid multiple (5.8x on $130M)
          value: 0.75
          detail: GitLab-like multiple applied to the low revenue estimate.
          tone: negative
        - label: High estimate x low multiple (3.8x on $313.1M)
          value: 1.19
          detail: GetLatka revenue estimate at an Atlassian-like multiple.
          tone: warning
        - label: High estimate x mid multiple (5.8x on $313.1M)
          value: 1.82
          detail: GetLatka revenue estimate at a GitLab-like multiple.
          tone: warning
        - label: Current Forge/Yahoo secondary mark
          value: 2.22
          detail: Directly observed 2026 secondary-market valuation cluster.
          tone: neutral
        - label: Premier Alternatives current-valuation figure
          value: 3.3
          detail: Independent tracker's stated current valuation (internally inconsistent with its own page title).
          tone: neutral
        - label: UpMarket model estimate
          value: 4.8
          detail: Independent model-based estimate, above the observed secondary cluster.
          tone: positive
        - label: 2021 Series D peak (reference)
          value: 5.6
          detail: Confirmed primary-round valuation; not a current estimate.
          tone: positive
    approximationNotes: >-
      Revenue x multiple bars are simple bridge outputs for IC discussion, not discounted-cash-flow or company-guided
      figures; USD billions.
    claimRefs:
      - CV005
      - CV021
      - CV013
      - CV018
      - CV019
      - CV032
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a wide bear-to-bull valuation band because both the revenue base and the applicable
      multiple are contested.
    data:
      items:
        - label: Bear case
          low: 0.5
          mid: 1.2
          high: 1.8
          displayValue: $0.5B-$1.8B
          detail: >-
            Low revenue estimate, compressed multiple, and/or tracking toward the PitchBook 2021-vintage average
            markdown.
          tone: negative
        - label: Base case
          low: 2
          mid: 2.6
          high: 3.3
          displayValue: $2.0B-$3.3B
          detail: Roughly matches the Forge/Yahoo/Premier Alternatives secondary-market cluster.
          tone: warning
        - label: Bull case
          low: 4
          mid: 4.8
          high: 5.6
          displayValue: $4.0B-$5.6B
          detail: >-
            Revenue trends toward the higher GetLatka estimate and a capital event re-rates the company toward
            UpMarket's model or the 2021 peak.
          tone: positive
        - label: 2021 Series D peak (reference, not a scenario)
          low: 5.6
          mid: 5.6
          high: 5.6
          displayValue: $5.6B
          detail: Confirmed primary valuation; included only as the fixed reference point for every discount/markdown figure.
          tone: neutral
    approximationNotes: >-
      Ranges are scenario-based bridges built from this chapter's sourced claims, designed for investment-committee
      discussion rather than management guidance or a DCF output.
