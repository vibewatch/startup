  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Postman's thesis case starts from the deepest verified financing history among independent API-lifecycle
              vendors: a confirmed $225 million Series D in August 2021 at a $5.6 billion valuation led by Insight
              Partners, with total funding tracked at roughly $352-433 million depending on the source. The company has
              kept moving rather than standing still, announcing AI partnerships with Microsoft and Anthropic and
              acquiring Fern and liblab within the eight months before this chapter's access date, and a direct
              API-gateway competitor, Kong, still commands a credible $2 billion private valuation, showing
              category-level capital access has not collapsed. Applying PitchBook's reported 68.2% average markdown for
              2021-vintage unicorns to Postman's peak would imply roughly $1.8 billion, below every 2026
              secondary-market estimate reviewed here, so the company appears to be holding up somewhat better than the
              broad cohort average.


              The anti-thesis is just as concrete. No primary financing or tender event has been confirmed since 2021;
              independent secondary-market trackers disagree by more than 2x on current valuation; two credible
              third-party revenue estimates for the same fiscal year 2024 disagree by more than 2x; the reported
              secondary discount (30-40%) is two to three times a typical secondary discount; and governance, board
              composition, and liquidation-preference terms remain undisclosed beyond an ambiguous partial data point.
              Neither side of this ledger should be read as resolved, and the gap between them is the central fact this
              chapter tries to make legible rather than paper over.
            claimRefs:
              - CV001
              - CV020
              - CV024
              - CV025
              - CV027
              - CV039
              - CV040
              - CV043
              - CV049
          - type: table
