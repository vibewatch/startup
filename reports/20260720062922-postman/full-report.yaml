              tone: negative
              detail: Third-party research repeatedly documents exposed secrets.
            - label: critical
              tone: negative
              detail: Can enable direct unauthorized access to systems and data.
            - label: medium
              tone: warning
              detail: Controls exist but user-behavior dependence remains high.
            - label: high
              tone: negative
              detail: Still the single clearest risk in the public record.
        - label: Third-party vendor incidents
          values:
            - label: medium
              tone: warning
              detail: The Klue event shows the risk is real.
            - label: high
              tone: negative
              detail: Trust can be damaged even without core-platform compromise.
            - label: medium
              tone: warning
              detail: Portal transparency and incident response exist.
            - label: medium-high
              tone: warning
              detail: Residual exposure persists across subprocessors.
        - label: AI permission / governance drift
          values:
            - label: medium
              tone: warning
              detail: AI surface area is expanding quickly.
            - label: high
              tone: negative
              detail: A bad automated action could affect many assets quickly.
            - label: early
              tone: warning
              detail: Public controls are described, but internals are not detailed.
            - label: medium-high
              tone: warning
              detail: Needs deeper technical diligence.
        - label: Local-first competitive substitution
          values:
            - label: medium-high
              tone: warning
              detail: Competitors are credible for simpler and privacy-sensitive teams.
            - label: medium-high
              tone: warning
              detail: Can cap willingness to pay and reduce expansion.
            - label: medium
              tone: neutral
              detail: Postman is responding with Git-native and local features.
            - label: medium-high
              tone: warning
              detail: Pressure is real, especially below the enterprise layer.
        - label: Financial opacity under trust stress
          values:
            - label: medium
              tone: warning
              detail: No public burn or runway data is available.
            - label: high
              tone: negative
              detail: Trust events matter more if capital is tight.
            - label: low
              tone: warning
              detail: Public mitigation evidence is thin.
            - label: medium-high
              tone: warning
              detail: The risk is amplified by private-company opacity.
