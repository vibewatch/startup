      - number: '2.4'
        title: Constraints, Commoditization, and the Investable Slice
        blocks:
          - type: paragraph
            body: >-
              The key market constraint is that not every API workflow dollar belongs to Postman. Open-source and
              local-first tools such as Insomnia, Bruno, and Hoppscotch make it easy for individuals or small teams to
              avoid SaaS spend altogether, while Stoplight and Swagger keep design budgets contested and Kong keeps
              infrastructure budgets separated from collaboration spend. Public reviews add a second friction layer:
              some users view Postman as increasingly enterprise-priced, and others report that large collections or
              mature workspaces can feel slow or overwhelming. Finally, AI raises governance risk at the same moment it
              raises market opportunity. Postman's own reports show heightened concern around unauthorized agent access
              and security teams treating AI-agent readiness as a real operating issue. The investable market, then, is
              not the whole mass of API-related activity; it is the subset where collaboration, governance, and workflow
              automation are valuable enough to justify standardization on a paid platform. That higher-value layer is
              where enterprise budgets, policy needs, and AI workflow complexity finally overwhelm free-tool substitutes
              in practice today.
