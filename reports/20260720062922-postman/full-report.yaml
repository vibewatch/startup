      - number: '3.3'
        title: Local-First and Open-Source Substitutes
        blocks:
          - type: paragraph
            body: >-
              The most obvious low-end risk comes from tools that deliberately reject the cloud-workspace or
              enterprise-control model. Insomnia’s free forever local-only Scratch Pad, Bruno’s git-native no-account
              client, and Hoppscotch’s open-source positioning all give individuals or small teams a credible path away
              from paying for Postman too early. This does not mean Postman loses the whole competitive race; many of
              these substitutes are narrow by design. But they matter because they compress willingness to pay for the
              client layer. Once that layer is commoditized, Postman has to prove that repository visibility,
              collaboration, governance, and AI context are worth the extra cost and complexity. Review data reinforces
              this tension: users still like Postman for testing and collaboration, yet some complain about paid-feature
              drift, debugging friction, or degraded usability at larger scale. In other words, substitutes do not need
              feature parity to matter; they only need to be good enough for narrower jobs.
