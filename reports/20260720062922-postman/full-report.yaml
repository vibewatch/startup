      - number: '2.2'
        title: Market Size, Growth, and Why Estimates Vary
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates all point the same direction but disagree on magnitude. The Business Research
              Company, Strategic Market Research, Fortune Business Insights, and Mordor Intelligence all show
              double-digit or better expansion into the next decade, yet their 2025 market numbers span from roughly
              $5.24 billion to $8.86 billion. That spread is too large to ignore. It likely reflects different scoping
              choices around API management software, API gateways, lifecycle tooling, and enterprise services. For
              diligence purposes, the important conclusion is not the single-number TAM but the consistency of growth
              direction: each source points to a market still scaling with digital transformation, cloud-native
              architecture, and AI-driven integration demand. Postman should therefore be treated as operating inside a
              large and expanding category, but one whose exact edge is blurry enough that precision TAM math would
              overstate certainty. A range-based view is more honest than a single stacked pyramid with false accuracy.
