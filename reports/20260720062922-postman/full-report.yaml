      - number: '1.3'
        title: Funding, Valuation, and Disclosure Quality
        blocks:
          - type: paragraph
            body: >-
              Postman's capital history is well established through its own 2021 announcement and TechCrunch coverage.
              The company raised a $225 million Series D led by Insight Partners at a $5.6 billion valuation, and
              third-party databases such as GetLatka and Craft converge on roughly $433 million of cumulative capital
              raised. What is less settled is current monetization. The Economic Times reported that recent secondaries
              cleared at a 30-40% discount to the 2021 mark and cited people aware of the company's financials who
              pegged ARR at $120-150 million. GetLatka, by contrast, estimated 2024 revenue at $313.1 million after
              estimating 2023 revenue at $171.7 million. These are not trivially different numbers: one suggests slower
              monetization against an outsized last-round mark, while the other suggests far more scale. Without audited
              revenue, burn, margin, or retention disclosures, the right posture is to treat both as useful but
              low-confidence signals and to avoid over-fitting either estimate into the core company snapshot.
            claimRefs:
