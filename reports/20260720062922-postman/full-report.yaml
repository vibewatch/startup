              - CV042
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Secondary discount and vintage markdown context
            body: >-
              Postman's reported 30-40% secondary discount is two to three times a typical secondary discount, but
              applying PitchBook's average 68.2% markdown for 2021-vintage unicorns to the $5.6B peak would imply
              roughly $1.8B -- below every tracked 2026 estimate, so the company is holding up better than the broad
              cohort average even while showing real downside.
            calloutType: risk
            claimRefs:
              - CV021
              - CV024
              - CV025
          - type: callout
            title: Continued platform investment despite the financing gap
            body: >-
              Postman announced AI-partnership integrations with Microsoft and Anthropic and closed two acquisitions
              (Fern, liblab) within roughly eight months of this chapter's access date, showing product-side momentum
              even though no new capital event has been confirmed since 2021.
            calloutType: strength
            claimRefs:
              - CV039
              - CV040
          - type: callout
            title: Research-more, not buy or avoid
            body: >-
              Strong financing history and comparable-market access are not enough to support a price-committed call
              when revenue estimates disagree by more than 2x and governance/preference terms are undisclosed; the
              evidence-consistent call is research-more with medium confidence.
            calloutType: recommendation
            claimRefs:
              - CV046
              - CV047
          - type: callout
            title: Which revenue figure the valuation range assumes
            body: >-
              This chapter's sensitivity and scenario ranges are bracketed by two conflicting third-party revenue
              estimates for 2024 ($120-150M ARR implied by Economic Times reporting versus $313.1M per GetLatka); every
              valuation multiple discussed should be read against one or the other, never both at once.
            calloutType: assumption
            claimRefs:
