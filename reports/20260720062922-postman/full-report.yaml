        title: Exhibits
        blocks:
          - type: callout
            title: The biggest risk is misuse, not a classic hack
            body: >-
              The public evidence says Postman’s most credible risk is repeated misuse of workspaces and tokens, not a
              demonstrated compromise of the core platform itself.
            calloutType: risk
