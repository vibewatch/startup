        title: GTM Motion, Conversion Logic, and Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a hybrid sales motion: broad self-serve developer adoption at the top, then team
              and enterprise expansion where shared workflows matter. Postman says the platform now reaches more than 40
              million developers and 500,000 organizations, and the enterprise page still claims 98% of the Fortune 500.
              Those figures alone do not guarantee revenue quality, but they imply an unusually large pool of
              already-acquired users that paid conversion can mine without purely greenfield enterprise selling. The
              2025 State of the API report strengthens that interpretation by showing both widespread API monetization
              and persistent collaboration pain, two conditions that support paid team tooling. Review sites reinforce
              the same pattern at a smaller scale: users repeatedly praise shared collections, environments, and
              workspaces, while also complaining that pricing has become more aggressive as collaboration and governance
              features move into higher tiers. That combination suggests healthy product value but also a real ceiling
              on low-end conversion efficiency if buyers perceive price creep faster than incremental utility. Public
              CAC, payback, pipeline conversion, and seat expansion metrics remain undisclosed, so the best outside
              proxy is simply that Postman appears to monetize where organizational coordination becomes expensive
              enough to justify a platform, not where single developers only need a free request client.
