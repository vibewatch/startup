    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Scale
        blocks:
          - type: paragraph
            body: >-
              Postman remains best understood as a unified API platform rather than a single testing tool. Its official
              about and product pages describe a platform for building and using APIs across design, testing,
              distribution, documentation, monitoring, and governance, while the pricing page makes clear that Postman
              monetizes across free, individual, team, and enterprise tiers. The company says it now serves more than 40
              million users and 500,000 organizations, including 98% of the Fortune 500, which frames the platform as a
              broad systems-of-record layer for API work rather than a point utility. Craft and LinkedIn corroborate the
              company's private status, San Francisco headquarters, and global footprint, though the most current scale
              metrics are still predominantly company-provided rather than independently audited. LinkedIn's July 2026
              page gives the strongest current headcount signal, at 3,523 employees, which is directionally consistent
              with Postman's growth-stage office expansion and the 2025 headquarters announcement.
