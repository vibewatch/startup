        - The most current, if imperfect, market-clearing signal for the company itself
        - Derived from thin private-market data, not an audited transaction
      - - Postman (2021 peak, for contrast)
        - Confirmed primary Series D valuation
        - $5.6B (Aug 2021)
        - The reference point every discount/markdown figure in this chapter is measured against
        - More than four years stale; no confirmed capital event since
      - - Kong Inc.
        - Private Series E valuation
        - $2.0B (Nov 2024)
        - Closest direct API-management/gateway competitor with a recent, disclosed primary round
        - Different product mix (runtime gateway vs. collaboration platform) limits like-for-like comparison
      - - SmartBear
        - PE sponsor-owned; no disclosed valuation
        - Undisclosed (Francisco Partners / Vista Equity, equal owners)
        - Adjacent API-lifecycle and quality-tooling vendor at PE-hold scale
        - No public valuation or revenue figure exists to benchmark against
      - - GitLab Inc. (public)
        - Market cap / FY26 revenue
        - $5.52B / $955.2M revenue -> ~5.8x
        - Public DevSecOps platform comp with disclosed, audited financials
        - Broader DevSecOps scope than pure API tooling; not a like-for-like product match
      - - Atlassian (public)
        - Market cap / TTM revenue
        - $23.67B / $6.19B revenue -> 3.82x (P/S)
        - Larger public collaboration-software comp showing where a mature, diversified peer trades
        - Far larger scale and diversified product suite versus Postman's single-category focus
      - - Datadog (public)
        - Market cap / TTM revenue
        - $92.08B / $3.67B revenue -> ~25x
        - Shows the top end of achievable public multiples for high-growth infrastructure software
        - Observability, not API tooling; multiple reflects a very different growth/margin profile
      - - IBM / Confluent (M&A)
        - Acquisition price / revenue run rate
        - $11B / >$1B run rate -> ~11x
        - Recent large data-infrastructure M&A comp showing strategic-buyer appetite for platform assets
        - >-
          Confluent is a data-streaming platform, not an API-lifecycle tool; deal terms are strategic, not pure
          financial
    notes: >-
      No single public or private peer matches Postman's product mix and disclosure profile; the table blends direct
      pricing, a competitor financing, a PE-owned adjacent vendor, three public comps, and one M&A anchor to bound the
      discussion.
    enumerationScope:
      coverage: sample
      basis: >-
        Covers the most decision-useful public-market, private-financing, and M&A comparables with accessible July 2026
        evidence; not exhaustive because several smaller API-lifecycle peers (e.g., Stoplight, SwaggerHub's ultimate
        parent) lack directly comparable disclosed financials.
    claimRefs:
      - CV013
      - CV020
      - CV027
      - CV029
      - CV030
