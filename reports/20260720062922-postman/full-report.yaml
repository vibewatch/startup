        title: Platform Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Postman now markets itself as a unified platform across the full API lifecycle rather than as a single API
              client. The product page bundles design, testing, documentation, monitoring, governance, collaboration,
              and AI into one surface, while the repository page makes clear that these are not separate bolt-ons
              sitting on disconnected data. The platform centers on collections, specs, environments, workspaces, and
              repository state that can be reused across design, testing, publication, and monitoring. For users, that
              means the product narrative is about reducing tool fragmentation and keeping API work synchronized. For
              buyers, it means Postman is trying to sell a system of record for API work. This shift matters because it
              explains why Postman has been able to keep expanding its platform footprint without abandoning its
              original request-runner wedge. The customer workflow starts with requests and collections, but the
              monetizable value increasingly sits in shared context, reviewability, and organizational visibility rather
