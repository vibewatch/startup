      - number: '1.5'
        title: Adverse Events and Reliability Signals
        blocks:
          - type: paragraph
            body: >-
              The most meaningful recent negative signal is no longer hypothetical. Postman's own trust portal states
              that a third-party Klue compromise led to exfiltration of customer contact and sales information from
              Salesforce in June 2026, even though product or core customer data was not accessed from Gong. Separate
              external reporting from CloudSEK, Cyber Security News, and Treblle also preserved the 2024
              public-workspace exposure episode, in which tens of thousands of publicly accessible workspaces surfaced
              tokens, keys, and other sensitive material. These reports do not mean Postman itself was uniquely
              insecure; a substantial share of the exposure appears to have come from user behavior and weak secrets
              hygiene. But they do show that public collaboration carries real governance risk, especially for a
              platform encouraging broad sharing. Counterbalancing that, Postman's status page showed core services
              operational at review time and desktop uptime at 100% over the trailing 90-day window. The risk posture is
              therefore mixed: strong operating continuity, but a growing security-governance burden as the platform
              scales and becomes more agentic.
            claimRefs:
              - CO032
              - CO033
              - CO034
              - CO035
              - CO036
