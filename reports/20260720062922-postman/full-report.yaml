              - CV039
              - CV043
      - number: '8.2'
        title: Recommendation, Confidence, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              This chapter's evidence supports a research-more / track recommendation for Postman, with medium
              confidence, a medium-high risk rating, and a fair-to-stretched valuation stance that depends heavily on
              which revenue estimate an investor believes. That posture is not a hedge for its own sake: it follows
              directly from stacking strong, well-corroborated financing and scale proof against unresolved revenue,
              governance, and capital-event gaps that public sources simply do not close. The recommendation logic in
              this chapter's flow figure traces that exact chain -- financing and comparable-market proof on one side,
              revenue and governance disclosure gaps on the other, resolving into a price-sensitive rather than
              admiration-sensitive call.


              The investment KPI scorecard reflects the same asymmetry: financing history and comparable-market access
              both score well, secondary-market support sits in the middle (down from peak but ahead of the broad
              2021-vintage markdown average), while revenue clarity, governance clarity, and exit-readiness signal all
              score poorly. No confirmed IPO filing, roadshow, or new financing event exists as of the July 2026 access
              date, and an EDGAR search under the company name returned no S-1 filing. A target return, hold, or exit
              stance cannot be responsibly quantified until at least one of the revenue, cap-table, or capital-event
              gaps closes; until then, the appropriate action is to track the position and revisit this call the moment
              new disclosure-grade evidence appears.
            claimRefs:
              - CV042
              - CV046
