  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Postman monetizes as a cloud software platform with a large free top of funnel and progressively higher
              paid collaboration, governance, and AI tiers. The live pricing page shows a 2026 structure of Free, Solo,
              Team, and Enterprise plans, with paid upgrades unlocking collaboration, governance controls, larger
              AI-credit pools, and more operational limits. Product pages for Enterprise, Workspaces, and the API
              Repository make clear that the monetizable surface is not just sending requests; it is shared asset
              management, private API discovery, governance, and organization-wide workflow context. That matters
              because the company's user growth is already enormous. A free plan can still seed adoption, but revenue
              has to come from converting API work from an individual utility into a system of record for teams and
              enterprises. External pricing commentary from Apidog and Dev Tools is self-interested and low-confidence,
              but it is directionally useful because it highlights exactly where Postman is pushing harder on
              monetization in 2026: collaboration now starts at the Team tier, not the old small-team free motion. The
              core financial question is therefore not whether Postman has reach; it is whether collaboration,
              governance, and AI assistance produce enough durable willingness to pay across that reach.
