      - number: '2.3'
        title: Buyers, Users, and Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              Postman's own survey data provides the strongest public signal on demand drivers. Testing, development,
              and documentation consume substantial time for API teams, while 93% of teams say collaboration is still
              difficult, making coordination a legitimate pain point rather than marketing copy. The same report argues
              APIs are moving from cost-center plumbing toward revenue assets: 65% of organizations now generate revenue
              from APIs, and most of those derive a meaningful share of company revenue from them. That shifts the buyer
              from only frontline developers toward platform leaders, architecture teams, product owners, security, and
              governance stakeholders who care about discoverability, reuse, and policy control. Postman's Free, Solo,
              Team, and Enterprise packaging also points to a buyer ladder: individuals can begin cheaply, but the real
              monetization opportunity is organizational standardization. AI reinforces the case, because when agents
              call APIs, the value of well-documented, governed, discoverable interfaces rises materially.
