      - number: '8.3'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Every valuation discussion of Postman has to start from the same anchor: a $225 million Series D closed in
              August 2021 at a $5.6 billion post-money valuation, led by Insight Partners with Coatue, Battery Ventures,
              and BOND joining as new investors. Forge Global's own funding table shows a lower primary-only figure
              ($145 million at $17.54/share, $5.57 billion post-money) and a lower total-funding figure ($352 million
              versus $433 million from Craft.co, GetLatka, and Inc42), a gap that most likely reflects a
              primary-versus-total-round distinction rather than a resolved contradiction, but it is not something this
              chapter can fully reconcile from public evidence.


              Since that 2021 peak, no new primary round has been confirmed. Instead, five independent secondary-market
              trackers (Forge, Yahoo Finance, Public.com, Notice.co, Premier Alternatives, and UpMarket) now show 2026
              estimates spanning roughly $2.2 billion to $4.8 billion, and the Economic Times separately reported
              secondary transactions clearing at a 30-40% discount to the 2021 mark -- two to three times a typical
              secondary discount. Entry-discipline logic therefore has to price in both a wide valuation band and an
              unresolved, potentially non-participating-or-participating preference stack that no source fully
              discloses, which is exactly the kind of dilution/preference overhang that should keep any position
              price-sensitive rather than conviction-sized.
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
