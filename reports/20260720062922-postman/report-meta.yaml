companyProfile:
  summary: >-
    Postman is a private API platform company founded in 2014 and now headquartered in San
    Francisco. The company started as a developer tool to simplify API testing and has expanded
    into a broad lifecycle platform spanning API design, documentation, testing, monitoring,
    repository management, workflow orchestration, and AI-assisted API work. Public sources show
    very broad adoption—more than 40 million users and 500,000 organizations—plus meaningful
    enterprise penetration, but they also show a still-opaque financial and governance profile.
    Since its 2021 $225 million Series D at a $5.6 billion valuation, Postman has added AI-native
    product layers and acquired Orbit, liblab, and Fern to broaden community, SDK, and
    documentation workflows.
  foundedDate: '2014-01-01'
  founders:
    - name: Abhinav Asthana
      role: Co-Founder & CEO
      background: Created Postman as a side project to simplify API testing and still leads the company.
      claimRefs: [CO003, CO039]
    - name: Ankit Sobti
      role: Co-Founder
      background: Early collaborator who joined Asthana to build Postman into a commercial platform.
      claimRefs: [CO004]
    - name: Abhijit Kane
      role: Co-Founder
      background: Early collaborator who joined Asthana to scale Postman's product and developer experience.
      claimRefs: [CO004]
  foundingLocation: Bangalore, India
  headquarters: San Francisco, California
  productSummary: >-
    Postman sells a unified platform for building and using APIs: API design, testing,
    documentation, mocking, monitoring, repository/discovery, workflow automation through Flows,
    and newer AI-native features such as Agent Mode and AI Engineer.
  customerFocus: >-
    Developers, QA teams, API platform owners, partner and developer-relations teams, and larger
    enterprises that need shared API workflows, governance, and discoverability.
  businessModel: >-
    Freemium SaaS with seat-based Solo, Team, and Enterprise plans, plus AI credit overages and
    land-and-expand monetization around collaboration, governance, private API networks, and
    organization-wide workflow standardization.
  stage: Private / no confirmed primary round since 2021 Series D
  fundingStatus: >-
    Last confirmed primary round was a $225 million Series D in August 2021 at a $5.6 billion
    valuation; public databases place total funding around $433 million, while 2024-2026 secondary
    pricing indicates a lower current implied mark but no new priced primary event.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007, CO011, CO013, CO014, CO019, CO029, CO030, CO031, CI001, CI007, CV001, CV020]
summary:
  headline: >-
    Postman has clear category leadership in API collaboration and workflow context, but public
    evidence is still too contradictory on revenue and too thin on governance and capital structure
    to underwrite the company confidently at or near its 2021 peak valuation.
