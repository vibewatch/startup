  topStrengths:
    - Postman appears to have the broadest publicly visible distribution in its category, with 40M+ users and 500K+ organizations.
    - The product has expanded from a request client into a broad API lifecycle platform with repository, workflows, and AI-native tooling.
    - The company still benefits from a strong financing history and recognizable investor base anchored by the 2021 Series D.
    - Customer proof spans major API-centric enterprises and both internal and external developer use cases.
    - Category tailwinds remain favorable as APIs become more revenue-critical and more central to AI-agent workflows.
  topRisks:
    - Public revenue and ARR estimates conflict materially, leaving current monetization quality unresolved.
    - Governance, cap-table, board, liquidation-preference, and cash-runway disclosures remain too thin for underwriting.
    - Low-end API-client functionality is increasingly commoditized by open-source and local-first alternatives.
    - The company has visible security and trust burdens, including 2024 workspace-exposure criticism and a 2026 Klue-related data incident.
    - Secondary-market discounting suggests the 2021 valuation has already reset downward even without a new primary price.
  unresolvedGaps:
    - Audited or management-certified revenue, ARR, gross margin, burn, and runway data.
    - Current cap table, investor rights, preference stack, and board composition.
    - Customer retention, expansion, concentration, and contract-duration metrics by segment.
    - Adoption and monetization detail for AI features such as Agent Mode and AI Engineer.
    - Any confirmed 2025-2027 primary financing, tender, IPO, or strategic-exit process.
disclaimer: >-
  This report relies only on public sources reviewed through 2026-07-20 and is not a substitute for
  management diligence, customer calls, legal review, or access to private financial materials.
