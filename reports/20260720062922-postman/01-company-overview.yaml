- id: leadership-governance
  title: Leadership, Governance, and Dependence
  body: The public record still ties Postman closely to its founding team. The about page says Abhinav Asthana started the project and later recruited Ankit Sobti and Abhijit Kane, and that the three founders still lead the company. Craft adds only a few named executives, including chief revenue officer Zac Auger, but public board composition, preferred-share rights, and succession planning remain opaque. That opacity matters because Postman's current product repositioning toward AI-native workflows and its acquisition integration program appear tightly bound to founder vision. The company has grown large enough that this concentration does not imply fragility in day-to-day execution, yet the absence of disclosed board seats, voting structure, or cap-table mechanics still leaves investors with a meaningful governance diligence hole. In practice, the public view is enough to confirm founder continuity and enterprise go-to-market depth, but not enough to underwrite control rights or transition
    planning.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO037
  - CO040
