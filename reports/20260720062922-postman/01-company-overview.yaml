company:
  name: Postman
chapter:
  number: 1
  title: Company Overview
  summary: Postman is a still-private API platform founded in 2014 that scaled from 17 million developers at its 2021 Series D to more than 40 million users and 500,000 organizations by 2025-2026. Public sources corroborate the $225 million Series D at a $5.6 billion valuation and roughly $433 million total funding, but current revenue and ARR estimates diverge sharply across third-party sources. The company is leaning into AI-native workflows through Agent Mode and AI Engineer while also absorbing developer-experience acquisitions, and its public risk record now includes a 2026 Klue-related Salesforce data exfiltration incident plus prior workspace-exposure criticism.
sections:
- id: identity-scale
  title: Identity, Product, and Scale
  body: Postman remains best understood as a unified API platform rather than a single testing tool. Its official about and product pages describe a platform for building and using APIs across design, testing, distribution, documentation, monitoring, and governance, while the pricing page makes clear that Postman monetizes across free, individual, team, and enterprise tiers. The company says it now serves more than 40 million users and 500,000 organizations, including 98% of the Fortune 500, which frames the platform as a broad systems-of-record layer for API work rather than a point utility. Craft and LinkedIn corroborate the company's private status, San Francisco headquarters, and global footprint, though the most current scale metrics are still predominantly company-provided rather than independently audited. LinkedIn's July 2026 page gives the strongest current headcount signal, at 3,523 employees, which is directionally consistent with Postman's growth-stage office expansion and the
    2025 headquarters announcement.
  claimRefs:
  - CO001
  - CO002
  - CO006
