callouts:
- calloutType: strength
  title: Category leadership has broad distribution support
  body: 'Even without audited financials, Postman''s scale indicators are unusually strong for a private developer-tools company: 40M+ users, 500,000 organizations, and claimed reach into 98% of the Fortune 500. That level of adoption gives the company a real installed-base advantage when layering in AI-native features or acquired lifecycle modules.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO019
- calloutType: risk
  title: The valuation narrative is stronger than the disclosure narrative
  body: The 2021 $5.6B price is well documented, but current monetization is not. Public sources disagree on whether Postman is nearer a $120-150M ARR business or a $313M revenue business, and the 2024 secondary discount report suggests investors have already repriced the ambiguity.
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
- calloutType: risk
  title: Security and governance complexity is rising with scale
  body: The 2026 Klue-related Salesforce exfiltration disclosure and the 2024 public-workspace exposure episode both show that a collaboration-heavy API platform inherits real governance and secrets-management risk as it scales into enterprise and AI-native use cases.
