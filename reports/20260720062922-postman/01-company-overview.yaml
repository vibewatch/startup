  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-cap-table
    missingEvidence: Current board seats, voting control, liquidation preferences, and major secondary-sale ownership changes.
    whyItMatters: Governance rights and downside economics shape underwriting but are invisible from public materials.
    diligencePath: Request the current cap table, board observer list, and latest investor rights agreements in diligence.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited or management-certified ARR, revenue, gross margin, burn, and cash balance figures.
    whyItMatters: Public databases and media estimates conflict enough that a current valuation cannot be underwritten from open sources alone.
    diligencePath: Obtain management reporting package or banker materials covering the last twelve months and current-quarter run rate.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: minor
    topic: leadership-depth
    missingEvidence: A current, official executive and board roster with responsibilities beyond the founders and CRO.
    whyItMatters: Execution resilience and succession quality depend on whether leadership depth matches the company's current scale.
    diligencePath: Request an organization chart and board deck biographies.
    relatedQuestionRefs:
    - QO003
    - QO004
    relatedTableRefs:
    - TO002
  - type: stale
    severity: minor
    topic: next-refresh-triggers
    missingEvidence: A priced financing, IPO filing, or management update that refreshes valuation and monetization disclosures after 2026-07-20.
    whyItMatters: The company overview will change materially if a new financing or public filing resolves the valuation-disclosure gap.
    diligencePath: Monitor press releases, secondary-market commentary, and any SEC filing activity for a new priced event.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: material
    topic: public-arr-vs-revenue-estimates
