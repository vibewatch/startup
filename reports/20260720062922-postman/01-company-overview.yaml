  - CO017
  - CO018
  tableRefs:
  - TO003
- id: strategic-trajectory
  title: Strategic Trajectory and Category Positioning
  body: 'The company''s recent strategy is to turn API collaboration into an AI-native systems layer. Postman''s 2025 State of the API report argues that API strategy is becoming AI strategy, and the report''s own survey data describes APIs as revenue-generating assets that increasingly need collaboration and machine-readable structure. Postman then translated that narrative into product: TechCrunch covered the January 2025 launch of AI Agent Builder, and Postman''s own materials introduced Agent Mode and AI Engineer as assistants that can act across collections, specs, environments, and workflow assets. The acquisitions of Orbit, liblab, and Fern fit the same arc. Orbit broadened community and developer-engagement capabilities, liblab added SDK generation, and Fern added documentation plus SDK automation. Together, these moves indicate that Postman is trying to own more of the surface area between API producers, API consumers, and AI agents that will invoke those APIs.'
  claimRefs:
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
  - CO031
- id: adverse-events
  title: Adverse Events and Reliability Signals
  body: 'The most meaningful recent negative signal is no longer hypothetical. Postman''s own trust portal states that a third-party Klue compromise led to exfiltration of customer contact and sales information from Salesforce in June 2026, even though product or core customer data was not accessed from Gong. Separate external reporting from CloudSEK, Cyber Security News, and Treblle also preserved the 2024 public-workspace exposure episode, in which tens of thousands of publicly accessible workspaces surfaced tokens, keys, and other sensitive material. These reports do not mean Postman itself was uniquely insecure; a substantial share of the exposure appears to have come from user behavior and weak secrets hygiene. But they do show that public collaboration carries real governance risk, especially for a platform encouraging broad sharing. Counterbalancing that, Postman''s status page showed core services operational at review time and desktop uptime at 100% over the trailing 90-day window.
    The risk posture is therefore mixed: strong operating continuity, but a growing security-governance burden as the platform scales and becomes more agentic.'
