- id: financial-model-and-competition-pressure
  title: Financial-model and competition pressure can compress value before legal issues ever do
  body: 'Even if Rokid avoids formal enforcement, the business model still carries hard hardware risk.
    ChinaBiz argues that category return rates can run at 30% to 50% because many use cases still compete
    with phones, which is exactly why Rokid is trying to pivot from pure hardware into a hardware-plus-services-plus-ecosystem
    model. That strategic move is reasonable, but it is also an admission that volume alone may not solve
    economics. Public investors or late-stage buyers will need proof that return rates, warranty claims,
    support contacts, and working capital are under control before rewarding a Hong Kong listing narrative.
    Caplight and TechNode show capital and IPO movement, but the public set still lacks the unit-economics
    disclosure needed to underwrite durability.


    Competition amplifies that vulnerability. Meta already spans a wide consumer price range, XReal has
    fresh capital and Google ties, and Vuzix''s own risk factors describe exactly the category problems
    Rokid now faces: price pressure, platform dependence, short order visibility, tariffs, export controls,
    and cybersecurity exposure. HKEX''s specialist-technology route may help on structure, but it does
    not remove the need for investor-grade disclosure. If growth stays strong while margins, returns,
    or support quality deteriorate, the resulting compression will show up first in channel sentiment,
    then in valuation, and only later in reported financials.'
  claimRefs:
  - CR040
  - CR041
  - CR042
  - CR043
  - CR044
  - CR045
