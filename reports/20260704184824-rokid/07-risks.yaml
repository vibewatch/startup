company:
  name: Rokid
chapter:
  number: 7
  title: Risks
  summary: Rokid's biggest risks cluster around privacy and regulatory tolerance for camera-equipped AI
    glasses, concentrated manufacturing and channel dependencies, and thin public visibility into the
    unit economics needed for an IPO-quality hardware story. The company has credible mitigations and
    visible demand, but residual exposure stays high until privacy controls, support quality, and economic
    disclosure mature as fast as distribution.
sections:
- id: privacy-legal-and-ai-compliance
  title: Privacy, legal, and AI-compliance risk sits at the top of the stack
  body: 'Rokid''s most important downside is not a disclosed lawsuit today; it is the widening gap between
    what the product can do and what governments, bystanders, retailers, and enterprise buyers will tolerate
    from camera-equipped AI eyewear. Rokid''s own policies show a broad data footprint across account,
    device, network, content, and telemetry layers, plus sharing with developers, affiliates, service
    providers, and law enforcement. The terms then add consumer-friction features such as liability caps,
    warranty disclaimers, and ambiguous public-facing venue language. That would already matter for a
    normal connected device. It matters more here because the company is pushing glasses that capture
    images, audio, transcription, translation, and cloud-assisted AI into cross-border retail channels.


    The June 2026 covert-recording backlash turned this from abstract policy risk into a concrete adoption
    issue. TechNode, OECD''s AI incident tracker, Flanders-China, and Gizmodo all point to the same pattern:
    people were recorded without consent; indicator-light workarounds existed; and the response shifted
    immediately from product novelty to governance adequacy. That makes Rokid vulnerable on several fronts
    at once. The EU AI Act tightens disclosure, monitoring, and biometric obligations on relevant use
    cases, the ICO frames covert or weakly-notified recording as intrusive processing that must be lawful
    and proportionate, and China''s revised cybersecurity posture is more willing to fine, suspend, or
    escalate quickly. In other words, privacy and AI rules are no longer generic background noise; they
    are a direct go-to-market gate for a device category built around always-nearby sensors.'
