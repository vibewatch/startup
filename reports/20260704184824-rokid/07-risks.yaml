  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: manufacturing-concentration
    missingEvidence: Exact Lens Technology contract terms, second-source component strategy, and production-yield
      history are not public.
    whyItMatters: Exclusive or near-exclusive manufacturing dependence can turn demand spikes into delivery
      failures and margin pressure.
    diligencePath: Request manufacturer contracts, alternate supplier plan, component BOM concentration,
      and monthly yield / rework dashboards.
    relatedQuestionRefs:
    - QR015
  - type: private-evidence-only
    severity: blocking
    topic: economics-disclosure
    missingEvidence: Gross margin, return rate, warranty-claim rate, working-capital intensity, and refund
      reserve data are not publicly disclosed.
    whyItMatters: Without these metrics, it is impossible to judge whether hardware demand converts into
      healthy unit economics or cash burn.
    diligencePath: Obtain monthly cohort returns, gross margin by product, warranty reserve trends, inventory
      turns, and accounts-payable / receivable aging.
    relatedQuestionRefs:
    - QR023
  - type: missing-source
    severity: material
    topic: recalls-and-litigation
    missingEvidence: A comprehensive regulator and court record pack for recalls, consumer-product disputes,
      and privacy complaints was not publicly assembled in one place.
    whyItMatters: Hidden product-liability or privacy-enforcement history would change both downside severity
      and IPO readiness.
    diligencePath: Run counsel-led docket searches across core sales jurisdictions and request management's
      schedule of claims, complaints, and regulator correspondence.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: material
    topic: llm-and-data-processing-agreements
    missingEvidence: The contracts, DPAs, retention settings, and data-flow diagrams for Rokid's external
      AI, mapping, translation, and developer partners are not public.
    whyItMatters: Third-party model and app dependencies can create cross-border privacy, uptime, and
      cost shocks that are invisible in marketing materials.
    diligencePath: Request partner list, DPA templates, model-routing logic, uptime SLAs, and incident-escalation
      commitments for each major API dependency.
    relatedQuestionRefs:
    - QR018
