- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Privacy / consent breakdown
    - New covert-recording incidents or regulator inquiry
    - Another public scandal without validated anti-bypass controls or a named regulatory notice
    - Pause underwriting; require product-control proof and incident register before proceeding
  - - Fulfillment and support drag
    - Returns, refunds, shipping delays, or public complaints
    - Return / complaint trend rising materially while international mix expands
    - Discount growth narrative and request cohort economics before valuation discussion
  - - Manufacturing concentration
    - Lens partner disruption or backlog spike
    - Visible shipment delays, degraded ratings, or missed launch windows tied to supply
    - Treat volume targets as unreliable and assume margin compression
  - - Competitive pricing pressure
    - Meta / XReal / other rival launches
    - Rival feature parity at equal or lower price while Rokid still lacks recurring-services proof
    - Lower multiple / stretch valuation stance and tighten entry discipline
  - - IPO / disclosure readiness gap
    - Listing progress without operating-metric disclosure
    - Filing momentum arrives before margin, return-rate, and concentration data are shared
    - Move to research-more unless management provides a full operating pack
  notes: These are the specific monitors that convert chapter 7 from a narrative risk list into an actionable
    diligence and portfolio-management framework.
