  title: Regulatory / legal risk register
  enumerationScope:
    coverage: exhaustive
    basis: Rows enumerate the material legal and regulatory risks visible in the reviewed public sources
      for Rokid as of the run date, focusing on privacy, biometric compliance, cyber rules, consumer terms,
      and IPO readiness rather than speculative private disputes.
  columns:
