  - jurisdiction
  - status
  - likelihood
  - severity
  - mitigation
  - residual exposure
  - diligence path
  rows:
  - - Covert-recording and bystander-consent backlash
    - China plus any camera-enabled market
    - Public incident already occurred in 2026; remediation announced but not yet independently validated
    - High
    - Critical
    - Hardware indicator changes, obstruction detection, takedowns, user-policy updates
    - High
    - Request incident log, product-redesign timeline, and moderation metrics by market
  - - Biometric, surveillance, and AI-transparency obligations
    - EU / UK / US states
    - Relevant rules are active or tightening for biometric, deepfake, and surveillance use cases
    - Medium-High
    - High
    - Notice, consent, human oversight, logging, DPIAs, feature controls
    - High
    - Request DPIAs, consent UX, data maps, and market-specific legal memos
  - - China cybersecurity and data-governance enforcement
    - PRC
    - Amended CSL effective from 2026 with faster fines and stronger app / site sanctions
    - Medium
    - High
    - Prompt rectification, security governance, supplier certification controls
    - Medium-High
    - Request security org chart, audit cadence, app-review logs, and response playbooks
  - - Consumer terms, refunds, and warranty friction
    - Cross-border e-commerce markets
    - Current terms cap liability and carve out many support scenarios
    - Medium
    - Medium-High
    - Clearer disclosures, lower-friction returns, better prescription support
    - Medium
    - Request refund-rate, chargeback-rate, and regulator-complaint history by geography
  - - HK IPO and disclosure readiness
    - Hong Kong
    - IPO preparation reported; specialist-tech route still demands execution and disclosure maturity
    - Medium
    - High
    - Board, disclosure, and control upgrades before filing
    - Medium-High
    - Request listing timetable, banker pack, board composition, and draft risk-factor outline
  notes: Rows are ordered by severity for the current thesis. The register is exhaustive only for publicly
    evidenced legal and regulatory risks; private complaints or regulator correspondence could add items.
