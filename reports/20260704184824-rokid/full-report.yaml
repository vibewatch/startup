  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      How Rokid’s public customer path runs from discovery and purchase to pairing, daily utility, and possible
      channel-driven expansion.
    data:
      nodes:
        - label: 1. Discover
          detail: >-
            Prospect encounters Rokid through crowdfunding, media coverage, online sales rankings, or optical-retail
            announcements
        - label: 2. Choose surface
          detail: >-
            Buyer picks between screenless Style, display-equipped Rokid Glasses, or the broader spatial-computing
            branch based on the job to be done
        - label: 3. Buy through channel
          detail: >-
            Purchase flows through Rokid website, crowdfunding, marketplace, or retailer and may include prescription
            support
        - label: 4. Pair and configure
          detail: >-
            Customer installs Hi Rokid, connects the device, sets AI preferences, and enables translation or media
            settings
        - label: 5. Daily utility
          detail: >-
            Use centers on translation, captions, teleprompting, travel, field reference, meeting notes, or light
            enterprise collaboration
        - label: 6. Expand or stall
          detail: >-
            Good utility can lead to retail expansion and workflow experimentation, while usability issues or thin admin
            tooling can cap broader rollout
    claimRefs:
      - CU003
      - CU009
      - CU018
      - CU022
      - CU029
      - CU043
