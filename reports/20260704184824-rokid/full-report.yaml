      - number: '2.2'
        title: Multiple Sizing Lenses and Why They Conflict
        blocks:
          - type: paragraph
            body: >-
              Public sizing data supports a multi-lens market view, not a single clean TAM. The broadest AR lens is
              already contradictory: Mordor sizes the 2026 AR market at about USD 125 billion, while Precedence places
              it above USD 207 billion for the same year and projects a far steeper long-range growth curve. These
              differences are not rounding noise; they likely reflect different decisions about whether to include
              mobile AR, spatial software, healthcare, advertising, and other ecosystem layers. A narrower device lens
              is also messy. MarketsandMarkets publishes a smart-glasses view that is directionally helpful because it
              isolates the device category and highlights industrial wearables, but its headline smart-glasses numbers
              are internally inconsistent, so they should be treated as low-confidence. The most decision-useful
              interpretation is therefore a ladder rather than a point estimate: a very broad AR market in the
              low-hundreds of billions, a narrower industrial or workflow-wearables layer in the
              single-to-low-double-digit billions, and an even narrower Rokid-reachable wedge inside consumer AI
              glasses, portable display glasses, and task-specific enterprise deployments. This chapter preserves those
              contradictions explicitly instead of converting them into false precision.
