      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Market Limits
        blocks:
          - type: paragraph
            body: >-
              The growth case is real. Rokid and Android XR both show how multimodal AI, translation, navigation, and
              hands-free capture expand the value proposition beyond novelty. Lighter frames and better optics make
              glasses socially and physically more usable than earlier XR hardware. Enterprise workflow platforms
              describe measurable productivity benefits in picking, assembly, maintenance, and remote support, while HBR
              and PwC support the broader idea that immersive interfaces and training can change how work is done. At
              the same time, the market is still constrained. Mordor highlights battery life, ergonomics, privacy,
              waveguide supply, and cross-platform fragmentation as active brakes. Rokid’s own mobile-office article
              admits that software ecosystems are still incomplete. Independent reviews are even more cautionary: PCMag
              explicitly says current waveguide glasses are not ready for everyone, and both PCMag and Tom’s Guide flag
              camera limitations, feature unevenness, and the way prescription costs can push effective ownership well
              above base prices. For valuation work, the conclusion is straightforward: category growth drivers are
              strong enough to justify a real market, but the realistic near-term SAM is narrower, more segmented, and
              more execution-dependent than any broad AR TAM headline suggests.
