      - number: '7.3'
        title: Partner, channel, and supply-chain dependence remains structurally high
        blocks:
          - type: paragraph
            body: >-
              Rokid's expansion story relies on a partner web that is strategically useful precisely because the company
              does not fully control it. ChinaBiz frames Lens Technology as the exclusive manufacturing stabilizer,
              while the retail story depends on a relatively small set of showcase partners and channels such as Optical
              88, Selfridges, mall activations, Amazon, and crowdfunding platforms. That structure helps a young company
              gain reach quickly, but it also concentrates execution risk. A manufacturing miss, a customs bottleneck, a
              weak retail demo experience, a marketplace rating slide, or a partner policy change can reverberate
              through demand perception much faster than it would for a mature direct-sales platform.


              The software side is similarly dependent. Rokid markets support for multiple AI models and third-party
              services, and its privacy policy explicitly says developers can receive user information and may collect
              directly through their own experiences. Glass Almanac and AI-Watch both describe a large and growing
              developer community, which is strategically attractive but increases moderation, security, compliance, and
              uptime scope. Investors should view that ecosystem as a multiplier of both upside and control burden. The
              more Rokid sells an open AI platform rather than a single-function device, the more its brand will depend
              on partners, APIs, data practices, and service continuity that sit outside direct hardware manufacturing.
