            body: >-
              The current go-to-market picture looks like a mix of direct e-commerce, crowdfunding-style demand
              generation, app-led onboarding, and selective channel expansion rather than a fully transparent enterprise
              sales engine. CNBC reported that 40% of revenue already came from outside mainland China and that Rokid
              aimed to sell up to one million pairs in 2026, while company materials point to global web launch,
              selected online and offline retail channels, and thousands of developers or enterprise partners. Those are
              encouraging top-of-funnel signals, but not efficiency math. There is no public CAC, payback, conversion,
              return-rate, or channel-discount disclosure. The best proxies are units, rankings, app adoption surfaces,
              and post-sale support friction. The app-store evidence is especially important: onboarding, AI features,
