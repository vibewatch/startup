            body: >-
              Public facts point to a cost base that is broader than product BOM alone. Rokid sells devices with
              displays, cameras, audio, batteries, and companion compute, ships internationally from China, supports
              prescription optics, and relies on mobile apps plus cloud-backed AI and translation features. That implies
              hardware costs, logistics, support, firmware and app maintenance, and some continuing inference or
              service-delivery spend. Independent review and app evidence also suggests that feature quality still
              requires iteration, which usually means higher support and warranty burden before scale economics improve.
              The comparator set is cautionary. Vuzix's 2025 filing shows a small smart-glasses vendor can still produce
              gross losses, consume operating cash, and take inventory-obsolescence charges. Meta's Reality Labs
