      - number: '3.2'
        title: Capability Breadth, Form Factor, and Pricing Show Different Overlap by Buyer Job
        blocks:
          - type: paragraph
            body: >-
              Capability overlap varies by job rather than by brand list. Meta's lifestyle AI glasses concentrate on
              camera, open-ear audio, voice AI, and progressively richer display features at consumer-friendly prices.
              Rokid counters with a broader own-line stack: Style for screenless AI, Rokid Glasses for visible-display
              AI, and AR Spatial for a private-screen productivity bundle. XREAL and RayNeo are closest to Rokid's
              display-and-companion lane because they sell wearable screens and AR companions rather than rugged
              industrial tools. Quest 3 and Vision Pro sit farther up the immersion curve: they offer richer
              spatial-computing environments, but their headset form factor makes them a different purchase from eyewear
              that users might wear outside the home or office. Pricing reinforces the segmentation. Sub-$300 products
              cluster around accessory or screenless consumer devices, mid-hundreds devices add displays or AI, and
              multi-thousand headsets sit in a premium spatial-computing category. Public list prices are useful for
              direction, but some vendor e-commerce labels are internally inconsistent, while enterprise-focused vendors
              often hide pricing behind sales conversations.
