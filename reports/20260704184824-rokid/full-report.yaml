        - Revenue quality remains unscored without mix and concentration
        - Request quarterly revenue by product line, geography, and channel for at least eight quarters
      - - Realized ASP and discounting
        - Style launch pricing differs from current product-page pricing
        - Determines whether public list prices translate into gross profit or are mostly promotional anchors
        - Margin model is highly sensitive to hidden discounts and bundles
        - Request order-level ASP bridge including taxes, coupons, channel rebates, and returns
      - - Gross margin by product and service layer
        - Hardware complexity, shipping burden, and cloud dependence imply cost, but no dollars are disclosed
        - Without gross margin, investors cannot assess scale efficiency or capital needs
        - Blended margin could be far below consumer-tech expectations
        - Request SKU gross margin, warranty reserve, cloud-service cost, and lens-margin breakdown
      - - Returns, warranty, and refurbishment
        - Review and app friction show quality risk, but no return or warranty data is public
        - Hardware businesses can destroy economics through returns even at strong top-line growth
        - Underwriting downside is currently opaque
        - Request return rates, DOA rates, warranty spend, and refurb resale assumptions
      - - CAC, payback, and channel economics
