      - number: '1.3'
        title: Capitalization, Ownership, and Stage
        blocks:
          - type: paragraph
            body: >-
              Rokid’s capital story is large enough to matter, but still not clean enough to treat as fully settled
              without filing support. The best-documented step is the November 2023 Series C, where multiple independent
              reports say NetDragon backed a $112 million round and helped push Rokid to unicorn status. By 2026 the
              company had clearly advanced into IPO preparation: Caplight labels the latest round as “IPO Announced,”
              TechNode reported that Hong Kong filing work could begin by late April, and ChinaBiz Insider described
              early-2026 capital increases that brought in 39 new shareholders including Lens Technology and SenseTime.
              That ownership refresh appears strategic as much as financial, linking Rokid to manufacturing and AI
              partners just as competition intensifies. The exact cumulative capital figure is less tidy. Caplight shows
              $348.23 million raised, while ChinaBiz says more than RMB 3 billion has been injected since inception, so
              investors should expect reconciliation work between primary financing, strategic placements, and other
              capital flows once a prospectus or audited cap-table package becomes available. Forbes also described a
              nearly $70 million Hefei-backed January 2024 enterprise expansion round, which fills in an important
              bridge between the 2023 unicorn financing and the 2026 IPO narrative: Rokid was still raising growth
              capital to fund industrial expansion, not simply waiting for a listing window to reopen.
