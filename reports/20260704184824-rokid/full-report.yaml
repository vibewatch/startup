      - number: '7.2'
        title: Operational quality, support, and product-safety execution are the next major risk tier
        blocks:
          - type: paragraph
            body: >-
              Rokid's operational risk is the classic smart-glasses trap: fast demand growth arrives before the
              hardware, fulfillment, support, and feature-accuracy stack becomes boringly reliable. ChinaBiz already
              describes 2025 order volume overwhelming Rokid's supply chain, and the company's own shipping policy still
              reads like a multi-jurisdiction exception sheet: customs delays, address failures, lost parcels,
              prescription-processing lag, and customer-paid reshipment in some scenarios. The warranty and refund
              policies also show where the company draws its line. Prescription orders can become final sale,
              non-official accessories can void coverage, and factory-reset obligations shift data-loss burden to the
              user. Those are understandable controls, but they also create friction in a product where fit, optics, and
              day-two satisfaction are central to retention.


              Independent testing and customer feedback add the sharper edge. VR Expert says enterprise rollout still
              faces prescription logistics, charging, device-management, and feature-accuracy gaps. Trustpilot
              complaints cluster around shipping, refund timing, support responsiveness, and lens issues, while Amazon
              makes product ratings and return behavior public. The operational question is therefore not whether Rokid
              can ship units; it already can. The question is whether the company can keep support quality, quality
              control, translation accuracy, and public trust high enough when the product is sold through more stores,
              more countries, and more everyday use cases than the original crowdfunding audience.
            claimRefs:
