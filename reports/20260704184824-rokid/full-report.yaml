  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer surfaces and who actually buys Rokid
        blocks:
          - type: paragraph
            body: >-
              Rokid’s public customer story is not a single neat enterprise roster; it is a stack of consumer, channel,
              and light-enterprise surfaces that overlap. Company materials and launch distribution statements
              consistently say Rokid serves consumers, developers, and enterprise users, while the product lineup itself
              splits the market into at least three buyer jobs. AI Glasses Style is the cheaper, screenless, voice-first
              option for buyers who want translation, calls, meeting notes, and hands-free capture without an in-lens
              display. Rokid Glasses or RV101 adds captions, navigation, and prompts that make more sense for
              presenters, multilingual professionals, supervisors, and other users who need glanceable information
              during a task. AR Spatial keeps a productivity and remote-collaboration branch alive for customers who
              want a larger virtual workspace rather than just a heads-up layer.


              That breadth matters because it explains why Rokid’s public segmentation is broader than “enterprise AR
              glasses” or “consumer smart glasses” alone. Official use-case articles map the same platform family into
              manufacturing, logistics, healthcare, retail, travel, education, and tourism. Yet the sales motion
              disclosed in public is still channel-heavy. Rokid’s own contact surface routes enterprise demand through a
              general enterprise email rather than through a mature public case-study library or procurement portal,
              while PR, retailer, and review surfaces do much more work than customer logos in explaining who buys
              today. The most defensible segmentation read is therefore pragmatic: Rokid clearly reaches consumers and
              prosumer workflow users today, welcomes enterprise pilots, and still relies heavily on retail,
              crowdfunding, and ecosystem narratives to fill in the gaps left by sparse named current enterprise
              references.
