  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Evidence baseline and valuation anchors
        blocks:
          - type: paragraph
            body: >-
              Rokid's valuation case starts with unusually uneven evidence. The strongest primary anchor is not a
              financing press release, but the March 2026 Conant Optical filing, which confirms a RMB180 million
              investment for no more than 5% of Lingban Technology. That gives investors a real floor for one disclosed
              slice of the cap table, but not a complete answer for the whole round. At the other end of the range, The
              Wire China's reporting and companion brief place Rokid at $2.1 billion in March 2026. Between those
              endpoints, secondary data services and private-market trackers still show a noisy distribution of marks.
              This means the chapter cannot responsibly present Rokid as a clean point estimate. It must treat valuation
              as a moving band shaped by how much of the 2026 financing was strategic, how much was price-discovery, and
              how much depends on disclosures that have not yet surfaced in an application proof or prospectus.
            claimRefs:
