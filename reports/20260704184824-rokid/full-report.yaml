  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Directed graph showing how privacy, supply, support, and competition shocks can transmit into margin, growth, and
      valuation pressure.
    data:
      nodes:
        - id: privacy
          label: Privacy backlash
          description: Covert recording, weak notice, or regulatory scrutiny
        - id: supply
          label: Supply / fulfillment stress
          description: Manufacturing delays, customs issues, or backlog spikes
        - id: support
          label: Returns / support friction
          description: Refunds, prescription issues, and complaint accumulation
        - id: platform
          label: Platform dependency
          description: Model, map, developer, and API risk
        - id: margin
          label: Margin pressure
          description: Higher service cost and lower net hardware yield
        - id: growth
          label: Growth narrative hit
          description: Retail and international adoption slow materially
        - id: valuation
          label: Valuation / IPO compression
          description: Public-market or late-stage appetite weakens
      edges:
        - from: privacy
          to: growth
          label: reduces trust
        - from: privacy
          to: valuation
          label: raises compliance discount
        - from: supply
          to: support
          label: creates complaints
        - from: supply
          to: margin
          label: adds rework and expedite cost
        - from: support
          to: growth
          label: hurts conversion and repeat use
        - from: platform
          to: margin
          label: changes API cost / access
        - from: platform
          to: growth
          label: weakens feature utility
        - from: margin
          to: valuation
          label: cuts multiple
        - from: growth
          to: valuation
          label: weakens IPO story
    approximationNotes: >-
      The map simplifies a complex operating system into the causal links most likely to matter for underwriting and
      board-level monitoring.
