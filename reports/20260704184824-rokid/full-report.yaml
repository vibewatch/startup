  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Scope: Direct Rivals, Adjacent Headsets, Industrial AR, and Status-Quo Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Rokid does not face one clean competitor set. Its non-display AI glasses run into Meta's Ray-Ban and Meta
              Glasses push; its visible-display AI glasses run into the same Meta family plus Google- and Android-linked
              entrants; its AR Spatial and Max-like private-screen lane overlaps more closely with XREAL and RayNeo/TCL;
              and any enterprise-assisted-reality ambition runs into RealWear, Vuzix, legacy Epson Moverio, HoloLens,
              and the remains of Google Glass Enterprise Edition. Quest 3 and Vision Pro are not frame-like daily-wear
              substitutes, but they do compete for collaboration, entertainment, screen-extension, and spatial-computing
              budgets. The real baseline is broader still: many buyers can keep solving the job with a phone, laptop,
              monitor, tablet, or handheld frontline device if glasses do not create a clear enough ROI or comfort
              advantage. That boundary matters because Rokid's relative strength is breadth across several lanes, while
              many rivals dominate only one lane with more brand, channel, or workflow depth.
