      - number: '8.2'
        title: Comparable frame and scenario analysis
        blocks:
          - type: paragraph
            body: >-
              Public comparables do not support a price-insensitive view. Vuzix shows that public markets can award very
              high sales multiples to a tiny pure-play AR hardware company, but only on a small liquidity base and
              alongside deep losses. Meta Reality Labs demonstrates the other extreme: enormous category investment can
              still produce ugly near-term economics. The best direct peer is Xreal because it is the same broad product
              category, the same exchange venue, and the same year. Xreal's disclosed 2025 revenue, improved gross
              margin, and still-lossmaking profile create the most useful external benchmark for Rokid. Against that
              frame, a $2.1 billion Rokid valuation is not impossible, but it is ambitious. It requires belief that
              Rokid will earn more than a hardware multiple through local leadership, strategic manufacturing partners,
              and eventual software or service monetization. Without audited disclosure, the base case should sit closer
              to the comp-supported middle than to the top of the narrative range.
