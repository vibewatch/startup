      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The diligence agenda is therefore narrow and concrete. Investors need audited revenue and margin detail, a
              returns and warranty bridge, customer concentration data, and the current cap-table preference stack.
              Those items matter more than incremental market-growth articles because they are what determine whether
              Rokid deserves a premium to filing-backed peers. The absence of a public application proof is not just a
              timing inconvenience; it is the main reason confidence stays medium and the recommendation stays at track.
              Post-investment, the thesis should be considered broken if the filing reveals thin gross margins, high
              returns, or enterprise retention that does not support a services narrative. Conversely, the thesis
              improves if the filing shows revenue and margins close to the best peer disclosures while preserving
              upside from software attachment and strategic manufacturing execution. Until that evidence arrives, the
              correct discipline is to keep upside optionality while refusing false precision.
