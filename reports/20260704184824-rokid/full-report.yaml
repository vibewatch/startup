              optics, cameras, microphones, touch or button controls, and local firmware. The next layer is the phone
              companion, where pairing, device settings, AI model selection, firmware updates, media import, translation
              settings, and some remote-control features live. Above that sits a cloud and integration layer spanning
              multiple AI engines, Microsoft translation, maps, and whatever service routing Rokid enables by region and
              app version. AR Spatial and Station 2 show that the company is also pursuing a spatial-computing branch
              around YodaOS-Master, with keyboard/mouse input and browser-like multi-screen workflows. Public GitHub
              assets confirm that Rokid still exposes a developer surface, but the signal is mixed: core docs still move
