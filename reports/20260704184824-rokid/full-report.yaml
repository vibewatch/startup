  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The current call starts from genuine category momentum and strategic interest, but ends at track because
      disclosure quality is still too weak for price-insensitive conviction.
    data:
      nodes:
        - id: n1
          label: Primary valuation anchor
          detail: Conant filing gives a real but partial financing floor.
        - id: n2
          label: Headline upside
          detail: The Wire China supports a $2.1B top-end narrative.
        - id: n3
          label: Comparable discipline
          detail: Xreal, Vuzix, Goertek, and Meta frame what public markets reward.
        - id: n4
          label: Disclosure gap
          detail: No prospectus, audited revenue bridge, or preference stack is public.
        - id: n5
          label: Price-sensitive conclusion
          detail: Track now; upgrade only with better disclosure or cheaper entry.
      edges:
        - from: n1
          to: n3
        - from: n2
          to: n3
        - from: n3
          to: n5
        - from: n4
          to: n5
    claimRefs:
