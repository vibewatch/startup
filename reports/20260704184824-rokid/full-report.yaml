      - number: '4.4'
        title: Capital adequacy is the core underwriting blocker because fundraising is visible but treasury is not
        blocks:
          - type: paragraph
            body: >-
              Rokid does not look unfunded in historical terms. Caplight and ChinaBiz both place cumulative outside
              capital in the hundreds of millions of dollars, and TechNode's April 2026 reporting ties the company to a
              Hong Kong IPO process. That is directionally supportive for a business trying to scale consumer hardware,
              international shipping, and an       app-plus-services layer at the same time. It also means the current
              story is still partly one of financing capacity, not just operating self-sufficiency. But historical
              fundraising is not the same as current adequacy. No reviewed public source discloses today's cash balance,
              monthly burn, debt package, covenant constraints, or runway. Public traction is therefore ahead of public
              finance. The best financial verdict is mixed: revenue quality is improving because Rokid is not just
              selling one SKU, but margin path still appears dependent on moving mix toward software, services, lenses,
              and partner economics rather than pure device gross profit. Underwriting should stay cautious until
              management opens the P&L and treasury position.
