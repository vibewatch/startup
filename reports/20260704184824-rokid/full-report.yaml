      - number: '8.3'
        title: Recommendation, confidence, and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports interest in Rokid, but not a lead position at a stretched pre-disclosure price.
              Category growth is real, China demand appears genuine, and strategic investors offer some operating
              credibility. Those are reasons to keep the company active in pipeline. They are not yet reasons to ignore
              the gap between a filing-backed valuation floor and a press-supported top-end mark. The most defensible
              committee posture is track with medium confidence: stay engaged, ask for full economics and cap-table
              terms, and be willing to revisit if a prospectus or diligence room reveals better-than-expected revenue
              quality, margin profile, or attachment to recurring services. Price discipline is the core message. If
              entry terms move toward the comp-supported middle, or if new disclosure justifies a premium over
              Xreal-like hardware economics, the stance can improve. Until then, the public record says Rokid is
              strategically interesting but still too opaque to underwrite as a price-insensitive lead.
