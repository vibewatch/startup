  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing are visible at the edge, but realized economics are not
        blocks:
          - type: paragraph
            body: >-
              Rokid's public commercial surface is much richer than a single one-time gadget sale. Current official
              pages show a stack that includes Style, Rokid Glasses, AR Spatial, and a lower-cost Station companion
              device, while the launch materials add prescription-lens attach, reservation deposits, selected retail
              distribution, and an app-mediated AI service layer. That supports a multi-stream model made of hardware,
              companion accessories, prescription optics, and at least some software-like services around navigation,
              translation, and AI assistance. The financial problem is that nearly all of those surfaces are visible
              only as list-price or feature signals. Launch pricing and current pricing are already not perfectly
              aligned, which is useful evidence that realized ASPs may move with promotions or bundles. The same source
              set also shows that app activation, navigation, and translation matter to the commercial experience after
              checkout, which means some economic value is delivered after the hardware sale rather than only at the
              moment of shipment. Public evidence therefore supports revenue mechanisms, not recognized revenue mix,
              contract terms, or net unit economics.
