  title: IPO urgency is a warning signal as well as a growth signal
  body: 'Rokid''s move toward a Hong Kong listing seems driven by opportunity and pressure at the same time: large rivals are arriving, supply constraints are real, and public sources still do not provide the financial clarity that would normally de-risk a hardware-heavy listing story.'
