- id: milestones-risks
  title: Milestones and Adverse Signals
  body: 'Rokid’s chronology is unusually helpful because the company exposes a long hardware arc: voice devices in the mid-2010s, industrial and consumer AR glasses through 2020-2023, spatial-computing bundles in 2024, and AI glasses in 2025-2026. The same history also shows why 2026 matters. Independent coverage ties the IPO push to a narrow strategic window in which Rokid must scale before Meta, Alibaba, Xiaomi, Huawei, and eventually Apple make the category even harder for independent specialists. ChinaBiz reports that a 2025 order spike toward 300,000 units caused delivery delays and exposed supply fragility, while review coverage from PCMag, ZDNET, and Tom’s Guide shows the products are promising but not yet frictionless for mainstream adoption. Translation, captioning, and lightweight design are clear strengths; charging quirks, camera limitations, partial feature availability, and the absence of public revenue disclosure are equally real. In other words, Rokid looks more mature than
    a concept-stage wearable startup, but still earlier than a fully proven platform business. The recent chronology is therefore not just product launches but channel buildout: a January 2024 enterprise-expansion financing, a record 2025 Kickstarter close, Asia/Europe retail entries, and a March 2026 U.S. shelf push all landed before any prospectus became public.'
