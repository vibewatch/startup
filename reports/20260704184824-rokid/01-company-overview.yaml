- id: leadership-governance
  title: Leadership and Governance Visibility
  body: 'The leadership picture is strongest at the founder level and materially weaker below it. Public sources consistently identify Zhu Mingming, who uses the English name Misa Zhu, as founder and chief executive, and he is the person most visibly attached to Rokid’s product philosophy, fundraising narrative, and market positioning. That concentration creates a familiar founder-led upside and downside: the story is coherent, but key-person dependence is real. Wire China and CNBC also surface senior operator Gary Cai, while Wire China identifies Shao Huaqiang as global general manager, giving at least some visibility into commercial and international execution. What remains much less visible is formal governance. None of the accessible public pages in this source set provide a clear board roster, committee structure, or decision-rights map for the 2026 pre-IPO stage. That is important because the company’s ownership is changing quickly, and later-stage investors will likely care more about
    governance hygiene than earlier consumer-tech backers did.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO017
