company:
  name: Rokid
chapter:
  number: 1
  title: Company Overview
  summary: Rokid is a Hangzhou-founded AI and AR hardware-and-software company that now pairs a broad 2026 smart-glasses lineup with measurable crowdfunding and retail-channel momentum. Public evidence shows a founder-led, late-stage business preparing for a Hong Kong IPO after a 2023 unicorn round, a 2024 Hefei enterprise expansion raise, and a 2025-2026 push through Kickstarter, Asian/European stores, and U.S. optical retail, but audited revenue remains undisclosed and product/supply friction still tempers the story.
sections:
- id: identity-platform
  title: Identity and Platform Scope
  body: 'Rokid is a Hangzhou-founded AI and augmented-reality hardware company that now presents itself as a full-stack AI × AR platform rather than a single device brand. The core public identity is consistent across its Chinese and global sites: Rokid says it combines LLMs, computer vision, YodaOS software, and device hardware to bridge work and entertainment use cases. In practice that means the company is selling a portfolio that spans display AI glasses, display-free AI glasses, spatial-computing bundles, and companion boxes rather than betting on one hero SKU. The software stack matters to the story. Rokid’s public materials trace a path from YodaOS-XR to the current YodaOS-Master layer, while the app footprint now splits between a Hi Rokid or Rokid AI app for newer glasses and a separate Rokid AR app for AR Lite, Station, AR Studio, and Station Pro devices. That breadth is helpful later in diligence because it shows Rokid is trying to own both interface and ecosystem, not just optics.
    CES 2026 launch materials also show Rokid reframing this stack as an open AI ecosystem, not just proprietary firmware: the company said Ai Glasses Style works with ChatGPT, DeepSeek, Qwen, mapping, and translation services, which matters because it lowers platform lock-in risk relative to single-model eyewear products.'
