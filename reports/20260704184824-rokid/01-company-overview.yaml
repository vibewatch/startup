- id: products-footprint
  title: Product Footprint and Public Traction
  body: The 2026 lineup shows Rokid trying to cover multiple use cases instead of converging on one canonical form factor. AI Glasses Style is the lightweight, display-free assistant product aimed at translation, navigation, meeting notes, calls, and hands-free capture. Rokid Glasses is the display-equipped sibling with captions, prompts, and navigation overlays. AR Spatial, Max 2, Joy 2, and Station 2 keep the earlier entertainment-and-productivity branch alive, supported by YodaOS-Master and companion apps. That breadth likely improves merchandising and experimentation but also increases product, support, and supply-chain complexity. Public traction signals are directionally positive but not finance-grade. Official surfaces claim 11 generations of devices, 300-plus patents, and international reach; CNBC says Rokid led JD.com’s AI-frame sales rankings for three months and already generated 40% of revenue outside mainland China. Yet the company still does not disclose audited revenue or
    ARR in the accessible public record, so diligence has to rely on shipment, user, and preorder proxies rather than verified monetization data. The stronger 2025-2026 traction signals are crowdfunding and channel, not disclosed revenue. Rokid's own releases say the Kickstarter close reached $4.03 million from more than 5,800 backers in 80+ countries, the January retail update listed Selfridges, Mall of Asia, Taiwan crowdfunding, and Optical 88 in Hong Kong, and March Vision Expo coverage said the company was now prioritizing U.S. optical shelves while marketing a 20,000-25,000 developer ecosystem.
