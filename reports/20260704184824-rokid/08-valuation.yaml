- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Prospectus quality misses expectations
    - Filing omits or weakens revenue-quality, returns, or retention evidence
    - Top-end valuation narrative loses support immediately
    - Stay at track or pass unless price resets materially
  - - Margin and returns disappoint
    - Gross margin or return profile trails peer expectations for a premium hardware story
    - Rokid looks closer to crowded hardware than differentiated platform
    - Move toward bear-case underwriting
  - - Cap-table overhang is heavier than expected
    - Preferences, anti-dilution, or dilution breadth erode new-investor economics
    - Even fair operating performance produces poor entry economics
    - Avoid leading and renegotiate terms
  - - Software attachment remains thin
    - No meaningful recurring monetization despite growth in units or users
    - Premium multiple case collapses toward comp-supported hardware range
    - Maintain or lower stance until attachment improves
  notes: These triggers focus on what a filing or data room could reveal that would rapidly change the recommended entry posture.
  claimRefs:
  - CV027
  - CV031
  - CV032
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited consumer vs enterprise mix, returns, warranty, and customer concentration
    - Determines whether shipment growth is investable growth
    - Request management pack or prospectus draft tables under NDA
  - - Margins and unit economics
    - Gross margin bridge, BOM trend, and service gross margin if any
    - Separates hardware multiple from platform premium
    - Request monthly management reporting and channel economics
  - - Cap table and preferences
    - Preference stack, anti-dilution, and economics of 2026 strategic investors
    - Sets real entry economics for a new investor
    - Obtain financing documents or sponsor summary memo
  - - Software / services attachment
    - Evidence of paid recurring services, app-store take rate, or enterprise expansion revenue
    - The clearest path to defend a premium valuation over hardware-only peers
    - Request cohort and product-attach analysis by customer type
  notes: The diligence list is intentionally short because the biggest valuation uncertainty comes from a few missing financial
    and structural disclosures, not from lack of market articles.
