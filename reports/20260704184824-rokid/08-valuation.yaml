    - Customer and gross-margin evidence proves this is more than sponsor support
    - Moderate
  - - 'Anti-thesis: disclosure gap dominates'
    - No A1/prospectus means core underwriting still rests on secondary data
    - Audited revenue, returns, and cap-table terms become available
    - Very high
  notes: Rows separate what makes Rokid strategically interesting from what still prevents a lead-level valuation call.
