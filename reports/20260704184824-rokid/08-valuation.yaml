- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - Rokid converts China demand into durable scale, shows better-than-peer margins, and builds meaningful software/services
      attachment
    - Supports a premium to Xreal-like revenue multiples and can defend the upper end of public marks
    - Prospectus shows clean revenue quality, rising margins, and repeat enterprise expansion
    - Execution slippage or platform dependence still compresses upside
  - - Base
    - Rokid remains a strong China-first hardware brand with strategic partners but limited recurring monetization proof
    - Supports a range closer to filing-backed floors plus moderate premium for growth and partnerships
    - Prospectus resembles strong hardware economics more than platform economics
    - Premium contracts if category competition intensifies
  - - Bear
    - Growth is real but quality of revenue, returns, or margins disappoint, and public markets price Rokid like a crowded
      hardware story
    - Compression toward the Conant floor or weak secondary-market references becomes plausible
    - Delayed filing, soft margins, high returns, or weak retention are visible
    - Capital structure overhang and multiple compression dominate
  notes: Scenario rows stay qualitative where audited financials are absent, but each scenario is tied to explicit valuation
    logic and observable signals.
