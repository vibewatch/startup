- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / metric
  - Valuation or multiple
  - Why relevant
  - Limitation
  rows:
  - - Xreal
    - 2026 Hong Kong IPO peer; 2025 revenue about CNY516M and 35.2% gross margin
    - Private valuation about $833M-$1B, roughly 11x-14x revenue
    - Closest business-model and venue analogue for Rokid
    - Still private and not yet post-IPO price discovery
  - - Vuzix
    - Public pure-play AR hardware company
    - About $232M market cap on about $6.09M revenue, roughly 36x sales
    - Shows that public AR hardware can trade rich on tiny revenue bases
    - Liquidity is small and losses are heavy, so the multiple is not a clean scale benchmark
  - - Goertek
    - Manufacturing-adjacent wearable / AR supply-chain bellwether
    - Sub-1x sales style manufacturing profile in public markets
    - Useful lower-bound reminder for hardware and assembly economics
    - Not a direct consumer-platform comp
  - - Meta Reality Labs
    - Category leader segment economics
    - Massive revenue but about $19B annual operating loss
    - Sets the subsidy benchmark for the category and why giants can pressure pricing
    - Not a standalone investable entity or direct private comp
  notes: The comparable set mixes the closest direct peer with public market context on hardware and subsidy economics; it
    is intentionally partial because private AR comp disclosure remains limited.
