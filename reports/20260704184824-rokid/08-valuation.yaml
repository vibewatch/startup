  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  - Current weight
  rows:
  - - 'Bull: local leadership plus partner moat'
    - Rokid has visible China traction, strategic manufacturing allies, and a growing category
    - Prospectus shows strong revenue quality and software attachment
    - Meaningful but not decisive
  - - 'Anti-thesis: crowded hardware race'
    - Meta, Xreal, Xiaomi, Alibaba, and others compress the window for independent players
    - Clear proof that Rokid monetizes beyond hardware and keeps margins resilient
