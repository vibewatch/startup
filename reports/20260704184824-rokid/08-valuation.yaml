  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-dispersion
    missingEvidence: A management-approved round summary or prospectus table reconciling the Conant tranche, total Series
      D size, post-money valuation, and any differences across secondary-market trackers.
    whyItMatters: The current public record spans a filing-backed floor to a $2.1 billion headline, and that spread is too
      wide to collapse into a single valuation conclusion without primary disclosure.
    diligencePath: Request the latest cap-table summary and financing deck from management or the sponsor under NDA.
    relatedQuestionRefs:
    - QV003
    - QV004
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, returns, warranty, customer concentration, and enterprise retention metrics
      for 2025 and current 2026 trading.
    whyItMatters: These are the denominator and quality variables that determine whether Rokid deserves a premium to public
      hardware comparables.
    diligencePath: Do not move beyond track without prospectus data or equivalent audited diligence materials.
    relatedQuestionRefs:
    - QV020
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Preference stack, anti-dilution protections, and how the 2026 strategic investor group ranks relative
      to a new investor or IPO float.
    whyItMatters: Entry economics can look attractive on enterprise value and still be poor for a new investor if liquidation
      and dilution terms are unfavorable.
    diligencePath: Obtain a financing-term summary memo and updated cap-table waterfall before any lead or co-lead discussion.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: private-comp-coverage
    missingEvidence: Broader direct private comp disclosures beyond Xreal and database summaries, especially for RayNeo, INMO,
      or other Chinese peers.
    whyItMatters: The comparable table is directionally useful but not exhaustive, which limits precision on where Rokid should
      sit inside the private AR peer set.
    diligencePath: Refresh the comp set when more HKEX filings or audited Chinese peer disclosures become public.
    relatedQuestionRefs:
    - QV006
    - QV022
    relatedTableRefs:
    - TV004
