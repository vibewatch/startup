      - number: '8.4'
        title: 最终尽调问题与投资逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              因此，尽调议程很窄也很具体。投资人需要审计收入和利润率细节、退货与保修桥、客户集中度数据， 以及当前股权结构的优先权栈。这些事项比增量市场增长文章更重要，因为它们决定 Rokid
              是否值得相对有申报文件支撑的同业获得溢价。 缺少公开版申请文件不只是时间不便；它是置信度维持中等、建议维持跟踪的主因。投资后，如果申报文件显示毛利率薄、
              退货高，或企业留存无法支撑服务叙事，投资逻辑应视为已破。反过来，如果申报文件显示收入和利润率接近最佳同业披露，
              同时保留软件附着和战略制造执行带来的上行，投资逻辑会改善。在证据出现前，正确纪律是保留上行选择权，同时拒绝虚假精确。
