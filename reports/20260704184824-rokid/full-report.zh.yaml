      - number: '7.5'
        title: 缓释手段存在，但监控纪律比当下营销舒适感更重要
        blocks:
          - type: paragraph
            body: >-
              Rokid 并非无人管理。公司有可见政策、一年保修、30 天退货路径、多仓发货、一些 QC 表述， 并在舆论反弹后公开承诺强化录制指示。外部规则也提供了缓释清单：EU AI Act 强调监测、事件报告、文档、
              监督和网络安全；隐私律师强调同意、功能控制、供应商尽调和培训；Mayer Brown 指出，在中国执法姿态下，
              及时纠正可能产生实质影响。这些信号有用，因为它们指向一套可能成立的控制系统，而不是一家硬件公司事后临场补救。


              但投资逻辑仍取决于缓释是否被量化，而不只是被承诺。会击穿投资逻辑的事件很具体：再次出现可见的隐蔽录制争议，
              且没有可信技术预防；退货、保修或支持负担快于出货增长；制造或海关瓶颈削弱国际收入可信度；或者上市流程启动时， 仍缺少关于利润率、退货和集中度的投资人级披露。因此，正确的尽调姿态既不是恐慌，也不是自满， 而是把
              Rokid 按快速扩张、传感器密集的硬件平台来承销：它的控制系统必须和分销及生态叙事一样快地成熟。
