          - type: paragraph
            body: >-
              公开事实指向一个比产品 BOM 更宽的成本基础。Rokid 销售带显示、摄像头、音频、电池和伴侣计算的设备，从中国进行国际发货，支持处方光学，并依赖移动应用以及云端 AI
              和翻译功能。这意味着硬件成本、物流、支持、固件与应用维护，以及部分持续推理或服务交付支出。独立评测和应用证据还显示，功能质量仍需迭代；通常在规模经济改善前，这会带来更高的支持和保修负担。可比公司集合给出谨慎信号。Vuzix
              的 2025 年申报文件显示，小型智能眼镜供应商仍可能产生毛亏、消耗经营现金，并计提库存陈旧减值。Meta 的 Reality Labs
              披露则显示，即便平台领导者也把可穿戴视为资本密集且库存敏感的业务。Rokid 可能跑赢这些类比，但当前公开数据不足以支持假设它拥有干净的消费硬件毛利率曲线。
