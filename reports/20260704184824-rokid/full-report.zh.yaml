        - 索取订单级 ASP 桥，包括税费、优惠券、渠道返利和退货
      - - 按产品和服务层拆分毛利率
        - 硬件复杂度、运输负担和云依赖都指向成本，但未披露金额
        - 没有毛利率，投资者无法评估规模效率或资本需求
        - 混合毛利率可能远低于消费科技预期
        - 索取 SKU 毛利率、保修准备金、云服务成本和镜片毛利拆分
      - - 退货、保修和翻新
        - 评测和 App 摩擦暴露质量风险，但退货或保修数据没有公开
        - 即使收入高速增长，硬件业务也可能被退货打穿经济性
        - 当前下行承销不透明
        - 索取退货率、DOA 率、保修支出和翻新转售假设
      - - CAC、回本期和渠道经济性
        - 出货、排名和伙伴数量公开，但获客成本不公开
        - 需要验证增长是盈利驱动还是补贴驱动
        - 当前 GTM 效率只能靠代理判断
        - 按渠道索取 CAC、回本期、经销商条款和扣除营销后的贡献毛利
      - - 现金、现金消耗、现金跑道和债务
        - 有历史融资和 IPO 报道，但没有财资披露
        - 决定融资依赖和稀释风险
        - 无法公开承销资本充足性
        - 索取最新资产负债表、现金桥、债务排期和现金跑道情景
      - - 企业转化和集中度
        - 公司提到 5,000 个企业伙伴和大规模开发者数量，但没有付费账户细节
        - 需要判断生态主张能否转成耐久收入
        - 服务和伙伴收入质量仍不确定
        - 索取活跃付费企业客户名单、头部客户集中度，以及伙伴渠道附加收入
    notes: 缺失指标正集中在决定收入质量、毛利耐久性和融资依赖的字段，因此本章结论保持谨慎。
