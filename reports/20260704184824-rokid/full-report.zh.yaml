      - number: '6.4'
        title: 耐久性、投诉与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Rokid 的公开记录更能证明市场有兴趣，却还难证明需求耐久。最清晰的售后公开信号来自 Hi Rokid 应用商店页面。 页面显示，公司至少维护到 2026 年 6 月，真实客户也在配对设备、使用翻译、通过伴随
              App 管理媒体。 但摩擦同样显眼：Android 页面 172 条评论给出 2.8/5，近期投诉集中在导航和 Bluetooth 设备扫描； iOS 页面 27 个评分为 3.4/5。另有一条 Android
              评论认可它适合欧洲旅行，但提醒不少 AI 功能依赖稳定互联网连接。 这些细节恰恰决定复用：导航失灵、云端依赖和 App 质量，会决定产品是变成日常工具，还是只偶尔拿出来的新奇玩具。


              更大的尽调阻碍不是缺少热度，而是缺少结构化数据。公开来源没有披露 NRR、流失率、合同期限、复购节奏、 退货率或头部客户集中度；也没有调和生态规模口径，从 20,000 名开发者和 5,000 家企业合作伙伴，
              到 25,000 名开发者及企业，再到 30,000 名开发者和 100,000 名活跃用户。由此得出的承销结论很窄， 但站得住：Rokid
              显然有真实渠道动能、可见消费者需求、活跃产品支持和可信的企业用例。公开证据仍无法证明的是， 客户到底有多黏、收入基础有多分散，以及当前业务有多少来自企业重复部署，而不是一次性发布、零售售出或促销脉冲。
