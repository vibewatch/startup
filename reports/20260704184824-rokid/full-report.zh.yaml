          description: 服务成本上升，硬件净收益下降
        - id: growth
          label: 增长叙事受挫
          description: 零售和国际采用明显放缓
        - id: valuation
          label: 估值 / IPO 压缩
          description: 公开市场或后期资本兴趣转弱
      edges:
        - from: privacy
          to: growth
          label: 削弱信任
        - from: privacy
          to: valuation
          label: 抬高合规折价
        - from: supply
          to: support
          label: 引发投诉
        - from: supply
          to: margin
          label: 增加返工和加急成本
        - from: support
          to: growth
          label: 伤害转化和复购
        - from: platform
          to: margin
          label: 改变 API 成本 / 访问
        - from: platform
          to: growth
          label: 削弱功能效用
        - from: margin
          to: valuation
          label: 压低倍数
        - from: growth
          to: valuation
          label: 削弱 IPO 故事
    approximationNotes: 这张图把复杂运营系统简化为几条因果链：它们最可能影响投资研判和董事会层面的监控。
