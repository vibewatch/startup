        - 娱乐、翻译、便携显示买家
        - 公开定价激进，设备兼容性广
        - 企业工作流信任度不如 RealWear 或 Vuzix 明显
      - - RealWear
        - 工业辅助现实
        - 企业专业厂商
        - 一线、危险环境、维护
        - 坚固化、认证、工作流集成、应用市场
        - 不适合重视外观或轻量化的消费者使用
      - - Vuzix
        - 工业和轻量企业智能眼镜
        - 上市小众可穿戴厂商
        - 现场服务、医疗、一线、轻量企业使用
        - 覆盖坚固型 M400、波导 M4000、轻量 Z100
        - 公开定价和主流消费者牵引力不够明显
      - - Epson Moverio
        - 透明显示 AR / 早期开发者-企业线
        - 上市电子产品既有厂商
        - 开发者、企业可视化、系留工作流
        - 透明 Full HD 显示和成熟 AR 血统
        - 更依赖主机或控制器，AI 取向更弱
      - - Google Glass Enterprise Edition 企业线
        - 上一代辅助现实企业可穿戴设备
        - 平台方已停产
        - 动手作业的一线企业员工
        - 早期企业 AR 设计和基于 XR1 的辅助现实
        - 已不再销售，也没有持续的 Google 软件路线图
      - - 现有替代方案
        - 手机、笔记本、显示器、手持工作流组合
        - 根深蒂固的既有工具
        - 所有尚未被说服购买眼镜的人
