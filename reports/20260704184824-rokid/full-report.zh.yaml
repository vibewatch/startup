            body: >-
              公开证据显示，Rokid 已经越过概念阶段，但还没有摆脱落地摩擦。公司在发布 release notes、应用变更和多代产品，说明路线图真实存在，而不是静态 CES 原型。同时，日常可用性仍高度依赖 Hi
              Rokid 应用和云端服务质量。Google Play 评价提到附加设备的 Bluetooth 扫描冻结和导航失败。评测者对核心体验更正面，但仍描述了一个低光摄像头偏弱、音频不完美、专有充电选择、iOS
              后台权限麻烦，以及翻译表现可能依赖清晰音频、良好网络或强手机的品类。即便 AR Spatial 产品页评测也显示，舒适度和屏幕质量无法消除 DRM
              相关窗口行为等软件烦恼。这种组合说明产品家族已经商业化且在改进，但如果控制平面落后于硬件承诺，仍容易遭遇支持和留存摩擦。
