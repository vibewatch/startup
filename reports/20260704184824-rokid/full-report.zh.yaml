      - 集中度或阻碍
      - 影响
      - 尽调路径
    rows:
      - - 美国和欧洲眼镜零售扩张
        - 公开证据集中在渠道公告，而不是终端客户 cohort
        - 零售触点能放宽漏斗，但没有留存数据时，可能只是加快试用
        - 跟踪售出率、退货、验配服务附加率和配件复购
      - - 中国内地以外收入占比 40%
        - 未公开按消费者、企业和合作伙伴渠道拆分
        - 投资者无法判断国际需求是多元分布，还是依赖少数经销商
        - 请求提供按渠道划分的区域收入、头部合作伙伴和积压订单账龄
      - - X-Craft 带来的历史工业可信度
        - 当前这一代 AI 眼镜的实名企业案例仍然很薄
        - 历史案例能支撑企业叙事，但还不能证明当前一代部署深度
        - 请求提供当前企业客户 logo、机队规模以及生产部署 / 试点状态
      - - 生态与开发者规模主张
        - 定义从 2 万名开发者和 5,000 家合作伙伴，到 2.5 万名开发者及企业，再到 3 万名开发者和 10 万活跃用户不等
        - 生态定义若被放大或前后不一，会高估买方锁定
        - 请求经审计的定义、活跃开发者门槛和月活设备账户
      - - 消费者众筹和预订势头
        - 如果可用性或支持跟不上，预订和众筹热度会退潮
        - 漏斗顶端需求高，不等于购买后满意度可持续
        - 按 cohort 跟踪激活、退货、退款和联系支持率
      - - 公开企业询盘路径
        - 企业买家目前似乎仍从普通联系入口开始，而不是进入公开案例库或管理控制台
