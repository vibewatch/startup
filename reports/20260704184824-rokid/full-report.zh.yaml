      - number: '3.3'
        title: 切换成本、锁定、分销权力与企业信任把市场切开
        blocks:
          - type: paragraph
            body: >-
              消费显示眼镜的竞争相对流动。Rokid、XREAL 和 RayNeo
              都依赖手机、PC、主机或伴侣设备，因此买方往往可以多栖，而不用迁移深层软件资产。处方插件、配件和熟悉应用仍会制造摩擦，但相比受管理的企业部署，锁定程度不高。分销权力更不均衡。Meta 的消费渠道杠杆最强，因为它把
              AI 眼镜叠加到 Ray-Ban、Oakley，以及如今更低价的 Meta 品牌设备上；Apple 拥有无可匹敌的生态信任和隐私信号；Google 加 Qualcomm
              正走向平台和芯片标准化，可能让未来进入者更快拼出产品。在企业辅助现实中，信任较少来自头条演示，更多来自加固硬件、危险环境认证、应用市场、安全服务和迁移支持。也正是在这里，RealWear、Vuzix，甚至
              Microsoft 仍获支持但已冻结功能的 HoloLens 栈，看上去比 Rokid 现有公开材料更能进入采购流程。实际结果是，Rokid 的切换成本护城河更多来自硬件熟悉度，而不是生态控制。
