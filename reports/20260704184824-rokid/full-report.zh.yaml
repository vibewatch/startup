      - number: '2.2'
        title: 多套市场规模口径及其冲突原因
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据支持多口径视角，而不是一个干净的 TAM。最宽的 AR 口径已经相互矛盾：Mordor 将 2026 年 AR 市场估为约 USD 125 billion，Precedence 则把同年市场放在
              USD 207 billion 以上，并给出陡峭得多的长期增长曲线。这些差异不是四舍五入噪音；它们很可能反映出是否纳入移动
              AR、空间软件、医疗健康、广告和其他生态层的不同决定。更窄的设备口径也不干净。MarketsandMarkets
              发布的智能眼镜视角有方向性帮助，因为它隔离了设备品类并强调工业可穿戴，但其智能眼镜标题数字内部不一致，因此应视为低置信度。最有决策价值的解读不是点估计，而是一架阶梯：低数千亿美元级别的超宽 AR
              市场，数十亿到低双位数十亿美元的更窄工业或工作流可穿戴层，再往里才是 Rokid 可触达的一块，位于消费 AI 眼镜、便携显示眼镜和特定任务企业部署之中。本章明确保留这些矛盾，而不是把它们转换成虚假的精确度。
