  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 当前判断从真实的品类动能和战略兴趣出发，但结论只是跟踪：披露质量仍太弱，还支撑不了对价格不敏感的高确信度。
    data:
      nodes:
        - id: n1
          label: 主要估值锚
          detail: Conant 申报文件给出了真实但不完整的融资底部。
        - id: n2
          label: 表观上行空间
          detail: The Wire China 支撑 $2.1B 的上限叙事。
        - id: n3
          label: 可比公司约束
          detail: Xreal、Vuzix、Goertek 和 Meta 划出公开市场愿意奖励的边界。
        - id: n4
          label: 披露缺口
          detail: 没有公开的招股书、经审计收入桥或优先权结构。
        - id: n5
          label: 价格敏感结论
          detail: 先跟踪；只有披露改善或入场价格更便宜，才上调判断。
      edges:
        - from: n1
          to: n3
        - from: n2
          to: n3
        - from: n3
          to: n5
        - from: n4
          to: n5
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV013
      - CV027
      - CV028
      - CV030
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大敏感项有两条：硬件销售能否沉淀成可持续经济性，以及投资者愿意为这条过渡支付多高倍数。
    data:
      items:
        - label: 经审计收入质量
          value: 10
        - label: 毛利率韧性
          value: 9
        - label: 软件 / 服务附加率
          value: 8
        - label: 股权结构优先权
          value: 8
        - label: 竞争导致的倍数压缩
          value: 7
    claimRefs:
      - CV015
      - CV022
      - CV027
      - CV039
      - CV040
      - CV041
    approximationNotes: 柱状值为 0-10 的序数敏感性评分，由保留的公开证据合成，并非管理层指标。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持一条很宽的区间：有备案支撑的底部、可比公司支撑的中位，以及叙事驱动的高位情景。
    data:
      items:
        - label: 低情景 / 备案支撑底部
          low: 500
          mid: 650
          high: 800
        - label: 基准情景 / 可比公司支撑中位
          low: 800
          mid: 1100
          high: 1400
        - label: 高情景 / 叙事溢价
          low: 1600
          mid: 1900
          high: 2100
    claimRefs:
      - CV002
      - CV004
      - CV014
      - CV025
      - CV026
      - CV030
    approximationNotes: 所有数值均为示意性的百万美元，由公开备案、可比公司披露和报道估值标记合成。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 委员会式评分说明，为什么 Rokid 在战略上仍有吸引力，但还达不到领投级定价标准。
    data:
      items:
        - label: 品类增长
          score: 8
        - label: 战略伙伴支持
          score: 7
        - label: 可比公司支撑
          score: 5
        - label: 披露质量
          score: 3
        - label: 价格支撑
          score: 3
        - label: 领投准备度
          score: 2
    claimRefs:
      - CV016
      - CV020
      - CV025
      - CV027
      - CV028
      - CV029
      - CV030
      - CV032
    approximationNotes: 评分是基于保留公开来源得出的证据加权序数判断。
