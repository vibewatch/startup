  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、法律与 AI 合规风险位于风险栈顶端
        blocks:
          - type: paragraph
            body: >-
              Rokid 最大的下行风险，并不是今天已经披露的诉讼；而是产品能力与政府、路人、零售商和企业买家对带摄像头 AI 眼镜的容忍边界之间， 正在拉开的缺口。Rokid
              自己的政策显示，数据足迹覆盖账户、设备、网络、内容和遥测层，还会与开发者、关联方、 服务商和执法机构共享。条款随后叠加了容易引发消费者摩擦的设计：责任上限、保修免责声明，以及面向公共场所的含糊表述。
              普通联网设备遇到这些问题已经值得关注；Rokid 推的是能采集图像、音频、转写、翻译并借助云端 AI 的眼镜， 还要进入跨境零售渠道，风险权重更高。


              2026 年 6 月的隐蔽录制舆论反弹，把抽象政策风险变成了具体采用问题。TechNode、OECD 的 AI 事件追踪器、 Flanders-China 和 Gizmodo
              指向同一模式：有人在未同意的情况下被录制；指示灯存在规避办法； 外界反应立刻从产品新鲜感转向治理是否足够。Rokid 因而同时暴露在多条战线。EU AI Act 收紧相关用例的披露、 监测和生物识别义务；ICO
              将隐蔽录制或弱通知录制视为侵入性处理，必须合法且相称；中国修订后的网络安全姿态也更愿意快速罚款、 暂停或升级处理。换句话说，隐私和 AI 规则不再只是泛泛的背景噪音；对于围绕近身常开传感器搭建的设备品类，
              它们已经成为推向市场的直接门槛。
