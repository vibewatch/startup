      - number: '7.4'
        title: 财务模型和竞争压力可能先于法律问题压缩价值
        blocks:
          - type: paragraph
            body: >-
              即便 Rokid 避开正式执法，商业模式仍有硬件业务的硬风险。ChinaBiz 认为，由于许多用例仍在和手机竞争， 品类退货率可能达到 30% 到 50%；这正是 Rokid 试图从纯硬件转向“硬件 + 服务 +
              生态”模型的原因。 这个战略转向合理，但也承认单靠出货量未必能解决经济性。公开市场投资人或后期买家，在认可香港上市叙事之前， 需要看到退货率、保修索赔、支持触点和营运资本已经受控。Caplight 和
              TechNode 显示融资与 IPO 推进， 但公开资料仍缺少承销耐久性所需的单位经济披露。


              竞争会放大脆弱性。Meta 已覆盖很宽的消费者价格带，XReal 有新资本和 Google 关系，Vuzix 自己的风险因素则精准描述了 Rokid 现在面对的品类问题：
              价格压力、平台依赖、订单可见度短、关税、出口管制和网络安全暴露。HKEX 的特专科技路径也许能帮结构， 但不能替代投资人级披露。若增长仍强劲，但利润率、退货或支持质量恶化，压缩会先体现在渠道情绪，再体现在估值，
              最后才进入报告财务。
