chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与平台边界
        blocks:
          - type: paragraph
            body: >-
              Rokid 是一家创立于杭州的 AI 与增强现实硬件公司。如今它不再只把自己定位成单一设备品牌，而是一个全栈 AI × AR 平台。中英文官网传递的核心身份一致：Rokid 称自己把
              LLM、计算机视觉、YodaOS 软件和设备硬件组合起来，连接工作与娱乐场景。落到产品上，公司卖的是一组组合拳：带显示的 AI 眼镜、无显示屏 AI 眼镜、空间计算套装和伴侣盒子，而不是押注一个明星
              SKU。软件栈是这个故事的关键。Rokid 的公开材料把路径从 YodaOS-XR 延展到当前的 YodaOS-Master 层；应用侧则分成面向新眼镜的 Hi Rokid 或 Rokid AI 应用，以及服务
              AR Lite、Station、AR Studio 和 Station Pro 设备的 Rokid AR 应用。这种宽度在后续尽调中有用，因为它说明 Rokid 想同时掌握交互界面和生态，而不只是光学器件。CES
              2026 发布材料也显示，Rokid 正把这套栈重新表述为开放 AI 生态，而不只是自有固件：公司称 Ai Glasses Style 可接入
              ChatGPT、DeepSeek、Qwen、地图和翻译服务。相较只绑定单一模型的眼镜产品，这降低了平台锁定风险。
