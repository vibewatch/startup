      - number: '6.2'
        title: 采用信号与最强公开证明
        blocks:
          - type: paragraph
            body: >-
              公开采用证据真实存在，但单位混杂，不能误读成干净的客户 cohort 模型。CNBC 报道称，截至 2026 年 4 月，Rokid 在此前三个月占据 JD.com AI 眼镜销量榜首；TechNode 则称，到
              2025 年底，AI 眼镜累计销量已超过 300,000 台。eHangzhou 和 AIBase 分别描述，Rokid Glasses 在量产启动前后拥有 250,000 份全球预订；Markets
              Insider 称该产品家族在 2025 年通过全球众筹筹得超过 $6 million。合在一起，这些信号支持一个可信结论：Rokid
              在面向消费者的渠道里已经越过单纯原型或演示规模。不过，它们没有说明多少设备在出货后保持活跃，多少通过零售而非众筹售出，也没有说明装机基数中企业买方与个人买方各占多少。


              国际上，公开证明集在 2026 年也改善了。CNBC 称，Rokid 已经有 40% 收入来自中国大陆以外，并向包括 U.K. 和 Canada 在内的国家发货显示眼镜。Markets
              Insider、TechTimes、Glass Almanac 和 PR Newswire 的法国新闻稿都指向同一方向：Rokid
              正有意从电商和众筹走向光学零售和本地分销。Krys、Fnac、Darty、Cdiscount 和 Boulanger 作为企业 logo 的意义没那么大，更重要的是证明 Rokid
              试图在眼镜买方本来购物的地方建立反复发现界面。本章的关键提醒是：这些是强渠道和需求证明，但不能替代留存数据、头部客户集中度，或已披露的大型现有企业机队名单。
