        - $599.99，512GB
        - 沉浸式 VR/MR 头显和应用生态
        - 更像强势沉浸式计算替代品，而非眼镜替代品
        - 头显体积会改变购买决策
      - - Apple Vision Pro
        - 截至 2026 年 6 月下旬，基础款 $3,699
        - 搭载 Apple 栈的高端空间计算头显
        - 拉高技术上限，但瞄准完全不同的预算
        - 当前价格来自独立报道，不只依赖营销页
      - - XREAL Beam Pro
        - $199 起价
        - XREAL 眼镜的配套计算设备，支持 Google Play 应用
        - 低成本强化显示眼镜工作流
        - 不是独立完整眼镜套装
      - - XREAL One Pro + Beam Pro 套装
        - $798 套装
        - 显示眼镜加伴随计算终端
        - 直接切入 Rokid 私密屏生产力预算带
        - 套装页的促销标识内部也不一致
