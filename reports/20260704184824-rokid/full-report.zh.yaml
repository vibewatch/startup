  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 版图范围：直接对手、相邻头显、工业 AR 与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Rokid 面对的不是一组干净的竞争对手。它的无显示屏 AI 眼镜会撞上 Meta 的 Ray-Ban 和 Meta Glasses 推进；它的可视显示 AI 眼镜会撞上同一个 Meta 家族，以及与
              Google 和 Android 相关的进入者；AR Spatial 和类似 Max 的私人屏幕路线更接近 XREAL 和 RayNeo/TCL；任何企业辅助现实野心，则会遇到 RealWear、Vuzix、传统
              Epson Moverio、HoloLens，以及 Google Glass Enterprise Edition 的余脉。Quest 3 和 Vision Pro
              不是眼镜式日常佩戴替代品，但它们会争夺协作、娱乐、屏幕扩展和空间计算预算。真正的基线还更宽：如果眼镜无法创造足够清晰的 ROI
              或舒适度优势，很多买方可以继续用手机、笔记本电脑、显示器、平板或手持前线设备解决任务。这条边界重要，因为 Rokid 的相对强项是横跨几条赛道的宽度，而许多对手只在一条赛道里拥有更强的品牌、渠道或工作流深度。
