      - number: '1.2'
        title: 领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层信息在创始人层面最清楚，往下则明显变弱。公开来源一致把使用英文名 Misa Zhu 的朱明明确认为创始人兼首席执行官；他也是 Rokid
              产品理念、融资叙事和市场定位中最显眼的人。这种集中度带来典型的创始人主导型利弊：故事完整，但关键人依赖真实存在。Wire China 和 CNBC 还提到高级运营者 Gary Cai，Wire China
              则确认邵华强担任全球总经理，因此至少能看到一些商业化和国际执行线索。真正不清楚的是正式治理。在本来源集可访问的公开页面中，没有任何页面给出清晰的董事会名单、委员会架构或 2026 年 IPO
              前阶段的决策权地图。这一点重要，因为公司股权正在快速变化，后期投资者对治理规范性的关注很可能高于早期消费科技投资方。
