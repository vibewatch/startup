      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方分层因路径而大不相同。无显示屏 AI 眼镜中，买方和付款方通常是同一个人：为翻译、拍摄、导航、记笔记或全天佩戴的社交可接受度买单的消费者或专业消费者。消费 AR
              或空间生产力眼镜中，待完成任务转向私人屏幕、便携娱乐或移动办公多任务，因此付款方可能仍是终端用户，但支付意愿越来越像一次生产力硬件采购。企业辅助现实又是另一回事。工作流厂商和工业眼镜供应商围绕拣选、装配、巡检、维护、远程协助和培训来销售，这意味着预算所有权往往在运营、工厂、现场服务、仓储或培训负责人手里，而不是消费电子买方。知识工作空间计算则可能归
              IT、创新、设计、工程或数字工作场所团队，因为价值来自协作、屏幕扩展和应用工作流集成。Rokid 案例中最弱的公开证据，不是用例分类本身，而是 Rokid
              是否已经把这些企业工作流转化成具名且有规模的部署。这个缺口让本章不能夸大近期企业渗透。
