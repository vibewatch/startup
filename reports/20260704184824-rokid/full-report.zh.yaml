        - 申报文件省略或弱化收入质量、退货或留存证据
        - 高端估值叙事立即失去支撑
        - 保持跟踪或放弃，除非价格大幅重设
      - - 利润率和退货表现令人失望
        - 毛利率或退货画像落后于高溢价硬件故事的同业预期
        - Rokid 看起来更像拥挤硬件，而不是差异化平台
        - 按熊市情景承销
      - - 股权结构包袱重于预期
        - 优先权、反稀释或稀释范围侵蚀新投资人经济性
        - 即使经营表现尚可，进入经济性也很差
        - 避免领投，并重新谈判条款
      - - 软件附加仍然薄弱
        - 尽管设备或用户增长，但没有有意义的经常性变现
        - 溢价倍数逻辑坍缩，回到可比公司支撑的硬件区间
        - 维持或下调立场，直到附加率改善
    notes: 这些触发因素聚焦申报文件或数据室可能揭示、并会快速改变建议进入姿态的事项。
    claimRefs:
      - CV027
      - CV031
      - CV032
      - CV041
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 经审计的消费者 vs 企业收入结构、退货、保修和客户集中度
        - 决定出货增长是否是可投资增长
        - 在 NDA 下索取管理层材料包或招股书草稿表格
      - - 利润率和单位经济模型
        - 毛利率桥、BOM 趋势，以及如有服务业务，其服务毛利率
        - 把硬件倍数与平台溢价区分开
        - 索取月度管理报表和渠道经济模型
      - - 股权结构和优先权
        - 优先权堆栈、反稀释，以及 2026 年战略投资人的经济性
        - 设定新投资人的真实进入经济性
        - 获取融资文件或保荐人摘要备忘录
      - - 软件 / 服务附加
        - 付费经常性服务、应用商店抽成率或企业扩张收入的证据
        - 这是相对纯硬件同行守住溢价估值的最清晰路径
        - 按客户类型索取分群和产品附加分析
    notes: 尽调清单有意保持简短，因为最大的估值不确定性来自少数缺失的财务和结构披露，而不是市场文章不足。
    claimRefs:
      - CV022
      - CV027
      - CV039
      - CV040
      - CV042
