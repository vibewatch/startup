      - number: '1.4'
        title: 产品版图与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              2026 年产品线显示，Rokid 试图覆盖多个用例，而不是收敛到一个标准形态。AI Glasses Style 是面向翻译、导航、会议纪要、通话和免手持拍摄的轻量无显示屏助手产品。Rokid Glasses
              是带显示的同门产品，提供字幕、提示词和导航叠加。AR Spatial、Max 2、Joy 2 和 Station 2 则保留了较早的娱乐与生产力分支，由 YodaOS-Master
              和伴侣应用支撑。这种宽度可能改善陈列销售和实验空间，但也提高了产品、支持和供应链复杂度。公开牵引信号方向积极，但还不到财务级别。官方页面声称已有 11 代设备、300 多项专利和国际覆盖；CNBC 称 Rokid
              连续三个月位居 JD.com AI 眼镜销量榜首，并且已有 40% 收入来自中国大陆以外。不过，公司仍未在可访问公开记录中披露经审计收入或
              ARR，因此尽调只能依赖出货、用户和预订代理指标，而不是经验证的变现数据。2025–2026 年更强的牵引信号来自众筹和渠道，而不是已披露收入。Rokid 自有新闻稿称 Kickstarter 收官时获得来自
              80 多个国家、5,800 多名支持者的 $4.03 million；1 月零售更新列出 Selfridges、Mall of Asia、台湾众筹和香港 Optical 88；3 月 Vision Expo
              报道则称，公司正在优先推进美国光学零售货架，同时宣传 20,000–25,000 名开发者生态。
