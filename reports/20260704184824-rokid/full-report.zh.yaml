        title: 收入模式和定价边缘可见，但实际经济性不可见
        blocks:
          - type: paragraph
            body: >-
              Rokid 的公开商业界面远不止一次性卖出一个小工具。当前官方页面展示的栈包括 Style、Rokid Glasses、AR Spatial 和较低成本的 Station
              伴侣设备；发布材料还加入处方镜片绑定、预订定金、选定零售分销，以及由应用中介的 AI 服务层。这支撑了一个多收入流模型，由硬件、伴侣配件、处方光学，以及围绕导航、翻译和 AI
              辅助的至少部分软件式服务构成。财务问题在于，几乎所有这些界面都只以标价或功能信号出现。发布价与当前价格已经并不完全一致，这说明实际 ASP
              可能会随促销或套装变化。同一组来源还显示，结账之后，应用激活、导航和翻译对商业体验很重要，也就是说部分经济价值在硬件销售之后交付，而不只是在出货时实现。因此，公开证据支持收入机制，但不支持已确认收入结构、合同条款或净单位经济性。
