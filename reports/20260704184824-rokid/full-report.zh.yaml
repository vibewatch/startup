      - number: '2.4'
        title: 增长驱动、采用约束与市场上限
        blocks:
          - type: paragraph
            body: >-
              增长逻辑真实存在。Rokid 和 Android XR 都说明，多模态 AI、翻译、导航和免手持拍摄如何把价值主张从新奇感扩展出去。更轻的镜架和更好的光学让眼镜在社交和身体佩戴上都比早期 XR
              硬件更可用。企业工作流平台描述了拣选、装配、维护和远程支持中的可量化生产率收益；HBR 和 PwC 也支撑了沉浸式界面与培训能改变工作方式这个更宽泛的观点。同时，市场仍受约束。Mordor
              强调，电池续航、人体工学、隐私、波导供应和跨平台碎片化仍是现实刹车。Rokid 自己的移动办公文章也承认，软件生态仍不完整。独立评测更谨慎：PCMag 明确表示，当前波导眼镜还不适合所有人；PCMag 和
              Tom’s Guide 都指出摄像头限制、功能不均，以及处方成本会把实际拥有成本推到远高于基础价格。用于估值时，结论很直接：品类增长驱动足以支撑一个真实市场，但现实近期 SAM 比任何宽口径 AR TAM
              标题都更窄、更分层，也更依赖执行。
