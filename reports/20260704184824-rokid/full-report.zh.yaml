        title: 护城河在产品组合层真实存在，但在平台层脆弱
        blocks:
          - type: paragraph
            body: >-
              支持 Rokid 的最强论点，不是它拥有一个不可战胜的产品，而是它已经覆盖多个相邻产品赛道，而许多对手仍更专门化。这种宽度让 Rokid
              比单一产品同行有更多射门机会。反向解读是，每条赛道都暴露在资本更雄厚或聚焦更深的挑战者面前。Meta 能用品牌和规模压缩无屏 AI 眼镜价值；XREAL 和 RayNeo
              能在价格和配件上挤压私人显示路线；RealWear 和 Vuzix 拥有更明确的工业工作流可信度；Android XR 加 Snapdragon AR1
              则意味着未来进入者更容易拼出可接受的硬件加软件栈。品类历史也反对自满。Google Glass Enterprise Edition 已经停产，HoloLens 2 已进入最终功能发布维护模式。这些例子不能证明
              Rokid 会失败，但确实说明，AR 早期技术领先不会自动转化成持久的自有护城河。因此，Rokid 的护城河是产品宽度和时机，而不是锁定的生态控制。
