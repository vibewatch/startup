  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Rokid 公开栈从可穿戴硬件延伸到手机控制、云端 AI 服务，并另有一条空间计算分支。
    data:
      layers:
        - label: 可穿戴硬件
          detail: 商用硬件系列和配件共同拼出面向用户的形态。
          modules:
            - AI Glasses Style
            - Rokid Glasses
            - AR Spatial / Station 系列
          outputs:
            - 消费级、准专业级和生产力可穿戴界面
        - label: 本地控制与固件
          detail: 设备端传感器、控制和固件行为负责调度每一次会话。
          modules:
            - 按键、触控、佩戴检测、LED
            - 摄像头与光学运行时
          outputs:
            - 会话控制、拍摄行为和设备状态处理
        - label: 手机配套层
          detail: 设置、配置、更新和权限都必须经过这层移动控制平面。
          modules:
            - Hi Rokid
            - 平台前置条件
          outputs:
            - 配对、设置、更新和持续设备管理
        - label: 云端与集成层
          detail: 外部 AI、翻译和地图服务扩展硬件能力。
          modules:
            - AI 引擎
            - 服务集成
          outputs:
            - 翻译、导航和助手响应
        - label: 开发者与空间分支
          detail: 公开文档加上空间计算分支，让 Rokid 不止于一个消费应用。
          modules:
            - GitHub 文档和 SDK
            - YodaOS-Master
          outputs:
            - 开发者适配路径与空间计算工作流
    approximationNotes: 该栈只反映公开页面暴露的信息，不是拆机或代码审计。不同官方入口列出的 AI 引擎不完全一致，因此图中把它们放在可路由的服务层，而不是固定单一模型模块。
