            body: >-
              当前 go-to-market 图景更像直接电商、众筹式需求生成、应用引导上手和选择性渠道扩张的混合，而不是完全透明的企业销售引擎。CNBC 报道称，40% 收入已来自中国大陆以外，Rokid 目标是在 2026
              年最多销售 100 万副；公司材料则指向全球网站发布、选定线上和线下零售渠道，以及数千名开发者或企业伙伴。这些是令人鼓舞的漏斗顶部信号，但不是效率计算。公开材料没有披露
              CAC、回本周期、转化率、退货率或渠道折扣。最好的代理指标是台数、排名、应用采用界面和售后支持摩擦。应用商店证据尤其重要：上手、AI 功能、翻译和导航都依赖伴侣软件，因此商业表现很可能和硬件
