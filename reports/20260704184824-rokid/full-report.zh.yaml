      - number: '7.3'
        title: 合作伙伴、渠道和供应链依赖仍然结构性偏高
        blocks:
          - type: paragraph
            body: >-
              Rokid 的扩张叙事依赖一张合作伙伴网络；这张网之所以有战略价值，恰恰因为公司并不完全控制它。 ChinaBiz 将 Lens Technology
              描述为独家制造稳定器；零售故事则依赖相对少数的展示型伙伴和渠道， 如 Optical 88、Selfridges、商场活动、Amazon 和众筹平台。这个结构能帮助年轻公司快速铺开触达，
              但也集中执行风险。一次制造失误、一个海关瓶颈、一场乏力的零售演示、一次平台评分下滑，或一项合作伙伴政策变化， 都可能比在成熟直销平台上更快冲击需求感知。


              软件侧同样依赖外部。Rokid 宣传支持多种 AI 模型和第三方服务，隐私政策也明确称开发者可以收到用户信息， 并可能通过自有体验直接收集。Glass Almanac 和 AI-Watch
              都描述了一个庞大且仍在增长的开发者社区； 这在战略上有吸引力，但也抬高了内容治理、安全、合规和在线稳定性的范围。投资人应把这个生态视为上行空间和控制负担的双重放大器。 Rokid 越来越多地销售开放 AI
              平台，而不是单功能设备，品牌就越依赖合作伙伴、API、数据实践和服务连续性， 而这些都不在直接硬件制造的控制之内。
