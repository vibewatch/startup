companyProfile:
  summary: >-
    Rokid 是一家总部位于杭州的 AI 与增强现实可穿戴公司，2014 年 7 月由朱明明（Misa Zhu）创立。公司已出货 11 代量产 AI/AR 眼镜，搭起一套全栈平台：基于 AOSP 的 YodaOS-Master
    空间操作系统、Hi Rokid AI 应用、20,000 名开发者社区，以及全球处方镜片服务。现有产品线覆盖无显示屏的 AI Glasses Style（$269–299，38.5g）、带显示的 Rokid
    Glasses（$699，49g，由 GPT/Gemini 驱动），以及企业级 AR Spatial 系统（$488）。2023 年 11 月，Rokid 以 $1B 估值完成 $112M Series C
    融资（Bloomberg），NetDragon 为战略投资方；2026 年初，Lens Technology 与 SenseTime 等参与增资，使累计融资约达 $417M，并将 IPO 前估值推高至约 $2.1B（Wire
    China，2026 年 3 月）。Rokid 披露 2025 年订单约 300,000 台（为最初预测的 3 倍）、活跃用户 250,000 名，且 40% 收入来自中国大陆以外。报道称，截至 2026 年 4 月，Rokid
    正在筹备 HKEX IPO。公司目标是在 2026 年最多销售 100 万副眼镜。
