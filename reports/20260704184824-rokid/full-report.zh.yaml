  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户接触面与实际购买 Rokid 的人
        blocks:
          - type: paragraph
            body: >-
              Rokid 的公开客户故事不是一份整齐的企业名单，而是一叠相互重叠的消费、渠道和轻企业界面。公司材料和发布分销声明一贯称 Rokid 服务消费者、开发者和企业用户；产品线本身也至少把市场切成三类买方任务。AI
              Glasses Style 是更便宜、无屏、语音优先的选项，面向想要翻译、通话、会议纪要和免手持拍摄，但不需要镜片内显示的买方。Rokid Glasses 或 RV101
              增加字幕、导航和提示，更适合演讲者、多语种专业人士、主管，以及其他在任务中需要一眼可读信息的用户。AR Spatial 则保留生产力和远程协作分支，服务想要更大虚拟工作区、而不只是抬头信息层的客户。


              这种宽度很重要，因为它解释了为什么 Rokid 的公开分层不只是「企业 AR
              眼镜」或「消费智能眼镜」。官方用例文章把同一平台家族映射到制造、物流、医疗健康、零售、旅行、教育和旅游。不过，公开披露的销售动作仍偏渠道。Rokid
              自己的联系界面把企业需求导向一个通用企业邮箱，而不是成熟的公开案例库或采购门户；PR、零售商和评测界面则比客户 logo 更能解释今天谁在购买。最可辩护的分层判断因此很务实：Rokid
              今天显然触达消费者和专业消费者工作流用户，欢迎企业试点，并且仍高度依赖零售、众筹和生态叙事，来填补当前具名企业参考稀少留下的空白。
