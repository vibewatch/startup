      - number: '8.3'
        title: 建议、置信度与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持继续关注 Rokid，但不支持在披露前价格拉伸时做领投仓位。品类增长真实，中国需求看起来也真实，
              战略投资人提供了一定运营可信度。这些是把公司留在项目池里的理由，还不是忽略“公告支撑的估值地板”和“媒体支撑的顶端标记”之间缺口的理由。
              委员会最可辩护的姿态是以中等置信度跟踪：保持接触，索要完整经济性和股权结构条款；如果招股书或尽调资料室显示收入质量、
              利润率画像或与经常性服务的附着程度好于预期，再重新评估。核心信息是价格纪律。如果进入条款向可比公司支撑的中部移动， 或新披露能证明相对 Xreal 式硬件经济性应享有溢价，立场可以上调。在此之前，公开记录说明
              Rokid 有战略吸引力， 但仍过于不透明，无法按不计价格的领投来承销。
