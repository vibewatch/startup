      - number: '8.2'
        title: 可比框架与情景分析
        blocks:
          - type: paragraph
            body: >-
              上市可比公司不支持不计价格的看法。Vuzix 显示，公开市场可以给一家微型纯 AR 硬件公司很高的销售倍数， 但前提是流动性基数很小，且伴随深度亏损。Meta Reality Labs
              展示了另一个极端：巨额品类投入仍可能带来难看的近端经济性。 最好的直接可比对象是 Xreal，因为它处在同一大品类、同一上市地点、同一年。Xreal 披露的 2025 年收入、 改善后的毛利率和仍亏损的状态，为
              Rokid 提供了最有用的外部基准。在这个框架下，Rokid $2.1 billion 估值并非不可能， 但很进取。它要求投资人相信，Rokid
              能靠本土领导力、战略制造伙伴和最终的软件或服务变现，拿到高于硬件倍数的估值。 没有审计披露前，基准情形应更接近可比公司支撑的中部，而不是叙事区间顶部。
