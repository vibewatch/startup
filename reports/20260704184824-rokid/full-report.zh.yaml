        - 玩家、消费者、企业试点
        - 应用生态强，沉浸式计算成本更低
        - 头显形态不是社交场景里正常的全天候眼镜
      - - Apple Vision Pro
        - 高端空间计算头显
        - 平台巨头
        - 高端消费者、开发者、有预算的企业
        - 算力、隐私和应用 / OS 集成处于一流水平
        - 极高价格显著收窄大众市场重叠
      - - Microsoft HoloLens 2
        - 上一代企业 AR 头显
        - 进入维护模式的平台既有玩家
        - 工业、工程、培训
        - 企业历史长，支持期限有文件可查
        - 最终功能版本已发布，生产已结束
      - - XREAL
        - 私密显示和配套计算 AR
        - 非上市专业厂商
        - 娱乐、移动办公、显示需求用户
        - 配套计算叠加重视光学的可穿戴屏
        - 平台控制力弱于 Meta 或 Apple
