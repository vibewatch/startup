    rows:
      - - 按 SKU 和地域拆分收入
        - 标价、40% 中国大陆以外收入占比、出货目标和用户数
        - 需要把一次性硬件收入与经常性或更高质量收入拆开
        - 没有组合和集中度，收入质量无法评分
        - 索取至少八个季度按产品线、地域和渠道拆分的季度收入
      - - 实际 ASP 与折扣
        - Style 首发定价不同于当前产品页定价
        - 决定公开标价能否转化为毛利，还是主要只是促销锚点
