      - number: '4.4'
        title: 资本充足性是核心承销障碍，因为融资可见而金库不可见
        blocks:
          - type: paragraph
            body: >-
              从历史看，Rokid 并不像缺钱。Caplight 和 ChinaBiz 都把累计外部资本放在数亿美元级别，TechNode 2026 年 4 月报道也把公司与香港 IPO
              进程相连。对于一家试图同时扩张消费硬件、国际发货和应用加服务层的公司，这是方向上正面的信号。这也意味着当前故事仍部分关乎融资能力，而不只是经营自给。但历史融资不等于当前充足性。没有任何已审阅公开来源披露今天的现金余额、月度
              burn、债务包、契约限制或 runway。因此，公开牵引力走在公开财务前面。最好的财务判断是混合的：收入质量正在改善，因为 Rokid 不只卖一个
              SKU；但利润率路径似乎仍依赖于把结构转向软件、服务、镜片和伙伴经济，而不是纯设备毛利。在管理层打开 P&L 和金库位置前，承销应保持谨慎。
