      - - Rokid Glasses
        - $699 标价
        - 可视显示 AI 眼镜，带翻译、字幕、相机和导航
        - 从无屏 AI 直接升级到显示 AI
        - 导航需要订阅，页面价格标签看起来不一致
      - - Rokid AR Spatial
        - $488 标价
        - 眼镜加支持多显示器和 YodaOS-Master 的计算栈
        - 做私密屏生产力时，比完整头显便宜
        - 仍需要用户接受可穿戴屏工作流
      - - Meta AI / Ray-Ban Meta
        - $224-$299 起价
        - 生活方式 AI 眼镜，带相机、音频和 Meta AI
        - 对 Rokid 消费级 AI 路径形成很大压力
