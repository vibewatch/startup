        - Rokid 把中国需求转成持久规模，利润率优于同业，并跑出有意义的软件 / 服务附加收入
        - 支撑相对 Xreal 类收入倍数的溢价，也能守住公开估值标记的上沿
        - 招股书显示收入质量干净、利润率上行，且企业客户持续复购 / 扩张
        - 执行滑坡或平台依赖仍会压缩上行空间
      - - 基准
        - Rokid 仍是中国优先的强硬件品牌，有战略伙伴，但经常性变现证据有限
        - 估值更接近申报材料支撑的底线，并因增长和伙伴关系享有适度溢价
        - 招股书呈现的更像强硬件经济模型，而非平台经济模型
        - 若品类竞争加剧，溢价会收缩
      - - 熊市
        - 增长真实存在，但收入质量、退货或利润率不及预期，公开市场把 Rokid 当作拥挤硬件故事定价
