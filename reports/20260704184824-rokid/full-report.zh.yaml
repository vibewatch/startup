      - number: '7.2'
        title: 运营质量、支持和产品安全执行是下一层主要风险
        blocks:
          - type: paragraph
            body: >-
              Rokid 的运营风险，是智能眼镜经典陷阱：硬件、履约、支持和功能准确性还没稳定到无聊，需求就先快速放大。 ChinaBiz 已经描述 2025 年订单量压过 Rokid
              供应链；公司自己的配送政策也像一张多司法辖区例外清单： 海关延误、地址失败、包裹丢失、处方处理滞后，以及某些场景下由客户付费重寄。保修和退款政策也显示公司的边界。
              处方订单可能变成最终销售，非官方配件可能使保障失效，恢复出厂设置义务则把数据丢失负担转给用户。 这些控制可以理解，但这个产品能否留存，靠的是佩戴是否合适、光学是否舒服、第二天还愿不愿意用；这些边界也会制造摩擦。


              独立测试和客户反馈让问题更尖锐。VR Expert 称，企业部署仍受处方物流、充电、设备管理和功能准确性缺口制约。 Trustpilot 投诉集中在配送、退款时点、支持响应和镜片问题，Amazon
              则公开产品评分和退货行为。因此， 运营问题不是 Rokid 能不能发货；它已经能发。真正的问题是，当产品进入更多门店、更多国家和比原始众筹人群更日常的使用场景时，
              公司能否把支持质量、品控、翻译准确性和公众信任维持在足够高的水平。
