  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              不能把 Rokid 粗略归入一个巨大且无差别的「XR」市场。它的公开产品组合至少跨越四个相邻层级：无显示屏 AI 智能眼镜、带波导或抬头显示元素的显示型智能眼镜、围绕私人屏幕和多任务构建的消费 AR
              或空间计算套装，以及基于手机应用、YodaOS-Master、Android
              兼容性和第三方体验的伴侣计算或软件层。因此，纳入支出应覆盖眼镜硬件、体验所需的伴侣计算模块，以及与翻译、导航、拍摄、虚拟屏生产力或工作流执行直接相关的软件或服务预算。剔除支出应包括广义移动 AR
              广告、通用智能手机、通用笔记本电脑、Rokid 并不直接触及的医疗 AR
              软件类别，以及完全流向第三方工作流厂商、而非设备或套装绑定的工业软件支出。实际替代品集合很宽：翻译或导航可用手机和耳机，多任务可用笔记本电脑和外接显示器，便携屏幕可用有线可穿戴显示器，前线工作流可用工业辅助现实平台。这样的边界纪律很重要，因为宽口径
              AR 市场数字会夸大 Rokid 近期真实可触达的收入池。
