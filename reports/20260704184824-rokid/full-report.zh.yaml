      - number: '1.5'
        title: 里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              Rokid 的时间线异常有用，因为公司展示出一条很长的硬件弧线：2010 年代中期的语音设备，2020–2023 年的工业和消费 AR 眼镜，2024 年的空间计算套装，以及 2025–2026 年的 AI
              眼镜。同一段历史也说明了 2026 年为何关键。独立报道把 IPO 推进与一个狭窄战略窗口联系起来：Rokid 必须在 Meta、Alibaba、Xiaomi、Huawei，以及最终 Apple
              把这个品类变得更难之前完成规模化。ChinaBiz 报道称，2025 年订单激增至约 300,000 台，造成交付延迟并暴露供应脆弱性；PCMag、ZDNET 和 Tom’s Guide
              的评测则显示，产品前景不错，但离主流无摩擦采用还差一步。翻译、字幕和轻量设计是明确优势；充电细节、摄像头限制、部分功能可用性，以及缺少公开收入披露，同样是真问题。换句话说，Rokid
              比概念阶段的可穿戴创业公司成熟，但还早于一个被充分验证的平台型业务。因此，近期时间线不只是产品发布，也包括渠道建设：2024 年 1 月企业扩张融资、2025 年创纪录的 Kickstarter 收官、亚洲 /
              欧洲零售进入，以及 2026 年 3 月美国货架推进，都发生在任何招股书公开之前。
