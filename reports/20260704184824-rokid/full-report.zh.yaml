      - number: '1.3'
        title: 资本结构、所有权与阶段
        blocks:
          - type: paragraph
            body: >-
              Rokid 的资本故事已经大到必须重视，但在没有申报文件支撑前，还不能当作完全落定。记录最充分的一步是 2023 年 11 月的 Series C；多家独立报道称 NetDragon 支持了一轮 $112
              million 融资，并帮助 Rokid 跻身独角兽。到 2026 年，公司显然已进入 IPO 准备阶段：Caplight 将最新一轮标注为「IPO Announced」，TechNode
              报道称香港申报工作最早可能在 4 月底启动，ChinaBiz Insider 则描述了 2026 年初的增资，引入包括 Lens Technology 和 SenseTime 在内的 39
              名新股东。这轮股权更新既像财务动作，也像战略动作——在竞争加剧之际，把 Rokid 与制造和 AI 伙伴连得更紧。累计资本的精确数额没那么整齐。Caplight 显示已融资 $348.23
              million，ChinaBiz 则称成立以来注入资金超过 RMB 3 billion。因此，一旦招股书或经审计的股本表材料可得，投资者应准备核对一级融资、战略配售和其他资本流。Forbes 还提到 2024 年
              1 月一轮近 $70 million、由合肥支持的企业扩张融资，补上了 2023 年独角兽融资与 2026 年 IPO 叙事之间的重要桥段：Rokid
              当时仍在募集增长资本推进产业扩张，而不是单纯等待上市窗口重开。
