  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 证据基线与估值锚
        blocks:
          - type: paragraph
            body: >-
              Rokid 的估值案从一组异常不均衡的证据开始。最强的一手锚点不是融资新闻稿，而是 2026 年 3 月 Conant Optical 公告： 其确认向 Lingban Technology 投资 RMB180
              million，持股不超过 5%。这给投资人提供了一个已披露股权结构切片的真实地板， 但无法回答整轮融资的完整问题。区间另一端，The Wire China 的报道和配套简报把 Rokid 在 2026 年 3
              月的估值放在 $2.1 billion。 两个端点之间，二级数据服务和私人市场跟踪器仍给出噪音很大的估值分布。因此，本章不能负责任地把 Rokid 呈现为一个干净的点估计； 必须把估值视为一条移动区间，取决于
              2026 年融资中有多少是战略资金、有多少是价格发现， 以及有多少依赖尚未在公开版申请文件或招股书中出现的披露。
