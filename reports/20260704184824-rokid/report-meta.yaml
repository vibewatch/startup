  topStrengths:
    - 11 generations of mass-produced AI/AR glasses demonstrates sustained hardware execution discipline rare among AR hardware startups globally.
    - 40% international revenue (CNBC) and distribution in UK, Canada, Japan, and Taiwan validates genuine product-market fit outside China before IPO.
    - 300,000 units ordered in 2025 (3× forecast) and 1M unit target for 2026 signals strong demand acceleration with potential for operating leverage.
    - Full-stack ownership of YodaOS-Master, developer tools, and optical services reduces dependence on third-party platforms and creates switching costs.
    - Strategic investors Lens Technology (optical manufacturing) and SenseTime (AI/vision) in the 2026 round provide hardware supply chain and AI model ecosystem synergies.
  topRisks:
    - Meta Ray-Ban (with Meta AI), Snap Spectacles, and well-funded domestic peers (XREAL, Thunderbird Innovation) compete directly in the AI/AR glasses segment with greater resources.
    - Revenue, gross margin, and unit economics remain entirely undisclosed, making it impossible to assess whether hardware margins support the $2.1B valuation.
    - >-
      US-China geopolitical risk: Rokid already cannot ship to the US market; further trade restrictions could limit the
      international growth trajectory that justifies the premium.
    - High device return rates (30–50% cited for the sector by ChinaBiz) and mixed user reviews (2.8/5 on Google Play) indicate product maturity gaps that could pressure near-term growth.
    - AI glasses as a consumer category is still nascent; a slowdown in the consumer electronics upgrade cycle or a weaker-than-expected "killer app" could delay the mass-market transition.
  unresolvedGaps:
    - Audited or management-disclosed revenue, ASP, gross margin, and unit economics across hardware, software, and services.
    - HKEX IPO prospectus with formal financial statements, customer concentration, and capital structure details.
    - Confirmation that the $2.1B valuation figure is post-money and based on the 2026 capital increase (rather than a pre-money estimate).
    - Return rates, warranty claims, and after-sale service cost data that would allow assessment of gross margin after post-sales costs.
    - Detailed breakdown of the 40% international revenue across geographies, channels, and product lines.
