companyProfile:
  summary: >-
    Rokid is a Hangzhou-based AI and augmented reality wearable company founded in July 2014
    by Zhu Mingming (Misa Zhu). The company has shipped 11 generations of mass-produced AI/AR
    glasses, building a full-stack platform that includes the YodaOS-Master spatial operating
    system (AOSP-based), the Hi Rokid AI app, a 20,000-developer community, and a global
    prescription optics service. Its current product lineup spans the display-free AI Glasses
    Style ($269–299, 38.5g), display-equipped Rokid Glasses ($699, 49g, GPT/Gemini-powered),
    and the enterprise-grade AR Spatial system ($488). In November 2023 Rokid raised a $112M
    Series C at a $1B valuation (Bloomberg) with NetDragon as strategic investor; early-2026
    capital increases with Lens Technology and SenseTime raised total funding to roughly $417M
    and lifted the pre-IPO valuation to approximately $2.1B (Wire China, March 2026). Rokid
    reported ~300,000 units ordered in 2025 (3× its initial forecast), 250,000 active users,
    and 40% of revenue from outside mainland China. A HKEX IPO was reported in preparation
    as of April 2026. The company aims to sell up to 1 million pairs in 2026.
  foundedDate: '2014-07-01'
  founders:
    - name: Zhu Mingming (Misa Zhu)
      role: Founder and CEO
      background: Public company-builder and AI/AR entrepreneur who has led Rokid through 11 hardware generations; Forbes and Wire China cite Misa as the primary spokesperson for the company's technology and business vision.
      claimRefs: [CO008, CO011]
  foundingLocation: Hangzhou, China
  headquarters: Hangzhou, China
  productSummary: >-
    AI Glasses Style: display-free AI companion glasses at $269–299, 38.5g, camera, open-ear
    audio, AI assistant. Rokid Glasses: display-equipped smart glasses at $699, 49g, 150-nit
    waveguide display, GPT/Gemini integration, navigation subscription. AR Spatial: enterprise
    AR bundle (Max 2 headset + Station 2) at $488. YodaOS-Master: AOSP-based spatial OS with
    3DoF perception and Android app compatibility. Over 300 patents and 20,000+ registered
    developers on its platform.
  customerFocus: >-
    Consumers (global via direct DTC and retail channels); enterprise customers in manufacturing,
    logistics, healthcare, and utilities (inspection, AR workflows); developers building spatial
    apps; museum and cultural-heritage venues; prescription eyewear customers via optical partners.
  businessModel: >-
    Hardware sales (glasses, companion devices), software ecosystem (YodaOS apps, developer
    tools), subscription services (navigation, AI features), prescription lens services, and
    enterprise licensing.
  stage: Pre-IPO (late venture, Series C+ with HKEX listing in preparation)
  fundingStatus: >-
