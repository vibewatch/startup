summary:
  headline: >-
    Rokid is China's most proven independent AI/AR glasses maker, with 300,000+ units ordered
    in 2025 and genuine international traction — but the US$2.1B pre-IPO mark demands
    post-listing revenue and margin proof that has not yet been publicly disclosed.
