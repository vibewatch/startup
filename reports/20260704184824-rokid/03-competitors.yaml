  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-trust
    missingEvidence: Named Rokid enterprise deployments, procurement references, security/compliance materials, or renewal evidence that match the specificity of RealWear or Vuzix public materials.
    whyItMatters: Without specific industrial proof, Rokid's enterprise credibility remains more aspirational than procurement-ready in this chapter.
    diligencePath: Request named customer case studies, regulated-environment documentation, and deployment-size references directly from Rokid or channel partners.
    relatedQuestionRefs:
    - QP019
    - QP028
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Enterprise quote sheets, bundle discount schedules, accessory attach assumptions, and channel-specific realized pricing for HoloLens, RealWear, Vuzix, Epson, and Rokid.
    whyItMatters: List-price comparisons understate true buyer TCO when enterprise vendors quote, discount, or bundle outside public web carts.
    diligencePath: Collect direct channel quotes and sample purchase configurations for every shortlisted vendor before underwriting pricing or margin conclusions.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: minor
    topic: switching-costs
    missingEvidence: Retention, churn, accessory attach, and multi-device usage data showing how often buyers actually switch or multi-home across Rokid, XREAL, RayNeo, and Meta devices.
    whyItMatters: Observed compatibility suggests low-to-medium consumer lock-in, but only usage data can confirm whether that translates into weak moat or healthy cross-sell.
    diligencePath: Ask for cohort, return-rate, and accessory-attach data by product line and region.
    relatedQuestionRefs:
    - QP020
    - QP021
    relatedTableRefs:
    - TP002
