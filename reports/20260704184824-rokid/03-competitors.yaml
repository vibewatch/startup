- id: switching-distribution-trust
  title: Switching Cost, Lock-In, Distribution Power, and Enterprise Trust Split the Field
  body: Consumer display-glasses competition is relatively fluid. Rokid, XREAL, and RayNeo all rely on phones, PCs, consoles, or companion devices, so a buyer can often multi-home without moving a deep software estate. Prescription inserts, accessories, and familiar apps still create friction, but lock-in is modest compared with a managed enterprise deployment. Distribution power is more uneven. Meta has the strongest consumer channel leverage because it layers AI glasses across Ray-Ban, Oakley, and now lower-price Meta-branded devices; Apple has unmatched ecosystem trust and privacy signaling; and Google plus Qualcomm are moving toward platform and silicon standardization that could make future entrants faster to assemble. In enterprise assisted reality, trust comes less from headline demos and more from rugged hardware, hazardous-environment certifications, app marketplaces, security servicing, and migration support. That is where RealWear, Vuzix, and even Microsoft's still-supported-but-frozen
    HoloLens stack look more procurement-ready than Rokid's current public materials. The practical result is that Rokid's switching-cost moat is stronger in hardware familiarity than in ecosystem control.
