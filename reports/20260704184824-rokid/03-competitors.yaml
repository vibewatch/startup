- id: moat-durability-adverse
  title: Moat Durability Looks Real at the Product-Portfolio Layer but Fragile at the Platform Layer
  body: The strongest argument for Rokid is not that it owns one unbeatable product, but that it already operates across multiple adjacent product lanes while many rivals remain more specialized. That breadth gives Rokid more shots on goal than a single-product peer. The adverse read is that each lane is exposed to a better-capitalized or better-focused challenger. Meta can compress screenless AI-glasses value with brand and scale; XREAL and RayNeo can squeeze the private-display lane on price and accessories; RealWear and Vuzix own more explicit industrial workflow credibility; and Android XR plus Snapdragon AR1 suggest future entrants will have an easier time assembling acceptable hardware-plus-software stacks. Category history also cuts against complacency. Google Glass Enterprise Edition is already discontinued, and HoloLens 2 has crossed into final-feature-release maintenance mode. Those examples do not prove Rokid will fail, but they do show that even early technical leads in AR do
    not automatically convert into durable proprietary moats. Rokid's moat is therefore product breadth and timing, not locked-in ecosystem control.
