- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim or control point
  - Threat
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Breadth across three Rokid product lanes
    - Each lane is attacked by a stronger specialist or platform owner
    - High
    - Breadth helps discovery but does not stop Meta, XREAL, RayNeo, or RealWear from winning their core niches
    - Collect product-level attach, margin, and repeat-purchase data by lane
  - - Consumer AI-glasses differentiation
    - Meta can compress the lane on brand, retail, and partnership scale
    - High
    - Meta now spans Ray-Ban, Oakley, and lower-price Meta-branded tiers
    - Measure conversion and retention versus Meta-style consumer alternatives
  - - Private-display productivity positioning
    - XREAL and RayNeo can compete on companion devices, optics, and price
    - High
    - These vendors are closest to Rokid's AR Spatial and display-glasses jobs
    - Benchmark comfort, latency, and attach economics in side-by-side tests
  - - Enterprise optionality
    - RealWear and Vuzix publish clearer frontline workflow proof and certifications
    - High
    - Procurement trust often depends on ruggedization, app ecosystems, and servicing commitments
    - Obtain named Rokid enterprise deployments, safety docs, and renewal proof
  - - Proprietary ecosystem control
    - Android XR and Snapdragon AR1 lower stack-assembly barriers for new entrants
    - High
    - Platforms and silicon suppliers can commoditize the underlying smart-glasses stack
    - Test whether Rokid owns any non-portable developer, data, or distribution advantage
  - - Lifecycle credibility
    - Google Glass and HoloLens history show vendor support can end before category maturity
    - Medium
    - Buyers may discount proprietary AR hardware roadmaps after seeing prior sunsets
    - Map spare-parts, update, and migration commitments for every shortlisted vendor
  - - Price-based value proposition
    - List prices alone may overstate or understate realized competitiveness
    - Medium
    - Some cart pages show inconsistent labels while enterprise vendors hide pricing entirely
    - Request channel quotes, accessory bundles, and discount schedules before underwriting unit economics
  notes: Risk rows translate the competitive evidence into moat-durability questions rather than pretending public product pages prove realized lock-in or margin resilience.
