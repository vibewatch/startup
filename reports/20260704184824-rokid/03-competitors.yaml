- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Product / line
  - Public price or posture
  - What is included
  - Buyer implication
  - Caveat
  rows:
  - - Rokid AI Glasses Style
    - $269 list
    - Screenless AI glasses with translation, navigation, notes, camera, optional lens ecosystem
    - Low-entry route into Rokid's AI-glasses lane
    - Does not include a display
  - - Rokid Glasses
    - $699 list
    - Visible-display AI glasses with translation, captioning, camera, navigation
    - Direct step-up from screenless AI into display AI
    - Navigation requires subscription and page pricing labels look inconsistent
  - - Rokid AR Spatial
    - $488 list
    - Glasses plus compute stack for multiple monitors and YodaOS-Master
    - Cheaper than full headsets for private-screen productivity
    - Still requires acceptance of wearable-screen workflow
  - - Meta AI / Ray-Ban Meta
    - $224-$299 starting points
    - Lifestyle AI glasses with camera, audio, and Meta AI
    - Puts heavy pressure on Rokid's consumer AI lane
    - Display features are still limited relative to headsets
  - - Meta Glasses / Ray-Ban Display
    - $299 unbranded and $799 display tier per CNBC
    - Broader Meta tiering across consumer smart glasses
    - Shows rapid price ladder expansion by a scaled incumbent
    - Independent news corroboration rather than one static official store page
  - - Meta Quest 3
    - $599.99 for 512GB
    - Immersive VR/MR headset and app ecosystem
    - Stronger immersive compute substitute than eyewear substitute
    - Headset bulk changes the purchase decision
  - - Apple Vision Pro
    - $3,699 base as of late June 2026
    - Premium spatial-computing headset with Apple stack
    - Sets upper technical bar but targets a very different budget
    - Current price comes from independent reporting, not the marketing page alone
  - - XREAL Beam Pro
    - $199 starting point
    - Companion compute device for XREAL glasses plus Google Play apps
    - Low-cost way to strengthen a display-glasses workflow
    - Not a stand-alone full glasses kit
  - - XREAL One Pro + Beam Pro bundle
    - $798 bundle
    - Display glasses plus companion compute
    - Directly overlaps Rokid's private-screen productivity budget band
    - Bundle page also shows internally inconsistent sale labeling
  - - RayNeo Air 2s / X2
    - $143 discounted Air 2s; $499 X2
    - Low-cost display glasses or higher-end AI/AR glasses
    - Lets buyers choose between private display and richer AI/AR
    - Promotional pricing may not reflect realized channel ASP
  - - RealWear / Vuzix / HoloLens / Epson
    - Quote-led or opaque in reviewed pages
    - Enterprise devices, integrations, or legacy stacks
    - Enterprise buyers must model TCO via sales process, not cart price
    - Public list pricing is not consistently available
  notes: Public prices are captured as displayed on accessed pages or corroborating late-June 2026 coverage; enterprise quote-led vendors remain pricing-opaque in the reviewed source set.
