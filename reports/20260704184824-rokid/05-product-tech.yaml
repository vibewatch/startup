- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Wearable hardware (Style / Glasses)
    - Captures audio, video, touch, and in-view output while keeping the form factor close to normal eyewear
    - Optics, cameras, microphones, batteries, charging accessories, fit parts
    - Comfort, battery, and camera tradeoffs are visible in independent reviews
  - - On-device firmware and UI
    - Controls wake word, buttons, touch, wear detection, indicators, and basic display behavior
    - Stable firmware plus well-designed gesture and state handling
    - Many customer issues will surface here before the user can tell whether cloud or app is at fault
  - - Hi Rokid phone companion
    - Owns pairing, settings, model selection, media sync, firmware updates, and some troubleshooting
    - iOS or Android support, permissions, background behavior, and app release quality
    - Store reviews show it is the most obvious reliability bottleneck in the stack
  - - Cloud AI and translation services
    - Provide assistant responses, model routing, translation, and some higher-order features
    - Network quality plus third-party services such as Microsoft translation and named LLMs
    - Feature availability can vary by region, version, or connectivity
  - - YodaOS-Master / spatial branch
    - Supports spatial rendering, browser, keyboard/mouse input, and multi-screen experiences
    - Station 2 and AR Spatial class hardware plus a separate software surface
    - Public docs describe ambition better than operational metrics
  - - Developer docs and SDKs
    - Enable third-party or adapted app behavior on Rokid hardware
    - Fresh docs, usable samples, and ongoing maintenance
    - Public GitHub signal is real but patchy, especially on glass-specific assets
  notes: >-
    The stack is reconstructed from official docs, app-store release notes, and developer materials. It is architectural, not a source-code audit or security review.
