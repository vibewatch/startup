  evidenceGaps:
  - type: missing-source
    severity: material
    topic: developer-adoption-metrics
    missingEvidence: Public counts for active developers, SDK downloads, production apps, or API usage tied to Rokid’s current glasses stack.
    whyItMatters: A visible GitHub footprint is not the same as an ecosystem moat; without adoption metrics, the platform claim is still mostly qualitative.
    diligencePath: Request current monthly active developer counts, SDK download history, production app logos, and a 12-month repo contribution summary from product leadership.
    relatedQuestionRefs:
    - QE019
  - type: conflicting-data
    severity: material
    topic: privacy-scope-reconciliation
    missingEvidence: A product-specific privacy matrix that reconciles what the mobile apps collect locally, what the glasses transmit, and what the broader service policy covers.
    whyItMatters: The current buyer-facing disclosures are hard to compare, which increases diligence time and raises avoidable trust questions.
    diligencePath: Ask Rokid for a single glasses-specific privacy and data-flow diagram aligned to Google Play, App Store, and website disclosures.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: security-and-compliance-attestations
    missingEvidence: Public security audit reports, formal compliance attestations, camera-governance documentation, or uptime/SLA disclosures for Rokid’s glasses services.
    whyItMatters: Enterprise or privacy-sensitive buyers will expect more than generic terms and app-store cards before trusting always-on sensors and cloud AI flows.
    diligencePath: Request SOC or equivalent controls summary, published incident/uptime process, camera-indicator policy, and regional compliance certifications for the glasses and app stack.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
