- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Rokid solution surface
  - Measurable public benefit signal
  - Limitation
  rows:
  - - Live translation / captions
    - Phone-mediated translation is distracting and not glanceable
    - Rokid Glasses overlays translated speech in-view; Hi Rokid manages languages and settings
    - Official docs cover online/offline translation paths; PCMag found the feature useful in the right conditions
    - Performance depends on microphone pickup, app configuration, and sometimes cloud connectivity or flagship phones
  - - Teleprompted speaking
    - Presenters usually need a phone, paper, or large external prompter
    - Rokid Glasses scroll scripts inside the display and can smart-scroll with speech recognition
    - CNBC cites teleprompting as a popular purchase reason; academy docs provide setup flow
    - Still a niche workflow and not proof of broad daily engagement
  - - Navigation while moving
    - Phones demand hand attention and look-down behavior
    - Style and Glasses market hands-free voice and navigation prompts
    - Official launch materials and CNBC both emphasize navigation utility
    - Reviewer evidence says full real-time visual map navigation remains limited
  - - Capture, notes, and conversation memory
    - Users switch between phone camera, recorder, and note app
    - Style/G1 surfaces 12MP capture, QuickNote, and app-managed media import
    - Official pages and store listings show photo/video import plus meeting-note or note-capture workflows
    - Low-light camera quality and privacy expectations can cap usefulness
  - - Private-display mobile work or media
    - Laptop or phone screens are cramped and public
    - AR Spatial with Station 2 offers three-screen private-display and keyboard/mouse workflows
    - Product pages make the configuration explicit and users praise comfort and sharpness
    - App compatibility and DRM behavior still create visible friction
  notes: >-
    This workflow table mixes official claims with reviewer and customer proof. It shows where the product solves concrete jobs and where the evidence still stops short of broad adoption proof.
