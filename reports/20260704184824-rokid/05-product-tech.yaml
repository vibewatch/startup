- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / disclosure
  - Status
  - Scope
  - Gap
  rows:
  - - Google Play data-safety card
    - Present
    - Android app listing says no data shared or collected, encrypted in transit, deletion supported
    - Narrow mobile disclosure does not explain the full hardware-service stack
  - - App Store privacy card
    - Present
    - iOS listing names linked and non-linked categories including location and surroundings information
    - Scope is app-centric and still requires interpretation against the website policy
  - - Website privacy policy
    - Present
    - Covers account, device, usage, location, crash logs, sharing with developers and service providers, marketing pixels, and deletion rights
    - The breadth is high, which can surprise buyers coming from the narrower app-store cards
  - - Terms of service and security posture
    - Present
    - As-is service, maintenance interruptions, no uninterrupted/error-free/secure warranty, reverse-engineering prohibition
    - No public uptime, SLA, or security-audit disclosure was found in the reviewed set
  - - Camera / privacy signaling
    - Partial
    - ZDNET notes a front privacy LED and official docs show capture workflows
    - No reviewed source provided a formal privacy-by-design or camera-governance white paper
  - - Developer diagnostics
    - Present but limited
    - Android release notes mention AIUI Agent debugging and toolbox controls
    - No public bug tracker, uptime dashboard, or enterprise support matrix was found
  notes: >-
    This is a disclosure and control table, not a certification register. “Present” means the reviewed public source set exposes a control or statement; it does not mean the underlying process has been independently audited.
