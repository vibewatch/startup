- id: deployment-reliability-and-roadmap
  title: Deployment quality depends on the app, the network, and still-maturing software
  body: >-
    Public evidence suggests Rokid is beyond concept stage but not beyond implementation friction. The company is shipping release notes, app changes, and multiple product generations, which supports a genuine roadmap rather than a static CES prototype. At the same time, daily usability still rides heavily on the Hi Rokid app and on the quality of cloud-backed services. Google Play reviews call out frozen Bluetooth scanning for add-on devices and navigation failures. Reviewers are more positive about the core experience, but they still describe a category with low-light camera weakness, imperfect audio, proprietary charging choices, iOS background-permission headaches, and translation behavior that can depend on clear audio, good internet, or powerful phones. Even the AR Spatial product-page reviews show that comfort and screen quality do not eliminate software annoyances such as DRM-related window behavior. That mix points to a product family that is commercially live and improving, but
    still vulnerable to support and retention friction if the control plane lags the hardware promise.
