chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Rokid’s product stack is real and unusually broad for a smart-glasses startup: lightweight non-display AI frames, HUD display glasses, private-display spatial products, companion compute, and a mandatory control-plane app. The technical upside is clear workflow utility and genuine platform ambition; the main product-tech risks are still app dependence, uneven public developer freshness, and trust disclosures that are broader and messier than the best buyer experience would require.
sections:
- id: product-lineup-and-user-jobs
  title: Rokid sells a workflow stack, not just a pair of glasses
  body: >-
    Rokid’s product surface makes the company easier to understand in workflow terms than in pure gadget terms. The non-display Style frames are pitched as lightweight AI eyewear for quick voice help, calls, translation, notes, and image capture. Rokid Glasses move up the stack by adding a binocular green waveguide HUD that is explicitly tuned for readable captions, teleprompter text, navigation prompts, and short AI overlays rather than immersive entertainment. AR Spatial and Station/Station 2 then branch into a different job: private-display productivity and portable viewing with companion compute and spatial-browser behavior. Prescription accessories and lens-service partnerships matter because Rokid’s glasses are not a demo device; the company is trying to make them a daily wearable that survives real vision correction, fit, and battery constraints. The unifying pattern is hands-free utility delivered through several form factors that share similar app, AI, and accessory dependencies.
