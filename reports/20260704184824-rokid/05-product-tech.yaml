figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: >-
    Rokid’s public stack runs from wearable hardware to phone control, cloud AI services, and a separate spatial-computing branch.
  data:
    layers:
    - label: Wearable hardware
      detail: Commercial hardware families and accessories that create the user-facing form factors.
      modules:
      - AI Glasses Style
      - Rokid Glasses
      - AR Spatial / Station family
      outputs:
      - Consumer, prosumer, and productivity wearable surfaces
    - label: Local control and firmware
      detail: On-device sensors, controls, and firmware behavior that mediate each session.
      modules:
      - Buttons, touch, wear detection, LEDs
      - Camera and optics runtime
      outputs:
      - Session control, capture behavior, and device-state handling
    - label: Phone companion layer
      detail: The mandatory mobile control plane for setup, settings, updates, and permissions.
      modules:
      - Hi Rokid
      - Platform prerequisites
      outputs:
      - Pairing, settings, updates, and ongoing device management
    - label: Cloud and integration layer
      detail: External AI, translation, and mapping services that expand what the hardware can do.
      modules:
      - AI engines
      - Service integrations
      outputs:
      - Translation, navigation, and assistant responses
    - label: Developer and spatial branch
      detail: Public docs plus the spatial-computing branch that broaden Rokid beyond one consumer app.
      modules:
      - GitHub docs and SDKs
      - YodaOS-Master
      outputs:
      - Developer adaptation paths and spatial-computing workflows
  approximationNotes: >-
    This stack reflects only what public pages expose; it is not a teardown or code audit. The named AI engines differ by official surface, which is why they appear as a routed service layer instead of a fixed single-model block.
