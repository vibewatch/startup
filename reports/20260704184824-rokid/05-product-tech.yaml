tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user / buyer
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - AI Glasses Style
    - Consumer or prosumer buyer seeking hands-free AI without a display
    - Commercially launched in 2026 with global pricing, app integration, and official lens-service support
    - Very light non-display frame, multi-model AI positioning, 4K capture, 10-minute recording claim
    - Need realized retention, return-rate, and actual usage split across AI, camera, and translation features
  - - Rokid Glasses
    - User who wants glanceable captions, teleprompter, navigation, and visual AI in a true eyewear form factor
    - Commercially sold with academy docs, app flow, and multiple independent reviews
    - Text-first waveguide HUD, camera framing aid, multilingual workflows, and prescription insert support
    - Need clearer global service availability, enterprise support posture, and camera/privacy policy detail
  - - AR Spatial
    - Mobile office, media, and private-display user
    - Active product surface with current pricing and customer reviews
    - 3-DOF three-screen AR, YodaOS-Master positioning, keyboard/mouse support, myopia adjustment
    - Need validated real-world productivity outcomes and fewer software/DRM constraints
  - - Station / Station 2
    - Existing Rokid display-glasses owner who needs companion compute
    - Commercial accessory line with separate consumer positioning
    - Portable compute, spatial browser, battery-backed big-screen and multi-screen workflows
    - Need attach-rate, app-compatibility detail, and clearer long-term software cadence
  - - Hi Rokid app
    - Every Rokid Glasses owner
    - Live control plane with June 2026 release activity on Android and active iOS listing
    - Centralizes pairing, settings, media, AI assistant, translation, and firmware behavior
    - Ratings and reviews show this layer is still a key point of failure
  - - Prescription accessories / lens service
    - Vision-corrected user who cannot use stock optics comfortably
    - Available through official service and separate accessories
    - Turns eyewear fit into part of the commercial model instead of an afterthought
    - Need clearer all-in landed cost and service-level disclosure by country
  notes: >-
    Public sources make the module map visible, but maturity is inferred from live product pages, launch materials, app listings, and reviewer usage rather than internal shipment or attach-rate disclosure.
