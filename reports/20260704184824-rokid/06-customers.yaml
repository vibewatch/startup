    {
      "id": "adoption-signals-and-public-proof",
      "title": "Adoption signals and the strongest public proof",
      "body": "The public adoption evidence is real, but it comes in mixed units that should not be mistaken for a clean customer cohort model. CNBC reports Rokid held the top spot on JD.com’s AI-frame sales rankings for the prior three months as of April 2026, while TechNode says cumulative AI-glasses sales had surpassed 300,000 units by late 2025. eHangzhou and AIBase separately describe 250,000 global pre-orders for Rokid Glasses around the start of mass production, and Markets Insider says the product family raised more than $6 million through global crowdfunding in 2025. Those signals, taken together, support a credible conclusion that Rokid is beyond mere prototype or demo scale in consumer-facing channels. They do not, however, tell us how many devices stayed active after shipment, how many were sold through retail versus crowdfunding, or how much of the installed base belongs to enterprise versus individual buyers.\n\nInternationally, the public proof set also improved in 2026. CNBC says Rokid already derived 40% of revenue from outside mainland China and was shipping display glasses to countries including the U.K. and Canada. Markets Insider, TechTimes, Glass Almanac, and PR Newswire’s France release all point in the same direction: Rokid is deliberately moving from e-commerce and crowdfunding into optical retail and local distribution. Krys, Fnac, Darty, Cdiscount, and Boulanger matter less as enterprise logos than as evidence that Rokid is trying to build recurring discovery surfaces where eyewear buyers already shop. The chapter’s key caution is that these are strong channel and demand proofs, not a substitute for retention data, top-customer concentration, or a disclosed list of large current enterprise fleets.",
