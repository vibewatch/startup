    {
      "id": "durability-complaints-and-diligence-blockers",
      "title": "Durability, complaints, and diligence blockers",
      "body": "Rokid’s public record is much better at proving interest than at proving durability. The clearest public post-sale signals are the Hi Rokid app listings. Those show active maintenance through June 2026 and confirm that real customers are pairing devices, using translation, and managing media through the companion app. But they also surface meaningful friction. The Android listing sat at 2.8 out of 5 from 172 reviews, with recent complaints around navigation and Bluetooth device scanning, while the iOS listing sat at 3.4 out of 5 from 27 ratings. A separate Android review praised the product for travel in Europe but warned that many AI features depend on stable internet connectivity. Those are exactly the kinds of details that matter for repeat use: navigation failure, cloud dependency, and app quality can determine whether a product becomes an everyday tool or an occasionally used novelty.\n\nThe larger diligence blocker is missing structure, not missing enthusiasm. Public sources do not disclose NRR, churn, contract length, reorder cadence, return rates, or top-customer concentration. They also do not reconcile ecosystem-scale claims that range from 20,000 developers and 5,000 enterprise partners to 25,000 developers and enterprises to 30,000 developers and 100,000 active users. That leaves the underwriting verdict narrow but defensible. Rokid clearly has real channel momentum, visible consumer demand, active product support, and credible enterprise use cases. What public evidence still cannot prove is how sticky those customers are, how diversified the revenue base is, and how much of the current business is powered by repeat enterprise deployments versus one-time launches, retail sell-through, or promotional spikes.",
