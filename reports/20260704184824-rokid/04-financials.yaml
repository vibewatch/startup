callouts:
  - calloutType: insight
    title: Visible monetization is broader than visible finance
    body: >-
      Rokid clearly sells more than one product and likely monetizes more than one workflow, but the public evidence set
      still stops at price points, traction anecdotes, and financing headlines rather than audited operating denominators.
    claimRefs:
      - CI012
      - CI022
      - CI041
  - calloutType: risk
    title: Capital adequacy is the chapter's main blocker
    body: >-
      The company looks well-funded historically, yet no reviewed public source discloses the current cash balance,
      monthly burn, runway, or debt package. That means dilution and liquidity risk cannot be judged from public data.
    claimRefs:
      - CI036
      - CI037
      - CI039
      - CI040
  - calloutType: recommendation
    title: Demand a cohort P&L before treating list-price growth as quality revenue
    body: >-
      The next diligence step should be a SKU-and-channel cohort bridge from list price to net revenue, including returns,
      duties, cloud costs, support, and any subscription or lens attach economics.
    claimRefs:
      - CI019
      - CI034
      - CI041
      - CI044
