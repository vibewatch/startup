      - - App satisfaction
        - 2.8 out of 5 on Google Play and 3.4 out of 5 on the App Store
        - medium
        - Onboarding and feature quality can directly affect attach, returns, and support costs
        - Request activation funnel, crash rate, and support-ticket volume by release
      - - Companion app technical burden
        - Google Play review says AI works best with stable internet and navigation can fail in-app
        - medium
        - Suggests ongoing cloud-service and reliability costs beyond the device BOM
        - Request cloud inference cost per active device and uptime / error-rate metrics
      - - Low-scale smart-glasses gross-margin proxy
        - Vuzix generated $5.75M of 2025 revenue yet still reported a gross loss of $1.06M
        - medium
        - Shows that subscale wearable-hardware businesses can remain margin-negative for years
        - Benchmark Rokid's gross margin by SKU against disclosed peers or investor materials
      - - CAC / payback / NRR disclosure
        - Not disclosed publicly
        - low
        - Prevents clean underwriting of sales efficiency or recurring-revenue quality
        - Request CAC, payback, channel mix, NRR, and gross retention by customer cohort
    notes: >-
      The strongest public unit-economics signals are proxies rather than completed formulas. Missing CAC, payback,
