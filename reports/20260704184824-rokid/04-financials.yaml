  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: Total funding reconciliation
      missingEvidence: Public sources disagree on cumulative capital raised, with Caplight at $348.23M and ChinaBiz at more than $417M.
      whyItMatters: Even the headline financing base is not fully reconciled, which reduces confidence in downstream capital-adequacy analysis.
      diligencePath: Request a round-by-round capitalization table, primary versus secondary split, and a reconciled lifetime funding schedule.
      relatedQuestionRefs:
        - QI019
    - type: private-evidence-only
      severity: blocking
      topic: Revenue mix and realized ASP
      missingEvidence: The reviewed source set shows list pricing and demand proxies but not revenue by SKU, channel, geography, or realized net ASP.
      whyItMatters: Revenue quality cannot be scored without separating one-time device sales from recurring, bundled, or discounted revenue.
      diligencePath: Request monthly revenue by product, channel, and geography plus an ASP bridge from list price to net revenue after promotions and returns.
      relatedQuestionRefs:
        - QI021
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: blocking
      topic: Cash, burn, runway, and debt
      missingEvidence: No reviewed public source discloses current unrestricted cash, operating burn, runway, debt, or inventory financing obligations.
      whyItMatters: Capital adequacy and dilution risk cannot be underwritten from historical fundraising headlines alone.
      diligencePath: Request the latest balance sheet, trailing twelve month cash-flow statement, debt schedule, covenant package, and base or downside runway cases.
      relatedQuestionRefs:
        - QI020
        - QI025
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: CAC, payback, and channel economics
      missingEvidence: Public evidence offers units, rankings, and partner counts but no acquisition cost, conversion, reseller rebate, or payback math.
      whyItMatters: Sales efficiency remains proxy-only, which makes growth quality hard to judge.
      diligencePath: Request CAC by channel, reseller or retail margin terms, marketing spend allocation, and payback by primary SKU cohort.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: Gross margin, returns, and warranty burden
      missingEvidence: Public sources do not disclose gross margin by SKU, return rates, warranty expense, or refurbishment recovery economics.
      whyItMatters: Consumer hardware can look attractive on list price while still producing weak contribution margins.
      diligencePath: Request SKU-level gross margin, return and DOA rates, warranty reserve history, and refurbishment or resale assumptions.
      relatedQuestionRefs:
        - QI011
        - QI024
      relatedTableRefs:
        - TI003
        - TI005
