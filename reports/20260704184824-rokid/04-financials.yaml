        - Official product page
        - Sits in a mid-band that could broaden TAM but still needs attach and return data
      - - Rokid Station
        - $59 regular price
        - Visible list price only
        - Stand-alone demand and attach are not disclosed
        - Official product page
        - Looks more like upsell or ecosystem reinforcement than a major standalone revenue driver
      - - Navigation subscription
        - Price undisclosed
        - Subscription existence is public, realized monetization is not
        - No term, conversion, or churn data
        - Official product page
        - Recurring revenue may exist, but quality cannot be scored without attach and retention data
      - - Hi Rokid app features
        - Free app download with hardware-linked services
        - App is free to install, but service monetization structure is unclear
        - No public distinction among free, bundled, or paid features
        - Official app-download page plus store listings
        - Service layer may raise retention and support costs before it raises recurring revenue
    notes: >-
