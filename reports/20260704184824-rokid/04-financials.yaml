company:
  name: Rokid
chapter:
  number: 4
  title: Financials
  summary: >-
    Rokid has a visible but still only partially underwritable financial model: multiple public hardware price points,
    accessory and lens attach paths, app-mediated service delivery, and some evidence of international demand. The hard
    blocker is not the absence of commercial signals; it is the absence of audited revenue, current cash, burn, runway,
    and realized gross-margin disclosure, which leaves capital adequacy and revenue quality directionally positive but
    not finance-grade.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing are visible at the edge, but realized economics are not
    body: >-
      Rokid's public commercial surface is much richer than a single one-time gadget sale. Current official pages show a
      stack that includes Style, Rokid Glasses, AR Spatial, and a lower-cost Station companion device, while the launch
      materials add prescription-lens attach, reservation deposits, selected retail distribution, and an app-mediated AI
      service layer. That supports a multi-stream model made of hardware, companion accessories, prescription optics,
      and at least some software-like services around navigation, translation, and AI assistance. The financial problem
      is that nearly all of those surfaces are visible only as list-price or feature signals. Launch pricing and current
      pricing are already not perfectly aligned, which is useful evidence that realized ASPs may move with promotions or
      bundles. The same source set also shows that app activation, navigation, and translation matter to the commercial
      experience after checkout, which means some economic value is delivered after the hardware sale rather than only at
      the moment of shipment. Public evidence therefore supports revenue mechanisms, not recognized revenue mix, contract
      terms, or net unit economics.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-traction-and-sales-efficiency
    title: GTM motion looks DTC-first with channel ambition, but sales efficiency is still proxy-only
    body: >-
      The current go-to-market picture looks like a mix of direct e-commerce, crowdfunding-style demand generation,
      app-led onboarding, and selective channel expansion rather than a fully transparent enterprise sales engine. CNBC
      reported that 40% of revenue already came from outside mainland China and that Rokid aimed to sell up to one
      million pairs in 2026, while company materials point to global web launch, selected online and offline retail
      channels, and thousands of developers or enterprise partners. Those are encouraging top-of-funnel signals, but not
      efficiency math. There is no public CAC, payback, conversion, return-rate, or channel-discount disclosure. The
      best proxies are units, rankings, app adoption surfaces, and post-sale support friction. The app-store evidence is
      especially important: onboarding, AI features, translation, and navigation all depend on companion software, so
      commercial performance likely depends on activation quality as much as hardware sell-through.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
