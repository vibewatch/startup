  - id: cost-structure-margin-and-capital-intensity
    title: Cost structure is hardware-and-service heavy, and public comps argue against assuming software-like margins
    body: >-
      Public facts point to a cost base that is broader than product BOM alone. Rokid sells devices with displays,
      cameras, audio, batteries, and companion compute, ships internationally from China, supports prescription optics,
      and relies on mobile apps plus cloud-backed AI and translation features. That implies hardware costs, logistics,
      support, firmware and app maintenance, and some continuing inference or service-delivery spend. Independent review
      and app evidence also suggests that feature quality still requires iteration, which usually means higher support and
      warranty burden before scale economics improve. The comparator set is cautionary. Vuzix's 2025 filing shows a
      small smart-glasses vendor can still produce gross losses, consume operating cash, and take inventory-obsolescence
      charges. Meta's Reality Labs disclosures show that even platform leaders treat wearables as capital-intensive and
      inventory-sensitive. Rokid may outperform those analogies, but the current public data does not justify assuming a
      clean consumer-hardware gross-margin profile.
    claimRefs:
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
    figureRefs:
      - FI004
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy is the core underwriting blocker because fundraising is visible but treasury is not
    body: >-
      Rokid does not look unfunded in historical terms. Caplight and ChinaBiz both place cumulative outside capital in
      the hundreds of millions of dollars, and TechNode's April 2026 reporting ties the company to a Hong Kong IPO
      process. That is directionally supportive for a business trying to scale consumer hardware, international shipping,
      and an       app-plus-services layer at the same time. It also means the current story is still partly one of financing
      capacity, not just operating self-sufficiency. But historical fundraising is not the same as current adequacy.
      No reviewed public source discloses today's cash balance, monthly burn, debt package, covenant constraints, or
      runway. Public traction is therefore ahead of public finance. The best financial verdict is mixed: revenue quality
      is improving because Rokid is not just selling one SKU, but margin path still appears dependent on moving mix
      toward software, services, lenses, and partner economics rather than pure device gross profit. Underwriting should
      stay cautious until management opens the P&L and treasury position.
    claimRefs:
      - CI036
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042
      - CI043
      - CI044
