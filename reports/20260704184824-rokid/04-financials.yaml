    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Rokid's public model begins with device sales, then layers app activation, accessories, lenses, and selected paid
      services into a broader monetization stack.
    data:
      nodes:
        - id: r1
          label: Demand generation
          detail: CES launch, crowdfunding-style momentum, DTC site traffic, and selected retail channels create the initial funnel.
          tone: neutral
        - id: r2
          label: Device checkout
          detail: Style, Rokid Glasses, AR Spatial, and Station create multiple hardware ASP entry points.
          tone: positive
        - id: r3
          label: Companion activation
          detail: Hi Rokid and Rokid AR apps are required to unlock AI, media, translation, and device settings.
          tone: neutral
        - id: r4
          label: Attach monetization
          detail: Prescription lenses, companion hardware, and potential subscriptions expand wallet share after purchase.
          tone: positive
        - id: r5
          label: Recognized revenue quality
          detail: Realized mix between one-time hardware and recurring or service-like revenue is still undisclosed.
          tone: warning
      edges:
        - from: r1
          to: r2
          label: convert interest
        - from: r2
          to: r3
          label: activate device
        - from: r3
          to: r4
          label: upsell usage
        - from: r4
          to: r5
          label: determine mix
        - from: r2
          to: r5
          label: book hardware revenue
    approximationNotes: >-
      The bridge is qualitative because public sources show revenue surfaces and price points but do not disclose the
      split among device sales, subscriptions, lenses, or partner economics.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI010
      - CI011
      - CI012
