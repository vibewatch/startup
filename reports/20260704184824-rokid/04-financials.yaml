  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Current public proxy
      - Why it matters
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Revenue mix by SKU and geography
        - List prices, 40% ex-mainland revenue share, units goal, and user counts
        - Needed to separate one-time hardware from recurring or higher-quality revenue
        - Revenue quality remains unscored without mix and concentration
        - Request quarterly revenue by product line, geography, and channel for at least eight quarters
      - - Realized ASP and discounting
        - Style launch pricing differs from current product-page pricing
        - Determines whether public list prices translate into gross profit or are mostly promotional anchors
        - Margin model is highly sensitive to hidden discounts and bundles
        - Request order-level ASP bridge including taxes, coupons, channel rebates, and returns
      - - Gross margin by product and service layer
        - Hardware complexity, shipping burden, and cloud dependence imply cost, but no dollars are disclosed
        - Without gross margin, investors cannot assess scale efficiency or capital needs
        - Blended margin could be far below consumer-tech expectations
        - Request SKU gross margin, warranty reserve, cloud-service cost, and lens-margin breakdown
      - - Returns, warranty, and refurbishment
        - Review and app friction show quality risk, but no return or warranty data is public
        - Hardware businesses can destroy economics through returns even at strong top-line growth
        - Underwriting downside is currently opaque
        - Request return rates, DOA rates, warranty spend, and refurb resale assumptions
      - - CAC, payback, and channel economics
        - Units, rankings, and partner counts are public, but acquisition cost is not
        - Needed to test whether growth is profitable or subsidy-driven
        - GTM efficiency is proxy-only today
        - Request CAC by channel, payback, reseller terms, and contribution margin after marketing
      - - Cash, burn, runway, and debt
        - Historical funding plus IPO reporting, but no treasury disclosure
        - Determines financing dependency and dilution risk
        - Capital adequacy cannot be underwritten publicly
        - Request latest balance sheet, cash bridge, debt schedule, and runway scenarios
      - - Enterprise conversion and concentration
        - Company cites 5,000 enterprise partners and large developer numbers but not paying-account detail
        - Needed to understand whether ecosystem claims convert into durable revenue
        - Services and partner revenue quality remain uncertain
        - Request active paying enterprise logos, top-customer concentration, and attach from partner channels
    notes: >-
      The missing metrics are concentrated in precisely the fields that determine revenue quality, margin durability, and
      financing dependence, which is why the chapter's verdict stays cautious.
    claimRefs:
      - CI001
      - CI013
      - CI021
      - CI022
