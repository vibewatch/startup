- id: buyers-and-budget-owners
  title: Buyer, User, and Payer Segmentation
  body: 'Buyer segmentation differs sharply by pathway. For display-free AI glasses, the buyer and payer are usually the same person: a consumer or prosumer paying for translation, capture, navigation, note-taking, or social acceptability in an all-day frame. For consumer AR or spatial-productivity glasses, the job-to-be-done shifts toward private screens, portable entertainment, or mobile-office multitasking, so the payer may still be the end user but the willingness to pay increasingly resembles a productivity-hardware purchase. Enterprise assisted reality is different again. Workflow vendors and industrial-glasses providers frame the sale around picking, assembly, inspection, maintenance, remote assistance, and training, which means budget ownership often sits with operations, plant, field-service, warehouse, or training leaders rather than consumer-electronics buyers. Knowledge-work spatial computing can sit with IT, innovation, design, engineering, or digital-workplace teams because
    the value comes from collaboration, screen extension, and app workflow integration. The weakest public evidence in Rokid’s case is not the use-case taxonomy itself but whether Rokid has already converted any of these enterprise workflows into named scaled deployments. That missing proof keeps the chapter from overstating near-term enterprise penetration.'
