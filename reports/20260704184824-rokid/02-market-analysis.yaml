  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer / Payer
  - Rokid Relevance
  rows:
  - - Display-free AI smart glasses
    - Frames, cameras, microphones, on-device or companion AI features such as translation, navigation, notes, and capture
    - Broad smartphone spend, general app subscriptions not tied to glasses usage, generic voice assistants
    - Individual consumer or prosumer self-payer
    - Direct current category via Rokid AI Glasses Style
  - - Display smart glasses
    - Waveguide display hardware, translation or captioning features, accessories and prescription inserts tied to the device
    - Bulky tethered headsets, generic phone cameras, unrelated creator software spend
    - Consumer, traveler, creator, accessibility-oriented user
    - Direct current category via Rokid Glasses
  - - Consumer AR / spatial-computing bundles
    - Private-screen hardware, companion compute modules, keyboard or mouse accessories, apps required for multitasking or media use
    - General laptop or TV spend when no eyewear workflow is involved
    - Prosumer, traveler, mobile worker, entertainment user
    - Direct current category via Rokid AR Spatial
  - - Enterprise assisted reality
    - Workflow software, deployment services, industrial smart glasses, remote support, training, picking, inspection, and maintenance budgets
    - Unrelated ERP spend, generic video calling, factory capex with no wearable workflow overlay
    - Operations, plant, field-service, warehouse, or training budget owner
    - Adjacency where Rokid must still prove scaled deployments publicly
  - - Companion compute and software ecosystem
    - Operating systems, app compatibility, companion phone apps, downloads, and workflow integrations that unlock device utility
    - Independent software revenue captured entirely by third-party platforms when Rokid has no attach
    - IT, developer, ecosystem partner, or end user depending on path
    - Important because device value depends on the surrounding stack
  notes: Included and excluded spend varies materially by segment; broad XR or mobile AR categories are too wide to use as direct Rokid TAM proxies.
