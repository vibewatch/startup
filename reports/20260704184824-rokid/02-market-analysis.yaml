- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Multimodal AI, translation, and navigation
    - Driver
    - Near-term
    - Expands consumer utility beyond novelty and makes everyday wear easier to justify
    - Measure real feature usage and retention by function
  - - Lighter and more socially acceptable frames
    - Driver
    - Near-term
    - Improves all-day wearability and widens the user base beyond enthusiasts
    - Request comfort, return-rate, and daily-active-use metrics by product
  - - Enterprise workflow ROI in training, inspection, and remote support
    - Driver
    - Near- to mid-term
    - Supports task-specific enterprise budgets even if broad consumer adoption remains slower
    - Collect case-study economics and deployment conversion data
  - - OS, app, and developer ecosystem expansion
    - Driver
    - Mid-term
    - Can improve use-case breadth and stickiness beyond standalone hardware value
    - Request app attach, MAU, and third-party integration usage
  - - Battery life and ergonomics
    - Constraint
    - Current
    - Limits many deployments to discrete tasks instead of all-day use
    - Gather observed session-length, recharge, and return data
  - - Privacy and recording concerns
    - Constraint
    - Current
    - Can slow adoption in workplaces, regulated sectors, and public spaces
    - Ask management for privacy controls, on-device processing, and policy objections
  - - Software fragmentation and immature standards
    - Constraint
    - Current to mid-term
    - Creates setup friction and weakens broad app compatibility claims
    - Test cross-platform deployment effort and support burden
  - - Pricing, lenses, and bundle economics
    - Constraint
    - Current
    - Raises effective ownership cost above headline frame prices
    - Collect realized ASP, lens attach, accessory attach, and discount data
  notes: Driver rows show where adoption can accelerate; constraint rows show why broad XR-style TAMs still overstate realistic near-term capture.
