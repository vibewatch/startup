company:
  name: Rokid
chapter:
  number: 2
  title: Market Analysis
  summary: Rokid sits at the intersection of consumer AI glasses, portable display AR, enterprise assisted reality, and companion spatial-computing software. Public market lenses diverge sharply—from roughly USD 125 billion to USD 207 billion for broad 2026 AR, while narrower smart-glasses and industrial-wearables lenses are much smaller and sometimes internally inconsistent—so the most defensible near-term opportunity is narrower than headline XR TAMs suggest. The market is being pulled forward by lighter frames, multimodal AI, and workflow ROI, but constrained by battery, privacy, fragmented ecosystems, pricing, and limited public evidence of scaled Rokid enterprise deployments.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Rokid should not be treated as participating in one giant undifferentiated “XR” market. Its public portfolio spans at least four adjacent layers: display-free AI smart glasses, display smart glasses with waveguide or heads-up display elements, consumer AR or spatial-computing bundles built around private screens and multitasking, and a companion compute or software layer built on phone apps, YodaOS-Master, Android compatibility, and third-party experiences. Included spend therefore covers eyewear hardware, companion compute modules when required for the experience, and software or service budgets directly tied to translation, navigation, capture, virtual-screen productivity, or workflow execution. Excluded spend should include broad mobile AR advertising, generic smartphones, general-purpose laptops, healthcare AR software categories Rokid does not touch directly, and industrial software spend that accrues entirely to third-party workflow vendors rather than to device or bundle
    attach. The practical substitute set is wide: phones and earbuds for translation or navigation, laptops and external monitors for multitasking, wired wearable displays for portable screens, and industrial assisted-reality platforms for frontline workflows. That boundary discipline matters because broad AR market numbers can overstate Rokid’s real near-term revenue pool.'
