  title: Market Sizing Lens
  type: pyramid
  layout: standard
  summary: Moves from broad AR TAM down to the narrower Rokid-relevant wedge, preserving contradictory analyst scopes instead of forcing a false single-number market size.
  data:
    items:
    - label: Broad AR market
      value: USD 125B–207B in 2026
      detail: Mordor and Precedence publish sharply different 2026 AR totals because they likely define market scope differently.
    - label: Enterprise / workflow AR layer
      value: 29.09% remote-assistance share; industrial wearables USD 8.24B 2025 base
      detail: Enterprise budgets are meaningful but narrower than the full AR stack and often tied to specific workflows.
    - label: Smart-glasses device layer
      value: Low-confidence USD 19.7B 2026 headline
      detail: MarketsandMarkets isolates smart glasses, but its public summary contains internal inconsistencies and should be treated cautiously.
    - label: Rokid-reachable wedge
      value: Consumer AI glasses + portable displays + task-specific enterprise pilots
      detail: The most defensible near-term SAM is narrower than any broad XR TAM and depends on attach, workflow conversion, and bundle economics.
  approximationNotes: Item values intentionally mix broad and narrow lenses because public evidence supports a layered view better than a classical single-source TAM/SAM/SOM stack.
