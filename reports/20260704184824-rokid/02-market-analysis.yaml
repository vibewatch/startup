- id: TM005
  title: Substitute and Ecosystem Control Points
  columns:
  - Alternative / Control Point
  - What the Buyer Gets
  - Why It Substitutes or Shapes Spend
  - Primary Owner
  - Implication for Rokid
  rows:
  - - Smartphone + earbuds + maps / translation apps
    - Translation, navigation, capture, audio AI
    - Strong status-quo substitute for display-free AI glasses
    - Apple / Google / app vendors
    - Rokid must win on hands-free convenience and wearability
  - - Laptop + tablet + monitor stack
    - Big-screen productivity and multitasking
    - Strong status-quo substitute for spatial productivity glasses
    - PC OEMs and monitor vendors
    - Rokid must prove mobile-office convenience is worth extra hardware
  - - Portable monitor-style display glasses
    - Private cinema or wearable display
    - Adjacency for AR Spatial and Max 2 style usage
    - XREAL, Vuzix, Rokid, others
    - Competition is partly around comfort, compatibility, and optics rather than AI alone
  - - Enterprise industrial smart glasses
    - Guided work, safety, remote support
    - Direct substitute in frontline assisted reality
    - RealWear and workflow-software partners
    - Rokid needs proof of rugged enterprise traction to compete here
  - - XR operating systems and app platforms
    - Search, apps, translation, developer APIs, distribution
    - Control point for recurring engagement and ecosystem lock-in
    - Google Android XR, Snap OS, partner apps
    - Some value capture may accrue to platforms rather than Rokid hardware
  - - Prescription, downloads, and support surfaces
    - Fit, onboarding, software access, updates
    - Practical gatekeeper for repeat use and customer satisfaction
    - Rokid and channel partners
    - Companion setup quality can materially affect attach and retention
