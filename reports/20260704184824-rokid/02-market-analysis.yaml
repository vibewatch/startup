- id: FM003
  title: Adoption Funnel or Value-Chain Map
  type: flow
  layout: standard
  summary: Shows the value chain from enabling components and platforms to the buyer-facing workflows that determine whether spend lands with Rokid or adjacent partners.
  data:
    nodes:
    - id: components
      label: Optics, chips, and batteries
      detail: Display components, chipsets, and battery performance set the physical ceiling for comfort and runtime.
    - id: device
      label: Device OEMs
      detail: Rokid, Meta, XREAL, Vuzix, and RealWear package hardware around specific consumer or enterprise jobs.
    - id: platform
      label: OS and app platforms
      detail: YodaOS-Master, Android XR, Snap OS, and workflow software shape what the hardware can actually do.
    - id: setup
      label: Companion setup and support
      detail: Prescription, downloads, updates, and onboarding determine whether users reach repeatable utility.
    - id: workflow
      label: Consumer or enterprise workflow
      detail: Translation, portable displays, training, inspection, and remote support are the real budget gateways.
    - id: capture
      label: Value capture
      detail: Spend can accrue to Rokid hardware, bundle accessories, or third-party platforms depending on the workflow.
    edges:
    - from: components
      to: device
      label: enable hardware form factor
    - from: device
      to: platform
      label: needs software layer
    - from: platform
      to: setup
      label: requires onboarding and compatibility
    - from: setup
      to: workflow
      label: unlocks repeat use
    - from: workflow
      to: capture
      label: determines who gets paid
  approximationNotes: The flow is structural rather than quantitative; it highlights where adoption can fail or where software partners capture a disproportionate share of value.
