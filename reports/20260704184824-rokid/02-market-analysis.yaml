  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-contradictions
    missingEvidence: A consistent third-party 2026 smart-glasses and assisted-reality market model that reconciles device, software, and industrial workflow scopes.
    whyItMatters: Public TAM figures diverge sharply and at least one smart-glasses source is internally inconsistent, which weakens any single-number valuation narrative.
    diligencePath: Ask management for its own segment tree by units, ASP, attach rate, and enterprise workflow revenue, then reconcile it against each analyst scope in TM002.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: rokid-enterprise-customers
    missingEvidence: Named 2026 Rokid enterprise customers, deployment counts, renewal behavior, and whether pilots have converted into scaled production use.
    whyItMatters: The chapter can describe target workflows and budget owners, but it cannot prove Rokid has already captured them at scale from public evidence alone.
    diligencePath: Request a customer deployment list with segment, geography, seats or units, workflow, and whether the deployment is pilot, paid production, or expansion.
    relatedQuestionRefs:
    - QM014
    - QM025
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: Channel sell-through pricing, prescription-lens attach rates, accessory bundles, and any subscription revenue for navigation or translation services.
    whyItMatters: List prices are visible, but realized buyer economics may differ materially once lenses, accessories, bundles, or promotions are included.
    diligencePath: Collect distributor quotes, attach-rate data, and bill-of-material or channel-margin disclosures to convert list prices into realized ASP assumptions.
    relatedQuestionRefs:
    - QM020
  - type: private-evidence-only
    severity: material
    topic: rokid-unit-share-and-software-mix
    missingEvidence: Rokid unit shipments, active users, software attach rates, and hardware-versus-services revenue mix by product family.
    whyItMatters: Without these metrics the report cannot build a credible public SOM or determine how much ecosystem value accrues to Rokid versus partners.
    diligencePath: Request board-ready KPI history for units shipped, monthly active devices, app usage, subscription take-rate, and gross margin by hardware family.
    relatedQuestionRefs:
    - QM009
    - QM025
