- calloutType: risk
  title: Broad AR TAMs overstate Rokid’s realistic near-term market
  body: The broad AR market can support a growth narrative, but it is too wide for valuation or go-to-market underwriting. The defensible wedge is much narrower and public estimates conflict materially.
  claimRefs:
  - CM013
  - CM040
  - CM041
  - CM044
- calloutType: insight
  title: Rokid’s best market argument is utility plus form factor, not XR hype
  body: Hands-free AI, lighter frames, and task-specific enterprise ROI are the strongest current adoption levers. The category wins when it solves clear jobs better than phones, laptops, or rugged industrial devices.
