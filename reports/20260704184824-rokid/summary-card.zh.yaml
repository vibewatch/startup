summary:
  headline: Rokid 是中国最经验证的独立 AI/AR 眼镜厂商，2025 年订单超过 300,000 台，也确实跑出海外牵引力；但 US$2.1B 的 Pre-IPO 估值，需要上市后收入和利润率证据支撑，公开资料尚未披露。
