  topStrengths:
    - 11 代量产 AI/AR 眼镜，证明 Rokid 具备持续硬件落地纪律；在全球 AR 硬件创业公司里并不多见。
    - CNBC 披露海外收入占 40%，且已进入英国、加拿大、日本、台湾渠道，说明 IPO 前已在中国以外验证真实产品-市场契合。
    - 2025 年订单 300,000 台（预测的 3×），2026 年目标 1M 台，显示需求正在加速，并可能带来经营杠杆。
    - YodaOS-Master、开发者工具和光学服务全栈自有，降低对第三方平台的依赖，也沉淀切换成本。
    - 2026 轮融资引入 Lens Technology（光学制造）和 SenseTime（AI / 视觉）作为战略投资人，带来硬件供应链与 AI 模型生态协同。
  topRisks:
    - Meta Ray-Ban（搭载 Meta AI）、Snap Spectacles，以及资金更充足的国内同行（XREAL、Thunderbird Innovation），都在 AI/AR 眼镜赛道直接竞争。
    - 收入、毛利率和单位经济完全未披露，无法判断硬件利润率是否撑得住 $2.1B 估值。
    - 中美地缘政治风险：Rokid 已无法向美国市场发货；进一步贸易限制可能压缩支撑估值溢价的国际增长路径。
    - ChinaBiz 引述行业 30–50% 的高退货率，加上 Google Play 2.8/5 的分化用户评价，说明产品成熟度仍有缺口，可能压制近期增长。
    - AI 眼镜作为消费品类仍处早期；消费电子换机周期放缓，或“杀手级应用”弱于预期，都可能推迟大众市场过渡。
  unresolvedGaps:
    - 审计或管理层披露的收入、ASP、毛利率，以及硬件、软件、服务的单位经济。
    - HKEX IPO 招股书，包含正式财务报表、客户集中度和股权结构细节。
    - 确认 $2.1B 估值为投后，并基于 2026 年增资（而非投前估计）。
    - 退货率、保修索赔和售后服务成本数据，用于评估扣除售后成本后的毛利率。
    - 40% 海外收入按地区、渠道和产品线拆分的详细口径。
