evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: >-
      A public board roster, committee structure, and complete founder or executive roster tied to Rokid's 2026 pre-IPO
      governance.
    whyItMatters: >-
      Governance quality and succession depth matter more once a company begins IPO preparation and ownership is being
      diluted by rapid capital raises.
    diligencePath: >-
      Request a current board deck or draft prospectus section that lists directors, committees, and all named senior
      executives.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      The exact amount, terms, and complete shareholder list for the early-2026 capital increases and any bridge into
      the planned Hong Kong IPO.
    whyItMatters: >-
      Without a full shareholder schedule and round terms, investors cannot reconcile ownership concentration,
      liquidation rights, or the real capital base behind the IPO narrative.
    diligencePath: >-
      Obtain the updated cap table, shareholder register, and any draft listing or financing documents that enumerate
      the 39 new shareholders and round economics.
    relatedQuestionRefs:
      - QO010
      - QO011
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue disclosure
    missingEvidence: Audited revenue, ARR, gross margin, and geographic or product revenue mix for 2025-2026.
    whyItMatters: >-
      Rokid's valuation and IPO-readiness depend on monetization quality, not just crowdfunding, orders, or media
      rankings, and those finance metrics are absent from the reviewed public source set.
    diligencePath: >-
      Request audited financials, management accounts, or the draft IPO financial section showing revenue mix, margins,
      and growth.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: market-sizing-contradictions
    missingEvidence: >-
      A consistent third-party 2026 smart-glasses and assisted-reality market model that reconciles device, software,
      and industrial workflow scopes.
    whyItMatters: >-
      Public TAM figures diverge sharply and at least one smart-glasses source is internally inconsistent, which weakens
