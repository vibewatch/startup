company:
  name: Snyk
chapter:
  number: 8
  title: Valuation
  summary: 'Snyk is still a high-quality private platform, but the valuation case is stretched rather than cheap: the company
    is growing from a large ARR base, yet its last disclosed price was still $7.4B and the market around it remains crowded.
    The right call is to track the business closely, not to underwrite it as a bargain.'
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'The bull case is straightforward: Snyk has category breadth, durable developer workflow integration, a large customer
    base, and a still-expanding AI-security story. The anti-thesis is just as strong: public multiples remain rich, growth
    has slowed from hypergrowth to a more ordinary SaaS profile, platform-native bundles are a real threat, and the company
    still lacks the public transparency that would let an outsider underwrite a premium with high confidence. In other words,
    the company quality is high, but the price discipline has to stay strict. The valuation debate is really about whether
    the market is paying for optionality that is already mostly realized.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: recommendation
  title: Recommendation and valuation stance
  body: My recommendation is to track, not buy aggressively. The reason is not that the business is weak; it is that the combination
    of a $7.4B last disclosed valuation, a roughly $326M ARR base, and slower public growth leaves limited room for error.
    The company still merits a premium because it is embedded in developer workflow and has broad product coverage, but the
    premium should not be stretched so far that any slowdown or competitive loss becomes unrecoverable. A tracking stance
    preserves upside optionality while acknowledging that the equity is still priced like a late-stage winner. In practical
    terms, I would rather pay for visible execution than for a clean rerate that has not happened yet.
  claimRefs:
  - CV004
  - CV005
  - CV006
  tableRefs:
  - TV003
- id: scenarios-and-triggers
  title: Scenarios, comps, and thesis-break triggers
  body: A reasonable base case is stable ARR growth into the mid-single digits with ongoing product expansion and no IPO surprise;
    a bull case is AI-security and enterprise expansion re-accelerating growth and improving the multiple; a bear case is
    platform-native competition and pricing pressure compressing both growth and valuation. Public evidence does not justify
    a precise price target, but it does justify a disciplined view that the upside depends on execution, not just category
    quality. The thesis breaks if customer trust erodes, pricing weakens, or the company cannot turn its AI-security push
    into measured growth and retention gains. The important point is that the downside is easier to model than the rerate.
  claimRefs:
  - CV007
  - CV008
  - CV009
