  topStrengths:
    - Broad developer-first security platform spanning code, dependencies, containers, IaC, cloud, and AI workflows
    - Large installed base with 4,500+ customers and substantial customer proof
    - Strong workflow embedding and remediation automation create switching costs
    - Meaningful ARR scale and a sizable cash cushion support continued investment
    - Active product shipping shows ongoing execution and enterprise focus
  topRisks:
    - Valuation compression if growth stays in the mid-single digits and platform-native bundles win more budget
    - Disclosure opacity around margin, NRR, CAC, and headcount limits underwriting precision
    - Competition from GitHub, GitLab, SonarQube, Semgrep, and other alternatives is intense
    - Trust risk from alert noise or product gaps could erode developer adoption
    - AI-security pivot and leadership change add execution uncertainty
  unresolvedGaps:
    - Gross margin, NRR, CAC/LTV, and burn rate are still not publicly disclosed.
    - Headcount by function and region remains unavailable in current public materials.
    - Customer concentration and cohort churn are not disclosed in an audited form.
    - The IPO timeline and any current secondary-market mark remain unconfirmed.
