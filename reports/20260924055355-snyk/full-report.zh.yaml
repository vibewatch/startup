              - CM010
          - type: figure
            figureRef: FM001
            claimRefs: []
      - number: '2.2'
        title: 市场测算视角与采购决策中心
        blocks:
          - type: paragraph
            body: >-
              评估市场规模，可以把自上而下的行业测算与自下而上的客户采用情况结合起来看。Forge 引用的 DevSecOps 市场规模接近 $9B，至 2030 年复合年均增长率为 13.2%；而 Snyk 自身规模约为
              $326M ARR 和 4,500+ 家客户，表明 Snyk 已在开发者安全支出中占据可观份额，但远未垄断品类。采购决策也由多方共同推动：开发者和平台工程师使用产品，AppSec 团队负责治理，CISO
              或合规负责人通常把关签字。多方参与有助于市场扩张，也让销售周期长于纯开发者工具。即使品类仍然分散，Snyk 也可以靠加深现有客户渗透来提升份额。
            claimRefs:
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: 采纳驱动因素与制约条件
        blocks:
          - type: paragraph
            body: >-
              核心驱动因素很明确：代码量增加、第三方依赖增多、容器化普及、监管审查趋严，以及越来越多需要安全护栏的 AI 生成代码。Snyk 官方关于许可证风险的案例说明合规与 FedRAMP 式约束为何重要；它与 CI/CD
              和 GitHub
              的深度集成，说明原生工作流内的修复更容易获得开发者认可。主要阻力也很明确：预算有限，费用会随席位或用量增加，告警疲劳可能侵蚀信任；有些客户更偏好把代码质量、云安全态势和运行时防御整合在一起的平台。这让 Snyk
              很适合想要开发者优先型安全控制平台的团队，却未必适合只需要一个单点工具的团队。Snyk 要赢，关键是成为研发团队默认的安全工作流，而不是试图替代所有相邻的安全和治理预算。
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 规模测算假设
            body: 该市场更宜被理解为分散在开发者安全与相邻治理品类中的工作流预算，而非单一独立的开支类目。正因如此，自下而上的采纳度与实际采购推进节奏，其重要性不亚于分析师报告里的 TAM 幻灯片。
            calloutType: assumption
            claimRefs:
              - CM002
              - CM003
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              实际竞争范围相当宽泛。GitHub Advanced Security 与 GitLab 依仗软件交付平台自带的内嵌优势发起进攻；SonarQube 在相邻的代码质量赛道分流预算；Semgrep 和
              Mend.io 争夺开发者安全核心预算；OX Security 和 Aikido 凭统一工作流或轻量化易用性切入中小团队；Trivy、Checkov 等开源扫描工具则在低端市场持续施压。Snyk
              的优势不在于竞品做不到类似功能，而在于它把多种安全场景整合进一套开发者优先的体验。这种覆盖面吸引企业客户，但 SDLC 周边几乎每类预算都有替代选项。续约时，Snyk
              得证明自身价值胜过客户整合供应商的收益，不能只靠功能清单逐项对比。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs: []
      - number: '3.2'
        title: 功能、价格与信任度对比
        blocks:
          - type: paragraph
            body: >-
              最显著的差异体现在深度与广度的权衡。各类测评普遍认为 Snyk 在漏洞可达性分析、依赖项情报和开发者工作流整合上优势突出；SonarQube 则在代码质量与质量门禁上拔得头筹；OX
              及其他新锐厂商则主打运行时防护与全生命周期安全知识图谱。价格压力是另一关键维度：多家对比来源指出，随着席位增加和采购产品线拓展，Snyk 的企业级定价可能迅速水涨船高。这使得 Snyk
              在买方高度看重单一平台覆盖代码、依赖项、容器和 IaC 时最具竞争力；而一旦买方能以更低成本拼装出一套精简工具链，其吸引力便大打折扣。对买方而言，核心症结在于平台整合的便利性是否足以抵消替换为单点最优工具的风险。
            claimRefs:
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 分发渠道优势与切换成本
        blocks:
          - type: paragraph
            body: >-
              切换 Snyk 的成本主要在运营，而非技术层面。产品已嵌入 CI/CD、开发者 IDE、GitHub 与 GitLab
              工作流以及漏洞修复流程，将其替换意味着必须重新培训开发人员并重构策略门禁。与此相对，GitHub 和 GitLab
              能直接在客户已付费的平台上打包提供安全能力，大幅压低了增量采纳门槛。这就形成了一场拉锯战：当企业在多个 SDLC 环节追求业界一流的安全深度时，Snyk
              胜出；若买方更看重预算简化和供应商整合，平台自带的捆绑方案就更占优势。只有 Snyk 持续解决足够多的问题，客户才愿意承担迁移摩擦、继续使用。
            claimRefs:
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 竞争格局为何至关重要
            body: Snyk 面对的不是单一对手，而是一整套替代品组合，它们各自在不同的预算归属部门、使用场景或采购模式下具备胜算。这使得续约防守与交叉销售执行力，比单纯罗列产品广度更加关键。
            calloutType: risk
            claimRefs:
              - CP001
              - CP007
              - CP008
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价机制
        blocks:
          - type: paragraph
            body: >-
              Snyk 的商业模式仍是订阅制 SaaS：底层依靠 Freemium
              模式拉动采用，向上则采用按席位计费的企业级打包方案。公开对比页面与教程仍将该产品界定为按开发者分层订阅的业务，公司借助产品线广度在客群中实现持续扩购。这直接关乎收入质量：当客户从开源依赖扫描切入，进而加购代码、容器、IaC
              或 AI
              安全模块时，收入质量会随之改善。隐忧是，客户开发者人数越多，总费用越显眼，也越容易引发采购争议；尤其当平台原生捆绑方案或低价替代品触手可及时。投资判断的关键是，产品扩张能否快过席位增长引发采购阻力的临界点。
            claimRefs:
              - CI001
              - CI002
              - CI003
