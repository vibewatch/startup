            title: 财务披露缺口
            body: 财务层面最大的缺口不在于营收体量，而在于毛利率、NRR、CAC 及队列留存等关键指标完全缺乏公开数据。这在此阶段的非上市公司中实属常态，但也制约了外界对其长期运营效率的研判把握。
            calloutType: risk
            claimRefs:
              - CI008
