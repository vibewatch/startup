companyProfile:
  summary: >-
    Snyk 是一家非上市开发者安全平台，2015 年由 Guy Podjarny、Danny Grander 和 Assaf Hefetz
    在伦敦创立，现总部位于波士顿。公司提供一套深度嵌入研发工作流的安全产品，覆盖开源组件、专有代码、容器、基础设施即代码（IaC）、云环境与 AI 安全。公开信息显示，公司 ARR 约 $326M、客户超过 4,500
    家，也获得多家私募投资机构支持；但确切员工数和利润率细节仍未公开。
