      - number: '4.2'
        title: GTM 打法与运营效率代理指标
        blocks:
          - type: paragraph
            body: >-
              市场拓展（GTM）打法仍是典型的自下而上采纳结合企业级向上增购。Snyk
              自身发展历程与当前客户案例表明，其路径通常是开发者先行使用，继而引入安全合规管控，最终签下大额平台级合同。从财务视角看，整体运营效率取决于能否在维持低摩擦产品驱动增长（PLG）的同时，避免对高成本企业销售及渠道方案过度依赖。Sacra
              最新分析显示公司现金充裕、烧钱速度可控，但公开资料未披露获客成本（CAC）、回本周期或毛利率。因此，尽调只能用客户数、ARR、部署推进速度和产品覆盖面等指标作参照，无法依靠精确的单位经济模型。缺少完整经营披露时，增长质量和营收规模同样重要。
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: 成本结构与披露缺口
        blocks:
          - type: paragraph
            body: >-
              成本构成预计以研发、云基础设施及销售与营销为主，但具体拆分比例并未公开。投资备忘录最关键的原则是绝不能臆断未披露的数据。毛利率、净留存率（NRR）和客户队列流失率依然成谜，因此最严谨的做法是把利润率视为尚无证据支撑，而不是擅自假设。现有证据表明
              Snyk 现金储备可观，2026 年仍在投入产品；但经历早前裁员和更大范围的重组后，公司似乎仍在收缩战线、重新聚焦。营收规模可观，经营信息却披露不全，这正是财务判断保持审慎的主要原因。
            claimRefs:
              - CI007
              - CI008
              - CI009
      - number: '4.4'
        title: 图表
        blocks:
