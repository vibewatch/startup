  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Snyk 所在的市场不是泛网络安全，而是覆盖软件成分分析（SCA）、静态应用安全测试（SAST）、容器扫描、IaC、云配置检查和 AI 安全工作流管控的软件开发安全技术栈。它面对多类对手：Semgrep 和
              Trivy 等单点工具、GitHub Advanced Security 和 GitLab 等平台内嵌安全工具、Mend.io 和 Veracode 等企业级套件，以及 SonarQube
              等主打代码质量而非安全的相邻工作流工具。研发团队的攻击面持续扩大，撑起庞大的市场容量；但开发生命周期的每一个层级都挤满了供应商，竞争格外激烈。厘清该边界尤为关键：Snyk
              争夺的是开发者平台预算，而非企业安全运营中心（SOC）的通用开支；评估其采纳度既要看名义 TAM，更要衡量其在实际工作流中的份额。
            claimRefs:
              - CM001
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
