    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与市场定位
        blocks:
          - type: paragraph
            body: >-
              Snyk 将自己定位为一家 AI 安全公司，帮助开发者快速构建软件，同时保障代码、依赖项、容器和云基础设施的安全。公司 2015
              年起步于伦敦和特拉维夫，现总部设在波士顿。官网、高管介绍和客户案例都将其描述为深度嵌入开发工作流的安全软件，服务开发者与 AppSec 团队，而非通用代码质量套件。尽管 Snyk
              仍未上市，但产品覆盖面和客户规模已显现出后期平台型软件厂商的特征。
            claimRefs:
              - CO001
              - CO002
              - CO007
      - number: '1.2'
        title: 管理层、股权与融资
        blocks:
          - type: paragraph
            body: >-
              管理层页面显示 Ken MacAskill 兼任 CEO 和 CFO，团队还包括 Diana Brunelle、Manoj Nair、Tom Nielsen、Lindsey Bennett 和 Carey
              Stanton。Snyk 最近一次官方公布融资仍停留在 2022 年 12 月的 Series G 轮：由 QIA 领投 $196.5M，投后估值
              $7.4B。二级老股交易平台和私募市场数据仍将公司置于该估值区间，但公开记录中并未出现更新的定价新股轮次。因此其资本结构仍锚定在 2022
              年的水平，身后站着规模庞大却未公开披露细节的后期投资机构。这一投资人阵容足以支撑其平台型叙事，但治理透明度依然受限。
