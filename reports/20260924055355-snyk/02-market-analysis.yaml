chapter:
  number: 2
  title: Market Analysis
  summary: Snyk sits in the application security / DevSecOps market where security is pulled into developer workflows, CI/CD,
    cloud configuration, and AI-assisted coding. Public evidence points to a large but still fragmented market with strong
    adoption tailwinds, but also clear substitutes and budget friction around price, alert noise, and tool overlap.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: The right market boundary for Snyk is not generic cybersecurity; it is the software development security stack that
    spans software composition analysis, SAST, container scanning, IaC, cloud checks, and now AI-security workflow control.
    In that framing, Snyk competes with point tools like Semgrep and Trivy, platform tools like GitHub Advanced Security and
    GitLab security, enterprise suites like Mend.io and Veracode, and adjacent workflow tools such as SonarQube that manage
    quality rather than security. The market is large because software teams keep expanding their attack surface, but it is
    also crowded because every layer of the development lifecycle now has a vendor. That framing matters because Snyk sells
    into developer-platform budgets rather than broad SOC line items, so adoption should be measured by workflow share as
    much as by headline TAM.
  claimRefs:
  - CM001
  - CM004
  - CM005
  tableRefs:
  - TM001
  - TM002
  figureRefs:
  - FM001
- id: sizing-and-buyers
  title: Sizing lenses and buying center
  body: 'A usable sizing lens is to combine top-down market references with bottom-up adoption. Forge cites a DevSecOps market
    near $9B with 13.2% CAGR into 2030, while Snyk''s own scale sits around $326M ARR and 4,500+ customers, which implies
    meaningful share of the developer-security spend pool but not a category monopoly. The buying center is split: developers
    and platform engineers adopt the tool, AppSec teams govern it, and CISOs or compliance stakeholders often sign off. That
    multi-buyer structure is why the market can scale, but also why deals can take longer than pure developer tooling. The
    practical implication is that share gains can come from deeper account penetration even when the category remains fragmented.'
  claimRefs:
  - CM002
  - CM003
  - CM006
  tableRefs:
  - TM003
- id: drivers-and-friction
  title: Adoption drivers and constraints
  body: 'The key adoption drivers are straightforward: more code, more dependencies, more containers, more regulatory scrutiny,
    and more AI-generated code that needs guardrails. Snyk''s official license-risk lesson shows why compliance and FedRAMP-style
    constraints matter, while its CI/CD and GitHub integrations show why workflow-native remediation is persuasive to developers.
    The main friction points are just as clear: budgets are finite, pricing can scale with seats or usage, alert fatigue can
    erode trust, and some customers prefer broader platforms that combine code quality, cloud posture, and runtime defense
    in one place. That makes Snyk a strong fit for teams that want a developer-first security control plane, but not necessarily
    for teams that only want one narrow point solution. In practice, Snyk wins when it becomes the default security workflow
    inside development rather than when it tries to replace every adjacent security or governance budget.'
  claimRefs:
  - CM007
  - CM008
  - CM009
