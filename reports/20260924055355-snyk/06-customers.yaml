runDate: '2026-09-24'
company:
  name: Snyk
chapter:
  number: 6
  title: Customers
  summary: 'Snyk''s customer evidence remains strong: the company lists dozens of case studies, current public references
    point to 4,500+ customers, and its developer-first motion still starts with workflow adoption before expanding into governance
    and multi-product usage. The main customer diligence gap is not proof of demand; it is retention, concentration, and cohort
    detail.'
sections:
- id: customer-base
  title: Customer base and segmentation
  body: Snyk's customer base is broad and multi-segmented. The official case-study library includes enterprise brands, software
    companies, fintech, logistics, and technology providers, while the broader market references still point to 4,500+ customers.
    That spread matters because it shows Snyk is not a one-vertical tool. It sells to software teams, AppSec teams, and compliance
    stakeholders across industries. At the same time, the strongest public evidence remains logo-based rather than cohort-based,
    so the diligence question is less about whether Snyk has customers and more about which customers are durable, multi-product,
    and high-retention. In other words, the installed base looks broad enough to matter, but not yet transparent enough to
    underwrite retention with complete confidence.
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: adoption-and-proof
  title: Adoption trajectory and proof quality
  body: The adoption story is still classic product-led growth. Early developer usage leads to repository connections, then
    CI/CD integration, then enterprise governance. The 2022 funding release said more than 70% of current customers used multiple
    elements of the platform and that customers fixed millions of vulnerabilities, which suggests real expansion inside accounts.
    The customer story remains valuable because it connects security outcomes to developer speed, not just checkbox compliance.
    That said, the public evidence is mostly marketing and customer proof, not an audited customer ledger or a current renewal
    dataset. The practical read is that Snyk can expand once it is inside the workflow, but the quality of that expansion
    remains opaque.
  claimRefs:
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU003
- id: retention-and-gaps
  title: Retention, durability, and missing data
  body: The hardest missing customer data remains retention and concentration. The company previously disclosed NRR over 130%,
    but that was a 2022 statement rather than a current operating metric. Public sources do not show cohort churn, top-customer
    mix, or SMB conversion durability. That means the customer thesis is strong on breadth and weak on hard retention analytics.
    For underwriting, the practical conclusion is that Snyk appears widely adopted and still product-led, but the quality
    of that adoption is only partially observable from public data. Any conviction has to be tempered by the fact that logos
    do not tell the full expansion story.
  claimRefs:
  - CU007
  - CU008
  - CU009
