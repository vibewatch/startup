callouts:
- calloutType: assumption
  title: Customer evidence bias
  body: Public customer evidence is dominated by marketing and case studies, which naturally over-represents successful deployments.
    That makes the customer base look broad and healthy, but it does not answer churn, concentration, or net expansion by
    itself.
