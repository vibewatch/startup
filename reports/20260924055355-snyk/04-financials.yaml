chapter:
  number: 4
  title: Financials
  summary: Snyk remains a well-funded private software company with current ARR in the low-$300M range, still-healthy cash,
    and a seat-based freemium model that can scale but also drive pricing friction. Public margin detail remains sparse, so
    the underwriting picture depends more on revenue, burn, and go-to-market efficiency proxies than on a full financial statement.
sections:
- id: revenue-model
  title: Revenue model and pricing
  body: Snyk's revenue model remains subscription SaaS with freemium adoption at the low end and seat-based enterprise packaging
    above it. Public comparison pages and tutorials still describe the product as a per-developer, tiered subscription business,
    and the company uses product breadth to expand accounts over time. That matters because revenue quality improves when
    a customer starts on open source scanning and then adds code, container, IaC, or AI-security modules. The downside is
    that pricing can become visible and contested as a customer's developer count rises, especially when platform-native security
    bundles or low-cost alternatives are available. The key underwriting question is whether expansion can outrun the point
    where seat growth turns into procurement resistance.
  claimRefs:
  - CI001
  - CI002
  - CI003
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: go-to-market-and-efficiency
  title: GTM motion and efficiency proxies
  body: The go-to-market motion is still bottom-up plus enterprise expansion. Snyk's own history and current customer references
    show developer adoption first, then security governance, then larger platform deals. The financial implication is that
    gross efficiency depends on maintaining low-friction product-led adoption while avoiding over-reliance on expensive enterprise
    sales and channel programs. Sacra's current profile suggests the company still has significant cash and a manageable burn
    rate, but the public record does not expose CAC, payback, or gross margin. That means diligence has to use proxies such
    as customer count, ARR, rollout velocity, and product breadth rather than precise unit economics. Put differently, growth
    quality matters as much as gross revenue scale because the market still lacks full operating disclosure.
  claimRefs:
  - CI004
  - CI005
  - CI006
  tableRefs:
  - TI003
- id: costs-and-gaps
  title: Cost structure and disclosure gaps
  body: The cost structure is likely dominated by R&D, cloud infrastructure, and sales/marketing, but the exact mix is not
    public. The most important thing for the underwriting memo is not to pretend that hidden numbers are known. Gross margin,
    NRR, and cohort churn remain undisclosed, so the best evidence-based posture is to treat margin as unsupported, not assumed.
    The current run supports the view that Snyk has a meaningful cash cushion and that 2026 product investment is still active,
    yet the company also appears to have been trimming and refocusing after earlier layoffs and broader restructuring. That
    creates a tension between healthy revenue scale and incomplete disclosure, which is the main reason the financial view
    stays conservative.
  claimRefs:
  - CI007
  - CI008
  - CI009
