- calloutType: risk
  title: Financial disclosure gap
  body: The biggest financial gap is not revenue scale; it is the absence of public gross margin, NRR, CAC, and cohort data.
    For a private company at this stage, that is normal, but it limits conviction on long-term efficiency.
