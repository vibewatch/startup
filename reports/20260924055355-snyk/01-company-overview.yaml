company:
  name: Snyk
chapter:
  number: 1
  title: Company Overview
  summary: Snyk is a Boston-headquartered developer-security platform founded in 2015 that now combines open source, code,
    container, IaC, and AI-security tooling. The business remains private, its last disclosed valuation is still $7.4B, and
    current public evidence supports roughly $326M ARR, 4,500+ customers, and an ongoing pivot toward AI security and workflow-native
    remediation.
sections:
- id: identity-and-position
  title: Identity and market posture
  body: Snyk positions itself as an AI security company that helps developers build fast and stay secure across code, dependencies,
    containers, and cloud infrastructure. The company started in London and Tel Aviv in 2015 and is now headquartered in Boston.
    Its public site, leadership page, and customer pages all describe the product as workflow-native security software aimed
    at developers and AppSec teams, not a generic code-quality suite. The current posture matters for diligence because Snyk
    is still private, but it behaves like a late-stage platform vendor with broad product coverage and a large installed base.
  claimRefs:
  - CO001
  - CO002
  - CO007
- id: leadership-and-capital
  title: Leadership, ownership, and funding
  body: 'The leadership surface is visibly refreshed: the official leadership page lists Ken MacAskill as CEO & CFO, alongside
    Diana Brunelle, Manoj Nair, Tom Nielsen, Lindsey Bennett, and Carey Stanton. Snyk''s last official funding announcement
    remains the December 2022 Series G: $196.5M at a $7.4B valuation led by QIA. Secondary-market pages and private-market
    references keep the company in the same general valuation band, but the public record does not show a later priced primary
    round. The capital structure therefore remains anchored to the 2022 mark, with a large but still private late-stage investor
    base. The investor base is broad enough to support the platform story without making governance transparent.'
  claimRefs:
  - CO003
  - CO004
  - CO006
  tableRefs:
  - TO002
  - TO003
- id: scale-and-milestones
  title: Scale signals and refresh gaps
  body: 'Public signals point to durable scale, not hypergrowth. Sacra estimates $326M ARR in early 2026, roughly $400M of
    cash, and about $30M burn in the first half of 2025, while Built In and other current references describe Snyk as serving
    more than 4,500 customers. The company has also continued to ship product: repo content sync, custom CA support, and new
    CLI releases all appeared in 2026. The main unresolved diligence items remain standard for a private company: exact headcount,
    function mix, margin profile, and current retention quality are not publicly disclosed. Those gaps should be treated as
    live diligence items rather than stale omissions. The company has also kept its public milestone cadence active through
    launch notes, workflow sync, and partner surfaces.'
  claimRefs:
  - CO005
  - CO007
  - CO008
  tableRefs:
  - TO001
  figureRefs:
  - FO001
