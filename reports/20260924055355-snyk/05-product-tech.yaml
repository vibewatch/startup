chapter:
  number: 5
  title: Product & Technology
  summary: Snyk's product stack now spans open source, code, container, IaC, cloud, app risk, and AI-security tooling. The
    technology story is less about a single scanner and more about integrating security into developer tools, CI/CD, and AI-assisted
    workflows with enough automation to keep feedback usable.
sections:
- id: product-definition
  title: Product definition
  body: Snyk is easiest to understand as a workflow-native security platform. The official site says it helps organizations
    find and fix issues across code, dependencies, containers, and cloud infrastructure, while the current product language
    adds AI security to that list. This is not a monolithic scanner. It is a layered platform that starts in the developer
    loop, pushes findings into pull requests and CI/CD, and increasingly wraps AI-assisted development with studio and MCE-style
    integrations. That makes the product more useful to developers, but also increases the burden of keeping findings precise
    enough to maintain trust. The more surfaces Snyk covers, the more it has to prove that breadth does not become noise.
  claimRefs:
  - CE001
  - CE002
  - CE003
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-modules
  title: Modules, architecture, and integrations
  body: 'The module map is broad and coherent: Open Source covers dependency security and licensing, Code covers SAST, Container
    covers image scanning, IaC covers configuration security, Cloud extends into deployed environments, and AppRisk / AI Security
    manage higher-order application risk. Official docs show that Snyk''s issue APIs, CLI releases, and repo-content sync
    are still evolving, which matters because the product is API-driven and deeply integrated into developer workflows. GitHub,
    GitLab, Bitbucket, CI/CD systems, and AI coding tools are not side channels; they are the product''s operating system.
    That breadth is useful only if the integrations stay dependable enough to support day-to-day remediation.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  tableRefs:
  - TE003
- id: roadmap-and-reliability
  title: Deployment, support, and roadmap
  body: 'The 2026 release notes and official blog posts indicate a fast-moving roadmap: CLI fixes, custom CA support, repo
    content sync, and a new experimental Snyk Studio command. That is positive for platform breadth, but it also suggests
    the company is still tightening the reliability and enterprise-readiness of the stack. In practical diligence terms, that
    means looking at scan consistency, policy handling, API migrations, and integration friction rather than assuming all
    modules are equally mature. The core technical thesis is strong, but the operational burden of keeping the whole platform
    coherent is nontrivial. Put another way, the roadmap is a moat only if execution keeps pace with the expanding surface
    area.'
  claimRefs:
  - CE007
  - CE008
  - CE009
