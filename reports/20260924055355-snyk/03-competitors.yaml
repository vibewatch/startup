callouts:
- calloutType: risk
  title: Why competition matters
  body: Snyk is not fighting one rival; it is fighting a portfolio of substitutes that can each win a different budget owner,
    use case, or procurement model. That makes renewal defense and cross-sell execution more important than raw product breadth.
