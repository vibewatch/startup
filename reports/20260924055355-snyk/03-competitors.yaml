- id: TP002
  title: Budget pressure table
  columns:
  - pressure source
  - buyer logic
  - effect on Snyk
  rows:
  - - Platform-native bundles
    - consolidate spend into existing platform contracts
    - Reduce willingness to buy standalone security tooling
  - - Code-quality suites
    - treat quality and security as adjacent budgets
    - Pull engineering dollars toward lower-friction alternatives
  - - Open-source scanners
    - minimize license and tooling spend
    - Set a low-price anchor for smaller teams
  - - Specialist runtime graphs
    - prioritize attack-path visibility
    - Challenge Snyk on breadth and context
  notes: The main pressure is not a single rival; it is procurement simplification.
