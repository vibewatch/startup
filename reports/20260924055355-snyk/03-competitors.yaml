    - migration windows and overlap periods
  - - Remediation playbooks
    - teams depend on alerts and fixes
    - better-noise competitors and internal fatigue
  - - Multi-module adoption
    - customers expand across products
    - narrower point tools that solve one task well
  notes: Replacement friction is meaningful, but not insurmountable if platform bundles are cheaper.
