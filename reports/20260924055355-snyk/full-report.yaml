              - CM010
          - type: figure
            figureRef: FM001
            claimRefs: []
      - number: '2.2'
        title: Sizing lenses and buying center
        blocks:
          - type: paragraph
            body: >-
              A usable sizing lens is to combine top-down market references with bottom-up adoption. Forge cites a
              DevSecOps market near $9B with 13.2% CAGR into 2030, while Snyk's own scale sits around $326M ARR and
              4,500+ customers, which implies meaningful share of the developer-security spend pool but not a category
              monopoly. The buying center is split: developers and platform engineers adopt the tool, AppSec teams
              govern it, and CISOs or compliance stakeholders often sign off. That multi-buyer structure is why the
              market can scale, but also why deals can take longer than pure developer tooling. The practical
              implication is that share gains can come from deeper account penetration even when the category remains
              fragmented.
            claimRefs:
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The key adoption drivers are straightforward: more code, more dependencies, more containers, more
              regulatory scrutiny, and more AI-generated code that needs guardrails. Snyk's official license-risk lesson
              shows why compliance and FedRAMP-style constraints matter, while its CI/CD and GitHub integrations show
              why workflow-native remediation is persuasive to developers. The main friction points are just as clear:
              budgets are finite, pricing can scale with seats or usage, alert fatigue can erode trust, and some
              customers prefer broader platforms that combine code quality, cloud posture, and runtime defense in one
              place. That makes Snyk a strong fit for teams that want a developer-first security control plane, but not
              necessarily for teams that only want one narrow point solution. In practice, Snyk wins when it becomes the
              default security workflow inside development rather than when it tries to replace every adjacent security
              or governance budget.
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sizing assumption
            body: >-
              The market is best thought of as a workflow budget spread across developer security and adjacent
              governance categories, not as one clean standalone line item. That is why bottom-up adoption and
              procurement motion matter as much as analyst TAM slides.
            calloutType: assumption
            claimRefs:
              - CM002
              - CM003
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The realistic competitive set is broad. GitHub Advanced Security and GitLab compete from inside the
              software delivery platform; SonarQube competes in the adjacent code-quality lane; Semgrep and Mend.io
              compete for developer-security budgets; OX Security and Aikido compete on unified workflow or small-team
              simplicity; Trivy, Checkov, and other open-source scanners pressure the low end. Snyk's defense is not
              that these products do nothing similar, but that it bundles many security use cases inside one
              developer-first experience. That breadth is attractive to enterprise teams, but it also means almost every
              budget category around the SDLC has an alternative. The practical takeaway is that renewal defense has to
              beat consolidation logic, not just feature-by-feature comparison charts.
            claimRefs:
              - CP001
              - CP002
              - CP003
