chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and market posture
        blocks:
          - type: paragraph
            body: >-
              Snyk positions itself as an AI security company that helps developers build fast and stay secure across
              code, dependencies, containers, and cloud infrastructure. The company started in London and Tel Aviv in
              2015 and is now headquartered in Boston. Its public site, leadership page, and customer pages all describe
              the product as workflow-native security software aimed at developers and AppSec teams, not a generic
              code-quality suite. The current posture matters for diligence because Snyk is still private, but it
              behaves like a late-stage platform vendor with broad product coverage and a large installed base.
            claimRefs:
              - CO001
              - CO002
              - CO007
      - number: '1.2'
        title: Leadership, ownership, and funding
        blocks:
          - type: paragraph
            body: >-
              The leadership surface is visibly refreshed: the official leadership page lists Ken MacAskill as CEO &
              CFO, alongside Diana Brunelle, Manoj Nair, Tom Nielsen, Lindsey Bennett, and Carey Stanton. Snyk's last
              official funding announcement remains the December 2022 Series G: $196.5M at a $7.4B valuation led by QIA.
              Secondary-market pages and private-market references keep the company in the same general valuation band,
              but the public record does not show a later priced primary round. The capital structure therefore remains
              anchored to the 2022 mark, with a large but still private late-stage investor base. The investor base is
              broad enough to support the platform story without making governance transparent.
            claimRefs:
              - CO003
              - CO004
              - CO006
