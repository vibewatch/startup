      - number: '5.2'
        title: Modules, architecture, and integrations
        blocks:
          - type: paragraph
            body: >-
              The module map is broad and coherent: Open Source covers dependency security and licensing, Code covers
              SAST, Container covers image scanning, IaC covers configuration security, Cloud extends into deployed
              environments, and AppRisk / AI Security manage higher-order application risk. Official docs show that
              Snyk's issue APIs, CLI releases, and repo-content sync are still evolving, which matters because the
              product is API-driven and deeply integrated into developer workflows. GitHub, GitLab, Bitbucket, CI/CD
              systems, and AI coding tools are not side channels; they are the product's operating system. That breadth
              is useful only if the integrations stay dependable enough to support day-to-day remediation.
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Deployment, support, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The 2026 release notes and official blog posts indicate a fast-moving roadmap: CLI fixes, custom CA
              support, repo content sync, and a new experimental Snyk Studio command. That is positive for platform
              breadth, but it also suggests the company is still tightening the reliability and enterprise-readiness of
              the stack. In practical diligence terms, that means looking at scan consistency, policy handling, API
              migrations, and integration friction rather than assuming all modules are equally mature. The core
              technical thesis is strong, but the operational burden of keeping the whole platform coherent is
              nontrivial. Put another way, the roadmap is a moat only if execution keeps pace with the expanding surface
              area.
            claimRefs:
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical moat
            body: >-
              The moat is not one engine; it is the combination of workflow embedding, vulnerability intelligence, and
              remediation automation across multiple surfaces. The more surfaces a customer adopts, the harder the
              product is to replace.
            calloutType: insight
            claimRefs:
              - CE002
              - CE005
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Snyk's customer base is broad and multi-segmented. The official case-study library includes enterprise
              brands, software companies, fintech, logistics, and technology providers, while the broader market
              references still point to 4,500+ customers. That spread matters because it shows Snyk is not a
              one-vertical tool. It sells to software teams, AppSec teams, and compliance stakeholders across
              industries. At the same time, the strongest public evidence remains logo-based rather than cohort-based,
              so the diligence question is less about whether Snyk has customers and more about which customers are
              durable, multi-product, and high-retention. In other words, the installed base looks broad enough to
              matter, but not yet transparent enough to underwrite retention with complete confidence.
            claimRefs:
