        blocks:
          - type: paragraph
            body: >-
              Public signals point to durable scale, not hypergrowth. Sacra estimates $326M ARR in early 2026, roughly
              $400M of cash, and about $30M burn in the first half of 2025, while Built In and other current references
              describe Snyk as serving more than 4,500 customers. The company has also continued to ship product: repo
              content sync, custom CA support, and new CLI releases all appeared in 2026. The main unresolved diligence
              items remain standard for a private company: exact headcount, function mix, margin profile, and current
              retention quality are not publicly disclosed. Those gaps should be treated as live diligence items rather
              than stale omissions. The company has also kept its public milestone cadence active through launch notes,
              workflow sync, and partner surfaces.
