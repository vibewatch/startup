      - number: '4.2'
        title: GTM motion and efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The go-to-market motion is still bottom-up plus enterprise expansion. Snyk's own history and current
              customer references show developer adoption first, then security governance, then larger platform deals.
              The financial implication is that gross efficiency depends on maintaining low-friction product-led
              adoption while avoiding over-reliance on expensive enterprise sales and channel programs. Sacra's current
              profile suggests the company still has significant cash and a manageable burn rate, but the public record
              does not expose CAC, payback, or gross margin. That means diligence has to use proxies such as customer
              count, ARR, rollout velocity, and product breadth rather than precise unit economics. Put differently,
              growth quality matters as much as gross revenue scale because the market still lacks full operating
              disclosure.
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Cost structure and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The cost structure is likely dominated by R&D, cloud infrastructure, and sales/marketing, but the exact
              mix is not public. The most important thing for the underwriting memo is not to pretend that hidden
              numbers are known. Gross margin, NRR, and cohort churn remain undisclosed, so the best evidence-based
              posture is to treat margin as unsupported, not assumed. The current run supports the view that Snyk has a
              meaningful cash cushion and that 2026 product investment is still active, yet the company also appears to
              have been trimming and refocusing after earlier layoffs and broader restructuring. That creates a tension
              between healthy revenue scale and incomplete disclosure, which is the main reason the financial view stays
              conservative.
            claimRefs:
              - CI007
              - CI008
              - CI009
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial disclosure gap
            body: >-
              The biggest financial gap is not revenue scale; it is the absence of public gross margin, NRR, CAC, and
              cohort data. For a private company at this stage, that is normal, but it limits conviction on long-term
              efficiency.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition
        blocks:
          - type: paragraph
            body: >-
              Snyk is easiest to understand as a workflow-native security platform. The official site says it helps
              organizations find and fix issues across code, dependencies, containers, and cloud infrastructure, while
              the current product language adds AI security to that list. This is not a monolithic scanner. It is a
              layered platform that starts in the developer loop, pushes findings into pull requests and CI/CD, and
              increasingly wraps AI-assisted development with studio and MCE-style integrations. That makes the product
              more useful to developers, but also increases the burden of keeping findings precise enough to maintain
              trust. The more surfaces Snyk covers, the more it has to prove that breadth does not become noise.
            claimRefs:
              - CE001
              - CE002
              - CE003
