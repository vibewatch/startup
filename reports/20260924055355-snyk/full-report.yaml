        - thin
        - Hard to quantify operational resilience
      - - Pricing compression
        - visible but not quantified
        - Makes margin path harder to model
    notes: Public disclosure is sparse enough that hidden risk remains material.
    claimRefs:
      - CR003
      - CR008
      - CR010
  - id: TV001
    title: Valuation decision table
    columns:
      - dimension
      - assessment
      - why it matters
    rows:
      - - Recommendation
        - track
        - Keeps upside optionality without overpaying for current growth
      - - Confidence
        - medium
        - Strong operating signals, incomplete private financial disclosure
      - - Risk rating
        - high
        - Competition, pricing, and execution risk remain elevated
      - - Valuation stance
        - stretched
        - Last disclosed price remains rich versus current ARR
      - - Last disclosed valuation
        - $7.4B
        - Still the public anchor
      - - Implied ARR multiple
        - ~22.7x
        - 7.4B / 326M
      - - Bull case
        - higher multiple via AI-security and expansion
        - Requires stronger growth and retention
      - - Base case
        - stable mid-single-digit growth
        - Most likely if execution remains steady
      - - Bear case
        - compression from competition and price pressure
        - If platform-native bundles win
      - - Main trigger
        - customer trust / pricing / retention
        - These variables decide the next repricing
    notes: >-
      The implied ARR multiple uses Sacra ARR and the last disclosed valuation. It is a rough screening metric, not a
      formal underwriting output.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV002
    title: Valuation sensitivity table
    columns:
      - scenario
      - read
      - implication
    rows:
      - - Bull
        - AI-security and enterprise expansion reaccelerate growth
        - Multiple could expand from here
      - - Base
        - mid-single-digit growth and steady execution
        - Keeps the stock in tracking territory
      - - Bear
        - pricing pressure and platform bundles compress growth
        - Raises rerate risk
      - - Anchor
        - $7.4B last disclosed valuation
        - Still the public reference point
    notes: This is a directional decision table, not a formal valuation model.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
  - id: TV003
    title: Diligence gap table
    columns:
      - missing input
      - current status
      - why it matters
    rows:
      - - Filed IPO timeline
        - absent
        - Prevents a clean liquidity schedule
      - - Public NRR / churn
        - absent
        - Limits retention visibility
      - - Margin disclosure
        - absent
        - Hard to pin down operating leverage
      - - Customer concentration
        - absent
        - Hides downside concentration risk
    notes: The valuation case is attractive only if these gaps do not hide material deterioration.
    claimRefs:
      - CV008
      - CV009
      - CV010
