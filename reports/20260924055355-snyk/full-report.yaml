      - number: '6.3'
        title: Retention, durability, and missing data
        blocks:
          - type: paragraph
            body: >-
              The hardest missing customer data remains retention and concentration. The company previously disclosed
              NRR over 130%, but that was a 2022 statement rather than a current operating metric. Public sources do not
              show cohort churn, top-customer mix, or SMB conversion durability. That means the customer thesis is
              strong on breadth and weak on hard retention analytics. For underwriting, the practical conclusion is that
              Snyk appears widely adopted and still product-led, but the quality of that adoption is only partially
              observable from public data. Any conviction has to be tempered by the fact that logos do not tell the full
              expansion story.
            claimRefs:
              - CU007
              - CU008
              - CU009
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer evidence bias
            body: >-
              Public customer evidence is dominated by marketing and case studies, which naturally over-represents
              successful deployments. That makes the customer base look broad and healthy, but it does not answer churn,
              concentration, or net expansion by itself.
            calloutType: assumption
            claimRefs:
