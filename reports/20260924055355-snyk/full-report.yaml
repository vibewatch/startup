  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Snyk is not generic cybersecurity; it is the software development security
              stack that spans software composition analysis, SAST, container scanning, IaC, cloud checks, and now
              AI-security workflow control. In that framing, Snyk competes with point tools like Semgrep and Trivy,
              platform tools like GitHub Advanced Security and GitLab security, enterprise suites like Mend.io and
              Veracode, and adjacent workflow tools such as SonarQube that manage quality rather than security. The
              market is large because software teams keep expanding their attack surface, but it is also crowded because
              every layer of the development lifecycle now has a vendor. That framing matters because Snyk sells into
              developer-platform budgets rather than broad SOC line items, so adoption should be measured by workflow
              share as much as by headline TAM.
            claimRefs:
              - CM001
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
