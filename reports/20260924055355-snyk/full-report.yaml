  - id: FR001
    type: matrix
    layout: wide
    title: Risk pressure matrix
    summary: Relative pressure sources driving Snyk's risk posture in 2026.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Platform bundling
          values:
            - label: high
              tone: negative
              detail: Native platform bundles can compress adoption and pricing.
            - label: high
              tone: negative
              detail: Bundling threatens standalone budget ownership.
            - label: medium
              tone: warning
              detail: Workflow integration and breadth help but do not eliminate pressure.
            - label: high
              tone: negative
              detail: Residual exposure stays elevated.
        - label: Trust / noise
          values:
            - label: high
              tone: negative
              detail: Alert fatigue can quickly undermine developer trust.
            - label: high
              tone: negative
              detail: Noisy findings can slow adoption and renewal.
            - label: medium
              tone: warning
              detail: Reachability and fix automation mitigate but do not solve it.
            - label: high
              tone: negative
              detail: Residual risk remains material.
        - label: Execution / AI pivot
          values:
            - label: medium
              tone: warning
              detail: The AI-security push adds roadmap complexity.
            - label: medium
              tone: warning
              detail: Execution slips would affect product coherence.
            - label: medium
              tone: warning
              detail: Releases and acquisitions show active mitigation.
            - label: medium
              tone: warning
              detail: Residual exposure is manageable but real.
        - label: Disclosure opacity
          values:
            - label: high
              tone: negative
              detail: Private-company disclosure limits diligence confidence.
            - label: medium
              tone: warning
              detail: It mostly affects model precision rather than operating reality.
            - label: low
              tone: positive
              detail: Public sources can still triangulate the main story.
            - label: medium
              tone: warning
              detail: Residual uncertainty stays high.
        - label: Leadership / execution change
          values:
            - label: medium
              tone: warning
              detail: Leadership shifts can compound roadmap pressure.
            - label: medium
              tone: warning
              detail: Execution changes affect product coherence.
            - label: medium
              tone: warning
              detail: Exec bench and active releases mitigate some risk.
            - label: medium
              tone: warning
              detail: Residual risk remains moderate.
        - label: Pricing friction
          values:
            - label: high
              tone: negative
              detail: Seat and module pricing can slow expansion.
            - label: medium
              tone: warning
              detail: Budget owners may resist broadening the contract.
            - label: medium
              tone: warning
              detail: Freemium and bundling partially offset the pressure.
            - label: high
              tone: negative
              detail: Residual pricing pressure remains elevated.
