          - type: figure
            figureRef: FP001
            claimRefs: []
      - number: '3.2'
        title: Feature, price, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The strongest differences are on depth versus scope. Snyk is consistently described as strong on
              reachability, dependency intelligence, and developer workflow, while SonarQube wins on code quality and
              quality gates, and OX/other newer entrants win on runtime and full-lifecycle security graphs. Pricing
              pressure is the other major axis: several comparison sources note that Snyk's enterprise pricing can
              escalate quickly as seat counts and product breadth expand. That makes Snyk strongest when the buyer
              values a single platform for code, dependency, container, and IaC work, and weaker when the buyer can
              stitch together a narrower stack more cheaply. In buyer terms, the main question is whether platform
              convenience outweighs best-of-breed replacement risk.
            claimRefs:
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Distribution power and switching costs
        blocks:
          - type: paragraph
            body: >-
              The main switching costs are operational rather than technical. Snyk is embedded into CI/CD, developer
              IDEs, GitHub and GitLab workflows, and remediation processes, so replacing it means retraining developers
              and reworking policy gates. At the same time, GitHub and GitLab can bundle security capability into a
              platform that customers already pay for, which lowers the incremental adoption hurdle. That creates a
              tug-of-war: Snyk wins when the company wants best-in-class security depth across several SDLC surfaces;
              platform-native bundles win when budget simplicity and vendor consolidation outweigh best-of-breed
              coverage. The switching-cost story only works if the platform keeps resolving enough issues to justify the
              friction of staying.
            claimRefs:
              - CP007
              - CP008
              - CP009
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Why competition matters
            body: >-
              Snyk is not fighting one rival; it is fighting a portfolio of substitutes that can each win a different
              budget owner, use case, or procurement model. That makes renewal defense and cross-sell execution more
              important than raw product breadth.
            calloutType: risk
            claimRefs:
              - CP001
              - CP007
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Snyk's revenue model remains subscription SaaS with freemium adoption at the low end and seat-based
              enterprise packaging above it. Public comparison pages and tutorials still describe the product as a
              per-developer, tiered subscription business, and the company uses product breadth to expand accounts over
              time. That matters because revenue quality improves when a customer starts on open source scanning and
              then adds code, container, IaC, or AI-security modules. The downside is that pricing can become visible
              and contested as a customer's developer count rises, especially when platform-native security bundles or
              low-cost alternatives are available. The key underwriting question is whether expansion can outrun the
              point where seat growth turns into procurement resistance.
            claimRefs:
              - CI001
              - CI002
