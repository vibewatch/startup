        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The adoption story is still classic product-led growth. Early developer usage leads to repository
              connections, then CI/CD integration, then enterprise governance. The 2022 funding release said more than
              70% of current customers used multiple elements of the platform and that customers fixed millions of
              vulnerabilities, which suggests real expansion inside accounts. The customer story remains valuable
              because it connects security outcomes to developer speed, not just checkbox compliance. That said, the
              public evidence is mostly marketing and customer proof, not an audited customer ledger or a current
              renewal dataset. The practical read is that Snyk can expand once it is inside the workflow, but the
              quality of that expansion remains opaque.
            claimRefs:
