  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk register
        blocks:
          - type: paragraph
            body: >-
              The highest-probability risk is competitive and economic: Snyk can be displaced by platform-native
              security bundles, low-cost open-source tooling, or specialist products that are perceived as less noisy.
              The second major risk is trust: if findings are too noisy or if Snyk misses coverage in an important
              workflow, developer adoption weakens quickly. The third cluster is execution: the company is refactoring
              around AI security, new releases, and leadership change while still operating as a large private software
              business. That does not make the business fragile, but it does mean the risk stack is heavier than the
              top-line growth story alone suggests. The real risk is that several manageable issues stack together and
              make renewal defense harder at the same time.
            claimRefs:
              - CR001
              - CR002
              - CR003
