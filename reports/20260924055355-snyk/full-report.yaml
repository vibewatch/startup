      - number: '7.2'
        title: Legal, operational, and partner risk
        blocks:
          - type: paragraph
            body: >-
              Snyk's own license-and-regulatory lesson shows why compliance risk matters: software licensing mistakes
              and regulatory obligations can create legal exposure, market-access issues, or procurement friction.
              Operationally, the platform depends on constant release management, CI/CD integration, and scan stability
              across many languages and ecosystems. Partnership risk is also real because Snyk relies on GitHub, GitLab,
              container registries, cloud environments, and training partners to stay embedded. Any deterioration in
              those relationships, or any broad platform policy shift, would create immediate distribution and product
              friction. That dependency stack means even a small platform change can have an outsized customer-facing
              impact.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR010
      - number: '7.3'
        title: Mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The right way to manage Snyk risk is with monitors, not slogans. Watch for customer churn, pricing
              resistance, repeated noisy findings, major partner-bundle moves from GitHub or GitLab, regulatory claims
              that reduce addressable market, and more layoffs or restructurings that suggest a weaker operating plan.
              Public CLI updates and repo-content sync are signs of ongoing investment, but they also show the company
              is still fixing and hardening the platform. Thesis-break triggers are therefore operational and
              commercial, not just financial: if Snyk loses developer trust, cannot defend pricing, or cannot keep pace
              with platform-native security, the valuation case weakens quickly. The key question is whether the company
              can keep shipping mitigations faster than new risk surfaces appear.
            claimRefs:
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break criteria
            body: >-
              A real thesis break would be visible in customer churn, major platform bundle displacement, sustained
              pricing compression, or a public sign that the AI-security pivot is consuming resources without improving
              retention or expansion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Snyk has category breadth, durable developer workflow integration, a
              large customer base, and a still-expanding AI-security story. The anti-thesis is just as strong: public
              multiples remain rich, growth has slowed from hypergrowth to a more ordinary SaaS profile, platform-native
              bundles are a real threat, and the company still lacks the public transparency that would let an outsider
              underwrite a premium with high confidence. In other words, the company quality is high, but the price
              discipline has to stay strict. The valuation debate is really about whether the market is paying for
              optionality that is already mostly realized.
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              My recommendation is to track, not buy aggressively. The reason is not that the business is weak; it is
              that the combination of a $7.4B last disclosed valuation, a roughly $326M ARR base, and slower public
              growth leaves limited room for error. The company still merits a premium because it is embedded in
              developer workflow and has broad product coverage, but the premium should not be stretched so far that any
              slowdown or competitive loss becomes unrecoverable. A tracking stance preserves upside optionality while
              acknowledging that the equity is still priced like a late-stage winner. In practical terms, I would rather
              pay for visible execution than for a clean rerate that has not happened yet.
            claimRefs:
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comps, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A reasonable base case is stable ARR growth into the mid-single digits with ongoing product expansion and
              no IPO surprise; a bull case is AI-security and enterprise expansion re-accelerating growth and improving
              the multiple; a bear case is platform-native competition and pricing pressure compressing both growth and
              valuation. Public evidence does not justify a precise price target, but it does justify a disciplined view
              that the upside depends on execution, not just category quality. The thesis breaks if customer trust
              erodes, pricing weakens, or the company cannot turn its AI-security push into measured growth and
              retention gains. The important point is that the downside is easier to model than the rerate.
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision rule
            body: >-
              Track Snyk if you want exposure to developer security and AI-security workflow control, but wait for
              either a clearer public rerate or more disclosure before treating the stock as cheap.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV006
