companyProfile:
  summary: >-
    Snyk is a private developer-security platform founded in 2015 in London by Guy Podjarny, Danny Grander, and Assaf
    Hefetz. It now operates from Boston and sells a workflow-native security stack that spans open source, code,
    containers, infrastructure as code, cloud, and AI-security tooling. Public evidence suggests the company has roughly
    $326M ARR, 4,500+ customers, and a large private investor base, but exact headcount and margin detail remain
    undisclosed.
