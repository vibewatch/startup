company:
  name: HeyTea
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public reporting documents international expansion and a historical 2021 financing mark,
    but does not establish current valuation, audited operating economics, or investor terms.
    The evidence therefore supports research-more at an unknown valuation stance, not a priced
    buy or an invented scenario range.
sections:
  - id: decision
    title: Price-sensitive decision
    body: >-
      The investment decision is research-more, with low confidence in any price conclusion
      and high diligence risk from private-company opacity. Public reporting describes a
      substantial international footprint and ongoing U.S. product and store activity, but
      those are reach and marketing signals rather than proof of store-level profitability,
      repeat purchase, or cash generation. The strongest disclosed valuation point in this
      evidence set is a July 2021 financing mark of about $9 billion; it is not a current
      entry price. The accessible sources also disagree on financing totals and round counts,
      and do not supply an audited current revenue base, EBITDA, debt, or cap table. Until
      those inputs and current financing terms are reconciled, neither an attractive nor an
      expensive current multiple can be calculated. A valuation stance of unknown is more
      defensible than carrying forward an old mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is that a differentiated tea brand can translate product innovation,
      international distribution, and destination-store concepts into durable demand. Recent
      reporting describes more than 40 U.S. outlets, a New York concept-store opening, and
      limited product collaborations; separate sources report a large global footprint.
      These disclosures support market presence, not customer economics. The anti-thesis is
      that visibility and store count may overstate value if mature-store sales, contribution
      margins, payback periods, and international cohort economics are weak or capital
      intensive. The global store counts differ across sources and have no common as-of date
      or stated definition. A 2020 report also described a sector-wide business decline during
      COVID-19; that is historical downside context, not evidence of current performance.
      Evidence that would change the view is audited store-level performance plus
      independently reconciled current financing and ownership terms.
    claimRefs: [CV001, CV002, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: valuation-and-comparables
    title: Valuation evidence and comparable set
    body: >-
      Public sources place HeyTea's $9 billion valuation at a July 2021 financing, while
      another data provider reports the underlying funding history differently and masks its
      displayed current valuation. The same provider's latest recorded revenue figure is
      $58 million in April 2018; that is historical revenue, not ARR or a current run rate.
      It cannot support a current revenue multiple. A data-provider peer list names listed
      companies such as Luckin Coffee, Master Kong, and China Mengniu alongside private
      food-service companies, but the accessible page does not establish a comparable
      valuation date, business mix, or normalized metric set. These are candidate reference
      names, not independent valuation benchmarks. Without a current HeyTea denominator and
      a date-matched, model-appropriate peer set, applying a multiple would create false
      precision. The evidence supports a diligence agenda, not a point estimate or range.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008]
  - id: scenarios-and-exit
    title: Scenarios, exit readiness, and diligence
    body: >-
      The bull case requires verified positive mature-store contribution, repeat demand, and
      profitable international expansion; none of the retained sources quantifies those
      inputs. The base case is continued brand and footprint activity with economics and
      financing terms unresolved. The bear case is that competition, weak store returns, or
      expansion capital needs compress value; the historical sector shock is a monitoring
      prompt rather than a current forecast. No probability or valuation range is assigned
      because current price, earnings, cash, debt, and comparable multiples are unavailable.
      The evidence also does not establish a current IPO plan, liquidity path, preference
      stack, or dilution exposure; a 2021 report about then-current listing intentions is
      stale for a 2026 exit decision. Before underwriting, request audited financials,
      cohort/store economics, the latest cap table and financing documents, and management's
      exit and capital plan. Revisit the recommendation only after these inputs can be
      reconciled to an actual entry price.
    claimRefs: [CV003, CV005, CV006, CV007, CV010, CV013, CV014]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision item, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite a buy without current economics and a current transaction price."]
      - [Confidence, low, "The public record is dated, incomplete, and inconsistent on financing history."]
      - [Risk rating, high, "Valuation, operating-economics, and capital-structure uncertainty are material."]
      - [Valuation stance, unknown, "The July 2021 mark is not a verified current entry valuation."]
    notes: >-
      Qualitative underwriting conclusion based on the cited public-source set; no current
      price, return target, or intrinsic valuation is available to calculate.
    claimRefs: [CV003, CV004, CV005, CV013]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence and limitation, What would change the view]
    rows:
      - ["Brand and reach", "2026 reporting describes international activity and 40-plus U.S. outlets; reach is not unit economics.", "Reconcile store counts and show repeat demand, same-store sales, and contribution margin."]
      - ["Expansion execution", "A New York Teabar opening and a limited collaboration are reported; no store-level returns are provided.", "Provide cohort-level launch costs, payback, and mature-store performance."]
      - ["Global scale", "Forbes and Adyen describe different global outlet/city counts without common definitions or as-of dates.", "Publish a dated, definition-consistent store and country breakdown."]
      - ["Historical financing mark", "Pandaily and Multiples associate approximately $9 billion with July 2021; neither establishes a current mark.", "Provide latest priced-round documents, ownership, and post-money valuation."]
      - ["Downside and competition", "TechNode describes a 2020 sector shock; it is historical context, not a current trading indicator.", "Show current price/margin response, closures, and downside-protection terms."]
      - ["Exit and dilution", "Current cap table, preferences, liquidity path, and exit plan are not established in the retained evidence.", "Review the fully diluted cap table, financing documents, and management exit plan."]
    notes: >-
      Historical transaction and outlet disclosures retain their source dates and qualifiers;
      no operating outcome is inferred from promotional reach.
    claimRefs: [CV001, CV002, CV003, CV009, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull, base, and bear underwriting cases
    columns: [Case, Explicit assumptions, Valuation and return logic, Probability signal and downside trigger]
    rows:
      - ["Bull", "Audited mature-store economics are positive; international growth is profitable; latest terms are reconciled.", "No range or target return assigned; a current denominator and entry price are absent.", "Unassigned; raise conviction only after audited unit economics and current financing documents."]
      - ["Base", "Brand and footprint activity continue, while profitability, cash needs, and ownership terms remain unverified.", "No supportable valuation range or multiple can be calculated from the retained evidence.", "Unassigned; maintain research-more until a date-matched operating and valuation bridge is available."]
      - ["Bear", "Store returns disappoint or competition and expansion costs require additional capital.", "Downside cannot be quantified without current cash, debt, earnings, dilution, and preference data.", "Unassigned; reassess on verified store losses, a down-round, or material restructuring."]
    notes: >-
      Scenarios are conditional underwriting tests, not forecasts. Probabilities, valuation
      ranges, and return targets are intentionally not estimated because source-backed inputs
      and a current entry price are missing.
    claimRefs: [CV003, CV005, CV006, CV007, CV010, CV013, CV014]
