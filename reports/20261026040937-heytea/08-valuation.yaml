callouts:
  - calloutType: recommendation
    title: Do not price from the 2021 mark
    body: >-
      Treat the approximately $9 billion July 2021 financing valuation as historical
      context only; require a current financing bridge and audited operating economics before
      setting an entry price or return target.
    claimRefs: [CV003, CV005, CV013]
  - calloutType: risk
    title: Scale is not profitability
    body: >-
      Reported store counts, product launches, and promotional reach do not establish
      same-store sales, store contribution, cash generation, or country-level returns.
    claimRefs: [CV001, CV002, CV009, CV011, CV012, CV013]
