  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Evidence and period, Likelihood, Potential impact, Mitigation maturity shown, Residual exposure, Unresolved diligence]
    rows:
      - [Perishable-input quality deterioration, "2025 study attributes quality deterioration to extended cross-regional logistics during expansion", Current frequency unknown, High product-quality and waste exposure, Current cold-chain and supplier controls not disclosed, High potential; unquantified, "Obtain temperature, spoilage, supplier-audit and corrective-action data by market"]
      - [Franchise training and service consistency, "Study reports 7 days of franchise training versus 21 days in company-operated stores; period and current practice are unclear", Current rate unknown, High brand and customer impact, Current training completion and audit evidence not disclosed, High potential; unquantified, "Review training curricula, completion rates and mystery-shop results by cohort"]
      - [Franchisee transaction and closure economics, "Study reports 350 daily transactions at new franchise outlets and a 28% closure rate; cohort denominator is not supplied", Current rate unknown, High unit-economics and network risk, No verified support or payback data reviewed, High potential; current level unknown, "Reconcile store-level sales, costs, payback and closure cohorts"]
      - [Overseas opening reliability, "Bamboo Works reports a London opening-day power failure and temporary closure in 2023", Recurrence unknown, Medium-to-high launch and customer impact, No continuity test or incident-response record reviewed, Historical event; current controls unknown, "Obtain overseas uptime, incident and response records by location"]
      - [Opening-day crowd management, "Allrecipes reports a queue up to three blocks long at a New York Teabar opening; no service failure is reported", Frequency unknown, Medium crowding and abandonment exposure, Queue throughput and crowd-control controls are not described, Demand signal only; impact unknown, "Review opening plans, wait-time data and crowd-management procedures"]
    notes: >-
      Historical figures and incidents are attributed to their sources and are not current
      operating KPIs. Qualitative impact reflects plausible consequences; no measured
      incidence, cohort denominator or control-effectiveness series is available.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR007, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration evidence, Failure scenario, Potential impact, Mitigation evidence, Residual exposure and diligence]
    rows:
      - [Payment technology, Adyen named by its own partner announcement, Provider is named but exclusivity and transaction share are not disclosed, Provider or local payment outage interrupts in-store or online transactions, Medium-to-high sales continuity risk, Announcement describes a unified commerce platform; tested alternative routing is not evidenced, "Obtain contract terms, service levels, country coverage and failover tests"]
      - [Franchise operating network, Franchisees and local store operators, Study and reporting describe franchise expansion but do not establish the current share of stores, Store exits or inconsistent execution weaken quality and unit economics, High potential network impact, Study reports training and quality concerns but current controls are not shown, "Obtain current franchise share, support obligations, closure cohorts and store economics"]
      - [Multi-market campaign execution, Celebrity collaboration and local operating teams, Forbes reports one limited campaign across 11 countries and regions; criticality is not established, "Inventory, rights or launch coordination failure could disrupt a campaign", Medium potential brand impact; no failure reported, Campaign announcement describes scope but not contingency controls, "Review rights, stock planning, country-level execution and campaign post-mortem"]
    notes: >-
      The Adyen item is partner-issued evidence, not independent benchmarking. Campaign
      activity is not evidence of customer or supplier concentration; contractual
      criticality, fallback readiness and market-level returns remain unknown.
    claimRefs: [CR010, CR011, CR012]
