chapter:
  number: 7
  title: Risks
  summary: >-
    The clearest risk evidence concerns operating control under franchise and overseas
    expansion: a 2025 secondary-data study reports quality, training and outlet-economics
    warning signs, while independent coverage documents a one-off 2023 London opening
    disruption. Current incidence rates, compliance status, audited store economics and
    resilience controls are not established, so severity ratings are qualitative exposure
    judgments rather than measured likelihoods.
sections:
  - id: risk-priorities
    title: Risk priorities and evidence limits
    body: >-
      The highest-priority exposure is the gap between store expansion and evidence of
      repeatable operating controls. A 2025 case study reports perishable-input quality,
      shortened franchisee training and outlet-economics warning signs, but it relies on
      second-hand data and acknowledges that it lacked proprietary operating data and
      primary stakeholder interviews. Separate reporting documents a single London
      opening-day disruption in 2023. These sources support diligence priorities, not a
      current incident rate or probability estimate. Food safety and franchise quality
      warrant high-impact monitoring; overseas launch and payment continuity warrant
      testing because current controls are not disclosed. The matrix summarizes qualitative
      residual exposure and does not represent measured scores or forecasts.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR007, CR010, CR013, CR015, CR016]
    figureRefs: [FR001]
  - id: legal-and-food-safety
    title: Legal, regulatory and food-safety exposure
    body: >-
      Publicly reported evidence is retrospective and incomplete. A 2025 research article
      attributes five non-compliant product batches, including four microbial
      contaminations, to a June 2020 Nanjing inspection; the underlying inspection record
      is not among the reviewed sources. A rediscovered Hexun archive has substantial
      character-encoding damage, so it cannot independently corroborate an incident.
      Mondaq describes a Singapore trademark invalidation matter, but its account gives
      inconsistent class details and does not establish the current registration or case
      status. No current country-by-country license register, inspection record,
      corrective-action closure, or open-case docket is available here. The table therefore
      separates historical reported matters from present-day unknowns rather than treating
      historical events as evidence of current non-compliance.
    claimRefs: [CR005, CR014, CR015]
    tableRefs: [TR001]
  - id: operating-quality
    title: Operational quality, franchisee viability and launch execution
    body: >-
      The operating-risk mechanism is that perishable inputs, training and local execution
      may not scale at the same pace as the store network. The 2025 study reports shorter
      training at franchise locations, lower daily transaction levels at new franchises and
      a 28% franchise closure rate; it does not provide a primary-data basis or a clear
      cohort denominator for those figures. Bamboo Works separately reports a power
      failure and temporary closure at a London opening in 2023, which is one historical
      event rather than evidence of a recurring failure rate. Allrecipes describes a
      three-block queue at a New York Teabar opening; that is a demand and crowd-management
      signal, not proof of service failure. Current audit exceptions, training completion,
      service reliability and store-level returns remain diligence requirements.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR007, CR008, CR009, CR013]
    tableRefs: [TR002]
  - id: partner-dependencies
    title: Partner dependencies and international execution
    body: >-
      A partner-issued announcement names Adyen as a payment-technology provider for
      in-store and online payments, but it does not disclose exclusivity, transaction share,
      contractual service levels, fallback routing or tested recovery. This is partner
      evidence, not independent assurance of control effectiveness. Company-issued
      material describes a Beverly Hills opening, while Forbes reports a time-bounded
      celebrity collaboration spanning multiple countries and regions. Those sources show
      cross-market activity but do not establish partner concentration or an actual
      campaign failure. Relevant scenarios include payment interruption, local payment
      incompatibility and launch coordination; their likelihood is unmeasured. Obtain
      contracts, market-level dependency maps and documented failover tests before treating
      the disclosed arrangements as resilient.
    claimRefs: [CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: financial-and-monitoring
    title: Financial uncertainty and thesis-break monitoring
    body: >-
      Historical study estimates on franchise transactions and closures are not audited
      store economics and cannot be converted into company revenue, ARR, cash burn or cash
      available. Neither the study nor the other reviewed sources supplies current
      store-level margins, franchisee payback cohorts, working-capital exposure or
      market-level contribution. Monitoring should begin with comparable store cohorts,
      inspection exceptions and remediation, franchisee exits and payback, training
      completion, service interruptions, and payment uptime. A sustained deterioration
      against management-verified baselines could break the operating thesis, but the
      evidence does not support numeric thresholds today. Diligence should establish
      denominators and thresholds before these indicators are used in an investment
      decision.
    claimRefs: [CR003, CR004, CR005, CR010, CR015, CR016]
