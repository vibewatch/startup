  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: franchise-economics
      missingEvidence: Current store-level sales, margins, rent, labor, waste, franchisee payback and closure cohorts by opening year, format and market.
      whyItMatters: Historical second-hand estimates cannot establish current profitability, franchisee viability or company cash exposure.
      diligencePath: Request reconciled store-cohort P&Ls, franchisee returns and closure history, then sample against operator and landlord records.
      relatedQuestionRefs: [QR007]
      relatedTableRefs: [TR002, TR003]
    - type: missing-source
      severity: material
      topic: regulatory-status
      missingEvidence: Current permits, inspection notices, corrective-action closure records, trademark registrations and open disputes by country.
      whyItMatters: Historical legal and food-safety reporting does not establish current compliance or remediation effectiveness.
      diligencePath: Obtain a jurisdiction-by-jurisdiction compliance register, regulator correspondence, trademark schedule and outside-counsel docket search.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
    - type: access-blocked
      severity: material
      topic: historical-food-safety
      missingEvidence: A readable copy of the original Hexun article or the underlying inspection record; the refreshed archive text has severe character-encoding damage.
      whyItMatters: The archived article cannot reliably corroborate a historical food-safety event in its fetched form.
      diligencePath: Obtain a readable original-language article or primary municipal inspection notice and verify its date, company identity and disposition.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
