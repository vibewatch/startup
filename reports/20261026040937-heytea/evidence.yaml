evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financials-and-ownership
    missingEvidence: >-
      Current total funding, latest valuation and cap table; audited revenue with period and revenue-versus-ARR
      definition; EBITDA, cash, debt, capex, headcount, customer/member metrics and mature-store economics.
    whyItMatters: >-
      Conflicting historical funding totals and ambiguous historical revenue labels cannot establish current liquidity,
      profitability, valuation support, dilution or store returns.
    diligencePath: >-
      Obtain executed financing documents, the current cap table and investor-rights schedule, audited statements,
      debt/cash schedules, metric definitions and store-cohort contribution data.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Current founder role, full C-suite and board roster, reporting lines, beneficial ownership, voting/reserved-matter
      rights and key-person succession arrangements.
    whyItMatters: >-
      Selected overseas brand titles and a founder reference do not establish who controls the company or how decision
      authority and succession risk are managed.
    diligencePath: >-
      Request the current organization chart, board roster and charter, constitutional documents, founder and investor
      rights, and succession/retention arrangements.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: historical-funding
    missingEvidence: >-
      Round-by-round amounts, dates, currencies, pre/post-money values and investor participation sufficient to
      reconcile the Bamboo Works and Multiples.vc histories.
    whyItMatters: >-
      Without a primary-source reconciliation, total raised, dilution and the valuation trajectory cannot be used as a
      current ownership or financing baseline.
    diligencePath: >-
      Reconcile executed round documents and cap-table changes with the company and named investors; preserve each
      round's currency and valuation basis.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-store-count
    missingEvidence: >-
      A same-date store roster with active/open status, company-operated versus partner-operated definitions, and
      country-level coverage.
    whyItMatters: >-
      The 2026 media reports and undated partner announcement use different dates and scopes, so a precise current count
      or growth rate cannot be inferred.
    diligencePath: >-
      Request a dated store master and reconcile active, temporarily closed, partner-operated and concept-store
      locations by market.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A market study that defines freshly prepared tea separately from RTD, packaged, traditional loose-leaf, and
      health-tea categories, and reconciles the materially different published estimates.
    whyItMatters: >-
      Without a common category, period, and disclosed sizing method, broad tea totals can materially overstate or
      understate HeyTea's addressable market.
    diligencePath: >-
      Obtain the full source methodologies from iiMedia and Daxue or commission a China category study with explicit
      fresh-prepared, premium, city-tier, and channel definitions.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Current HeyTea transaction-level frequency, average spend, repeat rates, price elasticity, and segment-level
      customer cohorts across China and overseas markets.
    whyItMatters: >-
      Category-level health or youth preferences do not establish conversion, retention, or willingness-to-pay for
      HeyTea.
    diligencePath: >-
      Request anonymized customer cohort and transaction data split by market, store format, price tier, and acquisition
      channel, with a consistent measurement period.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: heytea-sam-som
    missingEvidence: >-
      Store-level and franchise-cohort economics plus city-level demand and competitor coverage needed to estimate
      reachable and capturable spend.
    whyItMatters: >-
      Store counts and event attention do not establish sustainable local sales, franchisee returns, or a serviceable
      share.
    diligencePath: >-
      Request mature-store sales and margins, franchisee economics, closures, same-store trends, and market-level sales
      for China and overseas cohorts.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: competitor-pricing-and-economics
    missingEvidence: >-
      Current like-for-like menu prices, realized discounting, franchise economics, and comparable store-level margins
      for HeyTea and its direct rivals.
    whyItMatters: >-
      Directional labels such as low-cost and premium do not establish realized price gaps, unit economics, or whether
      HeyTea can defend margins as it broadens access.
    diligencePath: >-
      Collect dated menus and promotion terms in matched cities, then request store-level sales, cost, and franchisee
      settlement data for HeyTea and named competitors.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Customer cohort retention, switching, multi-homing, loyalty usage, and franchisee or supplier lock-in evidence by
      market.
    whyItMatters: >-
      Brand awareness, outlet growth, and a payment partnership do not prove repeat behavior, switching costs, or
      durable bargaining power.
    diligencePath: >-
      Review anonymized cohort and loyalty data, customer research, franchise agreements, supplier terms, and
      quality-control audits across mature and new markets.
    relatedQuestionRefs:
      - QP008
      - QP005
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-statements
    missingEvidence: >-
      Current audited or management-prepared income statements, balance sheets, and cash-flow statements, including
      channel revenue, cash, debt, leases, capex, and working capital.
    whyItMatters: >-
      Without current statements, historical revenue and funding records cannot establish earnings quality, liquidity,
      operating leverage, or ability to finance expansion.
    diligencePath: >-
      Request monthly management accounts and audited annual statements for the last three fiscal years, plus current
      cash, debt, lease, and capex schedules.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: store-and-channel-unit-economics
    missingEvidence: >-
      Current store cohorts with realized prices, order values, discounts, COGS, labor, occupancy, delivery commissions,
      opening investment, and country-level contribution.
    whyItMatters: >-
      Historical order counts and margin estimates do not reveal payback, mature-store productivity, promotion
      profitability, or overseas returns.
    diligencePath: >-
      Request monthly new- and mature-store cohorts by market with transactions, net sales, discount funding, product
      costs, labor, occupancy, fees, capex, and closure history.
