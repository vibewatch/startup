  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public engineering surface or credible practitioner-community proxy such as technical talks, public engineer
      recruiting, industry-forum discussion, or integration-partner technical material.
    whyItMatters: >-
      HEYTEA is a consumer beverage and retail business with no obvious public code or package surface; the assigned
      pool contains no credible practitioner proxy, so engineering activity and integration quality cannot be
