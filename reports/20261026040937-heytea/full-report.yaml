              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, regulatory and food-safety exposure
        blocks:
          - type: paragraph
            body: >-
              Publicly reported evidence is retrospective and incomplete. A 2025 research article attributes five
              non-compliant product batches, including four microbial contaminations, to a June 2020 Nanjing inspection;
              the underlying inspection record is not among the reviewed sources. A rediscovered Hexun archive has
              substantial character-encoding damage, so it cannot independently corroborate an incident. Mondaq
              describes a Singapore trademark invalidation matter, but its account gives inconsistent class details and
              does not establish the current registration or case status. No current country-by-country license
              register, inspection record, corrective-action closure, or open-case docket is available here. The table
              therefore separates historical reported matters from present-day unknowns rather than treating historical
              events as evidence of current non-compliance.
            claimRefs:
              - CR005
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR014
              - CR015
      - number: '7.3'
        title: Operational quality, franchisee viability and launch execution
        blocks:
          - type: paragraph
            body: >-
              The operating-risk mechanism is that perishable inputs, training and local execution may not scale at the
              same pace as the store network. The 2025 study reports shorter training at franchise locations, lower
              daily transaction levels at new franchises and a 28% franchise closure rate; it does not provide a
              primary-data basis or a clear cohort denominator for those figures. Bamboo Works separately reports a
              power failure and temporary closure at a London opening in 2023, which is one historical event rather than
              evidence of a recurring failure rate. Allrecipes describes a three-block queue at a New York Teabar
              opening; that is a demand and crowd-management signal, not proof of service failure. Current audit
              exceptions, training completion, service reliability and store-level returns remain diligence
              requirements.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR013
      - number: '7.4'
        title: Partner dependencies and international execution
        blocks:
          - type: paragraph
            body: >-
              A partner-issued announcement names Adyen as a payment-technology provider for in-store and online
              payments, but it does not disclose exclusivity, transaction share, contractual service levels, fallback
              routing or tested recovery. This is partner evidence, not independent assurance of control effectiveness.
              Company-issued material describes a Beverly Hills opening, while Forbes reports a time-bounded celebrity
              collaboration spanning multiple countries and regions. Those sources show cross-market activity but do not
              establish partner concentration or an actual campaign failure. Relevant scenarios include payment
              interruption, local payment incompatibility and launch coordination; their likelihood is unmeasured.
              Obtain contracts, market-level dependency maps and documented failover tests before treating the disclosed
              arrangements as resilient.
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Financial uncertainty and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              Historical study estimates on franchise transactions and closures are not audited store economics and
              cannot be converted into company revenue, ARR, cash burn or cash available. Neither the study nor the
              other reviewed sources supplies current store-level margins, franchisee payback cohorts, working-capital
              exposure or market-level contribution. Monitoring should begin with comparable store cohorts, inspection
              exceptions and remediation, franchisee exits and payback, training completion, service interruptions, and
              payment uptime. A sustained deterioration against management-verified baselines could break the operating
              thesis, but the evidence does not support numeric thresholds today. Diligence should establish
              denominators and thresholds before these indicators are used in an investment decision.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive decision
        blocks:
          - type: paragraph
            body: >-
              The investment decision is research-more, with low confidence in any price conclusion and high diligence
              risk from private-company opacity. Public reporting describes a substantial international footprint and
              ongoing U.S. product and store activity, but those are reach and marketing signals rather than proof of
              store-level profitability, repeat purchase, or cash generation. The strongest disclosed valuation point in
              this evidence set is a July 2021 financing mark of about $9 billion; it is not a current entry price. The
              accessible sources also disagree on financing totals and round counts, and do not supply an audited
              current revenue base, EBITDA, debt, or cap table. Until those inputs and current financing terms are
              reconciled, neither an attractive nor an expensive current multiple can be calculated. A valuation stance
              of unknown is more defensible than carrying forward an old mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV013
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that a differentiated tea brand can translate product innovation, international
              distribution, and destination-store concepts into durable demand. Recent reporting describes more than 40
              U.S. outlets, a New York concept-store opening, and limited product collaborations; separate sources
              report a large global footprint. These disclosures support market presence, not customer economics. The
              anti-thesis is that visibility and store count may overstate value if mature-store sales, contribution
              margins, payback periods, and international cohort economics are weak or capital intensive. The global
              store counts differ across sources and have no common as-of date or stated definition. A 2020 report also
              described a sector-wide business decline during COVID-19; that is historical downside context, not
              evidence of current performance. Evidence that would change the view is audited store-level performance
              plus independently reconciled current financing and ownership terms.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Valuation evidence and comparable set
        blocks:
          - type: paragraph
            body: >-
              Public sources place HeyTea's $9 billion valuation at a July 2021 financing, while another data provider
              reports the underlying funding history differently and masks its displayed current valuation. The same
              provider's latest recorded revenue figure is $58 million in April 2018; that is historical revenue, not
              ARR or a current run rate. It cannot support a current revenue multiple. A data-provider peer list names
              listed companies such as Luckin Coffee, Master Kong, and China Mengniu alongside private food-service
              companies, but the accessible page does not establish a comparable valuation date, business mix, or
              normalized metric set. These are candidate reference names, not independent valuation benchmarks. Without
              a current HeyTea denominator and a date-matched, model-appropriate peer set, applying a multiple would
              create false precision. The evidence supports a diligence agenda, not a point estimate or range.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.4'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              The bull case requires verified positive mature-store contribution, repeat demand, and profitable
              international expansion; none of the retained sources quantifies those inputs. The base case is continued
              brand and footprint activity with economics and financing terms unresolved. The bear case is that
              competition, weak store returns, or expansion capital needs compress value; the historical sector shock is
              a monitoring prompt rather than a current forecast. No probability or valuation range is assigned because
              current price, earnings, cash, debt, and comparable multiples are unavailable. The evidence also does not
              establish a current IPO plan, liquidity path, preference stack, or dilution exposure; a 2021 report about
              then-current listing intentions is stale for a 2026 exit decision. Before underwriting, request audited
              financials, cohort/store economics, the latest cap table and financing documents, and management's exit
              and capital plan. Revisit the recommendation only after these inputs can be reconciled to an actual entry
              price.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not price from the 2021 mark
            body: >-
              Treat the approximately $9 billion July 2021 financing valuation as historical context only; require a
              current financing bridge and audited operating economics before setting an entry price or return target.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV013
          - type: callout
            title: Scale is not profitability
            body: >-
              Reported store counts, product launches, and promotional reach do not establish same-store sales, store
              contribution, cash generation, or country-level returns.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV011
              - CV012
              - CV013
