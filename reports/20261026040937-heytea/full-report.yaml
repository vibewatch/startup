        title: Economics, adverse signals and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not establish current revenue or ARR, EBITDA, cash, debt, capex, headcount,
              customer or member counts, mature-store economics, or a current valuation. Multiples.vc lists US$58
