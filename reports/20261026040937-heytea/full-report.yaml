            - Limited-edition collaboration coverage
          tone: neutral
        - label: Consider
          actor: Tea and novelty seeker
          stage: Evaluate the product and location
          touchpoints:
            - Cheese tea and concept-store formats described in reporting
            - No representative preference survey in the retained sources
          tone: neutral
        - label: Visit
          actor: Store visitor
          stage: Trial at a physical location
          touchpoints:
            - New York opening queues reported in 2023 and 2026
            - Queue length does not equal completed orders
          tone: positive
        - label: Order
          actor: Consumer / payer
          stage: Purchase in store or reported app pre-order
          touchpoints:
            - New York Magazine reports fans found app pre-order easy
            - Digital share claims from low-reputation marketing pages are unverified
          tone: neutral
