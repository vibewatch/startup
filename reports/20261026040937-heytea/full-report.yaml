  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence and limitation
      - What would change the view
    rows:
      - - Brand and reach
        - 2026 reporting describes international activity and 40-plus U.S. outlets; reach is not unit economics.
        - Reconcile store counts and show repeat demand, same-store sales, and contribution margin.
      - - Expansion execution
        - A New York Teabar opening and a limited collaboration are reported; no store-level returns are provided.
        - Provide cohort-level launch costs, payback, and mature-store performance.
      - - Global scale
        - Forbes and Adyen describe different global outlet/city counts without common definitions or as-of dates.
        - Publish a dated, definition-consistent store and country breakdown.
      - - Historical financing mark
        - Pandaily and Multiples associate approximately $9 billion with July 2021; neither establishes a current mark.
        - Provide latest priced-round documents, ownership, and post-money valuation.
      - - Downside and competition
        - TechNode describes a 2020 sector shock; it is historical context, not a current trading indicator.
        - Show current price/margin response, closures, and downside-protection terms.
      - - Exit and dilution
        - Current cap table, preferences, liquidity path, and exit plan are not established in the retained evidence.
        - Review the fully diluted cap table, financing documents, and management exit plan.
    notes: >-
      Historical transaction and outlet disclosures retain their source dates and qualifiers; no operating outcome is
      inferred from promotional reach.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull, base, and bear underwriting cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Audited mature-store economics are positive; international growth is profitable; latest terms are reconciled.
        - No range or target return assigned; a current denominator and entry price are absent.
        - Unassigned; raise conviction only after audited unit economics and current financing documents.
      - - Base
        - Brand and footprint activity continue, while profitability, cash needs, and ownership terms remain unverified.
        - No supportable valuation range or multiple can be calculated from the retained evidence.
        - Unassigned; maintain research-more until a date-matched operating and valuation bridge is available.
      - - Bear
        - Store returns disappoint or competition and expansion costs require additional capital.
        - Downside cannot be quantified without current cash, debt, earnings, dilution, and preference data.
        - Unassigned; reassess on verified store losses, a down-round, or material restructuring.
    notes: >-
      Scenarios are conditional underwriting tests, not forecasts. Probabilities, valuation ranges, and return targets
      are intentionally not estimated because source-backed inputs and a current entry price are missing.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV010
      - CV013
      - CV014
