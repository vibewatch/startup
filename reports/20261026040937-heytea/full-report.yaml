          actor: Customer and social audience
          stage: Post-purchase social sharing
          touchpoints:
            - Named Beijing interviewees described posting drink photographs
            - Interview evidence is historical and selective
          tone: positive
        - label: Repeat
          actor: Existing customer
          stage: Retention and expansion
          touchpoints:
