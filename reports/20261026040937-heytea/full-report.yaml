  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: A narrow core inside a much larger tea landscape
        blocks:
          - type: paragraph
            body: >-
              The valuation-relevant core is freshly prepared new-style tea: brewed tea combined with ingredients such
              as fruit or dairy, sold as a single-serve beverage. Daxue Consulting uses this definition for its “new
              Chinese-style tea” segment; HeyTea's brand is associated with that product format. This boundary excludes
              traditional loose-leaf tea, tea bags, and packaged ready-to-drink (RTD) tea from the core, while treating
              them as adjacent substitutes for occasions and spend. iiMedia's broader tea-beverage coverage includes
              packaged drinks and retail channels, so its headline “new-style tea drink” estimate cannot be assumed to
              measure the same freshly prepared market. Coffee and lower-priced tea chains are also consumer
              alternatives, but the assigned sources do not establish their share of HeyTea's addressable spend.
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: Multiple estimates describe different, unreconciled markets
        blocks:
          - type: paragraph
            body: >-
              The available estimates do not converge on one market denominator. Daxue Consulting values China's freshly
              prepared new Chinese-style tea segment at USD 6.75 billion in 2025 and forecasts 14.5% CAGR through 2033,
              but the extracted page does not disclose its sizing method. iiMedia reports RMB 333.38 billion for China's
              “new-style tea drink” market in 2023 and forecasts RMB 374.93 billion for 2025; its report spans a wider
              tea-beverage landscape, and the extract does not explain whether those figures isolate store-prepared
              drinks. Daxue separately values traditional tea, including loose-leaf and teabags, at USD 18.38 billion in
              2025. GlobalData's much older hot-tea series and forecasts are historical context, not a current market
              baseline. These values use different labels, periods, currencies, and likely boundaries; they must not be
              added or presented as a TAM/SAM/SOM progression. There is no sourced bridge from category spend to
              HeyTea's reachable geographies, customer frequency, or share.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM015
      - number: '2.3'
        title: Consumer occasions, budgets, and adoption triggers
        blocks:
          - type: paragraph
            body: >-
              The immediate buyer, user, and payer for a made-to-order tea is generally the individual consumer; none of
              the assigned evidence identifies a separate institutional budget owner. The evidence instead points to
              distinct consumer choices: premium urban buyers attracted to novel ingredients and brand experience, more
              price-sensitive customers who can trade down to sub-RMB-20 drinks, and experience-led buyers responding to
              store concepts or limited releases. Daxue describes younger consumers as seeking social, cultural, and
              wellness value, and cites a 2025 iiMedia finding that 78.3% pay attention to “real fruit” and “low sugar”
              labels. That is category-level preference evidence, not a HeyTea conversion or repeat-purchase measure. A
              New York concept-store opening and its reported queues show event-level attention, not sustained demand.
              Packaged tea and traditional tea remain at-home alternatives; actual spend, purchase frequency, and
              willingness-to-pay by segment are not established.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers are counterweighted by price and execution risk
        blocks:
          - type: paragraph
            body: >-
              Product novelty, social discovery, and health-oriented positioning can bring consumers into the category,
              but they do not remove the economics of discretionary drink purchases. Historical reporting described a
              concentrated high-end segment, a reported RMB 29 average HeyTea drink price, and consumer resistance above
              RMB 30; these are dated reference points, not current price elasticity. More recent expert commentary
              frames discounting and franchising as attempts to broaden reach, while warning that consistency and
              premium perception can suffer. This creates a valuation trade-off: lower price points and partner-led
              rollout may expand access, but growth in outlets is not evidence of profitable consumer demand. The
              retrieved sources do not quantify current same-store sales, cohort retention, store-level margins, or how
              domestic and overseas buyers differ. Until those measures and the market definitions are reconciled,
              adoption should be underwritten as a scenario, not as a precise top-down share of a broad tea-market
              estimate.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Published market totals are not interchangeable
            body: >-
              The RMB 374.93bn 2025 forecast and USD 6.75bn 2025 estimate use labels whose category boundaries and
              methods are not reconciled. Neither is a defensible HeyTea-specific TAM without a fresh-prepared market
              bridge.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM008
          - type: callout
            title: Premium reach depends on holding value perception
            body: >-
              Historical price-sensitivity evidence and recent expert commentary make customer willingness-to-pay and
              quality consistency central adoption risks as HeyTea broadens price points and store access.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded field with unevenly disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The available evidence places HeyTea between premium positioning and mass-market access rather than in a
              stable price niche. Campaign Asia reported that the brand had more than 4,000 stores across eight
              countries by 2025, while its expert sources described franchising and price cuts as a response to
              lower-cost rivals such as Mixue. The same article says HeyTea introduced a lower-priced Mini sub-brand and
              had more than 100 overseas stores. These are dated publisher reports, not audited store disclosures, and
              the number of stores alone does not establish sales, profitability, or comparable unit economics.

              The competitor set spans direct tea chains (including CHAGEE, Mixue, GoodMe, ChaPanda, Auntea Jenny, and
              Nayuki), international bubble-tea brands such as CoCo and Gong Cha, coffee chains adding tea or
              refreshment occasions, and consumer substitutes that remain unquantified in the retained sources. World
              Coffee Portal's July 2024 article reports outlet counts for five chains; Campaign Asia's January 2026
              article gives a later HeyTea figure. The bar exhibit preserves these source vintages and thresholds. It is
              a scale signal, not a same-date market-share comparison or an exhaustive census.
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: Brand-led differentiation meets price pressure
        blocks:
          - type: paragraph
            body: >-
              HeyTea's strongest documented differentiators are product innovation, brand experience, and international
              localization. Campaign Asia's interviewees describe cheese tea as an industry-shaping product but warn
              that copycats and category homogenization weakened its distinctiveness. The article also describes a
              premium brand moving toward accessible pricing, with experts arguing that repeated discounting risks
              eroding perceived quality and status. Those are expert assessments, not consumer-panel measurements or an
              independently audited quality record. A separate company-originated FoodTalks release claims rapid U.S.
              and overseas expansion; it is useful for the company's stated channel strategy, not independent
              confirmation of demand.

              The sources do not provide a like-for-like menu price list, realized discounts, franchise economics,
              customer acquisition cost, repeat rate, or switching data for HeyTea and its rivals. Mixue is described as
              a low-cost competitor, while CHAGEE is positioned as premium in its own company description; these
              directional labels do not establish price gaps. Buyers can compare taste, convenience, location,
              promotions, and store experience, but the retained evidence does not establish the weight of each
              criterion or whether customers multi-home. The tables therefore separate documented signals from
              unsupported comparison cells.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP015
      - number: '3.3'
        title: Distribution is an advantage only if execution holds
        blocks:
          - type: paragraph
            body: >-
              A broad footprint and localized product launches can increase visibility and create more occasions to try
              the brand, but neither proves durable lock-in. Adyen's partner-issued announcement says it provides HeyTea
              with global acquiring and unified-commerce capabilities for in-store and online payments; the announcement
              does not quantify lower transaction costs, conversion gains, or customer retention. A company-issued
              announcement distributed through Nasdaq confirms that CHAGEE filed a 2025 Form 20-F in April 2026, giving
              investors a public disclosure reference point that is not available in the fetched HeyTea sources; the
              retrieved announcement does not contain the filing's financial detail.

              Competitive durability therefore remains conditional. Campaign Asia reports expert concerns about store
              clustering and inconsistent quality after HeyTea's earlier expansion and price moves, while its sources
              also describe a strategic reset toward brand differentiation. An uncited SWOT-template page names
              competition from Nayuki, Mixue, and imitators, but supplies no sourcing method; it is treated only as a
              weak signal and not as an independent benchmark. The evidence does not resolve franchisee economics,
              supplier access on rival terms, customer switching, regulatory comparisons, or current store-level
              returns. Diligence should obtain matched market-by-market price and retention data, store-level cohorts,
              franchise controls, and quality records before assigning a durable moat premium.
            claimRefs:
              - CP013
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Product sales are visible; current revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Multiples categorizes HeyTea's model as B2C product sales, not subscription revenue or a software take
              rate [CI001]. Its page labels $58 million as the latest recorded revenue in April 2018, while also listing
              $58 million for April 2017; neither entry establishes current revenue, ARR, or a growth rate [CI002]. A
              2019 WeChat mini-app user count and a 2018 delivery-order anecdote add dated activity signals, but neither
              is a count of active paying customers or a current sales measure [CI008, CI014]. The reviewed pages do not
              break revenue out by country, SKU, order channel, or company-operated versus partner-operated store, and
              they do not explain recognition or discount treatment. That limits conclusions about revenue mix, repeat
              purchase quality, and net sales even though the underlying unit of sale is straightforward.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI012
      - number: '4.2'
        title: Price points and channel anecdotes do not establish realized economics
        blocks:
          - type: paragraph
            body: >-
              Pricing observations are heterogeneous in period, geography, and product. Bamboo Works reported that in
              January 2022 HeyTea cut selected drink prices by about RMB 1-5, including Pure Green Tea to RMB 9, and
              cited a separate RMB 29 average drink price from Haitong Securities [CI003, CI004]. A 2026 collaboration
              article describes a US merchandise add-on priced at $3.99, not a standard drink price [CI012]. These are
              reported price or promotion terms, not a comparable realized-price series: no source here quantifies
              redemption, discount funding, net sales, or sales lift. The 2018 investor-interview account gives a
              single-store monthly delivery-order range, but not basket value, platform fees, or current channel mix
              [CI008]. An unofficial franchise guide also gives specific investment and royalty amounts, while an older
              company statement described direct management and no franchising; the guide does not expose an
              identifiable filing, so those terms should not be used as verified current economics [CI009, CI010,
              CI011].
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Margin and store-level returns remain unverified
        blocks:
          - type: paragraph
            body: >-
              The available margin evidence is a historical securities estimate reproduced by Bamboo Works: Guosen
              Securities estimated HeyTea gross margin at 65%-70%, versus about 53% for the industry, in a January 2022
              analysis [CI005]. That article also described rising raw-material costs and high rent and labor costs
              across the category [CI006]. It provides no calculation, accounting definition, period reconciliation, or
              store-level margin bridge. The same report's description of price reductions does not quantify any
              resulting change in volume, realized margin, or profit [CI007]. Accordingly, the estimate cannot support a
              current margin forecast or be translated into cash generation. Current ingredient and packaging costs,
              labor, occupancy, delivery economics, opening capex, and mature-store cohorts are needed to test whether
              revenue growth converts into store contribution. The figure shows this evidence boundary without assigning
              unsupported values.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI008
              - CI016
      - number: '4.4'
        title: Historical funding and store activity do not prove capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public activity signals are not a substitute for an underwriteable store model. Allrecipes reported a
              three-block line at the New York Teabar opening and described more than 3,500 global locations, while
              TechNode's 2020 report gave a 2019 WeChat mini-app user count; these measures show reported reach, not
              current paid demand or profitability [CI013, CI014]. Caplight's public page identifies July 13, 2021 as
              the last round in its displayed record but exposes no amount or valuation in the visible fields [CI015].
              Multiples and Caplight do not show a current cash balance, debt, burn, capex, working capital, or runway
              for HeyTea in their fetched pages [CI016]. These page-specific omissions do not prove that the company has
              no such resources; they mean this evidence set cannot assess liquidity, financing dependency, or a
              next-round trigger. The financial verdict is therefore that product-sales revenue is plausible but
              earnings quality, capital intensity, and cash conversion remain unproven pending current statements and
              store cohorts.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital adequacy remains unproven
            body: >-
              The reviewed public pages do not permit a current liquidity or store-return calculation; historical
              financing activity must not be treated as cash still available.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Beverage proposition: recipe and experience, not a disclosed technical moat'
        blocks:
          - type: paragraph
            body: >-
              HEYTEA’s core offer is a tea-based beverage assortment built around cheese tea and fruit teas; the
              company’s own brand page describes real tea, real milk, and natural ingredients as its product
              proposition, not as independently audited quality results (CE001, CE002). Its public product examples
              range from Cloud Mango and Grape Boom to brown-sugar boba and newer matcha or fruit combinations (CE003,
              CE004). That breadth supports a recognizable recipe-development and merchandising capability, but the
              available sources do not disclose formulation specifications, ingredient sourcing controls, recipe
              versioning, or a protected technical process. The evidence therefore supports a product-design thesis, not
              a defensible claim of proprietary beverage technology.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE008
              - CE009
              - CE014
      - number: '5.2'
        title: Menu and store formats create different customer jobs
        blocks:
          - type: paragraph
            body: >-
              HEYTEA serves a routine takeaway beverage job as well as a more exploratory, sit-and-stay experience.
              Allrecipes describes the New York Teabar as offering brewed Pot Tea, Deep Matcha, tea ice cream, and more
              than two dozen menu items and products newly introduced to the U.S. (CE004, CE005). A 2026 Forbes report
              describes a limited-run Mango Coconut Sticky Rice drink assembled from Thai sticky rice, mango, and
              coconut-milk slush, with merchandise and country-specific availability; the article reported the planned
              October 15 start, not post-launch sales or retention (CE006). These examples indicate menu and format
              variation, but no comparable customer outcome, repeat rate, or incremental basket metric is disclosed.
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
      - number: '5.3'
        title: Store and ordering model is visible; systems architecture is not
        blocks:
          - type: paragraph
            body: >-
              Historical coverage shows that HEYTEA has experimented with distinct operating formats rather than relying
              only on a uniform storefront. A 2018 Wuhan Business Observer account enumerated Lab, Go, Pink, DP, and
              Black Gold concepts; a 2019 Wikipedia profile separately described Go as a small store linked to app
              ordering (CE007, CE008). A 2024 case study describes QR-based access to the HEYTEA GO mini-program and
              dedicated Quick Sales stores, but does not establish that those capabilities remain current or quantify
              queue reduction (CE009). The assigned sources do not document present-day integrations, payment or data
              architecture, service-level performance, support processes, privacy controls, or engineering activity.
              Treat the public operating picture as partial and dated.
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE010
              - CE013
      - number: '5.4'
        title: Brand-led differentiation leaves execution and control questions open
        blocks:
          - type: paragraph
            body: >-
              Product differentiation is clearest in the combination of recipe iteration, designed retail experiences,
              and outside-brand collaborations. Daxue Consulting reports more than 110 co-branding partnerships by
              December 2023 and criticism of a 2023 religious-themed packaging collaboration; Hypebeast’s 2020 account
              documents a beverage-inspired HEYTEA–adidas shoe collaboration (CE011, CE012, CE014). Daxue also reported
              a September 2023 milk product claim of 3.8 g protein per 100 mL, which is an attributed company-related
              specification rather than an independent laboratory result (CE010). Separately, Wikipedia recounts
              food-hygiene incidents in 2018–19, including store closures; this is historical adverse reporting, not
              evidence of current incident frequency or the absence of subsequent controls (CE013). Current safety,
              traceability, privacy, and reliability evidence is a material diligence gap.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Reported footprint and launch demand are not retention
        blocks:
          - type: paragraph
            body: >-
              Forbes and Allrecipes each reported more than 3,500 HeyTea locations worldwide in 2026, while Forbes also
              put the footprint across more than 330 cities. Those are reported store counts, not active customers,
              visits, or revenue-producing stores; the articles do not provide a reconciliation or same-store activity
              denominator. Separate coverage recorded queues at New York openings in 2023 and 2026, and Forbes described
              a LISA collaboration planned across 11 countries and regions. These observations support reach and
              event-led trial, but neither queue length nor a launch footprint establishes conversion, repeat purchase,
              or local profitability. The available public evidence therefore supports a credible demand signal, not a
              measured adoption curve.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU007
      - number: '6.2'
        title: Visible users skew toward urban novelty and social experiences
        blocks:
          - type: paragraph
            body: >-
              The strongest direct customer evidence in the assigned sources is qualitative: a historical Beijing field
              report names young consumers who tried cheese tea and discussed posting photographs, while New York
              Magazine later described teens and people in their early twenties queuing for HeyTea. These are observed
              segments in particular places and moments, not a representative customer survey. Current reporting also
              describes a New York concept store with expanded tea formats and a limited-edition collaboration,
              suggesting occasions built around exploration and fandom. The reviewed sources do not identify a distinct
              payer separate from the consumer, quantify segment sizes, or connect a segment to spend. The segmentation
              below is consequently a sample of observed use cases, not a market-wide profile.
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU011
              - CU013
      - number: '6.3'
        title: Digital ordering appears to reduce friction, but evidence is thin
        blocks:
          - type: paragraph
            body: >-
              The customer journey described by the sources begins with social discovery, product novelty, or a
              collaboration, then moves to a store visit or a reported digital pre-order. New York Magazine says fans
              told its writer that ordering ahead through HeyTea's app was easy; two low-reputation marketing pages also
              describe WeChat mini-program and app ordering. Those latter pages make precise transaction-share and
              membership claims without a cited dataset, so they are not used as verified adoption metrics. The path
              from first purchase to repeat behavior remains unmeasured in this evidence set: there are no cohort,
              churn, frequency, or renewal figures. The journey figure marks repeat use as an open diligence point
              rather than implying a proven retention loop.
            claimRefs:
              - CU012
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Product excitement coexists with service and durability questions
        blocks:
          - type: paragraph
            body: >-
              A Vice field report captured both the social reward and the limits of launch-driven demand: interviewees
              described posting their drinks, but one customer said the taste was not particularly impressive. The same
              historical report recounted queues lasting hours, including a longer wait attributed to a company
              publicist; New York reporting later described waits that could reach an hour in the city. Daxue Consulting
              also documented consumer criticism of two past collaborations, including an apology after a controversial
              social post. These are specific episodes, not evidence of current widespread dissatisfaction. More
              importantly, the sources do not show whether queues persisted after launch peaks or whether customers
              returned after trial. Investors should treat retention and concentration as private diligence
              requirements, not infer them from viral moments.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU013
      - number: '6.5'
        title: Retention, concentration, and customer economics remain unverified
        blocks:
          - type: paragraph
            body: >-
              None of the retained public sources supplies an auditable active-customer count, repeat-purchase cohort,
              churn or retention rate, order frequency, or store-level customer economics. Reported locations and
              limited-time campaign reach cannot substitute for those measures, and the historical customer interviews
              cannot establish representativeness. The evidence also does not allocate demand or sales across
              company-operated stores, franchise locations, delivery platforms, or geographies, so customer and channel
              concentration remain unknown. A diligence process should request dated cohort tables linked to paid
              orders, comparable store cohorts, channel and geography splits, and the underlying customer definitions.
              Until those are reconciled to audited operating data, customer durability remains an unresolved valuation
              input.
            claimRefs:
              - CU001
              - CU006
              - CU015
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Store footprint is not proof of customer durability
            body: >-
              The reported 3,500-plus locations and launch queues demonstrate reach and episodic interest, but public
              evidence does not reveal active buyers, repeat rates, or concentration by geography and channel.
            calloutType: risk
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The highest-priority exposure is the gap between store expansion and evidence of repeatable operating
              controls. A 2025 case study reports perishable-input quality, shortened franchisee training and
              outlet-economics warning signs, but it relies on second-hand data and acknowledges that it lacked
              proprietary operating data and primary stakeholder interviews. Separate reporting documents a single
              London opening-day disruption in 2023. These sources support diligence priorities, not a current incident
              rate or probability estimate. Food safety and franchise quality warrant high-impact monitoring; overseas
              launch and payment continuity warrant testing because current controls are not disclosed. The matrix
              summarizes qualitative residual exposure and does not represent measured scores or forecasts.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR010
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
