    notes: >-
      Partial public-source snapshot. Historical and guide-reported figures are not current audited
      results; no comparable value means the reviewed evidence did not establish one.
    claimRefs: [CI001, CI002, CI008, CI009, CI010, CI012]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or offer, Reported amount, Period and source, Interpretation, Diligence ask]
    rows:
      - ["Selected beverage price cut", "About RMB 1-5; Pure Green Tea reported at RMB 9", "Bamboo Works, January 2022", "Historical reported menu terms; no sales or margin outcome", "Obtain dated official menus, realized prices, and SKU-level sales."]
      - ["Average drink price", "RMB 29", "Haitong Securities figure cited by Bamboo Works in January 2022", "Source-reported average; denominator and method are not given", "Request average realized ticket by geography, channel, and period."]
      - ["US collaboration merchandise add-on", "$3.99 for a sticker plus a pin or keychain", "Forbes collaboration article, October 2026", "Accessory add-on price, not a beverage list price; costs and take-up are unknown", "Request add-on units, revenue recognition, merchandise cost, and promotion economics."]
      - ["Franchise investment and royalty", "$295,100-$507,100 total; $23,100 initial fee; 3% of net sales", "Unofficial franchise guide, page labeled updated October 2026", "Unverified guide claims; it does not identify a specific FDD in the fetched text", "Verify any current FDD and obtain actual franchisee sales, costs, and royalty terms."]
      - ["Current realized beverage price", null, "No comparable current realized-price series in the reviewed pages", "Null is unavailable, not zero; historical menu observations cannot substitute", "Request dated POS data net of discounts, refunds, and delivery commissions."]
    notes: >-
      Reported prices span different dates, geographies, and product categories. Null means no current
      comparable realized-price observation was established in this evidence set.
    claimRefs: [CI003, CI004, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Input, Available evidence, Period or basis, Underwriting limit, Diligence ask]
    rows:
      - ["Gross margin", "65%-70% estimate; about 53% industry estimate", "Guosen Securities figures cited by Bamboo Works in January 2022", "Historical estimates without an audited cost bridge or current store cohort", "Obtain gross margin by product, channel, and store cohort with accounting definitions."]
      - ["Customer acquisition and payback", null, "No CAC or payback period in the reviewed pages", "Promotion and location signals do not establish acquisition cost or retention", "Request customer acquisition spend, repeat-order cohorts, and payback calculations."]
      - ["Store contribution", null, "Historical order volume exists; current store-level sales and costs do not", "Orders do not establish basket, labor, rent, delivery cost, or contribution", "Request monthly mature/new-store cohorts with sales, COGS, labor, occupancy, and fees."]
      - ["Opening capex and working capital", null, "No verified current company-operated store investment or working-capital schedule", "Unofficial franchise figures are not company-store capex", "Request store build-out, equipment, inventory, deposits, and working-capital schedules."]
      - ["Cash, debt, burn, and runway", null, "No current figure in the fetched Multiples or Caplight pages", "Historical round records do not establish capital still available", "Request current balance sheet, cash flow, debt and lease schedules, and forecast."]
    notes: >-
      Historical third-party estimates and an unofficial franchise guide are not verified current
      economics. Null means unavailable in the reviewed evidence, not zero.
    claimRefs: [CI005, CI006, CI016]
