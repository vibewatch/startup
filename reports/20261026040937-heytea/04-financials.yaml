company:
  name: HeyTea
chapter:
  number: 4
  title: Financials
  summary: >-
    The retained evidence describes a transaction-led beverage-sales model, but the latest recorded
    revenue figure in the assigned data pages is from April 2018 and the same page repeats that figure
    for April 2017. Historical price and margin estimates, order anecdotes, and current promotional
    reporting do not establish current store returns or capital adequacy.
sections:
  - id: revenue-model
    title: Product sales are visible; current revenue quality is not
    body: >-
      Multiples categorizes HeyTea's model as B2C product sales, not subscription revenue or a software
      take rate [CI001]. Its page labels $58 million as the latest recorded revenue in April 2018, while
      also listing $58 million for April 2017; neither entry establishes current revenue, ARR, or a
      growth rate [CI002]. A 2019 WeChat mini-app user count and a 2018 delivery-order anecdote add
      dated activity signals, but neither is a count of active paying customers or a current sales
      measure [CI008, CI014]. The reviewed pages do not break revenue out by country, SKU, order channel,
      or company-operated versus partner-operated store, and they do not explain recognition or
      discount treatment. That limits conclusions about revenue mix, repeat purchase quality, and net
      sales even though the underlying unit of sale is straightforward.
    claimRefs: [CI001, CI002, CI008, CI014]
    tableRefs: [TI001]
  - id: pricing-and-channels
    title: Price points and channel anecdotes do not establish realized economics
    body: >-
      Pricing observations are heterogeneous in period, geography, and product. Bamboo Works reported
      that in January 2022 HeyTea cut selected drink prices by about RMB 1-5, including Pure Green Tea
      to RMB 9, and cited a separate RMB 29 average drink price from Haitong Securities [CI003, CI004].
      A 2026 collaboration article describes a US merchandise add-on priced at $3.99, not a standard
      drink price [CI012]. These are reported price or promotion terms, not a comparable realized-price
      series: no source here quantifies redemption, discount funding, net sales, or sales lift. The
      2018 investor-interview account gives a single-store monthly delivery-order range, but not basket
      value, platform fees, or current channel mix [CI008]. An unofficial franchise guide also gives
      specific investment and royalty amounts, while an older company statement described direct
      management and no franchising; the guide does not expose an identifiable filing, so those terms
      should not be used as verified current economics [CI009, CI010, CI011].
    claimRefs: [CI003, CI004, CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI002]
  - id: cost-and-unit-economics
    title: Margin and store-level returns remain unverified
    body: >-
      The available margin evidence is a historical securities estimate reproduced by Bamboo Works:
      Guosen Securities estimated HeyTea gross margin at 65%-70%, versus about 53% for the industry,
      in a January 2022 analysis [CI005]. That article also described rising raw-material costs and high
      rent and labor costs across the category [CI006]. It provides no calculation, accounting
      definition, period reconciliation, or store-level margin bridge. The same report's description
      of price reductions does not quantify any resulting change in volume, realized margin, or profit
      [CI007]. Accordingly, the estimate cannot support a current margin forecast or be translated into
      cash generation. Current ingredient and packaging costs, labor, occupancy, delivery economics,
      opening capex, and mature-store cohorts are needed to test whether revenue growth converts into
      store contribution. The figure shows this evidence boundary without assigning unsupported values.
    claimRefs: [CI005, CI006, CI007, CI016]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Historical funding and store activity do not prove capital adequacy
    body: >-
      Public activity signals are not a substitute for an underwriteable store model. Allrecipes
      reported a three-block line at the New York Teabar opening and described more than 3,500 global
      locations, while TechNode's 2020 report gave a 2019 WeChat mini-app user count; these measures
      show reported reach, not current paid demand or profitability [CI013, CI014]. Caplight's public
      page identifies July 13, 2021 as the last round in its displayed record but exposes no amount or
      valuation in the visible fields [CI015]. Multiples and Caplight do not show a current cash balance,
      debt, burn, capex, working capital, or runway for HeyTea in their fetched pages [CI016]. These
      page-specific omissions do not prove that the company has no such resources; they mean this
      evidence set cannot assess liquidity, financing dependency, or a next-round trigger. The
      financial verdict is therefore that product-sales revenue is plausible but earnings quality,
      capital intensity, and cash conversion remain unproven pending current statements and store
      cohorts.
    claimRefs: [CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Capital adequacy remains unproven
    body: >-
      The reviewed public pages do not permit a current liquidity or store-return calculation; historical
      financing activity must not be treated as cash still available.
    claimRefs: [CI015, CI016]
