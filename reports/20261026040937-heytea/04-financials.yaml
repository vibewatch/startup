          description: A 2018 single-store delivery-order anecdote is available; current order and basket data are not.
        - id: gross-sales
          label: Gross sales
          description: Menu price multiplied by units sold; current comparable menu and sales mix are not established.
        - id: net-product-sales
          label: Net product sales
          description: Multiples describes product sales, but current recognized revenue and channel mix are unknown.
        - id: gross-profit
          label: Gross profit
          description: A 2022 third-party estimate exists; no current audited cost-of-goods or margin bridge is available.
        - id: store-contribution
          label: Store contribution
          description: Current store-level labor, occupancy, fulfillment costs, and contribution are not reported in these pages.
        - id: cash-after-growth
          label: Cash after growth
          description: Current capex, working capital, cash, debt, burn, and runway are not established by this evidence set.
    claimRefs: [CI001, CI005, CI007, CI008, CI016]
