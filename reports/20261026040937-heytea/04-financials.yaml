      - [Delivery, "Drinks sold through delivery channels", "A 2018 investor-interview account reports 3,000-5,000 monthly orders at a single Guangzhou/Shenzhen store", "Historical order volume; not sales, order value, or store contribution", "Request current transactions, basket value, commissions, discount funding, and delivery mix."]
