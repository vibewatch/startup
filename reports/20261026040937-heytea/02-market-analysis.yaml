      - [iiMedia Research, "2023, China", "New-style tea drink: RMB 333.38bn", "13.5% year-over-year growth", "Estimate in a broader tea-beverage report; extracted text does not isolate fresh-prepared store sales"]
      - [iiMedia Research, "2025 forecast, China", "New-style tea drink: RMB 374.93bn", "Forecast; no CAGR stated for this row", "Publisher forecast; category scope and sizing method are not reconciled with Daxue's segment"]
      - [Daxue Consulting, "2025, China", "Traditional tea retail, including loose-leaf tea and teabags: USD 18.38bn", "7.2% CAGR, 2026–2033", "Adjacent category, not freshly prepared tea; forecast basis not disclosed in retrieved text"]
      - [GlobalData via Comunicaffe, "2017–2022, China", "Hot tea sales: USD 18.65bn in 2017; USD 20.84bn in 2018; USD 31.99bn projected for 2022", "11.7% growth, 2017–2018; 2022 was a projection", "Older, broader hot-tea series; 2022 forecast has elapsed and is not a current baseline"]
    notes: >-
      Values retain each publisher's category, currency, period, and forecast
      status. The extracted sources provide no common denominator or disclosed
      method that supports adding these estimates or deriving HeyTea's TAM,
      SAM, or SOM.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008]
  - id: TM003
    title: Buyer, budget owner, and adoption path
    columns: [Segment or occasion, Buyer and user, Payer or budget owner, Trigger and path, Evidence limit]
    rows:
      - [Premium new-style tea buyers, "Consumer purchasing a prepared drink", "Same individual consumer; no separate budget owner identified", "Novel tea, fruit, dairy, and premium brand experience", "No current cohort frequency, spend, or segment size"]
      - [Price-sensitive tea buyers, "Consumer choosing among tea-chain price tiers", "Same individual consumer", "Lower price point or trade-down from premium offerings", "Price-threshold evidence is from 2020–2021, not current elasticity"]
      - [Experience and limited-release seekers, "Visitor or fan buying a drink and possibly merchandise", "Same individual consumer", "Concept-store visit, social discovery, or limited-edition release", "Reported opening queues and media coverage do not establish repeat purchases"]
      - [At-home tea and packaged-drink consumers, "Household or individual retail purchaser", "Individual purchaser or household; not quantified", "Convenience, price, and alternative tea formats", "No cross-format spend or switch-rate data"]
    notes: >-
      Segments and adoption paths are qualitative. The sources do not identify
      a corporate payer, quantify each segment's addressable spend, or establish
      HeyTea-specific conversion or retention.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014]
