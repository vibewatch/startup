callouts:
  - calloutType: insight
    title: Published market totals are not interchangeable
    body: >-
      The RMB 374.93bn 2025 forecast and USD 6.75bn 2025 estimate use labels
      whose category boundaries and methods are not reconciled. Neither is a
      defensible HeyTea-specific TAM without a fresh-prepared market bridge.
    claimRefs: [CM003, CM005, CM008]
  - calloutType: risk
    title: Premium reach depends on holding value perception
    body: >-
      Historical price-sensitivity evidence and recent expert commentary make
      customer willingness-to-pay and quality consistency central adoption
      risks as HeyTea broadens price points and store access.
    claimRefs: [CM009, CM010, CM011]
