    - type: private-evidence-only
      severity: material
      topic: current-financials-and-ownership
      missingEvidence: "Current total funding, latest valuation and cap table; audited revenue with period and revenue-versus-ARR definition; EBITDA, cash, debt, capex, headcount, customer/member metrics and mature-store economics."
      whyItMatters: "Conflicting historical funding totals and ambiguous historical revenue labels cannot establish current liquidity, profitability, valuation support, dilution or store returns."
      diligencePath: "Obtain executed financing documents, the current cap table and investor-rights schedule, audited statements, debt/cash schedules, metric definitions and store-cohort contribution data."
      relatedQuestionRefs: [QO004]
