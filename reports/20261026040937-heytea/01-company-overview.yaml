company:
  name: HeyTea
chapter:
  number: 1
  title: Company Overview
  summary: >-
    HEYTEA is described as a Shenzhen-headquartered new-style tea chain founded by Nie
    Yunchen in Jiangmen in 2012; 2026 media reports place its global footprint above
    3,500 locations and its U.S. network above 40, though exact counts and dates are not
    reconciled. Historical funding coverage conflicts, while current leadership, ownership,
    audited financials and store economics remain unverified.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      HEYTEA's origin is placed in Jiangmen, Guangdong, in 2012, and Baidu Baike identifies
      Nie Yunchen as founder; the same profile names Shenzhen as headquarters and Shenzhen
      Meixixi Catering Management Co., Ltd. as operator [CO001, CO002]. These profile-level
      details are not a substitute for current corporate filings or a verified ownership
      chart. The retained descriptions characterize HEYTEA as a new-style tea chain built
      around freshly made tea, cheese foam and fruit beverages, with the profile describing
      direct-operation and business-partnership channels [CO003]. Public reporting indicates
      broad store scale, but the source dates, outlet definitions and company-versus-media
      attribution differ; the KPI table keeps those distinctions visible rather than
      presenting a single audited count [CO004, CO005].
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, ownership and financing
    body: >-
      Forbes names Lu Liu as HEYTEA's VP of Hong Kong, Macao & Overseas Brand, and Allrecipes
      names Jelynn Jiang as Overseas Senior Brand Manager, but these titles do not establish
      the current C-suite, board, founder's operating role, voting rights or succession
      arrangements [CO006]. The leadership table is deliberately partial; missing names are
      a diligence gap, not evidence that the roles or board do not exist. Historical financing
      sources also diverge: Bamboo Works reports two 2021 rounds totaling US$1 billion and
      a RMB60 billion valuation, whereas Multiples.vc lists US$594 million across five rounds
      and a US$500 million July 2021 Series D at US$9 billion [CO007, CO008]. Neither record
      establishes current cash available, current valuation, or investor ownership. The
      stakeholder map therefore treats named investors and commercial partners as reported
      relationships, not as a verified cap table or contract register.
    claimRefs: [CO006, CO007, CO008, CO009, CO016]
    tableRefs: [TO002, TO003]
  - id: scale-and-milestones
    title: Scale, expansion and milestones
    body: >-
      Allrecipes reported more than 3,500 locations worldwide and more than 40 U.S.
      locations in June 2026; Forbes later rendered the global figure as “3.500” and
      described a U.S. promotion at 48 locations excluding the New York TeaBar [CO004,
      CO005, CO014]. An undated Adyen partner announcement carried by Asia Food Journal
      states more than 4,300 outlets in 300 cities, so the evidence supports a large
      footprint but not a same-date, audited total [CO004]. HEYTEA-originated material
      carried by FoodTalks reports more than 100 overseas stores and more than 30 U.S.
      stores at an August 1, 2025 Cupertino-opening snapshot; that historical company
      claim is not a 2026 count [CO010]. The dated record also includes the first
      Singapore store in 2018, a New York TeaBar in June 2026 and an October 2026 LISA
      collaboration [CO012, CO014, CO015]. The timeline preserves issuer, period and
      scope for each milestone.
    claimRefs: [CO004, CO005, CO010, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
  - id: economics-and-diligence
    title: Economics, adverse signals and diligence priorities
    body: >-
      The retained sources do not establish current revenue or ARR, EBITDA, cash, debt,
      capex, headcount, customer or member counts, mature-store economics, or a current
      valuation. Multiples.vc lists US$58 million values alongside April 2017 and April
      2018 funding rounds but labels the figures “Revenue (or ARR),” so those historical
      entries cannot be treated as a clean revenue measure or a current run rate [CO009].
      Bamboo Works reported January 2022 price reductions of about RMB1–5 for some drinks
      amid saturation, rising costs and COVID-related disruption; this is a dated adverse
      signal, not evidence of current pricing, margin or profitability [CO011]. Investors
      should request round documents and a current cap table, audited accounts with
      metric definitions, store-cohort economics, and current leadership and customer
      data before relying on scale as a proxy for financial quality [CO006, CO008, CO009].
    claimRefs: [CO006, CO008, CO009, CO011]
