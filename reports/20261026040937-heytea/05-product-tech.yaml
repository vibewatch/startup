  evidenceGaps:
    - type: missing-source
      severity: material
      topic: current-technical-architecture
      missingEvidence: Current product and store systems architecture, integration inventory, uptime and incident history, support model, security controls, and implementation documentation.
      whyItMatters: Historical app and mini-program descriptions do not establish current deployment or show whether digital ordering is reliable, secure, or scalable across markets.
      diligencePath: Request a current architecture and vendor map, app release history, uptime and incident records, support SLAs, privacy/security assessments, and market-level integration documentation.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: product-quality-and-traceability
      missingEvidence: Current recipe specifications, ingredient traceability, supplier qualification, food-safety audit results, recall procedures, and independent verification of product-quality claims.
      whyItMatters: Public product statements and 2018–19 hygiene reports neither establish current control effectiveness nor show whether quality is consistent across company-operated and partner-operated locations.
      diligencePath: Review current QA and food-safety SOPs, supplier audit records, traceability tests, market-level inspection history, recall logs, and third-party product testing.
      relatedQuestionRefs: [QE010]
      relatedTableRefs: [TE001, TE003]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A public engineering surface or credible practitioner-community proxy such as technical talks, public engineer recruiting, industry-forum discussion, or integration-partner technical material.
      whyItMatters: HEYTEA is a consumer beverage and retail business with no obvious public code or package surface; the assigned pool contains no credible practitioner proxy, so engineering activity and integration quality cannot be triangulated externally.
      diligencePath: Ask management for technical talks, engineering hiring materials, integration-partner references, and an operator or vendor reference able to validate the ordering stack.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE003]
