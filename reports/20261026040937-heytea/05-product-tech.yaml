    columns: [Layer or process, Publicly described role, Known dependency, Risk or diligence question]
    rows:
      - ["Recipe and ingredients", "Tea, milk, fruit, and cheese-foam beverage combinations", "Ingredient specifications and sourcing", "What supplier qualification, recipe controls, and traceability apply across markets?"]
      - ["Product iteration", "Seasonal menu concepts and limited-run collaborations", "Recipe development, partner approval, and launch execution", "What are the stage gates, test results, and product-level margin or repeat metrics?"]
      - ["Store formats", "Standard beverage service plus reported Lab and Teabar concepts", "Store design, equipment, staffing, and local menus", "Which formats are active, standardized, and economically repeatable today?"]
      - ["Digital order flow", "Historical app and mini-program ordering with QR entry points", "Mobile software, order management, payment, and store fulfillment", "What current integrations, uptime, privacy, security, and support evidence can management provide?"]
    notes: >-
      This is an evidence-bounded operating model, not a verified systems diagram. Historical descriptions cannot establish current deployment, technical dependencies, or control effectiveness.
    claimRefs: [CE002, CE008, CE009, CE010, CE013]
