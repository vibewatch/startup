    notes: >-
      Workflow descriptions combine sources from different dates and markets. Potential value is an analytical interpretation; no causal or quantified customer benefit is inferred from reported lines, menu variety, or ordering features.
    claimRefs: [CE004, CE005, CE006, CE008, CE009]
  - id: TE003
