chapter:
  number: 6
  title: Customers
  summary: Public reporting documents meaningful customer interest at HeyTea openings and a broad reported store footprint, but these signals do not establish active customer counts, repeat use, or unit-level economics. Named consumer interviews show that novelty and social sharing can motivate trial, while long queues and mixed taste feedback underscore the need to test whether attention converts into durable behavior.
sections:
  - id: adoption-signals
    title: Reported footprint and launch demand are not retention
    body: >-
      Forbes and Allrecipes each reported more than 3,500 HeyTea locations worldwide in 2026, while Forbes also put the footprint across more than 330 cities. Those are reported store counts, not active customers, visits, or revenue-producing stores; the articles do not provide a reconciliation or same-store activity denominator. Separate coverage recorded queues at New York openings in 2023 and 2026, and Forbes described a LISA collaboration planned across 11 countries and regions. These observations support reach and event-led trial, but neither queue length nor a launch footprint establishes conversion, repeat purchase, or local profitability. The available public evidence therefore supports a credible demand signal, not a measured adoption curve.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: customer-segments
    title: Visible users skew toward urban novelty and social experiences
    body: >-
      The strongest direct customer evidence in the assigned sources is qualitative: a historical Beijing field report names young consumers who tried cheese tea and discussed posting photographs, while New York Magazine later described teens and people in their early twenties queuing for HeyTea. These are observed segments in particular places and moments, not a representative customer survey. Current reporting also describes a New York concept store with expanded tea formats and a limited-edition collaboration, suggesting occasions built around exploration and fandom. The reviewed sources do not identify a distinct payer separate from the consumer, quantify segment sizes, or connect a segment to spend. The segmentation below is consequently a sample of observed use cases, not a market-wide profile.
    claimRefs: [CU003, CU004, CU011, CU013]
    tableRefs: [TU001, TU003]
  - id: purchase-path
    title: Digital ordering appears to reduce friction, but evidence is thin
    body: >-
      The customer journey described by the sources begins with social discovery, product novelty, or a collaboration, then moves to a store visit or a reported digital pre-order. New York Magazine says fans told its writer that ordering ahead through HeyTea's app was easy; two low-reputation marketing pages also describe WeChat mini-program and app ordering. Those latter pages make precise transaction-share and membership claims without a cited dataset, so they are not used as verified adoption metrics. The path from first purchase to repeat behavior remains unmeasured in this evidence set: there are no cohort, churn, frequency, or renewal figures. The journey figure marks repeat use as an open diligence point rather than implying a proven retention loop.
    claimRefs: [CU012, CU014, CU015]
    figureRefs: [FU001]
  - id: durability-and-friction
    title: Product excitement coexists with service and durability questions
    body: >-
      A Vice field report captured both the social reward and the limits of launch-driven demand: interviewees described posting their drinks, but one customer said the taste was not particularly impressive. The same historical report recounted queues lasting hours, including a longer wait attributed to a company publicist; New York reporting later described waits that could reach an hour in the city. Daxue Consulting also documented consumer criticism of two past collaborations, including an apology after a controversial social post. These are specific episodes, not evidence of current widespread dissatisfaction. More importantly, the sources do not show whether queues persisted after launch peaks or whether customers returned after trial. Investors should treat retention and concentration as private diligence requirements, not infer them from viral moments.
    claimRefs: [CU008, CU009, CU010, CU013]
  - id: evidence-gaps
    title: Retention, concentration, and customer economics remain unverified
    body: >-
      None of the retained public sources supplies an auditable active-customer count, repeat-purchase cohort, churn or retention rate, order frequency, or store-level customer economics. Reported locations and limited-time campaign reach cannot substitute for those measures, and the historical customer interviews cannot establish representativeness. The evidence also does not allocate demand or sales across company-operated stores, franchise locations, delivery platforms, or geographies, so customer and channel concentration remain unknown. A diligence process should request dated cohort tables linked to paid orders, comparable store cohorts, channel and geography splits, and the underlying customer definitions. Until those are reconciled to audited operating data, customer durability remains an unresolved valuation input.
    claimRefs: [CU001, CU006, CU015]
