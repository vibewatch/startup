    rows:
      - [Urban novelty seekers in New York, Consumer appears to be both buyer and user, Reported queues at the 2026 Teabar opening and earlier New York launch, Qualitative trial and experiential positioning, No customer counts or conversion data]
      - [Social-sharing consumers in Beijing, Consumer appears to be both buyer and user, Named interviewees discussed queues and posting drink photographs, Visibility and peer influence may support discovery, Historical interviews are not representative]
      - [App-oriented New York visitors, Consumer appears to be both buyer and user, Fans told a New York Magazine writer that app pre-ordering was easy, Convenience may help customers avoid in-person waits, No digital-order share or repeat rate is established]
      - [Collaboration and fandom audience, Consumer purchases the limited offer; payer not separately identified, Forbes described a limited LISA drink and merchandise offer across several markets, Campaign offers extend customer reach across markets, Rollout coverage is not evidence of sell-through]
    notes: "Source: independent reporting and named historical interviews; segmentation is a selective qualitative sample, not a population estimate. Buyer, user, and payer are not separately measured."
    claimRefs: [CU003, CU004, CU011, CU012, CU013, CU014]
  - id: TU002
    title: Customer adoption and reach signals
    columns: [Metric / signal, Reported value, Date or period, Source and confidence, Customer implication, Missing denominator]
    rows:
      - ["Global store footprint", "More than 3,500 locations", "2026 reporting", "Forbes and Allrecipes; high confidence in reported footprint", "Broad physical reach", "Active locations and customer count"]
      - [Cities reached, More than 330 cities, October 2026 article, Forbes; medium confidence, Geographic coverage, City-level store count and sales]
      - ["New York Teabar opening queues", "Up to three blocks long", "June 5, 2026 opening", "Allrecipes; medium confidence", "Event-led trial and local interest", "Queue-to-order conversion and post-opening baseline"]
      - ["LISA collaboration rollout", "11 countries and regions; 48 U.S. locations", "October 2026 announcement", "Forbes; medium confidence in described rollout", "Multi-market customer access", "Store-level sales, redemption, and repeat purchase"]
    notes: "These measures describe reported stores, rollout, and observed queues; they are not customer counts, transactions, or retention metrics. The store footprint is reported by media outlets and is not reconciled to operating or active-store definitions."
    claimRefs: [CU001, CU002, CU004, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / context, Segment and use case, Reported purchase or experience, Production versus pilot, Outcome / limitation]
    enumerationScope:
      coverage: sample
      basis: "Three named consumer interview examples selected from a historical Beijing field report; this is not a complete customer roster."
    rows:
      - [Liu Jie, 31-year-old HR worker in Beijing, Had tried Hey Tea before and described the tea-and-cheese combination, Production consumer use reported by Vice, Interview documents trial but not purchase frequency]
      - [Karen Wang, 21-year-old student in Beijing, Bought green cheese tea and described the brand's social status, Production consumer use reported by Vice, One interview cannot establish segment-wide preference]
      - [Zhang Wanqing, 16-year-old student in Beijing, Visited after seeing friends' queue photos and posted her own drink, Production consumer use reported by Vice, She described the taste as not particularly amazing; social response was nine likes at the time]
    notes: "Coverage is a small qualitative sample from one historical report. Named individuals are directly documented only by Vice; separate reporting on queues and young visitors provides context, not identity-level corroboration."
    claimRefs: [CU006, CU011, CU013]
