    title: Observed customer journey and evidence gaps
    type: journey-map
    summary: Public evidence supports discovery, trial, and ordering touchpoints, but does not establish a measured repeat-purchase loop.
    data:
      items:
        - label: Discover
          actor: Prospective customer
          stage: Social or cultural discovery
          touchpoints: ["Social posts and visible queues in the historical Beijing report", "Limited-edition collaboration coverage"]
          tone: neutral
        - label: Consider
          actor: Tea and novelty seeker
          stage: Evaluate the product and location
          touchpoints: ["Cheese tea and concept-store formats described in reporting", "No representative preference survey in the retained sources"]
          tone: neutral
        - label: Visit
          actor: Store visitor
          stage: Trial at a physical location
          touchpoints: ["New York opening queues reported in 2023 and 2026", "Queue length does not equal completed orders"]
          tone: positive
        - label: Order
          actor: Consumer / payer
          stage: Purchase in store or reported app pre-order
          touchpoints: ["New York Magazine reports fans found app pre-order easy", "Digital share claims from low-reputation marketing pages are unverified"]
          tone: neutral
        - label: Share
          actor: Customer and social audience
          stage: Post-purchase social sharing
          touchpoints: ["Named Beijing interviewees described posting drink photographs", "Interview evidence is historical and selective"]
          tone: positive
        - label: Repeat
          actor: Existing customer
          stage: Retention and expansion
          touchpoints: ["No cohort repeat rate, churn, or order-frequency data in the assigned evidence", "Request dated customer cohorts and channel splits"]
          tone: warning
    claimRefs: [CU004, CU006, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Store footprint is not proof of customer durability
    body: The reported 3,500-plus locations and launch queues demonstrate reach and episodic interest, but public evidence does not reveal active buyers, repeat rates, or concentration by geography and channel.
    claimRefs: [CU001, CU004, CU006, CU015]
