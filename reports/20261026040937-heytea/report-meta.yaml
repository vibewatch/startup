companyProfile:
  summary: >-
    HeyTea is a privately held Chinese new-style tea chain founded in Jiangmen in 2012 and headquartered in Shenzhen. It
    sells freshly prepared tea, cheese-foam, fruit, and matcha beverages through direct-operation and
    business-partnership stores, with reported international expansion. Public evidence supports a recognizable product
    and brand engine, but does not establish current ownership, audited financial performance, or store-level returns.
