  topStrengths:
    - Recognizable premium beverage positioning with ongoing menu, format, and collaboration activity.
    - Reported global store scale and visible international expansion, although counts are not reconciled.
    - Opening demand and qualitative customer evidence indicate trial and cultural relevance, not proven retention.
  topRisks:
    - Private-company disclosure leaves current revenue, margins, cash, debt, and mature-store returns unverified.
    - Franchise and overseas expansion may strain quality, training, and operating controls.
    - Intense price competition and unclear customer repeat behavior weaken confidence in durable differentiation.
    - Historical funding and valuation sources conflict, with no current cap table or investor terms.
  unresolvedGaps:
    - Current audited financial statements, including EBITDA, cash, debt, capex, and comparable mature-store economics.
    - >-
      Reconciled active-store footprint by country and operating model, with country-level profitability and quality
      controls.
    - Paid customer cohorts, order frequency, repeat purchase, channel mix, and local-versus-diaspora demand.
    - Reconciled cap table, latest financing terms, and a management-supported current valuation bridge.
