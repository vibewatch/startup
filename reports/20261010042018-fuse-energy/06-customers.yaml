company:
  name: "Fuse Energy"
chapter:
  number: 6
  title: "Customers"
  summary: "Fuse Energy has scaled its UK retail energy footprint to more than 300,000 households by mid-2026, combining competitive domestic dual-fuel tariffs with an app-first digital experience and emerging EV charging integrations. However, independent consumer evaluations highlight operational friction, including a 16% formal complaint rate and below-average customer service scores driven by a lack of telephone support. While reported 135% net dollar retention points to strong expansion in enterprise grid segments, the company's June 2026 decision to align variable tariffs with the Ofgem price cap will test customer stickiness and retention durability as initial promotional discounts expire."
sections:
  - id: "customer-segmentation-and-target-profiles"
    title: "Customer Base Segmentation and Target Profiles"
    body: >
      Fuse Energy's customer base is anchored in the UK domestic residential market, serving over 300,000 households across Great Britain as of mid-2026. The company primarily targets mass-market dual-fuel consumers through an intuitive mobile application that simplifies onboarding and daily energy management. Alongside standard household electricity and gas supply, Fuse Energy has developed specialized customer segments, including residential electric vehicle owners utilizing dedicated overnight charging tariffs and domestic solar micro-generators exporting surplus electricity under the Smart Export Guarantee scheme. Additionally, the company is cultivating an emerging business-to-business footprint focused on commercial solar installations and intelligent grid balancing services. While high customer acquisition volumes have established meaningful scale, detailed segmentation disclosures regarding churn differentials between fixed and variable direct debit accounts remain undisclosed.
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU012"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-household-scale"
    title: "Adoption Trajectory and Household Scale"
    body: >
      Fuse Energy has demonstrated rapid customer adoption since its public retail launch in July 2023, expanding from an initial 200-home beta trial to 50,000 electricity accounts by July 2025, 200,000 households by December 2025, and exceeding 300,000 households by June 2026. This customer growth trajectory coincided with the company reporting group-level profitability and positive monthly EBITDA since December 2025, with revenue run rates surpassing $550 million in early 2026. Fuse Energy attributes this expansion to its vertically integrated operating architecture—incorporating in-house generation assets, proprietary wholesale trading algorithms, and automated digital demand forecasting. Management claims this structure lowers the cost to serve electricity by 15% to 17% relative to traditional incumbent suppliers. To sustain this momentum, Fuse Energy secured a $30 million Series B extension in June 2026 to fund international expansion across Europe and North America.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "customer-experience-satisfaction-and-proof"
    title: "Customer Experience, Satisfaction, and Deployment Proof"
    body: >
      Customer sentiment and deployment proof present a multifaceted picture across independent review benchmarks and price comparison platforms. In the Which? 2026 annual energy satisfaction survey, Fuse Energy secured a respectable 76% customer satisfaction score, ranking joint fifth among seventeen UK retail energy providers. Customers frequently commend the company for its intuitive mobile application, transparent monthly billing forecasts updated every thirty minutes, and paperless switching process that allows users to onboard in under three minutes by uploading a past bill. Furthermore, public aggregator ratings on Uswitch and TrustPilot average 4.8 out of 5 stars, corroborating broad domestic satisfaction with digital tariff management. However, customer outcomes in commercial solar design and specialized enterprise deployments remain documented only through aggregate company announcements, representing an ongoing diligence gap regarding corporate client satisfaction and contract longevity.
    claimRefs:
      - "CU003"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-complaints-and-concentration-risks"
    title: "Retention Dynamics, Service Complaints, and Concentration Risks"
    body: >
      Despite strong top-line customer acquisition, Fuse Energy exhibits measurable operational friction and retention headwinds in independent assessments. Which? reported that 16% of Fuse Energy customers filed a formal complaint within the past year—a proportion significantly higher than established competitors—driven by refund delays, estimated billing despite meter submissions, and smart display faults. Furthermore, Which? awarded Fuse Energy a 56% supplier assessment score (ranking 13th out of 17), citing the complete absence of telephone support and weak procedures for assisting vulnerable households. Compounding these service frictions, Fuse Energy aligned its variable tariff rates with the Ofgem price cap in June 2026, ending its long-standing marketing claim of perpetual price undercutting. While strategic analysis cites 135% net dollar retention in grid software, high customer acquisition costs and wholesale trading counterpart concentration present critical risks as retail accounts mature.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU011"
      - "CU014"
