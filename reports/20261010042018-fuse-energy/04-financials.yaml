company:
  name: "Fuse Energy"
chapter:
  number: 4
  title: "Financials"
  summary: "Fuse Energy has demonstrated rapid commercial expansion, scaling to an un-audited $550M ARR run-rate and over 300,000 UK households by mid-2026 alongside claimed monthly EBITDA profitability. However, the absence of public audited statutory accounts reconciled to reported ARR, combined with private-round liquidation terms and wholesale energy price exposure, leaves core margin sustainability as a key diligence blocker."
sections:
  - id: "revenue-streams-and-tariffs"
    title: "Revenue Streams and Tariff Monetization"
    body: "Fuse Energy monetizes its clean utility platform primarily through domestic retail dual-fuel energy supply contracts across Great Britain. Customers contract for residential electricity and natural gas delivered through standard metered tariffs that promise annual savings of up to £200 compared with standard default price-cap rates. The commercial offering pairs retail utility billing with 100% green-certified electricity as standard, underpinned by physical off-take from company-owned renewable generation assets. In addition to core domestic supply, the company has deployed specialized electric vehicle tariffs and export programs under Ofgem's Smart Export Guarantee, creating supplementary recurring revenue streams from distributed flexibility assets and smart meter integration."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI010"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "gtm-motion-and-customer-acquisition"
    title: "Go-To-Market Motion and Customer Acquisition Economics"
    body: "The go-to-market model operates primarily as a direct-to-consumer digital switching channel supplemented by price comparison websites such as Uswitch. By eliminating traditional call centre overhead in favor of a 24-hour app-based customer support model, Fuse Energy aims to maintain an operating expense structure materially lower than legacy Big Six UK utilities. The company leverages an advertised savings proposition of up to £200 annually to drive switcher acquisition, expanding its customer footprint from 200,000 UK households in December 2025 to more than 300,000 households by June 2026. Fixed-term retail tariffs incorporate contractual exit fees outside the final 49-day regulatory window, providing a modest disincentive against immediate churn during periods of retail rate competition."
    claimRefs:
      - "CI004"
      - "CI007"
      - "CI010"
      - "CI013"
  - id: "cost-structure-and-margin-dynamics"
    title: "Cost Structure and Gross Margin Dynamics"
    body: "Fuse Energy's cost structure is governed by wholesale energy commodity costs, grid transmission and distribution charges, and balancing obligations. To insulate retail gross margins from power price volatility, the company pairs an in-house algorithmic energy trading desk with proprietary forecasting software that predicts property-level consumption patterns. Direct power purchase from its own solar farms and onshore wind turbines provides a physical cost hedge against wholesale market spikes. However, as noted in third-party utility assessments, operating in the UK energy retail market involves persistent unpredictability and working capital strain, where sudden unhedged volume swings or grid imbalances can rapidly compress operating margins."
    claimRefs:
      - "CI003"
      - "CI007"
      - "CI008"
      - "CI009"
    figureRefs:
      - "FI001"
  - id: "public-traction-and-underwriting-gaps"
    title: "Reported Traction and Private Metric Disclosures"
    body: "Third-party private market trackers report that Fuse Energy reached an annualized revenue run-rate of $550M as of its June 2026 Series B extension, reflecting rapid expansion from $90M in July 2025 and $400M in December 2025. Company disclosures also state that the business achieved positive EBITDA monthly run-rates beginning in December 2025. Despite these reported milestones, public statutory accounts filed at Companies House for Fuse Energy Supply Limited only disclose historical turnover through FY2024 within the £10M to £50M bracket. The reconciliation between un-audited management ARR and GAAP gross revenue, as well as cohort-level churn and customer acquisition costs, remains a material underwriting gap."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
      - "CI008"
      - "CI013"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-diligence-verdict"
    title: "Capital Adequacy, Financing Dependency, and Underwriting Verdict"
    body: "Fuse Energy has secured cumulative venture capital funding of approximately $250M across four priced rounds through June 2026, most recently closing a $30M Series B extension backed by 20VC, Collaborative Fund, Balderton Capital, and Lowercarbon Capital. While reported monthly EBITDA profitability provides operating cash buffer, retail utility businesses operating at 300,000-household scale require substantial working capital and collateral facilities to support energy trading desk margin calls and Ofgem regulatory compliance. Diligence underwriters should demand full FY2025 audited financial statements, collateral credit lines, and customer churn waterfall data before endorsing the reported $5B valuation multiple."
    claimRefs:
      - "CI006"
      - "CI009"
      - "CI011"
      - "CI012"
      - "CI014"
