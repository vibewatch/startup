callouts:
  - calloutType: "risk"
    title: "Wholesale Market Exposure and Unhedged Tariff Volatility"
    body: "Offering retail tariffs priced up to £200 below market price-caps introduces acute margin sensitivity to wholesale energy spikes. Without substantial owned generation capacity and rigorous long-term forward hedges, supplier margins remain exposed to extreme spot price movements across the UK wholesale electricity and gas grids."
    claimRefs:
      - "CI004"
      - "CI009"
  - calloutType: "insight"
    title: "Vertical Integration Margin Cushion"
    body: "By developing its own solar and wind assets and running proprietary trading algorithms, Fuse Energy captures margin at multiple stages of the power value chain. This physical hedge structure differentiates its unit economics from pure retail resellers that collapsed during the 2021-2022 UK energy crisis."
    claimRefs:
      - "CI003"
      - "CI006"
