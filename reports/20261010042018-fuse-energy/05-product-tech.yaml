chapter:
  number: 5
  title: "Product & Technology"
  summary: "Fuse Energy operates an app-first UK dual-fuel retail supply model that replaces legacy call-centre operations with in-app customer support and automated 30-minute consumption forecasting. The company's technology stack integrates smart meter telemetry through the national Data Communications Company gateway, supports home EV charging and commercial solar deployments, and is developing decentralized grid management and blockchain reward layers to coordinate residential clean energy hardware."
sections:
  - id: "sec-product-overview-modules"
    title: "Product Definition and Module Breakdown"
    body: "Fuse Energy delivers domestic and commercial energy services across Great Britain through a unified digital platform designed to bypass legacy utility workflows. The core offering comprises low-carbon domestic electricity and gas tariffs managed entirely via iOS and Android applications. Onboarding is engineered around rapid digital switching, enabling prospective households to complete registration in under three minutes through automated bill upload parsing. Beyond basic retail power supply, the company has expanded its commercial portfolio into residential EV charging through the Fuse EV module, as well as end-to-end commercial rooftop solar design and installation for UK enterprises. Forthcoming product modules currently on the product roadmap include smart home device optimization with token-based rewards and bidirectional solar-plus-battery export performance tracking, establishing a connected hardware ecosystem centered on residential electrification."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "sec-architecture-operating-model"
    title: "Technology Architecture and Operating Model"
    body: "Founded by former Revolut executives Alan Chang and Charles Orr, Fuse Energy reflects fintech software design principles applied directly to power retail. The core software infrastructure pairs modern cloud application runtimes with automated consumption forecasting models that ingest smart meter data every 30 minutes. Rather than relying on traditional utility enterprise resource planning suites and manual customer service call centres, the operational architecture automates tariff calculation, meter validation, and direct-debit reconciliation. Furthermore, job specifications highlight active development of proprietary internal operations tools and platforms designed to manage renewable energy assets, installation logistics, and real-time customer telemetry. The engineering team is also designing advanced grid management platforms and blockchain-based reward mechanisms to orchestrate distributed energy resources, backed by $250 million in cumulative equity funding across seed and early-stage rounds."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE009"
      - "CE010"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "sec-deployment-integration-workflows"
    title: "Customer Workflows, Integration, and Hardware Roadmap"
    body: "Customer interaction is strictly mobile-first, eliminating paper invoicing and web-only legacy portals in favour of high-cadence telemetry. Households request smart meter installations directly within the mobile application, after which telemetry data flows from the meter through national Data Communications Company infrastructure into Fuse Energy's billing engine. A critical structural differentiation is the company's billing mechanics: independent reviews confirm that Fuse Energy bills customers strictly for actual energy consumed, avoiding the traditional industry practice of accumulating substantial direct-debit credit balances to cushion supplier working capital. For electric vehicle drivers, the Fuse EV tariff integrates smart wallbox charging to optimize off-peak power delivery, while future hardware integrations will encompass home battery systems and microgeneration export feeds to support domestic flexibility."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE008"
    tableRefs:
      - "TE002"
  - id: "sec-trust-compliance-risks"
    title: "Regulatory Compliance, Dispute Governance, and Technical Vulnerabilities"
    body: "Operating as an Ofgem-licensed domestic supplier requires strict compliance with statutory consumer protection and dispute governance frameworks. Fuse Energy Supply Limited is subject to formal dispute resolution standards, operating a staged complaints process that issues an initial acknowledgment within two days, targets complete resolution by day 14, and issues a formal deadlock letter after eight weeks if mutual resolution cannot be reached. Unresolved disputes escalate to the statutory Energy Ombudsman, whose determinations are legally binding on Fuse Energy within a 28-day remedy window. Independent compliance registers confirm that Fuse Energy Supply Limited remains fully active and trades under statutory schemes, including participation in the Warm Home Discount scheme for the 2026–2027 heating season. However, technical reliance on external smart meter gateway networks and undisclosed penetration audit records represent ongoing operational diligence risks."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
