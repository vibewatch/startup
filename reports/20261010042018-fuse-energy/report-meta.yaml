summary:
  headline: >-
    Fuse Energy is a rapidly scaling UK energy challenger with strong reported household growth and product breadth, but
    its $5 billion valuation remains difficult to underwrite because audited economics, cap-table terms, liquidity, and
    regulatory exposures remain opaque.
