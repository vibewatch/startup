companyProfile:
  summary: >-
    Fuse Energy is a London-based, vertically integrated UK energy challenger founded in 2022 by former Revolut
    executives Alan Chang and Charles Orr. It combines retail electricity and gas supply, proprietary wholesale trading,
    owned renewable generation, and app-based customer operations. By mid-2026 the company was publicly reported to
    serve more than 300,000 UK households, employ 400+ people, and carry a roughly $5 billion private valuation.
