schemaVersion: "report-v2"
artifact: valuation
slug: fuse-energy
runDate: 2026-10-10
company:
  name: Fuse Energy
chapter:
  number: 8
  title: Valuation
  summary: >-
    Fuse Energy has credible growth signals and a repeatedly reported USD 5 billion
    December 2025 valuation, but public sources disagree sharply on cumulative funding
    and do not disclose a usable transaction multiple or investor protections. The
    appropriate stance is research-more with a stretched valuation assessment until
    audited economics, cap-table terms, and entry price are available.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a
      stretched valuation stance. Multiple independent data pages repeat a USD 5 billion
      December 2025 mark, but the public record is not sufficient to convert that mark
      into an investable price. The strongest operating signals are scale rather than
      cash-flow proof: the company was reported to serve more than 300,000 households by
      June 2026, and a secondary summary cites GBP 129.7 million of latest annual sales.
      A company-attributed report also says Fuse has been EBITDA-positive each month
      since December 2025, but that claim is not an audited cash-flow statement and does
      not establish free cash flow, working-capital needs, or project-finance exposure.
      Entry discipline should therefore be conditional: require a reconciled group
      revenue and margin bridge, current cash and debt, security terms, and a fully
      diluted cap table before assigning a target return or acceptable valuation.
    claimRefs: [CV001, CV008, CV009, CV010, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis-and-financing
    title: Thesis, anti-thesis, and financing context
    body: >-
      The thesis is that rapid household adoption, low-price positioning, and a vertically
      integrated energy model could create a scaled challenger with multiple monetization
      paths. Fuse markets billing forecasts, EV charging, solar export, and multi-property
      management, while Uswitch independently describes its tariffs as consistently among
      the cheapest during 2025 and 2026. The anti-thesis is that the last private mark may
      have moved faster than verifiable economics: Wikipedia summarizes a rise from about
      USD 1 billion in July 2025 to about USD 5 billion in December 2025, while the available
      financing databases report cumulative funding of USD 91.3 million, USD 200 million,
      and USD 250 million. These totals are not interchangeable with cash available, and
      the disagreement prevents a reliable dilution reconstruction. One market-data page
      explicitly says EV/revenue was not disclosed for any round. Public evidence therefore
      supports company momentum, not the precise price or preference stack.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV011, CV012, CV014]
    tableRefs: [TV002]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and final diligence
    body: >-
      Scenario analysis should remain qualitative until the denominator is reliable. The
      bull case requires audited group economics to validate profitable growth and an entry
      structure that leaves room above the last reported mark. The base case recognizes
      customer and sales momentum but withholds a valuation range because the public sources
      do not reconcile group revenue, statutory revenue, ARR, or funding proceeds. The bear
      case combines multiple compression with energy-market volatility, working-capital
      pressure, and adverse financing terms; Uswitch notes that the energy market remains
      challenging and unpredictable even while judging failure unlikely. Exit readiness is
      similarly unproven: scale can attract strategic or public-market interest, but there
      is no public evidence here on audit readiness, governance depth, normalized cash
      generation, or liquidity rights. Thesis-break triggers are failure to reconcile
      reported metrics, deterioration in customer economics, a down round, or material
      regulatory and liquidity constraints. Final diligence should obtain audited accounts,
      monthly cohort and contribution data, hedging and collateral schedules, debt documents,
      the fully diluted cap table, liquidation preferences, and primary-versus-secondary
      allocations for each recent financing.
    claimRefs: [CV002, CV008, CV009, CV013, CV015, CV016]
    tableRefs: [TV003]
