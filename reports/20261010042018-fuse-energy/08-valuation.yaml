    title: Recommendation summary
    columns: [Decision element, Current view, Decision implication]
    rows:
      - [Recommendation, Research more, "Do not underwrite a new investment from public evidence alone."]
      - [Confidence and risk, "Medium confidence; high risk", "Use staged diligence and price protection rather than a conviction-sized entry."]
      - [Valuation stance, Stretched, "Require verified economics and security terms before setting a return target or entry price."]
    notes: >-
      Analyst judgment based on the reported USD 5 billion private mark, public operating
      signals, conflicting funding totals, and missing transaction terms; no numeric fair
      value or target return is estimated.
    claimRefs: [CV001, CV008, CV009, CV013, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "More than 300,000 households were reported by June 2026.", "Audited retention and contribution margins would strengthen the scale case."]
      - [Thesis, "Uswitch says Fuse offered some of the market's cheapest tariffs through 2025 and 2026.", "Evidence that low prices persist with positive unit economics would strengthen the moat case."]
      - [Thesis, "The company markets EV charging, solar export, billing forecasts, and multi-property tools.", "Verified attach rates and gross profit by product would show whether breadth adds value."]
      - [Anti-thesis, "The reported private mark rose from about USD 1 billion to about USD 5 billion during 2025.", "A defensible multiple based on audited group revenue and cash generation would reduce valuation risk."]
      - [Anti-thesis, "Public funding totals range from USD 91.3 million to USD 250 million.", "A cap table and financing ledger would resolve proceeds, dilution, and investor rights."]
      - [Anti-thesis, "The assigned market-data evidence does not disclose EV/revenue for any round.", "Round documents and a reconciled denominator would make price comparison possible."]
    notes: >-
      Public-source snapshot as of the run date; company-issued product and profitability
      claims are distinguished from independent summaries, and funding raised is not treated
      as cash available.
    claimRefs: [CV004, CV006, CV007, CV009, CV010, CV011, CV012, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited profitable growth, durable low-price acquisition, and favorable security terms.", "A negotiated entry below or better protected than the last reported mark could support venture returns; no public range is supportable.", "Unassigned pending audited economics.", "Growth persists but cash conversion or unit margins fail verification."]
      - [Base, "Customer scale continues, but economics and financing terms remain private.", "No numeric fair-value range; defer pricing until revenue, margin, cash, debt, and dilution are reconciled.", "Most consistent with the current evidence set.", "A financing is completed at weaker terms or a lower mark."]
      - [Bear, "Energy volatility, collateral needs, weak cohort economics, or multiple compression dominate.", "Loss of capital is plausible if the USD 5 billion mark embeds unverified growth and preferences impair common-equity proceeds.", "Plausible but not quantifiable from public evidence.", "Liquidity stress, regulatory constraint, customer deterioration, or a down round."]
    notes: >-
      Scenarios are directional because public evidence lacks audited group financials,
      fully diluted ownership, debt and collateral detail, security preferences, and a
      comparable transaction multiple; probabilities and valuation ranges are intentionally
      not fabricated.
    claimRefs: [CV001, CV006, CV008, CV009, CV010, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong scale signals are offset by financing-data conflict and missing price
      denominators, leading to a conditional research-more recommendation.
    data:
      nodes:
        - id: reported-mark
          label: Reported USD 5B mark
          detail: "Repeated for December 2025, but not accompanied by public round economics."
        - id: operating-scale
          label: Operating scale signals
          detail: "Household growth, sales, tariff positioning, and a company profitability claim."
        - id: funding-conflict
          label: Funding totals conflict
          detail: "Assigned sources report USD 91.3M, USD 200M, and USD 250M totals."
        - id: denominator-gap
          label: Pricing denominator missing
          detail: "No disclosed EV/revenue multiple or reconciled group financial bridge."
        - id: entry-gate
          label: Entry gate
          detail: "Require audited economics, cash and debt, cap table, and security terms."
        - id: recommendation
          label: Research more
          detail: "Medium confidence, high risk, and a stretched valuation stance."
      edges:
        - from: reported-mark
          to: operating-scale
        - from: operating-scale
          to: funding-conflict
        - from: funding-conflict
          to: denominator-gap
        - from: denominator-gap
          to: entry-gate
        - from: entry-gate
          to: recommendation
    approximationNotes: >-
      The flow is a qualitative decision sequence, not a valuation model or probability
      estimate.
    claimRefs: [CV003, CV004, CV005, CV006, CV014, CV016]
