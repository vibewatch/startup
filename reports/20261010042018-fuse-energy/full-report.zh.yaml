            - 3 分钟供应商切换编排器
            - 全国客户账户配置
        - label: 智能电表遥测与接入层
          modules:
            - Data Communications Company（DCC）网关
            - 30 分钟间隔遥测管道
            - 家庭用量预测引擎
        - label: 计费、定价与结算核心
          modules:
            - 实际用量动态定价引擎
            - 自动直接借记结算轨道
            - 批发量与不平衡平衡
        - label: 内部运营与资产管理层
          modules:
            - 可再生资产绩效监控器
            - 商业太阳能安装平台
            - 高风险遥测与数据完整性系统
        - label: 去中心化能源与电网协调层（路线图）
          modules:
            - Fuse EV 智能壁挂充电箱遥测
            - 家庭电池与太阳能外送收益追踪器
            - 区块链代币奖励与电网平衡系统
    approximationNotes: 架构层与功能模块综合自工程岗位说明、客户界面功能与官方披露。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE009
      - CE010
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从首次获取资费到 EV 与太阳能扩展循环的端到端客户生命周期。
    data:
      nodes:
        - id: acquisition
          label: 发现与比较
          phase: Awareness
          touchpoints:
            - Uswitch and comparison sites
            - Direct mobile web landing
          detail: 客户将有竞争力的固定与浮动资费同 Ofgem 价格上限比较
        - id: onboarding
          label: 3 分钟数字切换
          phase: Onboarding
          touchpoints:
            - Fuse mobile app
            - Bill image upload
          detail: 自动创建账户并无缝转移供应商，无需人工电话
        - id: daily_use
          label: 用量监测
          phase: Engagement
          touchpoints:
            - In-app half-hourly usage
            - Smart meter display
            - Forecast bills
          detail: 数字孪生用量预测与每 30 分钟更新的实时账单
        - id: support
          label: 数字服务与解决
          phase: Support
          touchpoints:
            - 24/7 in-app messaging
            - Email support
          detail: 不提供电话支持；处理计费、退款与智能电表咨询
        - id: expansion_ev
          label: EV 智能充电附加
          phase: Expansion
          touchpoints:
            - Fuse EV app integration
            - Home charger linkage
          detail: 启用非高峰夜间充电资费，提高家庭能源钱包份额
        - id: expansion_solar
          label: 太阳能外送与灵活性
          phase: Retention
          touchpoints:
            - Smart Export Guarantee tariff
            - Home battery optimization
          detail: 太阳能外送回款 13p/kWh，并将推出设备灵活性奖励
    approximationNotes: 生命周期阶段与触点互动综合自公司开户流程和 Which? 客户旅程评估。
    claimRefs:
      - CU004
      - CU006
      - CU009
      - CU012
  - id: FR001
    title: 风险热力图：影响、可能性信号与缓解成熟度
    type: matrix
    summary: 该矩阵将有证据支持的暴露面，与未量化的概率及大多未经验证的缓解成熟度区分开。
    data:
      columns:
        - label: 实现后的影响
          detail: 分析师严重程度判断基于引用来源支持的运营暴露面。
        - label: 可能性信号
          detail: 仅为公开信号；不是建模得到的事件概率。
        - label: 缓解成熟度
          detail: 仅对公开证据评分；可能存在非公开控制措施。
      rows:
        - label: 批发利润与流动性
          note: 低价定位面临已承认的市场波动。
          values:
            - label: 关键
              tone: critical
            - label: 持续暴露；概率未量化
              tone: warning
            - label: 未验证
              tone: warning
        - label: 监管供给边界
          note: 运营许可证据不能证明控制有效性。
          values:
            - label: 高
              tone: critical
            - label: 持续义务
              tone: warning
            - label: 部分公开证据
              tone: neutral
        - label: 预测与平衡
          note: 已描述预测用途；绩效与人工覆盖没有公开。
          values:
            - label: 高
              tone: critical
            - label: 未量化
              tone: neutral
            - label: 未验证
              tone: warning
        - label: 电网与项目交付
          note: 项目与电网约束已公开；协议没有。
          values:
            - label: 高
              tone: critical
            - label: 项目特定
              tone: neutral
            - label: 部分公开证据
              tone: neutral
        - label: 资本可用性
          note: 融资历史不是当前流动性指标。
          values:
            - label: 高
              tone: critical
            - label: 未量化
              tone: neutral
            - label: 未验证
              tone: warning
        - label: 代币设计与奖励层
          note: 已报道的 SEC 立场以提交的结构为条件。
          values:
            - label: 中
              tone: warning
            - label: 取决于设计
              tone: neutral
            - label: 有条件的公开证据
              tone: neutral
    approximationNotes: 定性类别为分析师综合判断；指定证据不支持数值概率、损失估算或缓解有效性评分。
    claimRefs:
      - CR008
      - CR009
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 强劲的规模信号被融资数据冲突与缺失的价格分母抵消，因此建议有条件地继续研究。
    data:
      nodes:
        - id: reported-mark
          label: 已报道的 USD 5B 估值
          detail: 2025 年 12 月反复出现，但没有公开轮次经济数据。
        - id: operating-scale
          label: 运营规模信号
          detail: 家庭客户增长、销售额、资费定位与公司盈利能力主张。
        - id: funding-conflict
          label: 融资总额冲突
          detail: 指定来源报告的总额分别为 USD 91.3M、USD 200M 与 USD 250M。
        - id: denominator-gap
          label: 缺失定价分母
          detail: 没有披露 EV/收入倍数，也没有核对一致的集团财务桥接。
        - id: entry-gate
          label: 入场门槛
          detail: 要求经审计的经济数据、现金与债务、股权结构表及证券条款。
        - id: recommendation
          label: 继续研究
          detail: 中等置信度、高风险与偏高的估值立场。
      edges:
        - from: reported-mark
          to: operating-scale
        - from: operating-scale
          to: funding-conflict
        - from: funding-conflict
          to: denominator-gap
        - from: denominator-gap
          to: entry-gate
        - from: entry-gate
          to: recommendation
    approximationNotes: 该流程是定性决策顺序，不是估值模型或概率估计。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
      - CV016
