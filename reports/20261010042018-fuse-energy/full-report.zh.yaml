  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              投资建议为继续研究，信心中等、风险高，估值判断偏高。多个独立数据页面反复给出 2025 年 12 月 USD 5 billion
              的估值，但公开记录不足以把这一估值转化为可投资价格。最强的经营信号是规模，而非现金流证明：据报道，截至 2026 年 6 月，公司服务的家庭超过 300,000 户；一份二手摘要引用的最新年度销售额为 GBP
              129.7 million。一份归因于公司的报告还称，Fuse 自 2025 年 12 月起每月 EBITDA
              均为正，但这不是经审计的现金流报表，也不能证明自由现金流、营运资金需求或项目融资敞口。因此，入场纪律应设为条件式：在设定目标回报或可接受估值前，要求取得经勾稽的集团收入与利润率桥接表、当前现金和债务、证券条款，以及完全稀释后的股权结构表。
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV016
      - number: '8.2'
        title: 投资逻辑、反向逻辑与融资背景
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是：家庭快速采用、低价定位和垂直一体化能源模式，可能造就一家规模化挑战者，并打开多条变现路径。Fuse 销售计费预测、EV 充电、太阳能上网电量和多物业管理；Uswitch 则独立描述其资费在 2025
              年和 2026 年持续处于最低价行列。反向逻辑是，上一轮私募估值的上涨速度可能超过了可验证的经济基本面：Wikipedia 总结称，估值从 2025 年 7 月约 USD 1 billion 升至 2025 年
              12 月约 USD 5 billion，而现有融资数据库给出的累计融资额分别为 USD 91.3 million、USD 200 million 和 USD 250
              million。这些总额不能与可用现金混为一谈，彼此分歧也使可靠还原稀释情况成为不可能。某个市场数据页面明确表示，任何一轮融资都未披露
              EV/收入。因此，公开证据支持的是公司的增长势头，而不是精确价格或优先股堆叠。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              在分母可靠之前，情景分析应保持定性。乐观情景需要经审计的集团经济数据来验证盈利增长，还需要确保入场结构在上一份报告的估值之上留有空间。基准情景承认客户和销售势头，但不提供估值区间，因为公开来源无法勾稽集团收入、法定收入、ARR
              或融资所得。悲观情景则叠加倍数压缩、能源市场波动、营运资金压力和不利融资条款；Uswitch
              指出，尽管认为失败的可能性不高，能源市场仍充满挑战且难以预测。退出准备度同样未经证明：规模可以吸引战略买家或公开市场兴趣，但这里没有关于审计准备度、治理深度、正常化现金创造能力或流动性权利的公开证据。投资逻辑被打破的触发因素包括无法勾稽已报告指标、客户经济性恶化、下轮融资，以及重大的监管和流动性约束。最终尽调应取得经审计账目、月度队列和贡献数据、对冲及抵押品明细、债务文件、完全稀释后的股权结构表、清算优先权，以及每笔近期融资的新股与老股交易分配。
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
