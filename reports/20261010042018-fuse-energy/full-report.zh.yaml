  - id: TV002
    title: 正向论点与反向论点
    columns:
      - 观察角度
      - 有证据支持的论点
      - 哪些信息会改变判断
    rows:
      - - 正向论点
        - 截至 2026 年 6 月，据报道客户家庭超过 300,000 户。
        - 经审计的留存率与贡献利润率将强化规模逻辑。
      - - 正向论点
        - Uswitch 称，Fuse 在 2025 年和 2026 年期间提供了市场上最便宜的部分资费。
        - 若有证据证明低价能在单位经济性为正的情况下持续，护城河逻辑会更有力。
      - - 正向论点
        - 公司营销 EV 充电、太阳能外送、账单预测与多物业工具。
        - 经核实的产品附加率与各产品毛利将说明产品广度是否创造价值。
      - - 反向论点
        - 已报道的非公开估值在 2025 年从约 USD 1 billion 升至约 USD 5 billion。
        - 基于经审计集团收入与现金创造能力的可辩护倍数将降低估值风险。
      - - 反向论点
        - 公开融资总额区间为 USD 91.3 million 至 USD 250 million。
        - 股权结构表与融资台账将厘清募资所得、稀释与投资者权利。
      - - 反向论点
        - 指定的市场数据证据未披露任何一轮融资的 EV/收入。
        - 轮次文件与经核对的分母将使价格比较成为可能。
    notes: 截至运行日期的公开来源快照；公司发布的产品与盈利能力主张与独立摘要分开处理，已募集资金不视为可用现金。
