              资本、批发市场准入、电网运营商和与 Solana 关联的代币设计是最清晰的外部依赖。Tracxn 报道融资规模可观，但融资额不是不受限制的可用现金，
              也没有披露营运资本、抵押物或建设承诺。若尽调发现牌照限制、未补救的抵押违约、反复出现重大预测或计费错误，或电网里程碑已不再支持项目经济性， 应暂停投资。偏离据报 SEC no-action
              立场所依据的代币结构，是另一项法律触发器。这些是监测规则，不是声称触发器已发生；完成尽调需要管理层提供额度、 对手方、审计结果、事故日志、集中度和董事会批准的整改负责人证据。
            claimRefs:
              - CR009
              - CR010
              - CR011
