      - number: '3.3'
        title: 能力比较、电价结构与产品组合
        blocks:
          - type: paragraph
            body: >-
              供应商之间在激进定价和产品复杂度之间存在取舍。E.ON Next 以 Next Drive Smart 电价积极争夺家庭 EV 市场，午夜至 6:00 AM 的低谷电价降至 6.9p/kWh， 固定方案为
              8.5p/kWh；Fuse 目前没有专有 EV 电价，而是以 £899 的固定费用安装 Easee One 智能充电器，让客户搭配第三方分时电价。 在核心零售产品上，Fuse 提供 12 个月和 13
              个月固定合约，以及低于 Ofgem 上限的标准浮动电价；应用每 30 分钟更新用量，按实际消费扣款并提供在线聊天，
              完全不设电话客服和传统预付费电表。这种精简模式改善单位经济性，却排斥非数字用户和依赖预付费设施的家庭，也把可服务市场限定为熟悉科技且信用正常的消费者。
