    title: 收入模型与利润转化桥
    type: flow
    summary: 将自有发电与批发交易转化为客户总收入和运营 EBITDA 的运营与财务链路。
    data:
      nodes:
        - id: generation
          label: 可再生发电资产
          description: 自有太阳能农场与陆上风机，生产零碳电力
        - id: trading
          label: 算法能源交易台
          description: 内部交易系统，平衡预测与批发市场采购
        - id: retail-supply
          label: 家庭零售供电网络
          description: 持牌零售业务，为超过 300,000 个英国家庭账户供电
        - id: gross-billing
          label: 客户账单（$550M 运行率）
          description: 客户每月直接借记，带来 2026 年中年化 $550M ARR
        - id: energy-cogs
          label: 批发销货成本与平衡
          description: 电力采购、电网平衡费用与网络分销费
        - id: net-margin
          label: 运营利润与 EBITDA
          description: 据报道，2025 年 12 月后 EBITDA 月度运行率为正
      edges:
        - from: generation
          to: trading
          label: 发电输入
        - from: trading
          to: retail-supply
          label: 对冲后的电力交付
        - from: retail-supply
          to: gross-billing
          label: 月度零售回款
        - from: gross-billing
          to: energy-cogs
          label: 批发能源成本
        - from: energy-cogs
          to: net-margin
          label: EBITDA 转化
