chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与垂直整合运营模式
        blocks:
          - type: paragraph
            body: >
              Fuse Energy 是英国受监管能源零售领域的激进挑战者，2022 年由 Revolut 前高管 Alan Chang 和 Charles Orr 创立。 它不是轻资产计费中介或纯零售转售商——这类模式在
              2021 至 2022 年批发天然气危机中导致近 30 家英国供应商倒闭—— 而是按垂直整合能源公用事业来搭建。公司把自研算法批发交易、自有太阳能和风能资产，以及面向消费者的电力和天然气零售结合起来，
              试图通过掌握完整能源供应链，为用户提供更低成本的电力。

              其商业方案以手机界面管理固定和浮动家庭电价，提供自动化的 30 分钟计费预测、智能电表数据透明度、EV 充电电价， 以及英国 Smart Export Guarantee
              下的微型发电上网。公司称，去掉第三方经纪商利润并用自研软件优化批发对冲后， 相比传统英国供应商，运营效率提高约 17%。截至 2026 年中，客户连接数超过 300,000 个家庭，成为增长最快的现代挑战者之一。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO014
