  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与支出范围
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy 专注于大不列颠家庭电力和天然气零售供应市场，同时拥有垂直整合的可再生能源资产和算法批发交易业务。
              这一边界很重要，因为“能源”往往涵盖商业模式、利润率和资本密度差异极大的工业子行业。公司的商业重点是家庭双燃料供应， 收入来自受监管的单位电价和固定费用；范围明确排除 Caplight 跟踪的深科技核聚变研发公司
              Fuse Energy Technologies， 也排除美国 Fuse Energy LLC 这类无关联的商业和市政能源经纪商。公司在英国家庭能源零售市场以 100% 可再生电力、
              有竞争力的双燃料电价、自动化手机开户和智能设备优化竞争。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
