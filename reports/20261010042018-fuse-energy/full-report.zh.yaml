      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              家庭能源零售的采用由希望直接节省账单、并简化数字账户管理的付款人驱动。Fuse Energy 将客户分成四类：重视成本的双燃料转用者、 寻求智能充电电价的 EV
              车主、装有屋顶太阳能的产消者家庭，以及拥有多处房产的房东。手机优先的转用流程允许潜在客户上传旧账单， 不用呼叫中心、三分钟内完成供应商切换。预算由家庭账单付款人掌握，采用触发因素包括每 30
              分钟更新的月度预测、持续低于 Ofgem 上限的电价， 以及与家用 EV 充电器和智能上网补偿方案的集成。
            claimRefs:
              - CM001
              - CM004
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM010
      - number: '2.4'
        title: 采用约束、监管风险与规模缺口
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy 虽快速获取家庭客户，但英国零售公用事业市场受薄毛利、高营运资本需求和 Ofgem 严格监管约束。2021–2022 年能源危机中， 约 30
              家家庭供应商因批发价格波动、对冲不足和未对冲的价格上限风险停业。公司试图用 60+ MW 自有风光资产和机器学习交易台缓解这些风险。 但尽调缺口仍大：2025 年 12 月 $5B 私人估值和截至 2026 年
              6 月累计融资 $250M，无法在缺少经审计客户流失、获客成本和单户贡献毛利的情况下， 与法定账目显示的 2024 年 £10M–£50M 收入完全勾稽。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 垂直整合是市场防御
            body: Fuse Energy 把自有可再生能源、算法批发交易和零售供应结合起来，试图缓冲薄毛利和批发价格暴露；正是后者导致 2021–2022 年危机中 30 家英国能源供应商破产。
            calloutType: insight
            claimRefs:
              - CM002
              - CM009
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 英国家庭零售能源格局与挑战者定位
        blocks:
          - type: paragraph
            body: >-
              英国家庭能源市场仍在经历 2021–2022 年危机后的重组：29 家资本不足的零售供应商倒闭，超过四百万个客户账户被转移。市场如今分为大型传统供应商和技术驱动的敏捷挑战者。Fuse Energy 于 2023
              年 7 月进入英国，成为危机后首家获新牌照的家庭供应商，将自己定位为由 Revolut 前高管创办的精简、金融科技式公用事业。它直接对标 British Gas（Centrica）和 E.ON Next，并挑战
              Octopus Energy 的市场领导地位。传统供应商拥有庞大客户基础、全国品牌和电话支持网络，但成本和旧 IT 架构沉重；Fuse 则采用数字优先战略，以自动切换和有竞争力的单位价格压低 Ofgem
              默认上限。由于家庭电气和天然气本质上完全同质，挑战者差异化仍很脆弱；Fuse 必须靠运营效率和实体可再生能源资产，而非传统呼叫中心来降低账单。
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP012
              - CP014
      - number: '3.2'
        title: 传统供应商与科技竞争者画像
        blocks:
          - type: paragraph
            body: >-
              竞争者在规模、资本和运营架构上差异明显。Octopus Energy 是公用事业转型的标杆，客户账户超过七百万，并将 Kraken 客户运营软件与智能电价、EV 产品及电话支持结合。相比之下，Fuse 在
              2026 年初约服务 200,000 户，虽没有 Octopus 或 British Gas 的资产负债表和客户规模，却在四轮融资中获得 $250 million，投资者包括 Balderton
              Capital、Lowercarbon Capital 和 Accel。这笔资金提供流动性缓冲，让公司维持合规以上的监管抵押金并建设自有风光电站；British Gas 和 E.ON Next
              则靠规模及多产品家庭服务留住偏好传统服务的客户。
            claimRefs:
