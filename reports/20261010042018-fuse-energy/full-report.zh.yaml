      - number: '2.2'
        title: 市场规模视角、增长驱动与估值语境
        blocks:
          - type: paragraph
            body: >-
              评估 Fuse Energy 的市场机会不能只看一个投机性的总市场数字。英国每年家庭能源零售支出超过 £30B，覆盖约 28M 户家庭， 账单受 Ofgem 价格上限约束；其中可服务市场约为
              £8B–£12B，即主动从传统供应商转向绿色、数字优先挑战者的家庭。可获取市场从 2025 年 7 月的 50,000 户增长到 12 月的 200,000 户，并在 2026 年 6 月超过 300,000
              户。The Sunday Times 100 Tech 报道的最新年销售额为 £129.7M，三年增长率为 484%。但要支撑 $5B 投后私人估值，
              仍需长期获得极高市场份额或实现软件式毛利率扩张，而法定申报尚未证明这一点。
            claimRefs:
              - CM003
