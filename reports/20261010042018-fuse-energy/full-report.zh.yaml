      - number: '3.4'
        title: 切换摩擦、下行风险与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              家庭能源零售的竞争护城河受监管和切换行为严格限制：数字切换不到三分钟，智能电表通过全国网络自动上报，且 Ofgem 禁止供应商在固定合同最后 49 天处罚客户。 其余时间 Fuse 每种燃料收取 £50、双燃料
              £100 的退出费，普通家庭需持续节省约 12–15 个月才能抵消。Ofgem 还禁止歧视性获客电价， 防止新客户享受亏损引流而老客户承担更高价格。Sifted
              的调查显示，批发波动和服务基础设施扩张经常造成数百万英镑亏损和净利率压缩。 Fuse 最终须扩大高毛利硬件安装，并用自有发电资产隔离交易台的批发商品冲击。
            claimRefs:
              - CP008
