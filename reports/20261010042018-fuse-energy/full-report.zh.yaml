      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的盈利增长、可持续的低价获客与有利的证券条款。
        - 若协商入场价低于最近一次报道的估值，或保护更充分，可能支撑风险投资回报；没有公开证据足以支撑可行的估值区间。
        - 待经审计经济数据后分配。
        - 增长延续，但现金转化或单位利润率未通过验证。
      - - 基准
        - 客户规模继续扩大，但经济性与融资条款仍属非公开信息。
        - 没有数值公允价值区间；待收入、利润率、现金、债务与稀释情况核对后再定价。
        - 与当前证据集最为一致。
        - 融资以更弱条款或更低估值完成。
      - - 悲观
        - 能源波动、抵押品需求、疲弱的队列经济性或倍数压缩占据主导。
        - 若 USD 5 billion 估值包含未经验证的增长，且优先权安排削弱普通股所得，资本损失是可能的。
        - 可能发生，但无法从公开证据量化。
        - 流动性压力、监管限制、客户恶化或下轮融资估值下调。
    notes: 情景仅用于指示方向，因为公开证据缺少经审计的集团财务、完全稀释后的所有权、债务与抵押品细节、证券优先权及可比交易倍数；概率与估值区间均未臆造。
    claimRefs:
