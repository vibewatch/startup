              - CO007
              - CO013
      - number: '1.4'
        title: 运营规模、实体发电资产与报告歧义
        blocks:
          - type: paragraph
            body: >
              Fuse Energy 正逐步把垂直整合战略落到英国的实体可再生能源基础设施。公司 2023 年收购 Bullous Park 和 Netley North 太阳能农场， 2025 年投运 Netley
              Central，2026 年又从 Pelagic Energy Development 收购南威尔士 20 MW 的 Cwm Ifor 项目和沃里克郡 25 MW、 可直接建设的 Sherbourne Solar
              项目。加上苏格兰 Moray 的 Balnamoon 陆上风机，公司正推进 1 GW 清洁发电管线，为零售电力承诺提供实体支持。

              评估 Fuse Energy 也必须面对明显的报告差异和信息壁垒。公司宣布自 2025 年 12 月起每月 EBITDA 均为正，并称 2026 年初年化收入跑率达到
              €472M（$550M）；但第三方数据库估计从个位数百万到未经核实的跑率说法不等。二级交易平台还常把英国零售能源挑战者与 2018 年由 Jean Btaiche 创立、总部在 Palo Alto 的聚变开发商
              Fuse Energy Technologies 混为一谈。确认真实经营表现最终需要经审计的法定财报， 对毛利、客户流失和对冲现金流进行勾稽。
            claimRefs:
              - CO005
              - CO008
              - CO009
              - CO011
