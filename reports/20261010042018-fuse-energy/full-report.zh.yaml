      - number: '1.2'
        title: 管理层与关键人物架构
        blocks:
          - type: paragraph
            body: >
              Fuse Energy 的战略执行和运营理念深受创始团队在伦敦金融科技公司 Revolut 的经历影响。CEO Alan Chang 曾任 Revolut 首席营收官和早期高管，
              负责全球变现和算法交易；联合创始人 Charles Orr 带来了早期金融科技扩张和监管运营经验。这种共同背景推动了快速产品迭代、 精简团队、以全天候应用内消息取代传统呼叫中心，以及数据驱动的组织文化。

              这套背景带来传统公用事业少见的算法和金融工程能力，但也使公司高度依赖 Chang。Chang 是主要战略负责人、融资代表和交易系统技术架构师。 为支持扩张，公司聘请项目负责人 Andrew Gorder
              等基础设施专家开发可再生能源资产。2026 年中，公司员工超过 400 人， 并在 Canary Wharf 的 One Bank Street 租用 32,000
              平方英尺总部，运营趋于成熟，但创始团队仍保持紧密控制。
            claimRefs:
              - CO001
              - CO003
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: 融资历史、股权结构表动态与估值倍数
        blocks:
          - type: paragraph
            body: >
              Fuse Energy 的资本轨迹体现出传统公用事业基础设施少见的激进风投支持。公司 2022 年 9 月完成由 Balderton Capital 和 Lakestar 领投的 $78M
              种子轮，Accel、Creandum 和 Lowercarbon Capital 等一线机构跟投；2025 年 7 月又获得 $10M 追加融资。 2025 年 12 月，公司完成由 Balderton 和
              Lowercarbon Capital 联合领投的 $70M Series B，QuantumLight、Creandum 和 Latitude Ventures 参与， 估算投后估值达到
              $5B，跻身欧洲增长最快的气候科技独角兽。

              2026 年 6 月，公司从 Collaborative Fund 和 20VC 获得额外 €25M（$30M）并延长 Series B，使累计股权融资约达 $250M。 但 $5B
              估值相对实缴股本和传统公用事业盈利指标存在巨大溢价。独立二级市场资料强调，完整股东名册、清算优先权、
              表决权股份类别以及原始发行与老股转让的分配仍属严格保密的私人记录；尽调必须核查结构化权利是否抬高了相对普通股价值的投后估值。
            claimRefs:
              - CO006
              - CO007
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
