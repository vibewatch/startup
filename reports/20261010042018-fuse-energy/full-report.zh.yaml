        title: 展示项
        blocks:
          - type: callout
            title: 垂直整合与算法交易效率
            body: Fuse Energy 自研预测算法并收购可再生能源资产，据报运营效率比传统供应商高 17%，且自 2025 年末起每月 EBITDA 均盈利。
            calloutType: strength
