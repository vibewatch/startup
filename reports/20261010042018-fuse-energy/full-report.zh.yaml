      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把融资等同于现金跑道
            body: 据报融资证明的是筹资额，不是无限制现金、抵押空间、当前消耗，或可用于发电项目和零售营运资本的现金。
            calloutType: risk
            claimRefs:
