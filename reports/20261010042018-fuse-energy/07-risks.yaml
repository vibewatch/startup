company:
  name: "Fuse Energy"
chapter:
  number: 7
  title: "Risks"
  summary: "Fuse Energy's highest-underwritten exposure is the combination of low-price retail positioning, volatile wholesale procurement, and an undisclosed hedge, collateral, and liquidity profile. Licensing, grid-delivery, model-reliance, capital-dependency, and conditional token-regulatory risks are identifiable, but the assigned public evidence does not establish incident history, mitigation controls, or cash runway."

sections:
  - id: "ranked-risk-profile"
    title: "Ranked Risk Profile"
    body: >-
      Retail margin and liquidity risk ranks first because Fuse is independently described as
      offering some of the market's cheapest tariffs while its own procurement discussion
      acknowledges wholesale-price, subsidy, and renewable-intermittency volatility. That
      combination does not prove a loss or inadequate hedge, but it makes hedge coverage,
      collateral calls, and tariff repricing the first diligence items. Operational delivery
      ranks next: Fuse publicly promises frequently updated bill forecasts and a broader EV,
      solar-export, and smart-device experience, while secondary reporting describes an
      in-house forecasting process used for wholesale purchasing. Regulatory, grid, financing,
      and token risks remain material, but their likelihood cannot be responsibly quantified
      from this source set.
    claimRefs:
      - "CR003"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    figureRefs:
      - "FR001"

  - id: "regulatory-legal"
    title: "Regulatory and Legal Exposure"
    body: >-
      Fuse operates inside the regulated Great Britain household-supply perimeter, and public
      secondary evidence reports an Ofgem gas-supply licence granted in 2024. The company also
      says its commercial offer is not yet live, which limits the relevance of its own general
      PPA discussion to future rather than current operations. In the United States, a
      secondary report says SEC staff no-action relief for the ENERGY token depends on
      preserving the submitted token structure; this is conditional staff posture, not broad
      approval of every future token design or jurisdiction. The assigned evidence includes no
      direct regulator, court, complaint, enforcement, privacy, safety, or incident record, so
      that absence is treated as an evidence gap rather than evidence that no issue exists.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"

  - id: "operations-and-quality"
    title: "Operational, Quality, and Grid Delivery Risk"
    body: >-
      Execution spans customer billing, app-based forecasts, wholesale purchasing, distributed
      energy coordination, and physical generation projects. Fuse's site says bill forecasts
      refresh every 30 minutes, while secondary reporting attributes property-level demand
      forecasting and wholesale balancing to the company. Those statements establish model
      dependence, but not model accuracy, override controls, outage recovery, or realized
      balancing losses. Grid exposure is similarly concrete but incompletely mitigated: the
      company itself describes connection capacity and upgrade costs as procurement
      considerations, and secondary reporting identifies acquired 20 MW and 25 MW solar
      projects, with the latter targeting a 2027 connection. Public customer growth increases
      the operating surface, but complaint and reliability data are missing.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"

  - id: "dependencies-and-kill-criteria"
    title: "Dependencies, Monitoring Indicators, and Thesis-Break Triggers"
    body: >-
      Capital, wholesale-market access, grid operators, and the Solana-linked token design are
      the clearest external dependencies. Tracxn reports substantial funding, but funding
      raised is not unrestricted cash available and does not disclose working-capital,
      collateral, or construction commitments. Investment should pause if diligence reveals a
      licence restriction, an unremedied collateral breach, repeated material forecast or
      billing errors, or grid milestones that no longer support project economics. A departure
      from the token structure underlying the reported SEC no-action position is a separate
      legal trigger. These are monitoring rules, not claims that any trigger has occurred.
      Closure requires management evidence on limits, counterparties, audit results, incident
      logs, concentration, and board-approved remediation ownership.
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"

