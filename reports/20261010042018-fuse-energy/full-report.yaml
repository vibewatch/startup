chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Vertically Integrated Operating Model
        blocks:
          - type: paragraph
            body: >
              Fuse Energy represents an ambitious challenger model within the United Kingdom's regulated energy retail
              sector, established in 2022 by former Revolut executives Alan Chang and Charles Orr. Rather than operating
              merely as an asset-light billing intermediary or pure retail reseller—a structural vulnerability that
              triggered the collapse of nearly thirty British suppliers during the 2021 to 2022 wholesale gas
              crisis—Fuse Energy was architected as a vertically integrated energy utility. The company combines
              in-house algorithmic wholesale power trading, owned renewable generation assets such as solar and wind
              installations, and consumer-facing retail electricity and natural gas distribution. Its stated corporate
              mission focuses on challenging traditional utility scarcity narratives by delivering lower-cost power
              through full-stack ownership of the energy supply value chain.


              The commercial proposition centers on fixed and variable domestic tariffs managed through an intuitive
              mobile interface, offering automated 30-minute billing projections, smart meter data transparency,
              electric vehicle charging tariffs, and micro-generation export integration under the UK Smart Export
              Guarantee. By eliminating third-party broker margins and optimizing wholesale power hedging through
              proprietary software models, Fuse Energy reports operational efficiency improvements of approximately 17%
              relative to legacy British incumbents. By mid-2026, the supplier scaled its customer portfolio to over
              300,000 domestic household connections across Great Britain, positioning itself among the fastest-growing
              modern challengers in the domestic utility landscape.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO014
