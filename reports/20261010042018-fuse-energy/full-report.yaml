        title: Revenue Streams and Tariff Monetization
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy monetizes its clean utility platform primarily through domestic retail dual-fuel energy supply
              contracts across Great Britain. Customers contract for residential electricity and natural gas delivered
              through standard metered tariffs that promise annual savings of up to £200 compared with standard default
              price-cap rates. The commercial offering pairs retail utility billing with 100% green-certified
              electricity as standard, underpinned by physical off-take from company-owned renewable generation assets.
              In addition to core domestic supply, the company has deployed specialized electric vehicle tariffs and
              export programs under Ofgem's Smart Export Guarantee, creating supplementary recurring revenue streams
              from distributed flexibility assets and smart meter integration.
