      - number: '3.4'
        title: Switching Frictions, Downside Risk, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The durability of competitive moats in domestic energy retail is heavily bounded by regulatory
              architecture and customer switching dynamics. The UK regulatory framework actively suppresses switching
              friction: digital switches take under three minutes to submit, smart meters communicate readings
              automatically via national data networks, and Ofgem rules prohibit suppliers from penalizing customers
              during the final 49 days of fixed contracts. Outside this switching window, Fuse Energy enforces a
              standard £50 per fuel exit fee (£100 for dual fuel), which requires roughly 12 to 15 months of sustained
              tariff savings for an average household to offset. More critically, Ofgem’s prohibition on discriminatory
              acquisition tariffs prevents suppliers from offering exclusive loss-leading introductory deals to new
              sign-ups while charging higher rates to established customers. This rule ensures equity across consumer
              cohorts but severely limits the ability of challengers to execute predatory customer acquisition
              campaigns. Furthermore, investigative reporting from Sifted underlines the substantial financial pressures
              confronting fast-growing energy challengers: navigating wholesale price volatility and scaling customer
              service infrastructure frequently results in multi-million pound operating losses and compressed net
              margins. For Fuse Energy, maintaining differentiation against well-funded incumbents will ultimately
              depend on expanding high-margin hardware installations and leveraging proprietary generation assets to
              insulate its trading desk from wholesale commodity shocks.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commoditization Pressure in Core Retail Supply
            body: >-
              Because domestic electricity and gas electrons are completely fungible, retail energy tariffs face severe
              commoditization. Competitors such as Octopus Energy and E.ON Next can replicate aggressive unit pricing or
              overnight EV charging discounts, limiting Fuse Energy's pricing power to thin operating margins unless
              backed by proprietary low-cost generation or sticky software lock-in.
            calloutType: risk
            claimRefs:
              - CP001
              - CP004
              - CP014
          - type: callout
            title: The Vulnerability of Acquisition Pricing
            body: >-
              Ofgem's regulatory ban on discriminatory acquisition tariffs ensures that competitive prices must also be
              offered to existing customer cohorts. While this simplifies customer retention, it limits challenger
              suppliers' ability to loss-lead exclusively for rapid top-line subscriber acquisition without eroding
              margin across the existing book.
            calloutType: insight
            claimRefs:
              - CP008
              - CP011
  - number: 4
    title: Financials
    sections:
