        - More than 300,000 households were reported by June 2026.
        - Audited retention and contribution margins would strengthen the scale case.
      - - Thesis
        - Uswitch says Fuse offered some of the market's cheapest tariffs through 2025 and 2026.
        - Evidence that low prices persist with positive unit economics would strengthen the moat case.
      - - Thesis
        - The company markets EV charging, solar export, billing forecasts, and multi-property tools.
        - Verified attach rates and gross profit by product would show whether breadth adds value.
      - - Anti-thesis
        - The reported private mark rose from about USD 1 billion to about USD 5 billion during 2025.
        - A defensible multiple based on audited group revenue and cash generation would reduce valuation risk.
      - - Anti-thesis
        - Public funding totals range from USD 91.3 million to USD 250 million.
        - A cap table and financing ledger would resolve proceeds, dilution, and investor rights.
      - - Anti-thesis
        - The assigned market-data evidence does not disclose EV/revenue for any round.
        - Round documents and a reconciled denominator would make price comparison possible.
    notes: >-
      Public-source snapshot as of the run date; company-issued product and profitability claims are distinguished from
      independent summaries, and funding raised is not treated as cash available.
