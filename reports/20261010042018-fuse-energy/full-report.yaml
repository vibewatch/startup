      - number: '2.2'
        title: Market Sizing Lenses, Growth Drivers, and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total market opportunity for Fuse Energy requires multiple sizing lenses rather than a
              single speculative top-line figure. Great Britain's total domestic energy retail expenditure exceeds £30
              billion annually across roughly 28 million households whose bills are governed by Ofgem price cap
              determinations. Within this total addressable market, the serviceable addressable market comprises the £8
              billion to £12 billion segment of households actively switching away from legacy suppliers toward green,
              digital-first challenger utilities. Fuse Energy's serviceable obtainable market has demonstrated rapid
              early trajectory, expanding from 50,000 homes in July 2025 to 200,000 households by December 2025, and
              surpassing 300,000 households by June 2026. This customer expansion propelled latest reported annual sales
              to £129.7 million in The Sunday Times 100 Tech ranking, representing a three-year growth rate of 484
              percent. However, supporting a $5 billion post-money private valuation requires extraordinary long-term
              market share capture or software-like gross margin expansion that remains unproven in statutory filings.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
