  - id: FR001
    title: 'Risk Heatmap: Impact, Likelihood Signal, and Mitigation Maturity'
    type: matrix
    summary: The matrix separates evidenced exposure from unquantified probability and mostly unverified mitigation maturity.
    data:
      columns:
        - label: Impact if realized
          detail: Analyst severity based on the operating surface supported by cited sources.
        - label: Likelihood signal
          detail: Public signal only; not a modeled event probability.
        - label: Mitigation maturity
          detail: Only public evidence is scored; private controls may exist.
      rows:
        - label: Wholesale margin and liquidity
          note: Low-price positioning meets acknowledged market volatility.
          values:
            - label: Critical
              tone: critical
            - label: Recurring exposure; probability unquantified
              tone: warning
            - label: Unverified
              tone: warning
        - label: Regulatory supply perimeter
          note: Operating licence evidence does not establish control effectiveness.
          values:
            - label: High
              tone: critical
            - label: Ongoing obligation
              tone: warning
            - label: Partial public evidence
              tone: neutral
        - label: Forecasting and balancing
          note: Forecast use is described; performance and overrides are not.
          values:
            - label: High
              tone: critical
            - label: Unquantified
              tone: neutral
            - label: Unverified
              tone: warning
        - label: Grid and project delivery
          note: Projects and grid constraints are public; agreements are not.
          values:
            - label: High
              tone: critical
            - label: Project-specific
              tone: neutral
            - label: Partial public evidence
              tone: neutral
        - label: Capital availability
          note: Funding history is not a current liquidity measure.
          values:
            - label: High
              tone: critical
            - label: Unquantified
              tone: neutral
            - label: Unverified
              tone: warning
        - label: Token design and rewards layer
          note: Reported SEC posture is conditional on the submitted structure.
          values:
            - label: Medium
              tone: warning
            - label: Design-dependent
              tone: neutral
            - label: Conditional public evidence
              tone: neutral
    approximationNotes: >-
      Qualitative categories are analyst synthesis; the assigned evidence does not support numeric probabilities, loss
      estimates, or mitigation-effectiveness scores.
    claimRefs:
      - CR008
      - CR009
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong scale signals are offset by financing-data conflict and missing price denominators, leading to a
      conditional research-more recommendation.
    data:
      nodes:
        - id: reported-mark
          label: Reported USD 5B mark
          detail: Repeated for December 2025, but not accompanied by public round economics.
        - id: operating-scale
          label: Operating scale signals
          detail: Household growth, sales, tariff positioning, and a company profitability claim.
        - id: funding-conflict
          label: Funding totals conflict
          detail: Assigned sources report USD 91.3M, USD 200M, and USD 250M totals.
        - id: denominator-gap
          label: Pricing denominator missing
          detail: No disclosed EV/revenue multiple or reconciled group financial bridge.
        - id: entry-gate
          label: Entry gate
          detail: Require audited economics, cash and debt, cap table, and security terms.
        - id: recommendation
          label: Research more
          detail: Medium confidence, high risk, and a stretched valuation stance.
      edges:
        - from: reported-mark
          to: operating-scale
        - from: operating-scale
          to: funding-conflict
        - from: funding-conflict
          to: denominator-gap
        - from: denominator-gap
          to: entry-gate
        - from: entry-gate
          to: recommendation
    approximationNotes: The flow is a qualitative decision sequence, not a valuation model or probability estimate.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
      - CV016
