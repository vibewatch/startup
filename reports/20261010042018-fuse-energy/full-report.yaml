  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Scope
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy operates specifically within the domestic retail electricity and natural gas supply market in
              Great Britain, supplemented by vertically integrated renewable generation assets and proprietary
              algorithmic trading operations. Defining this market boundary is essential because 'energy' frequently
              encompasses disparate industrial sub-sectors that carry vastly different business models, margin profiles,
              and capital intensity. Fuse Energy's commercial focus is domestic household dual-fuel supply, where the
              business earns revenue directly from retail consumers through regulated unit tariffs and standing charges.
              This boundary explicitly excludes deep-tech nuclear fusion R&D—such as Caplight-tracked Fuse Energy
              Technologies—as well as third-party commercial and municipal energy brokerage, such as US-based Fuse
              Energy LLC, an unaffiliated consultancy operating across deregulated North American utility markets.
              Within Great Britain's domestic energy retail sphere, Fuse Energy competes by offering 100% renewable
              electricity, competitive dual-fuel tariffs, automated mobile app onboarding, and smart device
              optimization.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
