      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Wholesale Market Exposure and Unhedged Tariff Volatility
            body: >-
              Offering retail tariffs priced up to £200 below market price-caps introduces acute margin sensitivity to
              wholesale energy spikes. Without substantial owned generation capacity and rigorous long-term forward
              hedges, supplier margins remain exposed to extreme spot price movements across the UK wholesale
              electricity and gas grids.
            calloutType: risk
            claimRefs:
              - CI004
              - CI009
          - type: callout
            title: Vertical Integration Margin Cushion
            body: >-
              By developing its own solar and wind assets and running proprietary trading algorithms, Fuse Energy
              captures margin at multiple stages of the power value chain. This physical hedge structure differentiates
              its unit economics from pure retail resellers that collapsed during the 2021-2022 UK energy crisis.
            calloutType: insight
            claimRefs:
              - CI003
              - CI006
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Breakdown
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy delivers domestic and commercial energy services across Great Britain through a unified
              digital platform designed to bypass legacy utility workflows. The core offering comprises low-carbon
              domestic electricity and gas tariffs managed entirely via iOS and Android applications. Onboarding is
              engineered around rapid digital switching, enabling prospective households to complete registration in
              under three minutes through automated bill upload parsing. Beyond basic retail power supply, the company
              has expanded its commercial portfolio into residential EV charging through the Fuse EV module, as well as
              end-to-end commercial rooftop solar design and installation for UK enterprises. Forthcoming product
              modules currently on the product roadmap include smart home device optimization with token-based rewards
              and bidirectional solar-plus-battery export performance tracking, establishing a connected hardware
              ecosystem centered on residential electrification.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE010
      - number: '5.2'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Founded by former Revolut executives Alan Chang and Charles Orr, Fuse Energy reflects fintech software
              design principles applied directly to power retail. The core software infrastructure pairs modern cloud
              application runtimes with automated consumption forecasting models that ingest smart meter data every 30
              minutes. Rather than relying on traditional utility enterprise resource planning suites and manual
              customer service call centres, the operational architecture automates tariff calculation, meter
              validation, and direct-debit reconciliation. Furthermore, job specifications highlight active development
              of proprietary internal operations tools and platforms designed to manage renewable energy assets,
              installation logistics, and real-time customer telemetry. The engineering team is also designing advanced
              grid management platforms and blockchain-based reward mechanisms to orchestrate distributed energy
              resources, backed by $250 million in cumulative equity funding across seed and early-stage rounds.
            claimRefs:
              - CE002
              - CE007
              - CE009
              - CE010
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE006
              - CE009
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE009
              - CE010
              - CE015
      - number: '5.3'
        title: Customer Workflows, Integration, and Hardware Roadmap
        blocks:
          - type: paragraph
            body: >-
              Customer interaction is strictly mobile-first, eliminating paper invoicing and web-only legacy portals in
              favour of high-cadence telemetry. Households request smart meter installations directly within the mobile
              application, after which telemetry data flows from the meter through national Data Communications Company
              infrastructure into Fuse Energy's billing engine. A critical structural differentiation is the company's
              billing mechanics: independent reviews confirm that Fuse Energy bills customers strictly for actual energy
              consumed, avoiding the traditional industry practice of accumulating substantial direct-debit credit
              balances to cushion supplier working capital. For electric vehicle drivers, the Fuse EV tariff integrates
              smart wallbox charging to optimize off-peak power delivery, while future hardware integrations will
              encompass home battery systems and microgeneration export feeds to support domestic flexibility.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE011
      - number: '5.4'
        title: Regulatory Compliance, Dispute Governance, and Technical Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Operating as an Ofgem-licensed domestic supplier requires strict compliance with statutory consumer
              protection and dispute governance frameworks. Fuse Energy Supply Limited is subject to formal dispute
              resolution standards, operating a staged complaints process that issues an initial acknowledgment within
              two days, targets complete resolution by day 14, and issues a formal deadlock letter after eight weeks if
              mutual resolution cannot be reached. Unresolved disputes escalate to the statutory Energy Ombudsman, whose
              determinations are legally binding on Fuse Energy within a 28-day remedy window. Independent compliance
              registers confirm that Fuse Energy Supply Limited remains fully active and trades under statutory schemes,
              including participation in the Warm Home Discount scheme for the 2026–2027 heating season. However,
              technical reliance on external smart meter gateway networks and undisclosed penetration audit records
              represent ongoing operational diligence risks.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fintech Operational DNA Applied to UK Utility Infrastructure
            body: >-
              Founded by former Revolut executives, Fuse Energy eliminates traditional utility call-centre overhead by
              routing customer service through in-app chat and billing strictly for measured energy rather than holding
              direct-debit credit balances.
            calloutType: insight
            claimRefs:
              - CE001
              - CE007
              - CE008
          - type: callout
            title: Statutory Dispute Windows and Smart Meter Gateway Dependencies
            body: >-
              While Fuse Energy maintains a formal complaints procedure aiming for resolution within 14 days, failure to
              resolve disputes within 8 weeks triggers binding escalation to the Energy Ombudsman, and real-time billing
              remains tightly coupled to the availability of the national Data Communications Company smart metering
              network.
            calloutType: risk
            claimRefs:
              - CE002
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Profiles
        blocks:
          - type: paragraph
            body: >
              Fuse Energy's customer base is anchored in the UK domestic residential market, serving over 300,000
              households across Great Britain as of mid-2026. The company primarily targets mass-market dual-fuel
              consumers through an intuitive mobile application that simplifies onboarding and daily energy management.
              Alongside standard household electricity and gas supply, Fuse Energy has developed specialized customer
              segments, including residential electric vehicle owners utilizing dedicated overnight charging tariffs and
              domestic solar micro-generators exporting surplus electricity under the Smart Export Guarantee scheme.
              Additionally, the company is cultivating an emerging business-to-business footprint focused on commercial
              solar installations and intelligent grid balancing services. While high customer acquisition volumes have
              established meaningful scale, detailed segmentation disclosures regarding churn differentials between
              fixed and variable direct debit accounts remain undisclosed.
            claimRefs:
              - CU001
              - CU009
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU009
              - CU012
      - number: '6.2'
        title: Adoption Trajectory and Household Scale
        blocks:
          - type: paragraph
            body: >
              Fuse Energy has demonstrated rapid customer adoption since its public retail launch in July 2023,
              expanding from an initial 200-home beta trial to 50,000 electricity accounts by July 2025, 200,000
              households by December 2025, and exceeding 300,000 households by June 2026. This customer growth
              trajectory coincided with the company reporting group-level profitability and positive monthly EBITDA
              since December 2025, with revenue run rates surpassing $550 million in early 2026. Fuse Energy attributes
              this expansion to its vertically integrated operating architecture—incorporating in-house generation
              assets, proprietary wholesale trading algorithms, and automated digital demand forecasting. Management
              claims this structure lowers the cost to serve electricity by 15% to 17% relative to traditional incumbent
              suppliers. To sustain this momentum, Fuse Energy secured a $30 million Series B extension in June 2026 to
              fund international expansion across Europe and North America.
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU009
              - CU012
      - number: '6.3'
        title: Customer Experience, Satisfaction, and Deployment Proof
        blocks:
          - type: paragraph
            body: >
              Customer sentiment and deployment proof present a multifaceted picture across independent review
              benchmarks and price comparison platforms. In the Which? 2026 annual energy satisfaction survey, Fuse
              Energy secured a respectable 76% customer satisfaction score, ranking joint fifth among seventeen UK
              retail energy providers. Customers frequently commend the company for its intuitive mobile application,
              transparent monthly billing forecasts updated every thirty minutes, and paperless switching process that
              allows users to onboard in under three minutes by uploading a past bill. Furthermore, public aggregator
              ratings on Uswitch and TrustPilot average 4.8 out of 5 stars, corroborating broad domestic satisfaction
              with digital tariff management. However, customer outcomes in commercial solar design and specialized
              enterprise deployments remain documented only through aggregate company announcements, representing an
              ongoing diligence gap regarding corporate client satisfaction and contract longevity.
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU008
              - CU012
      - number: '6.4'
        title: Retention Dynamics, Service Complaints, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Despite strong top-line customer acquisition, Fuse Energy exhibits measurable operational friction and
              retention headwinds in independent assessments. Which? reported that 16% of Fuse Energy customers filed a
              formal complaint within the past year—a proportion significantly higher than established
              competitors—driven by refund delays, estimated billing despite meter submissions, and smart display
              faults. Furthermore, Which? awarded Fuse Energy a 56% supplier assessment score (ranking 13th out of 17),
              citing the complete absence of telephone support and weak procedures for assisting vulnerable households.
              Compounding these service frictions, Fuse Energy aligned its variable tariff rates with the Ofgem price
              cap in June 2026, ending its long-standing marketing claim of perpetual price undercutting. While
              strategic analysis cites 135% net dollar retention in grid software, high customer acquisition costs and
              wholesale trading counterpart concentration present critical risks as retail accounts mature.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU011
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer Support Friction and High Complaint Volume
            body: >-
              While Fuse Energy achieves strong customer satisfaction for pricing and app UX, 16% of surveyed customers
              logged formal complaints in 2025–2026. The complete absence of telephone support, paired with persistent
              refund and meter estimation friction, presents an operational risk as the customer base scales past
              300,000 households.
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Price Cap Alignment Tests Customer Retention
            body: >-
              Fuse Energy's June 2026 decision to price its variable tariffs at the Ofgem price cap removes its
              historical headline discount. Customer retention and net dollar retention will increasingly depend on
              product experience, EV charging attach rates, and smart energy features rather than raw commodity price
              undercutting.
            calloutType: insight
            claimRefs:
              - CU003
              - CU007
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Retail margin and liquidity risk ranks first because Fuse is independently described as offering some of
              the market's cheapest tariffs while its own procurement discussion acknowledges wholesale-price, subsidy,
              and renewable-intermittency volatility. That combination does not prove a loss or inadequate hedge, but it
              makes hedge coverage, collateral calls, and tariff repricing the first diligence items. Operational
              delivery ranks next: Fuse publicly promises frequently updated bill forecasts and a broader EV,
              solar-export, and smart-device experience, while secondary reporting describes an in-house forecasting
              process used for wholesale purchasing. Regulatory, grid, financing, and token risks remain material, but
              their likelihood cannot be responsibly quantified from this source set.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Fuse operates inside the regulated Great Britain household-supply perimeter, and public secondary evidence
              reports an Ofgem gas-supply licence granted in 2024. The company also says its commercial offer is not yet
              live, which limits the relevance of its own general PPA discussion to future rather than current
              operations. In the United States, a secondary report says SEC staff no-action relief for the ENERGY token
              depends on preserving the submitted token structure; this is conditional staff posture, not broad approval
              of every future token design or jurisdiction. The assigned evidence includes no direct regulator, court,
              complaint, enforcement, privacy, safety, or incident record, so that absence is treated as an evidence gap
              rather than evidence that no issue exists.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR015
              - CR016
      - number: '7.3'
        title: Operational, Quality, and Grid Delivery Risk
        blocks:
          - type: paragraph
            body: >-
              Execution spans customer billing, app-based forecasts, wholesale purchasing, distributed energy
              coordination, and physical generation projects. Fuse's site says bill forecasts refresh every 30 minutes,
              while secondary reporting attributes property-level demand forecasting and wholesale balancing to the
              company. Those statements establish model dependence, but not model accuracy, override controls, outage
              recovery, or realized balancing losses. Grid exposure is similarly concrete but incompletely mitigated:
              the company itself describes connection capacity and upgrade costs as procurement considerations, and
              secondary reporting identifies acquired 20 MW and 25 MW solar projects, with the latter targeting a 2027
              connection. Public customer growth increases the operating surface, but complaint and reliability data are
              missing.
            claimRefs:
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Dependencies, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Capital, wholesale-market access, grid operators, and the Solana-linked token design are the clearest
              external dependencies. Tracxn reports substantial funding, but funding raised is not unrestricted cash
              available and does not disclose working-capital, collateral, or construction commitments. Investment
              should pause if diligence reveals a licence restriction, an unremedied collateral breach, repeated
              material forecast or billing errors, or grid milestones that no longer support project economics. A
              departure from the token structure underlying the reported SEC no-action position is a separate legal
              trigger. These are monitoring rules, not claims that any trigger has occurred. Closure requires management
              evidence on limits, counterparties, audit results, incident logs, concentration, and board-approved
              remediation ownership.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate funding with runway
            body: >-
              Reported financing establishes capital raised, not unrestricted cash, collateral headroom, current burn,
              or cash available for generation projects and retail working capital.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
          - type: callout
            title: Gate investment on auditable controls
            body: >-
              Require hedge and collateral schedules, model validation, incident and complaint logs, grid agreements,
              liquidity evidence, and the controlling token legal documents before treating mitigation as mature.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR011
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance.
              Multiple independent data pages repeat a USD 5 billion December 2025 mark, but the public record is not
              sufficient to convert that mark into an investable price. The strongest operating signals are scale rather
              than cash-flow proof: the company was reported to serve more than 300,000 households by June 2026, and a
              secondary summary cites GBP 129.7 million of latest annual sales. A company-attributed report also says
              Fuse has been EBITDA-positive each month since December 2025, but that claim is not an audited cash-flow
              statement and does not establish free cash flow, working-capital needs, or project-finance exposure. Entry
              discipline should therefore be conditional: require a reconciled group revenue and margin bridge, current
              cash and debt, security terms, and a fully diluted cap table before assigning a target return or
              acceptable valuation.
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that rapid household adoption, low-price positioning, and a vertically integrated energy
              model could create a scaled challenger with multiple monetization paths. Fuse markets billing forecasts,
              EV charging, solar export, and multi-property management, while Uswitch independently describes its
              tariffs as consistently among the cheapest during 2025 and 2026. The anti-thesis is that the last private
              mark may have moved faster than verifiable economics: Wikipedia summarizes a rise from about USD 1 billion
              in July 2025 to about USD 5 billion in December 2025, while the available financing databases report
              cumulative funding of USD 91.3 million, USD 200 million, and USD 250 million. These totals are not
              interchangeable with cash available, and the disagreement prevents a reliable dilution reconstruction. One
              market-data page explicitly says EV/revenue was not disclosed for any round. Public evidence therefore
              supports company momentum, not the precise price or preference stack.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Scenarios, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should remain qualitative until the denominator is reliable. The bull case requires
              audited group economics to validate profitable growth and an entry structure that leaves room above the
              last reported mark. The base case recognizes customer and sales momentum but withholds a valuation range
              because the public sources do not reconcile group revenue, statutory revenue, ARR, or funding proceeds.
              The bear case combines multiple compression with energy-market volatility, working-capital pressure, and
              adverse financing terms; Uswitch notes that the energy market remains challenging and unpredictable even
              while judging failure unlikely. Exit readiness is similarly unproven: scale can attract strategic or
              public-market interest, but there is no public evidence here on audit readiness, governance depth,
              normalized cash generation, or liquidity rights. Thesis-break triggers are failure to reconcile reported
              metrics, deterioration in customer economics, a down round, or material regulatory and liquidity
              constraints. Final diligence should obtain audited accounts, monthly cohort and contribution data, hedging
              and collateral schedules, debt documents, the fully diluted cap table, liquidation preferences, and
              primary-versus-secondary allocations for each recent financing.
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
