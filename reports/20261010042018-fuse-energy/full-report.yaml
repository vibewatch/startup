        blocks:
          - type: paragraph
            body: >-
              Fuse Energy has secured cumulative venture capital funding of approximately $250M across four priced
              rounds through June 2026, most recently closing a $30M Series B extension backed by 20VC, Collaborative
              Fund, Balderton Capital, and Lowercarbon Capital. While reported monthly EBITDA profitability provides
              operating cash buffer, retail utility businesses operating at 300,000-household scale require substantial
              working capital and collateral facilities to support energy trading desk margin calls and Ofgem regulatory
              compliance. Diligence underwriters should demand full FY2025 audited financial statements, collateral
