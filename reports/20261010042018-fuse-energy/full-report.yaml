  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited profitable growth, durable low-price acquisition, and favorable security terms.
        - >-
          A negotiated entry below or better protected than the last reported mark could support venture returns; no
          public range is supportable.
        - Unassigned pending audited economics.
        - Growth persists but cash conversion or unit margins fail verification.
      - - Base
        - Customer scale continues, but economics and financing terms remain private.
        - No numeric fair-value range; defer pricing until revenue, margin, cash, debt, and dilution are reconciled.
        - Most consistent with the current evidence set.
        - A financing is completed at weaker terms or a lower mark.
      - - Bear
        - Energy volatility, collateral needs, weak cohort economics, or multiple compression dominate.
        - >-
          Loss of capital is plausible if the USD 5 billion mark embeds unverified growth and preferences impair
          common-equity proceeds.
        - Plausible but not quantifiable from public evidence.
        - Liquidity stress, regulatory constraint, customer deterioration, or a down round.
    notes: >-
      Scenarios are directional because public evidence lacks audited group financials, fully diluted ownership, debt
      and collateral detail, security preferences, and a comparable transaction multiple; probabilities and valuation
      ranges are intentionally not fabricated.
    claimRefs:
      - CV001
      - CV006
      - CV008
