      - number: '4.2'
        title: Go-To-Market Motion and Customer Acquisition Economics
        blocks:
          - type: paragraph
            body: >-
              The go-to-market model operates primarily as a direct-to-consumer digital switching channel supplemented
              by price comparison websites such as Uswitch. By eliminating traditional call centre overhead in favor of
              a 24-hour app-based customer support model, Fuse Energy aims to maintain an operating expense structure
              materially lower than legacy Big Six UK utilities. The company leverages an advertised savings proposition
              of up to £200 annually to drive switcher acquisition, expanding its customer footprint from 200,000 UK
              households in December 2025 to more than 300,000 households by June 2026. Fixed-term retail tariffs
              incorporate contractual exit fees outside the final 49-day regulatory window, providing a modest
              disincentive against immediate churn during periods of retail rate competition.
            claimRefs:
              - CI004
              - CI007
              - CI010
              - CI013
