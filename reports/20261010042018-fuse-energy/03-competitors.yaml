callouts:
  - calloutType: "risk"
    title: "Commoditization Pressure in Core Retail Supply"
    body: "Because domestic electricity and gas electrons are completely fungible, retail energy tariffs face severe commoditization. Competitors such as Octopus Energy and E.ON Next can replicate aggressive unit pricing or overnight EV charging discounts, limiting Fuse Energy's pricing power to thin operating margins unless backed by proprietary low-cost generation or sticky software lock-in."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP014"
  - calloutType: "insight"
    title: "The Vulnerability of Acquisition Pricing"
    body: "Ofgem's regulatory ban on discriminatory acquisition tariffs ensures that competitive prices must also be offered to existing customer cohorts. While this simplifies customer retention, it limits challenger suppliers' ability to loss-lead exclusively for rapid top-line subscriber acquisition without eroding margin across the existing book."
    claimRefs:
      - "CP008"
      - "CP011"
