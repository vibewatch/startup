  topStrengths:
    - Rapid reported household scale with a broad retail and flexibility product set.
    - Vertically integrated model spanning supply, generation, and trading.
    - Deep venture backing and continued investor support.
  topRisks:
    - Audited economics, working capital, hedging, and collateral needs remain opaque.
    - The $5 billion valuation and preference stack are not independently underwritten.
    - Regulatory, grid, and operational execution risk remains material.
    - Customer-service and complaint friction could weigh on retention and reputation.
  unresolvedGaps:
    - Audited bridge from reported ARR to statutory revenue, gross profit, contribution margin, and cash conversion.
    - >-
      Current cap table, security type, liquidation preferences, and primary-versus-secondary split for the December
      2025 round.
    - Current unrestricted cash, runway, collateral / hedging policy, and product-level margin waterfall.
    - >-
      Churn, cohort retention, CAC payback, complaint cost, and attach rates for EV, hardware, and software-like
      products.
    - >-
      2026 complaints, Ombudsman / Ofgem interactions, and org depth across trading, compliance, customer operations,
      and installations.
