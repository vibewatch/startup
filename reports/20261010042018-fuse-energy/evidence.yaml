evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: statutory-financial-reconciliation
    missingEvidence: >-
      Audited statutory accounts reconciling company-claimed €472M / $550M ARR and monthly EBITDA profitability to
      Companies House filings and GAAP revenue.
    whyItMatters: >-
      High headline valuation ($5 billion) cannot be fundamentally underwritten without visibility into gross margin,
      cash conversion, and regulatory capital requirements.
    diligencePath: >-
      Inspect upcoming Fuse Energy Supply Limited statutory financial statements on Companies House and request audited
      management accounts under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Full shareholder register detailing exact share classes, liquidation preferences, and founder voting control
      percentages.
    whyItMatters: >-
      Enables assessment of governance rights, dilution waterfall, and secondary transaction discounts across funding
      rounds.
    diligencePath: Examine Confirmation Statement filings on UK Companies House or request cap table schedule from company counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: valuation-underwriting-gap
    missingEvidence: >-
      Audited unit economics detailing customer acquisition cost, cohort churn, gross margin per fuel type, and
      statutory cash flow reconciliation.
    whyItMatters: >-
      Without audited unit economics and cohort retention data, underwriting the December 2025 $5 billion private
      valuation against traditional retail supply margins remains speculative.
    diligencePath: >-
      Request statutory accounts from Companies House for Fuse Energy Supply Limited and review management presentation
      on cohort contribution margins.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Verified cohort-level churn, net retention rates, and long-term customer lifetime value metrics for Fuse Energy
      compared against mature Octopus Energy cohorts.
    whyItMatters: >-
      Without audited churn data, it is impossible to evaluate whether digital-first customer acquisition retains value
      beyond the 12-month fixed contract horizon or suffers high churn once exit fees expire.
    diligencePath: >-
      Request customer cohort retention schedules, monthly churn by acquisition vintage, and post-exit-fee renewal
      statistics during diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited customer acquisition cost (CAC), churn rate by cohort, and customer lifetime value (LTV) across retail
      electricity and gas tariffs.
    whyItMatters: >-
      Without cohort retention and payback data, it is impossible to verify whether the £200 switching discount produces
      sustainable customer unit economics or is subsidized by venture equity.
    diligencePath: >-
      Request management's monthly customer cohort retention tables, marketing channel CAC breakdown, and gross margin
      per meter point.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: statutory-reporting
    missingEvidence: >-
      Audited financial statements for FY2025 and interim H1 2026 verifying statutory revenue, cost of sales, and cash
      flow.
    whyItMatters: >-
      Public sources report $550M ARR and monthly EBITDA profitability, but UK statutory filings for Fuse Energy Supply
      Limited only disclose historical turnover through FY2024 (£10M–£50M bracket).
    diligencePath: >-
      Review full statutory accounts filed at Companies House for Fuse Energy Supply Limited and parent entity Tesseract
      Limited for FY2025 and management accounts for 2026.
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: security-compliance-audit
    missingEvidence: >-
      Third-party cybersecurity audits, SOC 2 / ISO 27001 certifications, and penetration test reports for Fuse Energy's
      mobile application, smart meter telemetry pipeline, and cloud backend.
    whyItMatters: >-
      As an app-first digital supplier controlling live customer metering and payment tokens, security vulnerabilities
      or telemetry outages directly threaten billing accuracy, Ofgem compliance, and consumer trust.
    diligencePath: >-
      Request under NDA the latest independent penetration testing reports, cloud security architecture diagrams, and
      Data Communications Company (DCC) security compliance certificates.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-evidence
    missingEvidence: >-
      Audited breakdown of commercial customer contracts, enterprise case studies, and individual enterprise deployment
      terms across Fuse Energy's commercial solar installation and smart grid services.
    whyItMatters: >-
      While domestic household scale is documented at over 300,000 homes, individual enterprise and commercial
      counterparty relationships remain unlisted and cannot be independently audited for revenue contribution.
    diligencePath: >-
      Review commercial customer agreements, distributor contracts, and B2B customer references during confirmatory due
      diligence.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU003
      - QU008
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Audited cohort-level churn metrics, monthly retention curves, customer acquisition payback periods, and net
      revenue retention waterfalls across domestic dual-fuel customer cohorts.
    whyItMatters: >-
      Reported 135% net dollar retention claims stem from strategic model estimates rather than audited statutory
      filings, leaving long-term retail customer durability and churn unverified following the June 2026 tariff price
      cap alignment.
    diligencePath: >-
      Request cohort retention tables segmented by acquisition channel (direct app vs price comparison websites) and
      tariff type.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: minor
    topic: commercial-customer-concentration
    missingEvidence: >-
      Disclosure of revenue contribution from top 5 commercial energy clients or utility-scale flexibility
      counterparties.
    whyItMatters: >-
      Evaluating whether enterprise software and grid optimization expansion creates customer concentration risk
      distinct from the fragmented domestic retail base.
    diligencePath: Request customer concentration schedule and counterpart credit ratings during management diligence.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: incidents-and-enforcement
    missingEvidence: >-
      Direct regulator, court, ombudsman, privacy, safety, complaint, outage, recall, breach, and enforcement records
      for each operating jurisdiction.
    whyItMatters: >-
      Without primary incident and enforcement evidence, likelihood, remediation quality, repeat-event risk, and licence
      exposure cannot be assessed.
    diligencePath: >-
      Search the relevant regulator and court registers, then reconcile results to management's complete incident,
      complaint, and remediation logs.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: hedging-and-liquidity
    missingEvidence: >-
      Current hedge coverage, procurement limits, collateral triggers, counterparty exposures, unrestricted cash, cash
      burn, and downside liquidity stress tests.
    whyItMatters: >-
      These denominators determine whether low-price tariffs and wholesale volatility translate into manageable margin
      movement or solvency pressure.
    diligencePath: >-
      Obtain treasury schedules, counterparty statements, hedge positions, collateral facilities, board limits, and
      monthly cash-flow scenarios.
    relatedQuestionRefs:
      - QR002
      - QR004
      - QR007
      - QR009
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operational-controls
    missingEvidence: >-
      Forecast accuracy, balancing losses, billing-error rates, service levels, outage recovery, model overrides,
      security tests, and customer-complaint cohorts.
    whyItMatters: >-
      Public product descriptions establish operational dependence but not control effectiveness or the cost of
      failures.
    diligencePath: >-
      Review model-validation packs, post-incident reports, audit findings, service dashboards, complaint cohorts, and
      control-owner attestations.
    relatedQuestionRefs:
      - QR005
      - QR006
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: grid-and-project-delivery
    missingEvidence: >-
      Executed grid agreements, connection deposits, reinforcement obligations, project budgets, completion milestones,
      and downside project economics.
    whyItMatters: Acquired megawatts do not establish commissioned output, timing, capital required, or economic contribution.
    diligencePath: >-
      Inspect project-level connection offers, EPC contracts, consent conditions, budgets, milestone reports, and
      investment-committee cases.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: token-legal-and-technical
    missingEvidence: >-
      The controlling SEC request and response, current token terms, smart-contract audit, change controls,
      jurisdictional legal analysis, and off-chain continuity plan.
    whyItMatters: >-
      A secondary report describes conditional relief, while legal scope, current design conformity, security, and
      operational fallback remain unverified.
    diligencePath: >-
      Obtain the primary correspondence and current design documents, then commission legal and technical review against
      the deployed implementation.
    relatedQuestionRefs:
      - QR001
      - QR006
      - QR008
      - QR009
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: >-
      Audited consolidated revenue, gross profit, contribution margin, EBITDA, operating cash flow, working-capital, and
      free-cash-flow bridge.
    whyItMatters: The company-attributed EBITDA claim cannot establish cash conversion or a defensible valuation denominator.
    diligencePath: >-
      Obtain audited group accounts, monthly management accounts, and a reconciliation from statutory revenue through
      EBITDA to free cash flow by business line.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fully diluted cap table, primary-versus-secondary allocations, debt, liquidation preferences, anti-dilution terms,
      and investor liquidity rights for recent rounds.
    whyItMatters: Headline funding and valuation figures do not determine ownership, cash available, or common-equity exit proceeds.
    diligencePath: >-
      Review executed financing documents, the current capitalization table, debt and collateral schedules, and a
      round-by-round sources-and-uses ledger.
    relatedQuestionRefs:
      - QV006
