  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-gaps
    missingEvidence: Current active patient counts, order counts, and any covered-lives metric by BlinkRx, Quick Save, and Blink retail e-commerce.
    whyItMatters: Without product-level customer counts, public evidence cannot distinguish broad awareness from durable active usage.
    diligencePath: Request a monthly active patients/orders bridge by product for the last 12 months and reconcile to gross script volume.
    relatedQuestionRefs:
    - QU009
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, reorder rates, refill retention, and renewal/churn by major product line and therapy cohort.
    whyItMatters: Customer durability is central to underwriting whether Blink’s support-heavy fulfillment model compounds or merely recycles one-off transactions.
    diligencePath: Request cohort tables showing refill retention, reorder intervals, and churn by branded program, pickup flow, and home-delivery flow.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: TU003 named-customer-proof coverage gap
    missingEvidence: The full current roster of BlinkRx manufacturer customers behind the company’s 55+ leading-brand claim, including which logos are live programs versus legacy references.
    whyItMatters: The named customer proof table is intentionally partial today; without the fuller roster, public evidence cannot tell whether Blink’s manufacturer book is broad and diversified or concentrated in a few therapy launches.
    diligencePath: Request the full active manufacturer/program list with launch date, therapy, live/pilot status, active-patient count, and last-12-month script volume; reconcile it to the public 55+ leading-brand claim.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
    - TU006
