- id: SU002
  title: Adoption Trajectory and Named Customer Proof
  body: 'Blink’s strongest adoption evidence is channel and program breadth rather than disclosed customer counts. BlinkRx’s manufacturer surface claims impact for 55+ leading brands, while the patient homepage lists 55+ medications and says 40% more fills are covered by insurance with 50-state free home delivery. Those claims are company-authored, so they should be treated as directional rather than audited. Even so, the named-partner surface is meaningful: BlinkRx publicly displays Mayne, Lexicon, Tarsus Pharmaceuticals, Phathom Pharmaceuticals, Bayer, and Hikma, and its manufacturer page highlights a live ARS Pharmaceuticals partnership around neffy. ARS’ own 2024 release confirms BlinkRx was already accepting neffy prescriptions, helping with prior authorization, and shipping the product free of charge once available.  Expansion evidence also points to a widening buyer set on the manufacturer side. Fierce Pharma reported in August 2025 that several pharmas already use BlinkRx’s online
    pharmacy services, named Bayer and Hikma as existing partners, and described Operation Access Now as a launch product that lets drugmakers stand up direct-to-patient or direct-to-business channels within 21 days. This is a meaningful land-and-expand signal because it implies Blink can move from filling individual branded prescriptions to becoming launch infrastructure for pharma brands. The limitation is equally important: aside from ARS/neffy, most named proof remains logo-level and does not reveal program volume, active patients, renewal behavior, or revenue concentration by manufacturer.'
