company:
  name: Blink Health
chapter:
  number: 6
  title: Customers
  summary: 'Blink Health serves patients through three distinct motions: Quick Save for cash-pay generics, Blink’s e-commerce pickup/home-delivery flow for retail prescriptions, and BlinkRx for branded medications coordinated with manufacturers, providers, insurers, and network pharmacies. Public proof is strongest for channel breadth (35,000+ pharmacies, 16,000+ independents, 50-state delivery) and pharma-program breadth (55+ leading brands / 55+ medications), but Blink does not disclose active customer counts, cohort retention, or revenue concentration. Independent review signals are mixed: Blink Health’s archived Trustpilot page shows 4.2/5 from 1,112 reviews and BlinkRx’s archived Trustpilot page shows 3.8/5 from 59 reviews, while Reviews.io and app-store comments surface shipping, copay, packaging, and feature gaps. Expansion upside is clear in manufacturer programs such as ARS Pharmaceuticals’ neffy and the 21-day Operation Access Now launch motion, but channel dependence on pharmacy
    networks, prescriber routing, and manufacturer subsidy economics remains a material diligence risk.'
sections:
- id: SU001
  title: Buyer, User, and Payer Segmentation Across Blink’s Product Stack
  body: 'Blink Health’s customer base is best understood as three overlapping but economically different surfaces. Quick Save targets consumers buying generic drugs with cash instead of insurance and is free to access at participating pharmacies. Blink’s retail e-commerce product also targets cash-pay consumers, but Blink becomes the primary payor in the transaction and the patient prepays for pickup or home delivery. BlinkRx sits farther upstream in the prescription journey: branded medication programs start with a provider sending a script to BlinkRx U.S., then BlinkRx and its network pharmacies coordinate insurance, prior authorization, copay support, and delivery. Patients are the end users across all three motions, but the paying party can vary between the patient, a commercial insurer, and manufacturer-sponsored assistance programs.  Official surfaces show why segmentation matters. Blink’s consumer product pitch emphasizes lower cash prices on generics and pickup at 35,000+ pharmacies
    nationwide, including over 16,000 independents, while BlinkRx emphasizes 50-state free home delivery, 55+ medications, and 55+ leading brands. The provider and pharmacy channel is not optional: Blink needs prescribers to send or transfer scripts and relies on licensed third-party pharmacies to dispense or ship medication. The result is a B2C front end with B2B2C dependencies underneath. Public customer-count disclosure is thin—the company does not publish active patients, repeat purchasers, or covered lives by product—so the best external scale proxies come from review volumes, pharmacy-network breadth, and workforce/support footprint rather than from audited customer metrics.'
