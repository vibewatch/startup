figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Blink’s customer journey is a six-step provider-and-pharmacy-mediated workflow rather than a pure self-serve e-commerce flow.
  data:
    items:
    - label: Prescription trigger
      description: Patient need begins when a provider writes or transfers a prescription, often for a cash-pay generic or a branded therapy requiring coordination.
    - label: Intake & eligibility
      description: Blink or BlinkRx receives the script, verifies medication eligibility, and determines whether the patient will use cash pay, insurance, or manufacturer assistance.
    - label: Price communication
      description: Patient receives a text, call, or app prompt showing the lowest available network price, copay obligations, and any next steps needed for payment or assistance.
    - label: Fulfillment routing
      description: Prescription is routed to a Blink-affiliated or third-party licensed network pharmacy for local pickup or home delivery.
    - label: Delivery / pickup
      description: Patient picks up at a participating pharmacy or receives home shipment, while Blink support fields questions, transfer issues, and refill timing.
    - label: Repeat / expansion loop
      description: Auto-refills, refill reminders, insurer re-approval, manufacturer support, and review feedback determine whether the relationship becomes recurring or churns.
  claimRefs:
  - CU005
  - CU027
  - CU029
  - CU043
  - CU044
  - CU045
