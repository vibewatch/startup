- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / dependency risk
  - Impact
  - Diligence path
  rows:
  - - Add more branded manufacturer programs through BlinkRx
    - Revenue concentration by manufacturer or therapy is undisclosed
    - A few large brands could dominate economics and renewal risk
    - Request top-10 manufacturer revenue and patient-share breakdown
  - - Operation Access Now DTP / DTB launches
    - Dependent on manufacturer launch budgets and policy tailwinds around direct sales
    - Can accelerate growth, but may prove cyclical or politically driven
    - Request pipeline of signed versus pilot launch programs
  - - 35,000+ pickup network and 16,000+ independents
    - Share of volume by chain vs independents is undisclosed
    - Loss of a large chain or reimbursement change could impair reach
    - Request chain concentration and top-pharmacy contractual terms
  - - Provider-routed prescription intake
    - Prescriber adoption and prior-authorization throughput are gating factors
    - Conversion can stall even if patient demand exists
    - Request provider conversion funnel and prior-auth turnaround metrics
  - - Manufacturer assistance and insurance orchestration
    - Government-program exclusions and payer restrictions limit some patient segments
    - Segment economics vary sharply by payer mix and assistance eligibility
    - Request payer-mix by script and assistance-utilization rates
  - - Cash Express pause and mixed review signals
    - Legacy consumer surface may be contracting while service quality remains uneven
    - Support issues can reduce repeats and damage brand trust
    - Request closure rationale, refund/complaint trendlines, and QA incident data
  notes: All impacts are qualitative because Blink does not publish revenue concentration, partner-sourced volume, or cohort economics by product line.
