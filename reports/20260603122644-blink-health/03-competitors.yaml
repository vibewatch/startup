  - id: SP003
    title: Distribution power and switching costs favor Amazon and PBM-owned incumbents more than Blink
    body: >-
      The hardest competitive evidence is not about list prices; it is about channel control. FTC findings show the top
      three PBMs processed nearly 80% of U.S. prescriptions in 2023 and may steer patients toward affiliated
      pharmacies, while the second FTC report described billions of dollars of excess revenue and spread pricing in
      specialty generics. CVS Caremark and Express Scripts then show the practical customer-facing version of that
      power: integrated plan management, network pharmacy search, 90-day mail service, auto-refills, included shipping,
      and pharmacist access that ride on existing employer or health-plan relationships. Amazon’s challenge is similar
      in effect but different in mechanism: it combines a Prime subscription, nationwide fulfillment, same-day delivery
      expansion, kiosks, and digital medication management to make pharmacy convenience a logistics bundle. Blink’s
      35,000-plus pickup partners are meaningful, but GoodRx’s 70,000-plus footprint and the embedded steering power of
      PBM-owned options imply that Blink’s network scale is not the same thing as distribution control. The likely
      switching-cost reality is therefore mixed. Blink can win opportunistic cash-pay fills and branded patient-support
      journeys, but PBM-owned and Amazon-owned workflows can become sticky when they are already woven into benefits,
      auto-refill habits, or household subscriptions. That is the most durable competitive disadvantage visible in the
      public record.
    claimRefs:
      - CP004
      - CP011
      - CP020
      - CP024
      - CP025
      - CP029
      - CP030
      - CP031
      - CP032
      - CP033
      - CP035
      - CP037
      - CP039
      - CP040
      - CP043
    tableRefs:
      - TP004
    figureRefs:
      - FP003
  - id: SP004
    title: Blink has a real niche in branded access, but commoditization risk is highest in generic cash-pay shopping
    body: >-
      The most favorable public evidence for Blink is not its discount-card lookalike surface but BlinkRx. The
      manufacturer page says BlinkRx serves 55-plus leading brands and offers transparent low prices, free home
      delivery, and support, which is a more workflow-heavy proposition than GoodRx’s coupon-plus-subscription model or
      Cost Plus’s transparent mail-order pricing. Blink also appears to have meaningful staffing and financing support:
      its careers page cites 600-plus employees with 200-plus technology staff, and Crunchbase reported a $140 million
      Series D that brought total funding to $315 million. But moat durability is still conditional. Generic cash-pay
      comparison shopping is inherently easy to commoditize because GoodRx, Amazon, Cost Plus, and retail/PBM channels
      all attack affordability from different directions. The adverse evidence is notable: Blink Cash Express was not
      accepting new patients at run date, GoodRx says it is strengthening retail relationships, and Amazon is expanding
      faster-delivery coverage into thousands more communities. Public sources also leave material gaps. They do not
      disclose Blink’s realized per-script economics, the commercial terms behind BlinkRx’s manufacturer programs, or
      the reason Cash Express stopped onboarding new patients. The diligence conclusion is therefore nuanced: Blink has
      a differentiated branded-access wedge, but its consumer savings businesses face strong commoditization and channel
      pressure unless Blink can show superior retention, economics, and partner stickiness in private data.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
