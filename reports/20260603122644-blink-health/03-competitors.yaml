tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Blink Health
        - Direct platform / branded-access hybrid
        - 600+ employees; 200+ technology staff; $140M Series D in 2025 and $315M total raised reported
        - Cash-pay consumers, local pickup users, and manufacturers of branded therapies
        - Combines 35,000+ pickup pharmacies with BlinkRx manufacturer workflows and free delivery support
        - Realized unit economics and BlinkRx contract terms are not public
      - - GoodRx
        - Direct peer / coupon marketplace plus subscription
        - Public company; 2025 revenue $796.9M; 674k subscription plans at year-end
        - Price-sensitive consumers comparing pharmacy options nationwide
        - 70,000+ pharmacy locations, free discounts, Gold subscription, telehealth, and strong self-service tools
        - Mail delivery is not a major disclosed revenue driver and PBM dependence remains material
      - - Amazon Pharmacy
        - Logistics-led substitute / subscription pharmacy
        - Amazon-owned service with Prime bundle and same-day expansion to 4,500 cities by end-2026
        - Prime households, chronic-medication users, and consumers who value delivery convenience
        - RxPass $5/month for 50+ generics, Prime Rx discounts, home delivery, kiosks, PillPack, and 24/7 pharmacists
        - Prime requirement and state/insurance eligibility limits constrain RxPass reach
      - - Mark Cuban Cost Plus Drugs
        - Price-transparency substitute / cash-pay mail order
        - Private; official sources emphasize transparent formula and 2023 Dallas sterile facility rather than funding
        - Cash-pay consumers who prioritize clear unit economics and low generic prices
        - Cost-plus formula publishes 15% markup plus pharmacy fee and shipping, with anti-middleman positioning
        - Official sources reviewed emphasize mail order and manufacturing, not a large retail pickup network
      - - PBM-owned mail-order options
        - Incumbent / benefit-integrated fulfillment
        - Backed by CVS Caremark and Evernorth/Express Scripts plan relationships
        - Insured patients whose employer or plan already routes scripts into affiliated channels
        - Network steering, 90-day supplies, auto-refills, pharmacist support, and plan-level cost tools
        - Public list pricing is usually opaque outside specific benefit designs
      - - Local retail pharmacy status quo
        - Status-quo substitute
        - Thousands of chain and independent pharmacies, but closure pressure is rising
        - Patients who want immediate pickup through existing habits or local relationships
        - Familiar pickup workflow and insurance processing
        - Closures, staffing pressure, and PBM economics can make access less reliable over time
    notes: >-
      Scale fields mix the most relevant public disclosures by competitor class: staff and funding for Blink, revenue and
      subscription plans for GoodRx, parent-distribution scale for Amazon and PBM-owned options, and unknown/not
      public where official sources do not disclose comparable metrics.
