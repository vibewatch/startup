  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Blink’s 35,000+ pickup network supports convenience and reach
        - GoodRx’s 70,000+ network and Amazon/PBM routing can still out-distribute Blink
        - High
        - Request fill-volume mix by partner chain, repeat use, and pharmacy retention by cohort
      - - BlinkRx branded-access workflows create a differentiated wedge
        - Manufacturers may internalize more workflow or choose rival hub/channel solutions
        - Medium
        - Ask for customer retention, average contract length, and brand concentration across the 55+ programs
      - - Blink’s consumer value proposition is free and easy to enter
        - Generic cash-pay comparison shopping is highly commoditized across coupons, subscriptions, and cost-plus mail order
        - High
        - Test retention and repeat-fill economics versus GoodRx and Amazon cohorts
      - - Blink has fresh capital and meaningful staffing
        - Amazon and public-company GoodRx still have larger disclosed scale and more durable consumer mindshare
        - Medium
        - Ask for marketing efficiency, share of voice, and customer acquisition costs by channel
      - - Blink can offer home delivery through BlinkRx and Cash Express
        - Cash Express pause suggests execution or strategy risk while rivals continue to onboard users
        - High
        - Obtain timeline and reason for the shutdown plus current active-user and service-level data
      - - Cash-pay transparency can benefit from PBM frustration
        - PBM steering and affiliated-pharmacy economics may still divert scripts away from Blink
        - High
        - Review payer/network exclusions, rejection rates, and any plan-level steering data
      - - Pharmacy closures can make digital alternatives more relevant
        - Closures can also shrink the practical utility of retail pickup if partner coverage erodes locally
        - Medium
        - Map partner-network density and closure exposure by metro and rural corridor
    notes: >-
      Severity is an evidence-backed judgment, not a probabilistic forecast. Several risks remain open because public
      sources do not disclose Blink’s private retention or economics.
