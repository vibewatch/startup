  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Price / unit / contract model
      - Included capabilities
      - Discount / unknowns
      - Implication
    rows:
      - - Blink Quick Save
        - Free to use; no membership fee; discounted cash-pay pickup pricing
        - Search, pay online, and pick up at participating pharmacies
        - Realized take rate and pharmacy economics not public
        - Best read as a low-friction cash-pay comparison tool
      - - Blink Cash Express
        - Public consumer price list not surfaced in reviewed source; mail-order flow currently paused to new patients
        - Mail-order cash-pay fulfillment
        - New-patient shutdown leaves current package economics unclear
        - Weakens Blink’s mail-order positioning until service status normalizes
      - - GoodRx Free
        - Free discount marketplace across 70,000+ pharmacy locations
        - Coupon lookup, price comparison, pickup/delivery options, and app tools
        - Savings vary by drug and pharmacy; no universal formula
        - Strongest direct peer for free nationwide consumer search
      - - GoodRx Gold
        - $9.99/month individual or $19.99/month family after 30-day trial
        - Deeper savings, 70,000+ locations, and subscription-based savings workflow
        - Official support pages describe plans but not every realized prescription price
        - Converts a free savings product into recurring-membership economics
      - - Amazon RxPass / Prime Rx
        - $5/month for 50+ generics via RxPass; Prime Rx discounts up to 80% generic and 40% brand
        - Auto-refill, home delivery, pharmacist support, and Prime bundle
        - Requires Prime; RxPass eligibility excludes some insurance/state combinations
        - Simpler package than Blink for recurring generic maintenance meds
      - - Cost Plus Drugs
        - Cost plus 15% plus pharmacy fee plus shipping and taxes
        - Transparent mail-order pricing and anti-middleman positioning
        - Shipping varies by location; retail pickup not evidenced in official sources reviewed
        - Most transparent price formula in the set
      - - CVS Caremark / Express Scripts
        - Plan-dependent pricing; mail service and shipping may be included inside benefits
        - 90-day supply, auto-refill, network search, pharmacist support, and plan savings tools
        - Public list pricing is usually unavailable outside member-specific plan design
        - Hardest substitute to compare on sticker price, but strongest on embedded benefit workflow
    notes: >-
      This table intentionally separates public list/package constructs from unknown realized economics. For Blink and
      PBM-owned options especially, several buyer-relevant economics remain private.
