  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: blink-realized-economics
      missingEvidence: Blink’s realized take rate, gross margin, and reimbursement economics by Quick Save, BlinkRx, and Cash Express.
      whyItMatters: Without private economics, it is impossible to tell whether Blink is competing profitably or simply matching rivals on grossly different unit margins.
      diligencePath: Request product-line contribution margins, pharmacy reimbursement terms, and repeat-fill economics by channel.
      relatedQuestionRefs:
        - QP016
        - QP025
    - type: private-evidence-only
      severity: material
      topic: blinkrx-contract-structure
      missingEvidence: Customer concentration, retention, and contract length across the 55+ BlinkRx brand programs.
      whyItMatters: Blink’s strongest moat claim is branded-access workflow depth, but that moat is only durable if manufacturers renew and expand.
      diligencePath: Obtain top-customer concentration, average contract term, retention, and outcome metrics for BlinkRx programs.
      relatedQuestionRefs:
        - QP010
        - QP018
        - QP026
    - type: missing-source
      severity: material
      topic: cash-express-restart
      missingEvidence: Public explanation and restart timeline for Blink Cash Express’s pause in new-patient onboarding.
      whyItMatters: The mail-order gap directly affects Blink’s ability to defend generic maintenance-medication workflows against Amazon, Cost Plus, and PBM-owned mail service.
      diligencePath: Ask management for the operational reason for the pause, active-user counts, and target date for reopening or retiring the service.
      relatedQuestionRefs:
        - QP012
        - QP021
    - type: stale
      severity: material
      topic: pbm-reform-implementation
      missingEvidence: Current 2026 contract changes by PBM-owned mail-order operators after FTC scrutiny and ongoing reform pressure.
      whyItMatters: PBM-owned options are Blink’s most structurally powerful competitors, and changes in steering or reimbursement rules can shift competitive intensity quickly.
      diligencePath: Review updated member handbooks, reimbursement policies, and network design changes for Caremark, Express Scripts, and OptumRx.
      relatedQuestionRefs:
        - QP009
        - QP023
    - type: missing-source
      severity: minor
      topic: internal-build-alternative
      missingEvidence: Public case studies showing manufacturers or payers building Blink-like patient-access workflows in-house instead of using BlinkRx.
      whyItMatters: Internal build is a plausible substitute for enterprise buyers, but the public record reviewed here did not quantify how often it happens.
      diligencePath: Request competitive-loss analyses, RFP data, and examples of in-house or rival-hub replacements from management.
      relatedQuestionRefs:
        - QP026
    - type: access-blocked
      severity: minor
      topic: goodrx-live-marketing-pages
      missingEvidence: A clean, bot-free fetch of GoodRx’s consumer marketing pages for fully current feature copy beyond filings, support pages, and app listings.
      whyItMatters: The official GoodRx support pages and filings were usable, but some broader live marketing pages returned access-denied text during review.
      diligencePath: Re-run a manual browser capture or authenticated fetch of current GoodRx landing pages and preserve screenshots alongside the cited support URLs.
      relatedQuestionRefs:
        - QP006
        - QP025
