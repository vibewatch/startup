      - number: '7.4'
        title: 执行质量仍取决于招聘、留才和治理纪律
        blocks:
          - type: paragraph
            body: >-
              执行风险不小，因为 Blink
              仍在扩张一个复杂混合体，里面有药房运营、理赔处理、产品、工程和安全。招聘页面显示，事先授权、理赔、药房运营、工程以及治理、风险与合规安全等职能都有开放岗位。这个广度一方面令人鼓舞，说明公司仍在投入；另一方面也意味着运营模式还没有进入低接触的稳定状态。多城市运营会增加协调成本，而
              Blink 对服务提供方和患者的承诺，取决于客服、药房运营、产品和安全团队能否保持一致的人员质量。1789 Capital 领投 2025 年 Series D、Donald Trump Jr.
              加入董事会之后，治理变得更显眼。这可能有助于融资和政策触达，但也提高了品牌极化和交易对手敏感度，尤其是雇主、付款方、服务提供方和药企中偏好低调供应商的那部分。Blink
              的资本实力比以前更强，但公开单位经济细节缺席，管理层执行质量仍只能从招聘需求、服务承诺，以及公司在监管变化中吸收冲击而不出现运营滑坡的能力来推断。
