  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险单元集中在隐私 / 合规、PBM 改革和药房网络依赖，因为公开证据只能部分证明缓释措施。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 隐私 / HBNR / HIPAA
          values:
            - 中
            - 严重
            - 中
            - 高
        - label: PBM 改革 / 报销重置
          values:
            - 高
            - 高
            - 中低
            - 高
        - label: 药房网络流失
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 运营服务摩擦
          values:
            - 中高
            - 高
            - 中
            - 中高
        - label: 资本 / 单位经济性不透明
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 治理 / 品牌两极化
          values:
            - 中
            - 中
            - 低中
            - 中
    approximationNotes: 等级标签概括公开证据，而不是内部量化风险评分。
    claimRefs:
      - CR047
      - CR049
      - CR050
      - CR051
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Blink 的关键风险会沿少数运营卡点传导到估值：药房覆盖、转化、服务水平和利润率韧性。
    data:
      nodes:
        - id: privacy
          label: 隐私 / HBNR 失效
          detail: 数据共享或泄露控制在 FTC/HHS 审查下失灵
        - id: pbm
          label: PBM 改革
          detail: 报销、反引导或透明度规则收紧
        - id: closures
          label: 药房关闭
          detail: 独立药房或本地自提可及性下降
        - id: ops
          label: 服务摩擦
          detail: 预授权、处方转移、配送或退款问题增加
        - id: conversion
          label: 配药转化
          detail: 患者完成的订单或疗程减少
        - id: margin
          label: 毛利率 / CAC
          detail: 支持和合作伙伴成本上升，单位经济恶化
        - id: runway
          label: 现金跑道 / 资本
          detail: 融资需求早于计划到来
        - id: valuation
          label: 估值支撑
          detail: 投资人下调倍数和信心
      edges:
        - from: privacy
          to: ops
          label: 信任冲击
        - from: privacy
          to: valuation
          label: 监管阴影
        - from: pbm
          to: margin
          label: 重新定价
        - from: pbm
          to: conversion
          label: 网络摩擦
        - from: closures
          to: conversion
          label: 覆盖流失
        - from: ops
          to: conversion
          label: 放弃下单
        - from: conversion
          to: margin
          label: 交易量流失
        - from: margin
          to: runway
          label: 烧钱
        - from: runway
          to: valuation
          label: 稀释风险
        - from: ops
          to: valuation
          label: 信任 / NPS 拖累
    approximationNotes: 边反映从引用证据综合出的方向性因果路径，而非公司内部流程图。
    claimRefs:
      - CR047
      - CR048
      - CR049
      - CR050
      - CR051
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Blink 位于药房、药企、支付方和信任中介之间；每个依赖项都可能影响客户可及性，而 Blink 并不控制底层资产。
    data:
      nodes:
        - id: blink
          label: Blink 运营层
          detail: 患者触达、定价、支持和路由逻辑
        - id: pharmacies
          label: 参与药房
          detail: 35,000+ 个自提点，加上持牌邮寄药房
        - id: manufacturers
          label: 药企 / 品牌
          detail: BlinkRx 上有 55+ 个领先品牌疗法
        - id: payors
          label: 支付方 / PBM
          detail: 覆盖、优惠发现、报销背景和数据
        - id: carriers
          label: 承运商
          detail: 上门配送最后一公里和延迟风险
        - id: trust
          label: 信任中介
          detail: App 商店、BBB、NABP 和评论平台
        - id: patients
          label: 患者 / 医疗服务方
          detail: 终端用户需求和开方工作流
      edges:
        - from: patients
          to: blink
          label: 需求 + 处方
        - from: blink
          to: pharmacies
          label: 路由 / 履约
        - from: blink
          to: manufacturers
          label: 品牌准入项目
        - from: blink
          to: payors
          label: 覆盖 / 优惠协调
        - from: pharmacies
          to: carriers
          label: 配送交接
        - from: trust
          to: patients
          label: 可信度
        - from: pharmacies
          to: patients
          label: 自提可用性
        - from: manufacturers
          to: patients
          label: 疗法可及性
    approximationNotes: 这张图突出交易对手和分销节点，而非法律实体所有权结构。
    claimRefs:
      - CR010
      - CR011
      - CR015
      - CR017
      - CR022
      - CR037
      - CR044
      - CR053
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从融资信号和客户效用出发，经过可比公司倍数纪律和风险筛查，形成最终建议。
    data:
      nodes:
        - id: n1
          label: 融资信号
          detail: $140M D 轮融资证实投资人仍有兴趣
        - id: n2
          label: 客户效用
          detail: App 和评论信号方向上偏正面
        - id: n3
          label: PBM / 渠道结构
          detail: 95% 处方集中度和正在推进的改革抬高执行风险
        - id: n4
          label: 可比公司测算
          detail: GoodRx 和 Hims 暗示需要很高的收入支撑门槛
        - id: n5
          label: 证据缺口
          detail: Blink 的收入、利润率、留存和股权结构表仍未披露
        - id: n6
          label: 估值立场
          detail: 当前估值标记偏高，并不明显有吸引力
        - id: n7
          label: 建议
          detail: 只有完成私下尽调后，才适合继续研究 / 观察
      edges:
        - from: n1
          to: n6
          label: 支撑关注
        - from: n2
          to: n7
          label: 不至回避
        - from: n3
          to: n6
          label: 抬高风险
        - from: n4
          to: n6
          label: 检验价格
        - from: n5
          to: n7
          label: 阻断买入
        - from: n6
          to: n7
          label: 推动结论
    approximationNotes: 节点细节是对引用主张的定性摘要，而非量化评分模型。
    claimRefs:
      - CV002
      - CV006
      - CV015
      - CV017
      - CV037
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 按上市可比公司的销售倍数倒推，Blink 要支撑已观察到的私募估值标记，需要多少年收入；这是示意测算，单位为百万美元。
    data:
      items:
        - label: $1.62B，按 GoodRx P/S 1.27x
          value: 1276
          detail: 以 GoodRx 市销率作为低倍数锚点。
        - label: $1.62B，按 GoodRx EV/Sales 1.66x
          value: 976
          detail: 以 GoodRx EV/Sales 作为略不那么严苛的基准。
        - label: $1.62B，按 Hims P/S 2.69x
          value: 602
          detail: 以 Hims 市销率作为高端上市数字健康锚点。
        - label: $1.62B，按 Hims EV/Sales 2.85x
          value: 568
          detail: 以 Hims EV/Sales 作为高端基准。
        - label: ~$2.0B，按 GoodRx P/S 1.27x
          value: 1575
          detail: 显示据报道较高的 Blink 估值标记有多苛刻。
        - label: ~$2.0B，按 GoodRx EV/Sales 1.66x
          value: 1205
          detail: 仍需要超过 $1.2B 的年收入支撑。
        - label: ~$2.0B，按 Hims P/S 2.69x
          value: 744
          detail: 即使用高端倍数，仍需要相当可观的收入支撑。
        - label: ~$2.0B，按 Hims EV/Sales 2.85x
          value: 702
          detail: 即使用更友好的 EV/Sales 口径，要求仍然很高。
    approximationNotes: 数值只是用估值除以倍数的简单计算，明确不是 Blink 已披露收入。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Blink 悲观、基准、乐观情景下的股权价值区间，并与相互冲突的公开估值参考对照；单位均为百万美元。
    data:
      items:
        - label: 悲观情景股权价值
          low: 300
          mid: 600
          high: 900
          unit: USDm
          detail: 如果收入支撑偏弱或政策压力上升，估值会更接近低倍数中介平台。
        - label: 基准情景股权价值
          low: 1100
          mid: 1500
          high: 1900
          unit: USDm
          detail: 如果 Blink 证明有中等规模，但没有证明高端经济性，估值会落入混合倍数结果。
        - label: 乐观情景股权价值
          low: 2200
          mid: 2600
          high: 3200
          unit: USDm
          detail: 如果 Blink 证明可支撑 Hims 式规模，且结构干净，则有高端结果。
        - label: 公开估值参考
          low: 1620
          mid: 1810
          high: 2000
          unit: USDm
          detail: Forge 与 Yahoo（Bloomberg 报道）两个锚点，夹出当前公开价格发现区间。
    approximationNotes: 区间是投资测算结果，用来约束入场纪律，不是管理层指引。
    claimRefs:
      - CV004
      - CV005
      - CV038
      - CV040
      - CV043
      - CV044
      - CV046
  - id: FV004
    title: 投资关键指标
    type: kpi
    layout: standard
    summary: 面向投委会的评分，覆盖市场需求、产品验证、竞争、经济性可见度、风险、估值和证据质量。
    data:
      items:
        - label: 市场需求
          value: 8
          detail: 药品支出增长和可负担性痛点仍然非常真实。
        - label: 产品效用
          value: 6
          detail: 客户和 App 信号为正，但不是经审计的运营指标。
        - label: 竞争护城河
          value: 4
          detail: Amazon 和 Cost Plus 让透明定价护城河很难守住。
        - label: 经济性可见度
          value: 2
          detail: 收入、利润率、留存和抽成率数据仍未公开。
        - label: 监管 / 渠道风险
          value: 3
          detail: PBM 改革和合作伙伴经济性可能快速牵动估值。
        - label: 估值纪律
          value: 3
          detail: 当前公开估值标记相对上市可比公司显得偏高。
        - label: 证据质量
          value: 4
          detail: 外部来源覆盖很广，但关键分母仍然缺失。
    approximationNotes: 评分为 0-10 的定性投委会分数，仅基于引用的公开证据。
    claimRefs:
      - CV017
      - CV018
      - CV037
      - CV043
      - CV044
      - CV045
      - CV048
