  - id: TV004
    title: 可比估值表
    description: Public and model-relevant benchmarks used to triangulate Blink’s valuation support and competitive position.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 与 Blink 的相关性
      - 局限
    rows:
      - - GoodRx
        - LTM 收入约 $787.9M；市值约 $0.99B
        - 1.27x P/S；1.66x EV/Sales 倍数
        - 最接近的公开处方省钱与药企变现市场基准。
        - GoodRx 已上市、增长较慢，也不是完整的 Blink 式获取或配送流程。
      - - Hims & Hers
        - LTM 收入约 $2.37B；市值约 $6.37B
        - 2.69x P/S；2.85x EV/Sales 倍数
        - 对有规模的消费者平台而言，是有用的高端数字健康倍数锚。
        - Hims 规模大得多，整合远程医疗，品牌也比 Blink 更宽。
      - - Amazon / Amazon Pharmacy
        - 母公司市值约 $2.76T；RxPass 每月 $5；计划向 4,500 个城市提供当日达
        - 药房业务未单独估值
        - 物流、速度和定价压力的最佳战略基准。
        - Amazon Pharmacy 埋在综合集团内部，估值不可直接对比。
      - - Mark Cuban Cost Plus Drug Company 公司
        - 低成本制造与短缺应对定位；公开估值未披露
        - 私营 / 估值未披露
        - 与透明定价和低价药竞争相关。
        - 没有公开收入、估值或详细经济性，只能作为战略可比对象。
      - - Blink Health 公开价格参考
        - Forge 列示 $1.62B Series D；Bloomberg 报道的 Yahoo 条目称约 $2.0B
        - 私募市场标记互相冲突
        - 当前进入纪律的直接锚。
        - 两个来源都不是 Blink 官方披露，也没有收入或股权结构分母。
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set intentionally mixes public valuation anchors with strategic model benchmarks because no single
        public company maps cleanly to Blink’s prescription-access model.
