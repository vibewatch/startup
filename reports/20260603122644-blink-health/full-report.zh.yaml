      - number: '5.3'
        title: 信任、隐私、支持与配送控制
        blocks:
          - type: paragraph
            body: >-
              Blink 的信任界面可见，但重心在法律披露和人工支持，而不是公开外部审计材料。HIPAA 通知称 Blink 是 covered entity（受监管实体），列明 PHI
              可用于治疗、付款、运营和公共卫生报告，并赋予患者查阅、修改、限制和追踪披露的权利。使用条款增加了运营护栏：Blink
              不是保险，服务仅限美国，网站不用于紧急情况，节假日或药房转方缓慢可能导致续方或订单处理延迟。支持已经产品化——Blink 发布 Blink 和 BlinkRx
              各自的支持时间窗口、按路径区分的电话和邮箱联系人，以及覆盖到家配送、本地取药、隐私、无障碍和 Medicare 主题的帮助中心。App Store 和评价界面补充了细节。Apple
              隐私标签显示与用户关联的金融、位置、联系和使用数据；Trustpilot 和 Retirement Living
              同时描述了良好的配送或支持体验，以及导航、价格不满、有缺陷药瓶和专科药房环节方面的反复摩擦。主要尽调担忧不是缺政策，而是在已审阅材料中没有公开 SOC 2、HITRUST 或类似第三方鉴证文件。
