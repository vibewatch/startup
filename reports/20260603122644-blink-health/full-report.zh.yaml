  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险是最高优先级暴露
        blocks:
          - type: paragraph
            body: >-
              Blink 最严重的风险，是它的处方可及性模式建在敏感健康数据、动态定价和第三方药房协同之上，而这一模式正进入更严格的法律和监管区。FTC 针对 PBM
              的工作表明，集中度很高的中间商可以引导患者、改写报销、挤压非关联药房；州和联邦改革也开始盯住返利经济、价差定价、反引导规则和所有权结构。调查已经不只是抽象研究：FTC 2023
              年扩围时称，正在调查追扣款、不透明报销以及导流至 PBM 自有药房；FTC 2026 年 6 月的 PBM 事项页面还显示，一起胰岛素返利案仍在审理，并已有与 Express Scripts 的和解。Blink
              可以把自己定位成患者优先、PBM 色彩较轻，但其折扣和可及性产品仍接入同一套报销管道和药房合同。与此同时，Blink 自己的条款和 HIPAA 通知确认，它可以作为患者代理获取
              PHI，与药房和付款方协同，并为业务活动生成去标识化的汇总数据。GoodRx 的 HBNR 执法案说明，只要隐私承诺、营销实践或供应商控制跑偏，处方平台很快就会被处罚。缓释手段确实存在——政策、仲裁、HIPAA
              通知和已披露的隐私权——但大多仍是纸面控制。除非尽调确认数据流治理、广告技术控制、BAA 覆盖、逐州报销暴露，以及 ADA 无障碍投诉和其他争议的解决历史，否则剩余风险仍高。
