  - id: FP003
    title: 护城河 / 准备度 KPI
    type: kpi
    layout: standard
    summary: Blink 的护城河在品牌药可及和广泛线下取药覆盖上最强；但在医保福利控制和自有配送决定续方流程的环节最弱。
    data:
      items:
        - label: 线下取药覆盖广度
          value: Medium
          note: 35,000+ 家药房有意义，但仍低于 GoodRx 披露的 70,000+ 家覆盖
        - label: 品牌药厂商可及
          value: High
          note: BlinkRx 称，其为 55+ 个领先品牌提供配送和患者支持流程
        - label: 邮寄药房准备度
          value: Low
          note: 本次报告运行日，Cash Express 不接受新患者，而 Amazon 和 PBM 自有邮寄药房仍开放
        - label: 防守阵地的资本
          value: Medium
          note: $140M Series D 和累计 $315M 融资有帮助，但有公开披露支撑的同业规模仍更大
        - label: PBM 导流暴露
