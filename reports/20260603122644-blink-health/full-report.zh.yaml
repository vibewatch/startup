  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价信号
        blocks:
          - type: paragraph
            body: >-
              Blink 的公开材料支持一个三段式收入故事，而不是单一折扣卡叙事。官网明确把业务拆成品牌药的 BlinkRx、零售药房自费仿制药折扣的 Blink Quick Save，以及直接邮寄仿制药的 Blink
              Cash Express。这很重要，因为每个界面都暗示不同付款方、收入确认模式和质量画像。BlinkRx 最像卖给药企的 B2B
              处方药可及性工作流，变现很可能挂钩项目费、患者入组、可负担性服务和履约编排。Quick Save 更像在取药点与交易挂钩的消费者节省，Cash Express
              则更接近自费电商药房流程。缺失的是已实现定价：Blink 营销可负担、低价和免费配送，但公开来源不披露 take rate、价差、单笔订单毛利，或 Blink 是否用配送或支持补贴来换规模。Amazon 每月
              $5 的 RxPass 说明，自费仿制药的外部价格标尺已经很激进，这很可能压缩 Blink 在没有足够规模时变现消费者流量的空间。
