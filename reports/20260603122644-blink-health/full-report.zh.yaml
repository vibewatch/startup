        - 直连平台 / 品牌药准入混合模式
        - 600+ 名员工；200+ 名技术人员；据报道 2025 年 Series D 轮融资 $140M，累计融资 $315M
        - 现金自付消费者、本地取药用户和品牌疗法药厂
