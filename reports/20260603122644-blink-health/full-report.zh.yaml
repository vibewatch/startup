      - number: '2.5'
        title: 矛盾、改革压力与保留的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场结论应有意保持约束。Blink 受益于庞大且仍在扩张的处方药生态，但最关键的矛盾不是市场大不大，而是哪一种会计口径真正适用于
              Blink。总支出、净支出、零售支出和患者自付支出都会给出不同天花板。改革压力又叠加一层不确定性，因为 PBM
              收费、报销底价和返利穿透的变化，既可能提升透明度，也可能改变今天路由和折扣模式的经济性。竞争信号也指向同一方向：Amazon 和 Cost Plus 验证了数字需求，GoodRx
              的转向则表明自费与药企可及性在战略上重要但已经拥挤。缺失的仍是从品类逻辑到 Blink 特定捕获能力的桥。公开来源没有给出足以把自上而下需求转成可辩护 SOM
              的渠道组合、活跃患者数、品牌项目单位经济性或服务水平指标。这些缺口应该保留，而不是被粉饰，因为估值可能大幅摆动，取决于 Blink 主要是消费者省钱平台、药企可及性层，还是两者混合。
