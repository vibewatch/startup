      - number: '1.3'
        title: 融资历程、投资者基础与估值噪音
        blocks:
          - type: paragraph
            body: >-
              融资记录是本章噪音最大的一组证据。最近一条硬新闻口径一致：PRNewswire、Yahoo Finance、Crunchbase News 和 Investing 都称 BlinkRx 完成 $140
              million Series D，由 1789 Capital 领投，并新增 Donald Trump Jr. 进入董事会。此后，数据提供方分歧很大。Crunchbase News 称公司本轮后累计融资 $315
              million，PremierAlts 只显示累计融资 $165 million，Forge 则显示累计融资 $583.89 million、Series D 估值 $1.62
              billion，并给出逐轮二级市场细节，但这些细节无法与其他服务干净对齐。


              正确结论不是挑一个数字当权威口径，而是在管理层或一手融资文件披露股权结构表之前，把累计融资和估值都视为低置信度。已审阅来源也没有披露持股比例；我们没有找到公司确认的债务、授信额度、ARR
              或盈利能力数据，无法让后续章节按基本面规范估值。
