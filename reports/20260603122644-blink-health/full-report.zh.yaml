  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 当前数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 最新披露融资
        - 2025 年 Series D 轮 $140M，由 1789 Capital 领投
        - 高
        - 确认近期形成了实质性资本，并有董事会层级投资人参与
        - 要求披露交割日期、总募资额与净到账额，以及投资人权利
      - - 隐含估值
        - 约 $2B，但仅来自第三方报道
        - 中
        - 可作方向性信号，但不足以单独锚定回报假设
        - 要求公司确认投后估值和股权结构表
      - - 公开可比公司估值区间
        - 截至 2026 年 6 月，GoodRx 约 $0.99B，Hims & Hers 约 $6.36B
        - 中
        - 说明相关公开可比公司的估值跨度很大，Blink 据报道的 $2B 估值不能自证合理
        - 要求管理层提供公开可比公司框架，并把可比指标桥接到 Blink 最新一轮定价
      - - 账面现金
        - 未公开披露
        - 高（指标缺失）
        - 没有当前现金数据，就无法直接判断资本充足性
        - 要求当前现金余额和受限现金明细
      - - 月度烧钱速度
        - 未公开披露
        - 高（指标缺失）
        - 烧钱速度是把融资标题落到真实现金跑道的关键桥梁
        - 要求过去 12 个月月度烧钱速度，以及按职能拆分的预算烧钱
      - - 现金跑道
        - 公开来源无法支撑
        - 高（指标缺失）
        - 没有现金和烧钱输入，就无法支撑任何直接跑道估算
        - 要求管理层提供含下行情景的现金跑道模型
      - - 计划资金用途
        - 公司称本轮融资支持持续增长，但具体运营预算未公开
        - 中
        - 资金用途明细决定资本是在打造可持续利润率，还是只是在补贴规模
        - 要求按产品线和员工数拆分资金用途计划
      - - 债务 / 项目融资义务
        - 已审阅来源未发现公开债务或项目融资义务
        - 中
        - 隐性杠杆或供应商融资可能实质性改变真实资本充足性
        - 要求债务明细表、契约条款、应付账款账龄和表外承诺
    notes: 资本表刻意不编造现金跑道；它区分已验证的融资事实和缺失的资产负债表数据。
