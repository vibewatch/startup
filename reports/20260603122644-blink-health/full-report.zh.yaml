      - number: '7.3'
        title: 合作方依赖与模型经济性高度绑定
        blocks:
          - type: paragraph
            body: >-
              Blink 的模式深度依赖它无法控制的交易对手。本地取药依靠 35,000+ 家合作药房，品牌药可及性依赖药企合作，保险覆盖决定影响 BlinkRx
              转化，送药到家最终依赖持牌药房和承运商。网络够广、规则稳定时，这个结构可行；一旦报销规则、FTC PBM
              执法、反引导法律或关店趋势迫使交易对手重新定价或退出，它就会变危险。药房关店证据很重要，因为独立药房消失、连锁药房集中议价权之后，Blink 的选择余地会变小。财务风险也直接来自这套合作方堆栈。Blink
              融了一笔规模不小的 Series
              D，但私营公司披露仍让投资者看不到抽佣率、药房报销价差、各渠道毛利率或本轮之后现金跑道。只要成交量增长能抵消重新定价和服务成本，模型可以跑通；但公开证据还不足以证明这一点。剩余风险高，因为合同重置、关店造成的地理缺口，或药企集中度，都可能在下一次融资或流动性事件前先挤压利润率。
