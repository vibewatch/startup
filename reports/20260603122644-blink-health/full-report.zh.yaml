      - number: '7.2'
        title: 运营和信任风险贯穿每一次配药和支持互动
        blocks:
          - type: paragraph
            body: >-
              运营上，Blink 不是一层薄软件外壳。BlinkRx 承诺保证库存、智能事先授权支持、真人协助和免费配送；Quick Save 依赖合作药房；Cash Express
              目前不再接收新患者。条款披露了转方延迟、承运商导致的配送延长、实时价格变化，以及发药后不退款规则。药品可及性是高风险品类，这些细节很关键：患者预付或授权扣款后，一旦价格变化、转方卡住或配送失败，反应会很强烈。因此，公开情绪是好坏混合，而不是干净的正面。Trustpilot
              和 App Store 的平均评分很高，但负面评价仍集中在专科药房摩擦、价格落差、产品问题和误送。Blink
              显然有缓释机器——客服时段、患者触达、药房运营人员和自动续方工具——但公开证据显示，这些控制仍重人工，不是完全自愈。剩余风险中高，因为药房、物流和人员瓶颈会叠加，投诉峰值或流失来得比普通电商更快。
