      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开证据也没有证明 Blink 已具备退出准备度。Forge 提到保密
              S-1，作为市场信号有用，但这不是对申报状态、时间表或准备度的官方确认。因此，投资者仍需要把基础工作做扎实：经审计净收入、毛利率、留存、抽佣率、网络稳定性和清算瀑布。这些事项不仅决定当前估值标记是否站得住，也决定最终退出会回报普通股式承销，还是主要服务于优先股堆叠。最后的尽调问题因此集中在财务分母、渠道经济性、优先权悬置和合规卫生。如果
              Blink 能正面回答这些问题，且验证后的收入基数越过本章展示的公开可比公司门槛，评级可以上调。如果不能，当前私募估值应被视为过满，而不是礼物。
