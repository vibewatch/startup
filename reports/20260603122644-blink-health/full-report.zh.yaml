  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Blink 不只是优惠券卡，但竞争格局按用药场景切得很碎
        blocks:
          - type: paragraph
            body: >-
              Blink 自身产品面显示，公司想覆盖三条处方旅程，而不是只做一件事。面向消费者的一侧包括 Quick Save，服务仿制药自费处方；覆盖大型合作网络的本地药房取药；以及 Blink Cash
              Express，服务邮寄自费药物。面向药企的一侧是 BlinkRx，瞄准品牌疗法，并叠加支持、配送和可负担性工作流。这种广度会影响竞争框架，因为 Blink 面对的不只是另一张折扣卡。GoodRx
              是最接近的直接消费者比价同业，Amazon Pharmacy 是仿制药维护用药上最强的物流型替代品，Mark Cuban Cost Plus Drugs 是最清晰的价格透明破局者；CVS Caremark 和
              Express Scripts 等 PBM
              拥有的邮寄药房选项，则仍是已投保患者最强的现状替代，因为福利设计已经把他们推向关联渠道。因此，公开证据支持一个分层竞争格局：优惠券和自费节省领域有直接同业，福利绑定配药领域有既有巨头，邮寄价格破局者构成替代，品牌药可及性工作流则是相邻领域，BlinkRx
              的完全同类对手更少。关键投资含义是，判断 Blink 的竞争位置时，应分别看仿制药自费、到家便利性和品牌药企可及性，而不是把它当成一个无差别的线上药房市场。
