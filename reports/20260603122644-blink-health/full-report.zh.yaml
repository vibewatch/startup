companyProfile:
  summary: >-
    Blink Health 是一家 2014 年成立、总部位于纽约的处方药可及性公司，由 Geoffrey 和 Matthew Chaiken 创办。当前产品栈包括面向品牌药的 BlinkRx、面向自费仿制药到店取药的 Quick
    Save，以及面向邮寄仿制药的 Blink Cash Express；公开证据支持其全国覆盖：35,000+ 家参与药房、16,000+ 家额外独立药房、BlinkRx 50 州配送，以及 600+ 名员工。Blink
    的变现看起来也混合了药企项目服务、与交易挂钩的仿制药节省，以及直接自费订单履约。投资核验的核心问题不是 Blink
    有没有真实运营面，而是经济性不透明、融资和估值口径冲突、监管与运营风险偏高后，以当前私募市场标记是否还留有足够安全边际。
