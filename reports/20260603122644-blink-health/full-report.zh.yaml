      - number: '6.4'
        title: 扩张路径、渠道依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Blink 的扩张逻辑清楚。消费者一侧，公司可以在同一患者关系中交叉销售取药、到家配送、自动续方和品牌药项目。药企一侧，BlinkRx
              可以先作为品牌药履约和可负担性层，再增加先行授权帮助、药企共付支持、续方提醒，并通过 Operation Access Now 增加更广泛的 direct-to-patient /
              direct-to-business 上市工具。ARS/neffy 是一个具体例子，说明药企关系可以变成完整患者可及性项目，而不只是简单发货安排。相应风险在公开层面不那么可见，但在经济上可能更重要。Blink 的
              Quick Save 和零售产品依赖一个持续在线、价格有竞争力的广泛药房网络；BlinkRx
              依赖开方医生路由、保险方批准和药企补贴设计。条款明确指出，政府医保受益人通常无法使用药企共付援助，保险方提出的先行授权要求可能延迟获取。Cash Express
              目前不接收新患者，说明至少一个增长界面暂停或被降优先级。最重要的是，Blink 不发布多少业务量绑定在最大药房连锁、最大药企项目或任何单一治疗品牌上。这意味着公开证据支持 Blink
              的扩张可选性，但不支持其背后收入的耐久性或多元化。
