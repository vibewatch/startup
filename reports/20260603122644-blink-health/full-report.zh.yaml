      - number: '2.2'
        title: 规模测算视角与 SAM 为何仍受限
        blocks:
          - type: paragraph
            body: >-
              公开市场规模支持一个大机会，但前提是各个视角不能混用。ASHP 将美国 2025 年处方药支出估为 $915 billion，并预计 2026 年突破 $1 trillion；IQVIA 按净价测得 2025
              年药品支出为 $606 billion，并记录 $110 billion 的患者自付负担。KFF 基于 CMS 的追踪又给出另一视角：预计零售处方药支出到 2033 年达到 $776 billion，2026
              年增长 5.1%。这些数字都指向同一个战略方向——药品需求仍然庞大、昂贵且在增长——但它们不能互换。Blink
              无法捕获全部药品总支出，甚至也无法捕获全部净零售支出。它更接近的公开天花板，是患者需要直面价格且价格透明、路由、到家配送重要的门诊部分，加上品牌药的药企出资可及性项目。由于 Blink
              不披露处方量、合格药品广度、付款方组合或按渠道拆分的收入，任何 SAM 或 SOM 估计都更像叙事，达不到可投资核验级。正确姿态是保留多个视角，拒绝虚假精确。
