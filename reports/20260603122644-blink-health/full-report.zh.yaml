  - id: TV005
    title: 论点失效与放弃触发表
    description: Events or thresholds that would materially damage the public-evidence case for Blink at current price levels.
    columns:
      - 触发因素
      - 门槛
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入支撑不达标
        - 经验证年度收入支撑低于约 $500M
        - 即便对照低倍数上市可比公司组，当前公开标记也会显得激进。
        - 不按当前价格加仓；将承销重置到更低区间。
      - - 利润率或抽成率偏弱
        - 毛利率或贡献经济性显著低于市场平台预期
        - Blink 看起来会更像低倍数中介，而不是高溢价数字健康平台。
        - 将估值立场从偏紧转为昂贵，并重新审视可比公司组。
      - - PBM 改革冲击
        - 州或联邦变化削弱导流经济、返点经济或药房参与度
        - 定价竞争加剧之际，核心渠道经济会被压缩。
        - 暂停投委会流程，等待改革影响模型。
      - - 网络扰动
        - 药房合作伙伴明显流失、配送失败或客服恶化
        - 留存和续方行为会走弱，从而削弱高倍数论证。
        - 如果该问题持续多个季度，将其视为论点失效。
      - - 降价轮或二级市场重置
        - 新融资或二级交易价格显著低于 $1.0B
        - 证实知情内部人认为当前公开标记过高。
        - 立即用新标记重新定价，并审查优先权影响。
      - - 优先权悬空
        - 股权结构审查显示清算优先权堆叠沉重，或棘轮条款激进
        - 即便企业价值增长，普通股结果也可能令人失望。
        - 任何条款清单或二级购买前，都要求瀑布模型。
    notes: 触发门槛是基于公开可比公司计算和已知行业风险设定的承销护栏，不是公司发布的门槛。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV026
      - CV027
      - CV031
      - CV043
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调问题表
    description: >-
      The minimum private evidence package required before Blink can move from research-more toward a positive
      recommendation.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计净收入与毛利率
        - 2024-2026 年月度与年度净收入、毛利润和渠道组合
        - 本章所有估值工作都取决于这个缺失分母。
        - CFO 数据室；经审计报表与按渠道拆分的收入桥。
      - - 留存与重复购药行为
        - 订单频率、续方率、队列留存，以及按队列划分的贡献利润
        - 证明应用和评价信号能否转化为耐久经济性。
        - 增长分析团队；队列材料与董事会材料。
      - - 药房与药企经济性
        - 头部合作伙伴集中度、抽成率、返点或服务费结构，以及合约期限
        - 判断 Blink 更像市场平台、专科获取平台，还是低利润率中介。
        - 商业负责人；NDA 下的合约摘要。
      - - 监管与合规状态
        - ADA 整改历史、投诉解决指标、隐私控制，以及任何未结调查
        - 检验公开法律和投诉信号是孤立事件还是结构性问题。
        - 总法律顾问、合规与客户运营审查。
      - - 股权结构与清算瀑布
        - 各轮条款、清算优先权、参与权、反稀释，以及任何附函
        - 即便企业价值上升，优先权悬空也可能抹掉股权上行。
        - 法务与财务；完整瀑布模型。
      - - 退出准备度
        - 官方 S-1 状态、投行准备、审计节奏，以及董事会批准的退出计划
        - 公开来源暗示有退出意图，但无法验证准备度。
        - CEO/CFO 尽调会议与外部律师确认。
    notes: 上述每一项都是阻断项，因为 Blink 当前公开证据在价格参考上更强，在运营证明和资本结构清晰度上更弱。
    claimRefs:
      - CV043
      - CV044
      - CV047
      - CV049
