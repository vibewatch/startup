      - number: '4.3'
        title: 成本结构、公开牵引力与缺失指标
        blocks:
          - type: paragraph
            body: >-
              Blink 最强的公开牵引力指标是间接的。BlinkRx 在 App Store 的评分为 4.3，来自 134 个评分；Trustpilot 显示 Blink Health 在 1,112 条评价中得
              4.2/5；Retirement Living 称 Blink 通过 35,000 家药房服务超过 750,000 人。这些证据有用，说明产品不是还没有收入的空壳，但它们不能替代可投资核验的运营 KPI。已审阅
              Blink 来源没有披露已配处方数、活跃用户、复购频率、take rate、毛利率、CAC、贡献利润率或 EBITDA。同时，成本结构不太可能轻：Blink
              把可负担性和便利性卖进受监管的处方流程，因此患者支持、合规、药房协调、配送和异常处理都可能影响利润率。行业证据也指向同一方向。FTC、药房关闭报道和当前 PBM
              改革评论都描述了一个报销规则、垂直整合和网络压力会快速改变经济性的市场。NCPA 的 2026 年关闭传单和 Legal Clarity 的 50 州 PBM
              概览进一步说明，报销压力和合规复杂度都是系统性问题，而非孤立轶事。因此，Blink 有可见需求和真实品类顺风，但它的公开牵引力远比公开财务披露丰富。
