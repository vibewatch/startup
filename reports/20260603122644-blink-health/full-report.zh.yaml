      - number: '5.4'
        title: 差异化、当前限制与路线图缺口
        blocks:
          - type: paragraph
            body: >-
              把 Blink 放在相邻模式旁边看时，它的差异化最强。GoodRx 的文件描述的是动态价格比价市场，上面叠加可选订阅；Amazon 推进的是物流加订阅栈，把开方医生 e-Rx 接入与 RxPass、当日达扩张和
              PillPack 配在一起。Blink 不同：Quick Save 是先付款的自费取药；BlinkRx 是与药企相连的患者可及性和配送工作流；Blink 的电商条款明确设想 Blink
              作为已购药物的主要付款方。这让护城河更偏运营，而不是纯算法。同时，市场背景很难。FTC 和 Drug Topics 都强调 PBM 集中度以及非关联药房承压，NCPA Digest
              则显示独立药房对农村和小社区可及性仍然重要。Blink 目前最清晰的公开限制来自产品集内部：Cash Express 暂停接收新患者，这让公司直接仿制药邮寄界面比 Amazon Pharmacy
              公开宣示的规模野心更窄。更广泛地看，Blink 的公开路线图很薄。产品面展示了当前功能和政策更新，但没有带日期的发布日历、可靠性指标或外部安全证明。
