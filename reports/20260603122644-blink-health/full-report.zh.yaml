  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对投资判断的影响
      - 具体尽调路径
    rows:
      - - 按产品线和交易对手类型拆分收入
        - 无法判断 Blink 主要是粘性较强的药企服务平台，还是质量较低的交易型消费者业务
        - 要求按 BlinkRx、Quick Save 和 Cash Express 拆分月度收入桥，并披露大客户集中度
      - - 按工作流拆分毛利率和贡献利润率
        - 无法判断扣除客服、配送和药房成本后，价格可负担与便利性是否能转化为有吸引力的单位经济模型
        - 要求毛利率桥和订单级贡献分析
      - - 按渠道拆分 CAC、复购和回本
        - 无法判断 Blink 能否高效放大消费者需求，或药企项目是否抵消 CAC 负担
        - 要求队列留存、按来源拆分获客和按产品拆分回本
      - - 现金余额、烧钱速度和营运资金时点
        - 无法从公开证据计算现金跑道或下一轮融资依赖
        - 要求当前现金、月度烧钱、应付 / 应收时点和基于情景的现金预测
      - - 定价 / 抽成率 / 合同结构
        - 无法把公开的价格可负担说法连接到实际收入或利润率获取
        - 要求价格手册、标准合同条款、药房经济性和收入确认政策
      - - 融资条款和已确认估值
        - 无法判断稀释、清算优先权堆叠，或 2025 年融资是否合理定价风险
        - 要求股权结构表、融资文件、投资人权利和管理层确认投后估值
    notes: 这些是审阅完整公开来源集后，财务尽调面临的最高优先级障碍。
