      - - Amazon Pharmacy
        - 物流驱动替代品 / 订阅药房
        - Amazon 旗下服务，捆绑 Prime，并计划到 2026 年底把当日达扩至 4,500 个城市
        - Prime 家庭、慢病用药用户和看重配送便利的消费者
        - RxPass 每月 $5 覆盖 50+ 种仿制药，另有 Prime Rx 折扣、居家配送、取药亭、PillPack 和 24/7 药剂师
        - Prime 要求以及州别 / 保险资格限制压缩 RxPass 覆盖面
      - - Mark Cuban Cost Plus Drugs 公司
        - 价格透明替代品 / 现金自付邮购
        - 私营公司；官方来源强调透明公式和 2023 年 Dallas 无菌设施，而不是融资
        - 看重清晰单元经济性和低价仿制药的现金自付消费者
        - 成本加成公式公开 15% 加价、药房费和运费，定位反中间商
        - 已审阅官方来源强调邮购和制造，而不是大型零售取药网络
      - - PBM 旗下邮购选项
        - 既有玩家 / 福利整合履约
        - 依托 CVS Caremark 和 Evernorth/Express Scripts 的计划关系
        - 雇主或保险计划已把处方导入关联渠道的参保患者
        - 网络导流、90 天供药、自动续方、药剂师支持和计划层面的成本工具
        - 脱离具体福利设计后，公开标价通常不透明
      - - 本地零售药房现状
        - 现状替代品
        - 数千家连锁和独立药房，但关闭压力正在上升
        - 希望沿用既有习惯或本地关系立即取药的患者
        - 熟悉的取药流程和保险处理
