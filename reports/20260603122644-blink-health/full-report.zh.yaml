      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              最清晰的资本数据点是 2025 年 Series D。BlinkRx 自己的公告和独立报道相互印证：1789 Capital 领投了 $140 million
              融资，且本轮规模足以带来一个董事会席位。Bloomberg 约 $2 billion
              的估值信号说明市场带有成长阶段预期，但该估值未经公司确认，不能替代现金或利润率证据。公开可比公司的跨度已经很宽：CompaniesMarketCap 显示，截至 2026 年 6 月，GoodRx 约 $0.99
              billion，Hims & Hers 约 $6.36 billion，因此 Blink
              的据报估值位于区间中部，但披露不足，无法判断这个中点保守还是激进。公开来源不披露当前现金、月度烧钱、债务或营运资本需求，因此无法直接计算 Blink 的现金跑道。留给投资者的结论很窄：Blink
              近期大概率有足够资本继续扩张，但公开基础不足以判断公司能否自我供血、何时可能需要下一轮，或消费者与药企经济性是否正在收敛到有吸引力的贡献利润率。结果是一个混合财务结论：收入流和公开需求代理指标可信，但 Blink
