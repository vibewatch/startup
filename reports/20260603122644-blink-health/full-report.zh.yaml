      - number: '4.2'
        title: 获客动作与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              Blink 的公开记录暗示两套很不同的获客引擎。药企一侧，BlinkRx 很可能依赖面向生命科学公司的企业销售，这些客户需要可负担性、患者支持和处方生命周期设计。消费者一侧，Blink
              仍要吸引终端用户，并把处方转成付费配药或配送。GoodRx 是后一种动作最好的公开可比公司，而它的文件是一个警示性基准：即使收入接近 $797 million，2025 年销售和营销仍约占收入
              41.6%；当药房关闭和项目量走弱时，处方交易收入仍然下滑。GoodRx 也表明，面向药企的处方服务可以变得有意义，2025 年药企直达收入增长 41%。对 Blink 来说，如果 BlinkRx
              正在放量，这意味着上行空间，但它不能解决消费者仿制药流程中的 CAC 问题。公开评价来源也暗示真实服务交付成本：客户谈到订单追踪、支持互动、专科药房交接和感知节省，这意味着 Blink
              几乎肯定承担了超出纯软件或简单线索生成的运营开销。Amazon 自己的订单状态材料显示，线上药房可能需要多大的运营面，包括转方追踪、药剂师审核、ID 检查和包裹更新。
