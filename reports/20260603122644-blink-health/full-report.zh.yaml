      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              Blink 最强的采用证据是渠道和项目广度，而不是披露的客户数。BlinkRx 的药企界面声称影响 55+ 个领先品牌，患者首页列出 55+ 种药物，并称在 50 州免费到家配送下，保险覆盖的配药量多出
              40%。这些说法由公司撰写，因此应视为方向性信号，而非经审计事实。即便如此，具名伙伴界面仍有意义：BlinkRx 公开展示 Mayne、Lexicon、Tarsus Pharmaceuticals、Phathom
              Pharmaceuticals、Bayer 和 Hikma，药企页面还突出围绕 neffy 正在运行的 ARS Pharmaceuticals 合作。ARS 自己的 2024 年公告确认，BlinkRx
              当时已经在接收 neffy 处方、协助先行授权，并在产品可用后免费发货。扩张证据也指向药企侧买方集合扩大。Fierce Pharma 在 2025 年 8 月报道，已有多家药企使用 BlinkRx
              的线上药房服务，点名 Bayer 和 Hikma 为现有伙伴，并把 Operation Access Now 描述为一款启动产品，可让药企在 21 天内搭起 direct-to-patient 或
              direct-to-business 渠道。这是有意义的落地扩张信号，因为它暗示 Blink 可以从履约单个品牌药处方，移动到成为药企品牌的上市基础设施。限制同样重要：除 ARS/neffy
              外，大多数具名证据仍停留在 logo 层面，没有揭示项目量、活跃患者、续约行为或按药企划分的收入集中度。
