      - number: '7.5'
        title: 剩余风险可以跟踪，但尽调门槛很高
        blocks:
          - type: paragraph
            body: >-
              Blink 的缓释成熟度并不均衡。法律文件、应用商店披露、客服基础设施和全国网络声明显示，公司在尝试把控制制度化；但公开资料中，后果最重的风险仍只被部分去风险化。投资逻辑要成立，Blink
              需要证明数据治理有纪律、报销关系稳定、投诉和配药错误率可接受，并有足够资本在监管变化中继续投入。如果隐私控制失效，PBM
              改革在没有成交量增长抵消的情况下结构性压缩经济性，药房关店或连锁药房重新定价压低覆盖质量，或服务摩擦压过省钱叙事。因此，最重要的尽调问题不是纯战略，而是运营和合同：供应商地图、广告技术清单、BAA、药房和药企集中度、投诉
              / 退款指标、履约 SLA，以及 Series D 之后的利润率 / 现金跑道桥接，投资逻辑就会破裂。缺少这些材料，Blink 更像一个需要持续监控、方差很高的执行故事，而不是已经去风险的品类赢家。
