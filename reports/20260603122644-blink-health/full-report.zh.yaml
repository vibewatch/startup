      - number: '6.3'
        title: 留存、满意度与支持韧性信号
        blocks:
          - type: paragraph
            body: >-
              Blink 不发布 NRR、GRR、流失率、平均续购率、续约队列或按产品拆分的患者留存等经典耐久性指标。因此，公开留存分析只能使用间接信号。这些信号方向上偏正面，但也混合。BlinkRx 的 App Store
              页面显示 134 个评分给出 4.3/5，并称基于 465 名客户调查，平均每张处方为患者节省 $70。存档 Trustpilot 页面显示 Blink Health 在 1,112 条评价中得
              4.2/5，BlinkRx 在 59 条评价中得 3.8/5，正面反馈集中在可负担性、配送速度，以及处方进入流程后的响应度。BlinkRx
              还披露自动续方、续方提醒、人工支持和药剂师服务，这些都是复购处方业务的黏性功能。但反向证据很重要，不应淡化。App Store 评价抱怨缺少订单追踪和药物搜索结果空白。Trustpilot
              评价提到共付意外、配送问题和“专科药房”摩擦。Reviews.io 上有更尖锐的投诉，涉及防拆封封口损坏、专科发货延迟、退款和漏单。Blink 官方状态页在访问时报告无问题，招聘页显示 600+
              名员工，覆盖患者支持、先行授权、医生运营和双语岗位，暗示公司对服务投入不小，但这些输入不能替代披露的留存队列。公开结论因此是混合的：Blink
              看起来有能力规模化完成重复履约和支持，但服务质量仍是关键留存风险，而且没有通过披露队列量化。
