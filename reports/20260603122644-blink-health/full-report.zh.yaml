      - number: '3.2'
        title: 定价和包装在免费折扣工具、订阅与福利绑定履约之间分裂
        blocks:
          - type: paragraph
            body: >-
              定价证据说明 Blink 不是只在一个轴上竞争。Quick Save 免费，并明确把自己定位为优于优惠券；Blink 的取药页面强调参与药房的预付折扣价。GoodRx 的回应是免费网络产品叠加付费 Gold
              会员，官方支持页面标价为个人每月 $9.99、家庭每月 $19.99，免费试用后开始收费。Amazon 的答案结构又不同：RxPass 把 50 多种仿制药打包进 Prime 的 $5 月度权益，再叠加
              Prime Rx 折扣、当日达扩张、PillPack 和 24/7 药剂师服务。Cost Plus Drugs 直接攻向价格公式本身的信任，公开成本加 15%、药房费和运费。PBM
              拥有的既有巨头在标价上最不透明，但往往最难撬动，因为邮寄服务、共付额和网络规则已经嵌入会员既有福利。于是，最低标价不是完整购买标准。当患者想要免费的自费比价工具或品牌疗法支持时，Blink
              看起来最强；当订阅简单性、物流密度或与保险整合的续方工作流比一次性优惠券节省更重要时，Blink 看起来更弱。
