      - number: '8.3'
        title: 情景承销与估值敏感性
        blocks:
          - type: paragraph
            body: >-
              Blink 未披露收入，因此正确的承销方式不是假装知道当前收入规模，而是反推：要让可观察到的私募估值合理，需要什么样的收入支撑。这个练习并不轻松。按 GoodRx 类似的公开市场倍数，Blink 需要约 $1.0
              billion 至 $1.6 billion 的年收入支撑，才能证明当前估值有道理。即便按 Hims 类似倍数，所需收入支撑仍落在约 $568 million 至 $744 million，而 Hims
              自身也只是略微盈利。因此，这里的乐观、基准和悲观情景都是门槛情景，不是已披露实际值情景。如果 Blink 证明收入和单位经济性更接近 Hims
              一端，当前定价可以走向合理。如果它看起来更像交易平台型或渠道中介，且没有溢价利润率，下行空间就很实质。今天的公开证据因此先支持下行保护，再支持上行可选性。
