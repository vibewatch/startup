  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    description: >-
      Illustrative underwriting cases for Blink using public-comp multiples and explicit evidence gaps; none of the
      revenue-support thresholds below are presented as reported Blink revenue.
    columns:
      - 情景
      - 示例性承销假设
      - 隐含估值区间
      - 相对 $1.62B / 约 $2.0B 标记的回报
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 数据室验证收入支撑超过约 $800M，毛利率稳定，网络合约稳固，IPO 准备度更干净；市场接受类似 Hims 或略高的倍数支撑。
        - $2.2B-$3.2B
        - 相对公开标记约 +10% 至 +98%
        - 需要经审计规模、高质量留存，以及有限的优先权压力。
        - 在 Blink 证明分母、而不只是讲清故事之前，概率偏低。
      - - 基准
        - 收入支撑验证在约 $550M-$750M 区间，单位经济良好但不是同类最优，投资人采用混合数字健康倍数。
        - $1.1B-$1.9B
        - 相对公开标记约 -45% 至 +17%
        - 即使倍数温和压缩，或隐藏优先权条款，也会抹掉上行空间。
        - 最符合目前混杂的公开证据，但仍需私有数据确认。
      - - 熊市
        - 收入支撑低于约 $500M，PBM 或报销改革压缩抽成率，或网络与服务问题推高流失；估值向低倍数中介可比公司重置。
        - $0.3B-$0.9B
        - 相对公开标记约 -55% 至 -85%
        - 分母更低与政策冲击会迅速互相强化。
        - 该情景可信，因为目前公开证据尚无法排除它。
    notes: 区间是用 GoodRx 和 Hims 公开倍数叠加情景假设构建的门槛案例；它们不是 Blink 已报告收入或管理层指引。
