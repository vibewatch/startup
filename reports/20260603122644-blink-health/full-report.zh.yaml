  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与消费者工作流
        blocks:
          - type: paragraph
            body: >-
              理解 Blink 时，应把它看成一家处方编排公司，拥有三个不同的公开界面，而不是单一折扣卡。官方首页和关于页面把品牌药的 BlinkRx、仿制药自费到店取药的 Quick
              Save，以及通过邮寄发货的自费零售仿制药 Blink Cash Express 分开呈现。这种拆分很重要，因为用户任务不同：Quick Save 是低摩擦、无会员费的仿制药省钱工具；BlinkRx
              是由开方医生触发、带支付链接和免费配送的品牌药旅程；Cash Express 则是最直接的邮寄仿制药界面——但目前不接收新患者。Blink 还围绕这套工作流运营获客型界面：热门药品目录营销 15,000
              种处方的节省空间，首单免费促销页让列出的仿制药取药和配送都免费。具体工作流证据强于泛泛营销文案。Blink 的支持文章说明，首次用户搜索药物并在线支付；取药用户收到 Blink
              Card，药剂师按主要付款方处理；BlinkRx 用户则在开方医生将订单发送给 BlinkRx U.S. 后收到短信。因此，公开产品页支持的是真实消费者工作流，而不只是线索生成式优惠券页面。
