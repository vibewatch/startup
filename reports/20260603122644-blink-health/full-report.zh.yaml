        - 要求 Blink 按药房类型和地区提供订单量趋势
      - - 消费者价格压力基准
        - Amazon RxPass 公开提供 50+ 种仿制药，每月 $5，含免费配送
        - 高
        - 为自费仿制药经济性设下硬性外部参照
        - 要求 Blink 对比 RxPass、GoodRx 和主要邮寄药房替代方案的价格梯度
      - - PBM / 专科药加价风险
        - FTC 称三大 PBM 从专科仿制药高于采购成本的加价中获得超过 $7.3B
        - 高
        - 释放出专科药可及性经济模型面临监管和利润率压力的信号
        - 要求 Blink 披露专科药报销、导流规则和价差经济性的敞口
      - - 服务履约成本代理指标
        - Blink 承诺免费配送，公开评论提到追踪、客服和专科药房交接；Amazon 的订单状态材料显示，规模化线上药房同样需要转方追踪、药师审核、身份检查和包裹更新，但 Blink 单笔订单成本未公开
        - 中
        - 说明运营成本可能不低，并会侵蚀毛利率
        - 要求提供每张处方的配送、客服人力、异常处理和药房协调成本
    notes: 这里所有数字代理指标都来自公开可比公司或品类证据；Blink 特定的 CAC、利润率和回本仍只能靠私有证据验证。
