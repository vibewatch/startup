      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              多重顺风支撑 Blink 所在市场。药品支出仍处高位，患者自付负担依然较重，药房关闭让配送和数字支持更有吸引力。Amazon
              自己的扩张论证明确引用药房关闭、人手短缺和交通障碍，这支持了一个判断：可及性摩擦会为数字中介创造需求。与此同时，这个品类竞争更激烈，也更政治化。Amazon 正在推进当日达和 $5 仿制药订阅；Cost Plus
              Drugs 正在把透明自费定价常态化；GoodRx 则围绕自费和药企直达可及性重新定位。PBM 集中度仍是最大的结构性约束，因为即使公司直接面向患者营销，PBM
              也会塑造报销、导流和药房经济性。改革压力同样真实：全美州级立法、脱钩改革、基于 NADAC 的报销底价、差价定价禁令，以及 IRA 带来的定价变化，都指向未来几年更有争议的经济模型。最后，Blink
              自身产品证据也保留了摩擦。报告生成日 Cash Express 不接收新患者，BlinkRx 只适用于精选药物，评价来源显示服务质量和节省幅度存在明显差异。
