      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Blink 的买方—用户—付款方结构随工作流变化。在 Quick Save 和 Cash Express 中，患者既是经济买方也是终端用户，药剂师负责配药操作，Blink 则是路由和定价层。在 BlinkRx
              的品牌药工作流中，患者仍是用户，但药企或品牌团队看起来会赞助可及性体验，医生和诊室人员通过把处方直接发送给 BlinkRx U.S.
              来启动路径。因此，即便不直接付费，开方医生、药剂师、支持代表和照护者也都是运营用户。采用路径通常从一张处方或一次价格冲击开始，进入保险覆盖或可负担性检查，然后分叉为本地取药、自费配送，或由药企支持的
              BlinkRx 流程。IQVIA 关于许多新上市药物在首年未被配取的证据，有助于解释为什么 BlinkRx 把自己销售为可及性和依从性平台，而不只是低价入口。尽调时，Blink
              应按工作流和可及性业务建模，而不是按优惠券或邮寄药房克隆体建模。
