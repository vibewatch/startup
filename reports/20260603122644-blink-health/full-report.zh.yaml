        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层公开形象仍明显围绕创始人。独立报道与 2025 年 Series D 公告一致称，Geoffrey Chaiken 和 Matthew Chaiken 两兄弟 2014 年创办 Blink，Geoffrey
              担任 CEO，Matthew 担任总裁。公开治理披露比产品披露薄得多：目前最清晰的董事会事实来自 2025 年融资公告，称 1789 Capital 领投 Series D 后 Donald Trump Jr.
              加入董事会，Kelly Ayotte 在服务五年后离任。这足以确认一次重要董事会变动，但不足以重建完整的现任董事会或股权控制结构。


              PremierAlts 还列出 Selvam Velmurugan 为 CTO、Michael Nameth 为 Cloud & Specialty Pharmacy
              执行副总裁（EVP），但这些职务没有在可访问的官方页面得到印证。按公开记录，关键人依赖仍集中在 Geoffrey Chaiken 这个 CEO 公开发言人，以及 Matthew Chaiken
              这个联合创始人兼总裁身上；治理透明度低于后期投资者在核验控制权、继任韧性或董事会独立性前通常希望看到的水平。
