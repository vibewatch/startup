  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: Blink 产品栈中的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Blink Health 的客户基础最好理解为三个重叠但经济性不同的界面。Quick Save 瞄准不用保险、用现金购买仿制药的消费者，并可在参与药房免费使用。Blink 的零售电商产品同样瞄准自费消费者，但
              Blink 在交易中成为主要付款方，患者为取药或到家配送预付。BlinkRx 位于处方旅程更上游：品牌药项目从医生把处方发送到 BlinkRx U.S. 开始，随后 BlinkRx
              及其网络药房协调保险、先行授权、共付支持和配送。三种动作中，患者都是终端用户，但付款方可能在患者、商业保险方和药企赞助援助项目之间变化。官方界面说明了为什么分层重要。Blink
              的消费者产品叙事强调仿制药现金价更低，并可在全美 35,000+ 家药房取药，其中包括 16,000+ 家独立药房；BlinkRx 则强调覆盖 50 州的免费到家配送、55+ 种药物和 55+
              个领先品牌。医生和药房渠道不是可选项：Blink 需要开方医生发送或转移处方，并依赖持牌第三方药房配药或发货。结果是前端 B2C，底层有 B2B2C
              依赖。公开客户数披露很薄——公司不按产品发布活跃患者、复购者或覆盖人群——因此最好的外部规模代理来自评价量、药房网络广度和员工 / 支持足迹，而不是经审计客户指标。
