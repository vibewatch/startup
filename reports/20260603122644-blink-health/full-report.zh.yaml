  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与估值锚
        blocks:
          - type: paragraph
            body: >-
              进入估值章节时，Blink 有真实融资信号，但分母不完整。公开来源一致认为，1789 Capital 在 2025 年领投了 $140 million Series D，且 Donald Trump Jr.
              在融资后加入董事会。分歧在于估值锚：一篇由 Bloomberg 报道、Yahoo 发布的条目指向约 $2.0 billion，而 Forge 列出 $1.62 billion 的 Series D
              估值，并提到一份保密 S-1。这个区间很重要，因为 Blink
              尚未公开披露收入、毛利率、留存或股权结构条款。结果就是典型的私募市场问题：投资者看得到标价，却还看不到判断这个标价便宜、合理还是昂贵所需的运营事实。产品描述和应用商店证据确认，Blink
              在尝试降低处方成本和摩擦；但这些事实本身还不足以支撑当前私募估值标记。
            claimRefs:
              - CV001
