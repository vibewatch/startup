      - number: '3.4'
        title: Blink 在品牌药可及性上有真实利基，但仿制药自费比价最容易商品化
        blocks:
          - type: paragraph
            body: >-
              对 Blink 最有利的公开证据不是它像折扣卡的表层，而是 BlinkRx。药企页面称 BlinkRx 服务 55+ 个领先品牌，提供透明低价、免费到家配送和支持；相比 GoodRx 的优惠券加订阅模式或
              Cost Plus 的透明邮寄定价，这更像重工作流的价值主张。Blink 看起来也有可观的人力和融资支持：招聘页称员工 600+ 人，其中技术人员 200+ 人；Crunchbase 报道 $140
              million Series D 让累计融资达到 $315 million。但护城河耐久性仍有条件。仿制药自费比价天然容易商品化，因为 GoodRx、Amazon、Cost Plus 和零售 / PBM
              渠道都从不同方向攻击可负担性。反向证据值得注意：报告生成日 Blink Cash Express 不接收新患者，GoodRx 称其正在强化零售关系，Amazon
              正把更快配送覆盖扩展到数千个更多社区。公开来源也留下重大缺口。它们不披露 Blink 已实现的单张处方经济性、BlinkRx 药企项目背后的商业条款，或 Cash Express
              停止接收新患者的原因。因此，尽调结论需要保持细分：Blink 拥有差异化的品牌药可及性切口，但消费者省钱业务面对强烈商品化和渠道压力，除非 Blink 能在私有数据中证明更强留存、经济性和伙伴黏性。
