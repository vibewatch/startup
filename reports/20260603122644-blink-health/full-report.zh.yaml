      - number: '8.2'
        title: 市场结构与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              从需求看，市场背景有吸引力；从结构看，要求很高。ASHP 和 IQVIA 显示处方药支出仍在快速上升，而 FTC 证据显示，PBM 对处方可及性和经济性仍有异常强的控制力。这意味着 Blink
              正在一个渠道里追逐巨大的痛点，而这个渠道的报销、引导和关联药房经济性都高度受争议。药房关店可能为便捷可及性模式创造更多消费者需求，但也凸显了政策或 PBM
              条款变化时，药房经济性有多脆弱。在这个背景下，公开可比公司给出了有纪律的估值框架。GoodRx 是最接近的交易平台型基准，尽管消费者触达很广，仍按低个位数销售额倍数交易。Hims
              享有溢价倍数，但它的收入规模大得多，品牌和远程医疗整合也更广。Amazon 和 Cost Plus 表明，价格透明和配送竞争不会长期空白。
