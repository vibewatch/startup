  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Blink 真正参与的位置
        blocks:
          - type: paragraph
            body: >-
              Blink 不只是又一家线上药房，也不是 PBM。公开产品面显示三条相邻工作流：Quick Save 做本地自费取药，Blink Cash Express 做自费配送，BlinkRx
              做药企赞助或医生转介的处方履约。因此，市场边界应从门诊零售处方药的获取、定价和履约开始，而不是全部医疗支出或全部制药经济。应纳入口径的是这些零售处方活动：患者对价格敏感，药房可以通过数字路由层配药，或药企需要患者可及性伙伴来降低放弃率、加快治疗启动。排除项包括保险承保、广泛处方集管理，以及
              Blink 看起来不控制诊疗路径的由医生给药类别。现状替代品仍是优惠券卡、标准零售取药、邮寄药房，以及其他数字药房或自费定价平台。尽调的关键是：Blink 的可变现切口真实存在，但比全国药品支出标题数字暗示的窄。
