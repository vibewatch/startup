      - number: '1.4'
        title: 里程碑、历史规模信号与反向记录
        blocks:
          - type: paragraph
            body: >-
              Blink 的历史叙事比它当前的私募市场披露更清楚。可访问报道显示，公司从 2014 年成立，到 2016 年 2 月上线，再到 2019 年声称拥有 600,000-750,000 名客户并快速招聘，随后
              Forge 轮次历史中出现 2020 年 10 月 Series C，最后来到 2024/2025 年 Series D 复盘。反向记录也真实存在，尽管从已审阅来源看并非生死级别。CourtListener 显示
              Blink Health Ltd. 曾在 2018 年对 Hippo Technologies 提起商业秘密诉讼，随后自愿撤诉；2020 年一项 ADA 集体诉讼投诉则指称 Blink
              网站无法被盲人用户无障碍访问。


              消费者评价是混合的，而不是一边倒负面：Trustpilot 显示 1,112 条评价给出 4.2 分，Apple App Store 显示 134 个评分给出 4.3 分，但 BBB
              仍有正式投诉页面，评价文本也突出配送、导航和价格方面的挫败感。最大的分析缺口不是法律，而是运营披露：我们仍没有当前活跃客户数、当前收入或 ARR，也没有管理层确认的估值基准。
