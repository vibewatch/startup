      - number: '3.3'
        title: 分销权和切换成本更偏向 Amazon 与 PBM 拥有的既有巨头，而不是 Blink
        blocks:
          - type: paragraph
            body: >-
              最硬的竞争证据不在标价，而在渠道控制。FTC 发现显示，前三大 PBM 在 2023 年处理了近 80% 的美国处方，并可能把患者导向关联药房；FTC
              第二份报告则描述了专科仿制药中的数十亿美元超额收入和差价定价。CVS Caremark 和 Express Scripts 随后展示了这种权力面向客户的实际版本：整合的计划管理、网络药房搜索、90
              天邮寄服务、自动续方、包邮和药剂师服务，都搭在既有雇主或健康计划关系上。Amazon 的挑战效果类似，但机制不同：它把 Prime
              订阅、全国履约、当日达扩张、自助机和数字用药管理组合成一个药房便利性的物流包。Blink 的 35,000+ 家取药伙伴有意义，但 GoodRx 的 70,000+ 覆盖以及 PBM 拥有选项的内嵌导流权，意味着
              Blink 的网络规模不等于分销控制权。因此，真实切换成本很可能是混合的。Blink 能赢下机会型自费配药和品牌患者支持旅程，但当 PBM 拥有或 Amazon
              拥有的工作流已经织进福利、自动续方习惯或家庭订阅时，它们会变得黏性更强。这是公开记录中最持久的竞争劣势。
