chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品面与当前覆盖
        blocks:
          - type: paragraph
            body: >-
              Blink Health 是一家总部位于纽约的处方药可及性公司，当前同时面向消费者和药企，产品栈分成三块：品牌药的 BlinkRx、仿制药自费到店取药的 Quick Save，以及自费邮寄的 Blink Cash
              Express。官方法律和联系材料一致把运营地址指向纽约 1407 Broadway, Suite 1910；招聘页还显示 Pittsburgh、Chesterfield（St. Louis）和 Boise
              设有办公室。按纸面口径，当前分销覆盖相当可观：药房取药网络页面称 Blink 可在全美 35,000+ 家参与药房使用，另有 16,000+ 家未显示在定位器上的独立药房；BlinkRx 则声称可为 55+
              种药物、55+ 个领先品牌在美国 50 州免费送药到家。


              2026 年招聘页还称 Blink 拥有 600+ 名团队成员，其中包括 200+ 名技术人员。但当前产品可用性并不均衡：Cash Express
              登录页称该服务不接收新患者，不同官方页面发布的支持时间窗口也不同，因此现有运营面需要按产品逐一确认。法律实体栈也比消费者品牌呈现的更复杂：现行条款和 HIPAA 通知在不同语境下引用 Blink Health
              Inc.、Blink Health Administration LLC、Blink Health Pharmacy LLC 和 Blink Rx LLC。
