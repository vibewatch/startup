        - 更应视为低摩擦现金自付比价工具
      - - Blink Cash Express
        - 已审阅来源未显示公开消费者价目表；邮购流程目前暂停接收新患者
        - 邮购现金自付履约
        - 新患者关闭让当前套餐经济性不清晰
        - 在服务状态恢复正常前，削弱 Blink 的邮购定位
      - - GoodRx Free
        - 覆盖 70,000+ 个药房网点的免费折扣市场
        - 优惠券查询、比价、取药 / 配送选项和 App 工具
        - 节省金额随药品和药房而变；无通用公式
        - 全国免费消费者搜索中最强的直接同业
      - - GoodRx Gold
        - 30 天试用后，个人 $9.99/月，家庭 $19.99/月
        - 更深折扣、70,000+ 个网点和基于订阅的省钱工作流
        - 官方支持页说明计划，但不披露每张处方的实际价格
        - 把免费省钱产品转成经常性会员经济性
      - - Amazon RxPass / Prime Rx
        - RxPass 以 $5/月覆盖 50+ 种仿制药；Prime Rx 折扣最高为仿制药 80%、品牌药 40%
        - 自动续方、居家配送、药剂师支持和 Prime 捆绑
        - 需要 Prime；RxPass 资格排除部分保险 / 州别组合
        - 对长期重复使用的仿制药维持用药来说，套餐比 Blink 更简单
      - - Cost Plus Drugs
        - 成本加 15%，再加药房费、运费和税费
        - 透明邮购定价和反中间商定位
        - 运费因地点而异；已审阅官方来源未证明零售取药
        - 这一组中最透明的价格公式
