      - number: '5.2'
        title: 运营模型、集成与服务工作流
        blocks:
          - type: paragraph
            body: >-
              已审阅证据支持一个服务很重的运营模型，但不支持还原详细内部软件架构。Blink 的公开材料展示了处方如何进入并流经系统：医生或药房可以通过 SureScripts e-Rx、电话、传真或邮寄纸质处方把订单发送到
              Blink Pharmacy U.S.；Blink 条款任命公司作为患者代理人，用于 PHI 调取以及联系医生或药房；BlinkRx 页面营销先行授权提醒、续方支持和购买时保证库存。药企页面补上市场另一侧，把
              BlinkRx 定位为生命科学品牌的云药房基础设施，并区分患者、医生和药企，而不是单一消费者界面。招聘数据进一步说明，这个运营模型不只是外包呼叫中心胶水：Blink
              正在药房运营、工程、IT、安全、产品和患者服务等岗位招聘。同样重要的是公开记录没有提供什么。已审阅界面没有发布公共 API、集成规范、正常运行时间 SLA
              或状态页，因此本章可以负责任地描述处方服务工作流和依赖图，但不能猜测软件栈或隐藏架构。
