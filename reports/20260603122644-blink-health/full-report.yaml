  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, User, and Payer Segmentation Across Blink’s Product Stack
        blocks:
          - type: paragraph
            body: >-
              Blink Health’s customer base is best understood as three overlapping but economically different surfaces.
              Quick Save targets consumers buying generic drugs with cash instead of insurance and is free to access at
              participating pharmacies. Blink’s retail e-commerce product also targets cash-pay consumers, but Blink
              becomes the primary payor in the transaction and the patient prepays for pickup or home delivery. BlinkRx
              sits farther upstream in the prescription journey: branded medication programs start with a provider
              sending a script to BlinkRx U.S., then BlinkRx and its network pharmacies coordinate insurance, prior
              authorization, copay support, and delivery. Patients are the end users across all three motions, but the
              paying party can vary between the patient, a commercial insurer, and manufacturer-sponsored assistance
              programs.  Official surfaces show why segmentation matters. Blink’s consumer product pitch emphasizes
              lower cash prices on generics and pickup at 35,000+ pharmacies nationwide, including over 16,000
              independents, while BlinkRx emphasizes 50-state free home delivery, 55+ medications, and 55+ leading
              brands. The provider and pharmacy channel is not optional: Blink needs prescribers to send or transfer
              scripts and relies on licensed third-party pharmacies to dispense or ship medication. The result is a B2C
              front end with B2B2C dependencies underneath. Public customer-count disclosure is thin—the company does
              not publish active patients, repeat purchasers, or covered lives by product—so the best external scale
              proxies come from review volumes, pharmacy-network breadth, and workforce/support footprint rather than
              from audited customer metrics.
