      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Blink's buyer-user-payer structure changes by workflow. In Quick Save and Cash Express, the patient is
              both the economic buyer and the end user, with the pharmacist acting as the dispensing operator and Blink
              positioned as the routing and pricing layer. In BlinkRx's branded-medication workflow, the patient is
              still the user, but manufacturers or brand teams appear to sponsor the access experience while providers
              and office staff initiate the prescription path by sending scripts directly to BlinkRx U.S. That makes
              prescribers, pharmacists, support representatives, and caregivers operational users even when they are not
              paying. The adoption path usually begins with a prescription or a price shock, moves into a coverage or
              affordability check, and then branches into local pickup, cash-pay delivery, or a manufacturer-supported
              BlinkRx journey. IQVIA's evidence that many newly launched drugs go unfilled in their first year helps
              explain why BlinkRx sells itself as an access-and-adherence platform rather than only a low-price
              storefront. For diligence, this means Blink should be modeled as a workflow and access business, not just
              a coupon or mail-order pharmacy clone.
