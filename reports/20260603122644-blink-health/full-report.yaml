companyProfile:
  summary: >-
    Blink Health is a 2014-founded New York prescription-access company founded by Geoffrey and Matthew Chaiken. Its
    current stack spans BlinkRx for branded medications, Quick Save for cash-pay generic pickup, and Blink Cash Express
    for mail-order generics, with public evidence supporting a national footprint across 35,000+ participating
    pharmacies, 16,000+ additional independents, 50-state BlinkRx delivery, and 600+ employees. Blink also appears to
    monetize through a mix of manufacturer-program services, transaction-linked generic savings, and direct cash-pay
    fulfillment. The underwriting problem is not whether Blink has a real operating surface, but whether opaque
    economics, conflicting funding and valuation references, and elevated regulatory and operational risk leave enough
    margin of safety at current private-market marks.
