              signals. Those signals are directionally positive but mixed. BlinkRx’s App Store page shows 4.3/5 from 134
              ratings and says the average patient saves $70 per prescription based on a 465-customer survey. Archived
              Trustpilot pages show 4.2/5 from 1,112 reviews for Blink Health and 3.8/5 from 59 reviews for BlinkRx,
              with praise concentrated around affordability, delivery speed, and responsiveness once a prescription is
              in flight. BlinkRx also discloses auto-refills, refill reminders, human support, and pharmacist access,
              all of which are sticky features for a repeat-prescription business.  But the adverse evidence is material
              and should not be glossed over. App Store reviews complain about missing order tracking and blank
              medication search results. Trustpilot reviews mention copay surprises, shipping problems, and “specialty
              pharmacy” friction. Reviews.io carries harsher complaints about broken tamper-evident seals, delayed
              specialty shipments, refunds, and missed orders. Blink’s official status page reported no issues at the
              time of access, and the careers page shows a 600+ employee footprint with patient support,
              prior-authorization, provider-operations, and bilingual roles that suggest meaningful servicing
              investment, but those inputs are not a substitute for disclosed retention cohorts. The public conclusion
              is therefore mixed: Blink appears capable of repeat fulfillment and support at scale, yet service quality
              remains a key retention risk and is not quantified through disclosed cohorts.
