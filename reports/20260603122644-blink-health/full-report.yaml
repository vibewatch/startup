  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing signals
        blocks:
          - type: paragraph
            body: >-
              Blink's public materials support a three-part revenue story rather than a single discount-card narrative.
              The homepage explicitly splits the business into BlinkRx for branded medications, Blink Quick Save for
              cash-pay generic discounts at retail pharmacies, and Blink Cash Express for direct mail-order generics.
              That matters because each surface implies a different payer, revenue-recognition pattern, and quality
              profile. BlinkRx looks most like a B2B prescription-access workflow sold to manufacturers, where
              monetization is likely tied to program fees, patient onboarding, affordability services, and fulfillment
              orchestration. Quick Save looks more like transaction-linked consumer savings at the point of pickup,
              while Cash Express looks closer to a cash-pay e-commerce pharmacy flow. The missing piece is realized
              pricing: Blink markets affordability, low prices, and no-cost delivery, but public sources do not disclose
              take rate, spread, per-order gross profit, or whether Blink subsidizes delivery or support to win volume.
              Amazon's $5-per-month RxPass demonstrates how aggressive the outside pricing bar has become for cash-pay
              generics, which likely compresses Blink's room to monetize consumer traffic without heavy volume.
