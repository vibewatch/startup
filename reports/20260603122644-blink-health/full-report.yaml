  - id: TV005
    title: Thesis-break and kill triggers table
    description: Events or thresholds that would materially damage the public-evidence case for Blink at current price levels.
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue support misses
        - Validated annual revenue support below roughly $500M
        - Current public marks would look aggressive even against the lower-multiple public comp set.
        - Do not add at current price; reset underwriting to a lower range.
      - - Margin or take-rate weakness
        - Gross margin or contribution economics materially below marketplace expectations
        - Blink would screen more like a low-multiple intermediary than a premium digital-health platform.
        - Move valuation stance from stretched to expensive and revisit the comp set.
      - - PBM reform shock
        - State or federal changes cut steering economics, rebate economics, or pharmacy participation
        - Core channel economics would compress just as pricing competition intensifies.
        - Pause investment committee process pending reform impact model.
      - - Network disruption
        - Meaningful pharmacy-partner attrition, delivery failures, or customer-service deterioration
        - Retention and refill behavior would weaken, reducing any case for premium multiples.
        - Treat as a thesis-break if it persists across multiple quarters.
      - - Down-round or secondary reset
        - New financing or secondary prints materially below $1.0B
        - Confirms that informed insiders view the current public marks as too high.
        - Reprice using the new mark and review preference effects immediately.
      - - Preference overhang
        - Cap-table review shows heavy liquidation stack or aggressive ratchets
        - Common-equity outcomes can disappoint even if enterprise value grows.
        - Require waterfall modeling before any term sheet or secondary purchase.
    notes: >-
      Trigger thresholds are underwriting guardrails based on public comp math and known industry risks, not
      company-published thresholds.
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV026
      - CV027
      - CV031
      - CV043
      - CV046
      - CV047
  - id: TV006
    title: Final diligence asks table
    description: >-
      The minimum private evidence package required before Blink can move from research-more toward a positive
      recommendation.
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited net revenue and gross margin
        - Monthly and annual net revenue, gross profit, and channel mix for 2024-2026
        - All valuation work in this chapter depends on the missing denominator.
        - CFO data room; audited statements and revenue bridge by channel.
      - - Retention and repeat-fill behavior
        - Order frequency, refill rate, cohort retention, and contribution profit by cohort
        - Proves whether app and review signals translate into durable economics.
        - Growth analytics team; cohort deck and board materials.
      - - Pharmacy and manufacturer economics
        - Top partner concentration, take rates, rebate or service-fee structure, and contract durations
        - Determines whether Blink behaves like a marketplace, specialty access platform, or lower-margin intermediary.
        - Commercial leadership; contract summaries under NDA.
      - - Regulatory and compliance posture
        - ADA remediation history, complaint-resolution metrics, privacy controls, and any open investigations
        - Tests whether public legal and complaint signals are isolated or structural.
        - General counsel, compliance, and customer-operations review.
      - - Cap table and liquidation waterfall
        - Series terms, liquidation preferences, participation rights, anti-dilution, and any side letters
        - Preference overhang can erase equity upside even if enterprise value rises.
        - Legal and finance; full waterfall model.
      - - Exit readiness
        - Official S-1 status, banker preparation, audit cadence, and board-approved exit plan
        - Public sources hint at exit ambition but do not verify readiness.
        - CEO/CFO diligence session and counsel confirmation.
    notes: >-
      Every item above is a blocker because Blink’s current public evidence set is stronger on price references than on
      operating proof or capital-structure clarity.
    claimRefs:
      - CV043
      - CV044
      - CV047
      - CV049
