      - number: '3.2'
        title: Pricing and packaging split between free discount tools, subscriptions, and benefit-tied fulfillment
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence shows why Blink is not competing on one axis alone. Quick Save is free and explicitly
              positions itself as better than coupons, while Blink’s pickup page emphasizes prepaid discounted prices at
              participating pharmacies. GoodRx counters with a free network product plus the paid Gold membership, which
              official support pages price at $9.99 per month for individuals and $19.99 per month for families after a
              free trial. Amazon’s answer is structurally different again: RxPass wraps more than 50 generics into a $5
              monthly Prime benefit and then layers in Prime Rx discounts, same-day delivery expansion, PillPack, and
              24/7 pharmacist access. Cost Plus Drugs goes after trust in the price formula itself by publishing cost
              plus 15%, a pharmacy fee, and shipping. PBM-owned incumbents are the least transparent on list pricing but
              often the hardest to dislodge because mail service, copays, and network rules are embedded in the member’s
              existing benefit. That makes cheapest sticker price an incomplete buying criterion. Blink looks strongest
              when the patient wants a free cash-pay comparison tool or branded-therapy support; it looks weaker where
              subscription simplicity, logistics density, or insurance- integrated refill workflows matter more than
              one-time coupon savings.
