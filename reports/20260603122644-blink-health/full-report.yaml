        - id: price-pay
          label: See price and pay
          description: Blink shows price and captures payment online or by phone before pickup or shipment
        - id: pickup-card
          label: Pickup proof generated
          description: Quick Save issues a Blink Card by text or email for pharmacy processing as primary payor
        - id: delivery-routing
          label: Delivery routing
          description: Blink Pharmacy U.S. or BlinkRx fulfillment path receives the prescription and arranges shipment
        - id: support-touch
          label: Support / transfer / refill touchpoint
          description: Phone, email, FAQ, and pharmacist outreach handle transfer, refill, and issue resolution
        - id: medication-in-hand
          label: Medication in hand
          description: Patient picks up locally or receives the order at home
      edges:
        - from: prescription
