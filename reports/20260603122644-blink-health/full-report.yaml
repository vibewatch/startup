      - number: '8.2'
        title: Market structure and comparable set
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is attractive in demand terms but demanding in structure. ASHP and IQVIA show
              prescription drug spend still rising sharply, while FTC evidence shows PBMs retain extraordinary control
              over prescription access and economics. That means Blink is pursuing a large pain point inside a channel
              where reimbursement, steering, and affiliated-pharmacy economics remain highly contested. Pharmacy
              closures may create more consumer demand for convenient access models, but they also underline how fragile
              pharmacy economics can become when policy or PBM terms move. Against that backdrop, public comparables set
              a disciplined valuation frame. GoodRx is the closest marketplace-like benchmark and trades on
              low-single-digit sales multiples despite broad consumer reach. Hims commands a premium multiple, but it
              does so at much larger revenue scale and with broader brand and telehealth integration. Amazon and Cost
              Plus show that price-transparency and delivery competition will not stay empty for long.
