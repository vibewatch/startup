  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Blink's key risks transmit into valuation through a small number of operational chokepoints: pharmacy coverage,
      conversion, service levels, and margin durability.
    data:
      nodes:
        - id: privacy
          label: Privacy / HBNR failure
          detail: Data-sharing or breach controls fail under FTC/HHS scrutiny
        - id: pbm
          label: PBM reform
          detail: Reimbursement, anti-steering, or transparency rules tighten
        - id: closures
          label: Pharmacy closures
          detail: Independent or local pickup access declines
        - id: ops
          label: Service friction
          detail: Prior auth, transfer, delivery, or refund issues rise
        - id: conversion
          label: Fill conversion
          detail: Patients complete fewer orders or therapies
        - id: margin
          label: Gross margin / CAC
          detail: Unit economics weaken as support and partner costs rise
        - id: runway
          label: Runway / capital
          detail: Need for more capital arrives earlier than planned
        - id: valuation
          label: Valuation support
          detail: Investors haircut multiple and confidence
      edges:
        - from: privacy
          to: ops
          label: trust shock
        - from: privacy
          to: valuation
          label: regulatory overhang
        - from: pbm
          to: margin
          label: repricing
        - from: pbm
          to: conversion
          label: network friction
        - from: closures
          to: conversion
          label: coverage loss
        - from: ops
          to: conversion
          label: abandonment
        - from: conversion
          to: margin
          label: volume loss
        - from: margin
          to: runway
          label: cash burn
        - from: runway
          to: valuation
          label: dilution risk
        - from: ops
          to: valuation
          label: trust / NPS drag
