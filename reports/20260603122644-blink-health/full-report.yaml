      - number: '3.4'
        title: Blink has a real niche in branded access, but commoditization risk is highest in generic cash-pay shopping
        blocks:
          - type: paragraph
            body: >-
              The most favorable public evidence for Blink is not its discount-card lookalike surface but BlinkRx. The
              manufacturer page says BlinkRx serves 55-plus leading brands and offers transparent low prices, free home
              delivery, and support, which is a more workflow-heavy proposition than GoodRx’s coupon-plus-subscription
              model or Cost Plus’s transparent mail-order pricing. Blink also appears to have meaningful staffing and
              financing support: its careers page cites 600-plus employees with 200-plus technology staff, and
              Crunchbase reported a $140 million Series D that brought total funding to $315 million. But moat
              durability is still conditional. Generic cash-pay comparison shopping is inherently easy to commoditize
              because GoodRx, Amazon, Cost Plus, and retail/PBM channels all attack affordability from different
              directions. The adverse evidence is notable: Blink Cash Express was not accepting new patients at run
              date, GoodRx says it is strengthening retail relationships, and Amazon is expanding faster-delivery
              coverage into thousands more communities. Public sources also leave material gaps. They do not disclose
              Blink’s realized per-script economics, the commercial terms behind BlinkRx’s manufacturer programs, or the
              reason Cash Express stopped onboarding new patients. The diligence conclusion is therefore nuanced: Blink
              has a differentiated branded-access wedge, but its consumer savings businesses face strong commoditization
              and channel pressure unless Blink can show superior retention, economics, and partner stickiness in
              private data.
