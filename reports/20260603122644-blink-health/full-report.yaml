  - id: TV002
    title: Thesis / anti-thesis table
    description: Core arguments for and against investing in Blink at current private-market marks.
    columns:
      - Type
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Prescription affordability remains a large, growing pain point as U.S. drug spending heads toward the
          trillion-dollar level.
        - >-
          Demand tailwind weakens if drug-spend growth slows materially or consumer savings products stop converting
          into repeat behavior.
      - - Thesis
        - Blink’s app-store and review signals suggest real customer utility around low prices, delivery, and support.
        - The thesis strengthens if Blink publishes cohort retention, refill frequency, and on-time delivery metrics.
      - - Thesis
        - A $140M Series D led by 1789 Capital shows the company can still attract meaningful private capital.
        - >-
          The thesis strengthens if the round terms, syndicate quality, and use of proceeds align with durable growth
          rather than rescue financing.
      - - Thesis
        - PBM scrutiny and pharmacy disruption create space for alternative prescription-access platforms to win share.
        - >-
          The thesis weakens if new reform primarily benefits incumbents or compresses economics for intermediaries like
          Blink.
      - - Anti-thesis
        - >-
          Blink has not publicly disclosed revenue, gross margin, retention, or cap-table terms, so the current price
          cannot be tested directly.
        - >-
          The anti-thesis weakens if audited financials place Blink near or above the Hims-like revenue-support
          thresholds.
      - - Anti-thesis
        - Public valuation references conflict between roughly $2.0B and $1.62B, which signals weak price discovery.
        - Official financing disclosures or a confirmed tender or secondary price would reduce this opacity.
      - - Anti-thesis
        - >-
          Amazon Pharmacy and Cost Plus Drugs raise the bar on transparent pricing, low-cost generics, and fast
          delivery.
        - >-
          The anti-thesis weakens if Blink proves stronger retention, better economics, or unique manufacturer and
          pharmacy relationships.
      - - Anti-thesis
        - >-
          Complaint and litigation history means operational quality and compliance still need to be verified, not
          assumed.
        - >-
          The anti-thesis weakens if Blink shows clean remediation history, complaint-resolution metrics, and
          accessibility controls.
    notes: >-
      Arguments are weighted by public-evidence quality only; missing private financials keep the anti-thesis unusually
