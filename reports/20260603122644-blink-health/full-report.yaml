      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is also unproven in public evidence. Forge’s confidential-S-1 reference is useful as a
              market signal, but it is not official confirmation of filing status, timing, or readiness. That means
              investors still need to do the heavy lifting on the basics: audited net revenue, gross margin, retention,
              take rates, network stability, and the liquidation waterfall. Those items determine not only whether the
              current mark is supportable, but also whether any eventual exit will reward common-equity style
              underwriting or mostly serve the preference stack. The final diligence asks therefore focus on financial
              denominator, channel economics, preference overhang, and compliance hygiene. If Blink can answer those
              asks positively and the validated revenue base clears the public-comp thresholds shown in this chapter,
              the call can move upward. If it cannot, the current private marks should be treated as too full rather
              than as a gift.
            claimRefs:
              - CV043
              - CV044
              - CV046
              - CV047
              - CV049
