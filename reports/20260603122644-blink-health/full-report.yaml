  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision chain from financing signal and customer utility through comp-multiple discipline and risk screens to the
      final recommendation.
    data:
      nodes:
        - id: n1
          label: Financing signal
          detail: $140M Series D confirms investor appetite
        - id: n2
          label: Customer utility
          detail: App and review signals are directionally positive
        - id: n3
          label: PBM / channel structure
          detail: 95% prescription concentration and active reform raise execution risk
        - id: n4
          label: Comparable math
          detail: GoodRx and Hims imply large revenue-support thresholds
        - id: n5
          label: Evidence gap
          detail: Blink revenue, margin, retention, and cap table remain undisclosed
        - id: n6
          label: Valuation stance
          detail: Current marks read stretched, not clearly attractive
        - id: n7
          label: Recommendation
          detail: research-more / track only after private diligence
      edges:
        - from: n1
          to: n6
          label: supports interest
        - from: n2
          to: n7
          label: prevents avoid
        - from: n3
          to: n6
          label: raises risk
        - from: n4
          to: n6
          label: tests price
        - from: n5
          to: n7
          label: blocks buy
        - from: n6
          to: n7
          label: drives call
    approximationNotes: Node details are qualitative summaries of cited claims rather than a quantified scoring model.
    claimRefs:
      - CV002
      - CV006
      - CV015
      - CV017
      - CV037
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative annual revenue support required for Blink to justify observed private marks under public-comp sales
      multiples, shown in USD millions.
    data:
      items:
        - label: $1.62B at GoodRx P/S 1.27x
          value: 1276
          detail: Uses GoodRx price-to-sales as the low-multiple anchor.
        - label: $1.62B at GoodRx EV/Sales 1.66x
          value: 976
          detail: Uses GoodRx EV-to-sales as a slightly less punitive benchmark.
        - label: $1.62B at Hims P/S 2.69x
          value: 602
          detail: Uses Hims price-to-sales as the premium public digital-health anchor.
        - label: $1.62B at Hims EV/Sales 2.85x
          value: 568
          detail: Uses Hims EV-to-sales as the premium benchmark.
        - label: ~$2.0B at GoodRx P/S 1.27x
          value: 1575
          detail: Shows how demanding the higher reported Blink mark becomes.
        - label: ~$2.0B at GoodRx EV/Sales 1.66x
          value: 1205
          detail: Still requires more than $1.2B of annual revenue support.
        - label: ~$2.0B at Hims P/S 2.69x
          value: 744
          detail: Premium multiple still needs very substantial revenue support.
        - label: ~$2.0B at Hims EV/Sales 2.85x
          value: 702
          detail: Even the friendlier EV/sales lens remains demanding.
    approximationNotes: Values are simple valuation-divided-by-multiple calculations and are explicitly not reported Blink revenue.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Bear, base, and bull equity-value ranges for Blink versus the conflicting public valuation references, all in USD
      millions.
    data:
      items:
        - label: Bear case equity value
          low: 300
          mid: 600
          high: 900
          unit: USDm
          detail: Low-multiple intermediary outcome if revenue support is weak or policy pressure rises.
        - label: Base case equity value
          low: 1100
          mid: 1500
          high: 1900
          unit: USDm
          detail: Blended multiple outcome if Blink validates moderate scale but not premium economics.
        - label: Bull case equity value
          low: 2200
          mid: 2600
          high: 3200
          unit: USDm
          detail: Premium outcome if Blink proves Hims-like scale support and clean structure.
        - label: Public valuation references
          low: 1620
          mid: 1810
          high: 2000
          unit: USDm
          detail: Forge and Bloomberg-reported Yahoo anchors bracket current public price discovery.
    approximationNotes: Ranges are underwriting outputs that help frame entry discipline and are not management guidance.
    claimRefs:
      - CV004
      - CV005
      - CV038
      - CV040
      - CV043
      - CV044
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across market need, product proof, competition, economics visibility, risk, valuation, and
      evidence quality.
    data:
      items:
        - label: Market need
          value: 8
          detail: Drug spending growth and affordability pain remain very real.
        - label: Product utility
          value: 6
          detail: Customer and app signals are positive but not audited operating metrics.
        - label: Competitive moat
          value: 4
          detail: Amazon and Cost Plus keep transparent-pricing moats hard to defend.
        - label: Economics visibility
          value: 2
          detail: Revenue, margin, retention, and take-rate data are still private.
        - label: Regulatory / channel risk
          value: 3
          detail: PBM reform and partner economics can move valuation quickly.
        - label: Valuation discipline
          value: 3
          detail: Current public marks look stretched against public comps.
        - label: Evidence quality
          value: 4
          detail: Broad external source set exists, but the key denominator is still missing.
    approximationNotes: Scores are qualitative IC scores from 0-10 based on cited public evidence only.
    claimRefs:
      - CV017
      - CV018
      - CV037
      - CV043
      - CV044
      - CV045
      - CV048
