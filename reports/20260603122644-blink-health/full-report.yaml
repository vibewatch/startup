              BlinkRx’s manufacturer surface claims impact for 55+ leading brands, while the patient homepage lists 55+
              medications and says 40% more fills are covered by insurance with 50-state free home delivery. Those
              claims are company-authored, so they should be treated as directional rather than audited. Even so, the
