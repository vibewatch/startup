      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Public price is visible; public denominator is not
            body: >-
              Blink is not a broken story, but it is still an opaque one. The current evidence set supports staying
              engaged and asking for a data room, not underwriting the public marks as an obvious bargain.
            calloutType: recommendation
