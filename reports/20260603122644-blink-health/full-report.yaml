  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Key upstream and downstream dependencies visible in Blink’s public workflow, without assuming undisclosed internal
      architecture.
    data:
      nodes:
        - id: prescribers
          label: Prescribers
          description: Doctors initiate delivery and BlinkRx flows through e-Rx and renewal requests
        - id: patients
          label: Patients
          description: Choose product surface, grant limited authorization, pay, and receive pickup or delivery
        - id: blink-core
          label: Blink orchestration layer
          description: Blink workflow, payment capture, Blink Card logic, refill rules, and support routing
        - id: pharmacies
          label: Participating / licensed pharmacies
          description: Retail pickup network and licensed U.S.-based dispensing pharmacies
        - id: manufacturers
          label: Life-sciences manufacturers
          description: BlinkRx manufacturer programs and cloud-pharmacy positioning for branded therapies
        - id: support
          label: Support operations
          description: Phone, email, FAQ, and pharmacist escalation for transfers, refills, and issue handling
        - id: market-structure
          label: PBM / network market structure
          description: External pharmacy and PBM dynamics that can affect routing, reimbursement, and partner health
      edges:
        - from: prescribers
          to: blink-core
          label: e-Rx, renewal, transfer, prior-auth communications
        - from: patients
          to: blink-core
          label: account, payment, limited authorization, support requests
        - from: manufacturers
          to: blink-core
          label: BlinkRx branded-therapy programs
        - from: blink-core
          to: pharmacies
          label: pickup routing, fulfillment, delivery orchestration
        - from: blink-core
          to: support
          label: issue resolution, contact routing, refill help
        - from: market-structure
          to: pharmacies
          label: PBM concentration and independent-pharmacy pressure
        - from: support
          to: patients
          label: status updates, pharmacist assistance, problem resolution
