      - number: '7.5'
        title: Residual exposure is monitorable, but the diligence bar is high
        blocks:
          - type: paragraph
            body: >-
              Blink's mitigation maturity is uneven. Legal documents, app-store disclosures, support infrastructure, and
              national network claims show a business that is trying to institutionalize controls, yet the
              highest-consequence risks remain only partially de-risked in public. The thesis survives if Blink can show
              disciplined data governance, stable reimbursement relationships, acceptable complaint and fill-error
              rates, and enough capital to keep investing through regulatory change. The thesis breaks if privacy
              controls fail, if PBM reforms structurally compress economics without offsetting volume gains, if pharmacy
              closures or chain repricing shrink coverage quality, or if service friction overwhelms the savings
              narrative. The most important diligence asks are therefore operational and contractual rather than purely
              strategic: vendor map, ad-tech inventory, BAAs, pharmacy and manufacturer concentration, complaint/refund
              metrics, fulfillment SLAs, and a margin/runway bridge after the Series D. Without that package, Blink
              looks investable only as a monitored high-variance execution story rather than a de-risked category
              winner.
