      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Several tailwinds support Blink's market. Drug spending remains elevated, patient out-of-pocket burdens
              are still high, and pharmacy closures make delivery and digital support more attractive. Amazon's own
              expansion case explicitly cites closures, staffing shortages, and transportation barriers, which supports
              the idea that access frictions can create demand for a digital intermediary. At the same time, the
              category is getting more competitive and more politicized. Amazon is pushing same-day delivery and a $5
              generic subscription; Cost Plus Drugs is normalizing transparent cash-pay pricing; and GoodRx is
              repositioning around self-pay and manufacturer-direct access. PBM concentration remains the largest
              structural constraint because it shapes reimbursement, steering, and pharmacy economics even for companies
              that market directly to patients. Reform pressure is also real: nationwide state legislation, delinking
              efforts, NADAC-based reimbursement floors, spread-pricing bans, and IRA-related pricing changes all point
              to a more contested economic model over the next several years. Finally, Blink's own product evidence
              preserves friction. Cash Express was not accepting new patients on the run date, BlinkRx is only for
              select medications, and review sources show meaningful variation in service quality and savings.
