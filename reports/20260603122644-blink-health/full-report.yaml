      - number: '4.2'
        title: GTM motion and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Blink's public record implies two very different acquisition engines. On the manufacturer side, BlinkRx
              likely depends on enterprise selling into life-sciences companies that need affordability,
              patient-support, and prescription-lifecycle design. On the consumer side, Blink still has to attract end
              users and convert prescriptions into paid fills or deliveries. GoodRx is the best public comparator for
              that latter motion, and its filings are a cautionary benchmark: even at nearly $797 million of revenue,
              sales and marketing remained about 41.6% of revenue in 2025, while prescription-transactions revenue still
              fell when pharmacy closures and program volume softened. GoodRx also shows that manufacturer-facing
              prescription services can become meaningful, with pharma-direct revenue up 41% in 2025. For Blink, that
              suggests upside if BlinkRx is scaling, but it does not solve the CAC question on consumer generic flows.
              Public review sources also imply real service-delivery cost: customers talk about order tracking, support
              interactions, specialty-pharmacy handoffs, and perceived savings, which means Blink is almost certainly
              carrying operational overhead beyond pure software or simple lead generation. Amazon's own order-status
              materials show how much operational surface area online pharmacy can require, including transfer tracking,
              pharmacist review, ID checks, and package updates.
