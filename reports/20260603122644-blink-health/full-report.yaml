  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and where Blink actually plays
        blocks:
          - type: paragraph
            body: >-
              Blink is not just one more online pharmacy and it is not a PBM. The public product surface shows three
              adjacent workflows: Quick Save for local cash-pay pickup, Blink Cash Express for cash-pay delivery, and
              BlinkRx for manufacturer-sponsored or provider-routed prescription fulfillment. That means the relevant
              market boundary starts with outpatient retail prescription access, pricing, and fulfillment rather than
              all healthcare spend or all pharmaceutical economics. Included spend is the portion of retail prescription
              activity where patients are price sensitive, where pharmacies can dispense through a digital routing
              layer, or where manufacturers need a patient-access partner to reduce abandonment and accelerate therapy
              starts. Excluded spend includes insurer underwriting, broad formulary management, and
              provider-administered drug categories where Blink does not appear to control the care path. Status-quo
              substitutes remain coupon cards, standard retail pickup, mail order, and other digital pharmacy or
              self-pay pricing platforms. For diligence, the key point is that Blink's monetizable wedge is real but
              narrower than headline national drug-spend figures suggest.
