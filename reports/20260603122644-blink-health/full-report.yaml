      - number: '3.3'
        title: Distribution power and switching costs favor Amazon and PBM-owned incumbents more than Blink
        blocks:
          - type: paragraph
            body: >-
              The hardest competitive evidence is not about list prices; it is about channel control. FTC findings show
              the top three PBMs processed nearly 80% of U.S. prescriptions in 2023 and may steer patients toward
              affiliated pharmacies, while the second FTC report described billions of dollars of excess revenue and
              spread pricing in specialty generics. CVS Caremark and Express Scripts then show the practical
              customer-facing version of that power: integrated plan management, network pharmacy search, 90-day mail
              service, auto-refills, included shipping, and pharmacist access that ride on existing employer or
              health-plan relationships. Amazon’s challenge is similar in effect but different in mechanism: it combines
              a Prime subscription, nationwide fulfillment, same-day delivery expansion, kiosks, and digital medication
              management to make pharmacy convenience a logistics bundle. Blink’s 35,000-plus pickup partners are
              meaningful, but GoodRx’s 70,000-plus footprint and the embedded steering power of PBM-owned options imply
              that Blink’s network scale is not the same thing as distribution control. The likely switching-cost
              reality is therefore mixed. Blink can win opportunistic cash-pay fills and branded patient-support
              journeys, but PBM-owned and Amazon-owned workflows can become sticky when they are already woven into
              benefits, auto-refill habits, or household subscriptions. That is the most durable competitive
              disadvantage visible in the public record.
            claimRefs:
