              partnership around neffy. ARS’ own 2024 release confirms BlinkRx was already accepting neffy
              prescriptions, helping with prior authorization, and shipping the product free of charge once available. 
              Expansion evidence also points to a widening buyer set on the manufacturer side. Fierce Pharma reported in
              August 2025 that several pharmas already use BlinkRx’s online pharmacy services, named Bayer and Hikma as
              existing partners, and described Operation Access Now as a launch product that lets drugmakers stand up
              direct-to-patient or direct-to-business channels within 21 days. This is a meaningful land-and-expand
              signal because it implies Blink can move from filling individual branded prescriptions to becoming launch
              infrastructure for pharma brands. The limitation is equally important: aside from ARS/neffy, most named
