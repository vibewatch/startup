        - id: blink
          label: Blink verifies script, price, and assistance options
        - id: payer
          label: Insurer / manufacturer assistance determines out-of-pocket cost
        - id: pharmacy
          label: Network pharmacy dispenses for pickup or shipment
        - id: patient
          label: Patient receives medication, support, and refill prompts
