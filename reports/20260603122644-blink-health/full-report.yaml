              corroborate that 1789 Capital led a $140 million financing and that the round was large enough to bring a
              board seat. Bloomberg's roughly $2 billion valuation signal suggests growth-stage expectations, but that
              valuation is not company-confirmed and should not substitute for cash or margin evidence. Public comps
              already span a wide range: CompaniesMarketCap lists GoodRx at about $0.99 billion and Hims & Hers at about
              $6.36 billion as of June 2026, so Blink's reported valuation sits in the middle of the band without enough
              disclosure to say whether that midpoint is conservative or aggressive. Public sources do not disclose
              current cash, monthly burn, debt, or working-capital needs, so Blink's runway cannot be computed directly.
