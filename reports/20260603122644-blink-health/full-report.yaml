  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Blink spans more than a coupon card, but the landscape is fragmented by job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Blink’s own product surfaces show a company trying to cover three prescription journeys rather than one.
              The consumer-facing side includes Quick Save for generic cash-pay prescriptions, local-pharmacy pickup
              across a large partner network, and Blink Cash Express for mail-order cash-pay medications. The
              manufacturer-facing side, BlinkRx, targets branded therapies with support, delivery, and affordability
              workflows. That breadth matters for competitive framing because Blink does not just face another discount
              card. GoodRx is the closest direct consumer comparison-shopping peer, Amazon Pharmacy is the strongest
              logistics-led substitute for generic maintenance meds, Mark Cuban Cost Plus Drugs is the clearest
              price-transparency disruptor, and PBM-owned mail-order options from CVS Caremark and Express Scripts
              remain the strongest status-quo alternatives for insured patients whose benefit design already nudges them
              into affiliated channels. Public evidence therefore supports a segmented landscape: direct peers in coupon
              and cash-pay savings, incumbents in benefit-owned dispensing, substitutes in mail-order price disruptors,
              and adjacent branded-access workflows where BlinkRx has fewer like-for-like peers. The key investment
              implication is that Blink’s competitive position should be judged separately for generic cash-pay,
              home-delivery convenience, and branded manufacturer access rather than as one undifferentiated online
              pharmacy market.
