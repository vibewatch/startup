  topStrengths:
    - >-
      Blink has real surface-area and distribution breadth, with public evidence for 35,000+ participating pharmacies,
      16,000+ additional independents, 50-state BlinkRx delivery, and 55+ medications / 55+ leading brands.
    - >-
      The model is broader than a single coupon app: retained chapter evidence supports manufacturer-program services,
      consumer discount transactions, and direct cash-pay fulfillment as distinct monetization surfaces.
    - >-
      A fresh $140 million Series D led by 1789 Capital shows Blink can still attract meaningful capital while expanding
      branded-medication access programs.
  topRisks:
    - >-
      Public disclosure is too thin for late-stage underwriting: current revenue, gross margin, retention, CAC or
      payback, runway, and even total funding and valuation are not cleanly disclosed.
    - >-
      PBM reform, pharmacy reimbursement changes, and pharmacy-closure pressure can directly compress Blink's network
      economics and local coverage quality.
    - >-
      Blink handles sensitive health data as a HIPAA covered entity and patient agent, creating meaningful privacy and
      control risk if vendor-sharing or marketing controls are weaker than policy disclosures imply.
    - >-
      Operational trust is mixed: Cash Express is closed to new patients, the service model appears labor-intensive, and
      reviews still flag shipping, tracking, pricing, and specialty-pharmacy friction.
  unresolvedGaps:
    - >-
      Audited 2024-2026 revenue, gross margin, contribution profit, and channel mix by BlinkRx, Quick Save, and Cash
      Express.
    - Cash balance, burn, runway, and realized take-rate or reimbursement-spread economics after the Series D.
    - >-
      Current active patient counts, order volume, refill retention, and manufacturer or pharmacy concentration by
      product line.
    - >-
      Board-approved cap table, liquidation waterfall, and primary financing documents reconciling total funding and
      valuation.
    - Current vendor or ad-tech inventory, BAAs, and incident or accessibility-resolution history.
