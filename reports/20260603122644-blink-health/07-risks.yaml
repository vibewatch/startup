chapter:
  number: 7
  title: Risks
  summary: Blink Health's highest risks are regulatory and legal exposure around prescription-data handling and PBM reform, followed by operational fragility in a pharmacy-dependent fulfillment model and execution risk in a labor-intensive specialty-access workflow. Public mitigations exist, but most are policy disclosures and hiring plans rather than externally verified controls, leaving high residual exposure until diligence closes privacy, partner-concentration, and unit-economics gaps.
sections:
- id: regulatory-legal-risk
  title: Regulatory and legal risk is the top-ranked exposure
  body: Blink's most severe risk is that a prescription-access model built around sensitive health data, dynamic pricing, and third-party pharmacy coordination is moving into a stricter legal and regulatory zone. The FTC's PBM work shows how concentrated middlemen can steer patients, reshape reimbursement, and squeeze unaffiliated pharmacies, while state and federal reforms are now targeting rebate economics, spread pricing, anti-steering, and ownership structures. The inquiry has also moved beyond abstract study, with the FTC's 2023 expansion saying it was probing clawbacks, opaque reimbursement, and steering toward PBM-owned pharmacies, and the FTC's June 2026 PBM matter page showing a pending insulin-rebate case plus a settlement with Express Scripts. Blink may market itself as patient-first and PBM-light, but its discount and access products still touch the same reimbursement plumbing and pharmacy contracts. At the same time, Blink's own terms and HIPAA notice confirm that it can act as a patient's agent to obtain PHI, coordinate with pharmacies and payors, and create de-identified aggregate data for business activities. GoodRx's HBNR enforcement shows how quickly a prescription platform can be penalized if privacy promises, marketing practices, or vendor controls drift out of
    alignment. Mitigations exist—policies, arbitration, HIPAA notice, and disclosed privacy rights—but they are mostly paper controls. Residual exposure stays high until diligence confirms data-flow governance, ad-tech controls, BAA coverage, state-by-state reimbursement exposure, and the resolution history of the ADA accessibility complaint and other disputes.
