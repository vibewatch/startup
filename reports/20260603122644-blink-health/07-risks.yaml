- id: people-execution-governance-risk
  title: Execution quality still depends on hiring, retention, and governance discipline
  body: Execution risk is material because Blink is still scaling a complicated hybrid of pharmacy operations, claims processing, product, engineering, and security. The careers page shows open roles across prior authorization, claims, pharmacy operations, engineering, and governance-risk/compliance security functions. That breadth is encouraging in one sense—it signals continued investment—but it also implies the operating model has not reached a low-touch steady state. Multi-city operations add coordination cost, and Blink's promise to providers and patients depends on consistent staffing quality across support, pharmacy ops, product, and security. Governance has become more visible after 1789 Capital led the 2025 Series D and Donald Trump Jr. joined the board. That may help fundraising and policy access, but it also increases brand polarization and counterparty sensitivity with employers, payors, providers, and manufacturers that prefer lower-profile vendors. Blink is better capitalized
    than before, yet the absence of public unit-economics detail means management execution quality still has to be inferred from hiring demand, service claims, and the company's ability to absorb regulatory change without operational slippage.
