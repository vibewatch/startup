- id: operational-trust-risk
  title: Operational and trust risk flows through every fill and support interaction
  body: 'Operationally, Blink is not a thin software wrapper. BlinkRx promises guaranteed inventory, smart prior-authorization support, real human assistance, and free delivery, while Quick Save depends on participating pharmacies and Cash Express is currently closed to new patients. The terms disclose transfer delays, carrier-related delivery extensions, real-time price changes, and a no-refund rule after dispensing. Those features matter because medication access is a high-stakes category: patients who prepay or authorize charges react sharply when prices change, a transfer stalls, or a delivery fails. Public sentiment is therefore mixed rather than cleanly positive. Trustpilot and the App Store show strong average ratings, but adverse reviews still cluster around specialty-pharmacy friction, pricing disappointment, product problems, and misdelivery. Blink clearly has mitigation machinery—support hours, patient outreach, pharmacy operations staffing, and automated refill tooling—but the
    public evidence suggests those controls are still labor-intensive rather than fully self-healing. Residual exposure is medium-high because pharmacy, shipping, and staffing bottlenecks can compound into complaint spikes or churn faster than a normal e-commerce business.'
