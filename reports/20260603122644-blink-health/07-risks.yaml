  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: privacy-controls
    missingEvidence: Current vendor inventory, ad-tech / pixel map, BAAs, security certifications, and any incident register covering Blink, BlinkRx, and affiliated pharmacies.
    whyItMatters: The highest-ranked risk is privacy and health-data handling. Without technical-control evidence, policy disclosures do not prove compliance or reduce GoodRx-style enforcement exposure.
    diligencePath: Request a current data-flow diagram, subprocessor list, privacy program memo, BAA roster, and the most recent external security assessment.
    relatedQuestionRefs:
    - QR003
    - QR005
    - QR018
    - QR031
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: material
    topic: pharmacy-network-concentration
    missingEvidence: Current mix of fills and GMV by major chain, independent pharmacy, geography, and delivery versus pickup channel.
    whyItMatters: Network breadth is publicly marketed, but concentration drives bargaining power, closure sensitivity, and local service risk.
    diligencePath: Request partner concentration by chain and region, ZIP-level coverage maps, and the top-10 pharmacy counterparties by volume.
    relatedQuestionRefs:
    - QR007
    - QR015
    - QR032
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-runway
    missingEvidence: Current take rate, pharmacy reimbursement spread, gross margin by product, operating burn, and post-Series-D runway assumptions.
    whyItMatters: Financial/model risk cannot be underwritten from the public record without a margin and runway bridge.
    diligencePath: Obtain a board-style bridge from gross revenue to contribution margin and a downside case under reimbursement compression.
    relatedQuestionRefs:
    - QR023
    - QR030
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: cash-express-pause
    missingEvidence: Management explanation for why Blink Cash Express is closed to new patients, what metrics triggered the pause, and when or whether it reopens.
    whyItMatters: A new-patient pause can indicate capacity, compliance, inventory, or economics problems in a core product surface.
    diligencePath: Request the pause decision memo, product KPI trend, and restart or sunset criteria.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: litigation-outcomes
    missingEvidence: Current status or settlement terms for the ADA accessibility matter and any other current or threatened disputes not visible in public dockets.
    whyItMatters: The risk register is severity-ranked, but public litigation visibility is incomplete and could understate injunction or remediation burden.
    diligencePath: Obtain outside counsel summary of open, settled, and threatened claims plus website accessibility audit history.
    relatedQuestionRefs:
    - QR021
    - QR022
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register-coverage
    missingEvidence: State licensing actions, AG inquiries, and non-public compliance correspondence that would complete the legal/register population.
    whyItMatters: The public register is necessarily partial, so investors could miss a material jurisdiction-specific issue without direct diligence.
    diligencePath: Request a litigation / regulatory schedule from counsel and compare it to the public register used in this chapter.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
