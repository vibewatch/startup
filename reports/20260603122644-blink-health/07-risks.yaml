- id: partner-financial-model-risk
  title: Partner dependence and model economics are tightly coupled
  body: Blink's model is deeply dependent on counterparties it does not control. Local pickup runs through 35,000+ participating pharmacies, branded access depends on manufacturer partnerships, insurance coverage decisions influence BlinkRx conversion, and home delivery ultimately relies on licensed pharmacies plus shipment carriers. That structure is workable when the network is broad and rules are stable; it becomes hazardous when reimbursement rules, FTC PBM enforcement, anti-steering laws, or closure trends force counterparties to reprice or exit. The pharmacy-closure evidence matters because Blink loses optionality when independents disappear and chains consolidate negotiating power. Financial risk follows directly from that partner stack. Blink raised a large Series D, but private-company disclosure still leaves investors without public visibility on take rates, pharmacy reimbursement spread, gross margin by channel, or post-round runway. The model can succeed if volume growth offsets repricing and service
    cost, but public evidence is not yet enough to prove that outcome. Residual exposure is high because contract resets, closure-driven geography gaps, or manufacturer concentration could all squeeze margin before the next financing or liquidity event.
