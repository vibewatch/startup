tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Blink
  rows:
  - - Consumer cash-pay local pickup
    - Retail outpatient prescriptions where a patient prepays Blink price and picks up at an in-network pharmacy
    - Insured claims adjudication, PBM formulary management, provider-administered drugs
    - Patient is buyer and payer; pharmacist dispenses
    - Core Quick Save wedge for generic and routine retail fills
  - - Consumer mail or home delivery
    - Outpatient prescriptions routed to Blink for home delivery or phone/online payment workflows
    - Hospital-administered therapies, inpatient pharmacy, broad telehealth fee revenue
    - Usually patient payer with Blink support and pharmacy fulfillment
    - Covers Blink Cash Express and BlinkRx consumer convenience promise
  - - Manufacturer-sponsored patient access
    - Branded-medication access programs, patient support, refill orchestration, and fulfillment tied to therapy start or persistence
    - Pure PBM services, insurer underwriting, broad hub services without pharmacy fulfillment
    - Manufacturer budget plus patient share depending drug and program
    - Higher-value BlinkRx workflow that is less commodity than coupon savings
  - - Digital price-transparency and direct-pharmacy ecosystem
    - Discount cards, direct shipping, cash-pay subscriptions, and routed fills across online pharmacies
    - General healthcare spending not tied to prescription access
    - Patient, manufacturer, or employer depending model
    - Defines the competitive set with GoodRx, Amazon Pharmacy, and Cost Plus Drugs
  - - Excluded market layers
    - Provider-administered specialty drugs, pure insurance risk, hospital pharmacy operations, and non-prescription care delivery
    - n/a
    - Mostly insurer, PBM, provider, or health-system budgets
    - Important boundary so Blink is not valued against all drug or all healthcare spend
  notes: Blink sits across consumer savings, fulfillment, and manufacturer-sponsored access, so the right market boundary is outpatient prescription access rather than total healthcare or total pharmaceutical spend.
