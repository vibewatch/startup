- id: contradictions-reform-pressure-and-preserved-gaps
  title: Contradictions, reform pressure, and preserved diligence gaps
  body: 'The market conclusion should stay intentionally constrained. Blink benefits from a large and still-expanding prescription ecosystem, but the most relevant contradiction is not whether the market is big; it is which accounting lens actually matters to Blink. Gross spend, net spend, retail spend, and patient out-of-pocket spend all produce different ceilings. Reform pressure adds another layer of uncertainty because changes in PBM compensation, reimbursement floors, and rebate pass-through can improve transparency while also changing the economics of today''s routing and discount models. Competitive signals point the same way: Amazon and Cost Plus validate digital demand, while GoodRx''s pivot shows that self-pay and manufacturer access are strategically important but crowded. What remains missing is the bridge from category logic to Blink-specific capture. Public sources do not provide channel mix, active patient counts, brand-program unit economics, or service-level metrics good
    enough to convert top-down demand into a defendable SOM. Those gaps should be preserved, not papered over, because valuation could swing materially depending on whether Blink is mostly a consumer savings platform, a manufacturer access layer, or a hybrid of both.'
