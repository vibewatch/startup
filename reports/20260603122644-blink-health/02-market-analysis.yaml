  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: blink-sam
    missingEvidence: Channel-level prescription volume, eligible-medication breadth, payer mix, and revenue split across Quick Save, Cash Express, and BlinkRx.
    whyItMatters: Without channel economics, any Blink-specific SAM or SOM model risks anchoring to national drug-spend numbers that Blink cannot realistically capture.
    diligencePath: Request monthly scripts, active patients, repeat rates, eligible-medication counts, and revenue/GMV by channel for 2025-2026.
    relatedQuestionRefs:
    - QM010
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: manufacturer-economics
    missingEvidence: Brand-program economics showing who subsidizes patient price, how Blink gets paid, and which manufacturers drive the majority of branded volume.
    whyItMatters: BlinkRx may be economically closer to a manufacturer access platform than to a commodity discount pharmacy, which changes margin durability and peer selection.
    diligencePath: Obtain top manufacturer contracts, pricing model, program-level volumes, and take-rate data for the ten largest branded relationships.
    relatedQuestionRefs:
    - QM012
    - QM025
    - QM026
  - type: missing-source
    severity: minor
    topic: cash-express-pause
    missingEvidence: Management explanation for why Cash Express was not accepting new patients on the run date and whether the pause is temporary or structural.
    whyItMatters: A paused intake channel could indicate capacity, compliance, or product-scope constraints that reduce Blink's effective consumer SOM.
    diligencePath: Ask management for the start date, reason, restart timing, and current active-patient count for Cash Express.
    relatedQuestionRefs:
    - QM024
    - QM026
  - type: missing-source
    severity: material
    topic: customer-experience-variance
    missingEvidence: Audited service metrics such as on-time delivery, refill completion, complaint rates, NPS, and escalation rates by channel.
    whyItMatters: Customer reviews show both strong satisfaction and meaningful friction, so adoption quality cannot be underwritten from testimonials alone.
    diligencePath: Request internal SLA dashboards and cohort retention data, then compare them against App Store, Trustpilot, and support-ticket trends.
    relatedQuestionRefs:
    - QM027
