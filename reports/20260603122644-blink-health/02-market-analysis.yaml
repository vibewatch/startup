- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Blink
  - Diligence ask
  rows:
  - - High national drug spend and rising patient burden
    - Positive
    - Current
    - Creates stronger consumer demand for lower prices, routing help, and alternative fulfillment
    - Quantify what share of Blink demand comes from uninsured, high-deductible, or cash-pay users
  - - Retail pharmacy closures and access gaps
    - Positive
    - Current
    - Makes home delivery and digital support more relevant, especially in stressed local markets
    - Map Blink density and fill times in pharmacy deserts or closure-heavy counties
  - - PBM concentration and steering power
    - Negative / mixed
    - Current
    - Keeps access and reimbursement economics controlled by a concentrated set of middlemen
    - Document Blink dependencies on major PBMs, reimbursement rules, and pharmacy-network terms
  - - 2026 PBM reform wave and IRA effects
    - Mixed
    - 2026–2028
    - Could improve transparency but also reprice current discount and routing economics
    - Run sensitivity cases against NADAC reimbursement floors, rebate pass-through, and delinking
  - - Amazon speed, RxPass, and logistics scale
    - Negative
    - Current
    - Raises the bar on convenience and subscription-like generic pricing
    - Benchmark Blink delivery speed, eligible-medication breadth, and retention against Amazon
  - - GoodRx self-pay plus pharma-direct pivot
    - Negative / mixed
    - Current
    - Confirms strategic value in direct consumer and manufacturer channels but increases crowding
    - Benchmark manufacturer win rate, consumer acquisition costs, and repeat usage
  - - Cost Plus transparent cash-pay pricing
    - Negative
    - Current
    - Compresses differentiated pricing claims around generics and transparent markups
    - Test Blink prices against transparent-online peers across a fixed basket of drugs
  - - Eligibility, intake, and service frictions
    - Negative
    - Current
    - Select-medication scope, mixed reviews, and a paused Cash Express intake reduce frictionless adoption
    - Request on-time delivery, complaint rates, active patient counts, and reasons for intake pauses
  notes: Blink benefits from the same affordability and convenience tailwinds that help digital pharmacy broadly, but the market is still shaped by concentrated intermediaries, reform risk, and direct competition.
