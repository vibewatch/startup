- id: sizing-lenses-and-why-sam-stays-constrained
  title: Sizing lenses and why SAM stays constrained
  body: Public market sizing supports a large opportunity, but only if the lenses are kept separate. ASHP put U.S. prescription drug spending at $915 billion in 2025 and projected it to top $1 trillion in 2026, while IQVIA measured $606 billion of 2025 medicine spend at net prices and recorded $110 billion of patient out-of-pocket burden. KFF's CMS-based tracker adds another lens by projecting retail prescription drug spending to reach $776 billion by 2033 with 5.1% growth in 2026. These figures all point in the same strategic direction—drug demand remains large, costly, and growing—but they are not interchangeable. Blink does not capture all gross drug spend, nor even all net retail spending. Its closer public ceiling is the patient-exposed outpatient slice where price transparency, routing, and home delivery matter, plus manufacturer-funded access programs for branded drugs. Because Blink does not disclose prescription volume, eligible-medication breadth, payer mix, or revenue split by
    channel, any SAM or SOM estimate would be more narrative than underwriting-grade. The right posture is to preserve multiple lenses and refuse false precision.
