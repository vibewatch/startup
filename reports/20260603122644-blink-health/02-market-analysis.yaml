chapter:
  number: 2
  title: Market Analysis
  summary: 'Blink Health operates in a layered prescription-access market that is much narrower than total U.S. drug spend: consumer cash-pay savings and fulfillment, retail-pharmacy routing, and manufacturer-sponsored patient-access programs. The underlying market is large and still growing under every public lens, but PBM concentration, reform pressure, and aggressive digital-pharmacy competition mean Blink''s practical SAM is the patient-exposed outpatient slice rather than all prescription spending. Public evidence supports demand for lower-cost and more convenient fills, yet a Blink-specific SAM or SOM remains unisolatable without private channel-level volume and economics.'
sections:
- id: market-boundary-and-where-blink-actually-plays
  title: Market boundary and where Blink actually plays
  body: 'Blink is not just one more online pharmacy and it is not a PBM. The public product surface shows three adjacent workflows: Quick Save for local cash-pay pickup, Blink Cash Express for cash-pay delivery, and BlinkRx for manufacturer-sponsored or provider-routed prescription fulfillment. That means the relevant market boundary starts with outpatient retail prescription access, pricing, and fulfillment rather than all healthcare spend or all pharmaceutical economics. Included spend is the portion of retail prescription activity where patients are price sensitive, where pharmacies can dispense through a digital routing layer, or where manufacturers need a patient-access partner to reduce abandonment and accelerate therapy starts. Excluded spend includes insurer underwriting, broad formulary management, and provider-administered drug categories where Blink does not appear to control the care path. Status-quo substitutes remain coupon cards, standard retail pickup, mail order, and other
    digital pharmacy or self-pay pricing platforms. For diligence, the key point is that Blink''s monetizable wedge is real but narrower than headline national drug-spend figures suggest.'
