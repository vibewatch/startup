evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total-and-valuation-conflict
    missingEvidence: >-
      Primary financing documents or management-provided cap-table history tying each round to one cumulative total
      raised and one post-money valuation benchmark.
    whyItMatters: >-
      Later valuation and returns analysis cannot normalize dilution or entry price when retained secondary sources
      disagree between $165M, $315M, and $583.89M of total funding.
    diligencePath: >-
      Request a board-approved financing summary, cap table, or investor update covering every round from founding
      through Series D.
    relatedQuestionRefs:
      - QO013
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-customer-count
    missingEvidence: A current 2026 active or cumulative customer count with a clear metric definition.
    whyItMatters: >-
      Scale and customer-retention analysis cannot be anchored without a current denominator, especially because
      accessible public customer counts stop at 2019 company statements.
    diligencePath: >-
      Request a current KPI deck or operating review showing active patients, cumulative users, prescription volume, and
      the exact definitions management uses.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, margin, and profitability metrics for Blink Health or BlinkRx.
    whyItMatters: >-
      The financials and valuation chapters need a revenue base to compare Blink with public or private comps and to
      assess whether growth is translating into operating leverage.
    diligencePath: >-
      Request 2024-2026 management financials, lender or investor materials, or a board deck with revenue, gross margin,
      burn, and profitability trends.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: board-and-control-rights
    missingEvidence: A complete current board roster plus any observer seats, committees, and investor control rights.
    whyItMatters: >-
      Governance quality, succession resilience, and investor influence cannot be assessed from a single financing press
      release and one secondary profile.
    diligencePath: >-
      Obtain a current board list from corporate secretary materials or a recent investor presentation and reconcile it
      to the cap table.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: cash-express-new-patient-pause
    missingEvidence: >-
      An explanation for when Blink Cash Express stopped accepting new patients, why the pause exists, and whether it is
      temporary.
    whyItMatters: >-
      A paused product changes product-mix and scale assumptions, and it may indicate operational constraints not
      visible in the rest of the marketing surface.
    diligencePath: >-
      Ask product or support operations for the start date, scope, and restart criteria for the Cash Express intake
      pause.
