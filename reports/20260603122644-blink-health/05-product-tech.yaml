company:
  name: Blink Health
chapter:
  number: 5
  title: Product & Technology
  summary: 'Blink’s public product stack is concrete and workflow-heavy: Quick Save handles pay-first generic pickup across a large pharmacy network, BlinkRx runs a manufacturer-linked prescriber-to-payment-to-delivery flow for branded medications, and Cash Express exists as a direct generic-mail surface but is currently closed to new patients. Blink also maintains merchandising and onboarding pages—a popular-medications directory and a free-first-order promotion—that reduce discovery and first-fill friction around the core flow. The company’s differentiation is operational orchestration rather than a disclosed software moat, and the main public diligence gaps are lack of API or uptime transparency, no public third-party security audit, and no dated roadmap beyond live feature pages and policy updates.'
sections:
- id: product-surface-and-user-workflows
  title: Product surface and consumer workflows
  body: 'Blink should be understood as a prescription-orchestration company with three distinct public surfaces rather than as a single discount card. Official home and about pages separate BlinkRx for branded medications, Quick Save for generic cash-pay pickup, and Blink Cash Express for cash-pay retail generics shipped by mail. That split matters because the user jobs differ: Quick Save is a low-friction generic savings tool with no membership fee, BlinkRx is a prescriber-triggered branded-medication journey with pay-by-link and free delivery, and Cash Express is the most direct mail-order generic surface—but it is currently closed to new patients. Blink also operates acquisition-oriented surfaces around that workflow: a popular-medications directory that markets savings across 15,000 prescriptions, and a free-first-order promotion page that makes both pickup and delivery free for listed generics. The concrete workflow evidence is stronger than generic marketing copy. Blink’s support articles explain that first-time users search for a medication and pay online, pickup users receive a Blink Card that the pharmacist processes as the primary payor, and BlinkRx users receive a text message after a prescriber routes the order to BlinkRx U.S.
    Public product pages therefore support a real consumer workflow, not just a lead-generation coupon page.'
