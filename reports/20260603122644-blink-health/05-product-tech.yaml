- id: operating-model-and-service-workflow
  title: Operating model, integrations, and service workflow
  body: 'The reviewed evidence supports a service-heavy operating model, but not a detailed internal software architecture. Blink’s public materials show how prescriptions enter and move through the system: doctors or pharmacies can send orders to Blink Pharmacy U.S. by SureScripts e-Rx, phone, fax, or mailed hard copy, Blink terms appoint the company as a patient agent for PHI retrieval and provider or pharmacy outreach, and BlinkRx pages market prior-authorization alerts, refill support, and guaranteed inventory at purchase. The manufacturers page adds the other side of the market by positioning BlinkRx as cloud pharmacy infrastructure for life-sciences brands, with patient, provider, and manufacturer segmentation rather than a single consumer-only surface. Careers data reinforces that the operating model is not just outsourced call-center glue: Blink is hiring across pharmacy operations, engineering, IT, security, product, and patient services. What the public record does not provide
    is equally important. The reviewed surfaces do not publish a public API, integration spec, uptime SLA, or status page, so the chapter can responsibly describe the prescription-service workflow and dependency map, but not guess at the software stack or hidden architecture.'
