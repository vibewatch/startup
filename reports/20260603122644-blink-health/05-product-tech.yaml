- id: differentiation-limitations-and-roadmap
  title: Differentiation, current limitations, and roadmap gaps
  body: 'Blink’s differentiation is strongest when framed against adjacent models. GoodRx’s filing describes a dynamic price-comparison marketplace with optional subscriptions layered on top, while Amazon is pushing a logistics-and-subscription stack that pairs prescriber e-Rx intake with RxPass, same-day expansion, and PillPack. Blink is different: Quick Save is pay-first cash-pay pickup, BlinkRx is a manufacturer-linked patient access and delivery workflow, and Blink’s e-commerce terms explicitly contemplate Blink as primary payor for purchased medications. That makes the moat more operational than purely algorithmic. At the same time, the market backdrop is hard. FTC and Drug Topics both highlight PBM concentration and pressure on unaffiliated pharmacies, while the NCPA Digest shows independent pharmacies still matter for rural and small-community access. Blink’s clearest public limitation today is internal to the product set: Cash Express is paused for new patients, which narrows the
    company’s direct generic-mail surface versus the scale ambitions publicized by Amazon Pharmacy. More broadly, Blink’s public roadmap is thin. The product surface shows current features and policy updates, but not a dated release calendar, reliability metrics, or external security attestation.'
