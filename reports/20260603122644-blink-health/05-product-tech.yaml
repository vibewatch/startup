  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-reliability-transparency
    missingEvidence: No public API documentation, uptime commitment, or status page for BlinkRx or Quick Save integrations was found.
    whyItMatters: Without public reliability disclosures, it is hard to underwrite the operational resilience of manufacturer, pharmacy, and patient workflows.
    diligencePath: Request private integration docs, status-page history, incident metrics, and any customer-facing uptime commitments.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: public-product-roadmap
    missingEvidence: No dated public roadmap was found for reopening Cash Express to new patients or expanding BlinkRx modules beyond current marketing claims.
    whyItMatters: A paused direct-mail generic surface changes how much of Blink’s value can be attributed to live product breadth versus marketing ambition.
    diligencePath: Ask management for Cash Express intake status, reopening criteria, planned launch dates, and a product roadmap for BlinkRx and Quick Save.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: The reviewed public materials did not show a SOC 2, HITRUST, ISO 27001, or comparable third-party Blink-issued security certification.
    whyItMatters: Blink handles PHI, payment data, and prescription routing, so external assurance matters for operational and reputational risk.
    diligencePath: Request the latest security audit reports, penetration-test summaries, privacy impact assessments, and vendor-risk controls.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
