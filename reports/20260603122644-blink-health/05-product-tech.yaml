    - No public pharmacy-level conversion, repeat usage, or generic coverage breadth disclosed
  - - Blink Cash Express
    - Cash-pay generic home-delivery users
    - Live login surface but currently not accepting new patients
    - Direct mail-order generic surface under Blink brand
