  - - Participating pharmacy network
    - Retail pickup users and independent or chain pharmacy partners
    - 35,000+ participating pharmacies plus 16,000+ independent pharmacies claimed
    - Large national pickup footprint lets Blink sell a local option rather than mail only
    - No public concentration data by chain, state, or dispensing partner
  - - Help center + support operations
    - Patients, pharmacists, providers, and press
    - Live; support FAQ taxonomy and contact routing visible
    - Human support and route-specific help are part of the product experience, not an afterthought
