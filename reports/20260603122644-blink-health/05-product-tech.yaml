- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Blink solution
  - Publicly visible benefit
  - Operational limitation
  rows:
  - - Save on a routine generic and pick it up locally
    - Patient searches medication, pays online, receives Blink Card, and shows it at a participating pharmacy
    - Quick Save + pickup network
    - No membership fee, common-medication discovery and first-order promo pages, and $0 due at the counter after online payment
    - Requires a valid prescription already at the pharmacy; no public SLA for pharmacy training or issue resolution
  - - Move a prescription into Blink for home delivery
    - Doctor or pharmacist sends prescription to Blink Pharmacy U.S. by e-Rx, phone, fax, or mailed hard copy
    - Blink Pharmacy U.S. intake workflow
    - Concrete intake channels and published Chesterfield, MO routing details
    - Transfer delays or USPS holidays can slow fulfillment
  - - Fill a branded or supported therapy with coverage navigation
    - Prescriber sends order to BlinkRx U.S., patient gets text link, reviews lowest price, pays online or by phone, and receives free delivery
    - BlinkRx patient flow
    - BlinkRx markets guaranteed inventory, prior-auth alerts, and free delivery
    - No public evidence on successful prior-auth rates, abandonment, or delivery-time SLA
  - - Use Blink instead of a coupon at the counter
    - Blink wants the pharmacist to process Blink as the primary payor rather than apply a coupon discount
    - Pay-first e-commerce / pickup model
    - More deterministic pricing and proof-of-purchase flow than coupon clipping
    - Cash payments may not count toward insurance deductibles and users must commit before pickup
  - - Get support when a refill, transfer, or delivery goes wrong
    - Patient can call or email Blink or BlinkRx and consult FAQ articles for delivery, pickup, privacy, or Medicare topics
    - Support-heavy operations layer
    - Published support windows and route-specific escalation
    - No public issue-resolution metrics or public system-status page
  notes: Workflow rows use official Blink FAQs, product pages, and terms; the benefit column records what the public surface actually promises, while the limitation column captures what is still undisclosed.
