- id: trust-privacy-support-and-quality
  title: Trust, privacy, support, and delivery controls
  body: 'Blink’s trust surface is visible, but it is weighted toward legal disclosure and human support rather than public external audit artifacts. The HIPAA notice says Blink is a covered entity, lists PHI uses for treatment, payment, operations, and public-health reporting, and gives patients rights to inspect, amend, restrict, and track disclosures. The Terms of Use add operational guardrails: Blink is not insurance, the services are U.S.-only, the site is not for emergencies, and refill or order processing can be delayed by holidays or slow pharmacy transfers. Support is clearly productized—Blink publishes separate support-hour windows for Blink and BlinkRx, route-specific phone and email contacts, and a help center split across home delivery, local pickup, privacy, accessibility, and Medicare topics. App-store and review surfaces add nuance. Apple’s privacy label shows linked financial, location, contact, and usage data, while Trustpilot and Retirement Living describe both strong delivery
    or support experiences and recurring friction around navigation, pricing dissatisfaction, defective vials, and specialty-pharmacy hoops. The main diligence concern is not absence of policy; it is absence of a public SOC 2, HITRUST, or similar third-party assurance document in the reviewed material.'
