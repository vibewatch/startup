- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Key dependency
  - Publicly visible risk
  rows:
  - - Prescription intake routing
    - Accepts orders from prescribers or pharmacists by SureScripts, phone, fax, or mailed originals
    - Doctor, pharmacy, and Blink Pharmacy U.S. coordination
    - No public intake-to-fulfillment SLA or turnaround metric
  - - Limited-authorization / patient-agency layer
    - Allows Blink to obtain PHI, contact providers and pharmacies, request refills, and research copay assistance on behalf of patients
    - Terms acceptance and compliant handling of PHI
    - High operational responsibility with little public technical detail on controls
  - - Pricing and checkout layer
    - Collects online or phone payment before pickup or delivery and makes Blink primary payor for e-commerce purchases
    - Payment processing and pharmacy acceptance of Blink transaction rules
    - Cash purchases may not count toward deductibles; pricing can change when form, dose, or quantity changes
  - - Pharmacy network routing
    - Directs pickup users to participating pharmacies and directs delivery through licensed U.S.-based pharmacy fulfillment
    - Chain and independent pharmacy participation plus transfer responsiveness
    - Network concentration and pharmacy-partner economics are not public
  - - BlinkRx manufacturer workflow
    - Combines manufacturer program setup, patient messaging, support, prior-auth alerts, and delivery orchestration
    - Life-sciences brands, prescribers, pharmacies, and Blink support teams
    - No public API, integration spec, or uptime commitments disclosed
  - - Support and issue-resolution layer
    - Phone, email, FAQ, and pharmacist escalation handle transfers, delivery issues, and medication questions
    - Staffing across pharmacy, patient services, IT, engineering, and security
    - Operational quality is visible through reviews, but queue depth and response-time metrics are not public
  notes: The table intentionally describes Blink’s public service workflow rather than guessing at hidden software internals; reviewed sources support operational steps, legal authority, and dependency surfaces but not a detailed stack diagram.
