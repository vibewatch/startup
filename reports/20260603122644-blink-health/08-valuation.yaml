company:
  name: Blink Health
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports a research-more recommendation for Blink Health: the company closed a meaningful $140 million Series D, but public valuation references conflict between roughly $2.0 billion and $1.62 billion while revenue, margin, retention, and cap-table terms remain undisclosed. GoodRx and Hims public multiples imply Blink would need hundreds of millions to more than $1 billion of annual revenue support to justify those marks, leaving the current entry point stretched until private diligence proves otherwise.'
sections:
- id: SV001
  title: Financing context and valuation anchor
  body: 'Blink enters the valuation chapter with a real financing signal but an incomplete denominator. Public sources agree that 1789 Capital led a $140 million Series D round in 2025 and that the board added Donald Trump Jr. after the financing. What they do not agree on is the valuation anchor: a Bloomberg-reported Yahoo item points to roughly $2.0 billion, while Forge lists a $1.62 billion Series D valuation and mentions a confidential S-1. That spread matters because Blink has not publicly disclosed revenue, gross margin, retention, or cap-table terms. The result is a classic private-market problem: investors can see a price tag, but they cannot yet see the operating facts required to decide whether that tag is cheap, fair, or expensive. Product descriptions and app-store evidence confirm Blink is trying to reduce prescription costs and friction, but those facts alone are not enough to justify the current private mark.'
