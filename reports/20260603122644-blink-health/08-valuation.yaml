- id: SV003
  title: Scenario underwriting and valuation sensitivity
  body: Because Blink revenue is undisclosed, the right way to underwrite the company is not to pretend we know its current top line; it is to ask what revenue support would be necessary for the observed private marks to make sense. That exercise is sobering. At GoodRx-like public multiples, Blink would need roughly $1.0 billion to $1.6 billion of annual revenue support to justify the current marks. Even at Hims-like multiples, the required revenue support still lands around $568 million to $744 million, and Hims itself is only marginally profitable. That is why the bull, base, and bear cases here are threshold cases rather than reported-actual cases. If Blink proves revenue and unit economics closer to the Hims end of the spectrum, current pricing can move toward fair. If it looks more marketplace-like or channel-intermediated without premium margins, the downside is material. Public evidence today therefore supports downside protection first and upside optionality second.
