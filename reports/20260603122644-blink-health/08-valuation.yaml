  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-denominator
    missingEvidence: Audited net revenue, gross margin, contribution profit, and channel mix for 2024-2026.
    whyItMatters: Public valuation marks cannot be translated into an investment return view without the operating denominator.
    diligencePath: Request CFO data room, audited statements, and monthly revenue bridge by consumer, pharmacy, and manufacturer channel.
    relatedQuestionRefs:
    - QV004
    - QV024
    - QV028
  - type: conflicting-data
    severity: material
    topic: valuation-opacity
    missingEvidence: Official company confirmation of latest post-money valuation, share class economics, and any secondary clearing price.
    whyItMatters: Bloomberg-reported and Forge marks conflict enough to change implied revenue thresholds materially.
    diligencePath: Ask management and lead investors for round documents, board-approved financing memo, and any secondary or tender data.
    relatedQuestionRefs:
    - QV002
    - QV003
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full cap table, liquidation waterfall, anti-dilution provisions, and any participation rights.
    whyItMatters: Preference overhang can make a superficially acceptable enterprise value unattractive for later investors or common-equity outcomes.
    diligencePath: Obtain legal cap-table model and waterfall analysis from finance and counsel.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Official filing status, audit cadence, banker selection, and board-approved exit timetable.
    whyItMatters: A confidential-S-1 reference without official confirmation is too weak to underwrite exit timing.
    diligencePath: Confirm with management, counsel, and any hired bank before using IPO timing in return math.
