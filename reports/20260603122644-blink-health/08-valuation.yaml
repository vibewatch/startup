- id: TV003
  title: Bull / base / bear scenario table
  description: Illustrative underwriting cases for Blink using public-comp multiples and explicit evidence gaps; none of the revenue-support thresholds below are presented as reported Blink revenue.
  columns:
  - Scenario
  - Illustrative underwriting assumptions
  - Implied valuation range
  - Return vs $1.62B / ~$2.0B marks
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Data room validates revenue support above roughly $800M, stable gross margin, durable network contracts, and cleaner IPO readiness; market accepts Hims-like or slightly higher multiple support.
    - $2.2B-$3.2B
    - About +10% to +98% versus public marks
    - Needs audited scale, high-quality retention, and limited preference overhang.
    - Low probability until Blink proves the denominator, not just the story.
  - - Base
    - Revenue support validates in roughly the $550M-$750M range, unit economics are good but not best-in-class, and investors apply a blended digital-health multiple.
    - $1.1B-$1.9B
    - About -45% to +17% versus public marks
    - Even modest multiple compression or hidden preference terms can erase upside.
    - Most consistent with today’s mixed public evidence, but still needs private confirmation.
  - - Bear
    - Revenue support is below roughly $500M, PBM or reimbursement reform compresses take rates, or network and service issues increase churn; valuation resets toward lower-multiple intermediary comps.
    - $0.3B-$0.9B
    - About -55% to -85% versus public marks
    - A lower denominator and policy shock reinforce each other quickly.
    - Plausible because public evidence today does not rule this case out.
  notes: Ranges are threshold cases built from GoodRx and Hims public multiples plus scenario assumptions; they are not reported Blink revenue or management guidance.
