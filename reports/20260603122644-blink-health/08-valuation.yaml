tables:
- id: TV001
  title: Recommendation summary table
  description: Top-line investment call, confidence, risk, and valuation posture for Blink based only on public evidence as of 2026-06-03.
  columns:
  - Dimension
  - Assessment
  - Basis
  - What changes the view
  rows:
  - - Recommendation
    - research-more
    - Public financing and product evidence exist, but Blink has not disclosed the revenue and margin denominator needed to support the price.
    - Move to track if audited revenue, margin, and retention data are provided and clear the public-comp thresholds.
  - - Confidence
    - medium
    - The financing, regulatory, and comp evidence set is broad, but the core operating metrics remain private.
    - Increase with audited financial statements and confirmed cap-table terms.
  - - Risk rating
    - high
    - PBM reform, reimbursement pressure, legal or complaint history, and channel dependence can all transmit directly into valuation.
    - Lower only if Blink shows resilient take rates, network contracts, and clean compliance controls.
  - - Valuation stance
    - stretched
    - Public marks of $1.62B to roughly $2.0B require hundreds of millions to more than $1B of annual revenue support depending on the comp set.
    - Fair if validated revenue and unit economics support Hims-like multiples rather than GoodRx-like ones.
  - - Entry discipline
    - no new money at public marks without data room
    - The market shows price discovery, but not operating discovery.
    - Engage only at a sharper discount or after full revenue and preference-stack diligence.
  - - Decision implication
    - keep warm, do diligence, avoid forced urgency
    - Blink is interesting enough to track, but not transparent enough to underwrite from public evidence alone.
    - Advance if the company proves both scale and clean structure.
  notes: Public valuation references conflict and Blink revenue is undisclosed; assessments are based on underwriting thresholds derived from public comps, not reported Blink revenue.
