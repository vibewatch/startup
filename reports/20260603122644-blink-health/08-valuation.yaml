- id: TV005
  title: Thesis-break and kill triggers table
  description: Events or thresholds that would materially damage the public-evidence case for Blink at current price levels.
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue support misses
    - Validated annual revenue support below roughly $500M
    - Current public marks would look aggressive even against the lower-multiple public comp set.
    - Do not add at current price; reset underwriting to a lower range.
  - - Margin or take-rate weakness
    - Gross margin or contribution economics materially below marketplace expectations
    - Blink would screen more like a low-multiple intermediary than a premium digital-health platform.
    - Move valuation stance from stretched to expensive and revisit the comp set.
  - - PBM reform shock
    - State or federal changes cut steering economics, rebate economics, or pharmacy participation
    - Core channel economics would compress just as pricing competition intensifies.
    - Pause investment committee process pending reform impact model.
  - - Network disruption
    - Meaningful pharmacy-partner attrition, delivery failures, or customer-service deterioration
    - Retention and refill behavior would weaken, reducing any case for premium multiples.
    - Treat as a thesis-break if it persists across multiple quarters.
  - - Down-round or secondary reset
    - New financing or secondary prints materially below $1.0B
    - Confirms that informed insiders view the current public marks as too high.
    - Reprice using the new mark and review preference effects immediately.
  - - Preference overhang
    - Cap-table review shows heavy liquidation stack or aggressive ratchets
    - Common-equity outcomes can disappoint even if enterprise value grows.
    - Require waterfall modeling before any term sheet or secondary purchase.
  notes: Trigger thresholds are underwriting guardrails based on public comp math and known industry risks, not company-published thresholds.
