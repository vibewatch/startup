- id: TV006
  title: Final diligence asks table
  description: The minimum private evidence package required before Blink can move from research-more toward a positive recommendation.
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited net revenue and gross margin
    - Monthly and annual net revenue, gross profit, and channel mix for 2024-2026
    - All valuation work in this chapter depends on the missing denominator.
    - CFO data room; audited statements and revenue bridge by channel.
  - - Retention and repeat-fill behavior
    - Order frequency, refill rate, cohort retention, and contribution profit by cohort
    - Proves whether app and review signals translate into durable economics.
    - Growth analytics team; cohort deck and board materials.
  - - Pharmacy and manufacturer economics
    - Top partner concentration, take rates, rebate or service-fee structure, and contract durations
    - Determines whether Blink behaves like a marketplace, specialty access platform, or lower-margin intermediary.
    - Commercial leadership; contract summaries under NDA.
  - - Regulatory and compliance posture
    - ADA remediation history, complaint-resolution metrics, privacy controls, and any open investigations
    - Tests whether public legal and complaint signals are isolated or structural.
    - General counsel, compliance, and customer-operations review.
  - - Cap table and liquidation waterfall
    - Series terms, liquidation preferences, participation rights, anti-dilution, and any side letters
    - Preference overhang can erase equity upside even if enterprise value rises.
    - Legal and finance; full waterfall model.
  - - Exit readiness
    - Official S-1 status, banker preparation, audit cadence, and board-approved exit plan
    - Public sources hint at exit ambition but do not verify readiness.
    - CEO/CFO diligence session and counsel confirmation.
  notes: Every item above is a blocker because Blink’s current public evidence set is stronger on price references than on operating proof or capital-structure clarity.
  claimRefs:
  - CV043
  - CV044
  - CV047
  - CV049
