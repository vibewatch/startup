- id: TV004
  title: Comparable valuation table
  description: Public and model-relevant benchmarks used to triangulate Blink’s valuation support and competitive position.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance to Blink
  - Limitation
  rows:
  - - GoodRx
    - LTM revenue about $787.9M; market cap about $0.99B
    - 1.27x P/S; 1.66x EV/Sales
    - Closest public prescription-savings and pharma-monetization marketplace benchmark.
    - GoodRx is public, slower growth, and not a full Blink-style access or delivery workflow.
  - - Hims & Hers
    - LTM revenue about $2.37B; market cap about $6.37B
    - 2.69x P/S; 2.85x EV/Sales
    - Useful upper-end digital-health multiple anchor for a scaled consumer platform.
    - Hims has much larger scale, telehealth integration, and a broader brand than Blink.
  - - Amazon / Amazon Pharmacy
    - Parent market cap about $2.76T; RxPass at $5 per month; same-day delivery to 4,500 cities planned
    - Pharmacy unit not separately valued
    - Best strategic benchmark for logistics, speed, and pricing pressure.
    - Amazon Pharmacy is buried inside a conglomerate, so valuation is not apples-to-apples.
  - - Mark Cuban Cost Plus Drug Company
    - Low-cost manufacturing and shortage-response positioning; public valuation undisclosed
    - Private / valuation undisclosed
    - Relevant for transparent-pricing and low-cost-drug competition.
    - No public revenue, valuation, or detailed economics make it a strategic comp only.
  - - Blink Health public price references
    - Forge lists $1.62B Series D; Bloomberg-reported Yahoo item says roughly $2.0B
    - Conflicting private-market marks
    - Direct anchor for current entry discipline.
    - Neither source is an official Blink disclosure with revenue or cap-table denominator.
  enumerationScope:
    coverage: partial
    basis: Comparable set intentionally mixes public valuation anchors with strategic model benchmarks because no single public company maps cleanly to Blink’s prescription-access model.
  notes: Public-company rows use June 2026 market data; private and strategic rows are included for model fit and pricing context rather than strict peer purity.
