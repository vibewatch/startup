tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - BlinkRx manufacturer programs
        - >-
          Prescription-lifecycle software and services for branded-medication access, onboarding, affordability, and
          fulfillment orchestration
        - Per manufacturer program / contracted service fee (undisclosed)
        - Active and highlighted as Blink's branded-medication offer
        - Potentially higher-quality if contracted, but public contract terms are absent
        - Request active manufacturer roster, fee schedule, renewal structure, and gross margin by program
      - - Blink Quick Save retail generic savings
        - Transaction-linked consumer savings flow at retail pharmacies using discounted cash pricing
        - Per filled prescription or transaction economics (undisclosed)
        - Active; positioned for cash-pay generics at thousands of pharmacies
        - More transactional and likely promotion-sensitive than enterprise revenue
        - Request take rate, reorder rate, pharmacy economics, and realized contribution per fill
      - - Blink Cash Express mail-order generics
        - Cash-pay e-commerce and fulfillment of generic prescriptions with home delivery
        - Per order / per shipped prescription (undisclosed)
        - Active; marketed as everyday low price plus home delivery
        - Direct revenue is clearer, but shipping and support could compress margin
        - Request order-level contribution margin, shipping cost, and repeat-order cadence
      - - Ancillary affordability / support services inside BlinkRx
        - Support, navigation, and affordability workflows embedded in branded programs
        - Likely bundled or add-on service economics (undisclosed)
        - Implied by BlinkRx positioning and customer support surfaces
        - Could improve stickiness, but public revenue recognition is opaque
        - Request revenue-recognition policy, implementation fees, and service-level labor allocation
    notes: Public sources establish the surfaces but not realized pricing, contract terms, or product-line revenue mix.
    enumerationScope:
      coverage: partial
      basis: >-
        Revenue streams are inferred from Blink's official product segmentation plus public customer and funding
        materials reviewed as of 2026-06-03.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI011
      - CI036
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / contract model
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - BlinkRx manufacturer platform
        - Contracted manufacturer service economics; exact fee basis undisclosed
        - Only positioning is public; realized pricing unknown
        - Unknown whether pricing is per patient, per program, per fill, or a hybrid
        - Blink homepage; PR Newswire
      - - Blink Quick Save
        - Discounted cash-pay pricing at retail pharmacies; realized Blink take rate undisclosed
        - Blink markets lower prices, not realized monetization
        - Unknown spread, fee split, or pharmacy rebate share
        - Blink homepage
      - - Blink Cash Express
        - Everyday low cash-pay generic pricing with home delivery
        - Consumer value proposition is public; realized margin is not
        - Unknown whether delivery is cross-subsidized, bundled, or offset elsewhere
        - Blink homepage; App Store
      - - Blink consumer app
        - Users can pay in app and receive qualifying medications at no-cost delivery
        - Public claim is about affordability and convenience, not unit economics
        - Unknown whether app pricing differs by drug, payer status, or route
        - Apple App Store
      - - Competitive benchmark — Amazon RxPass
        - Flat $5 per month for 50+ generic medications with free delivery
        - List price is explicit and public
        - Does not reveal Blink pricing directly, but sets a visible external reference point
        - Amazon customer help; About Amazon
    notes: >-
      Official Blink sources market affordability but do not disclose realized take rate, fee schedule, or per-order
      gross profit.
    enumerationScope:
