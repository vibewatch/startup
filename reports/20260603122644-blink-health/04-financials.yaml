  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Consumer acquisition intensity benchmark
        - GoodRx sales & marketing was about 41.6% of 2025 revenue
        - Medium-high
        - Shows that scaled prescription-savings distribution can still require heavy CAC spend
        - Request Blink paid-media spend, acquisition by channel, and payback curves
      - - Manufacturer-solutions growth proxy
        - GoodRx pharma direct revenue grew 41% in 2025
        - Medium
        - Suggests BlinkRx could be economically attractive if enterprise contracts are scaling
        - Request BlinkRx revenue by partner and cohort expansion metrics
      - - Retail volume sensitivity
        - GoodRx prescription-transactions revenue fell 6% in 2025 as pharmacy closures and program volume weakened
        - Medium
        - Shows that network instability can hit transaction revenue even for scaled public platforms
        - Request Blink order-volume trends by pharmacy type and geography
      - - Consumer price-pressure benchmark
        - Amazon RxPass publicly offers 50+ generics for $5 per month with free delivery
        - High
        - Sets a hard external reference point for cash-pay generic economics
        - Request Blink price ladder versus RxPass, GoodRx, and major mail-order alternatives
      - - PBM / specialty markup risk
        - FTC says Big 3 PBMs generated more than $7.3B from specialty-generic markups above acquisition cost
        - High
        - Signals regulatory and margin pressure around specialty access economics
        - Request Blink exposure to specialty reimbursement, steering rules, and spread economics
      - - Service-delivery cost proxy
        - >-
          Blink promises no-cost delivery and public reviews discuss tracking, support, and specialty-pharmacy handoffs;
          Amazon's order-status materials show scaled online pharmacy also requires transfer tracking, pharmacist review,
          ID checks, and package updates, but Blink cost per order is not public
        - Medium
        - Indicates material operational cost that could erode gross margin
        - Request shipping, support labor, exception handling, and pharmacy coordination cost per script
    notes: >-
      Every numeric proxy here comes from public comparators or category evidence; Blink-specific CAC, margin, and
      payback remain private-evidence-only.
    enumerationScope:
      coverage: partial
      basis: >-
        The table intentionally combines Blink observations with public-comparator and category benchmarks because Blink
        does not publish unit-economics data.
