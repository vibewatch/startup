sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing signals
    body: >-
      Blink's public materials support a three-part revenue story rather than a single discount-card narrative. The
      homepage explicitly splits the business into BlinkRx for branded medications, Blink Quick Save for cash-pay
      generic discounts at retail pharmacies, and Blink Cash Express for direct mail-order generics. That matters
      because each surface implies a different payer, revenue-recognition pattern, and quality profile. BlinkRx looks
      most like a B2B prescription-access workflow sold to manufacturers, where monetization is likely tied to program
      fees, patient onboarding, affordability services, and fulfillment orchestration. Quick Save looks more like
      transaction-linked consumer savings at the point of pickup, while Cash Express looks closer to a cash-pay
      e-commerce pharmacy flow. The missing piece is realized pricing: Blink markets affordability, low prices, and
      no-cost delivery, but public sources do not disclose take rate, spread, per-order gross profit, or whether Blink
      subsidizes delivery or support to win volume. Amazon's $5-per-month RxPass demonstrates how aggressive the outside
      pricing bar has become for cash-pay generics, which likely compresses Blink's room to monetize consumer traffic
      without heavy volume.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI011
      - CI018
      - CI019
      - CI020
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-and-unit-economics-proxies
    title: GTM motion and unit-economics proxies
    body: >-
      Blink's public record implies two very different acquisition engines. On the manufacturer side, BlinkRx likely
      depends on enterprise selling into life-sciences companies that need affordability, patient-support, and
      prescription-lifecycle design. On the consumer side, Blink still has to attract end users and convert
      prescriptions into paid fills or deliveries. GoodRx is the best public comparator for that latter motion, and its
      filings are a cautionary benchmark: even at nearly $797 million of revenue, sales and marketing remained about
      41.6% of revenue in 2025, while prescription-transactions revenue still fell when pharmacy closures and program
      volume softened. GoodRx also shows that manufacturer-facing prescription services can become meaningful, with
      pharma-direct revenue up 41% in 2025. For Blink, that suggests upside if BlinkRx is scaling, but it does not solve
      the CAC question on consumer generic flows. Public review sources also imply real service-delivery cost: customers
      talk about order tracking, support interactions, specialty-pharmacy handoffs, and perceived savings, which means
      Blink is almost certainly carrying operational overhead beyond pure software or simple lead generation. Amazon's
      own order-status materials show how much operational surface area online pharmacy can require, including transfer
      tracking, pharmacist review, ID checks, and package updates.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI030
      - CI037
      - CI038
      - CI039
      - CI042
