  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Current value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Latest disclosed financing
        - 2025 Series D of $140M led by 1789 Capital
        - High
        - Confirms meaningful recent capital formation and board-level investor involvement
        - Request closing date, gross vs net proceeds, and investor rights
      - - Implied valuation
        - ~$2B, but only third-party-reported
        - Medium
        - Useful directional signal, but not robust enough to anchor return assumptions alone
        - Request company-confirmed post-money valuation and cap table
      - - Public-comp valuation band
        - GoodRx ~$0.99B versus Hims & Hers ~$6.36B as of June 2026
        - Medium
        - Shows that relevant public comps span a wide range, so Blink's reported $2B mark is not self-validating
        - Request management's public-comp framework and bridge from comp metrics to Blink's latest round pricing
      - - Cash on hand
        - Not publicly disclosed
        - High that the metric is absent
        - Without current cash, capital adequacy cannot be underwritten directly
        - Request current cash balance and restricted-cash detail
      - - Monthly burn
        - Not publicly disclosed
        - High that the metric is absent
        - Burn rate is the key bridge from financing headline to runway reality
        - Request trailing 12-month monthly burn and budgeted burn by function
      - - Runway
        - Not supportable from public sources
        - High that the metric is absent
        - No direct runway estimate can be defended without cash and burn inputs
        - Request management runway model with downside scenario
      - - Planned use of funds
        - Company says financing supports continued growth, but the specific operating budget is not public
        - Medium
        - Use-of-funds detail determines whether capital is building durable margin or just funding volume
        - Request use-of-funds plan by product line and headcount
      - - Debt / project-finance obligations
        - No public debt or project-finance obligation identified in reviewed sources
        - Medium
        - Hidden leverage or vendor financing could materially change true capital adequacy
        - Request debt schedule, covenants, AP aging, and off-balance-sheet commitments
    notes: >-
      The capital table intentionally avoids invented runway math; it distinguishes verified financing facts from
      missing balance-sheet data.
    enumerationScope:
      coverage: partial
      basis: >-
        Capital adequacy is based on the latest disclosed financing and the documented absence of public cash and burn
        metrics in the reviewed source set.
    claimRefs:
      - CI008
      - CI009
      - CI010
