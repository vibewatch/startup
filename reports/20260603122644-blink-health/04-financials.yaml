chapter:
  number: 4
  title: Financials
  summary: >-
    Blink Health appears to operate a hybrid prescription-access model with three visible surfaces: branded-medication
    workflow software and services through BlinkRx, cash-pay generic discounts through Blink Quick Save, and
    direct-to-consumer mail order through Blink Cash Express. Public evidence shows fresh capital in a $140 million 2025
    Series D and meaningful customer-usage proxies, but Blink does not publicly disclose revenue, margins, CAC, take
    rate, burn, or cash on hand. The underwriting question is therefore less whether Blink has monetizable demand and
    more whether its private unit economics and cash conversion are strong enough to justify a growth-stage valuation
    and avoid another financing dependency.
