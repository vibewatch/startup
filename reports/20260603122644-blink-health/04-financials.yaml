      - FI002
      - FI003
  - id: cost-structure-traction-and-gaps
    title: Cost structure, public traction, and missing metrics
    body: >-
      The strongest public traction indicators for Blink are indirect. BlinkRx holds a 4.3 App Store rating across 134
      ratings, Trustpilot shows Blink Health at 4.2 out of 5 across 1,112 reviews, and Retirement Living says Blink
      serves more than 750,000 people across 35,000 pharmacies. Those are useful evidence that the product is not
      pre-revenue vaporware, but they are not substitutes for underwritable operating KPIs. None of the reviewed Blink
      sources disclose prescriptions filled, active users, reorder frequency, take rate, gross margin, CAC, contribution
      margin, or EBITDA. Meanwhile, the cost structure is unlikely to be light: Blink sells affordability and
      convenience into a regulated prescription flow, so patient support, compliance, pharmacy coordination, shipping,
      and exception handling likely matter to margins. Sector evidence points the same way. The FTC, pharmacy-closure
      reporting, and current PBM reform commentary all describe a market where reimbursement rules, vertical
      integration, and network stress can alter economics quickly. The NCPA's 2026 closure flyer and Legal Clarity's
      50-state PBM overview reinforce that both reimbursement strain and compliance complexity are systemic rather than
      isolated anecdotes. Blink therefore has visible demand and real category tailwinds, but its public traction is
      much richer than its public financial disclosure.
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
