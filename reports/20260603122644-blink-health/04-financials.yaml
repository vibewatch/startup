callouts:
  - calloutType: strength
    title: Blink already shows three monetizable surfaces
    body: >-
      The combination of BlinkRx, Quick Save, and Cash Express means Blink is not dependent on a single
      prescription-savings workflow.
    claimRefs:
      - CI001
      - CI011
      - CI036
  - calloutType: risk
    title: The public record is missing the core underwriting metrics
    body: >-
      Revenue, gross margin, CAC, cash burn, and runway are all absent from the reviewed Blink source set, so financial
      conviction cannot be earned from public evidence alone.
    claimRefs:
      - CI033
      - CI034
      - CI039
  - calloutType: risk
    title: Sector reform can reset economics quickly
    body: >-
      FTC scrutiny, pharmacy closures, and 2026 PBM reform mean Blink operates in a channel where reimbursement and
      distribution rules can change faster than consumer demand narratives.
    claimRefs:
      - CI021
      - CI023
      - CI025
      - CI026
  - calloutType: recommendation
    title: Require a private financial data room before underwriting
    body: >-
      An investment process should not advance without product-line revenue, contribution margin, CAC/payback, current
      cash, and financing-term detail from management.
    claimRefs:
      - CI035
      - CI039
      - CI040
