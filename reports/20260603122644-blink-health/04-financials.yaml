  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on investment decision
      - Exact diligence path
    rows:
      - - Revenue by product line and counterparty type
        - >-
          Cannot judge whether Blink is primarily a sticky manufacturer-services platform or a lower-quality
          transactional consumer business
        - Request monthly revenue bridge by BlinkRx, Quick Save, and Cash Express with top-customer concentration
      - - Gross margin and contribution margin by workflow
        - >-
          Cannot tell whether affordability and convenience translate into attractive unit economics after support,
          shipping, and pharmacy costs
        - Request gross-margin bridge and order-level contribution analysis
      - - CAC, reorder, and payback by channel
        - >-
          Cannot determine whether Blink can scale consumer demand efficiently or whether manufacturer programs offset
          CAC burden
        - Request cohort retention, acquisition by source, and payback by product
      - - Cash balance, burn, and working-capital timing
        - Cannot compute runway or next-round dependency from public evidence
        - Request current cash, monthly burn, AP/AR timing, and scenario-based cash forecast
      - - Pricing / take rate / contract structure
        - Cannot connect public affordability claims to realized revenue or margin capture
        - Request price book, standard contract terms, pharmacy economics, and revenue-recognition policy
      - - Financing terms and confirmed valuation
        - Cannot judge dilution, liquidation stack, or whether the 2025 round priced risk appropriately
        - Request cap table, financing documents, investor rights, and management confirmation of post-money valuation
    notes: These are the highest-priority blockers to financial underwriting after reviewing the full public source set.
    enumerationScope:
      coverage: sample
      basis: >-
        The table lists the highest-value diligence blockers surfaced by the public review rather than every possible
        missing metric.
