company:
  name: Blink Health
chapter:
  number: 1
  title: Company Overview
  summary: 'Blink Health is a New York-based prescription access company founded in 2014 by Geoffrey and Matthew Chaiken. As of 2026 it markets BlinkRx for branded medications, Quick Save for generic cash-pay pickup, and Blink Cash Express for mail order, with official pages claiming 35,000+ participating pharmacies, 50-state BlinkRx delivery, and 600+ team members across four cities. Funding and valuation disclosures remain contradictory: accessible secondary sources show cumulative capital raised anywhere from $165 million to $583.89 million, while the most recent hard-news consensus is only that a $140 million Series D led by 1789 Capital closed in late 2024/early 2025.'
sections:
- id: identity-and-product-surface
  title: Identity, Product Surface, and Current Footprint
  body: |-
    Blink Health is a New York-based prescription access company whose current consumer and manufacturer-facing stack is split across three products: BlinkRx for branded medications, Quick Save for generic cash-pay pickup, and Blink Cash Express for cash-pay mail order. Its official legal and contact materials consistently tie the operating address to 1407 Broadway, Suite 1910 in New York, while the careers page shows additional offices in Pittsburgh, Chesterfield (St. Louis), and Boise. The current distribution footprint is substantial on paper: the pharmacy pickup network page says Blink can be used at 35,000+ participating pharmacies nationwide plus 16,000+ independent pharmacies not displayed on the locator, and BlinkRx claims free home delivery across all 50 states for 55+ medications and 55+ leading brands.

    The 2026 careers page also says Blink has 600+ team members, including 200+ technologists. That said, current product availability is uneven: Cash Express's login page says the service is not accepting new patients, and different official pages publish different support-hour windows, so the present operating surface requires confirmation by product. The legal stack is also more complex than the consumer brand suggests: the current terms and HIPAA notice reference Blink Health Inc., Blink Health Administration LLC, Blink Health Pharmacy LLC, and Blink Rx LLC in different contexts.
