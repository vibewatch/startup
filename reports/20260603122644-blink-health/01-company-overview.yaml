- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance Visibility
  body: |-
    Leadership is still visibly founder-centric. Independent coverage and the 2025 Series D announcement agree that brothers Geoffrey Chaiken and Matthew Chaiken founded Blink in 2014, with Geoffrey serving as CEO and Matthew as President. Public governance disclosures are thinner than product disclosures: the clearest current board facts come from the 2025 financing announcement, which says Donald Trump Jr. joined the board after 1789 Capital led the Series D and that Kelly Ayotte stepped down after five years of service. That is enough to confirm a material board transition, but not enough to reconstruct the full current board or cap-table control structure.

    PremierAlts also lists Selvam Velmurugan as CTO and Michael Nameth as EVP of Cloud & Specialty Pharmacy, yet those roles were not corroborated on accessible official pages. On the public record, key-person dependence remains concentrated in Geoffrey Chaiken as chief executive spokesperson and in Matthew Chaiken as co-founder and president, with governance transparency below what later-stage investors would normally want before underwriting control rights, succession resilience, or board independence.
