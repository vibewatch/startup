- id: capital-formation-and-valuation-noise
  title: Capital Formation, Investor Base, and Valuation Noise
  body: |-
    Capital formation is the chapter's noisiest evidence bucket. The recent piece of hard news is consistent: PRNewswire, Yahoo Finance, Crunchbase News, and Investing all say BlinkRx raised a $140 million Series D led by 1789 Capital and added Donald Trump Jr. to the board. After that, the data providers diverge sharply. Crunchbase News says the company had raised $315 million total after the round, PremierAlts shows only $165 million total funding, and Forge shows $583.89 million of total funding plus a $1.62 billion Series D valuation, with round-by-round secondary-market detail that does not reconcile cleanly to the other services.

    The right takeaway is not to pick one number as canonical, but to treat total raised and valuation as low-confidence until management or primary financing documents disclose the cap table. Reviewed sources also do not disclose ownership percentages, and we did not find a company-confirmed debt, credit-facility, ARR, or profitability figure that would let later chapters normalize valuation on fundamentals.
