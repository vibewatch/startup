- id: milestones-scale-and-adverse-record
  title: Milestones, Historical Scale Signals, and Adverse Record
  body: |-
    Blink's historical narrative is clearer than its current private-market disclosure. Accessible reporting shows a progression from 2014 founding, to a February 2016 launch, to 2019 claims of 600,000-750,000 customers and rapid hiring, to an October 2020 Series C visible in Forge's round history, and then to the 2024/2025 Series D recap. The adverse record is also real, though not existential from the sources reviewed. CourtListener shows Blink Health Ltd. filed and then voluntarily dismissed a 2018 trade-secret case against Hippo Technologies, while a 2020 ADA class-action complaint alleged the Blink website was inaccessible to blind users.

    Consumer reviews are mixed rather than uniformly negative: Trustpilot shows a 4.2 score from 1,112 reviews and the Apple App Store shows 4.3 from 134 ratings, but BBB still hosts a formal complaints page and review text highlights delivery, navigation, and pricing frustrations. The biggest analytical gaps are not legal—they are operating disclosure gaps: we still do not have a current active customer count, current revenue or ARR, or a management-confirmed valuation benchmark.
