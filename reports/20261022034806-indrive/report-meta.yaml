companyProfile:
  summary: >-
    inDrive is a private global mobility platform whose core product lets riders and drivers negotiate fares rather than
    relying on fixed algorithmic pricing. The platform has expanded into intercity transport, delivery, groceries,
    advertising, and financial services, creating cross-service optionality but also a more complex operating and
    capital-allocation profile.
