  topStrengths:
    - Differentiated negotiated-fare model with reported scale across more than 1,200 cities and 48 countries.
    - Large reported distribution base creates cross-service expansion optionality.
    - Diversification beyond ride-hailing is visible, although its financial materiality is not yet proven.
  topRisks:
    - Audited revenue, cash flow, contribution margin, retention, and market-level unit economics are unavailable.
    - >-
      Public funding and valuation records conflict, while current cap-table, debt, and preference terms are
      undisclosed.
    - Regulatory, labor, safety, and execution risk can pressure a low-commission marketplace model.
  unresolvedGaps:
    - Audited FY2025 and current trailing-twelve-month financial statements with revenue-recognition detail.
    - Current cap table, preference stack, debt covenants, maturities, cash balance, and runway.
    - Market-level take rates, incentives, retention, contribution margins, and customer concentration.
    - Lending-book size, defaults, partner economics, and regulatory treatment for inDrive.Money.
    - Formal closeout of Malaysia's probationary licence-monitoring process.
