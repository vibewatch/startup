evidenceGaps:
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: >-
      Primary incorporation, launch-date, and headquarters records that reconcile the 2012/2013 and Mountain
      View/Limassol descriptions.
    whyItMatters: Legal identity and jurisdiction affect governance, tax, regulatory, and contracting diligence.
    diligencePath: >-
      Obtain current corporate registry extracts, the legal-entity chart, and management confirmation of commercial
      launch dates.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, beneficial ownership, voting rights, succession arrangements, financing rights, and
      related-party disclosures.
    whyItMatters: Founder concentration and investor rights affect control, downside protection, and governance quality.
    diligencePath: >-
      Request the cap table, shareholder agreement, board and committee rosters, financing instruments, and succession
      materials under NDA.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited FY2025 financials, current revenue and cash flow, cash balance, vertical mix, take rates, contribution
      margins, and debt covenants.
    whyItMatters: >-
      Funding raised is not cash available, and operating scale does not establish revenue quality, profitability, burn,
      or runway.
    diligencePath: >-
      Request audited statements, bank and debt schedules, and a management KPI pack with definitions, periods, and
      denominators.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: A defined paying-customer or transaction denominator reconciled to monthly active and monthly transacting users.
    whyItMatters: User reach cannot be converted into customer count, monetization, or retention without a consistent denominator.
    diligencePath: Request monthly user, transactor, trip, cohort-retention, and payer data by market and service.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: legal-regulatory-status
    missingEvidence: >-
      Current independent legal, regulatory, sanctions, outage, data-incident, and leadership-departure checks across
      major operating markets.
    whyItMatters: >-
      The assigned adverse query retained no result, so absence of a cited incident is not evidence that no incident
      exists.
    diligencePath: >-
      Run jurisdiction-specific regulator, court, sanctions, cyber-incident, and executive-departure searches and obtain
      company representations.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: >-
      Comparable annual ride-hailing and adjacent-services spend by target geography, with disclosed methodology,
      period, and included categories.
    whyItMatters: >-
      Without a common denominator, footprint and MAU cannot be converted into TAM, SAM, SOM, market share, or a
      valuation ceiling.
    diligencePath: >-
      Obtain current country-level market-spend data and reconcile it to inDrive's active cities, service lines,
      bookings, and take rates.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-footprint
    missingEvidence: A dated operating schedule defining active countries, cities, service lines, and the measurement period.
    whyItMatters: >-
      The retained 45-plus, 47, and 48-country figures and 700 versus 1,200-plus city figures imply materially different
      served-market boundaries.
    diligencePath: >-
      Request a current country-and-city operating schedule and reconcile it to active supply, demand, and service
      availability.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: City-level bookings, take rate, incentives, insurance cost, rider and driver retention, and contribution margin.
    whyItMatters: >-
      Low commissions and geographic growth can coexist with weak economics when insurance, safety, and supply costs
      rise faster than volume.
    diligencePath: >-
      Request cohort-level unit economics for the largest markets and a bridge from gross bookings to contribution
      profit.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segmentation
    missingEvidence: A country-by-country map of service lines, buyer, user, payer, budget owner, and regulatory status.
    whyItMatters: >-
      Adjacent categories differ in frequency, monetization, capital provider, and regulatory exposure, so a global
      buyer map cannot be inferred from selected examples.
    diligencePath: >-
      Build a current service-catalog and market matrix from operating data, partner contracts, and local regulatory
      filings.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM001
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-profiles
    missingEvidence: >-
      Comparable current funding, active-user, city-level liquidity, target-segment, and strategic-direction data for
      Uber, Lyft, local incumbents, and specialist adjacencies.
    whyItMatters: >-
      The profile table can identify alternatives but cannot rank their capital strength, local density, or segment
      overlap on a common basis.
    diligencePath: >-
      Build a market-by-market competitor data room from filings, regulator records, current price cards, app
      intelligence, and independent mobility datasets.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-and-lock-in
    missingEvidence: >-
      City-level rider and driver retention, multi-homing, incentive intensity, response times, acceptance rates,
      realized take rates, and contribution margins.
    whyItMatters: >-
      Downloads and transactions do not establish durable liquidity, switching costs, pricing power, or superior unit
      economics.
    diligencePath: >-
      Request market-level cohorts and supply-demand metrics under NDA, then benchmark the same periods and geographies
      against major competitors.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-trust
    missingEvidence: >-
      Independent, market-matched evidence on safety outcomes, service reliability, insurance coverage, complaint rates,
      and regulatory posture across the competitor set.
    whyItMatters: Company safety positioning cannot establish a comparative trust advantage or quantify compliance exposure.
    diligencePath: >-
      Collect regulator decisions, insurance terms, incident and complaint datasets, and customer research for each
      priority city.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: financial-statements
    missingEvidence: Audited financial statements and cash-flow detail.
    whyItMatters: Without audited statements the report cannot test profitability, cash generation, or reported growth.
    diligencePath: Request audited statements and management accounts.
    relatedQuestionRefs:
      - QI001
      - QI006
      - QI007
  - type: private-evidence-only
    severity: material
    topic: technical-disclosure
    missingEvidence: >-
      Architecture diagrams, service boundaries, API documentation, deployment topology, uptime history, and incident
      records.
    whyItMatters: Product breadth and geographic scale do not establish reliability, scalability, or integration quality.
    diligencePath: >-
      Request a technical architecture review, twelve-month SLO and incident pack, and representative integration
      documentation under diligence access.
    relatedQuestionRefs:
      - QE004
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: safety-controls
    missingEvidence: Independent testing of identity, vehicle, fraud, privacy, and incident-response controls.
    whyItMatters: >-
      The negotiated marketplace depends on trust, and a control failure could damage users, regulators, and marketplace
      liquidity.
    diligencePath: >-
      Obtain control narratives, audit reports, penetration-test summaries, fraud and safety incident metrics, and
      country-level compliance attestations.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner signal such as API documentation, repository activity, package usage, or
      independent technical benchmark.
    whyItMatters: >-
      Without an engineering-facing signal, external reviewers cannot independently assess platform maturity or
      integration friction.
    diligencePath: >-
      Request a controlled developer briefing or publish stable API, integration, and reliability documentation;
      otherwise preserve this as an unresolved product diligence gap.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: partner-operations
    missingEvidence: >-
      Partner contracts, service levels, inventory and fulfilment controls, and claims data for grocery and other
      adjacent services.
    whyItMatters: Adjacent services add operational dependencies that may dilute the reliability of the core marketplace.
    diligencePath: Review partner SLAs, fulfilment KPIs, exception handling, insurance, and termination or concentration provisions.
    relatedQuestionRefs:
      - QE003
      - QE004
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Monthly rider and driver cohorts with repeat-trip, churn, renewal, GRR, NRR, and satisfaction measures by market
      and service.
    whyItMatters: Reach and transaction totals cannot establish whether usage is durable or whether supply and demand are retained.
    diligencePath: >-
      Request a customer and provider cohort export for the latest 24 months, reconciled to finance and segmented by
      country and product.
    relatedQuestionRefs:
      - QU002
      - QU004
      - QU009
      - QU010
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A reconciled list of named commercial customers and partners with deployment status, contract scope, outcomes, and
      reference permissions.
    whyItMatters: >-
      The current named proof is concentrated in one partner rollout, company impact programs, and anonymous advertiser
      interest.
    diligencePath: >-
      Obtain a customer/partner reference list and independently confirm at least three production deployments or
      renewals.
    relatedQuestionRefs:
      - QU003
      - QU005
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Revenue, transactions, active users, and provider supply by country, top customer/partner, and channel.
    whyItMatters: >-
      Pakistan is described as a major growth and investment focus, but the concentration and downside exposure are not
      quantified.
    diligencePath: >-
      Request a market concentration bridge and sensitivity analysis for the top five countries, partners, and service
      lines.
    relatedQuestionRefs:
      - QU006
      - QU010
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-exposure
    missingEvidence: >-
      A current jurisdiction-by-jurisdiction license, insurance, litigation, enforcement, privacy, and
      consumer-protection register.
    whyItMatters: >-
      Aggregated footprint claims cannot establish legal continuity or quantify the probability and impact of a
      strategic-market restriction.
    diligencePath: >-
      Obtain the legal-entity map, permit and insurance schedule, regulator correspondence, open matters,
      outside-counsel opinions, and renewal calendar for every material market.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: safety-outcomes
    missingEvidence: Independent market-level serious-incident, impersonation, fraud-loss, screening-coverage, and response-time data.
    whyItMatters: >-
      Company-described controls and one police collaboration do not measure event frequency, control effectiveness, or
      remediation quality.
    diligencePath: >-
      Request the safety and fraud KPI pack, incident taxonomy, anonymized cases, insurance claims, law-enforcement
      requests, and independent control-assurance reports.
    relatedQuestionRefs:
      - QR004
      - QR005
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited statements, current cash, debt principal and covenants, segment contribution margins, incentives, working
      capital, and credit-loss vintages.
    whyItMatters: >-
      Funding raised is not cash available, and gross revenue assertions do not establish margin, liquidity, cash burn,
      or debt headroom.
    diligencePath: >-
      Obtain audited FY2025 statements and current management accounts, debt agreements, cash reconciliation, segment
      cohorts, and inDrive Money portfolio and loss data.
    relatedQuestionRefs:
      - QR007
      - QR008
      - QR009
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: >-
      Partner contracts, exclusivity, termination rights, concentration, contingency plans, SLA performance, and unit
      economics for Krave Mart, WeRide, and other material counterparties.
    whyItMatters: >-
      A partnership-led model lowers owned-asset intensity but can transfer service, safety, availability, and economic
      risk to counterparties.
    diligencePath: >-
      Review executed agreements, partner financial health, SLA dashboards, failure and exit scenarios, fallback
      capacity, and board-approved concentration limits.
    relatedQuestionRefs:
      - QR006
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: Current fully diluted cap table, preference stack, warrants, debt schedule, covenants, and cash balance.
