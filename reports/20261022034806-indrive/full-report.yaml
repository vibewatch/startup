      - number: '1.3'
        title: Financing and ownership
        blocks:
          - type: paragraph
            body: >-
              The financing record is substantial but taxonomy-sensitive. Clay totals $537 million across six rounds,
              including two $150 million debt financings, while Dealroom reports $232 million of total funding and
              separately lists the same $300 million of debt. These figures should not be collapsed into a single
              equity-raised or cash-available number. Dealroom records a $1.2 billion valuation for the February 2021
              Series C, but the retained evidence supplies no current priced-round valuation, secondary transaction, cap
              table, preference stack, debt covenants, or remaining cash balance. General Catalyst, Insight Partners,
              Bond, and LETA Capital appear in the secondary financing records; their present ownership and control
              rights remain unverified.
