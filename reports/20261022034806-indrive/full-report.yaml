        - $1.23B-$3.0B
        - Scaled core persists, diversification remains early, and disclosure risk warrants a discount
        - Medium only after capitalization and cash flow are verified
        - Track while price remains inside the historical-to-reported reference band
      - - Bear
        - Below $1.23B
        - Margin compression, financing overhang, or expansion spending weakens cash generation
        - Rises if financing remains unreconciled or leverage increases
        - Stop if downside protection and liquidity cannot be demonstrated
    notes: >-
      Ranges are bounded by conflicting third-party public references, not a DCF, revenue multiple, transaction opinion,
      or independently verified current valuation.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
