          detail: Competition and tighter margins remain material
        - id: financing
          label: Financing uncertainty
          detail: Public total-funding figures do not reconcile
        - id: valuation
          label: Valuation uncertainty
          detail: Public references span $1.23B to $4.8B with unequal support
        - id: recommendation
          label: Track / research more
          detail: Require audited economics, cap table, and transaction terms
      edges:
        - - scale
          - mix
        - - mix
          - pressure
        - - pressure
          - financing
        - - financing
          - valuation
        - - valuation
          - recommendation
    approximationNotes: The flow expresses decision order only; it does not assign weights, probabilities, or conversion rates.
