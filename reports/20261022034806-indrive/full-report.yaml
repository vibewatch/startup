    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and emerging diversification are outweighed by margin pressure and unresolved valuation and
      financing evidence.
    data:
      nodes:
        - id: scale
          label: Reported scale
          detail: 400M+ downloads and 39.4M monthly active users are company claims
        - id: mix
          label: Diversification signal
          detail: Ride-hailing is reported nearer 85% of revenue
        - id: pressure
