chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              inDrive operates a two-sided mobility platform in which riders and drivers can negotiate fares, a model
              that independent reporting and company materials trace to resistance to unfair taxi pricing. The public
              identity record is not fully consistent: Dealroom lists a 2012 launch in Astana, while Clay uses a 2013
              founding year; Dealroom and TechCrunch identify Mountain View as headquarters, while Clay identifies
              Limassol. Those conflicts may reflect launch-versus-incorporation timing and legal-versus-operating
              headquarters, but the assigned evidence does not resolve them. The current product scope extends beyond
              ride-hailing into intercity transport, delivery, groceries, advertising, and financial services, making
              marketplace liquidity and cross-service adoption central to the business model.
