      - number: '1.4'
        title: Scale, diversification, and milestones
        blocks:
          - type: paragraph
            body: >-
              By September 2026, inDrive reported operations in more than 1,200 cities across 48 countries, more than
              400 million app downloads, and 39.4 million monthly active users. These are company-originated operating
              metrics carried by official material and interview coverage; monthly active users are not equivalent to
              paying customers. Diversification has visible usage evidence: the company reported that 13% of monthly
              transacting users used both mobility and at least one delivery service in 2025. Financial materiality is
              still unknown. TechCrunch reported that inDrive declined to disclose advertising revenue, its share of
              company revenue, or when ads could become material. Scale therefore supports strategic optionality, but
              not a verified revenue run-rate, profitability conclusion, or liquidity assessment.
