            body: >-
              Arsen Tomsky remains both founder and chief executive, and a September 2026 interview describes him as
              leading nearly 3,000 employees. The operating bench is broader than the founder role alone: public sources
              identify Evgenia Matrosova in ride-hailing, Andries Smit in growth businesses, and dedicated leaders for
