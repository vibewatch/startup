  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product surface can be represented as a negotiated marketplace core with adjacent logistics, commerce,
      advertising, and financial-service layers.
    data:
      layers:
        - label: Marketplace core
          detail: Negotiated mobility and participant trust form the public-facing marketplace foundation.
          items:
            - name: Negotiated mobility
              detail: City and intercity rides connect passengers and drivers through directly agreed fares.
        - label: Trust and safety
          detail: Publicly described verification and in-app safety features support participant trust.
          items:
            - name: Identity and safety
              detail: Identity, licence, vehicle, fitness, and facial checks are attributed to the company interview.
        - label: Logistics operations
          detail: Adjacent transport services reuse the platform's supply and transaction surfaces.
          items:
            - name: Courier and freight
              detail: Delivery and freight extend driver earning and local logistics use cases.
        - label: Grocery fulfilment
          detail: Grocery delivery adds partner-dependent commerce and fulfilment operations.
          items:
            - name: Grocery delivery
              detail: Pakistan expansion uses a local dark-store partner and the existing app surface.
        - label: Advertising
          detail: In-app advertising adds a monetization layer around waiting and trip attention.
          items:
            - name: In-app advertising
              detail: Placements target waiting and in-trip attention, with in-car formats described as a later possibility.
        - label: Financial services
          detail: Financial products extend the ecosystem but require separate licensing and credit controls.
          items:
            - name: Financial services
              detail: >-
                Driver-linked financial products are an expanding product direction, with licensing and credit controls
                not public.
