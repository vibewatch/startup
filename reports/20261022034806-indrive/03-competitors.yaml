      - Evidence-backed scale or funding
      - Target segment and product scope
      - Pricing or differentiation
      - Strategic direction and limitation
    rows:
      - [inDrive, "Direct negotiated-price platform", "48 countries and second in 2025 global ride-hailing downloads; funding not disclosed in retained sources", "Price-sensitive riders and drivers; rides plus intercity, courier, grocery, financial services, and advertising", "Rider proposes and driver accepts or counters; about 10% ride commission reported", "Super-app expansion; city-level liquidity and economics remain undisclosed"]
      - [Uber, "Direct global incumbent", "76% U.S. ride-hailing share in 2024 per an analysis cited by Business Insider; funding not assessed", "App-based mobility; Uber Eats is also referenced as an ordering alternative", "Platform-set upfront pricing; cited driver-data study suggested a 42% average take at end-2024", "Distribution advantage is evidenced in the U.S.; fee comparison is not normalized"]
      - [Lyft, "Direct app-based peer", "Comparable scale and funding were not present in the assigned sources", "App-based ride-hailing", "Drivers see a fare and accept or reject; commission evidence unavailable", "Pricing, target-segment, and strategic-direction evidence remain gaps"]
      - ["Local taxis and autorickshaws", "Incumbent and substitute", "No comparable aggregate scale or funding in assigned sources", "Local point-to-point transport", "Local pricing and payment practices were not quantified", "Street-level supply may be durable, but comparative reliability is unknown"]
      - ["Public transport and private vehicles", "Status quo substitute", "Not applicable; no usage denominator retained", "Routine mobility outside an app marketplace", "Public fares or vehicle ownership costs were not compared", "Can cap ride-hailing demand; convenience and total-cost comparisons are missing"]
      - ["White-label platform or internal build", "Likely entrant and internal-build substitute", "Miracuves advertises a starting price, not deployed scale or funding", "Configurable rider, driver, admin, payment, and dispatch software", "Fare negotiation and commission controls are marketed as configurable", "Shows feature imitability; supplier marketing does not prove production quality"]
    notes: "Coverage is a representative competitive set from the assigned sources, not an exhaustive market census. Company-issued and supplier-advertised figures are labeled and are not independent benchmarks; unknown funding, scale, and pricing fields were not estimated."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP014, CP015]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, inDrive, Uber or Lyft model, Local or status-quo alternative, White-label or internal build]
    rows:
      - [Fare formation, "Rider proposes; driver accepts or counters", "Platform presents fare or payout for acceptance or rejection", "Varies; no comparable evidence retained", "Negotiation workflow is supplier-configurable"]
      - [Rider agency, "Company claims choice of price, car, arrival time, and driver", "Comparable choice set not established in assigned sources", "Choice depends on local supply or owned mode", "Configurable interface; outcomes unverified"]
      - [Driver agency, "Company claims choice of rider and price with no skipping penalty", "Offer may be accepted or rejected; counteroffer not evidenced", "Local autonomy varies and was not measured", "Counteroffer and availability controls are marketed"]
      - [Service breadth, "Ride-hailing, intercity, courier, grocery, financial services, and advertising", "Ride-hailing plus referenced food-ordering adjacency for Uber", "Usually single-mode or locally fragmented", "Modules can be added, but deployed breadth is unverified"]
      - [Distribution signal, "Second in 2025 global ride-hailing downloads; company reports multi-country scale", "Uber led downloads and held the cited 76% U.S. share", "No normalized digital distribution measure", "No deployed network scale evidenced"]
      - [Trust and regulatory posture, "Company emphasizes choice and a safety pact; comparative outcomes unavailable", "No retained comparative safety or regulatory benchmark", "No retained comparative benchmark", "Supplier lists safety and compliance workflows, not audited outcomes"]
      - [Defensibility, "Local liquidity, brand, and execution may compound", "Incumbent network density and distribution", "Local habit, proximity, and installed supply", "Visible features appear reproducible; operating performance is unknown"]
    notes: "Unknown means the assigned successful sources did not support the cell; it does not mean the capability is absent. Supplier comparison content is treated as competitor-issued marketing rather than an independent benchmark."
    claimRefs: [CP002, CP004, CP005, CP013, CP014]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Offer or model, Public price or fee signal, Included capability, Discount or unknown, Competitive implication]
    rows:
      - ["inDrive rides", "About 10% commission per ride reported by Business Insider", "Negotiated fare, matching, and counteroffers", "Realized fare, incentives, and city-level take rates unavailable", "Low reported commission may aid supply, but economics are unverified by market"]
      - ["Uber rides", "Driver-data study cited by Business Insider suggested a 42% average take at end-2024", "Upfront platform pricing and matching", "Not a company fee schedule or like-for-like market comparison", "Incumbent liquidity may offset a higher directional take estimate"]
      - ["Lyft rides", "No comparable fee retained", "Platform-presented offer with accept or reject", "Market pricing, incentives, and take rate unknown", "No evidence-based price ranking is possible"]
      - ["inDrive grocery in Pakistan", "Free delivery above PKR 499 with no service fee was reported for rollout", "More than 7,500 products planned through Krave Mart", "Realized basket economics, discounts, and fulfillment costs unknown", "Adds frequency but exposes inDrive to specialist logistics execution"]
      - ["inDrive advertising", "Pricing was not disclosed", "In-app placements during waiting and travel", "CPM, conversion, discounts, and renewals unknown", "Potential high-margin adjacency depends on engagement and advertiser demand"]
      - ["Miracuves white-label substitute", "Supplier advertises an inDrive-style app starting at $3,099", "Fare negotiation, driver matching, payments, admin, and tracking", "Promotional list price excludes verified total implementation and operating cost", "Low advertised entry price weakens a pure feature-barrier thesis"]
    notes: "Reported fees and supplier list prices use different units and denominators and are not realized revenue, margin, or total cost. Null-equivalent unknowns are stated explicitly rather than estimated."
    claimRefs: [CP005, CP006, CP007, CP008, CP015]
figures:
  - id: FP001
    title: "Competitive positioning: pricing agency (x) versus service breadth (y)"
    type: quadrant
    summary: "Ordinal scores run from 1 (low) to 5 (high) and translate only the assigned evidence into a directional positioning view."
    data:
      points:
        - label: inDrive
          x: 5
          y: 5
          detail: "Negotiated fares plus rides, courier, grocery, financial services, and advertising; breadth is company- and interview-reported."
        - label: Uber
          x: 1
          y: 5
          detail: "Platform-set pricing with the strongest retained incumbent distribution signal; service breadth is only partially evidenced."
        - label: Lyft
          x: 1
          y: 2
          detail: "Platform-presented ride offers are evidenced, but assigned sources do not establish broader scope or current scale."
        - label: "Local taxis and autorickshaws"
          x: 3
          y: 1
          detail: "Local price flexibility is plausible but not measured; assigned evidence supports only their role as fragmented substitutes."
        - label: "Public transport or private vehicle"
          x: 1
          y: 1
          detail: "Status-quo mobility alternatives without an evidenced integrated service marketplace in the assigned pool."
        - label: "White-label or internal build"
          x: 4
          y: 3
          detail: "Supplier-marketed configurability supports high potential pricing agency; deployed service breadth and quality are unverified."
    approximationNotes: "Coordinates are evidence-backed ordinal judgments, not measured market shares, feature counts, or benchmark thresholds. Provisional placements explicitly reflect missing Lyft, local-alternative, and white-label deployment data."
    claimRefs: [CP009, CP011, CP014, CP016]
