    title: Evidence hierarchy for addressable-market diligence
    type: pyramid
    summary: >-
      The layers narrow from an unsupported category total to observed company adoption signals;
      they are evidence scopes, not proportional market shares.
    data:
      nodes:
        - id: total-category
          label: Total ride-hailing and urban-services market
          value: null
          unit: null
          note: "No comparable spend denominator appears in the assigned pool."
        - id: served-countries
          label: Current company-reported country footprint
          value: 47
          unit: countries
          note: "October 2026 inDrive release; a September 2026 IPO Edge profile says 48."
        - id: served-cities
          label: Reported operating-city footprint
          value: "1,200+"
          unit: cities
          note: "September 2026 IPO Edge company profile; Dealroom states 700 cities on an undated page."
        - id: active-users
          label: Reported monthly active users
          value: 39.4
          unit: million MAU
          note: "Company figure in IPO Edge; definition and measurement period are undisclosed."
        - id: pakistan-reach
          label: Pakistan operating reach
          value: "20+ ride-hailing cities; 200+ intercity routes"
          unit: company-reported coverage
          note: "Business Recorder interview; city and route counts are different units."
        - id: mexico-finance
          label: Mexico driver-finance penetration
          value: "More than 11%"
          unit: active drivers
          note: "Company-issued February 2026 impact metric cited in the October release."
    claimRefs: [CM004, CM005, CM007, CM010, CM012, CM015]
    approximationNotes: >-
      Layer order reflects narrowing evidence scope, not a mathematical funnel or proportional
      market size. Different dates, units, populations, and geographies are preserved; null means
      the assigned evidence does not support a value.
