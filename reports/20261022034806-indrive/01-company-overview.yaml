schemaVersion: "report-v2"
artifact: company-overview
slug: indrive
runDate: 2026-10-22
company:
  name: inDrive
chapter:
  number: 1
  title: Company Overview
  summary: >-
    inDrive has a clearly differentiated negotiated-fare model and reports substantial global
    scale, but even basic identity records conflict across public databases. Its current
    capitalization, governance, revenue, cash position, and economics remain private or
    insufficiently supported for a precise valuation view.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      inDrive operates a two-sided mobility platform in which riders and drivers can negotiate
      fares, a model that independent reporting and company materials trace to resistance to
      unfair taxi pricing. The public identity record is not fully consistent: Dealroom lists a
      2012 launch in Astana, while Clay uses a 2013 founding year; Dealroom and TechCrunch identify
      Mountain View as headquarters, while Clay identifies Limassol. Those conflicts may reflect
      launch-versus-incorporation timing and legal-versus-operating headquarters, but the assigned
      evidence does not resolve them. The current product scope extends beyond ride-hailing into
      intercity transport, delivery, groceries, advertising, and financial services, making
      marketplace liquidity and cross-service adoption central to the business model.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Arsen Tomsky remains both founder and chief executive, and a September 2026 interview
      describes him as leading nearly 3,000 employees. The operating bench is broader than the
      founder role alone: public sources identify Evgenia Matrosova in ride-hailing, Andries Smit
      in growth businesses, and dedicated leaders for groceries, advertising, delivery, and
      financial services. That functional coverage is a positive signal for diversification, but
      it does not answer governance questions. The assigned sources provide no complete board
      roster, committee structure, voting-rights schedule, beneficial-ownership table, or formal
      succession plan. Founder-CEO concentration therefore remains a material diligence issue,
      rather than proof of weak governance.
    claimRefs: [CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: financing-and-ownership
    title: Financing and ownership
    body: >-
      The financing record is substantial but taxonomy-sensitive. Clay totals $537 million across
      six rounds, including two $150 million debt financings, while Dealroom reports $232 million
      of total funding and separately lists the same $300 million of debt. These figures should
      not be collapsed into a single equity-raised or cash-available number. Dealroom records a
      $1.2 billion valuation for the February 2021 Series C, but the retained evidence supplies no
      current priced-round valuation, secondary transaction, cap table, preference stack, debt
      covenants, or remaining cash balance. General Catalyst, Insight Partners, Bond, and LETA
      Capital appear in the secondary financing records; their present ownership and control
      rights remain unverified.
    claimRefs: [CO012, CO013]
    tableRefs: [TO003]
  - id: scale-diversification-and-milestones
    title: Scale, diversification, and milestones
    body: >-
      By September 2026, inDrive reported operations in more than 1,200 cities across 48 countries,
      more than 400 million app downloads, and 39.4 million monthly active users. These are
      company-originated operating metrics carried by official material and interview coverage;
      monthly active users are not equivalent to paying customers. Diversification has visible
      usage evidence: the company reported that 13% of monthly transacting users used both
      mobility and at least one delivery service in 2025. Financial materiality is still unknown.
      TechCrunch reported that inDrive declined to disclose advertising revenue, its share of
      company revenue, or when ads could become material. Scale therefore supports strategic
      optionality, but not a verified revenue run-rate, profitability conclusion, or liquidity
      assessment.
    claimRefs: [CO006, CO007, CO008, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Scale supports cross-service optionality
    body: >-
      The reported footprint, app downloads, active-user base, and 2025 cross-service usage show
      an established distribution surface for newer services, subject to company-metric
      verification.
    claimRefs: [CO006, CO007, CO008, CO015]
  - calloutType: risk
    title: Capital and financial precision is unavailable
    body: >-
      Public sources do not establish a current valuation, equity-raised total, cash balance,
      revenue run-rate, profitability profile, cap table, or financing covenants.
    claimRefs: [CO012, CO013, CO016]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns: [Metric, Value or status, Period, Confidence, Gap]
    rows:
      - [Launch or founding, "2012 launch per Dealroom; 2013 founding per Clay", Historical, medium, "Confirm incorporation and commercial-launch dates"]
      - [Headquarters, "Mountain View per Dealroom and TechCrunch; Limassol per Clay", "2025-2026 source set", medium, "Distinguish legal, tax, and operating headquarters"]
      - [Core model, "Rider-driver fare negotiation on a two-sided mobility platform", Current, high, "Request market-level take rates and acceptance data"]
      - [Operating footprint, "1,200+ cities across 48 countries", "September 2026", high, "Company metric; reconcile market activation definitions"]
      - [App downloads, "400 million+", "September 2026", medium, "Company metric; obtain independent time series"]
      - [Monthly active users, "39.4 million", "September 2026", medium, "Definition, geography, and measurement window not disclosed"]
      - [Employees, "Nearly 3,000", "September 2026", medium, "Confirm current employees versus contractors"]
      - [Current valuation, null, Current, low, "Latest retained valuation evidence is $1.2B from February 2021"]
      - [Total financing, "$537M including debt per Clay; $232M funding plus $300M debt per Dealroom", Historical, low, "Reconcile equity, debt, and refinancing treatment"]
      - [Revenue or run-rate, null, Current, low, "Obtain audited revenue and vertical mix"]
      - [Paying customer count, null, Current, low, "MAU is a user metric, not a paying-customer denominator"]
    notes: >-
      Values preserve source labels and periods; null means unsupported in the assigned evidence,
      not zero. Funding totals use different database taxonomies and company metrics are not
      independently audited here.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO012, CO013, CO016]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Public role, Relevant background or coverage, Key-person or diligence implication]
    rows:
      - [Arsen Tomsky, "Founder and CEO", "Leads the reported nearly 3,000-person global team", "Obtain succession, voting-control, and related-party disclosures"]
      - [Evgenia Matrosova, "Chief Ride Hailing Officer", "Ride-hailing, food-delivery, and platform operating background", "Verify scope, market accountability, and current tenure"]
      - [Andries Smit, "Chief Growth Businesses Officer", "Oversees expansion beyond the core ride business", "Request capital allocation and vertical performance scorecards"]
      - [Raphael Zennou, "Vice President, Food and Groceries", "Former Delivery Hero quick-commerce executive", "Verify launch economics and partnership authority"]
      - [Max Silin, "Director, inDrive.Ads", "Former Google digital-media and monetization executive", "Revenue contribution and advertiser retention remain private"]
      - [Valentin Laykov, "Senior Head of Delivery", "Prior delivery leadership across EMEA, Latin America, and APAC", "Request delivery margins, retention, and regional controls"]
      - [Alexander Kurchin, "Leader, inDrive.Money", "Fintech and e-commerce background; helped originate the vertical", "Review credit governance, partner structure, and portfolio risk"]
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named operating leaders in the assigned 2026 company announcement, interview,
        and independent coverage; the board and complete executive roster are unavailable.
    notes: >-
      This is a partial operating-leadership roster, not a board or complete management list;
      backgrounds are source-described and were not independently credential-checked.
    claimRefs: [CO005, CO009, CO010, CO011, CO014]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - [Arsen Tomsky, "Founder and CEO", "Potential concentration of strategic and voting influence", "Obtain voting rights, ownership, succession, and related-party schedule"]
      - [General Catalyst, "Reported financing participant and debt lead", "Associated with the 2021 Series C and 2023-2024 debt", "Confirm current equity, instrument terms, security, and covenants"]
      - [Insight Partners, "Reported Series C investor", "Historical institutional equity exposure", "Confirm current stake, preference terms, and transfer history"]
      - [Bond, "Reported Series B and Series C participant", "Historical growth-capital exposure", "Confirm current ownership and any exit or secondary activity"]
      - [LETA Capital, "Reported early-stage investor", "Associated with 2017 and 2018 financing entries", "Confirm remaining stake and historical preference rights"]
      - ["Drivers and riders", "Core marketplace participants", "Supply, demand, liquidity, and negotiated-price formation", "Request cohort retention, take rates, incentives, and concentration"]
      - ["Advertisers, delivery partners, and financial-service partners", "Growth-business ecosystem", "Support diversification and cross-service monetization", "Request contracts, economics, retention, and counterparty exposures"]
    enumerationScope:
      coverage: partial
      basis: >-
        Named financing participants and operating stakeholder groups visible in the assigned
        sources; complete beneficial ownership, lender, and commercial-partner lists are private.
    notes: >-
      Financing roles come from secondary databases whose total-funding classifications differ;
      current ownership, control rights, lender priority, and partner concentration are unknown.
    claimRefs: [CO005, CO009, CO011, CO012, CO014, CO015]
