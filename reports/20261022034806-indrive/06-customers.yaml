          detail: "Retention, concentration, and provider welfare determine whether reach becomes durable value."
          touchpoints: ["Cohorts and churn", "Market concentration", "Provider welfare"]
    claimRefs: [CU001, CU003, CU006, CU010, CU011, CU015]
