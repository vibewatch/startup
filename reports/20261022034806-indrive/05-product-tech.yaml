      - ["Earn flexibly from transport", "Driver chooses requests and agrees a fare", "Multi-sided marketplace with multiple earning verticals", "Company interview describes rides, intercity, courier, and freight", "No verified driver retention or earnings distribution"]
      - ["Move goods locally", "Sender requests courier or freight service", "Delivery and freight extensions", "Delivery growth was reported for Pakistan in 2025", "Country-level reliability and claims data unavailable"]
      - ["Buy daily essentials", "Consumer orders through the app", "Grocery partnership and dark-store fulfilment", "Planned 20-30 minute Karachi delivery window", "Public evidence does not establish actual SLA attainment"]
      - ["Reach customers during trips", "Brand buys in-app placement", "Ads shown while waiting or en route", "Mid-2025 tests reportedly generated hundreds of millions of impressions", "No audited attribution or privacy-control evidence"]
      - ["Receive platform-linked finance", "Driver accesses a financial product", "inDrive.Money or related offerings in selected markets", "Product direction is publicly described", "Licensing, underwriting, and credit outcomes are gaps"]
    notes: "Benefits combine observed product descriptions with company-supplied operating signals; no row should be read as independently verified performance."
    claimRefs: [CE003, CE005, CE006, CE007, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Public evidence, Dependency, Risk or diligence ask]
    rows:
      - ["Negotiation and matching", "Connects passenger demand with driver supply", "Fare agreement and peer choice are repeatedly described", "Local supply density and identity data", "Test marketplace liquidity, manipulation resistance, and dispatch latency"]
      - ["Identity and safety", "Establishes trust between participants", "Interview reports ID, licence, vehicle, fitness, and facial checks", "Verification vendors and local authorities", "Request control design, false-positive rates, and incident response"]
      - ["Payments and settlement", "Completes multi-country transactions", "Service portfolio implies transaction processing", "Local payment rails and regulatory regimes", "Reconcile payment failures, refunds, chargebacks, and reconciliation"]
      - ["Logistics and fulfilment", "Supports courier, freight, and grocery orders", "Pakistan grocery rollout uses Krave Mart partnership", "Partners, inventory, and local operations", "Validate partner SLAs, inventory accuracy, and claims handling"]
      - ["Advertising layer", "Creates a second monetization surface", "In-app placements are prioritized in 2026", "Brand demand and consented attention data", "Verify targeting, consent, measurement, and user experience"]
      - ["Technical governance and support", "Sustains safety, reliability, and incident response", "No control-plane documentation appears in the retained assigned sources", "Distributed teams and country rules", "Obtain service SLAs, escalation ownership, and audit evidence"]
    notes: "This is an evidence-bounded operating model, not a disclosed software architecture; shared components are hypotheses requiring technical diligence."
    claimRefs: [CE005, CE006, CE009, CE010, CE011, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: The public product surface can be represented as a negotiated marketplace core with adjacent logistics, commerce, advertising, and financial-service layers.
    data:
      layers:
        - label: Marketplace core
          detail: Negotiated mobility and participant trust form the public-facing marketplace foundation.
          items:
            - name: Negotiated mobility
              detail: City and intercity rides connect passengers and drivers through directly agreed fares.
        - label: Trust and safety
          detail: Publicly described verification and in-app safety features support participant trust.
          items:
            - name: Identity and safety
              detail: Identity, licence, vehicle, fitness, and facial checks are attributed to the company interview.
        - label: Logistics operations
          detail: Adjacent transport services reuse the platform's supply and transaction surfaces.
          items:
            - name: Courier and freight
              detail: Delivery and freight extend driver earning and local logistics use cases.
        - label: Grocery fulfilment
          detail: Grocery delivery adds partner-dependent commerce and fulfilment operations.
          items:
            - name: Grocery delivery
              detail: Pakistan expansion uses a local dark-store partner and the existing app surface.
        - label: Advertising
          detail: In-app advertising adds a monetization layer around waiting and trip attention.
          items:
            - name: In-app advertising
              detail: Placements target waiting and in-trip attention, with in-car formats described as a later possibility.
        - label: Financial services
          detail: Financial products extend the ecosystem but require separate licensing and credit controls.
          items:
            - name: Financial services
              detail: Driver-linked financial products are an expanding product direction, with licensing and credit controls not public.
    claimRefs: [CE002, CE005, CE006, CE007, CE008, CE009]
callouts:
  - calloutType: strength
    title: Differentiated customer interaction
    body: The negotiated-fare mechanic is a clear product distinction and has been extended across a large multi-country operating footprint.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Control-plane opacity
    body: Public sources describe the customer promise but do not provide the reliability, security, privacy, fraud, or integration evidence needed to validate engineering maturity.
    claimRefs: [CE009, CE011, CE012]
  - calloutType: recommendation
    title: Require technical-control evidence
    body: Before underwriting further expansion, request architecture documentation, uptime and incident records, security testing, partner SLAs, and country-level compliance evidence.
    claimRefs: [CE009, CE011, CE012]
