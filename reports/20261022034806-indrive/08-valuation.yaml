      - [Anti-thesis, "Capital deployment is hard to evaluate", "Investment programs and local spending lack disclosed return metrics", "Capital-allocation bridge tied to cash returns"]
    notes: "Scale figures are company claims carried by publishers; financing totals use different and undisclosed classification conventions."
    claimRefs: [CV001, CV002, CV003, CV006, CV011, CV012, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Public reference range, Required assumptions, Probability signal, Trigger]
    rows:
      - [Bull, "$3.0B-$4.8B", "Audited profitable growth, clean financing terms, and material high-margin diversification", "Low until transaction support and audited economics exist", "Upgrade only after the upper reference is supported by an arm's-length transaction"]
      - [Base, "$1.23B-$3.0B", "Scaled core persists, diversification remains early, and disclosure risk warrants a discount", "Medium only after capitalization and cash flow are verified", "Track while price remains inside the historical-to-reported reference band"]
      - [Bear, "Below $1.23B", "Margin compression, financing overhang, or expansion spending weakens cash generation", "Rises if financing remains unreconciled or leverage increases", "Stop if downside protection and liquidity cannot be demonstrated"]
    notes: "Ranges are bounded by conflicting third-party public references, not a DCF, revenue multiple, transaction opinion, or independently verified current valuation."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV013]
