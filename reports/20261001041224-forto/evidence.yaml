evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2024-2025 financial statements specifying gross revenues, net revenue margin, and cash burn.
    whyItMatters: >-
      Third-party estimates range between $269M and $294M but cannot verify underlying unit economics or cash runway
      without official financial audit statements.
    diligencePath: Obtain German Bundesanzeiger statutory filings or request confidential investor data room financial pack.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: Current verified active customer count, net revenue retention (NRR), and top-10 customer concentration metrics.
    whyItMatters: >-
      The 2,500+ customer milestone dates from 2021 and does not reveal whether shipper volume concentrated or
      contracted post-2024 restructuring.
    diligencePath: >-
      Review shipper cohort retention curves and account volume distribution schedules during management diligence
      sessions.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: cap-table-ownership
    missingEvidence: Full shareholder cap table, exact equity percentages, liquidation preferences, and secondary transaction records.
    whyItMatters: >-
      Public sources detail lead investors and round totals across 8 funding tranches but do not disclose the exact
      capitalization table or secondary pricing terms.
    diligencePath: Inspect cap table capitalization model and shareholder agreements in management diligence data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A reproducible, independently sourced market model using one category definition, period, geography, revenue
      convention, and route-level denominator.
    whyItMatters: >-
      Existing forecasts differ by category and cannot support a precise TAM, SAM, SOM, growth rate, or revenue-share
      assumption for Forto.
    diligencePath: >-
      Obtain the underlying analyst reports, normalize gross versus net revenue, and build a route-by-mode model from
      carrier, customs, and trade-association data.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level contract values, sales cycles, conversion, retention, budget owners, gross margin, working-capital
      turns, and route density.
    whyItMatters: >-
      Public workflow evidence shows possible user value but does not establish willingness to pay or attractive unit
      economics by buyer segment.
    diligencePath: >-
      Review CRM cohorts, customer contracts, procurement interviews, lane-level contribution margins, and
      accounts-receivable and carrier-payable aging.
    relatedQuestionRefs:
      - QM005
      - QM008
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: current-adoption
    missingEvidence: >-
      A dated and independently verified current customer count, annual shipment volume, customer mix, and adoption
      trajectory.
    whyItMatters: >-
      The homepage's 2.5k-customer figure has no visible measurement date and resembles an earlier company disclosure,
      so current growth and penetration cannot be calculated.
    diligencePath: >-
      Obtain audited operating KPI definitions and monthly cohorts, then reconcile them to invoices, shipment records,
      and a representative customer-reference sample.
    relatedQuestionRefs:
      - QM007
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: shipper-switching-costs
    missingEvidence: >-
      Audited shipper churn rates, annual contract renewal rates, and multi-homing frequency across Forto's top 500
      accounts are not publicly disclosed.
    whyItMatters: >-
      Without retention and multi-homing data, it is impossible to verify whether customer loyalty is driven by software
      lock-in or volatile spot-market freight pricing.
    diligencePath: >-
      Request customer cohort retention curves, gross and net revenue retention by annual shipping volume, and average
      number of primary forwarders used by enterprise shippers.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited statutory profit and loss statements, balance sheets, and cash flow statements for fiscal years 2024 and
      2025.
    whyItMatters: >-
      Without audited figures, gross vs net revenue spreads, freight gross margins, and actual net cash burn cannot be
      independently underwritten.
    diligencePath: >-
      Request German commercial register filings (Bundesanzeiger) for Forto GmbH or direct audited disclosure from
      management under NDA.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Verified cash on hand, bank debt facilities, undrawn revolving credit, and monthly net burn rate figures.
    whyItMatters: >-
      Determines whether Forto has sufficient liquidity to reach profitability organically or remains dependent on
      near-term financing or a distressed sale.
    diligencePath: Inspect company monthly management accounts, bank covenant compliance certificates, and credit agreement terms.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: enumeration-incomplete
    severity: minor
    topic: software-traction
    missingEvidence: >-
      Disclosed paying customer count, contracted annual recurring revenue (ARR), and net expansion metrics for the
      newly launched FortoLabs software unit.
    whyItMatters: >-
      Critical to determining whether Forto can successfully re-rate from low-multiple freight forwarding (0.5x–1.0x
      revenue) to software multiples (6x–10x ARR).
    diligencePath: Obtain FortoLabs customer cohort retention data, SaaS subscription contracts, and pipeline reports.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: trust-and-compliance
    missingEvidence: >-
      Third-party audited SOC 2 Type II reports, ISO 27001 certificate verification, shipper-facing Data Processing
      Agreements (DPA), and public platform availability/uptime SLA metrics.
    whyItMatters: >-
      Enterprise and mid-market European shippers require verified compliance artifacts and uptime guarantees before
      committing core supply chain operations to a single digital logistics platform.
    diligencePath: >-
      Request unredacted ISO 27001 certification, historical platform uptime logs, and SOC 2 Type II audit reports under
      mutual non-disclosure agreement during phase 2 diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Current NRR, GRR, gross churn, logo churn, renewal rates, contract duration, customer cohorts, and satisfaction
      measures.
    whyItMatters: Aggregate customer and shipment counts do not establish durable revenue or successful renewal behavior.
    diligencePath: >-
      Obtain board-grade cohort exports and contract-level renewal schedules, then reconcile them to invoiced revenue
      and lost-account reasons.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Current top-1, top-5, and top-10 customer shares by gross revenue, net revenue, gross profit, shipment count, and
      mode.
    whyItMatters: Historical segment mix cannot quantify present exposure to a small number of large shippers or procurement events.
    diligencePath: >-
      Review anonymized customer-level revenue and gross-profit concentration for 2024, 2025, and trailing twelve months
      through September 2026.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A current complete customer-reference list showing production status, start date, modes used, contract value,
      outcomes, and renewal status.
    whyItMatters: >-
      Three company-named historical users cannot establish the quality, freshness, or breadth of current production
      deployments.
    diligencePath: >-
      Select references across manufacturing, consumer goods, and e-commerce and conduct buyer-led calls using contract
      and invoice corroboration.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: A dated reconciliation of the displayed 2.5k customers to active, paying, and transacting accounts.
    whyItMatters: >-
      The current display cannot be compared with the 2020 count or used to calculate additions, losses, utilization, or
      revenue per customer.
    diligencePath: >-
      Request monthly active and paying customer bridges from January 2020 through September 2026 with consistent
      definitions.
    relatedQuestionRefs:
      - QU002
      - QU009
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements for FY2024 and FY2025 detailing gross margin, net revenue, operating EBITDA, and cash
      burn.
    whyItMatters: >-
      Without audited financial disclosures, assessing whether Forto is operating at cash break-even following its 2025
      salesforce reduction remains impossible.
    diligencePath: >-
      Obtain confidential disclosure deck, audited balance sheets, and working capital debt facility terms during
      management due diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audited economics
    missingEvidence: Audited current revenue, gross profit, EBITDA, operating cash flow, and working-capital history by service line.
    whyItMatters: >-
      These inputs are required to distinguish freight pass-through from value-generating economics and select an
      appropriate valuation method.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, and service-line revenue and gross-profit
      reconciliations.
    relatedQuestionRefs:
      - QV003
      - QV006
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current cash, debt, runway, fully diluted capitalization, and liquidation-preference or participation terms.
    whyItMatters: >-
      Funding raised is not cash available, and equity outcomes depend on liabilities, dilution, and contractual
      seniority.
    diligencePath: Obtain a current balance sheet, debt schedule, cap table, shareholder agreements, and financing term sheets.
    relatedQuestionRefs:
      - QV003
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: current price discovery
    missingEvidence: A later arm's-length financing, verified secondary transaction, or signed strategic transaction after March 2022.
    whyItMatters: >-
      Without a later market-clearing event, the historical post-money valuation cannot establish a current entry price
      or return case.
    diligencePath: >-
      Request recent secondary indications and transaction records, and confirm whether any active financing or
      strategic process exists.
    relatedQuestionRefs:
      - QV001
      - QV005
      - QV006
      - QV007
    relatedTableRefs:
      - TV002
      - TV003
