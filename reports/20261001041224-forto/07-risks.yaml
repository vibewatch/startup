callouts:
  - calloutType: "risk"
    title: "Structural Working Capital Float Constraint"
    body: "Freight forwarding fundamentally acts as a cash-negative float mechanism during volume expansion because carriers require rapid settlement while corporate shippers demand extended commercial payment windows. Without abundant low-cost equity funding, Forto must balance volume growth against liquidity constraints."
    claimRefs:
      - "CR001"
      - "CR004"
  - calloutType: "insight"
    title: "Channel Conflict in the FortoLabs SaaS Pivot"
    body: "Forto's effort to reprice as an enterprise AI software provider faces a structural channel conflict: third-party forwarders, customs brokers, and logistics intermediaries may resist adopting operational automation tooling from a vendor that actively competes for enterprise freight accounts."
    claimRefs:
      - "CR005"
      - "CR006"
