      - number: '7.3'
        title: EU ETS 附加费、关税波动与数据核验缺口
        blocks:
          - type: paragraph
            body: >
              欧洲监管合规要求引发了利润率波动与运营摩擦。欧盟排放交易体系（EU ETS）海运指令逐步推行，对进出欧洲港口的集装箱航线强制征收碳配额，主流集装箱班轮公司在受影响的远洋长途航线上征收约 €98/TEU
              的碳附加费。尽管 Forto 将排放可视化、第二代生物燃料订舱选项（可减少最高 80% 运输排放）和可持续发展报告作为品牌差异化卖点，但突发的监管调整和复杂的单据标准，需要在不同客户的 ERP
              系统中进行严密合规对接。与此同时，贸易政策动荡——如墨西哥对非自由贸易协定进口商品上调 35% 至 50% 的最惠国关税，以及反复无常的跨大西洋关税争端——要求持续开展原产地合规核查（例如 EUR.1
              证书），以防报关环节出现卡壳。


              外部监管负担之上，更叠加了缺乏独立公开发布的机构级审计凭证这一难题。作为一家未上市的私有企业，Forto 从不公开发布经审计的资产负债表、毛利率明细或公开的净留存率数据。Forge Global
              等平台上的二级市场老股价格等关键机构治理数据亦未见披露或未予报价，使得外部债权方与股权分析师只能依赖历史通稿和估算指标。要核实其合规水准、客户集中度警戒线及长期流动性储备，必须获取非公开机构数据室的专属准入权限。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR010
      - number: '7.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 结构性营运资金周转约束
            body: 在货量扩张期，货代业务本质上是一种现金负沉淀机制，原因在于承运人要求迅速结款，而企业托运人则要求延期付款。在缺乏充裕廉价股权资金支持的情况下，Forto 必须在业务规模扩张与流动性约束之间做好平衡。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
          - type: callout
            title: FortoLabs SaaS 转型中的渠道冲突
            body: Forto 试图向企业级 AI 软件供应商重新定位，但面临结构性的渠道冲突：第三方货代、报关行及物流中介机构很可能会抵触采纳一家与自身直接争夺企业客户货源的厂商所提供的自动化运营工具。
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 历史融资清晰，当下价值成谜
        blocks:
          - type: paragraph
            body: >-
              Forto 的历史融资阶梯证据扎实，但绝不能将其与当前价值混为一谈。据 TechCrunch 及 Forto 报道，公司于 2021 年完成一轮估值 $1.2B 的 $240M 融资；路透社亦报道其于 2022
              年 3 月按 $2.1B 估值完成一笔 $250M 融资。融资数据库根据收录范围及是否包含债权，将其公开累计融资规模表述为 $600M、超过 $600M 或
              $610M。统计分母的口径出入，并不能成为盲目选择某一点估计值的理由。更关键的是，审阅的所有材料均未发现此后有任何新增公开融资。因此，$2.1B
              这一数字只是历史投后估值基准，既不能证明当前拥有可用现金，也不代表当下的二级市场出清价格或当前企业价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
