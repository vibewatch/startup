      - number: '3.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 营运资金陷阱与传统巨头规模优势
            body: >-
              依赖风投资金的数字货代面临结构性流动性压力：海运承运人要求快速结算，而中端商业托运人的付款周期长达 30 至 60 天。当利率回归正常水平、风投资本退潮时，拥有堡垒级资产负债表的传统巨头（如 DSV 和
              Kuehne+Nagel）重掌财务主导权，迫使数字化挑战者削减运营开支并重构商业模式。
            calloutType: risk
            claimRefs:
              - CP005
              - CP014
          - type: callout
            title: 来自承运人投资方的战略去中介化风险
            body: >-
              尽管来自 Maersk 等航运伙伴的投资为 Forto
              提供了早期资金和商业背书，但承运人自身也相继搭建了面向货主的直接数字化报价与订舱平台。这种双重角色带来了长期的结构性冲突：承运人既掌握了数字订舱交易数据的全貌，又试图跳过第三方货代直达终端货主。
            calloutType: insight
            claimRefs:
              - CP004
              - CP010
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与收入质量
        blocks:
          - type: paragraph
            body: >-
              Forto 主要作为数字化货运代理商运营，收入按全额账单口径确认，涵盖海运整箱 / 拼箱（FCL/LCL）、航空货运以及中欧班列铁运。货代收入由支付给海空运承运人的通道运输费，加上 Forto
              的差价抽成以及报关、货运险和内陆拖车等增值服务费构成。公司并无公开的标准价格表；海运和空运运价随即期市场行情按日波动，Forto
              提供了在线海运运费测算工具和即时报价引擎。虽然第三方分析师估计其年全额货运账单规模约为 $280M 至 $294M，但扣除承运人舱位采购成本后的净收入（即实际毛利差价），按行业货代标准的 12% 至 18%
              毛利率估算。2025 年 10 月，Forto 设立 FortoLabs，将内部物流 AI 工作流工具（尤其是单证处理工具 LumoDoc 及 Flash 智能体编排）剥离为独立的 SaaS
              产品线。FortoLabs 试图向第三方物流提供商及报关行获取纯软件订阅与使用费收入，但目前的商业进展和付费客户数均未披露。
