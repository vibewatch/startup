  - id: FI001
    title: Forto 资本流转与现金转化运作机制
    type: flow
    summary: 直观展示营运资金现金周转周期，以及从托运人开票总额到经营活动净现金流的利润转化路径。
    data:
      nodes:
        - id: shipper-booking
          label: 托运人订舱与开票
          detail: 货运预订总额发票按 30 至 60 天商业账期开具
        - id: carrier-outflow
          label: 承运人资金流出（垫资缺口）
          detail: 承运人运力批发款须在 7-14 天内结算，对营运资金造成严重沉淀占用
        - id: gross-spread
          label: 货运毛利差额
          detail: 扣除运营人力开支前，保留 12%-18% 的货代抽成率
        - id: ops-cost
          label: 运营与技术开销
          detail: 涵盖 12 处办事处 ~500 名员工的薪酬开支，外加技术基础设施与 AI 研发投入
        - id: net-cash-flow
          label: 净现金流 / 烧钱缺口
          detail: 经营性烧钱倒逼软件业务转型，或依赖股权 / 债权资金输血
        - id: saas-expansion
          label: FortoLabs SaaS 订阅收入流
          detail: 高毛利的纯软件收入流，旨在对冲货代业务对营运资金的拖累
      edges:
        - from: shipper-booking
          to: carrier-outflow
          label: 代收代付货运负债
        - from: shipper-booking
          to: gross-spread
          label: 12%-18% 买卖差价利润率
        - from: gross-spread
          to: ops-cost
          label: 薪酬支出资金占用
        - from: ops-cost
          to: net-cash-flow
          label: EBITDA 利润率缺口
        - from: saas-expansion
          to: net-cash-flow
          label: 软件毛利率贡献
    approximationNotes: 资金流向关系阐释了 trans.info 与 Teardown 研究报告中记录的营运资金结构性机制；具体现金余额未予披露。
    claimRefs:
      - CI002
      - CI005
      - CI006
      - CI012
