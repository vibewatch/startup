      - number: '4.3'
        title: 资本充足率、烧钱重组与投资测算缺口
        blocks:
          - type: paragraph
            body: >-
              截至 2022 年 3 月，Forto 在 8 轮融资中累计获得约 $610M；彼时由 Disruptive 领投，SoftBank Vision Fund 2、A.P. Moller Holding、G
              Squared 和 Northzone 参投的 Series D 轮融资让公司估值达到 $2.1B 的历史峰值。经历 2022 至 2023 年运价断崖式下跌后，Forto
              遭遇严峻的毛利挤压和营运资金拖累，迫使其在 2023 年 1 月至 2025 年 4 月间开展三轮重大重组，员工总数从约 800 人缩减至约 500 人。这一重组在 2023
              年年底关闭不来梅与马德里办事处时达到高潮，随后在 2025 年 4 月裁减了约 200 名员工，重创了直销商业团队。据报道，公司聘请了咨询机构 Moelis 探索战略选择，包括出售或合并谈判；同时在
              EquityZen 和 Forge Global 等平台上挂牌的老股流动性匮乏，未见明确估值标价。对潜在投资者而言，其财务状况构成了重大尽调阻碍：Forto
              未提供经审计的损益表、资产负债表数据、现金储备、净烧钱率或客户留存指标，使得资本充足率与资金跑道只能取决于非公开重组进展及潜在并购结果。
