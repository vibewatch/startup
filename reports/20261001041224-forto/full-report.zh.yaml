      - number: '2.2'
        title: 基于扎实证据的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              目前可用的规模测算视角仅具方向性参考价值，无法简单叠加。行业拆解报告将全球货运代理定义为年营收超过 $200B 的行业；而 trans.info 的文章则转述了两项范围较窄但定义不同的预测：物流数字化转型支出将从
              2023 年的 $63.89B 增至 2032 年的 $128.68B，数字物流市场则将从 2023 年的 $30.8B 增长至 2033 年的
              $182.9B。各预测口径的基准值、终点值、预测周期与分类标签差异巨大，说明单凭一个总括性的 TAM 数字极具误导性。上述公开来源均未拆解 Forto
              可服务的地理区域、运输方式结构、托运人规模、毛收入与净收入对比，亦未给出切合实际的市场份额。Forto 披露的业务版图只能提供规模维度的背景信息，不能直接当作测算分母。在对 SAM 或 SOM
              进行实质性投资测算前，必须掌握分航线的历史收入体量、合规潜在客户数，以及经过独立验证的渗透率模型。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.3'
        title: 买方画像、使用者与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方群体高度分化。Forto 业务材料中的客户既有年发运不足 5 个集装箱的小企业，也有发运量高达 100
              万箱的巨头，单一获客模式和服务机制无法代表整个市场。物流与外贸团队关注运输履约与在途可视化；采购或贸易管理团队主导承运人配额分配；财务部门承担运费与营运资金占用的后果；合同付款方则随 Incoterms
              条款而异。采纳往往始于零散的邮件、纸质单证和电子表格引发高昂异常成本的环节。Forto 曾报告某次运力管理系统的上线让毛利润提升了 10%、配额到订舱的流转效率提升了
              30%，但这是公司自身的宣传口径，缺乏独立第三方的复现检验。公开渠道并未披露 Forto 按客群细分的合同金额、销售周期、转化率或预算归属情况。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
