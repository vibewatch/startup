      - number: '5.4'
        title: 技术差异化、底层依赖与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Forto 的商业差异化立足于将直观数字界面、自动化单证抽取与透明排放报告融为一体，而非拥有专有的线下物流实体资产或排他性承运人合约。2025 年 10 月，Forto 设立 FortoLabs，将其包括
              LumoDoc 与 Flash 运营智能体在内的内部软件工具商业化，试图将自身软件层推销给第三方货代和报关行。但这套技术栈存在明显的运营与架构依赖。跨 Google Cloud Platform 与 Amazon
              Web Services 的多云部署带来了跨云网络延迟与管理复杂度，过往的工程演进历史也暴露出微服务膨胀失控的隐患。此外，企业级信任不可或缺的关键合规背书——包括正式的 SOC 2 Type II
              审计报告、公开的 ISO 27001 认证、面向托运人的数据处理协议（DPA）以及公开发布的平台可用性 SLA——均未见公开披露，在机构投资评估中构成了不容忽视的治理与技术尽调缺口。
            claimRefs:
              - CE007
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 双云架构与运营脆弱性
            body: >-
              Forto 将 Kubernetes 容器编排部署在 Google Cloud Platform，同时使用 Amazon Web Services 的 SNS/SQS
              进行事件消息传递，这种架构割裂带来了跨云网络依赖和配置复杂度。虽然容器化以及使用 Helm 和 Mozilla SOPS 的专职
              SRE团队稳定了交付流水线，但在缺乏公开容灾倒换机制的情况下跨不同云环境运行，一旦遭遇区域网络故障就会给业务连续性带来严重风险。
