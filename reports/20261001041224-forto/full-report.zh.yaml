      - number: '4.2'
        title: 单位经济模型、营运资金机制与销售效率
        blocks:
          - type: paragraph
            body: >-
              由于大额通道承运成本、线下操作开支以及承运人与托运人之间的账期错配，数字化货代的单体经济模型与纯软件基准大相径庭。无论传统货代还是数字货代，运营方都必须在极紧的时间表内（通常为 7 至 14
              天或凭单付款）向海运和空运承运人结清款项，而企业托运人却要求 30 到 60
              天的付款账期。因此，总运费收入的增长会按全额流水而非净收益差价成比例消耗现金；一旦运价飙升或货量激增而缺乏充足授信，运营方就会面临严重的营运资金链承压。Forto
              的历史运营成本涵盖了分布在柏林、汉堡、新加坡、香港、上海、宁波、深圳、胡志明市和河内的分支网络，负责报关单据、异常处理以及承运人协调。为降低人工操作成本，Forto 部署了 Flash 和 LumoDoc
              等内部自动化工具，公司口径称 65% 的进港货运需求能以极少的人工干预完成处理，准确率超过 95%。历史上的销售效率依托于服务年发货量在 10,000 箱以内的中型企业，其中 90% 或以上的货量集中在年发运超过
              500 个集装箱的大客户手中。
