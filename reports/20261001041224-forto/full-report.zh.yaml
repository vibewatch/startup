      - number: '3.2'
        title: 能力剖析：软件差异化遭遇同质化现实
        blocks:
          - type: paragraph
            body: >-
              Forto 的核心产品差异化，立足于为欧洲中端市场企业提供直观的数字化平台，将海运、空运、铁运和报关工作流集中整合。通过接入实时节点追踪、供应商自动化沟通，以及符合 CSRD
              要求的碳排放报告和生物燃料替代方案等环保合规工具，Forto 满足了客户严苛的合规需求。然而，核心报价与状态追踪功能在整个行业正快速同质化。行业龙头 Flexport
              拥有成熟的全球履约基础设施，第三方评测基准也显示，主流软件平台的自动化数字货代界面表现难分伯仲，这使得客户的采购决策重新回到运价竞争力和线下网络可靠性上。
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP014
      - number: '3.3'
        title: 定价架构与商业变现模式
        blocks:
          - type: paragraph
            body: >-
              货运代理行业的主要变现途径是单笔交易的买卖差价，而非经常性的软件订阅费。Forto
              及其数字化同行主要按票收费，将平台使用权、运输节点追踪和基础单证处理全部打包进运价之中。这种模式迫使数字货代承担直接的承运责任风险，并承受沉重的营运资金压力。在行业惯例的 30 至 60
              天客户账期下，货代必须在收到客户回款之前很久，就向海空运承运人结清运费账单。面对这一财务压力，偏重软件的同行如 Zencargo 和 Beacon 纷纷转向纯 SaaS
              模式的在途可视化和单据信息抽取服务，试图在不占用资产负债表的前提下获取经常性的软件毛利。
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河韧性与承运人去中介化风险
        blocks:
          - type: paragraph
            body: >-
              托运人切换成本低廉以及承运人去中介化趋势，极大地制约了 Forto 竞争护城河的持久韧性。中端市场进口商普遍同时与多家货代合作，以保障集装箱配额并寻找各航线最优即期运价，因此客户锁定效应十分有限。此外，像
              Maersk 这样曾是 Forto
              早期战略投资方的主流班轮巨头，自身也在大力拓展数字化直客订舱能力，引发渠道冲突并带来去中介化风险。在全球贸易受扰动、航运联盟调整航线网络并收紧舱位之际，缺乏重资产支撑和压倒性采购规模的货代，将持续承受利润率挤压与配额断供的脆弱性。
            claimRefs:
              - CP004
              - CP010
              - CP011
