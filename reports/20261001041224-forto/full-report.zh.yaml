      - number: '5.2'
        title: 托运人工作流、系统集成与履约运营
        blocks:
          - type: paragraph
            body: >-
              客户业务流程始于 Ship by Forto 平台上的数字化报价与订舱，将过去耗时数天的往复邮件沟通转为线上即时生成报价。货物完成订舱后，平台会整合来自 100
              多家物流合作伙伴和海运承运人的状态更新与在途节点，就潜在的运输延误或航程偏离向托运人预警。与客户内部系统的集成依托标准及定制 REST API
              实现，可与企业资源计划（ERP）和仓库管理系统直接交换数据，免去人工录入货运单据的麻烦。在面向客户的界面背后，线下履约由两套系统支撑：一套是旨在实现发运全生命周期常规文书自动化处理的内部运营副驾驶及运输管理系统（TMS）Flash；另一套是专为从货运单证中抽取结构化数据而研发的内部文档分类工具
              LumoDoc。尽管推行了这些自动化项目，线下的实际货运履约依然严重依赖专门的物流运营团队，由他们在各始发国网点处理异常状况、与承运人谈判并完成货物的实体交接。
            claimRefs:
              - CE004
