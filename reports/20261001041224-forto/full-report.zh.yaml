      - number: '1.3'
        title: 融资历史、重组与战略再定位
        blocks:
          - type: paragraph
            body: >-
              2016 年至 2022 年间，Forto 通过股权和债权融资累计获得约 $610M，跻身欧洲资本实力最雄厚的物流科技初创企业之列。其主要融资里程碑包括：2021 年 6 月由 SoftBank Vision
              Fund 2 领投、估值 $1.2B 的 $240M Series C 轮融资；随后是 2022 年 3 月由 Disruptive 领投，A.P. Moller Holding、G Squared 与
              Northzone 参投的 $250M Series D 轮融资，该轮将 Forto 的投后估值推至 $2.1B
              的历史峰值。疫情期间供应链红利退潮后，全球集装箱运价大幅跳水，货代业务的营运资金需求与固定运营开支严重挤压了营业利润率。为此，Forto 在 2023 年 1 月至 2025 年 4
              月间先后开展了三轮裁员重组，最终累计裁撤约 200 名员工，员工总数从约 800 人的峰值压缩至 500 人左右。除了在 2025 年聘请投资银行 Moelis 寻求战略顾问咨询外，Forto 还在 2025
              年年底设立了 FortoLabs，力图将其自研的物流人工智能能力作为独立软件进行商业化。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
