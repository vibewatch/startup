      - number: '1.2'
        title: 创始人、管理层与治理演进
        blocks:
          - type: paragraph
            body: >-
              该企业由 Michael Wax、Erik Muttersbach、Ferry Heilemann 与 Fabian Heilemann 于 2016
              年创立；几位创始人均非物流行业出身，此前拥有消费科技创业及风险投资背景。在业务扩张阶段，管理层架构经历了数次既定轮换。2020 年年中，联合创始人 Ferry Heilemann 卸任
              CEO，转而专注于气候倡议；随后由主抓商业业务的联合创始人 Michael Wax 接任 CEO，掌舵了 Series C 和 Series D 轮融资的高增长周期。2025 年 2 月，Forto
              迎来重大高管治理调整：Michael Wax 转任董事会主席，原首席财务官 Guillaume Petit-Perrin 则升任首席执行官。Petit-Perrin 曾任投资银行家，于 2021 年加入
              Forto 并主导了多轮大额成长期融资；随着公司战略从高烧钱规模扩张转向资产负债表管理与运营纪律，他正式出任 CEO。更广泛的高管团队还包括主管技术、产品、全球运营、财务和 FortoLabs 的各业务线负责人。
            claimRefs:
