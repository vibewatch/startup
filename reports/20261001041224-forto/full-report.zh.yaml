      - number: '2.4'
        title: 驱动因素、制约条件与估值关联
        blocks:
          - type: paragraph
            body: >-
              货运需求瞬息万变，而船舶与港口运力的调整相对滞后，这为数字化提供了坚实的运营驱动力。Forto 的推介材料指出，集装箱船建造周期可长达 5 年，且 7 到 10
              家班轮公司垄断了绝大部分运力，这使得及时获取配额和异常状态数据成为刚需。但这一产业结构也制约了风投模式的规模化扩张：Anchor Group
              认为，货代业务规模越大，消耗的营运资金就越多，而传统巨头拥有的资产负债表实力，是主打数字化的挑战者难以企及的。Forto 累计融资 $610M
              的报道，只能证明其过往的融资能力，并不代表当前手头可用现金充裕。Forge
              平台上交易活跃度受限且价格缺失，同样说明公开二级市场交易证据稀缺，但不能等同于完全没有老股交易发生。在估值判断上，业务采纳度应锚定净货代经济模型、留存率、航线网络密度、营运资金周转率及经外部验证的软件收入，而非泛泛的数字物流行业增长预测。
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 宽泛的行业预测无法证明 Forto 的实际可获取市场
            body: 既有预测在统计分类和周期上并不一致，而航线维度的目标支出、定价机制、市场渗透率以及经独立验证的客户增长数据均未公开。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：数字化新势力与传统巨头实力对比
        blocks:
          - type: paragraph
            body: >-
              Forto 身处竞争白热化的国际货运代理市场，多种业务模式在此激烈争夺产业链价值。市场格局呈现出清晰的三层梯队：以 Flexport 和 Zencargo 为代表的原生数字化挑战者；包括
              Kuehne+Nagel、DSV 和 DHL Global Forwarding 在内的庞大传统货代巨头；以及以 Expeditors
              为典范、深耕网点且纪律严明的线下运营商。尽管数字化先锋最初凭借自动化即时报价、异常状态追踪和统一单据管理俘获了中端市场托运人，但传统货代巨头已逐步缩减了软件体验上的代差。传统巨头在承运人采购议价权、集装箱舱位保障及全球目的港地面操作方面拥有巨大的竞争优势，这是依赖风投资本的平台难以轻易复制的。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
