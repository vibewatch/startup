  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台产品组合与核心物流服务定义
        blocks:
          - type: paragraph
            body: >-
              Forto 提供数字化货运代理服务，旨在取代国际供应链中繁琐的人工沟通。托运人主要通过统一的客户门户 Ship by Forto
              与平台交互，该门户为海运集装箱、航空货运和铁运提供门到门订舱、动态运输节点追踪、集中化单据查阅以及碳排放追踪。其核心货运产品覆盖亚欧主干航线上的海运整箱（FCL）与拼箱（LCL），并辅以时效性更高的航空货运以及连接中国和欧洲的陆路中欧班列。为强化基础货运，Forto
              提供了打包增值服务，包括自营报关清关、货运运输保险、港口地面操作，以及自述可减少最高 80%
              运输排放的第二代生物燃料方案。通过将商业发票和海运提单等运输单证归集到数字化档案库，该平台旨在降低托运人的行政办公成本，同时在各国际运输航线上提供基础的在途可视化能力。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
