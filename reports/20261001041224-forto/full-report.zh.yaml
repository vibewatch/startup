      - number: '7.2'
        title: 海运瓶颈、关税动荡与交易对手去中介化
        blocks:
          - type: paragraph
            body: >
              Forto 运营亚欧主干航线及跨大西洋航线，持续暴露于外部海运冲击、绕航和航运联盟变动。Forto 内部市场情报显示，2026 年集装箱航线面临复杂的运力再平衡：全球船队运力扩张
              3.6%，汉堡、鹿特丹和安特卫普等北海枢纽港受冬季风暴影响出现船舶压港，回程与南下航段的综合船期延误达 3 至 5 天。此外，承运人尝试性恢复苏伊士运河通航带来了显著的“双重到港”（Double
              Arrival）风险：经红海航道返回的船舶可能与绕行好望角的船舶同时抵达新加坡、上海等亚洲主要中转港，导致下游码头拥堵、堆存时间激增，直接威胁客户履约交付 SLA。


              除实体拥堵外，Forto 还面临交易对手集中度偏高以及主流班轮巨头的去中介化威胁。战略投资方 A.P. Moller Holding 曾参投 Forto 金额达 $250M 的 Series D
              轮融资，船东创投机构 Maersk Growth 亦支持了更早期的融资。但 Maersk 等综合物流承运人已将数字货代平台 Twill
              直接接入其核心集装箱订舱门户，面向货主提供直客门到门数字化货代服务，与第三方数字货代展开正面竞争。由于海运运价在严重供过于求的背景下落入周期性底部，既无自营船队资产又缺乏锁定货量承诺的数字撮合平台，只能承受极度被挤压的净利差；与此同时，承运人背景的投资方却能完全掌握该货代日常经营表现。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
