      - number: '5.3'
        title: 软件架构、基础设施演进与 SRE 实践
        blocks:
          - type: paragraph
            body: >-
              Forto 的技术基础设施经历了多阶段架构演进，从最初架在 Heroku 上的紧耦合单体系统，演进为事件驱动的微服务架构。生产环境技术栈依托 Node.js 和 TypeScript
              服务构建，采用响应式编程范式，并将 MongoDB 作为主要的业务文档数据库。随着工程团队规模扩大，服务边界割裂成管理层口中的“分布式单体”，Forto 随后将容器工作负载迁移到 Google Cloud
              Platform 托管的 Kubernetes 集群。其基础设施拓扑呈现多云架构，利用 Amazon Web Services 的 Simple Notification Service（SNS）与 Simple
              Queue Service（SQS）在各独立领域服务之间传递异步事件消息。部署自动化与基础设施可靠性由专职的网站可靠性工程（SRE）团队把控，采用 Helm charts、CircleCI
              持续交付流水线以及用于凭据管理的 Mozilla SOPS，并计划向多区域高可用及无密码工作负载身份认证演进。
            claimRefs:
