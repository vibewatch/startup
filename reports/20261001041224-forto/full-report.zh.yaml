      - 投资逻辑
      - 反向逻辑
      - 何种凭据可改变研判
    rows:
      - - 业务版图
        - Forto 宣称其在 100 多个国家拥有 2,500 家客户
        - 单纯披露规模无法证实盈利能力或现金转化表现
        - 按会计期间披露的经审计毛利与经营性现金流
      - - 平台活跃度
        - Forto 披露其平台在 2023 年承运了 33,000 批次货物
        - 发运单量并未揭示收入质量、留存率或边际贡献率
        - 分客群留存、客户集中度及边际贡献率凭据
      - - 资本沿革
        - 头部机构领投的大额融资印证其以往获取成长期资本的能力
        - 已融资金不等于账面可用现金，且最新估值标记仅代表历史水平
        - 当前现金储备、负债、现金跑道及完全稀释后股权比例
      - - 战略选择空间
        - 据报道物色买家的动作有望打通退出路径
        - 未见任何公开宣布的交易，亦无公允市场交易的现行定价凭据
        - 已签署的交易条款或后续明确作价的新一轮融资
    notes: 公司发布的规模指标均作为单方声明列示，负面观察意见则归属于披露相关信息的独立分析机构。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
      - CV014
      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 增长得到验证、毛利率稳固、现金转化转正，且软件经常性收益模型跑通
        - 尚无公开数据支撑估值区间；须将货代过账流水与经常性软件收益严格剥离后方可估值
        - 财务改善获审计证实，且后续完成公允对价融资
        - 软件业务指标仍未披露，或现金转化持续为负
      - - 基准
        - Forto 维持具备一定规模的数字化货代定位，软件溢价重估未获验证
        - 尚无公开数据支撑估值区间；仅可对经审计净收入或常态化盈利套用行业估值乘数
        - 留存率、边际贡献率与流动性保持平稳
        - 客户流失萎缩、利润率承压，或融资压力再次抬头
      - - 悲观
        - 以低于 2022 年 3 月估值水平完成流血轮融资、结构化融资或战略出售
        - 在缺少净负债及清算优先权条款的情况下，无法测算普通股实际清偿收益
        - 融资条款苛刻、重组持续，或折价出售
        - 新增注资享有更高受偿顺位，或运营披露持续缺失
    notes: 各情景标签仅作为分析推演案例，不构成预测。鉴于所选信源未披露所需的当前财务及资本结构核心变量，本框架特意隐去具体数值区间与发生概率。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV010
      - CV012
      - CV016
figures:
  - id: FO001
    title: Forto 发展历程与融资里程碑（2016 - 2026）
    type: timeline
    summary: 梳理自 2016 年以 FreightHub 之名创立以来，历经超高速融资、市场回归常态、深度重组直至向软件业务转型的完整时间线。
    data:
      items:
        - label: 以 FreightHub 之名创立公司
          date: '2016-05-01'
          detail: 由 Michael Wax、Erik Muttersbach、Ferry Heilemann 与 Fabian Heilemann 联合创立于柏林，旨在推进亚欧航线货运代理数字化。
        - label: A 轮融资（$21.2M）
          date: '2017-12-13'
          detail: Northzone 领投 A 轮融资，Cherry Ventures 与 Global Founders Capital 跟投。
        - label: Maersk 战略投资
          date: '2019-05-02'
          detail: Maersk Growth 参投 B 轮融资，使 Forto 与全球领先的集装箱班轮巨头建立深度绑定。
        - label: 品牌更名为 Forto 暨 $50M 成长期融资
          date: '2020-11-17'
          detail: FreightHub 更名为 Forto；由 Inven Capital 与 Iris Capital 领投筹得 $50M，原 CEO Ferry Heilemann 离任。
        - label: 完成 C 轮融资晋升独角兽（$240M）
          date: '2021-06-19'
          detail: 疫情期间海运运价暴涨，SoftBank Vision Fund 2 领投 $240M 的 C 轮融资，投后估值达 $1.2B。
        - label: D 轮估值冲顶（融资 $250M，估值 $2.1B）
          date: '2022-03-07'
          detail: Disruptive 与 A.P. Moller Holding 领投 $250M 的 D 轮融资，确立 $2.1B 的估值标杆。
        - label: 运价回归常态后的首轮裁员
          date: '2023-01-15'
          detail: 伴随疫情期间集装箱即期运价断崖式跌回历史基准，Forto 裁减约 90 名员工。
        - label: 网点整合与办公室关闭
          date: '2023-10-15'
          detail: Forto 关闭 Bremen 与 Madrid 区域办事处，裁撤 75+ 个岗位以控制运营烧钱速度。
        - label: CEO 交接与董事会主席换届
          date: '2025-02-11'
          detail: 前 CFO Guillaume Petit-Perrin 出任 CEO；联合创始人 Michael Wax 转任董事会主席。
        - label: 销售团队重组与并购探讨
          date: '2025-04-08'
          detail: Forto 裁员约 200 人（约占员工总数 ~33%），主要波及商务团队；同时委聘 Moelis 评估战略选择。
        - label: FortoLabs 商业化 AI 业务上线
          date: '2025-10-20'
          detail: Forto 推出 FortoLabs，将内部 AI 单证工具（LumoDoc、Flash 智能体）解耦并向外部物流服务商输出。
    approximationNotes: 里程碑日期对应公开新闻公告及经核实的商业登记申报文件。
    claimRefs:
      - CO001
      - CO006
      - CO008
      - CO009
      - CO012
      - CO013
      - CO014
      - CO015
