chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业身份、运营版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Forto（法人主体为 Forto GmbH，2016 年创立时名为
              FreightHub）总部设在柏林，是一家数字化货运代理商，提供国际海运、空运与铁运服务，并配套报关清关、货运追踪和碳排放报告。公司不持有船舶或飞机资产，而是向 Maersk
              等商业承运人批发采购货运舱位，主要向在亚欧航线上运输货物的欧洲中端市场进口商销售门到门货代合同。营业收入按全额运费口径入账，通过批发舱位运价与托运人合同运价的买卖差价赚取利润，辅以报关和货物装卸等增值服务。公司搭建了面向客户的一体化订舱门户，以及名为
              Faro 的自研运输管理系统，以此支撑欧洲与亚洲各物流枢纽之间的运营协同。疫情后海运运价回归常态，货运市场环境发生转变，Forto 随即将运营重心转向工作流自动化，不仅部署了 Flash
              等内部人工智能智能体，还设立专门软件项目将其单证处理技术栈商业化。
