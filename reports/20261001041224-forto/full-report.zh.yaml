  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与行业现状
        blocks:
          - type: paragraph
            body: >-
              Forto 的核心市场是货运代理，而非纯物流软件。货代的核心价值在于把承运人运力、始发港与目的港地面操作、报关流程以及最终派送打包成统一的客户服务；Forto
              官网目前展示的业务包括海运、空运和铁运及附加服务。因此，相关市场开支包括货代服务费及配套履约服务，但不包括船舶资产持有、造船以及无关的仓储或最后一公里软件。数字化工作流是该市场内部的赋能层：根据公司业务介绍材料，纸质沟通、供应商割裂和靠电子表格调度是当下的行业现状。国际贸易术语（Incoterms）同样决定了由谁掌控和支付运输费用；Forto
              称约 90% 的货物及运输交易均使用此类条款，但这只是公司单方面口径，并非独立的行业普查数据。划清这一边界，可避免把物流科技领域的每一笔支出都盲目算作可直接触达的潜在收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
