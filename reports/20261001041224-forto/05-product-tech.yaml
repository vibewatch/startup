callouts:
  - calloutType: "risk"
    title: "Dual-Cloud Architecture and Operational Fragility"
    body: "Forto's architectural split between Google Cloud Platform for Kubernetes container orchestration and Amazon Web Services for SNS/SQS event messaging creates cross-cloud network dependencies and configuration complexity. While containerization and an internal SRE team with Helm and Mozilla SOPS stabilized the deployment pipeline, running across disparate cloud environments with undocumented failover procedures poses operational resilience risks during regional network disruptions."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
