companyProfile:
  summary: >-
    Forto is a Berlin-based digital freight forwarder that combines ocean, air, and rail forwarding with customs,
    shipment visibility, and CO2 reporting. The business has broad shipper reach and a meaningful historical funding
    base, but its current economics remain partially opaque because audited financials, retention, and concentration
    data are not public. The company has also shifted toward logistics automation and software commercialization through
    FortoLabs and related AI tooling.
