        - "New money ranks senior or operating disclosures remain unavailable"
    notes: >-
      Scenario labels are analytical cases, not forecasts. Numerical ranges and
      probabilities are intentionally omitted because the assigned sources do not
      disclose the required current financial and capital-structure inputs.
