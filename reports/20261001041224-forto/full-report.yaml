      - number: '6.2'
        title: Named proof and outcomes
        blocks:
          - type: paragraph
            body: >-
              The clearest named-customer evidence is company-issued and historical. A Forto release identifies
              industrial manufacturer Viessmann, consumer goods company Miele, and e-commerce brand Home24 as users of
              its supply chain management solutions. The same release says customers typically reduced administrative
              supply-chain costs by 30%, but it does not assign that result to any one of the three named accounts,
              disclose the measurement method, or distinguish production deployments from pilots. Forto's current
              homepage adds a testimonial around its digital and sustainable offering and presents an 80%
              ocean-transport emissions reduction via second-generation biofuels, yet the fetched page does not identify
              that testimonial's customer by company name. These records show use cases and claimed outcomes, not
              independently verified renewal or retention performance.
            claimRefs:
