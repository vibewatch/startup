      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying population is heterogeneous. Forto's operating presentation ranges from shippers moving fewer
              than five containers annually to customers moving as many as one million, so one acquisition motion and
              service model cannot represent the whole market. Logistics and trade teams use shipment execution and
              visibility; procurement or trade-management teams influence carrier allocation; finance bears freight and
              working-capital consequences; and the contractual payer can vary with the Incoterm. Adoption begins where
              fragmented email, documents, and spreadsheets create costly exceptions. Forto reported that one
              capacity-management rollout increased gross profit by 10% and allocation-to-booking productivity by 30%,
              but this is a company presentation, not an independently replicated benchmark. Public sources do not
              disclose Forto's contract values, sales cycles, conversion rates, or budget ownership by segment.
            claimRefs:
