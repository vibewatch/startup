      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Evolution
        blocks:
          - type: paragraph
            body: >-
              The enterprise was founded in 2016 by Michael Wax, Erik Muttersbach, Ferry Heilemann, and Fabian Heilemann
              as logistics outsiders bringing previous consumer tech startup and venture experience. The leadership
              architecture underwent several planned rotations across its scaling phases. Co-founder Ferry Heilemann
              stepped down as Chief Executive Officer in mid-2020 to focus on climate initiatives, after which
              commercial co-founder Michael Wax assumed the Chief Executive Officer role throughout the high-growth
              Series C and Series D funding cycles. In February 2025, Forto enacted a material executive governance
              transition when Michael Wax transitioned to Chairman of the Board and Guillaume Petit-Perrin was elevated
              from Chief Financial Officer to Chief Executive Officer. Petit-Perrin, a former investment banker who
              joined Forto in 2021 and orchestrated its large growth capital rounds, assumed the chief executive seat as
              the organization shifted focus from high-cash-burn volume expansion toward balance-sheet management and
              operational discipline. The broader senior management team comprises dedicated functional heads across
              technology, product, global operations, finance, and FortoLabs.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
