      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Digitization has a credible operational driver because freight demand can move quickly while vessel and
              port capacity adjust slowly. The Forto presentation says container ships can take up to five years to
              build and that seven to ten shipping lines control most capacity, creating a strong need for timely
              allocation and exception data. The same structure constrains venture-style scaling: Anchor Group argues
              that forwarding consumes more working capital as it grows and that incumbents possess balance-sheet
              strength digital-first challengers struggle to replicate. Forto's reported $610 million of cumulative
              funding demonstrates access to historical financing, not present cash availability. Forge's limited
              activity label and unavailable price likewise show sparse public secondary-market evidence, not the
              absence of transactions. For valuation, adoption should be tied to net forwarding economics, retention,
              route density, working-capital turns, and externally verified software revenue rather than broad
              digital-logistics growth forecasts.
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM015
              - CM016
