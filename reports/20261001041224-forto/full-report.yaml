  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Digital Peers and Incumbent Power'
        blocks:
          - type: paragraph
            body: >-
              Forto operates in an intensely competitive international freight forwarding market where value is
              contested across multiple operational models. The landscape divides into three distinct tiers:
              digital-native challengers such as Flexport and Zencargo; massive legacy incumbents including
              Kuehne+Nagel, DSV, and DHL Global Forwarding; and disciplined, branch-centric operators exemplified by
              Expeditors. While digital pioneers initially captured mid-market shippers by introducing automated instant
              quotes, exception tracking, and unified document management, traditional forwarders have steadily narrowed
              the software experience gap. The incumbents maintain immense competitive advantages in carrier purchasing
              leverage, container allocation guarantees, and global destination handling that venture-backed platforms
              cannot easily replicate.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
