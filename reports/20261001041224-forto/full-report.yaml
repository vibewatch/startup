  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Forto's core market is freight forwarding rather than pure logistics software. A forwarder assembles
              carrier capacity, origin and destination handling, customs steps, and final delivery into one customer
              service; Forto's current site presents sea, air, and rail freight plus additional services. Relevant spend
              therefore includes forwarding charges and attached execution services, while excluding ship ownership,
              vessel construction, and unrelated warehouse or last-mile software. Digital workflow is an enabling layer
              inside that market: the operating presentation describes paper-based communication, fragmented vendors,
              and spreadsheet-driven allocation as the status quo. Incoterms also shape who controls and pays for
              transport; Forto says these clauses are used in around 90% of goods and transport transactions, but that
              company-issued estimate is not an independent market census. This boundary avoids treating every
              logistics-technology dollar as directly addressable revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
