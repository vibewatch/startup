      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available sizing lenses are directional and cannot be stacked. Teardown describes global freight
              forwarding as a greater-than-$200 billion annual-revenue industry, while the trans.info article relays two
              narrower but differently defined forecasts: digital-transformation spending in logistics rising from
              $63.89 billion in 2023 to $128.68 billion in 2032, and a digital-logistics market rising from $30.8
              billion in 2023 to $182.9 billion in 2033. The different starting values, endpoints, periods, and category
              labels show why a single headline TAM would be misleading. None of these sources isolates Forto's
              serviceable geography, mode mix, shipper size, gross revenue versus net revenue, or realistic share.
              Forto's disclosed footprint offers scale context, not a substitute denominator. A dated route-level
              revenue pool, eligible account count, and independently verified penetration model are required before
              underwriting SAM or SOM.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM014
