chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Forto (formally Forto GmbH, founded in 2016 as FreightHub) is a Berlin-headquartered digital freight
              forwarder offering international ocean, air, and rail transport alongside customs brokerage, shipment
              tracking, and carbon emissions reporting. Rather than owning vessels or aircraft, Forto purchases
              wholesale cargo capacity from commercial carriers such as Maersk and sells door-to-door forwarding
              contracts primarily to European mid-market importers moving freight across Asia-Europe trade lanes.
              Operating revenue is booked on a gross freight basis, with margin captured from the spread between
              wholesale capacity rates and shipper contract pricing supplemented by value-added services such as customs
              clearance and cargo handling. The company built an integrated customer-facing booking portal and
              proprietary transport management system named Faro, which underpins operational coordination across
              European and Asian logistics hubs. Facing shifting freight market dynamics following post-pandemic
              shipping rate normalization, Forto has increasingly focused operational development on workflow
              automation, deploying internal artificial intelligence agents such as Flash and commercializing its
              document processing stack through a dedicated software initiative.
