      - number: '1.3'
        title: Capitalization History, Restructuring, and Strategic Repositioning
        blocks:
          - type: paragraph
            body: >-
              Between 2016 and 2022, Forto accumulated approximately $610M across equity and debt financing rounds,
              establishing itself among Europe's best-capitalized logistics technology startups. Major financing
              milestones included a $240M Series C round led by SoftBank Vision Fund 2 in June 2021 at a $1.2B
              valuation, followed by a $250M Series D round in March 2022 led by Disruptive with participation from A.P.
              Moller Holding, G Squared, and Northzone that established Forto's peak post-money valuation mark of $2.1B.
              When global container freight rates collapsed following pandemic-era supply-chain peaks, freight
              forwarding working-capital requirements and operational overhead pressured operating margins. In response,
              Forto executed three separate restructuring waves between January 2023 and April 2025, culminating in an
              approximate 200-employee reduction that adjusted total headcount from a peak of approximately 800 down to
              around 500 personnel. Alongside exploring strategic advisory mandates via investment bank Moelis in 2025,
              Forto established FortoLabs in late 2025 to commercialize its proprietary logistics artificial
              intelligence capabilities as independent software.
