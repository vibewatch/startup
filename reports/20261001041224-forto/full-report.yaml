      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Forto's workflow can support expansion: customers can quote, compare, book, track, manage documents, and
              receive priority tasks in one platform, while air-freight buyers can access spot and long-term rates from
              more than 100 carriers. That breadth creates plausible cross-sell paths across modes and services, but the
              assigned evidence does not disclose NRR, GRR, churn, renewal rates, contract duration, cohort behavior, or
              customer satisfaction. An independent teardown also reports that roughly 200 people were laid off in April
              2025, disproportionately from sales, which raises a service-coverage and account-expansion diligence
              question rather than proving customer loss. Historical segmentation reported by the same source says
              customers shipping more than 500 containers annually drove over 90% of revenue, but that old mix is not a
              current top-customer concentration measure. Forto's historical funding scale can support a long operating
              runway only if cash remains available; the cited funding record does not reveal current cash or customer
              economics.
