  - id: FI001
    title: Forto Capital Transformation and Cash Conversion Mechanics
    type: flow
    summary: >-
      Visualizing the working-capital cash conversion cycle and margin conversion from shipper gross billing to net
      operating cash flow.
    data:
      nodes:
        - id: shipper-booking
          label: Shipper Booking & Invoicing
          detail: Gross freight booking invoice issued on 30- to 60-day commercial payment terms
        - id: carrier-outflow
          label: Carrier Outflow (Float Deficit)
          detail: Wholesale carrier capacity payments due in 7-14 days, creating working capital cash absorption
        - id: gross-spread
          label: Gross Freight Margin Spread
          detail: Retained forwarding take-rate of 12%-18% before operational personnel overhead
        - id: ops-cost
          label: Operational & Tech Overhead
          detail: Payroll for ~500 staff across 12 offices plus tech infrastructure and AI development
        - id: net-cash-flow
          label: Net Cash Flow / Burn Gap
          detail: Operating burn necessitating software pivot or equity/debt support
        - id: saas-expansion
          label: FortoLabs SaaS Subscription Flow
          detail: High-margin pure software revenue stream targeted to offset freight working capital drag
      edges:
        - from: shipper-booking
          to: carrier-outflow
          label: Pass-through freight liability
        - from: shipper-booking
          to: gross-spread
          label: 12%-18% buy-sell margin
        - from: gross-spread
          to: ops-cost
          label: Absorption of payroll
        - from: ops-cost
          to: net-cash-flow
          label: EBITDA margin gap
        - from: saas-expansion
          to: net-cash-flow
          label: Software gross margin contribution
    approximationNotes: >-
      Flow relationships illustrate structural working-capital dynamics documented in trans.info and Teardown research;
      exact cash balances are undisclosed.
    claimRefs:
      - CI002
      - CI005
      - CI006
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Multi-tier technology stack spanning customer interfaces, business orchestration microservices, data management,
      and hybrid cloud infrastructure.
    approximationNotes: >-
      Logical architectural representation based on engineering retrospectives, technical leadership disclosures, and
      hiring specifications.
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
    data:
      layers:
        - label: Client Experience & Partner Interfaces
          detail: Ship by Forto web portal, customer ERP/TMS REST APIs, and external logistics partner EDI connectors.
        - label: Workflow & Operational Automation
          detail: Flash automated operations co-pilot and LumoDoc document classification and extraction pipelines.
        - label: Domain Services & Core Microservices
          detail: Decoupled TypeScript and Node.js business services managing booking, customs clearance, and carbon tracking.
        - label: Asynchronous Messaging & Event Bus
          detail: AWS SNS and SQS message queues mediating cross-service domain events and shipment status updates.
        - label: Data Persistence & Operational Storage
          detail: MongoDB primary operational document store and cloud object storage for shipment documentation.
        - label: Hybrid Infrastructure & Container Platform
          detail: >-
            Kubernetes clusters on GCP managed via Helm, CircleCI deployment pipelines, and Mozilla SOPS secrets
            management.
  - id: FU001
    title: Customer workflow and expansion surfaces
    type: journey-map
    summary: >-
      Forto spans the shipment workflow, but the public evidence stops before quantified renewal, retention, and
      expansion outcomes.
    data:
      items:
        - label: Plan
          description: Select route, mode, service level, and timing
          touchpoints:
            - Sea, air, rail, and additional services
            - Logistics guidance from specialists
        - label: Quote
          description: Compare available transport options and rates
          touchpoints:
            - Spot and long-term air-freight rates
            - More than 100 advertised carriers
        - label: Book
          description: Commit shipment and supporting services
          touchpoints:
            - Online booking
            - Customs, carriage, and insurance options
        - label: Coordinate
          description: Centralize supplier communication and shipment documents
          touchpoints:
            - Centralized document access
            - Streamlined communications
        - label: Monitor
          description: Track milestones and act on exceptions
          touchpoints:
            - Shipment tracking and notifications
            - Priority tasks and human support
        - label: Renew and expand
          description: Add modes, lanes, or services after demonstrated value
          touchpoints:
            - Company-reported new-logo and volume growth
            - Public retention and expansion metrics remain unavailable
    approximationNotes: >-
      This is a qualitative workflow map, not a conversion funnel; no stage rates, customer counts, or proportional
      widths are inferred.
    claimRefs:
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: Forto Risk Exposure and Residual Severity Matrix
    type: matrix
    summary: >-
      Evaluation of key operational, commercial, strategic, and financial risks mapped across impact and likelihood
      dimensions.
    approximationNotes: >-
      Likelihood and impact classifications are derived from verified restructuring events, reported M&A exploration,
      carrier dynamics, and maritime updates.
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR007
      - CR010
      - CR011
    data:
      columns:
        - Negligible Impact
        - Minor Impact
        - Moderate Impact
        - Significant Impact
        - Major Impact
        - Critical Impact
      rows:
        - label: Almost Certain (High Frequency)
          values:
            - label: Routine
              detail: Standard seasonal volume adjustments
            - label: Low Priority
              detail: Minor routine documentation variances
            - label: Monitored Risk
              detail: North Sea port terminal bunching delays
            - label: Elevated Risk
              detail: Carrier equipment repositioning imbalances
            - label: Major Threat
              detail: EU ETS per-TEU carbon surcharge pass-through friction
            - label: Critical Threat
              detail: Double Arrival port congestion wave in Singapore/Shanghai
        - label: Likely (Recurring Operating Threat)
          values:
            - label: Negligible
              detail: Minor software UI defects
            - label: Low Priority
              detail: Secondary customs document re-keying delays
            - label: Monitored Risk
              detail: Origin EUR.1 tariff certification friction
            - label: Elevated Risk
              detail: Direct salesforce capacity erosion following cuts
            - label: Major Threat
              detail: Working capital float strain from extended shipper terms
            - label: Critical Threat
              detail: Direct digital forwarder competition from carrier backers
        - label: Possible (Cyclical / Structural Exposure)
          values:
            - label: Negligible
              detail: Single-shipment billing reconciliation inquiries
            - label: Low Priority
              detail: Minor rail transport schedule deviations
            - label: Managed Risk
              detail: Private disclosure opacity on secondary markets
            - label: Elevated Threat
              detail: Resistance to FortoLabs from competing forwarders
            - label: Severe Threat
              detail: Secondary valuation markdown below $2.1B Series D mark
            - label: Catastrophic Threat
              detail: Comprehensive carrier platform disintermediation
