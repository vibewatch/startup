      - number: '5.4'
        title: Technical Differentiation, Infrastructure Dependencies, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Forto's commercial differentiation rests on the union of intuitive digital interfaces, automated document
              extraction, and transparent emissions reporting rather than proprietary physical logistics assets or
              exclusive carrier contracts. In October 2025, Forto established FortoLabs to commercialize its internal
              software tools, including LumoDoc and Flash operational agents, attempting to market its software layer to
              third-party freight forwarders and customs brokers. However, this technology stack carries distinct
              operational and architectural dependencies. The multi-cloud deployment across Google Cloud Platform and
              Amazon Web Services introduces cross-cloud latency and administrative complexity, while historical
              engineering transitions highlight risks of service sprawl. Furthermore, essential enterprise trust
              artifacts, including formal SOC 2 Type II audit reports, public ISO 27001 certificates, shipper-facing
              data processing agreements, and published platform uptime SLAs, are not publicly disclosed, constituting
              an important governance and technical diligence gap for institutional underwriting.
            claimRefs:
              - CE007
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Cloud Architecture and Operational Fragility
            body: >-
              Forto's architectural split between Google Cloud Platform for Kubernetes container orchestration and
              Amazon Web Services for SNS/SQS event messaging creates cross-cloud network dependencies and configuration
              complexity. While containerization and an internal SRE team with Helm and Mozilla SOPS stabilized the
              deployment pipeline, running across disparate cloud environments with undocumented failover procedures
              poses operational resilience risks during regional network disruptions.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and adoption
        blocks:
          - type: paragraph
            body: >-
              Forto's customer surface is broad but only partially measurable. Its current homepage displays 2.5k
              customers, 100+ countries, and 33k shipments operated in 2023, while its LinkedIn profile describes
              leading manufacturers and e-commerce brands among the customer base. The company also advertises 12
              offices and a multimodal service footprint, consistent with a European shipper proposition that combines
              operational forwarding with a digital control layer. However, the current 2.5k display has no stated
              measurement date, active-customer definition, or revenue denominator. It therefore cannot be read as a
              current active-account cohort or compared mechanically with the company's 2020 claim of more than 2,500
              customers. The strongest current directional signal is a Forto commercial executive's Q1 statement that
              volumes and new logos both nearly doubled quarter over quarter, but that post supplies neither absolute
              starting values nor a defined Q1 year in its text.
            claimRefs:
              - CU001
