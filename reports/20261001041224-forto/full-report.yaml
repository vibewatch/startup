        - Signed transaction terms or a later priced financing
    notes: >-
      Company-issued scale metrics are presented as claims, while adverse observations remain attributed to the
      independent analysis that reported them.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
      - CV014
      - CV016
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Verified growth, durable gross margin, positive cash conversion, and recurring software economics
        - >-
          No public range supportable; value only after separating freight pass-through from recurring software
          economics
        - Audited improvement and a later arm's-length financing
        - Software proof remains undisclosed or cash conversion stays negative
      - - Base
        - Forto continues as a scaled digital forwarder without a verified software re-rating
        - No public range supportable; apply a relevant multiple only to audited net revenue or normalized earnings
        - Stable retention, contribution margin, and liquidity
        - Customer contraction, margin compression, or renewed financing pressure
      - - Bear
        - A down-round, structured financing, or strategic sale occurs below the March 2022 mark
        - Equity outcome cannot be calculated without net debt and preference terms
        - Adverse financing terms, continued restructuring, or a discounted transaction
        - New money ranks senior or operating disclosures remain unavailable
    notes: >-
      Scenario labels are analytical cases, not forecasts. Numerical ranges and probabilities are intentionally omitted
      because the assigned sources do not disclose the required current financial and capital-structure inputs.
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV010
      - CV012
      - CV016
figures:
  - id: FO001
    title: Forto Corporate Evolution and Financing Milestones (2016 - 2026)
    type: timeline
    summary: >-
      Chronological trajectory from 2016 inception as FreightHub through hypergrowth financing, market normalization,
      restructuring, and software pivoting.
    data:
      items:
        - label: Company Founded as FreightHub
          date: '2016-05-01'
          detail: >-
            Founded in Berlin by Michael Wax, Erik Muttersbach, Ferry Heilemann, and Fabian Heilemann to digitize
            Asia-Europe freight forwarding.
        - label: Series A Financing ($21.2M)
          date: '2017-12-13'
          detail: Northzone leads Series A financing alongside Cherry Ventures and Global Founders Capital.
        - label: Maersk Strategic Investment
          date: '2019-05-02'
          detail: Maersk Growth joins Series B round, linking Forto to the world's premier ocean container line.
        - label: Forto Rebrand & $50M Growth Round
          date: '2020-11-17'
          detail: >-
            FreightHub rebrands as Forto; raises $50M led by Inven Capital and Iris Capital as Ferry Heilemann departs
            CEO role.
        - label: Unicorn Status via Series C ($240M)
          date: '2021-06-19'
          detail: SoftBank Vision Fund 2 leads $240M Series C round at $1.2B valuation amid pandemic freight rate surge.
        - label: Peak Series D Valuation ($250M at $2.1B)
          date: '2022-03-07'
          detail: Disruptive and A.P. Moller Holding lead $250M Series D round establishing $2.1B valuation benchmark.
        - label: Initial Rate Normalization Headcount Cut
          date: '2023-01-15'
          detail: >-
            Forto cuts approximately 90 employees as pandemic shipping container spot rates collapse back to historical
            baselines.
        - label: Branch Consolidation & Office Closures
          date: '2023-10-15'
          detail: Forto closes regional branches in Bremen and Madrid, trimming 75+ roles to control operational burn.
        - label: CEO Transition & Board Chair Realignment
          date: '2025-02-11'
          detail: >-
            Former CFO Guillaume Petit-Perrin appointed CEO; co-founder Michael Wax transitions to Chairman of the
            Board.
        - label: Sales Force Restructuring & M&A Exploration
          date: '2025-04-08'
          detail: >-
            Forto lays off roughly 200 staff (~33% of workforce) primarily in commercial teams; engages Moelis to assess
            strategic options.
        - label: FortoLabs Commercial AI Launch
          date: '2025-10-20'
          detail: >-
            Forto launches FortoLabs, unbundling internal AI document tools (LumoDoc, Flash agent) for external
            logistics providers.
    approximationNotes: Milestone dates correspond to public press announcements and verified corporate registry filings.
    claimRefs:
      - CO001
      - CO006
      - CO008
      - CO009
      - CO012
