callouts:
  - calloutType: risk
    title: "The Working Capital Trap vs. Scaled Incumbents"
    body: "Venture-backed digital forwarders like Forto face structural liquidity pressure because ocean carriers require rapid payment settlements, while commercial mid-market shippers operate on 30-to-60-day payment cycles. As interest rates normalized and venture equity became scarce, legacy incumbents with fortress balance sheets—such as DSV and Kuehne+Nagel—reasserted their financial dominance, forcing digital challengers to cut operating overhead and reconsider business models."
    claimRefs:
      - CP005
      - CP014
  - calloutType: insight
    title: "Strategic Disintermediation from Carrier Investors"
    body: "While carrier investments from partners such as Maersk provided early capital and commercial validation for Forto, carriers have increasingly built direct digital quote-and-book platforms. This dual role creates long-term structural conflict, as carriers seek to disintermediate third-party forwarders while holding visibility into digital booking flows."
    claimRefs:
      - CP004
      - CP010
