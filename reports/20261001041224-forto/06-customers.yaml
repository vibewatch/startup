schemaVersion: "report-v2"
artifact: customers
slug: forto
runDate: 2026-10-01
company:
  name: Forto
chapter:
  number: 6
  title: Customers
  summary: >-
    Forto shows broad shipper reach through a displayed 2.5k-customer base, 33k
    shipments operated in 2023, and named historical users including Viessmann,
    Miele, and Home24. The evidence supports real adoption but not durability:
    current NRR, GRR, churn, renewal, cohort, contract-length, and concentration
    data remain undisclosed, while the freshest growth signal is a company
    executive's denominator-free claim that Q1 volumes and new logos nearly
    doubled quarter over quarter.
sections:
  - id: customer-base-and-adoption
    title: Customer base and adoption
    body: >-
      Forto's customer surface is broad but only partially measurable. Its
      current homepage displays 2.5k customers, 100+ countries, and 33k
      shipments operated in 2023, while its LinkedIn profile describes leading
      manufacturers and e-commerce brands among the customer base. The company
      also advertises 12 offices and a multimodal service footprint, consistent
      with a European shipper proposition that combines operational forwarding
      with a digital control layer. However, the current 2.5k display has no
      stated measurement date, active-customer definition, or revenue
      denominator. It therefore cannot be read as a current active-account
      cohort or compared mechanically with the company's 2020 claim of more
      than 2,500 customers. The strongest current directional signal is a Forto
      commercial executive's Q1 statement that volumes and new logos both
      nearly doubled quarter over quarter, but that post supplies neither
      absolute starting values nor a defined Q1 year in its text.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU009]
    tableRefs: [TU001, TU002]
  - id: named-proof-and-outcomes
    title: Named proof and outcomes
    body: >-
      The clearest named-customer evidence is company-issued and historical. A
      Forto release identifies industrial manufacturer Viessmann, consumer
      goods company Miele, and e-commerce brand Home24 as users of its supply
      chain management solutions. The same release says customers typically
      reduced administrative supply-chain costs by 30%, but it does not assign
      that result to any one of the three named accounts, disclose the
      measurement method, or distinguish production deployments from pilots.
      Forto's current homepage adds a testimonial around its digital and
      sustainable offering and presents an 80% ocean-transport emissions
      reduction via second-generation biofuels, yet the fetched page does not
      identify that testimonial's customer by company name. These records show
      use cases and claimed outcomes, not independently verified renewal or
      retention performance.
    claimRefs: [CU006, CU007, CU008, CU012]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Forto's workflow can support expansion: customers can quote, compare,
      book, track, manage documents, and receive priority tasks in one platform,
      while air-freight buyers can access spot and long-term rates from more
      than 100 carriers. That breadth creates plausible cross-sell paths across
      modes and services, but the assigned evidence does not disclose NRR, GRR,
      churn, renewal rates, contract duration, cohort behavior, or customer
      satisfaction. An independent teardown also reports that roughly 200
      people were laid off in April 2025, disproportionately from sales, which
      raises a service-coverage and account-expansion diligence question rather
      than proving customer loss. Historical segmentation reported by the same
      source says customers shipping more than 500 containers annually drove
      over 90% of revenue, but that old mix is not a current top-customer
      concentration measure. Forto's historical funding scale can support a
      long operating runway only if cash remains available; the cited funding
      record does not reveal current cash or customer economics.
    claimRefs: [CU010, CU011, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and evidence quality
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Strategic value
      - Diligence gap
    rows:
      - - Large European manufacturers
        - Logistics and procurement leaders; supply-chain teams use the platform
        - Multimodal forwarding, visibility, documents, and emissions choices
        - Viessmann and Miele were named in a 2020 company release
        - Historically associated with larger container volumes and service attachment
        - Current spend, production status, renewal history, and account concentration are undisclosed
      - - E-commerce brands
        - Operations and logistics leaders; supply-chain teams use the platform
        - Import forwarding, booking, tracking, and supplier coordination
        - Home24 was named; Forto also describes e-commerce brands within 2.5k customers
        - Digital workflow may reduce coordination effort for frequent importers
        - No current active-brand count, cohort retention, or customer-specific outcome
      - - Air-freight shippers
        - Logistics teams select service level and carrier capacity
        - Premium, standard, deferred, charter, customs, carriage, and insurance options
        - Rates from 100+ carriers and service to 100+ destinations are advertised
        - Cross-sell potential where speed, capacity, and customs needs vary
        - No disclosed air-customer count, utilization, repeat rate, or mode-level revenue
      - - Multimodal mid-market shippers
        - Supply-chain leaders buy forwarding; operating teams use workflow and reporting
        - Quote, book, track, manage documents, and respond to exceptions
        - Current site displays 2.5k customers and 33k shipments in 2023
        - Platform breadth may deepen workflow integration across shipments
        - Customer definition, current shipment volume, contract length, and payer mix are absent
    notes: >-
      Segments synthesize company-issued pages and historical third-party
      reporting; public scale signals use different vintages and denominators,
      and null metrics should not be inferred from the descriptive rows.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU010, CU014]
  - id: TU002
    title: Public customer adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period / page vintage
      - Source posture
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customers
        - More than 2,500
        - Company release describing 2020 financing and operations
        - Company-issued
        - Medium
        - Establishes historical adoption at material scale
        - Active definition, customer revenue, and retention cohort
      - - Shipments operated on platform
        - 33,000
        - "2023"
        - Company-issued
        - Medium
        - Demonstrates transaction throughput in a stated year
        - Unique customers, shipment mix, repeat rate, and revenue per shipment
      - - Customers displayed
        - 2,500
        - Current homepage accessed 2026-10-01; measurement date unstated
        - Company-issued
        - Low
        - Current marketing surface still presents a large installed base
        - Snapshot date, active definition, additions, losses, and duplicates
      - - Q1 volumes and new logos
        - Both nearly doubled quarter over quarter
        - Executive post published 2026-04-30; Q1 year not stated in the post text
        - Company executive
        - Low
        - Suggests recent acquisition and volume momentum
        - Baseline values, exact periods, retained logos, revenue, and gross margin
    notes: >-
      Values are reported, not audited, and are intentionally not converted
      into a growth series because periods, customer definitions, and
      denominators are not comparable.
    claimRefs: [CU001, CU003, CU005, CU009, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - Viessmann
        - Industrial manufacturer
        - Forto supply-chain management solutions
        - In use per company release; production status not specified
        - No customer-specific outcome disclosed
        - Company-issued 2020 evidence with no independent renewal confirmation
      - - Miele
        - Consumer goods
        - Forto supply-chain management solutions
        - In use per company release; production status not specified
        - No customer-specific outcome disclosed
        - Company-issued 2020 evidence with no independent renewal confirmation
      - - Home24
        - E-commerce
        - Forto supply-chain management solutions
        - In use per company release; production status not specified
        - No customer-specific outcome disclosed
        - Company-issued 2020 evidence with no independent renewal confirmation
    notes: >-
      The company release says customers typically reduced administrative
      supply-chain costs by 30%, but the result is not attributed to an
      individual named customer and has no disclosed methodology.
    enumerationScope:
      coverage: sample
      basis: >-
        Named customers explicitly present in the successful prefetched
        evidence allocated to this chapter, not Forto's full customer base.
    claimRefs: [CU005, CU006, CU007, CU012]
figures:
  - id: FU001
    title: Customer workflow and expansion surfaces
    type: journey-map
    summary: >-
      Forto spans the shipment workflow, but the public evidence stops before
      quantified renewal, retention, and expansion outcomes.
    data:
      items:
        - label: Plan
          description: Select route, mode, service level, and timing
          touchpoints:
            - Sea, air, rail, and additional services
            - Logistics guidance from specialists
        - label: Quote
          description: Compare available transport options and rates
          touchpoints:
            - Spot and long-term air-freight rates
            - More than 100 advertised carriers
        - label: Book
          description: Commit shipment and supporting services
          touchpoints:
            - Online booking
            - Customs, carriage, and insurance options
        - label: Coordinate
          description: Centralize supplier communication and shipment documents
          touchpoints:
            - Centralized document access
            - Streamlined communications
        - label: Monitor
          description: Track milestones and act on exceptions
          touchpoints:
            - Shipment tracking and notifications
            - Priority tasks and human support
        - label: Renew and expand
          description: Add modes, lanes, or services after demonstrated value
          touchpoints:
            - Company-reported new-logo and volume growth
            - Public retention and expansion metrics remain unavailable
    approximationNotes: >-
      This is a qualitative workflow map, not a conversion funnel; no stage
      rates, customer counts, or proportional widths are inferred.
    claimRefs: [CU009, CU010, CU011]
callouts:
  - calloutType: strength
    title: Real adoption, not just a logo wall
    body: >-
      A stated 33k shipments operated in 2023 and named historical users provide
      stronger adoption evidence than undifferentiated logos alone, although
      both remain company-issued.
    claimRefs: [CU003, CU006]
  - calloutType: risk
    title: Durability is the core customer diligence gap
    body: >-
      No assigned source discloses NRR, GRR, churn, renewal, contract length,
      current cohorts, or top-customer concentration; historical financing and
      aggregate counts do not close that gap.
    claimRefs: [CU012, CU014, CU016]
