  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-retention
      missingEvidence: >-
        Current NRR, GRR, gross churn, logo churn, renewal rates, contract
        duration, customer cohorts, and satisfaction measures.
      whyItMatters: >-
        Aggregate customer and shipment counts do not establish durable revenue
        or successful renewal behavior.
      diligencePath: >-
        Obtain board-grade cohort exports and contract-level renewal schedules,
        then reconcile them to invoiced revenue and lost-account reasons.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Current top-1, top-5, and top-10 customer shares by gross revenue, net
        revenue, gross profit, shipment count, and mode.
      whyItMatters: >-
        Historical segment mix cannot quantify present exposure to a small
        number of large shippers or procurement events.
      diligencePath: >-
        Review anonymized customer-level revenue and gross-profit concentration
        for 2024, 2025, and trailing twelve months through September 2026.
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU001]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        A current complete customer-reference list showing production status,
        start date, modes used, contract value, outcomes, and renewal status.
      whyItMatters: >-
        Three company-named historical users cannot establish the quality,
        freshness, or breadth of current production deployments.
      diligencePath: >-
        Select references across manufacturing, consumer goods, and e-commerce
        and conduct buyer-led calls using contract and invoice corroboration.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: customer-count
      missingEvidence: >-
        A dated reconciliation of the displayed 2.5k customers to active,
        paying, and transacting accounts.
      whyItMatters: >-
        The current display cannot be compared with the 2020 count or used to
        calculate additions, losses, utilization, or revenue per customer.
      diligencePath: >-
        Request monthly active and paying customer bridges from January 2020
        through September 2026 with consistent definitions.
      relatedQuestionRefs: [QU002, QU009]
      relatedTableRefs: [TU002]
