callouts:
  - calloutType: "risk"
    title: "Working-Capital Deficit and Freight Forwarding Balance Sheet Drag"
    body: "Because digital freight forwarders must satisfy carrier capacity commitments on short payment cycles while granting commercial clients 30 to 60 days of credit, working capital scales directly with top-line freight volume. In an era of elevated interest rates and normalized freight tariffs, this structural working capital float represents a persistent cash burn risk unless offset by positive operating cash flows or bank credit facilities."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI008"
  - calloutType: "insight"
    title: "FortoLabs Pivot as Strategic Response to Forwarding Valuation Multiple Compression"
    body: "Forto's launch of FortoLabs and its unbundled LumoDoc document extraction tool represents an explicit corporate pivot to capture software-like valuation multiples (7x–12x ARR) and high gross margins. However, selling operational tools to peer freight forwarders faces acute channel conflict, as competitors hesitate to license core operational software from an active logistics rival."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI016"
