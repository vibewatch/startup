callouts:
  - calloutType: recommendation
    title: "Verdict: Stretched Valuation — Research-More Stance"
    body: >-
      AI²'s $1.4 billion February 2026 valuation is peer-median but unanchored by financial disclosure.
      The recommended stance is RESEARCH_MORE: do not invest at current terms without data-room access
      resolving at least three of the five diligence asks (revenue/margin, HKC delivery milestones, cap
      table, GOVLA audit, customer pipeline). Revisit favorably if valuation compresses to below $1.0B
      or if Series C is priced with revenue disclosure enabling conventional multiple analysis.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV034
      - CV041

  - calloutType: risk
    title: "Adverse Signal: VLA Training Data Scarcity and Physical Intelligence Frontier Threat"
    body: >-
      CB Insights' June 2026 analysis of the YC Winter 2026 cohort identifies physical AI training data
      scarcity as the primary systemic bottleneck for humanoid robot deployment. This is not an AI²-
      specific risk — it affects Physical Intelligence, AgiBot, and every VLA-based competitor — but it
      directly undermines the timeline assumptions embedded in the bull case and the durability of GOVLA
      as a moat, since the moat depends on proprietary embodied data accumulation in production environments
      that have not yet been confirmed at scale.
    claimRefs:
      - CV027
      - CV031
      - CV044

  - calloutType: assumption
    title: "Key Assumption: HKC Order Value Used as Revenue Proxy"
    body: >-
      The entire valuation analysis uses the HKC 1,000-unit, three-year purchase order as the sole
      revenue proxy for AI². The assumed ASP range (RMB 200K–500K per unit) is analyst-estimated based
      on peer pricing data and has not been confirmed by AI² or HKC. Any material difference in ASP,
      delivery timing, or revenue recognition would directly alter all multiples calculations above.
    claimRefs:
      - CV003
      - CV008
      - CV050

