chapter:
  number: 8
  title: Valuation
  summary: >-
    AI² Robotics' February 2026 post-Series B valuation of ~USD 1.4 billion (CNY 10 billion+) sits at the median
    of its February 2026 unicorn cohort but is built almost entirely on forward promise rather than disclosed
    financial performance: the company has published no revenue, ARR, gross margin, or unit economics, and its
    only binding multi-year commercial contract is the HKC 1,000-unit order implying an order-value multiple of
    60–150x annualized, well above the 2–6x revenue multiples commanded by public automation comparables.
    Against private-market comps (Figure AI ~$2.6B, Physical Intelligence ~$2.4B), AI²'s entry price looks
    median-reasonable for the sector but requires near-perfect execution and near-term revenue transparency to
    hold; the verdict is STRETCHED with a RESEARCH_MORE recommendation pending five key diligence asks.

sections:
  - id: s1
    title: "Valuation Context and Round Architecture"
    body: >-
      AI² Robotics closed its Series B in February 2026, raising more than RMB 1 billion (approximately
      USD 145 million) across a cluster of tranches. Two independent sources — Crunchbase's February 2026
      unicorn cohort report and Yicai Global's contemporaneous coverage — establish a post-money valuation
      of USD 1.4 billion and CNY 10 billion-plus respectively; the modest discrepancy reflects differing
      USD/CNY rate assumptions rather than a substantive disagreement on enterprise value. At the round-level,
      Baidu Venture led as strategic investor, joined by CRRC Capital (the first state-owned heavy-industry
      vehicle to enter Chinese humanoid robotics), Guotai Haitong Securities, Yusys Technologies (STAR
      market, 688317), Cedarlake Capital, Sentury Tire, and an unnamed Tesla supply-chain enterprise.
      The February 2026 round was the final tranche in a twelve-round, approximately twelve-month
      fundraising campaign that included seven tranches in H1 2025; this cadence is atypical and suggests
      either high capital burn or a structured capital-draw facility, both of which imply a complex
      preference stack and unknown dilution overhang. Total lifetime capital raised is estimated at more
      than RMB 2 billion (approximately USD 290 million) based on the company's own twelve-round
      disclosure, but no individual pre-Series B round size has been publicly confirmed. The absence of
      any revenue disclosure, ARR figure, or unit economics statement means this valuation cannot be
      anchored in conventional financial multiples; instead it rests on the quality of the investor
      syndicate, the HKC 1,000-unit binding purchase order, and the AI² robotics market narrative.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
