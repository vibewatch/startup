  - id: s2
    title: "Comparable Valuation Analysis — Private and Public Benchmarks"
    body: >-
      Contextualizing AI²'s USD 1.4 billion entry price requires two lenses: private-market analogues
      among humanoid and embodied-AI robotics companies, and public-market multiples from established
      industrial automation and robotics firms. On the private side, the most directly comparable
      Western companies have raised at valuations that span a wide range. Figure AI secured USD 675 million
      in February 2024 at an implied valuation of approximately USD 2.6 billion — roughly 1.9x AI²'s
      current mark — despite also having no publicly disclosed revenue at the time of that round.
      Physical Intelligence (pi.website), whose π0.7 generalist policy model published in April 2026
      represents the current frontier for VLA-based manipulation, raised USD 400 million in late 2024
      at an estimated valuation of approximately USD 2.4 billion; the PI blog confirms an active
      commercial partnership ramp through "The Physical Intelligence Layer" (February 2026 post) without
      disclosing revenue figures. Apptronik raised approximately USD 350 million in a Series A in 2025
      targeting humanoid robot deployment in manufacturing; 1X Technologies has raised more than
      USD 135 million total. On the public side, industrial automation and robotics comparables — ABB
      (~2.2x trailing revenue), Teradyne (~3.5x), Cognex (~6x), Symbotic (~3.5x), and Rockwell
      Automation (~3x, world's largest pure-play industrial automation company per its own IR materials)
      — trade at revenue multiples in the 2–6x range. Since AI² has no disclosed revenue, applying these
      multiples requires projecting forward revenue from the HKC order. The HKC 1,000-unit, three-year
      contract at an estimated ASP of RMB 200,000–500,000 implies annualized revenue of RMB 67–167 million,
      placing the USD 1.4 billion valuation at 60–150x annualized order value — a deep growth-stage
      premium that demands rapid expansion of the order book to remain defensible. CB Insights' June 2026
      manufacturing robotics market map identifies 116 startups across 14 market segments, confirming
      intense sector crowding that compresses the probability of above-cohort valuation premium at Series C.
