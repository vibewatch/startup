  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - AI² Moat Claim
      - Supporting Evidence
      - Primary Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Proprietary GOVLA / Alpha Brain VLA model
        - Company-reported 30% task success advantage over PI π₀; FIS-VLA open-sourced; LeCun endorsement
        - AgiBot deploying equivalent VLA depth (WorkGPT/GO-1/GE-1) with stronger hardware (NVIDIA Thor T5000)
        - High
        - Obtain third-party independent benchmark replication; compare task categories and datasets
      - - Enterprise customer relationships (HKC, Dongfeng, Huaxin, JingNeng)
        - HKC 1,000-unit order cited as largest non-showcase order in China; four named customers
        - Unitree and AgiBot both signing industrial deployments at comparable or larger scale
        - Medium
        - Verify contract terms, exclusivity, renewal clauses, and customer satisfaction evidence
      - - Full-size industrial form factor (1,800 mm)
        - AlphaBot 2 hardware matched to human workstation heights and load-bearing needs
        - AgiBot A2 (175 cm) and UBTECH Walker S also full-size; form factor alone is not differentiating
        - Low
        - Identify specific workstation or task types where 1,800 mm confers measurable advantage
      - - Manufacturing scale-up to 10,000 units/year by end-2026
        - Current confirmed capacity 1,000 units/year; company target of 10k stated publicly
        - Unitree's price point implies existing high-volume manufacturing infrastructure well beyond 1k/yr
        - High
        - Request production audit, supplier agreements, and evidence of ramp milestones
      - - Strategic investor base (CRRC Capital, Baidu Venture)
        - CRRC Capital (state-owned heavy industry) provides institutional credibility and access
        - Competing companies backed by equally strategic or larger investors; not exclusive
        - Low
        - Assess whether CRRC or Baidu actively introduce customers or supply-chain partners
      - - Open-source FIS-VLA brand recognition
        - Yann LeCun (Meta Chief AI Scientist) public endorsement; GitHub open-source activity
        - AgiBot also has open-source X1 platform and AgiBot World challenge; developer mindshare not exclusive
        - Medium
        - Track developer adoption metrics and citation/pull-request activity over time
    notes: >
      Severity ratings (High/Medium/Low) are assessor judgment based on available public evidence;
      they reflect relative risk to AI²'s moat durability, not absolute probability of failure.
      Claims are based on company disclosures and news coverage; independent verification of
      deployment scale, customer satisfaction, and production ramp is not available in the public domain.
