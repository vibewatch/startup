company:
  name: AI² Robotics
chapter:
  number: 3
  title: Competitors
  summary: >
    AI² Robotics enters a crowded Chinese humanoid robot market where Unitree Robotics and AgiBot
    together command an estimated 80% of domestic unit shipments as of April 2026 per TrendForce,
    leaving AI² competing for a fragmented residual. Unitree leads on manufacturing scale and price
    aggression (G1 from ~$16,000), while AgiBot matches AI² on AI depth (WorkGPT/GO-1/GE-1 stack,
    NVIDIA Jetson Thor T5000 at 2,070 TFLOPS) and outflanks it with five product platforms publicly
    targeting RMB 10 billion in revenue by 2027. Western peers set the global capability ceiling but
    do not currently compete in China's domestic enterprise market. AI²'s GOVLA/Alpha Brain VLA model
    and early enterprise deployments are real but fragile moats — the benchmark is self-reported, and
    the CEO acknowledged in February 2026 that the industry shake-out has already begun.

sections:
  - id: s1
    title: Chinese Direct Competitor Landscape
    body: >
      China's humanoid robot field in 2026 is dominated by Unitree Robotics and AgiBot (Zhiyuan
      Robotics, 智元机器人), which together account for approximately 80% of domestic humanoid robot
      unit shipments according to TrendForce's April 2026 forecast. Unitree Robotics, founded in 2016
      and headquartered in Hangzhou, built its position through aggressive hardware commoditization:
      the G1 humanoid (132 cm, approximately 35 kg, 23–43 DOF depending on configuration) is
      marketed at approximately $16,000 starting price, making it the most affordably priced
      full-capability humanoid globally. The H1 and H1-2 models extend into more demanding industrial
      scenarios (H1 at ~180 cm, ~47 kg, 3.3 m/s walking speed; H1-2 at ~178 cm, ~70 kg, 27 DOF).
      Unitree also filed for a domestic IPO, launched the UniStore app-ecosystem platform marketed
      as the world's first humanoid robot app store, and released a dual-arm upper-body R1 unit
      starting at $3,930 to address lower-cost manipulation use cases. AgiBot (Zhiyuan Robotics)
      was founded in 2023 in Shanghai and takes the opposite approach: deep AI architecture investment
      across five product platforms. The A2 full-size humanoid (175 cm, 55 kg, 49+ DOF, 200 TOPS AI
      compute, 350 N.m peak joint torque, 7 km/h walk speed) and the industrial G2 (powered by NVIDIA
      Jetson Thor T5000 delivering 2,070 TFLOPS on-board, with the in-house WorkGPT mission model and
      GO-1/GE-1 task/world execution models) represent the most computationally intensive humanoid
      platforms in China. AgiBot publicly targets over RMB 10 billion (approximately USD 1.46 billion)
      in revenue by 2027 and deployed its Real-World Reinforcement Learning system at Longcheer
      Technology's consumer electronics manufacturing line. UBTECH Robotics (优必选), the sector's
      longest-established domestic player and the only one publicly listed (HKEX: 9880), deployed its
      Walker S2 industrial humanoid in manufacturing in partnership with Hitachi, and launched a
      consumer brand (Uworld) signaling diversification. Galbot (银河通用机器人) and Galaxea AI are
      earlier-stage domestic startups whose commercial deployments remain limited and unverified in the
      public record.
