  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unitree-ipo-prospectus
      missingEvidence: >
        Unitree's IPO prospectus or pre-IPO financial filing has not been published as of the run
        date; no public data exists on Unitree's revenue, gross margin, unit economics, or confirmed
        production capacity.
      whyItMatters: >
        Unitree's IPO filing would reveal production volumes, pricing economics, customer concentration,
        and margin structure that directly inform the competitive threat it poses to AI². Without it,
        competitive benchmarking on financial and operational dimensions is impossible.
      diligencePath: >
        Monitor CSRC/SSE public disclosure database for Unitree prospectus filing; request
        information via investor relations if any pre-IPO investor roadshow materials are shared
        with sophisticated investors.
      relatedQuestionRefs:
        - QP020

    - type: missing-source
      severity: material
      topic: ai2-alphabot2-pricing
      missingEvidence: >
        AI² AlphaBot 2 commercial list price is not publicly disclosed; no enterprise buyer or
        analyst report has published a confirmed or estimated ASP.
      whyItMatters: >
        Without pricing disclosure, ROI comparison against Unitree G1 (~$16k) and human-labor
        alternatives is impossible for enterprise buyers and for competitive analysis. Pricing opacity
        also prevents margin and cost-structure assessment.
      diligencePath: >
        Request pricing schedule from AI² investor relations or commercial team; survey current
        and prospective enterprise customers under NDA for realized pricing data.
      relatedQuestionRefs:
        - QP005

    - type: missing-source
      severity: material
      topic: govla-independent-benchmark
      missingEvidence: >
        No independent third-party benchmark replicating AI²'s claim that GOVLA/Alpha Brain achieves
        30% higher task success rate than Physical Intelligence's π₀ is publicly available; AgiBot's
        GO-1/GE-1 has not been independently compared to GOVLA either.
      whyItMatters: >
        The AI model moat is AI²'s primary differentiation claim against AgiBot and the deepest moat
        it possesses relative to Western peers; if the benchmark is overstated or not reproducible,
        the entire differentiation thesis weakens materially.
      diligencePath: >
        Commission independent robotics research lab to conduct standardized manipulation benchmarks
        (e.g., using RoboSuite or LIBERO benchmarks) across AI², AgiBot, and PI platforms on
        identical task suites in controlled conditions.
      relatedQuestionRefs:
        - QP011

    - type: missing-source
      severity: material
      topic: agibot-production-capacity
      missingEvidence: >
        AgiBot's confirmed annual production capacity in 2026 is not disclosed in public sources;
        revenue target of $1.46B by 2027 implies tens of thousands of robots but no production
        ramp evidence is independently verified.
      whyItMatters: >
        Production capacity determines whether AgiBot can sustain its market share leadership and
        execute its revenue target; it also informs whether AI²'s 10,000 units/year target is
        competitive or still well behind AgiBot's operational scale.
      diligencePath: >
        Request AgiBot operational data via secondary market research or partner channel contacts;
        monitor quarterly press releases for production milestone announcements.
      relatedQuestionRefs:
        - QP008

