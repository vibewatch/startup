  researchQuestions:
    - id: QP001
      question: >
        Which direct domestic competitors are actively targeting the same Chinese enterprise humanoid
        robot customers as AI² Robotics in 2026, and what is each company's current commercial status?
      type: enumeration
      targets:
        - "contentRequirements/0"
        - "plannedTables/competitor-profile-table"
      status: answered

    - id: QP002
      question: >
        What substitute automation solutions are available to Chinese enterprise buyers instead of
        humanoid robots, and how do they compare on cost, reliability, and ROI?
      type: enumeration
      targets:
        - "contentRequirements/0"
        - "plannedTables/feature-capability-matrix"
      status: answered

    - id: QP003
      question: >
