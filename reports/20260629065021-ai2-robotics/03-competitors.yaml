callouts:
  - calloutType: risk
    title: Unitree + AgiBot Duopoly Squeezes AI² into <20% Residual
    body: >
      TrendForce's April 2026 forecast places Unitree and AgiBot at approximately 80% of Chinese
      humanoid robot unit shipments, leaving AI² and all other competitors fighting for at most 20%
      of a still-small market. Unitree's mass-production scale and $16,000 G1 pricing create a floor
      that AI² — with 1,000 units/year capacity and undisclosed pricing — cannot currently match on
      cost. AgiBot's five-platform portfolio and VLA AI depth effectively mirrors AI²'s strongest
      differentiation claims. The CEO's own public statement acknowledging the "shake-out" underscores
      that survival in the sub-20% segment requires a clear wedge that neither pure hardware nor pure
      AI differentiation alone may sustain.
    claimRefs:
      - CP027
      - CP028
      - CP029
      - CP030
      - CP034

  - calloutType: insight
    title: Unitree UniStore App Ecosystem Is a Long-Horizon Threat to AI²'s Platform Layer
    body: >
      Unitree's launch of UniStore — described as the world's first humanoid robot app store —
      signals an intent to own the software and application distribution layer, not just the hardware.
      If third-party developers build applications for Unitree's ecosystem, the switching cost for
      enterprise buyers moves from hardware to software, disadvantaging AI² unless it builds a
      comparable developer ecosystem. AI²'s open-sourcing of FIS-VLA provides some developer
      credibility but does not constitute a deployed application platform. This dynamic mirrors the
      mobile-handset market transition from hardware differentiation to platform lock-in; whether
      it materializes in humanoid robotics depends on software maturity and enterprise deployment
      scale, both of which remain unproven as of mid-2026.
    claimRefs:
      - CP007
      - CP040
      - CP041

  - calloutType: strength
    title: "AI² Open-Source FIS-VLA Provides Developer Credibility and Differentiation Signal"
    body: >
      AI²'s decision to open-source FIS-VLA on GitHub and Yann LeCun's public endorsement provide
      a visible differentiation signal within the global AI/robotics research community. This is a
      moat competitor companies cannot easily replicate without equivalent model quality and
      transparency — UBTECH and traditional industrial players have no comparable open-source VLA
      contribution. The endorsement from Meta's Chief AI Scientist also validates the technical
      architecture in a way that marketing claims cannot, potentially accelerating enterprise
      procurement trust. The durability of this moat depends on AI² maintaining research-quality
      VLA output and an active developer community, neither of which can be confirmed from public data.
    claimRefs:
      - CP041
      - CP043

