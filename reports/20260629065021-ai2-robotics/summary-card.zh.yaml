  topStrengths:
    - AI² 把自研具身 AI 栈和全栈机器人硬件配在一起，并已把 AlphaBot 2 的连贯产品叙事推入真实企业场景。
    - 投资人既有 Baidu Venture、CRRC Capital 等战略 AI 和产业资本；在中国机器人放量阶段，这类支持可能比纯财务投资人更关键。
    - HKC 三年 1,000 台订单提供的商业化证据，强于多数早期 humanoid 同行公开展示的水平。
  topRisks:
    - 商业集中度极高：HKC 似乎是唯一公开确认的约束性多年合同，其他具名客户仍是合作协议或试点。
    - 没有公开收入、利润率或现金消耗披露，$1.4B 估值无法锚定在审计经营表现或 unit economics 上。
    - 产品栈依赖快速量产爬坡、VLA 可靠性和进口算力部件，而市场已经在向规模更大的中国竞争者集中。
  unresolvedGaps:
    - 审计收入、毛利率、现金消耗和 backlog 转化数据仍未披露。
    - HKC 订单的客户验收标准、付款条款和实际经济性没有公开。
    - 创始人 / CEO 郭彦东之外的管理层厚度，以及 Series B 后的详细股权结构表，均未公开披露。
