callouts:
  - calloutType: strength
    title: GOVLA Dual-System Architecture Is a Genuine Technical Moat
    body: >-
      The Slow-Fast dual-system design, combined with whole-body output and DeepSeek reasoning
      integration, sets GOVLA apart from single-policy VLA implementations. The June 2025
      FiS-VLA outperformance of π0 by 30%—endorsed by Yann LeCun—provides credible evidence
      that the architecture delivers above-average results. The data-business flywheel built on
      a 1,000-GPU cluster creates a compounding data moat as commercial deployments scale.
    claimRefs: [CE013, CE014, CE015, CE018, CE020, CE021]

  - calloutType: risk
    title: NVIDIA Dependency and Zero Public Code Repositories Are Structural Risks
    body: >-
      AlphaBot 2's entire inference stack depends on a single NVIDIA Orin AGX 64GB module,
      making US export restrictions a first-order supply-chain risk. Simultaneously, GitHub
      shows zero public repositories for ai2robotics, meaning the developer ecosystem is nearly
      invisible, third-party reproducibility of GOVLA claims is limited, and open-source
      community leverage — a key competitive weapon for AgiBot and LeRobot-style platforms —
      is absent.
    claimRefs: [CE032, CE033, CE003, CE016]

  - calloutType: risk
    title: CEO Self-Assessment Implies Consumer Timeline and Market-Size Risk
    body: >-
      The CEO's February 2026 op-ed stating that the consumer robot market "is not yet mature
      or realistic" and needs another five years is the clearest available signal about the
      company's own confidence in near-term total addressable market expansion. While industrial
      deployments are proceeding, the industrial B2B market for humanoid robots in China is
      contested by Unitree, AgiBot, Fourier, and dozens of peers — all pursuing the same limited
      set of TMF (time, money, flexibility) manufacturing accounts.
    claimRefs: [CE034, CE035]

