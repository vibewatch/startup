figures:
  - id: FE001
    title: GOVLA / Alpha Brain Software Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Layered view of the Alpha Brain embodied AI system from physical sensing through foundation model
      inference to whole-body control output on AlphaBot 2.
    data:
      layers:
        - label: "Sensor Layer"
          detail: >-
            4× RealSense D435 RGB-D (head/chest/back) + 2× D405 wrist cameras;
            linear MIC array (4-channel); interactive display screen
        - label: "Spatial Interaction Foundation Model"
          detail: >-
            3D scene understanding from multi-camera RGBD streams; builds intrinsic
            world model of objects, distances, and environment dynamics
        - label: "Slow System — System 2"
          detail: >-
            Long-horizon task reasoning and decomposition; natural language
            instruction parsing; DeepSeek-enhanced planning; outputs task plans
            and language responses to users
        - label: "Fast System — System 1"
          detail: >-
            Real-time whole-body joint trajectory generation; chassis locomotion
            planning; fuses System 2 plan with live sensor feedback at control-
            loop frequency; outputs full 22-DOF commands plus chassis speed/heading
        - label: "AlphaBotCore SDK / Control Interface"
          detail: >-
            Python / C / C++ APIs; Ethernet / RS485 / CAN bus; drag-teach API;
            end-effector aviation connector (RS485_A/B, DIO, power); HDMI/USB debug
        - label: "NVIDIA Orin AGX 64GB Compute"
          detail: >-
            2048-core Ampere GPU, 12-core ARM CPU, 2× NVDLA v2, 275 TOPS AI,
            64 GB LPDDR5 @ 204.8 GB/s; on-device local inference; no cloud required
    approximationNotes: >-
      Architecture topology inferred from official documentation and press descriptions;
      exact inter-layer communication protocols are proprietary and not publicly documented.
    claimRefs: [CE012, CE013, CE014, CE015, CE022, CE023]

