company:
  name: AI² Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    AI² Robotics' AlphaBot 2 is a wheeled dual-arm humanoid robot (22 DOF, 1,800 mm, 135 kg) powered by the
    GOVLA / Alpha Brain embodied foundation model — a proprietary three-part architecture (Spatial Foundation
    Model plus dual Slow/Fast systems) that generates full whole-body control and locomotion trajectories, not
    just arm actions. The open-source FiS-VLA (GOVLA 0.5, June 2025) outperformed Physical Intelligence's π0
    by 30%; GOVLA 1.0 is under active development. Hardware is well-specified for industrial use but the
    wheeled chassis caps terrain adaptability, GitHub shows zero public repositories, consumer deployment
    remains 5+ years away by the CEO's own admission, and third-party safety certification evidence is absent.

sections:
  - id: s1
    title: Product Definition and Module Map
    body: >-
      AI² Robotics markets the AlphaBot series as the fourth generation of intelligent terminal after
      smartphones and smart vehicles. The current shipping SKU, AlphaBot 2, is a wheeled dual-arm humanoid
      designed for productivity in controlled industrial and public-service environments. Unlike a fully
      bipedal form factor, the two-wheel differential drive chassis trades stair-climbing ability for
      operational stability, lower manufacturing complexity, and speed up to 1.5 m/s on flat floors
      (0°–5° slope tolerance). The robot integrates four Intel RealSense D435 RGB-D cameras for full-surround
      perception and two wrist-mounted D405 cameras for close-range hand-eye guidance. Its embodied AI layer,
      branded Alpha Brain, runs locally on the robot via an NVIDIA Orin AGX 64GB module, eliminating
      dependence on cloud connectivity and protecting customer data. The product line currently comprises
      the robot itself, the Alpha Brain model, the AlphaBotCore SDK, and two teleoperation peripherals
      (VR and exoskeleton). Target verticals are automotive manufacturing, semiconductor fabs, biotech/pharma
      clean rooms, and public-service venues such as airports. Planned expansion into consumer households
      was explicitly deferred by management to approximately 2031.
    claimRefs: [CE001, CE002, CE003, CE009, CE022, CE030, CE035]
    tableRefs: [TE001, TE002]

  - id: s2
    title: GOVLA Architecture and Alpha Brain Software Stack
    body: >-
      Alpha Brain is the product brand for AI² Robotics' proprietary embodied foundation model, with the
      underlying model architecture named GOVLA (Global & Omni-body Vision-Language-Action). GOVLA's
      defining novelty is outputting complete whole-body kinematic control plus locomotion trajectories
      rather than only arm-endpoint actions as prior VLA models do. The architecture has three coupled
      components. First, a Spatial Interaction Foundation Model encodes real-time 3D object positions,
      spatial relationships, and environmental dynamics into a world-model representation. Second, a Slow
      System (System 2) handles complex logical reasoning, multi-step task decomposition, and natural-
      language dialogue output; it incorporates DeepSeek reasoning technology to extend long-horizon
      planning capability. Third, a Fast System (System 1) translates the Slow System's plan into
      continuous whole-body joint trajectories and chassis movement commands at control-loop frequency,
      enabling real-time reactive behavior without waiting for reasoning cycles to complete.
      AI² Robotics pioneered VLA development in China: GOVLA 0.0 (June 2024) was the first open-source
      VLA from a startup, achieving performance 80%+ better than Google's RT-2 family at 1/20th the
      parameter count. GOVLA 0.5 (FiS-VLA, June 2025) was open-sourced and outperformed Physical
      Intelligence's π0 by 30% on authoritative benchmarks, earning endorsement from Turing Award
      laureate Yann LeCun. GOVLA 1.0 is in active development as of mid-2026 but had not been released.
      Training infrastructure includes a 1,000-GPU compute cluster. The model runs on-device on the
      Orin AGX 64GB module without cloud dependency, preserving data privacy and ensuring sub-100 ms
      inference latency in factory environments.
    claimRefs: [CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE022]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: s3
    title: Hardware Platform and Component Specifications
    body: >-
      AlphaBot 2's mechanical design centers on a three-joint folding-lifting leg structure with waist
      yaw plus two-wheel differential drive, giving seven total leg/waist actuators. Each arm provides
      7 DOF from shoulder to wrist, with joint ranges spanning ±178° at the shoulder and from -26° to
      120° at J7. Rated single-arm payload is 4 kg at a working radius of 723 mm; repeat positioning
      accuracy is ±0.1 mm, competitive with mid-tier collaborative robot arms. An integrated six-axis
      force/torque sensor per arm (200 N force, 7 Nm torque range) enables compliance control and
      collision detection for safe human-robot co-working. Peak joint torques range from 3.3 Nm at the
      neck pitch up to 436 Nm at the knee—mirroring industrial robot actuator sizing. The compute
      stack runs on NVIDIA Orin AGX 64GB: 2,048-core Ampere GPU, 12-core ARM Cortex-A78AE CPU, 2×
      NVDLA v2 deep-learning accelerators, 64 GB LPDDR5 at 204.8 GB/s memory bandwidth, and up to
      275 TOPS AI performance. Connectivity interfaces include Ethernet, RS485, and CAN bus. Developer
      access is via the AlphaBotCore SDK in Python, C, and C++. Battery is 48V/30 Ah, rated 4–6 hours
      of continuous operation. Core components carry a 50,000-hour MTBF rating for industrial-grade
      reliability. Operating environment is 5–40°C and 10–80% RH.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE023, CE036, CE037, CE038]
    figureRefs: [FE002]

  - id: s4
    title: Teleoperation, Training Data, and Learning Pipeline
    body: >-
      AI² Robotics supplies two distinct teleoperation devices to acquire demonstration data and
      enable remote operation. The VR Teleoperation system drives the robot via end-effector inverse
      kinematics—operators wear VR headsets and use handheld controllers to specify hand poses, while
      the robot's inverse kinematics solver finds joint solutions. This approach is portable, fast to
      set up, and lower cost, but introduces solution instability from kinematic singularities and
      eye fatigue during extended sessions. Use cases favor demonstrations, exhibitions, and simple
      mobile tasks. The Exoskeleton Teleoperation system uses a wearable robotic arm structurally
      identical to AlphaBot's arm (joint-space drive), mapping operator joint angles directly. It
      delivers high precision, natural force feedback, and zero unsolvable-motion failures, at the
      cost of high hardware weight, complex commissioning, and elevated cost. Preferred for fixed-site
      high-precision data collection, PCB loading, and safety-critical environments. The data-business
      dual closed loop is fundamental to AI² Robotics' iteration strategy: each commercial deployment
      generates real-world demonstration episodes, which feed continuous GOVLA fine-tuning through
      a proprietary incremental training pipeline on the 1,000-GPU cluster, which in turn improves
      model performance in the same and adjacent scenarios. Arms can also be kinesthetically taught
      by pressing the green drag-teaching button, enabling rapid in-situ skill programming without
      a teleoperation setup. This loop is analogous to the data flywheel used by search-engine-scale
      internet companies that AI² Robotics explicitly cites as inspiration for its data infrastructure.
    claimRefs: [CE021, CE024, CE025, CE026, CE040, CE041]
    figureRefs: []

  - id: s5
    title: Manufacturing Stack and Field Deployment Readiness
    body: >-
      AI² Robotics launched its proprietary production line in September 2025 with a rated annual
      capacity of 1,000 units. The company's stated goal is to scale to 10,000 units per year by end-2026,
      a 10× expansion in twelve months. Earlier public statements from April 2025 indicated a 2028
      target for 10K/year, suggesting an acceleration following the Series B capital raise. The company
      describes its manufacturing ambition as building a "robotics OEM," analogous to BYD in electric
      vehicles—controlling hardware design, manufacturing, and delivery integration. Commercial
      deployments as of mid-2026 span four industrial verticals: automotive manufacturing assembly
      lines, semiconductor fabs (JingBo Micro under Geely Technology), biotech clean rooms
      (HuaXi Biotech), and public service venues (airport baggage-cart management in Tier-1 Chinese
      cities). The anchor contract is a 1,000-unit, three-year framework agreement with HKC (华科,
      world's third-largest display panel maker), described by management as China's largest non-
      showcase commercial humanoid robot order. A Peking University–AI² Robotics joint laboratory for
      embodied AI was established in April 2025, providing research pipeline and talent access.
      Deployment readiness is strongest in structured industrial environments: the robot's 0–5° slope
      constraint and wheeled chassis preclude unstructured staircase or outdoor use, and current
      commercial SLAs and warranty structures are not publicly disclosed.
    claimRefs: [CE027, CE028, CE029, CE030, CE031, CE039, CE042]
    tableRefs: [TE005]
    figureRefs: [FE003]

  - id: s6
    title: Technical Moats and Weak Points
    body: >-
      AI² Robotics' primary moats are: (1) temporal lead in full-stack VLA development—it was the
      first Chinese startup to pursue end-to-end VLA architecture and open-sourced a model
      outperforming Western peers by 30% before most competitors had comparable benchmarks;
      (2) data-business flywheel—each commercial deployment generates proprietary robot demonstration
      data that is costly to replicate at scale, creating compounding model advantage; (3) integrated
      hardware-software system—the Alpha Brain model is co-designed with the AlphaBot hardware,
      enabling hardware-aware model optimization that a software-only competitor cannot easily replicate;
      and (4) institutional R&D access through the Peking University joint lab and a core team drawn
      from Microsoft Research, OPPO, and Xpeng.
      Material weak points include: the closed GitHub profile (zero public repositories as of mid-2026),
      which limits third-party validation, community trust, and developer adoption relative to
      open-ecosystem competitors; the wheeled chassis, which constrains terrain adaptability and
      limits deployable scenarios compared to fully bipedal competitors (Unitree H1/G1, AgiBot A2);
      the absence of publicly confirmed CE, ISO 10218, or equivalent safety certifications, representing
      a barrier to regulated environments; and GOVLA's dependency on NVIDIA Orin AGX 64GB compute—
      US export restrictions or supply constraints would directly impair production.
      The CEO's own February 2026 op-ed candidly states that the industry "shake-out has already
      begun" and that consumer-market entry "is not yet mature or realistic—it needs another five
      years." This self-assessment is both credible and an implicit competitive risk disclosure: if
      the consumer market remains gated, AI² must compete for the same structurally limited industrial
      order book as Unitree, AgiBot, UFACTORY, and several dozen other Chinese humanoid startups.
    claimRefs: [CE015, CE017, CE018, CE032, CE033, CE034, CE035, CE039]
    tableRefs: [TE004]
    figureRefs: [FE004]

