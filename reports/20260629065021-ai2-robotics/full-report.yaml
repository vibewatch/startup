      - number: '5.4'
        title: Teleoperation, Training Data, and Learning Pipeline
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics supplies two distinct teleoperation devices to acquire demonstration data and enable remote
              operation. The VR Teleoperation system drives the robot via end-effector inverse kinematics—operators wear
              VR headsets and use handheld controllers to specify hand poses, while the robot's inverse kinematics
              solver finds joint solutions. This approach is portable, fast to set up, and lower cost, but introduces
              solution instability from kinematic singularities and eye fatigue during extended sessions. Use cases
              favor demonstrations, exhibitions, and simple mobile tasks. The Exoskeleton Teleoperation system uses a
              wearable robotic arm structurally identical to AlphaBot's arm (joint-space drive), mapping operator joint
              angles directly. It delivers high precision, natural force feedback, and zero unsolvable-motion failures,
              at the cost of high hardware weight, complex commissioning, and elevated cost. Preferred for fixed-site
              high-precision data collection, PCB loading, and safety-critical environments. The data-business dual
              closed loop is fundamental to AI² Robotics' iteration strategy: each commercial deployment generates
              real-world demonstration episodes, which feed continuous GOVLA fine-tuning through a proprietary
              incremental training pipeline on the 1,000-GPU cluster, which in turn improves model performance in the
              same and adjacent scenarios. Arms can also be kinesthetically taught by pressing the green drag-teaching
              button, enabling rapid in-situ skill programming without a teleoperation setup. This loop is analogous to
              the data flywheel used by search-engine-scale internet companies that AI² Robotics explicitly cites as
              inspiration for its data infrastructure.
