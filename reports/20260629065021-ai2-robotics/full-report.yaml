      - number: '7.3'
        title: Regulatory, Policy, Safety, and Liability Risks
        blocks:
          - type: paragraph
            body: >
              AI² Robotics has not publicly disclosed any product safety certification for AlphaBot 2. No filing under
              China's GB/T robot safety standards, no ISO 10218 (industrial robot safety), and no CE marking or
              equivalent internationally recognized safety assessment is cited on the company's official documentation
              or press releases as of the run date. This is not necessarily disqualifying at AI²'s stage — China's
              humanoid-robot-specific safety standard is still being drafted under MIIT's 2023 Humanoid Robot Innovation
              Development Guidance — but it creates a latent liability gap: any physical injury to a factory worker
              caused by an AlphaBot 2 unit could expose the company to product liability claims, regulatory
              investigations, and reputational damage disproportionate to the incident severity, given the lack of a
              certified safety framework.


              Data governance creates a parallel regulatory risk. AlphaBot 2 operates with real-time visual and
              environmental sensing; the GOVLA model ingests factory-floor video, spatial data, and potentially
              biometric proximity data from human workers. China's Personal Information Protection Law (PIPL, effective
              November 2021) governs the collection, processing, and cross-border transfer of personal information. If
              AlphaBot 2's data collection pipeline captures worker biometric, facial recognition, or behavioral data —
              as is plausible given the robot's full-body vision stack — compliance requires documented consent
              frameworks, data impact assessments, and potentially a personal information protection officer. The
              company's official documentation does not address these obligations. China's Interim Measures for
              Generative AI Services (2023) additionally regulate the training data and output safety of embedded LLMs,
              which applies to the GOVLA model's language-instruction layer. Failure to maintain a compliant generative
              AI service record could expose AI² to regulatory action from China's Cyberspace Administration (CAC).


              Export-control and dual-use risks run bidirectionally. While AI² faces upstream chip-supply risk from US
              BIS controls (see section 2), its own export of AlphaBot 2 units or GOVLA model weights to non-Chinese
              jurisdictions may be subject to China's Export Control Law (2020) if robots are classified as dual-use
              items, and to US re-export controls given the NVIDIA Orin content. Both export channels remain legally
              ambiguous in 2026, creating a compliance trap that could freeze international expansion without
              legal-structuring work. Government policy support — MIIT's designation of humanoid robotics as a strategic
              emerging industry, CRRC's co-investment, and local Shenzhen subsidies — is currently favorable but creates
              its own risk: policy priorities can shift, subsidies can be withdrawn, and state-affiliated investors
              (CRRC, Guotai Haitong) can create governance influence that complicates future international capital
              raises or M&A transactions.
