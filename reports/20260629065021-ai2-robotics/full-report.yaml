      - number: '3.4'
        title: AI² Comparative Assessment and Moat Durability
        blocks:
          - type: paragraph
            body: >
              AI²'s competitive positioning rests on three claimed moats. First, the proprietary GOVLA/Alpha Brain
              vision-language-action model stack, which the company internally benchmarks at 30% higher task success
              rate than Physical Intelligence's π₀ — a self-reported figure not independently replicated. Second, early
              enterprise deployment traction: the HKC order (1,000 units over three years) is described by the company
              as China's largest non-showcase commercial humanoid robot order, with additional named customers at
              Dongfeng Liuzhou Motor, Huaxin Bio, and JingNeng Microelectronics. Third, a full-size (1,800 mm, 135 kg)
              form factor engineered for industrial environments requiring table-height manipulation and load-bearing.
              Against these moats, AI² is exposed on several dimensions: production capacity is confirmed at only 1,000
              units/year (targeting 10,000 by end-2026), while Unitree's pricing discipline implies far greater
              manufacturing scale. AlphaBot 2 commercial list pricing is not publicly disclosed, creating ROI opacity
              for enterprise buyers. Unitree's UniStore app-ecosystem strategy, if successful, could commoditize the
              platform layer AI² relies on for differentiation. AgiBot's parallel AI stack investment (WorkGPT/GO-1/GE-1
              on NVIDIA Thor T5000, five product platforms) and manufacturing pilots at Longcheer Technology and
              auto-parts factories outflank AI²'s single-platform strategy. AI²'s open-sourcing of FIS-VLA on GitHub and
              Yann LeCun's public endorsement provide genuine developer-community credibility and brand recognition that
              may attract talent and partnerships. The looming IPO wave in Chinese humanoid robotics — Unitree IPO
              expected, Deep Robotics filed — signals that the largest players are moving to capitalize market positions
              through public equity markets, potentially widening the funding and scale gap with mid-tier companies like
              AI². Overall, AI²'s position is real but fragile: at most 20% of a nascent market, with self-reported AI
              benchmarks, undisclosed pricing, and a CEO who publicly acknowledged imminent consolidation.
