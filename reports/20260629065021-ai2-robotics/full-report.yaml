      - number: '5.2'
        title: GOVLA Architecture and Alpha Brain Software Stack
        blocks:
          - type: paragraph
            body: >-
              Alpha Brain is the product brand for AI² Robotics' proprietary embodied foundation model, with the
              underlying model architecture named GOVLA (Global & Omni-body Vision-Language-Action). GOVLA's defining
              novelty is outputting complete whole-body kinematic control plus locomotion trajectories rather than only
              arm-endpoint actions as prior VLA models do. The architecture has three coupled components. First, a
              Spatial Interaction Foundation Model encodes real-time 3D object positions, spatial relationships, and
              environmental dynamics into a world-model representation. Second, a Slow System (System 2) handles complex
              logical reasoning, multi-step task decomposition, and natural- language dialogue output; it incorporates
              DeepSeek reasoning technology to extend long-horizon planning capability. Third, a Fast System (System 1)
              translates the Slow System's plan into continuous whole-body joint trajectories and chassis movement
              commands at control-loop frequency, enabling real-time reactive behavior without waiting for reasoning
              cycles to complete. AI² Robotics pioneered VLA development in China: GOVLA 0.0 (June 2024) was the first
              open-source VLA from a startup, achieving performance 80%+ better than Google's RT-2 family at 1/20th the
              parameter count. GOVLA 0.5 (FiS-VLA, June 2025) was open-sourced and outperformed Physical Intelligence's
              π0 by 30% on authoritative benchmarks, earning endorsement from Turing Award laureate Yann LeCun. GOVLA
              1.0 is in active development as of mid-2026 but had not been released. Training infrastructure includes a
              1,000-GPU compute cluster. The model runs on-device on the Orin AGX 64GB module without cloud dependency,
              preserving data privacy and ensuring sub-100 ms inference latency in factory environments.
