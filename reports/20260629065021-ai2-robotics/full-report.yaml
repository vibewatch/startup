      - number: '3.2'
        title: Western Benchmark Peers
        blocks:
          - type: paragraph
            body: >
              Western humanoid robot companies define the global technology and commercialization reference frame but do
              not currently compete directly with AI² Robotics in the Chinese enterprise market given export-control
              dynamics, localization requirements, and supply-chain separation. Figure AI's Figure 03 pivots toward the
              consumer home market with its Helix AI system, targeting a different use-case profile than AI²'s B2B
              industrial focus. Agility Robotics is the most commercially mature Western humanoid: its Digit platform is
              described by the company as the first humanoid robot in production deployment, operates via the Arc cloud
              platform, and is deployed in logistics scenarios as an Amazon supply-chain partner; Agility manufactures
              in Salem, Oregon with approximately 80% US-sourced parts, emphasizing supply-chain resilience. Apptronik's
              Apollo (172 cm, 72 kg, 55 lbs/25 kg payload, 4-hour runtime per battery pack) was developed by the team
              that built NASA's Valkyrie robot and uses a Robot-as-a-Service commercial model targeting warehouse and
              manufacturing clients. Boston Dynamics' Atlas is the most technically advanced commercial humanoid
              globally — 1.9 m, 90 kg, 56 DOF, IP67-rated, operating from −20°C to 40°C with a continuous joint range of
              motion, a 50 kg instant payload, and enterprise fleet-management integration via the Orbit platform. 1X
              Technologies (Norway/US) focuses on home robots. None of these Western companies currently present a
              direct procurement threat to AI² inside China's domestic enterprise buyer base, but they establish the
              capability ceiling that sophisticated Chinese enterprise buyers and global investors use as a benchmark,
              and their RaaS/fleet-management models offer commercialization templates that domestic players are
              observing.
