        title: Revenue Model and Commercial Traction
        blocks:
          - type: paragraph
            body: >
              AI² Robotics monetizes primarily through direct enterprise hardware sales of the AlphaBot 2 robot under
              multi-year commercial contracts. No software-only, SaaS, or asset-light revenue stream has been publicly
              confirmed, though the company's official product documentation lists GOVLA/Alpha Brain as a potential
              licensing layer. Revenue recognition is expected to occur upon robot delivery and acceptance, consistent
              with hardware sale norms; recurring service revenue (maintenance, model updates) has not been disclosed.
              The company does not publish a list price. Based on commercially analogous enterprise deployments —
              Agility Robotics' Digit robot at approximately USD 150,000 per unit in Western markets, and Unitree's G1
              at USD 13,500 for a far lighter and simpler research-grade platform — AlphaBot 2's enterprise ASP is
              estimated at RMB 200,000–500,000 per unit (~USD 28,000–70,000), though this range is unconfirmed. The
              strongest public commercial signal is the HKC (惠科, world's third-largest LCD panel manufacturer)
              three-year contract for 1,000 AlphaBot 2 units, which the company characterizes as the largest
              non-showcase commercial humanoid robot order in China. Other confirmed customer relationships include
              Dongfeng Liuzhou Motor (automotive, strategic cooperation since June 2025), Huaxin Bio (biotechnology,
              strategic partnership announced April 2025), and JingNeng Microelectronics (semiconductor manufacturing).
              Airport baggage-cart handling pilots in first-tier Chinese cities and "智魔方" modular AI space deployments
