      - number: '8.5'
        title: Final Verdict and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The overall assessment of AI²'s USD 1.4 billion valuation is STRETCHED but not irrational given peer
              context. The entry price is median within the February 2026 Chinese humanoid robotics unicorn cohort and
              below comparable Western private-market marks. However, the absence of any financial disclosure — no
              revenue, no gross margin, no unit economics, no ARR — combined with a single binding contract representing
              all confirmed commercial demand, limits the risk-adjusted return expectation to a level inconsistent with
              "buy" conviction. The recommended investor stance is RESEARCH_MORE: revisit at Series C if at least three
              of the five key diligence triggers below are resolved positively, or if the valuation compresses to below
              USD 1.0 billion in a down-round scenario that would improve the risk/reward materially. Any investor with
              access to data-room materials (undisclosed cap table, GOVLA benchmark source, HKC delivery schedule, gross
              margin by segment, customer pipeline) should reassess this verdict independently with the benefit of
              non-public evidence. The geopolitical risk — US-China technology decoupling limits exit options to Chinese
              strategic buyers and domestic STAR/HKEX IPO routes — represents a structural valuation ceiling that
              applies regardless of operational performance and is not captured in peer-based multiples analysis.
            claimRefs:
