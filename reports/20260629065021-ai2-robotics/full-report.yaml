      - number: '5.3'
        title: Hardware Platform and Component Specifications
        blocks:
          - type: paragraph
            body: >-
              AlphaBot 2's mechanical design centers on a three-joint folding-lifting leg structure with waist yaw plus
              two-wheel differential drive, giving seven total leg/waist actuators. Each arm provides 7 DOF from
              shoulder to wrist, with joint ranges spanning ±178° at the shoulder and from -26° to 120° at J7. Rated
              single-arm payload is 4 kg at a working radius of 723 mm; repeat positioning accuracy is ±0.1 mm,
              competitive with mid-tier collaborative robot arms. An integrated six-axis force/torque sensor per arm
              (200 N force, 7 Nm torque range) enables compliance control and collision detection for safe human-robot
              co-working. Peak joint torques range from 3.3 Nm at the neck pitch up to 436 Nm at the knee—mirroring
              industrial robot actuator sizing. The compute stack runs on NVIDIA Orin AGX 64GB: 2,048-core Ampere GPU,
              12-core ARM Cortex-A78AE CPU, 2× NVDLA v2 deep-learning accelerators, 64 GB LPDDR5 at 204.8 GB/s memory
              bandwidth, and up to 275 TOPS AI performance. Connectivity interfaces include Ethernet, RS485, and CAN
              bus. Developer access is via the AlphaBotCore SDK in Python, C, and C++. Battery is 48V/30 Ah, rated 4–6
              hours of continuous operation. Core components carry a 50,000-hour MTBF rating for industrial-grade
              reliability. Operating environment is 5–40°C and 10–80% RH.
