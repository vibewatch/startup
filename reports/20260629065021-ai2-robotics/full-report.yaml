              Global as exceeding CNY 10 billion (~USD 1.5 billion), while Crunchbase's February 2026 unicorn cohort
              analysis placed the company valuation at USD 1.4 billion; the minor discrepancy most likely reflects
              different FX conversion timing or rounding conventions rather than substantive disagreement. The Series B
              syndicate is strategically significant: Baidu Venture (Baidu's strategic AI-focused VC arm), CRRC Capital
              (a capital subsidiary of China Railway Rolling Stock Corporation, the world's largest rail equipment
              manufacturer), Cedarlake Capital (growth-stage VC), Guotai Haitong Securities (major Chinese investment
              bank), Yusys Technologies, Sentury Tire, and an unnamed Tesla supply-chain enterprise all participated.
              The participation of CRRC Capital — affiliated with a state-owned heavy-industry giant — signals
              institutional confidence in humanoid robotics commercialization timelines, and is the first investment by
              a state-owned heavy-industry enterprise in the Chinese humanoid robot sector.
