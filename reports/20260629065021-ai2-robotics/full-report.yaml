      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The growth thesis for China's humanoid robot market rests on policy-reinforced structural macro drivers
              and rapidly maturing technical capabilities, but several material constraints limit near-term adoption
              velocity and create risk for players outside the top-two duopoly. Key growth drivers: (1) Policy mandate —
              China's 15th Five-Year Plan (2026–2030) placed robotics at the heart of its modern industrial system,
              directing AI research toward physical applications and positioning robots as a primary economic driver,
              providing institutional tailwind that reduces adoption friction for state-aligned buyers. (2) Automation
              density headroom — China's robot density of 166 per 10,000 manufacturing workers compares to South Korea
              at 1,220, Germany at 449, Japan at 446, and the US at 307, implying a structural 7× gap versus
              best-practice automation intensity and a long runway of incremental adoption demand. (3) Capital
              concentration — at least five Chinese embodied AI companies each raised over USD 210 million; Chinese
              robotics investment was approximately 5–6× higher than European peers, sustaining R&D and
              commercialization throughput. (4) Technical stack maturation — AgiBot's real-world reinforcement learning
              system demonstrated success rate acceleration from approximately 8% to 60% on complex manipulation tasks,
              closing the reliability gap. (5) EV manufacturing tailwind — cobot adoption in Chinese EV production has
              outpaced the broader market for two years, normalizing enterprise procurement processes for advanced
              robotics that humanoid makers can leverage. Key constraints: (1) ROI opacity — without public average
              selling price or lifecycle cost data, enterprise buyers cannot independently model payback periods. (2)
              Market concentration — Unitree and AgiBot project to capture approximately 80% of 2026 China humanoid
              shipments, leaving smaller players with structural revenue and scale disadvantages. (3) Reliability floor
              — 60% task success rate is far below the 99%+ needed for unsupervised production deployment at industrial
              scale. (4) Competitor escalation — Tesla Optimus Gen 3 potential mass production in H2 2026 and Boston
              Dynamics Atlas commercial deployments represent global competitive pressure. (5) Standards gap — no formal
              Chinese national safety certification standards for full-size bipedal humanoid robots in production
              environments existed as of June 2026, creating regulatory uncertainty for enterprise procurers. (6)
              Industry shake-out risk — CEO Guo Yandong acknowledged in February 2026 that "the industry shake-out has
              already begun."
