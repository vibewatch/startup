      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Demand for enterprise humanoid robots in China follows a distinct tripartite structure. The buyer and
              payer is typically the head of manufacturing operations, supply chain, or capex planning at a large
              industrial enterprise, with authority to approve multi-million-yuan capital expenditures over a multi-year
              horizon. The user is the factory floor automation team — automation engineers, robot operators, and
              maintenance technicians who integrate the robot into production cells and interact with it daily. The
              payer is most often the same enterprise as the buyer, as AI²'s commercial contracts are structured as
              multi-year supply agreements rather than as-a-service models, evidenced by the HKC three-year, 1,000-unit
              contract and the Dongfeng Liuzhou Motor pilot. Primary buyer segments identified across AI²'s disclosed
              customer base and sector trajectory are: automotive OEM and Tier-1 suppliers (Dongfeng Liuzhou Motor),
              display and semiconductor manufacturing (HKC, JingNeng Microelectronics), pharmaceutical and biotech
              (Huaxin Bio), and broader advanced manufacturing including consumer electronics, new energy battery, and
              logistics. CRRC Capital's investment also hints at potential future deployment in infrastructure and
              maintenance-intensive industrial settings. The adoption trigger for enterprise buyers is primarily
              ROI-driven: when the fully-loaded cost of a humanoid robot (capital plus integration plus maintenance plus
              downtime risk) per unit task falls below equivalent human labor cost at scale, procurement is justified.
              At current benchmark pricing of USD 50–150K per unit for general-purpose humanoids in 2025–2026, the
              payback period remains unclear without public unit economics disclosure. State-owned and state-aligned
              enterprise buyers, signaled by CRRC Capital's participation and China's 15th Five-Year Plan directives,
              may face policy guidance to adopt domestic humanoid robots, creating a demand floor potentially
              independent of pure ROI analysis.
