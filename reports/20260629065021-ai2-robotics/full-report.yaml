  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definitions
        blocks:
          - type: paragraph
            body: >
              The market relevant to AI² Robotics is best defined as China's enterprise-grade, general-purpose humanoid
              robot market — robots capable of performing multi-step dexterous tasks in unstructured industrial
              environments, powered by a vision-language-action (VLA) AI model rather than fixed programming. This
              segment sits at the intersection of the broader Chinese industrial robot market and the emerging embodied
              AI category. Included spend covers humanoid robot hardware units, proprietary AI software stacks, system
              integration and deployment services, multi-year commercial operation contracts, and maintenance. Excluded
              spend includes: traditional fixed-arm industrial robots (FANUC, ABB, KUKA, Yaskawa, SIASUN, GSK
              equivalents) programmed for specific rigid tasks; Autonomous Mobile Robots (AMRs) and AGVs used for
              intralogistics transport without manipulation; collaborative robots (cobots) lacking dexterous
              manipulation and general AI; and consumer or entertainment robots without commercial-grade reliability.
              Status-quo substitutes for AI²'s value proposition include human labor at Chinese factory wage rates,
              fixed-arm robot cells with custom fixtures, cobots for pick-and-place on specific SKUs, and outsourcing of
              variable-demand manufacturing tasks to labor-flexible suppliers. The "humanoid" descriptor is contested:
              Galaxea Dynamics and X Square Robot deploy wheeled dual-arm systems rather than bipedal robots, blurring
              the category boundary with cobots and AMR-arm combinations. AI²'s AlphaBot 2 is bipedal at 22 DOF,
              differentiating it on form factor but raising deployment complexity relative to wheeled alternatives.
              Adjacencies include industrial IoT orchestration platforms, simulation and digital-twin environments, and
              cloud robotics services used to pre-train and fine-tune VLA models.
