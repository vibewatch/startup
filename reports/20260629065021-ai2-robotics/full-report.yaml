    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              AI² Robotics operates under the full legal name 智平方（深圳）科技股份有限公司 (unified social credit code
              91440300MA5HTHDC7C), incorporated in April 2023 and headquartered in the Nanshan District of Shenzhen,
              China's most concentrated hub for high-tech hardware startups. The company maintains a secondary
              development office in Beijing. The brand name AI² encodes the thesis that artificial intelligence raised
              to the power of embodiment unlocks a qualitative leap in robotic capability — a formula the company
              markets as "AI × Embodiment." The business model is vertically integrated: AI² designs its own robot
              hardware, develops its proprietary vision-language-action (VLA) AI model stack in-house, and sells robots
              directly to enterprise customers under multi-year commercial contracts. Target markets include factory
              automation (automotive, semiconductor, electronics manufacturing), logistics, and healthcare. Unlike peers
              that license third-party AI models, AI² claims competitive differentiation through its proprietary
              GOVLA/Alpha Brain model layer. Revenue is generated through hardware robot sales, potential software
              licensing for the AI model layer, and multi-year enterprise customer contracts. In May 2025, the company
              issued a formal legal notice against a Wuhan-based entity that had registered a corporate name resembling
              AI²'s brand, providing an independently verified public record of the full legal name, credit code, and
              registered address — one of the clearest governance-transparency windows available for this otherwise
              private company.
