      - number: '8.3'
        title: Investment Thesis vs. Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for AI² rests on four inter-locking propositions: that the HKC order proves willingness to
              pay at scale in the world's largest industrial robot market; that GOVLA/Alpha Brain constitutes a durable,
              hard-to-replicate AI moat anchored in embodied intelligence data; that Baidu Venture and CRRC Capital
              represent strategic distribution options unavailable to pure-financial investors; and that China's 15th
              Five-Year Plan policy tailwind, combined with a robotics market projected to reach USD 416 billion by 2035
              (Precedence Research, cited by Global X BOTZ ETF), provides a structural demand floor even if near-term
              execution stumbles. The bear case challenges each proposition directly. The HKC order is the company's
              only binding contract, while all other named customers hold exploratory MOUs; delivery milestone,
              acceptance criteria, and payment schedule are undisclosed, creating execution opacity. Physical
              Intelligence's π0.7 (April 2026) and AgiBot's WorkGPT/GO-1 represent credible VLA alternatives, and CB
              Insights' analysis of the YC Winter 2026 cohort identifies physical AI training data scarcity as the
              primary systemic bottleneck — a challenge that applies equally to GOVLA and to the entire sector. The
              twelve-round fundraising cadence implies a preference stack and dilution structure that could create
              misalignment between early and late investors. No independent audit of GOVLA benchmark claims exists, and
              the CEO's own February 2026 op-ed statement that "the industry shake-out has already begun" is internally
              adverse to the bull narrative.
