      - number: '8.4'
        title: Scenario Analysis and Probability-Weighted Valuation Range
        blocks:
          - type: paragraph
            body: >-
              Three scenarios bracket AI²'s likely valuation trajectory over an eighteen-to-thirty-six month horizon
              toward a Series C or secondary liquidity event. The bull scenario (assigned 15% probability) assumes HKC
              delivers on schedule, at least three new enterprise customers issue binding purchase orders by year-end
              2026, and AI² achieves annualized revenue of RMB 300 million or more by early 2027, enabling a Series C at
              USD 3–4 billion on 10–15x forward revenue. The base scenario (55%) sees HKC execution roughly on plan but
              with one or more delay tranches, conversion of two MOUs into binding orders, total annualized revenue of
              RMB 100–200 million by mid-2027, and a flat-to-modest Series C in the USD 1.4–2.1 billion range. The bear
              scenario (30%) involves material HKC delivery disputes or a volume reduction, no new binding customer
              additions, and a down-round in the USD 700 million to USD 1 billion range as the Unitree Robotics STAR
              market IPO (application accepted April 2026, per TrendForce) prices at a sector multiple below AI²'s
              implied mark — creating downward mark-to-market pressure across the Chinese humanoid cohort. The
              probability-weighted expected valuation is approximately USD 1.7 billion, modestly above the current USD
              1.4 billion entry but with a skewed distribution: the 30% bear scenario has a larger absolute downside
              than the 15% bull upside, and the 55% base scenario leaves limited appreciation. A Unitree IPO at or below
              15x trailing revenue would be the single most powerful external catalyst for a sector repricing.
            claimRefs:
