        title: Funding History and Investor Composition
        blocks:
          - type: paragraph
            body: >
              AI² Robotics completed its Series B funding round in February 2026, raising more than RMB 1 billion
              (approximately USD 145 million). The company has publicly stated it completed approximately 12 financing
              rounds in approximately 12 months — a claim it characterizes as including seven tranches in H1 2025 and
              five additional tranches in the Series B cluster — though these figures are company-stated and cannot be
