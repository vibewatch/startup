        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics markets the AlphaBot series as the fourth generation of intelligent terminal after
              smartphones and smart vehicles. The current shipping SKU, AlphaBot 2, is a wheeled dual-arm humanoid
              designed for productivity in controlled industrial and public-service environments. Unlike a fully bipedal
              form factor, the two-wheel differential drive chassis trades stair-climbing ability for operational
              stability, lower manufacturing complexity, and speed up to 1.5 m/s on flat floors (0°–5° slope tolerance).
              The robot integrates four Intel RealSense D435 RGB-D cameras for full-surround perception and two
              wrist-mounted D405 cameras for close-range hand-eye guidance. Its embodied AI layer, branded Alpha Brain,
              runs locally on the robot via an NVIDIA Orin AGX 64GB module, eliminating dependence on cloud connectivity
              and protecting customer data. The product line currently comprises the robot itself, the Alpha Brain
              model, the AlphaBotCore SDK, and two teleoperation peripherals (VR and exoskeleton). Target verticals are
              automotive manufacturing, semiconductor fabs, biotech/pharma clean rooms, and public-service venues such
              as airports. Planned expansion into consumer households was explicitly deferred by management to
              approximately 2031.
