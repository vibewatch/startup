      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: China's 15th Five-Year Plan and Automation Density Headroom Create a Structurally Favorable Market
            body: >-
              China's 15th Five-Year Plan (2026–2030) explicitly designates robotics as a core driver of the modern
              industrial system, with AI research directed toward physical applications. Combined with a robot density
              of only 166 per 10,000 manufacturing workers versus South Korea's 1,220 — a 7× structural gap — the macro
              tailwinds for China's humanoid robot market are among the strongest globally. At least five Chinese
              embodied AI companies have each raised more than USD 210 million, and the market has now generated its
              first disclosed commercial contracts at industrial scale (AI²'s HKC order; AgiBot's Longcheer deployment).
              Technical capability is advancing faster than the enterprise sales cycle, with manipulation success rates
              accelerating from 8% to 60% in single deployments. For AI², the alignment between its disclosed customer
              verticals (automotive, semiconductor, pharma) and the highest-ROI humanoid deployment use cases is
              commercially coherent.
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM021
              - CM025
              - CM026
              - CM027
          - type: callout
            title: Market Concentration, ROI Opacity, and Standards Gap Are Material Near-Term Adoption Constraints
            body: >-
              Three constraints stand out as structurally limiting near-term humanoid robot adoption in China. First,
              market concentration: Unitree Robotics and AgiBot together project to capture approximately 80% of China
              humanoid robot shipments in 2026, leaving AI² and all other vendors competing for at most 20% of a market
              currently estimated at USD 0.40 billion — implying AI²'s revenue ceiling is in the tens of millions at
              best in 2025–2026. Second, ROI opacity: no Chinese humanoid vendor has disclosed average selling prices,
              lifecycle cost structures, or enterprise payback data, making large-scale enterprise procurement
              justification difficult. Third, the regulatory gap: no formal Chinese national safety and certification
              standards for full-size bipedal humanoid robots in production environments existed as of June 2026,
              creating liability exposure for enterprise procurers. CEO Guo Yandong's own February 2026 op-ed
              acknowledges "the industry shake-out has already begun," signaling that competitive consolidation will
              accelerate in 2026–2027.
            calloutType: risk
