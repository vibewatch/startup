      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: NVIDIA Orin Export-Control Risk — Existential Dependency on US-Origin Chip
            body: >
              AlphaBot 2's GOVLA/Alpha Brain model runs on the NVIDIA Jetson AGX Orin 64GB, a US-origin advanced
              integrated circuit already subject to BIS EAR export controls to Country Group D:5 (China). BIS guidance
              issued in May 2026 reaffirmed license requirements for advanced computing items shipped to
              D:5-headquartered entities and extended the authorized IC designer timeline only to December 31, 2026 —
              signaling ongoing tightening rather than resolution. AI² has not disclosed a domestic compute alternative
              (Huawei Ascend, CIXAI, Zhaoxin, or equivalent). A control escalation that cuts Orin supply would require a
              full hardware redesign and model revalidation, a process measured in months to years. This is the
              highest-severity, highest-near-term probability risk in the AI² Robotics investment thesis and should be
              the first diligence question asked of management.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: callout
            title: Adverse Signal — CEO Acknowledges Industry Shake-Out Has Begun
            body: >
              In a February 2026 public op-ed on Sina Finance, CEO Guo Yandong wrote: "展望2026年，行业洗牌已开始" ("Looking ahead
              to 2026, industry shake-out has already begun"). This statement, from the company's own founder, directly
              acknowledges that competitive consolidation pressure is real and accelerating. Combined with TrendForce's
              April 2026 data showing Unitree and AgiBot capturing ~80% of Chinese humanoid robot shipments, AI² faces a
              winner-takes-most dynamic from a position of market minority. The shake-out acknowledgment is a materially
              adverse signal that warrants explicit probability-adjusted discounting of AI²'s revenue forecasts.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Round Architecture
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics closed its Series B in February 2026, raising more than RMB 1 billion (approximately USD 145
              million) across a cluster of tranches. Two independent sources — Crunchbase's February 2026 unicorn cohort
              report and Yicai Global's contemporaneous coverage — establish a post-money valuation of USD 1.4 billion
              and CNY 10 billion-plus respectively; the modest discrepancy reflects differing USD/CNY rate assumptions
              rather than a substantive disagreement on enterprise value. At the round-level, Baidu Venture led as
              strategic investor, joined by CRRC Capital (the first state-owned heavy-industry vehicle to enter Chinese
              humanoid robotics), Guotai Haitong Securities, Yusys Technologies (STAR market, 688317), Cedarlake
              Capital, Sentury Tire, and an unnamed Tesla supply-chain enterprise. The February 2026 round was the final
              tranche in a twelve-round, approximately twelve-month fundraising campaign that included seven tranches in
              H1 2025; this cadence is atypical and suggests either high capital burn or a structured capital-draw
              facility, both of which imply a complex preference stack and unknown dilution overhang. Total lifetime
              capital raised is estimated at more than RMB 2 billion (approximately USD 290 million) based on the
              company's own twelve-round disclosure, but no individual pre-Series B round size has been publicly
              confirmed. The absence of any revenue disclosure, ARR figure, or unit economics statement means this
              valuation cannot be anchored in conventional financial multiples; instead it rests on the quality of the
              investor syndicate, the HKC 1,000-unit binding purchase order, and the AI² robotics market narrative.
            claimRefs:
              - CV001
