      - number: '3.3'
        title: Substitutes and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              The principal competitive alternatives for AI²'s humanoid offering are not peer humanoid robots but the
              existing automation solutions already deployed at scale in Chinese factories. Traditional industrial
              robots from ABB, KUKA, FANUC, Yaskawa, and Chinese domestic integrators dominate factory floor automation
              with proven ROI, negligible task-failure risk, and established service ecosystems. The IFR recorded
              approximately 295,000 industrial robot installations in China in 2024, representing 54% of global market
              share; this installed base constitutes the primary incumbent advantage that humanoid robots must dislodge.
              Collaborative robots (cobots) are gaining share and are increasingly incorporating intelligent features —
              the Robot Report's January 2026 Chinese robotics outlook noted cobots "trending toward more intelligent
              solutions" as differentiation, directly encroaching on AI²'s target applications. Autonomous Mobile Robots
              and Automated Guided Vehicles have demonstrated ROI in logistics and warehousing. Fixed automation lines
              and conveyor systems offer lower cost and higher throughput for repetitive high-volume production that
              humanoid robots cannot yet economically match. Human labor remains the primary alternative for light
              manufacturing assembly tasks in China and is substantially less expensive on a per-task basis at current
              robot price points. The internal-build path is also relevant: large enterprise buyers (automotive OEMs,
              semiconductor fabs) can develop proprietary automation with system integrators, bypassing third-party
              humanoid suppliers entirely. AI²'s CEO acknowledged in February 2026 that "the industry shake-out has
              already begun," implicitly recognizing that enterprise buyers are choosing between these substitutes and
              AI²'s offering based on demonstrated ROI — a threshold not yet independently verified in the public
              domain.
