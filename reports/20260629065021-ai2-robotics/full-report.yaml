  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Observable Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - HKC order cancellation or material volume reduction
        - Formal notice or unit count reduction ≥30% from 1,000
        - Removes the only binding revenue anchor; eliminates basis for the bull and base cases
        - Immediately exit or do not invest; down-round likely within 6 months
      - - Unitree Robotics STAR IPO priced at <10x trailing revenue
        - Unitree IPO prospectus discloses <10x P/S at listing
        - Creates public market mark-to-market that compresses AI²'s peer-implied valuation to ≤$700M
        - Flag as material valuation risk; re-evaluate at post-IPO sector multiples
      - - Physical Intelligence or AgiBot achieves verifiable GOVLA equivalence or superiority
        - Published independent benchmark showing ≥5% task success rate advantage on AI² target verticals
        - Destroys the technology moat narrative; reduces AI² to execution play only
        - Require independent GOVLA audit as precondition for any new capital deployment
      - - CAC generative AI compliance failure or enforcement action
        - Formal CAC inspection, service suspension, or enforcement notice against AI² for GOVLA embedded layer
        - Regulatory risk crystallizes; deployment stops until remediated; could trigger customer cancellations
        - Immediate diligence on compliance filing status; monitor for CAC registration updates
      - - No new binding customer by Q4 2026
        - No publicly announced binding purchase order from a net-new enterprise customer by December 31, 2026
        - >-
          Confirms HKC as one-of-a-kind rather than a repeatable enterprise motion; thesis de-risks to single-customer
          bet
        - Do not invest; hold existing position with tight stop-loss on next round pricing
    notes: >-
      Trigger thresholds are analyst-defined; no AI² internal guidance has been disclosed. Action implications are for
      illustrative diligence purposes only.
    claimRefs:
      - CV003
      - CV023
      - CV025
      - CV031
      - CV032
      - CV034
      - CV035
      - CV038
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Diligence Path
    rows:
      - - Revenue and gross margin disclosure
        - Any revenue figure, ARR, gross margin, or COGS for AlphaBot 2 at commercial scale
        - >-
          Cannot validate valuation multiple or sustainability without financial baseline; all comp analysis relies on
          proxy revenue
        - >-
          Request data-room access; benchmark against Unitree's disclosed 60% gross margin from STAR market IPO
          prospectus
      - - HKC delivery schedule and milestones
        - >-
          Q3 2026 delivery milestone, acceptance criteria, payment schedule, and unit pricing for the 1,000-unit
          contract
        - HKC order is the sole valuation anchor; delivery failure or dispute collapses the base case
        - Direct customer reference check with HKC procurement; request contract summary in data room
      - - Cap table and preference stack
        - >-
          Full capitalization table, liquidation preferences, anti-dilution provisions, and pro-rata rights for all 12
          rounds
        - >-
          12-round cadence with unknown per-round terms creates preference overhang risk that is not visible in headline
          valuation
        - Request cap table from company; engage legal counsel to model waterfall scenarios
      - - GOVLA/Alpha Brain independent benchmark
        - >-
          Third-party evaluation of task success rate, generalization, and safety across the four target verticals
          (semiconductor, automotive, pharma, logistics)
        - Self-reported GOVLA benchmarks are the primary technical differentiator; no independent verification exists
        - >-
          Commission independent technical evaluation; compare against PI π0.7 and AgiBot WorkGPT on equivalent task
          sets
      - - Customer pipeline and conversion timeline
        - >-
          Total qualified pipeline (companies under active POC or MOU), expected conversion timeline, and average
          contract value for non-HKC prospects
        - Revenue model depends on converting 4 existing MOUs and adding new customers; pipeline quality is unknown
        - CEO pipeline briefing; request CRM data or at least named pipeline companies with stage
      - - CAC generative AI compliance status
        - Copy of any CAC registration or safety assessment filing for GOVLA's embedded language-instruction layer
        - >-
          Interim Measures for Generative AI Services (2023) apply to commercial deployments; non-compliance is a
          material operational risk
        - Legal review of AI regulatory filings; direct inquiry to AI² legal/compliance team
    notes: >-
      Diligence asks are based on publicly observable gaps only. Additional items would likely emerge from data-room
      review.
