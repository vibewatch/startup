  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercialization Risk and Customer Concentration
        blocks:
          - type: paragraph
            body: >
              The most immediate investment risk for AI² Robotics is the gap between stated commercial traction and
              independently verifiable binding commitments. Of the five publicly named anchor customers, only the HKC
              (惠科股份) agreement is a binding multi-year purchase order — 1,000 AlphaBot 2 units over three years.
              Dongfeng Liuzhou Motor, Huaxi Biotech, Jingneng Microelectronics, and ZhiMofang are described as
              "strategic cooperation" MOUs; volumes, pricing, and delivery schedules are not publicly disclosed.
              Customer concentration is therefore extreme: HKC may represent the entirety of AI²'s confirmed order
              backlog, and AI²'s own production capacity of 1,000 units per year at launch precisely matches the HKC
              commitment. If HKC delays, cancels, or renegotiates the order — or if the company fails to convert the
              three remaining MOUs to binding contracts within the next 12–18 months — revenue would be materially
              impaired.


              Competitive consolidation compounds this risk. TrendForce (April 2026) projects that Unitree Robotics and
              AgiBot together will capture approximately 80% of total Chinese humanoid robot shipments in 2026. AI²'s
              CEO, Guo Yandong, publicly acknowledged in a February 2026 op-ed published on Sina Finance that "industry
              shake-out has already begun" — a rare admission from a startup CEO that competitive pressure is real and
              acute. AgiBot's deployment of real-world reinforcement learning on an active Longcheer Technology
              production line in 2026 demonstrates that at least one direct competitor has already moved from pilot to
              production deployment, a milestone AI² has not yet publicly verified at equivalent scale. The CEO's own
              forecast of 10,000-unit-per-year capacity by end-2026 and 2028 respectively, and 1,000,000 units by 2033,
              carries execution risk that no current evidence base supports.


              The company's go-to-market strategy is entirely enterprise B2B within mainland China; no international
              pilot, export partnership, or cross-border distribution agreement has been disclosed as of the run date.
              This geographic concentration ties AI²'s revenue trajectory to domestic Chinese industrial automation
              investment cycles, which are in turn sensitive to downstream demand conditions in automotive,
              semiconductor, and biomanufacturing sectors. Humanoid robot ROI for enterprise customers remains unproven
              at scale industry-wide: no third-party audit, case study, or productivity measurement has been published
              for any of AI²'s five named customer deployments. The conversion of cooperation MOUs into binding
              contracts and then into revenue is therefore the most pressing near-term risk signal for investors to
              monitor.
