      - number: '7.2'
        title: Technical, Supply-Chain, and Embodied-Model Risks
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2's compute backbone is the NVIDIA Jetson AGX Orin 64GB, a 275-TOPS system-on-module manufactured
              by NVIDIA in the United States. NVIDIA's Jetson AGX Orin is classified as an advanced computing item
              subject to BIS Export Administration Regulations (EAR) controls on exports to Country Group D:5 entities,
              which includes China. The Bureau of Industry and Security has issued guidance reaffirming that licenses
              are required for advanced computing items shipped to entities headquartered in D:5 countries or with D:5
              parent companies, and extended the authorized IC designer program timeline to December 31, 2026 —
              suggesting ongoing regulatory tightening, not resolution. If BIS tightens controls further, restricts
              NVIDIA from supplying Orin modules to Chinese end-users, or if NVIDIA self-restricts supply in response to
              US government pressure, AI² would face a critical dependency failure with no confirmed domestic
              alternative compute platform on record. Replacing the Orin at scale would require hardware redesign, model
              re-validation, and potential customer contract renegotiation, a process measured in months to years and
              likely to compress gross margins significantly. This represents what the authors classify as an
              existential near-term supply-chain risk given the degree of GOVLA/Alpha Brain model integration with
              NVIDIA's embedded platform.


              Beyond the chip layer, AlphaBot 2's 22+ degree-of-freedom actuator and joint-module supply chain is not
              publicly documented. The robot's hardware architecture documentation notes strict operating requirements —
              no serious dust, no explosive or harmful gases, no strong electromagnetic interference — that constrain
              the addressable deployment environment and create potential for warranty and liability claims if units are
              deployed in non-compliant environments. Battery thermal management is a known risk vector across Chinese
              robotics companies; the hardware docs note working temperature limits of −20°C to 65°C and specific
              humidity and atmospheric pressure ranges, but no thermal runaway mitigation or battery certification
              standard is cited.


              The GOVLA/Alpha Brain VLA model introduces model-layer technical risks distinct from hardware. Academic
              research (RT-2, OpenVLA) consistently documents that VLA models generalize well on trained-distribution
              tasks but degrade meaningfully when encountering novel objects, lighting changes, or surface textures
              outside the training distribution. The company's claim of "50,000 hours MTBF" for core hardware components
              is unverified by any independent safety assessment. AgiBot's deployment of real-world reinforcement
              learning in production demonstrates a competing training paradigm that can adapt faster to factory-floor
              variations, representing a technological risk that AI²'s slower batch-imitation-learning pipeline may be
              outpaced. The data flywheel underpinning GOVLA requires continuous deployment-scale data collection; if
              MOU customers do not convert to production deployments, the model improvement cycle will stall relative to
              competitors with more deployed units.
