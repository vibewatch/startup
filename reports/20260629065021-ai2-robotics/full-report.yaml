            body: >-
              AI² Robotics' primary moats are: (1) temporal lead in full-stack VLA development—it was the first Chinese
              startup to pursue end-to-end VLA architecture and open-sourced a model outperforming Western peers by 30%
              before most competitors had comparable benchmarks; (2) data-business flywheel—each commercial deployment
              generates proprietary robot demonstration data that is costly to replicate at scale, creating compounding
              model advantage; (3) integrated hardware-software system—the Alpha Brain model is co-designed with the
              AlphaBot hardware, enabling hardware-aware model optimization that a software-only competitor cannot
              easily replicate; and (4) institutional R&D access through the Peking University joint lab and a core team
              drawn from Microsoft Research, OPPO, and Xpeng. Material weak points include: the closed GitHub profile
              (zero public repositories as of mid-2026), which limits third-party validation, community trust, and
              developer adoption relative to open-ecosystem competitors; the wheeled chassis, which constrains terrain
              adaptability and limits deployable scenarios compared to fully bipedal competitors (Unitree H1/G1, AgiBot
              A2); the absence of publicly confirmed CE, ISO 10218, or equivalent safety certifications, representing a
              barrier to regulated environments; and GOVLA's dependency on NVIDIA Orin AGX 64GB compute— US export
              restrictions or supply constraints would directly impair production. The CEO's own February 2026 op-ed
              candidly states that the industry "shake-out has already begun" and that consumer-market entry "is not yet
