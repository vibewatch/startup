      - number: '7.2'
        title: 技术、供应链与具身模型风险
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2 的计算骨干是 NVIDIA Jetson AGX Orin 64GB，一个由美国 NVIDIA 制造、性能 275 TOPS 的系统级模块。NVIDIA 的 Jetson AGX Orin
              被归类为先进计算物项，向 Country Group D:5 实体出口时受 BIS Export Administration Regulations（EAR）管制，中国包含在该组别内。Bureau of
              Industry and Security 已发布指南，重申向总部位于 D:5 国家或拥有 D:5 母公司的实体运输先进计算物项需要许可证，并将授权 IC 设计者项目时间线延至 2026 年 12 月 31
              日——这意味着监管仍在收紧，而非已经解决。如果 BIS 进一步收紧管制、限制 NVIDIA 向中国终端用户供应 Orin 模块，或 NVIDIA 在美国政府压力下自行限制供应，AI²
              将面临关键依赖失效，且记录中没有确认的国产替代计算平台。大规模替换 Orin 需要硬件重设计、模型重新验证，并可能重谈客户合同；该过程以数月到数年计，且很可能显著压缩毛利率。鉴于 GOVLA / Alpha
              Brain 模型与 NVIDIA 嵌入式平台集成程度很深，作者将其归类为近期存在性供应链风险。


              芯片层之外，AlphaBot 2 的 22+
              自由度执行器和关节模块供应链没有公开记录。机器人硬件架构文档列出严格运行要求——不得有严重粉尘、爆炸性或有害气体、强电磁干扰——这些要求限制可服务部署环境；如果设备被部署在不合规环境中，可能引发保修和责任索赔。电池热管理是中国机器人公司普遍存在的风险向量；硬件文档列出
              −20°C 至 65°C 的工作温度限制，以及特定湿度和大气压力范围，但没有引用热失控缓解方案或电池认证标准。


              GOVLA / Alpha Brain VLA 模型带来与硬件不同的模型层技术风险。学术研究（RT-2、OpenVLA）持续显示，VLA
              模型在训练分布内任务上泛化良好，但遇到训练分布之外的新物体、光照变化或表面纹理时会明显退化。公司声称核心硬件组件“50,000 小时 MTBF”，但没有任何独立安全评估验证。AgiBot
              在生产中部署真实世界强化学习，展示了一种竞争性训练范式，可更快适应工厂现场变化；这构成技术风险，AI² 较慢的批量模仿学习流水线可能被反超。支撑 GOVLA 的数据飞轮需要持续的部署规模数据采集；如果 MOU
              客户不能转为生产部署，模型改进循环就会相对部署量更大的竞争者停滞。
