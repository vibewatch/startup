      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Unitree + AgiBot 双寡头把 AI² 挤进 <20% 剩余空间
            body: >
              TrendForce 2026 年 4 月预测把 Unitree 和 AgiBot 放在中国人形机器人单元出货约 80% 的位置， AI² 和其他所有竞争者只能争夺一个仍很小市场中最多 20%
              的空间。Unitree 的量产规模和 $16,000 G1 定价 设定了成本底线；AI² 目前只有 1,000 台 / 年产能且定价未披露，无法在成本上匹配。AgiBot 的五平台组合与 VLA AI
              深度，实质上镜像了 AI² 最强的差异化主张。CEO 公开承认「洗牌」，也凸显出在 20% 以下细分中生存， 需要一个清晰楔子；单靠硬件差异或单靠 AI 差异都未必撑得住。
            calloutType: risk
