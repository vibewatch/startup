              AI² Robotics 从成立到达到独角兽估值（>人民币 100 亿元）不到 3 年，是全球人形机器人赛道中最快的路径之一。 纵向一体化的硬件 + AI 模型栈、高知名度机构投资者（Baidu
              Venture、CRRC Capital）， 以及公司所称的中国最大非展示型商业机器人订单（HKC 1,000 台），让 AI² 成为国内市场中可信的挑战者。 开源 FIS-VLA 模型和 Yann LeCun
