      - number: '4.2'
        title: 资本结构、融资历史与投资者图谱
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 于 2026 年 2 月完成 B 轮融资，募资超过人民币 10 亿元（约 1.45 亿美元）， 投后估值超过人民币 100 亿元（约 14–15 亿美元）。Yicai
              Global、CnTechPost、Crunchbase News 和 Robotics & Automation News 均独立佐证该轮融资，使其成为本报告中置信度最高的数据点之一。 Crunchbase
              将估值列为 14 亿美元，Yicai 报道为 15 亿美元；小差异来自汇率换算时间。 公司声称约 12 个月内完成约 12 笔融资——2025 年上半年七笔，加上构成 B 轮集群的五笔—— 但 B
              轮前单轮金额未披露，无法精确估算 B 轮前累计融资。B 轮投资者包括 Baidu Venture （Baidu 战略 AI VC 部门）、CRRC Capital（CRRC Group
              子公司，全球最大轨道交通装备制造商， 也是中国人形机器人赛道首个国有重工业投资者）、Cedarlake Capital（成长阶段 VC）、Guotai Haitong Securities
              （中国大型投行）、Yusys Technologies（金融科技、A 股上市，SSE 688317）、Sentury Tire， 以及一家未具名 Tesla 供应链企业。Yicai 证实了战略逻辑：Baidu
              带来 AI / LLM 生态协同； CRRC 提供大规模制造测试环境。B 轮资金将用于 GOVLA 模型开发和迭代、AlphaBot 硬件升级， 以及把生产线扩至年产 10,000 台目标。基于 12
