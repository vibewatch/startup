  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业化风险与客户集中度
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 最直接的投资风险，是公司声称的商业牵引力与可独立验证的约束性承诺之间存在落差。五个公开具名锚定客户中，只有 HKC（惠科股份）协议是具约束力的多年采购订单——三年 1,000 台
              AlphaBot 2。Dongfeng Liuzhou Motor、Huaxi Biotech、Jingneng Microelectronics 和 ZhiMofang
              均被描述为“战略合作”MOU；采购量、价格和交付时间表未公开披露。因此客户集中度极高：HKC 可能代表 AI² 已确认订单积压的全部，而 AI² 启动时 1,000 台 / 年的产能也与 HKC
              承诺精确匹配。如果 HKC 延期、取消或重谈订单——或者公司无法在未来 12–18 个月内把其余三个 MOU 转为约束性合同——收入会受到实质冲击。


              竞争整合会放大这一风险。TrendForce（2026 年 4 月）预计，Unitree Robotics 和 AgiBot 将在 2026 年合计拿下约 80% 的中国人形机器人总出货量。AI² CEO Guo
              Yandong 在 2026 年 2 月发表于 Sina Finance 的署名文章中公开承认“行业洗牌已开始”——创业公司 CEO 很少如此直白地承认竞争压力真实且尖锐。AgiBot 2026 年在
              Longcheer Technology 活跃产线上部署真实世界强化学习，说明至少一个直接竞争者已经从试点走向生产部署；AI² 尚未公开验证同等规模的里程碑。CEO 自己对 2026 年底和 2028
              年分别达到年产 10,000 台、2033 年达到 1,000,000 台的预测，也带有当前证据基础无法支撑的执行风险。


              公司的商业化策略完全是中国大陆境内企业 B2B；截至运行日期，未披露任何国际试点、出口合作或跨境分销协议。这种地理集中使 AI²
              的收入轨迹绑定中国本土工业自动化投资周期，而该周期又对汽车、半导体和生物制造等下游需求条件敏感。企业客户采用人形机器人的 ROI 在全行业范围内仍未规模化验证：AI²
              五个具名客户部署中，没有任何第三方审计、案例研究或生产率测量发布。因此，合作 MOU 转为约束性合同、再转为收入，是投资人近期最需要监测的风险信号。
