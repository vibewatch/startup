        title: 财务证据缺口与承保阻碍
        blocks:
          - type: paragraph
            body: >
              本章呈现的是结构性不完整的财务图景。AI² Robotics 是一家中国民营公司，没有发布财务报表的法定义务； 除 B 轮交易条款外，公司也未主动披露任何量化财务信息。传统创业公司承保所需的每一项指标——收入
              （当前或往绩）、毛利率、EBITDA、现金余额、烧钱速度和 runway——都不在公开记录中。 对投资者而言，资本充足性分析只能建立在以下估计上：（a）假设月度消耗为人民币 3,000–8,000 万
              （400–1,100 万美元），$145M B 轮意味着从 2026 年 2 月起有 13–36 个月 runway， 指向 2027–2028 年潜在 C 轮窗口；（b）HKC
              订单提供了有订单支撑的收入代理指标，但单台合同价格和总金额均未披露； （c）B 轮前轮次规模未披露，生命周期累计融资无法验证。商业牵引信号（四家具名企业客户、机场试点、模块化空间部署）
              显示公司在积极部署，但没有定价数据，无法转化为收入。Unitree 和 AgiBot 合计约 80% 的市场份额进一步放大市场风险， 限制 AI² 近期可触达的 backlog；CEO 在 2026 年 2
              月承认「行业洗牌已经开始」，也说明在下一轮融资前建立商业规模的窗口正在收窄。 尽调路径很直接，但必须直接推进：经审计财务、管理层编制的收入模型、带定价的已签商业合同， 以及 CFO 确认的 burn /
