      - number: '5.6'
        title: 技术护城河与薄弱点
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 的主要护城河包括：（1）全栈 VLA 开发的时间领先——它是首家追求端到端 VLA 架构的中国创业公司，并在多数竞争者尚无可比基准前，开源了性能较西方同类高 30%
              的模型；（2）数据—业务飞轮——每次商业部署都会产生自有机器人示教数据，这类数据大规模复制成本高，能不断累积模型优势；（3）软硬件一体化系统——Alpha Brain 模型与 AlphaBot
              硬件协同设计，可做硬件感知的模型优化，纯软件竞争者很难复刻；（4）通过 Peking University 联合实验室获得机构研发入口，核心团队来自 Microsoft Research、OPPO 和
              Xpeng。实质薄弱点包括：GitHub 资料关闭（截至 2026 年中没有公开仓库），相较开放生态竞争者，第三方验证、社区信任和开发者采用都受限；轮式底盘压缩地形适应性，相比完全双足竞争者（Unitree
              H1/G1、AgiBot A2）可部署场景更窄；未公开确认 CE、ISO 10218 或同等安全认证，进入受监管环境会受阻；GOVLA 依赖 NVIDIA Orin AGX 64GB
              算力，美国出口限制或供应约束会直接冲击生产。CEO 在 2026 年 2
              月的署名文章中坦率写道，行业“洗牌已开始”，消费市场进入“还不成熟、不现实——还需要五年”。这份自评既可信，也等于隐含披露竞争风险：如果消费市场继续被卡住，AI² 必须与
              Unitree、AgiBot、UFACTORY 和数十家其他中国人形机器人创业公司争夺同一个结构性有限的工业订单池。
