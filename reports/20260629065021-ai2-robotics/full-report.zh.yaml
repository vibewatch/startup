      - number: '8.4'
        title: 情景分析与概率加权估值区间
        blocks:
          - type: paragraph
            body: >-
              三个情景框定 AI² 在未来 18 到 36 个月、走向 Series C 或二级流动性事件时的可能估值轨迹。多头情景（赋予 15% 概率）假设 HKC 按期交付，至少三个新企业客户在 2026
              年底前发出约束性采购订单，AI² 到 2027 年初实现 RMB 300 million 或以上年化收入，从而以未来收入的 10–15x 完成 USD 3–4 billion 的 Series
              C。基准情景（55%）认为 HKC 执行大体按计划但出现一个或多个延迟批次，两个 MOU 转为约束性订单，到 2027 年中总年化收入为 RMB 100–200 million，Series C
              持平或小幅上行，估值区间为 USD 1.4–2.1 billion。空头情景（30%）包括 HKC 交付出现重大争议或削减数量、没有新增约束性客户，以及 Unitree Robotics STAR 市场
              IPO（据 TrendForce，申请于 2026 年 4 月获受理）按低于 AI² 隐含标记的行业倍数定价，导致下轮估值降至 USD 700 million 至 USD 1 billion
              区间——并对中国人形机器人同批公司形成向下盯市压力。概率加权预期估值约为 USD 1.7 billion，略高于当前 USD 1.4 billion 入场价，但分布偏斜：30% 空头情景的绝对下行大于 15%
              多头上行，55% 基准情景留下的升值空间有限。Unitree IPO 若按或低于过去十二个月收入的 15x 定价，将是行业重估最强的外部催化剂。
            claimRefs:
