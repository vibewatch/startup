      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 由郭彦东博士创立，他担任 CEO，也是截至本次报告运行日唯一公开具名的公司高管。 郭博士拥有 Purdue University
              电气与计算机工程博士学位，博士研究由统计图像处理和计算成像领域重要学者 Charles A. Bouman 教授指导。博士毕业后，郭博士在美国 Microsoft Research 担任研究员， 积累工业 AI
              与计算机视觉研发经验，之后回国创立 AI² Robotics。他在成像和机器学习上的学术背景， 加上世界级工业研究实验室经历，直接塑造了公司的核心 GOVLA / Alpha Brain 模型架构。
              更广泛的创始团队构成、联合创始人姓名、CTO 身份和高管组织架构均未公开；对于一家已达独角兽估值的公司， 这是显著的治理透明度缺口。2026 年 2
              月，郭博士在新浪财经发表面向公众的专栏文章，称「行业洗牌已经开始」—— 这是一位创业公司 CEO 罕见而坦率的承认：竞争整合压力真实存在，并且正在中国人形机器人赛道加速。 Meta 首席 AI 科学家 Yann
              LeCun 于 2025 年 6 月公开背书 AI² 的 FIS-VLA 模型，为公司带来外部学术可信度， 但没有证据表明他担任正式顾问。
