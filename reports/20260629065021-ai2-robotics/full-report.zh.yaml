  - id: FE001
    title: GOVLA / Alpha Brain 软件架构栈
    type: stack
    layout: standard
    summary: 从物理感知、基础模型推理到 AlphaBot 2 的全身控制输出，分层展示 Alpha Brain 具身 AI 系统。
    data:
