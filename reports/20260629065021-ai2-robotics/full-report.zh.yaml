            title: NVIDIA Orin 出口管制风险——对美国源芯片的存在性依赖
            body: >
              AlphaBot 2 的 GOVLA / Alpha Brain 模型运行在 NVIDIA Jetson AGX Orin 64GB 上；这是美国源先进集成电路，已经受 BIS EAR 对 Country
              Group D:5（中国）的出口管制。BIS 2026 年 5 月发布的指南重申，向总部位于 D:5 的实体运输先进计算物项需要许可证，并仅把授权 IC 设计者时间线延长到 2026 年 12 月 31
              日——信号是持续收紧，而非问题解决。AI² 未披露任何国产计算替代方案（Huawei Ascend、CIXAI、Zhaoxin 或同等方案）。一旦管制升级切断 Orin
              供应，公司将需要完整硬件重设计和模型重新验证，过程以数月到数年计。这是 AI² Robotics 投资逻辑中严重性最高、近期概率也最高的风险，应成为管理层尽调的第一个问题。
