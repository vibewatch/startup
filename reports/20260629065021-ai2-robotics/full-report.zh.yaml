      - number: '3.3'
        title: 替代品与现状方案
        blocks:
          - type: paragraph
            body: >
              AI² 人形机器人产品的主要竞争替代方案并非同类人形机器人，而是已经在中国工厂大规模部署的既有自动化方案。 ABB、KUKA、FANUC、Yaskawa
              以及中国本土集成商的传统工业机器人主导工厂一线自动化，ROI 已被验证， 任务失败风险极低，服务生态成熟。IFR 记录 2024 年中国约安装 295,000 台工业机器人，占全球市场份额 54%；
              这个装机基数就是人形机器人必须撬动的主要在位优势。协作机器人（cobots）正在提升份额，并越来越多地加入智能功能—— Robot Report 2026 年 1 月中国机器人展望指出，cobots
              正「走向更智能的解决方案」以形成差异化， 直接侵入 AI² 的目标应用。Autonomous Mobile Robots 和 Automated Guided Vehicles 已在物流与仓储中证明 ROI。
              固定自动化产线和传送系统在重复性大批量生产中成本更低、吞吐更高，人形机器人目前还无法经济性匹配。 在当前机器人价格下，中国轻制造装配任务的主要替代方案仍是人工，按单任务计算显著更便宜。内部自建路径同样重要：
              大型企业买方（汽车 OEM、半导体晶圆厂）可以与系统集成商开发专有自动化，完全绕开第三方人形机器人供应商。 AI² 的 CEO 在 2026 年 2
              月承认「行业洗牌已经开始」，实际上也承认企业买方会在这些替代品和 AI² 产品之间选择， 依据是已证明的 ROI——而这个门槛尚未在公开资料中得到独立验证。
