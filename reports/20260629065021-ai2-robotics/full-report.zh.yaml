  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入和毛利率披露
        - AlphaBot 2 商业规模下的任何收入、ARR、毛利率或 COGS 数据
        - 没有财务基线，就无法验证估值倍数或可持续性；全部可比分析都依赖收入代理
        - 要求开放 data room；对照 Unitree 科创板 IPO 招股书披露的 60% 毛利率做基准
      - - HKC 交付排期和里程碑
        - 1,000 台合同的 2026 年 Q3 交付里程碑、验收标准、付款安排和单价
        - HKC 订单是唯一估值锚；交付失败或出现争议会击穿基准情景
        - 直接向 HKC 采购做客户访谈；要求 data room 提供合同摘要
      - - 股权结构和优先权堆栈
        - 完整 cap table、清算优先权、反稀释条款，以及全部 12 轮投资人的 pro-rata 权利
        - 12 轮融资节奏叠加逐轮条款不透明，带来 headline 估值看不见的优先权悬挂风险
        - 向公司索取 cap table；聘请法律顾问建模清算瀑布情景
      - - GOVLA/Alpha Brain 独立基准
        - 第三方评估其在四个目标垂直场景（半导体、汽车、制药、物流）的任务成功率、泛化能力和安全性
        - 自报 GOVLA 基准是主要技术差异点；目前没有独立验证
        - 委托独立技术评估；在等价任务集上对比 PI π0.7 和 AgiBot WorkGPT
      - - 客户管线和转化时间表
        - 合格管线总量（处于活跃 POC 或 MOU 阶段的公司）、预期转化时间表，以及非 HKC 线索的平均合同额
        - 收入模型依赖 4 个现有 MOU 转化并新增客户；管线质量未知
        - CEO 管线简报；要求 CRM 数据，或至少提供具名管线公司及阶段
      - - CAC 生成式 AI 合规状态
        - GOVLA 嵌入式语言指令层的任何 CAC 注册或安全评估申报副本
        - 《生成式人工智能服务管理暂行办法》（2023）适用于商业部署；不合规是重大运营风险
        - 法律审阅 AI 监管申报；直接询问 AI² 法务 / 合规团队
    notes: 尽调问题仅基于公开可观察缺口。data room 审阅后很可能出现更多事项。
