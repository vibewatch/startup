      - CR035
  - id: FR003
    title: AI² Robotics 关键依赖图
    type: dag
    layout: standard
    summary: |
      这张有向无环图把公司的关键外部依赖映射到来源、类型和单点故障风险。计算层的美国来源依赖，以及中国政策 / 监管节点，是最高风险项。
    data:
      nodes:
        - id: d1
          label: NVIDIA（美国）
          description: Jetson AGX Orin 64GB 计算；美国来源；受 BIS EAR 约束
        - id: d2
          label: DeepSeek（中国）
          description: 已集成进 GOVLA 管线的推理模型（据 36kr / 新闻报道）
        - id: d3
          label: BIS / 美国商务部
          description: 控制先进计算产品输华的监管机构
        - id: d4
          label: HKC 惠科股份（中国）
          description: 唯一有约束力采购订单客户；锚定收入
        - id: d5
          label: CRRC Capital（中国）
          description: 有国资关联的 Series B 投资方；暗含战略共研
        - id: d6
          label: Baidu Ventures（中国）
          description: Series B 投资方；潜在 AI 模型平台依赖
        - id: d7
          label: MIIT / CAC（中国监管机构）
          description: 人形机器人安全标准；生成式 AI 监管；PIPL 执法
        - id: d8
          label: AlphaBot 2 产线（深圳）
          description: 单一制造设施；年产能 1,000 台；唯一生产资产
        - id: d9
          label: AI² Robotics（主体）
          description: 中心节点；依赖上述全部节点
        - id: d10
          label: MOU 客户（Dongfeng、Huaxi、Jingneng）
          description: 无约束力；代表潜在但未确认的管线
      edges:
        - from: d3
          to: d1
          label: 出口管制权限
        - from: d1
          to: d9
          label: 计算供应（单一来源）
        - from: d2
          to: d9
          label: 推理模型集成
        - from: d4
          to: d9
          label: 唯一确认收入
        - from: d5
          to: d9
          label: 资本 + 治理影响
        - from: d6
          to: d9
          label: 资本 + 模型平台风险
        - from: d7
          to: d9
          label: 监管合规义务
        - from: d8
          to: d9
          label: 唯一生产资产
        - from: d10
          to: d9
          label: 附条件未来收入
    claimRefs:
      - CR011
      - CR012
      - CR001
      - CR002
      - CR003
      - CR021
      - CR025
      - CR033
      - CR036
      - CR037
  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: standard
    summary: 从最强证据支柱出发，穿过已识别风险与估值溢价评估，最终落到 RESEARCH_MORE 推荐的决策路径。
    data:
      nodes:
        - id: n1
          label: HKC 1,000 台约束性订单 + 战略投资人财团（Baidu、CRRC）
        - id: n2
          label: 收入 / 毛利率披露为零；约束性客户单一；12 轮融资后的股权结构复杂
        - id: n3
          label: 私募可比公司中位数（$1.4B，对比西方同业 $2.4–2.6B、中国样本约 $1.5B）
        - id: n4
          label: 订单价值倍数 60–150x；需要订单簿快速扩张才撑得住
        - id: n5
          label: VLA 护城河未经审计；Physical Intelligence π0.7 与 AgiBot 构成可信的技术可比威胁
        - id: n6
          label: 结论：估值偏紧 — 等待 5 个尽调触发点后再 RESEARCH_MORE
    approximationNotes: 该流程逻辑呈现的是分析师推理链，不是正式的决策树模型。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV011
      - CV027
      - CV032
      - CV033
      - CV044
  - id: FV002
    title: 估值敏感性——关键价值驱动因素及影响
    type: bar
    layout: standard
    summary: 以当前 $1.4B 基线为参照，五类关键价值驱动情景下的隐含估值区间（百万美元）。正向驱动情景抬高隐含估值；负向驱动情景压低估值。
    data:
      items:
        - label: HKC 交付成功 + 第二个约束性客户
          value: 2100
        - label: 收入透明度（任何公开毛利率）
          value: 1800
        - label: 基线（当前 $1.4B；无新增信息）
          value: 1400
        - label: Unitree IPO 触发板块估值压缩（收入倍数 <15x）
          value: 900
        - label: 熊市：HKC 纠纷 + 无新增客户
          value: 750
    approximationNotes: 敏感性数值是分析师估算：用板块倍数框架套到代理收入上得出；并非来自 AI² 内部预测或 DCF 模型。
    claimRefs:
      - CV008
      - CV021
      - CV022
      - CV023
      - CV025
      - CV038
      - CV050
  - id: FV003
    title: 估值与回报区间——牛市 / 基准 / 熊市结果
    type: range
    layout: standard
    summary: 各情景在预期 Series C / 下一次流动性事件窗口（18–36 个月）的低—高估值区间（百万美元），显示以当前 $1.4B 进入时，下行相对上行更不对称。
    data:
      items:
        - label: 熊市情景（30%）：降价轮
          low: 700
          high: 1000
        - label: 基准情景（55%）：温和增长
          low: 1400
          high: 2100
        - label: 牛市情景（15%）：规模突破
          low: 2800
          high: 4200
    approximationNotes: 区间代表预期下一轮账面估值，不是终局价值估算。当前 $1.4B 入场价落在基准情景区间低端；预期回报小幅为正，但在现有证据下，分布偏向下行。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV039
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI 评分卡——可提交 IC 的结论
    type: kpi
    layout: standard
    summary: 七个投资维度按 1–5 分打分的 IC 框架；总分 17/35 表明，公司有真实市场机会和产品验证，但财务透明度与估值纪律不足，按当前条款还难以形成买入确信。
    data:
      items:
        - label: 市场机会
          value: 3
          target: 5
        - label: 产品与技术验证
          value: 3
          target: 5
        - label: 竞争护城河
          value: 2
          target: 5
        - label: 财务透明度
          value: 1
          target: 5
        - label: 团队质量
          value: 4
          target: 5
        - label: 估值纪律
          value: 2
          target: 5
        - label: 证据质量
          value: 2
          target: 5
    approximationNotes: 分数是分析师按 1-5 分尺度作出的判断。1 分 = 明显不足；3 分 = 中位水平；5 分 = 同类最佳。财务透明度得 1 分，因为截至 2026 年 6 月，公司未披露收入、毛利率或管线。
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV027
      - CV031
      - CV037
      - CV043
      - CV044
      - CV045
      - CV049
