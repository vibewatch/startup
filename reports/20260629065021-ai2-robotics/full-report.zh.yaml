  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与轮次结构
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 于 2026 年 2 月完成 Series B，通过一组分批交易融资超过 RMB 1 billion（约 USD 145 million）。两个独立来源——Crunchbase 2026
              年 2 月独角兽队列报告和 Yicai Global 同期报道——分别给出 USD 1.4 billion 和 CNY 10 billion-plus 的投后估值；两者差距不大，更多反映 USD/CNY
              汇率假设不同，而非对企业价值存在实质分歧。轮次层面，Baidu Venture 作为战略投资方领投，CRRC Capital（首个进入中国人形机器人领域的国有重工业载体）、Guotai Haitong
              Securities、Yusys Technologies（STAR 市场，688317）、Cedarlake Capital、Sentury Tire 和一家未具名 Tesla 供应链企业参投。2026 年 2
              月这一轮，是约 12 个月、12 轮融资活动的最后一笔分批交易；该活动包括 2025 年上半年 7
              个分批轮次。这种节奏并不典型，暗示公司要么资本消耗高，要么采用结构化资本提款安排；两种情况都意味着复杂的优先权堆栈和未知稀释悬挂。基于公司自己披露的 12 轮融资，累计融资额估计超过 RMB 2
              billion（约 USD 290 million），但 Series B 前各轮金额没有公开确认。缺少任何收入披露、ARR
              数字或单位经济声明，意味着这个估值无法锚定传统财务倍数；它更多依靠投资人联盟质量、HKC 1,000 台约束性采购订单，以及 AI² 机器人市场叙事。
