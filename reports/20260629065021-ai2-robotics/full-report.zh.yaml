      - number: '8.5'
        title: 最终判断与尽调问题
        blocks:
          - type: paragraph
            body: >-
              对 AI² USD 1.4 billion 估值的总体判断是偏紧但并非不理性，考虑同业背景仍可解释。入场价处于 2026 年 2
              月中国人形机器人独角兽批次的中位数，也低于可比西方私有市场标记。不过，缺少任何财务披露——没有收入、没有毛利率、没有单位经济、没有
              ARR——再叠加单一约束性合同代表全部已确认商业需求，使风险调整后回报预期低于“买入”信心所需水平。建议投资人立场是 RESEARCH_MORE：若下列五个关键尽调触发项中至少三个得到正面解决，可在 Series
              C 重新审视；或者若估值在 down-round 情景下压缩至 USD 1.0 billion 以下、显著改善风险 / 回报，也可重看。任何能接触资料室材料的投资人（未披露股权结构表、GOVLA 基准来源、HKC
              交付排期、分业务毛利率、客户管线），都应基于非公开证据独立重评该结论。地缘政治风险——中美技术脱钩把退出选项限制在中国战略买家和境内 STAR / HKEX IPO
              路径——构成结构性估值天花板；它无论运营表现如何都适用，也没有被同业倍数分析捕捉。
