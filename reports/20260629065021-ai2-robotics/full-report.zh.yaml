      - number: '8.2'
        title: 可比估值分析——私有与公开市场基准
        blocks:
          - type: paragraph
            body: >-
              要理解 AI² 的 USD 1.4 billion 入场价，需要两组视角：人形和具身 AI
              机器人公司的私有市场类比，以及成熟工业自动化和机器人公司的公开市场倍数。私有市场一侧，最直接可比的西方公司融资估值跨度很大。Figure AI 于 2024 年 2 月融资 USD 675
              million，隐含估值约 USD 2.6 billion——约为 AI² 当前标记的 1.9x——尽管当时也没有公开披露收入。Physical Intelligence（pi.website）的 π0.7
              通用策略模型于 2026 年 4 月发布，代表当前 VLA 操作前沿；该公司 2024 年末融资 USD 400 million，估值估计约 USD 2.4 billion。PI 博客确认其通过“The
              Physical Intelligence Layer”（2026 年 2 月文章）推进活跃商业合作爬坡，但未披露收入数字。Apptronik 于 2025 年完成约 USD 350 million Series
              A，目标是制造业人形机器人部署；1X Technologies 累计融资超过 USD 135 million。公开市场一侧，工业自动化和机器人可比公司——ABB（约 2.2x
              过去十二个月收入）、Teradyne（约 3.5x）、Cognex（约 6x）、Symbotic（约 3.5x）和 Rockwell Automation（约 3x，按其自有 IR
              材料为全球最大纯工业自动化公司）——收入倍数区间为 2–6x。由于 AI² 没有披露收入，应用这些倍数必须从 HKC 订单推演远期收入。HKC 1,000 台、三年合同，按估计 ASP RMB
              200,000–500,000 计算，隐含年化收入 RMB 67–167 million；对应 USD 1.4 billion 估值为年化订单价值的
              60–150x——这是深度成长阶段溢价，要求订单簿快速扩张才能保持可辩护。CB Insights 2026 年 6 月制造业机器人市场图谱识别出 14 个市场细分中的 116
              家创业公司，确认赛道高度拥挤，Series C 时高于同批公司估值溢价的概率被压缩。
