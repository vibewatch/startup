  - id: TV005
    title: 推翻投资逻辑和止损触发器
    columns:
      - 触发器
      - 可观察阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - HKC 订单取消或数量大幅下调
        - 正式通知，或 1,000 台订单数量减少 ≥30%
        - 拿掉唯一有约束力的收入锚点；乐观和基准情景失去依据
        - 立即退出或不投资；6 个月内很可能出现 down-round
      - - Unitree Robotics 科创板 IPO 定价低于过去收入 10x
        - Unitree IPO 招股书披露上市时 P/S <10x
        - 形成公开市场盯市锚，把 AI² 同行隐含估值压到 ≤$700M
        - 标记为重大估值风险；按 IPO 后行业倍数重新评估
      - - Physical Intelligence 或 AgiBot 实现可验证的 GOVLA 等同或领先
        - 独立基准显示，在 AI² 目标垂直场景上的任务成功率优势 ≥5%
        - 技术护城河叙事被打掉；AI² 只剩执行力押注
        - 将独立 GOVLA 审计作为任何新增资本投入的前置条件
      - - CAC 生成式 AI 合规失败或遭执法
        - CAC 针对 AI² 的 GOVLA 嵌入层发起正式检查、暂停服务或下发执法通知
        - 监管风险兑现；整改前部署停止；可能触发客户取消订单
        - 立即尽调合规备案状态；监测 CAC 注册更新
      - - 2026 年 Q4 前没有新增有约束力客户
        - 到 2026 年 12 月 31 日，未公开宣布来自全新企业客户的有约束力采购订单
        - 证明 HKC 是一次性案例，而不是可复制的企业销售动作；投资逻辑退化为单客户押注
        - 不投资；若已有持仓，则按下一轮定价设置严格止损
    notes: 触发阈值由分析师定义；AI² 未披露任何内部指引。行动含义仅用于示例性尽调。
