          description: 美国 EAR 限制先进计算 IC 输华；限制已存在且在升级
        - id: n2
          label: GOVLA 模型依赖 NVIDIA 平台
          description: Alpha Brain 在 Orin 上运行；未披露国产替代方案
        - id: n3
          label: 芯片供应中断
          description: NVIDIA 停止或限制向中国供应 Orin
        - id: n4
          label: 需要硬件重设计
          description: AlphaBot 2 硬件和模型全面重新验证；至少 12–24 个月
        - id: n5
          label: HKC 订单集中
          description: 唯一有约束力 PO；占已确认订单积压的 100%
        - id: n6
          label: MOU 未转化
          description: 5 个客户中 3 个仍无约束力；没有承诺数量
        - id: n7
          label: 收入受损
          description: 产能被生产吸收但管线不足；收入低于计划
        - id: n8
          label: Series C 困难
          description: 估值与收入错配；Unitree IPO 带动行业倍数重置
        - id: n9
          label: PIPL / AI 监管不合规
          description: CAC 或 MIIT 执法；罚款或产品暂停令
        - id: n10
          label: 治理不透明
          description: 除 CEO 外没有具名高管；未披露董事会构成
        - id: n11
          label: 论点破裂
          description: 投资回报受到实质性损害；退出估值等于或低于入场估值
      edges:
        - from: n1
          to: n3
          label: 收紧 → 中断
        - from: n2
          to: n3
          label: 单平台依赖
        - from: n3
          to: n4
          label: 迫使重设计
        - from: n4
          to: n7
          label: 停产 → 收入不达预期
        - from: n5
          to: n7
          label: 集中度 → 收入脆弱
        - from: n6
          to: n7
          label: 管线持续偏薄
        - from: n7
          to: n8
          label: 不达预期 → Series C 更难
        - from: n8
          to: n11
          label: 下轮估值下调或无新一轮
        - from: n9
          to: n7
          label: 执法扰乱部署
        - from: n10
          to: n8
          label: 治理折价压低估值
    claimRefs:
      - CR011
      - CR012
