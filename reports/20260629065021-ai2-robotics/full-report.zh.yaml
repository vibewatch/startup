      - number: '3.4'
        title: AI² 对比评估与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              AI² 的竞争位置建立在三条自称护城河上。第一，专有 GOVLA / Alpha Brain 视觉-语言-动作模型栈； 公司内部基准称其任务成功率比 Physical Intelligence 的 π₀ 高
              30%，但这是自报数字，尚未被独立复现。 第二，早期企业部署牵引力：HKC 订单（三年 1,000 台）被公司描述为中国最大非展示型商业人形机器人订单， 另有 Dongfeng Liuzhou
              Motor、Huaxin Bio 和 JingNeng Microelectronics 等具名客户。第三， 面向需要桌面高度操作和承重的工业环境，打造了全尺寸（1,800 mm、135
              kg）形态。与这些护城河相对， AI² 在多条维度上承压：已确认产能只有每年 1,000 台（目标 2026 年底 10,000 台），而 Unitree 的定价纪律暗示其制造规模大得多。 AlphaBot 2
              商业标价未公开，企业买方面临 ROI 不透明。Unitree 的 UniStore 应用生态策略若成功， 可能把 AI² 用来差异化的平台层商品化。AgiBot 同时投资 AI 栈（NVIDIA Thor
              T5000 上的 WorkGPT / GO-1 / GE-1、 五个产品平台），并在 Longcheer Technology 和汽车零部件工厂试点制造，包抄了 AI² 的单平台策略。 AI² 在 GitHub
              开源 FIS-VLA，叠加 Yann LeCun 的公开背书，确实带来开发者社区可信度和品牌认知， 可能吸引人才和伙伴。中国人形机器人即将出现 IPO 潮——Unitree IPO 预期、Deep
              Robotics 已申报—— 表明头部玩家正通过公开股权市场巩固市场位置，可能进一步拉大与 AI² 这类中腰部公司的融资和规模差距。 总体看，AI² 的位置真实但脆弱：它最多面对一个新兴市场 20% 的空间，同时
              AI 基准自报、定价未披露， CEO 也公开承认整合迫在眉睫。
