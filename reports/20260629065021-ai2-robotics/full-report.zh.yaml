      - number: '1.3'
        title: 融资历史与投资者构成
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 于 2026 年 2 月完成 B 轮融资，募资超过人民币 10 亿元（约 1.45 亿美元）。 公司公开称约 12 个月内完成约 12 轮融资，并将其描述为 2025
              年上半年七笔融资加上 B 轮集群中的五笔追加融资； 但这些数字由公司自行陈述，无法从公开备案中独立验证。B 轮投后估值被 Yicai Global 报道为超过人民币 100 亿元 （约 15 亿美元），而
              Crunchbase 的 2026 年 2 月独角兽批次分析把公司估值列为 14 亿美元； 这个小差异更可能来自汇率换算时间或取整口径，而非实质分歧。B 轮财团具有战略意义：Baidu Venture
              （Baidu 旗下聚焦 AI 的战略 VC）、CRRC Capital（全球最大轨道交通装备制造商中国中车的资本子公司）、 Cedarlake Capital（成长阶段 VC）、Guotai Haitong
              Securities（中国大型投行）、Yusys Technologies、 Sentury Tire，以及一家未具名 Tesla 供应链企业均参与其中。CRRC Capital 隶属国有重工业巨头，
              其入股释放出机构对人形机器人商业化时间表的信心，也是中国人形机器人赛道中首个国有重工业企业投资案例。
