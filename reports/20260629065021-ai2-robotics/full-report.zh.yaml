      - number: '7.4'
        title: 资本强度、估值错配与治理风险
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 在 2026 年 2 月完成超过 RMB 1 billion（约 USD 145 million）的 Series B 后，投后估值达到 RMB 10 billion+；这是公司约 12
              个月内披露的第 12 次融资。这样的融资节奏并不寻常：一年内完成 12 次交割（包括 2025 年上半年 7 次，以及 Series B 本身 5
              次），要么说明公司采用高稀释频率的结构化资本提款方式，要么说明烧钱速度要求它几乎持续接入资本市场。相对于 RMB 10B+ 估值，若公司处于商业化前阶段，隐含收入倍数实际上无限；若用 HKC
              订单价值做代理（1,000 台，估计 ASP 为 RMB 200,000–500,000，即三年 RMB 200M–500M，年化约 RMB 67M–167M），则约为年化订单价值的 60x 至
              150x。对于高增长硬件 AI 公司，这并非天然致命，但要求商业化路径近乎完美：HKC 交付延误、MOU 转化失败或竞争性毛利压缩，都会让 2027–2028 年很可能需要的 Series C
              更难公允定价。Unitree Robotics 的 STAR 市场 IPO 申请已获受理（TrendForce 2026 年 4 月披露），可能形成公开市场可比项，迫使全行业估值重置；Unitree 披露的
              60% 毛利率和 51% 收入来自人形机器人业务，会对 AI² 未披露且在小规模生产下很可能更低的利润率构成不利对照。


              治理透明度缺口显著。截至运行日期，AI² 整个领导团队中只有 CEO Guo Yandong 被公开具名。公司未公开披露联合创始人、CTO、VP Engineering、Chief Financial
              Officer 或独立董事姓名。公司团队页称核心团队来自 Microsoft、OPPO 和 Xpeng，但除 CEO 外没有列出任何个人。这形成关键人集中风险：如果 CEO Guo Yandong
              无法履职，AI² 将面临领导连续性危机，且外部无法识别公开的二号人物。它也限制投资人尽调——缺少具名高管，使外部无法验证所称专业能力、评估组织深度，或判断团队成员前雇主带来的利益冲突暴露。品牌冒用事件（2025
              年 5 月针对一家武汉实体使用混淆性相似企业名称的法律声明）确认 AI² 品牌既有价值也受到争夺，但同时暴露了 IP 执法成本；在这个阶段，资本本应优先投向 R&D 和产能扩张。


              生产扩张在多个层面引入执行风险。从 1,000 台 / 年提升到 10,000 台 / 年——AI² 给出的 2026 年目标——需要同时扩张供应链、认证执行器供应商、以 10× 数据吞吐部署 GOVLA
              模型、扩张工厂现场，并以 AI² 运营历史中没有先例的速度完成企业客户上线。2033 年达到年产 100 万台的目标，是当前产能的
              1,000×；即便可以实现，也意味着当前任何一轮融资都无法支撑到底的资本需求和组织复杂度。
