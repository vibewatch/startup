          - type: callout
            title: Unitree UniStore 应用生态是 AI² 平台层的长期威胁
            body: >
              Unitree 推出 UniStore——被称为全球首个人形机器人应用商店——说明其意图不只是掌控硬件， 还要掌控软件和应用分发层。如果第三方开发者为 Unitree
              生态构建应用，企业买方的切换成本会从硬件转向软件； 除非 AI² 建起可比开发者生态，否则会处于劣势。AI² 开源 FIS-VLA 带来一定开发者可信度，
              但还不构成已部署的应用平台。这一动态类似手机市场从硬件差异化走向平台锁定的转变； 它能否在人形机器人中发生，取决于软件成熟度和企业部署规模，而截至 2026 年中，两者都尚未得到证明。
            calloutType: insight
            claimRefs:
              - CP007
              - CP040
              - CP041
          - type: callout
            title: AI² 开源 FIS-VLA 提供开发者可信度和差异化信号
            body: >
              AI² 决定在 GitHub 开源 FIS-VLA，加上 Yann LeCun 的公开背书，在全球 AI / 机器人研究社区中形成了可见的差异化信号。
              竞争公司若没有同等模型质量和透明度，很难复制这条护城河——UBTECH 和传统工业玩家没有可比的开源 VLA 贡献。 Meta 首席 AI
              科学家的背书也以营销口径无法做到的方式验证了技术架构，可能加速企业采购信任。 这条护城河能否持久，取决于 AI² 能否持续产出研究级 VLA 成果，并维持活跃开发者社区；两点都无法从公开数据确认。
