      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              中国企业人形机器人需求呈现清晰的三方结构。买方与付款方通常是大型工业企业中负责制造运营、供应链或资本开支规划的负责人，
              有权批准跨多年周期、金额达数百万元人民币的资本支出。用户是工厂一线自动化团队——自动化工程师、机器人操作员和维护技师， 他们把机器人接入生产单元，并每天与其交互。付款方通常与买方同属一家企业，因为 AI²
              的商业合同采用多年期供货协议， 而非 as-a-service 模式；HKC 三年 1,000 台合同和 Dongfeng Liuzhou Motor 试点都体现了这一点。 从 AI²
              已披露客户基础和行业轨迹看，主要买方分层包括：汽车 OEM 与 Tier-1 供应商（Dongfeng Liuzhou Motor）、 显示与半导体制造（HKC、JingNeng
              Microelectronics）、制药与生物科技（Huaxin Bio）， 以及更广泛的先进制造，包括消费电子、新能源电池和物流。CRRC Capital 的投资也暗示未来可能进入基础设施
              和维护密集型工业场景。企业买方的采用触发点主要由 ROI 驱动：当一台人形机器人在规模化单位任务上的全负荷成本 （资本 + 集成 + 维护 + 停机风险）低于等效人工成本时，采购才说得通。按 2025–2026
              年通用人形机器人 每台 50,000–150,000 美元的当前基准价格，若没有公开单位经济性披露，回本周期仍不清楚。 CRRC Capital
              参投和中国十五五规划指令所释放的信号表明，国有及国家相关企业买方可能受到政策引导， 采用国产人形机器人，从而形成一个可能独立于纯 ROI 分析的需求底座。
