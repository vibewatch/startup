      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              中国人形机器人市场的增长命题建立在政策强化的结构性宏观驱动和快速成熟的技术能力之上； 但多项实质约束会限制近期采用速度，并给前二双寡头之外的玩家带来风险。关键增长驱动包括：
              （1）政策要求——中国十五五规划（2026–2030）把机器人置于现代产业体系核心，引导 AI 研究走向物理应用， 并将机器人定位为主要经济驱动，给国家相关买方提供制度顺风，降低采用摩擦。（2）自动化密度空间——
              中国机器人密度为每万名制造业工人 166 台，韩国为 1,220 台、德国 449 台、日本 446 台、美国 307 台； 相较最佳实践自动化强度，中国存在结构性 7
              倍差距，增量采用需求还有很长跑道。（3）资本集中—— 至少五家中国具身智能公司各自融资超过 2.10 亿美元；中国机器人投资约为欧洲同业的 5–6 倍， 支撑 R&D
              和商业化吞吐。（4）技术栈成熟——AgiBot 的真实世界强化学习系统在复杂操作任务中把成功率从约 8% 拉升到 60%，正在缩小可靠性缺口。（5）EV 制造顺风——中国 EV 生产中的 cobot
              采用连续两年跑赢更广市场， 让先进机器人企业采购流程常态化，人形机器人厂商可借势。关键约束包括：（1）ROI 不透明——没有公开平均售价
              或生命周期成本数据，企业买方无法独立建模回本周期。（2）市场集中——Unitree 和 AgiBot 预计将拿下 2026 年中国人形机器人出货约
              80%，让小玩家面对结构性收入和规模劣势。（3）可靠性底线——60% 任务成功率 远低于工业规模无人值守生产部署所需的 99%+。（4）竞争升级——Tesla Optimus Gen 3 可能在 2026
              年下半年量产， Boston Dynamics Atlas 商业部署也构成全球竞争压力。（5）标准缺口——截至 2026 年 6 月，中国尚未形成
              面向生产环境中全尺寸双足人形机器人的正式国家安全认证标准，给企业采购方带来监管不确定性。（6）行业洗牌风险—— CEO 郭彦东在 2026 年 2 月承认「行业洗牌已经开始」。
