  - id: TM001
    title: 市场定义和边界
    columns:
      - 细分 / 类别
      - 纳入支出
      - 剔除支出 / 邻近领域
      - 现状替代方案
      - 与 AI² Robotics 的相关性
    rows:
      - - 企业级 AI 原生人形机器人（双足或轮式）
        - 机器人硬件；自研 AI / VLA 软件栈；系统集成；多年商业合同；维护和支持
        - 传统固定机械臂工业机器人；AGV；消费 / 娱乐机器人
        - 工厂人力；带治具的固定机械臂工作站；外包制造
        - 核心目标细分；AI² AlphaBot 2（双足，22 DOF）在这里直接竞争
      - - 协作机器人（cobots）
        - Cobots 以更低成本处理重复性拾取和放置；越来越多地由与人形机器人相同的企业买家采购
        - 排除在人形机器人 SAM 之外；买方决策流程和用例不同
        - 在更简单、结构化任务上，cobots 本身就是人形机器人的替代品
        - 邻近竞争压力；cobot 采用让企业采购先进机器人这件事变得常态化
      - - 工业 AI 软件平台和机器人编排
        - 与人形硬件一起销售的 AI 推理、仿真、数字孪生和 fleet-management 软件
        - 不随硬件销售的独立工业软件（ERP、MES 系统）
        - 传统工厂自动化软件；人工监督
        - 邻近赋能层；AI² 将 Alpha Brain 模型与硬件打包，可能成为 SaaS 加售入口
      - - 具身 AI 通用移动操作平台（轮式）
        - Galaxea G0 Plus、X Square Robot 等轮式双臂平台；属于同一批企业买家讨论范围
        - 仅限严格双足机器人；轮式平台服务重叠但不同的细分场景
        - 单臂 cobots；具备灵巧操作能力的人类装配工
        - 仓内物流和简单装配中的直接形态竞争者；部署复杂度低于双足机器人
      - - 服务和物流机器人（非操作类）
        - 用于运输、没有灵巧操作的 AMR 和 AGV
        - 排除在人形机器人 SAM 之外
        - 传送带；人工叉车司机；自动叉车
        - 不属于 AI² 范围；列入此处是为了明确划定边界
      - - 人力（现状基准）
        - 按中国工厂工资水平计算的人工成本；灵活、灵巧、无前期 capex
        - 不是机器人支出类别；作为参考基准纳入
        - 人力是主要替代方案，也是所有机器人部署的 ROI 基准
        - 在半导体洁净室、电子装配和汽车车身车间替代人工的经济性，决定 AI² 的企业销售周期长度和合同规模
    notes: >-
      不同分析机构的范围定义各不相同：MarketsandMarkets 的人形机器人市场数字可能包含轮式移动操作平台，而 TrendForce 的出货数据覆盖全部 AI 赋能双臂平台。IFR World Robotics
      数据只覆盖传统工业机器人，并未单独拆分人形机器人类别。这里将 AI² 的 SAM 界定为企业级、AI 原生子细分，而非整个中国工业机器人市场。现状替代方案因工厂而异，并决定每个企业垂直领域的销售周期动态。
