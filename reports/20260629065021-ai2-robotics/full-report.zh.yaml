          - type: callout
            title: 市场集中、ROI 不透明与标准缺口是近期采用的实质约束
            body: >-
              三项约束结构性限制了中国近期人形机器人采用。第一，市场集中：Unitree Robotics 与 AgiBot 预计将在 2026 年合计拿下中国人形机器人出货约 80%，AI²
              和其他所有供应商最多只能争夺一个目前估计为 4.0 亿美元市场中的 20%——这意味着 2025–2026 年 AI² 的收入上限最多也只是数千万美元量级。 第二，ROI
              不透明：没有中国人形机器人厂商披露平均售价、生命周期成本结构或企业回本数据， 大规模企业采购很难自证合理。第三，监管缺口：截至 2026 年 6 月，中国尚无面向生产环境中全尺寸双足人形机器人的
              正式国家安全与认证标准，企业采购方面临责任暴露。CEO 郭彦东在 2026 年 2 月的文章也承认「行业洗牌已经开始」， 表明竞争整合将在 2026–2027 年加速。
