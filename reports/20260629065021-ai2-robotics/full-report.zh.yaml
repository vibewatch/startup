        blocks:
          - type: paragraph
            body: >
              AI² Robotics 主要通过多年期商业合同，向企业直接销售 AlphaBot 2 机器人硬件来变现。 目前没有公开确认的软件-only、SaaS 或轻资产收入流，尽管公司的官方产品文档把 GOVLA /
              Alpha Brain 列为潜在授权层。按硬件销售惯例，收入预计在机器人交付并验收时确认；经常性服务收入（维护、模型更新）尚未披露。 公司不公布标价。基于商业上类似的企业部署——西方市场 Agility
              Robotics 的 Digit 机器人约 150,000 美元 / 台， Unitree 的 G1 作为更轻、更简单的研究级平台为 13,500 美元——AlphaBot 2 的企业 ASP 估计为 人民币
              200,000–500,000 / 台（约 28,000–70,000 美元），但该区间未经确认。最强的公开商业信号是 HKC（惠科，全球第三大 LCD 面板制造商）三年 1,000 台 AlphaBot 2
              合同；公司将其称为中国最大非展示型 商业人形机器人订单。其他已确认客户关系包括 Dongfeng Liuzhou Motor（汽车，2025 年 6 月起战略合作）、 Huaxin Bio（生物科技，2025 年
              4 月宣布战略合作）和 JingNeng Microelectronics（半导体制造）。 中国一线城市机场行李车搬运试点和北京、深圳「智魔方」模块化 AI 空间部署，代表公共服务部门探索。
              公司官方关于页面称其「订单量和场景覆盖领先」——这是公司自行陈述，缺少订单数量或收入金额的独立佐证。 公司未披露 ARR、GMV 或单元出货数字。
