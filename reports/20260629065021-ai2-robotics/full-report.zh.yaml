  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 中国直接竞争格局
        blocks:
          - type: paragraph
            body: >
              2026 年，中国人形机器人领域由 Unitree Robotics 和 AgiBot（Zhiyuan Robotics，智元机器人）主导； 根据 TrendForce 2026 年 4
              月预测，两者合计约占国内人形机器人单元出货 80%。Unitree Robotics 成立于 2016 年，总部位于杭州，靠激进的硬件商品化建立位置：G1 人形机器人（132 cm、约 35 kg， 23–43
              DOF，取决于配置）起售价约 $16,000，是全球价格最低的全能力人形机器人。H1 和 H1-2 则延伸到要求更高的工业场景（H1 约 180 cm、约 47 kg、步速 3.3 m/s；H1-2 约 178
              cm、约 70 kg、 27 DOF）。Unitree 还提交了境内 IPO，推出被营销为全球首个人形机器人应用商店的 UniStore 应用生态平台， 并发布起售价 $3,930 的双臂上半身 R1
              单元，覆盖更低成本操作用例。AgiBot（Zhiyuan Robotics）于 2023 年在上海成立，采取相反路径：围绕五个产品平台重投 AI 架构。A2 全尺寸人形机器人（175 cm、55 kg、 49+
              DOF、200 TOPS AI 算力、350 N.m 峰值关节扭矩、7 km/h 行走速度）和工业 G2（搭载 NVIDIA Jetson Thor T5000，板载 2,070 TFLOPS，配有自研
              WorkGPT 任务模型和 GO-1 / GE-1 任务 / 世界执行模型） 代表中国算力最密集的人形机器人平台。AgiBot 公开目标是在 2027 年实现超过人民币 100 亿元 （约 14.6
              亿美元）收入，并已在 Longcheer Technology 的消费电子制造线上部署 Real-World Reinforcement Learning 系统。UBTECH
              Robotics（优必选）是国内最老牌玩家，也是唯一上市公司（HKEX: 9880）， 已与 Hitachi 合作把 Walker S2 工业人形机器人部署到制造业，并推出消费品牌 Uworld，释放多元化信号。
              Galbot（银河通用机器人）和 Galaxea AI 是更早期的国内创业公司，其商业部署在公开记录中仍有限且未经验证。
