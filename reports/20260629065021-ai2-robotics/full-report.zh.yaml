companyProfile:
  summary: >-
    AI² Robotics（智平方科技）是一家中国具身智能机器人公司，2023 年 4 月由 CEO 郭彦东博士创立。 公司把自研视觉-语言-动作模型栈（Alpha Brain /
    GOVLA）、全栈人形机器人硬件和企业直部署结合起来， 主攻工厂自动化与公共服务流程。旗舰产品 AlphaBot 2 已面向汽车、半导体、生物科技、零售和服务场景营销， 公司称已建成生产线，并拿到 HKC 三年 1,000
    台机器人标志性订单。AI² 于 2026 年 2 月完成 B 轮融资， 估值约 14 亿美元，但仍未披露收入、利润率或现金消耗数据，商业规模和单位经济性因此成为尽调核心缺口。
