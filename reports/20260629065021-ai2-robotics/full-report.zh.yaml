      - number: '5.4'
        title: 遥操作、训练数据与学习流水线
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 提供两类遥操作设备，用于采集示教数据和支持远程操作。VR Teleoperation 系统通过末端执行器逆运动学驱动机器人——操作员佩戴 VR
              头显，用手柄指定手部位姿，机器人的逆运动学求解器再寻找关节解。该方案便携、部署快、成本更低，但运动学奇异点会带来求解不稳定，长时间操作也容易造成眼部疲劳。适用场景偏向演示、展会和简单移动任务。Exoskeleton
              Teleoperation 系统使用与 AlphaBot
              手臂结构相同的可穿戴机械臂（关节空间驱动），直接映射操作员关节角度。它提供高精度、自然力反馈，并避免不可解运动失败；代价是硬件重量高、调试复杂、成本更高。更适合固定场地的高精度数据采集、PCB
              上料和安全关键环境。数据—业务双闭环是 AI² Robotics 迭代策略的底层逻辑：每一次商业部署都会产生真实世界示教片段，经由自研增量训练流水线在 1,000-GPU 集群上持续微调
              GOVLA，进而提升同一场景和相邻场景的模型表现。按下绿色拖动示教按钮后，机械臂也可通过运动示教学习，无需遥操作配置就能快速在现场编排技能。AI² Robotics
              明确称，其数据基础设施借鉴了搜索引擎规模互联网公司的数据飞轮。
            claimRefs:
