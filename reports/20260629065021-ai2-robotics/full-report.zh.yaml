      - number: '2.2'
        title: 市场规模——多重口径与矛盾
        blocks:
          - type: paragraph
            body: >
              中国人形机器人子市场没有单一权威规模数字；公开估计在范围定义、方法论和地理切分上并不一致， 直接比较并不合适。四个规模测算视角揭示了不同侧面。（1）出货量展望：TrendForce（2026 年 4 月）
              预计中国人形机器人产量将在 2026 年同比激增 94%，Unitree 与 AgiBot 合计拿下约 80% 总出货量—— 这意味着剩余玩家最多只能争夺 20%
              产出。（2）收入预测：MarketsandMarkets 估计中国人形机器人市场 2025 年为 4.0 亿美元，到 2030 年增至 28.0 亿美元，CAGR 为 47.6%。其全球市场估计从 2025 年
              29.2 亿美元增长到 2030 年 152.6 亿美元，CAGR 为 39.2%；按该机构定义，中国 2025 年约占全球人形机器人收入 14%。（3）整体工业机器人背景：IFR 报告称，2024 年中国安装
              295,000 台工业机器人，占全球市场份额 54%—— 这一市场由传统机械臂主导，并未单独拆分人形机器人。若人形机器人占装机基数不到 1%，则 2025 年 4.0 亿美元收入对应几千台、单台平均售价
              50,000–150,000 美元的规模，这一范围与可得竞品定价信号一致。 （4）投资信号视角：至少五家中国具身智能公司迄今各自融资超过 2.10 亿美元，其中 X Square Robot 两年内累计超过
              4.00 亿美元——这说明 VC 预期三到五年内会出现大得多的市场，但也显示当前单位经济性尚未成熟时已过度融资。 矛盾很多：TrendForce 的产量指标很可能统计所有 AI
              驱动的轮式和双足机器人；MarketsandMarkets 可能使用更窄定义； IFR 根本不拆分人形机器人。AI² Robotics 的 SAM 和 SOM 都无法从公开数据中可靠剥离， 任何单点 TAM
              估计都应视为方向性指示，而非精确分析。
