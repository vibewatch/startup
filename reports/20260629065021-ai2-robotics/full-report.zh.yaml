      - number: '4.3'
        title: 成本结构、单位经济性与生产资本开支
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2 的物料清单由 NVIDIA Jetson AGX Orin 64GB 计算模块、三枚 Intel RealSense D435 RGB-D 摄像头、 两枚 D405 近距摄像头、2D
              LiDAR、22-DOF 精密执行器系统（工业级关节电机，膝关节峰值扭矩 436 Nm， 腰部俯仰 207 Nm）、48V / 30Ah 电池包和双轮差速底盘构成。基于嵌入式 AI
              模块和精密执行器的商业组件价格基准， 总 BOM 估计为人民币 100,000–200,000 / 台（约 14,000–28,000 美元）——如果企业定价不足以覆盖直接材料加装配，
              毛利率存在被压缩的风险。AI² 称核心部件 MTBF 为 50,000 小时，这类可靠性工程投入本身也提高了部件质量门槛和成本。 R&D 成本方面，公司运行用于 GOVLA 模型训练的「千卡 GPU
              计算集群」——这是显著的持续基础设施成本； 在小装机基数下，会推高摊到每台设备上的 R&D 费用。公司还在 GOVLA VLA 模型构建中使用 DeepSeek 技术，
              表明存在外部模型依赖，可能带来授权或算力开销。从 1,000 台 / 年扩大到 10,000 台 / 年， 意味着工厂工装、质量控制自动化和精密部件供应链锁定都需要大量资本开支。AgiBot 的轨迹——2026
              年初约三个月内 从 1,000 台扩到 5,000 台再到 10,000 台——展示了人形机器人快速扩产在运营上是什么样子， 尽管 AgiBot 的生产模式可能不同。Unitree 的 STAR market
              IPO 招股书（TrendForce 2026 年 4 月引用） 披露，2025 年人形与四足机器人合并毛利率为 60%，说明在足够规模下，硬件毛利可以健康； 但 Unitree 成本更低的
              G1（$13,500）有利于混合毛利，AI² 更高规格的产品组合不能直接类比。 CEO 明确提醒，消费机器人市场至少未来五年仍不可行，把收入预期牢牢锚定在合同金额更大但周期更长的企业端。
