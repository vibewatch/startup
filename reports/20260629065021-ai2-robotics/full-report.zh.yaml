      - number: '6.3'
        title: 市场位置、竞争压力与反向信号
        blocks:
          - type: paragraph
            body: >
              TrendForce 2026 年 4 月数据显示，Unitree Robotics 和 AgiBot 合计约占中国人形机器人产出市场的 80%，AI² Robotics
              与较小同业一起留在竞争激烈的少数阵营。CEO Guo Yandong 在 2026 年 2 月署名文章中承认“行业洗牌已开始”，这是一种坦率表态，说明公司层面已经感受到竞争压力。TheRobotReport 的
              2026 年中国机器人展望明确把“显著竞争压力”列为当年主导主题。


              IFR 报告称，中国 2024 年安装了 295,000 台工业机器人，占全球市场
              54%——这是一个宏观指标，说明底层工厂自动化市场规模大，结构上也愿意接纳下一代人形机器人部署。不过，这股广泛市场顺风同样惠及所有机器人竞争者。Crunchbase 数据显示，仅 2026 年 3 月中国就新增
              6 家机器人独角兽，反映资金充裕的竞争者和投资人兴趣同步涌入；这既验证了赛道，也让赛道更拥挤。


              HKC 客户集中度是当前客户画像中最大的收入风险。如果 1,000 台 HKC 订单构成 AI² 已确认早期收入的大部分，任何交付失败、验收争议或客户流失都会产生重大影响。五个具名账户中有三个只是合作
              MOU，没有承诺台数，说明 HKC 之外的收入基础尚未确认。MOU 转采购订单的转化率，是接下来最关键的前瞻指标。
