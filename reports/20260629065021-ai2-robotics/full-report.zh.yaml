      - number: '7.3'
        title: 监管、政策、安全与责任风险
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 未公开披露 AlphaBot 2 的任何产品安全认证。截至运行日期，公司官方文档或新闻稿均未引用中国 GB/T 机器人安全标准备案、ISO 10218（工业机器人安全）、CE
              标志或同等国际认可安全评估。考虑到 AI² 所处阶段，这不一定构成淘汰项——中国人形机器人专门安全标准仍在 MIIT 的 2023 Humanoid Robot Innovation Development
              Guidance 下起草——但它留下了潜在责任缺口：若 AlphaBot 2 造成工厂工人人身伤害，缺少认证安全框架会使公司面临产品责任索赔、监管调查和与事故严重性不成比例的声誉损失。


              数据治理带来并行监管风险。AlphaBot 2 进行实时视觉和环境感知；GOVLA 模型会摄入工厂现场视频、空间数据，以及可能来自人类工人的生物识别接近数据。中国 Personal Information
              Protection Law（PIPL，2021 年 11 月生效）规制个人信息的收集、处理和跨境传输。如果 AlphaBot 2
              的数据采集流水线捕捉到工人生物识别、面部识别或行为数据——考虑到机器人的全身视觉栈，这是合理可能——合规就需要成文同意框架、数据影响评估，甚至可能需要个人信息保护负责人。公司官方文档没有回应这些义务。中国
              Interim Measures for Generative AI Services（2023）还规制嵌入式 LLM 的训练数据和输出安全，适用于 GOVLA 模型的语言指令层。若未维持合规的生成式 AI
              服务备案，AI² 可能面临中国 Cyberspace Administration（CAC）的监管行动。


              出口管制和军民两用风险是双向的。AI² 一方面面临美国 BIS 管制带来的上游芯片供应风险（见第 2 节），另一方面，如果机器人被归类为两用品，其向非中国司法辖区出口 AlphaBot 2 或 GOVLA
              模型权重，可能受中国 Export Control Law（2020）约束；因含有 NVIDIA Orin，也可能触发美国再出口管制。2026
              年，两条出口通道在法律上都仍不明确，形成合规陷阱；若无法律结构设计，国际扩张可能被冻结。政府政策支持——MIIT 将人形机器人列为战略性新兴产业、CRRC
              共同投资、深圳地方补贴——目前有利，但也带来自身风险：政策优先级可能变化，补贴可能撤回，国资背景投资人（CRRC、Guotai Haitong）也可能形成治理影响，使未来国际融资或 M&A 交易复杂化。
