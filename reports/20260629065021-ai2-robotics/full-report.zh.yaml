      - number: '5.3'
        title: 硬件平台与组件规格
        blocks:
          - type: paragraph
            body: >-
              AlphaBot 2 的机械设计围绕三关节折叠升降腿结构、腰部偏航和双轮差速驱动展开，腿部 / 腰部共有 7 个执行器。每条手臂从肩到腕提供 7 DOF，关节范围从肩部 ±178° 到 J7 的 -26° 至
              120°。单臂额定载荷为 4 kg，工作半径 723 mm；重复定位精度为 ±0.1 mm，已经能与中端协作机器人手臂竞争。每条手臂内置六轴力 / 力矩传感器（200 N 力、7 Nm
              力矩范围），支持柔顺控制和碰撞检测，服务安全人机协作。关节峰值扭矩从颈部俯仰的 3.3 Nm 到膝部的 436 Nm 不等，接近工业机器人执行器选型。计算栈运行在 NVIDIA Orin AGX 64GB
              上：2,048 核 Ampere GPU、12 核 ARM Cortex-A78AE CPU、2× NVDLA v2 深度学习加速器、64 GB LPDDR5（204.8 GB/s 内存带宽），AI 性能最高
              275 TOPS。连接接口包括 Ethernet、RS485 和 CAN bus。开发者通过 AlphaBotCore SDK 接入，语言支持 Python、C 和 C++。电池为 48V/30
              Ah，额定连续运行 4–6 小时。核心组件 MTBF 评级为 50,000 小时，面向工业级可靠性。运行环境为 5–40°C、10–80% RH。
