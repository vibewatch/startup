  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 将 AlphaBot 系列定位为继智能手机、智能汽车之后的第四代智能终端。目前已出货的 SKU 是 AlphaBot
              2：一款轮式双臂人形机器人，面向受控的工业和公共服务场景提升生产力。它没有采用完全双足形态，而是用双轮差速底盘牺牲爬楼能力，换来运行稳定性、更低制造复杂度，以及平地最高 1.5 m/s 的速度（坡度容忍
              0°–5°）。机器人集成 4 个 Intel RealSense D435 RGB-D 摄像头，提供全向感知；两个腕部 D405 摄像头负责近距离手眼引导。其具身 AI 层以 Alpha Brain 为品牌，基于
              NVIDIA Orin AGX 64GB 模块在机身本地运行，不依赖云连接，也保护客户数据。当前产品线包括机器人本体、Alpha Brain 模型、AlphaBotCore SDK，以及 VR
              和外骨骼两类遥操作外设。目标垂直行业包括汽车制造、半导体晶圆厂、生物技术 / 制药洁净室，以及机场等公共服务场所。管理层明确将进入消费家庭的计划推迟到约 2031 年。
