      - number: '5.5'
        title: 制造栈与现场部署成熟度
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 于 2025 年 9 月启动自有产线，额定年产能 1,000 台。公司给出的目标是在 2026 年底前扩至年产 10,000 台，12 个月内扩张 10 倍。2025 年 4
              月更早的公开表述曾把 10K/年目标放在 2028 年，说明 Series B 融资后节奏有所提前。公司把制造野心概括为打造“机器人 OEM”，类比电动车里的 BYD——控制硬件设计、制造和交付集成。截至
              2026 年中，商业部署覆盖四个工业垂直场景：汽车制造装配线、半导体晶圆厂（Geely Technology 旗下 JingBo Micro）、生物技术洁净室（HuaXi
              Biotech）和公共服务场所（一线城市机场行李车管理）。锚定合同是与 HKC（华科，全球第三大显示面板制造商）签订的 1,000 台、三年框架协议，管理层称其为中国最大非展示型商业人形机器人订单。Peking
              University–AI² Robotics 具身 AI 联合实验室于 2025 年 4 月成立，为公司提供研究管线和人才入口。部署成熟度在结构化工业环境中最强：机器人 0–5°
              的坡度限制和轮式底盘排除了非结构化楼梯或户外使用；当前商业 SLA 和保修结构尚未公开披露。
