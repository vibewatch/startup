      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 中国十五五规划与自动化密度空间共同塑造结构性有利市场
            body: >-
              中国十五五规划（2026–2030）明确把机器人列为现代产业体系的核心驱动，并引导 AI 研究走向物理应用。 再叠加每万名制造业工人仅 166 台机器人的密度，而韩国为 1,220 台——存在 7
              倍结构性差距—— 中国人形机器人市场的宏观顺风位居全球前列。至少五家中国具身智能公司各自融资超过 2.10 亿美元， 市场也已出现首批披露的工业规模商业合同（AI² 的 HKC 订单；AgiBot 的
              Longcheer 部署）。 技术能力推进速度快于企业销售周期，单次部署中的操作成功率已从 8% 加速到 60%。对 AI² 而言， 其披露的客户垂直领域（汽车、半导体、制药）与最高 ROI
              的人形机器人部署用例在商业上匹配。
