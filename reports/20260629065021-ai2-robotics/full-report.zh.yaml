  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 投资论点
      - 强度
      - 反论点
      - 解决条件
    rows:
      - - HKC 1,000 台订单是中国规模最大的有约束力人形机器人商业合同
        - 强——有约束力，多年期
        - 唯一有约束力合同；HKC 交付里程碑、ASP 和验收条款未披露
        - HKC 确认 2026 年 Q3 交付里程碑
      - - Baidu Venture 领投 + CRRC Capital 入局，显示战略分销深度
        - 中等——高质量投资团
        - 战略投资者相较财务投资者可能拥有优先权和信息优势
        - 披露股权结构和优先权堆栈
      - - GOVLA / Alpha Brain 是差异化 VLA 模型，拥有专有数据集
        - 中等——公司主张，未验证
        - Physical Intelligence π0.7 和 AgiBot WorkGPT 分别代表西方和中国 VLA 替代方案；GOVLA 基准测试为自报
        - 独立第三方基准审计
      - - 中国「十五五」规划要求机器人产业规模化部署
        - 强——政策支持需求
        - 政策支持市场形成，但不会把市场份额分配给 AI²；Unitree 和 AgiBot 拥有同等进入机会
        - 政策指引明确提及 AI² 为优先供应商
      - - 全球机器人市场从 $108B 增至 2035 年 $416B，形成结构性顺风
        - 强——宏观背景
        - 人形机器人子赛道只占整体机器人市场很小一部分；结构性顺风会同等惠及 20 多家已融资竞争者
        - AI² 证明 SAM 获取高于行业平均
      - - CRRC Capital 入局，标志着首家国有重工业 VC 进入中国人形机器人
        - 中等——暗示铁路和基础设施部署路径
        - 铁路 / 基础设施垂直场景部署仍属推测；未宣布与 CRRC 的 MOU 或试点
        - CRRC 试点公告或部署 MOU
      - - 12 个月 12 轮融资，反映投资者需求持续
        - 弱——也可能反映快速稀释式融资周期
        - 异常节奏更像高烧钱或结构化资本提款，而非自然里程碑
        - 披露每轮规模和资金用途
    notes: 论点强度仅基于可公开验证的证据。反论点假设无法取得非公开数据。
