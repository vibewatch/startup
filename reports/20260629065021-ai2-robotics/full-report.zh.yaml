      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 判断：估值偏紧——继续研究立场
            body: >-
              AI² 2026 年 2 月 USD 1.4 billion 估值处于同业中位数，但没有财务披露作为锚点。建议立场是 RESEARCH_MORE：在没有资料室访问、且不能解决五个尽调问题中至少三个（收入 /
              毛利率、HKC 交付里程碑、股权结构表、GOVLA 审计、客户管线）前，不应按当前条款投资。若估值压缩到 $1.0B 以下，或 Series C 定价时披露收入、可做常规倍数分析，可更积极地重新评估。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV034
              - CV041
          - type: callout
            title: 反向信号：VLA 训练数据稀缺与 Physical Intelligence 前沿威胁
            body: >-
              CB Insights 2026 年 6 月对 YC Winter 2026 批次的分析认为，physical AI 训练数据稀缺是人形机器人部署的首要系统性瓶颈。这不是 AI² 特有风险——它影响
              Physical Intelligence、AgiBot 和每一家 VLA 竞争者——但会直接削弱多头情景中的时间线假设，也削弱 GOVLA
              作为护城河的持久性，因为该护城河依赖生产环境中自有具身数据的累积，而这种规模化生产部署尚未得到确认。
            calloutType: risk
            claimRefs:
              - CV027
              - CV031
              - CV044
          - type: callout
            title: 关键假设：用 HKC 订单价值作为收入代理
            body: >-
              整个估值分析只用 HKC 1,000 台、三年采购订单作为 AI² 的收入代理。假设 ASP 区间（每台 RMB 200K–500K）来自分析师基于同业定价数据的估算，AI² 或 HKC 均未确认。只要
              ASP、交付节奏或收入确认出现重大差异，上述所有倍数计算都会直接改变。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV008
              - CV050
