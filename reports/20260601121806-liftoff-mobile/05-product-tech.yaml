      - CE009
      - CE011
      - CE016
  - calloutType: insight
    title: Privacy-framework investment positions Liftoff ahead of mid-tier networks
    body: >-
      Liftoff's published SKAN 4.0 support, probabilistic attribution framework, ATT compliance, and DSA
      implementation represent multi-year engineering investment that most smaller mobile ad networks have not fully
      replicated in public documentation.
    claimRefs:
      - CE026
