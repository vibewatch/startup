  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: architecture-disclosure
      missingEvidence: >-
        Internal Cortex AI architecture including model versioning, inference latency targets, data pipeline design,
        training frequency, and disaster recovery configuration.
      whyItMatters: >-
        Buyers cannot assess platform reliability, scalability under load, or competitive durability without knowing
        the technical depth behind the Cortex AI marketing claims.
      diligencePath: >-
        Request architecture review documentation, ML platform design documents, and an infrastructure security
        review from Liftoff's engineering team during diligence.
      relatedQuestionRefs:
        - QE025
    - type: private-evidence-only
      severity: material
      topic: security-certifications
      missingEvidence: >-
        SOC 2 Type II, ISO 27001, or equivalent security certification; public status page or SLA commitment;
        incident history for the Vungle Exchange or Accelerate platforms.
      whyItMatters: >-
        Enterprise publisher and advertiser contracts routinely require certified security posture documentation.
        Absence of a public trust portal is a common gap for private AdTech companies but requires diligence.
      diligencePath: >-
        Request SOC 2 audit reports, penetration test summaries, and historical incident postmortems from Liftoff's
        security or compliance team.
      relatedQuestionRefs:
        - QE025
        - QE026
    - type: private-evidence-only
      severity: material
      topic: performance-validation
      missingEvidence: >-
        Independent validation of the 10% CPI reduction from GameRefinery taxonomy integration, the 10% fraud
        exclusion rate, and the 3-billion-device fraud-free database freshness and accuracy.
      whyItMatters: >-
        These figures appear in company marketing materials and an internal experiment blog post. An independent
        audit would substantiate the performance differential Liftoff claims versus open-exchange alternatives.
      diligencePath: >-
        Request the full experimental methodology for the GameRefinery ML integration experiment, fraud database
        update cadence, and false-positive exclusion rate audits from Liftoff data science and product teams.
      relatedQuestionRefs:
        - QE024
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: >-
        Published technical roadmap or timeline for adapting Liftoff's attribution infrastructure to Google's Privacy
        Sandbox on Android, including Protected Audience API and Attribution Reporting API integration plans.
      whyItMatters: >-
        If Google deprecates the GAID, Liftoff's Android campaign measurement capability is exposed to the same
        disruption that iOS 14 created for IDFA-based attribution. The company has acknowledged the issue but
        provided no public timeline.
      diligencePath: >-
        Ask Liftoff's product team for the Android Privacy Sandbox adaptation roadmap, current integration status
        with Privacy Sandbox APIs, and timeline for customer communication.
      relatedQuestionRefs:
        - QE017
    - type: private-evidence-only
      severity: minor
      topic: integrations
      missingEvidence: >-
        Full list of mediation platform partners for in-app bidding, MMP partners for postback attribution, and
        DSP integrations on the Vungle Exchange beyond those mentioned in passing.
      whyItMatters: >-
        Integration breadth affects publisher yield and advertiser reach; a complete partner list would help verify
        whether Liftoff's "all major mediation platforms" claim covers the specific mediation stack in use by
        diligence targets.
      diligencePath: >-
        Request a comprehensive partner integration list from Liftoff's business development or publisher operations
        teams, covering mediation adapters, MMP postback partnerships, and DSP connections.
      relatedQuestionRefs:
        - QE025
