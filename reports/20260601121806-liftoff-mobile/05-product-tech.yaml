  - calloutType: risk
    title: Architecture depth and security certifications are not publicly disclosed
    body: >-
      No public SOC 2, ISO 27001, or equivalent certification is referenced in any Liftoff material, and no status
      page, incident history, or SLA commitment is publicly available. This is common for private AdTech companies
      but is a diligence prerequisite for enterprise publisher and advertiser contracts.
    claimRefs:
      - CE030
  - calloutType: risk
    title: Key performance claims are self-reported without independent validation
    body: >-
      The 10% CPI reduction from GameRefinery taxonomy integration, the 10% fraud exclusion rate, and the
      3-billion-device fraud-free database are all company-published figures from internal experiments or marketing
      copy. Independent audits, third-party benchmarks, or published methodology have not been disclosed.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE021

