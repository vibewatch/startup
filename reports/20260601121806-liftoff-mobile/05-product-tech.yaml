chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Liftoff Mobile's platform spans six distinct product lines — Accelerate, Monetize, Vungle Exchange, Creative
    Studio, Intelligence, and Direct — all powered by the proprietary Cortex AI engine and anchored by the Vungle SDK,
    which reaches more than 150,000 apps and one billion users globally. The Cortex platform's differentiation lies in
    its closed-loop data flywheel connecting supply-side SDK signals, demand-side bid optimization, and creative ML.
    Public evidence supports the platform's technical depth on privacy-framework adaptation (SKAN 4.0, ATT, probabilistic
    attribution) and fraud prevention at scale, while independent validation of CPI reduction claims, formal security
    certifications, and detailed architecture documentation remain undisclosed.
sections:
  - id: product-portfolio
    title: Product portfolio in customer workflow terms
    body: >-
      Liftoff Mobile serves four distinct customer groups — mobile app marketers, agencies, demand-side platforms, and
      mobile publishers — through a portfolio of six product lines, each designed around a specific workflow need in
      the mobile growth stack. Accelerate is the demand-side user acquisition product that uses ML to target and bid
      for high-value users across major ad exchanges, offering ROAS, SKAdNetwork, app-to-web, promotional, and
      re-engagement campaign types. Marketers set a KPI target (CPC, CPI, CPA, ROAS, or pLTV), and Accelerate's Cortex
      AI engine automatically optimizes bids and creative selection in real time.

      Monetize is the publisher-side counterpart: it delivers ads from Liftoff's demand base to app inventory via the
      Vungle SDK, supports in-app bidding to replace manual waterfall management, and covers iOS, Android, Windows, and
      Amazon platforms. Vungle Exchange provides the programmatic exchange layer connecting Monetize supply to
      third-party DSPs, backed by the same Vungle SDK that powers direct SDK integrations in over 150,000 apps across
      more than 150 countries. Creative Studio pairs ML with human creative expertise to produce and iterate on video,
      interstitial, and user-generated content ads — using impression-to-install data to select the optimal creative
      per placement.

      Intelligence encompasses two analytics sub-products: GameRefinery for mobile gaming, which covers gameplay
      mechanics, meta-game features, IP usage, and live event analysis; and AppRefinery for consumer apps, which
      applies a motivational driver framework with 14 audience drivers to inform UA creative and retention strategy.
      Direct is a premium-inventory channel that routes marketer budgets exclusively to SDK-direct publishers, bypassing
      open-exchange intermediation for higher-quality placements. The Calm case study demonstrates a Liftoff Influence
      sub-product focused on influencer marketing ROI, which is not prominently featured in the main product portfolio
      pages and represents a potential additional product surface.
