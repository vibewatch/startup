  evidenceGaps:
  - type: missing-source
    severity: material
    topic: privacy-constraint
    missingEvidence: Google's Privacy Sandbox for Android deployment status, timeline, and advertiser adoption as of mid-2026; the official Privacy Sandbox page returned a 404 error during research.
    whyItMatters: Android is the higher-volume platform for mobile advertising globally; GAID deprecation would replicate ATT-level measurement disruption on Android, materially affecting Liftoff's optimization capabilities and competitive positioning relative to Google's own demand channels.
    diligencePath: Fetch current Google Privacy Sandbox for Android documentation directly; consult AppsFlyer or Adjust MMP technical update blogs on GAID deprecation readiness; request Liftoff's internal roadmap for Privacy Sandbox compliance.
    relatedQuestionRefs:
    - QM027
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: Liftoff Mobile's own revenue, market share within the independent mobile ad channel, and segment breakdown between gaming and non-gaming UA spend. No public filing or disclosed financial statement exists.
    whyItMatters: Without Liftoff's revenue, the SOM estimate remains entirely inferred from competitor disclosures and valuation multiples. The $4.3B valuation implies significant revenue, but the implied market share of the ~$13B independent channel is unverifiable.
    diligencePath: Request management disclosure of revenue range, gaming vs. non-gaming split, and retained publisher count; cross-reference with GP Bullhound or other secondary market data services.
    relatedQuestionRefs:
    - QM001
    - QM005
  - type: conflicting-data
    severity: minor
    topic: market-concentration
    missingEvidence: Independent corroboration of the 88% Google/Meta concentration finding; the Moloco study is self-interested (Moloco competes in the independent channel) and the methodology covers consumer apps only, potentially understating gaming-vertical concentration.
    whyItMatters: If the true concentration is lower (e.g., 75-80%), the independent channel SAM expands materially to $22–27B, changing the competitive opportunity assessment for Liftoff.
    diligencePath: Obtain Singular's standalone channel-mix research or AppsFlyer's Performance Index data on channel budget allocation; cross-reference with DSP bid-request volume across walled gardens versus open web.
    relatedQuestionRefs:
    - QM019
    - QM024
