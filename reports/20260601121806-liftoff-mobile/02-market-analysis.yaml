callouts:
- calloutType: insight
  title: Non-gaming IAP surpassing gaming is the defining 2025 market event
  body: For the first time in Q2 2025, non-gaming app IAP revenue surpassed mobile gaming globally ($21.1B vs ~$20B). This structural shift broadens the UA buyer pool beyond game developers and creates new demand for performance marketing platforms with non-gaming vertical expertise. Platforms historically over-indexed on gaming (like Liftoff's Vungle Exchange) must demonstrate competitive non-gaming demand supply.
  claimRefs:
  - CM007
  - CM012
  - CM023
- calloutType: risk
  title: 88% budget concentration in Google and Meta is a structural ceiling
  body: Moloco's August 2025 research found that 88% of consumer mobile app advertising budgets remain in Google and Meta. This concentration, if stable or growing, caps the total independent-channel SAM at approximately $13 billion globally — a finite pool contested by AppLovin, Unity, Moloco, Mintegral, and Liftoff simultaneously. If AppLovin's Axon AI platform continues taking share within this pool, Liftoff's addressable opportunity narrows further without a differentiated retention or non-gaming strategy.
  claimRefs:
  - CM010
  - CM013
  - CM040
- calloutType: risk
  title: ATT and SKAN complexity constrain iOS optimization and customer trust
  body: Apple's ATT framework reduced user-level attribution fidelity on iOS, and SKAN 4.0's crowd-anonymity thresholds limit data granularity for low-spend campaigns. Over one-third of app marketers in 2024 were unfamiliar with SKAN 4.0 — meaning platforms that abstract SKAN complexity gain a competitive advantage, while those that require manual SKAN configuration face buyer friction. Google's GAID deprecation via Privacy Sandbox may replicate this constraint on Android, the higher-volume platform.
  claimRefs:
  - CM031
  - CM033
  - CM037
  - CM038
- calloutType: strength
  title: Remarketing growth and retention economy favor full-stack platforms
  body: Remarketing's share of app marketing spend rose from 25% to 29% in one year (+37% in absolute spend to $31.3B). Platforms that serve both UA and re-engagement under a unified Cortex AI model — as Liftoff claims with Accelerate — are better positioned in a "Retention First" environment than point-solution UA-only networks, because the same audience graph and bid model serves acquisition and retention objectives.
  claimRefs:
  - CM002
  - CM028
  - CM029
- calloutType: assumption
  title: Independent channel SAM estimate assumes stable Google/Meta concentration
  body: The $13 billion independent SAM estimate assumes 88% concentration in Google and Meta persists through 2026. If regulatory action (DSA, antitrust), consumer sentiment, or algorithm failures shift even 5 percentage points of budget out of walled gardens, the SAM expands by approximately $5–6 billion. This sensitivity is not reflected in base-case sizing and represents material upside risk to independent platform market share projections.
  claimRefs:
  - CM010
  - CM036
  - CM040
