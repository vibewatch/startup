- id: sizing-gaps
  title: Sizing diligence gaps and contradictory estimates
  body: The market sizing analysis carries three material gaps. First, no independent analyst publishes a standalone estimate for "mobile app UA plus remarketing" as a distinct sub-segment; the $108 billion figure is derived from AppsFlyer's spend-share disclosure and may overcount by including walled-garden spend that is not addressable by independent networks. Second, the independent-channel estimate of approximately $13 billion is a residual derived from the 88% concentration figure sourced from Moloco's self-interested research; an independent corroborating estimate does not exist in the accessed sources. Third, Google's Privacy Sandbox Android deployment status as of mid-2026 is unknown from accessible sources (the privacy sandbox page returned a 404 error), creating measurement uncertainty for the Android portion of market sizing. These gaps should be addressed through primary research with MMPs (AppsFlyer, Adjust, Branch) and consultation with Liftoff management on their internal revenue-per-vertical breakdown.
