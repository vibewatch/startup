- id: buyer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'Liftoff''s four buyer segments differ significantly in budget ownership, decision process, and product requirements. Direct app advertisers — brands and studios operating mobile apps outside of gaming — hold their own UA budgets and select networks based on CPI/CPA benchmarks, ROAS curves, and MMP (mobile measurement partner) compatibility. Non-gaming advertisers are the fastest-growing buyer segment: 61% set more aggressive KPI targets in 2025, and non-gaming IAP revenue grew 23% year-over-year. This segment prioritizes scale, attribution fidelity, and creative performance.

    Mobile game developers are the historically dominant buyer segment and simultaneously serve as publishers (inventory sellers) monetizing their apps with in-app advertising. Their dual role as both buyer and seller creates a flywheel dynamic where UA spend efficiency depends partly on the quality of publisher-side yield optimization. Unity reported that 85% of top-100 mobile games use its growth solutions, indicating how deeply integrated specific platforms are in gaming workflows.

    Agencies aggregate spend across multiple brand clients and require API integrations, whitelabel reporting, and transparent pricing to justify their intermediary margin. DSPs (demand-side platforms) purchase inventory programmatically via OpenRTB auctions and require technical integrations with exchange supply rather than managed-service relationships. Publishers (app developers monetizing via advertising) are the supply-side constituency: they need SDK integrations, mediation stack compatibility, and fill-rate guarantees, making them buyers of Liftoff''s monetization products (Monetize and Vungle Exchange) rather than UA products.

    Budget ownership is primarily held by performance marketing teams within app companies for UA, with agencies holding proxy control for brand-allocated digital budgets. The adoption trigger for switching networks or adding a new channel is typically a ROAS shortfall on existing channels, new market expansion, or a privacy framework change that disrupts existing measurement (such as ATT on iOS).'
