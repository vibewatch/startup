  title: Advertiser adoption funnel — from budget allocation to scaled independent-channel spend
  type: funnel
  layout: standard
  summary: Five-stage funnel from initial channel exploration to scaled independent-channel spend; friction is highest at the attribution trust and SKAN compliance stages.
  data:
    items:
    - label: Channel discovery and benchmark interest
      value: 100
      detail: Advertiser identifies ROAS shortfall on Google/Meta or seeks emerging-market reach; initiates conversations with independent networks. Driven by Moloco-style research showing 88% concentration.
      tone: neutral
    - label: MMP integration and attribution setup
      value: 65
      detail: Network must be whitelisted by advertiser's MMP (AppsFlyer, Adjust, Branch). SKAN postback configuration required for iOS traffic. High drop-off among smaller advertisers lacking technical resources.
      tone: neutral
    - label: Pilot campaign with CPI/CPA guardrails
      value: 45
      detail: Advertiser runs limited test budget with strict CPA caps. Success metric is comparable or better ROAS versus Google/Meta control group within 30 days. Over one-third of marketers still unfamiliar with SKAN 4.0 at this stage.
      tone: positive
    - label: Attribution validation and ROAS confirmation
      value: 28
      detail: Moloco research found ROAS improvements up to 214% at Day 30 for diversified advertisers. Successful pilots convert to ongoing budget allocation. MMPs provide incrementality testing.
      tone: positive
    - label: Scaled ongoing spend and creative optimization
      value: 18
      detail: Advertiser integrates network into core media mix; creative rotation and bid strategy handed to platform AI. Retention First 2026 trend may expand re-engagement budgets alongside UA.
      tone: positive
  approximationNotes: Funnel stage values are ordinal weights for visualization only, not measured conversion probabilities. The drop-offs are informed by qualitative signals (MMP integration friction, SKAN adoption lag, pilot-to-scale conversion) from sourced reports; no quantitative funnel data was directly available.
