- id: growth-drivers
  title: Growth drivers
  body: 'Five structural tailwinds are expanding the mobile app performance marketing market. First, non-gaming app monetization is accelerating at a rate that outpaces gaming: non-gaming IAP revenue grew 23% year-over-year in 2024, non-gaming Q2 2025 IAP surpassed gaming for the first time ($21.1 billion versus $20 billion), and food-and-drink app revenue grew 44% year-over-year. This broadens the buyer pool well beyond gaming advertisers.

    Second, emerging markets are expanding the addressable install base. Southeast Asia''s digital economy is on track to reach $330 billion in 2025, smartphone adoption in Asia is projected to reach 94% by 2030, and iOS remarketing spend in Central Europe, Latin America, and Southeast Asia posted 100%+ year-over-year growth in 2025. India''s iOS UA spend grew 17% year-over-year despite an overall budget contraction, reflecting the rising premium-device tier.

    Third, generative AI is expanding both supply and demand. Sensor Tower measured nearly $1.3 billion in IAP revenue from AI chatbot and art-generator apps in 2024, and fifteen mobile app categories added AI-related features in their descriptions, generating new ad inventory and user-acquisition surface. AI is also the primary optimization lever for performance platforms, enabling better bid models, creative generation, and fraud detection.

    Fourth, remarketing is growing as a budget priority: its share of total app marketing spend rose from 25% in 2024 to 29% in 2025 (up 37% in absolute terms to $31.3 billion), driven by rising UA costs and the emergence of a "Retention First" economy. Gartner''s 2025 estimate that 80% of future mobile revenue will come from 20% of existing customers reinforces this reorientation of budget toward existing cohorts.

    Fifth, channel diversification beyond Google and Meta is gaining measured traction. Moloco''s 2025 research found ROAS improvements of up to 214% at Day 30 for advertisers that added independent channels, validated by Singular data over more than $5 billion in ad spend across 2,000+ apps in 2024.'
