- id: expansion-concentration-risk
  title: Expansion evidence is credible; concentration and channel-risk disclosure is absent
  body: >-
    Multiple case studies document budget expansion following initial campaign success, providing the clearest available proxy for healthy customer unit economics on the demand side. Ibotta scaled average daily spend 5.7x and subsequently launched re-engagement campaigns. Stash increased daily spend by 96.3% within one month with plans to optimize for LTV. Just Eat Takeaway.com expanded from a two-market pilot to six additional markets. Delivery Hero scaled Android spend by double digits in LATAM after incrementality confirmation. Acorns expanded from Android-only to include iOS after early campaign success. This pattern — initial deployment, measured outcome, budget increase, and cross-product or cross-platform expansion — is consistent across fintech, food delivery, and ride-hailing verticals, suggesting that marketers who achieve above-target results with Liftoff tend to expand rather than rotate budgets elsewhere.

    On the publisher side, ZiMAD grew Vungle's share of its Windows revenue from 5% to 40% over time (reaching 61% of Windows voice in Q4 2020), and Product Madness shifted its entire app portfolio to Vungle in-app bidding, representing primary monetization infrastructure rather than a test allocation. These are not pilot signals — they represent deep publisher dependency on Liftoff's monetization stack.

    Despite these expansion signals, the public record still leaves three risk-relevant data gaps. First, revenue concentration is entirely undisclosed: there is no public statement about top-customer revenue share, and whether any single advertiser or publisher exceeds 5-10% of revenue is unknown. Second, scale disclosure has improved but segmentation remains opaque: 2026 IPO summaries show more than 1,000 marketers, 167,814 integrated apps, and 384 $100K-plus core advertising customers, but they do not split direct advertisers from agency/DSP accounts, quantify active publisher customers by monetization surface, or disclose Intelligence subscribers. Third, the agency and DSP buyer segments — actively marketed on Liftoff's products page — still have zero named case studies, making their scale, margin profile, and retention dynamics effectively opaque. An investor still needs management access to underwrite concentration and segment durability.
