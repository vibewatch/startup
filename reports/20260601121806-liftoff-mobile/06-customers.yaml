- id: retention-durability
  title: Retention and durability — one public NDR datapoint, mixed reviews, and ATT-era attribution friction
  body: >-
    Liftoff's 2026 IPO summaries disclose one real durability metric: Quartr reports LTM Core Advertising net dollar retention of 130% as of March 31, 2026, alongside 384 customers contributing more than $100K of trailing core advertising revenue. That is the clearest public signal that Liftoff expands spend within its larger advertising cohort. Even so, disclosure is still partial. The company does not publicly disclose GRR, churn, cohort retention, contract length, or segment-level retention for marketers, publishers, or Intelligence users. The strongest remaining proxies are still indirect: explicit budget scale-up by named customers (Ibotta 5.7x, Stash 96.3%, Just Eat expansion to 8+ markets, Delivery Hero double-digit spend increase in LATAM), multi-year relationship language in case studies ("longtime partner for many years" — Delivery Hero), and named testimonials from Simon Hales, Victor Hernandez, and Sami Khan. These signals are encouraging but still non-representative relative to a platform with more than 1,000 marketers and a large long-tail of publisher apps.


    External review and ecosystem signals are mixed rather than uniformly positive. TrustRadius gives Vungle an 8/10 score across three reviews; buyers praise CPI-based buying, strong US inventory, and fast SSP integration, but also cite slow product evolution, slow responses to product questions, limited APAC scale, and the need to bid high CPMs with limited rebate flexibility. FeaturedCustomers aggregates 59 testimonials, 68 case studies, and a 4.8/5.0 score across 2,135 reference ratings for Liftoff, which reads as a broad positive reference signal but not as a rigorous NPS substitute because it is a testimonial aggregator rather than an audited satisfaction survey. On the publisher integration side, Google maintains an official AdMob mediation guide for Liftoff Monetize, Liftoff's help center documents AdMob in-app bidding setup, and PPC Land reported that Google expanded Liftoff's bidding support to open ads in 2025, showing mainstream mediation support. However, GitHub issues in Google's mediation adapter repository show real integration friction: one January 2025 report said the Vungle/Liftoff adapter took about 30 seconds to initialize, and a May 2026 issue flagged temporary retained-activity behavior during Liftoff Monetize initialization. These are integration complaints rather than evidence of broad customer churn, but they are still relevant adverse signals for publisher customers evaluating reliability.


    A structural adverse factor in Liftoff's customer environment is Apple's App Tracking Transparency (ATT) framework, effective April 2021 with iOS 14.5. ATT requires explicit user permission before any app or SDK can access the IDFA or link user activity across apps owned by different companies. This directly constrains the cross-app tracking that underlies Liftoff's programmatic UA and retargeting capabilities. Apple's developer documentation explicitly prohibits fingerprinting as an IDFA alternative. Delivery Hero's case study openly acknowledged that "data attribution became more limited in recent years" and used Liftoff's incrementality testing methodology as a supplement to MMP attribution — reflecting real measurement friction caused by ATT in a named production partner. The 2025 AppsFlyer top-5 data-trends report further documents that remarketing spend reached $31.3 billion in 2025, growing 37% YoY, suggesting that despite ATT constraints, demand for reengagement advertising that can leverage consented or first-party data remains robust.


    The 2025 AppsFlyer Performance Index shows that ad spend is concentrating at the very top tier of media networks: only 30% of sources ranked 11-20 saw year-over-year spend growth, compared to 60-80% of the top-10 players. Liftoff held top-10 AppsFlyer rankings as of H1 2024 (Performance Index 17) but does not appear in the top-five lists named in the 2025 index press release. This positioning — strong but not dominant — raises an unresolved question about whether spend consolidation at Apple Ads, Google, Meta, AppLovin, and TikTok creates renewal pressure on Liftoff's advertiser base over time.
