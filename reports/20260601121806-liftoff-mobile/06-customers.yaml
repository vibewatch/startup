localEvidence:
  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-nrr
    missingEvidence: Segment-level NRR, GRR, gross churn, cohort retention, and contract length for advertiser, publisher, and Intelligence customers remain undisclosed. The only public datapoint is 130% LTM Core Advertising NDR as of March 31, 2026.
    whyItMatters: Without a segment bridge from gross retention to net expansion, customer durability cannot be independently assessed. Budget expansion proxies from case studies and the 384-customer $100K+ cohort do not reveal whether expansion is concentrated in a narrow slice of accounts.
    diligencePath: Request NRR and GRR by segment (marketer UA, marketer retargeting, publisher monetization, intelligence) for FY2023, FY2024, FY2025, and YTD 2026. Request cohort-level analysis of the top 100 advertiser accounts and contract-length distribution for enterprise deals.
    relatedQuestionRefs:
    - QU005
    - QU015
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue contribution of top 5, top 10, and top 20 customers as a percentage of total revenue, and whether any single customer exceeds 10% of revenue.
    whyItMatters: Large advertisers such as Delivery Hero, Just Eat Takeaway.com, Grab, and TikTok could individually represent material revenue share; undetected concentration would impair revenue stability assessment.
    diligencePath: Request customer concentration schedule for FY2024 and FY2025 covering top-N accounts by revenue and compare to AdTech industry norms.
    relatedQuestionRefs:
    - QU003
    - QU017
  - type: private-evidence-only
    severity: material
    topic: active-customer-count
    missingEvidence: 2026 IPO summaries disclose more than 1,000 marketers and 167,814 integrated apps, but they do not break out direct advertisers vs agencies/DSPs, define active publisher accounts by monetization surface, or disclose subscriber counts for Intelligence.
    whyItMatters: Aggregate scale is now public, but segmented customer counts are still necessary to judge where Liftoff is actually growing, where churn may be hiding, and how much of the base is monetization infrastructure versus demand-side spenders.
    diligencePath: Request current active advertiser count (90-day active definition), active publisher account count, integrated-app net adds, agency/DSP customer count, and Intelligence subscriber count with YoY trend from management.
    relatedQuestionRefs:
    - QU008
    - QU026
  - type: missing-source
    severity: material
    topic: agency-dsp-segment
    missingEvidence: Any named case study, testimonial, or quantified evidence for the agency and DSP buyer segments, which are prominently featured on the products pages but have no public case documentation.
    whyItMatters: Agency/DSP revenue typically carries different margin profiles and renewal dynamics than direct advertiser revenue. Without any proof, this segment's size and health are completely opaque.
    diligencePath: Search for Liftoff mentions in DSP/agency trade press (Digiday, ExchangeWire, Adweek) and request agency and DSP segment revenue contribution and customer count from management.
    relatedQuestionRefs:
    - QU020
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: attribution-privacy-impact
    missingEvidence: Quantitative assessment of Apple ATT's impact on Liftoff's iOS campaign performance and advertiser retention. iOS vs Android revenue split. ATT opt-in rates across Liftoff's publisher SDK installed base.
    whyItMatters: ATT-era signal loss reduces ML model quality for iOS UA, potentially suppressing advertiser ROI and driving spend consolidation toward first-party data platforms such as Apple Ads and Google.
    diligencePath: Request iOS/Android revenue split, ATT consent rate on publisher SDK, and Cortex AI performance benchmarks pre- and post-ATT from management. Assess SKAdNetwork and contextual bidding coverage depth.
    relatedQuestionRefs:
    - QU014
    - QU025
    - QU021
    - QU028
