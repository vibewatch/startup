- id: named-customer-proof
  title: Named case studies provide production-level outcome proof across verticals
  body: >-
    Liftoff's public case study library covers twelve published cases across fintech (Acorns, Ibotta, Stash), food delivery (Just Eat Takeaway.com, Delivery Hero), ride-hailing (Grab), social casino gaming (Product Madness, ZiMAD), social media (TikTok), game development intelligence (Ubisoft), healthcare rewards (Cashwalk), and wellness influencer marketing (Calm). The outcomes are described in concrete KPI terms and several accounts document explicit budget expansion following initial success.

    The highest-signal marketer-side cases are Ibotta (134% install increase, 297% activation increase, 5.7x daily spend scale with re-engagement expansion) and Just Eat Takeaway.com (28% CPA reduction, expansion from Netherlands/Germany pilots to six additional markets). These cases are notable because they document not just campaign KPIs but explicit budget scale-up and account expansion, which serve as the strongest available proxy for ongoing relationship health. The Delivery Hero incrementality test is particularly credible as evidence because it uses a hold-out control-group methodology — not last-touch attribution — to demonstrate 20-26% install conversion rate uplift in LATAM, and explicitly documents Delivery Hero scaling Android spend by double digits after confirmation. Delivery Hero also characterized Liftoff as a "longtime partner for many years," providing a multi-year relationship signal.

    On the publisher and monetization side, Product Madness (11% ARPDAU increase portfolio-wide, 45% for Heart of Vegas on iOS, after shifting its entire app portfolio to Vungle in-app bidding) and ZiMAD (133% Windows ARPDAU increase with Vungle's share of voice growing from 11% to 61%) demonstrate production-grade monetization deployment. Ubisoft's use of GameRefinery to identify high-impact social features that drove player engagement shows Intelligence-product embedding in an enterprise game publisher's development workflow.

    All case study outcomes are self-reported by Liftoff on its own website; none disclose third-party audit or independent verification. Most publisher cases (Product Madness, ZiMAD, TikTok, Cashwalk) reference Vungle branding and predate the October 2021 Liftoff-Vungle merger, validating legacy Vungle publisher adoption rather than outcomes on the unified Cortex AI platform. Liftoff's AppsFlyer Performance Index 17 (H1 2024) rankings — top-10 globally across iOS SSOT Power and Volume in Non-Gaming, Gaming, and All Categories — provide independent third-party validation of performance quality, though rankings are relative, not absolute revenue measures.
