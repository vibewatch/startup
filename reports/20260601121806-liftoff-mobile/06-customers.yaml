- id: TU005
  title: Expansion and concentration risk table
  columns:
  - driver or risk
  - nature
  - observed evidence
  - impact if risk materializes
  - diligence path
  rows:
  - - Advertiser land-and-expand
    - Positive expansion driver
    - Ibotta 5.7x spend; Stash 96.3%; Acorns Android→iOS; Just Eat 2→8+ markets; Delivery Hero double-digit LATAM increase
    - Higher revenue per existing account; reduces dependence on new advertiser acquisition
    - Confirm current spend levels and YoY growth rates for top 20 advertisers from management.
  - - Publisher monetization deepening
    - Positive expansion driver
    - ZiMAD 5%→40% monthly revenue share; Product Madness entire portfolio on bidding; Cashwalk iOS expansion
    - Increasing wallet share per publisher partner; harder to displace once primary stack
    - Request top-20 publisher share of Vungle Exchange supply and fill-rate trend from management.
  - - Enterprise cohort expansion proxy
    - Positive expansion driver
    - 130% LTM Core Advertising NDR and 384 customers >$100K LTM revenue as of Mar 31 2026
    - Suggests net expansion in the large-advertiser cohort rather than purely one-off campaign volume
    - Request a cohort waterfall showing gross retention, upsell, and downsell by segment to confirm whether publisher and intelligence products behave similarly.
  - - Revenue concentration (single large customer)
    - Concentration risk
    - Not disclosed; large advertisers such as Delivery Hero, Just Eat, TikTok could be significant spenders
    - High dependence on a few large accounts would impair revenue stability if any churned
    - Request top-5 and top-10 customer revenue concentration as % of total for FY2024-FY2025.
  - - Agency and DSP channel opacity
    - Concentration and margin risk
    - No named case studies; segment marketed but contribution unknown
    - Agency-mediated revenue typically carries lower margin and higher client-budget volatility
    - Request agency/DSP segment revenue as % of total and customer count from management.
  - - Apple ATT and Google Privacy Sandbox
    - Adverse structural risk
    - ATT restricts IDFA since April 2021; Delivery Hero acknowledges attribution degradation; Privacy Sandbox expanding
    - Reduced signal quality degrades ML model performance for iOS UA; could suppress advertiser ROI and retention
    - Request iOS/Android revenue split, ATT opt-in rate on SDK, and Cortex AI benchmarks pre- and post-ATT.
  notes: Expansion signals from named case studies are strong and the 2026 IPO summaries add one encouraging cohort datapoint, but revenue concentration, segment mix, and agency/DSP health still cannot be assessed from public data alone. ATT remains a structural constraint that Liftoff must mitigate via contextual, probabilistic, or first-party-data alternatives.
