    - Acquire new high-value users at scale via ML-optimized programmatic bidding
    - '>1,000 marketers at Sep 2025; 384 customers >$100K LTM core advertising revenue at Mar 2026; top-10 AppsFlyer Power/Volume rankings H1 2024'
    - No split between direct advertisers, agencies, and DSPs; geo and vertical mix are not public.
  - - Mobile app publishers
    - 'Buyer: publisher/dev team; user: ad monetization manager; payer: revenue share'
    - Monetize (Vungle SDK) + Vungle Exchange
    - Maximize ad revenue per DAU via video, interstitials, and in-app bidding
    - '>140,000 integrated apps at end-2025; 167,814 integrated apps / ~1.4B DAUs at Mar 2026; ZiMAD, Product Madness, Cashwalk case studies'
    - Filing summaries disclose integrated-app scale, not active publisher count by ad format; fill rates, eCPM, and NPS not public.
  - - DSP / agency buyers
    - 'Buyer: media buyer or agency planner; user: campaign analyst; payer: client budget'
    - Vungle Exchange (programmatic DSP access)
    - Programmatic buying against Liftoff publisher inventory at scale
    - Segment featured on official products pages; no named case studies available
    - Zero public case studies for this segment; revenue contribution and customer count unknown.
  - - Mobile game developers
