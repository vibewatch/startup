    - Accelerate UA
    - User acquisition optimized for app install, registration, and activation (first purchase)
    - Production; 5.7x explicit daily spend scale-up plus re-engagement campaign expansion
    - +134% installs; +297% activations; 5.7x daily spend scale
    - Self-reported; no date stamp; no third-party audit; no LTV or NRR data.
  - - Just Eat Takeaway.com
    - App marketer — food delivery (Netherlands, Germany, 6 additional markets)
    - Accelerate UA + retargeting (combined "better together" offering)
    - New-customer acquisition and retargeting with CPA target in multiple European markets
    - Production; expanded from 2-market pilot to 8+ markets
    - 'Cost-Per-New Customer: −28% MoM; combined UA+RE: −8% with +12% spend'
    - Self-reported; "better together" claim not independently benchmarked.
  - - Grab
    - App marketer — ride-hailing (Indonesia, Philippines)
    - Accelerate UA (Android)
    - First-ride conversion optimization via ML lookalike audience targeting
    - Production; CPIs 33% below target from campaign launch
    - CPIs −33% vs target; +66% installs in one month; install-to-first-booking +4.6%
    - Self-reported; Android-only; no LTV or long-term retention data.
  - - Delivery Hero (PedidosYa)
    - App marketer — food delivery (Argentina, Peru, LATAM)
    - Accelerate UA (Android) + incrementality testing
    - Scale broad-userbase delivery app; validate incremental impact via hold-out methodology
    - Production; double-digit Android spend increase after incrementality confirmation
    - 'Argentina: +23% install conversion uplift, +22.6% event lift; Peru: +26% install uplift, +14% event lift'
    - ATT-era attribution constraints acknowledged; Android-only test; no iOS data reported.
  - - Acorns
    - App marketer — fintech/investing (Android then iOS, US)
    - Accelerate UA
    - High-quality investor user acquisition with registration and activation tracking via Adjust
    - Production; expanded from Android to iOS after success
    - −31.3% cost per registration; +36.5% install-to-registration rate; +2.4x click-to-install
    - Self-reported; no date stamp; no cohort or LTV outcome data.
  - - Stash
    - App marketer — fintech/investing (Android, US)
    - Accelerate UA
    - New investor acquisition optimized for bank account linking via AppsFlyer postback
    - Production; 96.3% daily spend increase within one month
    - +99% app installs; +134% linked bank accounts; 96.3% daily spend scale
    - Self-reported; single platform (Android); LTV optimization planned but not quantified.
  - - Product Madness
    - Publisher — social casino gaming (iOS and Android)
    - Vungle Monetize (in-app bidding via ironSource LevelPlay)
    - Shift entire app portfolio from waterfall to in-app bidding
    - Production; entire portfolio migrated to bidding
    - +11% ad ARPDAU portfolio-wide; +45% for Heart of Vegas on iOS; +7% overall eCPM
    - Pre-merger Vungle case; ironSource LevelPlay mediation dependency; no Cortex AI.
  - - ZiMAD
    - Publisher — casual gaming (Windows and Amazon platforms)
    - Vungle Monetize (Windows and Amazon ad stacks)
    - Maximize ad revenue on non-mobile platforms including Windows apps
    - Production; Vungle became
    - Windows ARPDAU +133% Q4 2020 vs Q4 2019; Vungle share of voice 11%→61% on Windows
    - Pre-merger Vungle case; Windows/Amazon platform scope is niche; no post-2021 update.
  - - TikTok
    - Publisher / marketer — social media app (global)
    - Vungle Creative Labs (Playable+ ad format)
    - Creative production of Playable+ format to drive installs at lower CPI
    - Production; ongoing creative workshop cadence documented
    - +95% IPM (installs per thousand impressions)
    - Pre-merger Vungle case; IPM is format-level metric, not account-level outcome.
  - - Ubisoft
    - Mobile game developer — AAA and mid-core live games
    - GameRefinery Intelligence
    - Competitive benchmarking to identify high-impact social features for live game updates
    - Production; social features implemented and described as having "huge impact on player engagement"
    - Social features implemented drove direct engagement lift — qualitative, no numeric uplift given
    - Qualitative outcome only; single documented use case; no subscription renewal or session data.
  - - Cashwalk
    - Publisher — healthcare/rewards app (Android then iOS, South Korea)
    - Vungle Monetize (video ads)
    - Add video ad monetization to step-tracker/rewards app; expand to iOS market
    - Production; iOS expansion followed Android video integration
    - +$3K/day ad revenue; +30% reach after iOS expansion
    - Pre-merger Vungle case; revenue baseline not disclosed; outcome not independently verified.
  - - Calm
    - App marketer — wellness (influencer channel)
    - Liftoff Influence
    - Influencer marketing campaign with ROI measurement and optimization
    - Production
    - '>50% influencer marketing ROI improvement'
    - Thinnest evidence of all cases; no install, activation, or spend metrics provided.
  notes: All cases are sourced from Liftoff's own case study pages and are self-reported without third-party audit. Publisher cases (Product Madness, ZiMAD, TikTok, Cashwalk) reference legacy Vungle branding and predate the 2021 merger. Marketer cases (Ibotta, Just Eat, Grab, Delivery Hero, Acorns, Stash) are branded as Liftoff and represent the more current UA platform. Each row is sourced from the individual case study page plus at least one additional official Liftoff source.
