evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements, annual revenue, EBITDA margin, and growth rate for Liftoff Mobile as a combined
      entity post-merger.
    whyItMatters: >-
      Without revenue data, enterprise value multiples, growth trajectory, and PE returns cannot be assessed by any
      prospective investor or partner.
    diligencePath: >-
      Request full financial data room from the company and Blackstone; alternatively through legal counsel at Simpson
      Thacher.
    relatedQuestionRefs:
      - QO016
      - QO015
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Exact ownership percentage held by Blackstone and General Atlantic post-2025 close; full cap table including any
      founder and management equity rollover.
    whyItMatters: >-
      Ownership structure determines governance control, exit priority, distribution waterfall, and alignment between PE
      and management.
    diligencePath: Request shareholders agreement and full cap table from Blackstone and company legal representatives.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Full board composition, board charter, governance rights of each PE shareholder, and management incentive plan
      terms.
    whyItMatters: >-
      Board composition and governance documents shape oversight quality, strategic direction, and key-person risk
      mitigation; material for any institutional diligence.
    diligencePath: >-
      Request governance package from Blackstone legal team or Simpson Thacher; also request management incentive plan
      from company counsel.
    relatedQuestionRefs:
      - QO009
  - type: stale
    severity: minor
    topic: scale
    missingEvidence: >-
      Current (2025-2026) platform scale metrics: daily ads delivered, apps reached, countries covered, SDK
      integrations, and active customer or advertiser count.
    whyItMatters: >-
      Merger-era figures from August 2021 are the only public scale claims; four-plus years of integration and growth
      mean current reach is unverified in public sources.
    diligencePath: >-
      Request current platform metrics from company; cross-reference with AppsFlyer attribution data or published
      performance reports.
    relatedQuestionRefs:
      - QO018
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      Independent coverage of any regulatory inquiries, privacy enforcement, antitrust review, or material litigation
      involving Liftoff Mobile, Inc.
    whyItMatters: >-
      A $4.3B company in mobile advertising operating under ATT and GDPR constraints warrants adverse event verification
      before investment or partnership decisions.
    diligencePath: >-
      Search PACER, GDPR enforcement databases, FTC press releases, and litigation dockets for Liftoff Mobile Inc.;
      request reps and warranties from company.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: privacy-constraint
    missingEvidence: >-
      Google's Privacy Sandbox for Android deployment status, timeline, and advertiser adoption as of mid-2026; the
      official Privacy Sandbox page returned a 404 error during research.
    whyItMatters: >-
      Android is the higher-volume platform for mobile advertising globally; GAID deprecation would replicate ATT-level
      measurement disruption on Android, materially affecting Liftoff's optimization capabilities and competitive
      positioning relative to Google's own demand channels.
    diligencePath: >-
      Fetch current Google Privacy Sandbox for Android documentation directly; consult AppsFlyer or Adjust MMP technical
      update blogs on GAID deprecation readiness; request Liftoff's internal roadmap for Privacy Sandbox compliance.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Liftoff Mobile's own revenue, market share within the independent mobile ad channel, and segment breakdown between
      gaming and non-gaming UA spend. No public filing or disclosed financial statement exists.
    whyItMatters: >-
      Without Liftoff's revenue, the SOM estimate remains entirely inferred from competitor disclosures and valuation
      multiples. The $4.3B valuation implies significant revenue, but the implied market share of the ~$13B independent
      channel is unverifiable.
    diligencePath: >-
      Request management disclosure of revenue range, gaming vs. non-gaming split, and retained publisher count;
      cross-reference with GP Bullhound or other secondary market data services.
    relatedQuestionRefs:
      - QM001
      - QM005
  - type: conflicting-data
    severity: minor
    topic: market-concentration
    missingEvidence: >-
      Independent corroboration of the 88% Google/Meta concentration finding; the Moloco study is self-interested
      (Moloco competes in the independent channel) and the methodology covers consumer apps only, potentially
      understating gaming-vertical concentration.
    whyItMatters: >-
      If the true concentration is lower (e.g., 75-80%), the independent channel SAM expands materially to $22–27B,
      changing the competitive opportunity assessment for Liftoff.
    diligencePath: >-
      Obtain Singular's standalone channel-mix research or AppsFlyer's Performance Index data on channel budget
      allocation; cross-reference with DSP bid-request volume across walled gardens versus open web.
    relatedQuestionRefs:
      - QM019
      - QM024
  - type: private-evidence-only
    severity: material
    topic: liftoff-public-proof
    missingEvidence: >-
      Audited or buyer-level evidence showing whether Liftoff’s neutrality, creative services, and direct supply path
      produce better retention, incrementality, or share-of-wallet outcomes than AppLovin or Unity.
    whyItMatters: >-
      Without third-party performance evidence, Liftoff’s clearest wedge is still mostly company-authored positioning
      rather than verified commercial superiority.
    diligencePath: >-
      Request cohort retention, win-loss, and incrementality studies by vertical, plus at least two customer references
      that compare Liftoff against named alternatives.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable take rates, enterprise fee structures, or realized pricing data across Liftoff, AppLovin, Unity,
      Digital Turbine, Moloco, Mintegral/Pangle, and The Trade Desk.
    whyItMatters: >-
      Public product pages say a lot about capability breadth but almost nothing about whether any platform has durable
      pricing power or simply wins on temporary performance claims.
    diligencePath: >-
      Request recent contracts, rate cards, or procurement benchmarks from at least three current buyers and two
      publishers that actively multi-home across the competitor set.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: disclosure-gaps
    missingEvidence: >-
      Audited income statements and balance sheets for Liftoff for the two most recent fiscal years, including revenue,
      cost of revenue, gross margin, EBITDA, and operating cash flow.
    whyItMatters: >-
      Without disclosed revenue and margin, it is impossible to assess the $4.3B valuation multiple, compare Liftoff to
      peers, or underwrite revenue quality. All financial analysis in this chapter is inferred or estimated.
    diligencePath: >-
      Request NDA data room access; obtain audited financials for fiscal years 2024 and 2025; demand segment P&L split
      across at minimum Accelerate, Monetize/Exchange, and Intelligence.
    relatedQuestionRefs:
      - QI021
      - QI025
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin percentage by product line, TAC as percentage of revenue, publisher rev-share percentage, and
      adjusted EBITDA margin; the gross-to-net bridge for advertiser spend.
    whyItMatters: >-
      Gross margin is the primary measure of unit economic quality for an ad tech platform; without it, the risk of TAC
      compression or publisher rev-share escalation cannot be assessed.
    diligencePath: >-
      In data room, request cost of revenue schedule disaggregating publisher payments from infrastructure costs;
      request contribution margin analysis by product line and customer segment.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Liftoff cash position, monthly operating cash flow or burn, revolving credit facility, term loan balance, maturity
      schedule, and covenant package.
    whyItMatters: >-
      PE-backed companies at $4B+ valuation commonly carry leveraged debt structures; undisclosed debt service
      obligations could materially reduce free cash flow available for growth investment.
    diligencePath: >-
      Request full balance sheet and debt schedule; confirm whether GA proceeds were primary to balance sheet or
      secondary to Blackstone; confirm absence or presence of sponsor distributions.
    relatedQuestionRefs:
      - QI023
      - QI024
  - type: missing-source
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      Any independent, arms-length analyst report, news article, or third-party data source that provides revenue
      estimates, growth rates, or financial performance indicators for Liftoff specifically (not just the mobile ad tech
      industry).
    whyItMatters: >-
      Without independent corroboration of Liftoff-specific financial performance, all traction signals rely on company
      and sponsor-controlled press releases. Adverse or independent financial evidence is entirely absent.
    diligencePath: >-
      Search financial databases (PitchBook, Crunchbase), industry analyst coverage (Forrester, IDC, eMarketer), and
      trade press (AdExchanger, Digiday) for any revenue or financial estimates specific to Liftoff; conduct expert
      network calls with former employees.
    relatedQuestionRefs:
      - QI021
      - QI022
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Net revenue retention (NRR), gross revenue retention (GRR), customer churn rate, average contract value (ACV), and
      cohort analysis for both advertiser and publisher customer bases.
    whyItMatters: >-
      NRR is the single most important metric for assessing revenue quality and durability in an ad tech platform;
      without it, the $4.3B valuation cannot be stress-tested against churn scenarios.
    diligencePath: >-
      In data room, request quarterly cohort analysis for advertiser and publisher cohorts from 2022 onward; request NRR
      and GRR for each customer segment separately.
    relatedQuestionRefs:
      - QI022
      - QI025
  - type: missing-source
    severity: minor
    topic: capital-structure
    missingEvidence: >-
      Exact stake percentage sold to General Atlantic, implied pre-money and post-money enterprise value breakdown, and
      whether the $4.3B represents equity value or enterprise value.
    whyItMatters: >-
      Knowing whether $4.3B is equity or enterprise value and the stake sold determines the implied total company value
      available to Blackstone and the dilution impact for management.
    diligencePath: >-
      Review transaction disclosure or Form D filings; request cap table from Liftoff; review legal disclosure in any
      subsequent financing documents.
    relatedQuestionRefs:
      - QI004
  - type: private-evidence-only
    severity: material
    topic: architecture-disclosure
    missingEvidence: >-
      Internal Cortex AI architecture including model versioning, inference latency targets, data pipeline design,
      training frequency, and disaster recovery configuration.
    whyItMatters: >-
      Buyers cannot assess platform reliability, scalability under load, or competitive durability without knowing the
      technical depth behind the Cortex AI marketing claims.
    diligencePath: >-
      Request architecture review documentation, ML platform design documents, and an infrastructure security review
      from Liftoff's engineering team during diligence.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: material
    topic: security-certifications
    missingEvidence: >-
      SOC 2 Type II, ISO 27001, or equivalent security certification; public status page or SLA commitment; incident
