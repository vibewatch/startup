- id: capability-and-market-sides
  title: Capability breadth, market sides, and where Liftoff really differs
  body: 'Across the retained evidence, the most important buying criteria are which side of the market a platform controls, what proprietary data loop it claims, how deep its integration footprint is, and whether it offers creative or workflow services beyond auction mechanics. AppLovin and Unity both sell to advertisers and publishers, but each also benefits from privileged assets outside a neutral exchange model: AppLovin from Axon and MAX, Unity from the engine plus LevelPlay and Vector. Digital Turbine combines UA, monetization, and alternative app distribution; Moloco emphasizes machine-learning demand and SDK-based monetization; Mintegral and Pangle emphasize open-internet reach, direct demand, and AI bidding. Liftoff’s public wedge is different. It explicitly ties Cortex-based UA to the Vungle Exchange, publisher monetization, and a Creative Studio that tries to improve conversion rather than only fill or bidding. That makes Liftoff look more like a neutral intermediary spanning both
    sides of the market than a media owner, engine owner, or device owner. The trade-off is that its public self-serve story and public scale proof remain thinner than those of the biggest benchmarks.'
