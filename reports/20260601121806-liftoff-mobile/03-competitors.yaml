- id: TP003
  title: Data advantage, integration footprint, and regulatory exposure
  columns:
  - player
  - side of market
  - data / AI advantage
  - integration / distribution footprint
  - geographic / regulatory exposure
  - business-model implication
  rows:
  - - Liftoff
    - Advertisers + publishers
    - Cortex plus Vungle supply data and creative performance signals
    - Direct exchange path, SDK reach, major mediation access, creative services
    - Privacy / brand-safety compliance emphasized; lower geopolitical burden than China-linked rivals
    - Best fit for buyers wanting neutral app-growth execution across supply and demand
  - - AppLovin
    - Advertisers + publishers
    - Axon and MAX sit on large internal demand and monetization loops
    - Strong game reach, self-serve rollout, growing beyond gaming into ecommerce and CTV
    - Highest current adverse scrutiny in retained set
    - Can compress the field by pairing scale with automation, but scrutiny could weaken the narrative
  - - Unity / ironSource
    - Advertisers + publishers + developers
    - Vector explicitly trains on signals from across the Unity ecosystem
    - Engine, editor, LevelPlay, Unity Ads, Tapjoy, Aura, Ad Quality
    - Lower regulatory pressure than AppLovin in retained set, but clear ecosystem conflict
    - Workflow lock-in can matter more than exchange neutrality for game studios already on Unity
  - - DT / AdColony
    - Advertisers + publishers + carriers
    - Optimization sits beside owned carrier and device-placement surfaces
    - FairBid, DT Exchange, offer wall, alternative app stores, OEM / carrier installs
    - Distribution-heavy model can trigger policy and partner-comfort questions
    - Strong when buyers value incremental installs or device reach over neutrality
  - - Moloco
    - Advertisers + publishers
    - ML-first optimization and SDK bidding; positions in-app ecosystems as resilient AI-era supply
    - SDK, advertiser demand, partnerships such as Xiaomi GetApps
    - Lower public regulatory noise, but less obvious creative or exchange breadth
    - Often competes as an AI demand layer rather than a full-stack marketplace
  - - Mintegral
    - Advertisers + publishers
    - AI Smart Bidding plus user tags, LAT estimation, and creative tooling
    - Direct SDK links to 10,000 publishers and 100,000 apps
    - China-linked policy sensitivity plus regional concentration risk
    - Competitive when buyers prioritize open-internet reach and China-market execution
  - - Pangle / ByteDance
    - Advertisers + publishers
    - Direct TikTok advertiser demand and RTB-based monetization / UA tools
    - Marketplace for app monetization plus UA tied to ByteDance scale
    - Highest geopolitical and policy sensitivity alongside strong demand access
    - Powerful for demand access, but least aligned with the neutral-intermediary thesis
  - - The Trade Desk
    - Advertisers / agencies
    - Kokai and platform AI optimize across 15M ad opportunities per second
    - 30+ mobile partners plus broad partner portal and omnichannel DSP stack
    - No-owned-media stance lowers structural conflict
    - Wins where buyers want mobile as one channel inside a larger open-internet buying system
  notes: This table compares public operating models rather than internal auction quality. “Exposure” refers to what the retained source set signals, not to any legal conclusion.
