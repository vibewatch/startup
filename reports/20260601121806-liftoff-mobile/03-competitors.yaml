- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - supporting public evidence
  - main rival pressure
  - severity
  - implication / diligence ask
  rows:
  - - Neutral intermediary
    - Liftoff spans UA, monetization, exchange, and creative without owning media or devices
    - AppLovin, Unity, Digital Turbine, Pangle, and The Trade Desk all pair AI with privileged demand, engine, device, or partner assets
    - High
    - Request win-loss data showing neutrality matters enough to offset scale and workflow lock-in
  - - Dual-sided marketplace
    - Vungle Exchange plus Monetize and Accelerate suggest both supply and demand participation
    - AppLovin, Unity, Mintegral, and Pangle also market both supply and demand sides
    - High
    - Test whether direct-supply share and advertiser retention are materially better than other full-stack peers
  - - Creative Studio wedge
    - Liftoff publicly ties creative testing, localization, and ML-driven selection into performance workflows
    - AppLovin and Mintegral also emphasize AI-backed creative or self-serve ad tooling
    - Medium
    - Ask for independent incrementality or conversion-lift evidence tied specifically to creative services
  - - Brand safety / trust
    - Liftoff foregrounds IAS, DoubleVerify, MOAT, app-ads.txt, sellers.json, and privacy compliance
    - AppLovin scrutiny and China-linked exposure can make Liftoff look cleaner, but TTD also sells neutrality and transparency
    - Medium
    - Obtain partner references on fraud, suitability, and policy-compliance outcomes
  - - SDK / exchange footprint
    - Liftoff claims 150,000+ apps and 1B+ users across 150+ countries
    - AppLovin and Unity still appear larger in public demand and workflow proof, while DT owns alternative distribution
    - High
    - Verify how much of Liftoff volume is exclusive, direct, and margin-accretive rather than broadly interchangeable
  - - Switching friction
    - Creative testing, direct supply, and marketplace knowledge can create embedded workflows
    - Public pricing opacity and broad mediation / exchange connectivity suggest buyers can still multi-home aggressively
    - High
    - Request renewal, cohort, and share-of-wallet data before underwriting durable pricing power
  notes: Severity is an analytical assessment, not a vendor disclosure. The retained source set is rich on positioning and workflow claims, but thin on realized take rates, retention, and contract economics.
