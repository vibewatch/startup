tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - public scale / footprint
  - strongest public edge
  - ownership / conflict line
  - weaker point
  rows:
  - - Liftoff
    - Direct mobile growth peer
    - 150,000+ apps in supply; 93% of top 100 apps on Monetize; 1B+ users across 150+ countries on Vungle Exchange
    - Neutral intermediary spanning UA, monetization, exchange, and creative
    - Independent platform without engine, device, or owned-media control
    - Public self-serve scale and third-party proof are thinner than AppLovin or Unity
  - - AppLovin
    - Direct benchmark
    - 2024 revenue of $4.7B; claims 1B+ daily reach in mobile games
    - AXON AI plus MAX and move toward a pure advertising platform
    - Optimization stack benefits from large internal data and demand concentration
    - Regulatory and short-seller scrutiny raise durability questions
  - - Unity Ads / ironSource
    - Direct gaming-native rival
    - 85% of top 100 games use Unity growth solutions; Aura integrated on 2.3B+ devices
    - Engine-to-growth workflow plus LevelPlay mediation and Vector AI
    - Unity can pair creation, monetization, and UA inside one ecosystem
    - Still rebuilding trust after earlier model/data issues and is less neutral than Liftoff
  - - Digital Turbine / AdColony
    - Distribution-led rival
    - UA, exchange, mediation, offer wall, and OEM / carrier distribution assets
    - Alternative app distribution plus DT Exchange and FairBid
    - Owns distribution surfaces and residual AdColony assets
    - Looks less neutral and less creative-strategy-led than Liftoff
  - - Moloco
    - AI demand / monetization rival
    - Global advertiser base plus Xiaomi / GetApps partnership in 100+ countries
    - Machine-learning demand and SDK bidding without waterfall complexity
    - Public story is strongest on ML demand rather than full-stack app growth
    - Less visible on creative studio and exchange transparency than Liftoff
  - - Mintegral
    - China-linked UA and monetization rival
    - 10,000 publishers and 100,000 apps via direct SDK relationships
    - AI Smart Bidding plus in-house Mindworks creative studio
    - China-market expertise and open-internet reach are a real advantage for some buyers
    - Higher policy and geopolitical sensitivity for western buyers
  - - Pangle / ByteDance
    - China-linked demand and monetization rival
    - Direct TikTok For Business demand supported by ByteDance scale across 120 cities
    - Direct advertiser demand and RTB-backed monetization plus UA tools
    - Benefits from TikTok-linked advertiser pool and ByteDance parent scale
    - Ownership and policy structure is the opposite of Liftoff neutrality
  - - The Trade Desk
    - Adjacent substitute
    - Open-internet DSP with 30+ mobile-specific partners and 400+ partner integrations around Kokai
    - Omnichannel self-serve DSP with transparent no-owned-media posture
    - Huge partner marketplace and measurement breadth
    - Less specialized in app-install and exchange-native mobile growth workflows than Liftoff
  notes: Scale uses retained public markers only. The field mixes direct peers and adjacent substitutes because buyers can route mobile spend through specialized app-growth platforms, device-led distributors, or broad DSPs.
