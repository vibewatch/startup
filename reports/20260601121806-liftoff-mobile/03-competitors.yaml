  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: liftoff-public-proof
    missingEvidence: Audited or buyer-level evidence showing whether Liftoff’s neutrality, creative services, and direct supply path produce better retention, incrementality, or share-of-wallet outcomes than AppLovin or Unity.
    whyItMatters: Without third-party performance evidence, Liftoff’s clearest wedge is still mostly company-authored positioning rather than verified commercial superiority.
    diligencePath: Request cohort retention, win-loss, and incrementality studies by vertical, plus at least two customer references that compare Liftoff against named alternatives.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable take rates, enterprise fee structures, or realized pricing data across Liftoff, AppLovin, Unity, Digital Turbine, Moloco, Mintegral/Pangle, and The Trade Desk.
    whyItMatters: Public product pages say a lot about capability breadth but almost nothing about whether any platform has durable pricing power or simply wins on temporary performance claims.
    diligencePath: Request recent contracts, rate cards, or procurement benchmarks from at least three current buyers and two publishers that actively multi-home across the competitor set.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
