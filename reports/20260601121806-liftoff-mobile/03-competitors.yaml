  title: Competitors
  summary: AppLovin is the central benchmark because it pairs AI-led demand with far greater public scale, while Unity Ads/ironSource remains the closest gaming-native full-stack rival and Digital Turbine, Moloco, Mintegral/Pangle, and The Trade Desk attack from distribution, machine-learning demand, China-linked reach, or open-internet DSP breadth. Liftoff’s clearest public wedge is its neutral-intermediary, dual-sided marketplace plus creative studio, but that wedge is narrower than a moat unless it can prove better economics or retention than larger, more automated rivals.
sections:
- id: landscape-and-benchmark
  title: 'Landscape: AppLovin is the benchmark, but the field attacks from different angles'
  body: 'The competitive field is not one clean peer set. AppLovin is the central benchmark because it has moved toward a purer ad-tech identity, still markets both advertiser acquisition and publisher monetization, and now carries much stronger public revenue proof than the rest of the independent mobile stack. Unity Ads and ironSource are the closest gaming-native full-stack rival because Unity can connect creation, monetization, and user acquisition inside one ecosystem, and its Vector rebuild explicitly leans on data collected across the Unity developer base. Digital Turbine and the residual AdColony brand matter for a different reason: they pair mediation and exchange products with OEM and carrier distribution assets. Moloco competes more as an AI-first demand and monetization layer than as a full creative-plus-exchange stack. Mintegral and Pangle bring another pressure pattern by combining large mobile reach with China-linked demand pools. The Trade Desk is more adjacent than direct,
    but it can still substitute anywhere a buyer wants mobile inventory through a broad open-internet DSP instead of an app-growth specialist.'
