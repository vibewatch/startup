- id: conflicts-distribution-and-regulatory
  title: Conflicts, distribution leverage, and regulatory posture
  body: 'Ownership and conflict structure matter almost as much as product checklists. AppLovin’s strength comes with the heaviest current adverse noise: trade reporting described SEC scrutiny, reported state-attorney-general attention, and controversy around distribution practices, while Muddy Waters argued that the company’s e-commerce claims leaned on low-incrementality retargeting and terms-of-service violations. Unity has a less acute regulatory cloud in the retained set, but its own AI relaunch acknowledges the black-box tension that follows any automated bidder using deep ecosystem data. Digital Turbine and AdColony bring their own conflict pattern because OEM placement and device-touching distribution are powerful but not neutral. Pangle and ByteDance add another layer of geopolitical and policy exposure simply because they route through TikTok-linked advertiser demand and a China-rooted parent. The Trade Desk markets the opposite posture by stressing that it does not own media and
    instead sits on top of a large partner marketplace. Liftoff’s public trust posture is narrower but clearer: Vungle Exchange materials foreground brand safety vendors, app-ads.txt, sellers.json, and privacy compliance as part of the pitch for a cleaner exchange.'
