- id: liftoff-differentiation-and-weaknesses
  title: 'Liftoff differentiation: neutral intermediary, dual-sided marketplace, creative studio — and where that is still weaker'
  body: Liftoff’s clearest public differentiation is not raw size. It is the combination of a dual-sided mobile marketplace, a direct exchange path, and a Creative Studio that sits inside performance workflows rather than beside them. The company claims that Cortex can optimize across UA and re-engagement goals, that Vungle Exchange gives direct supply and broad SDK reach, and that creative testing and localization can raise conversion rather than simply expand inventory access. That is a real wedge against rivals whose public positioning is mostly DSP, mostly mediation, or mostly device distribution. But the retained evidence also shows where the wedge is structurally weaker. AppLovin has much stronger public scale and automation proof, Unity has tighter workflow lock-in with developers, Digital Turbine owns OEM distribution surfaces, and The Trade Desk offers broader self-serve omnichannel breadth. Public pricing remains opaque across the whole set, and most platforms market case-study
    outcomes rather than comparable fee cards. That means Liftoff’s neutrality is meaningful, but buyers still need evidence that neutrality plus creative services converts into durable performance, retention, and pricing power.
