- id: traction-proxies-and-disclosure-gaps
  title: Public traction proxies and systematic disclosure gaps
  body: |-
    Liftoff has not disclosed any of the primary financial traction metrics required for standard underwriting: no revenue, ARR, GMV, active advertiser count, publisher SDK install base, impression volume, NRR, gross margin, or EBITDA figure has been published as of the runDate. The only quantitative traction indicators available from public sources are the General Atlantic valuation anchor ($4.3B), the Inc. 5000 ranking trajectory, and third-party market context.
    Investor language provides qualified traction signals. Blackstone characterized the company as having "grown rapidly" under CEO Jeremy Bondy since the 2021 merger. General Atlantic cited an "exciting business inflection point" and affirmed the company's "superior execution." CEO Bondy described the company as still in the "early innings of growth in a large and rapidly evolving category"—language inconsistent with a mature, decelerating business, but not quantifiable. Liftoff's eighth consecutive Inc. 5000 appearance (No. 2,687 in 2024 versus No. 8 in 2017) reflects multi-year revenue growth validation through an independent, revenue-verified ranking methodology—though the ranking fell significantly post-merger, suggesting the integration temporarily compressed growth rates relative to the pre-merger pure-play trajectory.
    Third-party market data provides structural tailwinds. US digital ad spend reached $137 billion in 2025, growing 12% year-over-year, per Sensortower's State of Digital Advertising 2025. Global mobile remarketing spend reached $31.3 billion in 2025, up 37% year-over-year, with iOS remarketing rising 71%—the latter a key signal that mobile re-engagement budgets are expanding post-ATT adoption. AppsFlyer's 2025 data shows remarketing's share of total app marketing spend rising from 25% (2024) to 29% (2025), consistent with Liftoff's Accelerate and Monetize products benefiting from increased reengagement budget allocation. These macro signals are consistent with a favorable revenue environment but do not corroborate Liftoff-specific metrics.
