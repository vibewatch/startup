- id: TI005
  title: Public financial disclosure gaps — impact and diligence path
  columns:
  - Missing Metric
  - Impact on Underwriting
  - Diligence Path
  rows:
  - - Annual revenue (gross and net)
    - Cannot assess valuation multiple, revenue quality, or growth trajectory
    - Request audited financial statements for two most recent fiscal years; at minimum the income statement with revenue and cost of revenue broken out
  - - Gross margin and TAC as pct of revenue
    - Cannot assess platform profitability or margin durability
    - Request cost of revenue schedule with publisher payments, hosting, and infrastructure disaggregated
  - - Adjusted EBITDA and operating income
    - Cannot assess profitability, operating leverage, or cash generation
    - Request EBITDA bridge from gross profit including S&M, R&D, and G&A by function
  - - Net revenue retention (NRR) by segment
    - Cannot assess revenue quality, churn risk, or expansion dynamics
    - Request quarterly cohort retention analysis for advertiser and publisher customer bases
  - - Cash, debt, and net debt position
    - Cannot assess capital adequacy, covenant risk, or free cash flow to equity
    - Request balance sheet as of most recent quarter-end with full debt schedule and maturity profile
  - - Revenue mix across product lines
    - Cannot assess concentration risk, cross-sell penetration, or Intelligence quality
    - Request segment P&L or revenue split across Accelerate, Monetize, Exchange, Creative, Intelligence
  notes: All items represent standard investment diligence inputs unavailable because Liftoff is a private company with no public filing obligation. The diligence paths assume NDA-level data room access.
