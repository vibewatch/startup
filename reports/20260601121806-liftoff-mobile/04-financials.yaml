callouts:
- calloutType: strength
  title: Institutional diligence proxy — $4.3B valuation with bulge-bracket advisors
  body: Goldman Sachs, Jefferies, and Morgan Stanley advising on the GA minority deal signals the financial rigor behind the $4.3B valuation. General Atlantic's growth equity framework typically requires verified financial metrics before commitment, providing a credible indirect endorsement of Liftoff's private financials. This does not substitute for direct disclosure but is a material qualitative signal.
  claimRefs:
  - CI031
  - CI032
  - CI040
- calloutType: risk
  title: Complete private-metric opacity is a blocking diligence constraint
  body: Revenue, gross margin, EBITDA, NRR, churn, cash, and debt are all undisclosed. For a company at $4.3B valuation under PE majority ownership, this is the expected disclosure profile—but it means every financial conclusion in this chapter is inferred or estimated. No investment decision should rely on this chapter without data-room confirmation of every null metric.
  claimRefs:
  - CI030
  - CI034
  - CI039
- calloutType: insight
  title: AppLovin's 82% EBITDA margin sets an achievable—but not assumed—benchmark
  body: AppLovin's $5.48B revenue and ~82% adj. EBITDA margin in 2025 demonstrate that scaled mobile ad tech platforms can generate exceptional unit economics. Liftoff's dual-sided supply-demand model, Cortex AI optimization, and 10+ year platform depth position it more favorably than smaller peers, but AppLovin-level margins require scale advantages in supply ownership and ML efficiency that cannot be confirmed for Liftoff without disclosure.
  claimRefs:
  - CI018
  - CI019
  - CI038
- calloutType: assumption
  title: Revenue range is inferred from valuation multiple bracketing, not disclosed data
  body: The $400M–$700M net revenue estimate is derived by applying 6–11x EV/revenue multiples (Digital Turbine to AppLovin mid-range) to the $4.3B valuation. This methodology is directionally standard but the resulting range is wide and uncertain. Actual revenue could be above or below this range depending on the multiple the GA deal was struck at, which is not disclosed.
  claimRefs:
  - CI038
  - CI039
