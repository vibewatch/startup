  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: disclosure-gaps
    missingEvidence: Audited income statements and balance sheets for Liftoff for the two most recent fiscal years, including revenue, cost of revenue, gross margin, EBITDA, and operating cash flow.
    whyItMatters: Without disclosed revenue and margin, it is impossible to assess the $4.3B valuation multiple, compare Liftoff to peers, or underwrite revenue quality. All financial analysis in this chapter is inferred or estimated.
    diligencePath: Request NDA data room access; obtain audited financials for fiscal years 2024 and 2025; demand segment P&L split across at minimum Accelerate, Monetize/Exchange, and Intelligence.
    relatedQuestionRefs:
    - QI021
    - QI025
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin percentage by product line, TAC as percentage of revenue, publisher rev-share percentage, and adjusted EBITDA margin; the gross-to-net bridge for advertiser spend.
    whyItMatters: Gross margin is the primary measure of unit economic quality for an ad tech platform; without it, the risk of TAC compression or publisher rev-share escalation cannot be assessed.
    diligencePath: In data room, request cost of revenue schedule disaggregating publisher payments from infrastructure costs; request contribution margin analysis by product line and customer segment.
    relatedQuestionRefs:
    - QI023
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Liftoff cash position, monthly operating cash flow or burn, revolving credit facility, term loan balance, maturity schedule, and covenant package.
    whyItMatters: PE-backed companies at $4B+ valuation commonly carry leveraged debt structures; undisclosed debt service obligations could materially reduce free cash flow available for growth investment.
    diligencePath: Request full balance sheet and debt schedule; confirm whether GA proceeds were primary to balance sheet or secondary to Blackstone; confirm absence or presence of sponsor distributions.
    relatedQuestionRefs:
    - QI023
    - QI024
  - type: missing-source
    severity: material
    topic: disclosure-gaps
    missingEvidence: Any independent, arms-length analyst report, news article, or third-party data source that provides revenue estimates, growth rates, or financial performance indicators for Liftoff specifically (not just the mobile ad tech industry).
    whyItMatters: Without independent corroboration of Liftoff-specific financial performance, all traction signals rely on company and sponsor-controlled press releases. Adverse or independent financial evidence is entirely absent.
    diligencePath: Search financial databases (PitchBook, Crunchbase), industry analyst coverage (Forrester, IDC, eMarketer), and trade press (AdExchanger, Digiday) for any revenue or financial estimates specific to Liftoff; conduct expert network calls with former employees.
    relatedQuestionRefs:
    - QI021
    - QI022
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Net revenue retention (NRR), gross revenue retention (GRR), customer churn rate, average contract value (ACV), and cohort analysis for both advertiser and publisher customer bases.
    whyItMatters: NRR is the single most important metric for assessing revenue quality and durability in an ad tech platform; without it, the $4.3B valuation cannot be stress-tested against churn scenarios.
    diligencePath: In data room, request quarterly cohort analysis for advertiser and publisher cohorts from 2022 onward; request NRR and GRR for each customer segment separately.
    relatedQuestionRefs:
    - QI022
    - QI025
  - type: missing-source
    severity: minor
    topic: capital-structure
    missingEvidence: Exact stake percentage sold to General Atlantic, implied pre-money and post-money enterprise value breakdown, and whether the $4.3B represents equity value or enterprise value.
    whyItMatters: Knowing whether $4.3B is equity or enterprise value and the stake sold determines the implied total company value available to Blackstone and the dilution impact for management.
    diligencePath: Review transaction disclosure or Form D filings; request cap table from Liftoff; review legal disclosure in any subsequent financing documents.
    relatedQuestionRefs:
    - QI004
