chapter:
  number: 4
  title: Financials
  summary: Liftoff's $4.3 billion General Atlantic minority round is the clearest public financial anchor, but revenue, EBITDA, cash, and debt remain undisclosed. Public evidence supports a multi-line mobile adtech revenue model and strong post-merger growth signals, while public comps bracket possible margin outcomes rather than prove them. Blackstone's continued majority ownership leaves IPO, sale, or continued hold all plausible, with the 2026 private-equity exit market still selective.
sections:
- id: revenue-streams-and-monetization
  title: Revenue streams, monetization mechanics, and recognition framework
  body: |-
    Liftoff's revenue architecture spans two primary axes—demand-side monetization through Accelerate and supply-side monetization through Monetize and Vungle Exchange—plus two ancillary product lines in Creative Studio and Intelligence. Accelerate earns revenue by charging mobile advertisers for performance-based user acquisition campaigns; pricing is outcome-linked (CPI, CPA, ROAS, and predicted lifetime value targets), meaning Liftoff earns a media margin on the difference between what advertisers pay per outcome and what Liftoff pays publishers for the underlying impressions that drive those outcomes. This demand-side revenue is the likely largest share of total company revenue given the brand heritage and go-to-market emphasis.
    Monetize generates supply-side revenue by helping mobile app publishers maximize ARPDAU through Liftoff's ad network, Vungle SDK, in-app bidding infrastructure, and mediation tools. The Vungle SDK is distributed to publishers at no software cost, and revenue is generated on a rev-share or yield-based basis per impression served. In-app bidding extends this model by replacing traditional waterfall mediation with real-time unified auctions, allowing publishers to expose inventory to multiple demand sources simultaneously and compete on price. The Product Madness case study shows 11% ARPDAU uplift from in-app bidding, and Cashwalk's daily ad revenue increased by up to $3,000 using Vungle video ads—both confirming supply-side product effectiveness but not disclosing revenue to Liftoff.
    Vungle Exchange functions as a programmatic DSP and SSP connector, providing third-party demand-side platforms access to publisher inventory. Exchange revenue likely flows as a take-rate on auction clearing prices. Creative Studio provides dynamic creative optimization and DCO ad-unit production; revenue structure is not disclosed but likely bundled with campaign spend or offered as a managed service fee. Intelligence (incorporating GameRefinery and AppRefinery) provides game market intelligence subscriptions and app analytics; this is the product line most likely to generate SaaS-like subscription revenue. No revenue mix breakdown across the five lines has been disclosed.
    The revenue recognition question—gross (principal) versus net (agent) under ASC 606—is material for interpreting headline numbers. Ad tech intermediaries that control inventory pricing and bear publisher payment risk typically recognize gross revenue; those that simply connect buyers and sellers recognize net. Liftoff's Accelerate model, where it optimizes campaigns against outcome targets and pays publishers for impressions, suggests principal-like economics on the demand side. The supply-side products (Monetize, Exchange) look more agent-like where Liftoff passes through a share of clearing prices to publishers. Without disclosure, the gross-to-net question is unresolvable from public sources.
