- id: gtm-and-pricing-mechanics
  title: GTM motion, pricing mechanisms, and sales efficiency proxies
  body: |-
    Liftoff serves four distinct customer segments—mobile marketers, agencies, demand-side platforms, and publishers/mobile game developers—each with a different value proposition and likely a different pricing and contracting structure. The company does not publish list pricing for any product. Evidence from official product pages and case studies indicates a managed-service orientation: campaigns are run with active account management, creative optimization support, and incrementality measurement assistance. The Delivery Hero case study illustrates Liftoff running a split-test incrementality experiment across LATAM markets to demonstrate 20% event uplift—a service-intensive engagement inconsistent with pure self-serve. Calm's influence marketing ROI improved by more than 50% through Liftoff Influence, again reflecting a managed engagement.
    Pricing units across product lines are heterogeneous. Accelerate likely uses CPM (cost per thousand impressions), CPI (cost per install), or CPA (cost per action) pricing, negotiated per campaign. Monetize uses yield-based publisher rev-share. Vungle Exchange uses auction-based CPM pricing with a take-rate. Creative Studio pricing is undisclosed—likely either bundled with campaign spend or charged as a managed creative fee. Intelligence subscription pricing is undisclosed but consistent with SaaS per-seat or per-market-access models given the GameRefinery heritage.
    No CAC, payback period, average contract value, sales cycle length, quota attainment, or NRR data has been disclosed. The only proxy for customer relationship quality is the case study evidence base (four published studies covering delivery-hero, cashwalk, calm, and product-madness) and the anecdotal language in investor communications ("customer-centric," "expanded portfolio"). A meaningful sales efficiency diligence question is whether the dual-sided marketplace structure (serving both advertisers and publishers) creates natural cross-sell dynamics that reduce net customer acquisition cost—common in successful ad-tech businesses but unsubstantiated for Liftoff without NRR or cohort data.
