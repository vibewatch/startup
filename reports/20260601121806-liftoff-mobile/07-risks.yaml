    {
      "id": "privacy-regulatory-and-geopolitical",
      "title": "Privacy, regulatory, and geopolitical rules can reprice the whole adtech market",
      "body": "The second-order risk is that the external rulebook keeps changing faster than mobile adtech can stabilize around it. Google's Attribution Reporting and Protected Audience materials show the company still building privacy-preserving mobile-ad APIs that reduce reliance on cross-party identifiers, limit event-level detail, and keep more information on-device. Yet Liftoff's own S-1/A frames the roadmap as unstable enough to call out Google policy shifts and the possibility that providers limit data access or platform access in ways that hurt Liftoff's economics. CMA records reinforce the point: Privacy Sandbox was subject to years of competition oversight and changing commitments before the CMA released them in late 2025. Meanwhile Europe has already turned targeted advertising into a legal-design problem, not just an optimization problem. The DSA bans targeted ads to children and requires ad transparency; the DMA places ex ante obligations on gatekeepers such as app stores. In the U.S., the Kochava enforcement action shows regulators are willing to treat mobile-ad-data practices as a consent problem with consequences reaching hundreds of millions of devices. Finally, the ByteDance/TikTok law path shows geopolitical risk can reshape market structure directly. A crackdown on ByteDance/TikTok or Mintegral/Mobvista-linked China-exposed ad channels could help Liftoff by removing competitor supply and budget destinations, but it could also destabilize cross-border spending patterns, create new compliance expectations, and drag the whole mobile-growth ecosystem into national-security politics.",
