  - id: milestones-scale-awards
    title: Scale evidence, milestones, and external validation
    body: >-
      Liftoff's public scale evidence is grounded in merger-era disclosures and sustained third-party award recognition.
      At the time of the August 2021 merger announcement, Liftoff was delivering more than two billion ads per day
      across more than 550,000 mobile apps in more than 140 countries through machine learning and creative
      optimization. Vungle at the same point operated more than 100,000 direct SDK integrations across mobile app
      publishers and 15,000 individual content creators on its influencer marketing platform, and served an advertiser
      base of more than 4,500 companies. These figures are merger-era company claims and have not been updated in
      current public materials; the current combined platform's reach is likely larger but not independently verifiable
      from available sources.

      External recognition supports scale. Inc. has included Liftoff on its Inc. 5000 list of fastest-growing private
      companies for eight consecutive years through 2024, ranking it No. 2,687 in the 2024 edition and as high as No. 8
      in 2017. The 2024 Inc. profile lists company size in the 501–1,000 headcount range and names Jeremy Bondy as
      current leadership. AppsFlyer's Performance Index 17, covering H1 2024 and based on 13.5 billion non-organic
      installs across 35,000 apps, awarded Liftoff dozens of top-10 accolades globally across iOS and Android in gaming
      and non-gaming categories, confirming competitive effectiveness at scale. The AppsFlyer Performance Index 2025
      (December 2025, 16.2 billion installs, 39,000 apps) documented a narrowing competitive landscape among top mobile
      ad platforms, providing broader industry context for Liftoff's positioning. The company currently maintains twelve
      offices across Redwood City, London, Singapore, Beijing, Berlin, San Francisco, Los Angeles, Orange County, New
      York, Paris, Helsinki, and Seoul.
