chapter:
  number: 1
  title: Company Overview
  summary: >-
    Liftoff Mobile is a Redwood City-based AI-enabled end-to-end mobile growth platform founded in 2012, formed into
    its current scale through a 2021 merger with Vungle under Blackstone majority ownership, and valued at $4.3 billion
    following a July 2025 General Atlantic minority investment with Blackstone remaining majority owner. The company
    operates five product lines powered by its proprietary Cortex AI platform across twelve global offices, with
    revenue, precise headcount, and internal KPIs remaining undisclosed as a private company.
sections:
  - id: identity-founding-model
    title: Identity, founding, and business model
    body: >-
      Liftoff Mobile, Inc. is a global performance marketing and monetization platform for the mobile app economy,
      headquartered at 900 Middlefield Rd, Floor 5, Redwood City, California. Founded in 2012 by Mark Ellis, Phil
      Crosby, and Harry Robertson, the company positioned itself from inception as an ROI-focused, machine-learning-driven
      alternative in mobile app user acquisition at a time when few independent options existed. Its official mission is
      to connect people to the mobile apps and tools they love, pursued through AI-powered marketing, monetization, and
      creative solutions that create better ad experiences. The company's web domain migrated from liftoff.io to
      liftoff.ai, reflecting its current AI positioning.

      The business model is performance-driven: Liftoff earns revenue by helping mobile app marketers acquire and retain
      high-value users at scale, helping mobile app publishers monetize their inventory, and providing analytics and
      creative optimization tools to improve overall app growth economics. The company serves four distinct customer
      segments—marketers, agencies, demand-side platforms, and mobile game developers—through five product lines:
      Accelerate (machine-learning user acquisition), Monetize (publisher monetization), Vungle Exchange (programmatic
      exchange), Creative Studio (creative optimization), and Intelligence (market analytics and game intelligence). These
      five lines are unified under the proprietary Cortex AI platform. The 2021 merger with Vungle extended the model
      from pure user acquisition into a full end-to-end cycle covering supply, demand, creative, and analytics,
      positioning the combined entity as a privacy-friendly independent alternative to the major walled gardens.
