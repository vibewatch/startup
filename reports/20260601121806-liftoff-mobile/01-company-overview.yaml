callouts:
  - calloutType: strength
    title: Dual-PE backing at $4.3B confirms institutional conviction
    body: >-
      Blackstone's retention of majority ownership alongside General Atlantic's new minority position at a $4.3 billion
      valuation is a strong institutional signal. Blackstone has deployed capital across both sides of the mobile ad
      ecosystem—Liftoff (demand) and Vungle (supply)—and drove the transformative 2021 merger. General Atlantic's
      addition raises the governance quality bar and provides a second institutional voice without forcing a control
      transfer. The dual-PE structure also increases M&A firepower and exit optionality.
    claimRefs:
      - CO015
      - CO016
      - CO017

  - calloutType: risk
    title: Revenue, cap table, and governance remain opaque
    body: >-
      As a private company with no public filings, Liftoff does not disclose revenue, EBITDA, or exact ownership
      percentages. Board composition and governance documents are also unpublished. Any diligence proceeding to term
      sheet must obtain full financial statements, audited accounts, cap table, board minutes, and management
      incentive plan details directly from the company and its PE owners before any valuation judgment can be made.
    claimRefs:
      - CO019
      - CO038
      - CO039

  - calloutType: insight
    title: Merger-era scale figures require re-verification for current diligence
    body: >-
      The most specific publicly available scale metrics—2B+ ads/day, 550k+ apps, 140+ countries, 100k+ SDK
      integrations—are company claims from the August 2021 merger announcement. Four-plus years of integration and
      growth mean current figures are almost certainly larger but are not verified from public sources. Any competitive
      or market analysis should treat these as lower-bound indicators, not current KPIs.
    claimRefs:
      - CO026
      - CO027
      - CO028
      - CO040

  - calloutType: risk
    title: Apple ATT is a structural constraint on device-level mobile ad targeting
    body: >-
      Apple's App Tracking Transparency framework, mandatory since iOS 14.5, requires user opt-in before apps can
      track device identifiers for advertising. This materially constrains device-level targeting for performance
      marketing platforms including Liftoff, pushing the industry toward probabilistic, contextual, and on-device
      signal models. Liftoff's privacy-friendly positioning and Cortex AI investment are partly a strategic response
      to this constraint, but the underlying targeting limitation is permanent unless Apple policy changes.
    claimRefs:
      - CO037
