  - id: capital-ownership-valuation
    title: Funding history, ownership, and valuation
    body: >-
      Liftoff's capital structure reflects a Blackstone-led private equity ownership that pre-dates and drove the
      formation of the current company. Blackstone acquired a majority stake in Vungle in July 2019 for a reported
      approximately $750 million, and separately invested approximately $400 million in Liftoff before orchestrating
      the 2021 merger of both portfolio companies. The merger announcement on August 24, 2021 described the combination
      as creating one of the world's largest independent and privacy-friendly platforms in mobile app growth; the deal
      closed in October 2021 with Blackstone remaining majority shareholder.

      On May 5, 2025, Blackstone announced an agreement to sell a minority stake to General Atlantic at a $4.3 billion
      company valuation, with Blackstone explicitly retaining its majority position. The transaction was advised on the
      Liftoff/Blackstone side by Goldman Sachs and Jefferies (financial) and Simpson Thacher & Bartlett (legal), and on
      the General Atlantic side by Morgan Stanley (financial) and Paul Weiss (legal). The deal closed on July 1, 2025
      per the PRNewswire close announcement—the highest publicly confirmed valuation benchmark for the company.
      General Atlantic's Tanzeen Syed cited Liftoff's AI technology, execution quality, and customer centricity as the
      investment thesis, and General Atlantic's support is explicitly directed at scaling the Cortex AI platform and
      pursuing strategic M&A.

      Revenue, EBITDA, and internal financial KPIs have not been publicly disclosed. The company is privately held with
      no public filings. Exact ownership percentages for both Blackstone and General Atlantic, the full cap table, and
      any founder equity rollover terms are also not available from public sources—all of these are first-priority
      diligence items.
