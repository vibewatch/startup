slug: liftoff-mobile
runDate: '2026-06-01'
company:
  name: Liftoff Mobile
chapter:
  number: 8
  title: Valuation
  summary: >-
    Treat the $4.3 billion 2025 General Atlantic minority investment as the observed private-market anchor, not as
    settled fair value. Fresh 2026 IPO marketing reset that anchor to roughly $3.66-$3.9 billion on disclosed trailing
    revenue of $741 million, while public comps span from about 2x sales (Digital Turbine) to more than 32x
    (AppLovin), making Liftoff look stretched at the 2025 mark but more defensible in the high-$3 billions if
    diligence confirms durable take rate, clean leverage, and mid-20s-plus EBITDA margins.
sections:
  - id: observed-mark-vs-public-reset
    title: Observed transaction anchor vs. 2026 public-market reset
    body: >-
      The cleanest observed valuation datum remains the May 2025 Blackstone/General Atlantic transaction, which priced
      Liftoff at $4.3 billion while explicitly leaving Blackstone in majority control. That matters because it confirms
      a real arm's-length minority transaction rather than a purely internal sponsor mark. However, the next market test
      is even more relevant for underwriting: by late May 2026, Liftoff launched an IPO roadshow for 19 million shares
      at $20-$22, and Reuters-reported coverage said the company was targeting a valuation of up to roughly $3.66
      billion. Renaissance Capital's IPO note framed the midpoint as about $3.9 billion fully diluted, meaning public
      buyers were being asked to accept a roughly 9%-15% lower equity value than the 2025 minority deal.

      The valuation reset is more informative because the IPO materials also surfaced a current revenue base. Liftoff's
      revived IPO marketing disclosed roughly $741 million of revenue for the trailing twelve months ended March 31,
      2026, more than 1,000 marketers, more than 140,000 SDK-integrated apps, and roughly 1.4 billion Q4 2025 daily
      active users reached through those integrations. On that disclosed revenue base, the $4.3 billion 2025 mark
      implies about 5.8x sales, while the 2026 IPO high end implies about 4.9x and the IPO midpoint implies about 5.3x.
      That does not prove the 2025 mark was wrong; it does show that once public investors had fresher operating data,
      they demanded a lower price for the same sponsor-controlled asset.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
