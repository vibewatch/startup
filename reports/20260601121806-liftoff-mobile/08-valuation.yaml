  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - argument
      - supporting evidence
      - what would change the view
    rows:
      - - Independent scaled mobile growth platform merits premium to generic adtech
        - $741M trailing revenue, 140k+ integrated apps, and 1.4B Q4 2025 DAUs show real scale.
        - Evidence of low take rate, weak margins, or concentrated revenue would reduce premium support.
      - - Sponsor-led ownership can accelerate M&A and operational discipline
        - Blackstone remained majority owner after the 2025 minority sale and backed the 2026 IPO path.
        - Hidden leverage, aggressive sell-down terms, or sponsor overhang would weaken minority economics.
      - - Public market reset creates a more usable entry framework than the 2025 sponsor mark
        - 2026 IPO range of roughly $3.66B-$3.9B is below the prior $4.3B mark.
        - A successful re-pricing above the range with strong aftermarket support would strengthen the bull case.
      - - 'Anti-thesis: valuation still depends on assumptions rather than disclosed take-rate economics'
        - Revenue is public, but gross spend, take rate, and normalized EBITDA are still not publicly disclosed.
        - Direct disclosure of billings, margin bridge, and debt would materially improve underwriteability.
    notes: >-
      The anti-thesis is not business-quality denial; it is a pricing objection grounded in missing unit-economics and
      sponsor-structure disclosure.
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV016
      - CV035
      - CV041
      - CV042
