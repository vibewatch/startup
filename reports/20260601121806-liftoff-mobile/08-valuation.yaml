  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - case
      - operating assumptions
      - valuation logic
      - probability signal
      - downside / upside trigger
    rows:
      - - Bull
        - Revenue scales from $741M toward ~$850M with 25%-30% EBITDA and resilient platform demand.
        - 6x-7x sales supports roughly $5.1B-$6.0B of equity value.
        - Requires IPO execution, clean diligence on take rate, and evidence that Liftoff behaves more like premium ad software than cyclical intermediation.
        - Strong post-IPO demand, disclosed margin expansion, and sponsor sell-down discipline.
      - - Base
        - Revenue holds around current disclosed scale with EBITDA converging toward the mid-20s.
        - 4.5x-5.5x sales supports roughly $3.3B-$4.1B, clustering around the high-$3 billions.
        - Closest fit to current public evidence.
        - Stable growth, no leverage surprise, and no evidence of fragile arbitrage in UA economics.
      - - Bear
        - Revenue slows toward ~$650M-$700M, margin stalls below 20%, and public comps remain unforgiving.
        - 3x-4x sales supports roughly $2.0B-$2.8B.
        - Most likely if sponsor urgency or public-market skepticism dominates.
        - Another IPO delay, disappointing public filing detail, or comp multiple compression.
    notes: >-
      Scenario ranges are estimated from disclosed 2026 revenue and public sales-multiple references; they are not
      management projections.
