  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - metric
      - multiple / valuation / status
      - relevance
      - limitation
    rows:
      - - Liftoff (2025 observed transaction)
        - 2025 minority-transaction equity value
        - $4.3B; ~5.8x sales on 2026 disclosed revenue base
        - Real sponsor-backed market anchor for the exact asset
        - Private transaction; does not reveal leverage, preferences, or full cap-table terms
      - - Liftoff (2026 revived IPO midpoint)
        - Fully diluted equity value at $21 midpoint
        - ~$3.9B; ~5.3x sales
        - Freshest public-market read-through with operating disclosure
        - Marketing range, not final priced-and-traded outcome
      - - Liftoff (2026 revived IPO high end)
        - Reuters-reported target valuation
        - ~$3.66B; ~4.9x sales
        - Clean external reset versus 2025 minority mark
        - Depends on deal completion and market window staying open
      - - AppLovin
        - June 2026 public trading multiple
        - ~$198.3B market cap on ~$6.16B TTM revenue; ~32x sales
        - Shows premium outcome for mobile-ad software with exceptional profitability
        - Extreme outlier; recent $40B drawdown highlights volatility and regulatory sensitivity
      - - The Trade Desk
        - June 2026 public trading multiple
        - ~$9.6B-$10.7B market cap on ~$2.9B-$3.0B revenue; ~3.3x-3.6x sales
        - Useful scaled independent adtech comp with better disclosure and durable software posture
        - Business mix is more DSP/CTV-centric than mobile-app monetization
      - - Digital Turbine / Damodaran advertising baseline
        - June 2026 public multiple / broad sector baseline
        - ~2.0x sales for Digital Turbine; 2.12x EV/sales for advertising sector
        - Provides downside anchor for cyclical or lower-margin mobile adtech
        - Likely too punitive if Liftoff's monetization quality and margin profile are materially better
    notes: >-
