  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold / event
      - transmission to thesis
      - action implication
    rows:
      - - Public-market price discovery breaks below reset range
        - Final IPO or secondary clearing price materially below roughly $3.6B
        - Signals that even the reset range overstates sustainable public value
        - Move from track to avoid until a new floor forms
      - - Take-rate economics disappoint
        - Gross spend disclosure implies structurally low take rate or weak contribution margins
        - Undercuts premium-vs-sector thesis
        - Re-underwrite closer to TTD / Digital Turbine or sector-baseline multiples
      - - Hidden leverage or sponsor overhang emerges
        - Debt load, preference stack, or planned sell-down is more aggressive than expected
        - Minority equity upside becomes exit-timing dependent rather than operating-performance dependent
        - Require price concession or stand down
      - - Revenue quality weakens under scrutiny
        - Filing detail suggests concentration, volatile advertiser cohorts, or artificial growth from short-lived arbitrage
        - Converts a premium growth story into cyclical ad intermediation
        - Shift to bear-case framework
    notes: >-
      These are thesis-break triggers rather than generic risks; each would change valuation support, not just narrative
      sentiment.
    claimRefs:
      - CV021
      - CV034
      - CV040
      - CV042
      - CV043
      - CV046
      - CV048

  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Gross spend and take rate
        - Gross billings, net revenue bridge, and revenue split between UA and monetization
        - Core missing variable behind sales-multiple and EBITDA support
        - Management session plus S-1 financial footnotes and KPI schedules
      - - Capital structure
        - Net debt, preferred terms, secondary allocation, and sponsor sell-down plan
        - Minority returns depend on more than enterprise value
        - CFO diligence and cap-table/legal review
      - - Margin quality
        - Adjusted EBITDA bridge, stock comp, capex, and cash conversion
        - Determines whether $4.3B is 16x, 23x, or nearly 40x economic earnings
        - Finance diligence package and post-IPO filing review
      - - Customer durability
        - Concentration, cohort retention, top-10 advertiser mix, and publisher churn
        - Premium multiples only hold if revenue quality is durable
        - Revenue analytics pack and customer-cohort review
    notes: >-
      Every ask is directly tied to a valuation variable that remains only partially observable from public materials as of
      run date.
    claimRefs:
      - CV035
      - CV036
      - CV040
      - CV042
      - CV048

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from one observed private-market mark through a lower 2026 IPO reset, then through comp
      dispersion and missing take-rate data, ending in a track stance rather than a buy call.
    data:
      nodes:
        - id: observed-mark
          label: 2025 observed mark
          detail: $4.3B minority transaction with Blackstone retaining majority control.
          tone: positive
        - id: public-reset
          label: 2026 IPO reset
          detail: ~$3.66B high end / ~$3.9B midpoint on disclosed $741M trailing revenue.
          tone: warning
        - id: comp-spread
          label: Comp spread
          detail: AppLovin trades at a premium multiple while TTD and Digital Turbine sit much lower.
          tone: neutral
        - id: diligence-gap
          label: Missing take rate + leverage detail
          detail: Revenue is disclosed, but billings, gross spend, and capital-structure detail are not.
          tone: risk
        - id: stance
          label: Track, not buy
          detail: Only become aggressive if diligence proves durable mid-20s-plus EBITDA margins and clean sponsor economics.
          tone: warning
      edges:
        - from: observed-mark
          to: public-reset
        - from: public-reset
          to: comp-spread
        - from: comp-spread
          to: diligence-gap
        - from: diligence-gap
          to: stance
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV032
      - CV040
      - CV048

