  - id: investment-stance-and-diligence
    title: Investment stance — balanced, price-sensitive, and still dependent on diligence
    body: >-
      The chapter's bottom line is deliberately balanced. The observed $4.3 billion 2025 transaction deserves respect
      because it was real and sponsor-backed, not hypothetical. Liftoff is also clearly not a subscale asset: IPO
      materials imply roughly $741 million of trailing revenue, more than 1,000 marketers, more than 140,000 app
      integrations, and global reach into roughly 1.4 billion daily active users. Those facts support a serious
      enterprise, not a vanity mark. But the best fresh market evidence cuts the other way. The revived IPO was pitched
      below the prior private mark, the first 2026 IPO attempt had already been withdrawn, and public comp dispersion is
      so wide that paying a premium without hard take-rate and leverage evidence would amount to optimism masquerading as
      diligence.

      My stance is therefore track, not buy, at the 2025 mark. The high-$3 billions look closer to where public evidence
      converges today; $4.3 billion can still work, but only if management can show that EBITDA margins plausibly trend
      into the mid-20s or better, that the capital structure is clean, and that core user-acquisition plus monetization
      revenue is not overly dependent on temporary arbitrage or sponsor timing. If those points are proven, the upside
      case remains intact. If they are not, then the anti-thesis dominates: Liftoff becomes a solid company whose price
      got ahead of what public evidence can justify.
    claimRefs:
      - CV008
      - CV011
      - CV021
      - CV040
      - CV045
      - CV046
      - CV047
      - CV048
    tableRefs:
      - TV005
      - TV006
    figureRefs:
      - FV004

tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - item
      - assessment
      - evidence
      - implication
    rows:
      - - Recommendation
        - Track
        - IPO-reset range and peer comp spread support patience rather than an immediate buy.
        - Underwrite only on a lower entry or after diligence closes key gaps.
      - - Confidence
        - Medium
        - Fresh revenue and IPO range exist, but leverage, take rate, and normalized EBITDA remain undisclosed.
        - Avoid false precision.
      - - Risk rating
        - High
        - Sponsor-led exit timing plus wide public comp dispersion raise mark-to-market risk.
        - Price discipline matters more than narrative quality.
      - - Valuation stance
        - Stretched at $4.3B; fairer around $3.7B-$3.9B
        - 2025 mark is ~5.8x sales versus IPO-reset ~4.9x-5.3x.
        - Premium only works if margins prove materially above broad advertising averages.
      - - Decision implication
        - Do not pay the 2025 mark blindly
        - Public evidence converges closer to high-$3 billions than to the original minority transaction.
        - Make take-rate, leverage, and EBITDA confirmation explicit conditions.
    notes: >-
      Derived from observed 2025 transaction terms, 2026 IPO marketing, and public-comp math; not a management-guided
      target price.
