  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: TV004 comparable-set still lacks direct gross-spend-and-take-rate disclosure
      missingEvidence: Gross billings, advertiser spend processed, and the revenue bridge from media volume to net revenue.
      whyItMatters: Take-rate disclosure is the core missing variable behind both sales-multiple comparability and EBITDA support.
      diligencePath: Request S-1 KPI schedules or management-level revenue bridge showing gross spend, take rate, and segment mix.
      relatedQuestionRefs: [QV029]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Net debt, preferred terms, secondary allocation, and sponsor sell-down plan.
      whyItMatters: Minority returns depend on realized exit proceeds, not just on enterprise value headlines.
      diligencePath: Review the cap table, debt schedule, underwriting agreement, and any sponsor lock-up / secondary documentation.
      relatedQuestionRefs: [QV030]
    - type: missing-source
      severity: material
      topic: normalized-ebitda
      missingEvidence: Adjusted EBITDA bridge, stock-comp normalization, capex intensity, and cash-conversion detail.
      whyItMatters: The chapter can bracket EV/EBITDA scenarios, but cannot yet underwrite one normalized earnings number with confidence.
      diligencePath: Obtain filing-level bridge tables and management commentary reconciling revenue to operating income, EBITDA, and free cash flow.
      relatedQuestionRefs: [QV029]
    - type: stale
      severity: minor
      topic: final-ipo-outcome
      missingEvidence: Final pricing, aftermarket performance, and whether the revived IPO actually cleared.
      whyItMatters: The current chapter is anchored on launch-era marketing terms rather than a closed public-market print.
      diligencePath: Refresh after pricing or withdrawal to replace marketing range assumptions with an observed market-clearing valuation.
      relatedQuestionRefs: [QV029, QV030]
