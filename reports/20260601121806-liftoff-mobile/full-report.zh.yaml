  - id: FU002
    title: 采用 / 部署流——营销方从试跑到钱包份额放大
    type: flow
    layout: standard
    summary: 证据最充分的广告主路径偏定性而非数字：先试跑，再验证 KPI、扩大预算，随后跨产品采用。
    data:
      nodes:
        - id: awareness
          label: 认知 / RFP
          detail: 营销方通过表现排名、同行推荐或交易所测试发现 Liftoff，开始 RFP 或试点评估。
          tone: neutral
        - id: first-campaign
          label: 首个投放活动
          detail: UA 团队按 CPI、CPA 或 ROAS 目标启动首个活动，并通过 MMP 接入归因或回传事件。
          tone: neutral
        - id: outcome-validation
          label: 结果验证
          detail: 活动表现跨过业务门槛，例如 CPA 降低、安装提升或增量效果改善。
          tone: positive
        - id: production-scale
          label: 生产放量
          detail: 试点跑通后，客户扩大花费、地域、App 平台或广告格式。
          tone: positive
        - id: cross-product
          label: 跨产品采用
          detail: 账户叠加重定向、Creative Studio、Influence，或更深的发布商侧变现工作流。
          tone: positive
      edges:
        - from: awareness
          to: first-campaign
        - from: first-campaign
          to: outcome-validation
        - from: outcome-validation
          to: production-scale
        - from: production-scale
          to: cross-product
    approximationNotes: 流程阶段是定性的，由证据牵引；Liftoff 不披露潜在客户、试点、验证或扩张转化数量。
