      - number: '4.5'
        title: 资本充足性、所有权结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的资本结构来自 Blackstone 主导的私募股权控股，后者推动了当前公司形态的形成。Blackstone 于 2019 年以约 $750 million 收购 Vungle，Liftoff 与
              Vungle 于 2021 年正式合并，组成现在的平台。General Atlantic 交易后，Blackstone 仍是多数股东。


              2025 年 5 月宣布、2025 年 7 月完成的 General Atlantic 交易，被双方明确描述为少数股权成长投资。Goldman Sachs 和 Jefferies 为 Liftoff 与
              Blackstone 提供顾问服务，Morgan Stanley 为 General Atlantic 提供顾问服务，说明该交易经过正式流程，并对未披露的 Liftoff 财务数据做了机构级尽调。由于
              Blackstone 仍是多数股东，且交易是少数股权而非控制权转让，这笔交易更像是估值验证和资本支持，而不是完整的财务赞助方退出。


              公开资料没有披露现金余额、月度烧钱速度、现金跑道、信贷额度、定期贷款或股息再融资历史。对于这个规模的 Blackstone 组合公司，债务与赞助方流动性结构和收入增长同样重要，但公开来源无法确认 GA
              投资属于新股、老股交易，还是二者混合。


              退出路径的背景在改善，但仍具选择性。Bain 报告称 2025 年退出活动走强，同时退出时平均持有期仍在约七年，赞助方手里仍有大量未售公司；Axios 另称，2026 年 4 月和 5
              月科技并购实际上处于「冻结」状态，一些赞助方转向延续基金和优先融资，而不是直接出售。对 Liftoff 而言，IPO、赞助方之间出售、战略出售，或继续持有 / 资本重组都仍有可能；GA 的少数股权支票给
              Blackstone 增加了选择权，而不是迫使其立即变现。
