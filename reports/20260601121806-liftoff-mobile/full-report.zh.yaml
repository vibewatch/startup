      - number: '7.3'
        title: 依赖集中和赞助方治理风险放大执行压力
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的平台风险被拍卖上下游的依赖集中进一步放大。在上游，Apple 和 Google 控制操作系统、应用商店、标识符政策，以及决定 Liftoff 能观察多少信号的许多测量界面。在下游，Liftoff
              依赖广告主持续投放、发布商继续通过广告支持型应用变现，以及直接 SDK 关系和第三方聚合器中的供给保持健康。最新 S-1/A 明确给出了资本结构叠加层。Liftoff 已启动 2026 年 IPO 路演，但发行后
              Blackstone 仍将控制约一半投票权；如果多数控制持续，公司很可能按 Nasdaq
              规则成为受控公司。这意味着上市不会完全移除赞助方对治理、董事会构成或时间优先级的影响。融资路径也显示估值和流动性张力：2026 年 IPO 目标最高约 $3.66 billion，低于 2025 年
              General Atlantic 少数股权投资公告强调的 $4.3
              billion。结合公司自己没有量化的「显著增长」说法，公开记录指向一家公司：它一边被要求证明合并后的持久规模、留存和利润率韧性，一边赞助方正主动推进流动性。这个组合会让测量失误、竞争份额流失或平台政策冲击更危险，因为它们可能与已经启动的退出流程相撞。
