        - 应用营销客户
        - 低
        - 尽调中确认合同起始与续约日期，以及当前年度支出水平。
      - - 第三方评价信号
        - TrustRadius：Vungle 3 条评价得 8/10；FeaturedCustomers：Liftoff 2,135 条参考评分得 4.8/5.0
        - 广告主 / 发布商
        - 中
        - 在将留存写入投资假设前，向头部客户背调报告深度、CPM 效率和区域规模。
      - - 开发者集成摩擦
        - Google 聚合仓库的问题提到，设置 Liftoff Monetize 时，适配器初始化约需 ~30 秒，并会短暂保留 Activity
        - 使用聚合的发布商
        - 中
