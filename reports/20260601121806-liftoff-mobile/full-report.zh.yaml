              Blackstone 在 General Atlantic 以 $4.3 billion 估值新获少数股权的同时保留控股权，这是强机构信号。Blackstone
              已在移动广告生态两端部署资本——Liftoff（需求）和 Vungle（供给）——并推动了 2021 年转型性合并。General Atlantic
              的加入抬高了治理质量门槛，在不触发控制权转移的情况下提供第二个机构声音。双 PE 结构也增强 M&A 火力和退出可选性。
