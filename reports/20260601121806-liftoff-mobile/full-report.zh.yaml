  - id: FI001
    title: 收入模型桥接——广告主支出如何变成净收入
    type: flow
    layout: wide
    summary: Liftoff 在经 Accelerate 流入的广告主支出与经 Monetize/Exchange 流出的发布商付款之间赚取差额；Cortex AI 位于中枢，同时优化供给和需求定价。
    data:
      nodes:
        - id: advertiser
          label: 广告主 / 代理商
          detail: 通过 Accelerate 为移动用户获取投放按 CPI、CPA、ROAS 等结果指标付费。
          tone: positive
        - id: cortex
          label: Cortex AI 平台
          detail: ML 引擎预测用户 LTV，在供给来源之间分配预算，优化创意，并设定出价。
          tone: positive
        - id: accelerate
          label: Accelerate（需求侧）
          detail: 在 Vungle Exchange 和第三方 SSP 购买展示；靠广告主收入与 TAC 之间的价差赚取毛利。
          tone: positive
        - id: exchange
          label: Vungle Exchange（市场）
          detail: 程序化竞价层；第三方 DSP 在这里接入发布商库存；按成交价抽成。
          tone: positive
        - id: monetize
          label: Monetize / Vungle SSP（供给侧）
          detail: 发布商通过 Vungle SDK 或应用内竞价集成，按展示获得分成付款。
          tone: positive
        - id: publishers
          label: 发布商 / 移动应用开发者
          detail: 通过 Vungle SDK 变现库存；扣除支付给发布商的分成后，就是 Liftoff 的供给侧毛利。
          tone: neutral
      edges:
        - from: advertiser
          to: accelerate
        - from: accelerate
          to: cortex
        - from: cortex
          to: exchange
        - from: exchange
          to: monetize
        - from: monetize
          to: publishers
        - from: cortex
          to: accelerate
    approximationNotes: 收入流结构由官方产品页以及与公开可比 DSP/SSP 平台的商业模式类比推断。实际抽成率、收入分成比例和利润步骤未公开披露，不应从该图推断。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI017
  - id: FI002
    title: 单位经济桥接——未披露成本结构的定性代理
    type: flow
    layout: standard
    summary: 从广告主总投放到自由现金流，每一步都会引入未披露的成本项；私营公司的披露状态让这座桥在结构上不完整。
    data:
      nodes:
        - id: gas
          label: 广告主总投放（未披露）
          detail: 通过 Accelerate 流入的广告主媒体总投放；显著高于报告口径净收入。
          tone: neutral
        - id: net_rev
          label: 净收入（未披露；估计 $400M–$700M）
          detail: 总投放扣除发布商 TAC、交易所费用和第三方库存成本。收入确认取决于 ASC 606 下的主代理身份判断。
          tone: neutral
        - id: gross_profit
          label: 毛利（未披露；同业区间 40–65%）
          detail: 净收入扣除直接收入成本，包括剩余发布商付款、基础设施和数据成本。
          tone: neutral
        - id: ebitda
          label: 调整后 EBITDA（未披露；同业区间 20–55%）
          detail: 扣除 S&M、R&D、G&A 之后。AppLovin 约 82%；Digital Turbine 在 FY2025 达到约 14.7%。
          tone: neutral
        - id: fcf
          label: 自由现金流（未知；受债务偿付影响）
          detail: EBITDA 扣除资本开支、营运资本、债务利息和任何赞助方分配；完全未披露。
          tone: warning
      edges:
        - from: gas
          to: net_rev
        - from: net_rev
          to: gross_profit
        - from: gross_profit
          to: ebitda
        - from: ebitda
          to: fcf
    approximationNotes: 收入和利润率估计仅作示意，来自估值倍数推断和上市同业类比。该桥接图每一步都未获确认。任何投资者沟通中都应把这张图标为估计 / 不可得。
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI038
  - id: FI003
    title: 示意性财务估计区间——锚定同业，并非来源确认
    type: range
    layout: wide
    summary: 五项财务指标的低 / 基准 / 高区间来自公开同业倍数和估值锚点推断；没有一项是 Liftoff 披露数字，全部标记为估计。
    data:
      items:
        - label: 隐含净收入（估计，来自 $4.3B 估值）
          low: 350
          mid: 520
          high: 720
          unit: $M
          detail: 将 6x–12x EV/收入倍数（Digital Turbine 到 AppLovin 的同业区间）套用到 $4.3B GA 投资估值推导而来。中位值对应约 8x 隐含倍数，符合高增长独立平台。不是披露数字。
          source: Estimated (peer multiples applied to GA valuation)
          tone: neutral
        - label: 调整后 EBITDA 利润率（估计，同业框定）
          low: 18
          mid: 38
          high: 60
          unit: '%'
          detail: 低端锚定 Digital Turbine（14.7%），并因 Liftoff 可能具备规模优势而上调；高端接近 AppLovin（82%），但因规模更小、供需混合经济性而打折。全为估计。
          source: Estimated (AppLovin 82%, Digital Turbine 14.7% anchors)
          tone: neutral
