  - id: TV001
    title: 建议摘要表
    columns:
      - 项目
      - 评估
      - 证据
      - 含义
    rows:
      - - 建议
        - 观察
        - IPO 重置区间和可比公司估值差支持耐心等待，而不是立刻买入。
        - 只有在入场价更低，或尽调补齐关键缺口后才测算。
      - - 置信度
        - 中
        - 已有新鲜收入数据和 IPO 区间，但杠杆、抽成率和常态化 EBITDA 仍未披露。
        - 避免虚假精确。
      - - 风险评级
        - 高
        - PE 股东主导的退出时点，加上公开可比公司估值分散，抬高了按市值重估的风险。
        - 价格纪律比叙事质量更重要。
      - - 估值立场
        - $4.3B 偏高；$3.7B-$3.9B 附近更合理
        - 2025 年标记约为销售额的 5.8x，而 IPO 重置约为 4.9x-5.3x。
        - 只有利润率被证明显著高于广义广告行业平均水平，溢价才站得住。
      - - 决策含义
        - 不要盲目支付 2025 年标记
        - 公开证据更接近 $3B 高位区间，而不是最初少数股权交易的定价。
        - 把抽成率、杠杆和 EBITDA 确认列为明确条件。
    notes: 来自已观察到的 2025 年交易条款、2026 年 IPO 营销材料和公开可比公司测算；不是管理层指引的目标价。
