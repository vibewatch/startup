  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 驱动因素或风险
      - 性质
      - 已观察证据
      - 风险兑现影响
      - 尽调路径
    rows:
      - - 广告主落地扩张
        - 正向扩张驱动
        - Ibotta 支出 5.7x；Stash 96.3%；Acorns Android→iOS；Just Eat 2→8+ 个市场；Delivery Hero LATAM 两位数增长
        - 提升既有账户收入；降低对新增广告主获客的依赖
        - 向管理层确认前 20 大广告主当前支出水平和同比增长率。
      - - 发布商变现深化
        - 正向扩张驱动
        - ZiMAD 月收入份额 5%→40%；Product Madness 整个组合接入竞价；Cashwalk 扩展 iOS
        - 提升每个发布商伙伴的钱包份额；一旦成为主栈，更难被替换
        - 向管理层要求提供前 20 大发布商在 Vungle Exchange 供给中的占比和填充率趋势。
      - - 企业客户队列扩张代理指标
        - 正向扩张驱动
        - 截至 Mar 31 2026，LTM Core Advertising NDR 为 130%，且有 384 个客户贡献 >$100K LTM 收入
        - 说明大型广告主队列存在净扩张，而不只是一次性活动量
        - 要求提供按细分市场拆分的队列瀑布，显示总留存、增购和降购，以确认发布商和 Intelligence 产品是否表现相近。
      - - 收入集中度（单一大客户）
        - 集中度风险
        - 未披露；Delivery Hero、Just Eat、TikTok 等大型广告主可能贡献显著支出
        - 如果高度依赖少数大账户，任何一个流失都会削弱收入稳定性
        - 要求提供 FY2024-FY2025 前 5 / 前 10 大客户收入占总收入百分比。
      - - 代理商和 DSP 渠道不透明
        - 集中度和利润率风险
        - 没有具名案例；该细分市场有营销露出，但贡献未知
        - 代理商撮合收入通常利润率更低，客户预算波动更大
        - 向管理层要求提供代理商 / DSP 细分收入占总收入百分比和客户数。
      - - Apple ATT 和 Google Privacy Sandbox
        - 反向结构性风险
        - ATT 自 April 2021 起限制 IDFA；Delivery Hero 承认归因质量下降；Privacy Sandbox 正在扩展
        - 信号质量下降会削弱 iOS UA 的 ML 模型表现，可能压低广告主 ROI 和留存
        - 要求提供 iOS/Android 收入拆分、SDK 上 ATT opt-in 率，以及 Cortex AI 在 ATT 前后的基准。
    notes: >-
      具名案例的扩张信号强，2026 年 IPO 摘要也增加了一个积极的队列数据点，但公开资料仍无法评估收入集中度、细分市场组合和代理商 / DSP 健康度。ATT 仍是结构性约束，Liftoff
      必须靠上下文、概率式或第一方数据替代方案来缓解。
