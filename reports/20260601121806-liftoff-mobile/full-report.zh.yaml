  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 竞争的市场，最准确描述是移动 app 效果营销和变现基础设施。核心边界包括：(1) 用户获取（UA）广告——按效果计价的移动广告投放，品牌和 app 开发者向广告网络付费，以可衡量的
              CPI 或 CPA 目标拉动 app 安装或 app 内事件；(2) 再营销和重定向——花费预算重新触达现有 app 的流失用户；(3) app
              内变现聚合——软件和交易所基础设施，在实时竞价中把多个买方广告需求路由到发行商库存；(4) 相邻的创意优化和分析工具，为前三类平台上的投放活动提供支持。

              不纳入该边界的是社交信息流上的通用品牌广告（Facebook、Instagram、TikTok 主信息流）、搜索广告（Google App Campaigns 的搜索渠道）、没有移动 app 安装目标的 联网电视
              / OTT 广告，以及不含媒体购买组件的应用商店优化（ASO）服务。购买 Liftoff 等独立网络的现状替代方案包括直接在 Meta Advantage+ 或 Google App Campaigns
              上自管投放、内部程序化团队，以及由代理商管理的整合采购。

              边界正在模糊的相邻市场包括零售媒体（app 内电商广告位）、休闲游戏激励视频库存，以及直接面向消费者的订阅获客；它们共享同一买方预算池，但未必使用专门移动 UA 网络。移动游戏市场是关键供给板块——2024
              年移动游戏 IAP 达到 $81 billion——同时也是游戏垂直 UA 的最大单一买方。非游戏 app 类别（金融、电商、娱乐）是增长更快的买方板块，2024 年下载量增长 12%，IAP/订阅收入增长
              25%。
