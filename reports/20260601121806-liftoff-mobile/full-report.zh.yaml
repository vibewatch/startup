      - number: '5.3'
        title: 部署、集成与信任控制
        blocks:
          - type: paragraph
            body: >-
              Vungle SDK 是发布商的主要集成点：它适用于 iOS、Android、Windows 和 Amazon Fire，被描述为轻量、易集成，并面向各种技能水平的开发者。7.6+
              版本把应用内竞价扩展到更多广告格式，并更新了广告投放机制。应用内竞价用统一实时拍卖取代人工瀑布流优化；Monetize 平台接入所有主要聚合伙伴，包括 ironSource、MAX
              以及其他头部聚合栈。Liftoff 的 ROAS Optimization 产品通过 MMP（移动监测伙伴）发送回传，确认其接入 AppsFlyer 和 Adjust 等 MMP 数据管线。

              在需求侧，Accelerate 通过主要广告交易所程序化采购库存，也通过 Accelerate 到 Vungle Exchange 的直连采购路径单独买量；后者避免再经纪流量，并被称为覆盖 Vungle 交易所约
              80% 的独立展示。Liftoff 称，其客户、创意、产品和工程团队为广告主提供个性化服务。

              在隐私与合规方面，Liftoff 的欧盟《数字服务法》FAQ 确认其自 2024 年 2 月 16 日起完全合规，为通过 Monetize 服务的所有欧盟和英国库存提供符合 DSA
              的广告披露（广告主名称、定向参数、可点击隐私图标）。Liftoff 隐私政策记录了设备标识符、IP 地址、应用使用和广告互动事件等数据收集。EMEA
              实体发布的《现代奴役声明》显示其在该司法辖区履行法律合规。公司称其不使用基于 IP 的指纹识别来做概率归因，因此仍在 Apple App Tracking Transparency 服务条款之内。公开资料没有披露
              SOC 2、ISO 27001 或其他安全认证，也没有在公共状态页发布事故历史或 SLA 承诺。
