  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 经营假设
      - 估值逻辑
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观
        - 收入从 $741M 扩到 ~$850M，EBITDA 率 25%-30%，平台需求韧性强。
        - 6x-7x 销售额倍数支持约 $5.1B-$6.0B 股权价值。
        - 需要 IPO 执行顺利、抽成率尽调干净，并有证据显示 Liftoff 更像高质量广告软件，而不是周期性中介。
        - IPO 后需求强劲、利润率扩张披露清晰，且 PE 股东减持有纪律。
      - - 基准
        - 收入维持在当前披露规模附近，EBITDA 率向 20% 中段收敛。
        - 4.5x-5.5x 销售额倍数支持约 $3.3B-$4.1B，集中在 $3B 高位区间。
        - 与当前公开证据最贴近。
        - 增长稳定、没有杠杆意外，也没有证据显示 UA 经济性依赖脆弱套利。
      - - 悲观
        - 收入放缓至 ~$650M-$700M，利润率卡在 20% 以下，公开可比公司倍数仍不宽容。
        - 3x-4x 销售额倍数支持约 $2.0B-$2.8B。
        - 如果 PE 股东退出急迫性或公开市场怀疑占主导，这一情景最可能出现。
        - IPO 再次推迟、公开申报细节令人失望，或可比公司倍数压缩。
    notes: 情景区间基于已披露的 2026 年收入和公开销售额倍数参考估算；不是管理层预测。
