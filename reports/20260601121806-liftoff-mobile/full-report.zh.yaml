      - number: '4.2'
        title: GTM 动作、定价机制和销售效率替代指标
        blocks:
          - type: paragraph
            body: >-
              Liftoff 服务四类不同客户——移动营销方、代理商、需求方平台和发行商 /
              移动游戏开发者——每类都有不同价值主张，也可能有不同定价和合同结构。公司不公布任何产品的标价。官方产品页和案例研究证据显示，它更偏托管服务：投放由主动账户管理、创意优化支持和增量测量协助配套执行。Delivery
              Hero 案例研究展示 Liftoff 在 LATAM 市场运行分组测试增量实验，以证明 20% 事件提升——这种服务密集型互动不符合纯自助服务。Calm 的影响者营销 ROI 通过 Liftoff
              Influence 提升超过 50%，也反映托管式互动。

              各产品线定价单位并不统一。Accelerate 可能使用 CPM（每千次展示成本）、CPI（每次安装成本）或 CPA（每次行动成本）定价，并按投放协商。Monetize 使用基于收益的发行商收入分成。Vungle
              Exchange 使用基于拍卖的 CPM 定价，并收取抽佣率。Creative Studio 定价未披露——可能与投放花费打包，也可能收取托管创意费用。Intelligence 订阅价格未披露，但考虑
              GameRefinery 传承，更接近 SaaS 按席位或按市场访问收费。

              公司未披露 CAC、回本周期、平均合同价值、销售周期长度、配额达成率或 NRR 数据。客户关系质量唯一替代指标是案例研究证据库（四个公开案例，覆盖 delivery-hero、cashwalk、calm 和
              product-madness）以及投资人沟通中的零散表述（“以客户为中心”“扩展组合”）。有意义的销售效率尽调问题是，双边市场结构（同时服务广告主和发行商）是否会形成自然交叉销售，进而降低净获客成本——这在成功广告技术公司中常见，但
              Liftoff 没有 NRR 或队列数据，无法证实。
