      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              五个结构性顺风正在扩大移动 app 效果营销市场。第一，非游戏 app 变现增速超过游戏：2024 年非游戏 IAP 收入同比增长 23%，2025 年 Q2 非游戏 IAP 首次超过游戏（$21.1
              billion vs $20 billion），食品饮料 app 收入同比增长 44%。买方池因此大幅扩展到游戏广告主之外。

              第二，新兴市场正在扩大可触达安装基础。东南亚数字经济 2025 年有望达到 $330 billion，亚洲智能手机普及率预计到 2030 年达到 94%，Central Europe、Latin America
              和 Southeast Asia 的 iOS 再营销花费在 2025 年同比增长 100%+。尽管整体预算收缩，India 的 iOS UA 花费仍同比增长 17%，反映高端设备层级上升。

              第三，生成式 AI 同时扩大供给和需求。Sensor Tower 测得 2024 年 AI 聊天机器人和艺术生成 app 的 IAP 收入接近 $1.3 billion，15 个移动 app 类别在描述中加入
              AI 功能，带来新的广告库存和用户获取场景。AI 也是效果平台的主要优化杠杆，可改进出价模型、创意生成和反欺诈检测。

              第四，再营销正成为预算优先项：其在 app 营销总花费中的占比从 2024 年 25% 升至 2025 年 29%（绝对花费增长 37%，至 $31.3 billion），背后是 UA
              成本上升和“Retention First”经济出现。Gartner 2025 年估计，未来 80% 的移动收入将来自 20% 的现有客户，进一步强化预算向存量队列倾斜。

              第五，Google 和 Meta 之外的渠道多元化正在获得可衡量牵引力。Moloco 2025 年研究发现，加入独立渠道的广告主在第 30 天的 ROAS 改善最高可达 214%；Singular 对 2024
              年 2,000+ 个 app、超过 $5 billion 广告花费的数据验证了这一点。
