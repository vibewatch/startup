      - number: '8.2'
        title: 公开可比公司与抽成率经济性框定真正争论
        blocks:
          - type: paragraph
            body: >-
              公开可比公司显示，不能只用一个头条倍数给 Liftoff 定价。截至 2026 年 6 月 1 日，AppLovin 市值约 $198 billion，对应约 $6.16 billion 过去收入，约 32x
              销售收入；The Trade Desk 市值约 $9.6-$10.7 billion，对应约 $2.9-$3.0 billion 收入，约 3.3x-3.6x 销售收入；Digital Turbine 市值约
              $1.13-$1.14 billion，对应约 $565 million 收入，约 2x 销售收入。Damodaran 更广泛的广告数据集更低，约 2.12x EV/sales。因此，Liftoff 2025
              年可观察标记 5.8x 远低于 AppLovin 溢价，但高于低层级公开可比公司和广义广告行业基准。这让核心问题变成定性问题，而不是机械倍数问题：Liftoff
              在结构上更接近高溢价、软件化广告技术，还是周期性移动广告中介？

              支持溢价的最好理由是经营质量和平台广度。AppLovin 2025 年经营利润率非常高，约 75.8%；The Trade Desk 约 20.4%；Digital Turbine FY2026 约
              6.0%。Liftoff 公开材料披露收入，但仍未披露媒体总支出、账单额、抽成率或标准化 EBITDA，因此市场无法观察它在这一谱系上究竟属于哪里。缺少抽成率披露，是关键估值缺口。如果 $741 million
              收入来自 15%-30% 抽成率，则隐含媒体总量约 $2.5-$4.9 billion；但这一区间由假设驱动，而非披露。估值逻辑因此不在于争论一个精确可比倍数，而在于证明 Liftoff
              的混合变现和用户获取引擎，能够支撑显著高于普通广告行业基准的利润率。
