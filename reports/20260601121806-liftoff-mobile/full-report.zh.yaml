  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、变现机制与收入确认框架
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的收入架构横跨两条主轴——通过 Accelerate 做需求侧变现，通过 Monetize 和 Vungle Exchange 做供给侧变现——外加 Creative Studio 和
              Intelligence 两条附属产品线。Accelerate 通过向移动广告主收取效果型用户获取投放费用赚取收入；定价与结果挂钩（CPI、CPA、ROAS 和预测客户终身价值目标），意味着 Liftoff
              的媒体利润来自广告主为每个结果支付的价格，与 Liftoff 为驱动这些结果的底层展示向发行商支付的价格之间的差额。考虑品牌传承和市场拓展重点，需求侧收入可能占公司总收入最大份额。

              Monetize 通过 Liftoff 广告网络、Vungle SDK、app 内竞价基础设施和聚合工具，帮助移动 app 发行商最大化 ARPDAU，从供给侧产生收入。Vungle SDK
              免费分发给发行商，收入按分成或基于收益的方式随每次广告展示产生。App 内竞价用实时统一拍卖替代传统瀑布流聚合，让发行商同时把库存开放给多个需求源并按价格竞争。Product Madness 案例研究显示，app
              内竞价带来 11% ARPDAU 提升；Cashwalk 使用 Vungle video ads 后每日广告收入最高增加 $3,000——二者都确认供给侧产品有效，但没有披露 Liftoff 获得的收入。

              Vungle Exchange 作为程序化 DSP 和 SSP 连接器运作，让第三方需求方平台访问发行商库存。交易所收入可能来自拍卖成交价的抽佣率。Creative Studio 提供动态创意优化和 DCO
              广告单元制作；收入结构未披露，但可能与投放花费打包，或作为托管服务费收取。Intelligence（整合 GameRefinery 和 AppRefinery）提供游戏市场情报订阅和 app
              分析；这条产品线最可能产生类似 SaaS 的订阅收入。五条产品线之间没有披露收入结构拆分。

              收入确认问题——ASC 606
              下按总额（principal）还是净额（agent）确认——对解读表观数字很重要。控制库存定价并承担发行商付款风险的广告技术中介通常按总额确认收入；只连接买卖双方的平台则按净额确认。Liftoff 的
              Accelerate 模型会围绕结果目标优化投放，并为展示向发行商付费，说明需求侧更接近主体方经济性。供给侧产品（Monetize、Exchange）在 Liftoff 将成交价格的一部分传递给发行商时，更像
              代理方。没有披露时，公开来源无法解决总额 / 净额问题。
