  - id: FU004
    title: 按细分客群划分的留存 / 满意度代理矩阵
    type: matrix
    layout: wide
    summary: 留存仍主要靠扩张、评价和集成信号推断，因为 Liftoff 只披露一个核心广告业务汇总 NDR 数据点，而非细分队列。
    data:
      columns:
        - 扩张代理强度
        - 第三方评价 / 生态信号
        - 披露质量
      rows:
        - label: 非游戏 App 营销方
          values:
            - label: 高
              tone: positive
              detail: Ibotta、Stash、Just Eat、Delivery Hero 和 Grab 都显示了从试点到放量或多市场扩张。
            - label: 中
              tone: neutral
              detail: AppsFlyer 排名和客户证言支撑渠道可信度，但没有独立续约数据集。
            - label: 低
              tone: warning
              detail: 存在 130% 核心广告 NDR，但没有细分 NRR、流失或合同期限披露。
        - label: 发布商 / 变现伙伴
          values:
            - label: 高
              tone: positive
              detail: Product Madness 和 ZiMAD 显示了深度部署、组合迁移和钱包份额提升。
            - label: 中
              tone: warning
              detail: Google 和 AdMob 文档确认生态支持，但 GitHub 问题记录显示部分开发者遇到适配器摩擦。
            - label: 低
              tone: warning
              detail: 没有公开的发布商流失、卸载或净美元留存数据。
        - label: 游戏开发者 / Intelligence 用户
          values:
            - label: 中
              tone: neutral
              detail: Ubisoft 证明了工作流嵌入，但公开具名的 Intelligence 客户证据只有一个。
            - label: 低
              tone: neutral
              detail: Intelligence 订阅几乎没有第三方评价数据。
            - label: 低
              tone: warning
              detail: 订阅用户数、续约率和合同数据都未公开。
    approximationNotes: 矩阵单元格总结的是代理强度，而非披露的留存百分比；Liftoff 公布了一个核心广告业务汇总 NDR 数据点，但没有任何细分客群的队列表、NRR 或 GRR。
