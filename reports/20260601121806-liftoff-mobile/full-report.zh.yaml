      - number: '8.4'
        title: 投资立场——均衡、价格敏感，且仍依赖尽调
        blocks:
          - type: paragraph
            body: >-
              本章结论刻意保持平衡。2025 年已经发生的 $4.3 billion 交易值得尊重：它是真交易，有 PE 控股方支持，不是假设价格。Liftoff 也显然不是小规模资产：IPO 材料显示，公司过去十二个月收入约
              $741 million，服务超过 1,000 名营销人员，接入超过 140,000 个 App，全球触达约 1.4 billion
              日活用户。这些事实支撑的是一家正经企业，不是虚荣估值。但最新市场证据指向另一边。重启的 IPO 定价低于此前私募估值，2026 年第一次 IPO
              尝试已经撤回，上市可比公司的估值分散又很大；如果没有扎实的抽成率和杠杆证据就支付溢价，那就是把乐观包装成尽调。

              因此，在 2025 年估值标尺下，我的态度是观察，不是买入。公开证据今天更像收敛在 $3 billion 高段；$4.3 billion 仍然可能成立，但前提是管理层能证明三件事：EBITDA 利润率有望走到
              mid-20s 或更高，资本结构干净，核心用户获取加变现收入不过度依赖短期套利或 PE 控股方的退出时点。证明这些点，上行情景还在；证明不了，反向逻辑占上风：Liftoff
              会是一家扎实公司，但价格跑在了公开证据能支撑的范围前面。
