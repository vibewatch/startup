  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：AppLovin 是基准，但各家从不同角度进攻
        blocks:
          - type: paragraph
            body: >-
              竞争场不是一个干净的同业集合。AppLovin 是核心基准，因为它已转向更纯粹的广告技术身份，仍同时营销广告主获客和发行商变现，并且如今拥有远强于其他独立移动技术栈的公开收入证明。Unity Ads 和
              ironSource 是最接近的游戏原生全栈对手，因为 Unity 能在一个生态里连接创作、变现和用户获取，Vector 重构也明确依托 Unity 开发者基础上收集的数据。Digital Turbine
              和残留的 AdColony 品牌重要性来自另一点：它们把聚合和交易所产品与 OEM、运营商分发资产绑在一起。Moloco 更像 AI 优先的需求与变现层，而不是完整的创意加交易所技术栈。Mintegral 和
              Pangle 通过大规模移动触达和中国相关需求池，带来另一种压力模式。The Trade Desk 更偏相邻而非直接竞争，但当买方想通过广泛开放互联网 DSP 获取移动库存、而不是找 app
              增长专家时，它仍可替代。
