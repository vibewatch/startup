      - number: '2.5'
        title: 采用约束——隐私、监管与集中度
        blocks:
          - type: paragraph
            body: >-
              移动 app 效果营销生态面临四个结构性约束，限制增长并给所有参与方增加合规成本。影响最大的是 Apple 的 App Tracking Transparency（ATT）框架，自 iOS 14.5
              起强制执行：app 必须在访问 IDFA 做跨 app 跟踪前请求用户明确同意。没有同意时，广告主必须依赖 SKAdNetwork（SKAN）；它提供的是聚合、保护隐私的回传，而不是用户级归因。SKAN
              4.0（随 iOS 16.1 发布）最多提供三个按时间窗口划分的回传和粗粒度转化值（低 / 中 / 高），但低花费投放因群体匿名门槛只能获得很少数据粒度。2024 年仍有超过三分之一 app 营销人员不熟悉
              SKAN 4.0，说明采用滞后持续存在。

              在 Android 上，Google 的 Privacy Sandbox 计划用保护隐私的归因 API 取代 Google Advertising ID（GAID），路径与 iOS 类似。截至 2026
              年中，落地时间表仍在变化，给依赖 GAID 测量的广告主和网络供应商带来不确定性。Apple 还在 WWDC 2024 推出 AdAttributionKit，作为未来与 SKAN
              共存的归因框架，又增加一层平台复杂度。

              欧洲监管约束显著。EU 的 Digital Services Act（DSA）自 2024 年 2 月 16 日生效，要求在线广告平台向 EU 和 UK
              用户展示的每条广告都提供实时来源信息——广告主名称、定向参数。合规需要发行商侧和网络侧都调整实现，增加成本，却没有相匹配的收入提升。

              市场集中度是独立平台增长的结构性约束。Google 和 Meta 占据 88% 移动 app 广告预算，约 $13 billion 的独立渠道池有限，还被
              AppLovin、Unity、Moloco、Mintegral、Digital Turbine、IronSource/Unity Ads、Chartboost 和 Liftoff 同时争夺。自 2020
              年以来，年下载量大致持平在 136 billion，限制自然安装量增长；更多预算争夺同一安装供给，也推高 CPM。
            claimRefs:
