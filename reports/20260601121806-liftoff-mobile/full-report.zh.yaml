  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 平台、隐私、法律和地缘政治风险如何传导到 Liftoff 收入、利润率和估值。
    data:
      nodes:
        - id: n1
          label: ATT / IDFA 限制
          description: Apple 许可门槛和反指纹规则
        - id: n2
          label: Google 测量波动
          description: Attribution Reporting / Protected Audience 转换及路线图不确定性
        - id: n3
          label: 广告技术执法
          description: FTC、DSA、DMA，以及更广泛的同意 / 透明度义务
        - id: n4
          label: 地缘政治打压
          description: ByteDance 或中国关联 App / 广告技术限制
        - id: n5
          label: 测量噪音
          description: 确定性归因变少，ROI 证明更难
        - id: n6
