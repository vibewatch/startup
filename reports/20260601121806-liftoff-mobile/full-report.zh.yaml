      - number: '1.2'
        title: 创始人、领导层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              三位联合创始人于 2012 年创立 Liftoff。Mark Ellis 自创立起担任 CEO，经历 2021 年 Vungle 合并，并领导合并后公司最初的运营期。Phil Crosby
              贡献了早期产品和数据可视化能力，目前担任联合创始人兼执行产品顾问。Harry Robertson 搭建了创立阶段的工程和机器学习架构，目前担任联合创始人兼执行技术顾问，负责效果技术路线图。虽然 CEO
              已更替，三人在公司内部持续担任顾问，让创始愿景在运营上保持连续性。

              Jeremy Bondy 于 2022 年 5 月出任 CEO；此前他在 2021 年 10 月合并交割后加入，担任总裁。合并前，Bondy 自 2020 年起担任 Vungle CEO，曾在 11
              个全球办公室之间搭建统一战略，维持超过 100,000 个活跃 app 的发行商基础和超过 4,500 家公司的广告主基础，并推动 AlgoLift、GameRefinery、TreSensa 和 JetFuel
              等并购。移动营销生态两端的运营履历，让他适合领导合并后平台。现任高管团队包括总裁兼 CFO Tarek Kutrieh（曾任 VCA Animal Hospitals CFO，并在 Activision
              Blizzard 和 McKinsey 任财务职位）、COO Andre Tutundjian、 法务总顾问 Susan Hansen（2018 年 8 月加入）、CRO Scott
              Silverman（AerServ 联合创始人，后出售给 InMobi）、工程高级副总裁 Bo Chen 和 产品高级副总裁 Andry Supian。

              关键人集中度不低：Bondy 同时是面向 Blackstone 和 General Atlantic 董事会的领导者，也是 Cortex AI
              战略的运营推动者。公司尚未公开完整董事会构成、治理文件或管理层合同条款；对于 Blackstone 支持、处于该资本化水平的非上市公司，这些都是标准尽调项目。
