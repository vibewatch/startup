        - Monetize 通过所有主要广告聚合平台上的 Vungle SDK（v7.6+）实现 app 内竞价
        - Cashwalk 使用 Vungle 视频广告，将每日广告收入最高增加 $3,000/day；向 iOS 扩展覆盖率 30%
        - 相比瀑布流的 eCPM 提升来自案例自报；没有关于填充率或 eCPM 改善的独立审计。
