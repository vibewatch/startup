    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile, Inc. 是面向移动 app 经济的全球效果营销和变现平台，总部位于 900 Middlefield Rd, Floor 5, Redwood City,
              California。Mark Ellis、Phil Crosby 和 Harry Robertson 于 2012 年创立公司；彼时独立选择有限，Liftoff 从一开始就把自己定位成 ROI
              导向、由机器学习驱动的移动 app 用户获取替代方案。公司的官方使命是把用户连接到他们喜爱的移动 app 和工具；实现路径是 AI 驱动的营销、变现和创意方案，产出更好的广告体验。公司官网域名已从
              liftoff.io 迁至 liftoff.ai，反映当前 AI 定位。

              商业模式以效果为中心：Liftoff 通过帮助移动 app 营销方规模化获取并留住高价值用户、帮助移动 app 发行商变现库存，并提供分析和创意优化工具来改善整体 app
              增长经济性，从中获得收入。公司服务四类客户——营销方、代理商、需求方平台和移动游戏开发者——并通过五条产品线交付：Accelerate（机器学习用户获取）、Monetize（发行商变现）、Vungle
              Exchange（程序化交易所）、Creative Studio（创意优化）和 Intelligence（市场分析与游戏情报）。五条产品线由自研 Cortex AI 平台统一承载。2021 年与 Vungle
              合并后，模式从单纯用户获取延伸为覆盖供给、需求、创意和分析的端到端闭环，也让合并后公司成为区别于大型封闭生态、强调隐私友好的独立替代选择。
