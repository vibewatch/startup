  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 传导至投资逻辑
      - 行动含义
    rows:
      - - 公开市场价格发现跌破重置区间
        - 最终 IPO 或二级交易清算价格显著低于约 $3.6B
        - 意味着即便重置区间也高估可持续公开市场价值
        - 从观察转为回避，直到新底部形成
      - - 抽成率经济性不及预期
        - 总投放额披露显示抽成率结构性偏低或贡献利润率偏弱
        - 削弱相对行业基准享有溢价的逻辑
        - 按更接近 TTD / Digital Turbine 或行业基准倍数重新测算
      - - 隐藏杠杆或 PE 股东抛压浮现
        - 债务负担、优先股堆叠或计划减持比预期更激进
        - 少数股权上行更依赖退出时点，而非经营表现
        - 要求价格让步，否则退出
      - - 收入质量经审视后转弱
        - 申报文件细节显示收入集中、广告主队列波动，或短期套利带来人工增长
        - 把高溢价增长故事改写成周期性广告中介
        - 切换到悲观情景框架
    notes: 这些是投资逻辑破裂触发因素，而非泛泛风险；每一项都会改变估值支撑，而不只是影响叙事情绪。
