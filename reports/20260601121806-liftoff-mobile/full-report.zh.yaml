            body: >-
              再营销在 app 营销花费中的占比一年内从 25% 升至 29%（绝对花费 +37%，至 $31.3B）。若平台能像 Liftoff 声称的 Accelerate 一样，在统一 Cortex AI 模型下同时服务
              UA 和再触达，比只做 UA 的单点方案网络更适合“Retention First”环境，因为同一受众图谱和出价模型可同时服务获客与留存目标。
