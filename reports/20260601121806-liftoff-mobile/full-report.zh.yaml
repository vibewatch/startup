  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支持证据
      - 会改变判断的因素
    rows:
      - - 具备规模的独立移动增长平台应较普通广告技术公司享有溢价
        - $741M 尾随收入、140k+ 已集成 app 和 2025 年 Q4 的 1.4B DAU 显示真实规模。
        - 若证据显示抽成率低、利润率弱或收入集中，溢价支撑会下降。
      - - PE 股东所有权可以加速 M&A 和运营纪律
        - 2025 年少数股权出售后 Blackstone 仍为多数股东，并支持 2026 年 IPO 路径。
        - 隐藏杠杆、激进减持条款或 PE 股东抛压会削弱少数股权经济性。
      - - 公开市场重置比 2025 年 PE 标记给出更可用的入场框架
        - 2026 年 IPO 区间约 $3.66B-$3.9B，低于此前 $4.3B 标记。
        - 如果成功在区间上方重新定价，且上市后交易支撑强，乐观情景会增强。
      - - 反向逻辑：估值仍靠假设，而不是已披露的抽成率经济性
        - 收入已经公开，但总投放额、抽成率和常态化 EBITDA 仍未公开披露。
        - 直接披露账单额、利润率桥接和债务，将显著提升可测算性。
    notes: 反向逻辑不是否认业务质量；它是基于单位经济和 PE 股东结构披露缺口提出的定价异议。
