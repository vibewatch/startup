  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 仅基于公开证据，按发生可能性和业务影响摆放 Liftoff 剩余风险。
    data:
      columns:
        - 关键影响
        - 高影响
        - 中等影响
      rows:
        - label: 高可能性
          values:
            - tone: negative
              label: ATT / IDFA 测量损失
            - tone: negative
              label: AppLovin 等同业带来的 AI 主导竞争压力
            - tone: neutral
              label: 财务赞助方流动性与 IPO 执行压力
        - label: 中等可能性
          values:
            - tone: negative
              label: Google 隐私 API 路线图波动
            - tone: negative
              label: FTC / EU 隐私执法扩张
            - tone: neutral
              label: 归因噪音推动客户预算轮动
        - label: 低可能性
          values:
            - tone: negative
              label: ByteDance / 中国政策冲击外溢到 App 增长
            - tone: negative
              label: 受控公司治理在 IPO 后削弱纪律
            - tone: neutral
              label: DSA / DMA 变化迫使进一步重做披露
    claimRefs:
