      - number: '6.2'
        title: 具名案例研究提供跨垂直的生产级结果证明
        blocks:
          - type: paragraph
            body: >-
              Liftoff 公开案例库覆盖 12 个已发布案例，横跨金融科技（Acorns、Ibotta、Stash）、外卖（Just Eat Takeaway.com、Delivery
              Hero）、网约车（Grab）、社交赌场游戏（Product
              Madness、ZiMAD）、社交媒体（TikTok）、游戏开发智能（Ubisoft）、医疗奖励（Cashwalk）以及健康网红营销（Calm）。这些结果用具体 KPI
              描述，且多个账户记录了初步成功后的明确预算扩张。

              营销人员侧信号最强的案例是 Ibotta（安装量提升 134%、激活量提升 297%、日均支出扩大 5.7x，并扩展再互动活动）和 Just Eat Takeaway.com（CPA 降低 28%，从荷兰 /
              德国试点扩展到另外六个市场）。这些案例值得注意，因为它们不只记录活动 KPI，还明确记录预算放大和账户扩张，是目前最强的持续关系健康代理指标。Delivery Hero
              增量测试尤其可信，因为它使用保留控制组方法——不是末次触点归因——证明 LATAM 安装转化率提升 20-26%，并明确记录 Delivery Hero 在确认后把 Android
              支出提高了两位数。Delivery Hero 还称 Liftoff 是「多年来的长期合作伙伴」，提供了多年关系信号。

              在发布商和变现侧，Product Madness（把整个应用组合转向 Vungle 应用内竞价后，全组合 ARPDAU 提升 11%，Heart of Vegas iOS 提升 45%）和
              ZiMAD（Windows ARPDAU 提升 133%，Vungle 声量份额从 11% 升至 61%）证明了生产级变现部署。Ubisoft 使用 GameRefinery
              识别高影响力社交功能，并推动玩家参与，显示 Intelligence 产品嵌入了企业游戏发布商的开发工作流。

              所有案例研究结果都由 Liftoff 在自己网站上自报；没有任何案例披露第三方审计或独立验证。多数发布商案例（Product Madness、ZiMAD、TikTok、Cashwalk）使用 Vungle
              品牌，并早于 2021 年 10 月 Liftoff-Vungle 合并，验证的是旧 Vungle 发布商采用，而不是统一 Cortex AI 平台上的结果。Liftoff 在 AppsFlyer
              Performance Index 17（H1 2024）中的排名——在 iOS SSOT Power 和 Volume 的非游戏、游戏及全类别中均进入全球前
              10——提供了独立第三方对性能质量的验证，不过排名是相对指标，不是绝对收入衡量。
