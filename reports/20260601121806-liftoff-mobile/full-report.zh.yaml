        - label: Just Eat Takeaway.com（外卖客户）
          values:
            - label: 高
              tone: positive
              detail: 覆盖荷兰、德国和另外 6 个市场的多市场生产部署。
            - label: 高
              tone: positive
              detail: CPA 降低 28%；合并 UA+RE 后 CPA 降低 8%，同时花费增加 12%。
            - label: 低
              tone: warning
              detail: 未披露合同条款、NRR 或续约数据。
            - label: 高
              tone: positive
              detail: 从 2 个市场扩至 8+ 个市场；采用 UA 与重定向组合包。
        - label: Delivery Hero
          values:
