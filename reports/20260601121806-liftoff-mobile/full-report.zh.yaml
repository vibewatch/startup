  - id: TI003
    title: 单位经济模型代理指标——可观察、估计和无法获得的指标
    columns:
      - 指标
      - 数值或代理指标
      - 置信度
      - 依据
      - 尽调要求
    rows:
      - - 广告主总支出（GAS）
        - 未披露
        - 无法获得
        - 需求侧平台的 GAS 通常远大于净收入；无公开来源
        - 提供过去 12 个月广告主总支出和净收入，用于计算实际抽成率
      - - 净收入（GAS 抽成）
        - 未披露；$4.3B 估值和同业倍数暗示 $400M–$700M 区间
        - 低（估计）
        - 根据 $4.3B 估值及 AppLovin/DT 同业 6–11x 收入倍数区间推断；未获确认
        - 提供过去 2 个财年的经审计净收入，为估值倍数锚定基准
      - - 毛利率
        - 未披露；程序化需求侧平台可比对象约为 40–65%
        - 低（估计）
        - AppLovin 毛利率约 70%+；DT 较低，约 30–40%；Liftoff TAC 结构未知
        - 提供产品层面毛利率，以及发布商收入分成费用占收入比例
      - - 调整后 EBITDA 利润率
        - 未披露；同业组暗示 20–55% 区间
        - 低（估计）
        - AppLovin 约 82%，DT 约 14.7%；考虑双边平台结构，Liftoff 可能处于中间区间
        - 提供过去 12 个月调整后 EBITDA，以及从毛利率到营业利润的 EBITDA 桥表
      - - 净收入留存率（NRR）
        - 未披露
        - 无法获得
        - 无来源；NRR 是衡量广告主和发布商客户队列质量的关键指标
        - 按客户分群（营销主 vs. 发布商）提供 NRR 和总收入留存率
      - - CAC / 回本周期
        - 未披露；程序化平台通常依赖关系驱动型销售
        - 无法获得
        - 没有定价或销售效率指标；托管服务导向暗示 CAC 较高
        - 按分群提供平均合同价值、销售周期、CAC 和回本周期
      - - 人均收入
        - 以 750 人中点计算，人均 $400k–$900k；区间反映收入不确定性
        - 低（估计）
        - Inc.com 显示员工数 501–1,000；收入区间由估值推断；高度不确定
        - 确认准确员工数和收入，验证相对同业的生产率
      - - 资本强度（capex/revenue）
        - 未披露；软件属性较重的广告技术平台资本开支 / 收入通常低于 5%
        - 低（估计）
        - 未披露资本开支或数据中心投资数字；ML 推理成本大多计入 OpEx
        - 提供资本开支、资本化软件和数据中心租赁义务占收入比例
    notes: 所有估计值都是根据上市可比公司和估值锚推断得出的示意性代理指标，不应解读为 Liftoff 的事实财务数据。全部都需要通过数据室访问来验证。
