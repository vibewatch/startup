      - number: '7.2'
        title: 隐私、监管与地缘政治规则可能重估整个广告技术市场
        blocks:
          - type: paragraph
            body: >-
              二阶风险在于，外部规则手册变化快于移动广告技术稳定适配的速度。Google Attribution Reporting 和 Protected Audience 材料显示，公司仍在建设隐私保护型移动广告
              API，以减少对跨方标识符的依赖，限制事件级细节，并把更多信息留在设备端。不过 Liftoff 自己的 S-1/A 已把路线图描述得足够不稳定，专门提示 Google
              政策变化，以及供应商限制数据访问或平台访问、进而损害 Liftoff 经济性的可能性。CMA 记录也强化了这一点：Privacy Sandbox 经历多年竞争监管和不断变化的承诺，CMA 才在 2025
              年底解除相关承诺。与此同时，欧洲已经把定向广告变成法律设计问题，而不只是优化问题。DSA 禁止向儿童投放定向广告，并要求广告透明；DMA 对应用商店等守门人设置事前义务。在美国，Kochava
              执法行动表明，监管机构愿意把移动广告数据实践视为同意问题处理，其影响覆盖数亿台设备。最后，ByteDance/TikTok 法案路径显示，地缘政治风险可以直接重塑市场结构。打击 ByteDance/TikTok
              或与 Mintegral/Mobvista 有关、暴露于中国的广告渠道，可能通过移除竞争供给和预算去向来帮助 Liftoff；但也可能扰乱跨境支出模式，创造新的合规预期，并把整个移动增长生态拖入国家安全政治。
