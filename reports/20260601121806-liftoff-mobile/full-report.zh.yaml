      - number: '4.3'
        title: 成本结构、毛利率驱动因素与上市公司基准
        blocks:
          - type: paragraph
            body: >-
              没有财务披露，只能类比上市可比平台估计 Liftoff 成本结构。在移动程序化广告中，三大主导成本类别是流量获取成本（TAC）——向发行商支付的收入分成，通常是需求方平台最大单项运营成本——计算和 ML
              基础设施成本，以及员工成本（工程、数据科学、销售和客户管理）。TAC 是关键毛利率杠杆：拥有自有供给或独家关系的平台，每 1 美元广告主花费可留住更多利润；开放市场买方则面临更激烈竞争和上升的 TAC。

              上市公司基准显示可实现经济性区间很宽。AppLovin 报告 2025 全年收入 $5.481 billion，调整后 EBITDA 约 $4.512 billion，意味着调整后 EBITDA 利润率约
              82%——这是规模化移动广告技术的高水位线。AppLovin 持续经营净利润同比增长 116%，展示了拥有强自有供给集成、ML 优化且已规模化的平台的经营杠杆。Digital Turbine
              是较小的独立平台，报告 2025 财年收入 $490.5 million，非 GAAP 调整后 EBITDA 为 $72.3 million（约 14.7% 利润率），GAAP 净亏损为 $92.1
              million——说明中等规模独立广告技术平台面临显著成本吸收挑战。两组数据框住 Liftoff 可能的经济性：以 $4.3 billion 估值和投资人沟通中声称的“快速增长”看，Liftoff
              更接近质量谱系的 AppLovin 一端；但没有披露，实际利润率未知。

              Inc.com 2024 简介估计 Liftoff 员工数为 501–1,000，意味着人员成本可观。按行业标准每名员工总薪酬 $150,000–$250,000（工程、销售和运营混合）计算，750
              人中位数意味着仅年度人员成本就约 $112–$188 million——需要相当收入覆盖的成本基础。处理数十亿次每日广告决策的平台，还会产生基础设施和 ML 推理成本。公司未披露
              资本开支、折旧或数据中心投资数据。
            claimRefs:
              - CI017
