      - number: '5.2'
        title: Cortex AI 平台架构与数据飞轮
        blocks:
          - type: paragraph
            body: >-
              Cortex AI 平台是 Liftoff 底层 ML 基础设施，也是五条品牌产品线共享的计算层。官方产品页面将 Cortex 描述为实时自动处理出价定价、转化建模、数据质量和创意选择，并直接嵌入
              Accelerate（需求）与 Vungle Exchange（供给）之间的竞价路径。数据飞轮的运行方式是：Vungle SDK 接入的发布商应用产生自有 SDK 信号，再回流到 Cortex
              训练数据中；相较只依赖第三方交易所数据的广告网络，Liftoff 因此获得信息优势。

              在机器学习侧，Liftoff 发表过多篇技术博客，记录具体模型创新。2021 年一次实验把 GameRefinery 的微品类分类法输入 Accelerate ML
              模型——把应用库存归入行为簇——结果模型在新应用安装活动中把 CPI 降低了 10%。这是 Cortex 数据飞轮公开运行证据中最具体、量化程度最高的一项。通过 AlgoLift（随 Vungle
              一起收购）形成的概率归因框架，使用匿名用户级应用内数据、SKAdNetwork 回传数据，以及来自选择加入用户的确定性 MMP 归因数据，在不依赖 IDFA 指纹识别的情况下估计活动 pROAS。Liftoff
              还支持 SKAN 4.0 的四位 source ID 结构、粗粒度转化值和三个回传窗口，以深化 iOS 归因。

              在反欺诈侧，Liftoff 每周处理超过 750 million 个出价请求，并通过六项不同技术排除其中 10% 以上的疑似欺诈请求：3-billion-device 无欺诈数据库、Bid Blocker（检测
              10 类可疑出价请求）、安装后优化、dead-zone 版位、与 AppsFlyer 的点击签名，以及用于筛除机器人流量的 CPA
              优化。这种分层方法体现出有意义的工程投入，但公开材料没有单独披露误报率、内部系统架构或正常运行时间 SLA。
