      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: 价格敏感的判断
            body: 业务真实且有规模；问题不是它是否存在，而是入场纪律。公开证据支持继续观察 Liftoff，只有估值留在 2026 年重置价附近，或尽调证明它能拿到溢价利润率，才值得推进。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV012
              - CV047
              - CV048
          - type: callout
            title: PE 控股方压力也是估值的一部分
            body: PE 控股方控制的公司，即使经营守得住，也可能以更低的名义估值成交，因为卖方的退出时点、杠杆和分配目标会塑造交易。2026 年 IPO 重置已经能看见这一点。
            calloutType: risk
            claimRefs:
              - CV041
              - CV042
              - CV043
          - type: callout
            title: 抽成率是最大的隐性变量
            body: Liftoff 公开收入数字现在已经可见，但广告主花费如何流到净收入仍不透明。因此，本章使用明确情景区间，而不是假装知道精确公允价值。
            calloutType: assumption
            claimRefs:
              - CV035
