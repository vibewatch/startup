      - number: '6.3'
        title: 留存与耐久性——一个公开 NDR 数据点、评价分化，以及 ATT 时代归因摩擦
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的 2026 年 IPO 摘要披露了一个真实的耐久性指标：Quartr 报告称，截至 2026 年 3 月 31 日，LTM Core Advertising 净美元留存率为 130%，同时有
              384 名客户贡献超过 $100K 的过去核心广告收入。这是最清晰的公开信号，显示 Liftoff 能在较大广告客户队列中扩张支出。即便如此，披露仍不完整。公司没有公开披露
              GRR、流失率、队列留存、合同期限，或营销人员、发布商、Intelligence 用户分层留存。剩下最强的代理信号仍是间接的：具名客户明确增加预算（Ibotta 5.7x、Stash 96.3%、Just Eat
              扩展到 8+ 个市场、Delivery Hero 在 LATAM 支出两位数增长）、案例研究中的多年关系表述（Delivery Hero 称「多年来的长期合作伙伴」），以及 Simon Hales、Victor
              Hernandez 和 Sami Khan 的具名证言。这些信号令人鼓舞，但相对于一个拥有超过 1,000 名营销人员和大量长尾发布商应用的平台，仍不具代表性。


              外部评价和生态信号并非一边倒正面，而是喜忧参半。TrustRadius 给 Vungle 的评分为 8/10，来自三条评论；买家称赞 CPI 采购、强劲美国库存和快速 SSP
              集成，但也提到产品演进慢、产品问题响应慢、APAC 规模有限，以及需要以高 CPM 出价且返利灵活性有限。FeaturedCustomers 汇总了 Liftoff 的 59 条证言、68 个案例研究和
              2,135 个参考评分下的 4.8/5.0 分，这像是广泛正面参考信号，但不是严谨的 NPS 替代品，因为它是证言聚合器，不是经审计的满意度调查。在发布商集成侧，Google 维护 Liftoff
              Monetize 的官方 AdMob 聚合指南，Liftoff 帮助中心记录 AdMob 应用内竞价设置，PPC Land 报道 Google 在 2025 年把 Liftoff
              竞价支持扩展到开屏广告，显示主流聚合支持仍在。不过，Google 聚合适配器仓库里的 GitHub issues 显示真实集成摩擦：一条 2025 年 1 月报告称 Vungle/Liftoff 适配器初始化约需
              30 秒；一条 2026 年 5 月 issue 指出 Liftoff Monetize 初始化期间出现临时保留 activity
              的行为。这些是集成投诉，不是广泛客户流失的证据，但对评估可靠性的发布商客户仍是负面信号。


              Liftoff 客户环境中的一个结构性负面因素是 Apple App Tracking Transparency（ATT）框架，该框架随 iOS 14.5 于 2021 年 4 月生效。ATT 要求任何应用或
              SDK 在访问 IDFA 或把用户活动跨不同公司拥有的应用相连之前，必须取得用户明确许可。这直接约束了支撑 Liftoff 程序化 UA 和重定向能力的跨应用追踪。Apple 开发者文档明确禁止把指纹识别作为
              IDFA 替代方案。Delivery Hero 案例研究公开承认「近几年数据归因变得更受限制」，并使用 Liftoff 的增量测试方法补充 MMP 归因——这反映出 ATT
              在具名生产伙伴中造成了真实测量摩擦。AppsFlyer 2025 年五大数据趋势报告进一步记录，2025 年再营销支出达到 $31.3 billion，同比增长 37%，说明尽管 ATT
              带来约束，可利用已授权或第一方数据的再互动广告需求仍然强劲。


              2025 年 AppsFlyer Performance Index 显示，广告支出正在向最顶层媒体网络集中：排名 11-20 的来源中，只有 30% 实现同比支出增长，而前 10 名玩家中有 60-80%
              实现增长。Liftoff 截至 H1 2024（Performance Index 17）仍保持 AppsFlyer 前 10 排名，但没有出现在 2025
              年指数新闻稿点名的前五名单中。这一位置——强但不占主导——留下一个未解问题：当支出向 Apple Ads、Google、Meta、AppLovin 和 TikTok 集中时，是否会随着时间推移对 Liftoff
              的广告主基础造成续约压力。
