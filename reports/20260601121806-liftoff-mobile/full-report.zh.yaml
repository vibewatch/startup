        - 最新公开市场读数，且有经营披露支撑
        - 营销区间，不是最终定价并交易后的结果
      - - Liftoff（2026 年重启 IPO 高端）
        - Reuters 报道目标估值
        - 约 $3.66B；约 4.9x 销售额
        - 相对 2025 年少数股权标记，给出干净的外部重置
        - 取决于交易完成且市场窗口保持打开
      - - AppLovin
        - 2026 年 6 月公开市场交易倍数
        - 约 $198.3B 市值，对应约 $6.16B TTM 收入；约 32x 销售额
        - 显示盈利能力极强的移动广告软件可拿到溢价结果
        - 极端离群值；近期 $40B 回撤凸显波动性和监管敏感度
      - - The Trade Desk
        - 2026 年 6 月公开市场交易倍数
        - 约 $9.6B-$10.7B 市值，对应约 $2.9B-$3.0B 收入；约 3.3x-3.6x 销售额
        - 有用的规模化独立广告技术可比公司，披露更充分，软件属性更耐久
        - 业务组合更偏 DSP / CTV，而非移动 app 变现
      - - Digital Turbine / Damodaran 广告基准
        - 2026 年 6 月公开市场倍数 / 广义行业基准
        - Digital Turbine 约 2.0x 销售额；广告行业 2.12x EV/销售额
        - 为周期性或低利润率移动广告技术提供下行锚点
        - 如果 Liftoff 的变现质量和利润率画像显著更好，这一基准可能过于苛刻
    notes: 列举覆盖并不完整，但足以支撑决策：各行包括已观察公司估值、最新 IPO 重置，以及情景框架使用的三个公开可比锚点。
