      - number: '1.4'
        title: 规模证据、里程碑和外部验证
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的公开规模证据主要来自合并时期披露和持续第三方奖项认可。2021 年 8 月合并公告发布时，Liftoff 通过机器学习和创意优化，每天在 140 多个国家、550,000 多个移动 app
              中投放超过 2 billion 条广告。同期，Vungle 在移动 app 发行商侧拥有超过 100,000 个直接 SDK 集成，在其影响者营销 平台上拥有 15,000 名独立内容创作者，并服务超过
              4,500 家公司的广告主基础。这些数字是合并时期公司口径，当前公开材料未更新；合并后平台如今触达范围可能更大，但现有来源无法独立验证。

              外部认可支撑规模判断。Inc. 截至 2024 年已连续八年将 Liftoff 纳入 Inc. 5000 最快增长非上市公司榜单，2024 年排名 No. 2,687，2017 年最高曾至 No. 8。2024
              年 Inc. 简介将公司规模列为 501–1,000 人，并列出 Jeremy Bondy 为现任领导者。AppsFlyer Performance Index 17 覆盖 2024 年 H1，基于 35,000
              个 app 的 13.5 billion 次非自然安装，授予 Liftoff 数十项全球前 10 认可，横跨 iOS 和 Android 的游戏与非游戏类别，确认其规模化竞争有效性。AppsFlyer
              Performance Index 2025（2025 年 12 月，16.2 billion 次安装、39,000 个 app）记录了头部移动广告平台竞争格局收窄，为 Liftoff
              定位提供更广行业背景。公司目前在 Redwood City、London、Singapore、Beijing、Berlin、San Francisco、Los Angeles、Orange County、New
              York、Paris、Helsinki 和 Seoul 设有 12 个办公室。
