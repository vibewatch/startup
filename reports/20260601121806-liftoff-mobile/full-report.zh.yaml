  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 营销人员在 Liftoff 平台上的旅程始于 Accelerate 里的投放设置，经由 Vungle Exchange 上 Cortex 驱动的竞价，借助 Vungle SDK 触达发布商应用中的用户，再通过衡量和创意迭代回流。
    data:
      nodes:
        - id: n1
          label: 投放设置
          detail: 营销人员在 Accelerate 设定 KPI 目标（ROAS、CPI、CPA、pLTV），上传创意资产，或委托 Creative Studio。
          tone: neutral
        - id: n2
          label: Cortex 出价优化
          detail: Cortex AI 选择广告位，预测转化概率，设定出价，并为每个广告位选择最佳创意。
          tone: positive
        - id: n3
          label: Vungle Exchange 竞价
          detail: Accelerate 出价在 Vungle Exchange 的程序化竞价中竞争；直接路径避开层层转卖流量。
          tone: positive
        - id: n4
          label: 通过 Vungle SDK 投放广告
          detail: 中标出价把广告投放给运行 Vungle SDK 的发布商应用内用户；广告格式包括激励视频、插屏和试玩广告。
          tone: positive
        - id: n5
          label: 安装后归因与衡量
          detail: MMP 回传或 SKAN 回传返回安装和事件数据；Liftoff 的概率归因模型在隐私约束下估计投放 pROAS。
          tone: neutral
        - id: n6
          label: 创意与出价迭代
          detail: 表现数据回流 Cortex，用于调整出价；Creative Studio 迭代表现最好的素材，对抗广告疲劳。
          tone: positive
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n2
    approximationNotes: 流程由官方产品页和技术博客文章推断；精确内部竞价延迟和路由逻辑未披露。
