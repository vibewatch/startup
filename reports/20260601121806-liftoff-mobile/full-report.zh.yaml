      - number: '4.4'
        title: 公开牵引力替代指标与系统性披露缺口
        blocks:
          - type: paragraph
            body: >-
              截至 runDate，Liftoff 尚未披露标准承销所需的核心财务牵引指标：收入、ARR、GMV、活跃广告主数、发布商 SDK 安装基数、展示量、NRR、毛利率或 EBITDA
              均无公开数字。公开来源里可用的量化牵引信号，只有 General Atlantic 的估值锚点（$4.3B）、Inc. 5000 排名轨迹，以及第三方市场背景。

              投资人表述提供了有条件的牵引信号。Blackstone 称，公司自 2021 年合并后在 CEO Jeremy Bondy 领导下「增长很快」。General Atlantic
              提到一个「令人兴奋的业务拐点」，并肯定公司的「卓越执行」。CEO Bondy 则称，公司仍处于「一个庞大且快速演进品类里的增长早局」——这种表述不像成熟、减速的业务，但无法量化。Liftoff 连续第八年入选
              Inc. 5000（2024 年第 2,687 名，2017 年第 8 名），通过独立、收入核验的排名方法验证了多年收入增长；不过合并后排名明显下滑，说明相较合并前纯业务线轨迹，整合可能短暂压缩了增长率。

              第三方市场数据提供结构性顺风。Sensortower《State of Digital Advertising 2025》显示，2025 年美国数字广告支出达到 $137 billion，同比增长
              12%。2025 年全球移动再营销支出达到 $31.3 billion，同比增长 37%，其中 iOS 再营销增长 71%——后者是关键迹象，表明 ATT 落地后，移动再互动预算仍在扩张。AppsFlyer
              2025 年数据显示，再营销在应用营销总支出中的占比从 25%（2024 年）升至 29%（2025 年），这与 Liftoff Accelerate 和 Monetize
              产品受益于再互动预算增加相一致。这些宏观信号指向有利的收入环境，但不能佐证 Liftoff 自身指标。
