  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争、ATT 与测量退化是一阶风险
        blocks:
          - type: paragraph
            body: >-
              Liftoff 最直接的风险组合，是市场结构压力叠加平台规则压缩。公司自己的 S-1/A 称，它不仅与 Google、Meta、Amazon 竞争，也与 AppLovin、Unity、Moloco
              等独立移动广告技术平台竞争。这一点重要，因为广告主侧市场越来越奖励有规模、AI 驱动的系统：它们能提供闭环测量、更紧的优化，以及横跨需求和供给的直接变现反馈。AppLovin 申报文件展示的正是这种栈：AI
              驱动的需求侧引擎，配合应用内竞价和测量基础设施。Unity 申报文件同样描述了广告主和发布商转向竞争解决方案或供给路径所带来的压力。在这个背景下，Apple 的 ATT 规则仍是经济核心。Apple
              对追踪的定义很宽，要求在访问广告标识符前取得明确许可，并拒绝 hashed-email 或 hashed-phone 规避方案。对 Liftoff 而言，其披露收集设备标识符、IP
              地址、应用使用信号和广告互动数据，结果是定向精度、归因确定性和发布商变现同时变得更脆弱。风险不只是 IDFA
              比过去更弱；而是当整个渠道更难干净测量时，拥有更多数据、更高拍卖密度或更好测量产品化能力的规模化对手可以夺走份额。
