      - number: '7.4'
        title: 缓释因素存在，但投资判断仍需要明确止损标准
        blocks:
          - type: paragraph
            body: >-
              公开缓释记录真实存在，但不完整。Liftoff 的 DSA FAQ 显示，公司能够为欧盟和英国变现库存落地新的披露要求；其隐私政策和 S-1/A 表述也显示，公司配备专职合规人员、DPO、数据处理协议和类似
              DPIA 的审查流程。它自己的增量材料还说明，管理层理解隐私时代的营销不能只靠末次触点归因。这些都是有意义的正面因素，因为一家忽视后 IDFA
              世界的公司，很可能已经失去相关性。问题在于，缓释因素大多是流程和准备信号，而不是硬证据，不能证明 Liftoff
              能在赞助方追求流动性时维持测量质量、留住广告主、守住发布商收益，并吸收地缘政治冲击。公司公开定义了核心广告、头部广告主和头部发布商的留存指标，但本次采样的公开证据仍未披露具体数值。因此，投资人需要把投资逻辑失效触发器绑定到可监测事件：任何新的
              Apple 或 Google 政策变化若移除信号或访问权限，私募市场估值与公开发行清算价格之间出现实质价差，法律行动扩大广告技术同意要求，或证据显示主要预算正以 Liftoff 无法抵消的速度转向
              AppLovin、TikTok、Mintegral 或其他规模化渠道。在管理层用私下尽调补齐这些缺口之前，即使平台仍具战略相关性，剩余风险也依然高。
