  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 公开规模 / 覆盖
      - 最强公开优势
      - 所有权 / 冲突边界
      - 短板
    rows:
      - - Liftoff
        - 直接移动增长同业
        - 供给覆盖 150,000+ 个应用；Top 100 应用中 93% 使用 Monetize；Vungle Exchange 覆盖 150+ 个国家、1B+ 用户
        - 中立中介，横跨 UA、变现、交易所和创意
        - 独立平台，不控制引擎、设备或自有媒体
        - 自助规模和第三方验证不如 AppLovin 或 Unity 充分
      - - AppLovin
        - 直接基准
        - 2024 年收入 $4.7B；声称在移动游戏拥有 1B+ 日触达
        - AXON AI 加 MAX，并转向纯广告平台
        - 优化栈受益于大规模内部数据和需求集中
        - 监管与做空机构审视让耐久性打问号
      - - Unity Ads / ironSource（游戏广告网络）
        - 直接游戏原生对手
        - Top 100 游戏中 85% 使用 Unity growth solutions；Aura 集成到 2.3B+ 台设备
        - 引擎到增长的工作流，加上 LevelPlay 聚合和 Vector AI
        - Unity 可以在同一生态内把创作、变现和 UA 接起来
        - 仍在修复早前模型 / 数据问题后的信任，且不如 Liftoff 中立
      - - Digital Turbine / AdColony
        - 分发驱动型对手
        - UA、交易所、聚合、offer wall，以及 OEM / 运营商分发资产
        - 另类应用分发，加上 DT Exchange 和 FairBid
        - 拥有分发表面和遗留 AdColony 资产
        - 看起来不如 Liftoff 中立，也不如 Liftoff 以创意策略为核心
      - - Moloco
        - AI 需求 / 变现对手
        - 全球广告主基础，加上覆盖 100+ 个国家的 Xiaomi / GetApps 合作
        - 机器学习需求和 SDK bidding，不依赖复杂瀑布流
        - 公开叙事更偏 ML 需求，而不是全栈应用增长
        - 创意工作室和交易所透明度不如 Liftoff 可见
      - - Mintegral
        - 中国关联 UA 与变现对手
        - 通过直接 SDK 关系连接 10,000 家发行商和 100,000 个应用
        - AI Smart Bidding 加内部 Mindworks 创意工作室
        - 中国市场经验和开放互联网触达，对部分买方是真优势
        - 西方买方面临更高政策和地缘敏感度
      - - Pangle / ByteDance
        - 中国关联需求与变现对手
        - ByteDance 规模覆盖 120 座城市，支撑直接 TikTok For Business 需求
        - 直接广告主需求和 RTB 支撑的变现，加上 UA 工具
        - 受益于 TikTok 关联广告主池和 ByteDance 母公司规模
        - 所有权和政策结构与 Liftoff 的中立性正相反
      - - The Trade Desk
        - 相邻替代方案
        - 开放互联网 DSP，围绕 Kokai 拥有 30+ 个移动专属伙伴和 400+ 个伙伴集成
        - 全渠道自助 DSP，透明且不持有自有媒体
        - 庞大的伙伴市场和广泛的计量能力
        - 不如 Liftoff 专注于应用安装和交易所原生移动增长工作流
    notes: 规模只使用保留下来的公开标记。该领域同时包含直接同业和相邻替代者，因为买方可以把移动支出投向 专门的应用增长平台、设备驱动的分发商，或广义 DSP。
