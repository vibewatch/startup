  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 总投放额与抽成率
        - 总账单额、净收入桥接，以及 UA 与变现之间的收入拆分
        - 支撑销售额倍数和 EBITDA 的核心缺失变量
        - 管理层访谈，加 S-1 财务脚注和 KPI 附表
      - - 资本结构
        - 净债务、优先条款、老股分配和 PE 股东减持计划
        - 少数股权回报不只取决于企业价值
        - CFO 尽调与股权结构 / 法律审查
      - - 利润率质量
        - 调整后 EBITDA 桥接、股权激励、资本开支和现金转化
        - 决定 $4.3B 对应经济收益的 16x、23x 还是接近 40x
        - 财务尽调包和 IPO 后申报文件审查
      - - 客户耐久性
        - 集中度、队列留存、前 10 大广告主组合和发布商流失
        - 只有收入质量够耐久，溢价倍数才守得住
        - 收入分析包和客户队列审查
    notes: 每项需求都直接对应一个估值变量；截至运行日期，公开材料只能部分观察这些变量。
