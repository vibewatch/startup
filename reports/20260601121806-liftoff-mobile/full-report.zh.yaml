    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      Liftoff 的公开记录从 2012 年在 Redwood City 创立开始，延伸到两次 Blackstone 支持的融资事件、2021 年 Vungle 合并、2022 年领导层交接，以及 2025 年 General
