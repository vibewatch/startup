      - number: '5.4'
        title: 差异化、技术风险与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的核心技术差异化建立在三项相互叠加的优势上。第一，Vungle SDK 足迹构成第一方数据护城河：SDK
              直连发布商集成产生上下文信号（应用类型、用户行为、设备、版位），这些信号先于开放交易所竞争者进入 Cortex 模型。第二，GameRefinery 和 AppRefinery
              智能层提供差异化受众与创意信号；多数竞争网络若没有类似收购，难以复制。第三，隐私框架能力——覆盖 SKAN 4.0、ATT 和概率归因——让 Liftoff 领先于尚未投资后 IDFA 测量的广告网络。

              与这些优势相对，几项技术风险具有实质性。归因于 GameRefinery 微品类数据的 10% CPI 降幅，是公司发布的单次内部实验结果，尚未经过独立审计。10% 欺诈排除率和 3-billion-device
              无欺诈数据库也都是自报数据。公开资料未披露安全认证（SOC 2、ISO 27001 或同等级认证）。架构深度——包括内部数据管线设计、模型版本管理、推理基础设施或灾备 /
              故障切换——没有在公开材料中描述。路线图具体性有限：Liftoff 承认 Google Privacy Sandbox on Android 是需要准备的测量变化，但没有公开时间表或适配技术规范。

              上述缺口对私有广告技术公司并不罕见，但它们关系到平台可靠性、安全姿态和竞争耐久性的尽调。
