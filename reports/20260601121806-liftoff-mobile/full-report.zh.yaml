  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论先从一个已观察到的私募市场估值标记出发，经过较低的 2026 年 IPO 重估，再穿过可比公司分化和抽成率数据缺失，最终落在观察而非买入。
    data:
      nodes:
        - id: observed-mark
          label: 2025 年观察到的估值标记
          detail: $4.3B 少数股交易，Blackstone 保留多数控制权。
          tone: positive
        - id: public-reset
          label: 2026 年 IPO 重估
          detail: 基于披露的 $741M 过去 12 个月收入，高端 ~$3.66B / 中点 ~$3.9B。
          tone: warning
        - id: comp-spread
          label: 可比公司分化
          detail: AppLovin 以溢价倍数交易，TTD 和 Digital Turbine 则低得多。
          tone: neutral
        - id: diligence-gap
          label: 抽成率 + 杠杆细节缺失
          detail: 收入已披露，但账单额、总投放额和资本结构细节未披露。
          tone: risk
        - id: stance
          label: 观察，不买入
          detail: 只有尽调证明 EBITDA 利润率可持续在 20% 中段以上、且财务赞助方经济安排干净时，才应积极。
          tone: warning
      edges:
        - from: observed-mark
          to: public-reset
        - from: public-reset
          to: comp-spread
        - from: comp-spread
          to: diligence-gap
        - from: diligence-gap
          to: stance
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV032
      - CV040
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在披露的 $741M 收入基数上，采用的收入倍数小幅变化就会让股权价值每 1x 波动超过 $700M；因此，抽成率和利润率证据主导承销争论。
    data:
      items:
        - label: 3.0x 收入
          value: 2223
          displayValue: $2.22B
          detail: 偏熊市的公开市场结果。
          tone: risk
        - label: 4.0x 收入
          value: 2964
          displayValue: $2.96B
          detail: 谨慎承销的低端。
          tone: warning
        - label: 5.0x 收入
          value: 3705
          displayValue: $3.71B
          detail: 大致落在 2026 年 IPO 重估区间。
          tone: neutral
        - label: 5.8x 收入
          value: 4300
          displayValue: $4.30B
          detail: 观察到的 2025 年少数股交易锚点。
          tone: positive
        - label: 7.0x 收入
          value: 5187
          displayValue: $5.19B
          detail: 需要强溢价叙事，加上可持续利润率证据。
          tone: positive
    approximationNotes: 柱状图用披露的 $741M 过去 12 个月收入基数和采用的收入倍数，估算股权价值（百万美元）；数值已四舍五入。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV032
      - CV035
      - CV045
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据把公允价值集中在 30 亿美元高段；若要上破 $5B，需要收入增长和溢价倍数持续性同时成立；若 Liftoff 按低档广告技术公司定价，下行可到 20 亿美元低段。
    data:
      items:
        - label: 悲观
          low: 2200
          mid: 2600
          high: 3000
          displayValue: $2.2B-$3.0B
          detail: 增长更慢、利润率信心更弱时，收入倍数为 3x-4x。
          tone: risk
        - label: 基准
          low: 3400
          mid: 3900
          high: 4400
          displayValue: $3.4B-$4.4B
          detail: 最贴合当前公开证据和 20% 中段 EBITDA 路径。
          tone: neutral
        - label: 乐观
          low: 4300
          mid: 5100
          high: 5950
          displayValue: $4.3B-$6.0B
          detail: 需要可比公司给予溢价待遇，并证明经营杠杆。
          tone: positive
    approximationNotes: 区间带根据情景表估算，并四舍五入到最近的 $50M-$100M。
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Liftoff 在市场验证和规模上得分较高，但估值支撑、财务赞助方一致性和证据完整性只属中等，因为关键私营公司经济指标仍未披露。
    data:
      items:
        - label: 收入规模
          value: 7/10
          detail: $741M 过去 12 个月收入和广泛 App / 营销方覆盖面相当可观。
          tone: positive
        - label: 市场验证
          value: 7/10
          detail: 真实的 2025 年少数股交易，加上 2026 年 IPO 进程重启，确认了机构相关性。
          tone: positive
        - label: 利润率可见度
          value: 4/10
          detail: 没有公开的正常化 EBITDA 桥接或披露的抽成率。
          tone: warning
        - label: 估值支撑
          value: 5/10
          detail: 30 亿美元高段比 2025 年估值标记更贴合公开证据，但可比公司分化很大。
          tone: neutral
        - label: 财务赞助方退出一致性
          value: 5/10
          detail: Blackstone 控制权可能加分也可能减分，取决于杠杆和减持行为。
          tone: warning
        - label: 证据完整性
          value: 5/10
          detail: 公开来源只能方向性回答总投放额、杠杆和队列质量，不能给出定论。
          tone: warning
    approximationNotes: 评分是基于本章证据作出的分析判断，而非公司披露指标。
    claimRefs:
      - CV007
      - CV010
      - CV040
      - CV041
      - CV043
      - CV047
      - CV048
