  - id: FM003
    title: 买方和用户细分决策矩阵
    type: matrix
    layout: wide
    summary: 五类买方在预算控制、评估路径和主要摩擦上各不相同；游戏开发商独特地同时跨越买方和卖方角色。
    data:
      columns:
        - 直接应用广告主
        - 移动游戏开发商
        - 代理商
        - DSP
        - 应用发布商
      rows:
        - label: 主要决策者
          values:
            - 增长负责人 / 营销副总裁
            - UA 负责人 + 变现负责人
            - 媒介投放 / 程序化团队
            - 交易台 / 算法
            - 变现 / 收入负责人
        - label: 预算来源
          values:
            - 应用公司 P&L（增长预算）
            - 工作室 P&L（UA 和收益预算）
            - 客户服务费 + 媒介费用
            - 客户 DSP 费用
            - 广告收入（扣除网络抽成率）
        - label: 主要购买触发因素
          values:
            - 现有渠道 ROAS 不达标
            - 游戏上线 / live-ops 放量
            - 客户指令或审计
            - 为 RTB 扩充供给
            - 填充率或 eCPM 提升
        - label: 关键评估标准
          values:
            - CPA / ROAS 对比基准
            - LTV 预测与游戏品类匹配度
            - 报告透明度与白标选项
            - 竞价胜率与延迟
            - SDK 集成简易度与聚合质量
        - label: 主要摩擦 / 约束
          values:
            - ATT 归因缺口、素材疲劳
            - 下载饱和、SKAN 复杂、CPI 上升
            - 人工插单流程、程序化灵活性有限
            - OpenRTB 合规、库存欺诈风险
            - DSA 披露负担、SDK 泛滥疲劳
    approximationNotes: 各细分角色由 Liftoff 产品描述、AppsFlyer 调研数据和 Chartboost 聚合文档概括而来。DSP 和发布商摩擦点来自技术文档和行业常态推断，不是来自一手买方访谈。
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
  - id: FM004
    title: 广告主采用漏斗——从预算分配到规模化独立渠道投放
    type: funnel
    layout: standard
    summary: 五阶段漏斗从最初探索渠道走到规模化独立渠道投放；归因信任和 SKAN 合规阶段摩擦最高。
    data:
      items:
        - label: 渠道发现与基准兴趣
          value: 100
          detail: 广告主发现 Google/Meta 上的 ROAS 缺口，或寻求新兴市场触达，于是开始与独立网络对话。Moloco 式研究显示集中度达 88%，推动这一动作。
          tone: neutral
        - label: MMP 集成与归因设置
          value: 65
          detail: 广告主的 MMP（AppsFlyer、Adjust、Branch）必须把网络列入白名单。iOS 流量需要配置 SKAN 回传。技术资源不足的小广告主在这里流失多。
          tone: neutral
        - label: 带 CPI/CPA 护栏的试点投放
          value: 45
          detail: 广告主用有限测试预算运行投放，并设置严格 CPA 上限。成功标准是在 30 天内相对 Google/Meta 控制组取得相当或更好的 ROAS。超过三分之一的营销人员在这一阶段仍不熟悉 SKAN 4.0。
          tone: positive
        - label: 归因验证与 ROAS 确认
          value: 28
          detail: Moloco 研究发现，多元化广告主在第 30 天的 ROAS 改善最高可达 214%。成功试点会转化为持续预算分配。MMP 提供增量测试。
          tone: positive
        - label: 持续规模化投放与素材优化
          value: 18
          detail: 广告主把网络纳入核心媒体组合；素材轮换和出价策略交给平台 AI。Retention First 2026 趋势可能让再互动预算与 UA 一起扩张。
          tone: positive
    approximationNotes: 漏斗阶段数值只是可视化的序数权重，不是实测转化概率。流失判断来自有来源报告中的定性信号（MMP 集成摩擦、SKAN 采用滞后、试点到放量转化）；未直接获得量化漏斗数据。
    claimRefs:
      - CM011
      - CM037
      - CM032
      - CM029
