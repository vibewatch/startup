        title: 冲突、分发杠杆与监管姿态
        blocks:
          - type: paragraph
            body: >-
              所有权和冲突结构几乎与产品清单同样重要。AppLovin 的优势伴随当前最重的负面噪音：行业媒体报道提到 SEC 审查、据报道州总检察长关注，以及围绕分发实践的争议；Muddy Waters
              则认为，公司电商主张依赖低增量再定向和违反服务条款。Unity 在已留存证据中的监管阴云没那么急，但其 AI 重启也承认，任何使用深层生态数据的自动出价器都会面临黑箱张力。Digital Turbine 和
              AdColony 有自己的冲突模式，因为 OEM 预装位和触达设备的分发很强，却并不中立。Pangle 和 ByteDance 又叠加一层地缘政治和政策风险，因为它们连接 TikTok
              相关广告主需求和中国根基母公司。The Trade Desk 通过强调不拥有媒体、而是站在大型合作伙伴市场之上，营销相反姿态。Liftoff 的公开信任姿态更窄但更清晰：Vungle Exchange
              材料突出品牌安全供应商、app-ads.txt、sellers.json 和隐私合规，把这些作为更干净交易所的卖点。
