        - +99% 应用安装；+134% 已绑定银行账户；日支出放大 96.3%
        - 自报数据；单一平台（Android）；计划优化 LTV，但未量化。
      - - Product Madness
        - 发布商 — 社交赌场游戏（iOS 和 Android）
        - Vungle Monetize（通过 ironSource LevelPlay 进行应用内竞价）
        - 将整个应用组合从瀑布流迁移到应用内竞价
        - 生产环境；整个组合已迁移至竞价
        - 组合整体广告 ARPDAU +11%；Heart of Vegas iOS +45%；整体 eCPM +7%
        - 合并前 Vungle 案例；依赖 ironSource LevelPlay 聚合；未涉及 Cortex AI。
      - - ZiMAD
        - 发布商 — 休闲游戏（Windows 和 Amazon 平台）
        - Vungle Monetize（Windows 和 Amazon 广告栈）
        - 最大化 Windows 应用等非移动平台的广告收入
        - 生产环境；Vungle 成为
        - Windows ARPDAU 相比 Q4 2019 在 Q4 2020 增长 +133%；Vungle 在 Windows 的声量份额 11%→61%
        - 合并前 Vungle 案例；Windows/Amazon 平台范围较小众；2021 年后无更新。
      - - TikTok
        - 发布商 / 营销客户 — 社交媒体应用（全球）
        - Vungle Creative Labs（Playable+ 广告格式）
        - 制作 Playable+ 创意格式，以更低 CPI 拉动安装
        - 生产环境；记录了持续创意工作坊节奏
        - +95% IPM（每千次展示安装量）
        - 合并前 Vungle 案例；IPM 是格式级指标，不是账户级结果。
      - - Ubisoft
        - 移动游戏开发商 — AAA 和中核长线运营游戏
        - GameRefinery Intelligence
        - 通过竞争基准识别高影响社交功能，用于长线游戏更新
        - 生产环境；社交功能已上线，并称其“对玩家互动影响巨大”
        - 上线的社交功能直接拉动互动提升——定性描述，未给出数字增幅
        - 仅有定性结果；单一记录用例；无订阅续费或会话数据。
      - - Cashwalk
        - 发布商 — 健康 / 奖励应用（先 Android 后 iOS，韩国）
        - Vungle Monetize（视频广告）
        - 为计步 / 奖励应用加入视频广告变现；扩展至 iOS 市场
        - 生产环境；Android 视频集成后扩展到 iOS
        - 广告收入 +$3K/天；iOS 扩展后触达 +30%
        - 合并前 Vungle 案例；收入基线未披露；结果未独立验证。
      - - Calm
        - 应用营销客户 — 身心健康（网红渠道）
        - Liftoff Influence
        - 带 ROI 衡量和优化的网红营销活动
        - 生产环境
        - 网红营销 ROI 提升 >50%
        - 所有案例中证据最薄；未提供安装、激活或支出指标。
