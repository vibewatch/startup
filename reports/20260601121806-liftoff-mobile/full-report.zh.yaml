        - date: '2012'
          label: Liftoff 创立
          detail: Mark Ellis、Phil Crosby 和 Harry Robertson 推出总部位于 Redwood City 的移动 UA 平台。
          tone: positive
        - date: '2017'
          label: Inc. 5000 首次上榜，位列第 8
