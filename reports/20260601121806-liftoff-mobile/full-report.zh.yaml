  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 产品线
      - 主要用户
      - 状态 / 成熟度
      - 有证据支撑的能力
      - 差异化
      - 尽调缺口
    rows:
      - - Accelerate
        - 移动 App 营销主和代理机构
        - 正式可用；创立以来的核心产品；围绕 ML 和 SKAN 支持持续迭代
        - 借助 ML 在主要交易所优化出价；支持 CPI/ROAS/pLTV 目标；通过 Bid Blocker 和点击签名防欺诈；支持 SKAN 4.0
        - Cortex AI 加上一方 Vungle SDK 信号降低 CPI；自有 GameRefinery 上下文分类体系
        - 内部转化模型准确率、出价基础设施可用性和欺诈拦截误判率未公开披露。
      - - Monetize
        - 移动 App 发布商
        - 正式可用；支持 iOS、Android、Windows、Amazon；SDK 7.6+ 支持 app 内竞价
        - Vungle SDK 集成；通过所有主要广告聚合伙伴实现 app 内竞价；多格式支持；缓存优化
        - 直接接入全球前 100 款游戏中 93% 的供给；覆盖 150,000+ 款 App
        - 与瀑布流相比，app 内竞价带来的实际 eCPM 提升未获独立验证；广告聚合伙伴合同条款未披露。
      - - Vungle Exchange
        - 第三方 DSP 和程序化买家
        - 正式可用；通过直接 SDK 集成支撑程序化交易层
        - 150,000+ App SDK 覆盖；触达 1B+ 用户；150+ 国家；全球头部游戏 93%
        - SDK 直连发布商集成避免再经纪转手；Cortex 驱动广告质量控制
        - 交易所填充率、发布商胜出率和程序化拍卖透明度指标未公开报告。
      - - Creative Studio
        - 营销主（通过托管服务）
        - 正式可用；作为托管式创意服务提供，并配 ML 优化
        - 用展示到安装 ML 选择广告；支持 UGC、视频、插屏、游戏化格式；独家 Vungle Exchange 广告格式（如三页广告）
        - 基于自有 Cortex 展示数据，用 ML 驱动创意迭代
        - 创意表现基准、制作 SLA 和托管服务定价未公开披露。
      - - Intelligence (GameRefinery + AppRefinery)
        - 移动游戏开发商和 App 营销主
        - 正式可用；2021 年收购 GameRefinery；AppRefinery 作为延伸推出
        - GameRefinery：玩法机制、元游戏功能、IP、人口统计；AppRefinery：14 个动机驱动因素和用户原型；Ubisoft 生产使用案例
        - 自有 AI 分类体系和分析师策划的游戏情报不易复制
        - Intelligence 的订阅定价、数据新鲜度 SLA 和客户数未公开披露。
      - - Direct
        - 寻求优质库存的效果营销主
        - 已可用；定位为 Accelerate 旗下 SDK 直连优质渠道
        - 独家接入 Monetize SDK 发布商网络；优质广告位绕开开放交易所再经纪转手
