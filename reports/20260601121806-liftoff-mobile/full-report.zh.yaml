  - id: FU001
    title: 客户旅程图——Liftoff Mobile 细分客群与采用触点
    type: journey-map
    layout: wide
    summary: Liftoff 的客户采用路径因细分客群而异。App 营销方走的是从投放试跑到放量的路径；发布商先接入 SDK，再通过应用内竞价深化使用；游戏开发者从 Intelligence 订阅切入，并把工具嵌入开发工作流。
    data:
      nodes:
        - id: marketer-trial
          label: 营销方试跑
          detail: UA 团队按 CPI 或 CPA 目标搭起首个 Accelerate 活动；通过 AppsFlyer 或 Adjust MMP 接入回传。
          tone: neutral
        - id: marketer-scale
          label: 营销方放量
          detail: 试跑奏效后加预算（Ibotta 5.7x、Stash 96.3%）；再跨平台（Android→iOS）或切入新垂直场景。
          tone: positive
        - id: marketer-expand
          label: 营销方跨产品
          detail: 已使用 UA 的营销方叠加重定向（Just Eat“组合效果更好”）、Creative Studio 做素材优化，或采用 Influence。
          tone: positive
        - id: publisher-sdk
          label: 发布商 SDK 接入
          detail: App 开发者接入 Vungle Monetize SDK；先从视频和插屏广告位获得收入。
          tone: neutral
        - id: publisher-bidding
          label: 发布商应用内竞价
          detail: 发布商从瀑布流升级到应用内竞价，提高 eCPM 并自动优化（Product Madness、ZiMAD）。
          tone: positive
        - id: developer-intel
          label: 游戏开发者 Intelligence 试用
