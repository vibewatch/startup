  - id: FM001
    title: 移动应用效果营销——TAM/SAM/SOM 金字塔
    type: pyramid
    layout: standard
    summary: 三层嵌套市场，从广义全球数字广告（移动端约 $200B）收窄到 Liftoff 参与竞争的可服务独立渠道（约 $13B）。
    data:
      items:
        - label: 全球移动广告（宽口径 TAM）
          value: 200
          unit: $B (2025 est.)
          color: '#1a3a5c'
          tooltip: >-
            US digital ad spend $137B (SensorTower 2025); mobile ~50% of global digital; global estimated 2–3× US. High
            uncertainty — no direct global mobile-only source accessed.
        - label: 移动应用效果营销——UA + 再营销（收窄 TAM）
          value: 108
          unit: $B (2025 derived)
          color: '#2563a8'
          tooltip: >-
            Derived from AppsFlyer: remarketing $31.3B = 29% of total → $108B. Includes Google/Meta spend. Medium
            confidence — based on spend-share disclosure, not direct sizing report.
        - label: 独立开放互联网移动 UA / 再营销渠道（SAM）
          value: 13
          unit: $B (2025 est.)
          color: '#3b82f6'
          tooltip: >-
            Residual 12% of $108B after Moloco/Sensor Tower finding that 88% goes to Google/Meta. Low confidence —
            Moloco study covers consumer apps only; self-interested publisher.
    approximationNotes: 三个数字都有很大估计不确定性。TAM 靠美国口径外推到全球。SAM 来自一项聚焦消费者（非游戏）应用的单一研究中的集中度比例。SOM 未用数字呈现；Liftoff 收入为私有且未披露。
    claimRefs:
      - CM003
      - CM004
      - CM010
      - CM001
