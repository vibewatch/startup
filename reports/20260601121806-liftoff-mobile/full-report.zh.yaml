            - label: 高
              tone: positive
              detail: 134% 安装增长、297% 激活增长、5.7x 日花费放大都是具体 KPI。
            - label: 低
              tone: warning
              detail: 未公开续约、NRR 或合同期限数据。
            - label: 高
              tone: positive
