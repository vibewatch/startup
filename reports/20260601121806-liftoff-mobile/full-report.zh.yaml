      - number: '2.2'
        title: 市场规模测算——多重口径
        blocks:
          - type: paragraph
            body: >-
              没有单一公开分析师对“移动 app 效果营销”给出独立规模测算，并把 UA 与再营销子市场同更宽的移动广告切开。最扎实的口径来自第一方花费数据：AppsFlyer 报告 2025 年全球再营销花费为 $31.3
              billion，占 app 营销总花费（UA 加再营销）的 29%。倒推总额，2025 年全球移动 app 效果营销市场约为 $108 billion。该数字覆盖所有渠道上的直接广告主和代理商花费，包括占主导的
              Google 和 Meta 渠道。

              更宽口径是美国整体数字广告：SensorTower 测得 2025 年美国数字广告花费为 $137 billion（同比增长
              12%），移动是最大单一渠道类别。全球数字广告市场约为美国的三倍，意味着全球数字广告超过 $400 billion。移动约占全球数字广告总花费的 50%，指向约 $200 billion 的全球移动广告 TAM。

              更窄口径——也是 Liftoff 相关的竞争战场——是独立、开放互联网移动广告网络板块。Moloco 2025 年 8 月与 Sensor Tower 和 Singular 发布的研究发现，88% 的消费者移动
              app 广告预算仍集中在 Google 和 Meta。套用到 $108 billion 估计值，独立渠道花费约为 $13 billion。Liftoff 的 $4.3 billion
              估值意味着其在这一独立层中占有有意义但非多数的份额。

              前瞻口径：2024 年全球 IAP 收入达到 $150 billion（同比增长 13%），仅 2025 年 Q2 就达到 $41 billion（同比增长 11.5%），这正是 UA
              广告主想触达的消费者花费池。Newzoo 估计 2025 年全球游戏市场为 $188.8 billion，其中移动游戏为 $103 billion；这个以游戏为中心的总额，为游戏垂直 UA
              花费提供补充性需求信号。
