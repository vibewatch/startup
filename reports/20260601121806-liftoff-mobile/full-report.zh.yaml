      - number: '6.4'
        title: 扩张证据可信；集中度与渠道风险披露缺失
        blocks:
          - type: paragraph
            body: >-
              多个案例研究记录了初始活动成功后的预算扩张，提供了目前最清晰的需求侧健康客户单位经济代理指标。Ibotta 把日均支出扩大 5.7x，随后启动再互动活动。Stash 一个月内把日支出提高 96.3%，并计划按
              LTV 优化。Just Eat Takeaway.com 从双市场试点扩展到另外六个市场。Delivery Hero 在增量确认后，把 LATAM 的 Android 支出提高了两位数。Acorns
              在早期活动成功后，从仅 Android 扩展到纳入 iOS。这一模式——初始部署、衡量结果、增加预算，以及跨产品或跨平台扩张——在金融科技、外卖和网约车垂直中反复出现，说明使用 Liftoff
              达到高于目标结果的营销人员，倾向于扩张，而不是把预算轮转到别处。

              在发布商侧，ZiMAD 的 Windows 收入中，Vungle 份额随时间从 5% 升至 40%（2020 年 Q4 达到 Windows 声量的 61%）；Product Madness 则把整个应用组合转向
              Vungle 应用内竞价，代表核心变现基础设施，而不是测试性分配。这些不是试点信号，而是发布商深度依赖 Liftoff 变现栈。

              尽管有这些扩张信号，公开记录仍留下三个风险数据缺口。第一，收入集中度完全未披露：没有公开说法说明头部客户收入占比，也不知道是否有单一广告主或发布商贡献超过 5-10%
              收入。第二，规模披露有所改善，但分层仍不透明：2026 年 IPO 摘要显示超过 1,000 名营销人员、167,814 个集成应用和 384 名 $100K 以上核心广告客户，但没有拆分直接广告主与代理 /
              DSP 账户，没有量化各变现界面的活跃发布商客户，也没有披露 Intelligence 订阅者。第三，代理和 DSP 买家群体——Liftoff
              产品页主动营销的细分——仍没有任何具名案例研究，使其规模、利润率结构和留存动态基本不透明。投资人仍需要管理层访问权限，才能承销集中度和细分耐久性。
