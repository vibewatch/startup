  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流理解的产品组合
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 面向四类不同客户——移动应用营销人员、代理商、需求方平台和移动发布商——提供六条产品线；每条产品线都围绕移动增长栈里的一个具体工作流需求设计。Accelerate
              是需求侧用户获取产品，使用 ML 在主要广告交易所中定位并竞价高价值用户，提供 ROAS、SKAdNetwork、app-to-web、促销和再互动活动类型。营销人员设定 KPI
              目标（CPC、CPI、CPA、ROAS 或 pLTV），Accelerate 的 Cortex AI 引擎会实时自动优化出价和创意选择。

              Monetize 是发布商侧对应产品：它通过 Vungle SDK 把 Liftoff 需求基础中的广告投放到应用库存，支持应用内竞价来取代人工瀑布流管理，并覆盖 iOS、Android、Windows 和
              Amazon 平台。Vungle Exchange 提供程序化交易层，把 Monetize 供给连接到第三方 DSP；同一个 Vungle SDK 支撑着 150 多个国家、超过 150,000 个应用中的直接
              SDK 集成。Creative Studio 把 ML 和人工创意专长结合起来，生产并迭代视频、插屏和用户生成内容广告，并用展示到安装数据为每个版位选择最优创意。

              Intelligence 包含两个分析子产品：GameRefinery 面向移动游戏，覆盖玩法机制、元游戏功能、IP 使用和实时活动分析；AppRefinery 面向消费应用，使用包含 14
              个受众驱动因素的动机驱动框架，为 UA 创意和留存策略提供输入。Direct 是一个优质库存渠道，把营销预算专门路由给 SDK 直连发布商，绕开开放交易所中介，以获得更高质量的版位。Calm
              案例研究展示了一个名为 Liftoff Influence 的子产品，聚焦可衡量 ROI 的网红营销；该产品没有在主产品组合页面中突出展示，代表一个潜在的额外产品界面。
