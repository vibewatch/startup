  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层——营销人员、发布商、代理商、DSP 与智能产品用户
        blocks:
          - type: paragraph
            body: >-
              Liftoff 官方产品页面列出五个面向买方的解决方案，对应五个不同细分群体。应用营销人员和用户获取团队是规模最大、公开资料最充分的群体，他们使用 Accelerate 产品运行基于效果的程序化 UA 活动，并按
              CPI、CPA 和 ROAS 目标优化。移动应用发布商通过 Monetize 产品（Vungle 旧有发布商 SDK）变现库存，把供给侧开发者连接到优质需求，并支持视频、插屏和应用内竞价版位。DSP
              和代理买家通过 Vungle Exchange 程序化市场大规模触达 Liftoff 发布商库存。移动游戏开发者使用 GameRefinery 和 AppRefinery——合称
              Intelligence——来对标竞争者、指导功能开发，并优化游戏内变现策略。第五个新兴细分群体是网红与影响力投放买家，由 Liftoff Influence 服务，用于衡量 ROI 的网红营销。


              这些细分群体的公开证明分布并不均衡。广告主侧案例研究偏向非游戏垂直：金融科技（Acorns、Ibotta、Stash）、外卖（Just Eat Takeaway.com、Delivery
              Hero）、网约车（Grab）以及健康 / 网红营销（Calm）；游戏侧最清晰的证明则在发布商和智能产品侧，来自 Product Madness、ZiMAD、TikTok、Cashwalk 和
              Ubisoft。这一区分很重要：Liftoff 明确证明了非游戏 UA 买家的价值和游戏发布商变现价值，但关于游戏广告主标识、代理账户深度或 DSP 客户集中度的公开证据很少。


              2026 年 IPO 报道给出了比旧的 2021 年合并基线更新鲜的规模标记。IPOScoop、Mobilegamer.biz 和 Renaissance Capital 均概述称，Liftoff
              申报文件显示，截至 2025 年 9 月 30 日，平台上有超过 1,000 名营销人员，超过 140,000 个集成应用连接到全球约 1.4 billion 日活用户。Quartr 2026 年 5
              月的注册申报摘要把集成应用规模更新为 167,814，并补充称 384 名客户贡献了超过 $100K 的过去核心广告收入。这些数字确认平台仍服务大型客户和发布商基础，但没有拆分直接广告主与代理 /
              DSP，也没有按变现格式隔离活跃发布商数量。合并以来，Blackstone 和 General Atlantic 的投资公告称「持续产品扩张和以客户为中心的创新」带动了「显著增长」；Badoo 用户获取团队和
              Jeff Gurian 的首页证言则说明，应用营销人员仍把 Liftoff 视为一个能与围墙花园替代方案竞争的效果渠道。
