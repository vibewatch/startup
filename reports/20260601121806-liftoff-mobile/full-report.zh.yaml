              AppLovin 2025 年收入 $5.48B、调整后 EBITDA 利润率约 82%，证明有规模的移动广告技术平台可以跑出极强的单位经济。Liftoff 的双边供需模型、Cortex AI 优化和 10+
              年平台深度，让它相较小型同行处在更有利位置；但 AppLovin 级别利润率需要供给所有权和 ML 效率上的规模优势，若无披露，无法为 Liftoff 确认。
