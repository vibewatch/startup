          tone: positive
        - date: 2019-07
          label: Blackstone 收购 Vungle（约 $750M）
          detail: 未来合并伙伴在移动供给侧获得 PE 支持，为端到端逻辑铺路。
          tone: positive
        - date: '2021-08-24'
          label: Liftoff-Vungle 宣布合并
          detail: 端到端平台：合计每日广告 >2B，SDK 集成 >100k。
          tone: positive
        - date: 2021-10
          label: 合并完成
          detail: 合并后公司开始运营；Blackstone 成为统一平台的多数股东。
          tone: positive
        - date: 2022-05
