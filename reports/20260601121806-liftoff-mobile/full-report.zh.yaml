  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Apple / Google 平台规则冲击
        - 新 OS 或应用商店隐私政策实质性移除标识符、信号或访问权限
        - 任何供应商变化迫使测量流程重写，或实质性削弱客户报告能力
        - 暂停投资测算，直到管理层量化风险收入、迁移计划，以及客户 opt-in / 测量影响
      - - AppLovin 或其他规模化网络造成份额流失
        - 头部客户预算实质性转向规模化 AI 领先对手
        - 证据显示前 100 大广告主留存、胜率或 ROAS 竞争力连续多个季度恶化
        - 下调护城河和利润率假设；推进前必须拿到客户层面留存证明
      - - 地缘政治 / 法律外溢
        - TikTok / ByteDance / 中国关联广告技术限制扩大，或触发新的同意型执法
        - 任何法律、执法行动或合作伙伴通知改变跨境预算可用性或数据使用权限
        - 对需求情景做压力测试，并要求按地区、买方和合作伙伴量化敞口地图
      - - PE 股东流动性压力
        - 公开市场估值显著低于私募标记，或 PE 股东控制权持续存在且独立治理没有加强
        - IPO 价格、上市后交易或董事会结构显示 PE 股东把退出变现置于长期再投入之前
        - 将治理风险视为影响投资逻辑的因素，并要求明确的 IPO 后运营和资本配置承诺
    notes: 触发项面向投资监测，而不是合规运营；它们把结构性风险转成可观察的尽调检查点。
