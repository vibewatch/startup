              tone: positive
              detail: 拉美生产级 UA，采用留出组增量测试方法，花费实现双位数增长。
            - label: 高
              tone: positive
              detail: 阿根廷和秘鲁的安装转化提升 20-26%，事件提升 14-22.6%。
            - label: 低
              tone: warning
              detail: 只有“长期合作伙伴”的表述；未提供 NRR 或合同期限。
            - label: 中
              tone: positive
              detail: 确认增量效果后，阿根廷和秘鲁 Android 花费均实现双位数增长。
        - label: Product Madness
          values:
            - label: 高
              tone: positive
              detail: 整个 App 组合在 iOS 和 Android 上从瀑布流迁移到 Vungle 应用内竞价。
            - label: 高
              tone: positive
              detail: 组合 ARPDAU 增长 11%；Heart of Vegas 在 iOS 上增长 45%；eCPM 提升 7%。
            - label: 低
              tone: warning
              detail: 没有发布商留存率或回迁瀑布流数据。
            - label: 中
              tone: positive
              detail: 所有 App 转向竞价；团队时间腾出来做混合变现策略。
        - label: Ubisoft
          values:
            - label: 中
              tone: neutral
              detail: 在一组线上游戏社交功能更新中，工具已嵌入工作流。
            - label: 中
              tone: neutral
              detail: “对玩家参与度影响巨大”——只有定性表述，没有数值提升或收入数字。
            - label: 低
              tone: warning
              detail: 没有订阅续约数据、会话数，或归因至 GameRefinery 的收入。
            - label: 低
              tone: warning
              detail: 只有一个已披露用例；未发布后续案例研究。
    approximationNotes: null
    claimRefs:
