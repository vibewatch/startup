  - id: TP003
    title: 数据优势、集成足迹与监管暴露
    columns:
      - 玩家
      - 市场侧
      - 数据 / AI 优势
      - 集成 / 分发足迹
      - 地理 / 监管暴露
      - 商业模式含义
    rows:
      - - Liftoff
        - 广告主 + 发行商
        - Cortex 加 Vungle 供给数据和创意表现信号
        - 直接交易所路径、SDK 覆盖、主要聚合渠道接入、创意服务
        - 强调隐私 / 品牌安全合规；地缘负担低于中国关联对手
        - 最适合想在供需两侧执行中立应用增长的买方
      - - AppLovin
        - 广告主 + 发行商
        - Axon 和 MAX 建在大规模内部需求与变现闭环上
        - 游戏触达强，自助化推进，并从游戏扩向电商和 CTV
        - 在保留样本中，当前负面审视最重
        - 规模叠加自动化可以压缩赛道，但审视可能削弱叙事
      - - Unity / ironSource
        - 广告主 + 发行商 + 开发者
        - Vector 明确使用 Unity 生态内的信号训练
        - 引擎、编辑器、LevelPlay、Unity Ads、Tapjoy、Aura、Ad Quality
        - 在保留样本中监管压力低于 AppLovin，但生态冲突清晰
        - 对已在 Unity 上的游戏工作室，工作流锁定可能比交易所中立更重要
      - - DT / AdColony
        - 广告主 + 发行商 + 运营商
        - 优化能力贴着自有运营商和设备展示位
        - FairBid、DT Exchange、offer wall、另类应用商店、OEM / 运营商安装
        - 分发重的模式可能触发政策和伙伴舒适度问题
        - 当买方更看重增量安装或设备触达，而不是中立性时更强
      - - Moloco
        - 广告主 + 发行商
        - ML 优先的优化和 SDK bidding；把应用内生态定位为 AI 时代更有韧性的供给
        - SDK、广告主需求、Xiaomi GetApps 等合作伙伴关系
        - 公开监管噪音较低，但创意或交易所广度不够显眼
        - 通常作为 AI 需求层竞争，而不是全栈市场
      - - Mintegral
        - 广告主 + 发行商
        - AI Smart Bidding，加用户标签、LAT 估计和创意工具
        - 直接 SDK 连接 10,000 家发行商和 100,000 个应用
        - 中国关联政策敏感度，加上区域集中风险
        - 买方重视开放互联网触达和中国市场执行时更有竞争力
      - - Pangle / ByteDance
        - 广告主 + 发行商
        - 直接 TikTok 广告主需求，以及基于 RTB 的变现 / UA 工具
        - 应用变现市场，加上与 ByteDance 规模绑定的 UA
        - 需求入口很强，同时地缘和政策敏感度最高
        - 需求入口强，但最不符合中立中介逻辑
      - - The Trade Desk
        - 广告主 / 代理商
        - Kokai 和平台 AI 在每秒 15M 次广告机会中优化
        - 30+ 个移动伙伴，加上广泛伙伴门户和全渠道 DSP 栈
        - 不持有自有媒体，降低结构性冲突
        - 买方想把移动作为更大开放互联网购买体系的一条渠道时胜出
    notes: 本表比较公开运营模式，不比较内部拍卖质量。「暴露」指保留来源集合释放的信号， 不构成法律结论。
