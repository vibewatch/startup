      - number: '2.6'
        title: 规模测算尽调缺口与矛盾估计
        blocks:
          - type: paragraph
            body: >-
              市场规模分析有三个重大缺口。第一，没有独立分析师把“移动 app UA 加再营销”作为独立子板块发布估计；$108 billion 数字由 AppsFlyer 的花费占比披露推导而来，可能把独立网络无法触达的
              封闭生态花费计入，导致高估。第二，约 $13 billion 的独立渠道估计，是用 Moloco 自利研究中的 88% 集中度数字倒算出的残差；访问来源中没有独立佐证估计。第三，截至 2026 年中，Google
              Privacy Sandbox Android 部署状态无法从可访问来源确认（Privacy Sandbox 页面返回 404 错误），给市场规模中的 Android 部分带来测量不确定性。上述缺口应通过对
              MMP（AppsFlyer、Adjust、Branch）的一手调研，以及向 Liftoff 管理层询问内部按垂直领域拆分的收入来补足。
            claimRefs:
              - CM003
              - CM010
              - CM035
              - CM042
      - number: '2.7'
        title: 要点
        blocks:
          - type: callout
            title: 非游戏 IAP 超过游戏，是 2025 年标志性市场事件
            body: >-
              2025 年 Q2，非游戏 app IAP 收入首次在全球超过移动游戏（$21.1B vs ~$20B）。这一结构性变化把 UA 买方池扩展到游戏开发者之外，并为具备非游戏垂直领域
              专长的效果营销平台创造新需求。历史上偏重游戏的平台（如 Liftoff 的 Vungle Exchange）必须证明自己具备有竞争力的非游戏需求与供给。
            calloutType: insight
            claimRefs:
              - CM007
              - CM012
              - CM023
          - type: callout
            title: Google 和 Meta 88% 预算集中度构成结构性天花板
            body: >-
              Moloco 2025 年 8 月研究发现，88% 的消费者移动 app 广告预算仍留在 Google 和 Meta。如果集中度稳定或继续上升，全球独立渠道 SAM 上限约为 $13
              billion——有限资金池同时由 AppLovin、Unity、Moloco、Mintegral 和 Liftoff 争夺。若 AppLovin 的 Axon AI 平台继续在该池中拿份额，Liftoff
              若没有差异化留存或非游戏策略，可触达机会将进一步收窄。
            calloutType: risk
