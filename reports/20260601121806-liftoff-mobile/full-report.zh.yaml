            title: Apple ATT 是设备级移动广告定向的结构性约束
            body: >-
              Apple 的 App Tracking Transparency 框架自 iOS 14.5 起强制执行，app 在跟踪设备标识符用于广告之前必须取得用户明确授权。对包括 Liftoff
