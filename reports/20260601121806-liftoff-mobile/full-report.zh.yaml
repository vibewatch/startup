      - number: '8.3'
        title: PE 所有权改变退出测算，因此情景分析比单一可比倍数更重要
        blocks:
          - type: paragraph
            body: >-
              Blackstone 持续持有多数股权，从两个方面改变估值框架。第一，问题不再是 Liftoff 能否以溢价再融一轮风险投资，而是赞助方主导的变现能否以对 Blackstone
              和任何新少数股权买家都足够有吸引力的条款发生。第二，赞助方控制公司有时纸面上看起来更便宜，但实际未必如此，因为减持时点、老股分配、杠杆和优先权经济性都会影响实现回报。公开记录已经显示，退出测算对价格敏感：Reuters
              和 Renaissance 都显示 2026 年 IPO 经济性显著低于 2025 年少数股权标记；Reuters 还明确把软件估值压力与 AI 颠覆担忧联系起来。

              因此，即便债务栈未披露，LBO 式视角仍有用。在 $741 million 收入下，若假设利润率为 15%、25% 和 35%，Liftoff 将分别产生约 $111 million、$185 million 和
              $259 million EBITDA。$4.3 billion 私募标记在这些情景下分别隐含约 38.7x、23.2x 和 16.6x EV/EBITDA；$3.66 billion IPO 高端分别隐含约
              32.9x、19.8x 和 14.1x。这些倍数不是困境水平，但足够高，金融工程本身无法完成任务。以 $4.3 billion 买入的赞助方支持买家，需要持久的 EBITDA 扩张和倍数保持；若买方价格更接近
              IPO 重置区间，则可以承销一条更传统路径，由稳定的利润率改善来弥合差距。
