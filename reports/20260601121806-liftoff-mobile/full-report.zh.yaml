  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已观察交易锚点与 2026 年公开市场重估
        blocks:
          - type: paragraph
            body: >-
              最干净的已观察估值数据，仍是 2025 年 5 月 Blackstone/General Atlantic 交易：该交易给 Liftoff 定价 $4.3 billion，同时明确让 Blackstone
              保持多数控制。这一点重要，因为它确认了一笔真实的公平少数股权交易，而不是纯粹的赞助方内部估值标记。不过，对承销而言，下一个市场测试更相关：到 2026 年 5 月下旬，Liftoff 已启动 IPO
              路演，计划发行 19 million 股，价格区间 $20-$22；Reuters 报道称，公司目标估值最高约 $3.66 billion。Renaissance Capital 的 IPO
              笔记把中点描述为完全摊薄后约 $3.9 billion，意味着公开市场买家被要求接受比 2025 年少数股权交易低约 9%-15% 的股权价值。

              估值重置更有信息量，因为 IPO 材料也披露了当前收入基数。Liftoff 重启的 IPO 营销披露，截至 2026 年 3 月 31 日的过去十二个月收入约 $741 million，超过 1,000
              名营销人员，超过 140,000 个 SDK 集成应用，并通过这些集成触达约 1.4 billion 个 Q4 2025 日活用户。基于这一披露收入，2025 年 $4.3 billion 标记隐含约 5.8x
              销售收入，2026 年 IPO 高端隐含约 4.9x，中点隐含约 5.3x。这不能证明 2025 年标记错了；它说明，一旦公开投资人拿到更新的经营数据，他们要求以更低价格购买同一个赞助方控制资产。
