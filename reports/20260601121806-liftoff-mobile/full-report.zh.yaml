        title: 能力宽度、市场两端，以及 Liftoff 真正不同之处
        blocks:
          - type: paragraph
            body: >-
              在已留存证据中，最重要的购买标准是平台控制市场哪一端、声称拥有什么自有数据闭环、集成足迹有多深，以及除竞价机制外是否提供创意或工作流服务。AppLovin 和 Unity
              都同时卖给广告主和发行商，但二者也享有中立交易所模型之外的特权资产：AppLovin 有 Axon 和 MAX，Unity 有引擎以及 LevelPlay、Vector。Digital Turbine 组合
              UA、变现和替代 app 分发；Moloco 强调机器学习需求和基于 SDK 的变现；Mintegral 和 Pangle 强调开放互联网触达、直接需求和 AI 出价。Liftoff 的公开切口不同。它明确把基于
