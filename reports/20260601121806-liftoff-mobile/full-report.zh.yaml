            body: >-
              $13 billion 独立 SAM 估计假设 Google 和 Meta 88% 集中度延续到 2026 年。如果监管行动（DSA、反垄断）、消费者情绪或算法失误让即便 5 个百分点预算流出封闭生态，SAM
              也会扩大约 $5–6 billion。基准情景规模测算没有反映这一敏感性；对独立平台市场份额预测而言，这是重大上行风险。
