      - number: '1.3'
        title: 融资历史、所有权与估值
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的资本结构体现出 Blackstone 主导的私募股权所有权：该结构早于当前公司成形，并推动了当前公司成形。Blackstone 2019 年 7 月以据报道约 $750 million 收购
              Vungle 多数股权，之后又在合并前向 Liftoff 单独投资约 $400 million，并主导两家被投公司在 2021 年合并。2021 年 8 月 24
              日的合并公告称，合并将打造全球最大的独立、隐私友好型移动 app 增长平台之一；交易于 2021 年 10 月完成，Blackstone 继续作为控股股东。

              2025 年 5 月 5 日，Blackstone 宣布达成协议，以 $4.3 billion 公司估值向 General Atlantic 出售少数股权，并明确保留多数股权。Liftoff/Blackstone
              一方由 Goldman Sachs 和 Jefferies 提供财务顾问、Simpson Thacher & Bartlett 提供法律顾问；General Atlantic 一方由 Morgan Stanley
              提供财务顾问、Paul Weiss 提供法律顾问。根据 PRNewswire 交割公告，交易于 2025 年 7 月 1 日完成，这是公司目前公开确认的最高估值基准。General Atlantic 的
              Tanzeen Syed 将 Liftoff 的 AI 技术、执行质量和以客户为中心的能力列为投资逻辑；General Atlantic 的支持明确指向扩展 Cortex AI 平台和推进战略 M&A。

              收入、EBITDA 和内部财务 KPI 均未公开披露。公司为非上市公司，没有公开监管文件。Blackstone 和 General Atlantic 的确切持股比例、完整股权结构表以及任何创始人股权
              rollover 条款，公开来源也无法取得——这些都是第一优先级尽调事项。
