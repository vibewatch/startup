      - number: '2.3'
        title: 买方、用户和付费方分层
        blocks:
          - type: paragraph
            body: >-
              Liftoff 的四类买方，在预算归属、决策流程和产品要求上差异很大。直接 app 广告主——运营非游戏移动 app 的品牌和工作室——掌握自己的 UA 预算，并依据 CPI/CPA 基准、ROAS 曲线和
              MMP（移动测量合作伙伴）兼容性选择网络。非游戏广告主是增长最快的买方板块：2025 年 61% 设置了更激进的 KPI 目标，非游戏 IAP 收入同比增长 23%。该板块优先看规模、归因保真度和创意表现。

              移动游戏开发者是历史上占主导的买方板块，同时也以发行商（库存卖方）身份通过 app 内广告变现。买方与卖方的双重角色形成飞轮：UA 花费效率部分取决于发行商侧收益优化 质量。Unity 报告 top-100
              移动游戏中 85% 使用其增长解决方案，说明特定平台在游戏工作流中嵌入很深。

              代理商聚合多个品牌客户的花费，需要 API 集成、白标报告和透明定价来证明中介利润。DSP（需求方平台）通过 OpenRTB
              竞价程序化购买库存，需要与交易所供给做技术集成，而不是托管服务关系。发行商（通过广告变现的 app 开发者）是供给侧群体：他们需要 SDK 集成、聚合技术栈兼容性和填充率保证，因此购买的是 Liftoff
              的变现产品（Monetize 和 Vungle Exchange），不是 UA 产品。

              UA 预算主要由 app 公司内部效果营销团队掌握，代理商则代理控制品牌分配的数字预算。切换网络或新增渠道的触发点，通常是现有渠道 ROAS 不足、新市场扩张，或 iOS 上的 ATT
              等隐私框架变化扰乱既有测量。
