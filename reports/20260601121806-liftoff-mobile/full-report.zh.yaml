  - id: FU003
    title: 客户验证矩阵——按具名客户评估证据质量
    type: matrix
    layout: wide
    summary: Liftoff 证据最充分的客户显示了强部署证据和具体投放结果，但所有具名案例都缺少留存、续约和集中度可见度。
