          - type: callout
            title: ATT 和 SKAN 复杂度压制 iOS 优化与客户信任
            body: >-
              Apple ATT 框架降低了 iOS 上用户级归因保真度，SKAN 4.0 的群体匿名门槛限制了低花费投放的数据粒度。2024 年超过三分之一 app 营销人员不熟悉 SKAN 4.0——能抽象掉 SKAN
              复杂度的平台将获得竞争优势，要求买方手动配置 SKAN 的平台则会遇到摩擦。Google 通过 Privacy Sandbox 废止 GAID，可能把同样约束复制到流量更大的 Android。
