      - number: '4.5'
        title: Capital adequacy, ownership structure, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Liftoff's capital structure reflects a Blackstone-led private equity ownership that drove the formation of
              the current company. Blackstone acquired Vungle for approximately $750 million in 2019, and Liftoff and
              Vungle officially merged in 2021 to create the current platform. Blackstone remains the majority
              shareholder following the General Atlantic deal.


              The May 2025 General Atlantic transaction, which closed in July 2025, was explicitly characterized as a
              minority growth equity investment by both firms. Goldman Sachs and Jefferies advised Liftoff and
              Blackstone, while Morgan Stanley advised General Atlantic, suggesting a formal process with
              institutional-grade financial diligence on undisclosed Liftoff financials. Because Blackstone remained
              majority owner and the transaction was minority rather than control, the deal looks more like valuation
              validation and capital support than a full sponsor exit.


              No cash on hand, monthly burn rate, runway, credit facility, term loan, or dividend recapitalization
              history has been publicly disclosed. For a Blackstone portfolio company at this scale, debt and
              sponsor-liquidity structure matter as much as topline growth, yet public sources do not confirm whether
              the GA investment was primary, secondary, or mixed.


              The exit-path backdrop is improving but still selective. Bain reported stronger exit activity in 2025,
              while average holding periods at exit stayed around seven years and sponsors still held a large stock of
              unsold companies; Axios separately reported tech buyouts were effectively "frozen" in April and May 2026,
              with some sponsors leaning on continuation vehicles and preferred financings instead of outright sales.
              For Liftoff, that means IPO, sponsor-to-sponsor sale, strategic sale, or continued hold/recap all remain
              plausible, with the GA minority check giving Blackstone optionality rather than forcing immediate
              liquidity.
            claimRefs:
