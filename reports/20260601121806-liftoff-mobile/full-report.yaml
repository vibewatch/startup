      - number: '8.4'
        title: Investment stance — balanced, price-sensitive, and still dependent on diligence
        blocks:
          - type: paragraph
            body: >-
              The chapter's bottom line is deliberately balanced. The observed $4.3 billion 2025 transaction deserves
              respect because it was real and sponsor-backed, not hypothetical. Liftoff is also clearly not a subscale
              asset: IPO materials imply roughly $741 million of trailing revenue, more than 1,000 marketers, more than
              140,000 app integrations, and global reach into roughly 1.4 billion daily active users. Those facts
              support a serious enterprise, not a vanity mark. But the best fresh market evidence cuts the other way.
              The revived IPO was pitched below the prior private mark, the first 2026 IPO attempt had already been
              withdrawn, and public comp dispersion is so wide that paying a premium without hard take-rate and leverage
              evidence would amount to optimism masquerading as diligence.

              My stance is therefore track, not buy, at the 2025 mark. The high-$3 billions look closer to where public
              evidence converges today; $4.3 billion can still work, but only if management can show that EBITDA margins
              plausibly trend into the mid-20s or better, that the capital structure is clean, and that core
              user-acquisition plus monetization revenue is not overly dependent on temporary arbitrage or sponsor
              timing. If those points are proven, the upside case remains intact. If they are not, then the anti-thesis
              dominates: Liftoff becomes a solid company whose price got ahead of what public evidence can justify.
            claimRefs:
              - CV008
              - CV011
