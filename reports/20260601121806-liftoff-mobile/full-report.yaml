  - id: FI001
    title: Revenue model bridge — how advertiser spend becomes net revenue
    type: flow
    layout: wide
    summary: >-
      Liftoff earns margin between advertiser spend entering via Accelerate and publisher payouts exiting through
      Monetize/Exchange; Cortex AI sits at the center optimizing both supply and demand pricing.
    data:
      nodes:
        - id: advertiser
          label: Advertisers / Agencies
          detail: Pay outcome-based fees (CPI, CPA, ROAS) for mobile user acquisition campaigns via Accelerate.
          tone: positive
        - id: cortex
          label: Cortex AI Platform
          detail: >-
            ML engine predicts user LTV, allocates budget across supply sources, optimizes creative, and sets bid
            prices.
          tone: positive
        - id: accelerate
          label: Accelerate (Demand Side)
          detail: >-
            Buys impressions across Vungle Exchange and third-party SSPs; earns margin on spread between advertiser
            revenue and TAC.
          tone: positive
        - id: exchange
          label: Vungle Exchange (Marketplace)
          detail: Programmatic auction layer; third-party DSPs access publisher inventory here; take-rate on clearing prices.
          tone: positive
        - id: monetize
          label: Monetize / Vungle SSP (Supply Side)
          detail: Publishers receive rev-share payout per impression via Vungle SDK or in-app bidding integration.
          tone: positive
        - id: publishers
          label: Publishers / Mobile App Developers
          detail: Monetize inventory via Vungle SDK; net of rev-share paid to publisher is Liftoff supply-side gross margin.
          tone: neutral
      edges:
        - from: advertiser
          to: accelerate
        - from: accelerate
          to: cortex
        - from: cortex
          to: exchange
        - from: exchange
          to: monetize
        - from: monetize
          to: publishers
        - from: cortex
          to: accelerate
    approximationNotes: >-
      Revenue flow structure inferred from official product pages and business model analogy to public comparable
      DSP/SSP platforms. Actual take-rates, rev-share percentages, and margin steps are not publicly disclosed and
      should not be inferred from this diagram.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI017
  - id: FI002
    title: Unit economics bridge — qualitative proxies for an undisclosed cost structure
    type: flow
    layout: standard
    summary: >-
      From gross advertiser spend to free cash flow, each step introduces undisclosed cost elements; the private
      disclosure profile means this bridge is structurally incomplete.
    data:
      nodes:
        - id: gas
          label: Gross Advertiser Spend (undisclosed)
          detail: >-
            Total media spend from advertisers flowing through Accelerate; substantially larger than reported net
            revenue.
          tone: neutral
        - id: net_rev
          label: Net Revenue (undisclosed; est. $400M–$700M)
          detail: >-
            Gross spend minus publisher TAC, exchange fees, and third-party inventory costs. Recognition depends on
            principal/agent determination under ASC 606.
          tone: neutral
        - id: gross_profit
          label: Gross Profit (undisclosed; peer range 40–65%)
          detail: >-
            Net revenue minus direct cost of revenue including remaining publisher payouts, infrastructure, and data
            costs.
          tone: neutral
        - id: ebitda
          label: Adj. EBITDA (undisclosed; peer range 20–55%)
          detail: After S&M, R&D, and G&A. AppLovin achieves ~82%; Digital Turbine achieved ~14.7% in FY2025.
          tone: neutral
        - id: fcf
          label: Free Cash Flow (unknown; affected by debt service)
          detail: EBITDA less capex, working capital, debt interest, and any sponsor distribution; entirely undisclosed.
          tone: warning
      edges:
        - from: gas
          to: net_rev
        - from: net_rev
          to: gross_profit
        - from: gross_profit
          to: ebitda
        - from: ebitda
          to: fcf
    approximationNotes: >-
      Revenue and margin estimates are illustrative only, derived from valuation-multiple inference and public-company
      peer analogies. Every step in this bridge is unconfirmed. Label this diagram as estimated / unavailable in any
      investor communication.
    claimRefs:
