            body: >-
              Liftoff's public scale evidence is grounded in merger-era disclosures and sustained third-party award
              recognition. At the time of the August 2021 merger announcement, Liftoff was delivering more than two
              billion ads per day across more than 550,000 mobile apps in more than 140 countries through machine
              learning and creative optimization. Vungle at the same point operated more than 100,000 direct SDK
              integrations across mobile app publishers and 15,000 individual content creators on its influencer
