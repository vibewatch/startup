            title: Institutional diligence proxy — $4.3B valuation with bulge-bracket advisors
            body: >-
              Goldman Sachs, Jefferies, and Morgan Stanley advising on the GA minority deal signals the financial rigor
              behind the $4.3B valuation. General Atlantic's growth equity framework typically requires verified
              financial metrics before commitment, providing a credible indirect endorsement of Liftoff's private
