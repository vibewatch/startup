      - number: '3.2'
        title: Capability breadth, market sides, and where Liftoff really differs
        blocks:
          - type: paragraph
            body: >-
              Across the retained evidence, the most important buying criteria are which side of the market a platform
              controls, what proprietary data loop it claims, how deep its integration footprint is, and whether it
              offers creative or workflow services beyond auction mechanics. AppLovin and Unity both sell to advertisers
              and publishers, but each also benefits from privileged assets outside a neutral exchange model: AppLovin
              from Axon and MAX, Unity from the engine plus LevelPlay and Vector. Digital Turbine combines UA,
              monetization, and alternative app distribution; Moloco emphasizes machine-learning demand and SDK-based
              monetization; Mintegral and Pangle emphasize open-internet reach, direct demand, and AI bidding. Liftoff’s
