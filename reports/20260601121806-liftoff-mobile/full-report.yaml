            title: Complete private-metric opacity is a blocking diligence constraint
            body: >-
              Revenue, gross margin, EBITDA, NRR, churn, cash, and debt are all undisclosed. For a company at $4.3B
              valuation under PE majority ownership, this is the expected disclosure profile—but it means every
              financial conclusion in this chapter is inferred or estimated. No investment decision should rely on this
              chapter without data-room confirmation of every null metric.
            calloutType: risk
            claimRefs:
