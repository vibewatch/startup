  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments — marketers, publishers, agencies, DSPs, and intelligence users
        blocks:
          - type: paragraph
            body: >-
              Liftoff's official product pages list five buyer-facing solutions mapped to five distinct segments. App
              marketers and user acquisition teams are the largest and most-documented segment, using the Accelerate
              product to run performance-based programmatic UA campaigns optimized for CPI, CPA, and ROAS targets.
              Mobile app publishers monetize their inventory through the Monetize product (the Vungle legacy publisher
              SDK), which connects supply-side developers with premium demand and supports video, interstitial, and
              in-app bidding placements. DSP and agency buyers access the Vungle Exchange programmatic marketplace to
              reach Liftoff's publisher inventory at scale. Mobile game developers use GameRefinery and AppRefinery —
              collectively branded as Intelligence — to benchmark competitors, guide feature development, and optimize
              in-game monetization strategy. A fifth emerging segment, the influencer and impact buyer, is served by
              Liftoff Influence for ROI-measured influencer marketing.


              Public proof is unevenly distributed across those segments. The advertiser-side case studies are skewed
              toward non-gaming verticals — fintech (Acorns, Ibotta, Stash), food delivery (Just Eat Takeaway.com,
              Delivery Hero), ride-hailing (Grab), and wellness/influencer marketing (Calm) — while the clearest
              gaming-side proof sits on the publisher and intelligence sides through Product Madness, ZiMAD, TikTok,
              Cashwalk, and Ubisoft. That split matters: Liftoff clearly demonstrates non-gaming UA buyer value and
              gaming publisher monetization value, but it provides little public evidence on gaming advertiser logos,
              agency account depth, or DSP customer concentration.


              2026 IPO coverage now gives fresher scale markers than the old 2021 merger baseline. IPOScoop,
              Mobilegamer.biz, and Renaissance Capital all summarize Liftoff's filing as showing more than 1,000
              marketers on platform as of September 30, 2025 and more than 140,000 integrated apps connecting to roughly
              1.4 billion daily active users worldwide. Quartr's May 2026 registration-filing summary updates integrated
              app scale to 167,814 and adds that 384 customers contributed more than $100K in trailing core advertising
              revenue. These figures confirm that the platform still serves a large customer and publisher base, but
              they do not split direct advertisers from agencies and DSPs or isolate active publisher counts by
              monetization format. Since the merger, Blackstone and General Atlantic investment announcements describe
              "significant growth" driven by "continued product expansion and customer-focused innovation," while
              homepage testimonials from Badoo's user acquisition team and Jeff Gurian indicate that app marketers still
              view Liftoff as a performance channel competitive with walled-garden alternatives.
