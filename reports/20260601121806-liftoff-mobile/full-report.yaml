        - Gross billings, net revenue bridge, and revenue split between UA and monetization
        - Core missing variable behind sales-multiple and EBITDA support
        - Management session plus S-1 financial footnotes and KPI schedules
      - - Capital structure
        - Net debt, preferred terms, secondary allocation, and sponsor sell-down plan
        - Minority returns depend on more than enterprise value
        - CFO diligence and cap-table/legal review
      - - Margin quality
        - Adjusted EBITDA bridge, stock comp, capex, and cash conversion
        - Determines whether $4.3B is 16x, 23x, or nearly 40x economic earnings
        - Finance diligence package and post-IPO filing review
      - - Customer durability
        - Concentration, cohort retention, top-10 advertiser mix, and publisher churn
        - Premium multiples only hold if revenue quality is durable
        - Revenue analytics pack and customer-cohort review
    notes: >-
      Every ask is directly tied to a valuation variable that remains only partially observable from public materials as
      of run date.
    claimRefs:
      - CV035
      - CV036
      - CV040
      - CV042
      - CV048
