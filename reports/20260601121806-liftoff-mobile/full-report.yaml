          - type: callout
            title: AppLovin's 82% EBITDA margin sets an achievable—but not assumed—benchmark
            body: >-
              AppLovin's $5.48B revenue and ~82% adj. EBITDA margin in 2025 demonstrate that scaled mobile ad tech
              platforms can generate exceptional unit economics. Liftoff's dual-sided supply-demand model, Cortex AI
              optimization, and 10+ year platform depth position it more favorably than smaller peers, but
              AppLovin-level margins require scale advantages in supply ownership and ML efficiency that cannot be
              confirmed for Liftoff without disclosure.
            calloutType: insight
            claimRefs:
              - CI018
              - CI019
              - CI038
          - type: callout
            title: Revenue range is inferred from valuation multiple bracketing, not disclosed data
            body: >-
              The $400M–$700M net revenue estimate is derived by applying 6–11x EV/revenue multiples (Digital Turbine to
              AppLovin mid-range) to the $4.3B valuation. This methodology is directionally standard but the resulting
              range is wide and uncertain. Actual revenue could be above or below this range depending on the multiple
              the GA deal was struck at, which is not disclosed.
            calloutType: assumption
            claimRefs:
              - CI038
              - CI039
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile serves four distinct customer groups — mobile app marketers, agencies, demand-side
              platforms, and mobile publishers — through a portfolio of six product lines, each designed around a
              specific workflow need in the mobile growth stack. Accelerate is the demand-side user acquisition product
              that uses ML to target and bid for high-value users across major ad exchanges, offering ROAS, SKAdNetwork,
              app-to-web, promotional, and re-engagement campaign types. Marketers set a KPI target (CPC, CPI, CPA,
              ROAS, or pLTV), and Accelerate's Cortex AI engine automatically optimizes bids and creative selection in
              real time.

              Monetize is the publisher-side counterpart: it delivers ads from Liftoff's demand base to app inventory
              via the Vungle SDK, supports in-app bidding to replace manual waterfall management, and covers iOS,
              Android, Windows, and Amazon platforms. Vungle Exchange provides the programmatic exchange layer
              connecting Monetize supply to third-party DSPs, backed by the same Vungle SDK that powers direct SDK
              integrations in over 150,000 apps across more than 150 countries. Creative Studio pairs ML with human
              creative expertise to produce and iterate on video, interstitial, and user-generated content ads — using
              impression-to-install data to select the optimal creative per placement.

              Intelligence encompasses two analytics sub-products: GameRefinery for mobile gaming, which covers gameplay
              mechanics, meta-game features, IP usage, and live event analysis; and AppRefinery for consumer apps, which
              applies a motivational driver framework with 14 audience drivers to inform UA creative and retention
              strategy. Direct is a premium-inventory channel that routes marketer budgets exclusively to SDK-direct
              publishers, bypassing open-exchange intermediation for higher-quality placements. The Calm case study
              demonstrates a Liftoff Influence sub-product focused on influencer marketing ROI, which is not prominently
              featured in the main product portfolio pages and represents a potential additional product surface.
