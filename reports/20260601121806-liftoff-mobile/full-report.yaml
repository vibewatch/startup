  - id: FM001
    title: Mobile app performance marketing — TAM/SAM/SOM pyramid
    type: pyramid
    layout: standard
    summary: >-
      Three nested market layers from broad global digital advertising (~$200B mobile) to addressable independent
      channels (~$13B) where Liftoff competes.
    data:
      items:
        - label: Global Mobile Advertising (Broad TAM)
          value: 200
          unit: $B (2025 est.)
          color: '#1a3a5c'
          tooltip: >-
            US digital ad spend $137B (SensorTower 2025); mobile ~50% of global digital; global estimated 2–3× US. High
            uncertainty — no direct global mobile-only source accessed.
        - label: Mobile App Performance Marketing — UA + Remarketing (Narrowed TAM)
          value: 108
          unit: $B (2025 derived)
          color: '#2563a8'
          tooltip: >-
            Derived from AppsFlyer: remarketing $31.3B = 29% of total → $108B. Includes Google/Meta spend. Medium
            confidence — based on spend-share disclosure, not direct sizing report.
        - label: Independent Open-Internet Mobile UA/Remarketing Channels (SAM)
          value: 13
          unit: $B (2025 est.)
          color: '#3b82f6'
          tooltip: >-
            Residual 12% of $108B after Moloco/Sensor Tower finding that 88% goes to Google/Meta. Low confidence —
            Moloco study covers consumer apps only; self-interested publisher.
    approximationNotes: >-
      All three figures carry substantial estimation uncertainty. TAM uses US-to-global extrapolation. SAM is derived
      from a concentration ratio in a single research study focused on consumer (non-gaming) apps. SOM is not depicted
      numerically; Liftoff revenue is private and undisclosed.
    claimRefs:
      - CM003
      - CM004
      - CM010
      - CM001
