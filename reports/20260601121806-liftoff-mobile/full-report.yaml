      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              The business looks real and scaled; the problem is not existence, it is entry discipline. Public evidence
              supports tracking Liftoff and engaging only if valuation stays near the 2026 reset or diligence proves
              premium margins.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV012
              - CV047
              - CV048
          - type: callout
            title: Sponsor overhang is part of valuation
            body: >-
              A sponsor-controlled company can clear at a lower headline value even when operations are holding up,
              because the seller's timing, leverage, and distribution objectives shape the trade. That is already
              visible in the 2026 IPO reset.
            calloutType: risk
            claimRefs:
              - CV041
              - CV042
              - CV043
          - type: callout
            title: Take rate is the biggest hidden variable
            body: >-
              Liftoff's public revenue number is now visible, but the link from advertiser spend to net revenue is not.
              That is why the chapter uses explicit scenario ranges instead of pretending to know a precise fair value.
            calloutType: assumption
            claimRefs:
              - CV035
              - CV036
              - CV040
