  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      On the disclosed $741M revenue base, small changes in applied sales multiple move equity value by more than $700M
      per turn, which is why take-rate and margin proof dominate the underwriting debate.
    data:
      items:
        - label: 3.0x sales
          value: 2223
          displayValue: $2.22B
          detail: Bear-ish public-market outcome.
          tone: risk
        - label: 4.0x sales
          value: 2964
          displayValue: $2.96B
          detail: Lower end of a cautious underwrite.
          tone: warning
        - label: 5.0x sales
          value: 3705
          displayValue: $3.71B
          detail: Roughly aligns with the 2026 IPO-reset zone.
          tone: neutral
        - label: 5.8x sales
          value: 4300
          displayValue: $4.30B
          detail: Observed 2025 minority-transaction anchor.
          tone: positive
        - label: 7.0x sales
          value: 5187
          displayValue: $5.19B
          detail: Requires strong premium narrative plus durable margin proof.
          tone: positive
    approximationNotes: >-
      Bars show estimated equity value in USD millions using the disclosed $741M trailing revenue base and applied sales
      multiples; values are rounded.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV032
      - CV035
      - CV045
      - CV046
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The public evidence clusters fair value in the high-$3 billions, with upside above $5B needing both revenue growth
      and premium-multiple durability, and downside into the low-$2 billions if Liftoff prices like lower-tier adtech.
    data:
      items:
        - label: Bear
          low: 2200
          mid: 2600
          high: 3000
          displayValue: $2.2B-$3.0B
          detail: 3x-4x sales on slower growth and weaker margin confidence.
          tone: risk
        - label: Base
          low: 3400
          mid: 3900
          high: 4400
          displayValue: $3.4B-$4.4B
          detail: Best fit for current public evidence and a mid-20s EBITDA path.
          tone: neutral
        - label: Bull
          low: 4300
          mid: 5100
          high: 5950
          displayValue: $4.3B-$6.0B
          detail: Requires premium comp treatment and proven operating leverage.
          tone: positive
    approximationNotes: Range bands are estimated from the scenario table and rounded to the nearest $50M-$100M.
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Liftoff scores well on market proof and scale, but only middling on valuation support, sponsor alignment, and
      evidence completeness because key private-company economics remain undisclosed.
    data:
      items:
        - label: Revenue scale
          value: 7/10
          detail: $741M trailing revenue and broad app/marketer footprint are substantial.
          tone: positive
        - label: Market proof
          value: 7/10
          detail: Real 2025 minority transaction plus revived 2026 IPO process confirm institutional relevance.
          tone: positive
        - label: Margin visibility
          value: 4/10
          detail: No public normalized EBITDA bridge or disclosed take rate.
          tone: warning
        - label: Valuation support
          value: 5/10
          detail: High-$3 billions fit public evidence better than the 2025 mark, but comp spread is wide.
          tone: neutral
        - label: Sponsor exit alignment
          value: 5/10
          detail: Blackstone control can help or hurt depending on leverage and sell-down behavior.
          tone: warning
        - label: Evidence completeness
          value: 5/10
          detail: Public sources answer directionally, not conclusively, on gross spend, leverage, and cohort quality.
          tone: warning
    approximationNotes: Scores are analytical judgments derived from the chapter's evidence rather than disclosed company metrics.
    claimRefs:
      - CV007
      - CV010
      - CV040
      - CV041
      - CV043
      - CV047
      - CV048
