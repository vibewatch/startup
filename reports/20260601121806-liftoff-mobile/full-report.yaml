  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competition, ATT, and measurement degradation are the first-order risks
        blocks:
          - type: paragraph
            body: >-
              Liftoff's most immediate risk stack combines market-structure pressure with platform-rule compression. The
              company's own S-1/A says it competes not only with Google, Meta, and Amazon, but also with independent
              mobile adtech platforms such as AppLovin, Unity, and Moloco. That matters because the advertiser side of
              the market is increasingly rewarding scaled, AI-driven systems that can offer closed-loop measurement,
              tighter optimization, and direct monetization feedback across both demand and supply. AppLovin's filings
              show exactly that kind of stack: an AI-powered demand-side engine paired with in-app bidding and
              measurement infrastructure. Unity's filings similarly describe pressure from both advertisers and
              publishers shifting to rival solutions or supply paths. Against that backdrop, Apple's ATT rules remain
              economically central. Apple defines tracking broadly, requires explicit permission before access to the
              advertising identifier, and rejects hashed-email or hashed-phone workarounds. For Liftoff, which discloses
              collection of device identifiers, IP addresses, app-usage signals, and ad-interaction data, the result is
              that targeting precision, attribution certainty, and publisher monetization all become more fragile at the
              same time. The risk is not simply that IDFA is weaker than before; it is that a scaled rival with more
              data, more auction density, or better measurement productization can win share while the whole channel is
              becoming harder to measure cleanly.
            claimRefs:
