  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and scope
        blocks:
          - type: paragraph
            body: >-
              The market Liftoff Mobile competes in is best described as mobile app performance marketing and
              monetization infrastructure. The core boundary encompasses: (1) user acquisition (UA) advertising —
              performance-priced mobile ad placements where brands and app developers pay ad networks to drive app
              installs or in-app events at measurable cost-per-install (CPI) or cost-per-action (CPA) targets; (2)
              remarketing and retargeting — spend to re-engage lapsed users of an existing app; (3) in-app monetization
              mediation — software and exchange infrastructure that routes ad demand from multiple buyers to publisher
              inventory in real-time auctions; and (4) adjacent creative optimization and analytics tooling that
              supports campaigns on platforms across the first three categories.

              Excluded from this boundary are general-purpose brand advertising on social feeds (Facebook, Instagram,
              TikTok main feed), search advertising (Google App Campaigns' Search channel), connected-TV/OTT advertising
              without mobile-app install objectives, and app-store optimization (ASO) services with no media-buy
              component. Status-quo substitutes to buying from independent networks like Liftoff include self-managed
              campaigns directly on Meta Advantage+ or Google App Campaigns, in-house programmatic desks, and
              agency-managed consolidated buys.

              Adjacent markets with blurring boundaries include retail media (in-app commerce placements), casual-game
              rewarded-video inventory, and direct-to-consumer subscription acquisition, each of which draws from the
              same buyer budget pool but may not use dedicated mobile-UA networks. The mobile gaming market represents a
              key supply segment — mobile gaming IAP reached $81 billion in 2024 — while also being the largest single
              buyer of gaming-vertical UA. Non-gaming app categories (finance, e-commerce, entertainment) are the
              faster-growing buyer segment, expanding 12% in downloads and 25% in IAP/subscription revenue in 2024.
            claimRefs:
              - CM001
              - CM007
              - CM012
              - CM020
          - type: table
            tableRef: TM001
            claimRefs:
