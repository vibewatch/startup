      - number: '7.4'
        title: Mitigants exist, but the investment case still needs explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              The public mitigation record is real but incomplete. Liftoff's DSA FAQ shows the company can
              operationalize new disclosure requirements for EU and UK monetization inventory, and its privacy-policy
              and S-1/A language indicate dedicated compliance staff, a DPO, data-processing agreements, and DPIA-style
              review processes. Its own incrementality material also shows management understands that privacy-era
              marketing requires more than last-touch attribution. Those are meaningful positives, because a company
              that ignored the post-IDFA world would likely already be losing relevance. The problem is that the
              mitigants are mostly process and preparedness signals rather than hard proof that Liftoff can sustain
              measurement quality, retain advertisers, defend publisher yields, and absorb geopolitical shocks while
              sponsors pursue liquidity. The company publicly defines retention metrics for core advertising, top
              advertisers, and top publishers, but the public evidence sampled here still does not disclose the values.
              Investors therefore need thesis-break triggers tied to monitorable events: any new Apple or Google policy
              change that removes signal or access, a material spread between private-mark valuation and public clearing
              price, legal action that broadens adtech consent requirements, or evidence that major budgets are shifting
              toward AppLovin, TikTok, Mintegral, or other scaled channels faster than Liftoff can offset. Until
              management closes those gaps with private diligence, residual risk remains high even if the platform
              remains strategically relevant.
