      - number: '5.4'
        title: Differentiation, technical risks, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Liftoff's core technical differentiation rests on three compounding advantages. First, the Vungle SDK
              footprint creates a first-party data moat: SDK-direct publisher integrations generate contextual signals
              (app genre, user behavior, device, placement) that flow into Cortex models before open-exchange
              competitors can access them. Second, the GameRefinery and AppRefinery intelligence layers provide
              differentiated audience and creative signals that most competing networks cannot replicate without similar
              acquisitions. Third, privacy-framework expertise — encompassing SKAN 4.0, ATT, and probabilistic
              attribution — positions Liftoff ahead of networks that have not invested in post-IDFA measurement.

              Against these strengths, several technical risks are material. The 10% CPI reduction attributed to
              GameRefinery micro-category data is a company-published result from a single internal experiment and has
              not been independently audited. The 10% fraud exclusion rate and 3-billion-device fraud-free database are
              self-reported. No public security certification (SOC 2, ISO 27001, or equivalent) is disclosed.
              Architecture depth — covering internal data pipeline design, model versioning, inference infrastructure,
              or DR/failover — is not described in public materials. Roadmap specificity is limited: Liftoff
              acknowledges Google's Privacy Sandbox on Android as a measurement shift to prepare for, but no public
              timeline or technical specification for that adaptation is available. These gaps are common for private
              AdTech companies, but they matter for diligence on platform reliability, security posture, and competitive
              durability.
            claimRefs:
