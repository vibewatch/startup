      - number: '2.5'
        title: Adoption constraints — privacy, regulation, and concentration
        blocks:
          - type: paragraph
            body: >-
              The mobile app performance marketing ecosystem faces four structural constraints that limit growth and
              create compliance overhead for all participants. The most consequential is Apple's App Tracking
              Transparency (ATT) framework, mandatory since iOS 14.5: apps must request explicit user consent before
              accessing the IDFA for cross-app tracking. Without consent, advertisers must rely on SKAdNetwork (SKAN),
              which provides aggregated, privacy-preserving postbacks rather than user-level attribution. SKAN 4.0
              (released with iOS 16.1) provides up to three time-windowed postbacks and coarse conversion values
              (low/medium/high), but low-spend campaigns receive minimal data granularity due to crowd-anonymity
              thresholds. Over one-third of app marketers remained unfamiliar with SKAN 4.0 in 2024, indicating
              persistent adoption lag.

              On Android, Google's Privacy Sandbox initiative aims to replace the Google Advertising ID (GAID) with
              privacy-preserving attribution APIs, paralleling iOS's trajectory. The implementation timeline remained in
              flux as of mid-2026, creating uncertainty for advertisers and network vendors dependent on GAID-based
              measurement. Apple also introduced AdAttributionKit at WWDC 2024 as a future attribution framework
              coexisting with SKAN, adding another layer of platform complexity.

              Regulatory constraints are significant in Europe. The EU's Digital Services Act (DSA), in effect from
              February 16, 2024, requires online advertising platforms to show real-time source information — advertiser
              name, targeting parameters — for every ad displayed to EU and UK users. Compliance requires both publisher
              and network-side implementation changes that add cost without commensurate revenue lift.

              Market concentration is a structural constraint on independent platform growth. With 88% of mobile app
              advertising budgets in Google and Meta, the independent channel pool of approximately $13 billion is
              finite and contested by AppLovin, Unity, Moloco, Mintegral, Digital Turbine, IronSource/Unity Ads,
              Chartboost, and Liftoff simultaneously. Downloads have been roughly flat at 136 billion annually since
              2020, limiting organic install-volume growth and driving CPM inflation as more budgets compete for the
              same install supply.
            claimRefs:
