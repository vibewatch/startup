      - number: '8.3'
        title: PE ownership changes the exit math, so scenario analysis matters more than a single comp
        blocks:
          - type: paragraph
            body: >-
              Blackstone's continuing majority position changes the valuation framework in two ways. First, the relevant
              question is no longer whether Liftoff could raise another venture round at a premium; it is whether
              sponsor-led monetization can occur at attractive enough terms for both Blackstone and any new minority
              buyer. Second, a sponsor-controlled company can sometimes look cheaper on paper than it is in practice
              because sell-down timing, secondary allocation, leverage, and preference economics all affect realized
              returns. The public record already shows that exit math is price-sensitive: Reuters and Renaissance both
              show materially lower 2026 IPO economics than the 2025 minority mark, and Reuters explicitly tied software
              valuation pressure to AI-disruption fears.

              That is why an LBO-style lens is useful even without a disclosed debt stack. At $741 million of revenue,
              Liftoff would generate about $111 million, $185 million, and $259 million of EBITDA at 15%, 25%, and 35%
              margin assumptions, respectively. The $4.3 billion private mark implies about 38.7x, 23.2x, and 16.6x
              EV/EBITDA across those cases; the $3.66 billion IPO high end implies about 32.9x, 19.8x, and 14.1x. Those
              are not distressed multiples, but they are high enough that financial engineering alone cannot do the
              work. A sponsor-backed buyer at $4.3 billion would need durable EBITDA expansion and multiple
              preservation, while a buyer closer to the IPO-reset range could underwrite a more conventional path where
              steady margin improvement closes the gap.
            claimRefs:
