      - number: '2.2'
        title: Market sizing — multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single published analyst produces a standalone sizing for "mobile app performance marketing" that
              isolates the UA and remarketing sub-market from broader mobile advertising. The most grounded lens uses
              first-party spend data: AppsFlyer reports global remarketing spend of $31.3 billion in 2025, representing
              29% of total mobile app marketing spend (UA plus remarketing). Solving for the total implies an aggregate
              mobile app performance marketing market of approximately $108 billion globally in 2025. This figure covers
              direct advertiser and agency spend across all channels, including the dominant Google and Meta channels.

              A broader lens is US digital advertising overall: SensorTower measured $137 billion in US digital ad spend
              in 2025 (up 12% year-over-year), with mobile being the largest single channel category. Globally, digital
              ad markets are roughly three times US scale, placing global digital advertising above $400 billion. Mobile
              captures approximately 50% of total digital ad spend globally, suggesting a global mobile advertising TAM
              in the range of $200 billion.

              A narrower lens — the relevant competitive battlefield for Liftoff — is the independent, open-internet
              mobile ad network segment. Moloco's August 2025 research (with Sensor Tower and Singular) found that 88%
              of consumer mobile app advertising budgets remain concentrated in Google and Meta. Applying this to the
              $108 billion estimate yields approximately $13 billion in independent-channel spend. Liftoff's $4.3
              billion valuation implies a meaningful but minority share of this independent layer.

              A forward-looking lens: IAP revenue globally reached $150 billion in 2024 (up 13% YoY) and Q2 2025 alone
              reached $41 billion (up 11.5% YoY), providing the consumer-spend pool that UA advertisers seek to reach.
              The global games market is estimated at $188.8 billion in 2025 by Newzoo, with mobile gaming at $103
              billion; this gaming-centric total represents a complementary demand signal for gaming-vertical UA spend.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM010
