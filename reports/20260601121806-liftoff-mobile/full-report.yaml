  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      A marketer's journey through the Liftoff platform begins with campaign setup in Accelerate, flows through
      Cortex-powered bidding on the Vungle Exchange, reaches users in publisher apps via the Vungle SDK, and loops back
      through measurement and creative iteration.
    data:
      nodes:
        - id: n1
          label: Campaign setup
          detail: >-
            Marketer sets KPI goal (ROAS, CPI, CPA, pLTV) in Accelerate and uploads creative assets or commissions
            Creative Studio.
          tone: neutral
        - id: n2
          label: Cortex bid optimization
          detail: >-
            Cortex AI selects placements, predicts conversion probability, sets bids, and chooses optimal creative per
            placement.
          tone: positive
        - id: n3
          label: Vungle Exchange auction
          detail: >-
            Accelerate bid competes in a programmatic auction on the Vungle Exchange; direct path avoids re-brokered
            traffic.
          tone: positive
        - id: n4
          label: Ad delivery via Vungle SDK
          detail: >-
            Winning bid delivers ad to user inside a publisher app running the Vungle SDK; ad formats include rewarded
            video, interstitial, and playables.
          tone: positive
        - id: n5
          label: Post-install attribution and measurement
          detail: >-
            MMP postback or SKAN postback returns install and event data; Liftoff's probabilistic attribution model
            estimates campaign pROAS under privacy constraints.
          tone: neutral
        - id: n6
          label: Creative and bid iteration
          detail: >-
            Performance data feeds back into Cortex for bid adjustment; Creative Studio iterates on top-performing
            assets to combat ad fatigue.
          tone: positive
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n2
    approximationNotes: >-
      Flow is inferred from official product pages and technical blog posts; exact internal bidding latency and routing
      logic are not disclosed.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE022
      - CE026
      - CE028
