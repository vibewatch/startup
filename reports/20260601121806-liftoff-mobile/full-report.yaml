      - number: '5.2'
        title: Cortex AI platform architecture and data flywheel
        blocks:
          - type: paragraph
            body: >-
              The Cortex AI platform is Liftoff's underlying ML infrastructure and serves as the shared computation
              layer for all five branded product lines. Official product pages describe Cortex as automating bid
              pricing, conversion modeling, data quality, and creative selection in real time, with direct integration
              into the bidding path between Accelerate (demand) and Vungle Exchange (supply). The data flywheel works by
              feeding proprietary SDK signals from Vungle SDK-enabled publisher apps back into Cortex's training data,
              creating an informational advantage over ad networks that rely solely on third-party exchange data.

              On the machine-learning side, Liftoff has published several technical blog posts documenting specific
              model innovations. A 2021 experiment fed GameRefinery's micro-category taxonomy into Accelerate ML models
              — grouping app inventory into behavioral clusters — and the resulting models achieved 10% lower CPIs for
              new-app-install campaigns. This is the most specific, quantified public proof of the Cortex data flywheel
              in operation. The probabilistic attribution framework developed through AlgoLift (acquired with Vungle)
              uses anonymous user-level in-app data, SKAdNetwork postback data, and deterministic MMP attribution from
              opt-in users to estimate campaign pROAS without relying on IDFA fingerprinting. Liftoff also supports SKAN
              4.0's four-digit source ID structure, coarse-grained conversion values, and three-postback windows for
              deeper iOS attribution.

              On the fraud prevention side, Liftoff processes more than 750 million bid requests per week and excludes
              more than 10% of those on suspicion of fraud via six distinct technologies: a 3-billion-device fraud-free
              database, Bid Blocker (which detects 10 types of suspicious bid requests), post-install optimization,
              dead-zone placement, click signing with AppsFlyer, and CPA optimization to weed out bot traffic. This
              layered approach reflects meaningful engineering investment, but public materials do not separately
              disclose false-positive rates, internal system architecture, or uptime SLAs.
