      - number: '8.2'
        title: Public comps and take-rate economics frame the real debate
        blocks:
          - type: paragraph
            body: >-
              Public comps show why Liftoff cannot be valued from one headline multiple. As of June 1, 2026, AppLovin
              traded around $198 billion of market cap on about $6.16 billion of trailing revenue, or roughly 32x sales,
              while The Trade Desk traded around $9.6-$10.7 billion on about $2.9-$3.0 billion of revenue, or roughly
              3.3x-3.6x sales, and Digital Turbine traded around $1.13-$1.14 billion on about $565 million of revenue,
              or about 2x sales. Damodaran's broader advertising dataset sat lower still at roughly 2.12x EV/sales.
              Liftoff's 5.8x observed 2025 mark therefore sits well below AppLovin's premium but above both lower-tier
              public comps and the broad ad-sector baseline. That makes the central question qualitative, not
              mechanical: is Liftoff structurally closer to premium, software-like adtech or to cyclical mobile ad
              intermediation?

              The best argument for a premium is operating quality and platform breadth. AppLovin's 2025 operating
              margin was extraordinary at roughly 75.8%, The Trade Desk posted about 20.4%, and Digital Turbine posted
              about 6.0% for FY2026. Liftoff's public materials disclose revenue but still do not disclose gross media
              spend, billings, take rate, or normalized EBITDA, so the market cannot observe where it belongs on that
              spectrum. That missing take-rate disclosure is the key valuation gap. If $741 million of revenue were
              earned at a 15%-30% take rate, implied gross media volume would be roughly $2.5-$4.9 billion, but that
              range is assumption-driven rather than disclosed. The valuation case therefore depends less on arguing
              over one precise comp and more on proving that Liftoff's blended monetization and user-acquisition engine
              can support margins materially above the generic advertising baseline.
