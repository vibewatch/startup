      - number: '4.3'
        title: Cost structure, gross margin drivers, and public-company benchmarks
        blocks:
          - type: paragraph
            body: >-
              Without financial disclosure, Liftoff's cost structure can only be estimated by analogy to public
              comparable platforms. In mobile programmatic advertising, the three dominant cost categories are traffic
              acquisition costs (TAC)—publisher revenue share payments that represent the single largest operating cost
              for demand-side platforms—compute and ML infrastructure costs, and headcount (engineering, data science,
              sales, and account management). TAC is the key gross-margin lever: platforms that own proprietary supply
              or have exclusive relationships can retain more margin per dollar of advertiser spend, while open-market
              buyers face more competitive and rising TAC.

              Public-company benchmarks illustrate the wide range of achievable economics. AppLovin reported full-year
              2025 revenue of $5.481 billion with adjusted EBITDA of approximately $4.512 billion, implying roughly 82%
              adjusted EBITDA margin—the high-water mark for scaled mobile ad tech. AppLovin's net income from
              continuing operations rose 116% year-over-year in 2025, demonstrating the operating leverage of a scaled,
              ML-optimized platform with strong proprietary supply integration. Digital Turbine, a smaller independent
              platform, reported fiscal 2025 revenue of $490.5 million with non-GAAP adjusted EBITDA of $72.3 million
              (approximately 14.7% margin) and a GAAP net loss of $92.1 million—illustrating that mid-scale independent
              ad tech faces significant cost absorption challenges. These two data points bracket Liftoff's likely
              economics: at $4.3 billion valuation and claimed "rapid growth," Liftoff is positioned closer to the
              AppLovin end of the quality spectrum in investor communications, but without disclosure, actual margins
              are unknown.

              Liftoff's estimated headcount of 501–1,000 employees per the 2024 Inc.com profile implies meaningful
              people costs. At industry-standard total compensation of $150,000–$250,000 per employee (blended across
              engineering, sales, and operations), a 750-person midpoint implies roughly $112–$188 million in annual
              people costs alone—a significant cost base that requires substantial revenue to cover. Infrastructure and
              ML inference costs for a platform processing billions of daily ad decisions add further operating
              expenditure. No capex, depreciation, or data center investment data has been disclosed.
            claimRefs:
              - CI017
              - CI018
              - CI019
              - CI020
              - CI021
              - CI022
          - type: table
            tableRef: TI003
            claimRefs:
