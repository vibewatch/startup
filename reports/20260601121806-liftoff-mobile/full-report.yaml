      - number: '7.3'
        title: Dependency concentration and sponsor-governance risk amplify execution pressure
        blocks:
          - type: paragraph
            body: >-
              Liftoff's platform risk is amplified by dependency concentration above and below the auction. Above it,
              Apple and Google control the operating systems, app stores, identifier policies, and many of the
              measurement surfaces that determine how much signal Liftoff can observe. Below it, Liftoff depends on
              advertisers continuing to spend, publishers continuing to monetize through ad-supported apps, and supply
              remaining healthy across direct SDK relationships and third-party aggregators. The latest S-1/A makes the
              capital-structure overlay explicit. Liftoff launched a 2026 IPO roadshow, but Blackstone would still
              control roughly half of voting power after the offering and the company would likely qualify as a
              controlled company under Nasdaq rules if majority control persists. That means public listing would not
              fully remove sponsor influence over governance, board composition, or timing priorities. The financing
              path also suggests valuation and liquidity tension: the 2026 IPO target of up to roughly $3.66 billion
              sits below the $4.3 billion figure highlighted in the 2025 General Atlantic minority-investment
              announcements. Combined with the company's own non-quantified claim of "significant growth," the public
              record points to a business being asked to prove durable post-merger scale, retention, and margin
              resilience while sponsors are actively moving toward liquidity. That combination makes measurement misses,
              competitive share losses, or platform-policy shocks more dangerous because they can collide with an exit
              process already in motion.
