  - id: FM003
    title: Buyer and user segment decision matrix
    type: matrix
    layout: wide
    summary: >-
      Five buyer segments differ in budget control, evaluation path, and primary friction; gaming developers uniquely
      straddle both buyer and seller roles.
    data:
      columns:
        - Direct App Advertiser
        - Mobile Game Developer
        - Agency
        - DSP
        - App Publisher
      rows:
        - label: Primary decision maker
          values:
            - Head of Growth / VP Marketing
            - Head of UA + Head of Monetization
            - Investment / Programmatic team
            - Trading desk / algorithm
            - Head of Monetization / Revenue
        - label: Budget source
          values:
            - App company P&L (growth budget)
            - Studio P&L (UA and yield budgets)
            - Client retainer + media fees
            - Client DSP fees
            - Ad revenue (net of network take-rate)
        - label: Primary buying trigger
          values:
            - ROAS shortfall on existing channels
            - Game launch / live-ops scale
            - Client mandate or audit
            - Supply expansion for RTB
            - Fill-rate or eCPM uplift
        - label: Key evaluation criterion
          values:
            - CPA / ROAS vs. benchmark
            - LTV prediction and game-vertical fit
            - Reporting transparency and white-label options
            - Bid win-rate and latency
            - SDK integration simplicity and mediation quality
        - label: Main friction / constraint
          values:
            - ATT attribution gaps, creative fatigue
            - Download saturation, SKAN complexity, rising CPIs
            - Manual insertion order process, limited programmatic flexibility
            - OpenRTB compliance, inventory fraud risk
            - DSA disclosure overhead, SDK proliferation fatigue
    approximationNotes: >-
      Segment roles generalized from Liftoff product descriptions, AppsFlyer survey data, and Chartboost mediation docs.
      DSP and publisher friction points are inferred from technical documentation and industry norms, not primary buyer
      interviews.
