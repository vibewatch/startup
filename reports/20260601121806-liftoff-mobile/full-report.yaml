      - number: '2.6'
        title: Sizing diligence gaps and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The market sizing analysis carries three material gaps. First, no independent analyst publishes a
              standalone estimate for "mobile app UA plus remarketing" as a distinct sub-segment; the $108 billion
              figure is derived from AppsFlyer's spend-share disclosure and may overcount by including walled-garden
              spend that is not addressable by independent networks. Second, the independent-channel estimate of
              approximately $13 billion is a residual derived from the 88% concentration figure sourced from Moloco's
              self-interested research; an independent corroborating estimate does not exist in the accessed sources.
              Third, Google's Privacy Sandbox Android deployment status as of mid-2026 is unknown from accessible
              sources (the privacy sandbox page returned a 404 error), creating measurement uncertainty for the Android
              portion of market sizing. These gaps should be addressed through primary research with MMPs (AppsFlyer,
              Adjust, Branch) and consultation with Liftoff management on their internal revenue-per-vertical breakdown.
            claimRefs:
              - CM003
              - CM010
              - CM035
              - CM042
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Non-gaming IAP surpassing gaming is the defining 2025 market event
            body: >-
              For the first time in Q2 2025, non-gaming app IAP revenue surpassed mobile gaming globally ($21.1B vs
              ~$20B). This structural shift broadens the UA buyer pool beyond game developers and creates new demand for
              performance marketing platforms with non-gaming vertical expertise. Platforms historically over-indexed on
              gaming (like Liftoff's Vungle Exchange) must demonstrate competitive non-gaming demand supply.
            calloutType: insight
            claimRefs:
              - CM007
              - CM012
              - CM023
          - type: callout
            title: 88% budget concentration in Google and Meta is a structural ceiling
            body: >-
              Moloco's August 2025 research found that 88% of consumer mobile app advertising budgets remain in Google
              and Meta. This concentration, if stable or growing, caps the total independent-channel SAM at
              approximately $13 billion globally — a finite pool contested by AppLovin, Unity, Moloco, Mintegral, and
              Liftoff simultaneously. If AppLovin's Axon AI platform continues taking share within this pool, Liftoff's
              addressable opportunity narrows further without a differentiated retention or non-gaming strategy.
            calloutType: risk
            claimRefs:
              - CM010
              - CM013
              - CM040
          - type: callout
            title: ATT and SKAN complexity constrain iOS optimization and customer trust
            body: >-
              Apple's ATT framework reduced user-level attribution fidelity on iOS, and SKAN 4.0's crowd-anonymity
              thresholds limit data granularity for low-spend campaigns. Over one-third of app marketers in 2024 were
              unfamiliar with SKAN 4.0 — meaning platforms that abstract SKAN complexity gain a competitive advantage,
              while those that require manual SKAN configuration face buyer friction. Google's GAID deprecation via
              Privacy Sandbox may replicate this constraint on Android, the higher-volume platform.
            calloutType: risk
            claimRefs:
              - CM031
              - CM033
              - CM037
              - CM038
          - type: callout
            title: Remarketing growth and retention economy favor full-stack platforms
            body: >-
              Remarketing's share of app marketing spend rose from 25% to 29% in one year (+37% in absolute spend to
              $31.3B). Platforms that serve both UA and re-engagement under a unified Cortex AI model — as Liftoff
              claims with Accelerate — are better positioned in a "Retention First" environment than point-solution
              UA-only networks, because the same audience graph and bid model serves acquisition and retention
              objectives.
            calloutType: strength
            claimRefs:
              - CM002
              - CM028
              - CM029
          - type: callout
            title: Independent channel SAM estimate assumes stable Google/Meta concentration
            body: >-
              The $13 billion independent SAM estimate assumes 88% concentration in Google and Meta persists through
              2026. If regulatory action (DSA, antitrust), consumer sentiment, or algorithm failures shift even 5
              percentage points of budget out of walled gardens, the SAM expands by approximately $5–6 billion. This
              sensitivity is not reflected in base-case sizing and represents material upside risk to independent
              platform market share projections.
            calloutType: assumption
            claimRefs:
              - CM010
              - CM036
              - CM040
  - number: 3
    title: Competitors
