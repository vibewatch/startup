      - number: '5.3'
        title: Deployment, integration, and trust controls
        blocks:
          - type: paragraph
            body: >-
              The Vungle SDK is the primary integration point for publishers: available for iOS, Android, Windows, and
              Amazon Fire, it is described as lightweight, easy to integrate, and designed for developers of all skill
              levels. Version 7.6+ introduced in-app bidding across more ad formats and an updated ad delivery
              mechanism. In-app bidding allows a unified real-time auction to replace manual waterfall optimization, and
              the Monetize platform integrates with all major mediation partners including ironSource, MAX, and other
              leading mediation stacks. Liftoff's ROAS Optimization product sends postbacks via MMPs (mobile measurement
              partners), confirming integration with MMP data pipelines such as AppsFlyer and Adjust.

              On the demand side, Accelerate buys inventory programmatically via major ad exchanges and separately via
              the direct Accelerate-to-Vungle-Exchange buying path, which avoids re-brokered traffic and is cited as
              covering approximately 80% of unique impressions on the Vungle exchange. Liftoff claims its account,
              creative, product, and engineering teams provide personalized service to advertisers.

              On privacy and compliance, Liftoff's EU Digital Services Act FAQ confirms full compliance as of February
              16, 2024, providing DSA-compliant ad disclosure (advertiser name, targeting parameters, clickable privacy
              icon) for all EU and UK inventory served through Monetize. Liftoff's privacy policy documents data
              collection across device identifiers, IP addresses, app usage, and ad interaction events. A published
              Modern Slavery Statement for the EMEA entity demonstrates legal compliance in that jurisdiction. The
              company states it does not use IP-based fingerprinting for probabilistic attribution, remaining within
              Apple's App Tracking Transparency terms of service. No public SOC 2, ISO 27001, or other security
              certifications are disclosed, and no incident history or SLA commitments are published on a public status
              page.
