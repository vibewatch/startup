      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Three co-founders established Liftoff in 2012. Mark Ellis served as CEO from founding through the 2021
              Vungle merger and into the combined entity's initial operating period. Phil Crosby contributed early
              product and data-visualization expertise and currently holds the title of Co-Founder and Executive Product
              Advisor. Harry Robertson provided the founding engineering and machine-learning architecture and currently
              serves as Co-Founder and Executive Technical Advisor, overseeing the performance technology roadmap. Their
              continued advisory presence inside the company gives the founding vision operational continuity even as
              the executive helm has transitioned.

              Jeremy Bondy became CEO in May 2022, having first joined as President following the October 2021 merger
              close. Before the merger Bondy led Vungle as its CEO beginning in 2020, where he built a unified strategy
              across eleven global offices, maintained a publisher base of more than 100,000 active apps and an
              advertiser base of over 4,500 companies, and spearheaded inorganic growth including acquisitions of
              AlgoLift, GameRefinery, TreSensa, and JetFuel. His operational track record on both sides of the mobile
              marketing ecosystem makes him a well-matched leader for the combined platform. The current executive team
              includes Tarek Kutrieh as President and CFO (formerly CFO at VCA Animal Hospitals and finance roles at
              Activision Blizzard and McKinsey), Andre Tutundjian as COO, Susan Hansen as General Counsel (since August
              2018), Scott Silverman as CRO (co-founder of AerServ, sold to InMobi), Bo Chen as SVP Engineering, and
              Andry Supian as SVP Product.

              Key-person concentration is meaningful: Bondy is simultaneously the board-facing leader for both
              Blackstone and General Atlantic and the operational driver of the Cortex AI strategy. The company has not
              publicly disclosed full board composition, governance documents, or leadership contract terms, which are
              standard diligence items for a Blackstone-backed private company at this capitalization level.
