  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Accelerate and Monetize are the most mature and evidence-supported products; Intelligence and Direct show
      meaningful differentiation but thinner independent validation; Creative Studio is strong on creative ML but
      lighter on independently audited outcomes.
    data:
      columns:
        - Market maturity
        - Technical differentiation
        - Independent validation
        - Privacy-framework readiness
        - Diligence gap severity
      rows:
        - label: Accelerate
          values:
            - label: strong
              tone: positive
              detail: Core product since founding; multiple case studies and verticals.
            - label: strong
              tone: positive
              detail: Cortex AI, GameRefinery taxonomy, Vungle direct path.
            - label: medium
              tone: neutral
              detail: Delivery Hero incremental tests and Casumo case published; CPI claims not independently audited.
            - label: strong
              tone: positive
              detail: SKAN 4.0, ATT compliance, and probabilistic attribution documented.
            - label: medium
              tone: neutral
              detail: Architecture, model accuracy, and bid infrastructure uptime undisclosed.
        - label: Monetize
          values:
            - label: strong
              tone: positive
              detail: 150,000+ app SDK footprint; 93% of top 100 games.
            - label: strong
              tone: positive
              detail: SDK-direct supply advantage; in-app bidding; cache optimization.
            - label: medium
              tone: neutral
              detail: Cashwalk case shows revenue uplift; eCPM gains not independently measured.
            - label: strong
              tone: positive
              detail: DSA compliance; iOS/Android/Windows/Amazon coverage.
            - label: medium
              tone: neutral
              detail: Publisher eCPM performance and fill rate improvement claims need audit.
        - label: Vungle Exchange
          values:
            - label: strong
              tone: positive
              detail: Established programmatic exchange with direct SDK integrations.
            - label: medium
              tone: neutral
              detail: SDK-direct advantage is real but auction mechanics are not publicly documented.
            - label: low
              tone: warning
              detail: No independent exchange transparency report or fill-rate benchmark.
            - label: medium
              tone: neutral
              detail: DSA-compliant for EU/UK; Privacy Sandbox Android roadmap undisclosed.
            - label: material
              tone: warning
              detail: Exchange performance metrics, auction transparency, and publisher win rates are undisclosed.
        - label: Intelligence
          values:
            - label: medium
              tone: neutral
              detail: GameRefinery acquired 2021; AppRefinery is newer; Ubisoft is a named customer.
            - label: strong
              tone: positive
              detail: Proprietary motivational frameworks and analyst-curated game feature database.
            - label: medium
              tone: neutral
              detail: Ubisoft case study published; quantified revenue impact not disclosed.
            - label: low
              tone: warning
              detail: Intelligence product itself is less directly affected by SKAN/ATT than UA products.
            - label: material
              tone: warning
              detail: Subscription pricing, customer count, and data freshness SLAs not disclosed.
        - label: Creative Studio
          values:
            - label: medium
              tone: neutral
              detail: Offered as a managed service; ML-powered creative iteration documented.
            - label: strong
              tone: positive
              detail: Impression-to-install ML for creative selection; exclusive Vungle Exchange ad formats.
            - label: low
              tone: warning
              detail: No independently audited creative performance benchmarks.
            - label: medium
              tone: neutral
              detail: Ad format compliance with ATT and DSA is managed through Accelerate and Monetize layers.
            - label: material
              tone: warning
