            title: Apple ATT is a structural constraint on device-level mobile ad targeting
            body: >-
              Apple's App Tracking Transparency framework, mandatory since iOS 14.5, requires user opt-in before apps
              can track device identifiers for advertising. This materially constrains device-level targeting for
              performance marketing platforms including Liftoff, pushing the industry toward probabilistic, contextual,
              and on-device signal models. Liftoff's privacy-friendly positioning and Cortex AI investment are partly a
              strategic response to this constraint, but the underlying targeting limitation is permanent unless Apple
              policy changes.
