companyProfile:
  summary: >-
    Liftoff Mobile is a Redwood City-based mobile advertising platform formed through Blackstone's
    2021 merger of Liftoff (user acquisition) and Vungle (in-app monetization). The combined entity
    supports more than 6,600 mobile businesses across performance advertising, exchange monetization,
    and creative services. In May 2025, General Atlantic took a minority stake at a $4.3 billion
    valuation, signaling continued investor confidence in scaled mobile adtech platforms.
  foundedDate: '2012-01-01'
  founders:
    - name: Mark Ellis
      role: Co-founder and former CEO
      background: Built Liftoff from founding through the 2021 Vungle merger and led the combined company until May 2022.
      claimRefs: [CO007]
    - name: Phil Crosby
      role: Co-founder and Executive Product Advisor
      background: Product-oriented co-founder with early iOS and data-visualization experience.
      claimRefs: [CO005]
    - name: Harry Robertson
      role: Co-founder and Executive Technical Advisor
      background: Technical co-founder who shaped the firm's machine-learning and performance technology roadmap.
      claimRefs: [CO006]
  foundingLocation: Redwood City, CA
  headquarters: Redwood City, CA
  productSummary: >-
    Three integrated products: Liftoff Performance (ML-driven user acquisition), Vungle Exchange
    (programmatic in-app advertising exchange), and Vungle Creative Studio (creative production and
    optimization), all supported by the Cortex AI platform.
  customerFocus: Mobile app developers and publishers across gaming, fintech, social, and utility apps
  businessModel: >-
