- id: operational-telephony-and-quality-risk
  title: Operational quality, telephony, and support risks can erode trust faster than ARR suggests
  body: 'The public adverse evidence clusters around operational friction, not around one isolated bug. Trustpilot complaints repeatedly cite cancellation difficulty, account-access problems, export corruption, disappearing outputs, and credits consumed on failed tasks. Cybernews and Deckary add a second layer: heavier tasks can burn through credits quickly, support responsiveness looks mixed, and exported presentations may require meaningful cleanup outside Genspark''s native interface. Voice and calling features widen the operational surface further. Realtime Voice launches background tasks during live voice sessions, Cybernews describes Call For Me as placing and storing AI-driven phone calls billed per second, and Genspark''s own privacy and SMS opt-in pages show that phone-number consent, STOP/HELP flows, and contact-specific opt-ins are part of the product design. The FCC''s AI-voice robocall ruling matters here because even if Genspark positions these features as convenience tools,
    voice automation now sits closer to regulated communications risk than to a harmless UI flourish.'
