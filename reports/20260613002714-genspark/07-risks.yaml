company:
  name: Genspark
chapter:
  number: 7
  title: Risks
summary: 'Genspark''s highest residual risks are not generic startup risks but trust-sensitive ones: a mismatch between zero-retention marketing and the privacy mechanics it actually discloses, intensifying copyright and GPAI regulation, telephony and voice-consent exposure, recurring billing/support complaints, and deep dependence on outside model, cloud, and discovery platforms. Enterprise controls such as SOC 2 Type II, ISO 27001, custom DPA/residency options, and SLA terms are meaningful mitigants, but the residual risk stack stays high until management can prove retention architecture, copyright-response readiness, telephony compliance, and complaint reduction with documentary evidence rather than marketing copy.'
sections:
- id: ranked-regulatory-legal-risks
  title: Regulatory, legal, and trust-claim risk is the top-severity stack
  body: 'Genspark''s most important risk is not simple feature competition; it is trust breakage created when ambitious AI marketing runs ahead of what the public control surface proves. The business page markets zero training, zero data retention, SOC 2 Type II, ISO 27001, and GDPR-in-progress positioning, while the privacy policy separately states that prompts and outputs may be processed through outside AI vendors, that data can live on Azure and other cloud platforms, and that account data is deleted within 30 days after closure rather than instantly. That does not mean the company is doing anything improper, but it does mean the public story is more conditional than the homepage slogans suggest. In parallel, copyright and GPAI rules are tightening: the U.S. Copyright Office says lawsuits over AI training are already widespread, while the EU AI Act now brings GPAI transparency and copyright duties into force on a defined timeline. Add FTC pressure on unsupported AI efficacy claims, and
    the result is a legal environment where any overstatement about accuracy, retention, or rights-handling can become a direct sales and diligence problem rather than a mere reputational one.'
