  rows:
  - - Data-retention and privacy-claim mismatch
    - Global enterprise + EU/US privacy scrutiny
    - Live risk
    - High
    - High
    - SOC 2 Type II, ISO 27001, custom DPA/residency options, and published privacy terms provide a starting control base
    - High until management reconciles zero-retention marketing with actual module-by-module retention and vendor-routing behavior
    - Request architecture memo defining retention, caching, logging, and provider routing for Chat, Deep Research, Call For Me, Realtime Voice, and enterprise tenants
  - - Copyright, training-data, and answer-distribution exposure
    - US + EU + publisher ecosystem
    - Live risk
    - Medium-High
    - High
    - DMCA process, claimed licensing intent, and fact-check tooling reduce some output risk
    - High because no public training-content summary, licensing inventory, or rights-escalation playbook is visible
    - Request copyright-risk memo, notice-and-takedown volumes, publisher agreements, and any GPAI training-summary preparation artifacts
  - - GPAI / AI Act transparency and copyright compliance
    - European Union and EU-facing enterprise sales
    - Emerging to live risk
    - Medium
    - High
    - GDPR is in progress and enterprise contracts offer DPA/residency support
    - Medium-High until the company shows how GPAI transparency, copyright, and deepfake obligations map to product modules
    - Request EU counsel memo, AI Act applicability matrix, and owner for GPAI transparency implementation
  - - AI telephony, SMS consent, and voice-automation compliance
    - United States calls, messages, and recorded interactions
    - Live risk
    - Medium
    - High
    - SMS opt-in flow, explicit STOP/HELP paths, and company privacy disclosures show basic consent mechanics
    - Medium-High because AI voice, recordings, and per-contact opt-ins still create TCPA and state-law execution risk
    - Request TCPA review, recording-consent logic by state, AI-voice labeling policy, and vendor contracts for calling infrastructure
  - - Consumer contract, refund, geoblocking, and termination friction
    - Global self-serve and team accounts
    - Live risk
    - Medium
    - Medium
    - Published terms and plan docs set expectations for billing, seat management, and enterprise ordering
    - Medium because adverse reviews show contract language does not by itself prevent account, refund, or login disputes
    - Request refund data, chargeback rates, complaint tracker, and geoblocking exception history
  notes: Rows are ordered by residual downside to an investor rather than by legal novelty; the biggest concern is evidence mismatch between broad trust claims and publicly documented mechanics.
  enumerationScope:
    coverage: partial
    basis: 'Covers the highest-severity legal and regulatory surfaces visible in public materials as of 2026-06-13: privacy/retention, copyright/GPAI, AI telephony, and customer contract friction.'
