- id: people-execution-and-kill-criteria
  title: Execution breadth and thin public leadership visibility require tight monitoring and explicit thesis-break triggers
  body: 'The company has already executed one major strategic reset by sunsetting AI search after passing five million users and reallocating toward a broader Super Agent and workspace thesis. That pivot may prove smart, but it also raises the bar for management depth because the company is no longer shipping one answer engine; it is shipping a stack that touches enterprise procurement, data governance, voice and telephony, content rights, support operations, and multi-vendor model orchestration simultaneously. Public documents still say little about the named bench beyond founders and product narratives, and they do not surface a public compliance owner, privacy lead, or copyright-response lead. That does not imply weakness, only opacity. For underwriting, the answer is discipline: insist on named owners, operating dashboards, and documentary control evidence. If the company cannot show those artifacts while continuing to widen scope, investors should treat the upside as real but the residual
    execution risk as too high to hand-wave away.'
