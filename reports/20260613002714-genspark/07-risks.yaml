  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-architecture
    missingEvidence: A feature-level retention and routing matrix covering Chat, Deep Research, Realtime Voice, Call For Me, SMS flows, logging, and enterprise tenants.
    whyItMatters: The top risk in the file is the gap between zero-retention marketing and the more conditional mechanics disclosed in privacy and legal documents.
    diligencePath: Request privacy architecture diagrams, DPA annexes, log-retention settings, subprocessors by feature, and sample enterprise privacy commitments.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR031
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: copyright-response
    missingEvidence: A copyright and GPAI compliance package showing training-data summary readiness, notice-and-takedown volume, publisher agreements, and escalation ownership.
    whyItMatters: Copyright and publisher-rights exposure is a top-tier residual risk and the public record does not show whether internal controls match the legal climate.
    diligencePath: Request outside counsel memo, rights-operations SOP, historical claim log, and any AI Act or GPAI implementation work products.
    relatedQuestionRefs:
    - QR008
    - QR009
    - QR010
    - QR031
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: telephony-compliance
    missingEvidence: A TCPA and recording-consent review for Call For Me, Realtime Voice, and SMS workflows, including state logic, script controls, and vendor responsibilities.
    whyItMatters: Voice, calls, and messages move Genspark into more regulated interaction surfaces than ordinary text-generation tools.
    diligencePath: Request counsel memo, dialer or vendor contracts, consent flows, recording notices, and complaint escalation history for call-related features.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR013
    - QR031
    relatedTableRefs:
    - TR001
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Public or confidential bridges from ARR to gross margin, support cost, compute cost, retention, and product-mix durability.
    whyItMatters: Rapid ARR growth is visible, but the sustainability of that growth is hard to judge without cost and retention evidence.
    diligencePath: Request cohort retention, support-ticket cost, compute cost by major feature family, and gross-margin bridge by self-serve versus enterprise usage.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: minor
    topic: leadership-bench
    missingEvidence: A current org chart showing leaders for compliance, privacy, legal/IP response, customer support, and platform operations.
    whyItMatters: The company is operating across more risk domains than the public leadership story makes visible.
    diligencePath: Request org chart, operating cadence materials, and named owners for the top five risks in this chapter.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
