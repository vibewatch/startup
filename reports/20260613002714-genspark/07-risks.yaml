- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Retention / privacy claim mismatch
    - Control-evidence package
    - Management cannot map zero-retention and zero-training claims to feature-level logging, caching, and provider-routing rules
    - Pause underwriting until the architecture memo and customer-contract language reconcile
  - - Copyright / GPAI exposure
    - Rights-governance readiness
    - No copyright escalation playbook, no training-content summary readiness, or repeated publisher disputes as EU duties tighten
    - Treat IP/compliance exposure as thesis-breaking rather than incidental legal noise
  - - Telephony / voice compliance
    - Consent and recording controls
    - No documented TCPA review, state consent logic, or AI-voice labeling standard for Call For Me / SMS / voice workflows
    - Remove telephony upside from the model and cap valuation credit for voice-led products
  - - Support / billing dissatisfaction
    - Complaint and SLA trend
    - Trustpilot-like complaints persist, chargebacks rise, or enterprise response-time promises are not being met
    - Assume weaker retention, lower expansion, and higher support cost than the ARR narrative implies
  - - Search / platform dependency
    - Acquisition efficiency and session share
    - Google AI Mode and AI Overviews keep absorbing research-like sessions while Genspark CAC or retention worsens
    - Cut growth assumptions and view the product as niche workflow software rather than broad answer-engine winner
  - - Execution breadth
    - Named owner and operating cadence
    - No visible leaders own privacy, rights, support, and platform operations as scope keeps widening
    - Treat management depth as insufficient for current complexity and avoid underwriting scope expansion
  notes: These are decision triggers, not descriptive concerns; each row is meant to tell an investor when to stop assuming that rapid growth outweighs unresolved risk.
