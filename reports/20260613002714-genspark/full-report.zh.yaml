      - number: '5.4'
        title: 差异化、信任控制与产品技术风险
        blocks:
          - type: paragraph
            body: >-
              Genspark 的主要差异化主张不是更好的模型访问，而是编排加完成品交付。Anthropic 的客户故事和 Genspark
              自己的页面指向同一逻辑：用户描述结果，智能体层在庞大的工具和模型清单中路由，系统返回完成的 artifact 或已执行的工作流，而不是草稿答案。这有助于解释公司为什么持续增加 Chrome
              自动化、Teams、Workflows、Realtime Voice 和 Claw
              等执行界面。因此，最强的差异化证据是结构性的：帮助中心深度广、多界面包装，以及合作伙伴佐证的故事——公司从僵硬搜索图转向自适应智能体。 [CE013] [CE018] [CE019] [CE026]
              [CE033] [CE034]


              信任与安全比营销文案更复杂。商业页面宣传 SOC 2 Type II 和 ISO 27001 认证，ISO 42001 和 GDPR 仍在推进。Team 和 Enterprise 文档也承诺模型训练退出、管理 /
              内容分离、自定义 DPA 和数据驻留选项。但隐私政策称，提示和输出可能被收集，第三方提供商可处理输入，账户数据在活跃期间保留且关闭后最多可再保留 30 天，多个云或模型供应商可能参与栈。Claw
              又增加运营风险，因为本地桌面模式只用软性的工作空间文件夹建议，而不是硬文件边界；Chrome 扩展和 TechCrunch 对早期搜索的报道也都提示，如果控制滞后于产品速度，自动化和安全可能漂移。 [CE026]
