      - number: '3.4'
        title: 负面竞争证据与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争证据是负面的，而不是宣传性的。Perplexity 的广告推出和浏览器扩张证明了野心，但 TechCrunch 和 Digiday
              都显示货币化仍未稳定：公司自己说，仅靠订阅不足以支撑可持续的出版商收入分成，营销人员也继续提到规模低、ROI 不清、品牌安全和 CPM 效率疑虑。更严重的是，Reuters 和 TechCrunch 记录了
              CNN 和 The New York Times 等出版商诉讼增加，包括 Perplexity 复制或重新包装受版权保护内容，甚至幻觉式标注来源的指控。Google
              的处境不同，但并不更干净。它规模无可匹敌，却在尴尬错误后不得不收紧 AI Overview 触发和护栏；Justice Department 的救济方案也明确指出，Google
              历史上的分发合同和搜索入口控制具有反竞争性。本章中 OpenAI 的风险不那么法律化，更偏结构性：ChatGPT search 很强，但它不像 Google、Microsoft、Perplexity Comet
              或 Dia 那样拥有浏览器默认入口。Glean 在企业耐久性上看起来最强，因为它的护城河是运营上下文、连接器、安全和工作流
              grounding；但即便如此，竞争压力也指向把核心检索商品化，并打包进更宽的工作栈。结论是，Genspark
              作为快速移动的工作空间挑战者有赢面，但除非证明自己拥有更强企业上下文、更强浏览器或分发入口，或能让用户停止多栖流失的团队工作流，否则护城河会很脆。
