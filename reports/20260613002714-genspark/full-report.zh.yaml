            body: >-
              最清晰的公开采用故事是快速铺开，而不是可量化的部署深度。Genspark 称，在 Team 和 Enterprise 计划于 11 月底发布后，已有 1,000
              多家组织开始使用其商业平台；多个后续报道重复这一说法，并把它与 North America、Europe 和 Asia 扩张联系起来。GetLatka 单独列出 Genspark 2026 年约 1K 客户和
              41 名员工。消费者和 prosumer 侧，iOS app 显示 3.4K 个评分、4.7/5；最初的 Product Hunt 发布当日排名第 2，获得 147 个 upvotes、46 条评论、114
              名关注者，以及 4 名发布用户给出的 5/5 评分。 [CU006] [CU010] [CU013] [CU014] [CU017] [CU020] [CU028] [CU029]


              这些信号证明 Genspark 已远超试点阶段，但没有给出投资人通常想看的分母。公司披露了 ARR 里程碑——9 个月内超过 $100M，11 个月内超过
              $200M——却没有把这些数字桥接到活跃席位、付费转化、企业 logo 数、产品 attach 或按 cohort
              留存。结果是，客户故事拥有强漏斗顶部和社区可见度，但很难看清有多少用户会变成持久、扩张、高价值账户。即便 Trustpilot 的负面页面在这个语境下也有用：37
              名公开评论者足以显示真实付费使用存在，但样本仍太小、选择偏差太强，不能替代流失数据。 [CU006] [CU009] [CU010] [CU013] [CU017] [CU020] [CU028] [CU029]
