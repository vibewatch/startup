  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：混合搜索、工作流与浏览器界面
        blocks:
          - type: paragraph
            body: >-
              证据已不支持继续把 Genspark 称为纯网页搜索创业公司，但也不支持把它当作又一个通用 copilot。第 1 章已经显示，管理层砍掉了一个 500 万用户的 AI 搜索产品，因为相较于更宽的 Super
              Agent 工作空间，固定工作流搜索在战略上显得过窄。这影响市场定义。最接近的付费预算池是企业搜索和工作 AI 软件，买方花钱是为了降低碎片化应用里的信息摩擦。最接近的分发池是消费级答案搜索，挑战者必须从
              Google、Bing 和 ChatGPT 手里抢注意力。第三个相邻层是正在出现的浏览器与智能体界面，Arc Dia 和 Perplexity Comet
              都显示，搜索、浏览和任务执行正在坍缩进同一个界面。因此，Genspark 应按混合市场边界估值，并明确纳入和排除项，而不是贴一个膨胀的 TAM 标签。
