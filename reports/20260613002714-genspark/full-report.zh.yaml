  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河或风险维度
      - Genspark 当前判断
      - 威胁
      - 证据
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 工作空间宽度
        - 中等
        - ChatGPT 和 Perplexity 也在从答案延伸到行动和工作流
        - 多个同业都在把搜索和执行打包，而不是停留在只给答案
        - 高
        - 衡量任务完成率、重复使用情况，以及用户是否依赖 Genspark 交付成品工作，而不是只拿零散答案
      - - 透明定价
        - 中等强度
        - 即便定价不透明，既有厂商也能靠相邻产品补贴 AI
        - Genspark 给出了清晰的席位方案，但 Google/Bing 免费，ChatGPT 则把搜索打包进更大的套餐
        - 中
        - 跟踪显性定价带来优势的企业赢单率，以及捆绑折扣压过定价透明度的场景
      - - 企业信任控制
        - 中等
        - Glean 和 OpenAI 在企业包装与控制表述上走得更远
        - Genspark 声称具备 SOC 2 和 ISO，但企业参考客户的广度比 Glean 更薄
        - 中
        - 要求提供客户留存、部署规模和安全审查周期证据
      - - 分发入口
        - 弱到中等
        - Google、Microsoft 和浏览器新进入者掌握默认入口或用户习惯入口
        - AI Overviews、Edge+Bing、Comet 和 Dia 都说明浏览器 / 搜索控制权很关键
        - 高
        - 明确 Genspark 是否推进浏览器扩展、OEM 分发或企业渠道合作
      - - 多工具并用压力
        - 反向
        - 用户能以低成本、低切换摩擦测试大量消费级 AI 工具
        - 多数前端竞争对手提供免费或低门槛入口，而文件和浏览器默认入口在别处
        - 高
        - 展示活跃用户集中度、工作空间留存，以及在 Genspark 内完成最终产出的比例
      - - 品类法律与变现风险
        - 反向但属外部因素
        - 出版商诉讼、广告质疑和反垄断补救措施都可能快速重塑格局
        - Perplexity 诉讼和 Google 补救措施说明，这个品类具有战略价值，但也不稳定
        - 中
        - 建模搜索导流经济、分发规则或内容访问规范变化的情景
