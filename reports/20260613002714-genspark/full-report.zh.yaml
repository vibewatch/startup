      - number: '2.2'
        title: 规模测算视角：使用规模、软件支出与收入代理
        blocks:
          - type: paragraph
            body: >-
              多个规模测算视角指向相同的战略方向，但使用的单位完全不同。注意力侧，SparkToro 显示 Google 每年仍处理超过 5 万亿次搜索；即便 AI 颠覆叙事已经成形，其类似搜索的量仍约为 ChatGPT 的
              373 倍。软件侧，IMARC 估算企业搜索 2025 年市场为 $6.7 billion，到 2034 年为 $14.5 billion，远小于全球网页搜索注意力池，但更接近可货币化的 B2B
              楔子。收入代理进一步支持这一点：Glean 达到 $100 million ARR 和 $7.2 billion 估值，说明企业检索加工作流 AI 即便在品类成熟前，也能产生大型私募市场结果。Google 的
              15 亿 AI Overview 用户和 4 亿 Gemini MAU 说明，现有巨头的 AI
              层在用户数上可以比独立挑战者快得多。正确解读不是某个数字正确、其他数字错误；而是每个视角都在衡量同一个演进中市场栈的不同部分。
