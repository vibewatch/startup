  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从快速增长叙事出发，经过披露与竞争两道过滤，落到“继续研究”的结论。
    data:
      nodes:
        - id: n1
          label: 叙事强度
          detail: 融资快速跃升，且公司自报收入运行率增长
        - id: n2
          label: 价格锚点
          detail: 接近 $1.6B 的当前公开估值标记
        - id: n3
          label: 披露缺口
          detail: ARR 质量、毛利率、NRR 和条款仍缺失
        - id: n4
          label: 竞争过滤
          detail: 捆绑式 AI 工作界面和搜索默认入口挤压定价权
        - id: n5
          label: 输出
          detail: 继续研究 / 偏高，等待尽调
      edges:
        - from: n1
          to: n2
          label: 支撑
        - from: n2
          to: n3
          label: 必须顶住
        - from: n3
          to: n4
          label: 难度来自
        - from: n4
          to: n5
          label: 导向
    claimRefs:
