      - number: '3.2'
        title: 能力广度与包装
        blocks:
          - type: paragraph
            body: >-
              能力重叠真实存在，但各类竞争对手的包装差异很大。Genspark 对团队计划买到什么说得异常明确：多席位访问、集中管理、SSO/SAML、积分、存储和宽泛的内容生成模块。Perplexity
              正从答案引擎同时转向两个相邻包装：一个声称能为组织调动 20 个先进模型的企业系统，以及一个把浏览会话变成任务的浏览器。ChatGPT
              把搜索装进更大的工作界面，配有应用集成、商业管理和企业控制；它很危险，因为用户不必单独购买搜索产品，就能得到搜索加执行。Bing 把带引用的摘要答案直接放进 Microsoft 搜索栈，再用 Edge
              分发强化。Google 的包装更难拆开，因为 AI Overviews 和 AI Mode 嵌在庞大装机基础的默认搜索行为里。Glean 是企业 grounding 的标杆：其 work-AI
              平台结合搜索、企业知识图谱上下文、模型选择和 100 多个连接器。You.com 当前公开包装对这个品类更有启发：它把网页搜索、页面抽取和研究 API
              按基础设施定价，说明部分买方可能更愿意在搜索轨道上组装智能体工作流，而不是授权一个有品牌的助手。对 Genspark
              来说，透明定价有帮助，但当对手能把答案、企业数据或浏览器控制打包进相邻产品时，广度本身不是护城河。
