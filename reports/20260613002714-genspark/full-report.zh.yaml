        title: 资本充足性、证据缺口与结论
        blocks:
          - type: paragraph
            body: >-
              因此，资本充足性更容易做方向性判断，而不是精确测算。公开融资年表指向一家资本充足的公司——2025 年 11 月按 $1.25B 估值融资 $275M，2026 年 1 月补到 $300M，随后 2026 年 3
              月 Series B 扩展至 $385M、估值约 $1.6B。Tracxn 汇总称其五轮累计融资 $545M，而 Latka 仍显示三轮 $435M，融资年表对账本身就是尽调任务。公司称 2026 年 3
              月资金将用于 Claw 和 Cloud Computer 扩容，这与一个可能先提高基础设施支出、再改善毛利结构的策略一致。缺失的仍是核心承销数字：账上现金、月度烧钱、现金跑道、递延收入、GAAP
              确认政策、各计划实际 ARPU、NRR、流失率和客户集中度。因此，财务结论是混合的。Genspark
              有可信的收入动能和宽货币化面，但在管理层披露真实毛利率和现金跑道数据前，应把它视为高增长、但仍受基础设施敏感性和融资依赖影响的公司。
