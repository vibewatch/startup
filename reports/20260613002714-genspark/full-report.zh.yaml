      - number: '4.3'
        title: 成本结构、毛利驱动与单位经济
        blocks:
          - type: paragraph
            body: >-
              最大的承销问题不是收入需求，而是利润质量。Genspark 现在捆绑或路由 70 多个模型，其页面也显示了明确的成本承担活动：记笔记按分钟计费，付费用户可无限生成图片，视频生成使用 14
              多个底层模型且各模型积分成本不同，AI Sheets 拉取外部金融和网页数据，Cloud Computer 增加专属的每用户基础设施。公开可比公司让风险更具体。Google Cloud 公布了 Gemini 的
              token 定价，并对搜索密集型工作流另收 grounding 费用；Microsoft FY2025 10-K 称，由于扩张 AI 基础设施，Microsoft Cloud 毛利率降至 69%，持续 AI
              基础设施投资可能压低经营利润率。Andreessen Horowitz 同样观察到，许多 AI 应用公司毛利率只有 50–60%，因为推理成本仍很重。对 Genspark
              来说，这不能证明某个具体毛利率数字，但足以说明，不能只把标价当成软件式经济性的证据。公开矛盾还加重了这一点：不同来源对员工数、累计融资和合规状态都有分歧。
