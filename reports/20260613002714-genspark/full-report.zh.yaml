      - number: '6.4'
        title: 留存、满意度与耐久性缺口
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据是混合的，而且明显弱于采用证据。正面信号存在：Product Hunt 评论者描述了节省时间和有用的结构化研究输出；iOS app 在 3.4K 个评分中获得 4.7/5；Cybernews
              认为该平台最适合需要打磨、结构化输出的创作者、营销人员和研究者。这些信号说明至少部分用户获得了重复价值。Team 和 Enterprise
              材料也显示了支撑持久账户的基础设施——成员管理、分析、连接器和企业支持——即便这些功能本身不能证明续约。 [CU015] [CU017] [CU023] [CU033] [CU034]


              负面侧无法忽视。Trustpilot 2026 年 2 月归档页面显示，Genspark 在 37 名客户中评分为
              1.9/5，反复投诉包括取消流程摩擦、导出损坏、失败任务仍消耗积分、支持无响应；一名企业买方明确表示，账户登录限制让付费计划无法用于团队共享。Product Hunt 的评论摘要，以及 Cybernews 和
              Deckary 的独立文章，也警告幻觉、来源支撑、定价不透明、导出清理、账单或支持问题。最重要的是，没有公开来源披露 NRR、GRR、流失率、续约率、活跃席位留存或 cohort
              耐久性。因此，本章能支持真实使用结论，但不能支持完全承销过的耐久性结论。 [CU016] [CU020] [CU021] [CU022] [CU024] [CU025] [CU026] [CU040]
