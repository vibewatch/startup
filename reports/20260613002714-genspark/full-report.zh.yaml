        - 显示工作空间转向之后的第一个清晰后期资本锚点
        - 高 – 公司、Forbes 和 Tracxn 佐证
        - 确认准确交割日期、资金用途和投资人权利
      - - Series B 追加 / 延伸
        - 到 2026 年 1 月为 $300M；到 2026 年 3 月约 $1.6B 估值下为 $385M
        - 产品范围从工作空间扩展到 Cloud Computer / Claw 时，公司仍在募资
        - 高 – 多个新闻和数据库来源佐证
        - 对齐时间线、工具条款和任何分批交割机制
      - - 累计融资
        - Tracxn 显示五轮 $545M；Latka 仍显示三轮 $435M
        - 公开数据库尚未完全一致，这会影响股权结构表和现金跑道分析
        - 中 – 二手来源相互冲突
