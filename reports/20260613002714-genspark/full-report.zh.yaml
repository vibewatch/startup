  - id: TM005
    title: 矛盾和尽调缺口表
    columns:
      - 信号
      - 乐观解读
      - 矛盾证据或缺口
      - 重要性
    rows:
      - - AI 搜索叙事庞大
        - AI 界面显然在改变用户行为
        - 按可比搜索量看，Google 仍远远大于挑战者
        - 叙事再大的市场，挑战者仍可能很难变现
      - - 企业搜索得到验证
        - Glean 证明该品类可支撑 $100M+ ARR 和数十亿美元估值
        - 公开数据仍无法拆出 Genspark 的付费席位楔子或留存
        - 估值不应默认 Genspark 自动继承 Glean 的经济模型
      - - 广告市场可选项
        - Perplexity 和 Google 正在 AI 答案内测试广告和购物
        - 广告主仍提到规模小、ROI 不确定、品牌安全和 CPM 顾虑
        - 消费者使用量不会自动转化为高利润广告收入
      - - 浏览器智能体前沿
        - Comet 和 Dia 显示界面正转向行动优先体验
        - Genspark 尚未公开披露浏览器原生或分发控制策略
        - 界面迁移可能帮助 Genspark，也可能绕开它，取决于产品路线图
      - - 混合定位
        - Genspark 可以同时指向消费者发现和企业工作流价值
        - 没有公开 SAM/SOM 拆分或转化数据，把这两条路径连起来
        - 本章剩余最大风险是战略过宽，而不是没有需求
    notes: 本表保留矛盾，而不是强行给出虚假的精确性；若干最重要的市场变量目前 Genspark 尚未披露。
