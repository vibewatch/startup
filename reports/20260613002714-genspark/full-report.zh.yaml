      - number: '1.5'
        title: 信任控制与负面背景
        blocks:
          - type: paragraph
            body: >-
              公开层面，Genspark 正试图把激进的产品速度和企业信任信号放在一起。商业页面宣传 SOC 2 Type II 和 ISO 27001 认证，隐私政策则列出 Microsoft Azure，以及
              OpenAI、Anthropic、Google、xAI、ElevenLabs 等主要模型供应商。这些披露支撑了基础设施越来越适合企业的叙事。但第一代搜索产品也暴露过早期警讯。TechCrunch 记录称，2024
              年引擎可能在凶杀查询下推荐武器，缺少举报问题 Sparkpages 的机制，内容授权经济也悬而未决。即便产品后来下线，这一点仍重要，因为它说明 Genspark
              的速度可能跑在治理和安全控制前面。因此，投资人应把当前信任声明解读为进展，而非执行风险已消除的证明。公司 2026 年看起来比发布时成熟，但尽调案例仍取决于治理和运营控制是否跟得上增长。
            claimRefs:
