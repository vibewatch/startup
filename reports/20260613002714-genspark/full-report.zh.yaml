  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和信任声明风险是最高严重度的组合
        blocks:
          - type: paragraph
            body: >-
              Genspark 最重要的风险不是简单的功能竞争，而是激进 AI 营销跑在公开控制面证明之前所造成的信任断裂。商业页面宣传零训练、零数据留存、SOC 2 Type II、ISO 27001 和 GDPR
              进行中；隐私政策又单独说明，提示词和输出可能经由外部 AI 供应商处理，数据可存放在 Azure 和其他云平台，账户关闭后 30
              天内删除账户数据而不是即时删除。这并不意味着公司做法不当，但确实说明公开叙事比首页口号更有条件。与此同时，版权和 GPAI 规则在收紧：美国版权局称 AI 训练相关诉讼已经普遍存在，欧盟 AI Act
              也已按明确时间表让 GPAI 透明度和版权义务生效。再叠加 FTC 对缺乏依据的 AI 功效声明施压，法律环境的结果就是：任何关于准确率、留存或权利处理的夸大，都可能从声誉问题变成直接的销售和尽调问题。
