  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、巨头、相邻浏览器与替代品
        blocks:
          - type: paragraph
            body: >-
              Genspark 已不再只和 AI 搜索创业公司竞争。其官方材料现在把它包装成一体化 AI 工作空间，覆盖研究、幻灯片、图片、视频和团队管理；创始人评论也确认，公司有意砍掉 500 万用户的 AI
              搜索产品，因为固定工作流搜索显得战略过窄。这把 Genspark 放进了一个混合战场。Perplexity 仍是答案搜索加行动上的最近直接同业，尤其是在推出 Comet 和更宽企业产品之后。ChatGPT
              Search 是研究和综合整理的直接替代品，但 OpenAI 越来越像通用工作界面，而不是只做搜索的工具。Google 和 Bing 是答案引擎巨头，其分发规模仍远大于任何挑战者，Google 还在 Search
              内直接加入 AI Mode。Glean 是最清晰的企业类比，因为它把企业搜索做成了更宽的 Work AI 平台，并拥有强采用和安全定位。You.com
              现在更像面向智能体构建者的搜索基础设施，而不是前端消费竞争者；Dia 和 Arc 则说明，浏览器本身可能成为研究和行动工作流的控制点。因此，Genspark
              的竞争问题不只是能否击败某个答案引擎，而是能否同时在搜索、工作空间和浏览器中介任务执行三条线上维持差异化。
