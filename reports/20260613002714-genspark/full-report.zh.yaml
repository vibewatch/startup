      - number: '6.5'
        title: 扩张路径、采购摩擦与集中度不透明
        blocks:
          - type: paragraph
            body: >-
              Genspark 最显眼的扩张动作，不是传统模块增购指标，而是产品面和席位面一起铺开。用户可以从自助套餐起步，在网页或移动端计费里升级，转入可邀请成员、集中管理的 Team 方案，再升级到
              Enterprise，拿到定制合同、数据驻留和 SLA 支持。平台也靠多种工作界面在同一客户内部加深：AI Slides 和 AI Sheets 切入演示与分析流程，Speakly 提供语音入口，Chrome
              扩展增加浏览器内自动化，Claw 则把工作带进 Slack、Teams、WhatsApp、LINE 和
              Telegram。日本扩张配套本地客服和客户成功资源，也是一个可见的扩张杠杆，因为它降低了大客户的本地化和上手摩擦。[CU003] [CU004] [CU011] [CU012] [CU030] [CU031]
              [CU032] [CU033] [CU034] [CU036] [CU037] [CU043] [CU044]


              难点在客户集中度和收入质量。公开资料从未披露「1,000 家组织」说法中有多少企业客户、ARR
              中消费者或准专业用户订阅与团队及企业客户各占多少，也没有披露任何具名客户的贡献。即便是具名验证，本身也偏薄，一个旗舰客户看起来可能比实际重要。围绕额度、计费、支持和导出质量的公开评价摩擦，也意味着部分扩张尝试可能在变成稳定高价值账户前就卡住。采购观感总体有利——DPA、数据驻留、VPC、SLA、SSO
              和管理控制都存在——但集中度、套餐结构和账户扩张大多仍不透明。[CU006] [CU020] [CU021] [CU033] [CU034] [CU039] [CU041] [CU042] [CU044]
