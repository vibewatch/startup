        - 公开标价为每席位每月 $30，包含 12,000 credits 和每席位 60 GB
        - 相对其他收入流较高：透明的经常性席位收入
        - 要求提供实际付费席位数、扩张率和分队列折扣情况
      - - Enterprise Plan
        - 销售协助合同，价格和条款协商确定
