      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              当搜索痛点和工作产出绑定时，买方证据最强。Gartner 和 CIO Dive 显示，普通桌面工作者现在要跨 11 个应用工作，近半数人难以找到完成工作所需的信息。这形成清晰的企业问题陈述：预算所有者通常是
              IT、数字工作场所、运营或业务职能负责人，他们想减少上下文切换、加快任务完成；终端用户则是在应用蔓延中工作的知识工作者。Glean
              的客户增长，以及异常高的查询和参与指标显示，当搜索嵌入日常工作后，使用频率可以像消费搜索，同时仍落在企业软件预算内。企业之外，早期采用者很可能是重度研究的 prosumer
              或个人，他们看重更快的综合整理，但这一人群本身并不能证明持久货币化。对 Genspark 来说，现实采用路径很可能是先靠自助式消费发现，再在工作流模块和信任控制足以支撑预算转移的地方，做按席位企业扩张。
