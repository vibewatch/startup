  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性倍数区间
      - 示例公允价值区间（USD B）
      - 概率信号
    rows:
      - - 乐观
        - $200M 年化运行率大多是经常性 ARR，留存强，工作流宽度带来真实切换成本
        - 12x-16x
        - 2.4-3.2
        - 需要尽调验证质量，但上行真实存在
      - - 基准
        - 收入质量有混合成分但仍有意义，公司能被看作强 AI 赋能软件平台
        - 7x-10x
        - 1.4-2.0
        - 按今天的叙事看方向上说得通，但证据仍不足
      - - 基准偏下
        - 头部运行率高估了可重复 ARR 或利润率质量，因此市场采用普通 SaaS 出清区间
        - 5x-7x
        - 1.0-1.4
        - 如果尽调只是还可以、不是很好，这是最可能的压缩路径
      - - 悲观
        - 收入质量弱于宣传，捆绑型竞争对手限制定价权，同时云成本仍然沉重
        - 3.5x-5x
        - 0.7-1.0
        - 如果公司本质上更像套壳应用或重基础设施应用，下行会出现
    notes: 这些区间把简单收入倍数计算套到公司自报的 2026 年 3 月 $200M 年化运行率标记上；由于公开证据没有披露经审计 ARR、利润率或轮次条款，结果只作示例。
    claimRefs:
      - CV007
      - CV018
      - CV019
      - CV021
