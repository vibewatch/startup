    title: 公司概况
    sections:
      - number: '1.1'
        title: 创立、身份与当前定位
        blocks:
          - type: paragraph
            body: >-
              Genspark 2023 年起步，是一家 AI 原生搜索创业公司，创始人此前已在大型搜索平台深耕多年。TechCrunch 的发布报道把公司定义为新的答案引擎玩家，能从网页内容生成单页
              Sparkpages；但现在官方页面已把业务定位拉宽为一体化 AI
              工作空间。这个转向很关键：公司不再只卖更好的搜索结果，而是在研究、幻灯片、电子表格、媒体和语音界面里交付完成品。公开公司材料也显示，MainFunc 和 Genspark 实体支撑着这项服务，比典型隐身 AI
              创业公司有更清晰的法律足迹。截至本次报告日期，最稳定的身份事实是：Genspark 总部位于 Palo Alto，围绕 Genspark.ai 产品界面搭建，在公司材料中仍保留 MainFunc
              品牌。主页、站点地图和产品页也显示，公司服务的是多语言受众，而非单一美国细分市场。
            claimRefs:
