      - CV052
      - CV053
      - CV054
  - id: TV005
    title: 投资逻辑破裂与止损触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 质量破裂
        - 经验证 ARR 或等价经常性收入明显低于 $140M
        - 当前价格无法再通过有纪律的溢价区间
        - 除非入场价重置，否则转为回避
      - - 利润率质量低于预期
        - 毛利率更接近重基础设施 AI 套壳，而不是高溢价软件
        - 即使增长仍强，溢价倍数逻辑也会削弱
        - 按较低的上市软件区间重新切估值
      - - 留存偏弱
        - NRR 和总留存率未能证明工作流嵌入足够持久
        - 护城河论证减弱，分发风险上升
        - 要求更陡折扣或暂停
      - - 轮次条款保护投资人
        - 优先权、结构或老股交易占比压低普通股上行
        - 头部估值高估新资金的经济收益
        - 不要只看估值标记；重新承保所有权结果
      - - 捆绑竞争胜出
        - OpenAI、Microsoft、Google 或同业在默认入口中拿下同一工作流
        - 定价权和获客效率快速压缩
        - 假设长期倍数更低、增长更慢
    notes: 这些变量数量最少，却最能迅速把 Genspark 从高溢价 AI 候选标的推向估值过高的叙事股。
    claimRefs:
      - CV024
      - CV029
      - CV041
      - CV042
      - CV043
      - CV053
      - CV054
      - CV057
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经常性 ARR 桥接
        - 经审计拆分真实 ARR、使用量收入、促销或一次性收入
        - 决定公司是否有资格享受高溢价 AI 原生倍数
        - 管理层数据室加 CFO 讲解
      - - 按产品拆分毛利率
        - 工作空间、企业版和 Cloud Computer 产品的毛利率
        - 区分软件杠杆和基础设施拖累
        - 财务尽调加 COGS 拆解
      - - NRR 和集中度
        - 留存、扩张和头部客户集中度
        - 检验使用是否有黏性，还是仍处于试验阶段
        - 客户队列复盘和董事会材料
      - - 轮次机制
        - 2026 年 3 月价格、优先权、老股交易占比和投资人保护
        - 决定头部估值是否反映普通股经济收益
        - 领投方律师和股权结构表复盘
      - - 附着率和赢单 / 输单数据
        - Cloud Computer 渗透率、企业版附着率，以及输给 OpenAI、Microsoft、Google 或 Perplexity 的案例
        - 显示产品宽度是真护城河，还是功能铺摊子
        - 产品分析加商业尽调
    notes: 这些尽调要求都不是装饰；每一项都可能显著移动可比估值区间，进而改变入场价格。
    claimRefs:
      - CV013
      - CV038
      - CV053
      - CV054
      - CV057
