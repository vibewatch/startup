      - number: '5.3'
        title: 部署、集成、管理控制与可靠性姿态
        blocks:
          - type: paragraph
            body: >-
              Genspark 的部署模式刻意做成多界面。下载和帮助页面指向 web、desktop、iPhone、Android、Apple Watch、Chrome、Microsoft Office、Google
              Workspace，以及浏览器原生 AI Browser。Claw 可以作为 24/7 云实例运行，配有专属 CPU、内存、存储和固定 IP；也可以用本地桌面模式，调用客户自己的机器。Workflows 和
              Claw 都暴露出很深的连接器覆盖：Google 和 Outlook 邮件 /
              日历、Slack、Teams、Notion、Salesforce、GitHub、Zoom、Stripe、Jira、Figma、Crunchbase、SimilarWeb
              等第三方服务直接出现在公开文档中。这说明公司在优化嵌入式工作流存在感，而不是单一目的地 app。 [CE011] [CE022] [CE023] [CE030] [CE034]


              公开可靠性证据是混合的。Team 和 Enterprise 材料承诺 SSO/SAML、连接器控制、API key 可见性、使用分析、企业登录历史、99.9% SLA、四小时关键响应、24/7
              关键支持，以及可配置数据驻留或专属 VPC 选项。与此同时，公开记录仍缺少模块级 uptime 历史、任务完成率，或 Chrome 自动化、Meeting Bot 入会、Claw
              后台任务的事故披露。开发者信号来源显示产品包装活跃，但硬使用证据有限：Chrome 扩展在 2026 年 5 月更新，而截至本次报告日期，iPhone Speakly app 的可见评分基数仍较小。
