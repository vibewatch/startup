      - number: '8.4'
        title: 尽调要求与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              一小组尽调答案就能让决策很快转向任一方向。若管理层能验证 2026 年 3 月年收入运行率主要是经常性收入，展示优于基础设施沉重型 AI
              封装应用的毛利率，证明健康扩张和低集中度，并澄清最新一轮没有依赖激进投资者保护，当前估值仍可能看起来合理。若答案相反，可比集合会立即变化，股权看起来就偏满。因此，投资逻辑先被证据质量打破，而不是先被叙事质量打破。低于宣传的
              ARR 基数、疲弱留存、Cloud Computer 或模型成本带来的利润率拖累，或把经济性从普通股股东手中转走的轮次条款，都会实质性压低公允价值区间。在这些点被验证前，Genspark
              最适合被视为一个叙事强、上行真实、执行速度也真实的资产，但还不是一个能干净承销的增长软件便宜货。
