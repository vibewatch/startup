  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Genspark 的货币化已经远超单一聊天订阅。当前官方材料至少显示四个可见层级：消费者会员（Free、Plus、Pro）、团队席位、谈判式企业合同，以及积分包和 Genspark Cloud Computer
              等附加用量界面。Team Plan 是最清晰的公开标价，2–150 名用户每席每月 $30，每席含 12,000 积分和 60 GB 存储；企业层级则转向谈判定价、更大席位数、发票账单，以及更像传统 B2B
              软件采购的合同条款。消费者侧，Genspark 披露 Plus 每月起步 10,000 积分，Pro 每月 125,000 积分，但在已抓取的帮助中心材料中没有公布对应美元价格表。Claw
              又加了一层订阅，Cloud Computer 访问起价每月 $9.99，同时部分动作仍消耗共享积分。这意味着收入模式是席位订阅、用量计量和基础设施挂钩增购的混合，而不是纯 SaaS。
