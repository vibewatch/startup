      - number: '1.3'
        title: 融资历史与估值推进
        blocks:
          - type: paragraph
            body: >-
              尽管经审计披露有限，融资故事仍是 Genspark 值得尽调的主要原因。独立报道明确支持三组数据：2024 年由 Lanchi Ventures 领投的 $60 million 种子轮；2025 年 2 月按
              $530 million 估值完成的 $100 million Series A；以及 2025 年 11 月按 $1.25 billion 估值完成的 $275 million Series
              B。仅这几项就显示，它是 AI 应用公司中从发布到独角兽速度最快的一批。此后证据变得更嘈杂。2026 年 1 月和 3 月，公司发布材料把已报道 Series B 融资额抬到超过 $300
              million，随后又到 $385 million，同时声称 ARR 加速、估值接近 $1.6 billion。第三方数据库部分佐证了估值，但对累计融资仍有分歧；2026 年 6 月，一篇引用 Axios 的
              SaaS 行业摘要又把估值推到 $2.6 billion，累计融资超过 $645 million。尽调用途上，2024–2025 年融资路径可信度高；2026 年扩展轮计算方向性强，但仍需要核对股权结构表。
