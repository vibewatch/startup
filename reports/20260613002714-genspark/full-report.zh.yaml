  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 公司
      - 公开合同模式
      - 公开价格 / 单位
      - 包含能力
      - 未知项 / 折扣提示
      - 竞争含义
    rows:
      - - Genspark
        - 按席位的团队订阅
        - 2-150 名用户为 $30/user/month
        - 12,000 积分 / 席位、管理控制、SSO/SAML、AI 聊天、图像、视频、音频、存储
        - 团队计划之外的企业定制定价未披露
        - 透明包装有助于采购和试用转化
      - - Perplexity
        - 消费者订阅，加广告，加企业业务
        - Perplexity Pro 为 $20/month 或 $200/year；Comet 访问从 Max 订阅者开始
        - 答案引擎、订阅、赞助后续问题、企业和 Comet 附加项
        - 企业价目表不公开；抓取来源未显示 Max 价格
        - 显示多种变现实验，也暴露商业模式不确定性
      - - ChatGPT
        - 消费者、Business 和 Enterprise 计划
        - Enterprise 定制定价；Business 计划有公开包装，但从抓取文本中抽取的准确席位价格不可靠
        - 搜索、高级模型、60+ 个应用集成、业务控制、企业隐私和数据驻留
        - 当前 Business 席位准确价格无法从抓取页面文本中干净抽取
        - 搜索包含在更广工作界面内，形成强捆绑压力
      - - Google
        - 免费消费者搜索靠广告变现；AI Mode 位于 Search 内
        - 此处未披露 Search 或 AI Mode 的直接用户费用
        - AI Overviews、AI Mode、链接和搜索生态访问
        - 付费 Gemini 或 Workspace 层不在本表抓取包装范围内
        - 可用既有分发和广告经济补贴 AI 答案
      - - Bing / Copilot Search
        - Microsoft 生态内的免费搜索和答案界面
        - 抓取页面未披露公开用户费用
        - 带引用的总结答案，加 Edge 绑定和其他 Bing AI 功能
        - 更广 Microsoft 捆绑包的商业条款不在此处覆盖
        - 免费默认发现让用户切换成本低，却让挑战者成本高
      - - Glean
        - 企业定制合同
        - 未公开披露
        - 工作 AI、企业搜索、连接器、智能体、模型选择、安全
        - 实际企业定价和扩张经济性仍属私有
        - 不透明定价是大型企业销售常态，但会拖慢简单比较
      - - You.com
        - 按用量 API 定价
        - $5/1k 搜索调用、$1/1k 页面、$12 研究层级、$110 金融研究层级
        - Search API、实时抓取、页面抽取、带引用研究、企业控制
        - 前端助手包装不如 API 基础设施突出
        - 形成一条替代路径：买家自建，而不是购买品牌化工作空间
      - - Dia / Arc
        - 浏览器产品界面
        - 抓取语料中未披露公开价格
        - 带 Arc 血统和安全信息的 AI 浏览器体验
        - 从抓取页面看，商业模式尚不清晰
        - 早期浏览器进入者可先赢得使用习惯，再披露变现
    notes: 该品类公开定价并不一致。本表比较买家今天实际能观察到的内容，而不是推断私人合同经济性。
