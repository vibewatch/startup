      - CV009
      - CV013
      - CV053
      - CV055
      - CV056
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 同样是 $1.6B 的头部估值，适用的收入倍数区间不同，对 ARR 的要求会差很多。
    data:
