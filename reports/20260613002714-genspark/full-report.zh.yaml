      - - Credits 和 credit packs
        - 超出席位内含配额后的使用扩张
        - 10,000-credit 包或按功能 credits
        - Credit packs 以 10,000-credit 为增量销售；部分工具也直接按 credits 计量使用
        - 中：有助于增购，但实际收入取决于转化和消耗行为
        - 要求提供附加率、未用余额收益和每个活跃账户平均付费 credit 支出
      - - Cloud Computer / Claw
        - 独立基础设施订阅，加上可能的增量 credit 使用
        - 订阅 + credits
        - Claw 页面宣传 Cloud Computer 每月 $9.99 起，帮助中心文档显示三档基础设施层级
        - 中：可加深变现，但也会提高基础设施强度
