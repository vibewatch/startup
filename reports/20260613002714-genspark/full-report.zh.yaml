  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 由工作流定义的产品套件与模块地图
        blocks:
          - type: paragraph
            body: >-
              Genspark 已不再适合被描述为 AI 搜索产品。公开界面现在把公司定义为一个以 artifact 为先的工作空间，用户可以跨多个模块，从输入捕获走到完成品：Speakly 负责语音输入，AI Meeting
              Notes 负责捕获和跟进，AI Slides 和 AI Docs 负责打磨交付物，AI Sheets / spreadsheet generation 负责结构化分析，Workflows
              负责重复自动化，Custom Agent 负责可复用的专科智能体，Teams 负责原生协作，Chrome Extension 负责浏览器内执行，Claw
              负责委托式多步工作。贯穿其中的工作流承诺是：用户只需说明一次结果，Genspark 就会协调研究、创作、自动化和交付，调用合适模块，而不是停在聊天回复。 [CE001] [CE002] [CE003]
              [CE005] [CE006] [CE007] [CE008] [CE009] [CE010] [CE014] [CE030]


              这种广度在文档本身里异常可见。Speakly 可以从任何 app 触发 Agent Mode，Meeting Notes 可以自动加入日历关联会议，AI Slides
              可以基于上传文件和代码驱动图表生成演示文稿，AI Docs 可以在富文本和 Markdown 之间切换并回滚版本。结果是一张 SKU
              地图，贴合真实工作者任务——捕获、总结、分析、呈现、自动化、协作和委托——而不是单一通用 copilot 界面。 [CE004] [CE005] [CE006] [CE007] [CE021] [CE031]
