              公开反向证据集中在运营摩擦，而不是某个孤立错误。Trustpilot 投诉反复提到取消困难、账户访问问题、导出损坏、输出消失，以及失败任务消耗额度。Cybernews 和 Deckary
              又加了一层：重任务可能很快烧掉额度，支持响应看起来参差不齐，导出的演示文稿可能需要在 Genspark 原生界面外做大量清理。语音和通话功能进一步扩大了运营面。Realtime Voice
              会在实时语音会话中启动后台任务，Cybernews 描述 Call For Me 会拨打并存储由 AI 驱动、按秒计费的电话，Genspark 自己的隐私和 SMS
              选择加入页面也显示，电话号码同意、STOP/HELP 流程和联系人级选择加入都是产品设计的一部分。FCC 关于 AI 语音自动拨号电话的裁定在这里很关键：即便 Genspark
