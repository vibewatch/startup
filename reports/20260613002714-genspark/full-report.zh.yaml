      - 数值 / 状态
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 综合毛利率
        - 未公开披露；可能受多模型推理和专属云计算支出限制
        - 低 – 基于基准推断，未披露
        - 检验快速 ARR 增长能否转化为耐久软件经济性的核心指标
        - 要求提供按产品线划分的实际毛利率，以及按模型、搜索、存储和支持拆分的 COGS
      - - 上游模型和搜索成本驱动因素
        - Google 将 Gemini 3.1 Pro 定价为每 1M 输入 tokens $2、每 1M 输出 tokens $12，另加每 1,000 次 grounded-search 超额 $14
        - 中 – 官方供应商定价，但 Genspark 组合未知
        - 解释为什么零 credit 促销和无限使用会压缩贡献利润率
        - 要求提供加权模型组合、有效 API 费率和协商后的云供应商折扣
      - - 获客模式
        - 自助服务 + 企业销售 + 扩展 / 分发漏斗的混合模式
        - 中 – 产品界面可直接看到
        - 不同渠道意味着 CAC 和回本周期差异很大
        - 要求提供分渠道 CAC、付费营销占比和企业销售周期长度
      - - 每客户 / 席位收入
        - 未公开披露
        - 低 – 组织和客户数量仅有部分披露且相互冲突
        - 需要用来把 ARR 声称转化为可持续合同价值
        - 要求提供 Free、Plus、Pro、Team 和 Enterprise 分层的 ACV/ARPU
      - - 留存 / 扩张（NRR）
        - 未公开披露
        - 低 – 无公开队列数据
        - 如果流失或促销依赖很高，ARR 快速增长的价值会打折
        - 要求提供分队列总留存、NRR、席位扩张和降级率
      - - Cloud Computer 贡献利润率
        - 未公开披露
        - 低 – 基础设施和支持成本未知
        - 独立计算订阅可能改善变现，也可能拖累利润率
        - 要求提供分层 Cloud Computer 使用率、COGS，以及每个活跃实例的支持成本
    notes: 多数单位经济字段无法从公开来源获得；本表只使用直接观察到的产品机制和可比成本基准，不编造经营表现数据。
