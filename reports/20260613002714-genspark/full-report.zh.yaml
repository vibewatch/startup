  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承保的影响
      - 具体尽调路径
      - 紧迫性
    rows:
      - - 截至 2026 年中账上现金和月度烧钱
        - 缺少现金和烧钱数据，即便完成大额 Series B，也无法计算现金跑道
        - 要求提供 CFO 认证资产负债表、现金瀑布和 13 周现金预测
        - 关键
      - - GAAP revenue 确认和递延收入政策
        - 席位、credits 和 Cloud Computer 订阅混合，会增加确认复杂度
        - 要求提供收入确认备忘录、样本发票和递延收入滚动表
        - 关键
      - - 按产品线划分的实际毛利率和 COGS
        - 标价无法揭示无限使用和 Cloud Computer 是否盈利
        - 要求提供产品线 P&L，以及按模型 / 搜索 / 计算 / 存储拆分的供应商支出
        - 关键
      - - NRR、总留存、流失和降级率
        - 缺少队列数据时，ARR 加速可能掩盖大量由促销驱动的流失
        - 要求提供 Free→Paid、Paid→Paid 和 Team/Enterprise 扩张的队列留存表
        - 关键
      - - Plus、Pro、Team、Enterprise 和 Claw 的实际 ARPU / ACV
        - 需要用来把 ARR 标题数字转化为客户质量和 GTM 效率
        - 要求提供包含活跃订阅者、客户 logo、席位以及 credits/促销后实际价格的计费导出
        - 关键
      - - 客户集中度和席位分布
        - 1,000 个组织几乎无法说明收入集中度或大客户依赖
        - 要求提供按 ARR 排名前 20 的账户和席位数直方图
        - 重要
      - - Cloud Computer 完整价格卡和使用经济性
        - 专属计算可能有战略意义，但也会改变利润率和支持成本结构
        - 要求提供分层价格表、使用率、正常运行成本和每实例支持负担
        - 重要
    notes: 这些是阻碍完整财务承保的主要公开数据缺口；每一项都需要管理层或数据室披露，而不是继续做公开网页研究。
