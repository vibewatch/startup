    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 模型编排层
        - 在前沿模型之间路由任务，并决定下一步工具调用
        - 依赖模型质量、工具选择逻辑以及停止 / 恢复行为
        - 公开的模型数量说法不一，内部路由经济性也不透明
      - - 工具和智能体层
        - 为幻灯片、文档、表格、浏览、工作流和自定义智能体提供专门动作
        - 依赖持续维护的技能、提示词和工具集成
        - 工具扩张可能带来可靠性差异或审核缺口
      - - 执行环境
        - 在浏览器、桌面、移动端、Chrome 侧边栏或专用 Cloud Computer 中运行任务
        - 依赖 OS 权限、浏览器、云容量和远程会话
        - 自动化出错的后果可能比纯聊天错误更重
      - - 连接器和数据层
        - 连接邮件、日历、网盘、聊天、CRM、GitHub、支付以及外部搜索 / 数据工具
        - 依赖有效 OAuth 会话、应用 API 和第三方正常运行
        - token 过期或连接器政策变化可能悄悄打断工作流
      - - 企业控制层
        - 落实 SSO、席位 / 管理员规则、API key 可见性、分析、数据驻留和 VPC 选项
        - 依赖合同条款和管理员配置质量
        - 公开文档显示控制项存在，但看不出客户配置得是否一致
      - - 信任和政策层
        - 组合隐私条款、内容限制、配对模式默认设置和认证项目
        - 依赖执行、日志和事件响应成熟度
        - 相比政策细节，营销简化可能夸大留存 / 隐私承诺
    notes: 公开架构来自产品、帮助中心、隐私和合作伙伴材料的反推，而不是源代码或正式系统图。
