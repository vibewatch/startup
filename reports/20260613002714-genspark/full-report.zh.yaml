            body: >-
              GTM 动作也明显是双轨制。公开团队材料把较小组织引向自助网页结账和 Stripe 账单；企业买方则进入销售辅助流程，涉及订单表、数据驻留讨论、自定义 DPA
              和更长合同期。这个拆分在财务上很关键，因为不同细分的销售成本和回本周期很不一样。官方 2026 年 1 月发布材料称，Team 和 Enterprise 计划在 11 月底发布后约两个月内，已有 1,000
              多家组织采用 Genspark for Business，公司也已在日本配置客户支持和客户成功资源。Chrome 扩展、移动订阅和消费者会员进一步拓宽漏斗顶部，让 Genspark
              在经典直销动作之外获得低摩擦获客界面。公开牵引声明异常强：官方材料从 workplace-tools 发布五个月内 $50M 年化收入，推进到 2026 年 1 月 $100M ARR，再到 2026 年 3 月
              $200M 年化运行率。但这些指标仍是公司宣称或数据库估算，而非经审计数据。
