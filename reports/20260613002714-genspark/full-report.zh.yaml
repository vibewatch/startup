      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自碎片化、界面变化和巨头验证。应用蔓延带来显而易见的生产力问题；AI Overviews、ChatGPT Search、Copilot Search
              和智能体浏览器产品则重新训练用户，让他们期待在一个界面里拿到答案并完成动作。Google 自己的指标显示，这些 AI 层可能增加查询量，而不是蚕食查询量；Glean
              的增长也说明，企业侧类比已经可以变现。但约束同样实质。Seer 发现 AI Overviews 大幅压低付费和自然 CTR，动摇了历史上支撑搜索生态的经济结构。Digiday 对 Perplexity
              的报道显示，广告主仍然好奇但犹豫，因为规模、ROI、CPM 效率和品牌安全尚未被证明。质量和信任也未解决：Google 在公开失误后不得不收紧 AI Overview 触发和护栏，学术研究仍在记录 SEO
              优化低质量内容带来的压力。采用正在发生，但商业模式和信任栈还在追赶产品叙事。
