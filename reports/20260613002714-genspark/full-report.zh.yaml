        - 富文本 / Markdown AI 文档、AI 编辑、版本回滚
        - 在一个工作区里打通创建、编辑和导出
        - 协作编辑或权限细节未公开
      - - 记录会议并发送跟进
        - 手动录制，事后总结，再通过邮件分发纪要
        - AI 会议纪要 + Meeting Bot + 日历链接
        - 自动入会、生成转录和摘要，支持问答、邮件分享、导出到 Notion
        - Meeting Bot 只有在日历链接和点数可用时才工作
      - - 自动化重复性后台工作
        - 在收件箱、表格、聊天和 CRM 之间手动复制数据
        - 覆盖 Gmail/Outlook、Sheets/Drive/Docs、Slack/Teams、Salesforce、GitHub 等的工作流
        - 支持定时或邮件触发的自动化，并可测试运行
        - 公开文档没有按连接器量化故障处理或生产级护栏
      - - 委派跨应用多步骤工作
        - 打开许多应用，手动维护状态，再一步步完成
        - Claw 运行在 Cloud Computer 或本地桌面
        - 在消息、邮件、浏览器和服务登录之间常驻或本地执行
        - 如果权限、渠道规则或工作区边界配置错误，计算机控制风险会上升
