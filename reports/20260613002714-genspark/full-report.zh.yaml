      - number: '1.4'
        title: 产品转向、足迹与当前规模
        blocks:
          - type: paragraph
            body: >-
              Genspark 最具定义性的公司动作，不是推出搜索产品，而是在用户超过 500 万后选择砍掉它。Kay Zhu 自己的解释很有信息量：团队认为固定工作流式 AI 搜索正在过时，更灵活的 Super Agent
              模式能做价值更高的工作。此后，官方材料强调 Speakly、AI Inbox、自定义超级智能体、Genspark Claw 和其他工作流模块，而不是 Sparkpages。Business Wire
              和商业计划页面也显示早期企业牵引，包括到 2026 年 1 月已有 1,000 多家组织使用 AI Workspace、本地日本扩张动作，以及团队计划每席每月 $30
              的公开定价。但外部对客户数、付费席位结构和员工增长的验证仍很薄。第三方来源提供了有用但不完美的快照，因此规模声明应视为有希望，而非已审计。结果是一家公司拥有异常快速的叙事动能，但后续章节仍要承担私有数据尽调负担。
