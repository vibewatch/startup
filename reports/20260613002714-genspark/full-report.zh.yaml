        - label: 11.5x AI 原生 M&A
          value: 139.1
        - label: 6.5x 上市 SaaS 中位
          value: 246.2
        - label: 3.8x 传统 / 成熟底线
          value: 421.1
      yAxis:
        label: $1.6B 估值所需 ARR（USD M）
    approximationNotes: 数值只是用估值除以收入倍数敏感性得出，倍数来自第三方 2026 年市场数据基准和当前公开可比公司参考。
