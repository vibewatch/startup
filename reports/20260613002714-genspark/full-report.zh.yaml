  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象 / 区间
      - 当前公开参照
      - 重要性
      - 与 Genspark 的相关性
      - 局限
    rows:
      - - AI 原生 VC 中位数
        - 21.2x EV / revenue（收入倍数）
        - 2026 年优质私营 AI 热度最好的外部基准
        - 如果 Genspark 自报运行率干净且经得起验证，可作为上限
        - 篮子统计，不是公司特定数据
      - - AI 原生 M&A 中位数
        - 11.5x EV / revenue（收入倍数）
        - 比后期风投定价更克制的溢价基准
        - 如果战略价值真实但披露仍不完整，可作为有用中点
        - M&A 中位数不是公开交易可比公司
      - - 上市 SaaS 中点
        - ~6x-7x EV / revenue（收入倍数）
        - 显示没有 AI 稀缺溢价时，普通优质上市软件大致在哪里出清
        - 如果 Genspark 落入普通软件区间，这是重要基准情景
        - 宽口径市场指数，不是直接同业集合
      - - AI 上市龙头
        - Datadog ~20.4x；Snowflake ~15.5x；ServiceNow ~7.0x；Salesforce ~3.8x（收入倍数）
        - 展示当前软件内部投资人实际给出的估值分化
        - 可用来锚定上行和压缩两种结果
        - 该组混合了不同商业模式和成熟度
      - - 已披露云 / 基础设施集合
        - Snowflake 10-K，加上 DigitalOcean 和 NetApp 申报门户
        - 让可比集合锚在经审计发行人，而不只依赖创业公司新闻稿
        - 私营披露偏弱时，支持更有纪律的入场
        - 仍没有完美匹配 Genspark 具体产品组合的上市可比公司
      - - 私营 AI 工作基准
        - Glean ARR $100M，估值 $7.2B
        - 显示到 2026 年，私营 AI 工作热度仍可能跑到很高
        - 如果企业 AI 需求持续复合增长，这能支撑上行叙事
        - 私募轮次估值不是经审计运营质量证明
    notes: 本章估值计算用到的基准区间，这组可比对象已经覆盖完整：高溢价私营 AI、高溢价上市软件、普通上市 SaaS、已披露基础设施发行人，以及相关的私营 AI 工作类比。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Rows cover every benchmark cluster explicitly used in this chapter's scenario math as of June 2026, rather than
        every software ticker or AI startup in the market.
