  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 示意性公允价值区间差异很大，取决于投资人把 Genspark 归为高溢价 AI 软件、普通 SaaS，还是基础设施成本偏重的包装层。
    data:
      items:
        - label: 乐观区间
          low: 2.4
          mid: 2.8
          high: 3.2
        - label: 基准区间
          low: 1.4
          mid: 1.7
          high: 2
        - label: 基准偏下区间
          low: 1
          mid: 1.2
          high: 1.4
        - label: 悲观区间
          low: 0.7
          mid: 0.85
          high: 1
    approximationNotes: 这些区间把简单收入倍数套到公司自报的 $200M 年化收入运行率标记上，因此展示的是估值敏感性，不是 GAAP 意义上的公允意见。
    claimRefs:
      - CV007
      - CV018
      - CV019
      - CV021
      - CV031
      - CV051
      - CV052
      - CV054
