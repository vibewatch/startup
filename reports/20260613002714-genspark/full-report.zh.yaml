            body: >-
              Genspark 正确的可比框架，是估值讨论的核心。若公司真是具备可防守工作流深度的 AI 原生工作平台，高溢价 AI
              软件和数据基础设施参照就重要。若它只是一个动作很快、但最终更像叠在第三方模型和昂贵云基础设施上的封装式工作空间，普通软件或成熟云软件区间就更适合作锚。第三方倍数数据正好覆盖这场争论。SaasRise 显示 AI
              原生与传统软件结果之间存在巨大差距。Windsor Drake 描述的公开 SaaS 市场已稳定在远低于 2021
              年峰值的位置，并明确说买方只会在经常性收入、切换成本和可防守性可见时付溢价。Multiples.vc 进一步收紧公开市场信号：数据基础设施和 DevOps
              仍拿到溢价，云基础设施则越来越被当成商品化类别。Snowflake 的申报指标展示了高溢价公开市场质量在实践中是什么样——规模、强 NRR 和大量七位数客户。Glean 2026 年 6 月估值显示，私人市场对
              AI 工作的热情仍可极端高涨，但这不能取消在公司层面证明收入质量的要求。
