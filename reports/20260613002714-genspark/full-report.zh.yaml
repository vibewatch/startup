            body: >-
              Genspark 的公开界面暗示了三种付费动作，而不是单一客户画像。底部是个人知识工作者和创作者，他们可以直接在 web 或 mobile 上购买 Free、Plus 或 Pro 计划，并通过 iOS
              app、Speakly 或浏览器界面使用 Genspark。中间是自助式团队，付款方通常是管理员或经理，购买 2–150 个席位，配有集中账单、SSO/SAML、成员角色和连接器控制。顶部是 151+
              用户的企业账户，采用自定义合同、电汇账单、数据驻留、专属 VPC 选项和客户成功支持。 [CU003] [CU004] [CU011] [CU012] [CU017] [CU018] [CU019]
              [CU033] [CU034]


              具名证据有助于厘清买方和用户角色。Spyglaz AI 创始人描述了董事会级别的演示输出和更快上市速度，指向创始人主导或 GTM 主导的购买，用于打磨交付物。GEOPARK 的 CIO
              称内部用户很快要求企业访问权限，说明日常用户是知识工作者，但付款方是集中 IT 或运营。ADK Marketing Solutions
              增加了地域和用例细节：一家日本营销机构用该产品减少数据分析和文档创建工作，进一步说明咨询、广告和相邻知识工作团队是当前目标客户。地域看起来有意铺得很宽——North America、Europe 和 Asia
              被反复提及——但公司没有披露按地区、计划或垂直行业拆分的客户数或 ARR。 [CU001] [CU002] [CU006] [CU007] [CU008] [CU027] [CU029] [CU039]
