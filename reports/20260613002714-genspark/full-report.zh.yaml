  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the major public alternatives visible in the fetched 2026 competitor corpus: direct answer/work peers,
        incumbent search platforms, enterprise work-AI analogs, and browser-surface entrants. It excludes smaller niche
        copilots and undisclosed internal builds.
    columns:
      - 竞争对手
      - 类别
      - 公开规模 / 融资
      - 目标细分市场
      - 差异化
      - 相对 Genspark 的局限
    rows:
      - - Genspark
        - 直接 AI 工作空间 / 前答案引擎
        - 团队计划公开为 $30/user/month；70+ 个模型；披露 2-150 席位计划
        - 专业消费者、团队和新兴企业买家
        - 一个工作空间内覆盖广泛素材生成和研究
        - 公开分发足迹远小于 Google、ChatGPT 或 Bing
      - - Perplexity
        - 直接答案引擎，叠加浏览器和企业业务
        - 2026 年报道提到 $18B 估值；Comet 仅限 Max 订阅者和受邀者
        - 消费者、知识工作者和企业团队
        - 强答案品牌，加上 Comet 浏览器和企业扩张
        - 来自出版方的法律压力，以及广告规模不确定性
      - - OpenAI / ChatGPT
        - 横跨搜索和工作 AI 的直接替代品
        - Digiday 引用约 400M 用户；Business 和 Enterprise 包装广泛
        - 消费者、开发者和企业
        - 最熟悉的通用 AI 工作界面，内置搜索
        - 不像 Google 或 Microsoft 拥有默认浏览器分发
      - - Google Search / AI Mode
        - 既有搜索和答案平台
        - AI Overviews 在 200 个国家覆盖 1.5B 用户；覆盖查询类型的查询量增长 >10%
        - 大众消费者和广告主
        - 默认行为、搜索索引深度和集成 AI Mode
        - 质量事故和反垄断补救措施约束其行为
      - - Bing / Copilot Search
        - 带浏览器绑定的既有挑战者
        - Microsoft 控制搜索和 Edge 分发；此处未披露准确公开用户数
        - 消费者和 Microsoft 生态用户
        - Bing 内的带引用答案，加上明确的 Edge 强化
        - 公开心智低于 Google 和 ChatGPT
      - - Glean
        - 企业工作 AI 对标对象
        - $100M ARR，客户基数翻倍以上，$7.2B 估值，>850 名团队成员
        - 购买有依据工作 AI 的大型企业
        - 深度企业上下文、100+ 个连接器、权限感知搜索和智能体
        - 定价不公开，消费者发现较弱
      - - You.com
        - 相邻搜索基础设施 / API 替代品
        - API 主导定价，无最低用量，带企业控制
        - 开发者、智能体构建者和企业平台团队
        - 让买家基于搜索和抽取基础设施自建，而不是购买品牌化助手
        - 作为消费者目的地的可见度低于早期答案引擎同业
      - - Dia / Arc / 浏览器新进入者
        - 相邻浏览器界面
        - Browser Company 公开支持 Dia 和 Arc；未披露公开规模指标
        - 高级用户和浏览器主导的研究者
        - 掌握界面习惯和浏览上下文，而不只是答案输出
        - 相比默认浏览器和主要 AI 平台仍处早期
    notes: 各行有意按待完成任务比较异质竞争者：找答案、执行工作流、企业依据和浏览器控制。公开规模披露在这组公司之间并不均衡。
