      - number: '1.2'
        title: 创始人、领导层与运营班底
        blocks:
          - type: paragraph
            body: >-
              创始人履历是 Genspark 最清楚的优势之一。Eric Jing 来自 Microsoft Bing，后来在 Baidu 负责核心搜索和 AI 产品；Kay Zhu 曾参与 Google 和 Baidu
              搜索，并与 Jing 共同打造 Xiaodu。这段共同背景让 Genspark 最初的搜索取向，以及后来切入智能体工作流，都更站得住脚：创始团队已经做过搜索质量、消费级界面和贴近硬件的 AI 系统。Forbes
              还把 Wen Sang 列为联合创始人兼 COO，他通过 Smarking
              带来企业软件经验。公开证据仍没有填上正式董事会构成、观察员权利和独立治理等空白，但已披露的领导层显示，公司商业覆盖能力强于纯研究型创业公司。公司新闻材料进一步把人才来源扩展到
              Microsoft、Google、Meta、YouTube 和 Pinterest 老兵，强化了一个判断：Genspark 正试图从创始人驱动的产品组织，扩成完整运营公司。
