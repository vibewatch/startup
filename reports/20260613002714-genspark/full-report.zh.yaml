  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值事实与披露质量
        blocks:
          - type: paragraph
            body: >-
              Genspark 有真实的收入线索和融资叙事，但公开记录仍在头部动能与可承销经济性之间留下很大缺口。独立报道显示，公司在 2025 年 10 月接近独角兽状态，并在 11
              月进入独角兽行列；随后官方材料和后续报道又把叙事上调两次：2026 年 1 月带来 $100 million ARR 说法和累计 $300 million 的 Series B，2026 年 3 月带来 $200
              million 年收入运行率说法、累计 $385 million 融资，以及接近 $1.6 billion
              的估值。这些标记方向上很亮眼，且被广泛重复，不能轻易忽视。问题在于，几乎所有当前影响估值的运营指标，仍是公司转述或数据追踪器推导，而不是审计口径。Tracxn 和 GetLatka
              在融资、员工数和客户数的精确值上不一致，所以连看似简单的规模事实也有噪音。这迫使本章把 Genspark 作为围绕自报增长叙事的一段区间来估值，而不是作为一家披露质量达到公开市场标准、已经完全证明的软件公司。
