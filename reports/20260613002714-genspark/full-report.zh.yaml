      - number: '5.2'
        title: Super Agent 架构与运行模式
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开架构故事是，Genspark 已从固定搜索式工作流转向通用智能体运行时。商业页面称该工作空间编排 70 多个 AI 模型，MainFunc 描述了 collect-process-generate
              流程和 mixture-of-agents 设计；Anthropic 的客户故事走得更远，称 Super Agent 会协调 150 多个专用工具，并在 2025 年从僵硬的预定义图转向 ReAct
              风格循环，自主决定调用哪个工具、何时停止。Claw 的公开发布材料又补上执行层：每名用户一个专属 Cloud Computer，来自 Azure、Anthropic、OpenAI 和 NVIDIA
              的前沿模型，以及在用户自有机器上运行同一智能体逻辑的本地桌面模式。 [CE016] [CE017] [CE018] [CE019] [CE020] [CE022]


              支撑模块文档让这套栈更具体。AI Slides 称可运行代码生成图表和计算；AI Docs 提供带版本的保存点和双编辑模式；Workflows 自动搭建触发 / 动作自动化，并用模拟数据测试运行；Realtime
              Voice 在对话继续时把长任务放到后台执行。换言之，Genspark 的运行模式不像一个单体模型，更像模型、工具、连接器和执行环境之上的路由层。 [CE006] [CE007] [CE012] [CE021]
