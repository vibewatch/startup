      - number: '2.5'
        title: 矛盾、竞争信号与未解缺口
        blocks:
          - type: paragraph
            body: >-
              本章的主要矛盾在于：市场注意力巨大，独立挑战者的货币化仍很窄。Google 在基线搜索量上仍占主导，并把智能体功能直接折进 Search、Chrome 和
              Gemini，这提高了任何独立进入者的门槛。Perplexity 和 Arc 显示浏览器可能成为有意义的控制点，但 Digiday 和 TechCrunch
              也显示，广告主经济和出版商收入分成仍处实验阶段。Genspark 自己的历史让这一点更尖锐：管理层放弃纯搜索姿态，如今销售工作流软件，说明消费级答案搜索本身不够。未解的尽调问题因此不是有没有市场，而是
              Genspark 能把其中哪一片转化为持久付费使用。公开证据仍太薄，无法隔离出干净的 SAM 或 SOM，因为席位结构、企业留存和免费转付费转化仍未披露。
