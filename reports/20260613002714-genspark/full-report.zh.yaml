        title: 图表
        blocks:
          - type: callout
            title: 公司故事强，入场证据弱
            body: Genspark 可能正在搭建一个真实的高溢价 AI 工作平台，但公开档案仍不能证明，今天接近 $1.6B 的估值对新投资者有利。
