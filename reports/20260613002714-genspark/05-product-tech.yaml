- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Model orchestration layer
    - Routes tasks across frontier models and decides next-step tool use
    - Depends on model quality, tool-selection logic, and stop/recovery behavior
    - Public model-count claims vary and internal routing economics are opaque
  - - Tool and agent layer
    - Provides specialized actions for slides, docs, sheets, browsing, workflows, and custom agents
    - Depends on maintained skills, prompts, and tool integrations
    - Tool sprawl can create reliability variance or moderation gaps
  - - Execution environments
    - Runs tasks in browser, desktop, mobile, Chrome sidebar, or dedicated Cloud Computer
    - Depends on OS permissions, browsers, cloud capacity, and remote sessions
    - Automation errors can have higher consequence than chat-only mistakes
  - - Connector and data layer
    - Connects email, calendar, drive, chat, CRM, GitHub, payments, and external search/data tools
    - Depends on valid OAuth sessions, app APIs, and third-party uptime
    - Expired tokens or connector policy changes can silently break workflows
  - - Enterprise control layer
    - Applies SSO, seat/admin rules, API-key visibility, analytics, residency, and VPC options
    - Depends on contract terms and admin setup quality
    - Public docs show controls exist but not how consistently customers configure them
  - - Trust and policy layer
    - Combines privacy terms, content restrictions, pair-mode defaults, and certification programs
    - Depends on enforcement, logging, and incident response maturity
    - Marketing simplifications can overstate retention/privacy guarantees relative to policy detail
  notes: The public architecture is reconstructed from product, help-center, privacy, and partner materials rather than source code or formal system diagrams.
