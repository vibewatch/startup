- id: deployment-integration-and-reliability
  title: Deployment, integration, admin controls, and reliability posture
  body: 'Genspark''s deployment model is deliberately multi-surface. Download and help pages point to web, desktop, iPhone, Android, Apple Watch, Chrome, Microsoft Office, Google Workspace, and a browser-native AI Browser. Claw can run as a 24/7 cloud instance with dedicated CPU, memory, storage, and fixed IP, or in a local desktop mode that uses the customer''s own machine. Workflows and Claw both expose broad connector depth: Google and Outlook mail/calendar, Slack, Teams, Notion, Salesforce, GitHub, Zoom, Stripe, Jira, Figma, Crunchbase, SimilarWeb, and other third-party services appear directly in the public docs. This suggests the company is optimizing for embedded workflow presence rather than a single destination app. [CE011] [CE022] [CE023] [CE030] [CE034]


    Public reliability evidence is mixed. Team and Enterprise materials promise SSO/SAML, connector controls, API-key visibility, usage analytics, enterprise login histories, a 99.9% SLA, four-hour critical response, 24/7 critical support, and configurable data residency or dedicated VPC options. At the same time, the public record still lacks module-level uptime history, task-completion rates, or incident disclosures for Chrome automation, Meeting Bot joins, and Claw background jobs. Developer-signal sources show active packaging but only modest hard usage proof: the Chrome extension was updated in May 2026, and the iPhone Speakly app had a small visible ratings base as of the run date. [CE024] [CE025] [CE028] [CE029] [CE040]'
