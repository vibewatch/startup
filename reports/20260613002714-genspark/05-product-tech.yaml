summary: Genspark now presents a broad workflow stack spanning voice capture, meeting bots, slides/docs/sheets, browser automation, custom agents, workflows, and Claw cloud-computer execution, all tied to a Super Agent layer that routes across large model and tool inventories. The public record is strongest on feature breadth, integration surfaces, and enterprise-control disclosures; the weakest spots are uptime transparency, automation safety metrics, and ambiguity between 'zero data retention' marketing and the privacy policy's actual retention language.
sections:
- id: workflow-defined-product-suite
  title: Workflow-defined product suite and module map
  body: 'Genspark is no longer best described as an AI search product. Its public surfaces now frame the company as an artifact-first workspace where users can move from input capture to finished outputs across multiple modules: Speakly for voice entry, AI Meeting Notes for capture and follow-up, AI Slides and AI Docs for polished deliverables, AI Sheets / spreadsheet generation for structured analysis, Workflows for recurring automations, Custom Agent for reusable specialist agents, Teams for native collaboration, Chrome Extension for in-browser execution, and Claw for delegated multi-step work. The consistent workflow promise is that a user states an outcome once and Genspark coordinates research, creation, automation, and delivery across the right module rather than stopping at a chat response. [CE001] [CE002] [CE003] [CE005] [CE006] [CE007] [CE008] [CE009] [CE010] [CE014] [CE030]


    That breadth is unusually visible in the documentation itself. Speakly can trigger Agent Mode from any app, Meeting Notes can auto-join calendar-linked meetings, AI Slides can build decks from uploads and code-backed charts, and AI Docs can switch between rich text and Markdown with version rollback. The result is a SKU map that tracks real worker jobs—capture, summarize, analyze, present, automate, collaborate, and delegate—rather than a single generic copilot surface. [CE004] [CE005] [CE006] [CE007] [CE021] [CE031] [CE033]'
