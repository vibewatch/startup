- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Genspark solution
  - Measurable benefit
  - Limitation
  rows:
  - - Turn spoken intent into polished text or tasks
    - Switch between keyboard, notes app, and browser tabs
    - Speakly dictation + Agent Mode
    - Claims 4x faster input across 100+ apps and 100+ languages
    - Speed claim is company-stated; install/adoption depth is not disclosed
  - - Produce an executive-ready presentation
    - Gather sources, structure outline, draft slides, fix charts manually
    - AI Slides with Skills, code-backed charts, import/export stack
    - Can generate, style, and export a full deck from one prompt or source file
    - No public proof that cited facts are always checked or presentation outcomes are error-free
  - - Draft and refine complex documents
    - Move between docs, markdown tools, and PDF export utilities
    - AI Docs with Rich Text/Markdown, AI edit, version rollback
    - Combines creation, editing, and export inside one workspace
    - No public collaborative editing or permissioning detail
  - - Capture meetings and send follow-up
    - Record manually, summarize later, distribute notes by email
    - AI Meeting Notes + Meeting Bot + calendar link
    - Auto-join, transcript, summary, Q&A, email share, Notion export
    - Meeting Bot only works when calendar links and credits are present
  - - Automate repetitive back-office work
    - Manually copy data between inbox, sheets, chat, and CRM
    - Workflows over Gmail/Outlook, Sheets/Drive/Docs, Slack/Teams, Salesforce, GitHub, and more
    - Scheduled or email-triggered automations with test-run capability
    - Public docs do not quantify failure handling or production guardrails by connector
  - - Delegate multi-step work across apps
    - Open many apps, keep state manually, and finish steps one by one
    - Claw on Cloud Computer or local desktop
    - Always-on or local execution across messaging, email, browser, and service logins
    - Computer-control risk rises if permissions, channel rules, or workspace boundaries are misconfigured
  notes: This table focuses on concrete worker jobs rather than marketing categories so the workflow boundary of each module is clear.
