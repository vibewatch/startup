- id: super-agent-architecture
  title: Super Agent architecture and operating model
  body: 'The clearest public architecture story is that Genspark has moved from fixed search-style workflows toward a general agent runtime. The business page says the workspace orchestrates 70+ AI models, while MainFunc describes a collect-process-generate flow and a mixture-of-agents design; Anthropic''s customer story goes further, describing a Super Agent that coordinates 150+ specialized tools and a 2025 pivot away from rigid predefined graphs toward a ReAct-style loop that decides which tool to call and when to stop. Public launch materials for Claw then add the execution layer: a dedicated Cloud Computer per user, frontier models from Azure, Anthropic, OpenAI, and NVIDIA, and a local desktop mode for the same agent logic on the user''s own machine. [CE016] [CE017] [CE018] [CE019] [CE020] [CE022]


    The supporting module docs make the stack more concrete. AI Slides says it can run code for charts and calculations, AI Docs exposes versioned save points and dual editing modes, Workflows auto-builds trigger/action automations and test runs them with simulated data, and Realtime Voice launches long-running tasks in the background while the conversation continues. In other words, Genspark''s operating model looks less like one monolithic model and more like a routing layer over models, tools, connectors, and execution environments. [CE006] [CE007] [CE012] [CE021] [CE023]'
