  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Module-level uptime, task-success, latency, and error-rate metrics for Claw, Workflows, Meeting Bot, and browser automation.
    whyItMatters: Public feature depth does not prove production reliability or operational readiness at enterprise scale.
    diligencePath: Request internal status dashboards, SLA reporting, incident summaries, and connector failure-rate data by module.
    relatedQuestionRefs:
    - QE014
    - QE022
    relatedTableRefs:
    - TE004
    - TE005
  - type: conflicting-data
    severity: material
    topic: retention-meaning
    missingEvidence: A product-by-product definition of what marketing means by zero data retention across chat, Speakly, Claw, Meeting Notes, and enterprise tenants.
    whyItMatters: Marketing simplifications can overstate privacy posture if account, prompt, or transcript data is still stored or routed to providers.
    diligencePath: Request data-flow diagrams, retention schedules, and contractual language tying zero-retention claims to specific modules or plan tiers.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: automation-safety
    missingEvidence: Red-team results, false-action rates, rollback mechanisms, and human-confirmation defaults for Chrome and computer-control tasks.
    whyItMatters: Execution surfaces create higher downside than chat-only assistants when actions can affect customer systems or sensitive files.
    diligencePath: Request security review artifacts, guardrail specifications, and postmortem examples for failed automation runs.
    relatedQuestionRefs:
    - QE021
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: admin-privacy-boundaries
    missingEvidence: Independent evidence that admins truly cannot inspect member project content or over-collect connector data in normal operation.
    whyItMatters: Enterprise buyers will care whether governance claims are enforced technically or only contractually.
    diligencePath: Ask for SOC bridge materials, tenant-isolation architecture notes, and sample admin audit trails that prove content separation.
    relatedQuestionRefs:
    - QE013
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: surface-adoption
    missingEvidence: Active-user, install, retention, and workflow-volume metrics for Speakly, Chrome Extension, Meeting Bot, and Claw.
    whyItMatters: Public listings and reviews prove packaging but not meaningful adoption depth across each surface.
    diligencePath: Request monthly active users, installs, paid attach rates, and retention by module.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE001
