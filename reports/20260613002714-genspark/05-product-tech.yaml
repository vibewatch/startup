  title: Product module / SKU matrix
  columns:
  - Module / surface
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Super Agent core
    - Individual and team knowledge workers
    - Mature core orchestration layer
    - Single prompt routes across research, creation, and automation surfaces
    - No public task-success or latency distribution by task class
  - - AI Slides
    - Knowledge workers, GTM, founders, consultants
    - Mature creative/professional module
    - 100+ expert Skills, brand-following mode, code-backed charts, export to PPTX/PDF/Google Slides
    - No public benchmark on edit fidelity or hallucination rate in cited decks
  - - AI Docs
    - Writers, operators, analysts, technical users
    - Growth module with clear editor depth
    - Rich Text + Markdown, save points, AI edit, export to Word/PDF/HTML
    - No public access-control or collaborative-permission matrix
  - - Speakly
    - Cross-device end users
    - Growth surface with mobile and desktop distribution
    - Voice dictation plus AI cleanup, custom shortcuts, Agent Mode in any app
    - Public ratings/install data is still shallow versus the platform ambition
  - - AI Meeting Notes
    - Meeting-heavy professionals and teams
    - Growth surface with bot automation
    - Calendar-linked auto-join, transcript Q&A, share/export flows, Apple Watch entry point
    - No public note-accuracy benchmark or bot-join success-rate disclosure
  - - Workflows
    - Ops, GTM, finance, research teams
    - Growth automation surface
    - Natural-language workflow creation plus scheduled/email triggers and multi-app actions
    - Connector permission model and production error metrics are not publicly quantified
  - - Custom Agent
    - Power users and teams
    - Mature creation surface
    - One-prompt agent creation, store distribution, @mention reuse
    - No public moderation stats for user-generated agent store content
  - - Claw + Cloud Computer
    - Users delegating long-running multi-step tasks
    - Launch-stage but strategically central
    - Dedicated per-user cloud instance, messaging-channel execution, optional local mode
    - Local mode file-boundary enforcement is soft guidance rather than a hard sandbox
  - - Chrome Extension + Teams
    - Browser users and collaborating organizations
    - Newer distribution/collaboration surfaces
    - Page-aware automation, project sharing, cross-org contact flow, low context-switch cost
    - No public enterprise deployment stats or extension install base disclosed
  notes: Rows separate core creation modules from newer execution and distribution layers; maturity labels reflect documentation depth, launch cadence, and public deployment signals rather than internal usage numbers.
