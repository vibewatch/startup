- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Application sprawl across 11 tools per desk worker
    - driver
    - Current
    - Creates consistent demand for better retrieval and synthesis inside work
    - Test how often Genspark wins because it reduces app-switching time
  - - Incumbent AI surfaces increasing user expectations
    - driver
    - Current
    - Normalizes answer-first and action-oriented interfaces
    - Measure whether Genspark benefits from education done by Google, Bing, and ChatGPT
  - - Enterprise work-AI proof from Glean
    - driver
    - Current
    - Shows that retrieval plus workflow assistance can monetize at scale
    - Benchmark Genspark retention and seat expansion against Glean-like usage
  - - Browser-based agent experiences
    - driver
    - Near term
    - Opens a new distribution surface where search and actions merge
    - Clarify whether Genspark intends a browser, extension, or in-app agent strategy
  - - AI Overview click compression
    - constraint
    - Current
    - Weakens the legacy traffic economics that funded search ecosystems
    - Quantify how Genspark monetizes if referrals and ad clicks compress
  - - Advertiser hesitation on AI-search inventory
    - constraint
    - Current
    - Limits ad-market upside for challenger platforms
    - Request evidence of ROI, conversion, and brand-safety controls
  - - Trust and quality failures
    - constraint
    - Current
    - Hallucinations, spam, and poor labeling can slow adoption and regulation
    - Collect incident rates, red-team outcomes, and abuse reporting processes
  - - Incumbent distribution and trust advantage
    - constraint
    - Current through 2026
    - Raises CAC and makes a query-for-query Google attack unattractive
    - Model Genspark as a wedge into workflow budgets rather than a direct Google replacement
  notes: Rows tie each driver or constraint to timing and to the specific diligence question it raises for Genspark rather than treating market growth as uniformly positive.
