  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-units
    missingEvidence: A company-specific bridge from usage, seats, and workflow modules to an internally consistent SAM/SOM.
    whyItMatters: Without a common unit, public lenses can support almost any narrative about market size while hiding monetization limits.
    diligencePath: Request cohort data for free users, paid seats, enterprise conversions, and revenue split by product surface.
    relatedQuestionRefs:
    - QM020
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: private-evidence-only
    severity: material
    topic: genspark-enterprise-conversion
    missingEvidence: Enterprise logo retention, paid-seat expansion, and workflow-module adoption by customer segment.
    whyItMatters: The investment case depends on Genspark converting discovery and curiosity into durable workflow spend.
    diligencePath: Request board KPI dashboards or customer analytics showing expansion, churn, and module-level usage by cohort.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM003
    - TM005
  - type: missing-source
    severity: minor
    topic: advertiser-roi-proof
    missingEvidence: Independent conversion and ROI data for advertising or commerce programs inside AI-answer products.
    whyItMatters: Ad-market upside is often cited as a long-term prize, but current public evidence mostly covers tests and buyer hesitation.
    diligencePath: Collect case studies or campaign reporting from brands that moved spend beyond pilot budgets.
    relatedQuestionRefs:
    - QM019
    relatedTableRefs:
    - TM004
