- id: sizing-lenses
  title: 'Sizing lenses: usage scale, software spend, and revenue proxies'
  body: 'Multiple sizing lenses point in the same strategic direction but use very different units. On the attention side, SparkToro shows Google still processing more than five trillion searches per year and roughly 373 times ChatGPT''s search-like volume, even after AI disruption narratives took hold. On the software side, IMARC places enterprise search at $6.7 billion in 2025 and $14.5 billion by 2034, which is much smaller than the global web-search attention pool but far closer to a monetizable B2B wedge. Revenue proxies further support the point: Glean reached $100 million ARR and a $7.2 billion valuation, showing that enterprise retrieval plus workflow AI can generate large private-market outcomes even before category maturity. Google''s 1.5 billion AI Overview users and 400 million Gemini MAUs show that incumbent AI layers can scale far faster in user count than stand-alone challengers. The right read is not that one number is correct and the others are wrong; it is that each lens
    measures a different part of the same evolving market stack.'
