- id: TM005
  title: Contradictions and diligence gaps table
  columns:
  - Signal
  - Bullish read
  - Contradictory evidence or gap
  - Why it matters
  rows:
  - - Massive AI-search narrative
    - AI interfaces are clearly changing behavior
    - Google still dwarfs challengers on comparable search volume
    - A huge narrative market can still be hard for challengers to monetize
  - - Enterprise search validation
    - Glean proves the category can support $100M+ ARR and multibillion value
    - Public data still do not isolate Genspark's paid-seat wedge or retention
    - Valuation should not assume Genspark inherits Glean economics automatically
  - - Ad-market optionality
    - Perplexity and Google are testing ads and shopping inside AI answers
    - Advertisers still cite low scale, ROI uncertainty, brand safety, and CPM concerns
    - Consumer usage does not automatically convert into high-margin ad revenue
  - - Browser-agent frontier
    - Comet and Dia show interfaces are moving toward action-first experiences
    - Genspark has not publicly disclosed a browser-native or distribution-control strategy
    - Interface shifts could help or bypass Genspark depending on product roadmap
  - - Hybrid positioning
    - Genspark can point to both consumer discovery and enterprise workflow value
    - No public SAM/SOM split or conversion data ties those two motions together
    - The biggest remaining chapter risk is strategic overbreadth rather than no demand
  notes: This table preserves contradictions instead of forcing false precision; several of the most important market variables are currently not disclosed by Genspark.
