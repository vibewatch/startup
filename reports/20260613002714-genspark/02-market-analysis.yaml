tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Genspark
  rows:
  - - Consumer answer-search
    - Search attention, subscriptions, commerce and ad-adjacent usage around answer engines
    - Generic web traffic with no intent to synthesize or act
    - Individual users and advertisers
    - Relevant as discovery and behavior-change layer, but weak as the sole monetization lens
  - - Enterprise search / work AI
    - Seat-based software budgets for retrieval, synthesis, and workflow help inside company systems
    - Broad enterprise SaaS categories unrelated to information retrieval or agentic work
    - IT, digital workplace, operations, and business-function leaders
    - Closest paid wedge because it maps to documented information-finding pain
  - - Agentic browser / workspace tools
    - Paid access to interfaces that combine search, browsing, and task execution
    - Standalone browser usage with no paid workflow layer
    - Power users, teams, and premium subscribers
    - Expansion frontier because Comet and Dia blur search and execution
  - - Adjacent but excluded
    - Model API spend and generic chatbot experimentation
    - Foundation-model infrastructure revenue and all digital advertising
    - Developers and platform teams
    - Important context, but too broad to treat as Genspark's direct addressable market
  notes: Defines the market boundary before sizing it; rows mix paid software pools with behavior and interface layers because the chapter evidence spans all three.
