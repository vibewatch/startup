    - High
    - Problem-size proxy, not direct revenue TAM
  - - Glean
    - '2025'
    - Enterprise / global customer base
    - '>$100M ARR; customer base more than doubled; ~40% DAU/MAU'
    - 'null'
    - Competitor revenue and usage proxy from official release
    - Medium
    - Company-authored competitor metrics are not independent market totals
  - - Google I/O
    - '2025'
    - 200 countries and territories
    - 1.5B AI Overview users; 400M Gemini app MAUs
    - '>10% query growth for covered query types in US and India'
    - Official usage-disclosure lens for incumbent AI scale
    - Medium
    - User and MAU counts are not directly comparable to query or revenue metrics
  - - Digiday / Perplexity market checks
    - '2025'
    - Global consumer app usage
    - ~22M active Perplexity users versus much larger Google and ChatGPT surfaces
    - 'null'
    - Buyer and media-market lens anchored on platform scale
    - Medium
    - User count is secondary and not a full financial measure
  notes: These lenses intentionally mix usage, survey pain, software spend, and competitor revenue because public evidence does not support a single precise Genspark SAM/SOM number.
