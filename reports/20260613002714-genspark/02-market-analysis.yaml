callouts:
- calloutType: insight
  title: Do not use one TAM label
  body: The strongest public evidence measures three different things — search attention, software spend, and competitor revenue. Treating them as one number would overstate precision and understate market transition risk.
  claimRefs:
  - CM008
  - CM018
  - CM019
  - CM048
- calloutType: strength
  title: The buyer pain is real
  body: The clearest near-term wedge is enterprise workflow and retrieval pain, not a query-for-query attack on Google. Gartner and Glean together show both a strong problem statement and evidence that buyers already pay to solve it.
  claimRefs:
  - CM011
  - CM012
  - CM015
  - CM017
  - CM018
- calloutType: risk
  title: Consumer usage does not equal challenger economics
  body: AI-search curiosity is expanding, but ad budgets, click flows, and trust economics remain unsettled. That is why Genspark's workspace pivot matters so much to the investment case.
  claimRefs:
  - CM028
  - CM029
  - CM034
  - CM035
  - CM044
  - CM045
