chapter:
  number: 2
  title: Market Analysis
  summary: Genspark is not entering a single clean market. The evidence supports a hybrid boundary where enterprise search and work-AI budgets are the clearest monetizable wedge, consumer AI search remains a powerful distribution proving ground, and incumbents are racing to fold agentic behavior into search and browsers before pure answer engines can dislodge them.
sections:
- id: market-boundary
  title: 'Market boundary: hybrid search, workflow, and browser surfaces'
  body: The evidence does not support calling Genspark a pure web-search startup anymore, but it also does not support treating it as just another generic copilot. Chapter 1 already showed management killed a five-million-user AI-search product because fixed-workflow search looked strategically narrow next to a broader Super Agent workspace. That matters for market definition. The closest paid budget pool is enterprise search and work-AI software, where buyers spend to reduce information friction across fragmented applications. The closest distribution pool is consumer answer-search, where challengers must win attention against Google, Bing, and ChatGPT. A third adjacent layer is the emerging browser-and-agent surface, where Arc Dia and Perplexity Comet suggest search, browsing, and task execution are collapsing into one interface. Genspark should therefore be valued against a hybrid market boundary with explicit inclusions and exclusions, not a single inflated TAM label.
