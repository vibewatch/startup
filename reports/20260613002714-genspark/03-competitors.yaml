callouts:
- calloutType: insight
  title: The real battlefield is no longer answer quality alone
  body: The strongest pattern across the fetched corpus is convergence. Search products are becoming workspaces, workspaces are becoming agent systems, and browsers are becoming AI control surfaces. Genspark is in the middle of that convergence, which is opportunity and risk at the same time.
  claimRefs:
  - CP005
  - CP006
  - CP021
  - CP028
  - CP037
  - CP052
- calloutType: strength
  title: Genspark has unusually clear public packaging for an early AI workspace
  body: Compared with many rivals that hide enterprise economics, Genspark clearly exposes a multi-seat team plan, admin controls, model access, storage, and security positioning. That transparency can accelerate trials and procurement conversations even if it does not solve distribution by itself.
  claimRefs:
  - CP001
  - CP002
  - CP039
- calloutType: risk
  title: Distribution and legal pressure may matter more than model novelty
  body: Google and Microsoft already control major access points, while Perplexity is trying to own a browser and simultaneously fighting publisher litigation and monetization skepticism. If Genspark cannot secure habitual workflow or browser access, it risks remaining one more tool users sample rather than the place they stay.
  claimRefs:
