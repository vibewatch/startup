tables:
- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: 'Covers the major public alternatives visible in the fetched 2026 competitor corpus: direct answer/work peers, incumbent search platforms, enterprise work-AI analogs, and browser-surface entrants. It excludes smaller niche copilots and undisclosed internal builds.'
  columns:
  - Competitor
  - Category
  - Public scale / funding
  - Target segment
  - Differentiation
  - Limitation versus Genspark
  rows:
  - - Genspark
    - Direct AI workspace / former answer engine
    - Team plan public at $30/user/month; 70+ models; 2-150 seat plan disclosed
    - Prosumers, teams, and emerging enterprise buyers
    - Broad artifact creation plus research under one workspace
    - Far smaller public distribution footprint than Google, ChatGPT, or Bing
  - - Perplexity
    - Direct answer engine plus browser and enterprise
    - 2026 reporting cites $18B valuation; Comet limited to Max subscribers and invitees
    - Consumers, knowledge workers, and enterprise teams
    - Strong answer brand plus Comet browser and enterprise expansion
    - Legal pressure from publishers and ad-scale uncertainty
  - - OpenAI / ChatGPT
    - Direct substitute across search and work AI
    - ~400M users cited by Digiday; broad Business and Enterprise packaging
    - Consumers, developers, and businesses
    - Most familiar general-purpose AI work surface with search built in
    - Does not own default browser distribution like Google or Microsoft
  - - Google Search / AI Mode
    - Incumbent search and answer platform
    - AI Overviews at 1.5B users in 200 countries; >10% query growth on covered query types
    - Mass-market consumers and advertisers
    - Default behavior, search index depth, and integrated AI Mode
    - Quality incidents and antitrust remedies constrain behavior
  - - Bing / Copilot Search
    - Incumbent challenger with browser tie-in
    - Microsoft-controlled search and Edge distribution; exact public user counts not disclosed here
    - Consumers and Microsoft ecosystem users
    - Cited answers inside Bing plus explicit Edge reinforcement
    - Lower public mindshare than Google and ChatGPT
  - - Glean
    - Enterprise work-AI analog
    - $100M ARR, customer base more than doubled, $7.2B valuation, >850 team members
    - Large enterprises buying grounded work AI
    - Deep enterprise context, 100+ connectors, permissions-aware search and agents
    - Pricing is not public and consumer discovery is weak
  - - You.com
    - Adjacent search infrastructure / API substitute
    - API-led pricing with no minimums and enterprise controls
    - Developers, agent builders, and enterprise platform teams
    - Lets buyers build on search and extraction infrastructure instead of a branded assistant
    - Less visible as a consumer destination than earlier answer-engine peers
  - - Dia / Arc / browser entrants
    - Adjacent browser surface
    - Browser Company publicly backs both Dia and Arc; public scale metrics not disclosed
    - Power users and browser-led researchers
    - Owns interface habit and browsing context rather than just answer output
    - Still early versus default browsers and major AI platforms
  notes: 'Rows intentionally compare heterogeneous rivals on the job-to-be-done: answer finding, workflow execution, enterprise grounding, and browser control. Public scale disclosure is uneven across the set.'
