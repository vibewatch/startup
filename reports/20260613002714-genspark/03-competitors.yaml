  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: genspark-retention
    missingEvidence: Cohort retention, DAU/WAU/MAU, and multi-homing rates for Genspark across consumer and team cohorts.
    whyItMatters: Without usage concentration data, the chapter cannot prove Genspark escapes sampling behavior and becomes a durable daily workflow surface.
    diligencePath: Request internal retention cohorts, repeat task completion rates, and share of sessions that end in exported artifacts or paid-seat expansion.
    relatedQuestionRefs:
    - QP024
    - QP026
  - type: private-evidence-only
    severity: material
    topic: genspark-enterprise-economics
    missingEvidence: Realized contract value, average seats per team account, and net seat expansion versus the public team-plan list price.
    whyItMatters: Competitive durability depends on whether transparent list pricing converts into enterprise adoption and whether customers expand after initial trial.
    diligencePath: Request cohort-level account counts, ACV ranges, expansion curves, and discounting policy by segment.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: browser-agent-adoption
    missingEvidence: Independent adoption data for Dia, Comet, and other browser-native agents beyond product-launch announcements.
    whyItMatters: The browser thesis is strategically important but still early, so current positioning depends more on product intent than on validated user share.
    diligencePath: Refresh on the next run with user, waitlist, or engagement disclosures from browser entrants and independent traffic estimates.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: enterprise-win-loss
    missingEvidence: Win-loss reasons for Genspark versus Perplexity, ChatGPT Business, and Glean in real enterprise procurement cycles.
    whyItMatters: Public marketing pages show intended positioning, but not whether buyers actually prefer Genspark on trust, output quality, or total cost of ownership.
    diligencePath: Request lost-deal analysis, proof-of-concept outcomes, security review pass rates, and average deployment time by segment.
