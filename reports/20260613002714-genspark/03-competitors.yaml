- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk dimension
  - Current read for Genspark
  - Threat
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Workspace breadth
    - Moderate
    - ChatGPT and Perplexity also expand from answers into action and workflow
    - Multiple peers are bundling search with execution rather than staying answer-only
    - High
    - Measure task completion, repeat usage, and whether users rely on Genspark for finished work rather than spot answers
  - - Transparent pricing
    - Moderate strength
    - Incumbents can subsidize AI from adjacent products even with opaque pricing
    - Genspark shows a clean seat plan, but Google/Bing are free and ChatGPT bundles search inside larger plans
    - Medium
    - Track enterprise win rate where explicit pricing helps versus where bundle discounts overwhelm it
  - - Enterprise trust controls
    - Moderate
    - Glean and OpenAI are further along on enterprise packaging and control language
    - Genspark has SOC 2 and ISO claims, but broader enterprise reference depth is thinner than Glean's
    - Medium
    - Request customer retention, deployment size, and security review cycle evidence
  - - Distribution access
    - Weak to moderate
    - Google, Microsoft, and browser entrants own default or habitual access points
    - AI Overviews, Edge+Bing, Comet, and Dia all indicate browser/search control matters
    - High
    - Clarify whether Genspark pursues browser extension, OEM distribution, or enterprise channel partnerships
  - - Multi-homing pressure
    - Adverse
    - Users can test many consumer AI tools at low cost and low switching friction
    - Most front-end rivals offer free or easy entry points, while files and browser defaults live elsewhere
    - High
    - Show active-user concentration, workspace retention, and percentage of output finalized in Genspark
  - - Category legal and monetization risk
    - Adverse but external
    - Publisher suits, ad skepticism, and antitrust remedies can reshape the field quickly
    - Perplexity lawsuits and Google remedies demonstrate that the category is strategically valuable but unstable
    - Medium
    - Model scenarios where search referral economics, distribution rules, or content access norms change
  notes: Severity reflects the next 24–36 months of competitive durability, not an investment recommendation. Several rows remain constrained by missing usage-retention and customer-mix data.
