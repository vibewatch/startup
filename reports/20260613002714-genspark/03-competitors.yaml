- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public contract model
  - Public price / unit
  - Included capabilities
  - Unknowns / discount caveat
  - Competitive implication
  rows:
  - - Genspark
    - Seat-based team subscription
    - $30/user/month for 2-150 users
    - 12,000 credits/seat, admin controls, SSO/SAML, AI chat, image, video, audio, storage
    - Enterprise bespoke pricing beyond team plan not disclosed
    - Transparent packaging helps procurement and trial conversion
  - - Perplexity
    - Consumer subscription plus ads plus enterprise
    - Perplexity Pro at $20/month or $200/year; Comet access starts with Max subscribers
    - Answer engine, subscriptions, sponsored follow-up questions, enterprise and Comet add-ons
    - Enterprise rate card not public; Max price not surfaced in fetched sources
    - Shows multiple monetization experiments but also business-model uncertainty
  - - ChatGPT
    - Consumer, business, and enterprise plans
    - Enterprise custom pricing; Business plan publicly packaged but exact extracted seat price not reliable from fetched text
    - Search, advanced models, 60+ app integrations, business controls, enterprise privacy and data residency
    - Exact current Business seat price was not cleanly extractable from fetched page text
    - Strong bundle pressure because search is included inside a broader work surface
  - - Google
    - Free consumer search monetized by ads; AI Mode within Search
    - No direct user fee disclosed for Search or AI Mode here
    - AI Overviews, AI Mode, links, and search ecosystem access
    - Paid Gemini or Workspace layers are outside this table's fetched package set
    - Can subsidize AI answers with incumbent distribution and ad economics
  - - Bing / Copilot Search
    - Free search and answer surface inside Microsoft ecosystem
    - No public user fee disclosed on fetched page
    - Summarized cited answers plus Edge tie-in and other Bing AI features
    - Commercial terms for broader Microsoft bundles not covered here
    - Free default discovery keeps switching cost low for users but high for challengers
  - - Glean
    - Enterprise custom contract
    - Not publicly disclosed
    - Work AI, enterprise search, connectors, agents, model choice, security
    - Realized enterprise pricing and expansion economics remain private
    - Opaque pricing is normal for large-enterprise sales, but slows simple comparison
  - - You.com
    - Usage-based API pricing
    - $5/1k search calls, $1/1k pages, $12 research tier, $110 finance research tier
    - Search API, live crawl, page extraction, cited research, enterprise controls
    - Front-end assistant packaging is less emphasized than API infrastructure
    - Creates a substitute path where buyers build rather than buy a branded workspace
  - - Dia / Arc
    - Browser product surface
    - No public price disclosed in fetched corpus
    - AI browser experience with Arc lineage and security messaging
    - Commercial model is not yet clear from fetched pages
    - Early browser entrants can win habit before revealing monetization
  notes: Public pricing is inconsistent across the category. This table compares what buyers can actually observe today rather than inferring private contract economics.
