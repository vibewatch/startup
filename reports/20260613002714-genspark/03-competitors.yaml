- id: adverse-evidence-and-durability
  title: Adverse competitor evidence and moat durability
  body: 'The most important competitive evidence is adverse, not promotional. Perplexity’s ad rollout and browser expansion prove ambition, but both TechCrunch and Digiday show that monetization is still unsettled: the company itself said subscriptions alone are not enough for sustainable publisher revenue share, while marketers continue to cite low scale, unclear ROI, brand safety, and CPM efficiency concerns. More seriously, Reuters and TechCrunch document growing publisher litigation from CNN and The New York Times, including claims that Perplexity reproduced or repackaged copyrighted content and even hallucinated attribution. Google’s situation is different but not cleaner. Its scale is unmatched, yet it had to tighten AI Overview triggering and guardrails after embarrassing errors, and the Justice Department’s remedies make explicit that Google’s historical distribution contracts and control of search access points were anti-competitive. OpenAI’s risk is less legal in this chapter than
    structural: ChatGPT search is strong, but it does not own the browser default in the way Google, Microsoft, Perplexity Comet, or Dia may eventually do. Glean looks strongest on enterprise durability because its moat is operational context, connectors, security, and workflow grounding, though even there the competitive pressure is toward commoditizing core retrieval and bundling it into broader work stacks. The bottom line is that Genspark has room to win as a fast-moving workspace challenger, but its moat will be fragile unless it proves either superior enterprise context, superior browser or distribution access, or a team workflow that users stop multi-homing away from.'
