companyProfile:
  summary: Genspark is a Palo Alto-based AI company founded in 2023 that began as a Sparkpages-style search engine and then pivoted into a broader agentic workspace platform. The current product suite spans research, slides, spreadsheets, media generation, voice, and cloud-computer automation, with official materials claiming more than $100M ARR by January 2026 and a run-rate above $200M by March 2026. Founder pedigree from Microsoft, Google, and Baidu gives the product story credibility, but public disclosure still lags the speed of the financing and growth narrative.
  foundedDate: '2023-01-01'
  founders:
    - name: Eric Jing
      role: CEO & Co-founder
      background: Former Microsoft Bing and Baidu search/AI product leader.
      claimRefs: [CO001, CO009]
    - name: Kay Zhu
      role: CTO & Co-founder
      background: Former Google and Baidu search engineer and the public architect of Genspark's Super Agent pivot.
      claimRefs: [CO001, CO010, CO026]
    - name: Wen Sang
      role: COO & Co-founder
      background: MIT PhD and former founder of Smarking, adding enterprise operating experience.
      claimRefs: [CO012, CO013]
  foundingLocation: Palo Alto, CA
  headquarters: Palo Alto, CA
  productSummary: Multi-model AI workspace for knowledge workers, combining deep research, slides, spreadsheets, media, voice, custom agents, and Genspark Claw cloud-computer execution.
  customerFocus: Knowledge workers, SMB teams, and enterprise departments using AI for research, document creation, sales, operations, and workflow automation.
  businessModel: Freemium and seat-based subscriptions with a public Team Plan at $30 per user per month, plus higher-value business and enterprise expansion.
  stage: Series B / extension phase
  fundingStatus: Public reporting supports a 2025 unicorn Series B and a March 2026 extension to roughly $1.6B valuation; later June 2026 secondary coverage cites a further extension to $2.6B, which still requires primary confirmation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO018, CO021, CO022, CO026, CO029, CO030, CO031, CO032]
