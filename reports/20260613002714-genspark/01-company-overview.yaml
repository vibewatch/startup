company:
  name: Genspark
chapter:
  number: 1
  title: Company Overview
  summary: Genspark has evolved from a 2024 AI-search challenger into a fast-scaling agentic workspace vendor with a Palo Alto base, Asia expansion, and unusually rapid funding velocity. Public evidence supports the 2024 seed and 2025 unicorn financing; 2026 revenue and valuation claims are strong but still rely heavily on company-issued releases and lagging third-party databases.
sections:
- id: founding-identity
  title: Founding, identity, and current positioning
  body: Genspark started in 2023 as an AI-native search startup built by leaders who had already spent years inside major search platforms. TechCrunch’s launch coverage framed the company as a new answer-engine entrant generating single-page Sparkpages from web content, while current official surfaces position the business much more broadly as an all-in-one AI workspace. That pivot matters because the company is no longer selling only better search results; it is selling finished work across research, slides, spreadsheets, media, and voice interfaces. Public corporate materials also show that the MainFunc and Genspark entities sit behind the service, providing a clearer legal footprint than a typical stealth AI startup. As of the run date, the most stable identity facts are that Genspark is headquartered in Palo Alto, built around the Genspark.ai product surface, and still retains MainFunc branding in corporate materials. The homepage, sitemap, and product pages also show the company serving
    a multilingual audience rather than a single-market US niche.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO001
  figureRefs:
