- id: trust-and-adverse-context
  title: Trust controls and adverse context
  body: Publicly, Genspark is trying to pair aggressive product velocity with enterprise trust signals. The business page advertises SOC 2 Type II and ISO 27001 certification, while the privacy policy names Microsoft Azure and major model vendors such as OpenAI, Anthropic, Google, xAI, and ElevenLabs. Those disclosures support a narrative of increasingly enterprise-ready infrastructure. However, the company’s first-generation search product also generated early warnings. TechCrunch documented that the 2024 engine could recommend weapons in response to a homicide query, lacked a reporting mechanism for problematic Sparkpages, and left content-licensing economics unresolved. That matters even though the product was later sunset because it shows Genspark’s speed can outrun governance and safety controls. Investors should therefore read current trust claims as progress, not proof that execution risk has been eliminated. The company looks more mature in 2026 than it did at launch, but the diligence
    case still depends on verifying whether governance and operational controls are keeping pace with growth.
  claimRefs:
  - CO034
  - CO035
  - CO036
  - CO037
  - CO038
