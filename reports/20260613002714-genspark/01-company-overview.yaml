- id: leadership-governance
  title: Founders, leadership, and operating bench
  body: Founder pedigree is one of Genspark’s clearest strengths. Eric Jing came from Microsoft Bing and later ran core search and AI product work at Baidu, while Kay Zhu previously worked on Google and Baidu search before co-building Xiaodu with Jing. That shared background makes Genspark’s original search orientation and later move into agentic workflows more believable because the founding team had already worked on search quality, consumer interfaces, and hardware-adjacent AI systems. Forbes adds Wen Sang as co-founder and COO, bringing prior enterprise software experience through Smarking. Public evidence still leaves gaps around formal board composition, observer rights, and independent governance, but the disclosed leadership set suggests stronger commercial coverage than a pure research startup. Company press materials further broaden the stated talent mix to veterans from Microsoft, Google, Meta, YouTube, and Pinterest, reinforcing the view that Genspark is trying to scale from
    a founder-led product organization into a full operating company.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  tableRefs:
  - TO002
- id: capital-formation
  title: Funding history and valuation progression
  body: The funding story is the main reason Genspark merits diligence despite limited audited disclosure. Independent reporting clearly supports a $60 million seed round in 2024 led by Lanchi Ventures, a $100 million Series A in February 2025 at a $530 million valuation, and a $275 million Series B in November 2025 at a $1.25 billion valuation. Those data points alone show one of the fastest rises from launch to unicorn status among AI application companies. After that, the evidence becomes noisier. January and March 2026 company-issued releases lifted reported Series B proceeds to more than $300 million and then $385 million while claiming ARR acceleration and a valuation near $1.6 billion. Third-party databases partially corroborate the valuation but still disagree on aggregate funding, while a June 2026 SaaS trade summary citing Axios pushed the valuation to $2.6 billion and total funding above $645 million. For diligence purposes, the 2024–2025 financing path is high confidence, while
    2026 extension math should be treated as directionally strong but still subject to cap-table verification.
  claimRefs:
