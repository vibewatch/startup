  evidenceGaps:
  - id: EGU001
    type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Public NRR, GRR, logo churn, seat-retention, and cohort renewal data by plan and segment.
    whyItMatters: Without durability metrics, it is impossible to tell whether the visible customer breadth compounds economically or merely looks broad because many trial and community surfaces exist.
    diligencePath: Request monthly and annual retention cohorts, seat-retention curves, revenue churn, and renewals for Free/Plus/Pro, Team, and Enterprise accounts.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - id: EGU002
    type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer concentration, enterprise-logo count, and revenue mix by individual, Team, and Enterprise segments.
    whyItMatters: The retained set shows only three named customers. A small number of large accounts could matter disproportionately, but public materials give no way to quantify that exposure.
    diligencePath: Request top-10 customer concentration by ARR and gross profit, plan-mix ARR bridge, and the exact enterprise-logo count behind the >1,000-organization claim.
    relatedQuestionRefs:
    - QU023
    - QU024
    - QU025
    relatedTableRefs:
    - TU002
    - TU006
  - id: EGU003
    type: enumeration-incomplete
    severity: minor
    topic: named-proof-coverage
    missingEvidence: A larger public named-customer registry beyond Spyglaz AI, GEOPARK, and ADK Marketing Solutions.
    whyItMatters: The customer story could be stronger if Genspark exposed more public proof across additional verticals, geographies, and contract sizes.
    diligencePath: Ask management for a reference list with at least ten production customers, each with seat count, use case, start date, renewal status, and quantifiable outcomes.
    relatedQuestionRefs:
    - QU005
    - QU006
    - QU020
    relatedTableRefs:
    - TU003
  - id: EGU004
    type: adverse-unresolved
    severity: material
    topic: support-and-billing-friction
    missingEvidence: Management response metrics for billing disputes, cancellation requests, export failures, and support SLAs in practice.
    whyItMatters: Public adverse reviews are unusually specific about credit drain, cancellation friction, export issues, and support delays. Without operating metrics, investors cannot judge whether these are isolated complaints or a systemic churn driver.
    diligencePath: Request complaint rate, refund rate, average first-response time, export-failure rate, and the share of credits reversed after failed tasks.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU025
    relatedTableRefs:
    - TU005
    - TU006
  - id: EGU005
    type: private-evidence-only
    severity: material
    topic: deployment-depth-gap
    missingEvidence: Active-seat counts, module attach rates, and cross-surface usage depth by cohort.
    whyItMatters: Genspark clearly has many surfaces—mobile, browser, voice, chat, slides, sheets, and cloud-computer execution—but public evidence does not show how deeply those surfaces embed inside retained accounts.
    diligencePath: Request seat counts, active-seat ratios, module attach rates, and cross-surface usage distributions for the top customer cohorts.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU004
    - TU006
