- id: expansion-concentration-procurement
  title: Expansion paths, procurement friction, and concentration opacity
  body: 'Genspark''s most visible expansion motion is product and seat breadth rather than classic module upsell metrics. A user can start on a self-serve plan, upgrade within web or mobile billing, move into a Team plan with member invites and centralized admin, and then escalate into Enterprise for custom contracting, data residency, and SLA-backed support. The platform also widens inside a logo through multiple work surfaces: AI Slides and AI Sheets target presentation and analysis workflows, Speakly provides voice entry, the Chrome extension adds in-browser automation, and Claw moves work into Slack, Teams, WhatsApp, LINE, and Telegram. Japan expansion with local customer support and success resources is another visible expansion lever because it reduces localization and onboarding friction for larger accounts. [CU003] [CU004] [CU011] [CU012] [CU030] [CU031] [CU032] [CU033] [CU034] [CU036] [CU037] [CU043] [CU044]


    The hard part is concentration and revenue quality. Public sources never disclose the enterprise-logo count inside the ''1,000 organizations'' claim, the percentage of ARR from consumer or prosumer subscriptions versus teams and enterprises, or the contribution of any named customer. Even the named proof itself is thin enough that a single flagship logo can look more important than it may actually be. The visible review friction around credits, billing, support, and export quality also raises the possibility that some expansion attempts stall before they become durable high-value accounts. Procurement optics are generally favorable—DPA, residency, VPC, SLA, SSO, and admin controls exist—but concentration, plan mix, and account expansion remain mostly opaque. [CU006] [CU020] [CU021] [CU033] [CU034] [CU039] [CU041] [CU042] [CU044]'
