- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Bottom-up to team upsell
    - Free / Plus / Pro plans exist alongside Team plans with centralized admin and seats
    - Creates a visible self-serve-to-team funnel
    - Request conversion rates from individual paid accounts into Team logos
  - - Team to enterprise upsell
    - Enterprise starts at 151+ users with custom contracts, data residency, and dedicated support
    - Can lift ACV and reduce churn if accounts standardize on Genspark
    - Request team-to-enterprise conversion history and average time-to-expand
  - - Workflow-surface expansion
    - Slides, Sheets, Speakly, Chrome extension, Claw, and mobile app cover multiple daily jobs
    - Multi-surface adoption can deepen switching costs
    - Request attach rates across major modules and surfaces by cohort
  - - Geographic expansion
    - Japan launch with local customer support and success resources
    - Supports international enterprise growth
    - Request regional customer counts, retention, and pipeline conversion
  - - Procurement-friction reduction
    - DPA, data residency, dedicated VPC, SLA, SSO, and admin controls are publicly described
    - Improves fit for larger and regulated buyers
    - Ask which of these controls are actually used by current customers
  - - Revenue-mix opacity
    - No public split between individual, Team, and Enterprise revenue
    - Prevents underwriting customer quality and margin by segment
    - Request ARR, logo count, and seat count by plan type
  - - Customer concentration opacity
    - No public top-customer or top-10 mix despite a thin named-logo set
    - A small number of large logos could matter more than public materials suggest
    - Request top-10 concentration by ARR and gross profit plus named-logo tenure
  - - Adverse review spillover
    - Trustpilot, Deckary, Cybernews, and Product Hunt all surface concerns around credits, support, or exports
    - Could slow expansion or increase refund / support burden
    - Request complaint rates, refund rates, export-failure rates, and support response metrics
