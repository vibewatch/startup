chapter:
  number: 6
  title: Customers
  summary: 'Genspark''s public customer evidence supports a three-layer customer base—individual users, self-serve teams, and procurement-led enterprises—but public durability disclosure lags adoption claims. The strongest proof is official named customer testimony from Spyglaz AI, GEOPARK, and ADK Marketing Solutions plus top-line adoption signals such as more than 1,000 organizations, 1K customers on GetLatka, 3.4K iOS ratings, and visible Product Hunt traction. The weakest areas are retention, concentration, and paid-deployment depth: public sources do not disclose NRR, GRR, renewal cohorts, active seats, or revenue mix by plan, while independent review surfaces show recurring complaints about billing clarity, support responsiveness, and export quality.'
sections:
- id: segmentation-buyer-user-payer
  title: Customer base segmentation by buyer, user, payer, geography, and channel
  body: 'Genspark''s public surfaces imply three distinct paying motions rather than one monolithic customer profile. At the bottom end are individual knowledge workers and creators who can buy Free, Plus, or Pro plans directly on web or mobile and use Genspark through the iOS app, Speakly, or browser surfaces. In the middle are self-serve teams, where the payer is usually an admin or manager buying 2-150 seats with centralized billing, SSO/SAML, member roles, and connector controls. At the top end are enterprise accounts with 151+ users, custom contracts, wire-transfer billing, data residency, dedicated VPC options, and customer-success support. [CU003] [CU004] [CU011] [CU012] [CU017] [CU018] [CU019] [CU033] [CU034]


    The named proofs help clarify buyer and user roles. Spyglaz AI''s founder describes boardroom-ready presentation output and faster time to market, which points to founder-led or GTM-led buying for polished deliverables. GEOPARK''s CIO says internal users quickly asked for enterprise access, suggesting that day-to-day users are knowledge workers but the payer is centralized IT or operations. ADK Marketing Solutions adds geography and use-case specificity: a Japanese marketing agency used the product to reduce data analysis and document creation work, reinforcing that consulting, advertising, and adjacent knowledge-work teams are current target customers. Geography looks intentionally broad—North America, Europe, and Asia are repeatedly named—but the company does not disclose customer count or ARR by region, plan, or vertical. [CU001] [CU002] [CU006] [CU007] [CU008] [CU027] [CU029] [CU039]'
