- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Price / unit / contract
  - What is included publicly
  - Discounts / unknowns
  - Source implication
  rows:
  - - Team Plan
    - $30 per seat per month
    - 2–150 users, 12,000 credits per seat, 60 GB AI Drive, admin controls, SSO/SAML, model access
    - Promo zero-credit chat/image usage valid through Dec. 31, 2026; realized discounts unknown
    - Best public evidence of list pricing and current seat economics
  - - Enterprise Plan
    - Contact sales / negotiated Order Form
    - 151+ users, 25,000 credits per seat, 99.9% SLA, data residency, DPA, dedicated support
    - No public list price; commercial rights and terms negotiated per Order Form
    - Pricing opacity means public ARR cannot be converted into logo counts reliably
  - - Plus membership
    - Dollar price not exposed in fetched help pages; starts at 10,000 credits per month
    - 50 GB storage, unlimited core chat, unlimited image generation, full model access
    - Annual plan saves ~20%; tiered pricing exists but public dollar ladder is not visible here
    - Consumer monetization exists, but ARPU is not underwritable from public pages alone
  - - Pro membership
    - Dollar price not exposed in fetched help pages; starts at 125,000 credits per month
    - 1 TB storage, premium image models, full model access
    - Tiered credits above the starting point; annual discount exists; list dollars are not visible here
    - Higher-usage prosumer tier likely matters for power-user economics
  - - Credit packs
    - 10,000 credits per pack
    - Extra usage beyond included seat allocation
    - Pack price not public in fetched materials; member balances do not roll over or transfer
    - Upsell exists but revenue per incremental pack is undisclosed
  - - AI Note Taker
    - Credits per meeting minute
    - Bot joins Zoom/Meet/Teams/Webex/GoToMeeting; summary plus actions
    - Per-minute rate is not disclosed publicly
    - Feature-level usage billing confirms a consumption-based layer
  - - Cloud Computer / Claw
    - Starting from $9.99 per month (limited-time marketing)
    - Dedicated cloud computer plus Claw workflow automation
    - Full tier price card is not public; some Claw actions also use shared credits
    - Suggests Genspark is introducing infrastructure subscriptions in addition to AI seats
  notes: Public materials provide transparent price points only for Team Plan and entry Cloud Computer marketing; most consumer and enterprise list prices remain incomplete, so this table distinguishes disclosed mechanics from missing commercial detail.
