chapter:
  number: 4
  title: Financials
  summary: 'Genspark’s public financial story is impressive but uneven: official materials show a fast-expanding mix of seat subscriptions, credits, and new Cloud Computer monetization, while company-claimed ARR jumped from $100M to $200M between January and March 2026; however, cash balance, burn, gross margin, and retention remain undisclosed, and several public datasets conflict on funding totals, compliance status, and headcount.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing architecture
  body: 'Genspark’s monetization has widened far beyond a single chat subscription. Current official materials show at least four visible layers: consumer memberships (Free, Plus, Pro), team seats, negotiated enterprise contracts, and add-on usage surfaces such as credit packs and Genspark Cloud Computer. The Team Plan is the clearest public list price at $30 per seat per month for 2–150 users, with 12,000 credits and 60 GB of storage per seat, while the enterprise tier shifts to negotiated pricing, larger seat allocations, invoice billing, and contract terms that look much more like conventional B2B software procurement. On the consumer side, Genspark discloses that Plus starts at 10,000 credits per month and Pro at 125,000 credits per month, but it does not publish the corresponding dollar price card in the fetched help-center materials. Claw adds a second subscription layer, starting from $9.99 per month for Cloud Computer access, while some actions still consume shared credits. That
    means the revenue model is a blended mix of seat subscriptions, usage metering, and infrastructure-linked upsells rather than pure SaaS.'
