- id: cost-structure-and-unit-economics
  title: Cost structure, gross-margin drivers, and unit economics
  body: 'The biggest underwriting question is not top-line demand but margin quality. Genspark now bundles or routes across 70+ models, and its own pages show explicit cost-bearing activities: note taking is billed per minute, image generation can be unlimited for paid users, video generation uses 14+ underlying models with model-specific credit costs, AI Sheets pulls external financial and web data, and Cloud Computer adds dedicated per-user infrastructure. Public comparables make the risk concrete. Google Cloud publishes token pricing for Gemini and separate grounding charges for search-heavy workflows, while Microsoft’s FY2025 10-K says Microsoft Cloud gross margin fell to 69% because of scaling AI infrastructure and that ongoing AI-infrastructure investment can reduce operating margins. Andreessen Horowitz likewise observes that many AI application companies run at only 50–60% gross margins because inference costs remain heavy. For Genspark, that does not prove a specific margin number,
    but it does show why list pricing alone cannot be treated as evidence of software-like economics. Public contradictions worsen the picture: headcount, total funding, and compliance status all diverge across sources.'
