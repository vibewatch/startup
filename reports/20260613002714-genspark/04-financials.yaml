tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Consumer memberships
    - Free-to-Plus/Pro subscriptions with monthly or annual billing
    - Account / month
    - Plus starts at 10,000 credits per month; Pro starts at 125,000 credits per month; annual billing saves ~20%, but fetched help pages do not expose corresponding list dollars
    - 'Medium: repeatable subscription model, but price card is partially opaque'
    - Request Plus/Pro price card, paid conversion, and ARPU by cohort
  - - Team Plan
    - Self-serve seat subscription for 2–150 users
    - Seat / month
    - Public list price is $30 per seat per month with 12,000 credits and 60 GB per seat
    - 'High relative to other streams: transparent recurring seat revenue'
    - Request actual paid-seat count, expansion rate, and discounting by cohort
  - - Enterprise Plan
    - Sales-assisted contract with negotiated pricing and terms
    - Seat / year or Order Form
    - 151+ user tier; price is negotiated; Order Form typically starts with 36-month initial term and invoice billing
    - 'Medium-high: longer contracts can improve durability, but list pricing is undisclosed'
    - Request signed-order-form examples, average ACV, and gross retention by cohort
  - - Credits and credit packs
    - Usage expansion beyond included seat allotments
    - 10,000-credit pack or per-feature credits
    - Credit packs are sold in 10,000-credit increments; some tools also meter usage directly in credits
    - 'Medium: useful upsell, but realized revenue depends on conversion and consumption behavior'
    - Request attach rate, breakage, and average paid-credit spend per active account
  - - Cloud Computer / Claw
    - Separate infrastructure subscription plus possible incremental credit use
    - Subscription + credits
    - Claw page markets Cloud Computer starting from $9.99 per month and help-center docs show three infrastructure tiers
    - 'Medium: can deepen monetization but also adds infrastructure intensity'
    - Request full Cloud Computer price card, attach rate, and infrastructure gross margin
  notes: This table separates recurring seat revenue from usage-linked and infrastructure-linked monetization; public materials disclose mechanics unevenly, so realized mix and revenue recognition must be confirmed directly.
