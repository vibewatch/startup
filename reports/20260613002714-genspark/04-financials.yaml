- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  - Urgency
  rows:
  - - Cash balance and monthly burn as of mid-2026
    - Without cash and burn, runway cannot be calculated even after a large Series B
    - Request CFO-certified balance sheet, cash waterfall, and 13-week cash forecast
    - Critical
  - - GAAP revenue recognition and deferred revenue policy
    - Blended seats, credits, and Cloud Computer subscriptions create recognition complexity
    - Request revenue-recognition memo, sample invoices, and deferred-revenue roll-forward
    - Critical
  - - Actual gross margin and COGS by product line
    - List pricing does not reveal whether unlimited usage and Cloud Computer are profitable
    - Request product-line P&L and vendor-spend breakdown by model/search/compute/storage
    - Critical
  - - NRR, gross retention, churn, and downgrade rates
    - ARR acceleration could mask heavy promo-driven churn without cohort data
    - Request cohort retention tables for Free→Paid, Paid→Paid, and Team/Enterprise expansions
    - Critical
  - - Realized ARPU / ACV by Plus, Pro, Team, Enterprise, and Claw
    - Needed to convert ARR headlines into customer quality and GTM efficiency
    - Request billing export with active subscribers, logos, seats, and realized price after credits/promos
    - Critical
  - - Customer concentration and seat distribution
    - 1,000 organizations says little about revenue concentration or whale dependence
    - Request top-20 accounts by ARR and seat count histogram
    - Material
  - - Cloud Computer full price card and utilization economics
    - Dedicated compute may be strategic, but it also changes margin and support cost structure
    - Request per-tier price list, utilization, uptime cost, and support burden per instance
    - Material
  notes: These are the main public-data gaps that prevent full financial underwriting; each one requires management or data-room disclosure rather than additional web research.
  enumerationScope:
    coverage: exhaustive
    basis: Systematic review of all fetched June 2026 pricing, launch, funding, and benchmark materials surfaces these seven gaps as the complete blocking set for a public-web-only financial underwriting of Genspark.
