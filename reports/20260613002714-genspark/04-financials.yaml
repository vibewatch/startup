- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Implication
  - Evidence quality
  - Diligence ask
  rows:
  - - Latest disclosed ARR milestone
    - $200M annual run rate in March 2026 after $100M ARR in January 2026
    - Top-line momentum is strong, but these are still company-claimed run-rate figures rather than audited revenue
    - Medium-high – corroborated across company, Business Wire, Yahoo, and Latka
    - Request audited revenue bridge from bookings/ARR to GAAP revenue
  - - Series B base round
    - $275M at $1.25B post-money valuation in November 2025
    - Shows the first clear late-stage capital anchor for the workspace pivot
    - High – corroborated by company, Forbes, and Tracxn
    - Confirm exact close date, use of funds, and investor rights
  - - Series B top-off / extension
    - $300M by January 2026; $385M by March 2026 at around $1.6B valuation
    - Company was still raising while product scope expanded from workspace to Cloud Computer / Claw
    - High – corroborated by multiple news and database sources
    - Reconcile chronology, instrument terms, and any tranched close mechanics
  - - Total funding
    - $545M across five rounds in Tracxn; Latka still shows $435M across three rounds
    - Public databases do not yet fully agree, which matters for cap-table and runway analysis
    - Medium – conflicting secondary sources
    - Request board-approved funding chronology and fully diluted cap table
  - - Cash on hand / monthly burn / runway
    - Not publicly disclosed
    - This is the main blocker to underwriting capital adequacy despite strong fundraising history
    - Low – no public balance-sheet disclosure
    - Request current cash balance, monthly burn, 13-week cash forecast, and any venture debt terms
  - - Use of March 2026 proceeds
    - Company says funding will scale Genspark Claw and Genspark Cloud Computer
    - Signals capital is being redeployed into more infrastructure-heavy product layers
    - Medium – official company statement only
    - Request infrastructure capex/opex plan, hiring plan, and margin expectations for the new products
  notes: Capital adequacy can be framed only directionally from public evidence because the company discloses fundraising milestones but not treasury position, debt, burn, or runway.
