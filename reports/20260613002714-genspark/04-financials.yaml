  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and board-approved runway forecast as of mid-2026.
    whyItMatters: Large fundraising milestones do not answer whether Genspark can fund Cloud Computer expansion without another round.
    diligencePath: Request CFO-certified balance sheet, 13-week cash forecast, and board materials discussing cash runway.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Actual gross margin, direct COGS by product line, and vendor-spend allocation across models, search, storage, and compute.
    whyItMatters: This is the core test of whether Genspark’s fast ARR growth creates software-like economics or infrastructure-heavy contribution margins.
    diligencePath: Request product-line P&L, vendor invoices, and management gross-margin bridge for consumer, Team, Enterprise, and Claw products.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, gross retention, churn, CAC, payback, and downgrade rates by cohort and plan.
    whyItMatters: Without cohort retention and sales-efficiency data, ARR acceleration could be promo-driven or capital-inefficient.
    diligencePath: Request cohort-level retention dashboards, CAC by channel, pipeline conversion, and payback analyses for Team and Enterprise motions.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: independent-traction
    missingEvidence: Independent traffic, subscriber, or active-user evidence that reconciles with the company’s post-pivot ARR narrative.
    whyItMatters: Public revenue claims are strong, but external usage corroboration remains thin and at least one major consumer ranking predates the claimed breakout.
    diligencePath: Request product analytics, paid-subscriber counts, active-seat counts, and third-party billing or payment-processor summaries.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: GAAP revenue-recognition policy, deferred-revenue roll-forward, and treatment of subscriptions versus usage credits and Cloud Computer services.
    whyItMatters: The product stack mixes recurring fees and metered services, so revenue quality cannot be assessed from ARR headlines alone.
    diligencePath: Request audited revenue-recognition memo, sample invoices, deferred-revenue schedules, and product-level contract terms.
    relatedTableRefs:
    - TI001
    - TI004
    - TI005
