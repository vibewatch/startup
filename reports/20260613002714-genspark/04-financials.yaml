- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Blended gross margin
    - Not publicly disclosed; likely constrained by multi-model inference and dedicated cloud-compute spend
    - Low – benchmarked, not disclosed
    - Core test of whether rapid ARR growth translates into durable software economics
    - Request actual gross margin by product line and COGS split by model, search, storage, and support
  - - Upstream model and search cost drivers
    - Google lists Gemini 3.1 Pro at $2 per 1M input tokens and $12 per 1M output tokens, plus $14 per 1,000 grounded-search overages
    - Medium – official vendor pricing, but Genspark mix is unknown
    - Shows why zero-credit promotions and unlimited usage can compress contribution margin
    - Request weighted model mix, effective API rates, and negotiated cloud-provider discounts
  - - Acquisition model
    - Hybrid self-serve plus enterprise sales plus extension/distribution funnel
    - Medium – directly visible in product surfaces
    - Different channels imply very different CAC and payback periods
    - Request CAC by channel, paid-marketing share, and enterprise sales-cycle length
  - - Revenue per customer / seat
    - Not publicly disclosed
    - Low – only org and customer counts are partial and conflicting
    - Needed to translate ARR claims into sustainable contract value
    - Request ACV/ARPU by Free, Plus, Pro, Team, and Enterprise segments
  - - Retention / expansion (NRR)
    - Not publicly disclosed
    - Low – no public cohort data
    - Rapid ARR growth is less valuable if churn or promo dependence is high
    - Request gross retention, NRR, seat expansion, and downgrade rates by cohort
  - - Cloud Computer contribution margin
    - Not publicly disclosed
    - Low – infrastructure and support cost unknown
    - Separate compute subscriptions can either improve monetization or create margin drag
    - Request per-tier Cloud Computer utilization, COGS, and support cost per active instance
  notes: Most unit-economics fields remain unavailable in public sources; this table uses only directly observed product mechanics and comparable cost benchmarks, not fabricated performance figures.
