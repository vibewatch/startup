companyProfile:
  summary: >-
    Genspark is a Palo Alto-based AI company founded in 2023 that began as a Sparkpages-style search engine and then
    pivoted into a broader agentic workspace platform. The current product suite spans research, slides, spreadsheets,
    media generation, voice, and cloud-computer automation, with official materials claiming more than $100M ARR by
    January 2026 and a run-rate above $200M by March 2026. Founder pedigree from Microsoft, Google, and Baidu gives the
    product story credibility, but public disclosure still lags the speed of the financing and growth narrative.
