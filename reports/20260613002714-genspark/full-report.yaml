      - number: '6.2'
        title: Adoption trajectory and public scale signals
        blocks:
          - type: paragraph
            body: >-
              The clearest public adoption story is rapid breadth, not measured deployment depth. Genspark says more
              than 1,000 organizations began using its business platform after the late-November launch of Team and
              Enterprise plans, and multiple follow-on writeups repeat that claim while tying it to North America,
              Europe, and Asia expansion. GetLatka separately lists Genspark at roughly 1K customers and 41 employees in
              2026. On the consumer and prosumer side, the iOS app shows 3.4K ratings at 4.7/5, while the original
              Product Hunt launch ranked #2 for the day with 147 upvotes, 46 comments, 114 followers, and a 5/5 rating
              from four launch users. [CU006] [CU010] [CU013] [CU014] [CU017] [CU020] [CU028] [CU029]


              Those signals establish that Genspark is well beyond pilot stage, but they do not provide the denominators
              investors normally want. The company discloses ARR milestones—over $100M within nine months and over $200M
              within eleven months—but does not bridge those numbers to active seats, paid conversion, enterprise-logo
              count, product attach, or retention by cohort. The result is a customer story with strong top-of-funnel
              and community visibility but weak visibility into how many users become durable, expanding, high-value
              accounts. Even the adverse Trustpilot page is useful in this context: 37 public reviewers is meaningful
              enough to show real paid usage, yet still far too small and too self-selected to stand in for churn data.
              [CU006] [CU009] [CU010] [CU013] [CU017] [CU020] [CU028] [CU029] [CU040] [CU042]
