      - number: '6.4'
        title: Retention, satisfaction, and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is mixed and notably weaker than adoption evidence. Positive signals exist:
              Product Hunt reviewers describe time savings and useful structured research outputs, the iOS app carries a
              strong 4.7/5 rating from 3.4K ratings, and Cybernews argues the platform best fits creators, marketers,
              and researchers who need polished, structured outputs. These signals suggest that at least some users are
              getting repeat value. The Team and Enterprise materials also show the infrastructure for durable
              accounts—member management, analytics, connectors, and enterprise support—even if those features do not
              prove renewals on their own. [CU015] [CU017] [CU023] [CU033] [CU034]


              The adverse side is impossible to ignore. Trustpilot's archived February 2026 page rates Genspark at 1.9/5
              from 37 customers, with repeated complaints about cancellation friction, broken exports, credits being
              consumed on failed tasks, and unresponsive support; one corporate buyer explicitly says account-login
              constraints made the paid plan unusable for team sharing. Product Hunt's review summary and independent
              writeups from Cybernews and Deckary also warn about hallucinations, source-support issues, pricing
              opacity, export cleanup, and billing or support concerns. Most importantly, no public source discloses
              NRR, GRR, churn, renewal rate, active-seat retention, or cohort durability. The chapter can therefore
              support a real-usage conclusion, but not a fully underwritten durability conclusion. [CU016] [CU020]
