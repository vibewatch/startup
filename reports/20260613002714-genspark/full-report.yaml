              The hard part is concentration and revenue quality. Public sources never disclose the enterprise-logo
              count inside the '1,000 organizations' claim, the percentage of ARR from consumer or prosumer
              subscriptions versus teams and enterprises, or the contribution of any named customer. Even the named
              proof itself is thin enough that a single flagship logo can look more important than it may actually be.
              The visible review friction around credits, billing, support, and export quality also raises the
              possibility that some expansion attempts stall before they become durable high-value accounts. Procurement
              optics are generally favorable—DPA, residency, VPC, SLA, SSO, and admin controls exist—but concentration,
