  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR quality breaks
        - Verified ARR or recurring-revenue equivalent is materially below $140M
        - Current price no longer clears disciplined premium bands
        - Move to avoid unless entry price resets
      - - Margin quality disappoints
        - Gross margin looks closer to infrastructure-heavy AI wrappers than to premium software
        - Premium multiple case weakens even if growth stays strong
        - Re-cut valuation on lower public-software bands
      - - Retention is weak
        - NRR and gross retention fail to show durable workflow embedment
        - The moat argument weakens and distribution risk rises
        - Demand sharper discount or pause
      - - Round terms are investor-protective
        - Preferences, structure, or secondary mix reduce common-equity upside
        - Headline valuation overstates economics for new money
        - Do not rely on mark alone; re-underwrite ownership outcomes
      - - Bundled competition wins
        - OpenAI, Microsoft, Google, or peers capture the same workflow in default surfaces
        - Pricing power and acquisition efficiency compress quickly
        - Assume lower long-term multiple and slower growth
    notes: >-
      These are the smallest number of variables that can most quickly move Genspark from premium-AI candidate to
      overvalued narrative stock.
