  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: hybrid search, workflow, and browser surfaces'
        blocks:
          - type: paragraph
            body: >-
              The evidence does not support calling Genspark a pure web-search startup anymore, but it also does not
              support treating it as just another generic copilot. Chapter 1 already showed management killed a
              five-million-user AI-search product because fixed-workflow search looked strategically narrow next to a
              broader Super Agent workspace. That matters for market definition. The closest paid budget pool is
              enterprise search and work-AI software, where buyers spend to reduce information friction across
              fragmented applications. The closest distribution pool is consumer answer-search, where challengers must
              win attention against Google, Bing, and ChatGPT. A third adjacent layer is the emerging browser-and-agent
              surface, where Arc Dia and Perplexity Comet suggest search, browsing, and task execution are collapsing
              into one interface. Genspark should therefore be valued against a hybrid market boundary with explicit
              inclusions and exclusions, not a single inflated TAM label.
