        title: Capital adequacy, evidence gaps, and verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is therefore easier to frame directionally than precisely. The public funding chronology
              points to a company that has been well capitalized—$275M at a $1.25B valuation in November 2025, a top-off
              to $300M by January 2026, and then a Series B extension to $385M and roughly $1.6B valuation by March
              2026. Tracxn aggregates total funding at $545M across five rounds, while Latka still shows $435M across
              three rounds, making chronology reconciliation itself a diligence task. The company says March 2026
              proceeds will fund Claw and Cloud Computer scale-out, which is consistent with a strategy that likely
              raises infrastructure spend before it improves margin mix. What remains missing are the core underwriting
              numbers: cash on hand, monthly burn, runway, deferred revenue, GAAP recognition policy, realized ARPU by
              plan, NRR, churn, and customer concentration. The financial verdict is therefore mixed. Genspark has
              credible top-line momentum and monetization breadth, but until management discloses actual gross margin
              and cash-runway data, the business should be treated as high-growth but still infrastructure-sensitive and
              financing-dependent.
