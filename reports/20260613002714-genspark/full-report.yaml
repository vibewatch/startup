          type: platform
          risk: Model availability, pricing, or policy changes can change capability and cost.
        - id: d3
          label: Cloud and local compute
          type: infrastructure
          risk: Cloud Computer scale and local desktop permissions both affect task completion and safety.
        - id: d4
          label: Connector sessions and APIs
          type: integration
          risk: Expired OAuth tokens or partner API changes can break workflows silently.
        - id: d5
          label: Browser and messaging channels
          type: distribution
          risk: Extension or channel policies can constrain automation surfaces and data access.
        - id: d6
          label: Enterprise control configuration
          type: trust
