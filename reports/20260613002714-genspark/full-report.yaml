      - number: '2.5'
        title: Contradictions, competitive signals, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter's main contradiction is that market attention is massive while independent challenger
              monetization is still narrow. Google remains dominant in baseline search volume and is folding agentic
              features directly into Search, Chrome, and Gemini, which raises the bar for any stand-alone entrant.
              Perplexity and Arc show that the browser may become a meaningful control point, yet Digiday and TechCrunch
              also show that advertiser economics and publisher revenue sharing are still experimental. Genspark's own
              history sharpens the point: management abandoned a pure search posture and now sells workflow software,
              implying that consumer answer-search alone was not enough. The unresolved diligence question is therefore
              not whether there is a market, but which slice of it Genspark can convert into durable paid usage. Public
              evidence is still too thin to isolate a clean SAM or SOM because seat mix, enterprise retention, and
              free-to-paid conversion remain undisclosed.
