              - CV015
              - CV035
              - CV007
              - CV054
      - number: '8.4'
        title: Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The decision can move quickly in either direction with a short list of diligence answers. If management
              can verify that the March 2026 annual run rate is mostly recurring, show gross margins that are better
              than infrastructure-heavy AI wrappers, prove healthy expansion and low concentration, and clarify that the
              latest round did not rely on aggressive investor protections, the current valuation can still look
              justified. If those answers go the other way, the comp set changes immediately and the equity looks full.
              The thesis therefore breaks on evidence quality before it breaks on narrative quality. A
              lower-than-advertised ARR base, weak retention, margin drag from Cloud Computer or model costs, or round
              terms that shift economics away from common shareholders would all push the fair-value range down
              materially. Until those points are verified, Genspark is best treated as a strong narrative asset with
              real upside and real execution speed, but not yet as a cleanly underwritable growth-software bargain.
            claimRefs:
              - CV013
              - CV038
              - CV051
              - CV052
              - CV054
              - CV055
              - CV056
              - CV057
          - type: table
            tableRef: TV006
            claimRefs:
              - CV013
              - CV038
              - CV053
              - CV054
              - CV057
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong company story, weak entry evidence
            body: >-
              Genspark may be building a real premium AI-work platform, but the public file still does not prove that
              today's near-$1.6B valuation is favorable for new investors.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV051
              - CV054
              - CV055
          - type: callout
            title: The anti-thesis is multiple compression, not narrative collapse
            body: >-
              The main bearish path is not that Genspark suddenly stops growing; it is that missing margin, retention,
              or round-term evidence pushes the market to value it like normal software rather than scarce AI-native
              infrastructure.
            calloutType: risk
            claimRefs:
              - CV021
