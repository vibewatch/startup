      - number: '3.3'
        title: Distribution power, lock-in, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Distribution, not raw model access, is the hardest layer for Genspark to match. SparkToro’s market work
              shows Google still dwarfs ChatGPT on comparable search-like volume, and Google’s own 2025 disclosures show
              AI Overviews already at 1.5 billion users with AI Mode now embedded in Search. Microsoft similarly uses
              Bing plus Edge to keep search, answer generation, and browsing in one stack. Perplexity is trying to buy
              its way up the curve through distribution partnerships such as Airtel, while also using Comet to own a
              browsing surface directly. Glean’s lock-in is different: it grows from permissions-aware integration
              depth, enterprise connectors, workflow context, and organizational knowledge rather than consumer reach.
              Genspark has some of the right ingredients for stronger switching cost — team admin, enterprise security
              claims, and broad task coverage — but consumer-side multi-homing still looks high because many of the main
              alternatives are free, embedded, or already sitting behind existing defaults. In other words, users can
              sample Genspark, ChatGPT, Perplexity, Google, and Bing in parallel with little friction until one product
              becomes the system that holds work context, identity, files, or browser habit. That is why browser control
              and enterprise data access matter more than one-off answer quality in this category.
