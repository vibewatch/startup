              day-to-day users are knowledge workers but the payer is centralized IT or operations. ADK Marketing
              Solutions adds geography and use-case specificity: a Japanese marketing agency used the product to reduce
              data analysis and document creation work, reinforcing that consulting, advertising, and adjacent
              knowledge-work teams are current target customers. Geography looks intentionally broad—North America,
