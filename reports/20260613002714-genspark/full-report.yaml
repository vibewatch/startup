        title: Workflow-defined product suite and module map
        blocks:
          - type: paragraph
            body: >-
              Genspark is no longer best described as an AI search product. Its public surfaces now frame the company as
              an artifact-first workspace where users can move from input capture to finished outputs across multiple
              modules: Speakly for voice entry, AI Meeting Notes for capture and follow-up, AI Slides and AI Docs for
              polished deliverables, AI Sheets / spreadsheet generation for structured analysis, Workflows for recurring
              automations, Custom Agent for reusable specialist agents, Teams for native collaboration, Chrome Extension
              for in-browser execution, and Claw for delegated multi-step work. The consistent workflow promise is that
              a user states an outcome once and Genspark coordinates research, creation, automation, and delivery across
              the right module rather than stopping at a chat response. [CE001] [CE002] [CE003] [CE005] [CE006] [CE007]
              [CE008] [CE009] [CE010] [CE014] [CE030]


