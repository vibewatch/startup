  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: Publicly visible layers of Genspark's product-tech stack from user input through execution and controls.
    data:
      layers:
        - label: Input and capture surfaces
          description: Speakly, Realtime Voice, Meeting Notes, browser sidebar, Teams
          detail: Users can start with speech, meetings, chat, or webpage context instead of a blank chat box.
        - label: Super Agent orchestration
          description: Model routing, planning, recovery, and tool selection
          detail: The agent loop decides which model or tool to call, when to gather more context, and when to stop.
        - label: Artifact modules
          description: AI Slides, AI Docs, AI Sheets, image/video/audio agents
          detail: These modules turn goals into finished decks, docs, spreadsheets, media, and other deliverables.
        - label: Automation and execution layer
          description: Workflows, Custom Agents, Claw, Chrome automation
          detail: Longer-running actions execute across apps, channels, and cloud or local computer environments.
        - label: Enterprise and trust controls
          description: SSO, connectors, analytics, DPA, residency, VPC, certifications, policy layer
          detail: >-
            Admin and trust controls sit beneath the visible modules and become more important as automation depth
            rises.
