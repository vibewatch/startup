              - CV054
      - number: '8.3'
        title: Scenario Ranges and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The simplest way to test whether Genspark is cheap or rich is to invert the multiple math at the current
              near-$1.6 billion headline valuation. Premium AI-native bands imply only about $76 million to $139 million
              of ARR; a public SaaS midpoint implies roughly $246 million; a mature or legacy floor implies more than
              $420 million. That spread is wide enough to explain both the bull case and the anti-thesis. The bull case
              is straightforward: the company says it is already above a $200 million annual run rate, has broadened
              from search into an enterprise workspace, and could deserve premium treatment if that revenue proves
              recurring and if Cloud Computer and enterprise adoption deepen switching costs. The anti-thesis is equally
              straightforward: the metrics are self-reported, bundled competition is severe, and the market may
              ultimately classify Genspark closer to a wrapper-like application or cloud-cost-heavy workspace than to a
              durable premium platform. On public evidence alone, the current price is not obviously wrong, but it is
              too under-documented to call attractive. That pushes the recommendation to research-more with a stretched
              valuation stance and high execution risk.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
