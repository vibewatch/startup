  - id: TV004
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Core assumptions
      - Indicative multiple band
      - Illustrative fair-value range (USD B)
      - Probability signal
    rows:
      - - Bull
        - >-
          The $200M annual run rate is mostly recurring ARR, retention is strong, and workflow breadth creates real
          switching cost
        - 12x-16x
        - 2.4-3.2
        - Requires diligence to validate quality, but upside is real
      - - Base
        - Revenue quality is mixed but still meaningful, and the company clears as a strong AI-enabled software platform
        - 7x-10x
        - 1.4-2.0
        - Directionally plausible on today's narrative, but still under-documented
      - - Base-down
        - Headline run rate overstates repeatable ARR or margin quality, so the market uses a normal SaaS clearing band
        - 5x-7x
        - 1.0-1.4
        - Most likely compression path if diligence is merely okay, not great
      - - Bear
        - >-
          Revenue quality is weaker than advertised and bundled competitors limit pricing power while cloud costs stay
          heavy
        - 3.5x-5x
        - 0.7-1.0
        - Downside if the company is really a wrapper-like or infrastructure-heavy app
