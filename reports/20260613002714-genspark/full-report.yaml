      - number: '1.4'
        title: Product pivot, footprint, and current scale
        blocks:
          - type: paragraph
            body: >-
              Genspark’s defining corporate act was not the launch of its search product but the decision to kill it
              after reaching more than five million users. Kay Zhu’s own explanation is revealing: the team concluded
              that fixed-workflow AI search was becoming obsolete and that a more flexible Super Agent model could do
              higher-value work. Since then, official materials have emphasized Speakly, AI Inbox, custom super agents,
              Genspark Claw, and other workflow modules instead of Sparkpages. Business Wire and the business-plan page
              also suggest early enterprise traction, including more than 1,000 organizations using AI Workspace by
              January 2026, a local Japan expansion effort, and public pricing at $30 per seat per month for team plans.
              Still, external validation of customer count, paid-seat mix, and employee growth remains thin. Third-party
              sources offer helpful but imperfect snapshots, so scale claims should be treated as promising rather than
              audited. The result is a company with unusually rapid narrative momentum, but still a private-data
              diligence burden that later chapters must carry forward.
            claimRefs:
              - CO020
              - CO021
              - CO025
              - CO026
              - CO027
              - CO028
              - CO029
              - CO030
