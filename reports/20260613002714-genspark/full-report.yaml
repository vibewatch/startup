      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              Buyer evidence is strongest where search pain is tied to work output. Gartner and CIO Dive show the
              average desk worker now operates across eleven applications, with nearly half struggling to find the
              information needed to do their jobs. That creates a clear enterprise problem statement: the budget owner
              is usually an IT, digital workplace, operations, or business-function leader who wants fewer context
              switches and faster task completion, while the end user is a knowledge worker inside the app sprawl.
              Glean's customer growth and unusually high query and engagement metrics suggest that when search is
              embedded into day-to-day work, usage can resemble consumer search frequency while still sitting inside
              enterprise software budgets. Outside the enterprise, the likely early adopter is a prosumer or
              research-heavy individual who values faster synthesis, but that cohort alone does not prove durable
              monetization. For Genspark, the practical adoption path is likely self-serve consumer discovery first,
              then seat-based enterprise expansion only where workflow modules and trust controls justify budget
              transfer.
