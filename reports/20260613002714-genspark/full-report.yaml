  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacent browsers, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Genspark is no longer competing only with AI search startups. Its own official materials now pitch an
              all-in-one AI workspace spanning research, slides, images, video, and team administration, while founder
              commentary confirms the company intentionally killed a five-million-user AI-search product because
              fixed-workflow search looked strategically narrow. That puts Genspark in a hybrid battlefield. Perplexity
              remains the closest direct peer on answer-search plus action, especially after launching Comet and broader
              enterprise offerings. ChatGPT Search is a direct substitute for research and synthesis, but OpenAI
              increasingly competes as a general work surface rather than a search-only tool. Google and Bing are the
              incumbent answer engines whose distribution remains far larger than any challenger, and Google is now
              adding AI Mode directly inside Search. Glean is the clearest enterprise analog because it turned
              enterprise search into a broader Work AI platform with strong adoption and security positioning. You.com
              now looks more like search infrastructure for agent builders than a front-end consumer competitor, while
              Dia and Arc show that browsers themselves may become the control point for research and action workflows.
              The competitive question for Genspark is therefore not just whether it can beat one answer engine, but
              whether it can sustain differentiation across search, workspace, and browser-mediated task execution at
              once.
