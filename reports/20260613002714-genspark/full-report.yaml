              Genspark presents as one product, but the disclosed dependency map is much broader. The company markets
              70-plus models and the privacy policy explicitly names OpenAI, Anthropic, Google, xAI, and ElevenLabs as
              service providers while also acknowledging cloud dependence on Azure, AWS, and Google Cloud. That gives
              the product breadth, but it also means policy changes, outages, margin resets, or vendor-priority
              conflicts outside Genspark's control can show up as degraded economics or degraded user experience inside
              Genspark. Discovery risk is equally material: Google has already scaled AI Overviews to a global
              default-search surface and is now pushing AI Mode deeper into Search, while market data still shows the
              core Google habit vastly outweighing chatbot search volume. On the content side, publisher suits against
              Perplexity and Genspark's own past promise to license copyrighted material show that answer-engine and
              agent products do not get a free pass on content rights simply because they assemble outputs rather than
