      - - Product scope
        - Workspace, enterprise, and Cloud Computer breadth can deepen monetization and switching costs
        - Breadth can also mask lower-margin or promotional usage
        - Gross margin by product line and attach-rate disclosure
      - - Moat
        - Fast product iteration and a search-to-work pivot show strategic speed
        - Third-party-model dependence can still compress the company toward ordinary software multiples
        - Evidence of proprietary data, workflow lock-in, and retention
      - - Round quality
        - Repeated fundraising step-ups imply real investor demand
        - Exact round terms, dilution, and preference structure remain opaque
        - Term sheet, secondary mix, and liquidation preference details
      - - Competition
        - A broad workspace can still carve out a differentiated team workflow
        - OpenAI, Microsoft, Google, and answer-engine rivals own stronger distribution surfaces
        - Win-loss data and evidence of enterprise-specific pull
    notes: >-
      The anti-thesis here is mostly about valuation compression and disclosure risk rather than a prediction of
      operational collapse.
