      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are fragmentation, interface change, and incumbent validation. Application
              sprawl creates an obvious productivity problem, while AI Overviews, ChatGPT Search, Copilot Search, and
              agentic browser products retrain users to expect answers and actions in one surface. Google's own metrics
              suggest these AI layers can increase query volume rather than cannibalize it, and Glean's growth shows the
              enterprise analogue is already monetizable. But the constraints are just as material. Seer found that AI
              Overviews sharply reduce both paid and organic CTR, which destabilizes the economics that historically
              funded search ecosystems. Digiday's reporting on Perplexity shows advertisers remain curious but hesitant
              because scale, ROI, CPM efficiency, and brand safety are not yet proven. Quality and trust are also
              unresolved: Google had to tighten AI Overview triggering and guardrails after public mistakes, while
              academic research continues to document pressure from SEO-optimized low-quality content. Adoption is
              happening, but the business model and trust stack are still catching up to the product narrative.
