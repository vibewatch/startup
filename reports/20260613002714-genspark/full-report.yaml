      - number: '1.2'
        title: Founders, leadership, and operating bench
        blocks:
          - type: paragraph
            body: >-
              Founder pedigree is one of Genspark’s clearest strengths. Eric Jing came from Microsoft Bing and later ran
              core search and AI product work at Baidu, while Kay Zhu previously worked on Google and Baidu search
              before co-building Xiaodu with Jing. That shared background makes Genspark’s original search orientation
              and later move into agentic workflows more believable because the founding team had already worked on
              search quality, consumer interfaces, and hardware-adjacent AI systems. Forbes adds Wen Sang as co-founder
              and COO, bringing prior enterprise software experience through Smarking. Public evidence still leaves gaps
              around formal board composition, observer rights, and independent governance, but the disclosed leadership
              set suggests stronger commercial coverage than a pure research startup. Company press materials further
              broaden the stated talent mix to veterans from Microsoft, Google, Meta, YouTube, and Pinterest,
              reinforcing the view that Genspark is trying to scale from a founder-led product organization into a full
              operating company.
