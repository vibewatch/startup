              app, Meeting Notes can auto-join calendar-linked meetings, AI Slides can build decks from uploads and
              code-backed charts, and AI Docs can switch between rich text and Markdown with version rollback. The
              result is a SKU map that tracks real worker jobs—capture, summarize, analyze, present, automate,
              collaborate, and delegate—rather than a single generic copilot surface. [CE004] [CE005] [CE006] [CE007]
