            body: >-
              Genspark's strongest direct customer proof comes from a small set of named references rather than a large
              public case-study library. Spyglaz AI's founder says Genspark produced a 50-page slide deck in 25 minutes
              with only a few prompts and describes the output as boardroom-ready. GEOPARK's CIO says the company began
              by looking for presentation tooling, discovered a broader multi-agent platform, and moved to an enterprise
              agreement after internal users asked for access. ADK Marketing Solutions is the most concrete
              third-party-style deployment proof in the retained source set because several press and media writeups
              repeat the same outcome claim: the Japanese agency reduced data analysis and document-creation workloads
              by roughly 80% over a few months. [CU001] [CU002] [CU008] [CU015] [CU028] [CU029]


              The limitation is proof density and independence. Only three named customers appear in the retained set,
              two of them originate on Genspark's own business page, and the quantified ADK outcome still traces back to
              company-announced launch coverage. Community evidence from Product Hunt and the iOS app helps show real
              users exist outside those names, but it is not equivalent to a broad enterprise reference base with
              renewal, seat count, or before-versus-after deployment metrics. In diligence terms, Genspark has enough
              public proof to show real customer use in presentations, knowledge work, and enterprise rollout contexts,
              but not enough named evidence to claim diversified enterprise production maturity across dozens of logos.
