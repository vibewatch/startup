      - number: '6.5'
        title: Expansion paths, procurement friction, and concentration opacity
        blocks:
          - type: paragraph
            body: >-
              Genspark's most visible expansion motion is product and seat breadth rather than classic module upsell
              metrics. A user can start on a self-serve plan, upgrade within web or mobile billing, move into a Team
              plan with member invites and centralized admin, and then escalate into Enterprise for custom contracting,
              data residency, and SLA-backed support. The platform also widens inside a logo through multiple work
              surfaces: AI Slides and AI Sheets target presentation and analysis workflows, Speakly provides voice
              entry, the Chrome extension adds in-browser automation, and Claw moves work into Slack, Teams, WhatsApp,
              LINE, and Telegram. Japan expansion with local customer support and success resources is another visible
              expansion lever because it reduces localization and onboarding friction for larger accounts. [CU003]
