  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Genspark’s monetization has widened far beyond a single chat subscription. Current official materials show
              at least four visible layers: consumer memberships (Free, Plus, Pro), team seats, negotiated enterprise
              contracts, and add-on usage surfaces such as credit packs and Genspark Cloud Computer. The Team Plan is
              the clearest public list price at $30 per seat per month for 2–150 users, with 12,000 credits and 60 GB of
              storage per seat, while the enterprise tier shifts to negotiated pricing, larger seat allocations, invoice
              billing, and contract terms that look much more like conventional B2B software procurement. On the
              consumer side, Genspark discloses that Plus starts at 10,000 credits per month and Pro at 125,000 credits
              per month, but it does not publish the corresponding dollar price card in the fetched help-center
              materials. Claw adds a second subscription layer, starting from $9.99 per month for Cloud Computer access,
              while some actions still consume shared credits. That means the revenue model is a blended mix of seat
              subscriptions, usage metering, and infrastructure-linked upsells rather than pure SaaS.
