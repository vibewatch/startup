            body: >-
              Genspark's deployment model is deliberately multi-surface. Download and help pages point to web, desktop,
              iPhone, Android, Apple Watch, Chrome, Microsoft Office, Google Workspace, and a browser-native AI Browser.
              Claw can run as a 24/7 cloud instance with dedicated CPU, memory, storage, and fixed IP, or in a local
