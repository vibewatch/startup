      - number: '8.2'
        title: Comparable Framework and Market Multiples
        blocks:
          - type: paragraph
            body: >-
              The right comp frame for Genspark is the central valuation debate. If the company is a genuine AI-native
              work platform with defensible workflow depth, then premium AI software and data-infrastructure references
              matter. If it is a fast-moving but ultimately wrapper-like workspace layered on third-party models and
              costly cloud infrastructure, then ordinary software or mature cloud-software bands become the better
              anchor. The third-party multiple data spans that exact debate. SaasRise shows a huge spread between
              AI-native and legacy software outcomes. Windsor Drake describes a public SaaS market that has stabilized
              far below the 2021 peak and explicitly says buyers pay up only when recurring revenue, switching costs,
              and defensibility are visible. Multiples.vc sharpens the public-market message: data infrastructure and
              DevOps still earn premiums, while cloud infrastructure is increasingly treated as a commodity. Snowflake's
              filed metrics show what premium public quality looks like in practice—scale, strong NRR, and a large base
              of seven-figure customers. Glean's June 2026 valuation shows private AI-work enthusiasm can still be
              extreme, but it does not remove the need to prove revenue quality at the company level.
