              Genspark's top-line momentum is real in the public record: January 2026 coverage said the platform had
              passed 1,000 organizations, and March 2026 coverage put annual run rate above $200 million while expanding
              the product surface further. The risk is that public growth proof is much richer than public operating
              proof. Team pricing is visible, enterprise support promises are visible, and third-party reviewers
              describe heavy credit burn on deep research, slides, and phone calls, but there is still no public bridge
              from product mix to gross margin, support burden, or retention quality. That matters because the product
              now spans consumer-style self-serve usage, longer enterprise commitments, media generation, voice, and
              live agent workflows, each with different cost curves and service expectations. In practice, the company
              may be scaling faster than outside investors can verify its unit economics, which makes any complaint
