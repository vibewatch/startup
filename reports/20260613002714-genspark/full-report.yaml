  - id: FU001
    title: Customer journey map
    type: journey-map
    data:
      items:
        - label: Discovery
          note: >-
            An individual creator, founder, analyst, or team lead discovers Genspark through community channels, the app
            store, or agentic-AI buzz.
        - label: Initial trial
          note: >-
            The user starts on Free, Plus, or Pro and tests research, slides, docs, or voice workflows on a self-serve
            basis.
        - label: Team pull
          note: >-
            If the output quality is good enough, colleagues ask for shared access, billing centralization, roles, SSO,
            or connector controls.
        - label: Enterprise review
          note: Larger buyers evaluate DPA, data residency, VPC, SLA, support, and procurement terms before broader rollout.
        - label: Embedded use
          note: >-
            The account spreads into repeat workflows through Slides, Sheets, Speakly, Chrome, or Claw-powered task
            delegation.
        - label: Expansion or friction
          note: >-
            Satisfied logos add seats and surfaces; dissatisfied users can stall on credits, exports, support, or
            cancellation issues.
