- id: TV003
  title: Comparable Valuation Table
  columns:
  - Comparable / band
  - Current public reference
  - Why it matters
  - Relevance to Genspark
  - Limitation
  rows:
  - - AI-native VC median
    - 21.2x EV / revenue
    - Best external benchmark for premium private AI enthusiasm in 2026
    - Upper bound if Genspark's self-reported run-rate is clean and defensible
    - Basket statistic, not company-specific
  - - AI-native M&A median
    - 11.5x EV / revenue
    - More disciplined premium benchmark than late-stage venture pricing
    - Useful midpoint if strategic value is real but disclosure remains imperfect
    - M&A medians are not public-trading comps
  - - Public SaaS midpoint
    - ~6x-7x EV / revenue
    - Shows where normal public software quality clears without an AI scarcity premium
    - Important base case if Genspark lands in ordinary software territory
    - Broad market index, not a direct peer set
  - - AI public leaders
    - Datadog ~20.4x; Snowflake ~15.5x; ServiceNow ~7.0x; Salesforce ~3.8x
    - Demonstrates the real spread investors apply inside software today
    - Useful to anchor both upside and compression outcomes
    - The group mixes different business models and maturity levels
  - - Filed cloud / infra set
    - Snowflake 10-K plus DigitalOcean and NetApp filing portals
    - Keeps the comp set tied to audited issuers rather than only startup press releases
    - Supports entry discipline when private disclosure is weak
    - Still no perfect public comp for Genspark's exact product mix
  - - Private AI work benchmark
    - Glean at $100M ARR and $7.2B valuation
    - Shows how high private AI-work enthusiasm can still run in 2026
    - Relevant for upside narrative if enterprise AI demand compounds
    - Private round marks are not audited operating-quality proof
  notes: 'The comp set is exhaustive for the benchmark bands used in this chapter''s valuation math: premium private AI, premium public software, normal public SaaS, filed infrastructure issuers, and a relevant private AI-work analogue.'
  enumerationScope:
    coverage: exhaustive
    basis: Rows cover every benchmark cluster explicitly used in this chapter's scenario math as of June 2026, rather than every software ticker or AI startup in the market.
