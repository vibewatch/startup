- id: diligence-asks-and-thesis-break-triggers
  title: Diligence Asks and Thesis-Break Triggers
  body: The decision can move quickly in either direction with a short list of diligence answers. If management can verify that the March 2026 annual run rate is mostly recurring, show gross margins that are better than infrastructure-heavy AI wrappers, prove healthy expansion and low concentration, and clarify that the latest round did not rely on aggressive investor protections, the current valuation can still look justified. If those answers go the other way, the comp set changes immediately and the equity looks full. The thesis therefore breaks on evidence quality before it breaks on narrative quality. A lower-than-advertised ARR base, weak retention, margin drag from Cloud Computer or model costs, or round terms that shift economics away from common shareholders would all push the fair-value range down materially. Until those points are verified, Genspark is best treated as a strong narrative asset with real upside and real execution speed, but not yet as a cleanly underwritable growth-software
    bargain.
