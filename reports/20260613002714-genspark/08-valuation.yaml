- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Recurring ARR bridge
    - Audited split between true ARR, usage revenue, and promotional or one-time revenue
    - Determines whether premium AI-native multiples are even eligible
    - Management data room plus CFO walkthrough
  - - Gross margin by product
    - Gross margin for workspace, enterprise, and Cloud Computer offerings
    - Separates software leverage from infrastructure drag
    - Finance diligence plus COGS decomposition
  - - NRR and concentration
    - Retention, expansion, and top-customer concentration
    - Tests whether usage is sticky or still experimental
    - Customer cohort review and board package
  - - Round mechanics
    - March 2026 price, preferences, secondary mix, and investor protections
    - Determines whether the headline mark reflects common-equity economics
    - Lead investor counsel and cap-table review
  - - Attach rates and win-loss data
    - Cloud Computer penetration, enterprise attach, and losses to OpenAI, Microsoft, Google, or Perplexity
    - Shows whether product breadth is real moat or just feature sprawl
    - Product analytics plus commercial diligence
  notes: None of these asks are cosmetic; each one can move the comp band and therefore the entry price materially.
