chapter:
  number: 8
  title: Valuation
  summary: Genspark's latest public mark near $1.6 billion is directionally credible because the company repeatedly raised capital and claims rapid run-rate growth, but the valuation case still rests on heavily self-reported operating metrics and a brutally competitive AI workspace market. Third-party multiple data shows that premium AI software can justify the price if revenue quality and retention are real; absent that proof, the same mark quickly looks stretched. The most defensible call is research-more with a stretched valuation stance and a short list of non-negotiable diligence gates.
sections:
- id: valuation-facts-and-disclosure-quality
  title: Valuation Facts and Disclosure Quality
  body: 'Genspark has a real top-line and financing narrative, but the public record still leaves a large gap between headline momentum and underwritable economics. Independent reporting showed the company approaching unicorn status in October 2025 and entering it in November, while official materials and later coverage then stepped the story up twice more: January 2026 brought a $100 million ARR claim and a $300 million total Series B, and March 2026 brought a $200 million annual run-rate claim, a $385 million total raise, and a near-$1.6 billion valuation. Those markers are directionally impressive and too widely repeated to dismiss. The problem is that almost every current operating metric that matters to valuation is still company-mediated or tracker-derived rather than audited. Tracxn and GetLatka disagree on exact funding, headcount, and customer counts, so even apparently simple scale facts remain noisy. That forces this chapter to value Genspark as a range around a self-reported
    growth narrative, not as a fully proven software business with public-quality disclosure.'
