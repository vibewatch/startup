  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-quality
    missingEvidence: Audited bridge from annual run rate to true recurring ARR, including any promotional, usage-based, or one-time revenue.
    whyItMatters: The current valuation can look fair or stretched depending on whether the headline run rate converts into clean recurring software revenue.
    diligencePath: Request audited revenue waterfall, deferred-revenue schedule, and board KPI pack for January-March 2026.
    relatedQuestionRefs:
    - QV006
    - QV027
    - QV028
    - QV029
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-nrr
    missingEvidence: Gross margin, NRR, gross retention, and Cloud Computer unit economics by product line.
    whyItMatters: Premium AI and infrastructure multiples are only defensible if the company has software-like retention and acceptable margin quality.
    diligencePath: Obtain CFO operating model, cohort retention cut, and product-level COGS breakdown.
    relatedQuestionRefs:
    - QV028
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: The exact pricing, preferences, secondary mix, and investor protections in the March 2026 financing extension.
    whyItMatters: Headline valuation can overstate economics available to new money if preferences or structure are aggressive.
    diligencePath: Review term sheet, cap table, and counsel memo before any underwriting recommendation.
    relatedQuestionRefs:
    - QV001
    - QV005
    - QV030
  - type: conflicting-data
    severity: minor
    topic: tracker-drift
    missingEvidence: Reconciled public explanation for why tracker-reported funding, customer, and employee counts differ.
    whyItMatters: The drift does not break the chapter but lowers confidence in point estimates that are already lightly disclosed.
    diligencePath: Reconcile tracker entries against management KPI exports and round-by-round financing history.
    relatedQuestionRefs:
    - QV006
    - QV007
  - type: missing-source
    severity: material
    topic: win-loss-and-attach-rates
    missingEvidence: Verified win-loss data against OpenAI, Microsoft, Google, and answer-engine peers plus attach rates for enterprise and Cloud Computer modules.
    whyItMatters: The anti-thesis is valuation compression from competition, so product breadth only helps if it actually changes buying behavior.
    diligencePath: Request CRM win-loss extracts, attach-rate dashboards, and customer references segmented by plan tier.
    relatedQuestionRefs:
    - QV025
    - QV026
    - QV030
