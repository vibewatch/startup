      Segment scale signals are reported by company-related or analytical
      sources and are not a reconciled customer census; null-like gaps denote
      evidence not available in the assigned pool.
    claimRefs: [CU002, CU003, CU004, CU005, CU016]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source posture, Confidence, Implication, Missing denominator]
    rows:
      - [Organizations using products, "1,500+", "2023 announcement", "Company announcement carried by Sixth Street", medium, "Demonstrates stated enterprise reach", "Active versus historical accounts and definition of organization"]
      - [Enterprises using products, "500+", "2021 merger announcement", "Company announcement", medium, "Provides an earlier lower-bound reference point", "Whether the population overlaps with later counts"]
      - [Customers worldwide, "2,500+", "2026 profile citing July 2026 company release", "Independent profile repeating company metric", medium, "Suggests scale growth if comparable definitions hold", "Account definition, active status, and reconciliation to 1,500+"]
      - [Net revenue retention, "~120%", "2025 interview, reported in 2026 profile", "Company statement without public financial statements", low, "Positive expansion signal if cohort and denominator are verified", "Cohort, GRR, churn, timing, and revenue reconciliation"]
    notes: >-
      Values are not comparable without consistent definitions and denominators;
      the table preserves the source periods and distinguishes company claims
      from analytical repetition.
    claimRefs: [CU006, CU007, CU008, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or reference, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    rows:
      - [Schneider Electric, Industrial or enterprise, "Named on a customer wall in an independent company profile", null, "Customer reference presence supports enterprise relevance", "No deployment scope, product, date, outcome, or contract evidence"]
      - [Siemens, Industrial or enterprise, "Named on a customer wall in an independent company profile", null, "Customer reference presence supports enterprise relevance", "No deployment scope, product, date, outcome, or contract evidence"]
      - [ServiceNow, Enterprise software, "Named on a customer wall in an independent company profile", null, "Customer reference presence supports enterprise relevance", "No deployment scope, product, date, outcome, or contract evidence"]
      - [M&T Bank, Financial services, "Named on a customer wall in an independent company profile", null, "Customer reference presence supports regulated-sector relevance", "No deployment scope, product, date, outcome, or contract evidence"]
    enumerationScope:
      coverage: sample
      basis: Named examples reproduced by a 2026 public company profile; this is not a complete customer list or independently audited deployment census.
    notes: >-
      These are named references rather than verified production case studies.
      The assigned sources do not establish whether any row is a current
      production deployment, pilot, renewal, or paid account.
    claimRefs: [CU001, CU008, CU017]
figures:
  - id: FU001
    title: Customer journey from regulated need to expansion
    type: journey-map
    summary: Public evidence supports a plausible enterprise journey from regulated machine-identity need to platform adoption, while the production-outcome and renewal stages remain unverified.
    data:
      items:
        - label: Regulated need
          title: "Certificate and machine-identity complexity"
          detail: "Banks, retailers, government agencies, and device manufacturers face distributed certificate and identity workflows."
          touchpoints: ["Security and PKI teams", "Cloud, on-premises, and connected-device estates"]
        - label: Evaluation
          title: "Enterprise platform selection"
          detail: "Buyers compare certificate discovery, issuance, renewal, CA orchestration, and deployment models."
          touchpoints: ["Keyfactor Command", "EJBCA and PKI-as-a-Service"]
        - label: Deployment
          title: "Operational rollout"
          detail: "Public evidence describes products and customer references but does not disclose implementation duration or production scope."
          touchpoints: ["Certificate inventory", "Issuance and renewal automation"]
        - label: Active use
          title: "Machine-identity management"
          detail: "Reported customer counts indicate reach, but active-account and utilization telemetry is not public."
          touchpoints: ["Enterprise security operations", "IoT and embedded-device workflows"]
        - label: Expansion
          title: "Discovery-to-management breadth"
          detail: "The combined portfolio is positioned to extend from certificate lifecycle management into cryptographic discovery and posture management."
          touchpoints: ["Post-quantum readiness", "Additional workloads and business units"]
        - label: Renewal
          title: "Retention and referenceability"
          detail: "Approximately 120% NRR is reported, but renewal cohorts, churn, GRR, and customer concentration require private verification."
          touchpoints: ["Renewal and expansion", "Reference customer outcomes"]
    approximationNotes: >-
      This is an analytical sequence rather than a measured conversion funnel;
      the assigned evidence does not provide stage populations or conversion rates.
    claimRefs: [CU003, CU006, CU011, CU012, CU013]
