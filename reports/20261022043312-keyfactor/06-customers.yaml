schemaVersion: "report-v2"
artifact: customers
slug: keyfactor
runDate: 2026-10-22
company:
  name: Keyfactor
chapter:
  number: 6
  title: Customers
  summary: Keyfactor presents a broad enterprise customer footprint concentrated in regulated sectors, but public evidence is substantially stronger for customer counts and segment penetration than for named production deployments, outcomes, retention, or concentration. The customer case is therefore credible but not independently measurable enough to underwrite expansion or durability without private operating data.
sections:
  - id: customer-base-and-segments
    title: Customer base and segment fit
    body: >-
      Public evidence places Keyfactor primarily in enterprise security and PKI
      workflows where certificates, keys, and certificate authorities span
      cloud, on-premises, and connected-device estates. A September 2026
      company profile says the company sells to organizations managing machine
      identities and reports more than 1,500 organizations, while a separate
      2026 analysis attributes 2,500-plus customers and penetration of roughly
      half of leading US and European banks, 80% of leading US retailers, and
      more than 40% of the Fortune 100. Those figures are not independently
      audited, and the discrepancy between 1,500-plus and 2,500-plus means the
      report should not normalize them into one customer-count KPI. The
      vertical evidence is directionally valuable: financial services,
      retail, government, automotive, telecom, and medical-device use cases
      all have certificate or embedded-identity needs, but the sources do not
      disclose customer-level revenue, contract size, geography mix, or payer
      versus user roles.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest adoption signals are company and investor communications,
      not independent usage telemetry. The 2023 Sixth Street announcement says
      Keyfactor was trusted by more than 1,500 organizations and reported a
      three-year revenue CAGR above 70%; the 2021 merger announcement says the
      company was trusted by more than 500 enterprises. A later profile repeats
      the 2,500-plus figure and names Schneider Electric, Siemens, ServiceNow,
      and M&T Bank as customer-wall examples, but it does not document the
      deployment scope, production status, contract value, or measurable
      outcome for any of them. The customer evidence therefore supports
      referenceability and enterprise relevance, not proof of active use or
      successful expansion. Competitive material reports 4.5/5 from 34
      Gartner Peer Insights reviews and 100% renewal intent, but its
      methodology is summarized rather than independently inspectable here.
      Public evidence also lacks a time series of active accounts, locations,
      certificate volumes per customer, implementation duration, or usage
      utilization.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      Keyfactor's customer durability is plausible but not publicly
      underwritten. The 2026 profile reports approximately 120% net revenue
      retention from a 2025 interview, while explicitly warning that the
      metric is a company statement without public financial statements for
      cross-verification. No source in the assigned pool provides gross
      retention, logo churn, renewal cohorts, contract duration, expansion
      by account, or customer concentration. The product architecture can
      create operational switching costs because customers may need to move
      issuance rules and reissue certificates when changing certificate
      authorities, but that is a mechanism-based inference rather than
      observed retention. The same evidence indicates a potentially strong
      enterprise reference loop in regulated industries, while also leaving
      procurement friction and implementation dependence unresolved. The
      underwriting implication is to treat reported NRR as a positive signal,
      not as verified recurring-revenue durability, and to request cohort and
      concentration schedules before assigning expansion credit.
    claimRefs: [CU011, CU012, CU013, CU014]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Regulated-enterprise reference potential
    body: Reported penetration of banks, retailers, and the Fortune 100 suggests a customer base aligned with high-consequence identity workflows, but the figures remain company-reported and should be validated account by account.
    claimRefs: [CU003, CU004, CU005]
  - calloutType: risk
    title: Durability is not independently measurable
    body: Public materials do not provide the denominator, cohort construction, or recurring-revenue reconciliation behind the approximately 120% NRR claim, and they provide no top-customer concentration schedule.
    claimRefs: [CU011, CU012, CU014]
  - calloutType: recommendation
    title: Require customer cohort diligence
    body: Request anonymized logo cohorts, GRR and NRR bridges, renewal and churn definitions, top-20 concentration, production references, and implementation timelines before underwriting expansion or retention.
    claimRefs: [CU012, CU014]
