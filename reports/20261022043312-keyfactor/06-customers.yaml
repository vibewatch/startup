      - [Retail and Fortune 100, "Security and platform teams", "Certificate discovery, issuance, renewal, and outage prevention", "80% of leading US retailers and 40%+ of Fortune 100 reported", "Signals broad enterprise relevance if independently validated", "Denominators, account activity, and deployment outcomes are not disclosed"]
      - [Federal government, "Agency security and trust-infrastructure buyers", "Cloud-based certificate lifecycle automation", "FedRAMP authorization reported in 2026", "May reduce procurement barrier for government workloads", "No awarded contracts, agency names, or production deployments in pool"]
      - ["Automotive, telecom, and medical devices", "Manufacturing, device, and embedded-security teams", "Identity issuance for connected devices and signing workflows", "Use cases described; no customer count supplied", "Expands addressable machine and IoT identity surface", "No named production references or utilization metrics supplied"]
