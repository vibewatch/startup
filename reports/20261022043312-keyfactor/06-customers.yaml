  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customers
      missingEvidence: "Customer-authorized case studies or procurement records that identify production deployment scope, date, workload, and measurable outcome for at least three named accounts."
      whyItMatters: "Logo references alone do not establish active use, successful implementation, or referenceability for a repeatable sales motion."
      diligencePath: "Obtain customer calls, signed case studies, or redacted contracts covering production status, deployment scope, renewal, and quantified outcomes."
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: "Cohort-level GRR, NRR, logo churn, renewal rate, contract duration, and expansion bridge with definitions and denominators."
      whyItMatters: "Reported NRR is a company claim and cannot by itself establish durable recurring revenue or customer health."
      diligencePath: "Request a monthly recurring-revenue cohort bridge for the last eight quarters, including churn, contraction, expansion, and customer-count reconciliation."
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: concentration
      missingEvidence: "Top-customer revenue and ARR concentration by account, segment, geography, and channel."
      whyItMatters: "A broad customer count can coexist with material exposure to a small number of enterprise accounts or channel partners."
      diligencePath: "Request top-10 and top-20 customer concentration, renewal dates, contract terms, and partner-sourced revenue shares under NDA."
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU001, TU002]
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: "A reconciled definition and time series for organizations, customers, enterprises, active accounts, and paying accounts."
      whyItMatters: "The available 500-plus, 1,500-plus, and 2,500-plus figures may use different populations and cannot safely be treated as a growth series."
      diligencePath: "Reconcile historical customer-count disclosures to CRM account definitions and active paid subscriptions for each reporting period."
      relatedQuestionRefs: [QU002, QU003]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: minor
      topic: adverse-customer-evidence
      missingEvidence: "Independent evidence on failed pilots, implementation delays, complaints, outages, support performance, and customer losses."
      whyItMatters: "The assigned adverse material is competitor-authored and cannot substitute for an independent churn or service-quality record."
      diligencePath: "Review customer references, support tickets, renewal loss reports, incident postmortems, and independent review-level evidence."
      relatedQuestionRefs: [QU008]
acknowledgedWarnings:
