    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a recurring-revenue model fed by enterprise PKI and certificate-management activity, but the conversion to recognized revenue and gross profit remains unquantified.
    data:
      nodes:
        - id: enterprise-estates
          label: Enterprise machine identities and certificates
          detail: "Customer activity creates demand for certificate issuance, renewal, discovery, and cryptographic governance."
        - id: platform-products
          label: Command, EJBCA, and cryptographic tooling
          detail: "Keyfactor describes a unified trust platform with software, SaaS, and managed deployment options."
        - id: subscription-contracts
          label: Quote-based enterprise subscriptions
          detail: "Public pricing is scaled by certificate volume, modules, and deployment model; realized terms are unavailable."
        - id: reported-arr
          label: ">$200M ARR"
          detail: "Company reported exceeding $200 million ARR in early Q3 2026."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "GAAP revenue, billings, deferred revenue, and services mix are not publicly disclosed in the assigned pool."
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: "Gross margin, cash flow, burn, and runway remain diligence gaps."
      edges:
        - [enterprise-estates, platform-products]
        - [platform-products, subscription-contracts]
        - [subscription-contracts, reported-arr]
        - [reported-arr, recognized-revenue]
        - [recognized-revenue, gross-profit]
    claimRefs: [CI001, CI003, CI004, CI006, CI007]
callouts:
  - calloutType: strength
    title: Scale and growth are meaningful signals
    body: Keyfactor reported more than $200 million of ARR, above 35% year-over-year ARR growth, and profitability while continuing to reinvest, but these remain company-issued metrics pending financial diligence.
    claimRefs: [CI001, CI002, CI006]
  - calloutType: risk
    title: The underwriting gap is cash conversion
    body: Public evidence does not establish gross margin, net retention, customer concentration, cash, burn, runway, transaction proceeds, or realized pricing; these gaps prevent a full capital-adequacy conclusion.
    claimRefs: [CI009, CI013, CI014]
