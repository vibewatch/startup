      missingEvidence: Net revenue retention, gross retention, churn, contraction, renewal terms, customer concentration, and sales efficiency.
      whyItMatters: Growth can be acquisition- or expansion-driven and may not persist without retention and payback evidence.
      diligencePath: Request cohort-level NRR and GRR, logo churn, top-customer concentration, pipeline conversion, CAC, payback, and sales-cycle data.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Cash, debt, burn, runway, proceeds mix, preference stack, dilution, and use of funds for the 2026 transaction and planned acquisition.
      whyItMatters: Sponsor support and funding announcements do not prove cash available to the operating company or the absence of financing dependency.
      diligencePath: Request the latest balance sheet, debt schedule, capitalization table, transaction documents, sources-and-uses, and acquisition funding plan.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: Reconciliation of customer counts and definitions across current company disclosures and older investment materials.
      whyItMatters: Customer count is a traction denominator and affects interpretation of ARR per customer and concentration.
      diligencePath: Obtain a dated customer-account definition, active-customer list, and reconciliation to current ARR and renewal cohorts.
      relatedQuestionRefs: [QI001]
  acknowledgedWarnings:
    - dimension: tableNotes
      reason: "Every table contains public, estimated, comparative, or unavailable values and includes an explicit note describing those qualifications."
