      diligencePath: Request audited financial statements, monthly management accounts, ARR definition, cohort schedules, and revenue-recognition policy.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
