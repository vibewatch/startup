schemaVersion: "report-v2"
artifact: financials
slug: keyfactor
runDate: 2026-10-22
company:
  name: Keyfactor
chapter:
  number: 4
  title: Financials
  summary: >-
    Keyfactor presents a strong but company-led financial profile: it reported more than $200 million of
    ARR in early Q3 2026, over 35% year-over-year ARR growth, and profitability, while independent
    public evidence still does not disclose revenue recognition, gross margin, cash, burn, retention, or
    realized pricing. The underwriting case therefore depends on validating the quality and durability of
    reported recurring revenue and the economics of the 2026 investment and planned acquisition.
sections:
  - id: recurring-revenue-and-monetization
    title: Recurring revenue is disclosed, but monetization detail is thin
    body: >-
      Keyfactor reported that it exceeded $200 million in annual recurring revenue in early Q3 2026 and
      described year-over-year ARR growth above 35% at substantially greater scale. Those are material
      traction signals, but they are company-issued figures carried by a press-release-style publication,
      not audited financial statements. The same disclosure says Keyfactor was below $10 million of ARR
      in 2019 and took roughly five years to exceed $100 million, then two years to double again; this
      supports a credible acceleration narrative but does not establish GAAP revenue, billings, deferred
      revenue, or cash conversion. The business model appears to combine enterprise software, PKI
      services, and managed or SaaS delivery. Public surfaces describe quote-based enterprise subscription
      pricing scaled by certificate volume, modules, and deployment model, while EJBCA Community is free
      to self-operate. No source in the assigned pool provides realized price, discounting, contract
      duration, renewal rate, or revenue mix, so ARR should not be substituted for revenue or cash flow.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: Operating leverage is plausible but not underwritten
    body: >-
      The strongest public operating assertion is that Keyfactor is operating profitably while continuing
      to reinvest in the business. That statement is useful directionally, but it does not disclose
      EBITDA, operating margin, gross margin, free cash flow, or the treatment of services and acquisition
      costs. The product and delivery model can create both software-like leverage and material service
      cost: Keyfactor offers on-premises software, SaaS, and fully managed PKIaaS, and its own product
      announcement framed cloud delivery as reducing the effort and expense of running software and server
      infrastructure on-premises. Conversely, enterprise implementations require PKI expertise, integration,
      policy design, and potentially professional services. A competitor comparison describes six-figure
      annual pricing for both Keyfactor and Venafi but is not a benchmark and should not be treated as
      realized pricing. The underwriting gap is therefore not whether a high-margin software model is
      possible; it is whether mix, implementation burden, support obligations, and renewal economics
      produce repeatable gross and free-cash margins at the reported ARR scale.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Sponsor support lowers near-term financing risk, not diligence risk
    body: >-
      Keyfactor has had repeated sponsor backing, including a $125 million growth infusion announced in
      2021, a minority investment at approximately $1.3 billion enterprise value announced in October
      2023, and a $1 billion-plus Summit Partners investment referenced in the 2026 ARR announcement.
      Caplight lists a July 6, 2026 growth-equity event and historical rounds, but the public page does
      not display amounts or transaction documents. The 2023 announcement explicitly says that no other
      terms of the private transaction were disclosed, so primary versus secondary proceeds, preference
      stack, dilution, cash on hand, debt, and use of funds remain unknown. The reported profitability and
      new sponsor capital reduce the evidence for an immediate liquidity emergency, but they do not prove
      runway or capital adequacy. A planned Cofide acquisition and continued global expansion could
      increase execution and integration needs. The financial verdict is positive on demand and sponsor
      access, conditional on diligence of ARR quality, customer concentration, retention, margin, cash
      conversion, transaction structure, and acquisition funding.
    claimRefs: [CI011, CI012, CI013, CI014]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Current value/status, Evidence quality, Diligence ask]
    rows:
      - [Enterprise software and PKI platform, "Certificate lifecycle automation and PKI products", "ARR / subscription", "> $200M ARR in early Q3 2026", "Company-issued disclosure; not audited revenue", "Reconcile ARR to GAAP revenue, billings, deferred revenue, and renewal cohorts"]
      - [SaaS and managed PKI, "Cloud or fully managed certificate and PKI operations", "Contract / subscription", "Offered; realized mix undisclosed", "Product documentation and company announcement", "Obtain mix, gross margin, implementation cost, and support-cost data"]
      - [Enterprise on-premises deployment, "Software retained behind customer firewall with cloud automation", "Enterprise subscription", "Deployment option described; realized economics undisclosed", "Company product release", "Split license, services, maintenance, and hosting economics"]
      - [EJBCA Community, "Open-source certificate authority that customers can self-operate", "Free software / commercial upsell potential", "Free to self-operate", "Independent community description", "Measure conversion from community use to paid enterprise products"]
    notes: "Public sources mix company ARR claims, product descriptions, and independent summaries; ARR is not GAAP revenue, and null or undisclosed fields require private diligence."
    claimRefs: [CI001, CI003, CI004, CI007]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Offer or pricing signal, Published basis, List or realized, What is known, Underwriting implication]
    rows:
      - [Keyfactor enterprise subscription, "Scaled by certificate volume, modules, and deployment model", "List/model description", "Quote-based enterprise pricing", "Price realization and discounting are unknown"]
      - [EJBCA Community, "Open-source software", "Published availability", "Free to self-operate", "Potential funnel or self-managed alternative; paid conversion is unknown"]
      - [Keyfactor versus Venafi, "£75K–£200K/year in an independent comparison", "Indicative comparison, not verified quote", "Only a broad annual range is presented", "Use for a diligence hypothesis, not forecast revenue"]
    notes: "The public pricing evidence is quote-based or comparative. No assigned source provides a signed contract, realized price, discount, term, or customer-level revenue."
    claimRefs: [CI004, CI008, CI009]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "> $200M in early Q3 2026", "Medium; company-issued", "Indicates scale of recurring commercial traction", "Reconcile to audited revenue and cohort data"]
      - [ARR growth, ">35% year over year", "Medium; company-issued", "Signals continued demand at scale", "Validate organic versus acquired growth and retention"]
      - [Operating profitability, "Claimed; margin not disclosed", "Low to medium; company-issued", "Could support self-funded expansion", "Obtain EBITDA, operating margin, and cash-flow bridge"]
      - [Gross margin, null, "Unavailable", "Determines software-versus-services quality", "Provide product, cloud, support, and services cost allocation"]
      - [Net revenue retention, null, "Unavailable", "Tests expansion and churn durability", "Provide NRR, churn, contraction, and cohort data"]
      - ["Cash, burn, and runway", null, "Unavailable", "Tests capital adequacy and financing dependency", "Provide current cash, debt, monthly burn, runway, and 2026 transaction proceeds"]
    notes: "Null means no usable public value was found in the assigned successful prefetched sources; accounting loss, cash burn, funding raised, and ARR are distinct measures."
    claimRefs: [CI001, CI002, CI006, CI011, CI013, CI014]
figures:
