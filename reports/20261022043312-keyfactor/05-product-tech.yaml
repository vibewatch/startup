      - ["EJBCA Enterprise", "PKI operators, IoT, manufacturing, and enterprise teams", "Commercial enterprise product built on open-source EJBCA", "Certificate-authority depth and private-PKI operating model", "Independent availability, scale, and support evidence"]
      - ["SignServer Enterprise", "Developers and release or signing teams", "Named in the 2021 combined portfolio", "Signing capability alongside CA and lifecycle products", "Current packaging, supported signing use cases, and adoption"]
      - ["Cryptographic posture tooling", "Security architects and cryptography owners", "Third-party profile describes discovery, inventory, and agility tooling", "Focus on quantum-vulnerable algorithms and migration readiness", "Product maturity and customer outcome evidence"]
      - ["Remote CA Gateway / CLAaaS", "Hybrid and regulated infrastructure teams", "Announced 2021 cloud-native service and gateway", "Outbound-only connection supports on-premises PKI with cloud automation", "Current availability, gateway resilience, and operational SLA"]
    notes: >-
      Product status is based on named source descriptions rather than a current independent
      release catalogue. “Current” packaging, availability, and performance require diligence.
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Main technical risk]
    rows:
      - ["Lifecycle control plane", "Discover, inventory, issue, renew, and report on machine identities", "Connectors to certificate authorities, clouds, Kubernetes, and on-premises systems", "Integration coverage and policy migration may drive implementation effort"]
      - ["Certificate authority", "Issue and manage certificates for private PKI and enterprise identities", "EJBCA deployment, key custody, and authority operations", "Availability, recovery, and cryptographic control evidence are incomplete"]
      - ["Signing services", "Sign code and other digital objects", "SignServer and release-process integration", "Signing-key protection and workflow latency are not publicly measured"]
      - ["Cloud and gateway", "Link cloud automation to protected on-premises PKI", "Keyfactor Cloud and outbound port 443 Remote CA Gateway", "Gateway failure or cloud dependency could affect operations"]
      - ["Crypto-agility layer", "Inventory algorithms and support post-quantum transition", "Asset discovery, algorithm classification, and migration processes", "Maturity and customer-scale post-quantum outcomes are not independently verified"]
    notes: >-
