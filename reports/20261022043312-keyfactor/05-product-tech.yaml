company:
  name: Keyfactor
chapter:
  number: 5
  title: Product & Technology
  summary: Keyfactor presents a digital-trust platform that combines certificate lifecycle automation with certificate-authority and signing capabilities through EJBCA and SignServer, plus cryptographic inventory and post-quantum migration tooling. Public evidence supports broad deployment flexibility and a credible PKI foundation, but independent reliability, implementation effort, and detailed production architecture remain insufficiently disclosed.
sections:
  - id: customer-workflow
    title: Product and customer workflow
    body: >-
      Keyfactor addresses an enterprise workflow in which security and infrastructure teams
      discover certificates and keys, establish or connect certificate authorities, issue and
      renew machine identities, and deploy them across devices, workloads, applications, and
      hybrid infrastructure. The InfoMSP directory describes management of certificates, keys,
      and machine identities, while the 2021 product announcement describes discovery,
      management, and lifecycle automation across on-premises and multi-cloud operations. The
      workflow is therefore more than a certificate dashboard: it combines inventory,
      authority connectivity, policy-driven issuance, renewal, and deployment. The practical
      buyer value is reduced manual certificate operations and a single control surface, but
      the available evidence does not independently quantify uptime, avoided incidents, or
      implementation time.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
  - id: product-map
    title: Product modules and maturity
    body: >-
      The public product map has three functional centers. Keyfactor Command is described as
      the lifecycle-control layer for discovering, inventorying, issuing, and renewing
      certificates and keys. EJBCA Enterprise supplies certificate-authority infrastructure
      built on the open-source EJBCA project, while SignServer supports signing workflows.
      The 2021 merger announcement also names Bouncy Castle and positions the combined
      portfolio for PKI-as-a-Service, SaaS PKI, software-appliance, and FIPS 140-certified
      hardware deployment. More recent third-party descriptions add cryptographic discovery,
      inventory, and agility tooling aimed at finding quantum-vulnerable algorithms. This is
      a coherent platform architecture, but public sources do not provide a complete versioned
      module catalogue, product-by-product release cadence, or independently tested performance
      envelope. Historical assurance evidence is also product-specific: a 2021 investor release
      reported certifications for the then-PrimeKey product set and management processes, but
      that does not establish the current assurance scope of every Keyfactor module.
    claimRefs: [CE005, CE006, CE007, CE008, CE017]
    tableRefs: [TE002]
  - id: architecture-and-dependencies
    title: Architecture, deployment, and dependencies
    body: >-
      Keyfactor's differentiating architectural choice is the combination of a lifecycle
      management plane with a certificate authority that can be operated as part of the same
      stack. The 2021 announcement says customers can use PKI as a Service, SaaS PKI on Azure,
      AWS, and GCP, a software appliance, or FIPS 140-certified hardware, and describes a
      single-pane-of-glass approach across hybrid and multi-cloud environments. The later
      CLAaaS announcement describes an outbound-only port 443 connection from on-premises PKI
      to the Keyfactor Cloud through a Remote CA Gateway, avoiding a VPN or inbound firewall
      opening. These options support regulated and hybrid estates, but create dependencies on
      certificate-authority integration, policy migration, key custody, and customer operating
      skill. Public material does not establish failover design, recovery objectives, or
      production-scale throughput.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-trust
    title: Differentiation, trust, and diligence gaps
    body: >-
      Keyfactor's strongest technical differentiators are CA depth, deployment flexibility,
      and a stated focus on crypto-agility. The merger combined certificate lifecycle
      automation with EJBCA, which the company describes as a flexible certificate authority
      used across DevOps, IoT, manufacturing, and enterprise cases. An independent community
      review characterizes EJBCA as giving Keyfactor genuine CA depth and identifies crypto-
      agility and flexible SaaS or self-hosted deployment as strengths, while also noting that
      full value requires discovery, integration, and policy-design effort. A competitor
      comparison reports stronger integration breadth for Venafi and presents Keyfactor as
      simpler and more flexible for common use cases, but that comparison is not an
      independent benchmark. The historical certification record is meaningful but does not
      replace current product-by-product security attestations. The diligence priority is
      production proof: customer-specific deployment duration, support SLAs, incident history,
      current assurance scope, upgrade burden, and evidence that post-quantum features operate
      at customer scale.
    claimRefs: [CE014, CE015, CE016, CE017]
    tableRefs: []
    figureRefs: []
