    claimRefs: [CE002, CE005, CE006, CE010, CE011]
callouts:
  - calloutType: strength
    title: CA depth is the core technical moat
    body: "Keyfactor is not only a lifecycle-management console: its EJBCA foundation gives it certificate-authority depth and multiple deployment choices, which can reduce the need to assemble separate CA and CLM products."
    claimRefs: [CE006, CE014]
  - calloutType: risk
    title: Reliability and implementation evidence are thin
    body: Public sources describe architecture and capabilities but do not establish independent uptime, recovery objectives, implementation duration, support-SLA performance, or production-scale throughput.
    claimRefs: [CE012, CE013]
  - calloutType: insight
    title: Hybrid flexibility increases diligence surface
    body: On-premises, SaaS, managed, appliance, and hardware options broaden the addressable operating model, but each adds integration, key-custody, upgrade, and support questions that should be tested in customer references.
    claimRefs: [CE010, CE011, CE012]
