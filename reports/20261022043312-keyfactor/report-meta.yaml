companyProfile:
  summary: >-
    Keyfactor is a private cybersecurity company focused on machine identity and digital trust. Its platform combines
    certificate discovery and lifecycle automation with certificate-authority, signing, cloud, and crypto-agility
    capabilities, serving enterprise, regulated, connected-device, and public-sector workflows.
  foundedDate: '2001-01-01'
  founders: []
  foundingLocation: Cleveland, Ohio, USA
  headquarters: Cleveland, Ohio, USA
  productSummary: >-
    Keyfactor sells certificate lifecycle management, PKI-as-a-Service, EJBCA certificate-authority software, SignServer
    signing capabilities, and cryptographic inventory and crypto-agility tooling across SaaS, managed, appliance,
    hardware, and hybrid deployment models.
  customerFocus: >-
    Enterprise security, PKI, infrastructure, developer, government, financial, retail, industrial, telecom, and
    connected-device teams.
  businessModel: >-
    Enterprise subscription and managed-service software monetized through quote-based pricing shaped by certificate
    volume, modules, and deployment model, with open-source components supporting the broader product ecosystem.
