  - id: TM002
    title: Sizing and demand lenses
    columns: [Publisher, Year, Geography, Value or metric, Methodology, Confidence, Limitation]
    rows:
      - [SecurityBrief, 2026, Global customer footprint, ">$200M ARR; >1,000 customers", Company-reported milestone and customer statement, medium, Operating scale is not TAM or market share]
      - [Axelspire comparison, 2026, Enterprise deployments, "£75K-£200K annual indicative range", Vendor comparison and cited benchmarks, low, Not a Keyfactor quote and competitor-authored]
      - [Forrester studies cited by Axelspire, 2024, Composite enterprises, "243% and 312% ROI", TEI studies for other CLM products, medium, Not Keyfactor-specific and not a market-size estimate]
      - [CA/Browser Forum schedule as reported by Axelspire, 2025 decision; 2026-2029 effective dates, Public TLS, "200 / 100 / 47 day maximum lifetimes", Policy schedule, high, Demand trigger does not quantify addressable software spend]
    notes: >-
      Values mix company scale, indicative pricing, ROI, and policy timing; they use different
      denominators and must not be summed or presented as a single TAM/SAM/SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow and adoption trigger]
    rows:
      - [Large regulated enterprise, CISO or security architecture, PKI and infrastructure teams, Security transformation budget, Audit requirements and certificate outages]
      - [Cloud-native or hybrid enterprise, Platform engineering, DevOps and application owners, Cloud or platform budget, Fleet growth and automated renewal]
      - [Device and IoT manufacturer, Product security or engineering, Firmware and device teams, Product development budget, Device identity and EU connected-product obligations]
      - [Federal or public-sector organization, Agency security leadership, PKI operators and compliance staff, Program or modernization budget, FedRAMP and post-quantum preparation]
    notes: >-
      Segment roles are synthesized from the product, customer-industry, regulatory, and adoption
      evidence; public sources do not provide a complete enumeration of buyer budgets or conversion rates.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lenses
    type: pyramid
    summary: >-
      A layered view separates operating scale, workflow economics, and policy-driven demand
      without implying that the values are additive.
    data:
      items:
        - label: Enterprise digital-trust workflow
          value: ">$200M ARR"
          valueNote: Keyfactor operating scale reported for early Q3 2026; not total market size
          tone: positive
        - label: Certificate-estate economics
          value: "£75K-£200K/year"
          valueNote: Indicative comparison range, not a Keyfactor quote
          tone: positive
        - label: Comparable CLM ROI lens
          value: "243%-312%"
          valueNote: Forrester studies cited for other CLM products and composite enterprises
          tone: neutral
        - label: Public TLS validity trigger
          value: "200 / 100 / 47 days"
          valueNote: Schedule reported for March 2026, March 2027, and March 2029
          tone: warning
        - label: Visibility gap
          value: "17%"
          valueNote: Keyfactor-published figure for organizations with real-time certificate visibility
          tone: warning
        - label: Quantum-readiness friction
          value: "40% / 40% / 39%"
          valueNote: "Company-published cited barriers: skills, competing priorities, and unclear standards"
          tone: warning
    approximationNotes: >-
      Layers intentionally retain different units and denominators as separate sizing lenses.
      The figure is not a proportional TAM/SAM/SOM calculation and does not infer market share,
      conversion, or a common currency.
    claimRefs: [CM005, CM006, CM007, CM008, CM012, CM013]
