evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Current ARR, revenue mix, gross margin, net retention, cash flow, debt, and customer concentration data.
    whyItMatters: >-
      These metrics determine whether disclosed financing and customer scale translate into durable, profitable
      recurring revenue.
    diligencePath: >-
      Request audited or board-approved KPI schedules, ARR bridge, cohort retention, margin bridge, debt schedule, and
      top-customer concentration from management.
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: material
    topic: transaction-structure
    missingEvidence: >-
      Executed transaction announcement or cap-table confirmation reconciling the 2026 strategic growth investment with
      the reported buyout.
    whyItMatters: >-
      Investment versus buyout structure changes control, dilution, proceeds, and the interpretation of the headline
      valuation.
    diligencePath: >-
      Obtain transaction documents or a management-signed capitalization summary showing purchase price, primary and
      secondary proceeds, investor ownership, and board rights.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership TO002
    missingEvidence: Complete current executive and board roster, founder identities, and succession coverage.
    whyItMatters: Key-person dependence and governance quality cannot be assessed from transaction announcements alone.
    diligencePath: Request the current board deck, executive roster, biographies, incentive plan, and succession/retention plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current independent market study with a defined global or regional CLM and machine-identity denominator, plus
      Keyfactor's eligible segment and share.
    whyItMatters: >-
      Without a common denominator, ARR and pricing lenses cannot support a defensible SAM, SOM, or market-share
      conclusion.
    diligencePath: >-
      Request management's market model, geographic exclusions, certificate-volume segmentation, win-loss data, and a
      bridge from TAM to current ARR.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Customer-level budget ownership, sales-cycle duration, implementation effort, retention, and conversion rates by
      segment.
    whyItMatters: Demand triggers may be strong while the pace and cost of converting them into recurring revenue remain unknown.
    diligencePath: >-
      Review pipeline cohorts, implementation statements of work, renewal data, customer concentration, and
      segment-level CAC and payback.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM008
  - type: conflicting-data
    severity: minor
    topic: operating-scale
    missingEvidence: A reconciled current customer and revenue definition across company, investor, and third-party sources.
    whyItMatters: Different customer counts and reporting dates can distort market penetration and buyer-segment comparisons.
    diligencePath: >-
      Reconcile active paying customers, accounts, ARR definition, services revenue, and reporting date directly with
      management.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: evidence-gap
    missingEvidence: >-
      Independent win-loss, churn, implementation-duration, uptime, and realized pricing data segmented against
      Venafi/CyberArk and other alternatives.
    whyItMatters: Feature and list-price comparisons cannot establish competitive conversion, retention, or total-cost advantage.
    diligencePath: >-
      Request twelve-month win-loss and churn cohorts, implementation plans, incident history, reference calls, and
      normalized competitor quotes under NDA.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitors
    missingEvidence: >-
      A complete vendor and internal-build census across regional PKI, certificate-authority, and machine-identity
      categories.
    whyItMatters: The assigned pool names major alternatives but does not prove exhaustive market coverage or entrant risk.
    diligencePath: >-
      Triangulate procurement records, analyst landscapes, customer references, and win-loss logs by segment and
      geography.
    relatedQuestionRefs:
      - QP001
  - type: stale
    severity: material
    topic: scale
    missingEvidence: Current customer count, current market share, and current competitive ranking after the 2026 transaction.
    whyItMatters: Historical company claims and 2025-2026 reviews may not reflect post-transaction positioning or current scale.
    diligencePath: Obtain current KPI pack, customer cohort report, and refreshed independent market assessment.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: disclosure-gap
    missingEvidence: Audited revenue bridge from ARR to GAAP revenue, billings, deferred revenue, gross margin, and free cash flow.
    whyItMatters: ARR alone cannot establish revenue quality, margin path, or cash conversion for underwriting.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, ARR definition, cohort schedules, and
      revenue-recognition policy.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Net revenue retention, gross retention, churn, contraction, renewal terms, customer concentration, and sales
      efficiency.
    whyItMatters: Growth can be acquisition- or expansion-driven and may not persist without retention and payback evidence.
    diligencePath: >-
      Request cohort-level NRR and GRR, logo churn, top-customer concentration, pipeline conversion, CAC, payback, and
      sales-cycle data.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash, debt, burn, runway, proceeds mix, preference stack, dilution, and use of funds for the 2026 transaction and
      planned acquisition.
    whyItMatters: >-
      Sponsor support and funding announcements do not prove cash available to the operating company or the absence of
      financing dependency.
    diligencePath: >-
      Request the latest balance sheet, debt schedule, capitalization table, transaction documents, sources-and-uses,
      and acquisition funding plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: >-
      Reconciliation of customer counts and definitions across current company disclosures and older investment
      materials.
    whyItMatters: Customer count is a traction denominator and affects interpretation of ARR per customer and concentration.
    diligencePath: >-
      Obtain a dated customer-account definition, active-customer list, and reconciliation to current ARR and renewal
      cohorts.
    relatedQuestionRefs:
      - QI001
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent uptime, incident, support-SLA, recovery-objective, and production-throughput records for Command,
      EJBCA, and managed services.
    whyItMatters: >-
      Certificate infrastructure is operationally critical, so product capability alone does not establish whether
      failures, recovery delays, or support constraints could impair customer trust.
    diligencePath: >-
      Request a current SOC or security-control package, anonymized uptime and incident history, contractual SLA
      examples, recovery-test results, and two customer references with production operating metrics.
    relatedQuestionRefs:
      - QE006
      - QE007
      - QE008
  - type: enumeration-incomplete
    severity: material
    topic: product-map
    missingEvidence: >-
      A current authoritative module, connector, release, and support matrix covering Command, EJBCA, SignServer, and
      cryptographic-agility products.
    whyItMatters: >-
      The platform description is coherent but incomplete, making it difficult to assess product maturity, overlap,
      upgrade burden, and roadmap execution.
    diligencePath: >-
