  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is enterprise digital-trust infrastructure: software and services that discover,
              issue, renew, revoke, govern, and replace certificates and other cryptographic assets across machines,
              workloads, devices, and AI systems. Keyfactor's Command product is described as an inventory and
              management layer, while EJBCA Enterprise can operate the certificate authority itself; this makes the
              addressable job broader than a public TLS certificate tool but narrower than all cybersecurity or identity
              spending. The included spend is therefore certificate lifecycle management, private and public PKI
              operations, machine-identity governance, cryptographic inventory, and migration support. Excluded are
              generic privileged-access management, general endpoint security, public CA spend without management, and
              consulting that is not tied to digital-trust operations.

              Buyers can substitute a multi-CA management platform, a bundled CA product, an internally operated PKI, or
              manual processes. An independent comparison characterizes Venafi as a pure management layer, DigiCert as a
              CA relationship with management tools, and EJBCA plus Command as a controllable full-stack PKI option.
              Caplight separately identifies AppViewX, Sectigo, and DigiCert as related comparables, reinforcing that
              the competitive boundary extends beyond one direct rival. The same comparison says both major CLM
              platforms automate certificates but do not fix ownership and dependency problems. That distinction is
              material: the status quo can defer software spend while retaining outage, labor, and compliance exposure,
              whereas a platform purchase requires PKI expertise, integration work, and an operating owner.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several sizing lenses but not a clean, additive TAM/SAM/SOM calculation. The
              strongest company-specific scale signal is operating rather than market size: SecurityBrief reports more
              than $200 million of ARR at the start of the third quarter of 2026, more than 1,000 customers, and
              exposure across financial services, technology, healthcare, telecommunications, and public-sector
              organizations. That is evidence of traction, not proof that the total market is $200 million or that all
              enterprise spend is contestable.

              A second lens is workload intensity. The comparison source gives an indicative £75,000-£200,000 annual
              range, while its cited composite Forrester studies report 243% and 312% ROI for other CLM products at
              roughly 100,000 and 200,000-plus certificates. These figures are directional benchmarks, not Keyfactor
              quotes, and cannot be aggregated with ARR. A third lens is the timing of replacement demand: CA/Browser
              Forum limits are described as moving to 200 days in March 2026, 100 days in March 2027, and 47 days in
              March 2029. This creates a recurring automation trigger, but the evidence does not disclose the portion of
              that spend captured by Keyfactor or the portion that is new rather than displaced.

              Consequently, the defensible market view is a large, recurring enterprise workflow with multiple demand
              triggers, not a single validated dollar TAM. SAM and SOM remain open because geography, eligible
              certificate volume, deployment mix, services attach, and competitive win rates are not public.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
