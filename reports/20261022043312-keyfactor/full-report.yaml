  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Recurring revenue is disclosed, but monetization detail is thin
        blocks:
          - type: paragraph
            body: >-
              Keyfactor reported that it exceeded $200 million in annual recurring revenue in early Q3 2026 and
              described year-over-year ARR growth above 35% at substantially greater scale. Those are material traction
              signals, but they are company-issued figures carried by a press-release-style publication, not audited
              financial statements. The same disclosure says Keyfactor was below $10 million of ARR in 2019 and took
              roughly five years to exceed $100 million, then two years to double again; this supports a credible
              acceleration narrative but does not establish GAAP revenue, billings, deferred revenue, or cash
              conversion. The business model appears to combine enterprise software, PKI services, and managed or SaaS
              delivery. Public surfaces describe quote-based enterprise subscription pricing scaled by certificate
              volume, modules, and deployment model, while EJBCA Community is free to self-operate. No source in the
              assigned pool provides realized price, discounting, contract duration, renewal rate, or revenue mix, so
              ARR should not be substituted for revenue or cash flow.
