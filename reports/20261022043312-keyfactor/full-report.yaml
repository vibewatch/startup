      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public proof narrows the decision to a conditional diligence path rather than a price-insensitive investment.
    data:
      nodes:
        - id: scale-proof
          label: Historical scale proof
          detail: $100M+ ARR disclosed for February 2024.
        - id: product-proof
          label: Enterprise product proof
          detail: PKI, lifecycle automation, and hybrid deployment breadth.
        - id: sponsor-proof
          label: Sponsor validation
          detail: 2023 enterprise-value anchor and 2026 growth investment.
        - id: comparability-check
          label: Metric comparability check
          detail: Funding, ARR, and enterprise value are not interchangeable.
        - id: evidence-gap
          label: Current evidence gap
          detail: No current valuation, audited metrics, cap table, or preference terms.
        - id: recommendation
          label: Research more
          detail: Proceed only with primary financial and transaction evidence.
      edges:
        - from: scale-proof
          to: product-proof
        - from: product-proof
          to: sponsor-proof
        - from: sponsor-proof
          to: comparability-check
        - from: comparability-check
          to: evidence-gap
        - from: evidence-gap
          to: recommendation
    approximationNotes: The ordered flow shows decision logic, not a quantitative conversion or probability model.
    claimRefs:
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
