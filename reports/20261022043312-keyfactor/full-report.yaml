figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly documented milestones show a progression from PKI origins through platform combination, sponsor
      financing, and 2026 scale expansion.
    data:
      items:
        - date: '2001'
          label: Company founded
          detail: Third-party company profile identifies Keyfactor as founded in 2001.
          tone: neutral
        - date: '2019'
          label: Initial Insight investment
          detail: The 2021 announcement describes an initial $77M Insight Partners investment in 2019.
          tone: positive
        - date: '2021-04-15'
          label: Keyfactor and PrimeKey announce merger
          detail: The combination brought certificate lifecycle automation together with EJBCA certificate-authority software.
          tone: positive
        - date: '2021-04-15'
          label: $125M growth infusion disclosed
          detail: Insight Partners led a $125M growth infusion described in the merger announcement.
          tone: positive
        - date: '2023-10-24'
          label: Sixth Street minority investment
          detail: Sixth Street announced a significant minority investment at approximately $1.3B enterprise value.
          tone: positive
        - date: '2026-07-06'
          label: $1B+ strategic growth investment
          detail: Summit Partners led a strategic growth investment; existing investors retained significant ownership.
          tone: positive
        - date: '2026-07-06'
          label: Scale and sector claims updated
          detail: >-
            The company reported more than 2,500 customers and penetration across major banks, retailers, Fortune 100
            companies, and government.
          tone: neutral
        - date: '2026-07-07'
          label: Alternative transaction description
          detail: >-
            Discoperi describes a $1.0B Summit buyout closing on this date, creating a structure and valuation
            reconciliation question.
          tone: warning
    approximationNotes: >-
      Dates and descriptions are transcribed from retained sources; the duplicate 2026 transaction entries preserve
      differing public descriptions rather than implying two separate financings.
    claimRefs:
      - CO001
      - CO009
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: Evidence-constrained market sizing lenses
    type: pyramid
    summary: >-
      A layered view separates operating scale, workflow economics, and policy-driven demand without implying that the
      values are additive.
    data:
      items:
        - label: Enterprise digital-trust workflow
          value: '>$200M ARR'
          valueNote: Keyfactor operating scale reported for early Q3 2026; not total market size
          tone: positive
        - label: Certificate-estate economics
          value: £75K-£200K/year
          valueNote: Indicative comparison range, not a Keyfactor quote
          tone: positive
        - label: Comparable CLM ROI lens
          value: 243%-312%
          valueNote: Forrester studies cited for other CLM products and composite enterprises
          tone: neutral
        - label: Public TLS validity trigger
          value: 200 / 100 / 47 days
          valueNote: Schedule reported for March 2026, March 2027, and March 2029
          tone: warning
        - label: Visibility gap
          value: 17%
          valueNote: Keyfactor-published figure for organizations with real-time certificate visibility
          tone: warning
        - label: Quantum-readiness friction
          value: 40% / 40% / 39%
          valueNote: 'Company-published cited barriers: skills, competing priorities, and unclear standards'
          tone: warning
    approximationNotes: >-
      Layers intentionally retain different units and denominators as separate sizing lenses. The figure is not a
      proportional TAM/SAM/SOM calculation and does not infer market share, conversion, or a common currency.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM012
      - CM013
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Keyfactor is positioned as a flexible enterprise PKI and CLM platform, while alternatives trade away breadth,
      authority depth, or operating control.
    data:
      xAxis:
        label: Operating simplicity
        min: 0
        max: 10
      yAxis:
        label: PKI and enterprise control
        min: 0
        max: 10
      points:
        - label: Keyfactor
          x: 6
          'y': 9
          note: Ordinal synthesis from multi-CA, deployment, EJBCA, and automation evidence; not a measured score.
        - label: Venafi / CyberArk
          x: 4
          'y': 9
          note: Ordinal synthesis from enterprise depth and integration breadth versus reported operational complexity.
        - label: DigiCert CertCentral
          x: 8
          'y': 5
          note: >-
            Ordinal placement reflects CA-specific simplicity; assigned sources do not establish full private-PKI
            capability.
        - label: TigerTrust
          x: 8
          'y': 6
          note: >-
            Competitor-authored comparison emphasizes cloud-native simplicity; authority depth is not independently
            established.
        - label: EJBCA Community
          x: 3
          'y': 8
          note: Open-source authority control with self-operation burden.
        - label: Internal build
          x: 2
          'y': 7
          note: Control is retained, but operating simplicity is low absent public staffing evidence.
    approximationNotes: >-
      Coordinates are ordinal analyst synthesis from the cited capability and deployment evidence, not vendor scores or
      a validated market benchmark.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP009
      - CP010
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a recurring-revenue model fed by enterprise PKI and certificate-management activity, but
      the conversion to recognized revenue and gross profit remains unquantified.
    data:
      nodes:
        - id: enterprise-estates
          label: Enterprise machine identities and certificates
          detail: Customer activity creates demand for certificate issuance, renewal, discovery, and cryptographic governance.
        - id: platform-products
          label: Command, EJBCA, and cryptographic tooling
          detail: Keyfactor describes a unified trust platform with software, SaaS, and managed deployment options.
        - id: subscription-contracts
          label: Quote-based enterprise subscriptions
          detail: >-
            Public pricing is scaled by certificate volume, modules, and deployment model; realized terms are
            unavailable.
        - id: reported-arr
          label: '>$200M ARR'
          detail: Company reported exceeding $200 million ARR in early Q3 2026.
        - id: recognized-revenue
          label: Recognized revenue
          detail: GAAP revenue, billings, deferred revenue, and services mix are not publicly disclosed in the assigned pool.
        - id: gross-profit
          label: Gross profit and cash conversion
          detail: Gross margin, cash flow, burn, and runway remain diligence gaps.
      edges:
        - - enterprise-estates
          - platform-products
        - - platform-products
          - subscription-contracts
        - - subscription-contracts
          - reported-arr
        - - reported-arr
          - recognized-revenue
        - - recognized-revenue
          - gross-profit
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI006
      - CI007
  - id: FE001
    title: Keyfactor product architecture map
    type: stack
    summary: >-
      Keyfactor combines lifecycle automation with certificate-authority, signing, cloud-gateway, and
      cryptographic-agility layers.
    data:
      layers:
        - label: Lifecycle control
          detail: Certificate discovery, inventory, issuance, renewal, and reporting.
          items:
            - name: Command
              detail: Discover, inventory, issue, renew, and deploy certificates and keys.
              status: commercial product
            - name: Policy and reporting
              detail: Manage certificate operations and operational reporting across environments.
              status: capability described in public profiles
        - label: Authority
          detail: Certificate-authority infrastructure for enterprise and machine identities.
          items:
            - name: EJBCA Enterprise
              detail: Certificate-authority infrastructure for enterprise and machine identities.
              status: commercial product
            - name: SignServer Enterprise
              detail: Signing capability named in the combined Keyfactor and PrimeKey portfolio.
              status: named product
        - label: Signing
          detail: Signing capability for code and other digital objects.
          modules:
            - label: SignServer Enterprise
              detail: Signing capability named in the combined Keyfactor and PrimeKey portfolio.
        - label: Deployment connectivity
          detail: Cloud, managed, appliance, and hardware deployment options.
          items:
            - name: PKIaaS and SaaS PKI
              detail: Cloud, managed, appliance, and hardware deployment options are described.
              status: deployment options described
            - name: Remote CA Gateway
              detail: Outbound-only port 443 connection between on-premises PKI and Keyfactor Cloud.
              status: announced service capability
        - label: Integrations
          detail: Connections to cloud, on-premises, and certificate-authority environments.
          modules:
            - label: Remote CA Gateway
              detail: Outbound-only port 443 connection between on-premises PKI and Keyfactor Cloud.
        - label: Cryptographic agility
          detail: Cryptographic inventory and post-quantum migration preparation.
          items:
            - name: Cryptographic inventory
              detail: Discover and inventory cryptographic assets and algorithms.
              status: third-party profile description
            - name: Post-quantum readiness
              detail: Support migration planning as algorithms and certificate lifetimes change.
              status: capability direction; customer outcomes unverified
    approximationNotes: Conceptual evidence-bounded stack; it is not a vendor reference architecture or measured data-flow diagram.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE010
      - CE011
  - id: FU001
    title: Customer journey from regulated need to expansion
    type: journey-map
    summary: >-
      Public evidence supports a plausible enterprise journey from regulated machine-identity need to platform adoption,
      while the production-outcome and renewal stages remain unverified.
    data:
      items:
        - label: Regulated need
          title: Certificate and machine-identity complexity
          detail: >-
            Banks, retailers, government agencies, and device manufacturers face distributed certificate and identity
            workflows.
          touchpoints:
            - Security and PKI teams
            - Cloud, on-premises, and connected-device estates
        - label: Evaluation
          title: Enterprise platform selection
          detail: Buyers compare certificate discovery, issuance, renewal, CA orchestration, and deployment models.
          touchpoints:
            - Keyfactor Command
            - EJBCA and PKI-as-a-Service
        - label: Deployment
          title: Operational rollout
          detail: >-
            Public evidence describes products and customer references but does not disclose implementation duration or
            production scope.
          touchpoints:
            - Certificate inventory
            - Issuance and renewal automation
        - label: Active use
          title: Machine-identity management
          detail: Reported customer counts indicate reach, but active-account and utilization telemetry is not public.
          touchpoints:
            - Enterprise security operations
            - IoT and embedded-device workflows
        - label: Expansion
          title: Discovery-to-management breadth
          detail: >-
            The combined portfolio is positioned to extend from certificate lifecycle management into cryptographic
            discovery and posture management.
          touchpoints:
            - Post-quantum readiness
            - Additional workloads and business units
        - label: Renewal
          title: Retention and referenceability
          detail: >-
            Approximately 120% NRR is reported, but renewal cohorts, churn, GRR, and customer concentration require
            private verification.
          touchpoints:
            - Renewal and expansion
            - Reference customer outcomes
    approximationNotes: >-
      This is an analytical sequence rather than a measured conversion funnel; the assigned evidence does not provide
      stage populations or conversion rates.
    claimRefs:
      - CU003
      - CU006
      - CU011
      - CU012
      - CU013
