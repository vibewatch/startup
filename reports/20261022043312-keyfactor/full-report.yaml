  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and market position
        blocks:
          - type: paragraph
            body: >-
              Keyfactor traces its operating history to 2001 and is headquartered in Independence, Ohio, according to a
              third-party company profile. Its business is organized around machine identity and public-key
              infrastructure: Command inventories and automates certificates and keys, while EJBCA Enterprise provides
              certificate-authority functionality. The 2021 Keyfactor-PrimeKey merger added EJBCA, SignServer, and
              related cryptographic capabilities to the platform and expanded deployment choices across SaaS,
              on-premises, cloud, and hardware-backed environments. The strongest current description is a
              trust-infrastructure platform rather than a single certificate-renewal tool. Keyfactor's own 2026
              investment announcement says its Trust Control Plane is intended to centralize machine identities,
              cryptographic assets, and trust systems across cloud, on-premises, and hybrid environments. The company
              therefore has a coherent identity and product story, but the public record does not independently verify
              revenue quality, customer concentration, or implementation economics.
