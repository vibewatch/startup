      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The budget owner is usually a security, infrastructure, PKI, or platform engineering function, while users
              include certificate operators, DevOps teams, application owners, device manufacturers, and compliance
              teams. The payer's adoption path starts with a trigger such as an outage, audit requirement, cloud or IoT
              expansion, certificate-lifetime change, or post-quantum inventory project; it then requires discovery and
              ownership mapping, a deployment choice, integration with existing CAs and HSMs, policy design, and ongoing
              renewal governance. Start with Identity describes quote-based enterprise pricing scaled by certificate
              volume, modules, and deployment model, and says full value requires investment in discovery, integration,
              and policy design.

              Growth drivers are unusually concrete: shorter certificate validity raises renewal frequency; AI agents
              and connected devices add machine identities; post-quantum readiness creates a migration program; and the
              EU Cyber Resilience Act introduces obligations for connected products, including for some US-based sellers
              into the EU. Keyfactor's own 2026 outlook reports that only 17% of organizations have real-time visibility
              across their certificate landscape and that lack of skilled personnel, competing priorities, and unclear
              standards slow quantum preparation. These are company-published or cited figures and should not be treated
              as an independent market census.

              Constraints are equally important for valuation: insufficient in-house PKI expertise, fragmented
              ownership, implementation complexity, quote-based pricing, and the possibility that buyers select bundled
              CA or identity suites. A competitor-authored comparison also notes that technical capability does not
              solve organizational dysfunction. Adoption can therefore be urgent without being fast, and revenue growth
              can depend on implementation capacity and customer readiness as much as on category demand.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
