      - number: '4.2'
        title: Operating leverage is plausible but not underwritten
        blocks:
          - type: paragraph
            body: >-
              The strongest public operating assertion is that Keyfactor is operating profitably while continuing to
              reinvest in the business. That statement is useful directionally, but it does not disclose EBITDA,
              operating margin, gross margin, free cash flow, or the treatment of services and acquisition costs. The
              product and delivery model can create both software-like leverage and material service cost: Keyfactor
              offers on-premises software, SaaS, and fully managed PKIaaS, and its own product announcement framed cloud
              delivery as reducing the effort and expense of running software and server infrastructure on-premises.
              Conversely, enterprise implementations require PKI expertise, integration, policy design, and potentially
              professional services. A competitor comparison describes six-figure annual pricing for both Keyfactor and
              Venafi but is not a benchmark and should not be treated as realized pricing. The underwriting gap is
              therefore not whether a high-margin software model is possible; it is whether mix, implementation burden,
              support obligations, and renewal economics produce repeatable gross and free-cash margins at the reported
              ARR scale.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
