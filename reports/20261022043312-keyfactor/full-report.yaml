              - CI013
              - CI014
      - number: '4.3'
        title: Sponsor support lowers near-term financing risk, not diligence risk
        blocks:
          - type: paragraph
            body: >-
              Keyfactor has had repeated sponsor backing, including a $125 million growth infusion announced in 2021, a
              minority investment at approximately $1.3 billion enterprise value announced in October 2023, and a $1
              billion-plus Summit Partners investment referenced in the 2026 ARR announcement. Caplight lists a July 6,
              2026 growth-equity event and historical rounds, but the public page does not display amounts or
              transaction documents. The 2023 announcement explicitly says that no other terms of the private
              transaction were disclosed, so primary versus secondary proceeds, preference stack, dilution, cash on
              hand, debt, and use of funds remain unknown. The reported profitability and new sponsor capital reduce the
              evidence for an immediate liquidity emergency, but they do not prove runway or capital adequacy. A planned
              Cofide acquisition and continued global expansion could increase execution and integration needs. The
              financial verdict is positive on demand and sponsor access, conditional on diligence of ARR quality,
              customer concentration, retention, margin, cash conversion, transaction structure, and acquisition
              funding.
