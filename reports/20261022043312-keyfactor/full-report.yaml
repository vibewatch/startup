  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant buying decision is broader than a feature comparison among certificate lifecycle management
              vendors. Keyfactor Command sits in an enterprise CLM set that includes Venafi, now positioned within
              CyberArk, and DigiCert CertCentral, while EJBCA gives Keyfactor a certificate-authority option rather than
              only a management console. An independent profile describes Command as the inventory and automation layer
              and EJBCA Enterprise as the authority issuing certificates, while also noting that CyberArk's acquisition
              of Venafi creates a suite-bundling threat. The competitor set therefore includes enterprise platforms,
              public-CA products, lightweight private-PKI tools such as Smallstep, open-source or self-operated EJBCA,
              and internal build or status-quo operations. A competitor-authored alternative page adds TigerTrust as a
              cloud-native substitute and explicitly frames migration as possible without re-issuance, which is a
              credible switching path but not an independent benchmark. The buyer's primary axis is control over CA and
              deployment topology versus operating simplicity, not a universal feature leaderboard.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
      - number: '3.2'
        title: Capability, pricing, and distribution trade-offs
        blocks:
          - type: paragraph
            body: >-
              The strongest public differentiation is the combination of CA agnosticism, hybrid or SaaS deployment, and
              PKI depth. AxelSpire's 2026 comparison places Keyfactor between Venafi's broader enterprise positioning
              and DigiCert's CA-specific model, with a stated best-fit range of 10,000 to 500,000 certificates; its
              displayed comparison lists $75,000-$200,000 per year for Keyfactor and $250,000-$500,000 or more for
              Venafi. Those figures are a third-party comparison, not a disclosed Keyfactor price list, and should be
              treated as directional. A separate review says pricing is quote-based and scaled by certificate volume,
              modules, and deployment model. Keyfactor's 2021 product announcement describes on-premises, SaaS, and
              managed PKIaaS options, plus a single outbound connection for hybrid deployment. These choices can reduce
              displacement risk for regulated buyers that cannot move all PKI to SaaS, but they also imply integration,
              policy-design, and operational complexity. The competitor comparison states that both Keyfactor and Venafi
              can leave enterprise teams with unresolved operational problems, so automation breadth alone does not
              prove lower total cost or fewer incidents.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Keyfactor's most durable apparent advantage is the combined management-and-authority architecture: EJBCA
              contributes certificate-authority credibility, while Command, SignServer, and cryptographic posture
              tooling extend the platform across issuance, signing, discovery, and post-quantum preparation. The PKI
              Consortium describes four capability areas including visibility, trusted identity, lifecycle automation,
              and resilience, and an independent review says EJBCA gives genuine CA depth. Historical investor material
              reports more than 1,500 organizations and a three-year revenue CAGR above 70 percent in 2023, but those
              are company-issued claims and do not establish current share or retention. Switching can be costly when
              customers must reissue certificates and move issuance rules, yet a competitor says it can operate above
              Keyfactor as a CLM plane and later consolidate, demonstrating a path to multi-homing. CyberArk's Venafi
              acquisition raises incumbent bundle risk, while open-source EJBCA, public CAs, and internal PKI teams
              constrain pricing power at the low-complexity end. The evidence supports a meaningful but not impregnable
              moat; independent churn, implementation-time, outage, and win-loss data are not public in this pool.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
