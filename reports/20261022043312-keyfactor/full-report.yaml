  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Keyfactor addresses an enterprise workflow in which security and infrastructure teams discover
              certificates and keys, establish or connect certificate authorities, issue and renew machine identities,
              and deploy them across devices, workloads, applications, and hybrid infrastructure. The InfoMSP directory
              describes management of certificates, keys, and machine identities, while the 2021 product announcement
              describes discovery, management, and lifecycle automation across on-premises and multi-cloud operations.
              The workflow is therefore more than a certificate dashboard: it combines inventory, authority
              connectivity, policy-driven issuance, renewal, and deployment. The practical buyer value is reduced manual
              certificate operations and a single control surface, but the available evidence does not independently
              quantify uptime, avoided incidents, or implementation time.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE014
      - number: '5.2'
        title: Product modules and maturity
        blocks:
          - type: paragraph
            body: >-
              The public product map has three functional centers. Keyfactor Command is described as the
              lifecycle-control layer for discovering, inventorying, issuing, and renewing certificates and keys. EJBCA
              Enterprise supplies certificate-authority infrastructure built on the open-source EJBCA project, while
              SignServer supports signing workflows. The 2021 merger announcement also names Bouncy Castle and positions
              the combined portfolio for PKI-as-a-Service, SaaS PKI, software-appliance, and FIPS 140-certified hardware
              deployment. More recent third-party descriptions add cryptographic discovery, inventory, and agility
              tooling aimed at finding quantum-vulnerable algorithms. This is a coherent platform architecture, but
              public sources do not provide a complete versioned module catalogue, product-by-product release cadence,
              or independently tested performance envelope. Historical assurance evidence is also product-specific: a
              2021 investor release reported certifications for the then-PrimeKey product set and management processes,
              but that does not establish the current assurance scope of every Keyfactor module.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE017
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Architecture, deployment, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Keyfactor's differentiating architectural choice is the combination of a lifecycle management plane with a
              certificate authority that can be operated as part of the same stack. The 2021 announcement says customers
              can use PKI as a Service, SaaS PKI on Azure, AWS, and GCP, a software appliance, or FIPS 140-certified
              hardware, and describes a single-pane-of-glass approach across hybrid and multi-cloud environments. The
              later CLAaaS announcement describes an outbound-only port 443 connection from on-premises PKI to the
              Keyfactor Cloud through a Remote CA Gateway, avoiding a VPN or inbound firewall opening. These options
              support regulated and hybrid estates, but create dependencies on certificate-authority integration, policy
              migration, key custody, and customer operating skill. Public material does not establish failover design,
              recovery objectives, or production-scale throughput.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE013
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, trust, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Keyfactor's strongest technical differentiators are CA depth, deployment flexibility, and a stated focus
              on crypto-agility. The merger combined certificate lifecycle automation with EJBCA, which the company
              describes as a flexible certificate authority used across DevOps, IoT, manufacturing, and enterprise
              cases. An independent community review characterizes EJBCA as giving Keyfactor genuine CA depth and
              identifies crypto- agility and flexible SaaS or self-hosted deployment as strengths, while also noting
              that full value requires discovery, integration, and policy-design effort. A competitor comparison reports
              stronger integration breadth for Venafi and presents Keyfactor as simpler and more flexible for common use
              cases, but that comparison is not an independent benchmark. The historical certification record is
              meaningful but does not replace current product-by-product security attestations. The diligence priority
              is production proof: customer-specific deployment duration, support SLAs, incident history, current
              assurance scope, upgrade burden, and evidence that post-quantum features operate at customer scale.
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CA depth is the core technical moat
            body: >-
              Keyfactor is not only a lifecycle-management console: its EJBCA foundation gives it certificate-authority
              depth and multiple deployment choices, which can reduce the need to assemble separate CA and CLM products.
            calloutType: strength
            claimRefs:
              - CE006
              - CE014
          - type: callout
            title: Reliability and implementation evidence are thin
            body: >-
              Public sources describe architecture and capabilities but do not establish independent uptime, recovery
              objectives, implementation duration, support-SLA performance, or production-scale throughput.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
          - type: callout
            title: Hybrid flexibility increases diligence surface
            body: >-
              On-premises, SaaS, managed, appliance, and hardware options broaden the addressable operating model, but
              each adds integration, key-custody, upgrade, and support questions that should be tested in customer
              references.
            calloutType: insight
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segment fit
        blocks:
          - type: paragraph
            body: >-
              Public evidence places Keyfactor primarily in enterprise security and PKI workflows where certificates,
              keys, and certificate authorities span cloud, on-premises, and connected-device estates. A September 2026
              company profile says the company sells to organizations managing machine identities and reports more than
              1,500 organizations, while a separate 2026 analysis attributes 2,500-plus customers and penetration of
              roughly half of leading US and European banks, 80% of leading US retailers, and more than 40% of the
              Fortune 100. Those figures are not independently audited, and the discrepancy between 1,500-plus and
              2,500-plus means the report should not normalize them into one customer-count KPI. The vertical evidence
              is directionally valuable: financial services, retail, government, automotive, telecom, and medical-device
              use cases all have certificate or embedded-identity needs, but the sources do not disclose customer-level
              revenue, contract size, geography mix, or payer versus user roles.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU016
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals are company and investor communications, not independent usage telemetry.
              The 2023 Sixth Street announcement says Keyfactor was trusted by more than 1,500 organizations and
              reported a three-year revenue CAGR above 70%; the 2021 merger announcement says the company was trusted by
              more than 500 enterprises. A later profile repeats the 2,500-plus figure and names Schneider Electric,
              Siemens, ServiceNow, and M&T Bank as customer-wall examples, but it does not document the deployment
              scope, production status, contract value, or measurable outcome for any of them. The customer evidence
              therefore supports referenceability and enterprise relevance, not proof of active use or successful
              expansion. Competitive material reports 4.5/5 from 34 Gartner Peer Insights reviews and 100% renewal
              intent, but its methodology is summarized rather than independently inspectable here. Public evidence also
              lacks a time series of active accounts, locations, certificate volumes per customer, implementation
              duration, or usage utilization.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU008
              - CU017
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU006
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Keyfactor's customer durability is plausible but not publicly underwritten. The 2026 profile reports
              approximately 120% net revenue retention from a 2025 interview, while explicitly warning that the metric
              is a company statement without public financial statements for cross-verification. No source in the
              assigned pool provides gross retention, logo churn, renewal cohorts, contract duration, expansion by
              account, or customer concentration. The product architecture can create operational switching costs
              because customers may need to move issuance rules and reissue certificates when changing certificate
              authorities, but that is a mechanism-based inference rather than observed retention. The same evidence
              indicates a potentially strong enterprise reference loop in regulated industries, while also leaving
              procurement friction and implementation dependence unresolved. The underwriting implication is to treat
              reported NRR as a positive signal, not as verified recurring-revenue durability, and to request cohort and
              concentration schedules before assigning expansion credit.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulated-enterprise reference potential
            body: >-
              Reported penetration of banks, retailers, and the Fortune 100 suggests a customer base aligned with
              high-consequence identity workflows, but the figures remain company-reported and should be validated
              account by account.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Durability is not independently measurable
            body: >-
              Public materials do not provide the denominator, cohort construction, or recurring-revenue reconciliation
              behind the approximately 120% NRR claim, and they provide no top-customer concentration schedule.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU014
          - type: callout
            title: Require customer cohort diligence
            body: >-
              Request anonymized logo cohorts, GRR and NRR bridges, renewal and churn definitions, top-20 concentration,
              production references, and implementation timelines before underwriting expansion or retention.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risk is operational execution in an environment where certificate failures can
              create outages, compliance findings, or reputational damage. Keyfactor's own product material describes
              hybrid deployments, multiple certificate authorities, on-premises PKI, SaaS, and a secure outbound gateway
              as core operating patterns; that flexibility is valuable but creates integration, ownership, and
              change-management surfaces that are not independently measured in the retained evidence. The 2021 merger
              announcement also states that closing was pending Swedish authority approval, illustrating that product
              and corporate execution can depend on external approvals. The risk is not that the platform is shown to be
              unreliable; rather, the public evidence does not provide independent uptime, incident, support-SLA, or
              implementation-effort data for the current estate. Investors should monitor certificate-related incidents,
              renewal and escalation metrics, deployment duration, and support performance by customer cohort.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and security posture
        blocks:
          - type: paragraph
            body: >-
              Keyfactor operates in a category shaped by security controls, data-residency expectations,
              certificate-policy changes, and public-sector or regulated-enterprise procurement. The retained product
              announcement says some customers keep PKI behind their firewall for regulatory or policy reasons, and
              describes a single outbound-only connection rather than a VPN or firewall opening. That is a mitigation
              design, not evidence that every deployment satisfies every jurisdiction's requirements. The evidence set
              contains no regulator, court, certification, or independently verified breach record for the current
              period. Absence of such a record is not proof of absence. Before investment, diligence should verify
              current certifications and authorizations, data-processing and subprocessor terms, vulnerability
              disclosure and incident history, and whether customer contracts allocate liability for certificate or
              key-management failures.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, financial, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              Keyfactor's platform and go-to-market model depend on certificate authorities, cloud environments, HSMs,
              implementation expertise, and sponsor capital. The merger materials emphasize deployment across public
              CAs, on-premises private PKIs, and cloud providers, while the 2023 investment announcement says no other
              terms of the private transaction were disclosed. The public record therefore supports strategic and
              funding milestones but not a current view of ARR, cash burn, gross margin, customer concentration,
              preference rights, primary-versus-secondary proceeds, or dilution. The adverse implication is valuation
              and resilience uncertainty rather than a documented default or liquidity event. A thesis break would be a
              material security incident, repeated renewal-related outages, loss of a critical integration or sponsor
              support, or diligence showing that growth is not translating into durable recurring economics.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring plan and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Monitoring should combine technical, customer, legal, and financial indicators instead of relying on
              product breadth or sponsor validation. Track severity-one incidents and mean time to remediate; failed or
              delayed renewals; deployment and migration duration; the share of revenue dependent on a small set of
              customers, certificate authorities, cloud providers, or partners; support-SLA attainment; and any
              regulatory, litigation, or certification change. The available sources establish that Keyfactor has
              flexible deployment options and disclosed sponsor backing, but they do not close the current-period
              questions on uptime, retention, customer concentration, unit economics, or transaction structure. Those
              gaps should remain explicit decision conditions, not be converted into assumed low risk.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The most important unknown is operational proof
            body: >-
              Keyfactor's materials describe a platform intended to prevent certificate outages, but the assigned
              evidence does not independently establish current uptime, incident frequency, implementation effort, or
              support performance.
            calloutType: risk
            claimRefs:
              - CR003
              - CR013
          - type: callout
            title: Make price conditional on diligence
            body: >-
              Sponsor validation and historical growth support continued diligence, but undisclosed transaction terms
              and missing recurring-economics data warrant a research-more posture with explicit technical and financial
              gates.
            calloutType: recommendation
            claimRefs:
              - CR011
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence and a medium-high risk rating. The strongest
              historical price anchor is Sixth Street's October 2023 minority investment at an approximately $1.3
              billion enterprise value, while current sources report a July 2026 investment of at least $1 billion
              without disclosing the resulting valuation or transaction mix. Those figures are different metrics and
              cannot be combined into a current price. FundedIQ labels the 2026 event a $1.0 billion private equity
              round, while YesPress describes a Summit-led strategic growth investment of more than $1 billion with
              existing investors retaining significant ownership. The public record therefore validates sponsor
              appetite, not entry value, ownership dilution, liquidation preferences, or expected return. Any investment
              decision should remain conditional on primary cap-table documents and current audited operating data.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Keyfactor occupies durable trust infrastructure: its product spans certificate
              lifecycle automation, private PKI, and multiple deployment modes, while an independent review calls it a
              leading enterprise choice. YesPress reports that the company had disclosed more than $100 million of ARR
              in February 2024, and the 2023 investor announcement cited more than 1,500 organizations and over 70%
              three-year revenue CAGR. The anti-thesis is equally material. Start with Identity says smaller teams can
              be over-served and that full value requires discovery, integration, and policy work. A competitor-authored
              comparison argues that legacy integrations may require custom work, and an independent automated profile
              notes that revenue and margin are not independently confirmed. Product quality can therefore coexist with
              a poor risk-adjusted return if the entry price assumes unverified growth or easy deployment.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
      - number: '8.3'
        title: Scenarios and return logic
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario framework must use diligence thresholds rather than invented valuation precision.
              The bull case requires current ARR materially above the disclosed 2024 level, durable retention,
              attractive software gross margins, and successful integration of acquired capabilities; only then could a
              premium to the 2023 enterprise value anchor be evaluated. The base case treats the company as
              strategically credible but presently unpriceable because a large financing amount does not reveal
              enterprise value or equity value. The bear case is multiple compression or a down round if growth has
              slowed, implementation friction impairs expansion, or the 2026 capital contains investor protections that
              subordinate new money. No numeric probability or return range is supportable from the assigned public
              evidence, so each case is tied to a measurable diligence signal and a downside trigger.
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Sponsor participation and a historical billion-dollar enterprise value establish financing credibility,
              but they do not establish IPO readiness, likely acquirers, or a realizable exit multiple. The company
              remains private, public pricing is quote-based, and the evidence set does not provide audited revenue,
              margins, cash flow, net retention, customer concentration, primary-versus-secondary financing mix, or
              liquidation preferences. Before underwriting an exit, diligence should reconcile the cap table to every
              financing, obtain ARR and cohort schedules through September 2026, test gross-margin and cash-conversion
              quality, review top-customer concentration, and compare win-loss data against Venafi, DigiCert, AppViewX,
              and cloud-native alternatives. Thesis-break triggers are current ARR near the 2024 disclosed level,
              retention below the investment case, material preference overhang, or implementation economics that
              prevent scalable expansion.
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No public price support
            body: >-
              The July 2026 investment amount cannot be treated as Keyfactor's valuation. Require the signed financing
              documents, fully diluted ownership, preference waterfall, and current operating schedules before setting
              an entry price.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
              - CV016
