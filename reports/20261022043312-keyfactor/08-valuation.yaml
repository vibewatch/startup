company:
  name: Keyfactor
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a research-more recommendation rather than a price-insensitive
    investment decision. Keyfactor has credible scale and sponsor validation, but the latest
    financing amount is not a disclosed valuation and current ARR, margins, retention,
    transaction structure, and preference terms remain unavailable.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more with medium confidence and a medium-high risk
      rating. The strongest historical price anchor is Sixth Street's October 2023 minority
      investment at an approximately $1.3 billion enterprise value, while current sources
      report a July 2026 investment of at least $1 billion without disclosing the resulting
      valuation or transaction mix. Those figures are different metrics and cannot be
      combined into a current price. FundedIQ labels the 2026 event a $1.0 billion private
      equity round, while YesPress describes a Summit-led strategic growth investment of
      more than $1 billion with existing investors retaining significant ownership. The
      public record therefore validates sponsor appetite, not entry value, ownership
      dilution, liquidation preferences, or expected return. Any investment decision should
      remain conditional on primary cap-table documents and current audited operating data.
    claimRefs: [CV001, CV004, CV005, CV014, CV015, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Keyfactor occupies durable trust infrastructure: its product spans
      certificate lifecycle automation, private PKI, and multiple deployment modes, while
      an independent review calls it a leading enterprise choice. YesPress reports that the
      company had disclosed more than $100 million of ARR in February 2024, and the 2023
      investor announcement cited more than 1,500 organizations and over 70% three-year
      revenue CAGR. The anti-thesis is equally material. Start with Identity says smaller
      teams can be over-served and that full value requires discovery, integration, and
      policy work. A competitor-authored comparison argues that legacy integrations may
      require custom work, and an independent automated profile notes that revenue and
      margin are not independently confirmed. Product quality can therefore coexist with a
      poor risk-adjusted return if the entry price assumes unverified growth or easy
      deployment.
    claimRefs: [CV002, CV003, CV006, CV008, CV009, CV010, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-return-logic
    title: Scenarios and return logic
    body: >-
      A defensible scenario framework must use diligence thresholds rather than invented
      valuation precision. The bull case requires current ARR materially above the disclosed
      2024 level, durable retention, attractive software gross margins, and successful
      integration of acquired capabilities; only then could a premium to the 2023 enterprise
      value anchor be evaluated. The base case treats the company as strategically credible
      but presently unpriceable because a large financing amount does not reveal enterprise
      value or equity value. The bear case is multiple compression or a down round if growth
      has slowed, implementation friction impairs expansion, or the 2026 capital contains
      investor protections that subordinate new money. No numeric probability or return
      range is supportable from the assigned public evidence, so each case is tied to a
      measurable diligence signal and a downside trigger.
    claimRefs: [CV006, CV008, CV009, CV010, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence
    body: >-
      Sponsor participation and a historical billion-dollar enterprise value establish
      financing credibility, but they do not establish IPO readiness, likely acquirers, or a
      realizable exit multiple. The company remains private, public pricing is quote-based,
      and the evidence set does not provide audited revenue, margins, cash flow, net
      retention, customer concentration, primary-versus-secondary financing mix, or
      liquidation preferences. Before underwriting an exit, diligence should reconcile the
      cap table to every financing, obtain ARR and cohort schedules through September 2026,
      test gross-margin and cash-conversion quality, review top-customer concentration, and
      compare win-loss data against Venafi, DigiCert, AppViewX, and cloud-native alternatives.
      Thesis-break triggers are current ARR near the 2024 disclosed level, retention below
      the investment case, material preference overhang, or implementation economics that
      prevent scalable expansion.
    claimRefs: [CV001, CV006, CV008, CV009, CV010, CV011, CV015, CV016]
tables:
