    title: Recommendation summary
    columns: [Decision item, Assessment, Investment implication]
    rows:
      - [Recommendation, Research more, "Do not underwrite a transaction until price and operating evidence are reconciled."]
      - [Confidence, Medium, "Financing and product evidence is visible, but current financial disclosure is insufficient."]
      - [Risk rating, Medium-high, "Private-company opacity and transaction-structure uncertainty dominate otherwise credible product signals."]
      - [Valuation stance, Indeterminate with strict price discipline, "The 2023 enterprise value is stale and the 2026 investment amount is not a valuation."]
      - [Decision implication, Conditional diligence, "Require cap-table, preference, ARR, retention, margin, and cash-flow evidence before pricing."]
    notes: "Assessments synthesize public evidence through 2026-10-22; they are not a valuation estimate, and no current transaction price is publicly supported."
    claimRefs: [CV001, CV004, CV005, CV010, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Historical sponsor validation and an approximately $1.3B enterprise value indicate institutional demand.", "A current financing document showing a lower valuation or punitive senior terms would weaken this signal."]
      - [Thesis, "The company disclosed more than $100M ARR in February 2024 and offers enterprise PKI and lifecycle breadth.", "Stagnant current ARR, weak retention, or services-heavy gross margin would undermine scalability."]
      - [Anti-thesis, "Independent review says smaller teams may be over-served and implementations require discovery, integration, and policy work.", "Fast deployment, low services intensity, and strong cohort expansion would reduce this concern."]
      - [Anti-thesis, "A competitor comparison says legacy and edge integrations may require custom work.", "Verified win-loss data and low customization across large deployments would rebut the critique."]
    notes: "The table separates historical reported metrics, independent review opinions, and competitor-authored criticism; none is treated as audited current performance."
    claimRefs: [CV001, CV006, CV008, CV009, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Current ARR is materially above the 2024 disclosed level; retention and software margins are strong; acquired capabilities cross-sell.", "A premium to the 2023 enterprise-value anchor may be supportable only after current metrics and transaction terms are verified.", "Audited ARR bridge, high net retention, strong gross margin, and clean preference stack.", "Growth or retention misses the underwriting case."]
      - [Base, "Strategic relevance and sponsor support persist, but current financials and transaction terms remain private.", "No defensible numeric range; negotiate from current audited fundamentals rather than the size of the 2026 financing.", "Management supplies reconcilable ARR, margin, cash-flow, and cap-table schedules.", "Price is presented without primary operating and ownership evidence."]
      - [Bear, "Growth slows, integration friction limits expansion, or senior preferences transfer downside to common equity.", "Value could fall below the stale 2023 anchor; capital preservation takes priority over headline sponsor validation.", "Flat ARR, weak retention, services-heavy margins, or structured downside protection.", "A down round, preference overhang, or negative cash conversion is confirmed."]
    notes: "Scenario boundaries are diligence conditions, not forecasts; public evidence does not support numeric probabilities, current valuation ranges, or target returns."
    claimRefs: [CV001, CV004, CV005, CV006, CV008, CV009, CV010, CV014, CV016]
