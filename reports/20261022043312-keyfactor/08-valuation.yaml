callouts:
  - calloutType: recommendation
    title: No public price support
    body: >-
      The July 2026 investment amount cannot be treated as Keyfactor's valuation. Require the
      signed financing documents, fully diluted ownership, preference waterfall, and current
      operating schedules before setting an entry price.
    claimRefs: [CV004, CV005, CV014, CV015, CV016]
