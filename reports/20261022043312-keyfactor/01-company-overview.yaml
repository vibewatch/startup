      - [Insight Partners, Existing investor and 2019 / 2021 capital provider, "Retained significant ownership after 2026 transaction", "Confirm remaining ownership, liquidation preferences, and board rights"]
      - [Sixth Street Growth, 2023 minority investor and board participant, "Retained significant ownership after 2026 transaction", "Confirm current stake, preference stack, and secondary participation"]
      - [Keyfactor management, Operating leadership, "Responsible for execution across product, geographic expansion, and acquisitions", "Obtain retention, incentive, succession, and KPI plans"]
      - [Customers and regulated sectors, Revenue and reference base, "More than 2,500 customers and reported penetration in banks, retailers, Fortune 100, and government", "Validate active-account counts, concentration, renewal, and referenceability"]
    notes: >-
      The map distinguishes named capital providers from the customer
