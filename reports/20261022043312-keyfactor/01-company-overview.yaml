company:
  name: Keyfactor
chapter:
  number: 1
  title: Company Overview
  summary: Keyfactor is a private cybersecurity company focused on machine identity, PKI, certificate lifecycle management, and cryptographic agility. Current evidence shows a July 2026 $1 billion-plus strategic growth investment, more than 2,500 customers, and a product platform spanning certificate discovery, issuance, and ongoing management, while ARR, margins, retention, and transaction terms remain undisclosed.
sections:
  - id: identity-and-business
    title: Identity, product, and market position
    body: >-
      Keyfactor traces its operating history to 2001 and is headquartered in
      Independence, Ohio, according to a third-party company profile. Its
      business is organized around machine identity and public-key
      infrastructure: Command inventories and automates certificates and keys,
      while EJBCA Enterprise provides certificate-authority functionality. The
      2021 Keyfactor-PrimeKey merger added EJBCA, SignServer, and related
      cryptographic capabilities to the platform and expanded deployment choices
      across SaaS, on-premises, cloud, and hardware-backed environments. The
      strongest current description is a trust-infrastructure platform rather
      than a single certificate-renewal tool. Keyfactor's own 2026 investment
      announcement says its Trust Control Plane is intended to centralize
      machine identities, cryptographic assets, and trust systems across cloud,
      on-premises, and hybrid environments. The company therefore has a
      coherent identity and product story, but the public record does not
      independently verify revenue quality, customer concentration, or
      implementation economics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, ownership, and governance
    body: >-
      Jordan Rackie is identified as Chief Executive Officer in the 2021, 2023,
      and 2026 investment materials. The 2021 merger announcement says Magnus
      Svenningson became chief strategy officer and executive vice president of
      business development after PrimeKey joined Keyfactor. The 2026 transaction
      announcement says Summit Partners managing directors Andy Collins and
      Colin Mistele joined the board, while existing investors Insight Partners
      and Sixth Street Growth retained significant ownership. The 2023
      investment announcement separately identifies Bo Stanley and Alex Katz of
      Sixth Street as board appointees. This indicates sponsor-supported
      governance with continuity in operating leadership, but the supplied
      public evidence does not establish the complete board, founder roster,
      succession plan, or the economic/control rights attached to the latest
      transaction.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and diligence implications
    body: >-
      Keyfactor has disclosed multiple financing milestones without publishing
      a complete capitalization table. The 2021 announcement describes a $125
      million growth infusion led by Insight Partners and says it followed an
      initial $77 million Insight investment in 2019. Sixth Street's 2023
      announcement reports a significant minority investment at approximately
      $1.3 billion enterprise value. The July 2026 announcement reports a
      $1 billion-plus strategic growth investment led by Summit Partners, with
      existing investors retaining significant ownership; a separate M&A
      intelligence page describes the transaction as a $1.0 billion buyout
      closed July 7, 2026, so the public descriptions are not fully consistent
      on transaction structure or value. The 2026 company release reports more
      than 2,500 customers, support for 50% of the largest banks in the US and
      Europe, 80% of leading US retailers, and more than 40% of Fortune 100
      companies. These are company-issued operating metrics and should not be
      treated as audited customer or revenue measures. ARR, revenue, margins,
      cash flow, net retention, debt, and primary-versus-secondary proceeds
      remain open diligence items.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
