companyProfile:
  summary: >-
    Character.AI is a Menlo Park-based consumer AI companion platform founded in January 2021 by former Google Brain
    researchers Noam Shazeer and Daniel De Freitas. Users create and converse with AI-powered personas across
    entertainment, roleplay, education, and emotional-support use cases. The platform reached roughly 45M monthly active
    users and 75M+ cumulative downloads by September 2025, generating an estimated $50M ARR. In August 2024, Google
    licensed the founding team's LLM technology for approximately $2.7B; Shazeer, De Freitas, and about 30 engineers
    returned to Google, leaving Character.AI with a much stronger cash position but a heavier dependence on external
    model infrastructure. The company now operates under intense teen-safety litigation and regulatory scrutiny.
  foundedDate: '2021-01-01'
  founders:
    - name: Noam Shazeer
      role: Co-Founder (departed to Google August 2024)
      background: >-
        Google Brain senior researcher; co-author of the Transformer paper; designed Character.AI's original LLM
        architecture before departing with the Google licensing deal.
      claimRefs:
        - CO002
    - name: Daniel De Freitas
      role: Co-Founder (departed to Google August 2024)
      background: >-
        Google Brain researcher; built the early Character.AI product alongside Shazeer before departing with the Google
        licensing deal.
      claimRefs:
        - CO002
    - name: Karandeep Anand
      role: CEO (since June 2025)
      background: Ex-Microsoft Teams and Meta executive; hired to lead the post-Google-deal company.
      claimRefs:
        - CO003
  foundingLocation: Menlo Park, CA
  headquarters: Menlo Park, CA
  productSummary: >-
    Character.AI provides a consumer AI companion platform where users create and interact with AI-powered characters
    representing fictional personas, celebrities, and custom assistants. Core capabilities include multi-turn
    persona-consistent conversation, user-controlled character creation tools, and a premium Character.AI+ subscription
    offering faster response times and priority access. The product stack shifted away from the founding team's
    proprietary model approach after the Google licensing deal and now relies more on external model infrastructure.
  customerFocus: >-
    Primarily consumer users, especially teens and young adults, for entertainment, roleplay, emotional support, and
    creative writing.
  businessModel: >-
    Freemium consumer subscription: most users stay free while a small share converts to Character.AI+ at $9.99/month.
    No enterprise, developer API, or large B2B revenue stream is publicly disclosed.
  stage: late-stage private
  fundingStatus: >-
    Series A closed March 2023 ($150M at a $1B valuation, led by a16z and Spark Capital). The August 2024 Google
    licensing deal provided approximately $2.7B in total consideration, leaving the company with a large cash position
    and no subsequent equity financing publicly disclosed.
  disclosureProfile: private-undisclosed
