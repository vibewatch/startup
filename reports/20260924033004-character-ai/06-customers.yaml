      items:
        - label: Discovery
          detail: Users find the app through fandom, social sharing, or app stores.
          claimRefs: [CU001, CU004]
        - label: First chat
          detail: A user tries a character and quickly learns whether the persona feels sticky.
          claimRefs: [CU003, CU004]
        - label: Deep engagement
          detail: Long sessions and repeated conversations turn the app into a habit.
          claimRefs: [CU005, CU006]
        - label: Creation
          detail: Some users create characters and contribute to the library.
          claimRefs: [CU004, CU009]
        - label: Monetization
          detail: Power users upgrade to paid access or encounter advertising.
          claimRefs: [CU009, CU010]
        - label: Retention / churn
          detail: Safety restrictions, age checks, and alternative apps can push users away.
          claimRefs: [CU007, CU008, CU011, CU012]
    claimRefs: [CU001, CU003, CU005, CU006, CU009, CU010, CU011, CU012]
