company:
  name: Character.AI
chapter:
  number: 6
  title: Customers
  summary: Character.AI's customer base is consumer-first, teen-heavy, and highly engaged, but public evidence still mixes web-traffic proxies, MAU estimates, and a small number of named user cases.
sections:
  - id: segmentation
    title: Customer segmentation and adoption
    body: >-
      Character.AI's users are mostly consumers rather than institutions. The strongest public evidence points to teens, young adults, and
      fandom-heavy users who are drawn to role-play, creative writing, companionship, and casual entertainment. The company also reaches
      language learners and other low-pressure conversation use cases, but those are secondary. Adoption is visible in a large character
      library, high session depth, and a growing feed of user-created content. The key customer question is not whether people use the app;
      it is how durable that use remains once safety restrictions, age checks, and monetization friction are layered on top.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001, TU002]
  - id: proof-and-retention
    title: Named proof and retention
    body: >-
      Named proof in this category is mostly indirect or adverse because the product is consumer-facing and the best documented cases are
      lawsuits, not enterprise reference accounts. That does not mean the app lacks real users; it means the public record is thin on
      conventional customer logos and thick on evidence that users spend a lot of time in emotionally intense sessions. Public estimates
      also suggest retention is vulnerable to policy changes: traffic and MAU peaked before the safety crackdown on minors, and the
      company has since had to trade some engagement for guardrails. In this market, "proof of use" and "proof of durable use" are not the
      same thing.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion and concentration
    body: >-
      Expansion opportunities exist, but they mostly come from adjacent consumer behaviors rather than a whole new enterprise channel.
      Advertising, creator tools, voice, and video can broaden the product, while a safer teen experience may reopen usage over time.
      Concentration risk remains high because the audience skews young, the geography skews toward a few major countries, and the company
      appears to rely on a relatively small fraction of users for monetization. That makes customer quality and customer safety the same
      analysis: the product can be loved, but if the wrong part of the user base churns, the economics move quickly.
    claimRefs: [CU009, CU010, CU011, CU012]
    figureRefs: [FU001]
