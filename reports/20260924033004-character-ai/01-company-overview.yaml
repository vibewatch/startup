company:
  name: Character.AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Character.AI remains an independent consumer AI companion platform, but its post-2024 structure is unusual: the founders left for
    Google, the company retained the legal entity, and current scale, revenue, and user-count claims remain estimate-heavy rather than
    audited.
sections:
  - id: identity-and-product
    title: Identity and product
    body: >-
      Character.AI is a private consumer AI chatbot platform operated by Character Technologies, Inc. and best known for letting users
      create, share, and chat with character-driven personas. The current public-facing product combines roleplay, companionship, and
      creative storytelling, and the official site describes the company as an AI chat product "reimagined" for users' own words and worlds.
      The company says it is headquartered in Silicon Valley with offices in Seattle and New York, while independent summaries place the legal
      entity in Menlo Park, California. The result is a consumer software company with a highly visible brand, but with a legal and operating
      structure that is still easy to misread from the outside.
    claimRefs: [CO001, CO004, CO005, CO010]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership and capital structure
    body: >-
      Character.AI was founded in November 2021 by Noam Shazeer and Daniel de Freitas, both former Google researchers with direct lineage
      to the Transformer and LaMDA work that underpins modern conversational AI. Andreessen Horowitz led the March 2023 Series A and
      remains the most important disclosed venture investor, while Google paid roughly $2.7 billion in August 2024 for a non-exclusive
      technology license and rehired the founders and a large portion of the research team. That transaction did not transfer equity control,
      so the company stayed legally independent even as its technical center of gravity shifted away from the original founding team.
      Karandeep Anand became CEO in June 2025, which makes current leadership more product-oriented than model-research-led.
    claimRefs: [CO002, CO003, CO006, CO007, CO008, CO013]
    tableRefs: [TO002, TO003]
  - id: scale-and-milestones
    title: Scale and milestones
    body: >-
      Public scale signals remain inconsistent, which is itself an important diligence fact. The company and its supporters have cited
      everything from roughly 20 million monthly active users to 45 million active users, with revenue estimates ranging from the low-$30
      millions to about $50 million annually. That divergence suggests the business is real and scaled, but not transparently reported.
      The most material milestones since launch are the public beta in 2022, the $150 million Series A in 2023, the Google deal in 2024,
      the succession to Karandeep Anand in 2025, and the under-18 product restrictions that rolled out in late 2025 and continued into 2026.
      The company now looks like a large consumer product with meaningful monetization, but one that is still carrying a major unanswered
      question around how much of the scale is durable after safety-driven product changes.
    claimRefs: [CO009, CO010, CO011, CO012]
    figureRefs: [FO001]
