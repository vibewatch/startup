              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario view
        blocks:
          - type: paragraph
            body: >-
              A sensible valuation model splits the company into two pieces: the platform business and the strategic /
              cash-like value embedded in the Google transaction. In the base case, the platform is worth a modest
              premium to recent revenue, but not enough to erase safety and regulatory discounting. In the bull case,
              the company must show a much larger paid base, healthier retention after teen-safety changes, and at least
              one new monetization line. In the bear case, litigation or product restrictions compress engagement and
              the platform value moves back toward a distressed consumer-app multiple. The central diligence question is
              whether management can keep the audience while paying the safety tax required to keep the company
              operating.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
