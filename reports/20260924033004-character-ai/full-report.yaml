      - number: '5.3'
        title: Trust, safety, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Safety is now central to the product rather than an afterthought. The safety center, terms, and public
              product changes show a company that is actively tightening policy around minors, reporting, and age
              assurance. That raises the bar on compliance and trust, but it also shapes the roadmap: more creation
              tools, more content surfaces, and less open-ended teen chat. The roadmap therefore looks like a pivot from
              unrestricted companionship toward moderated entertainment and creation, with the technical challenge of
              preserving engagement while reducing harmful edge cases. In practical terms, product quality now depends
              on both model quality and the guardrails that keep conversations within policy.
            claimRefs:
              - CE002
              - CE006
