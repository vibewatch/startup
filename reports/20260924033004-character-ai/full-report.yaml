      - number: '4.2'
        title: Traction and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public traction is real but still hard to reconcile. Third-party estimates place revenue somewhere between
              roughly $30 million and $50 million annually, while user-scale estimates range from about 20 million to 45
              million active users. That is enough scale to matter, but not enough clarity to underwrite with
              confidence. The cost side is also structurally difficult: Character.AI's product is compute-heavy,
              session-heavy, and increasingly constrained by safety features that can reduce monetization or add support
              overhead. In other words, scale is a strength, but it is not yet obvious that scale converts cleanly into
              margin.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
      - number: '4.3'
        title: Capital adequacy and verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is better than it was before the Google transaction, but the company still lacks audited
              financials and public cap-table clarity. The 2024 Google deal improved liquidity and reduced immediate
              financing pressure, yet the company has not disclosed a full cash balance, burn rate, or runway
              calculation. That means the right conclusion is not that Character.AI is cash starved, but that the market
              still cannot tell whether the business can fund its current product strategy without further capital or
              heavy monetization improvements. Put differently, this is a diligence gap on operating leverage rather
              than a simple liquidity crisis. The financial verdict therefore remains cautious: solid engagement,
              improving monetization, and too many missing inputs for a confident margin model.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
