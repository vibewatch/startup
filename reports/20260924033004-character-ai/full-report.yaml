              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.2'
        title: Leadership and capital structure
        blocks:
          - type: paragraph
            body: >-
              Character.AI was founded in November 2021 by Noam Shazeer and Daniel de Freitas, both former Google
              researchers with direct lineage to the Transformer and LaMDA work that underpins modern conversational AI.
              Andreessen Horowitz led the March 2023 Series A and remains the most important disclosed venture investor,
              while Google paid roughly $2.7 billion in August 2024 for a non-exclusive technology license and rehired
              the founders and a large portion of the research team. That transaction did not transfer equity control,
              so the company stayed legally independent even as its technical center of gravity shifted away from the
              original founding team. Karandeep Anand became CEO in June 2025, which makes current leadership more
              product-oriented than model-research-led.
            claimRefs:
              - CO002
              - CO003
              - CO006
              - CO007
              - CO008
              - CO013
