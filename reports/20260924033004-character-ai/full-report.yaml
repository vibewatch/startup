  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Character.AI's product is best understood as a consumer entertainment and companionship workflow, not as a
              generic chatbot. Users create characters, prompt them into conversations, share them with others, and
              increasingly interact through feed-like creation surfaces and voice modes. The current product story is
              broader than the original "chat with a character" concept: the company now emphasizes creation, sharing,
              and safe under-18 experiences alongside the original role-play chat loop. That makes the module map more
              like a content platform than a simple model wrapper.
            claimRefs:
              - CE001
              - CE007
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
