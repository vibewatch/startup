              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.2'
        title: Named proof and retention
        blocks:
          - type: paragraph
            body: >-
              Named proof in this category is mostly indirect or adverse because the product is consumer-facing and the
              best documented cases are lawsuits, not enterprise reference accounts. That does not mean the app lacks
              real users; it means the public record is thin on conventional customer logos and thick on evidence that
              users spend a lot of time in emotionally intense sessions. Public estimates also suggest retention is
              vulnerable to policy changes: traffic and MAU peaked before the safety crackdown on minors, and the
              company has since had to trade some engagement for guardrails. In this market, "proof of use" and "proof
              of durable use" are not the same thing.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Expansion and concentration
        blocks:
          - type: paragraph
            body: >-
              Expansion opportunities exist, but they mostly come from adjacent consumer behaviors rather than a whole
              new enterprise channel. Advertising, creator tools, voice, and video can broaden the product, while a
              safer teen experience may reopen usage over time. Concentration risk remains high because the audience
              skews young, the geography skews toward a few major countries, and the company appears to rely on a
              relatively small fraction of users for monetization. That makes customer quality and customer safety the
              same analysis: the product can be loved, but if the wrong part of the user base churns, the economics move
              quickly.
            claimRefs:
              - CU009
              - CU010
              - CU011
