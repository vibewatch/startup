chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product
        blocks:
          - type: paragraph
            body: >-
              Character.AI is a private consumer AI chatbot platform operated by Character Technologies, Inc. and best
              known for letting users create, share, and chat with character-driven personas. The current public-facing
              product combines roleplay, companionship, and creative storytelling, and the official site describes the
              company as an AI chat product "reimagined" for users' own words and worlds. The company says it is
              headquartered in Silicon Valley with offices in Seattle and New York, while independent summaries place
              the legal entity in Menlo Park, California. The result is a consumer software company with a highly
              visible brand, but with a legal and operating structure that is still easy to misread from the outside.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
