  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and adoption
        blocks:
          - type: paragraph
            body: >-
              Character.AI's users are mostly consumers rather than institutions. The strongest public evidence points
              to teens, young adults, and fandom-heavy users who are drawn to role-play, creative writing,
              companionship, and casual entertainment. The company also reaches language learners and other low-pressure
              conversation use cases, but those are secondary. Adoption is visible in a large character library, high
              session depth, and a growing feed of user-created content. The key customer question is not whether people
              use the app; it is how durable that use remains once safety restrictions, age checks, and monetization
              friction are layered on top.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
