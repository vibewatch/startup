              - CO011
              - CO013
      - number: '1.3'
        title: Scale and milestones
        blocks:
          - type: paragraph
            body: >-
              Public scale signals remain inconsistent, which is itself an important diligence fact. The company and its
              supporters have cited everything from roughly 20 million monthly active users to 45 million active users,
              with revenue estimates ranging from the low-$30 millions to about $50 million annually. That divergence
              suggests the business is real and scaled, but not transparently reported. The most material milestones
              since launch are the public beta in 2022, the $150 million Series A in 2023, the Google deal in 2024, the
              succession to Karandeep Anand in 2025, and the under-18 product restrictions that rolled out in late 2025
              and continued into 2026. The company now looks like a large consumer product with meaningful monetization,
              but one that is still carrying a major unanswered question around how much of the scale is durable after
              safety-driven product changes.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
