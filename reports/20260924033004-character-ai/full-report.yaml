  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Character.AI's revenue engine is still mostly consumer subscriptions. The company and Sacra describe c.ai+
              as the main monetization lane, with a $9.99 monthly price point for faster replies and priority access.
              The business has also started to test advertising inside the feed, which matters because a pure
              subscription model leaves most of the large user base unmonetized. Public sources do not show a meaningful
              enterprise, API, or licensing revenue stream today, so the model remains closer to a freemium consumer app
              than to a software platform with multiple institutional channels.
            claimRefs:
