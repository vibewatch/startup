              - CE002
              - CE006
              - CE007
              - CE009
              - CE012
      - number: '5.2'
        title: Architecture and deployment
        blocks:
          - type: paragraph
            body: >-
              The public architecture is intentionally opaque. Company pages make clear that Character.AI owns the
              end-user experience and the safety layers around it, but they do not fully disclose the model stack or
              orchestration details. External discussions and developer commentary suggest a classic multi-layer
              consumer AI design: frontend product surfaces, a character and memory layer, model invocation, and
              moderation / guardrails. The important operational fact is that deployment now spans web, mobile, voice,
              and feed experiences, which means reliability and moderation matter as much as raw model quality. That
              broad surface area also means a bug or policy miss can affect discovery, chat, voice, and creator
              workflows at once rather than in one narrow code path.
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
