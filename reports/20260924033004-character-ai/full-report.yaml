  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Legal and regulatory risk is the center of the case, not a side note. The public record now includes
              teen-safety lawsuits, a material under-18 product reset, and a broader policy environment that is
              increasingly focused on age assurance and chatbot harm. Character.AI's own safety center shows it is
              investing in moderation, reporting, and teen protections, but those steps are reactive relative to the
              litigation and do not erase the possibility of further claims or state-level regulation. The practical
              issue for investors is that the company can be forced to trade away the exact engagement patterns that
              made it valuable. That matters because the fastest route to compliance may also be the fastest route to
              lower retention.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR011
      - number: '7.2'
        title: Operational and product risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the app is vulnerable to reliability issues because the same product must support chat,
              voice, feed, and moderation at scale. Public outage reporting shows that users do experience access and
              login problems, and a community product that depends on continuous conversation can lose trust quickly
              when systems fail. The risk is amplified because the company is not just serving text: it is managing age
              checks, content moderation, safety resources, and creator tools at the same time. In other words, small
              failures can become trust events very quickly.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Dependency and financial risk
        blocks:
          - type: paragraph
            body: >-
              The other major risk cluster is dependency. Character.AI is still tied to a narrow consumer model, a
              largely closed technology stack, and a public relationship with Google that matters for both talent and
              model access. That dependency is manageable only if product growth and monetization keep pace with rising
              safety costs and legal risk. The financial threat is not classic insolvency; it is value compression,
              where the company must spend more to stay compliant and trusted while its most profitable engagement
              patterns are constrained. The downside case is therefore a product that survives but monetizes far less
              efficiently than investors hoped.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Value anchors
        blocks:
          - type: paragraph
            body: >-
              Character.AI has three relevant anchors. First, the 2023 Series A set a public unicorn baseline at $1B.
              Second, the 2024 Google transaction paid out early investors at an implied value around $2.5B, which is
              the strongest available mark for the company in its current form. Third, 2025 reporting suggested the
              business was still being discussed at a valuation above $1B, which implies that the market did not rerate
              it down dramatically after the Google deal. The key limitation is that none of these anchors is a true
              market-clearing public price for the operating company in 2026. Any valuation opinion therefore has to
              lean on a blend of transaction marks, revenue context, and the size of the safety discount, not just one
              headline figure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Comparable framing
        blocks:
          - type: paragraph
            body: >-
              The closest public comparables are not classic SaaS names but consumer platforms with heavy engagement and
              monetization optionality. That comparison is helpful, but imperfect: Character.AI has more platform-like
              usage than a normal utility app, yet less underwriting clarity than a listed consumer platform with
              audited revenue. As a result, public multiples can justify a premium only if the company proves that
              safety costs and legal exposure will not overwhelm growth. If those costs rise faster than monetization,
              the multiple should compress. In practice, the valuation conversation is really about how much optionality
              investors want to pay for before the company demonstrates that the product can scale without
              self-inflicted policy drag.
            claimRefs:
              - CV005
