company:
  name: Character.AI
chapter:
  number: 5
  title: Product & Technology
  summary: Character.AI is a consumer chat and character-creation platform whose product stack now mixes role-play chat, feed-style creation tools, voice, and heavy safety/age-assurance controls.
sections:
  - id: product-definition
    title: Product definition and module map
    body: >-
      Character.AI's product is best understood as a consumer entertainment and companionship workflow, not as a generic chatbot. Users
      create characters, prompt them into conversations, share them with others, and increasingly interact through feed-like creation
      surfaces and voice modes. The current product story is broader than the original "chat with a character" concept: the company now
      emphasizes creation, sharing, and safe under-18 experiences alongside the original role-play chat loop. That makes the module map
      more like a content platform than a simple model wrapper.
    claimRefs: [CE001, CE007, CE012]
    tableRefs: [TE001]
  - id: architecture-and-deployment
    title: Architecture and deployment
    body: >-
      The public architecture is intentionally opaque. Company pages make clear that Character.AI owns the end-user experience and the
      safety layers around it, but they do not fully disclose the model stack or orchestration details. External discussions and developer
      commentary suggest a classic multi-layer consumer AI design: frontend product surfaces, a character and memory layer, model
      invocation, and moderation / guardrails. The important operational fact is that deployment now spans web, mobile, voice, and feed
      experiences, which means reliability and moderation matter as much as raw model quality. That broad surface area also means a bug
      or policy miss can affect discovery, chat, voice, and creator workflows at once rather than in one narrow code path.
    claimRefs: [CE003, CE004, CE008, CE011]
    tableRefs: [TE002, TE003]
  - id: trust-and-roadmap
    title: Trust, safety, and roadmap
    body: >-
      Safety is now central to the product rather than an afterthought. The safety center, terms, and public product changes show a
      company that is actively tightening policy around minors, reporting, and age assurance. That raises the bar on compliance and trust,
      but it also shapes the roadmap: more creation tools, more content surfaces, and less open-ended teen chat. The roadmap therefore
      looks like a pivot from unrestricted companionship toward moderated entertainment and creation, with the technical challenge of
      preserving engagement while reducing harmful edge cases. In practical terms, product quality now depends on both model quality and
      the guardrails that keep conversations within policy.
    claimRefs: [CE002, CE006, CE009, CE010]
    figureRefs: [FE001]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns: [module, user, status_or_maturity, differentiation, diligence_gap]
    rows:
      - [Character chat, Consumer, Mature, "Core engagement loop and brand identity", "How durable is engagement after safety restrictions?"]
      - [Character creation, Creator / consumer, Mature, "User-generated supply grows the library", "How much content is moderated versus removed?"]
      - [Group chat, Consumer, Growing, "Social storytelling and multi-party use", "What share of users actually multi-home into group chat?"]
      - [Voice calls, Power users, Growing, "Higher-friction, higher-engagement mode", "How much usage is voice versus text?"]
      - [Feed / community content, Consumer and creator, Growing, "Turns chat into a social platform", "How much monetization comes from feed engagement?"]
      - [AvatarFX / video, Creator / consumer, Early, "Expands beyond text into media", "Is the feature experimental or core?"]
      - [Moderation and safety layer, All users, Critical, "Protects the product's legal and trust posture", "What are the actual failure rates and escalation rules?"]
      - [Age assurance / teen mode, Under-18 users, Critical, "Defines the company's compliance boundary", "How accurate are age checks and appeal flows?"]
    notes: Module matrix emphasizes maturity and diligence gaps rather than pretending the public product surface is static.
    claimRefs: [CE001, CE002, CE006, CE007, CE009, CE012]
  - id: TE002
