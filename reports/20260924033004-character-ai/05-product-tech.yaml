      - [Creative writing, "Brainstorm scenes and dialogue", "Character prompts and story scaffolding", "Faster ideation", "Output quality depends on prompt skill"]
      - [Companionship, "Seek a responsive conversational partner", "Persona-based chat", "Always-on availability", "High trust / safety burden"]
      - [Language practice, "Practice conversation with low pressure", "Voice and text interaction", "Low-friction repetition", "Not a certified tutor"]
      - [Community creation, "Build and share bots with others", "Character publishing and feed tools", "Network effect from user supply", "Moderation overhead rises with scale"]
      - [Teen entertainment, "Use under-18-safe content", "Teen-specific experience and controls", "Compliance and parental reassurance", "Can reduce open-ended chat appeal"]
      - [Discovery / fandom browsing, "Find characters and story worlds", "Large character library", "Huge content surface", "Curation quality varies"]
      - [Power-user access, "Need faster or higher-priority service", "c.ai+ paid tier", "Lower wait times", "Still constrained by core safety rules"]
    notes: Workflow table keeps the focus on user jobs and why the product is sticky or risky in each case.
    claimRefs: [CE001, CE006, CE007, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns: [layer_or_process, role, dependency, risk]
    rows:
      - [Frontend surfaces, "Web, mobile, voice, and feed experiences", "App infrastructure", "Any outage hits the full consumer funnel"]
      - [Character layer, "Persona, memory, and character state", "Prompt and context handling", "Memory failures can break the companion illusion"]
      - [Model invocation, "Generates replies", "Underlying LLM provider / model stack", "Model quality and latency shape engagement"]
      - [Safety / moderation, "Filters and policy enforcement", "Trust-and-safety systems", "Overblocking can reduce retention; underblocking can create legal risk"]
      - [Age assurance, "Minors and parental controls", "Verification and gating tooling", "False positives or negatives create compliance risk"]
      - [Creator / feed tooling, "Sharing and discovery", "Content graph", "Spam and moderation load scale with usage"]
      - [Voice and multimodal features, "Speech and media creation", "Media generation stack", "Costs and quality are harder to control than text"]
      - [Analytics / experimentation, "Measure retention and monetization", "Telemetry and feature flags", "Poor metrics can misroute the roadmap"]
    notes: Architecture table is intentionally operational and risk-oriented because the company does not publish the full technical stack.
    claimRefs: [CE003, CE004, CE005, CE009, CE010, CE011]
