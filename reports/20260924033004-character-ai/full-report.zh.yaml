              - CP003
              - CP007
              - CP011
              - CP012
      - number: '3.3'
        title: 护城河壁垒与替代风险
        blocks:
          - type: paragraph
            body: >-
              Character.AI 的护城河主要来自用户参与，而非纯技术壁垒。UGC
              角色、深度会话和使用习惯都有价值，却不像网络硬件那样难以复制。科技巨头可以降价甚至免费提供助手，同类陪伴应用也能在安全或情感定位上做出差异。2024 年 Google
              交易和创始人离开后，公司继续拥有前沿自研模型优势的说法也更难成立。品牌和用户行为数据仍有防御价值，但战略纵深不及早期“自研底层大模型”的叙事。
