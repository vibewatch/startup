    claimRefs:
      - CO002
      - CO003
      - CO006
      - CO007
      - CO008
      - CO011
  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    summary: 从泛 AI 应用关注度到 Character.AI 的具体商业化变现。
    data:
      items:
        - label: 泛 AI 应用关注度
          detail: 全球超过 10 亿人使用 AI 应用，但绝大部分支出在角色对话之外。
          claimRefs:
            - CM001
        - label: 消费级 AI 对话
          detail: Character.AI 身处拥挤的消费级对话市场，替代品众多。
          claimRefs:
            - CM003
            - CM004
        - label: AI 陪伴与角色扮演
          detail: 最相关的细分市场为角色扮演、情感陪伴及创意叙事。
          claimRefs:
            - CM001
            - CM002
        - label: 活跃用户规模
          detail: 公开估算月活或活跃用户规模集中在 20M 至 45M 之间。
          claimRefs:
            - CM005
            - CM006
        - label: 付费用户规模
          detail: 商业化转化率似乎较低，付费用户仅占个位数比例。
          claimRefs:
            - CM007
            - CM008
        - label: 营业收入
          detail: 公开收入估算仍处于数千万美元的较低水平，远未达到企业级软件规模。
          claimRefs:
            - CM007
            - CM008
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: Character.AI 的定位是在陪伴深度与模型通用性、分发广度之间权衡。
    data:
      points:
        - label: Character.AI
          x: 2
          'y': 5
          rationale: Deep character/role-play engagement but less broad model distribution than big-tech assistants.
          claimRefs:
            - CP005
            - CP009
        - label: ChatGPT
          x: 5
          'y': 2
          rationale: Broad distribution and model breadth, but weaker persona persistence.
          claimRefs:
            - CP003
            - CP010
        - label: Replika
          x: 2
          'y': 4
          rationale: Companion-first positioning with narrower breadth than a general assistant.
          claimRefs:
            - CP001
            - CP002
        - label: Chai
          x: 2
          'y': 4
          rationale: Role-play heavy but smaller scale and thinner context depth.
          claimRefs:
            - CP001
            - CP004
        - label: Poe
          x: 4
          'y': 2
          rationale: Aggregates models and appeals to power users more than companion seekers.
          claimRefs:
            - CP003
            - CP010
        - label: Meta AI
          x: 5
          'y': 1
          rationale: Massive free distribution but little companion-specific identity.
          claimRefs:
            - CP003
            - CP010
    claimRefs:
      - CP005
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: 收入模型拆解
    type: flow
    summary: 免费用户带来高黏性使用，高参与度驱动会员付费转化与广告变现，而 Google 交易改变了资本结构，却未替代经常性收入。
    data:
      nodes:
        - id: free_users
          label: 免费用户
        - id: engagement
          label: 用户时长 / 角色创建量
        - id: premium
          label: c.ai+ 订阅用户
        - id: ads
          label: 信息流广告
        - id: google_deal
          label: Google 许可授权现金
        - id: margin
          label: 现金流 / 利润率
      edges:
        - from: free_users
          to: engagement
          label: 用户使用
        - from: engagement
          to: premium
          label: 付费升级
        - from: engagement
          to: ads
          label: 商业化
        - from: premium
          to: margin
          label: 订阅收入
        - from: ads
          to: margin
          label: 广告收入
        - from: google_deal
          to: margin
          label: 流动性 / 现金跑道
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI009
      - CI010
  - id: FE001
    title: 产品架构全景
    type: stack
    summary: 从公开信息看，这是一款消费级 AI 应用，外围还包括安全、内容和创作者功能层。
    data:
      layers:
        - label: 前端交互层
          detail: Web 端、移动端、语音以及类信息流体验
          claimRefs:
            - CE007
            - CE008
        - label: 角色层
          detail: 角色创建、记忆机制与人设持久化
          claimRefs:
            - CE001
            - CE003
        - label: 模型编排调度
          detail: 公开模型技术栈未完全披露
          claimRefs:
            - CE003
            - CE011
        - label: 安全与审核机制
          detail: 举报机制、关键词过滤、政策执行与年龄门槛
          claimRefs:
            - CE002
            - CE006
            - CE009
        - label: 创作者 / 社区层
          detail: 信息流、内容分享、虚拟形象与内容发现
          claimRefs:
            - CE007
            - CE012
        - label: 数据分析 / 参与度闭环
          detail: 指导产品路线图的用户反馈与留存信号
          claimRefs:
            - CE004
            - CE010
            - CE012
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE008
      - CE009
      - CE011
      - CE012
  - id: FU001
    title: 用户旅程图
    type: journey-map
    summary: 用户先因好奇和角色扮演进入，继而形成高参与度的陪伴使用；如今产品也延伸至内容创作和更安全的青少年体验。
    data:
      items:
        - label: 用户发现
          detail: 用户通过同人圈子、社交分享或应用商店接触产品。
          claimRefs:
            - CU001
            - CU004
        - label: 首次对话
          detail: 用户尝试与角色互动，迅速感知人设黏性与吸引力。
          claimRefs:
            - CU003
            - CU004
        - label: 深度交互
          detail: 单次长时间交互与高频对话让使用养成习惯。
          claimRefs:
            - CU005
            - CU006
        - label: 角色创作
          detail: 部分用户自主创建角色，持续充实社区角色库。
          claimRefs:
            - CU004
            - CU009
        - label: 商业转化
          detail: 重度用户付费升级会员或接触广告内容。
          claimRefs:
            - CU009
            - CU010
        - label: 留存与流失
          detail: 安全限制、年龄核验以及竞品分流可能导致用户流失。
          claimRefs:
            - CU007
            - CU008
            - CU011
            - CU012
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU009
      - CU010
      - CU011
      - CU012
