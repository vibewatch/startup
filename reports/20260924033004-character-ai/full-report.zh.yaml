    title: 客户与客群
    sections:
      - number: '6.1'
        title: 客群细分与产品采纳
        blocks:
          - type: paragraph
            body: >-
              Character.AI
              的用户主要是个人消费者，而非机构。公开资料显示，核心用户包括青少年、年轻人和同人爱好者，他们来此角色扮演、写作、寻求陪伴或消遣。语言学习等低压力对话用途也存在，但只是次要场景。角色库庞大、会话深度高，用户创作内容信息流也在扩大，这些都表明产品已有广泛使用。关键问题不是有没有人在用，而是加上安全限制、年龄核验和变现门槛后，这种使用能否持续。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.2'
        title: 标杆实证与留存表现
        blocks:
          - type: paragraph
            body: >-
              这个面向大众消费者的品类，公开案例多是间接证据或负面事件；记录最详尽的往往是诉讼，而非企业客户背书。这不代表产品没有真实用户，而是公开资料少有传统客户案例，却能看到用户长时间投入高情感浓度对话。公开估算也显示，留存容易受政策变化冲击：针对未成年人的安全整顿前，访问量和
              MAU 曾达到峰值；之后公司不得不牺牲部分参与度来加强安全防护。在这个市场里，有人使用不等于能持续留住用户。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: 业务拓展与客群集中度
        blocks:
          - type: paragraph
            body: >-
              增长机会仍在，但主要来自相邻的消费场景，而不是新开企业业务。广告、创作者工具、语音和视频可拓宽产品；更安全的青少年体验也可能逐步带回部分使用需求。集中度风险仍高：用户偏年轻、地域集中在少数主要国家，收入又依赖极少数付费用户。因此，客群质量和安全问题无法分开看：一旦关键用户群流失，即使产品广受欢迎，商业模式也会迅速承压。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
