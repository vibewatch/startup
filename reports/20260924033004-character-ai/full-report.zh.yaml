              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: 测算视角与买家客群
        blocks:
          - type: paragraph
            body: >-
              公开市场测算更适合作为几种观察视角，而非唯一答案。Business of Apps 和 Axis Intelligence 都估出庞大用户规模，但数字相互矛盾；Sacra
              等机构则显示收入增长可观，变现规模仍有限。另一关键指标是变现密度：月费约
              $9.99，付费转化率偏低；除非转化率或广告负载提高，否则高参与度带来的收入仍有限。使用者通常是普通消费者，真正付费的只是一小部分愿为便利、速度、情绪价值或高级功能买单的人。
