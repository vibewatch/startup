        title: 业务进展与成本结构
        blocks:
          - type: paragraph
            body: >-
              业务已有真实规模，但公开数据仍难以互相印证。第三方估算的年化收入约在 $30M 至 $50M 之间，活跃用户规模约为 20M 至
              45M。这样的规模值得重视，但披露不足以支撑高确信度判断。成本端也不轻松：产品耗算力、会话时间长，安全功能又可能压低变现效率或增加支持成本。因此，规模是优势，但尚无证据证明它能顺利转化为利润。
