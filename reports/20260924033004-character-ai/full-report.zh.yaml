  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Character.AI 面对的不是通用企业 AI 市场，而是消费级 AI
              陪伴与角色聊天：用户创建人设、进行角色扮演，用于娱乐、陪伴、轻度教育或创意写作。官网直接呈现这些用途，第三方综述也将其归入虚拟人格聊天机器人赛道。替代品包括对话型消费
              AI、争夺用户时间的社交平台、游戏和角色扮演体验，以及现实中的社交陪伴与创作者社群。明确这条边界，才能把分析聚焦在参与度和留存，而非企业生产力预算。
