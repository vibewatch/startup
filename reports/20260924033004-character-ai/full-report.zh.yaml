  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争态势
        blocks:
          - type: paragraph
            body: >-
              Character.AI 的直接对手是其他消费级 AI 陪伴和角色扮演产品，而不是企业 Copilot。Business of Apps
              和公司公开资料都将其描述为拥有数千万用户和庞大角色库的虚拟人格聊天机器人，因此 Replika、Chai 等陪伴产品与它同台竞争。ChatGPT、Poe、Meta AI
              等通用聊天平台虽非专为角色扮演设计，也会争夺同一批用户时间。游戏和同人社群同样能满足娱乐与身份认同需求，而且不需要专门订阅聊天机器人。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
      - number: '3.2'
        title: 功能矩阵与产品形态
        blocks:
          - type: paragraph
            body: >-
              用户主要比较角色扮演深度、记忆延续、安全、多模态能力和价格。Character.AI 胜在互动深入、UGC
              角色库庞大；但让用户沉浸其中的情感亲密感，也带来了诉讼和政策调整所揭示的内容审核与青少年安全问题。通用聊天助手恰好相反：模型能力和分发更广，却较难维持角色身份认同，也少有社群驱动的角色生态。价格也影响竞争：Character.AI
              采用温和溢价的免费增值模式，其他产品则可凭免费分发、广告捆绑或平台整体变现竞争。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
