    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与产品
        blocks:
          - type: paragraph
            body: >-
              Character.AI 是 Character Technologies, Inc. 运营的私有消费级 AI
              聊天平台，用户可以创建、分享并与角色型虚拟人物对话。当前产品兼有角色扮演、陪伴和创意叙事功能；官网称其 AI 对话产品围绕用户自己的表达与世界观重新打造。公司称总部位于 Silicon Valley，并在
              Seattle 和 New York 设有办公室；第三方资料则将其法律实体列在加州 Menlo Park。品牌辨识度很高，但外界仍容易混淆其法律实体与实际运营布局。
