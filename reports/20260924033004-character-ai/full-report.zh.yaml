      - number: '1.3'
        title: 业务规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              公开规模数据互相矛盾，这本身就是尽调发现。公司及支持者给出的月活规模从约 20M 到 45M 不等，年化收入估算则从 $30 百万美元的低位到约
              $50M。数据分歧说明业务已有真实规模，但披露并不透明。重要节点包括：2022 年开放公测、2023 年完成 $150M A 轮、2024 年与 Google 达成交易、2025 年 Karandeep
              Anand 接任 CEO，以及 2025 年末开始并持续到 2026 年的未成年人产品限制。公司已是规模可观的消费产品，变现也有实质进展；但安全调整后还能留住多少用户，仍是悬而未决的关键问题。
