companyProfile:
  summary: >-
    Character.AI 是一家总部位于 Menlo Park 的消费级 AI 陪伴平台，由前 Google Brain 研究员 Noam Shazeer 与 Daniel De Freitas 于 2021 年 1
    月创立。用户可创建 AI 角色并与之对话，用于娱乐、角色扮演、教育和情感陪伴。截至 2025 年 9 月，平台月活约 45M、累计下载量超过 75M，估算 ARR 为 $50M。2024 年 8 月，Google 以约 $2.7B
    获得创始团队的 LLM 技术许可；Shazeer、De Freitas 和约 30 名工程师随后回到 Google。交易改善了 Character.AI
    的现金状况，也加深了其对外部模型基础设施的依赖。公司目前面临严峻的青少年安全诉讼与监管审查。
  foundedDate: '2021-01-01'
  founders:
    - name: Noam Shazeer
      role: 联合创始人（2024 年 8 月重返 Google）
      background: Google Brain 资深研究员；Transformer 论文合著者；在随 Google 许可交易离职前，主导设计 Character.AI 早期 LLM 架构。
      claimRefs:
        - CO002
    - name: Daniel De Freitas
      role: 联合创始人（2024 年 8 月重返 Google）
      background: Google Brain 研究员；在随 Google 许可交易离职前，曾与 Shazeer 共同打造 Character.AI 早期产品。
      claimRefs:
        - CO002
    - name: Karandeep Anand
      role: CEO（2025 年 6 月上任）
      background: 曾任 Microsoft Teams 与 Meta 高管；在 Google 交易完成后受聘领导公司。
      claimRefs:
        - CO003
  foundingLocation: Menlo Park, CA
  headquarters: Menlo Park, CA
  productSummary: >-
    Character.AI 面向消费者提供 AI 陪伴服务，用户可创建虚构角色、名人形象和自定义助理并与之互动。产品支持多轮、贴合角色设定的对话和用户自主创建角色；付费订阅 Character.AI+
    提供更快响应与优先访问。Google 许可交易后，产品不再沿用创始团队自研专有模型的路线，转而更多依赖外部模型基础设施。
  customerFocus: 用户以消费者为主，尤其是青少年和年轻人；主要用于娱乐、角色扮演、情感陪伴和创意写作。
  businessModel: 免费增值的消费级订阅模式：多数用户使用免费版，少数用户以 $9.99/月 订阅 Character.AI+。目前没有公开披露企业级、开发者 API 或大规模 B2B 收入。
  stage: late-stage private
  fundingStatus: >-
    2023 年 3 月完成 A 轮融资，由 a16z 和 Spark Capital 领投，融资 $150M、估值 $1B。2024 年 8 月 Google 许可交易的总对价约为
    $2.7B，令公司现金储备大幅增加；此后未披露新的股权融资。
