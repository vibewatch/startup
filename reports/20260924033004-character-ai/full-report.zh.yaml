        title: 商业模式与定价策略
        blocks:
          - type: paragraph
            body: >-
              Character.AI 的收入仍主要来自 C 端订阅。公司和 Sacra 都将 c.ai+ 视为核心变现渠道，月费
              $9.99，提供更快回复和优先访问。公司近期也开始在信息流测试广告；单靠订阅无法变现庞大的免费用户群，因此这一步很重要。公开资料尚未显示有规模化的企业、API
              或技术许可收入，整体仍像免费增值消费应用，而不是拥有多条机构销售渠道的软件平台。
