      - number: '1.2'
        title: 领导团队与资本结构
        blocks:
          - type: paragraph
            body: >-
              Noam Shazeer 与 Daniel de Freitas 于 2021 年 11 月创立 Character.AI。两人曾任 Google 研究员，参与过 Transformer 和 LaMDA
              项目。Andreessen Horowitz 领投 2023 年 3 月的 A 轮，是目前公开资料中最重要的风投方。2024 年 8 月，Google 以约 $2.7B
              获得非独家技术许可，并重新聘回两位创始人及大部分研究团队。交易没有转移股权控制权，Character.AI 仍是独立法人，但技术重心已不再由原创始团队主导。Karandeep Anand 于 2025 年 6
              月出任 CEO，管理层因此更偏产品运营，而非模型研发。
