  - id: FV001
    title: 估值驱动传导链
    type: flow
    summary: 估值从交易锚点出发，再结合收入规模和安全约束，落到对股权价值的判断。
    data:
      nodes:
        - id: anchor
          label: Google 交易
          detail: 隐含约 2.5B 的估值是目前最可用的估值基准
          group: valuation
        - id: revenue
          label: 收入基本盘
          detail: 约 $50M ARR 足以支撑增长叙事，但单凭该项不足以享有估值溢价
          group: financial
        - id: safety
          label: 安全与诉讼风险
          detail: 青少年安全监管约束与未决诉讼压低整体估值
          group: risk
        - id: comp
          label: 可比公司参照框架
          detail: 上市可比公司表明只有商业变现效率提升才能支撑溢价
          group: market
        - id: base
          label: 基准估值
          detail: 若增长延续且风险可控，估值落在 $2B 中段区间
          group: scenario
        - id: bull
          label: 乐观估值
          detail: 估值上行空间取决于付费用户规模扩张与开辟新变现路径
          group: scenario
      edges:
        - from: anchor
          to: base
          label: 构筑估值底线
        - from: revenue
          to: base
          label: 形成支撑
        - from: safety
          to: base
          label: 带来折价
        - from: comp
          to: bull
          label: 界定上行空间
        - from: revenue
          to: bull
          label: 亟需业务扩张
        - from: safety
          to: bull
          label: 须回归常态
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV010
      - CV011
      - CV012
