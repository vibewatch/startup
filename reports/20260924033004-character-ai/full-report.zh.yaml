      - number: '2.3'
        title: 增长驱动力与制约因素
        blocks:
          - type: paragraph
            body: >-
              新鲜感、深度会话、角色扮演和免费入门的低门槛推动了产品普及，但也埋下结构性约束。青少年安全诉讼、对未满 18
              岁用户的功能限制和平台规则变化，可能冲击产品过去最强的用户群。变现同样受限：订阅转化率只有几个百分点，多数用户尚未变现；而更激进的商业化又可能损害核心体验。这个市场足以支撑一家规模可观的公司，却还不足以让人乐观假设留存、定价权或监管环境。
