    title: Market definition table
    columns: [segment, included_spend, excluded_spend, buyer/payer, relevance]
    rows:
      - [Consumer AI companions, "Chat subscriptions, upsells, ad-supported engagement", "Enterprise copilots, dev tools, model APIs", "Consumer / consumer", "Core market for Character.AI"]
      - [Role-play and character chat, "Entertainment time, fandom interactions, creative writing", "General search, productivity apps", "Consumer / consumer", "Closest product-market fit"]
      - [Social AI feeds and short-form AI content, "Feed monetization, creator tools, AI video", "Traditional social ad spend without AI layer", "Consumer / advertiser", "Adjacent monetization expansion"]
      - [Education and tutoring companions, "Study help, language practice, coaching", "Formal LMS spend, curriculum software", "Consumer / parent or school", "Adjacency with limited fit"]
      - [Mental-health or companionship apps, "Premium emotional support, journaling, coaching", "Licensed clinical care", "Consumer / consumer or payer", "Competes for attention and trust"]
      - [Gaming and interactive fiction, "Role-play, NPC companionship, community content", "Console and premium game licenses", "Consumer / consumer", "Major attention substitute"]
      - [Human companionship and creator communities, "Time, tips, memberships, fan spending", "Software subscriptions", "Consumer / consumer", "Status-quo substitute"]
      - [Enterprise AI, "Productivity seats, API fees, workflow automation", "Consumer entertainment spend", "Business / business", "Excluded from this chapter boundary"]
    notes: Boundary table uses spend categories rather than market-revenue precision because the category is still emerging and overlapping.
    claimRefs: [CM001, CM002, CM003, CM009]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns: [lens, source, value, methodology, confidence, limitation]
    rows:
      - [MAU estimate, "Business of Apps", "45M active users", "Reported public estimate", medium, "User count is not audited and conflicts with other sources"]
      - [MAU estimate, "Axis Intelligence", "20M monthly active users", "Composite estimate from app/web signals", medium, "Methodology is proprietary"]
      - [Revenue run-rate, "Sacra", "$30M annualized in July 2025", "Private-market estimate", medium, "Not an audited financial statement"]
      - [Revenue forecast, "Business of Apps", "$50M in 2025", "Third-party estimate", medium, "Different from Sacra and other estimates"]
      - [Visits, "DemandSage / Similarweb", "165.8M monthly visits Jul 2026", "Web traffic proxy", low, "Visits are not users or paying accounts"]
      - [Premium conversion, "Axis Intelligence", "~2%", "Implied by revenue per MAU", low, "Derived metric, not company-disclosed"]
      - [Subscription price, "Official / Sacra", "$9.99 monthly", "List price", high, "List price is not realized revenue"]
      - [Character library scale, "Business of Apps / Wikipedia", "18M+ characters", "Community asset count", medium, "Characters are not equivalent to active customers"]
    notes: Sizing lens table intentionally preserves contradictory third-party estimates rather than forcing a single point value.
    claimRefs: [CM005, CM006, CM007, CM008]
  - id: TM003
    title: Segment / buyer map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [Teens and young adults, Consumer, Consumer, Consumer, "Role-play and companionship", "Consumer wallet", "Novelty and social identity"]
      - [Creative writers and fandom users, Consumer, Consumer, Consumer, "Story prompting and character creation", "Consumer wallet", "Creative block or fandom engagement"]
      - [Language learners, Consumer, Consumer, Consumer, "Practice conversation and feedback", "Consumer or parent", "Need for low-pressure practice"]
      - [Casual entertainment users, Consumer, Consumer, Consumer, "Time-filling conversation", "Consumer wallet", "Boredom and virality"]
      - [Parents and guardians, Decision maker, Child/teen user, Parent, "Safety and supervision", "Household budget", "Concern over minor safety"]
      - [Advertisers, Brand buyer, Consumer audience, Advertiser, "Sponsored feed reach", "Marketing budget", "High engagement and younger demographic"]
      - [Power users, Consumer, Consumer, Consumer, "Priority access and faster replies", "Consumer wallet", "Need for speed and capacity"]
      - [Partners / creators, Creator, Audience, Creator or platform share, "Character publishing and distribution", "Creator budget", "Audience growth and discovery"]
    notes: The buyer map is consumer-first because monetization is mostly direct-to-consumer, with advertisers and creators as secondary economic actors.
    claimRefs: [CM001, CM004, CM005, CM007]
