      - [ChatGPT, "Freemium + paid tiers", "Broad chat and productivity", "Plan mix changes frequently", "Distribution and bundling can offset price pressure"]
      - [Replika, "Subscription", "Companion chat and relationship features", "Current list pricing not in this pool", "Positioning is closer to emotional utility"]
      - [Chai, "Token-based / lower-cost", "Role-play chat", "Current token price not in this pool", "Lower price can attract price-sensitive users"]
      - [Poe, "Subscription / platform bundle", "Multiple models in one place", "Exact enterprise-style packaging not in this pool", "Appeals to power users over companions"]
      - [Meta AI, "Free consumer access", "Assistant embedded in social products", "Future monetization uncertain", "Zero-price pressure is a real threat"]
      - [Gaming / IP platforms, "Game purchase or in-app spend", "Character engagement inside games", "Varies by title", "Competition is indirect but sticky"]
      - [Status quo, "No explicit price", "Human communities and entertainment", "N/A", "The biggest substitute is still free"]
    notes: Many competitor pricing cells are intentionally unknown because the assigned source bundle does not include current pricing pages for all rivals.
    claimRefs: [CP002, CP003, CP007, CP011, CP012]
