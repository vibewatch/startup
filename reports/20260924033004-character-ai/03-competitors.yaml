      - [Creator / community tooling, "High", "Low", "Low", "Low/Medium", "Medium", "Low"]
    notes: Unsupported cells are intentionally qualitative, not hidden; this matrix is a competitive comparison, not a product spec sheet.
    claimRefs: [CP005, CP006, CP007, CP008]
