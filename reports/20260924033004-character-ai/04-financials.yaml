      - [Enterprise / API, "Not publicly disclosed", "Unknown", "No major public product evidence", "Upside is optional, not yet proven"]
      - [Safety/age controls, "Not a monetization lever", "Cost center", "Can lower teen engagement", "May protect the company but cap revenue"]
    notes: Pricing table intentionally distinguishes list price from actual revenue capture and treats the Google transaction as non-operating.
    claimRefs: [CI001, CI003, CI004, CI009]
  - id: TI003
    title: Unit economics table
    columns: [metric, value_or_status, confidence, why_it_matters, diligence_ask]
    rows:
      - [Revenue per MAU, "$1-$3-ish implied", low, "Shows how weak current monetization is relative to traffic", "Provide a management-calculated revenue-per-user series"]
      - [Premium conversion, "~2% implied", low, "Conversion is the main monetization bottleneck", "Share subscriber count and cohort retention"]
      - [Gross margin, "Unknown", low, "Compute-heavy products live or die on margin", "Provide gross margin by product line"]
      - [Headcount, "225 est.", medium, "Shows current operating scale and cost base", "Confirm employee count and contractor mix"]
      - [Runway, "Unknown", low, "Determines ability to fund the current product strategy", "Provide cash, burn, and runway assumptions"]
      - [Capex / inference cost, "High and usage-linked", medium, "Model serving cost scales with engagement", "Quantify inference cost per session"]
      - [NRR / retention, "Unknown", low, "Retention determines whether the app can monetize the same user repeatedly", "Provide subscriber retention and churn"]
      - [Revenue growth, "$30M to $50M est. in 2024-2025", medium, "Growth exists, but base is still small", "Disclose the source and methodology"]
    notes: Unit economics remain estimate-heavy because the company does not publish audited margins or subscriber retention.
    claimRefs: [CI005, CI006, CI007, CI008, CI010]
