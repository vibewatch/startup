company:
  name: Character.AI
chapter:
  number: 7
  title: Risks
  summary: Character.AI's biggest risks are legal/regulatory exposure around teen safety, operational reliability, and dependency on a narrow set of product and platform choices.
sections:
  - id: legal-regulatory
    title: Legal and regulatory risk
    body: >-
      Legal and regulatory risk is the center of the case, not a side note. The public record now includes teen-safety lawsuits, a
      material under-18 product reset, and a broader policy environment that is increasingly focused on age assurance and chatbot harm.
      Character.AI's own safety center shows it is investing in moderation, reporting, and teen protections, but those steps are
      reactive relative to the litigation and do not erase the possibility of further claims or state-level regulation. The practical
      issue for investors is that the company can be forced to trade away the exact engagement patterns that made it valuable. That
      matters because the fastest route to compliance may also be the fastest route to lower retention.
    claimRefs: [CR001, CR002, CR003, CR004]
    figureRefs: [FR001]
    tableRefs: [TR001]
  - id: operational
    title: Operational and product risk
    body: >-
      Operationally, the app is vulnerable to reliability issues because the same product must support chat, voice, feed, and moderation
      at scale. Public outage reporting shows that users do experience access and login problems, and a community product that depends on
      continuous conversation can lose trust quickly when systems fail. The risk is amplified because the company is not just serving text:
      it is managing age checks, content moderation, safety resources, and creator tools at the same time. In other words, small failures
      can become trust events very quickly.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependency-and-financial
    title: Dependency and financial risk
    body: >-
      The other major risk cluster is dependency. Character.AI is still tied to a narrow consumer model, a largely closed technology stack,
      and a public relationship with Google that matters for both talent and model access. That dependency is manageable only if product
      growth and monetization keep pace with rising safety costs and legal risk. The financial threat is not classic insolvency; it is
      value compression, where the company must spend more to stay compliant and trusted while its most profitable engagement patterns are
      constrained. The downside case is therefore a product that survives but monetizes far less efficiently than investors hoped.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
