artifact: competitors
slug: datavant
runDate: 2026-10-22
company:
  name: Datavant
chapter:
  number: 3
  title: Competitors
  summary: Datavant competes as a privacy-preserving health-data connectivity and logistics layer rather than as a single clinical application. Its broad network, tokenization, retrieval, and compliance positioning create differentiation, but public evidence does not establish realized pricing, comparative accuracy, switching costs, or production performance against named alternatives.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is a job-to-be-done landscape, not a list of
      products with identical scope. Datavant's documented offer spans record
      retrieval and exchange, tokenization, patient-level linkage, privacy
      services, and real-world data connectivity. That places it alongside
      health-information exchange and interoperability infrastructure, specialist
      identity-resolution or tokenization vendors, real-world-data marketplaces,
      and outsourced release-of-information and abstraction providers. Buyers
      can also use an incumbent EHR or data-exchange stack, contract directly
      with data partners, build internal matching and governance workflows, or
      run a manual status quo. The independent dossier cautions that a
      capability label does not establish package depth, configuration,
      implementation effort, or legal fitness, so category overlap should not
      be treated as product equivalence.
    claimRefs: [CP001, CP002, CP003]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-comparison
    title: Capability, distribution, and trust comparison
    body: >-
      Datavant's strongest disclosed comparison points are ecosystem breadth,
      privacy-preserving linkage, and the combination of software with
      value-added data operations. A partner announcement describes Datavant
      Connect as supporting tokenization, data-partner discovery, and
      individual-level dataset connection while preserving patient privacy; the
      same announcement reports Datavant's statement that it had tokenized more than 100
      clinical trials. Datavant's own materials describe a network spanning
      providers, payers, life sciences, government, and other stakeholders, and
      identify controls for privacy, consent, de-identification, and expert
      governance. These are positioning and partnership claims, not independent
      benchmark results. For alternatives, public evidence in the assigned
      pool is insufficient to populate feature-by-feature cells, pricing, match
      accuracy, uptime, or implementation effort without guessing.
    claimRefs: [CP004, CP005, CP006, CP007]
    tableRefs: [TP002]
  - id: durability-and-switching
    title: Switching costs, lock-in, and moat durability
    body: >-
      Potential durability comes from the accumulated network of data partners,
      provider access, tokenization relationships, compliance workflows, and
      domain operations needed to connect records across organizations. The
      partner evidence reports access to more than 70,000 hospitals and clinics,
      70 percent of the 100 largest health systems, and 500-plus real-world data
      partners in the 2024 release; current official materials present different
      scale figures, including 80,000-plus hospitals and clinics, 350-plus
      real-world data partners, and one trillion records tokenized annually.
      The difference demonstrates that network metrics are time- and
      definition-sensitive, not a verified growth series. Customers may still
      multi-home across data exchanges, retain their own data and matching
      processes, or substitute direct integrations and services. The assigned
      evidence does not quantify churn, contract duration, migration cost,
      exclusive access, or competitor win rates.
    claimRefs: [CP008, CP009, CP010, CP011]
  - id: pricing-and-open-diligence
    title: Pricing, displacement risk, and diligence priorities
    body: >-
      Public pricing is not established in this pool. A software directory
      explicitly directs prospective buyers to the official website for current
      pricing and plans, while the independent dossier says package, depth,
      configuration, and production behavior require verification. The likely
      buying trade-off is therefore between a broad, managed connectivity and
      data-operations footprint and more modular point solutions or internal
      build. Datavant's own interoperability guide acknowledges that healthcare
      interoperability remains difficult and that standards compete, which
      supports a continuing need for integration expertise but also leaves room
      for incumbents, standards-based platforms, and lower-cost automation to
      narrow the gap. Underwriting should test realized price by workflow,
      services intensity, implementation duration, customer concentration,
      multi-homing, and the portability of tokens and linked datasets.
    claimRefs: [CP012, CP013, CP014]
    tableRefs: [TP003]

tables:
  - id: TP001
    title: Competitor and substitute landscape
    columns: [Competitor category, Buyer job, Typical alternative, Evidence status, Limitation]
    rows:
      - ["Privacy-preserving connectivity platform", "Link and govern patient-level data across organizations", "Datavant Connect or comparable connectivity layer", "Datavant capability is documented; named peer comparison is not established", "Package scope, accuracy, and legal basis require verification"]
      - ["Interoperability and health-information exchange infrastructure", "Exchange records between healthcare systems", "EHR-native exchange, HIE, or standards-based integration", "Datavant's interoperability material describes the problem and use cases", "No comparative product, price, or performance evidence in pool"]
      - ["Real-world-data network or marketplace", "Find and connect fit-for-purpose RWD partners", "Direct data-provider contracting or RWD marketplace", "Datavant and partner materials describe a partner ecosystem", "Partner counts and definitions vary; exclusivity is unknown"]
      - ["Release-of-information and abstraction services", "Retrieve, digitize, and abstract clinical records", "Incumbent ROI vendor, internal operations, or manual process", "Independent directory describes retrieval and abstraction use cases", "Service levels, labor mix, and realized economics are unknown"]
      - ["Internal build and status quo", "Match, govern, and exchange data using existing systems", "Customer-owned integrations, data lake, and manual review", "The interoperability guide documents fragmented systems and manual inefficiency", "Build cost, time, and operational risk are customer-specific"]
    notes: "Categories are buyer-job alternatives, not claims that the named alternatives are interchangeable products. Direct peer names, pricing, and comparative outcomes were not supported by the assigned successful fetches."
    claimRefs: [CP001, CP002, CP003, CP013]
  - id: TP002
    title: Capability and trust comparison
    columns: [Buying criterion, Datavant evidence, Alternative or incumbent baseline, Confidence, Unknown that changes the decision]
    rows:
      - ["Patient-level linkage and tokenization", "Partner release describes encrypted, irreversible, site-specific tokens and individual-level linkage", "Other matching or tokenization approaches not documented in assigned pool", medium, "Match precision/recall, false-match handling, and portability"]
      - ["Data-partner discovery and network access", "Partner release reports 500+ real-world data partners; current official page reports 350+", "Direct contracting or another marketplace may provide narrower access", medium, "Current count definition, overlap, availability, and exclusivity"]
      - ["Privacy and regulatory posture", "Official materials describe privacy, consent, de-identification, security, and expert-governed deployment", "Incumbent EHR/HIE and internal builds also require applicable controls", medium, "Independent audit outcomes, liability allocation, and permitted-use boundaries"]
      - ["Retrieval and operational services", "Independent directory lists record retrieval, digitization, abstraction, and ROI services", "Internal operations or specialist ROI providers", medium, "Turnaround, quality, labor intensity, and unit economics"]
      - ["Clinical-trial and RWD connectivity", "Premier release says the collaboration had tokenized over 100 clinical trials", "Direct trial/RWD integration or separate data partners", medium, "Repeatability, customer outcomes, and comparative time/cost savings"]
    notes: "Medium confidence reflects source quality and issuer limitations. Cells describe evidence status rather than verified feature parity; no unsupported peer capability is asserted."
    claimRefs: [CP004, CP005, CP006, CP007]
  - id: TP003
    title: Pricing, switching, and moat diligence
    columns: [Dimension, What the evidence supports, Current conclusion, Diligence implication]
    rows:
      - [List pricing, "Software directory says to visit the official website for current pricing and plans", "Public price is not established", "Obtain a representative quote by workflow and separate license, data, and services fees"]
      - [Network scale, "Sources report 350+, 500+, 70,000+, and 80,000+ figures under different dates or definitions", "Scale appears material but is not a clean comparable series", "Reconcile active versus reachable sites, data partners, and annual movement definitions"]
      - [Switching cost, "Linkage, privacy, partner, and operational workflows could create integration and governance dependencies", "Potentially meaningful but unquantified", "Test migration, token portability, contract terms, and multi-homing"]
      - [Distribution power, "Official materials position access across providers, payers, life sciences, government, and analytics users", "Broad channel surface is company-claimed", "Validate customer acquisition, renewal, and partner-sourced volume by segment"]
      - [Commoditization and displacement, "Interoperability standards and competing systems remain complex; official guide says the field is still far from its goal", "Need likely persists, but incumbents and automation can pressure pricing", "Track standards adoption, customer internal-build rates, and alternative platform win/loss"]
    notes: "The table preserves unknowns rather than converting positioning into realized pricing, retention, or moat measurements."
    claimRefs: [CP008, CP009, CP010, CP011, CP012, CP013, CP014]

figures:
  - id: FP001
    title: Evidence-backed competitive positioning map
    type: quadrant
    summary: Datavant's proposed position is broad connectivity and high governance intensity, while alternatives occupy narrower or more customer-controlled positions; coordinates are analyst judgments from the cited evidence, not market-share measurements.
    data:
      xAxis: "Breadth of data connectivity"
      yAxis: "Governance and managed-operations intensity"
      points:
        - {label: "Datavant platform", x: 4, y: 4, note: "Official materials describe broad network access, connectivity, privacy controls, and value-added services", claimRefs: [CP004, CP006, CP009]}
        - {label: "EHR-native exchange", x: 2, y: 2, note: "Interoperability guide describes exchange among healthcare systems; comparative managed scope is unknown", claimRefs: [CP013]}
        - {label: "RWD marketplace", x: 3, y: 2, note: "Competes for data-partner discovery, but assigned evidence does not establish governance depth", claimRefs: [CP005, CP008]}
        - {label: "Specialist ROI vendor", x: 1, y: 3, note: "Independent directory describes retrieval and abstraction services, with narrower connectivity evidence", claimRefs: [CP002]}
        - {label: "Internal build", x: 2, y: 1, note: "Customer-controlled integration and governance path; cost and capability are customer-specific", claimRefs: [CP003, CP013]}
        - {label: "Direct data-provider network", x: 3, y: 1, note: "Can provide access without a broad intermediary, but reach and compliance operations are unverified", claimRefs: [CP003, CP008]}

callouts:
  - calloutType: strength
    title: Network plus trust is the central differentiation hypothesis
    body: >-
      Datavant combines network access, tokenization, privacy controls, and
      data-operations services in a way that could be difficult to replicate
      quickly. The hypothesis remains dependent on current active coverage,
      customer outcomes, and the portability of linked data.
    claimRefs: [CP004, CP006, CP009]
  - calloutType: risk
    title: Public competitive proof is thin
    body: >-
      Assigned sources do not establish current realized pricing, peer
      performance, switching cost, retention, or independent outcome evidence.
      A broad capability catalogue should not be treated as a durable moat.
    claimRefs: [CP003, CP012, CP014]
  - calloutType: recommendation
    title: Underwrite workflow economics, not ecosystem slogans
    body: >-
      Request a workflow-level quote and implementation plan, then test data
      coverage, match quality, exception handling, portability, multi-homing,
      renewal, and services intensity against the customer's alternatives.
    claimRefs: [CP012, CP014]

