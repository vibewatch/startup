company:
  name: Datavant
chapter:
  number: 5
  title: Product & Technology
  summary: Datavant presents a privacy-preserving health-data connectivity platform built around tokenization, dataset discovery, patient-level linkage, and controlled delivery. Public evidence supports a broad operating model and several real deployments, but production reliability, independent performance testing, and the boundary between software and services remain insufficiently disclosed.
sections:
  - id: product-workflow
    title: Product workflow and customer job
    body: Datavant's product is best understood as infrastructure for moving and combining health data rather than as a single clinical application. The documented workflow starts with tokenizing data, then assessing metadata and overlap, connecting records at the patient level, applying privacy or expert-determination processes, and distributing data to authorized recipients. The AWS datasheet describes on-premise or cloud tokenization, comparison of dataset overlap without exchanging data, patient-level matching, and delivery of custom segments. This maps to a customer job of making fragmented data usable across a research, care, payer, or life-sciences workflow while retaining control over access. The public material is strongest on workflow stages and intended use; it does not establish service-level objectives, implementation times, or realized customer economics.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: Architecture, deployment, and integration surface
    body: The available technical description indicates a distributed connectivity architecture with site-specific irreversible tokens, matching and referential data, partner discovery, project and workflow management, and controlled permissions. Datavant Connect is described as deployable through a command-line interface, desktop UI, or a customer's cloud environment, while the AWS material describes native tokenization on AWS, de-identified datasets in Amazon S3, and a workflow using AWS Clean Rooms. These are concrete deployment and integration surfaces rather than proof of a single standardized stack. A separate partner account describes integration of Datavant technology into Thermo Fisher's PPD business, CorEvitas registries, and Evidera solutions. The evidence supports interoperability as a product design goal, but leaves open the exact APIs, supported cloud configurations, data residency model, observability, and customer-controlled rollback procedures.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-operating-model
    title: Maturity, use cases, and delivery model
    body: Public evidence spans mature connectivity use cases and newer AI-enabled workflow claims. The Premier release says the parties had worked together since September 2022, that Datavant had tokenized more than 100 clinical trials by February 2024, and that linked trial and real-world data were being used for patient journeys, real-world control arms, candidate identification, and site identification. The 2026 Datavant AI article describes a more developmental agentic platform operating across Datavant Connect and Aetion Evidence, with stepwise deployment, retrieval-augmented contexts, scientific evaluations, and human review points. A current job posting also describes pre-sales solutioning across commercial analytics, market access, patient services, and evidence use cases. Together these sources suggest a platform-plus-services operating model with broad use-case reach, but do not independently verify adoption, production scale, or repeatability across customers.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-and-diligence
    title: Trust, safety, and implementation risks
    body: "Datavant's public surface emphasizes privacy, security, compliance, and governed use: the company describes privacy and security by design, threat modeling, and phish-resistant MFA, while its AI article describes human-supervised workflows, scientific evaluations, auditability, and production thresholds. Partner and company materials also describe HIPAA-oriented de-identification and controlled access. These statements establish the intended control framework, not independent certification scope, breach resilience, false-match rates in production, or the legal sufficiency of every use case. A historical partner release provides concrete implementation examples but is company/partner-issued, and the technical marketplace datasheet is also not an independent benchmark. Diligence should therefore test controls and outcomes directly, including independent SOC 2 or regulatory artifacts, token rotation and reversibility controls, match-quality by cohort, incident history, change management, and the labor required to configure and review workflows."
    claimRefs: [CE013, CE014, CE015, CE016]
    callouts:
      - calloutType: risk
        title: Evidence gap is operational, not conceptual
        body: The architecture and use cases are described with reasonable specificity, but public evidence does not disclose independent production reliability, security testing results, or standardized implementation effort. Those omissions matter because the platform handles sensitive data and appears to combine software with expert and delivery services.
        claimRefs: [CE014, CE015, CE016]
