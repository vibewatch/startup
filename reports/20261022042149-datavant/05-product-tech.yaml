    claimRefs: [CE001, CE005, CE006, CE013, CE014, CE015]
callouts:
  - calloutType: strength
    title: Specific connectivity primitives
    body: Tokenization, overlap assessment, patient-level matching, controlled permissions, and delivery are described as concrete product primitives rather than only as a broad data-network claim.
    claimRefs: [CE001, CE002, CE003, CE005]
  - calloutType: assumption
    title: Scale claims need customer-level validation
    body: Partner and company materials cite large networks and broad pharmaceutical participation, but those figures do not by themselves establish active usage, retention, reliability, or software-only revenue quality.
    claimRefs: [CE007, CE012]
