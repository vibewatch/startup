      - [Enrich a clinical trial, "Trial data and RWD remain separated", "Tokenize and link trial data with real-world data", "Premier describes medication-history and post-trial follow-up use cases", "Partner-issued historical example; outcome and implementation cost are not independently measured"]
      - [Build a real-world control arm, "Construct a separate control arm or placebo group", "Connect patient-level standard-of-care RWD while preserving privacy", "Premier says the approach can reduce trial duration and cost", "The release describes intended benefits, not a controlled causal estimate"]
      - [Accelerate evidence generation, "Manually coordinate data discovery, privacy review, cohort work, and analysis", "Agentic workflows across Connect and Aetion Evidence with human review", "Datavant describes data exploration, privacy assessment, measure creation, and cohort generation as phased use cases", "2026 company article is roadmap/operating-model evidence, not independent production validation"]
      - [Support enterprise commercial analytics, "Join internal and external claims, EHR, lab, specialty, and first-party data", "Privacy-preserving linkage and solution engineering across commercial use cases", "The assigned job posting lists patient journey, adherence, market access, and omnichannel use cases", "Job posting shows intended scope and hiring need, not customer adoption"]
    notes: "Benefits are kept qualified because case studies, releases, and job materials describe intended or reported use rather than independently audited outcomes."
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Data intake and tokenization, "Create interoperable site-specific tokens from permitted identifiers", "PII access, tokenization deployment, and source data quality", "Confirm key custody, token lifecycle, and behavior when identifiers change"]
      - [Discovery and metadata, "Find potential partners and inspect metadata or overlap", "Partner catalog, metadata quality, and comparable dataset definitions", "Determine freshness, completeness, and incentives behind catalog descriptions"]
      - [Linkage and matching, "Match records across datasets and surface high-quality links", "Tokens, referential data, machine-learning models, and population context", "Measure false positives, false negatives, subgroup performance, and drift"]
      - [Privacy and compliance, "Assess disclosure risk and support HIPAA-oriented de-identification", "Expert reviewers, policy rules, and regulatory interpretation", "Validate scope of attestations, reviewer independence, and re-identification testing"]
      - [Workflow and access controls, "Organize projects, requests, permissions, and delivery", "Customer identity, permissions, auditability, and integrations", "Test least privilege, revocation, audit retention, and operational support"]
      - [Evidence and AI workflows, "Explore data, define measures, generate cohorts, and analyze evidence under review", "Connect and Aetion tools, RAG context, scientific evaluations, and human decision points", "Establish production thresholds, reproducibility, model change controls, and accountability"]
    notes: "Architecture is an analytical synthesis of disclosed workflow components; it is not a claim that every customer receives every layer or that the layers form one documented reference implementation."
    claimRefs: [CE005, CE006, CE007, CE008, CE013, CE014]
