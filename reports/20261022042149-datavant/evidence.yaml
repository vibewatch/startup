evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: disclosure
    missingEvidence: >-
      Current product-line revenue, ARR, growth, gross margin, retention, customer concentration, valuation, debt, and
      liquidity.
    whyItMatters: >-
      Network scale cannot establish monetization quality or support a valuation without economic and concentration
      evidence.
    diligencePath: >-
      Request current management accounts, KPI bridge, customer cohort data, cap table, debt schedule, and financing
      documents under NDA.
    relatedQuestionRefs:
      - QO004
      - QO008
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete founder, executive, board, ownership, and key-person roster.
    whyItMatters: Control rights, succession risk, and governance quality cannot be assessed from three named operating leaders.
    diligencePath: >-
      Obtain the current organization chart, board materials, executive biographies, incentive plans, and ownership
      schedule.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: network-scale
    missingEvidence: >-
      Reconciliation of changing partner and network descriptions, including 350-plus versus 500-plus real-world data
      partners and different site-coverage statements.
    whyItMatters: >-
      Changing denominators may reflect scope or time differences and should not be treated as directly comparable
      growth.
    diligencePath: Request a dated network-definition and KPI glossary with active, contracted, and historical partner counts.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: financing
    missingEvidence: >-
      Current financing and ownership evidence from an original announcement, filing, lender record, or company
      document.
    whyItMatters: >-
      The assigned evidence does not establish a current valuation or capital structure, leaving the investment
      conclusion exposed to an unsupported quantity.
    diligencePath: Obtain the latest financing announcement, lender package, capitalization table, and sponsor reporting.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Datavant-specific current revenue, pricing, eligible account universe, renewal rates, and product-level software
      versus services mix.
    whyItMatters: >-
      Without these denominators, adjacent market estimates cannot be converted into a defensible SAM, SOM, or
      valuation-relevant share estimate.
    diligencePath: >-
      Request a product-level revenue bridge, pricing and contract cohorts, renewal and expansion metrics, pipeline by
      buyer segment, and the account universe used for management's market sizing.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: network-scale
    missingEvidence: >-
      A dated reconciliation of network, records-exchanged, partner, hospital, clinic, and payer counts across product
      surfaces.
    whyItMatters: Different source vintages and denominators can make network scale appear more comparable than it is.
    diligencePath: >-
      Obtain a current KPI dictionary with definitions, period, deduplication rules, and product ownership for each
      network metric.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segmentation
    missingEvidence: Customer-level budget ownership, procurement route, contract type, and adoption path by segment.
    whyItMatters: >-
      The same platform can compete for IT, operations, clinical, research, or compliance budgets with different sales
      cycles and ROI hurdles.
    diligencePath: >-
      Interview representative provider, payer, life-sciences, analytics, and public-sector buyers and map approval,
      implementation, and renewal steps.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Representative customer quotes separating platform, data access, tokenization, and managed-services charges.
    whyItMatters: Without realized pricing and services mix, buyers cannot compare Datavant with point solutions or internal build.
    diligencePath: >-
      Obtain workflow-level proposals and at least two customer references with realized annual and implementation
      costs.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Independent evidence on retention, contract terms, migration, token portability, multi-homing, and competitive win
      rates.
    whyItMatters: Network scale alone does not prove a durable moat or pricing power.
    diligencePath: Review anonymized cohort retention, renewal data, migration plans, and competitive loss analysis under NDA.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: conflicting-data
    severity: material
    topic: network-scale
    missingEvidence: A reconciled definition and time series for active sites, data partners, records exchanged, and records tokenized.
    whyItMatters: Reported 2024 partner figures and current official figures differ and may use non-comparable denominators.
    diligencePath: Request dated metric definitions, deduplicated active counts, and inclusion criteria from management.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: peer-benchmark
    missingEvidence: Independent head-to-head benchmark against named interoperability, identity, RWD, and ROI alternatives.
    whyItMatters: >-
      The feature matrix currently distinguishes documented Datavant capabilities from unknown peer cells rather than
      proving superiority.
    diligencePath: >-
      Run a controlled buyer-workflow evaluation with identical data, accuracy, latency, compliance, and implementation
      criteria.
    relatedQuestionRefs:
      - QP002
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt, covenants, acquisition obligations, and next-round trigger.
    whyItMatters: A large network and historical transaction value do not establish liquidity or financing independence.
    diligencePath: >-
      Request the latest balance sheet, 24-month cash forecast, debt schedule, covenant package, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Current revenue by product, recurring versus usage-based mix, realized price, gross margin, and recognition
      policy.
    whyItMatters: >-
      The product portfolio combines infrastructure and services, so topline alone cannot establish revenue durability
      or margin path.
    diligencePath: >-
      Obtain a product-level revenue and gross-profit bridge with contract terms, discounting, renewal, and labor
      allocation.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales cycle, pipeline conversion, payback, customer concentration, NRR, GRR, and partner/channel economics.
    whyItMatters: Public activity proxies cannot distinguish efficient organic growth from low-margin or acquisition-led volume.
    diligencePath: Request cohort-level bookings, churn, expansion, sales capacity, CAC/payback, and partner-sourced revenue.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: matching-performance
    missingEvidence: >-
      Independent, cohort-specific precision, recall, false-match, missed-match, and drift results across representative
      data types and demographic groups.
    whyItMatters: >-
      The platform's value and safety depend on accurate linkage, while the only quantified public performance statement
      is conditional on full patient information.
    diligencePath: >-
      Request validation reports, error taxonomies, subgroup analyses, monitoring dashboards, and customer references
      under confidentiality.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: access-blocked
    severity: material
    topic: security
    missingEvidence: >-
      Current independent security attestations, penetration-test summaries, incident metrics, and the control boundary
      for customer-managed deployments.
    whyItMatters: >-
      Sensitive health data and regulated research workflows make control effectiveness and incident response central to
      adoption and liability.
    diligencePath: >-
      Obtain current SOC 2 or equivalent reports, security architecture reviews, breach history, RTO/RPO, and customer
      audit rights.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public, independent developer or practitioner activity signal such as repository activity, package downloads, or
      API-community usage.
    whyItMatters: >-
      The available developer-signal proxy is a company job posting, which indicates implementation scope but not
      external developer adoption.
    diligencePath: Request API documentation, release history, integration references, and non-company practitioner usage metrics.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Current NRR, GRR, logo churn, renewal rates, contract duration, and expansion or contraction by product and
      customer segment.
    whyItMatters: >-
      Network reach and selected deployments do not establish whether customers renew, expand, or produce durable
      recurring economics.
    diligencePath: >-
      Request a 24-month product- and segment-level cohort bridge showing opening recurring revenue, new business,
      expansion, contraction, churn, renewals, and contract terms.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer revenue shares, top-data-supplier dependence, channel-sourced revenue, and renewal status for major
      accounts.
    whyItMatters: >-
      A broad network count can coexist with concentrated revenue, supply dependence, or partner-controlled
      distribution.
    diligencePath: >-
      Request latest-twelve-month customer and supplier concentration tables, channel attribution, and renewal status
      for the top 20 relationships.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete current inventory distinguishing production customers, active pilots, completed projects, case studies,
      and announced partnerships.
    whyItMatters: >-
      The public sample is selected by Datavant or its partners and cannot establish the breadth or durability of
      production adoption.
    diligencePath: >-
      Reconcile CRM and customer-success records to public references and classify each relationship by product, start
      date, production status, spend, and renewal.
