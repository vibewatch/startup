slug: datavant
runDate: 2026-10-22
company:
  name: Datavant
chapter:
  number: 2
  title: Market Analysis
  summary: Datavant operates across adjacent healthcare data-connectivity, interoperability, retrieval, privacy, and real-world-data enablement markets. Evidence shows a large and structurally growing problem, but public sources do not isolate Datavant's serviceable market, pricing, or share, so sizing is presented as multiple lenses rather than a company-specific TAM/SAM/SOM claim.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: "Datavant's addressable opportunity is best bounded as the infrastructure and services used to acquire, retrieve, connect, protect, and operationalize healthcare data for providers, payers, life-sciences companies, analytics firms, and public-sector users. This excludes the much larger value of care delivery, drug sales, hospital software generally, and raw data ownership unless Datavant is paid to move, link, govern, or make those data usable. The status quo is not one competitor: it includes fax, email, phone follow-up, manual release-of-information labor, point-to-point health information exchange, internal EHR workflows, and buying or building separate data assets. MedCity News reports that providers still often use fax, email, phone calls, and manual follow-ups, while Datavant's own data-logistics paper describes healthcare data as siloed across thousands of sites and databases. The market therefore has a workflow-efficiency wedge as well as a data-network and privacy-infrastructure wedge. Adoption is likely to begin where missing or delayed records have an immediate operational or research cost, then expand into recurring connectivity and analytics workflows."
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: "Public evidence supports several non-equivalent sizing lenses, but it does not support adding them together. Datavant's authored paper cites a global healthcare data analytics market of $21.1 billion in 2021 reaching $85.9 billion by 2027, a global interoperability market expected to approach $16 billion by 2030, and a global enterprise data-management market growing from $77.9 billion in 2020 to $122.9 billion by 2025. These are adjacent categories with different publishers, geographies, definitions, and periods; they are not a Datavant TAM. The same paper reports that patient-level records per patient rose from about 59 in 2019 to 86 in 2023 and that provider NPIs increased 66% from 2019 to 2023, which supports demand growth but not revenue capture. Partner and product evidence points to narrower monetizable wedges: clinical-trial linkage, payer/provider clinical insights, health-plan retrieval and chart research, and provider record exchange. A defensible SAM/SOM still requires Datavant's current revenue by product, contract sizes, renewal rates, eligible account universe, and the portion of delivery that is software versus services."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-adoption
    title: Buyer segments, drivers, and constraints
    body: "Buyer ownership follows the workflow being solved. Providers and health systems can own budgets for retrieval, release-of-information, and care-coordination workflows; payers and risk-bearing providers can own budgets for chart acquisition, risk adjustment, quality, and member management; life-sciences companies and contract research organizations can own budgets for real-world evidence, trial recruitment, and longitudinal patient-data linkage; analytics and data partners can fund connectivity and privacy infrastructure. The strongest adoption triggers are measurable administrative burden, time-sensitive records, regulatory or audit requirements, and a need to combine datasets without exposing patient identity. MedCity News describes an early tissue-and-organ-donation customer with only a day or two to review a donor's history, while Premier describes real-world evidence control-arm and trial-linkage use cases. Constraints remain material: privacy and de-identification obligations, heterogeneous source systems, dependence on the counterparty's response time, integration and change-management effort, and unclear public pricing. Datavant's reported rollout of less than a week for early Provider Exchange users is encouraging, but it is a company executive's statement and should not be generalized to all products or customers."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: What remains unproven
    body: "The evidence supports a credible market need and several distribution wedges, but not a clean investment-grade market share calculation. Company and partner materials provide network and workflow metrics, while independent coverage provides operating examples; none discloses current Datavant revenue, recurring revenue, product-level gross margin, pricing, win rates, or the denominator needed to convert network scale into wallet share. Public category estimates also mix global and U.S. markets and combine software, services, data, and infrastructure. The central diligence task is therefore to reconcile product-level bookings or revenue with the eligible buyer universe and to separate pass-through data or services revenue from software-like recurring revenue. A buyer reference set should test whether the value proposition is budgeted as interoperability, release-of-information labor, analytics, compliance, or research spend, because those budget owners imply different sales cycles and competitive sets."
    claimRefs: [CM008, CM009, CM013, CM014]
