      - [Datavant / Valuate / Prognos analysis, 2030, Global, "Nearly $16B healthcare data interoperability", null, "Market estimate cited in Datavant-authored data-logistics paper", medium, "Geography and category differ from Datavant's served wedges"]
      - [Datavant / Valuate / Prognos analysis, 2020-2025, Global, "$77.9B to $122.9B enterprise data management", null, "Market estimate cited in Datavant-authored data-logistics paper", medium, "Broad enterprise category includes non-healthcare spend"]
      - [Datavant / Valuate / Prognos analysis, 2023, Global, "$27.42B EMR to $41.87B projected", null, "Market estimate cited in Datavant-authored data-logistics paper", low, "Acquisition and collection category is not Datavant's addressable market"]
      - [Datavant / Valuate / Prognos analysis, 2019-2023, Patient-level records, "59 to 86 records per patient", null, "Study observation reported in the paper", medium, "Demand-growth indicator, not a market-value estimate"]
      - [Datavant / Valuate / Prognos analysis, 2019-2023, United States, "66% increase in provider NPIs", null, "Study observation reported in the paper", medium, "Supply/network complexity indicator, not spend"]
    notes: "Values preserve the source's categories, periods, and geographies. Lenses are not additive; CAGR was not reported in the retained text and is left null."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [Providers and health systems, "CIO, operations, HIM, clinical leadership", "Records and care teams", "Provider organization", "Retrieve and coordinate outside records", "Health IT, HIM, operations", "Reduce manual retrieval and time-sensitive delays"]
      - [Health plans and risk-bearing providers, "Payer and population-health leadership", "Risk adjustment, quality, care-management, analytics teams", "Health plan or risk-bearing provider", "Acquire, search, extract, and act on clinical records", "Quality, risk, medical-management, analytics", "Audit, HEDIS, risk, and member-management requirements"]
      - ["Life sciences, devices, and CROs", "Clinical development, evidence, data-science teams", "Researchers and trial operations", "Sponsor or research organization", "Link trial and real-world data; build evidence", "R&D, clinical operations, HEOR", "Trial speed, control-arm economics, diversity, and longitudinal outcomes"]
      - [Data partners and analytics firms, "Data product and partnership leaders", "Data stewards and analysts", "Data vendor or analytics organization", "Discover, tokenize, and connect datasets", "Data platform and partnership budgets", "Need compliant reach across more datasets and buyers"]
      - [Public sector and academic users, "Program, policy, and research leadership", "Analysts and investigators", "Government or institution", "Link and govern data for policy and research", "Program and research budgets", "Population insight, health equity, and defensible governance"]
    notes: "This is a workflow-based segmentation, not an exhaustive customer enumeration; payer, user, and budget owner can differ within an account."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: "Non-additive market and demand lenses narrow from broad adjacent categories to Datavant-relevant workflow wedges."
    data:
      nodes:
        - {id: broad-data, label: "Enterprise data management", value: "$77.9B to $122.9B", unit: "global; 2020-2025"}
        - {id: analytics, label: "Healthcare data analytics", value: "$21.1B to $85.9B", unit: "global; 2021-2027"}
        - {id: interoperability, label: "Healthcare interoperability", value: "Nearly $16B", unit: "global; expected 2030"}
        - {id: records, label: "Patient record density", value: "59 to 86", unit: "records per patient; 2019-2023"}
        - {id: network, label: "Provider-source complexity", value: "66% increase", unit: "provider NPIs; 2019-2023"}
        - {id: wedge, label: "Datavant-relevant wedges", value: "Not isolated", unit: "retrieval, linkage, privacy, evidence"}
    approximationNotes: "The layers are an ordered presentation of non-comparable lenses, not a mathematical funnel or additive TAM/SAM/SOM calculation. Numeric values match TM002; the final wedge is intentionally qualitative because public sources do not isolate Datavant's SAM or SOM."
    claimRefs: [CM005, CM006, CM007, CM010, CM012]
callouts:
  - calloutType: insight
    title: The market is a workflow-and-trust problem
    body: "Datavant's opportunity is supported by recurring fragmentation, privacy, and administrative bottlenecks; the strongest proof is use-case-specific rather than a single top-down market number."
    claimRefs: [CM002, CM003, CM010, CM011]
  - calloutType: risk
    title: Network scale is not wallet share
    body: "Public network, records, and partner counts demonstrate reach but do not establish revenue, retention, pricing power, or the portion of spend captured by Datavant."
    claimRefs: [CM008, CM009, CM014]
