      relatedQuestionRefs: [QU009]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-customer revenue shares, top-data-supplier dependence, channel-sourced revenue, and renewal status for major accounts.
      whyItMatters: A broad network count can coexist with concentrated revenue, supply dependence, or partner-controlled distribution.
      diligencePath: Request latest-twelve-month customer and supplier concentration tables, channel attribution, and renewal status for the top 20 relationships.
