company:
  name: Datavant
chapter:
  number: 6
  title: Customers
  summary: Datavant has public evidence of adoption across providers, payers, life sciences, and real-world-data partners, including operational examples in data discovery, clinical trials, and medical-record retrieval. The evidence is materially weaker on retention, contract duration, customer economics, and concentration, so network reach should not be treated as recurring-revenue durability.
sections:
  - id: customer-segments
    title: Customer segments and buying jobs
    body: >-
      Datavant addresses a multi-sided healthcare-data market rather than a single buyer profile. Its official pages identify providers, health plans, life sciences, data analytics, and public-sector organizations, while partner evidence adds data suppliers and clinical-research teams. The common buying job is secure movement, linkage, retrieval, or evaluation of patient-level data, but the user and payer can differ: a provider may operate release-of-information workflows, a health plan may consume clinical data, and a life-sciences team may buy access to linked datasets. Rx Almanac characterizes the commercial motion as custom and RFP-led, with scope depending on volumes, modules, and partner mix. That breadth supports several monetization surfaces, but public segment labels do not disclose customer counts, revenue mix, average contract value, or geographic concentration.
    claimRefs: [CU001, CU012, CU013]
    tableRefs: [TU001]
  - id: scale-and-adoption
    title: Scale signals and adoption trajectory
    body: >-
      Datavant's current public materials report more than 80,000 hospitals and clinics, coverage of all U.S. health plans directly or through health-system customers, 350-plus real-world-data partners, and relationships with all 20 top pharmaceutical companies. These measures show network breadth across both supply and demand, and a third-party product listing repeats the 350-partner and top-pharma claims. They are not comparable customer metrics: provider sites, payer coverage, ecosystem partners, and corporate relationships use different denominators and may include non-paying or indirectly reached organizations. Premier's February 2024 announcement supplies a dated operating marker by quoting Datavant as having tokenized more than 100 clinical trials, but neither source set publishes an active-account series, utilization cohort, or revenue conversion rate.
    claimRefs: [CU002, CU003, CU004, CU005, CU010]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named deployments and outcome quality
    body: >-
      The assigned evidence includes three concrete operating contexts. Veradigm described itself as an early adopter of Datavant Connect and said its clinical registries would become available for faster discovery and evaluation by life-sciences teams. Premier said its collaboration with Datavant had operated since September 2022 and described an active chronic-condition trial linking trial data with Premier Healthcare Data. Datavant's Florida Woman Care case study describes centralized intake and automated EHR retrieval, with higher digital fulfillment in 2025. These examples go beyond logo display because they identify workflows and users, yet evidence quality remains mixed: two accounts are partner-issued, one is company-issued, customer identities are sometimes withheld, and the sources omit measured purchase conversion, baseline fulfillment rates, contract value, and renewal history.
    claimRefs: [CU006, CU007, CU008, CU009, CU011, CU014]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration
    body: >-
      The evidence supports a plausible expansion mechanism but not measured expansion economics. A data provider can connect inventory and gain discoverability; a life-sciences buyer can evaluate data and deploy linkage in a trial; a provider can automate record retrieval; and adjacent datasets or workflows can then be added. This sequence could increase embeddedness, but it is an analytical synthesis rather than a reported customer journey or conversion funnel. No assigned source discloses NRR, GRR, logo churn, renewal rates, contract length, top-customer revenue share, or partner and channel concentration. Those omissions are material because a large network may coexist with shallow usage, services-heavy delivery, or concentrated revenue. Underwriting should therefore rely on private cohort, contract, utilization, and concentration data rather than interpreting reach metrics as proof of durability.
    claimRefs: [CU007, CU012, CU013, CU014, CU015]
    figureRefs: [FU001]
