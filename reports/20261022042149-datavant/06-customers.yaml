      - ["Clinical-trial tokenization", "More than 100 clinical trials", "Premier announcement dated 2024-02-13", "Premier quoting Datavant", medium, "Dated evidence of trial-workflow deployment", "Current active trials, unique customers, cumulative versus recurring use, and outcomes"]
    notes: Metrics use different units and periods and must not be combined into a growth rate; company-reported reach is not an active-customer or revenue measure.
    claimRefs: [CU002, CU003, CU004, CU005, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer/partner, Segment, Deployment/use case, Production vs pilot, Reported outcome, Limitation]
    enumerationScope:
      coverage: sample
      basis: Publicly named or specifically described Datavant deployments in the assigned source pool through 2026-10-22
    rows:
      - [Veradigm, "Data provider and life sciences", "Clinical Data Registries connected to Datavant Connect for discovery and evaluation", "Early adoption and live-connection model described; production volume not disclosed", "Faster dataset evaluation and greater discoverability are claimed", "Partner-issued account with no usage, purchase-conversion, revenue, or renewal data"]
      - [Premier Applied Sciences, "RWD provider and clinical research partner", "Trial data linked with Premier Healthcare Data for longitudinal evidence", "Active chronic-condition trial described", "Medication-history and post-trial follow-up visibility are described", "Partner-issued account; sponsor identity, measured outcome, economics, and renewal are not disclosed"]
      - [Florida Woman Care, Provider, "Centralized request intake and automated record retrieval from the EHR", "Case-study deployment with 2025 operating outcome", "Digital fulfillment rates increased and reporting timelines improved", "Company-issued case study omits baseline, percentage change, contract economics, and independent verification"]
    notes: This is a sample, not a complete customer enumeration; announcements and company case studies establish described workflows but not durable paid production across the full base.
    claimRefs: [CU006, CU007, CU008, CU009, CU011, CU014]
figures:
  - id: FU001
    title: Customer journey from data supply to expansion
    type: journey-map
    summary: Public evidence supports a multi-sided workflow sequence, but no stage-level conversion, retention, or expansion rate is disclosed.
    data:
      nodes:
        - id: partner-connects
          label: Data partner connects
          details: "A provider or registry exposes data through privacy-preserving connectivity while retaining control of its underlying data."
          touchpoints: ["Dataset registration", "Live cloud connection", "Privacy controls"]
        - id: inventory-discovery
          label: Inventory becomes discoverable
          details: "Life-sciences teams can inspect metadata, run feasibility queries, and compare data assets before purchase."
          touchpoints: ["Metadata review", "Feasibility query", "Overlap assessment"]
        - id: use-case-selection
          label: Buyer selects a use case
          details: "The buyer chooses a trial, evidence-generation, retrieval, or analytics workflow."
          touchpoints: ["Trial design", "RWE study", "Record retrieval"]
        - id: workflow-deployment
          label: Workflow deploys
          details: "Premier and Florida Woman Care examples describe active linked-data and automated-retrieval workflows."
          touchpoints: ["Tokenization", "Patient-level linkage", "EHR retrieval"]
        - id: adjacent-expansion
          label: Adjacent scope can expand
          details: "Additional datasets, studies, provider sites, or downstream workflows are plausible expansion surfaces."
          touchpoints: ["More datasets", "More studies", "Adjacent operational workflows"]
        - id: durability-review
          label: Durability remains unverified
          details: "Private evidence is required to establish renewal, contraction, churn, contract duration, and concentration."
          touchpoints: ["Cohort bridge", "Contract review", "Concentration analysis"]
    approximationNotes: The ordered stages synthesize source-described workflows and do not imply a common population, measured conversion, or value-proportional progression.
    claimRefs: [CU007, CU009, CU011, CU014, CU015]
callouts:
  - calloutType: strength
    title: Adoption proof extends beyond logos
    body: Veradigm, Premier, and Florida Woman Care evidence identifies actual data-discovery, trial-linkage, and record-retrieval workflows, although the issuers do not disclose comparable commercial outcomes.
    claimRefs: [CU006, CU008, CU009, CU011, CU014]
  - calloutType: risk
    title: Reach is not retention
    body: Provider, payer, partner, and pharma reach metrics lack active-account, spend, renewal, churn, and concentration denominators, preventing a public-data conclusion on customer durability.
    claimRefs: [CU002, CU003, CU004, CU005]
