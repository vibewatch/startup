      - ["Ciox Health / Datavant Group email breach", "United States; HHS OCR and federal court", "2024 breach; reported preliminary settlement approval in 2026", "Medium", "Critical", "Partial: settlement and stated privacy/security program; current control testing not shown", "High", "Obtain final order, root-cause review, remediation evidence, insurance recovery, and current incident log"]
      - ["HIPAA de-identification and Expert Determination", "United States", "Ongoing product and service requirement", "Medium", "High", "Partial: Datavant describes Expert Determinations, remediations, and privacy assessments", "Medium-high", "Review current certifications, sampled determinations, exception logs, and customer audit rights"]
      - ["Consent, authorization, and patient-level linkage", "United States and customer jurisdictions", "Ongoing across retrieval and RWD workflows", "Medium", "High", "Partial: tokenization and consented EMR retrieval are described; end-to-end controls are not independently tested", "High", "Map consent provenance, revocation handling, retention, and cross-dataset matching controls"]
      - ["Forward-looking claims and clinical-use risk", "United States", "Partner materials include explicit forward-looking risk warning", "Medium", "Medium-high", "Partial: use cases and data-linkage controls are described, but outcome validation is limited", "Medium", "Review study protocols, validation reports, adverse-event handling, and customer indemnities"]
    notes: "Rows synthesize the assigned legal, regulatory, and primary/partner materials; status reflects the source text available at access date, and null or undisclosed current control metrics are treated as diligence gaps rather than proof of compliance."
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible legal, regulatory, privacy, and partner materials in the assigned 2026 refresh pool; not a complete docket or compliance inventory."
    claimRefs: [CR001, CR002, CR003, CR004, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Phishing, account compromise, or unauthorized access to sensitive records", "Medium", "Critical", "Partial: Datavant describes phish-resistant MFA, threat modeling, and secure architecture", "High", "Current incident frequency, independent penetration results, and control exceptions are not disclosed"]
      - ["Incomplete or delayed medical-record retrieval across fragmented providers", "Medium", "High", "Partial: company claims nationwide workflows, badged access to 40% of health systems, and scaled outreach", "Medium-high", "Cohort-level turnaround, denial, yield, and SLA distributions are not disclosed"]
      - ["Tokenization or matching error creates unusable or incorrectly linked data", "Medium", "High", "Partial: encrypted, irreversible, site-specific tokens and matching models are described", "Medium-high", "Independent precision/recall, false-match controls, and remediation rates are not disclosed"]
      - ["Margin compression or liquidity stress from service-heavy delivery and adverse events", "Unknown", "High", "Low: public pool lacks current burn, leverage, margin, working-capital, and insurance data", "High", "Obtain management accounts, debt schedule, cash runway, claims reserves, and product/service gross margins"]
    notes: "Likelihood and residual exposure are qualitative ratings grounded in the described operating model and disclosed adverse event; they are not statistically estimated probabilities. Financial-model rows remain explicitly uncertain where public evidence is absent."
    claimRefs: [CR001, CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Real-world data network", "350+ data partners and provider ecosystem", "Supply and linkage inputs for RWD and retrieval", "Scale is disclosed; individual concentration is not", "Partner exits, data-quality deterioration, or restricted access reduces coverage or utility", "High", "Multi-partner network and tokenized connectivity", "Medium-high"]
      - ["Clinical research integration", "Thermo Fisher / PPD", "Connect RWD with clinical research and EMR data", "Strategic collaboration disclosed; revenue share and renewal terms unknown", "Partner changes workflow or demand, reducing a high-value use case", "High", "Joint infrastructure and stated secure linkage capability", "Medium-high"]
      - ["Real-world evidence and trial workflows", "Premier Applied Sciences / PINC AI", "Link clinical-trial data with Premier real-world data", "Relationship since 2022 and expanded collaboration; economics unknown", "Trial adoption, data quality, or partner strategy changes limit realized outcomes", "High", "Tokenization, linkage platform, and multiple described use cases", "Medium"]
      - ["Healthcare record retrieval", "Hospitals, clinics, health systems, and requesters", "Source records and retrieval execution", "80,000+ sites and 120k legal/insurance requesters claimed; concentration and SLA mix unknown", "Access restrictions, authorization friction, outages, or labor bottlenecks delay delivery", "High", "Badged access, scaled outreach, SLAs, and end-to-end workflow", "High"]
    notes: "The register distinguishes ecosystem breadth from counterparty concentration. Public network counts do not establish contract durability, exclusivity, customer concentration, or substitutability."
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012, CR013, CR014]
