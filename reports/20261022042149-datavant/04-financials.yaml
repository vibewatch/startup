company:
  name: Datavant
chapter:
  number: 4
  title: Financials
  summary: Datavant presents a broad, multi-product health-data connectivity and retrieval model with meaningful operating scale, but the assigned public evidence does not disclose current revenue, margins, cash, burn, leverage, or realized pricing. The underwriting conclusion is therefore that revenue quality and capital adequacy remain materially unproven, with service intensity and acquisition integration as key margin risks.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Datavant's public surfaces describe several monetizable streams rather than a single software subscription: privacy-preserving connectivity and tokenization, data retrieval and release-of-information services, risk-adjustment coding, and value-added real-world-data and analytics workflows. The commercial-pharma page says Datavant supports commercial analytics, HEOR, advertising measurement, patient-support programs, and future drug development, while also describing Smart Request retrieval and annual record volume. That breadth can increase wallet share and embed the platform in regulated workflows, but it also means revenue quality likely varies by product, contract, utilization, and labor content. The public evidence supports a mechanism map, not a revenue mix or accounting conclusion: no assigned source gives current revenue, ARR, realized price, gross margin, renewal, or customer concentration. Official list or capability descriptions should therefore not be treated as realized revenue or unit economics.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      Public traction is strongest in network and activity proxies. Datavant states that more than 60 million healthcare records move between thousands of organizations, while its network includes more than 80,000 hospitals and clinics, 350-plus real-world-data partners, and 75% of the 100 largest health systems. Its commercial-pharma page separately describes 40-plus life-science customers, more than 100 brands and trials, more than 40,000 medical facilities, and more than 64 million annual retrievals. A March 2026 company release adds that Datavant exchanged more than 40 million medical records in the prior year and codes more than 30 million records annually. These measures indicate reach and throughput, but they are not interchangeable: records moved, exchanged, retrieved, and coded have different scopes and periods, as do partner, facility, customer, brand, and trial counts. No source reports sales cycle, CAC, payback, bookings, win rate, or channel take rate. The diligence priority is cohort-level conversion from activity into contracted recurring or transaction revenue.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: >-
      The operating model appears to combine technology with substantial data operations and services. Datavant describes record retrieval, coding, privacy expertise, data preparation, and expert-governed deployment alongside connectivity infrastructure. Premier's partner announcement says the platform links trial and real-world data, while the commercial-pharma page calls Datavant the largest record-retrieval company in the United States and reports more than 64 million annual retrievals. That mix can create variable delivery costs, labor exposure, quality-control expense, and working-capital needs that are not visible in a software-style margin assumption. The assigned evidence does not report cash on hand, debt, covenant terms, burn, runway, capex, acquisition consideration, or post-acquisition integration cost. The 2021 Ciox transaction announcement records a $7.0 billion transaction value and more than $700 million of revenue for the combined company at that historical point, but neither figure is current and neither establishes cash available today.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Datavant has credible evidence of scale, partner adoption, and multiple monetization surfaces, but public disclosure is insufficient for underwriting a current valuation or margin path. The strongest positive case is that connectivity, retrieval, coding, privacy, and data-activation services may reinforce one another and create workflow switching costs. The principal adverse case is that acquisition-led expansion and operational complexity can obscure organic growth and dilute margins; the assigned Built In page explicitly flags limited financial transparency, acquisition dependence, integration complexity, and inconsistent revenue figures. This source is an AI-generated company profile and is not a substitute for audited financial statements, but it is a useful adverse signal about the disclosure gap. A financing decision should remain conditional on product-level revenue and gross-margin bridges, cohort retention, customer concentration, cash and debt schedules, burn/runway, and evidence separating software from labor-heavy services.
    claimRefs: [CI013, CI014, CI015, CI016]
    tableRefs: []
tables:
  - id: TI001
    title: Revenue streams and quality
    columns: [Stream, Mechanism, Public unit or value, Revenue-quality read, Diligence ask]
    rows:
      - [Connectivity and tokenization, "Privacy-preserving linkage and data collaboration infrastructure", "No public price or revenue disclosed", "Potentially recurring infrastructure, but contract and usage basis unknown", "Obtain ARR/MRR by product, contract term, renewal, and realized price"]
      - [Record retrieval and release of information, "Retrieve and deliver patient records through the provider network", "More than 64 million retrievals annually (company claim)", "Activity is visible; labor and per-request economics are not", "Reconcile retrieval volume, billable units, fulfillment cost, and gross margin"]
      - [Risk-adjustment coding, "Retrieve, structure, code, and report clinical and claims data for payers", "More than 30 million records coded annually (company claim)", "Service-plus-technology stream with unknown labor intensity", "Separate software, outsourced labor, and pass-through revenue"]
      - [Real-world-data and analytics workflows, "Link clinical, claims, EHR, lab, and first-party data for analytics and HEOR", "40+ life-science customers; 100+ brands and trials (company claim)", "Evidence of adoption, but no contract value or retention", "Request bookings, ACV, renewal, expansion, and data-partner economics"]
    notes: "Company and partner pages provide activity and customer proxies, not recognized revenue; null pricing and margin fields mean no public disclosure was found in the assigned pool."
    claimRefs: [CI001, CI002, CI003, CI004, CI007]
  - id: TI002
    title: Pricing and sales-efficiency evidence
    columns: [Metric or proxy, Observed value/status, Basis, Underwriting implication, Diligence ask]
    rows:
      - [List pricing, null, "No public price sheet in assigned sources", "Realized price and discounting cannot be assessed", "Collect representative order forms and price waterfalls"]
      - [Customer scale, "40+ life-science customers", "Datavant commercial-pharma page", "Shows market adoption but not account concentration", "Obtain top-10 customer share and cohort retention"]
      - [Network scale, "350+ real-world-data partners", "Datavant official page", "May support distribution and data liquidity", "Measure partner-sourced pipeline and take rates"]
      - [Payer workflow volume, "More than 40 million records exchanged last year and more than 30 million coded annually", "March 2026 company release; the two measures have different scopes", "Shows current activity but not revenue, price, or gross profit", "Reconcile exchanged and coded records to billable units and product-level margin"]
      - [Sales cycle, null, "No assigned source reports cycle length", "CAC payback and capacity planning are unavailable", "Request pipeline conversion, cycle, CAC, and quota attainment"]
    notes: "The table distinguishes reported operating proxies from unavailable private sales metrics; no list price is inferred from product descriptions."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital-adequacy status
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "More than $700 million for the combined company in the 2021 merger announcement", "Historical company/investor announcement", "Provides a dated scale anchor only; it is not current revenue or ARR", "Obtain current audited or lender-quality revenue bridge"]
      - [Gross margin, null, "Unavailable in assigned sources", "Determines whether the model is software-like or service-heavy", "Provide product-level gross margin and labor allocation"]
      - [Cash and runway, null, "Unavailable in assigned sources", "Determines financing dependency and downside protection", "Provide monthly cash, burn, runway, and liquidity forecast"]
      - [Debt and obligations, null, "Unavailable in assigned sources", "Debt can constrain acquisition and investment capacity", "Provide debt schedule, covenants, leases, and project-finance obligations"]
      - [Customer concentration and retention, null, "Unavailable in assigned sources", "Large networks do not prove durable revenue quality", "Provide NRR/GRR, logo churn, top-customer share, and partner concentration"]
    notes: "Null means the assigned public evidence did not disclose the metric; the historical revenue figure is retained with its 2021 period and must not be treated as current."
    claimRefs: [CI009, CI010, CI011, CI012, CI015, CI016]
figures:
