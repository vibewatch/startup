    title: Activity-to-value revenue model bridge
    type: flow
    summary: Datavant's public operating model links healthcare data sources and retrieval activity to privacy-preserving connectivity, analytics, and payer or life-science workflows, but does not disclose the conversion to recognized revenue or gross profit.
    data:
      nodes:
        - id: data-network
          label: "Provider, payer, life-science, legal, and insurance data"
          detail: "Network and partner inputs"
        - id: retrieval
          label: "Record retrieval and release of information"
          detail: "More than 64 million retrievals annually claimed on the commercial-pharma page"
        - id: tokenization
          label: "Privacy-preserving tokenization and linkage"
          detail: "Connect datasets while protecting patient privacy"
        - id: analytics
          label: "RWD, HEOR, commercial analytics, and trial workflows"
          detail: "Use-case and data-activation layer"
        - id: payer-services
          label: "Risk adjustment, coding, and audit-ready reporting"
          detail: "Payer workflow and value-added services"
        - id: revenue
          label: "Contracted or usage-based revenue"
          detail: "Amount, mix, margin, and recognition not publicly disclosed"
      edges:
        - from: data-network
          to: retrieval
        - from: data-network
          to: tokenization
        - from: retrieval
          to: analytics
        - from: tokenization
          to: analytics
        - from: retrieval
          to: payer-services
        - from: analytics
          to: revenue
        - from: payer-services
          to: revenue
    claimRefs: [CI001, CI002, CI003, CI009]
callouts:
  - calloutType: strength
    title: Scale is visible, economics are not
    body: Datavant reports broad network reach and high-volume data movement across multiple buyer groups, which supports a credible platform-scale thesis; the assigned evidence does not show how that activity converts into recurring revenue or margin.
    claimRefs: [CI005, CI006, CI007]
  - calloutType: risk
    title: Capital adequacy remains a blocking diligence item
    body: No assigned source discloses current cash, burn, runway, debt, covenants, or acquisition integration costs. A valuation conclusion should therefore remain conditional rather than treating historical transaction value or network size as cash or earnings capacity.
    claimRefs: [CI011, CI012, CI015, CI016]
