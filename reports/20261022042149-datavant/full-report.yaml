  - id: TV004
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Network scale converts into durable recurring or repeatable revenue; software leverage improves after
          integration
        - Premium entry can be justified only by verified growth, retention, and margin
        - Privacy incident, execution complexity, customer concentration
        - Possible but unverified
      - - Base
        - Strategic network remains valuable while revenue mix and cash conversion stay opaque
        - Research-more; pay only after data-room evidence establishes a defensible multiple
        - Services intensity, integration drag, preference overhang
        - Most supportable from current evidence
      - - Bear
        - Multiple compression or weak economics reveal scale without sufficient cash generation
        - Avoid or require a material price reset and downside protection
        - Leverage, down-round risk, regulatory remediation, failed commercialization
        - Plausible downside not quantifiable
    notes: >-
      These are qualitative scenarios, not numerical forecasts; probability signals reflect evidence sufficiency rather
      than estimated probabilities.
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
