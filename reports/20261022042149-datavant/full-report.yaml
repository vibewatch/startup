chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Datavant describes its mission as making health data secure, accessible, and actionable, and its product
              surfaces position the company as infrastructure for moving, protecting, connecting, and activating
              patient-level data. The product scope spans privacy-preserving tokenization, data linkage, medical-record
              retrieval, real-world evidence, and workflow support for providers, payers, life sciences, legal and
              insurance organizations, and government users. An independent profile similarly describes a healthcare
              data collaboration platform, while a third-party product profile describes deployment through on-premise,
              command-line, desktop, or cloud environments. This is a broad platform identity rather than a
              single-application software profile, and the mix of technology and value-added services should be
              diligence-tested.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO016
      - number: '1.2'
        title: Scale and commercial footprint
        blocks:
          - type: paragraph
            body: >-
              The retained materials support a meaningful operating footprint, but the figures are company or partner
              descriptions rather than audited financial disclosures. Datavant says its network includes more than
              80,000 hospitals and clinics, more than 75% of the largest 100 health systems, 100% of U.S. payers, and
              350-plus real-world data partners; a 2026 release also says more than 60 million records move between
              thousands of organizations. A company page states that 1,500 terabytes are exchanged and one trillion
              records are tokenized annually. These are indicators of network reach and activity, not revenue, ARR,
              margin, customer retention, or cash generation. The public record therefore supports scale as an operating
              thesis while leaving monetization and concentration unverified.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
