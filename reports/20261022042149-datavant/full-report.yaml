  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - Network scale and strategic relevance
        - 80,000+ providers; 350+ partners; institutional minority investment
        - Evidence that scale produces durable high-margin revenue
      - - Privacy-preserving infrastructure can be embedded in workflows
        - Tokenization, linkage, retrieval, and secure exchange described by company and partners
        - Independent retention, usage, and unit-economics data
      - - Sponsor validation
        - Neuberger Berman and KKR reported as new minority investors; New Mountain retains control
        - Transaction terms, price, preferences, and governance rights
      - - Competitive set
        - Tracxn ranks Datavant second among 60 active competitors
        - Comparable revenue, growth, margin, and transaction multiples on like-for-like definitions
      - - Opaque economics are the central anti-thesis
        - Revenue, margin, leverage, and consideration are not disclosed; historical profile has inconsistent fields
        - Audited financials and acquisition-adjusted cash-flow bridge
