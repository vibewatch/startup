  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Datavant's disclosed operating model layers data tokenization, discovery, linkage, governance, and evidence
      workflows.
    data:
      layers:
        - name: Data inputs
          label: Data inputs
          detail: Source datasets are brought into a controlled connectivity workflow.
          items:
            - name: Claims, EHR, clinical-trial, and real-world datasets
              detail: Source datasets are brought into a controlled connectivity workflow.
        - name: Privacy foundation
          label: Privacy foundation
          detail: Tokenization and expert review establish the privacy and compliance base.
          items:
            - name: Tokenization
              detail: Create encrypted, interoperable, irreversible, site-specific tokens.
            - name: Expert determination
              detail: Assess and remediate disclosure risk for permitted uses.
        - name: Connectivity services
          label: Connectivity services
          detail: Discovery, overlap assessment, and matching connect approved datasets.
          items:
            - name: Partner discovery and overlap
              detail: Inspect metadata and dataset overlap before linking or selecting sources.
            - name: Patient-level matching
              detail: Connect records using tokens, matching models, and referential data.
        - name: Controlled operations
          label: Controlled operations
          detail: Permissions, workflow management, and delivery govern data use.
          items:
            - name: Permissions and delivery
              detail: Manage access requests, workflows, and delivery to authorized recipients.
        - name: Evidence workflows
          label: Evidence workflows
          detail: Evidence and AI-assisted analysis operate within defined human review points.
          items:
            - name: RWE and AI-assisted analysis
              detail: Explore data, define measures, generate cohorts, and analyze evidence with human review.
        - name: Governance and evaluation
          label: Governance and evaluation
          detail: Scientific evaluations, auditability, and production thresholds are described for agentic workflows.
          items:
            - name: Scientific evaluation and monitoring
              detail: Benchmark outputs, review performance, and advance workflows only after defined checks.
    approximationNotes: >-
      Layer order is an analytical representation of disclosed capabilities, not a published deployment diagram or a
      claim that all modules are bundled for every customer.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE013
      - CE014
      - CE015
  - id: FU001
    title: Customer journey from data supply to expansion
    type: journey-map
    summary: >-
      Public evidence supports a multi-sided workflow sequence, but no stage-level conversion, retention, or expansion
      rate is disclosed.
    data:
      nodes:
        - id: partner-connects
          label: Data partner connects
          details: >-
            A provider or registry exposes data through privacy-preserving connectivity while retaining control of its
            underlying data.
          touchpoints:
            - Dataset registration
            - Live cloud connection
            - Privacy controls
        - id: inventory-discovery
          label: Inventory becomes discoverable
          details: Life-sciences teams can inspect metadata, run feasibility queries, and compare data assets before purchase.
          touchpoints:
            - Metadata review
            - Feasibility query
            - Overlap assessment
        - id: use-case-selection
          label: Buyer selects a use case
          details: The buyer chooses a trial, evidence-generation, retrieval, or analytics workflow.
          touchpoints:
            - Trial design
            - RWE study
            - Record retrieval
        - id: workflow-deployment
          label: Workflow deploys
          details: Premier and Florida Woman Care examples describe active linked-data and automated-retrieval workflows.
          touchpoints:
            - Tokenization
            - Patient-level linkage
            - EHR retrieval
        - id: adjacent-expansion
          label: Adjacent scope can expand
          details: Additional datasets, studies, provider sites, or downstream workflows are plausible expansion surfaces.
          touchpoints:
            - More datasets
            - More studies
            - Adjacent operational workflows
        - id: durability-review
          label: Durability remains unverified
          details: Private evidence is required to establish renewal, contraction, churn, contract duration, and concentration.
          touchpoints:
            - Cohort bridge
            - Contract review
            - Concentration analysis
    approximationNotes: >-
      The ordered stages synthesize source-described workflows and do not imply a common population, measured
      conversion, or value-proportional progression.
    claimRefs:
