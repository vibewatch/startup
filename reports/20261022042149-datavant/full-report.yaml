  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Datavant's addressable opportunity is best bounded as the infrastructure and services used to acquire,
              retrieve, connect, protect, and operationalize healthcare data for providers, payers, life-sciences
              companies, analytics firms, and public-sector users. This excludes the much larger value of care delivery,
              drug sales, hospital software generally, and raw data ownership unless Datavant is paid to move, link,
              govern, or make those data usable. The status quo is not one competitor: it includes fax, email, phone
              follow-up, manual release-of-information labor, point-to-point health information exchange, internal EHR
              workflows, and buying or building separate data assets. MedCity News reports that providers still often
              use fax, email, phone calls, and manual follow-ups, while Datavant's own data-logistics paper describes
              healthcare data as siloed across thousands of sites and databases. The market therefore has a
              workflow-efficiency wedge as well as a data-network and privacy-infrastructure wedge. Adoption is likely
              to begin where missing or delayed records have an immediate operational or research cost, then expand into
              recurring connectivity and analytics workflows.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several non-equivalent sizing lenses, but it does not support adding them
              together. Datavant's authored paper cites a global healthcare data analytics market of $21.1 billion in
              2021 reaching $85.9 billion by 2027, a global interoperability market expected to approach $16 billion by
              2030, and a global enterprise data-management market growing from $77.9 billion in 2020 to $122.9 billion
              by 2025. These are adjacent categories with different publishers, geographies, definitions, and periods;
              they are not a Datavant TAM. The same paper reports that patient-level records per patient rose from about
              59 in 2019 to 86 in 2023 and that provider NPIs increased 66% from 2019 to 2023, which supports demand
              growth but not revenue capture. Partner and product evidence points to narrower monetizable wedges:
              clinical-trial linkage, payer/provider clinical insights, health-plan retrieval and chart research, and
              provider record exchange. A defensible SAM/SOM still requires Datavant's current revenue by product,
              contract sizes, renewal rates, eligible account universe, and the portion of delivery that is software
              versus services.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM012
      - number: '2.3'
        title: Buyer segments, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer ownership follows the workflow being solved. Providers and health systems can own budgets for
              retrieval, release-of-information, and care-coordination workflows; payers and risk-bearing providers can
              own budgets for chart acquisition, risk adjustment, quality, and member management; life-sciences
              companies and contract research organizations can own budgets for real-world evidence, trial recruitment,
              and longitudinal patient-data linkage; analytics and data partners can fund connectivity and privacy
              infrastructure. The strongest adoption triggers are measurable administrative burden, time-sensitive
              records, regulatory or audit requirements, and a need to combine datasets without exposing patient
              identity. MedCity News describes an early tissue-and-organ-donation customer with only a day or two to
              review a donor's history, while Premier describes real-world evidence control-arm and trial-linkage use
              cases. Constraints remain material: privacy and de-identification obligations, heterogeneous source
              systems, dependence on the counterparty's response time, integration and change-management effort, and
              unclear public pricing. Datavant's reported rollout of less than a week for early Provider Exchange users
              is encouraging, but it is a company executive's statement and should not be generalized to all products or
              customers.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: What remains unproven
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a credible market need and several distribution wedges, but not a clean
              investment-grade market share calculation. Company and partner materials provide network and workflow
              metrics, while independent coverage provides operating examples; none discloses current Datavant revenue,
              recurring revenue, product-level gross margin, pricing, win rates, or the denominator needed to convert
              network scale into wallet share. Public category estimates also mix global and U.S. markets and combine
              software, services, data, and infrastructure. The central diligence task is therefore to reconcile
              product-level bookings or revenue with the eligible buyer universe and to separate pass-through data or
              services revenue from software-like recurring revenue. A buyer reference set should test whether the value
              proposition is budgeted as interoperability, release-of-information labor, analytics, compliance, or
              research spend, because those budget owners imply different sales cycles and competitive sets.
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is a workflow-and-trust problem
            body: >-
              Datavant's opportunity is supported by recurring fragmentation, privacy, and administrative bottlenecks;
              the strongest proof is use-case-specific rather than a single top-down market number.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
          - type: callout
            title: Network scale is not wallet share
            body: >-
              Public network, records, and partner counts demonstrate reach but do not establish revenue, retention,
              pricing power, or the portion of spend captured by Datavant.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is a job-to-be-done landscape, not a list of products with identical scope.
              Datavant's documented offer spans record retrieval and exchange, tokenization, patient-level linkage,
              privacy services, and real-world data connectivity. That places it alongside health-information exchange
              and interoperability infrastructure, specialist identity-resolution or tokenization vendors,
              real-world-data marketplaces, and outsourced release-of-information and abstraction providers. Buyers can
              also use an incumbent EHR or data-exchange stack, contract directly with data partners, build internal
              matching and governance workflows, or run a manual status quo. The independent dossier cautions that a
              capability label does not establish package depth, configuration, implementation effort, or legal fitness,
              so category overlap should not be treated as product equivalence.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs: []
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Datavant's strongest disclosed comparison points are ecosystem breadth, privacy-preserving linkage, and
              the combination of software with value-added data operations. A partner announcement describes Datavant
              Connect as supporting tokenization, data-partner discovery, and individual-level dataset connection while
              preserving patient privacy; the same announcement reports Datavant's statement that it had tokenized more
              than 100 clinical trials. Datavant's own materials describe a network spanning providers, payers, life
              sciences, government, and other stakeholders, and identify controls for privacy, consent,
              de-identification, and expert governance. These are positioning and partnership claims, not independent
              benchmark results. For alternatives, public evidence in the assigned pool is insufficient to populate
              feature-by-feature cells, pricing, match accuracy, uptime, or implementation effort without guessing.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Potential durability comes from the accumulated network of data partners, provider access, tokenization
              relationships, compliance workflows, and domain operations needed to connect records across organizations.
              The partner evidence reports access to more than 70,000 hospitals and clinics, 70 percent of the 100
              largest health systems, and 500-plus real-world data partners in the 2024 release; current official
              materials present different scale figures, including 80,000-plus hospitals and clinics, 350-plus
              real-world data partners, and one trillion records tokenized annually. The difference demonstrates that
              network metrics are time- and definition-sensitive, not a verified growth series. Customers may still
              multi-home across data exchanges, retain their own data and matching processes, or substitute direct
              integrations and services. The assigned evidence does not quantify churn, contract duration, migration
              cost, exclusive access, or competitor win rates.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Pricing, displacement risk, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not established in this pool. A software directory explicitly directs prospective buyers
              to the official website for current pricing and plans, while the independent dossier says package, depth,
              configuration, and production behavior require verification. The likely buying trade-off is therefore
              between a broad, managed connectivity and data-operations footprint and more modular point solutions or
              internal build. Datavant's own interoperability guide acknowledges that healthcare interoperability
              remains difficult and that standards compete, which supports a continuing need for integration expertise
              but also leaves room for incumbents, standards-based platforms, and lower-cost automation to narrow the
              gap. Underwriting should test realized price by workflow, services intensity, implementation duration,
              customer concentration, multi-homing, and the portability of tokens and linked datasets.
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Network plus trust is the central differentiation hypothesis
            body: >-
              Datavant combines network access, tokenization, privacy controls, and data-operations services in a way
              that could be difficult to replicate quickly. The hypothesis remains dependent on current active coverage,
              customer outcomes, and the portability of linked data.
            calloutType: strength
            claimRefs:
              - CP004
              - CP006
              - CP009
          - type: callout
            title: Public competitive proof is thin
            body: >-
              Assigned sources do not establish current realized pricing, peer performance, switching cost, retention,
              or independent outcome evidence. A broad capability catalogue should not be treated as a durable moat.
            calloutType: risk
            claimRefs:
              - CP003
              - CP012
              - CP014
          - type: callout
            title: Underwrite workflow economics, not ecosystem slogans
            body: >-
              Request a workflow-level quote and implementation plan, then test data coverage, match quality, exception
              handling, portability, multi-homing, renewal, and services intensity against the customer's alternatives.
            calloutType: recommendation
            claimRefs:
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Datavant's public surfaces describe several monetizable streams rather than a single software
              subscription: privacy-preserving connectivity and tokenization, data retrieval and release-of-information
              services, risk-adjustment coding, and value-added real-world-data and analytics workflows. The
              commercial-pharma page says Datavant supports commercial analytics, HEOR, advertising measurement,
              patient-support programs, and future drug development, while also describing Smart Request retrieval and
              annual record volume. That breadth can increase wallet share and embed the platform in regulated
              workflows, but it also means revenue quality likely varies by product, contract, utilization, and labor
              content. The public evidence supports a mechanism map, not a revenue mix or accounting conclusion: no
              assigned source gives current revenue, ARR, realized price, gross margin, renewal, or customer
              concentration. Official list or capability descriptions should therefore not be treated as realized
              revenue or unit economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is strongest in network and activity proxies. Datavant states that more than 60 million
              healthcare records move between thousands of organizations, while its network includes more than 80,000
              hospitals and clinics, 350-plus real-world-data partners, and 75% of the 100 largest health systems. Its
              commercial-pharma page separately describes 40-plus life-science customers, more than 100 brands and
              trials, more than 40,000 medical facilities, and more than 64 million annual retrievals. A March 2026
              company release adds that Datavant exchanged more than 40 million medical records in the prior year and
              codes more than 30 million records annually. These measures indicate reach and throughput, but they are
              not interchangeable: records moved, exchanged, retrieved, and coded have different scopes and periods, as
              do partner, facility, customer, brand, and trial counts. No source reports sales cycle, CAC, payback,
              bookings, win rate, or channel take rate. The diligence priority is cohort-level conversion from activity
              into contracted recurring or transaction revenue.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The operating model appears to combine technology with substantial data operations and services. Datavant
              describes record retrieval, coding, privacy expertise, data preparation, and expert-governed deployment
              alongside connectivity infrastructure. Premier's partner announcement says the platform links trial and
              real-world data, while the commercial-pharma page calls Datavant the largest record-retrieval company in
              the United States and reports more than 64 million annual retrievals. That mix can create variable
              delivery costs, labor exposure, quality-control expense, and working-capital needs that are not visible in
              a software-style margin assumption. The assigned evidence does not report cash on hand, debt, covenant
              terms, burn, runway, capex, acquisition consideration, or post-acquisition integration cost. The 2021 Ciox
              transaction announcement records a $7.0 billion transaction value and more than $700 million of revenue
              for the combined company at that historical point, but neither figure is current and neither establishes
              cash available today.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Datavant has credible evidence of scale, partner adoption, and multiple monetization surfaces, but public
              disclosure is insufficient for underwriting a current valuation or margin path. The strongest positive
              case is that connectivity, retrieval, coding, privacy, and data-activation services may reinforce one
              another and create workflow switching costs. The principal adverse case is that acquisition-led expansion
              and operational complexity can obscure organic growth and dilute margins; the assigned Built In page
              explicitly flags limited financial transparency, acquisition dependence, integration complexity, and
              inconsistent revenue figures. This source is an AI-generated company profile and is not a substitute for
              audited financial statements, but it is a useful adverse signal about the disclosure gap. A financing
              decision should remain conditional on product-level revenue and gross-margin bridges, cohort retention,
              customer concentration, cash and debt schedules, burn/runway, and evidence separating software from
              labor-heavy services.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible, economics are not
            body: >-
              Datavant reports broad network reach and high-volume data movement across multiple buyer groups, which
              supports a credible platform-scale thesis; the assigned evidence does not show how that activity converts
              into recurring revenue or margin.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: callout
            title: Capital adequacy remains a blocking diligence item
            body: >-
              No assigned source discloses current cash, burn, runway, debt, covenants, or acquisition integration
              costs. A valuation conclusion should therefore remain conditional rather than treating historical
              transaction value or network size as cash or earnings capacity.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and customer job
        blocks:
          - type: paragraph
            body: >-
              Datavant's product is best understood as infrastructure for moving and combining health data rather than
              as a single clinical application. The documented workflow starts with tokenizing data, then assessing
              metadata and overlap, connecting records at the patient level, applying privacy or expert-determination
              processes, and distributing data to authorized recipients. The AWS datasheet describes on-premise or cloud
              tokenization, comparison of dataset overlap without exchanging data, patient-level matching, and delivery
              of custom segments. This maps to a customer job of making fragmented data usable across a research, care,
              payer, or life-sciences workflow while retaining control over access. The public material is strongest on
              workflow stages and intended use; it does not establish service-level objectives, implementation times, or
              realized customer economics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture, deployment, and integration surface
        blocks:
          - type: paragraph
            body: >-
              The available technical description indicates a distributed connectivity architecture with site-specific
              irreversible tokens, matching and referential data, partner discovery, project and workflow management,
              and controlled permissions. Datavant Connect is described as deployable through a command-line interface,
              desktop UI, or a customer's cloud environment, while the AWS material describes native tokenization on
              AWS, de-identified datasets in Amazon S3, and a workflow using AWS Clean Rooms. These are concrete
              deployment and integration surfaces rather than proof of a single standardized stack. A separate partner
              account describes integration of Datavant technology into Thermo Fisher's PPD business, CorEvitas
              registries, and Evidera solutions. The evidence supports interoperability as a product design goal, but
              leaves open the exact APIs, supported cloud configurations, data residency model, observability, and
              customer-controlled rollback procedures.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE013
              - CE014
              - CE015
      - number: '5.3'
        title: Maturity, use cases, and delivery model
        blocks:
          - type: paragraph
            body: >-
              Public evidence spans mature connectivity use cases and newer AI-enabled workflow claims. The Premier
              release says the parties had worked together since September 2022, that Datavant had tokenized more than
              100 clinical trials by February 2024, and that linked trial and real-world data were being used for
              patient journeys, real-world control arms, candidate identification, and site identification. The 2026
              Datavant AI article describes a more developmental agentic platform operating across Datavant Connect and
              Aetion Evidence, with stepwise deployment, retrieval-augmented contexts, scientific evaluations, and human
              review points. A current job posting also describes pre-sales solutioning across commercial analytics,
              market access, patient services, and evidence use cases. Together these sources suggest a
              platform-plus-services operating model with broad use-case reach, but do not independently verify
              adoption, production scale, or repeatability across customers.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and implementation risks
        blocks:
          - type: paragraph
            body: >-
              Datavant's public surface emphasizes privacy, security, compliance, and governed use: the company
              describes privacy and security by design, threat modeling, and phish-resistant MFA, while its AI article
              describes human-supervised workflows, scientific evaluations, auditability, and production thresholds.
              Partner and company materials also describe HIPAA-oriented de-identification and controlled access. These
              statements establish the intended control framework, not independent certification scope, breach
              resilience, false-match rates in production, or the legal sufficiency of every use case. A historical
              partner release provides concrete implementation examples but is company/partner-issued, and the technical
              marketplace datasheet is also not an independent benchmark. Diligence should therefore test controls and
              outcomes directly, including independent SOC 2 or regulatory artifacts, token rotation and reversibility
              controls, match-quality by cohort, incident history, change management, and the labor required to
              configure and review workflows.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specific connectivity primitives
            body: >-
              Tokenization, overlap assessment, patient-level matching, controlled permissions, and delivery are
              described as concrete product primitives rather than only as a broad data-network claim.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: callout
            title: Scale claims need customer-level validation
            body: >-
              Partner and company materials cite large networks and broad pharmaceutical participation, but those
              figures do not by themselves establish active usage, retention, reliability, or software-only revenue
              quality.
            calloutType: assumption
            claimRefs:
              - CE007
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying jobs
        blocks:
          - type: paragraph
            body: >-
              Datavant addresses a multi-sided healthcare-data market rather than a single buyer profile. Its official
              pages identify providers, health plans, life sciences, data analytics, and public-sector organizations,
              while partner evidence adds data suppliers and clinical-research teams. The common buying job is secure
              movement, linkage, retrieval, or evaluation of patient-level data, but the user and payer can differ: a
              provider may operate release-of-information workflows, a health plan may consume clinical data, and a
              life-sciences team may buy access to linked datasets. Rx Almanac characterizes the commercial motion as
              custom and RFP-led, with scope depending on volumes, modules, and partner mix. That breadth supports
              several monetization surfaces, but public segment labels do not disclose customer counts, revenue mix,
              average contract value, or geographic concentration.
            claimRefs:
              - CU001
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU012
              - CU013
      - number: '6.2'
        title: Scale signals and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              Datavant's current public materials report more than 80,000 hospitals and clinics, coverage of all U.S.
              health plans directly or through health-system customers, 350-plus real-world-data partners, and
              relationships with all 20 top pharmaceutical companies. These measures show network breadth across both
              supply and demand, and a third-party product listing repeats the 350-partner and top-pharma claims. They
              are not comparable customer metrics: provider sites, payer coverage, ecosystem partners, and corporate
              relationships use different denominators and may include non-paying or indirectly reached organizations.
              Premier's February 2024 announcement supplies a dated operating marker by quoting Datavant as having
              tokenized more than 100 clinical trials, but neither source set publishes an active-account series,
              utilization cohort, or revenue conversion rate.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
      - number: '6.3'
        title: Named deployments and outcome quality
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence includes three concrete operating contexts. Veradigm described itself as an early
              adopter of Datavant Connect and said its clinical registries would become available for faster discovery
              and evaluation by life-sciences teams. Premier said its collaboration with Datavant had operated since
              September 2022 and described an active chronic-condition trial linking trial data with Premier Healthcare
              Data. Datavant's Florida Woman Care case study describes centralized intake and automated EHR retrieval,
              with higher digital fulfillment in 2025. These examples go beyond logo display because they identify
              workflows and users, yet evidence quality remains mixed: two accounts are partner-issued, one is
              company-issued, customer identities are sometimes withheld, and the sources omit measured purchase
              conversion, baseline fulfillment rates, contract value, and renewal history.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a plausible expansion mechanism but not measured expansion economics. A data
              provider can connect inventory and gain discoverability; a life-sciences buyer can evaluate data and
              deploy linkage in a trial; a provider can automate record retrieval; and adjacent datasets or workflows
              can then be added. This sequence could increase embeddedness, but it is an analytical synthesis rather
              than a reported customer journey or conversion funnel. No assigned source discloses NRR, GRR, logo churn,
              renewal rates, contract length, top-customer revenue share, or partner and channel concentration. Those
              omissions are material because a large network may coexist with shallow usage, services-heavy delivery, or
              concentrated revenue. Underwriting should therefore rely on private cohort, contract, utilization, and
              concentration data rather than interpreting reach metrics as proof of durability.
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU009
              - CU011
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption proof extends beyond logos
            body: >-
              Veradigm, Premier, and Florida Woman Care evidence identifies actual data-discovery, trial-linkage, and
              record-retrieval workflows, although the issuers do not disclose comparable commercial outcomes.
            calloutType: strength
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU011
              - CU014
          - type: callout
            title: Reach is not retention
            body: >-
              Provider, payer, partner, and pharma reach metrics lack active-account, spend, renewal, churn, and
              concentration denominators, preventing a public-data conclusion on customer durability.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and highest-consequence exposures
        blocks:
          - type: paragraph
            body: >-
              Datavant operates in a high-consequence environment because its products connect, retrieve, and tokenize
              patient-level health information. The operating model therefore creates a compound risk surface: a
              security or privacy failure can create legal exposure, remediation cost, customer trust loss, and
              regulatory scrutiny at the same time. The strongest adverse evidence in the assigned pool is the reported
              settlement involving Ciox Health, doing business as Datavant Group, after an email-account compromise that
              affected 320,702 individuals according to the HHS Office for Civil Rights breach portal. The reported
              $900,000 settlement and preliminary court approval show that exposure can become a direct legal and cash
              obligation, although the article does not establish the company's current insurance recovery, remediation
              spend, or residual control maturity. Datavant's own materials describe secure architecture, threat
              modeling, and phish-resistant MFA, but company statements are not independent validation of operating
              effectiveness. The investment implication is that trust infrastructure is a core value driver and a
              thesis-break risk, not merely a compliance feature.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
      - number: '7.2'
        title: Operational, technology, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              The platform depends on reliable retrieval, tokenization, matching, access control, and delivery across
              thousands of healthcare organizations with different systems, formats, and technical capabilities.
              Datavant's product descriptions emphasize encrypted, site-specific tokens, privacy assessments, and broad
              network coverage, while its record retrieval materials claim 60M+ records retrieved annually, 80%+ yield,
              and access workflows spanning any U.S. facility. These are company-published operating assertions, so the
              key diligence issue is whether service levels, yield, turnaround, and error rates are contractually
              measured across customer cohorts rather than presented as aggregate marketing metrics. Fragmented provider
              systems and the need for authorizations create execution and working-capital risk even if the software
              layer performs as designed. Public sources in this pool do not disclose current burn, leverage, margin,
              customer concentration, claims reserves, or the share of delivery that is labor-intensive. Those gaps
              limit confidence in downside resilience and should be monitored alongside technical reliability.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, dependency, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Datavant's ecosystem position is a strength but also creates dependency risk. The Thermo Fisher
              collaboration and the Premier Applied Sciences relationship demonstrate how the platform is embedded in
              larger research and evidence-generation workflows; they also imply reliance on partner data quality,
              consent processes, commercial execution, and continued demand from life-sciences customers. Premier
              described a clinical-trial use case in which linked real-world data supports medication history,
              follow-up, and a real-world evidence control arm, but its release also warns that forward-looking outcomes
              may differ materially from expectations. Datavant's public materials state that its network includes 350+
              real-world data partners and 80,000+ hospitals and clinics, yet the assigned evidence does not identify
              counterparty concentration, exclusivity, renewal, or economics. A practical monitoring framework should
              therefore track security incidents, regulatory findings, retrieval yield and SLA misses, partner loss,
              customer renewal and concentration, and liquidity. A thesis break would be a repeated material incident,
              loss of required privacy or regulatory status, sustained failure to meet contracted service levels, or
              evidence that partner and customer concentration makes the model unable to absorb one large relationship
              loss.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Security failure is a multi-channel loss event
            body: >-
              The reported Ciox Health / Datavant Group breach combined sensitive-data exposure, alleged control
              deficiencies, litigation, and a proposed settlement; diligence should test whether current controls and
              insurance meaningfully reduce recurrence and loss severity.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Public operating metrics are not independent assurance
            body: >-
              Network size, retrieval yield, annual record volume, and privacy-control descriptions are primarily
              company or partner statements in the assigned evidence; obtain cohort-level contracts, audits, incident
              logs, and customer references before treating them as durable unit economics.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Monitor measurable trust and concentration triggers
            body: >-
              The risk posture should be revisited if material security events recur, regulatory or privacy status
              changes, SLA performance deteriorates, or a major data or customer partner exits without substitution.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Datavant has accumulated a difficult-to-replicate network position in
              healthcare data logistics. A recent report says Neuberger Berman and KKR agreed to acquire a significant
              minority stake while New Mountain Capital retained control, and describes reach of more than 80,000
              providers, 75 of the top 100 U.S. health systems, and 350-plus ecosystem partners. Datavant's own platform
              description also reports 1,500 terabytes exchanged and one trillion records tokenized annually, although
              those are company-reported operating indicators rather than audited financial KPIs. The anti-thesis is
              equally material: Tracxn ranks Datavant second among 60 active competitors, and the public materials do
              not establish revenue, gross margin, retention, leverage, purchase price, or the economic split between
              software and services. A historical data profile reports $83 million of funding and a 2026 private equity
              event, but its displayed round fields are opaque and internally inconsistent, so it is a diligence lead
              rather than a valuation anchor. The resulting investment case is scale-positive but price-unknown.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The September 2026 minority investment is evidence of sponsor appetite, not evidence of the price paid or
              Datavant's post-money valuation. AlphaMaven's account identifies the investors and New Mountain's
              continuing control but gives no consideration, ownership percentage, preferred-security terms, liquidation
              preference, debt package, or dilution schedule. Tracxn's profile supplies a potentially useful historical
              benchmark, but the page labels Datavant a Series B company, reports $83 million of funding, and presents
              obfuscated-looking round values while also showing a 2026 PE event; these conflicts make the figures
              unsuitable for a precise multiple. The 2025 Ontellus announcement does provide strategic context for
              inorganic growth: Datavant agreed to acquire the records-retrieval company, but the release does not state
              consideration or financing structure Entry discipline should therefore require a current capitalization
              table, audited or lender-quality financials, the September transaction announcement or data room terms,
              and acquisition-adjusted cash-flow metrics before underwriting a premium.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, recommendation, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate because the public evidence supports
              operating scale but not the denominator needed for a revenue multiple or discounted-cash-flow model. The
              bull case assumes the network converts its connectivity, retrieval, privacy, and AI workflow breadth into
              durable recurring or repeatable service revenue without disproportionate labor intensity; the base case
              assumes strategic value persists but economics remain opaque; and the bear case assumes multiple
              compression, acquisition integration drag, or privacy/compliance friction prevents scale from translating
              into cash generation. Datavant and its partners describe tokenization, linkage, clinical-trial use, and
              the Ontellus combination, but these are capability and use-case signals rather than proof of customer
              retention or profitability. The appropriate current recommendation is research-more with medium confidence
              and high risk: move toward buy only after price, margins, leverage, retention, and preference terms are
              verified. No target return, hold period, exit multiple, or numerical valuation range is supportable from
              the assigned public evidence. A thesis break is an adverse financing or operating disclosure showing weak
              retention, material leverage, substantial integration losses, or privacy/regulatory remediation that
              materially reduces cash conversion.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV004
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Datavant appears institutionally financeable, but it is not publicly underwritable on valuation. The
              platform has broad reported connectivity, and Premier says its collaboration has been used to link
              clinical-trial and real-world data, while Datavant says the platform serves healthcare stakeholders across
              providers, payers, life sciences, government, and legal and insurance workflows. Those references improve
              the strategic and exit-readiness case, yet they do not answer who pays, how much is recurring, what gross
              margin is achievable, or how concentrated counterparties are. The next diligence package should request
              the current cap table and preferred rights, the September 2026 transaction valuation and ownership,
              monthly recurring or contracted revenue by product, gross margin by software and services, NRR/GRR,
              top-customer and partner concentration, net debt and liquidity, and post-Ontellus integration KPIs. Until
              those items are available, valuation stance remains unknown and a premium entry should not be assumed.
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research more: Datavant's strategic position is credible, but the public record does not establish a price
              or financial denominator for a buy decision.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat weak retention, high leverage, material integration losses, or privacy and regulatory remediation as
              thesis-breaking until the resulting cash-flow impact is quantified.
            calloutType: risk
            claimRefs:
              - CV010
              - CV013
              - CV014
