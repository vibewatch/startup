        - Trial adoption, data quality, or partner strategy changes limit realized outcomes
        - High
        - Tokenization, linkage platform, and multiple described use cases
        - Medium
      - - Healthcare record retrieval
        - Hospitals, clinics, health systems, and requesters
        - Source records and retrieval execution
        - 80,000+ sites and 120k legal/insurance requesters claimed; concentration and SLA mix unknown
        - Access restrictions, authorization friction, outages, or labor bottlenecks delay delivery
        - High
        - Badged access, scaled outreach, SLAs, and end-to-end workflow
        - High
    notes: >-
      The register distinguishes ecosystem breadth from counterparty concentration. Public network counts do not
      establish contract durability, exclusivity, customer concentration, or substitutability.
