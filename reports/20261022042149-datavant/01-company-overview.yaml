company:
  name: Datavant
chapter:
  number: 1
  title: Company Overview
  summary: Datavant presents itself as a healthcare data-collaboration and logistics platform combining privacy-preserving linkage, data exchange, and workflow products. Public evidence supports substantial network and activity claims, but current financial performance, ownership economics, and a complete leadership/governance roster remain undisclosed in the retained sources.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: Datavant describes its mission as making health data secure, accessible, and actionable, and its product surfaces position the company as infrastructure for moving, protecting, connecting, and activating patient-level data. The product scope spans privacy-preserving tokenization, data linkage, medical-record retrieval, real-world evidence, and workflow support for providers, payers, life sciences, legal and insurance organizations, and government users. An independent profile similarly describes a healthcare data collaboration platform, while a third-party product profile describes deployment through on-premise, command-line, desktop, or cloud environments. This is a broad platform identity rather than a single-application software profile, and the mix of technology and value-added services should be diligence-tested.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: scale-and-commercial-footprint
    title: Scale and commercial footprint
    body: The retained materials support a meaningful operating footprint, but the figures are company or partner descriptions rather than audited financial disclosures. Datavant says its network includes more than 80,000 hospitals and clinics, more than 75% of the largest 100 health systems, 100% of U.S. payers, and 350-plus real-world data partners; a 2026 release also says more than 60 million records move between thousands of organizations. A company page states that 1,500 terabytes are exchanged and one trillion records are tokenized annually. These are indicators of network reach and activity, not revenue, ARR, margin, customer retention, or cash generation. The public record therefore supports scale as an operating thesis while leaving monetization and concentration unverified.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: leadership-partnerships-and-dependency
    title: Leadership, partnerships, and key-person dependence
    body: The retained sources identify operating leaders in product and growth roles and document a multi-year partner relationship, but they do not provide a complete founder, executive, board, or ownership roster. Andrea Kowalski is identified as Senior Vice President of Provider Products and Steve Mallinak as Chief Growth Officer for Provider in the 2026 Provider Exchange announcement; Tal Rosenberg is identified as President and GM for Life Sciences, Ecosystem and Public Sector in the 2024 Premier release. Premier says its collaboration with Datavant began in September 2022, and the parties expanded it in 2024 around trial tokenization and real-world evidence. This supports functional coverage and ecosystem execution, while leaving key-person dependency and governance diligence open.
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-evidence-gaps
    title: Milestones and evidence gaps
    body: The milestone record shows a progression from trial-tokenization activity to broader ecosystem and provider workflow products. Premier's release says Datavant launched its trial-tokenization offering in 2019 and had tokenized more than 100 clinical trials by February 2024. The same release documents the September 2022 start of the PAS collaboration, while the 2026 Provider Exchange announcement marks a current expansion into provider-driven retrieval. The evidence does not establish founding date, original founders, financing chronology, current valuation, debt, revenue, headcount, or the economics of any sponsor-backed ownership. A diligence process should obtain cap-table and financing documents, current management and board materials, product-line revenue and margin data, and customer concentration metrics before underwriting.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
