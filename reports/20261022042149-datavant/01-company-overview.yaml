    claimRefs: [CO010, CO012, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Network scale is the clearest public strength
    body: The retained materials consistently describe broad healthcare connectivity, large provider reach, and recurring real-world-data use cases.
    claimRefs: [CO005, CO006, CO007, CO008]
  - calloutType: risk
    title: Economics and control are not publicly underwritten
    body: Current revenue, margins, valuation, financing, headcount, founders, and board composition remain open diligence items in the assigned evidence.
    claimRefs: [CO016]
