runDate: 2026-10-22
company:
  name: Datavant
chapter:
  number: 8
  title: Valuation
  summary: Datavant has unusually broad health-data connectivity and renewed institutional sponsorship, but the public record does not disclose a reliable current price, revenue base, margins, or transaction terms. The evidence therefore supports research-more rather than a price-insensitive buy call.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that Datavant has accumulated a difficult-to-replicate
      network position in healthcare data logistics. A recent report says Neuberger
      Berman and KKR agreed to acquire a significant minority stake while New
      Mountain Capital retained control, and describes reach of more than 80,000
      providers, 75 of the top 100 U.S. health systems, and 350-plus ecosystem
      partners. Datavant's own platform description also
      reports 1,500 terabytes exchanged and one trillion records tokenized annually,
      although those are company-reported operating indicators rather than audited
      financial KPIs. The anti-thesis is equally material: Tracxn ranks Datavant
      second among 60 active competitors, and the
      public materials do not establish revenue, gross margin, retention, leverage,
      purchase price, or the economic split between software and services. A
      historical data profile reports $83 million of funding and a 2026 private
      equity event, but its displayed round fields are opaque and internally
      inconsistent, so it is a diligence lead rather than a valuation anchor. The
      resulting investment case is scale-positive but
      price-unknown.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV015]
    tableRefs: [TV001, TV002]
  - id: price-and-financing-context
    title: Financing context and entry discipline
    body: >-
      The September 2026 minority investment is evidence of sponsor appetite, not
      evidence of the price paid or Datavant's post-money valuation. AlphaMaven's
      account identifies the investors and New Mountain's continuing control but
      gives no consideration, ownership percentage, preferred-security terms,
      liquidation preference, debt package, or dilution schedule.
      Tracxn's profile supplies a potentially useful historical benchmark, but the
      page labels Datavant a Series B company, reports $83 million of funding, and
      presents obfuscated-looking round values while also showing a 2026 PE event;
      these conflicts make the figures unsuitable for a precise multiple. The 2025
      Ontellus announcement does provide strategic
      context for inorganic growth: Datavant agreed to acquire the records-retrieval
      company, but the release does not state consideration or financing structure
      Entry discipline should therefore require a current capitalization
      table, audited or lender-quality financials, the September transaction
      announcement or data room terms, and acquisition-adjusted cash-flow metrics
      before underwriting a premium.
    claimRefs: [CV001, CV004, CV005, CV008, CV009, CV010]
  - id: scenarios-and-recommendation
    title: Scenarios, recommendation, and thesis-break triggers
    body: >-
      A scenario framework is more defensible than a point estimate because the
      public evidence supports operating scale but not the denominator needed for
      a revenue multiple or discounted-cash-flow model. The bull case assumes the
      network converts its connectivity, retrieval, privacy, and AI workflow
      breadth into durable recurring or repeatable service revenue without
      disproportionate labor intensity; the base case assumes strategic value
      persists but economics remain opaque; and the bear case assumes multiple
      compression, acquisition integration drag, or privacy/compliance friction
      prevents scale from translating into cash generation. Datavant and its
      partners describe tokenization, linkage, clinical-trial use, and the
      Ontellus combination, but these are capability and use-case signals rather
      than proof of customer retention or profitability.
      The appropriate current recommendation is research-more with medium
      confidence and high risk: move toward buy only after price, margins,
      leverage, retention, and preference terms are verified. No target return,
      hold period, exit multiple, or numerical valuation range is supportable from
      the assigned public evidence. A thesis break is
      an adverse financing or operating disclosure showing weak retention,
      material leverage, substantial integration losses, or privacy/regulatory
      remediation that materially reduces cash conversion.
    claimRefs: [CV006, CV007, CV010, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV004]
    figureRefs: [FV001]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Datavant appears institutionally financeable, but it is not publicly
      underwritable on valuation. The platform has broad reported connectivity,
      and Premier says its collaboration has been used to link clinical-trial and
      real-world data, while Datavant says the platform serves healthcare
      stakeholders across providers, payers, life sciences, government, and legal
      and insurance workflows. Those references improve
      the strategic and exit-readiness case, yet they do not answer who pays,
      how much is recurring, what gross margin is achievable, or how concentrated
      counterparties are. The next diligence package should request the current
      cap table and preferred rights, the September 2026 transaction valuation and
      ownership, monthly recurring or contracted revenue by product, gross margin
      by software and services, NRR/GRR, top-customer and partner concentration,
      net debt and liquidity, and post-Ontellus integration KPIs. Until those
      items are available, valuation stance remains unknown and a premium entry
      should not be assumed.
    claimRefs: [CV001, CV006, CV010, CV011, CV012, CV014]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy without current price and economics]
      - [Confidence, medium, Strategic evidence is strong but financial evidence is thin]
      - [Risk rating, high, Opaque private-company economics and integration/privacy exposure]
      - [Valuation stance, unknown, No reliable current transaction price or earnings denominator]
      - [Decision implication, Require data-room diligence, Advance only if price and cash conversion clear the evidence gap]
    notes: "Assessment synthesizes the retained public sources; no current Datavant transaction price or audited financial KPI set was disclosed in the assigned evidence."
    claimRefs: [CV001, CV004, CV005, CV008, CV010]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Network scale and strategic relevance, "80,000+ providers; 350+ partners; institutional minority investment", "Evidence that scale produces durable high-margin revenue"]
      - [Privacy-preserving infrastructure can be embedded in workflows, "Tokenization, linkage, retrieval, and secure exchange described by company and partners", "Independent retention, usage, and unit-economics data"]
      - [Sponsor validation, "Neuberger Berman and KKR reported as new minority investors; New Mountain retains control", "Transaction terms, price, preferences, and governance rights"]
      - [Competitive set, "Tracxn ranks Datavant second among 60 active competitors", "Comparable revenue, growth, margin, and transaction multiples on like-for-like definitions"]
      - [Opaque economics are the central anti-thesis, "Revenue, margin, leverage, and consideration are not disclosed; historical profile has inconsistent fields", "Audited financials and acquisition-adjusted cash-flow bridge"]
    notes: "The table separates strategic evidence from the missing valuation denominators; company and partner descriptions are not independent financial verification."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV010, CV011, CV015]
  - id: TV004
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Network scale converts into durable recurring or repeatable revenue; software leverage improves after integration", "Premium entry can be justified only by verified growth, retention, and margin", "Privacy incident, execution complexity, customer concentration", "Possible but unverified"]
      - [Base, "Strategic network remains valuable while revenue mix and cash conversion stay opaque", "Research-more; pay only after data-room evidence establishes a defensible multiple", "Services intensity, integration drag, preference overhang", "Most supportable from current evidence"]
      - [Bear, "Multiple compression or weak economics reveal scale without sufficient cash generation", "Avoid or require a material price reset and downside protection", "Leverage, down-round risk, regulatory remediation, failed commercialization", "Plausible downside not quantifiable"]
    notes: "These are qualitative scenarios, not numerical forecasts; probability signals reflect evidence sufficiency rather than estimated probabilities."
    claimRefs: [CV004, CV005, CV008, CV009, CV010, CV011, CV012, CV013, CV014]

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Reported scale and strategic sponsorship support interest, but undisclosed price and economics keep the recommendation at research-more.
    data:
