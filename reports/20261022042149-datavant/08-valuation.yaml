        - id: strategic
          label: Institutional and workflow validation
        - id: terms
          label: Financing terms not disclosed
        - id: missing
          label: Price and cash-flow evidence missing
        - id: diligence
          label: Data-room diligence required
        - id: decision
          label: Research-more / unknown valuation
      edges:
        - [scale, strategic]
        - [strategic, terms]
        - [terms, missing]
        - [missing, diligence]
        - [diligence, decision]
    claimRefs: [CV001, CV002, CV006, CV007, CV010, CV011, CV014, CV016]

callouts:
  - calloutType: recommendation
    title: Recommendation
    body: "Research more: Datavant's strategic position is credible, but the public record does not establish a price or financial denominator for a buy decision."
    claimRefs: [CV001, CV004, CV005, CV008, CV016]
  - calloutType: risk
    title: Thesis-break trigger
    body: "Treat weak retention, high leverage, material integration losses, or privacy and regulatory remediation as thesis-breaking until the resulting cash-flow impact is quantified."
    claimRefs: [CV010, CV013, CV014]

