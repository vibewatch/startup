evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Current GAAP revenue, ARR, gross margin, burn, and cash-runway metrics after the Series F.
    whyItMatters: >-
      Without current financial quality metrics, the public funding story cannot be translated into durable unit
      economics or underwriting confidence.
    diligencePath: Request current board materials or investor updates showing revenue mix, ARR, margins, burn, and runway.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled funding ledger that explains why one third-party directory reports $636.2M while company and tracker
      materials report $550M.
    whyItMatters: >-
      Lifetime capital raised is a cover metric and affects dilution, insider support interpretation, and late-stage
      financing context.
    diligencePath: >-
      Reconcile primary closing announcements against cap-table history, secondaries, convertibles, and any non-equity
      facilities.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance-control
    missingEvidence: Full board composition, voting control, investor rights, liquidation preferences, and debt or credit terms.
    whyItMatters: >-
      Founder-led visibility alone does not show how much governance leverage new late-stage investors gained or how
      downside is structured.
    diligencePath: Obtain the latest charter, investor-rights summary, board roster, and any debt covenant package.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: scale-quality
    missingEvidence: >-
      Independent breakout of customer count, revenue concentration, retention, product attach, and an audited employee
      count.
    whyItMatters: >-
      Scale claims are directionally positive, but the quality and durability of that scale remain hard to judge from
      company and directory snapshots alone.
    diligencePath: Request cohort, retention, customer-mix, and HR snapshot data aligned to the latest financing date.
    relatedQuestionRefs:
      - QO004
      - QO008
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market model for the exact cross-stack observability / security-analytics / AI-observability
      category Coralogix is targeting, including TAM, SAM, SOM, and growth rates.
    whyItMatters: >-
      Without an external market baseline, the chapter can only size Coralogix through adoption and pricing proxies,
      which weakens valuation confidence.
    diligencePath: >-
      Obtain recent analyst-market-data or public-company category disclosures that isolate observability, security
      analytics, and AI-observability budgets with methodology notes.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix
    missingEvidence: >-
      Segment mix, module attach rates, and expansion patterns that explain how Coralogix moved from 2,000+ enterprise
      customers in 2025 to 5,000+ total customers in 2026.
    whyItMatters: >-
      Buyer-by-buyer adoption determines whether Coralogix is widening into higher-value security and AI budgets or
      simply adding smaller core-observability accounts.
    diligencePath: >-
      Request customer-count segmentation by product, ACV band, geography, and top expansion drivers from management or
      investor materials.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Signed customer quotes showing realized discounts, annual commits, overage mechanics, and storage / egress
      pass-through for Coralogix and the named incumbents.
    whyItMatters: Public list pricing and editorial comparisons do not show the actual commercial delta in enterprise deals.
    diligencePath: >-
      Request current order forms or redacted pricing schedules from Coralogix and at least two head-to-head incumbent
      bake-offs.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-barriers
    missingEvidence: >-
      Win-loss data, migration timelines, multi-homing prevalence, and churn reasons versus Datadog, New Relic,
      Dynatrace, and Grafana-style stacks.
    whyItMatters: >-
      Without direct switching evidence, the moat case remains an architectural thesis rather than a proven lock-in
      dynamic.
    diligencePath: >-
      Ask for recent competitive displacement decks, customer references that migrated from named rivals, and
      account-level churn / save analysis.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: expansion-durability
    missingEvidence: Module attach rates and usage depth for AI Center, SIEM / CSPM, MCP, and CLI within the installed base.
    whyItMatters: >-
      Product breadth only becomes a durable competitive moat if customers actually adopt the newer layers rather than
      buying only core observability.
    diligencePath: >-
      Request module-level ARR mix, attach-rate cohorts, and reference customers using at least two non-core modules in
      production.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-arr
    missingEvidence: Current ARR or GAAP revenue, plus a split between recurring platform revenue, services, and AI/security add-ons.
    whyItMatters: >-
      Without current revenue composition, it is impossible to judge revenue quality, seasonality, or how much growth
      comes from durable recurring spend.
    diligencePath: Request the latest board deck or audited management accounts with product-line revenue and services breakout.
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-burn
    missingEvidence: >-
      Gross margin, hosting cost, services delivery cost, operating burn, free cash flow, and months of runway after the
      Series F.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from the funding headline alone because public sources do not show whether
      growth is efficient or heavily subsidized.
    diligencePath: >-
      Request cash balance, monthly burn, gross margin bridge, and a 12- to 24-month operating plan with scenario
      sensitivities.
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo churn, top-customer concentration, average contract duration, and renewal profile.
    whyItMatters: >-
      The company appears to have meaningful enterprise depth, but concentration and retention are decisive for
      underwriting revenue durability.
    diligencePath: Request cohort retention tables, top-customer revenue concentration, and contract waterfall data by segment.
  - type: missing-source
    severity: material
    topic: series-f-terms
    missingEvidence: >-
      Series F liquidation preferences, ownership changes, board/control terms, and any debt or structured-finance
      obligations.
    whyItMatters: >-
      A large late-stage round can materially change downside protection, dilution, and exit economics even when topline
      momentum is strong.
    diligencePath: Request the financing term sheet, updated cap table, and any side letters or debt documents.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: realized-pricing-and-module-attach
    missingEvidence: >-
      Published or customer-verified realized pricing, discounting ranges, and attach rates for AI observability,
      security, and other add-on workflows.
    whyItMatters: >-
      List-price positioning and product breadth do not reveal whether new modules are meaningfully monetized or simply
      bundled into platform expansion.
    diligencePath: Request recent order forms, packaging policy, and module attach data for enterprise cohorts.
    relatedQuestionRefs:
      - QI002
      - QI008
  - type: missing-source
    severity: material
    topic: trust-proof-gap
    missingEvidence: >-
      Independent security/compliance documentation that explains tenancy model, privacy boundaries, control
      architecture, and uptime commitments for AI Center, Olly, and MCP/CLI surfaces.
    whyItMatters: >-
      Without third-party proof, product trust still depends mainly on vendor description rather than verified operating
      evidence.
    diligencePath: >-
      Request current trust-center materials, architecture review docs, recent incident summaries, and
      regulated-customer references willing to discuss control design.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public repository, package-registry history, release feed, practitioner forum, or equivalent developer-community
      proxy tied to Coralogix product usage.
    whyItMatters: >-
      Without a developer signal, public evidence cannot independently test release cadence, integration ergonomics, or
      practitioner adoption.
    diligencePath: >-
      Request the official public repositories and SDK/package names, then review release cadence, contributors,
      downloads, and practitioner discussions.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: ai-center-adoption
    missingEvidence: >-
      Named production references or case studies showing AI Center, AI-SPM, and evaluator modules running at scale
      rather than broad platform logos alone.
    whyItMatters: >-
      Attach-rate and live-deployment proof determine whether the newer AI modules are durable monetization or mostly
      roadmap narrative.
    diligencePath: >-
      Request module attach rates, top use cases, and three live customer references for AI Center or AI-SPM by
      vertical.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: private-evidence-only
