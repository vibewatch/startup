  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-mix-and-arr
      missingEvidence: Current ARR or GAAP revenue, plus a split between recurring platform revenue, services, and AI/security add-ons.
      whyItMatters: Without current revenue composition, it is impossible to judge revenue quality, seasonality, or how much growth comes from durable recurring spend.
      diligencePath: Request the latest board deck or audited management accounts with product-line revenue and services breakout.
    - type: private-evidence-only
      severity: blocking
      topic: margin-and-burn
      missingEvidence: Gross margin, hosting cost, services delivery cost, operating burn, free cash flow, and months of runway after the Series F.
      whyItMatters: Capital adequacy cannot be underwritten from the funding headline alone because public sources do not show whether growth is efficient or heavily subsidized.
      diligencePath: Request cash balance, monthly burn, gross margin bridge, and a 12- to 24-month operating plan with scenario sensitivities.
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: NRR, GRR, logo churn, top-customer concentration, average contract duration, and renewal profile.
      whyItMatters: The company appears to have meaningful enterprise depth, but concentration and retention are decisive for underwriting revenue durability.
      diligencePath: Request cohort retention tables, top-customer revenue concentration, and contract waterfall data by segment.
    - type: missing-source
      severity: material
      topic: series-f-terms
      missingEvidence: Series F liquidation preferences, ownership changes, board/control terms, and any debt or structured-finance obligations.
      whyItMatters: A large late-stage round can materially change downside protection, dilution, and exit economics even when topline momentum is strong.
      diligencePath: Request the financing term sheet, updated cap table, and any side letters or debt documents.
      relatedQuestionRefs:
        - QI009
    - type: missing-source
      severity: material
      topic: realized-pricing-and-module-attach
      missingEvidence: Published or customer-verified realized pricing, discounting ranges, and attach rates for AI observability, security, and other add-on workflows.
      whyItMatters: List-price positioning and product breadth do not reveal whether new modules are meaningfully monetized or simply bundled into platform expansion.
      diligencePath: Request recent order forms, packaging policy, and module attach data for enterprise cohorts.
