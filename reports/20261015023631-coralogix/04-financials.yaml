schemaVersion: report-v2
artifact: financials
slug: coralogix
runDate: '2026-10-15'
company:
  name: Coralogix
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a scaled enterprise observability business with more than 5,000 customers, annualized revenue above $100 million before June 2026, and a freshly raised $200 million Series F. The same record is still too thin on current revenue, margins, burn, retention, realized pricing, and round economics to underwrite revenue quality or capital efficiency with confidence.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: The public record shows a real enterprise software business, but not a clean revenue model disclosure. TechCrunch reported that Coralogix grew revenue by more than 60% over the prior year, had about 30 customers spending more than $1 million annually, and had already surpassed $100 million in annualized revenue more than a year before June 2026, while declining to disclose the current figure. Official June 2026 materials add that the company serves more than 5,000 customers worldwide and processes petabytes of production data daily across eight regions. That supports a usage-heavy enterprise observability model with meaningful large-account concentration at the top end, but the public sources still do not split recurring platform spend from services, security add-ons, or newer AI products.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI010
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: monetization-and-cost-structure
    title: Monetization signals and cost structure proxies
    body: 'Coralogix''s own materials consistently position monetization around full-fidelity telemetry ingestion, streaming analytics, open formats, and customer-owned storage rather than seat-based pricing. The homepage markets a 14-day all-features trial and a promise to let customers monitor four times more data at lower cost, while TAMradar describes complete ingestion in the customer''s own cloud with unlimited users and sources. Those signals imply that revenue likely scales with data volume, retained history, and enterprise workflow breadth, with AI investigation and security modules as expansion vectors. What is missing is the part that matters for underwriting: no public price card, realized discounting, gross margin, CAC, payback, or disclosed services mix appears in the retained sources, so the unit-economics story remains directional rather than auditable.'
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: The Series F materially reduces near-term financing pressure, but it does not eliminate diligence risk. TechCrunch said management did not raise because it needed immediate runway, and quoted the company as not expecting to raise additional capital while working toward profitability over the next few years. Official sources say the new money is earmarked for AI-native observability, telemetry infrastructure, and global enterprise expansion. That supports a forward plan built around offensive investment rather than distress financing. Still, the assigned public record does not disclose cash on hand, debt obligations, burn, free cash flow, retention, churn, contract duration, customer concentration, or the Series F economic terms. The financial verdict is therefore scale with momentum, but incomplete evidence on revenue quality, margin path, and capital efficiency.
    claimRefs:
      - CI001
      - CI002
      - CI011
      - CI012
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Public evidence
      - Current value/status
      - Revenue quality
      - Diligence ask
    rows:
      - - Core observability platform
        - Recurring enterprise spend tied to telemetry ingest, analytics, and retention
        - Official sources emphasize full-fidelity ingestion, streaming analytics, and customer-owned storage
        - Commercially active; >5,000 customers and >$100m annualized revenue before June 2026
        - Real traction is visible, but recurring vs services mix is undisclosed
        - Break out recurring software, services, and security/AI module revenue
      - - Large-enterprise expansion
        - Higher contract values from complex enterprise deployments
        - TechCrunch says Coralogix has about 30 customers spending >$1m annually
        - Enterprise upmarket motion is evident; exact concentration is not
        - Supports revenue depth, but concentration risk is unknown
        - Provide top-10 customer concentration and contract-duration data
      - - AI-native workflows (Olly, MCP, CLI)
        - Expansion of platform usage through agentic investigation and automation
        - Official June 2026 materials earmark Series F proceeds for AI-native observability
        - Product expansion is active; separate revenue contribution is undisclosed
        - Likely expansion vector, but attach rate is opaque
        - Disclose module attach, upsell rate, and AI-specific ACV uplift
      - - AI Center / AI security
        - Potential add-on spend for evaluation, AI-SPM, and cost tracking
        - March 2025 launch added evaluation, AI security posture management, and token-usage visibility
        - Feature set is public; monetization terms and revenue contribution are not
        - Commercial promise is visible, but not yet underwritten publicly
        - Disclose pricing, attach rates, and security-module gross margin
    notes: Public sources identify product surfaces and traction, but they do not disclose revenue mix, realized pricing, or module-level contribution.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI009
      - CI012
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Monetization signal
      - Public signal
      - List vs realized pricing
      - Implication
      - Source
    rows:
      - - Free trial
        - Homepage offers 14 days, all features, and no credit card required
        - List price absent; trial only signals low-friction evaluation
        - Suggests self-serve entry at the top of funnel, not public monetization depth
        - Homepage
      - - Cost-positioning claim
        - Homepage says teams can monitor 4x more for a lower cost
        - No numeric benchmark, rate card, or realized price disclosed
        - Cost advantage is central to the pitch, but cannot be quantified from public data
        - Homepage
      - - Customer-owned storage
        - Official and third-party sources describe open formats and data retained in the customer's own cloud
        - Economics likely depend on ingest/analytics rather than vendor-hosted storage markups
        - Supports a usage-and-scale story, but not a disclosed unit price
        - Coralogix press release; TAMradar
      - - Unlimited users and sources
        - TAMradar says the architecture enables unlimited users and sources
        - Realized commercial packaging is unknown
        - Points away from seat-based monetization and toward data/workflow monetization
        - TAMradar
    notes: This table records monetization signals, not a published price card; list and realized pricing remain undisclosed in the assigned source pool.
    claimRefs:
      - CI006
      - CI007
      - CI008
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value/status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annualized revenue
        - Surpassed $100m more than a year before June 2026; current figure undisclosed
        - Medium
        - Confirms meaningful scale, but not current run rate or ARR quality
        - Provide current ARR/GAAP revenue and revenue split by product and services
      - - Revenue growth
        - '>60% growth over the prior year per TechCrunch'
        - Medium
        - Shows momentum but not durability or quarter-to-quarter volatility
        - Provide quarterly revenue bridge and cohort growth
      - - Large-account base
        - About 30 customers spending >$1m annually
        - Medium
        - Useful enterprise-sales proxy, but concentration and renewal exposure remain unknown
        - Provide customer concentration, renewal rates, and average contract duration
      - - Customer count
        - '>5,000 customers worldwide in June 2026; >2,000 enterprise customers in March 2025'
        - Medium
        - Shows broad adoption, but customer definition and mix are unclear
        - Define customer/account methodology and segment mix
      - - Capital position
        - $200m Series F raised in June 2026; management says no immediate need for more capital
        - Medium
        - Supports runway narrative, but without cash/burn data it is not a model
        - Provide cash balance, debt, burn, runway, and covenant disclosures
      - - Gross margin / CAC / retention
        - Not publicly disclosed in assigned sources
        - Low
        - Core underwriting metrics are missing, so revenue quality and efficiency cannot be verified
        - Provide gross margin, CAC, payback, NRR, GRR, and churn by segment
    notes: Null-equivalent rows reflect absent public disclosure, not zero values; the diligence asks are the minimum dataset needed to underwrite efficiency.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI010
      - CI011
      - CI013
      - CI014
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public sources support a telemetry-driven enterprise revenue model with AI and security expansion, but not a disclosed price card or gross-profit bridge.
    data:
      nodes:
        - id: telemetry
          label: AI and cloud telemetry
          detail: High-volume logs, metrics, traces, and security events create the raw demand layer.
        - id: ingest
          label: Full-fidelity ingest
          detail: Coralogix pitches complete-data ingestion, streaming analytics, and open formats.
        - id: storage
          label: Customer-owned storage
          detail: Data remains in the customer's cloud with long retention and lower-cost positioning.
        - id: workflows
          label: AI and security workflows
          detail: Olly, MCP, CLI, AI Center, and AI-SPM widen the product surface and potential module spend.
        - id: enterprise
          label: Enterprise adoption
          detail: Public claims point to >5,000 customers worldwide and about 30 accounts spending >$1m annually.
        - id: revenue
          label: Revenue and margin output
          detail: Annualized revenue exceeded $100m before June 2026, but current revenue, margin, and burn are undisclosed.
      edges:
        - from: telemetry
          to: ingest
          label: More AI telemetry increases ingest demand
        - from: ingest
          to: storage
          label: Open-format storage is the cost and retention lever
        - from: storage
          to: workflows
          label: Retained data enables AI investigation and security modules
        - from: workflows
          to: enterprise
          label: Broader workflows support deeper enterprise expansion
        - from: enterprise
          to: revenue
          label: Usage and expansion convert into recurring platform spend
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI012
callouts:
  - calloutType: insight
    title: Scale is real, but mix is hidden
    body: More than 5,000 customers, about 30 seven-figure accounts, and annualized revenue above $100 million before June 2026 support real enterprise traction. What the public record still does not show is how much of that scale is recurring platform revenue versus services, security add-ons, or newer AI products.
    claimRefs:
      - CI003
      - CI004
      - CI005
  - calloutType: risk
    title: Capital sufficiency is still an assertion, not a model
    body: Management says the Series F was not raised for immediate runway and that Coralogix does not expect to raise more capital soon, but public sources do not disclose cash, burn, free cash flow, debt, retention, or round economics. That leaves capital efficiency and next-round risk unresolved despite the large financing.
    claimRefs:
      - CI011
      - CI013
      - CI014
