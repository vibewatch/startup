schemaVersion: report-v2
artifact: company-overview
slug: coralogix
runDate: 2026-10-15
company:
  name: Coralogix
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Coralogix enters late 2026 as a founder-led observability platform pushing an
    AI-native positioning, backed by a 2026 $200M Series F and public scale claims
    around customers, telemetry volume, and global reach. The assigned evidence
    pool supports real momentum on product breadth and financing, but open-source
    disclosure still leaves revenue quality, board/control mechanics, and even the
    exact total funding figure partially unresolved.
sections:
  - id: identity-platform-footprint
    title: Identity, platform, and footprint
    body: >-
      Coralogix presents itself as an AI-native observability platform spanning
      systems, security, and AI workloads, with the company homepage and July 2026
      Gartner announcement both emphasizing one data layer, open formats, and
      machine-oriented investigation workflows rather than dashboard-only usage.
      The open-source record consistently places the company's founding in 2014 and
      its current commercial center in Boston, while third-party profiles also show
      operating footprint across Israel, Europe, India, and the US. That makes the
      base identity reusable for later chapters: late-stage private company,
      founder-led product narrative, and a platform story built around customer-owned
      storage and AI-assisted operations rather than point monitoring tools.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-governance-and-capital
    title: Leadership, governance, and capital structure
    body: >-
      Public leadership visibility is strongest around co-founders Ariel Assaraf
      and Yoni Farin, who appear repeatedly as the CEO and CTO faces of the
      business across official and third-party sources. Open-source coverage is much
      thinner on governance mechanics: the assigned pool does not provide a full
      board-seat map, ownership stack, preference structure, or debt terms, so
      later underwriting should treat control and downside protection as diligence
      items rather than known facts. Funding history is clearer. Tracxn records a
      2022 Series D, StartupFortune and Tracxn align on a 2025 Series E, and the
      company plus trackers align on a 2026 $200M Series F. The main numerical
      inconsistency is total capital raised, where one third-party directory reports
      a meaningfully higher lifetime figure than the company's own 2026 disclosure.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO010, CO011, CO012, CO013]
    tableRefs: [TO002, TO003]
  - id: scale-signals-milestones-and-open-questions
    title: Scale signals, milestones, and open questions
    body: >-
      The assigned sources paint a company with real category momentum but still
      limited hard operating disclosure. Official June-July 2026 materials claim
      more than 5,000 customers, petabytes of production data processed daily, and
      coverage across eight regions including GovCloud, while third-party summaries
      cluster around a roughly $1.6B valuation and a headcount band of about
      550-600 employees. The timeline also shows consistent activity: financing in
      2022, 2025, and 2026; an AI-observability acquisition in late 2024; Olly's
      general-availability milestone in late 2025; and Gartner recognition in 2026.
      The caution is that StartupFortune still frames the company as needing to
      prove its AI-native differentiation against incumbents, and the pool does not
      resolve revenue, retention, or profitability quality with public evidence.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
