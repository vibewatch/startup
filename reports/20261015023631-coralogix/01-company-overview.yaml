callouts:
  - calloutType: strength
    title: Funding momentum and category relevance are both visible
    body: >-
      The public record supports a credible late-stage momentum story: Coralogix
      moved from a 2022 Series D to a 2025 Series E and a 2026 $200M Series F,
      while also using 2025-2026 product and analyst-recognition milestones to
      reinforce its AI-native observability thesis.
    claimRefs: [CO006, CO008, CO009, CO010, CO015]
  - calloutType: risk
    title: Disclosure quality still lags the narrative
    body: >-
      Open sources do not resolve current revenue, ARR, retention, margins,
      governance rights, or exact lifetime capital raised. That means the public
      company story is stronger than the public underwriting package.
    claimRefs: [CO005, CO012, CO013]
