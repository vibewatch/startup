    title: Snapshot KPI table
    columns:
      - Metric
      - Value or status
      - Date or period
      - Confidence
      - Gap or caveat
    rows:
      - ["Founded", "2014", "Historical", "Medium", "Open sources corroborate the year, but no incorporation filing was retained in this pool."]
      - ["Current stage", "Late private / Series F", "2026", "High", "Based on the latest documented financing round, not a company self-label."]
      - ["Headquarters and footprint", "Boston HQ plus offices in San Mateo, Ramat Gan, London, Frankfurt, and Gurugram", "Current open-source snapshot", "Medium", "No official facilities page was retained in this pool."]
      - ["Latest valuation", "$1.6B", "Jun 2026", "Medium", "Public figure comes from third-party trackers and reporting, not a disclosed term sheet."]
      - ["Total raised", "$550M official; $636.2M in one directory", "Jun 2026", "Low", "Lifetime capital total is not fully reconciled across sources."]
      - ["Latest round", "$200M Series F", "2026-06-03", "High", "Round economics, ownership changes, and preference terms are not public here."]
      - ["Customer count", ">5,000 customers worldwide", "Jun-Jul 2026", "Medium", "Company-claimed; no independent customer-count audit in the assigned pool."]
      - ["Headcount", "550-600 employees", "2026", "Medium", "Third-party range only; no audited or official employee disclosure was retained."]
      - ["Revenue / ARR", null, "2026", "Low", "Assigned sources do not support current revenue, ARR, margin, or burn metrics."]
    notes: >-
      Mixes company claims with third-party trackers; null means the assigned pool
      did not support a public number with enough specificity to retain it.
    claimRefs: [CO002, CO003, CO010, CO012, CO013, CO014, CO015]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Verified role
      - Evidence base
      - Functional coverage
      - Dependency or diligence note
    rows:
      - ["Ariel Assaraf", "CEO and co-founder", "Official Gartner announcement plus third-party profiles", "Primary external product/category spokesperson", "Key-person concentration is high because founder visibility dominates the public record."]
      - ["Yoni Farin", "CTO and co-founder", "Third-party profiles", "Technical co-founder tied to architecture continuity", "Open sources do not provide a deep succession bench below the founders."]
      - ["Broader governance", "Partially visible only", "Directories and tracker snippets rather than full board disclosure", "Some executive names are public, but board/control mechanics are not", "Needs direct diligence on board seats, control rights, and investor governance."]
    notes: >-
      Founder roles are much better corroborated than broader governance; this is a
      partial public-leadership view rather than a complete org or board map.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the leadership and governance elements that recur in the
        assigned public sources, not the full executive roster or board.
    claimRefs: [CO004, CO005]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role or round
      - Evidence
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Advent International", "Lead investor in Series D and co-lead in Series F", "Tracxn plus the 2026 company announcement", "Repeat capital provider with visible influence across multiple major rounds", "Clarify board rights and any change in control protections after the Series F."]
      - ["CPPIB / CPP Investments", "Series E participant and Series F co-lead", "StartupFortune, Tracxn, and the 2026 company announcement", "Signals institutional support as the company moved later stage", "Confirm ownership percentage and any structured secondary or preferred terms."]
      - ["Greenfield", "Series D participant and Series F co-lead", "Tracxn plus the 2026 company announcement", "Appears in both growth financing history and latest round leadership", "Confirm board observer or governance rights, if any."]
      - ["Brighton Park Capital", "Series D participant and Series F participant", "Tracxn plus the 2026 company announcement", "Recurring investor through multiple growth stages", "Assess whether economics changed between D and F participation."]
      - ["NewView Capital", "Series E lead", "StartupFortune and Tracxn", "Anchored the 2025 unicorn-valuation round before the 2026 step-up", "Determine whether the Series E terms reset ownership, preferences, or pro rata expectations."]
    notes: >-
      This map captures the most economically visible backers from public round
      disclosures; it does not reconstruct the full cap table, debt stack, or
      secondary transaction history.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows focus on the most visible capital providers across the documented
        growth rounds, not every shareholder or fund entity in the cap table.
    claimRefs: [CO006, CO008, CO010, CO011, CO012, CO013]
