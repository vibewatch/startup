  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: series-f-terms
      missingEvidence: Exact Series F liquidation preferences, ownership changes, board rights, and any participating or senior securities.
      whyItMatters: Late-stage terms can materially change downside protection and common-equity return math even when the headline valuation looks stable.
      diligencePath: Request the Series F term sheet, post-round cap table, and board-rights summary in the data room.
      relatedQuestionRefs:
        - QV008
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Current ARR or GAAP revenue, NRR, GRR, churn, gross margin, burn, free cash flow, and customer concentration.
      whyItMatters: Those metrics are necessary to judge whether the reported valuation is supported by durable economics rather than only category momentum.
      diligencePath: Request cohort retention, margin bridge, cash-flow trend, and top-customer exposure from management.
      relatedQuestionRefs:
        - QV005
        - QV008
    - type: conflicting-data
      severity: minor
      topic: tracker-reconciliation
      missingEvidence: A reconciled explanation for why secondary trackers show different cumulative funding and headcount figures from company-issued materials.
      whyItMatters: Even small reconciliation gaps reduce confidence in valuation math and in operating-scale benchmarks used for scenario framing.
      diligencePath: Ask management to reconcile funding history, headcount, and valuation milestones against tracker records before pricing an entry.
      relatedQuestionRefs:
        - QV003
        - QV006
        - QV010
