    title: Recommendation logic
    type: flow
    summary: Strategic relevance is evident, but disclosure and customer-friction risks keep the recommendation at track.
    data:
      nodes:
        - id: proof
          label: Product proof
          detail: Customer-owned storage, open formats, and full-fidelity ingestion support a differentiated architecture story.
          tone: positive
        - id: scale
          label: Commercial scale
          detail: Official and independent sources point to 5,000+ customers and a fresh $200M round.
          tone: positive
        - id: optionality
          label: AI expansion optionality
          detail: Olly, MCP, CLI, and the Aporia-driven AI Center add upside if monetization holds.
          tone: positive
        - id: friction
          label: Customer friction
          detail: Reviews cite learning-curve, AI-helpfulness, and log-volume cost concerns.
          tone: warning
        - id: opacity
          label: Underwriting opacity
          detail: Public sources still do not disclose ARR, retention, margins, burn, or Series F preference terms.
          tone: negative
        - id: outcome
          label: Recommendation
          detail: Track until disclosure quality improves or entry terms compensate for the uncertainty.
          tone: neutral
      edges:
        - from: proof
          to: scale
        - from: scale
          to: optionality
        - from: optionality
          to: friction
        - from: friction
          to: opacity
        - from: opacity
          to: outcome
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
