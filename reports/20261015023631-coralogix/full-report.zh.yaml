  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开来源支持一种由遥测驱动、并向 AI 和安全扩张的企业收入模式，但没有公开价格卡或毛利润桥接数据。
    data:
      nodes:
        - id: telemetry
          label: AI 与云遥测
          detail: 大量日志、指标、追踪和安全事件构成原始需求层。
        - id: ingest
          label: 全保真摄取
          detail: Coralogix 推介完整数据摄取、流式分析和开放格式。
        - id: storage
          label: 客户自有存储
          detail: 数据留在客户云中，主打长留存和更低成本。
        - id: workflows
          label: AI 与安全工作流
          detail: Olly、MCP、CLI、AI Center 和 AI-SPM 扩大产品覆盖面及潜在模块支出。
        - id: enterprise
          label: 企业采用
          detail: 公开资料中的厂商自述显示，全球有 5,000+ 家客户，以及约 30 个年支出超过 $1m 的账户。
        - id: revenue
          label: 收入与利润率产出
          detail: 2026 年 6 月前，年化收入已超过 $100m，但当前收入、利润率和烧钱情况未披露。
      edges:
        - from: telemetry
          to: ingest
          label: AI 遥测越多，摄取需求越大
        - from: ingest
          to: storage
          label: 开放格式存储是成本和留存杠杆
        - from: storage
          to: workflows
          label: 保留数据支持 AI 调查和安全模块
        - from: workflows
          to: enterprise
          label: 更广的工作流支持更深的企业扩张
        - from: enterprise
          to: revenue
          label: 用量和扩张转化为经常性平台支出
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Coralogix 在同一遥测基础上叠加摄取、客户自有存储、共享查询访问，以及多种人工 / 智能体界面。
    data:
      layers:
        - label: 遥测输入
          detail: 运营、安全和 AI 交互产生的剩余数据汇入同一平台。
          modules:
            - 日志 / 指标 / 追踪
            - 安全事件
            - AI 提示词、响应和会话
        - label: 流内分析
          detail: 告警、解析、增强和异常检测在长期存储前运行。
          modules:
            - 流处理
            - 实时指标 / 告警
        - label: 客户自有遥测湖
          detail: 原始数据以开放格式存储在客户云中，支持长期留存。
          modules:
            - 开放格式存储
            - 无需重新水合工作流
        - label: 共享查询 + 数据集层
          detail: 对实时和历史遥测采用同一套查询 / 数据模型。
          modules:
            - DataPrime / 查询层
            - 可复用数据集
        - label: 跨栈产品界面
          detail: 平台覆盖系统、安全和 AI 可观测性，而不是单一仪表盘品类。
          modules:
            - APM / 基础设施 / RUM
            - 安全分析 / AI-SPM
            - AI Center
        - label: 人工与智能体界面
          detail: 多种界面使用同一数据基础。
          modules:
            - 仪表盘
            - Olly 对话式调查员
            - MCP + CLI 自动化
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE008
  - id: FU001
    title: 公开可见的客户旅程节点
    type: journey-map
    summary: 公开证据支持评估、规模化生产使用和跨栈扩张步骤，但不足以证明业务持久性所需的续约经济性。
    data:
      items:
        - label: 发现匹配度
          actor: 平台工程 / SRE 买方
          phase: 进入
          channel: 官方网站和独立评测
          touchpoints:
            - 14 天全功能试用，无需信用卡
            - 独立资料聚焦高容量遥测和成本控制
        - label: 验证经济性
          actor: 平台负责人及财务 / 工程领导层
          phase: 商业评估
          channel: 定价和架构评审
          touchpoints:
            - 按用量计费，起价为 $0.06/GB
            - 需要直接验证路由纪律和真实预算门槛
        - label: 初始生产部署
          actor: 可观测性和运营团队
          phase: 采用
          channel: 指名客户案例
          touchpoints:
            - 截至采集时列出 37 个公开客户成功案例
            - 成果表述集中在节省成本、迁移速度和事故响应
        - label: 跨栈扩张
          actor: 安全和 AI 团队
          phase: 扩张
          channel: 更广的产品覆盖面
          touchpoints:
            - 公开客户名单中出现 Snowbit 品牌的安全案例
            - AI Center 发布后，平台覆盖 AI 质量、安全和治理
        - label: 规模化遥测覆盖
          actor: 大型企业工程团队
          phase: 成熟使用
          channel: 基准发布
          touchpoints:
            - 公司基准称，七天内查询量超过 40 亿次、处理约 50 PB 数据
            - 其中一个基准账户据称每天约处理 40 TB
        - label: 续约 / 集中度评审
          actor: 执行发起人、采购方和投资人
          phase: 持久性检查
          channel: 公开披露缺口
          touchpoints:
            - 保留来源未披露 NRR、GRR、流失率、合同期限和头部客户集中度
            - 持久性仍需直接尽调，不能靠公开证据确认
    claimRefs:
      - CU004
      - CU006
      - CU008
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险在于控制措施的证明和运营执行，而不是某一项已披露的不利事件。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 数据治理与主权
          note: 按区域部署和客户自有存储可以缓释风险，但不能独立证明合规结果。
          values:
            - Unknown
            - 高
            - 中
            - 高
        - label: AI 安全控制有效性
          note: 公开材料指出提示注入、PII 泄漏和成本攫取风险，但来源池中没有第三方验证。
          values:
            - Unknown
            - 高
            - 中
            - 高
        - label: PB 级规模下的平台可靠性
          note: 多区域、全保真摄取既是战略优势，也是执行负担。
          values:
            - Unknown
            - 高
            - 中
            - 高
        - label: 合作伙伴与云依赖
          note: Skyflow、客户云架构和区域可用性，都位于受监管工作负载的故障链中。
          values:
            - 中
            - 高
            - 中
            - 中
        - label: 财务证明与估值
          note: 后期估值和增长预期跑在留存、利润率和集中度的公开证明之前。
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 竞争性定价压力
          note: 该品类仍然拥挤，因此成本或功能滑坡可能迅速传导为增长和留存风险。
          values:
            - 高
            - 中
            - 中
            - 中
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
      - CR008
      - CR009
      - CR010
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略相关性明确，但披露和客户摩擦风险使建议仍停留在跟踪。
    data:
      nodes:
        - id: proof
          label: 产品证明
          detail: 客户自有存储、开放格式和全保真摄取，共同支撑差异化架构叙事。
          tone: positive
        - id: scale
          label: 商业规模
          detail: 官方及独立来源指向 5,000+ 家客户和新近完成的 $200M 融资。
          tone: positive
        - id: optionality
          label: AI 扩张期权
          detail: 如果变现能力保持，Olly、MCP、CLI 和 Aporia 驱动的 AI Center 会带来上行空间。
          tone: positive
        - id: friction
          label: 客户摩擦
          detail: 评测提到学习曲线、AI 帮助性和日志量成本方面的担忧。
          tone: warning
        - id: opacity
          label: 投资判断不透明
          detail: 公开来源仍未披露 ARR、留存、利润率、烧钱或 F 轮优先权条款。
          tone: negative
        - id: outcome
          label: 建议
          detail: 在披露质量改善或入场条款足以补偿不确定性前，继续跟踪。
          tone: neutral
      edges:
        - from: proof
          to: scale
        - from: scale
          to: optionality
        - from: optionality
          to: friction
        - from: friction
          to: opacity
        - from: opacity
          to: outcome
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
