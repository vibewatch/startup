      - number: '2.2'
        title: 公开证据支持受限的测算视角，而非完整 TAM 体系
        blocks:
          - type: paragraph
            body: >-
              当前资料池中最强的测算信号是运营规模和合同区间，而不是外部品类模型。公司材料和行业报道称 Coralogix 在全球服务超过 5,000 家客户，每天在八个区域处理 PB 级生产数据，并在 2025 年 3
              月已拥有超过 2,000 家企业客户。AICoolies 提供了一个变现视角：典型年度支出在 $15,000—$75,000 之间，较大型企业部署则根据数据量达到 $300,000 或以上。Tracxn
              还显示市场有 196 家活跃竞争者，说明市场真实存在，但也说明 Coralogix 进入的是竞争密集的成熟品类，而非无人占领的预算。这些代理指标有助于评估采用速度和商业区间，却不等同于有来源支持的 TAM、SAM
              或 SOM。因此，本章将公开市场测算视为受证据约束，避免编造资料池无法支持的广泛支出估算。
