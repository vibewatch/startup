      - number: '3.2'
        title: 架构与包装切入点
        blocks:
          - type: paragraph
            body: >-
              Coralogix
              最清晰的公开切入点来自架构和商业模式，而非生态。官方来源反复强调全保真摄取、实时流式分析、开放格式和客户自有存储；留存的评测则将其转化为面向重日志团队的购买故事，重点是留存成本和数据可移植性。公开包装强化了同一信息：不按用户或主机计价，日志、追踪、指标和
              AI 遥测采用透明的挂牌价格，平台通过按数据价值路由遥测，而不是先把所有数据索引起来。相对于 Datadog、New Relic 和
              Dynatrace，这一主张确实有意义；但当买方对成本敏感、采用多云，或担心长期存储锁定时，差异化才最明显。
