      - number: '8.2'
        title: 估值背景与情景区间
        blocks:
          - type: paragraph
            body: >-
              公开估值支持方向偏正面，但仍不精确。二级追踪机构将 Coralogix 2026 年 6 月投后估值放在约 16 亿美元，并推算投前约 14
              亿美元；官方融资公告只公布融资额和累计融资统计。因此，情景分析比硬性的倍数计算承担了更多工作。乐观情景依赖 AI
              可观测性、安全相邻扩张和企业采用转化为持久变现与更强定价权。基准情景假设公司持续增长并保持战略相关性，但在收入质量证据改善前，当前估值下的回报潜力仅中等。悲观情景是投资者为持久证据尚未确立的公司提前付价；若成本纪律、AI
              实用性或净留存令人失望，后期下行风险就会出现。Tracxn 将 Sumo Logic、New Relic 和 Observe
              列为功能相近的竞争者，但留存证据没有提供标准化的当前交易倍数，因此这些名称只能勾勒市场替代方案，不能支持精确目标价。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应少关注产品故事，多关注投资评估机制。管理层需要对账已报告的估值计算，解释为何二级追踪机构显示的累计融资额高于官方公告，并披露 Series F
              是否改变清算优先权、董事会权利或稀释程度，从而压缩普通股回报。同样重要的是，买方需要 AI 可观测性变现、模块附加率、续约质量的 cohort
              证据，以及客户自有存储经济性究竟能否带来持久账户扩张，而不只是更高的遥测使用量。如果披露继续封闭，同时成本抱怨持续，或 AI 层被证明更容易被大型可观测性厂商复制，论点就会失效。一家权重较低的媒体否认 2026
              年 Series F 已完成，这与公司、Tracxn、ChannelE2E、FinTech Global 和 The Stack 的说法相反；投资前应通过已执行的融资文件解决这一冲突。
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 跟踪。Coralogix 在战略上具有相关性，商业上也可信，但当前公开记录不足以支持在所报告的后期估值下有信心买入。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV011
          - type: callout
            title: 论点破坏触发因素
            body: 如果净留存、利润率或现金效率数据令人失望；如果 Series F 条款证明对投资者保护过强、限制新资金的上行空间；或如果客户反馈持续指向成本和产品摩擦问题，却没有相应的变现证据，结论应进一步转弱。
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV013
