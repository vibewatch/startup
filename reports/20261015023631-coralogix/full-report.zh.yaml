    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与业务版图
        blocks:
          - type: paragraph
            body: >-
              Coralogix 将自己定位为覆盖系统、安全和 AI 工作负载的 AI 原生可观测性平台。公司主页和 2026 年 7 月 Gartner
              公告都强调单一数据层、开放格式和面向机器的调查工作流，而不是只做仪表盘。开源记录始终将公司成立时间定为 2014
              年，当前商业中心位于波士顿；第三方资料还显示其在以色列、欧洲、印度和美国设有运营版图。这为后续章节提供了稳定的身份底座：后期私有公司、由创始人主导的产品叙事，以及围绕客户自有存储和 AI
              辅助运营而非单点监控工具展开的平台故事。
