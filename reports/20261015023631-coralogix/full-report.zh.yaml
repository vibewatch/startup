      - 假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 看涨
        - AI 可观测性和安全相邻模块成为更高价值的扩张切入口，同时客户规模和数据所有权定位保持差异化。
        - 如果可持续变现和更强的企业客户证明迅速出现，当前估值可能站得住。
        - 需要独立证明客户附加率、留存和高效增长，而不能只看平台叙事。
      - - 基准
        - Coralogix 继续增长并保持战略相关性，但市场仍缺乏足够公开证据来判断收入质量和本轮融资经济性。
        - 按报道估值进入后的回报取决于执行和未来披露，而不是今天就能看出的错价。
        - 与当前证据集最匹配，因为优势可见，但精度有限。
      - - 看跌
        - 在经济性尚未完全去风险前，成本管理摩擦、AI 效用减弱或后期条款压力浮现。
        - 即便产品仍有相关性，只要估值跑在可持续基本面之前，入场回报仍可能平庸。
        - 如果披露持续稀薄且客户痛点被证明长期存在，这一情景最可能发生。
    notes: 这些情景只反映方向，因为本章缺少精确估值建模所需的 ARR、利润率、烧钱、留存和优先股堆叠数据。
