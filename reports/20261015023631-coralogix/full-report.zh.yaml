      - number: '3.3'
        title: 持久性、切换与压力点
        blocks:
          - type: paragraph
            body: >-
              支持 Coralogix 切入点的证据，也定义了它的竞争风险。公开评测称，Datadog 对功能优先型买方更强，New Relic 保留免费层和统一平台漏斗，Dynatrace 在深度 APM 与自动化上更强，而
              Grafana Cloud 仍是已投入开源可观测性技术栈团队的默认替代方案。Toolradar 还指出 Coralogix
              包装上的实际弱点：计费单位更难理解，快速查询性能存在明确限制，路由不当仍会推高成本。Coralogix 正扩展到 AI 可观测性、AI 安全态势、MCP 和 CLI
              工作流，但公开记录仍没有硬切换成本、赢单率或附加率数据，无法证明这些广度是持久护城河，而不只是不断扩张的比较清单。
