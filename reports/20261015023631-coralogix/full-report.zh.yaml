  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              留存证据不支持把 Coralogix 视为只有少数初创同行、已经胜出的单点方案品类。Tracxn 描述了 196 家活跃竞争者，并将 Sumo Logic、New Relic 和 Observe
              列入头部；Silicon Valley Investclub 则将追踪范围扩展到 Datadog、Dynatrace、Splunk、Grafana Labs、Chronosphere、Elastic 和
              Logz.io。因此，买方可以通过直接的全栈套件、日志/安全老牌厂商，或以 Grafana 类工具为核心的开放栈来解决同一需求。实际上，Coralogix
              同时面对资金充足的私有同行和上市老牌厂商，真正的问题不是替代方案是否存在，而是哪些买方优先级会让其存储和成本定位比更深的老牌厂商广度更有吸引力。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
