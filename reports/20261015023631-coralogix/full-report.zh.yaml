            body: >-
              证据支持的是对价格敏感的跟踪结论，而不是买入结论。Coralogix 围绕客户自有存储、开放格式、全保真摄取，以及为 Olly、MCP 和 CLI
              工作流打造而非只服务仪表盘监控的接口层，确实形成了差异化平台叙事。2026 年 6 月 Series F
              也确认了投资者兴趣和可见的商业规模。即便如此，这个积极故事本身不足以支持立即进行后期投资评估，因为同一份公开记录对
              ARR、留存、毛利率、自由现金流路径以及最新轮次背后的实际优先股堆叠仍披露不足。因此，在转为买入建议前，应继续关注，同时要求更好的披露或更有利的入场条款。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
