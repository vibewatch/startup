  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界已从可观测性工具转向 AI 时代的控制层
        blocks:
          - type: paragraph
            body: >-
              Coralogix 的可服务市场不止是传统日志管理或 APM。公司及多个第三方来源描述了一个覆盖日志、指标、追踪、安全分析和 AI
              可观测性的平台，客户自有存储与开放格式也是其卖点的一部分。因此，纳入的支出横跨核心可观测性预算、部分 SIEM/安全分析预算，以及围绕生产环境 AI 智能体出现的新 AI
              治理和性能预算。实际替代方案仍是多种单点工具加抽样留存的现有技术栈，但 Coralogix 试图用单一数据层和面向 AI
              的界面取代它。根据现有证据，市场边界不包括一般云基础设施支出、通用数据仓库，或不承担日常遥测和事故调查层职责的广义网络安全平台。这个边界之所以重要，是因为估值的关键不在可观测性是否是一个巨大的头部市场，而在于
              Coralogix 能否从 SRE 工作流继续扩展到安全和 AI 运营，同时不沦为现有买方技术栈上的薄层功能。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
