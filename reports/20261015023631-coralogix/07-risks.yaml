company:
  name: Coralogix
chapter:
  number: 7
  title: Risks
  summary: >-
    Coralogix's largest residual risk is execution: it is promising privacy-safe, AI-native observability for regulated buyers while also promising petabyte-scale, multi-region, customer-owned operation. The assigned pool shows credible mitigations—regional deployment, customer-owned storage, AI-SPM, compliance reporting, and the Skyflow partnership—but it remains thin on independent proof of current certifications, incident history, retention quality, and concentration at a $1.6 billion late-stage valuation.
sections:
  - id: ranked-risk-stack
    title: Severity-ranked risk stack
    body: >-
      The top risk is not a single public lawsuit or outage disclosed in the assigned pool; it is the cumulative execution burden created by Coralogix's own positioning. The company is selling full-fidelity, AI-native observability into security- and compliance-sensitive buyers while promising regional deployment, customer-owned storage, long-term retention, and agent-facing workflows. That combination can be strategically powerful, but it raises the bar on privacy controls, reliability, and cost discipline simultaneously. The public record in this pool also puts those claims against late-stage expectations: Coralogix's June 2026 Series F took total funding to $550 million, while third-party profiles tie the company to a $1.6 billion valuation, 5,000+ customers, and petabyte-scale daily production data. The heatmap therefore ranks data-governance, platform reliability, and financial-proof gaps above softer category risks.
    claimRefs: [CR002, CR003, CR004, CR006, CR007, CR008, CR009, CR010, CR013]
    figureRefs: [FR001]
  - id: legal-and-regulatory-exposure
    title: Legal and regulatory exposure centers on privacy-safe telemetry claims
    body: >-
      Coralogix's public risk narrative is unusually explicit about why legal and regulatory exposure matters. The Skyflow partnership says observability logs often contain sensitive customer data in both structured and unstructured fields, while Coralogix's AI security materials call out prompt injection, data leaks, PII exposure, and policy-violation monitoring as live operating concerns. The company's mitigation story is coherent: region-specific deployment, governed tokenization, policy-based rehydration, and compliance reporting around AI prompts and responses. The unresolved problem is verification. The assigned pool does not independently confirm the current certification set, disclosed incident record, or regulator-facing audit outcomes behind these claims. That leaves the legal risk register centered on control substantiation rather than a known enforcement action.
    claimRefs: [CR001, CR002, CR003, CR004, CR013, CR014]
    tableRefs: [TR001]
  - id: operational-and-dependency-exposure
    title: Operational and dependency risk rises with scale, open retention, and partner layers
    body: >-
      Coralogix is making ambitious operating promises. Its AI security page advertises sub-millisecond alert detection, 99.9% uptime, and 10x data-ingestion capacity, while the company homepage says nothing is indexed and the full record lands in the customer's own cloud. Those are attractive claims, but they push execution risk into several places at once: ingesting and querying very large telemetry volumes, preserving customer-owned data portability, keeping agent-facing interfaces safe, and preventing runaway spend as AI usage grows. The company partially mitigates this with AI-specific posture management, token-usage tracking, and a named privacy partner in Skyflow. Still, the same public materials imply dependency on partner technology, hyperscaler-region availability, and disciplined operating execution to keep the architecture's cost and reliability promises intact.
    claimRefs: [CR004, CR005, CR006, CR007, CR011, CR012, CR013]
    tableRefs: [TR002, TR003]
  - id: underwriting-implication-and-kill-criteria
    title: Underwriting should focus on proof gaps more than category ambition
    body: >-
      The underwriting implication is that Coralogix may be strategically well-positioned yet still too opaque for aggressive risk discounting. Olam reports a $150-200 million revenue run rate and a path toward profitability, while Tracxn records 196 active competitors and a $1.6 billion valuation benchmark. That means investors are being asked to underwrite category leadership, cost-performance differentiation, and durable expansion simultaneously. The public mitigations are real, but the chapter's missing data matters more: independent proof of certifications and incident history, renewal and concentration metrics, and partner or cloud dependency details. A practical kill-criteria set is therefore measurable: evidence of regulated-customer control failures, repeated reliability misses against stated platform standards, or weak retention/concentration data that would undermine the case for underwriting a late-stage observability platform at current scale.
    claimRefs: [CR008, CR009, CR010, CR014]
