figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Highest residual risk sits in control substantiation and operating execution, not in a single disclosed adverse event.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Data governance and sovereignty
          note: Region-specific deployment and customer-owned storage mitigate but do not independently prove compliance outcomes.
          values: [Unknown, High, Medium, High]
        - label: AI-security control efficacy
          note: Public materials identify prompt injection, PII leakage, and cost harvesting, but third-party validation is absent in the pool.
          values: [Unknown, High, Medium, High]
        - label: Platform reliability at petabyte scale
          note: Multi-region, full-fidelity ingestion is a strategic strength and an execution burden at the same time.
          values: [Unknown, High, Medium, High]
        - label: Partner and cloud dependency
          note: Skyflow, customer-cloud architectures, and regional availability all sit in the failure chain for regulated workloads.
          values: [Medium, High, Medium, Medium]
        - label: Financial proof versus valuation
          note: Late-stage valuation and growth expectations outrun the public proof on retention, margins, and concentration.
          values: [Medium, High, Low, High]
        - label: Competitive pricing pressure
          note: The category remains crowded, so cost or feature slippage can transmit quickly into growth and retention risk.
          values: [High, Medium, Medium, Medium]
    claimRefs: [CR002, CR003, CR004, CR006, CR008, CR009, CR010, CR013, CR014]
callouts:
  - calloutType: risk
    title: Kill criteria
    body: >-
      Break the investment case if diligence shows repeated reliability misses against stated platform standards, weak regulated-customer control evidence, or retention and concentration data that materially weaken the justification for a $1.6 billion late-stage valuation.
    claimRefs: [CR003, CR005, CR007, CR008, CR009, CR014]
  - calloutType: insight
    title: Best visible mitigation
    body: >-
      The strongest mitigation already visible in public materials is architectural alignment: customer-owned storage, regional deployment, AI-specific posture monitoring, and a named privacy partner all point to thoughtful design; what remains missing is independent proof that those controls are working at current scale.
    claimRefs: [CR002, CR003, CR004, CR011, CR013, CR014]
