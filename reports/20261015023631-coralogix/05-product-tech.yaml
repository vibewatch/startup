company:
  name: "Coralogix"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Coralogix presents a coherent product architecture built around customer-owned telemetry storage, in-stream processing, and multiple human-plus-agent interfaces on the same data foundation. The 2025-2026 launch record makes the AI-observability expansion look real, but most public scale and performance proof remains company-authored or syndicated, and retained sources are still thin on independent security-control evidence."
sections:
  - id: "product-scope-and-modules"
    title: "Product scope and module map"
    body: >-
      Coralogix is not pitching a single monitoring screen; it is pitching an AI-native,
      cross-stack observability platform that spans systems, security, and AI workloads,
      then exposes that platform through both conventional product modules and agent-facing
      interfaces. The current public package combines a core observability surface
      (logs, metrics, traces, RUM, security analytics), a newer AI Center for LLM
      monitoring and guardrails, and multiple investigation entry points including Olly,
      MCP, and a CLI. Independent summaries broadly corroborate the breadth of that
      module set, but they do not add much architectural depth beyond the vendor story,
      so module breadth is easier to verify than module adoption or attach rates.
    claimRefs: ["CE001", "CE002", "CE003", "CE007", "CE011", "CE012"]
    tableRefs: ["TE001"]
  - id: "architecture-and-operating-model"
    title: "Architecture and operating model"
    body: >-
      The strongest through-line across retained sources is Coralogix's storage and
      query architecture. Company materials repeatedly emphasize in-stream analysis
      before storage, raw telemetry preserved in customer-controlled cloud object storage,
      and query access over open formats rather than an index-first retention model.
      The same sources also frame human dashboards, reusable datasets, and agent interfaces
      as consumers of one shared data layer instead of separate products. That architecture
      is strategically differentiating if it works as advertised because it aligns
      retention, governance, and automation on one substrate, but it also shifts buyer
      diligence toward migration effort, query ergonomics, and proof that the architecture
      performs under real customer workloads rather than curated marketing examples.
    claimRefs: ["CE004", "CE005", "CE006", "CE008", "CE009", "CE010"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "workflow-fit-and-differentiation"
    title: "Workflow fit and differentiation"
    body: >-
      Coralogix's differentiation is not just "AI" branding; it is the claim that the
      same telemetry lake can serve dashboard users, conversational investigators, and
      automated runbook or CI workflows without rehydrating data into a separate system.
      The newest AI Center materials add evaluators, session replay, cost tracking, and
      AI-specific security posture management, while the October 2026 benchmark launch
      adds a live-performance narrative around query scale and agent investigation.
      That makes the product story unusually cohesive across infrastructure and AI use
      cases, but the public record still leans heavily on company-controlled benchmark
      and launch evidence rather than neutral customer or lab validation.
    claimRefs: ["CE002", "CE003", "CE008", "CE009", "CE010", "CE011"]
    tableRefs: ["TE002"]
  - id: "trust-controls-and-open-risks"
    title: "Trust, controls, and open risks"
    body: >-
      Public evidence is materially weaker on trust and control depth than on product
      breadth. Retained sources do show that Coralogix is thinking about PII leakage,
      prompt injection, suspicious usage, and regulated-industry positioning, and they
      describe a buyer proposition built around customer-owned storage and regional
      control. But the same retained set does not provide independent proof of uptime
      history, privacy-boundary design, control-plane architecture, or how well newer
      AI modules perform in production outside vendor-selected examples. Third-party
      summaries also flag learning-curve, pricing, and synthetic-monitoring gaps, which
      means diligence should test whether the architecture advantage outweighs operational
      complexity for the buyer's actual telemetry and AI workload.
    claimRefs: ["CE003", "CE013", "CE014", "CE015", "CE016"]
