      - ["Telemetry Lake + customer-owned storage", "Platform / infrastructure owners", "Core architecture", "Open-format, customer-cloud storage and index-free/query-in-place positioning is the clearest product-level differentiator versus index-priced incumbents.", "Need migration references, storage prerequisites, and real operating-cost examples by cloud."]
      - ["AI Center", "AI platform, security, and compliance teams", "Newer module launched in 2025", "Adds evaluators, session visibility, AI-SPM, and token/cost tracking inside the platform rather than as a bolt-on point tool.", "Need module attach rates, named production users, and evaluator-quality evidence."]
      - ["Olly + MCP + CLI", "Engineers and AI agents", "Scaling interface layer in 2026", "Lets the same telemetry foundation power chat, ecosystem connectors, and programmable investigation workflows.", "Need latency/SLA proof and examples of successful automated remediation in production."]
    notes: "Mixes vendor claims with third-party summaries; maturity reflects public launch timing, not audited module revenue."
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE005", "CE007", "CE008", "CE011"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Company solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Investigate incidents across logs, metrics, and traces", "Engineers filter dashboards and queries manually", "Olly plus the shared query/data layer can investigate across the same telemetry foundation used by dashboards.", "Company benchmark material says the platform processed more than 4 billion queries and approximately 50 petabytes over a seven-day period, with one benchmark account showing half of queries in approximately one second.", "Performance proof is company-authored and syndicated, not independently benchmarked."]
      - ["Monitor production AI applications", "Teams stitch prompt logs, evaluator tools, and infra telemetry across separate systems", "AI Center adds evaluator-based monitoring, session explorer, and AI-specific dashboards inside Coralogix.", "Public materials explicitly cover hallucination, PII-leak, toxicity, latency, token-usage, and cost-tracking workflows.", "No retained independent evidence quantifies false positives, evaluator precision, or module adoption."]
      - ["Automate investigation inside external workflows", "Operators pivot between observability UI, chat, and engineering tools", "MCP connectors and the CLI surface Coralogix insights in Slack, PagerDuty, IDEs, and scripts.", "The same data foundation is presented as reusable across chat, MCP, and CLI instead of creating separate data silos.", "Need customer proof that these agent workflows reduce toil rather than just add another interface."]
      - ["Control observability cost without dropping fidelity", "Teams sample, shorten retention, or buy separate archive tiers", "Customer-owned storage and index-free query model aim to preserve full-fidelity history without rehydration.", "Official and third-party materials consistently position the architecture around long retention and lower cost at scale.", "Actual savings are workload dependent; retained sources do not show normalized before/after TCO by customer segment."]
    notes: "Benefits reflect claimed or summarized workflows; only the October 2026 benchmark release contributes concrete public performance metrics."
    claimRefs: ["CE002", "CE003", "CE004", "CE006", "CE008", "CE009", "CE010", "CE015"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Telemetry ingestion + in-stream analysis", "Accepts telemetry and applies alerting, enrichment, parsing, anomaly detection, and other analysis before long-term storage.", "Instrumentation breadth and data-pipeline compatibility, especially via OpenTelemetry-oriented integrations.", "Migration and parsing complexity are not independently documented in retained sources."]
      - ["Customer-owned storage / Telemetry Lake", "Keeps operational and historical telemetry in customer-controlled cloud object storage using open formats.", "Customer cloud footprint, storage governance, and region configuration.", "Storage control is attractive, but it can move cost/governance burden onto the buyer if deployment patterns are poorly scoped."]
      - ["Query + data-governance layer", "Provides a shared query/data model for live and stored telemetry, including reusable datasets and remote/index-free access patterns.", "Schema-free data model, query ergonomics, and operator ability to work effectively with DataPrime-style workflows.", "Independent summaries mention learning-curve and complex-query tradeoffs, so usability can become a gating risk."]
      - ["Experience + automation layer", "Exposes dashboards, AI Center, Olly chat, MCP, and CLI on top of the same telemetry substrate.", "Model behavior, prompt hygiene, token budgets, and external tool integrations.", "Public evidence is thin on agent-interface SLAs, control-plane architecture, and how reliably newer AI modules work in production."]
    notes: "Rows synthesize vendor architecture claims with third-party summaries; risks identify diligence items rather than proven failures."
    claimRefs: ["CE004", "CE005", "CE006", "CE008", "CE013", "CE014", "CE015"]
