callouts:
  - calloutType: "strength"
    title: "Architectural coherence is the strongest product asset"
    body: "Across the retained source set, the most credible product story is not any single feature but the consistent claim that customer-owned storage, shared query access, and human-plus-agent interfaces all sit on one telemetry substrate."
    claimRefs: ["CE004", "CE006", "CE008"]
  - calloutType: "risk"
    title: "Independent proof trails the ambition of the product story"
    body: "The public record is rich in launch language and benchmark claims, but still weak on independent validation of security controls, production reliability, and adoption depth for the newer AI modules."
    claimRefs: ["CE009", "CE010", "CE015"]
