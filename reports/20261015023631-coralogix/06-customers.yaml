  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Current NRR, GRR, gross churn, logo churn, and median contract duration by customer cohort.
      whyItMatters: Adoption breadth is visible publicly, but without retention metrics it is hard to judge whether growth is durable or driven by new-logo acquisition and marketing momentum.
      diligencePath: Request board-level customer KPI pack or cohort dashboard showing renewal, downsell, upsell, and contract-duration distributions.
      relatedQuestionRefs:
        - QU004
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue share, top-10 share, channel or partner dependency, and any public-sector concentration by segment or region.
      whyItMatters: The current evidence set supports logo breadth but does not show whether a small number of very large deployments disproportionately drives revenue or referenceability.
      diligencePath: Request customer concentration schedule, top-account ARR roll-forward, and direct-versus-channel split for the last four quarters.
      relatedQuestionRefs:
        - QU004
        - QU005
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: A dated list separating pilot, departmental production, and enterprise-wide deployments across named reference customers.
      whyItMatters: Public case-study directories prove real usage, but they do not reveal how much of the public logo base is still early-stage, narrow-scope, or no longer current.
      diligencePath: Ask for a reference grid with customer name, segment, live modules, go-live date, scope, and referenceability status.
