schemaVersion: report-v2
artifact: customers
slug: coralogix
runDate: '2026-10-15'
company:
  name: Coralogix
chapter:
  number: 6
  title: Customers
  summary: 'Coralogix has credible public adoption proof: the company moved from saying it had over 2,000 enterprise customers in March 2025 to more than 5,000 customers worldwide in June 2026, while public case-study directories list dozens of named deployments and the company now publishes very large telemetry-workload benchmarks. The weak spot is durability, not top-of-funnel proof: retained sources still do not disclose NRR, churn, contract duration, or customer concentration, so real expansion quality remains under-documented.'
sections:
  - id: customer-base
    title: Customer base appears broad by logo and vertical, but the customer definition is still loose
    body: 'Public evidence supports a real and fairly broad enterprise customer footprint. Coralogix said in March 2025 that it had over 2,000 enterprise customers globally, then said in June 2026 that it was trusted by more than 5,000 customers worldwide, naming IBM, Tradeweb, and JFrog as examples. The case-study inventory also spans fintech, cybersecurity, consumer internet, cloud infrastructure, and retail brands, which suggests the platform is not concentrated in a single niche workload. That said, the disclosures are not like-for-like: one statement uses enterprise customers, the later one uses customers worldwide, and none of the retained sources explains paid versus free accounts, active deployments versus logos, or revenue concentration by segment. The chapter therefore supports breadth and momentum more strongly than exact mix or monetized depth.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU009
      - CU013
    tableRefs:
      - TU001
      - TU002
  - id: proof-of-adoption
    title: Named proof is real and operational, but still mostly case-study shaped
    body: 'Coralogix clears the basic adoption-proof bar because public evidence goes beyond an unlabeled logo wall. CaseStudies.com listed 37 customer success stories at capture time, and the visible roster includes named operators such as AGS, Armis, Curve, Imperva, monday.com, Nutanix, Payoneer, Proofpoint, PUMA, and Razorpay. The individual summaries emphasize operational outcomes such as lower observability cost, faster incident response, migration speed, or increased log volume without proportional spend. Company-issued benchmark material strengthens the picture by showing very large telemetry volumes already moving through the platform. Even so, most of the visible proof is curated: public sources are much stronger on anecdotal operating wins than on production tenure, rollout size, multiyear renewal behavior, or cohort expansion by module.'
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU003
  - id: durability-expansion
    title: Expansion vectors are visible; retention and concentration remain the main diligence blind spots
    body: 'The most plausible customer-motion story is land on observability economics, then expand across signals and newer AI or security workloads. The homepage offers a 14-day, full-feature trial with no credit card, which lowers evaluation friction, while product messaging consistently bundles logs, metrics, traces, security, and AI observability under one stack. Public case-study evidence also reaches into Snowbit-branded security deployments, and the AI Center launch shows Coralogix pushing for a broader budget owner than classic SRE alone. The main caution comes from independent review coverage: Modern Data Tools says buyers should validate scale requirements directly and flags ecosystem depth, learning curve, dashboard polish, and documentation quality as trade-offs. More importantly, none of the retained sources discloses NRR, GRR, churn, contract duration, or top-customer concentration, so durability still depends on management diligence rather than public evidence.'
    claimRefs:
      - CU004
      - CU005
      - CU011
      - CU012
      - CU014
      - CU015
    figureRefs:
      - FU001
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Representative use case
      - Evidence of scale / traction
      - Revenue / strategic value
      - Gap
    rows:
      - - Large enterprise platform teams
        - Platform engineering, SRE, security operations / daily users / central infra budget owner
        - Unified logs, metrics, traces, and security observability with customer-owned storage
        - Company says more than 5,000 customers worldwide and names IBM, Tradeweb, and JFrog; independent profile also points to 4,000+ customers
        - Likely core ACV base given enterprise observability positioning
        - No disclosed ARR mix, seat count, or contract-size distribution
      - - Regulated and public-sector workloads
        - Engineering plus compliance stakeholders / operational users / enterprise IT or regulated-program budget
        - Long-term retention and open-format analytics across multiple regions including GovCloud
        - Series F release says the platform processes petabytes daily across eight regions including GovCloud
        - Strategic wedge for higher-trust or compliance-led deployments
        - No public-sector revenue, renewal, or win-rate disclosure
      - - AI and model operations teams
        - AI platform, ML, security, and governance users / technical teams / broader AI operations budget
        - AI quality, security, governance, and agent observability
        - AI Center launch says Coralogix already serves 2,000+ enterprise customers and adds AI-specific controls
        - Expansion vector beyond classic observability budget
        - Attach rates, paid conversion, and standalone AI product adoption are undisclosed
      - - Cost-sensitive high-volume telemetry users
        - DevOps and platform teams / operators / engineering leadership with telemetry spend pressure
        - Tiered data routing and lower-cost long-term retention
        - Independent review recommends Coralogix for teams with meaningful telemetry volume and cites usage-based pricing from $0.06/GB
        - Economic wedge for land motion and cost-out expansions
        - Public evidence does not establish budget threshold, realized savings distribution, or payback by segment
    notes: Rows synthesize named logos, official vertical claims, and buyer-fit commentary; revenue value is directional because retained public sources do not disclose customer ARR, contract size, or concentration.
    claimRefs:
      - CU001
      - CU009
      - CU011
      - CU012
      - CU013
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Enterprise customers disclosed
        - Over 2,000 enterprise customers globally
        - '2025-03-19'
        - Coralogix AI Center launch
        - Medium
        - Confirms meaningful installed base before the newer AI-product push
        - No definition of enterprise customer or paid-versus-free mix
      - - Customers disclosed
        - More than 5,000 customers worldwide
        - '2026-06-03'
        - Coralogix Series F announcement
        - Medium
        - Supports a materially larger disclosed customer base by mid-2026
        - Not reconciled to the earlier enterprise-customer metric
      - - Platform workload scale
        - '>4 billion queries and ~50 petabytes over seven days'
        - '2026-10-14'
        - Telemetry Lake Benchmarks launch
        - Medium
        - Implies heavy production usage across the installed base
        - No account count, active-customer count, or workload mix denominator
      - - Public case-study count
        - 37 customer success stories listed
        - 2026-10-15 access snapshot
        - CaseStudies.com directory
        - Medium
        - Provides a sizeable named-proof inventory for diligence triangulation
        - Directory freshness and underlying source independence vary by story
    notes: 'Counts are not normalized across sources: retained evidence mixes enterprise customers, total customers, and telemetry workload volume; blanks in the last column mark missing paid, active, cohort, or account-level denominators.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU008
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - AGS
        - Gaming / online operations
        - Observability plus detection and response workflows
        - Production implied by named operator and quantified outcome language
        - Near-zero errors, 3x user growth, and 70% faster detection and response
        - Directory summary does not disclose contract size, tenure, or renewal status
      - - Armis
        - Cybersecurity / enterprise IT
        - Broader observability for operations teams
        - Production implied by named head of DevOps
        - Nearly $200K annual savings and improved observability
        - Savings claim is not independently audited in retained evidence
      - - Curve
        - Fintech
        - Reduce observability cost while keeping visibility
        - Production implied by named engineering manager
        - 40% observability cost savings
        - No rollout scope, cohort, or duration disclosure
      - - Imperva
        - Cybersecurity / infrastructure
        - Scale log volume without equivalent cost increase
        - Production implied by named infrastructure operations leader
        - Double log volume without increasing cost
        - No renewal, module attach, or reference-date disclosure
    notes: Illustrative named proofs from retained public case-study directories; rows do not prove renewals or revenue concentration, and production status is treated as implied only when the wording names an operating role and a realized outcome.
    enumerationScope:
      coverage: partial
      basis: Illustrative subset of the publicly visible named customer stories retained in this chapter, chosen to show segment breadth rather than an exhaustive customer census.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU015
figures:
  - id: FU001
    title: Publicly visible customer journey surfaces
    type: journey-map
    summary: Public evidence supports evaluation, scaled production usage, and cross-stack expansion steps, but not the renewal economics needed to prove durability.
    data:
      items:
        - label: Discover fit
          actor: Platform engineering / SRE buyer
          phase: Entry
          channel: Official site and independent review
          touchpoints:
            - 14-day, full-feature trial with no credit card
            - Independent framing around high-volume telemetry and cost control
        - label: Validate economics
          actor: Platform owner plus finance / engineering leadership
          phase: Commercial evaluation
          channel: Pricing and architecture review
          touchpoints:
            - Usage-based pricing starting at $0.06/GB
            - Need to validate routing discipline and real budget threshold directly
        - label: Initial production deployment
          actor: Observability and operations teams
          phase: Adoption
          channel: Named case studies
          touchpoints:
            - 37 public customer success stories listed at capture
            - Outcome language centers on cost savings, migration speed, and incident response
        - label: Cross-stack expansion
          actor: Security and AI teams
          phase: Expansion
          channel: Broader product surface
          touchpoints:
            - Snowbit-branded security case studies appear in the public roster
            - AI Center launch extends the platform into AI quality, security, and governance
        - label: Scaled telemetry footprint
          actor: Large enterprise engineering teams
          phase: Mature usage
          channel: Benchmark publication
          touchpoints:
            - Company benchmark cites more than 4 billion queries and approximately 50 petabytes in seven days
            - One benchmark account is described at roughly 40 TB/day
        - label: Renewal / concentration review
          actor: Executive sponsor, procurement, and investor
          phase: Durability check
          channel: Public disclosure gap
          touchpoints:
            - NRR, GRR, churn, contract duration, and top-customer concentration are not disclosed in retained sources
            - Durability still requires direct diligence rather than public evidence
    claimRefs:
      - CU004
      - CU006
      - CU008
      - CU011
      - CU014
      - CU015
callouts:
  - calloutType: strength
    title: Named proof is stronger than the average private-software logo wall
    body: The retained public record includes dozens of named stories, quantified outcome blurbs, and very large telemetry-workload claims, which is materially better than a bare customer-logo page.
    claimRefs:
      - CU006
      - CU008
      - CU009
  - calloutType: risk
    title: Durability evidence still lags adoption evidence
    body: Public materials do not reveal retention, churn, contract length, or concentration, so customer quality must still be underwritten through management diligence rather than external proof.
    claimRefs:
      - CU011
      - CU014
