      - [Coralogix AI Center launch, "2025", Global, ">2,000 enterprise customers", null, "Company enterprise-customer disclosure tied to AI Center launch", Medium, "Older point-in-time scope and narrower than the later total-customer figure."]
      - [aicoolies, "2026", Global / unspecified, "$15k-$75k typical annual spend; $300k+ enterprise deployments", null, "Independent product-review synthesis of commercial bands", Medium, "Not a contractual disclosure and not segmented by customer cohort."]
      - [Tracxn, "2026", Global, "196 active competitors; Coralogix ranked 7th among them", null, "Private-company database view of category breadth and relative standing", Medium, "Competition count is a category proxy, not a spend estimate or growth-rate series."]
    notes: >-
      The assigned source pool does not disclose an independent TAM, SAM, SOM,
      or category CAGR for Coralogix's exact cross-stack observability market,
      so this table preserves only supported sizing proxies.
