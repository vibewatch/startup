      - [Security analytics and AI-SPM, "Security operations leader", "SOC analysts, platform security teams", "Security / platform shared budget", "Detect and investigate security events or AI-agent risks on the same data layer", "Security operations", "Need to unify operational telemetry and security signals without a separate storage stack."]
      - [AI observability and governance, "VP AI / Head of AI Platform", "ML engineers, AI product teams", "AI platform / product", "Track prompt, response, quality, latency, cost, and safety for production AI systems", "AI platform", "Moving AI apps from pilot to production and needing governance, cost, and performance visibility."]
      - [FinOps / data-retention optimization, "Platform + infrastructure leadership", "Observability administrators", "Infrastructure / operations", "Route data by value, keep long retention, and avoid vendor lock-in", "Infrastructure / FinOps", "Cloud-waste pressure and the need to retain more telemetry without paying indexed-storage economics."]
    notes: >-
      Buyer, user, payer, and budget-owner roles are synthesized from product
      scope, named workflows, and pricing / architecture commentary rather than
      from one public procurement document.
    claimRefs: [CM002, CM003, CM008, CM009, CM010, CM011, CM015]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      The public record supports a narrowing stack of boundary, adoption, and
      contract signals, but not a clean TAM / SAM / SOM model for Coralogix's
      exact category.
    data:
      items:
        - label: Cross-stack market boundary
          displayValue: Logs + metrics + traces + security + AI
          detail: Included spend spans core observability plus adjacent security and AI-observability workflows.
          tone: positive
          claimRefs: [CM001, CM003]
        - label: AI-era replacement trigger
          displayValue: Legacy sampled tools face higher volume and more blind spots
          detail: Demand rises as AI apps and agents create telemetry scale that legacy workflows were not built to manage.
          tone: warning
          claimRefs: [CM004, CM011]
        - label: Current installed footprint
          displayValue: ">5,000 customers; 8 regions"
          detail: Supported operating-scale lens from June 2026 company and trade coverage.
          tone: positive
          claimRefs: [CM005, CM006]
        - label: Enterprise foothold before the latest raise
          displayValue: ">2,000 enterprise customers"
          detail: March 2025 AI Center launch shows meaningful enterprise penetration before the latest scale claims.
          tone: neutral
          claimRefs: [CM007]
        - label: Typical annual commercial band
          displayValue: $15k-$75k
          detail: Independent review places most organizations in a mid-five-figure annual range.
          tone: neutral
          claimRefs: [CM008]
        - label: Upper enterprise deployment band
          displayValue: $300k+
          detail: Larger deployments appear to monetize through higher data-volume and pipeline usage.
          tone: opportunity
          claimRefs: [CM009]
    approximationNotes: >-
      This is not a mathematical TAM / SAM / SOM stack. The assigned source
      pool does not provide an independent market-value model, so the pyramid
      orders the supported boundary, adoption, and contract lenses instead of
      inferring unsupported market totals.
    claimRefs: [CM001, CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM011, CM016]
callouts:
  - calloutType: insight
    title: Coralogix is competing for a broader control-layer budget
    body: >-
      The market thesis is no longer only "better log analytics." Coralogix is
      trying to own the telemetry layer that engineering, security, and AI teams
      query when production systems or agents need explanation, automation, or
      governance.
    claimRefs: [CM001, CM003, CM004, CM010]
  - calloutType: risk
    title: Public evidence still falls short of a clean market model
    body: >-
      The assigned pool is strong enough to show adoption and monetization
      proxies, but it still leaves underwriting exposed on independent category
      size, module attach, and the split between core observability, security,
      and AI-observability revenue.
    claimRefs: [CM007, CM008, CM009, CM016]
