      - [New Relic, Direct public incumbent, "$196M historical funding in Tracxn; public company status in peer tables", "Teams wanting broad tooling with a free-tier funnel", "100 GB/month free ingest and broad full-stack tooling", "CubeAPM contrasts it with New Relic cloud rather than customer-owned storage"]
      - [Dynatrace, Direct public incumbent, "$21.9M historical funding in Tracxn; public company status in peer tables", "Enterprises prioritizing deep APM, automation, and AI-assisted RCA", "Stronger enterprise automation and deep APM emphasis", "Modular consumption pricing appears less simple in public packaging"]
      - [Grafana Cloud, Open-stack adjacent substitute, "$791M historical funding for Grafana Labs in Tracxn", "Teams already on Grafana OSS / Prometheus / Loki / Tempo", "Strong OSS alignment and free-tier entry point", "Security and cost-optimization packaging is less bundled in retained sources"]
      - [Observe, Direct private peer, "$393M historical funding in Tracxn", "Teams prioritizing telemetry-lake investigation", "Similar large-scale telemetry and data-lake orientation", "Retained sources show less evidence of bundled security and AI breadth"]
      - [Sumo Logic, Log/security incumbent, "$346M historical funding in Tracxn", "Buyers centered on log analytics plus Cloud SIEM", "Established security-observability positioning", "Retained sources show less of Coralogix's customer-owned-storage pitch"]
    notes: >-
      Peer scale and category are drawn from retained market-data snapshots and editorial comparisons; rows
      summarize public positioning signals rather than a uniform vendor-quoted spec sheet.
    claimRefs: [CP006, CP007, CP008, CP009, CP011]
