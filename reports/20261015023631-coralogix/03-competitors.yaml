      - Unknowns / gaps
      - Implication
    rows:
      - [Coralogix, "Usage-based; no per-user or per-host fees; logs $0.42/GB, traces $0.16/GB, metrics $0.05/GB, AI $1.50 / 1M tokens", "All paid plans include support, SIEM / CSPM, TCO Optimizer, and customer-bucket retention in retained reviews", "Realized discounts, enterprise commits, unit-to-bill translation, and egress / storage costs are not public", "List pricing is clearer than many peers, but real TCO still depends on routing discipline"]
      - [Datadog, "Per host plus usage-based add-ons", "Strong APM, infra, logs, RUM, synthetics, security, and 1,000+ integrations", "Retained sources do not provide direct apples-to-apples all-in contract examples", "Best fit for feature-first buyers rather than lowest observable telemetry cost"]
      - [New Relic, "Data ingest plus users; 100 GB/month free tier", "Broad full-stack tooling", "Retained sources do not disclose realized enterprise discounts or module attach", "Free-tier funnel can reduce switching friction at the low end"]
      - [Grafana Cloud, "Free tier with logs, traces, metrics, and 14-day retention", "Strong OSS stack alignment plus usage controls", "Retained sources do not show the all-in cost of assembling adjacent security tooling", "A credible internal-build / open-stack substitute"]
      - [Dynatrace, "Modular consumption pricing", "Deep APM, automation, root-cause analysis, application security", "Retained sources do not quantify incremental module pricing", "Competes better where depth and automation matter more than storage economics"]
      - [AWS CloudWatch, "Many separate AWS charges across logs, metrics, dashboards, alarms, and queries", "Default AWS-native monitoring path", "Retained sources do not provide a complete multi-service cost example", "Status-quo option for AWS-centric teams, but pricing complexity is higher"]
    notes: >-
      This table mixes vendor list pricing with editorial comparisons. It should be read as public packaging
      diligence, not as a substitute for customer-specific quotes or realized contract economics.
    claimRefs: [CP003, CP005, CP006, CP007, CP008, CP009, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The retained public evidence positions Coralogix high on storage-control economics, while Datadog and
      Dynatrace sit higher on breadth and automation depth.
    data:
      xAxis:
        label: Cost-control / storage-control fit
        min: 1
        max: 5
        low: Weak public cost-control wedge
        high: Strong public cost-control wedge
        description: Author-assigned ordinal score from retained public evidence only
        scale: ordinal
      yAxis:
        label: Publicly evidenced breadth / automation depth
        min: 1
        max: 5
        low: Narrower or less evidenced breadth
        high: Broader or deeper retained evidence
        description: Author-assigned ordinal score from retained public evidence only
        scale: ordinal
      points:
        - label: Coralogix
          x: 4.5
          y: 3.5
          tone: positive
          note: "Strongest retained evidence is customer-owned storage, routing economics, and cross-stack positioning."
          claimRefs: [CP001, CP002, CP003, CP012]
        - label: Datadog
          x: 2.5
          y: 5
          tone: warning
          note: "Retained comparisons emphasize 1,000+ integrations and stronger feature breadth than storage economics."
          claimRefs: [CP006]
        - label: New Relic
          x: 2.5
          y: 4
          tone: warning
          note: "Broad platform and free-tier funnel are better evidenced than a storage-control wedge."
          claimRefs: [CP007]
        - label: Dynatrace
          x: 2
          y: 5
          tone: warning
          note: "Retained evidence places Dynatrace highest on deep APM, automation, and AI-assisted RCA."
          claimRefs: [CP008]
        - label: Grafana Cloud
          x: 3.5
          y: 3
          tone: neutral
          note: "Open-stack fit and free-tier substitute are well evidenced, but managed bundled breadth is lower."
          claimRefs: [CP009]
        - label: AWS CloudWatch
          x: 2.5
          y: 2.5
          tone: neutral
          note: "Default AWS-native status quo path, but retained evidence emphasizes higher pricing complexity."
          claimRefs: [CP009]
    approximationNotes: >-
      Coordinates are evidence-backed ordinal judgments synthesized from retained public comparisons, not vendor
      benchmark scores or measured win-rate data.
    claimRefs: [CP003, CP006, CP007, CP008, CP009, CP012]
callouts:
  - calloutType: strength
    title: Best-evidenced wedge
    body: >-
      The strongest public differentiation is not exclusive features but a combined storage-and-economics story:
      keep full-fidelity telemetry in the customer's cloud, route data by value, and avoid per-user or per-host
      pricing.
    claimRefs: [CP002, CP003, CP004, CP012]
  - calloutType: risk
    title: Durability still needs win-rate proof
    body: >-
      The public record shows serious rivals on both ends of the market: Datadog, New Relic, and Dynatrace for
      feature depth, and Grafana-style open stacks for modular substitutes, while Coralogix's public moat lacks
      disclosed switching-cost, churn, or attach-rate evidence.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP012]
