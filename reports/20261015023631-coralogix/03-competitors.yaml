      - ["Unified observability across logs, metrics, traces", "Yes; official site and reviews describe one data layer / full-stack coverage", "Yes, but described only at high level in editorial comparison", "Yes; CubeAPM calls it a broad unified platform", "Yes, but retained comparison emphasizes APM / automation over storage model", "Yes, through Grafana / Prometheus / Loki / Tempo stack"]
      - ["Built-in security + AI observability angle", "Yes; official sources position security plus AI observability on one platform", "Security is noted; AI-specific scope not detailed in retained sources", "Broad tooling is noted; AI-specific scope not detailed in retained sources", "Application security is noted; AI-specific scope not detailed in retained sources", "Usually needs separate tools for SIEM / CSPM in retained comparison"]
      - ["Cost routing / pipeline controls", "Yes; TCO Optimizer and routing are central to the pitch", "Strong product breadth, but retained sources emphasize separate pricing units", "Broad platform, but retained sources do not emphasize routing-based economics", "Retained sources emphasize modular pricing, not routing-based economics", "Adaptive Logs / usage controls are noted, but not the same routed-value pitch"]
      - ["Deep APM / automation leadership", "Good trace visibility, but not the strongest retained claim", "Strong APM + profiling", "Strong APM + broad tooling", "Strongest retained evidence on deep APM and automation", "Useful OSS workflow, but not framed as the deepest enterprise APM option"]
      - ["Best-evidenced fit in retained sources", "Log-heavy teams prioritizing retention cost and storage control", "Feature-first observability teams", "Full-stack teams using a free-tier funnel", "Large enterprises needing deep APM and automation", "Teams already standardized on Grafana OSS"]
    notes: >-
      Unsupported cells are marked explicitly; the matrix uses retained official and editorial evidence only and
      does not assume parity where the source set stayed silent.
    claimRefs: [CP001, CP002, CP004, CP006, CP007, CP008, CP009, CP010, CP012]
  - id: TP003
