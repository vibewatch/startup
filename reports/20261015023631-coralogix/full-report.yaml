  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The public record shows a real enterprise software business, but not a clean revenue model disclosure.
              TechCrunch reported that Coralogix grew revenue by more than 60% over the prior year, had about 30
              customers spending more than $1 million annually, and had already surpassed $100 million in annualized
              revenue more than a year before June 2026, while declining to disclose the current figure. Official June
              2026 materials add that the company serves more than 5,000 customers worldwide and processes petabytes of
              production data daily across eight regions. That supports a usage-heavy enterprise observability model
              with meaningful large-account concentration at the top end, but the public sources still do not split
              recurring platform spend from services, security add-ons, or newer AI products.
