      - number: '4.2'
        title: Monetization signals and cost structure proxies
        blocks:
          - type: paragraph
            body: >-
              Coralogix's own materials consistently position monetization around full-fidelity telemetry ingestion,
              streaming analytics, open formats, and customer-owned storage rather than seat-based pricing. The homepage
              markets a 14-day all-features trial and a promise to let customers monitor four times more data at lower
              cost, while TAMradar describes complete ingestion in the customer's own cloud with unlimited users and
              sources. Those signals imply that revenue likely scales with data volume, retained history, and enterprise
              workflow breadth, with AI investigation and security modules as expansion vectors. What is missing is the
              part that matters for underwriting: no public price card, realized discounting, gross margin, CAC,
              payback, or disclosed services mix appears in the retained sources, so the unit-economics story remains
              directional rather than auditable.
