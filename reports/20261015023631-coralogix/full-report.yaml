              - CE006
              - CE008
          - type: callout
            title: Independent proof trails the ambition of the product story
            body: >-
              The public record is rich in launch language and benchmark claims, but still weak on independent
              validation of security controls, production reliability, and adoption depth for the newer AI modules.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base appears broad by logo and vertical, but the customer definition is still loose
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real and fairly broad enterprise customer footprint. Coralogix said in March
              2025 that it had over 2,000 enterprise customers globally, then said in June 2026 that it was trusted by
              more than 5,000 customers worldwide, naming IBM, Tradeweb, and JFrog as examples. The case-study inventory
              also spans fintech, cybersecurity, consumer internet, cloud infrastructure, and retail brands, which
              suggests the platform is not concentrated in a single niche workload. That said, the disclosures are not
              like-for-like: one statement uses enterprise customers, the later one uses customers worldwide, and none
              of the retained sources explains paid versus free accounts, active deployments versus logos, or revenue
              concentration by segment. The chapter therefore supports breadth and momentum more strongly than exact mix
              or monetized depth.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU009
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU008
      - number: '6.2'
        title: Named proof is real and operational, but still mostly case-study shaped
        blocks:
          - type: paragraph
            body: >-
              Coralogix clears the basic adoption-proof bar because public evidence goes beyond an unlabeled logo wall.
              CaseStudies.com listed 37 customer success stories at capture time, and the visible roster includes named
              operators such as AGS, Armis, Curve, Imperva, monday.com, Nutanix, Payoneer, Proofpoint, PUMA, and
              Razorpay. The individual summaries emphasize operational outcomes such as lower observability cost, faster
              incident response, migration speed, or increased log volume without proportional spend. Company-issued
              benchmark material strengthens the picture by showing very large telemetry volumes already moving through
              the platform. Even so, most of the visible proof is curated: public sources are much stronger on anecdotal
              operating wins than on production tenure, rollout size, multiyear renewal behavior, or cohort expansion by
              module.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.3'
        title: Expansion vectors are visible; retention and concentration remain the main diligence blind spots
        blocks:
          - type: paragraph
            body: >-
              The most plausible customer-motion story is land on observability economics, then expand across signals
              and newer AI or security workloads. The homepage offers a 14-day, full-feature trial with no credit card,
              which lowers evaluation friction, while product messaging consistently bundles logs, metrics, traces,
              security, and AI observability under one stack. Public case-study evidence also reaches into
              Snowbit-branded security deployments, and the AI Center launch shows Coralogix pushing for a broader
              budget owner than classic SRE alone. The main caution comes from independent review coverage: Modern Data
              Tools says buyers should validate scale requirements directly and flags ecosystem depth, learning curve,
              dashboard polish, and documentation quality as trade-offs. More importantly, none of the retained sources
              discloses NRR, GRR, churn, contract duration, or top-customer concentration, so durability still depends
              on management diligence rather than public evidence.
            claimRefs:
              - CU004
              - CU005
              - CU011
              - CU012
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU008
              - CU011
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named proof is stronger than the average private-software logo wall
            body: >-
              The retained public record includes dozens of named stories, quantified outcome blurbs, and very large
              telemetry-workload claims, which is materially better than a bare customer-logo page.
            calloutType: strength
            claimRefs:
              - CU006
              - CU008
              - CU009
          - type: callout
            title: Durability evidence still lags adoption evidence
            body: >-
              Public materials do not reveal retention, churn, contract length, or concentration, so customer quality
              must still be underwritten through management diligence rather than external proof.
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              The top risk is not a single public lawsuit or outage disclosed in the assigned pool; it is the cumulative
              execution burden created by Coralogix's own positioning. The company is selling full-fidelity, AI-native
              observability into security- and compliance-sensitive buyers while promising regional deployment,
              customer-owned storage, long-term retention, and agent-facing workflows. That combination can be
              strategically powerful, but it raises the bar on privacy controls, reliability, and cost discipline
              simultaneously. The public record in this pool also puts those claims against late-stage expectations:
              Coralogix's June 2026 Series F took total funding to $550 million, while third-party profiles tie the
              company to a $1.6 billion valuation, 5,000+ customers, and petabyte-scale daily production data. The
              heatmap therefore ranks data-governance, platform reliability, and financial-proof gaps above softer
              category risks.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: Legal and regulatory exposure centers on privacy-safe telemetry claims
        blocks:
          - type: paragraph
            body: >-
              Coralogix's public risk narrative is unusually explicit about why legal and regulatory exposure matters.
              The Skyflow partnership says observability logs often contain sensitive customer data in both structured
              and unstructured fields, while Coralogix's AI security materials call out prompt injection, data leaks,
              PII exposure, and policy-violation monitoring as live operating concerns. The company's mitigation story
              is coherent: region-specific deployment, governed tokenization, policy-based rehydration, and compliance
              reporting around AI prompts and responses. The unresolved problem is verification. The assigned pool does
              not independently confirm the current certification set, disclosed incident record, or regulator-facing
              audit outcomes behind these claims. That leaves the legal risk register centered on control substantiation
              rather than a known enforcement action.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
      - number: '7.3'
        title: Operational and dependency risk rises with scale, open retention, and partner layers
        blocks:
          - type: paragraph
            body: >-
              Coralogix is making ambitious operating promises. Its AI security page advertises sub-millisecond alert
              detection, 99.9% uptime, and 10x data-ingestion capacity, while the company homepage says nothing is
              indexed and the full record lands in the customer's own cloud. Those are attractive claims, but they push
              execution risk into several places at once: ingesting and querying very large telemetry volumes,
              preserving customer-owned data portability, keeping agent-facing interfaces safe, and preventing runaway
              spend as AI usage grows. The company partially mitigates this with AI-specific posture management,
              token-usage tracking, and a named privacy partner in Skyflow. Still, the same public materials imply
              dependency on partner technology, hyperscaler-region availability, and disciplined operating execution to
              keep the architecture's cost and reliability promises intact.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR011
              - CR013
      - number: '7.4'
        title: Underwriting should focus on proof gaps more than category ambition
        blocks:
          - type: paragraph
            body: >-
              The underwriting implication is that Coralogix may be strategically well-positioned yet still too opaque
              for aggressive risk discounting. Olam reports a $150-200 million revenue run rate and a path toward
              profitability, while Tracxn records 196 active competitors and a $1.6 billion valuation benchmark. That
              means investors are being asked to underwrite category leadership, cost-performance differentiation, and
              durable expansion simultaneously. The public mitigations are real, but the chapter's missing data matters
              more: independent proof of certifications and incident history, renewal and concentration metrics, and
              partner or cloud dependency details. A practical kill-criteria set is therefore measurable: evidence of
              regulated-customer control failures, repeated reliability misses against stated platform standards, or
              weak retention/concentration data that would undermine the case for underwriting a late-stage
              observability platform at current scale.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria
            body: >-
              Break the investment case if diligence shows repeated reliability misses against stated platform
              standards, weak regulated-customer control evidence, or retention and concentration data that materially
              weaken the justification for a $1.6 billion late-stage valuation.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR008
              - CR009
              - CR014
          - type: callout
            title: Best visible mitigation
            body: >-
              The strongest mitigation already visible in public materials is architectural alignment: customer-owned
              storage, regional deployment, AI-specific posture monitoring, and a named privacy partner all point to
              thoughtful design; what remains missing is independent proof that those controls are working at current
              scale.
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR011
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a price-sensitive track call rather than a buy call. Coralogix clearly has a
              differentiated platform narrative around customer-owned storage, open formats, full-fidelity ingestion,
              and an interface layer built for Olly, MCP, and CLI workflows rather than only dashboard-led monitoring.
              The June 2026 Series F also confirms investor appetite and visible commercial scale. Even so, that
              positive story is not enough on its own to justify an immediate late-stage underwriting decision, because
              the same public record remains thin on ARR, retention, gross margin, free-cash-flow trajectory, and the
              actual preference stack behind the latest round. That combination argues for staying engaged while
              requiring either better disclosure or better entry terms before moving to a buy recommendation.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Valuation context and scenario envelope
        blocks:
          - type: paragraph
            body: >-
              Public valuation support is directionally positive but still imprecise. Secondary trackers place Coralogix
              at about $1.6B post-money in June 2026 and imply roughly $1.4B pre-money, while the official funding
              release stops at the capital raise and total funding tally. That leaves scenario analysis doing more work
              than hard multiple math. The bull case depends on AI observability, security-adjacent expansion, and
              enterprise adoption translating into durable monetization and stronger pricing power. The base case
              assumes continued growth and strategic relevance, but only moderate return potential from the current mark
              until revenue-quality evidence improves. The bear case is that investors paid ahead of durable proof and
              late-stage downside emerges if cost discipline, AI usefulness, or net retention disappoint. Tracxn
              identifies Sumo Logic, New Relic, and Observe as close functional competitors, but the retained evidence
              does not provide a normalized current trading-multiple set, so these names frame market alternatives
              rather than support a precise price target.
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should focus less on product story and more on underwriting mechanics. Management
              needs to reconcile the reported valuation math, explain why secondary trackers show more cumulative
              funding than the official release, and disclose whether the Series F changed liquidation preferences,
              board rights, or dilution in a way that compresses common-equity returns. Just as important, buyers need
              cohort evidence on AI-observability monetization, module attach, renewal quality, and whether
              customer-owned-storage economics actually translate into durable account expansion rather than simply
              higher telemetry usage. The thesis breaks if disclosure stays closed while cost complaints persist or if
              the AI layer proves easier for larger observability vendors to match. One lower-weight outlet disputes
              that the 2026 Series F occurred, contrary to the company, Tracxn, ChannelE2E, FinTech Global, and The
              Stack; executed financing documents should resolve that conflict before investment.
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track. Coralogix appears strategically relevant and commercially credible, but the current public record
              does not support a confident buy case at the reported late-stage valuation.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV011
          - type: callout
            title: Thesis-break triggers
            body: >-
              A weaker call follows if net retention, margin, or cash-efficiency data disappoints, if Series F terms
              prove investor-protective in a way that limits upside for new money, or if customer feedback keeps
              pointing to cost and product-friction issues without offsetting monetization proof.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV013
