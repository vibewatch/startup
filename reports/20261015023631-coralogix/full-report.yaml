        title: Identity, platform, and footprint
        blocks:
          - type: paragraph
            body: >-
              Coralogix presents itself as an AI-native observability platform spanning systems, security, and AI
              workloads, with the company homepage and July 2026 Gartner announcement both emphasizing one data layer,
              open formats, and machine-oriented investigation workflows rather than dashboard-only usage. The
              open-source record consistently places the company's founding in 2014 and its current commercial center in
              Boston, while third-party profiles also show operating footprint across Israel, Europe, India, and the US.
              That makes the base identity reusable for later chapters: late-stage private company, founder-led product
              narrative, and a platform story built around customer-owned storage and AI-assisted operations rather than
              point monitoring tools.
