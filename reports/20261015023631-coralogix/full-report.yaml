            body: >-
              More than 5,000 customers, about 30 seven-figure accounts, and annualized revenue above $100 million
              before June 2026 support real enterprise traction. What the public record still does not show is how much
              of that scale is recurring platform revenue versus services, security add-ons, or newer AI products.
            calloutType: insight
            claimRefs:
