      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The Series F materially reduces near-term financing pressure, but it does not eliminate diligence risk.
              TechCrunch said management did not raise because it needed immediate runway, and quoted the company as not
              expecting to raise additional capital while working toward profitability over the next few years. Official
              sources say the new money is earmarked for AI-native observability, telemetry infrastructure, and global
              enterprise expansion. That supports a forward plan built around offensive investment rather than distress
              financing. Still, the assigned public record does not disclose cash on hand, debt obligations, burn, free
              cash flow, retention, churn, contract duration, customer concentration, or the Series F economic terms.
              The financial verdict is therefore scale with momentum, but incomplete evidence on revenue quality, margin
              path, and capital efficiency.
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI012
              - CI013
