      - number: '3.3'
        title: Durability, switching, and pressure points
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports Coralogix's wedge also defines its competitive risk. Public reviews say
              Datadog remains stronger for feature-first buyers, New Relic keeps a free-tier and unified-platform
              funnel, Dynatrace is stronger on deep APM and automation, and Grafana Cloud remains the default substitute
              for teams already committed to an open-source observability stack. Toolradar also highlights a practical
              weakness in Coralogix's packaging: the unit model can be harder to understand, fast-query performance has
              explicit limits, and careless routing can still let costs climb. Coralogix is broadening into AI
              observability, AI security posture, MCP, and CLI workflows, but the public record still does not show hard
              switching-cost data, win-rate data, or attach-rate data that would prove that this breadth is a durable
              moat rather than an expanding comparison set.
