  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Coralogix layers ingestion, customer-owned storage, shared query access, and multiple human/agent interfaces on
      the same telemetry foundation.
    data:
      layers:
        - label: Telemetry inputs
          detail: Operational, security, and AI-interaction exhaust feed one platform.
          modules:
            - Logs / metrics / traces
            - Security events
            - AI prompts, responses, and sessions
        - label: In-stream analysis
          detail: Alerting, parsing, enrichment, and anomaly detection run before long-term storage.
          modules:
            - Stream processing
            - Real-time metrics / alerts
        - label: Customer-owned Telemetry Lake
          detail: Raw data is stored in the customer's cloud in open formats for long-term retention.
          modules:
            - Open-format storage
            - No rehydration workflow
        - label: Shared query + dataset layer
          detail: One query/data model is presented for both live and historical telemetry.
          modules:
            - DataPrime / query layer
            - Reusable datasets
        - label: Cross-stack product surfaces
          detail: The platform spans systems, security, and AI observability rather than a single dashboard category.
          modules:
            - APM / infrastructure / RUM
            - Security analytics / AI-SPM
            - AI Center
        - label: Human and agent interfaces
          detail: Multiple interfaces consume the same data foundation.
          modules:
            - Dashboards
            - Olly conversational investigator
            - MCP + CLI automation
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE008
  - id: FU001
    title: Publicly visible customer journey surfaces
    type: journey-map
    summary: >-
      Public evidence supports evaluation, scaled production usage, and cross-stack expansion steps, but not the renewal
      economics needed to prove durability.
    data:
      items:
        - label: Discover fit
          actor: Platform engineering / SRE buyer
          phase: Entry
          channel: Official site and independent review
          touchpoints:
            - 14-day, full-feature trial with no credit card
            - Independent framing around high-volume telemetry and cost control
        - label: Validate economics
          actor: Platform owner plus finance / engineering leadership
          phase: Commercial evaluation
          channel: Pricing and architecture review
          touchpoints:
            - Usage-based pricing starting at $0.06/GB
            - Need to validate routing discipline and real budget threshold directly
        - label: Initial production deployment
          actor: Observability and operations teams
          phase: Adoption
          channel: Named case studies
          touchpoints:
            - 37 public customer success stories listed at capture
            - Outcome language centers on cost savings, migration speed, and incident response
        - label: Cross-stack expansion
          actor: Security and AI teams
          phase: Expansion
          channel: Broader product surface
          touchpoints:
            - Snowbit-branded security case studies appear in the public roster
            - AI Center launch extends the platform into AI quality, security, and governance
        - label: Scaled telemetry footprint
          actor: Large enterprise engineering teams
          phase: Mature usage
          channel: Benchmark publication
          touchpoints:
            - Company benchmark cites more than 4 billion queries and approximately 50 petabytes in seven days
            - One benchmark account is described at roughly 40 TB/day
        - label: Renewal / concentration review
          actor: Executive sponsor, procurement, and investor
          phase: Durability check
          channel: Public disclosure gap
          touchpoints:
            - NRR, GRR, churn, contract duration, and top-customer concentration are not disclosed in retained sources
            - Durability still requires direct diligence rather than public evidence
