            body: >-
              Management says the Series F was not raised for immediate runway and that Coralogix does not expect to
              raise more capital soon, but public sources do not disclose cash, burn, free cash flow, debt, retention,
              or round economics. That leaves capital efficiency and next-round risk unresolved despite the large
