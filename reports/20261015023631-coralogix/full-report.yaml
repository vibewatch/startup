  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary shifted from observability tooling to an AI-era control layer
        blocks:
          - type: paragraph
            body: >-
              Coralogix's addressable market is broader than classic log management or APM. The company and multiple
              third-party sources describe one platform that spans logs, metrics, traces, security analytics, and AI
              observability, with customer-owned storage and open formats as part of the pitch. That means the included
              spend sits at the intersection of core observability budgets, selected SIEM/security-analytics budgets,
              and the newer AI-governance / AI-performance budget emerging around production AI agents. The practical
              substitute is still the status quo stack of several point tools plus sampled retention, but Coralogix is
              trying to displace that with a single data layer and AI-facing interface. What is excluded from this
              market boundary in the assigned evidence is general cloud infrastructure spend, generic data warehousing,
              or broad cybersecurity platforms that do not operate as the day-to-day telemetry and incident
              investigation layer. The boundary matters because valuation will depend less on whether observability is a
              large headline market and more on whether Coralogix can keep expanding from SRE workflows into security
              and AI operations without becoming a thin feature on top of existing buyer stacks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
      - number: '2.2'
        title: Public evidence supports constrained sizing lenses, not a clean TAM stack
        blocks:
          - type: paragraph
            body: >-
              The strongest current sizing signals in the assigned pool are operating scale and contract bands, not an
              external category model. Company-issued and trade coverage says Coralogix serves more than 5,000 customers
              worldwide, processes petabytes of production data daily across eight regions, and had already crossed
              2,000 enterprise customers by March 2025. AICoolies adds one monetization lens by placing typical annual
              spend between $15,000 and $75,000, with larger enterprise deployments at $300,000 or more depending on
              data volume. Tracxn adds another lens by showing a crowded field of 196 active competitors, which supports
              the idea of a real market but also suggests Coralogix competes in an already dense category rather than
              owning a greenfield budget. These proxies are useful for underwriting adoption velocity and commercial
              range, but they are not the same as a sourced TAM, SAM, or SOM. The chapter therefore treats public market
              sizing as evidence-constrained and avoids inventing a broad spend estimate that the assigned pool cannot
              support.
