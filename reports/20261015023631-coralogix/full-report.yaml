      - number: '3.2'
        title: Architecture and packaging wedge
        blocks:
          - type: paragraph
            body: >-
              Coralogix's clearest public wedge is architectural and commercial rather than ecosystem-based. Official
              sources repeatedly emphasize full-fidelity ingestion, real-time streaming analytics, open formats, and
              customer-owned storage, while retained reviews translate that into a buying story for log-heavy teams that
              care about retention cost and data portability. Public packaging reinforces the same message: no per-user
              or per-host pricing, transparent list rates for logs, traces, metrics, and AI telemetry, and a platform
              narrative built around routing telemetry by value instead of indexing everything first. That proposition
              is meaningful against Datadog, New Relic, and Dynatrace, but it is most differentiated when the buyer is
              cost-sensitive, multi-cloud, or worried about long-term storage lock-in.
            claimRefs:
              - CP001
              - CP002
