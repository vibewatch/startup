      - number: '5.4'
        title: Trust, controls, and open risks
        blocks:
          - type: paragraph
            body: >-
              Public evidence is materially weaker on trust and control depth than on product breadth. Retained sources
              do show that Coralogix is thinking about PII leakage, prompt injection, suspicious usage, and
              regulated-industry positioning, and they describe a buyer proposition built around customer-owned storage
              and regional control. But the same retained set does not provide independent proof of uptime history,
              privacy-boundary design, control-plane architecture, or how well newer AI modules perform in production
              outside vendor-selected examples. Third-party summaries also flag learning-curve, pricing, and
              synthetic-monitoring gaps, which means diligence should test whether the architecture advantage outweighs
              operational complexity for the buyer's actual telemetry and AI workload.
