          defend on downside-adjusted returns.
        - Management disclosure of board-level KPIs and round terms would materially reduce valuation uncertainty.
      - - Swing factor
        - >-
          Customer-owned-storage economics and AI workflow adoption must turn into repeatable upsell rather than only
          usage growth or product attention.
        - Evidence of high retention, attach rates, and efficient expansion would justify a more constructive stance.
      - - Comparable constraint
        - >-
          Sumo Logic, New Relic, and Observe are functional references but the retained evidence lacks normalized
          current multiples.
        - Add current public filings and transaction data before translating the peer set into a price target.
    notes: >-
      Rows separate strategic upside from underwriting gaps; the table is analytical rather than a substitute for
      private diligence materials.
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV010
      - CV012
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
    rows:
      - - Bull
        - >-
          AI observability and security-adjacent modules become higher-value expansion wedges while customer scale and
          data-ownership positioning stay differentiated.
        - The current mark can look justified if durable monetization and stronger enterprise proof emerge quickly.
        - >-
          Would require independent proof of attach, retention, and efficient growth rather than only platform
          narrative.
      - - Base
        - >-
          Coralogix continues growing and remains strategically relevant, but the market still lacks enough public
          evidence on revenue quality and round economics.
        - >-
          Returns from the reported valuation depend on execution and future disclosure rather than obvious mispricing
          today.
        - Best fit with the current evidence set because strength is visible but precision is limited.
      - - Bear
        - >-
          Cost-management friction, weaker AI utility, or late-stage term overhang emerges before economics are fully
          de-risked.
        - >-
          Even continued product relevance could still produce mediocre entry returns if the mark outruns durable
          fundamentals.
        - Most likely if disclosure remains thin and customer pain points prove persistent.
    notes: >-
      Scenarios are directional because the chapter lacks disclosed ARR, margin, burn, retention, and preference-stack
      data needed for precise valuation modeling.
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
