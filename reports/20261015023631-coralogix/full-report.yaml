  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              Coralogix is not pitching a single monitoring screen; it is pitching an AI-native, cross-stack
              observability platform that spans systems, security, and AI workloads, then exposes that platform through
              both conventional product modules and agent-facing interfaces. The current public package combines a core
              observability surface (logs, metrics, traces, RUM, security analytics), a newer AI Center for LLM
              monitoring and guardrails, and multiple investigation entry points including Olly, MCP, and a CLI.
              Independent summaries broadly corroborate the breadth of that module set, but they do not add much
              architectural depth beyond the vendor story, so module breadth is easier to verify than module adoption or
              attach rates.
            claimRefs:
