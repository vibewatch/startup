  - id: TI006
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Public status
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Product-line ARR mix
        - Not disclosed
        - Prevents clean separation of compliance software, investigations, Beacon, API, and services economics
        - Request monthly recurring revenue bridge by module and segment for the last eight quarters
      - - Realized pricing and discounting
        - Not disclosed
        - Blocks view on ASP durability, bundling strategy, and reseller/channel effects
        - Review executed contracts, price books, and discount approval logs
      - - Gross margin by module
        - Not disclosed
        - Margin path cannot be judged without separating software from delivery-heavy work
        - Request segment gross-margin waterfall and cost-of-revenue allocation methodology
      - - CAC / payback by segment
        - Not disclosed
        - Sales efficiency and capital intensity remain opaque
        - Review pipeline conversion, fully loaded CAC, and payback by buyer type
      - - NRR / churn / renewal cohorts
        - Not disclosed
        - Expansion quality and retention durability are not underwritable
        - Request cohort tables by module, segment, and customer vintage
      - - Current cash, burn, and runway
        - Not disclosed
        - Cannot assess financing dependency after the Series C
        - Request cash balances, 13-week cash forecast, and quarterly base/bear burn plan
      - - Customer concentration and segment mix
        - Not disclosed
        - A few banks, agencies, or exchanges could dominate ARR without investors seeing it
        - Review top-20 customer ARR, segment share, and renewal calendar
      - - Debt and contingent obligations
        - No public disclosure surfaced
        - Hidden covenants or guarantees could change downside risk materially
        - Request debt agreements, covenant package, and any indemnity or litigation reserve schedule
    notes: >-
      This table is intentionally diligence-oriented: the key public fact is not the numeric value,
      but that the value is unavailable.
    claimRefs:
      - CI022
      - CI027
      - CI028
      - CI029
