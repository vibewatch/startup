callouts:
  - calloutType: strength
    title: Strong demand signals, weak pricing visibility
    body: >-
      TRM has enough public customer, partner, and ecosystem proof to support the existence of real demand,
      but almost no public evidence on realized pricing, retention, or margin quality.
    claimRefs:
      - CI003
      - CI008
      - CI009
      - CI012
      - CI029

  - calloutType: risk
    title: The margin path is the core diligence risk
    body: >-
      Investors should avoid assuming TRM is a pure high-margin software model until management separates
      screening, monitoring, investigations, Beacon, and services economics in a data room.
    claimRefs:
      - CI017
      - CI028
      - CI035
      - CI036
      - CI040

  - calloutType: insight
    title: The Series C improves solvency more than visibility
    body: >-
      The raise clearly strengthens the balance sheet, but without cash, burn, runway, and debt detail it
      does not answer whether TRM can self-fund its next phase of AI and go-to-market investment.
    claimRefs:
      - CI001
      - CI002
      - CI026
      - CI027
      - CI039
