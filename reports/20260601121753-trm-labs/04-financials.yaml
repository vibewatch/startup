  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-mix-gap
      missingEvidence: Product-line ARR and recognized revenue split across screening, monitoring, investigations, Beacon, API/data, and services.
      whyItMatters: Revenue quality and margin path depend on how much revenue is pure software versus delivery-heavy support work.
      diligencePath: Request monthly recurring revenue and recognized revenue bridges by module for the last eight quarters.
      relatedTableRefs:
        - TI001
        - TI006
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Executed contracts or price books showing realized ASPs, discount ladders, and overage terms.
      whyItMatters: Public list-pricing absence makes it impossible to judge pricing power or contract efficiency from outside.
      diligencePath: Review redlined customer contracts, order forms, and discount approvals by product family.
      relatedTableRefs:
        - TI002
        - TI006
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics-gap
      missingEvidence: Gross margin, CAC, payback, NRR, churn, and sales-cycle data by segment and module.
      whyItMatters: These metrics determine whether TRM compounds like durable software or behaves more like a service-heavy regtech vendor.
      diligencePath: Request cohort retention tables, segment CAC model, and cost-of-revenue allocation for each product line.
      relatedTableRefs:
        - TI004
        - TI006
    - type: private-evidence-only
      severity: blocking
      topic: cash-disclosure-gap
      missingEvidence: Cash on hand, monthly burn, runway, and any debt or contingent obligations after the Series C close.
      whyItMatters: The round size alone does not show whether TRM has multi-year runway or only near-term flexibility.
      diligencePath: Review month-end cash balances, 13-week cash forecast, debt schedule, and board fundraising plan.
      relatedTableRefs:
        - TI005
        - TI006
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Customer concentration, segment mix, top-account ARR, and renewal calendar by bank, agency, exchange, and stablecoin cohort.
      whyItMatters: A concentrated revenue base can look diversified in logos while remaining risky in dollars.
      diligencePath: Request top-20 customer schedule, segment ARR mix, and cohort renewals with expansion history.
      relatedTableRefs:
        - TI003
        - TI006
