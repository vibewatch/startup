company:
  name: TRM Labs
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports TRM Labs as a real compliance-and-investigations software business with
    strong demand proxies, no public list pricing, and a newly strengthened balance sheet after a $70
    million Series C at a $1 billion valuation. The underwriting problem is precision rather than
    existence: product-line ARR, realized pricing, gross margin, CAC, NRR, cash, burn, runway, and
    customer concentration remain undisclosed, so TRM looks credible but not fully modelable from the
    public record alone.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, modules, and pricing opacity
    body: |-
      TRM's public surface describes a layered commercial stack rather than a single forensic seat license. The company sells wallet screening and transaction monitoring into compliance workflows, broader blockchain-intelligence and investigations products into analysts and public-sector investigators, API-style sanctions and screening integrations into customer systems, and Beacon Network into a shared intelligence layer that can reinforce retention if customers participate deeply. The case-study library and investigations positioning also imply a non-trivial services and training attach, because the workflow frequently involves onboarding, case support, and operationalization rather than pure self-serve software. That read is reinforced by TRM-authored case studies featuring Coinbase with West Midlands Police, a separate Coinbase-linked high-stakes case, and Czech organized-crime investigators, which look more like operational deployments than commodity self-serve tooling. What is missing is almost every monetization detail an investor would want. None of the official product or solution pages in this corpus exposes list pricing, a self-serve purchase path, or public discount ladders. The cleanest read is enterprise quote-based contracting with recurring revenue characteristics, but realized ASPs, bundle structure, contract duration, and software-versus-services mix remain opaque.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI011
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI030
