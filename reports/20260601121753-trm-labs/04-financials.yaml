      - TI005
    figureRefs:
      - FI003

  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: |-
      My financial verdict is that TRM probably has good underlying revenue quality but weak public underwriteability. The company appears to sell mission-critical compliance and investigations workflows into banks, stablecoin infrastructure, crypto businesses, and public-sector agencies, which usually supports recurring budgets and sticky integrations. Beacon could further strengthen retention if it becomes a genuine network layer. The problem is that every margin-sensitive question remains open in public: software-versus-services mix, realized pricing, gross margin by module, customer concentration, CAC and payback, net retention, and current cash runway. Because official pricing is absent and the service component looks real, investors cannot safely assume a pure high-margin software model. Because public analog filings exist, the disclosure gap is easy to see rather than hypothetical. TRM therefore screens as a credible, well-funded company worth deeper diligence, but not one whose financial trajectory can be fully underwritten without a data room.
    claimRefs:
      - CI029
      - CI030
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI040
      - CI042
    tableRefs:
      - TI006
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue stream
      - Public mechanism
      - Likely unit
      - Current status
      - Revenue quality
      - Diligence ask
    rows:
      - - Wallet screening
        - Wallet risk is assessed before transaction authorization with configurable risk indicators.
        - Subscription plus usage and rule-set scope
        - Confirmed product
        - High if embedded in approvals workflow
        - Break out ACV, usage overages, and gross margin for screening-only accounts
      - - Transaction monitoring
        - Ongoing alerting and behavior-based monitoring for digital-asset activity.
        - Subscription plus monitored volume or alert/workflow scope
        - Confirmed product
        - High recurring potential but pricing basis is opaque
        - Provide monitored-volume tiers, overage economics, and renewal cohorts
      - - Investigations and blockchain intelligence workflows
        - Analysts and agencies use broader intelligence and investigation workflows beyond compliance screening.
        - Seat, workspace, or enterprise platform contract
        - Confirmed product family
        - Sticky if embedded in case management and evidence gathering
        - Provide product-line ARR and software-versus-services mix for investigations customers
      - - API and sanctions integrations
        - TRM documentation shows programmable screening and sanctions workflows for direct system integration.
        - API contract, data access, or enterprise integration package
        - Confirmed integration layer
        - Potentially strong if usage expands inside customer systems
        - Disclose API revenue, request-volume bands, and implementation burden
      - - Beacon and network intelligence
        - Beacon adds a shared intelligence layer across exchanges, law enforcement, DeFi services, and stablecoin issuers.
        - Add-on subscription, network participation fee, or bundle premium
        - Early but confirmed product surface
        - Strategically attractive; monetization still unclear
        - Show Beacon pricing, attach rate, and incremental support cost
      - - Services, training, and case support
        - Case studies and investigations positioning imply onboarding, enablement, and expert-support revenue beside software.
        - Project, retainer, or bundled services line item
        - Inferred from public workflows
        - Useful for expansion but can dilute software margin
        - Quantify services revenue, utilization, and gross margin versus core software
    notes: Public sources confirm the modules and workflow types but not recognized revenue mix, contract duration, or software-versus-services allocation.
