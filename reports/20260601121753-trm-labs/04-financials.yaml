  - id: TI004
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue estimate
        - $78.8M third-party estimate from ZoomInfo
        - Low
        - Directional scale marker for 2026
        - Reconcile against board-approved ARR, GAAP revenue, and deferred revenue
      - - Gross margin
        - null
        - Low
        - Needed to distinguish software economics from service-heavy delivery
        - Provide gross margin by screening, monitoring, investigations, Beacon, and services
      - - CAC / payback
        - null
        - Low
        - Enterprise and public-sector sales can be sticky but expensive; efficiency is unknown
        - Provide CAC, win rate, and payback by segment and channel
      - - Net revenue retention / churn
        - null
        - Low
        - Expansion versus replacement risk determines compounding quality
        - Provide gross and net retention by cohort, segment, and module
      - - Sales cycle
        - null
        - Low
        - Long procurement cycles change working-capital needs and forecast quality
        - Provide median cycle length for banks, crypto businesses, and government buyers
      - - Services intensity
        - Public workflows imply meaningful onboarding, support, and case-assistance content
        - Medium
        - Support load can reduce gross margin and increase headcount dependence
        - Provide services attach rate, utilization, and delivery margin
      - - Pricing realization
        - List pricing not publicly disclosed
        - Medium
        - Without realized ASPs, usage overages, or discounting, revenue quality is only partly visible
        - Provide sample contracts, discount policy, and module-level ASP distribution
    notes: Null means the metric is not disclosed in the reviewed public corpus, not that the value is zero.
