  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public pricing signal
      - Likely contract basis
      - What remains hidden
      - Source note
    rows:
      - - Wallet screening
        - No list price published
        - Quote-based enterprise contract with configurable risk scope
        - Realized ASP, minimum contract size, and overage logic
        - Official product page describes functionality but not commercial terms
      - - Transaction monitoring
        - No list price published
        - Quote-based recurring contract tied to monitoring scope
        - Monitored-volume bands, alert pricing, and discounting
        - Official product page emphasizes flexible rules, not package prices
      - - Investigations workflows
        - No list price published
        - Seat, team, or enterprise platform agreement
        - User-seat economics, bundle mix, and term length
        - Investigations positioning is public; pricing is not
      - - Banking deployments
        - No public package price for bank customers
        - Consultative sale tied to onboarding and compliance workflow redesign
        - Services attach, reseller/channel economics, and bank-specific premiums
        - Banking page uses customer proof and workflow language rather than pricing
      - - Beacon / network intelligence
        - No public monetization schedule published
        - Likely premium module, participation right, or bundle uplift
        - Whether Beacon is revenue-generating, loss-leading, or retention-led
        - Product exists publicly but commercial structure is undisclosed
      - - Services and training
        - No public day-rate or training catalog pricing surfaced
        - Project, retainer, or bundled support line item
        - Utilization, delivery margin, and attach rate
        - Case-study and investigations pages imply support but not price transparency
    notes: This table captures pricing opacity as an underwriting fact; the absence of list pricing does not mean low pricing, only that realized economics are not observable from the public record.
    claimRefs:
