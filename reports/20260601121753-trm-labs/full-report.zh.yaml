      - number: '1.4'
        title: 负面信号和后续尽调事项
        blocks:
          - type: paragraph
            body: >-
              本章公开下行点并不是明确的商业失败信号，而是监控批评与信息不对称的混合。State of Surveillance 认为，区块链分析公司追踪钱包行为，并向政府出售监控能力；这与 TRM
              直接相关，因为它的客户基础明确包括政府机构和金融机构。该批评并不推翻 TRM 的产品，但意味着，随着公司从加密追踪扩展到更宽的 AI 调查叙事，隐私、公民自由和证据规则争议都可能变成采购风险和声誉风险。


              另一个警示更简单：投资人最需要精度的地方，公开证据恰恰变薄。当前收入、当前员工数、累计融资构成、董事会结构和确切投资人控制权，要么未披露，要么外包给市场数据供应商。更小的问题也指向同一方向：旧的
              /blog/introducing-beacon URL 已失效，而新的 Beacon 页面承载了当前叙事，这让历史考古比打磨过的 2025-2026
              年表面信息更难。因此，第一章可以有把握地确认身份、使命、客户覆盖和 2026 年 2 月融资，但后续尽调应先索取股权结构表、组织架构图和治理文件，再把方向性规模标志写成可承销事实。
