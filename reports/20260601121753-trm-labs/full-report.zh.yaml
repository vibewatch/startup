            body: >-
              反向逻辑并不是 TRM 没有需求，而是公开证据仍无法证明，本轮买到的是软件质量经济性，而不是一个任务关键、但部分偏服务且对政策敏感的业务。投资者在承销回报前，仍需要当前
              ARR、NRR、毛利率、收入结构、集中度和优先股堆叠。公开比较实际上强化了这条纪律：Palantir 和 Coinbase 发布 SEC 文件，而 Recorded Future、Cellebrite、NICE
              这组公开区间中的公司或资产，比 TRM 今天提供了更多经营历史披露。若数据室显示 ARR
              高于公开锚点、留存强、毛利率接近软件、股权结构干净，合理估值可以改善为有吸引力。若不是，今天的价格就应被视为打满，而不是便宜。最终尽调清单和投资逻辑破裂触发点，因此比又一轮表面化同业倍数争论更重要；这些私有事实将决定投资者承销的是一项溢价软件资产，还是一家位置不错但定价已经充分的合规供应商。
