    sections:
      - number: '1.1'
        title: 身份、运营范围和商业模式
        blocks:
          - type: paragraph
            body: >-
              TRM 现在公开呈现的身份，比早期“加密分析”的标签更具体。官网首页称，75 个国家的 600+ 家政府机构和金融机构依赖 TRM 的数据、软件和 AI 智能体；关于页面则称，公司正在为 AI
              时代的调查构建操作系统，并从区块链情报扩展到更广泛的威胁领域。2026 年 2 月融资公告把公司锚定在 San Francisco，并把使命表述为打击犯罪网络、应对国家安全威胁。ZoomInfo 补充了 450
              Townsend Street 的具体地址，但这一街道级信息来自数据库，而非 TRM 自有网站确认；因此，最强的标准化地点事实仍是：总部位于 San Francisco，客户基础偏公共部门和受监管金融机构。


              保留下来的产品页面也让商业模式更清楚。TRM 的区块链情报和加密业务页面描述的是运营情报，而非被动分析：覆盖 190+ 条区块链、1.9B+ 项资产和 720+
              座桥，用于风险筛查和跨链追踪。银行与合规页面显示，产品卖进的是工作流重、企业式的用例，例如钱包筛查、交易监控和银行入驻，而不是面向消费者。换句话说，TRM
              的变现核心看起来是自有区块链数据、调查软件、合规工具，以及越来越多卖给机构、银行、交易所和相邻机构的 AI 辅助工作流。后续章节应沿用这一核心运营框架。
