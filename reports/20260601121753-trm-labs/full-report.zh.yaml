      - number: '7.3'
        title: 需求集中、专业厂商竞争和证明缺口可能迅速叠加
        blocks:
          - type: paragraph
            body: >-
              可见的需求信号很强，但它集中在最受政策和采购影响的买方群体。TRM 称 600+ 家政府机构和金融机构依赖其平台，银行页面用 Visa
              证言突出手工工作量下降，产品定位强调可配置控制、广覆盖和更快调查。这些都是优势，但也揭示了依赖网络：受监管金融账户、公共部门工作流和实时信息共享伙伴的权重过高。与此同时，TRM
              并不是单独奔跑。Chainalysis 仍在宣传其对交易所和监管机构的深度渗透；Elliptic 把合规、调查、稳定币风险和新的机构资本组合在一起；Palantir、NICE、Cellebrite
              等相邻公共调查和情报厂商的资本基础，也远大于 TRM 最近披露的 USD 1 billion 估值。威胁环境也没有停下。TRM 自己的犯罪报告称，2025 年非法交易量达到 USD 158
              billion；Xinbi 案例显示，打击行动可能只是转移基础设施，而不是终结活动。公开记录仍看不到 TRM 的实时精确率、召回率、申诉或客户集中度指标时，这组因素恰好把数据质量、速度和覆盖范围的门槛抬高了。
