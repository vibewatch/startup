  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和买方范围
        blocks:
          - type: paragraph
            body: >-
              TRM Labs 并不争夺整个加密软件宇宙。核心支出边界更窄：钱包筛查、交易监控、制裁风险审查、实体归因、调查追踪，以及让交易所、银行、支付公司和公共机构能把这些信号转化为行动的工作流系统。MiCA、FATF 和
              FinCEN 之所以重要，是因为它们把区块链风险处理变成许多机构可审计的运营要求。区块链情报因此是控制技术栈的一部分，而不是可有可无的分析叠加层。


              最清晰的买方拆分有四类。第一类是加密原生交易所、经纪商、托管方和稳定币发行方，它们需要常开筛查和监控才能持续运营。第二类是银行和支付公司，它们增加稳定币、托管或代币化资产产品，因此继承加密特定控制义务。第三类是政府和执法机构，随着诈骗、制裁和网络案件放大，它们需要追踪和查封工作流。第四类是相邻的
              DeFi 和基础设施运营方，它们确实使用情报，但作为重复企业买方的标准化程度较低。这个边界排除了通用 KYC、核心 AML、资金管理软件和支付处理，除非这些工具直接嵌入区块链原生监控或调查能力。
