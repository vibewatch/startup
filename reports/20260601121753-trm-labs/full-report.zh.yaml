        blocks:
          - type: paragraph
            body: >-
              TRM 的公开需求证据多于公开财务证据。官网首页和关于页面称，75 个国家 600+ 家政府机构和金融机构依赖 TRM；解决方案页面则显示，公司覆盖银行和加密原生企业。银行页面引用 Visa
              推荐语，强调减少人工工作量；Circle 公开宣布使用 TRM 做加密合规；HIFI 案例研究把 TRM 放进从第一天开始的稳定币基础设施合规。更多 TRM 案例研究——Coinbase 与 West
              Midlands Police、另一项 Coinbase 相关高风险调查，以及捷克调查员——扩大了交易所相关和公共部门调查工作流的公开参考集。Beacon
              进一步扩展了图景，在实时协调网络中点名一长串交易所和支付公司。这些都是有意义的牵引力代理指标，因为它们显示工作流嵌入、可引用性和多细分覆盖。关于 2026 年融资和后续法律框架工作的外部报道，也把 TRM
              描绘成卖进不断增长的合规与调查负担，而不是收缩小众市场。覆盖主张——190+ 条区块链、1.9B+ 项资产和 720+ 座桥——也暗示产品能支撑更大的企业部署。但销售效率仍主要靠推断。ZoomInfo 的
              $78.8 million 收入估计可作为方向性规模标志，但公开 CAC、销售周期、回本、扩张和流失数据缺席，因此投资人能看到需求，却看不到把需求转化为耐久经常性收入的质量或效率。
