  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Series C 轮给出了真实价格，但还不足以完整支撑投资判断
        blocks:
          - type: paragraph
            body: >-
              最清晰的估值事实就是融资本身。TRM 和 Thoma Bravo 均称，公司在 2026 年 2 月以 $1 billion 估值完成 $70 million Series C 轮融资，过去五年收入年均增长超过
              150%。这让价格真实、近期，而且有内部人参与支撑，不是 2021 年式的陈旧估值标记。更难的问题是本轮是否便宜。公开证据仍要依赖 ZoomInfo 约 $78.8 million 的收入估计，由此推算本轮约为
              12.7x 收入。对一个高速增长的合规平台来说，这个倍数并不荒唐；但在 ARR、留存、毛利率和服务收入占比仍未披露时，它也不是白送价。按今天的价格，正确表述是若数据属实则合理，而不是显然有吸引力。
