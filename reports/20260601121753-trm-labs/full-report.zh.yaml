        - 极高
        - 扩大商业、开发者和跨工作流采用
        - 高
      - - Beacon 参与方
        - 交易所、稳定币发行方、DeFi 服务、执法机构
        - 实时响应网络
        - Beacon 价值取决于广泛具名参与，而不只是 TRM 自身
        - 参与疲劳或分享收窄，会削弱网络优势
        - 高
        - 持续引入参与方，并证明案件结果改善
        - 中到高
      - - 政策社群与法律框架势能
