      - number: '5.3'
        title: 集成深度和信任控制可见，但公开保证仍停留在摘要层
        blocks:
          - type: paragraph
            body: >-
              TRM 的部署故事在工作流边缘比在基础设施核心更容易验证。银行、Circle、HIFI、Persona 和 Sumsub 材料都指向嵌入式部署模式：TRM 凭证、API
              和图谱情报，会插入客户已经使用的入驻、合规和调查系统。信任侧，Compliance Center 明显好过泛泛营销文案，因为它点名 SOC 2 Type II、使用 ISO 27001 框架、GDPR
              原则、冗余地理分散数据中心、年度第三方渗透测试，以及 FedRAMP High
              授权主张。但即便如此，证据也只是摘要层。审计报告、渗透测试摘要和确切认证边界只能按需获取；公开文档没有披露逐产品延迟分布、误报率，或完整支持链 / 支持资产矩阵。这意味着 TRM
              有足够公开信任表面通过初始企业尽调，但不足以替代直接安全审查。公民自由批评也是真实的：随着 TRM 更深进入银行和政府工作流，区块链分析带来的监控与隐私权衡会成为产品风险画像的一部分，而不只是抽象政策辩论。
