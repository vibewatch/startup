        title: 具名部署显示调查和合规中的真实生产工作流，不只是 logo 使用
        blocks:
          - type: paragraph
            body: >-
              本语料中最强的客户证明来自具名部署，且工作流写得清楚。Circle 称，它正在实施 TRM 的全套风险管理工具，用于数字货币交易监控和集成案件管理。HIFI 称，联邦特许银行伙伴对其控制做了尽调，而 TRM
              的钱包归因支撑其交易监控运营。Coinbase 相关的 West Midlands Police 和 FBI 调查显示，TRM Forensics 被用于真实刑事案件；HSI、捷克 NCOZ、Victoria
              Police 的 Operation Taipan、Massachusetts Attorney General's Office 和 Marion County，都展示公共部门或法律用户把 TRM
              工作流用于查封、欺诈、资产追回或调查分诊。


              这些来源仍主要是供应商撰写的客户证明，因此无法回答合同规模、续约节奏或总留存等商业问题。但它们明显好过通用 logo 墙，因为它们识别了买方、用例和实际结果：清退一个误称身份的 HIFI 客户；在 West
              Midlands 案件中追踪超过 80 笔交易；在 Coinbase 相关 FBI 案件中，把暴力入室抢劫团伙与真实身份关联起来；或显示 ICE/HSI 用户试用产品后采购继续。结论是，TRM
              已经足以被判断为运行在生产级客户工作流中；但还不足以说明每个账户在经济上有多耐久。
