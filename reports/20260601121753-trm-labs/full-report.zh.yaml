        title: 情景测算显示平价合理，只有折扣或证据才能让交易更好
        blocks:
          - type: paragraph
            body: >-
              情景分析比故事质量更重要，因为当前轮次已经吃进了大量好消息。悲观情景假设 ZoomInfo 收入锚点高估了真正经常性软件价值，或政府与服务敞口重于预期；这会让公允价值更接近 $0.6 billion 至 $0.8
              billion。基准情景假设公开收入锚点方向正确，增长放缓但仍强，收入质量也足以支撑相对通用软件的小幅溢价；落点约为 $0.9 billion 至 $1.1
              billion，也就是大致等于今天的价格。乐观情景需要的不只是需求叙事：它要求软件式利润率、持久留存和可信的战略退出可选性，才能支撑类似 $1.2 billion 至 $1.6 billion
              的估值。由于当前轮次已接近可支撑区间的中部，正确建议是在 $1 billion 估值继续研究，而不是在本轮或高于本轮盲目买入。
