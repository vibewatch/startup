  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、监控和证据批评是结构性类别风险
        blocks:
          - type: paragraph
            body: >-
              TRM
              所在品类有价值，正因为它把公开链上活动变成可执行情报；但同一功能也长期绑定隐私与证明风险。最尖锐的批评并不说分析厂商没用，而是说它们把无处不在的金融监控正常化，也可能鼓励市场高估聚类或归因到底能证明什么。State
              of Surveillance 称区块链分析公司以监控规模跟踪钱包集群和行为模式，Coin Center 称金融中介已被征召上报大量个人数据，却缺少正常正当程序保护；ACLU
              则把不断扩张的数字足迹视为对隐私、言论自由、安全和平等的威胁。证据端，Frontiers 显示区块链记录在法庭上更重要；USENIX
              案例研究则同时解释了买方为什么愿意付费、以及厂商主张为什么仍有边界：在特定查封服务案件中，准确性证据可以有用，但同一论文也提醒，覆盖范围会随时间变化，泛化很难，不准确标签可能毁掉起诉，甚至造成冤判。对 TRM
              来说，核心下行风险因此是结构性的。公司可以靠更好的工作流、文档和受控复核流程缓释风险，但保留下来的公开记录仍缺少 TRM 专属的法庭采纳情况、申诉统计和实时错误预算披露。
