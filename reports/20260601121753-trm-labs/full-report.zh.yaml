  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁
      - 严重性
      - 重要性
      - 尽调问题
    rows:
      - - 工作流广度
        - TRM 覆盖调查、筛查、监控、银行页面和文档
        - Chainalysis 和 Elliptic 也覆盖核心受监管工作流
        - 高
        - 广度是留在大型 RFP 中的必要条件，但不足以赢单
        - 要求提供按模块拆分、对 Chainalysis 和 Elliptic 的赢单 / 输单细节
      - - Beacon 协同层
        - Beacon 是有具名参与方的实时情报共享网络
        - 使用深度、合作伙伴留存和案件结果提升未公开
        - 中高
        - 如果 Beacon 复利，TRM 获得更难复制的网络优势；否则它只是另一个功能
        - 要求提供月活参与方、事件量和闭环结果
      - - 面向银行的验证
        - TRM 引用 Visa 和专门银行工作流
        - Elliptic 明确押注稳定币和政策姿态，并有新近的银行相关资本
        - 高
        - 机构金融项目很可能是最尖锐的正面战场
        - 比较银行客户 logo、客户证明和续约原因
      - - 在位覆盖差距
        - Chainalysis 显示覆盖 10 大交易所中 9 家和 45+ 家监管机构
        - 即便产品重叠，深植的客户背书也会放慢替换
        - 高
        - 公开证据仍显示，Chainalysis 是许多买方最安全的默认答案
        - 询问过去 12 个月 TRM 从在位部署中赢下多少替换
      - - 模块化拆包风险
        - 小型挑战者和内部栈可覆盖更窄的任务
        - 品类支出分散到更轻工具和内部控制
        - 中
        - TRM 或许守住核心合规预算，但会失去边缘席位扩张或轻量分析师用例
        - 绘制客户在哪些场景多栖采购，哪些场景标准化到 TRM
      - - 隐私和监控反弹
        - 倡议组织批评该品类的监控姿态，同时法院提高证据要求
        - 公民自由阵营和 DeFi 原生阻力可能缩窄可服务需求
        - 中
        - 反弹不会抹掉受监管需求，但会限制品类口碑和扩张
        - 审查误报处理、标签争议和独立验证做法
      - - 商业不透明
        - 官方页面未显示公开标价
        - 投资人看不清赢单来自价格、服务还是产品深度
        - 中
        - 不透明定价可能看起来像企业级优势，却掩盖毛利压力
        - 在 NDA 下获取实际成交价格、平均合同期限和服务组合
    notes: 严重性指相对 TRM 的竞争相关性，不是公司生存风险。登记表有意混合直接竞争者、替代品和品类层面压力，因为三者都会影响护城河耐久性。
