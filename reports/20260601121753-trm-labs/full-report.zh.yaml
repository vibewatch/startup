        - id: workflow-plane
          label: 工作流应用
          detail: 交易监控案件处理、调查与扣押工作流、合作伙伴仪表盘集成，以及银行 / 稳定币合规动作。
        - id: network-and-assurance
          label: 网络与保障层
          detail: Beacon 协作、Chainabuse 告警闭环、合规中心信任控制，以及企业部署打包。
