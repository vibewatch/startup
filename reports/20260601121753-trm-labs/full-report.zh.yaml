companyProfile:
  summary: >-
    TRM Labs 是一家总部位于 San Francisco 的区块链情报公司，为加密合规、调查和制裁筛查提供 AI 驱动工具。公司服务
    Coinbase、Circle、PayPal、Stripe、Robinhood、Visa，以及广泛的公共部门客户群，包括 FBI、IRS 等机构。2026 年 2 月，TRM 完成由 Blockchain Capital 领投的
    $70 million Series C 融资，Goldman Sachs、Bessemer、Thoma Bravo、Citi Ventures、Y Combinator 和 Galaxy Ventures 参投，公司估值达到 $1
    billion。
