      - number: '2.2'
        title: 规模测算视角，以及已发布 TAM 的真实含义
        blocks:
          - type: paragraph
            body: >-
              本文审阅的独立报告，把更宽的加密合规软件类别集中在 2026 年约 $2.8-3.1 billion。Tokenization Compliance 估计为 $2.78 billion；Verified
              Market Reports 估计为 $3.07 billion。PW Consulting 指向 2032 年 $6.86 billion 的终点和 16.5% CAGR，Verified 则预测 2034
              年达到 $8.9 billion、CAGR 10.8%。这些数字有用，但应作为 TRM 的外边界，而不是它可获取市场的精确直接代理。它们把区块链分析、交易监控、Travel Rule
              工具、制裁筛查、案件管理、更宽的 KYC 或身份工具，以及某些咨询或集成工作混在了一起。


              更能站住脚的 TRM 视角，应从最贴近公司产品足迹的切片出发。Tokenization Compliance 称，区块链分析和交易监控约为 $1.05 billion，占 2026 年市场 38%；制裁筛查和
              Travel Rule 层还贡献有意义但较小的资金池。这意味着，以软件为中心的狭义情报层，实际小于标题级类别。多个视角合并后，实用答案是：大类已经支撑一个数十亿美元级市场，但围绕区块链情报的纯软件供应商 SAM
              可能更接近低个位数十亿美元，并且今天大致在 $1-2 billion 左右。
