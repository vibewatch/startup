  - id: TV006
    title: 投资逻辑失效与放弃触发器表
    columns:
      - 触发器
      - 阈值或信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长回归常态
        - 增长大幅低于超高速增长，且没有利润率证据抵消。
        - 相对软件中位数的溢价会迅速消失。
        - 按更接近悲观情景重切估值，或直接放弃。
      - - 服务占比高
        - 大量收入来自项目或调查工作，而不是经常性软件。
        - 当前倍数会高估收入质量。
        - 下调建议，并要求更低入场价格。
      - - 政府集中度
        - 过多收入依赖少数机构或年度采购周期。
        - 耐久性会转化为集中度和预算风险。
        - 除非利润率和续约质量极强，否则把估值视为偏高。
      - - 股权结构表悬顶
        - 优先权或老股交易吃掉过多退出价值。
        - 公平的头条估值不再转化为公平的投资者回报。
        - 暂停，直到完全理解股权结构表条款。
      - - 政策反弹
        - 隐私或监控批评实质压缩可触达采用空间。
        - 倍数扩张逻辑坍塌，下行情景抬升。
        - 视严重程度转为观察或回避。
    notes: 这些是行动导向的放弃触发器，不是背景风险。一旦触发，建议应改变， 不只是改叙事。
