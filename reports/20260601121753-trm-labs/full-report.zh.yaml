  - id: TV004
    title: 政府收入权重的估值溢价桥接表
    columns:
      - 信号
      - 溢价情景
      - 折价情景
      - 净承销影响
    rows:
      - - 关键任务买方群
        - 执法机构、监管方和银行让问题长期紧迫。
        - 预算可能推进慢、政治性强、采购流程重。
        - 支撑一定溢价，但前提是销售周期和集中度可控。
      - - 安全与认证
        - FedRAMP 式准备度在该品类里是真实差异点。
        - 满足政府级要求可能抬高支持成本、拉长销售周期。
        - 对耐久性给溢价；对速度和利润率可见度给折价。
      - - 收入韧性
        - 政府项目可能比可自由裁量的加密支出更扛周期。
        - 便利终止条款和年度预算仍然重要。
        - 净影响为正，但更像 Palantir，不像纯 SMB SaaS。
      - - 声誉姿态
        - 公共部门信任能验证产品重要性。
        - 隐私和监控批评可能拖慢采用，或压住倍数扩张。
        - 溢价不应走到完整 AI 热度倍数。
      - - 证据质量
        - TRM 明确面向公共和私营机构营销。
        - TRM 没有披露实际收入拆分，也没有披露分业务利润率。
        - 数据室证明收入质量前，溢价应保持克制。
