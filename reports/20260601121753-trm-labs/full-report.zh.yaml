          label: 影响持久性
        - from: revenue
          to: valuation
          label: 支撑倍数
        - from: proof
          to: valuation
          label: 支撑可信度
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: TRM 的护城河和风险都系于一张外部网络：监管机构、受监管买方和网络参与方，均不在公司直接控制之下。
    approximationNotes: 这张图概括外部依赖和可缓释风险的触点，而不是合同经济性。
    claimRefs:
      - CR001
      - CR007
      - CR009
      - CR010
      - CR018
      - CR020
      - CR021
      - CR043
      - CR044
      - CR049
    data:
      nodes:
        - id: regulators
          label: 监管机构 / 政策
        - id: banks
          label: 银行与金融机构
        - id: agencies
          label: 政府机构
        - id: participants
          label: Beacon 参与方
        - id: docs
          label: 文档 / API / 工作流
        - id: trm
          label: TRM 平台
        - id: response
          label: 调查 / 响应速度
        - id: trust
          label: 客户信任
      edges:
        - from: regulators
          to: banks
          label: 准许 / 约束
        - from: regulators
          to: agencies
          label: 影响优先级
        - from: banks
          to: trm
          label: 采购 / 比较
        - from: agencies
          to: trm
          label: 采购 / 影响
        - from: participants
          to: response
          label: 共享情报
        - from: docs
          to: trm
          label: 支持集成
        - from: trm
          to: response
          label: 编排
        - from: response
          to: trust
          label: 支撑结果
        - from: participants
          to: trm
          label: 加固护城河
        - from: trust
          to: banks
          label: 支撑续约
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 结论取决于一点：拿到私有经营数据后，当前轮次只是合理，还是确实有吸引力。
    data:
      nodes:
        - id: round
          label: $1B Series C 轮
          detail: 真实发生的 2026 年融资给出了当前价格锚。
        - id: growth
          label: 150%+ 增长说法
          detail: 官方材料足以支撑明显的增长溢价。
        - id: anchor
          label: $78.8M 公开收入锚
          detail: ZoomInfo 给出最好的公开分母，但它只是估计值。
        - id: peers
          label: 同业与公开市场区间
          detail: Elliptic、Recorded Future、Cellebrite、NICE 和 Palantir 只能框出区间，不能逐项精确映射。
        - id: gaps
          label: 私有数据缺口
          detail: ARR、NRR、利润率、收入结构和优先权条款仍未披露。
        - id: call
          label: 继续研究 / $1B 合理
          detail: 当前价格能站住，但还不算明显便宜。
      edges:
        - from: round
          to: anchor
          label: 隐含约 12.7x
        - from: growth
          to: call
          label: 支撑溢价关注
        - from: anchor
          to: call
          label: 价值维持在平价附近
        - from: peers
          to: call
          label: 限制上行区间
        - from: gaps
          to: call
          label: 挡住无条件买入
        - from: round
          to: call
          label: 要求价格纪律
    approximationNotes: 这张流程图浓缩投资评估逻辑，并非统计模型。
    claimRefs:
      - CV001
      - CV006
      - CV019
      - CV043
      - CV044
      - CV057
      - CV060
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 同样的 $1 billion 入场价格，真实经常性收入落点不同，结论会从合理变成偏高。
    data:
      xAxis: 收入锚情景
      yAxis: $1B 入场价下的隐含 EV / 收入
      items:
        - label: $60M 收入
          value: 16.7
          note: 如果没有特别出色的利润率或留存，看起来会偏贵。
          tone: negative
        - label: $78.8M 公开估计值
          value: 12.7
          note: 当前最好的公开锚点；基本对应合理价格情景。
          tone: warning
        - label: $90M 收入
          value: 11.1
          note: 相较软件公司中位数会更有吸引力。
          tone: positive
        - label: $100M 收入
          value: 10
          note: 结合公司所称增长画像，会让本轮价格显得保守。
          tone: positive
    approximationNotes: 这些收入情景是敏感性锚点，不是管理层指引。图表展示真实经常性收入一旦移动，估值判断会多快改写。
    claimRefs:
      - CV006
      - CV033
      - CV041
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 可操作区间围绕当前轮次展开，以直接同业下行锚和战略情报上行锚作为外侧边界。
    data:
      items:
        - label: Elliptic 参考点
          low: 0.67
          mid: 0.67
          high: 0.67
          displayValue: $0.67B
          detail: 最接近的已披露私营同业轮次。
          tone: warning
        - label: 悲观情景
          low: 0.6
          mid: 0.7
          high: 0.8
          displayValue: $0.60B-$0.80B
          detail: 收入质量更低，或服务和政府业务拖累更重。
          tone: negative
        - label: TRM 当前轮次
          low: 1
          mid: 1
          high: 1
          displayValue: $1.00B
          detail: 当前融资锚。
          tone: neutral
        - label: 基准情景
          low: 0.9
          mid: 1
          high: 1.1
          displayValue: $0.90B-$1.10B
          detail: 最贴合当前公开记录。
          tone: neutral
        - label: 乐观情景
          low: 1.2
          mid: 1.4
          high: 1.6
          displayValue: $1.20B-$1.60B
          detail: 需要软件式经济性和战略可选性。
          tone: positive
        - label: Recorded Future 参考点
          low: 2.65
          mid: 2.65
          high: 2.65
          displayValue: $2.65B
          detail: 战略情报控制权价值标记。
          tone: positive
    approximationNotes: 参考点和区间用于约束投资评估纪律，不是管理层指引的目标值。
    claimRefs:
      - CV019
      - CV053
      - CV057
      - CV059
      - CV060
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 评分卡里，品类需求最强，披露质量和当前价格下的即时上行最弱。
    data:
      items:
        - label: 当前轮次
          value: $1.0B
          context: 真实的 2026 年 2 月融资锚。
        - label: 隐含倍数
          value: 12.7x
          context: 基于 ZoomInfo 的 $78.8M 收入估计。
        - label: 直接同业差距
          value: 1.5x
          context: TRM 本轮对比 Elliptic 的 $670M 估值。
        - label: 战略区间
          value: $2.65B
          context: Recorded Future 出售参考。
        - label: 公开调查类公司区间
          value: $3.67B
          context: Cellebrite 2026 年 6 月市值。
        - label: 公开合规类公司区间
          value: $5.41B
          context: NICE 2026 年 6 月市值。
        - label: 披露质量
          value: 4/10
          context: ARR、NRR、利润率、收入结构和优先权仍未公开。
        - label: IC 总体结论
          value: Research more
          context: 按平价看合理；只有拿到证据或折价才有吸引力。
    approximationNotes: 这些 KPI 混合了融资锚、区间参考和定性评分，供 IC 使用；它们不是经审计的经营指标。
    claimRefs:
      - CV001
      - CV006
      - CV019
      - CV053
      - CV054
      - CV055
      - CV057
      - CV060
