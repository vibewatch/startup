      - number: '3.2'
        title: 相邻挑战者和替代品，主要在工作流边缘最重要
        blocks:
          - type: paragraph
            body: >-
              保留来源指向一个分层市场。Merkle Science 和 AnChainAI 在 AML、调查和 AI 辅助筛查上都有足够重叠，值得关注，但两者都没有显示出 TRM、Chainalysis 或 Elliptic
              那样的公开覆盖。评论网站反复把 TRM、Chainalysis 和 Elliptic
              放在直接横向对比中，也强化了这种重叠；这说明买方已经在清单层面把类别头部视为可替代。在这一层之下，是另一类替代品：内部自建和既有合规技术栈。FATF、OCC 和 Grant Thornton 合在一起表明，银行和
              VASP 越来越有监管理由把加密控制嵌入更宽的 AML 和制裁运营，这意味着部分钱包筛查或分诊支出，可能由内部风险团队吸收，而不是交给专门的全平台供应商。


              Mastercard 应放在替代品组里，而不是直接同行组里。保留下来的 Mastercard 证据讨论的是更宽的网络安全和信任打包，而不是 CipherTrace
              当前公开产品深度。因此，把它写成在位者分销风险是可支持的，但不能据此证明一个明显复兴、正面竞争的分析产品。
