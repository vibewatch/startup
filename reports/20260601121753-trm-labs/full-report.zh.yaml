      - number: '1.3'
        title: 融资历史、规模标志和里程碑序列
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司而言，TRM 当前最强的资本事实获得了少见的多方印证：公司官方公告、Thoma Bravo 联合公告和多家独立出版物都指向同一个事实——公司刚完成 $70 million Series C，估值
              $1 billion，并于 2026 年 2 月 4 日宣布。TRM 还称，本轮融资前五年收入年均增长超过 150%。新资本、独角兽状态和公司声称的高速增长率叠加，足以把 2026 年 2
              月视为本章的标准资本里程碑。不过，越过这个标题事实，精度迅速下降。Tracxn 约 $220 million 的累计融资数字、ZoomInfo 的 $78.8 million 收入估计和 201-500
              人员工区间，都是有用的方向性 KPI，但仍是数据库估计，不是管理层认证披露。


              按日期排列的时间线仍显示出有意义的运营动能。2021 年与 Circle 的合作，证明 TRM 早期就具备合规相关性。2025 年 8 月 Beacon Network 上线，把 TRM
              从软件供应商扩展为实时情报共享协调方。2026 年 1 月加密犯罪报告、2026 年 3 月预测市场分析、2026 年 4 月政策圆桌，以及 2026 年 5
              月国会政策报道，都显示公司正在把公开品牌从狭窄的合规工具，扩展到研究、政策和生态编排。合在一起，历史支持一个简单结论：TRM 不只是活得好、资金足，还在主动扩大自身在政府和金融机构调查加密相关犯罪中的角色。
