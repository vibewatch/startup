  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 与 NRR
        - 当前 ARR、续约队列，以及按产品拆分的扩张率。
        - 用来判断公司是否应拿软件溢价，而不是服务调整后的倍数。
        - 管理层；董事会材料；队列仪表盘。
      - - 毛利率
        - 按软件、服务和政府工作拆分的毛利率。
        - 区分真正的软件质量与重人力收入。
        - 财务尽调和产品 P&L 复核。
      - - 收入结构
        - 政府对商业、软件对服务的收入结构。
        - 决定应套用耐久性溢价，还是采购折价。
        - 从订单到确认收入的分部桥接。
      - - 客户集中度
        - 头部账户、账户期限和续约依赖。
        - 集中度会让看似公平的倍数变得过于慷慨。
        - 收入集中度明细和合同样本。
      - - 优先股堆叠
        - 清算优先权、参与权和老股交易。
        - 结果数学可能比头条估值暗示的更差。
        - 股权结构表加融资文件。
      - - 销售效率
        - CAC、回本周期和管道转化。
        - 如果增长是资本高效的，而不是重补贴买来的，买入逻辑才更好。
        - 商业化尽调和队列经济性复核。
    notes: 这些问题按最先改变公允价值的因素排序：经常性收入质量、利润率结构、集中度和退出经济性。
    claimRefs:
      - CV046
      - CV049
      - CV050
