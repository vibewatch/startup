  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 常见工作流从筛查或报告开始，升级为监控或调查，最后可能通过 Chainabuse 或 Beacon 进入网络化响应。
    data:
      nodes:
