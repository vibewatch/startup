      - number: '7.2'
        title: 监管清晰是顺风，但也会提高政策依赖和内化风险
        blocks:
          - type: paragraph
            body: >-
              政策周期正把加密合规和调查推到受监管买方面前，TRM 因此受益；但同一周期也让业务更依赖政府如何划定边界。FATF 仍称虚拟资产风险需要更强的全球行动；ESMA 和 European Commission 显示
              MiCA 已经落地，但仍要靠授权法案和实施法案运转；OCC 在 2025 年发布的文件重新打开银行参与加密活动、托管和执行的更清晰路径；White House
              数字金融行政令则明确把数字资产领导地位定为国家优先事项。TRM 并不是这些变化的旁观者。公司的政策圆桌和国会信息传递显示，TRM 正试图塑造法律环境；关于 TRM
              法律框架工作的报道也表明，公司把法律和政策视为产品叙事的一部分。商业上这很合理，但也让 TRM 比通用横向软件厂商更暴露在监管摇摆风险下。政策清晰若扩大银行和公共部门需求，TRM
              会赢得更多受监管工作流；若同样的清晰度让银行更愿意自建内控、依赖更大的打包套件，或把供应商范围压缩到标准化功能，品类增长的同时，政策进展也可能压缩差异化和定价。
