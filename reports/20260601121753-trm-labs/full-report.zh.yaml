      - number: '3.4'
        title: TRM 有真实工作流资产，但在位者优势和类别反弹仍限制护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              TRM 最强的护城河论点，不只是它能筛查钱包或追踪资金流。很多供应商都能这么说。更强的论点是，TRM 把这些功能与面向银行的证明、外部文档、广泛覆盖，以及一个 Beacon
              网络结合起来；如果更多交易所、支付公司和执法机构持续参与，这个网络可能复利。这是保留信号中少见的、看起来更像网络效应而不是功能清单的部分。但反向压力也很实在。Chainalysis
              在头部交易所和监管机构中仍有更可见的在位覆盖；Elliptic 近期融资和银行相关支持方，也提高了其在机构金融和稳定币项目中竞争变尖锐的概率。


              类别层面也给耐久度设了天花板。评论页面暗示买方已经感知到头部厂商之间的重叠，小型挑战者可以攻击更窄工作流，隐私或监控批评也可能拖慢那些并非已被监管强制购买的细分市场的采用。护城河看起来真实，但它是分段且有条件的，不是无边界的。
