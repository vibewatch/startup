  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: TRM 销售一套模块化工作流栈，覆盖筛查、监控、调查和协作
        blocks:
          - type: paragraph
            body: >-
              TRM 当前产品最好被理解为运营工作流，而不是一个单体取证控制台。本语料中的官方材料显示，至少有七个反复出现的产品界面：Wallet Screening 用于授权前风险检查，Transaction
              Monitoring 用于持续告警和案件闭环，更宽的 Blockchain Intelligence / 调查能力用于追踪资产和解释证据，BLOCKINT API 用于嵌入式信息补充，制裁
              API，Chainabuse 用于报告驱动的诈骗情报，Beacon Network
              用于跨机构实时协作。银行和案例研究页面进一步说明，这些能力会按买方被不同打包：银行和稳定币建设者拿到入驻和监控工作流，调查员和执法团队拿到追踪、查封和案件支持。产品组合宽度是真实的，但买方应区分已经验证的运营界面和营销语言。覆盖数字、类别数量和跨链追踪宽度都是公开主张；它们显示有用规模，但
              TRM 没有发布一份经审计的支持清单，把每项主张都绑定到带日期的矩阵。
