  - id: TV001
    title: 建议摘要表
    columns:
      - 决策维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 以 $1B 估值继续研究
        - 价格真实且近期，但当前公开证据仍依赖估计收入锚，单位经济性证明缺失。
        - 只有拿到数据室权限或更好进入价格后才推进。
      - - 信心
        - 中
        - 融资和可比交易证据扎实，但 ARR、NRR、利润率和优先权数据仍未公开。
        - 用区间，不用单一点目标值。
      - - 风险评级
        - 高
        - 结果仍取决于未披露的经济性、政府收入结构和政策容忍度。
        - 先承销下行，再承销上行。
      - - 估值立场
        - 只有收入质量真实，估值才算合理
        - 当前轮次落在可支撑公开区间中部附近，并非明显低于区间。
        - 不要假设从这里还能轻松扩倍数。
      - - 什么会上调判断
        - 私有证明或更低价格
        - 软件化利润率、强留存和干净股权结构表的证据，可把合理推向有吸引力。
        - 只有拿到证明，或相对本轮折价时才买入。
      - - 什么会打破判断
        - 表面数据之下质量偏弱
        - 如果收入比预期更偏服务、更集中，或背负更多优先权，合理就会变成偏高。
        - 按悲观情景重切估值，或直接离场。
    notes: 判断依赖公开证据和区间承销。本章刻意不给点目标值，因为决定性变量仍未公开。
