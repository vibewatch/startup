  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、模块和定价不透明
        blocks:
          - type: paragraph
            body: >-
              TRM 的公开信息描述的是分层商业技术栈，而不是单一取证席位授权。公司把钱包筛查和交易监控卖进合规工作流，把更宽的区块链情报和调查产品卖给分析师和公共部门调查员，把 API 式制裁与筛查集成嵌入客户系统，并把
              Beacon Network 作为共享情报层；如果客户深度参与，它还能强化留存。案例研究库和调查定位还暗示，服务与培训附加并不小，因为工作流常涉及入驻、案件支持和运营化，而不是纯自助软件。TRM
              撰写的案例研究也强化了这一判断：其中包括 Coinbase 与 West Midlands Police、另一个 Coinbase
              相关高风险案件，以及捷克有组织犯罪调查员；这些看起来更像运营部署，而非商品化自助工具。缺失的是投资人想看的几乎所有变现细节。本语料中的官方产品或解决方案页面，没有任何一个披露标价、自助购买路径或公开折扣梯。最干净的解读是，企业报价式合同带有经常性收入特征，但实际
              ASP、打包结构、合同期限以及软件 / 服务组合仍不透明。
