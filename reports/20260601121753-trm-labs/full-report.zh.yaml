  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 框架
      - 有证据支撑的观点
      - 重要性
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - TRM 在声称五年平均收入增长 150%+ 后，于 2026 年完成真实 Series C 轮，估值 $1 billion。
        - 价格是近期形成的，也有可信投资者支撑，不只是周期高点的纸面标记。
        - 一旦验证到增长放缓或当前 ARR 偏弱，投资逻辑会很快走弱。
      - - 投资逻辑
        - 直接同行和战略可比交易，不会让 $1 billion 显得离谱。
        - Elliptic $670 million、Recorded Future $2.65 billion，为可信情报资产框出一条合理区间。
        - 如果 Elliptic 这类同行效率高得多，或 TRM 缺少可比产品深度，可比支撑会收缩。
      - - 投资逻辑
        - 公共部门和机构紧迫性，可以支撑相对普通软件中位数的一部分溢价。
        - 非法金融压力上升时，关键任务合规和调查预算可以更耐久。
        - 如果收入过度项目驱动或过度集中，耐久性会变成折价，而不是溢价。
      - - 反向逻辑
        - 公开记录仍未披露 ARR、NRR、毛利率或收入结构。
        - 没有软件级经济性，合理估值比上行更容易成立。
        - 数据室若能清楚显示留存、利润率和结构，信心会提高。
      - - 反向逻辑
        - 当前轮次已把好故事中的大部分计入价格。
        - 基准情景价值接近本轮价格，因此投资者并不明显是在低于内在价值买入。
        - 更低进入价格或战略方主动兴趣证据，会改善上行 / 风险平衡。
      - - 反向逻辑
        - 政策和监控批评可能压住采用和倍数扩张。
        - 政府相关性有助于预算，但也抬高审查和声誉风险。
        - 如果政策最终把该品类定位成可信基础设施需求，且没有明显反弹，下行风险会缓和。
    notes: 本表把公司质量论点和价格质量论点拆开。强公司也可能只是定价合理。
    claimRefs:
