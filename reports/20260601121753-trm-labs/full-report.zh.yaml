  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: TRM 的公开证据支持一条共享的归因与风险主干，它向 API、案件工作流和协作网络供给能力。
    data:
      layers:
        - id: data-inputs
          label: 数据输入
          detail: 链上活动、制裁名单、暗网和威胁情报来源、合作伙伴或用户提交的诈骗报告，以及客户工作流事件。
