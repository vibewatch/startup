  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争范围很窄，最难打的对手不是较小的专门厂商
        blocks:
          - type: paragraph
            body: >-
              TRM 最强的直接重叠对象是 Chainalysis 和 Elliptic，而不是所有能筛查钱包的公司。TRM
              保留下来的产品页面显示，它有一套宽栈：区块链情报、钱包筛查、交易监控、文档化集成、面向银行的工作流，以及 Beacon Network。这种宽度决定了，竞争讨论应从另外两家同样能可信覆盖“调查 +
              受监管监控”的公司开始。Chainalysis 在保留语料中仍有最清晰的在位者证明：头部交易所渗透、监管机构使用，以及案件闭环调查工作流。Elliptic
              是次一级最可信的直接对手，因为其公开材料把合规、调查、稳定币风险语言和近期与机构相关的资本结合在一起。


              Merkle Science 和 AnChainAI 相关，但保留证据显示，它们在公开规模标志上低于头部梯队。它们更像有意义的边缘挑战者，而不是同等类别领导者。对投资人来说，这个区分重要：真正的问题是，TRM
              能否继续从资本更充足或根基更深的直接同行那里拿份额，而不是它能否打赢市场上每一个更轻量的分析工具。
