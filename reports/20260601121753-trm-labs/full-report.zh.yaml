  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: TRM 通常借紧迫合规或调查问题切入，在实际工作流中证明价值，随后有空间扩展到相邻的情报共享或监控用例。
    data:
      items:
        - label: 触发事件
          value: >-
            Fraud, sanctions, laundering, or victim-recovery pressure forces a buyer to seek blockchain-intelligence
            tooling.
        - label: 初始买方发起人
          value: Compliance leaders, investigators, cybercrime units, or public prosecutors sponsor the purchase or pilot.
        - label: 首个工作流
          value: Common first workflows are transaction monitoring, wallet screening, tracing, or case-management support.
        - label: 运营嵌入
          value: Daily alerts, active casework, or cross-agency coordination make the tool part of the operating workflow.
        - label: 结果证明
          value: >-
            Buyers then cite offboarding a risky client, freezing funds, shortening investigations, or supporting
            convictions.
        - label: 扩张循环
          value: >-
            If the initial workflow sticks, TRM can extend into Beacon, broader monitoring, bank onboarding, or new
            investigative domains.
    approximationNotes: 该旅程综合多条留存客户故事，是分析性归纳，不是单一时间顺序漏斗。
    claimRefs:
      - CU007
