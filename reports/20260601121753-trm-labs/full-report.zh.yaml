        title: 财务结论和尽调卡点
        blocks:
          - type: paragraph
            body: >-
              我的财务结论是，TRM 的底层收入质量可能不错，但公开承销性很弱。公司似乎把关键任务型合规和调查工作流卖给银行、稳定币基础设施、加密企业和公共部门机构，这通常支撑经常性预算和黏性集成。如果 Beacon
              成为真正的网络层，还可能进一步强化留存。问题在于，所有对利润率敏感的问题在公开层面都未解：软件 / 服务组合、实际定价、各模块毛利率、客户集中度、CAC
              与回本、净留存，以及当前现金跑道。官方定价缺席、服务成分看起来真实，投资人不能安全假设这是纯高毛利软件模型。上市类比公司的公开文件存在，因此披露缺口清晰可见，而不是假设性的。TRM
              因此筛出来是一家可信、资金充足、值得深入尽调的公司，但没有数据室，就无法完整承销其财务轨迹。
