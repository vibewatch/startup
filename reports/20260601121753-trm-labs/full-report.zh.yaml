      - number: '8.2'
        title: 直接同业支持本轮价格，但公开区间限制了当前可计入的上行空间
        blocks:
          - type: paragraph
            body: >-
              直接私有同业的读数支持本轮，但还不足以给出明确买入。Elliptic 在 2026 年 5 月按 $670 million 估值融资，因此 TRM 的 $1 billion
              价格只比最接近的已披露私有同业高出有限幅度。Chainalysis 更早的 $4.2 billion 和 $8.6 billion
              私有市场峰值说明，这个品类历史上支撑过高得多的估值，但那是周期高点融资，不是当前清算价格。更有用的外部边界来自战略交易和公开市场。Mastercard 在 2024 年以约 $2.65 billion 收购
              Recorded Future，说明有规模的情报资产可以获得真实控制权价值。Cellebrite 的 $3.67 billion 和 NICE 的 $5.41 billion
              显示已披露的调查与合规平台在公开市场可交易到哪里；Palantir 的 $375.27 billion
              市值则提醒我们，真正天花板属于规模大得多、披露充分且性质完全不同的平台。由于本地公开可比公司语料没有给出每个区间的清晰实时收入分母，这些可比对象更适合用作设定区间的参照点，而不是精确换算倍数。
