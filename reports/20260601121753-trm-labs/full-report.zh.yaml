        title: 客户证明横跨多类买方，但最高置信证据在不同细分间不均
        blocks:
          - type: paragraph
            body: >-
              TRM 的 2026 年公开信息支持一个真实客户足迹，而不是纯愿景。官网首页称，75 个国家的 600+ 家政府机构和金融机构依赖 TRM 的数据、软件和 AI
              智能体；关于页面则把描述收窄到覆盖主要威胁领域的数百家公共部门机构和金融机构。这个顶层语言仍由公司撰写，但保留下来的案例研究和伙伴语料补足了真实买方类别：警方和调查机构、国家安全和联邦网络调查员、交易所、稳定币基础设施运营方、银行，以及通过
              Beacon Network 连接的一组更宽支付或生态成员。


              关键细节在于，不是每个 logo 的证据重量都一样。Circle、HIFI、HSI、捷克 NCOZ、Victoria Police、Massachusetts AG、Marion County 和
              Coinbase 相关调查，都带有具名工作流或运营结果。相比之下，第三方资料页和部分 TRM 营销表面列出 PayPal、Visa、FTX、Uniswap 或 Anchorage
              等知名名字，却没有显示模块范围、合同状态或续约深度。因此，本章对买方覆盖宽度给出正面判断，但把客户基础视作一个证据质量阶梯，而不是一张所有账户都同等可承销的扁平名单。
