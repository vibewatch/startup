      - number: '2.3'
        title: 监管催化剂，以及买方池为何持续扩大
        blocks:
          - type: paragraph
            body: >-
              监管是买方池超出加密原生公司的主因。MiCA 建立统一的欧盟加密资产规则，欧盟委员会仍在发布授权法案，让这些义务在运营层面更具体。FinCEN 指引继续把管理方和兑换方纳入 BSA 边界，FATF 则继续把 VA
              或 VASP 控制视为全球 AML/CFT 基线。在美国，白宫数字金融命令、KPMG 描述的 GENIUS Act 框架，以及 OCC
              澄清银行可以提供托管和执行服务，都指向同一方向：合法机构活动会增加，但前提是控制更强。


              这一点重要，因为银行和支付公司已经是真实买方，不是未来假设。Federal Reserve 称，稳定币市值在 2025 年增长超过 50%。Stripe 报告称，2024 年 10 月至 2025 年 10
              月，经调整稳定币支付活动达到 $9 trillion，同比增长 87%。Visa 正明确向银行和钱包营销稳定币基础设施。Morgan Stanley 和 World Economic Forum
              都把数字资产描述为正在走向主流资本市场和支付基础设施。这些来源合在一起，勾勒出一个市场：交易所仍是当前最大支出桶，但增量增长越来越来自在传统合规预期之上构建数字资产产品的银行、支付公司和机构。
