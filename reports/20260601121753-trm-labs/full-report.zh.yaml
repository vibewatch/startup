            body: >-
              公开记录中最硬的资本事实是 2026 年 2 月 Series C。TRM 和 Thoma Bravo 都称公司以 $1 billion 估值完成 $70 million
              融资，管理层把资金用途表述为扩展打击犯罪网络和国家安全威胁的 AI
              解决方案。与融资前相比，这显然改善了资本充足性，也显示公司仍在投资，而不是只是在保现金跑道。但公开记录远远达不到承销人所需的程度。本文审阅的来源没有披露 TRM
              融资后现金余额、月度烧钱速度、现金跑道、债务义务或产品级毛利率。Palantir 和 Coinbase 的上市公司代理文件让对比更清楚：成熟类比公司发布年度披露包，而 TRM 没有。类别层面也有风险。FATF
              持续推动更强虚拟资产合规，这支持需求；但公民自由批评和法庭程序敏感性提醒投资人，区块链分析不是一个政治上没有摩擦的类别。财务上，这意味着 Series C
