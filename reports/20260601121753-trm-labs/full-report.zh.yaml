      - number: '5.2'
        title: 架构可重建为共享归因和风险情报，向 API 与专门工作流供给
        blocks:
          - type: paragraph
            body: >-
              虽然 TRM 没有发布单一标准参考图，官方和伙伴文档语料已经具体到足以重建运营模型。Wallet Screening 描述了可配置风险引擎和实体归因层；Transaction Monitoring
              增加规则逻辑、每日重新筛查和案件管理；BLOCKINT API 通过高性能 API 暴露同一个情报平面；制裁和 Chainabuse 文档则显示，TRM 运行的是带标准认证模式的 REST
              端点，而不是纯封闭分析师工具。Chainabuse 尤其重要，因为它引入了双向网络效应：用户和伙伴可以贡献诈骗报告、查询既有报告，并把关联情报浮现到下游检查中。Persona 和 Sumsub
              的伙伴文档暗示，TRM 被设计成嵌入第三方入驻、交易、案件和图谱工作流。由此可见，一条共享数据与风险主干在支撑多个 SKU 和伙伴体验。仍不透明的是确切租户模型、认证企业 API
              的模式深度，以及筛查、监控、调查和协作产品之间的完整边界。
