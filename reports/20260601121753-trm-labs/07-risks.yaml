chapter:
  number: 7
  title: Risks
  summary: TRM Labs' biggest risk is not lack of demand but the combination of policy-shaped demand, category-level privacy and evidentiary backlash, and thin public proof on precision, appeals, and concentration. The company has credible mitigation surfaces—configurable screening and monitoring, banking workflows, docs, and Beacon coordination—but the underwriting case weakens quickly if regulated-finance demand concentrates further or if courtroom, privacy, and data-quality scrutiny sharpen faster than TRM can show proof.
sections:
- id: privacy-evidence-and-courtroom-risk
  title: Privacy, surveillance, and evidentiary criticism are structural category risks
  body: 'TRM operates in a category that is useful precisely because it turns open blockchain activity into actionable intelligence, but that same function creates durable privacy and proof risk. The harshest critiques do not argue that analytics vendors are useless; they argue that they normalize pervasive financial surveillance and can encourage overclaiming about what clustering or attribution actually proves. State of Surveillance says blockchain-analytics firms track wallet clusters and behavioral patterns at surveillance scale, Coin Center says financial intermediaries are already deputized to report substantial personal data without normal due-process protections, and the ACLU frames expanding digital footprints as a threat to privacy, free speech, security, and equality. On the evidentiary side, Frontiers shows blockchain records matter more in court, while the USENIX case study shows both why buyers pay for this software and why the claims remain bounded: accuracy evidence can be
    useful in specific seized-service cases, but the same paper warns that coverage changes over time, generalization is difficult, and inaccurate labeling can derail a prosecution or contribute to a wrongful conviction. For TRM, that means the core downside is structural. The company can mitigate it with better workflows, documentation, and controlled review processes, but the retained public record still lacks TRM-specific courtroom acceptance, appeal statistics, and live error-budget disclosures.'
  claimRefs:
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
