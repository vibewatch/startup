  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: precision-and-appeals
    missingEvidence: Audited precision, recall, dispute, reversal, and false-positive correction metrics for TRM across major chains and use cases.
    whyItMatters: Without live quality metrics, investors cannot tell whether TRM's category-level proof gap is shrinking or merely hidden behind product breadth.
    diligencePath: Request quality dashboards, QA governance, analyst-review thresholds, dispute logs, and any external validation studies under NDA.
    relatedQuestionRefs:
    - QR027
    - QR029
    - QR032
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Public-sector revenue mix, top-customer exposure, renewal rates, and contract duration by major buyer segment.
    whyItMatters: The biggest visible demand pools are government and regulated finance, so concentration opacity can hide both upside fragility and procurement timing risk.
    diligencePath: Request cohort retention, top-10 account mix, public-sector share of ARR, and pipeline split between agencies, banks, and other segments.
    relatedQuestionRefs:
    - QR025
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: trm-courtroom-proof
    missingEvidence: Independent case records, published opinions, or expert reports showing how TRM-specific analytics have been handled in court or formal proceedings.
    whyItMatters: Category evidence exists, but TRM-specific admissibility and methodology scrutiny remain a proof gap at exactly the moment the company is leaning into legal-framework positioning.
    diligencePath: Search court filings or request TRM case studies, expert declarations, and methodology memoranda that can be independently reviewed.
    relatedQuestionRefs:
    - QR027
    - QR032
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: beacon-usage-intensity
    missingEvidence: Beacon active-participant counts over time, usage intensity, repeat sharing behavior, and measurable case-outcome lift.
    whyItMatters: Beacon is one of the clearest mitigation and moat narratives in the public record, but without usage and outcome proof it is hard to value as more than a promising coordination layer.
    diligencePath: Request participant cohort data, monthly active organizations, interdiction case studies, and retention by participant type.
    relatedQuestionRefs:
    - QR015
    - QR016
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: minor
    topic: bundle-competition-win-loss
    missingEvidence: Current win-loss evidence showing whether broader platforms such as Palantir, NICE, or Cellebrite actually displace TRM in crypto workflows.
    whyItMatters: The capital-base comparison supports a displacement scenario, but without live win-loss data investors cannot tell whether bundle competition is theoretical or already active.
    diligencePath: Ask management for recent competitive bake-offs, pricing notes, and examples of where TRM won or lost against bundle or adjacent-platform competitors.
    relatedQuestionRefs:
    - QR022
    - QR023
    - QR024
    relatedTableRefs:
    - TR004
