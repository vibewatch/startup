- id: diligence-gates
  title: The decisive work is now in the data room, not in another public-comp debate
  body: 'The anti-thesis is not that TRM lacks demand. It is that public evidence still cannot prove that the current round buys software-quality economics rather than a mission-critical but partially services-heavy and policy-sensitive business. Investors still need current ARR, NRR, gross margin, revenue mix, concentration, and the preference stack before underwriting returns. Public comparisons actually reinforce that discipline: Palantir and Coinbase publish SEC filings, while the public bracket around Recorded Future, Cellebrite, and NICE involves companies or assets with more disclosed operating history than TRM offers today. If the data room shows ARR above the public anchor, strong retention, software-like margins, and a clean cap table, fair can improve to attractive. If not, today''s price should be treated as full rather than cheap. The final diligence list and thesis-break triggers therefore matter more than another debate over cosmetic peer multiples, because those private facts
    will decide whether investors are underwriting a premium software asset or only a well-positioned but fully priced compliance vendor.'
