tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision dimension
  - Current judgment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research more at $1B
    - Price is real and recent, but current public evidence still depends on an estimated revenue anchor and missing unit-economics proof.
    - Proceed only with data-room access or a better entry price.
  - - Confidence
    - Medium
    - Financing and comp evidence are solid, but ARR, NRR, margin, and preference data remain private.
    - Use ranges, not a single target value.
  - - Risk rating
    - High
    - Outcome still depends on undisclosed economics, government mix, and policy tolerance.
    - Underwrite downside before underwriting upside.
  - - Valuation stance
    - Fair only if revenue quality is real
    - The current round sits near the center of the supportable public range, not clearly below it.
    - Do not assume easy multiple expansion from here.
  - - What upgrades the call
    - Private proof or lower price
    - Evidence of software-like margins, strong retention, and a clean cap table could move fair to attractive.
    - Buy only after proof or at a discount to the round.
  - - What breaks the call
    - Weak quality beneath the headline
    - If revenue is more services-heavy, concentrated, or preference-burdened than expected, fair becomes stretched.
    - Re-cut value toward the bear case or walk away.
  notes: Judgments rely on public evidence plus range-based underwriting. The chapter intentionally refuses a point target because the decisive variables are still private.
