    - $8.6B valuation
    - Shows how high the category once priced at peak-cycle enthusiasm.
    - Historical peak, not a current clearing comp.
  - - Recorded Future (2024 sale)
    - Strategic M&A comparable
    - $2.65B control value
    - Useful strategic-intelligence exit reference above TRM's current round.
    - Adjacency to cyber threat intelligence, not crypto-native compliance.
  - - Cellebrite (June 2026 public)
    - Investigations software public bracket
    - $3.67B market cap
    - Shows where a disclosed public investigations platform can trade.
    - Market-cap bracket only; local corpus lacks a clean live revenue denominator here.
  - - NICE (June 2026 public)
    - Compliance/workflow public bracket
