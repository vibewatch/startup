- id: peer-and-public-brackets
  title: Direct peers support the round, while public brackets cap how much upside can be underwritten now
  body: The direct private-peer read is supportive but not enough for a clear buy. Elliptic raised at a $670 million valuation in May 2026, so TRM's $1 billion price is only modestly above the closest disclosed private peer. Chainalysis's earlier $4.2 billion and $8.6 billion private peaks show the category has historically supported much higher marks, but those were peak-cycle financings rather than current clearing prices. The more useful outer brackets are strategic and public. Mastercard's 2024 acquisition of Recorded Future for about $2.65 billion shows scaled intelligence assets can command real control value. Cellebrite at $3.67 billion and NICE at $5.41 billion show where disclosed investigations and compliance platforms can trade publicly, while Palantir's $375.27 billion market cap is a reminder that the true ceiling belongs to a very different, fully disclosed platform at vastly larger scale. Because the local public-comp corpus does not give clean live revenue denominators for
    each bracket, these comps are more useful as range-setting reference points than as exact multiple translations.
