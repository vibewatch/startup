- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or signal
  - Transmission to thesis
  - Action implication
  rows:
  - - Growth normalization
    - Growth falls well below hypergrowth without offsetting margin proof.
    - The premium over software medians disappears quickly.
    - Re-cut valuation closer to the bear case or pass.
  - - Services-heavy mix
    - A large share of revenue is project or investigations work rather than recurring software.
    - Current multiple would overstate revenue quality.
    - Downgrade recommendation and push for lower entry price.
  - - Government concentration
    - Too much revenue depends on a small set of agencies or annual procurement cycles.
    - Durability turns into concentration and budgeting risk.
    - Treat valuation as stretched unless margin and renewal quality are exceptional.
  - - Cap-table overhang
    - Preferences or secondaries absorb too much exit value.
    - Fair headline valuation no longer translates into fair investor returns.
    - Pause until cap-table terms are fully understood.
  - - Policy backlash
    - Privacy or surveillance criticism materially reduces addressable adoption.
    - Multiple expansion case collapses and downside case rises.
    - Move to track or avoid depending on severity.
  notes: These are action-oriented kill triggers, not background risks. If one clears, the recommendation should change, not just the narrative.
  claimRefs:
  - CV026
  - CV030
  - CV031
  - CV045
  - CV049
- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR and NRR
    - Current ARR, renewal cohorts, and expansion rates by product.
    - Needed to decide whether the business deserves a software premium rather than a services-adjusted multiple.
    - Management; board deck; cohort dashboard.
  - - Gross margin
    - Gross margin by software, services, and government work.
    - Distinguishes true software quality from labor-heavy revenue.
    - Finance diligence and product P&L review.
  - - Revenue mix
    - Government versus commercial, and software versus services mix.
    - Determines whether to apply a durability premium or a procurement discount.
    - Segment bridge from bookings to recognized revenue.
  - - Customer concentration
    - Top accounts, account duration, and renewal dependence.
    - Concentration can make a fair-looking multiple too generous.
    - Revenue concentration schedule and contract sample.
  - - Preference stack
    - Liquidation preferences, participation, and secondary activity.
    - Outcome math can be worse than headline valuation implies.
    - Cap table plus financing documents.
  - - Sales efficiency
    - CAC, payback, and pipeline conversion.
    - Buy works better if growth is capital-efficient rather than heavily subsidized.
    - Go-to-market diligence and cohort economics review.
  notes: 'These asks are ordered by what most changes fair value first: recurring-quality revenue, margin structure, concentration, and exit economics.'
  claimRefs:
  - CV046
  - CV049
  - CV050
