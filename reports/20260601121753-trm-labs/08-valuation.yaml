- id: scenario-work-and-price-discipline
  title: Scenario work says fair at par, better only with discount or proof
  body: 'Scenario analysis matters more than story quality because the current round already captures a lot of the good news. The bear case assumes the ZoomInfo revenue anchor overstates truly recurring software value or that government and services exposure are heavier than hoped; that leaves fair value closer to $0.6 billion to $0.8 billion. The base case assumes the public revenue anchor is directionally right, growth decelerates but stays strong, and revenue quality is decent enough to justify a modest premium over generic software; that lands around $0.9 billion to $1.1 billion, or roughly today''s price. The bull case needs more than demand rhetoric: it requires software-like margins, durable retention, and credible strategic-exit optionality, which can justify something like $1.2 billion to $1.6 billion. Because the current round already sits near the middle of the supportable range, the correct recommendation is research-more at $1 billion rather than a blind buy at or above the
    round.'
