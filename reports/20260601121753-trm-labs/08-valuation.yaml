- id: TV004
  title: Government-weighted revenue premium bridge table
  columns:
  - Signal
  - Premium case
  - Discount case
  - Net underwriting effect
  rows:
  - - Mission-critical buyer set
    - Law enforcement, regulators, and banks create durable problem urgency.
    - Budgets can be slow, political, and procurement-heavy.
    - Supports some premium, but only if cycles and concentration stay manageable.
  - - Security and accreditation
    - FedRAMP-style readiness is a real differentiator in this category.
    - Meeting government-grade requirements can raise support cost and lengthen sales cycles.
    - Premium on durability; discount on speed and margin visibility.
  - - Revenue resilience
    - Government programs can hold up better than discretionary crypto spending.
    - Termination-for-convenience language and annual budgeting still matter.
    - Net positive, but more Palantir-like than pure-SMB SaaS.
  - - Reputational posture
    - Public-sector trust can validate product importance.
    - Privacy and surveillance criticism can slow adoption or cap multiple expansion.
    - Premium should stop short of a full AI enthusiasm multiple.
  - - Evidence quality
    - TRM clearly markets into public and private institutions.
    - TRM does not disclose its actual revenue split or margins by segment.
    - Keep the premium modest until the data room proves revenue quality.
  notes: This table explains why government exposure is valuation-relevant in both directions. It is not a claim that all government-heavy software deserves the same multiple.
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV030
  - CV031
- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue anchor and warranted multiple
  - Fair value
  - What has to be true
  - Probability signal
  rows:
  - - Bear
    - $78.8M public anchor at roughly 7x-10x
    - $0.60B-$0.80B
    - Growth normalizes hard, services or government mix is heavier than hoped, and policy scrutiny limits premium.
    - Plausible if the data room shows weak software-quality economics.
  - - Base
    - $78.8M public anchor at roughly 11x-13.5x
    - $0.90B-$1.10B
    - Growth remains strong, the revenue anchor is directionally right, and the business proves reasonably software-like but not elite.
    - Most consistent with the public record today.
  - - Bull
    - $78.8M public anchor at roughly 15x-20x
    - $1.20B-$1.60B
    - TRM shows strong retention, software-like margins, strategic-exit optionality, and no material cap-table overhang.
    - Needs private proof, not just the current headline growth story.
  notes: Ranges are underwriting bands rather than point estimates. They deliberately widen around the private data gaps instead of pretending precision.
