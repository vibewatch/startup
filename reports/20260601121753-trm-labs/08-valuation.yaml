company:
  name: TRM Labs
chapter:
  number: 8
  title: Valuation
  summary: TRM's $1 billion Series C looks closer to a fair ceiling than a clear bargain. The implied ~12.7x revenue multiple on ZoomInfo's $78.8 million estimate sits above Elliptic's $670 million private mark but far below public and strategic intelligence brackets such as Recorded Future's $2.65 billion sale, Cellebrite's $3.67 billion market cap, NICE's $5.41 billion market cap, and Palantir's far-higher public ceiling. Because TRM still withholds ARR, NRR, gross margin, revenue mix, and preference terms, the evidence supports research-more with medium confidence rather than an unconditional buy at the current price.
sections:
- id: series-c-sets-the-price
  title: The Series C sets a real price, but not yet a fully underwriteable one
  body: The cleanest valuation fact is the financing itself. TRM and Thoma Bravo both say the company closed a $70 million Series C at a $1 billion valuation in February 2026, with revenue growth averaging more than 150% annually over the prior five years. That makes the price real, recent, and supported by insider participation rather than by a stale 2021-style mark. The harder question is whether the current round is cheap. Public evidence still has to lean on ZoomInfo's roughly $78.8 million revenue estimate, which puts the round at about 12.7x revenue. That multiple is not absurd for a fast-growing compliance platform, but it is also not a giveaway when ARR, retention, gross margin, and services mix remain undisclosed. At today's price, the right framing is fair-if-real rather than obviously attractive.
  claimRefs:
