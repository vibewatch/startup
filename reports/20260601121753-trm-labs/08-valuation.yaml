  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-nrr-gap
    missingEvidence: Current ARR, net revenue retention, and renewal-cohort data by product line.
    whyItMatters: Without ARR and NRR, the current multiple cannot be tied cleanly to recurring software quality.
    diligencePath: Request board materials or cohort dashboards showing ARR, logo retention, and NRR for the last eight quarters.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Explicit government-versus-commercial revenue split plus software-versus-services mix.
    whyItMatters: The valuation premium or discount for government exposure depends on how much of TRM's revenue is truly public-sector and how recurring the work is.
    diligencePath: Request a segment view of revenue, gross margin, and contribution margin by government, commercial, and services buckets.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV003
    - TV005
    - TV007
  - type: missing-source
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, participation features, secondaries, or other cap-table overhang terms for the Series C and prior rounds.
    whyItMatters: A fair headline valuation can still produce weak investor outcomes if preference terms or secondaries absorb exit value.
    diligencePath: Review the latest financing documents, cap table, and investor rights agreement before underwriting returns.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV007
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Gross margin, sales efficiency, payback, CAC, and customer concentration disclosure.
    whyItMatters: These metrics determine whether TRM deserves a premium closer to fast-growing software or a discount closer to services-heavy government tech.
    diligencePath: Ask management for a cohort bridge from bookings to gross profit plus top-customer concentration and services attach.
    relatedQuestionRefs:
    - QV021
    - QV022
    - QV025
    relatedTableRefs:
    - TV001
    - TV007
