  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "TRM Labs sells into a compliance-led blockchain-intelligence market whose clearest buyers are crypto exchanges, banks and payments firms adding digital-asset products, and public-sector investigators. Independent market reports consistently place the broader crypto-compliance software category around $2.8-3.1 billion in 2026 with double-digit growth, while a more defensible pure-play blockchain-intelligence SAM is narrower because many top-down figures include adjacent KYC, Travel Rule, reporting, and services layers."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and buyer universe",
      "body": "TRM Labs does not compete for the whole universe of crypto software. The core spend boundary is narrower: wallet screening, transaction monitoring, sanctions-risk review, entity attribution, investigative tracing, and the workflow systems that let exchanges, banks, payment firms, and public agencies act on those signals. MiCA, FATF, and FinCEN matter because they convert blockchain-risk handling into an auditable operating requirement for many of those institutions. That makes blockchain intelligence part of the control stack, not a nice-to-have analytics overlay.\n\nThe cleanest buyer split has four groups. First are crypto-native exchanges, brokers, custodians, and stablecoin issuers that need always-on screening and monitoring to keep operating. Second are banks and payment firms adding stablecoin, custody, or tokenized-asset products and therefore inheriting crypto-specific control obligations. Third are government and law-enforcement agencies that need tracing and seizure workflows as scam, sanctions, and cyber cases scale. Fourth are adjacent DeFi and infrastructure operators, which are real users of intelligence but are less standardized as repeat enterprise buyers. This boundary excludes generic KYC, core AML, treasury software, and payment processing unless those tools directly embed blockchain-native monitoring or investigations.",
