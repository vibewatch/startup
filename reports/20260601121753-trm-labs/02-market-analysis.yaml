    {
      "id": "market-sizing",
      "title": "Sizing lenses and what the published TAMs actually mean",
      "body": "The independent reports reviewed here cluster the broader crypto-compliance software category around roughly $2.8-3.1 billion in 2026. Tokenization Compliance estimates $2.78 billion; Verified Market Reports estimates $3.07 billion. PW Consulting points to a $6.86 billion 2032 endpoint with a 16.5% CAGR, while Verified projects $8.9 billion by 2034 at 10.8% CAGR. Those numbers are useful, but they should be treated as outer bounds for TRM rather than precise direct proxies for its obtainable market. They mix together blockchain analytics, transaction monitoring, Travel Rule tools, sanctions screening, case management, broader KYC or identity tooling, and in some cases consulting or integration work.\n\nA more defensible TRM lens starts with the slice most aligned to the company\u2019s product footprint. Tokenization Compliance says blockchain analytics and transaction monitoring are about $1.05 billion, or 38% of the 2026 market, while sanctions screening and Travel Rule layers add meaningful but smaller pools. That implies the narrow software-centric intelligence layer is materially smaller than the headline category. Using multiple lenses produces a practical answer: the broad category already supports a multi-billion-dollar market, but the pure-play SAM for vendors centered on blockchain intelligence likely sits closer to the low-single-digit billions and plausibly around $1-2 billion today.",
