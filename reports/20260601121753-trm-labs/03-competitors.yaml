chapter:
  number: 3
  title: Competitors
  summary: 'TRM''s direct competitive set is led by Chainalysis and Elliptic: Chainalysis still has the strongest public incumbent reach, while Elliptic looks like the sharpest bank- and stablecoin-oriented rival. TRM''s Beacon network, documented workflows, and coverage breadth create real switching-cost and network-effect potential, but pricing opacity, internal-build substitutes, smaller AI-first challengers, and category-level surveillance backlash all limit how durable that moat can be without stronger private evidence on retention and win-loss depth.'
sections:
- id: direct-peer-set
  title: Direct competition is narrow, and the hardest rivals are not the smaller specialists
  body: |-
    TRM's strongest direct overlap is with Chainalysis and Elliptic, not with every company that can screen a wallet. TRM's retained product surfaces show a broad stack spanning blockchain intelligence, wallet screening, transaction monitoring, documented integrations, bank-facing workflows, and the Beacon Network. That breadth is why the competitive conversation should start with the two companies that can also credibly span investigations plus regulated monitoring. Chainalysis still has the clearest incumbent proof in the retained corpus: top-exchange penetration, regulator usage, and a case-closure investigations workflow. Elliptic is the next most credible direct rival because its public materials combine compliance, investigations, stablecoin-risk language, and fresh institution-linked capital.

    Merkle Science and AnChainAI are relevant, but the retained evidence places them below that top tier on public scale markers. They look more like meaningful edge challengers than like co-equal category leaders. For investors, that distinction matters: the real question is whether TRM can keep taking share from better-capitalized or better-entrenched direct peers, not whether it can beat every lighter-weight analytics tool on the market.
