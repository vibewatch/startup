- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Workflow breadth
    - TRM spans investigations, screening, monitoring, bank pages, and docs
    - Chainalysis and Elliptic also cover core regulated workflows
    - High
    - Breadth is necessary to stay in large RFPs, but not sufficient to win them
    - Request module-by-module win-loss detail versus Chainalysis and Elliptic
  - - Beacon coordination layer
    - Beacon is a real-time intelligence-sharing network with named participants
    - Usage depth, partner retention, and case-outcome lift are not public
    - Medium-High
    - If Beacon compounds, TRM gains a harder-to-copy network edge; if not, it is just another feature
    - Ask for monthly active participants, incident volume, and closed-loop outcomes
  - - Bank-facing proof
    - TRM cites Visa and dedicated banking workflows
    - Elliptic has explicit stablecoin and policy posture plus fresh bank-linked capital
    - High
    - Institutional-finance programs are likely the sharpest head-to-head battleground
    - Compare bank customer logos, references, and renewal reasons
  - - Incumbent reach gap
    - Chainalysis shows 9/10 top exchanges and 45+ regulators
    - Entrenched references can slow displacement even when products overlap
    - High
    - Public proof still suggests Chainalysis is the safest default answer for many buyers
    - Ask how many displacements TRM won from incumbent deployments in the last 12 months
  - - Modular unbundling risk
    - Smaller challengers and internal stacks can cover narrower jobs
    - Category spend fragments across lighter tools and in-house controls
    - Medium
    - TRM may keep core compliance budgets but lose edge-seat expansion or lighter analyst use cases
    - Map where customers multi-home versus standardize on TRM
  - - Privacy and surveillance backlash
    - Advocacy sources criticize the category's surveillance posture while courts increase evidentiary stakes
    - Civil-liberties and DeFi-native resistance can narrow addressable demand
    - Medium
    - Backlash will not erase regulated demand, but it can constrain category goodwill and expansion
    - Review false-positive handling, labeling disputes, and independent validation practices
  - - Commercial opacity
    - Official pages do not show public list pricing
    - Investors cannot see whether wins come from price, services, or product depth
    - Medium
    - Opaque pricing can look like enterprise strength while hiding margin pressure
    - Obtain realized pricing, average contract duration, and services mix under NDA
  notes: Severity is competitive relevance to TRM, not existential company risk. The register intentionally mixes direct-rival, substitute, and category-level pressure because all three affect moat durability.
