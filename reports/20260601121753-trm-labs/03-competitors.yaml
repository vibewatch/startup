- id: adjacent-and-substitute-layer
  title: Adjacent challengers and substitutes matter most at the edge of the workflow
  body: |-
    The retained source set points to a layered market. Merkle Science and AnChainAI both present enough overlap to matter in AML, investigations, and AI-assisted screening, but neither shows the same public reach as TRM, Chainalysis, or Elliptic. Review sites reinforce that overlap by repeatedly grouping TRM, Chainalysis, and Elliptic in direct side-by-side comparisons, which suggests buyers already see the top of the category as substitutable at the checklist level. Below that layer sits a different substitute class: internal build and incumbent compliance stacks. FATF, the OCC, and Grant Thornton together imply that banks and VASPs have growing regulatory reason to embed crypto controls inside broader AML and sanctions operations, which means some wallet-screening or triage spend can be absorbed by in-house risk teams rather than a dedicated full-platform vendor.

    Mastercard belongs in that substitute bucket, not in the direct-peer bucket. The retained Mastercard evidence is about broader cyber and trust bundling, not about current public product depth for CipherTrace. That makes the narrative supportable as an incumbent-distribution risk, but not as proof of a clearly resurgent head-to-head analytics product.
