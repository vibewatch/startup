    rows:
      - - Wallet Screening
        - Banks, exchanges, compliance teams
        - Pre-transaction wallet risk scoring, attribution, alert history, and behavioral context
        - Dedicated official page with performance and coverage claims
        - 155+ configurations plus attributed entities and source/confidence visibility
        - No public full support matrix or false-positive benchmarks
      - - Transaction Monitoring
        - Crypto businesses and compliance operations
        - Continuous alerting, rule tuning, case review, and daily rescreening
        - Dedicated official page plus solution packaging
        - Flexible behavioral rules plus in-product case management
        - No public latency or alert-quality distribution by customer type
      - - Investigations / blockchain intelligence
        - Investigators, law enforcement, public-sector analysts
        - Trace assets, build event timelines, identify counterparties, and explain evidence
        - Official blockchain-intelligence page plus law-enforcement case studies
        - Links triage, tracing, seizure, and prosecutor-facing explanation
        - No separate fetched technical reference for a dedicated forensics SKU
      - - BLOCKINT API
        - Embedded-product and platform teams
        - API enrichment for entity links, risk exposure, and faster signal-to-action workflows
        - Standalone official API page
        - Single high-performance API surface instead of bespoke manual exports
        - Exact schemas, rate limits, and tenancy boundaries are not public
      - - Sanctions + Chainabuse APIs
        - Developers, compliance teams, scam-reporting partners
        - REST endpoints for sanctions screening, report submission, report retrieval, and alerting
        - Public docs with endpoint names and auth patterns
        - Usable without full product UI; connects reporting and screening loops
        - Docs are narrow and do not cover every enterprise workflow endpoint
      - - Beacon Network
        - Law enforcement, exchanges, DeFi services, stablecoin issuers
        - Real-time intelligence sharing to stop illicit funds before off-ramp
        - Official network page plus launch post and independent launch coverage
        - Adds a network-effect collaboration layer on top of analytics
        - Operational governance, SLAs, and participation rules are not public
      - - Workflow-specific solution wrappers
        - Banks, stablecoin builders, investigators
        - Package common controls and investigations for buyer-specific motions
        - Banking page plus HIFI and Circle deployment evidence
        - Shows TRM sells workflow bundles rather than only raw analytics
        - Packaging details are clearer than exact back-end architecture
    notes: >-
