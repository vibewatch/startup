  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      The common workflow starts with screening or reporting, escalates into monitoring or investigation, and can end in
      a networked response through Chainabuse or Beacon.
    data:
      nodes:
        - id: signal
          label: Wallet, transaction, domain, or customer signal appears
          type: input
        - id: screen
          label: Wallet Screening or sanctions endpoint scores the initial signal
          type: process
        - id: monitor
          label: Transaction Monitoring applies behavioral rules and opens alert review
          type: process
        - id: investigate
          label: Analyst or investigator traces funds and builds case context
          type: process
        - id: report
          label: Chainabuse report submission or lookup adds linked scam intelligence
          type: process
        - id: coordinate
          label: Beacon participants share intelligence for urgent response
          type: process
        - id: action
          label: Freeze, escalate, file, or support recovery / law-enforcement action
          type: output
      edges:
        - from: signal
          to: screen
        - from: screen
          to: monitor
        - from: monitor
          to: investigate
        - from: screen
          to: report
        - from: investigate
          to: report
        - from: report
          to: coordinate
        - from: coordinate
          to: action
    approximationNotes: >-
      Actual customer playbooks vary by bank, exchange, stablecoin builder, or law-enforcement user; the flow captures
      the recurring steps documented across product and API surfaces.
    claimRefs:
      - CE002
      - CE005
      - CE014
      - CE017
      - CE018
      - CE035
