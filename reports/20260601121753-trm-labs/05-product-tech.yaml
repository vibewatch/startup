callouts:
  - calloutType: strength
    title: 'Strength: one intelligence spine supports several buyer-specific workflows'
    body: >-
      The strongest product-tech argument is architectural reuse. Screening, monitoring, investigations, Chainabuse, and
      Beacon all look like different interfaces on top of shared attribution and risk intelligence rather than
      disconnected point tools.
    claimRefs:
      - CE001
      - CE025
      - CE033
      - CE038
  - calloutType: risk
    title: 'Risk: documentation depth lags the breadth of the commercial story'
    body: >-
      TRM has enough public evidence to show the product family is real, but not enough to let an investor underwrite it
      purely from open materials. Full support matrices, enterprise schemas, public SLOs, and proof around newer AI
      packaging remain thin.
    claimRefs:
      - CE022
      - CE027
      - CE034
      - CE037
  - calloutType: insight
    title: 'Insight: collaboration layers may matter as much as analytics depth'
    body: >-
      Chainabuse and Beacon suggest TRM is trying to own the response loop, not just the risk score. That makes network
      participation and partner integrations a real part of the moat.
    claimRefs:
      - CE015
      - CE017
      - CE018
      - CE035
