      TRM's public evidence supports a shared attribution-and-risk spine that feeds APIs, case workflows, and
      collaboration networks.
    data:
      layers:
        - id: data-inputs
          label: Data inputs
          detail: >-
            On-chain activity, sanctions lists, dark-web and threat-intelligence sources, partner or user-submitted scam
            reports, and customer workflow events.
        - id: intelligence-core
          label: Attribution and risk-intelligence core
          detail: >-
            Entity attribution, configurable risk categories, bridge tracing, cross-chain exposure logic, and
            counterparty context.
        - id: api-plane
          label: API and screening plane
          detail: >-
            BLOCKINT API, wallet screening, sanctions checks, Chainabuse report/read APIs, and monitoring-oriented
            endpoints.
        - id: workflow-plane
          label: Workflow applications
          detail: >-
            Transaction Monitoring case handling, investigation and seizure workflows, partner dashboard integrations,
            and bank/stablecoin compliance motions.
        - id: network-and-assurance
          label: Network and assurance layer
          detail: >-
            Beacon collaboration, Chainabuse alerting loops, compliance-center trust controls, and enterprise deployment
            packaging.
    approximationNotes: >-
      This stack is inferred from public product pages, API docs, and partner materials; TRM does not publish a single
      canonical architecture diagram in this corpus.
