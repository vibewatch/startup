  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reference-architecture-and-slos
      missingEvidence: >-
        A current TRM-controlled reference architecture showing tenancy, control-plane boundaries, product-to-product
        data flows, and formal latency or availability commitments.
      whyItMatters: >-
        Without it, buyers can verify workflow breadth but still cannot underwrite how screening, monitoring,
        Chainabuse, and Beacon coexist operationally in production.
      diligencePath: >-
        Request a technical architecture pack plus customer-facing SLO or uptime documentation for the core screening,
        monitoring, and collaboration surfaces.
      relatedQuestionRefs:
        - QE016
        - QE023
      relatedTableRefs:
        - TE003
    - type: access-blocked
      severity: material
      topic: enterprise-api-schemas
      missingEvidence: >-
        Authenticated schema docs, versioning notes, and operational limits for the enterprise monitoring, screening,
        and case-management APIs beyond the narrow public endpoints in this corpus.
      whyItMatters: >-
        Public docs prove integration intent but not enough detail for production design review, incident modeling, or
        migration planning.
      diligencePath: >-
        Obtain partner or customer API docs for the core enterprise endpoints and compare them against the public
        sanctions and Chainabuse surfaces.
      relatedQuestionRefs:
        - QE009
        - QE023
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: material
      topic: dated-support-matrix
      missingEvidence: >-
        A dated support matrix enumerating chains, assets, bridges, and product-by-product support boundaries for
        screening, monitoring, and Chainabuse.
      whyItMatters: >-
        The chapter can verify large coverage claims and the existence of a supported-blockchain list, but not a single
        dated inventory that reconciles 190+ and 193+ style claims.
      diligencePath: >-
        Request the current chain-and-asset support export used by solution engineering or customer success, broken out
        by module.
      relatedQuestionRefs:
        - QE014
        - QE024
      relatedTableRefs:
        - TE001
    - type: missing-source
      severity: material
      topic: ai-agent-validation
      missingEvidence: >-
        Independent benchmarks or customer case studies validating the newer AI-enabled or agentic workflow claims
        discussed in 2026 external packaging and funding coverage.
      whyItMatters: >-
        The automation story could expand TRM's budget and moat, but current proof is materially thinner than the
        evidence for screening and monitoring.
      diligencePath: >-
        Ask for customer references, benchmark studies, or product notes that quantify analyst time saved,
        false-positive impact, and deployment scope for the newer AI layers.
      relatedQuestionRefs:
        - QE019
        - QE026
      relatedTableRefs:
