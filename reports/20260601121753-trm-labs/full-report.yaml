  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer universe
        blocks:
          - type: paragraph
            body: >-
              TRM Labs does not compete for the whole universe of crypto software. The core spend boundary is narrower:
              wallet screening, transaction monitoring, sanctions-risk review, entity attribution, investigative
              tracing, and the workflow systems that let exchanges, banks, payment firms, and public agencies act on
              those signals. MiCA, FATF, and FinCEN matter because they convert blockchain-risk handling into an
              auditable operating requirement for many of those institutions. That makes blockchain intelligence part of
              the control stack, not a nice-to-have analytics overlay.


              The cleanest buyer split has four groups. First are crypto-native exchanges, brokers, custodians, and
              stablecoin issuers that need always-on screening and monitoring to keep operating. Second are banks and
              payment firms adding stablecoin, custody, or tokenized-asset products and therefore inheriting
              crypto-specific control obligations. Third are government and law-enforcement agencies that need tracing
              and seizure workflows as scam, sanctions, and cyber cases scale. Fourth are adjacent DeFi and
              infrastructure operators, which are real users of intelligence but are less standardized as repeat
              enterprise buyers. This boundary excludes generic KYC, core AML, treasury software, and payment processing
              unless those tools directly embed blockchain-native monitoring or investigations.
