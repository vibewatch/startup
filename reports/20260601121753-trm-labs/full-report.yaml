      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              My financial verdict is that TRM probably has good underlying revenue quality but weak public
              underwriteability. The company appears to sell mission-critical compliance and investigations workflows
              into banks, stablecoin infrastructure, crypto businesses, and public-sector agencies, which usually
              supports recurring budgets and sticky integrations. Beacon could further strengthen retention if it
              becomes a genuine network layer. The problem is that every margin-sensitive question remains open in
              public: software-versus-services mix, realized pricing, gross margin by module, customer concentration,
              CAC and payback, net retention, and current cash runway. Because official pricing is absent and the
              service component looks real, investors cannot safely assume a pure high-margin software model. Because
              public analog filings exist, the disclosure gap is easy to see rather than hypothetical. TRM therefore
              screens as a credible, well-funded company worth deeper diligence, but not one whose financial trajectory
              can be fully underwritten without a data room.
