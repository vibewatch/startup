        - Current ARR, renewal cohorts, and expansion rates by product.
        - Needed to decide whether the business deserves a software premium rather than a services-adjusted multiple.
        - Management; board deck; cohort dashboard.
      - - Gross margin
        - Gross margin by software, services, and government work.
        - Distinguishes true software quality from labor-heavy revenue.
        - Finance diligence and product P&L review.
      - - Revenue mix
        - Government versus commercial, and software versus services mix.
        - Determines whether to apply a durability premium or a procurement discount.
        - Segment bridge from bookings to recognized revenue.
      - - Customer concentration
        - Top accounts, account duration, and renewal dependence.
        - Concentration can make a fair-looking multiple too generous.
        - Revenue concentration schedule and contract sample.
      - - Preference stack
        - Liquidation preferences, participation, and secondary activity.
        - Outcome math can be worse than headline valuation implies.
        - Cap table plus financing documents.
      - - Sales efficiency
        - CAC, payback, and pipeline conversion.
        - Buy works better if growth is capital-efficient rather than heavily subsidized.
        - Go-to-market diligence and cohort economics review.
    notes: >-
      These asks are ordered by what most changes fair value first: recurring-quality revenue, margin structure,
      concentration, and exit economics.
