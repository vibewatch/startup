      - number: '3.4'
        title: TRM has real workflow assets, but incumbency and category backlash still cap moat durability
        blocks:
          - type: paragraph
            body: >-
              The strongest moat case for TRM is not just that it screens wallets or traces flows. Many vendors can say
              that. The stronger case is that TRM combines those functions with bank-facing proof, external
              documentation, broad coverage, and a Beacon network that could compound if more exchanges, payment firms,
              and law-enforcement bodies keep participating. That is the rare retained signal that looks more like a
              network effect than a feature checklist. But the counterweights are material. Chainalysis still has more
              visible incumbent reach with top exchanges and regulators, while Elliptic's recent capital and bank-linked
              backers increase the chance of sharper competition in institutional finance and stablecoin programs.


              There is also a category-level ceiling on durability. Review pages imply buyers already perceive overlap
              across the leaders, smaller challengers can attack narrower workflows, and privacy or surveillance
              critiques can slow adoption in segments that are not already forced by regulation to buy. The moat looks
              real, but it is segmented and conditional rather than unbounded.
