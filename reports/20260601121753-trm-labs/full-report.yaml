      - number: '4.3'
        title: Capital adequacy after the Series C and the limits of disclosure
        blocks:
          - type: paragraph
            body: >-
              The best hard capital fact in the public record is the February 2026 Series C. TRM and Thoma Bravo both
              say the company closed a $70 million round at a $1 billion valuation, and management framed the proceeds
              around scaling AI solutions against criminal networks and national-security threats. That clearly improves
              capital adequacy versus a pre-round position, and it signals the company is still investing rather than
              merely preserving runway. But the public record stops well short of what an underwriter needs. The sources
              reviewed here do not disclose TRM's cash balance after the raise, monthly burn, runway, debt obligations,
              or product-level gross margin. Public-company proxy filings from Palantir and Coinbase make the contrast
              clearer: mature analogs publish annual disclosure packages, while TRM does not. There is also
              category-level risk. FATF's continued push for stronger virtual-asset compliance supports demand, but
              civil-liberties criticism and courtroom-procedure sensitivity remind investors that blockchain analytics
              is not a politically frictionless category. Financially, that means the Series C buys time and strategic
              flexibility, but not clarity on self-funding capacity.
