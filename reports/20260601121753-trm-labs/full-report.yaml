      - number: '7.3'
        title: Demand concentration, specialist rivalry, and proof gaps can compound quickly
        blocks:
          - type: paragraph
            body: >-
              The visible demand signal is strong, but it is concentrated in exactly the buyer groups most shaped by
              policy and procurement. TRM says 600+ government agencies and financial institutions rely on its platform,
              its banking page uses a Visa testimonial to highlight manual-effort reduction, and its product positioning
              emphasizes configurable controls, broad coverage, and faster investigations. Those are strengths, but they
              also reveal the dependency web: regulated-finance accounts, public-sector workflows, and real-time
              information-sharing partners matter disproportionately. At the same time, TRM is not running alone.
              Chainalysis still advertises deep exchange and regulator penetration, Elliptic combines compliance,
              investigations, stablecoin risk, and fresh institutional capital, and adjacent public investigation and
              intelligence vendors such as Palantir, NICE, and Cellebrite operate with much larger capital bases than
              TRM' last disclosed USD 1 billion valuation. Meanwhile the threat environment is not standing still. TRM'
              own crime report says illicit volume reached USD 158 billion in 2025, and the Xinbi case shows that
              crackdowns can shift infrastructure rather than end activity. That combination raises the bar for data
              quality, speed, and coverage exactly when the public record still does not show TRM's live precision,
              recall, appeals, or customer concentration metrics.
