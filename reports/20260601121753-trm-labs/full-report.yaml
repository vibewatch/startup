  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: The call turns on whether today's round is merely fair or actually attractive once private economics are known.
    data:
      nodes:
        - id: round
          label: $1B Series C
          detail: A real 2026 financing creates a current price anchor.
        - id: growth
          label: 150%+ growth claim
          detail: Official materials support a meaningful growth premium.
        - id: anchor
          label: $78.8M public revenue anchor
          detail: ZoomInfo provides the best public denominator, but only as an estimate.
        - id: peers
          label: Peer and public brackets
          detail: Elliptic, Recorded Future, Cellebrite, NICE, and Palantir frame range, not exact translation.
        - id: gaps
          label: Private data gaps
          detail: ARR, NRR, margin, mix, and preference terms remain undisclosed.
        - id: call
          label: Research-more / fair at $1B
          detail: Current price is supportable, but not yet clearly cheap.
      edges:
        - from: round
          to: anchor
          label: implies ~12.7x
        - from: growth
          to: call
          label: supports premium attention
        - from: anchor
          to: call
          label: keeps value near par
        - from: peers
          to: call
          label: caps upside band
        - from: gaps
          to: call
          label: blocks unconditional buy
        - from: round
          to: call
          label: forces price discipline
    approximationNotes: This flow compresses the underwriting logic rather than presenting a statistical model.
    claimRefs:
      - CV001
      - CV006
      - CV019
      - CV043
      - CV044
      - CV057
      - CV060
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The same $1 billion entry price can look fair or stretched depending on where true recurring revenue actually
      sits.
    data:
      xAxis: Revenue anchor scenario
      yAxis: Implied EV / revenue at $1B entry
      items:
        - label: $60M revenue
          value: 16.7
          note: Would look rich without exceptional margins or retention.
          tone: negative
        - label: $78.8M public estimate
          value: 12.7
          note: Current best public anchor; effectively a fair-price case.
          tone: warning
        - label: $90M revenue
          value: 11.1
          note: Would look more attractive versus software medians.
          tone: positive
        - label: $100M revenue
          value: 10
          note: Would make the round price look conservative for the stated growth profile.
          tone: positive
    approximationNotes: >-
      Revenue cases are sensitivity anchors, not management guidance. The chart shows how quickly valuation judgment
      changes when true recurring revenue shifts.
    claimRefs:
      - CV006
      - CV033
      - CV041
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The actionable range centers on the current round, with direct-peer downside and strategic-intelligence upside as
      outer markers.
    data:
      items:
        - label: Elliptic reference
          low: 0.67
          mid: 0.67
          high: 0.67
          displayValue: $0.67B
          detail: Nearest disclosed private peer round.
          tone: warning
        - label: Bear case
          low: 0.6
          mid: 0.7
          high: 0.8
          displayValue: $0.60B-$0.80B
          detail: Lower-quality revenue or heavier services/government drag.
          tone: negative
        - label: Current TRM round
          low: 1
          mid: 1
          high: 1
          displayValue: $1.00B
          detail: Current financing anchor.
          tone: neutral
        - label: Base case
          low: 0.9
          mid: 1
          high: 1.1
          displayValue: $0.90B-$1.10B
          detail: Best fit with the public record today.
          tone: neutral
        - label: Bull case
          low: 1.2
          mid: 1.4
          high: 1.6
          displayValue: $1.20B-$1.60B
          detail: Needs software-like economics and strategic optionality.
          tone: positive
        - label: Recorded Future reference
          low: 2.65
          mid: 2.65
          high: 2.65
          displayValue: $2.65B
          detail: Strategic-intelligence control-value marker.
          tone: positive
    approximationNotes: Reference points and ranges are for underwriting discipline, not as management-guided target values.
    claimRefs:
      - CV019
      - CV053
      - CV057
      - CV059
      - CV060
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      The IC scorecard is strongest on category demand and weakest on disclosure quality and immediate upside at the
      current price.
    data:
      items:
        - label: Current round
          value: $1.0B
          context: Real February 2026 financing anchor.
        - label: Implied multiple
          value: 12.7x
          context: Based on ZoomInfo's $78.8M revenue estimate.
        - label: Direct peer gap
          value: 1.5x
          context: TRM round versus Elliptic's $670M valuation.
        - label: Strategic bracket
          value: $2.65B
          context: Recorded Future sale reference.
        - label: Public investigations bracket
          value: $3.67B
          context: Cellebrite June 2026 market cap.
        - label: Public compliance bracket
          value: $5.41B
          context: NICE June 2026 market cap.
        - label: Disclosure quality
          value: 4/10
          context: ARR, NRR, margin, mix, and preferences remain private.
        - label: Overall IC call
          value: Research more
          context: Fair at par; attractive only with proof or discount.
    approximationNotes: >-
      KPIs mix financing anchors, bracket references, and qualitative scoring for IC use; they are not audited operating
      metrics.
    claimRefs:
      - CV001
      - CV006
      - CV019
      - CV053
      - CV054
      - CV055
      - CV057
      - CV060
