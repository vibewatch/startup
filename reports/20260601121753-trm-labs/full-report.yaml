  - id: FU004
    title: Logo-to-production evidence flow
    type: flow
    layout: wide
    summary: >-
      The retained customer corpus forms an evidence ladder from generic logo mention to named workflow and quantified
      result, with contract economics still missing at the end of the chain.
    data:
      nodes:
        - id: logo-mention
          label: Logo or ecosystem mention
