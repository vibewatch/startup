        title: Public traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              TRM has more public demand evidence than public financial evidence. The homepage and about page say
              600-plus government agencies and financial institutions across 75 countries rely on TRM, while solution
              pages show breadth across banks and crypto-native businesses. The banking page uses a Visa testimonial
              around reduced manual effort, Circle publicly announced use of TRM for crypto compliance, and the HIFI
              case study places TRM inside stablecoin-infrastructure compliance from day zero. Additional TRM case
              studies featuring Coinbase with West Midlands Police, a separate Coinbase-linked high-stakes
              investigation, and Czech investigators broaden the public reference set for exchange-linked and
              public-sector investigative workflows. Beacon extends that picture by naming a long list of exchanges and
              payment companies in a real-time coordination network. Those are meaningful traction proxies because they
              show workflow embedding, referenceability, and multi-segment reach. External coverage on the 2026 raise
              and later legal-framework work also frames TRM as selling into a growing compliance and investigations
              burden rather than a shrinking niche. Coverage claims—190-plus blockchains, 1.9 billion-plus assets, and
              720-plus bridges—also suggest a product that can support larger enterprise deployments. But sales
              efficiency is still mostly inferential. ZoomInfo's $78.8 million revenue estimate is helpful as a
              directional scale marker, yet public CAC, sales cycle, payback, expansion, and churn data are absent, so
              investors can see demand but not the quality or efficiency of converting that demand into durable
