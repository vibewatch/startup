      - number: '7.2'
        title: Regulatory clarity is a tailwind, but it also increases policy dependence and internalization risk
        blocks:
          - type: paragraph
            body: >-
              TRM is benefiting from a policy cycle that is making crypto compliance and investigation more central to
              regulated buyers, yet that same cycle makes the business more dependent on how governments draw the
              perimeter. FATF still says stronger global action is needed for virtual-asset risks; ESMA and the European
              Commission show MiCA is real but still operationalized through delegated and implementing acts; OCC
              releases in 2025 reopen a clearer path for banks to engage in crypto activities, custody, and execution;
              and the White House digital-finance order explicitly frames digital-asset leadership as a national
              priority. TRM is not a passive observer of those shifts. Its policy roundtable and congressional messaging
              show a company trying to shape the legal environment, while coverage of TRM' legal-framework work suggests
              the firm sees law and policy as part of the product story. That is commercially rational, but it makes the
              business more exposed to regulatory swing risk than a generic horizontal software vendor. If policy
              clarity broadens bank and public-sector demand, TRM wins more regulated workflows. If the same clarity
              makes banks more comfortable building internal controls, relying on larger bundled stacks, or narrowing
              vendor scope to standardized functions, then policy progress can compress differentiation and pricing even
              while the category grows.
