        title: Durability, concentration, and procurement-friction evidence remain thin
        blocks:
          - type: paragraph
            body: >-
              The biggest open question in this chapter is not whether TRM has customers, but whether the public record
              is rich enough to underwrite retention quality and concentration risk. None of the retained public sources
              discloses NRR, GRR, churn, standard contract duration, top-customer exposure, or a
              government-versus-private revenue split. That is especially important because the most detailed public
              proof skews toward public-sector investigations and compliance-heavy buyers. The mix may be attractive
              because those workflows are mission critical, but the corpus does not let an investor measure whether
              growth is diversified or whether a small set of government or regulated-financial accounts dominates the
              book.


              There is also a qualitative procurement-friction risk. The ACLU's broader privacy-and-surveillance
              critique is not TRM-specific, but it is relevant to any vendor whose tools help governments and
              institutions track digital financial activity. In practical diligence terms, that means the chapter can
              confidently say TRM has real deployment proof and a promising network-effect surface, while still
              insisting on data-room evidence before underwriting renewal durability, Beacon economics, or customer
              concentration. Public customer evidence is real; public customer economics remain mostly opaque.
