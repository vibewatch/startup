companyProfile:
  summary: >-
    TRM Labs is a San Francisco-based blockchain intelligence company providing AI-powered tools for crypto compliance,
    investigations, and sanctions screening. The company serves Coinbase, Circle, PayPal, Stripe, Robinhood, Visa, and a
    broad public-sector customer base that includes agencies such as the FBI and IRS. TRM reached a $1 billion valuation
    in February 2026 after raising $70 million in a Series C led by Blockchain Capital with participation from Goldman
    Sachs, Bessemer, Thoma Bravo, Citi Ventures, Y Combinator, and Galaxy Ventures.
