              console. The official materials in this corpus show at least seven recurring surfaces: Wallet Screening
              for pre-authorization risk checks, Transaction Monitoring for continuous alerting and case closure, a
              broader Blockchain Intelligence / investigation capability for tracing assets and explaining evidence,
