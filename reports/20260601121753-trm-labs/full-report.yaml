      - number: '1.3'
        title: Funding history, scale markers, and milestone sequence
        blocks:
          - type: paragraph
            body: >-
              TRM’s strongest current capital fact is unusually well corroborated for a private company: the official
              company announcement, Thoma Bravo’s co-announcement, and multiple independent publications all converge on
              a recently closed $70 million Series C at a $1 billion valuation announced on February 4, 2026. TRM also
              claimed that the round followed revenue growth averaging more than 150% annually over the prior five
              years. That combination of fresh capital, unicorn status, and aggressive company-claimed growth rate is
              sufficient to treat February 2026 as the chapter’s canonical capital milestone. Beyond that headline,
              however, precision drops quickly. Tracxn’s roughly $220 million total-funding figure and ZoomInfo’s $78.8
              million revenue estimate and 201-500 employee band are useful directional KPIs, but they are still
              database estimates rather than management-certified disclosures.


              The dated chronology still shows meaningful operating momentum. A 2021 Circle partnership demonstrates
              early compliance relevance. The August 2025 Beacon Network launch broadened TRM from software vendor to
              real-time intelligence-sharing coordinator. The January 2026 crypto-crime report, March 2026
              prediction-markets analysis, April 2026 policy roundtable, and May 2026 congressional-policy coverage all
              show a company expanding its public brand beyond a narrow compliance toolset into research, policy, and
              ecosystem orchestration. Taken together, the history supports a simple conclusion: TRM is not just alive
              and well funded, but actively widening its role in how governments and financial institutions investigate
              crypto-linked crime.
