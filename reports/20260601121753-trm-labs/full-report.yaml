      - number: '1.4'
        title: Adverse markers and diligence carry-forwards
        blocks:
          - type: paragraph
            body: >-
              The main public downside in this chapter is not a clear commercial failure signal but a mix of
              surveillance criticism and information asymmetry. State of Surveillance argues that blockchain-analytics
              firms track wallet behavior and sell surveillance capability to governments, which is directly relevant to
              TRM because its customer base is explicitly government agencies and financial institutions. That criticism
              does not invalidate TRM’s products, but it does mean privacy, civil-liberties, and evidentiary debates can
              become procurement and reputational risks as the company broadens from crypto tracing into a wider
              AI-investigations narrative.


              The other caution is simply that public evidence gets thin exactly where investors would want precision.
              Current revenue, current headcount, total funding composition, board structure, and exact investor control
              rights are either undisclosed or outsourced to market-data vendors. Even smaller issues point the same
              way: the older /blog/introducing-beacon URL is broken while newer Beacon pages carry the active narrative,
              which makes historical archaeology harder than the polished 2025-2026 surface suggests. So chapter one can
              confidently establish identity, mission, customer reach, and the February 2026 financing, but later
              diligence should request cap-table, org-chart, and governance documents before turning directional scale
              markers into underwritten facts.
