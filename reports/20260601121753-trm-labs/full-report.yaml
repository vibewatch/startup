  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The Series C sets a real price, but not yet a fully underwriteable one
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation fact is the financing itself. TRM and Thoma Bravo both say the company closed a $70
              million Series C at a $1 billion valuation in February 2026, with revenue growth averaging more than 150%
              annually over the prior five years. That makes the price real, recent, and supported by insider
              participation rather than by a stale 2021-style mark. The harder question is whether the current round is
              cheap. Public evidence still has to lean on ZoomInfo's roughly $78.8 million revenue estimate, which puts
              the round at about 12.7x revenue. That multiple is not absurd for a fast-growing compliance platform, but
              it is also not a giveaway when ARR, retention, gross margin, and services mix remain undisclosed. At
              today's price, the right framing is fair-if-real rather than obviously attractive.
            claimRefs:
              - CV001
