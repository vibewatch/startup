  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Frame
      - Evidence-backed point
      - Why it matters
      - What would change the view
    rows:
      - - Thesis
        - TRM raised a real 2026 Series C at $1 billion after claiming 150%+ five-year average revenue growth.
        - The price is current and supported by credible investors, not just by a peak-cycle paper mark.
        - Verified slowing growth or a weak current ARR figure would weaken the thesis quickly.
      - - Thesis
        - Direct peer and strategic comps do not make $1 billion look absurd.
        - >-
          Elliptic at $670 million and Recorded Future at $2.65 billion bracket a plausible band for trusted
          intelligence assets.
        - >-
          If Elliptic-like peers prove much more efficient or TRM lacks comparable product depth, the comp support
          shrinks.
      - - Thesis
        - Public-sector and institutional urgency can justify some premium over plain software medians.
        - Mission-critical compliance and investigations budgets can be durable when illicit-finance pressure rises.
        - If revenue is too project-led or too concentrated, durability turns into a discount rather than a premium.
      - - Anti-thesis
        - The public record still does not disclose ARR, NRR, gross margin, or revenue mix.
        - Without software-quality economics, fair value is easier to argue than upside.
        - A clean data-room read on retention, margins, and mix would improve conviction.
      - - Anti-thesis
        - The current round already prices in much of the good story.
        - Base-case value is near the round price, so investors are not obviously buying below intrinsic value.
        - A lower entry price or strategic-inbound evidence would make the upside/risk balance better.
      - - Anti-thesis
        - Policy and surveillance criticism can cap adoption and multiple expansion.
        - Government relevance helps budgets but also raises scrutiny and reputational risk.
        - If category policy settles into trusted infrastructure demand without backlash, downside risk eases.
    notes: >-
      This table separates company-quality arguments from price-quality arguments. A strong company can still be only
      fairly priced.
