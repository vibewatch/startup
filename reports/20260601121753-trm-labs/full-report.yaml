  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, modules, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              TRM's public surface describes a layered commercial stack rather than a single forensic seat license. The
              company sells wallet screening and transaction monitoring into compliance workflows, broader
              blockchain-intelligence and investigations products into analysts and public-sector investigators,
              API-style sanctions and screening integrations into customer systems, and Beacon Network into a shared
              intelligence layer that can reinforce retention if customers participate deeply. The case-study library
              and investigations positioning also imply a non-trivial services and training attach, because the workflow
              frequently involves onboarding, case support, and operationalization rather than pure self-serve software.
              That read is reinforced by TRM-authored case studies featuring Coinbase with West Midlands Police, a
              separate Coinbase-linked high-stakes case, and Czech organized-crime investigators, which look more like
              operational deployments than commodity self-serve tooling. What is missing is almost every monetization
              detail an investor would want. None of the official product or solution pages in this corpus exposes list
              pricing, a self-serve purchase path, or public discount ladders. The cleanest read is enterprise
              quote-based contracting with recurring revenue characteristics, but realized ASPs, bundle structure,
              contract duration, and software-versus-services mix remain opaque.
