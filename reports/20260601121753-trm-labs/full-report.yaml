      - number: '3.3'
        title: Packaging opacity hides the real win-loss line and pushes diligence toward workflow depth
        blocks:
          - type: paragraph
            body: >-
              A practical challenge in this category is that the retained official pages do not disclose public list
              pricing for TRM, Chainalysis, or Elliptic. That does not mean pricing is unimportant; it means outsiders
              cannot see whether competitive wins come from better product, lower price, heavier services, or bundled
              access to partner networks and compliance expertise. The comparison sites in the corpus likely exist
              because buyers face overlapping feature language but limited pricing transparency. In that environment,
              packaging and switching costs become more important than simple feature presence.


              TRM's likely lock-in comes from configurable screening rules, broad chain and bridge coverage, documented
              APIs, and the possibility that Beacon coordination becomes embedded in incident response. Those are more
              durable than a single dashboard claim, but they also make valuation harder because public sources still do
              not reveal contract length, module attach, discounting, or retention. Investors should therefore treat
              pricing opacity as both a moat signal and a diligence risk: it suggests enterprise depth, but it also
              obscures where competitive intensity is actually clearing in the field.
