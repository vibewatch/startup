    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating scope, and business model
        blocks:
          - type: paragraph
            body: >-
              TRM’s current public identity is more specific than its older “crypto analytics” label. The homepage now
              says 600+ government agencies and financial institutions across 75 countries rely on TRM’s data, software,
              and AI agents, while the about page says the company is building the operating system for investigations
              in the AI era and expanding from blockchain intelligence into broader threat domains. The February 2026
              financing announcement anchors the company in San Francisco and frames the mission around disrupting
              criminal networks and countering national-security threats. ZoomInfo adds a specific 450 Townsend Street
              address, but that street-level detail is database-sourced rather than confirmed on TRM’s own site, so the
              strongest canonical location fact is simply San Francisco headquarters with a public-sector and
              regulated-financial customer base.


              The retained product pages also make the business model legible. TRM’s blockchain-intelligence and
              crypto-business pages describe operational intelligence rather than passive analytics: 190+ blockchains,
              1.9B+ assets, and 720+ bridges covered for risk screening and cross-chain tracing. Banking and compliance
              pages show the product is sold into workflow-heavy, enterprise-style use cases such as wallet screening,
              transaction monitoring, and bank onboarding rather than to consumers. Put differently, TRM appears to
              monetize proprietary blockchain data, investigative software, compliance tooling, and increasingly
              AI-assisted workflows sold to agencies, banks, exchanges, and adjacent institutions. That is the core
              operating frame later chapters should reuse.
