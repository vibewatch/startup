          description: Visa and customer executives provide directional proof of usage but still leave deployment depth unclear.
          claimRefs:
            - CU008
            - CU034
        - id: named-workflow
          label: Named workflow
          description: >-
            Circle, HIFI, HSI, and Coinbase-linked cases specify transaction monitoring, tracing, or case-management
            use.
          claimRefs:
            - CU007
            - CU010
            - CU012
            - CU019
