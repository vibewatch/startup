  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth normalization
        - Growth falls well below hypergrowth without offsetting margin proof.
        - The premium over software medians disappears quickly.
        - Re-cut valuation closer to the bear case or pass.
      - - Services-heavy mix
        - A large share of revenue is project or investigations work rather than recurring software.
        - Current multiple would overstate revenue quality.
        - Downgrade recommendation and push for lower entry price.
      - - Government concentration
        - Too much revenue depends on a small set of agencies or annual procurement cycles.
        - Durability turns into concentration and budgeting risk.
        - Treat valuation as stretched unless margin and renewal quality are exceptional.
      - - Cap-table overhang
        - Preferences or secondaries absorb too much exit value.
        - Fair headline valuation no longer translates into fair investor returns.
        - Pause until cap-table terms are fully understood.
      - - Policy backlash
        - Privacy or surveillance criticism materially reduces addressable adoption.
        - Multiple expansion case collapses and downside case rises.
        - Move to track or avoid depending on severity.
    notes: >-
      These are action-oriented kill triggers, not background risks. If one clears, the recommendation should change,
      not just the narrative.
