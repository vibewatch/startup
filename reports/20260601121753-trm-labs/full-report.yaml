      - number: '2.3'
        title: Regulatory catalysts and why the buyer pool keeps widening
        blocks:
          - type: paragraph
            body: >-
              Regulation is the main reason the buyer pool is widening beyond crypto-native firms. MiCA institutes
              uniform EU crypto-asset rules and the Commission is still publishing delegated acts that make those
              obligations more operationally specific. FinCEN’s guidance keeps administrators and exchangers inside the
              BSA perimeter, while FATF continues to treat VA or VASP controls as a global AML/CFT baseline. In the
              United States, the White House’s digital-finance order, the GENIUS Act framework described by KPMG, and
              the OCC’s clarification that banks can provide custody and execution services all point in the same
              direction: more lawful institutional activity, but only with stronger controls.


              That matters because banks and payments firms are now real buyers, not future hypotheticals. The Federal
              Reserve says stablecoin market capitalization grew by more than 50% in 2025. Stripe reports $9 trillion of
              adjusted stablecoin payment activity between October 2024 and October 2025, up 87% year over year. Visa is
              explicitly marketing stablecoin infrastructure to banks and wallets. Morgan Stanley and the World Economic
              Forum both frame digital assets as moving toward mainstream capital-markets and payments infrastructure.
              Together these sources imply a market where exchanges remain the largest current spend bucket, but
              incremental growth increasingly comes from banks, payment firms, and institutions building digital-asset
              products on top of traditional compliance expectations.
