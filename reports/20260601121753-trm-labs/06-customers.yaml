          value: 100
        - label: Names with at least a testimonial or role-specific quote
          value: 70
        - label: Names with explicit workflow or deployment detail
          value: 45
        - label: Names with a concrete operational outcome or case result
          value: 25
        - label: Names with public retention or contract-economics disclosure
          value: 5
    approximationNotes: Values are indexed analytical gates rather than literal percentages; they show how quickly proof quality falls off after deployment evidence appears.
