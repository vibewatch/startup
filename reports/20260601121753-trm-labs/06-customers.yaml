  - id: beacon-network-as-expansion-surface
    title: Beacon Network broadens TRM from point product into a shared customer network layer
    body: |-
      Beacon is the clearest sign that TRM is trying to turn existing compliance and investigation customers into a networked ecosystem. Official TRM material says Beacon is a real-time intelligence-sharing system for law enforcement, exchanges, DeFi services, and stablecoin issuers. The official operating logic is concrete rather than conceptual: vetted investigators flag illicit addresses, funds are auto-traced, participating exchanges or financial institutions receive immediate alerts, and members can review or hold funds before withdrawal. Independent coverage from Ledger Insights, The Block, and Fintech News America corroborates named founding or early members such as Coinbase, Binance, PayPal, Kraken, Ripple, Zodia Custody, Robinhood, Stripe, and others.

      This matters because Beacon looks like more than a branding exercise. TRM's own page claims early interdiction outcomes including $1.5 million frozen, $800,000 put on track for recovery, and a bridge protocol that blocked 100% of attempts from flagged scam addresses. Coinbase, Kraken, Ripple, and Zodia executives are quoted describing Beacon as an early-warning system or as infrastructure for broader institutional adoption. The commercial caveat is that Beacon's public surface still emphasizes free or affiliate access and does not disclose paid attach, conversion, or incremental ACV. So Beacon is a credible expansion and retention hypothesis, but not yet a publicly modelable revenue line.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU040
    tableRefs: []
    figureRefs:
      - FU002
  - id: durability-and-concentration-gaps
    title: Durability, concentration, and procurement-friction evidence remain thin
    body: |-
      The biggest open question in this chapter is not whether TRM has customers, but whether the public record is rich enough to underwrite retention quality and concentration risk. None of the retained public sources discloses NRR, GRR, churn, standard contract duration, top-customer exposure, or a government-versus-private revenue split. That is especially important because the most detailed public proof skews toward public-sector investigations and compliance-heavy buyers. The mix may be attractive because those workflows are mission critical, but the corpus does not let an investor measure whether growth is diversified or whether a small set of government or regulated-financial accounts dominates the book.

      There is also a qualitative procurement-friction risk. The ACLU's broader privacy-and-surveillance critique is not TRM-specific, but it is relevant to any vendor whose tools help governments and institutions track digital financial activity. In practical diligence terms, that means the chapter can confidently say TRM has real deployment proof and a promising network-effect surface, while still insisting on data-room evidence before underwriting renewal durability, Beacon economics, or customer concentration. Public customer evidence is real; public customer economics remain mostly opaque.
    claimRefs:
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
