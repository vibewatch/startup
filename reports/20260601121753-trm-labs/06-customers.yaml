  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Provide NRR, GRR, churn, contract duration, and cohort renewal data by government, exchange, bank, and payments segments.
      whyItMatters: Without retention metrics, investors can verify deployment reality but cannot underwrite durability or expansion quality.
      diligencePath: Request customer cohort analysis, renewal calendar, and top-module attach data from the data room.
      relatedQuestionRefs:
        - QU019
      relatedTableRefs:
        - TU004
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Provide government-versus-private revenue mix, top-10 customer share, direct-versus-channel sales mix, and geography concentration.
      whyItMatters: Customer concentration can materially change valuation, risk rating, and resilience to budget or regulatory shocks.
      diligencePath: Request revenue concentration schedules, reseller reports, and segment-level ARR breakdowns.
      relatedQuestionRefs:
        - QU020
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: material
      topic: beacon-economics
      missingEvidence: Provide Beacon member counts by free versus paid tier, usage intensity, paid conversion, and incremental ARR or retention impact.
      whyItMatters: Beacon may be strategically valuable, but without monetization data it cannot be treated as a proven economic moat.
      diligencePath: Request Beacon pricing, attach rates, member cohort behavior, and case studies tying Beacon to renewals or upsells.
      relatedQuestionRefs:
        - QU021
      relatedTableRefs:
        - TU004
        - TU005
    - type: private-evidence-only
      severity: material
      topic: logo-proof
      missingEvidence: Provide named deployment documents or customer-authored updates for logo-level references such as PayPal, Visa, Robinhood, or Anchorage.
      whyItMatters: Logos can overstate production breadth if they represent pilots, ecosystem participation, or historical relationships instead of active paid deployments.
      diligencePath: Request a customer-reference list that shows module set, go-live date, and current commercial status for each marquee logo.
      relatedQuestionRefs:
        - QU018
      relatedTableRefs:
        - TU001
        - TU003
