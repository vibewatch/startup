      - Buyer / user / payer
      - Named proof
      - Production signal
      - Strategic value
      - Public gap
    rows:
      - - Law enforcement and investigative agencies
        - Investigators, cybercrime units, supervisors, and public budget owners
        - West Midlands Police, Czech NCOZ, HSI, Victoria Police, Marion County, Massachusetts AG
        - Strongest proof in chapter because sources name live investigations, seizures, or victim-recovery workflows
        - Mission-critical use cases can support sticky budgets and references
        - Public spend, renewal timing, and seat growth are undisclosed
      - - National security and federal cyber investigations
        - HSI, ICE, FBI-linked investigative teams, and national-security bodies
        - HSI case study, ICE purchase notice, homepage and funding coverage
        - Real procurement and mission fit are visible, but exact federal module scope is still partial
        - Opens larger, less cyclical government budgets and adjacencies
        - No agency-by-agency ACV or contract duration disclosure
      - - Exchanges and crypto businesses
        - Compliance leaders, AML teams, investigations teams, and exchange operations
        - Coinbase-linked cases, Beacon founding members, WEF profile, fintech.global customer mentions
        - Production proof exists for Coinbase-linked investigative work and for some Beacon participation, but many logos remain scope-light
        - Core installed base for monitoring, tracing, and rapid interdiction workflows
        - Logo references do not prove paid production deployment or retention
      - - Stablecoin issuers and payment infrastructure
        - Compliance, risk, treasury, and operations teams
        - Circle, HIFI, PayPal/Stripe/Robinhood via Beacon, Visa testimonial
        - Circle and HIFI are workflow-rich; PayPal, Stripe, Robinhood, and Visa are weaker or network-level proofs
        - Expands TRM into fast-growing stablecoin and payments budgets
        - Public monetization and services burden are not disclosed
      - - Banks and financial institutions
        - Onboarding, compliance, and financial-crime teams
        - Banking page, HIFI banking-partner diligence, fintech.global mention of Cross River Bank and Visa
        - Proof is credible but shallower than law-enforcement casework
        - Bank adoption could raise switching costs and enterprise relevance
        - Active-bank roster, monitored volume, and contract economics remain private
      - - Network and ecosystem members
        - Exchanges, issuers, DeFi services, security researchers, and law-enforcement partners
        - Beacon official page plus Ledger Insights, The Block, and Fintech News rosters
        - Shows a collaborative response network rather than only standalone software seats
        - Could improve expansion and retention if member workflows deepen
        - Free membership and undisclosed attach rate mean ecosystem reach is not the same as revenue
    notes: Public evidence is segmented by proof quality, not just logo count; rows distinguish workflow-rich deployments from testimonial or network-level mentions.
