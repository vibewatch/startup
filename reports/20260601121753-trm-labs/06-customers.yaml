  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Beacon network layer
        - Free affiliate access and undisclosed paid conversion could overstate monetized adoption
        - Strong strategic value but uncertain incremental ARR and retention lift
        - Request Beacon member tiers, paid attach, usage intensity, and renewal behavior
      - - Government and investigative casework credibility
        - Public proof skews heavily toward agencies and law-enforcement workflows
        - Could imply budget durability, but also hidden public-sector concentration
        - Request revenue split by government, private-sector, and geography plus top-10 customer share
      - - Bank and payments relevance
        - Visa, PayPal, Robinhood, and similar names are not all proven as full production accounts
        - Logo breadth may exceed directly proven paid deployment breadth
        - Request named bank/payment customer roster with modules, go-live dates, and ACV
      - - Stablecoin and infrastructure workflows
        - Implementation may carry services-heavy compliance and onboarding work
        - Could deepen expansion but dilute pure-software economics
        - Request services attach, implementation duration, and software-versus-services mix for HIFI/Circle-like accounts
      - - Customer-proof concentration in vendor-authored stories
        - Most strongest references are company-published case studies
        - Real deployments are visible, but independent renewal evidence is thin
        - Request independent customer references, procurement records, or customer-authored updates for the same accounts
      - - Civil-liberties and surveillance scrutiny
        - Privacy backlash can complicate some government or institutional procurements
        - Could slow expansion in sensitive jurisdictions or regulated institutions
        - Request procurement win/loss reasons, false-positive controls, and legal-review history for contested deployments
    notes: Risks are framed as underwriting gaps rather than contradictions; the public corpus supports adoption reality but not durable concentration math.
