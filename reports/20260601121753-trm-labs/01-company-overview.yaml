      - FO003
  - id: founders-leadership-and-stakeholders
    title: Founders, visible leadership, and stakeholder map
    body: >-
      The public source set is better on TRM’s founding pair than on its full leadership bench.
      Market-data profiles retained in the local corpus identify Esteban Castaño and Rahul Raina as
      the 2018 founders, while current public-facing evidence in this run shows Ari Redbord and
      Angela Ang as visible policy leaders through congressional commentary and TRM’s own quarterly
      policy programming. That combination is enough to establish founder-market fit and a
      policy-facing go-to-market layer, but not enough to reconstruct a full executive roster or
      current board map from public evidence alone. In practical diligence terms, TRM looks
      founder-shaped with a narrow set of visible spokespeople rather than like a company that
      publishes a complete governance surface.


      The stakeholder picture is clearer on capital than on control. The February 2026 Series C
      brought in a syndicate spanning Blockchain Capital, Goldman Sachs, Bessemer, Thoma Bravo, Citi
      Ventures, Y Combinator, Galaxy Ventures, CMT Digital, DRW VC, Alumni Ventures, and Brevan
      Howard Digital. That mix matters because it combines crypto-native capital, mainstream
      financial institutions, growth-equity brand names, and early-stage ecosystem validators in one
      round. At the same time, neither the official announcement nor the retained databases expose
      exact ownership concentration, board seats, observer rights, or liquidation preferences. The
      result is a company with meaningful outside validation but still material public opacity
      around governance and control rights.
    claimRefs:
      - CO006
      - CO007
      - CO021
      - CO023
      - CO024
      - CO028
      - CO029
      - CO040
      - CO041
      - CO042
