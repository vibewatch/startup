  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount-visibility
      missingEvidence: A management-owned current employee count, ideally broken out by function and geography.
      whyItMatters: >-
        Headcount is a core maturity and efficiency signal, and public databases only provide rough
        directional estimates.
      diligencePath: >-
        Request a current org chart, HR-approved employee count, and a bridge from any third-party
        headcount listings to the report date.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: revenue-visibility
      missingEvidence: Management-approved current ARR or revenue run-rate plus revenue mix by customer segment.
      whyItMatters: >-
        The strongest public number in the retained corpus is a ZoomInfo estimate, which is not
        enough for valuation underwriting.
      diligencePath: >-
        Request current ARR, trailing-twelve-month revenue, and public-sector versus private-sector
        mix directly from finance leadership.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-control
      missingEvidence: >-
        A current cap table, Series C ownership allocation, board seat map, and any investor
        protective-rights summary.
      whyItMatters: >-
        The public round announcement reveals validation but not who controls governance,
        liquidation preference, or future financing leverage.
      diligencePath: >-
        Request the current cap table, board deck ownership summary, and the executed Series C term
        sheet or charter extracts.
      relatedQuestionRefs:
        - QO012
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: board-roster
      missingEvidence: >-
        A complete current board roster and committee structure, plus any named executive roster
        beyond the founders and policy spokespeople.
      whyItMatters: >-
        Key-person risk and governance quality are hard to judge when the public record shows only a
        narrow slice of current leadership.
      diligencePath: >-
        Request an up-to-date board list, committee assignments, and executive directory from
        management or investor materials.
      relatedQuestionRefs:
        - QO014
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: milestone-chronology
      missingEvidence: >-
        A fuller early chronology covering incorporation date, earliest product launches, and any
        pre-2021 financing or customer milestones.
      whyItMatters: >-
        The chapter can establish a usable public timeline, but it is still a partial chronology
        shaped by what remains visible on the open web.
      diligencePath: >-
        Request the company history slide or internal milestone chronology and reconcile it against
        archived announcements and customer references.
      relatedQuestionRefs:
        - QO016
      relatedTableRefs:
        - TO004
