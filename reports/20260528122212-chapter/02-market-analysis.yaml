  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dollar-tam
    missingEvidence: A direct public estimate of annual revenue pool or gross margin pool for independent Medicare navigation and brokerage services.
    whyItMatters: Beneficiary counts and plan counts show complexity, but they do not directly translate into venture-scale revenue opportunity.
    diligencePath: Obtain commission schedules, enterprise contract ranges, or internal contribution-margin data by customer channel.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Average revenue per beneficiary, average commission economics, and partner-funded economics across health-system, advisor, and publisher channels.
    whyItMatters: Without channel economics, it is impossible to convert market demand into unit-economic conviction.
    diligencePath: Request channel-level CAC, monetization, take-rate, and retention data from the company.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: policy-stability
    missingEvidence: A settled post-litigation view of broker-compensation rules and marketing enforcement after the 2024-2025 court challenges.
    whyItMatters: Rule instability can change broker economics and compliance cost assumptions from one season to the next.
    diligencePath: Track final court outcomes, rule updates, and CMS guidance releases before underwriting long-term economics.
    relatedQuestionRefs:
    - QM019
    - QM020
    relatedTableRefs:
    - TM004
