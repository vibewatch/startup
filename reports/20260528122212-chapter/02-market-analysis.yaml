callouts:
- calloutType: strength
  title: The market is big enough on beneficiary volume alone
  body: Even without a clean dollar TAM, the combination of 35 million Medicare Advantage enrollees, 32 average plan choices, and active annual review windows creates a large recurring decision market.
  claimRefs:
  - CM006
  - CM007
  - CM009
- calloutType: risk
  title: Broker economics sit under active regulatory and legal pressure
  body: OIG, Medicare Rights, and the Center for Medicare Advocacy all point to consumer-harm concerns around commissions, marketing, and broker conduct. That makes the market real, but structurally unstable.
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM034
- calloutType: assumption
  title: The key commercial bet is that complexity converts into trusted, monetizable guidance
  body: Chapter’s market only supports venture-scale returns if the complexity of choosing and using Medicare plans consistently translates into partner-funded or carrier-funded navigation demand.
  claimRefs:
  - CM032
  - CM038
  - CM039
  - CM040
