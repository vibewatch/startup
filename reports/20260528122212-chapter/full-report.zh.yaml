      - number: '8.2'
        title: 融资背景和公开市场参照点
        blocks:
          - type: paragraph
            body: >-
              测试 Chapter 私募定价的最佳方法，是把它放到公开披露的在线经纪商组合旁边，同时诚实承认商业模式差异。eHealth、GoHealth 和 SelectQuote 都提供 Chapter
              没有的投资人级披露：年报页面、SEC 文件界面、定期业绩发布和公开市场统计。这些披露揭示了严酷现实：上市在线经纪商的股权价值相对收入很小或被压缩，有些还背着沉重债务或应收款余额。Yahoo 和
              CompaniesMarketCap 显示，eHealth 市值约 $49.83M，GoHealth 约 $19.14M，SelectQuote 约 $0.17B。它们的 EV /
              收入读数很嘈杂，因为杠杆会扭曲企业价值；但这组公司仍向投资人说明一件重要事：该品类不会被当作干净 SaaS 对待。GoHealth 强调续约经济性和现金纪律。SelectQuote 披露 LTV、CAC
              效率和佣金应收款。市场要的是续约质量、回本和回款证明，而不只是营收增长。Chapter 尚未披露到这个运营细节层级。
