  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 真实牵引力：Series D 和 Series E 均已完成，2025 年收入增长 3x，ARR 超过 $100M。
        - 如果 Chapter 披露留存、现金转化和合作伙伴续约经济性，判断会进一步增强。
      - - 与纯线索生成模式相比，合作伙伴和客户证据显示 Chapter 有差异化信任层。
        - 如果投诉率、合作伙伴集中度或匹配不佳案例比当前公开证据显示得更严重，判断会走弱。
      - - 公开市场 eBroker 的股权价值被压缩，还承受债务或应收款压力，因此需要估值纪律。
        - 如果 Chapter 证明留存、CAC 和集中度指标显著优于公开同业，这一点的重要性会下降。
      - - 2026 年精确定价未披露，投资人承销的是不透明估值标记，而不是透明价格。
        - 如果管理层披露 2026 年股价、投后估值和清算优先权，判断会立即改善。
      - - 相对公开同业享有溢价可能部分合理，但现有证据无法说明多少溢价站得住。
        - 更强的溢价论证需要更多经过审计的证据，以及更清晰的可持续利润率路径。
    notes: 本表拆开业务质量论点和价格纪律论点，避免推荐意见塌缩成泛泛的公司质量评分。
