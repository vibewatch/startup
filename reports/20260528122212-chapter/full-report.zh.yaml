      - number: '3.2'
        title: 定价、包装与分发权力
        blocks:
          - type: paragraph
            body: >-
              整个品类面向买方的包装惊人相似。Chapter 称顾问渠道咨询免费，客户保费不变；GoHealth 称电话咨询不收费；SelectQuote 宣传免费、无义务比价；eHealth
              则称由保险公司而非消费者付费。这降低了老年人的即时切换摩擦，但也意味着真正的经济战场大多藏在页面之外。公开材料很少说明实际佣金率、续期组合、合作伙伴收入分成或分渠道回本情况。SelectQuote
              是少数例外：在当前公开报告中，它披露了获批保单量和 6.7x 收入 / CAC 倍数，说明大型上市经纪公司围绕队列经济模型管理业务，而不是围绕消费者订阅或软件费。

              因此，分发权力比前端定价更重要。Chapter 正在推进合作伙伴渠道，并称 ARR 超过 $100M；但 GoHealth 可以指向 10 million 受信任消费者和可见的 enrollment
              后支持，SelectQuote 则在多个保险品类拥有更宽的交叉销售和数百万相邻品类客户。eHealth
              仍然重要，因为它公开描述保险公司付费模式和广泛保险公司接入，让消费者和合作伙伴更容易读懂，而许多私营挑战者做不到。点评信号也强化了同一模式：GoHealth 的存档 Trustpilot 页面显示约 42,972
              条评论和 4.8 评分快照；SelectQuote 的存档 Trustpilot 标题仍带有 4.4 评分。竞争信息很清楚：买方价格通常为零，品牌、合作伙伴覆盖和留存经济模型才是真正武器。
