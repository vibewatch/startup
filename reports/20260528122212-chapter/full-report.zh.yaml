  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Chapter 看起来是一家有真实牵引力的真实公司，但估值需要的不只是欣赏。最干净的公开定价锚点仍是 2025 年 4 月 Series D，外界广泛报道估值约 $1.5B。2026 年 4 月 Series E
              明确又融资 $100M，并称估值超过翻倍，但管理层没有披露确切新数字。即便没有精确目标，这组信息也足以形成立场：公司大概率越过 $3.0B 下限，与此同时只披露 ARR 超过
              $100M，并隐去烧钱速度、债务、留存和股权条款等关键承销输入。换句话说，Chapter
              可能是一家好公司，但公开证据仍让投资人在为不透明价格做承销。因此，正确建议是观察，而不是买入。这个判断不是说业务坏了，而是说价格敏感度和证据敏感度都重要；当前证据更能证明公司质量，却不能证明这个估值标记是否公平。
