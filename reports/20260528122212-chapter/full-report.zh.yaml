      - number: '7.3'
        title: 合作伙伴、渠道和客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Chapter 的分销模型看起来可信，恰恰因为它嵌在可信中介里：医疗系统、顾问网络、出版方和社区型组织。HSHS、Raymond James 和 Ramsey
              都提供了在线流程证据，说明合作伙伴模型真实存在。Fierce
              又补上一个重要角度：公司几乎不用直接面向消费者的广告，意味着模型有意由合作伙伴驱动，而不是单纯机会主义。跑通时，这能提高效率并增强信任；若大型合作伙伴表现不及预期，或合作伙伴信任受损，也会产生替代风险。公开材料仍未披露头部合作伙伴集中度、合同期限、排他性或收入分成条款，因此投资案例无法判断增长是广泛分布，还是依赖少数渠道。ReviewFeeder
              对雇主、福利专业人士、非营利组织、宗教机构和社区领袖的描述进一步扩大了触达面：更多渠道可能降低单一标识依赖，也会增加监督复杂度。结果是，模型在分销证明上强，在集中度透明度上弱。
