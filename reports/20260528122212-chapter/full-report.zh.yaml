      - number: '5.4'
        title: 成熟度、差异化与产品技术风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这样一个判断：Chapter 的产品比单次使用的 enrollment 漏斗更成熟。至少从 2022 年和 2023 年起，工作流已经公开成型；2025–2026
              年新闻稿显示更多模块已进入生产。公司最强的差异化主张不是「有软件」。GoHealth、CoverRight 和 eHealth 等竞争对手都营销计划匹配技术和持牌代理支持的某种组合。Chapter
              的差异化主张是，它搜索每一个可用计划，并让顾问薪酬在不同计划选择之间保持中性。如果属实，在一个仍因激励错位受批评的市场里，这是有意义的产品和信任优势。

              风险端同样具体。医生目录和处方计算器正是在解决 CMS 自己强调过的数据问题，这意味着它们依赖变化且不完美的外部输入。OTC
              应用作为全年效用入口看起来有希望，但公开来源没有披露零售商经济模型或重复使用质量。招聘页面显示团队刻意保持小规模，这能保住专注，也会集中运营经验。最重要的是，Chapter 现在把自己定位为 AI
              原生，却没有公开模型治理、可靠性或外部保证细节。因此，产品技术结论是：工作流成熟度和实际效用为正，但证明准确性、韧性和防御性的量化证据仍不完整。
