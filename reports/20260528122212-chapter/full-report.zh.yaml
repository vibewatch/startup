      - number: '2.3'
        title: 增长驱动、约束与采用路径
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动因素支撑这个市场。Medicare Advantage 登记人数过去二十年稳步上升，额外福利仍是主要卖点，受益人面对的决策环境仍有高计划数量、网络差异和福利设计复杂度。KFF 和 Milliman
              都暗示，即便增长速度放缓，计划仍在围绕增值福利竞争。Chapter 的相关性在复杂性撞上高风险决策时最强，比如医生连续性、药品可负担性，或年度 enrollment 期间的困惑。Special Needs
              Plans 尤其重要，因为它推动了 2026 年大部分登记增量，说明增长最快的细分也可能是受益人最难在没有帮助时自行导航的部分。

              约束同样真实。OIG 正在开展一个关于误导性 Medicare Advantage 营销的项目；Medicare Rights 认为佣金和行政奖金会扭曲经纪人行为；Center for Medicare
              Advocacy 称，原本旨在遏制滥用的薪酬规则遭到法院挑战并被搁置。与此同时，KFF 观察到 2026 年普通 enrollment
              计划选择变少，这意味着保险公司经济模型趋紧，尽管总登记人数仍在增长。因此，Chapter
              的采用路径取决于它能否说服受益人和合作机构：第三方指导能改善结果，同时仍在一个高度监管、政治争议大、直接经济规模仍难测算的市场中运作。
