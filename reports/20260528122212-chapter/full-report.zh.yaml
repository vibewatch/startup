      - number: '5.3'
        title: 信任、合规与消费者保护控制
        blocks:
          - type: paragraph
            body: >-
              信任是产品核心，不只是法律脚注。Chapter 发布了异常明确的牌照页面，包含逐州保险销售牌照、代理机构 NPN、纽约地址和投诉路径。法律页面和合作伙伴页面反复披露：Chapter 不隶属于 Medicare
              或任何政府实体；公司代表许多但不是全部计划；用户仍可向 Medicare.gov 或 1-800-MEDICARE
              询问完整选项。合作伙伴预约流程也同样明确，要求对电话和短信作出明示书面同意，并把互动标记为来自持牌代理的保险招揽。

              最重要的信任控制是激励设计。Chapter 称顾问薪酬不随计划选择而变化；参议院证词称，公司有意设计推荐，使其不局限于已签约保险公司。这很重要，因为该品类的营销风险真实存在：HHS OIG 正在审查欺骗性
              Medicare Advantage 营销行为，Chapter
              自己也公开主张，混乱营销和不良激励是结构性问题。公开记录的弱点在于，已发布控制停留在披露、徽章和政策表述上。没有外部保证包展示这些控制在实践中如何审计或执行。
