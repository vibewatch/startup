      - number: '2.2'
        title: 规模测算视角、细分与买方地图
        blocks:
          - type: paragraph
            body: >-
              公开来源更能支撑受益人数量测算，而不是美元市场规模测算。KFF 报告称，截至 2026 年 2 月，Medicare Advantage 登记人数略高于 35 million，同比增加 1.1
              million；2025 年，34 million 名受益人占符合资格人口的 54%。2026 年，平均每位受益人可在 32 个 MA-PD 计划中选择；仅加州就有 6.5 million 名 Medicare
              受益人和 330 个 MA 计划。Mark Farrah 的 2024 年视图统计了 5,805 个不同 Medicare Advantage
              产品，凸显老年人和顾问需要穿越多深的计划碎片化。这些数据证明，一个大型且仍在增长的决策市场已经存在，即便它们没有直接给出独立导航公司的收入池。

              买方地图也是多边的。终端用户是受益人，但底层理赔付款方是 CMS 支持的私人计划；获客影响力则可能掌握在医疗系统、理财顾问和内容出版商手里。Chapter
              自己的合作伙伴材料和合作证明页面把这一点讲得很直白。医疗系统希望在用户转入 Medicare 时保住网内关系；财富顾问希望保护退休客户结果和转介绍；出版商希望围绕老年受众建立可信的变现和服务层。这种组合让
              Chapter 的市场更像嵌入式分发加受监管建议，而不是典型消费 App 市场。
