      - number: '6.3'
        title: 满意度、重复使用和持久性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开可见的最佳持久性证据仍是代理指标。评价样本又深又新：官方关于页面和两个 REVIEWS.io 页面都显示 6,126 条评价、4.9 分和 98% 推荐率。评价镜像和 Ramsey
              证言的定性主题一致：安心感、耐心解释、医生和处方匹配，以及长期适配，而不是只追求第一年最便宜。全年权益维护文章和 HSHS 公告进一步说明，关系应在入组后延续；OTC Store
              又增加了一个入组后场景，让会员继续从计划中获得价值。


              证据仍不能在财务维度上回答持久性问题。公司材料称受益人和企业合作伙伴留存处于行业领先，但没有公布数字。公开资料没有
              NRR、GRR、流失率、合同期限或续约数据。因此，客户记录可以说在满意度和支持上很强，但在持久性上仍只是部分成立。公开证据足以证明人们在使用服务，而且通常喜欢它；但还不足以用投资人级留存指标证明这些关系到底有多黏。
