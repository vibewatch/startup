  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、既有玩家和新数字化进入者
        blocks:
          - type: paragraph
            body: >-
              Chapter 面对的是分层的 Medicare 导航市场，而不是单一正面竞争对手。最接近的公开可比公司是 eHealth、GoHealth 和
              SelectQuote：三家公司都组合了多保险公司比价、持牌代理和面向消费者的数字 enrollment；它们在公开市场上的表现也说明，Medicare
              经纪业务可以做到有意义的规模，却不一定带来明显的股票市场热情。eHealth 仍把自己定位为该品类的独立老牌公司，已有 25 年以上市场历史，可接入 180+ 家保险公司，拥有 MatchFinder
              式计划匹配，并有大约 $528.91 million 的过去十二个月收入。GoHealth 通过 PlanFit、声称 10 million 消费者信任和明确的全年支持，推同一类宽泛承诺。SelectQuote
              是结构上更宽的市场平台，因为它把 Medicare 叠在寿险、房屋和车险之上；其 2026 财年第三季度报告仍显示 $430.9 million 合并季度收入，以及 6.7x 收入 / CAC 倍数。

              私营挑战者证明，从产品故事角度进入这个品类仍然容易。CoverRight 和 Healthpilot 都营销技术加顾问的混合模式，围绕简化复杂决策搭建；Healthpilot 明确称 100,000+
              名会员选择它而不是独自处理，CoverRight 则把自己定位为面向 65+ million 人 Medicare 受众的现代、透明管家式服务。这让同业集合足够宽，Chapter
              不能只靠「唯一一家有软件、对消费者友好的经纪公司」自居。它的局部竞争优势必须来自分发、信任和执行，并且要面对一个已有多个玩家同时声称具备 AI、匹配和持牌指导的市场。
