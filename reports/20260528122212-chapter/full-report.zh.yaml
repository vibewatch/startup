  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Chapter 的公开页面讲清了两件事，也留下了第三件明显不透明的事。第一，公司不向消费者或顾问渠道客户收费；合作伙伴页面称没有成本、保费不变，法律免责声明确认其持牌保险代理结构和全国 Medicare
              计划数据库。第二，获客和交付模式是咨询式，而不是纯自助软件结账流：潜在客户会被询问医生、处方和优先事项，网站也明确把教育内容导向顾问对话。Chapter
              没有公布的是后端变现栈的具体结构。最干净的公开推断是，Chapter 运作在同业广泛使用的计划付费经济模型里，因为 eHealth 明确称保险公司补偿它，GoHealth 和 SelectQuote
              都营销免费消费者指导，Medicare Rights 也指出 MA 与 MA-PD 经纪人会收到计划支付的佣金。

              这个推断仍需谨慎对待。Chapter
              没有披露实际佣金率、初始佣金与续期佣金组合、合作伙伴收入分成，或任何明确收入确认政策。法律免责声明甚至加入了质量限定：节省金额由用户自报，且不保证。结果是一个方向上能读懂、但无法完全承销的收入故事。公开证据支撑一个强劲收入叙事——全计划搜索、50
              家机构、18,160 个产品、合作伙伴分发、免费咨询式工作流——但不能解释每一次辅助 enrollment 如何转成确认收入或现金的准确机制。
