  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与待完成任务
        blocks:
          - type: paragraph
            body: >-
              Chapter 并不是在进攻整个老年医疗经济。公开证据指向一个更窄但仍然很大的任务：帮助受益人决定何时进入 Medicare、比较计划选项、完成 enrollment，并在之后有效使用权益。CEO
              的参议院证词最清楚地划出了这个边界。证词明确描述了对 Medicare Advantage、Medicare Supplement、Part D 和 Special Needs Plans
              的比较，并把核心痛点定义为决策复杂，而不是保险需求不足。这个区分很重要，因为它把 Chapter 与保险公司、医疗服务公司或纯老年财务出版商分开。公司销售的是受监管选择架构里的导航、推荐质量和可信指导。

              现状替代方案是 Medicare.gov Plan Compare 加自学。公开证据显示，现状有用但不完整：参议院证词称 Plan Finder
              缺少整合的医生网络数据，对部分附加福利也只有二元可见性；加州指南则显示，受益人仍要经历 Part A/B enrollment、补充计划比较和年度复核的分阶段流程。因此，市场边界包括高摩擦的 Medicare
              决策支持、全年计划使用帮助，以及嵌入合作伙伴的退休指导；不包括承保风险、医疗服务交付和大部分下游临床支出。
