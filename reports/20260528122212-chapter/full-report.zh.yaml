      - number: '3.4'
        title: 护城河耐久性、商品化与反向信号
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是数字化 Medicare 导航没有需求；而是这个品类看起来仍然经济脆弱、战略上容易被模仿。Medicare Market Insights 反复把 eHealth、GoHealth 和
              SelectQuote 视为一个独立 eBroker cohort；GoHealth
              最新业绩评论也公开描述了一次市场重置：首年续期概率、利润完整性、流动性和整合准备度比原始规模更重要。公开市场数据强调了同一点：eHealth、GoHealth 和 SelectQuote
              都支撑着有意义的收入基础，但股权价值仍然有限。投资人实际上在说，应收佣金、留存和保险公司行为，比首页打磨更重要。

              因此，耐久性取决于对手无法低成本复制什么。已审阅来源显示，推荐技术本身不够，因为几乎每个重要替代方案现在都会在持牌人工指导旁边营销 AI、匹配或专有逻辑。更持久的优势更可能来自渠道或信任：Chapter
              的合作伙伴分发，GoHealth 的点评足迹和 enrollment 后支持叙事，eHealth 的明确薪酬披露和广泛保险公司接入，以及 SelectQuote
              的交叉销售引擎与公开单位经济模型透明度。即便如此，Medicare Rights 也警告，佣金激励可能扭曲经纪人行为。实际尽调结论是：如果 Chapter
              有护城河，它大概率在分发质量和消费者信任中，而不是在单独算法里；这些优势必须比拥挤市场的模仿速度更快复利。
