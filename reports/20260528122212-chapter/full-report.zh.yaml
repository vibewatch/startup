      - number: '4.2'
        title: 销售动作、渠道经济模型与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开页面显示，Chapter 的 GTM 建在合作伙伴转介绍、教育内容和持牌顾问转化之上，而不是轻量软件结账流。杂志中心、长期有效的 Medicare 解释文章和反复出现的「Talk to an
              Advisor」提示，看起来像经典的教育到咨询漏斗。顾问渠道页面又加入了更重运营的现实：持牌代理对话、营销同意、医生和处方复核，以及个性化推荐。这大概率意味着成本结构主要由顾问人力、合规、保险公司集成工作、合作伙伴管理和数据产品维护构成。Chapter
              自己的新闻稿也强化了这个判断：2025 年资本用于企业合作和数据基础设施；随后公司强调，2025 年收入增长 3 倍、ARR 超过 $100 million 的同时，公司员工数保持平稳。

              Chapter 是私营公司，因此最好的公开单位经济模型代理来自上市同业。SelectQuote 披露，每张获批保单的佣金终身价值为 $904，每张 MA/MS 保单的总收入约 $2,490，收入 / CAC
              倍数为 6.7x。GoHealth 称，公司主动减少首年续期概率不足以支撑经济模型的活动，并投资 AI 来降低 CAC、改善第一年回本，同时把经营现金流作为主要资本配置视角。这些披露强烈暗示，分析 Chapter
              时应把它看成高接触、对续期敏感的经纪模型，而不是 SaaS 公司。缺失部分是 Chapter 自己的渠道数学：CAC、回本周期、按合作伙伴类型拆分的贡献，以及内容驱动需求是否真的比直接效果广告更便宜。
