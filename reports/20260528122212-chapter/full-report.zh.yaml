      - number: '4.3'
        title: 公开牵引与基准经济模型
        blocks:
          - type: paragraph
            body: >-
              Chapter 披露的牵引强于披露的经济模型。公司称 2025 年收入增长 3 倍、ARR 超过 $100 million、员工数持平，并推出医生目录、处方成本计算器等新工具。此前 Series D 新闻稿也强调
              enrollment 增长 4
              倍，并称公司在企业合作伙伴和受益人留存上达到行业领先水平，但没有公布底层数字。这些结果令人鼓舞，尤其因为它们暗示的是生产率提升，而不是纯粹靠招聘扩张。但它们仍是私营公司管理层挑选的数据点，不是完整审计 P&L。

              公开可比数据给出了更严苛的基准。eHealth、GoHealth 和 SelectQuote 都报告了可观收入，但股权价值相对有限；资产负债表也说明投资人为什么谨慎：eHealth 约有 $110.81
              million 现金和 $133.2 million 债务，GoHealth 约有 $39.88 million 现金和 $688.12 million 债务，SelectQuote 约有 $29.81
              million 现金和 $404.83 million 债务。Medicare Market Insights 反复把这三家公司并列跟踪收入、亏损和 LTV，凸显市场把它们视为一个连贯经济品类。对 Chapter
              的含义很直接：强劲 ARR 增长有帮助，但行业背景说明，投资人最终会关心续期耐久性、应收款质量、债务承受度和现金转化，至少不亚于关心收入增长。
