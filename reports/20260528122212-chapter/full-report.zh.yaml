  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和信任层风险
        blocks:
          - type: paragraph
            body: >-
              Chapter 位于 Medicare 分销中最受审视的环节之一：营销、推荐和入组指导。监管记录并非假设。OIG 正在审查误导性 Medicare Advantage
              营销实践，以及推动经纪人介导换计划的激励。Medicare Rights 和 Center for Medicare Advocacy
              都认为，佣金、奖金以及围绕薪酬规则尚未解决的诉讼，可能扭曲建议并让规则不稳定。CMS
              自身也维护专门的营销指南、代理—经纪人薪酬资源和模板文件渠道，说明该品类被当作持续行为问题监管，而不是一次性披露练习。这一点会直接影响
              Chapter：公司把自己定位为信任层，搜索每个计划、推荐最佳选择，并以持牌保险代理机构而非中立公共设施的身份运营。一旦文档、监督或推荐完整性出问题，核心品牌承诺就会从主要护城河变成主要风险面。
