      - number: '5.2'
        title: 模块、架构与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Chapter 的公开模块地图现在已经超出基础 enrollment 帮助。指南库展示了覆盖 Medicare 基础、Medicare Advantage enrollment、独立 Part D
              enrollment、持牌代理选择、防诈骗和年度 enrollment 时间的自助知识层。其上是参议院证词描述的推荐引擎；其下是把模型转成面向用户推荐的顾问运营层。2026 年 Series E 和 Fierce
              报道又把技术栈推向全年效用：医生目录、处方成本计算器，以及帮助会员兑换健康或食品杂货福利、避免福利过期未用的 OTC Store。

              这些模块的强度取决于它们的依赖项。医生目录质量依赖外部网络数据，而即使 CMS 过去也难以集中这些数据。处方推荐依赖不断变化的药品目录、药房经济模型和 Part D 规则。OTC
              兑换依赖零售商和履约关系。除此之外，产品仍受人工顾问层限制；这对信任有战略价值，但也带来吞吐量和培训依赖。结果是一套比简单 Medicare 呼叫中心更成熟的栈，但仍高度敏感于外部数据新鲜度和运营纪律。
