  - id: TV005
    title: 破坏投资逻辑与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 2026 年私募价格被证明远高于当前支撑区间
        - 尽调发现估值标记显著高于 >$3.0B 下限推断，且没有单位经济性证据抵消
        - 让估值担忧从理论问题变成具体问题
        - 在定价或证据重置前，从观察转为回避
      - - 下行轮或结构很重的融资
        - 下一轮定价低于市场预期，或加入惩罚性优先权条款
        - 释放价格支撑偏弱的信号，并恶化普通股结果
        - 先从下行情景重新承销
      - - 投诉 / 信任恶化
        - BBB 或其他投诉平台显著恶化
        - 削弱信任层溢价和合作伙伴耐久性逻辑
        - 下调溢价假设，重看渠道质量叙事
      - - 留存或续约质量不及预期
        - 尽管采用溢价定价，管理层无法证明强队列耐久性
        - 削弱支付高于公开 eBroker 参考价格的核心论据
        - 大幅下调支撑区间
      - - 合作伙伴集中度被证明偏高
        - 少数渠道主导交易量或收入
        - 提高增长脆弱性和交易对手风险
        - 要求更高折价，否则放弃
      - - 烧钱速度和现金跑道被证明偏弱
        - 现金消耗或债务负担比近期融资所暗示的更差
        - 把不透明转化成眼前融资风险
        - 视为依赖融资，而不是已经降险
    notes: 这些是基于公开证据集和缺失尽调项推导出的投资人监控触发项，不是公司发布的 KPI。
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV036
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2026 年精确估值
        - Series E 股价、稀释后股数和投后估值
        - 没有这些信息，投资人无法判断当前估值标记比上次精确的 $1.5B 轮贵出多少
        - 直接向管理层索取条款清单或投资人材料
      - - 股权结构表和优先股堆叠
        - 清算优先权、优先顺位和任何附函
        - 下行情景结果取决于优先权，而不只是表面估值
        - 索取律师准备的股权结构表摘要
      - - 烧钱速度和现金跑道
        - 当前现金、债务、月度烧钱速度和融资计划
        - 近期融资证明能拿到钱，不证明资金充足
        - 索取最新董事会或财务材料包
      - - 合作伙伴集中度
        - 头部渠道和头部交易对手组合、续约情况和合同期限
        - 在真实交易量结构披露前，合作伙伴驱动模式可能看起来分散
        - 索取合作伙伴队列表
      - - 留存 / 队列耐久性
        - NRR、GRR、流失、按合作伙伴渠道划分的留存，以及投诉率趋势
        - 只有首次参保后信任和经济性仍能持续，溢价才站得住
        - 索取队列分析和客户支持 KPI
      - - 退出准备
        - 经审计财务材料包和 IPO/M&A 准备状态
        - 如果公司确实在准备流动性路径，价格支撑会更强
        - 索取审计状态、投行材料和准备路线图
    notes: 条目按其改变推荐意见（从观察转为买入或回避）的直接程度排序。精确价格和资本结构证据排在最前，因为当前问题是估值纪律，而不是业务是否存在。
    claimRefs:
      - CV006
      - CV007
      - CV039
      - CV040
