      - number: '8.3'
        title: 情景、支撑区间和可比逻辑
        blocks:
          - type: paragraph
            body: >-
              由于 2026
              年确切估值未披露，情景工作应以证据能支撑的区间来框定，而不是制造虚假精度。悲观情景认为，如果当前私募加价远远跑在留存、集中度和现金转化证据前面，那么只有上一轮精确价格——或接近它的价格——才站得住脚。基准情景认为，Chapter
              可以相对传统在线经纪商获得溢价，因为增长、合作伙伴证据和客户信任看起来强于平均上市可比公司；但前提是投资人不能为不透明上调盲目付钱。乐观情景需要的不只是今天的事实，而是披露证明信任层具备持久性：续约质量强、合作伙伴留存好、CAC
              可控、投诉率可管理，股权结构表也比市场担心的更干净。因此，上市可比公司的作用不在于给出一对一价格目标，而在于提供纪律。它们显示，一旦续约经济性或股权流动性令人失望，估值支撑会多快蒸发。因此，本报告的估值立场是偏高，而不是未知：即使精确公允价值区间不清楚，担忧方向已经清楚。
