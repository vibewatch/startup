      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              剩余工作很直接，不是概念问题。投资人需要确切价格、确切条款，并需要证明公司的高信任故事能够转化为持久经济性。公开证据还没有展示 2026
              年每股价格、投后估值、清算优先权、债务或烧钱速度；也没有展示留存指标和集中度数据，无法让买方判断 Chapter
              是否值得相对上市在线经纪商组合获得溢价，还是只是同一模型的更会营销版本。这意味着退出准备度仍未得到证明。纪律严明的投委会应把当前标的当作观察候选，并设置明确的投资逻辑破裂触发点：如果 2026
              轮价格过于激进，就面临倍数压缩；如果投诉模式恶化，就面临信任受损；如果下一轮融资仍没有更好披露，就面临融资风险；如果合作伙伴渠道比品牌叙事显示的更集中，就面临战略风险。尽调清单不长，但每一项都决定性。
