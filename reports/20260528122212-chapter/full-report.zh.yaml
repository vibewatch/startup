  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Chapter 交付什么，推荐工作流如何运作
        blocks:
          - type: paragraph
            body: >-
              Chapter 的产品更适合理解为顾问辅助型 Medicare
              导航工作流，而不是简单线索表单或通用经纪服务。官方页面呈现双通道体验：用户可以先通过指南自学再升级，也可以直接从持牌顾问开始。上线的合作伙伴流程写清了结构化信息采集：Chapter
              收集医生、处方和优先事项，再带受益人走过需要做出的 Medicare 决策。这呼应了参议院证词，后者描述的是一个专为 Medicare 和退休设计的推荐平台，而不是嫁接在更宽保险市场平台上的功能。

              推荐逻辑的公开描述也比典型经纪营销页面更具体。Chapter 称自己搜索每一个可用 Medicare 选项；参议院证词称，平台用医生、处方、福利、生活方式、风险和预算输入来评估 Medicare
              Advantage、Medicare Supplement、独立 Part D 和 Special Needs
              Plans。因此，工作流组合了数据模型、推荐逻辑和持牌人工界面。公开记录在这里相对强，是因为同一核心流程出现在官方合作伙伴页面、参议院证词和点评镜像中：信息采集、比较、推荐和
              enrollment。未披露的不是工作流是否存在，而是它以多高频率转化，以及在规模化时有多准确。
