      - number: '4.4'
        title: 资本充足性、融资依赖与阻碍因素
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑了清楚的融资时间线，但没有解决资本充足性问题。Chapter 在 2025 年融资 $75 million，用于深化合作伙伴和产品基础设施；随后在 2026 年融资 $100
              million，并称估值翻倍以上。这是真实的资本可得性证明，却不是跑道充足的证明。公开记录仍未披露账上现金、月度烧钱速度、债务工具、营运资本压力，或合并盈利时间表。与上市同业的比较在这里很重要：上市线上经纪商会提交
              10-K 和 10-Q，暴露现金、债务、应收款和市场压力。Chapter 不会。

              反向叠加因素是，MA 经纪经济模型在依赖留存的同时，也面临激励和监管风险。Medicare Rights 认为超额支付帮助资助营销，佣金和福利会扭曲经纪人行为；GoHealth 自己的 2026
              年评论也确认，首年续期概率和流动性纪律是生存核心。在这个背景下，Chapter
              目前应被视为一家有前景但仍依赖融资的私营经纪公司：收入质量看起来可信，需求可见，资本可得性存在；但要做硬资本充足性判断，核心承销输入仍未出现在公开来源里。主要阻碍不是概念问题，而是具体数字缺失：现金、烧钱速度、债务、CAC、合作伙伴经济模型和审计后收入结构。
