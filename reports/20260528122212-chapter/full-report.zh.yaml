  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 留存被证明强劲，合作伙伴集中度可控，烧钱速度受控，且未披露的 2026 年价格没有明显高于当前下限推断。
        - 可能支撑显著高于 >$3.0B 下限的溢价，因为增长和信任指标会证明，为差异化经纪商类资产支付更高价格有理由。
        - 需要公司披露目前尚未公开的证据。
        - 中低
      - - 基准
        - 公司质量真实，但 2026 年精确定价和资本结构仍未披露。
        - 只有进入价格纪律足够强、新尽调降低不透明度时，才支持观察立场和选择性兴趣。
        - 投资人可能仅因公开证据不完整而付高价。
        - 中高
      - - 悲观
        - 当前私募加价远超留存、烧钱速度和集中度数据能支撑的范围，或未来一轮融资定价低于预期。
        - 公开证据能支撑的估值向上次精确的 $1.5B 锚点收缩，或只略高于该锚点。
        - 下行轮、倍数压缩、监管或信任受损都可能迫使重定价。
        - 中
    notes: 情景是证据支持区间，而不是模型完美的估值输出，因为 2026 年精确标记价格和股权结构表仍未披露。
