      - number: '6.4'
        title: 扩张机会和集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Chapter 有几条可能跑通的扩张循环。只要医疗系统、顾问网络和创作者继续把退休人群导入流程，合作伙伴驱动的分销就能复利。OTC
              应用和全年权益维护支持，也把一次性入组事件延伸为持续互动。Fierce Healthcare 还称公司很少投 DTC 广告，这意味着 GTM
              有意围绕可信中介搭建，而不是靠昂贵的全国媒体获客。若这些合作伙伴渠道续约并加深，模型可能既持久又高效。


              问题在于，公开来源仍看不到合作伙伴基础有多集中，也看不到这些关系的经济持久性。没有头部合作伙伴结构、合同期限披露、排他性细节，也没有按渠道拆分的收入占比。同一套合作伙伴驱动策略让客户故事看起来可信，但如果少数医疗系统、顾问项目或出版方主导增长，也会变成集中度风险。外部反向评论又叠加一层：Medicare
              Rights 警告，经纪人激励可能扭曲建议；KFF 显示获客环境嘈杂，由营销中介主导。客户结论在真实采用证明上偏正面，但对集中度和续约质量仍保持保守。
