      - number: '7.2'
        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Chapter
              仍像一套由软件和内容包裹的高接触建议服务，而不是低摩擦自助产品。顾问流程需要审查医生、处方、优先事项、入组窗口和变化的权益；客户评价反复赞扬知识丰富、耐心的代理人，而不是神奇的自主流程。这是正面信号，但也意味着服务质量要靠招聘、培训、监督和文档来扩张。Chapter
              自己的内容发布也强化了这一点：它持续维护诈骗电话指南、欺骗性做法评论、开放入组指南、Medicare
              基础知识和代理人解释材料，因为受益人全年都需要解读和安抚。运营上，这会带来推荐一致性、话术质量、过时权益解读和合规 QA
              的失效模式。安全和隐私姿态也只露出一部分。公开页面展示徽章和合规措辞，但没有展示经审计的安全认证、正式隐私控制报告或事故历史披露。一门建立在信任和个人健康计划数据上的生意，缺少这些披露会让剩余运营风险继续偏高。
