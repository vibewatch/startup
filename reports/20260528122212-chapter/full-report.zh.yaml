chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、结构与核心定位
        blocks:
          - type: paragraph
            body: >-
              Chapter 官方页面给出的身份简单，但结构安排很清楚：面向消费者的品牌是 Memoir, Inc. d/b/a Chapter，受监管的保险代理活动则由 Chapter Advisory, LLC
              承接。公司反复强调，自己是一家私营、由数据和技术驱动的退休顾问公司，不是保险公司；其代理机构在全国持牌。牌照页面公布纽约总部地址、加州使用的 d/b/a 实体，以及完整州级保险销售牌照清单。对一家私营
              Medicare 导航创业公司来说，这让 Chapter 的合规版图异常透明。法律免责声明和首页也反复强调关键商业定位：Chapter
              称自己会搜索全美每一个计划，即便并未与对应保险公司直接签约；同时，公司称其代表 50 家机构，在全美提供 18,160 个产品。

              产品承诺围绕消除 Medicare 推荐中的利益冲突展开。首页、About 页面和参议院证词都描述了一种体验：顾问比较全美 Medicare Advantage、Medicare Supplement、Part
              D 和 Special Needs Plans，再推荐最适合个人的方案，而不是推荐佣金最高的方案。这个定位重要，因为 Chapter
              的价值主张靠信任支撑，胜过靠专有设备或受监管治疗资产。公司也明确声明自己不隶属于政府；在一个长期被监管机构和消费者倡议组织批评存在欺骗性 Medicare 营销的品类里，这一点值得注意。合起来看，官方披露把
              Chapter 定位成一家持牌中介：运营模式合规负担重，品牌叙事以消费者为先，并主张覆盖广泛计划搜索。后续章节需要用产品、客户和风险证据检验这些说法。
