      - number: '1.3'
        title: 融资历史与分发体系建设
        blocks:
          - type: paragraph
            body: >-
              公开披露的融资给出了清楚的时间线，但没有给出完整股权结构表。Chapter 在 2022 年 1 月完成 $42M Series B，2024 年 5 月完成 $50M Series C，2025 年 4 月完成
              $75M Series D，2026 年 4 月完成 $100M Series E。独立报道把 2025 年 Series D 估值标在 $1.5B；2026
              年融资则只给相对表述：公司称估值较上一轮翻倍以上，但没有公布准确数字。这一点重要，因为 Chapter
              现在落在一个尴尬区间：经营规模已经真实可见，财务透明度却仍不完整。市场看到足够多信号来推断动能，却还不足以有把握地承销经济模型。

              分发是规模故事的另一半。官方合作材料把 Chapter 的获客与分发动作分成医疗系统、理财顾问和内容出版商；HSHS 与 Ramsey 页面说明这些渠道已经上线，而不是停留在理论上。Series C 和
              Series D 材料反复把新资本投向企业能力、合作伙伴留存和合作伙伴驱动获客，而不是大规模直接效果广告。这契合公司的整体叙事：Chapter
              想成为嵌入其他机构与老年人关系中的可信退休基础设施。如果这个假设成立，合作伙伴驱动的分发可能比付费媒体获客更便宜、更黏。如果失败，Chapter 可能仍只是一家昂贵的持牌经纪公司，故事精致，但单位经济模型不清楚。
