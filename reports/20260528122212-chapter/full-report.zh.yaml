  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方与获客触点
        blocks:
          - type: paragraph
            body: >-
              Chapter 的客户地图是多边的。终端用户是退休人群或 Medicare
              受益人，但公开买方地图穿过医疗系统、理财顾问、出版商、创作者，以及一长串机构渠道。合作页面明确拆分出医疗服务提供方和医疗系统、理财顾问、内容出版商及其他组织。ReviewFeeder
              又把这张图扩展到雇主、福利专业人士、非营利组织、宗教机构和社区领袖。因此，客户故事不只是 DTC Medicare 帮助，而是把分发嵌入已有的可信关系。

              公开内容足迹显示，细分也按用例驱动。Chapter 维护了一组专门指南，覆盖 65 岁后仍在工作、助听器覆盖、IRMAA 与 Part B/Part D
              保费敏感性、税日财务问题和居家医疗。这些不是直接采用指标，但能说明 Chapter 想在退休人群旅程中占住哪些问题。结合上线的合作伙伴页面，客户模型看起来有意做得很宽：高意向退休人群、被转介绍家庭，以及
              enrollment 后可能继续通过权益维护或 OTC 福利激活与 Chapter 互动的既有会员。
