      - number: '3.3'
        title: 替代方案、现状与内部自建问题
        blocks:
          - type: paragraph
            body: >-
              不是每个竞争对手都是风险投资支持的线上经纪商。现状替代方案仍是自学、本地经纪人，以及保险公司特定或政府资源的组合。Medicare Rights
              描述了一个计划选择足够混乱的格局：受益人常常转向代理和经纪人求助，这正是 Chapter 和同业利用的入口。但同样的复杂性也支撑了本地替代方案。例如 Boomer Benefits
              呈现的是经典关系驱动模式：2005 年创立，在 49 个州持牌，代表 30+ 家保险公司，提供免费咨询和终身支持。对许多老年人来说，这已经足够好——尤其是在熟悉代理人的信任比软件打磨更重要时。

              内部自建替代更难量化，但同样真实。RIA、医疗系统或出版商等机构可以把 Medicare 指导留在既有关系中，使用本地经纪人，或自行组装转介绍和比价工作流，而不是依赖专业平台。已审阅的公开材料没有量化
              build-versus-buy 的成本；CoverRight 和 Healthpilot
              等私营进入者也没有披露足够多的合作伙伴经济模型细节，无法证明它们锁定了分发。这个证据缺口重要，因为如果合作伙伴渠道非独家且实施很轻，护城河就会从产品功能转向销售纪律和信任。换句话说，Chapter
              不只是在和有名字的创业公司竞争；它也在和少做一点、本地处理或内部自建的决定竞争。
