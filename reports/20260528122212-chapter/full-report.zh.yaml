      - number: '7.4'
        title: 财务和执行风险、缓释因素与否决标准
        blocks:
          - type: paragraph
            body: >-
              公司的融资故事令人鼓舞，但还没有真正降低风险。Chapter 在 2025 年融资 $75M、2026 年融资 $100M；Series E 新闻稿把资金可得性与收入翻三倍、ARR 超过 $100M
              放在一起。这些都是真实利好。但它们没有回答投资人在经纪型模型中最关心的问题：烧钱速度、债务、应收款时间、续约质量和队列持久性。上市在线经纪商可比公司让这一缺口更难忽视。GoHealth
              明确表示，首次续约概率和经营现金流决定资本部署方向。SelectQuote 披露保单层面的 LTV、CAC 效率和巨额佣金应收款。Medicare Market Insights 把
              eHealth、GoHealth 和 SelectQuote 作为一组连贯分析对象，因为经济性取决于续约、回本和回款，而不是简单的收入增长。Chapter
              尚未公布同等深度的披露。因此，本章的缓释因素真实但不完整：公司能拿到资本，信任信号强，合作伙伴证据可见，牌照覆盖广；但在披露更多集中度、控制系统和现金转化之前，剩余风险仍高。
