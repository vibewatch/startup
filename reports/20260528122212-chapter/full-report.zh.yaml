      - CU030
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 渠道牵引的路径：从认知到顾问使用、投保和持续支持。
    data:
      nodes:
        - id: f1
          label: 合作伙伴或内容触达
          description: 医疗系统、顾问、创作者和指南共同拉动需求
        - id: f2
          label: 已预约咨询
          description: 用户进入合作伙伴流程并预约通话
        - id: f3
          label: 顾问信息采集
          description: 顾问核对医疗服务方、处方药和优先事项
        - id: f4
          label: 给出推荐
          description: 顾问给出计划选择指引
        - id: f5
          label: 投保或切换
          description: 用户选择并加入保障方案
        - id: f6
          label: 投保后互动
          description: 权益支持、OTC 和持续服务延续关系
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    approximationNotes: 这是结构性漏斗，不是量化漏斗；公开来源没有披露逐阶段转化率。
    claimRefs:
      - CU015
      - CU019
      - CU024
      - CU029
      - CU030
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 具名客户和合作渠道的公开证明质量。
    data:
      columns:
        - 结果具体度
        - 生产环境成熟度
        - 持续性可见度
      rows:
        - label: Zoa Life
          values:
            - 高 — 披露 99% 和 4.5x 指标
            - 高 — 作为活跃案例研究呈现
            - 低 — 未披露续约或合同条款
        - label: Mercer Financial
          values:
            - 中高 — 披露 >50% 签约指标
            - 高 — 被描述为正在推进的客户合作
            - 低 — 未披露持续留存或收入数据
        - label: Dr. Ed
          values:
            - 中 — 帮助数千名粉丝
            - 高 — 创作者合作活跃
            - 低 — 未披露转化或留存指标
        - label: Raymond James
          values:
            - 中 — 有上线流程和专门团队
            - 高 — 有在线页面和带日期公告
            - 低 — 未披露合作伙伴客群内采用数量
        - label: HSHS
          values:
            - 中 — 使用场景清楚，且有合作伙伴引述
            - 高 — 面向现有和新近符合条件患者的合作伙伴公告
            - 低 — 未披露后续绩效指标
        - label: RamseyTrusted
          values:
            - 中 — 信任文案和用户证言较强
            - 高 — 转介落地页仍在运行
            - 低 — 未披露线索或续约经济性
    approximationNotes: 各行评估的是公开证明的证据质量，不是客户关系的绝对价值。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU017
      - CU013
      - CU018
      - CU039
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最高严重度风险并不孤立；它们把行为合规风险、合作伙伴不透明和资本不透明叠在一起。
    data:
      columns:
        - 可能性
        - 严重度
        - 缓释成熟度
      rows:
        - label: 误导性营销 / 行为审查
          values:
            - 高
            - 高
            - 中
        - label: 佣金规则诉讼与政策反复
          values:
            - 中高
            - 高
            - 中低
        - label: 推荐诚信错配
          values:
            - 中
            - 高
            - 中
        - label: 顾问质量波动
          values:
            - 高
            - 高
            - 中
        - label: 安全 / 隐私披露不足
          values:
            - 中
            - 高
            - 低
        - label: 合作伙伴集中度不透明
          values:
            - 高
            - 高
            - 低
        - label: DTC 替代能力低的风险
          values:
            - 中高
            - 高
            - 中低
        - label: 烧钱速度 / 现金跑道不透明
          values:
            - 高
            - 高
            - 低
    approximationNotes: 可能性和缓释成熟度是基于公开证据集的定性判断；公司没有发布概率模型。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR010
      - CR021
      - CR028
      - CR033
      - CR041
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心失效路径从受监管的营销和推荐风险出发，传导到信任、合作伙伴渠道表现，最后影响融资灵活性。
    data:
      nodes:
        - id: reg
          label: 营销 / 行为审查
        - id: quality
          label: 推荐质量下滑
        - id: trust
          label: 客户信任受损
        - id: partner
          label: 合作伙伴渠道放缓
        - id: growth
          label: 增长 / 转化下降
        - id: finance
          label: 融资压力
        - id: valuation
          label: 估值压缩
      edges:
        - from: reg
          to: quality
          label: 规则收紧会暴露话术或监督薄弱
        - from: quality
          to: trust
          label: 方案匹配不佳的推荐会引发投诉
        - from: trust
          to: partner
          label: 品牌受损后，合作伙伴不会继续放大
        - from: partner
          to: growth
          label: 转介量和转化率走弱
        - from: growth
          to: finance
          label: 维持增长轨迹需要更多资本
        - from: finance
          to: valuation
          label: 不透明叠加融资依赖，会削弱价格支撑
        - from: reg
          to: finance
          label: 执法或整改抬高成本和摩擦
        - from: trust
          to: valuation
          label: 信任层投资逻辑直接削弱
    approximationNotes: null
    claimRefs:
      - CR001
      - CR003
      - CR010
      - CR021
      - CR026
      - CR033
      - CR043
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Chapter 依赖监管方制定行为规则，依赖顾问守住推荐质量，依赖合作伙伴高效分发。
    data:
      nodes:
        - id: cms
          label: CMS / 监管方
        - id: advisors
          label: 顾问团队
        - id: health
          label: 医疗系统合作伙伴
        - id: advisornets
          label: 顾问网络合作伙伴
        - id: publishers
          label: 发布方 / 受众合作伙伴
        - id: capital
          label: 私人资本
        - id: chapter
          label: Chapter
      edges:
        - from: cms
          to: chapter
          label: 制定行为和营销规则
        - from: advisors
          to: chapter
          label: 交付推荐质量
        - from: health
          to: chapter
          label: 提供患者转介渠道
        - from: advisornets
          to: chapter
          label: 提供退休客户渠道
        - from: publishers
          to: chapter
          label: 提供受众信任和发现入口
        - from: capital
          to: chapter
          label: 在披露有限时为规模化供血
    approximationNotes: null
    claimRefs:
      - CR005
      - CR021
      - CR023
      - CR024
      - CR025
      - CR026
      - CR029
      - CR030
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 结论从真实业务质量一路推到价格透明度薄弱，因此只能观察，不能买入。
    data:
      nodes:
        - id: traction
          label: 真实牵引：Series D + E、收入增长 3x、ARR > $100M
        - id: trust
          label: 真实证明：合作伙伴流程和评价量
        - id: opacity
          label: 价格不透明：2026 年确切估值和股权结构表未披露
        - id: public
          label: 公开可比样本：股权价值压缩，市场关注续约和现金纪律
        - id: decision
          label: 建议：观察，中等信心，高风险，估值偏高
      edges:
        - from: traction
          to: decision
          label: 支撑对业务本身的兴趣
        - from: trust
          to: decision
          label: 支撑相对弱同业的一定溢价
        - from: opacity
          to: decision
          label: 挡住买入确信
        - from: public
          to: decision
          label: 倒逼估值纪律
    approximationNotes: null
    claimRefs:
      - CV005
      - CV008
      - CV031
      - CV032
      - CV033
      - CV041
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 按已披露的 $100M ARR 下限计算，ARR 倍数每增加 10x，隐含估值支撑大约增加 $1.0B。
    data:
      items:
        - label: 10x ARR（基于 $100M）
          value: 1
          unit: USD B
        - label: 20x ARR（基于 $100M）
          value: 2
          unit: USD B
        - label: 30x ARR（基于 $100M）
          value: 3
          unit: USD B
        - label: 40x ARR（基于 $100M）
          value: 4
          unit: USD B
        - label: 50x ARR（基于 $100M）
          value: 5
          unit: USD B
    approximationNotes: 这是围绕已披露 ARR 下限的敏感性视图，并不是声称 ARR 恰好等于 $100M，也不是说任一倍数就是正确值。它用于说明估值支撑会随定价假设多快变化。
    claimRefs:
      - CV005
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 采用证据支撑区间，而非精确目标：已知的 $1.5B 锚点、>$3.0B 下限，以及需要新尽调证据支撑的更高溢价区间。
    data:
      items:
        - label: 悲观 / 锚点区间
          low: 1.5
          mid: 2
          high: 3
          unit: USD B
        - label: 基准 / 有纪律的私募估值区间
          low: 3
          mid: 3.75
          high: 4.5
          unit: USD B
        - label: 乐观 / 需证据支撑的溢价区间
          low: 4.5
          mid: 5.5
          high: 6.5
          unit: USD B
    approximationNotes: 这些是证据支撑区间，不是模型精确算出的公允价值。基准区间起点，是上一轮 $1.5B 之后「翻倍以上」字面含义推导出的下限。
    claimRefs:
      - CV029
      - CV030
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公司在证明和市场相关性上得分不错，但估值清晰度和证据完整度明显差得多。
    data:
      items:
        - label: 市场相关性
          value: 4
          note: Medicare 导航需求真实，且财务影响大
        - label: 业务质量证明
          value: 4
          note: 融资、增长、合作伙伴证明和评价都显示业务有实质
        - label: 客户 / 合作伙伴持续性证据
          value: 3
          note: 代理证据不错，但留存经济性仍未披露
        - label: 财务清晰度
          value: 2
          note: 烧钱速度、债务和股权结构表未公开
        - label: 估值清晰度
          value: 1
          note: 当前价格来自推断，并未披露
        - label: 可比公司支撑
          value: 2
          note: 公开可比公司提供纪律约束，但不能直接支撑清晰溢价
        - label: 当前整体可投资性
          value: 2
          note: 基于当前证据，值得观察，不值得买入
    approximationNotes: 评分是基于证据集给出的 1–5 定性判断，供投资委员会讨论，而不是机械模型。
    claimRefs:
      - CV005
      - CV008
      - CV015
      - CV032
      - CV034
      - CV041
      - CV044
