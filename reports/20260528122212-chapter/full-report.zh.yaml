      - number: '1.2'
        title: 创始人、董事会信号与政治邻近性
        blocks:
          - type: paragraph
            body: >-
              作为年轻的私营经纪公司，Chapter 的创始故事异常公开。Business Wire 将 Cobi Blumenfeld-Gantz、Corey Metzman 和 Vivek Ramaswamy
              列为创始人；Wharton 和公司自己的「Why I Started Chapter」文章则把 Blumenfeld-Gantz 与 Metzman 放在中心，称这对运营搭档因家人在 Medicare
              上遇到挫折而创业。参议院证词进一步强化了这个故事：Blumenfeld-Gantz 说，父母是 Chapter
              最早支持的人，并把公司的产品野心直接连到传统经纪人和不完整公共工具的失败上。因此，创始人—市场匹配信号不只是技术深度，而是政策熟悉度、消费者营销直觉，以及愿意围绕一个长期不透明品类搭建工作流软件。

              治理结构比公司中性、消费者优先的品牌形象更接近政治网络。Fierce Healthcare 和 TechCrunch 都报道过 Peter Thiel 在 Series A 前后参与董事会；TechCrunch
              后来又强调 Donna Shalala 取代 Thiel 进入董事会。Donna Shalala 的公告把她在 Medicare 和 HHS 的可信度包装成战略资产；2025 年 Series D 新闻稿又加入
              Stripes 合伙人 Ron Shah 为董事。这些都不是否决项，但意味着 Chapter 的治理离全国政治、医疗政策网络和有影响力的风险资本很近。这能帮助融资和建立可信度；一旦 Medicare
              营销规则或政治关联进入叙事，也会放大声誉敏感性。
