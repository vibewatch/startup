      - number: '1.4'
        title: 里程碑、牵引信号与早期警示
        blocks:
          - type: paragraph
            body: >-
              Chapter 自 2022 年以来的里程碑显示，公司仍在持续增加资本和产品，而不是已经进入稳定经纪经济模型。Series B 阶段出现了全国顾问持牌、第二个办公室和 Palantir 支持的平台叙事。到
              2024 年，公司开始推企业 Medicare 能力和 OTC 兑换产品。2025 年，公司引入 Stripes，扩充董事会，声称 enrollment 增长 4 倍，并扩展与零售商关联的 OTC 能力。到
              2026 年，公司称自己是领先的 Medicare 导航平台，表示 2025 年收入增长 3 倍，ARR 超过
              $100M，并在员工数持平的同时推出医生目录、处方成本计算器等新工具。这些都是强商业信号，即便几乎全部来自公司自己发布的材料。

              警示同样重要。独立点评页面整体正面，但也显示 Chapter 的外部声誉仍主要由市场平台和大量联盟导流的比价网站中介，而不是审计过的服务指标。ConsumersAdvocate 的档案带来了时间线漂移：它称公司自
              2019 年运营；而公开融资叙事更清楚地指向一家 2020 年前后启动、2021 年 Series A、2022 年 Series B
              的创业公司。更重要的是，公司没有披露准确客户数、员工数、单位经济模型、债务敞口或当前估值。因此，Chapter 看起来是一家可信、快速增长、融资充足的 Medicare
              导航平台，但还不是一家整个运营图景都能被外部读懂的公司。
