  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: State-level enforcement history, private demand letters, and any non-public regulator correspondence touching Chapter marketing or recommendation practices.
    whyItMatters: The federal picture is clear enough to rank risks, but a truly exhaustive legal register would also need state and private enforcement visibility.
    diligencePath: Request outside-counsel litigation and regulatory docket summary, plus any state insurance-department correspondence.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: partner-concentration
    missingEvidence: Top-partner mix, contract length, exclusivity terms, revenue shares, and channel-specific renewal performance.
    whyItMatters: Without concentration data, investors cannot judge whether partner-led growth is diversified or precariously dependent on a few logos.
    diligencePath: Request partner cohort table showing volume, revenue, renewal, and contract terms by major channel and by top counterparties.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: Cash on hand, monthly burn, debt facilities, receivable timing, and internal runway model.
    whyItMatters: Recent fundraising proves access to capital, not sufficiency of capital; residual financial risk cannot be underwritten cleanly without runway data.
    diligencePath: Obtain current balance-sheet snapshot, 12-month cash forecast, debt schedule, and board materials on financing needs.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: Audited security certifications, privacy-control reporting, vendor-risk documentation, and any incident history.
    whyItMatters: A business built on beneficiary data and trust can lose partner and customer confidence quickly if its control environment is weak or opaque.
    diligencePath: Request security packet, independent audit reports, penetration-test summary, and incident response history.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: people-and-succession
    missingEvidence: Management bench, advisor headcount, succession planning, and compliance-ownership detail.
    whyItMatters: Execution risk is inseparable from people risk in a high-touch advisory model, but public sources barely expose the operating bench.
    diligencePath: Request org chart, succession memo, advisor staffing ratios, and compliance ownership map.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR004
