company:
  name: Chapter
chapter:
  number: 7
  title: Risks
  summary: 'Chapter''s public risk profile is best described as high but manageable: the company operates in a broker- and marketing-sensitive Medicare category, depends heavily on advisor quality and partner-led distribution, and still does not disclose the concentration, control, and runway data needed to prove residual risk is low. The visible mitigants are real—nationwide licensing, explicit disclosures, strong reviews, live partner workflows, and fresh capital—but the failure modes are correlated enough that a trust or conduct problem would likely transmit into channel performance, financing flexibility, and valuation support quickly.'
sections:
- id: regulatory-legal-and-trust-risk
  title: Regulatory, legal, and trust-layer risk
  body: 'Chapter sits inside one of the most scrutinized parts of Medicare distribution: marketing, recommendation, and enrollment guidance. The regulatory record is not hypothetical. OIG has an active project reviewing misleading Medicare Advantage marketing practices and the incentives that drive broker-mediated plan changes. Medicare Rights and the Center for Medicare Advocacy both argue that commissions, bonuses, and unresolved litigation around compensation rules can distort advice and make the ground rules unstable. CMS itself maintains a dedicated marketing-guidelines stack, agent-broker compensation resources, and model-document channels, which underscores that this category is regulated as an ongoing conduct problem, not a one-time disclosure exercise. For Chapter, that matters because the company markets itself as a trust layer that searches every plan, recommends what is best, and operates as a licensed insurance agency rather than as a neutral public utility. If documentation,
    supervision, or recommendation integrity ever slips, the core brand promise becomes the primary risk surface rather than the primary moat.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
