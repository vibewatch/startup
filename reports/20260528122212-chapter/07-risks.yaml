- id: partner-channel-and-customer-risk
  title: Partner, channel, and customer concentration risk
  body: 'Chapter''s distribution model looks credible precisely because it is embedded in trusted intermediaries: health systems, advisor networks, publishers, and community-oriented organizations. HSHS, Raymond James, and Ramsey all provide live workflow evidence that the partner model is real. Fierce adds another important angle by saying the company uses very little direct-to-consumer advertising, which implies the model is intentionally partner-led rather than merely opportunistic. That can be efficient and trust-enhancing when it works. It also creates substitution risk if large partners underperform or if partner trust erodes. Public materials still do not disclose top-partner concentration, contract length, exclusivity, or revenue-share terms, so the investment case cannot tell whether growth is broad-based or dependent on a handful of channels. ReviewFeeder''s description of employers, benefits professionals, non-profits, religious institutions, and community leaders broadens the
    surface area further: more channels may reduce single-logo dependence, but they also expand oversight complexity. The result is a model that looks strong on distribution proof and weak on concentration transparency.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-and-execution-risk
  title: Financial and execution risk with mitigants and kill criteria
  body: 'The company''s financing story is encouraging but not yet de-risking. Chapter raised $75 million in 2025 and $100 million in 2026, and the Series E release paired that capital access with revenue tripling and ARR above $100 million. Those are real positives. They do not answer the questions investors ultimately care about in a brokerage-like model: cash burn, debt, receivable timing, renewal quality, and cohort durability. Public e-broker comps make that gap hard to ignore. GoHealth explicitly says first-renewal probability and operating cash flow determine where it deploys capital. SelectQuote discloses policy-level lifetime value, CAC efficiency, and enormous commissions receivable. Medicare Market Insights treats eHealth, GoHealth, and SelectQuote as a coherent analytic set because the economics hinge on renewals, payback, and collections rather than on simple top-line growth. Chapter has not published the same depth of disclosure. That is why the mitigants in this chapter are
    real but incomplete: capital access exists, trust signals are strong, partner proof is visible, and licensing is broad, yet the residual risk remains high until the company discloses more about concentration, control systems, and cash conversion.'
