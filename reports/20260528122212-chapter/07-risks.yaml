- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory conduct risk
    - Regulator inquiry, consent order, or substantiated deceptive-marketing finding
    - Any formal enforcement event tied to marketing or recommendation conduct
    - Pause positive underwriting assumptions and re-evaluate trust-layer thesis immediately
  - - Recommendation-integrity risk
    - Material mismatch between marketed all-plan-search promise and actual advisor placement practice
    - Evidence of systemic script or disclosure inconsistency
    - Treat as thesis-damaging because the value proposition depends on perceived independence
  - - Customer-trust deterioration
    - Complaint trend or review deterioration across BBB / REVIEWS.io / other surfaces
    - Sustained decline in rating quality or repeated poor-fit complaints
    - Increase diligence frequency and test remediation loop before underwriting growth
  - - Partner concentration risk
    - Large partner loss or publicly visible referral slowdown
    - Loss of a named anchor partner or unexplained channel growth deceleration
    - Rework growth model and require channel-concentration disclosure
  - - Financial opacity risk
    - Fundraising without disclosure improvement
    - New capital raised while cash, burn, and concentration remain undisclosed
    - Treat financing as runway extension, not true de-risking
  - - Security / privacy risk
    - Incident disclosure or major privacy complaint
    - Any material breach, incident, or public privacy-control failure
    - Pause valuation support and reassess customer and partner durability assumptions
  notes: Kill criteria are investor monitoring constructs derived from the public evidence reviewed here; they are not company-issued KPIs.
