  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-gap
    missingEvidence: Current consolidated cash balance, monthly burn, and formal runway for Chapter.
    whyItMatters: Without cash and burn, capital adequacy cannot be judged even after the 2025 and 2026 raises.
    diligencePath: Request the latest board package or monthly finance pack showing unrestricted cash, burn, and runway scenarios.
    relatedQuestionRefs:
    - QI017
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: debt-gap
    missingEvidence: Debt facilities, receivable financing, covenants, and working-capital obligations.
    whyItMatters: Brokerage models can hide financing pressure in receivables, warehouse lines, or other short-duration facilities.
    diligencePath: Request debt schedules, covenant packages, and any facilities secured by receivables or commissions.
    relatedQuestionRefs:
    - QI018
    - QI021
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Initial versus renewal revenue, carrier concentration, realized commission rates, and partner revenue-share economics.
    whyItMatters: Revenue durability depends on renewals and partner concentration more than on topline ARR alone.
    diligencePath: Review carrier contracts, revenue-recognition memos, and cohort economics by carrier, product, and channel.
    relatedQuestionRefs:
    - QI003
    - QI021
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cac-gap
    missingEvidence: Channel-level CAC, payback period, content-funnel conversion, and contribution margin.
    whyItMatters: The GTM could be highly efficient or capital intensive; public materials do not let investors tell the difference.
    diligencePath: Request channel funnel dashboards from first touch to realized cash, including partner, content, and direct-response sources.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: adjacent-products
    missingEvidence: Revenue and margin contribution from provider directory, Rx savings, and broader retirement products beyond core Medicare navigation.
    whyItMatters: Expansion products could improve LTV, but they could also be pre-revenue investment lines.
    diligencePath: Break out live revenue, attachment, and gross margin for each non-core product line launched since 2025.
