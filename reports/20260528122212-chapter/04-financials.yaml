- id: capital-adequacy-and-diligence-blockers
  title: Capital adequacy, financing dependency, and blockers
  body: 'Public evidence supports a clear financing chronology without settling the adequacy question. Chapter raised $75 million in 2025 to deepen partnerships and product infrastructure, then $100 million in 2026 after saying valuation had more than doubled. That is real proof of capital access. It is not proof of sufficient runway. The public record still does not disclose cash on hand, monthly burn, debt facilities, working-capital strain, or any timeline to consolidated profitability. The comparison with public peers matters here: listed e-brokers file 10-Ks and 10-Qs, exposing their cash, debt, receivables, and market pressure. Chapter does not.


    The adverse overlay is that MA brokerage economics face incentive and regulatory risk at the same time they depend on retention. Medicare Rights argues that overpayments help fund marketing and that commissions and perks can distort broker behavior; GoHealth''s own 2026 commentary confirms that first-renewal probability and liquidity discipline are central to survival. Against that backdrop, Chapter should currently be treated as a promising but still financing-dependent private broker: revenue quality is plausible, demand is visible, and capital access exists, yet the core underwriting inputs needed for a hard capital-adequacy judgment remain absent from public sources. The primary blockers are not conceptual. They are concrete missing numbers: cash, burn, debt, CAC, partner economics, and audited revenue mix.'
