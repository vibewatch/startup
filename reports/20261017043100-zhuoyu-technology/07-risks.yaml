company:
  name: Zhuoyu Technology
chapter:
  number: 7
  title: Risks
  summary: >-
    Zhuoyu's highest residual risks are external regulation of advanced driver
    assistance, concentration and governance exposure around FAW-led OEM
    relationships, and execution pressure in a market shifting toward
    cost-optimized integrated stacks. The company publicizes meaningful safety,
    quality, and cybersecurity controls, but public evidence remains thin on
    shareholder rights, customer concentration, audited financial resilience,
    and incident or recall history.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: |-
      The risk ranking currently clusters around three issues: first, China's
      regulatory posture toward advanced driver assistance tightened materially
      after highly visible industry incidents, raising the chance that roadmap,
      marketing, and OTA release assumptions become harder to execute even for
      suppliers that were not directly involved. Second, Zhuoyu's commercialization
      path appears increasingly tied to a small set of OEM and control
      relationships, especially FAW-linked programs and ownership. Third, the
      competitive stack is moving toward chip-plus-software bundles and lower-cost
      deployment, which can pressure margins and win rates before Zhuoyu has
      disclosed audited standalone economics.
    claimRefs: [CR007, CR008, CR010, CR011, CR013, CR014, CR015]
  - id: regulatory-and-liability-reset
    title: Regulatory and liability reset
    body: |-
      The clearest near-term external risk is not a Zhuoyu-specific lawsuit or
      enforcement action in the assigned evidence set, but an industry-wide
      tightening of what Chinese suppliers and OEMs can promise, test, and ship.
      MIIT-linked guidance reported in 2025 restricts the use of "autonomous
      driving" language, public beta testing, and unvalidated OTA releases,
      while 2026 reporting on the Baidu Apollo Go disruption shows regulators
      willing to halt permits and require self-reviews after safety events. That
      combination can delay launches, increase validation cost, and expand
      product-liability exposure unless Zhuoyu can demonstrate stronger release
      governance than public marketing materials currently prove.
    claimRefs: [CR003, CR006, CR010, CR011, CR012]
    tableRefs: [TR001]
  - id: operational-and-technology-execution
    title: Operational and technology execution
    body: |-
      Zhuoyu presents credible mitigation signals on paper: automotive-grade
      lifecycle management, digital manufacturing systems, multiple process and
      safety certifications, and a controller stack spanning 32 to 1500+ TOPS.
      Those claims matter because the company is trying to scale city NOA,
      door-to-door driving, and multi-platform deployment across dozens of
      models. The residual risk is that scaling from certification-ready process
      language to repeatable field performance remains hard, especially if
      product cost, compute sourcing, or OTA validation cycles tighten. Public
      materials do not yet show failure-rate, recall, cyber-incident, or
      second-source chip data needed to conclude that the mitigation maturity is
      already investment-grade.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR013]
    tableRefs: [TR002]
  - id: partner-control-and-kill-criteria
    title: Partner control, concentration, and kill criteria
    body: |-
      FAW is now both strategic investor and strategic commercialization anchor,
      which can accelerate volume but also compress independence. Public sources
      point to FAW joint control, Hongqi deployments, and broader FAW-Volkswagen
      rollouts, while Zhuoyu simultaneously advertises 34 partners, 60+
      mass-produced models, and 130+ nominations. That is enough to support a
      concentration concern, because nominations are not the same as recurring
      revenue and public disclosures do not break out customer mix, pricing, or
      gross margin by program. A thesis break would be evidence that FAW-linked
      concentration or governance rights can block commercial optionality, or
      that standalone economics deteriorate once competitive pricing and
      validation costs rise.
    claimRefs: [CR005, CR007, CR008, CR009, CR014, CR015]
    tableRefs: [TR003]
    figureRefs: [FR001]
