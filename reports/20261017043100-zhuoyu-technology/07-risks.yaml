callouts:
  - calloutType: risk
    title: Fastest-moving external risk
    body: >-
      China's post-accident tightening around driver-assistance language, public
      beta testing, and OTA governance is moving faster than Zhuoyu's public
      disclosures, so regulatory execution risk currently looks more immediate
      than a proved company-specific legal event.
    claimRefs: [CR010, CR011, CR012]
  - calloutType: recommendation
    title: Minimum diligence before underwriting upside
    body: >-
      Before treating Zhuoyu's scale claims as investable proof, obtain the FAW
      shareholder agreement, customer revenue concentration by OEM and program,
      audited cash and margin data, and the internal evidence behind release,
      recall, and cybersecurity governance.
    claimRefs: [CR004, CR007, CR008, CR015]
