company:
  name: Zhuoyu Technology
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Zhuoyu's addressable market is best framed as China's mass-produced ADAS
    controller and software stack market, with the clearest near-term demand in
    RMB100k-200k passenger vehicles plus commercial-vehicle and autonomous-logistics
    adjacencies. Public evidence shows fast NOA adoption and a larger domain-controller
    opportunity, but not enough disclosure to isolate Zhuoyu's SAM, SOM, or segment-level
    economics with confidence.
sections:
  - id: market-boundary
    title: Market boundary and buyer definition
    body: >-
      Zhuoyu is not selling a single premium autonomy feature into one niche buyer; the
      public record positions it as a mass-produced ADAS supplier whose addressable market
      spans passenger vehicles, fuel and new-energy platforms, commercial trucks, and
      adjacent autonomous-logistics or Robotaxi programs. The practical boundary is the
      controller, perception, and software stack that OEMs can deploy at automotive scale,
      not the full global autonomy TAM often used in generic pitch materials. That framing
      matters because the buyer is usually an OEM platform or smart-driving team, while
      the end user is the vehicle driver or fleet operator and the payer remains the
      vehicle program P&L owner. The earliest disclosed manufacturing ramp also starts in
      heavy trucks and unmanned logistics vehicles before broader passenger-car scale,
      which suggests Zhuoyu can pursue clearer ROI-led programs before the most speculative
      L4 markets mature.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Sizing lenses and adoption trajectory
    body: >-
      Multiple public lenses show that the underlying adoption base is already material.
      XEPS reports that L2+ penetration in China's passenger-vehicle market reached 56.1%
      in H1 2025, with highway NOA installations at 1.798 million units and the
      RMB100k-200k band contributing 45.3% of total NOA installations. Research and
      Markets adds a second lens: standard highway NOA monthly penetration rose from 5.8%
      in January 2025 to 19.6% in October 2025, while urban NOA penetration in new
      vehicles reached 28.1%. A narrower editorial domain-controller lens from iEVChina
      points to approximately RMB15 billion in 2024 growing to more than RMB60 billion by
      2028. Together these sources support a large and fast-forming market, but they still
      do not isolate Zhuoyu's reachable SAM or SOM by module, OEM, geography, or take
      rate. The missing bridge is program-level pricing, volume, and mix disclosure.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: drivers-and-constraints
    title: Adoption drivers, competitive pressure, and constraints
    body: >-
      The strongest demand driver is cost-down with acceptable performance: Zhuoyu's own
      materials emphasize broad deployment across 32-1500+ TOPS configurations, and
      third-party reporting highlights 32 TOPS and 100 TOPS deployments that map well to
      China's move from premium-only autonomy to mass-market NOA. That same shift creates
      pressure. Research and Markets says third-party suppliers already play a major
      role in urban NOA increment, while Gasgoo's reporting on Black Sesame and
      DeepRoute.ai shows the market moving toward tightly integrated chip-plus-software
      stacks that can compress supplier differentiation. Regulation also slows the most
      ambitious use cases faster than ordinary L2+/L2++ rollouts: China tightened approval
      and reporting requirements for OTA and autonomous-driving changes in 2025, and the
      2026 robotaxi permit freeze after Baidu's Wuhan outage shows that safety incidents
      can delay pilot-market expansion even when passenger-car ADAS adoption continues.
    claimRefs: [CM008, CM012, CM014, CM015, CM016]
