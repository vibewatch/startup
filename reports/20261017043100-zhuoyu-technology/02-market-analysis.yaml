      - ["Fuel-vehicle intelligent upgrade", "Integrated cockpit-driving controllers and assist functions for ICEV platforms", "EV-only platform economics", "JV or local OEM platform owner", "Relevant because ZYT states compatibility with ICEV and EV, expanding the addressable base beyond pure NEV programs."]
      - ["Commercial heavy trucks", "Domain controllers, perception, and safety systems for highway-heavy fleet use", "General infotainment and unrelated robotics modules", "Truck OEM engineering team and fleet operator", "Changzhou trial operations begin here, implying earlier ROI-led adoption than fully consumer-facing autonomy."]
      - ["Autonomous logistics / Robotaxi adjacency", "Low-speed logistics vehicles, pilot Robotaxi stacks, cross-platform world-model reuse", "General-purpose industrial robots", "Operator plus OEM sponsor", "Official positioning includes these markets, but regulatory friction is materially higher than for L2+/L2++ passenger ADAS."]
    notes: >-
      Boundary table separates Zhuoyu's practical OEM ADAS market from broader autonomy
      narratives; rows mix current scale pools and adjacent expansions, so they are not
      additive TAM components.
    claimRefs: [CM002, CM009, CM010, CM013, CM014, CM015]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Period / geography
      - Value
      - CAGR / trend
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["XEPS", "H1 2025 / China passenger vehicles", "L2+ penetration 56.1%; L2++ 17.0%", "Penetration still rising", "Installed-base penetration snapshot", "High", "Adoption lens, not supplier revenue TAM"]
      - ["XEPS", "H1 2025 / China passenger vehicles", "Highway NOA 1.798m installs", "+191% YoY", "Installation-count snapshot", "High", "Function-layer scale, not full ADAS spend"]
      - ["XEPS", "H1 2025 / China passenger vehicles", "RMB100k-200k segment = 45.3% of NOA installs", "Largest NOA volume band", "Price-band mix of NOA installations", "Medium", "Share of NOA installs, not share of total vehicle sales"]
      - ["Research and Markets", "Jan-Oct 2025 / China passenger vehicles", "Standard highway NOA monthly penetration 5.8% -> 19.6%", "3x increase in 9 months", "Monthly penetration trend from report preview", "Medium", "Flow metric, not installed base"]
      - ["Research and Markets", "2025 / China passenger vehicles", "Urban NOA penetration 28.1%; 150,200 vehicles in RMB150k-200k band by Oct 2025", "Entering mass-popularization stage", "New-vehicle penetration plus price-band unit sales", "Medium", "Does not isolate third-party supplier capture"]
      - ["iEVChina", "2024-2028 / China ADAS domain controllers", "Approx. RMB15bn in 2024 -> >RMB60bn by 2028", "Projected multi-year expansion", "Editorial market projection cited in industry context", "Low", "Secondary synthesis without disclosed base-case assumptions"]
    notes: >-
      This table uses multiple non-identical lenses because no public source isolates
      Zhuoyu's supplier-specific SAM or SOM; valuation work still needs program-level ASP,
      take-rate, and geographic mix disclosure.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["RMB100k-200k passenger OEM programs", "OEM ADAS/platform team", "Retail driver", "Vehicle program P&L", "City/highway NOA plus parking on mass-market trims", "Product-planning or smart-driving GM", "Lower-compute NOA economics and fast category adoption"]
      - ["JV and fuel-vehicle OEM upgrades", "JV engineering/product team", "Retail driver", "Vehicle line owner", "Add advanced assist functions to ICEV and mixed portfolios", "Platform owner", "Need to match Chinese-market intelligence features without redesigning the whole vehicle stack"]
      - ["Commercial heavy-truck and fleet programs", "Truck OEM plus fleet engineering team", "Driver or fleet operations manager", "Fleet economics owner", "Highway-heavy controller and perception deployment", "Fleet operator and OEM sponsor", "Clearer ROI from safety, utilization, and fuel economics"]
      - ["Autonomous logistics / Robotaxi pilots", "Operator safety and autonomy team", "Remote operator and rider / logistics operator", "Pilot program budget", "Pilot approvals, safety reporting, controlled-scale rollout", "Operator with regulator and OEM support", "Only after safety approvals and local permit availability"]
    notes: >-
      Buyer, user, and payer can diverge materially in automotive programs; passenger-vehicle
      OEM budgets are nearer-term than Robotaxi pilots because the latter face heavier
      regulatory gating.
    claimRefs: [CM002, CM009, CM010, CM011, CM012, CM013, CM014, CM015]
