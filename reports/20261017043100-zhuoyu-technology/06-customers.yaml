company:
  name: "Zhuoyu Technology"
chapter:
  number: 6
  title: "Customers"
  summary: "Zhuoyu has credible public adoption proof beyond logos: the company discloses 34 customers and ecosystem partners, 60+ mass-produced vehicle models, and 130+ nomination collaborations, while third-party sources tie named deployments to Volkswagen supply-chain qualification, SGMW lineage, and multiple FAW/Hongqi programs. The weakness is durability disclosure, because retained public evidence still does not quantify retention, churn, renewal, or customer-level revenue concentration even as FAW has become both a major shareholder and a key customer anchor."
sections:
  - id: "customer-footprint"
    title: "Customer footprint spans OEMs first, then adjacent mobility categories"
    body: |
      Zhuoyu's public positioning is clearly B2B and OEM-led rather than consumer subscription-led. The official homepage says the company provides mass-produced intelligent-driving solutions for global automotive partners and describes a mobility ecosystem spanning passenger vehicles, commercial vehicles, autonomous logistics, Robotaxi, and embodied AI. Its technology page adds that ClixPilot supports both ICEV and EV programs with full-scale mass production already underway, which matters because it widens the addressable buyer set beyond EV-native OEMs. Third-party coverage broadens that picture rather than replacing it: Baike describes 22 partner customers covering 32 brands, with designated programs extending into heavy trucks and unmanned logistics. The result is a customer base that appears segmented by vehicle platform and use case, but still centered on OEM and fleet channels rather than direct end-user monetization.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "adoption-trajectory"
    title: "Adoption signals are real, but the headline counts are not directly comparable"
    body: |
      The strongest adoption evidence is that Zhuoyu keeps publishing operating footprint metrics at all, and those metrics are directionally corroborated by third-party summaries. The official site claims 34 customers and ecosystem partners, 60+ mass-produced vehicle models, and 130+ nomination collaborations. Baike's 2026 snapshot is lower on every disclosed count, at 22 cooperative customers, 32 brands, more than 50 mass-produced models, and more than 100 designated models. That gap does not invalidate the customer story, but it does mean public metrics mix different denominators, time bases, and category definitions. Investors should therefore treat the footprint as proof of real commercial traction, not as a cleanly auditable cohort or revenue-quality metric.
    claimRefs: [CU004, CU005, CU006, CU015]
    tableRefs: [TU002]
  - id: "named-proof"
    title: "Named deployments show production traction with FAW, Volkswagen channels, and SGMW lineage"
    body: |
      Zhuoyu's public customer proof is strongest where a named OEM, a specific program, and a production or qualification milestone appear together. The company says its first OEM project launched with Volkswagen Group China in 2019 and that SGMW collaboration started in 2020, which establishes relationship longevity. Later evidence is more concrete: EQS says the Volkswagen IQ.Pilot collaboration passed a joint A-SPICE CL2 audit across Volkswagen entities, while Gasgoo and Baike both tie Zhuoyu's system to FAW/Hongqi production programs and road-tested European demonstrations. A Sina repost adds another Hongqi production datapoint. This is materially better than a logo wall, but most sources still stop short of disclosing program volumes, customer spend, or renewal behavior.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: "durability-and-concentration"
    title: "Durability and concentration remain the main unresolved commercial risks"
    body: |
      The retained evidence supports a simple conclusion on customer durability: Zhuoyu has multiple public deployment signals, but almost no public retention telemetry. None of the retained sources disclose NRR, GRR, churn, renewal rates, contract terms, or customer-level revenue concentration. At the same time, the FAW relationship has become structurally important. Third-party sources say FAW owns 35.8% of Zhuoyu, jointly controls the company with New Territory, and has become the largest shareholder and client. That combination can accelerate procurement and productization, but it also raises dependency and governance risk if Hongqi, FAW-Volkswagen, or broader FAW priorities change. Europe shows similar asymmetry: the company has localization staff and market-entry messaging, but the retained evidence still does not identify a signed European OEM production nomination.
    claimRefs: [CU013, CU014, CU015, CU016]
