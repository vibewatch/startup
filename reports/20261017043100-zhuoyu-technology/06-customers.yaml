figures:
  - id: "FU001"
    title: "Customer journey from OEM qualification to expansion"
    type: "journey-map"
    summary: "The public evidence shows a repeatable path from OEM qualification and nomination into SOP deployment, then adjacent-category and overseas expansion."
    data:
      items:
        - label: "OEM qualification"
          detail: "The first disclosed OEM project was with Volkswagen Group China, creating a multi-year foothold in enterprise automotive programs."
          touchpoints:
            - "2019 first OEM project with Volkswagen Group China"
            - "2020 collaboration started with SGMW"
        - label: "Program enablement"
          detail: "Quality and engineering audits are used to lower friction for additional OEM rollouts."
          touchpoints:
            - "IQ.Pilot collaboration passed a joint A-SPICE CL2 audit"
            - "VW-related audit can shorten future software-quality review cycles"
        - label: "Nomination pipeline"
          detail: "The homepage claims a large nomination base that sits ahead of SOP conversion."
          touchpoints:
            - "130+ nomination collaborations"
            - "No public nomination-to-SOP conversion rate"
        - label: "Passenger SOP"
          detail: "Passenger-vehicle deployment is the clearest commercial proof today."
          touchpoints:
            - "60+ mass-produced vehicle models on the homepage"
            - "Hongqi production references and SGMW lineage"
        - label: "Adjacent-category expansion"
          detail: "Commercial-vehicle and logistics categories appear to be the next growth layer."
          touchpoints:
            - "Top-six truck-brand coverage in Baike"
            - "Autonomous logistics mentioned in official and third-party sources"
        - label: "Overseas localization"
          detail: "Europe is being built as a go-to-market motion rather than a fully proven customer base."
          touchpoints:
            - "Braunschweig subsidiary with R&D, testing, and BD staff"
            - "No signed European OEM production nomination in retained sources"
    claimRefs: [CU002, CU007, CU008, CU009, CU010, CU016]
