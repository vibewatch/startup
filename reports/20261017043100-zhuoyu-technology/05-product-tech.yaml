figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      ZYT's product stack layers customer-facing ADAS functions on top of sensing, compute/control,
      end-to-end software, fleet learning, and automotive-grade delivery/compliance processes.
    data:
      layers:
        - label: User-facing functions
          detail: Mass-produced assisted-driving workflows delivered into OEM programs.
          modules:
            - Navigation on City Driving
            - Navigation on Highway Driving
            - Door-to-Door Driving
            - Multi-Floor Auto Parking
          outputs:
            - L2 and above passenger-vehicle deployment
            - Fuel, hybrid, and EV compatibility
        - label: Sensing
          detail: Camera-first stack with optional LiDAR and other sensor configurations.
          modules:
            - Inertial-Aided Stereo Camera
            - Inertial-Aided Stereo and Tele Camera System
            - LiDAR-Stereo Onebox
            - ZHIZHOU blind-zone LiDAR
            - Radar / ultrasonic / third-party LiDAR options
        - label: Compute and control
          detail: Automotive-grade compute/control platform optimized for lower compute footprints.
          modules:
            - Safety MCU + ISP + GNSS
            - 32-1500+ TOPS controller range
            - ASIL-D design target
            - IP6K7 controller reliability claim
        - label: Algorithms
          detail: End-to-end software stack trained on large trajectory and expert-driving data.
          modules:
            - End-to-End ADAS
            - Personalized driving behavior learning
            - Natural-language driving interaction
            - Map-light / map-free urban navigation
        - label: Fleet learning and updates
          detail: Post-deployment loop for improving software features and performance.
          modules:
            - Automated data mining
            - Data labeling
            - Model training and evaluation
            - Cloud simulation testing
            - OTA updates
        - label: Delivery and compliance
          detail: In-house manufacturing, safety/cyber processes, and Europe localization plan.
          modules:
            - PLM / ERP / MES / EAM / QMS
            - TISAX / A-SPICE / IATF 16949 milestones
            - ISO 26262 / ISO 21434 / SOTIF claims
            - German subsidiary and EU safety-architecture rollout
    approximationNotes: >-
      This is a structural synthesis of named layers from retained sources, not a vendor-supplied
      systems diagram or audited bill of materials.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE008, CE011, CE012]
callouts:
  - calloutType: strength
    title: Specific stack, not only generic ADAS branding
    body: >-
      Compared with many company pages that stop at feature slogans, ZYT publicly names sensors,
      controllers, compute ranges, manufacturing systems, and certification milestones, which makes
      the architecture legible enough for diligence scoping even before private technical review.
    claimRefs: [CE001, CE003, CE004, CE006]
  - calloutType: risk
    title: Public proof still trails the ambition of the roadmap
    body: >-
      The retained pool supports real OEM deployment and Europe expansion, but not the hard operating
      evidence an investor would want for underwriting product risk: public intervention rates,
      failure returns, cybersecurity audit scope, or developer/practitioner signals.
    claimRefs: [CE008, CE011, CE012]
