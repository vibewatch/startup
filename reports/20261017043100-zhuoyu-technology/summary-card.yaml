  topStrengths:
    - Visible OEM traction with 34 customers and partners, 60+ mass-produced models, and 130+ nominations.
    - FAW-backed strategic capital and joint-control relevance that validate market importance.
    - Broad product scope spanning sensors, controllers, software, fleet learning, and cross-powertrain compatibility.
    - Production proof across passenger, commercial, and adjacent autonomous-mobility programs.
  topRisks:
    - Standalone revenue, margin, cash, burn, and customer-concentration data remain undisclosed.
    - FAW ownership and control may create strategic-holder overhang for minority investors.
    - ADAS market competition is shifting toward cost-effective integrated stacks that can compress margins.
    - European expansion and adjacent autonomy use cases add regulatory and execution complexity.
  unresolvedGaps:
    - Audited standalone revenue, gross margin, cash balance, burn rate, and working-capital profile.
    - Shareholder agreement terms, board rights, and reserved matters tied to FAW and New Territory.
    - Customer-level revenue concentration and program-level profitability by OEM.
    - Signed European OEM nominations, launch timing, and economics.
    - Chip, sensor, and supply-chain contingency planning under export-control or sourcing pressure.
