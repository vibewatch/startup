artifact: company-overview
slug: zhuoyu-technology
runDate: 2026-10-17
company:
  name: Zhuoyu Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Zhuoyu Technology presents as a growth-stage private ADAS supplier with a 2016 project origin,
    a 2022 legal-entity formation / 2023 independent-operating transition, and visible OEM traction
    that now spans 34 customers and ecosystem partners, 60+ mass-produced models, and 130+
    nomination collaborations in official materials. The strongest supported growth datapoints are
    FAW's strategic investment, a reported 2026 pre-IPO raise, and a multiyear OEM timeline, while
    standalone economics, board disclosure, and customer concentration remain underdocumented.
sections:
  - id: identity-scale
    title: Identity, product scope, and operating scale
    body: >-
      The assigned evidence supports Zhuoyu as a Shenzhen-based intelligent-driving supplier whose
      operating story starts in 2016, even though the current legal entity dates to October 2022 and
      the official history frames 2023 as the point when the business began operating independently
      as Shenzhen Zhuoyu Technology Co., Ltd. The company describes itself as a mobile-intelligence
      platform provider rather than a single-program engineering shop: official pages position ZYT as
      selling open, customizable, mass-produced L2+ driving systems for OEMs while extending the same
      technical base into autonomous logistics, robotaxi, and embodied-robot scenarios. Publicly
      supported scale is stronger on customer and program counts than on financial disclosure: the
      company claims 34 customers and ecosystem partners, 60+ mass-produced models, and 130+
      nomination collaborations, but the assigned pool does not provide audited standalone revenue,
      ARR, cash, or burn figures.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-capital
    title: Leadership, control, and capital context
    body: >-
      Public leadership visibility in the assigned pool is narrow. Baidu's company profile names Zhu
      Lu as legal representative and cites 2026 public comments from CEO Shen Shaojie, but the source
      set does not expose a full board roster, committee structure, or shareholder-rights package.
      Capital and control evidence is more concrete than governance detail. Official milestones say
      Zhuoyu secured over RMB 3.6 billion of strategic investment from FAW in 2025, while
      ChinatechSignals later reported a March 2026 pre-IPO fundraise of $280 million at a $1.74
      billion valuation. PlastMatch, citing a SAMR-published transaction description, reported that
      FAW would hold 35.80% and New Territory 34.85%, implying joint control if the structure closed
      as described. Together, those datapoints suggest the company is financed and strategically
      relevant, but still requires direct diligence on governance rights, cap-table mechanics, and
      whether FAW's economic stake translates into operational control.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO015]
    tableRefs: [TO002, TO003]
  - id: milestones-gaps
    title: Milestones, momentum, and remaining diligence gaps
    body: >-
      Zhuoyu's official milestone trail shows steady movement from internal project to production
      supplier: early road-test licensing, Volkswagen and SGMW program wins, 2023 standalone
      operation under the Zhuoyu name, 2024 strategic partnerships with FAW and Dongfeng, and 2025
      milestones around IAA Mobility, generative-driving claims, and fresh FAW capital. The 2026
      refresh adds two important signals: official expansion claims around customers, nominations, and
      multimodal foundation models, and an independent report that framed the DJI spinout lineage and
      financing effort as strategically relevant to European OEM sourcing decisions. What remains
      missing is less about identity than about investability: the chapter still lacks verified
      economics, customer concentration, and formal governance disclosures, so later chapters should
      treat Zhuoyu's production traction as real but incomplete evidence rather than as a substitute
      for company-level financial quality.
    claimRefs: [CO006, CO008, CO013, CO014, CO015]
    figureRefs: [FO001]
