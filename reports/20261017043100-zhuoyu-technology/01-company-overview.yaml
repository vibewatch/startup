      - ["Total raised", null, null, "gap", "Public sources disclose rounds and strategic investment, but not a clean lifetime total."]
    notes: Null means the metric is not supportable from the assigned public evidence pack, not that the value is zero.
    claimRefs: [CO001, CO003, CO004, CO005, CO006, CO007, CO010]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Public role
      - Publicly supported background / coverage
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Shen Shaojie", "CEO", "Quoted in 2026 public reporting and Baidu's profile summary on end-to-end large-model strategy and expansion plans.", "Public face of product and strategy, but founder status is not explicitly established in the assigned pool.", "High: the source set centers strategy commentary on the CEO and does not expose deeper management redundancy."]
      - ["Zhu Lu", "Legal representative", "Named in Baidu's company profile; broader executive biography is not disclosed in accessible assigned evidence.", "Covers legal-entity accountability rather than market-facing strategy in public materials.", "Medium: role clarity is limited because the source pack lacks a full executive roster or board disclosure."]
    notes: Public leadership disclosure is partial; the assigned pool names a CEO and legal representative but does not provide a full board or management list.
    enumerationScope:
      coverage: partial
      basis: Publicly named leaders and legal representatives in the assigned pool as of the 2026 refresh; board and full executive coverage remain undisclosed.
    claimRefs: [CO004, CO009]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["China FAW Group", "Strategic investor, OEM partner, reported joint controller", "Official history cites >RMB 3.6bn strategic investment in 2025; PlastMatch says FAW would hold 35.80% after the transaction.", "Confirm closing status, board rights, reserved matters, and whether FAW has de facto operating control."]
      - ["New Territory Technology", "Legacy shareholder linked to the DJI auto-business lineage", "PlastMatch says New Territory would retain 34.85%, leaving joint control alongside FAW.", "Map shareholder relationship to DJI and any exit, veto, or technology-transfer constraints."]
      - ["Volkswagen ecosystem (Volkswagen Group China, FAW-Volkswagen, SAIC Volkswagen)", "Anchor OEM relationship", "Official milestones trace the first OEM project to 2019, and current partner pages show multiple Volkswagen-branded launches.", "Quantify revenue concentration and renewal risk across Volkswagen-linked programs."]
      - ["SGMW", "Early OEM partner", "Official timeline says collaboration expanded to SGMW in 2020, indicating multi-OEM adoption before the latest funding cycle.", "Determine SOP volumes, margins, and whether the relationship is still scaling."]
      - ["BYD", "Technology and ecosystem partner", "Official history says the in-vehicle drone system launched in 2025, while CnEVPost reported 2024 investment intent into DJI Automotive.", "Clarify whether BYD remained a commercial partner only or also obtained economic exposure."]
    notes: This is a partial stakeholder map built from the highest-signal public relationships in the assigned pool rather than an exhaustive cap table or customer list.
    enumerationScope:
      coverage: partial
      basis: Material investors, legacy shareholders, and named OEM ecosystems visible in the assigned public sources; not a complete ownership or customer register.
    claimRefs: [CO008, CO011, CO012, CO013, CO014]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show a long gestation from 2016 internal project to 2023 standalone company,
      followed by faster commercial, capital, and international-positioning milestones through 2026.
    data:
      items:
        - label: Automotive project team formed
          year: "2016"
          detail: Official history says the automotive project team was formed and began R&D in 2016.
          tone: positive
          claimRefs: [CO001]
        - label: Public-road testing begins in Shenzhen
          year: "2018"
          detail: Official history says the team obtained one of Shenzhen's first intelligent connected-vehicle road-test licenses.
          tone: positive
          claimRefs: [CO013]
        - label: First Volkswagen OEM project and first factory
          year: "2019"
          detail: Official milestones pair the first Volkswagen Group China OEM project with the first automotive-grade factory buildout.
          tone: positive
          claimRefs: [CO013]
        - label: Zhuoyu starts operating as an independent entity
          year: "2023"
          detail: Official history says Shenzhen Zhuoyu Technology Co., Ltd. started operating as an independent entity and announced ClixPilot.
          tone: positive
          claimRefs: [CO004, CO007]
        - label: FAW and Dongfeng partnerships deepen
          year: "2024"
          detail: Official history says ZYT reached strategic partnerships with FAW and Dongfeng and pushed end-to-end city NOA onto mid/high computing platforms.
          tone: positive
          claimRefs: [CO007]
        - label: IAA Europe strategy and FAW capital
          year: "2025"
          detail: Official milestones cite IAA 2025, European strategy, and over RMB 3.6 billion of strategic investment from FAW.
          tone: positive
          claimRefs: [CO008]
        - label: Pre-IPO fundraising reported
          date: 2026-03-19
          detail: ChinatechSignals reported a $280 million raise at a $1.74 billion valuation with a Hong Kong IPO target.
          tone: risk
          claimRefs: [CO010, CO015]
        - label: 34 partners and mobility foundation-model push
          year: "2026"
          detail: Official materials say ZYT expanded to 34 customers and ecosystem partners, 130+ nominations, and a multimodal foundation-model strategy.
          tone: positive
          claimRefs: [CO006]
    approximationNotes: null
    claimRefs: [CO001, CO004, CO006, CO007, CO008, CO010, CO013, CO015]
