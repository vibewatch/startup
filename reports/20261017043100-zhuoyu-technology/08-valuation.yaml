company:
  name: Zhuoyu Technology
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Zhuoyu as a strategically important, production-proven ADAS supplier, but it does not yet support a clean underwriting case at the reported 2025-2026 valuation marks. The recommendation stays research-more with a fair valuation stance because FAW-backed financing and deployment scale are visible, while audited economics, minority-holder terms, and KPI consistency remain too opaque for a buy call.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The highest-confidence read is research-more rather than buy or pass. Public sources do show a meaningful financing step-up: one independent report says FAW's 2025 investment exceeded RMB 3.6 billion and pushed Zhuoyu above a RMB 10 billion post-money valuation, while Zhuoyu's own materials also say FAW invested over RMB 3.6 billion in 2025. That is real strategic validation. It is not enough, however, to justify paying into the latest mark on public evidence alone, because the accessible record still does not disclose audited revenue, gross margin, burn, cash, or liquidation terms. EquityZen explicitly withholds current valuation, cap-table, and financial detail behind accredited-only access, so the available valuation context is directionally useful but incomplete for minority investors.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV012
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-comparable-pressure
    title: Financing context and comparable pressure
    body: >-
      The financing context is strategically strong but economically ambiguous. PlastMatch reports that FAW would own 35.80% after the transaction while New Territory would hold 34.85%, implying joint control and meaningful governance influence by strategic shareholders. Zhuoyu's official site simultaneously presents a scaling story, claiming 34 customers and ecosystem partners, 60-plus mass-produced vehicle models, and more than 130 nomination collaborations. Yet Baidu Baike gives a smaller late-2025/early-2026 operating footprint of 22 cooperative customers, 32 brands, and more than 100 designated models. That discrepancy may reflect timing or definition changes, but without a reconciled KPI bridge it weakens valuation confidence. Independent sector evidence also points to multiple-compression risk: Gasgoo says China's ADAS market is shifting from a pure performance race toward cost-effectiveness and integrated hardware-software stacks, increasing the pressure on suppliers that cannot translate technical promise into defendable unit economics.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV013
      - CV014
    tableRefs:
      - TV002
  - id: scenarios-and-final-diligence-gates
    title: Scenarios and final diligence gates
    body: >-
      The scenario frame should stay milestone-based, not precision-priced. Reported financing marks give two public anchors: above RMB 10 billion post-money in late 2025 and roughly RMB 12.5 billion pre-money in March 2026. Those figures make it reasonable to treat Zhuoyu as a serious strategic asset rather than an early experiment, but they do not prove that new money can underwrite attractive minority returns at or above the latest implied price. The bear case is easy to articulate: sector competition intensifies, governance rights favor strategic holders, geopolitical scrutiny complicates international expansion, and a weak operating-data package forces a down-round or delayed exit. The upside case needs real evidence, not storytelling: audited economics, explicit preference terms, and customer-level proof that nomination momentum converts into profitable production revenue.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV010
      - CV011
      - CV012
      - CV014
    tableRefs:
      - TV003
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - >-
            Public sources confirm strategic financing and commercialization claims, but not audited economics or minority-holder protections.
        - Stay in diligence mode; do not anchor only to the latest reported private mark.
      - - Confidence
        - medium
        - >-
            The funding step-up is corroborated, but customer-scale definitions and public operating disclosure remain inconsistent.
        - Require management data-room evidence before underwriting a price-sensitive case.
      - - Risk rating
        - high
        - >-
            Joint-control dynamics, sector compression, and geopolitical overhang can impair exit timing or ownership economics.
        - Underwrite only with clear downside protection and explicit governance review.
      - - Valuation stance
        - fair
        - >-
            Reported 2025-2026 valuation marks are plausible strategic reference points, but public evidence does not yet justify paying through them.
        - Entry discipline matters more than company quality scoring at this stage.
    notes: >-
      Directional synthesis only; accessible public sources do not disclose audited revenue, gross margin, cash, burn, or the preference stack.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV012
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Support
      - Anti-thesis / failure mode
      - What would change the view
    rows:
      - - Strategic validation
        - >-
            FAW-backed capital exceeded RMB 3.6 billion and strategic shareholders appear willing to deepen control.
        - >-
            Strategic money can reflect supply-chain security or ecosystem control more than minority-return economics.
        - >-
            Provide shareholder agreement terms, board rights, reserved-matters list, and confirmation that new investors share the same economics as strategic holders.
      - - Commercial proof
        - >-
            Official materials claim 34 customers, 60+ mass-produced models, and 130+ nominations, plus a European strategy unveiled at IAA 2025.
        - >-
            Public KPI definitions conflict with Baidu's smaller customer and model counts, and no audited revenue or margin disclosure ties these wins to cash generation.
        - >-
            Reconcile customer, brand, SOP, and nomination metrics with dated cohorts and customer-level revenue concentration.
      - - Comparable pressure
        - >-
            Sector funding rebounded in 2025, showing that scaled ADAS suppliers can still attract capital.
        - >-
            Gasgoo's competitor coverage shows the market now rewards cost-effective integrated stacks, raising the bar for sustained premium multiples.
        - >-
            Show independent win-rate, margin, or renewal evidence that demonstrates defensible economics against integrated peers.
    notes: >-
      This is a milestone-based comparable set because the assigned public pool does not provide clean public-company or private-round multiple disclosures for direct like-for-like valuation.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
            Official scale claims hold up under diligence, Europe converts from strategy to revenue-bearing nominations, and audited economics show premium margins or capital efficiency.
        - >-
            Value can exceed the reported ~RMB 12.5 billion pre-money indication only if audited growth, margin, and governance terms support a durable premium.
        - >-
            Audited financials, clean term sheet, and independent customer references validate profitable commercialization.
        - >-
            Program delays, export-control friction, or investor-unfriendly terms emerge during diligence.
      - - Base
        - >-
            FAW backing helps win and ship programs, but the public record remains milestone-driven and only partially transparent on economics.
        - >-
            Fair value stays around the reported >RMB 10 billion 2025 post-money to ~RMB 12.5 billion 2026 pre-money indications, with returns depending on disciplined entry and protections.
        - >-
            Current evidence set: real industrial validation, incomplete economic disclosure, and no proof yet of superior cash conversion.
        - >-
            The next round or listing is delayed because evidence never graduates from strategic narrative to audited operating proof.
      - - Bear
        - >-
            Customer metrics prove definition-inflated, competition compresses pricing, and overseas expansion faces geopolitical or compliance drag.
        - >-
            Value falls below the 2025 >RMB 10 billion mark if profitability, control rights, or capital needs disappoint against the current narrative.
        - >-
            KPI conflicts persist, adverse sector signals rise, and investor access remains limited to incomplete public data.
        - >-
            Down-round, punitive preferences, or a delayed exit window impair minority returns.
    notes: >-
      Scenario ranges are anchored only to reported financing marks in the assigned source pool; they are not market-clearing valuation opinions and should be re-underwritten once audited economics and term-sheet detail are available.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic validation and deployment proof are visible, but missing economics, governance overhang, and competitive pressure keep the call at research-more.
    data:
      nodes:
        - id: production-proof
          label: Production proof
          detail: Officially claimed 34 customers, 60+ mass-produced models, and 130+ nominations.
        - id: strategic-capital
          label: Strategic capital
          detail: FAW-backed funding exceeded RMB 3.6 billion and was reported above a RMB 10 billion post-money mark.
        - id: governance-overhang
          label: Governance overhang
          detail: Reported 35.80% FAW ownership and 34.85% New Territory ownership imply joint control.
        - id: missing-economics
          label: Missing audited economics
          detail: No public audited revenue, margin, burn, cash, or preference stack in the assigned evidence.
        - id: competitive-pressure
          label: Competitive pressure
          detail: Cost-optimized integrated peers raise the hurdle for sustaining premium pricing.
        - id: recommendation
          label: Research-more / fair
          detail: Public evidence validates relevance and momentum, not an investable price on minority terms.
      edges:
        - from: production-proof
          to: strategic-capital
          label: supports demand story
        - from: strategic-capital
          to: recommendation
          label: helps
        - from: governance-overhang
          to: recommendation
          label: caps upside
        - from: missing-economics
          to: recommendation
          label: blocks underwriting
        - from: competitive-pressure
          to: recommendation
          label: compresses multiple
    approximationNotes: >-
      Qualitative flow only; the diagram shows evidence direction, not weighted scoring or implied probabilities.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV010
      - CV012
callouts:
  - calloutType: recommendation
    title: Price-sensitive verdict
    body: >-
      Research-more is the right call because the financing step-up is real, but the public record still lacks audited revenue, margin, burn, cash, and preference terms needed to underwrite minority returns at the latest implied valuation.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV012
  - calloutType: risk
    title: Metric-definition drift matters
    body: >-
      The gap between the official 34-customer / 60+ model disclosure and Baidu's 22-customer / 32-brand / 100+ designated-model disclosure makes scale evidence directionally positive but too weakly reconciled for premium underwriting.
    claimRefs:
      - CV005
      - CV006
  - calloutType: assumption
    title: What would upgrade the case
    body: >-
      A stronger recommendation needs audited economics, a clean view of cap-table and liquidation preferences, and proof that European or additional OEM nominations translate into profitable production revenue rather than symbolic strategic wins.
    claimRefs:
      - CV007
      - CV008
      - CV012
