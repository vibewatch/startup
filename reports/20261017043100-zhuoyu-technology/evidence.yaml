evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Board roster, committee structure, reserved-matters terms, and any shareholder-rights agreement tied to the
      FAW/New Territory structure.
    whyItMatters: >-
      Control rights and governance protections determine whether strategic investors can redirect roadmap, capital
      allocation, or exit timing.
    diligencePath: >-
      Request the current cap table, shareholder agreement, board observer rights, and any post-transaction governance
      schedule from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: standalone-economics
    missingEvidence: Audited standalone revenue, gross margin, cash balance, burn, and program-level profitability.
    whyItMatters: >-
      Production traction is meaningful only if the company converts nominations into attractive economics and
      sufficient liquidity.
    diligencePath: >-
      Obtain the latest audited financial statements, monthly management accounts, and program margin bridge by major
      OEM.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer-level revenue concentration, backlog mix, and the relative weight of Volkswagen-, FAW-, and other
      OEM-linked programs.
    whyItMatters: >-
      A concentrated OEM book can amplify pricing pressure, platform dependency, and control risk even when model counts
      look strong.
    diligencePath: >-
      Request customer concentration by revenue and backlog, plus launch schedules and renewal assumptions for the top
      OEM relationships.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: Public program-level ASPs, shipment volumes, and OEM mix for Zhuoyu's controllers, sensors, and software modules.
    whyItMatters: >-
      Without module pricing and customer concentration, the report can frame market direction but cannot isolate a
      credible Zhuoyu SAM or SOM.
    diligencePath: >-
      Request booked nominations, production SOP schedules, and blended ASP by platform or obtain third-party channel
      checks from OEM and Tier-1 procurement contacts.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      OEM or fleet procurement budgets showing who funds Zhuoyu deployments and whether software, controller, and sensor
      spend sit in one line item.
    whyItMatters: >-
      Buyer, user, and payer differ across passenger OEM, truck OEM, and pilot-operator programs, which changes adoption
      timing and margin potential.
    diligencePath: Ask management for sample commercial terms by segment and cross-check with customer procurement or sourcing teams.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized supplier ASPs, software and service fees, discounts, warranty allocation, and gross margins for ZYT and
      comparable OEM programs.
    whyItMatters: Public packaging does not reveal whether ZYT wins on superior economics, subsidized pricing, or capability.
    diligencePath: >-
      Obtain redacted RFQs, bid comparisons, signed program pricing schedules, and contribution-margin bridges from
      management and OEM references.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Nomination-to-production conversion, replacement history, integration timelines, renewal terms, and customer-level
      switching costs.
    whyItMatters: Program count and certifications do not prove durable lock-in or recurring economics.
    diligencePath: >-
      Request cohort data for nominations and SOPs, lost-program postmortems, contract duration, and reference calls
      with procurement and engineering buyers.
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: performance-benchmark
    missingEvidence: >-
      Independent, normalized safety, disengagement, latency, compute-efficiency, and intervention benchmarks across ZYT
      and direct peers.
    whyItMatters: Vendor feature lists cannot establish a defensible technical lead or equal safety at lower compute.
    diligencePath: >-
      Commission controlled route testing and request OEM validation reports using the same operational design domain
      and intervention definitions.
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited 2024-2026 revenue, software versus hardware mix, and backlog-to-revenue conversion by OEM program.
    whyItMatters: Revenue quality cannot be underwritten from nominations and model counts alone.
    diligencePath: >-
      Request monthly revenue bridge, audited financial statements, and program-level sales roll-forwards from
      management.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, runway, debt or covenant terms, and next-round trigger thresholds.
    whyItMatters: >-
      Capital adequacy is central to the thesis because the company is still raising money and expanding
      internationally.
    diligencePath: Request treasury snapshot, board materials on financing plan, and any loan or supplier-finance agreements.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized ASPs, software attachment rates, discount schedules, and support obligations by customer program.
    whyItMatters: Public capability claims do not reveal whether ZYT earns software-like or hardware-like margins.
    diligencePath: Request executed customer pricing schedules, recent invoices, and margin waterfall by configuration.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue contribution, payment terms, and launch timing by FAW, Volkswagen programs, and other major OEMs.
    whyItMatters: Shareholder overlap with major customers can distort perceived diversification and cash-conversion quality.
    diligencePath: Request customer concentration table, DSO by top account, and pipeline conversion by nominated model.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
