      - number: '3.4'
        title: 护城河持久性与不利情形
        blocks:
          - type: paragraph
            body: >-
              公开材料对持久护城河的支持建立在执行能力上：低算力部署、宽硬件范围、汽车认证和反复量产项目。但这些要素都不能证明 ZYT 掌握不可替代的渠道或性能领先。竞争压力来自两端：低成本集成栈可能缩小经济差异；Tesla
              和 OEM 生态供应商则可以通过品牌、软件或捆绑分销重置买方预期。向乘用车之外扩张还会增加政策暴露。FCC 当前涵盖清单对外国生产的无人驾驶航空系统和先进机器人设备实施类别限制，而 ZYT
              公开描述了向车载无人机、自动物流、robotaxi 和具身 AI 扩张。现有 FCC 文本没有点名
              ZYT，因此这属于尽调风险，而非当前受到限制的证据。投资判断应把定价权、独立安全表现和进入西方市场的资格视为尚未解决的问题。
            claimRefs:
