  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方定义
        blocks:
          - type: paragraph
            body: >-
              Zhuoyu 并不是把单一高端自动驾驶功能卖给某个小众买方；公开记录把它定位为量产 ADAS 供应商，覆盖乘用车、燃油及新能源平台、商用卡车，以及相邻的自动物流或 Robotaxi 项目。实际边界是 OEM
              能够按汽车规模部署的控制器、感知和软件栈，而不是通用推介材料里常见的全球自动驾驶 TAM。这个区分很重要：买方通常是 OEM 平台或智能驾驶团队，终端用户是车辆驾驶员或车队运营商，付款方则是车辆项目的 P&L
              负责人。最早披露的产能爬坡也从重卡和无人物流车辆开始，早于更广泛的乘用车规模化，这说明在最具投机性的 L4 市场成熟前，Zhuoyu 可以先追逐 ROI 更清晰的项目。
            claimRefs:
              - CM008
              - CM009
