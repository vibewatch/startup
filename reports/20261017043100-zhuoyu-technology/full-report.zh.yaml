  - id: FP001
    title: 受证据约束的竞争定位图
    type: quadrant
    summary: 序数位置比较已披露的第三方 OEM 覆盖范围与技术栈广度；它们不是市场份额、安全性或财务排名。
    data:
      xAxis:
        label: 已披露的第三方 OEM 覆盖
        min: 1
        max: 5
      yAxis:
        label: 已披露的技术栈与集成广度
        min: 1
        max: 5
      points:
        - label: ZYT
          x: 5
          'y': 5
          detail: OEM 阵容广泛，覆盖控制器、传感器、软件、车队学习和跨动力总成支持。
        - label: Huawei Qiankun
          x: 4
          'y': 5
          detail: 拥有多个 FAW 集团项目，并提供集成驾驶、座舱、控制和云端能力的方案。
        - label: Momenta
          x: 3
          'y': 3
          detail: 已披露一个具体的 FAW Toyota 项目，但保留的证据不足以构成完整公司画像。
        - label: Horizon Robotics
          x: 3
          'y': 3
          detail: 已披露与 FAW Bestune 和 ZYT 的平台关系，但此处无法确认全栈范围。
        - label: Nullmax 与 Black Sesame
          x: 2
          'y': 3
          detail: 以成本为导向的单芯片方案具备广泛功能说法，但没有保留的部署数量。
        - label: Tesla FSD
          x: 1
          'y': 4
          detail: Tesla 车辆内部的软件覆盖面很广，但保留的证据中没有第三方 OEM 覆盖。
    approximationNotes: 分数是分析师根据已披露项目和产品范围作出的序数判断；一分差异仅具方向性，缺乏支持的单元格没有按零分处理。
    claimRefs:
