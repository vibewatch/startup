      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论最好表述为“商业前景可观，但仅凭公开证据仍无法完成投资判断”。Gasgoo 关于德国子公司、本地研发和测试团队以及 2026
              年全国测试覆盖的报道，说明海外扩张需要追加运营支出，之后才能看到已验证的欧洲收入。同时，现有公开来源没有披露投资判断最关键的核心数字：独立收入、毛利率、现金、烧钱速度、资金续航、客户集中度、实际定价和付款条款。在管理层提供这些数据前，合理结论是
              ZYT 可能正在扩大真实的 OEM 项目业务，但利润路径和融资需求仍是待解决的尽调事项，而非已经确定的投资事实。
