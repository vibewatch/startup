    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营规模
        blocks:
          - type: paragraph
            body: >-
              现有证据支持将 Zhuoyu 视为一家总部在深圳的智能驾驶供应商，其业务故事始于 2016 年；但当前法律实体成立于 2022 年 10 月，官方历史则将 2023 年定义为业务以 Shenzhen Zhuoyu
              Technology Co., Ltd. 名义独立运营的起点。公司将自己定位为移动智能平台供应商，而非只做单一项目的工程公司：官方页面称 ZYT 面向 OEM 销售开放、可定制的量产 L2+
              驾驶系统，并把同一技术底座延伸至自动物流、Robotaxi 和具身机器人场景。公开证据对客户和项目数量的支持强于对财务数据的支持：公司自称拥有 34 个客户及生态合作伙伴、60+ 款量产车型和 130+
              个定点合作，但现有证据包没有经审计的独立收入、ARR、现金或烧钱数据。
