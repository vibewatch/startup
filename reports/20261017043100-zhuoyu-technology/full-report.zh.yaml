        title: 领导层、控制权与资本背景
        blocks:
          - type: paragraph
            body: >-
              现有证据包对公开领导层信息的覆盖很窄。Baidu 公司资料将 Zhu Lu 列为法定代表人，并引用 CEO Shen Shaojie 在 2026
              年的公开言论；但资料没有披露完整董事会名单、委员会结构或股东权利安排。资本和控制权证据比治理细节更具体。官方里程碑称 Zhuoyu 于 2025 年获得 FAW 超过 RMB 3.6 billion
              的战略投资；ChinatechSignals 随后报道称，公司于 2026 年 3 月融资 $280 million，估值 $1.74 billion。PlastMatch 援引 SAMR
              发布的交易说明报道称，FAW 将持有 35.80%，New Territory 持有
              34.85%；若交易按该描述完成，双方将共同控制公司。这些数据说明公司已有资金并具战略重要性，但仍需直接核查治理权利、股权结构表机制，以及 FAW 的经济持股是否转化为运营控制权。
