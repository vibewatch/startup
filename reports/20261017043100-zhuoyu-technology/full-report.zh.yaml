              融资背景在战略上很强，但经济含义模糊。PlastMatch 报道交易完成后 FAW 将持有 35.80%，New Territory 持有
              34.85%，意味着双方共同控制，战略股东拥有重要治理影响。与此同时，Zhuoyu 官方网站宣传规模化故事，称拥有 34 个客户及生态合作伙伴、60-plus 款量产车型和超过 130 个定点合作。但 Baidu
              Baike 给出的 2025 年末/2026 年初运营足迹更小：22 个合作客户、32 个品牌和超过 100 个定点车型。差异可能来自时间或定义变化，但没有对账后的 KPI
              桥接就会削弱估值信心。独立行业证据也指向倍数压缩风险：Gasgoo 称中国 ADAS 市场正从纯性能竞赛转向性价比和软硬件集成栈，无法把技术承诺转化为可守住的单位经济性的供应商将面临更大压力。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 情景与最终尽调闸门
        blocks:
          - type: paragraph
            body: >-
              情景框架应以里程碑为核心，而非给出精确价格。公开融资记录提供了两个锚点：2025 年末投后估值超过 RMB 10 billion，2026 年 3 月投前估值约 RMB 12.5
              billion。这些数据足以让人把 Zhuoyu
              视为严肃的战略资产，而非早期实验，但不能证明新资金能在最新隐含价格或更高价格上为少数股东带来有吸引力的回报。悲观情景很清楚：行业竞争加剧，治理权利偏向战略持有人，地缘政治审查使国际扩张复杂化，运营数据包薄弱迫使公司折价融资或延迟退出。上行情景需要真实证据，而非故事：经审计的经济数据、明确的优先权条款，以及客户层面的证明，表明定点势头已转化为有利润的量产收入。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 正确选择是继续研究，因为融资升级确实存在，但公开记录仍缺少在最新隐含估值下判断少数股东回报所需的经审计收入、利润率、烧钱、现金和优先权条款。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV012
          - type: callout
            title: 指标定义漂移很重要
            body: 官方披露的 34 个客户 / 60+ 款车型与 Baidu 披露的 22 个客户 / 32 个品牌 / 100+ 款定点车型之间存在差距，使规模证据虽方向积极，却未充分对账，不足以支持溢价投资判断。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
          - type: callout
            title: 哪些信息会提升案例质量
            body: 更强的建议需要经审计的经济数据、清晰的股权结构表和清算优先权，以及证据证明欧洲或新增 OEM 定点转化为有利润的量产收入，而不是象征性的战略胜利。
            calloutType: assumption
            claimRefs:
              - CV007
              - CV008
              - CV012
