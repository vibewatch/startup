companyProfile:
  summary: >-
    Zhuoyu Technology 是一家总部位于深圳、源自 DJI 的智能驾驶供应商。公司从 2016 年的内部汽车项目起步，至 2023 年成为独立运营主体。如今，公司为乘用车、商用车及相邻自动移动场景的 OEM 项目销售量产
    ADAS 和更广义的移动智能解决方案，并已显现客户、定点及资本市场 traction。关于经审计经济数据、治理权利和客户集中度的公开记录仍较薄弱，因此更适合被视为一家真实存在、但尚未完成充分投资判断的 OEM 项目公司。
  productSummary: 覆盖控制器、传感器、软件、车队学习和 OEM 集成的量产 ADAS 与移动智能平台。
  customerFocus: 乘用车、商用车及自动移动 OEM 项目负责人。
  businessModel: 面向 OEM 的软硬件平台销售、集成及项目支持收入。
  stage: growth-stage private
  fundingStatus: FAW 支持的战略融资，据报道于 2026 年 3 月完成上市前轮次，并在 2025 年获得更早的战略投资。
