          unit: '% of total NOA installs'
          note: RMB100k-200k 车型贡献了最大 NOA 规模。
          claimRefs:
            - CM002
        - label: 高速 NOA 月度渗透率
          value: 19.6
          unit: '% in Oct 2025'
          note: 从 2025 年 1 月的 5.8% 上升。
          claimRefs:
            - CM005
        - label: 新车中的城市 NOA
          value: 28.1
          unit: '% penetration in 2025'
          note: 截至 2025 年 10 月，RMB150k-200k 城市 NOA 车型达到 150,200 辆。
          claimRefs:
            - CM006
            - CM007
        - label: Zhuoyu 当前部署足迹
          value: 34
          unit: customers and ecosystem partners (2026)
          note: 覆盖乘用车、商用车、物流及 Robotaxi 邻近项目的 130 余项提名合作。
          claimRefs:
            - CM011
