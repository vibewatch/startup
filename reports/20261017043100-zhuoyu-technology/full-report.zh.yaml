      - number: '1.3'
        title: 里程碑、势头与待补尽调
        blocks:
          - type: paragraph
            body: >-
              Zhuoyu 的官方里程碑呈现出从内部项目稳步走向量产供应商的路径：早期道路测试许可、Volkswagen 和 SGMW 项目胜出、2023 年以 Zhuoyu 名义独立运营、2024 年与 FAW 及
              Dongfeng 建立战略合作，以及 2025 年 IAA Mobility、生成式驾驶说法和新增 FAW 资本带来的里程碑。2026
              年更新又带来两个重要信号：官方宣称客户、定点和多模态基础模型均在扩张；独立报道则将 DJI 分拆血统及融资行动描述为欧洲 OEM
              采购决策中的战略相关因素。尚未补齐的重点不是身份，而是投资可行性：本章仍缺少经验证的经济数据、客户集中度和正式治理披露，因此后续章节应把 Zhuoyu
              的生产落地视为真实但不完整的证据，而不是公司财务质量的替代品。
