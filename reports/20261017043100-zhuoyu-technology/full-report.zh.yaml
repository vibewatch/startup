            body: >-
              公司概览已覆盖完整融资时间线；当前投资判断最重要的更新是 2025 年 FAW 战略投资和 2026 年上市前流程。ZYT 自有里程碑页面称 FAW 于 2025 年投资超过 RMB 3.6
              billion；Baike 和 CXO Digital Pulse 则分别描述了 2026 年约 RMB 2 billion 或约 $290 million 的新上市前融资，估值口径约为 RMB 12.5
              billion 投前或约 $1.8 billion。独立及二手来源还一致指出，FAW 以 35.80% 成为最大股东，New Territory 保留
              34.85%，公司由双方共同控制。这笔资本显然提升了短期资产负债表弹性，但也加深了对单一战略投资者—客户轴线的依赖，同时独立流动性指标仍未披露。
