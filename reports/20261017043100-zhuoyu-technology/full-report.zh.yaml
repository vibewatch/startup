      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据显示，提名会转化为多层次 OEM 项目，但从部署到毛利的桥接仍缺乏已披露的收入和利润率结果。
    data:
      nodes:
        - id: nominations
          label: OEM 提名与设计赢单
          value: 130+ nominated models
          detail: 商业进展从提名和平台定点开始，而不是从已披露的订阅开始。
        - id: configuration
          label: 平台与算力配置
          value: 32-1500+ TOPS
          detail: 客户项目可以选择不同的算力、传感器和控制器组合。
        - id: delivery
          label: 硬件与软件交付
          value: Controllers, sensors, LiDAR, ADAS stack
          detail: 公开产品组合表明，变现方式是软硬件捆绑方案。
        - id: sop
          label: SOP 与车型发布
          value: 60+ mass-produced models
          detail: 收入取决于提名是否转化为量产车型上市。
        - id: support
          label: 车队学习、OTA 与本地化
          value: Ongoing deployment support
          detail: 运营不会止于出货，还包括更新、测试和本地市场支持。
        - id: output
          label: 毛利与现金创造
          value: Undisclosed
          detail: 公开来源支持这套经营逻辑，但没有提供利润率、现金消耗或现金续航值。
      edges:
        - from: nominations
          to: configuration
          label: 项目设计选择算力与感知等级
        - from: configuration
          to: delivery
          label: 选定架构决定交付内容
        - from: delivery
          to: sop
          label: 获提名项目达到 SOP 后产生上市收入
        - from: sop
          to: support
          label: 量产项目需要持续更新和验证工作
        - from: support
          to: output
          label: 利润率取决于支持负担、产品组合和未披露定价
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI012
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: ZYT 的产品栈在感知、算力 / 控制、端到端软件、车队学习以及汽车级交付与合规流程之上，叠加面向客户的 ADAS 功能。
    data:
      layers:
        - label: 面向用户的功能
          detail: 交付到 OEM 项目的量产辅助驾驶流程。
          modules:
            - 城市驾驶导航
            - 高速驾驶导航
            - 点到点驾驶
            - 多层自动泊车
          outputs:
            - L2 及以上乘用车部署
            - 兼容燃油、混合动力和 EV
        - label: 感知
          detail: 以摄像头为主的技术栈，可选 LiDAR 和其他传感器配置。
          modules:
            - 惯性辅助双目摄像头
            - 惯性辅助双目与长焦摄像头系统
            - LiDAR-双目一体机
            - ZHIZHOU 盲区 LiDAR
            - 雷达 / 超声波 / 第三方 LiDAR 选项
        - label: 算力与控制
          detail: 面向汽车级场景优化、降低算力占用的算力 / 控制平台。
          modules:
            - 安全 MCU + ISP + GNSS
            - 32—1500+ TOPS 控制器范围
            - ASIL-D 设计目标
            - IP6K7 控制器可靠性说法
        - label: 算法
          detail: 基于大规模轨迹和专家驾驶数据训练的端到端软件栈。
          modules:
            - 端到端 ADAS
            - 个性化驾驶行为学习
            - 自然语言驾驶交互
            - 轻地图 / 无地图城市导航
        - label: 车队学习与更新
          detail: 部署后的改进闭环，用于提升软件功能和性能。
          modules:
            - 自动化数据挖掘
            - 数据标注
            - 模型训练与评估
            - 云端仿真测试
            - OTA 更新
        - label: 交付与合规
          detail: 自有制造、安全 / 网络安全流程，以及欧洲本地化计划。
          modules:
            - PLM / ERP / MES / EAM / QMS
            - TISAX / A-SPICE / IATF 16949 里程碑
            - ISO 26262 / ISO 21434 / SOTIF 相关说法
            - 德国子公司与欧盟安全架构落地
    approximationNotes: 这是对保留来源中已命名层级的结构性综合，不是供应商提供的系统图，也不是经审计的物料清单。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 从 OEM 认证到扩张的客户旅程
    type: journey-map
    summary: 公开证据显示了一条可重复的路径：从 OEM 认证和提名进入 SOP 部署，再扩展到邻近品类和海外市场。
    data:
      items:
        - label: OEM 认证
          detail: 首个披露的 OEM 项目来自 Volkswagen Group China，为其在企业级汽车项目中建立了多年立足点。
          touchpoints:
            - 2019 年与 Volkswagen Group China 开展首个 OEM 项目
            - 2020 年与 SGMW 开始合作
        - label: 项目赋能
          detail: 通过质量和工程审计降低进一步向 OEM 推广的摩擦。
          touchpoints:
            - IQ.Pilot 合作通过联合 A-SPICE CL2 审计
            - 与 VW 相关的审计可缩短未来软件质量审查周期
        - label: 提名管线
          detail: 官网称其拥有规模较大的提名基础，但这些提名尚未转化为 SOP。
          touchpoints:
            - 130 余项提名合作
            - 没有公开的提名到 SOP 转化率
        - label: 乘用车 SOP
          detail: 乘用车部署是当前最清晰的商业证明。
          touchpoints:
            - 官网列出 60 余款量产车型
            - Hongqi 量产案例和 SGMW 关系
        - label: 邻近品类扩张
          detail: 商用车和物流品类似乎是下一层增长空间。
          touchpoints:
            - Baike 所列覆盖排名前六的卡车品牌
            - 官方及第三方来源均提到自动驾驶物流
        - label: 海外本地化
          detail: 欧洲正在被建设为一套市场进入动作，而非已经充分验证的客户基础。
          touchpoints:
            - 设有研发、测试和 BD 人员的 Braunschweig 子公司
            - 保留来源中没有已签署的欧洲 OEM 量产提名
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU009
      - CU010
      - CU016
