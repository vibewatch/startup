              覆盖广泛算力区间，因此收入可能来自嵌入式软件、ADAS 控制器、传感器和更高规格配置，而不是单一固定费用。公开落地体现在部署代理指标，而不是收入披露：公司称拥有 34 个客户及生态合作伙伴、60+ 款量产车型和
