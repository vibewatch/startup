        blocks:
          - type: paragraph
            body: >-
              当前风险排序集中在三个问题：第一，中国对高级驾驶辅助的监管姿态在行业事故频发后明显收紧，即使供应商没有直接涉事，也增加了路线图、营销和 OTA 发布假设难以执行的概率。第二，Zhuoyu
              的商业化路径似乎越来越依赖少数 OEM 和控制权关系，尤其是与 FAW 相关的项目及持股。第三，竞争栈正在转向芯片加软件捆绑及更低成本部署，可能在 Zhuoyu 披露经审计的独立经济数据之前就压缩利润率和赢单率。
