      - number: '2.2'
        title: 规模测算口径与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              多个公开口径显示，底层采用基础已经具备相当规模。XEPS 报告称，中国乘用车市场 L2+ 在 H1 2025 的渗透率达到 56.1%，高速 NOA 装车量为 1.798 million 辆，其中
              RMB100k-200k 价格带贡献了 NOA 装车总量的 45.3%。Research and Markets 提供了第二个口径：标准高速 NOA 月度渗透率从 2025 年 1 月的 5.8% 上升到
              2025 年 10 月的 19.6%，新车城市 NOA 渗透率达到 28.1%。iEVChina 的更窄域控制器口径则显示，市场规模可能从 2024 年约 RMB15 billion 增长到 2028 年超过
              RMB60 billion。这些来源共同支持一个规模大且正在快速成形的市场，但仍无法按模块、OEM、地域或 take rate 拆出 Zhuoyu 可触达的 SAM 或
              SOM。缺口在于项目级定价、销量和产品组合披露。
