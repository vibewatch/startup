  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略验证和部署证明已经出现，但经济数据缺失、治理悬置和竞争压力使结论仍停留在继续研究。
    data:
      nodes:
        - id: production-proof
          label: 量产证明
          detail: 官方称拥有 34 个客户、60 余款量产车型和 130 余项提名。
        - id: strategic-capital
          label: 战略资本
          detail: FAW 支持的融资超过 RMB 3.6 billion，报道的投后估值高于 RMB 10 billion。
        - id: governance-overhang
          label: 治理悬置
          detail: 报道的 FAW 35.80% 持股和 New Territory 34.85% 持股意味着共同控制。
        - id: missing-economics
          label: 缺失的经审计经济数据
          detail: 指定证据中没有公开的经审计收入、利润率、现金消耗、现金或优先股堆叠。
        - id: competitive-pressure
          label: 竞争压力
          detail: 成本优化的集成式同行提高了维持溢价定价的门槛。
        - id: recommendation
          label: 继续研究 / 公允
          detail: 公开证据验证了相关性和势头，但没有验证少数股东条款下可投资的价格。
      edges:
        - from: production-proof
          to: strategic-capital
          label: 支持需求故事
        - from: strategic-capital
          to: recommendation
          label: 提供帮助
        - from: governance-overhang
          to: recommendation
          label: 限制上行空间
        - from: missing-economics
          to: recommendation
          label: 阻碍投资判断
        - from: competitive-pressure
          to: recommendation
          label: 压缩估值倍数
    approximationNotes: 仅为定性流程；图示呈现证据方向，不代表加权评分或隐含概率。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV010
      - CV012
