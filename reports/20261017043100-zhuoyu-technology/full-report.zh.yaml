      - number: '2.3'
        title: 采用驱动、竞争压力与约束
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动是成本下降同时保持可接受性能：Zhuoyu 自有材料强调 32-1500+ TOPS 的广泛部署，第三方报道则突出 32 TOPS 和 100 TOPS 的落地，这与中国自动驾驶从高端专属走向大众
              NOA 的趋势高度吻合。但同一趋势也制造压力。Research and Markets 表示，第三方供应商已在城市 NOA 增量中扮演重要角色；Gasgoo 关于 Black Sesame 和
              DeepRoute.ai 的报道显示，市场正在转向高度集成的芯片加软件栈，可能压缩供应商差异化。监管也会比普通 L2+/L2++ 部署更快地拖慢最激进的用例：中国在 2025 年收紧了 OTA
              和自动驾驶变更的审批及报告要求；2026 年 Baidu 武汉故障后冻结 Robotaxi 许可，则说明即使乘用车 ADAS 仍在采用，安全事故也可能推迟试点市场扩张。
            claimRefs:
              - CM008
              - CM012
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方选择
        blocks:
          - type: paragraph
            body: >-
              ZYT 面对的不只是直接 ADAS 软件供应商。实际买方选择包括 Huawei 这样的生态平台、Momenta 这样的算法与集成伙伴、Horizon Robotics 这样的算力平台供应商、Nullmax 与
              Black Sesame 这样的成本导向组合、Tesla 这样的垂直整合品牌，以及由 OEM 主导的内部集成或多供应商路径。ZYT 已不再只是试点阶段的新进入者：其官方页面声称拥有 34
              个客户及生态合作伙伴、60 多款量产车型和 130 多个定点。第三方报道还描述了 FAW 的重要持股和融资。这些信号证明其具有竞争相关性，但不足以证明品类领先，因为 FAW
              披露的供应商网络表明，战略投资者和客户可以同时维持多个替代技术栈。
