  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 官方规模说法经尽调验证，欧洲从战略布局转化为带来收入的提名，经审计经济数据显示出溢价利润率或资本效率。
        - 只有经审计的增长、利润率和治理条款支持可持续溢价，价值才可能超过报道中约 RMB 12.5 billion 的投前估值。
        - 经审计财务报表、清晰的条款清单和独立客户背书共同验证了盈利性商业化。
        - 尽调中出现项目延迟、出口管制摩擦或不利于投资人的条款。
      - - 基准
        - FAW 的支持有助于赢得并交付项目，但公开记录仍以里程碑为主，对经济性的透明度只有部分。
        - 公允价值维持在报道中的 2025 年投后估值高于 RMB 10 billion、2026 年投前约 RMB 12.5 billion 的指示区间附近，回报取决于有纪律的入场价格和保护条款。
        - 当前证据集显示：真实的产业验证、并不完整的经济数据披露，以及尚无更优现金转化的证明。
        - 下一轮融资或上市延迟，因为证据始终未能从战略叙事升级为经审计的经营证明。
      - - 悲观
        - 客户指标被证明存在口径膨胀，竞争压低价格，海外扩张受到地缘政治或合规拖累。
        - 如果盈利能力、控制权或资本需求相较当前叙事令人失望，价值将跌破 2025 年高于 RMB 10 billion 的估值水平。
        - KPI 冲突持续，行业不利信号增多，投资人仍只能接触不完整的公开数据。
        - 下轮融资估值下调、惩罚性优先权或退出窗口延迟，损害少数股东回报。
    notes: 情景区间仅以指定资料池中报道的融资估值为锚；它们不是市场出清估值意见，待取得经审计经济数据和详细条款清单后，应重新进行投资判断。
