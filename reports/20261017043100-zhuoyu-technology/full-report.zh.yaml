      - number: '3.2'
        title: 能力与差异化
        blocks:
          - type: paragraph
            body: >-
              ZYT 最有证据支持的差异化在于工程灵活性，而不是受独占保护的算法。公司称 ClixPilot 覆盖 32 至超过 1,500 TOPS，支持多种传感器配置，并能在 32 AI TOPS
              下提供城市和高速导航功能。其产品面还整合了控制器、传感器、软件、车队学习、OTA 更新，并支持燃油、混合动力和纯电车辆。这种广度可以减少 OEM
              集成工作，扩大可覆盖车型范围。但现有证据没有独立比较其安全性、接管、延迟或成本。Nullmax 和 Black Sesame 披露了面向 CNY 80,000 至 CNY 150,000 车辆的单芯片方案，而
              Tesla 2026 年在中国的发布又抬高了终端用户预期。因此，竞争方向是以更低部署成本提供更广能力，这可能使 ZYT 的低算力优势商品化。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
