      - number: '3.3'
        title: 定价、分销与切换
        blocks:
          - type: paragraph
            body: >-
              商业比较受到一个基本证据缺口限制：现有来源没有披露 ZYT、Huawei、Momenta、Horizon 或 Nullmax 的实际供应商价格、折扣或项目利润率。Tesla 是例外，CNBC 报道其中国
              Model 3 配置器上的一次性价格为 CNY 64,000，但同一报道称主流 FSD 的可用性仍不明确。不能用整车价格带替代 ADAS 供应商定价。分销证据更清楚。FAW 对 ZYT
              的共同控制可以改善其进入车辆项目的机会，但同一 OEM 集团在其他项目中也使用 Huawei、Momenta 和 Horizon。ZYT
              的认证、控制器和传感器集成以及量产历史，可能在定点后形成项目级切换成本；但公开来源没有量化替换率、合同期限或从定点转化为量产的比例。因此，买方议价能力看起来强于供应商锁定。
            claimRefs:
