  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence read is research-more rather than buy or pass. Public sources do show a meaningful
              financing step-up: one independent report says FAW's 2025 investment exceeded RMB 3.6 billion and pushed
              Zhuoyu above a RMB 10 billion post-money valuation, while Zhuoyu's own materials also say FAW invested
              over RMB 3.6 billion in 2025. That is real strategic validation. It is not enough, however, to justify
              paying into the latest mark on public evidence alone, because the accessible record still does not
              disclose audited revenue, gross margin, burn, cash, or liquidation terms. EquityZen explicitly withholds
              current valuation, cap-table, and financial detail behind accredited-only access, so the available
              valuation context is directionally useful but incomplete for minority investors.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
