      - number: '1.2'
        title: Leadership, control, and capital context
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility in the assigned pool is narrow. Baidu's company profile names Zhu Lu as legal
              representative and cites 2026 public comments from CEO Shen Shaojie, but the source set does not expose a
              full board roster, committee structure, or shareholder-rights package. Capital and control evidence is
              more concrete than governance detail. Official milestones say Zhuoyu secured over RMB 3.6 billion of
              strategic investment from FAW in 2025, while ChinatechSignals later reported a March 2026 pre-IPO
              fundraise of $280 million at a $1.74 billion valuation. PlastMatch, citing a SAMR-published transaction
              description, reported that FAW would hold 35.80% and New Territory 34.85%, implying joint control if the
              structure closed as described. Together, those datapoints suggest the company is financed and
              strategically relevant, but still requires direct diligence on governance rights, cap-table mechanics, and
              whether FAW's economic stake translates into operational control.
