      - number: '6.2'
        title: Adoption signals are real, but the headline counts are not directly comparable
        blocks:
          - type: paragraph
            body: >
              The strongest adoption evidence is that Zhuoyu keeps publishing operating footprint metrics at all, and
              those metrics are directionally corroborated by third-party summaries. The official site claims 34
              customers and ecosystem partners, 60+ mass-produced vehicle models, and 130+ nomination collaborations.
              Baike's 2026 snapshot is lower on every disclosed count, at 22 cooperative customers, 32 brands, more than
              50 mass-produced models, and more than 100 designated models. That gap does not invalidate the customer
              story, but it does mean public metrics mix different denominators, time bases, and category definitions.
              Investors should therefore treat the footprint as proof of real commercial traction, not as a cleanly
              auditable cohort or revenue-quality metric.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU015
