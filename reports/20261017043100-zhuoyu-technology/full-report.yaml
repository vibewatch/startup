            body: >-
              Zhuoyu's official milestone trail shows steady movement from internal project to production supplier:
              early road-test licensing, Volkswagen and SGMW program wins, 2023 standalone operation under the Zhuoyu
              name, 2024 strategic partnerships with FAW and Dongfeng, and 2025 milestones around IAA Mobility,
