  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The product is not described as a generic autonomy platform; it is presented as a mass-produced OEM ADAS
              stack aimed at practical assisted-driving workflows. Official materials position ClixPilot around city
              navigation, highway navigation, door-to-door driving, and multi-floor auto parking, while external sources
              describe the company as a full-stack supplier spanning hardware, software, and cloud services. That
              combination matters because it suggests ZYT is selling an integrated Tier 1-style package rather than only
              an algorithm module, and it helps explain why the company emphasizes affordability for mid-range and
              fuel-vehicle programs instead of only premium EV launches.
            claimRefs:
