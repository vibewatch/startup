  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Support
      - Anti-thesis / failure mode
      - What would change the view
    rows:
      - - Strategic validation
        - FAW-backed capital exceeded RMB 3.6 billion and strategic shareholders appear willing to deepen control.
        - Strategic money can reflect supply-chain security or ecosystem control more than minority-return economics.
        - >-
          Provide shareholder agreement terms, board rights, reserved-matters list, and confirmation that new investors
          share the same economics as strategic holders.
      - - Commercial proof
        - >-
          Official materials claim 34 customers, 60+ mass-produced models, and 130+ nominations, plus a European
          strategy unveiled at IAA 2025.
        - >-
          Public KPI definitions conflict with Baidu's smaller customer and model counts, and no audited revenue or
          margin disclosure ties these wins to cash generation.
        - >-
          Reconcile customer, brand, SOP, and nomination metrics with dated cohorts and customer-level revenue
          concentration.
      - - Comparable pressure
        - Sector funding rebounded in 2025, showing that scaled ADAS suppliers can still attract capital.
        - >-
          Gasgoo's competitor coverage shows the market now rewards cost-effective integrated stacks, raising the bar
          for sustained premium multiples.
        - >-
          Show independent win-rate, margin, or renewal evidence that demonstrates defensible economics against
          integrated peers.
    notes: >-
      This is a milestone-based comparable set because the assigned public pool does not provide clean public-company or
      private-round multiple disclosures for direct like-for-like valuation.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Official scale claims hold up under diligence, Europe converts from strategy to revenue-bearing nominations,
          and audited economics show premium margins or capital efficiency.
        - >-
          Value can exceed the reported ~RMB 12.5 billion pre-money indication only if audited growth, margin, and
          governance terms support a durable premium.
        - >-
          Audited financials, clean term sheet, and independent customer references validate profitable
          commercialization.
        - Program delays, export-control friction, or investor-unfriendly terms emerge during diligence.
      - - Base
        - >-
          FAW backing helps win and ship programs, but the public record remains milestone-driven and only partially
          transparent on economics.
        - >-
          Fair value stays around the reported >RMB 10 billion 2025 post-money to ~RMB 12.5 billion 2026 pre-money
          indications, with returns depending on disciplined entry and protections.
        - >-
          Current evidence set: real industrial validation, incomplete economic disclosure, and no proof yet of superior
          cash conversion.
        - >-
          The next round or listing is delayed because evidence never graduates from strategic narrative to audited
          operating proof.
      - - Bear
        - >-
          Customer metrics prove definition-inflated, competition compresses pricing, and overseas expansion faces
          geopolitical or compliance drag.
        - >-
          Value falls below the 2025 >RMB 10 billion mark if profitability, control rights, or capital needs disappoint
          against the current narrative.
        - >-
          KPI conflicts persist, adverse sector signals rise, and investor access remains limited to incomplete public
          data.
        - Down-round, punitive preferences, or a delayed exit window impair minority returns.
    notes: >-
      Scenario ranges are anchored only to reported financing marks in the assigned source pool; they are not
      market-clearing valuation opinions and should be re-underwritten once audited economics and term-sheet detail are
      available.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
