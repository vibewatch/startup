  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint spans OEMs first, then adjacent mobility categories
        blocks:
          - type: paragraph
            body: >
              Zhuoyu's public positioning is clearly B2B and OEM-led rather than consumer subscription-led. The official
              homepage says the company provides mass-produced intelligent-driving solutions for global automotive
              partners and describes a mobility ecosystem spanning passenger vehicles, commercial vehicles, autonomous
              logistics, Robotaxi, and embodied AI. Its technology page adds that ClixPilot supports both ICEV and EV
              programs with full-scale mass production already underway, which matters because it widens the addressable
              buyer set beyond EV-native OEMs. Third-party coverage broadens that picture rather than replacing it:
              Baike describes 22 partner customers covering 32 brands, with designated programs extending into heavy
              trucks and unmanned logistics. The result is a customer base that appears segmented by vehicle platform
              and use case, but still centered on OEM and fleet channels rather than direct end-user monetization.
            claimRefs:
