  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic validation and deployment proof are visible, but missing economics, governance overhang, and competitive
      pressure keep the call at research-more.
    data:
      nodes:
        - id: production-proof
          label: Production proof
          detail: Officially claimed 34 customers, 60+ mass-produced models, and 130+ nominations.
        - id: strategic-capital
          label: Strategic capital
          detail: FAW-backed funding exceeded RMB 3.6 billion and was reported above a RMB 10 billion post-money mark.
        - id: governance-overhang
          label: Governance overhang
          detail: Reported 35.80% FAW ownership and 34.85% New Territory ownership imply joint control.
        - id: missing-economics
          label: Missing audited economics
          detail: No public audited revenue, margin, burn, cash, or preference stack in the assigned evidence.
        - id: competitive-pressure
          label: Competitive pressure
          detail: Cost-optimized integrated peers raise the hurdle for sustaining premium pricing.
        - id: recommendation
          label: Research-more / fair
          detail: Public evidence validates relevance and momentum, not an investable price on minority terms.
      edges:
        - from: production-proof
          to: strategic-capital
          label: supports demand story
        - from: strategic-capital
          to: recommendation
          label: helps
        - from: governance-overhang
          to: recommendation
          label: caps upside
        - from: missing-economics
          to: recommendation
          label: blocks underwriting
        - from: competitive-pressure
          to: recommendation
          label: compresses multiple
