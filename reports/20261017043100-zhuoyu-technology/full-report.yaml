              - CV005
              - CV010
              - CV012
      - number: '8.2'
        title: Financing context and comparable pressure
        blocks:
          - type: paragraph
            body: >-
              The financing context is strategically strong but economically ambiguous. PlastMatch reports that FAW
              would own 35.80% after the transaction while New Territory would hold 34.85%, implying joint control and
              meaningful governance influence by strategic shareholders. Zhuoyu's official site simultaneously presents
              a scaling story, claiming 34 customers and ecosystem partners, 60-plus mass-produced vehicle models, and
              more than 130 nomination collaborations. Yet Baidu Baike gives a smaller late-2025/early-2026 operating
              footprint of 22 cooperative customers, 32 brands, and more than 100 designated models. That discrepancy
              may reflect timing or definition changes, but without a reconciled KPI bridge it weakens valuation
              confidence. Independent sector evidence also points to multiple-compression risk: Gasgoo says China's ADAS
              market is shifting from a pure performance race toward cost-effectiveness and integrated hardware-software
              stacks, increasing the pressure on suppliers that cannot translate technical promise into defendable unit
              economics.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Scenarios and final diligence gates
        blocks:
          - type: paragraph
            body: >-
              The scenario frame should stay milestone-based, not precision-priced. Reported financing marks give two
              public anchors: above RMB 10 billion post-money in late 2025 and roughly RMB 12.5 billion pre-money in
              March 2026. Those figures make it reasonable to treat Zhuoyu as a serious strategic asset rather than an
              early experiment, but they do not prove that new money can underwrite attractive minority returns at or
              above the latest implied price. The bear case is easy to articulate: sector competition intensifies,
              governance rights favor strategic holders, geopolitical scrutiny complicates international expansion, and
              a weak operating-data package forces a down-round or delayed exit. The upside case needs real evidence,
              not storytelling: audited economics, explicit preference terms, and customer-level proof that nomination
              momentum converts into profitable production revenue.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive verdict
            body: >-
              Research-more is the right call because the financing step-up is real, but the public record still lacks
              audited revenue, margin, burn, cash, and preference terms needed to underwrite minority returns at the
              latest implied valuation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV012
          - type: callout
            title: Metric-definition drift matters
            body: >-
              The gap between the official 34-customer / 60+ model disclosure and Baidu's 22-customer / 32-brand / 100+
              designated-model disclosure makes scale evidence directionally positive but too weakly reconciled for
              premium underwriting.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
          - type: callout
            title: What would upgrade the case
            body: >-
              A stronger recommendation needs audited economics, a clean view of cap-table and liquidation preferences,
              and proof that European or additional OEM nominations translate into profitable production revenue rather
              than symbolic strategic wins.
            calloutType: assumption
            claimRefs:
              - CV007
              - CV008
              - CV012
