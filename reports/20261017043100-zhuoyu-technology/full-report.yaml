      - number: '5.3'
        title: Deployment maturity, certifications, and roadmap
        blocks:
          - type: paragraph
            body: >-
              ZYT's delivery story is stronger than its public benchmarking story. The company cites a long
              certification and process trail across TISAX, A-SPICE, ISO management systems, IATF 16949, SOTIF, and
              product-level functional safety milestones, and it couples those claims with an in-house manufacturing
              center and a 500-plus manufacturing/quality engineering team. On the market side, official materials say
              ZYT had 34 customers and ecosystem partners, 60-plus mass-produced vehicle models, and more than 130
              nomination projects by 2026, while Gasgoo and PlastMatch add evidence of FAW-linked programs,
              Qualcomm-based urban-navigation deployments, and a Europe expansion effort centered on localized testing
              and safety architecture.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
      - number: '5.4'
        title: Product-specific underwriting risks
        blocks:
          - type: paragraph
            body: >-
              The biggest product-technology risk is not an obvious absence of product breadth; it is the gap between
              ZYT's detailed official narrative and the thinner independent validation available in the assigned pool.
              The company appears to be widening from passenger-car ADAS into heavy trucks, unmanned logistics, smart
              cockpit modules, and a broader mobile-physical-AI platform, which raises integration, homologation, and
              support complexity. Yet the retained sources do not provide public disengagement statistics, field-failure
              rates, warranty-return data, or public developer signals that would let an investor test whether
              low-compute, map-light deployment is translating into durable real-world reliability.
            claimRefs:
              - CE008
              - CE011
              - CE012
