companyProfile:
  summary: >-
    Zhuoyu Technology is a Shenzhen-based, DJI-origin intelligent-driving supplier that moved from internal
    automotive-project roots in 2016 to an independent operating company by 2023. It now sells mass-produced ADAS and
    broader mobile-intelligence solutions for OEM programs across passenger vehicles, commercial vehicles, and adjacent
    autonomous-mobility use cases, and it has visible customer, nomination, and capital-market traction. The public
    record remains thin on audited economics, governance rights, and customer concentration, so the company is best
    treated as a real but still partially underwritten OEM-program business.
  productSummary: >-
    Mass-produced ADAS and mobile-intelligence platforms spanning controllers, sensors, software, fleet learning, and
    OEM integration.
  customerFocus: Passenger-vehicle, commercial-vehicle, and autonomous-mobility OEM program owners.
  businessModel: OEM-facing hardware-plus-software platform sales, integration, and program-support revenue.
  stage: growth-stage private
  fundingStatus: FAW-backed strategic financing with a reported March 2026 pre-IPO round and earlier 2025 strategic investment.
  disclosureProfile: private-disclosed
  headquarters: Nanshan District, Shenzhen, China
  foundingLocation: Shenzhen, China
