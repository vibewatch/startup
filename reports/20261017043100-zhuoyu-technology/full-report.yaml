      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The public cost thesis is more legible than the actual economics. Official materials emphasize low-compute
              deployment, automotive-grade manufacturing, safety-certified controllers, and supply-chain execution,
              which collectively support management's claim that it can deliver lower-cost ADAS than more compute-heavy
              stacks. The milestone record also implies OEM-style sales cycles and front-loaded engineering effort: the
              first Volkswagen project appears in 2019, the first ADAS mass-production SOP appears in 2022, and
              multi-platform end-to-end city-driving mass production appears in 2025. That pattern is directionally
              useful for diligence because it suggests working-capital and engineering intensity before full scale, but
              it still does not reveal CAC, payback, contribution margin, or cash conversion.
