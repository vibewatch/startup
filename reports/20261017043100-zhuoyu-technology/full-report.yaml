              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fastest-moving external risk
            body: >-
              China's post-accident tightening around driver-assistance language, public beta testing, and OTA
              governance is moving faster than Zhuoyu's public disclosures, so regulatory execution risk currently looks
              more immediate than a proved company-specific legal event.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: callout
            title: Minimum diligence before underwriting upside
            body: >-
              Before treating Zhuoyu's scale claims as investable proof, obtain the FAW shareholder agreement, customer
              revenue concentration by OEM and program, audited cash and margin data, and the internal evidence behind
              release, recall, and cybersecurity governance.
            calloutType: recommendation
