      - number: '2.3'
        title: Adoption drivers, competitive pressure, and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is cost-down with acceptable performance: Zhuoyu's own materials emphasize
              broad deployment across 32-1500+ TOPS configurations, and third-party reporting highlights 32 TOPS and 100
              TOPS deployments that map well to China's move from premium-only autonomy to mass-market NOA. That same
              shift creates pressure. Research and Markets says third-party suppliers already play a major role in urban
              NOA increment, while Gasgoo's reporting on Black Sesame and DeepRoute.ai shows the market moving toward
              tightly integrated chip-plus-software stacks that can compress supplier differentiation. Regulation also
              slows the most ambitious use cases faster than ordinary L2+/L2++ rollouts: China tightened approval and
              reporting requirements for OTA and autonomous-driving changes in 2025, and the 2026 robotaxi permit freeze
              after Baidu's Wuhan outage shows that safety incidents can delay pilot-market expansion even when
              passenger-car ADAS adoption continues.
            claimRefs:
              - CM008
              - CM012
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer options
        blocks:
          - type: paragraph
            body: >-
              ZYT competes against more than direct ADAS software vendors. The practical buyer set includes ecosystem
              platforms such as Huawei, algorithm and integration partners such as Momenta, compute-platform suppliers
              such as Horizon Robotics, cost-focused pairings such as Nullmax with Black Sesame, vertically integrated
              brands such as Tesla, and an OEM-led internal integration or multi-sourcing path. ZYT itself is no longer
              merely a pilot-stage entrant: its official pages claim 34 customers and ecosystem partners, more than 60
              mass-produced vehicle models, and over 130 nominations. Third-party reporting also describes substantial
              FAW ownership and financing. Those signals establish competitive relevance, but not category leadership,
              because FAW's disclosed supplier network demonstrates that a strategic investor and customer can maintain
              several alternative stacks at the same time.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
              - CP016
