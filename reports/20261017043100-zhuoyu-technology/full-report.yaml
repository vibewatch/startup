      - number: '6.3'
        title: Named deployments show production traction with FAW, Volkswagen channels, and SGMW lineage
        blocks:
          - type: paragraph
            body: >
              Zhuoyu's public customer proof is strongest where a named OEM, a specific program, and a production or
              qualification milestone appear together. The company says its first OEM project launched with Volkswagen
              Group China in 2019 and that SGMW collaboration started in 2020, which establishes relationship longevity.
              Later evidence is more concrete: EQS says the Volkswagen IQ.Pilot collaboration passed a joint A-SPICE CL2
              audit across Volkswagen entities, while Gasgoo and Baike both tie Zhuoyu's system to FAW/Hongqi production
              programs and road-tested European demonstrations. A Sina repost adds another Hongqi production datapoint.
              This is materially better than a logo wall, but most sources still stop short of disclosing program
              volumes, customer spend, or renewal behavior.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
