      - number: '4.3'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Company Overview covers the full funding chronology; for current underwriting the financially material
              updates are the 2025 FAW strategic investment and the 2026 pre-IPO process. ZYT's own milestones page says
              FAW invested more than RMB 3.6 billion in 2025, while Baike and CXO Digital Pulse each describe a fresh
              2026 pre-IPO raise at roughly RMB 2 billion or about $290 million, with valuation markers of about RMB
              12.5 billion pre-money or roughly $1.8 billion. Independent and secondary sources also align that FAW
              became the largest shareholder at 35.80% and New Territory retained 34.85%, leaving the company jointly
              controlled. That capital clearly improves near-term balance-sheet flexibility, but it also deepens
              dependence on one strategic investor-customer axis and leaves standalone liquidity metrics undisclosed.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial readout is best described as commercially promising but still non-underwritable on public
              evidence alone. Gasgoo's report on the German subsidiary, local R&D and testing teams, and nationwide test
              coverage in 2026 suggests overseas expansion will require additional operating spend before readers can
              see proven European revenue. At the same time, the assigned public sources disclose none of the core
              numbers that matter most for investment judgment: standalone revenue, gross margin, cash, burn, runway,
              customer-level concentration, realized pricing, and payment terms. Until management supplies those
              figures, the right verdict is that ZYT may be scaling a real OEM program business, but the margin path and
              financing needs remain open diligence items rather than settled underwriting facts.
            claimRefs:
              - CI010
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Visible demand, invisible topline
            body: >-
              Public traction is strong enough to show buyer adoption, but the evidence still stops at nominations,
              model count, and partner logos instead of revenue, gross margin, or backlog conversion.
            calloutType: insight
            claimRefs:
              - CI004
              - CI014
              - CI016
          - type: callout
            title: FAW is both sponsor and dependency
            body: >-
              FAW's investment improves capital access, but joint control and commercialization overlap mean capital
              adequacy is increasingly tied to one strategic relationship rather than diversified financing alone.
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI011
          - type: callout
            title: Treat this as an OEM-program underwriting case
            body: >-
              Ask for program-level revenue mix, gross margins, payment terms, and burn before treating ZYT like a
              software business with recurring economics.
            calloutType: recommendation
            claimRefs:
