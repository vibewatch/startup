              - CP007
              - CP009
              - CP015
      - number: '3.4'
        title: Moat durability and adverse case
        blocks:
          - type: paragraph
            body: >-
              The public case for a durable moat rests on execution: low-compute deployment, a wide hardware envelope,
              automotive certifications, and repeated production programs. None of those elements proves that ZYT owns
              an irreplaceable channel or a performance lead. Competitive pressure comes from both ends. Lower-cost
              integrated stacks can narrow the economic distinction, while Tesla and OEM ecosystem vendors can reset
              buyer expectations through brand, software, or bundled distribution. Expansion beyond passenger vehicles
              also adds policy exposure. The FCC's current covered list applies category restrictions to
              foreign-produced uncrewed aircraft systems and advanced robotic devices, while ZYT publicly describes
              expansion into vehicle-mounted drones, autonomous logistics, robotaxis, and embodied AI. The retained FCC
              text does not name ZYT, so this is a diligence risk rather than evidence of a present restriction. The
              investment case should treat pricing power, independent safety performance, and western-market eligibility
              as unresolved.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Compute-efficient integration is the clearest disclosed edge
            body: >-
              ZYT combines a wide controller and sensor envelope with a claim that city and highway navigation functions
              can run at 32 AI TOPS, creating a credible integration and cost proposition for mass-market OEM programs.
            calloutType: strength
            claimRefs:
              - CP001
              - CP008
              - CP011
          - type: callout
            title: Strategic ownership does not eliminate buyer leverage
            body: >-
              FAW's joint control of ZYT improves distribution access, but FAW's simultaneous use of Huawei, Momenta,
              and Horizon indicates that even a strategic OEM relationship can remain multi-sourced.
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a business that monetizes through OEM programs rather than a public
              consumer subscription or transparent software-seat model. ZYT's official English site says it provides
              mass-produced intelligent driving solutions for global automotive partners and positions ClixPilot across
              a wide computing-power range, which suggests monetization can span embedded software, ADAS controllers,
              sensors, and higher-spec configurations rather than one fixed fee. Public traction is visible in
              deployment proxies, not topline disclosure: the company says it has 34 customers and ecosystem partners,
              60+ mass-produced vehicle models, and 130+ nomination collaborations. That is enough to show commercial
              relevance, but not enough to convert pipeline into audited revenue quality.
