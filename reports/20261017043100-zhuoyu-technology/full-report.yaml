  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      ZYT's product stack layers customer-facing ADAS functions on top of sensing, compute/control, end-to-end software,
      fleet learning, and automotive-grade delivery/compliance processes.
    data:
      layers:
        - label: User-facing functions
          detail: Mass-produced assisted-driving workflows delivered into OEM programs.
          modules:
            - Navigation on City Driving
            - Navigation on Highway Driving
            - Door-to-Door Driving
            - Multi-Floor Auto Parking
          outputs:
            - L2 and above passenger-vehicle deployment
            - Fuel, hybrid, and EV compatibility
        - label: Sensing
          detail: Camera-first stack with optional LiDAR and other sensor configurations.
          modules:
            - Inertial-Aided Stereo Camera
            - Inertial-Aided Stereo and Tele Camera System
            - LiDAR-Stereo Onebox
            - ZHIZHOU blind-zone LiDAR
            - Radar / ultrasonic / third-party LiDAR options
        - label: Compute and control
          detail: Automotive-grade compute/control platform optimized for lower compute footprints.
          modules:
