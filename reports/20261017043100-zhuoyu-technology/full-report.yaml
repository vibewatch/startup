      - number: '3.2'
        title: Capability and differentiation
        blocks:
          - type: paragraph
            body: >-
              ZYT's best-supported differentiation is engineering flexibility rather than a uniquely protected
              algorithm. The company says ClixPilot spans 32 to more than 1,500 TOPS, supports multiple sensor
              configurations, and can deliver city and highway navigation functions at 32 AI TOPS. Its product surface
              also combines controllers, sensors, software, fleet learning, over-the-air updates, and support for
              internal-combustion, hybrid, and electric vehicles. This breadth can reduce OEM integration work and widen
              the addressable model range. However, the retained evidence does not independently benchmark safety,
              disengagement, latency, or cost against peers. Nullmax and Black Sesame disclose a single-chip package for
              vehicles priced at CNY 80,000 to CNY 150,000, while Tesla's 2026 China launch raises end-user
              expectations. The direction of competition is therefore toward broader capability at lower deployment
              cost, which can commoditize ZYT's low-compute advantage.
            claimRefs:
              - CP001
              - CP006
