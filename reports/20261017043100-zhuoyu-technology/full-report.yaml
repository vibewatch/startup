      - number: '6.4'
        title: Durability and concentration remain the main unresolved commercial risks
        blocks:
          - type: paragraph
            body: >
              The retained evidence supports a simple conclusion on customer durability: Zhuoyu has multiple public
              deployment signals, but almost no public retention telemetry. None of the retained sources disclose NRR,
              GRR, churn, renewal rates, contract terms, or customer-level revenue concentration. At the same time, the
              FAW relationship has become structurally important. Third-party sources say FAW owns 35.8% of Zhuoyu,
              jointly controls the company with New Territory, and has become the largest shareholder and client. That
              combination can accelerate procurement and productization, but it also raises dependency and governance
              risk if Hongqi, FAW-Volkswagen, or broader FAW priorities change. Europe shows similar asymmetry: the
              company has localization staff and market-entry messaging, but the retained evidence still does not
              identify a signed European OEM production nomination.
            claimRefs:
              - CU013
              - CU014
