      - number: '3.3'
        title: Pricing, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Commercial comparison is constrained by a basic evidence gap: the assigned sources do not disclose
              realized ZYT, Huawei, Momenta, Horizon, or Nullmax supplier prices, discounts, or program margins. Tesla
              is the exception, with CNBC reporting a CNY 64,000 one-time price on its China Model 3 configurator,
              although the same report said mainstream FSD availability remained unclear. Vehicle price bands cannot be
              substituted for ADAS supplier pricing. Distribution evidence is clearer. FAW's joint control of ZYT can
              improve access to vehicle programs, yet the same OEM group uses Huawei, Momenta, and Horizon on other
              programs. ZYT's certifications, controller and sensor integration, and production history plausibly create
              program-level switching costs after nomination, but public sources do not quantify replacement rates,
              contract duration, or conversion from nomination to production. Buyer leverage therefore appears stronger
              than supplier lock-in.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
