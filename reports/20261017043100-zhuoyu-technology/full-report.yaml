    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports Zhuoyu as a Shenzhen-based intelligent-driving supplier whose operating
              story starts in 2016, even though the current legal entity dates to October 2022 and the official history
              frames 2023 as the point when the business began operating independently as Shenzhen Zhuoyu Technology
              Co., Ltd. The company describes itself as a mobile-intelligence platform provider rather than a
              single-program engineering shop: official pages position ZYT as selling open, customizable, mass-produced
              L2+ driving systems for OEMs while extending the same technical base into autonomous logistics, robotaxi,
              and embodied-robot scenarios. Publicly supported scale is stronger on customer and program counts than on
              financial disclosure: the company claims 34 customers and ecosystem partners, 60+ mass-produced models,
              and 130+ nomination collaborations, but the assigned pool does not provide audited standalone revenue,
              ARR, cash, or burn figures.
