        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a vertically integrated architecture with named sensors, controllers,
              compute integration, and a post-deployment learning loop. ZYT's technology page is unusually specific for
              a company website: it names inertial-aided stereo cameras, a tele camera system, LiDAR-Stereo Onebox
              hardware, blind-zone LiDAR, Safety MCU/ISP/GNSS integration, automated data labeling and training, cloud
              simulation, and OTA updates. External corroboration from Baidu Baike and PlastMatch reinforces the claim
              that the stack is designed to support map-light or map-free urban and highway NOA while remaining
              compatible with different chips and optional LiDAR configurations, which is central to the company's
              low-compute positioning.
