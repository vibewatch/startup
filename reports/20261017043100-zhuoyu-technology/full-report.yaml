  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer definition
        blocks:
          - type: paragraph
            body: >-
              Zhuoyu is not selling a single premium autonomy feature into one niche buyer; the public record positions
              it as a mass-produced ADAS supplier whose addressable market spans passenger vehicles, fuel and new-energy
              platforms, commercial trucks, and adjacent autonomous-logistics or Robotaxi programs. The practical
              boundary is the controller, perception, and software stack that OEMs can deploy at automotive scale, not
              the full global autonomy TAM often used in generic pitch materials. That framing matters because the buyer
              is usually an OEM platform or smart-driving team, while the end user is the vehicle driver or fleet
              operator and the payer remains the vehicle program P&L owner. The earliest disclosed manufacturing ramp
              also starts in heavy trucks and unmanned logistics vehicles before broader passenger-car scale, which
              suggests Zhuoyu can pursue clearer ROI-led programs before the most speculative L4 markets mature.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
