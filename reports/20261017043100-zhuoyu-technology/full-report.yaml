      - number: '2.2'
        title: Sizing lenses and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              Multiple public lenses show that the underlying adoption base is already material. XEPS reports that L2+
              penetration in China's passenger-vehicle market reached 56.1% in H1 2025, with highway NOA installations
              at 1.798 million units and the RMB100k-200k band contributing 45.3% of total NOA installations. Research
              and Markets adds a second lens: standard highway NOA monthly penetration rose from 5.8% in January 2025 to
              19.6% in October 2025, while urban NOA penetration in new vehicles reached 28.1%. A narrower editorial
              domain-controller lens from iEVChina points to approximately RMB15 billion in 2024 growing to more than
              RMB60 billion by 2028. Together these sources support a large and fast-forming market, but they still do
              not isolate Zhuoyu's reachable SAM or SOM by module, OEM, geography, or take rate. The missing bridge is
              program-level pricing, volume, and mix disclosure.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
