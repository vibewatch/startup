    claimRefs: [CR002, CR003, CR007, CR010, CR011, CR012, CR013, CR015]
callouts:
  - calloutType: risk
    title: Primary risk
    body: The central underwriting risk is not a proven incident; it is the absence of retained company-specific evidence showing that Aether's privacy, security, resilience, and dependency controls satisfy regulated-enterprise requirements.
    claimRefs: [CR012, CR013, CR014]
  - calloutType: recommendation
    title: Advance only against evidence
    body: Require jurisdiction maps, independent control tests, incident and SLO history, provider concentration, deployment cohorts, IP schedules, insurance, and funded remediation before reducing the residual-risk rating.
    claimRefs: [CR009, CR012, CR013, CR014, CR015]
