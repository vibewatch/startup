chapter:
  number: 7
  title: Risks
  summary: Aether's highest-consequence risks are jurisdiction-specific data governance, AI application security, and dependence on infrastructure and enterprise deployment partners. The retained evidence defines the external risk environment and diligence standards, but it does not establish Aether's control maturity, incident history, resilience, IP position, or capacity to fund remediation.
sections:
  - id: risk-priorities
    title: Risk priorities and thesis-break triggers
    body: |
      Aether's risk profile is conditional because the assigned evidence contains standards, legal guides, policy pages, and comparable deployment signals rather than company-specific control records. NIST presents AI risk management as a voluntary framework for incorporating trustworthiness into design, development, use, and evaluation, while OWASP identifies critical vulnerabilities in LLM applications. These sources justify high impact ratings for security and governance failures, but they do not prove that Aether has suffered an incident or lacks controls. The investment case should pause after a material privacy or security event, repeated contracted service-level failure, inability to satisfy a regulated customer's residency or audit requirement, or persistent failure to convert pilots into production.
    claimRefs: [CR001, CR002, CR003, CR012, CR015]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: |
      UAE data protection is not a single-regime exercise. The retained legal analysis describes distinct federal, DIFC, and ADGM frameworks, with applicability driven by entity and processing jurisdiction and with cross-border obligations that require data-flow mapping. A separate official strategy page calls for a government law on safe AI use. One Digital Dubai page goes further and claims a comprehensive 2026 AI Act with four risk tiers, but the assigned pool contains no underlying legislation or second source confirming that description. Aether therefore needs a counsel-reviewed entity, role, data-class, transfer, and sector map before investors underwrite compliance. Patent scope is similarly unverified: WIPO provides a search system, not proof of Aether ownership or freedom to operate.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, quality, and security exposure
    body: |
      Managed model training, deployment, and monitoring create failure paths across model inputs, generated outputs, access controls, data pipelines, rollback procedures, and third-party infrastructure. OWASP and NIST offer appropriate control lenses, including GenAI-specific risk management, but no retained source is an Aether security assessment, incident register, certification report, or recovery test. The Azure status page displayed no active events when retrieved; that point-in-time statement says nothing about Aether's provider mix, historical availability, or contracted performance. Residual exposure therefore remains high until management supplies independent testing, architecture and subcontractor maps, incident response records, recovery evidence, and customer-facing service-level results.
    claimRefs: [CR001, CR002, CR003, CR010, CR012, CR014]
    tableRefs: [TR002]
  - id: partners-financial-capacity
    title: Partner, execution, and financial capacity
    body: |
      Partner risk spans cloud and model providers, regulators, enterprise buyers, and any implementation channels. Emirates News Agency reported that Dubai Customs was still refining two AI initiatives in pilot phases before full deployment; this is a regional deployment signal, not evidence that Dubai Customs uses Aether. It nevertheless illustrates why pipeline claims should be separated from production conversion and contracted revenue. Public evidence also does not quantify Aether's burn, runway, insurance, customer concentration, compliance cost, or gross-margin sensitivity. Investors should require deployment cohorts, concentration schedules, supplier exit plans, insurance limits, and a funded remediation budget. Failure to close those gaps leaves both operational mitigations and downside absorption unquantified.
    claimRefs: [CR011, CR012, CR013, CR014, CR015]
    tableRefs: [TR003]
