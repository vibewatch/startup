    columns: [Rank, Dependency, Counterparty or role, Concentration status, Failure scenario, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [1, "Cloud and model infrastructure", "Unidentified providers", "Not disclosed", "Provider outage, pricing change, policy restriction, or lock-in", "High", "Portability plan, redundancy, committed capacity, exit testing", "High", "Obtain spend and workload concentration, contracts, architecture, and tested exit plan"]
      - [2, "Regulated enterprise deployment", "Customers and implementation owners", "Not disclosed", "Pilot does not reach production or audit approval", "High", "Stage gates, acceptance criteria, deployment playbook", "Medium-high", "Obtain pilot-to-production cohorts, deployment duration, and referenceable outcomes"]
      - [3, "Regulatory interpretation and approvals", "UAE, DIFC, or ADGM authorities", "Jurisdiction map absent", "Control redesign, delayed deployment, or enforcement", "High", "Counsel ownership, horizon scanning, documented assessments", "High", "Obtain regulator correspondence, DPIAs, DPO assessment, and open remediation list"]
      - [4, "Remediation funding and risk transfer", "Balance sheet and insurers", "Burn, runway, and limits not disclosed", "Insufficient capacity to fund controls, claims, or service recovery", "High", "Board budget, insurance, contingency reserve, covenant headroom", "High", "Obtain cash bridge, downside runway, policy schedules, exclusions, and compliance spend"]
    notes: "Counterparties and concentration are unknown where the pool contains no Aether-specific disclosure; null evidence is not treated as zero exposure."
    claimRefs: [CR005, CR007, CR011, CR012, CR013, CR014, CR015]
