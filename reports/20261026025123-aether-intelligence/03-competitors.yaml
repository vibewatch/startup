      - [Specialist AI cloud / infrastructure entrant, "No Aether-specific price observed", "Compute or infrastructure layer", "Discounting and capacity terms unknown", "Sequoia identifies commodity and marginal-cost pricing pressure in GPU infrastructure"]
    notes: "The only Aether price range is reported by Shuraa and is not independently corroborated; unavailable alternatives are not assigned zero or estimated prices."
    claimRefs: [CP010, CP011, CP012, CP013]
