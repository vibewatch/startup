    columns: [Alternative, Price or contract model, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Aether Intelligence, "Reported annual subscription of $120,000–$2.4 million; reported implementation fee of 25%–30% of license value", "Model deployment and professional services are reported", "Realized price, discounting, term, and margin are unknown", "Potentially high ACV supports enterprise selling but may increase procurement friction"]
      - [Hyperscaler ML platforms, "No like-for-like price captured in the assigned pool", "Shuraa names three platforms but provides no comparable package specification", "Usage, commitment, and services economics not compared", "Benchmarking requires a workload-specific bill of materials"]
