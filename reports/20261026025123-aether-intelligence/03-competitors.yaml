callouts:
  - calloutType: insight
    title: The moat is not yet demonstrated
    body: "Aether's regional and regulated-enterprise positioning is plausible, but the assigned sources do not verify a durable technical moat, pricing power, certification scope, or switching-cost advantage."
    claimRefs: [CP006, CP009, CP014]
  - calloutType: risk
    title: Internal builds and commodity infrastructure constrain pricing
    body: "Dubai Customs illustrates a customer-side internal intelligence build, while Sequoia's analysis describes GPU infrastructure as increasingly commodity-like; both create displacement or margin-pressure scenarios."
    claimRefs: [CP007, CP011, CP012]
  - calloutType: recommendation
    title: Underwrite against alternatives, not a generic AI market
    body: "Require workload-level total-cost comparisons, referenceable renewals, implementation evidence, security attestations, and migration data against hyperscaler and internal-build options before assigning moat value."
    claimRefs: [CP013, CP014, CP016]
