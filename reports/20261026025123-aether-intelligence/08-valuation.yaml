  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, Research more, "Do not underwrite an investment from the public record alone."]
      - [Confidence, Low, "The core company metrics come from one low-reputation secondary source."]
      - [Risk rating, High, "Revenue quality, burn, concentration, and preference terms remain undisclosed."]
      - [Valuation stance, Stretched, "The reported $1B post-money mark lacks independently verified denominators."]
      - [Entry discipline, Evidence-gated, "Require audited economics, cohort data, cap-table terms, and a current comp set."]
    notes: >-
      Assessments are analytical judgments from the retained public evidence;
      they are not securities advice and do not assign a numeric fair value.
    claimRefs: [CV001, CV007, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Reported client and retention metrics indicate possible enterprise-software traction.", "Board-grade cohort exports and customer confirmations that reconcile to audited revenue."]
      - [Thesis, "UAE fintech growth and public-sector AI pilots support a favorable regional demand backdrop.", "Evidence that Aether converts this demand into diversified recurring contracts and cash generation."]
      - [Anti-thesis, "The reported $1B mark relies on uncorroborated company metrics and unknown financing preferences.", "Primary round documents, a clean preference stack, and audited revenue-quality evidence."]
      - [Anti-thesis, "The relayed 40x ARR estimate is above the article's cited 8x-15x public range.", "Verified growth, margins, retention, and strategic scarcity sufficient to justify a premium."]
    notes: >-
      Company operating metrics and the adverse multiple comparison are attributed
      to Shuraa; regional and benchmark evidence does not independently verify them.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV013, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited recurring revenue confirms reported scale; NRR is near 158%; growth and software margins remain strong.", "A premium may be defensible, but a range awaits verified revenue, margin, and transaction terms.", "Positive only after independent operating and customer verification.", "NRR, gross margin, or growth materially misses reported levels."]
      - [Base, "Regional demand is real, but Aether-specific economics and concentration remain unverified.", "Treat $1B as fully priced and negotiate evidence-based downside protection rather than assume expansion.", "Most consistent with the current incomplete public record.", "Financing documents reveal senior preferences, heavy dilution, or weak runway."]
      - [Bear, "Revenue quality is weaker than reported, concentration is high, or growth slows before profitability.", "Down-round and preference overhang can impair common-equity outcomes; no numeric floor is supportable.", "Elevated while audited financial and cohort evidence is absent.", "Customer loss, failed metric reconciliation, or inability to finance on clean terms."]
    notes: >-
      Scenarios are qualitative because the assigned evidence lacks audited
      financials, a verified capitalization table, and comparable private transactions.
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV009, CV011, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The reported financing mark passes through operating-proof, benchmark, and
      terms gates before it can support an investment recommendation.
    data:
      nodes:
        - id: reported-mark
          label: Reported $1B post-money mark
          detail: Third-party reported; no primary round document retained.
        - id: operating-proof
          label: Verify recurring economics
          detail: Audit revenue, gross margin, burn, growth, retention, and concentration.
        - id: benchmark-fit
          label: Establish comparable fit
          detail: Match growth, scale, liquidity, margins, and business model.
        - id: financing-terms
          label: Review financing terms
          detail: Confirm dilution, preferences, debt, and secondary components.
        - id: current-decision
          label: Research more
          detail: Current evidence does not support a numeric fair-value range.
        - id: investable-gate
          label: Invest only after proof and price alignment
          detail: Require verified metrics and acceptable downside protection.
    approximationNotes: >-
      The sequence is a diligence decision path, not a probability-weighted
      valuation model or representation of conversion rates.
    claimRefs: [CV001, CV003, CV008, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Research more. Reconsider only after audited revenue quality, customer
      cohorts, current capitalization and preference terms, and a matched
      comparable set establish both operating proof and an acceptable entry price.
    claimRefs: [CV007, CV008, CV016]
  - calloutType: risk
    title: Do not confuse funding with liquidity
    body: >-
      The reported $380 million raised is cumulative financing, not evidence of
      cash on hand, runway, or value available to common shareholders.
    claimRefs: [CV002]
