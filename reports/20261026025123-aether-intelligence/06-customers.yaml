      - [Cleveland Clinic Abu Dhabi, Healthcare, "Diagnostic imaging analysis, per Shuraa", Unknown, "No corroborating assigned source", "No attributable clinical, operational, or financial outcome"]
      - [Dubai Customs, Government and customs, "Cargo risk assessment automation, per Shuraa", Unknown, "WAM describes OCTA and ACI pilots without naming Aether; the separate Dubai Customs URL resolves to generic homepage content", "No vendor attribution, contract value, production date, or measured outcome"]
    notes: "Partial enumeration of every customer explicitly named by the retained Shuraa article; no row has two-source confirmation of an Aether relationship."
