company:
  name: Aether Intelligence
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof is not investment-grade. One low-reputation article reports
    217 enterprise clients, three named deployments, 94% retention, and 158% net revenue
    retention, but the assigned independent and customer-side sources do not connect
    those organizations to Aether; two newly discovered company-controlled pages instead
    describe an Abuja-based namesake with different products.
sections:
  - id: identity-and-proof-boundary
    title: Identity conflict limits customer attribution
    body: >-
      The first diligence issue is entity resolution, not customer growth. The two
      net-new company-controlled pages in the assigned pool use aetherintelligence.com
      and describe an Abuja-based applied-AI company founded in 2020, with AetherView,
      AetherView Atrium, and Aether Fleet. Its contact page invites enterprise
      deployments and pilot partnerships but supplies no named deployment, outcome, or
      retention evidence. Those facts do not match the refresh context's Dubai enterprise
      infrastructure profile, so they cannot be used to validate that target's customers.
      The name collision creates a material risk that search results, logos, and commercial
      claims could be attributed to the wrong entity unless management provides legal
      entity, domain, and customer-contract evidence.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: segments-and-adoption
    title: Reported customer mix is specific but single-sourced
    body: >-
      Shuraa reports 217 enterprise clients across 18 countries as of April 2026 and a
      revenue mix of 68% financial services, 22% healthcare, and 10% government. These
      figures suggest a regulated-enterprise buyer profile and meaningful exposure to
      financial services, but they remain one publisher's assertions: no assigned filing,
      company disclosure from the Dubai entity, procurement record, or customer
      announcement corroborates the count or mix. External sector evidence supports only
      the plausibility of demand. BCG found that 74% of surveyed companies had not yet
      shown tangible AI value, while WAM described active AI adoption by UAE banks.
      Neither source verifies Aether's share of that demand.
    claimRefs: [CU004, CU005, CU009, CU010, CU016]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named accounts remain claims rather than verified deployments
    body: >-
      The retained article names Emirates NBD for fraud detection, Cleveland Clinic Abu
      Dhabi for diagnostic imaging, and Dubai Customs for cargo-risk assessment. The
      assigned customer-side material does not confirm those relationships. WAM describes
      UAE banks adopting AI-based fraud controls without naming Aether, and its July 2026
      Dubai Customs coverage identifies OCTA and ACI as pilots without naming Aether.
      A separate Dubai Customs URL resolves to generic Arabic homepage content rather than
      the intended strategy article. Accordingly, the evidence does not establish whether
      any named account is a paid production deployment, a pilot, a partner-led project,
      or an inaccurate secondary-source attribution.
    claimRefs: [CU006, CU010, CU011, CU013, CU014]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Retention, expansion, and concentration remain unverified
    body: >-
      Shuraa reports 94% customer retention for 2025 and 158% net revenue retention, but
      gives no cohort, starting revenue denominator, treatment of services, or calculation
      method. It also reports annual platform pricing of $120,000 to $2.4 million and
      implementation fees equal to 25% to 30% of annual software license value, implying
      potential land-and-expand economics without proving realized expansion. No retained
      source discloses gross revenue retention, churn, renewal terms, contract duration,
      top-customer concentration, channel contribution, or procurement timing. Sequoia's
      broader warning about weak AI-infrastructure pricing power reinforces the need for
      contract-level proof rather than reliance on an unaudited NRR claim.
    claimRefs: [CU007, CU008, CU012, CU015]
    figureRefs: [FU001]
