callouts:
  - calloutType: risk
    title: Customer proof does not clear entity-resolution risk
    body: >-
      Do not treat the reported client count, logos, retention, or NRR as verified until
      the Dubai legal entity and domain are tied to contracts and direct customer references.
    claimRefs: [CU001, CU004, CU006, CU007, CU014]
