      - [Revenue retention, null, "Snowflake reports 124% net revenue retention as of April 30, 2025", "Benchmark disclosure demonstrates the metric's usefulness, not Aether performance", "Provide cohort retention, expansion, churn, and exact cohort definitions"]
      - [Remaining performance obligations, null, "Snowflake reports $6.7 billion for Q1 FY26", "Contracted backlog can differ from recognized revenue and is not disclosed for Aether", "Provide backlog, duration, cancellation rights, and recognition schedule"]
    notes: "Comparable figures are not Aether figures. Official or third-party benchmark disclosures are included only to define the diligence fields needed for underwriting."
    claimRefs: [CI003, CI004, CI015]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, low, "Cloud and model costs may determine whether deployment scales profitably", "Provide GAAP and contribution gross margin by product and customer cohort"]
      - [CAC and payback, null, low, "Sales efficiency determines financing need during enterprise expansion", "Provide fully loaded CAC, bookings attribution, sales cycle, and payback"]
      - [Operating cash flow, null, low, "Cash generation is distinct from accounting profit and revenue", "Provide monthly cash-flow statements and reconciliation to management reporting"]
      - [Burn and runway, null, low, "Determines capital adequacy and next-round timing", "Provide current cash, monthly net burn, committed spend, debt, and runway case"]
      - [Working capital, null, low, "Project work and enterprise payment terms can consume cash before collection", "Provide receivables aging, payment terms, deferred revenue, and concentration"]
      - [Capex and infrastructure commitments, null, low, "Owned or reserved compute can create fixed obligations", "Provide cloud commitments, hardware leases, capex plan, and cancellation terms"]
    notes: "Null means unavailable in the assigned successful prefetched evidence, not zero. No estimate is substituted for a private-company disclosure."
    claimRefs: [CI005, CI008, CI009, CI011, CI013, CI014]
