  - id: FU001
    title: Customer evidence journey and missing proof
    type: journey-map
    summary: >-
      Public evidence reaches claimed deployment and retention metrics, but verification breaks at customer attribution,
      outcomes, renewal, and concentration.
    data:
      items:
        - label: Segment targeting
          detail: Shuraa reports financial services, healthcare, and government revenue segments.
          touchpoints:
            - Secondary article
            - Sector-demand context
        - label: Commercial inquiry
          detail: The Abuja namesake contact page invites enterprise deployments and pilot partnerships.
          touchpoints:
            - Contact form
            - Identity check required
        - label: Named deployment claim
          detail: Three organizations are named by Shuraa without customer-side confirmation.
          touchpoints:
            - Emirates NBD
            - Cleveland Clinic Abu Dhabi
            - Dubai Customs
        - label: Production validation
          detail: No retained source establishes paid production status or attributable outcomes.
          touchpoints:
            - Contract request
            - Reference call
            - Usage evidence
        - label: Renewal and expansion
          detail: Reported 94% retention and 158% NRR lack cohort and calculation support.
          touchpoints:
            - Cohort schedule
            - Renewal register
            - Expansion bridge
        - label: Concentration review
          detail: Top-customer and channel concentration are not disclosed.
          touchpoints:
            - Top-10 revenue
            - Channel contribution
            - Procurement timing
    approximationNotes: This is an evidence-status journey, not a measured conversion funnel or a verified customer lifecycle.
