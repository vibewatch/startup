            title: Customer proof does not clear entity-resolution risk
            body: >-
              Do not treat the reported client count, logos, retention, or NRR as verified until the Dubai legal entity
              and domain are tied to contracts and direct customer references.
            calloutType: risk
            claimRefs:
              - CU001
