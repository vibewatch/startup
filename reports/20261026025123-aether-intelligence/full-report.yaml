              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Buyer choice is likely to turn on deployment environment, data governance, integration effort, workflow
              ownership, and evidence of operational value rather than on a generic “AI” label. BCG's survey of 1,000
              executives across 59 countries found that 74% of companies had yet to show tangible value from AI, and
              that roughly 70% of implementation challenges were people- and process-related, versus 20% technology and
              10% algorithms. That evidence favors vendors that can own change management, workflow integration, and
              governance, but it does not prove Aether wins those dimensions. Dubai Customs provides a concrete
              internal-build comparator: its OCTA enterprise-intelligence pilot supports knowledge management, data
              analysis, and recommendations, while ACI applies AI to pre-arrival shipment data for risk analysis. Such
              internal platforms can substitute for an external vendor when an institution has data, domain expertise,
              and implementation capacity. Shuraa reports regional positioning and compliance claims, but no independent
              source in this pool verifies Aether's certifications, uptime, patents, customer retention, or
              switching-cost advantages.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
      - number: '3.3'
        title: Pricing pressure and moat durability
        blocks:
          - type: paragraph
            body: >-
              No target-company price list or independently verified contract terms were found in the assigned evidence.
              The Shuraa article reports annual subscription pricing of $120,000 to $2.4 million and
              professional-services fees of 25% to 30% of license value, but it is a single external article and its
              detailed company metrics are not corroborated here. Those figures should therefore be treated as reported,
              not as realized pricing or unit economics. Competitive pricing pressure is structurally credible: Sequoia
              argues that GPU computing is increasingly a commodity metered by the hour and that dedicated AI-cloud
              entrants can compete prices toward marginal cost. This risk applies most directly to infrastructure
              layers; it is less decisive if Aether captures durable workflow, compliance, data, or distribution
              advantages.       The evidence supports only a reported regional-differentiation thesis, not a proven
              moat. A buyer should request win/loss data, renewal cohorts, implementation time, reference customers,
              security attestations, and a like-for-like total-cost comparison against hyperscaler and internal-build
              alternatives.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
