  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Evidence boundary and product identity
        blocks:
          - type: paragraph
            body: >-
              The current pool does not contain a verified target-domain product page, API reference, changelog, trust
              center, status history, certification record, or customer technical deployment. It does contain two
              different Aether-branded surfaces that should not be merged into the target. Aether Intelligence at
              aetherintelligence.com describes a research-driven applied-AI company in Abuja and lists satellite crop
              monitoring, greenhouse digital-twin tooling, and autonomous systems; its own page says “Products — one
              live, two in development.” A separate AETHER Aerospace site describes five engineering engines, local and
              air-gapped deployment, requirements traceability, and compliance-oriented workflows. These are useful
              name-collision warnings, not evidence that the target under review owns either product set. The product
              identity, buyer workflow, release status, and ownership therefore remain unresolved.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
