        title: Revenue model remains unverified
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not verify a revenue stream for the Dubai target. Its only Aether-named page
              describes an artificial-intelligence research and software-deployment business at an Abuja address, so
              using that listing as target evidence would conflate two entities. Digital Dubai establishes a broad
              regional digital-economy context, but its landing page names no Aether product, buyer, contract, price, or
              revenue. Public-company comparables show several possible monetization structures—consumption-based
              product revenue, subscriptions, licenses, support, hosting, and professional services—but those are
              diligence templates rather than Aether facts. The underwriting baseline is therefore unknown revenue mix,
              unknown recognition policy, and no verified distinction among recurring platform, implementation, or
