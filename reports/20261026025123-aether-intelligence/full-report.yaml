      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              No retained source reports the target's cloud-compute burden, model-inference cost, implementation labor,
              support expense, gross margin, CAC, payback, sales cycle, or working-capital profile.       Peer
              disclosures illustrate why these fields must remain separate. Snowflake's official results distinguish
              consumption-based product revenue from services and report different product and total gross margins.
              Yahoo Finance's C3.ai page reports negative operating cash flow alongside cash on the balance sheet,
              showing that cash availability and current cash generation are different measures. Bessemer's cloud index
              defines free cash flow as operating cash flow less capex, a useful convention that still cannot be applied
              without Aether inputs. Diligence should segment economics by deployment type and customer cohort rather
              than infer a SaaS profile from the sector label.
