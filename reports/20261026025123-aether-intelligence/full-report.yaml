      - number: '5.2'
        title: Architecture, workflow, and deployment implications
        blocks:
          - type: paragraph
            body: >-
              External platform documentation establishes what a credible managed-ML operating model normally exposes,
              but it does not prove that Aether implements those controls. AWS describes managed model building,
              training, deployment, distributed algorithms, and bring-your-own frameworks. Azure documents model
              training and deployment, monitoring, retraining, governance, lineage, auditability, role-based access
              control, real-time and batch endpoints, and regional data handling. Google documents managed datasets,
              distributed training, model registries, version tracking, evaluation, and inference deployment. MLflow
              describes experiment tracking, evaluation, model registry, deployment across cloud and on-premises
              environments, and OpenTelemetry-based observability. Against that benchmark, the target-specific evidence
              gap is material: there is no retained target architecture, component inventory, integration contract,
              latency or uptime series, model-evaluation report, or reproducible deployment artifact. A technical
              diligence review should request these artifacts before assigning a maturity premium.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.3'
        title: Trust, safety, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence is about what peer platforms make auditable, not what the target has
              demonstrated. Azure explicitly frames production ML around secure and auditable environments, lineage, job
              artifacts, and monitoring; AWS and Google describe managed infrastructure and lifecycle services; MLflow
              emphasizes quality, cost, safety, and access observability. The AETHER Aerospace namesake claims “Every
              result shows its derivation” and lists local, on-premises, air-gapped, RBAC, audit-log, and offline
              deployment modes, but that issuer is not verified as the target. No target-specific evidence in this pool
              verifies security attestations, privacy controls, incident history, service-level commitments, model-risk
              governance, regulatory scope, or support processes. The product thesis is therefore plausible only as an
              unverified capability hypothesis, with implementation and trust risk high until customer-bound technical
              proof is supplied.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Product and technology verdict
        blocks:
          - type: paragraph
            body: >-
              The chapter supports a conservative verdict: public evidence is insufficient to distinguish a functioning
              target product from similarly named companies or from a services-led proposition built on third-party
              infrastructure. The target should not be credited for proprietary models, differentiated data,
              integrations, certifications, reliability, or secure deployment until the company supplies target-domain
              artifacts. A separate 2024 Sequoia analysis argued that GPU computing was increasingly becoming a metered
              commodity. That market view does not establish Aether's economics, but it raises the proof burden for
              workflow-specific value, proprietary controls, and durable technical differentiation beyond access to
              third-party compute. The most decision-relevant next evidence is a versioned architecture and data-flow
              diagram, two recent production references with measurable outcomes, an endpoint and incident history,
              security and privacy documentation, and a model-evaluation package showing baseline, test set, drift
              monitoring, and rollback controls.
