    severity: minor
    topic: middle-east-ai
    missingEvidence: The full PwC Middle East AI publication rather than the archived landing page returned by the prefetched URL.
    whyItMatters: >-
      The source may contain a useful regional spend or adoption lens, but the retrieved text cannot support a
      substantive claim.
    diligencePath: >-
      Locate an accessible official copy or archived PDF through the publisher and re-check its date, methodology, and
      scope.
    relatedQuestionRefs:
