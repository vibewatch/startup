      These variables determine whether ecosystem readiness converts into durable recurring revenue and whether a
      regional premium is defensible.
    diligencePath: >-
      Request anonymized cohort tables, representative contracts, renewal data, and customer references across
      financial, healthcare, and government accounts.
    relatedQuestionRefs:
      - QM009
