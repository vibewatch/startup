evidenceGaps:
  - type: conflicting-data
    severity: blocking
    topic: identity
    missingEvidence: >-
      Registry-backed confirmation of the target legal entity, headquarters, official website, and any relationship to
      aetherai.tech or aetherview.app.
    whyItMatters: >-
      Namesake search results cannot establish product ownership, leadership, capitalization, or commercial traction for
      the diligence target.
    diligencePath: >-
      Obtain incorporation records and domain-control evidence directly from the company, then reconcile every retained
      company-issued surface to that legal entity.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: blocking
    topic: leadership
    missingEvidence: A current, authoritative founder, executive, and board roster with roles, dates, and ownership context.
    whyItMatters: >-
      Leadership accountability, succession risk, and founder-market fit cannot be assessed from product marketing or a
      login page.
    diligencePath: >-
      Request an updated organization chart, executive biographies, board minutes or composition, and incorporation
      records from the company or lead investor.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: funding
    missingEvidence: Primary financing announcements, cap table, term summary, and valuation basis for the reported Series C.
    whyItMatters: >-
      The reported $1 billion valuation and $380 million raised are material to judgment but presently rest on one
      low-reputation secondary article.
    diligencePath: Obtain signed financing documents, investor confirmations, and a current capitalization table under NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited or board-grade revenue, ARR, gross margin, burn, runway, cash, debt, and revenue-recognition schedules.
    whyItMatters: Private-company valuation and solvency cannot be evaluated from reported customer or funding figures alone.
    diligencePath: Request the latest audited statements, monthly management accounts, bank/debt schedule, and forecast bridge.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: milestones
    missingEvidence: >-
      Dated primary evidence for founding, launches, partnerships, certifications, customer deployments, outages, and
      remediation.
    whyItMatters: >-
      The timeline currently mixes current product observations with uncorroborated secondary assertions and regional
      context.
    diligencePath: >-
      Build a source-linked milestone register from company announcements, contracts, regulator records, incident
      reports, and customer references.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent account-level counts, annual platform spend, win rates, and conversion assumptions for UAE, Saudi, and
      wider GCC enterprise AI infrastructure.
    whyItMatters: >-
      Without a common denominator, a company-specific TAM, SAM, and SOM would be a speculative extrapolation rather
      than an investable market estimate.
    diligencePath: >-
      Obtain customer pipeline and win-loss data, segment accounts by country and regulated sector, and reconcile
      contract value to audited revenue or board reporting.
    relatedQuestionRefs:
      - QM003
      - QM009
  - type: conflicting-data
    severity: material
    topic: identity-conflict
    missingEvidence: >-
      Corporate registration, website, investor, or management evidence linking or separating the Dubai enterprise-AI
      infrastructure company from the DarkIris Singapore AIGC subsidiary.
    whyItMatters: Combining different issuers would contaminate product scope, buyer segmentation, and market sizing.
    diligencePath: >-
      Verify legal entity names, domains, directors, ownership, and product documentation against primary corporate
      records.
    relatedQuestionRefs:
