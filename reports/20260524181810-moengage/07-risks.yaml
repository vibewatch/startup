  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cross-border-contract-pack
    missingEvidence: A public DPA, SCC annex set, and sub-processor change log that show the exact transfer mechanics enterprise customers receive.
    whyItMatters: MoEngage documents privacy controls and routing choices, but the contractual transfer package is what ultimately allocates obligations and fallback rights when a regulator or customer challenges a transfer flow.
    diligencePath: Request the live DPA, SCC annexes, sub-processor notice process, and sample customer redlines from counsel before underwriting regulated-region growth.
    relatedQuestionRefs:
    - QR002
    - QR031
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: litigation-and-enforcement-visibility
    missingEvidence: A legal memo or docket search confirming whether MoEngage has any pending privacy, spam, consent, or platform-enforcement matters.
    whyItMatters: This chapter did not surface a MoEngage-specific public enforcement artifact, but absence in public search is not the same as a clean legal file. Investors still need confirmation before relying on a low-litigation assumption.
    diligencePath: Have counsel run court, regulator, and complaint-database searches in the US, India, UK, and EU and confirm any notices, settlements, or threatened claims.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-and-deliverability-metrics
    missingEvidence: Internal incident postmortems, SLA credits, spam complaint rates, blocklist history, and WhatsApp quality metrics.
    whyItMatters: Public status visibility is useful, but investors need frequency, duration, blast radius, and deliverability data to judge whether operational issues are isolated noise or systematic execution risk.
    diligencePath: Request 12 months of incident summaries, deliverability KPIs, WhatsApp quality history, and any material customer escalations tied to message failures.
    relatedQuestionRefs:
    - QR019
    - QR026
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: retention-and-analytics-depth
    missingEvidence: Plan-level retention limits, exceptions for enterprise accounts, reachability-accuracy metrics, and churn data tied to analytics complaints.
    whyItMatters: Independent review evidence points to trust frictions around retention and analytics, but public reviews do not reveal prevalence, severity by segment, or whether paid upgrades solve the issue.
    diligencePath: Review retention SKUs, product telemetry on audience / reachability accuracy, and any customer attrition analyses that cite analytics or retention limits.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: ai-governance-and-explainability
    missingEvidence: Public model-governance documentation covering AI decisioning, explainability, bias review, and high-risk use-case controls.
    whyItMatters: The category is rapidly marketing AI-driven orchestration and recommendations. Without model-governance evidence, investors cannot tell whether MoEngage’s AI layer creates manageable optimization risk or a harder-to-audit compliance exposure.
    diligencePath: Request model cards, human-override design, bias testing, explainability notes, and customer-facing disclosures for AI-driven decisioning features.
    relatedQuestionRefs:
    - QR033
    relatedTableRefs:
    - TR004
    - TR005
