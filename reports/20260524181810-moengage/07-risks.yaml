- id: mitigation-and-thesis-breakers
  title: Mitigation Maturity and Thesis-Break Triggers
  body: 'MoEngage does have credible public mitigations. It documents erasure APIs, routing controls, BYOK options, tokenized sending, SSO, 2FA, access audits, and channel-compliance workflows; those are meaningful because they target the exact areas where a customer-engagement vendor can fail. The underwriting question is whether those controls are consistently deployed, monitored, and commercialized across the installed base. Public evidence is still thin on the contractual pack behind transfers, on detailed incident postmortems, on deliverability complaint metrics, and on AI governance or explainability artifacts. Investors should therefore watch for measurable breaks rather than broad narratives: customer or platform suspensions, sender-quality deterioration, recurring status incidents, disclosure-driven app friction, and suite-led pricing pressure. If MoEngage cannot keep its privacy, routing, and channel-control layer operationally cleaner than the broader market, the mitigation story
    weakens quickly because the product already operates in a category where buyer switching costs are not infinite over time.'
