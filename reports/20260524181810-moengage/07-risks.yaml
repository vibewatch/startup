- id: TR002
  title: Operational / Quality / Security Risk Register
  columns:
  - Risk
  - Likelihood
  - Severity
  - Public Evidence
  - Current Mitigation
  - Residual Exposure
  - Unresolved Gap
  rows:
  - - Consent-state or opt-out sync failure across channels
    - Medium-High
    - High
    - CAN-SPAM, TCPA/FCC, PECR, WhatsApp policy, and Gmail rules all require channel-specific suppression or revocation handling
    - MoEngage keyword tooling, revocation flows, and published compliance guidance
    - A single sync error can create spam complaints, robotext exposure, or template suspension across multiple channels
    - Need the actual suppression architecture, consent-source hierarchy, and QA coverage across email, SMS, push, and WhatsApp
  - - Regional routing or cluster misconfiguration
    - Medium
    - High
    - MoEngage exposes Android and iOS data-center routing controls and publicly claims multi-region infrastructure
    - Regional data-center options and privacy documentation
    - Misrouted traffic can turn an otherwise-compliant deployment into a cross-border data issue
    - Need deployment-by-region inventory, default routing behavior, and override governance
  - - PII exposure from incomplete tokenization, BYOK, or masking adoption
    - Medium
    - High
    - MoEngage offers tokenized sending, BYOK, and masked PII, which implies plaintext handling remains a design choice customers must configure
    - Tokenization, BYOK, PII encryption, and access-control guidance
    - Residual risk remains if customers leave stronger controls disabled or partially deployed
    - Need feature adoption rates, reserved-field exceptions, and key-rotation evidence
  - - Tenant identity and access lapse
    - Medium
    - Medium-High
    - MoEngage publicly recommends 2FA, SSO, and biweekly access reviews
    - 2FA, SAML SSO, and access-audit best practices
    - Admin misuse or stale access can expose the 360-degree user profile and export paths
    - Need role matrix, SCIM / deprovisioning design, and admin activity logging samples
  - - Service lag, ingestion delay, or incident-response weakness
    - Medium
    - Medium-High
    - The public status page disclosed May 2026 lag resolution and no incidents on the run date
    - Public status page and incident visibility
    - Engagement timing matters commercially; even short lags can break triggered campaigns or compliance windows
    - Need SLA terms, credit mechanics, postmortem discipline, and incident volume by quarter
  - - Analytics and retention friction cited by reviewers
    - Medium
    - Medium
    - Independent reviews cite live-segment limitations, reachability concerns, and data storage beyond 180 days
    - Customer support still appears relatively strong, limiting severity
    - Operational trust can still erode if marketers cannot validate audience reach or retain enough historical data
    - Need plan-specific retention options, analytics accuracy metrics, and customer churn tied to these issues
  notes: Rows combine company documentation, status transparency, and independent review evidence. The table focuses on operational failure modes that can create legal exposure or churn even without a headline breach.
