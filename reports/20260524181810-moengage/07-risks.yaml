- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Primary Mitigation
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  - Diligence Ask
  rows:
  - - Cross-border privacy and deletion failure
    - Regional routing, erasure APIs, privacy workflows, enterprise contracting
    - Transfer-mechanics visibility and deletion performance
    - Missing DPA/SCC pack after diligence or repeated breach / deletion escalation in a regulated region
    - Pause or condition investment until contractual and operational mechanics are verified
    - Obtain DPA, SCC annexes, region map, deletion SLOs, and sub-processor notice process
  - - Consent and channel-compliance drift
    - Keyword tooling, suppression logic, template governance, sender hygiene
    - Spam rate, opt-out latency, template rejections, complaint volume
    - Sustained sender spam rates above provider thresholds or rising WhatsApp template rejection / quality issues
    - Treat as thesis-break risk because channel access and brand trust can deteriorate quickly
    - Review deliverability dashboards, complaint logs, and cross-channel suppression architecture
  - - App-store or SDK policy friction
    - Customer disclosure support, minimized collection, manifest / data-safety guidance
    - App-review delays, disclosure mismatches, customer escalation frequency
    - Multiple enterprise customers report release delays or remediation tied to MoEngage SDK disclosures
    - Discount implementation assumptions and require stronger post-sale support economics
    - Sample customer privacy manifests, Apple review responses, and Google Play declaration workflows
  - - Security or reliability control breakdown
    - 2FA, SSO, access reviews, masking, BYOK, status transparency
    - Security exceptions, admin sprawl, incident recurrence, unresolved lag patterns
    - Repeated public incidents, weak admin hygiene, or inability to evidence rollout of core controls
    - Escalate diligence and require remediation plan before underwriting growth durability
    - Inspect admin logs, access-review cadence, incident postmortems, and control adoption rates
  - - Suite-led commoditization and pricing pressure
    - Feature packaging, regulated-use-case specialization, onboarding quality, product focus
    - Win-loss trends, discounting, slower expansion, and feature parity claims from large suites
    - Evidence that enterprise deals are increasingly lost to bundled suite offerings on price or procurement convenience
    - Model lower expansion, tighter gross margin, and weaker exit multiple assumptions
    - Request segmented win-loss data, pricing concessions, and proof of differentiated use cases
  notes: Triggers are designed as monitorable diligence checkpoints rather than deterministic predictions. They connect public risk evidence to concrete post-close watch items and underwriting consequences.
