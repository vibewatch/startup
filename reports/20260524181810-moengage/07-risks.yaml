- id: TR001
  title: Regulatory / Legal Risk Register
  columns:
  - Risk / Rule
  - Jurisdiction
  - Current Exposure
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - GDPR transfer and deletion duties
    - EU / EEA
    - Active — MoEngage documents GDPR workflows and routing controls, but public transfer mechanics remain only partly visible
    - Medium
    - High
    - Regional routing, erasure APIs, privacy policy, documented subject-rights workflows
    - High if SCC annexes, sub-processor notices, or deletion controls do not match customer deployment reality
    - Request the live DPA, SCC annexes, sub-processor notices, and deletion SLA commitments by region
  - - India DPDP perimeter and cross-border handling
    - India + services offered into India
    - Active — India exposure exists whenever services are offered into India and personal data is processed digitally
    - Medium
    - High
    - Security, deletion, and routing controls are publicly documented; law still leaves transfer and enforcement implementation risk
    - Medium-High because operational detail on India-specific governance is not public in this set
    - Obtain India counsel memo, product-country map, and Board escalation process for breach reporting
  - - CCPA / CPRA / Delete Act enforcement
    - California
    - Active — CPPA states it implements and enforces the CCPA and Delete Act
    - Medium
    - Medium-High
    - Privacy policy, user-rights tooling, and customer-configurable profile controls
    - Medium because California enforcement can escalate quickly when disclosure or deletion operations fail
    - Review California-specific data maps, deletion workflows, and enterprise contract language on service-provider status
  - - Email and SMS consent stack (CAN-SPAM, TCPA, FCC, PECR)
    - US / UK / EU
    - Active — rules cover commercial email, robotext consent, revocation handling, and electronic marketing by email or text
    - Medium-High
    - High
    - Subscription workflows, keyword handling, sender-authentication rules, and customer legal responsibility
    - High because mistakes can create both regulator and customer-level exposure across multiple channels
    - Request consent-state architecture, suppression-sync design, and legal review of outbound message classes by channel
  - - WhatsApp policy and template compliance
    - Global platform rule enforced by WhatsApp
    - Active — business-initiated messaging requires opt-in plus approved templates
    - Medium
    - High
    - Template review, opt-in collection, and customer-owned compliance obligations under WhatsApp terms
    - High because channel suspension or template rejection can interrupt a high-value messaging surface
    - Inspect quality-rating history, rejected template rates, and escalation paths for policy appeals
  - - Apple and Google app-policy disclosure obligations
    - iOS / Android app ecosystems
    - Active — developers remain responsible for SDK behavior and sensitive-data disclosure
    - Medium
    - High
    - MoEngage publishes Google Play disclosure guidance and customers can limit collection/routing behavior
    - Medium-High because app-review or disclosure failures can block deployment even without a security incident
    - Sample customer implementations, compare privacy manifests / data-safety forms, and review change-management for SDK disclosures
  notes: Rows rank the highest-priority legal and regulatory exposures tied directly to MoEngage’s public privacy, routing, and messaging documentation. Severity reflects business interruption plus remediation cost, not only statutory fine size.
  enumerationScope:
    coverage: partial
    basis: Register covers the six highest-salience legal and regulatory exposures evidenced by fetched MoEngage materials plus regulator and platform-policy sources reviewed on 2026-05-24. It is not an exhaustive jurisdiction-by-jurisdiction law inventory.
