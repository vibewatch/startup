tables:
  - id: TI001
    title: Revenue Streams and Monetization Lens
    columns:
      - Stream
      - What the public record shows
      - Billing or pricing unit
      - Revenue-quality read
      - Diligence ask
    rows:
      -
        - Core customer-engagement suite
        - Growth and Enterprise packages cover cross-channel journeys, segmentation, analytics, and campaign optimization.
        - Contracted SaaS plan; official numeric pricing undisclosed
        - Recurring software revenue is clearly core, but realized ACV and discount depth are not public
        - Request anonymized order forms and ACV by segment
      -
        - Inform transactional infrastructure
        - Inform is sold as a separate infrastructure layer for OTPs, service updates, and other critical alerts.
        - Per channel used and message volume sent
        - Likely mixes software platform value with pass-through channel economics
        - Request channel gross-margin bridge and direct carrier or vendor costs
      -
        - Connected channels and add-ons
        - WhatsApp, RCS, Line, Viber, Telegram, Personalize, and some channels appear as connected-channel options or add-ons.
        - Add-on or connected-channel contract terms
        - Add-ons can raise ARPU, but public materials do not reveal attach rates
        - Request attach-rate, upsell, and renewal cohorts by module
      -
        - Analytics and product workflows
        - Official December 2025 messaging says Analytics and Inform are now part of a broader shared-data pitch to product and engineering teams.
        - Module expansion within enterprise contract
        - Supports larger platform ACVs if upsell is real, but revenue split is undisclosed
        - Request product-line bookings mix and average multi-product contract size
      -
        - Services, support, and QBRs
        - Enterprise marketing pages and third-party comp framing imply implementation, success, and professional-services support around the core platform.
        - Not publicly itemized
        - Could aid adoption but dilute pure-software gross margin if services are meaningful
        - Request services share of revenue, margin, and attach rate
      -
        - Media and sender charges
        - Help docs say provisioned email or SMS senders can add media-volume charges and account-level aggregation.
        - Volume, segments, or sender-based billables
        - This is the clearest public clue that some realized revenue may be pass-through or low-margin
        - Request invoicing examples showing platform fees versus media fees
    notes: >
      Official pages establish monetization structure but not realized revenue mix. Rows distinguish
      recurring software, usage-driven overages, and possible pass-through channel spend to avoid
      overstating pure SaaS quality.
