company:
  name: MoEngage
chapter:
  number: 4
  title: Financials
  summary: >
    MoEngage clearly monetizes as a usage-priced SaaS platform with a separate
    transactional-infrastructure product, but its public financial disclosure still lags its
    commercial narrative. Official pages and financing announcements corroborate MTU and
    message-based billing mechanics, late-2025 Series F financing of $280 million, and growing
    enterprise and North America traction, yet valuation, lifetime funding, consolidated revenue
    mix, realized pricing, margin, and runway remain materially conflicted or undisclosed. The
    financial verdict is therefore mixed: commercial reality and capital access are evident, but
    public evidence still cannot support a clean underwriting model.
sections:
  - id: monetization-architecture-and-pricing-opacity
    title: Monetization Architecture and Pricing Opacity
    body: >
      Public evidence is unusually good at showing how MoEngage charges, but weak at showing
      what customers actually pay. Official plan pages clearly segment the business into a core
      Growth and Enterprise suite, connected-channel add-ons, and a separate Inform product for
      transactional infrastructure. Billing documentation adds the mechanics that the marketing
      pages omit: MTUs are driven by App or Site Opened activity, event intensity can reprice
      billable MTUs through a fair-usage formula, and Inform charges are tied to channels and
      message volumes used. That is enough to identify a real usage-priced SaaS model with
      channel-sensitive cost drivers. It is not enough to identify realized ACV, discounting, or
      revenue mix. Subscription-code gating and in-product compare-plan flows make the commercial
      structure visible only after buyer engagement, and third-party pricing guides publish
      numeric ranges that official surfaces do not corroborate. The result is a credible
      monetization framework with poor public price discovery.
