  - id: TI005
    title: Public Financial Gaps and Diligence Blockers
    columns:
      - Missing item
      - Why it matters
      - What the public record currently shows
      - Impact on underwriting
      - Exact diligence path
    rows:
      -
        - Realized pricing and discounting
        - Needed to translate plan architecture into real ARPU and revenue quality
        - Official pages show package names and billing mechanics, not actual price sheets
        - Material
        - Request anonymized order forms, price books, and discount approval logs
      -
        - Revenue mix by product and pass-through spend
        - Needed to separate high-margin software from lower-margin messaging or services
        - No public mix across suite, Inform, analytics, services, or media charges
        - Blocking
        - Request monthly revenue bridge by product and direct versus pass-through revenue
      -
        - Gross margin and cost of revenue
        - Needed to judge SaaS economics versus channel-cost exposure
        - No public current gross-margin disclosure
        - Blocking
        - Request gross-margin waterfall and vendor-cost schedule by channel
      -
        - Cash, burn, debt, and runway
        - Needed to test whether Series F actually covers hiring, restructuring, and M&A ambitions
        - No public consolidated cash or debt schedule found
        - Blocking
        - Request latest balance sheet, debt agreements, and cash-flow scenarios
      -
        - CAC, payback, and sales cycle
        - Needed to assess whether enterprise growth is efficient and repeatable
        - No public current disclosure found
        - Material
        - Request pipeline conversion data, payback model, and cohort acquisition costs
      -
        - Consolidated audited statements
        - Needed to reconcile India-entity filings with group economics
        - Publicly accessible evidence is limited to summaries of MCA-linked data and media reports
        - Blocking
        - Request audited group financials and reconciliation to statutory Indian entity
      -
        - Valuation support
        - Needed to decide whether the late-2025 financing reflects $750M, $850M, >$900M, or $1.1B economics
        - Public references conflict and official announcements omit a number
        - Material
        - Request financing docs, cap table, and valuation memo
      -
        - Lifetime funding ledger
        - Needed to measure cumulative dilution and financing efficiency
        - Public sources disagree sharply on total funding raised and what counts as primary capital
        - Material
        - Request round-by-round funds-flow and cap-table financing history
    notes: >
      Every row represents a real blocker to full financial underwriting rather than a cosmetic
      data gap. The strongest public evidence here is often evidence of absence or conflict, which
      is precisely why management data-room work remains essential.
    claimRefs:
      - CI003
      - CI044
      - CI045
      - CI047
