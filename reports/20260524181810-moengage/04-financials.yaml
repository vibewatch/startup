  - id: FI004
    title: Capital Adequacy and Cash-Flow Map
    type: matrix
    layout: wide
    summary: >
      Matrix showing what public evidence says about fresh capital, intended uses, and the
      specific blockers that still prevent a clean runway assessment.
    data:
      columns:
        - What is publicly disclosed
        - Positive interpretation
        - Remaining blocker
        - Why it matters
      rows:
        - label: Series F headline
          values:
            - $280M across two late-2025 tranches
            - Confirms strong investor access and strategic optionality
            - Headline figure mixes primary and secondary flows
            - Round size alone cannot be equated to cash runway
        - label: Fresh capital entering operations
          values:
            - Independent reporting points to about $57M primary in Dec 2025 and a roughly 60% primary split in Nov 2025
            - Suggests meaningful but not unlimited balance-sheet reinforcement
            - Exact funds-flow memo is not public
            - Adequacy depends on how much of the round was true operating cash
        - label: Use of proceeds
          values:
            - AI, GTM hiring, Inform and Analytics expansion, and strategic acquisitions
            - Capital is being deployed into product and growth rather than emergency liquidity
            - No public cash budget or M&A envelope
            - Growth investment can coexist with weak runway if starting cash is low
        - label: Reverse flip and IPO readiness
          values:
            - NCLT-approved merger into India entity and public IPO-readiness comments
            - Simplifies legal structure and may improve listing flexibility
            - Possible tax or restructuring cash outflow is not quantified in audited documents
            - Restructuring costs could absorb part of fresh primary capital
        - label: Cash and debt disclosure
          values:
            - No public consolidated cash, debt, or runway statement found
            - None
            - This is the single biggest financing blind spot
            - Without it, capital adequacy remains a judgment rather than a model
    approximationNotes: >
      The matrix intentionally avoids inventing a runway arithmetic that public sources cannot
      support. It separates disclosed facts from the blockers that still prevent a clean cash-flow
      view.
    claimRefs:
      - CI030
      - CI031
      - CI035
      - CI036
      - CI037
      - CI046
      - CI047
      - CI056
callouts:
  - calloutType: risk
    title: Disclosure opacity is the main financial red flag
    body: >
      MoEngage’s public record is strong on packaging, logo proof, and fundraising headlines, but
      weak on the actual metrics that matter most for financial underwriting: realized pricing,
      consolidated revenue mix, gross margin, cash, debt, runway, and a precise post-money
      valuation. That is why the same late-2025 financing cycle still leaves outside estimates
      ranging from roughly $750 million to $1.1 billion in valuation and from just above $250
      million to nearly $487 million in lifetime funding.
    claimRefs:
      - CI044
      - CI045
      - CI047
      - CI048
      - CI049
      - CI056
  - calloutType: insight
    title: The business model is visible even when the price sheet is not
    body: >
      The combination of MTU billing, event-based FUP recalculation, Inform’s per-channel message
      charging, and enterprise add-ons is enough to identify MoEngage as a real usage-priced SaaS
      platform with multi-product upsell paths. The gap is not understanding the mechanism; it is
      understanding the realized contract economics and how much of the revenue stack is
      high-margin software versus lower-margin messaging or services.
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI009
      - CI011
      - CI056
