  - id: capital-base-liquidity-structure-and-adequacy
    title: Capital Base, Liquidity Structure, and Adequacy
    body: >
      Late-2025 financing materially improved MoEngage’s strategic flexibility, but the structure
      matters as much as the headline. Official announcements establish a $100 million November
      round followed by an additional $180 million in December, taking Series F to $280 million.
      They also make clear that the company intends to spend against AI product expansion, GTM
      hiring, and acquisitions rather than just balance-sheet preservation. Independent reporting
      then qualifies how much fresh corporate cash likely came in: TechCrunch and Economic Times
      both describe the December extension as majority secondary, with about $57 million of
      primary capital and about $123 million of liquidity, while TechCrunch also estimates the
      November round was roughly 60% primary. That structure implies the company is late-stage
      and better capitalized than many private peers, but not flush with the entire headline
      amount as deployable operating cash. The reverse flip to India and stated IPO readiness
      goals add another layer: public evidence supports strategic optionality, yet there is still
      no disclosed cash balance, debt profile, or runway model to confirm how much buffer remains
      after restructuring and growth plans.
