  - id: disclosed-traction-and-public-financial-proxies
    title: Disclosed Traction and Public Financial Proxies
    body: >
      MoEngage’s public materials reveal a business with real scale, but they reveal it in
      fragments rather than in an investor-grade financial package. Historical official materials
      show ARR doubling or better, NRR north of 135%, and a burn-multiple claim below 1x during
      the 2022 scale-up. More recent company surfaces add 2024 quarterly revenue growth above
      47%, 300-plus new customers, more than 90 legacy-cloud migrations, and continuing
      1,350-plus-brand positioning. Independent 2025 coverage sharpens the picture further:
      North America appears to account for at least 30% of revenue and may now be the largest
      region, enterprise buyers represent the majority of the mix, and ARR appears to have
      crossed or approached $100 million by late 2025. The important limitation is that these are
      all proxies. India-entity statutory revenue is visible through public database summaries of
      MCA filings, and headcount can be triangulated, but there is still no consolidated group
      revenue mix, no current margin disclosure, and no durable public KPI set comparable to a
      listed peer.
