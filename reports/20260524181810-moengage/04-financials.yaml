  - id: TI002
    title: Pricing and Billing Mechanics
    columns:
      - Pricing lever
      - What the sources say
      - Public source visibility
      - Financial implication
      - Caveat
    rows:
      -
        - Plan visibility
        - Growth and Enterprise are the named commercial tiers for the core platform.
        - Official plans page
        - Tiering supports enterprise packaging and upsell logic
        - No official public price card
      -
        - Subscription activation
        - Workspace activation uses a subscription code provided by a customer success manager.
        - Official docs and help center
        - Pricing comparison often occurs after sales engagement, not before
        - Opaque for outside underwriting
      -
        - MTU billing
        - MTUs are counted from App or Site Opened activity and reported monthly.
        - Official help center
        - Core pricing is usage-based rather than seat-based
        - Exact contract terms vary by customer
      -
        - Event FUP overage
        - If events exceed the contracted fair-usage average, billable MTUs can be recalculated as Events divided by FUP.
        - Official help center
        - High event intensity can lift realized billings without headline customer growth
        - FUP threshold is contract-specific
      -
        - Inform billing
        - Inform charges only for channels used and number of messages sent across Email, SMS, WhatsApp, and Push.
        - Official help center and product page
        - Transactional messaging can scale revenue with volume but also exposes channel-cost risk
        - Not enough public detail to separate platform fee from pass-through spend
      -
        - Sender and shortcode aggregation
        - Shared senders and shortcodes aggregate charges at the account level across workspaces.
        - Official help center
        - Invoices can run above workspace dashboards, raising overage risk
        - Depends on sender architecture
      -
        - Third-party price guides
        - ITQlick and CampaignHQ publish numeric price bands and hidden-cost assumptions.
        - Low-reputation third-party reviews
        - Shows why buyers search for pricing externally
        - Official MoEngage pages do not corroborate the quoted numbers
    notes: >
      The table deliberately separates official billing mechanics from unofficial numeric price
      guides. Public price points from review or competitor pages are treated as low-confidence
      directional signals, not authoritative list pricing.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI012
      - CI053
      - CI054
