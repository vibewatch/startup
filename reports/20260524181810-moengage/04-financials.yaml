  evidenceGaps:
    - type: missing-source
      severity: material
      topic: realized-pricing
      missingEvidence: Signed price sheets, anonymized order forms, discount schedules, and average contract values by plan and region.
      whyItMatters: Official pages reveal packaging and billing mechanics but do not show realized monetization, which blocks any reliable ARPU or revenue-quality model.
      diligencePath: Request recent enterprise order forms, plan comparison exports, and a cohort of closed-won contracts with discount fields.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: revenue-mix
      missingEvidence: Consolidated revenue mix across subscriptions, analytics, transactional messaging, services, and any channel pass-through revenue.
      whyItMatters: Without product-line mix, MoEngage cannot be underwritten on gross margin, durability, or revenue concentration.
      diligencePath: Request monthly P&L and revenue bridge by product, region, and direct versus pass-through revenue for FY2024 and FY2025.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: blocking
      topic: cash-runway
      missingEvidence: Current cash balance, debt facilities, covenant package, monthly burn, and runway months.
      whyItMatters: Series F headlines do not reveal how much liquidity remains after secondaries, reverse-flip costs, hiring, and M&A ambitions.
      diligencePath: Request the latest board cash report, debt schedule, 13-week cash flow, and management runway scenarios.
      relatedQuestionRefs: [QI026]
      relatedTableRefs: [TI004]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Cap table math, latest preferred share price, and management’s own post-money valuation calculation from the 2025 financing.
      whyItMatters: Public valuation references span roughly $750 million to $1.1 billion, which is too wide for a credible public mark.
      diligencePath: Request financing documents, valuation memo, and any 409A or board-approved fair-value materials.
      relatedQuestionRefs: [QI029]
    - type: conflicting-data
      severity: material
      topic: total-funding
      missingEvidence: Authoritative lifetime financing ledger separating primary capital, secondary transfers, employee tenders, and any recycled insider capital.
      whyItMatters: Public sources range from an official “exceeds $250 million” statement to database totals near $487 million, creating avoidable underwriting noise.
      diligencePath: Request a financing history schedule tied to the cap table and the closing funds-flow for every major round.
      relatedQuestionRefs: [QI030]
      relatedTableRefs: [TI004]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Current gross margin, CAC, payback, churn, net dollar retention, and sales-cycle data for the live business.
      whyItMatters: These are the metrics that determine whether MTU and message growth convert into durable enterprise software economics.
      diligencePath: Request finance KPI dashboards, cohort retention tables, sales pipeline conversion data, and channel-cost waterfalls.
      relatedQuestionRefs: [QI021, QI023]
      relatedTableRefs: [TI003]
    - type: access-blocked
      severity: minor
      topic: statutory-filings
      missingEvidence: Direct MCA financial statement pack and the underlying NCLT order PDF rather than public summaries or database transcriptions.
      whyItMatters: Public summaries expose only selected fields and may omit consolidation scope, footnotes, related-party balances, or exact order language.
      diligencePath: Buy MCA filings, download the tribunal order, and reconcile Indian-entity accounts to any group-level management statements.
      relatedQuestionRefs: [QI019, QI031]
