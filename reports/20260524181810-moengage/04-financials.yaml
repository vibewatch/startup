  - id: TI004
    title: Capital Adequacy and Financing Lens
    columns:
      - Capital item
      - Public signal
      - Confidence
      - Why it matters
      - Implication for adequacy
    rows:
      -
        - November 2025 financing
        - $100M led by Goldman Sachs Alternatives and A91 Partners
        - High
        - Shows continued investor support and renewed late-stage appetite
        - Improves flexibility but not enough by itself to infer runway
      -
        - December 2025 financing extension
        - $180M additional, taking Series F to $280M
        - High
        - Confirms access to sizable external capital weeks after the first tranche
        - Strengthens balance-sheet optics and strategic optionality
      -
        - Fresh capital versus liquidity
        - Independent reports say the December tranche was about $57M primary and $123M secondary; November was roughly 60% primary and 40% secondary
        - Medium
        - Headline funding overstates cash that actually entered operations
        - Balance-sheet benefit is materially lower than the round headline
      -
        - Employee and early-investor liquidity
        - Official materials say a $15M tender benefited 259 current and former employees
        - High
        - Signals a maturing cap table and partial de-risking for insiders
        - Good for retention, but not operating runway
      -
        - Use of funds
        - Official use-of-proceeds language centers on AI, GTM hiring, Inform and Analytics expansion, and strategic acquisitions
        - High
        - Capital is being deployed into product and growth rather than emergency liquidity
        - Future burn could stay elevated despite strong fundraising
      -
        - Reverse flip and IPO preparation
        - Moneycontrol and ET tie the reverse flip to potential IPO readiness and possible tax outlays
        - Low to medium
        - Structural simplification can help future listing readiness
        - Could absorb part of fresh primary capital
      -
        - Lifetime funding
        - Official company statement only says total funding exceeds $250M, while databases list much higher totals
        - Medium
        - Prevents a clean view of cumulative capital absorbed to date
        - Raises caution when estimating dilution and funding efficiency
      -
        - Cash and runway
        - No current cash, debt, or runway disclosure was found
        - Medium
        - Without this, capital adequacy remains a judgment call rather than a model
        - Underwriting still needs management-only evidence
    notes: >
      This table focuses on forward adequacy rather than repeating the full historical round
      chronology. Fresh capital and secondary liquidity are separated because only primary proceeds
      strengthen operating liquidity.
    claimRefs:
