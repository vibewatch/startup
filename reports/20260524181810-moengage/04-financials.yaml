  - id: TI003
    title: Public Unit-Economics and Operating Proxies
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      -
        - ARR scale
        - Crossed or tracking toward $100M by late 2025 in TechCrunch and ET; official pages do not publish a current number
        - Medium
        - Shows late-stage SaaS scale if accurate
        - Request board-approved ARR bridge and current ARR definition
      -
        - Net revenue retention
        - 136% in 2022 CEO letter; >135% in 2022 Series E release; +8 percentage-point improvement in 2024 wrap-up
        - Medium
        - Suggests expansion quality but all references are historical or company-claimed
        - Request current net dollar retention by cohort and region
      -
        - Burn discipline
        - 2022 CEO letter said burn multiple stayed below 1x during the scale-up
        - Medium
        - A rare positive capital-efficiency signal for a private SaaS company
        - Request current burn multiple, operating cash flow, and scenario sensitivities
      -
        - Quarterly revenue growth
        - 2024 wrap-up said quarterly revenue grew >47% YoY
        - Medium
        - Confirms growth momentum but not absolute revenue scale
        - Request audited quarterly P&L and bookings bridge
      -
        - Statutory Indian-entity revenue
        - ₹352Cr for FY2025 in Tracxn’s MCA-linked summary; ₹311.5Cr FY2024 in Inc42
        - Medium to low
        - Useful floor for entity-level operations but not a clean consolidated figure
        - Request group consolidation scope and intercompany eliminations
      -
        - Headcount snapshots
        - 649 on Tracxn legal-entity page, about 800 in late-2025 reporting, 898 on Inc42 profile
        - Low to medium
        - Headcount is a cost-base and capacity proxy, but public snapshots conflict materially
        - Request org chart and monthly headcount by function
      -
        - Profitability signal
        - ET reported ARR >$100M and near-term EBITDA positivity, but no public margin stack exists
        - Medium
        - Could signal operating leverage if management is accurate
        - Request EBITDA bridge and GAAP to management reconciliation
      -
        - Gross margin, CAC, and payback
        - No public disclosure found; Braze comp suggests the right metrics but not MoEngage’s actual answers
        - Medium
        - This is the main blocker to underwriting revenue quality
        - Request gross-margin waterfall, CAC payback, and sales-cycle metrics
    notes: >
      Null-like rows here reflect genuine public disclosure gaps rather than zero values. The table
      mixes company-claimed and independent proxy data to show what can and cannot be underwritten
      from public evidence.
