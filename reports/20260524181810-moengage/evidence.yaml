evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: lifetime-capital
    missingEvidence: >-
      A cap-table backed funding history that reconciles the company-linked >$250M figure with third-party totals
      ranging from about $295M to $487M.
    whyItMatters: >-
      Unreconciled lifetime capital makes dilution, ownership concentration, and capital efficiency difficult to
      underwrite.
    diligencePath: >-
      Request the board-approved financing history, cap table, and round-by-round primary versus secondary breakout from
      management.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A term sheet, investor letter, or cap-table support for the current post-money valuation.
    whyItMatters: Only one fetched article reports an $850M post-money valuation, which is too thin to treat as canonical.
    diligencePath: >-
      Request the most recent financing deck, signed term sheet, or board materials showing valuation and liquidation
      preferences.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: workforce
    missingEvidence: >-
      A current employee and office roster that reconciles the public 700+, ~800, 887, and 898 figures and the
      15/16/17-location claims.
    whyItMatters: Headcount and office sprawl are core inputs to burn, execution capacity, and regional operating leverage.
    diligencePath: >-
      Request a current HR dashboard export with active headcount by function and location plus an office lease/sublease
      list.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A public or private board roster with investor representation, observer rights, and reserved matters.
    whyItMatters: Control dynamics matter for IPO timing, follow-on financing, acquisition optionality, and founder dependence.
    diligencePath: Request the current board deck cover, shareholder agreement summary, and investor rights schedule.
    relatedQuestionRefs:
      - QO007
      - QO030
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current consolidated revenue, ARR, gross margin, and cash-burn metrics for the global business.
    whyItMatters: >-
      Historical ARR growth and one Indian-entity revenue figure do not substitute for a current company-level operating
      snapshot.
    diligencePath: >-
      Request the latest management accounts, board KPI pack, and geography-level revenue bridge for the last twelve
      months.
    relatedQuestionRefs:
      - QO029
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: >-
      A fuller dated chronology covering non-public board events, customer launches, and any adverse milestones omitted
      from the public record.
    whyItMatters: >-
      The milestone table is intentionally partial because public sources do not expose every internal launch,
      governance, or customer milestone that may matter later.
    diligencePath: >-
      Request a management-prepared company timeline and cross-check it against board minutes, financing memos, and
      launch calendars.
    relatedQuestionRefs:
      - QO020
      - QO024
      - QO027
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      A vendor-neutral 2026 software-only SAM for enterprise omnichannel engagement that excludes services and message
      pass-through fees.
    whyItMatters: >-
      Public reports mix software, services, and adjacent data layers, which can materially overstate or understate the
      budget MoEngage can realistically win.
    diligencePath: >-
      Obtain paid analyst reports or internal cohort-level pipeline data that split software subscription revenue from
      services and channel passthrough by customer segment.
    relatedQuestionRefs:
      - QM031
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Publicly reliable enterprise contract values, gross margins, and channel-mix economics for independent engagement
      platforms.
    whyItMatters: >-
      Without internal pricing, gross-margin, and cohort-retention data, public market growth says little about the
      quality of revenue available to MoEngage.
    diligencePath: >-
      Request internal pricing sheets, channel cost pass-through assumptions, gross-margin bridges, and win-loss data by
      deployment model and geography.
    relatedQuestionRefs:
      - QM032
    relatedTableRefs:
      - TM006
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Current competitive win-loss, churn, and migration-success data for MoEngage versus Braze, CleverTap, Insider,
      Iterable, WebEngage, and suite incumbents.
    whyItMatters: >-
      Public product pages and review sites show positioning and pain points, but they do not reveal whether MoEngage is
      actually winning, retaining, or displacing the right customers at scale.
    diligencePath: >-
      Request management win-loss analysis, cohort retention by segment, migration case studies, and named displacement
