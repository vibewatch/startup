- id: funding-history-and-capital-base
  title: Funding History, Investor Base, and Valuation Ambiguity
  body: 'MoEngage’s funding history shows a company that accelerated quickly from growth-stage martech into a late-stage private capital structure. Publicly visible history includes a June 2022 Series E of $77 million led by Goldman Sachs Asset Management and B Capital, on top of two 2021 rounds cited in the same announcement. The capital story then steps up sharply in late 2025: a $100 million round led by Goldman Sachs Alternatives and A91 Partners in November, followed by an additional $180 million in December led by ChrysCapital and Dragon Funds, bringing disclosed Series F financing to $280 million. The December financing also included secondaries and employee liquidity, which matters because it signals a maturing cap table rather than a purely primary-growth round. The harder question is total raised and valuation. Company-linked materials say total funding exceeded $250 million, while Tracxn, CB Insights, and Inc42 list materially different totals. ETtech gives a single-source $850
    million post-money valuation, but no filing or company document in the fetched corpus corroborates it. That leaves MoEngage looking well funded, but not yet cleanly priced from public evidence alone.'
