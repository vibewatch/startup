- id: scale-product-and-milestones
  title: Scale Signals, Product Milestones, and Strategic Trajectory
  body: 'The public milestone record is stronger on product cadence and customer proof than on audited financial disclosure. SoundCloud’s migration is the clearest outside validation point: more than 200 live campaigns and 100 million users moved in 12 weeks, which suggests MoEngage can replace incumbent marketing-cloud tooling at scale. Company materials also say more than 300 enterprises have moved onto the platform, and TechCrunch adds that roughly 60% of business now comes from traditional enterprises, with North America generating more than 30% of revenue. On product, the company’s 2026 materials heavily emphasize Merlin AI, custom agents, native agents, and an AI connector, reinforcing the thesis that MoEngage is trying to reposition from a marketing-automation vendor into an AI-led customer-engagement operating layer. Recognition claims from Gartner Peer Insights and Forrester support that repositioning, but they still remain company-curated validation rather than audited operating
    proof. The January 2026 NCLT-approved reverse merger adds another major milestone because it connects product and market progress to a more concrete capital-markets narrative: MoEngage is not just expanding globally, it is also simplifying structure for a possible India listing.'
