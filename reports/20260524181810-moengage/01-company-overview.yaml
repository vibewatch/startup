  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: lifetime-capital
    missingEvidence: A cap-table backed funding history that reconciles the company-linked >$250M figure with third-party totals ranging from about $295M to $487M.
    whyItMatters: Unreconciled lifetime capital makes dilution, ownership concentration, and capital efficiency difficult to underwrite.
    diligencePath: Request the board-approved financing history, cap table, and round-by-round primary versus secondary breakout from management.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A term sheet, investor letter, or cap-table support for the current post-money valuation.
    whyItMatters: Only one fetched article reports an $850M post-money valuation, which is too thin to treat as canonical.
    diligencePath: Request the most recent financing deck, signed term sheet, or board materials showing valuation and liquidation preferences.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - type: conflicting-data
    severity: material
    topic: workforce
    missingEvidence: A current employee and office roster that reconciles the public 700+, ~800, 887, and 898 figures and the 15/16/17-location claims.
    whyItMatters: Headcount and office sprawl are core inputs to burn, execution capacity, and regional operating leverage.
    diligencePath: Request a current HR dashboard export with active headcount by function and location plus an office lease/sublease list.
    relatedQuestionRefs:
    - QO017
    - QO018
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A public or private board roster with investor representation, observer rights, and reserved matters.
    whyItMatters: Control dynamics matter for IPO timing, follow-on financing, acquisition optionality, and founder dependence.
    diligencePath: Request the current board deck cover, shareholder agreement summary, and investor rights schedule.
    relatedQuestionRefs:
    - QO007
    - QO030
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current consolidated revenue, ARR, gross margin, and cash-burn metrics for the global business.
    whyItMatters: Historical ARR growth and one Indian-entity revenue figure do not substitute for a current company-level operating snapshot.
    diligencePath: Request the latest management accounts, board KPI pack, and geography-level revenue bridge for the last twelve months.
    relatedQuestionRefs:
    - QO029
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A fuller dated chronology covering non-public board events, customer launches, and any adverse milestones omitted from the public record.
    whyItMatters: The milestone table is intentionally partial because public sources do not expose every internal launch, governance, or customer milestone that may matter later.
    diligencePath: Request a management-prepared company timeline and cross-check it against board minutes, financing memos, and launch calendars.
    relatedQuestionRefs:
    - QO020
    - QO024
    - QO027
    relatedTableRefs:
    - TO004
