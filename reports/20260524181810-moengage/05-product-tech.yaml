- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - What it does
  - Implementation surface
  - Differentiation / maturity
  - Diligence gap
  rows:
  - - Customer insights & analytics
    - Lifecycle marketer; product analyst
    - Behavior, funnel, retention, and campaign analysis from one dashboard
    - Analyze docs plus campaign stats surfaces
    - Core module with explicit counting guidance and dashboard-native AI analysis hooks
    - No public breakdown of how many customers license advanced analytics or use it as system of record
  - - Cross-channel marketing / Flows
    - CRM operator; lifecycle team
    - Build journeys, segments, and delivery logic across owned channels
    - Dashboard flows, campaigns, segmentation, and partner-fed user data
    - Broad suite positioning across eleven channels increases bundle power
    - No public module attach or journey-volume benchmarks by customer segment
  - - Web & App Personalize
    - Growth PM; ecommerce or web owner
    - Fetch server-side experiences and render targeted content, recommendations, or pricing
    - Personalize APIs plus SDK event-reporting paths and CSP configuration
    - Clear technical docs and 2026 package releases show active productization
    - Public docs do not quantify conversion lift or attach by module
  - - Inform transactional alerts
    - Product ops; support or trust workflow owner
    - Send critical alerts through one API across one or more channels
    - Inform API with live/test endpoints, retries, and alert templates
    - Distinct transactional layer separates operational alerts from promotional campaigns
    - Module-level SLA schedules, vendor fallback detail, and throughput evidence remain unpublished
  - - AI / experimentation layer
    - Campaign analyst; growth lead
    - Run A/B or multivariate tests and ask Merlin AI to analyze or optimize performance
    - A/B testing docs, Campaign Insights Agent, and 2026 release notes
    - AI is embedded into analytics and experimentation rather than sold as a separate point tool
    - The strongest AI surfaces are still early access or documentation-led rather than independently benchmarked
  notes: Rows summarize public module surfaces and implementation clues; gaps remain where public sources do not show attach, usage, or independent benchmark evidence.
