chapter:
  number: 5
  title: Product & Technology
  summary: MoEngage exposes a broad, well-documented customer engagement stack covering analytics, journeys, personalization, transactional alerts, and AI-assisted optimization across multiple SDK and partner surfaces. The 2026 evidence base shows active release cadence and mature security documentation, but it also shows that product value depends heavily on first-party data quality, integration discipline, and operational controls such as CSP, consent, regional routing, and incident response.
sections:
- id: platform-modules-and-customer-jobs
  title: Platform Modules and Customer Jobs
  body: 'MoEngage’s public product definition is consistent with earlier chapters: it is not just a messaging relay but an insights-led customer engagement platform that combines data understanding, cross-channel orchestration, personalization, and transactional infrastructure in one operating surface. The product page and documentation repo show a module map that spans Analyze, Segment, Flows, Personalize, Decisioning, Inform, and broad channel execution. That breadth matters because the primary user is not only a campaign manager. Product marketers, lifecycle teams, CRM operators, and product teams all interact with the same system to move from audience understanding to delivery and measurement. The platform narrative also stresses eleven channels and named surfaces such as email, SMS, WhatsApp, cards, on-site messages, and RCS. In underwriting terms, MoEngage sells a broad engagement control plane, but the trade-off is that implementation quality depends on how much of that stack a customer
    actually activates rather than merely licenses.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE010
  - CE041
