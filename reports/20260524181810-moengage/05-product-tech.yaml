- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Public evidence
  - Role in system
  - Key dependency
  - Risk / implementation note
  rows:
  - - Regional routing layer
    - DC-specific dashboard and API hosts plus SDK data-center enums
    - Keeps workspace traffic pinned to the intended regional cluster
    - Correct data-center selection in API and SDK configuration
    - Wrong cluster mapping can break routing, privacy posture, or allowlisting assumptions
  - - Auth and API control plane
    - Basic Auth using workspace_id:api_key plus feature-specific keys
    - Controls access to data, campaigns, personalize, and messaging APIs
    - Operational key management and rotation
    - Feature-specific keys and rate limits create operational overhead for multi-surface deployments
  - - Mobile SDK bootstrapping
    - Android and iOS init objects require workspace IDs and app config in app startup code
    - Connects application lifecycle, push, in-app, cards, and geofence modules
    - Native app release process and environment-specific config
    - MoEngage has deprecated older Android manifest patterns and continues to evolve native setup expectations
  - - Web personalization and CSP layer
    - Web SDK nonce support and Personalize allowlist requirements
    - Lets web experiences render OSM, Cards, and Personalize safely under strict CSP
    - Customer control over script-src, style-src, connect-src, frame-src, and related directives
    - Misconfigured CSP can suppress personalization without obvious business-user visibility
  - - Partner / CDP connectors
    - Segment and mParticle docs enumerate device-mode, cloud-mode, event, identity, and consent paths
    - Feeds MoEngage with customer data and extends orchestration into broader stacks
    - Connector mode, known identifiers, and consent-state propagation
    - Cloud-mode or incomplete identity wiring can reduce push, in-app, or anonymous-user utility
  - - Versioning and package management
    - Android BOM/catalog, CocoaPods, npm, pub.dev, and Maven artifacts all publish active packages
    - Coordinates SDK compatibility across native and hybrid stacks
    - Customer discipline on dependency upgrades and build-tool versions
    - Fast release cadence improves feature velocity but increases version-management burden
  notes: Rows describe the public operating stack rather than an internal service diagram; architecture inferences come from API, SDK, package, and partner documentation.
