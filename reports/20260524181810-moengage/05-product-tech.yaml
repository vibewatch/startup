  claims:
  - id: CE001
    statement: MoEngage positions its product as an insights-led customer engagement platform operated from a single dashboard.
    type: company-claimed
    topic: platform-definition
    sourceRefs:
    - SE001
    - SE004
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE029
  - id: CE002
    statement: Public MoEngage surfaces package analytics, cross-channel marketing, personalization, and Inform as part of one engagement stack.
    type: company-claimed
    topic: module-map
    sourceRefs:
    - SE001
    - SE023
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE002
  - id: CE003
    statement: The product overview says MoEngage helps teams build journeys across eleven channels.
    type: company-claimed
    topic: channel-breadth
    sourceRefs:
    - SE001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE003
  - id: CE004
    statement: MoEngage names email, SMS, in-app messaging, digital advertising, content cards, on-site messaging, RCS, and WhatsApp among its public engagement surfaces.
    type: company-claimed
    topic: channel-breadth
    sourceRefs:
    - SE001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE003
  - id: CE005
    statement: The official documentation repo groups MoEngage into Flows, Analyze, Segment, Content, Intelligence, Personalize, Decisioning, and Inform domains.
    type: company-claimed
    topic: module-map
    sourceRefs:
    - SE023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
    - QE011
  - id: CE006
    statement: MoEngage API docs are organized around Data, Campaigns, Content, Segments, Messaging, Subscriptions, Personalize, Compliance, and Business Events.
    type: company-claimed
    topic: api-surface
    sourceRefs:
    - SE005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE004
    - QE009
  - id: CE007
    statement: Inform sends transactional alerts to a user on one or more channels using a pre-configured Alert ID or Alert Reference Name.
    type: company-claimed
    topic: inform
    sourceRefs:
    - SE006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE005
  - id: CE008
    statement: Inform documentation lists order confirmations, shipping updates, security alerts, password resets, OTP, invitations, user inaction, and fraud prevention as supported transactional-alert scenarios.
    type: company-claimed
    topic: inform
    sourceRefs:
    - SE006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE005
  - id: CE009
    statement: Inform uses separate live and sandbox endpoints, retries vendor-unavailable requests up to five times with 200ms exponential backoff, and stores alert logs for up to 30 days.
    type: company-claimed
    topic: inform
    sourceRefs:
    - SE006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE005
  - id: CE010
    statement: Personalize is a server-side API suite invoked inside the customer rendering pipeline to return tailored banners, recommendations, pricing, or other experience payloads.
    type: company-claimed
    topic: personalize
    sourceRefs:
    - SE007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE006
  - id: CE011
    statement: Personalize exposes fetch-experience, metadata, and event-reporting flows and can report impressions and clicks through APIs or platform SDKs.
    type: company-claimed
    topic: personalize
    sourceRefs:
    - SE007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE006
    - QE007
  - id: CE012
    statement: MoEngage experimentation supports both manual user splits and Merlin AI-driven dynamic distribution, and the docs recommend at least 5,000 users per variation with click rate as a key content-test metric.
    type: company-claimed
    topic: experimentation
    sourceRefs:
    - SE008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE011
    - QE012
  - id: CE013
    statement: Campaign Insights Agent is documented as an early-access conversational assistant embedded in the campaign analytics page.
    type: company-claimed
    topic: merlin-ai
    sourceRefs:
    - SE009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE013
    - QE014
  - id: CE014
    statement: Campaign Insights Agent uses workspace-specific history and delegates complex analysis to Analyzer, Diagnostics, Comparator, and Reporter agents, and it currently supports one-time or periodic Email and Push campaigns.
    type: company-claimed
    topic: merlin-ai
    sourceRefs:
    - SE009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE012
    - QE013
    - QE014
  - id: CE015
    statement: MoEngage documentation says Analytics, Segmentation, Campaign stats, and Flows can disagree because they mix total-event, unique-user, and unique-trip methodologies, and campaign stats run in UTC while Analyze uses the app time zone.
    type: company-claimed
    topic: analytics
    sourceRefs:
    - SE010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE010
  - id: CE016
    statement: MoEngage has deprecated Android manifest-metadata integration in favor of code-based initialization in Application.onCreate.
    type: company-claimed
    topic: android-sdk
    sourceRefs:
    - SE017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE025
  - id: CE017
    statement: The Android SDK requires explicit data-center configuration and maps DATA_CENTER_1 through DATA_CENTER_5 to dashboard hosts 01 through 05.
    type: company-claimed
    topic: data-centers
    sourceRefs:
    - SE011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE007
    - QE008
  - id: CE018
    statement: The iOS SDK exposes data_center_01 through data_center_06 with corresponding SDK and dashboard hosts, and data_center_06 is available from SDK version 9.17.3.
    type: company-claimed
    topic: data-centers
    sourceRefs:
    - SE012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE007
    - QE008
  - id: CE019
    statement: MoEngage API docs map DC-01, 02, 03, 04, 05, 06, and 101 to distinct dashboard and API hosts and require Basic Authentication using workspace_id:api_key credentials.
    type: company-claimed
    topic: api-operations
    sourceRefs:
    - SE005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE008
    - QE009
  - id: CE020
    statement: Strict CSP settings can block on-site messaging, web personalization, and cards unless MoEngage nonce support is configured, and the nonce feature is documented for NPM, GTM, and Flutter Web.
    type: company-claimed
    topic: web-security
    sourceRefs:
    - SE013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE022
  - id: CE021
    statement: MoEngage Personalize requires CSP allowlists that include *.moengage.com and related assets or browsers may reject variations before they render.
    type: company-claimed
    topic: web-security
    sourceRefs:
    - SE015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE022
  - id: CE022
