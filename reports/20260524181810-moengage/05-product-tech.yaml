  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Module-level attach, customer-level activation rates, and usage depth for Analytics, Flows, Personalize, and Inform.
    whyItMatters: Broad module menus do not prove that customers deploy multiple products deeply enough to create durable expansion revenue or switching costs.
    diligencePath: Request 12-month module attach, activation, and expansion cohorts by customer segment and by module.
    relatedQuestionRefs:
    - QE030
  - type: missing-source
    severity: material
    topic: sla-evidence
    missingEvidence: Module-specific SLA schedules, service-credit terms, incident logs, and fallback architecture evidence for Inform, personalization, and campaign delivery.
    whyItMatters: The chapter can cite marketing reliability claims and one public incident, but it still cannot underwrite module-level operational resilience with confidence.
    diligencePath: Request customer SLA templates, 12-month incident history, postmortems, and vendor-failover design documents for core delivery surfaces.
    relatedQuestionRefs:
    - QE031
  - type: access-blocked
    severity: minor
    topic: audit-artifacts
    missingEvidence: Downloadable audit reports, trust-center artifact packs, and data-center-specific control mappings for MoEngage compliance claims.
    whyItMatters: Listed certifications are directionally useful, but diligence still needs scoped reports and regional control evidence before treating the trust posture as fully verified.
    diligencePath: Request trust-center access, latest SOC and ISO report letters, data-processing addenda, and region-specific control matrices from the security team.
    relatedQuestionRefs:
    - QE032
    relatedTableRefs:
    - TE004
