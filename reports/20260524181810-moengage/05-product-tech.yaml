- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status / evidence
  - Scope
  - Strength
  - Gap / limitation
  rows:
  - - Compliance claims
    - HIPAA, GDPR, CCPA, CSA STAR, SOC 2 Type 2, ISO 27001, ISO 22301, ISO 27701, and Philippines NPC
    - Platform-wide trust positioning
    - Breadth of listed controls is broad for an engagement platform
    - Public chapter evidence does not include downloadable audit packets or scoped exceptions
  - - BYOK field encryption
    - Customer-provided-key and cross-account KMS variants with envelope encryption
    - PII field protection and key custody
    - Docs explain key model, cache behavior, and operational steps in detail
    - AWS KMS only; rotation is manual; historical data is not retroactively encrypted
  - - Regional data-center posture
    - US, Europe, India, and Indonesia centers plus SDK/API routing guidance
    - Data residency and cluster selection
    - Concrete control surface across APIs and SDKs
    - Public docs do not expose per-region audit packs or service-metric disclosures
  - - Web security hardening
    - CSP nonce support and allowlists for Personalize, OSM, and Cards
    - Website deployments with strict browser policies
    - Shows product team has documented secure-deployment friction points
    - Customer engineering teams still have to implement and verify the policy correctly
  - - Privacy and disclosure guidance
    - Android disclosure page lists automatic and optional data classes tied to consent
    - Mobile SDK use in regulated app-store contexts
    - Helps customers complete Google Play Data Safety reporting
    - Developer remains solely responsible for final disclosure answers and consent handling
  - - Reliability and external monitoring
    - Status page plus UpGuard vendor monitoring surface
    - Operational transparency and third-party trust signal
    - There is at least some public incident and monitoring visibility
    - Status history and vendor monitoring are still weaker than audited SLA packets or long-horizon availability reporting
  notes: This table separates public trust signals from the evidence still missing for full diligence, especially audit artifacts, region-specific control detail, and long-horizon service metrics.
