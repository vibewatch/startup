        - 创建分群、cohort 和营销活动准入逻辑
        - 分群、营销活动和决策类文档
        - 文档仓库分类图和分析计数说明
        - 公开文档未显示有多少客户大规模运行高级分群或 cohort 同步
      - - 发布情境化旅程
        - 配置一次性、周期性或基于 Flow 的生命周期消息
        - 跨渠道营销、Flows 和投递控制
        - 产品概览，以及 AI 和分析文档
        - 各模块的运行口径不同，因为营销活动统计和 Flow 指标采用不同计数方法
      - - 渲染个性化内容
        - 调用服务端 API 或 SDK 获取变体，并上报展示 / 点击
        - Personalize API 套件和平台 SDK 事件上报
        - Personalize 概览和 CSP 文档
