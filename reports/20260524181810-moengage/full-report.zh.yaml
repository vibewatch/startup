      - number: '3.2'
        title: 能力趋同与企业适配
        blocks:
          - type: paragraph
            body: >-
              同业能力宽度已经足够大，“全渠道”本身不构成护城河。Braze、CleverTap、Insider、Iterable、WebEngage、Netcore、Salesforce 和 Adobe
              都在营销某种统一数据、旅程编排、AI 或智能体决策、分析和跨渠道执行组合。实际差异在深度和运营姿态。Braze 把强产品宽度、上市公司规模、深度集成和明确企业包装放在一起。Salesforce 和 Adobe
              把编排接到庞大套件足迹上；当买方已经依赖它们的 CRM、数据或体验云层时，它们尤其强。CleverTap 和 MoEngage
              更像直接的移动优先同业，因为两者都组合了分析、个性化、编排和公开可见的入门包装。Insider 和 WebEngage 强调跨渠道覆盖、集成和迁移叙事；Iterable 强调企业级实时决策，但价格仍不透明。对
              MoEngage 来说，赢单取决于证明更快 time-to-value 和更容易的日常使用，而不是声称自己有独一无二的宽功能面。
