            - 说明资产负债表得到有意义但非无限度的补强
            - 精确资金流备忘录未公开
            - 充足性取决于该轮有多少是真正进入经营的现金
        - label: 募资用途
          values:
            - AI、GTM 招聘、Inform 与 Analytics 扩张，以及战略收购
