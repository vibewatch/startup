  - id: FM003
    title: 企业采购与采用流程
    type: flow
    layout: standard
    summary: 示意企业从数据和渠道痛点走向规模化部署的路径；在这个市场里，合规和集成如今决定 ROI 能否兑现。
    data:
      nodes:
        - id: pain
          label: 数据或渠道痛点出现
          detail: 团队发现活动过于泛化、响应处理弱，或渠道成本和送达率摩擦上升。
        - id: data
          label: 数据基础审查
          detail: 买方在选择执行工具之前，会评估身份、数仓、CDP 与服务数据的连接性。
        - id: pilot
          label: 编排试点
          detail: 供应商会在一个或多个自有渠道上接受测试，要求真实处理抑制、分群和衡量。
        - id: compliance
          label: 合规与经济性关口
          detail: 法务、送达率和渠道定价约束会被纳入审查，覆盖 Gmail、Apple、WhatsApp 等触点。
        - id: rollout
          label: 规模化铺开或整合
          detail: 买方要么把平台扩展到更多渠道，要么把它纳入更大的整合决策。
      edges:
        - from: pain
          to: data
          label: 需要相关性和上下文
