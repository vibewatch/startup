chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              MoEngage
              一直被呈现为一家客户互动软件公司，但它对外投射的具体身份会影响后续尽调判断。官网页面把它描述为面向营销人员和产品负责人的跨渠道平台，产品页面再拆成分析、旅程编排、个性化和交易型消息。这更像一家晚期企业软件公司，而不是代理商或单点工具。总部叙事没有那么干净。联系页面以
              San Francisco 开头，公开数据库也使用 San Francisco；但 2025 年底和 2026 年初的公司材料又把业务描述为总部位于 Bengaluru 和 San
              Francisco。最合理的解释是，MoEngage 仍以美国—印度双重身份运营，同时为法律结构和资本市场重心向印度迁移做准备。公开规模口径方向上很强，但没有标准化：不同页面分别引用 60 或 75
              个国家、每月触达 1.6 到 2.0 billion 名消费者，以及多组不同的消息量指标。这些不一致很重要，因为它们让公司从外部看起来更大，却还不能被干净计量。
