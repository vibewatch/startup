              MoEngage 的公开材料显示业务已有真实规模，但披露方式是碎片，而不是投资级财务包。历史官方材料显示 ARR 至少翻倍、NRR 超过 135%，并在 2022 年扩张期提出 burn multiple 低于
              1x。更新的公司页面补充了 2024 年季度收入增长超过 47%、新增客户 300 多家、超过 90 起 legacy-cloud 迁移，以及继续以 1,350 多个品牌定位。独立 2025
              年报道让图景更清晰：北美看起来至少贡献 30% 收入，并且现在可能已是最大区域；企业买方占组合多数；到 2025 年底，ARR 看起来已经越过或接近 $100
