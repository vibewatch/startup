  - id: TV001
    title: 建议摘要表
    columns:
      - 视角
      - 当前判断
      - 公开依据
      - 决策含义
      - 改变判断的条件
    rows:
      - - 投资建议
        - 继续研究
        - 公司质地看起来说得通，但价格支撑还达不到公开市场级证据
        - 不能只靠媒体披露的估值支撑买入结论
        - 只有披露审计后经济指标和股权结构细节，才可上调
      - - 置信度
        - 中
        - 证据方向清楚，但精度不足
        - 用区间和关卡，不设单一点目标
        - 审计后的 ARR/收入、利润率和留存数据会提高置信度
      - - 风险评级
        - 高
        - 多项判断依赖隐藏输入，2026 年软件市场也更难
        - 要求下行保护和刚性尽调里程碑
        - 如果 MoEngage 证明利润率、留存可持续，且股权优先级干净，风险会下降
      - - 估值立场
        - 按报道的 2025 年末估值看偏高
        - 隐含 8.5x 至 11x ARR，高于 2026 年公开市场大盘中位数和可见同业估值
        - 没有溢价证据，不要按报道轮次价格付款
        - 若入场价显著低于报道区间，或尽调证明存在溢价经济性，立场才会改善
      - - 可能退出路径
        - 私下资本重组、战略出售，或后续 IPO 可选性
        - 反向翻转和持续融资保留了几条路径，但目前都没有公开定价
        - 先按私下退出建模，再考虑公开市场重估
        - 如果 MoEngage 开始发布上市公司级报告，并拿出 IPO 准备度证据，判断会改变
    notes: 仅作决策摘要；它把本章证据转成当前立场、价格纪律，以及改变判断所需证据。
