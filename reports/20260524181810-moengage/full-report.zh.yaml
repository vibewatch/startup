            body: >-
              MoEngage 最直接的失效模式是实际配置错误，而不是抽象合规理论。MoEngage 的产品栈位于 SMS、email、push 和 WhatsApp 交付界面前面，因此客户必须正确管理
              opt-in、opt-out、撤回处理、模板审批、应用商店披露和敏感数据披露。MoEngage 通过 tokenized
              sending、encryption、BYOK、访问控制指导和特定渠道合规文档提供帮助。即便如此，平台仍继承来自 Google Play、Apple、Gmail 和 WhatsApp
              的下游政策风险；这些平台都可能对 App 和活动施加拒绝、限流或披露义务。运营上，公开状态页显示 MoEngage
              会暴露事故，但独立评价证据仍指向分析、分群和留存摩擦。这个组合意味着运营风险不只是数据泄露风险，也包括合规漂移、消息失败，以及设置或交付假设错误时客户受挫。
