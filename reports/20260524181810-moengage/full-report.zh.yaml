        - CMO、CRM 或 CX 负责人，企业级部署还需要 IT
        - 最接近 MoEngage 的宽口径公开品类，但仍混合软件和服务
      - - 全渠道客户互动
        - 与 CDP 或 CRM 连接的平台、活动编排、会话式互动、移动或数字消息、社交互动管理和互动分析
        - 独立 CRM 记录系统和媒体采购平台
        - 生命周期营销、CRM 和客户运营负责人
        - 对 MoEngage 有用的边界，因为它同时覆盖跨渠道执行和分析
      - - 营销自动化软件
        - 活动管理、分析和报告、获客线索生成、内容管理，以及移动、社交和网页编排
        - 呼叫中心工作流、部分 CDP 身份功能和转嫁型渠道费用
        - 营销运营和增长团队
        - 即便客户互动被更窄定义，也能覆盖相邻竞争预算
      - - 客户数据平台
        - 身份解析、统一画像、受众构建、实时激活和数据共享基础设施
        - 创意生产、渠道投放本身和核心广告库存
        - 数据平台负责人、CRM 负责人、CDO 或 CIO
        - 关键相邻领域，因为个性化和编排越来越依赖第一方数据管道
      - - 渠道触达层
        - 邮件、推送、SMS、RCS 和 WhatsApp 执行，与旅程和模板绑定
        - 应用商店费用、平台计费之外的电信运营商经济性和通用云基础设施
        - 留存营销或通信运营
        - MoEngage 直接触达这一层，但渠道规则和定价变复杂后，价值会转向编排
    notes: 分析机构对品类边界的划分差异很大；各行展示公开定义如何重叠，而不是互斥的预算桶。
