  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性 EV 区间
      - 回报逻辑
      - 概率信号
      - 关键失败模式
    rows:
      - - 悲观
        - 公开可比和板块压缩占主导，当前 ARR 质量弱于隐含水平，私募不透明仍未解决
        - USD 300M 至 450M
        - 只有设置强下行保护和大幅不透明折价，入场才说得通
        - 更多倍数压缩、留存走弱或优先权包袱加重的证据
        - 按公开市场方式重定价，会大幅低于报道的 2025 年末轮次区间
      - - 基准
        - MoEngage 确实突破 $100M ARR，且需求仍站得住，但没有审计后经济指标，投资人仍无法证明应给溢价
        - USD 450M 至 650M
        - 只有入场价明显低于媒体估值，且尽调确认现金转换干净，才可接受
        - 私下尽调验证核心收入质量，但未验证溢价估值支撑
        - 投资人若假设只靠增长就能抵消披露和股权结构表风险，会付贵
      - - 乐观
        - 私下尽调证明 NRR 具备溢价水平、软件毛利率高、优先权拖累有限，且市场重新向更强 SaaS 公司打开
        - USD 750M 至 900M
        - 只有 MoEngage 在尚未公开的指标上配得上相对公开同业的溢价，才有上行空间
        - 审计后指标、干净股权结构表，以及通往 IPO 级报告的可见路径
        - 如果 2025 年末估值已计入上行空间，即便公司不错也会让投资人失望
    notes: 仅为示意性企业价值区间。它们来自公开可比信号和报道 ARR，且不能直接转成股权价值，因为当前资本结构未公开。
