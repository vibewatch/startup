      - number: '2.3'
        title: AI 个性化、隐私变化与渠道碎片化
        blocks:
          - type: paragraph
            body: >-
              需求故事已经不只是发送更多消息，而是平台能否用统一的第一方数据，让消息及时、贴合语境，并匹配渠道。Salesforce、Twilio、Adobe、Braze 和 Experian 都指向同一个市场方向：AI
              正在抬高相关性预期，但碎片化数据和薄弱治理仍让多数团队兑现不了这个承诺。隐私和送达率变化让问题更难。Apple 继续限制跨站追踪信号，Gmail 现在执行更严格的发件人认证和退订规则，WhatsApp
              定价也变得更明确且按类别划分。合在一起，这些政策奖励能协调自有渠道、维护同意和身份卫生，并智能路由旅程的供应商，而不是把每个触点都当成可互换界面。对 MoEngage 来说，这是带约束的市场顺风：AI
              主导的个性化提高了品类重要性，但只有同时解决数据和政策摩擦的平台才能受益。
