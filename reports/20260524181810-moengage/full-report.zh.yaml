      - number: '8.4'
        title: 只有私下证据补齐关键缺口，判断才可能上调
        blocks:
          - type: paragraph
            body: >-
              本章最重要的结论不是 MoEngage 缺少质量，而是公开证据还无法告诉投资人：在报道价格下，这些质量是否真正归属于普通股。 要从继续研究干净上调到跟踪或买入，需要补齐五个证明点。第一，管理层需要把
              ARR、GAAP 收入、毛利率和自由现金流对齐， 让市场看清业务里有多少是真软件，而不是毛利更低的消息通道或服务。第二，完全稀释股权结构表、优先权和老股 / 新股拆分需要打开，
              投资人才能把企业价值情景换算成股权回报。第三，管理层必须披露当前留存和分群表现，而不能只给 2022 年 ARR 和 NRR 快照。 第四，反向翻转和 IPO
              准备叙事必须配得上上市公司级控制和报告。第五，面对套件整合和大型厂商 AI 捆绑，MoEngage 必须证明自己仍能守住估值倍数扩张。上述事项被验证前，正确姿态是尽调优先、价格守纪律。
