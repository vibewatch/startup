        title: 监管、隐私与跨境风险
        blocks:
          - type: paragraph
            body: >-
              MoEngage 的公开材料显示，它面对的是严肃的隐私和传输界面，而不是轻量 martech 足迹。隐私政策在 2026 年 1 月更新，帮助语料记录了删除、访问、更正和可携带工作流，SDK
              文档暴露了客户可因数据政策原因配置的区域路由选择。这些控制有用，但不会降低底层法律负担。一家在消息、分析和画像界面中存储或激活个人数据的客户互动供应商，仍必须对齐 GDPR 传输规则、India DPDP 边界和
              California 执法。MoEngage 自己的披露也承认，会向用户居住国之外的 sub-processor 传输。主要承销问题因此不是 MoEngage
              是否知道这些制度存在，而是随着司法辖区持续变化，公司能否把合同传输机制、删除 SLA、路由选择和客户实施指导保持得足够紧。
