        - 赢单 / 输单趋势、折扣、扩张放缓，以及大型套件的功能同质化主张
        - 证据显示，企业交易越来越多因价格或采购便利性输给捆绑套件方案
        - 建模时下调扩张、压低毛利率，并采用更弱的退出倍数假设
        - 索取分段赢单 / 输单数据、定价让步和差异化用例证据
