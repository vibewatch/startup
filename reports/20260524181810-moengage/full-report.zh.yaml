      - number: '1.3'
        title: 融资历史、投资人基础与估值模糊性
        blocks:
          - type: paragraph
            body: >-
              MoEngage 的融资历史显示，公司从成长阶段 martech 迅速迈入晚期私募资本结构。公开可见历史包括 2022 年 6 月由 Goldman Sachs Asset Management 和 B
              Capital 领投的 $77 million Series E，叠加同一公告中提到的两轮 2021 年融资。资本叙事随后在 2025 年底明显抬升：11 月由 Goldman Sachs
              Alternatives 和 A91 Partners 领投 $100 million，12 月又由 ChrysCapital 和 Dragon Funds 领投追加 $180 million，使已披露
              Series F 融资达到 $280 million。12
              月融资还包含老股交易和员工流动性，这很关键，因为它释放的是股权结构成熟化信号，而不是纯粹的新股增长轮。更难回答的问题是累计融资和估值。公司关联材料称累计融资超过 $250 million，Tracxn、CB
              Insights 和 Inc42 列出的总额却明显不同。ETtech 给出单一来源的 $850 million 投后估值，但已抓取资料中没有监管文件或公司文件印证。因此，MoEngage
              看起来资金充足，但仅靠公开证据还无法给出干净价格。
