  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 股权结构表优先级差于隐含假设
        - 重大的清算优先权、反稀释棘轮或老股占比较高的结构压在新股之上
        - 即便经营表现守住，普通股层面的上行也会被压缩
        - 大幅下调定价或退出
      - - ARR 不能转化为高质量收入
        - 审计后收入、毛利率或留存落后于溢价情景
        - 增长叙事不再支撑溢价软件倍数
        - 维持继续研究，或在报道价格下转为回避
      - - 当前 NRR 或总留存显著低于高溢价 SaaS 门槛
        - 留存明显低于通常支撑 7x 以上收入倍数的水平
        - 扩张驱动的可比逻辑失效，市场可能套用更低板块倍数
        - 转向悲观区间，并提高回报门槛
      - - 套件整合加速
        - 赢单 / 输单数据显示，Salesforce、Adobe、HubSpot 或类似套件凭捆绑经济性拿走预算
        - 独立互动厂商失去定价权和倍数扩张潜力
        - 下调可比假设，并要求更强护城河证据
      - - IPO 准备度仍主要停留在叙事
        - 反向翻转进展没有上市公司级报告和控制作匹配
        - 退出可选性仍是理论上的，不是可兑现的
        - 只按私下退出建模，拒绝 IPO 式定价
    notes: 这些是明确会打断倍数逻辑的触发项，而不是泛泛风险。每一项都会改变估值框架，或改变投资人实际拿到的所有权经济性。
