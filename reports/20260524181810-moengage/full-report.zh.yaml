  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支持证据
      - 反驳
      - 改变判断的条件
    rows:
      - - 品类需求真实
        - MoEngage 在 2025 年末完成两笔融资，服务 1,350 多个品牌，并称 ARR 突破 $100 million
        - 品类需求真实并不证明普通股在报道估值下有吸引力
        - 拿出审计后的 ARR 到收入桥，以及增长可持续、而非只踩中题材的证据
      - - 企业客户与地域牵引
        - 北美是主要收入贡献地，企业客户看起来也有分量
        - 区域结构和企业客户结构仍未披露合同质量、利润率或流失
        - 按地域或分部提供客户队列、logo 留存、扩张和毛利率拆分
      - - AI 和平台宽度可能支撑溢价兴趣
        - MoEngage 持续把 Merlin AI、Inform 和更广的互动工具包装成扩张驱动
        - 市场现在奖励已验证的 AI 成果和一体化平台深度，而不是单贴 AI 标签
        - 按客户队列展示 AI 带来的可衡量扩张、留存或效率成果
      - - 公开可比公司并非全面压制软件
        - Braze、Salesforce、Adobe 和 Klaviyo 仍有可观公开市场价值
        - 这些同业也披露了 MoEngage 未披露的收入、利润率和留存数据
        - 提供审计后财务数据和当前 SaaS 运营指标，使其可与已披露同业对照
      - - 私募溢价可能存在
        - MoEngage 的增长、成本结构或客户质量可能优于公开同业
        - 公开记录尚未证明这些优势，也未证明任何优先权包袱的规模
        - 打开股权结构表和经营模型，让投资人直接验证溢价
      - - 当前反向逻辑
        - 在缺少乐观情景披露的情况下，2025 年末媒体估值已经像乐观情景价格
        - 如果把动能误认为可定价性，投资人仍可能付贵
        - 把报道轮次视为上限，而不是已验证的公允价值
    notes: 本表刻意保持价格敏感。好公司如果溢价逻辑依赖非公开事实，仍可能是差投资。
