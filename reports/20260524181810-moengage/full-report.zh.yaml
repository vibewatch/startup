  - id: TI003
    title: 公开单位经济与运营代理指标
    columns:
      - 指标
      - 公开数值或状态
      - 置信度
      - 重要性
      - 尽调索取
    rows:
      - - ARR 规模
        - TechCrunch 和 ET 称到 2025 年底已跨过或正在逼近 $100M；官方页面未发布当前数字
        - 中
        - 若准确，说明已具备后期 SaaS 规模
        - 索取董事会批准的 ARR 桥和当前 ARR 定义
      - - 净收入留存
        - 2022 年 CEO 信中为 136%；2022 年 Series E 新闻稿为 >135%；2024 年总结称提升 8 个百分点
        - 中
        - 提示扩张质量，但所有引用要么偏历史，要么来自公司口径
        - 索取按队列和地区划分的当前净美元留存
      - - 烧钱纪律
        - 2022 年 CEO 信称，扩张期 burn multiple 保持在 1x 以下
        - 中
        - 这是私营 SaaS 公司少见的正面资本效率信号
        - 索取当前 burn multiple、经营现金流和情景敏感性
      - - 季度收入增长
        - 2024 年总结称季度收入同比增长 >47%
        - 中
        - 确认增长动能，但不能确认绝对收入规模
        - 索取经审计季度损益表和 bookings 桥
      - - 印度法定实体收入
        - Tracxn 的 MCA 关联摘要显示 FY2025 为 ₹352Cr；Inc42 显示 FY2024 为 ₹311.5Cr
        - 中到低
        - 可作为实体层面运营下限，但不是干净的合并口径数字
        - 索取集团合并范围和内部交易抵销
      - - 员工数快照
        - Tracxn 法定实体页为 649 人，2025 年底报道约 800 人，Inc42 资料页为 898 人
        - 低到中
        - 员工数可代理成本基础和产能，但公开快照差异很大
