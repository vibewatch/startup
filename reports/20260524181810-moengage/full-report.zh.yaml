  - id: TP004
    title: 定价 / 打包对比
    columns:
      - 厂商
      - 公开定价姿态
      - 商业驱动因素
      - 透明度信号
      - 对买方的影响
    rows:
      - - MoEngage
        - 公布 Growth 和 Enterprise 计划；定价通过 MTU 和产品系列解释
        - 月度追踪用户、附加模块，以及 Growth / Enterprise 的一年期承诺
        - 高于多数直接同业，因为网站定义了 MTU、计划系列和合同下限
        - 买方想在演示前做预算时有帮助，但仍不是完整企业报价单
      - - Braze
        - 层级名称和打包公开；确切合同金额仍在销售流程后
        - MAU 加 Action Credits，高层级增加治理和 AI 能力
        - 中：买方能看到打包逻辑，但看不到合同标价
        - 企业友好结构，但成本可预测性仍取决于销售谈判和使用假设
      - - CleverTap
        - 公开入门价格和 MAU 层级与 Advanced、Cutting Edge 计划一起发布
        - 基于 MAU 的计划、附加项和免费试用入口
        - 相对直接同业透明度高
        - 这让 CleverTap 在中型市场和移动优先交易中经常成为 MoEngage 的同口径价格基准
      - - Iterable
        - 所审阅来源未披露公开定价
        - 按需求定制报价，可能取决于消息 / 联系人范围
        - 低：买方必须早期接触销售
        - 即便平台功能丰富，不透明定价也会放慢入围名单比较
      - - WebEngage
        - 当前官方定价没有清晰公开；近期第三方市场评论估计为定制年度定价
        - 据近期替代市场报道，合同按定制 MAU 和范围定价
        - 低到中，因为最强公开数字来自第三方而非官方
        - 价格发现可能比 MoEngage 或 CleverTap 需要更多供应商沟通
      - - Salesforce Marketing Cloud
        - 核心版本和附加模块的公开模块定价可见
        - 按组织计月定价，个性化和分析模块另计
        - 已发布模块的置信度高，但全套支出仍取决于组合
        - 买方可以测算入门成本，但套餐扩张可能快速推高平台总支出
      - - Adobe Journey Optimizer
        - 获取到的官方材料以演示和咨询为主，而不是标价驱动
        - 平台采用、数据规模和企业复杂度
        - 显性公开价格点低
        - 更适合已经习惯 Adobe 平台采购的企业，而不是追求快速标价比较的买方
    notes: WebEngage 定价区间来自第三方报道，不是当前官方价格页确认。Adobe 行反映获取到的官方材料缺少公开标价，并不意味着判断该产品定价过高。
