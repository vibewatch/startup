  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - ARR 到 GAAP 收入桥
        - 按产品、地域和渠道，把当前 ARR 与已确认收入做董事会级勾稽
        - 检验报道 ARR 是否支撑软件倍数，还是掩盖较低质量的收入结构
        - CFO 尽调包加审计后收入确认明细
      - - 毛利率和自由现金流
        - 当前和历史毛利率、贡献利润率、烧钱速度、现金、债务和自由现金流桥
        - 没有这些指标，投资人无法判断 MoEngage 是否相对公开同业应获溢价
        - 财务尽调和审计师工作底稿
      - - 当前留存和队列行为
        - 2024-2026 年总留存、NRR、logo 流失、扩张和队列曲线
        - 高溢价 SaaS 估值高度依赖留存质量，而不只是收入规模
        - 商业分析数据导出和客户队列复核
      - - 完全摊薄股权结构表
        - 证券层级、优先权、老股 / 新股拆分、要约机制和清算瀑布
        - 把企业价值情景转成真实股权回报计算
        - 融资文件与资本结构表的法律尽调
      - - 退出准备度
        - 董事会方案、报告控制、上市公司准备材料包，以及买方反馈证据
        - 判断披露估值是否有可信流动性路径，还是只有叙事支撑
        - CEO、CFO 与投行材料，并附反向翻转和 IPO 工作流证据
    notes: 这些材料是最低门槛：有了它们，本章才可能从公开信息筛查判断推进到可投资的承保判断。管理层若拿不出来，建议评级不应上调。
    claimRefs:
