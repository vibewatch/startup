  - id: TI002
    title: 定价与计费机制
    columns:
      - 定价杠杆
      - 来源怎么说
      - 公开来源可见度
      - 财务含义
      - 注意事项
    rows:
      - - 套餐可见度
        - Growth 和 Enterprise 是核心平台命名的商业层级。
        - 官方套餐页
        - 分层支持企业包装和增购逻辑
        - 没有官方公开价格卡
      - - 订阅激活
        - Workspace 激活使用客户成功经理提供的订阅码。
        - 官方文档和帮助中心
        - 价格比较往往发生在销售接触之后，而不是之前
        - 外部承保难以看清
      - - MTU 计费
        - MTU 根据 App 或 Site Opened 活动计数，并按月报告。
        - 官方帮助中心
        - 核心定价按用量，而不是按席位
        - 具体合同条款因客户而异
      - - 事件 FUP 超额
        - 如果事件量超过合约约定的公平使用平均值，可计费 MTU 可以按 Events 除以 FUP 重新计算。
        - 官方帮助中心
        - 高事件强度可以在标题客户数不增长时抬高实际账单
        - FUP 阈值由合同决定
      - - Inform 计费
        - Inform 仅按使用渠道和跨 Email、SMS、WhatsApp、Push 发送的消息数收费。
        - 官方帮助中心和产品页
        - 交易型消息收入可随量扩张，但也暴露渠道成本风险
        - 公开细节不足，无法拆分平台费和转嫁支出
      - - 发送方和 shortcode 汇总
        - 共享发送方和 shortcode 会跨 workspace 在账户层面汇总费用。
        - 官方帮助中心
        - 发票金额可能高于 workspace 仪表盘，抬高超额风险
        - 取决于发送方架构
      - - 第三方价格指南
        - ITQlick 和 CampaignHQ 发布数字化价格区间和隐藏成本假设。
        - 声誉较低的第三方评论
        - 解释了买方为何到外部搜索价格
        - MoEngage 官方页面没有佐证引用数字
    notes: |
      该表有意拆开官方计费机制和非官方数字价格指南。来自评论页或竞品页的公开价格点只作为低置信度方向信号，不视为权威标价。
