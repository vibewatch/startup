      - number: '1.4'
        title: 规模信号、产品里程碑与战略轨迹
        blocks:
          - type: paragraph
            body: >-
              公开里程碑对产品节奏和客户证明的支撑强于对经审计财务披露的支撑。SoundCloud 迁移是最清晰的外部验证点：超过 200 个在线活动和 100 million 用户在 12 周内迁移，说明 MoEngage
              有能力在规模化场景中替换既有 marketing-cloud 工具。公司材料还称，已有超过 300 家企业迁上该平台；TechCrunch 进一步称，大约 60% 业务现在来自传统企业，北美贡献超过 30%
              收入。产品层面，公司 2026 年材料重点强调 Merlin AI、自定义智能体、原生智能体和 AI connector，强化了一个判断：MoEngage 正试图从营销自动化厂商，重新定位为 AI
              主导的客户互动操作层。Gartner Peer Insights 和 Forrester 的认可支撑这次重新定位，但仍属于公司筛选过的验证，而非经审计运营证据。2026 年 1 月 NCLT
              批准的反向合并又增加了一个重要里程碑，因为它把产品和市场进展接到更具体的资本市场叙事上：MoEngage 不只是全球扩张，也在为潜在印度上市简化结构。
