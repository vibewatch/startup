  - id: TI001
    title: 收入来源与变现视角
    columns:
      - 收入流
      - 公开记录显示什么
      - 计费或定价单位
      - 收入质量判断
      - 尽调索取
    rows:
      - - 核心客户互动套件
        - Growth 和 Enterprise 套餐覆盖跨渠道旅程、细分、分析和活动优化。
        - 签约 SaaS 方案；官方未披露数字定价
        - 经常性软件收入显然是核心，但实际 ACV 和折扣深度未公开
        - 索取匿名订单表和按细分市场划分的 ACV
      - - Inform 交易型基础设施
        - Inform 作为单独基础设施层出售，服务 OTP、服务更新和其他关键提醒。
        - 按使用渠道和发送消息量计费
        - 可能混合了软件平台价值和转嫁型渠道经济
        - 索取渠道毛利率桥和直接运营商或供应商成本
      - - 连接渠道和附加模块
        - WhatsApp、RCS、Line、Viber、Telegram、Personalize 以及部分渠道以连接渠道选项或附加模块出现。
        - 附加模块或连接渠道合同条款
        - 附加模块可以抬高 ARPU，但公开材料没有披露绑定率
        - 索取按模块划分的绑定率、增购和续约队列
      - - 分析和产品工作流
        - 官方 2025 年 12 月信息称，Analytics 和 Inform 已纳入面向产品与工程团队的更大共享数据叙事。
        - 企业合同内的模块扩张
        - 如果增购真实存在，可以支撑更大的平台 ACV，但收入拆分未披露
        - 索取产品线 bookings 组合和平均多产品合同规模
      - - 服务、支持和 QBR
        - 企业营销页和第三方竞品框架暗示，核心平台周围有实施、客户成功和专业服务支持。
        - 未公开分项
        - 如果服务占比不低，可能有助采用，但会稀释纯软件毛利率
        - 索取服务收入占比、利润率和绑定率
      - - 媒体和发送方费用
        - 帮助文档称，已配置的电子邮件或 SMS 发送方可能增加媒体量费用，并在账户层面汇总。
        - 按用量、细分或发送方计费
        - 这是最清晰的公开线索：部分实际收入可能是转嫁型或低毛利
        - 索取发票样本，拆分平台费和媒体费
    notes: |
      官方页面确立了变现结构，但没有披露实际收入组合。各行区分经常性软件、用量驱动超额费用和可能转嫁的渠道支出，避免夸大纯 SaaS 质量。
