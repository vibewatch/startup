  - id: TI005
    title: 公开财务缺口与尽调卡点
    columns:
      - 缺失项
      - 重要性
      - 当前公开记录
      - 对承保影响
      - 具体尽调路径
    rows:
      - - 实际定价和折扣
        - 需要把套餐架构转换成真实 ARPU 和收入质量
        - 官方页面展示套餐名称和计费机制，不展示实际价目表
        - 重大
        - 索取匿名订单表、价格簿和折扣审批日志
      - - 按产品和转嫁支出拆分的收入组合
        - 需要区分高毛利软件与较低毛利的消息或服务
