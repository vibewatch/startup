      - number: '7.3'
        title: 依赖、商品化与执行风险
        blocks:
          - type: paragraph
            body: >-
              MoEngage 的战略风险在于，这个品类越来越容易解释、也越来越难防守。Salesforce、Adobe、Braze 和 Microsoft 都在营销 AI
              辅助编排、实时触发、跨渠道旅程和个性化的某种组合——这些正是支撑 MoEngage 价值主张的商业界面。这并不代表 MoEngage
              缺少产品质量，而是买方越来越能从更大套件中获得类似能力，而这些套件已经掌握相邻预算、数据或分发。同时，公司自己的控制模型依赖客户工程和法务团队在外部平台上正确实施路由、披露、发件人和同意规则。这让业务异常依赖隐私工程、反滥用运营、onboarding
              和产品包装上的执行深度。风险与其说是某个竞争对手在单一功能上超过 MoEngage，不如说是分发守门人和更宽套件持续压缩差异化、利润率和续约杠杆。公开 AI 治理证据也偏薄，因此随着企业买方和监管者对 AI
              的预期变硬，公司必须证明任何优化或决策层都足够可审计。
