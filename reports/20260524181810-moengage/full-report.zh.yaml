  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算
        blocks:
          - type: paragraph
            body: >-
              MoEngage 所在市场在分析师口径下边界差异很大。客户互动解决方案报告通常落在一个中等规模的软件和服务类别；更宽的营销自动化研究则把活动管理、分析、编排和渠道工具等更大栈一并纳入。相邻的 CDP
              报告绝对金额小得多，但增速更快，因为数据统一越来越决定编排层能否实时个性化。移动语境也很重要：App 使用和更广泛的移动经济，让买方持续关注自有、always-on 的互动工作流。尽调上的实际结论是，最大的通用
              TAM 数字反而最不有用。对 MoEngage 更可辩护的市场视角，是全渠道编排、移动互动和第一方数据激活之间的重叠区。这个重叠区足够大，可以支撑品类增长；但也足够模糊，不能支撑一个简单的单一 TAM 估值叙事。
