      - - CleverTap
        - 客户数据和分析是平台叙事与定价层级核心
        - CleverAI 加高阶层级中的超个性化和高级分析
        - 跨推送、邮件、WhatsApp、RCS、网页和应用内的全渠道编排
        - Advanced 和 Cutting Edge 层级增加基于角色的访问和可定制支持
