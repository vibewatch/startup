  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 公开证据
      - 系统角色
      - 关键依赖
      - 风险 / 落地备注
    rows:
      - - 区域路由层
        - 按 DC 区分的仪表盘和 API 主机，以及 SDK data-center 枚举
        - 将工作区流量固定在预定区域集群
        - API 和 SDK 配置中正确选择数据中心
        - 集群映射错误可能打断路由、削弱隐私姿态，或破坏白名单假设
      - - 认证和 API 控制面
        - 使用 workspace_id:api_key 的 Basic Auth，加上特定功能密钥
        - 控制数据、营销活动、个性化和消息 API 的访问
        - 密钥的运营管理与轮换
        - 功能级密钥和速率限制会给多界面部署增加运营负担
      - - 移动 SDK 初始化
        - Android 和 iOS 初始化对象要求在 App 启动代码里写入工作区 ID 和 App 配置
        - 连接 App 生命周期、推送、应用内、Cards 和 geofence 模块
        - 原生 App 发布流程和环境级配置
        - MoEngage 已弃用旧 Android manifest 模式，并继续调整原生设置要求
      - - Web 个性化与 CSP 层
        - Web SDK nonce 支持和 Personalize 白名单要求
        - 让 Web 体验在严格 CSP 下安全渲染 OSM、Cards 和 Personalize
        - 客户掌控 script-src、style-src、connect-src、frame-src 等指令
        - CSP 配错可能压住个性化效果，业务用户又不容易看见
      - - 伙伴 / CDP 连接器
        - Segment 和 mParticle 文档列出 device-mode、cloud-mode、事件、身份和同意路径
        - 向 MoEngage 喂入客户数据，并把编排延伸到更广技术栈
        - 连接器模式、已知标识符和同意状态传递
        - cloud-mode 或身份接线不完整，可能削弱推送、应用内或匿名用户场景的价值
      - - 版本与包管理
        - Android BOM/catalog、CocoaPods、npm、pub.dev 和 Maven 构件都在发布活跃包
        - 协调原生和混合栈的 SDK 兼容性
        - 客户对依赖升级和构建工具版本的管理纪律
        - 发布节奏快会抬高功能迭代速度，也会加重版本管理负担
    notes: 各行描述公开可见的运营栈，而不是内部服务图；架构推断来自 API、SDK、包和伙伴文档。
