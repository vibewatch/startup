        - 下调实施假设，并要求更强的售后支持经济性
        - 抽样查看客户隐私清单、Apple 审核回复和 Google Play 申报流程
      - - 安全或可靠性控制失效
        - 2FA、SSO、访问审核、脱敏、BYOK、状态透明度
        - 安全例外、管理员膨胀、事故复发、未解决的延迟模式
        - 公开事故反复出现、管理员治理薄弱，或无法证明核心控制已落地
        - 升级尽调；在判断增长耐久性前要求整改计划
        - 检查管理员日志、访问审核节奏、事故复盘和控制采用率
      - - 套件推动的商品化和定价压力
