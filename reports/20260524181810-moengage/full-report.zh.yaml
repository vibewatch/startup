    rows:
      - - MoEngage
        - 官方打包分析、洞察、基于 MTU 的衡量和企业级规模主张
        - Merlin AI 加基于行为的网页 / 应用个性化
        - 跨渠道营销加交易性提醒和网站个性化
        - Enterprise 计划增加访问控制、本地数据服务器 / IP 白名单选项
        - Migration Program 和伙伴生态是公开话术的明确组成部分
      - - Braze
        - 数据激活、分群、洞察、报告，以及强公开经营指标
