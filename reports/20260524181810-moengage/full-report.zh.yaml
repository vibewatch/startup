      - number: '8.2'
        title: 公开可比公司与 2026 年倍数压缩，不支持完整私募溢价
        blocks:
          - type: paragraph
            body: >-
              可比公司集合很重要，因为 MoEngage 正在一个已经重估软件和 martech 风险的市场中被定价。PitchBook 的 Q1 2026 指南称，上市 SaaS 的 EV / trailing
              revenue 中位数降至 3.3x；Multiples.vc 显示，sales and marketing automation 的 EV / next-twelve-month revenue 只有
              1.8x。对任何要求投资人按溢价估值承销、却没有经审计经济性的私营厂商来说，这是严苛背景。上市公司集合进一步强化了这一点。Braze 仍交付强增长并披露留存指标，但其 2026 年 5 月公开市场价值约
              $2.72 billion，对应 fiscal 2026 revenue $738.2 million。Salesforce 和 Adobe 规模远大得多、更多元且完全披露，但 price-to-sales
              也约在 3.55x 和 4.03x。另一家增长营销平台 Klaviyo 已提交收入和客户数据，报告 2025 revenue $1.234 billion 后市值为 $4.45 billion。这些参考并不说明
              MoEngage 弱；它们说明，要拿私募溢价，需要比当前公开来源更强的证明。
