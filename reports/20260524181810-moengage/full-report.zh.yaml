  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 报道中的融资动能真实存在，但可定价性仍弱
        blocks:
          - type: paragraph
            body: >-
              MoEngage 的 2025 年底融资周期证明了投资人需求，但不能证明新投资人应该按报道价格买入。官方公司材料清楚确认，2025 年 11 月一轮 $100 million，12 月又追加 $180
              million extension，使 Series F 总融资达到 $280
              million。独立报道也支持该业务拥有真实企业牵引力、全球品牌覆盖，以及为员工和早期投资人提供的第二次流动性事件。问题在于，公开记录仍没有对齐准确投后估值、完全摊薄股权结构，或标题轮次中到底有多少成为公司新增现金。报道中的估值参考从约
              $750 million pre-money 到远高于 $900 million
              post-money，其中一个数据库页面还更高。这让公开市场投资人面对熟悉的未上市公司困境：需求证据存在，但判断价格是否公允所需的承销输入仍不完整。
