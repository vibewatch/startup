      - number: '4.4'
        title: 披露冲突与承销结论
        blocks:
          - type: paragraph
            body: >
              主要反向财务信号不是急性困境证据，而是披露不透明。公开估值参考横跨大区间，从大约 $750 million 到 $1.1 billion，且 MoEngage 没有官方公告披露投后估值。累计融资同样混乱：公司只说
              2025 年 11 月一轮之后融资超过 $250 million；TechCrunch 在 12 月 extension 后把累计新股融资框定在接近 $307 million；数据库提供商发布的总额则接近
              $458 million 或 $487 million。即便更可触摸的法定证据也只是部分信息，而非定论。Tracxn 对 MCA 关联公司数据的转录指向 India 实体 FY2025 收入 ₹352
              crore，Inc42 则引用 FY2024 收入 ₹311.5 crore，但两者都没有解决合并范围、转让定价或当前盈利能力。官方页面在包装、客户
              logo、迁移故事和增长话术上很强；在实际定价、收入构成、毛利率、现金和远期义务上很弱。合在一起，MoEngage
              商业上可信、战略上获得资金支持，但仍像一家披露有限的未上市发行人：公开证据不足以支撑精确估值或收入质量承销。
