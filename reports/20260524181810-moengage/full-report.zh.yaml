      - number: '1.2'
        title: 创始人、领导梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事很清楚，治理图景则不然。Raviteja Dodda 仍是公司的公众门面并担任 CEO，Yashwanth Kumar 则以 CTO、CISO 和隐私政策中列名的 DPO
              身份负责技术、安全和隐私。这种组合意味着产品方向和信任架构都异常集中在创始人手里。创始人之外，公开资料显示 Narasimha Reddy 负责财务和战略项目，Yashwanth Reddy
              负责收入领导工作，足以说明公司在财务和 go-to-market 上有一定职能深度。同样重要的是缺失项：官方页面没有披露清晰的董事会名单、委员会结构或投资人控制权概要。Tracxn 暗示公司有 7
              名现任董事会成员，但在已抓取资料中容易核验的只有创始人和少数部分曝光的董事姓名。尽调角度看，公开证据支持创始人连续性和一定高管厚度，却看不清 2025 年大额融资之后到底是谁在治理公司。
