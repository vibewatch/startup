      - number: '8.3'
        title: 证据支撑的是区间，不是清晰定价
        blocks:
          - type: paragraph
            body: >-
              只靠公开信息做估值练习仍然有用，但它只能管住入场纪律。如果 2025 年末约 $100 million ARR 的说法大体属实，那么报道中的 $850 million 至超过 $900 million
              估值标记意味着约 8.5x 至超过 9x ARR；$1.1 billion 的数据库参考值则意味着约 11x。优质 SaaS 公司并非撑不起这些倍数，
              但同一批公开资料没有披露毛利率、当前净留存、自由现金流或优先权结构，无法支撑投资人支付高于公开市场中位数和已披露互动软件可比公司的价格。 因此，熊市情景把公开市场而不是管理层叙事作为锚；基准情景假设
              MoEngage 强于泛行业平均水平，但仍应承受私有公司透明度折价； 牛市情景则要求私下尽调证明，MoEngage 的增长和收入质量显著强于公开记录所显示的水平。按这套逻辑，2025
              年末报道估值标记下的建议应是继续研究，估值判断偏紧。
