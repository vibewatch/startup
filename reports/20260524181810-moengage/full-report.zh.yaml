      - number: '1.5'
        title: 风险信号、反向检查与未决问题
        blocks:
          - type: paragraph
            body: >-
              概览层面的风险不在于已知爆雷，而在于公开证据仍无法解决的事项。已抓取资料没有显示 MoEngage 涉及已记录诉讼、数据泄露或监管执法，但确实出现了 UpGuard
              的外部供应商风险报告，以及公司自身指标反复不一致。融资总额从公司关联口径的“超过 $250 million”，到接近 $295 million 的数据库估计，再到一个超过 $487 million
              的资料页。员工数和办公室覆盖披露同样混乱：2022 年超过 650 名员工、关于页面 700+、2025 年底报道约
              800，以及其他第三方更高估计。这些差异不能证明问题存在，但会引出报告纪律疑问。治理也是持续缺口：投资人已披露，老股出售被提及，reverse flip
              正在推进，但公开材料仍看不到谁控制董事会，也看不到大投资人持有什么权利。对投资测算而言，最关键的未知数是当前估值、累计资本、董事会控制权和合并口径运营表现，而不是公司是否真实存在或产品是否相关。
