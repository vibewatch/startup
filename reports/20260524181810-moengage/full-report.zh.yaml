        - 私营；第三方评测页面显示跨十个渠道服务企业和中小企业
        - 聚焦留存、分析和生命周期自动化的 APAC B2C 品牌
        - 覆盖 CDP、个性化、分析、AI 和渠道执行的宽栈
        - 公开市场声音担心应用内深度、触发速度和成本价值匹配
      - - Netcore
        - AI 优先个性化和客户互动套件
        - 私营；文档密集型栈，涵盖个性化、分析和渠道套件
        - 需要个性化加消息广度的零售、商业和 B2C 团队
        - AI 优先个性化叙事强，覆盖 9 个渠道，并含 CDP / 身份组件
        - 公开标准化定价较少，独立大型企业参考点更少
      - - Salesforce Marketing Cloud
        - 套件型既有厂商 / CRM 相邻营销云
        - 上市套件供应商，采用模块化产品定价和跨云分销
        - 已投入 Salesforce CRM、数据、服务或销售工作流的大企业
        - 在一个生态中打包 CDP、个性化、分析、自动化、忠诚度和 AI
        - 可能昂贵且运营负担重，尤其附加模块和跨云部署扩大后
      - - Adobe Journey Optimizer
        - 套件型既有厂商 / AEP 原生旅程编排
        - 基于 Adobe Experience Platform 的上市套件供应商
        - 需要跨多品牌或多地区受治理实时编排的中型市场和企业团队
        - 在 AEP 之上具备强实时画像、同意和治理姿态
        - 最佳适配往往假定采用 Adobe 平台，这会提高切换成本和实施范围
    notes: 这张表强调规模信号、客群适配和采购姿态，而不是尝试把各供应商披露不一的私营公司融资数据标准化。
