      - number: '2.2'
        title: 买方分层、预算归属与采购逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，这一品类更像共享运营基础设施，而不是单一渠道活动工具。大型企业仍主导客户互动和 CDP 市场的当前收入；在云定价降低进入门槛的地方，SME 带来更快部署增长。零售、BFSI
              和面向消费者的垂直行业仍是最清晰的需求池；当合规和个性化同等重要时，医疗也常被标为快速增长领域。真实买方地图是跨职能的：CRM 和生命周期营销团队每天使用系统，但数据平台、服务和 IT
              利益相关方会影响审批，因为这些产品只有在客户画像、渠道和响应工作流打通之后才有效。Salesforce 和 Twilio
              都指向同一个实际问题：买方想要对话式、实时互动，但很多团队仍缺完整数据访问。这会把采购推向两类供应商：要么能干净接入可组合栈，要么能提供更宽套件、减少运营接缝。
