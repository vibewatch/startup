  - id: TR001
    title: 监管 / 法律风险台账
    columns:
      - 风险 / 规则
      - 司法辖区
      - 当前暴露
      - 可能性
      - 严重性
      - 缓释措施
      - 剩余暴露
      - 尽调路径
    rows:
      - - GDPR 传输和删除义务
        - 欧盟 / EEA
        - 存在 — MoEngage 记录了 GDPR 工作流和路由控制，但公开资料只部分展示传输机制
        - 中
        - 高
        - 区域路由、删除 API、隐私政策、成文的数据主体权利工作流
        - 若 SCC 附件、子处理方通知或删除控制与客户实际部署不一致，剩余暴露为高
        - 要求按地区提供当前 DPA、SCC 附件、子处理方通知和删除 SLA 承诺
      - - 印度 DPDP 边界和跨境处理
        - 印度 + 面向印度提供的服务
        - 存在 — 只要服务面向印度提供，并以数字方式处理个人数据，就存在印度暴露
        - 中
        - 高
        - 公开资料记录了安全、删除和路由控制；法律在传输和执法落地上仍有风险
        - 中高，因为本资料集未公开印度专项治理的运营细节
