      - number: '4.3'
        title: 资本基础、流动性结构与充足性
        blocks:
          - type: paragraph
            body: >
              2025 年底融资显著改善了 MoEngage 的战略灵活性，但结构和标题数字一样重要。官方公告确认 11 月一轮 $100 million，12 月又追加 $180 million，使 Series F 达到
              $280 million。公告也明确说明，公司计划把资金投向 AI 产品扩展、GTM 招聘和收购，而不只是保留在资产负债表上。独立报道随后限定了可能真正进入公司账上的新现金：TechCrunch 和
              Economic Times 都把 12 月 extension 描述为以老股为主，其中约 $57 million 是新股资金，约 $123 million 是流动性；TechCrunch 还估计 11 月一轮约
              60% 为新股。这个结构意味着公司已处于晚期，资本状况好于许多私营同业，但不能把全部标题金额都视为可部署运营现金。迁回印度的 reverse flip 和已表述的 IPO
              就绪目标又增加一层：公开证据支持战略可选性，但仍没有披露现金余额、债务结构或 runway 模型，无法确认重组和增长计划之后还剩多少缓冲。
