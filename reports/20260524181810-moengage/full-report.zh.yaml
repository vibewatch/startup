        - 传输机制可见度和删除履约表现
        - 尽调后仍缺 DPA/SCC 包，或受监管区域反复出现泄露 / 删除升级事件
        - 暂停投资或附加条件，直到合同和运营机制得到验证
        - 获取 DPA、SCC 附件、区域地图、删除 SLO 和子处理方通知流程
