      - - 可组合或数据主导栈
        - CDP 加分析再加执行工具
        - 偏好最佳单品控制与厂商中立架构
        - 灵活性高，更适合数据工程能力强的团队
        - 需要更强内部集成能力和运营纪律
        - 除非能降低技术栈复杂度，否则任何单一执行供应商的价值都会被削弱
      - - 现状 / 内部自建
