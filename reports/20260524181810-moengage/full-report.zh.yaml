      - number: '2.4'
        title: 逆风、整合与估值含义
        blocks:
          - type: paragraph
            body: >-
              这个市场最重要的反向信号不是需求崩塌，而是执行拖累和买方疲劳。Gartner 显示预算仍然紧，AI 就绪度偏弱；GrowthLoop 和 Adobe
              则显示，许多团队无法把数据接到结果，跑不起实时项目，也仍然无法规模化“胜出”实验。与此同时，chiefmartec 和 MarTech 描绘的是一个 logo
              数量趋于平台化、但流失很剧烈的市场：买方在替换工具、整合栈，并把更老的 SaaS 层当作基础设施，而不是差异化产品。这会改变估值逻辑。这个市场里的供应商不能只因参与 martech
              增长就获得溢价。溢价现在取决于平台能否降低集成负担、守住信任，并在“统一数据 + 编排”层里占住耐久位置。对 MoEngage
              而言，上行情景是真实的，但采购评审也越来越不宽容：看起来像可替换执行界面的产品会持续承压。
