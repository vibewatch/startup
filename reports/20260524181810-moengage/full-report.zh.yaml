  - id: FR001
    title: 风险热力图——各风险类别的可能性与影响
    type: matrix
    layout: wide
    summary: 该矩阵按可能性、影响和剩余暴露对 MoEngage 八类主要风险排序。剩余暴露最高的是隐私传输失效、同意状态漂移、平台暂停，以及套件化竞争推动的商品化。
    data:
      columns:
        - 可能性
        - 影响
        - 剩余暴露
      rows:
        - label: GDPR / SCC 传输失效
          values:
            - 中
            - 高
            - 高——合同机制尚未完全公开
        - label: 印度 DPDP 实施漂移
          values:
            - 中
            - 中高
            - 中高——跨境规则和委员会实践可能演变
        - label: 同意 / 退订同步失效
          values:
            - 中高
            - 高
            - 高——可能引发多渠道投诉或暂停
        - label: WhatsApp 模板或政策暂停
          values:
            - 中
            - 高
            - 高——高意图渠道依赖可能突然断裂
        - label: Apple / Google 披露摩擦
          values:
            - 中
            - 高
            - 中高——客户发布周期可能卡住
        - label: 服务滞后或事故复发
          values:
            - 中
            - 中高
            - 中——公开状态可见度有帮助，但无法消除客户伤害
        - label: 分析 / 留存信任侵蚀
          values:
            - 中
            - 中
            - 中——评论证据指向持续摩擦
        - label: 套件商品化与价格压缩
          values:
            - 高
            - 高
            - 高——大型套件现在也在卖重叠的 AI 与旅程功能面
    approximationNotes: 可能性和影响评级是定性判断，依据截至 2026-05-24 的引用来源，以及本章识别出的公开证据缺口。
    claimRefs:
      - CR014
      - CR015
      - CR030
      - CR032
      - CR035
      - CR039
      - CR043
      - CR049
  - id: FR002
    title: 风险传导图——合规漂移如何变成商业伤害
    type: dag
    layout: wide
    summary: 有向图展示同意、平台政策或路由错误如何层层传导，最终造成渠道中断、客户不满、续约压力、整改成本和更弱的增长经济性。
    data:
      nodes:
        - id: n1
          label: 同意 / 撤回缺口
          detail: 跨渠道的抑制逻辑或退订状态不完整
        - id: n2
          label: 模板 / 政策拒绝
          detail: WhatsApp、Apple 或 Google 标记部署或消息
        - id: n3
          label: 送达能力损失
          detail: 消息发送失败、收件箱进箱变差，或渠道访问被限流
        - id: n4
          label: 服务滞后 / 路由问题
          detail: 触发式或区域敏感的营销活动延迟或误路由
        - id: n5
          label: 客户信任下降
          detail: 营销人员对分析、合规或及时性失去信心
        - id: n6
          label: 续约 / 扩张压力
          detail: 使用量或席位扩张放缓，流失风险上升
        - id: n7
          label: 整改成本飙升
          detail: 工程、法务和支持资源被转向修复
        - id: n8
          label: 毛利率压力
          detail: 折扣、支持负载和更低效率削弱单位经济性
        - id: n9
          label: 相对套件的路线图放缓
          detail: 更多精力投向合规，差异化投入减少
      edges:
        - from: n1
          to: n2
          label: 错误同意状态触发平台或投诉问题
        - from: n1
          to: n3
          label: 抑制错误减少可发送量
        - from: n4
          to: n5
          label: 旅程延迟或路由错误伤害营销活动信任
        - from: n2
          to: n3
          label: 模板或披露被拒降低渠道可用性
        - from: n3
          to: n5
          label: 漏发消息会被客户看见
        - from: n5
          to: n6
          label: 信任下降伤害续约和扩张
        - from: n2
          to: n7
          label: 申诉和修复消耗法务 / 工程时间
        - from: n4
          to: n7
          label: 事故响应增加支持和 SRE 成本
        - from: n6
          to: n8
          label: 增长转弱叠加让利，压缩经济性
        - from: n7
          to: n9
          label: 资源从创新转向合规
        - from: n9
          to: n6
          label: 路线图变慢削弱竞争性续约
    approximationNotes: 该图综合引用的政策、运营和评论证据，并非公司发布的因果模型。
    claimRefs:
      - CR030
      - CR032
      - CR035
      - CR036
      - CR038
      - CR039
      - CR043
      - CR046
      - CR047
      - CR049
  - id: FR003
    title: 依赖图——可能中断 MoEngage 工作流的外部节点
    type: dag
    layout: wide
    summary: 该图列出可能改变 MoEngage 运营环境的主要外部节点：消息平台、应用商店、邮箱服务商、云密钥基础设施、客户实施团队，以及捆绑型竞争套件。
    data:
      nodes:
        - id: d1
          label: MoEngage 平台
          detail: 客户互动、旅程、用户画像激活和渠道投递
        - id: d2
          label: Meta / WhatsApp
          detail: 选择加入、模板和消息政策执行
        - id: d3
          label: Apple App Review
          detail: iOS 应用的 SDK 责任与隐私审核
        - id: d4
          label: Google Play
          detail: Android 应用的用户数据与披露执行
        - id: d5
          label: Gmail / 邮箱服务商
          detail: 群发邮件的垃圾邮件率和退订预期
        - id: d6
          label: AWS KMS / 云区域选择
          detail: 密钥托管和区域交付依赖
        - id: d7
          label: 客户工程 / 法务团队
          detail: 同意采集、清单、路由和政策设置
        - id: d8
          label: Salesforce / Adobe / Braze / Microsoft
          detail: 具备重叠功能的捆绑型套件竞争者
        - id: d9
          label: 企业客户
          detail: 续约、扩张和部署结果
      edges:
        - from: d2
          to: d1
          label: 渠道政策和模板审批
        - from: d3
          to: d7
          label: SDK 隐私审核义务
        - from: d4
          to: d7
          label: 数据安全和用户数据声明
        - from: d5
          to: d1
          label: 邮件送达能力阈值
        - from: d6
          to: d1
          label: 密钥管理和区域基础设施
        - from: d7
          to: d1
          label: 客户实施质量
        - from: d1
          to: d9
          label: 互动和消息结果
        - from: d8
          to: d9
          label: 采购和定价替代方案
        - from: d8
          to: d1
          label: 功能和利润率压力
    approximationNotes: 依赖关系从风险角度刻画；该图突出可能中断部署、投递或商业差异化的节点。
    claimRefs:
      - CR019
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR038
      - CR045
      - CR048
      - CR049
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条从真实融资动能出发，穿过可比公司倍数压缩和披露缺口，最终落到继续研究的判断。
    data:
      nodes:
        - id: financing
          label: 融资动能真实
          detail: MoEngage 在 2025 年末完成一轮 $100M 融资，随后又完成 $180M 延展轮
        - id: traction
          label: 商业相关性存在
          detail: 新闻稿和官方材料指向 1,350 多个品牌、企业级牵引力和全球收入敞口
        - id: comp-backdrop
          label: 2026 年软件倍数收紧
          detail: PitchBook 和 Multiples.vc 显示倍数压缩，销售自动化板块估值较弱
        - id: opaque
          label: 私营公司不透明度仍高
          detail: 没有公开股权结构表、当前利润率组合或经审计留存桥
        - id: range
          label: 公开产出是区间，不是定价
          detail: 情景区间是有用护栏，但无法验证媒体报道的 2025 年末估值
        - id: recommendation
          label: 继续研究
          detail: 尽调和入场价格，而非叙事动能，决定这笔交易是否可投
      edges:
        - from: financing
          to: traction
          label: 需求确认相关性
        - from: traction
          to: comp-backdrop
          label: 质量仍需接受市场现实检验
        - from: comp-backdrop
          to: opaque
          label: 可比倍数收紧抬高举证门槛
        - from: opaque
          to: range
          label: 输入缺失阻碍精确判断
        - from: range
          to: recommendation
          label: 用估值区间约束入场纪律
    approximationNotes: 仅为决策流；它总结建议背后的分析依赖，而非时间线或运营模型。
    claimRefs:
      - CV001
      - CV004
      - CV015
      - CV032
      - CV033
      - CV042
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: MoEngage 可支撑估值最受哪些问题影响；下列为 0-10 顺序敏感度评分。
    data:
      items:
        - label: 经审计收入和毛利率披露
          value: 10
        - label: 完全摊薄股权结构表和优先权
          value: 9
        - label: 当前 NRR 和毛留存
          value: 8
        - label: 一级 / 二级现金拆分
          value: 7
        - label: 2026 年公开 SaaS 倍数背景
          value: 8
        - label: 平台整合压力
          value: 7
    approximationNotes: 评分是定性判断，不是百分比变化。分值越高，该因素越能推动仅基于公开信息的估值走廊。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV042
      - CV043
      - CV047
      - CV052
      - CV053
      - CV054
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅基于公开信息的企业价值区间，覆盖熊市、基准和牛市投资假设。
    data:
      items:
        - label: 熊市区间
          low: 300
          mid: 375
          high: 450
          unit: USD M
          detail: 行业压缩叠加未解决的不透明度，收入质量也弱于假设
        - label: 基准区间
          low: 450
          mid: 550
          high: 650
          unit: USD M
          detail: 规模和相关性真实，但优质证明缺失，仍低于媒体报道估值
        - label: 牛市区间
          low: 750
          mid: 825
          high: 900
          unit: USD M
          detail: 私下证明了优质 SaaS 经济性和清晰清偿顺位，同时市场仍愿意接纳更强的软件公司
    approximationNotes: 这些是情景区间，不是可观察市场定价。它们假设 2025 年末 ARR 评论方向正确，因此只能作为有纪律的筛选区间使用。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 基于公开证据质量、而非管理层访问，对当前投资案例做简明评分。
    approximationNotes: 评分是从章节证据综合出的 0-10 定性判断，并非由正式评分模型生成。
    data:
      items:
        - label: 市场相关性
          value: 7
          unit: /10
          detail: 融资动能和全球品牌覆盖说明品类契合度真实
        - label: 牵引力证明
          value: 7
          unit: /10
          detail: ARR 评论和企业采用看起来可信，但仍不完整
        - label: 披露质量
          value: 2
          unit: /10
          detail: 当前利润率、现金、留存和股权结构表数据未公开
        - label: 经济性证明
          value: 3
          unit: /10
          detail: 溢价情景下的软件经济性仍主要靠推断，而非披露
        - label: 竞争隔离
          value: 4
          unit: /10
          detail: 套件整合和 AI 驱动捆绑削弱点解决方案的倍数支撑
        - label: 估值支撑
          value: 3
          unit: /10
          detail: 仅凭公开证据，媒体报道的 2025 年末估值看起来难以支撑
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV015
      - CV032
      - CV033
      - CV042
      - CV047
      - CV048
      - CV051
