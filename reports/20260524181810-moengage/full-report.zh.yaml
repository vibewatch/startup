  - id: TP005
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - MoEngage 防线
      - 威胁来源
      - 证据基础
      - 严重度
      - 尽调含义
    rows:
      - - 移动优先的全渠道互动和分析
        - Braze 和 CleverTap 已经提供类似的移动优先生命周期深度
        - 直接产品页和同行评测对比显示，渠道、分析和个性化叙事高度重叠
        - 高
        - 验证 MoEngage 真正胜在搭建速度、结果或渠道表现，而不只是功能清单
      - - 易用包装和非技术用户可用性
        - Insider、MoEngage 等供应商如今都直接用迁移支持和易用性对标既有厂商
        - 多个供应商公开打出迁移计划、免费试用入口和无锁定信息
        - 中
        - 向管理层索取迁移赢率、上线时间和竞争替换案例
      - - 定价透明度优势
        - CleverTap 透明度相当，Salesforce 也公开模块价格
        - CleverTap 和 Salesforce 的公开定价页削弱 MoEngage 的可见度优势
        - 中
        - 核查 MoEngage 是否仍能把透明度转化为更短销售周期或更低 CAC
      - - AI 和个性化差异化
        - 同业和套件现在都在营销 AI、推荐和下一最佳行动能力
        - Braze、Insider、Salesforce、Adobe、Netcore 和 Iterable 的官方页面在 AI 驱动决策上明显趋同
        - 高
        - 尽调重点放在可衡量提升、采用率和工作流可用性，而不是 AI 标题语言
      - - 中端市场和 APAC 优势
        - 区域买方仍可选择 WebEngage、Netcore、CleverTap 或 Insider
        - 区域替代方案文章和官方页面显示，APAC 侧有多个可信替代品
        - 中
        - 测试 MoEngage 是否拥有持久的区域渠道或伙伴优势，而不只是品牌熟悉度
      - - 相对套件的专业厂商定位
        - Salesforce 和 Adobe 可以捆绑相邻的 CDP、分析和治理层
        - 官方套件页面和行业评论都把一体化生态描述为战略方向
        - 高
        - 承保 MoEngage 时，应把它看作必须在 ROI 和速度上打赢套件复杂度的专业厂商，而不是品类垄断者
    notes: 严重度衡量未来 12–24 个月内威胁能多直接地收窄 MoEngage 的采购优势，并不是预测该威胁一定会在每个细分市场兑现。
