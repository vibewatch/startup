              Analyze、Segment、Flows、Personalize、Decisioning、Inform，以及广泛的渠道执行。这种宽度很重要，因为核心用户不只是活动经理。产品营销、生命周期团队、CRM
              运营和产品团队都会在同一系统中，从受众理解推进到交付和测量。平台叙事还强调 11 个渠道，以及 email、SMS、WhatsApp、cards、on-site messages 和 RCS
