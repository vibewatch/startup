        - 阻塞
        - 索取按产品划分的月度收入桥，以及直接收入与转嫁收入拆分
      - - 毛利率和收入成本
        - 需要判断 SaaS 经济性和渠道成本敞口
        - 没有公开的当前毛利率披露
        - 阻塞
        - 索取按渠道划分的毛利率瀑布和供应商成本表
      - - 现金、烧钱、债务和现金跑道
        - 需要测试 Series F 是否真的覆盖招聘、重组和 M&A 目标
        - 未发现公开合并现金或债务明细
        - 阻塞
        - 索取最新资产负债表、债务协议和现金流情景
      - - CAC、回本周期和销售周期
        - 需要评估企业客户增长是否高效、可复制
        - 未发现当前公开披露
        - 重大
        - 索取管道转化数据、回本模型和队列获客成本
      - - 合并审计报表
        - 需要把印度实体申报与集团经济性对齐
        - 公开可得证据仅限 MCA 关联数据摘要和媒体报道
        - 阻塞
        - 索取集团审计财务报表及其与印度法定实体的调节表
      - - 估值支撑
        - 需要判断 2025 年底融资反映的是 $750M、$850M、>$900M 还是 $1.1B 经济性
        - 公开引用相互冲突，官方公告省略估值数字
        - 重大
        - 索取融资文件、股权结构表和估值备忘录
      - - 累计融资台账
        - 需要衡量累计稀释和融资效率
        - 公开来源对累计融资额以及哪些算新股资本分歧很大
        - 重大
        - 索取逐轮资金流和股权结构融资历史
    notes: |
      每一行都是真正阻碍完整财务承保的卡点，而不是表面数据缺口。这里最强的公开证据往往是缺席或冲突本身，也正因此，管理层 data room 工作仍不可少。
