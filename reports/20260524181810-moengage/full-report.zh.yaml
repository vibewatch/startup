  - id: TI004
    title: 资本充足性与融资视角
    columns:
      - 资本项目
      - 公开信号
      - 置信度
      - 重要性
      - 对充足性的含义
    rows:
      - - 2025 年 11 月融资
        - $100M，由 Goldman Sachs Alternatives 和 A91 Partners 领投
        - 高
        - 显示投资人继续支持，后期阶段胃口恢复
        - 提高灵活性，但单凭这一点不足以推断现金跑道
      - - 2025 年 12 月融资追加
        - 追加 $180M，使 Series F 达到 $280M
        - 高
        - 确认首个 tranche 后数周内仍能获得大额外部资本
        - 强化资产负债表观感和战略选择权
      - - 新资金与流动性
        - 独立报道称，12 月 tranche 约 $57M 为 primary、$123M 为 secondary；11 月大约 60% 为 primary、40% 为 secondary
        - 中
        - 标题融资额高估了实际进入运营的现金
        - 资产负债表受益明显低于轮次标题金额
      - - 员工和早期投资人流动性
        - 官方材料称，$15M tender 惠及 259 名现任和前任员工
        - 高
        - 显示股权结构表走向成熟，内部人部分去风险
        - 有利于留才，但不增加运营现金跑道
      - - 资金用途
        - 官方募资用途表述聚焦 AI、GTM 招聘、Inform 和 Analytics 扩张，以及战略收购
        - 高
        - 资本投向产品和增长，而不是紧急流动性
        - 即便融资强劲，未来烧钱速度也可能维持高位
      - - 反向翻转和 IPO 准备
        - Moneycontrol 和 ET 将反向翻转与潜在 IPO 准备、可能的税费支出联系起来
        - 低到中
        - 结构简化有助未来上市准备
        - 可能消耗部分新股资金
      - - 累计融资
        - 公司官方声明只称累计融资超过 $250M，而数据库列出的总额高得多
        - 中
        - 阻碍判断迄今吸收的累计资本
        - 估算稀释和融资效率时需要谨慎
      - - 现金与现金跑道
        - 未发现当前现金、债务或现金跑道披露
        - 中
        - 缺少这些，资本充足性仍是判断题，而不是模型题
        - 承保仍需要管理层专属证据
    notes: |
      该表聚焦前瞻充足性，而不是重复完整历史轮次时间线。新资金和老股流动性分开处理，因为只有新股所得款会增强运营流动性。
