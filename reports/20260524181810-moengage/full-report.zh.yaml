              MoEngage 当前的差异化推动明显转向 AI 辅助分析和优化，而不是简单活动执行。A/B testing 文档既描述人工分流，也描述 Merlin AI 驱动的动态分配；Campaign Insights
              Agent 把这套逻辑延伸到自然语言分析界面，可以诊断交付问题、比较历史活动并建议下一步行动。公开文档清楚说明，AI 层锚定 workspace 历史和活动语境，而不只是通用
              prompt。实验和分析栈仍受测量细节约束：MoEngage 明确警告，Analyze、Segmentation、Campaign stats 和 Flows
              使用不同计数约定和时区，运营人员如果天真比较各界面，可能误读表现。Release notes 和 package registries 还显示，2026 年 Android、iOS、React Native 和
              Flutter 开发节奏活跃，包括新的 Personalize 模块、proxy-domain support、频控和 build-fix
              工作。这是正面的维护信号，但也说明平台能力演进得足够快，会给客户带来版本管理工作。
