            title: 2025 年末轮次估值标记已接近牛市情景价格
            body: >-
              公开记录能解释 MoEngage 为什么能吸引资本，但还不能解释新投资人为什么应接受 2025 年末报道的估值区间。 在约 $850 million 至超过 $900 million
              的水平上，公司定价已经更像一个已被证明的优质 SaaS 结果，而不是一个带披露折价的私有软件资产。
