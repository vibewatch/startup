            body: >
              公开证据很擅长说明 MoEngage 如何收费，却很难说明客户实际付了多少。官方方案页面清晰地把业务分成核心 Growth 和 Enterprise 套件、连接渠道附加项，以及面向交易型基础设施的独立
              Inform 产品。计费文档补上了营销页面省略的机制：MTU 由 App 或 Site Opened 活动驱动，事件强度可以通过 fair-usage 公式重新定价可计费 MTU，Inform
              收费则绑定渠道和消息量。这足以识别一个真实的按用量计价 SaaS 模式，并且存在渠道敏感的成本驱动因素。但这不足以识别实际
              ACV、折扣或收入结构。订阅代码门槛和产品内比较方案流程，使商业结构只有在买方互动之后才可见；第三方定价指南发布的数字区间，也没有被官方页面证实。结果是，MoEngage 的变现框架可信，但公开价格发现很差。
