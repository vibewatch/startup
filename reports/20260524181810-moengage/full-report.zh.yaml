      - number: '7.4'
        title: 缓释成熟度与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              MoEngage 确实有可信的公开缓释措施。它记录了删除 API、路由控制、BYOK 选项、tokenized
              sending、SSO、2FA、访问审计和渠道合规工作流；这些措施有意义，因为它们正对客户互动供应商可能出错的区域。承销问题在于，这些控制是否在已安装客户基础中被一致部署、监测并商业化。公开证据在传输背后的合同包、详细事故复盘、送达率投诉指标，以及
              AI 治理或可解释性材料上仍然偏薄。投资人因此应关注可测量的破裂点，而不是宽泛叙事：客户或平台暂停、发件人质量恶化、状态事故反复、披露驱动的 App 摩擦，以及套件主导的定价压力。如果 MoEngage
              不能让隐私、路由和渠道控制层在运营上比更广市场更干净，缓释故事会很快变弱，因为产品已经运行在一个买方切换成本并非永远无限的品类中。
