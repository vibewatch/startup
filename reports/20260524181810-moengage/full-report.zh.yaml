      - number: '5.4'
        title: 信任、可靠性与技术约束
        blocks:
          - type: paragraph
            body: >-
              信任和可靠性信号扎实，但并非没有摩擦。MoEngage 公开宣传广泛合规覆盖和多个区域数据中心，BYOK 文档还比多数营销页面走得更深，解释了 envelope encryption、客户可控 AWS KMS
              选项，以及模型边界。Web 和 Personalize 文档也显示，安全部署是活跃工程议题：严格 CSP 可能阻断站内消息或个性化，直到 nonce support 和 allowlists
              被正确配置。Android 披露指南又增加一层运营要求，迫使客户思考 App 通过 SDK 收集哪些设备、互动和标识符数据。可靠性证据混合。公开状态页在 runDate 没有显示事故，但也记录了 2026 年 5
              月一次 ingestion lag，导致下游数据过期。UpGuard 持续监测的供应商页面增加了外部信任信号，但公开证据仍没有提供可下载审计包、模块级 uptime
              历史或量化实施时间线。关键约束不是功能稀缺，而是 MoEngage 的价值随着客户环境中的数据质量、集成纪律和治理卫生上下波动。
