companyProfile:
  summary: >-
    MoEngage is a private late-stage B2B SaaS company founded in 2014 by Raviteja Dodda and Yashwanth Kumar. It sells an
    omnichannel engagement platform spanning analytics, journeys, personalization, and transactional messaging, with
    AI-led positioning and usage-priced Growth and Enterprise plans. Public evidence points to a customer base of
    enterprise and consumer brands, a Series F financing cycle in late 2025, and a disclosure profile that is still too
    opaque for clean financial underwriting.
