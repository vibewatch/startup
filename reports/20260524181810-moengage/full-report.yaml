      - number: '3.2'
        title: Capability Convergence and Enterprise Fit
        blocks:
          - type: paragraph
            body: >-
              Capability breadth across the peer set is now wide enough that “omnichannel” by itself is not a moat.
              Braze, CleverTap, Insider, Iterable, WebEngage, Netcore, Salesforce, and Adobe all market some combination
              of unified data, journey orchestration, AI or agentic decisioning, analytics, and cross-channel execution.
              The practical differences are in depth and operating posture. Braze pairs strong product breadth with
              public-company scale, deep integrations, and explicit enterprise packaging. Salesforce and Adobe attach
              orchestration to large suite footprints, making them especially powerful when the buyer already relies on
              their CRM, data, or experience-cloud layers. CleverTap and MoEngage look more like direct mobile-first
              peers because both combine analytics, personalization, orchestration, and publicly visible entry
              packaging. Insider and WebEngage lean hard on cross-channel coverage, integrations, and migration
              narratives, while Iterable emphasizes enterprise-scale real-time decisioning but leaves pricing opaque.
              For MoEngage, this means wins depend on proving better time-to-value and easier day-to-day use, not on
              claiming a uniquely broad feature surface.
