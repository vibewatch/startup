      - number: '8.2'
        title: Public comps and 2026 multiple compression argue against a full private premium
        blocks:
          - type: paragraph
            body: >-
              The comparable set matters because MoEngage is being valued in a market that has already repriced software
              and martech risk. PitchBook's Q1 2026 guide says the median public SaaS EV to trailing revenue multiple
              fell to 3.3x, while Multiples.vc shows sales and marketing automation at only 1.8x EV to next-twelve-month
              revenue. That is a harsh backdrop for any private vendor asking investors to underwrite a premium mark
              without audited economics. The public-company set reinforces the point. Braze still delivers strong growth
              and disclosed retention metrics, but its May 2026 public market value is about $2.72 billion against
              $738.2 million of fiscal 2026 revenue. Salesforce and Adobe remain far larger, more diversified, and fully
              disclosed, yet trade around 3.55x and 4.03x price-to-sales respectively. Klaviyo, another growth marketing
              platform with filed revenue and customer data, carried a $4.45 billion market cap after reporting $1.234
              billion of 2025 revenue. Those references do not imply that MoEngage is weak; they imply that a private
              premium requires better proof than public sources currently provide.
