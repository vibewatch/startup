  - id: FR002
    title: Risk Transmission Map — How Compliance Drift Becomes Commercial Damage
    type: dag
    layout: wide
    summary: >-
      Directed map showing how consent, platform-policy, or routing errors can cascade into channel interruption,
      customer dissatisfaction, renewal pressure, remediation cost, and weaker growth economics.
    data:
      nodes:
        - id: n1
          label: Consent / revocation gap
          detail: Suppression logic or opt-out state is incomplete across channels
        - id: n2
          label: Template / policy rejection
          detail: WhatsApp, Apple, or Google flags the deployment or messages
        - id: n3
          label: Deliverability loss
          detail: Messages fail, inbox placement worsens, or channel access is throttled
        - id: n4
          label: Service lag / routing issue
          detail: Triggered or region-sensitive campaigns are delayed or misrouted
        - id: n5
          label: Customer trust decline
          detail: Marketers lose confidence in analytics, compliance, or timeliness
        - id: n6
          label: Renewal / expansion pressure
          detail: Usage or seat expansion slows and churn risk rises
        - id: n7
          label: Remediation cost spike
          detail: Engineering, legal, and support resources are diverted into fixes
        - id: n8
          label: Gross-margin pressure
          detail: Discounts, support load, and lower efficiency weaken unit economics
        - id: n9
          label: Roadmap slowdown vs. suites
          detail: More effort goes into compliance and less into differentiation
      edges:
        - from: n1
          to: n2
          label: bad consent state triggers platform or complaint issues
        - from: n1
          to: n3
          label: suppression errors reduce allowed sends
        - from: n4
          to: n5
          label: late or misrouted journeys hurt campaign trust
        - from: n2
          to: n3
          label: rejected templates or disclosures reduce channel availability
        - from: n3
          to: n5
          label: missed messages are visible to customers
        - from: n5
          to: n6
          label: lower trust hurts renewal and expansion
        - from: n2
          to: n7
          label: appeals and fixes consume legal / engineering time
        - from: n4
          to: n7
          label: incident response adds support and SRE cost
        - from: n6
          to: n8
          label: weaker growth plus concessions compress economics
        - from: n7
          to: n9
          label: resources shift from innovation to compliance
        - from: n9
          to: n6
          label: slower roadmap worsens competitive renewals
    approximationNotes: >-
      The graph is a synthesis of the cited policy, operational, and review evidence rather than a company-published
      causal model.
    claimRefs:
      - CR030
      - CR032
      - CR035
      - CR036
      - CR038
      - CR039
      - CR043
      - CR046
      - CR047
      - CR049
