        title: Implementation Surfaces and Data Architecture
        blocks:
          - type: paragraph
            body: >-
              Implementation evidence points to a product that sits between first-party data collection and
              multi-channel execution, with several integration surfaces rather than a single monolithic deployment
              pattern. API documentation maps regional data centers and base URLs, while Android and iOS SDK docs
              require explicit workspace and data-center configuration. The Android migration guide shows that MoEngage
              has shifted from manifest metadata toward code-based initialization, which is cleaner for modern apps but
              still adds implementation work. Server-side Personalize APIs sit inside the customer’s own rendering
              pipeline, and partner docs from Segment and mParticle show how identity, event, and consent data can be
              forwarded into MoEngage for segmentation and campaigning. This architecture is flexible, but it is not
              plug-and-play. Teams must align API keys, SDK bootstrapping, CSP policies, data-center routing, and
              partner connectors before journeys, personalization, or reporting become dependable.
