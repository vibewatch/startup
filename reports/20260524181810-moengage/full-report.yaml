      - number: '1.2'
        title: Founders, Leadership Bench, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is straightforward even if the governance picture is not. Raviteja Dodda remains the
              public face of the company as CEO, while Yashwanth Kumar carries the technical, security, and privacy
              remit as CTO, CISO, and named DPO in the privacy policy. That combination implies unusually high founder
              concentration around both product direction and trust architecture. Beyond the founders, public profiles
              identify Narasimha Reddy in finance and strategic initiatives and Yashwanth Reddy in revenue leadership,
              which is enough to show some functional depth across finance and go-to-market. What is missing is just as
              important: official pages do not publish a clear board roster, committee structure, or investor control
              summary. Tracxn suggests there are seven active board members, but the only names that are easy to verify
              in the fetched corpus are the founders and a few partially exposed director names. For diligence purposes,
              that means public evidence supports founder continuity and some executive depth, but not a clean view of
              who actually governs the company after the large 2025 financing rounds.
