      - number: '3.3'
        title: Pricing, Review Signals, and Procurement Trade-offs
        blocks:
          - type: paragraph
            body: >-
              Commercial posture is one of the clearest ways MoEngage still stands apart. Its public pricing page
              explains product families, MTUs, website-personalization add-ons, and even one-year commitments for Growth
              and Enterprise plans. CleverTap also exposes a public entry tier and free trial. By contrast, Braze
              presents tier logic but keeps exact contract pricing behind sales while layering MAUs and action credits;
              Iterable does not disclose pricing publicly; Adobe is largely demo-led; and Salesforce publishes modular
              pricing that can become expensive once personalization and analytics are added. Review surfaces reinforce
              those trade-offs rather than pointing to a single winner. Braze tends to show stronger enterprise
              sentiment or review volume, MoEngage generally holds comparable ratings with easier-adoption messaging,
              and CleverTap appears as the closest like-for-like mobile-first alternative. The procurement implication
              is that MoEngage benefits when buyers dislike opaque pricing and want non-technical teams to move quickly,
              but it can lose ground when enterprise committees prioritize scale, ecosystem breadth, or deeply proven
              large-account references.
