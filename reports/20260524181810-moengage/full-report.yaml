  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation chain runs from real financing momentum through comp compression and disclosure gaps to a
      research-more call.
    data:
      nodes:
        - id: financing
          label: Financing momentum is real
          detail: MoEngage closed a $100M round and then a $180M extension in late 2025
        - id: traction
          label: Commercial relevance exists
          detail: Press and official materials point to 1,350-plus brands, enterprise traction, and global revenue exposure
        - id: comp-backdrop
          label: 2026 software multiples are tighter
          detail: PitchBook and Multiples.vc show compression and weak sales-automation sector marks
        - id: opaque
          label: Private-company opacity remains high
          detail: No public cap table, current margin set, or audited retention bridge is available
        - id: range
          label: Public output is a range, not a mark
          detail: Scenario bands are useful guardrails but do not validate the reported late-2025 valuation
        - id: recommendation
          label: Research-more
          detail: Diligence and entry price, not narrative momentum, determine whether the deal is investable
      edges:
        - from: financing
          to: traction
          label: Demand confirms relevance
        - from: traction
          to: comp-backdrop
          label: Quality still meets market reality
        - from: comp-backdrop
          to: opaque
          label: Tighter comps raise burden of proof
        - from: opaque
          to: range
          label: Missing inputs block precision
        - from: range
          to: recommendation
          label: Use valuation bands as entry discipline
    approximationNotes: >-
      Decision flow only; it summarizes the analytical dependencies behind the recommendation rather than a timeline or
      operating model.
    claimRefs:
      - CV001
      - CV004
      - CV015
      - CV032
      - CV033
      - CV042
      - CV051
