      - CV042
      - CV043
      - CV047
      - CV052
      - CV053
      - CV054
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Public-only enterprise-value bands for bear, base, and bull underwriting cases.
    data:
      items:
        - label: Bear band
          low: 300
          mid: 375
          high: 450
          unit: USD M
          detail: Sector compression plus unresolved opacity and weaker-than-assumed revenue quality
        - label: Base band
          low: 450
          mid: 550
          high: 650
          unit: USD M
          detail: Real scale and relevance, but still below reported press marks because premium proof is missing
        - label: Bull band
          low: 750
          mid: 825
          high: 900
          unit: USD M
          detail: >-
            Premium SaaS economics and clean seniority are proven privately and the market remains open to stronger
            software names
    approximationNotes: >-
      These are scenario bands, not observed market marks. They assume the late-2025 ARR commentary is directionally
      correct and therefore should be used only as disciplined screening ranges.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: Compact scoring of the current investment case based on public evidence quality rather than management access.
    approximationNotes: >-
      Scores are qualitative 0-10 judgments synthesized from the chapter evidence and are not generated by a formal
      scoring model.
    data:
      items:
        - label: Market relevance
          value: 7
          unit: /10
          detail: Financing momentum and global brand footprint suggest real category fit
        - label: Traction proof
          value: 7
          unit: /10
          detail: ARR commentary and enterprise adoption look credible but incomplete
        - label: Disclosure quality
          value: 2
          unit: /10
          detail: Current margin, cash, retention, and cap-table data are not public
        - label: Economics proof
          value: 3
          unit: /10
          detail: Premium-case software economics are still mostly inferred, not disclosed
        - label: Competitive insulation
          value: 4
          unit: /10
          detail: Suite consolidation and AI-led bundling reduce multiple support for point solutions
        - label: Valuation support
          value: 3
          unit: /10
          detail: Reported late-2025 marks look difficult to support from public evidence alone
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV015
      - CV032
      - CV033
      - CV042
      - CV047
      - CV048
      - CV051
