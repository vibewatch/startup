    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Ordinal 0-10 sensitivity scores for the issues that most change MoEngage's supportable valuation.
    data:
      items:
        - label: Audited revenue and gross-margin disclosure
          value: 10
        - label: Fully diluted cap table and preferences
          value: 9
