          label: Ingest customer data
          detail: Events, identities, and partner-fed records enter via APIs, SDKs, or CDPs.
        - id: segments
          label: Resolve audiences
          detail: Segments, cohorts, and targeting rules translate raw data into reachable audiences.
        - id: journeys
          label: Design journeys and alerts
          detail: Teams configure campaigns, flows, experiments, or transactional alert templates.
        - id: delivery
          label: Execute across channels
          detail: MoEngage delivers push, email, SMS, RCS, WhatsApp, cards, or on-site surfaces depending on use case.
        - id: measure
          label: Measure outcomes
          detail: Analytics, campaign stats, and flow metrics expose opens, clicks, conversions, and trips.
        - id: optimize
          label: Optimize with experiments and AI
          detail: A/B testing and Campaign Insights Agent feed the next decision loop.
      edges:
        - from: data
          to: segments
        - from: segments
          to: journeys
        - from: journeys
          to: delivery
        - from: delivery
          to: measure
        - from: measure
          to: optimize
        - from: optimize
          to: journeys
    approximationNotes: >-
      This flow abstracts the documented operating loop and does not imply that every customer uses every module in a
      single deployment.
