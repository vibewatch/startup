  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Cap-table seniority is worse than implied
        - Material liquidation preferences, ratchets, or secondary-heavy structures sit above new equity
        - Upside at the common-equity layer compresses even if operating performance holds
        - Reprice sharply downward or walk away
      - - ARR does not convert to high-quality revenue
        - Audited revenue, gross margin, or retention trail the premium case
        - The growth narrative stops supporting premium software multiples
        - Hold at research-more or move to avoid at the reported price
      - - Current NRR or gross retention is materially below premium SaaS thresholds
        - Retention is well below the levels typically associated with 7x-plus revenue multiples
        - Expansion-led comp logic breaks and the market likely applies a lower sector multiple
        - Shift toward the bear band and tighten return hurdle
      - - Suite consolidation accelerates
        - Win-loss data shows Salesforce, Adobe, HubSpot, or similar suites taking budget on bundle economics
        - Standalone engagement vendors lose pricing power and multiple expansion potential
        - Lower comp assumptions and require stronger moat evidence
      - - IPO-readiness remains mostly narrative
        - Reverse-flip progress is not matched by public-company-grade reporting and controls
        - Exit optionality stays theoretical rather than bankable
        - Model only private exits and refuse IPO-style pricing
    notes: >-
      These are explicit multiple-break triggers rather than generic risks. Each one changes either the valuation
      framework or the ownership economics that the investor actually receives.
