  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization Architecture and Pricing Opacity
        blocks:
          - type: paragraph
            body: >
              Public evidence is unusually good at showing how MoEngage charges, but weak at showing what customers
              actually pay. Official plan pages clearly segment the business into a core Growth and Enterprise suite,
              connected-channel add-ons, and a separate Inform product for transactional infrastructure. Billing
              documentation adds the mechanics that the marketing pages omit: MTUs are driven by App or Site Opened
              activity, event intensity can reprice billable MTUs through a fair-usage formula, and Inform charges are
              tied to channels and message volumes used. That is enough to identify a real usage-priced SaaS model with
              channel-sensitive cost drivers. It is not enough to identify realized ACV, discounting, or revenue mix.
              Subscription-code gating and in-product compare-plan flows make the commercial structure visible only
              after buyer engagement, and third-party pricing guides publish numeric ranges that official surfaces do
              not corroborate. The result is a credible monetization framework with poor public price discovery.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
