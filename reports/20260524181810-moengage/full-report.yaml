  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing
        blocks:
          - type: paragraph
            body: >-
              MoEngage sits inside a market that analysts describe with materially different boundaries. Customer
              engagement solutions reports cluster around a mid-sized software-and-services category, while broader
              marketing automation studies count a wider stack of campaign management, analytics, orchestration, and
              channel tooling. Adjacent CDP reports are much smaller in absolute dollars but grow faster, because data
              unification increasingly determines whether an orchestration layer can personalize in real time. Mobile
              context matters too: app usage and the broader mobile economy keep buyer attention on owned, always-on
              engagement workflows. The practical diligence conclusion is that the biggest generic TAM number is the
              least useful one. A defensible market view for MoEngage is the overlap between omnichannel orchestration,
              mobile engagement, and first-party data activation. That overlap is large enough to support category
              growth, but too fuzzy to support a simplistic single-TAM valuation narrative.
