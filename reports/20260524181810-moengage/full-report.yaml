  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              MoEngage is not competing inside a clean, one-vendor lane. Buyers can solve the same job through direct
              mobile-first customer engagement platforms such as Braze and CleverTap, broader omnichannel challengers
              such as Insider, Iterable, WebEngage, and Netcore, enterprise suites such as Salesforce and Adobe,
              composable data-led stacks that combine CDP, analytics, and execution tools, or simply by extending
              existing CRM and internal messaging infrastructure. The public record shows why this matters for
              diligence. Official product pages across nearly every rival now combine customer data, AI-assisted
              personalization, journey orchestration, analytics, and multichannel delivery into one narrative. That
              means the competitive question is less “does MoEngage send better campaigns?” and more “which architecture
              reduces integration drag, accelerates deployment, and still scales into enterprise governance?” MoEngage
              remains strongest where buyers want mobile-first execution with faster adoption, but the field is crowded
              enough that direct feature parity is no longer the main separator.
