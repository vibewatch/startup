      - - Cash, burn, debt, and runway
        - Needed to test whether Series F actually covers hiring, restructuring, and M&A ambitions
        - No public consolidated cash or debt schedule found
        - Blocking
        - Request latest balance sheet, debt agreements, and cash-flow scenarios
      - - CAC, payback, and sales cycle
        - Needed to assess whether enterprise growth is efficient and repeatable
        - No public current disclosure found
        - Material
        - Request pipeline conversion data, payback model, and cohort acquisition costs
      - - Consolidated audited statements
        - Needed to reconcile India-entity filings with group economics
        - Publicly accessible evidence is limited to summaries of MCA-linked data and media reports
        - Blocking
        - Request audited group financials and reconciliation to statutory Indian entity
      - - Valuation support
        - Needed to decide whether the late-2025 financing reflects $750M, $850M, >$900M, or $1.1B economics
        - Public references conflict and official announcements omit a number
        - Material
