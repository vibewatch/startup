  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Cross-Border Risks
        blocks:
          - type: paragraph
            body: >-
              MoEngage’s public materials show a serious privacy-and-transfer surface rather than a light-touch martech
              footprint. The privacy policy was updated in January 2026, the help corpus documents erasure, access,
              rectification, and portability workflows, and the SDK documentation exposes regional routing choices that
              customers can configure for data-policy reasons. Those controls are useful, but they do not reduce the
              underlying legal burden. A customer-engagement vendor that stores or activates personal data across
              messaging, analytics, and profile surfaces still has to stay aligned with GDPR transfer rules, India’s
              DPDP perimeter, and California enforcement. MoEngage’s own disclosures also acknowledge sub-processor
              transfers outside a user’s country of residence. The main underwriting issue is therefore not whether
              MoEngage knows these regimes exist; it is whether the company can keep contractual transfer mechanics,
              deletion SLAs, routing choices, and customer implementation guidance tight enough as jurisdictions keep
              moving.
