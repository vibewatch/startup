  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact by Risk Category
    type: matrix
    layout: wide
    summary: >-
      Matrix ranking eight major MoEngage risk categories by likelihood, impact, and residual exposure. The highest
      residual exposures are privacy-transfer failure, consent drift, platform suspension, and suite-led
      commoditization.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual Exposure
      rows:
        - label: GDPR / SCC transfer failure
          values:
            - Medium
            - High
            - High — contractual mechanics are not fully public
        - label: India DPDP implementation drift
          values:
            - Medium
            - Medium-High
            - Medium-High — cross-border rules and board practice can evolve
        - label: Consent / opt-out sync failure
          values:
            - Medium-High
            - High
            - High — can trigger multi-channel complaints or suspension
        - label: WhatsApp template or policy suspension
          values:
            - Medium
            - High
            - High — high-intent channel dependence can break abruptly
        - label: Apple / Google disclosure friction
          values:
            - Medium
            - High
            - Medium-High — customer release cycles can stall
        - label: Service lag or incident recurrence
          values:
            - Medium
            - Medium-High
            - Medium — public status visibility helps but does not remove customer harm
        - label: Analytics / retention trust erosion
          values:
            - Medium
            - Medium
            - Medium — review evidence points to ongoing friction
        - label: Suite commoditization and price compression
          values:
            - High
            - High
            - High — broad suites now market overlapping AI and journey surfaces
    approximationNotes: >-
      Likelihood and impact ratings are qualitative judgments grounded in the cited sources and the public evidence gaps
      identified in this chapter as of 2026-05-24.
