              natural-language analytics surface that diagnoses delivery issues, compares historical campaigns, and
              recommends next actions. Public docs make clear that this AI layer is anchored to workspace history and
              campaign context, not just generic prompts. The experimentation and analytics stack is still bounded by
              measurement nuance: MoEngage explicitly warns that Analyze, Segmentation, Campaign stats, and Flows use
              different counting conventions and time zones, so operators can misread performance if they compare
              surfaces naïvely. Release notes and package registries also show an active 2026 developer cadence across
              Android, iOS, React Native, and Flutter, including new Personalize modules, proxy-domain support,
              frequency controls, and build-fix work. That is a positive maintenance signal, but it also suggests a
