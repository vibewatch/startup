        - from: d7
          to: d1
          label: customer implementation quality
        - from: d1
          to: d9
          label: engagement and messaging outcomes
        - from: d8
          to: d9
          label: procurement and pricing alternatives
        - from: d8
          to: d1
          label: feature and margin pressure
    approximationNotes: >-
      Dependencies are framed from a risk perspective; the map emphasizes nodes that can interrupt deployment, delivery,
      or commercial differentiation.
