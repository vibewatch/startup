  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: MoEngage product quality depends on customer data quality, secure configuration, and stable downstream routing.
    data:
      nodes:
        - id: workflow
          label: MoEngage workflows
          detail: Core node spanning campaigns, personalization, analytics, and transactional messaging.
        - id: data
          label: First-party identity and event data
          detail: Segments and personalization need correct upstream user and event signals.
        - id: partners
          label: Partner connectors and CDPs
          detail: Segment and mParticle can feed data and identity context into MoEngage.
        - id: routing
          label: Regional routing and auth
          detail: Correct data-center selection and API credentials gate platform access.
        - id: websec
          label: CSP and privacy controls
          detail: Web and mobile deployments need browser allowlists, nonce support, and disclosure discipline.
        - id: ops
          label: Operational reliability
          detail: Status history and external monitoring show the need for stable ingestion and service health.
      edges:
        - from: workflow
          to: data
        - from: workflow
          to: partners
        - from: workflow
          to: routing
        - from: workflow
          to: websec
        - from: workflow
          to: ops
        - from: partners
          to: data
        - from: routing
          to: ops
