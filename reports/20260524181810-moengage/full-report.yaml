          label: AWS KMS / cloud region choices
          detail: Key custody and regional delivery dependencies
        - id: d7
          label: Customer engineering / legal teams
          detail: Consent capture, manifests, routing, and policy setup
        - id: d8
          label: Salesforce / Adobe / Braze / Microsoft
          detail: Bundled suite competitors with overlapping features
        - id: d9
          label: Enterprise customers
          detail: Renewal, expansion, and deployment outcomes
      edges:
        - from: d2
          to: d1
          label: channel policy and template approvals
        - from: d3
          to: d7
          label: SDK privacy review obligations
        - from: d4
          to: d7
          label: data-safety and user-data declarations
        - from: d5
