      - number: '2.2'
        title: Buyer Segments, Budget Ownership, and Procurement Logic
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests this category is bought less like a single-channel campaign tool and more like
              shared operating infrastructure. Large enterprises still dominate current revenue in customer engagement
              and CDP markets, while SMEs contribute faster deployment growth where cloud pricing lowers entry barriers.
              Retail, BFSI, and consumer-facing verticals remain the clearest current demand pools, with healthcare
              often flagged as a fast grower when compliance and personalization matter together. The actual buyer map
              is cross-functional: CRM and lifecycle marketing teams use the system daily, but data-platform, service,
              and IT stakeholders influence approval because these products only work when customer profiles, channels,
              and response workflows are connected. Salesforce and Twilio both point to the same practical issue: buyers
              want conversational, real-time engagement, but many still lack complete data access. That pushes
              procurement toward vendors that can either integrate cleanly into a composable stack or provide a broader
              suite with fewer operational seams.
