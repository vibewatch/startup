      - number: '8.3'
        title: The evidence supports a range, not a clean mark
        blocks:
          - type: paragraph
            body: >-
              A public-only valuation exercise can still be useful, but only as an entry-discipline tool. If the roughly
              $100 million ARR commentary from late 2025 is directionally correct, then the reported $850 million to
              greater-than-$900 million marks imply about 8.5x to more than 9x ARR, and the $1.1 billion database
              reference implies roughly 11x. Those levels are not impossible for a premium SaaS company, but the same
              public record does not disclose the gross margin, current net retention, free cash flow, or preference
              stack that would justify paying above public medians and above disclosed engagement-software comps. The
              bear case therefore assumes the public market rather than management narrative is the right anchor, the
              base case assumes MoEngage is better than generic sector averages but still deserves a private-opacity
              discount, and the bull case requires private diligence to prove that MoEngage's growth and revenue quality
              are materially stronger than the public record shows. That logic supports a research-more recommendation
              and a stretched valuation stance at the late-2025 reported marks.
