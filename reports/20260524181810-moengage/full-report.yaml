      - number: '1.5'
        title: Risk Signals, Adverse Checks, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The overview risk picture is less about a known blow-up and more about what public evidence still cannot
              settle. The fetched corpus did not surface a documented lawsuit, breach, or regulatory enforcement action
              against MoEngage, but it did surface a standing external vendor-risk report from UpGuard and repeated
              internal inconsistency across company metrics. Funding totals range from a company-linked “exceeds $250
              million” to database estimates near $295 million and one profile above $487 million. Headcount and
              office-footprint disclosures are similarly messy, spanning more than 650 employees in 2022, 700+ on the
              about page, about 800 in late-2025 coverage, and higher third-party estimates elsewhere. Those
              discrepancies do not prove a problem, but they do raise reporting-discipline questions. Governance is
              another live gap: investors are named, secondary sales are discussed, and a reverse flip is underway, yet
              public materials still do not show who controls the board or what rights large investors hold. For
              underwriting, the most material unknowns are current valuation, lifetime capital, board control, and
              consolidated operating performance—not basic company existence or product relevance.
