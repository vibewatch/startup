    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              MoEngage is consistently presented as a customer-engagement software company, but the exact identity it
              projects matters for later diligence. Official pages describe a cross-channel platform for marketers and
              product owners, while product pages break that into analytics, journey orchestration, personalization, and
              transactional messaging. That supports a late-stage enterprise software reading rather than an agency or
              point-tool business. Headquarters framing is less tidy. The contact page leads with San Francisco and
              public databases also use San Francisco, yet late-2025 and early-2026 company materials describe the
              business as Bengaluru- and San Francisco-headquartered. The most reasonable interpretation is that
              MoEngage still operates with a dual US-India identity while preparing for a legal and capital-markets
              shift toward India. Public scale claims are directionally strong but not normalized: depending on the
              surface, the company cites 60 or 75 countries, 1.6 to 2.0 billion consumers reached monthly, and multiple
              different message-volume metrics. Those inconsistencies are meaningful because they make the business look
              larger, but not yet cleanly measurable, from outside.
