  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Current competitive win-loss, churn, and migration-success data for MoEngage versus Braze, CleverTap, Insider, Iterable, WebEngage, and suite incumbents.
    whyItMatters: Public product pages and review sites show positioning and pain points, but they do not reveal whether MoEngage is actually winning, retaining, or displacing the right customers at scale.
    diligencePath: Request management win-loss analysis, cohort retention by segment, migration case studies, and named displacement evidence from the last 12 months.
    relatedQuestionRefs:
    - QP031
    relatedTableRefs:
    - TP005
  - type: missing-source
    severity: material
    topic: enterprise-contract-pricing
    missingEvidence: Normalized current contract values, discount norms, and usage-overage economics across MoEngage and the major competitors.
    whyItMatters: The public record is strong on packaging posture but weak on actual negotiated economics, which limits any rigorous TCO comparison across vendors.
    diligencePath: Collect live proposals, customer references, and renewal benchmarks from recent enterprise deals across at least three overlapping segments.
    relatedQuestionRefs:
    - QP032
    relatedTableRefs:
    - TP004
