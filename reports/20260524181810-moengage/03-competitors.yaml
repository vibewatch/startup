- id: TP004
  title: Pricing / Packaging Comparison
  columns:
  - Vendor
  - Public pricing posture
  - Commercial driver
  - Transparency signal
  - Implication for buyers
  rows:
  - - MoEngage
    - Growth and Enterprise plans published; pricing explained through MTUs and product families
    - Monthly tracked users, add-ons, and one-year commitments for Growth / Enterprise
    - Higher than most direct peers because the site defines MTUs, plan families, and contract minimums
    - Helpful when buyers want to budget before a demo, but still not a full enterprise quote sheet
  - - Braze
    - Tier names and packaging are public; exact contract values remain behind sales
    - MAUs plus Action Credits, with higher tiers adding governance and AI capabilities
    - 'Medium: buyers can see packaging logic but not list-price contracts'
    - Enterprise-friendly structure, but cost predictability still depends on sales negotiation and usage assumptions
  - - CleverTap
    - Public starter price and MAU tiers are posted alongside Advanced and Cutting Edge plans
    - MAU-based plans, add-ons, and free-trial entry
    - High relative transparency for a direct peer
    - Makes CleverTap a frequent apples-to-apples price benchmark against MoEngage in mid-market and mobile-first deals
  - - Iterable
    - No public pricing disclosed in the reviewed sources
    - Custom quote based on requirements and likely message / contact scope
    - 'Low: buyers must engage sales early'
    - Opaque pricing can slow shortlist comparison even when the platform is feature-rich
  - - WebEngage
    - Current official pricing was not cleanly retrievable; recent third-party market commentary estimates custom annual pricing
    - Custom MAU-based and scope-based contracts per recent alternative-market coverage
    - Low to medium because the strongest public number is third-party rather than official
    - Price discovery may require more vendor interaction than MoEngage or CleverTap
  - - Salesforce Marketing Cloud
    - Public module pricing is visible for core editions and add-ons
    - Per-org monthly pricing plus separate personalization and analytics modules
    - High for published modules, though full-suite spend still depends on mix
    - Buyers can model entry cost, but bundle expansion can quickly raise total platform spend
  - - Adobe Journey Optimizer
    - Demo-led and consultation-led rather than list-price led in the reviewed official materials
    - Platform adoption, data scale, and enterprise complexity
    - Low on explicit public price points
    - Best suited to enterprises already comfortable with Adobe-platform procurement rather than buyers seeking fast list-price comparison
  notes: WebEngage pricing range is third-party-reported rather than confirmed on a current official price page. Adobe rows reflect the absence of public list pricing in fetched official materials, not a judgment that the product is overpriced.
