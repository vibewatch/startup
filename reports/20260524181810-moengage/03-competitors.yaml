  - CP012
  - CP017
  - CP029
  - CP037
  - CP038
  - CP053
  - CP054
- id: TP005
  title: Moat Durability / Competitive Risk Register
  columns:
  - MoEngage defense
  - Threat source
  - Evidence basis
  - Severity
  - Diligence implication
  rows:
  - - Mobile-first omnichannel engagement with analytics
    - Braze and CleverTap already offer similar mobile-first lifecycle depth
    - Direct product pages and peer review comparisons show overlapping channel, analytics, and personalization narratives
    - High
    - Validate where MoEngage wins materially on setup speed, outcomes, or channel performance rather than on feature checklists alone
  - - Accessible packaging and non-technical usability
    - Insider, MoEngage, and others now market migration help and ease-of-use directly against incumbents
    - Migration programs, free-trial entry, and no-lock-in messaging are public across multiple vendors
    - Medium
    - Ask management for migration win rates, time-to-live, and competitive replacement case studies
  - - Pricing transparency advantage
    - CleverTap is comparably transparent and Salesforce exposes published module prices
    - Public CleverTap and Salesforce pricing pages reduce MoEngage’s visibility edge
    - Medium
    - Check whether MoEngage still converts transparency into shorter sales cycles or lower CAC
  - - AI and personalization differentiation
    - Peers and suites now all market AI, recommendations, and next-best-action capabilities
    - Official pages from Braze, Insider, Salesforce, Adobe, Netcore, and Iterable converge heavily on AI-led decisioning
    - High
    - Focus diligence on measured lift, adoption, and workflow usability instead of headline AI language
  - - Mid-market and APAC strength
    - Regional buyers can still choose WebEngage, Netcore, CleverTap, or Insider
    - Regional alternative articles and official pages show multiple credible APAC-heavy substitutes
    - Medium
    - Test whether MoEngage has a durable regional channel or partner advantage rather than just brand familiarity
  - - Specialist positioning versus suites
    - Salesforce and Adobe can bundle adjacent CDP, analytics, and governance layers
    - Official suite pages plus industry commentary frame integrated ecosystems as the strategic direction of travel
    - High
    - Underwrite MoEngage as a specialist that must beat suite complexity on ROI and speed, not as a category monopolist
  notes: Severity reflects how directly the threat can narrow MoEngage’s procurement advantage over the next 12–24 months, not a prediction that the threat will certainly materialize in every segment.
