tables:
- id: TP001
  title: Competitive Landscape by Buyer Architecture
  columns:
  - Alternative class
  - Representative options
  - Why buyers choose it
  - Structural advantage
  - Limitation
  - Implication for MoEngage
  rows:
  - - Direct mobile-first CEP peers
    - Braze; CleverTap; Insider; Iterable
    - Need cross-channel engagement, personalization, analytics, and lifecycle orchestration in one system
    - Fast path from data to execution; strong marketing-team ownership
    - Product narratives increasingly converge around AI, analytics, and orchestration
    - MoEngage wins only if it proves easier adoption, better mobile-first fit, or lower procurement friction
  - - Regional or APAC-heavy challengers
    - WebEngage; Netcore
    - Want retention-led engagement with strong regional relevance and cost sensitivity
    - Broad B2C retention tooling with local-market familiarity
    - Less public enterprise-scale validation than Braze or suite incumbents
    - Keeps MoEngage from owning APAC by default and compresses regional differentiation
  - - Suite incumbents
    - Salesforce Marketing Cloud; Adobe Journey Optimizer
    - Already run CRM, data, or experience workflows on the same cloud and want fewer seams
    - Bundle data, analytics, governance, and orchestration across larger enterprise estates
    - Higher complexity, heavier implementation, and potentially higher total spend
    - They are the main source of bundling pressure in large-enterprise deals
  - - Composable or data-led stack
    - CDP plus analytics plus execution tools
    - Prefer best-of-breed control and vendor-agnostic architecture
    - High flexibility and better fit for teams with strong data engineering
    - Requires more internal integration capability and operating discipline
    - Reduces the value of any one execution vendor unless it lowers stack complexity
  - - Status quo / internal build
    - Existing CRM, messaging infra, service providers, or internal workflows
    - Avoids a major platform migration and reuses current tools
    - Lowest perceived switching risk in the short term
    - Weak orchestration, fragmented data, and slow iteration
    - MoEngage still must displace non-vendor inertia, not just another SaaS logo
  - - Likely entrants / overlays
    - AI agents, personalization overlays, adjacent CDP or CRM add-ons
    - Add decisioning or content intelligence without a full rip-and-replace
    - Can land alongside existing systems and expand over time
    - Often depend on the incumbent data or execution layer underneath
    - Further reduces the odds that buyers treat engagement orchestration as a closed category
  notes: Rows describe the main ways buyers can solve the same customer-engagement job in 2026, not mutually exclusive market segments. Many enterprises run more than one class at the same time.
