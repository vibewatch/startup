- id: TP002
  title: Competitor Profile Table
  columns:
  - Vendor
  - Category
  - Scale / ownership signal
  - Target segment
  - Differentiation
  - Limitation versus MoEngage or as a buyer choice
  rows:
  - - Braze
    - Direct customer engagement platform
    - Public company; FY2026 revenue $738.2M; 2,609 customers; 333 customers with ARR >$500k
    - Digital-first and enterprise brands needing deep cross-channel orchestration
    - Public-company scale, broad integrations, strong mobile and cross-channel depth, explicit enterprise packaging
    - Higher complexity and quote-led pricing can raise adoption and budgeting friction for smaller teams
  - - CleverTap
    - Direct mobile-first analytics and engagement platform
    - Private; publicly visible MAU-based starter tier and enterprise plans
    - B2C brands wanting analytics-heavy retention and personalization
    - Closest like-for-like mobile-first rival; public entry pricing; strong analytics and personalization positioning
    - Less visible large-enterprise scale signal than Braze or suite incumbents
  - - Insider One
    - Omnichannel engagement plus CDP-style platform
    - Private; 100+ integrations; 2,000+ customers claimed
    - Global enterprise and digital commerce teams wanting one platform across many channels
    - Aggressive migration story, broad native channels, strong personalization and CDP framing
    - Vendor messaging is highly comparative and may overstate parity versus established suites
  - - Iterable
    - AI customer engagement platform
    - Private; enterprise-scale positioning but no public pricing
    - Marketing teams that want flexible journeys and real-time personalization at scale
    - Strong AI decisioning and unified-data narrative; enterprise-grade reliability positioning
    - Less transparent pricing and a recurring learning-curve critique from review coverage
  - - WebEngage
    - Retention suite with CDP, analytics, and orchestration
    - Private; third-party review surfaces describe enterprise and SMB use across ten channels
    - APAC-oriented B2C brands focused on retention, analytics, and lifecycle automation
    - Broad stack across CDP, personalization, analytics, AI, and channel execution
    - Public market voice raises concerns about in-app depth, trigger speed, and cost-value fit
  - - Netcore
    - AI-first personalization and customer engagement suite
    - Private; documentation-heavy stack with personalization, analytics, and channel suite
    - Retail, commerce, and B2C teams wanting personalization plus messaging breadth
    - Strong AI-first personalization narrative and 9-channel coverage with CDP/identity components
    - Less publicly normalized pricing and fewer independent large-enterprise reference points
  - - Salesforce Marketing Cloud
    - Suite incumbent / CRM-adjacent marketing cloud
    - Public suite vendor with modular product pricing and cross-cloud distribution
    - Large enterprises already invested in Salesforce CRM, data, service, or sales workflows
    - Bundles CDP, personalization, analytics, automation, loyalty, and AI across one ecosystem
    - Can be expensive and operationally heavy, especially once add-ons and cross-cloud deployment expand
  - - Adobe Journey Optimizer
    - Suite incumbent / AEP-native journey orchestration
    - Public suite vendor built on Adobe Experience Platform
    - Mid-market and enterprise teams needing governed real-time orchestration across many brands or regions
    - Strong real-time profile, consent, and governance posture on top of AEP
    - Best fit often assumes Adobe platform adoption, which can raise switching cost and implementation scope
  notes: The table emphasizes scale signals, segment fit, and procurement posture rather than trying to normalize private-company funding data that are inconsistently public across vendors.
