- id: TP003
  title: Capability / Enterprise-Fit Comparison
  columns:
  - Vendor
  - Data and analytics stance
  - AI / personalization stance
  - Channel / orchestration stance
  - Governance / enterprise-fit signal
  - Migration / support signal
  rows:
  - - MoEngage
    - Officially bundles analytics, insights, MTU-based measurement, and enterprise scale claims
    - Merlin AI plus behavior-based and web/app personalization
    - Cross-channel marketing plus transactional alerts and website personalization
    - Enterprise plan adds access controls and local data-server / IP-whitelisting options
    - Migration Program and partner ecosystem are explicit parts of the public pitch
  - - Braze
    - Data activation, segmentation, insights, reporting, and strong public operating metrics
    - BrazeAI, predictive intelligence, personalized paths, and recommendations
    - Journey builder, cross-channel action, experimentation, and paid plus owned touchpoints
    - Enterprise tier adds governance, infrastructure, and security depth
    - Extensive partner ecosystem helps integration, but onboarding and reporting are frequent review pain points
  - - CleverTap
    - Customer data and analytics are core to the platform narrative and pricing tiers
    - CleverAI plus hyper-personalization and advanced analytics in higher tiers
    - Omnichannel orchestration across push, email, WhatsApp, RCS, web, and in-app
    - Advanced and Cutting Edge tiers add role-based access and customizable support
    - Free-trial entry lowers adoption friction versus quote-only peers
  - - Insider One
    - Actionable CDP, reporting, data, and behavioral analytics are central to the platform story
    - Generative, predictive, and agentic AI sit inside one platform narrative
    - 12+ native channels and journey orchestration with heavy omnichannel messaging
    - Enterprise-grade reliability with localized customer service and large-volume claims
    - Public messaging attacks lock-in directly through migration-without-hidden-costs claims
  - - Iterable
    - Unified behavioral, product, and engagement data with analytics and performance insight layers
    - Real-time AI decisioning and Nova agents/insights
    - Cross-channel experiences and workflow automation across every channel
    - Enterprise-grade performance, reliability, and security are heavily emphasized
    - Third-party reviews still describe a meaningful learning curve and opaque pricing
  - - WebEngage
    - Product and revenue analytics, segmentation, CDP, and AI are exposed as first-class modules
    - AI, predictive segmentation, recommendations, and intelligent campaign orchestration
    - Campaign orchestration plus omnichannel engagement across push, email, WhatsApp, SMS, and more
    - Customer support, partners, integrations, and growth consulting are visible parts of the offer
    - Alternative-market commentary suggests switching often reflects UI, latency, and in-app limitations
  - - Salesforce Marketing Cloud
    - Customer Data Platform and Marketing Analytics are separate but tightly connected modules
    - Agentforce, real-time personalization, and analytics automation are built into the cross-cloud story
    - Cross-channel marketing and two-way conversations are central to the refreshed positioning
    - Strongest when buyers already use Salesforce across CRM, service, or sales
    - Migration is less about a single tool swap and more about standardizing on a broader enterprise stack
  - - Adobe Journey Optimizer
    - Unified profiles, audiences, and reporting are native to AEP-linked workflows
    - AI decisioning, journey optimization, send-time optimization, and dynamic content are built in
    - Real-time journeys plus campaign orchestration across email, web, app, mobile, and in-person moments
    - Consent, privacy, governance, and multibrand / multiregion controls are prominent
    - Best for teams willing to adopt Adobe platform processes rather than a light-weight point solution
  notes: Cells summarize what public sources explicitly expose in product, documentation, and pricing surfaces. They do not imply that every vendor is equally strong in production depth for each module.
