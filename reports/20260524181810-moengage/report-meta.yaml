companyProfile:
  summary: MoEngage is a private late-stage B2B SaaS company founded in 2014 by Raviteja Dodda and Yashwanth Kumar. It sells an omnichannel engagement platform spanning analytics, journeys, personalization, and transactional messaging, with AI-led positioning and usage-priced Growth and Enterprise plans. Public evidence points to a customer base of enterprise and consumer brands, a Series F financing cycle in late 2025, and a disclosure profile that is still too opaque for clean financial underwriting.
  founders:
    - name: Raviteja Dodda
      role: CEO and co-founder
      claimRefs: [CO002, CO007]
    - name: Yashwanth Kumar
      role: CTO, CISO, and co-founder
      claimRefs: [CO002, CO008]
  headquarters: San Francisco and Bengaluru
  productSummary: MoEngage combines analytics, cross-channel marketing, personalization, and transactional alerts in one customer engagement stack, with AI-assisted optimization and APIs/SDKs across multiple channels.
  customerFocus: Enterprise and consumer brands running omnichannel engagement programs, with public evidence skewing toward traditional enterprises.
  businessModel: B2B SaaS sold through usage-priced Growth and Enterprise plans, plus add-on modules and channel-based transactional messaging.
  stage: Series F
  fundingStatus: Series F completed in late 2025 with $280 million disclosed across two tranches, while lifetime funding remains publicly unreconciled.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO006, CI001, CI007, CO014, CI027, CO045]
summary:
  headline: MoEngage looks like a real, scaled engagement platform, but public disclosure is too thin and the late-2025 pricing too rich to support a buy call from public evidence alone.
