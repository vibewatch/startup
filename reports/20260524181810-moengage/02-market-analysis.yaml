- id: TM006
  title: Headwinds, Commoditization, and Procurement Frictions
  columns:
  - Headwind
  - Source signal
  - Current severity
  - Procurement implication
  - Diligence ask
  rows:
  - - Flat budgets and AI-readiness gap
    - Gartner says budgets are flat and only 30% report mature AI readiness
    - High
    - Buyers will prune stacks before adding net-new tools
    - Test whether MoEngage wins consolidation budgets or only growth budgets
  - - Weak data foundations
    - GrowthLoop and Adobe say SSOT and data-quality gaps still block scale
    - High
    - Vendors must prove integration depth and time-to-value
    - Ask for implementation timelines and required customer data engineering
  - - Experimentation and measurement failure
    - GrowthLoop says winning tests often fail at scale and few teams can link actions to outcomes
    - High
    - ROI proof will matter more than narrative TAM
    - Ask for customer-level retention, lift, and attribution evidence
  - - Martech consolidation and replacement cycle
    - MarTech and chiefmartec describe renewal, churn, and consolidation rather than pure expansion
    - High
    - Category premiums will accrue to platforms that replace multiple tools
    - Ask which incumbent stacks MoEngage most often displaces
  - - Integration overhead and subscription fatigue
    - Mordor and MarketsandMarkets describe multi-vendor integration costs and SaaS fatigue
    - Medium to high
    - Point tools face increasing scrutiny unless they simplify architecture
    - Ask for services burden, API maturity, and partner dependency
  - - Trust, disclosure, and human-escalation demands
    - Twilio and Adobe say customers want control and human fallback
    - Medium
    - AI features without governance can reduce rather than improve adoption
    - Ask how MoEngage handles consent, disclosure, and escalation by channel
  notes: This table emphasizes adverse signals because the category is clearly growing, but buyer fatigue and operational drag now determine whether growth converts into durable vendor economics.
