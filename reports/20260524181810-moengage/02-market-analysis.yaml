- id: TM005
  title: Growth Drivers, Privacy Changes, and Channel Fragmentation
  columns:
  - Driver / change
  - Evidence
  - Timing
  - Adoption implication
  - Diligence ask
  rows:
  - - AI-driven personalization demand
    - Salesforce, Twilio, Adobe, and Braze all report rising demand for relevant, conversational, real-time engagement
    - Current
    - Supports spend on orchestration and AI-assisted content or decisioning
    - Check whether MoEngage can show measured lift, not just feature depth
  - - Unified customer data requirement
    - Salesforce, Segment, Experian, and Mordor all point to data unification as prerequisite infrastructure
    - Current
    - Favors vendors with clean CDP or warehouse connectivity
    - Ask how much customer value depends on native data layer versus partner stack
  - - First-party data and signal-loss shift
    - IAB, Experian, Mordor, and Google sources all describe privacy and measurement pressure
    - Current and still evolving
    - Raises value of owned-data orchestration while increasing implementation complexity
    - Verify MoEngage consent, identity, and warehouse interoperability
  - - Apple tracking protections
    - Apple continues default anti-tracking and link-tracking protections
    - Current
    - Weakens easy cross-site attribution and pushes focus to first-party journeys
    - Ask how attribution and incrementality are handled on iOS-heavy audiences
  - - Gmail bulk-sender rules
    - Google now enforces authentication, spam-rate, TLS, and unsubscribe controls
    - Current, with 2025 enforcement ramp
    - Makes deliverability and sender reputation operational requirements
    - Check email infrastructure, bounce handling, and compliance tooling
  - - WhatsApp pricing and RCS expansion
    - Meta pricing is more explicit and Twilio says RCS investment is rising
    - Current
    - Adds channel-specific cost management and opens richer messaging workflows
    - Ask for real channel-mix economics by geography and use case
  notes: These rows mix growth catalysts with policy changes because in customer engagement software the same channel and privacy shifts simultaneously increase demand and increase execution difficulty.
