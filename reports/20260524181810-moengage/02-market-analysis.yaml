  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sam-sizing
    missingEvidence: A vendor-neutral 2026 software-only SAM for enterprise omnichannel engagement that excludes services and message pass-through fees.
    whyItMatters: Public reports mix software, services, and adjacent data layers, which can materially overstate or understate the budget MoEngage can realistically win.
    diligencePath: Obtain paid analyst reports or internal cohort-level pipeline data that split software subscription revenue from services and channel passthrough by customer segment.
    relatedQuestionRefs:
    - QM031
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Publicly reliable enterprise contract values, gross margins, and channel-mix economics for independent engagement platforms.
    whyItMatters: Without internal pricing, gross-margin, and cohort-retention data, public market growth says little about the quality of revenue available to MoEngage.
    diligencePath: Request internal pricing sheets, channel cost pass-through assumptions, gross-margin bridges, and win-loss data by deployment model and geography.
    relatedQuestionRefs:
    - QM032
    relatedTableRefs:
    - TM006
