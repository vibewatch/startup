tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded or adjacent spend
  - Typical buyer / payer
  - Relevance to MoEngage
  rows:
  - - Customer engagement solutions
    - Omnichannel engagement software, personalization, analytics, and services supporting customer journeys
    - Pure ad media spend, core ERP spend, and telecom network revenue
    - CMO, CRM or CX leader, plus IT for enterprise rollouts
    - Closest broad public category for MoEngage, but still mixes software and services
  - - Omnichannel customer engagement
    - CDP or CRM-linked platforms, campaign orchestration, conversational engagement, mobile or digital messaging, social interaction management, and engagement analytics
    - Standalone CRM record systems and media buying platforms
    - Lifecycle marketing, CRM, and customer operations leaders
    - Useful boundary for MoEngage because it captures cross-channel execution and analytics together
  - - Marketing automation software
    - Campaign management, analytics and reporting, lead generation, content management, mobile, social, and web orchestration
    - Contact-center workflows, some CDP identity functions, and pass-through channel fees
    - Marketing operations and growth teams
    - Captures adjacent competitive budget even when customer engagement is framed more narrowly
  - - Customer data platform
    - Identity resolution, unified profiles, audience building, real-time activation, and data-sharing infrastructure
    - Creative production, channel delivery itself, and core ad inventory
    - Data platform owner, CRM leader, CDO or CIO
    - Critical adjacency because personalization and orchestration increasingly depend on first-party data plumbing
  - - Channel delivery layer
    - Email, push, SMS, RCS, and WhatsApp execution tied to journeys and templates
    - App-store fees, telecom carrier economics outside platform billing, and generic cloud infrastructure
    - Retention marketing or communications operations
    - MoEngage touches this layer directly, but value shifts to orchestration when channel rules and pricing become more complex
  notes: Category boundaries vary materially by analyst; rows show how public definitions overlap rather than mutually exclusive budget buckets.
