tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current verdict
  - Public support
  - Decision implication
  - What would change the view
  rows:
  - - Recommendation
    - Research-more
    - Company quality is plausible, but price support is not public-grade
    - Do not underwrite a buy on press-mark valuation alone
    - Upgrade only after audited economics and cap-table detail are opened
  - - Confidence
    - Medium
    - Direction of evidence is clear even though precision is weak
    - Use ranges and gates instead of a point target
    - Confidence rises with audited ARR/revenue, margin, and retention data
  - - Risk rating
    - High
    - Multiple depends on hidden inputs plus a tougher 2026 software market
    - Require downside protection and hard diligence milestones
    - Risk falls if MoEngage proves durable margins, retention, and clean seniority
  - - Valuation stance
    - Stretched at reported late-2025 marks
    - Implied 8.5x to 11x ARR sits above broad 2026 public medians and visible peer marks
    - Avoid paying reported round levels without premium proof
    - Stance improves if entry moves materially below the reported range or diligence proves premium economics
  - - Likely exit path
    - Private recap, strategic sale, or later IPO optionality
    - Reverse-flip and ongoing financing keep several paths open, but none is yet priced publicly
    - Model a private exit before assuming a public rerating
    - View changes if MoEngage begins publishing public-company-grade reporting and clears IPO-readiness evidence
  notes: Decision summary only; it translates the chapter evidence into current posture, price discipline, and the proof needed to change the call.
