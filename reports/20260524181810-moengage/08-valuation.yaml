- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR to GAAP revenue bridge
    - Board-grade reconciliation from current ARR to recognized revenue by product, geography, and channel
    - Tests whether the reported ARR supports a software multiple or masks lower-quality revenue mix
    - CFO diligence package plus audited revenue recognition schedules
  - - Gross margin and free cash flow
    - Current and historical gross margin, contribution margin, burn, cash, debt, and free-cash-flow bridge
    - Without these metrics investors cannot judge whether MoEngage merits a premium to public comps
    - Finance diligence and auditor workpapers
  - - Current retention and cohort behavior
    - Gross retention, NRR, logo churn, expansion, and cohort curves for 2024-2026
    - Premium SaaS valuation depends heavily on retention quality, not just revenue scale
    - Commercial analytics export and customer-cohort review
  - - Fully diluted cap table
    - Security stack, preferences, secondary-primary split, tender mechanics, and liquidation waterfall
    - Converts enterprise-value scenarios into real equity-return math
    - Legal diligence on financing documents and capitalization table
  - - Exit readiness
    - Board plan, reporting controls, public-company readiness pack, and buyer-feedback evidence
    - Determines whether the reported valuation has a credible liquidity path or only narrative support
    - CEO, CFO, and banker materials with reverse-flip and IPO workstream evidence
  notes: These asks are the minimum package needed to convert this chapter from a public screening judgment into investable underwriting. If management cannot provide them, the recommendation should not be upgraded.
