callouts:
- calloutType: risk
  title: Late-2025 round marks already look like a bull-case price
  body: The public record can explain why MoEngage attracted capital, but it cannot yet explain why a new investor should accept the late-2025 reported valuation range. At roughly $850 million to above $900 million, the company already looks priced closer to a proven premium SaaS outcome than to a disclosure-discounted private software asset.
  claimRefs:
  - CV032
  - CV037
  - CV038
  - CV040
  - CV048
- calloutType: insight
  title: The real diligence question is revenue quality, not top-line relevance
  body: MoEngage likely is large enough to matter. The unanswered question is how much of that scale is high-margin, recurring, expanding software revenue versus lower-quality or less durable activity. That distinction determines whether the public comp set is a floor, a ceiling, or the right anchor.
  claimRefs:
