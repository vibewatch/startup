  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A reconciled lifetime funding table that separates primary capital, secondary liquidity, tender events, and historical rounds.
    whyItMatters: Without a reconciled funding history, investors cannot tell how much fresh capital reached the company versus existing holders or how much dilution already sits above new money.
    diligencePath: Request the full financing chronology, signed closing memos, and cap-table updates for every round from management and counsel.
    relatedQuestionRefs:
    - QV008
  - type: private-evidence-only
    severity: blocking
    topic: current-economics
    missingEvidence: An audited bridge from current ARR to GAAP revenue plus gross margin, operating cash flow, free cash flow, cash, and debt.
    whyItMatters: These are the minimum metrics needed to decide whether MoEngage deserves a premium multiple or a private-company discount relative to disclosed public peers.
    diligencePath: Obtain audited or board-approved financials, management accounts, and revenue-recognition schedules for 2024-2026.
    relatedQuestionRefs:
    - QV028
    - QV035
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-waterfall
    missingEvidence: The fully diluted cap table, liquidation preferences, tender mechanics, and the late-2025 round waterfall.
    whyItMatters: Enterprise-value bands cannot be converted into actual equity returns when the current seniority stack is hidden.
    diligencePath: Request capitalization tables, financing documents, and a counsel-certified liquidation waterfall.
    relatedQuestionRefs:
    - QV034
  - type: stale
    severity: material
    topic: retention-bridge
    missingEvidence: Current NRR, gross retention, and cohort data that bridge the 2022 disclosed metrics to the 2025-2026 operating profile.
    whyItMatters: A stale NRR datapoint cannot support a premium SaaS multiple in 2026 when retention is one of the strongest drivers of valuation.
    diligencePath: Review cohort retention files, customer expansion histories, and current board metric packs.
    relatedQuestionRefs:
    - QV010
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A broader comparable set including private board marks and additional directly comparable engagement vendors with accessible operating metrics.
    whyItMatters: The current comparable valuation table is sufficient for guardrails, but a fuller set would narrow the scenario corridor and improve price discipline.
    diligencePath: Supplement public work with subscription databases, banker books, and directly comparable private transaction data.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV003
