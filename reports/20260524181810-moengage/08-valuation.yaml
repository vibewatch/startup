- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Indicative EV range
  - Return logic
  - Probability signal
  - Key failure mode
  rows:
  - - Bear
    - Public comps and sector compression dominate, current ARR quality is weaker than implied, and private opacity stays unresolved
    - USD 300M to 450M
    - Entry only works if structured with strong downside protection and a steep opacity discount
    - More evidence of multiple compression, weaker retention, or heavier preference overhang
    - A public-style repricing cuts far below the reported late-2025 round range
  - - Base
    - MoEngage really crossed $100M ARR and remains relevant, but investors still cannot justify a premium without audited economics
    - USD 450M to 650M
    - Acceptable only if entry sits well below press marks and diligence confirms clean cash conversion
    - Private diligence validates core revenue quality but not premium valuation support
    - Investors overpay by assuming growth alone offsets disclosure and cap-table risk
  - - Bull
    - Private diligence proves premium NRR, high software gross margin, and limited preference drag, and the market reopens to stronger SaaS names
    - USD 750M to 900M
    - Upside exists only if MoEngage deserves a premium to public peers on metrics that are not yet public
    - Audited metrics, clean cap table, and visible path to IPO-grade reporting
    - Even a good company disappoints if late-2025 marks already discounted the upside
  notes: Illustrative enterprise-value bands only. They are derived from public comparable signals and reported ARR, and they do not convert directly into equity value because the current capital stack is not public.
