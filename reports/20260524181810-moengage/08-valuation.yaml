- id: diligence-gates-and-thesis-breakers
  title: The call can improve only if private evidence closes specific gaps
  body: The most important takeaway from this chapter is not that MoEngage lacks quality; it is that public evidence cannot yet tell an investor whether the quality belongs to the common equity at the reported price. A clean upgrade from research-more to track or buy requires five missing proof points. First, management needs to reconcile ARR, GAAP revenue, gross margin, and free cash flow so the market can see how much of the business is true software rather than lower-margin messaging or services. Second, the fully diluted cap table, preferences, and secondary-primary split need to be opened so investors can translate enterprise-value scenarios into equity returns. Third, management must publish current retention and cohort behavior, not only a 2022 ARR and NRR snapshot. Fourth, the reverse-flip and IPO-readiness narrative has to be matched with public-company-grade controls and reporting. Fifth, MoEngage must prove it can defend multiple expansion despite suite consolidation and AI-led
    bundling by larger vendors. Until those items are verified, the right posture is diligence-first and price-disciplined.
