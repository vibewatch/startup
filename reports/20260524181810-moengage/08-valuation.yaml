- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Reference metric
  - Valuation or status
  - Relevance to MoEngage
  - Limitation
  rows:
  - - Braze
    - FY2026 revenue and public market cap
    - About $738.2M revenue and $2.72B market cap in May 2026
    - Closest disclosed public engagement-platform peer with modern retention and customer metrics
    - Still public, better disclosed, and not directly comparable to an opaque private round
  - - HubSpot
    - Public P/S ratio
    - About 3.12x P/S in May 2026
    - Useful benchmark for scaled marketing automation and CRM software
    - Broader SMB-to-midmarket platform and less direct journey-orchestration match
  - - Salesforce
    - FY2026 revenue plus public P/S ratio
    - About $41.5B revenue and 3.55x P/S in May 2026
    - Shows what a fully disclosed suite leader trades at in the same market
    - Scale, profitability, and suite breadth are far beyond MoEngage
  - - Adobe Digital Experience
    - Digital Experience segment revenue plus public P/S ratio
    - About $5.86B Digital Experience revenue and 4.03x P/S in May 2026
    - Shows what a large customer-experience cloud can command with full disclosure
    - Adobe includes much broader content and creative economics than MoEngage
  - - Klaviyo
    - 2025 revenue and public market cap
    - About $1.234B revenue and $4.45B market cap in May 2026
    - Relevant growth marketing automation reference with filed revenue and customer disclosures
    - Shopify exposure and commerce mix create a different business model
  - - Twilio
    - Public P/S ratio
    - About 5.35x P/S in May 2026
    - Useful adjacent communications-platform boundary marker for message-heavy economics
    - CPaaS and broader communications exposure make it only a partial comp
  notes: This is a partial comp set built from accessible public-company filings and market-data pages as of 2026-05-24. It is a corridor-setting tool, not a mechanical one-for-one pricing formula.
