company:
  name: MoEngage
chapter:
  number: 8
  title: Valuation
  summary: MoEngage looks commercially relevant and still financeable, but the public record does not support paying the late-2025 reported valuation range without deeper diligence. Public-company comps and 2026 SaaS multiple compression point to a lower, disclosure-adjusted underwriting corridor, while the missing cap-table, margin, and cash-flow data keep the recommendation at research-more and the valuation stance stretched at reported marks.
sections:
- id: reported-financing-and-priceability-gap
  title: Reported financing momentum is real, but priceability remains weak
  body: 'MoEngage''s late-2025 financing cycle proves investor appetite, but it does not prove that a new investor should pay the reported price. Official company materials clearly establish a $100 million round in November 2025 and a further $180 million extension in December, taking total Series F financing to $280 million. Independent coverage also supports that the business had real enterprise traction, global brand reach, and a second liquidity event for employees and early investors. The problem is that the public record still does not reconcile the exact post-money valuation, the fully diluted cap table, or how much of the headline round actually became fresh corporate cash. Reported valuation references range from about $750 million pre-money to well over $900 million post-money, and one database page goes higher still. That leaves public investors with a familiar private-company dilemma: evidence of demand exists, but the underwriting inputs needed to decide whether the price is
    fair remain incomplete.'
