- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence in favor
  - Counterpoint
  - What would change the view
  rows:
  - - Real category relevance
    - MoEngage raised two late-2025 tranches, serves 1,350-plus brands, and says it crossed $100 million ARR
    - Relevance does not prove that the common equity is attractive at the reported mark
    - Show audited ARR-to-revenue bridge and proof that the growth is durable, not just topical
  - - Enterprise and geographic traction
    - North America is a major revenue contributor and enterprise customers appear meaningful
    - Regional mix and enterprise mix still do not disclose contract quality, margins, or churn
    - Provide customer cohort, logo retention, expansion, and gross-margin splits by geography or segment
  - - AI and platform breadth can justify premium interest
    - MoEngage keeps framing Merlin AI, Inform, and broader engagement tooling as expansion drivers
    - The market now rewards proven AI outcomes and integrated platform depth, not AI labeling alone
    - Show measurable AI-led expansion, retention, or efficiency outcomes by customer cohort
  - - Public comps are not hostile to all software
    - Braze, Salesforce, Adobe, and Klaviyo still retain meaningful public-market value
    - Those peers also publish the revenue, margin, and retention data that MoEngage does not
    - Provide audited financials and current SaaS operating metrics that look like disclosed peers
  - - Private premium could exist
    - MoEngage may have better growth, cost structure, or customer quality than public peers
    - The public record does not yet prove those advantages or the size of any preference overhang
    - Open the cap table and the operating model so investors can test the premium directly
  - - Current anti-thesis
    - Late-2025 press marks already look like a bull-case price without bull-case disclosure
    - Investors may still overpay if they confuse momentum with priceability
    - Treat the reported round as an upper bound, not as validated fair value
  notes: This table is deliberately price-sensitive. A good company can still be a poor investment if the premium case depends on non-public facts.
