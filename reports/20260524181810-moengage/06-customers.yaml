    nodes:
    - label: Replace fragmented stack
      detail: Customers often arrive from manual or legacy tools that split analytics, messaging, and ops.
      tone: risk
    - label: Unify customer data
      detail: Event, profile, and behavioral data are centralized so teams can segment and target more precisely.
      tone: warning
    - label: Activate owned channels
      detail: Push, email, SMS, in-app, web, and WhatsApp are used for onboarding, conversion, and reminders.
      tone: neutral
    - label: Add operational messaging
      detail: Inform and real-time triggers extend MoEngage into time-sensitive alerts and transactional workflows.
      tone: opportunity
    - label: Optimize retention and expansion
      detail: Teams layer journeys, AI, and reactivation loops to drive repeat use, subscriptions, and ARPU.
      tone: positive
  approximationNotes: This journey map synthesizes repeated customer patterns from named public references; it is not a company-published universal lifecycle blueprint.
