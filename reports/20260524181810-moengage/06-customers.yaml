- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Supporting proof
  - Risk or limitation
  - Impact
  - Diligence path
  rows:
  - - Multi-channel adoption
    - Hero FinCorp, Loblaw, Airtel Xstream, Kompas, OYO
    - Public stories show breadth but not module-level spend
    - Cross-channel usage can increase switching costs, but commercial depth is unknown
    - Request module attach, channel volume, and seat count by top accounts
  - - Migration from legacy or manual stacks
    - SoundCloud, YesStyle, Skroutz, GoTyme, JULO
    - Migration wins do not prove long-run renewal quality
    - Strong land motion may exist, but renewal durability is still unproven publicly
    - Request win-loss, renewal, and 12-month post-migration health data
  - - Operational / transactional messaging
    - Loblaw and KUPU Inform deployments
    - Operational importance is visible, yet SLA and outage history are not customer-specific
    - Could deepen platform entrenchment if mission-critical paths stay reliable
    - Request SLA reports, incident logs, and fallback-volume economics
  - - AI-assisted optimization
    - Glance, Xcite, abillion, Hero FinCorp
    - AI use cases are promising but often narrated by vendor-curated stories
    - Can create expansion upside if it improves campaign productivity
    - Request attach rates, measured incrementality, and customer references using Merlin at scale
  - - Installed-base breadth
    - Customer Success page plus funding-round coverage
    - Top-customer concentration is not disclosed
    - Logo breadth lowers single-logo risk perception but cannot clear concentration risk
    - Request top-10 ARR mix and any partner or region concentration
  - - Review-platform signal
    - G2, TrustRadius, Software Advice, GetApp, SelectHub
    - Support, bugs, slow reporting, and complex-case friction appear repeatedly
    - Execution risk can erode expansion if admins lose confidence
    - Request gross churn reasons, support-SLA attainment, and escalated-ticket trends
  notes: Expansion drivers are visible in public proof, but the most investment-relevant durability questions still sit behind management-only data.
