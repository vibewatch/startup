- id: TU004
  title: Channel-specific use case table
  columns:
  - Channel / surface
  - Named proof(s)
  - Representative workflow
  - Proof of production use
  - Implementation note
  rows:
  - - Push notifications
    - OYO; Airtel Xstream; Glance; Hero FinCorp
    - Offers, content alerts, lifecycle nudges, app-stickiness programs
    - Case studies cite 5x CTR, 38% CTR uplift, and core role in engagement strategy
    - Push value depends on identity, device reachability, and event hygiene
  - - Email
    - OYO; Poshmark; KUPU; Octapharma; Famous Brands
    - Personalized offers, reactivation, recommendations, transactional emails
    - Case studies cite 1.5B monthly emails, 35%+ opens, and 76% higher engagement
    - Migration and template governance still create services work
  - - SMS
    - OYO; Loblaw; Hero FinCorp; Famous Brands
    - Price offers, order updates, voucher and lifecycle reminders
    - Official stories describe SMS as part of cross-channel operational programs
    - Cost and consent economics are not publicly broken out
  - - In-app messages / cards
    - Magenta Telekom; Airtel Xstream; Hero FinCorp; Famous Brands
    - App onboarding, tariff-change offers, interstitial content prompts, lifecycle nudges
    - Case studies cite 85.6% in-app interstitial conversion and app-adoption lifts
    - App teams still need instrumentation and lifecycle mapping
  - - Web / on-site messaging
    - Kompas; Hero FinCorp; G2 review media
    - Subscription prompts, abandonment nudges, web personalization
    - Kompas cites 300% onsite CTR; G2 media references personalized website experiences
    - Public proof for web is thinner than mobile and email
  - - WhatsApp
    - Airtel Xstream; Kompas; Hero FinCorp
    - Acquisition, content recommendations, subscription renewal, investor updates
    - Airtel case cites 30% conversion and 90% delivery
    - Provider and conversational-layer detail remain opaque
  - - Transactional alerts
    - Loblaw; KUPU; G2 Inform media
    - Order updates, refill notices, job alerts, time-sensitive operational messages
    - Loblaw and KUPU both frame Inform as production infrastructure, not only promotion
    - Public sources do not show SLA history beyond case-study narration
  notes: Rows show that public customer proof spans several owned-channel surfaces; they do not prove equal depth, volume, or ROI in every channel.
