- id: roi-retention-and-expansion-signals
  title: ROI, retention, and expansion signals
  body: 'Public customer stories are unusually rich on uplift metrics, though they remain vendor-curated. There are repeated conversion and engagement wins: OYO cites 8x engagement and 5x CTR, Kompas cites 300% onsite CTR and a 25% paid-subscriber boost, Skroutz cites 350% loyal-customer conversion lift, Xcite cites 212% CRM-driven revenue share uplift and 175% ARPU growth, and Loblaw and KUPU both frame MoEngage as infrastructure for operational messaging rather than only campaign marketing. Retention-style proof exists, but it is thinner than the conversion proof. Airtel Xstream, Octapharma Plasma, KUPU, and Indian Express publish specific retention or repeat-usage outcomes, yet public sources still do not disclose GRR, NRR, customer churn, or renewal curves by segment. The result is a positive but incomplete durability picture: the platform appears able to drive measurable adoption and expansion, but the public record still cannot prove how sticky the median enterprise account really
    is.'
