- id: deployment-breadth-and-channel-proof
  title: Deployment breadth and channel-specific proof
  body: The stronger diligence signal is not just that MoEngage lists logos, but that many named references describe what actually ran in production. Public case studies show push, email, SMS, in-app, web and on-site messaging, WhatsApp, RCS, and transactional alerts. OYO describes personalized hotel offers across push, SMS, and email; Airtel Xstream pairs push with in-app and separately uses WhatsApp for acquisition; Kompas uses on-site messaging with push, email, and WhatsApp; Loblaw and KUPU rely on Inform for operational messaging; and Hero FinCorp describes a very broad enterprise stack spanning cards, in-app, RCS, SMS, WhatsApp, email, and web push. Several logos also describe migration or replatforming work rather than a trivial greenfield setup. SoundCloud, YesStyle, Skroutz, GoTyme, JULO, and Loblaw all emphasize migration, automation, or engineering-effort reduction, which is a better proof of enterprise adoption depth than a logo wall alone.
