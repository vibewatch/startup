chapter:
  number: 6
  title: Customers
  summary: MoEngage has abundant public customer proof across travel, telecom/media, fintech, retail, and healthcare, with named deployments spanning North America, EMEA, APAC, and Africa. The strongest public evidence shows broad channel usage, migration wins, and quantified lift stories, but durability, concentration, and renewal quality still remain largely management-only questions rather than public facts.
sections:
- id: named-adoption-footprint
  title: Named adoption footprint across verticals and geographies
  body: 'MoEngage has enough named public customer proof to show that this is not a narrow regional point solution. The current public record includes hospitality, telecom, streaming, banking, broking, grocery retail, resale marketplaces, food service, healthcare, news subscriptions, and electronics retail. Geography is similarly broad: APAC case studies still dominate, but the live proof set now also includes Austria, Greece, Kuwait, Canada, South Africa, and North America references such as SoundCloud, Poshmark, Loblaw, and Octapharma Plasma. That breadth matters because it suggests the platform can travel across both digital-native and operationally complex enterprises. It also means the customer set is not confined to one narrow buyer archetype or one regional compliance environment. At the same time, investors should separate breadth of logos from clean customer-count confidence. MoEngage’s own customer-success surface and late-2025 media coverage point to a base comfortably above 1,200 brands, but the exact current active-customer definition is still company-claimed rather than independently reconciled.'
  claimRefs:
