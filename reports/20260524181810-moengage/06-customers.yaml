  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-coverage
    missingEvidence: A full current roster of active customers, the date each named logo last renewed, and a distinction between marquee references, active production accounts, and former customers.
    whyItMatters: A public sample of logos proves market reach but does not prove concentration resilience or whether the most visible references remain important commercial accounts.
    diligencePath: Request a live customer-success export with account status, contract start and renewal dates, module attach, region, and annual contract value for the top 50 named accounts.
    relatedQuestionRefs:
    - QU023
    - QU024
    - QU030
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: commercial-depth
    missingEvidence: Module attach, seat counts, ACV, services intensity, and expansion history for named customers such as Loblaw, SoundCloud, Poshmark, and Hero FinCorp.
    whyItMatters: Public case studies can show broad platform usage, but without commercial detail investors cannot tell whether multi-channel usage translates into durable expansion economics.
    diligencePath: Ask management to map the largest reference accounts by ARR, modules purchased, implementation timeline, and 12-month expansion or contraction history.
    relatedQuestionRefs:
    - QU023
    - QU030
  - type: missing-source
    severity: blocking
    topic: renewal-and-churn
    missingEvidence: Current GRR, NRR, gross logo churn, renewal rates, and cohort retention by enterprise segment or geography.
    whyItMatters: The chapter has many conversion and engagement wins, but without cohort durability data it cannot prove that the median public reference translates into durable recurring revenue.
    diligencePath: Request customer cohort tables, renewal calendars, churn reason codes, and any board reporting that tracks expansion and contraction across named logos.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 ARR concentration, partner-influenced pipeline share, and any regional dependence in the customer base.
    whyItMatters: Logo breadth can mask a concentrated revenue base. Without concentration data, the public customer proof cannot clear the risk that a small group of large enterprise accounts drives the economics.
    diligencePath: Request account-level ARR concentration, cohort by region and industry, and any internal risk thresholds applied to customer or partner concentration.
    relatedQuestionRefs:
    - QU029
    relatedTableRefs:
    - TU006
