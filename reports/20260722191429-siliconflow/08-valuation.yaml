- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Enterprise retention proves strong; dedicated/private mix rises; public-cloud gross losses narrow sharply; strategic channels deepen.
    - Exit value ~US$2.0B–3.0B over 3-4 years; current price can still work if margin inflection is real.
    - Execution still depends on compute supply and regulatory control.
    - Possible but not best-supported by current evidence.
  - - Base
    - SiliconFlow remains important, grows, and avoids severe disruption, but revenue quality and margin path improve only gradually.
    - Value range ~US$1.1B–1.6B; current entry offers limited upside for the risk.
    - Price war, compliance cost, and mix quality keep returns muted.
    - Best-supported by current public evidence.
  - - Bear
    - Scale does not cure economics; concentration or regulation bites; next funding occurs under weaker terms.
    - Value range ~US$0.7B–1.0B; down-round or flat outcome plausible.
    - Supplier shocks, losses, and weak retention compress the case.
    - Must be taken seriously given public gaps.
  notes: Ranges are scenario-based public estimates, not management forecasts or a DCF.
