  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - SiliconFlow is a strategically relevant China-based inference platform with broad model access, enterprise deployment options, and ecosystem momentum.
    - Upgrade if 2026 revenue quality, retention, and margin trend are stronger than public evidence currently shows.
  - - Recent financing and strategic investors could strengthen distribution and ecosystem leverage.
    - Upgrade if investor/customer overlap demonstrably converts into durable enterprise revenue.
  - - Public-cloud economics, compute dependence, and regulatory complexity make the current evidence base too weak for a buy call.
    - Downgrade further if public-cloud margins stay deeply negative or supplier concentration worsens.
  - - Customer breadth is real, but retention and concentration are opaque.
    - Upgrade if cohort retention and spend concentration are comfortably better than implied by current gaps.
  notes: Each row is written as a falsifiable investment argument rather than a generic pro/con list.
