- id: TV004
  title: Comparable valuation table
  targetSlug: comparable-valuation-table
  enumerationScope:
    coverage: partial
    basis: This set focuses on the most relevant inference or AI-infrastructure references with direct 2025-2026 valuation or revenue evidence in the retained corpus. It is not exhaustive across all AI platforms.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Together AI
    - 2026 valuation and bookings
    - US$8.3B valuation; >US$1.15B annual bookings
    - Direct open-model inference and infrastructure peer
    - Bookings not the same as recognized revenue; different geography and scale
  - - Fireworks AI
    - 2026 valuation and annualized revenue
    - US$17.5B valuation; >US$1B annualized revenue
    - Strong direct inference-cloud peer with open-model focus
    - Much larger revenue scale and stronger disclosed monetization
  - - Baseten
    - 2026 valuation and annualized revenue
    - US$13B valuation; ~US$600M annualized revenue
    - Inference-platform peer with enterprise deployment focus
    - Sacra estimates and US enterprise profile differ from China context
  - - CoreWeave
    - 2025-2026 revenue and valuation context
    - US$23B pre-IPO valuation reference; US$12B–13B 2026 revenue guide
    - Shows ceiling and risks of AI compute infrastructure
    - More capital-intensive GPU cloud than SiliconFlow; not a pure inference API peer
  notes: The table is intentionally partial because public China-specific pure-play inference comparables with direct valuation disclosure remain limited.
