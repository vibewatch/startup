callouts:
- calloutType: insight
  title: China token demand is exploding faster than monetization is proven
  body: IDC and the HKEX filing both support extraordinary throughput growth, but neither implies that independent platforms have solved pricing power or margin structure.
  claimRefs:
  - CM009
  - CM010
  - CM013
  - CM021
  - CM036
- calloutType: risk
  title: The market is large, but the profit pool may be smaller than the TAM
  body: Independent inference platforms face pressure from hyperscalers above them, model labs beside them, and developer price expectations below them. Negative-margin growth is therefore a live market risk, not just a company-specific issue.
  claimRefs:
  - CM034
  - CM036
  - CM037
  - CM040
- calloutType: strength
  title: Open, multi-model distribution is a real adoption advantage
  body: BYOK, one-API access, and preintegrated tools make inference platforms easy to test and easy to switch into, which is why the category continues to attract both developers and enterprise platform teams.
  claimRefs:
  - CM007
  - CM008
  - CM027
  - CM028
