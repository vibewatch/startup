companyProfile:
  summary: >-
    SiliconFlow is a Beijing-founded AI inference infrastructure company established in August 2023.
    Public evidence describes a multi-surface business: pay-as-you-go model APIs, reserved or
    dedicated inference capacity, acceleration services, and private deployment for enterprise or
    compliance-sensitive workloads. By mid-2026 the company had reached meaningful adoption scale,
    with more than 10 million registered users, more than 13,000 enterprise customers in filing-era
    disclosure, and a public model library above 200 models. The company also disclosed seven funding
    rounds through June 2026, including a Series B/B+ sequence that lifted filing-disclosed
    post-money valuation to RMB7.74 billion while independent media described the round as roughly
    US$296 million at about a US$1.2 billion valuation. SiliconFlow is strategically relevant within
    the China inference stack, but the public record still shows weak public-cloud economics,
    supplier dependence, and incomplete disclosure on retention and concentration.
  foundedDate: '2023-08-29'
  founders:
    - name: Yuan Jinhui
      role: Founder, Chairman, CEO
      background: >-
        Former Microsoft China lead researcher and founder of OneFlow; the central product, financing,
        and listing figure in SiliconFlow's public record.
      claimRefs: [CO023, CO026]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    SiliconFlow delivers an API-first inference platform with usage-based access to large language,
    multimodal, image, audio, and video models, alongside reserved instances, inference-acceleration
    services, and private-deployment options for enterprise workloads.
  customerFocus: >-
    Developers, AI builders, enterprise platform teams, regulated or state-linked institutions, and
    telecom / infrastructure partners that need model access, predictable inference performance,
    private deployment, or domestic-chip adaptation.
  businessModel: >-
    Usage-based serverless APIs, reserved or dedicated capacity, and private-deployment solutions.
    Public evidence suggests a two-line business mix between public cloud services and on-premise
    deployment, with the latter currently carrying materially better gross margins.
  stage: Late-stage private; June 2026 Series B / B+ financing and active HKEX Chapter 18C filing
  fundingStatus: >-
    The public record supports a rapid funding climb from angel through Series B+ between December
    2023 and June 2026. The HKEX filing shows post-money valuation steps up to RMB7.74 billion and
    aggregate post-2025 cash consideration of about RMB1.48 billion, while external media described
    the June 2026 financing as roughly US$296 million at a US$1.2 billion valuation.
