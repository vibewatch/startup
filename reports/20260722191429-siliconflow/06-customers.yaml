- id: durability-expansion-and-concentration
  title: Durability, Expansion, and Concentration
  body: 'Public sources support an expansion story more convincingly than a retention story. The reserved-instance case shows one lifecycle from pay-as-you-go usage toward locked dedicated capacity as token demand grows. The Guizhou Mobile partnership points to platform embedding deeper into regional compute and service infrastructure. The enterprise case studies show SiliconFlow moving beyond public-cloud API calls into private deployment,国产 chip adaptation, and broader operational integration. Those patterns are consistent with land-and-expand behavior: start with easy API access, then deepen into reserved instances, private deployment, or joint operations as usage becomes mission-critical.


    What is missing is classic SaaS durability evidence. The retained public set does not disclose NRR, GRR, churn, average contract length, renewal rates, top-customer concentration, or segment-level revenue contribution. The official and independent record also does not separate how many of the 10,000 enterprise customers are truly production-grade, how many are small-budget experimentation accounts, or what percentage of demand is mediated through a handful of strategic partners. That means customer breadth is real, but customer quality and concentration remain unresolved diligence questions.'
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
