  rows:
  - - Developers and AI builders
    - User=developer; payer=individual/team
    - Prototype and launch AI apps via API
    - Named integrations and community guides are abundant
    - Broad top-of-funnel demand and ecosystem relevance
    - Need active-paid-developer count and revenue share
  - - Enterprise platform teams
    - Buyer=IT/AI platform lead; user=internal app teams
    - Reserved instances, private deployment, coding or knowledge workloads
    - Anonymous case studies plus reserved-instance example
    - Likely higher ARPU and stronger embedding
    - Need named logo roster and contract duration
  - - Telecom / compute partners
    - Buyer=regional infra operator; user=industry customers
    - Token factory / inference infrastructure co-build
    - Guizhou Mobile partnership is explicit
    - Strategic distribution and supply leverage
    - Need commercial terms and scale of live workloads
  - - Regulated / state-linked institutions
    - Buyer=央企 / public-sector style institutions
    - 国产化 private deployment and cost/performance optimization
    - Airline and energy央企 cases show pattern
    - Important for trust and domestic moat narrative
    - Named customer list mostly withheld
  - - Community tools / open-source apps
    - User=end developers or end users of third-party tools
    - Search/RAG, coding, translation, agent workflows
    - MindSearch, Continue, Cline, and broader usercase hub
    - High awareness and repeated usage surface
    - Not enough evidence on monetization or exclusivity
  notes: Segments distinguish buyer, user, and payer roles rather than treating all “customers” as equal.
