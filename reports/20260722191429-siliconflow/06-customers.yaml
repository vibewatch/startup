callouts:
- calloutType: strength
  title: Demand breadth is supported by both enterprise and developer evidence
  body: 'SiliconFlow is not relying on a single proof surface: the corpus includes broad user counts, enterprise case-study patterns, a named telecom partner, and many developer integrations.'
  claimRefs:
  - CU002
  - CU011
  - CU014
  - CU029
- calloutType: insight
  title: The best expansion proof is architectural, not contractual
  body: Reserved-instance and private-deployment cases show that some customers grow from flexible API usage into infrastructure-like engagements. That is a valuable pattern even though public contract terms are missing.
  claimRefs:
  - CU020
  - CU024
  - CU032
- calloutType: risk
  title: Customer quality is less proven than customer quantity
  body: Public sources support breadth, but do not disclose NRR, GRR, concentration, or the share of enterprise customers that are truly large production accounts.
