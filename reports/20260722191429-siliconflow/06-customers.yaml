- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - API to reserved-instance upgrade path
    - Unknown whether expansion depends on a small set of whales
    - Large revenue concentration could hide beneath broad user counts
    - Request spend deciles and expansion cohorts
  - - Private deployment for regulated enterprises
    - Named proof is thin because key case studies are anonymous
    - Hard to assess renewal risk and sales-cycle durability
    - Request named references under NDA
  - - Telecom / infra partnerships
    - Strategic partners may become concentrated routes to volume growth
    - Could create bargaining-power and dependency issues
    - Request partner contribution to bookings and compute supply
  - - Community-tool integrations
    - High awareness may not equal durable monetization
    - Can inflate usage without proving high-LTV customers
    - Request paid conversion from community integrations
  - - Cross-industry央企 adoption narrative
    - Official story is strong, but exact vertical mix is vague
    - Could overstate diversification if revenue is concentrated
    - Request revenue by vertical and top ten accounts
  notes: The main uncertainty is not whether demand exists, but where revenue concentration hides inside the demand base.
