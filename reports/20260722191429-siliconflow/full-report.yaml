            figureRef: FO003
            claimRefs: []
      - number: '1.5'
        title: Milestones, Compliance Signals, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The operating chronology is coherent. SiliconFlow says it started inference-engine R&D in August 2023,
              launched public-cloud MaaS in May 2024, shipped DeepSeek inference on Huawei Ascend in February 2025,
              launched private MaaS in September 2025, released the Elastic GPU scheduler in April 2026, converted into
              a joint-stock company in June 2026, filed its HKEX application proof on June 30, and then added China
              Renaissance as an overall coordinator on July 14. That timeline shows a company moving in lockstep across
              productization, commercial expansion, financing, and listing preparation.


              The adverse frame is just as important. HKEX financial disclosure shows 2025 revenue scaling rapidly to
              RMB55.3 million, but gross margin swung negative at -24.0%. KrASIA and Hello China Tech sharpen the point:
              SiliconFlow appears to be renting compute, distributing third-party models, and competing in a price war
              where developer credits and below-cost token supply can accelerate adoption faster than profitability.
              Public-cloud economics look structurally tougher than on-premise deployment economics, which means the
              company's headline growth does not yet settle the question of durable monetization. In other words, the
              company overview supports a serious infrastructure platform with elite strategic backers, but not yet a
              fully de-risked business model.
