  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Regulatory enforcement
        - Formal action or remediation tied to AI labeling, privacy, or telecom compliance
        - Undermines execution and enterprise trust
        - Pause / avoid until resolved
      - - Margin failure
        - No meaningful improvement in public-cloud economics through next observable period
        - Scale narrative fails to convert into business quality
        - Move from Track to Avoid at current price
      - - Supplier / compute shock
        - Material capacity disruption or worsening supplier concentration
        - Threatens reliability and gross margin simultaneously
        - Re-cut downside case aggressively
      - - Customer-quality disappointment
        - Retention or concentration is materially worse than hoped
        - Destroys the case for premium infrastructure valuation
        - Do not pay growth premium
      - - Diligence miss on security / assurance
        - Cannot produce enterprise-grade assurance package
        - Weakens high-value enterprise adoption thesis
        - Constrain upside case and sales-quality assumptions
    notes: These triggers are observable and investment-actionable.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - 2026 revenue run-rate and mix
        - Current run-rate by serverless, dedicated, and private deployment
        - Determines whether the round is being underwritten on improving quality or on raw growth
        - Management / finance diligence
      - - Retention and concentration
        - NRR, GRR, churn, top-customer share, spend deciles
        - Core question for revenue durability
        - Management / customer diligence
      - - Current cash and burn
        - Run-date cash, monthly burn, financing proceeds net of restrictions
        - Determines runway and next-round risk
        - Finance diligence
      - - Supplier concentration and contingency
        - Top suppliers, contract terms, domestic-chip fallback economics
        - Directly affects reliability and margin risk
        - Ops / procurement diligence
      - - Security and assurance
        - SOC 2 / ISO, uptime history, incident history, SLA package
        - Required to underwrite enterprise moat quality
        - Security diligence
      - - API-to-enterprise expansion motion
        - Conversion from pay-as-you-go usage into reserved/private contracts
        - Shows whether bottom-up adoption compounds into better revenue quality
        - GTM diligence
    notes: All asks are chosen because they directly move the investment call.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV040
