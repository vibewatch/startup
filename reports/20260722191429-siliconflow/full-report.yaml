  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Risk Rating, and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow clears the threshold for strategic relevance but not for conviction buying at the publicly
              described June 2026 round price. The company has several features investors want: a real product, a large
              market, developer adoption, enterprise/infrastructure use cases, a visible role in China's inference
              stack, and substantial new capital. But the same public record also shows a business with negative
              public-cloud gross margins, supplier dependence, limited retention visibility, and meaningful regulatory /
              execution complexity. That mix argues for price sensitivity.


              The central valuation conclusion is therefore not that SiliconFlow is low quality; it is that the evidence
              quality lags the price. If the $1.2B valuation is buying access to a future high-margin infrastructure
              platform with defensible enterprise retention and improving supply economics, it may still work. If it is
              buying a scale story that remains subsidy-heavy and exposed to price wars, then the current entry point
              offers limited margin of safety. On public evidence alone, that is a Track recommendation rather than Buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
