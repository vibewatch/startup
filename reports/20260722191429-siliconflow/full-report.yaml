      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy improved meaningfully after the 2026 financing sequence, but the business still looks
              financing-dependent rather than self-funding. At the end of 2025 SiliconFlow held RMB171 million of cash
              and cash equivalents plus RMB100 million of time deposits, while net cash used in operating activities was
              RMB172 million for the year. On that simple backward-looking lens, the company would not have had
              comfortable standalone runway without fresh capital. The post-2025 A+, B, and B+ financings disclosed in
              the filing changed that picture by injecting roughly RMB1.48 billion in cash consideration after year-end,
              which is why the question shifts from immediate survival to how efficiently that new capital can be
              converted into better unit economics.


              The use-of-proceeds and supplier sections still point to meaningful dependency on external compute supply
              and continuing commercialization spend. The company does not buy chips directly; it mainly leases
              computing resources through partners, and purchases are concentrated among a handful of major suppliers.
              That means liquidity needs are tied not just to R&D burn but to compute-availability strategy, promotional
              usage credits, and the mix between serverless traffic and higher-quality enterprise work. The retained
              public record does not support a clean current runway calculation as of 2026-07-22, so investors should
              treat capital adequacy as improved but still linked to operating execution rather than solved by the June
              2026 rounds alone.
