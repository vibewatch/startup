  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape by Class
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow's competitive set spans at least four classes. First are independent open inference platforms
              such as Together AI, Fireworks, and OpenRouter, which compete on model breadth, developer portability,
              speed, and pricing rather than on ownership of a proprietary frontier model. Second are incumbent cloud
              platforms such as Amazon Bedrock, Microsoft Foundry, and Alibaba Cloud Model Studio, which sell the same
              broad job—enterprise access to many models—but bundle it into larger governance, networking, identity, and
              procurement stacks. Third are direct model-lab APIs and single-vendor ecosystems, which can bypass neutral
              platforms entirely when a customer wants one preferred model rather than a marketplace or broker. Fourth
              is internal build: engineering teams can self-host open models or stitch together vendor APIs when they
              believe cost, control, or performance justify the complexity.


              SiliconFlow's own filing is clear that it wants to sit in the open, neutral middle. It explicitly
              contrasts itself with closed ecosystems, claims first place among independent ecosystem token-supply
              platforms in China, and positions itself as a connective layer across heterogeneous compute and multiple
              model families. That means the most relevant competitor question is not simply who has the biggest model
              catalog; it is which vendor class wins as buyers progress from experimentation to production. In early
              developer adoption, independent platforms and brokers can look interchangeable. In regulated or very large
              deployments, the balance often shifts toward the providers with stronger governance, procurement reach,
              and guaranteed supply.
