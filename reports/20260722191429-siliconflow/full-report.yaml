      - number: '1.2'
        title: Leadership, Governance, and Control Signals
        blocks:
          - type: paragraph
            body: >-
              Public disclosure on leadership is better than a typical private startup because of the HKEX filing, but
              it still leaves important diligence gaps. Dr. Yuan Jinhui is clearly the central figure: founder,
              chairman, CEO, general manager, and financial controller. The filing also identifies Liu Juncheng as CTO
              and executive director, Zeng Hua as commercialization lead and executive director, and Chen Yingjie as the
              non-executive director linked to Alibaba's strategic-investment arm. Beyond the formal board, the history
              and employee-incentive sections point to a broader founding and core-team nucleus that includes Zhao Zhen
              and Hu Jian, both tied to the earlier OneFlow network. That matters because SiliconFlow appears to be less
              a lightly staffed API aggregator than a technically opinionated team with a pre-existing system-software
              lineage.


              The biographies reinforce that interpretation. Yuan came through Microsoft China and OneFlow, Liu also
              spent years at OneFlow in AI-system-software roles, and Zeng adds commercialization experience from
              Microsoft China, Baidu, and JD. Chen Yingjie adds a strategic-capital bridge to Alibaba. The board
              structure after listing is straightforward on paper—three executive directors, one non-executive, and
              three independent non-executives—but the public record still lacks details on control rights, founder
              dilution, secondary activity, and board-economics terms. One additional wrinkle is that third-party
              databases do not perfectly agree on the co-founder slate, which makes the filing the authoritative source
              but also shows how noisy startup databases remain for a fast-moving China AI company.
