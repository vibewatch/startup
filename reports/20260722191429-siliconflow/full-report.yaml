      - number: '8.4'
        title: Final Diligence Asks and Thesis-break Triggers
        blocks:
          - type: paragraph
            body: >-
              The most important thing missing from the public file is not market demand but underwriting detail.
              Investors need current cash and burn, 2026 revenue run rate, gross-margin trend by product line,
              enterprise retention, top-customer concentration, supplier concentration, and conversion from serverless
              API usage into higher-quality dedicated or private deployments. Without those inputs, the valuation
              discussion becomes mostly narrative.


              That is why the final call is Track with high risk and medium-low confidence. The thesis can move up with
              evidence: improved margins, diversified compute supply, named enterprise references, audited security
              posture, and better revenue-quality metrics. It can move down with evidence too: regulatory action,
              supplier shocks, continued negative public-cloud economics, or proof that usage breadth still fails to
              convert into durable retained spend. A price cut alone would help, but only if the missing diligence items
              also stop pointing to structural weakness.
