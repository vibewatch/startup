        title: Exhibits
        blocks:
          - type: callout
            title: China token demand is exploding faster than monetization is proven
            body: >-
              IDC and the HKEX filing both support extraordinary throughput growth, but neither implies that independent
              platforms have solved pricing power or margin structure.
            calloutType: insight
            claimRefs:
