  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow's filing shows two economically different businesses under one brand. Public cloud-based
              services include serverless token services and dedicated instances; on-premise deployment solutions
              install inference software in customer environments. Serverless services are prepaid, low-priced,
              consumption-driven products aimed at developers and smaller customers, while dedicated instances and
              private deployments serve larger buyers that need stability, reserved capacity, or compliance control. The
              public models page and API docs make the commercial surface visible: list pricing is usage-based at the
              model level, access is API-key driven, and the company relies on rapid onboarding and broad model choice
              to drive adoption.


              The problem is that list pricing is only the top of the revenue story. Peer pricing pages from Together,
              Fireworks, AWS, and Alibaba show the same market logic: cached tokens, batch jobs, dedicated capacity, and
              fine-tuning or deployment charges all change realized economics relative to simple per-token list rates.
              SiliconFlow therefore operates in a market where customers are trained to expect pay-as-you-go flexibility
              and frequent discounts, while heavy users can often migrate toward more cost-efficient dedicated capacity.
              That makes revenue quality highly sensitive to customer mix, effective discounts, and whether higher-value
              enterprise workloads eventually outweigh low-ARPU developer traffic.
