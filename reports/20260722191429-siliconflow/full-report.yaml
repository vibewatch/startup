      - number: '3.3'
        title: Switching Costs, Lock-in, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              For independent inference platforms, switching costs look structurally low at the API surface and much
              higher at the surrounding workflow layer. The common use of OpenAI-compatible endpoints across
              SiliconFlow, Together, Fireworks, OpenRouter, and Alibaba means that many developers can test or swap
              providers with limited code change. OpenRouter's routing controls and BYOK logic go even further by
              encouraging multi-homing instead of hard lock-in. SiliconFlow's own BYOK and preselected-tool distribution
              serve a similar goal: they make adoption easier, but they also make competitive displacement easier if
              another provider offers better cost, throughput, or reliability.


              Incumbents answer that weakness with distribution power. Bedrock and Foundry do not just sell tokens; they
              sell inference inside larger enterprise control planes with IAM, policies, guardrails, observability, and
              existing procurement relationships. Alibaba can similarly lean on regional cloud infrastructure, Qwen
              ownership, and packaged subscriptions. These surrounding advantages can create more durable attachment
              than model access alone. SiliconFlow therefore needs to win where openness, neutral routing across models,
              local chip heterogeneity, or China-specific deployment fit outweighs the convenience of staying inside a
              hyperscaler's broader estate.
            claimRefs:
              - CP024
