chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Legal Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow's public identity is already more complex than a generic API startup. The China-facing domain
              presents Beijing SiliconFlow as an AI-capability provider with a concrete address in Haidian, a visible
              ICP filing, and a Beijing value-added telecom permit, while the global terms and privacy pages are issued
              by SiliconFlow Technology Pte. Ltd. and explicitly route mainland-China users back to siliconflow.cn. The
              HKEX filing adds a third layer: a PRC joint-stock company with a Beijing registered office and a Hong Kong
              place of business, but with headquarters, senior management, and operations still centered outside Hong
              Kong. In practical terms, the company is China-rooted, globally marketed, and already structuring itself
              for cross-border capital-market access.


              The underlying business model is clearer than the legal map. Across the China homepage, global homepage,
              GitHub profile, and API documentation, SiliconFlow consistently markets itself as an inference
              infrastructure layer rather than a model lab or end-application vendor. It sells standardized access to
              models through large-model APIs, dedicated or reserved instances, inference acceleration services, and
              private deployment. The docs emphasize rapid onboarding, API-key self-service, and an OpenAI-style
              surface; the marketing pages emphasize speed, cost control, multimodal coverage, and predictable
              usage-based delivery. That combination is important because it shows the company is trying to sit between
              model suppliers, compute suppliers, and downstream developers or enterprises as a neutral token-supply
              platform.
