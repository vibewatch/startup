      - number: '2.5'
        title: Conflicting Estimates and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              A disciplined market chapter should preserve what is still unknown. The first gap is definitional: IDC's
              China MaaS framing, Frost & Sullivan's token-supply framing, and the global AI-inference reports are all
              useful, but they are not measuring the same basket of spend or activity. The second gap is
              company-specific: no retained public source isolates SiliconFlow's serviceable revenue share by geography,
              by customer segment, or by model category, and none shows the retention or switching dynamics that would
              turn gross throughput into a durable share thesis.


              The practical conclusion is that market evidence is strongest at the level of demand direction and weakest
              at the level of precise independent-platform profit pools. SiliconFlow clearly participates in a
              fast-growing market; it is much harder to prove from public sources alone how much of that growth will
              accrue to neutral token platforms versus hyperscalers, model labs, or private deployments inside large
              enterprises. Investors should therefore treat market size as supportive context, but reserve underwriting
              conviction for evidence on unit economics, segment mix, and defensibility in later chapters.
            claimRefs:
              - CM021
              - CM041
              - CM042
