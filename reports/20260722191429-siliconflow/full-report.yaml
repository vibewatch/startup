  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow is not selling a generic 'AI' product; it sits in the inference middleware layer that turns
              third-party models and rented or customer-owned compute into metered token output. The June 2026 HKEX
              filing, SiliconFlow's models catalog, and its onboarding docs all point to the same market boundary:
              public-cloud serverless token APIs, dedicated inference instances, and private deployments that let
              enterprises or developers consume many models through one interface. That means the included spend is not
              model training, semiconductor design, or end-user AI SaaS seats. It is the spend tied to model serving,
              token distribution, orchestration, and adjacent tooling that reduces the operational work of adopting AI
              in production.


              The most important substitutes are therefore not only other startups. Closed-ecosystem hyperscaler
              platforms such as Amazon Bedrock, Microsoft Foundry, and Alibaba Cloud Model Studio compete for the same
              model-access and agent-building budgets, while independent inference platforms such as Together and
              Fireworks compete on developer portability, speed, and price. In many buyer journeys the status quo is a
              mix of direct model-lab APIs, internal self-hosting, or an incumbent cloud already trusted for security
              and procurement. SiliconFlow's market matters because it sits between those options: more open than a
              single-cloud stack, but more productized than a do-it-yourself inference layer.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
