    audio, and video models, alongside reserved instances, inference-acceleration services, and private-deployment
    options for enterprise workloads.
  customerFocus: >-
    Developers, AI builders, enterprise platform teams, regulated or state-linked institutions, and telecom /
    infrastructure partners that need model access, predictable inference performance, private deployment, or
    domestic-chip adaptation.
  businessModel: >-
    Usage-based serverless APIs, reserved or dedicated capacity, and private-deployment solutions. Public evidence
    suggests a two-line business mix between public cloud services and on-premise deployment, with the latter currently
    carrying materially better gross margins.
  stage: Late-stage private; June 2026 Series B / B+ financing and active HKEX Chapter 18C filing
