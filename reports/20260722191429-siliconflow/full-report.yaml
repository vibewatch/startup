        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow's product is best understood as a multilayer inference delivery platform. The Chinese
              homepage, English docs introduction, models catalog, and API references all present a workflow where
              developers or enterprise teams pick a model family, obtain an API key, and then call hosted inference
              endpoints using usage-based pricing. That core serverless surface is surrounded by adjacent
              offerings—reserved instances for stable enterprise workloads, private deployment for regulated or
              data-sensitive buyers, and acceleration services for customers that want faster inference on
              self-developed or open-source models. In other words, the company is selling access, orchestration,
              optimization, and deployment modes around model inference, not a single proprietary frontier model.


              This module mix matters strategically. It lets SiliconFlow serve different buyer jobs with one control
              plane: fast experimentation for developers, higher-SLA reserved capacity for enterprises, and private or
              hybrid deployment for customers that cannot stay on a shared public cloud. The breadth is a strength
              because it reduces the number of separate vendors a customer must test. It is also a complexity risk
              because the company must keep model inventory current, maintain heterogeneous serving paths, and explain
              which delivery mode actually fits each workload.
