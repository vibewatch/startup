          - type: callout
            title: The market is large, but the profit pool may be smaller than the TAM
            body: >-
              Independent inference platforms face pressure from hyperscalers above them, model labs beside them, and
              developer price expectations below them. Negative-margin growth is therefore a live market risk, not just
              a company-specific issue.
            calloutType: risk
            claimRefs:
