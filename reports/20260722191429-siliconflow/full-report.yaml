  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow sits inside multiple overlapping compliance regimes. Its China terms and privacy policy
              require real-name verification for many users, restrict certain application domains, commit the company to
              AI-generated-content labeling obligations, and place user-information storage within mainland China for
              domestic operations. These are not generic website boilerplate points: they directly affect onboarding
              friction, enterprise contracting, product design, and logging obligations. The terms explicitly state the
              service is not suitable for automatic control, medical information services, psychological counseling, and
              critical information infrastructure scenarios, which narrows some of the highest-consequence deployment
              categories unless customized controls exist outside the public surface.


              The broader Chinese policy stack is becoming denser rather than lighter. The AI labeling measures
              effective in 2025 require explicit and implicit labels for generated synthetic content, with logging,
              metadata, and platform-distribution responsibilities. SiliconFlow's domestic terms already acknowledge
              those rules and prohibit users from deleting or tampering with labels. That alignment is positive, but it
              also means compliance risk is operational: if SiliconFlow's tools or enterprise customers mis-handle
              labeling, metadata, or downstream distribution, the company may face administrative scrutiny even when
              model output generation itself is legal. The legal risk is therefore less about a single banned activity
              and more about the burden of continuously implementing a moving regulatory stack across domestic and
              international surfaces.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
