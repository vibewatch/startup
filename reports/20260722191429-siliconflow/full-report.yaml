      - number: '6.4'
        title: Customer Verdict and Gaps
        blocks:
          - type: paragraph
            body: >-
              The overall customer verdict is positive on relevance and mixed on durability. SiliconFlow has enough
              public proof to show that developers actively integrate the API, that institutional buyers are willing to
              use the company in significant inference contexts, and that at least some workloads become large enough to
              justify reserved capacity or private deployment. This is more than superficial logo collection. The
              customer narrative is supported by case-study detail, integration depth, and specific workflow framing.


              However, the public evidence is still not strong enough to underwrite concentration risk, expansion
              efficiency, or retention quality. Community user cases are useful but not equivalent to paid production
              logos. Anonymous enterprise stories prove pattern, not precise account value. Even Guizhou Mobile is a
              strategic partnership rather than a disclosed revenue contract. The diligence priority is therefore
              straightforward: obtain segmented active-customer counts, retained cohorts, top-customer exposure, and
              expansion conversion from serverless into reserved or private deployments.
