      - number: '2.3'
        title: Buyer Segmentation, Workflow Owners, and Budget Paths
        blocks:
          - type: paragraph
            body: >-
              The filing makes clear that SiliconFlow's market spans several buyer archetypes rather than one homogenous
              user. At the low-friction end are individual developers and startups that want commitment-free model
              access, rapid onboarding, prepaid usage, and the ability to keep existing tools through BYOK or compatible
              APIs. At the higher-control end are large enterprises and institutions that care about dedicated
              performance, stable supply, low latency, private deployment, or supply assurance. The same pattern shows
              up across comparable platforms: Bedrock markets to startups and global enterprises; Microsoft Foundry
              markets a unified resource plane for agents, governance, and fleet-wide controls; Alibaba's Token Plan
              converts inference into seat-based team productivity spend; and Together and Fireworks emphasize
              OpenAI-compatible APIs that reduce migration work.


              That mix implies multiple budget owners. For self-serve API usage the first budget can live with a
              developer lead, startup founder, or a team productivity manager. As deployments become larger or
              regulated, ownership migrates toward the CIO, platform engineering leader, procurement, or
              security-compliance gatekeepers. The adoption path usually runs from a quick serverless experiment to
              heavier usage, then to dedicated instances or private deployment once cost, stability, or compliance start
              to matter. SiliconFlow's advantage is that it can participate in more than one stage of that path; its
              challenge is that every stage brings stronger competition from incumbent clouds and lower tolerance for
              product or supply instability.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
