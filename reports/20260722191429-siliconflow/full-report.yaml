            title: Usage scale is already real, not theoretical
            body: >-
              Even before listing, SiliconFlow publicly disclosed 10 million-plus registered users, 13,000-plus
              enterprise customers, more than 170 supported models, and April 2026 average daily throughput of 578.5
              billion tokens. Those are unusually large infrastructure-layer operating metrics for a company
