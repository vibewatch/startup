      - number: '7.3'
        title: Dependency, Financial, and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              The most acute non-regulatory risk is external dependency. SiliconFlow does not own a first-party frontier
              model franchise or a first-party global hyperscale cloud. Its model breadth depends on upstream model
              partners staying relevant and available; its gross margin depends on access to external compute; and its
              supply resilience depends on both domestic chip adaptation and continued ability to source or lease
              advanced semiconductor capacity. The company's own filing and independent analyses show compute rental
              dominating cost of sales and major supplier concentration remaining high. That makes the business
              vulnerable to both cost spikes and strategic bargaining from suppliers or strategic channels.


              Geopolitics amplifies the problem. U.S. export-control guidance continues to tighten around advanced
              computing semiconductors and diversion to PRC-linked entities, while China simultaneously increases
              domestic governance over AI-generated content and internet services. SiliconFlow may adapt with domestic
              chips, private deployment, and token-factory operating models, but those are mitigations, not immunity.
              Competitive pressure compounds the exposure: the same market that validates SiliconFlow also trains buyers
              to compare it against hyperscalers and other inference providers on price, reliability, and integration
              convenience. If price war, labeling compliance costs, and compute scarcity all intensify together,
              SiliconFlow's weakest link becomes margin and capital adequacy rather than simple demand generation.
            claimRefs:
              - CR022
