        - label: Adopt in workflow or application
          stage: usage
          note: Search, coding, translation, or enterprise internal assistants begin recurring use
        - label: Escalate to reserved or private deployment
          stage: value
          note: High-volume or regulated workloads move deeper into dedicated infrastructure
        - label: Expand through partner / infra channels
          stage: expansion
