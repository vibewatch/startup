companyProfile:
  summary: >-
    SiliconFlow is a Beijing-founded AI inference infrastructure company established in August 2023. Public evidence
    describes a multi-surface business: pay-as-you-go model APIs, reserved or dedicated inference capacity, acceleration
    services, and private deployment for enterprise or compliance-sensitive workloads. By mid-2026 the company had
    reached meaningful adoption scale, with more than 10 million registered users, more than 13,000 enterprise customers
    in filing-era disclosure, and a public model library above 200 models. The company also disclosed seven funding
    rounds through June 2026, including a Series B/B+ sequence that lifted filing-disclosed post-money valuation to
    RMB7.74 billion while independent media described the round as roughly US$296 million at about a US$1.2 billion
    valuation. SiliconFlow is strategically relevant within the China inference stack, but the public record still shows
    weak public-cloud economics, supplier dependence, and incomplete disclosure on retention and concentration.
  foundedDate: '2023-08-29'
  founders:
