- id: capabilities-and-pricing
  title: Capability Breadth and Pricing Competition
  body: 'Capability overlap is substantial. SiliconFlow, Together, Fireworks, OpenRouter, Alibaba, and other rivals all present some mix of OpenAI-compatible APIs, multi-model access, and low-friction onboarding. SiliconFlow advertises 200-plus models; OpenRouter says hundreds of models through a unified API; Bedrock says 100-plus foundation models; Microsoft Foundry markets 1,900-plus models in documentation and 11,000-plus models on its pricing surface; Alibaba packages Qwen plus DeepSeek, Kimi, GLM, and other third-party models; Together and Fireworks each combine serverless and higher-control deployment paths. This is a market where feature parity on basic access is becoming table stakes.


    Pricing and packaging are therefore increasingly strategic. Together and Fireworks both offer per-token serverless pricing with cached-token and batch discounts, then move heavier users toward dedicated hardware. AWS Bedrock layers token pricing, batch discounts, and provisioned or reserved capacity. Alibaba mixes pay-as-you-go rates with regional discounting and credit-based team plans. OpenRouter turns pricing itself into part of the product by routing across providers and sorting for price, latency, or throughput. The net result is that buyers can often find comparable base-model access across multiple vendors, but the all-in value proposition still differs meaningfully once deployment mode, rate limits, governance, routing, and performance controls enter the decision.'
