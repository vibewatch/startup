- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Example unit / packaging
  - Illustrative retained pricing
  - Discount / control lever
  - Implication
  rows:
  - - SiliconFlow
    - Per-model inference API
    - Public model library exposes per-model prices; exact realized rates not equal to margin
    - BYOK and tool integrations
    - Competes on breadth and convenience, but realized economics are undisclosed
  - - Together
    - Serverless per token; dedicated per GPU-minute
    - Qwen 3.7 Max $1.25 input / $3.75 output per 1M tokens; DeepSeek V4 Pro $1.74 / $3.48
    - Cached-input discounts and batch discounts; dedicated cheaper at high utilization
    - Strong direct comparable for open-model token pricing
  - - Fireworks
    - Serverless per token; on-demand GPU-hour; fine-tuning
    - DeepSeek V4 Pro $1.74 / $0.145 cached / $3.48; H100 on-demand $7.00/hr
    - Priority/Fast tiers, cached-token discount, batch 50% of standard
    - Competes on both token pricing and higher-control infrastructure
  - - OpenRouter
    - Provider-routed per-token API
    - Rates vary by underlying provider; router can sort by price, throughput, or latency
    - Fallbacks, max_price, preferred latency/throughput, ZDR
    - Turns routing logic into part of the commercial offer
  - - AWS Bedrock
    - Per-token plus batch / provisioned options
    - Claude Opus 4.8 $6 input / $30 output per 1M; DeepSeek v3.2 $0.62 / $1.85 in listed regions
    - 50% batch discount; standard / priority / reserved tiers
    - Enterprise incumbent can span premium and low-cost models
  - - Microsoft Foundry
    - Serverless / managed compute / provisioned
    - Managed GPU families listed; many token prices obscured as $- in retained surface
    - ACU pre-purchase plans and resource-wide governance
    - Commercial model is broader platform contract, not just one API rate
  - - Alibaba Model Studio
    - Pay-as-you-go plus credits subscription
    - qwen3.7-max list price $2.5 input / $7.5 output with temporary discounts; team seats from $30 to $200 per month
    - Night/day discounts, free quota, shared credit packs
    - Aggressive regional discounting and seat packaging widen the competitive set
  notes: Illustrative prices are list or posted rates captured on 2026-07-22 and should not be read as realized net pricing.
