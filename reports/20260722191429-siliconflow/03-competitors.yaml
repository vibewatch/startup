  - - OpenRouter
    - Broker / router / aggregator
    - Unified API across hundreds of models; retained sources emphasize routing rather than disclosed scale
    - Developers and agent builders optimizing cost, latency, or fallback behavior
    - Provider routing, cost/latency sorting, multi-homing, BYOK-friendly design
    - Relies on external providers rather than owning core compute supply
  - - Amazon Bedrock
    - Hyperscaler managed model platform
    - AWS platform serving 100,000+ organizations on Bedrock
    - Enterprise builders from startups to global enterprises
    - Governance, guardrails, model choice, batch/priority options, procurement strength
    - Less neutral than an independent broker and tied to AWS estate
  - - Microsoft Foundry
    - Hyperscaler managed agent/model platform
    - Microsoft positions Foundry as unified control plane with 1,900+ to 11,000+ model access surfaces
    - Enterprise platform teams and agent builders
    - RBAC, policy, observability, governance, model catalog, managed compute
    - Pricing pages do not always expose token prices cleanly in retained text
  - - Alibaba Cloud Model Studio
    - Regional hyperscaler / model platform
    - Alibaba combines Qwen ownership with third-party models and regional endpoints
    - Teams and enterprises across China and international regions
    - OpenAI compatibility, multimodal Qwen stack, regional deployments, team credit plans
    - Platform economics and realized discounting versus list pricing remain unclear
  notes: Profile rows mix public-company incumbents, open independent peers, and a routing broker because buyers evaluate all of them against the same model-access job.
