callouts:
- calloutType: risk
  title: The market is brutally portable
  body: Across independent inference platforms, OpenAI compatibility and BYOK make initial adoption easier but also make displacement easier. That portability keeps competition intense and compresses feature-only moats.
  claimRefs:
  - CP024
  - CP025
  - CP026
  - CP035
- calloutType: insight
  title: Hyperscalers are the hardest class to beat, not the other startups
  body: Bedrock, Foundry, and Alibaba compete with broader governance, procurement, and cloud-estate leverage than any independent peer can match from API pricing alone.
  claimRefs:
