  rows:
  - - Serverless token services
    - Prepaid, pay-as-you-go token consumption
    - Tokens / API calls
    - RMB14.3M revenue in 2025
    - 'Low current quality: high volume, low spend density'
    - Need cohort retention and effective realized price per token
  - - Dedicated instances
    - Reserved computing capacity on public cloud
    - Instance / reserved capacity
    - RMB15.0M revenue in 2025
    - Better than pure serverless but still compute-rental exposed
    - Need utilization and contract-length disclosure
  - - Public cloud total
    - Serverless + dedicated instances
    - RMB revenue
    - RMB29.261M, 52.9% of 2025 revenue
    - Growth engine but negative margin
    - Need line-level margin bridge and enterprise mix
  - - On-premise deployment
    - Software / deployment inside customer environment
    - Project revenue
    - RMB26.069M, 47.1% of 2025 revenue
    - Higher quality on margin, lower scalability
    - Need sales-cycle length and repeatability data
  - - Model-level list pricing
    - API price menu on public model library
    - Per-token / per-unit list price
    - Publicly visible list prices on platform
    - Not equal to realized pricing or gross margin
    - Need discount and promotion policy by cohort
  notes: Revenue mix is filing-backed; pricing posture is supplemented by public product surfaces and peer list-pricing evidence.
