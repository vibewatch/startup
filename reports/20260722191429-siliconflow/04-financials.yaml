callouts:
- calloutType: risk
  title: Public-cloud scale is real, but not yet economically mature
  body: The filing and independent analyses agree that SiliconFlow is growing rapidly while still losing money on its core public-cloud line. That combination can justify market relevance, but not yet underwriting comfort.
  claimRefs:
  - CI012
  - CI013
  - CI016
  - CI020
- calloutType: insight
  title: On-premise deployments may be the near-term quality anchor
  body: On-premise deployment is smaller and less scalable, but its 82.5% 2025 gross margin stands in sharp contrast to the public-cloud gross loss profile.
  claimRefs:
  - CI003
  - CI014
- calloutType: strength
  title: 2026 financing bought time
  body: The disclosed post-2025 A+, B, and B+ cash consideration materially reduced immediate liquidity pressure. The remaining question is execution, not just access to cash.
  claimRefs:
  - CI023
  - CI026
  - CI030
