- id: cost-structure-and-unit-economics
  title: Cost Structure and Unit Economics
  body: 'The filing is unusually clear about what hurts current economics. In 2025 SiliconFlow generated RMB55.33 million of revenue but recorded cost of sales of RMB68.632 million, implying a negative gross profit and a blended gross margin of -24.0%. The public-cloud line was much worse: its gross loss margin was -119.0% in 2025 after -271.6% in 2024, while on-premise deployment remained high-margin at 82.5%. Compute rental dominated the cost structure, accounting for 86.9% of cost of sales, and the filing explicitly says the company prioritized market share, user acquisition, and ecosystem building over immediate profitability.


    Independent commentary sharpens the unit-economics picture. Hello China Tech and KrASIA both note that SiliconFlow is effectively a middle layer renting compute and packaging third-party models into a price-war environment. The best public proxy for monetization quality is not total registered users but spend density. Serverless paying accounts rose from 2,455 to 716,000 in one year, yet serverless token revenue was only RMB14.3 million, implying extremely small average annual spend per account. More than 64% of 2025 sales and marketing expense went to promotional compute credits. That mix can create large usage numbers quickly, but it does not yet prove attractive CAC payback or durable gross-margin recovery.'
