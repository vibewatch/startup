- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why missing matters
  - Exact diligence path
  rows:
  - - Net revenue retention / gross retention
    - Material
    - Without retention data, user growth may mask churn or weak monetization
    - Request retention by developer, enterprise, and private-deployment cohorts
  - - Realized effective price per token
    - Material
    - List prices do not reveal discounting or promotion dependence
    - Ask for realized net pricing by top model families
  - - Customer concentration
    - Material
    - Large enterprise concentration can distort revenue quality
    - Request top-customer revenue share and contract terms
  - - Current monthly burn
    - Material
    - Post-2026 financing adequacy cannot be underwritten from 2025 numbers alone
    - Ask for latest monthly cash burn and cash balance
  - - Public-cloud breakeven timeline
    - Important
    - Core growth engine valuation depends on margin inflection timing
    - Request management operating plan and utilization milestones
  - - Sales efficiency / CAC payback
    - Important
    - Promotional credits may be masking expensive acquisition
    - Request payback by acquisition channel and customer type
  notes: Every missing field is directly tied to underwriting, not curiosity.
