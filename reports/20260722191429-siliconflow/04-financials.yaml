- id: financial-gaps-and-verdict
  title: Public Gaps and Financial Verdict
  body: 'The public record supports a strong financial caution signal but not a full underwriting model. We have revenue, gross margin, some mix data, customer-count proxies, supplier concentration, and a post-2025 financing bridge. We do not have clean net revenue retention, cohort margins, realized discount rates, customer concentration, monthly burn as of run date, or a management-backed timetable for public-cloud breakeven. Because official pricing pages across the market are list prices, not realized rates, they are useful for competitive context but not enough to infer actual SiliconFlow contribution margins.


    The financial verdict is therefore mixed. Revenue growth and user acquisition show demand is real. On-premise deployments appear economically healthier than public cloud. But the current core growth engine—public-cloud token supply—still looks subsidy-heavy, compute-rental-heavy, and margin-negative. For investors, the most important diligence blocker is not whether there is a large market, but whether SiliconFlow can translate its token-factory scale into materially better revenue quality and structurally improved gross margins before the next capital-reliance cycle begins.'
