  topStrengths:
    - SiliconFlow 在 AI 推理中具备真实战略相关性：模型访问广、部署模式多，并有实质企业 / 基础设施用例，不只是 demo API。
    - 对一家 2023 年成立的公司，公开采用信号很强：注册用户超过 10 million，申报期披露企业客户超过 13,000 家，token 吞吐足以支撑专属容量案例。
    - 公司把模型分发、私有部署和国产芯片适配叙事合在一起，较适合中国特定的推理需求。
    - 2026 年 6 月融资财团和 HKEX 申报流程显示，SiliconFlow 具备真实资本市场相关性，也还有时间继续执行。
  topRisks:
    - 公有云经济性仍弱：2025 年综合毛利率为负，公有云业务线仍深度亏损，说明规模尚未解决增长质量。
    - 供应商和算力依赖仍重要，因为公司租用或租赁关键基础设施，并未完全控制自己的半导体供应链。
    - AI 标识、隐私、身份、电信许可和境内外表面管理，都让监管与合规复杂度很高。
    - 客户广度已经公开，但留存、集中度和收入质量指标仍太薄，不足以支撑高确信承销。
    - 如果现有使用规模不能转成更高毛利的专属 / 私有部署和耐久企业留存，披露估值仍可能显贵。
  unresolvedGaps:
    - 当前 2026 年收入运行率，以及 serverless、专属、私有部署分产品线组合和毛利率趋势。
    - 企业留存、logo 集中度、支出集中度，以及 API 向专属容量扩张指标。
    - 2026 年 6 月融资后的当前现金余额、月度烧钱速度和融资情景分析。
    - 安全 / 保障包：正常运行时间历史、事故历史、SOC 2 / ISO 或同等证据。
    - 出口管制或容量冲击情景下的供应商集中条款和应急计划。
