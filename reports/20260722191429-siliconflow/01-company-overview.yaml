company:
  name: SiliconFlow
chapter:
  number: 1
  title: Company Overview
  summary: 'SiliconFlow is a Beijing-founded AI inference infrastructure company that is already operating at meaningful usage scale: more than 10 million registered users, more than 13,000 enterprise customers, 170-plus models in its June 2026 HKEX filing, and a growing 200-plus public model library by July 2026. Public sources show a rapid seven-round financing climb from August 2023 incorporation to a June 2026 Series B and B+ sequence that lifted disclosed post-money valuation to RMB7.74 billion, while also revealing a negative-margin, compute-rental-heavy business still searching for durable economics. The company''s legal and commercial footprint now spans a Beijing operating entity, a Singapore global-service entity, and an active Hong Kong Chapter 18C listing process, making governance and capital-structure diligence as important as raw adoption metrics.'
sections:
- id: identity-entities-and-business-model
  title: Identity, Legal Footprint, and Business Model
  body: 'SiliconFlow''s public identity is already more complex than a generic API startup. The China-facing domain presents Beijing SiliconFlow as an AI-capability provider with a concrete address in Haidian, a visible ICP filing, and a Beijing value-added telecom permit, while the global terms and privacy pages are issued by SiliconFlow Technology Pte. Ltd. and explicitly route mainland-China users back to siliconflow.cn. The HKEX filing adds a third layer: a PRC joint-stock company with a Beijing registered office and a Hong Kong place of business, but with headquarters, senior management, and operations still centered outside Hong Kong. In practical terms, the company is China-rooted, globally marketed, and already structuring itself for cross-border capital-market access.


    The underlying business model is clearer than the legal map. Across the China homepage, global homepage, GitHub profile, and API documentation, SiliconFlow consistently markets itself as an inference infrastructure layer rather than a model lab or end-application vendor. It sells standardized access to models through large-model APIs, dedicated or reserved instances, inference acceleration services, and private deployment. The docs emphasize rapid onboarding, API-key self-service, and an OpenAI-style surface; the marketing pages emphasize speed, cost control, multimodal coverage, and predictable usage-based delivery. That combination is important because it shows the company is trying to sit between model suppliers, compute suppliers, and downstream developers or enterprises as a neutral token-supply platform.'
