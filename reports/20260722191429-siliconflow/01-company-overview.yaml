- id: funding-history-and-capital-story
  title: Funding History and Capital-Market Story
  body: 'SiliconFlow''s capital formation has been unusually compressed. The HKEX filing documents seven financing rounds from December 2023 through June 2026, with disclosed capital injections stepping from RMB47.2 million at angel to RMB65.84 million at angel+, RMB71.48 million at pre-A, RMB285.99 million at Series A, RMB220 million at Series A+, RMB520 million at Series B, and RMB740 million at Series B+. The corresponding post-money valuations rose from RMB280.0 million to RMB7.74 billion in roughly two and a half years. That is not just a fundraising story; it is a signal that investors rapidly repriced the company as the AI-token middle layer became investable in China.


    The June 2026 headlines need careful handling. External media consistently described SiliconFlow as completing an over-RMB2 billion Series B, backed by a strategic syndicate spanning Trip.com or Ctrip, JinkoSolar, Kingdee, Unicom-linked investors, Biren, NIO Capital, SenseTime, GGV, and others, with China Renaissance advising. But the HKEX filing then presents a more granular 2026 sequence of A+, B, and B+ financings, with aggregate post-2025 cash consideration of about RMB1.48 billion and valuation steps from RMB3.12 billion to RMB5.02 billion and then RMB7.74 billion. Public databases also show unreconciled totals, so the right conclusion is not that one source is necessarily wrong, but that the public capital history should be treated as directionally clear and transaction-label details as still needing data-room reconciliation.'
  claimRefs:
