callouts:
- calloutType: strength
  title: Usage scale is already real, not theoretical
  body: Even before listing, SiliconFlow publicly disclosed 10 million-plus registered users, 13,000-plus enterprise customers, more than 170 supported models, and April 2026 average daily throughput of 578.5 billion tokens. Those are unusually large infrastructure-layer operating metrics for a company incorporated in August 2023.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
- calloutType: risk
  title: The business model is not yet de-risked
  body: Rapid user growth has not yet produced mature economics. The filing shows 2025 revenue of RMB55.3 million and a negative 24.0% gross margin, while independent coverage argues the company is effectively selling tokens below cost inside a compute-rental and price-war environment.
  claimRefs:
  - CO039
  - CO040
  - CO048
  - CO049
- calloutType: insight
  title: Strategic capital is part of the product story
  body: The June 2026 investor syndicate was not a generic financial round. It pulled in companies and funds tied to travel demand, energy, telecom networks, domestic chips, AI software, and state-linked industrial capital—evidence that SiliconFlow is pitching itself as a connective infrastructure layer across the AI supply chain.
  claimRefs:
  - CO025
  - CO036
  - CO037
