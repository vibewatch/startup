- id: scale-traction-and-footprint
  title: Scale, Traction, and Geographic Reach
  body: 'The filing and corroborating coverage show that SiliconFlow has already achieved real usage scale, even if its commercial density is still evolving. As of April 30, 2026, the company disclosed more than 10 million registered users, average daily throughput of 578.5 billion tokens, peak daily throughput above one trillion tokens, and more than 13,000 enterprise customers by the latest practicable date. The platform supported over 170 models in the filing and more than 200 on the public model library by July 2026. Those are unusually large infrastructure-side operating metrics for a company incorporated only in August 2023, and they help explain why investors were willing to fund it aggressively despite immature profitability.


    At the same time, the footprint evidence is broad but not exhaustive. Public pages firmly place the operating center in Beijing, and the filing confirms a Hong Kong business address as part of the IPO process. The official and third-party materials also suggest overseas commercialization is no longer hypothetical: the filing says overseas monthly revenue exceeded US$1 million in May 2026, while June coverage repeatedly described millions of dollars in overseas monthly revenue and global platform traction. What is still missing is a clean public breakdown by country, office, headcount, or overseas revenue mix. The company therefore looks scaled in usage, scaled enough to matter in enterprise adoption, and only partially disclosed in organizational footprint.'
  claimRefs:
