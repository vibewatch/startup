evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: control-rights
    missingEvidence: >-
      Board rights, liquidation preferences, veto rights, secondaries, and any structured financing terms behind the
      2026 rounds.
    whyItMatters: >-
      The public record proves capital inflow but does not show who controls downside economics or how much founder
      dilution accompanied the valuation step-up.
    diligencePath: >-
      Request the cap table, shareholder agreements, board consents, and any side letters for the 2025-2026 financing
      rounds.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A run-date-accurate employee count by function and geography.
    whyItMatters: >-
      Headcount is a volatile fact and a core proxy for burn, operating leverage, and execution capacity, yet no
      retained source pins it as of 2026-07-22.
    diligencePath: Request a month-end org snapshot or HR-certified employee count as of 2026-06-30 or later.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: june-2026-round-labeling
    missingEvidence: >-
      A definitive reconciliation of why external coverage describes a single over-RMB2B Series B while the filing
      presents a 2026 A+/B/B+ sequence and separate valuation steps.
    whyItMatters: >-
      Round labels affect how investors interpret valuation timing, dilution, and whether the July 2026 IPO effort
      followed one round or a stacked financing sequence.
    diligencePath: >-
      Request the financing timeline memo used in the IPO process and reconcile each 2026 transaction against media
      labels and board approvals.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: global-footprint
    missingEvidence: >-
      A full office, country, or subsidiary footprint beyond the Beijing registered office and Hong Kong place of
      business.
    whyItMatters: >-
      The company clearly markets globally and discloses overseas revenue, but the public record does not show the
      operating footprint needed to assess localization cost and compliance exposure.
    diligencePath: Request the entity list, office list, and overseas revenue bridge by region.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: founder-database-drift
    missingEvidence: >-
      Independent, authoritative corroboration that reconciles startup-database founder attributions with the HKEX
      co-founder list.
    whyItMatters: >-
      Identity drift does not change the investment case alone, but it is a signal that external databases may be stale
      or partially wrong in adjacent diligence areas too.
    diligencePath: >-
      Confirm founders against incorporation docs, employee incentive records, and board materials rather than database
      profiles.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: customer-quality
    missingEvidence: Customer concentration, paying-account cohorts, and conversion from developer traffic into enterprise ARR.
    whyItMatters: >-
      The overview proves scale but not the durability or profitability of that scale; later underwriting depends on how
      much of the usage base actually monetizes.
    diligencePath: >-
      Request customer concentration tables, cohort curves, and usage-to-revenue bridges for serverless and enterprise
      segments.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: Exact day-level dates and a fuller adverse-event chronology for several product and financing milestones in TO004.
    whyItMatters: >-
      The overall chronology is strong enough for the overview chapter, but some product-launch and financing entries
      remain anchored at month level or filing settlement dates rather than the original public-announcement dates.
    diligencePath: >-
      Request the company's internal milestone tracker and original launch or board-announcement dates to tighten the
      chronology without changing the milestone order.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: China MaaS versus token-supply market sizing
    missingEvidence: A reconciled definition set linking IDC's MaaS revenue and token lens to Frost & Sullivan's token-supply lens
    whyItMatters: >-
      The chapter can prove explosive growth direction, but precise underwriting changes if the market is defined by
      revenue, token throughput, or infrastructure spend.
    diligencePath: >-
      Request the underlying vendor definitions, inclusions, and denominators from management or the research providers
      before using any single number as the canonical TAM.
    relatedQuestionRefs:
      - QM007
      - QM021
    relatedClaimRefs:
      - CM009
      - CM010
      - CM013
      - CM014
      - CM021
