      - number: '1.5'
        title: 里程碑、合规信号与不利背景
        blocks:
          - type: paragraph
            body: >-
              运营时间线是连贯的。SiliconFlow 称公司 2023 年 8 月启动推理引擎研发，2024 年 5 月推出公有云 MaaS，2025 年 2 月在 Huawei Ascend 上交付 DeepSeek
              推理，2025 年 9 月推出私有 MaaS，2026 年 4 月发布 Elastic GPU scheduler，2026 年 6 月改制为股份有限公司，6 月 30 日递交 HKEX 申请版本，7 月 14
              日又加入 China Renaissance 作为整体协调人。这条时间线显示，公司在产品化、商业扩张、融资和上市准备上同步推进。


              不利框架同样重要。HKEX 财务披露显示，2025 年收入迅速增至 RMB55.3 million，但毛利率转负至 -24.0%。KrASIA 和 Hello China Tech
              把问题说得更尖锐：SiliconFlow 似乎在租用算力、分发第三方模型，并卷入一场价格战；开发者补贴和低于成本的 token
              供给能比盈利更快拉动采用。公有云经济性看起来比本地部署经济性结构性更难，这意味着公司的亮眼增长尚未回答可持续变现问题。换句话说，公司概览支持的是一家严肃的基础设施平台，背后有顶级战略投资人，但商业模式还没有完全风险出清。
