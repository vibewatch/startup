      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年融资序列后，资本充足性明显改善，但业务看起来仍依赖融资，而不是自我造血。2025 年末，SiliconFlow 持有 RMB171 million 现金及现金等价物，加上 RMB100 million
              定期存款；全年经营活动现金净流出为 RMB172 million。用这个简单的后视镜口径看，如果没有新资本，公司独立现金跑道并不宽裕。申请文件披露的 2025 年后 A+、B、B+
              融资改变了这幅图，年末之后注入约 RMB1.48 billion 现金对价。因此，问题从即时生存转为：新资本能多高效地转化为更好的单位经济性。


              募资用途和供应商章节仍指向外部算力供给和持续商业化支出的实质依赖。公司不直接买芯片，主要通过伙伴租赁计算资源，采购也集中在少数主要供应商。这意味着流动性需求不只绑定 R&D
              消耗，还绑定算力可用性策略、促销使用额度，以及 serverless 流量和更高质量企业工作之间的组合。已留存公开记录不支持截至 2026-07-22
              的干净当前现金跑道计算，所以投资人应把资本充足性看作已经改善，但仍与运营执行相连，而不是被 2026 年 6 月轮次一次性解决。
