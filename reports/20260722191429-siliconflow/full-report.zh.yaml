      - number: '8.4'
        title: 最终尽调要求与论点破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              公开材料中最重要的缺口不是市场需求，而是核保细节。投资人需要当前现金和消耗、2026 年收入运行率、分产品线毛利率趋势、企业留存、头部客户集中度、供应商集中度，以及从 Serverless API
              使用转向质量更高的专用或私有化部署的转化。没有这些输入，估值讨论就大多只是叙事。


              因此，最终判断是跟踪，高风险、中低置信度。证据可以把论点上调：利润率改善、算力供应多元化、具名企业参考、经审计的安全姿态，以及更好的收入质量指标。证据也可以把论点下调：监管行动、供应商冲击、公有云经济性持续为负，或使用广度仍无法转化为持久留存支出的证明。单纯降价会有帮助，但前提是缺失的尽调项也不再指向结构性弱点。
