      - number: '8.2'
        title: 投资论点、反论点与当前估值背景
        blocks:
          - type: paragraph
            body: >-
              投资论点很直接：SiliconFlow 是少数有足够广度、速度和生态动量的中国推理平台之一，已经重要到不可忽视。它把模型访问、API 分发、私有化部署和国产芯片适配组合在一起，而推理正在成为 AI
              部署的经济中心。近期融资看起来也有较高战略含量，产业投资人可能带来分发和生态拉力。这给了公司远超狭窄 API 套利的可选性。


              反论点同样直接。公有云经济性仍差，算力租赁主导成本，客户留存质量不透明，平台同时暴露在境内 AI 治理和外部半导体约束之下。与快速增长的西方推理同业相比，SiliconFlow
              披露的收入规模小得多，关于毛利质量的公开证据也更弱。这意味着公司可以有战略重要性，但以当前价格进入，风险调整后回报仍可能平庸。披露的 $1.2B 估值从绝对值看并不明显荒谬，但如果没有更强的 2026
              年收入和利润率图景，也并不明显有支撑。
