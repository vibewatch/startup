companyProfile:
  summary: >-
    SiliconFlow 是一家 2023 年 8 月在北京创立的 AI 推理基础设施公司。公开证据显示，它的业务触点多元：按量付费模型 API、预留或专用推理容量、加速服务，以及面向企业或合规敏感工作负载的私有化部署。到 2026
    年中，公司已经跑出有意义的采用规模：超过 1000 万注册用户、上市申请期披露的超过 13,000 家企业客户，以及超过 200 个模型的公开模型库。公司还披露了截至 2026 年 6 月的七轮融资，其中 Series B/B+
    序列把申请文件披露的投后估值推至 RMB7.74 billion；独立媒体则称该轮约 US$296 million、估值约 US$1.2 billion。SiliconFlow
    在中国推理栈中具有战略相关性，但公开记录仍显示公有云经济性偏弱、供应商依赖较重，留存和集中度披露也不完整。
