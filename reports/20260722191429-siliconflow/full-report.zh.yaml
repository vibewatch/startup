      - number: '7.3'
        title: 依赖、财务与竞争风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的非监管风险是外部依赖。SiliconFlow
              没有自有前沿模型阵地，也没有自有全球超大规模云。模型广度取决于上游模型伙伴能否持续有竞争力且可用；毛利率取决于能否拿到外部算力；供应韧性则取决于国产芯片适配，以及持续采购或租用先进半导体能力的能力。公司自己的申报文件和独立分析显示，算力租赁主导销售成本，主要供应商集中度仍高。这让业务同时暴露在成本飙升和供应商或战略渠道议价之下。


              地缘政治会放大这个问题。美国出口管制指引继续围绕先进计算半导体及流向中国关联实体的转移收紧；与此同时，中国也在加强对 AI 生成内容和互联网服务的境内治理。SiliconFlow 可以借国产芯片、私有化部署和
              Token 工厂运营模式适配，但这些是缓释措施，不是免疫。竞争压力进一步叠加风险：同一个验证 SiliconFlow
              的市场，也在训练买方按价格、可靠性和集成便利性，把它与超大规模云和其他推理提供商比较。如果价格战、标识合规成本和算力稀缺同时加剧，SiliconFlow 最薄弱的环节就会从需求生成变成利润率和资本充足性。
