  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              理解 SiliconFlow 产品，最好把它看成多层推理交付平台。中文官网、英文文档介绍、模型目录和 API 参考文档都呈现出同一条工作流：开发者或企业团队选择一个模型家族，获取 API
              key，然后按使用量计费调用托管推理端点。这个核心 serverless
              表面周围，还有几类相邻供给——面向稳定企业工作负载的预留实例，面向受监管或数据敏感买方的私有化部署，以及面向希望在自研或开源模型上获得更快推理的客户的加速服务。换句话说，公司卖的是围绕模型推理的接入、编排、优化和部署模式，而不是单一专有前沿模型。


              这个模块组合有战略意义。它让 SiliconFlow 用一个控制平面服务不同买方任务：开发者的快速实验、企业的更高 SLA
              预留容量，以及无法停留在共享公有云上的客户需要的私有或混合部署。广度是优势，因为它减少了客户必须分别测试的供应商数量；广度也是复杂性风险，因为公司必须保持模型库存更新，维护异构 serving
              路径，并解释哪种交付模式真正适合每类工作负载。
