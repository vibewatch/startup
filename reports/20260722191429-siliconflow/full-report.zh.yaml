            body: >-
              最强的公开具名证据来自两条渠道。第一是企业和生态合作，尤其是贵州移动；SiliconFlow 公开描述了双方围绕推理框架、Token
              服务和联合操作系统深化战略协作。第二是面向开发者的用户案例，具名工具或开源项目围绕 SiliconFlow API 发布集成指南。MindSearch、Continue、Cline
              尤其相关，因为它们说明平台进入了搜索 / RAG 和编码 Agent 工作流；这些场景天然消耗大量 Token，也需要高频重复使用。


              这些证据强弱不一。贵州移动是具名机构交易对手，有高管引述和具体运营范围，证据强度远高于操作指南。MindSearch、Continue、Cline
              页面证明认知度和实际集成，但没有披露付费转化、规模或排他承诺。航空、能源和编码 Agent
              的匿名企业案例进一步说明部署模式和结果，但匿名性限制了集中度分析。因此，正确读法是：具名证据存在，且覆盖开发者和企业两个入口；但只有一部分能算强商业证据。
