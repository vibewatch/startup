      - number: '4.4'
        title: 公开缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个强烈的财务警示信号，但不足以搭出完整承销模型。我们有收入、毛利率、部分组合数据、客户数量代理指标、供应商集中度和 2025 年后融资桥。我们没有干净的净收入留存、cohort
              毛利、实际折扣率、客户集中度、截至报告日的月度消耗，或管理层背书的公有云盈亏平衡时间表。由于整个市场的官方定价页都是标价而非实际成交价，它们可用于竞争背景，却不足以推断 SiliconFlow 的实际贡献毛利。


              因此，财务判断是混合的。收入增长和用户获取显示需求真实。本地部署经济性看起来比公有云更健康。但当前核心增长引擎——公有云 token
              供给——仍显得补贴重、算力租赁重、毛利为负。对投资人来说，最重要的尽调阻碍不是市场是否足够大，而是 SiliconFlow 能否在下一轮资本依赖周期开始前，把 token
              工厂规模转化为明显更好的收入质量和结构性改善的毛利率。
