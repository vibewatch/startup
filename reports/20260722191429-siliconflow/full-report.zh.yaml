  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、风险评级与价格纪律
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 达到了战略相关性的门槛，但不足以在公开描述的 2026 年 6 月轮次价格上坚定买入。公司有几项投资人想要的特征：真实产品、大市场、开发者采用、企业 /
              基础设施用例、在中国推理栈中的可见角色，以及大量新资本。但同一组公开记录也显示，这家公司有公有云毛利为负、供应商依赖、留存可见度有限，以及显著的监管 / 执行复杂度。这种组合要求投资人保持价格敏感。


              因此，核心估值结论不是 SiliconFlow 质量低，而是证据质量落后于价格。如果 $1.2B
              估值买的是一个未来高毛利基础设施平台，且具备可防守的企业留存和改善中的供应经济性，这笔投资仍可能成立。如果买的是一个仍高度依赖补贴、暴露在价格战中的规模故事，那么当前进入点的安全边际有限。仅凭公开证据，结论应是跟踪，而不是买入。
            claimRefs:
              - CV001
