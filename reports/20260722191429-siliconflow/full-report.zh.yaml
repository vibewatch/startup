      - number: '4.2'
        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              申请文件少见地清楚说明了当前经济性痛点。2025 年，SiliconFlow 录得收入 RMB55.33 million，但销售成本 RMB68.632 million，意味着毛利为负，综合毛利率为
              -24.0%。公有云线更差：2025 年毛损率为 -119.0%，2024 年为 -271.6%；本地部署仍保持 82.5% 的高毛利。算力租赁主导成本结构，占销售成本
              86.9%；申请文件也明确称，公司把市场份额、用户获取和生态建设置于即时盈利之上。


              独立评论把单位经济性画得更清楚。Hello China Tech 和 KrASIA 都指出，SiliconFlow
              实际上是一个中间层：租用算力，把第三方模型打包进价格战环境。公开材料中衡量变现质量的最佳代理指标不是注册用户总数，而是消费密度。Serverless 付费账户一年内从 2,455 增至 716,000，但
              serverless token 收入只有 RMB14.3 million，意味着每个账户年均消费极小。2025 年销售和营销费用中，超过 64% 用于促销算力额度。这种组合能快速做大使用量，但尚未证明有吸引力的
              CAC 回收或可持续毛利率修复。
