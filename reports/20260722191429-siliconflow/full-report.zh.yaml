        title: 冲突估算与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              有纪律的市场章节应该保留未知项。第一个缺口是定义：IDC 的中国 MaaS 框架、Frost & Sullivan 的 token 供给框架和全球 AI
              推理报告都有用，但它们衡量的支出或活动篮子不同。第二个缺口是公司特定的：已留存公开来源没有按地域、客户细分或模型类别拆出 SiliconFlow
              的可服务收入份额，也没有展示能把总吞吐变成可持续份额论点的留存或切换动态。


              实际结论是，市场证据在需求方向层面最强，在独立平台精准利润池层面最弱。SiliconFlow 显然参与了一个高速增长的市场；仅凭公开来源，很难证明这部分增长会有多少归属于中立 token
              平台，而不是超大规模云厂商、模型实验室或大型企业内部的私有化部署。因此，投资人应把市场规模当作支撑性背景，但把承销确信度留给后续章节中的单位经济性、细分组合和防御性证据。
