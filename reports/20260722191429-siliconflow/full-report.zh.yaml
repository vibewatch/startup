  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局分层
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 的竞争集合至少横跨四类。第一类是 Together AI、Fireworks、OpenRouter
              等独立开放推理平台，它们比拼模型广度、开发者可迁移性、速度和定价，而不是自有专有前沿模型。第二类是 Amazon Bedrock、Microsoft Foundry、Alibaba Cloud Model
              Studio 等现有云平台，卖的是同一类大工作——让企业接入多模型——但把它打包进更大的治理、网络、身份和采购栈。第三类是直接的模型实验室 API
              和单一厂商生态；当客户只想要一个偏好的模型，而不是模型市场或代理层，它们可以完全绕过中立平台。第四类是内部自建：如果工程团队认为成本、控制或性能足以抵消复杂度，他们可以自托管开放模型，或把多个供应商 API
              拼在一起。


              SiliconFlow 自己的申请文件很清楚：公司想坐在开放、中立的中间位置。它明确对比封闭生态，声称在中国独立生态 token
              供给平台中排名第一，并把自己定位为连接异构算力和多模型家族的一层。这意味着最相关的竞争问题不只是「谁的模型目录最大」，而是买方从实验走向生产后，哪一类供应商会胜出。早期开发者采用阶段，独立平台和代理层可能看起来可以互换。到了受监管或超大规模部署，天平往往转向治理、采购触达和供给保障更强的供应商。
