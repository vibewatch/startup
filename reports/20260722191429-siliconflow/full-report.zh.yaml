      - number: '3.2'
        title: 能力广度与价格竞争
        blocks:
          - type: paragraph
            body: >-
              能力重叠很大。SiliconFlow、Together、Fireworks、OpenRouter、Alibaba 及其他对手都呈现出 OpenAI 兼容
              API、多模型接入和低摩擦上手的某种组合。SiliconFlow 宣传 200+ 模型；OpenRouter 称通过统一 API 提供数百个模型；Bedrock 称有 100+ foundation
              models；Microsoft Foundry 在文档中营销 1,900+ 模型，在定价界面上展示 11,000+ 模型；Alibaba 打包 Qwen 以及 DeepSeek、Kimi、GLM
              等第三方模型；Together 和 Fireworks 各自结合 serverless 和更高控制度的部署路径。在这个市场，基础接入的功能平价正在变成入场券。


              因此，定价和包装越来越有战略意义。Together 和 Fireworks 都提供按 token 的 serverless 定价，配套 cached-token 和 batch
              折扣，再把重度用户推向专用硬件。AWS Bedrock 叠加 token 定价、batch 折扣以及 provisioned 或 reserved capacity。Alibaba 混合按量费率、区域折扣和
              credit-based 团队计划。OpenRouter
              则把定价本身变成产品的一部分，通过跨供应商路由并按价格、延迟或吞吐排序。最终结果是，买方通常能在多个供应商处找到可比的基础模型接入；但当部署模式、速率限制、治理、路由和性能控制进入决策，总体价值主张仍会明显不同。
