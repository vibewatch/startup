      - number: '6.4'
        title: 客户判断与缺口
        blocks:
          - type: paragraph
            body: >-
              整体客户判断是：相关性为正，持续性喜忧参半。SiliconFlow 有足够公开证据说明，开发者在主动集成
              API，机构买方愿意在重要推理场景中使用公司产品，且至少部分工作负载大到足以支撑预留容量或私有化部署。这不只是表层 Logo 收集；客户叙事有案例细节、集成深度和具体工作流框架支撑。


              但公开证据还不足以支撑集中度风险、扩张效率或留存质量的核保。社区用户案例有用，却不等同于付费生产
              Logo。匿名企业故事证明模式，不证明精确账户价值。即便贵州移动也是战略合作，而非披露收入合同。因此，尽调优先级很直接：拿到分客群活跃客户数、留存队列、头部客户敞口，以及从 Serverless
              转向预留或私有化部署的扩张转化。
