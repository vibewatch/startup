      - number: '1.2'
        title: 领导力、治理与控制信号
        blocks:
          - type: paragraph
            body: >-
              由于 HKEX 申请文件，领导层公开披露比典型私营创业公司更好，但关键尽调缺口仍在。袁进辉博士显然是核心人物：创始人、董事长、CEO、总经理兼财务负责人。申请文件还列出 CTO
              兼执行董事刘俊诚、商业化负责人兼执行董事曾华，以及与 Alibaba 战略投资部门相关的非执行董事陈英杰。正式董事会之外，历史和员工激励章节指向更宽的创始及核心团队内核，包括赵真和胡健，两人都与早期
              OneFlow 网络相关。这一点重要，因为 SiliconFlow 看起来并不是人手很轻的 API 聚合器，而是一支技术主张很强、带有既有系统软件谱系的团队。


              履历进一步强化了这个判断。袁进辉来自 Microsoft China 和 OneFlow；刘俊诚也曾在 OneFlow 从事多年 AI 系统软件工作；曾华补上来自 Microsoft China、Baidu 和
              JD 的商业化经验；陈英杰则把 Alibaba
              的战略资本桥接进来。上市后的董事会结构纸面上很直接——三名执行董事、一名非执行董事、三名独立非执行董事——但公开记录仍缺少控制权、创始人稀释、二级交易和董事会经济条款细节。还有一个小褶皱：第三方数据库对联合创始人名单并不完全一致，这让申请文件成为权威来源，也说明对一家高速变化的中国
              AI 公司，创业公司数据库仍然噪声很大。
