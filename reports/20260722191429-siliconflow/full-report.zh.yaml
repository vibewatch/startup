      - number: '5.2'
        title: 架构与开发者工作流
        blocks:
          - type: paragraph
            body: >-
              公开技术界面明显是 API 优先。chat-completions 参考文档暴露了模型选择、streaming、context-window 控制、tool calling 和 tracing
              headers。更宽的文档介绍描述了跨文本、图像、语音、视频、向量、reranking 和多模态模型的按量 API 接入。这些来源暗示的用户工作流很简单：注册、创建 API key、从目录选择模型、按大体
              OpenAI 风格的请求模式集成，然后再决定留在共享 serverless、迁移到预留实例，还是进入私有化部署。低摩擦路径是 SiliconFlow 能把这么多模型聚合到一个平台下的核心原因。


              在底层，平台不只是 API 代理层。SiliconFlow 反复强调自研高效算子、优化框架、加速引擎、动态扩缩容、监控和容错。开源 OneDiff
              项目提供了最清楚的外部工程证据，说明公司确实在构建推理优化软件，而不只是包装其他供应商的模型。OneDiff 聚焦 diffusion models 的加速库、compiler backends 和优化
              kernels；这不能证明整个平台架构，但支持一个更宽的主张：推理性能工程是内部能力。因此，技术故事比纯营销文案更可信，虽然在加速工具上强于在独立审计的可靠性指标上。
