          note: 高调用量或受监管工作负载进一步转向专用基础设施
        - label: 借助伙伴 / 基础设施渠道扩张
          stage: 扩张
          note: 电信或区域算力伙伴拓宽分发和运营范围
    approximationNotes: 报告保留来源能支撑这些阶段，但公开资料没有披露阶段间转化率。
    claimRefs:
      - CU003
      - CU013
      - CU020
      - CU032
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据从宽口径用户和企业客户数量，收窄到有深度部署证据的少数样本。
    data:
      items:
        - stage: 宽口径公开触达
          value: 10000000
          label: 10M+ 用户
        - stage: 企业触达
          value: 10000
          label: 10,000+ 家企业客户
        - stage: 无服务器付费账户
          value: 716000
          label: 716,000 个年末付费账户
        - stage: 具名公开深度伙伴证据
          value: 1
          label: 留存材料中 1 个明确具名的机构伙伴：Guizhou Mobile
        - stage: 公开披露的留存队列
          value: 0
          label: 未公开 NRR / GRR / 流失队列
    approximationNotes: 漏斗混用了不同证据层级的计数；最后的零表示没有公开留存队列披露，不是留存为零。
    claimRefs:
      - CU002
      - CU007
      - CU011
      - CU022
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 机构合作证据强于传统留存可见性；开发者工具证据覆盖面宽，但商业分量更轻。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 商业分量
      rows:
        - label: 具名电信 / 基础设施合作
          values:
            - 高
            - 中
            - 高
        - label: 匿名企业案例
          values:
            - 中
            - 高
            - 中
        - label: 开发者工具集成
          values:
            - 中
            - 中
            - 低至中
        - label: 社区用例中心
          values:
            - 中
            - 低至中
            - 低
        - label: 留存披露
          values:
            - 低
            - 低
            - 低
    approximationNotes: 标签综合了是否具名、部署细节、量化结果，以及离收入有多近。
    claimRefs:
      - CU014
      - CU018
      - CU019
      - CU023
      - CU030
      - CU033
  - id: FU004
    title: 留存 / 复用队列可见性代理指标
    type: cohort
    layout: standard
    summary: 公开来源能看到客户形成和少量扩展线索，但看不到真实留存率。
    data:
      columns:
        - 落地情况
        - 第 1 年
        - 第 2 年
      rows:
        - label: 公开披露客户 Logo 留存
          values:
            - 100
            - 0
            - 0
        - label: 公开披露收入留存
          values:
            - 100
            - 0
            - 0
        - label: 从 API 扩展到预留容量的公开线索
          values:
            - 100
            - 1
            - 0
        - label: 公开披露负面流失 / 集中度细节
          values:
            - 0
            - 0
            - 0
    approximationNotes: 这是可见性代理指标。“1”表示一条清晰的公开扩展路径，不是比率；0 表示没有公开百分比或队列披露。
    claimRefs:
      - CU021
      - CU022
      - CU024
      - CU034
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高残余风险集中在监管、算力依赖和客户经济性不透明三处。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
      rows:
        - label: 中国标识 / 内容合规
          values:
            - 中高
            - 高
            - 中
        - label: 算力供应商 / 出口管制冲击
          values:
            - 中
            - 高
            - 中低
        - label: 安全 / 保障缺口
          values:
            - 中
            - 高
            - 低
        - label: 宽口径数量掩盖客户集中度
          values:
            - 中
            - 中高
            - 低
        - label: 价格战压缩利润率
          values:
            - 高
            - 高
            - 低至中
    claimRefs:
      - CR006
      - CR015
      - CR024
      - CR029
      - CR037
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示监管和运营如何传导到收入质量、毛利率、融资和估值。
    data:
      nodes:
        - id: a1
          label: 监管变化
        - id: a2
          label: 标识 / 隐私落地负担
        - id: a3
          label: 运营复杂度
        - id: a4
          label: 客户摩擦 / 信任
        - id: a5
          label: 收入质量
        - id: a6
          label: 毛利率
        - id: a7
          label: 融资需求
        - id: a8
          label: 估值下行
      edges:
        - from: a1
          to: a2
          label: 抬高
        - from: a2
          to: a3
          label: 增加
        - from: a2
          to: a4
          label: 可能削弱
        - from: a3
          to: a6
          label: 挤压
        - from: a4
          to: a5
          label: 压低
        - from: a5
          to: a7
          label: 恶化
        - from: a6
          to: a7
          label: 恶化
        - from: a7
          to: a8
          label: 驱动
    claimRefs:
      - CR007
      - CR016
      - CR030
      - CR037
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: SiliconFlow 同时依赖监管机构、算力供应商、模型提供商和企业渠道。
    data:
      nodes:
        - id: d1
          label: SiliconFlow 平台
        - id: d2
          label: 中国监管机构 / 合规栈
        - id: d3
          label: 租赁算力供应商
        - id: d4
          label: 先进半导体获取
        - id: d5
          label: 上游模型提供商
        - id: d6
          label: 企业 / 电信渠道
        - id: d7
          label: 社区开发者需求
      edges:
        - from: d2
          to: d1
          label: 运营规则
        - from: d3
          to: d1
          label: 服务交付
        - from: d4
          to: d3
          label: 容量输入
        - from: d5
          to: d1
          label: 模型目录匹配度
        - from: d6
          to: d1
          label: 分发与大规模工作负载
        - from: d7
          to: d1
          label: 漏斗顶端采用
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR027
      - CR032
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    caption: 决策链从战略相关性出发，经过公开经济性偏弱和证据缺口，最后落到“跟踪”建议。
    data:
      nodes:
        - id: N1
          label: 战略相关性
          detail: 中国推理平台，已有开发者和企业证据
        - id: N2
          label: 需求证据
          detail: 真实使用、企业客户和融资支持
        - id: N3
          label: 经济性弱点
          detail: 公有云毛利率为负，成本主要压在算力上
        - id: N4
          label: 证据缺口
          detail: 留存、集中度和保障仍不透明
        - id: N5
          label: 风险负荷
          detail: 监管、供应和竞争风险都高
        - id: N6
          label: 当前入场价格
          detail: 公开资料称约 US$1.2B
        - id: N7
          label: 建议：跟踪
          detail: 没有更强证据或更好价格前，不上调至买入
      edges:
        - from: N1
          to: N7
          label: 支撑关注
        - from: N2
          to: N7
          label: 支撑跟踪
        - from: N3
          to: N7
          label: 阻止买入
        - from: N4
          to: N7
          label: 降低信心
        - from: N5
          to: N7
          label: 抬高门槛
        - from: N6
          to: N7
          label: 需要纪律
    claimRefs:
      - CV001
      - CV003
      - CV010
      - CV031
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    caption: 围绕当前入场价格的公开证据敏感性。数值是以 US$M 计的情景锚点，不是精确的基本面公允价值。
