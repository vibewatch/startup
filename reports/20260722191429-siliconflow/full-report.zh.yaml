      - number: '1.4'
        title: 规模、牵引力与地域覆盖
        blocks:
          - type: paragraph
            body: >-
              申请文件和相互印证的报道显示，SiliconFlow 已经取得真实使用规模，尽管商业密度仍在演进。截至 2026-04-30，公司披露超过 1000 万注册用户，平均日吞吐量 578.5 billion
              tokens，峰值日吞吐量超过 1 trillion tokens，并在最新可行日期拥有超过 13,000 家企业客户。申请文件显示平台支持超过 170 个模型；到 2026 年 7 月，公开模型库已超过 200
              个。对一家 2023 年 8 月才注册成立的公司来说，这些是异常大的基础设施侧运营指标，也解释了为什么即使盈利能力尚不成熟，投资人仍愿意激进出资。


              与此同时，足迹证据很宽，但并不完整。公开页面明确把运营中心放在北京，申请文件也确认香港营业地址是 IPO 流程的一部分。官方和第三方材料还显示，海外商业化已不再是假设：申请文件称 2026 年 5
              月海外月收入超过 US$1 million，6
              月报道也反复提到数百万美元海外月收入和全球平台牵引力。仍缺的是按国家、办公室、员工人数或海外收入组合拆开的干净公开口径。因此，公司在使用规模上已经成规模，在企业采用上也足以重要，但组织足迹只披露了一部分。
