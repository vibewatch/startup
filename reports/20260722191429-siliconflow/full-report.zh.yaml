chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 的公开身份已经比普通 API 创业公司复杂。面向中国的域名展示的是北京 SiliconFlow：一家 AI 能力提供商，在海淀有具体地址，ICP
              备案和北京增值电信业务许可证都可见；全球条款和隐私页面则由 SiliconFlow Technology Pte. Ltd. 发布，并明确把中国大陆用户导回 siliconflow.cn。HKEX
              申请文件又加了第三层：一家中国股份有限公司，在北京有注册办公室，在香港有营业地点，但总部、高管和运营仍集中在香港以外。落到实操上，公司扎根中国、面向全球营销，也已经开始为跨境资本市场准入搭架构。


              底层商业模式比法律地图更清楚。中国官网、全球官网、GitHub profile 和 API 文档都持续把 SiliconFlow
              包装为推理基础设施层，而不是模型实验室或终端应用厂商。它卖的是一组标准化模型接入能力：大模型 API、专用或预留实例、推理加速服务和私有化部署。文档强调快速上手、API key 自助和 OpenAI
              风格接口；营销页面强调速度、成本控制、多模态覆盖和可预测的按量交付。这个组合很重要，因为它显示公司想卡在模型供应商、算力供应商和下游开发者或企业之间，成为中立的 token 供给平台。
