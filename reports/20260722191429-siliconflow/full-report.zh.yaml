      - number: '1.3'
        title: 融资历史与资本市场叙事
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 的融资节奏异常压缩。HKEX 申请文件记录了 2023 年 12 月至 2026 年 6 月的七轮融资，披露出资额从天使轮 RMB47.2 million，升至天使+ 轮 RMB65.84
              million、pre-A 轮 RMB71.48 million、Series A 轮 RMB285.99 million、Series A+ 轮 RMB220 million、Series B 轮 RMB520
              million、Series B+ 轮 RMB740 million。对应投后估值在约两年半内从 RMB280.0 million 升至 RMB7.74 billion。这不只是融资故事；它释放的信号是，当 AI
              token 中间层在中国变得可投资，投资人迅速重估了这家公司。


              2026 年 6 月的新闻标题需要谨慎处理。外部媒体一致称 SiliconFlow 完成了超 RMB2 billion 的 Series B 轮，由覆盖 Trip.com 或
              Ctrip、JinkoSolar、Kingdee、Unicom 关联投资方、Biren、NIO Capital、SenseTime、GGV 等的战略财团支持，China Renaissance 担任顾问。但
              HKEX 申请文件随后给出更细的 2026 年 A+、B、B+ 融资序列，2025 年后累计现金对价约 RMB1.48 billion，估值从 RMB3.12 billion 升至 RMB5.02
              billion，再到 RMB7.74 billion。公开数据库也有尚未对齐的总额，因此正确结论不是某个来源必然错了，而是公开资本历史方向清楚，交易标签细节仍需要在资料室里对账。
