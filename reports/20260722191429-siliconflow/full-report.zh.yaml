  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 卖的不是泛泛的「AI」产品；它坐在推理中间件层，把第三方模型和租用或客户自有算力转成按量计费的 token 输出。2026 年 6 月 HKEX 申请文件、SiliconFlow
              模型目录和上手文档都指向同一个市场边界：公有云 serverless token API、专用推理实例，以及让企业或开发者通过一个接口消费多模型的私有化部署。这意味着纳入的支出不是模型训练、半导体设计或终端 AI
              SaaS 席位，而是与模型服务、token 分发、编排及邻近工具相关的支出；这些工具减少 AI 在生产环境落地时的运营工作。


              因此，最重要的替代方案不只是其他创业公司。Amazon Bedrock、Microsoft Foundry、Alibaba Cloud Model Studio 等封闭生态的超大规模云平台争夺同样的模型接入和
              agent 构建预算；Together、Fireworks 等独立推理平台则在开发者可迁移性、速度和价格上竞争。在很多买方路径里，现状是直接使用模型实验室
              API、内部自托管，或沿用一家已在安全和采购上被信任的现有云。SiliconFlow 的市场之所以重要，是因为它夹在这些选项之间：比单一云栈更开放，又比自建推理层更产品化。
