  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 的申请文件显示，一个品牌下面有两块经济性不同的业务。公有云服务包括 serverless token 服务和专用实例；本地部署解决方案则把推理软件安装到客户环境中。Serverless
              服务是预付费、低价、消费驱动的产品，面向开发者和较小客户；专用实例和私有化部署服务于需要稳定性、预留容量或合规控制的大买方。公开模型页和 API 文档把商业界面展示得很清楚：标价按模型层级的使用量计费，接入由
              API key 驱动，公司靠快速上手和广泛模型选择拉动采用。


              问题在于，标价只是收入故事的最上层。Together、Fireworks、AWS 和 Alibaba 的同业定价页显示了同样的市场逻辑：cached tokens、batch
              jobs、专用容量、fine-tuning 或部署收费，都会让实际经济性偏离简单的按 token 标价。因此，SiliconFlow
              所在市场训练客户预期按量灵活性和频繁折扣；重度用户又往往能迁移到成本效率更高的专用容量。这让收入质量高度取决于客户组合、有效折扣，以及更高价值企业工作负载最终能否压过低 ARPU 的开发者流量。
