  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 处在多套重叠合规制度之内。其中国条款和隐私政策要求许多用户完成实名验证，限制某些应用领域，承诺 AI
              生成内容标识义务，并要求境内运营中的用户信息存储在中国大陆。这些不是普通网站样板条款：它们直接影响入驻摩擦、企业签约、产品设计和日志义务。条款明确写明，服务不适用于自动控制、医疗信息服务、心理咨询和关键信息基础设施场景；除非公开界面之外存在定制化控制措施，否则部分后果最重的部署类别会被收窄。


              更广的中国政策栈正在变密，而不是变轻。2025 年生效的 AI 标识办法要求对生成式合成内容设置显式和隐式标识，并承担日志、元数据和平台分发责任。SiliconFlow
              的境内条款已承认这些规则，并禁止用户删除或篡改标识。这种对齐是正面信号，但也意味着合规风险落在运营层面：如果 SiliconFlow
              的工具或企业客户处理标识、元数据或下游分发不当，即便模型输出生成本身合法，公司也可能受到行政审查。因此，法律风险不只是某个被禁活动，而是要在境内外业务面上持续执行一套不断变化的监管栈。
