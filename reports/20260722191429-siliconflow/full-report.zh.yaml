      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景、可比组与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              可比组很重要，因为它凸显了战略品类价值与当前运营证据之间的缺口。Together AI、Fireworks AI 和 Baseten
              都拿到数十亿美元估值，但公开来源也显示，它们的收入或订单规模明显更高，企业变现证据更明确。CoreWeave 证明，贴近基础设施的 AI
              平台可以变得极有价值；但它也说明，即使规模大得多，资本强度和客户集中度仍可能很严峻。因此，SiliconFlow 名义估值低于这些西方同业，不应被自动解读为便宜。披露经济性的质量较低，仍可以合理支持折价。


              这引出三种情景。乐观情景下，SiliconFlow 把规模和战略关系转化为更好的企业留存、更强的专用 /
              私有化组合和改善的利润率，业务跑赢当前风险负荷。基准情景下，公司仍然重要但运营杂乱，牵引力足以支撑当前轮次，却不足以从这个价格打出有吸引力的风险投资式上行。悲观情景下，算力依赖、监管和价格竞争阻止利润率拐点，结果要么估值走平，要么未来下轮融资。今天的公开证据更支持基准情景，而不是乐观情景。
