      - number: '2.2'
        title: 通过中国 MaaS 与全球推理视角测算市场
        blocks:
          - type: paragraph
            body: >-
              没有一个公开数字能干净捕捉 SiliconFlow 的机会，因此更稳的做法是保留多个视角，而不是硬凑一个 TAM。从中国需求视角看，IDC 称企业 MaaS token 消费量从 2024 年的 114
              trillion tokens 跳至 2025 年的 1,944 trillion，并预计 2026 年约 40,000 trillion；公有云 MaaS 收入在 2025 年达到 RMB3.07
              billion，2026 年达到 RMB18.6 billion。从申请文件视角看，HKEX 招股书中的 Frost & Sullivan 行业研究显示，中国 token 供给市场 2024 至 2025 年增长
              1,602.6%，到 2030 年达到 53.2 quintillion tokens。两个以中国为中心的视角大体同意爆发式扩张，但定义和基线并不相同，这正是它们应该被交叉校验、而不是简单平均的原因。


              从更宽的全球视角看，MarketsandMarkets、Grand View Research 和 Fortune Business Insights 的第三方分析页面都把 AI 推理市场聚在 2024-2025
              年约 USD100 billion 的量级，预测终点从 2030 年约 USD254 billion 到 2034 年超过 USD312 billion 不等。这个更大的全球数字有上下文价值，但会高估
              SiliconFlow 近期可直接触达的市场，因为其中很大一部分包含硬件和超大规模云基础设施支出，层级远高于独立 token 分发层。更好的承销逻辑是分层：全球推理基础设施用于背景，中国公有云 MaaS
