            body: >-
              不利证据在这里异常重要，因为整个行业的核心 API 接入正走向商品化。Hello China Tech 认为，主流模型 API 价格自 2023 年以来已下跌超过 90%；申请文件则显示，SiliconFlow
              的公有云业务把份额和用户获取放在短期盈利之前。在中国，按吞吐量计算的前三大 token 供应商仍是超大规模云厂商部门，而 SiliconFlow 的 1.5%
              份额明显小于最大现有厂商。这并不否定业务，但确实意味着投资人不应轻易把使用增长等同于可持续竞争优势。


              已留存来源中最强的护城河候选，不是专有模型所有权，也不是强客户锁定，而是 SiliconFlow
              在中国栈中的中立位置：广泛的开放模型接入、包括国产算力在内的异构芯片支持，以及同时服务自助和私有化部署工作负载的能力。问题在于，类似的中立性和可迁移性也是 Together、Fireworks 和
              OpenRouter 的卖点；超大规模云厂商也能模仿许多 API
              功能，并用更深的资产负债表补贴。竞争耐久性因此更少取决于表面功能清单，更取决于供应获取、运营效率、信任，以及把价格敏感的开发者流量转化为更难替换的企业账户的能力。
