  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采用入口
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow 的客户基础不是一张同质化 SaaS 名单。公开来源至少指向四类实际客群：直接接入 API 的开发者、使用预留或私有化部署的企业平台团队、把推理栈嵌入区域基础设施的电信 /
              算力伙伴，以及通过 SiliconFlow 托管模型承接外部用户需求的社区项目。QQ 融资报道和独立报告给出了最宽口径的采用指标——超过 1,000 万用户、10,000
              家企业客户；申报文件和案例研究则显示，企业使用更多集中在算力密集、接近基础设施的场景，而不只是轻量聊天机器人试验。


              采用入口同样重要，因为它们对应不同的变现和持续性。MindSearch、Continue、Cline 等社区和开发者集成证明 API 有相关性、上手容易，但它们不是高 ARPU
              合同的强代理。相比之下，贵州移动合作、预留实例案例和私有化部署故事说明运营嵌入更深，但公开合同金额或续约条款往往缺失。因此，SiliconFlow
              显然有需求广度；投资人仍需把使用证据与持久、高质量收入证据拆开看。
