callouts:
  - calloutType: "insight"
    title: "The Fee Compression Squeeze on Traditional Sportsbooks"
    body: "Polymarket's taker fee model (0.03% to 0.07%) and Kalshi's ~1.0% take rate create a structural economic wedge against incumbent sportsbooks like DraftKings and FanDuel, whose 4.0% to 5.0% hold rates make event contracts mathematically superior for high-volume traders. However, state-level gambling lawsuits and retail distribution friction remain significant barriers to full retail substitution."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP011"
      - "CP013"
  - calloutType: "risk"
    title: "Web-Layer Dependency vs Smart Contract Security"
    body: "While Polymarket's on-chain settlement contracts on Polygon remained secure during the June 2026 security incident, the compromise of a third-party frontend vendor that drained $3.1 million in user funds illustrates that decentralized prediction markets remain vulnerable at the traditional web access layer, narrowing their trust differentiation versus regulated custodians."
    claimRefs:
      - "CP003"
      - "CP014"
