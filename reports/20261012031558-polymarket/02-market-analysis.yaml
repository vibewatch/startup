chapter:
  number: 2
  title: "Market Analysis"
  summary: "Polymarket and Kalshi have consolidated a duopoly controlling over 97.5% of prediction market volume in 2025, transforming binary event trading from episodic election speculation into a continuous financial information mechanism. The sector is expanding beyond its political origins into a $300 billion global sports betting addressable market and institutional sentiment infrastructure, though scaling faces state-level illegal gambling litigation and frontend security challenges."
sections:
  - id: "market-definition-and-boundary"
    title: "Market Boundary, Category Scope, and Spend Classification"
    body: "The prediction market sector operates as a specialized financial information mechanism where binary outcome shares, priced between zero and one dollar, dynamically aggregate dispersed knowledge into tradable probabilities. While traditional financial derivatives hedge macroeconomic and commodity fluctuations and regulated sportsbooks capture recreational wagering through a four to five percent house edge, prediction markets financialize factual event consensus. Polymarket has expanded from episodic political cycles into high-frequency sports wagering, macroeconomic indicator forecasting, corporate performance metrics, and institutional sentiment signals. Sports markets now represent sixty-three percent of platform trading activity and over sixty percent of open interest, demonstrating that the market's addressable boundary is defined by event velocity rather than political seasonality alone."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM010"
    tableRefs:
      - "TM001"
  - id: "tam-sam-som-sizing-lenses"
    title: "Addressable Market Sizing, Growth Trajectories, and Volume Scaling"
    body: "Market sizing for prediction platforms requires distinguishing between gross event turnover and net platform revenue capture. Global prediction market trading volume expanded to approximately $50.25 billion in 2025, with long-term industry projections estimating the broader sector could scale to $95.5 billion by 2035 at a compound annual growth rate approaching forty-seven percent. Within this ecosystem, Kalshi and Polymarket command an overwhelming duopoly, capturing 97.5% of total volume while long-tail decentralized competitors remain marginal. Polymarket's monthly volume scaled from $110 million in mid-2024 to $2.76 billion in October 2025, ultimately peaking at $10.5 billion in March 2026. The platform's addressable boundary intersects the $300 billion global sports betting market, leveraging exchange-based taker fee structures rather than traditional bookmaking margins."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM005"
      - "CM006"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-user-segmentation"
    title: "Participant Segmentation, User Demographics, and Workflow Dynamics"
    body: "Polymarket's participant base exhibits a pronounced bimodal structure spanning retail speculators, quantitative market makers, and institutional data consumers. Platform trading distribution data reveals that over fifty-five percent of individual participants place wagers between $10 and $500, with bets between $10 and $50 forming the single largest user cohort at 28.14%. High-stakes accounts wagering between $5,000 and $10,000 represent just 0.71% of total traders, yet supply outsized liquidity. Beyond retail wagering, quantitative funds utilize low-latency APIs to execute cross-venue arbitrage between Polymarket and regulated exchanges, while institutional clients access normalized prediction pricing via Intercontinental Exchange data feeds to inform risk models."
    claimRefs:
      - "CM008"
      - "CM009"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Adoption Catalysts, Regulatory Bottlenecks, and Structural Headwinds"
    body: "Platform expansion is propelled by zero-gas Polygon settlement rails, social media virality, and commercial taker fee monetization that drove Polymarket to an estimated $1 billion in annualized revenue by June 2026. However, structural headwinds pose severe operational constraints. State gaming authorities have challenged the platform's legality; in September 2026, New York authorities filed a lawsuit asserting Polymarket operates an illegal gambling enterprise. This action mirrors broader friction across twenty states contesting federal Commodity Futures Trading Commission preemption. Concurrently, frontend security risks highlighted by a $3.1 million third-party vendor supply chain breach in June 2026 underscore vulnerability in the web interface layer that smart contract audits cannot mitigate."
    claimRefs:
      - "CM007"
      - "CM011"
      - "CM012"
      - "CM013"
