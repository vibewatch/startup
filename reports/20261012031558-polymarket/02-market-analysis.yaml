callouts:
  - calloutType: "insight"
    title: "The Financialization of Information: Pricing Future Knowledge"
    body: "Prediction markets differ fundamentally from traditional attention-economy platforms by creating financial accountability for beliefs. Market contract prices reflect probability consensus where capital exposure filters speculative noise, allowing prediction platforms to lead conventional opinion polling and expert forecasts."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM014"
  - calloutType: "risk"
    title: "Jurisdictional Friction: State Gaming Laws vs Federal CFTC Preemption"
    body: "Polymarket's domestic expansion faces severe legal contention as state attorneys general argue binary event contracts constitute unlicensed gambling. The conflict between state gambling statutes and federal Commodity Futures Trading Commission preemption represents a pivotal regulatory risk for nationwide scaling."
    claimRefs:
      - "CM011"
      - "CM012"
