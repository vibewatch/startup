companyProfile:
  summary: >-
    Polymarket is a prediction-market company founded by Shayne Coplan in 2020 that combines a global blockchain venue
    with a separate U.S. regulated exchange path. The platform monetizes taker fees, maker-rebate spread capture,
    collateral float yield, and institutional data licensing, while also facing unresolved governance opacity, state
    litigation, and a still-private capital structure.
