company:
  name: Polymarket
chapter:
  number: 6
  title: Customers
  summary: Polymarket has scaled from a niche crypto experiment into the leading global prediction exchange with over 450,000 active traders and a peak monthly trading volume of $10.5 billion in March 2026. The platform's user base is predominantly retail event bettors wagering under $500, supplemented by directional whale capital and high-profile enterprise distribution via X, MLB, and ICE. However, customer durability faces sharp event-driven cyclicality, persistent offshore-versus-US regulatory litigation, and client-side web supply-chain security vulnerabilities.
sections:
  - id: user-segmentation-and-demographics
    title: User Base Segmentation and Participation Demographics
    body: 'Polymarket''s customer base is structured around two distinct operational environments: a federally regulated CFTC exchange in the United States and a decentralized, non-custodial Web3 protocol operating on Polygon for global participants. Retail event traders constitute the overwhelming majority of account volume, with blockchain transaction analytics showing that 28.14% of participating wallets wager between $10 and $50, and 27.31% place bets between $100 and $500. Users placing high-stakes bets between $5,000 and $10,000 represent just 0.71% of active participants, underscoring the platform''s broad consumer accessibility. While the service originally surged on political forecasting, sports contracts have expanded to represent roughly 39% to 40% of total betting volume, establishing sports wagering as the platform''s primary ongoing engagement engine. At the high-capital tier, directional whales and macroeconomic funds deploy multi-million-dollar positions, illustrated during the 2024 U.S. presidential election cycle when a single French trader accumulated approximately $30 million in wagers on Donald Trump across four coordinated accounts. Enterprise partners like social network X and consumer wallet MetaMask serve as critical top-of-funnel customer acquisition channels, funneling hundreds of millions of prospective users directly into Polymarket''s conditional token order books.'
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU009
      - CU012
      - CU013
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-volume-dynamics
    title: Adoption Trajectory and Notional Volume Scalability
    body: 'Polymarket''s adoption trajectory demonstrates hypergrowth driven by pivotal real-world catalysts and structural product upgrades. Cumulative trading volume expanded exponentially from $73 million in 2023 to roughly $9 billion throughout 2024, continuing to scale through 2025 and 2026. Monthly notional trading volume reached an all-time peak of $10.5 billion in March 2026 before normalizing at $8.9 billion in May 2026. Liquidity depth proved resilient even beyond high-turnout election seasons: on February 28, 2026, the exchange processed a record $425 million in single-day volume, surpassing its prior Election Day peak. The platform''s active trader count climbed past 450,000 by early 2026. Concurrently, Polymarket''s compliant U.S. exchange arm experienced rapid domestic expansion following its late 2025 CFTC designation order and QCX acquisition, growing monthly volume from $1.3 billion in April 2026 to $1.8 billion in May 2026. U.S. trading now accounts for approximately 20% of global platform volume, benefiting from a low taker fee schedule that significantly undercuts centralized event-contract competitors.'
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU008
    tableRefs:
      - TU002
  - id: commercial-partnerships-and-distribution
    title: Enterprise Distribution Channels and Commercial Validation
    body: Commercial distribution partnerships have evolved into a primary competitive moat for Polymarket, shifting customer acquisition from speculative Web3 channels into mainstream media, consumer finance, and professional sports. Social media giant X designated Polymarket as its official prediction market partner, embedding live outcome probabilities alongside Grok-powered contextual insights for an addressable audience of roughly 600 million monthly active users. In sports entertainment, Polymarket secured an exclusive multi-year commercial partnership as Major League Baseball's Official Prediction Market Exchange Partner, integrating Sportradar data feeds and an MLB-coordinated market integrity monitoring framework. On the institutional side, Intercontinental Exchange committed $2 billion in strategic capital while deploying Polymarket Signals and Sentiment data feeds directly across its global capital markets terminal infrastructure. Additionally, consumer Web3 access expanded through MetaMask's native mobile prediction market integration, enabling self-custodial contract trading without centralized brokerage barriers. Together, these commercial relationships establish high-velocity onboarding rails across both mass retail and institutional subscriber bases.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: retention-concentration-and-adversarial-headwinds
    title: Retention Dynamics, Whale Concentration, and Regulatory Headwinds
    body: 'Despite rapid headline volume scaling, Polymarket exhibits material customer durability, retention, and counterparty risks. Platform activity remains vulnerable to extreme event-driven cyclicality, demonstrated by a sharp contraction in open interest of more than 60% immediately following the November 2024 U.S. presidential election. Furthermore, order book depth displays significant concentration risk from large whale bettors whose multi-million-dollar positions can distort pricing probabilities and create liquidity shocks upon capital withdrawal. Non-custodial operations also face severe client-side execution threats: on June 25, 2026, a compromised third-party web vendor injected malicious JavaScript into Polymarket''s website frontend, draining $3.1 million in pUSD stablecoins across 11 user wallets. Although smart contracts remained untouched and Polymarket committed to full user reimbursements, the attack highlighted substantial web-layer vulnerabilities in retail DeFi onboarding. Simultaneously, state-level legal challenges have escalated, with New York authorities filing suit in September 2026 alleging unlicensed gambling operations. Together with ongoing CFTC investigations into social promotional campaigns and foreign bans in France and Italy, regulatory and security friction threatens long-term customer retention and institutional onboarding.'
    claimRefs:
      - CU005
      - CU008
      - CU013
      - CU014
      - CU015
