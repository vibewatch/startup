    - type: private-evidence-only
      severity: material
      topic: institutional-market-maker-concentration
      missingEvidence: Disclosed counterparty concentration figures, private market maker rebate agreements, and market-share percentages of top automated liquidity providers across major CLOB order books.
      whyItMatters: Heavy reliance on a small cluster of high-frequency liquidity providers or institutional trading desks leaves prediction order books vulnerable to sudden liquidity withdrawals during adverse volatility.
      diligencePath: Examine institutional market-making agreements under Polymarket Clearing / QCX disclosures and request anonymized order book maker concentration statistics from management.
      relatedTableRefs:
