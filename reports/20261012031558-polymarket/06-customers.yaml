figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    summary: End-to-end customer onboarding, trading lifecycle, and expansion loops from social discovery to oracle settlement.
    data:
      items:
        - label: Discovery & Social Signal Engagement
          touchpoints:
            - X timeline embedded widgets and Grok prediction summaries
            - Mainstream news event-probability citations (Yahoo Finance, Google Finance)
          description: Prospective users encounter crowd-sourced probability contracts tied to live breaking news, elections, or sporting events.
        - label: Frictionless Account Creation & Onboarding
          touchpoints:
            - Social login hot-wallets via email and Google
            - Native mobile access via MetaMask prediction markets integration
          description: Users bypass manual private-key generation and network configuration, abstracting blockchain barriers.
        - label: Collateral Funding & Currency Provisioning
          touchpoints:
            - Fiat on-ramps via MoonPay or Stripe
            - Direct EVM token bridge and USDC provisioning on Polygon network
          description: Trading balances are funded in dollar-pegged USDC (or pUSD), insulating balances from crypto market volatility.
        - label: Contract Execution & Position Management
          touchpoints:
            - Central Limit Order Book (CLOB) interface with binary outcome pricing ($0.01-$0.99)
            - NegRisk multi-outcome hedging and conditional token trading
          description: Traders execute peer-to-peer orders against other users and market makers with sub-cent Polygon gas fees.
        - label: Decentralized Settlement & Capital Redemption
          touchpoints:
            - UMA Optimistic Oracle resolution and smart contract settlement
            - Automatic redemption of winning contracts at $1.00 USDC
          description: Winning positions settle trustlessly without platform intermediary custody or manual withdrawal approval.
        - label: Institutional & Enterprise Expansion Loop
          touchpoints:
            - Institutional data consumption via ICE Signals and Sentiment feeds
            - Cross-vertical participation into sports betting and private-market milestones
          description: High-volume participants and capital markets desks transition from casual event betting to continuous data integration.
    approximationNotes: Stages reflect synthesized retail and institutional interaction pathways across decentralized Polygon and regulated US exchange environments.
    claimRefs:
      - CU002
      - CU007
      - CU009
      - CU012
callouts:
  - calloutType: insight
    title: Structural Post-Event Cyclicality in Retail Participation
    body: While Polymarket achieved massive adoption scaling during the 2024 U.S. election, post-event open interest contracted by more than 60%, underscoring that consumer prediction markets experience severe cyclical troughs between major geopolitical catalysts unless sports and macro trading maintain continuous velocity.
    claimRefs:
      - CU002
      - CU005
  - calloutType: risk
    title: Frontend Supply-Chain Vulnerabilities in Non-Custodial Trading
    body: Although Polymarket's Polygon smart contracts operate non-custodially, the June 2026 malicious script injection that drained $3.1 million across 11 wallets demonstrated that client-side web vendor compromises can manipulate transaction approvals, creating material trust and security hurdles for mainstream financial user adoption.
    claimRefs:
      - CU014
