    - type: missing-source
      severity: material
      topic: cohort-retention-and-churn
      missingEvidence: Audited monthly cohort retention curves, repeat transaction rates, and user churn data segmented by onboarding channel and acquisition vintage.
      whyItMatters: Public data shows significant cyclical swings after major political cycles (such as the 60%+ open interest drop in late 2024), making it impossible to assess durable organic customer lifetime value without cohort-level retention telemetry.
      diligencePath: Obtain internal product analytics demonstrating post-election 30-day, 60-day, and 90-day trader retention across sports and economic prediction categories.
