callouts:
  - calloutType: "risk"
    title: "The Preemption Battleground: Federal Commodities vs. State Gaming Authority"
    body: "Polymarket's primary existential exposure in the United States lies in the legal conflict between CFTC regulatory preemption under the Commodity Exchange Act and aggressive state-level gaming enforcement. The September 2026 lawsuit by the New York Attorney General highlights how individual state prosecutors can seek emergency injunctions and criminal penalties against event exchanges by classifying binary outcome contracts as unlicensed sportsbooks. Until federal courts establish definitive appellate precedent, Polymarket faces legal defense costs, potential state market blockades, and reputational contagion that could delay its institutional FCM onboarding."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR006"
  - calloutType: "recommendation"
    title: "Diligence Mandate: Frontend Dependency Auditing and Oracle Dispute Safeguards"
    body: "Investors evaluating Polymarket's late-stage private valuation must look beyond smart contract security audits. The June 2026 third-party web vendor breach demonstrates that decentralized protocols remain acutely vulnerable at the client interaction layer. Prospective capital allocators should demand a comprehensive review of frontend continuous-integration integrity controls, hardware-wallet integration roadmaps, and formal contingency plans for UMA oracle voting deadlocks before pricing secondary equity at premium valuations."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR007"
