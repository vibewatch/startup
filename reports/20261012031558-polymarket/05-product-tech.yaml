callouts:
  - calloutType: "insight"
    title: "Decoupled Architecture Balances CEX Performance with Non-Custodial Safety"
    body: "Polymarket's hybrid architecture separates high-speed off-chain order matching from on-chain smart contract settlement. This allows near-instant execution and zero gas friction for traders while preserving non-custodial asset control on Polygon."
    claimRefs:
      - "CE001"
      - "CE003"
  - calloutType: "risk"
    title: "Frontend Supply-Chain Exposure Transcends Smart-Contract Security"
    body: "While Polymarket's core smart contracts on Polygon have remained mathematically sound and uncompromised, third-party frontend JavaScript dependencies present a material attack surface, as evidenced by the $3.1M vendor compromise in June 2026."
    claimRefs:
      - "CE013"
      - "CE014"
