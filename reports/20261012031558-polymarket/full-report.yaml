chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Polymarket was founded in 2020 by Shayne Coplan and is based in New York City. The product is a
              peer-to-peer market for binary event contracts: users trade outcome shares whose prices reflect
              market-implied probabilities, with USDC and blockchain-based settlement used on the international
              platform. Polymarket describes that international venue as non-custodial and unavailable to U.S. and other
              restricted users, while presenting Polymarket US as a separate CFTC-regulated exchange. This two-platform
              structure is central to the company identity, but the regulatory label should not be generalized into a
              conclusion that every product or jurisdictional exposure is settled.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
