  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Legal and Regulatory Exposure: Federal Preemption vs. State Gaming Enforcement'
        blocks:
          - type: paragraph
            body: >
              Polymarket's commercial trajectory is fundamentally shaped by jurisdictional friction between federal
              commodities regulation and state-level gambling enforcement. In September 2026, New York Attorney General
              Letitia James and Governor Kathy Hochul filed a major civil enforcement lawsuit in state court against
              Polymarket, alleging that the platform operates an illegal, unlicensed sports gambling enterprise and
              demanding financial penalties, restitution, and an immediate operational halt [CR001]. Polymarket
              maintains that its exchange model constitutes peer-to-peer event derivatives trading subject to the
              exclusive federal jurisdiction of the Commodity Futures Trading Commission (CFTC), which preempts state
              gambling statutes [CR001].


              This state-level challenge follows a turbulent federal regulatory history. In January 2022, the CFTC
              issued a cease-and-desist order and a $1.4 million civil monetary penalty against Polymarket parent
              Blockratize, Inc. for operating an unregistered swap execution facility and offering off-exchange binary
              options [CR002]. Polymarket resolved those charges by agreeing to exclude US participants and instituting
              geoblocking controls [CR002]. To construct a compliant domestic gateway, Polymarket completed a $112
              million acquisition of QCX LLC and QC Clearing LLC in 2025, securing a CFTC-registered Designated Contract
              Market (DCM) license and obtaining regulatory relief under Staff No-Action Letter No. 9113-25 [CR006].


              However, regulatory normalization remains precarious. Over twenty US states have initiated or threatened
              litigation challenging prediction market operators, testing whether federal DCM designations legally
              shield event contracts from state gaming prohibitions [CR001, CR006]. Concurrently, federal scrutiny has
              re-emerged: the CFTC is conducting an active investigation into Polymarket's promotional influencer
              campaigns following reports of undisclosed creator compensation and simulated trading displays [CR013].
              Beyond the United States, sovereign regulators in France, Brazil, Italy, and Gibraltar have enacted
              outright access bans, demonstrating that international regulatory fragmentation threatens Polymarket's
              global addressable liquidity pools [CR003].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR013
