      - number: '7.3'
        title: Structural Dependencies, Market Mechanics, and Capital Drag
        blocks:
          - type: paragraph
            body: >
              Polymarket's marketplace mechanics create distinct institutional friction points centered on capital
              efficiency and counterparty concentration. In traditional prediction market contract designs, funds
              allocated to binary outcome tokens remain locked as non-yielding digital receipts until final event
              settlement [CR008]. For institutional macro desks and corporate treasury allocators, this structural
              capital drag imposes a severe opportunity cost: committing substantial balance-sheet liquidity to
              multi-quarter geopolitical or macroeconomic forecasts forfeits prevailing sovereign money-market and
              overnight risk-free yields [CR008].


              Liquidity and volume distribution are also subject to extreme concentration risks. During the 2024 US
              presidential election cycle, a single sophisticated French trader controlled four coordinated accounts
              that placed over $30 million in wagers on Donald Trump, ultimately capturing $85 million in net profits
              upon resolution [CR014]. Because Polymarket does not impose position caps on individual market
              participants, large-scale capital allocators can disproportionately influence implied probability pricing,
              creating artificial sentiment signals and deterring risk-averse retail counter-flow [CR014].


              Furthermore, Polymarket maintains deep commercial and structural dependencies on critical partners.
              Intercontinental Exchange (ICE) committed up to $2 billion in strategic capitalization, comprising $1
              billion in Series D preferred primary equity alongside an agreement to purchase secondary shares and
              distribute Polymarket Signals and Sentiment data across Wall Street terminals [CR010]. While ICE validates
              institutional adoption, any deterioration in this strategic alliance would jeopardize Polymarket's
              mainstream financial distribution [CR010]. Concurrently, retail secondary offerings hosted on platforms
              like StartEngine pool capital into special purpose vehicles rather than providing direct shareholder
              equity, reflecting governance opacity and shareholder rights subordination [CR011].
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR014
