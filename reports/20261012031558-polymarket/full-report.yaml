      - number: '5.4'
        title: Security Architecture, Supply-Chain Incidents, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Despite the formal mathematical correctness of Polymarket's on-chain settlement contracts, the platform's
              client-side web application represents a substantial operational risk vector. In June 2026, malicious
              actors compromised a third-party frontend vendor supplying code to the Polymarket website, injecting rogue
              JavaScript that manipulated client-side transaction prompts and drained $3.1 million in pUSD from eleven
              user wallets before mitigation. The breach demonstrated that decentralized applications remain highly
              vulnerable to web supply-chain attacks even when smart contracts perform faultlessly. Concurrently,
              Polymarket confronts significant state-level regulatory headwinds. In September 2026, New York state
              authorities initiated legal proceedings against Polymarket, alleging that the venue conducts an unlicensed
              commercial gambling enterprise in violation of state laws. While Polymarket asserts federal regulatory
              preemption under the Commodity Futures Trading Commission and holds a designated contract market approval
              path through QCX, state enforcement actions threaten domestic liquidity access and challenge the legal
              classification of prediction contracts.
            claimRefs:
              - CE010
              - CE013
              - CE014
