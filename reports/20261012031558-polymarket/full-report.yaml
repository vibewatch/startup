      - number: '7.2'
        title: Operational Vulnerabilities and Web-Layer Frontend Security
        blocks:
          - type: paragraph
            body: >
              While decentralized prediction markets are architecturally designed to eliminate centralized custodial
              risk, Polymarket's operating history reveals severe vulnerabilities residing at the web interaction layer.
              On June 25, 2026, attackers compromised a third-party software vendor providing code dependencies to
              Polymarket's website frontend, successfully injecting malicious JavaScript that prompted users to sign
              unauthorized transactions [CR004]. This client-side supply-chain attack drained $3.1 million in pUSD
              stablecoins across 11 user wallets before the malicious dependency was isolated and removed [CR004].


              Crucially, the incident demonstrated the structural decoupling between immutable smart contract execution
              and mutable frontend interfaces [CR004]. Polymarket's underlying smart contracts on Polygon functioned
              exactly as designed, executing cryptographically signed transactions without logic flaws; the exploit
              succeeded entirely upstream by manipulating the visual prompts presented to users [CR004]. This attack
              marked Polymarket's second severe security failure within five weeks, following a May 2026 incident where
              an exposed legacy private key drained between $520,000 and $700,000 from internal prize payout operations
              wallets [CR005].


              Beyond frontend dependency risks, Polymarket relies heavily on external decentralized infrastructure for
              contract settlement. The platform delegates outcome verification to UMA's Optimistic Oracle protocol,
              which utilizes economic incentives and token-holder voting to finalize event resolutions [CR007]. While
              this mechanism prevents Polymarket from exercising centralized discretion over market settlement—a key
              legal safeguard against taking counterparty risk—it exposes the exchange to governance gridlock,
              resolution delays, and potential economic voting attacks on subjective or ambiguous outcome criteria
              [CR007].
            claimRefs:
              - CR004
              - CR005
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
