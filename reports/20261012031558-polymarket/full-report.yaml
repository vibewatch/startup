      - number: '5.2'
        title: Order Matching and On-Chain Settlement Model
        blocks:
          - type: paragraph
            body: >-
              To deliver an institutional-grade trading experience that avoids the transaction costs and latency of pure
              decentralized finance protocols, Polymarket deploys a hybrid off-chain and on-chain operating model. An
              off-chain central limit order book sequencer matches limit and market orders with sub-second execution
              speeds, avoiding the gas congestion that compromised earlier decentralized prediction protocols like Augur
              and Gnosis. Once matched, contract clearing and settlement occur directly on the Polygon blockchain
              through audited smart contracts that govern non-custodial custody. The protocol automates user onboarding
              by abstracting Web3 complexities through email and social hot wallets alongside MoonPay and Stripe fiat
              funding rails, enabling new traders to fund accounts in under sixty seconds. Contract outcomes are
              finalized through UMA's decentralized optimistic oracle protocol, which asserts real-world results
              on-chain with economic dispute bonds, ensuring Polymarket never exercises unilateral custody or
              discretionary settlement power over user balances.
