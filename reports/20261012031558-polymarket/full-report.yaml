  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The prediction market sector operates as a specialized financial information mechanism where binary
              outcome shares, priced between zero and one dollar, dynamically aggregate dispersed knowledge into
              tradable probabilities. While traditional financial derivatives hedge macroeconomic and commodity
              fluctuations and regulated sportsbooks capture recreational wagering through a four to five percent house
              edge, prediction markets financialize factual event consensus. Polymarket has expanded from episodic
              political cycles into high-frequency sports wagering, macroeconomic indicator forecasting, corporate
              performance metrics, and institutional sentiment signals. Sports markets now represent sixty-three percent
              of platform trading activity and over sixty percent of open interest, demonstrating that the market's
              addressable boundary is defined by event velocity rather than political seasonality alone.
            claimRefs:
              - CM001
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM010
              - CM014
      - number: '2.2'
        title: Addressable Market Sizing, Growth Trajectories, and Volume Scaling
        blocks:
          - type: paragraph
            body: >-
              Market sizing for prediction platforms requires distinguishing between gross event turnover and net
              platform revenue capture. Global prediction market trading volume expanded to approximately $50.25 billion
              in 2025, with long-term industry projections estimating the broader sector could scale to $95.5 billion by
              2035 at a compound annual growth rate approaching forty-seven percent. Within this ecosystem, Kalshi and
              Polymarket command an overwhelming duopoly, capturing 97.5% of total volume while long-tail decentralized
              competitors remain marginal. Polymarket's monthly volume scaled from $110 million in mid-2024 to $2.76
              billion in October 2025, ultimately peaking at $10.5 billion in March 2026. The platform's addressable
              boundary intersects the $300 billion global sports betting market, leveraging exchange-based taker fee
              structures rather than traditional bookmaking margins.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
