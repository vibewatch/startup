      - number: '7.5'
        title: Monitoring Indicators, Thesis-Break Triggers, and Diligence Strategy
        blocks:
          - type: paragraph
            body: >
              Institutional underwriting of Polymarket requires continuous monitoring of objective operational and legal
              inflection points. The foremost thesis-break trigger is a definitive state or federal court ruling
              rejecting Commodity Exchange Act preemption against state gaming laws [CR001]. If New York or a coalition
              of state attorneys general secures an enforceable injunction upheld on appeal, Polymarket would be forced
              to fragment its US operations, severely curtailing trading turnover and rendering its $112 million QCX
