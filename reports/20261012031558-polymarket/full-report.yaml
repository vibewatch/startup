        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Publicly visible leadership remains founder-centered. Coplan is the founder and chief executive; former
              CFTC chair J. Christopher Giancarlo leads the advisory board, Nate Silver is an adviser, and Neal Kumar is
              identified as chief legal officer. Those roles add regulatory, forecasting, and legal coverage, while the
              company-reported New York headcount of more than 350 suggests an operating organization beyond a
              founder-only venture. However, the available sources do not establish a complete executive roster, formal
              board composition, voting control, succession planning, or investor protective rights. Key-person and
              governance risk therefore cannot be closed from public evidence.
