            body: >
              Synthesizing Polymarket's comprehensive risk profile across legal, operational, architectural, and
              financial dimensions demonstrates an asymmetric exposure distribution. Legal and regulatory exposures
              represent the platform's highest severity category, driven by state attorney general enforcement actions
              that carry existential injunction threats [CR001]. Although Polymarket's acquisition of QCX provides a
              federal DCM defensive foundation, state litigation creates immediate legal defense costs and threatens
              retail market access across populous domestic jurisdictions [CR001, CR006].


              Operational and security risks rank second in potential business disruption. The recurring cadence of
              security incidents—spanning third-party JavaScript supply-chain injections and legacy operational key
              leakage—reveals ongoing maturity deficits in client-side software governance [CR004, CR005]. While
              management committed to full user reimbursements following the $3.1 million breach, recurring exploits
