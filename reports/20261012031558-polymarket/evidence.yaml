      licensing deal (October 2025) granting access to official data, marks, and in-broadcast advertising. Polymarket
      countered by signing MLB as its exclusive Official Prediction Market Exchange Partner (March 2026), gaining access
      to MLB marks and logos, official league data via Sportradar, and an integrity framework tied to MLB/CFTC
      cooperation—its first major North American league deal and a direct response to Kalshi's NHL advantage.
