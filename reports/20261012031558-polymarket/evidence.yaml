evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board and executive rosters, voting-control schedule, succession plan, investor protective rights, and
      related-party governance.
    whyItMatters: Founder dependence and investor control cannot be assessed from adviser titles or financing announcements.
    diligencePath: >-
      Request the current charter, bylaws, board minutes, cap table, voting agreements, side letters, and management
      succession materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Audited, unduplicated financing schedule separating primary capital, secondary sales, debt, transaction fees, and
      current cash availability.
    whyItMatters: >-
      Announced funding and valuation do not establish cash on hand, runway, liquidation preferences, or the economic
      seniority of each security.
    diligencePath: >-
      Reconcile bank statements, financing documents, debt schedules, cap-table ledgers, and audited cash-flow
      statements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Audited revenue, gross margin, burn, runway, active verified-human customers, wallet-to-person mapping, and global
      headcount.
    whyItMatters: Run-rate, wallet-address, and New York employee figures cannot be converted into comparable operating KPIs.
    diligencePath: >-
      Request audited financial statements, monthly cohort exports, bot and duplicate-wallet reconciliation, payroll
      records, and legal-entity headcount.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sports-volume-sustainability
    missingEvidence: >-
      Audited category-by-category trading breakdown verifying the long-term retention and net fee take rates of sports
      bettor cohorts outside major tournament peaks like the World Cup and NBA Finals.
    whyItMatters: >-
      Determines whether Polymarket can achieve non-cyclical revenue growth or remains vulnerable to volume collapse
      between major global sporting and political cycles.
    diligencePath: >-
      Obtain quarterly category-level transaction volume, unique active trader cohort retention curves, and fee yield
      reports from management or QCX clearing disclosures.
    relatedQuestionRefs:
      - QM009
      - QM005
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-financials
    missingEvidence: >-
      Audited fee revenue breakdowns, gross margins, and customer acquisition costs for both Polymarket US (QCX) and
      Kalshi.
    whyItMatters: >-
      Without disclosed financial statements, net take rate economics and unit profitability comparisons between hybrid
      decentralized exchanges and CFTC-regulated DCMs rely on published fee schedules rather than realized cash flow.
    diligencePath: >-
      Review future CFTC financial condition filings, audited FCM capital disclosures, or private placement memorandums
      detailing segment net revenue and liquidity provider subsidies.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: user-multihoming
    missingEvidence: >-
      Quantitative cohort retention and multi-homing overlap data comparing active users who trade simultaneously across
      Polymarket, Kalshi, and retail broker platforms like Robinhood.
    whyItMatters: >-
      User multi-homing limits customer switching costs and determines whether platform liquidity moats are defensible
      against new distribution entrants or simply dependent on temporary event subsidies.
    diligencePath: >-
      Analyze cross-chain wallet telemetry, on-chain settlement flows, and retail trading survey benchmarks measuring
      cross-platform wallet activity across election and sporting events.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited 2025-2026 financial statements disclosing gross revenue, cost of goods sold, infrastructure expenses, and
      operating cash burn.
    whyItMatters: >-
      Without audited financial statements, investors cannot verify whether reported $1B revenue run-rates reflect
      sustainable net cash generation or unaudited gross fee estimates.
    diligencePath: >-
      Request audited GAAP/IFRS financial statements, management discussion of financial condition, and fee revenue
      breakdown by category from Polymarket management.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: stablecoin-float
    missingEvidence: >-
      Formal disclosure of treasury yield sharing agreements, custodian breakdown, and total interest earned on customer
      USDC/pUSD collateral balances.
    whyItMatters: >-
      Collateral float yield represents a significant potential revenue stream whose net margin contribution to
      Polymarket versus Circle or liquidity providers remains unverified.
    diligencePath: >-
      Inspect custodial agreements, Circle institutional account yields, and smart contract float mechanics for pUSD
      reserve management.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
  - type: access-blocked
    severity: blocking
    topic: regulatory-litigation
    missingEvidence: >-
      Unredacted state regulatory correspondence and legal risk reserves related to the New York illegal gambling
