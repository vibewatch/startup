            body: Polymarket 在 2024 年美国大选期间实现大规模采用增长，但事件结束后未平仓量收缩超过 60%，说明如果体育和宏观交易不能持续提供交易速度，消费者预测市场在重大地缘政治催化剂之间会经历严重周期低谷。
