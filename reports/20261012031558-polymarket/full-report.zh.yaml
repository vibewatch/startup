      - number: '3.4'
        title: 护城河耐久性、法律反击与替代威胁
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的竞争护城河正面临监管、法律和运营层面的强力反击。随着预测市场从传统博彩公司吸走交易量和活跃用户，商业博彩游说团体与州监管机构发起了协调的法律挑战。2026 年 9 月，纽约州当局起诉
              Polymarket，指称其经营无牌博彩业务；类似的州级行动也针对 Kalshi 和 Coinbase，争议焦点都是联邦 CFTC 的先占管辖权。除司法辖区摩擦外，平台信任还受到软件界面层运营漏洞的影响。2026
              年 6 月，攻击者入侵向 Polymarket 网页应用提供代码的第三方前端供应商，注入恶意 JavaScript，从 11 个用户钱包中盗取 $3.1 million 的 pUSD，而底层 Polygon
              智能合约并未遭到破坏。随着 CME Group 等传统金融机构和 DraftKings 等博彩巨头通过收购 Railbird 等方式进入事件合约领域，Polymarket
              必须证明其混合式去中心化架构比受监管的传统交易所更能抵御合规风险和安全风险。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
