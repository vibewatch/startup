  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 受监管、去中心化与传统交易场所的竞争格局
        blocks:
          - type: paragraph
            body: >-
              全球预测市场生态已分化为两种主导的机构范式，旁边还有相邻的博彩业巨头。Polymarket 以超过 70% 的链上事件交易量占据去中心化领域，在 Polygon 上以 USDC
              抵押品面向全球扩张。其在美国的主要直接竞争者是 Kalshi：一家受商品期货交易委员会监管的指定合约市场，通过美国本土银行通道覆盖全部 50 个州。Polymarket 过去主导国际和政治预测；Kalshi
              则在受监管体育合约和经济指标上较早建立势头。除直接预测交易所外，竞争边界还包括 PredictIt 这类学术替代品、Manifold Markets 这类非货币社区预测平台，以及
              DraftKings、FanDuel 等大型商业博彩公司；后者正积极申请联邦交易所牌照或建立交易所合作，以防范事件合约造成的业务蚕食。2025 年末至 2026 年，这场竞争的规模已被锁定：洲际交易所承诺以 $8
              billion 投资前估值向 Polymarket 投入最高 $2 billion；与此同时，Kalshi 完成由 Sequoia Capital 领投的大额成长轮，达到数十亿美元私人估值。
            claimRefs:
