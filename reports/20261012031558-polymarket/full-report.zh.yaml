  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与估值框架
        blocks:
          - type: paragraph
            body: >-
              Polymarket 已成为全球领先、几乎没有直接竞争的去中心化预测市场；在 2024 至 2026
              年的选举和重大体育周期中，交易量呈指数增长。平台成功从零费率场所转型为采用多档吃单费率的变现交易所，据第三方估算和管理层表述，年化收入运行率已超过 $1 billion。Intercontinental
              Exchange 的战略支持和机构数据分发，进一步证明 Polymarket
              更像机构金融数据基础设施，而不只是投机性博彩场所。但这一乐观运营论点也有明显制约：交易量仍高度集中在阶段性现实事件上，以纽约为首的州政府已发起强硬诉讼，指控其经营无牌博彩。按目前披露的私募估值承销股权，必须假设预测平台属于受联邦优先适用保护的金融交易所，而非受州监管的博彩机构；这一假设在法律上仍有争议。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
