      - number: '3.3'
        title: 分销能力、媒体合作与多平台参与
        blocks:
          - type: paragraph
            body: >-
              预测市场流动性具有强网络效应，因此平台护城河高度依赖独家分销渠道和高曝光媒体整合。Polymarket 将自然社交传播转化为企业级分销，与 X、Google Finance 和 Yahoo Finance
              建立旗舰整合，把实时预测概率嵌入数亿次用户曝光中。此外，它与纽约证券交易所母公司洲际交易所的战略合作，通过 Polymarket Signals and Sentiment
              建立了机构数据馈送。在体育市场，Polymarket 通过成为美国职业棒球大联盟官方预测市场交易所合作伙伴，签下多年独家合作，回应 Kalshi 与国家冰球联盟的许可协议。与此同时，零售券商分销已成为
              Kalshi 最强的资产：Robinhood 将数百万零售经纪账户导入由 Kalshi
              交易所基础设施直接支持的预测市场。交易者可以跨界面使用多个平台，且切换成本不高；因此，长期留存取决于平台能否在高频体育、地缘政治和宏观经济合约上维持更深的订单簿和更窄的价差。
            claimRefs:
              - CP004
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
