              - CV007
              - CV010
              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 估值纪律需要耐心监测
            body: Polymarket 的全球品牌认知度和规模化交易量虽无可匹敌，但在 $15 billion 至 $20 billion 估值下投资股权，在经审计的净利润得到证明前，资本仍将暴露于显著的监管和利润率压缩风险。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
          - type: callout
            title: 州联邦监管分裂威胁国内 TAM
            body: 纽约总检察长的诉讼凸显了一个尚未解决的关键法律管辖权之争：联邦 CFTC 对合约市场的监管是否优先于州博彩法。这给美国增长预测带来重大的二元下行风险。
            calloutType: risk
            claimRefs:
              - CV005
