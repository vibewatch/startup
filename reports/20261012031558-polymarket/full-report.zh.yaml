      - number: '2.4'
        title: 采用催化剂、监管瓶颈与结构性阻力
        blocks:
          - type: paragraph
            body: >-
              平台扩张由 Polygon 零 gas 结算轨道、社交媒体病毒式传播和商业化吃单费变现共同推动，后者帮助 Polymarket 在 2026 年 6 月达到估算的 $1 billion
              年化收入。然而，结构性阻力严重限制运营。州博彩监管机构已质疑平台的合法性；2026 年 9 月，纽约州当局提起诉讼，指称 Polymarket 经营非法赌博企业。这起诉讼反映出更广泛的摩擦：20
              个州对联邦商品期货交易委员会的先占管辖权提出争议。与此同时，2026 年 6 月第三方供应商发生 $3.1 million 供应链漏洞，凸显网页前端层面的脆弱性，而智能合约审计无法缓解这种风险。
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 信息金融化：为未来知识定价
            body: 预测市场与传统注意力经济平台有根本区别：它让观点承担金融责任。合约价格反映概率共识，资金暴露会过滤投机噪声，使预测平台能够领先于传统民调和专家预测。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: callout
            title: 司法辖区摩擦：州博彩法对联邦 CFTC 先占管辖权
            body: Polymarket 在美国本土扩张面临激烈法律争议，州检察长认为二元事件合约构成无牌博彩。州博彩法规与联邦商品期货交易委员会先占管辖权之间的冲突，是其全国扩张的关键监管风险。
            calloutType: risk
            claimRefs:
