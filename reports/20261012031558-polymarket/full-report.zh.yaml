  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管暴露：联邦先占管辖权对州博彩执法
        blocks:
          - type: paragraph
            body: >
              Polymarket 的商业轨迹从根本上受联邦商品监管与州级博彩执法之间的司法辖区摩擦影响。2026 年 9 月，纽约州总检察长 Letitia James 和州长 Kathy Hochul 在州法院对
              Polymarket 提起重大民事执法诉讼，指称该平台经营非法、无牌体育博彩企业，并要求经济处罚、赔偿和立即停止运营 [CR001]。Polymarket
              坚称其交易所模式属于点对点事件衍生品交易，受商品期货交易委员会（CFTC）专属联邦管辖，能够排除州博彩法规的适用 [CR001]。


              这起州级挑战发生在动荡的联邦监管历史之后。2022 年 1 月，CFTC 对 Polymarket 母公司 Blockratize, Inc. 发出停止并终止令，并处以 $1.4 million
              民事金钱罚款，理由是其运营未注册的掉期执行设施并提供场外二元期权 [CR002]。Polymarket 同意排除美国参与者并实施地理封锁控制，从而解决了这些指控
              [CR002]。为建立合规的美国入口，Polymarket 于 2025 年完成对 QCX LLC 和 QC Clearing LLC 的 $112 million 收购，取得 CFTC
              注册的指定合约市场（DCM）牌照，并根据 Staff No-Action Letter No. 9113-25 获得监管救济 [CR006]。


              然而，监管正常化仍然脆弱。超过 20 个美国州已发起或威胁对预测市场运营商提起诉讼，检验联邦 DCM 指定在法律上能否使事件合约免受州级博彩禁令约束 [CR001,
              CR006]。与此同时，联邦审查重新出现：CFTC 正在调查 Polymarket 的推广者活动，此前有报道称创作者报酬未披露、交易展示存在模拟成分
              [CR013]。在美国之外，法国、巴西、意大利和直布罗陀的主权监管机构已实施全面访问禁令，表明国际监管碎片化会威胁 Polymarket 的全球可服务流动性池 [CR003]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR013
