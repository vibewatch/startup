      - number: '7.3'
        title: 结构性依赖、市场机制与资本拖累
        blocks:
          - type: paragraph
            body: >
              Polymarket 的市场机制制造了明确的机构摩擦点，核心在资本效率和对手方集中。在传统预测市场合约设计中，配置给二元结果代币的资金会以不产生收益的数字凭证形式锁定，直到事件最终结算
              [CR008]。对机构宏观交易台和企业资金管理配置者而言，这种结构性资本拖累带来严重机会成本：把大量资产负债表流动性投入跨季度地缘政治或宏观经济预测，就会放弃当前主权货币市场和隔夜无风险收益 [CR008]。


              流动性和交易量分布同样面临极端集中风险。在 2024 年美国总统选举周期中，一名老练的法国交易者控制四个协同账户，在 Donald Trump 身上下注超过 $30 million，最终在结算时获得 $85
              million 净利润 [CR014]。由于 Polymarket 不对个人市场参与者设置持仓上限，大额资本配置者可能不成比例地影响隐含概率定价，制造虚假情绪信号，并劝退风险厌恶型零售反向资金 [CR014]。


              此外，Polymarket 对关键合作伙伴存在深度商业和结构性依赖。洲际交易所（ICE）承诺最高 $2 billion 战略资本，其中包括 $1 billion D
              轮优先股主要股权，以及购买老股并向华尔街终端分发 Polymarket Signals and Sentiment 数据的协议 [CR010]。ICE 验证了机构采用，但若这一战略联盟恶化，Polymarket
              的主流金融分销就会受到威胁 [CR010]。与此同时，StartEngine 等平台承载的零售老股发行，会把资本汇入特殊目的载体，而不是提供直接股东股权，反映出治理不透明和股东权利从属 [CR011]。
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR014
