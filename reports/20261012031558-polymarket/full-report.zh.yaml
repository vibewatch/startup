          description: 潜在用户会接触到与突发新闻、选举或体育赛事实时绑定的众包概率合约。
        - label: 无摩擦账户创建与开户
          touchpoints:
            - 通过邮箱和 Google 社交登录创建热钱包
            - 通过 MetaMask 预测市场集成使用原生移动端
          description: 用户无需手动生成私钥或配置网络，从而绕开区块链使用门槛。
        - label: 抵押品入金与货币配置
