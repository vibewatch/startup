      - number: '6.4'
        title: 留存动态、大户集中与监管阻力
        blocks:
          - type: paragraph
            body: >-
              尽管头部交易量快速增长，Polymarket 仍存在显著的客户耐久性、留存和对手方风险。平台活动容易受到极端事件驱动的周期性影响：2024 年 11 月美国总统大选后，未平仓量立即骤降超过
              60%。此外，订单簿深度高度集中于大额下注大户；其数百万美元头寸可能扭曲定价概率，并在资金撤出时引发流动性冲击。非托管运营同样面临严重的客户端执行威胁：2026 年 6 月 25 日，被入侵的第三方网页供应商向
              Polymarket 网站前端注入恶意 JavaScript，从 11 个用户钱包中盗取 $3.1 million pUSD 稳定币。尽管智能合约未受影响，Polymarket 承诺全额赔偿用户，但该攻击凸显零售
              DeFi 获客环节的网页层漏洞。与此同时，州级法律挑战升级，纽约州当局于 2026 年 9 月提起诉讼，指称其经营无牌赌博业务。再加上 CFTC
              对社交推广活动的持续调查，以及法国、意大利的禁令，监管和安全摩擦威胁长期客户留存和机构开户。
            claimRefs:
              - CU005
