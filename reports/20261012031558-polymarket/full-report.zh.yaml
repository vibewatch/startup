      - number: '3.2'
        title: 交易架构、执行模式与费率经济学
        blocks:
          - type: paragraph
            body: >-
              事件市场场所之间的核心能力差异，集中在撮合机制设计、结算延迟和费用提取。早期去中心化预测协议依赖自动做市商，二元市场结算时会遭遇严重的无常损失。Polymarket 通过部署链下中央限价订单簿，配合
              Polygon 上的链上结算合约，实现免 gas 报单，消除了这一瓶颈。Kalshi 运营由清算所支持的集中式机构 DCM 撮合引擎。在商业定价上，Polymarket
              相比金融同业和传统博彩公司都具备明显费率优势。Polymarket 过去不收取费用；其 2026 年吃单费表则按品类收取 0.03% 至 0.07%，受监管美国交易所统一收取
              0.05%，并用所得资金向做市商返佣以维持订单簿流动性。相比之下，Kalshi 使用按概率加权的动态公式，在 50/50 赔率时峰值约为 1.75%，有效抽成率接近 1.0%。PredictIt
              等学术场所对净利润收取 10% 费用，并收取 5% 提现费，形成显著价格溢价。传统博彩公司则维持 4.0% 至 5.0% 的结构性持有率，使事件合约对活跃参与者而言资本效率高得多。
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP011
