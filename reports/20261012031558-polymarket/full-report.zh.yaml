  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将 Polymarket 的流动性规模、双重公司架构和监管摩擦依次串联，得出赛道推荐。
    data:
      nodes:
        - id: scale
          label: 市场规模与流动性
          description: 预测市场交易量占据主导，月度峰值超过 $10B
        - id: structure
          label: 双重运营架构
          description: 离岸加密通道（Blockratize）加受监管的美国交易场所（QCX LLC）
        - id: monetization
          label: 商业变现
          description: 推出吃单费后，年化收入运行率达到 $1B+
        - id: regulatory-scrutiny
          label: 监管与法律摩擦
          description: 纽约州总检察长提起的赌博诉讼，以及 CFTC 正在进行的营销调查
        - id: valuation-gap
          label: 估值倍数压制
          description: $15B-$20B 估值已计入无瑕疵执行，但利润率尚未得到验证
        - id: recommendation
          label: 投资建议
          description: 待监管形势明朗、入场估值倍数回落后再确定赛道评级
      edges:
        - from: scale
          to: structure
        - from: structure
          to: monetization
        - from: monetization
          to: regulatory-scrutiny
        - from: regulatory-scrutiny
          to: valuation-gap
        - from: valuation-gap
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV013
