      - number: '5.2'
        title: 订单撮合与链上结算模式
        blocks:
          - type: paragraph
            body: >-
              为提供机构级交易体验，同时避开纯去中心化金融协议的交易成本和延迟，Polymarket 采用链下与链上结合的运营模式。链下中央限价订单簿排序器以亚秒级速度撮合限价单和市价单，避开早期 Augur、Gnosis
              等去中心化预测协议曾遭遇的 gas 拥堵。订单撮合后，合约清算和结算直接在 Polygon 区块链上完成，由经审计的智能合约管理非托管资产。协议通过电子邮件和社交热钱包，以及 MoonPay、Stripe
              法币入金通道，抽象掉 Web3 复杂性，自动完成用户开户，让新交易者能在 60 秒内为账户充值。合约结果通过 UMA 去中心化乐观预言机协议最终确定；该协议以经济争议保证金把现实世界结果写入链上，确保
              Polymarket 不会对用户余额行使单方面托管或酌情结算权。
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE008
