      - number: '7.5'
        title: 监测指标、论点失效触发器与尽调策略
        blocks:
          - type: paragraph
            body: >
              机构评估 Polymarket 时，必须持续跟踪客观的运营与法律拐点。最主要的论点失效触发器，是州或联邦法院最终裁定《商品交易法》不能优先于州博彩法
              [CR001]。如果纽约或多个州的总检察长联合取得可执行且在上诉中获维持的禁令，Polymarket 将被迫拆分美国业务，交易额会大幅收缩，$112 million 的 QCX 交易所收购也将失去作用
              [CR001, CR006]。


              第二个关键监测指标是 CFTC 对促销营销行为的调查结果 [CR013]。不利的正式执法行动，尤其是限制零售用户开户或认定其反复违反 2022 年和解条款，将损害 Polymarket 通过 Coming
              Home GBA 扩展零售经纪业务的计划，并打乱其机构变现里程碑 [CR002, CR013]。


              最后，投资者必须监测平台网络安全完整性，以及费率变现后的交易量留存。12 个月内发生第三起重大安全漏洞，将表明基础设施存在系统性缺陷；实施费率后交易量持续收缩，则会推翻平台 $1 billion
              年化收入运行率的论点 [CR004, CR009]。严谨的投资前尽调应检查第三方供应商审计报告、复核法律优先适用意见，并审计洗售交易过滤的有效性。
            claimRefs:
