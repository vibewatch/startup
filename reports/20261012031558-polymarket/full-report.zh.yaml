            body: >-
              Polymarket 的参与者呈现明显的双峰结构，覆盖零售投机者、量化做市商和机构数据消费者。平台交易分布数据显示，超过百分之五十五的个人参与者下注 $10 至 $500，其中 $10 至 $50
              是最大的单一用户群，占 28.14%。下注 $5,000 至 $10,000 的高额账户仅占交易者总数的 0.71%，却提供了超出其规模的流动性。除了零售下注，量化基金还利用低延迟 API，在
              Polymarket 与受监管交易所之间执行跨场所套利；机构客户则通过洲际交易所的数据馈送获取标准化预测价格，用于风险模型。
