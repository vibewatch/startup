      - number: '7.4'
        title: 多维风险画像与热力图综合
        blocks:
          - type: paragraph
            body: >
              综合评估 Polymarket 在法律、运营、架构和财务维度的风险画像，可以看到其风险敞口分布并不对称。法律与监管风险最为严重，州总检察长的执法行动可能带来足以危及生存的禁令威胁
              [CR001]。Polymarket 收购 QCX 后虽获得了联邦 DCM 防御基础，但州级诉讼会立即推高法律防御成本，并威胁其在美国人口大州的零售市场准入 [CR001, CR006]。


              运营与安全风险对业务的潜在冲击排在第二位。安全事件反复发生，既包括第三方 JavaScript 供应链注入，也包括旧运营密钥泄露，说明客户端软件治理仍不成熟 [CR004, CR005]。管理层承诺在 $3.1
              million 的漏洞事件后全额赔偿用户，但漏洞反复被利用，削弱了机构将大额交易资金托管在平台上的意愿 [CR004]。


              财务与商业模式风险正处于转型期。2026 年初，Polymarket 从零费率增长模式转向多档吃单费率，同时对加密货币、体育和金融市场变现，并补贴流动性提供方 [CR012]。费率上线后，2026 年 6
              月年化收入预计达到 $1 billion；但如果变现扩张过快，零费率或能产生收益的替代方案可能带来竞争压力，导致交易量流失 [CR008, CR012]。图 FR001
              按发生可能性、严重程度、缓解成熟度和剩余敞口展示这些风险向量。
