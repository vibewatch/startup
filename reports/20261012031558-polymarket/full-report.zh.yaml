      - number: '8.2'
        title: 融资历史与所有权结构
        blocks:
          - type: paragraph
            body: >-
              Polymarket 的资本化轨迹是风险投资支持的金融科技中最陡峭的扩张之一，多轮融资累计募集 $2.8 billion 至 $3.9 billion 的一级和二级资本。Intercontinental
              Exchange 入场后，公司股权结构表发生深刻变化：该机构在 2025 年和 2026 年初通过多批优先股投入 $2 billion，取得约 22% 至 23% 的持股，成为公司最大外部股东，与
              Founders Fund 和 General Catalyst 并列。创始人兼 CEO Shayne Coplan
              仍掌握重要投票权并负责运营，但关键治理权、董事会构成，以及后期优先股可能享有的清算优先权，仍未向公开市场披露。此外，巴拿马和特拉华两套公司实体并行运营，使离岸协议业务与境内交易所之间的经济价值、费率流和监管责任如何切分变得复杂。
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV013
              - CV014
      - number: '8.3'
        title: 可比估值与情景分析
        blocks:
          - type: paragraph
            body: >-
              预测交易所的市场定价已脱离传统消费金融科技倍数，背后是平台网络效应和稀缺的机构分发渠道。直接可比公司 Kalshi 在 2026 年 5 月达到 $22 billion 估值，随后以 $40 billion
              启动新一轮融资讨论，为该品类设定了很高的定价上限。若年化收入运行率超过 $1 billion，Polymarket 披露的 2026 年 4 月 $15 billion 融资轮对应运行率收入 12x 至 15x
              的企业倍数；若估值谈判超过 $20 billion，倍数将接近 20x。在我们的估值情景中，乐观情景假设联邦 CFTC 优先适用经受住州级挑战，且美国日交易量超过 $300 million，对应企业价值 $25
              billion 至 $35 billion。基准情景则假设州级诉讼长期持续，倍数压缩至 $12 billion 至 $16
              billion；悲观情景下，若不利州博彩裁决迫使市场按地域分割并压低费率流动性，价值将收缩至 $4 billion 至 $6 billion。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.4'
        title: 推荐决策逻辑与尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合市场支配力、变现速度、监管摩擦和进入估值后，结论是明确建议推进，但风险评级高、估值偏紧。Polymarket 的流动性深度，以及与 Intercontinental Exchange
              的机构协同，体现出很强的特许经营价值；但当前超过 $20 billion 的一级和二级融资讨论，让面临二元监管和法律风险的外部投资者缺乏足够安全边际。下行触发器包括纽约总检察长诉讼中的不利裁决、CFTC
              正在进行的营销调查扩大执法，以及近期前端供应链事件暴露的安全漏洞。在考虑直接股权投资前，尽调必须解决三个不可妥协的问题：取得完整的经审计股权结构表，核实优先清算权；审查 QCX LLC 与 Blockratize
              之间的托管和清算准备金隔离；评估重大选举周期之外的流失指标。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
