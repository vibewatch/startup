        blocks:
          - type: paragraph
            body: >-
              Polymarket 是去中心化、事件驱动的预测交易所，允许参与者交易价格在 $0.01 至 $0.99 之间的二元结果份额。合约价格动态反映实时的众包概率，胜出结果结算为 $1.00，落败结果结算为
