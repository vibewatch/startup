    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Polymarket 由 Shayne Coplan 于 2020 年创立，总部位于纽约市。产品是一个点对点二元事件合约市场：用户交易结果份额，份额价格反映市场隐含概率；国际平台以 USDC
              结算，并依托区块链完成清算。Polymarket 将这一国际场所描述为非托管平台，且美国及其他受限地区用户无法使用，同时把 Polymarket US 定位为独立的 CFTC
              监管交易所。这种双平台结构是公司身份的核心，但不能因为监管标签就推断所有产品或司法辖区风险都已解决。
