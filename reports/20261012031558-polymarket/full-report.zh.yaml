              - CI004
      - number: '4.2'
        title: 品类定价表与利润瀑布
        blocks:
          - type: paragraph
            body: >-
              Polymarket 交易收入的经济引擎由定价公式 C * feeRate * p * (1 - p) 决定，其中 C 代表合约份额交易量，feeRate 是按品类设定的费率常数，p
              代表合约市场价格。由于不确定性项 p * (1 - p) 在 p = 0.50 时最大，有效吃单费在 50 美分中点达到峰值。加密市场的常数最高，为 0.072，在不确定性最高时每 100 份的有效费用约为
              3.6%。经济、文化和天气市场随后，常数为 0.05（峰值费率 2.0%）；金融、政治、科技和提及类市场为 0.04（峰值费率 1.6%）；体育市场维持 0.03（峰值费率
              1.5%）。地缘政治和世界事件合约按政策严格零费率，以保持敏感国际领域的中立。2026 年品类交易量构成发生剧烈变化：体育市场超过政治选举下注，约占平台总交易量的 39% 至
              40%。选举交易曾带来巨大脉冲式交易量，例如 2024 年总统选举的 $3.3B 下注；体育市场则在 MLB、NBA 等主要联赛中提供每日重复交易速度。为维持持续的市场流动性，Polymarket
              运营自动化做市返佣计划：加密市场返还 20% 的费用，其他收费品类返还 25% 给做市商，从而收窄价差，同时保留净交易利润。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI011
      - number: '4.3'
        title: 单位经济、资本充足性与安全负债
        blocks:
          - type: paragraph
            body: >-
              除交易费外，Polymarket 还通过稳定币抵押品浮存收益获得可观的非交易收入。每份二元合约在市场正式结算前都要求以一美元稳定币全额抵押，因此数亿美元 USDC 和原生 Polymarket
              USD（pUSD）被锁在智能合约和资金储备中。将这些闲置余额配置到短期美国国债或机构 Circle 账户，按当时 4% 至 5%
              的无风险利率计算，每年可产生数千万美元的高毛利浮存收入，且不受交易量波动直接影响。引入 pUSD 后，这套浮存架构进一步强化，Polymarket
              对结算资产储备和利息经济拥有更强的运营控制。浮存收益之外，机构数据变现依托与洲际交易所（ICE）的战略关系。ICE 于 2025 年 10 月以 $8.0B 估值进行初始 $1.0B 投资，并在 2026 年 3
              月 27 日追加 $600M 直接现金注资；随后，ICE 将 Polymarket Signals and Sentiment 数据馈送直接分发给金融终端订阅者。然而，资本扩张也伴随运营负债：2026 年 6
              月，第三方前端供应商脚本遭入侵，从 11 个用户钱包中盗取 $3.1M pUSD。尽管链上智能合约未被攻破，Polymarket 仍被迫动用内部资本全额赔偿受影响用户，凸显网页层依赖风险。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 财务尽调结论与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              从机构投资判断看，Polymarket 的收入增长轨迹极其惊人，但结构性披露缺口也很严重。Sacra 估计其 2026 年 6 月年化收入运行率为 $1.0B，相比 2025
              年几乎没有收入的状态大幅跃升；这说明，在月度交易量峰值超过 $10B 的平台上引入吃单费，释放了巨大的变现杠杆。此外，通过 QCX LLC d/b/a Polymarket US 获得联邦监管推进，并在 CFTC
              指定合约市场监管下建立了可行的合规路径，缓解了过去离岸运营受限的问题。尽管如此，在没有经审计财务报表的情况下，私人尽调无法把 Polymarket 的 $15B
              报告估值计入投资判断。公司未公开披露毛利率、基础设施和 Polygon gas 补贴成本、获客成本或做市返佣净留存率。与此同时，州级当局的激烈法律反击——纽约州 2026 年 9
              月提起诉讼，指称非法赌博并寻求禁令式停业——给美国本土扩张带来尾部风险。在正式数据室提供经审计损益表、抵押品收益分成条款和州级诉讼准备金之前，Polymarket
              的商业模式只能被视为概念上高度盈利，但实际净现金创造能力仍未得到验证。
            claimRefs:
              - CI013
              - CI014
