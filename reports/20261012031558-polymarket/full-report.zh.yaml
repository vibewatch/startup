      - number: '7.2'
        title: 运营漏洞与网页层前端安全
        blocks:
          - type: paragraph
            body: >
              去中心化预测市场的架构设计旨在消除中心化托管风险，但 Polymarket 的运营历史暴露出网页交互层的严重漏洞。2026 年 6 月 25 日，攻击者入侵向 Polymarket
              网站前端提供代码依赖的第三方软件供应商，成功注入恶意 JavaScript，诱导用户签署未经授权的交易 [CR004]。这起客户端供应链攻击在恶意依赖被隔离和移除前，从 11 个用户钱包中盗取了 $3.1
              million pUSD 稳定币 [CR004]。


              更关键的是，这起事件证明了不可变智能合约执行与可变前端界面之间存在结构性脱钩 [CR004]。Polymarket 在 Polygon
              上的底层智能合约完全按设计运行，执行加密签名交易且不存在逻辑漏洞；漏洞完全在上游生效，通过操纵展示给用户的视觉提示实现攻击 [CR004]。这是 Polymarket 五周内第二起严重安全故障；此前 2026 年
              5 月的一起事件中，暴露的旧私钥从内部奖品支付运营钱包中盗走了 $520,000 至 $700,000 [CR005]。


              除前端依赖风险外，Polymarket 还高度依赖外部去中心化基础设施完成合约结算。平台将结果验证委托给 UMA 乐观预言机协议，该协议利用经济激励和代币持有者投票来最终确定事件结果 [CR007]。这种机制阻止
              Polymarket 对市场结算行使中心化酌处权，这是避免承担对手方风险的重要法律保障；但它也让交易所暴露于治理僵局、结算延迟，以及针对主观或含糊结果标准的潜在经济投票攻击 [CR007]。
            claimRefs:
              - CR004
              - CR005
              - CR007
