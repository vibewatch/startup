  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出分类
        blocks:
          - type: paragraph
            body: >-
              预测市场是专门的金融信息机制：二元结果份额定价在零到一美元之间，把分散知识动态汇聚为可交易概率。传统金融衍生品用来对冲宏观经济和大宗商品波动；受监管博彩公司则通过百分之四至百分之五
              的庄家优势承接娱乐性下注；预测市场则把事实事件共识金融化。Polymarket 已从阶段性的政治周期扩展到高频体育博彩、宏观经济指标预测、企业业绩指标和机构情绪信号。体育市场如今占平台交易活动的
              百分之六十三，未平仓合约也超过六成，说明其可服务市场的边界由事件发生速度决定，而不只是政治季节性。
            claimRefs:
              - CM001
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM010
              - CM014
      - number: '2.2'
        title: 可服务市场规模、增长轨迹与交易量扩张
        blocks:
          - type: paragraph
            body: >-
              预测平台的市场规模必须区分事件总成交额与平台净收入捕获。全球预测市场交易量在 2025 年扩大至约 $50.25 billion；长期行业预测认为，到 2035 年，更广义的行业规模可能增至 $95.5
              billion，复合年增长率接近百分之四十七。在这一生态中，Kalshi 和 Polymarket 形成压倒性的双寡头，合计占总交易量的 97.5%，长尾去中心化竞争者仍处边缘。Polymarket 月度交易量从
              2024 年年中 $110 million 增至 2025 年 10 月的 $2.76 billion，最终于 2026 年 3 月达到 $10.5 billion 的峰值。平台的可服务边界还与全球 $300
              billion 体育博彩市场相交，其采用交易所式吃单费结构，而非传统博彩公司的利润率。
