  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现架构与交易费机制
        blocks:
          - type: paragraph
            body: >-
              Polymarket 在 2025 年末至 2026
              年间经历了商业模式的根本转变，从旨在最大化获客、由风险资本补贴的零费率平台，转向机构级金融信息交易所。不同于作为庄家、以资产负债表承担客户对手方风险的传统博彩公司或二元博彩业务，Polymarket
              纯粹运营点对点中央限价订单簿，参与者以稳定币计价交易二元结果合约。在这一结构下，交易者亏损并不会直接给公司带来利润；公司变现的是市场流动性、托管余额和价格发现数据，主要渠道有三项：浮动交易吃单费、锁定抵押品的利息收益，以及机构数据授权合作。平台积极变现的基石是
              Fee Structure V2：2026 年 1 月先在高频加密市场启动，2 月扩展至部分体育市场，并于 2026 年 3 月 30
              日全球落地。在这一动态费率表下，流动性提供者获得费用返还，以维持窄买卖价差；主动吃掉挂单流动性的吃单者则支付按结果概率不确定性加权的交易费，使高度不确定的 50
              美分二元合约获得最高费用捕获，而接近确定结果的合约以最低摩擦交易。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
