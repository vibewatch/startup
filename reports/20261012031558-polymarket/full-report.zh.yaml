      - number: '5.4'
        title: 安全架构、供应链事件与合规控制
        blocks:
          - type: paragraph
            body: >-
              尽管 Polymarket 链上结算合约在数学上正确，平台客户端网页应用仍是重大的运营风险向量。2026 年 6 月，恶意行为者入侵向 Polymarket 网站提供代码的第三方前端供应商，注入恶意
              JavaScript，操纵客户端交易提示，并在缓解前从 11 个用户钱包中盗取 $3.1 million
              pUSD。该漏洞表明，即使智能合约运行无误，去中心化应用仍高度容易遭遇网页供应链攻击。与此同时，Polymarket 还面临严重的州级监管阻力。2026 年 9 月，纽约州当局对 Polymarket
              启动法律程序，指称该场所经营无牌商业赌博企业，违反州法。Polymarket 主张商品期货交易委员会框架下的联邦监管先占管辖权，并通过 QCX
              获得指定合约市场审批路径；但州级执法行动仍威胁美国本土流动性接入，并挑战预测合约的法律分类。
