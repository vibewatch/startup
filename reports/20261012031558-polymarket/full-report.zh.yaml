    data:
      layers:
        - label: 应用与界面层
          detail: Web 前端、移动端自适应客户端、社交登录、MoonPay/Stripe 法币入金通道，以及嵌入式合作伙伴组件（X、Yahoo Finance、Google Finance）。
        - label: 开发者与机构 API 层
          detail: 公共 TypeScript SDK（@polymarket/client）、REST/WebSocket 市场数据端点、CLOB 交易 API，以及 ICE 机构市场数据流。
        - label: 订单路由与撮合层
          detail: 链下中央限价订单簿（CLOB）撮合引擎，支持按费率表执行、做市商返佣和实时概率定价。
        - label: 账户与交易抽象层
          detail: 由 Brahma 驱动的账户抽象、非托管钱包管理，以及吸收 Polygon 可见 Gas 成本的元交易。
        - label: 智能合约结算层
          detail: 经过审计且不可变的二元结果代币合约、pUSD/USDC 抵押品金库，以及非托管的自动交易结算。
        - label: 预言机与争议解决层
