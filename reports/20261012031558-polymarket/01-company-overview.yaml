callouts:
  - calloutType: "risk"
    title: "Scale metrics are not interchangeable"
    body: >-
      Sacra's $1B annualized-revenue estimate, 2.5M observed wallet addresses, and a company statement of more than 350 New York employees measure different populations and periods. None establishes audited revenue, ARR, cash available, verified customers, or global headcount.
    claimRefs: [CO013, CO014, CO016]
  - calloutType: "insight"
    title: "Institutional validation and legal exposure rose together"
    body: >-
      ICE's capital and distribution relationship strengthened Polymarket's institutional position, but the September 2026 New York action shows that federal exchange infrastructure does not eliminate state-level legal contestation.
    claimRefs: [CO011, CO012, CO015]
