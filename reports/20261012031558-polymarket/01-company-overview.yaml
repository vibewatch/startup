chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Polymarket is a New York-based prediction-market company founded by Shayne Coplan in 2020, with an international non-custodial platform and a separate U.S. regulated exchange path. Its capital base and reported scale expanded sharply through ICE investments, but the strongest current revenue number is a third-party annualized estimate rather than audited revenue, while private governance terms and a September 2026 New York lawsuit remain material diligence constraints.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Polymarket was founded in 2020 by Shayne Coplan and is based in New York City. The product is a peer-to-peer market for binary event contracts: users trade outcome shares whose prices reflect market-implied probabilities, with USDC and blockchain-based settlement used on the international platform. Polymarket describes that international venue as non-custodial and unavailable to U.S. and other restricted users, while presenting Polymarket US as a separate CFTC-regulated exchange. This two-platform structure is central to the company identity, but the regulatory label should not be generalized into a conclusion that every product or jurisdictional exposure is settled.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Publicly visible leadership remains founder-centered. Coplan is the founder and chief executive; former CFTC chair J. Christopher Giancarlo leads the advisory board, Nate Silver is an adviser, and Neal Kumar is identified as chief legal officer. Those roles add regulatory, forecasting, and legal coverage, while the company-reported New York headcount of more than 350 suggests an operating organization beyond a founder-only venture. However, the available sources do not establish a complete executive roster, formal board composition, voting control, succession planning, or investor protective rights. Key-person and governance risk therefore cannot be closed from public evidence.
    claimRefs: [CO002, CO008, CO016]
    tableRefs: [TO002]
  - id: "capital-and-scale"
    title: "Capitalization and operating scale"
    body: >-
      Polymarket's financing accelerated from approximately $70 million raised across two spring 2024 rounds to a strategic ICE transaction announced in October 2025. The latter combined $1.0 billion of Series D primary capital with an agreement for up to $1.0 billion of secondary purchases and implied an approximately $8 billion pre-investment valuation. Sacra further reports a $600 million ICE Series E investment on March 27, 2026. Scale evidence is less standardized: Sacra estimates $1 billion of annualized revenue in June 2026, while an April report counted 2.5 million wallet addresses but found only about 7%–8% profitable. Neither metric is audited revenue, ARR, cash availability, or a verified customer count.
    claimRefs: [CO009, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: "milestones-and-adverse-events"
    title: "Milestones and adverse events"
    body: >-
      The milestone record combines regulatory setbacks, a regulated U.S. re-entry, institutional financing, and renewed state-level legal pressure. A 2022 CFTC settlement imposed a $1.4 million penalty and restricted U.S. access; the 2025 QCEX acquisition then supplied regulated U.S. infrastructure. ICE's 2025 and 2026 investments materially changed Polymarket's capital and ownership profile. The latest adverse event in the assigned evidence is New York's September 24, 2026 lawsuit, which alleges an illegal gambling operation and seeks to halt operations, impose penalties, and obtain consumer restitution. The allegation is unresolved, so it is a live legal risk rather than a finding of liability.
    claimRefs: [CO007, CO010, CO011, CO012, CO015]
    figureRefs: [FO001]
