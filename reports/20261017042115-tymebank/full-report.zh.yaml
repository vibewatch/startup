      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 当前融资以干净条款完成；合并经审计盈利支持增长叙事；所述 2028 年 IPO 路径仍然可信。
        - 根据已分配证据，无法支持数值区间；若要高于历史 $965M 指示价，必须有经审计的利润转化和不居于次位的条款支持。
        - 优先股堆叠仍未披露；跨市场执行可能消耗超出预期的资本。
        - 在集团经审计财务和最终融资条款披露前，概率较低。
      - - 基准
        - 业务质量仍可信，但已分配证据仍局限于已报道的 2024 年流程、2023 年融资历史和里程碑式盈利披露。
        - 无法支持当前区间；$965M 只能视为历史指示价，进入前必须要求当前价格和优先股堆叠文件。
        - 证据可能滞后于当前表现；投资者仍面临关于稀释和持有期的信息不对称。
        - 在已分配证据中概率最高。
      - - 悲观
        - 当前融资定价低于 2024 年指示价，盈利能力被证明不够持久，或 IPO 时点出现重大延迟。
        - 溢价进入缺乏公开支持；下行可能来自估值倍数下修，以及任何偏向现有投资者的结构化保护安排。
        - 融资条款可能明显差于对外宣称的估值；若增长变现停滞，资本需求可能增加。
        - 若管理层无法填补融资和披露缺口，风险将很大。
    notes: 情景区间只锚定已披露的公开标记；由于当前股权结构表、优先股堆叠和当前估值标记并未公开，本表有意避免不受支持的精确度。
