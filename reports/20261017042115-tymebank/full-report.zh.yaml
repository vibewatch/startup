  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：知名对手清晰可见，但当前样本并不对称
        blocks:
          - type: paragraph
            body: >-
              指定样本支持一张可信的竞争地图，却不足以构成完全更新、同口径的同行普查。当前公开比较材料在 GoTyme Bank 品牌重塑背景下明确点名 Capitec Bank、Discovery Bank 和 Bank
              Zero；历史 2019 年案例快照则显示，TymeBank 当时已面对传统银行降价回应、African Bank 的零费率攻势、Discovery Bank 上线和 Bank Zero
              的纯应用进入。这说明竞争问题并不新鲜：低费率传统银行回应和数字化挑战者从一开始就是 Tyme 的市场背景。缺少的是每个对手 2026
              年产品、价格和客户规模的同样新、独立来源包，因此本章可以有把握地描绘市场，但必须把许多对手单元标为未知，不能暗示样本没有证明的平价或优势。
