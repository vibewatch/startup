        blocks:
          - type: paragraph
            body: >-
              南非银行的公开治理信息较好，但当前集团股权结构的可见度明显较弱。2023 年法定申报显示，Coenraad Jonker 任 CEO、Yvette Dockrat 任
              CFO，并设有广泛的非执行董事会；同一申报记录了重组：Tyme SA Holdings 和总部位于新加坡的 Tyme Group Pte. Ltd. 被置于 Tyme Bank Holdings
