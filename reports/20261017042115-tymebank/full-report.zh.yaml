      - number: '3.2'
        title: 分销与可及性仍是最清晰的差异化
        blocks:
          - type: paragraph
            body: >-
              保留证据中最清楚的差异化不是秘密功能，而是分销设计。公司控制材料和独立报道都把 GoTyme 描述为无网点混合模式：应用配合 kiosks、零售伙伴现金服务和门店快速开户。Tech In Africa
              与重新发布的 TymeBank 新闻稿都将增长归因于零售伙伴网络、kiosk 模式和低成本获客逻辑；官方品牌重塑页面仍把零月费、五分钟内开户、免费即时支付和强储蓄定位作为大众市场价值主张。实际上，GoTyme
              最容易守住的优势，是买方更看重方便开户、存取现金和嵌入式零售触达，而不是完整的传统网点网络。
