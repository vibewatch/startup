      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个可信的零售银行收入引擎：存款吸收有规模，产品持续扩张，且至少有一次后续月度盈利说法。但它还不足以支持对集团可持续盈利质量或当前资本充足性的高置信判断。最强的正面信号是，TymeBank
              似乎在增加贷款和商户融资产品的同时，扩大了获客和存款吸收。最强的负面信号是，经审计的 FY2023 账目仍需要持续资本支持，ARC 未标日期的投资页面也称 AI 和分析投入带来短期压力。在没有
              FY2024-FY2026 集团合并报表、实际定价、损失率披露和当前融资承诺前，正确的财务判断是“经营杠杆前景可期，但尽调可见度不完整”。
