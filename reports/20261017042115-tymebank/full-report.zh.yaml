  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序快照
        blocks:
          - type: paragraph
            body: >-
              最强证据并不指向 TymeBank 转为 GoTyme 会立即带来牌照重置风险：官方和独立来源一致称银行保留原南非牌照和监管。更大的短期问题是执行。GoTyme 于 2026 年 1 月 22
              日推出新应用，并称迁移将分阶段进行，以保护安全、稳定性和客户体验；这令人放心，但也确认了一项正在运行的运营变更计划，涉及客户账户、移动访问、卡、kiosks
              和支持。财务侧当前状态透明度更低。指定样本中最新的经审计银行申报是 2023 年 6 月，因此投资者看得到风险类别、运营亏损披露和依赖结构，却看不到更新至 2026
              年的信贷损失、资本、流动性或迁移后投诉指标。实际排序因此是：1）迁移和服务连续性；2）外部依赖与开户脆弱性；3）公开报告陈旧背景下的资产负债表和中小企业信贷敞口；4）投诉增长快于支持能力时的行为风险。
