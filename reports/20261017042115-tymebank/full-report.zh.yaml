      - number: '4.3'
        title: 资产负债表结构与资本依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据仍是 Tyme Bank Limited 的 FY2023 年度财务报表。报表显示，这是一张由存款支持的资产负债表：客户存款 R4.005 billion、客户贷款净额 R1.668
              billion、现金及现金等价物 R1.680 billion、利息收入 R672.6 million、净费用和佣金收入 R336.1 million。报表还显示年度亏损 R858.1 million、累计亏损
