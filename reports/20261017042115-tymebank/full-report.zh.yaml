        - 官方 2026 年材料称，这家南非银行服务超过 1,200 万名客户，集团在全球服务 2,000 万名客户。
        - 买入逻辑需要经审计的变现、留存和分部经济性，而不能只看客户总数。
      - - 融资历史显示有可信的投资者支持。
        - 2023 年报道称 TymeBank 在 C 轮前融资中筹得 $77.8M，累计融资超过 $260M。
        - 更强的判断需要当前融资轮实际完成情况，而不是历史融资里程碑。
      - - 盈利能力方向上向好。
        - ITWeb 称该银行在 2023 年 12 月实现首个月度盈利。
        - 更强的判断需要银行和集团层面持续且经审计的盈利，而不是一个里程碑月份。
      - - 当前估值支撑仍不完整。
        - 2024 年报道提到此前的 $965M 指示价，以及目标为“独角兽估值”的 D 轮。
        - 要转为买入，需要当前条款、优先股堆叠，以及由独立证据验证的 2024 年后估值标记。
      - - 对历史资本的依赖很明显。
        - FY2023 文件称，要在 2024 年 10 月之后继续运营，取决于股东支持、新资本、营运资本授信额度和执行情况。
