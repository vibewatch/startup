            body: >-
              现有时间线足以支撑后续章节。公司从注册和获牌起步，进入 2019 年公开上线；2022 年收购 Retail Capital，补上了商业贷款能力；2023 年 12 月首次实现月度盈利；随后又在 2026 年借
