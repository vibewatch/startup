companyProfile:
  summary: >-
    TymeBank 是 Tyme Group 旗下的南非数字零售银行，将应用驱动的开户与实体 kiosks、零售合作伙伴及其他分销渠道结合起来。公开记录显示，公司于 2019 年上线，截至 2026 年已拥有超过 1,200
    万名南非客户，并于 2023 年 12 月首次实现月度盈利；消费者端材料已改用 GoTyme Bank 品牌，但底层南非银行牌照未变。
  headquarters: Johannesburg, South Africa
  productSummary: 通过应用和混合实体渠道提供数字交易银行、储蓄，以及相邻的贷款和商户融资产品。
  customerFocus: 面向大众市场的南非消费者和中小企业
  businessModel: 以存款为核心的零售银行业务，辅以贷款、商户融资及相邻金融产品
