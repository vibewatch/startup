    rows:
      - - 日常零售银行
        - 面向大众消费者的交易账户、储蓄、借记卡使用、账单支付和资金转移。
        - 全方位财富管理、企业资金管理及网点咨询经济。
        - 买方、用户和付款方是个人消费者或家庭。
        - 这是 CGAP 研究和 GoTyme 当前定位支持的核心服务市场。
      - - 接入与开户层
        - 数字开户、KYC、应用服务、自助服务亭，以及零售商支持的现金存取。
        - 传统网点获客和重网点服务流程。
        - 买方、用户是零售客户；付款方是银行，承担获客和服务经济成本。
        - 之所以关键，是因为分销模式是主要的采用优势。
      - - 信贷相邻市场
        - 与现有客户或 SME 流程相连的先买后付和商户现金预支产品。
        - 未经验证的全谱系个人贷款或普惠型 SME 银行服务。
        - 买方、用户和付款方因产品而异；公开证据最清楚地指向需要营运资金支持的 SME。
        - 这是相关的相邻市场，但不是主市场论点的清晰边界。
      - - 集团扩张叙事
        - 南非与 Tyme Group 各市场之间的品牌和平台协同。
        - 把集团所有地区视为一个南非本地收入池。
        - 买方和用户仍是各本地市场客户；集团规模更多体现能力，而不是本地 TAM。
        - 这影响估值叙事，但不用于定义本地服务市场。
    notes: 边界结合了 CGAP 的独立研究与公司、媒体当前披露；排除项标出公开证据不足以支持更广义全能银行市场定义的领域。
