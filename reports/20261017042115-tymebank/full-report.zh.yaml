        title: 法律身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              这组材料支持的是延续性判断，而不是新公司判断。Tyme Bank Limited 于 2015 年注册，2017 年获准开始营业，2018 年试运营，并从 2019 年 2 月 25
              日起公开推广交易账户和储蓄账户。2023 年年度财务报表将其定义为总部位于约翰内斯堡 Rosebank 的南非数字银行服务企业；2026 年公司材料称消费者品牌已转为 GoTyme
              Bank，但底层持牌南非银行不变。客户体验仍是混合模式而非纯应用模式：数字开户和应用服务与 kiosks、商场网点及零售合作伙伴并存，尽管桌面网银已退出，Pick n Pay kiosks 也已撤出。
