      - number: '3.4'
        title: 在触达和成本上有可信耐久性，但完整同行可比性尚未证明
        blocks:
          - type: paragraph
            body: >-
              保留来源支持一个具体竞争判断：零售触达、开户速度和低运营成本重要时，GoTyme 表现最强；如果决策依赖对手产品包装、信贷广度或传统银行跟价能力的完整可比分析，它就较弱。IdeaToola
              的基准式页面在客户规模和效率上偏向
              Tyme，但没有在正文中展示原始文件，因此更适合作为方向性基准，而非决定性记分卡。同时，当前样本仍缺少若干知名对手实时且直接可比的价格表和产品披露。结论是，本章可以有理有据地提出分销驱动的护城河和真实的传统银行回应风险，但仍应把当前同行定价精度标为尽调缺口，而不是已解决的问题。
            claimRefs:
              - CP013
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 分销护城河来自触达，而非秘密
            body: 样本最强的支持是：GoTyme 的 kiosk 加应用混合模式与零售伙伴，创造了纯应用挑战者在保留证据中显然不具备的实体开户和现金服务优势。
            calloutType: strength
            claimRefs:
              - CP003
              - CP007
          - type: callout
            title: 传统银行在价格上的回应速度，快于样本对深度的证明
            body: 历史证据已显示费率压力和挑战者进入，当前证据则指向 Capitec 主导的贷款深度；实时对手价格表尚不可得，因此超出触达和成本的护城河说法仍应保持保守。
            calloutType: risk
            claimRefs:
