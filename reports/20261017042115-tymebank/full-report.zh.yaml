  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方定义
        blocks:
          - type: paragraph
            body: >-
              最有依据的市场边界不是抽象的“非洲金融科技”，而是面向价格敏感型零售用户的南非日常消费者银行业务：他们需要低摩擦开户、支付、储蓄和现金服务。CGAP 将 TymeBank
              描述为一家以普惠金融为出发点的全数字零售银行；当前 GoTyme
              定位仍强调零月费、快速开户、储蓄，以及通过合作零售店存取现金，而不是以网点为中心的顾问服务或广泛财富产品。因此，经济上真正相关的替代方案是低费率传统银行账户、其他数字挑战者，以及非正式或高现金依赖的现状行为；面向中小企业的现金预支业务更适合作为相邻市场，而非核心服务市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
      - number: '2.2'
        title: 规模测算更清楚地显示采用偏斜，而不是支出型 TAM
        blocks:
          - type: paragraph
            body: >-
              公开来源提供了有用的市场形态视角，却没有干净的支出型 TAM/SAM/SOM。CGAP 对南非市场的分析从一个银行普及率已很高的市场出发：约 85% 的成年人拥有银行账户。因此，TymeBank
              的机会不在于首次创造品类，而在于争取服务不足的人群，并做出更便宜的分销经济性。最有力的规模证据是人群结构偏斜：月收入不超过 US$200 的人占总人口 47%，只占有银行账户人口的 41%，却估计占研究期内
              TymeBank 活跃客户的 48%。2026 年官方披露补充了当前规模指标——南非客户超过 12m，Tyme Group 客户达到 20m——但这些是客户数采用指标，不是收入池；一篇 ITWeb
              报道似乎还混淆了南非银行客户数与集团客户数。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM016
