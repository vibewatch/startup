      - number: '2.3'
        title: 采用动力来自可负担性与可及性；约束是信任、服务和品类竞争
        blocks:
          - type: paragraph
            body: >-
              当前证据指向一个由较低服务成本、广泛零售触达和简单产品设计驱动的增长引擎。CGAP 报道，TymeBank 的无网点、微服务架构模式依靠 kiosks 和网页渠道，以显著更低的单位成本实现每月约 110,000
              名新客户；客户最常提到低费用和储蓄功能是产品有吸引力的原因。同一证据也明确了主要约束：安全顾虑、服务延迟、数字接入摩擦，以及对实体支持的剩余需求；与此同时，低费率传统银行以及 Discovery
              Bank、Bank Zero 等挑战者抬高了竞争门槛。市场足够大、结构上也有吸引力，能够支持继续获客，但在缺少分部收入、存款和参与度披露时，很难据此承受更高估值。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
