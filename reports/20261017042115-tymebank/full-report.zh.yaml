            body: >-
              监管连续性看起来强于许多执行风险，但并非零风险。当前条款和官方品牌重塑材料称，更名后银行仍在南非持牌并受监管，因此核心法律实体看似完整。同一组条款也显示，控制框架有多大程度依赖银行无法独立控制的身份与合规基础设施：开户依赖内政部生物识别数据、征信机构和额外
              AML 文件；检查失败或怀疑存在非法使用时，银行保留拒绝或关闭账户的权利。这在运营上合理，但若外部数据源大规模出错，会制造客户摩擦和行为风险。投诉升级渠道至少是明确的：未解决争议 20 天后可提交
