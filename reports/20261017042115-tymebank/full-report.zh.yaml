    approximationNotes: 这是受约束的采用视角，不是单一分母的 TAM/SAM/SOM 堆栈。由于保留来源没有披露 GoTyme 以收入为基础的公开市场细分模型，本图保留每个已发布百分比所属的人群语境。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于保留公开资料池的序数定位显示，GoTyme 在触达范围和合作伙伴带来的广度上最强，而当前竞争对手的定价细节仍然稀少。
    data:
      xAxis:
        label: 分发触达 / 人工触点（序数）
        min: 1
        max: 5
        low: 仅 App 或触达范围窄
        high: 嵌入式零售触达或成熟网点
        description: Evidence-backed ordinal scoring from cited public sources.
        scale: ordinal
      yAxis:
        label: 引用来源中的零售银行广度（序数）
        min: 1
        max: 5
        low: 定位窄或仍处早期
        high: 更广的零售或信贷产品栈
        description: Scores reflect only what the assigned public pool explicitly supports.
        scale: ordinal
      points:
        - label: GoTyme Bank
          x: 4
          'y': 4
          detail: App 加零售网点和合作伙伴现金服务；引用来源显示其拥有储蓄、中小企业金融和更广泛的产品路线图。
        - label: Discovery Bank
          x: 2
          'y': 4
          detail: 历史案例研究快照将其描述为移动优先的完整零售服务，但已分配资料池中没有当前 2026 年的产品包装信息。
        - label: African Bank
          x: 3
          'y': 2
          detail: 历史案例研究快照记录其提供免月费账户，但这里没有记录其当前业务广度。
        - label: Bank Zero
          x: 1
          'y': 1
          detail: 历史快照将 Bank Zero 定位为仅 App 的互助银行新进入者；已分配资料池中没有其当前规模和定价信息。
        - label: Capitec 信贷在位者
          x: 4
          'y': 5
          detail: Tech In Africa 将 Capitec 称为无抵押贷款领域的在位者，其信贷广度强于当前关于 GoTyme 贷款的证据集合。
        - label: 低费率网点在位者
          x: 5
          'y': 3
          detail: 历史案例研究证据显示，在位者在价格上作出反应，但已分配的当前资料池没有保留同等的 2026 年产品说明。
    approximationNotes: 序数评分只综合保留的公开证据，不代表市场份额、NPS 或利润指标；当前竞争对手定价资料稀少，也限制了精确度。
    claimRefs:
      - CP007
      - CP009
      - CP010
      - CP012
      - CP015
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据显示，这是一套低费率获客引擎：将存款和贷款转化为利息、费用及相邻产品收入，而盈利能力改善尚未完全消除资本需求。
    data:
      nodes:
        - id: acquire
          label: 获取客户
          detail: App 加网点的混合开户模式；公司材料称，2023 年每月约新增 150,000 名客户，至 2026 年南非客户超过 1,200 万。
        - id: account
          label: 开立低费率账户
          detail: 日常银行业务以零月费、免费即时支付以及不到 5 分钟的开户流程进行营销。
        - id: deposits
          label: 吸收存款和储蓄
          detail: FY2023 客户存款为 R4.005 billion；ARC 的一页未注明日期的页面称存款接近 R7 billion。
        - id: credit
          label: 增加信贷和商户产品
          detail: 商户现金预支已为超过 50,000 家中小企业提供融资；信用卡、BNPL 和保险扩大了变现空间。
        - id: revenue
          label: 将活动转化为收入
          detail: FY2023 公开银行财务数据表明，利息收入为 R672.6 million，净费用及佣金收入为 R336.1 million。
        - id: outcome
          label: 在仍需资本的同时实现盈利
          detail: 该银行称其在 2023 年 12 月实现首个月度盈利，但 FY2023 经审计账目仍依赖持续融资和资本支持。
    approximationNotes: 该顺序有证据支持，但不代表价值比例。公开来源没有披露转化率、产品层面的毛利，或从客户到盈利的当前合并桥接。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI008
      - CI009
      - CI011
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: TymeBank 在网点辅助分发、存款产品和不断扩大的信贷流程之上，叠加了 App 主导的服务。
    data:
      layers:
        - label: 客户接入层
          detail: 开户后，数字自助服务是客户的主要界面。
          items:
            - label: GoTyme 移动 App
              detail: 余额、支付、储蓄和 2026 年分阶段功能上线的主要界面。
        - label: 线下获客层
          detail: 与零售商相连的基础设施，将进店流量转化为活跃银行客户。
          items:
            - label: 零售网点和代理点
              detail: 通过合作伙伴地点提供辅助开户、身份采集和发卡。
        - label: 交易银行层
          detail: 核心日常银行产品锚定客户关系和费用池。
          items:
            - label: 交易账户
              detail: 来自现金、转账和卡相关活动的日常银行收入。
        - label: 储蓄层
          detail: 储蓄产品有助于留存，并提供低成本资金深度。
          items:
            - label: 储蓄和定期存款
              detail: 加深留存并扩大低成本资金来源的存款产品。
        - label: 信贷及相邻服务层
          detail: 信贷和增值服务让钱包份额超越基础存款。
          items:
            - label: 个人贷款
              detail: 与决策能力相连的消费信贷扩张路径。
            - label: Merchant Cash Advance
              detail: 按营业额关联还款逻辑设计的中小企业贷款产品。
            - label: MoreTyme 和增值服务
              detail: BNPL 和相邻服务让钱包份额超越存款。
        - label: 控制与合作伙伴层
          detail: 外部合作伙伴扩大触达范围，控制框架则管理运营和合规风险。
          items:
            - label: 云 / 开放服务架构
              detail: 公司叙事称，该技术栈支持与第三方快速合作并扩展产品。
            - label: 监管与合规控制
              detail: AFS 提到基础设施、控制、系统和合规监督。
            - label: 外部合作伙伴
              detail: 零售商、GDS Link、Sanlam 和 Home Affairs 扩大触达，也增加执行依赖。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: TymeBank 的客户旅程仍从低摩擦获客开始，经过 App 使用和辅助服务，最后扩展到相邻信贷 / 中小企业业务。
    data:
      nodes:
        - label: 店内获客
          title: Acquire in-store
          detail: 零售收银点和网点降低首次开户对分行的依赖。
          touchpoints:
            - 14,000 till points and 850+ kiosks historically supported onboarding
            - 80% of accounts were opened at kiosks and 20% online in the cited case-study period
        - label: 数字化激活
          title: Activate digitally
          detail: 客户无需经过分行迁移步骤，就能转入基于 App 的银行业务。
          touchpoints:
            - The current access model still includes the app, kiosks, and retail partners
            - The official rebrand migrated existing accounts, balances, and transaction history into the new app
        - label: 交易与储蓄
          title: Transact and save
          detail: 该银行的核心使用场景仍是大规模日常零售银行业务。
          touchpoints:
            - More than 12 million South African customers were claimed in February 2026
            - The 2023 filing linked customer scale to more than R4 billion in retail deposits
        - label: 使用辅助支持
          title: Use assisted support
          detail: 联系中心是高流量运营界面，而不是边缘场景。
          touchpoints:
            - Genesys says the bank now handles 160,000 calls a month
            - Customer satisfaction was cited at about 90%
        - label: 扩展到信贷
          title: Expand into credit
          detail: 贷款和决策流程让钱包份额超越简单的交易银行业务。
          touchpoints:
            - GDS Link says TymeBank used its platform to improve unsecured-personal-loan decisioning
            - Retail Capital broadened service into small-business lending
        - label: 跨市场复制
          title: Replicate across markets
          detail: 南非运营模式也可作为进入相邻地区的模板。
          touchpoints:
            - African Rainbow Capital said GOtyme in the Philippines would replicate the retail-network and app model
            - Public evidence does not yet show equivalent retention disclosure across markets
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 迁移连续性和结构性依赖是最热的风险，因为 2026 年品牌更名已经进行中，而公开财务和事件披露仍然滞后。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: 更名与 App 迁移连续性
          values:
            - label: 高
              tone: risk
              note: 分阶段上线确认执行风险仍在，而不是转换已经完成。
            - label: 高
              tone: risk
              note: 客户余额、历史记录、卡片和渠道都必须保持一致。
            - label: 中
              tone: neutral
              note: 安全 / 稳定性优先级和支持投入是可见的缓释措施。
            - label: 高
              tone: risk
              note: 已分配的公开来源中没有事件或投诉趋势，能够验证落地质量。
        - label: KYC、AML 与行为摩擦
          values:
            - label: 中
              tone: neutral
              note: 外部数据核查很常规，但大规模运行时可能误判。
            - label: 高
              tone: risk
              note: 验证失败或账户冻结可能伤害客户，并引起监管关注。
            - label: 中
              tone: neutral
              note: 条款明确列出现行控制，但缺少结果指标。
            - label: 中高
              tone: risk
              note: 升级路径清晰，但没有投诉量证据。
        - label: 外包技术和网点依赖
          values:
            - label: 中
              tone: neutral
              note: AFS 显示其成本依赖外包 IT 和网点管理。
            - label: 中高
              tone: risk
              note: 失败可能同时打击数字和线下服务界面。
            - label: 中
              tone: neutral
              note: 支持团队扩大有帮助，但这里没有公开 SLA 和正常运行时间。
            - label: 中
              tone: neutral
              note: 历史网点减值显示硬件执行风险不容忽视。
        - label: 中小企业信贷与流动性透明度缺口
          values:
            - label: 中
              tone: neutral
              note: 经审计证据已经足够陈旧，无法确认当前轨迹。
            - label: 高
              tone: risk
              note: 中小企业信贷和存款人流动性压力可能迅速改变投资结果。
            - label: 中
              tone: neutral
              note: AFS 展示了治理，但没有更新至 2026 年的指标。
            - label: 中高
              tone: risk
              note: 在更新的经审计资本和损失数据出现前，剩余不确定性仍然存在。
        - label: 欺诈报告与争议处理
          values:
            - label: 中
              tone: neutral
              note: 当前条款考虑了可疑和未经授权的交易。
            - label: 高
              tone: risk
              note: 延迟报告可能把损失和举证负担转给客户。
            - label: 中
              tone: neutral
              note: 通知、投诉路径和外部升级渠道都有记录。
            - label: 中
              tone: neutral
              note: 已分配资料池没有公开当前欺诈损失和投诉量数据。
        - label: 零售和客户获取依赖
          values:
            - label: 中
              tone: neutral
              note: 独立但声誉较低的来源指出竞争和对合作伙伴的依赖。
            - label: 中高
              tone: risk
              note: 零售或定价扰动可能削弱开户和获客效率。
            - label: 中
              tone: neutral
              note: App、网点和卡片的混合模式分散了客户触点。
            - label: 中
              tone: neutral
              note: 当前合作伙伴集中度和渠道经济性仍未披露。
    approximationNotes: 无数值评分含义；各单元格仅概括已分配资料池中的定性证据。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证明真实存在，但当前估值条款缺失且合并披露不完整，导致价格支撑不足。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 南非客户 12M+；Tyme Group 客户 20M。
        - id: funding
          label: 融资证明
          detail: 2023 年报道的 C 轮前融资 $77.8M，累计融资 >$260M。
        - id: profit
          label: 运营改善
          detail: 报道称 2023 年 12 月实现首次月度盈利；FY2023 银行资本充足率为 27.4%。
        - id: anchor
          label: 价格锚点
          detail: 2024 年流程指向此前 $965M 的指示价和目标独角兽估值。
        - id: gap
          label: 披露缺口
          detail: 没有公开的最终 D 轮条款、当前股权结构表或经审计的集团合并财务数据。
        - id: outcome
          label: 建议
          detail: 在独立验证当前估值条款前，保持跟踪而非买入。
      edges:
        - from: scale
          to: funding
          label: 支持市场兴趣
        - from: funding
          to: profit
          label: 支撑扩张计划
        - from: profit
          to: anchor
          label: 改善叙事
        - from: anchor
          to: gap
          label: 但不能解决价格问题
        - from: gap
          to: outcome
          label: 因此保持纪律
    approximationNotes: null
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV010
      - CV012
      - CV014
      - CV016
