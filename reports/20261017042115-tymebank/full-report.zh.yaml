            body: 如果迁移造成反复宕机或 Ombud 升级，或者更新财务披露显示中小企业信贷压力、存款压力或损失吸收上升，却没有可信的资本支持，就应视为论点失效。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据足以说明 TymeBank 已不再是早期概念验证资产：南非银行已融入更广泛的 GoTyme
              身份，牌照、控制和客户连续性未变，多项来源仍指向真实规模和此前融资支持。但同一公开记录不支持仅凭叙事追高。唯一保留的数字价格锚点是一篇 2024 年报道：TymeBank 正寻求 $150 million 的
              Series D，管理层将其称为“独角兽估值”，并配有 Bloomberg 指示的此前 $965 million 估值。这些历史信号只说明 2024
              年流程的目标；它们没有证明最终定价、条款是否有利于投资者，或后续运营表现是否足以支撑提价。基于公开证据，纪律性做法是跟踪并等待已验证的价格发现，而不是给出买入建议。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: 情景框架与可比背景
        blocks:
          - type: paragraph
            body: >-
              估值判断必须连接两类不同的证明。正面看，管理层相关报道和独立报道都指向规模：南非银行称本地客户已超过 1,200 万，Tyme Group 称服务 2,000 万名客户，2023
              年报道还称南非和菲律宾每月新增客户 300,000 名、收入运行率超过 $100 million。谨慎看，公开估值记录不完整，实体口径也不一致：TechCrunch 和 WeeTracker 报道 $77.8
              million 的 Series C 前融资，TechCrunch 报道累计融资超过 $260 million；而公开 Tracxn 资料只把 $13.3 million、两轮融资归给
              TymeBank。集团与银行口径不一致，使数据库数字在未核对前无法单独支持估值。因此，情景区间必须锚定已披露估值和明确尽调门槛，而不是精确模型输出。
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 最终尽调要求与论点失效点
        blocks:
          - type: paragraph
            body: >-
              剩余的承保问题不是 TymeBank 有没有运营动能，而是外部投资者能否核实其中多少属于受监管的南非银行、多少属于更广泛的 Tyme Group，以及新资金之前有哪些保护安排。保留的公开来源仍未披露已完成的
              Series D、当前完全摊薄股权结构表、清算优先权，或能够把银行层面亏损与集团价值创造对上的经审计集团合并财务。FY2023 银行申报还披露，2024 年 10
              月之后继续运营取决于股东支持、新资本、营运资金授信和执行。在当前材料出现前，估值判断必须计入倍数压缩、结构化轮优先股堆叠，或客户增长转化为经审计盈利慢于宣传的下行风险。若相对于 2024 年提案出现降价轮、IPO
              准备延迟、盈利证据转弱，或证据显示增长所需支持资本明显高于当前公开记录，就可能构成论点失效。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 当前融资轮有文件记录前，继续跟踪
            body: TymeBank 可信度足以留在筛选池中，但公开记录仍不足以支持相对于最后一个可见估值标记支付溢价。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
              - CV016
          - type: callout
            title: 运营证明强于估值证明
            body: 客户规模、2023 年融资支持和报道中的首次月度盈利都是真实正面因素，但它们不能替代当前融资轮的经审计条款。
            calloutType: strength
            claimRefs:
              - CV002
              - CV005
              - CV010
          - type: callout
            title: 披露不对称是核心下行风险
            body: 主要风险不是产品市场适配，而是在没有经核实的当前估值、优先股堆叠或合并盈利桥接前入场。
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
