            body: >-
              指定样本支持对财务模型风险保持谨慎，而不是直接清除风险。最新可得的经审计本地银行财务资料将信贷风险、流动性风险、市场/汇率风险和利率重定价风险列为核心敞口，并称大部分信贷风险来自中小企业贷款、银行间配置和政府证券投资。这很重要，因为
              Tyme
              的银行加商户融资混合模式，把执行风险推到了普通消费者存款之外。公开评论也强调披露限制：一篇评述明确指出，详细收入、盈利和增长数字仍需财务报告支持。在市场拿到更新的经审计银行或集团报表前，合理的尽调姿态是监测存款稳定性、减值趋势、中小企业信贷表现，以及对
              Tyme Global 技术和零售分销伙伴的依赖。合理的退出标准可以是服务连续性恶化、监管不利升级，或新财务披露显示信贷恶化却没有匹配的资本支持。
