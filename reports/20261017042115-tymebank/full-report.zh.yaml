  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的公开定位刻意面向大众市场且费率低：公司材料称南非银行不收月度银行费用，提供免费即时支付、快速数字开户和市场领先的储蓄利率；较早产品材料也以类似方式介绍 EveryDay 账户和
              GoalSave 储蓄口袋。因此，尽调不能依赖 SaaS
              式经常性订阅收入。公开记录反而指向一种银行模式：变现不断增长的存款基础、净息差、费用和佣金，以及交叉销售的信贷或表外产品，例如商户现金预支、信用卡、BNPL、保险和其他伙伴服务。2021
              年增长轮融资被描述为商业扩张和产品多元化资金，这与后续贷款和商户融资披露方向一致，但公开材料仍未按业务线拆分收入结构。
            claimRefs:
              - CI006
              - CI011
