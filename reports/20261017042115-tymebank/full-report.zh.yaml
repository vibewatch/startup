      - number: '3.3'
        title: 扩大业务范围有帮助，但转换成本证据薄弱，传统银行回应真实存在
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Tyme 试图把竞争范围扩展到基础零费交易账户之外。2023 年年度财务报表称，Retail Capital 已整合进来，以强化商业银行业务和按营业额提供的中小企业贷款；Tech In Africa
              则称 Tyme 下一步将通过与 Sanlam 的合资企业推进无抵押贷款，进入其描述为由 Capitec 主导的市场。产品范围因此扩大，但 Tyme
              也进入了竞争更激烈的贷款领域，而非受保护的细分市场。客户侧的品牌重塑报道称，现有用户保留原账户、余额和历史记录，只需迁移到新应用，这降低了品牌变更期间的即时迁移摩擦。不过，样本没有流失率、工资转入或多平台使用证据，因此护城河耐久性更像来自伙伴触达和成本结构，而不是已被证明的转换锁定。
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
