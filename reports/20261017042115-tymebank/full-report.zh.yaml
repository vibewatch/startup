      - number: '4.2'
        title: 公开增长势头与经营杠杆代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的公开增长代理是客户、存款和产品使用披露，而不是收入披露。2026 年官方公司简介称南非银行服务超过 1,200 万名客户，Tyme Group 则在多个市场服务 2,000 万名客户；Moneyweb
              独立重复了集团 2,000 万客户数字，并指出南非牌照和监管未变。较早重新发布的公司材料称，TymeBank 于 2023 年 12 月实现首个月度盈利，每月新增约 150,000
              名客户，并通过商户现金预支为超过 50,000 家中小企业提供融资。ARC 未标日期的投资页面称存款接近 R7 billion，而 FY2023 经审计银行财务报表显示为 R4.005
              billion。合起来看，这些是规模和潜在经营杠杆的有用信号，但不能替代披露的 CAC、回本期、群组留存或产品层面贡献利润率。
