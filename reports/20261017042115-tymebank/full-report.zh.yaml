      - number: '1.3'
        title: 规模、资本信号与增长势头
        blocks:
          - type: paragraph
            body: >-
              公开规模证据足以支持客户增长判断，也能为资本形成提供方向性信息，但当前财务质量仍不完整。2023 年银行报表披露约 750 万名客户和超过 R4 billion 的零售存款；2024 年 6 月的 FT
              资料将客户数上调至 900 万，称银行于 2023 年 12 月首次实现月度盈利，并称 TymeBank 估值为 $965 million、计划至少融资 $100 million 以继续扩张。2026 年 2
              月公司背景材料又将南非客户数推高至超过 1,200 万，集团全球客户数达到 2,000 万，但当前证据包不支持 FY2025/FY2026 合并收入、现金消耗、员工数或 2024
              年后的新估值。后续章节需要把规模增长动能与可投资性区分开，这些缺口因此很关键。
