      severity: blocking
      topic: consolidated-group-financials
      missingEvidence: Consolidated Tyme Group audited FY2024-FY2026 income statement, balance sheet, and cash flow with segment detail for South Africa and international operations.
      whyItMatters: Public bank-level and marketing disclosures do not show whether group expansion is self-funding, profitable, or supported by continuing equity injections.
      diligencePath: Request the latest board pack or audited group accounts with segment revenue, gross profit, opex, and cash-runway disclosure.
      relatedQuestionRefs: [QI008]
    - type: private-evidence-only
      severity: material
      topic: customer-acquisition-economics
      missingEvidence: CAC, payback period, retention, churn, LTV, and activation or funded-account conversion by channel and segment.
      whyItMatters: Customer-count growth and quick onboarding do not prove attractive acquisition economics or durable cohorts.
      diligencePath: Request cohort tables by origination channel with CAC, activation, retention, product attach, and contribution margin.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: realized-pricing
      missingEvidence: Realized fee yield, interchange, deposit cost of funds, product pricing waterfall, and product-level revenue mix.
      whyItMatters: Public list-offer and feature disclosures do not reveal the actual unit economics of the low-fee banking proposition.
      diligencePath: Request current fee cards, deposit repricing policy, and a product-level revenue bridge tying pricing to realized income.
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI002]
    - type: stale
      severity: material
      topic: capital-runway
      missingEvidence: Post-31-October-2024 funding facilities, cash runway, covenant headroom, and any next-round or bridge financing commitments.
      whyItMatters: The clearest public capital-risk statement is anchored in FY2023 accounts and may not reflect the current financing position.
      diligencePath: Obtain the latest treasury pack, facility documents, and any signed shareholder support or term-sheet materials.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
