artifact: financials
slug: tymebank
runDate: 2026-10-17
company:
  name: TymeBank
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a low-fee retail banking model monetized through deposits, lending,
    merchant finance, and adjacent products rather than subscription-style account fees. The best
    audited public bank-level numbers still show an FY2023 annual loss and explicit dependence on
    continued capital support beyond 31 October 2024, while later company-issued updates point to
    monthly profitability and continued customer and deposit growth. Underwriting remains blocked
    by missing consolidated group financials, undisclosed realized pricing and unit economics, and
    no public cash-runway disclosure tied to current expansion plans.
sections:
  - id: revenue-model
    title: Revenue model and monetization surface
    body: >-
      TymeBank's public positioning is deliberately mass-market and low-fee: company materials say
      the South African bank offers zero monthly banking fees, free instant payments, fast digital
      onboarding, and market-leading savings rates, while older product material describes the
      EveryDay account and GoalSave savings pockets in similar terms. That means underwriting
      cannot rely on SaaS-style recurring subscription revenue. Instead, the public record points
      to a banking model that monetizes a growing deposit base, net interest spread, fee and
      commission activity, and cross-sold credit or off-balance-sheet products such as merchant
      cash advance, credit cards, BNPL, insurance, and other partner-led services. The 2021 growth
      raise was framed as capital for commercial expansion and product diversification, which is
      directionally consistent with later disclosures about lending and merchant-finance products,
      but public materials still do not break out revenue mix by line of business.
    claimRefs: [CI006, CI011, CI012, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-operating-leverage
    title: Public traction and operating-leverage proxies
    body: >-
      The best public traction proxies are customer, deposit, and product-usage disclosures rather
      than revenue disclosure. An official 2026 company profile says the South African bank serves
      over 12 million customers, while the broader Tyme Group serves 20 million customers across
      multiple markets; Moneyweb independently repeated the 20 million group-customer figure and
      noted that the South African licence and regulatory oversight were unchanged. Earlier
      redisseminated company materials said TymeBank reached its first profitable month in December
      2023, was acquiring roughly 150,000 customers each month, and was financing more than 50,000
      SMEs through merchant cash advance. ARC's undated investment page said deposits were close to
      R7 billion, versus the R4.005 billion shown in the FY2023 audited bank financial statements.
      Together these are useful signals of scale and possible operating leverage, but they are not
      substitutes for disclosed CAC, payback, cohort retention, or product-level contribution
      margins.
    claimRefs: [CI001, CI008, CI009, CI010, CI013]
    tableRefs: [TI003]
  - id: balance-sheet-and-capital
    title: Balance-sheet structure and capital dependency
    body: >-
      The strongest public financial evidence remains Tyme Bank Limited's FY2023 annual financial
      statements. Those statements show a deposit-funded balance sheet with R4.005 billion of
      customer deposits, R1.668 billion of net customer advances, R1.680 billion of cash and cash
      equivalents, R672.6 million of interest income, and R336.1 million of net fee and commission
      income. They also show an annual loss of R858.1 million and accumulated losses of R6.637
      billion, which management described as establishment and build costs. Critically, the same
      statements say going-concern support beyond 31 October 2024 depended on continued
      shareholder support, fresh capital, working-capital facilities, and successful execution of
      growth plans. That is a real underwriting constraint: public evidence shows an improving
      operating model, but not self-funded expansion at group level.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The public evidence supports a credible retail-bank revenue engine with meaningful deposit
      gathering, active product expansion, and at least one later claim of monthly profitability.
      It does not yet support a high-confidence view on sustainable group earnings quality or
      current capital adequacy. The strongest positive signal is that TymeBank appears to have
      scaled customer acquisition and deposit gathering while adding lending and merchant-finance
      products. The strongest negative signal is that audited FY2023 accounts still required
      ongoing capital support and ARC's undated investment page framed AI and analytics investment
      as creating short-term pressure. Without consolidated FY2024-FY2026 group
      statements, realized pricing, loss-rate disclosure, and current funding commitments, the
      correct financial judgment is "promising operating leverage, but incomplete underwriting
      visibility."
    claimRefs: [CI004, CI005, CI007, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Net interest income, Deposit spread plus lending and treasury income, "ZAR FY2023", "R672.6m interest income and R529.8m net interest income", "Audited bank-level FY2023 only", "Break out retail lending, merchant finance, treasury, and any intercompany funding economics for FY2024-FY2026."]
      - [Fees and commissions, Transaction and service-fee activity, "ZAR FY2023", "R336.1m net fee and commission income", "Audited income-line disclosure without product mix", "Disclose interchange, ATM or cash, card, partner, and other fee revenue by product."]
      - [Deposits and savings, Low-fee accounts and savings balances provide funding base, "Balance", "R4.005bn customer deposits at Jun-2023; an undated ARC page says close to R7bn", "Audited 2023 plus an undated shareholder update", "Provide average balances, mix by product, and cost of funds."]
      - ["Merchant or SME finance and adjacent products", "Merchant cash advance plus credit card, BNPL, insurance, and other offers", "Usage / product status", ">50,000 SMEs financed through merchant cash advance; credit card, BNPL, and insurance cited as expansion vectors", "Company-issued or redisseminated operating disclosure", "Disclose yield, loss rates, take-up, and contribution margin by product."]
    notes: >-
      Mixes audited FY2023 bank-only figures with later operating updates; later figures are not a
      consolidated group revenue bridge and do not disclose realized pricing or contribution margin.
    claimRefs: [CI001, CI003, CI009, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product or price surface
      - Public offer
      - Public evidence
      - Realized pricing known?
      - Implication
      - Diligence ask
    rows:
      - [EveryDay transaction account, Zero monthly banking fees, "Official 2026 profile and earlier product profile both describe zero-monthly-fee everyday banking", "No", "Primary retail account monetization must come from payments, deposits, float, or cross-sell rather than subscription fees", "Provide full fee card and realized fee yield per active funded account."]
      - [Digital onboarding and debit-card issuance, Onboarding in less than five minutes with kiosk support, "Company materials describe under-5-minute onboarding and live debit-card issuance", "No", "Fast onboarding can aid acquisition, but public sources do not show acquisition cost or activation quality", "Disclose funded-account conversion, kiosk economics, and CAC by channel."]
      - [Savings products, Market-leading savings rates and up to 10 savings pockets, "Official profiles describe market-leading savings rates and GoalSave pockets", "No", "Strong savings pricing can help deposits but may compress margin without disclosed cost-of-funds data", "Provide savings mix, repricing cadence, and net interest margin by cohort."]
      - ["Credit and merchant products", "Merchant cash advance, credit card, BNPL, insurance", "Public materials confirm products are live or launched, but not their economics", "No", "Cross-sell is likely the main monetization expansion path beyond basic banking", "Disclose approval rates, yield, charge-offs, and payback by product."]
    notes: >-
      This table distinguishes public list-offer or feature claims from realized economics; no
      assigned source discloses effective pricing, fee yield, or unit-level contribution margin.
    claimRefs: [CI009, CI011, CI012, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value or public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["First profitable month", "December 2023", Medium, "Shows at least one month of positive operating performance, but not a full-year earnings profile", "Provide FY2024 and FY2025 audited monthly or quarterly earnings bridge."]
      - ["FY2023 annual loss", "R858.1m loss; accumulated losses R6.637bn", High, "Confirms the bank was still consuming historical capital even before later growth claims", "Provide audited post-2023 bank and group P&L plus management bridge from loss to sustained profitability."]
      - ["Funding base", "R4.005bn audited deposits at Jun-2023; an undated ARC page says close to R7bn", Medium, "Deposit growth can improve funding capacity, but mix and stability matter", "Disclose average deposit balance, retention, and cost of funds by product."]
      - ["Credit deployment", ">50,000 SMEs financed through merchant cash advance", Medium, "Shows monetization depth beyond basic payments, but not yield or loss rate", "Provide originations, average ticket size, charge-offs, and net revenue by merchant-finance product."]
      - ["Capital support horizon", "Going concern beyond 31 Oct 2024 depended on shareholder support, new capital, and working-capital facilities", High, "This is the clearest public warning on capital adequacy and refinancing dependency", "Provide current cash runway, executed facilities, covenant headroom, and next-round plan."]
      - ["Public valuation signal", "Pre-IPO private-share marketplace listing on EquityZen; no public valuation in assigned sources", Low, "Limits triangulation of current capitalization and investor markup or markdown", "Provide latest round price, fully diluted cap table, preference stack, and any secondary-market reference price."]
    notes: >-
      "High" here means the underlying statement is explicit in an official source; it does not
      imply complete underwriting sufficiency. Nulls and low-confidence rows are genuine public
      disclosure gaps, not zero values.
    claimRefs: [CI004, CI005, CI007, CI008, CI009, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a low-fee customer acquisition engine that turns deposits and
      lending into interest, fee, and adjacent-product revenue, with profitability improving
      before capital needs fully disappear.
    data:
      nodes:
        - id: acquire
          label: Acquire customers
          detail: >-
            Hybrid app-plus-kiosk onboarding; company materials cite roughly 150,000 customers
            per month in 2023 and more than 12 million South African customers by 2026.
        - id: account
          label: Open low-fee accounts
          detail: >-
            Everyday banking is marketed with zero monthly fees, free instant payments, and
            onboarding that takes less than five minutes.
        - id: deposits
          label: Gather deposits and savings
          detail: >-
            Customer deposits were R4.005 billion in FY2023, and an undated ARC page says
            deposits were close to R7 billion.
        - id: credit
          label: Add credit and merchant products
          detail: >-
            Merchant cash advance financed more than 50,000 SMEs, while credit card, BNPL, and
            insurance broaden monetization.
        - id: revenue
          label: Convert activity into revenue
          detail: >-
            FY2023 public bank financials show R672.6 million of interest income and R336.1
            million of net fee and commission income.
        - id: outcome
          label: Reach profitability while still needing capital
          detail: >-
            The bank said it reached its first profitable month in December 2023, but the FY2023
            audited accounts still relied on continued funding and capital support.
    approximationNotes: >-
      Sequence is evidence-backed but not value-proportional. Public sources do not disclose
      conversion rates, product-level gross profit, or a current consolidated bridge from
      customers to earnings.
    claimRefs: [CI001, CI003, CI005, CI008, CI009, CI011, CI013]
callouts:
  - calloutType: insight
    title: Deposits and cross-sell matter more than account subscription
    body: >-
      Public pricing evidence is consistent with a mass-market bank that wins on low headline fees
      and then monetizes balances, payment activity, and credit or partner products rather than a
      recurring account subscription.
    claimRefs: [CI003, CI009, CI011, CI015]
  - calloutType: risk
    title: Capital visibility is still the core underwriting blocker
    body: >-
      The most concrete public capital statement remains the FY2023 going-concern note, which said
      support beyond 31 October 2024 depended on shareholder backing, new capital, and working
      capital facilities.
    claimRefs: [CI005]
