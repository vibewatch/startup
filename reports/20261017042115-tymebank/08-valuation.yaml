company:
  name: TymeBank
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a price-sensitive **track** stance rather than a buy call. TymeBank
    shows real operating proof — customer scale, a first profitable month in South Africa, and
    prior fundraising support — but the currently observable valuation markers remain too thin and
    too inconsistent to underwrite a premium entry without fresh audited group financials and the
    current preference stack.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The evidence is good enough to say TymeBank is no longer an early proof-of-concept asset:
      the South African bank has rebranded into the wider GoTyme identity without changing its
      licence, controls, or customer continuity, and multiple sources still point to real scale and
      prior funding support. But the same public record does not support paying up on narrative
      alone. The only retained numerical pricing anchor is a 2024 report that TymeBank was pursuing
      a $150 million Series D while management described it as a "unicorn valuation," paired with a
      Bloomberg-indicated $965 million prior mark. Those historical signals describe what the 2024
      process targeted; they do not prove where the round ultimately priced, whether terms were
      investor-friendly, or whether later operating performance justified a step-up.
      On publicly available evidence, the disciplined stance is to track and wait for verified price
      discovery, not to issue a buy recommendation.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV010, CV014, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenario-framing-and-comparable-context
    title: Scenario framing and comparable context
    body: >-
      The valuation case has to bridge two different kinds of proof. On the positive side,
      management-linked and independent reporting point to scale: the South African bank says it has
      passed 12 million customers locally, the wider Tyme Group says it serves 20 million customers,
      and 2023 coverage described more than $100 million of revenue run rate plus 300,000 new
      customers a month across South Africa and the Philippines. On the cautionary side, the public
      valuation record is incomplete and entity scope is inconsistent: TechCrunch and WeeTracker
      reported a $77.8 million pre-Series C and TechCrunch reported cumulative funding above $260
      million, while a public Tracxn profile attributes only $13.3 million over two rounds to
      TymeBank. The group-versus-bank mismatch makes the database figure unusable as standalone
      valuation support without reconciliation. Scenario ranges therefore have to stay anchored to
      disclosed marks and explicit diligence gates rather than precise model outputs.
    claimRefs: [CV002, CV005, CV007, CV008, CV009, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      The remaining underwriting problem is not whether TymeBank has operating momentum; it is
      whether outside investors can verify how much of that momentum belongs to the regulated South
      African bank, how much belongs to the wider Tyme Group, and what protections sit ahead of new
      money. The retained public sources still do not disclose a finalized Series D close, a current
      fully diluted cap table, liquidation preferences, or audited consolidated group financials that
      reconcile bank-level losses with group value creation. The FY2023 bank filing also disclosed
      that continued operation beyond October 2024 depended on shareholder support, new capital,
      working-capital facilities, and execution. Until current materials are produced, a valuation
      call must account for downside from multiple compression, structured-round preferences, or
      slower-than-advertised conversion of customer growth into audited earnings. A thesis break
      would be any combination of a down-round versus the 2024 proposal, delayed IPO preparation,
      weaker profitability evidence, or evidence that growth has required materially higher support
      capital than the current public record shows.
    claimRefs: [CV003, CV004, CV006, CV011, CV012, CV013, CV014, CV016]
