      - [Confidence, Medium, "There is enough public evidence to reject a blind buy, but not enough to price with high precision."]
      - [Risk rating, High, "Disclosure gaps on group financials and round terms keep downside-protection risk elevated."]
      - [Valuation stance, Indeterminate and price-sensitive, "The only retained numerical marker is a historical 2024 indication, not a verified current entry price."]
      - [Decision implication, Conditional diligence, "Advance only if management provides audited group numbers plus current cap-table and preference data."]
    notes: >-
      Analyst judgment synthesized from retained public financing, profitability, and disclosure
      evidence; qualitative rows are intentionally non-numeric because current price support is incomplete.
    claimRefs: [CV004, CV005, CV010, CV012, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Supporting evidence
      - Anti-thesis / what changes the view
    rows:
      - ["Scale and customer reach are real.", "Official 2026 materials say the South African bank serves over 12 million customers and the group serves 20 million worldwide.", "A buy case needs audited monetisation, retention, and segment economics rather than customer totals alone."]
      - ["Funding history shows credible investor backing.", "2023 reporting said TymeBank raised $77.8M pre-Series C and took cumulative funding above $260M.", "A stronger view needs the actual current round close, not legacy funding milestones."]
      - ["Profitability is directionally positive.", "ITWeb said the bank reached its first month of profitability in December 2023.", "A stronger view needs sustained, audited profitability at bank and group level rather than a milestone month."]
      - ["Current valuation support is still incomplete.", "2024 reporting referenced a $965M prior indication and a targeted 'unicorn valuation' Series D.", "A move to buy would require current terms, preference stack, and a post-2024 mark validated by independent evidence."]
      - ["Historical capital dependence is material.", "The FY2023 filing tied continued operation beyond October 2024 to shareholder support, new capital, working-capital facilities, and execution.", "A stronger view needs current audited evidence that this historical uncertainty was resolved."]
    notes: >-
      Table separates operating proof from valuation proof so customer and funding momentum are not
      mistaken for verified current entry price support.
    claimRefs: [CV002, CV004, CV005, CV006, CV008, CV010, CV014, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "A current financing closes on clean terms; consolidated audited earnings support the growth story; the stated 2028 IPO path remains credible.", "No numerical range is supportable from assigned evidence; a premium to the historical $965M indication requires audited profit conversion and non-subordinating terms.", "Preference overhang remains undisclosed; cross-market execution may consume more capital than expected.", "Low until audited group financials and final round terms are disclosed."]
      - ["Base", "Business quality remains credible, but assigned evidence stays limited to the reported 2024 process, 2023 funding history, and milestone profitability disclosures.", "No current range is supportable; treat $965M only as a historical indication and require current price and preference documents before entry.", "Evidence may lag current performance; investors still face information asymmetry on dilution and hold period.", "Highest on the assigned evidence."]
      - ["Bear", "Current financing prices below the 2024 indication, profitability proves less durable, or IPO timing slips materially.", "A premium entry lacks public support; downside would come from multiple de-rating and any structured protections favoring existing investors.", "Round terms could be materially worse than headline valuation; capital need may increase if growth monetisation stalls.", "Material if management cannot close the financing and disclosure gaps."]
    notes: >-
      Scenario ranges are anchored to disclosed public markers only; this table deliberately avoids
      unsupported precision because the current cap table, preference stack, and current mark are not public.
    claimRefs: [CV003, CV004, CV005, CV006, CV010, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Operating proof is real, but price support breaks on missing current valuation terms and incomplete
      consolidated disclosure.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: "12M+ South Africa customers; 20M across Tyme Group."
        - id: funding
          label: Funding proof
          detail: "$77.8M pre-Series C and >$260M cumulative funding reported in 2023."
        - id: profit
          label: Operating improvement
          detail: "First profitable month reported for December 2023; FY2023 bank capital adequacy ratio was 27.4%."
        - id: anchor
          label: Price anchor
          detail: "2024 process pointed to a $965M prior indication and a targeted unicorn valuation."
        - id: gap
          label: Disclosure gap
          detail: "No public final Series D terms, current cap table, or audited consolidated group financials."
        - id: outcome
          label: Recommendation
          detail: "Track rather than buy until current valuation terms are independently verified."
      edges:
        - { from: scale, to: funding, label: "supports market interest" }
        - { from: funding, to: profit, label: "backs scaling plan" }
        - { from: profit, to: anchor, label: "improves narrative" }
        - { from: anchor, to: gap, label: "but does not settle price" }
        - { from: gap, to: outcome, label: "therefore maintain discipline" }
    approximationNotes: null
    claimRefs: [CV002, CV004, CV005, CV010, CV012, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Track until the current round is documented
    body: >-
      TymeBank looks credible enough to stay in the funnel, but the public record still does not
      justify paying a premium to the last visible valuation marker.
    claimRefs: [CV004, CV014, CV016]
  - calloutType: strength
    title: Operating proof is stronger than valuation proof
    body: >-
      Customer scale, 2023 fundraising support, and a reported first profitable month are real
      positives, but they do not replace audited current round terms.
    claimRefs: [CV002, CV005, CV010]
  - calloutType: risk
    title: Disclosure asymmetry is the core downside
    body: >-
      The main risk is not product-market fit; it is entering without a verified current mark,
      preference stack, or consolidated earnings bridge.
    claimRefs: [CV011, CV012, CV013, CV014]
