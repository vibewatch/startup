  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: tam-sam-som
      missingEvidence: A public or diligence-room segmentation model that ties TymeBank/GoTyme's customer segments to revenue pools, deposits, balances, or wallet-share by cohort.
      whyItMatters: Public sources currently support only adoption and cohort-skew lenses, which is insufficient for a high-confidence monetary TAM, SAM, or SOM.
      diligencePath: Request management's current segment deck with active customers, deposits, interchange, lending exposure, and revenue contribution by retail cohort and SME adjacency.
      relatedQuestionRefs: [QM002]
    - type: missing-source
      severity: material
      topic: budget-ownership
      missingEvidence: A disclosed segmentation framework showing who controls the budget in each workflow, especially for SME merchant cash advance and any non-retail products.
      whyItMatters: Buyer, user, and payer roles can only be inferred at workflow level today, which weakens adoption and sales-cycle analysis.
      diligencePath: Ask for product-level GTM materials, merchant cash-advance eligibility rules, and customer-mix disclosures separating consumer and SME activity.
      relatedQuestionRefs: [QM004]
