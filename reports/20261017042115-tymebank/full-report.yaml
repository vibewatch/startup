      - number: '3.3'
        title: Scope expansion helps, but switching-cost evidence is thin and incumbent response is real
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Tyme has tried to broaden the competitive frame beyond a basic zero-fee transaction
              account. The 2023 annual financial statements say Retail Capital was integrated to strengthen business
              banking and turnover-based SME lending, and Tech In Africa says Tyme's next push includes unsecured
              lending through a Sanlam joint venture in a market it describes as dominated by Capitec. That broadens
              product scope, but it also puts Tyme into a more contested lending arena rather than a protected niche. On
              the customer side, current rebrand coverage says existing users keep the same accounts, balances, and
              history and simply move to the new app, which lowers immediate migration friction during the brand change.
              Even so, the pool does not provide churn, salary-switch, or multi-homing evidence, so moat durability
              still looks more like partner access and cost structure than proven switching lock-in.
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP012
              - CP015
      - number: '3.4'
        title: Durability is credible on access and cost, but not yet proven on full rival comparability
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a specific competitive judgment: GoTyme looks strongest where retail access,
              onboarding speed, and low operating cost matter, and weaker where the decision depends on a fully
              comparable read of rival packaging, credit breadth, or incumbent ability to match price. IdeaToola's
              benchmark-style page points in Tyme's favor on customer scale and efficiency, but it does not expose the
              primary documents inline, so it is useful as a directional benchmark rather than a definitive scorecard.
              Meanwhile, the current pool still lacks live, directly comparable price sheets and product disclosures for
              several named rivals. The result is a chapter that can credibly argue for a distribution-led moat and real
              incumbent-response risk, while still labeling current peer-pricing precision as a diligence gap rather
              than a solved question.
            claimRefs:
              - CP013
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution moat is about access, not secrecy
            body: >-
              The strongest support in this pool is that GoTyme's hybrid kiosk-plus-app model and retail partners create
              physical onboarding and cash access advantages that pure app challengers do not obviously match in the
              retained evidence.
            calloutType: strength
            claimRefs:
              - CP003
              - CP007
          - type: callout
            title: Incumbents can answer on price faster than this pool proves on depth
            body: >-
              Historical evidence already shows fee pressure and challenger launches, while current evidence points to
              Capitec-led lending depth; without live rival price sheets, moat claims beyond access and cost should stay
              conservative.
            calloutType: risk
            claimRefs:
