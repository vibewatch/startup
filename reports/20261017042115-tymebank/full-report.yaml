        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid distribution is the real product moat
            body: >-
              The strongest product evidence is not app polish alone but the combination of digital servicing with
              retailer-based onboarding and cash access. That makes TymeBank's operating model harder to imitate than a
              generic mobile-only interface.
            calloutType: strength
            claimRefs:
