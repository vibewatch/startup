  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer definition
        blocks:
          - type: paragraph
            body: >-
              The best-supported market boundary is not "African fintech" in the abstract but South African everyday
              consumer banking for price-sensitive retail users who need low-friction account opening, payments,
              savings, and cash access. CGAP describes TymeBank as a fully digital retail bank founded around financial
              inclusion, while the current GoTyme positioning still emphasizes zero monthly fees, fast onboarding,
              savings, and cash-in/cash-out through partner retail stores rather than branch-centric advisory or broad
              wealth products. That means the economically relevant substitutes are incumbent low-fee bank accounts,
              other digital challengers, and informal or cash-heavy status-quo behavior, with SME cash-advance activity
              better treated as an adjacency than the core served market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
      - number: '2.2'
        title: Sizing lenses show adoption skew more clearly than spend TAM
        blocks:
          - type: paragraph
            body: >-
              Public sources provide useful market-shape lenses but not a clean spend-based TAM/SAM/SOM. CGAP's South
              Africa lens starts from an already highly banked market, with roughly 85% of adults banked, so TymeBank's
              opportunity is less about first-time category creation than about winning underserved cohorts and cheaper
              distribution economics. Within that frame, the strongest sizing evidence is the cohort skew: people
              earning US$200/month or less accounted for 47% of the population, only 41% of the banked population, but
              an estimated 48% of TymeBank's active base in the study period. Official 2026 disclosures add current
              scale markers — over 12 million South African customers and 20 million customers across Tyme Group — but
              those are customer-count adoption metrics, not revenue pools, and one ITWeb report appears to blur the
              South African bank count with the wider group count.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM016
