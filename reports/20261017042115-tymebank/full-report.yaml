              - CE010
              - CE013
              - CE014
      - number: '5.3'
        title: Controls, migration risk, and unresolved diligence items
        blocks:
          - type: paragraph
            body: >-
              The control story is credible but incomplete. The FY2025 annual financial statements say TymeBank manages
              operating risk through infrastructure, controls, systems, and a formal compliance framework, while the
              rebrand rollout messaging repeatedly emphasizes phased migration, security, and platform stability. That
              combination supports a view that management is actively treating operational risk during a visible product
              transition. What remains missing is third-party assurance: none of the assigned sources provide a status
              page, uptime history, app-security certification, independent architecture benchmark, or public developer
              telemetry that would let an investor test whether the bank's open-service narrative translates into
              measured reliability. The underwriting conclusion is therefore positive on product-market operating fit,
              but still conditional on private technical diligence before underwriting execution risk as low.
            claimRefs:
              - CE008
              - CE010
              - CE013
              - CE014
