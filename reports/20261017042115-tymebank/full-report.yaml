      - number: '2.3'
        title: Adoption drivers are affordability and access; constraints are trust, support, and category competition
        blocks:
          - type: paragraph
            body: >-
              The current evidence points to an adoption engine built on lower servicing cost, broad retail access, and
              simple product design. CGAP reports that TymeBank's branchless, microservice-led model let it onboard
              roughly 110,000 customers per month at sharply lower unit costs through kiosks and web channels, and
              customers most often cited low fees and savings features as the reason the offer was compelling. The same
              evidence also defines the main constraints: security concerns, service delays, digital-access friction,
              and residual demand for physical support; meanwhile, low-fee incumbents and challengers such as Discovery
              Bank and Bank Zero raise the competitive bar. The result is a market that is large enough and structurally
              attractive for continued adoption, but harder to underwrite on valuation without segment-level revenue,
              deposit, and engagement disclosures.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
