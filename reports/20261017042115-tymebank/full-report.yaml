      - number: '1.2'
        title: Leadership, governance, and control map
        blocks:
          - type: paragraph
            body: >-
              Public governance visibility is good at the South African bank level and materially weaker at the current
              group-cap-table level. The statutory 2023 filing shows a classic regulated-bank setup with Coenraad Jonker
              as CEO, Yvette Dockrat as CFO, and a broad non-executive board, while the same filing documents a
              restructuring that inserted Tyme SA Holdings and Singapore-based Tyme Group Pte. Ltd. above Tyme Bank
              Holdings without changing Ubuntu-Botho Investments as the ultimate holding company. By February 2026,
              rebrand communications named Cheslyn Jacobs as CEO of GoTyme Bank South Africa, which is enough to treat
              the South African operating lead as changed in public-facing materials even though the exact handover date
              and founder roster are not established in the assigned pack.
