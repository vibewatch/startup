        - label: TymeBank active base that was first-time banked
          value: 13
          unit: '%'
          detail: CGAP says 13% of active customers were first-time bank customers.
          claimRefs:
            - CM008
    approximationNotes: >-
      This pyramid is a constrained adoption lens, not a single-denominator TAM/SAM/SOM stack. It preserves each
      published percentage in its native cohort context because the retained sources do not disclose a public,
      revenue-based market segmentation model for GoTyme.
    claimRefs:
