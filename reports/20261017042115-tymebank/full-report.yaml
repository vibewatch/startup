chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Legal identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The assigned pack supports a continuity thesis rather than a new-company thesis. Tyme Bank Limited was
              incorporated in 2015, received approval to commence business in 2017, soft-launched in 2018, and publicly
              marketed transactional and savings accounts from 25 February 2019. The 2023 annual financial statements
              frame it as a South African digital banking-services business headquartered in Rosebank, Johannesburg,
              while 2026 company materials say the consumer brand has transitioned to GoTyme Bank without changing the
              underlying licensed South African bank. The customer proposition remains hybrid rather than app-only:
              digital onboarding and app-led servicing sit alongside kiosks, mall hubs, and retail partners, even though
              desktop internet banking has been withdrawn and Pick n Pay kiosks have exited.
