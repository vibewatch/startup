      - number: '1.3'
        title: Scale, capital signals, and traction
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence is strong for customer growth and directionally useful for capital formation, but
              incomplete for current financial quality. The 2023 bank statements report circa 7.5 million customers and
              over R4 billion in retail deposits; the June 2024 FT profile then lifts that to 9 million customers, says
              the bank achieved its first monthly profit in December 2023, and describes TymeBank as a $965
              million-valued company planning to raise at least $100 million for further expansion. February 2026
              company background materials push the South African customer count above 12 million and group customers to
              20 million worldwide, but the current evidence pack does not support consolidated FY2025/FY2026 revenue,
              cash burn, headcount, or a fresh post-2024 valuation point. Those omissions matter because later chapters
              will need to distinguish scale momentum from investability.
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
              - CO014
      - number: '1.4'
        title: Milestones and open risks
        blocks:
          - type: paragraph
            body: >-
              The reusable chronology is clear enough to anchor later chapters. The company moved from incorporation and
              licensing into a 2019 public launch, added business-lending capability through the 2022 Retail Capital
              acquisition, reached first monthly profitability in December 2023, and then used the 2026 GoTyme rebrand
              to align the South African customer brand with a broader Tyme Group footprint. What remains unresolved is
              not chronology but quality of the current operating base: the FT profile still highlighted two
              diligence-critical risks, namely whether low-income account openings become primary banking relationships
              and whether the loan book can stay resilient in a high-default South African credit environment.
              Post-rebrand channel economics after the Pick n Pay kiosk exit also remain weakly disclosed.
