      - number: '5.2'
        title: Architecture, product scope, and expansion paths
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence is thin on named vendors, internal services, and API surfaces, but the retained
              sources still establish the broad operating model. TymeBank describes a secure cloud-based infrastructure
              and an open-service architecture that supports partner integrations and incremental product launches,
              while the audited statements show monetized transactional banking, savings balances, and a
              business-lending book anchored by Merchant Cash Advance. Partner and press sources add the next layer of
              maturity evidence: a real-time lending decisioning platform, a 2026 app migration program, and adjacent
              product expansion into unsecured personal loans and government identity-service pilots. The result is a
              product stack that is broader than low-fee deposits alone, yet still dependent on external partners for
              distribution, lending adjacencies, and some implementation velocity.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
