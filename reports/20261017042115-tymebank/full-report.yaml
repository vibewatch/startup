      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning from the retained public pool shows GoTyme strongest on access reach and partner-enabled
      breadth, while current rival pricing detail remains sparse.
    data:
      xAxis:
        label: Distribution reach / human touchpoints (ordinal)
        min: 1
        max: 5
        low: App-only or narrow reach
        high: Embedded retail access or established footprint
        description: Evidence-backed ordinal scoring from cited public sources.
        scale: ordinal
      yAxis:
        label: Retail-banking breadth in cited sources (ordinal)
        min: 1
        max: 5
        low: Narrow or early proposition
        high: Broader retail or credit stack
        description: Scores reflect only what the assigned public pool explicitly supports.
        scale: ordinal
      points:
        - label: GoTyme Bank
          x: 4
          'y': 4
          detail: >-
            App plus retail kiosks and partner cash access; savings, SME finance, and broader product roadmap appear in
            cited sources.
        - label: Discovery Bank
          x: 2
          'y': 4
          detail: >-
            Historical case-study snapshot describes a mobile-led, full retail offering, but current 2026 packaging is
            not in the assigned pool.
        - label: African Bank
          x: 3
          'y': 2
          detail: >-
            Historical case-study snapshot records a no-monthly-fees account, but current breadth is not documented
            here.
        - label: Bank Zero
          x: 1
          'y': 1
          detail: >-
            Historical snapshot positions Bank Zero as an app-only mutual-bank entrant; current scale and pricing are
            undocumented in the assigned pool.
        - label: Capitec lending incumbent
          x: 4
          'y': 5
          detail: >-
            Tech In Africa names Capitec as the incumbent in unsecured lending, implying stronger credit breadth than
            the current GoTyme lending evidence set.
        - label: Low-fee branch incumbents
          x: 5
          'y': 3
          detail: >-
            Historical case-study evidence shows incumbents reacting on price, but the assigned current pool does not
            preserve equivalent 2026 feature sheets.
    approximationNotes: >-
      Ordinal scores synthesize only the retained public evidence; they are not market-share, NPS, or profit
      measurements, and sparse current rival pricing caps precision.
    claimRefs:
      - CP007
      - CP009
      - CP010
      - CP012
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a low-fee customer acquisition engine that turns deposits and lending into interest, fee,
      and adjacent-product revenue, with profitability improving before capital needs fully disappear.
    data:
      nodes:
        - id: acquire
          label: Acquire customers
          detail: >-
            Hybrid app-plus-kiosk onboarding; company materials cite roughly 150,000 customers per month in 2023 and
            more than 12 million South African customers by 2026.
        - id: account
          label: Open low-fee accounts
          detail: >-
            Everyday banking is marketed with zero monthly fees, free instant payments, and onboarding that takes less
            than five minutes.
        - id: deposits
          label: Gather deposits and savings
          detail: >-
            Customer deposits were R4.005 billion in FY2023, and an undated ARC page says deposits were close to R7
            billion.
        - id: credit
          label: Add credit and merchant products
          detail: >-
            Merchant cash advance financed more than 50,000 SMEs, while credit card, BNPL, and insurance broaden
            monetization.
        - id: revenue
          label: Convert activity into revenue
          detail: >-
            FY2023 public bank financials show R672.6 million of interest income and R336.1 million of net fee and
            commission income.
        - id: outcome
          label: Reach profitability while still needing capital
          detail: >-
            The bank said it reached its first profitable month in December 2023, but the FY2023 audited accounts still
            relied on continued funding and capital support.
    approximationNotes: >-
      Sequence is evidence-backed but not value-proportional. Public sources do not disclose conversion rates,
      product-level gross profit, or a current consolidated bridge from customers to earnings.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI008
      - CI009
      - CI011
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      TymeBank layers app-led servicing over kiosk-assisted distribution, deposit products, and expanding credit
      workflows.
    data:
      layers:
        - label: Customer access layer
          detail: Digital self-service is the primary customer interface after onboarding.
          items:
            - label: GoTyme mobile app
              detail: Primary interface for balances, payments, savings, and the 2026 phased feature rollout.
        - label: Physical acquisition layer
          detail: Retailer-linked infrastructure converts walk-in traffic into active banking customers.
          items:
            - label: Retail kiosks and agent points
              detail: Assisted onboarding, identity capture, and card issuance through partner locations.
        - label: Transactional banking layer
          detail: Core daily-banking products anchor the customer relationship and fee pool.
          items:
            - label: Transactional accounts
              detail: Daily banking revenue from cash, transfer, and card-related activity.
        - label: Savings layer
          detail: Savings products help retention and provide low-cost funding depth.
          items:
            - label: Savings and term deposits
              detail: Deposit products that deepen retention and low-cost funding.
        - label: Credit and adjacent-services layer
          detail: Credit and value-added services expand wallet share beyond basic deposits.
          items:
            - label: Personal loans
              detail: Consumer credit expansion path tied to decisioning capability.
            - label: Merchant Cash Advance
              detail: SME lending product with turnover-linked repayment logic.
            - label: MoreTyme and value-added services
              detail: BNPL and adjacent services broaden share of wallet beyond deposits.
        - label: Control and partnership layer
          detail: External partnerships extend reach while the control framework manages operating and compliance risk.
          items:
            - label: Cloud/open-service architecture
              detail: Company narrative says the stack supports fast third-party collaboration and product expansion.
            - label: Regulatory and compliance controls
              detail: AFS cites infrastructure, controls, systems, and compliance oversight.
            - label: External partners
              detail: Retailers, GDS Link, Sanlam, and Home Affairs extend reach and add execution dependencies.
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      TymeBank’s customer journey still starts with low-friction acquisition and moves through app use, assisted
      service, and adjacent credit/SME expansion.
    data:
      nodes:
        - label: Acquire in-store
          title: Acquire in-store
          detail: Retail till points and kiosks reduce branch dependence for first-time account opening.
          touchpoints:
            - 14,000 till points and 850+ kiosks historically supported onboarding
            - 80% of accounts were opened at kiosks and 20% online in the cited case-study period
        - label: Activate digitally
          title: Activate digitally
          detail: Customers move into app-based banking without a branch migration step.
          touchpoints:
            - The current access model still includes the app, kiosks, and retail partners
            - The official rebrand migrated existing accounts, balances, and transaction history into the new app
        - label: Transact and save
          title: Transact and save
          detail: The bank’s core use case remains everyday retail banking at mass scale.
          touchpoints:
            - More than 12 million South African customers were claimed in February 2026
            - The 2023 filing linked customer scale to more than R4 billion in retail deposits
        - label: Use assisted support
          title: Use assisted support
          detail: The contact center is a high-volume operational surface rather than an edge case.
          touchpoints:
            - Genesys says the bank now handles 160,000 calls a month
            - Customer satisfaction was cited at about 90%
        - label: Expand into credit
          title: Expand into credit
          detail: Lending and decisioning workflows deepen wallet share beyond simple transaction banking.
          touchpoints:
            - GDS Link says TymeBank used its platform to improve unsecured-personal-loan decisioning
            - Retail Capital broadened service into small-business lending
        - label: Replicate across markets
          title: Replicate across markets
          detail: The South African operating model is also a template for adjacent geographies.
          touchpoints:
            - African Rainbow Capital said GOtyme in the Philippines would replicate the retail-network and app model
            - Public evidence does not yet show equivalent retention disclosure across markets
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Migration continuity and structural dependencies are the hottest risks because the 2026 rebrand is live, while
      public financial and incident disclosure is still lagging.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Rebrand and app migration continuity
          values:
            - label: High
              tone: risk
              note: Phased rollout confirms active execution risk rather than a finished conversion.
            - label: High
              tone: risk
              note: Customer balances, histories, cards, and channels all have to stay coherent.
            - label: Medium
              tone: neutral
              note: Security/stability prioritisation and support investment are visible mitigants.
            - label: High
              tone: risk
              note: No public assigned-source incident or complaint trend verifies landing quality.
        - label: KYC, AML, and conduct friction
          values:
            - label: Medium
              tone: neutral
              note: External data checks are routine but can misfire at scale.
            - label: High
              tone: risk
              note: Failed verification or freezes can trigger customer harm and regulator attention.
            - label: Medium
              tone: neutral
              note: Current controls are explicit in terms, but outcome metrics are missing.
            - label: Medium-High
              tone: risk
              note: Escalation paths are clear; complaint-volume evidence is not.
        - label: Outsourced technology and kiosk dependency
          values:
            - label: Medium
              tone: neutral
              note: AFS shows outsourced IT and kiosk-management cost dependence.
            - label: Medium-High
              tone: risk
              note: Failure can hit both digital and physical service surfaces.
            - label: Medium
              tone: neutral
              note: Support expansion helps, but SLAs and uptime are not public here.
            - label: Medium
              tone: neutral
              note: Historical kiosk impairment shows non-trivial hardware execution risk.
        - label: SME credit and liquidity transparency gap
          values:
            - label: Medium
              tone: neutral
              note: Audited evidence is old enough that current trajectory cannot be confirmed.
            - label: High
              tone: risk
              note: SME credit and depositor-liquidity strain can change investment outcomes quickly.
            - label: Medium
              tone: neutral
              note: AFS shows governance, but not refreshed 2026 metrics.
            - label: Medium-High
              tone: risk
              note: Residual uncertainty persists until newer audited capital and loss data appear.
        - label: Fraud reporting and dispute handling
          values:
            - label: Medium
              tone: neutral
              note: Current terms contemplate suspicious and unauthorised transactions.
            - label: High
              tone: risk
              note: Delayed reporting can shift losses and evidentiary burdens to customers.
            - label: Medium
              tone: neutral
              note: Notifications, complaint routes, and external escalation channels are documented.
            - label: Medium
              tone: neutral
              note: Current fraud-loss and complaint-volume data are not public in the assigned pool.
        - label: Retail and customer-acquisition dependencies
          values:
            - label: Medium
              tone: neutral
              note: Independent low-reputation sources flag competition and partner reliance.
            - label: Medium-High
              tone: risk
              note: Retail or pricing disruption can weaken onboarding and acquisition efficiency.
            - label: Medium
              tone: neutral
              note: The hybrid app, kiosk, and card model diversifies customer touchpoints.
            - label: Medium
              tone: neutral
              note: Current partner concentration and channel economics remain undisclosed.
    approximationNotes: No numeric scoring is implied; cells summarize qualitative evidence from the assigned pool only.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Operating proof is real, but price support breaks on missing current valuation terms and incomplete consolidated
      disclosure.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: 12M+ South Africa customers; 20M across Tyme Group.
        - id: funding
          label: Funding proof
          detail: $77.8M pre-Series C and >$260M cumulative funding reported in 2023.
        - id: profit
          label: Operating improvement
          detail: First profitable month reported for December 2023; FY2023 bank capital adequacy ratio was 27.4%.
        - id: anchor
          label: Price anchor
          detail: 2024 process pointed to a $965M prior indication and a targeted unicorn valuation.
        - id: gap
          label: Disclosure gap
          detail: No public final Series D terms, current cap table, or audited consolidated group financials.
        - id: outcome
          label: Recommendation
          detail: Track rather than buy until current valuation terms are independently verified.
      edges:
        - from: scale
          to: funding
          label: supports market interest
        - from: funding
          to: profit
          label: backs scaling plan
        - from: profit
          to: anchor
          label: improves narrative
        - from: anchor
          to: gap
          label: but does not settle price
        - from: gap
          to: outcome
          label: therefore maintain discipline
    approximationNotes: null
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV010
      - CV012
      - CV014
      - CV016
