  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Mass-market retail distribution remains the core customer engine
        blocks:
          - type: paragraph
            body: >
              TymeBank’s clearest customer proof is still its South African retail base, acquired through a branchless
              model that combines the app with kiosks and retail-partner access points rather than traditional branches.
              The current official rebrand notice says the South African bank has grown to more than 12 million
              customers and still serves them through the GoTyme app, service kiosks, and retail partners, while older
              customer evidence shows how much of that acquisition engine historically depended on kiosk-led onboarding.
              The result is a customer model aimed at broad, price-sensitive consumer adoption rather than high-touch
              affluent banking, with extension paths into assisted service, consumer credit, and small-business lending.
            claimRefs:
