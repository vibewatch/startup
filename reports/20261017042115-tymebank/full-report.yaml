      - number: '4.2'
        title: Public traction and operating-leverage proxies
        blocks:
          - type: paragraph
            body: >-
              The best public traction proxies are customer, deposit, and product-usage disclosures rather than revenue
              disclosure. An official 2026 company profile says the South African bank serves over 12 million customers,
              while the broader Tyme Group serves 20 million customers across multiple markets; Moneyweb independently
              repeated the 20 million group-customer figure and noted that the South African licence and regulatory
              oversight were unchanged. Earlier redisseminated company materials said TymeBank reached its first
              profitable month in December 2023, was acquiring roughly 150,000 customers each month, and was financing
              more than 50,000 SMEs through merchant cash advance. ARC's undated investment page said deposits were
              close to R7 billion, versus the R4.005 billion shown in the FY2023 audited bank financial statements.
              Together these are useful signals of scale and possible operating leverage, but they are not substitutes
              for disclosed CAC, payback, cohort retention, or product-level contribution margins.
            claimRefs:
