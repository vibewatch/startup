  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              TymeBank's public positioning is deliberately mass-market and low-fee: company materials say the South
              African bank offers zero monthly banking fees, free instant payments, fast digital onboarding, and
              market-leading savings rates, while older product material describes the EveryDay account and GoalSave
              savings pockets in similar terms. That means underwriting cannot rely on SaaS-style recurring subscription
              revenue. Instead, the public record points to a banking model that monetizes a growing deposit base, net
              interest spread, fee and commission activity, and cross-sold credit or off-balance-sheet products such as
              merchant cash advance, credit cards, BNPL, insurance, and other partner-led services. The 2021 growth
              raise was framed as capital for commercial expansion and product diversification, which is directionally
              consistent with later disclosures about lending and merchant-finance products, but public materials still
              do not break out revenue mix by line of business.
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI015
