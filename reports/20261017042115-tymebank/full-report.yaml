      - number: '4.3'
        title: Balance-sheet structure and capital dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence remains Tyme Bank Limited's FY2023 annual financial statements.
              Those statements show a deposit-funded balance sheet with R4.005 billion of customer deposits, R1.668
              billion of net customer advances, R1.680 billion of cash and cash equivalents, R672.6 million of interest
              income, and R336.1 million of net fee and commission income. They also show an annual loss of R858.1
              million and accumulated losses of R6.637 billion, which management described as establishment and build
              costs. Critically, the same statements say going-concern support beyond 31 October 2024 depended on
              continued shareholder support, fresh capital, working-capital facilities, and successful execution of
              growth plans. That is a real underwriting constraint: public evidence shows an improving operating model,
              but not self-funded expansion at group level.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a credible retail-bank revenue engine with meaningful deposit gathering,
              active product expansion, and at least one later claim of monthly profitability. It does not yet support a
              high-confidence view on sustainable group earnings quality or current capital adequacy. The strongest
              positive signal is that TymeBank appears to have scaled customer acquisition and deposit gathering while
              adding lending and merchant-finance products. The strongest negative signal is that audited FY2023
              accounts still required ongoing capital support and ARC's undated investment page framed AI and analytics
              investment as creating short-term pressure. Without consolidated FY2024-FY2026 group statements, realized
              pricing, loss-rate disclosure, and current funding commitments, the correct financial judgment is
              "promising operating leverage, but incomplete underwriting visibility."
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deposits and cross-sell matter more than account subscription
            body: >-
              Public pricing evidence is consistent with a mass-market bank that wins on low headline fees and then
              monetizes balances, payment activity, and credit or partner products rather than a recurring account
              subscription.
            calloutType: insight
            claimRefs:
              - CI003
              - CI009
              - CI011
              - CI015
          - type: callout
            title: Capital visibility is still the core underwriting blocker
            body: >-
              The most concrete public capital statement remains the FY2023 going-concern note, which said support
              beyond 31 October 2024 depended on shareholder backing, new capital, and working capital facilities.
            calloutType: risk
            claimRefs:
              - CI005
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Distribution model and customer workflow
        blocks:
          - type: paragraph
            body: >-
              TymeBank's product is best understood as a digitally managed retail bank with a physical acquisition and
              service layer, not as a standalone mobile app. The FY2025 annual financial statements describe digital
              banking services centered on financial inclusion and affordable products, then tie that proposition to a
              large retailer-linked distribution estate where customers can open accounts quickly and access cash-out
              points nationwide. Company-controlled materials and independent coverage are directionally consistent: the
              GoTyme app is the everyday interaction surface, but kiosks, retail partners, and agent points remain core
              to customer acquisition, onboarding, and cash movement. That hybrid workflow is the chapter's clearest
              product proof because it shows what the user actually does, how TymeBank lowers acquisition friction, and
              why the model is difficult for branch-heavy incumbents to copy without redesigning their channel
              economics.
            claimRefs:
