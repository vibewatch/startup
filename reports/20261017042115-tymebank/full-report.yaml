  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: named rivals are visible, but the current pool is asymmetric'
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a credible competitor map, but not a fully refreshed peer census on a
              like-for-like basis. Current public comparison coverage explicitly names Capitec Bank, Discovery Bank, and
              Bank Zero around GoTyme Bank's rebrand, while the historical 2019 case-study snapshot shows that TymeBank
              was already dealing with incumbent price responses, African Bank's no-fee push, Discovery Bank's launch,
              and Bank Zero's app-only entry. That matters because the competitive problem is not new: low-fee incumbent
              responses and digitally led challengers have been part of Tyme's market context from the start. What is
              missing is a comparably current, independently sourced package of 2026 product, pricing, and
              customer-scale data for each named rival, so the chapter can map the field with confidence but must mark
              many rival cells as unknown rather than imply parity or superiority that the pool does not prove.
