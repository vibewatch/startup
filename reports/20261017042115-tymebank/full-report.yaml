        - 2024 reporting referenced a $965M prior indication and a targeted 'unicorn valuation' Series D.
        - >-
          A move to buy would require current terms, preference stack, and a post-2024 mark validated by independent
          evidence.
      - - Historical capital dependence is material.
        - >-
          The FY2023 filing tied continued operation beyond October 2024 to shareholder support, new capital,
          working-capital facilities, and execution.
        - A stronger view needs current audited evidence that this historical uncertainty was resolved.
    notes: >-
      Table separates operating proof from valuation proof so customer and funding momentum are not mistaken for
      verified current entry price support.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV014
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          A current financing closes on clean terms; consolidated audited earnings support the growth story; the stated
          2028 IPO path remains credible.
        - >-
          No numerical range is supportable from assigned evidence; a premium to the historical $965M indication
          requires audited profit conversion and non-subordinating terms.
        - Preference overhang remains undisclosed; cross-market execution may consume more capital than expected.
        - Low until audited group financials and final round terms are disclosed.
      - - Base
        - >-
          Business quality remains credible, but assigned evidence stays limited to the reported 2024 process, 2023
          funding history, and milestone profitability disclosures.
        - >-
          No current range is supportable; treat $965M only as a historical indication and require current price and
          preference documents before entry.
        - Evidence may lag current performance; investors still face information asymmetry on dilution and hold period.
        - Highest on the assigned evidence.
      - - Bear
        - >-
          Current financing prices below the 2024 indication, profitability proves less durable, or IPO timing slips
          materially.
        - >-
          A premium entry lacks public support; downside would come from multiple de-rating and any structured
          protections favoring existing investors.
        - >-
          Round terms could be materially worse than headline valuation; capital need may increase if growth
          monetisation stalls.
        - Material if management cannot close the financing and disclosure gaps.
    notes: >-
      Scenario ranges are anchored to disclosed public markers only; this table deliberately avoids unsupported
      precision because the current cap table, preference stack, and current mark are not public.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public chronology runs from incorporation and licensing through launch, SME-lending expansion, first monthly
      profitability, and the 2026 GoTyme rebrand.
    data:
      items:
        - date: '2015-07-08'
          label: Incorporation
          details: Tyme Bank Limited was incorporated in South Africa.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2017-09-14'
          label: Banking approval
          details: The bank obtained approval to commence business.
          tone: positive
          claimRefs:
            - CO002
        - period: August 2018
          label: Soft launch
          details: The bank soft-launched before broad public marketing.
          tone: neutral
          claimRefs:
            - CO002
        - date: '2019-02-25'
          label: Public retail launch
          details: Transaction and savings accounts were marketed publicly from this date.
          tone: positive
          claimRefs:
            - CO002
        - date: '2022-12-15'
          label: Retail Capital acquisition effective
          details: The Retail Capital deal expanded Tyme's business-banking and SME-lending capabilities.
          tone: positive
          claimRefs:
            - CO005
        - date: '2023-06-30'
          label: 7.5 million customers and R4bn+ deposits
          details: >-
            The 2023 audited filing recorded scale at roughly 7.5 million customers and over R4 billion in retail
            deposits.
          tone: positive
          claimRefs:
            - CO004
        - period: December 2023
          label: First monthly profit
          details: The FT reported that TymeBank achieved its first monthly profit in December 2023.
          tone: positive
          claimRefs:
            - CO010
        - date: '2024-06-06'
          label: Valuation and fundraising signal
          details: The FT described the bank as $965 million valued and said it hoped to raise at least $100 million in 2024.
          tone: opportunity
          claimRefs:
            - CO009
        - date: '2026-01-22'
          label: New app goes live
          details: The GoTyme Bank app launched for phased migration of existing customers.
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-02-04'
          label: GoTyme consumer rebrand announced
          details: >-
            TymeBank publicly transitioned its consumer brand to GoTyme Bank while keeping the same regulated South
            African bank underneath.
          tone: neutral
          claimRefs:
            - CO011
            - CO014
        - date: '2026-03-31'
          label: Pick n Pay kiosk exit completed
          details: >-
            Pick n Pay kiosks had closed by the end of March, leaving other retail and mall distribution points in
            place.
          tone: warning
          claimRefs:
            - CO015
