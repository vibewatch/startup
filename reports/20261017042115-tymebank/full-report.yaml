      - number: '3.2'
        title: Distribution and access remain the clearest differentiator
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiator in the retained evidence is not a secret feature set; it is distribution
              design. Current company-controlled and independent coverage consistently describes GoTyme as a branchless
              hybrid that pairs an app with kiosks, retail-partner cash access, and fast in-store onboarding. Tech In
              Africa and the re-disseminated TymeBank release both tie growth to the retail-partner footprint, kiosk
              model, and low-cost acquisition logic, while the official rebrand page still presents zero monthly fees,
              under-five-minute onboarding, free instant payments, and strong savings positioning as the mass-market
              value proposition. In practice, that means GoTyme's edge is easiest to defend where a buyer values
              convenient onboarding, cash-in and cash-out access, and embedded retail reach more than a full-service
              branch network.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
