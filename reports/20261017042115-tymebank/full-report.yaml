      - number: '6.2'
        title: Adoption trajectory shows scale-up, but mostly through top-line customer counts
        blocks:
          - type: paragraph
            body: >
              The retained sources support a clear growth arc even though they do not provide a clean cohort view.
              African Rainbow Capital said TymeBank reached 3.5 million customers by the end of July 2021; a 2023 annual
              financial statement said the bank had attracted about 7.5 million customers and more than R4 billion in
              retail deposits; and the 2026 rebrand announcement says the South African bank serves more than 12 million
              customers. Historical secondary evidence also points to strong onboarding velocity in 2022, but these
              public data points are mostly headline customer totals rather than active-user, revenue-per-customer, or
              retention measures, so they prove reach more clearly than they prove customer quality.
            claimRefs:
              - CU001
              - CU008
              - CU011
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU011
              - CU014
      - number: '6.3'
        title: Named proof is strongest around servicing and channel usage, not retention
        blocks:
          - type: paragraph
            body: >
              Public customer proof is real, but it is uneven. The 2026 migration evidence shows TymeBank moved existing
              customers into the new GoTyme app without reopening accounts, while Genesys says the contact center now
              handles 160,000 calls a month with customer satisfaction around 90%. GDS Link’s lending case study adds
              proof that the bank was already operating at production lending scale when it needed better real-time
              decisioning. What is missing is the durability layer: the retained sources do not disclose churn, renewal,
              or cohort retention metrics, so the chapter can verify operational use and support intensity, but not
              whether the acquired customer base compounds with strong retention economics.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU010
              - CU013
      - number: '6.4'
        title: Expansion is visible into SMEs and the Philippines, while concentration remains opaque
        blocks:
          - type: paragraph
            body: >
              TymeBank is no longer just a South African retail acquisition story. The 2023 filing says Retail Capital
              was integrated to serve a broader customer base and expand services to underserved small businesses, while
              the 2021 African Rainbow Capital update says the South African model was being exported into GOtyme in the
              Philippines through retail-network onboarding and a companion app. That supports a land-and-expand
              narrative across adjacent segments and geographies. However, public materials still do not disclose
              customer concentration, deposit concentration, or segment revenue mix, so expansion quality can only be
              judged directionally and procurement or concentration risks remain underexplained.
            claimRefs:
              - CU010
              - CU012
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Acquisition proof is stronger than most private-bank disclosures
            body: >-
              The public evidence triangulates TymeBank’s customer scale from 3.5 million in July 2021 to roughly 7.5
              million by mid-2023 and more than 12 million by February 2026, while partner case studies show real
              support and onboarding load instead of logo-only marketing.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU011
          - type: callout
            title: Durability remains underdisclosed
            body: >-
              Public evidence supports customer acquisition, service throughput, and channel reach, but not retention
              economics or concentration; without churn, renewal, NRR/GRR, or top-customer disclosures, expansion
              quality cannot be scored confidently.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk snapshot
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence does not point to an immediate licence-reset risk from the TymeBank-to-GoTyme
              transition: official and independent sources consistently say the bank kept the same South African licence
              and regulatory oversight. The bigger near-term issue is execution. GoTyme launched a new app on 22 January
              2026 and described the migration as phased to protect security, stability, and customer experience, which
              is reassuring but also confirms a live operational change program touching customer accounts, mobile
              access, cards, kiosks, and support. Public current-state transparency is thinner on the financial side.
              The newest audited bank filing in the assigned pool is for June 2023, so investors can see the risk
              categories, operating-loss disclosures, and dependency structure, but not refreshed 2026 credit-loss,
              capital, liquidity, or post-migration complaint metrics. The practical ranking is therefore: 1) migration
              and service continuity, 2) external dependency and onboarding fragility, 3) balance-sheet and SME credit
              exposure with stale public reporting, and 4) conduct risk if complaint volumes rise faster than support
              capacity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory continuity looks stronger than many execution risks, but it is not zero-risk. The current terms
              and official rebrand materials state that the bank remained licensed and regulated in South Africa after
              the rename, so the core legal entity appears intact. The same terms also show how much of the control
              framework depends on identity and compliance infrastructure outside the bank's sole control: onboarding
              relies on Home Affairs biometric data, credit bureaux, and additional AML documentation, and the bank
              reserves the right to refuse or close accounts when checks fail or suspected illegal use arises. That is
              operationally rational, but it creates customer-friction and conduct risk if external data feeds misfire
              at scale. Complaint escalation channels are at least explicit: unresolved disputes can be taken to NFOSA,
              the FSCA, and the National Consumer Tribunal after 20 days, which provides a mitigation path for customers
              and a monitorable signal for investors.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR015
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk profile is heavier than the legal-risk profile because the rebrand is a multi-surface
              migration, not just a logo change. Official and independent coverage say the new GoTyme app went live in
              January 2026, all balances and transaction histories were migrated, and the rollout was deliberately
              phased. That reduces hard-cutover risk, but it also implies a prolonged period where app updates,
              authentication, retail touchpoints, and support queues must all work together. The contract language is
              notable here: GoTyme warns that service interruptions can follow power, system, or network failures and
              disclaims liability for interruptions beyond reasonable control. Historical bank filings reinforce that
              the operating model has meaningful technology and kiosk dependencies, including outsourced IT and
              kiosk-management costs, prior impairment on unsuitable kiosk components, and separately disclosed fraud
              and operational risk losses. Bizcommunity's supplied release says the bank has expanded customer-care
              capacity, which is a useful mitigation, but investors should treat repeated migration incidents, login
              failures, or rising ombud complaints as thesis-break indicators rather than temporary noise.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: Dependency, credit, and balance-sheet risk
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a cautious read on financial-model risk rather than a clean all-clear. The
              latest available audited local-bank financials identify credit risk, liquidity risk, market/currency risk,
              and interest-rate repricing risk as core exposures, and say most credit risk comes from SME advances,
              interbank placements, and government-securities investments. That matters because Tyme's hybrid
              bank-plus-merchant-finance model pushes execution risk beyond vanilla consumer deposits. Public commentary
              also highlights disclosure limits: one review explicitly notes that detailed revenue, profitability, and
              growth figures still need support from financial reports. Until the market gets refreshed audited bank or
              group statements, the sensible diligence stance is to monitor deposit stability, impairment trends,
              SME-credit performance, and dependence on Tyme Global technology plus retail distribution partners. A
              reasonable kill criterion would be any combination of worsening service continuity, adverse regulator
              escalation, or new financial disclosures showing credit deterioration without matching capital support.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR009
              - CR010
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary risk is execution, not legal reset
            body: >-
              The current evidence says the rebrand preserved the underlying South African licence, so the critical
              investment question is whether migration quality, support responsiveness, and third-party dependencies
              hold up under scale.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
              - CR016
          - type: callout
            title: Public financial visibility is stale for a fast-changing bank
            body: >-
              The assigned pool still bottoms out at a June 2023 audited local-bank filing for hard balance-sheet
              evidence, so any 2026 view on capital resilience or SME-credit quality should be treated as
              medium-confidence until newer audited disclosures appear.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
          - type: callout
            title: Kill criteria to monitor before valuation work
            body: >-
              Treat the thesis as broken if the migration produces repeated outages or ombud escalation, or if refreshed
              financial disclosures show worsening SME-credit stress, deposit pressure, or rising loss absorption
              without credible capital support.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence is good enough to say TymeBank is no longer an early proof-of-concept asset: the South
              African bank has rebranded into the wider GoTyme identity without changing its licence, controls, or
              customer continuity, and multiple sources still point to real scale and prior funding support. But the
              same public record does not support paying up on narrative alone. The only retained numerical pricing
              anchor is a 2024 report that TymeBank was pursuing a $150 million Series D while management described it
              as a "unicorn valuation," paired with a Bloomberg-indicated $965 million prior mark. Those historical
              signals describe what the 2024 process targeted; they do not prove where the round ultimately priced,
              whether terms were investor-friendly, or whether later operating performance justified a step-up. On
              publicly available evidence, the disciplined stance is to track and wait for verified price discovery, not
              to issue a buy recommendation.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The valuation case has to bridge two different kinds of proof. On the positive side, management-linked and
              independent reporting point to scale: the South African bank says it has passed 12 million customers
              locally, the wider Tyme Group says it serves 20 million customers, and 2023 coverage described more than
              $100 million of revenue run rate plus 300,000 new customers a month across South Africa and the
              Philippines. On the cautionary side, the public valuation record is incomplete and entity scope is
              inconsistent: TechCrunch and WeeTracker reported a $77.8 million pre-Series C and TechCrunch reported
              cumulative funding above $260 million, while a public Tracxn profile attributes only $13.3 million over
              two rounds to TymeBank. The group-versus-bank mismatch makes the database figure unusable as standalone
              valuation support without reconciliation. Scenario ranges therefore have to stay anchored to disclosed
              marks and explicit diligence gates rather than precise model outputs.
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The remaining underwriting problem is not whether TymeBank has operating momentum; it is whether outside
              investors can verify how much of that momentum belongs to the regulated South African bank, how much
              belongs to the wider Tyme Group, and what protections sit ahead of new money. The retained public sources
              still do not disclose a finalized Series D close, a current fully diluted cap table, liquidation
              preferences, or audited consolidated group financials that reconcile bank-level losses with group value
              creation. The FY2023 bank filing also disclosed that continued operation beyond October 2024 depended on
              shareholder support, new capital, working-capital facilities, and execution. Until current materials are
              produced, a valuation call must account for downside from multiple compression, structured-round
              preferences, or slower-than-advertised conversion of customer growth into audited earnings. A thesis break
              would be any combination of a down-round versus the 2024 proposal, delayed IPO preparation, weaker
              profitability evidence, or evidence that growth has required materially higher support capital than the
              current public record shows.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until the current round is documented
            body: >-
              TymeBank looks credible enough to stay in the funnel, but the public record still does not justify paying
              a premium to the last visible valuation marker.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV014
              - CV016
          - type: callout
            title: Operating proof is stronger than valuation proof
            body: >-
              Customer scale, 2023 fundraising support, and a reported first profitable month are real positives, but
              they do not replace audited current round terms.
            calloutType: strength
            claimRefs:
              - CV002
              - CV005
              - CV010
          - type: callout
            title: Disclosure asymmetry is the core downside
            body: >-
              The main risk is not product-market fit; it is entering without a verified current mark, preference stack,
              or consolidated earnings bridge.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
