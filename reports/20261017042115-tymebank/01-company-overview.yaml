          claimRefs: [CO009]
        - date: "2026-01-22"
          label: New app goes live
          details: The GoTyme Bank app launched for phased migration of existing customers.
          tone: positive
          claimRefs: [CO013]
        - date: "2026-02-04"
          label: GoTyme consumer rebrand announced
          details: TymeBank publicly transitioned its consumer brand to GoTyme Bank while keeping the same regulated South African bank underneath.
          tone: neutral
          claimRefs: [CO011, CO014]
