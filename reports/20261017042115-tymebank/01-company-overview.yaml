company:
  name: TymeBank
chapter:
  number: 1
  title: Company Overview
  summary: >-
    TymeBank's public identity shifted in 2026 from a TymeBank consumer brand to GoTyme Bank,
    but the assigned evidence still points to the same South African licensed bank inside Tyme
    Group rather than a new legal entity. The strongest supported ground-truth is a business that
    launched publicly in 2019, reached 7.5 million customers and over R4 billion in deposits by
    June 2023, reported first monthly profitability in December 2023, and then used the 2026
    rebrand to unify its South African customer-facing brand with a wider cross-border group.
sections:
  - id: legal-identity-and-model
    title: Legal identity and operating model
    body: >-
      The assigned pack supports a continuity thesis rather than a new-company thesis. Tyme Bank
      Limited was incorporated in 2015, received approval to commence business in 2017, soft-launched
      in 2018, and publicly marketed transactional and savings accounts from 25 February 2019.
      The 2023 annual financial statements frame it as a South African digital banking-services
      business headquartered in Rosebank, Johannesburg, while 2026 company materials say the
      consumer brand has transitioned to GoTyme Bank without changing the underlying licensed
      South African bank. The customer proposition remains hybrid rather than app-only: digital
      onboarding and app-led servicing sit alongside kiosks, mall hubs, and retail partners, even
      though desktop internet banking has been withdrawn and Pick n Pay kiosks have exited.
    claimRefs: [CO001, CO002, CO003, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO001]
  - id: leadership-governance-and-control
    title: Leadership, governance, and control map
    body: >-
      Public governance visibility is good at the South African bank level and materially weaker at
      the current group-cap-table level. The statutory 2023 filing shows a classic regulated-bank
      setup with Coenraad Jonker as CEO, Yvette Dockrat as CFO, and a broad non-executive board,
      while the same filing documents a restructuring that inserted Tyme SA Holdings and Singapore-based
      Tyme Group Pte. Ltd. above Tyme Bank Holdings without changing Ubuntu-Botho Investments as
      the ultimate holding company. By February 2026, rebrand communications named Cheslyn Jacobs
      as CEO of GoTyme Bank South Africa, which is enough to treat the South African operating lead
      as changed in public-facing materials even though the exact handover date and founder roster
      are not established in the assigned pack.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: scale-capital-and-traction
    title: Scale, capital signals, and traction
    body: >-
      Public scale evidence is strong for customer growth and directionally useful for capital
      formation, but incomplete for current financial quality. The 2023 bank statements report
      circa 7.5 million customers and over R4 billion in retail deposits; the June 2024 FT profile
      then lifts that to 9 million customers, says the bank achieved its first monthly profit in
      December 2023, and describes TymeBank as a $965 million-valued company planning to raise at
      least $100 million for further expansion. February 2026 company background materials push the
      South African customer count above 12 million and group customers to 20 million worldwide,
      but the current evidence pack does not support consolidated FY2025/FY2026 revenue, cash burn,
      headcount, or a fresh post-2024 valuation point. Those omissions matter because later chapters
      will need to distinguish scale momentum from investability.
    claimRefs: [CO004, CO009, CO010, CO011, CO014]
  - id: milestones-and-open-risks
    title: Milestones and open risks
    body: >-
      The reusable chronology is clear enough to anchor later chapters. The company moved from
      incorporation and licensing into a 2019 public launch, added business-lending capability
      through the 2022 Retail Capital acquisition, reached first monthly profitability in December
      2023, and then used the 2026 GoTyme rebrand to align the South African customer brand with
      a broader Tyme Group footprint. What remains unresolved is not chronology but quality of the
      current operating base: the FT profile still highlighted two diligence-critical risks, namely
      whether low-income account openings become primary banking relationships and whether the loan
      book can stay resilient in a high-default South African credit environment. Post-rebrand
      channel economics after the Pick n Pay kiosk exit also remain weakly disclosed.
    claimRefs: [CO001, CO002, CO005, CO010, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
