          label: 7.5 million customers and R4bn+ deposits
          details: The 2023 audited filing recorded scale at roughly 7.5 million customers and over R4 billion in retail deposits.
          tone: positive
          claimRefs: [CO004]
        - period: "December 2023"
          label: First monthly profit
          details: The FT reported that TymeBank achieved its first monthly profit in December 2023.
          tone: positive
          claimRefs: [CO010]
        - date: "2024-06-06"
          label: Valuation and fundraising signal
