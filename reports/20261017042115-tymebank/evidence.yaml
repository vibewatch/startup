evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-valuation-and-total-raised
    missingEvidence: A post-2024 financing outcome, latest valuation, total capital raised, and instrument terms.
    whyItMatters: Capital structure freshness affects valuation stance, ownership concentration, and runway interpretation.
    diligencePath: Request the latest financing announcement, investor deck, or cap table from Tyme Group or lead investors.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-financial-quality
    missingEvidence: Consolidated group revenue, burn, cash runway, and current headcount for FY2025-FY2026.
    whyItMatters: Customer and funding milestones do not prove investability without current operating economics and resourcing.
    diligencePath: Obtain consolidated audited financials or management accounts for Tyme Group and the South African bank.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: missing-source
    severity: minor
    topic: founders-and-leadership-transition
    missingEvidence: >-
      Explicit founder roster and the exact date or governance process for the handoff from Coen Jonker to Cheslyn
      Jacobs in the South African operating role.
    whyItMatters: >-
      Founder-market fit and leadership-change context help later chapters assess key-person risk and execution
      continuity.
    diligencePath: >-
      Pull an official about page, board notice, or executive biography pack that names founders and dates the
      transition.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: post-rebrand-distribution-economics
    missingEvidence: >-
      Customer-acquisition and transaction-volume impact from ending desktop internet banking and exiting Pick n Pay
      kiosks.
    whyItMatters: >-
      Channel economics affect acquisition efficiency, service accessibility, and defensibility of the hybrid
      distribution model.
    diligencePath: >-
      Request channel-mix KPIs and retail-partner volumes, or find independent reporting on customer migration after
      March 2026.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A public or diligence-room segmentation model that ties TymeBank/GoTyme's customer segments to revenue pools,
      deposits, balances, or wallet-share by cohort.
    whyItMatters: >-
      Public sources currently support only adoption and cohort-skew lenses, which is insufficient for a high-confidence
      monetary TAM, SAM, or SOM.
    diligencePath: >-
      Request management's current segment deck with active customers, deposits, interchange, lending exposure, and
      revenue contribution by retail cohort and SME adjacency.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      A disclosed segmentation framework showing who controls the budget in each workflow, especially for SME merchant
      cash advance and any non-retail products.
    whyItMatters: >-
      Buyer, user, and payer roles can only be inferred at workflow level today, which weakens adoption and sales-cycle
      analysis.
    diligencePath: >-
      Ask for product-level GTM materials, merchant cash-advance eligibility rules, and customer-mix disclosures
      separating consumer and SME activity.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: current-peer-pricing
    missingEvidence: >-
      Current public tariff or product pages for Discovery Bank, African Bank, Bank Zero, and Capitec on a like-for-like
      retail-banking basis.
    whyItMatters: >-
      Without current price sheets, the packaging table can show pressure and gaps but cannot prove that GoTyme is
      cheaper or broader than each named rival.
    diligencePath: >-
      Collect current competitor pricing and product pages, then rerun the comparison using the same row definitions and
      units.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: historical-competitor-snapshot
    missingEvidence: >-
      A current independent competitor landscape source that updates the 2019 Discovery, African Bank, Bank Zero, and
      incumbent-price snapshot with 2026 product and scale data.
    whyItMatters: >-
      The assigned pool proves that Tyme has long faced price and digital-bank pressure, but it does not refresh those
      rival profiles on a comparable current basis.
    diligencePath: >-
      Fetch current independent competitor profiles or pricing pages for each named rival and rebuild the competitor
      profile table from current evidence.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-multi-homing
    missingEvidence: >-
      Observed churn, salary-switch, payroll, primary-account, or multi-homing data for Tyme or GoTyme customers versus
      other banks.
    whyItMatters: >-
      Rebrand migration continuity suggests low immediate friction, but moat durability depends on whether customers
      stay primary with Tyme or use multiple banks.
    diligencePath: >-
      Request internal cohort retention and primary-account-share data by segment, especially after the GoTyme app
      migration.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-group-financials
    missingEvidence: >-
      Consolidated Tyme Group audited FY2024-FY2026 income statement, balance sheet, and cash flow with segment detail
      for South Africa and international operations.
    whyItMatters: >-
      Public bank-level and marketing disclosures do not show whether group expansion is self-funding, profitable, or
      supported by continuing equity injections.
    diligencePath: >-
      Request the latest board pack or audited group accounts with segment revenue, gross profit, opex, and cash-runway
      disclosure.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: customer-acquisition-economics
    missingEvidence: CAC, payback period, retention, churn, LTV, and activation or funded-account conversion by channel and segment.
    whyItMatters: Customer-count growth and quick onboarding do not prove attractive acquisition economics or durable cohorts.
    diligencePath: >-
      Request cohort tables by origination channel with CAC, activation, retention, product attach, and contribution
      margin.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized fee yield, interchange, deposit cost of funds, product pricing waterfall, and product-level revenue mix.
    whyItMatters: >-
      Public list-offer and feature disclosures do not reveal the actual unit economics of the low-fee banking
      proposition.
    diligencePath: >-
      Request current fee cards, deposit repricing policy, and a product-level revenue bridge tying pricing to realized
      income.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: stale
    severity: material
    topic: capital-runway
    missingEvidence: >-
      Post-31-October-2024 funding facilities, cash runway, covenant headroom, and any next-round or bridge financing
      commitments.
    whyItMatters: >-
      The clearest public capital-risk statement is anchored in FY2023 accounts and may not reflect the current
      financing position.
    diligencePath: Obtain the latest treasury pack, facility documents, and any signed shareholder support or term-sheet materials.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner signal showing integration depth, release cadence, or external ecosystem usage
      of TymeBank's platform.
    whyItMatters: >-
      Without an external developer, API, or practitioner surface, investors cannot test whether the open-service
      architecture translates into durable integration velocity or ecosystem lock-in.
    diligencePath: >-
      Request API docs, partner integration lists with go-live counts, release notes, changelog history, and any public
      or private developer-community telemetry.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Independent evidence of app uptime, security certifications, penetration-test outcomes, or incident history for
      the current GoTyme platform.
    whyItMatters: >-
      The public record supports security messaging and control intent, but not measured reliability or third-party
      assurance during a visible product migration.
    diligencePath: >-
      Request SOC 2 or ISO 27001 status, recent penetration-test summary, incident log, status-page history, and SRE
      uptime reporting.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: vendor-architecture
    missingEvidence: >-
      A named architecture map showing core-banking, identity, payments, fraud, and decisioning vendors versus
      internally owned modules.
    whyItMatters: >-
      Vendor concentration, migration complexity, and substitution risk cannot be underwritten from generic
      cloud/open-service language alone.
    diligencePath: >-
      Ask management for an architecture deck naming vendors, failover design, data ownership boundaries, and
      build-versus-buy decisions by major service.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Customer-retention metrics such as churn, renewal, GRR, NRR, and cohort behavior by segment.
    whyItMatters: Without retention data, customer growth could still mask weak durability or expensive reacquisition.
    diligencePath: >-
      Request cohort retention dashboards, account-tenure curves, renewal statistics, and segment-level activity data
      from management.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer, top-depositor, and segment revenue concentration schedules for retail, SME, and partner-driven
      cohorts.
    whyItMatters: >-
      Expansion and partner dependence cannot be scored cleanly without knowing whether value is broadly distributed or
      concentrated.
    diligencePath: >-
      Request depositor concentration, product-mix revenue, and partner-channel concentration schedules for the latest
      12 months.
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof
    missingEvidence: >-
      A fuller current set of named customer references or cohort-level proof beyond vendor case studies and channel
      descriptions.
    whyItMatters: >-
      The chapter can verify customer channels and support load, but not a broad roster of current reference customers
      or cohorts.
    diligencePath: >-
      Request recent reference customers, merchant cohort summaries, and current production case studies covering
      different customer segments.
    relatedTableRefs:
      - TU003
  - type: stale
    severity: material
    topic: current-financial-disclosure
    missingEvidence: >-
