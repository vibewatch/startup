companyProfile:
  summary: >-
    TymeBank is a South African digital retail bank inside Tyme Group that pairs app-led onboarding with physical
    kiosks, retail partnerships, and other distribution channels. The public record supports a business that launched in
    2019, scaled to more than 12 million South African customers by 2026, reached first monthly profitability in
    December 2023, and rebranded its consumer-facing materials to GoTyme Bank without changing the underlying South
    African licence.
  headquarters: Johannesburg, South Africa
  productSummary: >-
    Digital transactional banking, savings, and adjacent lending and merchant-finance products delivered through app and
    hybrid physical channels.
  customerFocus: Mass-market South African consumers and SMEs
  businessModel: Deposit-led retail banking supplemented by lending, merchant finance, and adjacent financial products
  stage: late-stage private
  fundingStatus: >-
