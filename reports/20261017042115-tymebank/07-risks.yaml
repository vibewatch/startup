        - Credit growth and balance-sheet returns
        - AFS says most credit risk arises here
        - Credit deterioration or liquidity stress forces tighter underwriting or fresh capital
        - High
        - Board-level risk governance in audited filing
        - Medium-High
    notes: This register mixes direct counterparties with structural operating dependencies because the assigned pool lacks a current public vendor, concentration, or capital-commitment schedule.
