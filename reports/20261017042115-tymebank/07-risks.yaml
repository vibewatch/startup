  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / system
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Identity and verification rails
        - Home Affairs HANIS, credit bureaux, employer and bank data checks
        - Customer onboarding and fraud screening
        - Structural dependence at account opening
        - Verification outages or bad data delay onboarding or lock legitimate users out
        - High
        - Explicit KYC controls and document requests
        - Medium-High
      - - Group technology and kiosk operations
        - Tyme Global IT and kiosk management providers
