company:
  name: TymeBank
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest near-term risk is execution rather than franchise legality: GoTyme's 2026
    rebrand and app migration preserved the South African licence, but the bank itself said the
    rollout had to be phased for security and stability while the current public financial evidence
    still lags at a 2023 audited local-bank view. That leaves residual exposure concentrated in
    migration continuity, external onboarding dependencies, SME credit/liquidity management, and
    limited up-to-date disclosure on post-rebrand incidents and current capital resilience.
sections:
  - id: ranked-risk-snapshot
    title: Ranked risk snapshot
    body: >-
      The strongest evidence does not point to an immediate licence-reset risk from the
      TymeBank-to-GoTyme transition: official and independent sources consistently say the bank
      kept the same South African licence and regulatory oversight. The bigger near-term issue is
      execution. GoTyme launched a new app on 22 January 2026 and described the migration as
      phased to protect security, stability, and customer experience, which is reassuring but also
      confirms a live operational change program touching customer accounts, mobile access, cards,
      kiosks, and support. Public current-state transparency is thinner on the financial side. The
      newest audited bank filing in the assigned pool is for June 2023, so investors can see the
      risk categories, operating-loss disclosures, and dependency structure, but not refreshed
      2026 credit-loss, capital, liquidity, or post-migration complaint metrics. The practical
      ranking is therefore: 1) migration and service continuity, 2) external dependency and
      onboarding fragility, 3) balance-sheet and SME credit exposure with stale public reporting,
      and 4) conduct risk if complaint volumes rise faster than support capacity.
    claimRefs: [CR001, CR002, CR003, CR008, CR009, CR010, CR011, CR014, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-and-legal-risk
    title: Regulatory and legal risk
    body: >-
      Regulatory continuity looks stronger than many execution risks, but it is not zero-risk.
      The current terms and official rebrand materials state that the bank remained licensed and
      regulated in South Africa after the rename, so the core legal entity appears intact. The
      same terms also show how much of the control framework depends on identity and compliance
      infrastructure outside the bank's sole control: onboarding relies on Home Affairs biometric
      data, credit bureaux, and additional AML documentation, and the bank reserves the right to
      refuse or close accounts when checks fail or suspected illegal use arises. That is
      operationally rational, but it creates customer-friction and conduct risk if external data
      feeds misfire at scale. Complaint escalation channels are at least explicit: unresolved
      disputes can be taken to NFOSA, the FSCA, and the National Consumer Tribunal after 20 days,
      which provides a mitigation path for customers and a monitorable signal for investors.
    claimRefs: [CR001, CR004, CR005, CR007, CR015]
    tableRefs: [TR001]
  - id: operational-platform-risk
    title: Operational, quality, and security risk
    body: >-
      The operational risk profile is heavier than the legal-risk profile because the rebrand is a
      multi-surface migration, not just a logo change. Official and independent coverage say the
      new GoTyme app went live in January 2026, all balances and transaction histories were
      migrated, and the rollout was deliberately phased. That reduces hard-cutover risk, but it
      also implies a prolonged period where app updates, authentication, retail touchpoints, and
      support queues must all work together. The contract language is notable here: GoTyme warns
      that service interruptions can follow power, system, or network failures and disclaims
      liability for interruptions beyond reasonable control. Historical bank filings reinforce that
      the operating model has meaningful technology and kiosk dependencies, including outsourced IT
      and kiosk-management costs, prior impairment on unsuitable kiosk components, and separately
      disclosed fraud and operational risk losses. Bizcommunity's supplied release says the bank
      has expanded customer-care capacity, which is a useful mitigation, but investors should
      treat repeated migration incidents, login failures, or rising ombud complaints as
      thesis-break indicators rather than temporary noise.
    claimRefs: [CR002, CR003, CR006, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR002]
  - id: dependency-and-balance-sheet-risk
    title: Dependency, credit, and balance-sheet risk
    body: >-
      The assigned pool supports a cautious read on financial-model risk rather than a clean
      all-clear. The latest available audited local-bank financials identify credit risk, liquidity
      risk, market/currency risk, and interest-rate repricing risk as core exposures, and say most
      credit risk comes from SME advances, interbank placements, and government-securities
      investments. That matters because Tyme's hybrid bank-plus-merchant-finance model pushes
      execution risk beyond vanilla consumer deposits. Public commentary also highlights disclosure
      limits: one review explicitly notes that detailed revenue, profitability, and growth figures
      still need support from financial reports. Until the market gets refreshed audited bank or
      group statements, the sensible diligence stance is to monitor deposit stability, impairment
      trends, SME-credit performance, and dependence on Tyme Global technology plus retail
      distribution partners. A reasonable kill criterion would be any combination of worsening
      service continuity, adverse regulator escalation, or new financial disclosures showing credit
      deterioration without matching capital support.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR014]
    tableRefs: [TR003]
