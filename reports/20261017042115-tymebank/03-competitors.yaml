          detail: "App plus retail kiosks and partner cash access; savings, SME finance, and broader product roadmap appear in cited sources."
        - label: "Discovery Bank"
          x: 2
          y: 4
          detail: "Historical case-study snapshot describes a mobile-led, full retail offering, but current 2026 packaging is not in the assigned pool."
        - label: "African Bank"
          x: 3
          y: 2
          detail: "Historical case-study snapshot records a no-monthly-fees account, but current breadth is not documented here."
        - label: "Bank Zero"
          x: 1
          y: 1
          detail: "Historical snapshot positions Bank Zero as an app-only mutual-bank entrant; current scale and pricing are undocumented in the assigned pool."
        - label: "Capitec lending incumbent"
          x: 4
          y: 5
          detail: "Tech In Africa names Capitec as the incumbent in unsecured lending, implying stronger credit breadth than the current GoTyme lending evidence set."
        - label: "Low-fee branch incumbents"
          x: 5
          y: 3
          detail: "Historical case-study evidence shows incumbents reacting on price, but the assigned current pool does not preserve equivalent 2026 feature sheets."
    approximationNotes: "Ordinal scores synthesize only the retained public evidence; they are not market-share, NPS, or profit measurements, and sparse current rival pricing caps precision."
    claimRefs: ["CP007", "CP009", "CP010", "CP012", "CP015"]
callouts:
  - calloutType: "strength"
    title: "Distribution moat is about access, not secrecy"
    body: "The strongest support in this pool is that GoTyme's hybrid kiosk-plus-app model and retail partners create physical onboarding and cash access advantages that pure app challengers do not obviously match in the retained evidence."
    claimRefs: ["CP003", "CP007"]
  - calloutType: "risk"
    title: "Incumbents can answer on price faster than this pool proves on depth"
    body: "Historical evidence already shows fee pressure and challenger launches, while current evidence points to Capitec-led lending depth; without live rival price sheets, moat claims beyond access and cost should stay conservative."
    claimRefs: ["CP010", "CP011", "CP012", "CP015"]
