company:
  name: "TymeBank"
chapter:
  number: 3
  title: "Competitors"
  summary: "The strongest evidence in the assigned pool says TymeBank's South African business, now branded GoTyme Bank, still competes primarily through a branchless hybrid of app, kiosks, and retail partners rather than a unique product monopoly. Public evidence does show live pressure from incumbents and challengers, but the retained competitor set is materially thinner on current rival pricing and product detail than it is on Tyme's own positioning, so moat claims should stay medium-confidence."
sections:
  - id: "landscape-and-reference-set"
    title: "Landscape: named rivals are visible, but the current pool is asymmetric"
    body: |-
      The assigned pool supports a credible competitor map, but not a fully refreshed peer census on a like-for-like basis. Current public comparison coverage explicitly names Capitec Bank, Discovery Bank, and Bank Zero around GoTyme Bank's rebrand, while the historical 2019 case-study snapshot shows that TymeBank was already dealing with incumbent price responses, African Bank's no-fee push, Discovery Bank's launch, and Bank Zero's app-only entry. That matters because the competitive problem is not new: low-fee incumbent responses and digitally led challengers have been part of Tyme's market context from the start. What is missing is a comparably current, independently sourced package of 2026 product, pricing, and customer-scale data for each named rival, so the chapter can map the field with confidence but must mark many rival cells as unknown rather than imply parity or superiority that the pool does not prove.
    claimRefs: ["CP009", "CP010", "CP011", "CP015"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "distribution-and-access"
    title: "Distribution and access remain the clearest differentiator"
    body: |-
      The clearest differentiator in the retained evidence is not a secret feature set; it is distribution design. Current company-controlled and independent coverage consistently describes GoTyme as a branchless hybrid that pairs an app with kiosks, retail-partner cash access, and fast in-store onboarding. Tech In Africa and the re-disseminated TymeBank release both tie growth to the retail-partner footprint, kiosk model, and low-cost acquisition logic, while the official rebrand page still presents zero monthly fees, under-five-minute onboarding, free instant payments, and strong savings positioning as the mass-market value proposition. In practice, that means GoTyme's edge is easiest to defend where a buyer values convenient onboarding, cash-in and cash-out access, and embedded retail reach more than a full-service branch network.
    claimRefs: ["CP003", "CP004", "CP007", "CP008"]
    tableRefs: ["TP002"]
  - id: "scope-switching-and-incumbent-response"
    title: "Scope expansion helps, but switching-cost evidence is thin and incumbent response is real"
    body: |-
      Public evidence shows Tyme has tried to broaden the competitive frame beyond a basic zero-fee transaction account. The 2023 annual financial statements say Retail Capital was integrated to strengthen business banking and turnover-based SME lending, and Tech In Africa says Tyme's next push includes unsecured lending through a Sanlam joint venture in a market it describes as dominated by Capitec. That broadens product scope, but it also puts Tyme into a more contested lending arena rather than a protected niche. On the customer side, current rebrand coverage says existing users keep the same accounts, balances, and history and simply move to the new app, which lowers immediate migration friction during the brand change. Even so, the pool does not provide churn, salary-switch, or multi-homing evidence, so moat durability still looks more like partner access and cost structure than proven switching lock-in.
    claimRefs: ["CP001", "CP006", "CP012", "CP014"]
    tableRefs: ["TP003"]
  - id: "judgment-on-durability"
    title: "Durability is credible on access and cost, but not yet proven on full rival comparability"
    body: |-
      The retained sources support a specific competitive judgment: GoTyme looks strongest where retail access, onboarding speed, and low operating cost matter, and weaker where the decision depends on a fully comparable read of rival packaging, credit breadth, or incumbent ability to match price. IdeaToola's benchmark-style page points in Tyme's favor on customer scale and efficiency, but it does not expose the primary documents inline, so it is useful as a directional benchmark rather than a definitive scorecard. Meanwhile, the current pool still lacks live, directly comparable price sheets and product disclosures for several named rivals. The result is a chapter that can credibly argue for a distribution-led moat and real incumbent-response risk, while still labeling current peer-pricing precision as a diligence gap rather than a solved question.
    claimRefs: ["CP013", "CP015"]
