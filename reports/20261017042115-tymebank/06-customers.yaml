company:
  name: "TymeBank"
chapter:
  number: 6
  title: "Customers"
  summary: "TymeBank has credible public evidence of mass-market adoption in South Africa: the bank says it has served more than 12 million local customers, historical filings show 7.5 million customers and over R4 billion of retail deposits by mid-2023, and partner case studies show production-scale service and lending workflows. The evidence is much weaker on durability and concentration: public sources show acquisition velocity, channel reach, and support throughput, but do not disclose churn, renewal, NRR/GRR, or top-customer concentration metrics."
sections:
  - id: "segmentation-access"
    title: "Mass-market retail distribution remains the core customer engine"
    body: >
      TymeBank’s clearest customer proof is still its South African retail base, acquired through a branchless model that combines the app with kiosks and retail-partner access points rather than traditional branches. The current official rebrand notice says the South African bank has grown to more than 12 million customers and still serves them through the GoTyme app, service kiosks, and retail partners, while older customer evidence shows how much of that acquisition engine historically depended on kiosk-led onboarding. The result is a customer model aimed at broad, price-sensitive consumer adoption rather than high-touch affluent banking, with extension paths into assisted service, consumer credit, and small-business lending.
    claimRefs: [CU001, CU002, CU010, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "adoption-trajectory"
    title: "Adoption trajectory shows scale-up, but mostly through top-line customer counts"
    body: >
      The retained sources support a clear growth arc even though they do not provide a clean cohort view. African Rainbow Capital said TymeBank reached 3.5 million customers by the end of July 2021; a 2023 annual financial statement said the bank had attracted about 7.5 million customers and more than R4 billion in retail deposits; and the 2026 rebrand announcement says the South African bank serves more than 12 million customers. Historical secondary evidence also points to strong onboarding velocity in 2022, but these public data points are mostly headline customer totals rather than active-user, revenue-per-customer, or retention measures, so they prove reach more clearly than they prove customer quality.
    claimRefs: [CU001, CU008, CU011, CU014]
    tableRefs: [TU002]
  - id: "named-proof-durability"
    title: "Named proof is strongest around servicing and channel usage, not retention"
    body: >
      Public customer proof is real, but it is uneven. The 2026 migration evidence shows TymeBank moved existing customers into the new GoTyme app without reopening accounts, while Genesys says the contact center now handles 160,000 calls a month with customer satisfaction around 90%. GDS Link’s lending case study adds proof that the bank was already operating at production lending scale when it needed better real-time decisioning. What is missing is the durability layer: the retained sources do not disclose churn, renewal, or cohort retention metrics, so the chapter can verify operational use and support intensity, but not whether the acquired customer base compounds with strong retention economics.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU015]
    tableRefs: [TU003]
  - id: "expansion-and-concentration"
    title: "Expansion is visible into SMEs and the Philippines, while concentration remains opaque"
    body: >
      TymeBank is no longer just a South African retail acquisition story. The 2023 filing says Retail Capital was integrated to serve a broader customer base and expand services to underserved small businesses, while the 2021 African Rainbow Capital update says the South African model was being exported into GOtyme in the Philippines through retail-network onboarding and a companion app. That supports a land-and-expand narrative across adjacent segments and geographies. However, public materials still do not disclose customer concentration, deposit concentration, or segment revenue mix, so expansion quality can only be judged directionally and procurement or concentration risks remain underexplained.
    claimRefs: [CU010, CU012, CU016]
callouts:
  - calloutType: "strength"
    title: "Acquisition proof is stronger than most private-bank disclosures"
    body: "The public evidence triangulates TymeBank’s customer scale from 3.5 million in July 2021 to roughly 7.5 million by mid-2023 and more than 12 million by February 2026, while partner case studies show real support and onboarding load instead of logo-only marketing."
    claimRefs: [CU001, CU005, CU008, CU011]
  - calloutType: "risk"
    title: "Durability remains underdisclosed"
    body: "Public evidence supports customer acquisition, service throughput, and channel reach, but not retention economics or concentration; without churn, renewal, NRR/GRR, or top-customer disclosures, expansion quality cannot be scored confidently."
    claimRefs: [CU015, CU016]
