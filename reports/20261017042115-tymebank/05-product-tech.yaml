callouts:
  - calloutType: "strength"
    title: "Hybrid distribution is the real product moat"
    body: "The strongest product evidence is not app polish alone but the combination of digital servicing with retailer-based onboarding and cash access. That makes TymeBank's operating model harder to imitate than a generic mobile-only interface."
    claimRefs: ["CE001", "CE003", "CE004"]
  - calloutType: "risk"
    title: "Migration discipline is visible; third-party assurance is not"
    body: "Management and press sources consistently describe a phased 2026 app migration with security and stability priorities, but the assigned pool does not independently verify uptime, certifications, or incident performance."
    claimRefs: ["CE008", "CE010", "CE013", "CE014"]
