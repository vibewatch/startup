company:
  name: "TymeBank"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "TymeBank is not a pure-app neobank: the strongest evidence shows a bank account, savings, and lending stack delivered through a hybrid app-plus-kiosk operating model. The public record supports a flexible cloud/open-service architecture and a carefully phased 2026 GoTyme app migration, but it does not independently verify uptime, certifications, or a meaningful developer ecosystem."
sections:
  - id: "distribution-and-workflow"
    title: "Distribution model and customer workflow"
    body: |-
      TymeBank's product is best understood as a digitally managed retail bank with a physical acquisition and service layer, not as a standalone mobile app. The FY2025 annual financial statements describe digital banking services centered on financial inclusion and affordable products, then tie that proposition to a large retailer-linked distribution estate where customers can open accounts quickly and access cash-out points nationwide. Company-controlled materials and independent coverage are directionally consistent: the GoTyme app is the everyday interaction surface, but kiosks, retail partners, and agent points remain core to customer acquisition, onboarding, and cash movement. That hybrid workflow is the chapter's clearest product proof because it shows what the user actually does, how TymeBank lowers acquisition friction, and why the model is difficult for branch-heavy incumbents to copy without redesigning their channel economics.
    claimRefs: ["CE001", "CE004", "CE008", "CE009", "CE011"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "architecture-and-product-scope"
    title: "Architecture, product scope, and expansion paths"
    body: |-
      Public technical evidence is thin on named vendors, internal services, and API surfaces, but the retained sources still establish the broad operating model. TymeBank describes a secure cloud-based infrastructure and an open-service architecture that supports partner integrations and incremental product launches, while the audited statements show monetized transactional banking, savings balances, and a business-lending book anchored by Merchant Cash Advance. Partner and press sources add the next layer of maturity evidence: a real-time lending decisioning platform, a 2026 app migration program, and adjacent product expansion into unsecured personal loans and government identity-service pilots. The result is a product stack that is broader than low-fee deposits alone, yet still dependent on external partners for distribution, lending adjacencies, and some implementation velocity.
    claimRefs: ["CE002", "CE003", "CE005", "CE006", "CE007", "CE012"]
    tableRefs: ["TE003"]
  - id: "controls-risks-and-diligence-gaps"
    title: "Controls, migration risk, and unresolved diligence items"
    body: |-
      The control story is credible but incomplete. The FY2025 annual financial statements say TymeBank manages operating risk through infrastructure, controls, systems, and a formal compliance framework, while the rebrand rollout messaging repeatedly emphasizes phased migration, security, and platform stability. That combination supports a view that management is actively treating operational risk during a visible product transition. What remains missing is third-party assurance: none of the assigned sources provide a status page, uptime history, app-security certification, independent architecture benchmark, or public developer telemetry that would let an investor test whether the bank's open-service narrative translates into measured reliability. The underwriting conclusion is therefore positive on product-market operating fit, but still conditional on private technical diligence before underwriting execution risk as low.
    claimRefs: ["CE008", "CE010", "CE013", "CE014"]
tables:
