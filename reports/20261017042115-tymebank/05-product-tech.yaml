      - ["Retail kiosks and agent onboarding network", "New-to-bank customer needing assisted onboarding", "Core and scaled", "Five-minute account opening and live card issuance through retailer footprint lowers branch dependence", "Need kiosk economics, conversion by partner, and failure/drop-off rates."]
      - ["Savings and term-deposit products", "Deposit customer", "Established", "Supports low-cost funding and gives the app a savings-led engagement loop", "Need current mix by product, churn, and rate sensitivity."]
      - ["Credit stack: personal loans, Merchant Cash Advance, MoreTyme", "Consumers and SMEs", "Expanded but still developing", "Moves TymeBank beyond deposits into higher-yield lending and embedded credit adjacencies", "Need credit-loss, approval-rate, and unit-economics disclosure by product."]
      - ["Identity-services / public-sector kiosk pilot", "Citizens using Home Affairs services", "Pilot", "Reuses the physical footprint for a non-bank service that could deepen kiosk relevance", "Need pilot KPI, regulatory economics, and rollout criteria."]
    notes: "Rows combine disclosed current products with adjacent pilots; maturity reflects public evidence only, not internal rollout completeness."
    claimRefs: ["CE001", "CE004", "CE005", "CE006", "CE011", "CE012"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Company solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Open an account quickly", "Visit partner kiosk or app-led onboarding flow", "Retail kiosk onboarding with live debit card issuance and app continuity", "Public sources say accounts can be opened in under five minutes", "No public funnel for started-to-funded conversion or fraud fallout."]
      - ["Save and hold deposits", "Use transactional, savings, and term-deposit products", "GoalSave / savings balances alongside low-cost banking products", "AFS shows deposit growth and separate transactional, savings, and term-deposit balances", "No public cohort retention or wallet-share data."]
      - ["Spend, send money, and manage balances", "Use the migrated GoTyme app after January 2026 rollout", "App migration with improved performance, stronger security features, and ongoing payments/savings enhancements", "No new account needed; customer balances and history were migrated", "No third-party uptime or app-store quality evidence in the assigned pool."]
      - ["Access credit", "Apply online or via partner-assisted journey", "Personal loans, Merchant Cash Advance, and MoreTyme adjacency", "Real-time decisioning partner case study and AFS both point to scaled credit workflows", "No public approval-rate, loss-rate, or pricing segmentation disclosure."]
      - ["Use kiosk footprint for adjacent services", "Leverage existing physical footprint instead of branches", "Smart ID and passport services pilot through in-store kiosks", "Extends kiosk utility beyond banking without adding branch infrastructure", "Pilot economics and customer take-up are not public."]
    notes: "Benefits are limited to publicly stated speed, continuity, or product availability; unsupported conversion or satisfaction metrics are intentionally omitted."
    claimRefs: ["CE001", "CE002", "CE004", "CE008", "CE009", "CE011"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Cloud/open-service core", "Runs the branchless bank and supports partner collaboration plus product expansion", "Internal engineering plus unnamed platform vendors", "Public evidence does not name core-banking or payments vendors, so concentration and migration risk are opaque."]
      - ["Retail partner and cash network", "Supports account opening, card issuance, and cash-in/cash-out access", "Pick n Pay, Boxer, and broader retailer relationships", "Operational dependence on partner locations and shared-service quality."]
      - ["GoTyme app migration program", "Moves customers into the rebranded mobile experience", "Mobile release process, identity/account migration, customer support", "Visible transition risk if phased rollout or security hardening underperforms."]
      - ["Lending decisioning stack", "Improves underwriting accuracy and onboarding for unsecured credit", "GDS Link data-access and decisioning workflow", "Third-party dependency in a higher-risk product category."]
      - ["Risk/compliance control layer", "Maintains regulatory compliance and operational-control discipline", "Board, audit/compliance oversight, internal control processes", "No public certification, status-page, or incident-history evidence to independently test control effectiveness."]
    notes: "This is an operating-architecture synthesis from public sources, not a vendor-complete system diagram."
    claimRefs: ["CE003", "CE007", "CE008", "CE010", "CE013", "CE014"]
