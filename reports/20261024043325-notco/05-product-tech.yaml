      - [Food knowledge base, "Represent ingredients, chemistry, formulations, sensory results, and processes", "NotCo and partner datasets", "Coverage, licensing, calibration, and transferability"]
      - [Formulation optimization, "Generate and rank candidate recipes under multiple constraints", "Model assumptions and constraint definitions", "Versioning, explainability, accuracy, and reproducibility"]
      - [Physical validation, "Test taste, texture, function, processing, and feasibility", "Chefs, food scientists, laboratories, and panels", "Throughput, sample design, traceability, and pass criteria"]
      - [Commercialization and feedback, "Manufacture, label, distribute, and learn from market response", "Partners, regulators, retailers, and consumers", "Quality systems, recalls, support, compliance, and feedback latency"]
