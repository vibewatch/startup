    title: Giuseppe product-development architecture
    type: stack
    summary: Public evidence describes a layered, human-in-the-loop workflow from product signals through formulation, validation, and commercialization.
    data:
      layers:
        - label: Product intent
          detail: "Consumer need, brand identity, sensory target, nutrition, cost, and regulatory constraints."
          items:
            - name: Market and consumer signals
              detail: "White-space hypotheses and desired product experience."
            - name: Enterprise brief
              detail: "Category, cost, availability, nutrition, and scalability requirements."
        - label: Food data
          detail: "Ingredient chemistry, prior formulations, sensory readouts, and manufacturing parameters."
          items:
            - name: Ingredient knowledge
              detail: "Plant ingredients and measured food properties."
            - name: Experimental history
              detail: "Formulation and sensory results accumulated through physical testing."
        - label: Giuseppe
          detail: "Models search combinations and propose candidate formulations under the defined constraints."
          items:
            - name: Candidate generation
              detail: "Ingredient and process combinations are proposed for target properties."
            - name: Constraint balancing
              detail: "Taste, texture, cost, availability, nutrition, regulation, and scale are considered together."
        - label: Human validation
          detail: "Food scientists, chefs, and sensory panels test and refine candidate outputs."
          items:
            - name: Wet-lab iteration
              detail: "Physical trials reveal interactions not established by model output alone."
            - name: Sensory evaluation
              detail: "Human feedback determines whether target experience is reproduced."
        - label: Manufacturing and compliance
          detail: "Process feasibility, supply, quality, labeling, and regulatory review gate commercialization."
          items:
            - name: Scale-up
              detail: "Partner or NotCo manufacturing converts a validated formula into production."
            - name: Product controls
              detail: "Quality and labeling requirements remain jurisdiction- and product-specific."
        - label: Commercial output and feedback
          detail: "Branded products or enterprise partner programs reach the market and create new observations."
          items:
            - name: Branded products
              detail: "Retail and foodservice offerings provide operating feedback."
            - name: Partner programs
              detail: "Enterprise projects combine NotCo's workflow with partner data and capabilities."
    approximationNotes: "The layer sequence is an analytical synthesis; public sources do not disclose a verified production architecture or complete data flow."
    claimRefs: [CE002, CE005, CE010, CE011, CE014]
