          detail: "Concept, formulation, reformulation, licensing or project economics are not publicly priced."
        - id: cpg
          label: "Branded CPG products"
          detail: "Plant-based SKUs sold through retail, foodservice, D2C, and marketplaces."
        - id: channels
          label: "Partner and retail channels"
