company:
  name: NotCo
chapter:
  number: 4
  title: Financials
  summary: NotCo has a two-engine model combining branded plant-based CPG with an increasingly emphasized B2B product-development platform. Public evidence supports historic funding, retail presence, and a stated profitability path, but does not disclose current revenue, margins, cash, burn, runway, or realized B2B pricing well enough for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and commercial monetization
    body: NotCo's monetization is split between branded CPG products sold through retail, foodservice, direct-to-consumer, and partner channels, and B2B product-development work built around the Giuseppe platform. The strongest current operating evidence is management's description that B2B growth is moving the P&L closer to a technology company while branded CPG remains strategically useful for testing the technology. The B2B offer is not yet described with a public price card, contract term, recurring-revenue definition, customer cohort, or realized gross margin. Official and retailer pages demonstrate sellable products and channel availability, but list prices and shelf presence are not revenue, ARR, or proof of repeat purchase. That distinction is material because the business mix could change the quality and predictability of revenue without changing the product narrative.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: operating-economics
    title: Cost structure and unit-economics visibility
    body: The economics appear structurally different across the two engines. Branded CPG carries formulation, ingredients, manufacturing, inventory, trade promotion, distribution, and working-capital exposure; B2B product development may have software-like contribution economics but still depends on food-science labor, partner data, testing, formulation, and commercialization. Management explicitly says project work is constrained by gross margin, and the CEO described layoffs, SKU delisting, and closure of the New York office as hard decisions. Public sources do not provide CAC, payback, gross margin, contribution margin, utilization, cash conversion, inventory turns, or customer concentration. The absence of those figures is an underwriting gap, not evidence that the economics are weak or strong.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      NotCo has demonstrated access to substantial private capital, including a reported $235 million Series D in 2021 at a $1.5 billion valuation and more than $350 million raised by that report, while a later company release described a $70 million Series D1 in December of the prior year. These figures are historical financing events, not cash available today. The most decision-useful current signal is management's stated path toward profitability: mature Latin American operations were expected to reach profitability in Q2 2025, while the group was described as on course for profitability in 2027 or potentially closer to the end of 2026. That forecast is company-reported and has not been reconciled to current cash, burn, debt, or audited accounts. Financial underwriting should therefore remain conditional on a current cash bridge, segment P&L, financing terms, and evidence that B2B contracts convert into durable, high-quality revenue.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: diligence-blockers
    title: Diligence blockers and underwriting implications
    body: Public evidence is sufficient to map the commercial mechanism but insufficient to calculate a valuation or a reliable runway. The evidence does not disclose current recognized revenue, ARR, realized pricing, gross margin, operating burn, cash balance, debt obligations, renewal rates, or customer concentration. Retailer pages show a $2.34 Walmart price and a $2.99 Target price for one Kraft NotCo 6-ounce product, but those are observed channel prices for a product SKU rather than NotCo net revenue; retailer disclaimers also state that product information may be supplied by manufacturers and may not be complete. The principal conclusion is not that NotCo lacks traction, but that the financial case is opaque and should be treated as a track/research-more situation until management supplies current segment economics and capital needs.
    claimRefs: [CI014, CI015, CI016]
