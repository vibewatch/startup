        - id: revenue
          label: "Recognized revenue and gross profit"
          detail: "Current revenue mix, realized price, gross margin, and cash conversion are unavailable."
        - id: profitability
          label: "Profitability target"
          detail: "Management has described targets for mature countries and the group, but actual results are not public."
      edges:
        - [inputs, b2b]
        - [inputs, cpg]
        - [b2b, channels]
        - [cpg, channels]
        - [channels, revenue]
        - [revenue, profitability]
    claimRefs: [CI001, CI002, CI003, CI005, CI007]
callouts:
  - calloutType: risk
    title: Financial underwriting remains data-constrained
    body: Current cash, burn, runway, debt, realized B2B pricing, revenue mix, and gross margin are not disclosed in the assigned public evidence. Historic funding and retailer prices should not be used as substitutes for those inputs.
    claimRefs: [CI009, CI012, CI014, CI016]
  - calloutType: insight
    title: The strategic pivot changes the economic question
    body: NotCo is positioning B2B Giuseppe work as a faster-growing, more technology-like engine while retaining branded CPG as a testing and commercialization vehicle. Underwriting therefore depends on contract durability and contribution economics, not only shelf presence.
    claimRefs: [CI002, CI003, CI005, CI007]
