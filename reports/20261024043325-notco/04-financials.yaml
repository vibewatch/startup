      - [Kraft NotCo mac and cheese Target price, "$2.99 for one 6-ounce box", "Medium; retailer listing observed 2026-10-24", "Provides a second channel price point but not realized unit economics", "Reconcile channel pricing, promotions, geographic differences, and net realization"]
      - [B2B contract price / recurring revenue, null, "Unavailable", "Determines whether the technology narrative produces repeatable, software-like economics", "Provide representative contracts, pricing metric, renewal terms, implementation fees, and cohort retention"]
      - [Gross margin, null, "Unavailable", "Management says gross margin is the number-one constraint on projects", "Provide consolidated and segment gross margin bridge by product, partner, geography, and period"]
    notes: "Retail prices are observed list or transaction-facing prices and must not be substituted for realized revenue, ARR, gross profit, or cash contribution. Null means no public value was located in the assigned evidence."
    claimRefs: [CI005, CI006, CI007, CI014, CI015]
  - id: TI003
    title: Capital adequacy and financing dependency
    columns: [Input, Public evidence, Status, Underwriting implication, Diligence ask]
    rows:
      - [Historic Series D, "$235M raised in 2021 at $1.5B valuation", "Reported", "Confirms access to capital at that historical date; does not show current cash", "Obtain updated cap table, preferred terms, dilution, and post-round cash balance"]
      - [Additional Series D1, "$70M described by NotCo in a 2023 B Corp release", "Company-reported", "Indicates additional financing but not cumulative cash available", "Reconcile close date, instrument, proceeds, fees, and use of funds"]
      - [Profitability trajectory, "Q2 2025 mature-country target; group potentially end-2026 or 2027", "Management forecast reported in 2025", "Potentially reduces financing dependency if achieved, but outcome is unverified here", "Provide actual monthly P&L, bridge to profitability, and variance to forecast"]
      - ["Cash, burn, runway, debt", null, "Unavailable", "These determine near-term solvency and next-round trigger", "Provide 24-month cash flow, debt schedule, covenants, runway case, and financing plan"]
    notes: "Funding raised, valuation, profitability forecasts, and cash available are distinct quantities. Historical rounds and management targets do not establish current liquidity or runway."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI016]
