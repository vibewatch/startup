evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and executive succession responsibilities.
    whyItMatters: Founder concentration and governance depth affect execution resilience and control risk during the B2B pivot.
    diligencePath: >-
      Request the current board register, cap-table governance rights, and executive organization chart from management
      or counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled financing schedule covering Forbes' reported total above $425M and each round or extension.
    whyItMatters: Different totals can reflect timing or instruments, but they change ownership and dilution analysis.
    diligencePath: Obtain financing agreements, a capitalization table, and investor-side confirmation of each round and extension.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: Audited revenue, gross margin, cash burn, runway, customer concentration, and current headcount.
    whyItMatters: The $75M revenue figure is estimated and the business mix is changing from CPG to B2B.
    diligencePath: Request monthly financial statements and segment KPIs for branded CPG, joint ventures, and Giuseppe licensing.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: Final disposition and current commercial impact of the Chilean NotMilk trademark litigation.
    whyItMatters: The dispute illustrates naming and regulatory exposure across a multi-country food portfolio.
    diligencePath: Review the court judgment, appeal status, and current packaging and trademark registrations by market.
    relatedQuestionRefs:
      - QO007
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: A current arm's-length valuation or secondary transaction price after the 2021-2022 $1.5B marks.
    whyItMatters: The historical unicorn valuation should not be used as current fair value without a new price signal.
    diligencePath: Obtain the latest priced round, secondary transfers, or board-approved valuation and preference stack.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: b2b-gaps
    missingEvidence: NotCo's B2B target-account universe, pricing, bookings, win rates, renewals, and customer concentration.
    whyItMatters: >-
      Without these denominators, the B2B serviceable market and valuation contribution cannot be separated from the
      broader plant-based category.
    diligencePath: >-
      Request a segmented pipeline and cohort schedule covering target accounts, contract value, implementation scope,
      renewal, and concentration.
    relatedQuestionRefs:
      - QM007
      - QM009
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A geography- and segment-specific SAM/SOM model for NotCo's branded and platform businesses.
    whyItMatters: >-
      Category sales and channel statistics use different populations and cannot establish an investable share for
      NotCo.
    diligencePath: >-
      Obtain management's account-level market model with pricing, capacity, serviceable geographies, and conversion
      assumptions.
    relatedQuestionRefs:
      - QM002
      - QM007
  - type: conflicting-data
    severity: material
    topic: adoption
    missingEvidence: >-
      Comparable current-period evidence on repeat purchase, product velocity, and channel performance across NotCo's
      markets.
    whyItMatters: >-
      Category-level growth differs by channel and product, so aggregate demand may overstate the performance of NotCo's
      specific portfolio.
    diligencePath: Request SKU-level sell-through, repeat, distribution, and gross-margin data by geography and channel.
    relatedQuestionRefs:
      - QM008
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current Giuseppe license prices, contract terms, discounts, renewal rates, customer concentration, and realized
      customer switching behavior.
    whyItMatters: >-
      Without commercial terms, an investor cannot compare total cost, revenue quality, or lock-in against internal
      development and alternative suppliers.
    diligencePath: >-
      Review anonymized contracts, price realization, renewal cohorts, concentration, and customer references under
      confidentiality.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Independent matched benchmark of formulation quality, cycle time, launch conversion, and cost against incumbent
      R&D and alternative suppliers.
    whyItMatters: Company-reported speed and partnership evidence demonstrate activity but not durable performance superiority.
    diligencePath: >-
      Commission a blinded benchmark using identical briefs, ingredient constraints, target markets, and acceptance
      criteria.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
