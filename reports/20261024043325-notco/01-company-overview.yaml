company:
  name: NotCo
chapter:
  number: 1
  title: Company Overview
  summary: NotCo is a Chilean food-technology company founded in 2015 that combines the Giuseppe formulation platform with branded and partner-developed foods. Current evidence supports a material pivot toward B2B licensing and product development, while current valuation, ownership, and consolidated financial scale remain incompletely disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      NotCo was founded in Santiago in 2015 and built its identity around Giuseppe, an
      artificial-intelligence platform that searches plant ingredients and product attributes
      to formulate alternatives to animal-based foods. Independent descriptions place the
      company in food technology rather than pure software: it has sold branded products while
      also using the platform for food manufacturers and restaurant partners. The operating
      model is changing. AgFunderNews reported that North American branded products were
      distributed through the Kraft Heinz joint venture and that the B2B business was growing
      faster than expected; SetterVC's October 2026 profile describes a retreat from several
      direct consumer markets and a repositioning toward licensing. The result is a hybrid
      company whose technology moat and consumer brands are related but whose economics should
      not be collapsed into a single SaaS or CPG metric. Headquarters evidence also needs
      reconciliation: several profiles identify Santiago, while Forge's narrative separately
      says New York even though its structured headquarters field says Santiago.
    claimRefs: [CO001, CO002, CO004, CO005, CO014]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The evidence consistently identifies Matías Muchnick as cofounder and CEO, with Karim
      Pichara as cofounder and CTO and Pablo Zamora as cofounder and scientific adviser. Forbes
      provides the clearest founder background for Muchnick, including his earlier Eggless
      venture and the initial capital used to launch NotCo; SetterVC lists the three-person
      founding leadership group. Public evidence does not establish a complete board, formal
      committee structure, or a current executive bench beyond those founders. The founder-led
      model is therefore both a product advantage and a key-person diligence issue, especially
      as the business moves from branded foods toward enterprise software and licensing.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Capital, scale, and milestones
    body: >-
      NotCo raised a $235 million Series D in July 2021 at a reported $1.5 billion valuation.
      Forbes reports more than $425 million raised and $75 million of estimated annual revenue
      in its 2026 profile, while SetterVC supplies only a broad 51–200 employee range. These
      figures are reported or estimated rather than audited disclosures, and Forge shows no
      current private-market price, post-money valuation, total-funding amount, or latest-round
      data. AgFunderNews adds that management made layoffs, de-listed underperforming SKUs, and
      closed the New York office in late 2023 and early 2024. SetterVC also reports 2026
      divestitures in Brazil, Argentina, and Uruguay plus a Mexico closure, but those
      transactions require primary confirmation. The snapshot therefore records dated
      milestones and explicit gaps rather than treating an old financing mark as current value.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    tableRefs: [TO003]
callouts:
  - calloutType: strength
    title: Technology plus commercial proof
    body: The strongest evidence is the combination of a proprietary formulation platform with products and joint ventures that reached major food and restaurant brands.
    claimRefs: [CO002, CO004, CO005]
  - calloutType: risk
    title: Scale and valuation remain opaque
    body: The last broadly reported $1.5 billion valuation is historical, while current ownership, consolidated revenue, board depth, and post-restructuring market footprint are not fully disclosed.
    claimRefs: [CO011, CO012, CO013, CO016]
