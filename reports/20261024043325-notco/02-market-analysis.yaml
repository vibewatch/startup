company:
  name: NotCo
chapter:
  number: 2
  title: Market Analysis
  summary: "NotCo participates in two linked but distinct markets: plant-based food products and AI-enabled CPG formulation. The evidence supports a sizable and growing plant-based demand pool, but price, taste, convenience, trust, and uneven category performance constrain conversion; NotCo's addressable B2B opportunity is best treated as a constrained formulation-services wedge rather than the whole food market."
sections:
  - id: market-boundary
    title: Market boundary and commercial job
    body: >-
      NotCo's market should be bounded before it is sized. The consumer-facing
      boundary includes plant-based substitutes for dairy, meat, eggs, and
      adjacent snacks sold through retail, foodservice, and direct channels. It
      excludes conventional animal products, unrelated wellness products, and
      food categories where NotCo has no evidenced formulation or distribution
      role. A second, adjacent boundary is AI-enabled CPG and food-biotech
      product development: concept generation, formulation, reformulation, and
      commercialization support sold to manufacturers, ingredient companies,
      and technology providers. FoodDive describes the B2B platform as giving
      those groups access to Giuseppe, while FoodNavigator describes the newer
      Concept Quant offer as an end-to-end solution. These are different buying
      motions: consumers buy finished products, whereas CPG R&D, innovation, and
      procurement teams buy speed, formulation options, and lower development
      risk. Conventional in-house R&D and generic market research remain the
      status quo substitutes.
    claimRefs: [CM001, CM002, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      No single public figure isolates NotCo's serviceable market, so the sizing
      case uses multiple lenses and preserves their denominators. PBFA reports
      $7.9 billion of U.S. retail plant-based food sales in its 2025 snapshot,
      with 60% of households purchasing and 78% of shoppers repeating purchases;
      this is a category-wide retail lens, not NotCo revenue or a global TAM.
      GFI-linked foodservice reporting adds a channel lens: U.S. plant-based
      protein distributor sales were $289 million in 2024, down 5% year over
      year but up at a 4% compound annual rate since 2020, while plant-based
      milk, creamer, and eggs had different growth rates. Tracxn provides a
      company and peer lens, reporting NotCo's $466 million of funding and five
      active competitors, but it does not establish market size. The defensible
      conclusion is a large category with a measurable foodservice wedge and an
      unreported B2B software/services wedge; SAM and SOM remain unavailable
      without NotCo's target-account list, pricing, win rates, and capacity.
    claimRefs: [CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyer, user, and payer map
    body: >-
      Adoption is segmented by who funds the work and who experiences the
      outcome. In branded CPG, the economic buyer is typically an innovation,
      R&D, or category leader; formulation scientists and sensory teams are
      users; procurement and quality functions become gatekeepers before
      launch. In foodservice, restaurant, cafeteria, and institutional
      operators buy ingredients or menu solutions, while chefs and consumers
      determine trial and repeat. In NotCo's own branded channel, retailers and
      distributors control shelf access and consumers pay at purchase. The
      commercial trigger differs by segment: faster launches, reformulation for
      cost or regulation, menu availability, or a credible plant-based
      substitute. Kraft Heinz illustrates distribution complementarity: AgFunder
      reports that the partner supplied conventional-account reach while NotCo
      supplied natural-channel strength. Public evidence does not disclose
      contract values, renewal rates, or customer concentration, so those
      attributes remain diligence gaps rather than inferred traction.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      The strongest adoption driver is not novelty alone; it is a measurable
      improvement in the speed, cost, taste, texture, functionality, or
      regulatory fit of a product-development workflow. FoodDive reports that
      product development can take a year to 18 months from concept to shelf,
      while NotCo's Kraft Heinz collaboration reached an initial product launch
      in eight months. FoodNavigator says Concept Quant connects consumer
      insights to concepts, and AgFunder reports that partners use Giuseppe for
      new products and reformulations. Constraints are equally material:
      Food Institute reporting cites price, flavor, habit, convenience, and
      trust as barriers, while GFI-linked evidence says foodservice performance
      still depends on price, taste, texture, menu integration, and operator
      availability. Regulation can also narrow naming and packaging choices;
      MIT Technology Review reported a Chilean court dispute over NotMilk. For
      valuation, the upside case depends on repeatable B2B contracts and
      software-like margins, but public data does not establish those economics.
    claimRefs: [CM014, CM015, CM016, CM017, CM018]
    tableRefs: []
callouts:
  - calloutType: insight
    title: The investable wedge is narrower than the category
    body: NotCo has evidence of a broad plant-based product opportunity and an adjacent formulation-services opportunity, but public sources do not support converting category sales into NotCo TAM, SAM, SOM, ARR, or cash generation.
    claimRefs: [CM005, CM008, CM013]
  - calloutType: risk
    title: Conversion remains the gating variable
    body: Consumer interest exceeds regular adoption, and price, taste, convenience, trust, and distribution remain explicit barriers; B2B adoption also depends on data compatibility, contract depth, and measurable development outcomes.
    claimRefs: [CM014, CM015, CM018]
