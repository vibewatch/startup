schemaVersion: report-v2
artifact: valuation
slug: notco
runDate: 2026-10-24
company:
  name: NotCo
chapter:
  number: 8
  title: Valuation
  summary: >-
    NotCo's last disclosed financing mark remains $1.5 billion from 2022, but
    current public evidence does not disclose a usable secondary price, cap
    table, operating economics, or preference stack. The appropriate stance is
    track / research-more: enterprise-AI optionality is credible enough to
    preserve interest, while restructuring, weak plant-based category demand,
    and stale pricing make a current numeric valuation or return case
    unsupported.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The public record supports a track / research-more recommendation with
      medium-low confidence and high underwriting risk. The strongest price
      anchor is the $1.5 billion mark reported for the December 2022 Series D
      extension, corroborating the same valuation reached in the 2021 Series D.
      That is a historical financing mark, not evidence of present fair value.
      Forge displays no current price and describes market activity as limited,
      while SetterVC labels its own marks as potentially incomplete or stale.
      An investable decision therefore requires a current cap table, fully
      diluted share count, preference waterfall, debt schedule, segment
      financials, cash balance, burn, and a priced security. Until those inputs
      exist, entry discipline should override the appeal of the prior unicorn
      label.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that NotCo's decade of formulation work can become an
      enterprise product-development platform with economics less exposed to
      branded-food manufacturing and distribution. Management said the B2B
      activity was growing faster than expected and moving the profit-and-loss
      profile closer to a technology company, while a 2026 profile reported 20
      major CPG programs. The anti-thesis is that this transition follows
      layoffs, SKU removals, a New York office closure, and reported geographic
      retrenchment. Those actions may improve focus, but they also weaken any
      assumption that the old consumer footprint still supports the historical
      valuation. Neither the number, contract value, retention, gross margin,
      nor concentration of enterprise programs is publicly established.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Scenario framework without false precision
    body: >-
      A probability-weighted valuation cannot be responsibly calculated from
      the available evidence. The bear case is signaled by continued category
      contraction, further operating exits, or enterprise programs failing to
      convert into recurring high-margin revenue. The base case assumes a
      managed transition in which consumer operations remain a proving ground
      while B2B grows, but it still requires a negotiated discount to the stale
      2022 mark until audited economics are available. The bull case requires
      evidence that enterprise contracts are durable, diversified, and
      margin-accretive, together with a credible path to profitability. These
      are diligence thresholds rather than invented valuation ranges; no public
      input supports a precise current multiple or target return.
    claimRefs: [CV007, CV009, CV010, CV011, CV012, CV013, CV016]
    tableRefs: [TV003]
  - id: comparables-exit-and-thesis-breaks
    title: Comparables, exit readiness, and thesis breaks
    body: >-
      Public food-company references are useful only as boundary conditions.
      Multiples.vc lists roughly 0.9x LTM revenue for Oatly, 1.2x for Nomad
      Foods, and 1.4x for Beyond Meat, while Tyson reported a 3.8% adjusted
      operating margin for the first six months of fiscal 2026. These are not
      direct valuation benchmarks for a private hybrid of consumer products and
      enterprise AI: the business mix, scale, liquidity, and accounting bases
      differ. Exit readiness is also unproven because current secondary price
      discovery is absent. Thesis-break triggers are failure to disclose
      segment economics, continued divestitures without enterprise replacement,
      persistent category decline, or enterprise concentration and renewal
      evidence that cannot support software-like economics.
    claimRefs: [CV005, CV006, CV012, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Evidence
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Historical $1.5B mark; no current public price
        - Track / research-more
        - Do not underwrite a purchase until current security terms and economics are disclosed
      - - Confidence
        - Financing anchors are public, but operating and cap-table inputs are missing
        - Medium-low
        - Treat the conclusion as a diligence posture, not a fair-value opinion
      - - Risk rating
        - Restructuring, geographic retrenchment, category pressure, and model transition
        - High
        - Require downside protection and milestone-based entry if diligence advances
      - - Valuation stance
        - 2022 post-money mark is stale and secondary activity is limited
        - Unknown / unsupported at present
        - Demand a fresh price discovery process rather than carrying forward the unicorn mark
      - - Return framework
        - Revenue, margin, cash, burn, dilution, preferences, and exit timing are undisclosed
        - Not calculable from public evidence
        - Set target return and ownership only after a verified fully diluted capitalization
    notes: >-
      Assessment is based only on the retained public sources as of 2026-10-24;
      unknown values are diligence gaps, not zero values or estimates.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV012, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Supporting signal
      - What would change the view
    rows:
      - - Thesis
        - Enterprise formulation AI can diversify NotCo beyond branded plant-based products
        - Management says B2B is growing faster than expected
        - Signed contract values, renewals, gross margin, and customer concentration
      - - Thesis
        - Proprietary formulation data and operating experience may shorten customer development cycles
        - A 2026 profile reports 20 major CPG programs
        - Independent customer proof of cycle-time, cost, or launch improvements
      - - Anti-thesis
        - The pivot may be defensive rather than a demonstrated software-scale expansion
        - Layoffs, SKU removals, and the New York office closure preceded the transition
        - Audited segment growth and positive contribution margin from enterprise work
      - - Anti-thesis
        - The historical consumer footprint may no longer justify the old mark
        - SetterVC reports operating exits and valuation downside pressure
        - Evidence that retained operations and enterprise revenue replace divested volume
      - - Anti-thesis
        - Core plant-based demand remains challenged
        - US plant-based dollar and unit sales declined in 2025
        - Sustained category recovery or NotCo-specific share gains at healthy margins
    notes: >-
      Company statements establish management's thesis but do not independently
      verify contract economics; adverse signals are treated as diligence
      triggers rather than quantified valuation adjustments.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - Enterprise programs convert into diversified recurring revenue with software-like incremental margins; profitability becomes evidenced
        - Re-rating above a conservatively negotiated entry could be supportable, but no numeric range is public-evidence-backed
        - Multiple scaled renewals, audited segment margins, and credible exit preparation
        - Failure to prove renewal quality or margin expansion
      - - Base
        - B2B grows while a smaller consumer operation remains a product-development proving ground
        - Entry must be below or otherwise protected against the stale $1.5B mark; target return awaits cap-table diligence
        - Stable enterprise conversion plus disclosed path to company profitability
        - More restructuring without replacement economics
      - - Bear
        - Plant-based demand stays weak, divestitures continue, and enterprise projects remain concentrated or non-recurring
        - Material impairment to the historical mark is plausible; precise downside cannot be quantified without current financials
        - Continued sales contraction, liquidity stress, or another down-round signal
        - Enterprise contracts demonstrate durable revenue and positive contribution margin
    notes: >-
      Scenarios are conditional decision frameworks, not forecasts; the retained
      evidence does not support numeric probabilities, valuation ranges, or
      return estimates.
    claimRefs: [CV001, CV005, CV007, CV009, CV010, CV012, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation moves from a historical financing anchor through
      present evidence limits and strategic transition to a gated track decision.
    data:
      nodes:
        - label: Historical mark
          value: $1.5B in 2022
          detail: Last disclosed financing valuation, not a current fair-value observation.
        - label: Price discovery
          value: No public current price
          detail: Forge reports no available price and limited activity.
        - label: Demand pressure
          value: US category sales and units declined
          detail: Sector evidence raises the burden of proof for consumer-led growth.
        - label: Strategic pivot
          value: B2B formulation AI
          detail: Management describes improving technology-like economics, but contract metrics are undisclosed.
        - label: Required proof
          value: Cap table plus segment economics
          detail: Current dilution, preferences, revenue, margins, cash, and burn remain unavailable.
        - label: Decision
          value: Track / research-more
          detail: Advance only after fresh price discovery and verified enterprise economics.
    approximationNotes: >-
      This is a qualitative decision chain; node order does not imply numeric
      conversion rates, probabilities, or value weights.
    claimRefs: [CV002, CV006, CV010, CV011, CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Price is the gating fact
    body: >-
      NotCo may be strategically interesting, but public evidence cannot support
      a current fair value or target return. The next decision should be whether
      management will disclose security terms and segment economics, not whether
      the 2022 unicorn mark can be repeated.
    claimRefs: [CV001, CV005, CV006, CV016]
