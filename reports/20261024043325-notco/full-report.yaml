chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              NotCo was founded in Santiago in 2015 and built its identity around Giuseppe, an artificial-intelligence
              platform that searches plant ingredients and product attributes to formulate alternatives to animal-based
              foods. Independent descriptions place the company in food technology rather than pure software: it has
              sold branded products while also using the platform for food manufacturers and restaurant partners. The
              operating model is changing. AgFunderNews reported that North American branded products were distributed
              through the Kraft Heinz joint venture and that the B2B business was growing faster than expected;
              SetterVC's October 2026 profile describes a retreat from several direct consumer markets and a
              repositioning toward licensing. The result is a hybrid company whose technology moat and consumer brands
              are related but whose economics should not be collapsed into a single SaaS or CPG metric. Headquarters
              evidence also needs reconciliation: several profiles identify Santiago, while Forge's narrative separately
              says New York even though its structured headquarters field says Santiago.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO014
