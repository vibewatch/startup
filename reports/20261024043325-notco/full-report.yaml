      - number: '3.2'
        title: Capability, distribution, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              The evidence supports workflow breadth more clearly than quantified superiority. Green Queen reports that
              Giuseppe can support concept creation, formulation, scale-up, ingredient substitution, and nutritional or
              cost reformulation; FoodNavigator describes Concept Quant as an end-to-end turnkey solution and reports
              that NotCo can remain behind the scenes while customer brands take credit. The same Green Queen interview
              attributes a three-to-five-year traditional update cycle and a three-to-four-month NotCo cycle to company
              executives, so that speed comparison remains company-claimed rather than independently benchmarked.
              Distribution is partnership-mediated: VegNews reports collaborations involving Kraft Heinz, Burger King,
              Starbucks, Dunkin', and Shake Shack, while Green Queen says the Kraft Heinz joint venture launched eight
              categories in under two years. These relationships can accelerate reach, but the retained evidence
              provides no licensing price, contract duration, renewal, concentration, or matched control data.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
