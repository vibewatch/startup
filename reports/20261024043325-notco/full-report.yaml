      xAxis:
        label: Product-development workflow breadth
        min: 0
        max: 10
        lowLabel: Single product or no-change
        highLabel: Concept through scale-up
        scale: Ordinal analyst synthesis
      yAxis:
        label: Control of established channels
        min: 0
        max: 10
        lowLabel: Partner dependent
        highLabel: Owned incumbent channels
        scale: Ordinal analyst synthesis
      points:
        - label: NotCo B2B
          x: 9
          'y': 6
          detail: Broad reported workflow; distribution depends on enterprise partners.
        - label: NotCo branded CPG
          x: 7
          'y': 5
          detail: Cross-category product proof with historically reported retail reach.
        - label: Beyond Meat
          x: 3
          'y': 6
          detail: Established plant-protein proposition; no comparable B2B platform evidenced.
        - label: Internal CPG R&D
          x: 7
          'y': 10
          detail: Broad internal workflow and owned incumbent channels, with speed unknown.
        - label: Kraft Heinz joint venture
          x: 8
          'y': 9
          detail: Combines NotCo development with incumbent operating scale.
        - label: Status quo
          x: 1
          'y': 8
