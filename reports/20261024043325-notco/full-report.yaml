              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP010
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP016
      - number: '3.3'
        title: Durability, disclosure, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              NotCo's defensibility appears to rest on a combined system of formulation data, applied know-how, product
              examples, and partner access rather than a publicly measurable algorithmic lead. Its historical financing
              and distribution footprint demonstrate resources and commercial reach, but neither proves superior
              formulation economics. Beyond Meat's SEC index exposes a regular public filing trail, including annual and
              quarterly reports, whereas the retained NotCo evidence is private-company reporting, interviews, and a
              syndicated company release. That asymmetry limits like-for-like comparison of scale and resilience. The
              core adverse paths are incumbent CPG teams building internally, customers learning from a project and
              switching suppliers, branded plant-based products competing on price and distribution, or partners
              capturing the customer relationship. Without independent benchmarks and contract-level evidence,
              differentiation is credible but durability remains medium-confidence.
            claimRefs:
              - CP002
              - CP003
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth plus incumbent access
            body: >-
              NotCo's strongest supported position combines formulation workflow coverage with partnerships that provide
              established brand and distribution channels.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
          - type: callout
            title: Commercial lock-in is unproven
            body: >-
              Public evidence does not disclose B2B prices, contract length, renewal rates, concentration, or customer
              switching behavior.
            calloutType: risk
            claimRefs:
              - CP014
              - CP016
          - type: callout
            title: Benchmark outcomes before underwriting a moat
            body: >-
              Require matched customer cases comparing cycle time, launch conversion, cost, sensory performance, and
