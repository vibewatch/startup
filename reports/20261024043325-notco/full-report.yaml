            body: >-
              The evidence consistently identifies Matías Muchnick as cofounder and CEO, with Karim Pichara as cofounder
              and CTO and Pablo Zamora as cofounder and scientific adviser. Forbes provides the clearest founder
              background for Muchnick, including his earlier Eggless venture and the initial capital used to launch
              NotCo; SetterVC lists the three-person founding leadership group. Public evidence does not establish a
              complete board, formal committee structure, or a current executive bench beyond those founders. The
              founder-led model is therefore both a product advantage and a key-person diligence issue, especially as
