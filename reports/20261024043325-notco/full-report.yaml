  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial monetization
        blocks:
          - type: paragraph
            body: >-
              NotCo's monetization is split between branded CPG products sold through retail, foodservice,
              direct-to-consumer, and partner channels, and B2B product-development work built around the Giuseppe
              platform. The strongest current operating evidence is management's description that B2B growth is moving
              the P&L closer to a technology company while branded CPG remains strategically useful for testing the
              technology. The B2B offer is not yet described with a public price card, contract term, recurring-revenue
              definition, customer cohort, or realized gross margin. Official and retailer pages demonstrate sellable
              products and channel availability, but list prices and shelf presence are not revenue, ARR, or proof of
              repeat purchase. That distinction is material because the business mix could change the quality and
              predictability of revenue without changing the product narrative.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Cost structure and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The economics appear structurally different across the two engines. Branded CPG carries formulation,
              ingredients, manufacturing, inventory, trade promotion, distribution, and working-capital exposure; B2B
              product development may have software-like contribution economics but still depends on food-science labor,
              partner data, testing, formulation, and commercialization. Management explicitly says project work is
              constrained by gross margin, and the CEO described layoffs, SKU delisting, and closure of the New York
              office as hard decisions. Public sources do not provide CAC, payback, gross margin, contribution margin,
              utilization, cash conversion, inventory turns, or customer concentration. The absence of those figures is
              an underwriting gap, not evidence that the economics are weak or strong.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              NotCo has demonstrated access to substantial private capital, including a reported $235 million Series D
              in 2021 at a $1.5 billion valuation and more than $350 million raised by that report, while a later
              company release described a $70 million Series D1 in December of the prior year. These figures are
              historical financing events, not cash available today. The most decision-useful current signal is
              management's stated path toward profitability: mature Latin American operations were expected to reach
              profitability in Q2 2025, while the group was described as on course for profitability in 2027 or
              potentially closer to the end of 2026. That forecast is company-reported and has not been reconciled to
              current cash, burn, debt, or audited accounts. Financial underwriting should therefore remain conditional
              on a current cash bridge, segment P&L, financing terms, and evidence that B2B contracts convert into
              durable, high-quality revenue.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI007
      - number: '4.4'
        title: Diligence blockers and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              Public evidence is sufficient to map the commercial mechanism but insufficient to calculate a valuation or
              a reliable runway. The evidence does not disclose current recognized revenue, ARR, realized pricing, gross
              margin, operating burn, cash balance, debt obligations, renewal rates, or customer concentration. Retailer
              pages show a $2.34 Walmart price and a $2.99 Target price for one Kraft NotCo 6-ounce product, but those
              are observed channel prices for a product SKU rather than NotCo net revenue; retailer disclaimers also
              state that product information may be supplied by manufacturers and may not be complete. The principal
              conclusion is not that NotCo lacks traction, but that the financial case is opaque and should be treated
              as a track/research-more situation until management supplies current segment economics and capital needs.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial underwriting remains data-constrained
            body: >-
              Current cash, burn, runway, debt, realized B2B pricing, revenue mix, and gross margin are not disclosed in
              the assigned public evidence. Historic funding and retailer prices should not be used as substitutes for
              those inputs.
            calloutType: risk
            claimRefs:
              - CI009
              - CI012
              - CI014
              - CI016
          - type: callout
            title: The strategic pivot changes the economic question
            body: >-
              NotCo is positioning B2B Giuseppe work as a faster-growing, more technology-like engine while retaining
              branded CPG as a testing and commercialization vehicle. Underwriting therefore depends on contract
              durability and contribution economics, not only shelf presence.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and customer workflow
        blocks:
          - type: paragraph
            body: >-
              NotCo serves two connected workflows. Its branded-food operation sells plant-based alternatives across
              milk, mayonnaise, meat, chicken, burger, and ice-cream categories, while its enterprise offer applies
              Giuseppe to product formulation and reformulation for food companies. Independent reporting describes the
              core job as translating target taste, texture, aroma, structure, and functionality into candidate
              plant-based formulas. The output is not a self-validating recipe: food scientists, chefs, sensory panels,
              manufacturing teams, and commercial partners still have to test whether a candidate works at scale.
              Evidence of launched products and partnerships demonstrates practical use, but it does not establish that
              the platform is delivered as standalone software or that customers can deploy it without NotCo services.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
      - number: '5.2'
        title: Architecture, data, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is a vertical data-and-experiment loop rather than a general-purpose AI stack.
              Sources describe inputs spanning ingredient chemistry, prior formulations, sensory readouts, manufacturing
              parameters, consumer signals, cost, availability, nutrition, and regulation. Giuseppe searches this
              constraint space and proposes formulations; physical trials and human feedback then determine whether an
              output should advance. NotCo's plausible moat is therefore the combination of food-specific data, models,
              and repeated wet-lab learning, not the algorithm label alone. That advantage remains difficult to size
              because no assigned source discloses model accuracy, experiment throughput, reproducibility, partner-data
              rights, or a controlled comparison against experienced conventional R&D teams.
            claimRefs:
              - CE002
              - CE005
              - CE010
              - CE011
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE005
              - CE010
              - CE011
              - CE014
      - number: '5.3'
        title: Maturity, deployment, and roadmap signals
        blocks:
          - type: paragraph
            body: >-
              Product maturity is strongest at the consumer-goods layer: independent reporting documents multiple
              launched categories, retail distribution, and partner-developed products. The enterprise layer has also
              progressed beyond a concept, with a 2022 opening of Giuseppe to outside food companies and a 2026 company
              interview describing work with seven of the world's top 20 CPG companies, including disclosed Barry
              Callebaut and Magnum initiatives. Those statements are useful current signals but remain company claims;
              the source set does not disclose paid-customer count, implementation duration, renewal, production volume,
              or support obligations. Likewise, reported speed improvements are case claims rather than an independently
              benchmarked service level, so enterprise maturity should be underwritten as assisted R&D delivery rather
              than proven repeatable software deployment.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Quality, compliance, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Publicly described controls focus on formulation constraints and human testing. The current company
              account says sensory targets, cost, ingredient availability, regulatory requirements, nutrition goals, and
              scalability enter projects from the start, but no source in the assigned pool documents cybersecurity
              certification, privacy governance, customer-data isolation, model-change control, uptime, incident
              history, or batch-level traceability. Compliance risk is tangible: two independent reports state that
              Chile's Supreme Court allowed the NotMilk brand to remain but required removal of the word "milk" and
              dairy imagery elsewhere in packaging and advertising after finding unfair competition. Technical diligence
              must therefore test both enterprise controls and the handoff from model recommendation to regulated
              product claims, manufacturing, labeling, and post-launch monitoring.
            claimRefs:
              - CE005
              - CE012
              - CE013
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical learning loop
            body: >-
              NotCo's strongest technical differentiation is the combination of food-specific data, formulation models,
              physical trials, and sensory feedback.
            calloutType: strength
            claimRefs:
              - CE005
              - CE010
              - CE011
          - type: callout
            title: Enterprise proof remains incomplete
            body: >-
              The assigned evidence does not verify deployment architecture, reliability, security, data isolation, or
              independently benchmarked production outcomes.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A dual consumer and enterprise customer architecture
        blocks:
          - type: paragraph
            body: >-
              NotCo reaches end consumers through branded packaged foods, retail, direct-to-consumer, and foodservice,
              while serving food manufacturers through product-development and reformulation work. FoodNavigator
              reported that NotCo separated its B2B activity from NotCo Foods and used the Kraft Heinz joint venture to
              support the technology-oriented path. AgFunderNews later described enterprise jobs ranging from
              concept-to-launch development to reformulation for cost, regulation, or changing consumer preferences.
              This creates four economically distinct relationships: consumers who choose a product, retailers and
              restaurants that provide access, commercialization partners that distribute or co-own products, and
              enterprise CPG customers that buy development capability. Public disclosure does not reconcile revenue,
              gross margin, contract structure, or customer count across those groups, so named access should not be
              treated as recurring software-like adoption.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU009
      - number: '6.2'
        title: Adoption proof is broad but mostly historical
        blocks:
          - type: paragraph
            body: >-
              The strongest quantified adoption evidence predates the current run. The Plant Base reported more than
              6,000 retailers globally in 2021, and a syndicated company release said NotMilk was on track to reach
              8,000 U.S. retail doors by that year-end; the latter was a target, not a verified result. Named deployment
              evidence is stronger than anonymous logo proof: VegNews described Burger King, Starbucks, Dunkin', Shake
              Shack, and Kraft Heinz activity, while FoodNavigator described Mars Wrigley work and additional Shake
              Shack discussions. More recent management reporting says NotCo works with seven of the world's top ten CPG
              companies, but does not name the seven or disclose production status, utilization, or contract value.
              Retail breadth, pilots, tests, and commercial launches therefore remain different proof levels and cannot
              be collapsed into a single active-customer count.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU008
              - CU009
      - number: '6.3'
        title: Durability and concentration remain the core diligence gap
        blocks:
          - type: paragraph
            body: >-
              Current channel evidence suggests concentration is increasing even as customer types diversify.
              AgFunderNews reported that the Kraft Heinz joint venture now sells and distributes NotCo-branded products
              in North America, that NotMilk shifted toward direct-to-consumer because it was not synergistic with Kraft
              Heinz, and that the joint venture supplies conventional-account reach. SetterVC separately reported a 2026
              retrenchment in which Chile became the only market where NotCo directly operated its consumer business;
              that account is an analyst estimate and should be independently verified. Consumer feedback is mixed
              rather than uniformly positive: a Reddit thread contains favorable taste comments alongside price and
              product-fit objections. No assigned source provides NRR, GRR, churn, renewal, repeat-purchase cohorts,
              top-customer revenue share, or contract duration. The investment case therefore depends on private
              evidence showing that partner access converts into durable, diversified economics.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU009
              - CU010
              - CU011
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named access spans both consumers and major food companies
            body: >-
              NotCo has public evidence of products, tests, or development relationships with major restaurant and CPG
              brands rather than relying only on an anonymous logo wall.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
          - type: callout
            title: Customer durability is not publicly measurable
            body: >-
              Distribution and launches do not disclose repeat purchase, renewal, retention, contract value, or
              top-customer exposure, and the recent operating-footprint evidence suggests greater channel dependence.
            calloutType: risk
            claimRefs:
              - CU002
              - CU012
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest-conviction risk is regulatory and legal rather than technical. MIT Technology Review reports
              that a Chilean dairy-producer association sued over NotCo's NotMilk branding and that a court ruled the
              company could no longer use the trademark, subject to appeal. The US Food and Drug Administration
              separately published draft guidance on labeling plant-based alternatives, showing that naming and
              disclosure remain an active policy surface. These facts do not establish a final adverse outcome for NotCo
              in every market, but they make label review, trademark strategy, and jurisdiction-specific compliance a
              recurring operating requirement. The risk is amplified because NotCo sells across multiple countries and
              product categories, so a naming decision can affect packaging, retailer acceptance, and launch timing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
      - number: '7.2'
        title: Operating model and financial resilience
        blocks:
          - type: paragraph
            body: >-
              NotCo is executing a business-model transition whose benefits are plausible but not yet independently
              quantified. AgFunderNews reports layoffs, SKU delistings, closure of the New York office, and transfer of
              North American product sales and marketing to the Kraft Heinz joint venture; the same report quotes
              management saying the B2B business is moving the profit and loss closer to a technology company.
              SetterVC's October 2026 profile reports recent regional divestitures and describes the $1.5 billion
              valuation anchor as stale, while explicitly warning that its company data may be incomplete or erroneous.
              Together, these sources support a risk of transition costs, partner dependence, and valuation reset, but
              they do not provide audited burn, runway, segment margins, or current customer concentration. The
              appropriate monitor is disclosed B2B bookings and gross margin alongside cash runway, renewal rates, and
              the share of revenue controlled by the Kraft Heinz relationship.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The commercial model depends on counterparties for distribution, food-service access, data, and
              manufacturing execution. The historical Kraft Heinz relationship supplied scale and commercialization
              capabilities that NotCo did not have in North America, but that same asymmetry creates concentration and
              bargaining risk if economics, control rights, or renewal terms are unfavorable. The AI proposition also
              depends on compatible, high-quality formulation and sensory data: management told AgFunderNews that
              inconsistent protocols and instrument calibration can reduce the value of partner data. Technical
              differentiation is therefore not a substitute for data governance, validation, and repeatable commercial
              outcomes. The near-term mitigation is to document partner-level economics, retention, data rights, quality
              controls, and incident history; the thesis breaks if regulatory restrictions block core labels, B2B
              contracts fail to renew, or the company cannot demonstrate a funded path through the transition.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A final or expanded restriction on core product naming, combined with weak B2B renewal or insufficient
              runway disclosure, would undermine both the consumer proof strategy and the transition to a technology-led
              model.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR008
          - type: callout
            title: Evidence boundary
            body: >-
              Public sources do not establish current burn, runway, contract concentration, incident history, or appeal
              outcomes; these remain diligence requirements rather than inferred facts.
            calloutType: assumption
            claimRefs:
              - CR009
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a track / research-more recommendation with medium-low confidence and high
              underwriting risk. The strongest price anchor is the $1.5 billion mark reported for the December 2022
              Series D extension, corroborating the same valuation reached in the 2021 Series D. That is a historical
              financing mark, not evidence of present fair value. Forge displays no current price and describes market
              activity as limited, while SetterVC labels its own marks as potentially incomplete or stale. An investable
              decision therefore requires a current cap table, fully diluted share count, preference waterfall, debt
              schedule, segment financials, cash balance, burn, and a priced security. Until those inputs exist, entry
              discipline should override the appeal of the prior unicorn label.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that NotCo's decade of formulation work can become an enterprise product-development
              platform with economics less exposed to branded-food manufacturing and distribution. Management said the
              B2B activity was growing faster than expected and moving the profit-and-loss profile closer to a
              technology company, while a 2026 profile reported 20 major CPG programs. The anti-thesis is that this
              transition follows layoffs, SKU removals, a New York office closure, and reported geographic retrenchment.
              Those actions may improve focus, but they also weaken any assumption that the old consumer footprint still
              supports the historical valuation. Neither the number, contract value, retention, gross margin, nor
              concentration of enterprise programs is publicly established.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framework without false precision
        blocks:
          - type: paragraph
            body: >-
              A probability-weighted valuation cannot be responsibly calculated from the available evidence. The bear
              case is signaled by continued category contraction, further operating exits, or enterprise programs
              failing to convert into recurring high-margin revenue. The base case assumes a managed transition in which
              consumer operations remain a proving ground while B2B grows, but it still requires a negotiated discount
              to the stale 2022 mark until audited economics are available. The bull case requires evidence that
              enterprise contracts are durable, diversified, and margin-accretive, together with a credible path to
              profitability. These are diligence thresholds rather than invented valuation ranges; no public input
              supports a precise current multiple or target return.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Comparables, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Public food-company references are useful only as boundary conditions. Multiples.vc lists roughly 0.9x LTM
              revenue for Oatly, 1.2x for Nomad Foods, and 1.4x for Beyond Meat, while Tyson reported a 3.8% adjusted
              operating margin for the first six months of fiscal 2026. These are not direct valuation benchmarks for a
              private hybrid of consumer products and enterprise AI: the business mix, scale, liquidity, and accounting
              bases differ. Exit readiness is also unproven because current secondary price discovery is absent.
              Thesis-break triggers are failure to disclose segment economics, continued divestitures without enterprise
              replacement, persistent category decline, or enterprise concentration and renewal evidence that cannot
              support software-like economics.
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating fact
            body: >-
              NotCo may be strategically interesting, but public evidence cannot support a current fair value or target
              return. The next decision should be whether management will disclose security terms and segment economics,
              not whether the 2022 unicorn mark can be repeated.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV016
