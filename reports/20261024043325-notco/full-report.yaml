  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      NotCo's public-facing commercial model links Giuseppe-enabled formulation work and branded products to partner and
      retail channels, but the conversion to recognized revenue and gross profit is not publicly quantified.
    data:
      nodes:
        - id: inputs
          label: Giuseppe, formulation data, food-science work
          detail: Public descriptions emphasize AI, ingredient combinations, testing, and partner data.
        - id: b2b
          label: B2B product development
          detail: Concept, formulation, reformulation, licensing or project economics are not publicly priced.
        - id: cpg
          label: Branded CPG products
          detail: Plant-based SKUs sold through retail, foodservice, D2C, and marketplaces.
        - id: channels
          label: Partner and retail channels
          detail: Kraft Heinz JV, retailers, foodservice, D2C, Amazon and other marketplaces.
        - id: revenue
          label: Recognized revenue and gross profit
          detail: Current revenue mix, realized price, gross margin, and cash conversion are unavailable.
        - id: profitability
          label: Profitability target
          detail: Management has described targets for mature countries and the group, but actual results are not public.
      edges:
        - - inputs
          - b2b
        - - inputs
          - cpg
        - - b2b
          - channels
        - - cpg
          - channels
        - - channels
          - revenue
        - - revenue
          - profitability
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI007
  - id: FE001
    title: Giuseppe product-development architecture
    type: stack
    summary: >-
      Public evidence describes a layered, human-in-the-loop workflow from product signals through formulation,
      validation, and commercialization.
    data:
      layers:
        - label: Product intent
          detail: Consumer need, brand identity, sensory target, nutrition, cost, and regulatory constraints.
          items:
            - name: Market and consumer signals
              detail: White-space hypotheses and desired product experience.
            - name: Enterprise brief
              detail: Category, cost, availability, nutrition, and scalability requirements.
        - label: Food data
          detail: Ingredient chemistry, prior formulations, sensory readouts, and manufacturing parameters.
          items:
            - name: Ingredient knowledge
              detail: Plant ingredients and measured food properties.
            - name: Experimental history
              detail: Formulation and sensory results accumulated through physical testing.
        - label: Giuseppe
          detail: Models search combinations and propose candidate formulations under the defined constraints.
          items:
            - name: Candidate generation
              detail: Ingredient and process combinations are proposed for target properties.
            - name: Constraint balancing
              detail: Taste, texture, cost, availability, nutrition, regulation, and scale are considered together.
        - label: Human validation
          detail: Food scientists, chefs, and sensory panels test and refine candidate outputs.
          items:
            - name: Wet-lab iteration
              detail: Physical trials reveal interactions not established by model output alone.
            - name: Sensory evaluation
              detail: Human feedback determines whether target experience is reproduced.
        - label: Manufacturing and compliance
          detail: Process feasibility, supply, quality, labeling, and regulatory review gate commercialization.
          items:
            - name: Scale-up
              detail: Partner or NotCo manufacturing converts a validated formula into production.
            - name: Product controls
              detail: Quality and labeling requirements remain jurisdiction- and product-specific.
        - label: Commercial output and feedback
          detail: Branded products or enterprise partner programs reach the market and create new observations.
          items:
            - name: Branded products
              detail: Retail and foodservice offerings provide operating feedback.
            - name: Partner programs
              detail: Enterprise projects combine NotCo's workflow with partner data and capabilities.
    approximationNotes: >-
      The layer sequence is an analytical synthesis; public sources do not disclose a verified production architecture
      or complete data flow.
    claimRefs:
      - CE002
      - CE005
      - CE010
      - CE011
      - CE014
  - id: FU001
    title: Evidence-backed customer adoption surfaces
    type: journey-map
    summary: >-
      Public evidence shows multiple routes from product exposure to commercialization, but the renewal and expansion
      step remains unmeasured.
    data:
      nodes:
        - id: retail-exposure
          label: Retail exposure
          title: Branded retail
          detail: Historical retailer counts and named chains show shelf access, not repeat purchase.
          touchpoints:
            - Retail doors
            - Retailer product pages
            - D2C
        - id: foodservice-test
          label: Foodservice trial
          title: Menu trial
          detail: Named restaurant relationships create consumer sampling and product-test evidence.
          touchpoints:
            - Burger King
            - Starbucks
            - Dunkin'
            - Shake Shack
        - id: consumer-feedback
          label: Consumer feedback
          title: Product response
          detail: Public comments show taste acceptance alongside price and use-case objections.
          touchpoints:
            - Taste comments
            - Price comments
            - Usage preferences
        - id: enterprise-pilot
          label: Enterprise pilot
          title: Partner development
          detail: FoodNavigator reported multiple conversations and pilots without a conversion denominator.
          touchpoints:
            - Formulation
            - Reformulation
            - Pilot
        - id: partner-commercialization
          label: Partner commercialization
          title: Joint launch
          detail: Kraft Heinz provides co-development and North American distribution evidence.
          touchpoints:
            - Joint venture
            - Co-branded products
            - Conventional retail
        - id: renewal-expansion
          label: Renewal and expansion
          title: Unverified durability
          detail: No assigned source quantifies renewal, retention, account expansion, or recurring contract value.
          touchpoints:
            - Renewal
            - Retention
            - Account expansion
    approximationNotes: >-
      Stages summarize distinct observed adoption surfaces; they are not a conversion funnel and no transition rates are
      implied.
    claimRefs:
      - CU004
      - CU006
      - CU009
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Regulatory, transition, data, and partner risks cluster in the high-impact quadrant because current mitigations
      and disclosure are incomplete.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
        - Residual exposure
      rows:
