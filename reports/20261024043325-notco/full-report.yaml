      - CR010
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation moves from a historical financing anchor through present evidence limits and strategic
      transition to a gated track decision.
    data:
      nodes:
        - label: Historical mark
          value: $1.5B in 2022
          detail: Last disclosed financing valuation, not a current fair-value observation.
        - label: Price discovery
          value: No public current price
          detail: Forge reports no available price and limited activity.
        - label: Demand pressure
          value: US category sales and units declined
          detail: Sector evidence raises the burden of proof for consumer-led growth.
        - label: Strategic pivot
          value: B2B formulation AI
          detail: Management describes improving technology-like economics, but contract metrics are undisclosed.
        - label: Required proof
          value: Cap table plus segment economics
          detail: Current dilution, preferences, revenue, margins, cash, and burn remain unavailable.
        - label: Decision
          value: Track / research-more
          detail: Advance only after fresh price discovery and verified enterprise economics.
    approximationNotes: >-
      This is a qualitative decision chain; node order does not imply numeric conversion rates, probabilities, or value
      weights.
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV011
      - CV013
      - CV014
      - CV016
