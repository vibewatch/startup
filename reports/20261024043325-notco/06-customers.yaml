      coverage: partial
      basis: "Named customers and partners reported in assigned source text through the 2026-10-24 run date"
    claimRefs: [CU002, CU004, CU005, CU008, CU009]
figures:
  - id: FU001
    title: Evidence-backed customer adoption surfaces
    type: journey-map
    summary: Public evidence shows multiple routes from product exposure to commercialization, but the renewal and expansion step remains unmeasured.
    data:
      nodes:
        - id: retail-exposure
          label: Retail exposure
          title: Branded retail
          detail: "Historical retailer counts and named chains show shelf access, not repeat purchase."
          touchpoints: ["Retail doors", "Retailer product pages", "D2C"]
        - id: foodservice-test
          label: Foodservice trial
          title: Menu trial
          detail: "Named restaurant relationships create consumer sampling and product-test evidence."
          touchpoints: ["Burger King", "Starbucks", "Dunkin'", "Shake Shack"]
        - id: consumer-feedback
          label: Consumer feedback
          title: Product response
          detail: "Public comments show taste acceptance alongside price and use-case objections."
          touchpoints: ["Taste comments", "Price comments", "Usage preferences"]
        - id: enterprise-pilot
          label: Enterprise pilot
          title: Partner development
          detail: "FoodNavigator reported multiple conversations and pilots without a conversion denominator."
          touchpoints: ["Formulation", "Reformulation", "Pilot"]
        - id: partner-commercialization
          label: Partner commercialization
          title: Joint launch
          detail: "Kraft Heinz provides co-development and North American distribution evidence."
          touchpoints: ["Joint venture", "Co-branded products", "Conventional retail"]
        - id: renewal-expansion
          label: Renewal and expansion
          title: Unverified durability
          detail: "No assigned source quantifies renewal, retention, account expansion, or recurring contract value."
          touchpoints: ["Renewal", "Retention", "Account expansion"]
    approximationNotes: "Stages summarize distinct observed adoption surfaces; they are not a conversion funnel and no transition rates are implied."
    claimRefs: [CU004, CU006, CU009, CU010, CU011, CU014]
callouts:
  - calloutType: strength
    title: Named access spans both consumers and major food companies
    body: NotCo has public evidence of products, tests, or development relationships with major restaurant and CPG brands rather than relying only on an anonymous logo wall.
    claimRefs: [CU003, CU004, CU005, CU008]
  - calloutType: risk
    title: Customer durability is not publicly measurable
    body: Distribution and launches do not disclose repeat purchase, renewal, retention, contract value, or top-customer exposure, and the recent operating-footprint evidence suggests greater channel dependence.
    claimRefs: [CU002, CU012, CU014, CU015]
