      - ["Burger King", "Foodservice", "Meatless Whopper and later NotChicken items in Chile", "Commercial menu items reported", "Relationship expanded to additional items", "No current store count, volume, or renewal evidence"]
      - ["Starbucks", "Foodservice", "NotMilk and sandwiches using NotMeat and NotMayo in Latin America", "Commercial offerings reported", "Expansion into additional markets described", "No current market list, store count, or sales outcome"]
      - ["Dunkin'", "Foodservice", "Manjxr filling for vegan Boston doughnuts", "Commercial menu item reported", "Management tied the work to an iconic product", "The reported 40% sales reference lacks a clear market, period, and incremental outcome"]
      - ["Shake Shack", "Foodservice", "Plant-based custards and milkshakes, with further products discussed", "Regional test and discussions reported", "Provides evidence of product testing with a major chain", "A test does not establish scaled production, renewal, or repeat orders"]
