company:
  name: NotCo
chapter:
  number: 6
  title: Customers
  summary: NotCo has credible named-customer proof across consumer retail, foodservice, joint ventures, and enterprise food development, but most scale evidence is historical or management-reported. Current evidence points to greater dependence on Kraft Heinz for North America and a shift toward B2B licensing, while retention, contract depth, sell-through, and customer concentration remain undisclosed.
sections:
  - id: customer-architecture
    title: A dual consumer and enterprise customer architecture
    body: >-
      NotCo reaches end consumers through branded packaged foods, retail, direct-to-consumer, and foodservice, while serving food manufacturers through product-development and reformulation work. FoodNavigator reported that NotCo separated its B2B activity from NotCo Foods and used the Kraft Heinz joint venture to support the technology-oriented path. AgFunderNews later described enterprise jobs ranging from concept-to-launch development to reformulation for cost, regulation, or changing consumer preferences. This creates four economically distinct relationships: consumers who choose a product, retailers and restaurants that provide access, commercialization partners that distribute or co-own products, and enterprise CPG customers that buy development capability. Public disclosure does not reconcile revenue, gross margin, contract structure, or customer count across those groups, so named access should not be treated as recurring software-like adoption.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof is broad but mostly historical
    body: >-
      The strongest quantified adoption evidence predates the current run. The Plant Base reported more than 6,000 retailers globally in 2021, and a syndicated company release said NotMilk was on track to reach 8,000 U.S. retail doors by that year-end; the latter was a target, not a verified result. Named deployment evidence is stronger than anonymous logo proof: VegNews described Burger King, Starbucks, Dunkin', Shake Shack, and Kraft Heinz activity, while FoodNavigator described Mars Wrigley work and additional Shake Shack discussions. More recent management reporting says NotCo works with seven of the world's top ten CPG companies, but does not name the seven or disclose production status, utilization, or contract value. Retail breadth, pilots, tests, and commercial launches therefore remain different proof levels and cannot be collapsed into a single active-customer count.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain the core diligence gap
    body: >-
      Current channel evidence suggests concentration is increasing even as customer types diversify. AgFunderNews reported that the Kraft Heinz joint venture now sells and distributes NotCo-branded products in North America, that NotMilk shifted toward direct-to-consumer because it was not synergistic with Kraft Heinz, and that the joint venture supplies conventional-account reach. SetterVC separately reported a 2026 retrenchment in which Chile became the only market where NotCo directly operated its consumer business; that account is an analyst estimate and should be independently verified. Consumer feedback is mixed rather than uniformly positive: a Reddit thread contains favorable taste comments alongside price and product-fit objections. No assigned source provides NRR, GRR, churn, renewal, repeat-purchase cohorts, top-customer revenue share, or contract duration. The investment case therefore depends on private evidence showing that partner access converts into durable, diversified economics.
    claimRefs: [CU002, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
