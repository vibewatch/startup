company:
  name: NotCo
chapter:
  number: 7
  title: Risks
  summary: NotCo's principal risks are the regulatory exposure of plant-based naming, a material execution transition from branded CPG toward B2B licensing, and limited disclosure on current financial and operating resilience. Public evidence shows meaningful product and partner traction, but also a contested labeling environment, recent cost actions, and an unverified current valuation anchor.
sections:
  - id: risk-ranking
    title: Ranked risk posture
    body: >-
      The highest-conviction risk is regulatory and legal rather than technical. MIT Technology Review
      reports that a Chilean dairy-producer association sued over NotCo's NotMilk branding and that a
      court ruled the company could no longer use the trademark, subject to appeal. The US Food and
      Drug Administration separately published draft guidance on labeling plant-based alternatives,
      showing that naming and disclosure remain an active policy surface. These facts do not establish
      a final adverse outcome for NotCo in every market, but they make label review, trademark
      strategy, and jurisdiction-specific compliance a recurring operating requirement. The risk is
      amplified because NotCo sells across multiple countries and product categories, so a naming
      decision can affect packaging, retailer acceptance, and launch timing.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-financial
    title: Operating model and financial resilience
    body: >-
      NotCo is executing a business-model transition whose benefits are plausible but not yet
      independently quantified. AgFunderNews reports layoffs, SKU delistings, closure of the New York
      office, and transfer of North American product sales and marketing to the Kraft Heinz joint
      venture; the same report quotes management saying the B2B business is moving the profit and loss
      closer to a technology company. SetterVC's October 2026 profile reports recent regional
      divestitures and describes the $1.5 billion valuation anchor as stale, while explicitly warning
      that its company data may be incomplete or erroneous. Together, these sources support a risk
      of transition costs, partner dependence, and valuation reset, but they do not provide audited
      burn, runway, segment margins, or current customer concentration. The appropriate monitor is
      disclosed B2B bookings and gross margin alongside cash runway, renewal rates, and the share of
      revenue controlled by the Kraft Heinz relationship.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      The commercial model depends on counterparties for distribution, food-service access, data, and
      manufacturing execution. The historical Kraft Heinz relationship supplied scale and
      commercialization capabilities that NotCo did not have in North America, but that same
      asymmetry creates concentration and bargaining risk if economics, control rights, or renewal
      terms are unfavorable. The AI proposition also depends on compatible, high-quality formulation
      and sensory data: management told AgFunderNews that inconsistent protocols and instrument
      calibration can reduce the value of partner data. Technical differentiation is therefore not a
      substitute for data governance, validation, and repeatable commercial outcomes. The near-term
      mitigation is to document partner-level economics, retention, data rights, quality controls,
      and incident history; the thesis breaks if regulatory restrictions block core labels, B2B
      contracts fail to renew, or the company cannot demonstrate a funded path through the transition.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or case, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [NotMilk trademark and unfair-competition dispute, Chile, medium, high, partial, high, Obtain current appeal status and permitted naming inventory]
      - [Cross-market naming and packaging variation, Multi-jurisdiction, medium, high, partial, high, Commission a country-by-country trademark and food-label review]
      - [Plant-based alternative labeling guidance, United States, medium, medium, partial, medium, Map every US label claim to final FDA guidance when issued]
    notes: Evidence combines a reported Chilean court dispute with a US FDA draft notice; likelihood and residual exposure are analytical assessments, not legal opinions, and current appeal or guidance outcomes require counsel confirmation.
    enumerationScope:
      coverage: sample
      basis: Publicly accessible regulatory and legal signals identified in the assigned 2025-2026 source pool, not a complete litigation or compliance docket.
    claimRefs: [CR001, CR002, CR003, CR004, CR013]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Transition execution and cost restructuring, high, high, partial, high, Current cash runway and restructuring cost are undisclosed]
      - [Partner-data incompatibility or weak validation, medium, high, partial, medium-high, "No public protocol, validation, or model-performance audit"]
      - [Product quality or sensory mismatch across markets, medium, medium, partial, medium, "Current complaint, return, and repeat-purchase data are unavailable"]
      - ["Incident, recall, or security visibility gap", unknown, "potentially high", undisclosed, unquantified, "No complete public incident and recall history was located"]
    notes: Rows synthesize reported operating actions, management's data-quality caveats, and public product-development descriptions; no row should be read as proof that an incident occurred.
    claimRefs: [CR005, CR006, CR010, CR011, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [North American distribution and commercialization, Kraft Heinz joint venture, "Loss of access or adverse economics constrain reach and launch cadence", high, "Diversify direct B2B contracts and retain owned product validation", high]
      - [Retail and food-service distribution, Major grocery and QSR partners, "Delisting or partner strategy change reduces consumer proof and volume", high, "Track account-level sell-through and renewal terms", medium-high]
      - [Formulation and sensory data, CPG partners and internal datasets, Incompatible data reduces model value or slows delivery, high, "Standardize schemas, calibration, provenance, and validation gates", medium-high]
      - [Capital and valuation support, Private investors and secondary market, Stale valuation or limited liquidity constrains financing options, high, "Obtain current cap table, runway, and financing terms", high]
    notes: Counterparty roles and failure scenarios are based on reported partnerships and management commentary; concentration, contract terms, and economics are not publicly disclosed in the retained pool.
    claimRefs: [CR007, CR008, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Regulatory, transition, data, and partner risks cluster in the high-impact quadrant because current mitigations and disclosure are incomplete.
    data:
      columns: [Impact, Likelihood, Mitigation maturity, Residual exposure]
      rows:
        - label: Labeling and trademark restrictions
          values: [high, medium, partial, high]
        - label: CPG-to-B2B transition execution
          values: [high, high, partial, high]
        - label: Partner-data incompatibility
          values: [high, medium, partial, medium-high]
        - label: Kraft Heinz and channel dependence
          values: [high, medium, partial, medium-high]
        - label: Current valuation and liquidity opacity
          values: [high, medium, low, high]
        - label: Incident and recall visibility
          values: [critical, low-to-medium, low, high]
    approximationNotes: Likelihood, impact, mitigation maturity, and residual exposure are qualitative assessments from the cited public evidence; the matrix does not imply numeric probabilities.
    claimRefs: [CR001, CR005, CR010, CR012]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: A final or expanded restriction on core product naming, combined with weak B2B renewal or insufficient runway disclosure, would undermine both the consumer proof strategy and the transition to a technology-led model.
    claimRefs: [CR001, CR005, CR008]
  - calloutType: assumption
    title: Evidence boundary
    body: Public sources do not establish current burn, runway, contract concentration, incident history, or appeal outcomes; these remain diligence requirements rather than inferred facts.
    claimRefs: [CR009, CR014, CR015, CR016]
