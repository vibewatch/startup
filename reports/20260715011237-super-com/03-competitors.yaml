- id: profiles-and-scale
  title: 'Profiles and scale: the comparison set ranges from niche cashback tools to gigantic travel platforms'
  body: 'Scale across the comparison set varies by an order of magnitude. On one end, Ibotta’s public-market footprint is about $0.70 billion with roughly $340 million of trailing revenue, while Dave is nearer $5.3 billion with roughly $605 million of trailing revenue. Rakuten’s market cap is around $10.9 billion, and PayPal — Honey’s parent — stands above $41 billion, giving it a much deeper balance sheet for customer acquisition and experimentation. Travel incumbents are larger still: Expedia shows about $15.2 billion of trailing revenue and Booking about $27.7 billion. Those numbers matter because they define how hard it will be for Super.com to sustain visible price and brand advantages in travel. They also show why the same company can look cheap versus fintech growth comps and tiny versus travel incumbents. The comparison set is not a neat peer group; it is a wide spread of adjacent models that each expose a different weakness in Super.com’s underwriting story.'
  claimRefs:
  - CP003
  - CP005
  - CP008
  - CP010
  - CP015
  - CP016
  - CP027
  - CP028
  - CP029
  - CP030
