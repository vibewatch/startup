  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: member-attach-and-retention
    missingEvidence: Cohort data showing whether members who start in travel actually adopt finance features and stay longer than specialist-tool users would.
    whyItMatters: Breadth only becomes a moat if it produces measurably better retention and wallet share than free single-purpose alternatives.
    diligencePath: Request cohort retention, cross-sell attach rates, and repeat-booking data segmented by feature adoption.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: private-evidence-only
    severity: material
    topic: supplier-leverage
    missingEvidence: Hotel-supply economics, unique inventory access, and evidence that suppliers give Super.com terms rivals cannot easily match.
    whyItMatters: Without differentiated supply, travel incumbents can compress Super.com’s visible price advantage.
    diligencePath: Ask for top supplier mix, inventory exclusivity, and blended take-rate by booking type.
    relatedQuestionRefs:
    - QP017
    - QP025
  - type: missing-source
    severity: minor
    topic: specialist-pricing-detail
    missingEvidence: A clean apples-to-apples realized-pricing dataset for each competitor’s effective value delivered to a comparable user basket.
    whyItMatters: List pages and marketing claims are not the same as realized savings after exclusions, caps, and redemption rules.
    diligencePath: Run controlled user journeys across competitors with matched baskets and record net savings after all conditions.
    relatedQuestionRefs:
    - QP009
