callouts:
- calloutType: insight
  title: The real rival is the consumer’s stitched-together stack of free specialists
  body: Super.com does not just compete with one named app. It competes with the idea that a household can get travel savings from an OTA, checkout discounts from Honey or Rakuten, and liquidity help from Dave or Chime without paying one company a membership fee.
  claimRefs:
  - CP001
  - CP019
  - CP022
  - CP025
- calloutType: risk
  title: Scale asymmetry is substantial in travel and meaningful in finance
  body: Expedia and Booking tower over Super.com in travel revenue, while PayPal, Rakuten, Dave, and Chime represent better-capitalized adjacent platforms. That does not invalidate the bundle thesis, but it does make supplier leverage and customer-acquisition efficiency critical diligence topics.
  claimRefs:
  - CP005
  - CP010
  - CP015
  - CP016
  - CP029
  - CP030
