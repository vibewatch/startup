- id: capability-and-packaging
  title: 'Capability and packaging: Super.com wins on breadth, but not on depth in any single wedge'
  body: 'The product comparison is a breadth-versus-depth tradeoff. Super.com is unusual in combining hotel discounts, a paid savings membership, cashback, credit building, and cash advance in one surface. That breadth is real, and its flagship hotel value proposition — up to 50% off hotels and 10% cashback — is stronger than what most generic coupon or cashback products advertise. But it is also gated by a membership fee, whereas many of the closest substitutes are free. That means a user evaluating the bundle has to believe the combined package will be used often enough to justify paying. Specialists have the opposite problem: they may win one moment more cleanly, but they leave adjacent savings opportunities to another app. The result is a comparison set in which Super.com usually looks broader than the specialist and shallower than the category leader. The market will reward that middle position only if Super.com proves that convenience and cross-sell beat best-of-breed depth for enough
    households.'
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
