- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: All publicly identified CFPB and FTC regulatory actions and pending rulemakings with documented applicability to Super.com's cash advance, subscription, and financial product operations as of 2026-07-15
  sourceRefs:
