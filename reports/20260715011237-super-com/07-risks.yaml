schemaVersion: report-v2
artifact: risks
slug: super-com
runDate: '2026-07-15'
company:
  name: Super.com
chapter:
  number: 7
  title: Risks
  summary: >-
    Super.com's risk profile is dominated by four vectors: regulatory exposure from CFPB and FTC oversight of cash
    advance and subscription practices (where FTC enforcement against peer Dave Inc. in 2024 established sector
    precedent); customer-service quality friction documented across thousands of public reviews about refunds and
    subscription management; partner dependence on unnamed hotel suppliers and a program bank; and key-person
    concentration in CEO Hussein Fazal. Most risks are manageable at current scale, but the combination of regulated
    financial products, a high-volume travel fulfilment operation, and a freemium-to-paid conversion model means that
    a single regulatory action or partner disruption could simultaneously compress multiple revenue streams.
sections:
- id: regulatory-legal-risk
  title: 'Regulatory and legal risk: CFPB EWA rulemaking and FTC subscription enforcement create live compliance exposure'
  body: >-
    Super.com operates at the intersection of two active regulatory campaigns in 2025-2026: earned-wage-access and
    small-dollar credit, and recurring-subscription clarity. The CFPB proposed an interpretive rule on July 18, 2024
    that would classify paycheck-advance products — including app-based cash advances — as credit under the Truth in
    Lending Act, which would impose APR disclosure, fee transparency, and origination requirements not currently required
    of most app-based advance providers. If finalized, that rule would require Super.com to materially change the fee
    model and disclosure architecture of its cash advance feature. The FTC finalized its Click-to-Cancel rule in
    October 2024, requiring that subscription cancellation be as easy as enrollment — directly applicable to Super+.
    The sector-level enforcement precedent is concrete: in November 2024 the FTC filed a federal lawsuit against Dave
    Inc., a direct competitor in cash advances, for deceptive marketing of up-to-$500 advances, undisclosed express
    fees, and involuntary tips. Dave's target consumer was described as "financially vulnerable" — the same demographic
    Super.com explicitly serves. No direct regulatory action against Super.com has been identified, but the precedent
    from Dave and the active CFPB rulemaking make this the highest-priority risk to monitor.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-service-quality-risk
  title: 'Operational risk: high complaint volume on refunds and subscription charges is publicly documented'
  body: >-
    Super.com's largest consumer-facing risk is service-quality friction in refunds and booking errors. The
    PissedConsumer aggregation shows 1,935 reviews with a 1.5-star average and 86 percent unfavorable distribution,
    with the majority of complaints focused on refund denial or delay, reservation not found at hotel, and subscription
    charges continuing after attempted cancellation. Trustpilot presents a more favorable picture — 4.3 stars from
    58,869 reviews — but its AI-generated summary still identifies reservation mismatches, pricing surprises, and
    support responsiveness as recurring themes. The structural driver is that Super.com acts as a travel intermediary
    between consumers and underlying OTA or hotel suppliers; booking errors therefore require multi-party coordination
    that consumers must navigate. This complaint volume creates three forward risks. First, it provides regulators with
    a ready evidence base if CFPB or FTC examinations are initiated. Second, high-complexity cases (refunds, errors)
    generate disproportionate churn from the most engaged customers. Third, scaling the NASCAR partnership to 70 million
    new fan-facing touchpoints could increase the support burden faster than current capacity.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-dependency-risk
  title: 'Partner dependency risk: hotel supply, program bank, and app-store distribution are single-file dependencies'
  body: >-
    Super.com's travel business depends on access to discounted hotel inventory through unnamed OTA or supplier
    partnerships. The COVID-19 episode in 2020 demonstrated this fragility concretely: CEO Fazal publicly stated
    the business went to "negative" — more cancellations than bookings — when travel demand collapsed, which forced
    the company to build the multi-product bundle. Today, hotel booking remains the primary consumer acquisition
    funnel for Super+ membership conversion, meaning that any serious disruption to the supply side would affect both
    travel revenue and membership growth simultaneously. A second dependency concerns the program bank enabling
    Super.com's secured charge card and cash-advance features. The bank partner is not publicly named; if it exits
    or changes terms, the financial-product layer goes offline across all Super+ members. A third dependency is
    app-store distribution: both Apple App Store and Google Play can restrict financial-product marketing, increase
    commission rates on subscriptions (Apple's 30 percent in-app commission is a structural margin pressure), or
    change discoverability in ways that increase effective customer acquisition cost.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-execution-risk
  title: 'People and execution risk: CEO concentration, new leadership bench, and multi-product complexity'
  body: >-
    Super.com's executive bench was significantly refreshed in 2025-2026 with three senior hires — CPO Ryan Fujiu
    (ex-Bird/Uber), General Counsel Michele Lee (ex-Pinterest), and Harley Finkelstein (Shopify President) as board
    observer. These additions strengthen the bench but also signal that the prior management structure needed
    reinforcement before the next growth phase. CEO Hussein Fazal remains the company's sole public face and brand
    voice across its entire 10-year history; no named successor or succession plan has been disclosed. The
    cross-border operating structure (Canadian company, US-focused revenue, split Toronto and San Francisco teams)
    creates regulatory, HR, and tax complexity in both jurisdictions simultaneously. With approximately 300 employees
    running travel fulfilment, consumer fintech, card products, AI personalization, and membership management in
    parallel, the execution intensity per employee is very high. The pivot history (three brand names, two major
    strategic shifts) demonstrates management agility but also creates investor uncertainty about future strategic
    direction if the current model underperforms.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  tableRefs:
  - TR004
- id: financial-model-risk
  title: 'Financial model risk: credit exposure, conversion economics, and limited disclosure leave key risks unresolved'
  body: >-
    Super.com's financial risk profile has three primary gaps. First, the cash advance product carries undisclosed
    default and fraud rates. The FTC's complaint against Dave documented that Dave alone collected over $149 million
    in cash-advance tip revenue from 2022 through mid-2024; Super.com's economics are presumably different in scale
    but the category risk is real. If Super.com retains credit exposure rather than offloading it entirely to a
    program bank, adverse macro conditions (rising unemployment, higher delinquency) would compress that revenue
    stream directly. Second, the Super+ membership conversion rate is approximately 3.3 percent of total users
    (nearly 1 million members from 30 million total app users) — meaning 97 percent of the user base is not
    generating subscription revenue. The path to materially higher conversion requires either much better conversion
    mechanics or significantly more qualified top-of-funnel traffic. Third, Super.com has not disclosed revenue
    stream mix, gross margins by business line, or customer acquisition costs, meaning investors cannot confirm
    whether profitability in 2025 reflects a durable margin structure or a temporary efficiency point driven by
    timing factors.
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  tableRefs:
  - TR005
- id: mitigation-and-kill-criteria
  title: 'Mitigation and kill criteria: observable thresholds that would change the investment thesis'
  body: >-
    Super.com's risks are manageable if the company proactively builds CFPB compliance for cash advance (disclosing
    fees, ensuring TILA readiness), maintains a Click-to-Cancel compliant Super+ cancellation flow, diversifies hotel
    suppliers, and formalizes a CEO succession plan. The most important monitoring signals are regulatory filing
    activity (CFPB examination notices, FTC civil investigative demands), customer complaint trajectory across public
    platforms, and membership conversion rate trend. Thesis-break triggers include: a CFPB enforcement action
    requiring fee restructuring that reduces cash advance or subscription revenue by more than 20 percent; loss of
    the primary hotel supplier without a 90-day replacement; a data breach affecting more than 1 million consumer
    financial records; or CEO resignation without a named internal successor. None of these events appears imminent
    from the public record, but all are within the plausible risk distribution given the operating model.
  claimRefs:
  - CR027
  - CR028
  - CR029
  - CR030
