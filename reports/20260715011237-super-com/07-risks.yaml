  columns:
  - Rule / regulator
  - Jurisdiction
  - Status
  - Super.com exposure
  - Severity if triggered
  - Mitigation
  - Residual exposure
  - Diligence path
  notes: Rows ordered by severity descending. No direct enforcement action against Super.com found; all risks are sector-level or inferred from product-type exposure.
  rows:
  - - CFPB Interpretive Rule on paycheck-advance / EWA products
    - US federal
    - Proposed July 2024; final rule timeline uncertain as of 2026-07-15
    - High — Super.com cash advance feature directly matches the proposed scope
    - Critical — TILA compliance could require fee restructuring and APR disclosure
    - Proactive CFPB compliance build-out; engage comment process; restructure fee model
    - High — could eliminate tip or express-fee revenue line if finalized
    - Request CFPB compliance counsel engagement and compliance roadmap from management
  - - FTC Click-to-Cancel rule (Negative Option Rule)
    - US federal
    - Final rule published November 2024; effective January 2025
    - Medium-High — Super+ recurring subscription is in scope
    - Medium — failure creates enforcement risk and consumer refund liability
    - Audit Super+ cancellation UX; ensure it is as easy as enrollment
    - Medium — public complaint record on subscription cancellation is visible
    - Audit Super+ cancellation flow; request compliance confirmation from General Counsel
  - - FTC Act enforcement — deceptive cash advance practices (Dave precedent)
    - US federal
    - Active enforcement; Dave complaint filed November 2024
    - Medium — Super.com offers similar cash advances to similar demographics
    - High — enforcement can require disgorgement and business-model changes
    - Ensure advance amounts match marketing; fully disclose fees pre-signup
    - Medium — FTC complaint against Dave creates close analogical risk
    - Conduct pre-litigation compliance review of cash advance feature
  - - State money-transmission licensing
    - 50 US states plus DC
    - Ongoing requirement for entities holding or transferring consumer funds
    - Medium — card and cash advance products likely require licenses in most states
    - High — unlicensed operation creates enforcement and retroactive liability
    - Maintain multi-state license set; track state EWA legislation
    - Medium — license status is not publicly disclosed by Super.com
    - Request full money-transmission license list and covered states
  - - Canadian PIPEDA and Quebec Law 25 privacy requirements
    - Canada federal and provincial
    - In force; Quebec Law 25 most stringent for AI and data-driven personalization
    - Medium — Super.com has Toronto operations and Canadian users
    - Medium — fines and mandatory breach disclosure for non-compliance
    - Update privacy policy; conduct DPIA for new AI personalization features
    - Medium — privacy notice published but compliance depth not externally verifiable
    - Review privacy notice against Quebec Law 25 requirements
