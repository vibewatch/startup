  claims:
  - id: CR001
    statement: The CFPB proposed an interpretive rule in July 2024 that would classify paycheck-advance and app-based cash advance products as credit under the Truth in Lending Act, imposing APR disclosure and fee transparency requirements.
    sourceRefs:
    - SR003
    - SR009
    confidence: high
    type: observed
    topic: regulatory-risk
    freshness: current
  - id: CR002
    statement: The CFPB has active rulemaking under development specifically targeting consumer credit offered in advance of expected compensation for work, which directly covers app-based cash advance products like those offered by Super.com.
    sourceRefs:
    - SR003
    - SR023
    confidence: high
    type: observed
    topic: regulatory-risk
    freshness: current
  - id: CR003
    statement: The FTC finalized its Click-to-Cancel rule under the Negative Option Rule on October 16, 2024, requiring that subscription cancellation be as simple as enrollment, directly applicable to Super.com's Super+ recurring membership.
    sourceRefs:
    - SR004
    - SR022
    confidence: high
    type: observed
    topic: regulatory-risk
    freshness: current
  - id: CR004
    statement: In November 2024, the FTC filed a federal complaint against Dave Inc. — a direct competitor in app-based cash advances — for deceptive marketing claiming up-to-$500 advances, undisclosed express-delivery fees, and involuntary tip charges from financially vulnerable consumers.
    sourceRefs:
    - SR005
    - SR008
    confidence: high
    type: observed
    topic: regulatory-risk
    freshness: current
  - id: CR005
    statement: Dave Inc.'s FTC-complaint behavior — express fees withheld until after bank-account access, emotional tip framing, difficult membership cancellation — describes the same product category Super.com offers to the same consumer demographic of financially stressed Americans.
    sourceRefs:
    - SR005
    - SR011
    confidence: medium
    type: inferred
    topic: regulatory-risk
    freshness: current
  - id: CR006
    statement: No public regulatory enforcement action against Super.com has been identified as of July 2026; however, sector-level enforcement activity from both CFPB and FTC makes this the most important risk category to monitor actively.
    sourceRefs:
    - SR003
    - SR004
    - SR005
    confidence: high
    type: observed
    topic: regulatory-risk
    freshness: current
  - id: CR007
    statement: Super.com's PissedConsumer profile shows 1,935 reviews with a 1.5-star average and 86 percent unfavorable distribution, with primary complaint categories concentrated in refund denial or delay and reservation not found at hotel.
    sourceRefs:
    - SR006
    - SR024
    confidence: medium
    type: third-party-reported
    topic: service-quality
    freshness: current
  - id: CR008
    statement: Super.com's Trustpilot profile shows 4.3 stars from 58,869 reviews, with AI-summarized negative themes including reservation mismatch upon hotel arrival, pricing surprises with unexpected additional costs, and support responsiveness issues.
    sourceRefs:
    - SR007
    - SR013
    confidence: medium
    type: third-party-reported
    topic: service-quality
