  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群：Super.com 服务重视性价比的消费者，但付款方、用户和高价值用户群组的可见度并不相同
        blocks:
          - type: paragraph
            body: >-
              Super.com
              的公开定位一贯指向重视性价比的普通美国人，而不是富裕休闲旅行者或企业买家。公司的应用描述、会员页面和新闻材料都强调省钱、拉长工资周期和在一个地方获得实用消费者权益。这意味着客户的关键任务是经济性的，而不是向往型的：更便宜的酒店住宿、返现、短期流动性、信用建设和更低日常支出。从这个意义上讲，买方、用户和付款方通常是同一个人。不过，并非所有
              用户群组都同样可见。纯旅行用户、付费 Super+
              会员、现金预支用户和卡用户的价值画像很可能差异很大，公开记录没有清晰拆分。这个问题重要，因为组合包业务可能有大量休闲流量，但收入和留存仍不成比例地依赖更小的付费或高频
              用户群组。因此，客户故事最强之处在广泛触达，最弱之处在分群级别变现质量。
