      - number: '7.4'
        title: 人员与执行风险：CEO 集中度、新领导梯队和多产品复杂度
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年，Super.com 高管梯队明显补强，新增三位高管——CPO Ryan Fujiu（前 Bird / Uber）、总法律顾问 Michele Lee（前
              Pinterest），以及以董事会观察员身份加入的 Harley Finkelstein（Shopify 总裁）。这些补强提高了管理深度，也说明公司进入下一阶段增长前，原有管理结构需要加固。CEO Hussein
              Fazal 仍是公司 10 年历史中唯一的公开面孔和品牌声音；公司没有披露具名接班人或继任计划。跨境运营结构（加拿大公司、收入重心在美国、团队分布在 Toronto 和 San Francisco）让监管、HR
              和税务复杂性同时落在两个司法辖区。约 300 名员工并行跑旅行履约、消费者金融科技、卡产品、AI
              个性化和会员管理，单员工执行强度很高。公司转向历史（三个品牌名、两次重大战略转向）证明管理层有敏捷性，也让投资者担心：如果当前模型表现不及预期，未来战略方向是否会再次变化。
            claimRefs:
