            body: >-
              因为 Super.com 是消费者应用，它的客户证明不同于企业 SaaS
              参考客户。公开记录中占主导的不是带采购签名的多年案例研究，而是应用商店评论、评论网站反馈、精选证言和营销合作。这些来源仍有用。它们显示真实消费者在使用酒店折扣产品，注意到返现经济性，讨论 Super Card
              和现金预支功能，并对产品行为和支持质量产生强烈反应——有时正面，有时负面。评论文本也暗示，部分用户先把 Super.com
              当作旅行省钱工具发现，之后才看重更广的金融组合。同时，这些来源也有限。评论网站轶事噪声大，可能过度代表边缘案例，也很少证明长期留存或高 LTV 行为。官方评论页面经过筛选。NASCAR
              这样的合作证明有助于验证触达，但不能验证客户盈利性。因此，公开客户证明集合最能证明使用存在且广泛，而不能干净衡量生命周期价值或耐久粘性。
