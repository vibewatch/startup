      - number: '1.5'
        title: 新鲜度缺口、投诉，以及公开记录中未完全对齐的部分
        blocks:
          - type: paragraph
            body: >-
              公开记录总体正面，但并不完全干净。几处公司自控界面似乎彼此滞后：关于页面仍称直接节省 $200M+，而 Series D 轮新闻稿称累计为客户节省超过 $1B；招聘材料仍写着 200+ 名员工，而 BetaKit
              报道公司有 300 人。两个缺口都不致命，但都重要，因为公司概览数字会成为后续尽调的标准输入。客户反馈界面也带来有用的提醒。BBB 称，存档投诉涉及 Super+ 订阅注册；Sitejabber
              虽然总体评分健康，但也有用户具体批评隐藏税费、取消说明不清和支付摩擦。独立评测者同样把每月 $15 的 Super+ 费用视为部分用户的真实门槛，尤其是当他们不常订旅行或不用卡时。本章结论不是业务坏了，而是
              Super.com 当前规模伴随着不小的透明度负担。公司如今足够大，过期的公开指标、会员定价模糊和订阅投诉都应带入后续每一章，而不是当作脚注处理。
