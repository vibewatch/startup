      - number: '7.5'
        title: 财务模型风险：信用暴露、转化经济性和有限披露让关键风险悬而未决
        blocks:
          - type: paragraph
            body: >-
              Super.com 的财务风险画像有三个主要缺口。第一，预支现金产品的违约率和欺诈率未披露。FTC 对 Dave 的起诉显示，仅 Dave 在 2022 年至 2024 年中就收取了超过 $149M
              的预支现金小费收入；Super.com 的经济性规模大概率不同，但品类风险真实存在。如果 Super.com
              自留信用风险，而不是完全转给合作银行，宏观条件转差（失业上升、逾期更高）会直接挤压这条收入流。第二，Super+ 会员转化率约为总用户的 3.3%（3000 万总应用用户中近 100 万会员）——也就是说，97%
              用户并不贡献订阅收入。要把转化显著拉高，要么转化机制好得多，要么漏斗顶端流量更合格且规模大得多。第三，Super.com 没有披露收入流组合、各业务线毛利率或获客成本，投资者无法确认 2025
              年盈利来自可持续利润率结构，还是时点因素推动的暂时效率点。
