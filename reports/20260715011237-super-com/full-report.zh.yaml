        - 2026 年 $240-280M（增长 20-40%）；会员 1.5M；监管合规成本温和
        - 流动性事件时 6-8x NTM 收入倍数
        - $1.6B-$2.5B（2027-2028 年退出时为 Series D 价格的 1.3-2.1x）
        - 会员转化平台期；OTA 利润率压缩；AI 个性化采用较慢
        - 按当前趋势和监管环境看，这是最可能结果
      - - 悲观
        - 2026 年 $200-240M（增长 0-20%）；CFPB 执法损害现金预支收入；会员流失上升
        - 带监管折价的 4-5x NTM 收入倍数
        - $880M-$1.2B（大致持平 Series D 价格）
        - CFPB EWA 规则最终落地；酒店供应商中断；CEO 离任
        - 若监管风险落地，则情景可能；悲观底部接近 Series D 价格
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        All publicly identifiable comparable companies with disclosed valuations in consumer cashback, savings, travel,
        neobank, or digital promotions categories with evidence of transactions or public multiples as of 2026-07-15
    sourceRefs:
      - SV008
      - SV009
      - SV010
      - SV011
      - SV012
      - SV013
      - SV014
      - SV015
      - SV032
      - SV033
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值
      - 与 Super.com 的相关性
      - 局限
    notes: 所有可比数据均为近似值；私有估值来自媒体报道，可能无法反映当前账面估值。
    rows:
      - - Ibotta Inc. (IBTA) — 上市
        - 2025 财年收入 $342M；市值 $700M（2026 年 7 月）
        - 约 2.0x NTM 收入
        - 消费者返现 / 数字促销领域最直接的上市可比对象
        - 2025 年收入下滑；Ibotta 模式（CPG 品牌出资的促销）比 Super.com 面向消费者的会员模式更偏 B2B 侧
      - - PayPal 收购 Honey（2019）
        - 收购时收入估计约 $100-120M；交易价格 $4B
        - 估计约 30-40x NTM 收入（收购溢价）
        - 史上最受瞩目的消费者返现平台收购
        - 高倍数时代的极端收购溢价；PayPal 战略未被验证；Honey 后续被整合，独立可见度下降
      - - Dave Inc. (DAVE) — 上市，FTC 执法后
        - 2024 财年收入约 $261M；市值大幅低于 2022 年 SPAC 估值
        - FTC 执法公告后低于 1x 收入
        - 直接的现金预支产品可比对象；目标人群相同
        - FTC 执法严重压低估值；显示下行尾部风险，但不是正常情景可比
      - - Chime — 私有，最近估值
        - 2023 财年收入估计约 $1.5B；最近私有估值 $25B（2021）
        - 峰值约 17x（2021）；当前估计账面估值大幅降低
        - 美国最大消费者数字银行；是消费者金融科技规模化的愿景型可比对象
        - 2021 年峰值估值处在利率修正前环境；当前二级市场估计账面估值约 $8-12B
      - - 'Rakuten (TYO: 4755) — 上市，全球'
        - 市值约 $7.5B（2026 年 7 月）；收入包括电商、金融科技、电信
        - 综合集团混合倍数；不可直接比较
        - 全球最大返现忠诚度平台；Super.com 想走类似模式
        - Rakuten 的混合倍数反映电信业务亏损和电商组合；返现板块只是其中一块
      - - 'Expedia Group (NASDAQ: EXPE) — 上市公司'
        - FY2025 收入约 $14B；市值约 $18B（2026 年 7 月）
        - 约 1.3x 收入
        - 可比 Super.com 旅行预订侧的商业模式
        - Expedia 是全栈 OTA；Super.com 是叠在 OTA 之上的折扣入口层
      - - Super.com Series D 轮（2026 年 7 月）
        - 2025 年收入 $200M；估值 $1.2B
        - 2025 年净收入的 6.0x
        - 参照点：融资本身就是最新可比项
        - 私募市场估值由 TPG 定价；不代表二级市场清算价格
  - id: TV005
    title: 投资论点失效与止损触发因素表
    sourceRefs:
      - SV001
      - SV002
      - SV005
      - SV007
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
    columns:
      - 触发因素
      - 阈值
      - 论点传导路径
      - 行动含义
    notes: 触发因素围绕可观察外部事件定义，而不是管理层说法。
    rows:
      - - CFPB 对现金预支执法
        - 因现金预支收费做法，Super.com 遭遇任何公开执法行动或民事调查要求
        - 可能削弱一条重要性不低的收入流；Dave 先例显示估值可快速压缩
        - 立即构成论点负面；用更低收入基数重估
      - - 酒店供应商关系终止
        - 旅行 GMV 连续两个季度下滑超过 30%
        - 旅行获客漏斗坍缩；会员增长停滞；估值倍数压缩
        - 除非 90 天内签下新供应关系，否则投资论点转负
      - - 合作银行退出
        - 卡片或现金预支功能暂停，或受到重大限制
        - 金融产品层下线；Super+ 会员价值主张受损
        - 若 60 天内没有锁定备份合作方，投资论点转负
      - - 收入同比增速降至 20% 以下
        - 在持续 40-50% 增长轨迹后，连续两个季度增速低于 20%
        - 倍数很可能压缩；6x 倍数定价基于 40-50% 增长预期
        - 重估倍数；考虑减仓
      - - CEO 离任且未指定继任者
        - 宣布 Hussein Fazal 辞任，且没有明确内部继任者
        - 品牌和投资人信心系于创始人；治理风险陡升
        - 需要董事会治理复核；关注继任计划披露
  - id: TV006
    title: 最终尽调要求表
    sourceRefs:
      - SV001
      - SV003
      - SV004
      - SV006
      - SV007
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    notes: 按投资尽调优先级排列。
    rows:
      - - 收入流拆分
        - 旅行、会员、金融产品对净收入和毛利率的分部贡献
        - 决定 6x 倍数基于高毛利经常性收入，还是低毛利旅行佣金
        - 在尽调资料室向 CFO / 财务团队索取
      - - 现金预支单位经济模型
        - 费率结构、预支额度分布、违约率、损失拨备、合作银行经济模型
        - 现金预支可能是重要收入，也暴露在 CFPB 执法风险下；需要建模下行情境
        - 向产品和财务团队索取；审阅合作银行协议
      - - Super+ 队列数据
        - 按定价层级划分的会员激活率、12 个月留存、ARPU 和套餐组合
        - 判断会员是否是耐久的经常性收入引擎，还是高流失、LTV 很薄
        - 向增长和分析团队索取
      - - 分渠道获客成本
        - 酒店到会员转化、直接会员注册、金融产品获客的 CAC
        - 验证单位经济模型，并判断当前营销支出下增长能否持续
        - 向市场和增长团队索取
      - - CFPB 和 FTC 合规状态
        - 现金预支披露架构、一键取消流程审计、资金传输牌照
        - 监管风险现实存在；合规状态决定下行情境中执法发生概率
        - 向总法律顾问索取；独立法律审查 CFPB/FTC 风险敞口
