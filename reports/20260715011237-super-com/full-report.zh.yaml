        blocks:
          - type: paragraph
            body: >-
              公开证据指向一条清晰的扩张逻辑：先用一个省钱需求获客，再把钱包份额扩到旅行、会员、金融和日常价值权益。公司因此有多条变现路径，不必依赖企业软件式先落地再扩张。最强的公开扩张证据，是面向同一个消费者身份营销的功能足够宽：从酒店，到预支现金，再到卡和处方药省钱。最大的集中风险却不是某个具名企业客户或分销商，而是相对少数付费或高频会员可能贡献了不成比例的价值。如果成立，3000
              万累计用户的重要性远低于小得多的复购同期群行为。NASCAR 合作提供了扩大品牌触达的路径，但渠道依赖、付费获客集中度和合作品牌效率没有公开拆分。因此，Super.com
              看起来有可信的消费者扩张飞轮；公开证据仍不能说明这个飞轮是否足够深、足够赚钱、足够耐久，能顶住流失或促销疲劳。
