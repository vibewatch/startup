      - number: '1.4'
        title: 牵引力、里程碑密度，以及为什么 2025–2026 年重要
        blocks:
          - type: paragraph
            body: >-
              本章最强证据集中在 2025 和 2026 年。Super.com 称，2025 年是突破年：公司实现盈利，净收入超过 $200M，且同比增长超过 50%。同一披露还显示，Super+ 接近 1M
              名会员，会员如今贡献平台上超过一半的美国酒店预订；这支持一个判断：会员已经成为公司变现飞轮的核心，而不是附带功能。更广的规模上，关于页面称超过 30M 用户信任该产品、总销售额已超过 $2B；Series D
              轮新闻稿称，2016 年以来累计为客户节省的金额已超过 $1B。NASCAR
              合作在战略上值得注意，因为它把品牌推到主流、旅行导向、重视性价比的消费者面前，而不是小众金融科技受众面前。合在一起看，这些事实支持一个判断：2025–2026 年间，Super.com 已从有创意的金融科技 /
              旅行混合体跨入规模化消费者平台区间，哪怕部分封面指标仍由公司披露、未经审计。
