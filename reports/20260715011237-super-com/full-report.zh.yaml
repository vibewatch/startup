      - number: '7.2'
        title: 运营风险：退款和订阅扣费的高投诉量已有公开记录
        blocks:
          - type: paragraph
            body: >-
              Super.com 最大的消费者侧风险，是退款和预订错误里的服务质量摩擦。PissedConsumer 聚合数据显示 1,935 条评论、平均 1.5 星、86%
              负面；大多数投诉聚焦退款被拒或延迟、酒店查不到预订，以及尝试取消后订阅扣费仍继续。Trustpilot 呈现的画面更好——58,869 条评论、4.3 星——但其 AI
              生成摘要仍把预订不匹配、价格意外和客服响应列为重复主题。结构性原因在于 Super.com 是消费者与底层 OTA
              或酒店供应商之间的旅行中介；一旦预订出错，消费者要自己面对多方协调。这样的投诉量带来三类前瞻风险。第一，CFPB 或 FTC
              一旦启动检查，监管方已有现成证据库。第二，退款、错误等高复杂度个案会让最投入的客户产生不成比例的流失。第三，NASCAR 合作如果扩到 7000 万个新的粉丝触点，客服负担可能比现有能力更快放大。
