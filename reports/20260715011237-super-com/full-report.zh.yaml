        title: 资本充足性：盈利有帮助，但公开披露仍太薄，无法排除资产负债表和信用敞口问题
        blocks:
          - type: paragraph
            body: >-
              相比许多 VC 支持的消费者金融科技公司，Super.com 的融资姿态更健康，因为公司把 2025 年盈利运营与新近 $65M Series D 轮、$1.2B
              估值结合在一起。表面看，这说明该轮是为了加速增长，而不是填补眼前流动性缺口。公开报道还把累计融资放在约 $235M 以上、员工数放在 300
              人以上，确认公司现在支撑的是一个真实运营底盘，而不是轻人手移动应用。即便如此，资本充足性仍未完全可见。Super.com
              没有公开披露手头现金、当前现金消耗或自由现金流水平、与现金预支绑定的仓储额度或项目融资义务，也没有披露卡和贷款敞口的精确资产负债表处理。如果合作银行或项目管理方吸收了大部分信用和资金负担，资本故事的风险会比乍看低得多。如果
              Super.com 保留的敞口多于公开材料暗示，公司就应接受更严厉的承销处理。盈利是一个重要正面数据点，但不能替代完整的资产负债表和或有负债审查。
