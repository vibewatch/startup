companyProfile:
  summary: >-
    Super.com（前身为 Snapcommerce）是一家起步于多伦多的消费者省钱平台，2016 年推出。COVID-19 期间，公司从聊天式酒店优惠平台转向多产品超级应用，把旅行预订、月付会员 Super+
    和嵌入式金融产品（SuperCash 担保卡、现金预支）组合在一起。到 2025 年，公司净收入达到 $200M，首次实现年度盈利，并在 30M 用户中积累约 1M 名 Super+ 会员。2026 年 7 月的 Series D
    轮估值 $1.2B，由 TPG 领投，J.P. Morgan 担任配售代理。
  foundedDate: '2016-01-01'
  founders:
