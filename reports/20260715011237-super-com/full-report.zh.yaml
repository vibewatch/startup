      role: 联合创始人兼 CEO
      background: 连续创业者；曾联合创办 AdParlor（2012 年被 Adknowledge 收购），随后创办 Snapcommerce（后更名为 Super.com）。公开形象是公司的主要愿景设定者和对外代表。
