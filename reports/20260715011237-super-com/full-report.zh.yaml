      - number: '2.4'
        title: 增长驱动与约束：宏观需求真实存在，但转化和监管将决定市场结果
        blocks:
          - type: paragraph
            body: >-
              Super.com 背后的需求逻辑有说服力。Fed 的 SHED 和 FDIC
              的银行服务不足调查持续相关，说明财务脆弱性仍足够普遍，家庭会主动寻找省钱、拉长现金流、绕开传统信贷门槛的办法。旅行也是一个庞大、正在恢复且数据清晰的消费品类，为 Super.com
              进入更广钱包关系提供了实用楔子。反过来，公司市场在结构上受三点限制。第一，大多数替代品免费，用户很容易多栖，切换成本低。第二，相比免费优惠券、返现或忠诚度工具，付费会员会缩小可触达市场。第三，组合里的 EWA
              和信用建设业务所处政策环境比旅行折扣更有争议。CFPB 2024 年提案提醒市场：组合中的金融产品部分，改变品类经济性的速度可能快于旅行部分。因此，最大的市场问题不是相邻池子是否足够大；而是 Super.com
              能否把足够多免费或偶发用户转化为稳定、付费、重复使用的家庭，同时不承担不可承受的获客或监管风险。
