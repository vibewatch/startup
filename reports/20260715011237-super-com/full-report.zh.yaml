  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：Super.com 变现的是一个从旅行开始、再扩展到会员和金融产品的消费者漏斗
        blocks:
          - type: paragraph
            body: >-
              Super.com 看起来既不是单一收入流 OTA，也不是单一产品数字银行。公开材料描述的是一套分层变现模型，围绕酒店预订、Super+
              订阅费、返现购物经济性，以及来自卡和现金预支功能的金融产品收入搭建。这个架构重要，因为每一层的质量特征不同。旅行收入很可能依赖供应商佣金、价差或抽佣率，因此比经常性软件收入更像交易平台，也更波动。会员收入可能更耐久，因为它近似订阅，但实际定价似乎不如营销标题透明。金融产品收入可能显著抬高
              ARPU，但其经济性取决于合作伙伴结构、欺诈、交换费和信用损失安排，而这些并未公开披露。因此，业务可以在增长和组合逻辑上有吸引力，同时仍因利润率构成难以被充分承销。投资人应把这个模型视作消费者
              金融科技交易平台组合包，而不是纯订阅业务；在假设 2025 年盈利里程碑已经充分去风险之前，应坚持拿到收入流级别的收入和毛利拆分。
