        title: 牵引力与定价：披露规模可信，但实际经济性仍部分藏在营销和组合包装后面
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务数据点都集中在 2025 和 2026 年。Super.com 的 Series D 轮公告称，公司净收入突破 $200M，2025 年增长超过 50%，实现盈利，会员接近 1M，总销售额超过
              $2B，并为客户节省超过 $1B。这些数字清楚表明，公司不再是尚未规模化的试验。但它们仍留下几个承销问题。“净收入”对旅行加金融科技
              公司而言有意义，但也含糊，因为它没有揭示总预订额留存、交换费分成、促销费用处理或损失准备。会员定价也有些模糊：官方材料强调透明和权益，独立评测者则提到 Super+ 每月约
              $15，并指出经济性会随结账场景和使用案例变化。这意味着规模真实存在，但公开标价不足以推断实际 ARPU、用户群组经济性，也不足以判断会员收入还是交易收入贡献了更大利润。
