      - number: '7.6'
        title: 缓释与止损标准：会改变投资论点的可观察阈值
        blocks:
          - type: paragraph
            body: >-
              若公司主动为预支现金搭建 CFPB 合规（披露费用、确保 TILA 准备就绪）、维持符合 Click-to-Cancel 的 Super+ 取消流程、多元化酒店供应商并正式制定 CEO
              接班计划，Super.com 的风险可管理。最重要的监控信号是监管备案活动（CFPB 检查通知、FTC 民事调查要求）、公共平台客户投诉趋势和会员转化率趋势。打破投资论点的触发器包括：CFPB
              执法要求重构费用，使预支现金或订阅收入下降超过 20%；主要酒店供应商流失且 90 天内无法替换；数据泄露影响超过 100 万条消费者金融记录；或 CEO
              辞任且没有具名内部接班人。公共记录看不出这些事件迫在眉睫，但考虑运营模式，它们都落在合理风险分布内。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点：有盈利的省钱超级应用和会员飞轮，对上未披露经济性与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Super.com 的乐观逻辑清楚且有证据支撑。公司已经盈利，年增长 50%，付费会员接近 100 万，并搭建出少见的多产品消费者平台（旅行省钱 + 消费者金融科技 +
              会员），能够形成多层变现和自然留存循环。公司穿越 COVID-19 完成转向，随后做到 $200M 净收入，证明了业务韧性。2026 年 7 月，TPG 领投 Series D，估值 $1.2B；TPG
              是熟悉消费行业的成熟私募股权机构，这为增长叙事提供了独立背书。NASCAR 合作显示公司想打入美国主流消费者，新任高管（CPO Ryan Fujiu、总法律顾问 Michele Lee）也带来了
              Uber、Bird 和 Pinterest 的平台规模化经验。

              悲观逻辑不在于产品是否真实，而在于未披露经济性一旦可见会揭示什么。Super.com 没有披露收入流组合（旅行、会员、金融产品各占多少）、各业务线毛利率、获客成本，或预支现金费用和违约结构。CFPB EWA
              规则制定与 FTC 订阅执法的监管暴露，可能同时伤到三条收入流中的两条。Super+ 3.3% 的转化率（3000 万用户中 100
              万会员）意味着增长要么依赖转化率大幅改善，要么继续投入漏斗顶端。私募市场估值对应 6x 收入倍数，也意味着未来投资者——或最终收购方——要在今天价格上再付溢价，才有机会获得有吸引力的回报。

              最诚实的综合判断是：业务质量看起来真实，但尽调负担足够高；没有管理层披露前，还无法给出高置信度买入建议。
