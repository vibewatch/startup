      - number: '5.2'
        title: 工作流与用例：理想路径从一个省钱时刻开始，并试图复利成重复互动
        blocks:
          - type: paragraph
            body: >-
              最可见的公开工作流，从发现酒店优惠、购物优惠或现金流问题开始，随后进入应用注册引导和权益激活。消费者进入产品后，Super.com 会试图把这次偶发互动转化为更广的组合使用。旅行者可以先看到酒店折扣，再加入
              Super+，随后遇到现金预支或卡工具，再回来使用返现、游戏或处方折扣。公司页面暗示，这种交叉销售逻辑是运营模型的核心：一次省钱事件应当证明下一次省钱事件合理，应用也应不断浮现增量省钱方式。应用商店列表也支持这个解读，因为它在一个体验中宣传多个品类，而不是一个线性的待办任务。这同时创造机会和风险。机会是比单一功能应用更高的频次和更强留存。风险是，带着一个简单需求来的消费者可能觉得组合太宽、太不透明。因此，产品成功和功能数量一样依赖编排与清晰度。
