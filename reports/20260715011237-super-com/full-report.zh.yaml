chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起点与当下商业模式
        blocks:
          - type: paragraph
            body: >-
              理解 Super.com，最清晰的方式是看它围绕同一个宽泛消费者任务不断主动转向：帮价格敏感家庭少花钱。公司 2016 年由 Hussein Fazal 和 Henry Shi 以 SnapTravel
              之名创立，最初做的是聊天驱动的酒店预订产品，面向消息界面，而不是传统 OTA 界面。2020 年，管理层把视野从旅行拓宽到更大消费场景，业务变成 Snapcommerce；2022 年 10 月，公司又更名为
              Super.com，把旅行折扣、返现、信用建设、现金预支和其他省钱功能明确放进同一把伞下。公司当前自有界面在大命题上保持一致，哪怕部分精确指标有所差异：关于页面称它是一款覆盖省钱、赚钱、旅行和信用支持的一体化应用；应用商店则把同一体验包装成金融导向的超级应用。因此，产品范围比
              OTA 更宽，但仍比亚洲式全能超级应用窄：它是围绕消费者反复钱包需求组织起来的省钱型超级应用。这个定位很重要，因为后续章节应把旅行视为获客楔子，而不是整个业务。
