            body: >-
              公开满意度信号分化，但有参考价值。该应用在 Apple 和 Google
              应用商店都有大量评分，独立评论聚合网站也显示评论量不低。好评常集中在感知到的酒店性价比、返现，以及把多种省钱工具放在一个入口的便利性。差评则集中在客服、预订 /
              退款摩擦、信用报告预期、会员说明清晰度，以及承诺权益与用户实际体验之间的滞后。这个分裂很关键：Super.com
              的客户风险不在首次好奇，而在重复使用中的预期管理。只要促销和付费获客不断补充漏斗，消费者产品即便流失偏高也能快速增长。公开记录缺少的是真正的留存核心：会员续费、重复预订频率、跨模块附着率、总收入留存，或把纯旅行用户与更广泛捆绑包采用者拆开的同期群视图。评分证明产品有触达，也有一部分用户喜欢；但评分证明不了经济性持久。
