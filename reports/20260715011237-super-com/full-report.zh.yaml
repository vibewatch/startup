          detail: 6x 收入倍数，对比 Ibotta 2x；增长支撑溢价，但分部利润率未知
        - id: e
          label: 披露缺口
          detail: 分部收入、毛利率、CAC 或现金预支经济性均未公开
        - id: f
          label: 跟踪 / 继续研究
          detail: 方向性论点强；证据不完整，无法给出高置信买入
      edges:
        - from: a
          to: f
          label: 强支撑
        - from: b
          to: f
          label: 支撑
        - from: c
          to: f
          label: 压制信心
        - from: d
          to: f
          label: 缺少利润率证明，估值偏紧
        - from: e
          to: f
          label: 阻止上调
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在 2026E 收入固定为 $250M（基础情景中点）时，Super.com 隐含估值对收入倍数的敏感性。
    sourceRefs:
      - SV001
      - SV008
      - SV009
    claimRefs:
      - CV007
      - CV008
      - CV015
    data:
      items:
        - label: 2x 收入（Ibotta 悲观可比）
          value: 0.5
        - label: 4x 收入（监管受损）
          value: 1
        - label: 6x 收入（当前 Series D）
          value: 1.5
        - label: 8x 收入（基础退出）
          value: 2
        - label: 10x 收入（乐观退出）
          value: 2.5
        - label: 12x 收入（重估溢价）
          value: 3
    approximationNotes: 收入基准 $250M 是 2026 年中点估算，依据是 2025 年收入 $200M 以及 50%+ 增长轨迹；实际 2026 年收入未公开。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Super.com 2027-2028 年退出时的乐观、基础和悲观估值区间，基于情景分析。
    sourceRefs:
      - SV001
      - SV002
      - SV008
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
    data:
      items:
        - label: 悲观情景（$B 估值）
          low: 0.88
          mid: 1.05
          high: 1.2
        - label: 基础情景（$B 估值）
          low: 1.6
          mid: 2
          high: 2.5
        - label: 乐观情景（$B 估值）
          low: 2.5
          mid: 3
          high: 3.5
        - label: Series D 进入估值（$B）
          low: 1.2
          mid: 1.2
          high: 1.2
    approximationNotes: 所有区间都是模型估算，依据公开收入、增长和可比公司数据；无法获得管理层指引和私人财务数据。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 基于公开证据，对七个尽调维度给出 IC 可用评分。
    sourceRefs:
      - SV001
      - SV002
      - SV003
      - SV007
      - SV008
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV022
    data:
      items:
        - label: 市场机会
          value: 7/10
          context: 美国价值型消费者省钱市场规模大，服务不足
        - label: 业务证明
          value: 8/10
          context: $200M 收入、50%+ 增长、已盈利、1M 会员
        - label: 产品护城河
          value: 6/10
          context: 多产品组合；没有自有库存
        - label: 单位经济性
          value: 5/10
          context: 盈利已确认；分部利润率未披露
        - label: 风险画像
          value: 4/10
          context: 活跃 CFPB/FTC 监管风险；伙伴依赖
        - label: 估值纪律
          value: 5/10
          context: 6x 收入倍数；缺少分部利润率证明，估值偏紧
        - label: 证据质量
          value: 5/10
          context: 增长已确认；单位经济性和结构不透明
