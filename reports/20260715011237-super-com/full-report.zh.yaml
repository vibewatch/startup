        blocks:
          - type: paragraph
            body: >-
              正确的财务结论既不是全盘怀疑，也不是盲目接受 Series D 轮叙事。Super.com 显然已经达到值得认真研究的规模：$200M+ 净收入、50%+ 增长、盈利、接近 1M
              名会员，在消费者旅行金融科技组合包中并不常见。公司也受益于一种能在多个消费者时刻复利价值的商业模式，而不是依赖一个狭窄省钱工具。但投资人仍缺少几块高置信承销所需的拼图。公开记录没有提供收入流级别贡献、按业务线划分的毛利率、按渠道划分的
              CAC / 回本、会员流失，或详细信用损失与欺诈数据。正因为这些缺口会直接决定公司应按强消费者订阅平台、有中等抽佣率耐久性的交易平台，还是风险更高的
              金融科技混合体来估值，尽调负担仍然很高。当前证据支持对规模和效率的正向方向性判断，但没有管理层披露，仍不足以做精确回报建模。
