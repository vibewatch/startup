            body: >-
              产品比较是一组广度与深度的取舍。Super.com 不常见之处在于，它把酒店折扣、付费省钱会员、返现、信用建设和现金预支放进同一个界面。这个广度真实存在；其旗舰酒店价值主张——酒店最高省 50%、返现
