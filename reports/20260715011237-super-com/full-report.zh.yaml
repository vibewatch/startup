      - number: '7.3'
        title: 合作伙伴依赖风险：酒店供给、合作银行和应用商店分发都是单线依赖
        blocks:
          - type: paragraph
            body: >-
              Super.com 的旅行业务依赖未具名 OTA 或供应商合作提供的折扣酒店库存。2020 年 COVID-19 阶段把这种脆弱性暴露得很具体：CEO Fazal
              公开称，旅行需求崩塌时业务转为「负数」——取消量超过预订量——迫使公司搭建多产品捆绑包。今天，酒店预订仍是 Super+
              会员转化的主要获客漏斗，意味着供给侧任何严重中断都会同时影响旅行收入和会员增长。第二个依赖是支撑 Super.com
              担保型签账卡和预支现金功能的合作银行。银行合作方未公开具名；如果退出或改条款，金融产品层会在所有 Super+ 会员中下线。第三个依赖是应用商店分发：Apple App Store 和 Google Play
              都可能限制金融产品营销、提高订阅抽成（Apple 30% 的应用内抽成是结构性利润率压力），或改变可发现性，从而推高有效获客成本。
            claimRefs:
