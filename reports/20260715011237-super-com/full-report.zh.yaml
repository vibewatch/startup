      - number: '8.2'
        title: 估值背景：以 2025 年净收入 6x 对应 $1.2B，是相对低迷公开可比倍数的成长溢价
        blocks:
          - type: paragraph
            body: >-
              Super.com 2026 年 7 月的 $1.2B 估值，约等于其披露的 2025 年 $200M 净收入的 6.0x。要判断这个倍数是有吸引力、公允还是偏高，最相关的公开可比公司是 Ibotta
              Inc.（股票代码 IBTA），即最大的公开上市消费者返现和促销金融科技公司。截至 2026 年 7 月 14 日，Ibotta 市值为 $700M，财年 2025 收入为 $342.4M——约 2x
              收入。不过，Ibotta 2025 年收入低于上一年，也面临自身监管和集中度风险；其市值已从 2024 年底 $1.8B 大幅下跌，部分原因是 2025 年 4 月提起的证券集体诉讼。

              更适合解释 Super.com 定价逻辑的参考，是那些同时奖励增长和盈利的收购与私募市场可比案例。PayPal 2019 年以 $4B 收购 Honey，当时这家浏览器返现平台的估值估计为收入的
              30-40x——但那是高倍数时代的战略收购溢价。Rakuten 整体业务（包括金融服务和电商）让直接倍数比较变得困难。Amazon Prime 对 Amazon 生态的价值——一个带动 $1T+ GMV
              的亏损引流型会员——更像愿景型可比，而不是交易价格。

              对一家高增长、已盈利、带会员飞轮的消费者金融科技公司来说，私募市场 6x 收入倍数既不极端，也不便宜。它意味着，如果 2027 年退出（距今 1 年）时按当前 $300M+ 收入运行率（外推 50% 增长）的
              10x 估值，估值可能达到 $3B+——12-18 个月里实现 2.5x 台阶式提升。只要增长持续，这可以做到；但前提是没有重大监管扰动或宏观逆风。
