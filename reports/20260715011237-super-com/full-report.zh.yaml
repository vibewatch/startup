      - number: '1.3'
        title: 融资历史、估值与融资结构
        blocks:
          - type: paragraph
            body: >-
              资本历史在标题层面很直观，但边缘细节并不干净。Super.com 早期最能相互印证的机构融资里程碑是 2021 年 3 月的 Series B 轮，当时 Snapcommerce 融资 $85M，由 Inovia
              Capital 和 Lion Capital 领投。下一步是 2023 年 4 月的 Series C 轮；TechCrunch 称其为 $60M 股权融资加 $25M 信贷额度，BetaKit 则称这是
              2022 年更名后宣布的 $85M Series C 轮。到 2026 年 7 月，公司拿到公开历史上最清晰的估值锚：TPG 领投 $65M Series D 轮，估值 $1.2B。BetaKit
              补充称，该轮包含一级和二级资本，并采用全股权结构。仍未解决的是，按同口径计算的生命周期累计融资额到底是多少。有些来源强调全股权总额；另一些来源把债务额度或轮次口径并入。尽调时，关键读数不是精确累计数字，而是模式：Super.com
              一再找到愿意押注其消费者金融加旅行命题扩张的投资人；2026 年独角兽轮也发生在公司已经披露盈利之后，而不是之前。
