      - number: '8.3'
        title: 情景分析：乐观情形奖励会员渗透；悲观情形是监管导致收入受损
        blocks:
          - type: paragraph
            body: >-
              乐观情形假设 Super.com 到 2027 年维持 40-50% 收入增长，Super+ 会员达到 200 万，且没有重大 CFPB 执法行动。在这些假设下，2026 年底收入达到
              $280-300M，平台按正常化 8-10x 成长期倍数可接近 $2-3B 估值，相对 Series D 价格带来 2-2.5x 回报。基准情形假设收入增长 25-35%、会员稳步推进、没有执法，但公司接近
              IPO 或出售准备时倍数小幅压缩——意味着 2027-2028 年退出估值为 $1.8-2.2B。悲观情形包括 CFPB 执法要求重构预支现金费用，使该收入流减少
              20-30%；同时酒店供给摩擦拖慢会员获取，导致收入增速降至 20% 以下，并按 $220-240M 收入重估至 4-5x——对应 $880M 到 $1.2B 区间，约等于 Series D
              价格持平。把悲观情形当作底线的投资者，本质上是在用低个位数年化回报换取悲观情形保护。
