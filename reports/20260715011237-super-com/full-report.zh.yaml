      - number: '1.2'
        title: 领导层、治理与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Super.com 仍由创始人带队。Hussein Fazal 依然是公司的公众面孔，Henry Shi 继续维持创始人连续性；公开记录则显示，公司是在加深管理梯队，而不是替换创始人。2026 年 Series
              D 轮公告补上了三个重要人才信号：Harley Finkelstein 加入，担任董事会观察员和顾问；Ryan Fujiu 出任产品负责人；Michele Lee
              加入担任总法律顾问。高级管理层看起来更厚了，但关键人集中度并未消失，因为公司叙事、融资故事和产品愿景仍主要通过 Fazal 传递。地域布局也呈现同样的连续性加扩张。独立报道显示，公司在 2022
              年底把总部从多伦多迁至旧金山，但招聘材料仍把多伦多列为真实运营据点，并与旧金山、纽约一起纳入远程优先模式。实际看，Super.com
              像是一家加拿大创立的公司，如今在美国管理消费者规模，同时保留多伦多人才基地。Series D 轮后的确切董事会名单在公开来源中仍只露出一部分，因此治理控制仍是尽调事项，而不是已完全验证的事实。
