      - number: '2.3'
        title: 买方地图：同一个家庭既是买方、用户也是付款方，因此信任和时点比销售动作更重要
        blocks:
          - type: paragraph
            body: >-
              Super.com
              不卖给采购部门。用户、买方和付款方通常是同一个家庭，甚至同一个人，这改变了采用发生的方式。用户可能先因为酒店价格而来，随后看到更低的会员价，再判断预期旅行省下的钱和相邻权益是否足以覆盖会员费。之后，同一用户会根据家庭压力所在，评估现金预支、返现或信用建设功能。因此，采用路径高度依赖场景，也带周期性：公司必须在家庭订旅行、寻找更便宜娱乐或短期缺流动性的一刻出现。这也意味着免费替代品永远只隔一个点击。Rakuten、Honey
              和 Capital One Shopping 抢的是结账瞬间；OTA 和忠诚度计划抢的是旅行预订瞬间；Dave、Chime 和 Branch
              抢的是流动性或信用修复瞬间。只有当消费者相信一个会员能胜过自己拼接这些免费或专业替代方案时，Super.com 的组合包才会赢。这正是公司试图证明的买方侧核心机制。
