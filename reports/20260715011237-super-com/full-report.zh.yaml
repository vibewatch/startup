  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：Super.com 同时面对专业工具、既有巨头和单一任务型应用
        blocks:
          - type: paragraph
            body: >-
              Super.com 的正确竞争集合，比新闻稿里最常被提到的名字更宽。消费者可以用 Rakuten、Honey、Capital One Shopping 或 Ibotta 这样的返现 /
              优惠券工具解决同一任务；也可以用 Hotels.com、Expedia 或 Booking 这样的旅行既有平台；还可以用 Dave、Chime 或 Branch
              这样的财务健康应用。每类竞争对手只攻击问题的一部分，但多数在自己的楔子上更深。Rakuten 和 Honey 主导结账省钱，旅行既有平台主导酒店库存和忠诚度信任，数字银行
              式产品主导流动性或信用建设清晰度。Super.com 的赌注是，一个应用加一个会员，能把这些时刻中足够多的部分拉到一起，成为消费者默认的“省钱”目的地。因此，核心竞争问题不是 Super.com
              有没有竞争对手——显然有——而是组合包能否创造足够日常效用，打败由免费专业工具拼成的一套栈。
