  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险：CFPB EWA 规则制定与 FTC 订阅执法带来现实合规暴露
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年，Super.com 正处在两条活跃监管战线的交汇处：工资预支 / 小额信贷，以及经常性订阅透明度。CFPB 于 2024 年 7 月 18
              日提出解释性规则，拟将工资预支产品——包括应用内预支现金——归类为 Truth in Lending Act 下的信贷，从而要求 APR
              披露、费用透明和发放要求；多数应用预支服务商目前不需要承担这些要求。规则若最终落地，Super.com 必须实质性调整预支现金功能的收费模型和披露架构。FTC 在 2024 年 10 月敲定
              Click-to-Cancel 规则，要求取消订阅和注册一样容易——这直接适用于 Super+。行业层面的执法先例已经很具体：2024 年 11 月，FTC 在联邦法院起诉预支现金直接竞争对手 Dave
              Inc.，指控其对最高 $500 的预支做欺骗性营销、未披露加急费用，并收取非自愿小费。Dave 的目标消费者被描述为「财务脆弱」——这正是 Super.com 明确服务的人群。尚未发现针对 Super.com
              的直接监管行动，但 Dave 先例叠加 CFPB 正在推进的规则制定，使其成为最高优先级监控风险。
