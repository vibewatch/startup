  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Super.com 位于旅行、省钱和次贷友好的金融科技交汇处
        blocks:
          - type: paragraph
            body: >-
              Super.com 很难用一个熟悉的市场标签来估算规模，因为产品横跨三个相邻需求池。第一是旅行省钱，应用通过酒店优惠和旅行折扣购物获客。第二是购物奖励和返现，消费者会拿它与
              Rakuten、Honey、Capital One Shopping、Ibotta 等免费工具比较。第三是面向月光型家庭的财务健康，现金预支、信用建设和小额流动性功能会更直接地与
              Dave、Chime、Branch 竞争。因此，正确的市场边界既包括消费端省钱，也包括贴近资产负债表的消费者金融行为。这也是为什么仅把 Super.com 叫作 OTA
              会低估其模式，而把它叫作泛金融科技又会高估其银行产品栈深度。更准确的理解是：一个捆绑式消费者省钱平台，用旅行获客，用会员变现，用金融科技
              式工具提高留存并扩大钱包份额。这个边界逻辑很关键，因为每个相邻市场的增长驱动、利润率、监管负担和竞争动态都不同。
