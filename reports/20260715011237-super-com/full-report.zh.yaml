        title: 架构与依赖：公开招聘信号暗示真实平台型组织，但公司仍把技术栈留在私域
        blocks:
          - type: paragraph
            body: >-
              Super.com 没有发布开发者门户、公开 API
              参考或正式技术架构概览，因此只能从产品行为和招聘信号推断技术栈。这些信号仍有用。工程岗位提到平台工作、核心体验负责范围，以及支撑大规模消费者产品界面的需求。公司的 Series D 轮信息强调 AI
              驱动省钱，这意味着多个省钱产品之上存在一层决策或推荐层。iOS 和 Android
              上的公开应用分发足迹，加上旅行和金融功能广度，也暗示后端偏服务化，具备身份、定价、支付、实验、支持和数据能力。不过，上述内容不应被误当作已验证的架构细节。公开证据没有确认云厂商、数据仓库、ML
              工具、可观测性栈或第三方风险控制。更好的结论是：Super.com 明显运营着一个不简单的软件平台，但最强技术主张仍来自推断，应在尽调中被压测，而不是只凭招聘语言接受。
