  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：Super.com 卖的是整合式省钱工作流，而不是单独的旅行或金融科技功能
        blocks:
          - type: paragraph
            body: >-
              Super.com
              的公开界面持续把产品定位为一款集省钱、赚钱和旅行于一体的应用。这个定位重要，因为它改变了产品分析方式。核心用户承诺不只是“更便宜地订酒店”或“拿到现金预支”；而是一个应用能捕捉重视价值的消费者想拉长现金流的多个时刻。旅行仍是最强的公开楔子，但公司如今把
              Super+ 会员、返现购物体验、现金预支、信用建设卡功能和处方折扣权益放进同一把伞下。结果是，一个产品组合更像有多个频次杠杆的消费者组合包，而不是纯 OTA
              或纯数字银行。公开应用商店描述和公司页面也强化了同一判断：体验以移动端为主、面向消费者、围绕权益展开。因此，产品命题不太取决于某个突破性算法，而更取决于运营界面能否把用户从一个省钱需求引向下一个，同时不过度增加复杂度或客服负担。
