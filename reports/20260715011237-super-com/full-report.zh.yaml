        - 在一个应用和 Super+ 层里打包权益
        - 如果捆绑包常用，可降低切换应用的摩擦
        - 品类广度会增加解释和支持复杂度
      - - 弥补发薪日前的现金缺口
        - 依赖透支、发薪日应用，或亲友支持
        - 在同一个应用内提供会员现金预支
        - 可加深产品在旅行之外的使用价值
        - 损失 / 资金经济性未公开可见
      - - 谨慎消费同时建立信用
        - 使用单独的担保卡或信用建设应用
        - 在省钱品牌下提供卡 / 信用建设工具
        - 留存和 LTV 有扩张潜力
        - 合作伙伴模式和审批机制不透明
      - - 节省处方药开支
        - 使用独立折扣计划
        - 在同一品牌伞下提供 RX 折扣
        - 将省钱承诺延伸到医疗支出
        - 采用率和经济性未披露
      - - 两次旅行之间回访
        - 等到下一次酒店需求
        - 用返现、优惠、游戏和金融工具提高使用频率
        - 可能提高互动和交叉销售机会
        - 如果编排弱，体验可能显得分散
