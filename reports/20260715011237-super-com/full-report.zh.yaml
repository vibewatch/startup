            body: >-
              反向观点很直接。消费者可以低摩擦地同时使用结账工具、旅行 OTA
              和数字银行。免费产品会压低付费意愿。更大的旅行既有平台可以在忠诚度和库存上砸更多钱。更大的金融应用可以在品牌和监管基础设施上砸更多钱。公开记录仍未显示那种能阻止竞争对手匹配可见消费者报价的独家供应商准入或专有分发。正向观点是，组合包本身可能成为护城河，前提是家庭反复发现一个会员能在多个品类上回本。但这仍是假设，不是已经被公开证明的事实。验证它所需的证据，不是更多功能营销，而是用户群组
              留存、交叉销售附着率、重复预订行为和供应商经济性。在这些证据出现前，竞争耐久性故事应被视为有希望但尚未定论。
