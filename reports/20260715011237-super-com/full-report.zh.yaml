      - number: '2.2'
        title: 规模口径：旅行楔子很大，但真正可服务市场更窄
        blocks:
          - type: paragraph
            body: >-
              公开数据让一点很明显：广义旅行经济足够大，Super.com 在漏斗顶部不会撞上品类天花板。BEA 报告称，2023 年旅游增加值为 $840B，相当于 GDP 的 3.03%，旅游相关总产出为
              $2.64T。但如果把这个大数当作 Super.com 的
              TAM，就太宽了。旅行经济中很大一部分并不现实地可被一个从酒店优惠起步、再试图交叉销售金融功能的付费省钱会员触达。更严格的口径是公司的住宿加预订楔子。BEA 约 $239B 的旅行者住宿产出，加上约 $84B
              的旅行安排和预订服务，意味着在加入现金预支或返现相邻业务之前，更相关的可服务消费池约为 $323B。即便这个 SAM 也只是消费池，不是现实收入机会。Super.com 当前 SOM
              更适合用牵引力来描述——净收入超过 $200M、会员接近 1M——而不是用宣称的市场份额来描述。这里的纪律是克制：不能因为应用最终可以把用户指向每个相邻消费者钱包品类，就把它们全算进同一个 TAM。
