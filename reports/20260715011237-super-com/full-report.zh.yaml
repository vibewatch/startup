      - number: '4.3'
        title: 单位经济性与利润率路径：公开信号有建设性，但关键驱动仍停留在模型里而非披露中
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个有建设性但不完整的单位经济性故事。如果 Super.com 在累计销售额超过 $2B 的基础上，于 2025 年产生超过 $200M
              净收入，业务已经证明消费者意图变现可以扩展到远超小众优惠券应用的规模。2025
              年盈利也说明，相比早期增长年份，贡献利润率已有实质改善。即便如此，几乎所有重要变量仍属私有。投资人看不到按收入流拆分的公开毛利率桥、会员到免费用户的转化曲线、按渠道划分的获客成本，也看不到现金预支和卡产品的欺诈与信用损失画像。即便“接近
              1M 名会员”这个数字，也留下定价和流失问题。像 Super.com
              这样的组合包，如果旅行是把用户高效导入高留存会员群组的获客漏斗，会显得很强；但如果折扣和促销承担了大部分工作、付费转化仍薄，业务会弱很多。因此，本章呈现的是：标题规模数字可信且正面，但真正的投资判断仍取决于私有
              用户群组和毛利数据。
