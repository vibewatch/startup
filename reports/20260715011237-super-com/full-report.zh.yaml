      - number: '8.5'
        title: 建议：高优先级跟踪；业务质量真实，但估值需要未披露数据证明
        blocks:
          - type: paragraph
            body: >-
              基于证据的建议是跟踪 / 继续研究。这不是放弃——对于这个细分里的公司，Super.com 的业务质量、增长轨迹和领导梯队确实令人印象深刻。这个建议承认的是，$1.2B
              估值要求的尽调门槛，高于当前公开证据能支撑的水平。具体说，投资者需要看到收入和毛利率的分流数据、预支现金费用和损失经济性、Super+ 会员同期群数据（激活、留存、ARPU），以及公司面对 CFPB 和 FTC
              暴露的合规路线图，之后才有理由给出高置信度买入建议。若管理层披露显示会员毛利率高于 50%、同期群留存强，估值就有吸引力。若披露显示预支现金收入占收入超过
              30%，且短期面临费用重构，估值就偏高。仅凭当前公开记录，结果方差太大，不能买入——因此应跟踪。风险评级为高，置信度为中，在完整披露前估值立场偏高。
