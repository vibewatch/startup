      - number: '8.4'
        title: 退出准备度与尽调诉求：IPO 或战略收购可信，但不是近期事件
        blocks:
          - type: paragraph
            body: >-
              Super.com 目前并不具备马上 IPO 的状态。公司从未披露季度财务，没有当前形态下的公开审计历史，公开沟通中也没有具名 CFO，仍按私募市场披露标准运营。不过，Series D 结构（J.P.
              Morgan 担任独家配售代理，Osler 和 Skadden
              担任法律顾问）显示公司已使用机构级顾问，可能在为未来流动性事件做准备。最可能的退出路径是战略收购：可能是寻求消费者超级应用能力的大型美国银行或金融机构（Capital One 或
              JPMorgan），也可能是大型旅行平台（Booking Holdings 或 Expedia，寻求嵌入金融的忠诚度层），还可能是寻求省钱 + 会员捆绑包的大型零售商或市场平台。若公司达到 $300M+
              收入、持续盈利，并能满足机构投资者对分部级披露的要求，2027-2028 年窗口 IPO
              可信。任何投资或收购决策前，主要尽调缺口是未公开的一组财务指标：按收入流拆分的收入、毛利率、预支现金经济性，以及按渠道拆分的获客成本。
