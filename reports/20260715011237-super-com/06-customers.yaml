  - id: TU003
    title: "Named customer proof table"
    enumerationScope:
      coverage: sample
      basis: Representative public customer-proof sample assembled from official review pages, app stores, and partnership surfaces as of July 2026. Consumer identities are often pseudonymous or partner-based rather than full legal names, so the table emphasizes verifiable public proof rather than audited customer references.
    sourceRefs: [SU006, SU007, SU008, SU009, SU010, SU011, SU013, SU022]
    claimRefs: [CU016, CU017, CU018, CU019, CU020, CU021, CU022]
    columns: [Customer / proof item, Segment, Deployment / use case, Production vs pilot, Outcome / evidence, Limitation]
    notes: Consumer apps rarely publish enterprise-style customer references; this table treats public partnership proof and named review surfaces as the best available evidence set.
    rows:
      - [NASCAR, Mass-market partner audience, Official savings-partner activation and co-marketing, Production, Validates national consumer-brand relevance, Partnership reach does not prove retention or monetization]
      - [Apple App Store reviewer community, Mobile consumers, Live app use across travel cashback card and cash-advance features, Production, Large ratings footprint with detailed qualitative feedback, Review identity and cohort quality are unverified]
      - [Google Play reviewer community, Android mobile consumers, Live app use across bundle features, Production, Confirms Android-side usage and product breadth, No clean linkage to paid-member economics]
      - [Trustpilot and review-site customers, Travel and membership users, Post-purchase and service feedback, Production, Shows both value perception and support friction, Highly self-selected and noisy sample]
  - id: TU004
    title: "Retention / repeat usage / satisfaction table"
    sourceRefs: [SU004, SU009, SU010, SU011, SU012, SU013, SU014, SU015, SU016, SU017, SU018, SU019]
    claimRefs: [CU023, CU024, CU025, CU026, CU027, CU028, CU029]
    columns: [Metric / indicator, Value / observation, Segment, Confidence, Diligence ask]
    notes: Satisfaction proxies are visible; true cohort retention is not. Complaint surfaces matter because support and billing clarity are central to repeat consumer trust.
    rows:
      - [Apple App Store rating, 4.7/5 and 44K ratings on review page, iOS users, high, Need rating trend by app version and by feature cohort]
      - [Google Play live review surface, Large active listing and user-feedback volume, Android users, medium, Need installs MAUs and feature-specific review clustering]
      - [Trustpilot sentiment, Strong headline rating but mixed issue-specific comments, Mixed consumers, medium, Need complaint themes mapped to churn or refunds]
      - [JustUseApp sentiment, Mix of praise for deals and serious travel-service complaints, Mixed consumers, medium, Need incidence rate of refund or double-charge issues]
      - [BBB customer reviews / complaint context, Complaint process and response matter as much as count, Support-affected users, medium, Need complaint resolution rate and time-to-resolution]
      - [Member retention / churn, Not publicly disclosed, Super+ members, N/A, Need renewal and cohort churn by signup month]
      - [Repeat booking frequency, Not publicly disclosed, Travel users, N/A, Need repeat-booking rate and frequency by cohort]
  - id: TU005
    title: "Expansion and concentration risk table"
    sourceRefs: [SU001, SU002, SU003, SU006, SU016, SU020]
    claimRefs: [CU030, CU031, CU032, CU033, CU034, CU035, CU036]
    columns: [Expansion driver, Concentration risk, Impact, Diligence path]
    notes: Consumer concentration here is about behavioral concentration, not dependence on one enterprise logo.
    rows:
      - [Travel-to-membership conversion, Low conversion from large free user pool to paying cohort, Can make top-line reach look healthier than revenue quality, Request conversion funnel and member activation data]
      - [Membership-to-finance cross-sell, Finance adoption may be concentrated in a smaller cohort than travel usage, Revenue mix can skew toward a narrow high-LTV slice, Request attach rates by feature and cohort]
      - [Mass-market brand partnerships, Channel lift may rely on a few expensive awareness initiatives, Could raise CAC if partnerships are not efficient, Request paid-media and partnership CAC by source]
      - [App-store distribution, Discovery and updates depend on Apple and Google policies, Platform friction can impair acquisition and support, Request organic vs paid install mix and app-store dependence]
      - [Support-intensive travel issues, Service problems can disproportionately damage repeat usage, Travel refunds and booking errors can poison member trust, Request complaint themes tied to repeat-booking behavior]
      - [Broad but shallow feature usage, Many users may use only one module, Bundle economics weaken if cross-sell stays low, Request feature usage distribution for paid vs free users]
  - id: TU006
    title: "Customer-proof evidence quality table"
    sourceRefs: [SU007, SU008, SU009, SU010, SU011, SU012, SU013, SU022]
    claimRefs: [CU016, CU018, CU020, CU022]
    columns: [Proof surface, Evidence freshness, Outcome specificity, Independence, Main caveat]
    notes: This extra table separates evidence existence from evidence quality, which is essential for a consumer app with abundant but noisy testimonials.
    rows:
      - [Official reviews pages, Current, Low-Medium, Company-collected, Curated and not a neutral sample]
      - [App Store ratings and reviews, Current, Medium, Platform-third-party, High volume but identities and cohort economics are opaque]
      - [Google Play listing and reviews, Current, Medium, Platform-third-party, Large surface but not enough to infer paid retention]
      - [Trustpilot SmartCustomer and JustUseApp, Current, Medium, Independent, Highly self-selected complaint-heavy tails]
      - [BBB review and complaint surface, Current, Medium, Independent, Complaints matter but volume alone can mislead without company-size context]
