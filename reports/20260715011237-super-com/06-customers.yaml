  claims:
    - { id: CU001, statement: 'Super.com primarily targets value-conscious consumers rather than enterprise buyers.', type: inferred, topic: target-customer, sourceRefs: [SU001, SU002, SU024], confidence: medium, freshness: current }
    - { id: CU002, statement: 'The core buyer, user, and payer are usually the same person in Super.com’s customer model.', type: inferred, topic: buyer-user-payer, sourceRefs: [SU002, SU003, SU024], confidence: medium, freshness: current }
    - { id: CU003, statement: 'Travel-value seekers are the most visible acquisition segment in public materials.', type: company-claimed, topic: travel-segment, sourceRefs: [SU002, SU004, SU005], confidence: medium, freshness: current }
    - { id: CU004, statement: 'Paid Super+ members are likely the most financially important visible customer cohort.', type: inferred, topic: member-segment, sourceRefs: [SU001, SU003, SU023], confidence: medium, freshness: recent }
    - { id: CU005, statement: 'Cash-flow-stressed and credit-building users represent important adjacent customer jobs beyond travel.', type: company-claimed, topic: finance-segment, sourceRefs: [SU002, SU025, SU026], confidence: medium, freshness: current }
    - { id: CU006, statement: 'The public record does not cleanly separate travel-only users from broader bundle adopters.', type: observed, topic: segmentation-gap, sourceRefs: [SU001, SU002], confidence: medium, freshness: current }
    - { id: CU007, statement: 'Customer quality likely varies materially across modules even though public messaging treats the audience as one broad group.', type: inferred, topic: cohort-quality, sourceRefs: [SU001, SU016, SU025], confidence: medium, freshness: current }
    - { id: CU008, statement: 'Super.com publicly states that it has more than 30 million users.', type: company-claimed, topic: user-scale, sourceRefs: [SU001, SU020], confidence: high, freshness: recent }
    - { id: CU009, statement: 'Super.com publicly states that it has nearly one million members.', type: company-claimed, topic: member-scale, sourceRefs: [SU001, SU020], confidence: high, freshness: recent }
    - { id: CU010, statement: 'Super.com publicly states that total sales have exceeded $2 billion.', type: company-claimed, topic: sales-scale, sourceRefs: [SU001], confidence: medium, freshness: recent }
    - { id: CU011, statement: 'Super.com publicly states that it has delivered more than $1 billion of consumer savings since launch.', type: company-claimed, topic: consumer-savings, sourceRefs: [SU001], confidence: medium, freshness: recent }
    - { id: CU012, statement: 'Apple review volume shows a large public engagement footprint for the app.', type: observed, topic: appstore-scale, sourceRefs: [SU004, SU009], confidence: medium, freshness: current }
    - { id: CU013, statement: 'Android also appears to be a meaningful customer channel alongside iOS.', type: observed, topic: android-scale, sourceRefs: [SU005, SU010], confidence: medium, freshness: current }
    - { id: CU014, statement: 'The NASCAR partnership supports a mass-market customer-acquisition ambition rather than a niche travel-app posture.', type: third-party-reported, topic: brand-reach, sourceRefs: [SU006, SU020], confidence: medium, freshness: recent }
    - { id: CU015, statement: 'The largest public adoption numbers are cumulative or headline figures, not active-user or cohort-retention disclosures.', type: observed, topic: adoption-gap, sourceRefs: [SU001, SU020], confidence: medium, freshness: current }
    - { id: CU016, statement: 'Consumer-app customer proof for Super.com is dominated by app-store review-site and curated-testimonial evidence rather than enterprise case studies.', type: observed, topic: proof-shape, sourceRefs: [SU007, SU008, SU009, SU011], confidence: medium, freshness: current }
    - { id: CU017, statement: 'Public customer proof is strong enough to show real usage across travel and finance-adjacent features.', type: third-party-reported, topic: usage-proof, sourceRefs: [SU009, SU010, SU011, SU013], confidence: medium, freshness: current }
    - { id: CU018, statement: 'Official review pages confirm that Super.com actively curates and showcases customer feedback as part of the product story.', type: company-claimed, topic: curated-proof, sourceRefs: [SU007, SU008, SU021], confidence: medium, freshness: current }
    - { id: CU019, statement: 'Partnership proof such as NASCAR demonstrates brand relevance but not necessarily customer retention or profitability.', type: inferred, topic: partner-proof-limit, sourceRefs: [SU006, SU001], confidence: medium, freshness: current }
    - { id: CU020, statement: 'Independent review sources repeatedly discuss the hotel-discount product cashback membership and support experience in concrete user terms.', type: third-party-reported, topic: review-detail, sourceRefs: [SU011, SU013, SU014, SU016], confidence: medium, freshness: current }
    - { id: CU021, statement: 'The customer-proof set is broader than a small startup’s typical proof set but still noisier than audited cohort evidence.', type: inferred, topic: proof-quality, sourceRefs: [SU009, SU011, SU012, SU013], confidence: medium, freshness: current }
    - { id: CU022, statement: 'An outside reviewer can validate customer existence and product usage more easily than customer lifetime value.', type: inferred, topic: ltv-visibility, sourceRefs: [SU001, SU011, SU012], confidence: medium, freshness: current }
    - { id: CU023, statement: 'App-store ratings are strong enough to indicate broad user engagement.', type: observed, topic: satisfaction-signal, sourceRefs: [SU009, SU010], confidence: medium, freshness: current }
    - { id: CU024, statement: 'Positive reviews often focus on deals cashback and the breadth of the app.', type: third-party-reported, topic: positive-themes, sourceRefs: [SU009, SU011, SU016], confidence: medium, freshness: current }
    - { id: CU025, statement: 'Negative reviews often cluster around support refund handling booking friction billing or reporting expectations.', type: third-party-reported, topic: negative-themes, sourceRefs: [SU011, SU012, SU018, SU019, SU025], confidence: medium, freshness: current }
    - { id: CU026, statement: 'Public complaint surfaces suggest expectation management is an important part of repeat-customer risk.', type: inferred, topic: expectation-risk, sourceRefs: [SU011, SU012, SU019], confidence: medium, freshness: current }
    - { id: CU027, statement: 'Ratings and reviews are insufficient to prove durable renewal or repeat-booking economics.', type: observed, topic: retention-gap, sourceRefs: [SU009, SU010, SU013], confidence: medium, freshness: current }
    - { id: CU028, statement: 'Super.com does not publicly disclose member churn NRR GRR or repeat-booking frequency.', type: observed, topic: missing-retention-metrics, sourceRefs: [SU001, SU003], confidence: medium, freshness: current }
    - { id: CU029, statement: 'Without cohort data customer durability remains a major unresolved diligence question.', type: inferred, topic: durability-gap, sourceRefs: [SU001, SU012, SU013], confidence: medium, freshness: current }
    - { id: CU030, statement: 'Super.com’s main expansion path is consumer cross-sell across travel membership and finance surfaces.', type: inferred, topic: expansion-path, sourceRefs: [SU002, SU003, SU026], confidence: medium, freshness: current }
    - { id: CU031, statement: 'The main concentration risk is that a smaller paid or high-frequency cohort may drive outsized value relative to the 30M+ top-of-funnel base.', type: inferred, topic: cohort-concentration, sourceRefs: [SU001, SU016], confidence: medium, freshness: current }
    - { id: CU032, statement: 'Paid-member quality matters more than cumulative user count for underwriting the customer base.', type: inferred, topic: member-quality, sourceRefs: [SU001, SU003, SU016], confidence: medium, freshness: current }
    - { id: CU033, statement: 'App stores remain important customer-discovery and support-adjacent surfaces.', type: observed, topic: appstore-dependence, sourceRefs: [SU004, SU005, SU009, SU010], confidence: medium, freshness: current }
    - { id: CU034, statement: 'NASCAR broadens consumer-brand awareness but does not on its own prove efficient customer acquisition.', type: inferred, topic: partnership-efficiency, sourceRefs: [SU006, SU020], confidence: medium, freshness: recent }
    - { id: CU035, statement: 'Support friction in travel or finance interactions can damage repeat behavior more than initial acquisition.', type: inferred, topic: support-churn-risk, sourceRefs: [SU011, SU012, SU018, SU019], confidence: medium, freshness: current }
    - { id: CU036, statement: 'The bottom-line customer verdict is positive on reach and usage proof but incomplete on paid durability and cohort economics.', type: inferred, topic: customer-verdict, sourceRefs: [SU001, SU009, SU011, SU012], confidence: medium, freshness: current }
  evidenceGaps:
    - id: GU001
      title: "No public cohort retention or churn data"
      description: No public source reviewed discloses member churn repeat-booking frequency NRR or GRR.
      relatedQuestionRefs: [QU013, QU014]
      whyItMatters: Without cohort durability it is impossible to separate a large but leaky funnel from a strong recurring customer base.
    - id: GU002
      title: "Channel and partnership dependence remain under-disclosed"
      description: Public materials do not break out customer acquisition by app stores paid media partnerships or organic channels.
      relatedQuestionRefs: [QU019]
      whyItMatters: The cost and resilience of acquisition materially affect customer quality and long-term profitability.
    - id: GU003
      title: "Review evidence is abundant but noisy"
      description: Most public customer proof comes from reviews ratings and curated testimonials rather than audited customer-outcome datasets.
      relatedQuestionRefs: [QU022, QU023]
      relatedTableRefs: [TU003]
      whyItMatters: Evidence of customer existence is strong but evidence of lifetime value and retention is much weaker.
