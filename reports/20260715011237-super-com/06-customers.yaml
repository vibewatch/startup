callouts:
  - calloutType: insight
    title: "Super.com has real customer scale, but the key underwriting variable is the paid, repeating cohort"
    body: >-
      Thirty million-plus users and near-million membership scale are strong indicators of reach. The real
      question is how much of the company’s economics come from repeat Super+ and finance-feature usage rather
      than one-off travel shoppers.
    claimRefs: [CU008, CU009, CU031, CU032]
  - calloutType: risk
    title: "Review volume proves usage, not durable retention"
    body: >-
      App-store and review-site activity show that real consumers use the product and care enough to comment.
      They do not substitute for churn, renewal, repeat-booking, or feature-attach data—the metrics that
      actually determine customer durability.
    claimRefs: [CU017, CU024, CU028, CU029]
