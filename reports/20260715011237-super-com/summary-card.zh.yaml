  topStrengths:
    - 2025 年首年盈利叠加 50%+ 同比增长，在这一规模的消费金融科技公司里很少见。
    - 多产品飞轮（旅游获客→会员→金融工具）带来结构性留存优势。
    - TPG 领投 Series D、J.P. Morgan 配售，以及 Shopify 总裁 Harley Finkelstein 担任董事会观察员，共同验证业务质量。
    - NASCAR 合作和 30M+ 用户，说明公司已触达美国主流消费人群。
  topRisks:
    - CFPB 正在制定 EWA 规则，FTC 对 Dave 的执法先例也在，现金垫款收入流面临监管风险。
    - 收入流组合、分业务毛利率和现金垫款违约经济性均未公开披露。
    - 如果监管执法落地且增长降速，悲观情景估值（持平 Series D 价格）有现实可能。
    - Super+ 转化率仅 3.3%（30M 用户中 1M），意味着大多数用户仍未变现，后续转化潜力不确定。
  unresolvedGaps:
    - 收入流拆分（旅游 vs. 会员 vs. 金融产品）以及分业务毛利率。
    - 现金垫款收费结构、垫款额度、违约率和 CFPB/TILA 合规姿态。
    - Super+ 队列数据：12 个月会员留存、ARPU 和按获客渠道拆分的转化率。
    - 各轮融资的资本结构和清算优先权条款。
