  notes: Every item here changes the interpretation of the same top-line story; the main blocker is not lack of scale but lack of segment-level disclosure.
  rows:
  - - Net revenue definition and stream mix
    - Could materially change quality-of-revenue assessment
    - Travel, membership, and finance revenue deserve different multiples
    - Request audited revenue bridge by stream and contra-revenue treatment
  - - Gross margin by business line
    - Prevents precise valuation and profitability-underwriting work
    - Low-margin travel and finance revenue can dilute a premium multiple
