  evidenceGaps:
  - id: GI001
    title: Super+ realized pricing and churn are still not public
    description: Official pages describe benefits and transparency but do not provide the cohort-level realized pricing, discounting, and renewal behavior needed to turn member count into durable ARR.
    relatedQuestionRefs:
    - QI002
    - QI003
    whyItMatters: Without realized price and churn, membership revenue quality cannot be distinguished from promotional gross-add volume.
  - id: GI002
    title: Stream-level gross margin is unavailable
    description: No public source breaks gross profit across travel bookings, membership, shopping offers, and finance features.
    relatedQuestionRefs:
    - QI007
    - QI012
    whyItMatters: The correct valuation multiple depends on whether contribution comes from higher-margin subscription behavior or lower-margin transaction flows.
  - id: GI003
    title: CAC, payback, and channel efficiency remain undisclosed
    description: Neither company materials nor independent coverage provide acquisition-cost and payback detail by channel.
    relatedQuestionRefs:
    - QI011
    whyItMatters: Consumer bundles can look profitable at scale while still having fragile incremental economics if incentives and paid acquisition dominate growth.
  - id: GI004
    title: Credit-loss and partner-risk allocation are not visible
    description: Cash-advance and card materials do not disclose loss curves, reserve policies, partner-bank responsibilities, or contingent obligations.
    relatedQuestionRefs:
    - QI013
