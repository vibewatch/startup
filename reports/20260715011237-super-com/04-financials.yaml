    - Needed to judge whether growth is efficient or promo-subsidized
    - Consumer marketplaces can scale inefficiently if incentives dominate
    - Request spend, installs, activations, and payback by channel
  - - Cash-advance loss and fraud metrics
    - Finance-feature economics can flip from attractive to risky quickly
    - Critical to capital adequacy and margin quality
    - Request vintage loss curves, fraud rates, and reserve methodology
  - - Cash balance and program obligations
    - Without this, runway and downside resilience remain uncertain
    - Profitability alone does not show liquidity or contingent exposure
    - Request cash, lines, covenants, and restricted balances
