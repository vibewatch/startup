  notes: Rows separate the business into booking, subscription, shopping, and finance layers because the margin and durability profile differs meaningfully by stream.
  rows:
  - - Hotel bookings
    - Consumer books discounted hotel inventory through SuperTravel
    - Booking commissions, spread, or supplier economics not publicly itemized
    - Core, mature funnel product
    - 'Medium: real scale, but travel economics can be promotion-sensitive'
    - Request hotel GMV, take rate, refund burden, and supplier concentration
  - - Super+ membership
    - Paid subscription unlocks benefits across travel and finance
    - Independent reviews cite roughly $15/month; official pages emphasize benefits more than one universal list price
    - Scaled to nearly 1M members
    - High if churn is controlled; opaque if pricing varies by funnel
    - Request member ARPU, gross churn, annualized recurring revenue, and plan mix
  - - Cashback / shopping offers
    - Merchants or affiliate partners fund cashback or offers
    - Public benefit exists, but net economics are undisclosed
    - Growing adjacency to travel and membership
    - 'Medium: can monetize intent but may be partner-dependent'
    - Request merchant-funded vs. company-funded share and contribution margin
  - - Cash advance
    - Members can access small-dollar liquidity products
    - Up to $250 marketed in reviews and product pages
    - Live feature; economics undisclosed
    - Low-Medium until loss/fraud/partner economics are visible
    - Request fee model, loss rates, funding partner, and reserve policy
  - - Secured charge / card product
    - Card product supports credit building and rewards
    - Feature publicly marketed; detailed economics not disclosed
    - Live but structurally opaque
    - Medium if partner-led, lower if Super retains credit burden
    - Request interchange share, program partner, and charge-off responsibility
  - - Advertising / promotions / games
    - App surfaces additional earn-and-save mechanics
    - Mentioned on about/app-store surfaces but not financially broken out
    - Supplementary
    - 'Low: likely immaterial or highly variable today'
    - Request revenue contribution and user-quality impact from gamified surfaces
