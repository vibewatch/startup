callouts:
- calloutType: insight
  title: Profitability changes the debate, but not the diligence burden
  body: Super.com has moved beyond speculative consumer-fintech scale by publicly claiming profitability in 2025 at $200M+ net revenue. That is a meaningful quality signal. The diligence burden remains high because the company still does not show which streams create that profit or how durable those margins are.
  claimRefs:
  - CI009
  - CI010
  - CI023
  - CI032
- calloutType: risk
  title: Membership scale is impressive, but the real underwrite is cohort quality
  body: Nearly one million members is a serious milestone, yet that metric is far less useful without churn, realized price, annualization, and conversion denominators. Super.com could be a very attractive recurring-revenue story or a heavily promoted bundle with weaker renewal economics; public evidence cannot yet separate those outcomes.
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI035
