company:
  name: Super.com
chapter:
  number: 4
  title: Financials
  summary: 'Super.com now presents as a scaled but still partly opaque consumer marketplace-plus-membership business: the company disclosed $200M+ of 2025 net revenue, 50%+ annual growth, profitability, $2B+ lifetime sales, and nearly 1M members, but it still does not publish segment mix, gross margin, CAC, loss rates, or cash balances. The public picture therefore supports a better revenue-quality verdict than in earlier stages, yet still requires underwriting through modeled ranges rather than full observed unit economics.'
sections:
- id: revenue-model
  title: 'Revenue model: Super.com monetizes a consumer funnel that starts in travel and expands into membership and financial products'
  body: Super.com does not appear to be a single-stream OTA or a single-product neobank. Public materials describe a layered monetization model built around hotel bookings, Super+ subscription fees, cashback-shopping economics, and financial-product revenue from card and cash-advance features. That architecture matters because each layer has different quality characteristics. Travel revenue likely depends on supplier commissions, spread, or take rates and therefore carries more marketplace-style volatility than recurring software revenue. Membership revenue is potentially more durable because it is subscription-like, but realized pricing appears less transparent than the marketing headline. Financial-product revenue may add materially to ARPU, yet the economics depend on partner structures, fraud, interchange, and credit-loss arrangements that are not publicly disclosed. The business can therefore be attractive on growth and bundle logic while still remaining hard to fully underwrite on
    margin mix. Investors should treat the model as a consumer-fintech marketplace bundle, not a pure subscription business, and should insist on stream-level revenue and gross-profit splits before assuming the 2025 profitability milestone fully de-risks the model.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: traction-and-pricing
  title: 'Traction and pricing: disclosed scale is credible, but realized economics remain partly hidden behind marketing and bundle packaging'
  body: 'The strongest public financial datapoints all cluster around 2025 and 2026. Super.com’s Series D announcement says the company surpassed $200 million in net revenue, grew more than 50 percent in 2025, became profitable, reached nearly one million members, exceeded $2 billion in total sales, and saved customers more than $1 billion. Those numbers make it clear that the company is no longer a pre-scale experiment. But they still leave open several underwriting questions. “Net revenue” is a meaningful but ambiguous label for a travel-plus-fintech business, because it does not reveal gross booking volume retention, interchange sharing, promotional expense treatment, or loss provisioning. Membership pricing also remains somewhat blurry: official materials emphasize transparency and benefits, while independent reviewers cite a roughly $15 monthly Super+ price point and note that economics vary by checkout context and use case. That means scale is real, but public list pricing is not enough
    to infer realized ARPU, cohort economics, or whether membership revenue or transaction revenue is the larger profit contributor.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  tableRefs:
  - TI002
  figureRefs:
  - FI002
- id: unit-economics
  title: 'Unit economics and margin path: the public signals are constructive, but the crucial drivers are still modeled rather than disclosed'
  body: Public evidence supports a constructive but incomplete unit-economics story. If Super.com generated more than $200 million of 2025 net revenue on more than $2 billion of cumulative sales, the business has already shown that consumer-intent monetization can scale well beyond a niche coupon app. Profitability in 2025 also suggests that contribution margins have improved materially relative to earlier growth years. Still, nearly all of the important variables remain private. Investors do not have a public gross-margin bridge by stream, a member-to-free-user conversion curve, acquisition cost by channel, or a disclosed fraud and credit-loss profile for cash advances and card products. Even the “nearly 1 million members” figure leaves pricing and churn questions unresolved. A bundle like Super.com can look very strong if travel is an efficient acquisition funnel into high-retention membership cohorts, but much weaker if discounts and promotions do most of the work and paid conversion
    remains thin. The result is a chapter in which the headline scale numbers are believable and positive, yet the real underwrite still hinges on private cohort and gross-profit data.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  tableRefs:
  - TI003
  figureRefs:
  - FI003
- id: capital-adequacy
  title: 'Capital adequacy: profitability helps, but public disclosure is still too thin to remove balance-sheet and credit-exposure questions'
  body: The financing posture looks healthier than many venture-backed consumer fintechs because Super.com combined profitable 2025 operations with a fresh $65 million Series D at a $1.2 billion valuation. On the surface, that suggests the round was raised to accelerate growth rather than to plug an immediate liquidity hole. Public coverage also places cumulative capital raised above roughly $235 million and headcount above 300 employees, confirming that the company now supports a real operating base rather than a lightly staffed mobile app. Even so, capital adequacy is not fully visible. Super.com has not publicly disclosed cash on hand, current burn or free-cash-flow levels, warehouse lines or program-finance obligations tied to cash advances, or the precise balance-sheet treatment of card and lending exposures. If partner banks or program managers absorb most of the credit and funding burden, the capital story is materially less risky than it first appears. If Super.com retains more exposure
    than public materials imply, the company deserves a harsher underwriting treatment. Profitability is a major positive datapoint, but not a substitute for a full balance-sheet and contingent-liability review.
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: verdict-and-gaps
  title: 'Financial verdict: revenue quality appears improved, but underwriting still depends on evidence that is not yet public'
  body: 'The right financial conclusion is neither blanket skepticism nor blind acceptance of the Series D narrative. Super.com has clearly reached enough scale to deserve serious consideration: $200M+ net revenue, 50%+ growth, profitability, and nearly one million members are rare outcomes in consumer travel-fintech bundles. The company also benefits from a business model that can compound value across multiple consumer moments instead of relying on one narrow savings tool. But investors still lack several pieces needed for a high-confidence underwrite. The public record does not provide stream-level revenue contribution, gross margin by business line, CAC/payback by channel, member churn, or detailed credit-loss and fraud data. Because those missing inputs directly determine whether the company should be valued like a strong consumer-subscription platform, a marketplace with moderate take-rate durability, or a riskier fintech hybrid, the diligence burden remains high. The current evidence
    supports a positive directional view on scale and efficiency, but it is still insufficient for precise return modeling without management disclosure.'
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
