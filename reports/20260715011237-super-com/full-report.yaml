              Because Super.com is a consumer app, its customer proof looks different from enterprise SaaS reference
              accounts. Instead of multi-year case studies with procurement signatures, the public record is dominated
              by app-store reviews, review-site feedback, curated testimonials, and marketing partnerships. Those
              sources are still useful. They show that real consumers use the hotel-discount product, notice cashback
              economics, discuss the Super Card and cash-advance features, and react strongly—sometimes positively,
