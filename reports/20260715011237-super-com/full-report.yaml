      - number: '2.2'
        title: 'Sizing lenses: the travel wedge is huge, but the true serviceable market is narrower'
        blocks:
          - type: paragraph
            body: >-
              Public data make one point obvious: the broad travel economy is large enough that Super.com does not face
              a category-ceiling problem at the top of the funnel. BEA reports $840 billion of tourism value added in
              2023, equal to 3.03% of GDP, and total tourism-related output of $2.64 trillion. Yet that broad number is
              too generous if it is used as a Super.com TAM. Much of the travel economy is not realistically reachable
              by a paid savings membership that starts with hotel deals and then tries to cross-sell financial features.
              A stricter lens is the company’s lodging-and-booking wedge. BEA’s traveler accommodations output of
              roughly $239 billion plus travel-arrangement and reservation services of roughly $84 billion imply a more
              relevant $323 billion serviceable spend pool before any cash-advance or cashback adjacencies are added.
              Even that SAM is only a spend pool, not a realistic revenue opportunity. Super.com’s present SOM is better
              described by proof of traction — more than $200 million of net revenue and nearly one million members —
              than by a claimed market-share figure. The discipline here is to resist the temptation to call every
              adjacent consumer wallet category part of the same TAM just because the app can eventually point users
              toward it.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
