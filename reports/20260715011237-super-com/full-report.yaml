            body: >-
              Public evidence supports a constructive but incomplete unit-economics story. If Super.com generated more
              than $200 million of 2025 net revenue on more than $2 billion of cumulative sales, the business has
              already shown that consumer-intent monetization can scale well beyond a niche coupon app. Profitability in
              2025 also suggests that contribution margins have improved materially relative to earlier growth years.
              Still, nearly all of the important variables remain private. Investors do not have a public gross-margin
              bridge by stream, a member-to-free-user conversion curve, acquisition cost by channel, or a disclosed
              fraud and credit-loss profile for cash advances and card products. Even the “nearly 1 million members”
              figure leaves pricing and churn questions unresolved. A bundle like Super.com can look very strong if
              travel is an efficient acquisition funnel into high-retention membership cohorts, but much weaker if
              discounts and promotions do most of the work and paid conversion remains thin. The result is a chapter in
              which the headline scale numbers are believable and positive, yet the real underwrite still hinges on
