      - number: '7.4'
        title: 'People and execution risk: CEO concentration, new leadership bench, and multi-product complexity'
        blocks:
          - type: paragraph
            body: >-
              Super.com's executive bench was significantly refreshed in 2025-2026 with three senior hires — CPO Ryan
              Fujiu (ex-Bird/Uber), General Counsel Michele Lee (ex-Pinterest), and Harley Finkelstein (Shopify
              President) as board observer. These additions strengthen the bench but also signal that the prior
              management structure needed reinforcement before the next growth phase. CEO Hussein Fazal remains the
              company's sole public face and brand voice across its entire 10-year history; no named successor or
              succession plan has been disclosed. The cross-border operating structure (Canadian company, US-focused
              revenue, split Toronto and San Francisco teams) creates regulatory, HR, and tax complexity in both
              jurisdictions simultaneously. With approximately 300 employees running travel fulfilment, consumer
              fintech, card products, AI personalization, and membership management in parallel, the execution intensity
              per employee is very high. The pivot history (three brand names, two major strategic shifts) demonstrates
              management agility but also creates investor uncertainty about future strategic direction if the current
              model underperforms.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
