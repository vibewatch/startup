            title: Super.com has real customer scale, but the key underwriting variable is the paid, repeating cohort
            body: >-
              Thirty million-plus users and near-million membership scale are strong indicators of reach. The real
              question is how much of the company’s economics come from repeat Super+ and finance-feature usage rather
              than one-off travel shoppers.
            calloutType: insight
