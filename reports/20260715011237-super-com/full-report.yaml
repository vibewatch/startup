        - Improve funnel conversion; financial product lock-in (card, credit building) to drive membership
        - Request member cohort data, paid conversion rate trend, and payback period
      - - Travel margin compression
        - OTA competitors squeeze supplier discounts; Super.com does not own hotel inventory
        - Travel as primary acquisition funnel established in CEO interview; revenue stream economics undisclosed
        - Medium — commission compression reduces margin without volume offset
        - Diversify travel verticals (flights, parks); negotiate long-term preferred rates
        - Request travel take rate, gross booking volume, and refund burden
      - - Revenue concentration and disclosure opacity
        - Public revenue is disclosed as blended net revenue; no stream-level breakdown
        - $200M net revenue and profitability confirmed; segment mix unknown
        - Medium — cannot confirm margin durability without stream-level disclosure
        - Management should disclose recurring vs. transactional revenue split
        - Request revenue by stream, gross margin by business line, and CAC by channel
      - - Financial product regulatory revenue risk
        - If CFPB EWA rule is finalized, tip and express-fee structures may need restructuring
        - CFPB rulemaking active; Dave FTC action shows fee structures are regulatory targets
        - High — revenue impact possible if tip or express-fee model is eliminated
        - Model revenue scenarios under TILA-compliant and non-compliant structures
        - Request modeled impact of TILA compliance on cash advance unit economics
