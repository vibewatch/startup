      - number: '4.2'
        title: >-
          Traction and pricing: disclosed scale is credible, but realized economics remain partly hidden behind
          marketing and bundle packaging
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial datapoints all cluster around 2025 and 2026. Super.com’s Series D
              announcement says the company surpassed $200 million in net revenue, grew more than 50 percent in 2025,
              became profitable, reached nearly one million members, exceeded $2 billion in total sales, and saved
              customers more than $1 billion. Those numbers make it clear that the company is no longer a pre-scale
              experiment. But they still leave open several underwriting questions. “Net revenue” is a meaningful but
              ambiguous label for a travel-plus-fintech business, because it does not reveal gross booking volume
              retention, interchange sharing, promotional expense treatment, or loss provisioning. Membership pricing
              also remains somewhat blurry: official materials emphasize transparency and benefits, while independent
              reviewers cite a roughly $15 monthly Super+ price point and note that economics vary by checkout context
              and use case. That means scale is real, but public list pricing is not enough to infer realized ARPU,
              cohort economics, or whether membership revenue or transaction revenue is the larger profit contributor.
