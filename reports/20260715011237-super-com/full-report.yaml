      - number: '7.3'
        title: 'Partner dependency risk: hotel supply, program bank, and app-store distribution are single-file dependencies'
        blocks:
          - type: paragraph
            body: >-
              Super.com's travel business depends on access to discounted hotel inventory through unnamed OTA or
              supplier partnerships. The COVID-19 episode in 2020 demonstrated this fragility concretely: CEO Fazal
              publicly stated the business went to "negative" — more cancellations than bookings — when travel demand
              collapsed, which forced the company to build the multi-product bundle. Today, hotel booking remains the
              primary consumer acquisition funnel for Super+ membership conversion, meaning that any serious disruption
              to the supply side would affect both travel revenue and membership growth simultaneously. A second
              dependency concerns the program bank enabling Super.com's secured charge card and cash-advance features.
              The bank partner is not publicly named; if it exits or changes terms, the financial-product layer goes
              offline across all Super+ members. A third dependency is app-store distribution: both Apple App Store and
              Google Play can restrict financial-product marketing, increase commission rates on subscriptions (Apple's
              30 percent in-app commission is a structural margin pressure), or change discoverability in ways that
              increase effective customer acquisition cost.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
