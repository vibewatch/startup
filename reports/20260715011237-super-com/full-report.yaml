      - number: '1.5'
        title: Freshness gaps, complaints, and the parts of the public record that do not fully line up
        blocks:
          - type: paragraph
            body: >-
              The public record is positive overall but not perfectly clean. Several company-controlled surfaces appear
              to lag one another: the about page still says $200 million-plus in direct savings while the Series D
              release says more than $1 billion of cumulative customer savings, and careers materials still advertise
              200-plus employees while BetaKit reports a 300-person firm. Neither gap is fatal, but both matter because
              company overview numbers become canonical inputs for later diligence. Customer-feedback surfaces also add
              useful caution. BBB says complaints on file relate to Super+ subscription enrollment, and Sitejabber
              includes specific criticism around hidden taxes or fees, unclear cancellation language, and payment
              friction even as it still reports a healthy aggregate rating. Independent reviewers likewise frame the $15
              monthly Super+ fee as a real hurdle for some users, especially if they do not regularly book travel or use
              the card. The chapter takeaway is not that the business is broken; it is that Super.com’s current scale
              sits alongside a nontrivial transparency burden. The company is now large enough that stale public
              metrics, membership-pricing ambiguity, and subscription complaints deserve to be carried into every later
              chapter rather than treated as footnotes.
