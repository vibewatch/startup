      - number: '7.2'
        title: 'Operational risk: high complaint volume on refunds and subscription charges is publicly documented'
        blocks:
          - type: paragraph
            body: >-
              Super.com's largest consumer-facing risk is service-quality friction in refunds and booking errors. The
              PissedConsumer aggregation shows 1,935 reviews with a 1.5-star average and 86 percent unfavorable
              distribution, with the majority of complaints focused on refund denial or delay, reservation not found at
              hotel, and subscription charges continuing after attempted cancellation. Trustpilot presents a more
              favorable picture — 4.3 stars from 58,869 reviews — but its AI-generated summary still identifies
              reservation mismatches, pricing surprises, and support responsiveness as recurring themes. The structural
              driver is that Super.com acts as a travel intermediary between consumers and underlying OTA or hotel
              suppliers; booking errors therefore require multi-party coordination that consumers must navigate. This
              complaint volume creates three forward risks. First, it provides regulators with a ready evidence base if
              CFPB or FTC examinations are initiated. Second, high-complexity cases (refunds, errors) generate
              disproportionate churn from the most engaged customers. Third, scaling the NASCAR partnership to 70
              million new fan-facing touchpoints could increase the support burden faster than current capacity.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
