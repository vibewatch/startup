      - number: '6.5'
        title: >-
          Expansion and concentration: the main expansion path is cross-sell, while the main concentration risk is
          dependence on a small high-value member cohort
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to a clear expansion logic: acquire a consumer through one savings need, then
              deepen wallet share across travel, membership, finance, and everyday-value benefits. That creates multiple
              monetization vectors without relying on enterprise land-and-expand. The strongest public example of
              expansion is the breadth of features marketed to the same consumer identity, from hotels to cash advance
              to card and prescription savings. Yet the biggest concentration risk is not one named enterprise customer
              or reseller. It is the possibility that a relatively small subset of paying or high-frequency members
              drives a disproportionate share of value. If that is true, then 30 million cumulative users matters far
              less than the behavior of a much smaller recurring cohort. The NASCAR partnership suggests a path toward
              broader brand reach, but channel dependence, paid-acquisition concentration, and partner-brand efficiency
              are not publicly broken out. Super.com therefore appears to have a credible consumer expansion flywheel,
              but public evidence still cannot show whether that flywheel is deep, profitable, and durable enough to
              resist churn or promotional fatigue.
            claimRefs:
