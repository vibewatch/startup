      - number: '5.2'
        title: >-
          Workflow and use cases: the ideal path begins with a savings moment and attempts to compound into repeat
          engagement
        blocks:
          - type: paragraph
            body: >-
              The most visible public workflow begins with discovery of a hotel deal, a shopping offer, or a cash-flow
              problem, followed by app onboarding and benefit activation. Once the consumer is in the product, Super.com
              attempts to convert that episodic interaction into broader bundle usage. A traveler can see hotel
              discounts, then join Super+, then encounter cash advance or card tools, then return for cashback, games,
              or prescription discounts. The company’s pages imply that this cross-sell logic is central to the
              operating model: one savings event should justify another, and the app should keep surfacing incremental
              ways to save money. App-store listings support that interpretation by advertising multiple categories
              inside one experience rather than one linear job-to-be-done. This creates opportunity and risk at the same
              time. The opportunity is higher frequency and stronger retention than a single-feature app. The risk is
              that a consumer who came for one simple need may find the bundle too broad or opaque. Product success
              therefore depends on orchestration and clarity as much as on feature count.
