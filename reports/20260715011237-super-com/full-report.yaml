      - number: '1.3'
        title: Funding history, valuation, and financing structure
        blocks:
          - type: paragraph
            body: >-
              The capital history is straightforward at the headline level but messy at the edges. Super.com’s
              best-corroborated early institutional milestone is the March 2021 Series B, when Snapcommerce raised $85
              million led by Inovia Capital and Lion Capital. The next major step was the April 2023 Series C, described
              by TechCrunch as $60 million of equity plus a $25 million credit facility and by BetaKit as an $85 million
              Series C announced after the 2022 rebrand. By July 2026 the company had reached the clearest valuation
              mark in its public history: a $65 million Series D led by TPG at a $1.2 billion valuation. BetaKit adds
              that the round combined primary and secondary capital and was structured as all equity. What remains
              unresolved is the exact lifetime total raised on an apples-to-apples basis. Some sources emphasize
              all-equity totals; others fold in debt facilities or round credits differently. For diligence purposes,
              the important read-through is less the precise cumulative number than the pattern: Super.com has
              repeatedly found investors willing to back a widening consumer-finance-and-travel thesis, and the 2026
              unicorn round arrived after the company had already disclosed profitability rather than ahead of it.
