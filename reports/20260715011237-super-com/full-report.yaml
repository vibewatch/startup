      - number: '2.4'
        title: >-
          Growth drivers and constraints: macro need is real, but conversion and regulation will decide the market
          outcome
        blocks:
          - type: paragraph
            body: >-
              The demand-side logic behind Super.com is persuasive. Financial fragility remains common enough that
              households actively look for ways to save, stretch cash, and avoid traditional-credit barriers, as shown
              by the continued relevance of the Fed’s SHED and the FDIC’s underbanked survey. Travel also remains a
              large, recovering, and well-measured spend category, giving Super.com a practical entry wedge into a
              broader wallet relationship. On the other hand, the company’s market is structurally constrained by three
              things. First, most substitutes are free, so multi-homing is easy and switching costs are low. Second, a
              paid membership narrows the reachable market versus free coupon, cashback, or loyalty tools. Third, the
              EWA and credit-building side of the bundle sits in a more contested policy environment than travel
              discounts. The CFPB’s 2024 proposal is a reminder that the financial-product part of the bundle can change
              category economics faster than the travel side can. As a result, the biggest market question is not
              whether the adjacent pools are large; it is whether Super.com can convert enough free or episodic users
              into durable, paid, repeat households without taking on untenable acquisition or regulatory risk.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
