      - number: '1.2'
        title: Leadership, governance, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Super.com remains founder-led. Hussein Fazal is still the public face of the business and Henry Shi
              continues to anchor founder continuity, while the public record shows an effort to deepen the bench rather
              than replace the founders. The 2026 Series D announcement adds three important people signals: Harley
              Finkelstein joined as a board observer and advisor, Ryan Fujiu arrived to lead Product, and Michele Lee
              joined as General Counsel. That improves the apparent senior bench, but it does not eliminate key-person
              concentration because the company narrative, funding story, and product vision are still routed primarily
              through Fazal. Geography follows the same pattern of continuity plus expansion. Independent reporting says
              the company shifted headquarters from Toronto to San Francisco in late 2022, yet careers materials still
              present Toronto as a real operating pod within a remote-first model alongside San Francisco and New York.
              In practical terms, Super.com looks like a Canadian-founded business that now manages consumer scale from
              the United States while retaining a Toronto talent base. The exact post-Series-D board roster remains only
              partially visible in public sources, so governance control is still a diligence item rather than a fully
              verified fact.
