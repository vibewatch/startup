  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Super.com sits at the intersection of travel, savings, and subprime-friendly fintech'
        blocks:
          - type: paragraph
            body: >-
              Super.com is difficult to size with one familiar market label because the product crosses three adjacent
              demand pools. The first is travel savings, where the app acquires users through hotel deals and
              travel-discount shopping. The second is shopping rewards and cashback, where consumers compare the product
              against free tools such as Rakuten, Honey, Capital One Shopping, and Ibotta. The third is financial
              wellness for paycheck-to-paycheck households, where cash advance, credit building, and small-dollar
              liquidity features compete more directly with Dave, Chime, and Branch. The right market boundary therefore
              includes both spend-side savings and balance-sheet-adjacent consumer finance behavior. That is why calling
              Super.com simply an OTA understates the model, while calling it a generic fintech overstates the depth of
              the banking product stack. The company is better understood as a bundled consumer savings platform that
              uses travel as acquisition, membership as monetization, and fintech-style tools as retention and
              share-of-wallet expansion. That boundary logic is essential because each adjacent market carries different
              growth drivers, margins, regulatory burdens, and competitive dynamics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM017
              - CM020
              - CM021
          - type: table
            tableRef: TM001
            claimRefs:
