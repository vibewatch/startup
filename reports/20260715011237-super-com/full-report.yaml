  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and legal risk: CFPB EWA rulemaking and FTC subscription enforcement create live compliance
          exposure
        blocks:
          - type: paragraph
            body: >-
              Super.com operates at the intersection of two active regulatory campaigns in 2025-2026: earned-wage-access
              and small-dollar credit, and recurring-subscription clarity. The CFPB proposed an interpretive rule on
              July 18, 2024 that would classify paycheck-advance products — including app-based cash advances — as
              credit under the Truth in Lending Act, which would impose APR disclosure, fee transparency, and
              origination requirements not currently required of most app-based advance providers. If finalized, that
              rule would require Super.com to materially change the fee model and disclosure architecture of its cash
              advance feature. The FTC finalized its Click-to-Cancel rule in October 2024, requiring that subscription
              cancellation be as easy as enrollment — directly applicable to Super+. The sector-level enforcement
              precedent is concrete: in November 2024 the FTC filed a federal lawsuit against Dave Inc., a direct
              competitor in cash advances, for deceptive marketing of up-to-$500 advances, undisclosed express fees, and
              involuntary tips. Dave's target consumer was described as "financially vulnerable" — the same demographic
              Super.com explicitly serves. No direct regulatory action against Super.com has been identified, but the
              precedent from Dave and the active CFPB rulemaking make this the highest-priority risk to monitor.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
