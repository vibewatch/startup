  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer segments: Super.com serves value-conscious consumers, but payer, user, and high-value cohorts are not
          equally visible
        blocks:
          - type: paragraph
            body: >-
              Super.com’s public positioning consistently points toward value-conscious everyday Americans rather than
              affluent leisure travelers or enterprise buyers. The company’s app descriptions, membership pages, and
              press materials all emphasize saving money, stretching paychecks, and accessing practical consumer
              benefits in one place. That implies a customer base whose key jobs are economic rather than aspirational:
              cheaper hotel stays, cashback, short-term liquidity, credit building, and lower everyday spend. In that
              sense, the customer is usually the same person across buyer, user, and payer roles. However, not all
              cohorts are equally visible. Travel-only users, paid Super+ members, cash-advance users, and card adopters
              likely have very different value profiles, and the public record does not break them apart cleanly. That
              matters because a bundle business may have large casual traffic but still depend disproportionately on a
              smaller paid or high-frequency cohort for revenue and retention. The customer story is therefore strongest
              on broad reach and weakest on segment-level monetization quality.
