      - number: '7.5'
        title: 'Financial model risk: credit exposure, conversion economics, and limited disclosure leave key risks unresolved'
        blocks:
          - type: paragraph
            body: >-
              Super.com's financial risk profile has three primary gaps. First, the cash advance product carries
              undisclosed default and fraud rates. The FTC's complaint against Dave documented that Dave alone collected
              over $149 million in cash-advance tip revenue from 2022 through mid-2024; Super.com's economics are
              presumably different in scale but the category risk is real. If Super.com retains credit exposure rather
              than offloading it entirely to a program bank, adverse macro conditions (rising unemployment, higher
              delinquency) would compress that revenue stream directly. Second, the Super+ membership conversion rate is
              approximately 3.3 percent of total users (nearly 1 million members from 30 million total app users) —
              meaning 97 percent of the user base is not generating subscription revenue. The path to materially higher
              conversion requires either much better conversion mechanics or significantly more qualified top-of-funnel
              traffic. Third, Super.com has not disclosed revenue stream mix, gross margins by business line, or
              customer acquisition costs, meaning investors cannot confirm whether profitability in 2025 reflects a
              durable margin structure or a temporary efficiency point driven by timing factors.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
