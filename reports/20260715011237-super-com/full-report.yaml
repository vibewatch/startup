      - number: '7.6'
        title: 'Mitigation and kill criteria: observable thresholds that would change the investment thesis'
        blocks:
          - type: paragraph
            body: >-
              Super.com's risks are manageable if the company proactively builds CFPB compliance for cash advance
              (disclosing fees, ensuring TILA readiness), maintains a Click-to-Cancel compliant Super+ cancellation
              flow, diversifies hotel suppliers, and formalizes a CEO succession plan. The most important monitoring
              signals are regulatory filing activity (CFPB examination notices, FTC civil investigative demands),
              customer complaint trajectory across public platforms, and membership conversion rate trend. Thesis-break
              triggers include: a CFPB enforcement action requiring fee restructuring that reduces cash advance or
              subscription revenue by more than 20 percent; loss of the primary hotel supplier without a 90-day
              replacement; a data breach affecting more than 1 million consumer financial records; or CEO resignation
              without a named internal successor. None of these events appears imminent from the public record, but all
              are within the plausible risk distribution given the operating model.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Investment thesis and anti-thesis: a profitable savings super app with a membership flywheel vs. undisclosed
          economics and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The bull case for Super.com is straightforward and evidenced. The company is profitable, growing at 50
              percent annually, has nearly 1 million paying members, and has built a rare multi-product consumer
              platform (travel savings plus consumer fintech plus membership) that creates multiple monetization layers
              and natural retention loops. The business proved its resilience by pivoting through COVID-19 and then
              growing to $200 million net revenue. The July 2026 Series D at $1.2 billion valuation was led by TPG, a
              sophisticated private equity firm with consumer sector expertise, which provides independent validation of
              the growth story. The NASCAR partnership signals aspirations to mainstream US consumer reach, and new
              executive hires (CPO Ryan Fujiu, General Counsel Michele Lee) have brought in platform-scaling experience
              from Uber, Bird, and Pinterest.

              The bear case is less about whether the product is real and more about what the undisclosed economics
              reveal once visible. Super.com has not disclosed revenue stream mix (travel vs. membership vs. financial
              products), gross margins by business line, customer acquisition costs, or cash advance fee and default
              structures. The regulatory exposure to CFPB EWA rulemaking and FTC subscription enforcement could impair
              two of the three revenue streams simultaneously. The 3.3 percent Super+ conversion rate (1M members from
              30M users) means that growth depends on either dramatically better conversion or continued top-of-funnel
              investment. And the 6x revenue multiple at a private-market valuation implies that future investors — or
              an eventual acquirer — will need to pay a further premium on today's price to generate attractive returns.

              The most honest synthesis: the business quality appears real, but the diligence burden is high enough that
              a high-confidence buy recommendation is not yet supportable without management disclosure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
