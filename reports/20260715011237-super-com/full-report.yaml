  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: >-
          Revenue model: Super.com monetizes a consumer funnel that starts in travel and expands into membership and
          financial products
        blocks:
          - type: paragraph
            body: >-
              Super.com does not appear to be a single-stream OTA or a single-product neobank. Public materials describe
              a layered monetization model built around hotel bookings, Super+ subscription fees, cashback-shopping
              economics, and financial-product revenue from card and cash-advance features. That architecture matters
              because each layer has different quality characteristics. Travel revenue likely depends on supplier
              commissions, spread, or take rates and therefore carries more marketplace-style volatility than recurring
              software revenue. Membership revenue is potentially more durable because it is subscription-like, but
              realized pricing appears less transparent than the marketing headline. Financial-product revenue may add
              materially to ARPU, yet the economics depend on partner structures, fraud, interchange, and credit-loss
              arrangements that are not publicly disclosed. The business can therefore be attractive on growth and
              bundle logic while still remaining hard to fully underwrite on margin mix. Investors should treat the
              model as a consumer-fintech marketplace bundle, not a pure subscription business, and should insist on
              stream-level revenue and gross-profit splits before assuming the 2025 profitability milestone fully
              de-risks the model.
