chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and present-day business model
        blocks:
          - type: paragraph
            body: >-
              Super.com’s identity is easiest to understand as a sequence of deliberate pivots around the same broad
              consumer job: helping price-sensitive households spend less. The company was founded in 2016 as SnapTravel
              by Hussein Fazal and Henry Shi, initially as a chat-driven hotel booking product built for messaging
              surfaces rather than a conventional OTA interface. That wedge broadened into Snapcommerce during 2020 as
              management looked beyond travel, and then into Super.com in October 2022 when the company explicitly tied
              together travel discounts, cashback, credit building, cash advances, and other saving-oriented features
              under one umbrella. The current company-controlled surfaces are consistent on the broad proposition even
              if they vary on some exact metrics: the about page describes an all-in-one app for saving, earning,
              travel, and credit support, while the app-store listings market the same experience as a finance-led super
              app. The product scope is therefore wider than an OTA but still narrower than an all-purpose Asian-style
              super app: this is a savings super app organized around recurring consumer wallet needs. That framing
              matters because later chapters should treat travel as the acquisition wedge, not the whole business.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO033
              - CO037
