            body: >-
              The right financial conclusion is neither blanket skepticism nor blind acceptance of the Series D
              narrative. Super.com has clearly reached enough scale to deserve serious consideration: $200M+ net
              revenue, 50%+ growth, profitability, and nearly one million members are rare outcomes in consumer
              travel-fintech bundles. The company also benefits from a business model that can compound value across
              multiple consumer moments instead of relying on one narrow savings tool. But investors still lack several
              pieces needed for a high-confidence underwrite. The public record does not provide stream-level revenue
              contribution, gross margin by business line, CAC/payback by channel, member churn, or detailed credit-loss
              and fraud data. Because those missing inputs directly determine whether the company should be valued like
              a strong consumer-subscription platform, a marketplace with moderate take-rate durability, or a riskier
              fintech hybrid, the diligence burden remains high. The current evidence supports a positive directional
