        title: Exhibits
        blocks:
          - type: callout
            title: Boundary discipline matters more than headline TAM theater
            body: >-
              The difference between using $2.64 trillion of total tourism output and a much narrower
              lodging-plus-reservation spend pool is the difference between a credible market case and an inflated one.
              Super.com’s opportunity is large, but it is not the whole travel economy.
            calloutType: insight
            claimRefs:
