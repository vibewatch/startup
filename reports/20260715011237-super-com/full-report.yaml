  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Super.com competes against specialists, incumbents, and single-job utilities'
        blocks:
          - type: paragraph
            body: >-
              The right competitor set for Super.com is broader than the names most often mentioned in press releases. A
              consumer can solve the same job with a cashback or coupon tool such as Rakuten, Honey, Capital One
              Shopping, or Ibotta; with a travel incumbent such as Hotels.com, Expedia, or Booking; or with a
              financial-wellness app such as Dave, Chime, or Branch. Each of those competitors attacks only part of the
              problem, but most do so with greater depth in their chosen wedge. Rakuten and Honey dominate checkout
              savings, travel incumbents dominate hotel inventory and loyalty trust, and neobank-style products dominate
              liquidity or credit-building clarity. Super.com’s bet is that a single app and a single membership can
              pull enough of these moments together to become a consumer’s default “save money” destination. That means
              the core landscape question is not whether Super.com has competitors — it plainly does — but whether the
              bundle creates enough everyday utility to beat a stitched-together stack of free specialists.
            claimRefs:
              - CP001
