      - number: '4.4'
        title: >-
          Capital adequacy: profitability helps, but public disclosure is still too thin to remove balance-sheet and
          credit-exposure questions
        blocks:
          - type: paragraph
            body: >-
              The financing posture looks healthier than many venture-backed consumer fintechs because Super.com
              combined profitable 2025 operations with a fresh $65 million Series D at a $1.2 billion valuation. On the
              surface, that suggests the round was raised to accelerate growth rather than to plug an immediate
              liquidity hole. Public coverage also places cumulative capital raised above roughly $235 million and
              headcount above 300 employees, confirming that the company now supports a real operating base rather than
              a lightly staffed mobile app. Even so, capital adequacy is not fully visible. Super.com has not publicly
              disclosed cash on hand, current burn or free-cash-flow levels, warehouse lines or program-finance
              obligations tied to cash advances, or the precise balance-sheet treatment of card and lending exposures.
              If partner banks or program managers absorb most of the credit and funding burden, the capital story is
              materially less risky than it first appears. If Super.com retains more exposure than public materials
              imply, the company deserves a harsher underwriting treatment. Profitability is a major positive datapoint,
              but not a substitute for a full balance-sheet and contingent-liability review.
