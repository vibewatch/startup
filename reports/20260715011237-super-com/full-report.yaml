      - number: '8.3'
        title: 'Scenario analysis: bull case rewards membership penetration; bear case is regulatory revenue impairment'
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Super.com sustains 40-50 percent revenue growth through 2027, reaches 2 million
              Super+ members, and faces no material CFPB enforcement action. Under these assumptions, revenue reaches
              $280-300 million by end of 2026 and the platform would approach a $2-3 billion valuation at a normalized
              8-10x growth-stage multiple, delivering a 2-2.5x return on the Series D price. The base case assumes 25-35
              percent revenue growth, steady membership progression, no enforcement, but modest multiple compression as
              the company approaches IPO or sale readiness — implying a $1.8-2.2 billion valuation at a 2027-2028 exit.
              The bear case involves CFPB enforcement requiring cash advance fee restructuring that reduces that revenue
              stream by 20-30 percent, combined with hotel supply friction slowing membership acquisition, leading to
              revenue growth deceleration below 20 percent and a valuation re-mark toward 4-5x on $220-240 million
              revenue — implying a range of $880M to $1.2B, or roughly flat to the Series D price. Investors accepting
              the bear case as a floor are accepting a low-single-digit annualized return in exchange for bear-case
              protection.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV022
      - number: '8.4'
        title: 'Exit readiness and diligence asks: IPO or strategic acquisition are credible but not near-term'
        blocks:
          - type: paragraph
            body: >-
              Super.com is not currently positioned for an imminent IPO. The company has never disclosed quarterly
              financials, has no public audit history in its current form, lacks a named CFO in public communications,
              and still operates under private market disclosure standards. However, the Series D structure (J.P. Morgan
              as sole placement agent, Osler and Skadden as legal counsel) signals that the company is using
              institutional-grade advisors and may be preparing for a future liquidity event. The most likely exit path
              is a strategic acquisition, either by a major US bank or financial institution seeking a consumer
              super-app capability (Capital One or JPMorgan), a large travel platform (Booking Holdings or Expedia
              seeking a financially-embedded loyalty layer), or a large retailer or marketplace seeking a
              savings-and-membership bundle. An IPO is credible in the 2027-2028 window if the company reaches $300+
              million revenue with sustained profitability and can satisfy institutional investors' appetite for
              segment-level disclosure. The primary diligence gap before any investment or acquisition decision is the
              set of financial metrics that are not publicly disclosed: revenue by stream, gross margin, cash advance
              economics, and customer acquisition cost by channel.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
          - type: table
            tableRef: TV005
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
          - type: table
            tableRef: TV006
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
      - number: '8.5'
        title: >-
          Recommendation: track with high diligence priority; business quality is real but valuation requires
          undisclosed proof
        blocks:
          - type: paragraph
            body: >-
              The evidence-based recommendation is track/research-more. This is not a pass — the business quality,
              growth trajectory, and leadership bench are genuinely impressive for a company in this segment. It is a
              recognition that the $1.2 billion valuation requires a higher diligence bar than the public evidence
              currently supports. Specifically: investors need to see stream-level revenue and gross margin data, cash
              advance fee and loss economics, Super+ member cohort data (activation, retention, ARPU), and the company's
              compliance roadmap for CFPB and FTC exposure, before a high-confidence buy recommendation is warranted. If
              management disclosure reveals gross margins above 50 percent on membership and strong cohort retention,
              the valuation is attractive. If disclosure reveals that cash advance revenue constitutes more than 30
              percent of revenue and faces near-term fee restructuring, the valuation is stretched. The variance in
              outcomes is too high to buy on the current public record alone — hence track. The risk rating is high, the
              confidence is medium, and the valuation stance is stretched pending full disclosure.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV022
              - CV023
              - CV024
              - CV025
