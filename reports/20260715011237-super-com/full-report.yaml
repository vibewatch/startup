      - number: '3.4'
        title: 'Durability and risk: low switching costs and limited lock-in keep the moat provisional'
        blocks:
          - type: paragraph
            body: >-
              The adverse view is straightforward. Consumers can multi-home across checkout tools, travel OTAs, and
              neobanks with low friction. Free products reduce willingness to pay. Larger travel incumbents can outspend
              on loyalty and inventory. Larger financial apps can outspend on brand and regulatory infrastructure. And
              the public record still does not show the kind of exclusive supplier access or proprietary distribution
              that would keep rivals from matching a visible consumer offer. The positive view is that the bundle itself
              may be the moat if households repeatedly discover that one membership pays for itself across several
              categories. But that remains a hypothesis rather than a proven public fact. The evidence needed to
              validate it is not more feature marketing; it is cohort retention, cross-sell attach, repeat-booking
              behavior, and supplier economics. Until that evidence is produced, the competitive durability story should
              be treated as promising but not yet settled.
