            body: >-
              Public satisfaction signals are mixed but meaningful. The app has large ratings footprints in Apple and
              Google app stores, and independent review aggregators also show substantial review volume. Positive
              commentary often centers on perceived hotel value, cashback, and the convenience of having multiple
              savings tools in one place. Negative commentary, by contrast, clusters around support, booking/refund
              friction, credit-reporting expectations, membership clarity, and the lag between a promised benefit and
              the user’s realized experience. This split matters because it suggests Super.com’s customer risk is less
              about initial curiosity and more about expectation management in repeat use. A consumer product can grow
              quickly even while churn remains elevated if promotions and paid acquisition keep replenishing the funnel.
              What is missing from the public record is the hard retention core: member renewal, repeat booking
              frequency, attach rates across modules, gross revenue retention, or any cohort view that separates
              travel-only users from broader bundle adopters. Ratings prove presence and some product love; they do not
