  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: Super.com sells an integrated savings workflow, not a standalone travel or fintech feature'
        blocks:
          - type: paragraph
            body: >-
              Super.com’s public surfaces consistently frame the product as an all-in-one app for saving, earning, and
              traveling. That framing is important because it changes how the product should be analyzed. The core user
              promise is not just “book a hotel for less” or “get a cash advance”; it is that one app can capture
              several moments when value-conscious consumers want to stretch cash flow. Travel remains the strongest
              public wedge, but the company now layers Super+ membership, cashback-shopping experiences, cash advance,
              credit-building card features, and prescription-discount perks into the same umbrella. The result is a
              product portfolio that resembles a consumer bundle with multiple frequency levers rather than a pure OTA
              or a pure neobank. Public app-store descriptions and company pages reinforce that the experience is
              mobile-led, consumer-facing, and benefit-centric. The product thesis therefore depends less on one
              breakthrough algorithm than on whether the operating surface can route users from one savings need to the
              next without creating too much complexity or support burden.
