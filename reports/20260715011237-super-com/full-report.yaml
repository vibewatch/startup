      - number: '1.4'
        title: Traction, milestone density, and why 2025–2026 matter
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence in this chapter clusters around 2025 and 2026. Super.com says 2025 was the breakout
              year in which it became profitable and pushed net revenue above $200 million while growing more than 50
              percent year over year. The same disclosure says Super+ reached nearly one million members and that
              members now generate more than half of U.S. hotel bookings on the platform, which supports the view that
              membership has become central to the company’s monetization flywheel rather than a side feature. On
              broader scale, the about page says over 30 million users trust the product and that total sales have
              exceeded $2 billion, while the Series D release says cumulative customer savings since 2016 now exceed $1
              billion. The NASCAR partnership is strategically notable because it puts the brand in front of a
              mainstream, travel-oriented, value-conscious consumer audience rather than a niche fintech audience. Taken
              together, these facts support the view that Super.com crossed from creative fintech/travel hybrid into
              scaled consumer platform territory during 2025–2026, even if some cover metrics remain company-reported
              and unaudited.
