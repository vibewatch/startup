              - CV003
              - CV005
      - number: '8.2'
        title: 'Valuation context: $1.2B at 6x 2025 net revenue is a growth premium over depressed public comparable multiples'
        blocks:
          - type: paragraph
            body: >-
              Super.com's July 2026 valuation of $1.2 billion represents approximately 6.0x its reported $200 million
              2025 net revenue. To assess whether that multiple is attractive, fair, or stretched, the most relevant
              public comparable is Ibotta Inc. (ticker IBTA), the largest public consumer cashback and promotions
              fintech. As of July 14, 2026, Ibotta's market capitalization was $700 million against fiscal year 2025
              revenue of $342.4 million — approximately 2x revenue. However, Ibotta's revenue declined in 2025 from the
              prior year, it faces its own regulatory and concentration risks, and its market cap has fallen
              dramatically from its $1.8 billion end-of-2024 level, partly due to a securities class action complaint
              filed in April 2025.

              The better set of references for Super.com's pricing logic is the set of acquisition and private-market
              comparables that reward growth and profitability simultaneously. PayPal's $4 billion acquisition of Honey
              in 2019 valued a browser-based cashback platform at an estimated 30-40x revenue at the time — but that was
              a strategic acquisition premium during a high-multiple era. Rakuten's overall business (including
              financial services and e-commerce) makes a direct multiple comparison difficult. Amazon Prime's value to
              the Amazon ecosystem — a loss-leader membership that drives $1T+ in GMV — is the aspirational comp rather
              than a trading price.

              For a high-growth, profitable consumer fintech with a membership flywheel, a 6x revenue multiple in a
              private market is neither extreme nor cheap. It implies that at a 2027 exit (1 year from now) at 10x the
              current revenue run rate of $300M+ (extrapolating 50% growth), the valuation could be $3B+ — a 2.5x
              step-up in 12-18 months. That is achievable if growth sustains, but requires no major regulatory
              disruption or macro headwind.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
