          - type: callout
            title: Free specialist alternatives are the market’s hardest constraint
            body: >-
              Super.com may bundle more value, but Rakuten, Honey, Capital One Shopping, OTAs, and neobanks each let
              consumers solve one piece of the job for free. The market will reward the bundle only if it clearly beats
              this stitched-together stack.
