    - Breadth can create explanation and support complexity
  - - Bridge payday shortfall
    - Turn to overdraft, payday app, or friend/family support
    - Offer member cash advance inside same app
    - Can deepen product relevance beyond travel
    - Loss/funding economics not visible publicly
  - - Build credit while spending carefully
    - Use separate secured card or credit-builder app
    - Offer card / credit-building tools inside savings brand
