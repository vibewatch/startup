  evidenceGaps:
  - id: GE001
    title: No public API or architecture reference
    description: Super.com does not expose a public developer portal, formal API reference, or architecture diagram in the reviewed materials.
    relatedQuestionRefs:
    - QE010
    - QE012
    whyItMatters: Without direct technical documentation, architecture claims remain inferential and diligence must rely on management explanations and code/system review.
  - id: GE002
    title: Reliability and security controls are not publicly deep
    description: No public status page, uptime history, or certification portal was found in the reviewed sources.
    relatedQuestionRefs:
    - QE013
    - QE019
    whyItMatters: Trust, incident response, and operational maturity cannot be underwritten from marketing and legal surfaces alone.
  - id: GE003
    title: AI moat evidence is limited to messaging
    description: Public materials mention AI-powered savings, but they do not disclose benchmark performance, data advantages, or model quality evidence.
    relatedQuestionRefs:
    - QE015
    whyItMatters: Investors should not treat AI messaging as proof of proprietary defensibility without empirical evidence.
