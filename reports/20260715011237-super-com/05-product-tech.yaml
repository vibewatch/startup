    - Offer RX discount under same umbrella
    - Extends savings promise to healthcare spend
    - Adoption and economics are not disclosed
  - - Return between trips
    - Wait for next hotel need
    - Use cashback, offers, games, and finance tools for frequency
    - Could raise engagement and cross-sell opportunities
    - May feel scattered if orchestration is weak
