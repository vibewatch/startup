  Revenue stream mix, gross margins, cash advance fee structure, and customer acquisition economics
  are not publicly disclosed. The $1.2B valuation is a 6x revenue multiple that is a meaningful premium
  over the closest public comparable (Ibotta at 2x on declining revenue) but defensible for the growth trajectory.
