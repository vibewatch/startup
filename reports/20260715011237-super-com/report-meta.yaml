  topStrengths:
    - "First-year profitability in 2025 combined with 50%+ YoY growth is rare at this scale in consumer fintech."
    - "Multi-product flywheel (travel acquisition to membership to financial tools) creates structural retention advantage."
    - "TPG-led Series D with J.P. Morgan placement and Shopify President Harley Finkelstein as board observer validates business quality."
    - "NASCAR partnership and 30M+ users establish real consumer reach with a mainstream American demographic."
  topRisks:
    - "Active CFPB EWA rulemaking and FTC Dave enforcement precedent create regulatory risk to cash advance revenue stream."
    - "Revenue stream mix, gross margin by segment, and cash advance default economics are not publicly disclosed."
    - "Bear case valuation (flat to Series D price) is plausible if regulatory enforcement materializes plus growth decelerates."
    - "Super+ conversion rate of 3.3% (1M from 30M users) means most of the user base remains unmonetized with uncertain conversion potential."
  unresolvedGaps:
    - "Revenue stream breakdown (travel vs. membership vs. financial products) and gross margin by segment."
    - "Cash advance fee structure, advance limits, default rates, and CFPB/TILA compliance posture."
    - "Super+ cohort data: 12-month member retention, ARPU, and conversion rate by acquisition channel."
    - "Capital stack and liquidation preference terms from all funding rounds."
