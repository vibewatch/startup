companyProfile:
  summary: >-
    Super.com (formerly Snapcommerce) is a Toronto-founded consumer savings platform launched in 2016.
    It pivoted through COVID-19 from a chat-based hotel deal platform to a multi-product super app
    combining travel booking, a monthly paid membership (Super+), and embedded financial products
    (SuperCash secured card, cash advance). By 2025 it had reached $200M net revenue, its first
    profitable year, and approximately 1 million Super+ members from a user base of 30 million.
    The July 2026 Series D at $1.2B was led by TPG with J.P. Morgan as placement agent.
  foundedDate: '2016-01-01'
  founders:
    - name: Hussein Fazal
      role: Co-Founder & CEO
      background: >-
        Serial entrepreneur; co-founded AdParlor (acquired by Adknowledge 2012), then Snapcommerce (later
        Super.com). Public profile as the primary vision-setter and external face of the company.
      claimRefs: [CO005, CO006]
    - name: Yijin Wu
      role: Co-Founder & CTO
      background: >-
        Technical co-founder; provides engineering and product leadership. Less public-facing than Fazal
        but confirmed in funding announcements and company communications.
      claimRefs: [CO007]
  foundingLocation: Toronto, ON
  headquarters: Toronto, ON / New York, NY
  productSummary: >-
    Travel booking layer (hotels, flights, activities) at discounted rates; Super+ membership for access
    to best rates and SuperCash rewards; SuperCash secured charge card; cash advance product. AI-powered
    personalization drives hotel deal surfacing and push notifications.
  customerFocus: >-
    Value-seeking US consumers, especially households earning below $100,000 annually, seeking savings
    on travel and everyday spending combined with accessible financial tools.
  businessModel: >-
    Multi-revenue model: travel commissions on hotel and flight bookings, Super+ monthly membership
    subscription fees, interchange revenue on the SuperCash card, cash advance fees, and promotional
    partner revenue from brand deals and loyalty partnerships.
  stage: Series D
  fundingStatus: >-
    Series D: $65M led by TPG at $1.2B post-money valuation, announced July 7 2026.
    Prior rounds include Series A, B, and C totaling approximately $170M.
    Total capital raised approximately $235M across all rounds.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO006, CO007, CO010, CO015, CV001, CV030]
summary:
  headline: >-
    Super.com is one of the more compelling consumer fintech stories in the 2026 private market —
    profitable, growing at 50%, and building a membership flywheel — but investors need segment
    economics before underwriting the 6x revenue valuation with high confidence.
