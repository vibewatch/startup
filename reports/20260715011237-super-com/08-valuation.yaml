  - Metric
  - Multiple / Valuation
  - Relevance to Super.com
  - Limitation
  notes: All comparables are approximate; private valuations are reported from press coverage and may not reflect current marks.
  rows:
  - - Ibotta Inc. (IBTA) — public
    - FY2025 revenue $342M; market cap $700M (July 2026)
    - ~2.0x NTM revenue
    - Most direct public comparable in consumer cashback / digital promotions
    - Revenue declined in 2025; Ibotta model (CPG brand-funded promotions) is B2B-side-heavy vs. Super.com's consumer-facing membership
  - - PayPal acquisition of Honey (2019)
    - Revenue at acquisition ~$100-120M estimated; deal price $4B
    - ~30-40x estimated NTM revenue (acquisition premium)
    - Highest-profile consumer cashback platform acquisition in history
    - Exceptional acquisition premium in high-multiple era; PayPal strategy not validated; Honey subsequently integrated and less independently visible
  - - Dave Inc. (DAVE) — public, post-FTC enforcement
    - FY2024 revenue ~$261M; market cap dramatically below 2022 SPAC value
    - <1x revenue after FTC enforcement announcement
    - Direct cash advance product comparable; same target demographic
    - FTC enforcement severely penalized valuation; demonstrates downside tail risk but not normal-case comp
  - - Chime — private, last valuation
    - Revenue ~$1.5B estimated FY2023; last private valuation $25B (2021)
    - ~17x at peak (2021); current estimated mark substantially lower
    - Largest US consumer neobank; aspirational comp for consumer fintech scale
    - 2021 peak valuation in pre-rate-correction environment; current mark estimated ~$8-12B in secondary markets
  - - "Rakuten (TYO: 4755) — public, global"
    - Market cap ~$7.5B (July 2026); revenue includes e-commerce, fintech, telecom
    - Conglomerate blended multiple; not directly comparable
    - Largest global cashback loyalty platform; Super.com aspires to similar model
    - Rakuten's blended multiple reflects telecom losses and e-commerce mix; cashback segment is only one piece
  - - "Expedia Group (NASDAQ: EXPE) — public"
    - FY2025 revenue ~$14B; market cap ~$18B (July 2026)
    - ~1.3x revenue
    - Comparable for travel booking side of Super.com's business model
    - Expedia is a full-stack OTA; Super.com is a discount-access layer on top of OTAs
  - - Super.com Series D (July 2026)
    - 2025 revenue $200M; valuation $1.2B
    - 6.0x 2025 net revenue
    - "Reference point: the financing itself is the most current comparable"
    - Private-market valuation set by TPG; not reflective of secondary-market clearing price
- id: TV005
  title: Thesis-break and kill triggers table
  sourceRefs:
  - SV001
  - SV002
  - SV005
  - SV007
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV021
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  notes: Triggers are defined around observable external events rather than management claims.
  rows:
  - - CFPB enforcement action on cash advance
    - Any public action or civil investigative demand against Super.com for cash advance fee practices
    - Impairs a revenue stream that may be material; precedent from Dave shows rapid valuation compression
    - Immediate thesis-negative; reassess valuation with reduced revenue base
  - - Hotel supplier relationship termination
    - Travel GMV decline exceeding 30% over two consecutive quarters
    - Collapses travel acquisition funnel; membership growth stalls; valuation multiple compresses
    - Thesis-negative unless new supply relationships signed within 90 days
  - - Program bank exit
    - Card or cash advance feature suspension or material restriction
    - Financial product layer goes offline; Super+ membership value proposition damaged
    - Thesis-negative if no backup partner secured within 60 days
  - - Revenue growth deceleration to below 20% YoY
    - Two consecutive quarters below 20% growth after sustained 40-50% trajectory
    - Multiple compression likely; 6x multiple was priced on 40-50% growth expectation
    - Re-evaluate multiple; consider position reduction
  - - CEO departure without named successor
    - Announcement of Hussein Fazal resignation without identified internal successor
    - Brand and investor confidence tied to founder; governance risk spikes
    - Requires board governance review; watch for succession plan disclosure
