  notes: Thesis and anti-thesis derived from public evidence only.
  rows:
  - - Profitable growth at scale is rare and confirmed
    - $200M net revenue, 50%+ YoY growth, profitable in 2025 per Series D disclosure
    - Revenue growth deceleration below 20% or profitability reversal in 2026
  - - Multi-product flywheel creates durable retention
    - Travel > membership > financial products creates multiple engagement hooks
    - Revenue concentration in travel commissions revealed to be 80%+ of revenue
  - - Membership as Amazon Prime analogy is a powerful unit-economics model
    - Super+ approaching 1M members; CEO explicitly uses Amazon Prime / Costco analogy
    - Member churn above 30% annually undermining recurring revenue thesis
  - - TPG validation is a meaningful quality signal
    - TPG led Series D at $1.2B; J.P. Morgan served as placement agent
    - TPG investment predicated on financial data not publicly available to third parties
  - - Regulatory risk to cash advance is real and FTC-precedented
    - FTC sued Dave in 2024 for identical product category and consumer demographic
    - Super.com proactively restructures cash advance ahead of CFPB enforcement
  - - Valuation is stretched vs. public comparables
    - Ibotta at 2x revenue with declining growth; Super.com at 6x with growing revenue
    - Multiple compression in consumer fintech IPOs or strategic exits below 6x NTM
