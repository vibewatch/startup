  claims:
  - id: CV001
    statement: Super.com's July 2026 Series D was led by TPG at a $1.2 billion post-money valuation, implying a revenue multiple of approximately 6.0x on its reported $200 million 2025 net revenue.
    sourceRefs:
    - SV001
    - SV003
    confidence: high
    type: observed
    topic: valuation
    freshness: current
  - id: CV002
    statement: Super.com's profitable 2025 operating year — the first year of profitability — combined with 50 percent revenue growth provides an unusual combination of growth and efficiency at this scale in the consumer fintech segment.
    sourceRefs:
    - SV001
    - SV002
    confidence: high
    type: observed
    topic: investment-thesis
    freshness: current
  - id: CV003
    statement: The multi-product flywheel — travel as acquisition funnel, Super+ membership as retention engine, financial products as ARPU multiplier — creates a structural advantage over single-product cashback and single-product neobank competitors.
    sourceRefs:
    - SV001
    - SV004
    confidence: medium
    type: inferred
    topic: investment-thesis
    freshness: current
  - id: CV004
    statement: "TPG's leadership of the Series D is a meaningful quality signal: TPG is a major private equity firm with consumer sector expertise and due diligence capabilities not available to public market observers."
    sourceRefs:
    - SV001
    - SV003
    confidence: high
    type: observed
    topic: investment-thesis
    freshness: current
  - id: CV005
    statement: The primary anti-thesis risk is that cash advance revenue — whose fee structure, volume, and margin are undisclosed — could constitute a material share of the $200M revenue base and face near-term regulatory compression.
    sourceRefs:
    - SV021
    - SV022
    confidence: medium
    type: inferred
    topic: anti-thesis
    freshness: current
  - id: CV006
    statement: The Super+ membership conversion rate of approximately 3.3 percent (1M members from 30M users) implies that the vast majority of the user base has not yet been monetized through the highest-margin product tier, creating both an opportunity and an execution risk.
    sourceRefs:
    - SV001
    - SV002
    confidence: high
    type: estimated
    topic: anti-thesis
    freshness: current
  - id: CV007
    statement: As of July 14, 2026, Ibotta Inc. — the most directly comparable public consumer cashback company — had a market capitalization of approximately $700 million against $342.4 million in FY2025 revenue, implying approximately 2.0x revenue multiple.
    sourceRefs:
    - SV008
    - SV009
    confidence: high
    type: observed
    topic: comparable-valuation
    freshness: current
  - id: CV008
    statement: Ibotta's revenue declined in fiscal year 2025 from the prior year, making it a lower-quality operating comparison for Super.com despite being the closest public market analog — Super.com's 50 percent growth justifies a meaningful premium over Ibotta's 2x multiple.
    sourceRefs:
    - SV008
    - SV009
    confidence: high
    type: inferred
    topic: comparable-valuation
    freshness: current
  - id: CV009
    statement: PayPal's $4 billion acquisition of Honey in 2019 implied a very high revenue multiple at the time, but was a strategic acquisition premium in a peak-multiple environment and is not a reliable comp for 2026 private market pricing.
    sourceRefs:
    - SV012
    - SV006
    confidence: medium
    type: observed
    topic: comparable-valuation
    freshness: recent
  - id: CV010
    statement: "Dave Inc.'s post-FTC enforcement market cap is a downside-tail comparable: it illustrates the valuation impact of regulatory action on a cash advance platform but is not a representative normal-case comparable."
    sourceRefs:
    - SV013
    - SV014
    confidence: high
    type: observed
    topic: comparable-valuation
    freshness: current
  - id: CV011
    statement: Expedia Group's trailing revenue multiple of approximately 1.3x as of July 2026 establishes a low floor for travel-booking platforms but is not directly applicable to Super.com's membership-driven model.
    sourceRefs:
    - SV011
    - SV007
    confidence: medium
    type: observed
    topic: comparable-valuation
