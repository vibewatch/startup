artifact: valuation
slug: super-com
runDate: '2026-07-15'
company:
  name: Super.com
chapter:
  number: 8
  title: Valuation
  summary: >-
    Super.com was valued at $1.2 billion in its July 2026 Series D — a 6x multiple on its $200M 2025 net revenue.
    That multiple is a meaningful premium over comparable public consumer cashback companies (Ibotta trades at ~2x
    on declining revenue as of July 2026), but it is defensible given Super.com's 50 percent YoY growth and 2025
    profitability. The thesis is sound: a profitable, fast-growing consumer savings platform with a membership
    flywheel, diversified revenue across travel and fintech, and meaningful brand momentum. The anti-thesis is
    also real: regulatory risk to cash advance and subscription revenue, thin segment-level disclosure, and a
    private-market multiple that requires continued growth execution to justify. The recommended stance is
    track/research-more: the business quality supports a constructive view, but the valuation case cannot be
    fully diligenced without management disclosure of revenue stream mix, gross margins, and cash advance economics.
sections:
- id: investment-thesis
  title: 'Investment thesis and anti-thesis: a profitable savings super app with a membership flywheel vs. undisclosed economics and regulatory exposure'
  body: >-
    The bull case for Super.com is straightforward and evidenced. The company is profitable, growing at 50 percent
    annually, has nearly 1 million paying members, and has built a rare multi-product consumer platform (travel
    savings plus consumer fintech plus membership) that creates multiple monetization layers and natural retention
    loops. The business proved its resilience by pivoting through COVID-19 and then growing to $200 million net
    revenue. The July 2026 Series D at $1.2 billion valuation was led by TPG, a sophisticated private equity firm
    with consumer sector expertise, which provides independent validation of the growth story. The NASCAR
    partnership signals aspirations to mainstream US consumer reach, and new executive hires (CPO Ryan Fujiu,
    General Counsel Michele Lee) have brought in platform-scaling experience from Uber, Bird, and Pinterest.

    The bear case is less about whether the product is real and more about what the undisclosed economics reveal
    once visible. Super.com has not disclosed revenue stream mix (travel vs. membership vs. financial products),
    gross margins by business line, customer acquisition costs, or cash advance fee and default structures. The
    regulatory exposure to CFPB EWA rulemaking and FTC subscription enforcement could impair two of the three
    revenue streams simultaneously. The 3.3 percent Super+ conversion rate (1M members from 30M users) means
    that growth depends on either dramatically better conversion or continued top-of-funnel investment. And the
    6x revenue multiple at a private-market valuation implies that future investors — or an eventual acquirer —
    will need to pay a further premium on today's price to generate attractive returns.

    The most honest synthesis: the business quality appears real, but the diligence burden is high enough that
    a high-confidence buy recommendation is not yet supportable without management disclosure.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
