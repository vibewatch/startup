  rows:
  - - Revenue stream breakdown
    - Segment-level contribution of travel, membership, and financial products to net revenue and gross margin
    - Determines whether 6x multiple is on high-margin recurring revenue or lower-margin travel commissions
    - Request from CFO / finance team in diligence data room
  - - Cash advance unit economics
    - Fee structure, advance limit distribution, default rate, loss provisioning, program-bank economics
    - Cash advance could be material revenue at risk from CFPB enforcement; need to model bear case
    - Request from product and finance teams; review program-bank agreement
  - - Super+ cohort data
    - Member activation rate, 12-month retention, ARPU, and plan mix by pricing tier
    - Determines whether membership is a durable recurring revenue engine or high-churn with thin LTV
    - Request from growth and analytics teams
  - - Customer acquisition cost by channel
    - CAC for hotel-to-membership conversion, direct membership sign-up, and financial-product acquisition
    - Validates unit economics and determines sustainability of growth at current marketing spend
    - Request from marketing and growth teams
  - - CFPB and FTC compliance posture
    - Cash advance disclosure architecture, click-to-cancel cancellation flow audit, money-transmission licenses
    - Active regulatory risk; compliance posture determines probability of bear-case enforcement scenario
    - Request from General Counsel; independent legal review of CFPB/FTC exposure
