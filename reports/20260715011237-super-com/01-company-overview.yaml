company:
  name: Super.com
chapter:
  number: 1
  title: Company Overview
  summary: Super.com is a founder-led, Toronto-born consumer savings platform that evolved from SnapTravel’s hotel-booking wedge into a membership-led savings super app, reached profitability and more than $200 million of net revenue in 2025, and then raised a $65 million Series D at a $1.2 billion valuation in July 2026.
sections:
- id: identity-and-model
  title: Identity, origin, and present-day business model
  body: 'Super.com’s identity is easiest to understand as a sequence of deliberate pivots around the same broad consumer job: helping price-sensitive households spend less. The company was founded in 2016 as SnapTravel by Hussein Fazal and Henry Shi, initially as a chat-driven hotel booking product built for messaging surfaces rather than a conventional OTA interface. That wedge broadened into Snapcommerce during 2020 as management looked beyond travel, and then into Super.com in October 2022 when the company explicitly tied together travel discounts, cashback, credit building, cash advances, and other saving-oriented features under one umbrella. The current company-controlled surfaces are consistent on the broad proposition even if they vary on some exact metrics: the about page describes an all-in-one app for saving, earning, travel, and credit support, while the app-store listings market the same experience as a finance-led super app. The product scope is therefore wider than an OTA but
    still narrower than an all-purpose Asian-style super app: this is a savings super app organized around recurring consumer wallet needs. That framing matters because later chapters should treat travel as the acquisition wedge, not the whole business.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO007
  - CO033
  - CO037
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, governance, and operating footprint
  body: 'Super.com remains founder-led. Hussein Fazal is still the public face of the business and Henry Shi continues to anchor founder continuity, while the public record shows an effort to deepen the bench rather than replace the founders. The 2026 Series D announcement adds three important people signals: Harley Finkelstein joined as a board observer and advisor, Ryan Fujiu arrived to lead Product, and Michele Lee joined as General Counsel. That improves the apparent senior bench, but it does not eliminate key-person concentration because the company narrative, funding story, and product vision are still routed primarily through Fazal. Geography follows the same pattern of continuity plus expansion. Independent reporting says the company shifted headquarters from Toronto to San Francisco in late 2022, yet careers materials still present Toronto as a real operating pod within a remote-first model alongside San Francisco and New York. In practical terms, Super.com looks like a Canadian-founded
    business that now manages consumer scale from the United States while retaining a Toronto talent base. The exact post-Series-D board roster remains only partially visible in public sources, so governance control is still a diligence item rather than a fully verified fact.'
  claimRefs:
  - CO005
  - CO006
  - CO020
  - CO021
  - CO027
  - CO028
  tableRefs:
  - TO002
  - TO003
- id: capital-formation
  title: Funding history, valuation, and financing structure
  body: 'The capital history is straightforward at the headline level but messy at the edges. Super.com’s best-corroborated early institutional milestone is the March 2021 Series B, when Snapcommerce raised $85 million led by Inovia Capital and Lion Capital. The next major step was the April 2023 Series C, described by TechCrunch as $60 million of equity plus a $25 million credit facility and by BetaKit as an $85 million Series C announced after the 2022 rebrand. By July 2026 the company had reached the clearest valuation mark in its public history: a $65 million Series D led by TPG at a $1.2 billion valuation. BetaKit adds that the round combined primary and secondary capital and was structured as all equity. What remains unresolved is the exact lifetime total raised on an apples-to-apples basis. Some sources emphasize all-equity totals; others fold in debt facilities or round credits differently. For diligence purposes, the important read-through is less the precise cumulative number than
    the pattern: Super.com has repeatedly found investors willing to back a widening consumer-finance-and-travel thesis, and the 2026 unicorn round arrived after the company had already disclosed profitability rather than ahead of it.'
  claimRefs:
  - CO008
  - CO009
  - CO016
  - CO017
  - CO018
  - CO038
  tableRefs:
  - TO001
- id: traction-and-milestones
  title: Traction, milestone density, and why 2025–2026 matter
  body: The strongest evidence in this chapter clusters around 2025 and 2026. Super.com says 2025 was the breakout year in which it became profitable and pushed net revenue above $200 million while growing more than 50 percent year over year. The same disclosure says Super+ reached nearly one million members and that members now generate more than half of U.S. hotel bookings on the platform, which supports the view that membership has become central to the company’s monetization flywheel rather than a side feature. On broader scale, the about page says over 30 million users trust the product and that total sales have exceeded $2 billion, while the Series D release says cumulative customer savings since 2016 now exceed $1 billion. The NASCAR partnership is strategically notable because it puts the brand in front of a mainstream, travel-oriented, value-conscious consumer audience rather than a niche fintech audience. Taken together, these facts support the view that Super.com crossed from
    creative fintech/travel hybrid into scaled consumer platform territory during 2025–2026, even if some cover metrics remain company-reported and unaudited.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO022
  - CO024
  - CO034
  tableRefs:
  - TO004
  figureRefs:
  - FO001
  - FO003
- id: freshness-gaps-and-adverse-signals
  title: Freshness gaps, complaints, and the parts of the public record that do not fully line up
  body: 'The public record is positive overall but not perfectly clean. Several company-controlled surfaces appear to lag one another: the about page still says $200 million-plus in direct savings while the Series D release says more than $1 billion of cumulative customer savings, and careers materials still advertise 200-plus employees while BetaKit reports a 300-person firm. Neither gap is fatal, but both matter because company overview numbers become canonical inputs for later diligence. Customer-feedback surfaces also add useful caution. BBB says complaints on file relate to Super+ subscription enrollment, and Sitejabber includes specific criticism around hidden taxes or fees, unclear cancellation language, and payment friction even as it still reports a healthy aggregate rating. Independent reviewers likewise frame the $15 monthly Super+ fee as a real hurdle for some users, especially if they do not regularly book travel or use the card. The chapter takeaway is not that the business
    is broken; it is that Super.com’s current scale sits alongside a nontrivial transparency burden. The company is now large enough that stale public metrics, membership-pricing ambiguity, and subscription complaints deserve to be carried into every later chapter rather than treated as footnotes.'
