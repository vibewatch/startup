  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: An up-to-date board roster showing formal directors, observer rights, and committee structure after the Series D.
    whyItMatters: Governance quality and investor control rights matter for underwriting a newly minted unicorn.
    diligencePath: Request the post-Series-D board deck, cap table, and observer agreements from management.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee count and geography split reconciled across careers pages, recruiting materials, and independent reporting.
    whyItMatters: Headcount is a cover metric that informs operating leverage and the extent of Toronto versus U.S. leadership concentration.
    diligencePath: Request HRIS headcount by location and compare it with careers-site metadata and investor materials.
    relatedQuestionRefs:
    - QO028
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: A definitive lifetime funding bridge separating equity, debt facilities, and any secondary capital across every round.
    whyItMatters: Public sources disagree on what to include in total raised, which affects dilution and capital-efficiency analysis.
    diligencePath: Ask management for a round-by-round cap table with gross proceeds, secondaries, and credit facilities.
    relatedQuestionRefs:
    - QO048
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: membership-pricing
    missingEvidence: A matrix of live Super+ prices, free-trial terms, and checkout variants by acquisition channel or user cohort.
    whyItMatters: Public guides emphasize transparency but do not publish a single authoritative list price, making pricing comparisons less precise.
    diligencePath: Capture screenshots from current checkout funnels across desktop, mobile web, and app for multiple user cohorts.
    relatedQuestionRefs:
    - QO042
  - type: missing-source
    severity: minor
    topic: milestone-table-partial-coverage
    missingEvidence: A complete, dated archive of pre-2021 product and commercialization milestones, including the first WhatsApp and Messenger booking milestones and early ARR checkpoints.
    whyItMatters: The milestone table is directionally complete for financing and major pivots, but earlier operating milestones are still reconstructed from secondary narratives.
    diligencePath: Request the internal company timeline or archived press-kit materials to backfill early milestone dates and product launch specifics.
    relatedQuestionRefs:
    - QO23
    relatedTableRefs:
    - TO004
