callouts:
- calloutType: strength
  title: The 2026 unicorn round arrived after profitability, not before it
  body: Unlike many consumer fintech narratives that rely on future monetization, Super.com reached profitability and over $200 million in net revenue before taking its Series D, which makes the 2026 valuation easier to underwrite than a pure hope-based growth round.
  claimRefs:
  - CO008
  - CO010
- calloutType: risk
  title: Public metrics are strong but not perfectly synchronized
  body: The about page, careers page, app listings, and Series D release do not all show the same savings, user, or headcount figures. That is not thesis-breaking on its own, but it raises the burden on management to provide a reconciled KPI bridge in diligence.
  claimRefs:
  - CO015
  - CO028
  - CO038
- calloutType: risk
  title: Customer complaints cluster around the membership layer, not the core brand story
  body: BBB and Sitejabber do not portray a broken product, but they do show that subscription enrollment clarity, hidden-fee perception, and booking friction are the recurring weak points in the consumer experience.
  claimRefs:
  - CO029
  - CO030
  - CO031
