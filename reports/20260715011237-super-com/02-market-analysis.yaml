chapter:
  number: 2
  title: Market Analysis
  summary: Super.com’s addressable market is best viewed as a disciplined overlap of travel savings, cashback/rewards, and paycheck-to-paycheck financial wellness, with the broad U.S. travel economy offering top-of-funnel scale but the paid-membership conversion problem defining the true opportunity.
sections:
- id: market-boundary
  title: 'Market boundary: Super.com sits at the intersection of travel, savings, and subprime-friendly fintech'
  body: |-
    Super.com is difficult to size with one familiar market label because the product crosses three adjacent demand pools. The first is travel savings, where the app acquires users through hotel deals and travel-discount shopping. The second is shopping rewards and cashback, where consumers compare the product against free tools such as Rakuten, Honey, Capital One Shopping, and Ibotta. The third is financial wellness for paycheck-to-paycheck households, where cash advance, credit building, and small-dollar liquidity features compete more directly with Dave, Chime, and Branch. The right market boundary therefore includes both spend-side savings and balance-sheet-adjacent consumer finance behavior. That is why calling Super.com simply an OTA understates the model, while calling it a generic fintech overstates the depth of the banking product stack. The company is better understood as a bundled consumer savings platform that uses travel as acquisition, membership as monetization, and fintech-style tools as retention and share-of-wallet expansion. That boundary logic is essential because each adjacent market carries different growth drivers, margins, regulatory burdens, and competitive dynamics.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM013
  - CM017
  - CM020
  - CM021
  tableRefs:
  - TM001
- id: sizing-lenses
  title: 'Sizing lenses: the travel wedge is huge, but the true serviceable market is narrower'
  body: |-
    Public data make one point obvious: the broad travel economy is large enough that Super.com does not face a category-ceiling problem at the top of the funnel. BEA reports $840 billion of tourism value added in 2023, equal to 3.03% of GDP, and total tourism-related output of $2.64 trillion. Yet that broad number is too generous if it is used as a Super.com TAM. Much of the travel economy is not realistically reachable by a paid savings membership that starts with hotel deals and then tries to cross-sell financial features. A stricter lens is the company’s lodging-and-booking wedge. BEA’s traveler accommodations output of roughly $239 billion plus travel-arrangement and reservation services of roughly $84 billion imply a more relevant $323 billion serviceable spend pool before any cash-advance or cashback adjacencies are added. Even that SAM is only a spend pool, not a realistic revenue opportunity. Super.com’s present SOM is better described by proof of traction — more than $200 million of net revenue and nearly one million members — than by a claimed market-share figure. The discipline here is to resist the temptation to call every adjacent consumer wallet category part of the same TAM just because the app can eventually point users toward it.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
