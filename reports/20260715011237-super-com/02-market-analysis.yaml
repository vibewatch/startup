- id: buyer-and-adoption-path
  title: 'Buyer map: the same household is buyer, user, and payer, so trust and timing matter more than sales motion'
  body: |-
    Super.com does not sell into a procurement department. The user, buyer, and payer are typically the same household or even the same individual, which changes how adoption works. A user may first arrive because of a hotel price, then notice a lower member rate, then decide whether the membership fee is justified by expected travel savings and adjacent benefits. Later, the same user may evaluate cash advance, cashback, or credit-building features depending on where that household is experiencing stress. This makes the adoption path highly contextual and cyclical: the company needs to appear at the exact moment a household is booking travel, looking for cheaper entertainment, or short on liquidity. It also means that free substitutes are always one click away. Rakuten, Honey, and Capital One Shopping attack the checkout moment; OTAs and loyalty programs attack the travel-booking moment; Dave, Chime, and Branch attack the liquidity or credit-repair moment. Super.com’s bundle only wins if consumers believe one membership can outperform stitching together these free or specialist alternatives. That is the central buyer-side mechanism the company is trying to prove.
