callouts:
- calloutType: insight
  title: Boundary discipline matters more than headline TAM theater
  body: The difference between using $2.64 trillion of total tourism output and a much narrower lodging-plus-reservation spend pool is the difference between a credible market case and an inflated one. Super.com’s opportunity is large, but it is not the whole travel economy.
  claimRefs:
  - CM006
  - CM031
  - CM032
  - CM035
- calloutType: risk
  title: Free specialist alternatives are the market’s hardest constraint
  body: Super.com may bundle more value, but Rakuten, Honey, Capital One Shopping, OTAs, and neobanks each let consumers solve one piece of the job for free. The market will reward the bundle only if it clearly beats this stitched-together stack.
  claimRefs:
