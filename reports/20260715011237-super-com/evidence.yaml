evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: An up-to-date board roster showing formal directors, observer rights, and committee structure after the Series D.
    whyItMatters: Governance quality and investor control rights matter for underwriting a newly minted unicorn.
    diligencePath: Request the post-Series-D board deck, cap table, and observer agreements from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A current employee count and geography split reconciled across careers pages, recruiting materials, and
      independent reporting.
    whyItMatters: >-
      Headcount is a cover metric that informs operating leverage and the extent of Toronto versus U.S. leadership
      concentration.
    diligencePath: Request HRIS headcount by location and compare it with careers-site metadata and investor materials.
    relatedQuestionRefs:
      - QO028
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: >-
      A definitive lifetime funding bridge separating equity, debt facilities, and any secondary capital across every
      round.
    whyItMatters: >-
      Public sources disagree on what to include in total raised, which affects dilution and capital-efficiency
      analysis.
    diligencePath: Ask management for a round-by-round cap table with gross proceeds, secondaries, and credit facilities.
    relatedQuestionRefs:
      - QO048
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: membership-pricing
    missingEvidence: A matrix of live Super+ prices, free-trial terms, and checkout variants by acquisition channel or user cohort.
    whyItMatters: >-
      Public guides emphasize transparency but do not publish a single authoritative list price, making pricing
      comparisons less precise.
    diligencePath: Capture screenshots from current checkout funnels across desktop, mobile web, and app for multiple user cohorts.
    relatedQuestionRefs:
      - QO042
  - type: missing-source
    severity: minor
    topic: milestone-table-partial-coverage
    missingEvidence: >-
      A complete, dated archive of pre-2021 product and commercialization milestones, including the first WhatsApp and
      Messenger booking milestones and early ARR checkpoints.
    whyItMatters: >-
      The milestone table is directionally complete for financing and major pivots, but earlier operating milestones are
      still reconstructed from secondary narratives.
    diligencePath: >-
      Request the internal company timeline or archived press-kit materials to backfill early milestone dates and
      product launch specifics.
    relatedQuestionRefs:
      - QO23
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: savings-super-app-tam
    missingEvidence: >-
      A public, apples-to-apples TAM study for bundled savings super apps that combines travel discounts, cashback, and
      paycheck-to-paycheck financial tools.
    whyItMatters: >-
      Without a native category study, investors can overstate the opportunity by cherry-picking the largest adjacent
      market.
    diligencePath: >-
      Build a bottom-up cohort model from actual Super.com active users, travel GMV, attach rates, and financial-product
      adoption.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: paid-conversion
    missingEvidence: A free-user-to-paid-member conversion funnel with acquisition source, cohort retention, and CAC by channel.
    whyItMatters: The market case ultimately depends on whether the bundle can convert one-off deal seekers into durable paid users.
    diligencePath: Request cohort tables for signups, first booking, member conversion, repeat booking, and finance-feature attach.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: member-cac
    missingEvidence: Channel-level CAC and payback for the hotel-entry and finance-entry funnels.
    whyItMatters: SAM and SOM framing is less useful if acquisition economics destroy the value of conversion.
    diligencePath: Ask management for blended and channel-specific CAC, payback, and LTV assumptions.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: member-attach-and-retention
    missingEvidence: >-
      Cohort data showing whether members who start in travel actually adopt finance features and stay longer than
      specialist-tool users would.
    whyItMatters: >-
      Breadth only becomes a moat if it produces measurably better retention and wallet share than free single-purpose
      alternatives.
    diligencePath: Request cohort retention, cross-sell attach rates, and repeat-booking data segmented by feature adoption.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: material
    topic: supplier-leverage
    missingEvidence: >-
      Hotel-supply economics, unique inventory access, and evidence that suppliers give Super.com terms rivals cannot
      easily match.
    whyItMatters: Without differentiated supply, travel incumbents can compress Super.com’s visible price advantage.
    diligencePath: Ask for top supplier mix, inventory exclusivity, and blended take-rate by booking type.
    relatedQuestionRefs:
      - QP017
      - QP025
  - type: missing-source
    severity: minor
    topic: specialist-pricing-detail
    missingEvidence: >-
      A clean apples-to-apples realized-pricing dataset for each competitor’s effective value delivered to a comparable
      user basket.
    whyItMatters: List pages and marketing claims are not the same as realized savings after exclusions, caps, and redemption rules.
    diligencePath: Run controlled user journeys across competitors with matched baskets and record net savings after all conditions.
    relatedQuestionRefs:
      - QP009
  - id: GI001
    title: Super+ realized pricing and churn are still not public
    description: >-
      Official pages describe benefits and transparency but do not provide the cohort-level realized pricing,
      discounting, and renewal behavior needed to turn member count into durable ARR.
    relatedQuestionRefs:
      - QI002
      - QI003
    whyItMatters: >-
      Without realized price and churn, membership revenue quality cannot be distinguished from promotional gross-add
      volume.
  - id: GI002
    title: Stream-level gross margin is unavailable
    description: No public source breaks gross profit across travel bookings, membership, shopping offers, and finance features.
    relatedQuestionRefs:
      - QI007
      - QI012
    whyItMatters: >-
      The correct valuation multiple depends on whether contribution comes from higher-margin subscription behavior or
      lower-margin transaction flows.
  - id: GI003
    title: CAC, payback, and channel efficiency remain undisclosed
    description: Neither company materials nor independent coverage provide acquisition-cost and payback detail by channel.
    relatedQuestionRefs:
      - QI011
    whyItMatters: >-
      Consumer bundles can look profitable at scale while still having fragile incremental economics if incentives and
      paid acquisition dominate growth.
  - id: GI004
    title: Credit-loss and partner-risk allocation are not visible
    description: >-
      Cash-advance and card materials do not disclose loss curves, reserve policies, partner-bank responsibilities, or
      contingent obligations.
    relatedQuestionRefs:
      - QI013
      - QI024
    whyItMatters: >-
      Finance-feature economics and downside risk cannot be judged responsibly without understanding who funds advances
      and who absorbs losses.
  - id: GE001
    title: No public API or architecture reference
    description: >-
      Super.com does not expose a public developer portal, formal API reference, or architecture diagram in the reviewed
      materials.
    relatedQuestionRefs:
      - QE010
      - QE012
    whyItMatters: >-
      Without direct technical documentation, architecture claims remain inferential and diligence must rely on
      management explanations and code/system review.
  - id: GE002
    title: Reliability and security controls are not publicly deep
    description: No public status page, uptime history, or certification portal was found in the reviewed sources.
    relatedQuestionRefs:
      - QE013
      - QE019
    whyItMatters: Trust, incident response, and operational maturity cannot be underwritten from marketing and legal surfaces alone.
  - id: GE003
    title: AI moat evidence is limited to messaging
    description: >-
      Public materials mention AI-powered savings, but they do not disclose benchmark performance, data advantages, or
      model quality evidence.
    relatedQuestionRefs:
      - QE015
    whyItMatters: Investors should not treat AI messaging as proof of proprietary defensibility without empirical evidence.
  - id: GU001
