evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-inspection-history
    missingEvidence: >-
      Primary regulatory inspection records, complete text of historical US FDA Form 483 inspection observations
      (specifically the January 2026 inspection referenced in diligence notes), comprehensive CAPA remediation packages,
      and formal establishment inspection reports (EIR) verifying site compliance.
    whyItMatters: >-
      For a commercial CRDMO exporting active pharmaceutical ingredients and drug products to regulated US and European
      markets, undetected or unaddressed Form 483 inspection observations could lead to warning letters, import alerts,
      or production suspensions that impair revenue generation.
    diligencePath: >-
      Request unredacted FDA Form 483 observation notices, company responses, and formal FDA closeout or EIR
      documentation directly from Aragen during management due diligence, or submit Freedom of Information Act (FOIA)
      requests to the US FDA.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete cap table detailing shareholding percentages following the Quadria Capital $100M infusion and Avendus/SBI
      ₹300 crore secondary acquisition, as well as specific shareholder rights, liquidation preferences, and board seat
      allocations.
    whyItMatters: >-
      Institutional governance, drag-along/tag-along rights, and exit waterfall economics directly determine common
      shareholder value realization in the pending IPO.
    diligencePath: >-
      Review draft red herring prospectus annexures, definitive shareholder agreements, and corporate filings with the
      Ministry of Corporate Affairs (MCA) in India.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete biographical profiles and compensation disclosures for all key managerial personnel, divisional business
      unit leaders, and independent board members.
    whyItMatters: >-
      Independent board oversight, audit committee composition, and executive retention incentives are critical
      governance factors evaluated by public market investors during IPO evaluation.
    diligencePath: Review full management and board profiles in the Draft Red Herring Prospectus (DRHP) filed with SEBI.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Audited client concentration, top-10 customer revenue shares, and multi-year contract renewal rates.
    whyItMatters: >-
      Without top-account concentration data, revenue vulnerability to single-sponsor trial halts or insourcing cannot
      be quantified.
    diligencePath: >-
      Inspect audited IPO prospectus disclosures (DRHP) or private placement memorandum schedules detailing master
      services agreement renewals.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Site-specific capacity utilization rates, batch failure metrics, and discovery-to-manufacturing conversion
      economics across Hyderabad and Bengaluru.
    whyItMatters: >-
      Gross margin expansion in CRDMOs depends on batch throughput efficiency and cross-selling discovery clients into
      commercial manufacturing.
    diligencePath: Review site audit reports, cGMP batch records, and plant gross margin bridges during management diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-pricing
    missingEvidence: >-
      Realized FTE and fee-for-service rates, batch pricing, minimum commitments, discounts, pass-through terms, and
      comparable peer bids.
    whyItMatters: Without like-for-like contract economics, neither price advantage nor margin durability can be underwritten.
    diligencePath: >-
      Request anonymized contracts, recent competitive bids, realized rate cards, discount waterfalls, and RFP win-loss
      records.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: peer-capability-benchmark
    missingEvidence: >-
      Like-for-like peer data on modality depth, validated capacity, utilization, quality history, customer mix, and
      geographic delivery.
    whyItMatters: >-
      The current evidence shows Aragen's disclosed scope but cannot establish relative product quality or
      defensibility.
    diligencePath: Build a peer benchmark from filings, inspection records, site registries, contracts, and customer reference calls.
    relatedQuestionRefs:
      - QP003
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
