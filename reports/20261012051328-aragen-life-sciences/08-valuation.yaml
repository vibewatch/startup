callouts:
  - calloutType: "risk"
    title: "Secondary Liquidity Pressure via 2.73 Crore Share OFS"
    body: "While the proposed INR 800 crore fresh capital injection directly supports balance sheet strengthening, the concurrent Offer for Sale of 2.73 crore shares signals significant institutional and promoter profit-taking. Prospective investors must scrutinize the selling shareholder roster to distinguish between natural private equity liquidity cycles and potential confidence erosion from long-term insiders."
    claimRefs:
      - "CV007"
      - "CV014"
  - calloutType: "recommendation"
    title: "Valuation Discipline Thresholds for IPO Participation"
    body: "Investors should avoid bidding above the implied $1.4 billion enterprise value established during the January 2025 Quadria financing round until detailed DRHP schedules clarify revenue concentration among the top 10 customers and post-capex free cash flow generation."
    claimRefs:
      - "CV005"
      - "CV013"
