company:
  name: "Aragen Life Sciences"
chapter:
  number: 8
  title: "Valuation"
  summary: "Aragen Life Sciences has filed a Draft Red Herring Prospectus with SEBI targeting an INR 800 crore fresh capital raise alongside an Offer for Sale of 2.73 crore shares, following a $100 million minority investment from Quadria Capital at an approximate $1.4 billion valuation. While reported FY26 financial expansion showed revenue reaching INR 2,226 crore and PAT expanding to INR 258 crore, the valuation stance remains stretched and warrants a research-more recommendation pending full disclosure of DRHP debt schedules, CAPA remediation verification, and final IPO pricing discipline."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for Aragen Life Sciences centers on its established positioning as a technology-led global CRDMO serving over 400 life sciences customers, including 15 of the top 20 global pharmaceutical companies across discovery, development, and commercial manufacturing. Secular tailwinds from Western biopharma supply chain diversification away from China-dependent single-source models and the operational launch of high-potency API platforms like Aragen OneHP support premium CRDMO market share gains. Conversely, the anti-thesis highlights that private benchmark valuations of approximately $1.4 billion already discount multi-year margin expansion, leaving public market investors exposed to downstream biotech R&D budget cyclicality, regulatory compliance overhead, and lack of audited customer retention disclosure."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
    tableRefs:
      - "TV002"
  - id: "financing-history-and-valuation-discipline"
    title: "Financing History, Private Benchmarks, and Public Filing Context"
    body: "Aragen's capital structure entered its current phase in January 2025 when Asia healthcare-focused private equity firm Quadria Capital deployed $100 million for a minority stake alongside existing institutional sponsor Goldman Sachs, establishing an approximate benchmark enterprise valuation of USD 1.4 billion. In mid-2026, the company submitted its Draft Red Herring Prospectus to SEBI proposing an INR 800 crore primary fresh equity issuance paired with an Offer for Sale of 2.73 crore secondary shares. Financial performance figures indicated in draft filings reflect revenue growing 19% from INR 1,870 crore in FY25 to INR 2,226 crore in FY26, alongside a 43% expansion in profit after tax from INR 180 crore to INR 258 crore. However, critical parameters regarding post-issue debt reduction, share count dilution, and secondary overhang require careful valuation discipline."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    figureRefs:
      - "FV001"
  - id: "scenario-analysis-and-valuation-framework"
    title: "Scenario Analysis and Valuation Expectations"
    body: "Evaluating Aragen across bull, base, and bear operating scenarios underscores significant asymmetry in return potential relative to public market CRDMO peers like Syngene International and global CDMO benchmarks. In the bull case, accelerated commercialization of cytotoxic payloads at the 15,000-square-foot OneHP facility and commercial supply ramp-up support 20%+ compounding top-line growth and multiple expansion. In the base case, Aragen commands a fair-to-stretched valuation in line with historical ~19% CRDMO segment growth, while the bear case captures multiple compression triggered by regulatory scrutiny, delay in public market listing, or delayed biopharma spending recovery."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-diligence-pathway"
    title: "Recommendation Stance, Kill Criteria, and Diligence Asks"
    body: "Synthesizing available public evidence produces a research-more recommendation with medium confidence, high risk rating, and a stretched valuation stance. Entry at or above the $1.4 billion private mark leaves minimal margin of safety without unredacted disclosure of customer concentration, site-level gross margins across Hyderabad and Visakhapatnam facilities, and formal resolution of regulatory inspection observations. Diligence priorities before IPO commitment include verifying use of the INR 800 crore fresh proceeds, tracking retail subscription appetite under the proposed 35% reservation, and assessing key-person dependencies across the scientific workforce."
    claimRefs:
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
