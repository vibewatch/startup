chapter:
  number: 6
  title: Customers
  summary: Aragen Life Sciences demonstrates robust commercial stickiness across 591 biopharma customers with 95.00% of Fiscal 2026 revenue derived from repeat engagements, but accelerating top-10 revenue concentration to 43.29% and persistent contract re-bidding pressures introduce material account vulnerability.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Geographic Footprint
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
    body: Aragen Life Sciences operates as a specialized contract research, development, and manufacturing organization (CRDMO) serving a global customer base of 591 active client accounts as of Fiscal 2026. The company serves innovators across human therapeutics, animal health, and agrochemical sectors, including 16 of the top 20 global pharmaceutical corporations alongside over 100 emerging biotechnology enterprises. Geographically, Aragen exhibits heavy commercial orientation toward highly regulated Western life-sciences ecosystems. In Fiscal 2026, North American clients accounted for 54.80% (₹11,936.63 million) of revenue from operations, while European sponsors generated 29.67% (₹6,463.58 million). In contrast, domestic Indian customers contributed only 5.22% (₹1,136.99 million), with Rest of the World markets generating the remaining 10.31% (₹2,246.72 million). This geographic dispersion aligns Aragen with international biopharma innovation budgets but also concentrates macro and geopolitical exposure in North America and Western Europe.
  - id: adoption-and-durability
    title: Adoption Trajectory and Revenue Durability
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU002
    body: 'Aragen has expanded its customer count from over 450 accounts in Fiscal 2024 to 591 customers in Fiscal 2026, reflecting successful customer acquisition across both small molecule and biologics platforms. Commercial traction is characterized by exceptional relationship durability: in Fiscal 2026, 95.00% of total revenue from operations was derived from repeat business with existing clients, expanding from 89.88% in Fiscal 2025. This longevity is anchored in dedicated multi-year scientific engagements. Across the top 10 customer accounts in Fiscal 2026, the average commercial relationship tenure exceeded five years as of March 31, 2026. Furthermore, three of the top 10 customers and four of the Top 20 Big Pharma customers have remained continuously associated with Aragen for more than 20 years. Such multi-decade continuity underscores high structural switching costs once Aragen scientific teams integrate into a client drug discovery and development workflow.'
  - id: customer-proof-and-tenure
    title: Customer Proof, Longevity, and Engagement Depth
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU011
    tableRefs:
      - TU003
    body: While strict pharmaceutical confidentiality covenants preclude public disclosure of individual sponsor identities, Aragen provides substantial aggregate proof of high-tier customer validation. The company maintains active master services agreements across 16 of the world top 20 pharmaceutical companies. In Fiscal 2026, over 70 customer organizations availed solutions across both contract research (CRO) and contract development and manufacturing (CDMO), including six of the top 10 revenue-generating accounts. This cross-selling success demonstrates the efficacy of Aragen concept-to-commercialization strategy, wherein molecules discovered within early-phase chemistry and biology laboratories smoothly transition into clinical development and cGMP manufacturing suites. In advanced biologics, Aragen has developed and delivered 54 proprietary cell lines to clients since Fiscal 2019, providing verified technological proof across complex monoclonal antibody and recombinant protein workflows.
  - id: concentration-and-expansion-risks
    title: Customer Concentration, Pricing Pressure, and Procurement Risks
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU012
      - CU013
      - CU014
    figureRefs:
      - FU001
    body: Despite serving 591 total accounts, Aragen revenue profile exhibits sharply accelerating account concentration. The top 10 customers generated 43.29% (₹9,430.18 million) of total operating revenue in Fiscal 2026, compared to 35.41% in Fiscal 2025 and 31.36% in Fiscal 2024. Revenue from the largest single customer expanded from 5.26% in Fiscal 2024 to 12.61% (₹2,746.79 million) in Fiscal 2026, while the top five customers accounted for 33.27% (₹7,248.43 million). Contract research accounted for 64.51% of Fiscal 2026 revenue, predominantly deployed under Full-Time Equivalent (FTE) frameworks where clients fund dedicated scientific headcount. While FTE contracts provide revenue predictability, customer agreements remain non-exclusive. Regulatory disclosures reveal that existing customers have periodically initiated competitive vendor bidding, requiring Aragen to offer price concessions to protect strategic accounts amidst ongoing global CRDMO cost scrutiny.
