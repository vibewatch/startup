  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业服务组合
        blocks:
          - type: paragraph
            body: >-
              Aragen 作为一体化合同研究、开发与制造组织（CRDMO）运营，收入来自支持生物制药创新者完成药物发现和开发全周期。FY26，公司实现 ₹2,178.39 crore 合并经营收入，较 FY25 的
              ₹1,845.11 crore 同比增长 18.1%，自 FY24 起两年复合年增长率为 14.6%。收入结构以研究服务为锚：合同研究组织（CRO）解决方案贡献 FY26 收入的
              64.51%，提供覆盖化学和生物学的高毛利发现工作；合同开发与制造组织（CDMO）服务贡献剩余 35.49%，由小分子化学开发和规模化制造共同构成。从地域看，Aragen 收入高度暴露于成熟创新药枢纽：北美贡献
              FY26 收入的 54.80%，欧洲贡献 29.67%，合计超过总营业额的 84%，使收入轨迹直接连接全球生物制药研发支出和外包预算。
