          - type: callout
            title: 向高活性载荷与生物制剂进行战略模态扩张
            body: Hyderabad 的 Aragen OneHP 设施与 Bengaluru 的一次性生物反应器产能投入运营后，Aragen 有望承接更高毛利的复杂模态项目，包括抗体药物偶联物（ADC）载荷和治疗性蛋白。
            calloutType: insight
            claimRefs:
