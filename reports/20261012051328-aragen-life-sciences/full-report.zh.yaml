      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 一体化全球发现到制造 CRDMO 平台
            body: Aragen 已在印度和美国搭建覆盖小分子与生物制剂的一体化 CRDMO 业务，为 591 家客户提供服务，其中包括 FY26 全球前 20 大制药企业中的 16 家，且商业关系持续多年。
            calloutType: strength
            claimRefs:
              - CO002
