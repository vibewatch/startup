              Aragen 的运营成本结构同时受研究服务中的高技能科学劳动力和商业制造中的资本密集型基础设施驱动。FY26，公司报告税后利润 ₹257.64 crore，净利率 11.83%，自 FY24 的 ₹160.10
              crore 起复合年增长率为 26.9%。调整后 EBITDA 达到 ₹593 crore，资本回报率为 18%，净资产回报率为 11.9%。制造网络在 Nacharam、Mallapur 和
