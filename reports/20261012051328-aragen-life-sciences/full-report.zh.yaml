chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与全球 CRDMO 架构
        blocks:
          - type: paragraph
            body: >-
              Aragen Life Sciences Limited（前身为 GVK BIO）是一家总部位于印度的合同研究、开发与制造组织（CRDMO），为全球生命科学行业提供端到端科学解决方案。公司于 2001 年 4
              月在海得拉巴成立；二十多年间，它从一家专业信息学企业转型为服务全球生物制药创新者的全流程合作伙伴，覆盖小分子化学和大分子生物制剂。


              公司在海得拉巴 Nacharam 和 Mallapur 园区开展主要的管理、发现和制造业务，并在 Visakhapatnam、Bengaluru 和 Pune 设有活跃的 API 合成及制剂设施，同时在美国加州
              Morgan Hill 运营成熟的生物制剂研发中心。在这片分布式网络中，Aragen 拥有 364.12 kiloliters 小分子反应器产能和 25 kiloliters
              一次性生物制剂生物反应器产能。Fiscal 2026 年，公司实现 ₹2,178 crore 经营收入和 ₹593 crore 调整后 EBITDA，服务 591 个客户账户，其中包括全球前 20
              大制药跨国企业中的 16 家。
