      - number: '1.2'
        title: 高管团队与董事会治理结构
        blocks:
          - type: paragraph
            body: >-
              Aragen 的治理结构将原始发起人管理与专业合同服务高管团队结合起来。公司由基础设施至酒店业的 GVK 集团联合发起人 G.V. Sanjay Reddy 与前 Ranbaxy Laboratories
              首席执行官兼董事总经理 Davinder Singh Brar 共同推动。Brar 于 2004
              年以联合发起人兼董事长身份加入，为公司带来深厚的制药治理经验和国际商业网络，并帮助公司从信息学转向覆盖全流程的发现化学与开发。


              近二十年来，董事兼 CEO Manni Kantipudi 负责日常运营；他于 2007 年以总裁身份加入，主导 Aragen
              的机构化、美国生物制剂收购和品牌重塑。运营领导进一步下沉至各专业事业部负责人，包括担任 Small Molecules-CDMO CEO 的 Aniel Khubchandani。截至 2026 年 3
              月，这支核心团队管理 4,362 名员工，其中 3,412 人为科学专业人员，包括 450 多名博士研究人员，是亚洲合同研究生态中技术人才最集中的团队之一。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO010
