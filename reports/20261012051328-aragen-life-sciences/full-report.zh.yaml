              - CO010
          - type: callout
            title: IPO 前二级市场不透明与私募流动性障碍
            body: 在拟议的 SEBI 首次公开募股完成前，Aragen 股权仍由私人持有，二级市场准入仅限合格投资者，因此跨宏观经济周期都面临流动性约束和估值不确定性。
            calloutType: risk
