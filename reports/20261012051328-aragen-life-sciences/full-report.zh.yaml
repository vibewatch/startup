      - number: '3.3'
        title: 规模、分销能力与定价透明度
        blocks:
          - type: paragraph
            body: >-
              规模信号有意义，但并不一致。Mint 报道称，生物制剂在 2025 年贡献 Aragen 收入的 15%，并有三名客户从加州研究工作转入 Bengaluru 制造。公司披露从 2025 年 1 月的 400
              多名客户和约 4,500 名员工，变为 2026 年 3 月止年度的 591 名客户，以及 2026 年 7 月披露的 4,300
              多名员工。由于日期和口径不同，无法干净地推断增长或流失，但这些披露显示出可观的客户和科学覆盖面。定价仍不透明。管理层关于未来 ADC 生产成本可能比西方替代方案低约 60%
              的说法，是前瞻性成本主张，不等于实际价格、合同费率、毛利率或经独立验证的节省。
            claimRefs:
