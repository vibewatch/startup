      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              当工艺知识、分析方法和制造方案逐渐积累后，一体化可以提高切换摩擦，但指定来源没有续约、多供应商使用、输赢或转移时间证据。供应链多元化带来的竞争顺风也并非无条件。Mint
              的行业评论称，印度供应商仍需在数字化、流程和相对于中国的总成本竞争力上改进。Economic Times 引用另一项市场估算：印度占 $112 billion 全球 CRDMO 市场的 $8–9
              billion，即 8–10%，中国约占 14%；这些数字不应与其他市场口径混用。第三方管线目录列出 8 个临床前条目，但混合了组织和合作方记录，说明目录数量不能证明专有管线深度或竞争优势。
            claimRefs:
              - CP009
              - CP010
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 一体化高活性路径
            body: OneHP 为 Aragen 提供了从毫克级发现到多公斤 cGMP 生产的具体一体化能力主张，但设计产能和密闭控制仍需运营验证。
