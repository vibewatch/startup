        blocks:
          - type: paragraph
            body: >-
              Aragen 的市场拓展结合长期发现合作与按产能安排的制造项目。对于早期发现和临床前项目，Aragen 主要使用全职等效（FTE）订阅合同和按服务收费（FFS）协议，调配 3,412 名科学人员，其中包括 479
              名博士，分布在专门的化学和生物学套间。FY26，公司服务 591 家活跃全球客户，与全球前 20 大制药企业中的 16 家保持成熟关系。商业条款通常会随客户资产成熟而变化：早期靶点筛选和先导优化带来可预测的经常性
              FTE
              收入；进入临床前制剂和试生产批次合成后，则触发按里程碑和产量计费的合同付款。大型跨国制药客户可享受阶梯式数量返利和优先合作伙伴主服务协议，新兴生物科技客户则通常按标准商业卡价付款，账期更紧。由于收入确认遵循项目里程碑和
              FTE 计费周期，客户留存以及项目从早期发现推进到开发制造，是客户终身价值和扩张经济性的主要决定因素。
