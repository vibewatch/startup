    notes: 估值回报逻辑以 Quadria 于 2025 年 1 月以 $1.4B 进入的基准为参照，模拟潜在公开市场定价。
    claimRefs:
      - CV005
      - CV007
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 记录 Aragen 从专业信息学创业公司发展为一体化多模态全球 CRDMO 的关键历史里程碑。
    data:
      items:
        - date: '2001-04-02'
          label: 以 GVK BIO 名义成立
          detail: G.V. Sanjay Reddy 在印度 Hyderabad 创立 GVK BIO，提供信息学服务。
        - date: '2004-01-01'
          label: Brar 出任董事长
          detail: Ranbaxy 前 CEO Davinder Singh Brar 加入并担任联合发起人和董事长，推动业务拓展至药物发现。
        - date: '2007-06-01'
          label: Sequoia 投资与新领导层
          detail: Sequoia Capital 投资 GVK BIO；Manni Kantipudi 加入并担任总裁，负责推动运营规模化。
        - date: '2014-01-01'
          label: 收购 Aragen Bioscience
          detail: 在美国加州 Morgan Hill 收购 Aragen Bioscience，建立生物制剂和细胞系开发能力。
        - date: '2021-05-01'
          label: 更名为 Aragen 并获 Goldman Sachs 投资
          detail: GVK BIO 更名为 Aragen Life Sciences；Goldman Sachs 收购约 31.3% 股份，接替 ChrysCapital。
        - date: '2023-01-01'
          label: Bengaluru 生物制剂绿地项目
          detail: 开始投资 $30 million，在 Bengaluru 建设 25 KL 一次性生物反应器生物制剂设施。
        - date: '2025-01-13'
          label: Quadria Capital 投资 $100M
          detail: Quadria Capital 以约 $1.4 billion 的企业估值投资 $100 million，取得少数股权。
        - date: '2025-08-13'
          label: Avendus 与 SBI Life 二级融资
          detail: Avendus Future Leaders Fund 和 SBI Life 投资 ₹300 crore，取得约 2.5% 股份，对应估值 ₹12,200 crore。
        - date: '2026-08-27'
          label: 向 SEBI 提交 DRHP IPO 文件
          detail: 向 SEBI 提交红鲱鱼招股说明书草案，计划增发 ₹800 crore，并进行 2 crore 股 OFS。
        - date: '2026-10-08'
          label: OneHP 高活性设施启动
          detail: 在 Hyderabad 投运 15,000 sq ft 的 Aragen OneHP 平台，年度细胞毒性 API 产能为 500-600 kg。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO006
      - CO007
      - CO011
      - CO013
  - id: FM001
    title: CRDMO 市场层级与可触达机会层
    type: pyramid
    summary: 从 $112 billion 全球 CRDMO 市场逐层拆解至印度可触达份额和 Aragen 的运营覆盖。
    approximationNotes: 全球和印度市场规模来自 Avendus 与 Economic Times 报道（全球 $112B、印度 $8-9B）；细分产能和收入数据来自公司运营披露。
    claimRefs:
      - CM001
      - CM005
      - CM007
      - CM009
      - CM010
      - CM014
    data:
      items:
        - label: 全球 CRDMO 总可触达市场
          value: 112
          unit: USD B
          detail: 全球在小分子和生物制剂领域外包生命科学研发及生产的支出。
          claimRefs:
            - CM001
        - label: 中国 CRDMO 基准市场份额
          value: 15.7
          unit: USD B
          detail: 中国 CRDMO 行业约占全球市场支出的 14%，但可能受到西方供应链多元化影响。
          claimRefs:
            - CM001
        - label: 印度可服务可触达 CRDMO 市场
          value: 8.5
          unit: USD B
          detail: 印度 CRDMO 市场占全球支出的 8% 至 10%（$8B 至 $9B），受益于熟练化学人才和较低成本结构。
          claimRefs:
            - CM001
            - CM002
        - label: Aragen 可触达模态与 CDMO 支出
          value: 2
          unit: USD B
          detail: 印度一体化发现化学、生物学和小分子 API 制造的目标可触达支出。
          claimRefs:
            - CM004
            - CM009
        - label: 高活性与特色 cGMP 细分市场
          value: 0.6
          unit: USD B
          detail: OneHP 平台支持高活性 API（HPAPI）、细胞毒性肿瘤载荷及 ADC/PDC 服务。
          claimRefs:
            - CM007
            - CM008
        - label: Aragen 当前估算收入规模
          value: 0.25
          unit: USD B
          detail: 估算年度收入基准为 $200M 至 $300M，覆盖 400+ 客户，3 年 CDMO CAGR 为 19%。
          claimRefs:
            - CM005
            - CM010
            - CM014
  - id: FP001
    title: 公开证据有限下的竞争定位
    type: quadrant
    summary: 序位定位将已披露的运营广度与规模分开；不对质量、价格或客户成果排序。
    data:
      xAxis:
        label: 有公开证据支持的服务广度（1 窄 / 未知，5 一体化）
        min: 1
        max: 5
      yAxis:
        label: 有公开证据支持的规模（1 未量化，5 为本组最高）
        min: 1
        max: 5
      points:
        - label: Aragen
          x: 5
          'y': 4
          description: 已有证据记录一体化业务范围；据报收入接近 Anthem、高于 Sai，但低于 Syngene。
        - label: Anthem Biosciences
          x: 2
          'y': 4
          description: 收入有披露，但指定证据未能确认服务广度。
        - label: Sai Life Sciences
          x: 2
          'y': 3
          description: 收入有披露，但指定证据未能确认服务广度。
        - label: Syngene International
          x: 2
          'y': 5
          description: 在本组同业中披露收入最高；指定证据未能确认服务广度。
        - label: 已命名的全球 CRDMO
          x: 2
          'y': 1
          description: 有竞争者名称，但未留存可比的规模或能力指标。
        - label: 内部方案或多供应商方案
          x: 1
          'y': 1
          description: 概念性替代方案，指定证据中没有使用量或规模衡量。
    approximationNotes: 分析师序位评分仅使用指定来源的披露覆盖度：未知同业广度默认设为 2，未量化规模设为 1。评分不代表运营表现、市场份额或估值。
    claimRefs:
      - CP001
      - CP003
      - CP006
      - CP011
  - id: FI001
    title: CRDMO 收入转化桥
    type: flow
    summary: 从早期发现 FTE 合同，经工艺开发，逐步走向商业生产的价值捕获路径。
    data:
      nodes:
        - label: 目标发现（FTE 持续服务）
        - label: 临床前评估（里程碑与 FFS）
        - label: 工艺开发（批次合成）
        - label: GMP 生物制剂与临床规模（活动）
        - label: 商业生产（长期供应）
        - label: 一体化客户拓展（钱包份额）
      edges:
        - from: Target Discovery (FTE Retainer)
          to: Pre-clinical Evaluation (Milestone & FFS)
        - from: Pre-clinical Evaluation (Milestone & FFS)
          to: Process Development (Batch Synthesis)
        - from: Process Development (Batch Synthesis)
          to: GMP Biologics & Clinical Scale (Campaigns)
        - from: GMP Biologics & Clinical Scale (Campaigns)
          to: Commercial Manufacturing (Long-term Supply)
        - from: Commercial Manufacturing (Long-term Supply)
          to: Integrated Account Expansion (Wallet Share)
    approximationNotes: 代表一体化 CRDMO 客户的标准生命周期转化模型；单个合同的转化率未公开。
    claimRefs:
      - CI002
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Aragen CRDMO 服务交付栈的分层技术架构，覆盖客户治理、数字追踪、发现化学、专用隔离、GLP 安全和商业 cGMP 生产。
    data:
      layers:
        - label: 客户互动与界面层
          detail: 客户互动、项目启动和科学咨询
          modules:
            - 专门的项目管理团队
            - 每周里程碑报告与沟通治理
            - 知识产权保护和保密协议
        - label: 数字治理与工作流层（XLRATE）
          detail: 数字追踪、数据完整性和运营执行
          modules:
            - 电子实验记录本（ELN）
            - 持续工艺优化
            - 与里程碑挂钩的激励结构
        - label: 发现科学与生物学层
          detail: 早期分子设计、合成和筛选
          modules:
            - 药物化学与库合成
            - 靶点生物学与细胞筛选实验
            - 新靶点化合物优化
        - label: 专用隔离平台（Aragen OneHP）
          detail: 高活性 API 开发和临床生产
          modules:
            - Nacharam 的 15,000 sq ft 隔离设施
            - 职业暴露限值工程设计至 10 ng/m³
            - 年产 500-600 kg 的 cGMP API 产线
        - label: 临床前安全与 GLP 检测层
          detail: 临床前毒理学和监管申报资料
          modules:
            - Pune GLP 安全评估设施
            - AAALAC 认证的动物照护
            - 符合 NGCMA 要求的安全数据包
        - label: 商业 cGMP 生产基地
          detail: 扩产和商业化原料药交付
          modules:
            - Hyderabad 和 Vizag 合计 364 KL 的已安装小分子产能
            - 全球监管合规（USFDA、EDQM、PMDA、CDSCO）
            - Bengaluru 生物制剂开发和生产
    approximationNotes: 架构代表实体设施、数字平台和科学服务模块的功能组织。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从最初的 FTE 探索性发现合作，逐步走向一体化 cGMP 商业生产的采用路径。
    data:
      items:
        - label: 阶段 1：探索性接洽
          detail: 客户提出具体的化学合成或生物筛选需求，并通过小型按服务收费项目测试 Aragen 的能力。
          touchpoints:
            - 技术能力审查
            - 保密披露协议
            - 初步工单试点
        - label: 阶段 2：专属 FTE 团队
          detail: 客户转向专属全职等效科学团队，开展多靶点药物化学和生物学研究。
          touchpoints:
            - 分配专属实验室空间
            - 年度 FTE 服务协议
            - 双周科学指导
        - label: 阶段 3：先导化合物优化
          detail: 项目扩展至 ADME、体外实验、非临床毒理学和 GLP 标准下的安全评估。
          touchpoints:
            - 跨职能项目团队
            - GLP 研究报告交付
            - 候选物筛选关卡
        - label: 阶段 4：工艺开发
          detail: 成功分子转交化学开发团队，进行路线优化、危害评估和非 GMP 放大。
          touchpoints:
            - 技术转移里程碑
            - 工艺安全验证
            - 早期放大批次放行
        - label: 阶段 5：临床 cGMP 供应
          detail: 在 Hyderabad 和 Visakhapatnam 的 cGMP 认证反应器套间中生产批次，为 1-3 期临床试验供货。
          touchpoints:
            - 监管审计检查
            - 分析证书签署
            - 临床批次交付
        - label: 阶段 6：商业合作
          detail: 面向北美和欧洲申办方市场签订商业 API 长期供应合同，并提供监管支持。
          touchpoints:
            - 多年商业供应协议
            - 联合指导委员会
            - 年度产能预留
    approximationNotes: 代表根据 Aragen 从概念到商业化的服务披露归纳出的标准 CRDMO 客户拓展流程。
    claimRefs:
      - CU012
      - CU013
  - id: FR001
