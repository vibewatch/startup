      - number: '1.3'
        title: 资本化历程与机构持股结构
        blocks:
          - type: paragraph
            body: >-
              Aragen 的股权基础经历了多轮私募股权支持，这些资金持续投入实验室和制造扩张。继 Sequoia Capital 于 2007 年、ChrysCapital 于 2016 年早期入股后，Goldman
              Sachs 于 2021 年 5 月收购 ChrysCapital 的股份，形成约 31.3% 的核心机构持股；联合发起人 Gunupati Aparna Reddy 和 Davinder Singh Brar
              各持有约 33.7% 股权。


              2025 年 1 月，专注医疗健康的私募股权机构 Quadria Capital 投资 $100 million，取得少数股权，并锚定约 $1.4 billion（₹12,200
              crore）的企业估值基准。2025 年 8 月，Avendus Future Leaders Fund 与 SBI Life Insurance 联合领投 ₹300 crore
              老股交易，从发起人家族手中收购合计 2.5% 的股份。为建立永久性公众资本并购置资本设备，Aragen 于 2026 年 8 月向 SEBI 提交红鲱鱼招股说明书草案，拟上市发行 ₹800 crore
              新股，并配套发售最多 2 crore 股老股。不过，在上市完成前，二级交易仍缺乏流动性，只能在私募二级市场进行。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: 发展里程碑与先进模态产能扩张
        blocks:
          - type: paragraph
            body: >-
              Aragen 的商业轨迹体现出其在监管合规、地域布局和先进模态能力上的多年投入。关键转折包括 2014 年跨境收购加州 Aragen Bioscience，由此进入早期基因到 GMP
              生物制剂、细胞系开发和美国动物房研究；随后公司于 2021 年正式从 GVK BIO 更名为 Aragen Life Sciences。


              2023 至 2026 年间，Aragen 加快资本投入，在印度基础设施上投资超过 ₹1,000 crore，包括建设并完成 GMP 验收的 Bengaluru 绿色地标生物制剂制造中心（拥有 25
              kiloliters 一次性生物反应器产能），以及 2026 年 10 月在 Nacharam 商业启用 Aragen OneHP 平台。OneHP 运营一座 15,000-square-foot 设施，年产能为
              500-600 kilograms，密闭控制限值低至 10 ng/m³，可为抗体药物偶联物（ADCs）和高活性肿瘤化合物供应细胞毒性载荷。
            claimRefs:
