  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Evolutionary adoption path from initial FTE exploratory discovery engagements through integrated cGMP commercial
      manufacturing.
    data:
      items:
        - label: 'Phase 1: Exploratory Outreach'
          detail: >-
            Client identifies specific chemical synthesis or biological screening requirement and tests Aragen
            capabilities via small fee-for-service project.
          touchpoints:
            - Technical capability audit
            - Confidential disclosure agreement
            - Preliminary work-order pilot
        - label: 'Phase 2: Dedicated FTE Team'
          detail: >-
            Client transitions to dedicated Full-Time Equivalent scientific team for multi-target medicinal chemistry
            and biology research.
          touchpoints:
            - Dedicated lab space allocation
            - Annual FTE service agreement
            - Bi-weekly scientific steering
        - label: 'Phase 3: Lead Optimization'
          detail: >-
            Program expands across ADME, in vitro assays, nonclinical toxicology, and safety assessment under GLP
            standards.
          touchpoints:
            - Cross-functional project team
            - GLP study report delivery
            - Candidate selection gate
        - label: 'Phase 4: Process Development'
          detail: >-
            Successful molecules transfer to chemical development teams for route optimization, hazard evaluation, and
            non-GMP scale-up.
          touchpoints:
            - Tech transfer milestone
            - Process safety validation
            - Early scale-up batch release
        - label: 'Phase 5: Clinical cGMP Supply'
          detail: >-
            Batch manufacturing in cGMP-certified reactor suites across Hyderabad and Visakhapatnam to supply Phase 1-3
            clinical trials.
          touchpoints:
            - Regulatory audit inspection
            - Certificate of analysis sign-off
            - Clinical batch delivery
        - label: 'Phase 6: Commercial Partnering'
          detail: >-
            Long-term supply contract for commercial API and regulatory support across North American and European
            sponsor markets.
          touchpoints:
            - Multi-year commercial supply pact
            - Joint steering committee
            - Annual capacity reservation
    approximationNotes: >-
      Represents the standard CRDMO customer expansion workflow synthesized from Aragen concept-to-commercialization
      service disclosures.
