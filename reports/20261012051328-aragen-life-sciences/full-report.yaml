    title: Product architecture map
    type: stack
    summary: >-
      Hierarchical technical architecture of Aragen's CRDMO service delivery stack, spanning customer governance,
      digital tracking, discovery chemistry, specialized containment, GLP safety, and commercial cGMP manufacturing.
    data:
      layers:
        - label: Customer Engagement & Interface Layer
