      - number: '1.2'
        title: Executive Leadership and Board Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Aragen's governance structure combines original promoter stewardship with professional contract-services
              executive management. The company was co-promoted by G.V. Sanjay Reddy of the
              infrastructure-to-hospitality GVK Group conglomerate and Davinder Singh Brar, former Chief Executive
              Officer and Managing Director of Ranbaxy Laboratories. Brar joined the enterprise as Co-Promoter and
              Chairman in 2004, contributing deep pharmaceutical governance expertise and international commercial
              networks that helped redirect the company from informatics toward full-spectrum discovery chemistry and
              development.


              Day-to-day operational execution has been steered for nearly two decades by Director and Chief Executive
              Officer Manni Kantipudi, who joined as President in 2007 and orchestrated Aragen's institutionalization,
              US biologics acquisition, and corporate rebranding. Operating leadership is further decentralized across
              specialized divisional heads, including Aniel Khubchandani as Chief Executive Officer of Small
              Molecules-CDMO. This leadership core directs an aggregate workforce of 4,362 personnel as of March 2026,
              of which 3,412 are scientific specialists, including over 450 doctoral researchers, representing one of
              the largest technical talent concentrations in the Asian contract research ecosystem.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: Capitalization History and Institutional Shareholding Structure
        blocks:
          - type: paragraph
            body: >-
              Aragen's equity base has evolved through successive rounds of private equity sponsorship that funded
              continuous laboratory and manufacturing expansions. Following early institutional backing from Sequoia
              Capital in 2007 and ChrysCapital in 2016, Goldman Sachs entered in May 2021 by acquiring ChrysCapital's
              stake, establishing a cornerstone ~31.3% institutional holding alongside co-promoters Gunupati Aparna
              Reddy and Davinder Singh Brar, who each held approximately 33.7% equity.


              In January 2025, healthcare-focused private equity firm Quadria Capital invested $100 million for a
              minority equity holding, anchoring an enterprise valuation benchmark of approximately $1.4 billion
              (₹12,200 crore). This was followed in August 2025 by a ₹300 crore secondary transaction led jointly by
              Avendus Future Leaders Fund and SBI Life Insurance, which acquired an aggregate 2.5% stake from the
              promoter family. To establish permanent public capitalization and fund capital equipment purchases, Aragen
              submitted its Draft Red Herring Prospectus to SEBI in August 2026 for a public listing featuring an ₹800
              crore fresh issue alongside an offer for sale of up to 2 crore equity shares. However, pending public
              listing completion, secondary trading remains illiquid and restricted to private secondary markets.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: Evolutionary Milestones and Advanced Modal Capacity Expansion
        blocks:
          - type: paragraph
            body: >-
              The commercial trajectory of Aragen reflects deliberate multi-year investments in regulatory compliance,
              geographical presence, and advanced modality capabilities. Crucial turning points include the 2014
              cross-border acquisition of Aragen Bioscience in California, which provided entry into early-stage
              gene-to-GMP biologics, cell-line development, and US vivarium research, followed by the formal rebranding
              from GVK BIO to Aragen Life Sciences in 2021.


              Between 2023 and 2026, Aragen accelerated capital deployment, investing more than ₹1,000 crore across its
              Indian infrastructure. This included the construction and GMP commissioning of a greenfield biologics
              manufacturing center in Bengaluru with 25 kiloliters of single-use bioreactor capacity, as well as the
              October 2026 commercial opening of the Aragen OneHP platform at Nacharam. Operating a 15,000-square-foot
              facility capable of producing 500-600 kilograms annually under containment limits down to 10 ng/m³, OneHP
              positions the company to supply cytotoxic payloads for antibody-drug conjugates (ADCs) and highly potent
              oncology compounds.
            claimRefs:
              - CO001
              - CO002
              - CO012
              - CO013
