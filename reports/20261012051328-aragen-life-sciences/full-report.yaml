        - label: Preclinical Safety & GLP Testing Layer
          detail: Preclinical toxicology and regulatory dossiers
          modules:
            - Pune GLP safety assessment facility
            - AAALAC-accredited animal care
            - NGCMA-compliant safety data packages
        - label: Commercial cGMP Manufacturing Base
          detail: Scale-up and commercial bulk active ingredient delivery
          modules:
            - 364 KL installed small-molecule capacity across Hyderabad and Vizag
            - Global regulatory compliance (USFDA, EDQM, PMDA, CDSCO)
