chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Global CRDMO Architecture
        blocks:
          - type: paragraph
            body: >-
              Aragen Life Sciences Limited (formerly GVK BIO) is an India-headquartered contract research, development,
              and manufacturing organization (CRDMO) providing end-to-end scientific solutions to the global life
              sciences sector. Established in Hyderabad in April 2001, the company has transformed over two and a half
              decades from a specialized informatics venture into a fully integrated partner for global biopharma
              innovators across both small-molecule chemistry and large-molecule biologics workflows.


              The organization maintains primary executive, discovery, and manufacturing operations at its flagship
              Nacharam and Mallapur campuses in Hyderabad, complemented by active API synthesis and formulation
              facilities in Visakhapatnam, Bengaluru, and Pune, as well as an established biologics R&D center in Morgan
              Hill, California. Across this distributed footprint, Aragen operates 364.12 kiloliters of small-molecule
              reactor capacity alongside 25 kiloliters of single-use biologics bioreactor capacity. In Fiscal 2026, the
              company generated ₹2,178 crore in operating revenue and ₹593 crore in adjusted EBITDA, supporting 591
              customer accounts that include 16 of the top 20 pharmaceutical multinationals worldwide.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO012
