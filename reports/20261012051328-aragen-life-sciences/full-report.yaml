            - Target biology and cellular screening assays
            - Compound optimization for novel targets
        - label: Specialized Containment Platform (Aragen OneHP)
          detail: High-potency API development and clinical manufacturing
          modules:
            - 15,000 sq ft contained facility at Nacharam
