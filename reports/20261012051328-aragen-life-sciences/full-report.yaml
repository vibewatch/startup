  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Service Category Scope
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Aragen Life Sciences encompasses integrated contract research, development, and
              manufacturing organization (CRDMO) services across the life sciences continuum. The sector distinguishes
              between upstream drug discovery (medicinal chemistry, biology, target validation, and screening),
              nonclinical development (in vitro ADME, in vivo GLP toxicology, and safety pharmacology), and cGMP
              chemical manufacturing for clinical and commercial API supply. Traditional single-segment CROs or contract
              manufacturing organizations (CMOs) face structural pressure from biopharma sponsors seeking to consolidate
              vendor handoffs. Aragen's strategic scope spans concept-to-clinic workflows for small molecules and
              biologics, reinforced by targeted capability acquisitions such as Pune-based Intox to deliver
              GLP-compliant preclinical safety assessment. Adjacent spend across agrochemicals and animal health
              provides counter-cyclical volume buffers through corporate partnerships with global innovators such as FMC
              Corporation and Boehringer Ingelheim.
            claimRefs:
              - CM002
              - CM004
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM004
              - CM011
      - number: '2.2'
        title: Global CRDMO Sizing and Geographic Share
        blocks:
          - type: paragraph
            body: >-
              The global CRDMO market is valued at approximately $112 billion, representing worldwide sponsor
              expenditure across outsourced discovery, development, and active pharmaceutical ingredient synthesis.
              Geographic distribution reflects significant concentration, with China holding approximately 14% of the
              global market and India capturing an estimated $8 billion to $9 billion, or 8% to 10% of total spend.
              Within India's addressable segment, contract development and manufacturing has outpaced early-stage
              discovery, driven by capital-intensive expansions into advanced cGMP capacity. Aragen demonstrated a 19%
              compound annual growth rate in its contract development and manufacturing segment over the three years
              leading to March 2026, deploying over Rs 1,000 crore in capital expenditure to reach 364 KL of
              small-molecule capacity across Hyderabad and Visakhapatnam. Independent industry estimates place Aragen's
              baseline annual revenue between $200 million and $300 million across more than 400 customer accounts,
              positioning it among India's leading tier of private CRDMO platforms.
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Buyer Segmentation and Procurement Workflows
        blocks:
          - type: paragraph
            body: >-
              Outsourcing demand across the CRDMO landscape divides into distinct buyer personas characterized by
              disparate budget authorities, procurement hurdles, and service requirements. Top-20 global pharmaceutical
              companies manage procurement through centralized category sourcing teams prioritizing regulatory audit
              track records, multi-site business continuity, and geopolitical risk mitigation. Aragen services 15 of the
              top 20 global pharmaceutical leaders alongside emerging and mid-sized biotechnology innovators. Emerging
              biopharma sponsors operate with minimal internal wet-lab infrastructure, requiring fully integrated
              discovery chemistry, biological screening, and formulation development funded via venture capital or
              public equity tranches. Across both segments, buyer adoption is governed by intellectual property
              security, technical talent depth, and seamless handoffs across discovery and manufacturing. Aragen
              supports these multi-year workflows through a global team of over 4,300 employees, including more than 450
              PhD scientists operating across integrated campuses in India and the United States.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
      - number: '2.4'
        title: Growth Drivers, Infrastructure Barriers, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption of Indian CRDMO capacity is propelled by Western innovator supply chain de-risking and rising
              technical demand for complex synthetic modalities, particularly high-potency active pharmaceutical
              ingredients (HPAPIs), cytotoxic oncology payloads, and antibody-drug conjugates (ADCs). Aragen's
              commercialization of its OneHP platform at Nacharam provides containment for potent compounds down to 10
              ng/m3 occupational exposure limits, lowering handoff friction between discovery and commercial supply.
              However, adoption is constrained by high capital intensity and rigorous regulatory oversight, requiring
              continuous compliance across FDA-registered facilities in Hyderabad, Medchal, and Anakapalle. Critical
              diligence gaps remain regarding top-10 customer concentration, renewal rates, and plant-level gross margin
              realization across Bengaluru and Hyderabad. Without verified master services agreement renewal metrics and
              utilization data, the durability of Aragen's growth through broader pharmaceutical funding contractions
              cannot be fully established.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Geopolitical Supply Chain Reorganization as a Secular Tailwind
            body: >-
              Western pharmaceutical innovators are actively diversifying vendor concentration away from China. India's
              established 8% to 10% market share and deep chemical synthesis talent position integrated CRDMOs like
              Aragen to capture incremental discovery and CDMO programs as sponsors establish multi-country supply chain
              hedges.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Capital Intensity and High-Containment Execution Hurdles
            body: >-
              Expanding into high-potency APIs and antibody-drug conjugate payloads requires substantial upfront capital
              expenditure, evidenced by Aragen's Rs 1,000 crore deployment through March 2026. Without audited site
              utilization and batch throughput data, capital efficiency and margin resilience across volatile biotech
              funding cycles remain unverified.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The public evidence places Aragen in a direct Indian peer group with Anthem Biosciences, Sai Life
              Sciences, and Syngene International. Mint reported revenue of about ₹1,845 crore for Anthem, ₹1,695 crore
              for Sai, and ₹3,642 crore for Syngene, while Aragen management expected approximately ₹1,850 crore for
              fiscal 2025. A lower-reputation directory also names Evotec, WuXi AppTec, and Charles River Laboratories,
              but that list is directional rather than an independent capability benchmark. Buyers can also keep work
              in-house or coordinate several specialist vendors. Those substitutes follow from the job Aragen
              markets—integrated discovery, development, and manufacturing—not from disclosed market shares. The
              resulting landscape is broad, but only the Indian revenue comparison is quantitatively supported in the
              assigned evidence.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP011
      - number: '3.2'
        title: Capability differentiation and operating integration
        blocks:
          - type: paragraph
            body: >-
              Aragen's best-supported differentiation is breadth within its own platform rather than demonstrated
              superiority over named peers. Official pages describe integrated discovery across chemistry, biology, and
              biosafety, and a chemistry scope spanning small molecules, peptides, oligonucleotides, PROTACs,
              macrocycles, carbohydrates, nucleotides, and ADCs. In October 2026, the company said OneHP began operating
              with a designed annual API capacity of 500–600 kg and a path from milligram-scale discovery to
              multi-kilogram cGMP production. The same release says containment to 10 ng/m³ remained subject to ongoing
              validation. Economic Times separately reported the facility footprint and repeated company-supplied
              capacity data. This supports a credible handoff-reduction proposition, but it does not establish
              utilization, first-pass quality, or better outcomes than competing facilities.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Scale, distribution power, and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Scale signals are meaningful but uneven. Mint reported that biologics contributed 15% of Aragen revenue in
              2025 and that three customers had moved from California research work into Bengaluru manufacturing.
              Company-issued disclosures moved from more than 400 customers and roughly 4,500 employees in January 2025
              to 591 customers for the year ended March 2026 and 4,300-plus employees in July 2026. The different dates
              and definitions prevent a clean growth or attrition inference, although the disclosures indicate
              substantial customer and scientific reach. Pricing remains opaque. Management's 2025 expectation that
              future ADC production could be about 60% cheaper than Western alternatives is a forward cost claim, not a
              realized price, contract rate, gross margin, or independently verified saving.
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP011
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Integration can increase switching friction after process knowledge, analytical methods, and manufacturing
              protocols accumulate, but the assigned sources provide no renewal, multi-homing, win-loss, or
              transfer-time evidence. The competitive tailwind from supply-chain diversification is also conditional.
              Industry commentary in Mint says Indian providers still need to improve digitization, processes, and total
              cost competitiveness against China. Economic Times cited a different market estimate in which India
              represented $8–9 billion, or 8–10%, of a $112 billion global CRDMO market while China held about 14%;
              these figures should not be blended with other market definitions. A third-party pipeline directory lists
              eight preclinical entries but mixes organizational and collaborator records, illustrating why directory
              counts are not proof of proprietary pipeline depth or competitive advantage.
            claimRefs:
              - CP009
              - CP010
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated high-potency pathway
            body: >-
              OneHP gives Aragen a concrete integration claim from milligram-scale discovery through multi-kilogram cGMP
              production, although designed capacity and containment still require operating validation.
            calloutType: strength
            claimRefs:
              - CP004
          - type: callout
            title: Benchmarking remains incomplete
            body: >-
              The assigned evidence supports peer names and selected scale metrics, but not a like-for-like comparison
              of price, quality, utilization, switching friction, or regulatory performance.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Service Mix
        blocks:
          - type: paragraph
            body: >-
              Aragen operates as an integrated contract research, development, and manufacturing organization (CRDMO),
              deriving its revenue from supporting biopharmaceutical innovators throughout the drug discovery and
              development lifecycle. In FY26, the company generated consolidated revenue from operations of ₹2,178.39
              crore, accelerating by 18.1% year-over-year from ₹1,845.11 crore in FY25, and delivering a two-year
              compound annual growth rate of 14.6% since FY24. The revenue profile is structurally anchored by research
              services: contract research organization (CRO) solutions accounted for 64.51% of FY26 revenue, providing
              high-margin discovery work across chemistry and biology programmes. Contract development and manufacturing
              organization (CDMO) services contributed the remaining 35.49%, balanced between small-molecule chemical
              development and scaled manufacturing. Geographically, Aragen's revenue exhibits substantial exposure to
              developed innovator hubs: North America contributed 54.80% of FY26 revenue, while Europe generated 29.67%,
              collectively representing over 84% of total turnover and linking revenue trajectory directly to global
              biopharma R&D spending and outsourcing budgets.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI012
              - CI013
      - number: '4.2'
        title: Pricing Architecture and GTM Contracting Dynamics
        blocks:
          - type: paragraph
            body: >-
              The go-to-market motion at Aragen combines long-term discovery collaborations with capacity-based
              manufacturing campaigns. For early-stage discovery and preclinical programmes, Aragen primarily utilizes
              full-time equivalent (FTE) retainer contracts and fee-for-service (FFS) agreements, deploying its
              scientific workforce of 3,412 personnel, including 479 PhDs, across dedicated chemistry and biology
              suites. In FY26, the company served 591 active global customers, maintaining established relationships
              with 16 of the top 20 global pharmaceutical corporations. Commercial terms typically transition as
              customer assets mature: early-stage target screening and lead optimization generate predictable recurring
              FTE revenue, whereas advancement into preclinical formulation and pilot batch synthesis triggers milestone
              and volume-based contract payments. Large multinational pharmaceutical clients benefit from tiered volume
              rebates and preferred-partner master service agreements, while emerging biotech clients often pay standard
              commercial card rates with tighter payment terms. Because revenue recognition follows project milestone
              milestones and FTE billing cycles, customer retention and program progression from early discovery into
              development manufacturing represent the primary determinants of customer lifetime value and expansion
              economics.
            claimRefs:
              - CI003
              - CI004
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI013
      - number: '4.3'
        title: Cost Structure, Operating Margins, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Aragen's operating cost structure reflects the twin requirements of high-skilled scientific labor in
              research services and capital-intensive infrastructure in commercial manufacturing. In FY26, the company
              reported profit after tax of ₹257.64 crore, achieving a net profit margin of 11.83% and expanding at a
              26.9% CAGR from ₹160.10 crore in FY24. Adjusted EBITDA reached ₹593 crore, generating an 18% return on
              capital employed and an 11.9% return on equity. The manufacturing footprint comprises 364.12 kiloliters of
              small-molecule capacity across three production facilities in Nacharam, Mallapur, and Visakhapatnam,
              complemented by 2.50 kiloliters of commissioned single-use bioreactor capacity at its greenfield biologics
              campus in Bengaluru. Operating cash flow improved to ₹375.90 crore in FY26 compared to ₹335.70 crore in
              FY25, while free cash flow swung positive to ₹88.00 crore following a cash burn of negative ₹33.7 crore in
              FY25 that was driven by heavy facility investments and working capital absorption. Key unit economic
              indicators such as gross margin per facility and revenue per scientist remain undisclosed, forming a
              critical underwriting gap.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
      - number: '4.4'
        title: Capital Adequacy, IPO Capital Allocation, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Aragen's capital adequacy profile is approaching a transformative inflection point with its proposed
              public listing on the BSE and NSE. The draft red herring prospectus, filed on August 26, 2026, outlines an
              initial public offering comprising an ₹800 crore fresh issue alongside an offer for sale of up to
              27,329,192 equity shares by promoter and private equity shareholders. The company has explicitly earmarked
              ₹385 crore—approximately 48% of the fresh issue—to repay or prepay outstanding borrowings, which had
              already fallen from ₹645.47 crore in FY24 to ₹447.30 crore in FY26. An additional ₹225 crore is designated
              for capital equipment across Hyderabad and Bengaluru biologics facilities, directly expanding drug
              substance and fill-finish capacities. This follows a $100 million minority equity infusion from Quadria
              Capital in January 2025 at an approximate valuation of USD 1.4 billion. From an underwriting standpoint,
              Aragen presents strong earnings growth, improving cash generation, and deliberate deleveraging; however,
              complete underwriting remains constrained by undisclosed customer concentration, facility-level margin
              differentials, and potential volatility in Western biotechnology funding.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deleveraging Focus of the Proposed IPO
            body: >-
              Aragen's planned allocation of ₹385 crore—nearly half of its ₹800 crore fresh issue—directly toward debt
              reduction will noticeably reduce net interest expense and strengthen balance sheet resilience, expanding
              flexibility for its ongoing biologics capital expenditure.
            calloutType: insight
            claimRefs:
              - CI008
              - CI010
          - type: callout
            title: Cash Flow Volatility and Working Capital Intensity
            body: >-
              While FY26 operating cash flow rebounded to ₹375.90 crore and free cash flow turned positive to ₹88.00
              crore, the preceding negative free cash flow of -₹33.7 crore in FY25 underscores the sensitivity of CRDMO
              cash conversion to upfront working capital, facility ramp-up, and biotechnology funding cycles.
            calloutType: risk
            claimRefs:
              - CI005
              - CI007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Service Definition & Biopharma Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Aragen Life Sciences functions as an integrated technology-led CRDMO supporting global pharmaceutical,
              biotechnology, agrochemical, and animal health innovators across the complete discovery, development, and
              manufacturing continuum. The company structures its service delivery to bridge the traditional friction
              points between early molecular discovery and commercial chemical synthesis. By maintaining capabilities
              across both small molecules and large-molecule biologics, Aragen provides sponsors with unified project
              handoffs. Client engagements are coordinated through Aragen's proprietary XLRATE project management
              system, which standardizes milestone governance using electronic lab notebooks, dedicated project
              managers, and performance-aligned delivery incentives to maintain visibility and data integrity throughout
              iterative research campaigns.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Facility Infrastructure & High-Potency API Platform
        blocks:
          - type: paragraph
            body: >-
              Aragen's physical operations are distributed across six primary sites, with five facilities situated in
              key Indian biopharma clusters and one specialized biologics R&D site located in Morgan Hill, California.
              In October 2026, the company operationalized Aragen OneHP at its Nacharam campus in Hyderabad, a dedicated
              15,000-square-foot high-potency development and manufacturing platform. The facility features an initial
              commercial line engineered with a designed capacity of 500 to 600 kg of active pharmaceutical ingredient
              per year. Crucially, OneHP incorporates advanced isolation engineering capable of handling highly potent
              compounds at occupational exposure limits of up to 10 ng/m³, establishing the technical infrastructure
              required for cytotoxic oncology payloads, antibody-drug conjugates, and peptide-drug conjugates.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE014
