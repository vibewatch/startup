      - number: '5.3'
        title: Operating Architecture, Scientific Workforce & Manufacturing Scale
        blocks:
          - type: paragraph
            body: >-
              The operating architecture supporting Aragen's service delivery combines substantial physical reactor
              volume with an extensive scientific workforce. As of March 31, 2026, Aragen operated 364 KL of installed
              small-molecule capacity across its Hyderabad and Visakhapatnam manufacturing campuses. This scale is
              underpinned by more than ₹1,000 crore in cumulative capital expenditure invested over the three fiscal
              years ending March 2026 to modernize production lines and expand discovery infrastructure. The
              organization employs over 4,300 professionals globally, including more than 450 PhD-level researchers who
              execute discovery chemistry, biology screening, and route design, supporting preclinical pipelines
              targeting critical oncology and kinase mechanisms.
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
      - number: '5.4'
        title: Regulatory Governance, Quality Controls & Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Quality governance across Aragen's network is validated by routine inspections and accreditations from
              major international health authorities, including the USFDA, EDQM, PMDA, and CDSCO, alongside GLP and
              AAALAC certifications for its Pune toxicology facility. Despite these credentials, key technical and
              operational risks persist across the operating model. The newly commissioned Aragen OneHP platform
              currently relies on a single operational manufacturing line, introducing equipment decontamination
              downtime and batch concentration risks. Furthermore, independent visibility into site-level gross margins,
              batch cadences, and first-pass quality rates at the Bengaluru biologics facility remains constrained by
              private disclosure limitations.
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Containment Engineering as a Strategic Differentiation Moat
            body: >-
              The launch of Aragen OneHP addresses a critical technical barrier in biopharma outsourcing by providing
              containment capabilities down to 10 ng/m³ OEL. This allows Aragen to capture lucrative high-potency API,
              ADC, and PDC programs that standard contract manufacturers cannot handle due to safety and
              cross-contamination constraints.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Single-Line Bottleneck in High-Potency Manufacturing
            body: >-
              While Aragen OneHP significantly broadens technical capabilities into cytotoxic and targeted oncology
              modalities, the current facility configuration operates only one manufacturing line designed for 500-600
              kg/year. Any unplanned containment breach, equipment decontamination delay, or batch failure creates
              concentrated delivery risk for early commercial programs.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Aragen Life Sciences operates as a specialized contract research, development, and manufacturing
              organization (CRDMO) serving a global customer base of 591 active client accounts as of Fiscal 2026. The
              company serves innovators across human therapeutics, animal health, and agrochemical sectors, including 16
              of the top 20 global pharmaceutical corporations alongside over 100 emerging biotechnology enterprises.
              Geographically, Aragen exhibits heavy commercial orientation toward highly regulated Western life-sciences
              ecosystems. In Fiscal 2026, North American clients accounted for 54.80% (₹11,936.63 million) of revenue
              from operations, while European sponsors generated 29.67% (₹6,463.58 million). In contrast, domestic
              Indian customers contributed only 5.22% (₹1,136.99 million), with Rest of the World markets generating the
              remaining 10.31% (₹2,246.72 million). This geographic dispersion aligns Aragen with international
              biopharma innovation budgets but also concentrates macro and geopolitical exposure in North America and
              Western Europe.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption Trajectory and Revenue Durability
        blocks:
          - type: paragraph
            body: >-
              Aragen has expanded its customer count from over 450 accounts in Fiscal 2024 to 591 customers in Fiscal
              2026, reflecting successful customer acquisition across both small molecule and biologics platforms.
              Commercial traction is characterized by exceptional relationship durability: in Fiscal 2026, 95.00% of
              total revenue from operations was derived from repeat business with existing clients, expanding from
              89.88% in Fiscal 2025. This longevity is anchored in dedicated multi-year scientific engagements. Across
              the top 10 customer accounts in Fiscal 2026, the average commercial relationship tenure exceeded five
              years as of March 31, 2026. Furthermore, three of the top 10 customers and four of the Top 20 Big Pharma
              customers have remained continuously associated with Aragen for more than 20 years. Such multi-decade
              continuity underscores high structural switching costs once Aragen scientific teams integrate into a
              client drug discovery and development workflow.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Customer Proof, Longevity, and Engagement Depth
        blocks:
          - type: paragraph
            body: >-
              While strict pharmaceutical confidentiality covenants preclude public disclosure of individual sponsor
              identities, Aragen provides substantial aggregate proof of high-tier customer validation. The company
              maintains active master services agreements across 16 of the world top 20 pharmaceutical companies. In
              Fiscal 2026, over 70 customer organizations availed solutions across both contract research (CRO) and
              contract development and manufacturing (CDMO), including six of the top 10 revenue-generating accounts.
              This cross-selling success demonstrates the efficacy of Aragen concept-to-commercialization strategy,
              wherein molecules discovered within early-phase chemistry and biology laboratories smoothly transition
              into clinical development and cGMP manufacturing suites. In advanced biologics, Aragen has developed and
              delivered 54 proprietary cell lines to clients since Fiscal 2019, providing verified technological proof
              across complex monoclonal antibody and recombinant protein workflows.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU007
              - CU011
      - number: '6.4'
        title: Customer Concentration, Pricing Pressure, and Procurement Risks
        blocks:
          - type: paragraph
            body: >-
              Despite serving 591 total accounts, Aragen revenue profile exhibits sharply accelerating account
              concentration. The top 10 customers generated 43.29% (₹9,430.18 million) of total operating revenue in
              Fiscal 2026, compared to 35.41% in Fiscal 2025 and 31.36% in Fiscal 2024. Revenue from the largest single
              customer expanded from 5.26% in Fiscal 2024 to 12.61% (₹2,746.79 million) in Fiscal 2026, while the top
              five customers accounted for 33.27% (₹7,248.43 million). Contract research accounted for 64.51% of Fiscal
              2026 revenue, predominantly deployed under Full-Time Equivalent (FTE) frameworks where clients fund
              dedicated scientific headcount. While FTE contracts provide revenue predictability, customer agreements
              remain non-exclusive. Regulatory disclosures reveal that existing customers have periodically initiated
              competitive vendor bidding, requiring Aragen to offer price concessions to protect strategic accounts
              amidst ongoing global CRDMO cost scrutiny.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Accelerating Revenue Concentration in Lead Accounts
            body: >-
              Aragen top-10 customer revenue share expanded from 31.36% in FY2024 to 43.29% in FY2026, while its anchor
              customer now represents 12.61% of total operations. This increasing dependence magnifies downside exposure
              to client-specific pipeline setbacks, clinical trial discontinuations, or vendor consolidation decisions.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: callout
            title: High Repeat Business Underpins Cash-Flow Stability
            body: >-
              With 95.00% of Fiscal 2026 operating revenue derived from repeat engagements and multi-decade partnerships
              with major pharmaceutical leaders, Aragen demonstrates deep operational stickiness. The predominance of
              dedicated FTE discovery contracts provides predictable resource utilization and mitigates immediate volume
              volatility.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, cGMP Audits, and Legal Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Aragen Life Sciences operates within a rigorous, multi-jurisdictional regulatory compliance environment
              necessitated by its role as an integrated CRDMO supplying commercial active pharmaceutical ingredients and
              clinical intermediates to global innovator biopharma clients. The company maintains quality and
              manufacturing certifications from leading global health authorities including the US FDA, the European
              Medicines Agency, Japan's PMDA, and India's CDSCO, complemented by ISO 9001 quality management and ISO
              14001 environmental certifications. While these accreditations reflect substantial compliance maturity and
              allow Aragen to export to tightly regulated Western markets, they also expose operating facilities to
              continuous inspection scrutiny. A negative audit finding, such as unresolved Form 483 inspection
              observations, could escalate into warning letters or import alerts that would disrupt active drug
              substance delivery and cause severe reputational damage. Concurrently, Aragen's corporate legal posture is
              centered on its August 2026 Draft Red Herring Prospectus filing with SEBI for an initial public offering
              comprising an ₹800 crore fresh issue alongside an offer for sale by institutional shareholders. The
              regulatory review process by SEBI represents an immediate gate, where scrutiny of historical related-party
              disclosures, corporate governance standards, and facility compliance records could influence public
              listing timelines.
            claimRefs:
              - CR001
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR008
      - number: '7.2'
        title: Operational Reliability, Containment Safety, and Workforce Retention
        blocks:
          - type: paragraph
            body: >-
              Operational risk at Aragen is defined by the technical complexity of scaling synthetic chemical and
              biological molecules across commercial batches. The recent commissioning of the OneHP platform at Nacharam
              in Hyderabad highlights both an advanced operational capability and a heightened safety profile. Designed
              with a 15,000-square-foot footprint to produce 500 to 600 kg of high-potency APIs annually, the platform
              integrates discovery, process development, and cGMP commercial manufacturing for highly potent cytotoxic
              payloads used in oncology and antibody-drug conjugates. Engineering controls must maintain occupational
              exposure limits down to 10 ng/m³, creating an acute operational hazard where any containment failure or
              cross-contamination incident could endanger specialized personnel, invalidate expensive batches, and
              trigger facility shutdowns. Furthermore, Aragen's business model relies heavily on scientific human
              capital, with more than 4,300 total employees including over 450 PhD-level researchers distributed across
              six global operating campuses. In the competitive Indian life sciences outsourcing corridor, retaining
              experienced medicinal chemists, process engineers, and regulatory specialists is critical. Escalating
              compensation pressure and voluntary turnover among senior project directors present ongoing risks to
              client delivery timelines and experimental reproducibility.
            claimRefs:
              - CR005
              - CR006
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR009
      - number: '7.3'
        title: Client Concentration, Partner Dependencies, and Balance Sheet Leverage
        blocks:
          - type: paragraph
            body: >-
              Aragen's commercial architecture combines broad market reach with significant client concentration among
              tier-one global biopharma innovators. While the company serves over 400 clients globally, including seven
              of the top ten pharmaceutical multinationals and more than 100 biotechnology firms, revenue generation
              remains heavily weighted toward anchor programs. In outsourced development contracts, top pharmaceutical
              customers possess substantial bargaining power and can abruptly curtail, pause, or insource development
              programs in response to clinical pipeline readouts or macroeconomic cost-containment initiatives. This
              dynamic is visible in dedicated customer arrangements, such as Aragen's partnership with Azurity
              Pharmaceuticals involving a dedicated formulation development center, where dedicated assets could suffer
              low utilization if the partner's product portfolio rationalizes. On the balance sheet, Aragen absorbed
              significant debt to support a multi-year capital expenditure program exceeding ₹1,000 crore leading up to
              March 2026, which expanded small-molecule capacity to 364 KL across Hyderabad and Visakhapatnam. The
              company's decision to allocate the majority of its ₹800 crore IPO fresh issue proceeds toward borrowing
              repayment underscores high debt-service requirements, leaving the business financially vulnerable if
              market volatility delays the public offering.
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Enterprise Risk Synthesis, Monitoring Indicators, and Investment Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing Aragen's risk landscape reveals an enterprise operating with established technical moats in
              small-molecule chemistry and high-potency payloads, but carrying significant operating and balance sheet
              leverage ahead of its public market transition. As a pure-play CRDMO service provider with no internal
              proprietary drug pipeline, Aragen is sheltered from binary clinical trial failure risks but remains
              directly exposed to customer R&D spending budgets and capacity utilization cycles. Institutional
              governance is anchored by Quadria Capital's $100 million investment in January 2025 at an approximate
              valuation of $1.4 billion alongside longtime backer Goldman Sachs, yet the impending Offer for Sale
              creates potential secondary market equity overhang post-IPO. For prospective investors, monitoring
              indicators must include SEBI DRHP clearance milestones, primary inspection reports from US FDA and
              European audits, gross-margin progression across the Bengaluru biologics facility, and voluntary attrition
              rates among key PhD researchers. Specific thesis-break triggers that would justify an immediate downgrade
              or negative investment stance include any US FDA Official Action Indicated (OAI) inspection
              classification, loss of anchor top-10 biopharma accounts, or post-listing cancellation of planned debt
              repayment resulting in sustained interest coverage degradation.
            claimRefs:
              - CR004
              - CR011
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR011
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Capital Intensity and Debt Service Pre-IPO
            body: >-
              Aragen deployed over ₹1,000 crore in capital expenditure across fiscal 2024–2026 to expand small-molecule
              capacity to 364 KL and launch its OneHP platform. With an ₹800 crore fresh-issue IPO filed with SEBI
              primarily targeted at debt repayment, any delay in public listing or equity market volatility creates
              near-term refinancing friction and heightened interest burden.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: Operational Moat vs. Execution Hazards in Advanced High-Potency Payloads
            body: >-
              The commissioning of OneHP provides Aragen with rare containment capability down to 10 ng/m³ for cytotoxic
              payloads, positioning the company favorably for high-margin ADC programs. However, handling potent
              oncology APIs introduces stringent occupational safety and cross-contamination risks that demand flawless
              cGMP execution across commercial batches.
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Aragen Life Sciences centers on its established positioning as a
              technology-led global CRDMO serving over 400 life sciences customers, including 15 of the top 20 global
              pharmaceutical companies across discovery, development, and commercial manufacturing. Secular tailwinds
              from Western biopharma supply chain diversification away from China-dependent single-source models and the
              operational launch of high-potency API platforms like Aragen OneHP support premium CRDMO market share
              gains. Conversely, the anti-thesis highlights that private benchmark valuations of approximately $1.4
              billion already discount multi-year margin expansion, leaving public market investors exposed to
              downstream biotech R&D budget cyclicality, regulatory compliance overhead, and lack of audited customer
              retention disclosure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
      - number: '8.2'
        title: Financing History, Private Benchmarks, and Public Filing Context
        blocks:
          - type: paragraph
            body: >-
              Aragen's capital structure entered its current phase in January 2025 when Asia healthcare-focused private
              equity firm Quadria Capital deployed $100 million for a minority stake alongside existing institutional
              sponsor Goldman Sachs, establishing an approximate benchmark enterprise valuation of USD 1.4 billion. In
              mid-2026, the company submitted its Draft Red Herring Prospectus to SEBI proposing an INR 800 crore
              primary fresh equity issuance paired with an Offer for Sale of 2.73 crore secondary shares. Financial
              performance figures indicated in draft filings reflect revenue growing 19% from INR 1,870 crore in FY25 to
              INR 2,226 crore in FY26, alongside a 43% expansion in profit after tax from INR 180 crore to INR 258
              crore. However, critical parameters regarding post-issue debt reduction, share count dilution, and
              secondary overhang require careful valuation discipline.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
      - number: '8.3'
        title: Scenario Analysis and Valuation Expectations
        blocks:
          - type: paragraph
            body: >-
              Evaluating Aragen across bull, base, and bear operating scenarios underscores significant asymmetry in
              return potential relative to public market CRDMO peers like Syngene International and global CDMO
              benchmarks. In the bull case, accelerated commercialization of cytotoxic payloads at the
              15,000-square-foot OneHP facility and commercial supply ramp-up support 20%+ compounding top-line growth
              and multiple expansion. In the base case, Aragen commands a fair-to-stretched valuation in line with
              historical ~19% CRDMO segment growth, while the bear case captures multiple compression triggered by
              regulatory scrutiny, delay in public market listing, or delayed biopharma spending recovery.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Recommendation Stance, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing available public evidence produces a research-more recommendation with medium confidence,
              high risk rating, and a stretched valuation stance. Entry at or above the $1.4 billion private mark leaves
              minimal margin of safety without unredacted disclosure of customer concentration, site-level gross margins
              across Hyderabad and Visakhapatnam facilities, and formal resolution of regulatory inspection
              observations. Diligence priorities before IPO commitment include verifying use of the INR 800 crore fresh
              proceeds, tracking retail subscription appetite under the proposed 35% reservation, and assessing
              key-person dependencies across the scientific workforce.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Secondary Liquidity Pressure via 2.73 Crore Share OFS
            body: >-
              While the proposed INR 800 crore fresh capital injection directly supports balance sheet strengthening,
              the concurrent Offer for Sale of 2.73 crore shares signals significant institutional and promoter
              profit-taking. Prospective investors must scrutinize the selling shareholder roster to distinguish between
              natural private equity liquidity cycles and potential confidence erosion from long-term insiders.
            calloutType: risk
            claimRefs:
              - CV007
              - CV014
          - type: callout
            title: Valuation Discipline Thresholds for IPO Participation
            body: >-
              Investors should avoid bidding above the implied $1.4 billion enterprise value established during the
              January 2025 Quadria financing round until detailed DRHP schedules clarify revenue concentration among the
              top 10 customers and post-capex free cash flow generation.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV013
