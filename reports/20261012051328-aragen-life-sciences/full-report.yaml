figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key historical milestones tracing Aragen's evolution from a specialized informatics venture to an integrated
      multi-modality global CRDMO.
    data:
      items:
        - date: '2001-04-02'
          label: Founding as GVK BIO
          detail: G.V. Sanjay Reddy establishes GVK BIO as an informatics services company in Hyderabad, India.
        - date: '2004-01-01'
          label: Brar Joins as Chairman
          detail: >-
            Former Ranbaxy CEO Davinder Singh Brar joins as Co-Promoter and Chairman, steering expansion into drug
            discovery.
        - date: '2007-06-01'
          label: Sequoia Investment & New Leadership
          detail: Sequoia Capital invests in GVK BIO; Manni Kantipudi joins as President to lead operational scaling.
        - date: '2014-01-01'
          label: Aragen Bioscience Acquisition
          detail: >-
            Acquires US-based Aragen Bioscience in Morgan Hill, California, establishing biologics and cell line
            development capabilities.
        - date: '2021-05-01'
          label: Rebranding to Aragen & Goldman Sachs Investment
          detail: GVK BIO rebrands to Aragen Life Sciences; Goldman Sachs acquires ~31.3% stake replacing ChrysCapital.
        - date: '2023-01-01'
          label: Bengaluru Biologics Greenfield
          detail: Commences $30 million investment in 25 KL single-use bioreactor biologics facility in Bengaluru.
        - date: '2025-01-13'
          label: Quadria Capital $100M Investment
          detail: >-
            Quadria Capital invests $100 million for a minority stake at approximately $1.4 billion enterprise
            valuation.
        - date: '2025-08-13'
          label: Avendus & SBI Life Secondary Funding
          detail: Avendus Future Leaders Fund and SBI Life invest ₹300 crore for ~2.5% stake at ₹12,200 crore valuation.
        - date: '2026-08-27'
          label: SEBI DRHP IPO Filing
          detail: Files Draft Red Herring Prospectus with SEBI for ₹800 crore fresh issue plus 2 crore share OFS.
        - date: '2026-10-08'
          label: OneHP High-Potency Facility Launch
          detail: >-
            Operationalizes 15,000 sq ft Aragen OneHP platform in Hyderabad with 500-600 kg annual cytotoxic API
            capacity.
