  topStrengths:
    - 客户规模大且分散，在全球生物制药客户中有较深的重复合作基础。
    - 盈利能力和现金创造能力改善，同时 IPO 去杠杆计划表述清晰。
    - 多模态平台持续扩展，覆盖发现研究、小分子、生物制剂和高活性能力。
  topRisks:
