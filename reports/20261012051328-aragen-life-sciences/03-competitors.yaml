company:
  name: "Aragen Life Sciences"
chapter:
  number: 3
  title: "Competitors"
  summary: "Aragen sits near Anthem Biosciences and Sai Life Sciences on reported revenue, below Syngene International, while differentiating through an integrated discovery-to-manufacturing pitch and newly operational high-potency capacity. The evidence does not support a definitive feature or pricing winner: peer capability detail, realized contract rates, switching data, and utilization remain material diligence gaps."
sections:
  - id: "competitive-set"
    title: "Competitive set and buyer alternatives"
    body: >-
      The public evidence places Aragen in a direct Indian peer group with Anthem Biosciences,
      Sai Life Sciences, and Syngene International. Mint reported revenue of about ₹1,845 crore
      for Anthem, ₹1,695 crore for Sai, and ₹3,642 crore for Syngene, while Aragen management
      expected approximately ₹1,850 crore for fiscal 2025. A lower-reputation directory also
      names Evotec, WuXi AppTec, and Charles River Laboratories, but that list is directional
      rather than an independent capability benchmark. Buyers can also keep work in-house or
      coordinate several specialist vendors. Those substitutes follow from the job Aragen
      markets—integrated discovery, development, and manufacturing—not from disclosed market
      shares. The resulting landscape is broad, but only the Indian revenue comparison is
      quantitatively supported in the assigned evidence.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP011"
    tableRefs:
      - "TP001"
  - id: "capability-differentiation"
    title: "Capability differentiation and operating integration"
    body: >-
      Aragen's best-supported differentiation is breadth within its own platform rather than
      demonstrated superiority over named peers. Official pages describe integrated discovery
      across chemistry, biology, and biosafety, and a chemistry scope spanning small molecules,
      peptides, oligonucleotides, PROTACs, macrocycles, carbohydrates, nucleotides, and ADCs.
      In October 2026, the company said OneHP began operating with a designed annual API capacity
      of 500–600 kg and a path from milligram-scale discovery to multi-kilogram cGMP production.
      The same release says containment to 10 ng/m³ remained subject to ongoing validation.
      Economic Times separately reported the facility footprint and repeated company-supplied
      capacity data. This supports a credible handoff-reduction proposition, but it does not
      establish utilization, first-pass quality, or better outcomes than competing facilities.
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
    tableRefs:
      - "TP002"
  - id: "scale-distribution-and-pricing"
    title: "Scale, distribution power, and pricing visibility"
    body: >-
      Scale signals are meaningful but uneven. Mint reported that biologics contributed 15% of
      Aragen revenue in 2025 and that three customers had moved from California research work
      into Bengaluru manufacturing. Company-issued disclosures moved from more than 400 customers
      and roughly 4,500 employees in January 2025 to 591 customers for the year ended March 2026
      and 4,300-plus employees in July 2026. The different dates and definitions prevent a clean
      growth or attrition inference, although the disclosures indicate substantial customer and
      scientific reach. Pricing remains opaque. Management's 2025 expectation that future ADC
      production could be about 60% cheaper than Western alternatives is a forward cost claim,
      not a realized price, contract rate, gross margin, or independently verified saving.
    claimRefs:
      - "CP008"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP016"
    tableRefs:
      - "TP003"
    figureRefs:
      - "FP001"
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      Integration can increase switching friction after process knowledge, analytical methods,
      and manufacturing protocols accumulate, but the assigned sources provide no renewal,
      multi-homing, win-loss, or transfer-time evidence. The competitive tailwind from supply-chain
      diversification is also conditional. Industry commentary in Mint says Indian providers still
      need to improve digitization, processes, and total cost competitiveness against China.
      Economic Times cited a different market estimate in which India represented $8–9 billion,
      or 8–10%, of a $112 billion global CRDMO market while China held about 14%; these figures
      should not be blended with other market definitions. A third-party pipeline directory lists
      eight preclinical entries but mixes organizational and collaborator records, illustrating
      why directory counts are not proof of proprietary pipeline depth or competitive advantage.
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP015"
