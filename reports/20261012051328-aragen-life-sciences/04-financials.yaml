    body: "Aragen's planned allocation of ₹385 crore—nearly half of its ₹800 crore fresh issue—directly toward debt reduction will noticeably reduce net interest expense and strengthen balance sheet resilience, expanding flexibility for its ongoing biologics capital expenditure."
