company:
  name: "Aragen Life Sciences"
chapter:
  number: 4
  title: "Financials"
  summary: "Aragen Life Sciences demonstrates solid financial expansion with FY26 operating revenue reaching ₹2,178.39 crore (14.6% two-year CAGR) and PAT rising to ₹257.64 crore (11.83% margin), led by its core CRO research franchise. The proposed ₹800 crore fresh IPO issue earmarks ₹385 crore for debt repayment and ₹225 crore for facility and biologics expansion, significantly strengthening balance sheet durability despite historical cash flow volatility and undisclosed site-level unit economics."
sections:
  - id: "revenue-streams-and-commercial-mix"
    title: "Revenue Streams and Commercial Service Mix"
    body: "Aragen operates as an integrated contract research, development, and manufacturing organization (CRDMO), deriving its revenue from supporting biopharmaceutical innovators throughout the drug discovery and development lifecycle. In FY26, the company generated consolidated revenue from operations of ₹2,178.39 crore, accelerating by 18.1% year-over-year from ₹1,845.11 crore in FY25, and delivering a two-year compound annual growth rate of 14.6% since FY24. The revenue profile is structurally anchored by research services: contract research organization (CRO) solutions accounted for 64.51% of FY26 revenue, providing high-margin discovery work across chemistry and biology programmes. Contract development and manufacturing organization (CDMO) services contributed the remaining 35.49%, balanced between small-molecule chemical development and scaled manufacturing. Geographically, Aragen's revenue exhibits substantial exposure to developed innovator hubs: North America contributed 54.80% of FY26 revenue, while Europe generated 29.67%, collectively representing over 84% of total turnover and linking revenue trajectory directly to global biopharma R&D spending and outsourcing budgets."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-structure-and-gtm-motion"
    title: "Pricing Architecture and GTM Contracting Dynamics"
    body: "The go-to-market motion at Aragen combines long-term discovery collaborations with capacity-based manufacturing campaigns. For early-stage discovery and preclinical programmes, Aragen primarily utilizes full-time equivalent (FTE) retainer contracts and fee-for-service (FFS) agreements, deploying its scientific workforce of 3,412 personnel, including 479 PhDs, across dedicated chemistry and biology suites. In FY26, the company served 591 active global customers, maintaining established relationships with 16 of the top 20 global pharmaceutical corporations. Commercial terms typically transition as customer assets mature: early-stage target screening and lead optimization generate predictable recurring FTE revenue, whereas advancement into preclinical formulation and pilot batch synthesis triggers milestone and volume-based contract payments. Large multinational pharmaceutical clients benefit from tiered volume rebates and preferred-partner master service agreements, while emerging biotech clients often pay standard commercial card rates with tighter payment terms. Because revenue recognition follows project milestone milestones and FTE billing cycles, customer retention and program progression from early discovery into development manufacturing represent the primary determinants of customer lifetime value and expansion economics."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI013"
    tableRefs:
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure, Operating Margins, and Unit Economics"
    body: "Aragen's operating cost structure reflects the twin requirements of high-skilled scientific labor in research services and capital-intensive infrastructure in commercial manufacturing. In FY26, the company reported profit after tax of ₹257.64 crore, achieving a net profit margin of 11.83% and expanding at a 26.9% CAGR from ₹160.10 crore in FY24. Adjusted EBITDA reached ₹593 crore, generating an 18% return on capital employed and an 11.9% return on equity. The manufacturing footprint comprises 364.12 kiloliters of small-molecule capacity across three production facilities in Nacharam, Mallapur, and Visakhapatnam, complemented by 2.50 kiloliters of commissioned single-use bioreactor capacity at its greenfield biologics campus in Bengaluru. Operating cash flow improved to ₹375.90 crore in FY26 compared to ₹335.70 crore in FY25, while free cash flow swung positive to ₹88.00 crore following a cash burn of negative ₹33.7 crore in FY25 that was driven by heavy facility investments and working capital absorption. Key unit economic indicators such as gross margin per facility and revenue per scientist remain undisclosed, forming a critical underwriting gap."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI012"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-financial-verdict"
    title: "Capital Adequacy, IPO Capital Allocation, and Diligence Verdict"
    body: "Aragen's capital adequacy profile is approaching a transformative inflection point with its proposed public listing on the BSE and NSE. The draft red herring prospectus, filed on August 26, 2026, outlines an initial public offering comprising an ₹800 crore fresh issue alongside an offer for sale of up to 27,329,192 equity shares by promoter and private equity shareholders. The company has explicitly earmarked ₹385 crore—approximately 48% of the fresh issue—to repay or prepay outstanding borrowings, which had already fallen from ₹645.47 crore in FY24 to ₹447.30 crore in FY26. An additional ₹225 crore is designated for capital equipment across Hyderabad and Bengaluru biologics facilities, directly expanding drug substance and fill-finish capacities. This follows a $100 million minority equity infusion from Quadria Capital in January 2025 at an approximate valuation of USD 1.4 billion. From an underwriting standpoint, Aragen presents strong earnings growth, improving cash generation, and deliberate deleveraging; however, complete underwriting remains constrained by undisclosed customer concentration, facility-level margin differentials, and potential volatility in Western biotechnology funding."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI014"
