callouts:
  - calloutType: insight
    title: Geopolitical Supply Chain Reorganization as a Secular Tailwind
    body: Western pharmaceutical innovators are actively diversifying vendor concentration away from China. India's established 8% to 10% market share and deep chemical synthesis talent position integrated CRDMOs like Aragen to capture incremental discovery and CDMO programs as sponsors establish multi-country supply chain hedges.
    claimRefs:
      - CM001
      - CM002
      - CM003
  - calloutType: risk
    title: Capital Intensity and High-Containment Execution Hurdles
    body: Expanding into high-potency APIs and antibody-drug conjugate payloads requires substantial upfront capital expenditure, evidenced by Aragen's Rs 1,000 crore deployment through March 2026. Without audited site utilization and batch throughput data, capital efficiency and margin resilience across volatile biotech funding cycles remain unverified.
    claimRefs:
      - CM007
      - CM008
      - CM009
