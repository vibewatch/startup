callouts:
  - calloutType: risk
    title: High Capital Intensity and Debt Service Pre-IPO
    body: Aragen deployed over ₹1,000 crore in capital expenditure across fiscal 2024–2026 to expand small-molecule capacity to 364 KL and launch its OneHP platform. With an ₹800 crore fresh-issue IPO filed with SEBI primarily targeted at debt repayment, any delay in public listing or equity market volatility creates near-term refinancing friction and heightened interest burden.
    claimRefs:
      - CR001
      - CR002
      - CR004
  - calloutType: insight
    title: Operational Moat vs. Execution Hazards in Advanced High-Potency Payloads
    body: The commissioning of OneHP provides Aragen with rare containment capability down to 10 ng/m³ for cytotoxic payloads, positioning the company favorably for high-margin ADC programs. However, handling potent oncology APIs introduces stringent occupational safety and cross-contamination risks that demand flawless cGMP execution across commercial batches.
    claimRefs:
      - CR005
      - CR006
      - CR007
