company:
  name: "Aragen Life Sciences"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Aragen Life Sciences operates an integrated contract research, development, and manufacturing organization (CRDMO) network across six primary operating facilities in India and the United States. Its technical core spans small-molecule discovery chemistry, biologics development, GLP toxicology assessment, and 364 KL of small-molecule manufacturing capacity, recently augmented by the October 2026 commissioning of the Aragen OneHP platform in Hyderabad providing containment handling down to 10 ng/m³ for high-potency APIs and antibody-drug conjugate payloads."
sections:
  - id: "service-workflow-integration"
    title: "Service Definition & Biopharma Workflow Integration"
    body: "Aragen Life Sciences functions as an integrated technology-led CRDMO supporting global pharmaceutical, biotechnology, agrochemical, and animal health innovators across the complete discovery, development, and manufacturing continuum. The company structures its service delivery to bridge the traditional friction points between early molecular discovery and commercial chemical synthesis. By maintaining capabilities across both small molecules and large-molecule biologics, Aragen provides sponsors with unified project handoffs. Client engagements are coordinated through Aragen's proprietary XLRATE project management system, which standardizes milestone governance using electronic lab notebooks, dedicated project managers, and performance-aligned delivery incentives to maintain visibility and data integrity throughout iterative research campaigns."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
    figureRefs: []
  - id: "facility-infrastructure-high-potency"
    title: "Facility Infrastructure & High-Potency API Platform"
    body: "Aragen's physical operations are distributed across six primary sites, with five facilities situated in key Indian biopharma clusters and one specialized biologics R&D site located in Morgan Hill, California. In October 2026, the company operationalized Aragen OneHP at its Nacharam campus in Hyderabad, a dedicated 15,000-square-foot high-potency development and manufacturing platform. The facility features an initial commercial line engineered with a designed capacity of 500 to 600 kg of active pharmaceutical ingredient per year. Crucially, OneHP incorporates advanced isolation engineering capable of handling highly potent compounds at occupational exposure limits of up to 10 ng/m³, establishing the technical infrastructure required for cytotoxic oncology payloads, antibody-drug conjugates, and peptide-drug conjugates."
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE006"
      - "CE014"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "operating-architecture-scale"
    title: "Operating Architecture, Scientific Workforce & Manufacturing Scale"
    body: "The operating architecture supporting Aragen's service delivery combines substantial physical reactor volume with an extensive scientific workforce. As of March 31, 2026, Aragen operated 364 KL of installed small-molecule capacity across its Hyderabad and Visakhapatnam manufacturing campuses. This scale is underpinned by more than ₹1,000 crore in cumulative capital expenditure invested over the three fiscal years ending March 2026 to modernize production lines and expand discovery infrastructure. The organization employs over 4,300 professionals globally, including more than 450 PhD-level researchers who execute discovery chemistry, biology screening, and route design, supporting preclinical pipelines targeting critical oncology and kinase mechanisms."
    claimRefs:
      - "CE004"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs: []
  - id: "quality-governance-technical-risks"
    title: "Regulatory Governance, Quality Controls & Technical Risks"
    body: "Quality governance across Aragen's network is validated by routine inspections and accreditations from major international health authorities, including the USFDA, EDQM, PMDA, and CDSCO, alongside GLP and AAALAC certifications for its Pune toxicology facility. Despite these credentials, key technical and operational risks persist across the operating model. The newly commissioned Aragen OneHP platform currently relies on a single operational manufacturing line, introducing equipment decontamination downtime and batch concentration risks. Furthermore, independent visibility into site-level gross margins, batch cadences, and first-pass quality rates at the Bengaluru biologics facility remains constrained by private disclosure limitations."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE010"
      - "CE013"
      - "CE014"
    tableRefs: []
    figureRefs: []
