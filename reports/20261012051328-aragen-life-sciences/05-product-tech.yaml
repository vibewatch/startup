callouts:
  - calloutType: "insight"
    title: "Containment Engineering as a Strategic Differentiation Moat"
    body: "The launch of Aragen OneHP addresses a critical technical barrier in biopharma outsourcing by providing containment capabilities down to 10 ng/m³ OEL. This allows Aragen to capture lucrative high-potency API, ADC, and PDC programs that standard contract manufacturers cannot handle due to safety and cross-contamination constraints."
    claimRefs:
      - "CE005"
      - "CE006"
  - calloutType: "risk"
    title: "Single-Line Bottleneck in High-Potency Manufacturing"
    body: "While Aragen OneHP significantly broadens technical capabilities into cytotoxic and targeted oncology modalities, the current facility configuration operates only one manufacturing line designed for 500-600 kg/year. Any unplanned containment breach, equipment decontamination delay, or batch failure creates concentrated delivery risk for early commercial programs."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE014"
