company:
  name: Aragen Life Sciences
chapter:
  number: 1
  title: Company Overview
  summary: Aragen Life Sciences is a scaled Indian contract research, development, and manufacturing organization (CRDMO) providing end-to-end small molecule and biologics services across six global operating campuses. With FY26 operating revenue reaching ₹2,178 crore ($261M) and an established base of 591 active customers, the company is preparing for a public listing via an ₹800 crore fresh issue following a $1.4 billion private benchmark valuation established by Quadria Capital and secondary institutional investors.
sections:
  - id: corporate-identity-and-operating-model
    title: Corporate Identity and Global CRDMO Architecture
    body: |-
      Aragen Life Sciences Limited (formerly GVK BIO) is an India-headquartered contract research, development, and manufacturing organization (CRDMO) providing end-to-end scientific solutions to the global life sciences sector. Established in Hyderabad in April 2001, the company has transformed over two and a half decades from a specialized informatics venture into a fully integrated partner for global biopharma innovators across both small-molecule chemistry and large-molecule biologics workflows.

      The organization maintains primary executive, discovery, and manufacturing operations at its flagship Nacharam and Mallapur campuses in Hyderabad, complemented by active API synthesis and formulation facilities in Visakhapatnam, Bengaluru, and Pune, as well as an established biologics R&D center in Morgan Hill, California. Across this distributed footprint, Aragen operates 364.12 kiloliters of small-molecule reactor capacity alongside 25 kiloliters of single-use biologics bioreactor capacity. In Fiscal 2026, the company generated ₹2,178 crore in operating revenue and ₹593 crore in adjusted EBITDA, supporting 591 customer accounts that include 16 of the top 20 pharmaceutical multinationals worldwide.
    claimRefs:
      - CO001
      - CO002
      - CO009
      - CO010
      - CO012
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership and Board Governance Structure
    body: |-
      Aragen's governance structure combines original promoter stewardship with professional contract-services executive management. The company was co-promoted by G.V. Sanjay Reddy of the infrastructure-to-hospitality GVK Group conglomerate and Davinder Singh Brar, former Chief Executive Officer and Managing Director of Ranbaxy Laboratories. Brar joined the enterprise as Co-Promoter and Chairman in 2004, contributing deep pharmaceutical governance expertise and international commercial networks that helped redirect the company from informatics toward full-spectrum discovery chemistry and development.

      Day-to-day operational execution has been steered for nearly two decades by Director and Chief Executive Officer Manni Kantipudi, who joined as President in 2007 and orchestrated Aragen's institutionalization, US biologics acquisition, and corporate rebranding. Operating leadership is further decentralized across specialized divisional heads, including Aniel Khubchandani as Chief Executive Officer of Small Molecules-CDMO. This leadership core directs an aggregate workforce of 4,362 personnel as of March 2026, of which 3,412 are scientific specialists, including over 450 doctoral researchers, representing one of the largest technical talent concentrations in the Asian contract research ecosystem.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO010
    tableRefs:
      - TO002
  - id: capitalization-and-shareholding
    title: Capitalization History and Institutional Shareholding Structure
    body: |-
      Aragen's equity base has evolved through successive rounds of private equity sponsorship that funded continuous laboratory and manufacturing expansions. Following early institutional backing from Sequoia Capital in 2007 and ChrysCapital in 2016, Goldman Sachs entered in May 2021 by acquiring ChrysCapital's stake, establishing a cornerstone ~31.3% institutional holding alongside co-promoters Gunupati Aparna Reddy and Davinder Singh Brar, who each held approximately 33.7% equity.

      In January 2025, healthcare-focused private equity firm Quadria Capital invested $100 million for a minority equity holding, anchoring an enterprise valuation benchmark of approximately $1.4 billion (₹12,200 crore). This was followed in August 2025 by a ₹300 crore secondary transaction led jointly by Avendus Future Leaders Fund and SBI Life Insurance, which acquired an aggregate 2.5% stake from the promoter family. To establish permanent public capitalization and fund capital equipment purchases, Aragen submitted its Draft Red Herring Prospectus to SEBI in August 2026 for a public listing featuring an ₹800 crore fresh issue alongside an offer for sale of up to 2 crore equity shares. However, pending public listing completion, secondary trading remains illiquid and restricted to private secondary markets.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO011
      - CO014
    tableRefs:
      - TO003
  - id: evolutionary-milestones-and-capacity-expansion
    title: Evolutionary Milestones and Advanced Modal Capacity Expansion
    body: |-
      The commercial trajectory of Aragen reflects deliberate multi-year investments in regulatory compliance, geographical presence, and advanced modality capabilities. Crucial turning points include the 2014 cross-border acquisition of Aragen Bioscience in California, which provided entry into early-stage gene-to-GMP biologics, cell-line development, and US vivarium research, followed by the formal rebranding from GVK BIO to Aragen Life Sciences in 2021.

      Between 2023 and 2026, Aragen accelerated capital deployment, investing more than ₹1,000 crore across its Indian infrastructure. This included the construction and GMP commissioning of a greenfield biologics manufacturing center in Bengaluru with 25 kiloliters of single-use bioreactor capacity, as well as the October 2026 commercial opening of the Aragen OneHP platform at Nacharam. Operating a 15,000-square-foot facility capable of producing 500-600 kilograms annually under containment limits down to 10 ng/m³, OneHP positions the company to supply cytotoxic payloads for antibody-drug conjugates (ADCs) and highly potent oncology compounds.
    claimRefs:
      - CO001
      - CO002
      - CO012
      - CO013
    figureRefs:
      - FO001
