  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-inspection-history
      missingEvidence: Primary regulatory inspection records, complete text of historical US FDA Form 483 inspection observations (specifically the January 2026 inspection referenced in diligence notes), comprehensive CAPA remediation packages, and formal establishment inspection reports (EIR) verifying site compliance.
      whyItMatters: For a commercial CRDMO exporting active pharmaceutical ingredients and drug products to regulated US and European markets, undetected or unaddressed Form 483 inspection observations could lead to warning letters, import alerts, or production suspensions that impair revenue generation.
      diligencePath: Request unredacted FDA Form 483 observation notices, company responses, and formal FDA closeout or EIR documentation directly from Aragen during management due diligence, or submit Freedom of Information Act (FOIA) requests to the US FDA.
      relatedQuestionRefs:
        - QO009
    - type: private-evidence-only
      severity: material
      topic: stakeholder-or-investor-map
      missingEvidence: Complete cap table detailing shareholding percentages following the Quadria Capital $100M infusion and Avendus/SBI ₹300 crore secondary acquisition, as well as specific shareholder rights, liquidation preferences, and board seat allocations.
      whyItMatters: Institutional governance, drag-along/tag-along rights, and exit waterfall economics directly determine common shareholder value realization in the pending IPO.
      diligencePath: Review draft red herring prospectus annexures, definitive shareholder agreements, and corporate filings with the Ministry of Corporate Affairs (MCA) in India.
      relatedTableRefs:
        - TO003
