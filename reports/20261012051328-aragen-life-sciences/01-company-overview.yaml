    title: Pre-IPO Secondary Market Opacity and Private Liquidity Friction
    body: Prior to completion of its proposed SEBI initial public offering, Aragen's equity remains privately held with secondary market access confined to accredited investors, presenting illiquidity constraints and valuation uncertainty across macroeconomic cycles.
