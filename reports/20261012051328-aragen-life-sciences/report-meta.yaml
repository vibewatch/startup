companyProfile:
  summary: >-
    Aragen Life Sciences is a Hyderabad-headquartered CRDMO that serves global biopharma, biotech, agrochemical, and
    animal-health customers across discovery, development, biologics, and manufacturing workflows. The company operates
    across six global campuses, combines long-duration FTE discovery work with milestone and volume-based CDMO programs,
    and enters the public-market window with improving profitability, a broad customer base, and material unresolved
    diligence questions around concentration, compliance, and site-level economics.
  foundedDate: '2001-04-02'
  founders:
    - name: G. V. Sanjay Reddy
      role: Co-Founder and Promoter
      background: Founded GVK BIO in Hyderabad and anchored the original promoter group.
    - name: Davinder Singh Brar
      role: Co-Promoter and Chairman
      background: Former Ranbaxy CEO who brought pharma governance and operating credibility.
  foundingLocation: Hyderabad, Telangana, India
  headquarters: Hyderabad, Telangana, India
  productSummary: >-
    Discovery chemistry and biology, process development, biologics services, high-potency API manufacturing, and
    integrated CRDMO support for small-molecule and advanced-modality programs.
  customerFocus: Global innovator pharma, mid-stage biotech, agrochemical, and animal-health sponsors
  businessModel: FTE retainer, fee-for-service, milestone, and volume-based CRDMO contracts
  stage: Late-stage private CRDMO
  fundingStatus: >-
    Quadria Capital's $100 million minority investment set an approximate $1.4 billion benchmark valuation in January
    2025, followed by later secondary transactions and a public-listing process.
  disclosureProfile: private-disclosed
