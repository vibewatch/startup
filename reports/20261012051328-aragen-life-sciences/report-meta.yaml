  topStrengths:
    - Large and diversified customer base with repeat engagement depth across global biopharma accounts.
    - Improving profitability and cash generation alongside a clearly articulated IPO deleveraging plan.
    - Expanded multi-modality platform spanning discovery, small molecules, biologics, and high-potency capabilities.
  topRisks:
