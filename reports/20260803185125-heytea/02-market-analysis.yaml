- id: sizing-lenses
  title: Sizing lenses and why headline TAM overstates the investable market
  body: Public size estimates confirm that the overall market is large, but they also show why investors should be careful about jumping straight from TAM to implied revenue share. iiMedia put the 2023 new-style tea market at RMB 333.38 billion and projected about RMB 374.93 billion by 2025, while ECNS cited a CTMA outlook that the market would exceed RMB 370 billion in 2026. Those are useful top-down anchors. But the same evidence also broadens out into adjacent layers—health tea, sugar-free drinks, traditional retail tea, and RTD tea—that are commercially relevant without being a clean numerator for HeyTea. Daxue's broader tea-market analysis is especially useful here because it reminds us that tea demand in China is culturally deep and increasingly health-oriented, yet much of that demand is captured outside fresh-made chain stores. The right valuation lens is therefore evidence-constrained SAM, not one heroic market-size number.
