  evidenceGaps:
  - type: missing-source
    severity: material
    topic: heytea-sam
    missingEvidence: A public bottom-up SAM and city-level SOM bridge specific to HeyTea rather than the whole new-style tea category.
    whyItMatters: Headline category size does not tell investors how much profitable premium demand belongs to HeyTea.
    diligencePath: Request city-level store counts, average daily cups, AOV, and delivery mix for top cities plus lower-tier rollouts.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: market-sizing-cadence
    missingEvidence: Harmonized methodology across iiMedia, CTMA, and any company-linked market claims.
    whyItMatters: Comparable year-on-year market tracking is hard when different publishers mix category definitions and forecast horizons.
    diligencePath: Normalize each market figure to a consistent definition before using it in valuation models.
    relatedQuestionRefs:
    - QM003
    - QM005
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: discounted-economics
    missingEvidence: Delivery commission rates, city-level discounts, and same-store sales under recent price-war conditions.
    whyItMatters: The category can be large while premium operators still generate poor marginal returns.
    diligencePath: Request store-level cohorts, coupon mix, and net revenue per cup after platform fees.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM004
