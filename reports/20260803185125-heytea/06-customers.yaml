  title: Customers
  summary: HeyTea has clear evidence of demand, loyalty tooling, and cross-border relevance, but the public record still stops short of proving durable cohort economics or mature repeat behavior with high confidence.
sections:
- id: segment-and-positioning
  title: Segment and positioning
  body: 'HeyTea’s customer base appears to sit at the intersection of premium taste, urban lifestyle signaling, and novelty-seeking consumption. The brand promise is framed less like a basic refreshment utility and more like an aspirational beverage ritual: ingredients, packaging, queue-worthy launches, and culturally resonant presentation all shape the offer. Public reporting across China and overseas suggests that the company has repeatedly attracted customers willing to pay not only for tea but for the identity and freshness cues attached to it. That positioning helps explain why HeyTea could become a category-defining name even before it published much in the way of hard customer analytics. It also means customer diligence must distinguish carefully between brand heat and durable, repeat purchasing behavior. Public category reporting also helps here: premium tea has grown large enough that HeyTea does not need to appeal to everyone in order to matter. The more relevant question is whether
    it owns enough high-intent occasions among urban and aspirational consumers to stay differentiated as competitors proliferate.'
  claimRefs:
  - CU001
  - CU002
  - CU014
  - CU015
  - CU027
  - CU031
  - CU035
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: retention-habit-and-channel-behavior
  title: Retention, habit, and channel behavior
  body: 'The strongest evidence for real customer depth lies in the repeat-behavior scaffolding visible on the open web. The annual summary’s 150M-plus member base, the existence of a rewards program, the overseas app surface, and the company’s presence on delivery infrastructure all point to a business that is trying to convert spectacle into habit. Those are meaningful signals. But they are still only partial signals. Public sources do not reveal active-member ratios, frequency curves, or mature cohort retention. As a result, the customer story is positive but incomplete: enough to conclude that HeyTea has serious CRM ambition, not enough to conclude that the customer base behaves like a fully proven recurring-revenue engine. Another way to frame it is that the demand engine already has the visible ingredients of habit, but not yet the disclosed evidence of mature retention quality. That gap is important because premium beverage brands can look sticky in interfaces while still being promotion-sensitive
    in practice.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU018
  - CU021
  - CU022
  - CU029
  - CU030
