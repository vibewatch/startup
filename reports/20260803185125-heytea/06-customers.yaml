  - FU003
- id: overseas-reception-and-portability
  title: Overseas reception and portability
  body: 'Overseas evidence is one of the more encouraging parts of the customer picture. Nikkei, RADII, Grub Street, Tripadvisor, and the FoodTalks overseas update all show a brand that can attract attention beyond mainland China. The mechanisms vary by market: in some cases diaspora familiarity probably plays a large role; in others, novelty, premium authenticity, and social-media legibility seem to matter more. What is clear is that the company is not relying only on a one-city curiosity effect. Continued openings and reported flagship demand indicate at least some customer portability. What remains unresolved is how much of that demand matures into local, frequency-driven behavior once opening buzz fades. That is why overseas customer evidence should be read as a progression problem: awareness and trial appear solved in some markets, while habit and local mainstream penetration remain the real tests.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU011
  - CU012
  - CU013
  - CU020
  - CU023
  - CU024
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: fragility-gaps-and-diligence-priorities
  title: Fragility, gaps, and diligence priorities
  body: 'The core risk is that public enthusiasm is easier to observe than stable cohort economics. Queue stories, opening-day sales, premium positioning, and collaboration-driven attention all support a compelling top-of-funnel narrative. They do not automatically prove long-lived retention or broad-based affordability. Customer diligence therefore needs to press beyond total membership and social buzz into active cohorts, channel mix, order frequency, down-trading behavior, and performance by market. Open-web customer-proof surfaces are useful because they show live interaction contexts, but they cannot settle the biggest underwriting questions. The correct customer conclusion is supportive but cautious: demand quality looks promising, yet still materially under-disclosed. Investors should therefore ask for proof that the customer story remains healthy even after novelty decays, competitor promotions intensify, and the company leans harder on convenience channels. Without that, customer
    quality remains promising but still partly inferential. The ambiguity persists.'
  claimRefs:
  - CU016
  - CU017
  - CU019
  - CU021
  - CU024
