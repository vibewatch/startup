  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer-cohorts
    missingEvidence: Active members, order frequency, retention curves, and channel mix by market are not public.
    whyItMatters: These are the core metrics needed to decide whether the customer base is truly habitual and durable.
    diligencePath: Request cohort dashboards, MAU/WAU, frequency buckets, and repeat rates by channel and geography.
    relatedQuestionRefs:
    - QU003
    - QU021
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: overseas-customer-mix
    missingEvidence: No public split between diaspora, tourists, and local mainstream users across overseas markets.
    whyItMatters: Portability quality depends on whether demand broadens beyond culturally pre-informed consumers.
    diligencePath: Request survey data and cohort mix for overseas markets, especially U.S., Singapore, and UK.
    relatedQuestionRefs:
    - QU005
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
  - type: access-blocked
    severity: minor
    topic: supplemental-customer-reporting
    missingEvidence: QSR, Restaurant Business, Longbridge, and some FoodTalks subpages were inaccessible during fetch.
    whyItMatters: They likely would not overturn the thesis, but could have supplied extra customer-color detail.
    diligencePath: Retry blocked trade-media pages or archived copies if market-entry customer context becomes important.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
    - TU001
