  title: Valuation
  summary: HeyTea likely deserves a meaningful private-market valuation corridor above its stale 2020 mark, but public evidence is still too noisy and under-disclosed to support a precise fair-value claim without a material opacity discount.
sections:
- id: valuation-anchors-and-data-quality
  title: Valuation anchors and data quality
  body: 'HeyTea’s valuation chapter begins with an uncomfortable reality: public data proves that the business is important, but not exactly what it is worth. The best hard anchor in the public record is historical—TechNode’s 2020 report that the financing valued the company above RMB 16 billion. Since then, PitchBook, Tracxn, Dealroom, Hurun, WOWLS, and AskCyborg have all kept the company in the broad zone of scaled, capital-backed beverage champions. But they do not offer the kind of convergent precision that would justify a point estimate. That is not unusual for a private consumer company; it is simply the central constraint. The first task, therefore, is not to pick a favorite number but to decide which anchors are robust enough to keep and which are only useful as outer-boundary markers. A disciplined reader should therefore separate valuation evidence into three buckets: hard anchors that are old but real, softer databases that are current but noisy, and peer disclosures that are
    robust but imperfectly comparable.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV028
  - CV029
  - CV037
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: peer-set-and-valuation-method
  title: Peer set and valuation method
  body: 'The most defensible open-web methodology is a scenario-based peer-comparison framework rather than a pure DCF. Current filings and IR pages from Luckin, Chagee, Nayuki, and Mixue provide much better context for market appetite and disclosure standards than old one-off articles alone. Each comp has limits: Luckin is broader and more digitally optimized; Chagee is a closer premium tea analogue; Nayuki shows what listed tea disclosure looks like under market scrutiny; Mixue offers the opposite end of the price-value spectrum. None is perfect. Together, however, they define a useful valuation corridor. That corridor should be interpreted through revenue-quality, growth durability, and disclosure quality—not by mechanically applying one public multiple from one supposedly identical peer. The valuation method is therefore less about mathematical elegance and more about honest weighting: which pieces of evidence deserve to pull the range materially, and which only deserve to influence
    the tails.'
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV010
