  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: Current board roster, committee structure, and named executive responsibilities beyond the founder profile.
    whyItMatters: Governance depth and succession planning matter for a private chain balancing rapid rollout with consistency risk.
    diligencePath: Request the current org chart, board list, and any overseas subsidiary governance pack from management.
    relatedQuestionRefs:
