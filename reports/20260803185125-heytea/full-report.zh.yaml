      - number: '8.3'
        title: 牛熊情景与区间逻辑
        blocks:
          - type: paragraph
            body: >-
              牛市情景不难表述。FoodTalks、Dao Insights
              和历史估值报道都支持一条叙事：品牌资产强、产品速度快、会员规模大、门店触达扩张，国际化可选性也在增加。如果同店需求证明有韧性，上新持续有效，海外市场成熟且不过度消耗资本，HeyTea
              完全可能配得上私募市场溢价叙事。熊市情景同样清楚：公开证据仍没有展示成熟门店现金生成、持续利润率质量，或投资人应为不透明性施加的精确折扣。这就是为什么估值区间比单一目标更诚实。正确问题是，在尊重执行和披露不确定性的前提下，这家公司应比陈旧的
              2020 年锚点高出多少。偏好区间还有另一个原因：同样的公开增长证据可以支持非常不同的价值，取决于利润率和回本最终更像软件、更像零售商，还是介于两者之间。
