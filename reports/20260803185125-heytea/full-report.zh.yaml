      - number: '7.2'
        title: 定价、竞争与形态风险
        blocks:
          - type: paragraph
            body: >-
              第二个主要风险簇是竞争和经济性。多个来源把这个品类描述为茶饮大战，压力来自低线扩张、模仿以及消费者价值敏感度变化。对 HeyTea
              来说，危险不只是竞争对手存在；真正危险在于，高端品牌可能被迫在流量和利润率之间做出伤害一方的选择。快速店型实验、联名和爆款产品周期能让品牌保持新鲜，但如果公司必须不断制造新意来守住注意力，也会带来复杂度和疲劳。低线城市扩张和加盟延伸了触达，却也可能稀释最初让品牌独特的高端线索。这些风险可管理，但它们是战略性的，不是表层问题。当管理层想用另一个店型、促销或联名来回应每一次竞争挑战，而不是用有纪律的经济性来回应时，这个风险簇最关键。
