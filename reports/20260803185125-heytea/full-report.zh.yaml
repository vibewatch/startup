      - number: '6.3'
        title: 海外接受度与可迁移性
        blocks:
          - type: paragraph
            body: >-
              海外证据是客户图景中更鼓舞人的部分之一。Nikkei、RADII、Grub Street、Tripadvisor 和 FoodTalks 的海外更新都显示，HeyTea
              能在中国内地之外吸引注意。不同市场的机制并不相同：有些市场里，侨民熟悉度可能发挥很大作用；另一些市场里，新鲜感、高端真实性和社交媒体可读性似乎更重要。清楚的是，公司并不只依赖某一个城市的猎奇效应。持续开店和据报导的旗舰店需求，说明客户需求至少有一定可迁移性。仍未解决的问题是，开业热度消退后，这些需求有多少会成熟为本地、由频次驱动的行为。因此，海外客户证据应被看作一个进阶问题：在部分市场，认知和试用似乎已经解决；习惯养成和本地主流渗透仍是真正考验。
