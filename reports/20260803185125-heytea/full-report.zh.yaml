      - number: '4.4'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              因此，承销结论应保持谨慎。TechNode 的 2020 年估值标记和当前数据库区间证明，投资人曾多次赋予 HeyTea
              显著企业价值。但缺少经审计报表、清晰收入确认细节、现金余额和门店层面单位经济性，留下了重大缺口。Luckin、Nayuki 和 Chagee 的同业文件之所以有用，恰恰因为它们显示出 HeyTea
              没有披露多少内容。因此，开放网络证据足以得出一个结论：HeyTea
              是一家有规模、资金充足的饮品运营商，需求真实，基础设施需求也不小。但这些证据不足以高确信判断，当前私募估值究竟嵌入了多少自由现金流潜力或下行保护。换句话说，争论不再是 HeyTea
              是否重要，而是私有数据包能否证明规模会转化为可防守的经济性。
