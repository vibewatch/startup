  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 食品安全与声誉风险
        blocks:
          - type: paragraph
            body: >-
              公开记录中最具体的历史风险是运营卫生。Xinhua 和 Hexun
              的存档报道显示，卫生问题曾经显眼到足以威胁品牌的高端承诺。这段历史不能证明当前控制薄弱，但能证明下行模式真实存在：一家高端饮品连锁在清洁或执行上失手时，损失的不只是几笔交易——它可能动摇客户最初愿意支付的信任溢价。HeyTea
              如今规模更大，国际可见度更高，未来任何质量事件传播距离和速度都可能超过旧报道中的事件。对一家品牌与新鲜感和生活方式信号紧密绑定的公司而言，这种不对称性让运营纪律成为一阶风险变量，而不是后台细节。尽调含义很直接：事件预防和响应能力应获得与增长指标同等的关注，因为品牌失去可信度的速度可能快过重建可信度的速度。
