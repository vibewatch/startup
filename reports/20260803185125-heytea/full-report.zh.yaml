      - number: '6.4'
        title: 脆弱性、缺口与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              核心风险在于，公开热度比稳定同期群经济性更容易被观察到。排队故事、开业首日销售、高端定位和联名带来的注意力，都支撑了一个有吸引力的漏斗顶部叙事。但它们不会自动证明长期留存或广泛可负担性。因此，客户尽调需要越过总会员数和社交声量，追问活跃同期群、渠道组合、下单频次、消费降级行为以及分市场表现。开放网络上的客户证明界面有用，因为它们展示了实时互动场景，但无法解决最大的承销问题。正确的客户结论应是支持但谨慎：需求质量看起来有希望，但披露仍明显不足。因此，投资人应要求管理层证明，在新鲜感衰减、竞争对手促销加剧、公司更依赖便利渠道之后，客户故事仍然健康。没有这些证据，客户质量仍然有吸引力，但部分依赖推断。模糊性依然存在。
