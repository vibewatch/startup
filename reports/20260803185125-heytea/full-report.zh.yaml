      - number: '7.4'
        title: 风险排序与尽调重点
        blocks:
          - type: paragraph
            body: >-
              正确的投资人结论不是恐慌，而是排序。短期急性风险看起来包括价格压力、大型且部分加盟网络中的执行漂移，以及无法从公开记录检验单位经济性。更长期担忧包括品类商品化、品牌疲劳、合规复杂度，以及私营公司不透明持续时间超过投资人预期。部分公开证据显示公司有韧性：旧卫生问题后，公司仍保持增长，并能在海外本地化。但没有透明度的韧性，并不等于低风险。因此，下一阶段尽调应迫使管理层量化真实脆弱性究竟在哪里——QA、同期群、成熟门店经济性、伙伴控制，还是现金生成——然后再相信上行叙事。实践中，最有用的尽调结果是一张排序图：哪些风险管理层已经严密度量，哪些仍只靠滞后症状监测。
