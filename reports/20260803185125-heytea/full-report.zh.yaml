      - number: '8.4'
        title: 承销结论
        blocks:
          - type: paragraph
            body: >-
              最终估值观点应是建设性但有纪律的。公开来源支持这样一个判断：HeyTea
              是一家有规模、高端、由机构支持的饮品平台，具备真实战略相关性。但公开来源不支持假装公司已经拥有上市公司式确定性。因此，承销立场应能接受相对旧历史的健康溢价，同时仍坚持为不透明利润率、隐藏资本强度和执行风险给出实质折扣。实际操作上，下一步最重要的尽调不是再做一次桌面同业比较，而是拿到经审计财务包和成熟门店运营数据；这些数据会决定市场应主要把
              HeyTea 看作高端复利平台、时髦但经济性嘈杂的运营商，还是介于两者之间。如果管理层能补上最大证据缺口，估值争论可能迅速收敛；如果不能，不确定性本身就是价格的一部分。
