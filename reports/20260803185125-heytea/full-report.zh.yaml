      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人 Nie Yunchen 是这家公司公开记录中最清晰的关键人物。SCMP 和 TechNode 都把他描绘为一位年轻创始人：他并未把 HeyTea
              当作传统饮品档口，而是按互联网时代消费品牌来做，把产品新意、门店设计和数字化排队管理揉在一起。相比创始人叙事，公开治理细节明显更薄。HeyTea 的运营实体通常被识别为 Shenzhen Meixixi
              Catering Management，Mondaq 的知识产权法摘要也确认该实体拥有 HEYTEA
              商标。不过，公司官网并未披露董事会、委员会结构或完整高管名单。这个不透明度值得重视，因为一家达到这种规模的连锁企业，通常应围绕控制权、继任和运营责任给出更正式披露。因此，公开记录支持的结论是：HeyTea
              是一家创始人主导、品牌领导力可见的企业，但治理透明度并不完整；这应作为尽调缺口保留，而不是被轻描淡写。
