      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求背景有利，但约束并不轻。健康趋势、减糖和社交媒体驱动的发现都在推动品类增长。但同一份 iiMedia
              研究也指出，食品安全是消费者最希望改善的单一领域，这意味着运营错误摧毁需求的速度，可能快过精明营销重建需求的速度。Yicai 的小城市报道和 China Speakers Bureau
              关于茶饮大战的评论，展示了规模的另一面：一线市场饱和后，品牌会下沉、降价或推出更低价副品牌，但这些动作可能侵蚀高端身份。品类规模是真实的；品类内部收入质量则没那么清楚。这是 HeyTea
              的核心市场结论：中国新式茶饮足够大，能容纳大型赢家；但只有那些在管住安全、供应和折扣压力的同时守住差异化的品牌，才配得上高端估值待遇。
