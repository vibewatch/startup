  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              HeyTea
              的公开财务故事信号很强，经审计细节很弱。公司显然不只靠单杯茶订单变现：模型延伸到爆款饮品、季节性上新、食品或烘焙相邻品类、被会员体系打包的忠诚需求，以及——从网络披露看——更广的加盟和供应链生态。但公司从未公开给出清晰的收入结构、毛利率或贡献利润拆分。最佳证据来自间接指标，例如爆款产品杯量、会员增长和门店扩张。这让第一个财务问题更偏定性，而非纯定量：这是一家需求充沛且经济性被隐藏的品牌，还是一家资本密集、估值已经跑在可证明现金生成前面的品牌？公开证据足以支持前一种可能、值得继续看；但还不足以带着确信承销其经济性。实践中，缺少经审计分部数据意味着，最强的公开论点在于变现广度，而不是每根杠杆贡献了多少销售或利润。
