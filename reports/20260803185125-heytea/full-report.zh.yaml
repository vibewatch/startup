      - number: '3.3'
        title: 能力、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              主要竞争比较不应抽象地看产品宽度，而要看每个同业单位资本能把什么做得更好。Mixue 赢在可负担性和加盟触达。Luckin 赢在便利、移动端频次和运营自动化。Chagee
              赢在有公开市场动能支撑的高端茶叙事。Nayuki 对分析师的主要价值是披露，而不是已证明的更优经济性。HeyTea
              过去赢在设计、产品节奏和更具向往感的茶饮体验。这些优势真实存在，但比软件或医药护城河更软，因为饮品形态传播很快。如果 HeyTea 让折扣或过度扩张侵蚀高端感，差异化会迅速压缩。这也是切换成本分析对 HeyTea
              如此苛刻的原因：便利性、数字频次和低价备选项都会缩短任何单一产品优势的持续时间。
