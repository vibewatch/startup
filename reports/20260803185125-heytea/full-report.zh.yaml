      - number: '2.3'
        title: 购买者、用户、付款人与渠道逻辑
        blocks:
          - type: paragraph
            body: >-
              这个市场里的购买者、用户和付款人并不单一。iiMedia 的调研证据显示，茶饮消费偏女性，25 至 45
              岁人群占比较高，并集中在中等收入消费者；他们愿意为便利、口味和健康定位付费，但仍然价格敏感。发现路径已经数字化：内容分享平台和本地生活平台是主要需求塑形者，便利店、电商和 App
              生态也会影响茶饮品牌如何把好奇心转成复购。这也是同业运营模型相关的原因。Luckin 的投资者材料显示，中国饮品市场已经接受移动优先点单和无收银取餐；Chagee 则把高端茶塑造成现代品牌化生活方式体验。对
              HeyTea 而言，关键含义是品牌发现、App
              便利性以及门店或外卖触达都属于市场定义的一部分。单纯饮品口味已无法解释胜负；渠道所有权越来越决定每个宣传市场增长数字背后的利润率。同样的渠道复杂性也意味着，不能只从标题市场规模推断高端份额。
