chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              HeyTea 是一家中国私营新式茶饮连锁品牌，2012 年创立于江门，目前总部位于深圳。多份公开资料对其核心身份判断一致：品牌最初名为 Royal
              Tea，因商标问题更名，并围绕高端茶、水果茶和芝士奶盖形态建立品牌，后者也让这条连锁成为社交媒体现象。公司从广东创业品牌扩张为全国性、再到国际化运营商，公开品牌叙事始终相对稳定。相比大众市场奶茶连锁，HeyTea
              把价格带放得更高，重点押注门店审美、快速菜单更新和数字化点单，而不是只靠低价铺量。SCMP 和 TechNode 都把 HeyTea
              描述为一家试图让茶文化显得现代、设计感强且互联网原生的运营商。承销这家公司时，这一定位仍是核心，因为客户愿意接受溢价和长队，主要靠品牌力，而不是类似专利的技术。
