      - number: '2.2'
        title: 市场规模视角，以及标题式 TAM 为何高估可投资市场
        blocks:
          - type: paragraph
            body: >-
              公开规模估算确认整体市场很大，也提醒投资人不能从 TAM 直接跳到隐含收入份额。iiMedia 将 2023 年新式茶饮市场规模估为 RMB 333.38B，并预测 2025 年约为 RMB
              374.93B；ECNS 则引用 CTMA 展望称，2026 年市场将超过 RMB
              370B。这些都是有用的自上而下锚点。但同一组证据也延伸到相邻层次——健康茶、无糖饮料、传统零售茶和即饮茶——它们商业上相关，却不能干净地作为 HeyTea 的分子。Daxue
              对更广茶市场的分析在这里尤其有用，因为它提醒我们，中国茶需求有很深的文化根基，也越来越偏健康，但相当一部分需求被现制连锁门店之外的渠道承接。因此，正确估值镜头应是受证据约束的
              SAM，而不是一个激进的市场规模数字。
