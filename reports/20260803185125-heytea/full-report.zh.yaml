      - number: '3.2'
        title: 同业画像与价格架构
        blocks:
          - type: paragraph
            body: >-
              公开可得的同业披露展示了三套清晰战略打法。Mixue 是规模和加盟模型：极低价格、庞大门店数和供应链杠杆。Luckin 是数字便利模型：移动优先、取餐优先，运营数据密度高。Chagee
              是近期公开市场验证最清晰的高端茶模型。Nayuki 是历史上最可比的上市茶饮同业，但它主要说明，要让高端茶饮经济性强到足以打动公开市场投资人并不容易。HeyTea 位于这些极点之间。它没有 Mixue
              的极低价格，没有 Luckin 的纯咖啡焦点，也没有 Chagee
              新鲜的上市公司数据集，但保留了品类中最强的消费品牌之一。这里看上市同业，并不是因为它们完美可比，而是因为它们揭示了公开市场投资人真正会奖励哪些价格、形态和披露组合。
