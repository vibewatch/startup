      - number: '7.3'
        title: 治理、披露与法律风险
        blocks:
          - type: paragraph
            body: >-
              第三个风险簇是不透明。HeyTea
              的规模已经大到足够重要，但私营属性仍让它可以不披露许多帮助投资人正确定价下行的数字。上市饮品公司的同业文件让这种反差非常明显：公开公司被期待披露更多单位经济性、治理、合规、诉讼敞口和资产负债表韧性，而
              HeyTea 目前披露得少得多。缺少披露不是丑闻，但确实是真实的风险放大器，因为它遮住了其他问题在压力下可能恶化到什么程度。与此同时，法律和知识产权风险并非想象。Mondaq
              对商标纠纷的报道显示，对于一个推广了品类审美的品牌，打击仿冒是运营现实的一部分。公司向国际扩张后，司法辖区复杂度只会提高。投资人不应把这看成法律脚注，而应视为结构性不确定性溢价，并把它计入其他每一项假设。
