            body: >-
              公开牵引力数据很亮眼，虽然并不完整。FoodTalks 对 2024 年年报的摘要显示，会员超过 150M，下半年门店表现强于季节性，爆款 SKU 卖出数千万杯。海外报告还补充了具体销量例子：Times
              Square 开业首日 3,500 杯，日均超过 2,000
              杯，后续门店销售仍有韧性。这些都是有意义的生产率线索。与此同时，它们不能替代标准财务包。没有任何公开来源给出同店销售、单店标准化人工成本、外卖占比、损耗，或按产品家族划分的毛利率。因此，投资人必须把吞吐量数据视为需求证明，而不是利润证明。这个区分很重要，因为私营消费公司常会宣传最好的吞吐量数据，却省略决定真实现金生成的同期群层面经济性。
