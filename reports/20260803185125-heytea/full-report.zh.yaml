      - number: '8.2'
        title: 同业集合与估值方法
        blocks:
          - type: paragraph
            body: >-
              最可防守的开放网络方法，是基于情景的同业比较框架，而不是纯 DCF。Luckin、Chagee、Nayuki 和 Mixue 当前文件与 IR
              页面，比旧的一次性文章更能说明市场胃口和披露标准。每个可比公司都有局限：Luckin 更宽、更数字优化；Chagee 更接近高端茶饮类比；Nayuki 展示了茶饮上市后在市场审视下的披露长相；Mixue
              则提供价格价值光谱的另一端。没有一个完美。但合在一起，它们定义了一条有用的估值走廊。这条走廊应通过收入质量、增长耐久度和披露质量来解释，而不是机械套用某个看似完全相同同业的一项公开倍数。因此，估值方法的核心不是数学优雅，而是诚实加权：哪些证据应该实质拉动区间，哪些只应该影响尾部。
