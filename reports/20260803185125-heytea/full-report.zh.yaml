  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与数据质量
        blocks:
          - type: paragraph
            body: >-
              HeyTea 的估值章节从一个不舒服的现实开始：公开数据证明这家公司重要，但不能精确证明它值多少钱。公开记录中最好的硬锚点是历史性的——TechNode 2020 年报道该轮融资将公司估值推至 RMB 16B
              以上。此后，PitchBook、Tracxn、Dealroom、Hurun、WOWLS 和 AskCyborg
              都继续把公司放在有规模、资本支持的饮品冠军这一宽泛区间内。但它们没有给出足以支撑点估值的收敛精度。对私营消费公司来说，这并不罕见；它只是核心约束。因此，第一项任务不是挑一个偏爱的数字，而是判断哪些锚点足够稳健、值得保留，哪些只适合作为外边界标记。有纪律的读者应把估值证据分成三桶：陈旧但真实的硬锚点；较新但嘈杂的软数据库；以及扎实但不完全可比的同业披露。
