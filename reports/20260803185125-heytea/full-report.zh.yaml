  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与应计入口径
        blocks:
          - type: paragraph
            body: >-
              HeyTea 的相关市场比全部茶、全部饮料或中国餐饮都要窄。公司变现的是高端现制茶饮场景：水果茶、芝士茶、季节性健康 SKU，以及由 App
              驱动的提前点单或外卖任务；这些场景与高端奶茶、入门高端咖啡和社交型轻饮争夺同一个钱包。因此，正确边界应从中国新式茶饮市场内部划起，而不是从更宽的茶经济出发。只看农业茶产量或瓶装茶总消费会夸大机会；只看高端旗舰同业门店数又会低估需求池，因为同一批用户也会通过本地生活
              App、商场到店和零食驱动的冲动消费购买。TechNode、SCMP 和 Vice 的公开评论说明了这一边界为什么重要：HeyTea
              过去赢在让茶比商品化奶茶更高端、更适合拍照，也更带生活方式属性。换句话说，这个品类既关乎形态、品牌和渠道，也关乎杯子里的液体本身。
