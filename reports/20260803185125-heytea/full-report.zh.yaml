      - number: '1.4'
        title: 规模、里程碑与负面背景
        blocks:
          - type: paragraph
            body: >-
              规模和里程碑证据比正式财务披露更扎实。公司在 2024 年年报中披露，会员数已超过 150M，全年增加 50M+，且多条新品线卖出爆款杯量。FoodTalks 的海外更新随后显示国际扩张明显提速：截至 2025
              年 8 月，海外门店超过 100 家，美国超过 30 家，版图覆盖 8 个国家、28 个海外城市。其他公开来源让图景更复杂。Dao Insights 写道，2023 年底门店总数为 3,200 家，其中约
              2,300 家为加盟店；品牌后来又对外宣称全球 4,000 家门店。China Speakers Bureau 也引用了 4,000+
              这一数字，同时警告价格战、质量漂移和过度饱和正在稀释高端叙事。合在一起看，公开记录显示，HeyTea 兼具巨大会员增长和海外动能，但其结构性执行风险也高于精致品牌形象所暗示的水平。
