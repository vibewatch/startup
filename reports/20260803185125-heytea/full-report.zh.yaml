      - number: '4.3'
        title: 成本结构、资本强度与加盟
        blocks:
          - type: paragraph
            body: >-
              成本结构和资本强度，是公开来源中最难看清的模型部分。高端茶饮连锁明显暴露在水果、乳制品、茶原料、包装和外卖佣金等变动成本下，也承担租金、人员和质量控制等固定成本。HeyTea
              自己的海外更新让资本图景显得比纯轻资产叙事更重：仓储中心、本地采购计划、专门团队和逐市场铺开，都意味着公司需要的基础设施，比一个社交媒体品牌初看上去更多。加盟有助于资本效率，因为加盟商会为许多门店出资；但它也把控制难题前移到供应标准和
              QA。这个取舍解释了为什么价格战压力如此关键：更低的实现价格可能在私营公司不得不披露之前，就压缩了经济性。更复杂的是，高端饮品运营商可以在门店层面看起来很高效，同时仍在
              QA、产品开发和国际化脚手架上消耗大量总部支出。因此，本章把资本效率和经营杠杆视为相关但不相同。
