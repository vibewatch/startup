        - 加盟审计与流失数据
      - - 海外仓与团队
        - FoodTalks 海外报告
        - QA / 合规出错节点更多
        - 逐国运营复盘
      - - 新品依赖
        - FoodTalks 英雄 SKU 数据
        - 需要持续的创新纪律
        - NPD 节奏与复盘
    notes: 品牌、扩张和运营复杂度一起抬升，执行风险也会抬升。
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR014
      - CR015
      - CR020
      - CR029
  - id: TR004
    title: 监管 / 法律风险清单
    columns:
      - 风险
      - 证据
      - 为什么重要
      - 未解问题
    rows:
      - - 私营公司不透明
        - 官网 / 主页与同业披露文件形成反差
        - 更难给下行风险定价
        - 需要审计财报和成熟门店经济性
      - - 法律 / IP 纠纷
        - Mondaq 案例
        - 品牌必须守住品类领导地位
        - 维权频率和成本不明
      - - 多司法辖区合规
        - 海外建设
        - 法律与运营义务更多
        - 未披露公开合规记录
      - - 基准数据缺口
        - 部分同业申报页面无法访问
        - 公开对标并不完美
        - 需要管理层直接提供材料包
      - - 私营公司治理不透明
        - Tianyancha 信息与审计披露缺失
        - 让其他风险更难定价
        - 需要董事会、控制权和报告材料包
    notes: 不透明不是独立风险；它会放大其他风险。
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR021
      - CR026
      - CR033
      - CR034
      - CR041
    enumerationScope:
      coverage: sample
      basis: >-
        This register samples the core regulatory, legal, and disclosure risks evidenced in public sources; it is not an
        exhaustive legal diligence inventory.
  - id: TR005
    title: 风险优先级表
    columns:
      - 时间跨度
      - 最突出的风险
      - 什么能降低风险
      - 什么会加剧风险
    rows:
      - - 0-24 个月
        - 价格压力、执行漂移、单店经济性不透明
        - 同期群数据、单店经济性、QA KPI
        - 促销升级或质量事件
      - - 2-5 年
        - 品类商品化、品牌疲劳、合规复杂度
        - 持续创新与市场级盈利能力
        - 本地化失败或造血能力弱
    notes: 最大的实际问题是哪些风险已经迫在眉睫，哪些只是需要监控。
    claimRefs:
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 公开估值锚点表
    columns:
      - 锚点
      - 来源
      - 说明
      - 估值用途
    rows:
      - - 2020 年融资估值
        - TechNode
        - 2020 年估值 > RMB 16B
        - 历史底线 / 参考点
      - - 数据库档案
        - PitchBook、Tracxn、Dealroom、Hurun
        - 已具规模、VC 支持的私营公司
        - 仅作方向性交叉验证
      - - 轻量估算页面
        - AskCyborg、WOWLS、CompWorth
        - 收入 / 估值软估算
        - 边界标记，不是核心锚点
      - - 资本历史页面
        - Tracxn 融资与投资人
        - 融资时间线与投资人
        - 帮助理解投资人支持
    notes: 本表把耐用锚点和噪声较大的估算界面分开。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV028
      - CV029
  - id: TV002
    title: 可比估值表
    columns:
      - 可比公司
      - 为什么重要
      - 为什么不完美
      - 区间测算用途
    rows:
      - - Luckin
        - 有披露、已具规模的中国饮品运营商
        - 模式和渠道组合更宽
        - 披露执行力的上沿基准
      - - Chagee
        - 更接近的高端茶饮类比
        - 成熟度和市场组合仍不完全相同
        - 最相关的高端茶饮上市可比
      - - Nayuki
        - 有港股披露的上市高端茶饮连锁
        - 市场历史反映情绪分化
        - 有用披露与茶饮连锁参照
      - - Mixue
        - 大众规模价值端
        - 价格架构差异很大
        - 帮助框定高端与平价定位
    notes: 没有单个可比公司足够好；这组可比比任何一个单点更重要。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV027
      - CV031
    enumerationScope:
      coverage: sample
      basis: >-
        Samples the public comparable set used in this chapter: Luckin, Chagee, Nayuki, and Mixue represent the most
        decision-relevant disclosed beverage reference points, not an exhaustive beverage universe.
  - id: TV003
    title: 估值方法表
    columns:
      - 方法
      - 为什么可用
      - 为什么受限
      - 最需要的输入
    rows:
      - - 收入倍数交叉验证
        - 同业提供公开市场披露语境
        - 利润率质量缺口大
        - 经审计收入与毛利率
      - - 情景区间
        - 能处理不透明和执行不确定性
        - 不如单点模型精确
        - 成熟门店经济性与现金流
      - - 私募市场锚点交叉验证
        - 有历史融资估值标记
        - 估值标记老化很快，可能已经失效
        - 最新融资和股权结构证据
      - - 纯 DCF
        - 概念上有吸引力
        - 仅靠当前公开信息无法站住脚
        - 完整经审计财务资料
    notes: 本章有意选择诚实呈现不确定性，而不是给出虚假精确。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV016
      - CV023
      - CV026
      - CV032
  - id: TV004
    title: 多空驱动因素表
    columns:
      - 驱动因素
      - 多头解读
      - 空头解读
      - 重要性
    rows:
      - - 品牌和上新引擎
        - 高端定价和持续上新支撑上行空间
        - 新鲜感消退，或被对手复制
        - 决定收入质量
      - - 门店和会员规模
        - 大网络和 CRM 基础意味着需求纵深
        - 流量不能证明盈利能力
        - 规模可能掩盖疲弱经济性
      - - 海外增长
        - 增加可选性和新 TAM
        - 可能消耗资本和管理层精力
        - 改写终局叙事
      - - 披露质量
        - 尽调或未来上市准备可能改善披露
        - 也可能长期保持不透明
        - 改变折现率 / 区间宽度
    notes: 估值区间应更多随经济性证据而动，而不是随头条热度起落。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV025
      - CV033
  - id: TV005
    title: 估值尽调优先级表
    columns:
      - 需求
      - 为何能收窄估值
      - 当前代理指标
      - 需要取得的材料
    rows:
      - - 经审计收入 / EBITDA
        - 压缩收入规模和质量的不确定性
        - 数据库和媒体代理指标
        - 最新经审计财务报表
      - - 毛利率和成熟门店回本
        - 决定溢价能撑多久
        - 只有流量片段
        - 门店分组分析
      - - 现金 / 资本开支 / 资金续航
        - 决定下行保护
        - 私营公司不透明
        - 资产负债表和预算
      - - 分市场海外 P&L
        - 检验期权价值是否真实
        - 门店数和旗舰店片段
        - 按市场拆分的经营报表
    notes: 提升估值精度的最佳方式，是用经审计的单店经济模型替代代理指标。
    claimRefs:
      - CV013
      - CV020
      - CV021
      - CV025
      - CV026
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 估值区间扩大的触发表
    columns:
      - 触发因素
      - 正向情形
      - 负向情形
      - 对区间的影响
    rows:
      - - 经审计利润率
        - 高端叙事更可信
        - 毛利弱于预期
        - 向上收窄，或向下扩大
      - - 成熟门店回本
        - 支持资本效率溢价
        - 显示建店成本回收缓慢
        - 实质改变所需折现
      - - 海外市场 P&L
        - 确认可选性真实存在
        - 显示有流量但不产现金
        - 改变战略溢价
      - - 治理 / 披露资料包
        - 提升信任度和可比性
        - 主要不透明问题仍在
        - 改变信心，多过改变表面估值
    notes: 桌面研究之后，这些尽调事件最可能实质性推动估值。
    claimRefs:
      - CV026
      - CV032
      - CV034
      - CV040
