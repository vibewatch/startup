      - number: '6.2'
        title: 留存、习惯与渠道行为
        blocks:
          - type: paragraph
            body: >-
              真实客户深度最强的证据，在于开放网络上可见的复购行为脚手架。年报摘要中的 150M+ 会员基础、奖励计划、海外 App
              入口，以及公司在外卖基础设施上的存在，都指向一家试图把声量转成习惯的企业。这些信号有意义，但仍只是局部信号。公开来源没有披露活跃会员比例、频次曲线或成熟同期群留存。因此，客户故事是正面的，但不完整：足以判断
              HeyTea 有严肃的 CRM
              野心，不足以判断客户基础已经像完全验证过的经常性收入引擎那样运转。换一种说法，需求引擎已经具备可见的习惯要素，但还没有披露成熟留存质量的证据。这个缺口重要，因为高端饮品品牌可以在界面上看起来很粘，但实际仍对促销敏感。
