      - number: '1.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              公开融资和估值证据方向清楚，但数字并不一致。TechNode 报道称，2020 年由 Hillhouse 和 Coatue 领投的一轮融资将 HeyTea 估值推至 RMB 16B 以上，之前公司估值为 RMB
              9B。Dealroom、PitchBook、Tracxn、Hurun、WOWLS 和 AskCyborg 等公开数据库仍把 HeyTea
              归为由一线投资人支持的主要后期私营公司，但它们对当前估值、累计融资额，甚至最新轮次标签都没有达成一致。这种分歧本身就有分析价值：品牌重要性确实存在，但公开市场只能推断定价和股权结构细节，而不是从招股书或经审计年报里直接读取。尽调时，稳妥结论是
              HeyTea 获得机构支持，仍是一家有分量的独角兽级私营公司；但在拿到管理层材料或交易文件之前，2026 年精确估值和总融资额都应按估算区间处理。
