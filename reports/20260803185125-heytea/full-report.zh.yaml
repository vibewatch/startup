  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代品集合
        blocks:
          - type: paragraph
            body: >-
              HeyTea 的竞争集合不能只用茶饮连锁来定义。Chagee 和 Nayuki 这类直接高端茶饮对手很重要，因为它们争夺相近的品质、商场和生活方式需求。但 Luckin
              也重要，因为当便利性是买方主要目标时，高端饮品预算很容易转向咖啡；Mixue 同样重要，因为其加盟规模设定了低价参照点，可能把整个品类向下拉。也就是说，投资人要区分直接同业和替代品，但不能忽略任何一边。市场不允许
              HeyTea 只拼产品口味；公司还必须用价格架构、App
              便利性、速度和社交相关性，对抗商业模式完全不同的运营商。这也意味着，严肃的竞争章节必须比较商业模式，而不只是比较菜单项，因为决定变量往往是谁能用更好的经济性掌握流量和复购行为。
