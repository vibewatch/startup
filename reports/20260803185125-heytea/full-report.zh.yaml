      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              因此，这个品类的护城河耐久度是混合的。好消息是，强品牌、庞大会员基础和持续上新仍然重要，尤其是在中国大城市和海外旗舰市场。坏消息是，消费者几乎没有切换成本，可以在茶饮、咖啡和零食连锁之间多栖。Yicai
              关于低线扩张的报道与 China Speakers Bureau 关于茶饮大战的评论指向同一方向：规模本身不保证定价权，追逐门店数还可能伤害感知质量。对 HeyTea
              而言，投资问题是：品牌驱动的高端茶饮能否在下方的 Mixue、旁边的 Luckin 和上方的 Chagee
              之间保持足够清晰的差异，从而长期支撑私募估值溢价。投资人因此需要区分两种品牌：一种在社交媒体上看起来很标志性；另一种在竞争对手适应后，仍能持续跑出高于同业的经济性。本章因此把护城河耐久度视为执行问题：当更便宜、披露更充分或技术能力更强的对手持续进步时，HeyTea
              能否可持续地守住高端身份、服务一致性和足够的数字化复购行为？
