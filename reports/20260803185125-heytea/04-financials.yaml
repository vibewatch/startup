chapter:
  number: 4
  title: Financials
  summary: HeyTea clearly has scale, demand, and capital support, but the open web still offers only proxy-level evidence on revenue quality, unit economics, and runway; valuation analysis therefore has to lean on ranges and diligence gaps rather than audited confidence.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization
  body: 'HeyTea''s public financial story is strong on signals and weak on audited detail. The business clearly monetizes more than single-cup tea orders: the model extends across hero beverages, seasonal launches, food or bakery adjacencies, packed loyalty demand, and—based on network disclosures—a broader franchise and supply-chain ecosystem. Yet the company has never published a clean public breakdown of revenue mix, gross margin, or contribution margin. The best evidence comes from indirect indicators such as blockbuster product volumes, membership growth, and store expansion. That makes the first financial question qualitative rather than purely quantitative: is this a demand-rich brand with hidden economics, or a capital-intensive brand whose valuation has moved ahead of provable cash generation? Public evidence supports the former enough to stay interested, but not enough to underwrite the latter with conviction. In practice, the absence of audited segmentation means the strongest
    public case is about breadth of monetization, not the exact share of sales or profit produced by each lever.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI011
  - CI016
  - CI018
  tableRefs:
  - TI001
  - TI002
