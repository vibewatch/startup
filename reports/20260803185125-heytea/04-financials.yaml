- id: public-traction-and-demand-proxies
  title: Public traction and demand proxies
  body: 'Public traction data is impressive, albeit incomplete. FoodTalks'' summary of the 2024 annual report showed more than 150 million members, stronger-than-seasonal store performance in the back half of the year, and hero SKUs that sold tens of millions of cups. The overseas report added concrete volume examples: a 3,500-cup opening day in Times Square, daily averages above 2,000 cups, and resilient sales at later stores. Those are meaningful productivity clues. At the same time, they are not substitutes for a standard financial package. No public source gives same-store sales, normalized labor cost per store, delivery mix, wastage, or gross margin by product family. Investors therefore have to treat throughput data as proof of demand, not proof of profit. That distinction matters because private consumer companies often market the best throughput datapoints while leaving out the cohort-level economics that determine real cash generation.'
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
