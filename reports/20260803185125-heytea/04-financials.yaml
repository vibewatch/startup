  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-margin-disclosure
    missingEvidence: Current cash balance, burn, debt, and audited gross margin by channel or SKU.
    whyItMatters: Without these inputs, public investors cannot reliably judge runway or whether premium positioning generates real free cash flow.
    diligencePath: Request the latest audited financial statements, budget, and monthly operating dashboard.
    relatedQuestionRefs:
    - QI016
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: valuation-and-revenue-estimates
    missingEvidence: A reconciled bridge between database-based revenue and valuation estimates and management-reported internal numbers.
    whyItMatters: Different public databases disagree enough that a valuation model built on a single source could be badly wrong.
    diligencePath: Reconcile PitchBook, Dealroom, Tracxn, and management figures before underwriting entry price.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI021
    relatedTableRefs:
    - TI005
  - type: access-blocked
    severity: minor
    topic: supplemental-open-web-financial-sources
    missingEvidence: Additional direct open-web reporting from QSR, Restaurant Business, and World Coffee Portal pages that were inaccessible or stale at fetch time.
    whyItMatters: The current source set is adequate for structure but still thin on independent financial reporting.
    diligencePath: Retry blocked trade-media sources manually or via library databases if fuller market-specific financial context is needed.
