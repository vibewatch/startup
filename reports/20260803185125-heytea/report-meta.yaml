  topStrengths:
    - 150M+ members and repeated hero-SKU launches indicate real brand pull and a functioning CRM engine.
    - Public reports support very large physical scale, with 3,200+ stores by end-2023 and 4,000-branch claims thereafter.
    - Overseas expansion looks substantive rather than symbolic, with 100+ stores, local teams, and warehousing infrastructure.
    - Product innovation, premium positioning, and special-format stores create a differentiated customer proposition.
    - A credible public peer set now exists for benchmarking, especially Chagee, Luckin, Nayuki, and Mixue.
  topRisks:
    - Audited revenue quality, gross margin, cash, and mature-store payback remain undisclosed.
    - Price-war dynamics and lower-tier expansion could weaken premium positioning or compress contribution margin.
    - Historic hygiene incidents show that operational lapses can damage the trust premium quickly.
    - Franchise and overseas growth increase execution, quality-control, and compliance complexity.
    - Valuation data from public databases remains noisy enough that a single-point fair value is not defensible.
  unresolvedGaps:
    - Audited financial statements, including EBITDA, cash balance, debt, capex, and mature-store economics.
    - Active-member ratios, order frequency, channel mix, and overseas local-versus-diaspora cohort data.
    - Country-level profitability and compliance dashboards for overseas operations.
    - Reconciled cap-table, latest round terms, and management-backed current valuation bridge.
