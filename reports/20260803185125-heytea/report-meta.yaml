companyProfile:
  summary: >-
    HeyTea is a Shenzhen-headquartered premium tea chain founded in 2012 in Jiangmen by Nie Yunchen.
    The company helped popularize cheese tea and built a scaled consumer platform around premium fresh
    tea drinks, hero product launches, digital ordering, loyalty, and increasingly global store
    expansion. Public evidence supports a business with meaningful brand power, 150M+ members, 3,200+
    stores by end-2023, 4,000-branch claims by 2024-2025, and 100+ overseas stores by 2025, but still
    limited disclosure on profit quality and cash generation.
  founders:
    - name: Nie Yunchen
      role: Founder
      background: >-
        Opened the first HeyTea shop in Jiangmen, reportedly with about RMB 150,000, and built the
        brand through premium positioning, word-of-mouth growth, and early digital ordering workflows.
      claimRefs: [CO001, CO005, CO006]
  foundedDate: '2012-01-01'
  foundingLocation: Jiangmen, Guangdong, China
  headquarters: Shenzhen, China
  productSummary: >-
    Premium made-to-order tea beverages, fruit teas, cheese-topped drinks, seasonal hero launches,
    special-format stores, and adjacent food or retail products sold through company-owned and
    franchised stores plus digital ordering and rewards surfaces.
  customerFocus: >-
    Urban premium tea consumers in China and abroad, including app-first repeat users, delivery
    customers, diaspora and curiosity-driven overseas cohorts, and customers seeking freshness,
    aesthetics, and branded beverage experiences.
  businessModel: >-
    Direct consumer beverage sales through stores, delivery platforms, and owned digital surfaces,
    supported by a large member base, rapid launch cadence, special formats, overseas localization,
    and a growing franchise-linked operating ecosystem.
  stage: Late-stage private / likely pre-IPO but not publicly on a filing path as of the run date
  fundingStatus: >-
    Public evidence confirms blue-chip backing and a 2020 financing mark above RMB 16B, but public
    databases disagree on current valuation and cumulative funding totals, so current private-market
    pricing should be treated as a range rather than a precise figure.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO009, CO011, CO020, CO021, CO035, CO036, CI025, CV001]
summary:
  headline: >-
    HeyTea has the brand, scale, and product engine of a serious consumer platform, but thin public
    economics and private-company opacity keep the investment call at track rather than buy.
  overallScore: 6.1
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
