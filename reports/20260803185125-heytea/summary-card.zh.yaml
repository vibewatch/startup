  topStrengths:
    - 150M+ 会员和多次爆款 SKU 迭代显示真实品牌拉力，也说明 CRM 引擎能运转。
    - 公开报道支撑很大的线下规模：2023 年底 3,200+ 家门店，此后又有 4,000 家门店口径。
    - 海外扩张不是象征性动作，已有 100+ 家门店、本地团队和仓储基础设施。
    - 产品创新、高端定位和特殊店型构成差异化顾客主张。
    - 现在已有可信公开同业可用于对标，尤其是 Chagee、Luckin、Nayuki 和 Mixue。
  topRisks:
    - 经审计收入质量、毛利率、现金和成熟门店回本周期仍未披露。
    - 价格战和下沉扩张可能削弱高端定位，或挤压贡献利润率。
    - 历史卫生事件显示，运营失误会迅速伤害信任溢价。
    - 加盟和海外增长抬高执行、质量控制和合规复杂度。
