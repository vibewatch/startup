      - number: '1.3'
        title: Funding and valuation context
        blocks:
          - type: paragraph
            body: >-
              Public funding and valuation evidence is directionally clear but numerically inconsistent. TechNode
              reported that a 2020 financing round led by Hillhouse and Coatue valued HeyTea above RMB 16 billion and
              came after a prior RMB 9 billion valuation. Public databases such as Dealroom, PitchBook, Tracxn, Hurun,
              WOWLS, and AskCyborg all continue to classify HeyTea as a major late-stage private company backed by
              blue-chip investors, but they do not agree on current valuation, cumulative capital raised, or even the
              latest round label. That disagreement is itself analytically important: it suggests the brand's importance
              is real, yet the public market has to infer pricing and cap-table details rather than read them from a
              prospectus or audited annual report. For diligence purposes, the safe conclusion is that HeyTea has
              institutional backing and remains a meaningful unicorn-scale private company, but precise 2026 valuation
              and total-funding figures should be treated as estimated ranges until management materials or transaction
              documents are available.
