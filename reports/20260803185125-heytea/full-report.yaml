      - number: '1.2'
        title: Founder, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Founder Nie Yunchen is the clearest public key-person in the business. SCMP and TechNode both portray him
              as a young founder who treated HeyTea less like a traditional beverage kiosk and more like an internet-era
              consumer brand, combining product novelty, store design, and digital queue management. Public governance
              detail remains thinner than the founder narrative. HeyTea's operating entity is widely identified as
              Shenzhen Meixixi Catering Management, and Mondaq's IP-law summary confirms that entity's ownership of the
              HEYTEA trademark. However, the company does not publish the board, committee structure, or a fully
              fleshed-out executive roster on its public site. That opacity matters because a chain at this scale would
              normally be expected to show more formal disclosure around control, succession, and operating
              responsibility. The public record therefore supports a founder-led business with visible brand leadership
              but incomplete governance transparency, which should be carried as a diligence gap rather than glossed
              over.
