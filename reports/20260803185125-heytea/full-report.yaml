chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              HeyTea is a private Chinese new-style tea chain founded in 2012 in Jiangmen and now headquartered in
              Shenzhen. Multiple public profiles agree on the core identity: it began as Royal Tea, rebranded after
              trademark issues, and built its brand around premium tea, fruit tea, and the cheese-foam format that made
              the chain a social-media phenomenon. The public brand story has stayed consistent even as the company
              scaled from a Guangdong startup into a national and then international operator. Compared with mass-market
              milk-tea chains, the company positioned itself at a higher price point and leaned into store aesthetics,
              rapid menu refreshes, and digital ordering rather than low-price ubiquity alone. SCMP and TechNode both
              described HeyTea as an operator that tried to make tea culture feel modern, design-led, and
              internet-native. That positioning remains central to underwriting the business because brand power, not
              patent-like technology, is the main reason customers tolerate premium pricing and long queues.
