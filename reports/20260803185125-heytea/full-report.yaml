  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              HeyTea's competitive set cannot be defined by tea chains alone. Direct premium tea rivals such as Chagee
              and Nayuki matter because they compete for similar quality, mall, and lifestyle demand. But Luckin also
              matters because a premium beverage budget can easily shift to coffee when convenience is the buyer's main
              objective, and Mixue matters because its franchise scale sets the low-price reference point that can pull
              the whole category downward. That means investors need to separate direct peers from substitutes without
              ignoring either. The market does not let HeyTea compete only on product flavor; it also forces the company
              to defend price architecture, app convenience, speed, and social relevance against operators with very
              different business models. It also means that any serious competitor chapter must compare business models
              rather than just menu items, because the deciding variable is often who owns traffic and repeat behavior
              at the best economics.
            claimRefs:
