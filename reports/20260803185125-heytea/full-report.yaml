            body: >-
              The third risk cluster is opacity. HeyTea is large enough to matter but still private enough to withhold
              many of the numbers that would help investors price downside properly. Peer filing surfaces from listed
              beverage companies make this contrast obvious: public companies are expected to reveal far more about unit
              economics, governance, compliance, litigation exposure, and balance-sheet resilience than HeyTea does
              today. That lack of disclosure is not a scandal, but it is a real risk multiplier because it obscures how
              severe other issues might become under stress. At the same time, legal and IP risk is not imaginary.
              Mondaq’s coverage of the trademark dispute shows that copycat enforcement is part of the operating reality
              for a brand that popularized a category aesthetic. As the company expands internationally, jurisdictional
              complexity only increases. Investors should treat this less as a legal footnote and more as a structural
              uncertainty premium that has to be priced into every other assumption.
