      - number: '2.3'
        title: Buyer, user, payer, and channel logic
        blocks:
          - type: paragraph
            body: >-
              Buyer, user, and payer logic in this market are heterogeneous. iiMedia's survey evidence suggests tea
              beverages skew female, heavily 25-to-45, and concentrated in middle-income consumers who are willing to
              pay for convenience, taste, and health positioning but still remain price conscious. Discovery is digital:
              content-sharing platforms and local-life platforms are major demand shapers, and convenience stores,
              e-commerce, and app ecosystems all matter for how tea brands convert curiosity into repeat purchase. That
              is why peer operating models are relevant. Luckin's investor materials show how China's beverage market
              has normalized mobile-first ordering and cashier-less pickup, while Chagee frames premium tea as a modern
              branded lifestyle experience. For HeyTea, the key implication is that brand discovery, app convenience,
              and store or delivery access are all part of the market definition. Pure beverage taste alone no longer
              explains who wins, and channel ownership increasingly shapes the margin that sits behind every advertised
              market-growth number. That same channel complexity means premium share cannot be inferred from headline
              market size alone.
