      - number: '8.4'
        title: Underwriting conclusion
        blocks:
          - type: paragraph
            body: >-
              The final valuation view should be constructive but disciplined. Public sources support the proposition
              that HeyTea is a scaled, premium, institutionally backed beverage platform with genuine strategic
              relevance. They do not support pretending that the company deserves public-company certainty. The result
              is an underwriting stance that should tolerate a healthy premium to old history while still insisting on a
              material discount for opaque margins, hidden capital intensity, and execution risk. In practical terms,
              the most important next diligence step is not another desktop comp exercise. It is acquiring the audited
              financial package and mature-store operating data that would determine whether the market should think
              about HeyTea primarily as a premium compounder, a fashionable but economically noisy operator, or
              something in between. If management can close the biggest evidence gaps, the valuation debate could
              compress quickly; if not, uncertainty itself remains part of the price.
            claimRefs:
              - CV013
              - CV023
