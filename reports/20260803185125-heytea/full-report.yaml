        title: Scale, milestones, and adverse context
        blocks:
          - type: paragraph
            body: >-
              Scale and milestone evidence is stronger than formal financial disclosure. The company disclosed in its
              2024 annual report that membership had exceeded 150 million, up by more than 50 million in the year, and
              that several new product lines delivered blockbuster cup volumes. FoodTalks' overseas update then showed a
              sharp acceleration in international rollout: more than 100 overseas stores, more than 30 in the US, and a
              footprint across eight countries and 28 overseas cities by August 2025. Other public sources add
              complexity. Dao Insights wrote that end-2023 locations totaled 3,200, with roughly 2,300 franchised, and
              that the brand later publicized 4,000 branches worldwide. China Speakers Bureau echoed the 4,000-plus
              figure while warning that price wars, quality drift, and oversaturation were diluting the premium
              narrative. Taken together, the public record shows a chain that combined enormous member growth and
              overseas momentum with more structural execution risk than its polished brand image implies.
