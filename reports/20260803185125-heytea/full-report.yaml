  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment and positioning
        blocks:
          - type: paragraph
            body: >-
              HeyTea’s customer base appears to sit at the intersection of premium taste, urban lifestyle signaling, and
              novelty-seeking consumption. The brand promise is framed less like a basic refreshment utility and more
              like an aspirational beverage ritual: ingredients, packaging, queue-worthy launches, and culturally
              resonant presentation all shape the offer. Public reporting across China and overseas suggests that the
              company has repeatedly attracted customers willing to pay not only for tea but for the identity and
              freshness cues attached to it. That positioning helps explain why HeyTea could become a category-defining
              name even before it published much in the way of hard customer analytics. It also means customer diligence
              must distinguish carefully between brand heat and durable, repeat purchasing behavior. Public category
              reporting also helps here: premium tea has grown large enough that HeyTea does not need to appeal to
              everyone in order to matter. The more relevant question is whether it owns enough high-intent occasions
              among urban and aspirational consumers to stay differentiated as competitors proliferate.
