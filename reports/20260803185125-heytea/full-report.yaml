            body: >-
              The bull case is not hard to articulate. FoodTalks, Dao Insights, and historical valuation reporting all
              support a story of strong brand equity, rapid product velocity, large membership, expanding store reach,
              and growing international optionality. If same-store demand proves resilient, launches keep working, and
              overseas markets mature without consuming excessive capital, HeyTea can plausibly deserve a premium
              private-market narrative. The bear case is equally clear: public evidence still does not show mature-store
              cash generation, sustained margin quality, or the exact discount investors should apply for opacity. This
              is why a valuation range is more honest than a single target. The right question is how far above the
              stale 2020 anchor the business should trade while still respecting execution and disclosure uncertainty.
              Another reason to prefer a range is that the same public growth evidence can support very different values
              depending on whether margins and payback ultimately look software-like, retailer-like, or something in
