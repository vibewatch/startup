  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchors and data quality
        blocks:
          - type: paragraph
            body: >-
              HeyTea’s valuation chapter begins with an uncomfortable reality: public data proves that the business is
              important, but not exactly what it is worth. The best hard anchor in the public record is
              historical—TechNode’s 2020 report that the financing valued the company above RMB 16 billion. Since then,
              PitchBook, Tracxn, Dealroom, Hurun, WOWLS, and AskCyborg have all kept the company in the broad zone of
              scaled, capital-backed beverage champions. But they do not offer the kind of convergent precision that
              would justify a point estimate. That is not unusual for a private consumer company; it is simply the
              central constraint. The first task, therefore, is not to pick a favorite number but to decide which
              anchors are robust enough to keep and which are only useful as outer-boundary markers. A disciplined
              reader should therefore separate valuation evidence into three buckets: hard anchors that are old but
              real, softer databases that are current but noisy, and peer disclosures that are robust but imperfectly
              comparable.
