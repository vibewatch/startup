  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product engine and launch cadence
        blocks:
          - type: paragraph
            body: >-
              HeyTea’s product-tech story starts with its menu system, not with code. The company built its reputation
              by commercializing cheese tea and then extending that early product breakthrough into a repeatable cadence
              of hero launches, seasonal refreshes, and visually distinctive packaging. Public evidence suggests that
              this launch engine is not random: blockbuster SKUs recur, collaborations keep the calendar fresh, and
              premium presentation itself functions as a user-acquisition channel. In other words, product development,
              merchandising, and marketing are tightly fused. That does not prove a deep software moat, but it does show
              that HeyTea treats beverage launches as a system that can be scaled across formats and geographies. The
              open-web record therefore supports a thesis of disciplined commercial creativity: the company repeatedly
              turns taste experiments into scalable events, and then wraps them in packaging and cultural cues that help
              distribution work harder.
