      - number: '3.2'
        title: Peer profiles and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Publicly available peer disclosures show three distinct strategic playbooks. Mixue is the scale and
              franchise model: very low pricing, vast store count, and supply-chain leverage. Luckin is the digital
              convenience model: mobile-first, pickup-first, and operationally data-rich. Chagee is the premium tea
              model with the most visible recent public-market validation. Nayuki is the most comparable historical
              listed tea peer, but it mainly demonstrates how hard it is to keep premium tea economics strong enough for
              public investors. HeyTea sits between these poles. It lacks Mixue's rock-bottom pricing, lacks Luckin's
              pure coffee focus, and lacks Chagee's fresh public-company dataset, but it retains one of the strongest
              consumer brands in the category. Public listed peers matter here not because they are perfect matches, but
              because they reveal which combinations of pricing, format, and disclosure public investors will actually
              reward.
