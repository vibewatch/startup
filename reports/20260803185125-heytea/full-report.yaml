      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Moat durability in this category is therefore mixed. The good news is that strong branding, a large member
              base, and constant product launches can still matter, especially in large Chinese cities and overseas
              flagship markets. The bad news is that consumers can multi-home across tea, coffee, and snack chains at
              almost no switching cost. Yicai's reporting on lower-tier expansion and China Speakers Bureau's commentary
              on the tea wars both point in the same direction: scale alone does not guarantee pricing power, and
              chasing unit count can damage perceived quality. For HeyTea, the investment question is whether brand-led
              premium tea can remain distinct enough from Mixue below, Luckin beside it, and Chagee above it to justify
              a premium private valuation over time. Investors therefore need to distinguish between a brand that looks
              iconic on social media and a brand that can keep generating above-peer economics after competitors adapt.
              The chapter therefore treats moat durability as an execution problem: can HeyTea preserve premium
              identity, service consistency, and enough digital repeat behavior while cheaper, more disclosed, or more
              tech-enabled rivals keep improving around it? sustainably.
