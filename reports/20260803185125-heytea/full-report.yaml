      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand backdrop is favorable, but the constraint set is not trivial. Health trends, sugar reduction,
              and social-media-driven discovery help the category grow. Yet the same iiMedia research says food safety
              is the single most important improvement area consumers want, which means operational errors can destroy
              demand faster than clever marketing can rebuild it. Yicai's smaller-city reporting and China Speakers
              Bureau's tea-war commentary show the harder side of scale: when first-tier markets saturate, brands push
              down-market, cut prices, or introduce lower-priced sub-brands, but those moves can erode a premium
              identity. The category's size is real; the quality of revenue inside that category is less obvious. That
              is the central market takeaway for HeyTea: China new-style tea is big enough to support large winners, but
              only brands that defend differentiation while managing safety, supply, and discount pressure deserve
              premium valuation treatment.
