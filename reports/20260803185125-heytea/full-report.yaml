  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Food safety and reputational risk
        blocks:
          - type: paragraph
            body: >-
              The most tangible historical risk in the open record is operational hygiene. Archived reporting from
              Xinhua and Hexun shows that sanitation issues once became visible enough to threaten the brand’s premium
              promise. That history does not prove current controls are weak, but it does prove that the downside
              pattern is real: when a premium beverage chain fails on cleanliness or execution, it does not merely lose
              a few transactions—it risks undermining the trust premium customers were paying for in the first place.
              Because HeyTea is now larger and more internationally visible, any future quality incident would likely
              travel farther and faster than the incidents described in older reports. For a company whose brand is
              tightly linked to freshness and lifestyle signaling, that asymmetry makes operational discipline a
              first-order risk variable rather than a back-office detail. The diligence implication is straightforward:
              incident prevention and response capability deserve the same attention as growth metrics, because the
              brand can lose credibility faster than it can rebuild it.
