      - number: '7.2'
        title: Pricing, competition, and format risk
        blocks:
          - type: paragraph
            body: >-
              The second major risk cluster is competitive and economic. Multiple sources frame the category as being in
              a tea war, with pressure from lower-tier expansion, imitation, and shifting consumer value sensitivity.
              For HeyTea, the danger is not simply that competitors exist; it is that premium brands can be forced into
              choices that damage either traffic or margins. Rapid format experiments, collaborations, and hero-product
              cycles can keep the brand fresh, but they can also create complexity and fatigue if the company has to
              keep manufacturing novelty to defend attention. Lower-tier-city expansion and franchising extend reach,
              yet they may also dilute some of the premium cues that made the brand distinctive in the first place.
              These are manageable risks, but they are strategic rather than superficial. This cluster matters most when
              management is tempted to answer every competitive challenge with another format, promotion, or
              collaboration rather than with disciplined economics.
