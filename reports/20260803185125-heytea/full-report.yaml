      - number: '4.3'
        title: Cost structure, capital intensity, and franchising
        blocks:
          - type: paragraph
            body: >-
              Cost structure and capital intensity are the hardest parts of the model to see from public sources.
              Premium tea chains have obvious variable-cost exposure to fruit, dairy, tea inputs, packaging, and
              delivery commissions, plus fixed-cost exposure to rent, staffing, and quality control. HeyTea's own
              overseas update makes the capital picture heavier than a pure asset-light narrative: warehousing centers,
              local procurement programs, specialized teams, and market-by-market rollout all imply more infrastructure
              than a social-media brand might first suggest. Franchising helps on capital efficiency because franchisees
              fund many units, but it also moves the control challenge upstream into supply standards and QA. That
              trade-off helps explain why price-war pressure matters so much: lower realized pricing can compress
              economics before a private company has to disclose it. A further complication is that premium beverage
              operators can look operationally efficient at the store level while still consuming heavy central spend on
              QA, product development, and international scaffolding. That is why the chapter treats capital efficiency
              and operating leverage as related but not identical.
