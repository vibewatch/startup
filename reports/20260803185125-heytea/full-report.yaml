        title: Fragility, gaps, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The core risk is that public enthusiasm is easier to observe than stable cohort economics. Queue stories,
              opening-day sales, premium positioning, and collaboration-driven attention all support a compelling
              top-of-funnel narrative. They do not automatically prove long-lived retention or broad-based
              affordability. Customer diligence therefore needs to press beyond total membership and social buzz into
              active cohorts, channel mix, order frequency, down-trading behavior, and performance by market. Open-web
              customer-proof surfaces are useful because they show live interaction contexts, but they cannot settle the
              biggest underwriting questions. The correct customer conclusion is supportive but cautious: demand quality
              looks promising, yet still materially under-disclosed. Investors should therefore ask for proof that the
              customer story remains healthy even after novelty decays, competitor promotions intensify, and the company
              leans harder on convenience channels. Without that, customer quality remains promising but still partly
              inferential. The ambiguity persists.
