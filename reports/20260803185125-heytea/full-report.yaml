      - number: '4.4'
        title: Disclosure gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The resulting underwriting verdict is cautious. TechNode's 2020 valuation mark and the current database
              ranges prove that investors have repeatedly ascribed significant enterprise value to HeyTea. But the
              absence of audited statements, clear revenue-recognition detail, cash balances, and store-level unit
              economics leaves major gaps. Peer filings from Luckin, Nayuki, and Chagee are useful precisely because
              they reveal how much HeyTea does not publish. The open-web evidence is therefore enough to conclude that
              HeyTea is a scaled, well-funded beverage operator with real demand and meaningful infrastructure needs. It
              is not enough to conclude, with high confidence, what free-cash-flow potential or downside protection the
              current private valuation actually embeds. In other words, the debate is no longer whether HeyTea matters,
              but whether the private-data package can prove that scale converts into defensible economics.
