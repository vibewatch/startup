  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what should count
        blocks:
          - type: paragraph
            body: >-
              The relevant market for HeyTea is narrower than all tea, all beverages, or all Chinese foodservice. HeyTea
              monetizes fresh-made premium tea occasions: fruit tea, cheese tea, seasonal wellness SKUs, and app-led
              order-ahead or delivery missions that compete for the same wallet as premium milk tea, entry-premium
              coffee, and social refreshment. That means the correct boundary starts inside China's new-style tea
              market, not the broader tea economy. Using only agricultural tea output or total bottled-tea consumption
              would exaggerate the opportunity, while using only premium flagship peer counts would understate the
              demand pool because the same users also buy via local-life apps, mall visits, and snack-led impulse
              occasions. Public commentary from TechNode, SCMP, and Vice shows why this boundary matters: HeyTea
              historically won by making tea feel more premium, photogenic, and lifestyle-driven than commodity milk
              tea. In other words, the category is as much about format, brand, and channel as it is about the liquid
              itself.
