- id: risk-prioritization-and-diligence-focus
  title: Risk prioritization and diligence focus
  body: 'The right investor takeaway is not panic but prioritization. The acute near-term risks appear to be price pressure, execution drift across a large and partly franchised network, and the inability to test unit economics from the public record. Longer-term concerns include category commoditization, brand fatigue, compliance complexity, and the possibility that private-company opacity persists longer than investors would like. Some public evidence suggests resilience: the company kept growing after older hygiene issues and has been able to localize abroad. But resilience without transparency is not the same thing as low risk. The next stage of diligence should therefore be designed to force management to quantify where the real fragility sits—QA, cohorts, mature-store economics, partner control, or cash generation—before upside narratives are trusted. In practice, the most useful diligence outcome would be a ranked map of which risks management already measures tightly and which ones
    are still monitored only through lagging symptoms.'
