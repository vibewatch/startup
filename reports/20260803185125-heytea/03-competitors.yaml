  evidenceGaps:
  - type: missing-source
    severity: material
    topic: same-store-share
    missingEvidence: Clean city-level share and same-store sales comparisons across HeyTea, Chagee, Luckin, Mixue, and Nayuki.
    whyItMatters: Store count and pricing alone do not reveal who is actually winning profitable demand in overlapping cities.
    diligencePath: Request competitor benchmarking by cups per store, AOV, repeat frequency, and promo intensity in top 20 cities.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: heytea-retention-versus-peers
    missingEvidence: Repeat-purchase, reactivation, and member-spend data for HeyTea against direct peers.
    whyItMatters: A premium brand with weak repeat behavior has less moat than store lines or Instagram photos suggest.
    diligencePath: Ask management for cohort dashboards and compare them with public peer proxies.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: menu-pricing-vintage
    missingEvidence: A same-date pricing scrape across all major peers and cities.
    whyItMatters: Public commentary uses different dates and regions when comparing price ladders.
    diligencePath: Normalize menus to a common city and month before using price gaps in a valuation model.
