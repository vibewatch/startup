chapter:
  number: 3
  title: Competitors
  summary: 'HeyTea competes from a premium-brand middle ground: below Chagee on fresh public valuation evidence, above Mixue on price, beside Luckin on convenience substitution, and against Nayuki as the closest listed tea-chain precedent.'
sections:
- id: competitive-landscape
  title: Competitive landscape and substitute set
  body: HeyTea's competitive set cannot be defined by tea chains alone. Direct premium tea rivals such as Chagee and Nayuki matter because they compete for similar quality, mall, and lifestyle demand. But Luckin also matters because a premium beverage budget can easily shift to coffee when convenience is the buyer's main objective, and Mixue matters because its franchise scale sets the low-price reference point that can pull the whole category downward. That means investors need to separate direct peers from substitutes without ignoring either. The market does not let HeyTea compete only on product flavor; it also forces the company to defend price architecture, app convenience, speed, and social relevance against operators with very different business models. It also means that any serious competitor chapter must compare business models rather than just menu items, because the deciding variable is often who owns traffic and repeat behavior at the best economics.
  claimRefs:
  - CP001
  - CP002
  - CP021
  - CP031
  - CP032
  - CP033
  tableRefs: []
  figureRefs:
  - FP001
- id: peer-profiles-and-pricing
  title: Peer profiles and pricing architecture
  body: 'Publicly available peer disclosures show three distinct strategic playbooks. Mixue is the scale and franchise model: very low pricing, vast store count, and supply-chain leverage. Luckin is the digital convenience model: mobile-first, pickup-first, and operationally data-rich. Chagee is the premium tea model with the most visible recent public-market validation. Nayuki is the most comparable historical listed tea peer, but it mainly demonstrates how hard it is to keep premium tea economics strong enough for public investors. HeyTea sits between these poles. It lacks Mixue''s rock-bottom pricing, lacks Luckin''s pure coffee focus, and lacks Chagee''s fresh public-company dataset, but it retains one of the strongest consumer brands in the category. Public listed peers matter here not because they are perfect matches, but because they reveal which combinations of pricing, format, and disclosure public investors will actually reward.'
