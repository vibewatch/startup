- id: capabilities-distribution-and-switching
  title: Capabilities, distribution, and switching costs
  body: 'The main competitive comparison is not product breadth in the abstract; it is what each peer can do better per unit of capital. Mixue wins on affordability and franchise reach. Luckin wins on convenience, mobile frequency, and operating automation. Chagee wins on premium tea storytelling supported by public-market momentum. Nayuki''s main advantage for analysts is disclosure, not demonstrated superior economics. HeyTea historically won on design, product rhythm, and a more aspirational tea experience. Those are real advantages, but they are softer than software or pharma moats because beverage formats travel fast. If HeyTea lets discounting or overexpansion erode the premium feel, the differentiation can compress quickly. This is why switching cost analysis is so unforgiving for HeyTea: convenience, digital frequency, and low-price fallback options all reduce the duration of any single product advantage.'
