- id: moat-limits-and-diligence-focus
  title: Moat limits and diligence focus
  body: 'The most important investor distinction is between digital competence and deep technology advantage. HeyTea clearly shows evidence of the former: owned apps or web surfaces, loyalty mechanics, platform integrations, launch discipline, and international operational routines. The open web does not clearly show the latter. There is almost no direct disclosure on recommendation models, proprietary inventory systems, internal developer stack, or other software assets that would obviously compound like a classic tech moat. That means diligence should focus on whether the company’s real edge sits in product innovation routines, supply execution, training, and CRM—capabilities that are valuable, but that defend economics differently from software. For underwriting, that pushes diligence toward process quality and measurable repeat behavior instead of toward speculative assumptions about hidden code assets. A practical consequence is that investors should not force this chapter into a false
    software template. The better frame is whether the company has encoded enough menu development discipline, CRM learning, operating standards, and local adaptation skill to keep launching attractive products faster than copycats can commoditize them. If management can demonstrate durable repeat behavior, controlled wastage, reliable QA, and strong launch postmortems, that may matter more than whether outsiders can see a flashy engineering story. That distinction is strategically crucial.'
