- id: store-formats-collaboration-and-localization
  title: Store formats, collaboration, and localization
  body: 'Store design and market adaptation look like core parts of the capability stack. LAB and other special formats show how the company uses physical retail to showcase novelty and premium signaling, while the Singapore convenience-store-like concept suggests experimentation with different labor, speed, and basket models. Overseas reporting points to localization that goes beyond signage: local teams, local procurement, and local product-development resources imply repeatable operational playbooks. Collaborations with brands such as adidas and Fenty reinforce that the product platform extends into culture, collectibles, and brand theater. These moves matter because they expand the product surface without requiring the company to invent entirely new beverage categories every cycle. Seen together, those capabilities resemble a product operating system for premium tea retail more than a narrow menu brand, even if many economics remain private.'
  claimRefs:
  - CE007
