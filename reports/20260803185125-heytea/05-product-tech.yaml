- id: digital-surfaces-and-customer-flow
  title: Digital surfaces and customer flow
  body: The visible digital layer is real but probably narrower than casual observers assume. The overseas app listing, rewards page, delivery surfaces, and mobile web presence all point to a competent customer-facing digital stack centered on browse, order, loyalty, and repeat behavior. Those are important capabilities for queue management, frequency, and first-party CRM. But public evidence is much thinner on internal architecture, developer tooling, or advanced recommendation systems. The likely conclusion is that HeyTea is digitally enabled where the customer feels it, while much of the harder operational logic remains private or less differentiated in public view. That matters because for premium beverages, a modest but well-executed digital layer can still be commercially powerful if it shortens queues, improves discovery, and nudges repeat purchases.
  claimRefs:
