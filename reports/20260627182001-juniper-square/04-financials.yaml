callouts:
  - calloutType: risk
    title: Gross margin is the single most important undisclosed number
    body: >-
      The terminal value of Juniper Square depends critically on whether its blended gross margin converges
      toward pure-SaaS levels (75–85%) as JunieAI automates fund admin labor, or stays depressed (55–65%)
      if the services arm keeps growing faster than the software layer. This cannot be resolved from public
      sources—it requires diligence access to the audited P&L with segment-level gross margin disclosure.
    claimRefs: [CI015, CI032, CI033]

  - calloutType: risk
    title: Estimated ARR relies entirely on third-party aggregators with no company confirmation
    body: >-
      The $139.8M ARR figure cited throughout this chapter comes from GetLatka, a low-reputation publisher
      that uses estimated rather than confirmed revenue data. Sacra's analysis is consistent but also
      estimated. The company has made no public ARR disclosure. At the $1.1B valuation, a 20% ARR
      overestimate (actual ARR $112M) would push the effective multiple to ~9.8x—still within AI SaaS
      benchmarks but materially different. Investors must require audited ARR confirmation as a precondition
      for investment pricing.
    claimRefs: [CI019, CI034]

  - calloutType: insight
    title: The December 2025 debt facility is a positive signal, not a distress indicator
    body: >-
      Premier Alternatives' disclosure of a December 2025 "Debt - General" round at an undisclosed amount
      is consistent with a maturing growth company securing a credit facility to fund working capital for
      its managed services arm or extend operational runway between equity rounds. This is not unusual for
      hybrid SaaS-plus-services companies with a large headcount. The undisclosed terms warrant diligence
      to assess any covenant or warrant coverage that might affect equity dilution.
    claimRefs: [CI024, CI029, CI030]

