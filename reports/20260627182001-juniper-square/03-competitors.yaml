callouts:
  - calloutType: insight
    title: Carta is the most credible convergence threat in the PE/VC segment
    body: >-
      Carta's AI-native fund administration narrative and $220B+ in fund assets under administration make
      it the one competitor with the brand, capital, and technical roadmap to challenge Juniper Square
      specifically in the PE/VC fund OS market. Juniper Square's advantages—cross-strategy coverage,
      managed services flywheel, and LP network scale—are durable but not impenetrable against a
      well-capitalized competitor running an equivalent AI narrative.
    claimRefs: [CP005, CP006, CP029]

  - calloutType: risk
    title: CRE sub-market erosion is measurable and ongoing
    body: >-
      Agora (~1,200 customers, ~$749/month) and InvestNext (documented switching testimonials from JS) are
      gaining traction at the cost-sensitive CRE syndicator segment that may represent a meaningful share of
      Juniper Square's 2,300+ GP base. If sub-$250M AUM CRE sponsors represent 30–40% of JS's GP count
      (unconfirmed), price erosion in this segment poses a near-term churn risk.
    claimRefs: [CP008, CP009, CP010]

  - calloutType: assumption
    title: Multi-strategy breadth claim is not independently corroborated
    body: >-
      Juniper Square's claim to be the only GP fund OS with confirmed material presence across PE, VC, CRE,
      and private credit is based on company-disclosed customer pages and product documentation—not on
      independent market share data. The claim is plausible given network scale but should be verified
      through diligence referencing independent analyst benchmarks.
    claimRefs: [CP001, CP031]

