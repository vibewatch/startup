  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual exposure sits where regulatory/compliance drift and AI-enabled control errors can damage trust
      across many customer workflows at once.
    data:
      columns:
        - Moderate impact
        - High impact
        - Very high impact
        - Critical impact
      rows:
