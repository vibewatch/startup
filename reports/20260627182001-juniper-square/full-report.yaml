          - type: callout
            title: Multiple compression is the main downside path
            body: >-
              The likely bear case is not operational collapse but slower growth meeting a more public-market-style
              revenue multiple while disclosure remains thin.
            calloutType: risk
            claimRefs:
              - CV040
              - CV041
              - CV046
