  - id: FI001
    title: Revenue model bridge
    type: waterfall
    layout: standard
    summary: >-
      Illustrative revenue model bridge showing how Juniper Square builds from SaaS subscriptions through managed
      services and AI add-ons to estimated total ARR, with key uncertainty ranges.
    data:
      items:
        - label: SaaS subscription base (est.)
          value: 80
          detail: Estimated SaaS-only ARR contribution (~50–70% of $140M total), based on revenue mix analysis
        - label: Managed fund admin services (est.)
          value: 45
          detail: >-
            Estimated fund admin ARR-equivalent (~30–50% of total); >100% 3yr CAGR indicates rapid growth from smaller
            base
        - label: JunieAI / premium modules (est.)
          value: 15
          detail: Estimated AI and premium add-on contribution; highly uncertain—launched 2025 with limited public disclosure
        - label: Total estimated ARR (2025)
          value: 140
          detail: 'GetLatka estimate: $139.8M; consistent with Sacra analysis; company has not confirmed'
    approximationNotes: >-
      All values in USD millions (annual). Segment values are illustrative estimates only; Juniper Square does not
      disclose revenue mix. Segment contributions sum to estimated total ($140M rounding).
    claimRefs:
      - CI001
      - CI002
      - CI003
  - id: FI002
    title: Unit economics bridge
    type: kpi
    layout: standard
    summary: >-
      Key unit economics KPIs for Juniper Square's financial profile, combining confirmed metrics with analyst
      estimates, with confidence labels.
    data:
      items:
        - label: ARR (2025, GetLatka)
          value: 139.8
          unit: $M
          detail: Third-party estimate; consistent with Sacra range; not company-confirmed
        - label: ARR growth (YoY)
          value: 29
          unit: '%'
          detail: Derived from GetLatka 2024 ($108.2M) to 2025 ($139.8M) estimates
        - label: Avg enterprise ARR/customer
          value: 700
          unit: $K+
          detail: Sacra estimate for enterprise cohort; broad customer base includes many smaller GPs at entry price
        - label: Series D implied ARR multiple
          value: 7.9
          unit: x ARR
          detail: $1.1B valuation / $139.8M estimated ARR; consistent with AI-enabled vertical SaaS 2026 comps
        - label: Estimated gross margin
          value: 65
          unit: '% (est.)'
          detail: >-
            Analyst midpoint estimate; range 55–75%; not publicly disclosed; lower than pure SaaS (75–85%) due to
            services component
        - label: Fund admin 3-yr CAGR
          value: 100
          unit: '%+'
          detail: Company-reported; fastest-growing product segment; managed services driving expansion
        - label: G2 customer payback period
          value: 17
          unit: months
          detail: User-reported average; implies solid customer ROI and high switching cost post-deployment
    claimRefs:
      - CI004
      - CI007
      - CI015
      - CI019
