  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: >-
      Low-to-high range for key Juniper Square financial estimates, reflecting the uncertainty from reliance on
      third-party proxies and absence of audited financial disclosures.
    data:
      items:
        - label: ARR 2025 estimate ($M)
          low: 120
          high: 160
          unit: $M
