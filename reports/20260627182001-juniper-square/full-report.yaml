              - CV036
              - CV046
      - number: '8.5'
        title: Exit Readiness & Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is promising but still incomplete in public evidence. On the positive side, Juniper Square
              has category-tailwind exposure, marquee investors, visible customer footprint, trust-and-compliance
              signaling, and a strategic partnership with Nasdaq that broadens the narrative beyond back-office
              digitization. On the negative side, public evidence still lacks the operating metrics that matter most for
              a private-to-public or large strategic-sale transition: gross margin profile, recurring-software versus
              services mix, cohort retention, customer concentration by ARR, and preference-stack complexity. Regulatory
              pressure also matters directly to exit timing because private-markets technology vendors now operate
              inside a tighter governance environment for AI, cyber controls, fee transparency, and investor
              communications. The thesis is therefore breakable not only by weaker growth, but also by evidence that
              compliance burden, service delivery, or control maturity lags the ambitions embedded in the current
              valuation story.
            claimRefs:
              - CV005
              - CV021
              - CV022
              - CV023
              - CV025
              - CV026
              - CV043
              - CV044
              - CV045
