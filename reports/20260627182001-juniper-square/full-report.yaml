        - label: Gross margin estimate (%)
          low: 55
          high: 78
          unit: '%'
          detail: >-
            SaaS+services blend; lower bound assumes 40% of ARR is managed services at 30% gross margin; upper bound
            assumes SaaS-dominant mix
        - label: ARR multiple at Series D (x ARR)
