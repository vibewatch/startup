      - number: '3.3'
        title: Adjacent and Emerging Competitors
        blocks:
          - type: paragraph
            body: >-
              iCapital Network operates as a retail and RIA alternatives distribution platform and manages over $200
              billion in platform assets. Its primary value proposition is fund access and investor education for wealth
              managers—the LP side of the market—not GP fund operations. However, iCapital's expansion into fund
              operations services for asset managers (onboarding, document management, subscription workflow) creates
              potential downstream overlap with Juniper Square's LP management modules. The strategic investment from
              Nasdaq Ventures in September 2025 may signal Juniper Square's intent to expand into secondaries liquidity
              infrastructure that iCapital currently dominates in the wealth channel. Dynamo Software provides CRM and
              deal management analytics for PE, VC, and hedge funds, serving a different primary buyer (IR and deal
              teams) within the same GP customer. Dynamo integrates investor relations, deal tracking, and portfolio
              monitoring but does not offer fund accounting or a managed administration service. SS&C Technologies is
              the world's largest fund administrator and provides both technology (SS&C Geneva for hedge funds; private
              markets administration platform) and outsourced services to institutional clients. SS&C competes for
              Juniper Square's enterprise managed services segment, where a GP may choose a bundled
              technology-plus-services relationship with SS&C over a SaaS-first relationship with Juniper Square. SS&C's
              advantage is its institutional depth and global operational footprint; its disadvantage is a legacy
              architecture that lacks Juniper Square's integrated LP portal and AI-native design.
