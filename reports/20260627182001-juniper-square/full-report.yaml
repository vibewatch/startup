              - CV041
      - number: '8.2'
        title: Financing & Valuation Evidence
        blocks:
          - type: paragraph
            body: >-
              The hard public anchor remains the June 2025 Series D: $130 million at a $1.1 billion post-money
              valuation, led by Ribbit Capital with strategic participation from Fifth Wall and continued support from
              Redpoint, HighSage, and Blue Owl. Third-party datasets and company disclosures line up on the broad
              picture that Juniper Square has raised roughly $238 million across five rounds, while the SEC Form D shows
              only a $44 million offering amount at the May 2025 filing date, consistent with a staggered or partially
              completed close rather than a contradiction. The central valuation question is whether the public revenue
              evidence is strong enough to justify the 2025 price in 2026. Using Latka's $139.8 million 2025 ARR
              estimate, the Series D implies about 7.9x ARR. That is not extreme by vertical software standards, but it
              is full enough that investors should want better visibility into gross margin, net revenue retention,
              burn, dilution, and liquidation preferences before underwriting attractive forward returns at the same or
              a higher price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
