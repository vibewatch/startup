        - Shows the upper end of private-market platform value for scaled alternatives infrastructure
        - Broader distribution and product model than Juniper Square and limited public current financials.
      - - Salesforce
        - Public software and AI platform benchmark
        - ~$129.7B market cap on $41.5B FY2026 revenue; ~3.1x market-cap-to-revenue
