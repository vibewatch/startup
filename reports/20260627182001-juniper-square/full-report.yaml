      - Limitation
    rows:
      - - Raise a new fund
        - Prospect data, diligence materials, and subscription steps often live in separate tools
        - Data rooms, CRM, fundraising dashboards, and digital subscriptions in one workflow
        - Official pages position the workflow as faster fundraising with less manual effort
        - Public sources do not quantify average cycle-time reduction.
      - - Onboard new LPs
        - Manual subscription packets and fragmented AML-KYC review create delays
        - Adaptive subscriptions, DocuSign, managed close services, and compliance workflows
        - Official materials say onboarding is designed to accelerate closes and reduce friction
        - Jurisdiction-specific exception handling is not fully public.
      - - Run investor communications
        - IR teams manually stitch together pipeline, position, and document context
        - CRM, LP portal, tear sheets, personalized updates, and activity history
        - Award and review sources support workflow quality and investor-experience improvement
        - Independent evidence does not quantify response-time or productivity gains by firm size.
      - - Close books and report to LPs
        - Accounting, allocations, and reporting often require re-keying data across teams
        - Fund accounting, statements, notices, and accounting-backed portal reporting
        - Official pages emphasize real-time metrics and more reliable reporting
        - No public SLA or close-cycle benchmark is disclosed.
      - - Move capital and reconcile payments
        - Distributions and payment status can drift from ledger and investor records
        - Treasury workflows tied to calls, distributions, and payment operations
        - Sacra and official pages indicate payout status stays synchronized with the ledger
        - Public documentation does not disclose banking-partner redundancy or failure playbooks.
      - - Use AI inside regulated fund operations
        - Horizontal AI tools lack private-markets context and governance
        - JunieAI and Headless GPX expose fund workflows through existing permissions, audit trails, and structured data
        - Headless GPX extends GPX to Claude, Copilot, ChatGPT, and MCP-compatible clients
        - The public roadmap does not yet provide dates for full write-action expansion.
