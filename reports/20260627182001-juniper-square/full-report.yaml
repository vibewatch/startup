      - number: '4.6'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is solid: recurring SaaS subscriptions with high switching costs (17-month payback implies
              strong customer commitment), a managed services arm with >100% 3-year CAGR and 94% staff retention, and an
              enterprise average ARR/customer exceeding $700K. The implied ARR multiple of ~7.9x (Series D $1.1B /
              ~$140M ARR) is consistent with AI-enabled vertical SaaS at >25% ARR growth per Acquiry's 2026 benchmarks
              (Traditional SaaS >30% growth: 5–8x ARR; AI-enabled integration commands premium). The valuation is not
              aggressive relative to SaaS comps, but it is also not obviously cheap—leaving limited multiple-expansion
              upside unless JunieAI materially accelerates ARR growth. The hybrid revenue model creates a margin
              ceiling: managed services with 200+ staff cannot achieve the 80%+ gross margins of pure SaaS, limiting
              terminal margin potential relative to pure-play software companies. The Series D and December 2025 debt
              facility provide adequate near-term capital. No evidence of distress, covenant risk, or accelerated burn.
              Material diligence blockers: (1) no audited financials to confirm ARR estimates; (2) gross margin not
              disclosed—the key swing factor in terminal value; (3) NRR not disclosed— critical for assessing revenue
              quality; (4) burn rate unknown—runway may be shorter if J-curve from JunieAI investment is steeper than
              expected; (5) December 2025 debt facility terms unknown— could include covenants or warrants affecting
              equity dilution. For a full investment decision, diligence must include access to Juniper Square's audited
              financials, cohort-level NRR and GRR, ARR bridge by product, and gross margin by revenue segment.
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
