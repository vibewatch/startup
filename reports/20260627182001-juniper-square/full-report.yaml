        - Track
        - Strong company evidence but incomplete underwriting evidence at the current price
        - Do not underwrite a buy on public evidence alone.
      - - Confidence
        - Medium
        - Series D and growth evidence are credible but margin and retention transparency remain thin
        - Advance only if management shares detailed KPI cohorts and quality-of-revenue data.
      - - Risk rating
        - Medium
        - High switching costs and category tailwinds offset by regulation, competition, and disclosure gaps
        - Size cautiously and expect diligence to move the view materially.
      - - Valuation stance
        - Stretched
        - ~$1.1B post-money on estimated ~$139.8M ARR implies about 7.9x ARR without public margin disclosure
        - Require either better data or a better price.
      - - Target return discipline
        - Prefer >2.5x gross MOIC potential from the next entry point
        - Private pricing plus dilution/preference uncertainty can erode venture returns quickly
        - Wait for clearer upside-to-risk skew before committing.
    notes: >-
      Summary reflects publicly supportable evidence available on 2026-06-27; target-return discipline is an
      investment-framework view rather than a company-disclosed metric.
    claimRefs:
      - CV001
      - CV006
      - CV009
      - CV037
      - CV041
      - CV042
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market
        - >-
          Alternatives AUM growth and retail participation expansion support long-duration demand for private-markets
          operating software
        - Category growth does not guarantee one vendor sustains premium pricing if incumbents modernize faster
        - >-
          Show sustained category growth translating into Juniper Square win rates and expansion rather than only TAM
          rhetoric.
      - - Product and moat
        - Unified workflows and high switching costs suggest sticky system-of-record behavior
        - >-
          Workflow breadth can be matched over time by administrators and adjacent platforms bundling software with
          service
        - Provide independent migration-churn and multi-product attach data.
      - - Customers
        - >-
          Average enterprise account revenue above $700K and client stories across PE, VC, and real estate imply deep
          adoption
        - Sacra flags concentration and notes four of five largest customers are PE/VC by revenue
        - Disclose revenue concentration and logo retention by cohort.
      - - Financials
        - Estimated ARR and multiyear growth support scale for a premium private multiple
        - No public gross margin, NRR, FCF, or burn data means quality of growth cannot be judged externally
        - Share software-services mix, gross margin trend, and retention-backed rule-of-40 style metrics.
      - - Competition
        - Strategic backing from Ribbit, Fifth Wall, and Nasdaq suggests ecosystem relevance
        - >-
          Traditional fund administrators and adjacent platforms continue integrating technology and could compress
          pricing
        - Show durable win rates versus Carta, iCapital, Allvue, Yardi, and administration-led bundles.
      - - Risk and governance
        - Security-compliance signaling plus PMRC governance focus suggest management understands control requirements
        - >-
          AI rollout raises governance burden and any control failure could damage valuation faster than product
          progress helps it
        - Prove AI controls, incident history, and model-governance maturity in diligence.
    notes: >-
      Rows are organized around the chapter's required judgment dimensions: market, product, customers, financials,
      competition, and risk.
