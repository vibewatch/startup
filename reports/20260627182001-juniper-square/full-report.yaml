              - CV040
              - CV044
              - CV046
      - number: '8.6'
        title: Final Recommendation & Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track recommendation rather than a buy or avoid call. Juniper Square looks like a
              high-quality private-markets infrastructure asset with meaningful workflow depth, high switching-cost
              characteristics, attractive customer economics, and room to benefit from long-term alternatives growth.
              However, the current public package is too opaque to support conviction that the June 2025 valuation
              offers enough margin of safety for a new investor in 2026. The right posture is medium confidence and
              medium risk: good company, plausible premium asset, but still price sensitive. The valuation stance is
              stretched because the 7.9x ARR anchor is already discounting sustained expansion while leaving margin,
              retention, and cap-table terms underdisclosed. A stronger recommendation would require either materially
              better diligence access, clearer evidence that AI/admin cross-sell is lifting durability and margins, or a
              future entry price that restores a clearer path to target venture returns after dilution and preference
              overhang.
            claimRefs:
              - CV009
              - CV037
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
