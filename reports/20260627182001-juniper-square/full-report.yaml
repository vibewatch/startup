            title: Gross margin is the single most important undisclosed number
            body: >-
              The terminal value of Juniper Square depends critically on whether its blended gross margin converges
              toward pure-SaaS levels (75–85%) as JunieAI automates fund admin labor, or stays depressed (55–65%) if the
              services arm keeps growing faster than the software layer. This cannot be resolved from public sources—it
              requires diligence access to the audited P&L with segment-level gross margin disclosure.
