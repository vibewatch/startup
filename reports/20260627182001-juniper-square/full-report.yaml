    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Main risk
    rows:
      - - Unified data model and system of record
        - Stores fund, investor, capital-activity, and performance data used across modules
        - Data quality and schema governance
        - If the shared model is incomplete or misconfigured, downstream workflows and AI outputs degrade together.
      - - Workflow applications
        - Fundraising, IR, accounting, treasury, compliance, reporting, and BI workflows
        - Consistent permissions and process design
        - Workflow sprawl can create adoption variance across teams and segments.
      - - Fund administration services
        - Human operational layer around accounting, investor services, and books
        - Staff continuity and service management
        - Service quality can become a constraint if operational scaling lags product sales.
      - - Integration layer
        - Prebuilt connectors and custom API-based connections to CRM, data, e-sign, and accounting tools
        - Third-party APIs and sync reliability
        - Broken mappings or delayed syncs can compromise the single-source-of-truth promise.
      - - AI and headless access layer
        - JunieAI agents and Headless GPX access for MCP-compatible AI clients
        - Permission inheritance, prompt design, and workflow guardrails
        - Agent write actions elevate governance and change-control requirements.
      - - Trust and control plane
        - Authentication, authorization, auditability, privacy, and compliance controls
        - RBAC, SSO, 2FA, logging, and policy enforcement
        - Weak control inheritance would turn the headless model into an exposure multiplier.
      - - AWS infrastructure
        - Cloud hosting, security controls, and redundancy foundation
        - AWS availability and configuration discipline
        - Infrastructure concentration means operational issues can propagate broadly if not contained.
    notes: >-
      This table describes the operating architecture publicly inferable from Juniper Square's official API, security,
      AI-launch, and third-party system-of-record descriptions; it is an operating-model view, not a low-level software
      bill of materials.
