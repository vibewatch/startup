      - number: '3.5'
        title: Moat Durability and Competitive Risk Register
        blocks:
          - type: paragraph
            body: >-
              Juniper Square's competitive moat has five layers. First, switching costs: the average 17-month payback
              period and 3-month implementation time imply high migration friction once a GP commits to the platform.
              Second, data network effects: 750,000+ LP accounts and $1T in LP equity on the platform means LP-side
              onboarding friction for competing vendors rises as JS's network grows. Third, managed services lock-in:
              the 200+ person administration team and 94% annualized staff retention creates a staffed-fund-admin
              relationship that is far more difficult to replace than a software subscription. Fourth, AI proprietary
              data: JunieAI and the MCP headless interface have exclusive access to Juniper Square's multi-year,
              multi-strategy fund event dataset—a structural advantage that open-source or new-entrant AI cannot
              replicate without years of equivalent operational data. Fifth, brand and institutional trust: consecutive
              PE Wire IR Tech of Year awards and Nasdaq Ventures' strategic investment provide credibility signals that
              reduce GP sales friction. The primary durability risks are: (1) Carta's AI-native fund admin narrative and
              growing PE/VC presence could erode Juniper Square's brand advantage with VC/early-stage PE managers; (2)
              Agora and InvestNext's lower-priced offerings could cap JS's total addressable CRE customer count; (3) AI
              commoditization could dilute JunieAI's data moat if competitor models improve faster than JS's proprietary
              data advantage widens; (4) A mega-acquisition (e.g., SS&C or Broadridge acquiring Carta or a comparable
              PE/VC platform) could instantly create a combined entity with both Juniper Square's breadth and a large
              institutional service bureau's balance sheet. Sacra's analysis identifies lack of niche specialization as
              a competitive risk in the CRE sub-market where more focused vendors are gaining traction.
