  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth deceleration
        - Sustained revenue growth falls below the mid-teens before a new financing or exit process
        - Premium-multiple logic breaks because the price relies on durable compound growth
        - Move to avoid new capital at or above the 2025 mark.
      - - Control failure
        - Material cyber, privacy, AI-governance, or regulatory event tied to investor workflows
        - Trust premium erodes and exit readiness narrative weakens quickly
        - Pause process until root-cause and remediation evidence is reviewed.
      - - Customer concentration
        - One of the largest PE or VC customers churns or concentration worsens materially
        - Weakens switching-cost narrative and raises revenue quality concerns
        - Re-cut scenarios with lower NRR and higher sales friction.
      - - Service or admin execution slippage
        - Fund-administration quality or implementation capacity becomes the bottleneck
        - Mixed SaaS-services model becomes a margin and reputation drag
        - Underwrite lower multiple and higher working-capital risk.
      - - Financing reset
        - Next round clears at or below the 2025 price without a justified broader market shock
        - Signals either multiple compression or weaker operating quality than the 2025 round implied
        - Treat as thesis break unless new diligence fully explains the reset.
    notes: Triggers are monitorable events intended to convert qualitative concern into explicit investment discipline.
    claimRefs:
      - CV017
      - CV018
      - CV025
      - CV026
      - CV040
      - CV044
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Gross margin and software-services mix
        - Audited breakdown of software gross margin versus administration-services margin
        - >-
          Determines whether the current multiple is being applied to a high-quality software stream or a more blended
          service model
        - CFO data room and quality-of-revenue review.
      - - Retention and cohort economics
        - Net revenue retention, gross retention, churn, and multi-product attach by cohort
        - Core to proving that switching costs translate into durable expansion economics
        - Revenue-operations export plus customer cohort review.
      - - Cap table and preferences
        - Liquidation preferences, participation rights, option pool refresh, and founder-investor control rights
        - Preference overhang can materially impair realized return from a future entry
        - Legal diligence on financing docs and current cap table.
      - - Customer concentration
        - Current top-customer revenue mix and segment concentration
        - Sacra's adverse note makes concentration a valuation-relevant downside variable
        - Customer concentration schedule and top-20 account review.
      - - AI monetization and controls
        - Paid adoption, pricing uplift, control inheritance, and auditability for JunieAI or headless workflows
        - AI is central to upside but could also become the fastest route to governance failure
        - Product, security, and design-partner diligence session.
      - - Exit readiness
        - Board reporting package, auditor, KPI discipline, and IPO- or sale-readiness roadmap
        - Needed to judge timing for liquidity rather than only company quality
        - CEO/CFO diligence and governance review.
    notes: These are the minimum diligence workstreams required to move from track toward a higher-conviction price call.
    claimRefs:
      - CV016
      - CV025
      - CV041
      - CV043
      - CV045
