      - number: '4.2'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Juniper Square uses a direct enterprise sales model targeting GP management company COOs, CFOs, and
              founding partners. The sales cycle is typically triggered by a fund launch, an institutional LP
              requirement, or a regulatory examination. Series D proceeds are being deployed partly to expand the
              enterprise sales motion into retail/semi-liquid fund GPs and to accelerate JunieAI customer acquisition.
              The Nasdaq Ventures strategic investment (September 2025) signals intent to build a distribution footprint
              in the secondary market and liquidity infrastructure space—potentially a new GTM channel. Sales efficiency
              proxies from public evidence: (1) G2 review data shows a 17-month average payback period, consistent with
              enterprise SaaS CAC recovery at scale; (2) GetLatka estimates ~150 customers paying an average of ~$928K
              per year (derived from $139.8M ARR / 150 average customers); (3) Sacra estimates average enterprise
              ARR/customer exceeds $700K, consistent with a move upmarket. Note: the total GP count (2,300+) versus the
              customer count estimate (~150) creates an inconsistency— either most of the 2,300 GPs are very small
              (sub-$100K ARR), or GetLatka's customer count understates the actual GP account base. If all 2,300 GPs
              were active paying customers at an average of $18K base, total ARR floor would be ~$41M, far below the
              $140M estimate—suggesting significant enterprise concentration among larger accounts. Juniper Square has
              not disclosed NRR but the 94% fund admin staff retention and fund admin >100% CAGR imply material positive
              revenue expansion, consistent with NRR >110% (estimated).
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Cost Structure, Gross Margins, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Juniper Square's cost structure reflects a hybrid SaaS-plus-services business. The managed fund
              administration team of 200+ employees at a fully-loaded cost of ~$80–100K per year each represents a
              direct cost base of approximately $16–20M. The R&D team of 200+ engineers, primarily in San Francisco, has
              a significantly higher fully-loaded cost—estimated $180–220K per engineer—representing $36–44M in annual
              R&D expense. Total headcount estimates range from 600 to 1,150 employees across sources; at $150K average
              fully-loaded cost (lower bound), total compensation would be $90–173M. This cost range relative to ~$140M
              in ARR implies the company is near breakeven or modestly loss-making, absent non-compensation cost
              efficiencies. No gross margin, EBITDA, or EBIT figures have been publicly disclosed. Gross margin is
              estimated at 55–75% based on the hybrid revenue mix; pure SaaS vertical businesses at similar scale
              typically achieve 75–85% gross margin (Aventis Advisors benchmark), but the managed services component
              with meaningful direct labor cost would reduce blended margin to the lower end of this range. JunieAI and
              platform automation are expected to improve gross margins over time by replacing fund admin labor with
              software agents—this is Juniper Square's stated capital allocation rationale for the Series D. Working
              capital dynamics are favorable for SaaS: annual pre-paid subscriptions generate positive
              days-sales-outstanding dynamics. Capital expenditure is minimal—Juniper Square runs on AWS with no
              on-premise infrastructure capital requirements. The primary capital intensity driver is headcount,
              particularly R&D and the fund administration services team.
