      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Decade-long co-founder continuity with compounding platform depth
            body: >-
              All three co-founders remain active after 12+ years, having built from a 2014 CRE IR startup to a $1.1B
              fund operating system covering PE, VC, CRE, and private credit. This rare founder longevity is compounded
              by a 94% staff retention rate in fund administration—a managed-services business that is hard to rebuild
