  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Juniper Square operates a hybrid revenue model combining two primary streams: (1) SaaS subscriptions—
              annually recurring software licenses covering the LP investor portal, fundraising CRM, fund accounting,
              compliance, and AI modules; and (2) managed fund administration services—a staffed, outsourced fund
              operations engagement where Juniper Square's 200+ person team handles accounting, treasury, investor
              services, and compliance on behalf of GP clients. The SaaS stream recognizes revenue ratably over the
              subscription term (standard ASC 606 treatment). The managed services stream recognizes revenue as services
              are rendered, creating a more linear monthly recognition profile. The base SaaS entry price is
              approximately $18,000 per year (enterprise reported well above $700,000 average ARR per customer per
              Sacra). This wide price distribution reflects a highly segmented buyer base: small emerging GPs start at
              entry price and expand through LP portal add-ons, analytics, compliance modules, and managed
              administration. Revenue mix is not publicly disclosed. Sacra and company materials indicate the fund
              administration managed services arm is the fastest-growing product line (>100% 3-year CAGR), suggesting it
              has grown from a small share of total revenue to potentially 30–50% of ARR equivalent, though exact split
              is unconfirmed. JunieAI agentic modules were launched in 2025 and likely add as a tiered subscription
              premium or per-agent usage billing—the exact pricing model for JunieAI is not publicly disclosed. Revenue
              quality is high: the SaaS layer benefits from annual contracts, and the services layer has 94% staff
              retention and high customer retention implied by the NRR profile discussed below.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
