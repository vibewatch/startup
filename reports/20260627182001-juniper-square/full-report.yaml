      - number: '7.2'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the highest-severity domain because Juniper Square sells into investment
              workflows that increasingly sit under explicit privacy, cybersecurity, books-and-records, and AML
              scrutiny. SEC materials for fiscal 2026 place information security, Regulation S-P, emerging financial
              technology, and anti-money-laundering among the examination priorities that cut across market
              participants, while separate SEC outreach on Regulation S-P focuses firms on operational readiness for the
              2024 amendments and how exam teams will inspect implementation. The FTC simultaneously states that it
              takes law-enforcement action when companies fail to live up to privacy and security promises. For a
              platform that positions itself as fund infrastructure rather than a lightweight point solution, those
              signals mean regulatory expectations can tighten even if Juniper Square itself is not the regulated
              adviser of record. Juniper Square's own privacy policy reinforces that risk surface. It expressly
              distinguishes between circumstances where the company acts as a service provider or data processor and
              circumstances where customer- or portal-specific privacy terms may apply, and it discloses the use of
              third-party hosting, analytics, and security providers plus legal-process disclosure pathways. That helps
              define contractual risk but also shows why diligence must go beyond homepage language into DPAs,
              subprocessor lists, incident obligations, and regulator-response procedures. The broader perimeter is also
              moving internationally and at the state level: GDPR remains the EU baseline for personal-data protection,
              CCPA/CPRA expands California consumer rights, and FinCEN has now delayed the investment-adviser AML rule
              to 2028 rather than removing the compliance problem altogether. The result is a regulatory stack that is
              dynamic rather than settled, making update velocity and evidence of control effectiveness more important
              than any single compliance badge.
