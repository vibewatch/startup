      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >-
              Juniper Square raised its $2M seed round in 2015 from 21 investors after more than 200 meetings, according
              to Alex Robinson's 2024 blog post. The seed was led by AngelList COO Kevin Laws and included Sundeep
              Peechu of Felicis, Nick Shalek of Ribbit Capital, Elliot Geidt of Redpoint, and Darragh O'Flaherty of Blue
              Owl. The company subsequently raised a Series B of approximately $25M in 2018, a Series C of $75M in
              November 2019 at a reported $415M valuation (led by Ribbit Capital), a $133M growth round in February
              2023, and a $130M Series D in June 2025 at a $1.1B valuation. The Series D was led by Ribbit Capital with
              significant strategic investment from Fifth Wall and participation from Redpoint Ventures, HighSage
              Ventures, and Blue Owl Capital. A subsequent strategic investment by Nasdaq Ventures was announced in
              September 2025, with no disclosed amount; this investment adds a data and liquidity partnership with
              Nasdaq focused on secondary-market innovations. Total capital raised across all rounds is estimated at
              approximately $238M by third-party databases, though the Series D Form D filed May 2025 showed $44M in
              proceeds at the time of filing, suggesting a staggered close. The company is incorporated in Delaware and
              has no public disclosures of debt, credit facilities, or secondary sales of LP interests by early
              investors.
