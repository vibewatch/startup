  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definitions
        blocks:
          - type: paragraph
            body: >-
              Juniper Square's serviceable market is private markets general partner (GP) operations technology—software
              and embedded managed services that help GPs manage the full fund lifecycle from fundraising through final
              distribution. This is distinct from several adjacent categories: (1) the broader asset management software
              market, which includes mutual funds and ETFs; (2) fund administration services provided by banks,
              accountants, and traditional service providers without integrated software; (3) LP-side portfolio
              monitoring platforms; and (4) capital markets infrastructure and trading systems. Within the private
              markets GP technology stack, Juniper Square targets the investor relations layer (fundraising CRM, LP
              portal, capital call and distribution management), the fund accounting and administration layer (GL,
              waterfall, PCAP, treasury), and the compliance layer (AML/KYC, reporting, audit logging). The company also
              serves as a fund administration provider in the managed services sense—the 200+ person administration team
              handles many functions outsourced from GP customers, blurring the boundary between software vendor and
              service provider. Status-quo substitutes include manual spreadsheet workflows, generic CRM tools
              (Salesforce, HubSpot), traditional fund accounting systems like Yardi and QuickBooks, and pure-play
              outsourced fund administrators such as SS&C or Citco that may not offer integrated LP portals. The total
              addressable market spans all private equity, venture capital, commercial real estate, private credit, and
              real asset fund managers globally—roughly 100,000+ active GP entities—though the practical serviceable
              market is concentrated among the estimated 25,000–30,000 fund managers with the budget and sophistication
              for enterprise software.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: Market Sizing and TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Private markets AUM stood at approximately $25 trillion in early 2025 and is on pace to more than double
              to $60 trillion by 2032, according to a Bain & Company analysis cited in Juniper Square's Rise of the
              Retail Investor report in collaboration with PitchBook. Preqin's Future of Alternatives 2029 forecasts
              private equity AUM alone to exceed $11.97 trillion by 2029. The global fund administration software market
              is estimated at approximately $8.7 billion in 2025 with a projected CAGR of 9.8% to reach ~$18.9 billion
              by 2034. The private equity software sub-segment is estimated at $2.4 billion in 2025 growing at ~11% CAGR
              to $5.1 billion by 2032. These figures represent the broad software TAM; the practical SAM for Juniper
              Square is the subset of GP-facing SaaS and managed services spend, estimated at $2–3 billion globally in
              2026. Juniper Square's implied SOM—based on ~$140M in estimated 2025 ARR against a $2–3B GP-focused
              segment—suggests approximately 5–7% penetration of the near-term serviceable market, reflecting meaningful
              scale but also substantial headroom. The retail investor wave could expand the SAM materially: Juniper
              Square's own analysis estimates $7 trillion in net new retail capital could flow into private markets,
              forcing GPs to upgrade their investor operations infrastructure at scale. PwC estimates a 5% allocation to
              private markets in US defined contribution assets alone would equal $1 trillion in new AUM by 2030. These
              macro tailwinds expand the per-GP budget for technology and operations, directly enlarging the addressable
              spend pool.
            claimRefs:
              - CM006
              - CM007
