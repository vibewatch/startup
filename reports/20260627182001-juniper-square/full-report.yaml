      - number: '8.4'
        title: Comparable Set & Multiple Analysis
        blocks:
          - type: paragraph
            body: >-
              Public comparables are directionally useful but imperfect because Juniper Square blends vertical software,
              workflow infrastructure, and services. The best private-market ceiling reference in this source pack is
              iCapital, which serves adjacent alternative-asset-manager workflows and was reported at a valuation above
              $6 billion in 2023. Salesforce is the clearest public-market anchor for how large software platforms can
              trade once growth matures; at roughly $129.7 billion of market cap against $41.5 billion of FY2026
              revenue, it implies a much lower revenue multiple than Juniper Square's private round. Category peers such
              as Dynamo, Yardi Investment Suite, and Allvue show that sponsor-backed and workflow-heavy alternatives
              software remains strategically valuable even when public valuation disclosure is sparse. That is the key
              comparable insight: Juniper Square's price can be defended only if it continues to behave more like a
              scarce category leader with sticky enterprise workflows than like a conventional administrator or a
              slower-growing horizontal SaaS asset.
            claimRefs:
              - CV028
              - CV029
