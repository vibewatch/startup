  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Juniper Square
        - 2025 ARR estimate of ~$139.8M
        - $1.1B post-money Series D; ~7.9x ARR implied
        - Direct pricing anchor for the subject company
        - Private estimate rather than audited ARR and no public margin profile.
      - - iCapital
        - Adjacent private-markets fintech platform for asset managers
