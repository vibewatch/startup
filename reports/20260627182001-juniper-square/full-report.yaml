      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Public evidence supports following Juniper Square closely, but not paying up without deeper access to
              margin, retention, and cap-table terms.
            calloutType: recommendation
            claimRefs:
