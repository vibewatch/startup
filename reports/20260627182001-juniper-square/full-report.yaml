            title: Headless GPX improves moat potential but widens the control surface
            body: >-
              Opening GPX to Claude, Copilot, ChatGPT, and other MCP-compatible clients can deepen customer embedment,
              but it also moves model behavior, permissions inheritance, and API discipline into the core trust
              boundary. AI is therefore both a growth lever and a residual-risk multiplier.
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
              - CR020
              - CR040
          - type: callout
            title: Private diligence must focus on outcome evidence, not only architecture claims
            body: >-
              Before underwriting a private round or secondary position, investors should demand legal-history checks,
              incident history, customer concentration data, churn/implementation metrics, DPA and subprocessor detail,
              and margin/burn/runway visibility. Those items are the main blockers to shrinking residual exposure from
              medium-high to medium.
            calloutType: recommendation
            claimRefs:
              - CR014
              - CR028
              - CR036
              - CR037
              - CR041
              - CR042
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis & Context
        blocks:
          - type: paragraph
            body: >-
              The investable part of Juniper Square's story is not simply that private markets remain a large and
              growing software category. It is that the company appears to sit close to the operating system of record
              for general partners that need fundraising, investor operations, administration, treasury, and compliance
              workflows to stay synchronized. The thesis is supported by strong workflow breadth, reported enterprise
              account depth, customer proof across venture capital, private equity, and real estate, and category
              tailwinds from rising alternatives AUM. Sacra's adverse framing matters, though: the same research that
              highlights high switching costs also flags customer concentration, regulatory complexity, and competitive
              pressure from incumbent fund administrators integrating software. Those caveats are why this chapter
              treats Juniper Square as a credible premium asset but not an obvious at-any-price compounder. A strong
              business can still be a weak investment if the entry valuation already assumes sustained growth, clean
              execution in AI, and no material compliance or service-delivery setbacks.
            claimRefs:
              - CV010
              - CV013
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV024
          - type: table
            tableRef: TV002
