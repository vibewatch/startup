  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation range
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          2025 ARR compounds at roughly 30 to 35 percent through the next financing window with AI and administration
          cross-sell supporting better mix and stronger enterprise expansion
        - $2.3B-$3.2B
        - JunieAI monetization and enterprise attach rates clearly accelerate while governance remains clean
        - Any sign that AI usage is broad but non-monetized or that service delivery constrains implementation.
      - - Base
        - >-
          Growth moderates into the 20 to 25 percent range and the market values Juniper Square as a premium vertical
          platform but not a scarcity asset
        - $1.2B-$1.8B
        - Customer depth stays healthy and no major control or concentration issue emerges
        - Public comps stay compressed and margin disclosure remains limited.
      - - Bear
        - >-
          Growth slows toward 10 to 15 percent because regulation, competition, or customer concentration weakens
          expansion and buyers pay less for private software opacity
        - $0.6B-$0.9B
        - Down-round or flat-round logic becomes credible if public markets remain disciplined
        - Net retention, margin, or control evidence disappoints before the next liquidity event.
    notes: >-
      Ranges are scenario outputs rather than direct market quotes and are anchored on the 2025 ARR estimate,
      private-market financing context, and public-comparable compression risk.
