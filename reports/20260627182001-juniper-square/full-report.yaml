              Juniper Square's capital position reflects a Series D close in June 2025 ($130M, Ribbit lead) plus a
              Nasdaq Ventures strategic investment in September 2025 (undisclosed amount) plus a December 2025
              debt/general financing round (undisclosed amount). Total funding raised is reported at $320.5M by Premier
