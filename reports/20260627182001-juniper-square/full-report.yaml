      - number: '1.5'
        title: Milestones, Regulatory Context, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Juniper Square's milestone arc runs from a 2014 founding focused on commercial real estate investor
              relations through successive platform expansions, geographic growth, and product launches. The company
              underwent cost rationalization during the 2022–2023 ZIRP unwind, cutting early-stage investments in
              LP-side data tools and private placement services while refocusing on its core GP-facing software and fund
              administration businesses. Luxembourg operations were launched in May 2025, unlocking cross-border fund
              administration. The company's 12-year operating history, strong retention metrics, and continuous
              co-founder presence reduce operational risk. On the adverse side, the Agora competitor comparison
              page—authored by a direct rival—explicitly characterizes Juniper Square pricing as expensive relative to
              alternatives, notes that core investor-facing tools (LP portal, reporting, analytics) are add-ons rather
              than included in the base price, and highlights limited out-of-the-box integrations compared to
              competitors offering 5,000+ prebuilt connectors. An InvestNext customer testimonial explicitly describes
              switching from Juniper Square to InvestNext for a more streamlined experience, citing cost-effectiveness
              and better support. Regulatory headwinds from the Juniper Square Private Markets Regulatory Council
              (January 2026) include SEC exam priorities focused on AI, cybersecurity (Reg SP), valuations, fees, and
              conflicts of interest. The FinCEN Investment Adviser AML Rule (effective date pushed to January 2028) may
              increase GP compliance costs managed through or in partnership with Juniper Square's administration
              services.
