              - CV042
      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario framing is more useful than false precision because Juniper Square is private and does not
              publish the operating detail that would justify a single-point target price. The bull case assumes JunieAI
              and the broader GPX control plane convert into higher seat depth, stronger administration attachment, and
              continued premium pricing on large enterprise accounts, allowing revenue to compound above 30% with only
              modest multiple compression. The base case assumes durable but slowing growth, continued category
              relevance, and a public-market-informed multiple band closer to mature software peers than to peak private
              round exuberance. The bear case assumes regulation, implementation complexity, or competitive encroachment
              reduce growth into the low teens, at which point a 2025-era private multiple could compress sharply. The
              practical takeaway is that downside is driven less by current business collapse than by a mismatch between
              limited disclosure and the growth/margin durability needed to defend the 2025 mark through the next
              financing or exit window.
            claimRefs:
              - CV006
