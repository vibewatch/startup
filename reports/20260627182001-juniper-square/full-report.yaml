            body: >-
              The company is led by its three co-founders, all of whom remain actively employed after more than a
              decade. Alex Robinson serves as CEO and sits on the board of directors. Yonas Fisseha serves as CTO and is
              also a board director. Adam Ginsburg is the third co-founder and board member. Eric Jenny serves as Chief
