              is stated as: (1) accelerating JunieAI development and agentic platform expansion; (2) expanding the
              retail and semi-liquid fund GP market; (3) international growth (Luxembourg fund administration launched
              May 2025). Implied cash runway is at least 24 months from the Series D close, assuming the business is
              operating near breakeven or modestly negative. The debt financing in December 2025 likely provides a
