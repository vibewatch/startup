    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Product
        blocks:
          - type: paragraph
            body: >-
              Juniper Square, Inc. is a private financial technology company headquartered at 555 Montgomery Street,
              Suite 1400, San Francisco, California 94111. It was incorporated in Delaware. The company was founded in
              2014 with the stated mission of making private markets more efficient, transparent, and broadly accessible
              by digitizing the equity partnerships between general partners (GPs) and limited partners (LPs). The
              founders initially targeted commercial real estate investor-relations software before expanding their
              system-of-record ambitions across all private markets verticals including private equity, venture capital,
              private credit, and real assets. The platform is described as a "fund operating system" that unifies
              fundraising, investor relations, fund accounting, treasury, compliance, and business intelligence in a
              single source of truth. As of mid-2026, the headline product includes JunieAI—a model-agnostic, agentic AI
              platform launched with Series D capital that provides private-markets-native agents for investor
              relations, fund administration, portfolio management, and investment decision support. The company also
              offers an MCP-compatible headless data interface so GP data is accessible to Claude, Microsoft Copilot,
              ChatGPT, and other AI clients using the same permissions and audit trail as the core platform. Juniper
              Square has operated for over a decade, positioning itself as a first-mover in connected fund
              infrastructure for private markets.
