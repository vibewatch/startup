  topStrengths:
    - Juniper Square 已有实质平台规模，覆盖 2,300+ 个 GP 账户、750,000+ 个 LP 账户，平台上约有 $1 trillion LP 资本。
    - 公司把募资、投资人运营、基金行政和资金管理装进同一套记录系统，工作流粘性看起来很高。
    - JunieAI、Luxembourg 扩张，以及与 Nasdaq 的数据 / 流动性合作，为 2025 年 Series D 之后提供了可信的产品和市场扩张催化剂。
  topRisks:
    - 公开投资人仍拿不到经审计 ARR、毛利率、烧钱速度、NRR 和优先股堆叠披露，承保信心受限。
    - 约 7.9x ARR 的隐含倍数已经假设公司能持续高质量增长；如果 JunieAI 采用或企业级增购不及预期，倍数可能压缩。
    - AppFolio、Yardi、InvestNext、Agora、iCapital、Carta 和其他私募市场平台的竞争，可能挤压定价、实施周期和扩张。
  unresolvedGaps:
    - 经审计 ARR、毛利率、净收入留存和自由现金流披露没有公开。
