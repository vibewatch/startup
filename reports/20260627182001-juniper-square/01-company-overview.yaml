company:
  name: Juniper Square

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Juniper Square is a San Francisco-based private markets technology company founded in 2014 by Alex Robinson, Yonas Fisseha,
    and Adam Ginsburg. The company operates a hybrid SaaS-plus-managed-services fund operating system for private markets GPs,
    serving 2,300+ GPs and 750,000+ LPs with $1 trillion in LP equity. Following a $130M Series D in June 2025 at a $1.1B
    valuation, the company is investing in JunieAI—an enterprise agentic AI platform purpose-built for private markets.

sections:
  - id: identity-product
    title: Identity, Headquarters, and Product
    body: >-
      Juniper Square, Inc. is a private financial technology company headquartered at 555 Montgomery Street, Suite 1400, San
      Francisco, California 94111. It was incorporated in Delaware. The company was founded in 2014 with the stated mission
      of making private markets more efficient, transparent, and broadly accessible by digitizing the equity partnerships
      between general partners (GPs) and limited partners (LPs). The founders initially targeted commercial real estate
      investor-relations software before expanding their system-of-record ambitions across all private markets verticals
      including private equity, venture capital, private credit, and real assets. The platform is described as a "fund
      operating system" that unifies fundraising, investor relations, fund accounting, treasury, compliance, and business
      intelligence in a single source of truth. As of mid-2026, the headline product includes JunieAI—a model-agnostic,
      agentic AI platform launched with Series D capital that provides private-markets-native agents for investor relations,
      fund administration, portfolio management, and investment decision support. The company also offers an MCP-compatible
      headless data interface so GP data is accessible to Claude, Microsoft Copilot, ChatGPT, and other AI clients using the
      same permissions and audit trail as the core platform. Juniper Square has operated for over a decade, positioning
      itself as a first-mover in connected fund infrastructure for private markets.
    claimRefs: [CO001, CO002, CO003, CO005, CO026, CO036]
    tableRefs: [TO001]

  - id: leadership-governance
    title: Leadership, Founders, and Governance
    body: >-
      The company is led by its three co-founders, all of whom remain actively employed after more than a decade. Alex
      Robinson serves as CEO and sits on the board of directors. Yonas Fisseha serves as CTO and is also a board director.
      Adam Ginsburg is the third co-founder and board member. Eric Jenny serves as Chief Financial Officer; his name
      appears on the 2025 SEC Form D as a company officer. The Form D also lists Elliot Geidt (Redpoint Ventures, Woodside
      CA) and Nick Shalek (Ribbit Capital, Palo Alto CA) as principals, consistent with their publicly known board-observer
      or board-director roles arising from their fund's participation in multiple rounds. Leadership continuity is a
      stated strength—all three founders were still at the company on its 10-year anniversary in 2024. The company has
      disclosed a 200-person R&D team and a fund administration staff with a 94% annualized retention rate. No material
      senior leadership departures have been publicly reported as of the research date. Key-person dependence on Alex
      Robinson as the public face, CEO, and co-founder is a diligence consideration given his role in all fundraising
      and major customer relationships over the company's life.
    claimRefs: [CO002, CO003, CO004, CO018, CO043, CO022, CO032, CO036, CO044]
    tableRefs: [TO002]

  - id: funding-investors
    title: Funding History, Valuation, and Investors
    body: >-
      Juniper Square raised its $2M seed round in 2015 from 21 investors after more than 200 meetings, according to
      Alex Robinson's 2024 blog post. The seed was led by AngelList COO Kevin Laws and included Sundeep Peechu of Felicis,
      Nick Shalek of Ribbit Capital, Elliot Geidt of Redpoint, and Darragh O'Flaherty of Blue Owl. The company subsequently
      raised a Series B of approximately $25M in 2018, a Series C of $75M in November 2019 at a reported $415M valuation
      (led by Ribbit Capital), a $133M growth round in February 2023, and a $130M Series D in June 2025 at a $1.1B valuation.
      The Series D was led by Ribbit Capital with significant strategic investment from Fifth Wall and participation from
      Redpoint Ventures, HighSage Ventures, and Blue Owl Capital. A subsequent strategic investment by Nasdaq Ventures was
      announced in September 2025, with no disclosed amount; this investment adds a data and liquidity partnership with
      Nasdaq focused on secondary-market innovations. Total capital raised across all rounds is estimated at approximately
      $238M by third-party databases, though the Series D Form D filed May 2025 showed $44M in proceeds at the time of
      filing, suggesting a staggered close. The company is incorporated in Delaware and has no public disclosures of debt,
      credit facilities, or secondary sales of LP interests by early investors.
    claimRefs: [CO006, CO007, CO008, CO009, CO020, CO028, CO029, CO030, CO031, CO038]
    tableRefs: [TO003]
    figureRefs: [FO001]

  - id: scale-metrics
    title: Scale, Traction, and Cover Metrics
    body: >-
      As of mid-2026 the platform serves more than 2,300 GPs, 750,000+ LP accounts, 45,000+ investment entities, and
      approximately $1 trillion in LP equity under management. The homepage as of the research date confirms 2,300+
      GPs, 750,000+ investor accounts, and 45,000+ investment entities. An earlier data point from the June 2025 Series D
      press release reported 2,000+ GPs, 600,000+ LP accounts, and 40,000+ funds—indicating meaningful growth in the
      twelve months since. Revenue (ARR) is estimated by GetLatka at $139.8M for 2025, up from $108.2M in 2024,
      representing approximately 29% year-over-year growth. The three-year CAGR in the fund administration business
      exceeds 100% per company disclosure. Headcount is estimated at 1,000–1,150 employees as of end-2025. Revenue per
      enterprise customer is cited by Sacra at over $700,000 annually. Gross margin, EBITDA, and burn rate have not been
      publicly disclosed; these are material private-metric gaps. The Latka figure is an industry estimate based on reported
      ARR conversations, not an audited figure. Pricing starts at approximately $18,000 per year for the base tier, scaling
      to enterprise-level six-figure contracts.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO023, CO039, CO040]
    figureRefs: [FO003]

  - id: milestones-adverse
    title: Milestones, Regulatory Context, and Adverse Evidence
    body: >-
      Juniper Square's milestone arc runs from a 2014 founding focused on commercial real estate investor relations
      through successive platform expansions, geographic growth, and product launches. The company underwent cost
      rationalization during the 2022–2023 ZIRP unwind, cutting early-stage investments in LP-side data tools and
      private placement services while refocusing on its core GP-facing software and fund administration businesses.
      Luxembourg operations were launched in May 2025, unlocking cross-border fund administration. The company's
      12-year operating history, strong retention metrics, and continuous co-founder presence reduce operational risk.
      On the adverse side, the Agora competitor comparison page—authored by a direct rival—explicitly characterizes
      Juniper Square pricing as expensive relative to alternatives, notes that core investor-facing tools (LP portal,
      reporting, analytics) are add-ons rather than included in the base price, and highlights limited out-of-the-box
      integrations compared to competitors offering 5,000+ prebuilt connectors. An InvestNext customer testimonial
      explicitly describes switching from Juniper Square to InvestNext for a more streamlined experience, citing
      cost-effectiveness and better support. Regulatory headwinds from the Juniper Square Private Markets Regulatory
      Council (January 2026) include SEC exam priorities focused on AI, cybersecurity (Reg SP), valuations, fees,
      and conflicts of interest. The FinCEN Investment Adviser AML Rule (effective date pushed to January 2028) may
      increase GP compliance costs managed through or in partnership with Juniper Square's administration services.
    claimRefs: [CO019, CO021, CO024, CO025, CO033, CO034, CO035, CO041, CO042]
    tableRefs: [TO004]
    figureRefs: [FO002]

