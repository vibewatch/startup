callouts:
  - calloutType: strength
    title: Decade-long co-founder continuity with compounding platform depth
    body: >-
      All three co-founders remain active after 12+ years, having built from a 2014 CRE IR startup to a $1.1B
      fund operating system covering PE, VC, CRE, and private credit. This rare founder longevity is compounded
      by a 94% staff retention rate in fund administration—a managed-services business that is hard to rebuild
      once trust is established with complex GP clients.
    claimRefs: [CO032, CO036]

  - calloutType: risk
    title: Adverse pricing and integration criticism from direct competitors
    body: >-
      Competitor Agora's published comparison and at least one InvestNext customer testimonial highlight Juniper
      Square's pricing complexity (add-ons required for LP portal, reporting, analytics), limited pre-built
      integrations versus alternatives, and higher total cost of ownership for smaller CRE-focused sponsors.
      While these sources are competitor-authored, they surface genuine buyer objections that may limit adoption
      in the sub-$250M AUM segment.
    claimRefs: [CO033, CO034]

  - calloutType: insight
    title: Series D and Nasdaq partnership signal AI-era platform repositioning
    body: >-
      The $130M Series D (June 2025), the Nasdaq Ventures strategic investment (September 2025), and the
      JunieAI product suite reflect a coordinated pivot from workflow SaaS to an AI-native fund operating
      system with data and liquidity adjacencies. This positions Juniper Square for expansion into secondaries,
      retail distribution, and cross-border operations—but also requires the company to execute on AI
      differentiation against well-capitalized incumbents.
    claimRefs: [CO006, CO020, CO026]

