callouts:
  - calloutType: insight
    title: Retail democratization is a structural demand driver for GP operations infrastructure
    body: >-
      The convergence of regulatory reform (SEC accredited investor expansion, ELTIF 2.0), new fund vehicles
      (interval funds, semi-liquid structures), and retail capital demand creates a multi-year tailwind for
      GP operations platforms. GPs adding retail share classes must upgrade investor onboarding, compliance
      documentation, and LP communications infrastructure—exactly where Juniper Square has its deepest moat.
    claimRefs: [CM021, CM022, CM023]

  - calloutType: risk
    title: Market sizing evidence is structurally weak and partly self-promotional
    body: >-
      The most-cited market sizes for the GP software SAM come from low-reputation publishers (DataIntelo) or
      from Juniper Square's own commissioned report with PitchBook. No tier-one analyst firm (Gartner, Forrester,
      IDC) has published a GP-specific fund operations software market-share analysis. Investors should apply
      wide uncertainty bands to all TAM/SAM/SOM figures presented in this chapter.
    claimRefs: [CM029, CM030]

  - calloutType: assumption
    title: SAM penetration assumes JS is the market leader in GP fund operating systems
    body: >-
      The ~5–7% SAM penetration implied by Juniper Square's ARR relative to the fund admin software market
      assumes JS is competing for the full private fund GP software dollar. In practice, the software and
      managed services markets overlap imperfectly. If the effective SAM for Juniper Square is narrower (e.g.,
      PE/VC/CRE only, not institutional hedge funds), penetration rates are higher. If broader (all alternative
      asset managers), they are lower. This ambiguity is an unresolved evidence gap.
    claimRefs: [CM031, CM032]

