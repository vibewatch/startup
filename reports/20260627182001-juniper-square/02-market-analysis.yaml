          value: 60000
          description: >-
            Bain / PitchBook project private markets AUM to more than double from ~$25T today to $60T by 2032,
            driven by retail democratization, LP diversification, and global capital flows.
        - label: "Global PE + VC + CRE + private credit AUM (2026 est.)"
          value: 25000
          description: >-
            Current private markets AUM estimated at ~$25T across PE, VC, real assets, private credit, and
            infrastructure globally, representing the GP ecosystem that needs fund operations technology.
        - label: "Fund administration software TAM (2025)"
          value: 8700
          description: >-
            Global fund administration software market estimated at $8.7B in 2025 by DataIntelo (9.8% CAGR to
            $18.9B by 2034); includes hedge fund, mutual fund, and private fund administration software.
        - label: "GP-focused private fund ops software SAM (2026 est.)"
          value: 2500
          description: >-
            Estimated $2–3B serviceable market for GP-facing private markets software and managed services in
            2026; Juniper Square's ~$140M ARR implies ~5–7% penetration.
    approximationNotes: >-
      All values in USD millions. Pyramid values are not additive; each layer represents a different market lens.
      PE software SAM of $2.5B is analyst consensus midpoint; exact figures vary by source and methodology.
    claimRefs: [CM006, CM007, CM008, CM009, CM010]

