companyProfile:
  summary: "Juniper Square is a San Francisco-based private-markets software company founded in 2014 that combines investor-facing software, fund administration, treasury, compliance, and data workflows in a single operating platform for general partners. The company has expanded beyond its real-estate roots into private equity and venture capital, added Luxembourg-based administration capabilities, launched JunieAI as an agentic workflow layer, and raised a $130 million Series D at a $1.1 billion valuation in June 2025. Public evidence supports the view that Juniper Square has achieved real category scale and strong workflow stickiness, but investors still face meaningful diligence gaps around audited ARR, margins, retention, and capital structure transparency."
