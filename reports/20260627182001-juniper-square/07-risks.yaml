- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security or privacy control failure
    - Public disclosure of breach, regulator inquiry, or major customer incident
    - Any incident showing sensitive investor or fund-operation data was mishandled at scale
    - Pause underwriting until root-cause, customer impact, and remediation evidence are reviewed
  - - Regulatory adaptation slippage
    - Visible gap between new SEC/privacy requirements and Juniper Square support materials or controls
    - Enterprise customers report workaround-heavy compliance processes after major rule changes
    - Downgrade retention and expansion assumptions; require product-readiness evidence
  - - AI-agent governance failure
    - Public or reference-check evidence that agentic workflows produced material errors without effective containment
    - Repeated high-severity workflow mistakes in investor communications, compliance, or accounting
    - Treat AI opening as risk-increasing, not moat-building; haircut growth/valuation
  - - Private-markets demand deterioration
    - Weak fundraising environment or rising customer consolidation slows software budgets
    - Meaningful slowdown in new-logo momentum or elevated customer consolidation among GPs
    - Reassess TAM capture speed and price-to-growth tolerance
  - - Financing flexibility weakens
    - No supportive financing signal while spending remains elevated for platform and compliance expansion
    - Down-round, weak secondary marks, or visible bridge-financing behavior
    - Increase dilution and downside assumptions materially
  - - Legal-history surprise
    - Previously undisclosed litigation, enforcement, or contract dispute emerges in diligence
    - Any material issue that contradicts the clean public record assumption
    - Escalate legal diligence and recast risk rating before proceeding
  notes: These triggers are intentionally observable from outside the company and are designed to translate public-risk themes into investment decisions. They are not statements of Juniper Square policy; they are external underwriting thresholds based on the current evidence set.
