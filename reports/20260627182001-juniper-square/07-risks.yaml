callouts:
- calloutType: risk
  title: 2026 regulation is moving from policy review to evidence-of-effectiveness review
  body: The biggest regulatory risk is not a single new rule; it is that SEC and FTC signals in 2025-2026 increasingly focus on whether controls work in practice. For Juniper Square, that raises the bar from possessing certifications and policies to proving operational execution for data protection, notifications, records, and customer workflows.
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR037
  - CR038
- calloutType: risk
  title: Headless GPX improves moat potential but widens the control surface
  body: Opening GPX to Claude, Copilot, ChatGPT, and other MCP-compatible clients can deepen customer embedment, but it also moves model behavior, permissions inheritance, and API discipline into the core trust boundary. AI is therefore both a growth lever and a residual-risk multiplier.
  claimRefs:
  - CR017
  - CR018
  - CR020
  - CR040
- calloutType: recommendation
  title: Private diligence must focus on outcome evidence, not only architecture claims
  body: Before underwriting a private round or secondary position, investors should demand legal-history checks, incident history, customer concentration data, churn/implementation metrics, DPA and subprocessor detail, and margin/burn/runway visibility. Those items are the main blockers to shrinking residual exposure from medium-high to medium.
  claimRefs:
  - CR014
  - CR028
  - CR036
  - CR037
  - CR041
  - CR042
