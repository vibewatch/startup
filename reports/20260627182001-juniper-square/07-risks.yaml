  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-history
    missingEvidence: Court, arbitration, insurance, and regulator-correspondence records showing whether Juniper Square has faced any non-public disputes, investigations, or material incidents.
    whyItMatters: Public-source silence is not proof of a clean legal or incident history for a private infrastructure provider handling sensitive investor workflows.
    diligencePath: Run litigation and lien checks, request outside-counsel summary, and review any material claims notices or regulator correspondence under NDA.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Cohort churn, NRR, top-customer exposure, pipeline conversion, and implementation-duration data segmented by customer type.
    whyItMatters: Public reviews and market framing suggest concentration and onboarding risk, but the magnitude of revenue exposure cannot be judged externally.
    diligencePath: Request customer concentration table, cohort retention metrics, and implementation KPI dashboards; validate with customer references.
    relatedQuestionRefs:
    - QR017
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Board-approved budget, current cash balance, burn, margin, runway, and downside operating plan.
    whyItMatters: Public funding and valuation data do not show whether Juniper Square can self-fund compliance and AI expansion or needs near-term capital.
    diligencePath: Obtain management financial package, board materials, and scenario model showing spend by security, compliance, product, and go-to-market.
    relatedQuestionRefs:
    - QR021
  - type: private-evidence-only
    severity: material
    topic: people-execution
    missingEvidence: Leadership depth, succession planning, security staffing, implementation-team capacity, and AI governance ownership structure.
    whyItMatters: Public materials are founder-led and cross-functional, so execution durability depends on team depth that is not externally visible.
    diligencePath: Request org chart, key-function resumes, attrition data, and accountability matrix for AI, security, compliance, and customer success.
    relatedQuestionRefs:
    - QR025
