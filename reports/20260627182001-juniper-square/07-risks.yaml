- id: cybersecurity-data-privacy-and-operational-risk
  title: Cybersecurity, Data Privacy, and Operational Risk
  body: Operational risk is unusually intertwined with cybersecurity and privacy because Juniper Square publicly markets a unified operating layer for subscriptions, AML/KYC, capital activity, reporting, permissions, and AI-enabled workflows. The company discloses meaningful safeguards—annual SOC 1 Type 2 and SOC 2 Type 2 assessments, routine third-party penetration testing, encryption, SSO, IP restrictions, 2FA, role-based permissions, and audit logging—and those controls clearly reduce baseline operational risk. But they do not remove residual exposure because the public record provides almost no outcome-level evidence on incident rates, customer-side control testing, model-governance errors, or post-incident response execution. FTC and SEC materials both stress enforcement and examination around what happens when sensitive customer information is actually put at risk, not just whether controls are described on a website. The 2026 Headless GPX launch increases the operating-risk surface
    further. Juniper Square now explicitly offers GPX capabilities to Claude, Copilot, ChatGPT, and any MCP-compatible client while promising inherited permissions and audit trails. Strategically, that strengthens product relevance. Risk-wise, it means prompt design, API versioning, permissions inheritance, and workflow orchestration become part of the company's trust boundary. An AI agent that produces inaccurate investor communications, misclassifies AML/KYC status, or acts on stale permissions can create a high-severity customer event even if the core database remains intact. Because GPX spans core operational records, outages or control errors can transmit quickly into financial operations and client trust. The transmission map in FR002 shows that a product-control gap or security event can become a retention and valuation problem with relatively few intermediate steps.
  claimRefs:
