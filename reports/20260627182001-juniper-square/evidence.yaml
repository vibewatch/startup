    whyItMatters: >-
      Carta's expansion trajectory in PE/VC fund admin is the largest near-term competitive risk; without roadmap data
      the threat cannot be quantified
    diligencePath: >-
      Obtain Carta's current fund admin product capabilities through a demo, reference checks with shared customers, or
      industry analyst briefing
    relatedQuestionRefs:
