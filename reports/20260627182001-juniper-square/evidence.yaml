    severity: moderate
    topic: competitor-pricing
    missingEvidence: >-
      Publicly verified pricing for Carta fund admin, Dynamo Software, and SS&C private markets; only Agora has a
      disclosed base price
    whyItMatters: >-
      Pricing comparison is a primary GP decision criterion; without verified competitor pricing, pricing strategy
      analysis is incomplete
    diligencePath: Reference customer calls with GPs who have evaluated Carta, Dynamo, or SS&C alongside Juniper Square
    relatedQuestionRefs:
