evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Gross margin, EBITDA, operating burn rate, and unit economics for the software and services segments
    whyItMatters: >-
      Without margin and burn data it is impossible to assess path to profitability or capital adequacy without a direct
      data room
    diligencePath: Request audited financials or management accounts directly from Juniper Square in a formal due diligence process
    relatedQuestionRefs:
      - QO027
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Full cap table, founder vesting schedules, investor liquidation preferences, and anti-dilution provisions
    whyItMatters: Ownership structure and liquidation waterfall directly affect return profile for any new or existing investor
    diligencePath: Obtain capitalization table and investor rights agreements from legal counsel
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: minor
    topic: adverse-history
    missingEvidence: >-
      Full list of any data breaches, customer lawsuits, or regulatory enforcement actions involving Juniper Square or
      its fund administration clients
    whyItMatters: >-
      Fund administration for $1T in LP equity creates significant fiduciary and regulatory exposure; adverse events
      could be material
    diligencePath: Search PACER, state court records, and SEC enforcement actions; conduct vendor due diligence interviews
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: leadership-governance
    missingEvidence: Formal board composition, committee structure, and governance charter details beyond publicly named principals
    whyItMatters: Board composition and governance quality affects decision speed, founder control, and investor protection
    diligencePath: Review Delaware certificate of incorporation, shareholder agreements, and board minutes in data room
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: Current 2026 employee count and breakdown by function (engineering, sales, administration services, operations)
    whyItMatters: Headcount by function clarifies operating leverage in the hybrid SaaS+services model
    diligencePath: Request workforce census from HR or management; cross-check LinkedIn total count
    relatedQuestionRefs:
      - QO010
      - QO028
  - type: missing-source
    severity: material
    topic: tam-software
    missingEvidence: >-
      Tier-one analyst (Gartner, Forrester, IDC, Greenhill) market-share study specifically for GP fund operations
      software vendors
    whyItMatters: >-
      Without independent market-share data, it is impossible to verify Juniper Square's claimed market leadership or
      precisely size the serviceable opportunity
    diligencePath: Commission or source a private-markets GP technology market-share analysis from a tier-one research provider
    relatedQuestionRefs:
      - QM025
      - QM001
  - type: missing-source
    severity: material
    topic: buyer-segments
    missingEvidence: Breakdown of Juniper Square's 2,300+ GP customers by AUM tier, strategy (PE vs VC vs CRE vs PC), and geography
    whyItMatters: Customer concentration by segment affects growth durability and vulnerability to segment-specific slowdowns
    diligencePath: Request customer cohort analysis from Juniper Square in a formal data room process
    relatedQuestionRefs:
      - QM027
  - type: conflicting-data
    severity: minor
    topic: aum-growth
    missingEvidence: >-
      Reconciliation of Bain's $60T 2032 forecast (optimistic) against Bain's own 2026 PE Outlook (shows fundraising
      dragged and distributions below 15% of NAV)
    whyItMatters: Contradictory signals from the same publisher reduce confidence in the trajectory used to size the opportunity
    diligencePath: Obtain Bain's complete 2026 Global Private Equity Report for methodology reconciliation
    relatedQuestionRefs:
      - QM011
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segments
    missingEvidence: >-
      Complete list of GP software vendors and their respective customer counts to verify Juniper Square's market share
      claims; no evidence confirming JS market share in private credit GP segment
    whyItMatters: >-
      Without competitive market share data, the 5–7% SAM penetration estimate is model-dependent; private credit is a
      major growth segment
    diligencePath: >-
      Cross-reference competitor investor pages, Tracxn, and press releases for competitor customer counts; ask JS for
      private credit customer breakdown
    relatedQuestionRefs:
      - QM014
      - QM018
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitor-market-share
    missingEvidence: >-
      Independent market-share study for GP fund operations software vendors with customer counts for Carta, Agora,
      InvestNext, AppFolio vs. Juniper Square
    whyItMatters: >-
      Without independent market share data, Juniper Square's claim of market leadership rests entirely on self-reported
      metrics; diligence cannot verify competitive position
    diligencePath: >-
      Commission or source a private-markets GP technology vendor analysis from Tracxn, PitchBook, or a specialist
      research provider
    relatedQuestionRefs:
      - QP008
      - QP018
      - QP025
  - type: missing-source
    severity: material
    topic: carta-roadmap
    missingEvidence: >-
      Carta's specific PE/VC fund administration product roadmap and customer count for funds-under-administration by
