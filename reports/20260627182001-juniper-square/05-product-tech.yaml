callouts:
  - calloutType: strength
    title: "Unified private-markets operating model"
    body: >-
      Juniper Square's biggest product advantage is that fundraising, investor operations, accounting,
      reporting, and AI are all described as running on one private-markets system of record rather than as
      loosely connected point tools.
    claimRefs: [CE001, CE005, CE024]
  - calloutType: risk
    title: "Headless expansion raises governance stakes"
    body: >-
      Headless GPX increases product leverage, but public materials also imply that agent-driven write actions,
      external AI clients, and rising regulatory scrutiny will make permissions, auditability, and change
      control more important than before.
    claimRefs: [CE015, CE036, CE039]
  - calloutType: insight
    title: "Service continuity is part of the product"
    body: >-
      The public product story is not software-only. Juniper Square's 94% annualized staff retention in fund
      administration suggests execution continuity in the human service layer that supports the platform.
    claimRefs: [CE010]

