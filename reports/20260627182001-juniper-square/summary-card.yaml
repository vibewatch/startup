  topStrengths:
    - >-
      Juniper Square has reached meaningful platform scale with 2,300+ GP accounts, 750,000+ LP accounts, and roughly $1
      trillion of LP capital on-platform.
    - >-
      The company appears to benefit from high workflow stickiness because it combines fundraising, investor operations,
      fund administration, and treasury in a system of record.
    - >-
      JunieAI, Luxembourg expansion, and the Nasdaq data/liquidity partnership provide credible product and
      market-expansion catalysts beyond the 2025 Series D.
  topRisks:
    - >-
      Public investors still lack audited ARR, gross margin, burn, NRR, and preference-stack disclosure, limiting
      underwriting confidence.
    - >-
      The implied roughly 7.9x ARR multiple already assumes continued premium growth and could compress if JunieAI
      adoption or enterprise upsell disappoints.
    - >-
      Competition from AppFolio, Yardi, InvestNext, Agora, iCapital, Carta, and other private-markets platforms can
      pressure pricing, implementation cycles, and expansion.
  unresolvedGaps:
    - Audited ARR, gross margin, net revenue retention, and free-cash-flow disclosure are not public.
    - >-
      The post-Series-D capital structure, including debt, liquidation preferences, and the size of the Nasdaq strategic
      investment, is not publicly disclosed.
    - >-
      Public evidence does not confirm current headcount, churn, or customer concentration among the largest GP
      accounts.
