        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 实施学习曲线
            - 私募市场集中度
            - 监管适配滞后
            - 安全 / 隐私信任事件
        - label: 中等可能性
          values:
            - API 版本摩擦
            - 创始人主导执行耦合
            - AI 智能体误执行
            - 核心工作流平台宕机
        - label: 低可能性
          values:
            - Form D / 融资流程问题
            - 公开法律历史意外
            - 战略资本撤出
            - 多司法辖区执法连锁反应
    approximationNotes: 可能性和影响是基于公开证据的分析师判断，不是观测到的内部事件发生率。安全 / 隐私、监管适配和 AI 治理风险被放在右上方，因为平台嵌在敏感基金工作流里，而公开证据对控制措施的证明强于对已验证结果的证明。
