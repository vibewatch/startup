      - number: '1.2'
        title: 管理层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              公司由三位联合创始人领导，三人十多年后仍在公司全职任职。Alex Robinson 担任 CEO，并进入董事会。Yonas Fisseha 担任 CTO，同时也是董事。Adam Ginsburg
              是第三位联合创始人和董事会成员。Eric Jenny 担任首席财务官；他的名字出现在 2025 年 SEC Form D 中，身份为公司高管。Form D 还列出 Elliot Geidt（Redpoint
              Ventures，Woodside CA）和 Nick Shalek（Ribbit Capital，Palo Alto
              CA）为负责人，这与他们因基金参与多轮融资而公开被认知的董事观察员或董事角色一致。管理层连续性是公司自称的优势——2024 年公司 10 周年时，三位创始人仍全部在岗。公司披露有 200
              人研发团队，基金行政管理团队的年化留存率为 94%。截至研究日，尚无重大高管离职被公开报道。Alex Robinson 是公司的公开面孔、CEO
              和联合创始人，贯穿公司生命周期内所有融资和重大客户关系；这种关键人物依赖是尽调必须关注的问题。
