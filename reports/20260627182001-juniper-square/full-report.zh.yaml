        - 可能是用于服务业务营运资本或延长跑道的信贷额度；Premier Alts 确认该轮次
    notes: >-
      早期轮次金额（种子轮、Series B）为估算；SEC Form D 确认 Series D 根据 Rule 506(b) 提交。2025 年 12 月债务融资由 Premier Alternatives
      报道；条款、金额和贷款方尚未确认。按 Premier Alternatives 口径，截至 2025 年 12 月累计融资为 $320.5M（资本效率：3.43x）。
  - id: TI005
    title: 公开财务缺口表
    columns:
      - 指标
      - 是否披露
      - 最佳公开代理指标
      - 来源
      - 尽调优先级
    rows:
      - - 毛利率（%）
        - 否
        - 估计 55–75%（SaaS+服务混合）
        - 分析师估算与 Aventis 基准对照
        - 关键 — 终值的核心驱动因素
      - - EBITDA / EBIT
        - 否
        - 规模化后可能接近盈亏平衡或小幅亏损
        - 由员工数与 ARR 对比推断
        - 关键 — 决定烧钱速度和资本效率
      - - 净收入留存（NRR）
        - 否
        - 估计 >110%（由基金行政 CAGR 推断）
        - 推断
        - 关键 — 首要收入质量信号
      - - 毛收入留存（GRR）
        - 否
        - 无法从公开来源估算
        - None
        - 重要 — 衡量底层流失风险
      - - 按产品板块拆分 ARR
        - 否
        - 基金行政约 30–50%，SaaS 约 50–70%（估计）
        - 分析师根据增长率推断
        - 重要 — 验证收入质量和结构
      - - 客户 ARR 队列分析
        - 否
        - 公开资料未提供
        - None
        - 重要 — 验证 NRR 和上售逻辑
      - - 现金头寸和烧钱速度
        - 否
        - Series D 后估计跑道 24+ 个月
        - 由轮次规模和隐含烧钱推断
        - 重要 — 确定下一次资金需求时间
      - - 按职能拆分员工数
        - 否
        - 总计约 600–1,150；行政 200+、R&D 200+（部分）
        - LinkedIn、公司公告（部分）
        - 中等 — 验证成本结构假设
      - - JunieAI ARR 贡献
        - 否
        - 无法估算；2025 年推出
        - None
        - 重要 — 验证 AI 投资逻辑
      - - 2025 年 12 月债务融资条款
        - 否
        - 金额和契约未披露
        - Premier Alternatives（仅轮次类型）
        - 重要 — 可能包含稀释性认股权证或契约
    notes: 「是否披露」列中的所有「否」都是重大缺口，需要正式数据室访问。估值 $1.1B 的公司没有任何经审计财务报表公开，这并不寻常，也会降低所有第三方 ARR 估算的可信度。
