  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与核心模块
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 不是把产品定义成一个狭窄点工具，而是按客户工作流来讲。官网和解决方案材料把 GPX 描述为一套基金操作系统，陪伴私募市场 GP
              从首次关闭到最终分配；基金行政管理和客户故事页面则显示，公司围绕这套运营模型同时打包软件和基金行政管理服务。落到实际采购，买方买的不是一个门户或一套 CRM
              授权，而是一个共享运营环境：在同一个事实来源上，把募资、数字化认购、投资者关系、报告、资金管理、合规和会计工作流串起来。公开披露的核心模块与 GP 团队的工作方式高度对应：赢得承诺、引导 LP
              入驻、运营基金、沟通业绩，并越来越多地用 AI 自动化内部和面向投资者的任务。平台的规模表述和对统一数据的反复强调，支持一个判断：GPX 定位的是完整 GP 后台的基础设施，而不是叠在外面的附加产品。
