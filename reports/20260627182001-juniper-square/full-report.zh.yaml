              Juniper Square 自称是唯一一个在 PE、VC、CRE 和私募信贷中都有已确认实质存在的 GP 基金
              OS；该主张基于公司披露的客户页面和产品文档，而不是独立市场份额数据。考虑到网络规模，这一主张可信，但应在尽调中参考独立分析师基准进一步验证。
