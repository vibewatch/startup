  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的可服务市场是私募市场 GP 运营技术——帮助 GP
              管理从募资到最终分配的完整基金生命周期的软件和嵌入式托管服务。它不同于几个邻近类别：（1）更广义的资产管理软件市场，覆盖共同基金和
              ETF；（2）银行、会计师和传统服务商提供、但不集成软件的基金行政管理服务；（3）LP 侧组合监控平台；（4）资本市场基础设施和交易系统。在私募市场 GP 技术栈里，Juniper Square
              切入投资人关系层（募资 CRM、LP
              门户、资本催缴和分配管理）、基金会计和行政管理层（GL、waterfall、PCAP、资金管理），以及合规层（AML/KYC、报告、审计日志）。公司也以托管服务意义上的基金行政管理提供商身份服务客户——200+
              人行政管理团队承接了许多 GP 客户外包的职能，模糊了软件供应商与服务商的边界。现状替代方案包括手工电子表格工作流、通用 CRM 工具（Salesforce、HubSpot）、Yardi 和 QuickBooks
              等传统基金会计系统，以及 SS&C 或 Citco 等纯外包基金行政管理机构，这些机构未必提供集成的 LP 门户。总可寻址市场覆盖全球所有私募股权、风险投资、商业地产、私募信贷和实物资产基金管理人——约
              100,000+ 个活跃 GP 实体；但实际可服务市场集中在估计 25,000–30,000 家有预算和复杂度、能采购企业软件的基金管理人。
