            body: >-
              Premier Alternatives 披露 2025 年 12 月完成一轮金额未公开的「Debt -
              General」融资，更像是一家走向成熟的成长型公司取得信贷额度，用来支持托管服务部门的营运资金，或在两轮股权融资之间拉长运营跑道。员工规模较大的 SaaS
              加服务混合型公司常会这样做。条款未披露仍需尽调：重点看是否有契约限制或认股权证覆盖，进而影响股权稀释。
