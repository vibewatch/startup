      - number: '7.3'
        title: 网络安全、数据隐私与运营风险
        blocks:
          - type: paragraph
            body: >-
              运营风险与网络安全和隐私异常交织，因为 Juniper Square 公开营销的是一层统一运营层，覆盖认购、AML/KYC、资本活动、报告、权限和 AI 赋能工作流。公司披露了有意义的防护措施——年度 SOC 1
              Type 2 和 SOC 2 Type 2 评估、定期第三方渗透测试、加密、SSO、IP
              限制、2FA、基于角色的权限和审计日志——这些控制显然降低了基线运营风险。但剩余暴露没有被消除，因为公开记录几乎没有给出事件率、客户侧控制测试、模型治理错误或事后响应执行的结果层证据。FTC 和 SEC
              材料都强调，当敏感客户信息实际处于风险中时，执法和检查关注的是发生了什么，而不只是网站上是否写了控制。2026 年 Headless GPX 发布进一步扩大了运营风险面。Juniper Square 现在明确把
              GPX 能力提供给 Claude、Copilot、ChatGPT 和任何兼容 MCP 的客户端，同时承诺继承权限和审计轨迹。从战略上看，这提升了产品相关性。从风险上看，这意味着提示设计、API
              版本、权限继承和工作流编排都进入公司的信任边界。即便核心数据库完好，一个 AI 代理如果生成不准确的投资者沟通、误分类 AML/KYC 状态，或基于过期权限行动，也可能制造高严重度客户事件。由于 GPX
              覆盖核心运营记录，宕机或控制错误会快速传导到财务运营和客户信任。FR002 的传导图显示，产品控制缺口或安全事件只需相对较少中间环节，就可能演变成留存和估值问题。
