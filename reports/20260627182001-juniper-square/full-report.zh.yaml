        - 重大规则变化后，企业客户报告合规流程重度依赖变通做法。
        - 下调留存和扩张假设；要求产品就绪证据。
      - - AI agent 治理失效
        - 公开或 reference check 证据显示，agentic 工作流产生重大错误且缺乏有效遏制。
        - 投资人沟通、合规或会计中反复出现高严重性工作流错误。
        - 将 AI 开口视为增风险，而非筑壁垒；下调增长 / 估值。
      - - 私募市场需求恶化
        - 融资环境疲弱，或客户整合上升拖慢软件预算。
        - 新 logo 动能显著放缓，或 GP 客户整合明显抬升。
        - 重新评估 TAM 捕获速度和价格 / 增长容忍度。
      - - 融资灵活性转弱
        - 平台与合规扩张开支仍高，却没有支持性融资信号。
        - down round、疲弱二级市场估值标记，或可见的过桥融资行为。
        - 大幅提高稀释和下行情景假设。
      - - 法律历史意外
        - 尽调中出现此前未披露的诉讼、执法或合同争议。
        - 任何实质性问题推翻公开记录清洁这一假设。
        - 继续推进前，升级法律尽调并重估风险评级。
    notes: 这些触发项刻意设计成可从公司外部观察，并把公开风险主题转化为投资决策。它们不是 Juniper Square 的政策声明；而是基于当前证据集的外部承销阈值。
    claimRefs:
