      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景框架比虚假的精确性更有用，因为 Juniper Square 是私有公司，不披露足以支撑单点目标价的运营细节。牛市情景假设 JunieAI 和更广的 GPX
              控制平面转化为更高席位深度、更强行政管理附着，以及大型企业账户的持续溢价定价，使收入以 30%
              以上复合增长，且只出现温和倍数压缩。基准情景假设增长耐久但放缓、品类相关性延续，倍数区间更接近成熟软件同行，而不是私募轮高峰期的亢奋。熊市情景假设监管、实施复杂性或竞争侵蚀把增长压到低双位数，届时 2025
              年时期的私募倍数可能大幅压缩。实际结论是，下行更多来自披露有限与支撑 2025 年估值所需增长 / 利润率耐久性之间的不匹配，而不是当前业务崩塌。
