      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 十年级别创始人连续性叠加平台深度
            body: >-
              三位联合创始人 12+ 年后仍全部活跃，公司从 2014 年的 CRE IR 初创公司，长成覆盖 PE、VC、CRE 和私募信贷、估值 $1.1B
              的基金操作系统。这种罕见的创始人长周期留任，又叠加基金行政管理团队 94% 的员工留存率；一旦与复杂 GP 客户建立信任，这类托管服务业务很难重建。
            calloutType: strength
            claimRefs:
              - CO032
              - CO036
          - type: callout
            title: 直接竞争对手批评定价与集成
            body: >-
              竞争对手 Agora 公开发布的对比，以及至少一条 InvestNext 客户证言，都指出 Juniper Square 定价复杂（LP 门户、报告、分析需要附加购买）、预构建集成少于替代方案，并且对较小型
              CRE 赞助方来说总拥有成本更高。虽然这些来源由竞争对手撰写，但它们揭示了真实买方异议，可能限制 Juniper Square 在 AUM 低于 $250M 细分市场的采用。
            calloutType: risk
            claimRefs:
              - CO033
              - CO034
          - type: callout
            title: Series D 与 Nasdaq 合作指向 AI 时代平台再定位
            body: >-
              $130M Series D（2025 年 6 月）、Nasdaq Ventures 战略投资（2025 年 9 月）和 JunieAI 产品套件，反映出公司从工作流 SaaS 向 AI
              原生基金操作系统的协同转向，并延伸到数据和流动性邻近领域。这让 Juniper Square 有机会扩展到二级交易、零售分销和跨境运营；但公司也必须在 AI 差异化上跑赢资本雄厚的既有玩家。
            calloutType: insight
