  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 作用
      - 关键依赖
      - 主要风险
    rows:
      - - 统一数据模型和记录系统
        - 存储基金、投资者、资本活动和业绩数据，供各模块使用
        - 数据质量和数据模式治理
        - 如果共享模型不完整或配置错误，下游工作流和 AI 输出会一起降级。
      - - 工作流应用
        - 募资、IR、会计、资金管理、合规、报告和 BI 工作流
        - 权限一致性和流程设计
        - 工作流蔓延可能导致不同团队和客群采用程度不一。
      - - 基金行政服务
        - 围绕会计、投资者服务和账簿的人力运营层
        - 人员连续性和服务管理
        - 如果运营扩张落后于产品销售，服务质量可能变成约束。
      - - 集成层
        - 预置连接器，以及连接 CRM、数据、电子签名和会计工具的自定义 API 连接
        - 第三方 API 和同步可靠性
        - 映射错误或同步延迟会削弱单一事实源承诺。
      - - AI 和无头访问层
        - JunieAI 智能体，以及面向 MCP 兼容 AI 客户端的 Headless GPX 访问
        - 权限继承、提示设计和工作流护栏
        - 智能体写入动作会抬高治理和变更控制要求。
      - - 信任和控制平面
        - 认证、授权、可审计性、隐私和合规控制
        - RBAC、SSO、2FA、日志和政策执行
        - 控制继承薄弱会让无头模型变成风险放大器。
      - - AWS 基础设施
        - 云托管、安全控制和冗余基础
        - AWS 可用性与配置纪律
        - 基础设施集中之后，运营问题若未被隔离，可能大范围扩散。
    notes: 本表依据 Juniper Square 官方 API、安全、AI 发布及第三方系统记录说明中可公开推断的信息，描绘其运营架构；它是运营模型视角，不是底层软件物料清单。
