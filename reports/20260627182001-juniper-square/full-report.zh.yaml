              Juniper Square 近期产品叙事的重心，已经从「带 AI 功能的软件」转向「面向私募市场的 AI 原生操作系统」。2025 年 6 月 Series D 公告推出 JunieAI，称其为面向 GP
              的企业级 AI，并描述为跨代理、工具、工作流和系统的模型无关编排。2026 年 6 月 Headless GPX 发布又往前走了一步：把同一套 GPX 能力开放给 Claude、Microsoft
              Copilot、ChatGPT 以及其他兼容 MCP 的外部 AI 客户端。公开使用场景先从投资者关系工作流切入，包括简报、管线报告和个性化更新；API 页面还称，AI 客户端中的 CFO
