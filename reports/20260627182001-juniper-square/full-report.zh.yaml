  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价模式
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 采用混合收入模式，结合两条主要收入流：（1）SaaS 订阅——覆盖 LP 投资人门户、募资 CRM、基金会计、合规和 AI
              模块的年度经常性软件许可；（2）托管基金行政管理服务——一项配备人员的外包基金运营合作，由 Juniper Square 200+ 人团队代表 GP 客户处理会计、资金管理、投资人服务和合规。SaaS
              收入在订阅期内按比例确认（标准 ASC 606 处理）。托管服务收入随服务交付确认，形成更线性的月度确认曲线。基础 SaaS 入门价格约为每年 $18,000（Sacra 称企业级平均每客户 ARR 远高于
              $700,000）。如此宽的价格分布反映出买方基础高度分层：小型新兴 GP 从入门价起步，再通过 LP 门户附加项、分析、合规模块和托管行政管理扩张。收入结构未公开披露。Sacra
              和公司材料显示，基金行政管理托管服务是增长最快的产品线（三年 CAGR >100%），说明它可能已从总收入的小份额长到 ARR 等价口径的 30–50%，但确切拆分未确认。JunieAI 智能体模块于 2025
              年推出，可能以分层订阅溢价或按智能体使用量计费的方式增加收入——JunieAI 的确切定价模式未公开披露。收入质量较高：SaaS 层受益于年度合同，服务层拥有 94% 员工留存率，并由下文讨论的 NRR
              画像暗示较高客户留存。
