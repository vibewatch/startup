  - id: TV001
    title: 建议摘要表
    columns:
      - 指标
      - 当前判断
      - 支撑
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 公司证据很强，但以当前价格承销所需证据仍不完整。
        - 不要只凭公开证据承销买入。
      - - 信心
        - 中
        - Series D 和增长证据可信，但利润率与留存透明度仍薄。
        - 只有管理层分享详细 KPI cohort 和收入质量数据后，才推进。
      - - 风险评级
        - 中
        - 高切换成本和品类顺风，抵消了监管、竞争和披露缺口。
        - 谨慎配置，并预期尽调会实质性改变判断。
      - - 估值立场
        - 偏高
        - 估算 ARR 约 $139.8M，投后估值约 $1.1B，意味着约 7.9x ARR，且没有公开利润率披露。
        - 要么拿到更好的数据，要么等更好的价格。
      - - 目标回报纪律
        - 倾向在下一次进入点看到 >2.5x gross MOIC 潜力。
        - 私募定价叠加稀释 / 优先权不确定性，可能很快侵蚀 venture 回报。
        - 等上行 / 风险偏斜更清晰后再承诺。
    notes: 摘要反映截至 2026-06-27 公开证据能够支持的判断；目标回报纪律是投资框架观点，不是公司披露指标。
