      - number: '1.4'
        title: 规模、牵引力与封面指标
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，平台服务超过 2,300 家 GP、750,000+ 个 LP 账户、45,000+ 个投资实体，管理约 $1 trillion LP 权益。研究日的官网确认了 2,300+ 家
              GP、750,000+ 个投资人账户和 45,000+ 个投资实体。更早的 2025 年 6 月 Series D 新闻稿披露 2,000+ 家 GP、600,000+ 个 LP 账户和 40,000+
              只基金，显示随后十二个月增长明显。GetLatka 估计 2025 年收入（ARR）为 $139.8M，高于 2024 年的 $108.2M，约同比增长 29%。公司披露，基金行政管理业务三年 CAGR 超过
              100%。截至 2025 年底，员工规模估计为 1,000–1,150 人。Sacra 称企业客户年收入超过 $700,000。毛利率、EBITDA 和烧钱速度均未公开披露，构成重要私有指标缺口。Latka
              数字是基于所称 ARR 对话的行业估计，不是经审计数字。基础层定价约从每年 $18,000 起，并随客户规模扩展到企业级六位数合同。
