      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的主要买方决策人是掌管基金运营预算的 GP 董事总经理、COO 或 CFO。在较小 GP 公司（AUM 低于 $500M）里，这个人通常是创始人。在更大型机构（AUM
              $2B+）里，买方是运营或 IT 管理团队。用户群更广：IR 团队使用募资 CRM 和 LP 门户，基金会计使用会计和 waterfall 模块，合规人员使用审计日志和 KYC 工作流，LP
              使用投资人门户。付款方是 GP 管理公司，用管理费收入支付订阅。这意味着 Juniper Square 收入相对不受 NAV 波动影响——它依赖基金数量和管理费经济性，而非 GP
              基金回报。采用通常由几类事件触发：（a）规模超过 50–100 名 LP，手工流程开始失效；（b）启动新基金，需要从一开始就建立干净的系统记录；（c）引入要求标准化投资人门户的机构
              LP；（d）监管检查压力暴露文档缺口。EY Private Equity Pulse 2026 显示，53% 的 PE 公司计划招聘更多数据 / AI
              专家，这会间接拉动对集成数据平台的需求。不断扩大的零售渠道——RIA、财富顾问和半流动性基金结构——创造出新的买方群体，其运营要求不同：自动化 K-1/1099 工作流、高容量 LP
              入驻，以及规模化简化投资人沟通。Juniper Square 目前在这一块渗透不足，但这是重要扩张面。
            claimRefs:
