      - number: '4.4'
        title: 公开牵引指标与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              对一家估值 $1.1B、完成 $130M Series D 融资的公司而言，Juniper Square 的公开财务表现证据异常稀薄。已确认的公开牵引指标包括：Series D 估值 $1.1B（2025 年 6
              月）、Nasdaq Ventures 战略投资（2025 年 9 月）、第三方聚合器 ARR 估计（GetLatka：约 $139.8M；Sacra 与该区间一致）、2,300+ 个活跃 GP
              账户、750,000+ 个 LP 投资人账户、平台上 $1T LP 权益、基金行政管理三年 CAGR >100%、94% 年化基金行政管理员工留存率，以及连续两年 PE Wire IR Tech of Year
              奖。私有指标缺口（无公开来源确认）包括：毛利率、EBITDA/EBIT、烧钱速度、现金余额、净债务、NRR、流失率、CAC、CAC 回本期（G2 的 17 个月估计来自用户报告，不是公司披露）、SaaS
              与服务收入结构、单个细分 ARR、pipeline 指标，或按职能拆分的员工规模。Premier Alternatives 数据显示，2025 年 12 月有一轮金额未披露的「Debt -
              General」融资，说明 Juniper Square 在 Series D 股权轮后获得了债务融资——更可能是用于支持托管服务营运资本或运营扩张的信贷额度，而不是困境信号。Premier
              Alternatives 报告的总融资额为 $320.5M，包含该额度。
