  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Juniper Square 从 2014 年创立到 2026 年 JunieAI 阶段带日期的关键里程碑，涵盖融资事件、产品发布、地域扩张，以及负面 / 治理时刻。
    data:
      items:
        - label: 创立
          date: '2014-01-01'
          detail: Alex Robinson、Yonas Fisseha 和 Adam Ginsburg 在旧金山创立 Juniper Square，用软件改造私募股权合伙企业
          tone: positive
        - label: 种子轮（$2M）
          date: '2015-01-01'
