      - number: '8.2'
        title: 融资与估值证据
        blocks:
          - type: paragraph
            body: >-
              最硬的公开锚点仍是 2025 年 6 月 Series D：由 Ribbit Capital 领投，Fifth Wall 战略参与，Redpoint、HighSage 和 Blue Owl 继续支持，以 $1.1
              billion 投后估值融资 $130 million。第三方数据集和公司披露在大图景上相互吻合：Juniper Square 大约五轮累计融资 $238 million；SEC Form D 则显示 2025
              年 5 月备案日的发行金额只有 $44 million，这更像分阶段或部分完成交割，而不是矛盾。核心估值问题是，公开收入证据是否足以支撑 2025 年价格延续到 2026 年。按 Latka 对 2025 年
              ARR $139.8 million 的估算，Series D 隐含约 7.9x
              ARR。这个倍数按垂直软件标准并不极端，但已经足够饱满；投资者在以相同或更高价格承保有吸引力的远期回报前，应要求更清晰看到毛利率、净收入留存、烧钱、稀释和清算优先权。
