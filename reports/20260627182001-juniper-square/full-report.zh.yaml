      - number: '2.5'
        title: 规模测算缺口与矛盾估计
        blocks:
          - type: paragraph
            body: >-
              三层规模测算都存在显著不确定性。$25T 到 $60T 的私募市场 AUM 预测横跨多个资产类别，并依赖 Bain 2024 年分析；该分析早于同一家公司 2026 PE Outlook 中描述的 2025
              年关税冲击。基金行政管理软件市场数字来自 DataIntelo，这是一家声誉较低的独立研究机构，方法不透明。Preqin、PitchBook、Forrester 等一手分析 / 市场数据机构都没有发布可佐证
              Juniper Square 所称约 5–7% SOM 渗透率的、面向具体供应商的 GP 软件市场份额分析。$7 trillion 零售资本估计来自 Juniper Square 自身报告（与 PitchBook
              合著）——这是公司提出的预测，可能带有宣传性规模测算。时间假设也不一致：Bain 用 2032 年作为 $60T 预测年份，而 PwC 用 2030 年作为 $1T DC 配置估计年份。Preqin 2029
              年预测早于近期宏观扰动（2025 年关税冲击），可能需要更新。矛盾信号包括 Bain 2026 PE Outlook 显示募资被「拖累」、分配低于 NAV 15%，部分抵触乐观 AUM 增长路径。投资人应把所有
              TAM/SAM 数字视为方向性指标而非精确值，并用多种方法测算 GP 运营软件机会。
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 零售民主化是 GP 运营基础设施的结构性需求驱动
            body: >-
              监管改革（SEC 扩大 accredited investor、ELTIF 2.0）、新基金载体（interval funds、半流动性结构）和零售资本需求汇合，为 GP 运营平台带来多年顺风。GP
              增加零售份额类别时，必须升级投资人入驻、合规文档和 LP 沟通基础设施——这正是 Juniper Square 护城河最深的位置。
            calloutType: insight
            claimRefs:
              - CM021
              - CM022
              - CM023
          - type: callout
            title: 市场规模证据结构性偏弱，且部分带自我宣传
            body: >-
              GP 软件 SAM 最常被引用的市场规模，要么来自 DataIntelo 这类声誉较低的发布方，要么来自 Juniper Square 自己与 PitchBook
              委托完成的报告。Gartner、Forrester、IDC 等一线分析机构尚未发布 GP 专属基金运营软件市场份额分析。投资人应对本章所有 TAM/SAM/SOM 数字施加较宽不确定性区间。
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
          - type: callout
            title: SAM 渗透率假设 JS 是 GP 基金操作系统市场领导者
            body: >-
              Juniper Square ARR 相对基金行政管理软件市场隐含的约 5–7% SAM 渗透率，假设 JS 正在争夺完整的私募基金 GP 软件预算。现实中，软件和托管服务市场重叠并不完全。如果 Juniper
              Square 的有效 SAM 更窄（例如仅 PE/VC/CRE，不含机构对冲基金），渗透率会更高。如果更宽（所有另类资产管理人），渗透率会更低。这一含混之处仍是未解决的证据缺口。
            calloutType: assumption
            claimRefs:
              - CM031
              - CM032
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              GP 基金运营技术的竞争格局可分为五类。第一类是 CRE 聚焦的投资人管理平台——AppFolio Investment Manager、Yardi Investment Suite、InvestNext 和
              Agora——专门为商业地产联合投资方和基金赞助方提供投资人门户、资本催缴、waterfall 和分配功能。它们局限于房地产策略，通常缺少机构 PE/VC GP 所需的基金会计深度。第二类是面向 PE/VC 的
              CRM 和交易管理工具——Dynamo Software、Salesforce Financial Services Cloud、Backstop——聚焦交易流、组合监控和投资人关系，但没有完整基金
              OS。第三类是向 IR 扩展的基金行政管理软件——Carta——从股权表管理和 LP 门户起步，正在长成完整 PE/VC 基金行政管理平台，是 Juniper Square
              核心垂直领域最直接的新兴竞争者。第四类是零售另类资产准入和分销平台——iCapital、CAIS、Securitize——它们服务不同价值链（财富管理人和 LP 准入），而非 GP
              基金运营，但向下游扩张后可能最终重叠。第五类是机构服务局——SS&C Technologies、FIS Investran、State Street AlternativesEdge——为对冲基金和大型 PE
              客户提供完整基金行政管理服务（可捆绑技术，也可不捆绑），在企业级托管服务追加销售上与 Juniper Square 竞争。Juniper Square 的独特位置在于：它是唯一在 PE、VC、CRE
              和私募信贷等主要策略类型中都有实质市场存在的平台，并基于单一统一数据模型，集成托管服务和 Nasdaq 背书的 AI 层（JunieAI）。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs: []
      - number: '3.2'
        title: 直接竞争对手
        blocks:
          - type: paragraph
            body: >-
              Carta 是 Juniper Square 最直接的新兴 PE/VC 竞争对手。Carta 管理超过 $220 billion
              私募资本基金资产，并把平台表述为「世界级服务与自主智能体交汇处的基金行政管理」——这套语言几乎与 Juniper Square 的基金操作系统叙事相同。Carta 从股权表管理起家，扩展到基金行政管理，在 VC
              和早期 PE 管理人中品牌很强。Carta 的 LP 门户和托管行政管理服务与 Juniper Square 核心 IR 和会计模块重叠。关键差异在于：Carta 的股权表集成更深，在 VC
              阶段公司中品牌更强；Juniper Square 的策略覆盖更宽，LP 账户基础更大。Agora 服务约 1,200 家 CRE 客户，每月收费约 $749，并在官网列出 5,000 多个集成。Agora 在
              CRE 市场明确把自己定位为 Juniper Square 的低成本替代方案，并发布价格对比页面。Agora 的广度（5,000+ 个集成）和更低入门价，对 AUM 低于 $100M、认为 Juniper
              Square 基础价（约 $18K/年）过高的 CRE 赞助方有吸引力。InvestNext 面向 CRE 联合投资体，提供投资人管理平台，并获得了从 Juniper Square
              切换出来的赞助方证言，理由是成本和集成便利性。AppFolio Investment Manager 是专门打造的房地产投资管理平台；其客户基础与 Juniper Square 的 CRE
              细分市场重叠，但完全缺少 PE/VC 能力。Yardi Investment Suite 部署在已经使用 Yardi 物业管理平台的 CRE 业主和运营商处——它主要靠物业管理关系争夺 Juniper
              Square 的 CRE 份额。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
