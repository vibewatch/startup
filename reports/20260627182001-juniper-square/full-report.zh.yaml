      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: Carta 是 PE/VC 细分市场最可信的趋同威胁
            body: >-
              Carta 的 AI 原生基金行政管理叙事，以及 $220B+ 在管基金资产，使其成为唯一一个具备品牌、资本和技术路线图、可在 PE/VC 基金 OS 市场直接挑战 Juniper Square
              的竞争对手。Juniper Square 的优势——跨策略覆盖、托管服务飞轮和 LP 网络规模——仍然耐用，但面对一个资本充足、叙事相当的 AI 竞争对手，并非不可穿透。
