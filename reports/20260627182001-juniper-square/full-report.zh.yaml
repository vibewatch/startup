  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与背景
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 故事中可投资的部分，不只是私募市场仍是一个庞大且增长中的软件品类，而是公司看起来贴近普通合伙人的运营记录系统：这些 GP
              需要让募资、投资者运营、行政管理、资金管理和合规工作流保持同步。论点由强工作流覆盖、披露的企业账户深度、横跨风投、私募股权和房地产的客户证明，以及另类资产 AUM 上升带来的品类顺风支撑。不过 Sacra
              的负面框架也重要：同一研究在强调高切换成本的同时，也指出客户集中度、监管复杂性以及 incumbent 基金行政管理人集成软件带来的竞争压力。这些保留意见解释了为什么本章把 Juniper Square
              视为可信的优质资产，但不是任何价格都显然值得买入的复利标的。强业务如果入场估值已经假设持续增长、AI 执行顺利且没有重大合规或服务交付挫折，仍可能是一笔弱投资。
