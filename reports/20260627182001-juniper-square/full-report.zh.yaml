  - id: TV005
    title: 论点失效与终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 增长减速
        - 新融资或退出流程前，收入增速持续跌破十几个百分点中段
        - 定价依赖可持续复合增长，优质倍数逻辑因此失效
        - 避免以 2025 年估值或更高价格投入新资本。
      - - 控制失效
        - 出现绑定投资者工作流的重大网络、隐私、AI 治理或监管事件
        - 信任溢价被侵蚀，退出就绪叙事快速走弱
        - 暂停流程，直到完成根因和整改证据审阅。
      - - 客户集中
        - 最大 PE 或 VC 客户之一流失，或集中度明显恶化
        - 削弱切换成本叙事，并引发收入质量担忧
        - 按更低 NRR 和更高销售摩擦重切情景。
      - - 服务或管理执行滑坡
        - 基金行政质量或实施产能成为瓶颈
        - SaaS 与服务混合模式拖累利润率和声誉
        - 按更低倍数和更高营运资本风险承销。
      - - 融资重估
        - 下一轮价格不高于 2025 年价格，且没有合理的更广泛市场冲击解释
        - 表明倍数压缩，或经营质量弱于 2025 年轮次所暗示的水平
        - 除非新尽调完全解释重估，否则视为论点失效。
    notes: 这些触发器是可监测事件，目的是把定性担忧转化为明确的投资纪律。
    claimRefs:
      - CV017
      - CV018
      - CV025
      - CV026
      - CV040
      - CV044
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 毛利率与软件 / 服务组合
        - 经审计的软件毛利率与行政服务毛利率拆分
        - 决定当前倍数到底套在高质量软件收入流上，还是套在更混合的服务模式上
        - CFO 数据室和收入质量审阅。
      - - 留存与队列经济性
        - 按队列拆分的净收入留存、总留存、流失和多产品附加率
        - 是证明切换成本能转化为可持续扩张经济性的核心
        - 收入运营导出加客户队列审阅。
      - - 股权结构与优先权
        - 清算优先权、参与权、期权池刷新，以及创始人—投资者控制权
        - 优先权悬垂可能显著削弱未来入场后的实际回报
        - 对融资文件和当前股权结构做法律尽调。
      - - 客户集中
        - 当前头部客户收入结构和细分集中度
        - Sacra 的反向提示让集中度成为影响估值的下行变量
        - 客户集中度明细和前 20 大账户审阅。
      - - AI 变现与控制
        - JunieAI 或无头工作流的付费采用、提价幅度、控制继承和可审计性
        - AI 是上行空间的核心，也可能成为治理失效最快的路径
        - 产品、安全和设计伙伴尽调会。
      - - 退出就绪
        - 董事会报告包、审计师、KPI 纪律，以及 IPO 或出售就绪路线图
        - 需要判断流动性时点，而不只是公司质量
        - CEO/CFO 尽调和治理审阅。
    notes: 这些是把跟踪推进到更高信心价格判断所需的最低限度尽调工作流。
    claimRefs:
      - CV016
      - CV025
      - CV041
      - CV043
      - CV045
