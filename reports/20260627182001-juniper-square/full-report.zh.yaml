  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高残余敞口集中在监管 / 合规漂移和 AI 控制错误处；一旦出事，可能同时伤及多个客户工作流里的信任。
    data:
      columns:
        - 中等影响
        - 高影响
