  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 概率信号
      - 下行触发项
    rows:
      - - 乐观
        - 2025 年 ARR 到下一次融资窗口前以约 30% 至 35% 复合增长，AI 与管理业务交叉销售支撑更好的组合和更强的企业客户扩张。
        - $2.3B-$3.2B
        - JunieAI 变现和企业 attach 率明显加速，同时治理保持干净。
        - 任何迹象显示 AI 使用很广但未变现，或服务交付约束实施。
      - - 基准
        - 增长放缓至 20% 至 25% 区间，市场把 Juniper Square 视为溢价垂直平台，但不是稀缺资产。
        - $1.2B-$1.8B
        - 客户深度保持健康，且没有出现重大控制或集中度问题。
        - 公开可比公司估值仍受压，利润率披露仍有限。
      - - 悲观
        - 增长放缓至 10% 至 15% 附近，因为监管、竞争或客户集中削弱扩张，买方也不愿为私募软件不透明性支付更高价格。
        - $0.6B-$0.9B
        - 如果公开市场仍保持纪律，down round 或 flat round 逻辑会变得可信。
        - 下一次流动性事件前，净留存、利润率或控制证据令人失望。
    notes: 区间是情景输出，不是直接市场报价；锚点包括 2025 年 ARR 估算、私募市场融资背景和公开可比公司估值压缩风险。
