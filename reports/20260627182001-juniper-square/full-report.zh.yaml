      - number: '3.5'
        title: 护城河耐久性与竞争风险清单
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的竞争护城河有五层。第一，切换成本：平均 17 个月回本期和 3 个月实施时间意味着 GP 一旦承诺使用平台，迁移摩擦很高。第二，数据网络效应：平台上有 750,000+ 个 LP
              账户和 $1T LP 权益，随着 JS 网络增长，竞争供应商在 LP 侧的入驻摩擦会上升。第三，托管服务锁定：200+ 人行政管理团队和 94%
              年化员工留存率，形成配备人员的基金行政管理关系，比软件订阅更难替换。第四，AI 专有数据：JunieAI 和 MCP 无头接口独占 Juniper Square 多年、多策略基金事件数据集；开源或新进入 AI
              没有多年等量运营数据，无法复制这一结构性优势。第五，品牌和机构信任：连续 PE Wire IR Tech of Year 奖项和 Nasdaq Ventures 战略投资，提供信誉信号，降低 GP
              销售摩擦。主要耐久性风险包括：（1）Carta 的 AI 原生基金行政管理叙事和不断增长的 PE/VC 存在感，可能侵蚀 Juniper Square 在 VC/早期 PE 管理人中的品牌优势；（2）Agora
              和 InvestNext 的低价产品可能限制 JS 可寻址 CRE 客户总数；（3）若竞争对手模型进步快于 JS 专有数据优势扩大，AI 商品化可能稀释 JunieAI 的数据护城河；（4）大型收购（例如
              SS&C 或 Broadridge 收购 Carta 或类似 PE/VC 平台）可能瞬间拼出一个同时拥有 Juniper Square 广度和大型机构服务局资产负债表的合并实体。Sacra
              分析认为，缺少利基专精是 CRE 子市场的一项竞争风险，那里更聚焦的供应商正在获得牵引力。
