      - number: '1.5'
        title: 里程碑、监管背景与负面证据
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的里程碑从 2014 年围绕商业地产投资人关系创立开始，随后连续做平台扩展、地域扩张和产品发布。2022–2023 年 ZIRP 退潮期间，公司推进成本理性化，砍掉 LP
              侧数据工具和私募配售服务等早期投入，重新聚焦核心 GP 侧软件和基金行政管理业务。卢森堡业务于 2025 年 5 月上线，打开跨境基金行政管理能力。公司 12
              年运营历史、强留存指标以及创始人持续在岗降低了运营风险。负面证据方面，直接竞争对手 Agora 撰写的竞品对比页面明确称 Juniper Square 定价相对替代方案偏贵，指出核心投资人侧工具（LP
              门户、报告、分析）是附加项而非包含在基础价格中，并强调其开箱即用集成少于提供 5,000+ 个预构建连接器的竞争对手。一条 InvestNext 客户证言明确描述从 Juniper Square 切换到
              InvestNext，以获得更顺畅体验，理由包括成本效益和更好支持。Juniper Square Private Markets Regulatory Council（2026 年 1 月）提到的监管逆风包括
              SEC 考试重点转向 AI、网络安全（Reg SP）、估值、费用和利益冲突。FinCEN Investment Adviser AML Rule（生效日期推迟至 2028 年 1 月）可能提高 GP
              合规成本，而这些成本会通过 Juniper Square 的行政管理服务或与其合作来处理。
