      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 与 PitchBook 合作发布的 Rise of the Retail Investor 报告引用 Bain & Company 分析称，2025 年初私募市场 AUM 约为
              $25 trillion，并有望到 2032 年翻倍以上至 $60 trillion。Preqin 的 Future of Alternatives 2029 预测，仅私募股权 AUM 到 2029 年就将超过
              $11.97 trillion。全球基金行政管理软件市场 2025 年约为 $8.7 billion，预计以 9.8% CAGR 增长，到 2034 年达到约 $18.9 billion。私募股权软件子赛道
              2025 年约 $2.4 billion，预计以约 11% CAGR 增至 2032 年 $5.1 billion。这些数字代表广义软件 TAM；Juniper Square 的实际 SAM 是 GP 侧
              SaaS 与托管服务支出的子集，估计 2026 年全球为 $2–3 billion。按 2025 年估计 ARR 约 $140M 对比 $2–3B GP 聚焦细分市场，Juniper Square 的隐含 SOM
              约为近期可服务市场的 5–7%，说明公司已有实质规模，但仍有大量增长空间。零售投资人浪潮可能显著扩张 SAM：Juniper Square 自身分析估计，$7 trillion
              净新增零售资本可能流入私募市场，迫使 GP 大规模升级投资人运营基础设施。PwC 估计，仅美国 DC 资产 5% 配置到私募市场，到 2030 年就相当于新增 $1 trillion
              AUM。这些宏观顺风会提高每家 GP 的技术和运营预算，直接放大可寻址支出池。
