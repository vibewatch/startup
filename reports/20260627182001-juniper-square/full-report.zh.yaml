  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Juniper Square 方案
      - 可衡量的公开收益
      - 限制
    rows:
      - - 发起新基金募资
        - 潜在投资者数据、尽调材料和认购步骤常常分散在不同工具里
        - 数据室、CRM、募资仪表盘和数字认购整合在一个工作流内
        - 官方页面把该工作流定位为更快募资、减少手工工作
        - 公开来源未量化平均周期缩短幅度。
      - - 新 LP 入驻
        - 手工认购包和碎片化 AML-KYC 审查会拖慢进度
        - 自适应认购、DocuSign、托管关账服务和合规工作流
        - 官方材料称，入驻流程旨在加快交割并减少摩擦
        - 司法辖区特定的例外处理未完全公开。
      - - 运营投资者沟通
        - IR 团队手工拼接管线、持仓和文件上下文
        - CRM、LP 门户、资料单、个性化更新和活动历史
        - 奖项和评价来源支持工作流质量和投资者体验改善
        - 独立证据未按公司规模量化响应时间或生产率提升。
      - - 关账并向 LP 报告
        - 会计、分配和报告常常需要跨团队重复录入数据
        - 基金会计、报表、通知，以及有会计数据支撑的门户报告
        - 官方页面强调实时指标和更可靠的报告
        - 未披露公开 SLA 或关账周期基准。
      - - 调拨资本并核对支付
        - 分配和支付状态可能与账本及投资者记录脱节
        - 资金管理工作流绑定资本催缴、分配和支付运营
        - Sacra 和官方页面显示，支付状态会与账本保持同步
        - 公开文档未披露银行合作伙伴冗余或故障预案。
      - - 在受监管的基金运营中使用 AI
        - 横向 AI 工具缺少私募市场上下文和治理
        - JunieAI 和 Headless GPX 通过既有权限、审计轨迹和结构化数据开放基金工作流
        - Headless GPX 将 GPX 扩展到 Claude、Copilot、ChatGPT 和 MCP 兼容客户端
        - 公开路线图尚未给出完整写入动作扩展日期。
    notes: 收益来自公司主张的工作流结果，并尽可能用评价和客户证明交叉验证；限制部分记录公开数据仍留下的主要尽调问题。
