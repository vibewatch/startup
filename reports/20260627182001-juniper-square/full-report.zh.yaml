            body: >-
              公开可比公司有方向性价值，但并不完美，因为 Juniper Square 混合了垂直软件、工作流基础设施和服务。本资料包中最好的私募市场上限参照是 iCapital，它服务相邻的另类资产管理人工作流，并据报道在
              2023 年估值超过 $6 billion。Salesforce 是最清晰的公开市场锚点，可用于观察大型软件平台在增长成熟后如何交易；其市值约 $129.7 billion，对应 FY2026 收入 $41.5
              billion，隐含收入倍数远低于 Juniper Square 私募轮。Dynamo、Yardi Investment Suite 和 Allvue
              等品类同行显示，即便公开估值披露稀少，赞助方支持、工作流密集的另类资产软件仍具战略价值。关键可比洞察是：Juniper Square
              的价格只有在它继续表现得更像拥有黏性企业工作流的稀缺品类领导者，而不是传统行政管理人或增长较慢的横向 SaaS 资产时，才站得住。
