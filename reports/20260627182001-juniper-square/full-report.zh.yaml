        title: 安全、合规与信任控制
        blocks:
          - type: paragraph
            body: >-
              信任控制不是 Juniper Square 产品定位的外围功能；它本身就是销售的一部分，尤其当平台扩展到代理式工作流时。安全与合规页面称，Juniper Square 运行在 AWS 上，每年接受 SOC 1
              Type 2 和 SOC 2 Type 2 评估，定期进行第三方渗透测试，用 256-bit AES 加密静态数据，并用 TLS 保护传输中数据。同一来源还强调 GDPR 和 CCPA
              合规、2FA、SSO、基于角色的权限，以及便于审计的访问控制。Headless GPX 公告让这些主张更有分量，因为公告称 AI 代理会继承既有权限、认证和审计轨迹，而不是绕过它们。同时，Juniper
              Square 自己的监管委员会内容也说明信任门槛为何在抬升：私募市场公司正面对
              AI、网络安全、AML、供应商监督和零售准入的主动审查，因此任何向自主写入动作或更广外部代理使用的扩张，都需要实践中的强治理，而不只是漂亮的信任中心文案。
