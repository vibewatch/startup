    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与产品
        blocks:
          - type: paragraph
            body: >-
              Juniper Square, Inc. 是一家私营金融科技公司，总部位于 555 Montgomery Street, Suite 1400, San Francisco, California
              94111，并在 Delaware 注册成立。公司创立于 2014 年，公开使命是把 GP 与 LP
              之间的股权合伙关系数字化，让私募市场更高效、更透明，也更容易进入。创始团队最早切入商业地产投资人关系软件，随后把系统记录（system-of-record）野心扩展到私募股权、风险投资、私募信贷和实物资产等所有私募市场垂直领域。平台被描述为一个「基金操作系统」，把募资、投资人关系、基金会计、资金管理、合规和商业智能统一到单一事实源里。截至
              2026 年中，核心产品包括 JunieAI——一个模型无关的智能体 AI 平台，随 Series D 资金推出，为投资人关系、基金行政管理、组合管理和投资决策支持提供私募市场原生智能体。公司还提供兼容 MCP
              的无头数据接口，让 GP 数据可被 Claude、Microsoft Copilot、ChatGPT 和其他 AI 客户端访问，并沿用核心平台相同的权限和审计追踪。Juniper Square
              已运营十多年，把自己定位为私募市场互联基金基础设施的先行者。
