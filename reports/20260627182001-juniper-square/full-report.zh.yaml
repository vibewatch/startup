  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 维度
      - 正方论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 市场
        - 另类资产 AUM 增长和散户参与扩张，支撑私募市场运营软件的长周期需求。
        - 如果现有玩家现代化更快，品类增长并不保证单一供应商能维持溢价定价。
        - 证明持续的品类增长转化为 Juniper Square 的赢单率和扩张，而不只是 TAM 叙事。
      - - 产品与壁垒
        - 统一工作流和高切换成本显示出粘性的记录系统特征。
        - 管理人和相邻平台把软件与服务打包后，长期可以追上工作流宽度。
        - 提供独立的迁移流失和多产品 attach 数据。
      - - 客户
        - 企业账户平均收入超过 $700K，客户故事覆盖 PE、VC 和房地产，意味着采用很深。
        - Sacra 标出集中度，并称五大客户中按收入计有四个来自 PE/VC。
        - 披露按 cohort 划分的收入集中度和 logo 留存。
      - - 财务
        - 估算 ARR 和多年增长支撑其获得溢价私募倍数的规模。
        - 没有公开毛利率、NRR、FCF 或烧钱数据，外部无法判断增长质量。
        - 分享软件 / 服务组合、毛利率趋势，以及由留存支撑的 rule-of-40 类指标。
      - - 竞争
        - Ribbit、Fifth Wall 和 Nasdaq 的战略背书显示生态相关性。
        - 传统基金管理人和相邻平台继续整合技术，可能压缩价格。
        - 展示相对 Carta、iCapital、Allvue、Yardi 和管理人主导捆绑方案的持久赢单率。
      - - 风险与治理
        - 安全 - 合规信号叠加 PMRC 治理重点，显示管理层理解控制要求。
        - AI 推出提高治理负担；任何控制失效对估值的伤害，都可能快过产品进展带来的帮助。
        - 在尽调中证明 AI 控制、事故历史和模型治理成熟度。
    notes: 各行围绕本章要求的判断维度组织：市场、产品、客户、财务、竞争和风险。
