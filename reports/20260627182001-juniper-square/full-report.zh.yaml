      - number: '7.4'
        title: 竞争、市场结构与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的依赖画像与其说是单一外包供应商，不如说是集中在特定市场结构中。第三方来源一致把公司框定为私募市场生态的基础设施：Advisor Perspectives
              称其为私募市场热潮的「卖铲人」供应商，Preqin 预计另类资产继续扩张，Sacra
              则强调监管复杂性、传统基金管理人补技术带来的竞争压力，以及大型机构管理人集中度。私募市场募资和运营现代化保持健康时，这一组合很有吸引力；但它也让 Juniper Square
              暴露于一组集中的买方、工作流和采购触发因素。如果私募市场募资放缓、管理人削减技术支出，或 incumbent 缩小功能差距，Juniper Square 向无关软件类别自然多元化的空间有限。公司还通过集成、API
              和代理式工作流增加平台依赖。官方材料鼓励客户把 GPX 连接到外部 AI 环境和更广系统，第三方发现工具也显示其对外 API
              足迹。这提升了可扩展性，也可能降低供应商锁定异议；但同时提高了断裂风险：架构变更、权限错误、模型提供商变化或生态事件，都可能打击现在依赖 Juniper Square 作为控制平面的客户工作流。Nasdaq
              Ventures 的战略资本是正面信号，但也抬高了外界对 Juniper Square 作为品类平台执行的期待，而不只是把它看成报告工具。FR003
              的依赖图因此不仅强调监管者和资本提供方，也强调私募市场需求周期、API / 集成界面，以及客户自选 AI 环境，这些因素都可能放大执行失误。
