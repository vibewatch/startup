      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动因素包括：（1）私募市场 AUM 从 $25T 向 2032 年 $60T 扩张，带来更多需要运营基础设施的基金和 GP 实体；（2）零售民主化——估计 $7T
              净新增零售资本流入私募市场，显著提高每家 GP 的 LP 数量，要求自动化入驻和报告；（3）SEC 和监管压力（Reg SP、AML 规则、Names Rule 合规延期、AI
              和网络安全考试重点）推动合规技术支出；（4）AI 采用提高复杂度门槛，也奖励拥有专有数据模型的平台（Juniper Square 的 JunieAI）；（5）GP 整合——Bain 2026 称，最大的 25%
              收购基金吸走超过 75% 募资额，幸存 GP 需要企业级基础设施。关键约束包括：（1）利率长期偏高、LP 分配放缓（Bain：分配占 NAV 比例连续四年低于 15%）拖慢 GP
              预算增长；（2）募资集中到大型成熟基金，削弱新兴管理人群体购买力；（3）零售投资人复杂度带来运营要求（1099 报告、简化门户、避开
              K-1），现有平台若不大幅重构，未必能完整覆盖；（4）传统基金行政管理机构自建技术（SS&C、Citco），形成「替我做」的替代方案，可能压低软件采用率；（5）更多纯软件竞争对手以低价切入，带来商品化压力。WEF
              指出，民主化能否成功取决于信任、透明度和教育——这些因素会让买方因避险而偏向拥有审计追踪和合规资质的成熟供应商。
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
