            body: >-
              客户章节的主要负面角度不是 Logo 薄弱，而是集中度和披露不透明。Sacra 的分析明确指出，私募市场仍集中在大型机构管理人手中；如果大客户切换平台，或募资环境转弱、GP
              削减支出，就会形成客户集中度风险。同一来源称企业客户平均年收入超过 $700,000，进一步说明在头部 GP 数量之下，Juniper Square
              可能服务的是数量相对较少、价值很高的账户。公开材料没有披露头部客户收入占比、前 10 大 ARR、合同期限、伙伴来源 ARR 或续约时间表，因此集中度只能定性评估。渠道依赖不像典型经销商依赖，因为 Juniper
              Square 似乎直接掌握软件、行政管理和数据界面；但伙伴杠杆仍通过 Preqin、Yardi、DocuSign、HubSpot、Outlook、Nasdaq 背书的生态可信度，以及 Claude 或
              Copilot 等 AI 客户端发挥作用。监管复杂性有双重影响：它提高了对合规密集型工作流工具的需求，但当买方面对多司法辖区运营复杂度时，也会拖慢采购和扩张。Juniper Square
              因此拥有强采用叙事，但下行情景披露仍不完整。
