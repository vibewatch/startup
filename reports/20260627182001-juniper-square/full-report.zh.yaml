      - number: '7.2'
        title: 监管与法律风险格局
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是严重程度最高的领域，因为 Juniper Square 销售进入的投资工作流，正越来越明确地受到隐私、网络安全、账簿与记录以及 AML 审查。SEC 2026
              财年材料把信息安全、Regulation S-P、新兴金融技术和反洗钱列为横跨市场参与者的检查重点；SEC 另行关于 Regulation S-P 的沟通，则要求公司为 2024
              年修订案做好运营准备，并说明检查团队将如何审查实施情况。FTC 同时表示，当企业未能兑现隐私和安全承诺时，会采取执法行动。平台把自己定位为基金基础设施，而非轻量点工具；这些信号意味着，即便 Juniper
              Square 本身不是登记顾问，监管预期也可能收紧。Juniper Square
              自身隐私政策进一步强化了这一风险面。政策明确区分公司作为服务提供商或数据处理者的情形，以及可能适用客户或门户特定隐私条款的情形；同时披露使用第三方托管、分析和安全提供商，以及法律程序披露路径。这有助于界定合同风险，也说明尽调必须越过首页话术，深入
              DPA、子处理方清单、事件义务和监管回应程序。更广的边界也在国际和州层面移动：GDPR 仍是欧盟个人数据保护基线，CCPA/CPRA 扩大了加州消费者权利，FinCEN 也只是把投资顾问 AML 规则推迟到
              2028 年，而不是彻底移除合规问题。结果是一套动态而非稳定的监管栈，更新速度和控制有效性证据比任何单一合规徽章都更重要。
