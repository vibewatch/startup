      - number: '1.3'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: >-
              Alex Robinson 在 2024 年博客中称，Juniper Square 2015 年在超过 200 场会面后，从 21 位投资人处完成 $2M 种子轮。种子轮由 AngelList COO Kevin
              Laws 领投，投资方包括 Felicis 的 Sundeep Peechu、Ribbit Capital 的 Nick Shalek、Redpoint 的 Elliot Geidt，以及 Blue Owl 的
              Darragh O'Flaherty。随后公司在 2018 年完成约 $25M Series B，2019 年 11 月以据称 $415M 估值完成 $75M Series C（Ribbit Capital
              领投），2023 年 2 月完成 $133M 成长期融资，并在 2025 年 6 月以 $1.1B 估值完成 $130M Series D。Series D 由 Ribbit Capital 领投，Fifth
              Wall 提供重要战略投资，Redpoint Ventures、HighSage Ventures 和 Blue Owl Capital 参投。Nasdaq Ventures 随后在 2025 年 9
              月宣布战略投资，金额未披露；该投资带来与 Nasdaq 围绕二级市场创新的数据和流动性合作。第三方数据库估计，所有轮次累计融资约 $238M；不过 2025 年 5 月提交的 Series D Form D
              在申报时显示募资 $44M，说明交割可能分批完成。公司在 Delaware 注册成立，截至 2026 年初，未公开披露债务、信贷额度，或早期投资人出售 LP 权益的二级交易。
