      - number: '4.5'
        title: 资本充足性与资金用途
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的资本状况包括 2025 年 6 月完成的 Series D（$130M，Ribbit 领投）、2025 年 9 月 Nasdaq Ventures 战略投资（金额未披露），以及
              2025 年 12 月 debt/general 融资轮（金额未披露）。Premier Alternatives 报告，截至 2025 年 12 月，总融资额为 $320.5M（资本效率：估值 / 融资额为
              3.43x）。Series D 资金用途被表述为：（1）加速 JunieAI 开发和智能体平台扩张；（2）扩展零售和半流动性基金 GP 市场；（3）国际增长（卢森堡基金行政管理于 2025 年 5
              月上线）。假设业务接近盈亏平衡或小幅亏损，Series D 完成后的隐含现金跑道至少 24 个月。2025 年 12 月债务融资可能提供信贷额度，进一步延长有效跑道。2025 年 5 月 9 日提交的 SEC
              Form D（CIK 0001662890）最初显示已募资 $44M（首批交割），与分批交割并在 6 月达到 $130M 总额相符。Form D 列出的高管包括 Alex
              Robinson（CEO、执行董事）、Adam Ginsburg（联合创始人）、Yonas Fisseha（联合创始人）和 Elliot Geidt。该 Form D 根据 Regulation D Rule
              506(b) 提交，确认公司作为面向合格投资人的私募发行，可豁免 SEC 注册。公司未披露下一轮时间；Series E 或 IPO 的典型触发点会是可持续盈利证据、AI 收入贡献规模化，或零售市场渗透里程碑。
