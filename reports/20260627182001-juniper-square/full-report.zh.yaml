              Agora（约 1,200 客户，约 $749/月）和 InvestNext（有从 JS 切换的公开证言）正在对价格敏感的 CRE 联合投资方细分市场获得牵引；该细分可能占 Juniper Square
              2,300+ GP 基础的相当一部分。如果 AUM 低于 $250M 的 CRE 赞助方占 JS GP 数量的 30–40%（未确认），该细分市场的价格侵蚀会构成近期流失风险。
