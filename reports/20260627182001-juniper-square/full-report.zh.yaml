            body: >-
              把 GPX 开放给 Claude、Copilot、ChatGPT 和其他兼容 MCP 的客户端，能加深客户嵌入；但它也把模型行为、权限继承和 API 纪律推入核心信任边界。因此，AI
              既是增长杠杆，也是剩余风险放大器。
