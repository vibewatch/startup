  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 的风险画像不是由某一个生死攸关的未知数主导，而是由受监管工作流深度、数据敏感性以及新扩张的 AI / 控制平面相互作用决定。公开公司材料显示，平台现在嵌入 2,000 多家私募市场
              GP 和 750,000 个 LP 的募资、投资者入驻、AML/KYC、基金会计、支付、报告和审计工作流；因此，产品或控制失效可能传导到客户账簿与记录、投资者沟通和资本活动，而不只是边缘工作流。FR001
              热力图因此把监管 / 合规漂移、安全 / 隐私失效、AI 代理误执行和私募市场集中度列为最重要的剩余风险，因为这些主题会同时穿透收入、留存、信任和估值。公开缓释措施真实存在，但大多是流程型：SOC
              审计、渗透测试、基于角色的权限、审计轨迹和隐私通知体现基础设施成熟度；但 2026 年监管者强调的是控制在实践中是否有效，而不是政策是否存在。这一区别对投资承保很关键。最强的公开正面因素是，Juniper
              Square 披露了企业级控制，把自己定位为私募市场运营记录系统，并持续吸引战略资本。最强的公开负面因素是，事件历史、客户集中度、法律历史、烧钱 / 利润率画像和 AI 错误率证据仍基本私有。投资者的核心问题不是
              Juniper Square 有没有风险——所有规模化金融科技工作流平台都有——而是公司能否在开放更多操作系统给自动化代理的同时，跟上移动中的监管边界，且不制造会伤害增长或压缩估值的信任事件。
