          detail: 募资工作区、IR CRM 和 LP 门户、财务 / 行政管理控制台，以及通过 Headless GPX 接入的外部 AI 客户端。
        - label: 工作流应用
          detail: 认购与入驻、投资者沟通与 tear sheet、基金会计与报告，以及资金管理和合规工作流。
        - label: AI 与自动化
          detail: JunieAI 智能体、Headless GPX 工具界面，以及由继承权限和审计控制约束的工作流执行。
        - label: 共享数据模型
          detail: 基金、资产、持仓、投资者、潜在投资者、资本活动和文件都落在同一套互联的私募市场记录里。
        - label: 基础设施与控制
          detail: AWS 托管和冗余，加上 SOC 审查、加密、SSO、2FA、基于角色的权限和审计日志。
