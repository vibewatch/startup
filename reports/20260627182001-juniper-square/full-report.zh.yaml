      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              收入质量扎实：经常性 SaaS 订阅有高切换成本（17 个月回本期意味着客户承诺强），托管服务业务三年 CAGR >100%、员工留存率 94%，企业级平均 ARR/客户超过 $700K。隐含 ARR 倍数约
              7.9x（Series D $1.1B / 约 $140M ARR），与 Acquiry 2026 基准中 ARR 增长 >25% 的 AI 驱动垂直 SaaS 相符（传统 SaaS >30% 增长：5–8x
              ARR；AI 驱动集成可获得溢价）。相对 SaaS 可比公司，估值不激进，但也并不明显便宜——除非 JunieAI 显著加速 ARR 增长，否则倍数扩张空间有限。混合收入模式形成毛利率天花板：拥有 200+
              名员工的托管服务无法达到纯 SaaS 80%+ 毛利率，限制了相对纯软件公司的终局利润率潜力。Series D 和 2025 年 12
              月债务额度提供了充足近期资本。没有困境、契约风险或加速烧钱证据。重要尽调阻断项包括：（1）没有经审计财务来确认 ARR 估计；（2）毛利率未披露——这是终值的关键摆动因素；（3）NRR
              未披露——对评估收入质量至关重要；（4）烧钱速度未知——如果 JunieAI 投资的 J 曲线比预期更陡，跑道可能更短；（5）2025 年 12
              月债务额度条款未知——可能包含影响股权稀释的契约或认股权证。完整投资决策必须拿到 Juniper Square 经审计财务、按 cohort 的 NRR 和 GRR、按产品拆分的 ARR
              bridge，以及按收入细分披露的毛利率。
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
      - number: '4.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 毛利率是最重要的未披露数字
            body: >-
              Juniper Square 的终值关键取决于混合毛利率是否能随着 JunieAI 自动化基金行政管理人工而向纯 SaaS
              水平（75–85%）收敛，还是在服务业务快于软件层增长时继续承压（55–65%）。公开来源无法回答这一点；尽调必须拿到经审计 P&L，并看到分部层面的毛利率披露。
            calloutType: risk
            claimRefs:
              - CI015
              - CI032
              - CI033
          - type: callout
            title: 估计 ARR 完全依赖第三方聚合器，公司没有确认
            body: >-
              本章反复引用的 $139.8M ARR 来自 GetLatka；该发布方声誉较低，使用的是估计而非确认收入数据。Sacra 分析与其一致，但同样是估计。公司没有公开披露 ARR。在 $1.1B 估值下，如果
              ARR 被高估 20%（实际 ARR 为 $112M），有效倍数会升至约 9.8x——仍处于 AI SaaS 基准内，但差异已经实质性改变。投资人必须把经审计 ARR 确认作为投资定价的前提。
            calloutType: risk
