- id: adoption-trajectory-growth-metrics
  title: Adoption Trajectory & Growth Metrics
  body: 'The best evidence of adoption is the progression in Juniper Square''s own operating metrics between mid-2025 and mid-2026. The June 2025 Series D announcement described more than 2,000 GPs, 40,000 funds, 600,000 LP accounts, and $1 trillion of LP capital, while the November 2025 Private Equity Wire release reiterated 40,000-plus funds and 650,000 LP accounts. By the June 2026 Headless GPX announcement and current solutions pages, those figures had moved to 2,300-plus GPs, 45,000-plus investment entities, and 750,000-plus LP accounts. Growth claims are also concentrated in higher-value segments: management says the fund-administration business has grown at more than 100% CAGR over three years, the business overall has compounded at 45% over five years, private equity customer acquisition has more than doubled over the last two years, and private equity plus venture now account for four of the five largest customers by revenue. Those are not perfect cohort metrics, but they do imply
    widening deployment depth inside the private-equity ecosystem. The headless and API surfaces add another adoption signal: Juniper Square is exposing core investor, fund, and compliance workflows to external AI clients only because those underlying systems are already operating as systems of record for real customers.'
