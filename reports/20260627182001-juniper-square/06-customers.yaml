- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Existing GP clients raising new funds
    - Spend could still be concentrated in a small number of large institutional managers
    - high
    - Request customer count by ACV band, top-10 ARR share, and vintage-by-vintage expansion
  - - Cross-sell from software into fund administration / treasury / compliance
    - Services growth can add operational dependency and support-burden concentration
    - medium
    - Request attach rates, module-level retention, and service gross-margin by cohort
  - - Integrations and headless AI workflows
    - Direct versus partner-influenced revenue split is not disclosed
    - medium
    - Request ARR sourced by direct sales, ecosystem partners, and AI-enabled upsell
  - - High-value enterprise pricing
    - Average revenue per enterprise customer above $700K implies meaningful account-value concentration
    - high
    - Request customer distribution by ACV, logo count by tier, and largest-customer share
  - - Private-markets ecosystem concentration
    - Large institutional managers can delay buying or reduce spend in downturns
    - high
    - Request churn / downsell history through fundraising slowdowns
  - - Compliance-heavy procurement environment
    - Regulatory complexity can both create demand and slow adoption cycles
    - medium
    - Request sales-cycle length, security-review conversion, and lost-deal reasons by jurisdiction
  notes: The upside case is land-and-expand across funds and modules; the downside case is concentration in a relatively small set of very valuable GP accounts plus opaque channel economics.
