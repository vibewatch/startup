company:
  name: Juniper Square
chapter:
  number: 6
  title: Customers
  summary: 'Juniper Square''s customer base is broad by private-markets-software standards: the company says it supports more than 2,300 GPs, 750,000+ LP accounts, 45,000+ investment entities, and $1 trillion of LP capital, with visible strength in private equity, venture capital, and real estate workflows. Public customer proof is unusually concrete for a private infrastructure vendor, with named references such as Felicis, Tishman Speyer, Satori, Avanath, DVO, Brazos, Staubach, and Rock Mountain, plus strong third-party review scores. The main underwriting gap is durability and concentration: Juniper Square does not publicly disclose NRR, GRR, churn, contract length, or top-customer concentration, while adverse external analysis flags client concentration risk in a relatively concentrated private-markets customer set.'
sections:
- id: customer-segmentation-base-overview
  title: Customer Segmentation & Base Overview
  body: 'Juniper Square''s public customer story is strongest when framed around private-markets general partners rather than generic software seats. The company says its platform now supports more than 2,300 GPs, 750,000-plus LP accounts, 45,000-plus investment entities, and roughly $1 trillion of LP capital. Those metrics point to a multi-sided operating environment in which the buyer is usually the GP''s leadership team across investor relations, finance, or compliance, the day-to-day users include IR, fund-accounting, treasury, and compliance staff, and the downstream beneficiaries include LPs using the investor portal. Segment-wise, Juniper Square is not confined to one asset class: its official surface explicitly targets private equity, venture capital, real estate, real assets, and private credit workflows, while public client-story pages show named firms from VC through institutional real estate. The May 2025 Luxembourg expansion also signals demand from cross-border managers, and
    the retail-investor report suggests an adjacent growth vector tied to private-wealth distribution. In short, the customer base appears segmented by fund strategy, operational complexity, and geography, but unified by a common need for investor-facing workflow infrastructure.'
