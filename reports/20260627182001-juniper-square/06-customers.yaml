  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-freshness
    missingEvidence: Dated deployment milestones and quantified outcomes for the broader named-customer set beyond the freshest 2026 references.
    whyItMatters: Undated case studies are weaker evidence for current production status and expansion durability than dated customer statements or customer-authored references.
    diligencePath: Request customer-reference packet with deployment dates, modules purchased, and current referenceability status for the named logos in TU003.
    relatedQuestionRefs:
    - QU008
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: NRR, GRR, churn, renewal rates, contract length, and cohort retention by segment or product line.
    whyItMatters: Public satisfaction scores and staff continuity proxies are not enough to underwrite the durability of software-plus-services revenue.
    diligencePath: Request retention cohorts, renewal schedule, logo churn, and spend-expansion bridge for software-only versus administration-attached customers.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer ARR share, top-10 customer concentration, ACV distribution, and partner-sourced ARR or bookings mix.
    whyItMatters: The broad GP count may still mask meaningful dependence on a relatively small number of large institutional managers.
    diligencePath: Request customer distribution by ACV band, largest-customer exposure, and direct versus ecosystem-influenced revenue split.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: channel-economics
    missingEvidence: Customer-authored or partner-authored evidence on direct versus integration-enabled deployment economics.
    whyItMatters: Juniper Square clearly benefits from ecosystem leverage, but the public record does not show whether those relationships change win rates, support burden, or gross retention.
    diligencePath: Seek customer references that discuss Yardi, Preqin, or AI-client integrations and request partner-attributed pipeline or ARR disclosures.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
