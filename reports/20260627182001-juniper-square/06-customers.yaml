- id: concentration-risk-adverse-signals
  title: Concentration Risk & Adverse Signals
  body: 'The main adverse angle in the customer chapter is not logo weakness; it is concentration and disclosure opacity. Sacra''s analysis is explicit that private markets remain concentrated among large institutional managers, which creates client-concentration risk if major accounts switch platforms or if fundraising conditions soften and GPs reduce spend. The same source says average revenue per enterprise customer exceeds $700,000 annually, reinforcing the idea that Juniper Square likely serves a relatively small number of very valuable accounts beneath the headline GP count. Public materials do not disclose top-customer revenue share, top-10 ARR, contract length, partner-sourced ARR, or renewal schedules, so concentration can only be assessed qualitatively. Channel dependence does not look like classic reseller dependence, because Juniper Square appears to own the software, administration, and data surface directly, but partner leverage still matters through Preqin, Yardi, DocuSign,
    HubSpot, Outlook, Nasdaq-backed ecosystem credibility, and AI clients such as Claude or Copilot. Regulatory complexity cuts both ways: it increases the need for compliance-heavy workflow tooling, yet it can also slow procurement and expansion when buyers face multi-jurisdiction operating complexity. That leaves Juniper Square with a strong adoption narrative but incomplete disclosure on the downside case.'
