  rows:
  - - Private equity GPs
    - 'Buyer: IR/CFO/ops leader; user: IR, finance, compliance; payer: GP management company'
    - Fundraising, investor reporting, fund administration, treasury
    - Official pages and PE client stories; PE is part of 4 of 5 largest customers by revenue
    - High-value core segment with visible new-customer acceleration
    - No public PE-specific retention or ARR split
  - - Venture capital GPs
    - 'Buyer: partner/ops leader; user: investor-relations and finance staff; payer: GP'
    - Fundraising workflows, LP communications, subscriptions, reporting
    - VC client stories include Felicis and Satori; VC joins PE in top-revenue cohort
    - Important growth and reference segment for fundraising-led workflows
    - No disclosed VC-specific contract terms or NRR
  - - Real estate / real assets managers
    - 'Buyer: fund admin or investor-relations lead; user: admin staff and LPs; payer: GP or sponsor'
    - Investor portal, subscription processing, document delivery, administration
    - Named references include Tishman Speyer, Avanath, DVO, Brazos, Staubach, Rock Mountain
    - Strong proof in admin-heavy, investor-facing workflows
    - Outcome metrics are mostly qualitative and vendor-curated
  - - Cross-border / multi-jurisdiction managers
    - 'Buyer: finance/compliance leadership; user: fund admin and compliance teams; payer: GP'
    - Cross-border fund administration and jurisdiction-aware operations
    - Luxembourg expansion announced in May 2025
    - Supports expansion beyond domestic-only managers
    - No public customer count for Luxembourg deployment
  - - Private credit / adjacent private-markets managers
    - 'Buyer: CFO/operations; user: accounting, treasury, compliance; payer: GP'
    - Loan operations, fund administration, investor reporting
    - Administration page explicitly references private credit and private markets managers broadly
    - Extends TAM beyond classic PE/VC/CRE
    - Limited named proof versus PE/VC/real estate
  - - Retail / wealth-distribution adjacent sponsors
    - 'Buyer: GP distribution leader; user: investor-relations and compliance staff; payer: GP'
    - Handling larger LP populations and investor onboarding complexity
    - Retail-investor report and Preqin industry context indicate adjacent demand vector
    - Potential account-expansion driver as private-wealth access grows
    - Public sources do not yet show named retail-platform customers
  notes: Rows mix directly named customer evidence with company-stated segment coverage; missing economics or retention remain listed as gaps rather than inferred.
