- id: named-customer-evidence-production-deployments
  title: Named Customer Evidence & Production Deployments
  body: 'Juniper Square''s public customer proof is better than a simple logo wall because many references are attached to specific operating outcomes. The official client-story pages name customers such as Felicis Ventures, Tishman Speyer, Satori Capital, Avanath Capital Management, DVO Real Estate, Brazos Residential, Staubach Capital, and Rock Mountain Capital, and most of those blurbs describe concrete fundraising, investor-portal, subscription, or administration workflows rather than vague innovation themes. Felicis is the freshest and highest-quality named proof because the June 2026 Headless GPX announcement quotes the firm''s head of investor relations on using Juniper Square data inside Claude or Copilot. Other references are clearly presented as live customers, but the public record is weaker on precise deployment dates, contract start dates, and quantified renewal history. Third-party reference aggregators reinforce breadth rather than economics: FeaturedCustomers lists dozens
    of testimonials and case studies, which supports that Juniper Square can market a wide base of named references, but it still does not substitute for audited retention or spend-expansion data. Overall, the evidence supports production use in investor onboarding, reporting, and administration-heavy workflows rather than pilots, but outcome specificity remains uneven across the named set.'
