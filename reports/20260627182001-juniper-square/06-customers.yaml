- id: retention-satisfaction-expansion-dynamics
  title: Retention, Satisfaction & Expansion Dynamics
  body: 'Juniper Square''s public durability evidence is strongest on customer satisfaction and switching-cost logic, but weak on true recurring-revenue disclosure. On the positive side, third-party review surfaces are strong: G2 shows a 4.7 out of 5 rating from 106 reviews, FeaturedCustomers shows 4.8 out of 5 from 1,648 reference ratings, and Software Advice corroborates high ease-of-use and customer-support scores. Review text repeatedly praises the investor portal, onboarding workflows, reporting, and responsiveness of customer support. Juniper Square''s own business-model description also supports durability: once a GP has onboarded its funds, investor records, subscription workflows, and administration processes, switching costs should be meaningfully higher than for a single-point CRM. Expansion can also occur when existing GP customers raise new funds or add outsourced administration, treasury, or compliance services. The gap is that none of this is a direct NRR or GRR disclosure.
    The company publishes a 94% annualized retention rate for its fund-accounting and investor-services staff, which is a useful continuity proxy for service delivery, but it is not a customer-retention metric. Adverse review evidence also matters: some users cite onboarding learning curve, side-letter limitations, reporting flexibility issues, and inconsistent staffing in fund administration. Public evidence therefore supports satisfaction and embeddedness, but not fully underwritten renewal economics.'
