callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Public evidence supports following Juniper Square closely, but not paying up without deeper access to
      margin, retention, and cap-table terms.
    claimRefs: [CV041, CV042]
  - calloutType: strength
    title: Premium-asset ingredients are real
    body: >-
      High enterprise account depth, workflow breadth, and switching-cost signals make Juniper Square a credible
      premium private-markets infrastructure asset.
    claimRefs: [CV010, CV015, CV020]
  - calloutType: risk
    title: Multiple compression is the main downside path
    body: >-
      The likely bear case is not operational collapse but slower growth meeting a more public-market-style
      revenue multiple while disclosure remains thin.
    claimRefs: [CV040, CV041, CV046]
