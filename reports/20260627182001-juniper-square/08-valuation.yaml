      - ["Product and moat", "Unified workflows and high switching costs suggest sticky system-of-record behavior", "Workflow breadth can be matched over time by administrators and adjacent platforms bundling software with service", "Provide independent migration-churn and multi-product attach data."]
      - ["Customers", "Average enterprise account revenue above $700K and client stories across PE, VC, and real estate imply deep adoption", "Sacra flags concentration and notes four of five largest customers are PE/VC by revenue", "Disclose revenue concentration and logo retention by cohort."]
      - ["Financials", "Estimated ARR and multiyear growth support scale for a premium private multiple", "No public gross margin, NRR, FCF, or burn data means quality of growth cannot be judged externally", "Share software-services mix, gross margin trend, and retention-backed rule-of-40 style metrics."]
      - ["Competition", "Strategic backing from Ribbit, Fifth Wall, and Nasdaq suggests ecosystem relevance", "Traditional fund administrators and adjacent platforms continue integrating technology and could compress pricing", "Show durable win rates versus Carta, iCapital, Allvue, Yardi, and administration-led bundles."]
      - ["Risk and governance", "Security-compliance signaling plus PMRC governance focus suggest management understands control requirements", "AI rollout raises governance burden and any control failure could damage valuation faster than product progress helps it", "Prove AI controls, incident history, and model-governance maturity in diligence."]
    notes: >-
      Rows are organized around the chapter's required judgment dimensions: market, product, customers,
      financials, competition, and risk.
    claimRefs: [CV010, CV013, CV015, CV016, CV017, CV018, CV020, CV022, CV024, CV025, CV041]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Core assumptions, Valuation range, Probability signal, Downside trigger]
    rows:
      - ["Bull", "2025 ARR compounds at roughly 30 to 35 percent through the next financing window with AI and administration cross-sell supporting better mix and stronger enterprise expansion", "$2.3B-$3.2B", "JunieAI monetization and enterprise attach rates clearly accelerate while governance remains clean", "Any sign that AI usage is broad but non-monetized or that service delivery constrains implementation."]
      - ["Base", "Growth moderates into the 20 to 25 percent range and the market values Juniper Square as a premium vertical platform but not a scarcity asset", "$1.2B-$1.8B", "Customer depth stays healthy and no major control or concentration issue emerges", "Public comps stay compressed and margin disclosure remains limited."]
      - ["Bear", "Growth slows toward 10 to 15 percent because regulation, competition, or customer concentration weakens expansion and buyers pay less for private software opacity", "$0.6B-$0.9B", "Down-round or flat-round logic becomes credible if public markets remain disciplined", "Net retention, margin, or control evidence disappoints before the next liquidity event."]
    notes: >-
      Ranges are scenario outputs rather than direct market quotes and are anchored on the 2025 ARR estimate,
      private-market financing context, and public-comparable compression risk.
    claimRefs: [CV006, CV037, CV038, CV039, CV040, CV046]
  - id: TV004
