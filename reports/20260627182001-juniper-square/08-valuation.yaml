  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Exact liquidation preferences, participation rights, option pool size, and post-Series-D dilution waterfall.
      whyItMatters: Preference overhang can materially change realized return even if enterprise value grows.
      diligencePath: Request current cap table, financing documents, and board-consent summaries from management counsel.
      relatedQuestionRefs: [QV025]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, software-versus-services mix, net revenue retention, burn, and free-cash-flow trajectory.
      whyItMatters: These metrics determine whether a premium ARR multiple is justified and durable.
      diligencePath: Obtain audited financials, KPI deck, and cohort analysis from the CFO room.
      relatedQuestionRefs: [QV026]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Current top-customer revenue concentration and segment mix by ARR.
      whyItMatters: Sacra's adverse concentration note cannot be sized without current exposure data.
      diligencePath: Review top-20 customer schedule with cohort retention and expansion data.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: ai-monetization
      missingEvidence: Paid adoption, pricing uplift, and measurable ROI for JunieAI or headless workflows.
      whyItMatters: AI is a core part of the upside case and a weak monetization profile would undermine the bull case.
      diligencePath: Ask for design-partner outcomes, paid-customer counts, and attach-rate data by module.
      relatedQuestionRefs: [QV013, QV018]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-coverage-tv004
      missingEvidence: Public valuation or transaction detail for additional plausible comparables such as Carta or BlackRock Aladdin.
      whyItMatters: The comparable table is intentionally partial because several relevant private-market workflow assets do not disclose clean standalone valuation data.
      diligencePath: Expand the comparable set with private-market marks or M&A comps if management or specialist databases provide them.
      relatedTableRefs: [TV004]
