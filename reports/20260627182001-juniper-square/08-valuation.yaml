      - ["Target return discipline", "Prefer >2.5x gross MOIC potential from the next entry point", "Private pricing plus dilution/preference uncertainty can erode venture returns quickly", "Wait for clearer upside-to-risk skew before committing."]
    notes: >-
      Summary reflects publicly supportable evidence available on 2026-06-27; target-return discipline is an
      investment-framework view rather than a company-disclosed metric.
