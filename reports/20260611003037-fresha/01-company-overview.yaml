  - id: milestones-commercial-dependencies-and-adverse-signals
    title: Milestones, commercial dependencies, and adverse evidence
    body: >-
      Fresha’s dated public chronology shows a company that has progressively moved from free scheduling software toward a vertically integrated operating system for service businesses. The key milestones supported in the fetched pack are founding in 2015, the 2020 rebrand from Shedul to Fresha, the June 2021 General Atlantic-led Series C, an August 2024 venture-debt marker from J.P. Morgan in database and media sources, the May 2026 KKR round that established a valuation above $1 billion, and the late-May 2026 launch of new marketplace-personalization features such as Service Portfolios and Professional Profiles. Separately, the 2026 consumer-growth announcement says Fresha surpassed 1 million monthly downloads and had become a top-10 lifestyle app globally, which indicates meaningful consumer-discovery momentum rather than a purely back-office merchant tool.

      The adverse evidence is more commercial than existential. Review aggregators show strong overall satisfaction, but they also preserve recurring complaints about the 2025 pricing transition, the 20% marketplace fee for new clients, support delays or lack of phone support, and disputes over whether some clients were genuinely marketplace-sourced. Legal and partner terms deepen that risk framing: Fresha can suspend platform access for unpaid balances, places chargeback responsibility on partners, routes payments through Fresha-controlled payment services, and applies new-client-fee logic based on specific booking-link flows. None of that disproves product-market fit; instead, it highlights a core underwriting issue for later chapters — Fresha’s growth model appears effective, but partner economics and platform dependence are an integral part of how that growth is monetized.
