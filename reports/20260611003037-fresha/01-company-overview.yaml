  - id: founders-leadership-and-governance
    title: Founders, leadership visibility, governance, and key-person dependence
    body: >-
      Founder visibility in the reviewed pack is concentrated around William Zeqiri and Nicholas Miller. Company-backed funding announcements identify Zeqiri as Founder and CEO and Miller as Co-Founder and Chief Product Officer, and the May 2026 KKR announcement also surfaces two additional named executives: Marcin Dąbrowski as Deputy Chief Product Officer and Paweł Iwanów as Chief Payments Officer. That is useful because it shows some operating depth beyond the two founders, especially around product and payments, but it still falls well short of a full governance picture.

      Public governance disclosure remains thin. The fetched materials do not provide a current board roster, director biographies, voting-right structure, or a clean investor-control map. For diligence, that creates a straightforward interpretation: Fresha clearly has credible founder continuity and enough executive specialization to support a scaled product and payments operation, yet decision rights still appear concentrated in a small, founder-led circle from the standpoint of public evidence. Key-person dependence therefore looks material, especially because the company’s product strategy, partner economics, and external narrative are all closely associated with Zeqiri and Miller. A later diligence phase should request the board list, ownership concentrations, investor-rights summary, and succession depth for product, payments, and commercial leadership.
    claimRefs:
      - CO013
      - CO014
      - CO015
