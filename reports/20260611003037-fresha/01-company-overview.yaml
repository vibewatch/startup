  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: A current board roster, committee structure, ownership concentrations, investor-rights summary, and executive succession map.
      whyItMatters: Public founder continuity is clear, but oversight quality and control concentration cannot be assessed without formal governance documents.
      diligencePath: Request the board list, cap table, voting agreements, information-rights summary, and executive org chart.
      relatedQuestionRefs:
        - QO010
      relatedTableRefs:
        - TO002
    - type: conflicting-data
      severity: material
      topic: funding-reconciliation
      missingEvidence: A capital-stack bridge reconciling the official $285 million total with database-oriented $295 million totals and clarifying the treatment of the reported 2024 J.P. Morgan debt facility.
      whyItMatters: Investors and lenders cannot be underwritten cleanly until equity, debt, and total-raised figures are made consistent.
      diligencePath: Request financing closing memos, debt agreements, and a round-by-round capital table including debt classification.
      relatedQuestionRefs:
        - QO018
      relatedTableRefs:
        - TO001
        - TO003
        - TO004
    - type: private-evidence-only
      severity: material
      topic: revenue-headcount
      missingEvidence: Audited or management-reported revenue, gross margin, headcount, retention, and cohort economics that verify the third-party run-rate and staffing estimates.
      whyItMatters: Fresha’s scale is clear, but valuation durability depends on revenue quality, labor efficiency, and partner retention rather than booking volume alone.
      diligencePath: Request the latest board deck, monthly KPI pack, audited financials, and headcount by function and geography.
      relatedQuestionRefs:
        - QO020
      relatedTableRefs:
        - TO001
    - type: enumeration-incomplete
      severity: material
      topic: stakeholder-map
      missingEvidence: A full shareholder register, lender schedule, and economics for strategic partners and payments counterparties.
      whyItMatters: The public stakeholder map is useful directionally but incomplete for judging concentration, governance leverage, and platform-counterparty dependence.
      diligencePath: Request the full cap table, debt schedule, major commercial contracts, and payment-processing economics.
      relatedQuestionRefs:
        - QO013
        - QO017
      relatedTableRefs:
        - TO003
