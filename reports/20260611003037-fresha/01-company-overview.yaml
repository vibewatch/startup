  - id: funding-history-and-capital-structure
    title: Funding history, valuation, investors, and capital structure
    body: >-
      The best-supported public financing markers are June 2021 and May 2026. In June 2021, Fresha announced a $100 million Series C led by General Atlantic, with strategic participation from Huda Kattan of HB Investments, Michael Zeisser of FMZ Ventures, Jonathan Green of Lugard Road Capital, and follow-on participation from Partech, Target Global, and FJ Labs. That release said total fundraising had reached $132 million and positioned Fresha as a fast-scaling, subscription-free beauty-and-wellness software platform with embedded payments and marketplace bookings. In May 2026, company-backed and independent coverage converged again around an $80 million KKR growth investment at a valuation above $1 billion, which pushed Fresha into unicorn territory and brought official total capital raised to $285 million.

      Capital structure beyond those headline rounds is less cleanly disclosed. Third-party database and media sources point to a $30.8 million or roughly $31 million venture-debt facility from J.P. Morgan in August 2024 and suggest earlier seed, Series A, Series B, and a 2021 Series C extension, but those details are not all corroborated by primary materials in the fetched pack. That matters because one database-oriented source reports $295 million total funding including debt, while Fresha’s official 2026 announcement says $285 million total raised. The gap is small enough to be plausible if debt classification differs, but it is still a real reconciliation issue. Investors most consistently visible across the reviewed record are KKR, General Atlantic, Partech, Target Global, FJ Labs, HB Investments, and J.P. Morgan as a lender rather than an equity sponsor.
