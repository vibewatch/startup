callouts:
  - calloutType: strength
    title: Fresha has crossed from vertical SaaS story into infrastructure-scale platform story
    body: >-
      The combination of 35 million monthly appointments, more than $15 billion in annual GMV, 1 billion-plus lifetime bookings, and an investor like KKR backing a profitable business indicates that Fresha is being underwritten as scaled transaction infrastructure, not as a small niche scheduling tool.
    claimRefs:
      - CO020
      - CO021
      - CO022
      - CO023
  - calloutType: risk
    title: Partner economics are a feature of the model, but also a source of churn risk
    body: >-
      Review and pricing sources repeatedly flag the same issue: Fresha’s free-to-start positioning can become materially more expensive once marketplace acquisition, payment processing, subscriptions, and support friction are layered in. That makes partner satisfaction highly sensitive to whether Fresha is truly delivering incremental demand and operational leverage.
    claimRefs:
      - CO028
      - CO039
      - CO040
      - CO041
      - CO043
  - calloutType: insight
    title: The main diligence challenge is not whether Fresha has scale, but how durable and profitable that scale is
    body: >-
      The source pack strongly supports platform reach, transaction volume, and investor quality. The unresolved questions are instead around revenue quality, partner retention, board oversight, and exact capital-stack history.
    claimRefs:
      - CO032
      - CO033
      - CO034
      - CO035
      - CO037
