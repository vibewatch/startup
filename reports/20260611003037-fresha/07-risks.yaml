  - id: TR002
    title: Operational / quality / security risk register
    notes: >-
      Rows emphasize merchant-operating pain points seen in public reviews and pricing
      analyses rather than unverified breach claims.
    columns:
      - Failure mode
      - Why it matters
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
    rows:
      - - Billing and support breakdown during pricing transition
        - SMB merchants are highly fee sensitive; review sources mention weak support reachability, invoice frustration, and dissatisfaction with the new billing model.
        - High
        - High
        - Mixed; aggregate ratings remain strong and Trustpilot says Fresha responds to most negative reviews, but adverse complaints remain specific and recurring.
        - High until management shows billing-ticket volume, first-response SLA, and churn after price changes.
      - - Login / identity / workflow reliability issues
        - Trustpilot includes complaints that OAuth breaks with Google and account recovery or duplicate-account handling can interfere with operations and fee attribution.
        - Medium
        - High
        - Partial; positive reviews show support can resolve account issues, but the failure mode clearly exists.
        - Need auth incident metrics, root-cause logs, and the percentage of billing disputes tied to duplicate or locked accounts.
      - - No-show and card-on-file collection failures
        - Capterra reviewers report that cards on file may still fail when enforcing no-show or cancellation charges, weakening a key merchant workflow.
        - Medium
        - Medium
        - Partial; Fresha offers deposits and card storage, but public success-rate data is absent.
        - Diligence should request no-show charge success rates, failed authorization reasons, and partner refund or retry workflows.
      - - Merchant sticker shock from layered fees
        - Independent pricing analysts say subscription, marketplace, SMS, and processing costs can stack well above the headline plan price.
        - High
        - High
        - Low-to-moderate; Fresha discloses legal fee mechanics but public pricing communication remains inconsistent across third-party explainers.
        - Residual risk stays high until Fresha shows blended merchant bill curves and churn segmented by fee intensity.
      - - Hardware and payments-operations load
        - Fresha actively markets card terminals for small businesses, which extends the support surface beyond pure software into devices and payment operations.
        - Medium
        - Medium
        - Early; official evidence confirms the hardware and payment surface exists, but no public uptime or hardware-support metrics are available.
        - Need terminal deployment counts, processor incident history, and replacement or downtime SLA data.
