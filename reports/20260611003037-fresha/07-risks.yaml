  - id: financial-opacity-and-execution
    title: Financial opacity and people / execution risk
    body: >-
      Fresha's strongest risk mitigant is that it is clearly not a pre-scale experiment.
      Company-backed and independent 2026 coverage agree on a fresh $80 million KKR round at a
      valuation above $1 billion, profitability, roughly 130,000 business customers, 35 million
      monthly appointments, and more than $15 billion in annual GMV. That matters because it
      gives management capital and operating leverage that many weaker SMB software peers lack.
      The problem is that the public package still leaves investors underwriting the business
      from the outside in. Tech Funding News adds a $140 million-plus revenue run-rate, 60%
      growth, and about 500 employees across a multi-office footprint, but no retained source
      here provides audited take rate, revenue mix by subscriptions versus payments versus
      marketplace, gross margin, partner churn, customer concentration, cash balance, or debt
      covenant detail. That gap turns execution into the central judgment call. Scaling support,
      compliance, pricing communication, and partner operations across 120 countries is
      feasible, but it is not trivial. The kill criteria therefore should focus less on
      absolute growth and more on whether billing disputes, compliance exceptions, merchant
      churn, or support deterioration accelerate faster than management can absorb them.
    claimRefs:
      - CR030
      - CR031
      - CR040
      - CR041
      - CR042
      - CR046
    tableRefs:
      - TR004
tables:
  - id: TR001
    title: Regulatory / legal risk register
    notes: >-
      Severity reflects investment consequence, not only legal probability; the table focuses
      on the public legal and quasi-regulatory obligations visible in this run.
    columns:
      - Risk
      - Public evidence
      - Likelihood
      - Severity
      - Current mitigation evidence
      - Residual exposure / diligence path
    rows:
      - - Cross-border privacy and transfer compliance
        - Privacy notice says Fresha is controller for UK/EU users in some contexts, shares data with partners and service providers, and may transfer data outside the UK/EEA as it grows.
        - High
        - High
        - Published privacy notice, opt-out mechanics, and named supervisory path via the ICO show a formal compliance baseline exists.
        - Need DPA set, RoPA, subprocessor list, retention schedule, SCC/IDTA pack, and any regulator correspondence by jurisdiction.
      - - Commercial-agent and chargeback-liability mismatch
        - Terms say Fresha collects payments as commercial agent, while partner terms make merchants responsible for chargebacks and certain repayment obligations after refunds.
        - High
        - High
        - Roles and settlement mechanics are contractually documented rather than informal.
        - Underwrite dispute-loss rates, reserve practices, refund clawback frequency, and merchant litigation or complaint history before leaning on payments revenue quality.
      - - Deposit / cancellation / no-show enforcement risk
        - Consumer terms allow deposits and charges up to 100% of appointment value under partner policies, increasing room for customer disputes and card complaints.
        - Medium
        - High
        - Terms push policy disclosure to partner contracts and allow client complaints to be escalated to Fresha.
        - Review cancellation-policy implementation, refund overrides, card-network dispute data, and complaint escalation SLAs.
      - - Subscription-fee collection and new-client attribution disputes
        - Partner terms require subscription fees for bookable staff and say new-client fees depend on correct Book Now / Order Now link usage, with responsibility pushed to merchants.
        - High
        - Medium
        - Billing rules are explicitly documented and Fresha can invoice, set off balances, or suspend access.
        - Need fee-dispute volumes, appeal workflow, merchant communications, and churn by billing-event cohort.
      - - Processor / AML / fraud-obligation spillover
        - Privacy notice references KYC and anti-money-laundering obligations, while terms rely on external processors and payment rails.
        - Medium
        - Medium
        - Published policies show Fresha recognizes regulated payment and fraud obligations.
        - Request payments compliance ownership, processor contracts, fraud-rate reporting, and any card-network or regulator notices.
    enumerationScope:
      coverage: exhaustive
      basis: Covers the full legal and quasi-regulatory risk set visible in the retained public source pack for this chapter.
