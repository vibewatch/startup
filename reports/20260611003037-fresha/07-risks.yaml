company:
  name: Fresha
chapter:
  number: 7
  title: Risks
  letter: R
  key: risks
  summary: >-
    Fresha's risk stack is led by cross-border privacy and payments-liability exposure,
    then by merchant-price backlash and competitive switching risk, with financial opacity
    and execution scale close behind. The company has genuine scale, profitability, and
    strong product breadth, but the public record still leaves investors underwriting a
    global SMB platform whose billing mechanics, partner liability transfer, and detailed
    economics are not fully disclosed.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and kill-criteria framing
    body: >-
      The highest-residual Fresha risks are not generic startup noise. First is legal and
      regulatory exposure around privacy, payments, and liability allocation. Fresha is the
      data controller for UK and EU users in some contexts, moves data outside the UK and EEA,
      uses profiling for personalized marketing, and shares information with partners,
      processors, service providers, marketing counterparts, and public authorities where
      required. At the same time, its terms make clear that Fresha acts as commercial agent,
      collects funds, invoices merchants, and still pushes chargebacks and much of the
      underlying service liability back to partners. Second is merchant backlash and churn
      risk: independent pricing and review sources repeatedly describe fee shock, support
      friction, invoice disputes, and confusion after the 2025 shift away from the old
      free-core story. Third is competitive switching risk, because Square, Mindbody, Booksy,
      Vagaro, and StyleSeat all market discovery, payments, staff, and migration or switching
      support to the same SMB audience. Fourth is financial-model opacity and people execution:
      public sources support meaningful scale and profitability, but not audited take rate,
      margin, churn, cash, or debt detail. The investment case only works if compliance,
      support quality, and merchant retention remain stronger than the complaints imply.
    claimRefs:
      - CR030
      - CR031
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046
