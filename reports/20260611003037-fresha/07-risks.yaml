  - id: operational-customer-and-competitive-risks
    title: Operational, customer, partner, and competitive risks
    body: >-
      Operationally, Fresha's public evidence is mixed rather than catastrophic. Review
      aggregates remain strong, but the adverse signal clusters in exactly the places that
      matter for an SMB software-and-payments platform: support responsiveness, login
      reliability, billing clarity, and new-client fee attribution. Trustpilot contains both
      strong support praise and complaints about broken OAuth, weak invoicing access after
      cancellation, and dissatisfaction with new subscription billing. Capterra and
      SchedulingKit add a similar pattern, with no-show card failures, support gaps, vendor
      lock-in to Fresha payments, and repeated frustration about the 20% new-client charge.
      Those issues matter because Fresha serves a market where small and individual operators
      still dominate spend, and Zenoti's benchmark data shows growth is uneven across business
      types. That makes merchants more sensitive to fee layering and easier to win away if
      competitors offer clearer economics. On that front, the competitor set is real. Square,
      Mindbody, Booksy, Vagaro, and StyleSeat all market integrated payments, discovery, growth
      tooling, and in some cases migration or switching help. Fresha still has product breadth
      and marketplace scale, but the evidence suggests its moat is convenience and installed
      workflow, not an unassailable technical monopoly. If pricing confusion and service
      friction persist, rivals have credible openings.
