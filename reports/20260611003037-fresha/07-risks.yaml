  - id: TR003
    title: Partner / dependency risk register
    notes: >-
      Dependencies mix explicit vendors, commercial rails, and market-structure dependencies;
      concentration is qualitative because public counterparty volumes are undisclosed.
    columns:
      - Dependency
      - Counterparty / node
      - Role
      - Concentration read
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Fresha Payments stack
        - Payment processors and settlement rails
        - Card processing, payout, deposit, no-show, and refund workflows
        - High but undisclosed
        - Processor errors, reserve tightening, or dispute spikes impair settlement quality and partner trust.
        - High
        - Legal terms and payment pages show the stack is deeply integrated into the product.
        - Need processor concentration, reserve terms, dispute rates, and outage history.
      - - Messaging vendors
        - Twilio / SendGrid
        - SMS reminders, marketing, and email delivery
        - High for communications
        - Messaging disruption hurts reminders, confirmations, and campaign ROI, raising no-shows and support tickets.
        - Medium
        - Partner terms explicitly disclose third-party messaging suppliers, so the dependency is at least recognized.
        - Request fallback vendors, delivery failure rates, and concentration by region.
      - - Marketplace attribution logic
        - Book Now / Order Now link rules
        - Determines when new-client fees apply
        - High
        - Attribution errors or ambiguous client ownership trigger fee disputes and merchant churn.
        - High
        - Partner terms codify the logic and exempt some partner-owned links.
        - Need false-positive rate, dispute appeal outcomes, and merchant retention after attribution conflicts.
      - - SMB demand base
        - Small and individual beauty / wellness operators
        - Primary revenue and usage cohort
        - High
        - Economic softness or pricing fatigue among small merchants raises churn and reduces payment volume.
        - High
        - Fresha has scale and product breadth, which can help defend value if support quality is high.
        - Residual risk remains high because SMBs are numerous, heterogeneous, and price sensitive.
      - - Alternative all-in-one platforms
        - Square, Mindbody, Booksy, Vagaro, StyleSeat
        - Provide substitute scheduling, payments, discovery, and growth tools
        - High
        - Competitors offer trials, marketplaces, migration help, or switching promises that lower replacement friction.
        - High
        - Fresha still has large scale and a broad product surface.
        - Need win/loss, churn-to-competitor, and net revenue retention data to judge switching resistance.
