  - id: TR004
    title: People / execution risk register
    notes: >-
      The risk is organizational complexity rather than named-key-person drama; public evidence
      is better on footprint than on internal control owners.
    columns:
      - Role / function
      - Dependency or gap
      - Likelihood
      - Severity
      - Existing mitigation
      - Diligence path
    rows:
      - - Compliance / privacy leadership
        - Global controller and processor boundaries and transfer obligations expand as Fresha scales across regions.
        - Medium
        - High
        - Published privacy policies and formal legal docs indicate the function exists.
        - Request org chart, DPO or privacy leadership, and jurisdiction ownership matrix.
      - - Payments risk operations
        - Dispute management, reserves, refunds, and merchant collections are central but publicly under-disclosed.
        - High
        - High
        - Contractual settlement logic is detailed and the company is already profitable, suggesting some operating maturity.
        - Need dispute-loss KPIs, reserve policy, and staffing for payments support and risk.
      - - Customer support and onboarding
        - Review complaints show support inconsistency despite many positive interactions.
        - High
        - Medium
        - Strong aggregate ratings and rapid replies on Trustpilot show the team can work well.
        - Ask for ticket backlog, response SLA, first-contact resolution, and onboarding staffing by geography.
      - - Pricing / product communication
        - Third-party explainers still disagree on whether Fresha is free, paid, or hybrid after the 2025 change.
        - High
        - Medium
        - Company scale and multiple official surfaces give management room to clarify packaging.
        - Review pricing change timeline, merchant communication tests, and churn or downgrade metrics after plan changes.
      - - Cross-office execution coordination
        - About 500 employees and multiple offices must keep product, support, compliance, and GTM aligned across 120 countries.
        - Medium
        - Medium
        - Fresh capital, profitability, and global footprint suggest some execution muscle.
        - Request management cadence, regional P&L ownership, and escalation paths for incidents and billing issues.
    claimRefs:
      - CR030
      - CR031
      - CR040
      - CR042
      - CR046

  - id: TR005
    title: Mitigation and kill criteria table
    notes: >-
      Kill criteria are framed as observable events that an investor can monitor before full
      audited metrics are available.
    columns:
      - Risk
      - Monitor
      - Threshold / event
      - Action implication
    rows:
      - - Privacy / regulatory failure
        - Complaints, regulator contact, or forced policy changes
        - Any disclosed ICO or equivalent inquiry, material remediation program, or cross-border transfer breakdown
        - Pause conviction and escalate full privacy diligence before underwriting expansion.
      - - Chargeback / billing-liability blowback
        - Merchant disputes and collections friction
        - Evidence that chargeback losses, refund clawbacks, or fee disputes rise faster than appointment or GMV growth
        - Treat payments revenue quality as impaired and haircut margin assumptions.
      - - Pricing backlash and churn
        - Partner cancellations, downgrade behavior, and complaint density
        - Sustained churn spike or elevated complaint volume after plan or fee changes
        - Assume weaker NRR and reduce willingness to pay a premium multiple.
      - - Competitive switching
        - Migration offers and competitor win stories in the SMB base
        - Meaningful merchant movement toward Square, Booksy, Mindbody, Vagaro, or StyleSeat in key cohorts
        - Re-rate moat from workflow lock-in to commodity parity until retention data proves otherwise.
      - - Support / auth reliability
        - Ticket backlog and login or duplicate-account incidents
        - Repeated OAuth, account-access, or invoice-access failures that interrupt booking or settlement workflows
        - Require operational KPI pack before proceeding.
      - - Financial opacity
        - Management willingness to provide audited economics
        - No clear disclosure of take rate, margin, churn, and cash during diligence
        - Move to research-more or price-discipline stance rather than underwriting upside from headline scale alone.
    claimRefs:
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual risk clusters in privacy and commercial-liability, merchant pricing backlash,
      and competitive switching rather than in simple market demand.
    data:
      columns:
        - Low impact
        - Medium impact
        - High impact
      rows:
        - label: High likelihood
          values:
            - label: Routine feature complaints
              tone: neutral
              detail: Normal product gripes should not break the thesis on their own.
            - label: Support inconsistency
              tone: risk
              detail: Public reviews already show meaningful variation in billing and support quality.
            - label: Pricing backlash / churn
              tone: risk
              detail: Layered fees and attribution disputes could push SMB merchants to cheaper alternatives.
        - label: Medium likelihood
          values:
            - label: Hardware / terminal friction
              tone: neutral
              detail: Payments hardware adds support burden but may be manageable with adequate ops.
            - label: Competitive switching
              tone: risk
              detail: Competitor migration and trial offers lower switching friction for price-sensitive merchants.
            - label: Chargeback / liability shock
              tone: risk
              detail: Dispute losses or refund clawbacks could quickly damage partner trust and economics.
        - label: Low likelihood
          values:
            - label: Modest market slowdown
              tone: neutral
              detail: Uneven sector growth hurts sentiment, but not necessarily the full platform.
            - label: Execution stretch across offices
              tone: neutral
              detail: Cross-office coordination is manageable if KPI discipline remains strong.
            - label: Privacy / regulatory event
              tone: risk
              detail: A material privacy enforcement event would be immediately thesis-breaking even if base probability is lower.
    claimRefs:
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046

