company:
  name: Fresha
chapter:
  number: 8
  title: Valuation
  letter: V
  key: valuation
  summary: Fresha has enough public proof to justify a serious watchlist position—an $80 million KKR primary round at a $1 billion-plus valuation, profitability, more than $15 billion of annual GMV, and more than 35 million monthly appointments—but not enough audited financial disclosure to justify a fresh buy at that price. The most supportable public stance is track with medium confidence, high risk, and a stretched valuation view until management proves that the post-2025 pricing model is durable, that the implied revenue multiple is warranted, and that debt and preference overhang are modest.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: 'The public financing record is good enough to anchor a price discussion, but not good enough to close one. Fresha’s May 2026 KKR transaction is a real late-stage validation signal: company-backed and independent coverage align on an $80 million primary investment at a valuation above $1 billion, total capital raised of $285 million, and an already-profitable business. That is not seed-stage narrative funding. It is evidence that a blue-chip growth investor saw a scaled platform with real operating proof. The same retained source pack also shows more than 35 million monthly appointments, more than $15 billion of annual GMV, and more than 130,000 businesses on platform, which means the company clearly has enough throughput to matter.


    The price-discipline problem is that transparency is still much thinner than the valuation headline. The strongest public revenue anchor in this run is a third-party report that says Fresha is at a $140 million-plus revenue run-rate growing over 60% annually. If that estimate is directionally right, the current unicorn mark screens at a little over 7x revenue—defensible for a profitable, marketplace-plus-payments platform, but not obviously cheap given the limited public disclosure on take rate, gross margin, churn, cash, debt, and liquidation preferences. Review sources also show pricing backlash after the 2025 shift away from the old free-core story. The IC-ready conclusion is therefore track, not buy: follow closely, but do not pay through the current mark without private diligence or a better entry.'
