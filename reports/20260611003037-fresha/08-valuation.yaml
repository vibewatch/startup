- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue reaches roughly $180M-$220M, pricing transition sticks, payment and marketplace attachment deepen, AI-led discovery improves conversion.
    - Estimated $1.3B-$1.8B value at ~7x-8x revenue; about 1.3x-1.8x gross versus a >$1B current reference over 3-5 years.
    - Competition, monetization backlash, and limited disclosure still matter.
    - Possible, but requires diligence to confirm that the third-party revenue anchor is conservative.
  - - Base
    - Revenue lands near $140M-$160M, profitability holds, but growth normalizes and the market values Fresha like a mixed software-payments asset.
    - Estimated $0.8B-$1.1B at ~6x-7x revenue; roughly flat to modest upside before dilution.
    - Little margin for error if retention or payment economics disappoint.
    - Most supportable case on current public evidence.
  - - Bear
    - Revenue settles near $110M-$130M after churn, pricing pushback, or lower take-rate realization; multiple compresses with weaker trust.
    - Estimated $0.4B-$0.6B at ~3.5x-4.5x revenue; about 0.4x-0.6x versus the current reference.
    - Down-round risk, debt or preference overhang, and competitive repricing.
    - Material downside tail if public opacity hides weaker fundamentals.
  notes: All scenario values are analytical estimates anchored to the retained source pack; Fresha has not publicly disclosed audited current revenue in this run.
