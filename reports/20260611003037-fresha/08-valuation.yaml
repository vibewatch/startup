- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof breaks
    - Audited diligence shows current revenue materially below the $140M+ third-party run-rate or growth already rolling over.
    - The current unicorn mark would lose its core numerical support.
    - Do not pay the current price; re-underwrite from the bear range.
  - - Pricing backlash worsens
    - Logo churn or GPV retention declines materially after the 2025 pricing shift.
    - The model would look less like durable software monetization and more like short-lived fee extraction.
    - Move from track to avoid until retention stabilizes.
  - - Attribution disputes stay systemic
    - Marketplace-fee disputes remain frequent and refund/override controls look weak.
    - Partner trust and acquisition economics would both be impaired.
    - Assume lower take-rate durability and haircut scenario multiples.
  - - Cap table or debt is worse than expected
    - Debt, reserves, ratchets, or senior preferences materially subordinate new equity.
    - Common-equity downside becomes worse than simple EV/revenue math implies.
    - Pause unless the structure is cleaned up or the price resets.
  - - Competitive pricing pressure intensifies
    - Booksy, StyleSeat, Square, Vagaro, or Mindbody win business by offering a cleaner economic story.
    - Fresha would face a lower monetization ceiling and weaker merchant willingness to absorb fees.
    - Treat as a thesis break for premium-multiple underwriting.
  notes: Kill triggers focus on price-sensitive failure modes rather than general operating noise.
