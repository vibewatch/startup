- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited revenue bridge
    - 2025 and LTM 2026 revenue by subscriptions, payments, marketplace, and other services.
    - Without this, the current mark cannot be tied to durable net revenue.
    - Request CFO data room and auditor-backed bridge.
  - - Net payments economics
    - Processed volume, payment attach, gross-to-net take rate, refunds, chargebacks, and reserve obligations.
    - These determine whether Fresha deserves software-like or payments-like valuation treatment.
    - Request payments KPI deck plus processor and treasury summary.
  - - Pricing-transition retention
    - Merchant retention, churn reasons, and GPV retention before and after the 2025 shift to paid tiers.
    - This is the central test of whether monetization improved or damaged the franchise.
    - Request cohort analysis from finance and customer success.
  - - Debt and cap table
    - Current debt balance, maturity, covenants, preference stack, participation rights, and pro-rata terms.
    - Downside protection cannot be modeled from public evidence alone.
    - Request legal summary, cap table, and financing documents.
  - - Unit economics
    - Gross margin by stream, support cost, CAC, payback, and marketplace attribution overrides/refunds.
    - These metrics decide whether the business deserves a premium multiple or only a mixed-commerce discount.
    - Request board KPI pack and cohort model.
  - - Exit readiness
    - Any banker preparation, strategic inbound, or board-approved financing / exit workstream.
    - Fresh capital and profitability help, but there is no public proof of immediate public-market readiness.
    - Request CEO/CFO session and process map.
  notes: The first four rows are hard blockers to underwriting a fresh entry above the current unicorn reference.
