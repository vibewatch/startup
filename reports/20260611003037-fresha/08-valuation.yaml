  rows:
  - - Fresha 2026 KKR round
    - Current company-specific price reference
    - '>$1B valuation on an $80M primary round; if the $140M+ third-party revenue run-rate is directionally right, the implied multiple is >7x revenue.'
    - Best available live private mark for the company.
    - Revenue anchor is third-party, not audited by Fresha in the retained pack.
  - - Fresha 2021 Series C / extension
    - Historical financing marker
    - Official 2021 Series C was $100M with $132M total raised; InforCapital also cites a later 2021 extension at a $640M valuation.
    - Shows that Fresha rerated substantially before the 2026 unicorn step-up.
    - Historical mark from a different monetization era and partly from a third-party database.
  - - Booksy
    - Beauty-marketplace operating benchmark
    - Officially $29.99/month + $20 per additional user; no valuation disclosed in the retained pack.
    - Closest direct beauty-software marketplace packaging reference.
    - Useful for pricing context, not for a direct valuation multiple.
  - - Square Appointments
    - Broader commerce-stack benchmark
    - Custom pricing path starts above $250K annual processing; no standalone valuation disclosed for Appointments.
    - Shows the ecosystem alternative merchants can choose instead of Fresha.
    - Not a pure-play beauty marketplace and not a standalone comp with its own disclosed multiple.
  - - StyleSeat
    - Solo-pro growth benchmark
    - Flat $35/month with no hidden fees claimed; no public valuation in the retained pack.
    - Good reference for cleaner pricing and AI-led solo-professional positioning.
    - Narrower product scope and customer base than Fresha.
  - - Mindbody / Vagaro
    - Scaled operating benchmarks
    - Mindbody cites 3M active users, 40K+ businesses, and 600M annual bookings; Vagaro cites 300K professionals and 162M appointments in 2025, but no current public valuations in this pack.
    - Useful operating-context references for scale and category positioning.
    - The retained pack lacks live valuation marks or multiples for either business.
