    severity: material
    topic: net payments economics
    missingEvidence: Processed-payments volume, attach rate, gross-to-net take rate, chargeback burden, and processor economics.
    whyItMatters: The right valuation lens depends on how much of Fresha’s economics are durable software revenue versus lower-multiple payments revenue.
