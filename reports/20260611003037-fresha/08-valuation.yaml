  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: audited revenue bridge
    missingEvidence: Audited 2025 and LTM 2026 revenue by stream plus gross margin by line.
    whyItMatters: Without audited revenue and margin, the implied multiple behind the current unicorn mark remains too fragile for a buy call.
    diligencePath: Request CFO data room, audit bridge, and management discussion of revenue recognition by stream.
    relatedQuestionRefs:
    - QV017
    - QV018
    - QV019
    - QV025
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: debt and preference stack
    missingEvidence: Current debt balance, reserve obligations, liquidation preferences, participation rights, and cap-table waterfall.
    whyItMatters: Equity downside cannot be modeled from enterprise-value scenarios alone if hidden seniority or debt exists.
    diligencePath: Request legal financing documents, debt schedule, and cap-table summary before discussing entry price.
    relatedQuestionRefs:
    - QV022
    - QV025
    - QV030
  - type: private-evidence-only
    severity: material
    topic: pricing-transition retention
    missingEvidence: Merchant retention, GPV retention, churn reasons, and refund/override rates before and after the 2025 pricing shift.
    whyItMatters: This is the central test of whether Fresha’s new monetization model improved economics or damaged trust.
    diligencePath: Request cohort retention analysis from finance and customer-success leaders.
    relatedQuestionRefs:
    - QV010
    - QV011
    - QV012
    - QV019
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
