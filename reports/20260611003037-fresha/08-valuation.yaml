- id: triggers-exit-readiness-and-final-diligence
  title: Thesis-Break Triggers, Exit Readiness, and Final Diligence
  body: 'Exit readiness is improving, but only as a signal. Fresha has fresh institutional capital, a profitable narrative, and a product roadmap that leans into AI and discovery, all of which help support another late-stage private round or a future strategic process. But no retained source in this run shows an S-1, prospectus, IPO timetable, or the kind of audited KPI package public investors would need. On today’s evidence, the more realistic exit framing is continued private financing discipline or eventual strategic optionality, not near-term public-market readiness.


    The kill triggers are monitorable. The thesis breaks if audited diligence shows that current revenue is materially below the third-party run-rate, if merchant retention deteriorated after the pricing shift, if hidden leverage or preference seniority meaningfully subordinates new money, or if competitive pricing pressure from Booksy, StyleSeat, Square, Vagaro, or Mindbody forces Fresha to trade customer growth for lower monetization. The final diligence agenda therefore has to be financially specific: audited revenue by stream, net payments economics, churn before and after the pricing transition, debt and reserve obligations, and the full cap-table waterfall. Until that package is on the table, Fresha is a serious company worth tracking—not a public-evidence buy.'
