  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Theme
      - Bull evidence
      - Anti-thesis / unresolved issue
      - What would change the view
    rows:
      - - Scale and proof
        - 35M+ monthly appointments, >$15B annual GMV, 130K+ businesses, and profitability support real platform weight.
        - Scale proof does not substitute for audited revenue, margin, and retention data.
        - Provide audited 2025 and LTM 2026 revenue by stream plus gross margin by line.
      - - Market structure
        - The category is growing as unified cloud, embedded payments, and AI converge in one workflow stack.
        - Zenoti's 2024 benchmark shows only 2% overall revenue growth, so not every operator is compounding fast.
        - Show Fresha's share gains and cohort growth versus category averages.
      - - Monetization design
        - Hybrid subscription, payments, and marketplace fees can support higher ARPU than flat scheduling SaaS.
        - The same hybrid design drives fee complexity, pricing backlash, and attribution disputes.
        - Prove that post-2025 monetization improved net revenue retention without harming merchant trust.
      - - Competitive position
        - Fresha still looks differentiated where discovery, workflow, and payments are bought together.
        - >-
          Booksy, StyleSeat, Square, Vagaro, and Mindbody each offer cleaner pricing or stronger niche breadth in parts
          of the market.
        - Demonstrate win rates and churn reasons versus those alternatives.
      - - Valuation lens
        - A profitable, mixed-model vertical platform can justify a premium to plain scheduling software.
        - >-
          Without transparency, the premium could instead be overpaying for a business with marketplace and payments
          friction.
        - Disclose take rate, payment attach, and the full cap-table waterfall.
    notes: >-
      This table separates business-quality evidence from price-quality evidence; both have to work for an investable
      buy case.
