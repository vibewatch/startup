            body: >-
              The best public expansion argument is operational consolidation. Fresha is increasingly selling itself as
              a single system that combines discovery, booking, payments, portfolios, loyalty, and multi-location
              controls, which can deepen wallet share once an account standardizes on the stack. That helps explain why
              enterprise and multi-site operators appear so prominently in 2026 messaging. But public evidence also
              shows the limits of current underwriting. Fresha does not disclose top-customer concentration,
              customer-count concentration by geography, enterprise ACV, renewal rates, or the share of GMV coming from
              a few large accounts. The result is that concentration risk cannot be sized from public materials. Support
              risk is also real: Trustpilot suggests recent chat responsiveness may be improving, yet review platforms
