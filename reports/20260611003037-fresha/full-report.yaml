        - Scaled and profitable with a fresh $80M KKR round, but public valuation support is incomplete.
        - Stay active in diligence, but do not lead or chase at today's price on public evidence alone.
      - - Confidence
        - medium
        - Core scale and financing facts are well supported; revenue quality and cap-table detail are not.
        - Use as a screening view pending private data room access.
      - - Risk rating
        - high
        - Pricing backlash, competition, and transparency can all move fair value quickly.
        - Require downside protections and explicit kill triggers before proceeding.
      - - Valuation stance
        - stretched
        - >-
          Current >$1B mark looks full unless the third-party $140M+ revenue run-rate and profitability claims hold up
          under diligence.
        - Prefer entry only at a better price or with stronger audited proof.
      - - 3-5 year gross return frame
        - ~0.8x-1.8x across base-to-bull
        - Base case offers little upside; bull case requires strong execution and durable monetization.
        - This is a monitor-first opportunity, not a high-conviction buy today.
      - - What changes the call
        - audited proof or reprice
        - Revenue mix, retention, margin, take rate, debt, and preference terms could all move the recommendation.
        - Upgrade only if private diligence materially beats the public record.
    notes: >-
      Public-evidence recommendation only; gross-return framing excludes future dilution and any undisclosed
      preference-stack effects.
