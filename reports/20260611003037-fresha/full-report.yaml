      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real category is operating software plus attached demand and transaction rails
            body: >-
              Fresha and its closest peers do not market a simple calendar. They market a stack that mixes booking, CRM,
              payments, inventory, marketing, and some form of discovery or client acquisition, which makes the relevant
              market broader than scheduling but still narrower than all beauty and wellness spend.
