            title: Fresha has crossed from vertical SaaS story into infrastructure-scale platform story
            body: >-
              The combination of 35 million monthly appointments, more than $15 billion in annual GMV, 1 billion-plus
              lifetime bookings, and an investor like KKR backing a profitable business indicates that Fresha is being
              underwritten as scaled transaction infrastructure, not as a small niche scheduling tool.
