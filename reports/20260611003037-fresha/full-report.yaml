  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and kill-criteria framing
        blocks:
          - type: paragraph
            body: >-
              The highest-residual Fresha risks are not generic startup noise. First is legal and regulatory exposure
              around privacy, payments, and liability allocation. Fresha is the data controller for UK and EU users in
              some contexts, moves data outside the UK and EEA, uses profiling for personalized marketing, and shares
              information with partners, processors, service providers, marketing counterparts, and public authorities
              where required. At the same time, its terms make clear that Fresha acts as commercial agent, collects
              funds, invoices merchants, and still pushes chargebacks and much of the underlying service liability back
              to partners. Second is merchant backlash and churn risk: independent pricing and review sources repeatedly
              describe fee shock, support friction, invoice disputes, and confusion after the 2025 shift away from the
              old free-core story. Third is competitive switching risk, because Square, Mindbody, Booksy, Vagaro, and
              StyleSeat all market discovery, payments, staff, and migration or switching support to the same SMB
              audience. Fourth is financial-model opacity and people execution: public sources support meaningful scale
              and profitability, but not audited take rate, margin, churn, cash, or debt detail. The investment case
              only works if compliance, support quality, and merchant retention remain stronger than the complaints
              imply.
            claimRefs:
              - CR030
