              Review and pricing sources repeatedly flag the same issue: Fresha’s free-to-start positioning can become
              materially more expensive once marketplace acquisition, payment processing, subscriptions, and support
              friction are layered in. That makes partner satisfaction highly sensitive to whether Fresha is truly
              delivering incremental demand and operational leverage.
