  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments, payers, and who actually uses Fresha
        blocks:
          - type: paragraph
            body: >-
              Fresha is not a single-buyer SaaS product; it is a two-sided operating and discovery platform. On one
              side, consumers use the website and app to discover salons, barbershops, spas, medspas, wellness venues,
              and individual professionals, then book and in many cases pay through Fresha. On the other side, partner
              businesses use the software to run calendars, payments, inventory, marketing, and team workflows, while
              individual professionals and front-desk staff are the daily product users. The legal architecture matters
              because it clarifies who pays: partner terms place service fees, subscription fees, invoicing, and
              chargeback exposure on the business account rather than on the consumer. Public company and press
              materials also show that the supply base is not just small salons. Fresha explicitly positions itself for
              independent professionals, owner-operated venues, and increasingly multi-location operators. That mix is
              attractive because it lets Fresha land via free or low-friction operational tooling, then expand through
              discovery, payments, and retention tools as the account becomes more complex.
