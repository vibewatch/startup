      - number: '4.4'
        title: Underwriting gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The investable part of Fresha’s financial story is clear enough: real transaction throughput, clear
              monetization surfaces, multi-product embeddedness in partner workflows, profitability claims, and fresh
              institutional capital from KKR. What remains unclear is almost everything needed to convert that story
              into a clean underwriting model. Public evidence does not disclose net revenue by stream, payments take
              rate, gross margin, support and risk-operations cost, customer concentration, CAC, payback, burn, runway,
              or current debt status. Third-party estimates of a $140 million-plus revenue run-rate and 60%-plus growth
              are directionally useful but not filing-grade and should not be treated as audited financials.

              The adverse evidence matters because it speaks directly to revenue quality. Multiple merchant-review
              sources independently complain about fee complexity, support responsiveness, and marketplace attribution,
              including claims that 20% new-client fees were charged when merchants believed the customer came through
              Google or referral rather than through Fresha discovery. Even where the product wins praise, the message
              is similar: the platform can be commercially effective, but economics are highly sensitive to whether it
              is truly delivering incremental demand and whether the merchant accepts Fresha-controlled payments and fee
              layering. Financially, Fresha screens as a scaled, credible, and probably capital-efficient platform;
              however, without audited revenue mix, margin, and liquidity data, the right underwriting stance is
              constructive on business quality but cautious on revenue durability, predictability, and downside
              protection.
