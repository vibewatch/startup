companyProfile:
  summary: >-
    Fresha is a London-headquartered beauty-and-wellness marketplace and business-management platform founded in 2015 by
    William Zeqiri and Nicholas Miller, originally launched as Shedul and rebranded to Fresha in 2020. Public evidence
    supports a scaled dual-sided model spanning consumer discovery, booking, payments, messaging, marketing, inventory,
    and partner operating workflows for salons, spas, barbershops, medspas, and related service businesses. The
    strongest current financing marker is an $80 million May 2026 KKR primary round at a valuation above $1 billion,
    with company-backed materials also claiming profitability, more than 130,000 partner businesses, more than 35
    million monthly appointments, and more than $15 billion in annual GMV. The core diligence constraint is not demand
    proof but disclosure quality: audited financials, margin, churn, governance, and capital-structure detail remain
    limited in the public pack.
