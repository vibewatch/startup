      - number: '3.2'
        title: Competitor profiles and positioning
        blocks:
          - type: paragraph
            body: >-
              The most important profile distinction is where each platform sits on the spectrum between marketplace-led
              acquisition and operations-led software. Fresha’s strongest profile is an integrated beauty-and-wellness
              marketplace plus payments and business software platform at very large global scale, with 130,000+ to
              140,000+ businesses and 35M+ monthly appointments. Mindbody profiles as the most established
              fitness-and-wellness incumbent, with 3M+ active users, 40,000+ businesses, 600M+ annual classes and
              appointments, and heavy investment in branded apps, marketing, and multi-location controls. Vagaro
              profiles as a broad beauty/wellness/fitness operating system with 300K professionals, 162M appointments in
              2025, and an overtly SMB-to-enterprise positioning supported by API and trust-center surfaces.


              Booksy is the nearest direct peer because it also pairs a beauty-specific marketplace with payments,
              client marketing, and scheduling, but it monetizes with a clearer subscription model and serves a pro
              network of 330,000+ beauty and wellness professionals. Square Appointments is not as beauty-native, yet it
              matters because buyers can choose a broader commerce ecosystem instead of a vertical marketplace.
              StyleSeat is more specialized toward individual beauty professionals and is notable for explicit AI
              marketing, smart pricing, and demand-generation claims. The competitive implication is that Fresha wins
              when buyers want one integrated beauty-and-wellness stack with discovery built in; it is more exposed when
              buyers want deeper fitness/wellness specialization, stronger US-style incumbent tooling, broader commerce
              infrastructure, or a solo-pro growth engine with flatter pricing.
