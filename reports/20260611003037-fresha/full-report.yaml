  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow product definition and module breadth
        blocks:
          - type: paragraph
            body: >-
              Fresha’s product is broader than a salon calendar. The consumer-side platform lets users discover nearby
              beauty and wellness providers, browse professionals and services, and complete bookings through the Fresha
              website or app, while the partner-side system manages the inventory of services, staff, venues, vouchers,
              payments, and follow-up marketing that sit behind those bookings. The legal terms matter here because they
              show Fresha acting as the orchestration layer between clients and partner businesses: partners provide the
              underlying services and products, while Fresha arranges the appointment or order flow and can collect
              payments on the partner’s behalf. In 2026 press materials, Fresha is now describing the bundle as an
              all-in-one booking, payments, and business-management platform with marketplace-led growth, which is
              consistent with independent reviews that describe the system as feature-rich across scheduling, POS,
              inventory, messaging, and team operations.
