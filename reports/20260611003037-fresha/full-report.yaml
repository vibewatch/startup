chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, founding, and business model
        blocks:
          - type: paragraph
            body: >-
              Fresha presents itself as an AI-powered booking marketplace and business-management platform for beauty,
              wellness, and self-care businesses, not merely a point solution for calendar scheduling. The strongest
              legal-footprint evidence comes from Fresha’s terms and privacy materials, which identify the operating
              entity as Fresha.com SV Limited, incorporated in England and registered at 71-75 Shelton Street, London,
              WC2H 9JQ. The strongest company-history evidence then aligns across 2021 and 2026 company-backed
              materials: Fresha was founded in 2015 by William Zeqiri and Nicholas Miller, launched originally under the
              name Shedul, and rebranded to Fresha in 2020 as the company expanded from scheduling software into
              payments, marketplace discovery, and broader operating-system functionality for salons, spas, barbershops,
              clinics, and fitness studios.

              The reviewed materials support a dual-sided model. For consumers, Fresha enables discovery, booking, and
              payment for appointments. For merchants, it supplies booking, client records, marketing, inventory, staff
              management, and integrated payments. The commercial design matters because Fresha repeatedly frames itself
              as combining software, marketplace, and financial services rather than selling a conventional SaaS seat
              license alone. Official and third-party sources agree that monetization has historically leaned on payment
              processing and booking-related fees, with newer subscription elements and AI-led upsell features layered
              on top. That model helps explain rapid merchant adoption, but it also creates a meaningful dependence on
              Fresha-controlled payment and acquisition rails.
