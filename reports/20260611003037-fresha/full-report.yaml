      - number: '8.3'
        title: Scenario Framework and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              Because Fresha does not disclose current audited revenue, every valuation scenario here is explicitly
              estimated rather than observed. The bull case assumes the $140 million-plus third-party revenue run-rate
              is conservative, that the 2025 pricing transition lifts recurring software revenue without damaging
              retention, and that AI-led discovery plus payments attachment keep growth elevated. Under that path,
              roughly $180 million to $220 million of revenue at about 7x to 8x could support a $1.3 billion to $1.8
              billion range over a three-to-five-year hold. The base case is less generous and more useful: if revenue
              settles nearer $140 million to $160 million and the market clears Fresha at about 6x to 7x, fair value
              lands around $0.8 billion to $1.1 billion, which is around the current mark but does not create compelling
              upside after dilution.


              The bear case matters because the downside triggers are visible in the source pack. If merchant backlash
              to new fees lifts churn, if attribution disputes keep eroding trust, or if competition from
              cleaner-pricing alternatives limits take-rate expansion, then Fresha can rerate more like a lower-quality
              mixed commerce asset than a premium vertical SaaS name. A $110 million to $130 million revenue outcome at
              about 3.5x to 4.5x would imply only $0.4 billion to $0.6 billion of value. The comparable table therefore
              mixes the few price anchors actually available in the retained pack with model-appropriate operating
              references. That is deliberate: the current evidence supports a range and a watchlist discipline, not a
              single-point target.
