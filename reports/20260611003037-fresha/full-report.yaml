      - number: '1.4'
        title: Scale metrics, operating reach, and unsupported-number gaps
        blocks:
          - type: paragraph
            body: >-
              Fresha’s current official scale claims are strong, but they are not perfectly internally consistent across
              all 2026 materials. The current homepage says Fresha has enabled more than 1 billion appointments, serves
              130,000+ partner businesses across 120+ countries, and supports 450,000+ stylists and professionals. The
              May 2026 KKR announcement adds more than 35 million appointments per month and over $15 billion in annual
              GMV, while a later company announcement says the platform is processing more than $1.4 billion in monthly
              appointment value. Those figures collectively support a very large operating footprint for a
              vertical-software company and strengthen the case that Fresha is more infrastructure layer than
              lightweight booking widget.

              At the same time, several important metrics remain either conflicting or weakly supported. The May 2026
              and home-page materials lean on 130,000+ businesses, whereas later official growth releases cite more than
              140,000 businesses; that is directionally consistent but not numerically identical. Official materials do
              not disclose audited revenue, gross margin, current employee count, or retention economics. Third-party
              coverage from Tech Funding News cites a revenue run-rate above $140 million, growth above 60%, and
              approximately 500 employees, but those numbers should be treated as indicative rather than canonical
              because they are not backed by a primary filing or company financial statement in the pack. The correct
              diligence posture is to use official platform-scale metrics confidently, preserve third-party run-rate and
              headcount figures as low-confidence indicators, and mark revenue-quality and labor-efficiency questions as
              still open.
