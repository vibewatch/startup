  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and excluded adjacencies
        blocks:
          - type: paragraph
            body: >-
              Fresha sits inside a narrower market than 'beauty and wellness' writ large and a broader market than
              simple appointment booking. The strongest boundary evidence comes from Fresha's own consumer and partner
              surfaces plus comparable competitor pages. Those materials consistently show an operating stack that
              includes online booking, calendar management, client records, point-of-sale and payments, inventory,
              marketing or messaging, and some form of discovery or marketplace distribution. That means the relevant
              core category is vertical operating software for beauty and wellness service providers, with discovery and
              transaction rails attached, not consumer beauty spend, merchant acquiring in the abstract, or generic SMB
              software across all service categories.


              This boundary matters for underwriting because publisher scopes vary. ResearchAndMarkets breaks the space
              into scheduling, POS, employee management, CRM, inventory, pricing model, deployment, end-user, and
              regional TAM layers, while Fresha's legal and product surfaces show monetization reaching beyond a
              calendar into payment intermediation, marketplace fees, and subscription services. The category therefore
              includes the workflow software and monetizable adjacent rails that merchants actually buy to run salons,
              spas, barbershops, medspas, and similar businesses. It excludes most pure consumer spend, unrelated
              retail-tech stacks, and the fully clinical record systems that medspa-first platforms emphasize when they
              move beyond beauty-service workflows.
