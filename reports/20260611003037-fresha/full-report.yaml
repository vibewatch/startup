      - number: '5.4'
        title: Trust, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Fresha’s public trust posture is strongest in contractual and privacy documentation rather than in
              independent assurance artifacts. The privacy notice clearly describes controller status in some
              jurisdictions, lawful bases such as consent, contract, and legitimate interests, the payment-gateway
              boundary, fraud-prevention use cases, and the fact that internet transmission is never perfectly secure
              even when encryption and security controls are used. Partner terms extend that posture into operating
              controls by tying messaging and marketing to opt-in consent flows, naming GDPR, PECR, and TCPA in
              definitions, and assigning chargeback, refund, and service-delivery responsibilities across Fresha and
              partners. What remains thinner is third-party assurance. The retained source set does not surface a public
              trust center, uptime SLA, SOC 2 report, or similarly strong independent proof. That does not prove those
              controls do not exist, but it does mean the publicly visible layer is more legal-process oriented than
              certification oriented.
