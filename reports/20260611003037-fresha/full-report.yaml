      - number: '5.3'
        title: Payments, deployment, support, and product dependence
        blocks:
          - type: paragraph
            body: >-
              Payments are not an accessory inside Fresha; they are part of the operating core. Terms of Service and
              Partner Terms show Fresha taking an active role in collecting, processing, refunding, and settling partner
              payments, while partner workflows include card capture, deposits, cancellations, no-shows, terminals, and
              payout handling. The privacy notice adds a second layer by naming Adyen and Checkout as gateway providers
              and clarifying that card details flow directly to those processors, with Fresha retaining only limited
              card metadata. That said, deployment convenience comes with dependence. Independent review sources
              repeatedly frame the trade-off as zero or low fixed software cost in exchange for marketplace commission,
              processing fees, and reliance on Fresha Payments. Review complaints cite payout timing confusion, disputed
              fees, limited booking-page control, and support friction, which means the product is operationally
              integrated but not operationally neutral: customers buy into a tightly coupled workflow rather than
              assembling their own scheduling and payment stack.
