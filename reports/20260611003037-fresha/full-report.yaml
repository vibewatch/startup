      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Fresha’s capital position looks better than that of many late-stage private software companies, but public
              evidence still stops well short of balance-sheet underwriting. The strongest 2026 evidence is the KKR
              transaction: official and independent coverage converge on an $80 million primary growth investment at a
              valuation above $1 billion, lifting total capital raised to $285 million and funding further global
              expansion plus AI investment. The same announcement says Fresha is already profitable, which, if
              sustained, materially reduces immediate financing pressure compared with peers that still require growth
              equity to subsidize burn. The 2021 General Atlantic round remains the key prior marker: $100 million of
              Series C capital, bringing total fundraising then to $132 million and earmarked for product development,
              deeper marketplace bookings, and strategic M&A.

              The main caveat is that liquidity is inferred from funding access rather than proven through disclosed
              cash. No retained public source in this run gives current cash on hand, monthly burn, runway, debt
              maturity, covenant package, or lease and processor obligations. Independent database and media sources
              point to about $30.8 million of J.P. Morgan venture debt in 2024 and a $295 million total-funding view
              including debt, which conflicts with the company-backed $285 million total. That discrepancy is small
              enough to be reconcilable, but it is still unresolved. The practical conclusion is that Fresha probably
              has adequate near-term capital to keep investing in product, payments, and marketplace expansion, yet no
              outside investor can verify downside resilience or next-round timing from the retained public pack.
