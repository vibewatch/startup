      - number: '5.5'
        title: Differentiation, maturity, and product risk
        blocks:
          - type: paragraph
            body: >-
              Competitor evidence is useful because it narrows where Fresha is genuinely different. Square, Booksy, and
              Mindbody all market combinations of booking, payments, marketing, staffing, reporting, and marketplace or
              discovery surfaces, so module breadth alone is not a durable point of separation. Fresha’s
              better-supported differentiation in this source set is its zero-fixed-cost heritage, beauty-and-wellness
              specialization, and marketplace model that tries to monetize new-client acquisition, payments, and
              retention inside one loop. The 2026 discovery features reinforce that strategy by making visual
              merchandising and professional identity more central to conversion. The main product risks follow directly
              from the same design: heavy dependence on Fresha-controlled rails, pricing changes that can reduce the
              appeal of the free narrative, and customization or integration limits that matter more as operators scale.
              The product appears mature enough for broad SMB and multi-location use, but not yet publicly transparent
              enough to remove diligence questions around openness, support quality, and enterprise-grade trust.
