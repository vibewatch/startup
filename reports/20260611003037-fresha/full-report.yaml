          - type: callout
            title: Underwrite the constrained wedge, not the largest headline TAM
            body: >-
              The published market range spans from a narrow 2026 software lens to a much broader 2024 estimate. Until
              methodology and revenue-conversion assumptions are normalized, the most defensible underwriting lens is
