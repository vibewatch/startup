      - number: '7.2'
        title: Legal, regulatory, and commercial-liability risks
        blocks:
          - type: paragraph
            body: >-
              Fresha's legal perimeter is broader than a simple scheduling app. The privacy notice says Fresha is the
              data controller for UK and EU users unless otherwise stated, discloses profiling and personalized
              marketing, names broad sharing with partners and processors, and acknowledges transfers outside the UK and
              EEA as the company grows. It also points UK users to the ICO, which means the company itself frames data
              governance in a live supervisory context rather than as a purely internal policy topic. Commercial terms
              widen the risk surface further. The consumer terms say Fresha acts as partners' commercial agent, can
              receive payment on their behalf, and allows deposits, cancellation charges, and no-show fees up to 100% of
              appointment value. Partner terms then add monthly invoice netting, subscription-fee collection, suspension
              rights for non-payment, partner responsibility for chargebacks, and repayment claims when Fresha refunds
              users for fraud or policy reasons. That combination is powerful commercially, but it increases the chance
              that billing disputes, attribution disputes, or privacy-process gaps translate into merchant churn,
              complaints, or regulatory scrutiny. The mitigant is that Fresha has formalized these mechanics in legal
              documents; the remaining risk is that the public pack does not show the detailed compliance controls,
              dispute-loss rates, or jurisdiction-by-jurisdiction governance owners needed to underwrite them cleanly.
