  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Fresha competes across three concentric rings rather than one narrow peer group. The direct
              beauty-and-wellness software peers in this source pack are Booksy, Vagaro, and to a slightly different
              extent Mindbody: all sell booking plus business tools, but they emphasize different demand engines and
              category strengths. Booksy is the closest like-for-like beauty marketplace and pro workflow rival; Vagaro
              is broader across beauty, wellness, and fitness with a heavier operations-and-support posture; Mindbody is
              the deepest incumbent in fitness and wellness with stronger multi-location and marketplace infrastructure
              than a typical salon scheduler. Square Appointments is better understood as an adjacent commerce-platform
              substitute because its real strength is not beauty-native discovery but the breadth of its POS, payroll,
              banking, developer, and app-marketplace ecosystem. StyleSeat is a narrower but strategically important
              substitute for solo professionals because it leans more aggressively into AI-led marketing and new-client
              acquisition than into full multi-location operating-system depth.


              The outer ring is still material. Manual tools remain a real status-quo alternative for smaller salons and
              solo providers: several sources explicitly sell online booking as a replacement for phone calls, email
              coordination, social-media messages, and calendar back-and-forth. At the larger end of the market,
              internal build or modular assembly is a plausible substitute when operators value APIs, app ecosystems,
              compliance controls, or broad commerce tooling more than a beauty-specific consumer marketplace. That
              means Fresha is not competing only with other salon schedulers; it is also competing with “keep using
              lightweight manual tools,” “assemble a broader commerce stack,” and “use a specialist growth layer for
              solo pros.”
