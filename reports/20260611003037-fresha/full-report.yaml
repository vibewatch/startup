      - number: '2.2'
        title: Sizing lenses, constrained TAM, and why the headline range varies
        blocks:
          - type: paragraph
            body: >-
              Public market-size evidence supports a real software category, but not one canonical headline TAM. Mordor
              Intelligence publishes the narrowest and most decision-useful current lens for Fresha's core category: spa
              and salon software at $1.12 billion in 2026, rising to $1.86 billion by 2031. Strategic Market Research
              publishes a much broader $3.5 billion 2024 lens growing to $7.25 billion by 2030. ResearchAndMarkets
              confirms why those numbers diverge: its category scope spans scheduling, POS, employee management, CRM,
              inventory, pricing model, deployment, application, and country-level TAM modules. In other words, the
              public sources are measuring overlapping but not identical markets.


              A better diligence posture is to keep multiple lenses instead of selecting the biggest number. The most
              conservative software wedge aligned to Fresha's operational beachhead is the appointment-and-CRM slice,
              which Mordor says represented 36.46% of category spend in 2025; applying that share to the 2026 narrow
              market implies an immediate workflow wedge of about $0.41 billion. A second constrained lens applies
              Mordor's 39.22% North America share to the same 2026 market, implying roughly $0.44 billion of
              narrow-category spend in the region that still anchors most benchmark evidence. These are not formal SAM
              or SOM outputs, but they are more defensible than equating Fresha's opportunity with all beauty-services
              spend or all SMB payments volume.
