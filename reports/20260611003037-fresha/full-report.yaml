      - number: '7.4'
        title: Financial opacity and people / execution risk
        blocks:
          - type: paragraph
            body: >-
              Fresha's strongest risk mitigant is that it is clearly not a pre-scale experiment. Company-backed and
              independent 2026 coverage agree on a fresh $80 million KKR round at a valuation above $1 billion,
              profitability, roughly 130,000 business customers, 35 million monthly appointments, and more than $15
              billion in annual GMV. That matters because it gives management capital and operating leverage that many
              weaker SMB software peers lack. The problem is that the public package still leaves investors underwriting
              the business from the outside in. Tech Funding News adds a $140 million-plus revenue run-rate, 60% growth,
              and about 500 employees across a multi-office footprint, but no retained source here provides audited take
              rate, revenue mix by subscriptions versus payments versus marketplace, gross margin, partner churn,
              customer concentration, cash balance, or debt covenant detail. That gap turns execution into the central
              judgment call. Scaling support, compliance, pricing communication, and partner operations across 120
              countries is feasible, but it is not trivial. The kill criteria therefore should focus less on absolute
              growth and more on whether billing disputes, compliance exceptions, merchant churn, or support
              deterioration accelerate faster than management can absorb them.
