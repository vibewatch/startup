- id: discovery-operating-model-and-integrations
  title: Discovery-led operating model, distribution, and integrations
  body: 'The most distinctive product move in the 2026 evidence set is Fresha’s shift from transactional booking toward discovery-led merchandising. Business Wire and PRNewswire both describe a marketplace that now leans heavily on advanced search, visual portfolios, trusted reviews, one-click rebooking, and richer professional identity layers. Service Portfolios let businesses attach imagery directly to services and route users from inspiration to a book-now flow, while Professional Profiles add languages, ratings, reviews, social links, and imagery for individual staff members. That makes the operating model clear: Fresha is trying to own both demand capture and operating software, not just the scheduling database. Distribution also extends beyond the first-party app, because partner terms and review sources show booking buttons, social surfaces, Google-linked entry points, partner websites, and other promotion channels that push users back into Fresha-controlled booking and payment workflows.
    Public evidence for a deep open API layer is weaker than evidence for button-link and feed-style distribution.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
