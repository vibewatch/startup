tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Consumer marketplace and app
    - Consumers discovering local services
    - Mature live surface
    - Combines search, reviews, app booking, and rebooking in one self-care destination
    - Need cohort data on discovery-to-repeat conversion by channel
  - - Partner scheduling and team operations
    - Salon, spa, barber, medspa, and wellness operators
    - Core mature surface
    - Supports multiple staff, locations, appointments, vouchers, and partner-managed service catalogs
    - Need deeper proof on enterprise admin controls and permissions
  - - Payments, POS, terminals, and payout handling
    - Front-desk staff and owners
    - Mature but tightly coupled
    - Links checkout, saved cards, no-show protection, refunds, and payouts to booking workflow
    - Need formal payout SLA, processor fallback, and dispute-handling metrics
  - - Inventory, store, and product-order workflows
    - Operators selling retail alongside services
    - Current and productized
    - Extends beyond appointments into product listings, inventory, and order/refund handling
    - Need proof of adoption depth and catalog-sync flexibility
  - - Messaging, marketing, and retention tooling
    - Owners and growth teams
    - Current and expanding
    - Smart campaigns, reminders, blast messages, and repeat-booking flows sit inside the same platform
    - Need segmentation limits, delivery-rate data, and per-market pricing clarity
  - - Visual portfolios, professional profiles, and AI-led discovery
    - Marketplace-facing operators and staff
    - Fresh 2026 expansion
    - Turns booking pages into visually merchandised storefronts tied directly to book-now conversion
    - Need evidence on ranking logic, moderation controls, and conversion lift by feature
  notes: Maturity reflects what is visible in public materials, not audited adoption depth across the installed base.
