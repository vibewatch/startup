- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / posture
  - Status
  - Scope
  - Public proof
  - Gap
  rows:
  - - Commercial-agent model
    - Current contractual control
    - Appointments, orders, and client payment collection
    - Terms of Service assigns partner service delivery to partners while Fresha arranges orders and can collect payment on their behalf
    - Need merchant-of-record and liability treatment by geography and product
  - - Gateway-based card-data handling
    - Current technical/legal disclosure
    - Card payments through Fresha services
    - Privacy notice says card data goes directly to Adyen or Checkout and Fresha retains limited card metadata
    - Need stronger public disclosure of PCI/SCA design, tokenization, and incident history
  - - Marketing consent and privacy bases
    - Current policy disclosure
    - Promotional messaging and personal-data processing
    - Privacy notice lists consent, contract, and legitimate interests; partner terms cite GDPR, PECR, and TCPA
    - Need clearer controller/processor allocation by workflow and region
  - - Chargeback, refund, and payout governance
    - Current contractual control
    - Payment disputes, refunds, cancellations, and no-shows
    - Partner terms allocate chargeback liability and describe payout/refund mechanics
    - Need public service levels for dispute resolution and payout timing
  - - Independent assurance visibility
    - Partial / weak public proof
    - Enterprise security and reliability assurance
    - Retained source set emphasizes policies, features, and reviews more than certifications or uptime artifacts
    - Request trust-center materials, uptime history, and independent security attestations directly
  notes: Public trust evidence is strongest in privacy and contract language; third-party assurance artifacts are notably less visible in this source set.
