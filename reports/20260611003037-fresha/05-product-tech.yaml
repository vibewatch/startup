chapter:
  number: 5
  title: Product & Technology
  summary: Fresha is best understood as a self-care operating system that combines consumer discovery, partner scheduling, payments, messaging, inventory, and back-office workflows rather than as a narrow booking widget. Official legal surfaces and 2026 product announcements support that breadth, while independent reviews suggest the main trade-offs are payment-rail dependence, limited booking-page customization, and uneven support or fee transparency for some operators.
sections:
- id: workflow-product-definition
  title: Workflow product definition and module breadth
  body: 'Fresha’s product is broader than a salon calendar. The consumer-side platform lets users discover nearby beauty and wellness providers, browse professionals and services, and complete bookings through the Fresha website or app, while the partner-side system manages the inventory of services, staff, venues, vouchers, payments, and follow-up marketing that sit behind those bookings. The legal terms matter here because they show Fresha acting as the orchestration layer between clients and partner businesses: partners provide the underlying services and products, while Fresha arranges the appointment or order flow and can collect payments on the partner’s behalf. In 2026 press materials, Fresha is now describing the bundle as an all-in-one booking, payments, and business-management platform with marketplace-led growth, which is consistent with independent reviews that describe the system as feature-rich across scheduling, POS, inventory, messaging, and team operations.'
  claimRefs:
