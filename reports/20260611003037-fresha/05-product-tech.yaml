- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Fresha solution
  - Measurable benefit / proof
  - Limitation
  rows:
  - - Acquire a new local client
    - Rely on word-of-mouth, social DMs, or generic search results
    - Marketplace profile, reviews, portfolios, and book-now flow
    - Official 2026 releases emphasize search, personalization, and portfolio-led discovery
    - Commission and ranking dependence can raise customer-acquisition cost
  - - Run multi-staff appointment operations
    - Patch together calendar, notes, and staff scheduling tools
    - Partner booking services with staff, location, voucher, and service management
    - Partner terms and review sources describe multi-staff and multi-location support
    - Public evidence on advanced permissions and enterprise workflow rules is limited
  - - Take payment and enforce no-show policies
    - Use separate terminals, manual invoices, or ad hoc card capture
    - Integrated payment services, saved cards, terminals, deposits, refunds, and no-show charging
    - Terms and reviews show payment collection embedded in booking flow
    - Processor lock-in and payout complaints remain visible in reviews
  - - Re-engage existing clients
    - Manual texting or generic email lists
    - Smart campaigns, reminders, blast messages, loyalty and one-click rebooking
    - PR and review sources show retention tooling as part of the operating loop
    - Public deliverability, segmentation, and ROI data are not disclosed
  - - Sell retail products alongside services
    - Run a separate store or in-person-only product process
    - Partner store, product listings, order/refund terms, and inventory management
    - Terms and review sources show product-order and stock workflows on-platform
    - Need evidence on ecommerce adoption, integrations, and fulfillment edge cases
  notes: Workflow rows pair official contractual evidence with review-site operator descriptions to separate public capability from public proof of execution quality.
