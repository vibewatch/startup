- id: trust-privacy-and-quality-controls
  title: Trust, privacy, and quality controls
  body: Fresha’s public trust posture is strongest in contractual and privacy documentation rather than in independent assurance artifacts. The privacy notice clearly describes controller status in some jurisdictions, lawful bases such as consent, contract, and legitimate interests, the payment-gateway boundary, fraud-prevention use cases, and the fact that internet transmission is never perfectly secure even when encryption and security controls are used. Partner terms extend that posture into operating controls by tying messaging and marketing to opt-in consent flows, naming GDPR, PECR, and TCPA in definitions, and assigning chargeback, refund, and service-delivery responsibilities across Fresha and partners. What remains thinner is third-party assurance. The retained source set does not surface a public trust center, uptime SLA, SOC 2 report, or similarly strong independent proof. That does not prove those controls do not exist, but it does mean the publicly visible layer is more legal-process
    oriented than certification oriented.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE031
  tableRefs:
  - TE004
  figureRefs: []
- id: differentiation-maturity-and-risk
  title: Differentiation, maturity, and product risk
  body: 'Competitor evidence is useful because it narrows where Fresha is genuinely different. Square, Booksy, and Mindbody all market combinations of booking, payments, marketing, staffing, reporting, and marketplace or discovery surfaces, so module breadth alone is not a durable point of separation. Fresha’s better-supported differentiation in this source set is its zero-fixed-cost heritage, beauty-and-wellness specialization, and marketplace model that tries to monetize new-client acquisition, payments, and retention inside one loop. The 2026 discovery features reinforce that strategy by making visual merchandising and professional identity more central to conversion. The main product risks follow directly from the same design: heavy dependence on Fresha-controlled rails, pricing changes that can reduce the appeal of the free narrative, and customization or integration limits that matter more as operators scale. The product appears mature enough for broad SMB and multi-location use, but
    not yet publicly transparent enough to remove diligence questions around openness, support quality, and enterprise-grade trust.'
