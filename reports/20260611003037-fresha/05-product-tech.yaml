- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Public clue
  - Dependency
  - Risk
  rows:
  - - Consumer discovery layer
    - Search, browse, compare, and book local providers
    - Homepage, PR, and AI launch release describe app-based discovery and trust-led booking
    - Marketplace relevance, reviews, and partner profile quality
    - Ranking opacity and visual-merchandising bias could affect partner economics
  - - Partner operating system layer
    - Manage calendars, teams, services, stock, and client records
    - Partner terms and review sources describe bookings, team management, inventory, and POS
    - Partner data accuracy and staff workflow adoption
    - Workflow breadth can create support burden if setup is weak
  - - Payments and settlement layer
    - Capture cards, process/refund payments, manage terminals and payouts
    - Terms and privacy notice name payment services, processors, chargebacks, and terminals
    - Adyen/Checkout rails plus Fresha payment policy
    - Operational dependence on Fresha-controlled processor and payout logic
  - - Messaging and retention layer
    - Reminders, campaigns, consented outreach, and repeat-booking loops
    - Partner terms, PR, and review sources describe reminders, smart campaigns, and opt-in rules
    - Consent capture and communications vendors
    - Pricing, template limits, and support responsiveness can affect ROI
  - - Partner-distribution and feed layer
    - Button links, partner websites, social surfaces, and product/store data feeds
    - Partner terms mention correct button links, data feeds, and broad promotion channels
    - Channel connectors and Fresha-managed destination pages
    - Public API documentation and third-party integration depth remain thin in this source set
  notes: This is an operating-model reconstruction from legal terms, launch materials, and operator reviews; Fresha does not publish a canonical public system diagram in the retained source set.
