- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk dimension
  - Current assessment
  - Main threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Marketplace discovery + workflow bundle
    - Strong
    - Booksy, Mindbody, and StyleSeat each attack different parts of the same funnel
    - Moderate
    - Fresha wins when it owns demand and workflow together; loses leverage when a rival owns either side better
    - Request channel mix of bookings, repeat rate by acquisition source, and share of merchants using only Fresha discovery
  - - Payments and settlement control
    - Strong but double-edged
    - Merchant resistance to payment lock-in; Square ecosystem alternative
    - Moderate
    - This is both a retention lever and a source of partner friction
    - Request payment attach rate, chargeback burden, and merchant opt-out behavior
  - - Beauty-and-wellness breadth
    - Strong
    - Mindbody and Vagaro niche strength in fitness/wellness; Square breadth outside beauty
    - Moderate
    - Breadth helps Fresha sell across salon, spa, barber, aesthetics, and some fitness workflows
    - Map revenue mix by vertical and churn by beauty vs wellness cohort
  - - AI-led discovery roadmap
    - Promising but early
    - StyleSeat AI marketing and competitor copycats
    - Moderate
    - AI can deepen monetization, but early AI claims can commoditize quickly
    - Track adoption of Service Portfolios / Professional Profiles and resulting booking lift
  - - Pricing narrative
    - Weaker than before
    - Buyer pushback after 2025-2026 pricing transition
    - Material
    - A less-clean pricing story makes competitor comparisons easier
    - Request current plan sheets by geography plus realized take-rate by merchant cohort
  - - Trust and support reputation
    - Mixed
    - Review-site complaints around attribution and responsiveness
    - Moderate
    - A strong product can still lose deals if merchants fear billing disputes or slow help
    - Review support SLA, first-response times, refund policy, and complaint resolution rates
  - - Square ecosystem adjacency
    - Material external threat
    - Merchants standardizing on one commerce stack
    - Moderate
    - Square can win even without beauty-native discovery because of ecosystem breadth
    - Quantify overlap with merchants already using Square hardware or banking products
  - - Manual tools / multi-homing
    - Persistent low-end substitute
    - Solo pros staying on low-cost manual workflows or using multiple channels
    - Moderate
    - This limits monetization ceiling and keeps switching barriers from becoming absolute
    - Measure lead source mix, off-platform booking rate, and frequency of dual-platform usage
  notes: Severity reflects competitive significance rather than existential business risk. The largest near-term risk in this evidence pack is not a sudden market-share collapse but gradual erosion where pricing friction, support concerns, or niche-specialist alternatives weaken Fresha’s relative pitch.
