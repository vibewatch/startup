- id: moat-durability-and-adverse-competitive-evidence
  title: Moat durability and adverse competitive evidence
  body: >-
    Fresha’s moat looks solid but not unassailable. The positive case is straightforward: very large marketplace and booking scale, broad beauty-and-wellness vertical coverage, integrated payments, and a 2026 AI/discovery roadmap that tries to deepen both consumer engagement and merchant monetization. That combination should remain stronger than manual tools and thinner schedulers over the next 12-24 months. The adverse case is equally clear: the moat is most durable where buyers want marketplace-led acquisition plus merchant workflow in one system, but less durable where a competitor owns a sharper niche. Mindbody is harder to dislodge in fitness and wellness-heavy accounts, Vagaro has a broader operations-and-support posture, Booksy is the closest beauty-specific direct peer, Square can win on ecosystem breadth, and StyleSeat can win solo professionals with AI marketing and flatter pricing.


    The main adverse evidence against Fresha is not a collapse in demand; it is friction in monetization and trust. Review sources preserve repeated complaints about 20% new-client fees, marketplace attribution disputes, support gaps, and discomfort after the pricing change. Those issues matter competitively because they lower the threshold for merchants to compare alternatives even if they do not immediately churn. The right diligence conclusion is that Fresha’s moat is real but conditional: durable against status quo, durable against generic scheduling tools, and defensible against many beauty peers, yet vulnerable at the margin when competitors bring a stronger ecosystem, a stronger vertical niche, or a cleaner pricing story.
