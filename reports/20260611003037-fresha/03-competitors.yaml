- id: switching-costs-multi-homing-and-substitutes
  title: Switching costs, multi-homing, and substitutes
  body: >-
    Fresha benefits from real switching costs, but they are operational rather than absolute. Once a salon is running calendars, client history, deposits or no-show rules, embedded payments, inventory, and marketing inside one system, migration is disruptive even if the software is not technically impossible to leave. That matters because Fresha’s best moat is not a single feature; it is the coupling of discovery, transaction data, and workflow data. At the same time, the fetched competitor pages show that switching is common enough to be a marketing tactic: Mindbody advertises migration help and setup support, Square offers bulk import and paid migration services, and Vagaro explicitly says switching is simple. So the practical underwriting view is that Fresha has retention frictions, not an unbreakable lock.


    Multi-homing risk is highest in independent and solo segments. Discovery can come from Google, a website, social links, a marketplace listing, or word of mouth, which means a professional can keep lead-gen optionality even if a primary operating system sits underneath. That is why manual/status-quo tools and modular stacks still matter. Small operators can keep using a mix of phone, messages, calendar tools, and standalone payments for longer than vertical-software vendors prefer. Larger operators can rationally choose a broader commerce stack or a custom assembly if they care more about APIs, payroll, or multi-location controls than a beauty-specific marketplace. Fresha is therefore protected most when it wins both the demand channel and the operating workflow at the same time.
