  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      Fresha’s capital intensity comes less from physical inventory than from the cost of supporting a
      global marketplace, payment infrastructure, partner support, and ongoing product / AI expansion.
    data:
      columns:
