      - FI004

  - id: underwriting-gaps-and-financial-verdict
    title: Underwriting gaps and financial verdict
    body: >-
      The investable part of Fresha’s financial story is clear enough: real transaction throughput, clear
      monetization surfaces, multi-product embeddedness in partner workflows, profitability claims, and
      fresh institutional capital from KKR. What remains unclear is almost everything needed to convert that
      story into a clean underwriting model. Public evidence does not disclose net revenue by stream,
      payments take rate, gross margin, support and risk-operations cost, customer concentration, CAC,
      payback, burn, runway, or current debt status. Third-party estimates of a $140 million-plus revenue
      run-rate and 60%-plus growth are directionally useful but not filing-grade and should not be treated
      as audited financials.

      The adverse evidence matters because it speaks directly to revenue quality. Multiple merchant-review
      sources independently complain about fee complexity, support responsiveness, and marketplace
      attribution, including claims that 20% new-client fees were charged when merchants believed the
      customer came through Google or referral rather than through Fresha discovery. Even where the product
      wins praise, the message is similar: the platform can be commercially effective, but economics are
      highly sensitive to whether it is truly delivering incremental demand and whether the merchant accepts
      Fresha-controlled payments and fee layering. Financially, Fresha screens as a scaled, credible, and
      probably capital-efficient platform; however, without audited revenue mix, margin, and liquidity data,
      the right underwriting stance is constructive on business quality but cautious on revenue durability,
      predictability, and downside protection.
    claimRefs:
      - CI014
      - CI015
      - CI022
      - CI023
      - CI024
      - CI026
      - CI027
      - CI028
      - CI036
      - CI037
      - CI038
      - CI042
      - CI043
      - CI044
      - CI045
    tableRefs:
      - TI005

tables:
  - id: TI001
    title: Revenue streams table
    notes: >-
      This table separates directly disclosed monetization mechanisms from inferred ones. Exact realized
      take rates and stream mix are not public; where pricing is sourced from review pages rather than an
      official fee card, that is stated explicitly.
    columns:
      - Stream
      - Mechanism
      - Unit / trigger
      - Current public status
      - Revenue-quality read
      - Diligence ask
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI022
      - CI033
    rows:
      - - Subscription services
        - Access to Fresha Platform Services and additional services for partners with bookable staff
        - Per partner or per bookable team member per month
        - Partner terms confirm subscription fees exist; independent reviews report solo and per-seat tiers, but official fee table is not preserved in the fetched text dump
        - More predictable than transaction fees, but current pricing and penetration are only partially corroborated
        - Provide current plan matrix, seat counts, and monthly recurring revenue by plan
      - - Payment processing
        - Fresha collects client payment as commercial agent and remits net amounts to partners
        - Per card-present, online, or manually entered transaction
        - Legally confirmed as a core payment rail; exact current rates mostly come from reviews rather than primary fee cards in this pack
        - Potentially large, recurring, high-volume stream tied to GMV, but processor share and net take are unknown
        - Disclose gross processed volume, payment attach rate, processor pass-through, and net payments revenue
      - - Marketplace new-client fees
        - One-time fee on first appointment from marketplace-sourced new clients
        - Percentage of first booking value
        - Multiple independent reviews report a 20% fee with a $6 minimum; primary terms in this pack do not preserve the exact numeric fee
        - Performance-based acquisition revenue, but attribution disputes can hurt trust and retention
        - Provide attribution logic, refund policy, and revenue from marketplace acquisition fees
      - - Online booking and premium feature usage
        - Usage fees and advanced-feature monetization layered on top of core software
        - Per feature or booking-related action
        - 2021 official release says Fresha Plus and usage-based fees existed before the 2025 pricing shift
        - Shows monetization depth beyond payments alone, but current feature-level revenue is opaque
        - Break out feature ARPU, attach, and churn by cohort
      - - Financial services / Fresha Capital
        - Loan-product access via third-party finance provider distributed through Fresha
        - Referral, platform, or ancillary-finance economics not disclosed
        - Partner terms define Fresha Capital and a third-party finance provider, but no revenue share is public in the retained pack
        - Could be attractive ancillary monetization, but currently not underwritten
        - Provide volume, approval rate, and Fresha economics for capital products
      - - Deposits, no-show, and cancellation payments
        - Deposit collection and appointment-value-linked policies routed through Fresha Payment Services
        - Percentage or fixed fee depending on partner policy
        - Terms of service allow deposit, cancellation, and no-show policies up to 100% of appointment value for participating partners
        - Supports payment adoption and partner lock-in, but revenue treatment is unclear
        - Clarify whether Fresha earns separate revenue from deposit or no-show workflows

  - id: TI002
    title: Pricing / monetization table
    notes: >-
      “Direct” means explicitly preserved in official or legal text from this run. “Reported” means the
      numeric value comes from independent reviews that say they checked fresha.com/pricing or user bills,
      but the current official fee table is not preserved in the fetched text dump.
    columns:
      - Lever
      - Public price / rate
      - Direct vs reported
      - Caveat / unknown
      - Primary source signal
      - Financial implication
    claimRefs:
      - CI002
      - CI003
      - CI022
      - CI023
      - CI024
      - CI025
      - CI045
    rows:
      - - Independent / solo subscription
        - '~$19.95 per month'
        - Reported by independent review sources
        - Official pricing page was fetched but does not preserve the live fee card in text form
        - Makerstack and Pabau pricing reviews
        - Suggests Fresha has moved from pure free entry to at least some recurring seat revenue
      - - Team subscription
        - '~$14.95 per bookable team member per month'
        - Reported by independent review sources
        - Realized monthly bill depends on team size, plan inclusion, and optional add-ons
        - Pabau, CostBench, and SalonBusiness coverage
        - Makes revenue more recurring but also raises merchant price sensitivity
      - - Marketplace new-client fee
        - 20% of first booking, minimum $6
        - Reported independently; legal pack confirms service-fee invoicing but not the exact numeric fee
        - Attribution disputes appear in merchant reviews
        - Makerstack, Pabau, SalonBusiness, SchedulingKit, Software Advice
        - Functions like performance CAC monetization rather than classic software pricing
      - - In-person card processing
        - 'Reported US rate: 2.29% + $0.20 per transaction'
        - Reported independently
        - May vary by region, volume, and payment type; processor split unknown
        - SalonBusiness review and user-review references
        - Large gross-fee pool possible on high GMV if adoption is broad
      - - Online card processing
        - 'Reported US rate: 2.79% + $0.20 per transaction'
        - Reported independently
        - No primary fee schedule preserved in this run; not all GMV necessarily pays online
        - Pabau and SalonBusiness pricing summaries
        - Higher monetization potential but also higher merchant friction than software seats
      - - Manual card entry
        - 'Reported US rate: 3.30% + $0.20 per transaction'
        - Reported independently
        - Higher-risk payment channel; public rate may not apply in all geographies
        - Pabau and SalonBusiness pricing summaries
        - Suggests risk-based pricing and non-uniform take rates across payment rails
      - - UK payment rate reference
        - '~1.2% + 20p per transaction'
        - Reported independently
        - Region-specific and explicitly presented as needing direct verification
        - Pabau pricing summary
        - Reinforces that Fresha’s realized payment economics likely vary materially by geography
      - - Alternative competitor packaging
        - Booksy $29.99/month plus $20 per add'l user; StyleSeat $35/month flat; Square free base with paid tiers
        - Direct on competitor official pages
        - Competitor pricing is not a proxy for Fresha take rate, only for merchant alternatives
        - Booksy, StyleSeat, Square official pages
        - Shows Fresha’s hybrid model competes against simpler flat-fee or free-base offers

  - id: TI003
    title: Unit economics table
    notes: >-
      Null or “undisclosed” means the retained source set does not publish a usable company number.
      Where a value is inferred from independent reviews or official scale proxies, confidence is capped
      accordingly.
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI014
      - CI020
      - CI021
      - CI034
      - CI036
      - CI045
    rows:
      - - Monthly appointments
        - 35M+ per month
        - High
        - Core transaction-throughput proof for payments and marketplace monetization
        - Provide split by in-app, widget, pay-in-store, and pay-online bookings
      - - Annual GMV
        - '> $15B annual GMV; later release also says >$1.4B monthly appointment value'
        - High
        - Shows large fee pool if Fresha captures payments on a meaningful share of volume
        - Provide annualized processed-payments volume and take rate by geography
      - - Monthly downloads
        - 1M+ per month
        - Medium
        - Proxy for top-of-funnel marketplace demand and consumer-discovery efficiency
        - Provide paid vs organic acquisition mix and app-store CAC
      - - Loyal-client repeat rate
        - '>83% after the third appointment (company claim)'
        - Medium
        - Repeat behavior governs whether first-booking commissions convert into durable payment revenue
        - Provide cohort retention from first, second, and third booking onward
      - - Revenue uplift from retention tools
        - Up to 40% revenue increase from improved retention (company claim)
        - Medium
        - Indicates that LTV expansion may matter as much as first-booking acquisition
        - Provide measured uplift distribution and methodology behind the claim
      - - Reported revenue run-rate
        - '$140M+ growing 60%+ annually (third-party only)'
        - Low
        - Directionally useful for valuation framing, but not underwriting-grade without primary support
        - Provide audited 2025 and LTM 2026 revenue by stream
      - - Gross margin by stream
        - Undisclosed
        - Low
        - Needed to distinguish software-like economics from processor or service-heavy economics
        - Provide gross margin for subscriptions, payments, marketplace, and financial services separately
      - - CAC / payback
        - Undisclosed
        - Low
        - Central to judging whether 20% first-booking fees are an efficient acquisition channel or a retention risk
        - Provide marketplace CAC, paid-marketing CAC, payback, and LTV/CAC by merchant segment
      - - Chargebacks / refunds / disputes
        - Partners bear chargebacks under partner terms; Fresha operational burden not quantified
        - Medium
        - Payments risk can dilute margins and increase support load even when merchants absorb principal liability
        - Provide chargeback rate, fraud loss, and support cost per 1,000 transactions
      - - Merchant churn after 2025 pricing shift
        - Undisclosed; adverse reviews suggest real friction
        - Low
        - The key test of revenue durability after introducing subscriptions
        - Provide gross and net merchant retention before and after the pricing transition

  - id: TI004
    title: Capital adequacy table
    notes: >-
      This table focuses on liquidity and financing dependency, not the full historical round-by-round
      chronology already covered in Company Overview. Funding facts are minted locally here because the
      financial judgment depends on them.
    columns:
      - Input
      - Public evidence
      - Status
      - Why it matters
      - Diligence ask
    claimRefs:
      - CI007
      - CI008
      - CI012
      - CI015
      - CI016
      - CI040
      - CI041
      - CI042
      - CI043
    rows:
      - - Latest equity round
        - '$80M primary growth investment from KKR at >$1B valuation in May 2026'
        - Disclosed
        - Fresh primary capital is the strongest public evidence of near-term balance-sheet flexibility
        - Provide net proceeds after fees and board-approved use-of-funds plan
      - - Official cumulative capital raised
        - '$285M total capital raised to date'
        - Disclosed
        - Establishes total external equity support cited by management
        - Reconcile official total against debt-inclusive databases and cap table
      - - Prior major financing marker
        - '$100M Series C in June 2021; total raised then $132M'
        - Disclosed
        - Shows a meaningful prior capital base before the KKR round
        - Provide chronology of all rounds, extensions, and secondary components
      - - Profitability status
        - Already profitable (company claim)
        - Disclosed but unaudited
        - If sustained, lowers immediate financing dependency materially
        - Provide audited EBITDA / net-income bridge and proof of profitability quality
      - - Current cash balance
        - Undisclosed
        - Not public
        - Without cash, runway cannot be underwritten even if the company is profitable on paper
        - Provide latest cash and equivalents, restricted cash, and weekly liquidity view
      - - Debt exposure
        - Third-party sources mention ~$30.8M J.P. Morgan venture debt in 2024 and a $295M total-raised view including debt
        - Partially disclosed / conflicting
        - Hidden leverage could change downside risk and explain the gap between $285M and $295M
        - Provide debt balance, lender, maturity, covenant package, and current outstanding amount
      - - Use of funds
        - 2026 round for global expansion and AI; 2021 round for product, marketplace, and M&A
        - Disclosed at high level
        - Capital intensity depends on whether spending is growth-efficient or subsidy-heavy
        - Provide 24-month budget by product, GTM, geography, and payments infrastructure
      - - Next-round trigger
        - Undisclosed
        - Not public
        - Needed to assess dilution risk and whether current valuation depends on continued private funding access
        - Provide downside plan for growth slowdown, higher support cost, or payments-margin compression

  - id: TI005
    title: Public financial gaps table
    notes: >-
      These are the missing private metrics that block underwriting-grade diligence. Each gap is tied to
      an exact request rather than a generic “need more data” statement.
    columns:
      - Missing metric
      - Current public proxy
      - Impact on verdict
      - Exact diligence path
    claimRefs:
      - CI014
      - CI015
      - CI023
      - CI024
      - CI036
      - CI037
      - CI038
      - CI043
      - CI044
    rows:
      - - Net revenue by stream
        - Official GMV, appointments, downloads, and feature narrative only
        - Cannot tell whether valuation is supported by software, payments, marketplace, or finance revenue quality
        - Request audited revenue split for subscriptions, payments, marketplace, and financial services
      - - Payment take rate and processor economics
        - Review-sourced fee schedules and legal collection role
        - Gross fee pool may be large, but Fresha’s retained net economics are unknown
        - Request processor contracts, net take by geography, and payment-penetration cohorts
      - - Merchant retention after pricing shift
        - Reviews mention friction; no official churn disclosure
        - The main risk to recurring seat and payment revenue durability remains unmeasured
        - Request logo retention, GPDR, and churn reasons pre/post 2025 pricing changes
      - - Gross margin and support burden
        - No gross-profit disclosure; support complaints imply hidden cost
        - Without margin data, profitability quality cannot be judged
        - Request gross margin bridge including support, disputes, payment ops, and cloud costs
      - - Cash / burn / runway
        - Fresh equity and profitability claim only
        - Capital adequacy cannot be judged under downside scenarios
        - Request latest balance sheet, cash-flow statement, and 24-month runway model
      - - Debt / covenant package
        - Third-party debt references without lender terms or current balance
        - Hidden leverage could materially alter downside protection
        - Request debt schedule, covenants, guarantees, and processor reserve requirements
      - - Marketplace attribution logic
        - Merchant complaints about paying 20% for allegedly non-marketplace clients
        - Directly affects acquisition economics, refund risk, and partner trust
        - Request audit rules, override policy, and disputed-fee incidence rates
      - - Revenue-recognition policy
        - Legal terms show agent/payment role but not accounting treatment
        - Gross-vs-net recognition could materially change perceived scale and margin
        - Request accounting memo for subscription, marketplace, payments, and finance revenue

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Public evidence supports a hybrid monetization chain in which discovery, booking, payment collection,
      and partner billing create several revenue capture points rather than one flat subscription.
    data:
      nodes:
        - id: demand
          label: Consumer discovery and booking intent
          detail: Marketplace search, partner profiles, widgets, and app discovery bring clients into the funnel.
          tone: positive
        - id: booking
          label: Appointment booked with partner
          detail: Fresha arranges and concludes the booking as commercial agent for participating flows.
          tone: neutral
        - id: payments
          label: Payment collected by Fresha
          detail: Online and in-app payments can be collected on the partner’s behalf and netted through invoices.
          tone: positive
        - id: monetization
          label: Monetization levers fire
          detail: Subscription fees, card-processing fees, feature usage fees, and first-booking marketplace commissions may apply.
          tone: opportunity
        - id: payout
          label: Net partner settlement and disputes
          detail: Chargebacks, unpaid balances, refunds, and fee disputes affect revenue quality and support cost.
          tone: risk
        - id: net
          label: Fresha net revenue quality
          detail: Final economics depend on payment penetration, take rates, repeat behavior, and support burden.
          tone: risk
      edges:
        - from: demand
          to: booking
          label: conversion
        - from: booking
          to: payments
          label: payment adoption
        - from: payments
          to: monetization
          label: fee capture
        - from: monetization
          to: payout
          label: settlement and adjustments
        - from: payout
          to: net
          label: realized economics
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI022
      - CI033

