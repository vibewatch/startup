company:
  name: Fresha
chapter:
  number: 4
  title: Financials
  letter: I
  key: financials
  summary: >-
    Fresha’s public record supports a real multi-stream revenue engine built from payment processing,
    marketplace discovery, and now subscription fees, backed by 35 million monthly appointments,
    more than $15 billion in annual GMV, profitability, and a fresh $80 million KKR round at a
    $1 billion-plus valuation. But underwriting remains constrained because exact take rates, net
    revenue mix, gross margin, cash, burn, runway, and debt terms are not publicly disclosed, while
    partner reviews point to pricing complexity, fee disputes, and support friction.
sections:
  - id: revenue-model-and-pricing-visibility
    title: Revenue model and pricing visibility
    body: >-
      Fresha’s financial model is best understood as a hybrid of marketplace, payments, and vertical
      software rather than as a classic seat-based SaaS business. The strongest primary evidence comes
      from legal and company-backed materials. Partner terms say businesses with one or more bookable
      people must pay a subscription fee, while the same terms and the consumer terms of service make
      clear that Fresha acts as a commercial agent for online bookings and collects payment on the
      partner’s behalf. The June 2021 General Atlantic release then shows the earlier version of the
      model: subscription-free core software, advanced Fresha Plus features, and monetization through
      card-processing and online-booking usage fees. Independent 2026 coverage and review pages indicate
      that this has evolved into a paid-plan structure layered on top of transaction and marketplace fees,
      not a replacement of them.

      The exact pricing card remains only partially public in the retained pack. The official pricing and
      payments pages in this run do not preserve usable fee tables in text form, so precise current rates
      mostly come from independent reviews rather than directly from Fresha. Those reviews broadly agree
      on the commercial shape: a roughly $14.95 per bookable team member or about $19.95 solo subscription,
      a 20% fee on first-time marketplace clients, and card-processing fees that vary by channel and region.
      That means the commercial mechanism is legible, but the realized take rate, blended ARPU, and true
      revenue mix across software, payments, marketplace, and financial services are still not publicly
      underwritten.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI022
      - CI023
