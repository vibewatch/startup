  - id: unit-economics-and-cost-structure
    title: Unit economics and cost structure
    body: >-
      Fresha discloses transaction scale and some retention rhetoric, but not the unit economics that
      matter most for underwriting. Official 2026 sources establish more than 35 million monthly
      appointments, more than $15 billion in annual GMV, more than $1.4 billion in monthly appointment
      value in a later product release, and more than 1 million monthly app downloads. Those facts are
      financially important because they prove the platform is operating at meaningful throughput. The
      PRNewswire consumer-growth release also frames retention and rebooking as central economic levers,
      citing up to 40% revenue uplift from improved retention and loyal-client return rates above 83%
      after the third appointment. Even so, Fresha does not publish CAC, marketplace conversion, payment
      attach, gross margin, refund/chargeback burden, or revenue-recognition policy.

      The cost side is visible only indirectly. Partner terms show Fresha runs monthly invoicing, handles
      payment collection for online flows, and pushes chargeback liability back to merchants, while legal
      terms allow deposits, no-show fees, and cancellation charges up to 100% of appointment value. That
      implies meaningful payments operations, dispute management, support, and working-capital plumbing.
      Review evidence adds a second signal: merchants consistently describe the pricing structure as harder
      to budget than a flat SaaS subscription because subscriptions, card fees, marketplace commissions,
      SMS or support add-ons, and payment lock-in can stack together. Relative to peers, the model looks
      capable of attractive monetization on strong transaction volume, but the missing variables are still
      payment penetration, average service value, first-to-repeat conversion, support cost per location,
      and partner churn after the 2025 pricing transition.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI018
      - CI019
      - CI020
      - CI021
