- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'At the aggregate level, Fresha’s customer adoption is well supported. Official and high-quality media sources converge on 130,000+ partner businesses, 120+ countries, 450,000+ professionals, and 35M+ monthly appointments, while the homepage adds the stronger cumulative proof point of 1B+ appointments booked on-platform. Consumer-side demand is also clearly scaling: Fresha says monthly app downloads surpassed 1M and rose 300% since mid-2024, with Europe currently leading download volume, the Americas second, and APAC still accelerating. Named customer proof is thinner but directionally useful. Fresha’s 1M-download press cycle identifies multi-location operators Ted''s Grooming Room, Masaj, BarberSmiths, and Gould Barbers as adopting Fresha as shared infrastructure, and it includes direct quotes from Hair Artistry Newmarket and Banya No.1 about discovery quality, repeat bookings, and retention flows. The caveat is that these are company-curated proofs: they confirm live usage and
    relevance, but not contract size, deployment scope, or renewal economics.'
