chapter:
  number: 6
  title: Customers
  letter: U
  key: customers
  summary: 'Fresha clearly serves a two-sided beauty-and-wellness customer base: consumers discover and book services while partner businesses, their teams, and increasingly multi-location operators run operations and bear most commercial fees. Public proof of adoption is strong at the aggregate level — 130,000+ businesses, 450,000+ professionals, 35M+ monthly appointments, 1M+ monthly downloads, and 100M+ verified reviews — but named customer evidence remains marketing-led, retention disclosure stops at an 83% post-third-appointment milestone, and Fresha does not publicly disclose customer concentration, renewal, or enterprise contract depth.'
sections:
- id: segments-payers-and-users
  title: Segments, payers, and who actually uses Fresha
  body: 'Fresha is not a single-buyer SaaS product; it is a two-sided operating and discovery platform. On one side, consumers use the website and app to discover salons, barbershops, spas, medspas, wellness venues, and individual professionals, then book and in many cases pay through Fresha. On the other side, partner businesses use the software to run calendars, payments, inventory, marketing, and team workflows, while individual professionals and front-desk staff are the daily product users. The legal architecture matters because it clarifies who pays: partner terms place service fees, subscription fees, invoicing, and chargeback exposure on the business account rather than on the consumer. Public company and press materials also show that the supply base is not just small salons. Fresha explicitly positions itself for independent professionals, owner-operated venues, and increasingly multi-location operators. That mix is attractive because it lets Fresha land via free or low-friction
    operational tooling, then expand through discovery, payments, and retention tools as the account becomes more complex.'
