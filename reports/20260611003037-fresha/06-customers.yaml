  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-depth
    missingEvidence: Named enterprise and multi-location customer contracts showing live location counts, seat counts, spend, and renewal status.
    whyItMatters: Without contract-scale evidence, public named customer proof is directionally useful but not enough to size ACV, rollout velocity, or enterprise durability.
    diligencePath: Request top multi-location account case studies or customer list exports with locations, modules used, and renewal dates.
    relatedQuestionRefs:
    - QU010
    - QU012
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: NRR, GRR, logo churn, renewal rate, and cohort repeat-booking curves by acquisition channel and customer segment.
    whyItMatters: The chapter has only one public repeat-use statistic, which is insufficient to underwrite long-term durability or compare cohorts.
    diligencePath: Request cohort exports showing first booking, second booking, third booking, and 12-month retention by venue type and geography.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer share of revenue, GMV, processed payments, and bookings, plus concentration by geography and vertical.
    whyItMatters: Large undisclosed accounts could dominate payment volume or revenue, creating downside risk that public scale metrics hide.
    diligencePath: Request concentration schedules and customer cohort waterfalls from finance or board materials.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: support-sla
    missingEvidence: Support staffing levels, response-time SLAs, resolution-time distribution, escalation paths, and enterprise account-management ratios.
    whyItMatters: Review complaints suggest support is a real retention variable, but there is no public operating data to determine whether the issue is isolated or structural.
