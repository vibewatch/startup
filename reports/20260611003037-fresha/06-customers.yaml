  title: Customer segmentation table
  columns:
  - Segment
  - Buyer
  - Primary users
  - Economic payer
  - Use case / reason to buy
  - Public proof
  - Gap / risk
  rows:
  - - Consumers booking services
    - Individual client
    - App / web end user
    - Client pays for service to partner; not the software payer
    - Discover, compare, book, and often prepay for beauty and wellness services
    - Home page and terms of service show discovery, booking, payment, and partner-profile flows
    - Consumer demand is visible, but repeat frequency by cohort is not public
  - - Independent professional / solo operator
    - Owner-operator
    - Individual professional
    - Partner business account
    - Calendar, self-booking, payments, reminders, and lightweight CRM without heavy fixed cost
    - Company materials say Fresha supports businesses at every stage, including smaller operators
    - Unit economics for low-ARPU solo accounts are not publicly segmented
  - - Single-location salon / spa / barber SMB
    - Owner or manager
    - Front desk, stylists, therapists, managers
    - Partner business account
    - Run bookings, staff, inventory, POS, marketing, and marketplace demand from one stack
    - Capterra, FinancesOnline, and Makerstack all emphasize unlimited bookings, staff, and locations in core workflows
    - Support responsiveness and fee transparency are recurring complaints in review sources
  - - Multi-location operator
    - Operations leader / owner group
    - Managers plus distributed staff
    - Central partner account or business group
    - Standardize bookings, payments, client engagement, and performance across sites
    - PRNewswire and FashionABC cite Ted's Grooming Room, Masaj, BarberSmiths, and Gould Barbers as active adopters
    - No public contract value, rollout date, or ROI disclosed
  - - Front-desk and service teams
    - Business manager
    - Reception, stylists, therapists, barbers
    - Partner business account
    - Daily scheduling, reminders, payments, and client-history workflows
    - Home page cites 450,000+ stylists and professionals using Fresha
    - User-count scale is public, but active-seat utilization is not
  - - HQ / enterprise operations
    - Chain management
    - Ops, finance, local site teams
    - Business group
    - Consolidate fragmented tools into a single operating system with localized execution
    - BusinessWire says enterprise operators want scale without losing local identity
    - Reference set is still marketing-selected rather than independently documented procurement wins
  notes: Rows distinguish consumer, practitioner, and operator roles because Fresha is a two-sided marketplace plus operating software. Public evidence is strong on role coverage but weak on monetization and retention by segment.
