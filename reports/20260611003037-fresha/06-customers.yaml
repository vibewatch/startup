callouts:
- calloutType: strength
  title: Aggregate customer proof is strong
  body: Few vertical-software platforms can publicly show Fresha's combination of 130,000+ businesses, 35M+ monthly appointments, 1M+ monthly downloads, and a large review corpus. That makes customer existence and broad product relevance far less controversial than customer durability.
  claimRefs:
  - CU006
  - CU012
  - CU013
  - CU015
- calloutType: risk
  title: Durability is less transparent than scale
  body: Public sources do not disclose top-customer concentration, enterprise ACV, NRR, churn, renewal, or support SLA metrics. Review platforms show enough fee and support friction to make these missing disclosures material rather than cosmetic.
  claimRefs:
  - CU020
  - CU025
  - CU026
  - CU033
  - CU038
