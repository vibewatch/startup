- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Current read
  - Why it matters
  - Public proof
  - Impact on durability
  - Diligence path
  rows:
  - - Multi-location consolidation
    - Expansion driver
    - Larger operators can standardize discovery, booking, payments, and reporting on one stack
    - PRNewswire and BusinessWire both frame enterprise and multi-location adoption as current momentum
    - Supports higher ACV and lower churn if deployments go well
    - Request named rollout counts, location adds, and enterprise renewal data
  - - Discovery + payments + loyalty bundle
    - Expansion driver
    - More modules can increase switching cost and wallet share after initial adoption
    - Partner terms plus customer-proof releases show bookings, payments, and retention tooling are sold together
    - Can deepen account embeddedness beyond simple scheduling
    - Request module attach rates by customer segment
  - - Europe-led download mix
    - Mixed
    - Broad geography helps diversification, but Europe still appears to be the heaviest consumer market
    - PRNewswire and FashionABC say Europe leads downloads, Americas are next, APAC is high growth
    - Regional concentration may still be meaningful even with 120+ countries
    - Provide bookings, GMV, and revenue by region
  - - Fee and attribution disputes
    - Retention risk
    - If merchants think Fresha over-claims new-client acquisition, trust and expansion economics suffer
    - Capterra, Software Advice, SchedulingKit, and Makerstack all preserve fee complaints
    - Can weaken payback, raise churn, and limit enterprise rollouts
    - Share dispute rates, refund policy, and support escalation metrics
  - - Customer concentration disclosure gap
    - Concentration risk
    - No public top-customer share, ACV mix, or revenue concentration means downside cannot be sized
    - Company and media sources describe scale but not concentration
    - A few large accounts could matter more than public evidence implies
    - Provide top-10 customer share of revenue / GMV and sector mix
  - - Competitive switching options
    - Retention risk
    - Booksy, Vagaro, Mindbody, StyleSeat, Square, and compare tools all court overlapping buyer segments
    - Competitor sites show viable alternatives for solo, SMB, wellness, and multi-location buyers
    - Weak support or pricing trust could make switching easier
    - Map win/loss and churn reasons by segment
  notes: The central risk is not lack of adoption; it is lack of disclosure on how much of that adoption is sticky, multi-product, enterprise-scaled, or concentrated in a few customer cohorts.
