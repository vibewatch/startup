- id: retention-repeat-usage-and-satisfaction
  title: Retention, repeat usage, and satisfaction
  body: 'Public durability evidence is meaningful but incomplete. The strongest direct retention datapoint is Fresha’s claim that once clients reach their third appointment with a Fresha business, loyal-client return rates exceed 83%. Company-backed materials also argue that improving retention through rebooking, loyalty, and client engagement can lift business revenue by up to 40%, which supports the idea that Fresha is trying to monetize not just first-booking acquisition but repeat behavior. Independent review platforms mostly reinforce that merchants find the product useful: Trustpilot, Capterra, and Software Advice all show high aggregate ratings, with repeated praise for ease of use, reminders, onboarding, and client self-booking. But the same review corpus also surfaces the main durability risks: no phone support, billing or attribution disputes, 20% new-client fee complaints, and frustration when support does not resolve account issues quickly. Fresha therefore has evidence of repeat
    utility and broad satisfaction, but not the cohort disclosure needed to underwrite churn or renewal with confidence.'
