figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Fresha's customer journey links consumer discovery with partner operations, then tries to deepen retention through rebooking, loyalty, and multi-location standardization.
  data:
    items:
    - stage: Discover
      label: Consumer discovers venue or professional
      detail: Search, rankings, ratings, images, and reviews create top-of-funnel demand across app, web, and widget surfaces.
    - stage: Evaluate
      label: Client evaluates profile quality
      detail: Portfolios, professional profiles, reviews, and service menus help narrow choice before the first booking.
    - stage: Book
      label: Appointment and payment are completed
      detail: Fresha arranges the booking and can collect payment for participating partners as commercial agent.
    - stage: Deliver
      label: Partner team uses operating workflow
      detail: Reception and service staff run calendar, reminders, payments, and client-history tasks inside the software.
    - stage: Rebook
      label: Retention loop activates
      detail: Loyalty programs, automated rebooking, and targeted engagement aim to convert one-off visits into repeat behavior.
    - stage: Expand
      label: Operator consolidates more locations or modules
      detail: As accounts add sites, payments, and retention tooling, Fresha pushes toward deeper standardization and higher account value.
  claimRefs:
