evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, committee structure, ownership concentrations, investor-rights summary, and executive
      succession map.
    whyItMatters: >-
      Public founder continuity is clear, but oversight quality and control concentration cannot be assessed without
      formal governance documents.
    diligencePath: Request the board list, cap table, voting agreements, information-rights summary, and executive org chart.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      A capital-stack bridge reconciling the official $285 million total with database-oriented $295 million totals and
      clarifying the treatment of the reported 2024 J.P. Morgan debt facility.
    whyItMatters: >-
      Investors and lenders cannot be underwritten cleanly until equity, debt, and total-raised figures are made
      consistent.
    diligencePath: >-
      Request financing closing memos, debt agreements, and a round-by-round capital table including debt
      classification.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-headcount
    missingEvidence: >-
      Audited or management-reported revenue, gross margin, headcount, retention, and cohort economics that verify the
      third-party run-rate and staffing estimates.
    whyItMatters: >-
      Fresha’s scale is clear, but valuation durability depends on revenue quality, labor efficiency, and partner
      retention rather than booking volume alone.
    diligencePath: Request the latest board deck, monthly KPI pack, audited financials, and headcount by function and geography.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A full shareholder register, lender schedule, and economics for strategic partners and payments counterparties.
    whyItMatters: >-
      The public stakeholder map is useful directionally but incomplete for judging concentration, governance leverage,
      and platform-counterparty dependence.
    diligencePath: Request the full cap table, debt schedule, major commercial contracts, and payment-processing economics.
    relatedQuestionRefs:
      - QO013
      - QO017
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      Comparable methodology notes or normalized current-year market values that reconcile the narrow Mordor lens with
      the broader Strategic and ResearchAndMarkets scopes.
    whyItMatters: >-
      Without boundary normalization, a valuation model can overstate TAM by mixing software-only, broader
      operating-software, and adjacent monetization layers.
    diligencePath: >-
      Request publisher methodology excerpts or triangulate with a third current-year software-only dataset before using
      one scalar TAM in the model.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: fresha-revenue-mix
    missingEvidence: >-
      2026 split of Fresha revenue or gross profit by subscriptions, marketplace commissions, payments, messaging, and
      any capital products, plus region mix.
    whyItMatters: >-
      Translating software-market TAM into Fresha revenue requires knowing which monetization rails actually scale and
      whether they are concentrated in one geography or merchant cohort.
    diligencePath: >-
      Request management reporting that breaks revenue, take rate, GMV, and gross margin by monetization rail and
      region.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM005
  - type: missing-source
    severity: material
    topic: medspa-clinical-sam
    missingEvidence: >-
      Current Fresha product, security, and workflow evidence for consent forms, charts, prescriptions, or
      healthcare-grade documentation needed by regulated aesthetic clinics.
    whyItMatters: >-
      The medspa segment is growing fastest and has the richest per-location economics, but served-market fit changes
      materially if Fresha cannot support clinic-grade workflows.
    diligencePath: >-
      Request a current medspa product demo, security documentation, and feature map against consent, charting, and
      region-specific compliance needs.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM003
      - TM005
  - type: missing-source
    severity: material
    topic: current-pricing-precision
    missingEvidence: >-
      A clean current official Fresha pricing page capture with numeric plan amounts, regional payment rates, and
      explicit marketplace-fee rules.
    whyItMatters: >-
      Competitor pricing comparison is central to this chapter, but the fetched official pricing snapshot did not render
      enough numeric detail to underwrite exact current plan math.
    diligencePath: >-
      Capture the current pricing page, relevant Help Center pricing articles, and one sample partner invoice by
      geography.
    relatedQuestionRefs:
      - QP012
      - QP014
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-multi-homing
    missingEvidence: >-
      Observed migration win/loss data, multi-home rates, channel mix by booking source, and retention by cohort for
      Fresha versus named peers.
    whyItMatters: >-
      The moat case hinges on whether discovery plus workflow data creates real retention, but public sources do not
      show measured switching behavior.
    diligencePath: >-
      Request churn cohorts, migration reasons, channel attribution, and the share of merchants processing all bookings
      through Fresha.
    relatedQuestionRefs:
      - QP021
      - QP022
      - QP025
    relatedTableRefs:
      - TP004
  - type: enumeration-incomplete
    severity: medium
    topic: likely-entrants
    missingEvidence: >-
      Deeper source coverage for adjacent entrants such as Boulevard, Zenoti, or ClassPass beauty expansion, which
      appear only lightly in the fetched pack.
    whyItMatters: >-
      Likely entrants matter for moat durability, but the pack is only strong enough to note them, not to profile them
      at the same standard as the core set.
    diligencePath: >-
      Fetch official product pages, pricing, and scale evidence for the next most likely entrant class before broadening
      the comparison set.
    relatedQuestionRefs:
      - QP001
      - QP027
    relatedTableRefs:
      - TP001
      - TP004
  - type: conflicting-data
    severity: material
    topic: fresha-free-vs-paid-narrative
    missingEvidence: >-
      A reconciled statement of what remains free, which subscriptions apply by partner type, and which transaction or
