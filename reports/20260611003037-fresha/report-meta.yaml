companyProfile:
  summary: >-
    Fresha is a London-headquartered beauty-and-wellness marketplace and
    business-management platform founded in 2015 by William Zeqiri and Nicholas
    Miller, originally launched as Shedul and rebranded to Fresha in 2020.
    Public evidence supports a scaled dual-sided model spanning consumer
    discovery, booking, payments, messaging, marketing, inventory, and partner
    operating workflows for salons, spas, barbershops, medspas, and related
    service businesses. The strongest current financing marker is an $80
    million May 2026 KKR primary round at a valuation above $1 billion, with
    company-backed materials also claiming profitability, more than 130,000
    partner businesses, more than 35 million monthly appointments, and more
    than $15 billion in annual GMV. The core diligence constraint is not demand
    proof but disclosure quality: audited financials, margin, churn,
    governance, and capital-structure detail remain limited in the public pack.
  foundedDate: '2015-01-01'
  founders:
    - name: William Zeqiri
      role: Founder and CEO
      background: >-
        Co-founder and principal public executive voice behind Fresha's growth,
        fundraising, and marketplace-plus-payments strategy.
      claimRefs: [CO013, CO014, CO028]
    - name: Nicholas Miller
      role: Co-founder and Chief Product Officer
      background: >-
        Co-founder and product leader associated with the company's platform
        evolution from Shedul into Fresha's broader operating system.
      claimRefs: [CO014, CO028]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    All-in-one beauty-and-wellness operating software and consumer marketplace
    spanning online booking, staff and calendar management, payments, POS,
    messaging, marketing, inventory, discovery, and AI-led merchandising
    features.
  customerFocus: >-
    Beauty, wellness, and self-care SMBs, independent professionals, and
    increasingly multi-location operators, alongside consumers booking services
    through Fresha's app and web marketplace.
  businessModel: >-
    Hybrid monetization through partner subscriptions, payment processing,
    marketplace and new-client acquisition fees, booking-related charges, and
    retention or marketing upsell layered onto a dual-sided marketplace.
  stage: Late-stage private growth company / unicorn
  fundingStatus: >-
    May 2026 $80 million KKR-led primary growth investment at a valuation above
    $1 billion, with company-backed total capital raised of $285 million.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO006, CO016, CO021, CO023, CO024, CU008, CI008, CI009]
summary:
  headline: >-
    Fresha has enough scale, product breadth, and profitability signal to merit
    active tracking, but public disclosure is still too thin and the >$1B mark
    looks stretched for a fresh buy.
  overallScore: 7.0
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: 140
    arrUsdM: null
    revenueGrowthYoYPct: 60
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 285
    customerCount: 130000
    headcount: 500
  topStrengths:
    - >-
      Real operating scale is well supported by public evidence: 130,000+
      partner businesses, 35M+ monthly appointments, 120+ countries, and more
      than $15B in annual GMV.
    - >-
      Fresha combines consumer discovery, merchant workflow, and integrated
      payments in one beauty-and-wellness-specific stack, creating meaningful
      workflow and data coupling.
    - >-
      The May 2026 KKR round at a >$1B valuation plus management's
      profitability claim show that the company is not a pre-scale narrative
      asset.
    - >-
      Product breadth keeps expanding beyond booking into payments, marketing,
      inventory, multi-location support, and AI-led portfolio/profile features.
    - >-
      Consumer demand signals remain strong, including 1M+ monthly app
      downloads and 100M+ verified reviews cited in 2026 materials.
  topRisks:
    - >-
      Public disclosure still lacks audited revenue by stream, take rate, gross
      margin, churn, cash, debt terms, and cap-table waterfall, limiting clean
      underwriting.
    - >-
      The 2025-2026 pricing transition appears to have increased merchant fee
      complexity and support friction, with repeated complaints about
      attribution, subscriptions, and new-client commissions.
    - >-
      Fresha's legal and commercial setup pushes meaningful chargeback,
      refund, privacy, and service-delivery exposure across a global merchant
      base without corresponding public compliance detail.
    - >-
      Competition is credible and multi-front, with Booksy, Vagaro, Mindbody,
      Square, and StyleSeat each offering cleaner pricing, stronger niche
      positioning, or broader ecosystem depth in parts of the market.
    - >-
      The current unicorn valuation seems full relative to the best public
      revenue anchor of $140M+ run-rate and remains sensitive to hidden debt,
      preference, or retention weakness.
  unresolvedGaps:
    - >-
      Audited current revenue by stream, net payments economics, gross margin,
      and cash-flow or profitability detail beyond the company-backed claim.
    - >-
      Merchant retention, churn, NRR, and cohort behavior before and after the
      post-2025 pricing transition.
    - >-
      Full debt, reserve, processor-obligation, and cap-table waterfall detail,
      including any senior preference protections above new money.
    - >-
      Customer concentration, enterprise contract depth, regional revenue or
      GMV mix, and the share of volume driven by large multi-location accounts.
    - >-
      Board composition, governance rights, and the detailed compliance-control
      package for privacy, fraud, AML, dispute handling, and cross-border data
      transfer.
