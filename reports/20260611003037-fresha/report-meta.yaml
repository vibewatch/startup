coverageNotes: >-
  Public evidence as of 2026-06-11 strongly supports Fresha's founding,
  rebrand history, global merchant and appointment scale, product breadth,
  profitability claim, and the May 2026 KKR round at a valuation above $1
  billion. The main caveats are missing audited revenue, take rate, gross
  margin, cash, churn, debt, and preference-stack disclosure; some official
  operating metrics drift between 130,000+ and 140,000+ businesses; and public
  capital-raised figures differ between the company-backed $285 million total
  and a roughly $295 million database view that appears to include debt.
