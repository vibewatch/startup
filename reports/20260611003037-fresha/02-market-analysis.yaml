- id: growth-drivers-constraints-and-gaps
  title: Growth drivers, adoption constraints, and preserved gaps
  body: |-
    The best-supported growth drivers are cloud migration, mobile booking demand, membership-led retention strategies, AI-enabled personalization, and merchant demand for integrated discovery-plus-payments stacks. Mordor's module and deployment splits, Zenoti's 2025 benchmarks, and competitor marketing pages all point in the same direction: software that compresses booking, CRM, payments, marketing, and reporting into one workflow can lift utilization and revenue while making consumer acquisition less dependent on merchants running their own demand generation. That helps explain why discovery marketplaces and embedded-finance tools keep appearing across the category.

    The main constraints are not demand scarcity but implementation economics and scope fit. Mordor flags switching costs, privacy and compliance complexity, and horizontal POS or booking competition. Adverse pricing guides add a second constraint set: transaction fees, new-client commissions, processor lock-in, and support limitations can make adoption rational for early-stage salons yet unattractive for high-volume merchants if incremental demand is weak. The fastest-growing medspa wedge adds a third constraint, because clinical documentation and regulated-workflow depth are more clearly marketed by medspa-specific vendors than by Fresha's current public materials. The preserved diligence gaps are therefore important: public sources still do not isolate Fresha's revenue mix, regional mix, take rate by booking source, or retention by acquisition channel, so TAM cannot yet be translated into revenue quality with confidence.
