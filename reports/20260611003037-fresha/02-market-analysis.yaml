- id: TM005
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Cloud migration and unified workflows
    - up
    - current to 24 months
    - Favors vendors that combine booking, CRM, payments, and reporting in one stack
    - Request Fresha win-loss data versus fragmented point-solution stacks
  - - Mobile booking and consumer self-service demand
    - up
    - current
    - Makes self-booking and reminders non-optional in most segments
    - Request conversion uplift from widget, app, and marketplace channels by segment
  - - Membership, retention, and AI-led personalization
    - up
    - 12-24 months
    - Raises ROI for CRM, rebooking, and messaging modules
    - Request evidence that AI and membership tools improve repeat-rate economics
  - - Marketplace and embedded-finance attachment
    - up
    - current to 24 months
    - Expands monetization beyond software subscriptions
    - Request take-rate split across subscription, marketplace, payments, and capital
  - - Switching and implementation cost
    - down
    - current
    - Slows migration away from legacy tools despite clear workflow benefits
    - Request migration time, data-porting burden, and churn during onboarding
  - - Privacy, compliance, and clinical-scope demands
    - down
    - current and rising
    - Narrows fit in regulated or documentation-heavy clinic settings
    - Request product mapping for consent, charting, and region-specific compliance
  - - Horizontal POS/booking pressure
    - down
    - current
    - Caps pricing power when merchants can buy adjacent tools from broader SMB stacks
    - Request Fresha price elasticity and replacement reasons versus Square or generic POS
  - - Fee sensitivity, processor lock-in, and support quality
    - down
    - current
    - Can turn adoption positive for growth seekers but negative for high-volume or support-heavy merchants
    - Request cohort retention by acquisition source and by payment-attachment level
  notes: The highest-conviction underwriting question is not whether category demand exists, but whether integrated software plus marketplace plus payments produces durable merchant ROI after fees, compliance, and switching frictions are accounted for.
