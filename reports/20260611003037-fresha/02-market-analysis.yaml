tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Core vertical operating software
    - Scheduling, CRM, staff calendars, POS, payments, inventory, reporting, messaging
    - Generic office software or horizontal accounting suites
    - Salon/spa owner, manager, or ops lead
    - Directly matches the workflows Fresha and peers market
  - - Discovery and marketplace layer
    - Consumer search, reviews, book-now flows, marketplace acquisition, rebooking loops
    - Pure consumer beauty-product spend outside booking flow
    - Merchant payer; consumer demand is indirect driver
    - Important because Fresha, Booksy, Mindbody, and StyleSeat all market client discovery as part of value
  - - Transaction and finance rails
    - Integrated card payments, deposits, no-show fees, instant payouts or capital access
    - Standalone merchant acquiring or banking not tied to workflow software
    - Merchant payer with transaction-linked economics
    - Relevant because monetization increasingly rides on payment and finance attachment
  - - Beauty and wellness service verticals
    - Salons, spas, barbershops, nail studios, waxing, medspas, wellness studios
    - Restaurants, general retail, unrelated appointment verticals
    - Owner-operator through enterprise chain buyers
    - Defines the immediate served market for Fresha-aligned software
  - - Clinical adjacencies
    - Light forms and service documentation for aesthetics where present
    - Full EMR, prescriptions, clinical consent systems, wider healthcare IT
    - Clinic owner or medical director budgets
    - Often adjacent rather than core for Fresha; more central for Boulevard and Pabau
  notes: 'The included boundary follows what official Fresha and competitor pages actually market to merchants: workflow software plus attached discovery and transaction rails, not all beauty spend or all service-software categories.'
