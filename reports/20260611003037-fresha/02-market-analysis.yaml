  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: Comparable methodology notes or normalized current-year market values that reconcile the narrow Mordor lens with the broader Strategic and ResearchAndMarkets scopes.
    whyItMatters: Without boundary normalization, a valuation model can overstate TAM by mixing software-only, broader operating-software, and adjacent monetization layers.
    diligencePath: Request publisher methodology excerpts or triangulate with a third current-year software-only dataset before using one scalar TAM in the model.
    relatedQuestionRefs:
    - QM006
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: fresha-revenue-mix
    missingEvidence: 2026 split of Fresha revenue or gross profit by subscriptions, marketplace commissions, payments, messaging, and any capital products, plus region mix.
    whyItMatters: Translating software-market TAM into Fresha revenue requires knowing which monetization rails actually scale and whether they are concentrated in one geography or merchant cohort.
    diligencePath: Request management reporting that breaks revenue, take rate, GMV, and gross margin by monetization rail and region.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: missing-source
    severity: material
    topic: medspa-clinical-sam
    missingEvidence: Current Fresha product, security, and workflow evidence for consent forms, charts, prescriptions, or healthcare-grade documentation needed by regulated aesthetic clinics.
    whyItMatters: The medspa segment is growing fastest and has the richest per-location economics, but served-market fit changes materially if Fresha cannot support clinic-grade workflows.
    diligencePath: Request a current medspa product demo, security documentation, and feature map against consent, charting, and region-specific compliance needs.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM003
    - TM005
