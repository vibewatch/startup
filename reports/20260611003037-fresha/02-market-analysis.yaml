company:
  name: Fresha
chapter:
  number: 2
  title: Market Analysis
  summary: 'Fresha’s relevant market is broader than scheduling but narrower than all beauty-and-wellness spend: it is vertical operating software for service businesses with attached discovery, payment, and retention rails. Public publisher lenses range from a narrow $1.12 billion 2026 software market to a broader $3.5 billion 2024 category estimate, so the most defensible underwriting view is a constrained workflow wedge rather than the largest headline TAM. Buyer logic also differs sharply by segment, with independents driving current volume while chains and medspas raise the highest-value workflow and compliance demands.'
sections:
- id: market-boundary-and-included-spend
  title: Market boundary, included spend, and excluded adjacencies
  body: |-
    Fresha sits inside a narrower market than 'beauty and wellness' writ large and a broader market than simple appointment booking. The strongest boundary evidence comes from Fresha's own consumer and partner surfaces plus comparable competitor pages. Those materials consistently show an operating stack that includes online booking, calendar management, client records, point-of-sale and payments, inventory, marketing or messaging, and some form of discovery or marketplace distribution. That means the relevant core category is vertical operating software for beauty and wellness service providers, with discovery and transaction rails attached, not consumer beauty spend, merchant acquiring in the abstract, or generic SMB software across all service categories.

    This boundary matters for underwriting because publisher scopes vary. ResearchAndMarkets breaks the space into scheduling, POS, employee management, CRM, inventory, pricing model, deployment, end-user, and regional TAM layers, while Fresha's legal and product surfaces show monetization reaching beyond a calendar into payment intermediation, marketplace fees, and subscription services. The category therefore includes the workflow software and monetizable adjacent rails that merchants actually buy to run salons, spas, barbershops, medspas, and similar businesses. It excludes most pure consumer spend, unrelated retail-tech stacks, and the fully clinical record systems that medspa-first platforms emphasize when they move beyond beauty-service workflows.
