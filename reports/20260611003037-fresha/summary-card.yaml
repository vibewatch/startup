  topStrengths:
    - >-
      Real operating scale is well supported by public evidence: 130,000+ partner businesses, 35M+ monthly appointments,
      120+ countries, and more than $15B in annual GMV.
    - >-
      Fresha combines consumer discovery, merchant workflow, and integrated payments in one beauty-and-wellness-specific
      stack, creating meaningful workflow and data coupling.
    - >-
      The May 2026 KKR round at a >$1B valuation plus management's profitability claim show that the company is not a
      pre-scale narrative asset.
    - >-
      Product breadth keeps expanding beyond booking into payments, marketing, inventory, multi-location support, and
      AI-led portfolio/profile features.
    - >-
      Consumer demand signals remain strong, including 1M+ monthly app downloads and 100M+ verified reviews cited in
      2026 materials.
  topRisks:
    - >-
      Public disclosure still lacks audited revenue by stream, take rate, gross margin, churn, cash, debt terms, and
      cap-table waterfall, limiting clean underwriting.
    - >-
      The 2025-2026 pricing transition appears to have increased merchant fee complexity and support friction, with
      repeated complaints about attribution, subscriptions, and new-client commissions.
    - >-
      Fresha's legal and commercial setup pushes meaningful chargeback, refund, privacy, and service-delivery exposure
      across a global merchant base without corresponding public compliance detail.
    - >-
      Competition is credible and multi-front, with Booksy, Vagaro, Mindbody, Square, and StyleSeat each offering
      cleaner pricing, stronger niche positioning, or broader ecosystem depth in parts of the market.
    - >-
      The current unicorn valuation seems full relative to the best public revenue anchor of $140M+ run-rate and remains
      sensitive to hidden debt, preference, or retention weakness.
  unresolvedGaps:
    - >-
      Audited current revenue by stream, net payments economics, gross margin, and cash-flow or profitability detail
      beyond the company-backed claim.
    - Merchant retention, churn, NRR, and cohort behavior before and after the post-2025 pricing transition.
    - >-
      Full debt, reserve, processor-obligation, and cap-table waterfall detail, including any senior preference
      protections above new money.
    - >-
      Customer concentration, enterprise contract depth, regional revenue or GMV mix, and the share of volume driven by
      large multi-location accounts.
    - >-
      Board composition, governance rights, and the detailed compliance-control package for privacy, fraud, AML, dispute
      handling, and cross-border data transfer.
