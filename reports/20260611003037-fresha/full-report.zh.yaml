      - number: '3.2'
        title: 竞争对手画像与定位
        blocks:
          - type: paragraph
            body: >-
              最重要的画像差异，是各平台位于市场主导获客与运营主导软件之间的哪个位置。Fresha 最强的画像是一个集成美容与康养市场，加上支付和商户软件的平台，全球规模很大，拥有 130,000+ 到 140,000+
              家商户和每月 35M+ 次预约。Mindbody 的画像是最成熟的健身与康养老牌玩家，拥有 3M+ 活跃用户、40,000+ 家商户、600M+ 年度课程和预约，并重金投入品牌
              app、营销和多门店控制。Vagaro 的画像是覆盖美容 / 康养 / 健身的宽操作系统，拥有 300K 名专业人士、2025 年 162M 次预约，并通过 API
              和信任中心界面明确摆出从中小商户到企业客户的定位。


              Booksy 是最近的直接同行，因为它同样把美容专用市场与支付、客户营销和排期绑定，但变现采用更清晰的订阅模型，并服务 330,000+ 名美容与康养专业人士网络。Square Appointments
              的美容原生属性没那么强，但它重要，因为买方可以选择更宽的商业生态，而不是垂直市场。StyleSeat 更专注个人美容专业人士，因明确的 AI
              营销、智能定价和需求生成主张而值得关注。竞争含义是：买方想要一个内建发现的一体化美容与康养栈时，Fresha 会赢；买方需要更深的健身 /
              康养专业化、更强的美国式老牌工具、更宽的商业基础设施，或价格更平的个人专业人士增长引擎时，Fresha 暴露度更高。
