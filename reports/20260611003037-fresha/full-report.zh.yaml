  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动 / 风险
      - 当前判断
      - 为什么重要
      - 公开验证
      - 对耐久性的影响
      - 尽调路径
    rows:
      - - 多门店整合
        - 扩张驱动
        - 更大的运营方可以在同一套技术栈上标准化发现、预约、支付和报表
        - PRNewswire 和 BusinessWire 都把企业与多门店采用描述为当前动能
        - 如果部署顺利，支撑更高 ACV 和更低流失
        - 要求提供具名部署数、门店新增数和企业续约数据
      - - 发现 + 支付 + 忠诚度组合
        - 扩张驱动
        - 初始采用后，更多模块可以提高切换成本和钱包份额
        - 合作条款和客户验证新闻稿显示，预约、支付和留存工具被打包销售
        - 能把账户嵌入度推深，不止是简单排期
        - 要求按客户细分给出模块附加率
      - - 欧洲主导下载结构
        - 混合
        - 地域广度有助于分散风险，但欧洲看起来仍是最重的消费者市场
        - PRNewswire 和 FashionABC 称欧洲下载领先，美洲其次，APAC 高增长
        - 即便覆盖 120+ 个国家，区域集中度可能仍有意义
        - 提供按地区拆分的预约量、GMV 和收入
      - - 费用与归因争议
        - 留存风险
        - 如果商家认为 Fresha 夸大新客获取贡献，信任和扩张经济性都会受损
        - Capterra、Software Advice、SchedulingKit 和 Makerstack 都留存了费用投诉
        - 可能削弱回本、推高流失，并限制企业部署
        - 分享争议率、退款政策和支持升级指标
      - - 客户集中度披露缺口
        - 集中度风险
        - 公开材料没有头部客户占比、ACV 结构或收入集中度，因而无法量化下行
        - 公司和媒体来源描述了规模，但没有描述集中度
        - 少数大客户的重要性可能高于公开证据暗示
        - 提供前 10 大客户收入 / GMV 占比和行业组合
      - - 竞争切换选项
        - 留存风险
        - Booksy、Vagaro、Mindbody、StyleSeat、Square 和对比工具都在争夺重叠买家细分
        - 竞争对手网站显示，单人、SMB、健康养生和多门店买家都有可行替代品
        - 支持薄弱或价格信任下降，会让切换更容易
        - 按细分绘制赢单 / 输单和流失原因
    notes: 核心风险不是缺少采用，而是缺少披露：这些采用到底有多粘、多产品化、企业化到什么程度，是否集中在少数客户队列。
