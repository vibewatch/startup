      - number: '6.3'
        title: 留存、重复使用与满意度
        blocks:
          - type: paragraph
            body: >-
              公开的耐久性证据有意义，但不完整。最强的直接留存数据点是 Fresha 的说法：客户在某家 Fresha 商户完成第三次预约后，忠诚客户回访率超过
              83%。公司背书材料还称，通过再预订、忠诚度和客户互动提升留存，商户收入最高可增加 40%；这支持一个判断：Fresha
              想变现的不只是首次预订获客，也包括重复行为。独立评论平台大体也印证，商户认为产品有用：Trustpilot、Capterra 和 Software Advice
              的综合评分都很高，易用性、提醒、上手流程和客户自助预订被反复表扬。但同一组评论也暴露出主要耐久性风险：没有电话支持、账单或归因争议、20% 新客费用投诉，以及支持无法快速解决账户问题时的挫败感。因此，Fresha
              有重复效用和广泛满意度证据，但还没有足以支撑流失或续约判断的队列披露。
