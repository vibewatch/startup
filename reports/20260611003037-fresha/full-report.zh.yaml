companyProfile:
  summary: >-
    Fresha 是一家总部位于伦敦的美容与康养市场和商户管理平台，William Zeqiri 与 Nicholas Miller 于 2015 年创立，最初以 Shedul 上线，2020 年改名为
    Fresha。公开证据支持其双边模型已经跑出规模：一边服务消费者发现、预约和支付，另一边覆盖沙龙、水疗、理发店、医美水疗及相邻服务商户的支付、消息、营销、库存和经营流程。当前最强融资锚点是 2026 年 5 月 KKR 领投 $80
    million 新股轮，估值超过 $1 billion；公司背书材料还称 Fresha 已盈利，拥有超过 130,000 家合作商户、每月超过 35 million 次预约、年 GMV 超过 $15
    billion。核心尽调约束不是需求证明，而是披露质量：经审计财务、利润率、流失、治理和资本结构细节在公开材料里仍有限。
