  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除的邻近领域
        blocks:
          - type: paragraph
            body: >-
              Fresha 所处市场比笼统的“美容与康养”更窄，又比简单预约预订更宽。最强的边界证据来自 Fresha
              自身的消费者端、合作商户端界面，以及可比竞争对手页面。这些材料一致呈现一套运营栈：在线预约、日历管理、客户记录、POS
              与支付、库存、营销或消息，以及某种形式的发现或市场分发。也就是说，相关核心品类是面向美容与康养服务商户的垂直操作软件，并附带发现和交易轨道；不是消费者美容支出、抽象的商户收单，也不是横跨所有服务品类的通用中小企业软件。


              这条边界对承销很重要，因为不同发布方的口径不同。ResearchAndMarkets 把空间拆成排期、POS、员工管理、CRM、库存、定价模型、部署、终端用户和区域 TAM 层；Fresha
              的法律与产品界面则显示，变现已经从日历延伸到支付中介、市场费用和订阅服务。因此，该品类应包括商户实际购买、用来经营沙龙、水疗、理发店、医美水疗及类似业务的工作流软件，以及可变现的邻近轨道。它排除了大多数纯消费者支出、无关零售科技栈，以及医美水疗优先平台在超出美容服务流程后强调的完整临床记录系统。
