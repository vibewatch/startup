  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资记录足以锚定价格讨论，但不足以结束讨论。Fresha 2026 年 5 月的 KKR 交易是真实的后期验证信号：公司背书和独立报道都指向一笔 $80 million 的新股投资、估值超过 $1
              billion、累计融资 $285 million，并且业务已经盈利。这不是种子轮叙事融资，而是证据：一家蓝筹成长投资人看到了一个有真实运营证明的规模化平台。同一组保留来源还显示，平台月度预约超过 3500
              万次，年度 GMV 超过 $15 billion，平台商户超过 130,000 家，说明公司已有足够吞吐量，值得被认真看待。


              价格纪律问题在于，透明度仍远薄于估值标题。本轮最强的公开收入锚点是一份第三方报告，称 Fresha 收入运行率超过 $140 million、年增长超过 60%。如果这个估计方向正确，当前独角兽估值看起来略高于
              7x 收入——对一家盈利、市场加支付平台来说可以辩护，但在费率、毛利率、流失、现金、债务和清算优先权公开披露有限的情况下，并不显得便宜。评论来源还显示，2025 年脱离旧免费核心叙事后，定价反弹明显。因此，适合
              IC 的结论是观察而非买入：密切跟踪，但没有私有尽调或更好入口，不应穿透当前估值支付。
