      - number: '1.3'
        title: 融资历史、估值、投资人和资本结构
        blocks:
          - type: paragraph
            body: >-
              公开融资锚点中，支撑最好的两个时间点是 2021 年 6 月和 2026 年 5 月。2021 年 6 月，Fresha 宣布由 General Atlantic 领投 $100 million Series
              C，Huda Kattan of HB Investments、Michael Zeisser of FMZ Ventures、Jonathan Green of Lugard Road Capital
              等战略投资人参与，Partech、Target Global 和 FJ Labs 跟投。该公告称累计融资已达 $132 million，并把 Fresha
              定位为快速扩张、免订阅的美容与康养软件平台，内嵌支付和市场预约。2026 年 5 月，公司背书与独立报道再次在 KKR 成长投资 $80 million、估值超过 $1 billion 上汇合，推动 Fresha
              进入独角兽行列，官方累计融资升至 $285 million。

              标题轮次之外的资本结构披露不够干净。第三方数据库和媒体来源指向 2024 年 8 月 J.P. Morgan 提供的 $30.8 million 或约 $31 million
              风险债融资，并提到更早的种子轮、Series A、Series B 和 2021 年 Series C 延展轮，但这些细节并非都被已抓取材料中的一手材料交叉验证。这个问题重要，因为一个数据库取向来源报告累计融资
              $295 million（含债务），而 Fresha 官方 2026 年公告称累计融资 $285
              million。若债务分类不同，这一差额小到可以解释，但仍是真实的对账问题。审阅记录中最稳定出现的投资人与资金方包括 KKR、General Atlantic、Partech、Target Global、FJ
              Labs、HB Investments，以及作为贷款方而非股权投资人的 J.P. Morgan。
