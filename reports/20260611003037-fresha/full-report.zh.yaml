  - id: TV002
    title: 正反投资论点表
    columns:
      - 主题
      - 看多证据
      - 反论点 / 未决问题
      - 什么会改变看法
    rows:
      - - 规模与证据
        - 35M+ 月预约、>$15B 年 GMV、130K+ 商户和盈利能力，支撑真实平台体量。
        - 规模证明不能替代经审计收入、利润率和留存数据。
        - 提供经审计的 2025 年和 LTM 2026 分收入流收入，以及分业务线毛利率。
      - - 市场结构
        - 统一云、嵌入式支付和 AI 汇入同一套工作流栈，品类在增长。
        - Zenoti 的 2024 基准显示整体收入只增长 2%，并非每个运营商都在高速复利。
        - 展示 Fresha 相比品类均值的份额提升和 cohort 增长。
      - - 变现设计
        - 订阅、支付和 marketplace 费用的混合模式，可以比单一排期 SaaS 撑起更高 ARPU。
        - 同一套混合设计也带来费用复杂度、定价反弹和归因争议。
        - 证明 2025 年后变现改善了净收入留存，且没有伤害商户信任。
      - - 竞争位置
        - 当发现、工作流和支付一起采购时，Fresha 仍有差异化。
        - 在部分市场，Booksy、StyleSeat、Square、Vagaro 和 Mindbody 各自提供更干净的定价，或更强的垂直细分覆盖。
        - 展示相对这些替代方案的赢率和流失原因。
      - - 估值视角
        - 一个盈利的混合模式垂直平台，可以相对普通排期软件获得溢价。
        - 没有透明度时，这个溢价也可能是在为一个有 marketplace 和支付摩擦的业务付高价。
        - 披露 take rate、支付 attach，以及完整股权结构瀑布。
    notes: 本表拆开业务质量证据和价格质量证据；一个可投资的买入案例，两边都必须成立。
