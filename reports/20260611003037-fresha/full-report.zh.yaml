      - number: '7.2'
        title: 法律、监管与商业责任风险
        blocks:
          - type: paragraph
            body: >-
              Fresha 的法律边界比一个简单排班 App 宽得多。隐私通知称，除非另有说明，Fresha
              是英国和欧盟用户的数据控制者；它披露画像和个性化营销，列出与合作伙伴及处理方的广泛共享，并承认随着公司增长会把数据转移到英国和 EEA 之外。它还把英国用户指向
              ICO，也就是说，公司自己把数据治理放在一个真实监管语境中，而不是纯内部政策话题。商业条款进一步放大风险面。消费者条款称 Fresha
              充当合作伙伴的商业代理，可代表合作伙伴收款，并允许收取订金、取消费和最高达预约价值 100% 的爽约费。合作伙伴条款又加入月度发票抵扣、订阅费收取、未付款暂停权、合作伙伴承担拒付责任，以及 Fresha
              因欺诈或政策原因向用户退款后的追偿权。这一组合商业上很强，但也提高了账单争议、归因争议或隐私流程缺口转化为商户流失、投诉或监管审查的概率。缓释因素是 Fresha
              已经把这些机制写进法律文件；剩余风险在于，公开材料没有展示足够细的合规控制、争议损失率，或逐司法辖区治理负责人，无法干净承销。
