      - number: '8.2'
        title: 投资逻辑、反向逻辑与估值视角
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接，也有证据支撑。Mordor 预计，到 2031 年，随着沙龙和水疗馆采用统一云软件、嵌入式支付和 AI 驱动个性化，相关市场将以约 10.7% CAGR 增长。Fresha
              已经像这套栈里的规模化控制点之一：市场发现、商户工作流、集成支付，以及新的 AI / 发现推进相互强化。竞争对手页面确认替代集合可信——Mindbody、Vagaro、Booksy、Square 和
              StyleSeat 都是真实选择——但 Fresha 仍把宽广的美业与健康工作流覆盖和异常强的消费者侧活动放在一起。这个组合是独角兽价格表面上并不荒谬的核心原因。


              反向逻辑同样重要。Fresha 过去的差异是清晰的免费软件叙事；保留的 2025–2026 年评论资料包现在指向席位费、20%
              新客佣金、支付费用和隐藏成本投诉。这不能证明经济模型失败，但能证明定价权存在争议。Trustpilot、Software Advice
              和多个定价评论来源都保留了订阅收费挫败、市场归因争议和账单复杂性的证据。同时，公司仍未在抓取资料包中公布已审计收入、利润率或留存数据。这意味着估值必须用混合模型来框定：一部分垂直软件，一部分市场，一部分支付。因此，合适的承销倍数同时受软件上行和商业摩擦下行约束。
