      - number: '1.2'
        title: 创始人、领导层可见度、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              已审阅材料中的创始人可见度集中在 William Zeqiri 和 Nicholas Miller。公司背书融资公告把 Zeqiri 标为创始人兼 CEO，把 Miller 标为联合创始人兼首席产品官；2026
              年 5 月 KKR 公告还披露两名高管：Marcin Dąbrowski 任副首席产品官，Paweł Iwanów
              任首席支付官。这有价值，因为它显示两名创始人之外已有一些运营纵深，尤其在产品和支付上，但距离完整治理图谱仍很远。

              公开治理披露仍薄。已抓取材料没有给出当前董事会名单、董事履历、投票权结构，或清晰的投资人控制图。尽调上，直观解读是：Fresha
              明显具备可信的创始人连续性，也有足够的高管专业分工支撑规模化产品和支付运营；但从公开证据看，决策权仍似乎集中在一个创始人主导的小圈子里。因此，关键人依赖看起来很实质，尤其是公司的产品策略、合作商户经济性和外部叙事都与
              Zeqiri、Miller 紧密绑定。下一阶段尽调应要求提供董事会名单、股权集中度、投资人权利摘要，以及产品、支付和商业领导层的继任纵深。
