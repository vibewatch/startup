      - number: '7.4'
        title: 财务不透明与人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              Fresha 最强的风险缓释因素是：它显然不是尚未规模化的试验。公司背书材料和独立 2026 年报道都指向一轮新的 $80 million KKR 融资、估值超过 $1 billion、已经盈利、约
              130,000 家企业客户、3500 万次月度预约，以及超过 $15 billion 的年度 GMV。这很重要，因为它给管理层带来资本和运营杠杆，而许多更弱的 SMB
              软件同行并不具备。问题是，公开资料包仍让投资者只能从外部倒推业务。Tech Funding News 补充了超过 $140 million 的收入运行率、60% 增长，以及约 500
              名员工和多办公室布局；但这里保留的来源没有提供已审计费率、订阅与支付与市场业务的收入结构、毛利率、合作伙伴流失、客户集中度、现金余额或债务契约细节。这个缺口让执行变成核心判断。跨 120
              个国家扩展支持、合规、定价沟通和合作伙伴运营是可行的，但并不轻松。因此，否决标准应少看绝对增长，多看账单争议、合规例外、商户流失或支持恶化是否快过管理层的吸收能力。
