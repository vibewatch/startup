            body: >-
              Fresha 公开信任姿态中，最强的是合同和隐私文档，而不是独立保证材料。隐私通知清楚描述了部分司法辖区中的控制者身份、同意 / 合同 /
              合法利益等法律依据、支付网关边界、反欺诈用例，以及即便使用加密和安全控制，互联网传输也永远不可能完全安全。合作商户条款把这种姿态延伸到运营控制：消息和营销绑定选择加入同意流程，在定义中点名 GDPR、PECR 和
              TCPA，并在 Fresha 与合作商户之间分配拒付、退款和服务交付责任。更薄的是第三方保证。保留来源集没有出现公开信任中心、正常运行时间 SLA、SOC 2
              报告或类似强独立证明。这不能证明这些控制不存在，但意味着公开可见层更偏法律流程，而非认证。
