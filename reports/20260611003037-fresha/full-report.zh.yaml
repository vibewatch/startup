      - number: '4.4'
        title: 承销缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              Fresha 财务故事中可投资的部分已经足够清楚：真实交易吞吐、清晰变现界面、深嵌合作商户工作流的多产品能力、盈利说法，以及 KKR
              的新机构资本。不清楚的是几乎所有把故事转化为干净承销模型所需的东西。公开证据没有披露各收入流净收入、支付抽成率、毛利率、支持和风险运营成本、客户集中度、CAC、回本、烧钱、现金跑道或当前债务状态。第三方估算的
              $140 million+ 收入运行率和 60%+ 增长有方向性价值，但不是申报级证据，也不应当作经审计财务。

              反向证据重要，因为它直接指向收入质量。多个商户评论来源独立抱怨费用复杂、支持响应和市场归因问题，包括有商户声称，当他们认为客户来自 Google 或转介绍而不是 Fresha 发现时，仍被收取 20%
              新客费用。即便产品获得好评，信息也类似：平台可以有商业效果，但经济性高度取决于它是否真正带来增量需求，以及商户是否接受 Fresha 控制的支付和费用叠加。财务上，Fresha
              看起来是一家有规模、可信且大概率资本效率较高的平台；但缺少经审计收入组合、利润率和流动性数据时，正确承销立场应是看好业务质量，但谨慎看待收入持久性、可预测性和下行保护。
