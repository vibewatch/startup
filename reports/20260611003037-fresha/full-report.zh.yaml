  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群、付费方，以及真正使用 Fresha 的人
        blocks:
          - type: paragraph
            body: >-
              Fresha 不是单一买方 SaaS，而是一个双边运营和发现平台。一边是消费者，他们用网站和 App 发现美发沙龙、理发店、水疗馆、医美水疗、健康场馆和个人专业人士，然后预订，很多时候也通过 Fresha
              付款。另一边是合作商家，他们用软件管理日历、支付、库存、营销和团队流程；个人专业人士和前台员工则是日常产品用户。法律架构很关键，因为它说明谁在付费：合作伙伴条款把服务费、订阅费、开票和拒付风险放在企业账户上，而不是消费者身上。公开公司材料和媒体材料也显示，供给侧不只是小沙龙。Fresha
              明确面向独立专业人士、店主自营场馆，并且越来越多地面向多门店运营者。这个组合有吸引力：Fresha 可以先靠免费或低摩擦运营工具切入，账户复杂度上升后，再用发现、支付和留存工具扩张。
