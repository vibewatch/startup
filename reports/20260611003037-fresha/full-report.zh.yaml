  - id: TV004
    title: 可比估值表
    enumeration: true
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Fresha 2026 KKR 轮
        - 当前公司特定价格参考
        - $80M primary 融资轮对应 >$1B 估值；如果第三方 $140M+ 收入 run-rate 方向正确，隐含倍数为 >7x 收入。
        - 这是目前可获得的最佳公司实时私有估值标记。
        - 收入锚点来自第三方，保留来源包中没有 Fresha 审计确认。
      - - Fresha 2021 Series C / 后续扩展轮
        - 历史融资标记
        - 官方 2021 Series C 为 $100M，累计融资 $132M；InforCapital 还引用 2021 年后续扩展轮，估值 $640M。
        - 说明 Fresha 在 2026 年升至独角兽前已经大幅重估。
        - 历史标记来自不同变现阶段，且部分来自第三方数据库。
      - - Booksy
        - 美业 marketplace 运营基准
        - 官方为 $29.99/month + 每名额外用户 $20；保留来源包中未披露估值。
        - 最接近的直接美业软件 marketplace 套餐参考。
        - 可用于定价语境，不适合作为直接估值倍数。
      - - Square Appointments
        - 更宽泛的商业栈基准
        - 年处理量超过 $250K 才进入定制定价路径；Appointments 未披露独立估值。
        - 展示商户可选择的 Fresha 之外生态替代方案。
        - 不是纯美业 marketplace，也不是披露自身倍数的独立可比公司。
      - - StyleSeat
        - 个人专业人士增长基准
        - 固定 $35/month，并声称无隐藏费用；保留来源包中没有公开估值。
        - 可参考其更干净定价和 AI 驱动的个人专业人士定位。
        - 产品范围和客户基础都比 Fresha 更窄。
      - - Mindbody / Vagaro
        - 规模化运营基准
        - Mindbody 称有 3M 活跃用户、40K+ 商户和 600M 年预约；Vagaro 称 2025 年有 300K 专业人士和 162M 预约，但本来源包没有两者当前公开估值。
        - 可作为规模和品类定位的运营语境参考。
        - 保留来源包缺少两家公司实时估值标记或倍数。
    enumerationScope:
