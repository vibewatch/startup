            body: >-
              支付在 Fresha 内部不是附件，而是运营核心的一部分。服务条款和合作商户条款显示，Fresha
              主动参与合作商户款项的收取、处理、退款和结算；合作商户工作流还包括绑卡、订金、取消、爽约、终端和打款处理。隐私通知又加一层：它点名 Adyen 和 Checkout
              是网关服务商，并说明银行卡详情直接流向这些处理商，Fresha 只保留有限卡片元数据。不过，部署便利伴随依赖。独立评论来源反复把这种取舍描述为：用零或低固定软件成本，换取市场佣金、处理费和对 Fresha
              Payments 的依赖。评论投诉提到打款时点混乱、费用争议、预约页面控制有限和支持摩擦，这意味着产品在运营上高度集成，但并不中立：客户买入的是紧耦合工作流，而不是自己拼装排期和支付栈。
