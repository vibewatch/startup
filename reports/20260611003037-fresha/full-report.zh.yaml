  - id: FI003
    title: 财务估计区间
    type: range
    layout: wide
    summary: 公开资料包保留了价格带和交易量代理指标，但任何收入估计仍取决于对支付渗透率和总留存到净留存的假设。
    approximationNotes: >-
      订阅和费率行复现的是第三方报道区间，不是经审计的 Fresha 费率表。「$15B GMV 上的示意性总费用池」一行，把官方 $15 billion 年 GMV 乘以报道支付费率，用来展示若所有 GMV
      都按这些费率商业化时的总费用表面积；这很可能高估 Fresha 净收入，因为并非所有 GMV 都一定通过 Fresha 走银行卡处理，部分经济性也会与处理商分成。
