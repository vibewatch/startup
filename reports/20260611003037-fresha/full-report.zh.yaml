      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              Fresha 披露了交易规模和一些留存话术，但没有披露承销最需要的单位经济。2026 年官方来源确认，每月预约超过 35 million 次、年 GMV 超过 $15
              billion、之后一份产品稿中的月度预约价值超过 $1.4 billion，以及月 app 下载超过 1 million。这些事实在财务上重要，因为它们证明平台在有意义的吞吐规模上运行。PRNewswire
              消费者增长稿还把留存和复购描述为核心经济杠杆，引用改善留存带来最高 40% 收入提升，以及第三次预约后忠诚客户回访率超过 83%。即便如此，Fresha 仍未公布 CAC、市场转化、支付
              attach、毛利率、退款 / 拒付负担或收入确认政策。

              成本端只能间接看见。合作商户条款显示，Fresha 负责月度开票、处理在线流程中的收款，并把拒付责任推回给商户；法律条款允许订金、爽约费和取消费最高达到预约价值的
              100%。这意味着支付运营、争议管理、支持和营运资本管道都有实质工作量。评论证据又增加一层信号：商户持续描述，相比固定 SaaS 订阅，Fresha
              的定价结构更难预算，因为订阅、刷卡费、市场佣金、短信或支持附加项以及支付锁定会叠在一起。相对同行，该模型看起来能在强交易量上实现有吸引力的变现，但缺失变量仍是支付渗透率、平均服务价值、首次到复购转化、单店支持成本，以及
              2025 年定价切换后的合作商户流失。
