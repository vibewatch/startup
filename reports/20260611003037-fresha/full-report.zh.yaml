        title: 扩张、集中度与支持风险
        blocks:
          - type: paragraph
            body: >-
              最好的公开扩张逻辑是运营整合。Fresha 越来越把自己卖成一个单一系统，把发现、预订、支付、作品集、忠诚度和多门店控制放在一起；账户一旦标准化到这套栈上，钱包份额就能加深。这也解释了为什么企业和多站点运营者在
              2026 年信息中如此突出。但公开证据也显示了当前承销的边界。Fresha 不披露头部客户集中度、按地域划分的客户数集中度、企业 ACV、续约率，或少数大账户贡献的 GMV
              份额。因此，集中度风险无法仅靠公开材料量化。支持风险也真实存在：Trustpilot
              显示近期聊天响应可能在改善，但评论平台仍保留大量关于费用争议、升级路径薄弱、服务渠道有限的重复投诉。竞争平台也在用不同经济模型或控制模式服务同样的美业、健康和多门店客群；任何持续的信任问题，都可能转化为比公司营销叙事所暗示更慢的扩张或更高的流失。
