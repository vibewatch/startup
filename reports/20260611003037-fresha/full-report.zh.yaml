  - id: TP001
    title: 竞品画像表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the supportable core set for this run: Fresha, Mindbody, Vagaro, Booksy, Square Appointments, StyleSeat,
        and the manual/status-quo path. Adjacent entrants such as Boulevard or Zenoti appear in one fetched commentary
        source but are not profiled because the evidence pack is too thin for the same standard of analysis.
    columns:
      - 竞品
      - 品类
      - 规模 / 证明点
      - 目标客户
      - 产品范围
      - 定价 / 货币化
      - 战略方向
      - 相对 Fresha 的关键优势
      - 关键限制
    rows:
      - - Fresha（标的）
        - 集成式垂直 OS + 市场平台
        - 130K+ 至 140K+ 商户；35M+ 月预约；$15B+ GMV
        - 美容、健康护理、自我护理 SMB 到多门店经营者
        - 市场平台、预约、支付、营销、POS、库存
        - 混合模式：订阅 + 市场平台费用 + 支付费用；抓取到的官方快照里，当前精确公开标价部分不透明
        - 重投 AI 和个性化发现，同时全球扩张
        - 消费者发现、商户工作流和支付打包在一起，是最能被证据支撑的组合
        - 定价迁移和费用摩擦带来比价风险
      - - Mindbody
        - 老牌健身 / 健康护理平台
        - 3M+ 活跃用户；40K+ 商户；600M+ 年课程和预约
        - 健身、健康护理、美容、多门店经营者
        - 市场平台、支付、营销、品牌 App / Web、面向商户的 ClassPass、集成
        - 订阅主导；抓取到的官方页面未显示当前精确价格
        - 在健康护理经营者中扩展创收工具和 AI
        - 健身 / 健康护理垂类更强，多门店控制更成熟
        - 不够美容原生，对小型美容经营者可能偏重
      - - Vagaro
        - 运营姿态更宽的直接同业
        - 300K 专业人士；2025 年预约 162M+；经营 17 年
        - 美容、健康护理、健身；从独立服务者到企业
        - 预约、日历、表单、报表、支付、资金产品、品牌 App、API
        - 订阅主导；低置信度对比来源显示起价约 $30/月
        - 用更强支持面覆盖从单人创业者到企业的所有客户
        - 品类范围宽，支持 / API / 信任姿态可见
        - 消费者发现由市场平台主导，不如 Fresha 叙事核心
      - - Booksy
        - 直接美容市场平台同业
        - 330K+ 美容和健康护理专业人士；44M+ 客户
        - 理发师、造型师、沙龙业主、美容和健康护理专业人士
        - 市场平台、排班、支付、营销、爽约保护
        - 官方标价 $29.99/月 + 每名额外用户 $20
        - 所有功能保留在每个套餐里，同时扩大市场平台使用
        - 最接近的同类美容市场平台竞品，公开标价更清晰
        - 在广义健康护理或多门店深度上，证据少于 Fresha
      - - Square Appointments
        - 相邻商业平台替代品
        - 美容只是其支持的众多垂类之一；年处理额超过 $250K 后开放定制定价路径
        - 希望把预约纳入更宽商业栈的 SMB
        - 预约、POS、支付、营销、忠诚度、薪资、银行、API、App 市场
        - Free / Plus / Pro 阶梯，较大处理商走定制定价
        - 靠完整商业生态宽度赢下商户
        - POS、薪资、银行和开发者生态比 Fresha 更宽
        - 发现市场平台并非美容原生，品类焦点被稀释
      - - StyleSeat
        - 单人专业人士市场平台和增长替代品
        - 250M+ 预约；带来新收入 $500M+；年网站访问 74M；2M+ 客户在搜索
        - 独立美容专业人士和小型美容商户
        - 市场平台、排班、支付、AI 营销、智能定价、忠诚度
        - 固定订阅 $35/月
        - 更强推动面向单人专业人士的 AI 营销和新客增长
        - 单人专业人士增长工具更强，定价叙事更扁平
        - 后台和多门店深度窄于 Fresha
      - - 手工 / 现状工具
        - 替代品 / 既有工作流
        - 无处不在，但公开数据未量化
        - 早期沙龙、自由职业者、现金占比较高的经营者
        - 电话、电子邮件、社交私信、基础日历、独立支付
        - 表面现金成本低，人工成本高
        - 只要经营者规模小或抵触平台费用，就会继续存在
        - 避开软件订阅和市场平台抽佣
        - 自动化、报表、发现和集成支付较弱
    notes: >-
      竞品画像有意控制在可支撑的证据包内。Mindbody 和 Vagaro 是老牌玩家，健康护理或运营宽度更强；Booksy 是最近的直接美容市场平台同业；Square 是相邻商业栈；StyleSeat
      是偏营销的单人专业人士替代品。
