      - number: '2.2'
        title: 规模测算视角、约束后 TAM 与标题区间为何分歧
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据支持这是一个真实的软件品类，但没有一个权威的标题 TAM。Mordor Intelligence 发布的口径最窄，也最适合 Fresha 核心品类决策：spa 与 salon 软件 2026 年为
              $1.12 billion，到 2031 年升至 $1.86 billion。Strategic Market Research 发布的口径宽得多：2024 年为 $3.5 billion，到 2030 年增至
              $7.25 billion。ResearchAndMarkets 解释了这些数字为何分歧：其品类范围覆盖排期、POS、员工管理、CRM、库存、定价模型、部署、应用和国家级 TAM
              模块。换句话说，公开来源测量的是重叠但并不相同的市场。


              更好的尽调姿态是保留多个视角，而不是挑最大数字。与 Fresha 运营滩头最贴合、也最保守的软件切口，是预约与 CRM 部分；Mordor 称其在 2025 年占品类支出的 36.46%，套用到 2026
              年窄口径市场，意味着眼前工作流切口约为 $0.41 billion。第二个约束视角把 Mordor 的 39.22% 北美占比套用到同一个 2026 年市场，意味着该区域窄品类支出约 $0.44
              billion，而多数基准证据仍锚定北美。这些不是正式 SAM 或 SOM 结果，但比把 Fresha 机会等同于全部美容服务支出或全部中小商户支付量更可辩护。
