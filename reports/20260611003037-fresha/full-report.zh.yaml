      - number: '3.3'
        title: 能力、定价、GTM 与信任对比
        blocks:
          - type: paragraph
            body: >-
              这份材料包里的能力对比，重点不是谁有基础预约或支付，而是哪一组 bundle 是各平台的主打。Fresha 的差异化 bundle 是市场发现加预约、支付、营销和美容 / 康养宽度。Mindbody
              增加了更强的健身和康养可信度、更企业化的控制，以及大型 app 驱动获客渠道。Vagaro 横跨美容、康养和健身，加上可见支持与 API
              界面，使其成为可信的全能型运营商，尤其适合重视服务宽度和支持姿态的商户。Booksy 的吸引力在简单：每个套餐都有全部功能、美容原生获客、支付、营销和防爽约保护。Square
              的能力优势来自周边生态，而不是美容专用市场。StyleSeat 的优势是 AI 驱动营销、智能定价和个人专业人士需求生成。


              定价和信任让对比具备战略重要性。2025-2026 年转型证据出现后，Fresha 过去的“免费”叙事更难辩护：评论和条款来源指向按可预约员工收订阅费，同时叠加市场和支付费用。Booksy
              官方定价相对清晰。StyleSeat 每月 $35 的固定价也容易理解。Square 的阶梯可见，但已抓取快照没有完整渲染数字标价；Mindbody 和 Vagaro
              在这份材料包中的定价过度依赖比较网站，难以有信心承销精确数字。信任信号也混合：Fresha 整体评分仍强，但围绕 20% 费用归因、支持响应和定价变化的反向证据，给竞争对手在销售流程中留下了真实对比点。
