chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fresha 将自己定位为面向美容、康养和自我护理商户的 AI 驱动预约市场与商户管理平台，而不只是日历排期的单点工具。最强的法律足迹证据来自 Fresha 的条款和隐私材料：运营主体为 Fresha.com
              SV Limited，在英格兰注册，注册地址为伦敦 71-75 Shelton Street, WC2H 9JQ。最强的公司历史证据则在 2021 年与 2026 年公司背书材料中相互对齐：Fresha 由
              William Zeqiri 和 Nicholas Miller 于 2015 年创立，最初以 Shedul 之名上线；2020
              年公司从排期软件扩展到支付、市场发现，以及面向沙龙、水疗、理发店、诊所和健身工作室的更宽操作系统功能后，改名为 Fresha。

              已审阅材料支持一个双边模型。消费者端，Fresha 提供发现、预约和支付；商户端，Fresha 提供预约、客户记录、营销、库存、员工管理和集成支付。这一商业设计很关键，因为 Fresha
              反复把自己描述成软件、市场和金融服务的组合，而不是只卖传统 SaaS 席位许可。官方和第三方来源一致认为，历史变现主要靠支付处理和预约相关费用；近年又叠加了订阅元素和 AI
              驱动的增购功能。这个模型解释了商户快速采用，也让 Fresha 明显依赖其自控的支付和获客轨道。
