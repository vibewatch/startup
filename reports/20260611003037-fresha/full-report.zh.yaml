        - 隐性杠杆可能改变下行风险，并解释 $285M 与 $295M 之间的差距
        - 提供债务余额、贷款方、到期日、契约包和当前未偿金额
      - - 资金用途
        - 2026 年融资用于全球扩张和 AI；2021 年融资用于产品、市场和 M&A
        - 高层级披露
        - 资本强度取决于支出是否具备增长效率，还是补贴很重
        - 提供按产品、GTM、地区和支付基础设施拆分的 24 个月预算
      - - 下一轮融资触发条件
        - 未披露
        - 未公开
        - 需要据此评估稀释风险，以及当前估值是否依赖继续获得私募融资
        - 提供增长放缓、支持成本上升或支付利润率受压时的下行情景计划
  - id: TI005
    title: 公开财务缺口表
    notes: 这些缺失的私有指标，阻碍了达到承销级别的尽调。每个缺口都对应明确请求，而不是泛泛地说“需要更多数据”。
    columns:
