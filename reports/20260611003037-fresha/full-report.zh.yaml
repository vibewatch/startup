  - id: TR005
    title: 缓释措施与终止标准表
    notes: 终止标准写成可观察事件，投资人在完整审计指标出来前也能持续跟踪。
    columns:
      - 风险
      - 监控项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 监管失误
        - 投诉、监管接触，或被迫调整政策
        - 披露任何 ICO 或同等调查、重大整改计划，或跨境传输链条失灵
        - 暂停信心判断，先升级完整隐私尽调，再承销扩张。
      - - 拒付 / 账单责任反噬
        - 商户争议和催收摩擦
        - 有证据显示，拒付损失、退款追回或费用争议增长快过预约或 GMV 增长
        - 将支付收入质量视为受损，并下调利润率假设。
      - - 定价反弹与流失
        - 合作伙伴取消、降级行为和投诉密度
        - 套餐或费用变化后，流失持续跳升或投诉量维持高位
        - 假设 NRR 更弱，并降低支付溢价倍数的意愿。
      - - 竞争切换
        - SMB 客群中的迁移优惠和竞品赢单案例
        - 关键 cohort 中商户明显转向 Square、Booksy、Mindbody、Vagaro 或 StyleSeat
        - 在留存数据证明相反之前，把护城河从工作流锁定重估为商品化同质。
      - - 支持 / 认证可靠性
        - 工单积压，以及登录或重复账户事故
        - OAuth、账户访问或发票访问反复失败，打断预约或结算工作流
        - 推进前要求提供运营 KPI 包。
      - - 财务不透明
        - 管理层是否愿意提供审计后的经济性
        - 尽调期间未清晰披露 take rate、利润率、流失和现金
        - 转向继续研究或价格纪律立场，不要只凭表面规模承销上行。
    claimRefs:
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
      - CR046
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 公开证据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 已有规模且盈利，刚拿到 KKR 的 $80M 轮，但公开证据对估值的支撑不完整。
        - 继续积极尽调，但不能只凭公开证据在当前价格领投或追价。
      - - 信心
        - 中
        - 核心规模和融资事实支撑较强；收入质量和股权结构细节不足。
        - 在拿到私有资料室前，把它当筛选视角。
      - - 风险评级
        - 高
        - 定价反弹、竞争和透明度都可能快速改写公允价值。
        - 推进前要求下行保护和明确终止触发器。
      - - 估值立场
        - 偏贵
        - 当前 >$1B 标记看起来已经打满，除非第三方 $140M+ 收入 run-rate 和盈利说法能经受尽调验证。
        - 只在价格更好或审计证据更强时考虑进入。
      - - 3-5 年总回报框架
        - 基准到牛市为 ~0.8x-1.8x
        - 基准情形上行有限；牛市情形需要强执行和可持续变现。
        - 这是先监控的机会，不是今天的高信心买入。
      - - 什么会改变判断
        - 审计证据或重新定价
        - 收入结构、留存、利润率、take rate、债务和优先权条款都可能推动建议变化。
        - 只有私有尽调明显好于公开记录，才上调判断。
    notes: 仅基于公开证据给出建议；总回报框架不包含未来稀释，也不包含任何未披露优先权堆栈的影响。
