      - number: '3.4'
        title: 切换成本、多归属与替代品
        blocks:
          - type: paragraph
            body: >-
              Fresha
              受益于真实切换成本，但这些成本是运营性的，不是绝对性的。沙龙一旦把日历、客户历史、订金或防爽约规则、嵌入式支付、库存和营销放进一个系统，迁移就会打断运营，即便软件在技术上并非无法离开。这个点重要，因为
              Fresha 最好的护城河不是单一功能，而是发现、交易数据和工作流数据的耦合。与此同时，已抓取的竞争对手页面显示，切换足够常见，已经成为营销话术：Mindbody 宣传迁移帮助和设置支持，Square
              提供批量导入和付费迁移服务，Vagaro 明确称切换简单。所以实际承销观点是，Fresha 有留存摩擦，但不是打不破的锁定。


              多归属风险在独立和个人细分中最高。发现可以来自 Google、网站、社交链接、市场列表或口碑，这意味着专业人士即便底层使用一个主操作系统，也能保留获客选择权。因此，手工 /
              现状工具和模块化栈仍然重要。小经营者可以继续混用电话、消息、日历工具和独立支付，时间比垂直软件供应商希望的更久。大型经营者如果更在意
              API、薪资或多门店控制，而不是美容专用市场，也可以理性选择更宽的商业栈或自定义拼装。因此，Fresha 在同时赢得需求渠道和运营工作流时最受保护。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP031
              - CP036
      - number: '3.5'
        title: 护城河持久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Fresha 的护城河看起来扎实，但并非不可攻破。正面逻辑很直接：市场和预约规模很大，美容与康养垂直覆盖广，支付集成，2026 年 AI / 发现路线图试图同时加深消费者参与和商户变现。未来 12-24
              个月，这组组合应强于手工工具和更薄的排期工具。反向逻辑同样清楚：买方需要市场主导获客加商户工作流一体化时，护城河最稳；竞争对手拥有更尖锐细分时，护城河就没那么稳。Mindbody
              在健身和康养占比较高的账户中更难被替换，Vagaro 运营与支持姿态更宽，Booksy 是最接近的美容专用直接同行，Square 可以靠生态宽度赢，StyleSeat 可以凭 AI
              营销和更平的定价赢下个人专业人士。


              针对 Fresha 的主要反向证据不是需求崩塌，而是变现与信任摩擦。评论来源保留了围绕 20%
              新客费用、市场归因争议、支持缺口和定价变化后不适的反复投诉。这些问题有竞争意义，因为即便商户不会马上流失，也会降低他们比较替代方案的门槛。正确的尽调结论是：Fresha
              的护城河真实但有条件——对现状工具持久，对通用排期工具持久，对许多美容同行也有防御力；但当竞争对手带来更强生态、更强垂直细分或更清晰定价故事时，边际上会变脆弱。
