        - id: opacity
          label: 披露缺口
          detail: 保留资料包中没有经审计的公开收入、利润率、take rate、债务期限表或优先权结构。
        - id: decision
          label: 建议：跟踪
          detail: 保持接触，但升级前需要更好价格或更强尽调证据。
      edges:
        - from: scale
          to: capital
          label: 支撑
        - from: capital
          to: market
          label: 符合增长叙事
        - from: market
          to: friction
          label: 但没有消除
        - from: friction
          to: opacity
          label: 被进一步放大
        - from: opacity
          to: decision
          label: 推动谨慎
    approximationNotes: 该图压缩了 IC 逻辑链，而不是呈现确定性财务模型。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV010
      - CV021
      - CV024
      - CV047
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 基于不同收入和倍数组合的示意估值结果，只使用公开来源锚点和明确假设。
    data:
      items:
        - label: $120M 收入 @ 4x
          value: 480
          detail: 如果定价反弹或竞争压力同时压缩收入和倍数，这是下行情形。
        - label: $140M 收入 @ 6x
          value: 840
          detail: 使用第三方收入锚点后，可支撑基础区间的低端。
        - label: $150M 收入 @ 7x
          value: 1050
          detail: 如果收入估计正确，大致对应当前参考清算水平。
        - label: $180M 收入 @ 7x
          value: 1260
          detail: 如果变现被证明持久，这是早期牛市情形。
        - label: $220M 收入 @ 8x
          value: 1760
          detail: 高端牛市情形，需要强执行和更好披露。
    approximationNotes: 条形图是分析师生成的百万美元口径输出，不是已观察到的交易价格。
    claimRefs:
      - CV016
      - CV040
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 熊市、基础、牛市和当前参考情形下的低 / 基础 / 高估值结果。
    data:
      items:
        - label: 熊市情形价值
          low: 400
          mid: 500
          high: 600
          unit: USD millions
          displayValue: $0.4B-$0.6B
          detail: 假设留存更弱、take-rate 持久性更低，收入倍数为 3.5x-4.5x。
        - label: 基础情形价值
          low: 840
          mid: 980
          high: 1120
          unit: USD millions
          displayValue: $0.84B-$1.12B
          detail: 假设收入约 $140M-$160M，且混合模型倍数可支撑 6x-7x。
        - label: 牛市情形价值
          low: 1260
          mid: 1500
          high: 1760
          unit: USD millions
          displayValue: $1.26B-$1.76B
          detail: 假设变现持久、留存强，且倍数可支撑 7x-8x。
        - label: 当前参考
          low: 1000
          mid: 1050
          high: 1100
          unit: USD millions
          displayValue: '>$1.0B'
          detail: 代表当前公开独角兽标记，而非精确点估计。
    approximationNotes: 区间只是基于公开记录的估值估计；稀释、债务、准备金和清算优先权都可能实质改变已实现股权结果。
    claimRefs:
      - CV001
      - CV016
      - CV040
      - CV044
      - CV045
      - CV046
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格记分卡，汇总市场、验证、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场
          value: 7/10
          detail: 品类增长真实存在，但经营者层面的增长并不均衡。
        - label: 验证
          value: 8/10
          detail: 规模、盈利声明、GMV 和新资本都是强信号。
        - label: 护城河
          value: 7/10
          detail: 市场平台 + 工作流 + 支付具备差异化，但并非牢不可破。
        - label: 经济性
          value: 5/10
          detail: 可能有吸引力，但公开 take rate 和利润率披露很薄。
        - label: 风险
          value: High
          detail: 定价反弹、竞争和透明度都是实质风险。
        - label: 估值
          value: 5/10
          detail: 相对公开证据包，当前独角兽标记看起来偏满。
        - label: 证据质量
          value: Medium
          detail: 足够支持跟踪判断，不足以支持有信心买入。
    approximationNotes: 分数是委员会基于支撑性主张集做出的速记，不是机器生成指标。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV016
      - CV021
      - CV024
      - CV047
      - CV050
