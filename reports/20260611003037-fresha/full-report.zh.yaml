              2026 年证据集中，最有辨识度的产品动作是 Fresha 从交易型预约转向发现驱动的展示销售。Business Wire 和 PRNewswire
              都描述了一个越来越依赖高级搜索、视觉作品集、可信评论、一键复约和更丰富专业身份层的市场。Service Portfolios 让商户把图片直接附到服务上，并把用户从灵感引导到立即预约流程；Professional
              Profiles 则为单个员工加入语言、评分、评论、社交链接和图片。运营模型因此很清楚：Fresha 试图同时掌握需求捕捉和操作软件，而不只是排期数据库。分发也不止第一方
              app，因为合作商户条款和评论来源显示，预约按钮、社交界面、Google 关联入口、合作商户网站和其他推广渠道，都会把用户推回 Fresha 控制的预约和支付工作流。公开证据对深度开放 API
