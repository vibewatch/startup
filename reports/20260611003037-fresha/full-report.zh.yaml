  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计收入桥
        - 2025 年和 LTM 2026 按订阅、支付、marketplace 及其他服务拆分的收入。
        - 没有这项，当前估值标记无法与可持续净收入挂钩。
        - 要求 CFO 资料室和审计师背书的桥接表。
      - - 净支付经济性
        - 处理量、支付 attach、gross-to-net take rate、退款、拒付和准备金义务。
        - 这些决定 Fresha 应按软件型还是支付型估值处理。
        - 要求支付 KPI 材料包，以及处理方和司库摘要。
      - - 定价切换留存
        - 2025 年转向付费层级前后的商户留存、流失原因和 GPV 留存。
        - 这是检验变现到底改善还是伤害业务根基的核心测试。
        - 要求财务和客户成功提供 cohort 分析。
      - - 债务与股权结构
        - 当前债务余额、到期日、契约、优先权堆栈、参与权和 pro-rata 条款。
        - 只靠公开证据无法建模下行保护。
        - 要求法律摘要、股权结构表和融资文件。
      - - 单位经济性
        - 按收入流拆分的毛利率、支持成本、CAC、回本期，以及 marketplace 归因 override/退款。
        - 这些指标决定公司应拿溢价倍数，还是只能拿混合商业折价。
        - 要求董事会 KPI 包和 cohort 模型。
      - - 退出准备度
        - 任何投行准备、战略方入站，或董事会批准的融资 / 退出工作流。
        - 新资金和盈利有帮助，但没有公开证据证明公司已经具备近期公开市场准备度。
        - 要求 CEO/CFO 会议和流程图。
    notes: 前四行是以高于当前独角兽参考价承销新进入的硬性阻断项。
