  - id: TP004
    title: 护城河耐久度 / 竞争风险台账
    columns:
      - 护城河或风险维度
      - 当前评估
      - 主要威胁
      - 严重性
      - 重要性
      - 缓释措施 / 尽调要求
    rows:
      - - 市场发现 + 工作流捆绑
        - 强
        - Booksy、Mindbody 和 StyleSeat 分别进攻同一漏斗的不同环节
        - 中等
        - Fresha 同时掌握需求和工作流时能赢；竞争对手在任一侧做得更好时，Fresha 杠杆会变弱
        - 要求披露预约渠道组合、按获客来源拆分的复购率，以及只用 Fresha 发现入口的商户占比
      - - 支付和结算控制
        - 强但双刃
        - 商户抵触支付锁定；Square 生态可替代
        - 中等
        - 既是留存杠杆，也是合作伙伴摩擦来源
        - 要求披露支付挂载率、拒付负担和商户退出行为
      - - 美业与健康业态广度
        - 强
        - Mindbody 和 Vagaro 在健身 / 健康细分里有优势；Square 在美业之外覆盖更广
        - 中等
        - 广度帮助 Fresha 覆盖沙龙、Spa、理发、美容医美，以及部分健身工作流
        - 按垂直行业映射收入组合，并按美业与健康队列拆分流失
      - - AI 主导的发现路线图
        - 有潜力但仍早期
        - StyleSeat AI 营销和竞争对手跟进
        - 中等
        - AI 可以加深变现，但早期 AI 主张很快会商品化
        - 跟踪 Service Portfolios / Professional Profiles 的采用率及由此带来的预约提升
      - - 定价叙事
        - 弱于从前
        - 2025-2026 年定价转型后买方反弹
        - 重大
        - 定价故事不够干净，会让竞争对比更容易
        - 要求披露按地区划分的当前套餐表，以及按商户队列拆分的实际抽成率
      - - 信任和支持口碑
        - 喜忧参半
        - 评价网站上围绕归因和响应速度的投诉
        - 中等
        - 即使产品强，如果商户担心账单争议或求助慢，也会丢单
        - 审查支持 SLA、首次响应时间、退款政策和投诉解决率
      - - Square 生态邻近
        - 重大外部威胁
        - 商户向单一商业技术栈标准化
        - 中等
        - Square 即使没有美业原生发现入口，也能靠生态广度赢单
        - 量化已使用 Square 硬件或银行产品的商户重叠度
      - - 手工工具 / 多平台并用
        - 持续存在的低端替代
        - 单人专业人士留在低成本手工工作流，或同时使用多个渠道
        - 中等
        - 这限制了变现上限，也让切换壁垒无法变成绝对壁垒
        - 衡量线索来源组合、平台外预约率和双平台使用频率
    notes: 严重性反映竞争意义，而不是生死级业务风险。本证据包里最大的近期风险不是市场份额突然崩塌，而是缓慢侵蚀：定价摩擦、支持顾虑或细分专家型替代品会削弱 Fresha 的相对卖点。
