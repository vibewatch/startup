  - id: TV003
    title: 牛 / 基准 / 熊情形表
    columns:
      - 情形
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛
        - 收入达到约 $180M-$220M，定价切换站稳，支付和 marketplace attach 加深，AI 驱动的发现提升转化。
        - 按 ~7x-8x 收入估算价值 $1.3B-$1.8B；3-5 年相对当前 >$1B 参考值，总回报约 1.3x-1.8x。
        - 竞争、变现反弹和披露有限仍然重要。
        - 有可能，但需要尽调确认第三方收入锚点偏保守。
      - - 基准
        - 收入落在约 $140M-$160M，盈利守住，但增长正常化，市场按软件 - 支付混合资产给 Fresha 定价。
        - 按 ~6x-7x 收入估算 $0.8B-$1.1B；稀释前大致持平到小幅上行。
        - 如果留存或支付经济性低于预期，容错空间很小。
        - 当前公开证据下最能支撑的情形。
      - - 熊
        - 流失、定价阻力或 take-rate 兑现偏低之后，收入落在约 $110M-$130M；信任变弱，倍数压缩。
        - 按 ~3.5x-4.5x 收入估算 $0.4B-$0.6B；相对当前参考值约 0.4x-0.6x。
        - down round 风险、债务或优先权包袱，以及竞争性重新定价。
        - 如果公开不透明掩盖了更弱基本面，下行尾部风险很大。
    notes: 所有情形价值都是基于保留来源包的分析估算；本轮中 Fresha 未公开披露经审计的当前收入。
