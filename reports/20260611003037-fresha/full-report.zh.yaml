  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Fresha 的财务模型最好理解为市场、支付和垂直软件的混合体，而不是经典按席位收费的
              SaaS。最强一手证据来自法律和公司背书材料。合作商户条款称，拥有一个或多个可预约人员的商户必须支付订阅费；同一组条款和消费者服务条款也明确，Fresha 作为在线预约的商业代理，代表合作商户收款。2021 年
              6 月 General Atlantic 公告展示了模型的早期版本：核心软件免订阅、Fresha Plus 高级功能，以及通过刷卡处理和在线预约使用费变现。2026
              年独立报道和评论页面显示，这一模型已经演进为付费套餐结构，并叠加交易和市场费用，而不是替代它们。

              当前精确定价卡在保留材料包中仍只部分公开。本次抓取的官方定价和支付页面没有保留可用的文本费率表，所以精确当前费率主要来自独立评论，而非 Fresha 直接披露。这些评论大体同意商业形态：每名可预约团队成员约
              $14.95、个人约 $19.95 的订阅费，首次通过市场来的客户收 20% 费用，刷卡处理费按渠道和地区变化。这意味着商业机制可读，但实际抽成率、混合
              ARPU，以及软件、支付、市场和金融服务之间的真实收入组合，公开资料仍无法承销。
