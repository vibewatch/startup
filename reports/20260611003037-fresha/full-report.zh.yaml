        title: 运营、客户、合作伙伴与竞争风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Fresha 的公开证据是好坏参半，而非灾难性。评论汇总仍然强，但反向信号恰好集中在 SMB 软件加支付平台最关键的地方：支持响应、登录可靠性、账单清晰度和新客费用归因。Trustpilot
              既有很强的支持表扬，也有关于 OAuth 失效、取消后发票访问薄弱、对新订阅计费不满的投诉。Capterra 和 SchedulingKit 呈现类似模式：爽约卡扣款失败、支持缺口、绑定 Fresha
              支付造成的供应商锁定，以及围绕 20% 新客收费的反复挫败。这些问题重要，因为 Fresha 服务的市场仍由小型和个人运营者主导支出，而 Zenoti
              的基准数据显示，不同业务类型增长并不均衡。商户因此更敏感于费用叠加；如果竞争对手给出更清楚的经济账，也更容易被挖走。在竞争端，替代集合是真实存在的。Square、Mindbody、Booksy、Vagaro 和
              StyleSeat 都销售集成支付、发现、增长工具，有些还提供迁移或切换帮助。Fresha
              仍有产品宽度和市场规模，但证据显示，它的护城河是便利性和已安装工作流，不是不可攻破的技术垄断。如果定价混乱和服务摩擦持续，竞争对手有可信切入口。
