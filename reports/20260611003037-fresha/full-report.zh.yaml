      - number: '2.4'
        title: 增长驱动、采用约束与保留缺口
        blocks:
          - type: paragraph
            body: >-
              支撑最好的增长驱动包括云迁移、移动预约需求、会员带动留存策略、AI 驱动个性化，以及商户对发现加支付一体栈的需求。Mordor 的模块和部署拆分、Zenoti 的 2025
              年基准、竞争对手营销页面，都指向同一方向：把预约、CRM、支付、营销和报表压缩进一个工作流的软件，可以提升利用率和收入，也让消费者获客不那么依赖商户自己做需求生成。这解释了为什么发现市场和嵌入式金融工具不断出现在该品类中。


              主要约束不是需求稀缺，而是实施经济性和范围适配。Mordor 标出切换成本、隐私与合规复杂度，以及横向 POS 或预约竞争。反向定价指南又增加第二组约束：交易费、新客佣金、处理器锁定和支持限制，可能让早期沙龙采用
              Fresha 很理性，却在增量需求较弱时对高交易量商户缺乏吸引力。增长最快的医美水疗切口带来第三个约束，因为医美专用供应商在营销上更清楚强调临床文档和受监管工作流深度，而 Fresha
              当前公开材料没有同等强调。因此，保留的尽调缺口很重要：公开来源仍未拆出 Fresha 的收入组合、区域组合、不同预约来源的抽成率，或不同获客渠道的留存，所以还不能把 TAM 有信心地转译为收入质量。
