  - id: TI001
    title: 收入流表
    notes: 本表将直接披露的变现机制和推断机制分开。精确实际抽成率和收入流组合未公开；凡定价来自评价页面而非官方费用卡，均已明确标注。
    columns:
      - 收入流
      - 机制
      - 单位 / 触发点
      - 当前公开状态
      - 收入质量判断
      - 尽调要求
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI022
      - CI033
    rows:
      - - 订阅服务
        - 向拥有可预约员工的合作伙伴开放 Fresha Platform Services 和附加服务
        - 每个合作伙伴或每名可预约团队成员每月计费
        - 合作伙伴条款确认存在订阅费；独立评价称有单人层级和按席位层级，但抓取文本转储未保留官方费用表
        - 比交易费用更可预测，但当前定价和渗透率只有部分佐证
        - 提供当前套餐矩阵、席位数，以及按套餐拆分的月经常性收入
      - - 支付处理
        - Fresha 作为商业代理收取客户付款，并向合作伙伴汇付净额
        - 按刷卡、在线或手动录入交易计费
        - 法律文本确认这是核心支付通道；本证据包里的精确当前费率主要来自评价，而非一手费用卡
        - 可能是与 GMV 绑定的大体量、高频、经常性收入流，但处理商分成和净抽成未知
        - 披露总处理金额、支付挂载率、处理商转付成本和净支付收入
      - - 市场新客费
        - 对市场来源新客的首次预约收取一次性费用
        - 首次预约价值的百分比
        - 多个独立评价称费用为 20%，最低 $6；本证据包的一手条款未保留精确数字费率
        - 基于效果的获客收入，但归因争议可能伤害信任和留存
        - 提供归因逻辑、退款政策和市场获客费用收入
      - - 在线预约和高级功能使用
        - 在核心软件之上叠加使用费和高级功能变现
        - 按功能或预约相关动作计费
        - 2021 年官方发布称，Fresha Plus 和按使用量收费在 2025 年定价调整前已经存在
        - 显示除支付外还有变现深度，但当前功能级收入不透明
        - 按队列拆分功能 ARPU、挂载率和流失
      - - 金融服务 / Fresha Capital
        - Fresha 分发第三方金融机构提供的贷款产品入口
        - 推荐、平台或附属金融经济性未披露
        - 合作伙伴条款定义了 Fresha Capital 和第三方金融机构，但保留证据包里没有公开收入分成
        - 可能是有吸引力的附属变现，但目前无法承销
        - 提供资本产品的规模、审批率和 Fresha 经济性
      - - 订金、爽约和取消付款
        - 通过 Fresha Payment Services 路由订金收取和与预约价值挂钩的政策
        - 取决于合作伙伴政策，按百分比或固定费用计费
        - 服务条款允许参与合作伙伴制定订金、取消和爽约政策，最高可达预约价值的 100%
        - 支撑支付采用和合作伙伴锁定，但收入确认方式不清楚
        - 澄清 Fresha 是否从订金或爽约工作流中获得单独收入
