        - 订阅主导
        - 官方定价页展示分层套餐、市场入口、不限用户和 AI 附加项，但抓取文本里没有干净的起步价数字
        - 市场和支付变现存在，但这里无法支撑精确费率表
        - 市场、品牌 App、营销、支付、集成、多门店
        - 低
        - 更像复杂度更高的存量厂商销售，而不是低摩擦的美业获客话术
      - - Vagaro
        - 订阅主导
        - 低置信度对比来源显示约 $30 / 月；官方页面强调免费试用，而不是完整标价细节
        - 抓取页面没有清晰的市场费用信号
        - 宽泛运营套件，加上支持和 API 触点
        - 低
        - 价格对比叙事可能比 Fresha 更容易讲，但本证据包支撑的精确定价偏弱
      - - Booksy
        - 订阅主导的美业套餐
        - 官方披露 $29.99 / 月 + $20 / 额外用户
        - 自获客客户或 Boost 关闭时不收佣金；Boost 开启时，对首次到店收一次性 30% 佣金
        - 包含所有功能、支付、营销、爽约保护、市场
        - 高
        - 清晰标价让买方对比比 Fresha 的分层费用叙事更简单
      - - Square Appointments
        - 免费 / Plus / Pro 分层阶梯
        - 每门店 $0 Free、$49 Plus、$149 Premium；年处理额超过 $250K 后定制定价
        - 处理费和定制费率谈判是模式的核心组成
        - 预约，加上宽泛 POS、营销、薪资、银行生态
        - 中
        - 已经想把 Square 用作记录系统的商户，适配度很高
      - - StyleSeat
        - 固定订阅
        - 官方披露 $35 / 月
        - 官方页面声称没有隐藏费用
        - 市场获客、AI 营销、智能定价、排期、支付
        - 高
        - 单人专业人士和小型美业商户对比 Fresha 费用时，简单定价有吸引力
    notes: Mindbody 和 Vagaro 的定价精度是抓取证据包里最弱的一环，不应过度承销。抓取到的 Fresha 官方快照里，定价也有部分不透明，因此能支撑的结论是模式结构，而不是当下套餐的精确算术。
