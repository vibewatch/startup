  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与否决标准框架
        blocks:
          - type: paragraph
            body: >-
              Fresha 剩余风险最高的部分不是泛泛的创业噪音。第一是隐私、支付和责任分配带来的法律与监管敞口。Fresha 在部分场景下是英国和欧盟用户的数据控制者，会把数据转移到英国和 EEA
              之外，使用画像做个性化营销，并在必要时与合作伙伴、处理方、服务提供商、营销对手方和公共机关共享信息。与此同时，条款明确：Fresha
              充当商业代理，代收资金，向商户开票，但仍把拒付和相当一部分底层服务责任推回给合作伙伴。第二是商户反弹和流失风险：独立定价来源和评论来源反复提到费用冲击、支持摩擦、发票争议，以及 2025
              年从旧的免费核心叙事转向后的困惑。第三是竞争切换风险，因为 Square、Mindbody、Booksy、Vagaro 和 StyleSeat 都向同一 SMB
              客群销售发现、支付、员工管理以及迁移或切换支持。第四是财务模型不透明和人员执行：公开来源支持相当规模和盈利能力，但不支持已审计费率、利润率、流失、现金或债务细节。只有在合规、支持质量和商户留存强于投诉所暗示的水平时，投资逻辑才成立。
