      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场没有单一买方画像。Mordor 称小型和个人专业人士是 2025 年最大群体，这与 Fresha、Booksy、Vagaro 和 StyleSeat
              面向独立造型师和小型沙龙使用的功能与市场进入语言相吻合。在这一细分中，业主经理通常既是买方也是付款方，前台或服务人员是日常用户，采用触发点是减少电话来回，同时捕捉在线发现、提醒、订金和复购预约行为。多员工沙龙和连锁店中，买方会转向总经理、运营负责人或特许经营领导层，采购逻辑也扩展到集中排期、员工协同、库存、报表、营销和跨门店控制。


              医美水疗细分市场在经济上重要，因为它是增长最快的终端用户，也有最高的单店收入基准，但 Fresha 这类美容操作系统只能部分服务。Boulevard 和 Pabau
              强调表单、图表、ePrescribe、知情同意和医疗式工作流深度，这表明受监管诊所可能位于 Fresha
              可服务市场边缘，而不是正中心。跨细分来看，品类共同购买路径已经可见：消费者对移动预约需求强，商户在新客访问走弱时有压力留住忠诚客户，供应商则把预约与支付、营销、库存、市场发现，有时还有融资打包在一起。这组组合解释了为什么买方需求不止于排期。
