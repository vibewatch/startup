      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Fresha 的资本位置看起来好于许多后期私营软件公司，但公开证据仍远不足以承销资产负债表。2026 年最强证据是 KKR 交易：官方和独立报道都指向 $80 million 新股成长投资、估值超过 $1
              billion，使累计融资升至 $285 million，并为进一步全球扩张和 AI 投资提供资金。同一公告称 Fresha 已经盈利；若能持续，相比仍需成长股权补贴烧钱的同行，短期融资压力会明显下降。2021
              年 General Atlantic 轮仍是此前关键标记：$100 million Series C，使当时累计融资达到 $132 million，资金用途包括产品开发、更深市场预约和战略并购。

              主要保留项是，流动性来自融资能力推断，而不是披露现金证明。本次保留的公开来源没有给出当前现金、月度烧钱、现金跑道、债务到期、契约包，或租赁和处理商义务。独立数据库和媒体来源指向 2024 年 J.P.
              Morgan 约 $30.8 million 风险债，以及包含债务的 $295 million 累计融资视角，与公司背书的 $285 million
              总额冲突。这个差异小到可以调和，但仍未解决。实际结论是，Fresha 近中期大概率有足够资本继续投资产品、支付和市场扩张；但任何外部投资人都无法从保留公开材料中验证下行韧性或下一轮融资时点。
