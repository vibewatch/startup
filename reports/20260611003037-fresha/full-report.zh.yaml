      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              总量层面，Fresha 的客户采用证据相当扎实。官方和高质量媒体来源都指向 130,000+ 家合作商户、120+ 个国家、450,000+ 名专业人士和 35M+
              次月度预约；官网还给出更强的累计证据：平台上已完成 1B+ 次预约。消费者侧需求也在明显放大：Fresha 称月度 App 下载量已超过 1M，并较 2024 年中增长
              300%；欧洲目前下载量领先，美洲第二，APAC 仍在加速。具名客户证据更薄，但方向上有价值。Fresha 的 1M 下载量新闻周期点名多门店运营者 Ted's Grooming
              Room、Masaj、BarberSmiths 和 Gould Barbers，称其把 Fresha 作为共享基础设施；同时引用 Hair Artistry Newmarket 和 Banya No.1
              对发现质量、重复预订和留存流程的直接评价。需要注意的是，这些都是公司筛选过的证据：它们能确认真实使用和相关性，但不能确认合同规模、部署范围或续约经济性。
