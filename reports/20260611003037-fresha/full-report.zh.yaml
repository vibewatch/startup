      - number: '8.4'
        title: 逻辑破裂触发因素、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度在改善，但只能作为信号。Fresha 有新的机构资本、盈利叙事，以及向 AI 和发现倾斜的产品路线图；这些都能支撑另一轮后期私募融资或未来战略进程。但本轮保留来源没有显示 S-1、招股书、IPO
              时间表，或公开市场投资者需要的已审计 KPI 包。基于今天的证据，更现实的退出框架是继续保持私募融资纪律，或未来的战略可选性，而不是短期公开市场准备就绪。


              否决触发因素可以监测。如果已审计尽调显示当前收入显著低于第三方运行率，如果定价调整后商户留存恶化，如果隐藏杠杆或优先权层级明显压低新资金地位，或者如果来自
              Booksy、StyleSeat、Square、Vagaro 或 Mindbody 的竞争性定价压力迫使 Fresha
              用更低变现换客户增长，投资逻辑就会破裂。因此，最终尽调议程必须具体到财务：按收入流拆分的已审计收入、净支付经济性、定价转型前后的流失、债务和准备金义务，以及完整股权结构瀑布。在这套资料摆上桌之前，Fresha
              是一家值得跟踪的严肃公司，而不是一个可由公开证据支持买入的标的。
