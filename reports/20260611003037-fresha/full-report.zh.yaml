  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Fresha 的竞争不是一个窄同行组，而是三层同心圆。该来源包中的直接美容与康养软件同行是 Booksy、Vagaro，以及定位略有不同的
              Mindbody：三者都销售预约加商户工具，但各自强调不同的需求引擎和品类强项。Booksy 是最接近的同类美容市场与专业人士工作流对手；Vagaro
              覆盖美容、康养和健身更广，运营与支持姿态更重；Mindbody 是健身和康养中最深的老牌玩家，多门店和市场基础设施强于典型沙龙排期工具。Square Appointments
              更应被理解为邻近的商业平台替代品，因为它真正的强项不是美容原生发现，而是 POS、薪资、银行、开发者和 app 市场生态的宽度。StyleSeat
              范围更窄，但对个人专业人士有战略意义，因为它比完整多门店操作系统更激进地押注 AI 驱动营销和新客获取。


              外圈仍然重要。手工工具仍是小型沙龙和个人服务者的真实现状替代：若干来源明确把在线预约卖成电话、邮件协调、社交媒体消息和日历来回的替代品。市场高端，大型经营者若更看重 API、app
              生态、合规控制或宽商业工具，而不是美容专用消费者市场，则内部自建或模块化拼装也合理。这意味着 Fresha
              不只在和其他沙龙排期工具竞争；它还在和“继续用轻量手工工具”“拼装更宽的商业栈”“为个人专业人士使用专门增长层”竞争。
