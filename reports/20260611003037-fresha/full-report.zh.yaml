      - number: '1.4'
        title: 规模指标、运营覆盖与缺乏支撑的数字缺口
        blocks:
          - type: paragraph
            body: >-
              Fresha 当前官方规模说法很强，但不同 2026 年材料之间并非完全一致。当前官网称 Fresha 已促成超过 1 billion 次预约，服务 120+ 个国家的 130,000+ 家合作商户，并支持
              450,000+ 名造型师和专业人士。2026 年 5 月 KKR 公告补充称每月预约超过 35 million 次、年 GMV 超过 $15 billion；之后一份公司公告又称平台每月处理超过 $1.4
              billion 的预约价值。合在一起，这些数字支撑了一个很大的垂直软件运营足迹，也强化了 Fresha 更像基础设施层、而非轻量预约组件的判断。

              与此同时，几项重要指标要么冲突，要么支撑偏弱。2026 年 5 月材料和官网使用 130,000+ 家商户，后续官方增长稿则引用超过 140,000
              家商户；方向一致，但数字不完全一致。官方材料没有披露经审计收入、毛利率、当前员工数或留存经济性。Tech Funding News 的第三方报道引用超过 $140 million 的收入运行率、超过 60%
              的增长以及约 500
              名员工，但这些数字只能作为指示性信息，而非权威口径，因为材料包里没有一手申报文件或公司财务报表支撑。正确的尽调姿态是：可以有信心使用官方平台规模指标；把第三方收入运行率和员工数作为低置信度指标保留；并继续把收入质量和人效问题标为开放项。
