    rows:
      - - 按来源拆分的净收入
        - 只有官方 GMV、预约量、下载量和功能叙事
        - 无法判断估值究竟由软件、支付、市场或金融收入质量支撑
        - 要求提供订阅、支付、市场和金融服务的经审计收入拆分
      - - 支付抽成率和处理商经济性
        - 来自评论的费率表和法律收款角色
        - 总费用池可能很大，但 Fresha 留存的净经济性未知
        - 要求提供处理商合同、按地区拆分的净抽成，以及支付渗透队列
      - - 定价调整后的商户留存
        - 评论提到摩擦；官方未披露流失
        - 经常性席位收入和支付收入能否持续，核心风险仍未量化
        - 要求提供 2025 年定价调整前后的 logo 留存、GPDR 和流失原因
      - - 毛利率和支持负担
        - 未披露毛利；支持投诉暗示有隐藏成本
        - 没有利润率数据，无法判断盈利质量
        - 要求提供毛利率桥接，包括支持、争议、支付运营和云成本
      - - 现金 / 烧钱速度 / 现金跑道
        - 只有新股权融资和盈利能力说法
        - 下行情景下的资本充足性无法判断
        - 要求提供最新资产负债表、现金流量表和 24 个月现金跑道模型
      - - 债务 / 契约包
        - 第三方债务引用没有贷款方条款或当前余额
        - 隐性杠杆可能实质改变下行保护
        - 要求提供债务明细、契约、担保和处理商准备金要求
      - - 市场归因逻辑
        - 商户投诉称为所谓非市场客户支付 20% 费用
        - 直接影响获客经济性、退款风险和合作伙伴信任
        - 要求提供审计规则、改判政策和争议费用发生率
      - - 收入确认政策
        - 法律条款显示代理 / 支付角色，但未说明会计处理
        - 总额还是净额确认，可能实质改变外界对规模和利润率的判断
        - 要求提供订阅、市场、支付和金融收入的会计备忘录
