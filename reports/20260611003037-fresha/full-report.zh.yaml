        title: 情景框架与可比背景
        blocks:
          - type: paragraph
            body: >-
              Fresha 没有披露当前已审计收入，因此这里每个估值情景都明确是估计，而非观察值。乐观情景假设第三方给出的 $140 million+ 收入运行率偏保守，2025
              年定价转型能抬升经常性软件收入而不伤害留存，并且 AI 驱动发现加支付绑定继续维持高增长。在这条路径下，三到五年持有期内，约 $180 million 至 $220 million 收入、约 7x 至 8x
              倍数，可以支撑 $1.3 billion 至 $1.8 billion 区间。基准情景更克制，也更有用：如果收入更接近 $140 million 至 $160 million，市场以约 6x 至 7x 给
              Fresha 定价，公允价值落在 $0.8 billion 至 $1.1 billion 左右，接近当前估值，但摊薄后没有形成有吸引力的上行。


              悲观情景重要，因为下行触发因素在来源资料包里已经可见。如果商户对新费用的反弹推高流失，如果归因争议继续侵蚀信任，或者如果定价更清楚的替代方案限制费率扩张，那么 Fresha
              可能被重新定价，更像一个质量较低的混合商业资产，而不是高溢价垂直 SaaS 标的。$110 million 至 $130 million 的收入结果、约 3.5x 至 4.5x 倍数，只意味着 $0.4
              billion 至 $0.6 billion 价值。因此，可比表刻意混合了保留资料包中少数实际可用的价格锚点，以及适合该模型的运营参照。当前证据支持的是一个区间和观察清单纪律，而不是单点目标。
