  - id: TV005
    title: 论点破裂与终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入证明破裂
        - 审计尽调显示当前收入显著低于第三方 $140M+ run-rate，或增长已经转弱。
        - 当前独角兽标记会失去核心数字支撑。
        - 不按当前价格支付；从熊情形区间重新承销。
      - - 定价反弹恶化
        - 2025 年定价调整后，logo 流失或 GPV 留存显著下降。
        - 该模式会更像短期费用榨取，而不是可持续软件变现。
        - 从跟踪转为回避，直到留存稳定。
      - - 归因争议仍然系统性存在
        - Marketplace 费用争议仍然频繁，退款 / override 控制显得薄弱。
        - 合作伙伴信任和获客经济性都会受损。
        - 假设 take-rate 可持续性更低，并下调情形倍数。
      - - 股权结构或债务差于预期
        - 债务、准备金、ratchet 或高级优先权实质上压低新股权顺位。
        - 普通股下行比简单 EV/收入数学所显示的更差。
        - 除非结构清理或价格重置，否则暂停。
      - - 竞争性定价压力加剧
        - Booksy、StyleSeat、Square、Vagaro 或 Mindbody 靠更干净的经济叙事赢单。
        - Fresha 的变现天花板会降低，商户吸收费用的意愿也会变弱。
        - 对溢价倍数承销而言，按投资论点破裂处理。
    notes: 终止触发器聚焦对价格敏感的失败模式，而不是一般运营噪音。
