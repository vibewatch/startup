        - 商户评价中出现归因争议
        - Makerstack、Pabau、SalonBusiness、SchedulingKit、Software Advice 等资料
        - 更像按效果变现 CAC，而不是经典软件定价
      - - 线下刷卡处理
        - 据报道美国费率：2.29% + $0.20 / 笔
        - 独立报道
        - 可能随地区、交易量和支付类型变化；处理商分成未知
        - SalonBusiness 评价和用户评价引用
        - 若采用广泛，高 GMV 上可能形成大额总费用池
      - - 在线银行卡处理
        - 据报道美国费率：2.79% + $0.20 / 笔
        - 独立报道
        - 本轮未保留一手费用表；并非所有 GMV 都一定在线支付
        - Pabau 和 SalonBusiness 定价摘要
        - 变现潜力高于软件席位，但商户摩擦也更高
      - - 手动录卡
        - 据报道美国费率：3.30% + $0.20 / 笔
        - 独立报道
        - 支付渠道风险更高；公开费率未必适用于所有地区
        - Pabau 和 SalonBusiness 定价摘要
        - 表明支付通道按风险定价，抽成率并不统一
      - - 英国支付费率参考
        - 约 1.2% + 20p / 笔
        - 独立报道
        - 区域特定，并明确提示需要直接核验
        - Pabau 定价摘要
        - 进一步说明 Fresha 的实际支付经济性很可能因地区而有实质差异
      - - 替代竞争对手套餐
        - Booksy $29.99 / 月，另加 $20 / 额外用户；StyleSeat 固定 $35 / 月；Square 免费基础版加付费层级
        - 竞争对手官方页面直接披露
        - 竞争对手定价不能代理 Fresha 抽成率，只能代表商户替代选择
        - Booksy、StyleSeat、Square 官方页面
        - 显示 Fresha 的混合模式面对更简单的固定费用或免费基础版报价
