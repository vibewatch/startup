      - number: '1.5'
        title: 里程碑、商业依赖与反向证据
        blocks:
          - type: paragraph
            body: >-
              Fresha 有日期标记的公开时间线显示，公司从免费排期软件逐步走向面向服务商户的垂直集成操作系统。已抓取材料支撑的关键里程碑包括：2015 年创立，2020 年从 Shedul 改名为 Fresha，2021
              年 6 月 General Atlantic 领投 Series C，2024 年 8 月数据库和媒体来源中的 J.P. Morgan 风险债标记，2026 年 5 月 KKR 轮将估值推至 $1 billion
              以上，以及 2026 年 5 月下旬推出 Service Portfolios、Professional Profiles 等新的市场个性化功能。另据 2026 年消费者增长公告，Fresha 月下载量超过 1
              million，并成为全球排名前 10 的生活方式 app，这说明其消费者发现动能有实质，而不只是商户后台工具。

              反向证据更多是商业层面，而非生死线。评论聚合站显示整体满意度较高，但也保留了反复出现的投诉：2025 年定价切换、针对新客户的 20%
              市场费、支持延迟或缺少电话支持，以及部分客户是否真正来自市场渠道的争议。法律与合作商户条款加深了这一风险框架：Fresha 可以因未付余额暂停平台访问，把拒付责任放在合作商户身上，经由 Fresha
              控制的支付服务走款，并按特定预约链接流程适用新客费用逻辑。这些都没有否定产品市场匹配；相反，它们突出了后续章节的核心承销问题——Fresha
              的增长模型看起来有效，但合作商户经济性和平台依赖本来就是其变现方式的一部分。
