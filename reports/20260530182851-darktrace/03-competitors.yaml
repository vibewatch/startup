  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor profile table coverage
    missingEvidence: The table covers the direct, incumbent, adjacent, and likely-entrant set with retained evidence, but it is not an exhaustive census of every NDR, XDR, SIEM, or internal-build alternative in the market.
    whyItMatters: The landscape is broader than any one chapter can enumerate cleanly, and buyers may still consider additional suites or homegrown paths not rowed here.
    diligencePath: Expand TP001 with more direct retained evidence on Elastic-style internal build, Fortinet, and other platform suites before treating the table as exhaustive.
    relatedQuestionRefs:
    - QP003
    - QP004
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: pricing / packaging comparison
    missingEvidence: Equivalent public price-book detail is absent for Darktrace, CrowdStrike, SentinelOne, Palo Alto Networks, Cisco/Splunk, Vectra, and Corelight, while Microsoft is the only vendor with retained public pricing mechanics.
    whyItMatters: Pricing conclusions are necessarily structural rather than quote-accurate, so packaging leverage matters more than nominal list price.
    diligencePath: Add reseller quotes, procurement records, or customer contracts before making tighter ACV or TCO claims in TP003.
    relatedQuestionRefs:
    - QP011
    - QP014
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost quantification
    missingEvidence: The retained public record does not quantify Darktrace RESPOND attach rate, retention split between passive-monitoring and active-response customers, or exact multihoming prevalence.
    whyItMatters: Those variables determine whether the installed base is deeply embedded or merely tolerated as an overlay.
    diligencePath: Request attach-rate, churn-reason, and win-loss data segmented by deployment pattern and response-product usage.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: private competitor financial transparency
    missingEvidence: Vectra, ExtraHop, Corelight, and Nozomi do not provide the same fresh public revenue disclosure as CrowdStrike, SentinelOne, or Palo Alto Networks in the retained set.
    whyItMatters: That limits exact share comparison across the direct and adjacent peer group.
    diligencePath: Collect private-market secondary data, management commentary, or additional financing disclosures before assigning precise share estimates to private peers.
    relatedQuestionRefs:
    - QP015
    relatedTableRefs:
    - TP001
  - type: stale
    severity: minor
    topic: review-surface freshness
    missingEvidence: The chapter relies on accessible PeerSpot and TrustRadius evidence, but some G2-style direct-comparison surfaces were access-blocked and not retained here.
    whyItMatters: User feedback can move faster than vendor marketing or analyst commentary, especially after new product releases or major outages.
    diligencePath: Refresh independent review evidence quarterly and add accessible direct-compare surfaces when they can be fetched cleanly.
    relatedQuestionRefs:
    - QP025
    - QP027
    relatedTableRefs:
    - TP002
    - TP003
