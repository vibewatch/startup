- calloutType: strength
  title: Darktrace still has a real product wedge
  body: |-
    Darktrace is not just another SIEM add-on. The retained evidence still supports a real wedge around self-learning detection, rapid baselining of local behavior, and automated action after tuning. That matters most in accounts that distrust signature-led “good enough” network analytics.
  claimRefs:
  - CP002
  - CP003
  - CP031
  - CP041
- calloutType: risk
  title: Bundle economics are the primary displacement vector
  body: |-
    The strongest bearish evidence is not that Vectra or ExtraHop suddenly surpassed Darktrace on features. It is that Microsoft, CrowdStrike, Palo Alto Networks, Cisco/Splunk, and IBM-backed migrations can move the buying conversation to contracts and control planes that Darktrace does not own.
  claimRefs:
  - CP018
  - CP032
  - CP043
  - CP045
- calloutType: insight
  title: Multi-homing is both protection and ceiling
  body: |-
    Darktrace benefits from being complementary because it is less likely to be ripped out immediately. The same complementarity also caps share of wallet and makes it easier for platform vendors to argue Darktrace is optional once they reach acceptable network coverage.
  claimRefs:
  - CP042
  - CP043
  - CP046
