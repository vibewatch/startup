- id: competitor-profiles
  title: Competitor profiles, scale, and strategic direction
  body: |-
    The profile table makes the central scale asymmetry explicit. CrowdStrike, Microsoft, Palo Alto Networks, and Cisco/Splunk compete from positions of disclosure depth, partner leverage, and larger software revenue bases than Darktrace can currently match in public. CrowdStrike's FY2026 results and Falcon platform language show the clearest version of this model: a unified contract and telemetry foundation that can expand from endpoint into identity, SaaS, and broader AI protection. Palo Alto uses the same logic from the SIEM side through XSIAM, while Cisco extends from network infrastructure into Splunk-based TDIR. [CP004][CP005][CP006][CP009][CP010][CP014][CP015][CP016]

    The direct specialists are more nuanced. Vectra remains the closest like-for-like rival because it markets behavioral detection across network, identity, and cloud, cites 39 AI patents, and still leans on Gartner and GigaOm recognition to prove category leadership. ExtraHop remains a real peer in buyer evaluation sets even without public financial disclosure, while Corelight matters because it commercializes an open-NDR approach for organizations that would rather own the telemetry and analytics layer themselves. Nozomi sits adjacent rather than directly substitutive: its OT and IoT depth matters most when critical infrastructure, industrial networks, or operational-resilience mandates dominate the buying motion. [CP019][CP022][CP024][CP025][CP026][CP027][CP035][CP036][CP037][CP039]

    Darktrace's own position is therefore awkward but still valuable. It is larger and broader than most private pure-play NDR peers, but it is less disclosed and less contractually entrenched than the platform vendors. It differentiates on self-learning AI, anomaly-led detection, and response automation, yet it increasingly sells into accounts where the real procurement decision is whether another specialist deserves budget on top of Microsoft, CrowdStrike, Palo Alto, Cisco, or IBM. That makes strategic direction as important as current feature parity: the winner is often the vendor that best controls the buyer's existing operating model, not the one with the single best anomaly story. [CP001][CP002][CP003][CP019][CP041][CP045]
