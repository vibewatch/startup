- id: switching-costs-distribution
  title: Switching costs, lock-in, multi-homing, and distribution power
  body: |-
    Darktrace does have real switching costs, but they are not the same as suite-vendor lock-in. TrustRadius reviewers describe a learning period before Darktrace reaches full identification mode, and they also describe automated actions once baselines are established. That means a replacement requires more than removing a sensor: a customer would need to retrain a different system and rebuild the response logic operators now trust. This is real embedded value, especially where autonomous or semi-autonomous response is turned on. [CP030][CP031][CP042]

    The problem is that Darktrace is usually multihomed rather than monopolistic. Microsoft Sentinel is designed to ingest broad third-party data, Cisco XDR sells open integrations and network-led defense, and Splunk remains a unified TDIR control plane. Darktrace therefore tends to coexist with SIEM, endpoint, and identity tooling rather than replace it outright. Multi-homing reduces rip-and-replace risk but also caps wallet share and makes platform-consolidation stories dangerous: Microsoft can exploit existing contracts, CrowdStrike can widen through Falcon Flex, and Palo Alto can intercept QRadar migrations before a specialist is even in the final procurement set. [CP011][CP012][CP014][CP016][CP018][CP043]

    Distribution power is the clearest asymmetry in the chapter. Cisco now owns Splunk, IBM is explicitly steering SaaS migrations toward XSIAM, Microsoft already sits in identity and log budgets, and CrowdStrike increasingly sells platform expansion rather than standalone modules. Darktrace still has partner reach, but it is the smaller control plane in this comparison. Its best defense is to become operationally indispensable enough that buyers keep it even when they consolidate. If that indispensability is weak, Darktrace risks becoming a respected second signal inside someone else's security operating stack. [CP006][CP018][CP020][CP021][CP043][CP045]
