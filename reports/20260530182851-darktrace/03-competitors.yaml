    - Security-mature enterprises, government, critical infrastructure
    - Open evidence model and Zeek-community analytics
    - More engineering-heavy and less turnkey than Darktrace
  - - CrowdStrike Falcon
    - Endpoint-first XDR incumbent
    - $5.25B FY2026 ARR and $4.81B FY2026 revenue
    - Enterprise and public-sector SOC teams
    - Unified platform, large installed base, Falcon Flex bundle motion
    - Native network depth is less central than endpoint and identity breadth
  - - Microsoft Sentinel / Defender
    - Hyperscaler SIEM + XDR incumbent
    - 350+ connectors plus Microsoft identity and cloud contract leverage
    - Microsoft-heavy enterprises and shared IT/security buyers
    - Cloud-native SIEM, data lake, graph context, and existing contract footprint
    - Budget logic is strongest where Microsoft is already entrenched
  - - Palo Alto Cortex XSIAM
    - Platform-SOC incumbent
    - $9.2B fiscal 2025 revenue and $5.6B NGS ARR
    - Large SOC teams and consolidation-led enterprises
    - AI-led SOC, strong platformization story, QRadar migration path
    - Public pricing is opaque; best fit is strongest in large suite evaluations
  - - Cisco XDR + Splunk
    - Incumbent SIEM / TDIR control plane
    - Cisco says Splunk makes it one of the largest software companies globally
    - Cisco/Splunk-standardized enterprises
    - Network-led defense plus Splunk data gravity and TDIR workflow
    - Can still feel like status-quo modernization rather than net-new NDR
  - - Nozomi Networks
    - Adjacent OT / IoT specialist
    - Purpose-built OT and IoT security platform for critical infrastructure
    - Industrial, utilities, transport, and OT-heavy operators
    - Deep OT context and operational-resilience posture
    - Not a mainstream enterprise IT substitute for Darktrace
  - - Google Security Operations + Wiz
    - Adjacent platform and likely entrant
    - Google folded Wiz into a multicloud AI-security platform
    - Cloud-first enterprises standardizing around Google Cloud security operations
    - Code-to-cloud plus runtime context and hyperscaler distribution
    - Still more cloud-security-centric than a direct Darktrace replacement today
