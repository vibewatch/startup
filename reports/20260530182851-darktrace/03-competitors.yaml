- id: capability-pricing
  title: Capability, pricing, GTM, and trust posture
  body: |-
    Darktrace's capability case is strongest where buyers value behavioral network depth and response that acts on local baselines rather than just correlated alerts. Its current AI-security page still frames the product against signature- and rule-based approaches, and TrustRadius reviewers confirm that Darktrace learns an environment for a few weeks before moving into fuller identification and automated action. Vectra is the closest competitor on that same behavioral-detection narrative, while Corelight represents the opposite philosophy: open telemetry and open analytics instead of a closed self-learning AI engine. [CP002][CP003][CP019][CP030][CP031][CP039]

    The commercial posture is more mixed. Microsoft is the only vendor in the retained set that clearly publishes pricing mechanics through commitment tiers and data-lake versus analytics pricing, which gives it a structural advantage in budget conversations. CrowdStrike, Palo Alto, Cisco/Splunk, Darktrace, and Vectra mostly appear through enterprise packaging language, review evidence, or bundle proxies rather than public price books. Review data suggests Vectra can land below Darktrace on price in some deals even as both are seen as expensive enterprise products, while Darktrace reviewers call out annual price increases and the need for negotiation. Trust posture also diverges: CrowdStrike, SentinelOne, Palo Alto, Microsoft, Cisco, and IBM publish current operating metrics and roadmap language regularly, whereas Darktrace is now judged through a thinner private-company disclosure surface. [CP004][CP006][CP007][CP009][CP011][CP013][CP015][CP016][CP028][CP029][CP030]

    That disclosure gap matters because trust is part of competition in regulated accounts. Suite vendors can pair product claims with quarterly disclosures, public breach narratives, partner ecosystems, and migration offers. Darktrace can still win on product experience or autonomous response, but it cannot currently match the same public evidence density around scale, current contracts, or attach rates. In a market moving toward platform rationalization, the buyer often interprets “trust” as disclosure, migration certainty, and commercial predictability as much as technical efficacy. [CP018][CP030][CP041][CP043][CP045][CP046]
