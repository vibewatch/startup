    - Platform contract with bundle expansion and Falcon Flex-style cross-module economics
    - No public card pricing in retained set
    - Large direct and channel motion
    - 'High: Flex accounts and endpoint footprint widen adjacency without separate procurement'
    - Can absorb incremental detection workflows before Darktrace gets a clean-sheet chance
  - - SentinelOne Singularity
    - Tiered platform positioning across endpoint, cloud, and identity; pricing still largely quote-based in retained evidence
    - No public list pricing in retained set
    - Direct plus channel
    - 'Medium-high: unified platform standardization pitch'
    - More competitive where buyers want XDR without Microsoft or CrowdStrike lock-in
  - - Palo Alto XSIAM
    - Platformization and enterprise-ELA style motion; public price book not retained
