  - Pricing / contract model
  - Public pricing visibility
  - GTM / distribution
  - Bundling or migration leverage
  - Implication
  rows:
  - - Darktrace
    - Enterprise subscription across modules and protected environments; review evidence suggests negotiated pricing and annual escalators
    - No public list pricing
    - Direct sales plus partner channel
    - Low bundle leverage versus suite vendors
    - Wins require proof of differentiated outcomes, not easy spreadsheet comparison
  - - Microsoft Sentinel
    - Consumption pricing with commitment tiers and analytics vs data-lake tiers
    - Yes, partial mechanics are public
    - Microsoft enterprise agreements, Azure, partner ecosystem
    - 'Very high: existing Microsoft contracts reduce incremental buying friction'
    - Most credible status-quo substitute where Microsoft is already paid for
