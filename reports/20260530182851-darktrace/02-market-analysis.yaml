- id: buyers-and-adoption
  title: Buyer, User, Payer, and Adoption Path
  body: 'Darktrace’s public materials suggest the primary economic buyer is still a security executive or board-exposed security budget owner, but the operational champion is usually closer to the SOC and identity or cloud operations teams. The company’s customer evidence clusters around colleges, hospitals, industrial manufacturers, councils, and other organizations with meaningful operational continuity risk, while the network page explicitly targets SMB, enterprise, government, and critical infrastructure. That implies a buyer map led by enterprise and regulated accounts, not consumer or very small business. The adoption path is also multi-track: partners and MSSPs can package Darktrace into MDR-style offerings, while direct deployments often start with a proof of value, then expand into email, identity, or cloud once teams trust the workflow impact. Identity deployments appear especially cross-functional because Darktrace ties them to SSO, AD, and account-control actions. In practice,
    the user is the analyst or responder, the evaluator is the security-operations or detection-engineering lead, and the payer can sit with the CISO, CIO, or a shared security-platform budget depending on whether the buying trigger is threat pressure, compliance, or tool consolidation. TM003, FM003, and FM004 map those relationships.'
