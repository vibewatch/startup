- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - IBM breach-cost and AI-savings evidence
    - driver
    - current
    - Supports ROI-oriented buying cases for faster detection and automation.
    - How often does Darktrace win on quantified loss-reduction versus feature parity?
  - - Faster breakout and more AI-enabled attacks
    - driver
    - current
    - Raises urgency for real-time detection, triage, and response.
    - Are Darktrace wins concentrated after incidents exposing dwell-time or analyst-capacity gaps?
  - - Cloud and identity visibility gaps
    - driver
    - current
    - Creates demand for detection layers that span cloud, account, and network context.
    - What share of new pipeline comes from cloud or identity-led use cases rather than core NDR replacement?
  - - NIS2 and SEC governance pressure
    - driver
    - 2024-2026
    - Pushes cybersecurity accountability upward to management and boards, supporting budget prioritization.
    - How much revenue is tied to regulated sectors that now face stricter reporting and oversight?
  - - EU AI Act oversight requirements
    - constraint
    - 2026 onward
    - Adds compliance and human-oversight friction to autonomous-response claims in Europe.
    - What product and legal work is needed to keep autonomous response deployable in EU-regulated accounts?
  - - Platformization by large suites
    - constraint
    - current
    - Shifts budgets toward broader vendors with bigger platform ARR and bundled renewal economics.
    - Where does Darktrace replace an incumbent platform versus sell as a specialist overlay?
  - - Complementary-not-replacement architecture
    - constraint
    - current
    - Supports deployment fit but limits full budget displacement and can slow procurement.
    - What percentage of deals add Darktrace alongside SIEM/EDR rather than consolidating spend into it?
  - - Thin current independent review evidence
    - constraint
    - current
    - Makes pricing, false-positive, and renewal-friction claims hard to validate from public sources.
    - Request current win-loss, pricing-objection, and reference-call data under NDA.
  notes: The table is a diligence agenda rather than a scorecard; it links each demand tailwind or constraint to the underwriting question it creates.
