tables:
- id: TM001
  title: Market Definition Table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - AI-led NDR / network detection
    - Network telemetry, lateral-movement detection, anomaly detection, autonomous response, investigation workflow.
    - Firewall hardware refresh, legacy IDS/IPS, generic network monitoring without response logic.
    - 'Buyer: SecOps or detection lead; payer: CISO or security platform owner.'
    - Core Darktrace wedge and still the clearest analyst-style category boundary.
  - - Identity detection and response
    - SSO/AD monitoring, account-takeover detection, session controls, insider-threat and lateral-movement detection.
    - Pure IAM, PAM, lifecycle administration, governance-only identity spend.
    - 'Buyer: identity security or security architecture; payer: CISO/CIO.'
    - Expands Darktrace beyond network into account-centric security budgets.
  - - Cloud detection and investigation
    - Multi-cloud threat detection, API and workload monitoring, cloud forensics, identity-context investigation.
    - General cloud infrastructure, CSP contracts, pure CSPM or ticketing tools without detection logic.
    - 'Buyer: cloud security lead; payer: CISO, CIO, or platform budget owner.'
    - Important adjacency after Darktrace’s cloud and forensics push.
  - - AI-driven email security
    - Behavioral phishing, BEC, account-takeover detection, email and collaboration threat response.
    - Legacy SEG-only spend, archiving, and generic collaboration subscriptions.
    - 'Buyer: email security or SecOps; payer: security operations budget.'
    - Supplementary module that broadens SAM but should not be treated as the full email-security market.
  - - Partner-delivered MDR overlay
    - Managed monitoring and response services powered by Darktrace network and email telemetry.
    - Staff augmentation or consulting without a differentiated detection platform.
    - 'Buyer: MSSP/MDR operator or enterprise CISO; payer: service budget or security ops budget.'
    - Shows that some Darktrace demand is monetized through channel and service layers, not only direct software seats.
  notes: Boundary is intentionally partial because Darktrace’s platform framing overlaps adjacent markets; included spend tracks telemetry-led detection and response, while excluded spend removes governance-only, hardware-only, and consulting-only categories.
