- id: drivers-and-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The demand case is credible. IBM says the global average cost of a data breach is $4.4 million and that organizations using AI extensively in security see $1.9 million of savings, while CrowdStrike reports a 29-minute average eCrime breakout time, an 89% rise in attacks from AI-enabled adversaries, and a 42% increase in zero-days exploited before disclosure. Darktrace’s own cloud and identity pages reinforce why buyers care: only 23% of organizations in its cited CSA survey report full cloud visibility, 79% report at least one cloud breach in the last 18 months, and identity breaches remain slow to resolve. Regulation amplifies this pressure, as NIS2 expands obligations across 18 critical sectors and the SEC’s cyber rules push public companies toward faster incident disclosure and documented governance. The constraint side is equally important. The AI Act adds human-oversight and high-risk-system obligations just as autonomous response becomes part of the sales pitch, while platform
    vendors such as Palo Alto continue to steer budgets toward broader suites. Darktrace also positions its NDR layer as complementary to SIEM, EDR, and firewalls, which supports adoption but also limits simple rip-and-replace economics. TM004 separates the macro growth tailwinds from the underwriting risks.'
