- id: gaps-and-contradictions
  title: Diligence Gaps and Contradictory Estimates
  body: 'Two contradictions should remain explicit. First, public market estimates vary because they describe different boundaries: a $25.53 billion AI-cybersecurity lens, a $7.92 billion XDR platform lens, and a much narrower $4.91 billion NTA/NDR wedge all coexist, and additive math would overstate Darktrace’s true opportunity. Second, the company is selling a broad AI-led platform story into a buyer base that still evaluates substantial portions of the product through a narrower NDR or workflow-augmentation lens. Several diligence gaps remain material. The strongest adverse source in the discovery pack — an Omdia piece on 2022-2026 NDR market dynamics — returned 404 during this run, so the most direct public evidence on specialist renewal pressure could not be revalidated from primary text. Independent, current review evidence on pricing, false positives, and renewal friction is also thin in publicly retrievable form, and private-company disclosure means current SOM cannot be verified
    from 2025-2026 revenue data. For valuation work, that means boundary discipline and management-side cohort evidence matter more than any single published TAM headline.'
