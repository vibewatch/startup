company:
  name: Darktrace
chapter:
  number: 2
  title: Market Analysis
  summary: 'Darktrace sells into a market that is narrower than “all cybersecurity” but broader than standalone NDR: its current platform now spans network, identity, email, cloud, and MDR-adjacent workflows. Public market lenses show a wide spread — from Mordor’s $4.91 billion 2026 network-traffic-analysis wedge to MarketsandMarkets’ $25.53 billion 2026 AI-cybersecurity market — so the investable question is less whether demand exists and more whether Darktrace can defend a specialist position as platform consolidation, AI governance, and buyer proof requirements intensify.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Darktrace’s economically relevant market is not total security spend and it is not limited to a legacy NDR appliance budget. Current product pages show a platform centered on network, identity, cloud, and email detection plus AI-led investigation and targeted autonomous response, which means the included spend pool is telemetry-led detection and response across those surfaces rather than generic firewalls, GRC suites, pure IAM administration, or consulting-heavy services. The network page still makes the core boundary clear: Darktrace positions NDR as complementary to EDR, SIEM, and firewall stacks, which implies the company often wins as an additive or displacement layer inside an existing security architecture rather than as a full control-plane replacement. Adjacent spend matters because Darktrace can also reach the same demand through partners, MSPs, and MSSPs that package network and email monitoring into managed services. The practical boundary therefore runs from narrow NDR
    into a broader AI-led detection-and-response workflow, while the main status-quo substitutes remain SIEM-first detection, endpoint-centric bundles, legacy email gateways, and manual SOC triage. TM001 captures that spend boundary and its exclusions.'
