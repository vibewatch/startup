companyProfile:
  summary: >-
    Darktrace is a Cambridge-based cybersecurity company founded in 2013 that built its reputation in self-learning
    network detection and now sells a broader AI security platform spanning network, email, cloud, identity, OT,
    endpoint, investigation, forensics, and AI-governance workflows. The last public snapshot before the October 2024
    Thoma Bravo take-private showed a scaled software business with $782.2 million of ARR, at least $689.5 million of
    revenue, and 9,735 customers, while current company materials still market 10,000 customers across 110 countries.
    The investment debate is no longer whether Darktrace is real or strategically relevant; it is whether outside
    investors can underwrite sponsor-era performance, leverage, and governance with the much thinner private-company
    disclosure now available.
  foundedDate: '2013-01-01'
  founders:
    - name: Nicole Eagan
      role: Co-Founder & Strategic Advisor
      claimRefs: [CO010]
    - name: Jack Stockdale
      role: Founding CTO
      claimRefs: [CO011, CO012]
  foundingLocation: Cambridge, UK
  headquarters: Cambridge, UK
  productSummary: >-
    Darktrace sells an AI security platform that detects, investigates, responds to, and helps recover from threats
    across network, cloud, identity, email, OT, endpoint, and AI-agent environments, with modules for autonomous
    response, cyber investigation, forensics, exposure management, and secure AI governance.
  customerFocus: >-
    Large enterprises, critical infrastructure operators, public-sector agencies, healthcare organizations, educational
    institutions, and other security teams running hybrid estates that need always-on detection and automated response.
  businessModel: >-
    Recurring software platform sold through direct enterprise relationships and partner channels including VAR,
    MSP/MSSP, consultancy, and distributor routes, with buying flows centered on demos, evaluation, and sales-led
    contracting rather than transparent self-serve pricing.
  stage: PE-backed private
  fundingStatus: >-
    Darktrace was taken private by Thoma Bravo on 1 October 2024 at about a $5.3 billion valuation; December 2025 UK
    charge filings show secured financing with Goldman Sachs Bank USA but not readable debt principal, pricing,
    maturity, or covenant detail.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO006, CO013, CO018, CO021, CO031, CI003, CI004, CI029, CI030, CU001, CU003, CE001, CE005, CE006]
summary:
  headline: >-
    Darktrace still looks like a scaled, strategically relevant cyber platform, but sponsor-era opacity on debt,
    governance, and current operating performance keeps the name in track rather than buy territory.
