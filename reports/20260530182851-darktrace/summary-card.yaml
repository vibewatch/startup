  topStrengths:
    - >-
      Broad product surface now spans network, cloud, identity, email, OT, endpoint, forensics, and secure-AI controls
      rather than a single NDR wedge.
    - >-
      The last public operating snapshot was high quality, with $782.2M ARR, at least $689.5M revenue, 89.3% gross
      margin, and 106.6% net ARR retention.
    - >-
      Current company disclosures still point to a large installed base, with 10,000 customers across 110 countries and
      a meaningful partner footprint.
  topRisks:
    - >-
      Sponsor-era debt, covenant headroom, and equity-waterfall terms remain opaque even though public filings show
      secured financing exists.
    - >-
      Leadership turnover and stale website disclosures create governance noise during the first full private-company
      period.
    - >-
      Larger cyber platforms can pressure Darktrace's renewal and pricing power as buyers consolidate security spend
      into broader suites.
    - >-
      Residual reputational and regulatory overhang from the 2023 accounting controversy still warrants a disclosure
      discount.
  unresolvedGaps:
    - >-
      Readable FY2025 and FY2026 financial statements plus an ARR and revenue bridge from the June 2024 public snapshot
      into the private period.
    - >-
      Debt principal, pricing, maturity, covenant thresholds, and lender-reporting detail behind the Goldman
      Sachs-secured charge.
    - Current cap-table ownership, management incentive structure, and private-company board and committee composition.
    - A clean current-period bridge for customer count, headcount, retention, and module mix after the take-private.
