  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: regulatory-closure-and-ey-materials
    missingEvidence: Formal FCA or FRC closure materials, the underlying EY report, and any related regulator correspondence tied to the 2023 accounting review.
    whyItMatters: The accounting thesis is much weaker than it was in 2023, but the absence of the underlying report and regulator outcome leaves a residual headline and diligence tail-risk that the public record cannot close.
    diligencePath: Request the full EY report, legal-counsel summary, and all FCA or FRC correspondence before treating the issue as fully closed.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: federal-authorization-status
    missingEvidence: Current public proof of Darktrace Federal authorization status, qualification path, and the revenue or renewal significance of federal accounts.
    whyItMatters: A dedicated federal affiliate is helpful, but public-sector execution risk cannot be sized without knowing whether the route is merely available or commercially meaningful and fully qualified.
    diligencePath: Ask management for current public-sector authorization details, active federal references, pipeline, and renewal exposure by agency or route.
    relatedQuestionRefs:
    - QR018
  - type: private-evidence-only
    severity: material
    topic: concentration-and-private-retention
    missingEvidence: Current top-customer concentration, partner concentration, NRR, GRR, gross churn, and route-to-market mix after the take-private.
    whyItMatters: Public reviews and partner pages show possible pressure points, but they do not reveal whether any single channel, customer cohort, or partner relationship is now economically decisive.
    diligencePath: Request a post-buyout customer and channel concentration pack with retention, churn, expansion, and partner-attributed ARR by cohort.
    relatedQuestionRefs:
    - QR030
