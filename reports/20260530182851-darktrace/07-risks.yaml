    - EY found no evidence of fraud, but Darktrace gave the results to the FCA and FRC and the public record still does not show a formal closure
    - Medium
    - High
    - Independent EY review plus stated control improvements
    - A late regulator action or undisclosed correspondence could reopen diligence
    - Obtain the full EY report and all FCA/FRC correspondence
  - - AI Act compliance and transparency duties
    - EU
    - AI Act in force; prohibited practices effective from February 2025 and transparency rules from August 2026
    - Medium
    - High
    - Darktrace has published a responsible-AI framework and interpretability claims
    - Product scope against high-risk and deployer obligations is still not cleanly mapped in public
    - Map each product module to AI Act obligations and customer allocation of responsibility
  - - NIS2-driven supplier scrutiny
    - EU
    - Essential and important entities must assess supplier cybersecurity and supply-chain practices
    - High
    - High
    - Darktrace can point to AI governance, ISO language, and broad platform coverage
    - Regulated buyers can still elongate procurement if vendor evidence is insufficient
    - Request regulated-customer audit packs, DPA terms, and supplier questionnaires
  - - UK GDPR / ICO AI data-protection challenge
    - UK / EU
    - Active obligation around DPIAs, transparency, and lawfulness for AI systems processing personal data
    - Medium
    - High
    - Darktrace publishes AI-governance principles and customer-facing policy materials
    - Behavioral monitoring can still trigger privacy objections if retention or minimisation is weak
    - Review DPIA templates, retention settings, and data-minimisation controls
  - - Gatekeeper patent litigation and future FTO risk
    - U.S.
    - Case transferred to N.D. Cal.; PatSnap reports voluntary dismissal with prejudice in February 2026
    - Low-Medium
    - Medium-High
    - Dismissal with prejudice and no damages or injunction in public summary
    - The case shows Darktrace is now a realistic patent-assertion target
    - Request freedom-to-operate analysis, reserve assumptions, and portfolio strategy
