- id: partner-and-dependency-risk
  title: Partner / dependency risk
  body: 'Darktrace’s ecosystem helps it land in large environments, but it also creates multiple ways for outside parties to capture value or create failure points. The company’s own materials say it has deep alliances with AWS and Microsoft, while the technology-partners catalog shows integrations touching AWS Lambda, Microsoft Graph Security API, Azure Sentinel, Splunk, ServiceNow, Okta, and other externally controlled systems. That is strategically useful, yet it means product quality is partly hostage to API stability, partner priorities, and competitive overlap with the same firms Darktrace relies on. The go-to-market side carries a similar pattern. Darktrace openly routes distribution through VARs, MSPs, MSSPs, consultancies, and distributors, so partner effectiveness directly affects proof-of-value motion and managed-service expansion. The federal affiliate and specialist OT partnerships extend reach further, but they also create more nodes where qualification, certification, or roadmap
    drift can slow commercial execution. Sponsor and lender dependence belong in the same risk family: Thoma Bravo controls strategic timing, and the Goldman Sachs charge shows the capital structure is no longer a clean public-equity story.'
