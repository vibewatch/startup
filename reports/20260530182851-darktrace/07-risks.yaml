- id: regulatory-and-legal-risk
  title: Regulatory / legal risk
  body: 'Darktrace’s legal and regulatory exposure is meaningful but not obviously existential from the evidence reviewed. The key legacy issue remains the 2023 short-seller attack: Reuters and later UK accounting coverage show that Darktrace hired EY after Quintessential Capital Management attacked the company’s financial reporting, and the later public summary said EY found no evidence of fraud while identifying only a small number of errors and inconsistencies. That materially lowers immediate fraud risk, but it does not fully close the file because Darktrace said it would provide the results to the FCA and FRC rather than publish the report, and the reviewed 2026-period public materials still do not show a formal regulator closure. The second legal issue is IP: PacerMonitor confirms the Gatekeeper patent case transferred to Northern California, and PatSnap reports a February 2026 dismissal with prejudice. That is a favorable outcome, but it also demonstrates that Darktrace is now large
    enough to attract patent assertions. Finally, Darktrace’s AI-native monitoring model sits under a tightening policy perimeter: the EU AI Act, NIS2, UK ICO AI guidance, and the FCA’s AI governance framing all increase the cost of being a trusted cyber-AI vendor for regulated customers.'
