  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: debt-quantum
      missingEvidence: Debt principal, spread, maturity, covenant thresholds, and latest compliance certificate for the Goldman Sachs-backed facilities.
      whyItMatters: The public record proves leverage exists but cannot show whether equity risk is moderate or severe.
      diligencePath: Request executed credit documents and lender reporting directly from management or counsel.
      relatedQuestionRefs: [QV006]
    - type: access-blocked
      severity: material
      topic: sponsor-era-financials
      missingEvidence: Readable FY2025 statutory accounts or equivalent management accounts covering sponsor-era revenue, margin, cash flow, and budget variance.
      whyItMatters: Without usable sponsor-era financials, the recommendation stays track because the chapter cannot verify whether FY2024 quality persisted.
      diligencePath: Request an extracted management pack or data-room copy rather than relying on the Companies House image PDF.
      relatedQuestionRefs: [QV008]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable valuation table coverage
      missingEvidence: Direct, currently accessible NDR transaction precedents with corroborated revenue or ARR multiples comparable to Darktrace.
      whyItMatters: The comparable table covers decision-relevant public and sponsor precedents, but open-source support for the cleanest direct-NDR M&A rows remained incomplete in this run.
      diligencePath: Refresh direct NDR M&A sources with accessible filings, wire releases, or banker materials before a future refresh.
      relatedQuestionRefs: [QV014]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: material
      topic: cap-table-waterfall
      missingEvidence: Current ownership, management rollover, preference structure, debt ranking, and exit waterfall mechanics.
      whyItMatters: Enterprise value alone does not tell a new investor what common-equity outcomes look like under sponsor ownership.
      diligencePath: Obtain counsel-prepared cap-table and waterfall materials before any investment committee decision.
      relatedQuestionRefs: [QV030]
