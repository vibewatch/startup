schemaVersion: report-v2
artifact: valuation
slug: darktrace
runDate: '2026-05-30'
company:
  name: Darktrace
chapter:
  number: 8
  title: Valuation
  summary: >-
    Darktrace entered private ownership at a valuation that looked disciplined against its last public ARR,
    revenue, and retention snapshot, but the open record since October 2024 is too thin to underwrite a
    buy recommendation today. The FY2024 business still looked sponsor-grade—$782.2M ARR, at least
    $689.5M revenue, 89.3% gross margin, 106.6% net ARR retention, and 9,735 customers—yet the current
    capital structure, sponsor-era growth rate, and equity waterfall remain opaque despite a visible Goldman
    Sachs charge. The right call is track with medium confidence, high risk, and a fair-only-near-entry
    valuation stance: Darktrace is strategically relevant, but public evidence does not justify paying above
    the 2024 sponsor mark without direct diligence access.
sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Darktrace still has a credible investment case because the last fully disclosed operating snapshot was
      strong enough to look like a scaled, profitable cyber platform rather than a speculative AI story. By
      June 2024, the company had reached $782.2 million of ARR, at least $689.5 million of revenue, 89.3%
      gross margin, 106.6% net ARR retention, and 9,735 customers; current company materials still point to
      roughly 10,000 customers, 110 countries, and more than 2,300 employees. The pro case is that Thoma
      Bravo bought a real platform with category breadth, cloud-forensics expansion through Cado, and enough
      retention quality to earn a future exit at a higher value. The anti-thesis is that the attributes that
      made Darktrace sponsorable are now hidden behind private ownership. The public record shows leverage,
      two CEO transitions in the sponsor transition window, residual accounting-overhang discount, and an
      Omdia view that standalone NDR renewals have been pressured by XDR platform consolidation. That leaves
      Darktrace in the investable-but-not-priceable bucket: strategically relevant, but not investable at
      high conviction without fresh private data.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV013, CV015, CV016, CV017, CV018, CV020, CV021, CV030, CV032, CV034, CV045, CV046, CV048]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: current-financing-and-entry-discipline
    title: Current financing and entry discipline
    body: >-
      The cleanest valuation anchor is still the October 2024 sponsor entry. Using the last public FY2024
      numbers, Thoma Bravo paid about $5.3 billion, which implies roughly 6.8x ARR and 7.7x revenue. That
      does not look reckless relative to Darktrace's disclosed economics: the business was growing, gross
      margin was still near 90%, and retention remained above 100%. The problem is everything that happened
      after closing. Companies House confirms that FY2025 statutory accounts were filed, but the open-web
      extraction is effectively blank. The December 2025 MR01 filing also proves leverage exists and names
      Goldman Sachs Bank USA as the secured lender, yet the public record still does not disclose principal,
      pricing, maturity, or covenant levels. Entry discipline therefore has to be simple. A new investor
      should treat the 2024 sponsor price as a fair-value ceiling until management provides a current ARR
      bridge, updated retention, current EBITDA / FCF, and the debt package. Without those items, higher
      pricing would mean paying up for opacity rather than paying for proven improvement.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV010, CV011, CV012, CV035, CV036, CV048]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: comparable-analysis-and-valuation-stance
    title: Comparable analysis and valuation stance
    body: >-
      The comparable exercise supports Darktrace as fairly valued at sponsor entry, not obviously cheap.
      Public cyber leaders trade far above Darktrace's 2024 entry mark on simple market-cap-to-revenue
      proxies: CrowdStrike sits near 38.7x revenue, Palo Alto near 23.1x, and SailPoint near 10.0x. Those
      numbers make Darktrace's 7.7x revenue entry look conservative, but only in a superficial way. The
      public peers have fresher disclosure, stronger public-liquidity value, and less sponsor-era opacity.
      SailPoint is the best sponsor precedent: Thoma Bravo bought it for about $6.9 billion in 2022, and it
      now carries a public market capitalization above $10 billion, showing that Thoma Bravo can re-rate a
      scaled security asset over a multi-year hold. Even so, Darktrace is not SailPoint. Its direct category
      is under more platform pressure, its current debt is unknown, and its governance path is visibly less
      settled. That is why the chapter lands on a fair stance near the 2024 entry price rather than an
      attractive stance today.
    claimRefs: [CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV035]
    tableRefs: []
    figureRefs: [FV004]
  - id: scenario-analysis-and-return-logic
    title: Scenario analysis and return logic
    body: >-
      The scenario range is wide because Darktrace can plausibly grow into a much higher exit value, but the
      variance is dominated by hidden sponsor-era variables. In the bull case, Darktrace compounds ARR above
      $1.1 billion by 2029, keeps net retention comfortably above 105%, monetizes Cado and cloud forensics,
      and benefits from a more open cyber IPO or strategic-buyer market; that can support roughly $11-14
      billion of value and a little more than 2x gross value on the 2024 entry. In the base case, ARR grows
      toward roughly $1.0 billion and exits around 8-10x ARR, producing about $7.5-9.5 billion. In the bear
      case, NDR platform pressure intensifies, net retention slips below 100%, debt constrains investment,
      and governance uncertainty persists; value can compress toward $4-6 billion, which is near or below
      entry. The weighted lesson is that Darktrace still has upside, but the current public record cannot
      show enough edge to buy into that upside confidently.
    claimRefs: [CV013, CV014, CV015, CV016, CV023, CV024, CV025, CV026, CV027, CV028, CV036, CV037, CV038, CV039, CV040, CV041, CV042]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: exit-readiness-thesis-break-and-diligence
    title: Exit readiness, thesis-break triggers, and final diligence asks
    body: >-
      Darktrace is large enough to have real exit optionality, but not transparent enough to be called exit
      ready on public evidence alone. The positive case is obvious: the company has public-market history, a
      near-10,000-customer footprint, sponsor backing, and a product narrative that still spans network,
      cloud, email, identity-adjacent workflows, and automated forensics. The negative case is equally
      obvious: the public does not know the debt quantum, the FY2025 accounts are practically unusable in
      open extraction, and the company has already gone from Poppy Gustafsson to Jill Popelka to interim CEO
      Charles Goodman within the transition to private ownership. Those are not automatic deal-killers, but
      they are enough to define hard thesis-break rules. The recommendation upgrades only if management can
      show clean sponsor-era compounding, a non-threatening leverage profile, stable leadership, and an exit
      path that looks more like a disciplined re-rating than a forced liquidity event. Until then, diligence
      should focus on debt documents, current ARR quality, cap-table economics, and cloud attach-rate proof.
    claimRefs: [CV008, CV009, CV010, CV011, CV015, CV016, CV017, CV018, CV029, CV040, CV041, CV042, CV043, CV044, CV045, CV047, CV048]
    tableRefs: [TV005, TV006]
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Current read, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Track, Strategic relevance is visible but sponsor-era performance and debt remain opaque, Monitor rather than commit capital until management opens the data room or the price reflects the opacity more clearly]
      - [Confidence, Medium, The last public snapshot was strong but the core post-close inputs are still missing, Enough evidence exists to set discipline but not enough to issue a buy]
      -
        - Risk rating
        - High
        - Leverage is confirmed; governance has been unstable; and NDR consolidation is real.
        - Underwrite downside before upside because the thesis breaks quickly if retention slips.
      -
        - Valuation stance
        - Fair only near the 2024 sponsor entry and stretched above it
        - ~6.8x ARR / ~7.7x revenue at entry looked disciplined versus disclosed FY2024 quality but not obviously cheap relative to opacity.
        - Do not pay a premium to the sponsor mark without current ARR, debt, and cap-table visibility.
      -
        - Entry discipline
        - Price-sensitive and diligence-gated
        - The public record supports using the $5.3B take-private as a reference ceiling rather than as proof of current fair value.
        - Require a current ARR bridge, debt schedule, and waterfall before any invest decision.
      - [Target return hurdle, Need >$10.6B in roughly five years for ~2.0x gross value, A mid-teens IRR from a $5.3B entry requires a bull or strong-base outcome, The base case alone is not enough justification at an unknown higher price]
    notes: >-
      This table is an investment judgment, not a management disclosure. Recommendation, confidence,
      risk, and valuation stance synthesize public evidence and explicitly penalize sponsor-era opacity.
    claimRefs: [CV001, CV002, CV003, CV010, CV011, CV030, CV032, CV033, CV034, CV035, CV036]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Thesis point, Why it matters, Anti-thesis point, What would change the view]
    rows:
      - [FY2024 economics were sponsor-grade, ARR margin retention and customer count support a real software asset rather than a narrative-only AI business, Those metrics stop in June 2024 so investors cannot verify whether quality held under private ownership, Provide monthly ARR NRR churn EBITDA and cash data from July 2024 onward]
      -
        - Darktrace still has platform breadth and customer scale
        - Near-10,000 customers and current cloud / forensics launches keep the company relevant to buyers and exit markets.
        - Omdia says platform bundles are pressuring standalone NDR renewal patterns and pricing power.
        - Show that cloud / forensics attach and cross-sell are offsetting NDR-only compression.
      - [Cado and ActiveAI create upside beyond core NDR, Cloud forensics can raise ACV and broaden strategic-buyer relevance, The public record does not prove monetization attach rate or integration success, Disclose pipeline conversion and ARR contribution from Cado-related motions]
      - [Sponsor precedent exists, Thoma Bravo has already taken SailPoint private at scale and benefited from later re-rating, Darktrace may not earn the same outcome if debt governance or market structure are weaker, Demonstrate stable leadership controlled leverage and renewed growth into the exit window]
      - [The accounting issue is no longer a live fraud thesis, EY found no material effect on prior statements reducing existential downside, Residual provenance discount remains because the controversy never fully disappears from the public record, Provide the EY report regulator correspondence and clean sponsor-era audit package]
    notes: >-
      The anti-thesis columns are intentionally strong. The chapter upgrades only if management disproves them
      with fresh financial or governance evidence.
    claimRefs: [CV004, CV005, CV006, CV010, CV013, CV015, CV016, CV020, CV021, CV029, CV030, CV045, CV046]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, 2029 ARR assumption, Exit multiple, Implied value, 'Gross value vs. $5.3B entry', 'Probability signal / condition']
    rows:
      - [Bull, '$1.10-1.20B', 12-14x ARR, '$11-14B', '~2.1-2.6x', Requires cloud-forensics monetization NRR above 105% stable CEO and an open 2027-2029 exit window]
      - [Base, '$0.95-1.05B', 8-10x ARR, '$7.5-9.5B', '~1.4-1.8x', Most plausible public-data path if Darktrace keeps compounding but does not re-rate like top public peers]
      - [Bear, '$0.80-0.90B', 5-7x ARR, '$4-6B', '~0.8-1.1x', Becomes likely if NRR falls below 100% debt constrains investment or leadership instability persists]
    notes: >-
      Scenario values are estimated from the last public Darktrace snapshot plus public comparable ranges.
      They are not management forecasts and should be read as underwriting bands under uncertainty.
    claimRefs: [CV002, CV005, CV013, CV015, CV016, CV036, CV037, CV038, CV039, CV040, CV041, CV042]
  - id: TV004
    title: Comparable valuation table
    columns: [Comparable, 'Status / metric date', Value metric, 'Implied multiple / valuation', 'Why it matters', Limitation]
    rows:
      - [Darktrace sponsor entry, 'Oct 2024 close / Jun 2024 operating base', '$5.3B EV on $782.2M ARR and $689.5M revenue', '~6.8x ARR; ~7.7x revenue', Best hard anchor for current discipline because it is the last real control-price transaction, Still stale for a new investor because sponsor-era debt and operating trend are undisclosed]
      - [SailPoint public 2026, May 2026 CompaniesMarketCap snapshot, '$10.68B market cap on $1.07B TTM revenue', '~10.0x market-cap / revenue', Useful Thoma Bravo cyber-software precedent for what a re-listed sponsor asset can trade at, Identity security is more directly favored by current public markets than standalone NDR]
      - [Palo Alto Networks public 2026, May 2026 CompaniesMarketCap snapshot, '$228.45B market cap on $9.89B TTM revenue', '~23.1x market-cap / revenue', Represents the platform-security ceiling if Darktrace ever earns broader suite economics, Far larger more diversified and more liquid than Darktrace]
      - [CrowdStrike public 2026, May 2026 CompaniesMarketCap snapshot, '$186.06B market cap on $4.81B TTM revenue', '~38.7x market-cap / revenue', Shows how richly the market prices the best AI-native public cyber compounder, Much faster growth and stronger disclosure than Darktrace and therefore an upside ceiling rather than a direct comp]
      - [SailPoint sponsor entry, Aug 2022 take-private, '$6.9B all-cash transaction', Valuation reference only, Confirms that Thoma Bravo is willing to own scaled security assets and can create a later re-rating path, Source set does not provide a directly corroborated ARR or revenue multiple for that acquisition]
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public comparables and sponsor precedents supported by
        retained Darktrace, Thoma Bravo, Business Wire, and CompaniesMarketCap sources as of 2026-05-30;
        coverage is partial because clean direct-NDR M&A multiples were not fully corroborated in currently
        accessible retained sources.
    notes: >-
      Public rows use market-cap-to-revenue proxies while Darktrace entry uses enterprise-value multiples from
      the last public operating base. The mix is intentional and reflects the accessible evidence set.
    claimRefs: [CV001, CV002, CV003, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [Trigger, 'Threshold / signal', 'Transmission to thesis', 'Action implication']
    rows:
      - [Retention breaks, Net ARR retention below 100% for two consecutive periods, Invalidates the compounding assumption behind bull and base cases, Move from track to avoid until management shows recovery]
      - [Debt stress appears, Debt proves materially above ~6x EBITDA or covenant headroom is narrow, Turns sponsor leverage from manageable overlay into core equity impairment risk, Rebuild the model on debt-first downside terms before considering any entry]
      - [Governance slips again, A third CEO change or prolonged interim leadership without a permanent plan, Signals sponsor-board instability and lowers exit confidence, Cut multiple assumptions and downgrade exit readiness]
      - [Platform pressure worsens, Clear evidence of renewed non-renewal bundle displacement or pricing concession tied to XDR suites, Confirms the anti-thesis that standalone NDR is structurally compressing, Shift weight toward bear case and lower terminal multiple]
      - [Regulatory or provenance issue reopens, New formal action tied to the 2023 accounting controversy or later disclosure quality, Reintroduces credibility discount and can shut exit windows abruptly, Pause diligence and treat capital-structure downside as primary]
      - [Exit path stalls, No credible secondary strategic or re-IPO preparation by 2028, Weakens the sponsor-playbook argument and raises hold-period risk, Assume longer hold and lower return expectations]
    notes: >-
      Each trigger maps directly to a valuation consequence: lower quality-of-revenue confidence, lower
      multiple confidence, or lower exit confidence.
    claimRefs: [CV010, CV011, CV013, CV018, CV021, CV040, CV041, CV042, CV043, CV046]
  - id: TV006
    title: Final diligence asks table
    columns: [Topic, 'Missing evidence', 'Why it matters', 'Owner / diligence path']
    rows:
      - [ARR bridge and quality, Monthly ARR bridge from Jul 2024 to current period including gross new expansion contraction and churn, This is the single highest-value input for the recommendation and scenario range, Request CFO pack plus board KPI deck before any IC memo]
      - [Debt package, Principal amount spread maturity covenant levels security package and latest compliance certificate, The MR01 filing proves leverage exists but does not show whether equity risk is modest or material, Obtain executed debt documents and lender reporting package]
      - ['FY2025 / FY2026 financial statements', Readable sponsor-era P&L balance sheet cash flow and budget-versus-actual analysis, Public filings exist but are practically unusable in open extraction and investors still need operating truth, Request audited statements or management accounts in data-room format]
      - [Cap table and waterfall, Ownership by Thoma Bravo funds management rollover preferences debt ranking and any co-invest structures, Value at exit can diverge sharply from enterprise value if the stack is complex, Request legal cap-table summary and waterfall model]
      - ['Cloud / Cado monetization', Attach rate ACV uplift churn delta and pipeline evidence for cloud-forensics products, Bull-case upside depends on proving Darktrace is more than a legacy NDR story, Ask product / sales ops for cohort-level attach and win-rate data]
      - [Leadership and exit plan, Permanent CEO plan board incentives and sponsor exit thinking for 2027-2029, Governance stability is now part of the valuation discount not a side issue, Request board materials management retention plan and banker / sponsor exit options review]
    notes: >-
      The diligence list is intentionally short and gating. Each ask closes a valuation variable that is
      currently driving the track rather than buy recommendation.
    claimRefs: [CV008, CV009, CV010, CV011, CV015, CV018, CV032, CV044, CV048]
figures:
