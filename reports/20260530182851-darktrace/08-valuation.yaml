          detail: Actual take-private valuation
        - label: Base low
          value: 7.6
          detail: 8.0x on ~$0.95B ARR
        - label: Base high
          value: 10.0
          detail: 10.0x on ~$1.0B ARR
        - label: Bull low
          value: 13.2
          detail: 12.0x on ~$1.1B ARR
        - label: Bull high
          value: 16.1
          detail: 14.0x on ~$1.15B ARR
    approximationNotes: >-
      Bars are scenario markers, not a forecast curve. They combine assumed ARR and exit multiple pairs to
      show how quickly value changes once retention, growth, and market appetite move.
    claimRefs: [CV001, CV002, CV003, CV036, CV037, CV038, CV039]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Bull, base, and bear value ranges relative to Darktrace's $5.3B sponsor entry.
    data:
      items:
        - label: Bear
          low: 4.0
          mid: 5.0
          high: 6.0
          detail: NRR below 100%, platform pressure, and leverage drag
        - label: Base
          low: 7.5
          mid: 8.5
          high: 9.5
          detail: Moderate compounding with no major re-rating
        - label: Bull
          low: 11.0
          mid: 12.5
          high: 14.0
          detail: Cloud / forensics monetization plus a healthier exit market
    approximationNotes: >-
      Ranges show enterprise-value outcomes implied by the scenario table. They are intentionally wide because
      sponsor-era financials are not publicly current.
    claimRefs: [CV036, CV037, CV038, CV039]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: Scorecard of the dimensions that matter most for Darktrace's investability today.
    data:
      items:
        - label: ARR at close ($M)
          value: 782.2
          max: 1200
          note: Scaled enough for a real exit conversation
        - label: Gross margin (%)
          value: 89.3
          max: 100
          note: Still premium software economics in the last public period
        - label: Net ARR retention (%)
          value: 106.6
          max: 120
          note: Above-100% retention is the core support for the base case
        - label: Customers
          value: 9735
          max: 10000
          note: Large installed base reduces existential product risk
        - label: Disclosure quality
          value: 1
          max: 5
          note: Weakest KPI because sponsor-era statements and debt terms are opaque
        - label: Governance stability
          value: 2
          max: 5
          note: Two CEO transitions keep a real valuation discount in place
    approximationNotes: >-
      The KPI panel mixes raw metrics and judgmental scores. It is designed for investment-committee
      prioritization, not for time-series benchmarking.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV018, CV048]
callouts:
  - calloutType: strength
    title: FY2024 public economics were strong enough to justify sponsor interest
    body: >-
      Before delisting, Darktrace still looked like a scaled cyber platform with premium gross margin and
      above-100% retention rather than a distressed asset bought on hope alone.
    claimRefs: [CV004, CV005, CV006]
  - calloutType: risk
    title: Debt exists, but the public record still cannot size it
    body: >-
      The Goldman charge proves secured leverage is in place, yet investors still cannot see principal,
      pricing, maturity, or covenant headroom from open sources.
    claimRefs: [CV010, CV011]
  - calloutType: risk
    title: XDR platformization is the main multiple-compression channel
    body: >-
      The biggest structural downside is not a collapse in cyber demand; it is Darktrace losing renewal or
      pricing power as buyers consolidate into broader platforms.
    claimRefs: [CV013, CV014]
  - calloutType: recommendation
    title: 'Upgrade path: fresh ARR, debt, and waterfall disclosure'
    body: >-
      The recommendation can move from track to buy only if management proves sponsor-era compounding and
      shows that the debt stack will not absorb too much of any future exit value.
    claimRefs: [CV032, CV035, CV044]
