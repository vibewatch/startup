          detail: '$782.2M ARR, at least $689.5M revenue, 89.3% gross margin, 106.6% NRR'
        - id: n2
          label: Real scale
          detail: 9,735 customers at FY2024 and ~10,000 customers on current company materials
        - id: n3
          label: Strategic expansion
          detail: Cado plus automated forensics keep the cloud / platform narrative alive
        - id: n4
          label: Confirmed leverage
          detail: Goldman MR01 charge proves secured debt but not quantum or covenants
        - id: n5
          label: Governance discount
          detail: Two CEO changes in the transition to private ownership
        - id: n6
          label: Category pressure
          detail: Omdia sees XDR platform consolidation pressuring standalone NDR renewals
        - id: n7
          label: Decision
          detail: Track; fair only near sponsor entry and only with private diligence rights
    approximationNotes: >-
      The flow is conceptual rather than probabilistic. It shows the evidence blocks carrying the
      recommendation and the blockers preventing a buy call.
    claimRefs: [CV004, CV005, CV007, CV010, CV013, CV015, CV016, CV018, CV032, CV034, CV035]
