  - FE002
- id: modules-and-maturity
  title: Module map and maturity
  body: |-
    Module breadth is real, but maturity is uneven. NETWORK, EMAIL, CLOUD, IDENTITY, ENDPOINT, and OT all appear as current platform modules, while SECURE AI is explicitly marked new and aimed at AI-agent, prompt, and shadow-AI risk. Cross-platform products such as Cyber AI Analyst, Forensic Acquisition & Investigation, Attack Surface Management, Proactive Exposure Management, Incident Readiness & Recovery, and Adaptive Human Defense work more like workflow overlays than standalone control planes. That packaging gives Darktrace more room to expand inside an account without abandoning its AI-led security identity.

    The maturity signal is strongest in the legacy detection surfaces and the analyst workflow. OT has gained more explicit attack-path and zero-trust language, and FAI appears to be the post-Cado expansion wedge into cloud forensics. SECURE AI is strategically important because it extends the franchise into AI governance, but public evidence today emphasizes risk framing and launch messaging more than deeply documented architecture, deployment references, or quantified adoption.
  claimRefs:
  - CE001
