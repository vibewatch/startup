  - CE039
- id: differentiation-and-roadmap
  title: Differentiation, IP, data, and roadmap
  body: |-
    Darktrace's differentiator is the combination of self-learning behavioral analytics, broad surface coverage, and automated investigation rather than a single standalone detector. The 2024 ActiveAI launch note shows the company deliberately broadening from reactive detection toward prevention, attack-path analysis, investigations, and recovery inside one AI architecture. Cyber AI Analyst's productivity framing, the OT or Xage zero-trust extension, and the Cado-backed FAI expansion all point in the same direction: Darktrace wants to be an AI-led orchestration layer around a customer's existing stack instead of only another sensor.

    Public moat evidence is good but not complete. There is at least one retained patent source around anomaly-detection methods, a broad recognition page spanning Gartner and other analyst firms, and a third-party SDK showing that the API surface is usable enough for external tooling. But independent benchmark proof remains thin. The newest roadmap signal—SECURE AI and the 2026 AI-agent survey—shows Darktrace chasing a credible new problem set, yet public evidence has not caught up to prove how durable that edge will be against platform incumbents.
  claimRefs:
  - CE006
  - CE025
  - CE027
  - CE028
  - CE029
  - CE030
  - CE036
  - CE037
  tableRefs:
  - TE005
- id: trust-and-control-surface
  title: Trust, security, privacy, and quality controls
  body: |-
    Darktrace's trust surface is meaningfully stronger than a generic marketing page. The Trust Centre lists ISO 27001, ISO 27018, ISO 42001, and Cyber Essentials artifacts, and the 2026 AI-security blog ties ISO 42001 to responsible AI management. That matters because Darktrace is asking customers to trust automated investigation and response, plus newer AI-governance products, so formal control evidence is part of the product story rather than a side note. The trust surface is also supported by named support engineers and a customer portal for compliance questions.

    The main risk is not the absence of any control story; it is the gap between control messaging and deployment reality. The cloud case study shows Autonomous Response can block live SSH exfiltration, but it also documents a 718 GB exfiltration and ransomware detonation when response was not configured on affected devices. The federal page proves government ambition, yet the retained source set does not prove FedRAMP or CMMC status. Product trust is therefore good enough for serious enterprise diligence, but not complete enough to skip follow-up questions on configuration defaults, federal authorizations, and independent performance benchmarks.
  claimRefs:
  - CE023
  - CE024
  - CE026
  - CE034
  - CE035
  tableRefs:
  - TE004
