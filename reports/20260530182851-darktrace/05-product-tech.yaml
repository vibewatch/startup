chapter:
  number: 5
  title: Product & Technology
  summary: Darktrace now delivers a genuinely broad AI security platform spanning network, email, cloud, endpoint, identity, OT, forensics, MDR, and the new SECURE AI surface. Public evidence shows meaningful product maturity and trust controls, but key diligence risks remain around integration-dependent deployment, response defaults, benchmark proof, federal compliance evidence, and pricing transparency.
sections:
- id: customer-workflow
  title: Customer workflow definition
  body: |-
    Darktrace's current product is best understood as a cross-surface AI security workflow, not a point NDR appliance. The ActiveAI Security Platform groups NETWORK, EMAIL, CLOUD, OT, IDENTITY, ENDPOINT, and the new SECURE AI module inside one operating surface, then layers Cyber AI Analyst, Forensic Acquisition & Investigation, Attack Surface Management, Proactive Exposure Management, Incident Readiness & Recovery, and Adaptive Human Defense on top. That breadth matters because the buyer promise is to reduce tool handoffs: collect behavior from multiple environments, investigate automatically, respond surgically, recover faster, and then harden the environment.

    Official pages and the 2024 ActiveAI launch coverage imply a customer path of detect, investigate, respond, recover, and harden. Cyber AI Analyst is the investigation engine, Autonomous Response is the action layer, FAI and services help recover and understand scope, and PREVENT or ASM features feed pre-breach hardening. Darktrace's roughly 10,000-customer installed base suggests this workflow is commercially real, but the newest extension—SECURE AI—still has thinner public technical proof than the network, cloud, email, and endpoint surfaces.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE008
  - CE015
  tableRefs:
  - TE002
