  evidenceGaps:
  - type: missing-source
    severity: material
    topic: federal-compliance
    missingEvidence: A retained FedRAMP Marketplace or government artifact proving whether Darktrace Federal is authorized, in process, or only aligned to federal controls.
    whyItMatters: Federal positioning is part of the trust story, and a buyer cannot convert mission-resilience messaging into procurement certainty without an authoritative compliance artifact.
    diligencePath: Fetch the official FedRAMP Marketplace listing or another government-controlled status page and anchor any claim to that artifact rather than to marketing copy.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: benchmark-proof
    missingEvidence: Independent benchmark or evaluation data comparing Darktrace detection quality or analyst-efficiency outcomes against close peers.
    whyItMatters: Recognition pages and customer reviews show momentum, but they do not prove that Darktrace's AI workflow outperforms comparable NDR or XDR alternatives.
    diligencePath: Request customer benchmark studies, retained third-party test results, or analyst evaluations with methodology rather than award badges alone.
    relatedQuestionRefs:
    - QE028
  - type: private-evidence-only
    severity: material
    topic: module-pricing
    missingEvidence: A current price card or at least packaged list pricing that shows module-level or bundle-level commercial structure.
    whyItMatters: Public review anecdotes establish only that the product can be expensive; they do not let an investor underwrite upsell logic, gross margin by module, or customer entry price.
    diligencePath: Request live pricing sheets, partner rate cards, and three recent deal examples by segment and deployment size.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: response-defaults
    missingEvidence: A current deployment guide or admin reference that states the default Autonomous Response setting and the prerequisites for live blocking.
    whyItMatters: The documented ransomware case shows that configuration choices are product-critical, so buyers need to know whether protection defaults conservative or active in a fresh deployment.
    diligencePath: Request current admin documentation or a product walkthrough that shows default response modes, approval gates, and per-surface prerequisites.
    relatedQuestionRefs:
    - QE030
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: cado-integration
    missingEvidence: A post-acquisition architecture brief that shows exactly which Cado capabilities are natively embedded in FAI and which remain loosely coupled.
    whyItMatters: Strategic fit is visible, but the investment case changes if FAI is still a bolted-on workflow instead of a deeply integrated platform service.
    diligencePath: Request release notes or solution architecture material dated after the acquisition closing that maps inherited Cado functions into the Darktrace console and workflow.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE005
