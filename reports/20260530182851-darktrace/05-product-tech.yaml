- id: architecture-and-dependencies
  title: Architecture and dependency map
  body: |-
    Darktrace's public architecture is telemetry-led and integration-heavy. AWS materials describe cloud deployment via lightweight host agents or traffic mirroring plus API logs, while the integrations surface ties Darktrace into Azure Sentinel, Splunk, ServiceNow, Microsoft Graph Security API, AWS Lambda, Slack, Jira, Okta, Palo Alto, and Xage. Cyber AI Analyst sits above those feeds, correlating Darktrace alerts and third-party signals into investigations, while Autonomous Response and partner actions enforce policy or containment.

    That makes the architecture flexible, but it also concentrates dependency risk. Product value depends on customers exposing the right telemetry, maintaining identity, cloud, firewall, and ticketing integrations, and deciding how much automated response they permit. The FAI or Cado layer and the third-party SDK show a real automation and investigation surface, yet the retained public material still stops short of giving buyers a detailed reference architecture, resilience SLOs, or hard proof of how every module behaves when integrations degrade.
  claimRefs:
  - CE009
  - CE010
  - CE015
  - CE017
  - CE018
  - CE019
