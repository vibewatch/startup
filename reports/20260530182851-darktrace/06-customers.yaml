- id: named-customer-proof
  title: Named customer proof and evidence quality
  body: |-
    Darktrace's strongest current customer proof is the 2026-era customer-story set rather than its older public-company marketing. The retained stories are clearly production-stage, not speculative pilots: Technologent runs Darktrace internally while also reselling it; Biomerics describes email-threat prevention in a regulated manufacturing setting; NCG uses the platform across seven colleges; Okayama Kyokuto Hospital expanded from proof of value into full monitoring for clinical operations; Cogne shows network, OT, and email usage in a 24/7 industrial setting; CCBN ties Darktrace / EMAIL to a million-plus monthly emails; and Tokai Kyowa operates autonomous response in a logistics environment with only two security staff. That breadth gives real confidence that Darktrace is paid and used across materially different operational environments.

    Proof quality is still uneven. Several stories include quantified or highly specific outcomes: NCG says investigations fell from weeks to minutes, Cogne discloses traffic, IP, investigation, and hours-saved metrics, and Tokai Kyowa publishes an explicit 80% anomaly-response threshold. Others are more qualitative, emphasizing earlier detection, less analyst strain, or better resilience. Independent review platforms corroborate live product use and recurring complaints, but they do not independently verify the headline customer-story outcomes. The result is a proof set that is commercially credible and fresh, yet still mostly company-mediated rather than independently reproduced.
