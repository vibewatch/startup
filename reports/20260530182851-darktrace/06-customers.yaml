  rows:
  - - Buyer / payer
    - Senior security and IT leadership, including CISO, CTO, CIO, and IDS leadership
    - Technologent CISO; Lake Macquarie CTO; Okayama CIO; NCG IDS lead
    - Supports enterprise-budget and board-level security spend
    - No disclosed mix by function, ACV, or procurement owner
  - - Primary user
    - Lean security teams, analysts, IT administrators, and partner SOC workflows
    - Biomerics IT team; NCG security lead; Cogne SOC collaboration; Tokai two-person team
    - Explains why automation, alert triage, and visibility dominate the proof set
    - No user-seat or daily-active denominator
  - - Verticals
    - Healthcare, education, local government, manufacturing / OT, logistics, beverages, reseller-customer hybrid
    - Biomerics; Okayama; NCG; Lake Macquarie; Cogne; Tokai; CCBN; Technologent
    - Shows demand is not dependent on a single niche
    - No ARR or customer mix by vertical
  - - Geography
    - North America, UK, continental Europe, Japan, and Australia in named proofs
    - Technologent, NCG, Cogne, Okayama, Tokai, CCBN, Lake Macquarie
    - Indicates real international relevance beyond the UK home market
    - No regional ARR or renewal split
  - - Size / economic center
    - Upper-midmarket to enterprise, with FY2024 average ARR per customer near $80k
    - FY2022-FY2024 public filings plus current stories from hospital, council, industrial, and Fortune-1000-adjacent accounts
    - Suggests a diversified installed base rather than a pure mega-account model
    - Average ARR masks distribution and seven-figure deal concentration
  - - Channel / procurement
    - Direct plus VAR, MSP/MSSP, consultancy, distributor, and federal/public-sector routes
    - Partners page; MSSP announcement; Technologent; Darktrace Federal
    - Expands reach and lowers adoption friction in some segments
    - No public channel revenue share or partner concentration data
  notes: Segmentation is based on retained current customer pages, industry spotlights, and partner materials as of 2026-05-30. Economic weighting by segment is not publicly disclosed.
