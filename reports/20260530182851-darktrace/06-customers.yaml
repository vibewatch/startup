    nodes:
    - id: discover
      label: Discovery
      detail: CISO, CIO, CTO, or security lead identifies visibility or response gaps in email, network, OT, or regulated environments.
      tone: neutral
    - id: prove
      label: Proof of value
      detail: Darktrace and partners commonly run a 30-day or four-week proof of value to surface unseen anomalies and build trust.
      tone: positive
    - id: deploy
      label: Initial deployment
      detail: Accounts usually begin in NETWORK or EMAIL and validate behavior-driven detection before widening autonomy.
      tone: positive
    - id: operate
      label: Operational trust
      detail: Lean teams rely on autonomous investigation and response to shrink manual workload and make security board-visible.
      tone: positive
    - id: expand
      label: Expansion
      detail: Customers add OT, email, managed services, partner SOC workflows, or policy-driven autonomous response once trust is established.
      tone: positive
    - id: reference
      label: Renewal / reference
      detail: The strongest public proofs become named reference stories, but public renewal economics remain undisclosed.
      tone: neutral
