- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Existing-customer expansion
    - FY2024 update says significant new ARR still came from the installed base
    - Supports land-and-expand economics even as growth moderates
    - Request module attach, price uplift, and upsell contribution by cohort
  - - Module-led embed
    - Current stories layer NETWORK or EMAIL into autonomous response, OT visibility, board reporting, and managed services
    - Improves switching cost and account durability
    - Ask for retention by module count and by first-product family
  - - Partner / MSSP route
    - Darktrace offers 30-day proof of value, MSSP packaging, and reseller support; Technologent is both reseller and user
    - Can widen reach but may hide end-customer concentration behind partners
    - Request channel-sourced ARR mix and top-partner exposure
  - - Public-sector motion
    - Darktrace Federal and government materials show a separate regulated-market path
    - Adds strategic logo value and budget diversity
    - Request federal, state, and local revenue mix plus procurement route by account
  - - Top-customer concentration opacity
    - No retained public source discloses largest-customer or top-10 ARR share
    - Prevents formal downside underwriting on customer concentration
    - Request top-1, top-5, top-10 ARR share and standard contract length
  - - Post-buyout freshness gap
    - No public NRR or churn update beyond June 2024
    - Makes current durability and expansion economics hard to verify
    - Request FY2025/FY2026 customer-count, retention, and expansion bridge
  notes: Expansion evidence is credible, but concentration evidence is not. The public record proves deployment breadth more clearly than revenue concentration or renewal concentration.
