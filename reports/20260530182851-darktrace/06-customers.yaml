- id: adoption-trajectory
  title: Adoption trajectory and public scale signals
  body: |-
    Darktrace's last public reporting window shows real scale, but also a growth profile that is now partially frozen in time. Customer count rose from 7,437 in FY2022 to 8,799 in FY2023, 9,232 at H1 FY2024, and 9,735 at FY2024. ARR over the same span moved from roughly $514 million to $628 million, then $702 million at H1 FY2024 and $782 million at FY2024. That combination implies both continued new-logo acquisition and better monetization of the installed base, with average ARR per customer increasing from about $69,000 in FY2022 to about $80,000 by FY2024. The trend is not explosive by late-stage security-software standards, but it is hard to dismiss as superficial logo inflation.

    The adoption caveat is freshness. Current company pages now say 10,000 customers, which only implies about 265 net adds versus the last audited-style public baseline. Darktrace's own FY2024 update also said it still drove significant new ARR from existing customers, suggesting the commercial model remained expansion-capable even as headline growth moderated. But after the take-private, the public record stops giving investors the quarter-by-quarter customer and retention bridge they would normally want. So the evidence supports a large and still-growing installed base, while also confirming that the pace and quality of growth after June 2024 are no longer externally visible.
