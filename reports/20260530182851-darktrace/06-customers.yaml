- id: retention-and-durability
  title: Retention, satisfaction, and durability
  body: |-
    Public durability evidence is solid up to the take-private and thin after it. Across the last four public checkpoints, Darktrace reported gross ARR churn of 6.5%, 6.8%, 6.6%, and 6.3%, with net ARR retention of 105.5%, 104.7%, 105.0%, and 106.6%, respectively. Those figures show a business that kept net retention above 100% throughout the period while slowly improving gross churn back toward the mid-6% range. H1 FY2024 RPO of $1.254 billion, explicitly tied to multi-year contracts, reinforces that Darktrace had real contractual visibility rather than purely short-term transactional demand.

    Independent satisfaction evidence is positive but not clean. PeerSpot and TrustRadius users consistently praise detection, autonomous response, and support, which supports the idea that deployed customers find real operational value. At the same time, those same review surfaces repeatedly mention high pricing, licensing inflexibility, false positives, tuning effort, and interface complexity. Historical G2 reviews show the same themes existed long before the take-private. The net judgment is that Darktrace looked durable on reported metrics through FY2024, but the public record does not let an investor confirm whether that durability persisted into FY2025 and FY2026 because no current cohort, renewal, or churn bridge is public.
  claimRefs:
