  evidenceGaps:
  - id: EGU001
    type: missing-source
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-1, top-5, and top-10 customer revenue share, standard contract length, and cohort retention under sponsor ownership.
    whyItMatters: Logo breadth does not prove revenue diversification. Without concentration and cohort data, downside underwriting remains incomplete.
    diligencePath: Request customer concentration schedules, renewal cohorts, and contract-length distribution from management or the data room.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - id: EGU002
    type: missing-source
    severity: material
    topic: current-retention-data
    missingEvidence: FY2025 and FY2026 NRR, GRR, churn, and customer-count bridge after the October 2024 take-private.
    whyItMatters: The public record proves pre-buyout durability but cannot confirm whether those economics persisted after private ownership began.
    diligencePath: Request post-buyout board materials or lender-quality KPI packages covering customer growth and retention.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - id: EGU003
    type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-scope
    missingEvidence: A full exported customer-story library with timestamps and outcome fields for every live and archived public logo.
    whyItMatters: The current /customers surface is strong enough to prove deployment breadth, but it is not a complete historical registry of every public customer story.
    diligencePath: Export the live sitemap plus archived customer-story inventory and reconcile it to the visible /customers grid.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU014
    relatedTableRefs:
    - TU003
  - id: EGU004
    type: missing-source
    severity: material
    topic: segment-mix
    missingEvidence: Revenue or customer mix by vertical, geography, channel, and ACV band.
    whyItMatters: Segment breadth is clear categorically, but not economically. Without mix data, it is impossible to know which segments actually drive ARR or renewals.
    diligencePath: Request ARR, logo count, and churn by vertical, geography, and channel for the latest two fiscal years.
    relatedQuestionRefs:
    - QU003
    - QU004
    - QU005
    relatedTableRefs:
    - TU001
  - id: EGU005
    type: access-blocked
    severity: minor
    topic: public-procurement-detail
    missingEvidence: A usable public-award export from G-Cloud or Contracts Finder that shows individual Darktrace awards and values.
    whyItMatters: Government motion is visible, but public procurement pages retained in this run do not by themselves prove award-level concentration or spend.
    diligencePath: Re-run procurement discovery with award-level filters or request customer references with public-sector contract values.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
