  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的经济相关市场既不是全部安全支出，也不只是一笔传统 NDR 设备预算。当前产品页显示，平台围绕网络、身份、云和邮件检测展开，并叠加 AI
              主导的调查和定向自主响应；因此，纳入的支出池是这些攻击面上的遥测驱动检测与响应，而不是通用防火墙、GRC 套件、纯 IAM 管理，或咨询占比很高的服务。网络页面仍清楚划出核心边界：Darktrace 把 NDR
              定位为 EDR、SIEM 和防火墙栈的补充，这说明公司常常作为既有安全架构中的新增层或替换层获胜，而不是完整控制平面替代品。相邻支出也重要，因为 Darktrace 还可以通过合作伙伴、MSP 和 MSSP
              触达同一需求，把网络和邮件监控打包进托管服务。实际边界因此从狭义 NDR 延伸到更宽的 AI 主导检测与响应流程；主要现状替代品仍是 SIEM 优先检测、端点中心套件、传统邮件网关和手工 SOC 分诊。TM001
              捕捉了这条支出边界及其排除项。
