      - number: '6.3'
        title: 具名客户证明与证据质量
        blocks:
          - type: paragraph
            body: >-
              Darktrace 当前最强的客户证明不是旧的上市公司营销材料，而是 2026 年前后的客户故事集。留存故事明显处于生产阶段，不是猜测性试点：Technologent 内部运行
              Darktrace，也转售该产品；Biomerics 描述了受监管制造场景下的邮件威胁预防；NCG 在七所学院使用平台；Okayama Kyokuto Hospital
              从价值验证扩展到临床运营的全面监控；Cogne 展示了 24/7 工业场景中的网络、OT 和邮件使用；CCBN 把 Darktrace / EMAIL 绑定到每月百万级邮件；Tokai Kyowa
              只有两名安全人员，却在物流环境中运行自主响应。这样的宽度让人更有信心相信，Darktrace 在差异很大的运营环境里确实有人付费、有人使用。


              证据质量仍不均衡。有几篇故事给出了量化或高度具体的结果：NCG 称调查时间从数周降到数分钟，Cogne 披露流量、IP、调查和节省工时指标，Tokai Kyowa 公布了明确的 80%
              异常响应阈值。其他故事更偏定性，强调更早发现、降低分析师压力或提升韧性。独立评论平台能佐证产品正在使用，也能佐证反复出现的抱怨，但它们不会独立验证客户故事的核心结果。因此，这组证明商业上可信且新鲜，但多数仍由公司居中呈现，而不是由第三方复现。
