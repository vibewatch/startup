    approximationNotes: 柱形只是情景标记，不是预测曲线。每根柱将假设 ARR 与退出倍数配对，说明留存、增长和市场胃口一变，价值会多快重估。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 相对于 Darktrace $5.3B 收购方入场价的乐观、基准、悲观价值区间。
    data:
      items:
        - label: 悲观
          low: 4
          mid: 5
          high: 6
          detail: NRR 低于 100%，平台压力叠加杠杆拖累
        - label: 基准
          low: 7.5
          mid: 8.5
          high: 9.5
          detail: 温和复合增长，但没有大幅重估
        - label: 乐观
          low: 11
          mid: 12.5
          high: 14
          detail: 云 / 取证变现，加上退出市场转暖
    approximationNotes: 区间展示情景表隐含的企业价值结果。区间刻意拉宽，因为收购方持有期的财务数据没有公开更新。
    claimRefs:
      - CV036
      - CV037
      - CV038
