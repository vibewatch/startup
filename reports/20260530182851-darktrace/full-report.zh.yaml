      - number: '4.3'
        title: 资本充足性、资方杠杆信号与公私可见度差异
        blocks:
          - type: paragraph
            body: >-
              公司概况已经覆盖 Darktrace 的历史融资脉络；财务部分更相关的问题，是 October 2024 私有化后还剩哪些公开证据。官方收购材料对核心对价很清楚：安排方案于 1 October 2024
              生效，Bidco 取得全部已发行股本，股东有权在一笔估值约 $5.3 billion 的交易中获得每股 $7.75 现金。随后监管通知显示法院批准、生效、FTSE
              删除和交易所取消。这些事实足以锚定估值背景，也证明公开市场披露在退市时结束。


              交割后更有意思的信号是杠杆。Companies House 备案历史显示，截至 30 June 2025 年度的完整账目已在 March 2026 提交，December 2025 的 MR01
              担保登记也已登记。该担保 PDF 把 Goldman Sachs Bank USA
              列为担保方，并称该工具包含固定抵押、覆盖公司全部财产或经营的浮动抵押，以及负面承诺。这是本章最强公开信号，说明资方控股期融资包含有担保义务，而不是纯股权持有。但它离投资者需要的信息仍差很远：本次审阅的公开文件没有披露债务本金、定价、摊销、契约比率、非受限现金或现金跑道。即使
              2025 账目 PDF 成功抓取，本轮也没有产出机器可读的财务文本，因此账目存在是公开事实，提取出的内容却仍不可实际使用。结果是，公开记录确认杠杆和文件存在，但不能支持对当前流动性做判断。
