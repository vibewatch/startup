  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 衡量 Darktrace 当前可投资性的关键维度评分卡。
    data:
      items:
        - label: 交割时 ARR（$M）
          value: 782.2
          max: 1200
          note: 规模足以支撑认真讨论退出
        - label: 毛利率（%）
          value: 89.3
          max: 100
          note: 最后一个公开期仍体现高质量软件经济性
        - label: 净 ARR 留存率（%）
          value: 106.6
          max: 120
          note: 高于 100% 的留存是基准情景的核心支撑
        - label: 客户数
          value: 9735
          max: 10000
          note: 庞大存量客户基数降低产品生存风险
        - label: 披露质量
          value: 1
          max: 5
          note: 最弱 KPI：收购方持有期报表和债务条款都不透明
        - label: 治理稳定性
          value: 2
          max: 5
          note: 两次 CEO 交接让估值折价仍无法消除
    approximationNotes: KPI 面板混合原始指标和判断性评分，服务于投委会排序优先级，不用于时间序列对标。
