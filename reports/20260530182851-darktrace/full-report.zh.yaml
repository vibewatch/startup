      - number: '8.2'
        title: 当前融资与进入纪律
        blocks:
          - type: paragraph
            body: >-
              最干净的估值锚仍是 2024 年 10 月赞助方入场。按最后公开的 FY2024 数字，Thoma Bravo 支付约 $5.3 billion，意味着约 6.8x ARR 和 7.7x 收入。相对
              Darktrace 已披露的经济性，这不算冒进：业务还在增长，毛利率仍接近 90%，留存高于 100%。问题在于交割之后发生的一切。Companies House 确认 FY2025
              法定账目已提交，但开放网络提取结果几乎是空白。2025 年 12 月 MR01 文件也证明存在杠杆，并点名 Goldman Sachs Bank USA
              为担保贷款人，但公开记录仍不披露本金、定价、期限或契约水平。因此，进入纪律必须简单。新投资者应把 2024 年赞助方价格视为公允价值上限，直到管理层提供当前 ARR 桥、更新留存、当前 EBITDA / FCF
              和债务包。没有这些项目，更高定价就是为不透明付溢价，而不是为已证明的改善付钱。
