      - number: '1.2'
        title: 创始人、领导层与治理交接
        blocks:
          - type: paragraph
            body: >-
              Darktrace 公开确认最扎实的创始团队，是 Nicole Eagan 和 Jack Stockdale，两人仍出现在官方简介页面上。Nicole Eagan 的头衔是联合创始人兼战略顾问；Jack
              Stockdale 是创始 CTO，负责支撑平台的贝叶斯模型和 AI 算法。把这两份简介与 Summit Partners 对 Cambridge 信号处理能力、GCHQ
              相关起源的历史叙述放在一起，可以支撑一个真实的技术创始故事；不过，公开来源仍未完全厘清完整创始人名单或初始股权分配。


              当前更大的问题是领导层连续性。Investegate 和 Business Chief 确认，联合创始人 Poppy Gustafsson 于 September 2024 卸任 CEO，由 Jill
              Popelka 接任。随后 Darktrace 和 Thoma Bravo 又在 27 January 2026 确认第二次交接：Popelka 卸任，董事会主席 Charles Goodman 出任临时
              CEO，董事会启动正式 CEO 搜索。约十六个月内压缩了两次 CEO 更替，第一轮完整 PE 持有周期里的治理和执行敏感度因此上升。


              Companies House 记录显示，董事变动一直延续到 March 2026，但公开来源仍无法给出完全透明的私有公司董事会和委员会图景。这一点重要，因为 Darktrace
              现在要按资方支持下的执行能力来评判，而不是按公开市场叙事管理来评判。直接结论是：Darktrace 保留了强技术创始连续性，但最上层运营领导班子正在交接，继任规划、决策权和资方董事会对齐都需要直接尽调。
