      - number: '2.2'
        title: 多视角规模测算：广义 TAM、受限 SAM、未经验证 SOM
        blocks:
          - type: paragraph
            body: >-
              已发布的市场数字支持多个有效视角，而不是一个干净 TAM。MarketsandMarkets 估计，网络安全 AI 市场将从 2026 年的 $25.53 billion 增长到 2031 年的 $50.83
              billion；其 XDR 视角则把更窄的平台预算放在 2025 年的 $7.92 billion 和 2030 年的 $30.86 billion。Mordor 给出了最贴近 Darktrace
              根基的窄楔子：网络流量分析在 2026 年为 $4.91 billion，到 2031 年为 $8.29 billion。这些数字不能相加：AI 网络安全数字包含与 XDR、云和身份预算的重叠，而 NTA/NDR
              是子细分，不是可以直接叠上去的独立池子。因此，最可防守的公开 SAM，是围绕 Darktrace 覆盖攻击面的证据约束综合，大约 $8 billion 到 $12 billion，而不是整个广义 AI 网络安全
              TAM。任何 SOM 估计都更弱，因为私有化后的公开收入和细分组合数据缺失。FM001 和 FM002 保留了这种边界敏感性，没有硬凑一个虚假的点估计。
