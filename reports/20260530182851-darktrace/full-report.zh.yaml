      - number: '4.4'
        title: 财务结论、收入质量审查与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Darktrace 在收入质量上筛起来不错，在公开可判断性上则弱一些。正面逻辑很具体：经常性多年合同基础、H1 FY2024 超过 $1.25 billion 的 RPO、约 89%
              毛利率、收购前为正的自由现金流，以及最后公开 ARR 截面 $782.2 million。这些不是财务脆弱供应商的标记。它们说明 Darktrace
              进入私有所有权时已有实质规模、高毛利能力，并有能力自筹相当一部分运营投入。


              警示在于，剩下的未知项正好是资方所有权下最重要的项目。July 2024 交易限制把最终 FY2024 EBITDA 和 FY2025 指引从公开记录中移除。December 2025 Goldman
              担保登记证实存在有担保融资，但没有披露规模。公开来源也不披露实际定价、直销与渠道组合、当前净留存、现金、债务服务或契约余量。收入质量审查也并未完全结束：EY 的 2023
              年审查覆盖渠道合同、营销支出、合同退出条款、设备部署、递延收入相关控制、ARR 计算和第三方关系，并得出已识别错误不构成重大影响的结论；但 Yahoo 和 The Register 显示，会计问题和 Mike
              Lynch
              阴影仍影响外部感知。因此，正确结论是：历史软件经济性有利，但当前杠杆和流动性不完整。严肃承保仍需要当前管理账、债务文件、从报价到收款的抽取数据，以及队列级留存和毛利率衔接表，才能把资方控股期资本结构视为已理解。
