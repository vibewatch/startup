  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Darktrace 留存客户证据指向的是可重复的企业级和受监管市场买方，而不是消费化或 SMB 主导的打法。决策者通常是资深安全或 IT 管理层：当前故事引用了 Technologent 的 CISO、Lake
              Macquarie City Council 的 CTO、Okayama Kyokuto Hospital 的 CIO，以及 Cogne 和 NCG 的安全或 IDS
              负责人。日常使用则落在精简安全团队、分析师或合作伙伴 SOC 身上，他们需要网络和邮件工作流的持续可见性。这个分工很重要，因为它说明价格重心更接近中大型企业和企业级安全预算，而不是低接触的部门支出。


              垂直行业和地域组合也足够分散，值得关注。当前具名参考覆盖医疗、教育、地方政府、工业制造、物流、饮料，以及一个经销商兼客户的混合角色；公司材料也明确面向金融服务、医疗、政府和国防、教育、制造和零售销售。留存证据集的地域覆盖北美、英国、欧洲大陆、日本和澳大利亚。渠道是主线，不是事后补充：Darktrace
              公开通过 VAR、MSP/MSSP、咨询公司和分销商销售，并为美国公共部门业务保留单独的联邦附属实体。缺口在经济层面，而不是品类层面，因为公开来源仍不披露按细分市场、地区或渠道拆分的收入结构。
