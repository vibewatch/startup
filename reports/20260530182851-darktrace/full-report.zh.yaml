            body: >-
              Darktrace 的公开架构由遥测驱动，并且高度依赖集成。AWS 材料描述，云部署可通过轻量主机代理或流量镜像加 API 日志完成；集成页面则把 Darktrace 接入 Azure
              Sentinel、Splunk、ServiceNow、Microsoft Graph Security API、AWS Lambda、Slack、Jira、Okta、Palo Alto 和 Xage。Cyber
              AI Analyst 位于这些数据流之上，把 Darktrace 告警和第三方信号关联成调查；Autonomous Response 和合作伙伴动作则执行策略或遏制。


              这种架构带来灵活性，也集中依赖风险。产品价值取决于客户暴露正确遥测，维护身份、云、防火墙和工单集成，并决定允许多少自动化响应。FAI 或 Cado 层以及第三方 SDK
              展示出真实的自动化和调查界面；但保留公开材料仍没有给买方足够细的参考架构、韧性 SLO，或每个模块在集成退化时如何表现的硬证据。
