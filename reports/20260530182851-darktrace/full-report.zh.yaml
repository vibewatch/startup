  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Darktrace 仍有可信投资案例，因为最后一次完整披露的运营快照足够强，看起来像一个有规模、能盈利的网络安全平台，而不是投机性 AI 故事。到 2024 年 6 月，公司 ARR 达到 $782.2
              million，收入至少 $689.5 million，毛利率 89.3%，净 ARR 留存率 106.6%，客户数 9,735；当前公司材料仍指向约 10,000 家客户、110 个国家和超过 2,300
              名员工。正向逻辑是，Thoma Bravo 买到的是一个真实平台：品类宽度存在，借 Cado 扩展云取证，留存质量也足以支撑未来以更高估值退出。反向逻辑是，让 Darktrace
              适合被赞助方收购的那些属性，现在都藏在私人所有权后面。公开记录显示了杠杆、赞助方过渡窗口中的两次 CEO 更替、残余会计阴影折价，以及 Omdia 认为独立 NDR 续约受到 XDR 平台整合挤压的观点。这让
              Darktrace 落在“可投但无法定价”的桶里：战略上相关，但没有新的私人数据，就难以高置信度投资。
