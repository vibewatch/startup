      - number: '8.4'
        title: 情景分析与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              情景区间很宽，因为 Darktrace 有可能长成高得多的退出价值，但方差主要由 PE 持有期的隐藏变量决定。乐观情景下，Darktrace 到 2029 年把 ARR 复合增长到 $1.1 billion
              以上，把净留存稳稳守在 105% 以上，货币化 Cado 和云取证，并受益于更开放的网络安全 IPO 或战略买方市场；这可以支撑约 $11-14 billion 的价值，相当于 2024 年入场价略高于 2x
              的总价值。基准情景下，ARR 增长到约 $1.0 billion，并以约 8-10x ARR 退出，产生约 $7.5-9.5 billion。悲观情景下，NDR 平台压力加剧，净留存跌破
              100%，债务限制投资，治理不确定性持续；价值可能压缩到 $4-6 billion，接近或低于入场价。加权后的教训是，Darktrace 仍有上行，但当前公开记录无法证明足够边际，不能让人有信心买入这份上行。
