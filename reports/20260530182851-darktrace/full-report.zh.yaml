  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 指标日期
      - 价值指标
      - 隐含倍数 / 估值
      - 为什么重要
      - 局限
    rows:
      - - Darktrace 私募入场
        - 2024 年 10 月交割 / 2024 年 6 月经营基准
        - $5.3B EV，对应 $782.2M ARR 和 $689.5M 收入
        - ~6.8x ARR；~7.7x 收入
        - 最好的当前纪律硬锚点，因为这是最后一笔真实控制权价格交易
        - 对新投资者仍已滞后，因为私募控股期债务和经营趋势未披露
      - - SailPoint 2026 年公开市场
        - 2026 年 5 月 CompaniesMarketCap 快照
        - $10.68B 市值，对应 $1.07B TTM 收入
        - ~10.0x 市值 / 收入
        - 可作为 Thoma Bravo 网络安全软件先例，观察重新上市的私募资产能交易到什么水平
        - 身份安全比独立 NDR 更直接受当前公开市场青睐
      - - Palo Alto Networks 2026 年公开市场
        - 2026 年 5 月 CompaniesMarketCap 快照
        - $228.45B 市值，对应 $9.89B TTM 收入
        - ~23.1x 市值 / 收入
        - 如果 Darktrace 做出更宽套件经济性，它代表平台安全的估值上限
        - 规模远大于 Darktrace，业务更多元，流动性也更强
      - - CrowdStrike 2026 年公开市场
        - 2026 年 5 月 CompaniesMarketCap 快照
        - $186.06B 市值，对应 $4.81B TTM 收入
        - ~38.7x 市值 / 收入
        - 说明市场会给最强 AI 原生上市网络安全复利资产多高定价
        - 增长快得多，披露也强于 Darktrace，因此它是上行上限，不是直接可比对象
      - - SailPoint 私募入场
        - 2022 年 8 月私有化收购
        - $6.9B 全现金交易
        - 仅作估值参考
        - 证明 Thoma Bravo 愿意持有规模化安全资产，也能打出后续重估路径
        - 现有来源未提供该收购可直接佐证的 ARR 或收入倍数
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public comparables and sponsor precedents supported by retained
