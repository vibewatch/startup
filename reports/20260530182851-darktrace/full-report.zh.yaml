  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序与投资逻辑破裂框架
        blocks:
          - type: paragraph
            body: >-
              Darktrace 最高的剩余风险，不是公司缺少产品宽度或客户证明；真正的问题是，PE 持有期的不透明让外界很难判断增长质量、治理质量和产品质量是否仍足以支撑带杠杆的 PE
              所有权结构。公开记录现在把三件事推到最前面。第一，EY 复核之后，2023 年会计攻击已不再是活跃欺诈论点，但公开记录仍看不到 FCA 或 FRC 的公开结案。第二，收购后的财务和治理可见度薄得多：IR
              网站现在只是档案，最清晰的存续融资证据是 2025 年 12 月 Goldman Sachs 押记，其中包含固定押记、浮动押记和负面承诺表述。第三，运营质量仍是真实承销变量，因为即使 Darktrace
              继续深入云取证、AI 防护和广泛伙伴集成，评论仍在提示定价升级、调优工作量和界面复杂度。因此，本章的投资逻辑破裂标准集中在正式监管行动、契约压力、又一次 CEO 更替，或私人运营数据显示净留存跌破 100%。
