      - number: '4.2'
        title: 单位经济、毛利率驱动因素与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的公开单位经济披露，输出指标强，输入指标弱。输出端，公司披露的毛利率持续很高：FY2022 为 89.2%，FY2023 为 89.8%，H1 FY2024 为 89.3%；同时 FY2022
              产生 $99.5 million 自由现金流，FY2023 为 $93.8 million。这些是强软件化经济性，也解释了为什么 Darktrace 进入私有所有权时是运营强势，而不是救助融资。H1 FY2024
              增加了更多层次：收入同比增长 27.4%，调整后 EBITDA 利润率达到 25.6%，RPO 超过 $1.25 billion。公开层面，这是积压订单、转换和高毛利的强组合。


              但成本结构的变化，让历史利润率外推并不简单。Darktrace 称 H1 FY2024 S&M 和 G&A 占收入比例下降，但也指出部分客户成功经理和渠道合作伙伴成本被重新归类到 S&M，同时 R&D
              现金用工成本增加 15.3%。更早的 FY2023 披露还解释，佣金计划改为 100% 预付销售佣金，短期提高现金流出，并重置调整后 EBITDA
              呈现方式。因此，公开记录足以推断强毛利经济性，但不足以完整建模全口径 CAC、销售生产率、渠道抽成率或资方控股期贡献利润率。最好的公开代理指标只能是方向性的：June 2024 时每客户 ARR 约 $80
              thousand；按不同员工数截面，每员工收入约 $287 thousand 到 $300 thousand；留存保持在 100% 以上。但经典 SaaS 效率输入仍是私有信息。
