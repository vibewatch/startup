  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户流程定义
        blocks:
          - type: paragraph
            body: >-
              Darktrace 当前产品最好理解为跨攻击面的 AI 安全流程，而不是单点 NDR 设备。ActiveAI Security Platform 把
              NETWORK、EMAIL、CLOUD、OT、IDENTITY、ENDPOINT 和新的 SECURE AI 模块放进一个运营界面，再叠加 Cyber AI Analyst、Forensic
              Acquisition & Investigation、Attack Surface Management、Proactive Exposure Management、Incident Readiness &
              Recovery 和 Adaptive Human Defense。这个宽度重要，因为买方承诺是减少工具交接：从多个环境收集行为、自动调查、精准响应、更快恢复，然后加固环境。


              官方页面和 2024 ActiveAI 发布报道暗示，客户路径是检测、调查、响应、恢复和加固。Cyber AI Analyst 是调查引擎，Autonomous Response 是动作层，FAI
              和服务帮助恢复并理解影响范围，PREVENT 或 ASM 功能则为泄露前加固提供输入。Darktrace 约 10,000 家客户的安装基础说明，这条流程在商业上真实存在；但最新延伸——SECURE
              AI——公开技术证据仍比网络、云、邮件和端点攻击面更薄。
