      - number: '8.3'
        title: 可比分析与估值立场
        blocks:
          - type: paragraph
            body: >-
              可比分析支持的结论是，Darktrace 在赞助方入场时估值合理，并不明显便宜。按简单市值 / 收入代理口径，公开网络安全龙头的交易水平远高于 Darktrace 2024 年入场价：CrowdStrike 接近
              38.7x 收入，Palo Alto 接近 23.1x，SailPoint 接近 10.0x。这些数字让 Darktrace 7.7x
              收入入场看起来保守，但只是表面保守。公开同行披露更新鲜、公开流动性价值更强，PE 持有期不透明也更少。SailPoint 是最好的赞助方案例：Thoma Bravo 在 2022 年以约 $6.9 billion
              收购它，现在其公开市值超过 $10 billion，说明 Thoma Bravo 可以在多年持有期里让有规模的安全资产重估。即便如此，Darktrace 不是
              SailPoint。它的直接品类承受更多平台压力，当前债务未知，治理路径明显更不稳定。因此，本章落点是接近 2024 年入场价的合理立场，而不是今天有吸引力的立场。
