  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - ARR 桥和质量
        - 2024 年 7 月至当前期间的月度 ARR 桥，包括新增总额、扩张、收缩和流失
        - 这是建议和情景区间里价值最高的单一输入
        - 任何 IC 备忘录前，先索要 CFO 材料包和董事会 KPI 材料
      - - 债务包
        - 本金金额、利差、到期日、契约水平、担保包和最新合规证书
        - MR01 文件证明杠杆存在，但未说明股权风险是温和还是重大
        - 取得已签署债务文件和贷方报告包
      - - FY2025 / FY2026 财务报表
        - 可读的私募控股期 P&L、资产负债表、现金流和预算对实际分析
        - 公开备案虽存在，但公开提取几乎不可用，投资者仍需要经营真相
        - 索要数据室格式的审计报表或管理账
      - - 股权结构和分配瀑布
        - Thoma Bravo 基金持股、管理层滚投、优先权、债务排序及任何共同投资结构
        - 如果资本堆栈复杂，退出时股权价值可能与企业价值大幅背离
        - 索要法律股权结构摘要和分配瀑布模型
      - - 云端 / Cado 变现
        - 云端取证产品的加挂率、ACV 提升、流失变化和管线证据
        - 牛市上行取决于能否证明 Darktrace 不只是旧 NDR 故事
        - 向产品 / 销售运营索要分群级加挂和胜率数据
      - - 领导层和退出计划
        - 永久 CEO 方案、董事会激励，以及 2027-2029 年私募退出思路
        - 治理稳定性现在是估值折价的一部分，不是旁支问题
        - 索要董事会材料、管理层留任计划，以及投行 / 私募退出选项评估
    notes: 尽调清单刻意保持短而卡点。每一项要求都在关闭一个估值变量；这些变量当前支撑的是跟踪，而非买入建议。
