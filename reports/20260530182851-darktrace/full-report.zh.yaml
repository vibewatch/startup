      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: Darktrace 仍有真实产品切入优势
            body: Darktrace 不只是另一个 SIEM 附加项。保留证据仍支持一个真实切入点：自学习检测、快速建立本地行为基线，以及调优后的自动化动作。在不信任签名驱动的“足够好”网络分析的账户里，这一点最重要。
