      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的扩张路径由模块驱动，而不是由席位驱动。当前客户证明通常从网络或邮件可见性开始，再延伸到自主响应、OT 可见性、董事会报告或托管服务。Darktrace 自己的 FY2024 更新称，现有客户仍贡献了可观新
              ARR；合作伙伴计划也显示，价值验证、经销商支持和 MSSP 打包能帮助账户从初始部署走向更广采用。Technologent
              尤其有启发，因为它既是渠道伙伴也是用户，说明商业扩张既可以来自生态信誉，也可以来自直接产品增购。


              更难的问题是集中度，公开证据没有回答。没有留存来源披露头部客户占比、合同期限或队列留存，因此无法证明 Darktrace 的客户基础在收入上足够分散，还是只是 logo
              数量看起来很宽。公共部门动作也可见但不可量化：Darktrace Federal
              存在，政府资源存在，也能跑采购搜索，但留存公开采购页面仍没有给出干净的授标级集中度图景。再加上收购后披露下滑，以及声誉审查仍可能在尽调中浮现的反向提醒，结论就是：扩张故事可信，但集中度问题仍未关闭。
