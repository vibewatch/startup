      - number: '1.4'
        title: 从创立到平台扩张的里程碑
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的公开里程碑记录显示，公司走过三个清晰阶段：Cambridge 技术形成期、公开市场扩张期，以及私有化之后的平台扩展期。当前公司材料强调长期 R&D 投入、超过 200
              项申请构成的专利资产，以及多攻击面安全平台，而不是单一网络产品。Summit Partners 的历史叙述进一步说明，最初切入点是一种新型 AI 方法，来自 Cambridge
              信号处理人才和接近政府情报体系的专业能力。


              目前披露的私有化后最重要战略动作，是 January 2025 拟收购 Cado Security。Darktrace 称，Cado 将把云调查和响应覆盖扩展到多云、容器、无服务器、SaaS 和本地环境。到
              September 2025，Darktrace 推出了自动化取证能力，并明确把该发布与 Cado 收购相连，称调查时间可从数天降至数分钟。这在战略上重要，因为它显示 Thoma Bravo
              时代的资本正投向更深的云调查流程，而不只是增量模块刷新。


              私有化后，负责任 AI 信息也继续更新。Darktrace 在 2025 年发布白皮书，描述其负责任 AI 框架，并称该框架与 NIST AI RMF、EU AI Act 和 OECD AI principles
              对齐。这不能消除商业或治理风险，但确实说明 Darktrace 仍在投入企业 AI 采用所需的制度脚手架。总体看，里程碑图景是一家公司借私有所有权加深平台深度，同时试图守住公开市场时期建立的 AI 可信度。
