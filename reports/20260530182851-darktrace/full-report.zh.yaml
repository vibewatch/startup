            body: >-
              模块宽度真实存在，但成熟度不均。NETWORK、EMAIL、CLOUD、IDENTITY、ENDPOINT 和 OT 都是当前平台模块；SECURE AI 则明确标为新模块，瞄准 AI 智能体、提示词和影子 AI
              风险。Cyber AI Analyst、Forensic Acquisition & Investigation、Attack Surface Management、Proactive Exposure
              Management、Incident Readiness & Recovery 和 Adaptive Human Defense 等跨平台产品，更像流程覆盖层，而不是独立控制平面。这种打包方式让
              Darktrace 能在账户内扩张，同时不放弃 AI 主导安全的身份。


              成熟度信号在传统检测攻击面和分析师流程上最强。OT 已获得更明确的攻击路径和零信任语言；FAI 看起来是 Cado 之后向云取证扩张的切入点。SECURE AI 有战略重要性，因为它把业务延伸到 AI
              治理，但今天的公开证据更多强调风险框定和发布信息，而不是深度记录的架构、部署参考或量化采用。
