          note: Breadth is a core product promise.
        - label: 集成与上下文
          detail: API、流量镜像、主机代理、SIEM、SOAR、工单和 IAM 连接器丰富并规范化事件。
          note: Partner depth is essential to product quality.
        - label: 调查 AI
          detail: Cyber AI Analyst 关联告警，调查全告警工作流，并汇总事件上下文。
          note: This is Darktrace's most explicit automation claim.
        - label: 响应控制
          detail: Autonomous Response 和合作伙伴执行点会阻断、隔离或限制可疑活动。
