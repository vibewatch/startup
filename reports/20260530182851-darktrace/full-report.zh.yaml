      - number: '2.5'
        title: 尽调缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              两个矛盾应保持明示。第一，公开市场估计差异很大，因为它们描述的是不同边界：$25.53 billion 的 AI 网络安全视角、$7.92 billion 的 XDR 平台视角，以及更窄的 $4.91
              billion NTA/NDR 楔子同时存在，简单相加会夸大 Darktrace 的真实机会。第二，公司在向买方销售宽泛的 AI 主导平台故事，但买方仍会用更窄的 NDR
              或流程增强视角评估产品中的相当部分。仍有几项尽调缺口很重要。发现包中最强的反向来源——一篇关于 2022-2026 NDR 市场动态的 Omdia 文章——本轮返回
              404，因此无法从一手文本重新验证专家续约压力的最直接公开证据。公开可检索的独立当前评价，对定价、误报和续约摩擦也偏薄；私有公司披露又意味着当前 SOM 无法用 2025-2026
              收入数据验证。做估值时，这意味着边界纪律和管理层提供的队列证据，比任何单一已发布 TAM 标题都更重要。
