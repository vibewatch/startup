            calloutType: risk
            claimRefs:
              - CE034
              - CE035
          - type: callout
            title: 信任姿态提升快过基准验证
            body: Darktrace 现在把 ISO 42001 和传统安全认证一起公开，但独立产品性能验证仍落后于其信任面的成熟度。
            calloutType: insight
            claimRefs:
              - CE023
              - CE028
          - type: callout
            title: 要求提供 FedRAMP、定价和默认设置证明
            body: 剩余尽调最关键的问题，是索取联邦状态材料、真实打包与定价表，以及说明 Autonomous Response 在新环境中如何默认配置的部署指南。
            calloutType: recommendation
