      - number: '6.2'
        title: 采用轨迹与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Darktrace 最后一个公开报告窗口显示公司已有真实规模，但增长画像也有一部分被冻结在过去。客户数从 FY2022 的 7,437 增至 FY2023 的 8,799、FY2024 H1 的 9,232 和
              FY2024 的 9,735。同一期间 ARR 从大约 $514 million 增至 $628 million，再到 FY2024 H1 的 $702 million 和 FY2024 的 $782
              million。这个组合意味着公司既在持续获取新客户，也在更好地货币化存量客户，单客户平均 ARR 从 FY2022 的约 $69,000 提高到 FY2024 的约
              $80,000。按后期安全软件标准，这条曲线不算爆发式增长，但也很难把它否定为表面客户数膨胀。


              采用层面的保留意见在于新鲜度。公司当前页面写着 10,000 家客户，相比最后一个类似审计口径的公开基线只意味着约 265 家净增。Darktrace 自己的 FY2024 更新也称，现有客户仍贡献了可观新
              ARR，说明即使表观增长放缓，商业模型仍有扩张能力。但私有化之后，公开记录不再给投资者提供他们通常需要的逐季客户数与留存桥。因此，证据支持一个庞大且仍在增长的安装基础，同时也确认 2024 年 6
              月之后的增长速度和质量已不再对外可见。
