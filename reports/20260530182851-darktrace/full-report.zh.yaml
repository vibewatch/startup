        blocks:
          - type: paragraph
            body: >-
              Darktrace 的信任面明显强过一页普通营销稿。Trust Centre 列出 ISO 27001、ISO 27018、ISO 42001 和 Cyber Essentials 材料，2026 年 AI
              安全博客还把 ISO 42001 与负责任 AI 管理挂钩。这很关键：Darktrace 要客户相信自动化调查与响应，也要相信更新的 AI
              治理产品，因此正式控制证据是产品叙事的一部分，不是旁注。信任面还由具名支持工程师和面向合规问题的客户门户支撑。


              主要风险不是没有控制叙事，而是控制口径与部署现实之间有落差。云案例研究显示 Autonomous Response 可以阻断实时 SSH 数据外流，但同一案例也记录了受影响设备未配置响应时，718 GB
              数据外流并触发勒索软件。联邦页面证明政府市场野心，但留存来源集没有证明 FedRAMP 或 CMMC 状态。因此，产品信任足够进入严肃企业尽调，但还不足以跳过对配置默认值、联邦授权和独立性能基准的追问。
