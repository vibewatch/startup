      - number: '3.4'
        title: 切换成本、锁定效应、多家并用与分销权力
        blocks:
          - type: paragraph
            body: >-
              Darktrace 确实有真实切换成本，但它们不同于套件厂商的锁定效应。TrustRadius 评论者描述，Darktrace
              达到完整识别模式前需要一个学习期，也描述了基线建立后的自动化动作。这意味着替换不只是拆掉一个传感器：客户还需要重新训练另一套系统，并重建运营人员已经信任的响应逻辑。这是真实嵌入价值，尤其在开启自主或半自主响应的场景里。[CP030][CP031][CP042]


              问题是，Darktrace 通常是多家并用，而不是垄断。Microsoft Sentinel 设计为吸收广泛第三方数据，Cisco XDR 销售开放集成和网络主导防御，Splunk 仍是统一 TDIR
              控制平面。因此，Darktrace 往往与 SIEM、端点和身份工具共存，而不是彻底替代它们。多家并用降低了整体替换风险，但也限制钱包份额，并让平台整合故事更危险：Microsoft
              可以利用现有合同，CrowdStrike 可以通过 Falcon Flex 扩宽，Palo Alto 可以在专家进入最终采购清单前拦截 QRadar
              迁移。[CP011][CP012][CP014][CP016][CP018][CP043]


              分销权力是本章最清楚的不对称。Cisco 现在拥有 Splunk，IBM 明确把 SaaS 迁移导向 XSIAM，Microsoft 已经占据身份和日志预算，CrowdStrike
              越来越多销售平台扩张而非独立模块。Darktrace
              仍有合作伙伴覆盖，但在这个比较里，它是较小的控制平面。最好的防御，是变得足够运营不可或缺，让买方即便整合也继续保留它。如果这种不可或缺性偏弱，Darktrace
              就可能变成别人安全运营栈里一个受尊重的第二信号。[CP006][CP018][CP020][CP021][CP043][CP045]
