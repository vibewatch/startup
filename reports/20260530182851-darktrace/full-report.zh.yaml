      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的公开材料显示，主要经济买方仍是安全高管或面向董事会的安全预算负责人，但运营推动者通常更接近
              SOC、身份团队或云运维团队。公司的客户证据集中在高校、医院、工业制造商、地方议会，以及其他运营连续性风险较高的组织；网络页面还明确面向中小企业、企业、政府和关键基础设施。这意味着买方地图由企业和受监管账户主导，而不是消费者或极小企业。采用路径也有多条：合作伙伴和
              MSSP 可以把 Darktrace 打包进 MDR 风格产品，直接部署则往往从价值验证开始，团队信任流程影响后再扩展到邮件、身份或云。身份部署尤其跨职能，因为 Darktrace 把它们同 SSO、AD
              和账户控制动作绑定在一起。实践中，用户是分析师或响应人员，评估者是安全运营或检测工程负责人；付款方可能是
              CISO、CIO，或共享安全平台预算，取决于购买触发因素是威胁压力、合规，还是工具整合。TM003、FM003 和 FM004 映射了这些关系。
