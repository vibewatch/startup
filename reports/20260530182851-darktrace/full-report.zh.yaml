        - 历史上市公司现金生成能力和大型客户存量
        - 当前债务规模、定价和期限未知
        - 在确定仓位信心前要求贷款材料，并重切下行假设
      - - 商业压缩
        - 私有 NRR、流失和价格实现数据
        - NRR 低于 100%、总流失率高于约 8%，或大客户大规模降购潮
        - FY2024 公开留存仍高于 100%，客户群庞大
        - 退市后公开数据已经过时
        - 立即重做收入增长和杠杆承受能力测算
      - - 平台依赖与竞争重叠
        - 失去联合销售资格、API 弃用，或客户可见的合作伙伴替代
        - 重大 AWS 或 Microsoft 集成被降级、弃用，或被原生工作流取代
        - 深度联盟和既有工作流集成
        - 合作伙伴也可能变成替代平台
        - 下调增长假设，并要求伙伴贡献销售管线证据
      - - 领导层 / 关键人不稳定
        - 再次 CEO 重置或 Jack Stockdale 离职
        - 12 个月内任何 CEO 更替，或 CTO 离任且看不到继任梯队
        - 临时连续性和成熟技术创始人
        - Darktrace 已经承受多次高层交接
        - 升级治理尽调，并重新审视执行假设
      - - 产品质量或新模块失手
        - 新 AI 与取证产品面的评价恶化、重大宕机或客户可见事件
        - 持续评价下滑，或任何与新产品面相关的重大客户事件
        - 负责任 AI 原则、广泛平台能力和既有支持打法
        - 最新产品面的大规模公开证明仍有限
        - 在审阅事后复盘和队列质量数据前，推迟高确信度测算
    notes: 能用公开记录衡量的地方，投资逻辑破裂条件都尽量设成可量化；不能量化的地方，则绑定离散披露事件。目标不是证明 Darktrace 今天不可投，而是界定哪些具体信号会推翻增长加杠杆的投资测算。
