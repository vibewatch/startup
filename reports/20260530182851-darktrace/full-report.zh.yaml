      - number: '3.3'
        title: 能力、定价、GTM 与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的能力逻辑，在买方看重行为网络深度、以及基于本地基线而非纯关联告警的响应时最强。当前 AI 安全页面仍把产品放在签名和规则方法的对立面；TrustRadius 评论也确认，Darktrace
              会先学习环境数周，再进入更完整的识别和自动化动作。Vectra 在同一行为检测叙事上最接近；Corelight 则代表相反哲学：开放遥测和开放分析，而不是封闭的自学习 AI
              引擎。[CP002][CP003][CP019][CP030][CP031][CP039]


              商业姿态更混合。在保留集合中，Microsoft 是唯一清楚发布定价机制的厂商，披露了承诺层级以及数据湖与分析定价，这让它在预算对话中有结构性优势。CrowdStrike、Palo
              Alto、Cisco/Splunk、Darktrace 和 Vectra 多数通过企业包装语言、评论证据或套件代理指标出现，而不是公开价目表。评论数据表明，在部分交易中 Vectra 价格可能低于
              Darktrace，尽管两者都被视为昂贵的企业产品；Darktrace 评论者则提到年度涨价和谈判必要性。信任姿态也分化：CrowdStrike、SentinelOne、Palo
              Alto、Microsoft、Cisco 和 IBM 定期发布当前运营指标和路线图语言，而 Darktrace
              现在只能通过更薄的私有公司披露界面来判断。[CP004][CP006][CP007][CP009][CP011][CP013][CP015][CP016][CP028][CP029][CP030]


              这道披露缺口重要，因为在受监管账户中，信任本身就是竞争的一部分。套件厂商可以把产品主张与季度披露、公开泄露叙事、合作伙伴生态和迁移优惠绑定。Darktrace
              仍可凭产品体验或自主响应获胜，但在规模、当前合同或附加率的公开证据密度上，目前无法匹配同等水平。在一个走向平台理性化的市场里，买方理解的“信任”往往既包括技术有效性，也包括披露、迁移确定性和商业可预测性。[CP018][CP030][CP041][CP043][CP045][CP046]
