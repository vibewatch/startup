  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代地图
        blocks:
          - type: paragraph
            body: >-
              Darktrace 竞争的市场，比独立 NDR 更宽，又比“全部网络安全”更窄。直接同业仍很清楚：Vectra、ExtraHop，以及程度稍弱的
              Corelight，都在争夺同一笔网络主导检测预算；PeerSpot 的 May 2026 截面显示，Darktrace、Vectra 和 ExtraHop
              聚在一个正在收缩的心智份额池里，而不是分属不同类别。Darktrace 自己最后公开规模点仍有意义：ARR 为 $782.2 million，客户 9,735 家；但这个足迹现在明显小于那些越来越定义企业 SOC
              采购的数十亿美元级公开套件厂商。[CP001][CP026][CP027]


              更重要的战略对手，是能把预算讨论向上重定向的平台存量厂商。CrowdStrike FY2026 末 ARR 为 $5.25 billion，SentinelOne FY2026 末 ARR 超过 $1.1
              billion，Palo Alto Networks 在 fiscal 2025 退出时 Next-Generation Security ARR 为 $5.6 billion。Microsoft
              Sentinel、Cisco XDR 加 Splunk，以及 IBM QRadar 也很重要，因为它们锚定现状和既有数据平面。实践中，Darktrace 不再只是对抗另一台 NDR
              设备；它在对抗一个更宽的主张：安全团队应购买一个统一运营平台，覆盖端点、身份、日志和响应流程。[CP004][CP007][CP009][CP011][CP015][CP016][CP017][CP018][CP044]


              这张更宽地图还包括相邻路径和替代路径。Nozomi 拿住偏 OT 的侧翼，Corelight 代表开放 NDR 和内部自建倾向，Google 收购 Wiz 则把多云安全平台延伸到相邻检测与响应地带。Omdia 的
              2026 观点是关键反向证据：随着统一 XDR 平台拿到份额，独立 NDR 出现了更多不续约和替换。正确的竞争版图因此横跨直接同业、存量厂商、相邻专家、手工 SIEM
              现状、内部自建，以及可能更快扩展控制平面的潜在进入者。[CP018][CP032][CP033][CP035][CP039][CP040][CP044][CP048]
