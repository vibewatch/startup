chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Darktrace 是一家总部位于 Cambridge, United Kingdom 的网络安全公司。公司称自己自 2013 年起就在构建 AI 原生安全模型。当前公司页面把业务定位为全球网络安全 AI
              厂商，并列出主要运营足迹：Cambridge、New York、London 和 Singapore；核心研究在 Cambridge，第二个 R&D 中心设在 The
              Hague。英国研究根基叠加全球销售落地很关键，因为这同时锚定了 Darktrace 的技术身份，也支撑了它长期声称自己是差异化的欧洲网络安全 AI 平台，而不是单一产品设备商。


              当前平台叙事很宽：Darktrace 称 ActiveAI Security Platform 覆盖云、邮件、身份、运营技术、端点和网络安全，并由 200 多项专利和待批申请支撑。同一页面还称公司服务 110
              个国家的 10,000 家客户，与数百家合作伙伴合作，并与 AWS 和 Microsoft 建立深度联盟。这些规模标记说明，Darktrace 已不只是 NDR 专家；它现在把自己包装成一个多攻击面、企业级 AI
              安全平台，拥有全球客户基础，也对齐超大规模云厂商。


              另一层重要背景是披露姿态。Darktrace 的投资者关系网站现在明确表示，公司是 Thoma Bravo
              持有的历史档案，而不是活跃的公开市场报告界面。这意味着，当前运营事实更多来自公司营销页面和最后一次公开交易更新，而不是持续的上市公司文件。尽调层面，Darktrace 的核心身份强且一致，但 October
              2024 私有化之后，当前指标的证据基础明显变薄。
