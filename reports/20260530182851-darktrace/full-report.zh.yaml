      - 为什么重要
      - 反向论点
      - 什么会改变判断
    rows:
      - - FY2024 经营质地达到私募可投标准
        - ARR、利润率、留存和客户数说明，这是真软件资产，不只是 AI 叙事
        - 这些指标截至 2024 年 6 月，投资者无法验证私有化后质量是否守住
        - 提供 2024 年 7 月以来按月 ARR、NRR、流失、EBITDA 和现金数据
      - - Darktrace 仍有平台宽度和客户规模
        - 近 10,000 家客户，加上最新云端 / 取证产品发布，让公司仍能进入买方和退出市场视野。
        - Omdia 称，平台套件正在挤压独立 NDR 的续约模式和定价权。
        - 证明云端 / 取证加挂和交叉销售正在抵消 NDR 单点压缩。
      - - Cado 和 ActiveAI 带来核心 NDR 之外的上行空间
        - 云端取证可抬高 ACV，并扩大对战略买家的关注度
        - 公开记录尚未证明变现加挂率或整合成功
        - 披露 Cado 相关销售动作的管线转化和 ARR 贡献
      - - 已有私募控股先例
        - Thoma Bravo 已把 SailPoint 大规模私有化，并受益于后续重估
        - 如果债务、治理或市场结构更弱，Darktrace 未必能复制同样结果
        - 证明领导层稳定、杠杆受控，并在退出窗口前恢复增长
      - - 会计问题已不再是仍在发酵的欺诈论点
        - EY 未发现对过往报表有重大影响，降低了生存性下行风险
        - 争议从未完全淡出公开记录，剩余来源折价仍在
        - 提供 EY 报告、监管往来函件和干净的私募控股期审计包
