            body: >-
              最强的悲观证据，不是 Vectra 或 ExtraHop 突然在功能上超过 Darktrace，而是 Microsoft、CrowdStrike、Palo Alto
              Networks、Cisco/Splunk，以及 IBM 支持的迁移，可以把购买对话转向 Darktrace 不掌握的合同和控制平面。
            calloutType: risk
            claimRefs:
              - CP018
