      - number: '3.2'
        title: 竞争对手画像、规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              画像表把核心规模不对称摊开。CrowdStrike、Microsoft、Palo Alto Networks 和 Cisco/Splunk 拥有更深披露、合作伙伴杠杆和更大软件收入基础，Darktrace
              目前无法在公开层面匹配。CrowdStrike 的 FY2026 业绩和 Falcon 平台表述，给出了这个模型最清晰的版本：统一合同和遥测基础，可从端点扩展到身份、SaaS 和更宽的 AI 保护。Palo
              Alto 通过 XSIAM 从 SIEM 侧采用同一逻辑，Cisco 则从网络基础设施延伸到基于 Splunk 的
              TDIR。[CP004][CP005][CP006][CP009][CP010][CP014][CP015][CP016]


              直接专家更有层次。Vectra 仍是最接近的同类对手，因为它围绕网络、身份和云营销行为检测，引用 39 项 AI 专利，并继续借 Gartner 和 GigaOm 认可证明品类领导力。ExtraHop
              即使没有公开财务披露，仍会真实进入买方评估清单；Corelight 也重要，因为它把开放 NDR 方法商业化，服务那些宁愿自己拥有遥测和分析层的组织。Nozomi
              处于相邻而非直接替代位置：当关键基础设施、工业网络或运营韧性要求主导采购动作时，它的 OT 和 IoT
              深度最重要。[CP019][CP022][CP024][CP025][CP026][CP027][CP035][CP036][CP037][CP039]


              Darktrace 自身位置因此尴尬但仍有价值。它比多数私有纯 NDR 同业更大、更宽，但披露更少，合同嵌入程度也弱于平台厂商。公司以自学习
              AI、异常驱动检测和响应自动化做差异化；但越来越多时候，它卖进的账户真正采购决策是：在 Microsoft、CrowdStrike、Palo Alto、Cisco 或 IBM
              之上，是否还值得给另一个专家预算。因此，战略方向和当前功能对等同样重要：赢家往往是最能控制买方既有运营模式的厂商，而不是异常检测故事最好的厂商。[CP001][CP002][CP003][CP019][CP041][CP045]
