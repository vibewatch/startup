      - number: '1.5'
        title: 反向检查、诉讼与披露缺口
        blocks:
          - type: paragraph
            body: >-
              即使已经私有化，Darktrace 仍背着需要重视的声誉包袱。City A.M. 记录了 2023 年重新出现的做空压力；Yahoo Finance 则报道，Mike Lynch 于 2024 年去世后，由于其与
              Darktrace 的历史关联和更广泛的 Autonomy 事件，公司再次受到审视。CNBC 另报道称，EY 审查只发现少量合同错误和不一致，且没有任何事项对 Darktrace
              财务报表构成重大影响；这有帮助，但抹不掉做空运动留下的市场记忆。


              法律风险也需要跟踪。PacerMonitor 显示，Gatekeeper Solutions v. Darktrace 于 December 2025 从 Texas Eastern 转至 Northern
              District of California；PatSnap 随后报道，该事项在 early 2026 被有终局效力地驳回，双方各自承担费用。结果看起来有利，但专利诉讼曾经存在，仍强化了对 Darktrace
              IP 姿态和诉讼准备金假设做尽调的必要性。


              更直接的尽调旗帜在当前数据质量。Darktrace 的关于页面仍展示一段归于 “Poppy Gustafsson OBE, CEO” 的引用，尽管她已在 September 2024 离任；Tracxn 的
              April 2026 员工数估计为 2,591，也与 Darktrace 官网 2,300+
              的说法冲突。两点都不足以推翻核心投资逻辑，但都提示私有化后披露环境里，事实可能滞后或相互偏离。判断估值或杠杆假设前，投资者应直接核对员工数、董事会组成和资方持股，而不能只依赖公开摘要。
