      - number: '1.3'
        title: 资本结构与私有市场重估
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的决定性资本事件，是 Thoma Bravo 的私有化收购。Darktrace 和 Thoma Bravo 均表示，交易于 1 October 2024 完成，公司估值约 $5.3
              billion，并以每股 $7.75 现金支付股东。Thoma Bravo 还表示，Darktrace 停止在 London Stock Exchange 交易，并将从 FTSE 100
              退市。这笔交易是目前最干净的估值锚，也给今天的阶段分类提供了正确参照：Darktrace 现在是一家 PE 支持的私有网络安全平台公司。


              私有化前最后一次宽口径公开运营截面来自 FY2024 经营更新。Financial Times Markets 和 Quartr 都复现了关键数字：截至 30 June 2024，ARR 为 $782.2
              million，收入至少 $689.5 million，客户 9,735 家，总 ARR 流失率为 6.3%，ARR 净留存率为 106.6%。这些指标说明，Darktrace
              进入私有所有权时，是一个具备规模、走向盈利增长的软件资产，客户广度实质存在，留存经济性也在改善。


              公开来源没有给出的部分同样重要：交割后的准确股权结构表、Thoma Bravo 持股比例、管理层滚存，以及累计新股融资额均未在本次审阅材料中披露。IR
              网站已经成为档案，新融资披露大概率要等下一次交易才会出现。尽调视角下，Darktrace 因此像是一家高质量、资方持有的平台公司，最后公开截面很强；但所有权机制和当前现金生成细节现在都藏在私有墙之后。
