      - number: '7.6'
        title: 人员 / 执行风险与缓释
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的执行风险集中在领导层更替、关键人深度和披露纪律上。公开过渡公告和后续报道显示，继任路径被压得很紧：Poppy Gustafsson 于 2024 年 9 月卸任，Jill Popelka
              随后在 2026 年 1 月卸任；董事会寻找继任者期间，Charles Goodman 出任临时 CEO。BusinessCloud 的反向叙事把赞助方控制问题说得很直白，称 Popelka
              仅十六个月后就被私募股权所有者逼走。与此同时，核心技术可信度仍高度绑定创始 CTO Jack Stockdale，他的资料明确把他与支撑平台的贝叶斯模型和 AI 算法相连。这不意味着 Darktrace
              缺少梯队深度，但意味着投资案例仍异常依赖少数人。当前公开记录还给出一个较软但重要的警示信号：公司页面仍把一段 Poppy
              引语标注为“CEO”，而其他页面使用的员工数又略有不同。这些都不能证明运营失败，但确实说明，收购后的治理和信息卫生需要主动尽调，不能被动信任。
