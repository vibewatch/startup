      - number: '6.4'
        title: 留存、满意度与持久性
        blocks:
          - type: paragraph
            body: >-
              公开持久性证据在私有化前很扎实，之后就变薄。最近四个公开检查点中，Darktrace 披露的总 ARR 流失率分别为 6.5%、6.8%、6.6% 和 6.3%，净 ARR 留存率分别为
              105.5%、104.7%、105.0% 和 106.6%。这些数字显示，公司在整个期间把净留存守在 100% 以上，同时把总流失率缓慢改善回 6% 中段。FY2024 H1 的 RPO 为 $1.254
              billion，并明确关联多年合同，这进一步说明 Darktrace 拥有真实合同可见性，而不只是短期交易型需求。


              独立满意度证据正面，但不干净。PeerSpot 和 TrustRadius
              用户持续称赞检测、自主响应和支持，支持了已部署客户能获得真实运营价值的判断。与此同时，同一批评论页面反复提到高定价、授权不灵活、误报、调优工作量和界面复杂度。历史 G2
              评论显示，这些主题在私有化很久之前就已经存在。净判断是：截至 FY2024，Darktrace 在报告指标上看起来有持久性，但公开记录无法让投资者确认这种持久性是否延续到 FY2025 和
              FY2026，因为当前队列、续约或流失桥都不公开。
