      - number: '5.4'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              云中心环境中的部署看起来快于传统纯网络上线。Darktrace 称 CLOUD 可在五分钟内从云端部署，并支持多租户、混合和无服务器资产；ENDPOINT 则与现有 EDR
              并行工作，而不是替代它。同时，从业者证据仍描述异常收敛前需要学习期，且当 Autonomous Response
              依赖网络位置或防火墙集成时会有拓扑约束。换句话说，产品在旧式设备意义上并不重，但仍要求客户认真设计遥测和响应。


              服务层部分抵消了这项负担。Darktrace 现在销售 24/7/365 全球接力 SOC 支持、MDR，以及横跨网络、云、SaaS 和 OT
              的分诊协助。这让精简团队更容易消费平台，但不能替代集成质量。公开评论来源对定价、支持响应速度和集成成熟度仍然评价不一。买方因此应把 Darktrace 视为可部署、可扩展，但并非无摩擦。
