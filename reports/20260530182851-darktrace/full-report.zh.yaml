      - number: '7.5'
        title: 财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              财务模型风险是 Darktrace 最重要的问题之一，正因为公开记录现在不完整。收购价很清楚：Thoma Bravo 的公开材料把交易定在约 $5.3 billion、每股
              $7.75。不清楚的是，企业现在背了多少杠杆、契约要求是什么，以及当前 ARR、流失率和自由现金流转换是否仍健康到足以支撑这套结构。IR 网站明确告诉投资者它只是历史档案，Companies House
              线索只确认 2025 年账目已提交，以及 2025 年 12 月存在一项 Goldman Sachs 押记。MR01
              文件有信息量但仍不完整：它确认有固定押记、浮动押记和负面承诺特征的担保债务，却不披露本金、利率、期限或契约阈值。这让投资者只能依赖代理信号。评论网站仍显示定价摩擦和运营者负担；如果业务净留存高于
              100%，这些问题也许可以承受，但如果 PE 持有期的增长再加速失败，它们会很快变危险。因此，杠杆投资逻辑取决于公开来源已经无法提供的私人运营数据。
