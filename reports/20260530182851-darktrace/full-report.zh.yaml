  - id: TV001
    title: 推荐摘要表
    columns:
      - 维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 战略相关性看得见，但资方接手后的业绩和债务仍不透明
        - 在管理层开放资料室或价格更清楚反映不透明性之前，先跟踪，不投入资金
      - - 置信度
        - 中
        - 最后一份公开快照较强，但核心的交割后输入仍缺失
        - 证据足以设定纪律，但不足以发出买入建议
      - - 风险评级
        - 高
        - 杠杆已确认；治理不稳定；NDR 整合是真问题。
        - 先测算下行，再看上行；一旦留存下滑，投资逻辑会迅速破裂。
      - - 估值立场
        - 只有接近 2024 年资方入场价才算合理，高于该价则偏高
        - 入场时 ~6.8x ARR / ~7.7x 收入相对披露的 FY2024 质量显得克制，但考虑不透明性，并不明显便宜。
        - 没有当前 ARR、债务和股权结构表可见度，不应向资方标记支付溢价。
      - - 入场纪律
        - 价格敏感，且以尽调通过为前提
        - 公开记录只能支持把 $5.3B 私有化收购价作为参考上限，而不能证明当前公允价值。
        - 任何投资决定前，先要求最新 ARR 桥、债务明细和分配瀑布。
      - - 目标回报门槛
        - 若要约 5 年实现 ~2.0x 总价值，需要 >$10.6B
        - 以 $5.3B 入场要做出十几个点的 IRR，必须跑出牛市或强基准情景
        - 在未知更高价格下，单靠基准情景不足以支撑投资
    notes: 本表是投资判断，不是管理层披露。建议、置信度、风险和估值立场综合公开证据，并明确惩罚私募控股期不透明度。
