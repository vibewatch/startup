  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 保留来源显示，客户工作流从检测到加固共有六步。
    data:
      nodes:
        - id: detect
          label: 检测
          type: stage
          note: 收集跨攻击面的行为，在核心模块中浮现异常。
        - id: correlate
          label: 关联
          type: stage
          note: 借助集成和共用产品界面规范化上下文。
        - id: investigate
          label: 调查
          type: stage
          note: Cyber AI Analyst 自动跑调查流程并生成摘要。
        - id: respond
          label: 响应
          type: stage
          note: Autonomous Response 和合作伙伴控制点限制恶意活动。
        - id: recover
          label: 恢复
          type: stage
          note: FAI 和服务保存证据、界定影响范围，并加快恢复。
        - id: harden
          label: 加固
          type: stage
          note: 暴露管理、ASM 和 SECURE AI 为入侵前的控制改进提供输入。
      edges:
        - from: detect
          to: correlate
