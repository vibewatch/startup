  - id: TV005
    title: 投资论点破裂与止损触发器表
    columns:
      - 触发器
      - 阈值 / 信号
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 留存破裂
        - 净 ARR 留存连续两个期间低于 100%
        - 推翻牛市和基准情景背后的复利假设
        - 在管理层证明修复前，从跟踪转为回避
      - - 债务压力显现
        - 债务明显高于 ~6x EBITDA，或契约余量偏窄
        - 私募杠杆从可管理叠加项，变成核心股权减值风险
        - 考虑入场前，先按债务优先的下行情景重建模型
      - - 治理再次失速
        - 第三次 CEO 更替，或临时领导期拉长且没有永久方案
        - 释放私募董事会不稳信号，并压低退出信心
        - 下调倍数假设，并降低退出准备度
      - - 平台压力恶化
        - 与 XDR 套件相关的不续约、套件替代或价格让步再次出现明确证据
        - 证实独立 NDR 正被结构性压缩的反向论点
        - 提高熊市情景权重，并下调终局倍数
      - - 监管或来源问题重启
        - 围绕 2023 年会计争议或后续披露质量出现新的正式行动
        - 信用折价重新进入模型，并可能突然关闭退出窗口
        - 暂停尽调，并把资本结构下行作为首要风险
      - - 退出路径停滞
        - 到 2028 年仍没有可信二级交易、战略出售或重新 IPO 准备
        - 削弱私募打法论点，并抬高持有期风险
        - 假设持有期更长，回报预期更低
    notes: 每个触发器都直接映射到估值后果：收入质量信心下降、倍数信心下降，或退出信心下降。
