      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Darktrace 规模已足够拥有真实退出可选性，但仅凭公开证据，还不够透明到可以称为退出就绪。正面逻辑很清楚：公司有公开市场历史、接近 10,000
              家客户的足迹、赞助方支持，以及仍覆盖网络、云、邮件、身份相邻工作流和自动化取证的产品叙事。负面逻辑同样清楚：公众不知道债务规模，FY2025 账目通过开放提取几乎无法使用，而且公司在转向私人所有权期间，已经从
              Poppy Gustafsson 到 Jill Popelka，再到临时 CEO Charles Goodman。这些不自动构成交易杀手，但足以定义硬性的投资逻辑破裂规则。只有当管理层能展示干净的 PE
              持有期复合增长、无威胁的杠杆画像、稳定领导层，以及更像纪律性重估而非被迫流动性事件的退出路径时，建议才会升级。在此之前，尽调应聚焦债务文件、当前 ARR 质量、股权结构经济性和云产品附加率证明。
