  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的公开收入模式，仍应理解为通过谈判合同销售的经常性企业网络安全软件，而不是透明自助定价。最强公开锚，是 Darktrace 作为上市公司选择披露的运营指标：ARR、收入、客户数、留存和
              RPO。最后一次完整公开截面显示，截至 30 June 2024，ARR 达到 $782.2 million，收入至少 $689.5 million；H1 FY2024 RPO 已达 $1.254
              billion。管理层反复称，该模式由多年合同支撑；这一点重要，因为它解释了为什么 ARR、积压订单和收入转换更慢，但可见度优于一次性交易销售。


              官方购买入口也指向销售辅助动作。Network 产品页把潜在客户引向在自身环境里的评估，Contact 页面把买方导向销售和支持渠道，合作伙伴页面描述
              VAR、MSP/MSSP、咨询和分销路径。同一合作伙伴页面向咨询伙伴宣传 30-day 价值验证，说明售前动作实质存在，获客成本也不会低，尽管公司不披露 CAC
              或回本周期。公开记录没有披露的内容同样重要：看不到官方价目表、模块级收入组合、直销与渠道拆分，也没有实际折扣数据。公开投资者可以判断一个高质量经常性模式的存在，却无法充分判断 SKU 层面的定价权。
