      - number: '7.3'
        title: 运营 / 质量 / 安全风险
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的运营风险并不主要来自已确认的公开入侵史，而是来自自动化、产品宽度和客户专属调优的组合。多处评论证据在这一点上相当一致。TrustRadius
              用户描述了令人困惑的仪表盘、困难的调优和逐年上涨的合同价格；PeerSpot 评论者进一步提到界面复杂、集成要求，以及对误报管理的抱怨；更早的 G2
              评论显示，同样的调校需求已经存在多年，并非一次性投诉。这些摩擦很重要，因为 Darktrace 技术上没有停在原地。公司一边通过 Cado 扩展云调查与响应，一边把自动化取证加入 ActiveAI
              平台，还在快速变化的攻击面上营销负责任 AI
              控制。护城河因此变宽，但必须可靠运行的产品表面也变多。若没有新的收购后队列、事件或支持指标披露，投资者必须假设：配置错误、调优不足或发布纪律薄弱，都可能直接传导为续约压力和更高服务成本。
