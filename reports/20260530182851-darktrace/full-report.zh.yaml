      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑可信。IBM 称，全球平均数据泄露成本为 $4.4 million，广泛使用 AI 做安全的组织可节省 $1.9 million；CrowdStrike 报告平均 eCrime 突破时间为 29
              分钟，来自启用 AI 的攻击者的攻击上升 89%，披露前被利用的零日漏洞增加 42%。Darktrace 自己的云和身份页面也强化了买方为何在意：其引用的 CSA 调查中，只有 23%
              的组织报告完整云可见性，79% 报告过去 18 个月至少发生过一次云泄露，身份泄露仍然解决缓慢。监管进一步放大这种压力，NIS2 把义务扩展到 18 个关键行业，SEC
              网络规则也推动上市公司更快披露事件并记录治理。约束端同样重要。自主响应成为销售话术的一部分时，AI Act 正好增加了人类监督和高风险系统义务；Palo Alto
              等平台厂商也持续把预算导向更宽套件。Darktrace 还把自己的 NDR 层定位为 SIEM、EDR 和防火墙的补充，这有利于采用，但也限制了简单整体替换的经济性。TM004 把宏观增长顺风和承保风险分开。
