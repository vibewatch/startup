      - number: '7.2'
        title: 监管 / 法律风险
        blocks:
          - type: paragraph
            body: >-
              从已审阅证据看，Darktrace 的法律与监管暴露有分量，但不明显是生死问题。关键历史问题仍是 2023 年做空攻击：Reuters 和后续英国会计报道显示，Quintessential Capital
              Management 攻击公司财务报告之后，Darktrace 聘请 EY；后来的公开摘要称 EY 没有发现欺诈证据，只识别出少量错误和不一致。这大幅降低了即时欺诈风险，但没有完全结案，因为 Darktrace
              表示会把结果提供给 FCA 和 FRC，而不是发布报告；已审阅的 2026 年期间公开材料仍未显示监管机构正式关闭。第二个法律问题是 IP：PacerMonitor 确认 Gatekeeper
              专利案移交北加州，PatSnap 报道该案在 2026 年 2 月被终局驳回。这是有利结果，但也说明 Darktrace 已经大到足以吸引专利主张。最后，Darktrace 的 AI
              原生监控模型处在收紧的政策边界内：EU AI Act、NIS2、UK ICO AI 指引和 FCA 的 AI 治理框架，都提高了它成为受监管客户可信网络 AI 供应商的成本。
