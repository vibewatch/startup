- id: financial-verdict
  title: Financial verdict, revenue-quality scrutiny, and diligence blockers
  body: "Darktrace screens well on revenue quality and less well on public underwriteability. The positive case is tangible: a recurring multi-year contract base, RPO over $1.25 billion in H1 FY2024, gross margins around 89%, positive free cash flow before the buyout, and a final public ARR snapshot of $782.2 million. Those are not the markers of a financially fragile vendor. They suggest Darktrace entered private ownership with meaningful scale, high gross profitability, and the capacity to self-fund a meaningful portion of operating investment.\n\nThe caution is that the remaining unknowns are precisely the ones that matter most under sponsor ownership. July 2024 deal restrictions removed final FY2024 EBITDA and FY2025 guidance from the public record. The December 2025 Goldman charge confirms secured financing but not its size. Public sources also do not disclose realized pricing, direct-versus-channel mix, current net retention, cash, debt service, or covenant headroom. Revenue-quality\
    \ scrutiny is also not fully dead: EY's 2023 review examined channel contracts, marketing spend, contract opt-outs, appliance deployments, deferred-revenue-related controls, ARR calculation, and third-party relationships, and concluded the identified errors were not material; yet Yahoo and The Register show that the accounting and Mike Lynch overhang still shape outside perception. The correct verdict is therefore favorable on historical software economics but incomplete on present-day leverage and liquidity. A serious underwriting process still needs current management accounts, debt papers, quote-to-cash extracts, and a cohort-level retention and gross-margin bridge before treating the sponsor-era capital structure as understood."
