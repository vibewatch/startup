  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: FY2025 and FY2026 management-reported revenue, ARR, churn, NRR, EBITDA, and free-cash-flow actuals.
    whyItMatters: Without current operating metrics, leverage and growth cannot be underwritten beyond the last public FY2024 snapshot.
    diligencePath: Request monthly board packs and KPI dashboards from July 2024 through the latest closed month.
    relatedQuestionRefs:
    - QI017
    - QI024
  - type: private-evidence-only
    severity: material
    topic: debt-quantum
    missingEvidence: Debt principal, pricing, amortisation, covenant ratios, and lender reporting associated with the Goldman-backed secured financing.
    whyItMatters: The existence of secured financing is public, but its burden and flexibility are not.
    diligencePath: Request executed debt agreements, compliance certificates, cap-table / debt-stack summary, and treasury reporting.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI025
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, discount ladders, contract term mix, channel take-rates, and services attachment data.
    whyItMatters: Pricing power and route-to-market margin cannot be modeled from official site pages alone.
    diligencePath: Pull quote-to-cash exports and renewal pricing waterfalls by module, region, and channel.
    relatedQuestionRefs:
    - QI004
    - QI012
    - QI024
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales-cycle duration, quota attainment, and sourced-pipeline conversion by channel.
    whyItMatters: Darktrace clearly operates a sales-led enterprise motion, but public sources do not price that efficiency.
    diligencePath: Request sales-ops dashboards and cohort analyses by direct, channel, and public-sector motions.
    relatedQuestionRefs:
    - QI006
    - QI011
    relatedTableRefs:
    - TI003
  - type: access-blocked
    severity: minor
    topic: public-pricing-benchmarks
    missingEvidence: Readable third-party pricing and review pages with contract-size benchmarks.
    whyItMatters: Open-web review surfaces could help triangulate price perception, but they were JS-blocked or incomplete in this run.
    diligencePath: Use browser capture or direct customer references to validate real contract ranges.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
