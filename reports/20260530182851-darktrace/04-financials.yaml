- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - FY2025-FY2026 revenue, ARR, NRR, churn, and customer adds
    - Blocks current growth and retention underwriting after delisting
    - Request monthly management KPI pack from Jul 2024 onward with board commentary
  - - Debt principal, pricing, covenants, and debt-service schedule
    - Blocks leverage sizing, downside modelling, and sponsor-era solvency analysis
    - Request signed debt agreements, compliance certificates, and lender reporting packs
  - - Unrestricted cash, revolver availability, and runway
    - Blocks capital-adequacy and optionality analysis
    - Request treasury report, cash waterfall, and base/downside liquidity forecast
  - - Realized pricing, discounting, and channel take-rates
    - Blocks pricing-power and route-to-market margin analysis
    - Request quote-to-cash extracts with list, net, term, renewal uplift, and channel economics
  - - Module mix and services / appliance burden
    - Blocks product-level gross-margin and revenue-quality analysis
    - Request SKU-level ARR, services revenue, appliance/support cost, and gross-margin bridge
  - - CAC, sales cycle, quota productivity, and partner-sourced efficiency
    - Blocks GTM efficiency underwriting and hiring-plan evaluation
    - Request sales-ops dashboard by direct, channel, and public-sector motions
  - - Readable post-close statutory and management accounts
    - Open-source extraction did not surface current balance-sheet numbers
    - Provide machine-readable financial statements or exports directly from finance systems
  notes: These are the minimum private data-room asks needed to turn Darktrace from a high-quality historical public snapshot into a sponsor-era underwriteable model.
