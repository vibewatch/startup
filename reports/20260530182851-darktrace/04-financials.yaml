tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value/status
  - Quality
  - Diligence ask
  rows:
  - - Core recurring platform subscription
    - Multi-year enterprise cybersecurity contracts tracked primarily through ARR
    - ARR / subscription contract
    - $782.2M ARR at 30 Jun 2024; at least $689.5M FY2024 revenue
    - High for scale; low for module mix
    - Provide revenue and ARR split by module, geography, and customer segment
  - - Existing-customer expansion
    - Upsell and cross-sell inside installed base
    - Net ARR added from existing customers
    - Management says a significant amount of ARR added still came from the existing base; exact amount not broken out
    - Medium
    - Provide expansion ARR by cohort, module attach, and gross-to-net renewal waterfall
  - - New-customer ARR
    - New logo subscriptions added through direct and partner-assisted GTM
    - Net new customers / new-logo ARR
    - 936 net new customers in FY2024; management expects new-customer ARR additions to increase through FY2025
    - Medium
    - Provide new-logo ARR, average first-year ACV, and payback by segment
  - - Partner / MSP / MSSP route
    - VAR, distributor, consultancy, MSP, and MSSP channels resell or wrap Darktrace into services
    - Partner-led deal / bundled service
    - Official route exists and includes a 30-day Proof of Value path; public revenue share is undisclosed
    - Medium
    - Break out partner-sourced ARR, partner margin, and direct-versus-channel win rates
  - - Services / implementation tail
    - Deployment, enablement, and support economics around the software sale
    - Service contract / support burden
    - Public FY2024 materials do not separately disclose services revenue or services gross margin
    - Low
    - Disclose professional-services revenue, appliance/support burden, and gross margin by service line
  notes: Public evidence is strongest on recurring subscription scale and GTM routes; module-level revenue mix and services contribution remain private.
