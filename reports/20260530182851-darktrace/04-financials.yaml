- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value
  - Public status
  - Why it matters
  - Diligence ask
  rows:
  - - Take-private headline valuation
    - $5.3B and $7.75/share cash
    - Officially disclosed
    - Anchors sponsor entry valuation and implied public-to-private reset
    - Provide internal valuation marks and any post-close equity rollovers
  - - Transaction effective date
    - 1 Oct 2024
    - Officially disclosed
    - Marks the point where regular public operating disclosure effectively ended
    - Provide post-close reporting cadence used by the board and lenders
  - - Regulatory / court close path
    - Regulatory approvals satisfied 16 Sep 2024; court sanction 24 Sep 2024; scheme effective 1 Oct 2024
    - Officially disclosed
    - Shows the timeline and completeness of the take-private process
    - Provide the full scheme document, including financing sources and any lender commitments
  - - Post-close secured financing signal
    - MR01 charge in favour of Goldman Sachs Bank USA; fixed charge, floating charge, negative pledge
    - Publicly disclosed in Companies House filings
    - Confirms secured obligations exist after the buyout
    - Provide debt amount, lenders, maturity, pricing, security package, and covenant schedule
  - - Latest statutory accounts visibility
    - Full accounts to 30 Jun 2025 filed 14 Mar 2026
    - Public filing exists, but extract was not machine-readable in this run
    - Suggests current balance-sheet data exists but is not easily exploitable from open sources here
    - Provide readable statutory accounts or management accounts with cash, debt, and P&L bridge
  - - Current debt principal / interest burden
    - null
    - Not publicly disclosed in reviewed materials
    - Leverage cannot be sized without it
    - Provide debt draw schedule, effective interest rate, amortisation, and hedging terms
  - - Current cash on hand / runway
    - null
    - Not publicly disclosed in reviewed materials
    - Liquidity sufficiency cannot be underwritten without treasury data
    - Provide unrestricted cash, revolver headroom, and downside runway model
  - - Sponsor-era investment capacity
    - Thoma Bravo said it would invest in scale and innovation, but no quantified capital plan is public
    - Qualitative only
    - Explains strategic ambition but not financing dependency
    - Provide board-approved uses of cash for product, GTM, hiring, and M&A
  notes: The public record proves that the take-private closed and secured financing exists, but it does not expose the quantum or serviceability of sponsor-era leverage.
