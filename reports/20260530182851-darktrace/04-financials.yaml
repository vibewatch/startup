  title: Financials
summary: 'Darktrace''s public financial evidence remains unusually strong for a now-private cyber company at the point of delisting: FY2024 ARR reached $782.2 million, revenue was at least $689.5 million, gross margins stayed near 89%, and free cash flow had already turned positive before the buyout. The underwriting problem is no longer commercial quality but sponsor-era opacity: the July 2024 update withheld final FY2024 EBITDA margin and FY2025 outlook, the IR site is now only an archive, and December 2025 Companies House filings show secured financing in favour of Goldman Sachs Bank USA without disclosing debt size, covenants, or current cash.'
sections:
- id: revenue-model
  title: Revenue model, pricing mechanics, and go-to-market motion
  body: "Darktrace's public revenue model is still best understood as recurring enterprise cybersecurity software sold through negotiated contracts, not through transparent self-serve pricing. The strongest public anchors are the operating metrics Darktrace chose to disclose as a public company: ARR, revenue, customer count, retention, and RPO. In the last full public snapshot, ARR reached $782.2 million and revenue was at least $689.5 million at 30 June 2024, while H1 FY2024 RPO was already $1.254 billion. Management repeatedly described the model as being underpinned by multi-year contracts, which matters because it explains why ARR, backlog, and revenue convert more slowly but with better visibility than one-off transactional sales.\n\nOfficial buying surfaces also point to a sales-assisted motion. The Network product page pushes prospects toward evaluation in their own environment, the Contact page routes buyers into sales and support channels, and the partner page describes VAR, MSP/MSSP,\
    \ consultancy, and distributor routes. The same partner page advertises a 30-day Proof of Value for consultancy partners, implying a meaningful pre-sales motion and non-trivial acquisition cost even though the company does not publish CAC or payback. What the public record does not disclose is equally important: there is no visible official price card, no module-level revenue mix, no direct-versus-channel split, and no realized discount data. Public investors could underwrite the existence of a high-quality recurring model; they could not fully underwrite pricing power by SKU."
