  - - Third-party review pricing page
    - null
    - Public review URL exists but was JS-blocked in this run
    - Could not verify any quoted price or contract benchmark from the blocked page
    - G2 pricing URL
  notes: The defensible conclusion is negotiated enterprise pricing with a sales-led Proof-of-Value motion, not transparent public SKU pricing.
