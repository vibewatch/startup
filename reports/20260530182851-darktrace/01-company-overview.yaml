- id: adverse-flags
  title: Adverse checks, litigation, and disclosure gaps
  body: 'Darktrace still carries reputational baggage that matters even after the take-private. City A.M. documented renewed short-selling pressure in 2023, while Yahoo Finance reported that Mike Lynch''s death in 2024 revived scrutiny of the company because of his historic association with Darktrace and the broader Autonomy saga. CNBC separately reported that EY''s review found only a small number of contract errors and inconsistencies and nothing material to Darktrace''s financial statements, which is helpful, but it does not erase the market memory created by the short-seller campaign.


    Legal exposure also deserves monitoring. PacerMonitor shows that Gatekeeper Solutions v. Darktrace moved from Texas Eastern to the Northern District of California in December 2025, and PatSnap later reported that the matter was dismissed with prejudice in early 2026 with each side bearing its own costs. That outcome appears favorable, but the existence of a patent suit still reinforces the need to diligence Darktrace''s IP posture and litigation reserve assumptions.


    The more immediate diligence flags are around current-data quality. Darktrace''s about page still features a quote attributed to “Poppy Gustafsson OBE, CEO” despite her September 2024 departure, while Tracxn''s April 2026 employee estimate of 2,591 conflicts with Darktrace''s 2,300+ website figure. Neither issue breaks the core investment case, but both signal a post-take-private disclosure environment where facts can lag or diverge. Before underwriting valuation or leverage assumptions, an investor should directly reconcile headcount, board composition, and sponsor ownership rather than relying on public summaries alone.'
