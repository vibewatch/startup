    missingEvidence: A current board list with committee memberships, independent-director designation, and named succession-plan owners for the permanent CEO search.
    whyItMatters: Darktrace is in its second CEO transition inside sixteen months; without a current private-company governance map it is difficult to assess sponsor oversight and management stability.
