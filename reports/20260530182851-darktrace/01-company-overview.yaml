- id: leadership-governance
  title: Founders, leadership, and governance transition
  body: 'Darktrace''s publicly confirmed founding bench is strongest around Nicole Eagan and Jack Stockdale, both of whom still appear on official profile pages. Nicole Eagan is listed as Co-Founder and Strategic Advisor, while Jack Stockdale is listed as founding CTO and the executive responsible for the Bayesian models and AI algorithms that underpin the platform. Those two profiles, combined with Summit Partners'' historical account of Cambridge signal-processing and GCHQ-linked origins, support a real technical founding story even though public sources do not fully settle the entire founding roster or initial equity split.


    The larger current issue is leadership continuity. Investegate and Business Chief confirm that co-founder Poppy Gustafsson stepped down as CEO in September 2024 and Jill Popelka succeeded her. Darktrace and Thoma Bravo then confirmed a second transition on 27 January 2026, when Popelka stepped down and board chairman Charles Goodman became interim CEO while the board launched a permanent CEO search. This sequence compresses two CEO transitions into roughly sixteen months, increasing governance and execution sensitivity during the first full private-equity ownership cycle.


    Companies House records show that director changes continued into March 2026, but public sources still do not provide a fully transparent private-company board and committee picture. That matters because Darktrace is now judged on sponsor-backed execution rather than public-market narrative management. The immediate takeaway is that Darktrace retains strong technical founding continuity, but its top-layer operating leadership is in transition and deserves direct diligence on succession planning, decision rights, and sponsor-board alignment.'
