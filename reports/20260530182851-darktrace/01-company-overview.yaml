- id: capital-reset
  title: Capital structure and private-market reset
  body: 'The defining capital event for Darktrace is the Thoma Bravo take-private. Darktrace and Thoma Bravo both say the transaction completed on 1 October 2024, valued the company at approximately $5.3 billion, and paid shareholders $7.75 per share in cash. Thoma Bravo also said Darktrace ceased trading on the London Stock Exchange and would delist from the FTSE 100. That deal is the cleanest current valuation anchor available and is the correct reference point for today''s stage classification: Darktrace is now a PE-backed private cybersecurity platform company.


    The final broad public operating snapshot immediately before the take-private came from the FY2024 trading update. Financial Times Markets and Quartr both reproduce the key figures: $782.2 million of ARR, at least $689.5 million of revenue, 9,735 customers, 6.3% gross ARR churn, and 106.6% net ARR retention at 30 June 2024. Those metrics imply a scaled, profitable-growth software asset entering private ownership with material customer breadth and improving retention economics.


    What public sources do not provide is equally important. The exact post-close cap table, Thoma Bravo ownership percentage, management rollover, and lifetime primary capital raised are not disclosed in the materials reviewed here. Because the IR site is now an archive, new financing disclosures are unlikely absent a fresh transaction. For diligence, Darktrace therefore looks like a high-quality sponsor-owned platform with a strong final public snapshot, but one where ownership mechanics and current cash-generation detail now sit behind the private wall.'
