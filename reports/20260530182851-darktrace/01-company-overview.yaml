  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: founder-roster
    missingEvidence: A cap-table-backed or official historical founder roster that clearly identifies each founder, early equity holder, and role at company formation.
    whyItMatters: Founder-market fit and legacy influence matter to governance, cultural continuity, and historical ownership economics, but public sources remain incomplete and partially inconsistent.
    diligencePath: Request the original incorporation story, early board materials, or an official company timeline from Darktrace or Thoma Bravo counsel that identifies the founding team and early ownership split.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: The exact post-close cap table, Thoma Bravo ownership percentage, rollover equity by management, and lifetime primary capital raised.
    whyItMatters: These details determine control, dilution, incentive alignment, and eventual return math, yet they are no longer available from public-company reporting after the take-private.
    diligencePath: Request the merger circular, sponsor cap table, debt package, and management equity schedule directly from the company or sponsor.
    relatedQuestionRefs:
    - QO016
    - QO029
    relatedTableRefs:
    - TO003
