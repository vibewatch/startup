    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A directly retained primary citation set for Darktrace's full public-market chronology, especially the 2021 IPO and any other omitted turning points.
    whyItMatters: The milestone table is intentionally partial because this chapter prioritized current ownership, scale, and post-buyout product milestones; a fuller chronology would improve historical context and help compare pre- and post-take-private phases.
    diligencePath: Pull a primary retained source for the 2021 IPO and earlier financing timeline from archived filings or exchange announcements, then expand TO004 in a later refresh.
