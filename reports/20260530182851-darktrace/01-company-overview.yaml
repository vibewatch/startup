company:
  name: Darktrace
chapter:
  number: 1
  title: Company Overview
  summary: 'Darktrace enters the 2026 run date as a Cambridge-based, Thoma Bravo-owned private cybersecurity platform company with a strong final public snapshot: $782.2 million of FY2024 ARR, at least $689.5 million of revenue, and 9,735 customers before the October 2024 take-private. Current company materials now show 10,000 customers, 110 countries, and 2,300+ employees, while post-buyout product expansion has centered on cloud investigation and automated forensics. The main diligence caveats are compressed CEO turnover, incomplete private-company governance disclosure, and current-data gaps around ownership and headcount.'
sections:
- id: identity-model
  title: Identity, footprint, and operating model
  body: 'Darktrace is a Cambridge, United Kingdom-based cybersecurity company that says it has been building an AI-native security model since 2013. Its current company page positions the business as a global cybersecurity AI vendor and lists its main operating footprint across Cambridge, New York, London, and Singapore, with core research carried out in Cambridge and a second R&D centre in The Hague. That combination of UK research roots and global go-to-market presence matters because it anchors both Darktrace''s technical identity and its long-standing claim to be a differentiated European cyber-AI platform rather than a single-product appliance vendor.


    The current platform framing is broad: Darktrace says its ActiveAI Security Platform covers cloud, email, identities, operational technology, endpoints, and network security, supported by more than 200 patents and pending applications. The same page also states the company serves 10,000 customers in 110 countries, works with hundreds of partners, and has deep alliances with AWS and Microsoft. Those scale markers imply that Darktrace is no longer simply an NDR specialist; it now presents itself as a multi-surface, enterprise-grade AI security platform with a global customer base and hyperscaler alignment.


    One important overlay is disclosure posture. Darktrace''s investor-relations site now explicitly says the company is a Thoma Bravo-owned historical archive rather than an active public-market reporting surface. That means current operating facts are now disproportionately sourced from company marketing pages and the last public trading update, not from ongoing public-company filings. For diligence purposes, the headline identity is strong and coherent, but the evidence base for current metrics is thinner after the October 2024 take-private.'
