            body: >-
              Financial-model risk is one of the most important Darktrace questions precisely because the open record is
              now incomplete. The acquisition price is clear: Thoma Bravo’s public materials pegged the transaction at
              about $5.3 billion and $7.75 per share. What is not clear is how much leverage now sits on the business,
              what its covenants require, or whether current ARR, churn, and free-cash-flow conversion still look
              healthy enough to support that structure. The IR site explicitly tells investors it is only a historical
              archive, and the Companies House trail only confirms that 2025 accounts were filed and that a December
              2025 Goldman Sachs charge exists. The MR01 document is informative but still partial: it confirms secured
              debt with fixed-charge, floating-charge, and negative-pledge features, yet discloses no principal, rate,
              maturity, or covenant thresholds. That leaves investors dependent on proxy signals. Review sites still
              show pricing friction and operator burden, which may be tolerable in a net-retention-above-100 business
