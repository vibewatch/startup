        - Principal amount spread maturity covenant levels security package and latest compliance certificate
        - The MR01 filing proves leverage exists but does not show whether equity risk is modest or material
        - Obtain executed debt documents and lender reporting package
      - - FY2025 / FY2026 financial statements
        - Readable sponsor-era P&L balance sheet cash flow and budget-versus-actual analysis
        - Public filings exist but are practically unusable in open extraction and investors still need operating truth
        - Request audited statements or management accounts in data-room format
      - - Cap table and waterfall
        - Ownership by Thoma Bravo funds management rollover preferences debt ranking and any co-invest structures
        - Value at exit can diverge sharply from enterprise value if the stack is complex
        - Request legal cap-table summary and waterfall model
      - - Cloud / Cado monetization
