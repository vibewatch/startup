  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Darktrace’s economically relevant market is not total security spend and it is not limited to a legacy NDR
              appliance budget. Current product pages show a platform centered on network, identity, cloud, and email
              detection plus AI-led investigation and targeted autonomous response, which means the included spend pool
              is telemetry-led detection and response across those surfaces rather than generic firewalls, GRC suites,
              pure IAM administration, or consulting-heavy services. The network page still makes the core boundary
              clear: Darktrace positions NDR as complementary to EDR, SIEM, and firewall stacks, which implies the
              company often wins as an additive or displacement layer inside an existing security architecture rather
              than as a full control-plane replacement. Adjacent spend matters because Darktrace can also reach the same
              demand through partners, MSPs, and MSSPs that package network and email monitoring into managed services.
              The practical boundary therefore runs from narrow NDR into a broader AI-led detection-and-response
              workflow, while the main status-quo substitutes remain SIEM-first detection, endpoint-centric bundles,
              legacy email gateways, and manual SOC triage. TM001 captures that spend boundary and its exclusions.
