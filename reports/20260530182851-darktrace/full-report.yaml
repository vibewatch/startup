      - number: '4.3'
        title: Capital adequacy, sponsor leverage signals, and public-versus-private visibility
        blocks:
          - type: paragraph
            body: >-
              Company Overview covers Darktrace's historical financing chronology; the relevant Financials question is
              what public evidence remains after the October 2024 take-private. The official acquisition materials are
              clear on headline consideration: the scheme became effective on 1 October 2024, Bidco took ownership of
              the whole issued share capital, and shareholders were entitled to $7.75 per share in cash in a transaction
              valued at about $5.3 billion. Regulatory notices then showed court sanction, effectiveness, FTSE deletion,
              and exchange cancellation. Those facts are sufficient to anchor valuation context and prove that
              public-market disclosure ended at the point of delisting.


              The more interesting post-close signal is leverage. Companies House filing history shows that full
              accounts for the year to 30 June 2025 were filed in March 2026, and that a December 2025 MR01 charge was
              registered. The charge PDF identifies Goldman Sachs Bank USA as the secured party and says the instrument
              contains fixed charges, a floating charge over all the property or undertaking of the company, and a
              negative pledge. That is the strongest public signal in this chapter that sponsor-era financing includes
              secured obligations rather than pure equity ownership. But it still stops well short of what an investor
              needs: the reviewed public documents do not reveal debt principal, pricing, amortisation, covenant ratios,
              unrestricted cash, or runway. Even the 2025 accounts PDF fetched successfully but did not yield
              machine-readable financial text in this run, so the existence of accounts is public while their extracted
              contents remain practically unavailable. The result is a public record that confirms leverage and filings
              exist, but not one that makes current liquidity underwriteable.
