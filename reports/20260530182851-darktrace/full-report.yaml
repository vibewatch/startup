  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Darktrace still has a credible investment case because the last fully disclosed operating snapshot was
              strong enough to look like a scaled, profitable cyber platform rather than a speculative AI story. By June
              2024, the company had reached $782.2 million of ARR, at least $689.5 million of revenue, 89.3% gross
              margin, 106.6% net ARR retention, and 9,735 customers; current company materials still point to roughly
              10,000 customers, 110 countries, and more than 2,300 employees. The pro case is that Thoma Bravo bought a
              real platform with category breadth, cloud-forensics expansion through Cado, and enough retention quality
              to earn a future exit at a higher value. The anti-thesis is that the attributes that made Darktrace
              sponsorable are now hidden behind private ownership. The public record shows leverage, two CEO transitions
              in the sponsor transition window, residual accounting-overhang discount, and an Omdia view that standalone
              NDR renewals have been pressured by XDR platform consolidation. That leaves Darktrace in the
              investable-but-not-priceable bucket: strategically relevant, but not investable at high conviction without
              fresh private data.
