            body: >-
              Darktrace's public architecture is telemetry-led and integration-heavy. AWS materials describe cloud
              deployment via lightweight host agents or traffic mirroring plus API logs, while the integrations surface
              ties Darktrace into Azure Sentinel, Splunk, ServiceNow, Microsoft Graph Security API, AWS Lambda, Slack,
