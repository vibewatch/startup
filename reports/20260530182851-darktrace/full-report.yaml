  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing mechanics, and go-to-market motion
        blocks:
          - type: paragraph
            body: >-
              Darktrace's public revenue model is still best understood as recurring enterprise cybersecurity software
              sold through negotiated contracts, not through transparent self-serve pricing. The strongest public
              anchors are the operating metrics Darktrace chose to disclose as a public company: ARR, revenue, customer
              count, retention, and RPO. In the last full public snapshot, ARR reached $782.2 million and revenue was at
              least $689.5 million at 30 June 2024, while H1 FY2024 RPO was already $1.254 billion. Management
              repeatedly described the model as being underpinned by multi-year contracts, which matters because it
              explains why ARR, backlog, and revenue convert more slowly but with better visibility than one-off
              transactional sales.


              Official buying surfaces also point to a sales-assisted motion. The Network product page pushes prospects
              toward evaluation in their own environment, the Contact page routes buyers into sales and support
              channels, and the partner page describes VAR, MSP/MSSP, consultancy, and distributor routes. The same
              partner page advertises a 30-day Proof of Value for consultancy partners, implying a meaningful pre-sales
              motion and non-trivial acquisition cost even though the company does not publish CAC or payback. What the
              public record does not disclose is equally important: there is no visible official price card, no
              module-level revenue mix, no direct-versus-channel split, and no realized discount data. Public investors
              could underwrite the existence of a high-quality recurring model; they could not fully underwrite pricing
              power by SKU.
