            body: >-
              Darktrace's strongest current customer proof is the 2026-era customer-story set rather than its older
              public-company marketing. The retained stories are clearly production-stage, not speculative pilots:
              Technologent runs Darktrace internally while also reselling it; Biomerics describes email-threat
              prevention in a regulated manufacturing setting; NCG uses the platform across seven colleges; Okayama
              Kyokuto Hospital expanded from proof of value into full monitoring for clinical operations; Cogne shows
