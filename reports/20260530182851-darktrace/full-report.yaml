      - number: '8.4'
        title: Scenario analysis and return logic
        blocks:
          - type: paragraph
            body: >-
              The scenario range is wide because Darktrace can plausibly grow into a much higher exit value, but the
              variance is dominated by hidden sponsor-era variables. In the bull case, Darktrace compounds ARR above
              $1.1 billion by 2029, keeps net retention comfortably above 105%, monetizes Cado and cloud forensics, and
              benefits from a more open cyber IPO or strategic-buyer market; that can support roughly $11-14 billion of
              value and a little more than 2x gross value on the 2024 entry. In the base case, ARR grows toward roughly
              $1.0 billion and exits around 8-10x ARR, producing about $7.5-9.5 billion. In the bear case, NDR platform
              pressure intensifies, net retention slips below 100%, debt constrains investment, and governance
              uncertainty persists; value can compress toward $4-6 billion, which is near or below entry. The weighted
              lesson is that Darktrace still has upside, but the current public record cannot show enough edge to buy
              into that upside confidently.
            claimRefs:
              - CV013
