      - number: '2.2'
        title: 'Multi-Lens Sizing: Broad TAM, Constrained SAM, Unverified SOM'
        blocks:
          - type: paragraph
            body: >-
              Published market numbers support multiple valid lenses, not one clean TAM. MarketsandMarkets places the
              AI-in-cybersecurity market at $25.53 billion in 2026 growing to $50.83 billion by 2031, while its XDR view
              puts a narrower platform budget at $7.92 billion in 2025 and $30.86 billion by 2030. Mordor provides the
              tightest heritage wedge for Darktrace’s roots, sizing network traffic analysis at $4.91 billion in 2026
              and $8.29 billion by 2031. Those figures are not additive: the AI-cyber number contains overlap with XDR,
              cloud, and identity budgets, while NTA/NDR is a sub-segment rather than a separate pool that can simply be
              stacked on top. The most defensible public SAM is therefore an evidence-constrained synthesis around the
              Darktrace-covered surfaces — roughly $8 billion to $12 billion — rather than the entire broad AI-cyber
              TAM. Any SOM estimate is weaker, because public post-take-private revenue and segment-mix data are
              missing. FM001 and FM002 preserve that boundary sensitivity instead of forcing a false point estimate.
