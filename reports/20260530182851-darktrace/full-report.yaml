      - number: '8.3'
        title: Comparable analysis and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The comparable exercise supports Darktrace as fairly valued at sponsor entry, not obviously cheap. Public
              cyber leaders trade far above Darktrace's 2024 entry mark on simple market-cap-to-revenue proxies:
              CrowdStrike sits near 38.7x revenue, Palo Alto near 23.1x, and SailPoint near 10.0x. Those numbers make
              Darktrace's 7.7x revenue entry look conservative, but only in a superficial way. The public peers have
              fresher disclosure, stronger public-liquidity value, and less sponsor-era opacity. SailPoint is the best
              sponsor precedent: Thoma Bravo bought it for about $6.9 billion in 2022, and it now carries a public
              market capitalization above $10 billion, showing that Thoma Bravo can re-rate a scaled security asset over
              a multi-year hold. Even so, Darktrace is not SailPoint. Its direct category is under more platform
              pressure, its current debt is unknown, and its governance path is visibly less settled. That is why the
              chapter lands on a fair stance near the 2024 entry price rather than an attractive stance today.
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
