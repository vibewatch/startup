            body: >-
              Darktrace's retained customer evidence points to a recurring enterprise and regulated-market buyer rather
              than a consumerized or SMB-led motion. The decision-maker is usually senior security or IT leadership:
              current stories quote a CISO at Technologent, a CTO at Lake Macquarie City Council, a CIO at Okayama
              Kyokuto Hospital, and security or IDS leaders at Cogne and NCG. Day-to-day usage then sits with lean
              security teams, analysts, or partner SOCs who need continuous visibility across network and email
              workflows. That split matters because it supports a pricing center of gravity closer to upper-midmarket
              and enterprise security budgets than to low-touch departmental spend.


              The vertical and geography mix also looks diversified enough to matter. Current named references span
              healthcare, education, local government, industrial manufacturing, logistics, beverages, and a
              reseller-customer hybrid, while company materials explicitly market into financial services, healthcare,
              government and defense, education, manufacturing, and retail. Geography in the retained proof set spans
              North America, the UK, continental Europe, Japan, and Australia. Channel is part of the story, not an
              afterthought: Darktrace openly sells through VAR, MSP/MSSP, consultancy, and distributor routes and
              maintains a separate federal affiliate for US public-sector work. The gap is economic rather than
              categorical, because public sources still do not disclose revenue mix by segment, region, or channel.
