      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Darktrace is large enough to have real exit optionality, but not transparent enough to be called exit
              ready on public evidence alone. The positive case is obvious: the company has public-market history, a
              near-10,000-customer footprint, sponsor backing, and a product narrative that still spans network, cloud,
              email, identity-adjacent workflows, and automated forensics. The negative case is equally obvious: the
              public does not know the debt quantum, the FY2025 accounts are practically unusable in open extraction,
              and the company has already gone from Poppy Gustafsson to Jill Popelka to interim CEO Charles Goodman
              within the transition to private ownership. Those are not automatic deal-killers, but they are enough to
              define hard thesis-break rules. The recommendation upgrades only if management can show clean sponsor-era
              compounding, a non-threatening leverage profile, stable leadership, and an exit path that looks more like
              a disciplined re-rating than a forced liquidity event. Until then, diligence should focus on debt
              documents, current ARR quality, cap-table economics, and cloud attach-rate proof.
            claimRefs:
