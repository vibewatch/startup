      - number: '5.5'
        title: Differentiation, IP, data, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Darktrace's differentiator is the combination of self-learning behavioral analytics, broad surface
              coverage, and automated investigation rather than a single standalone detector. The 2024 ActiveAI launch
              note shows the company deliberately broadening from reactive detection toward prevention, attack-path
              analysis, investigations, and recovery inside one AI architecture. Cyber AI Analyst's productivity
              framing, the OT or Xage zero-trust extension, and the Cado-backed FAI expansion all point in the same
              direction: Darktrace wants to be an AI-led orchestration layer around a customer's existing stack instead
              of only another sensor.


              Public moat evidence is good but not complete. There is at least one retained patent source around
              anomaly-detection methods, a broad recognition page spanning Gartner and other analyst firms, and a
              third-party SDK showing that the API surface is usable enough for external tooling. But independent
              benchmark proof remains thin. The newest roadmap signal—SECURE AI and the 2026 AI-agent survey—shows
              Darktrace chasing a credible new problem set, yet public evidence has not caught up to prove how durable
              that edge will be against platform incumbents.
