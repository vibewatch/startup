      - number: '1.4'
        title: Milestones from founding to platform expansion
        blocks:
          - type: paragraph
            body: >-
              Darktrace's public milestone record shows a company that moved through three visible phases: technical
              formation in Cambridge, public-market scale-up, and then post-take-private platform expansion. The
              company's current materials emphasize long-duration R&D investment, a patent estate of more than 200
              filings, and a multi-surface security platform rather than a single network product. Summit Partners'
              history reinforces that the original wedge was a novel AI approach built from Cambridge signal-processing
              talent and government-intelligence-adjacent expertise.


              The most important post-take-private strategic move disclosed so far is the January 2025 proposed
              acquisition of Cado Security. Darktrace said Cado would extend cloud investigation and response coverage
              across multi-cloud, container, serverless, SaaS, and on-premises environments. By September 2025,
              Darktrace launched automated forensics capabilities and explicitly linked that release to the Cado
              acquisition, arguing that investigation times could fall from days to minutes. This is strategically
              relevant because it shows Thoma Bravo-era capital being directed toward deeper cloud investigation
              workflows, not merely incremental module refreshes.


              Responsible-AI messaging also continued after the take-private. Darktrace published a 2025 whitepaper
              describing its responsible-AI framework, which it said aligns with NIST AI RMF, the EU AI Act, and OECD AI
              principles. That does not remove commercial or governance risk, but it does indicate that Darktrace is
              still investing in the institutional scaffolding required for enterprise AI adoption. Overall, the
              milestone picture is of a company using private ownership to extend platform depth while trying to
              preserve the AI credibility built in its public era.
