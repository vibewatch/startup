  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              Darktrace’s highest residual risks are not that the company lacks product breadth or customer proof; they
              are that sponsor-era opacity makes it materially harder to know whether growth quality, governance
              quality, and product quality are still strong enough to support a leveraged private-equity ownership
              structure. The public record now points to three issues at the top of the stack. First, the 2023
              accounting attack is no longer a live fraud thesis after the EY review, but the open record still does not
              show a public FCA or FRC closure. Second, post-buyout financial and governance visibility is far thinner:
              the IR site is now archival, while the clearest live financing evidence is a December 2025 Goldman Sachs
              charge containing fixed-charge, floating-charge, and negative-pledge language. Third, operational quality
              remains a real underwriting variable because reviews still flag pricing escalation, tuning effort, and
              interface complexity even while Darktrace pushes deeper into cloud forensics, AI protection, and broad
              partner integrations. The chapter’s thesis-break criteria therefore center on formal regulatory action,
              covenant stress, another CEO reset, or private operating data showing that net retention has fallen below
              100%.
