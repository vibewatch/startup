  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitution map
        blocks:
          - type: paragraph
            body: >-
              Darktrace competes in a market that is wider than standalone NDR and narrower than “all cybersecurity.”
              The direct peer set is still recognizable: Vectra, ExtraHop, and to a lesser extent Corelight all compete
              for the same network-led detection budget, while PeerSpot's May 2026 snapshot shows Darktrace, Vectra, and
              ExtraHop clustered in one shrinking mindshare pool rather than in separate categories. Darktrace's own
              last public scale point remains meaningful at $782.2 million of ARR and 9,735 customers, but that
              footprint is now visibly smaller than the multibillion-dollar public suite vendors that increasingly
              define enterprise SOC buying. [CP001][CP026][CP027]


              The more important strategic rivals are the platform incumbents that can redirect the budget conversation
              upward. CrowdStrike ended FY2026 at $5.25 billion of ARR, SentinelOne ended FY2026 above $1.1 billion of
              ARR, and Palo Alto Networks exited fiscal 2025 at $5.6 billion of Next-Generation Security ARR. Microsoft
              Sentinel, Cisco XDR plus Splunk, and IBM QRadar also matter because they anchor the status quo and the
              incumbent data plane. In practice, Darktrace is no longer just fighting another NDR appliance; it is
              fighting the broader claim that security teams should buy one operating platform for endpoint, identity,
              log, and response workflows. [CP004][CP007][CP009][CP011][CP015][CP016][CP017][CP018][CP044]


              That broader map also includes adjacent and substitute paths. Nozomi owns the OT-heavy flank, Corelight
              represents the open-NDR and internal-build tendency, and Google's Wiz acquisition extends a multicloud
              security platform into adjacent detection and response territory. Omdia's 2026 view is the key adverse
              evidence: standalone NDR has seen more non-renewal and replacement as unified XDR platforms gained share.
              The correct landscape therefore spans direct peers, incumbents, adjacent specialists, manual-SIEM status
              quo, internal build, and likely entrants that can widen their control plane faster than Darktrace can.
              [CP018][CP032][CP033][CP035][CP039][CP040][CP044][CP048]
