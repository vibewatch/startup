      - - Valuation stance
        - Fair only near the 2024 sponsor entry and stretched above it
        - >-
          ~6.8x ARR / ~7.7x revenue at entry looked disciplined versus disclosed FY2024 quality but not obviously cheap
          relative to opacity.
        - Do not pay a premium to the sponsor mark without current ARR, debt, and cap-table visibility.
      - - Entry discipline
        - Price-sensitive and diligence-gated
        - >-
