  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Existing mitigation
      - Residual exposure
      - Action implication
    rows:
      - - Regulatory overhang from the 2023 accounting episode
        - New FCA/FRC correspondence, disclosure, or enforcement signal
        - Any formal action, forced restatement, or public reprimand tied to the prior review
        - EY found no evidence of fraud and no public enforcement has surfaced so far
        - The full report and regulator outcome remain private
        - Pause investment until counsel can quantify legal and reputational exposure
      - - Debt and covenant stress
        - New MR01 filing, debt amendment, or management disclosure of covenant pressure
        - Any incremental secured charge, amendment, or covenant breach
        - Historic public-company cash generation and large installed base
        - Current debt quantum, pricing, and maturity are unknown
        - Demand lender materials and re-cut downside assumptions before conviction sizing
      - - Commercial compression
        - Private NRR, churn, and price-realization data
        - NRR below 100%, gross churn above roughly 8%, or a large customer downsell wave
        - FY2024 public retention was still above 100% and the customer base was large
        - Public data is stale after delisting
        - Re-underwrite revenue growth and leverage supportability immediately
      - - Platform dependency and competitive overlap
        - Loss of co-sell status, API deprecation, or customer-visible partner displacement
        - A major AWS or Microsoft integration is downgraded, deprecated, or replaced by native workflows
        - Deep alliances and existing workflow integrations
        - The partner can also become the displacing platform
        - Cut growth assumptions and require partner-attributed pipeline evidence
      - - Leadership / key-person instability
        - Another CEO reset or departure of Jack Stockdale
        - Any CEO change inside 12 months or CTO departure without visible successor bench
        - Interim continuity and an established technical founder
        - Darktrace has already absorbed multiple top-level transitions
        - Escalate governance diligence and reconsider execution assumptions
      - - Product-quality or new-module misfire
        - Review deterioration, major outage, or customer-visible incident in newer AI and forensics surfaces
        - Sustained review decline or any material customer incident tied to new product surfaces
        - Responsible-AI principles, broad platform capability, and existing support motion
        - Newest surfaces still have limited public proof at scale
        - Defer high-conviction underwriting until postmortem and cohort-quality data are reviewed
    notes: >-
      Thesis-break criteria are intentionally measurable where the public record allows it and otherwise tied to
      discrete disclosure events. The goal is not to prove Darktrace is uninvestable today, but to define the specific
      signals that would invalidate a growth-plus-leverage underwriting case.
    claimRefs:
