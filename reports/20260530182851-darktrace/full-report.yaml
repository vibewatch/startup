      - number: '8.2'
        title: Current financing and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation anchor is still the October 2024 sponsor entry. Using the last public FY2024
              numbers, Thoma Bravo paid about $5.3 billion, which implies roughly 6.8x ARR and 7.7x revenue. That does
              not look reckless relative to Darktrace's disclosed economics: the business was growing, gross margin was
              still near 90%, and retention remained above 100%. The problem is everything that happened after closing.
              Companies House confirms that FY2025 statutory accounts were filed, but the open-web extraction is
              effectively blank. The December 2025 MR01 filing also proves leverage exists and names Goldman Sachs Bank
              USA as the secured lender, yet the public record still does not disclose principal, pricing, maturity, or
              covenant levels. Entry discipline therefore has to be simple. A new investor should treat the 2024 sponsor
              price as a fair-value ceiling until management provides a current ARR bridge, updated retention, current
              EBITDA / FCF, and the debt package. Without those items, higher pricing would mean paying up for opacity
              rather than paying for proven improvement.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
