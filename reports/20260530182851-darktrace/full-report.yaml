companyProfile:
  summary: >-
    Darktrace is a Cambridge-based cybersecurity company founded in 2013 that built its reputation in self-learning
    network detection and now sells a broader AI security platform spanning network, email, cloud, identity, OT,
    endpoint, investigation, forensics, and AI-governance workflows. The last public snapshot before the October 2024
    Thoma Bravo take-private showed a scaled software business with $782.2 million of ARR, at least $689.5 million of
    revenue, and 9,735 customers, while current company materials still market 10,000 customers across 110 countries.
    The investment debate is no longer whether Darktrace is real or strategically relevant; it is whether outside
    investors can underwrite sponsor-era performance, leverage, and governance with the much thinner private-company
    disclosure now available.
