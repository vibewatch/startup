      - number: '5.6'
        title: Trust, security, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Darktrace's trust surface is meaningfully stronger than a generic marketing page. The Trust Centre lists
              ISO 27001, ISO 27018, ISO 42001, and Cyber Essentials artifacts, and the 2026 AI-security blog ties ISO
              42001 to responsible AI management. That matters because Darktrace is asking customers to trust automated
              investigation and response, plus newer AI-governance products, so formal control evidence is part of the
              product story rather than a side note. The trust surface is also supported by named support engineers and
              a customer portal for compliance questions.


              The main risk is not the absence of any control story; it is the gap between control messaging and
              deployment reality. The cloud case study shows Autonomous Response can block live SSH exfiltration, but it
              also documents a 718 GB exfiltration and ransomware detonation when response was not configured on
              affected devices. The federal page proves government ambition, yet the retained source set does not prove
              FedRAMP or CMMC status. Product trust is therefore good enough for serious enterprise diligence, but not
              complete enough to skip follow-up questions on configuration defaults, federal authorizations, and
              independent performance benchmarks.
