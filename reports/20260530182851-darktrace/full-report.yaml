      - number: '4.2'
        title: Unit economics, gross-margin drivers, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Darktrace's public unit-economics disclosure is good on output metrics and weak on input metrics. On the
              output side, the company disclosed consistently high gross margins of 89.2% in FY2022, 89.8% in FY2023,
              and 89.3% in H1 FY2024; it also generated $99.5 million of free cash flow in FY2022 and $93.8 million in
              FY2023. Those are strong software-like economics and explain why Darktrace could enter private ownership
              from a position of operating strength rather than rescue financing. H1 FY2024 adds more nuance: revenue
              grew 27.4% year over year, adjusted EBITDA margin reached 25.6%, and RPO surpassed $1.25 billion.
              Publicly, that is a robust combination of backlog, conversion, and high gross profit.


              The caveat is that cost structure moved in ways that make historical margins non-trivial to extrapolate.
              Darktrace said H1 FY2024 S&M and G&A fell as a share of revenue, but also noted that some customer success
              manager and channel partner costs were reclassified into S&M, while R&D cash employment costs increased
              15.3%. Earlier FY2023 disclosures also explained that commission plans shifted to paying 100% of sales
              commissions upfront, temporarily increasing cash outflows and resetting adjusted EBITDA presentation. That
              makes the public record good enough to infer strong gross economics, but not good enough to model fully
              loaded CAC, sales productivity, channel take-rates, or sponsor-era contribution margin. The best public
              proxy is therefore directional: ARR per customer was roughly $80 thousand at June 2024, revenue per
              employee was roughly $287 thousand to $300 thousand depending on which headcount snapshot is used, and
              retention remained above 100%, but the classical SaaS efficiency inputs are still private.
