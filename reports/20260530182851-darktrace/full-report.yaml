        title: Operational / quality / security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk at Darktrace is driven less by a confirmed public breach history and more by the
              combination of automation, breadth, and customer-specific tuning. Review evidence is consistent on that
              point across multiple surfaces. TrustRadius users describe confusing dashboards, hard tuning, and contract
              pricing that escalates annually; PeerSpot reviewers add interface complexity, integration demands, and
              complaints about false-positive management; older G2 reviews show that the same need for tweaking has been
              visible for years rather than being a one-off complaint. Those frictions matter because Darktrace is not
              standing still technologically. The company is simultaneously expanding into cloud investigation and
              response through Cado, adding automated forensics into the ActiveAI platform, and marketing responsible AI
              controls across a fast-moving attack surface. That broadens the moat, but it also broadens the number of
              product surfaces that must work reliably. Without fresh post-buyout cohort, incident, or support-metrics
              disclosure, investors have to assume that misconfiguration, poor tuning, or weak release discipline could
              transmit directly into renewal pressure and higher service costs.
