        - Bull-case upside depends on proving Darktrace is more than a legacy NDR story
        - Ask product / sales ops for cohort-level attach and win-rate data
      - - Leadership and exit plan
        - Permanent CEO plan board incentives and sponsor exit thinking for 2027-2029
        - Governance stability is now part of the valuation discount not a side issue
        - Request board materials management retention plan and banker / sponsor exit options review
    notes: >-
