  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention breaks
        - Net ARR retention below 100% for two consecutive periods
        - Invalidates the compounding assumption behind bull and base cases
        - Move from track to avoid until management shows recovery
      - - Debt stress appears
        - Debt proves materially above ~6x EBITDA or covenant headroom is narrow
        - Turns sponsor leverage from manageable overlay into core equity impairment risk
        - Rebuild the model on debt-first downside terms before considering any entry
      - - Governance slips again
        - A third CEO change or prolonged interim leadership without a permanent plan
        - Signals sponsor-board instability and lowers exit confidence
        - Cut multiple assumptions and downgrade exit readiness
      - - Platform pressure worsens
        - Clear evidence of renewed non-renewal bundle displacement or pricing concession tied to XDR suites
        - Confirms the anti-thesis that standalone NDR is structurally compressing
        - Shift weight toward bear case and lower terminal multiple
      - - Regulatory or provenance issue reopens
        - New formal action tied to the 2023 accounting controversy or later disclosure quality
        - Reintroduces credibility discount and can shut exit windows abruptly
        - Pause diligence and treat capital-structure downside as primary
      - - Exit path stalls
        - No credible secondary strategic or re-IPO preparation by 2028
        - Weakens the sponsor-playbook argument and raises hold-period risk
        - Assume longer hold and lower return expectations
    notes: >-
      Each trigger maps directly to a valuation consequence: lower quality-of-revenue confidence, lower multiple
      confidence, or lower exit confidence.
    claimRefs:
      - CV010
      - CV011
