            body: >-
              The clearest expansion path is module-led rather than seat-led. Current customer proofs usually start with
              network or email visibility and then extend into autonomous response, OT visibility, board reporting, or
              managed services. Darktrace's own FY2024 update said existing customers still contributed significant new
              ARR, and the partner program shows how proof-of-value, reseller support, and MSSP packaging help move
              accounts from initial deployment into wider adoption. Technologent is especially revealing because it is
              both a channel partner and a user, which shows how commercial expansion can happen through ecosystem
              credibility as well as direct product upsell.


              The harder question is concentration, and public evidence does not answer it. No retained source discloses
              top-customer share, contract length, or cohort retention, so it is impossible to prove whether Darktrace's
              customer base is broadly diversified in revenue terms or merely broad in logo count. Public-sector motion
              is also visible but not quantifiable: Darktrace Federal exists, government resources exist, and
              procurement searches can be run, yet the retained public procurement pages still do not provide a clean
              award-level concentration picture. Add the post-buyout disclosure drop-off and an adverse reminder that
              reputational scrutiny can still surface in diligence, and the result is a credible expansion story paired
