evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board roster, voting control, beneficial ownership, reserved matters, and leadership succession plan.
    whyItMatters: The public founder roster is too narrow to assess control, oversight, or key-person resilience.
    diligencePath: >-
      Obtain the legal entity chart, charter documents, board minutes, voting agreements, and executive succession
      materials.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent, jurisdiction-complete checks for litigation, regulatory actions, sanctions, outages, breaches, and
      customer complaints.
    whyItMatters: >-
      The assigned evidence contains no reliable adverse-event record, and absence from that pool is not proof of
      absence.
    diligencePath: >-
      Run entity-specific court, regulator, sanctions, cybersecurity, and customer-reference searches in every operating
      jurisdiction.
    relatedQuestionRefs:
      - QO009
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: Audited recognized revenue, ARR definition and bridge, order conversion, gross margin, cash balance, and runway.
    whyItMatters: Orders, private-market estimates, revenue, recurring revenue, and cash are economically different measures.
    diligencePath: >-
      Review audited financial statements, general-ledger extracts, order-to-revenue cohorts, bank statements, and the
      ARR customer schedule.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Round-by-round primary documents, debt and secondary components, fully diluted capitalization, liquidation
      preferences, and net cash proceeds.
    whyItMatters: Public databases disagree on round count and do not establish cash available or investor control rights.
    diligencePath: >-
      Reconcile signed financing documents, cap-table history, wire receipts, debt schedules, and secondary transfer
      records.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      Customer contracts, production status, concentration, renewal behavior, and independently verified deployment
      outcomes.
    whyItMatters: Named relationships and case-study descriptions do not establish durable revenue or scaled production adoption.
    diligencePath: >-
      Obtain the customer ledger, signed contracts, renewal cohorts, deployment logs, and direct references from the
      largest customers.
  - type: missing-source
    severity: material
    topic: market-size-gap
    missingEvidence: >-
      Independent category spend for simulation assets, physical-AI data, model evaluation, and deployment
      infrastructure by geography and year.
    whyItMatters: >-
      Without a category baseline and explicit inclusions, TAM and SAM would be arbitrary and market share cannot be
      computed.
    diligencePath: >-
      Obtain independent analyst data or construct a bottom-up spend model from customer counts, contract values,
      product mix, and procurement records.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Product-level contracts identifying buyer, user, payer, budget owner, term, renewal, and implementation-services
      share.
    whyItMatters: >-
      Aggregate orders cannot distinguish repeatable software demand from custom delivery or reveal the actual
      procurement path.
    diligencePath: Review a representative contract cohort and interview customer procurement, engineering, and operations sponsors.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: metric-comparability
    missingEvidence: >-
      Audited recognized revenue by period and a reconciliation from booked orders to revenue, cancellations, backlog,
      and cash collection.
    whyItMatters: >-
      Public order and estimated-revenue figures use different periods and denominators and cannot support a growth or
      share conclusion.
    diligencePath: Request audited statements, order schedules, backlog aging, cancellation terms, and revenue-recognition policy.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-primary-evidence
    missingEvidence: >-
      Primary product, pricing, security, customer, and roadmap evidence from each material direct or adjacent
      competitor.
    whyItMatters: >-
      The assigned pool supports a competitor-class taxonomy but not a verified vendor-by-vendor performance, price, or
      adoption ranking.
    diligencePath: >-
      Obtain current competitor product documentation, price schedules, procurement records, and customer references
      before making a replacement or market-share judgment.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-pricing
    missingEvidence: >-
      Realized contract prices, renewal and expansion cohorts, data-portability terms, exclusivity, migration effort,
      and win-loss records against named alternatives.
    whyItMatters: >-
      Product integration does not establish pricing power or lock-in without evidence that customers renew, expand, and
      face meaningful switching friction.
    diligencePath: >-
      Review redacted contracts and cohort data, then interview customers that evaluated both Lightwheel and internal or
      external alternatives.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP007
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      Audited capitalization, round-by-round proceeds, current headcount, and recognized revenue reconciled to the legal
      entity structure.
    whyItMatters: >-
      Funding and scale records diverge materially, so they cannot support a reliable relative scale or
      capital-advantage conclusion.
    diligencePath: >-
      Reconcile bank statements, financing documents, capitalization tables, payroll records, and audited revenue rather
      than combining third-party database totals.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited FY2025 and 2026 year-to-date recognized revenue, bookings, billings, collections, backlog conversion,
      recurring mix, and customer concentration.
    whyItMatters: Public orders, estimates, and growth claims cannot establish revenue scale, durability, or cash conversion.
    diligencePath: >-
      Reconcile the general ledger to signed contracts, invoices, bank collections, and a customer-level backlog and
      revenue bridge.
    relatedQuestionRefs:
      - QI003
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized pricing, discounts, gross margin by stream, delivery labor and compute, CAC, sales cycle, payback,
      retention, and renewal cohorts.
    whyItMatters: >-
      The mix of reusable platform revenue and bespoke services determines whether growth can produce operating
      leverage.
    diligencePath: >-
      Review executed contracts, stream-level contribution margins, sales cohorts, delivery staffing, compute invoices,
      and renewal and expansion schedules.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, restricted cash, monthly burn, working capital, capex, debt and project-finance obligations, use of
      funds, runway, and next financing trigger.
    whyItMatters: >-
      Funding announcements do not reveal available liquidity or whether current capital reaches the next value-creating
      milestone.
    diligencePath: >-
      Obtain bank statements, the capitalization table, financing documents, obligation schedules, and an 18-month
      monthly cash forecast tied to milestones.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: public-financial-record
    missingEvidence: A source-of-truth reconciliation for revenue, total funding, round identity, valuation, and current workforce.
    whyItMatters: >-
      Conflicting third-party figures make scale, capital intensity, and financing dependency unsuitable for precise
      underwriting.
    diligencePath: >-
      Reconcile audited accounts, cap-table entries, round documents, payroll records, and publisher cut-off dates
      without combining incomparable estimates.
    relatedQuestionRefs:
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Current security certifications, privacy and consent controls for egocentric data, vulnerability-management
      practices, incident-response procedures, and formal quality system documentation.
    whyItMatters: >-
      Enterprise and industrial customers may expose sensitive facilities, worker behavior, proprietary processes, and
      safety-critical evaluation results to the platform.
    diligencePath: >-
      Obtain the security package, data-processing agreement, subprocessor list, penetration-test summary, incident log,
      privacy impact assessment, and applicable certification reports.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Production uptime, failed-job rate, data rejection rate, deployment incident history, support response times,
      acceptance-test results, and customer-level renewal evidence.
    whyItMatters: >-
      Partner demonstrations and recruiting targets do not establish repeatable service quality across customers, robot
      types, or operating environments.
    diligencePath: >-
      Review twelve months of service telemetry, severity-one incident records, customer support metrics, acceptance
      criteria, and three production customer references.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, package downloads, release cadence, contributor counts, API documentation usage, or
      practitioner-community engagement tied to Lightwheel products.
    whyItMatters: >-
      An active external technical ecosystem would strengthen integration durability and provide an adoption signal
      beyond company and partner case studies.
    diligencePath: >-
      Request official repository and package identifiers, developer-portal analytics, API usage cohorts, and a list of
      externally maintained integrations.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Account-level NRR, GRR, churn, renewal, contract-duration, expansion, and cancellation data segmented by customer
      cohort.
    whyItMatters: >-
      Named relationships and one production deployment do not establish recurring revenue durability or land-and-expand
      economics.
    diligencePath: >-
      Obtain a management-exported cohort schedule, reconcile it to recognized revenue, and sample contracts and
      invoices for the largest and recently renewed accounts.
    relatedQuestionRefs:
      - QU006
  - type: stale
    severity: material
    topic: adoption-trajectory
    missingEvidence: >-
      Dated quarterly series for paying customers, production deployments, active sites, usage, pilots converted, and
      failed or discontinued deployments.
    whyItMatters: >-
      Most named-customer evidence lacks a publication date or comparable denominator, preventing a defensible
      adoption-growth calculation.
    diligencePath: >-
      Request a quarterly operating dashboard through 2026-09-30 and reconcile each metric definition across periods and
      customer segments.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Complete named-customer register with pilot, production, paid, active, renewed, expanded, and terminated status
      for every account.
    whyItMatters: >-
      The public sample mixes a production deployment, benchmark adoption, partnerships, and unqualified customer-list
      entries.
    diligencePath: >-
      Reconcile CRM accounts to signed contracts and invoices, then seek direct references from at least three
      production customers across distinct segments.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Revenue concentration by customer, segment, geography, channel, and NVIDIA-dependent product or partner pathway.
    whyItMatters: >-
      Platform dependence and a small set of visible relationships could make growth vulnerable to one partner, one
      customer, or procurement restrictions.
    diligencePath: >-
      Review top-20 customer revenue, backlog, renewal dates, partner-attributed pipeline, and contractual termination
      rights for the latest twelve months.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: cross-border-compliance
    missingEvidence: >-
      Primary regulator records, export classifications, sanctions screening, privacy and data-flow documentation,
      security certifications, and external counsel analysis.
    whyItMatters: >-
      Independent commentary identifies exposure, but no primary evidence verifies compliance status or quantifies
      customer restrictions.
    diligencePath: >-
      Obtain the legal-entity and data-flow maps, product export classifications, regulator correspondence,
      certifications, incident register, and a written external counsel opinion.
    relatedQuestionRefs:
      - QR002
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
