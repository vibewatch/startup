    relatedQuestionRefs:
      - QR005
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited recognized revenue by period, gross margin, retention, customer concentration, cash balance, burn, and
      runway.
    whyItMatters: >-
