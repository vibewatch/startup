    rows:
      - - Physics-calibrated simulation assets
        - Evidenced through SimFoundry and SimReady descriptions
        - Overlapping asset-labeling and reconstruction capability reported
        - Environment generation reported; physics validation unknown
        - Possible through manual calibration; quality and effort vary
      - - Egocentric or demonstration data
        - Evidenced through EgoSuite and simulation teleoperation
        - No comparable packaged collection service established here
        - Unknown in assigned evidence
        - Possible through in-house collection and teleoperation
      - - Cross-engine model evaluation
        - RoboFinals is reported across multiple physics backends
        - Isaac Lab-Arena provides distribution but independent breadth is unknown
        - Unknown in assigned evidence
        - Academic benchmarks exist, but production correlation is disputed
      - - Real-robot deployment workflow
        - RoboStack is positioned as the deployment bridge
        - Foundation-model and simulation components are available
        - Unknown in assigned evidence
        - Requires internal systems integration
      - - Distribution and ecosystem access
        - Deep NVIDIA integration and named ecosystem collaborations
        - Platform owner controls the core channel
        - Collaboration route reported, commercial reach unknown
        - Broad accessibility but fragmented support and accountability
    notes: >-
      Evidence-backed qualitative matrix, not a benchmark. "Unknown" means the assigned source pool
      did not establish the capability; it does not mean the capability is absent.
