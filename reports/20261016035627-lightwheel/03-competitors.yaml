  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Public price or unit
      - Contract model
      - Included scope
      - Underwriting implication
    rows:
      - - Lightwheel integrated offering
        - Unknown
        - Enterprise terms not disclosed
        - Assets, data, evaluation, and deployment are described
        - Cannot test bundle discount, gross margin, or switching cost
      - - NVIDIA-native components
        - Unknown in assigned evidence
        - Platform and ecosystem terms not reviewed
        - Overlapping simulation, model, and data-generation components
        - Platform bundling could compress standalone vendor pricing
      - - World Labs Marble
        - Unknown
        - Unknown
        - Generated environments
        - Price-performance substitution cannot be assessed
      - - Open-source stack
        - Software may be open; implementation cost unknown
        - Self-managed
        - Modular simulators and benchmarks
        - Labor, compute, integration, and maintenance are the economic comparison
      - - Internal build and teleoperation
        - No quantified unit cost
        - Internal headcount and infrastructure
        - Maximum workflow control
        - A credible substitute for scaled labs, but total cost is unverified
    notes: >-
      No retained prefetched source disclosed comparable public list prices, realized contract
      values, discounting, or unit economics. Values are deliberately shown as unknown rather than
      inferred from funding, orders, or company scale.
    claimRefs: [CP010, CP014]
figures:
  - id: FP001
    title: Competitive positioning by integration breadth and buyer control
    type: quadrant
    summary: >-
      Analyst ordinal synthesis shows the strategic trade-off between an integrated workflow and
      buyer control; coordinates are not market-share, quality, or performance measurements.
    data:
      xAxis:
        label: Integration breadth
        min: 1
        max: 5
        lowLabel: Point solution
        highLabel: End-to-end workflow
        description: Ordinal assessment of how much of the data-to-deployment workflow is covered
      yAxis:
        label: Buyer control and portability
        min: 1
        max: 5
        lowLabel: Platform-dependent
        highLabel: Buyer-controlled
        description: Ordinal assessment of buyer control over tools, data, and integration
      points:
        - label: Lightwheel
          x: 5
          y: 2
          note: Broad integrated scope with material NVIDIA ecosystem dependence
        - label: NVIDIA-native stack
          x: 4
          y: 1
          note: Broad platform components with control concentrated in the platform owner
        - label: World Labs Marble
          x: 2
          y: 2
          note: Narrower environment-generation adjacency in the assigned evidence
        - label: Open-source simulator mix
          x: 3
          y: 4
          note: Modular and portable, but requires integration and operational ownership
        - label: Internal full-stack build
          x: 5
          y: 5
          note: Maximum control and breadth at high unquantified operating cost
        - label: Teleoperation-only collection
          x: 1
          y: 4
          note: Buyer-controlled data path with narrow workflow coverage
    approximationNotes: >-
      Scores are analyst-assigned ordinal positions from 1 to 5 using the capability and dependency
      descriptions in the retained evidence. They are not measured benchmarks and small coordinate
      differences should not be interpreted as performance gaps.
    claimRefs: [CP011]
callouts:
  - calloutType: risk
    title: Platform distribution is also the principal displacement vector
    body: >-
      NVIDIA gives Lightwheel credibility and reach, but native asset, reconstruction,
      synthetic-data, simulation, and evaluation capabilities could absorb or commoditize parts of
      the stack. Durability depends on proprietary operational data and benchmark adoption, neither
      of which is independently quantified in the assigned evidence.
    claimRefs: [CP004, CP005, CP006]
