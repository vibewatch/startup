      - Target buyer
      - Limitation
    rows:
      - - Lightwheel
        - Integrated physical-AI infrastructure
        - SimReady assets, human and synthetic data, evaluation, and deployment workflow
        - "$145M reported by Tracxn; $293M reported by FundedIQ, unresolved"
        - Robotics labs, OEMs, and industrial deployment teams
        - No public pricing, retention, or independently verified market share in the assigned pool
      - - NVIDIA native stack
        - Platform incumbent and likely entrant
        - Isaac simulation, GR00T, Newton, asset labeling, reconstruction, and synthetic-data tools
        - Not evaluated in the assigned evidence
        - Developers already standardized on NVIDIA compute and simulation
        - Overlap is documented by secondary analysis, not a primary competitor comparison
      - - World Labs Marble
        - Adjacent world-generation product
        - Generated 3D environments that may reduce demand for manually created assets
        - Not evaluated in the assigned evidence
        - Teams needing environment generation
        - No evidence here on robotics-grade physics fidelity, price, or adoption
      - - Open-source simulator and benchmark stack
        - Substitute and multi-homing path
        - MuJoCo, Genesis, Isaac-based tooling, and academic benchmark components
        - Open tooling; implementation cost is not quantified
        - Research and engineering teams with internal integration capacity
        - Fragmented workflow and benchmark-to-production transfer remain unverified
      - - Internal asset, data, and evaluation build
        - Status quo and internal-build substitute
        - Custom physics calibration, teleoperation, task design, and testing
        - Labor and infrastructure cost not quantified
        - Large labs and OEMs protecting proprietary workflows
        - High operational burden, but maximum control and potential portability
      - - Generic AI-services firms in broad databases
        - Taxonomy noise rather than demonstrated direct peers
        - Enterprise AI, data, engineering, and automation services
        - Tracxn lists funded and public companies but not job-to-be-done comparability
        - Enterprise buyers seeking services
        - No evidence that these firms replace Lightwheel's physical-AI workflow
    notes: >-
      Partial landscape based only on the assigned prefetched evidence. Competitor scale, pricing,
      and customer overlap are marked unknown where no primary source was available; funding
      figures for Lightwheel are conflicting third-party records, not cash balances.
    claimRefs: [CP001, CP004, CP005, CP007, CP008, CP009, CP010, CP012, CP015, CP016]
