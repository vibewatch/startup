            body: >-
              已披露工作流整合了资产格式、仿真平台、世界生成、远程操作、模型训练和评估。NVIDIA 称 Lightwheel 的平台在 Isaac Sim 中使用 OpenUSD 和 MJCF
              资产，并把仿真连接到虚拟现实远程操作；World Labs 则描述了从轻量采集、Marble 世界生成、USD 转换、Isaac Sim 整合、行为执行到 RoboFinals
              评估的互补路径。公开职位说明还加入了交付层，包括模式、适配器、转换、云端传输、API、SDK、可观测性和成本控制。这些技术细节足以显示一致的运营模式，但技术栈很大程度依赖合作伙伴基础设施。在将其视为供应商中立之前，客户必须尽调其在物理引擎、数据格式、云环境和模型系列之间的可移植性。
