  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 产品范围与客户任务
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 打包了四项相互关联的能力，而不是单一仿真工具。SimFoundry 将真实世界输入转为训练和验证环境；EgoSuite 提供人类行为数据；RoboFinals
              用标准化任务和可重复环境评估机器人策略；RoboStack
              则把部署失败和约束反馈给下一轮学习。这个结构覆盖客户组装真实世界、生成示范、衡量模型表现和改进已部署系统的完整任务。独立公司数据库也描述了物理准确、可用于仿真的资产和数据解决方案，但没有证明产品级收入、留存或实际表现。因此，可投资的产品逻辑在于覆盖面和工作流整合，而不是可以据称已成为品类标准的某一模块。
            claimRefs:
              - CE001
