              - CV013
              - CV016
      - number: '8.4'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              由于公开证据不支持概率加权现金流模型，情景分析必须保持条件性。乐观情景要求经过核实的入场价格接近已报告 $1 billion 至 $2.5 billion 区间的低端，经审计收入向已报告 $10 million
              至 $50 million 区间的高端靠拢，并有证据证明评估层正在成为持久标准，而不只是合作伙伴功能。基准情景假设估值接近约 $2
              billion，但在收入、股权结构表和轮次分类核对一致前暂缓投资判断。悲观情景包括价格高于已报告区间、收入更接近约 $3 million 的报告、优先权负担，或 NVIDIA 去中介化。没有公开证据证明 IPO
              时间表、战略买方、可比并购交易或老股流动性路径。最终尽调应取得经审计财务、订单转收入、客户集中度和续约数据、法律实体结构、优先股堆叠、现金余额、烧钱、现金跑道和董事会治理；拿不到这些资料就是逻辑破坏触发条件。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
