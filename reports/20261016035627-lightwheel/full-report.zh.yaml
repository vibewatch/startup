      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 不要依据订单、融资额或数据库宽泛区间对报告估值做投资判断。只有在取得经审计收入、已签署融资条款、完全摊薄所有权、优先权顺位、现金和现金跑道、客户转化及可信退出路径后，才重新审视这一决定。
            calloutType: recommendation
            claimRefs:
