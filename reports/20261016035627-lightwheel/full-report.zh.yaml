  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              可投资结论是继续研究，而不是买入。独立数据库将 Lightwheel 的估值放在 $1 billion 至 $2.5 billion 之间，一家筛选器报告约 $2
              billion；这些标记是方向性信息，不是交易文件。同一公开记录报告收入要么约 $3 million，要么处于 $10 million 至 $50 million
              的宽泛区间，缺乏共同期间、会计口径或经常性收入分母。因此无法建立有意义的收入倍数、现金流模型、目标回报、持有期或退出计算。入场纪律应要求在议价前取得已签署融资文件、完全摊薄资本结构、清算优先权、经审计确认收入，以及客户层面的订单转收入数据。在这些项目核对一致前，相对于公开财务证据的质量，报告估值区间显得偏高，而不是在可比指标上已证明便宜或昂贵。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
