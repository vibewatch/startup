      - number: '8.2'
        title: 融资背景与商业证明
        blocks:
          - type: paragraph
            body: >-
              融资证据证明投资者兴趣浓厚，但没有形成清晰的资本历史。TMTPost 报告一笔 RMB 1 billion 的 A++/A+++ 融资，Unicorn Screener 将最新一轮标为 $147.5
              million Series A，StartupFundraising 则称披露总额为 $140 million，并有 2026 年 3 月的 Series
              B。这些标签和总额可能采用了不同的纳入规则、币种、分期或更新时间，但公开页面无法核对。Caplight
              展示轮次日期，却在公开页面隐藏金额和估值字段，进一步说明缺失的股权结构细节很重要，不能安全推断。TMTPost
              称资金将用于仿真引擎研发、评估系统升级和全球交付能力；这在战略上自洽，但融资额不等于可用现金，也不能证明现金跑道。投资者应将融资记录视为获得资本的证明，而非收入质量、流动性或有利优先权条款的证明。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
