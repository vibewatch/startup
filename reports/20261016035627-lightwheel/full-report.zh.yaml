      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据显示两类买方正在汇合。前沿物理 AI
              团队需要多样且符合物理现实的数据和可重复评估；工业运营方则需要一条从限定任务走向生产的低风险路径。潜在用户包括仿真工程师、机器人研究员、模型评估团队和部署集成商；可能的经济买方是 AI
              或机器人负责人，以及对自动化结果负责的业务部门。由于现有来源没有采购文件、按产品拆分的合同金额或明确预算负责人，这些预算归属仍只是推测。合理的商业模式由多部分组成——软件或库访问、数据许可、评估服务和定制部署——因此没有产品级合同拆分，就不能从总订单推断经常性软件价值。
            claimRefs:
              - CM003
              - CM005
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              现实世界机器人训练和测试成本高、可重复性有限，推动了采用。公司材料称，仿真让团队能在投入硬件或中断生产前测试边缘案例；World Labs
              则将环境创建和可规模化评估称为关键瓶颈。据称，合作伙伴案例研究显示，生成世界可把环境创建从数周缩短到数分钟，但这是一项合作伙伴口径，不是独立基准。约束仍然明显：仿真保真度、向真实环境迁移、工作流整合、对
              NVIDIA 工具链的依赖，以及跨境数据或出口管制问题。因此，Lightwheel 处在潜在有价值的卖铲子层，但采用速度和利润结构取决于客户购买的是可重复基础设施，还是劳动密集型定制交付。
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 不要把订单换算成市场份额
            body: 据称的公开订单缺少合同构成、期限、取消情况、收入确认时点和经独立验证的品类支出。它能证明需求，却不是精确计算 SOM 或市场份额的依据。
            calloutType: risk
            claimRefs:
