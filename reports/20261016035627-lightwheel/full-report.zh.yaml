            body: >-
              收入质量目前尚未得到证明，而不是已被证明较弱。报告的订单量和客户广度可能支撑大型企业业务，但证据没有说明订单如何转化为确认收入、其中多少可重复、合同是否续约，或交付成本能否高效规模化。如果可复用资产和评估工具占主导，利润率可能扩张；如果定制数据采集和部署仍是核心，利润率同样可能收缩。外部估算对收入、融资和员工规模也不一致。投资判断应以经审计财务、合同级队列数据、按业务流拆分的毛利，以及现金消耗与里程碑计划为前提，而不是从订单或融资公告外推。
