      - number: '8.3'
        title: 投资逻辑、反向逻辑与风险调整视角
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，稀缺的仿真资产、行为数据和评估基础设施可以成为物理 AI 的控制点，外部融资和 NVIDIA 生态协同则提供分销与可信度。反向逻辑同样重要：AGI House 指出真实的平台风险，因为 NVIDIA
              能力与 Lightwheel 技术栈部分重叠，可能把评估吸收到一方平台。随着出口管制、数据主权和技术栈分离加剧，同一来源将公司中美双重定位描述为进入优势，也是脆弱点。执行能力也不清楚：Airframe 列出 50
              名 FTE，Unicorn Screener 报告约 20 名团队成员和 13
              个开放职位。这些不是等价指标，也未必来自同一时期，应核对而不是取平均。上行情景取决于基准采用和商业转化；下行情景则叠加平台依赖、地缘摩擦、优先权不透明和财务可比性弱。
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV009
