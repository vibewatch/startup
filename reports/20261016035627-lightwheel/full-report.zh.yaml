    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 入场价格接近报道的 $1B-$2.5B 区间下沿；经审计收入接近报道的 $10M-$50M 区间上沿；独立基准测试持续获得采用。
        - 只有在增长、利润率、留存、稀释和退出证据共同建立目标回报路径后，才可能进行投资判断。
        - 在一手财务和采用证据出现前，概率较低。
        - 入场价格上升，或评估仍是依赖合作伙伴的功能。
      - - 基准
        - 入场价格接近报道的约 $2B 估值；融资按所述完成；商业证据仍不完整。
        - 继续研究，因为既无法为可比倍数辩护，也无法为概率加权退出价值辩护。
        - 与当前相互冲突的公开记录最为一致。
        - 收入、轮次分类或优先权条款出现不利的对账结果。
      - - 悲观
        - 入场价格高于公开区间；收入更接近约 $3M 的报道；优先权悬置；平台去中介化或地缘政治限制。
        - 没有清算瀑布、现金、烧钱速度和资产价值证据，无法界定下行边界。
        - 重大，且无法从公开数据量化。
        - NVIDIA 吸收这一层能力，关键市场变得不可进入，或资本不再转化为商业证明。
    notes: 情景区间仅来自引用的公开来源；没有推导概率百分比、ARR、现金消耗、现金跑道、退出价值或目标回报。
