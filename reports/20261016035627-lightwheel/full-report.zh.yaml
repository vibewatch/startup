              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局远不止一份风险投资机器人数据厂商名单。Lightwheel
              覆盖可用于仿真的资产、人类和合成训练数据、模型评估及部署支持，因此买方可以将其与一体化平台比较，组装开源仿真器和学术基准，采购更窄的世界生成或数据服务，或自行搭建工作流。NVIDIA
              既是最重要的分销平台，也最可能成为强劲进入者，因为其原生技术栈触及资产标注、环境重建、合成数据生成、仿真和基础模型。World Labs 的 Marble
              是相邻的环境生成替代方案；MuJoCo、Genesis、基于 Isaac 的工具和内部校准团队则是替代品，而非同类供应商。第三方数据库也无法厘清边界：Tracxn 的宽泛集合强调通用 AI
              服务公司，Caplight 的嵌入式集合则列出 Mecka AI、NVIDIA 和 Zero Matter。因此，按类别绘制格局比声称存在明确排名更可靠。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
