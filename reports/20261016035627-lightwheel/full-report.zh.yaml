  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应限定为物理 AI 的开发与部署基础设施，而不是整个机器人、人工智能或工业自动化经济。按此边界，Lightwheel
              称自己解决四项相连的任务：重建运营环境、生成行为数据、评估模型是否就绪，以及支持部署。独立资料将其目标用户定位于具身机器人、自动驾驶、世界模型开发和工业自动化领域。主要替代方案包括内部仿真和数据团队、学术或开源工具、直接采集真实世界数据、硬件测试，以及垂直整合的平台厂商。机器人硬件、基础模型收入、一般
              GPU 支出和下游劳动力节省属于相邻市场，不是 Lightwheel 可获取的支出，不应计入市场总额。
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              现有来源不足以支持传统自上而下的 TAM、SAM 和 SOM。审阅过的 Dealroom、Caplight 或 FundedIQ 页面都没有提供物理 AI
              仿真、数据和评估的品类支出，且更广泛的资料使用了不一致的品类标签。Lightwheel 约 $100 million 的 2026
              年第一季度订单是最清晰的商业信号，但这是公司发布的数字，可能包含面向部署的系统，不能视为确认收入、经常性 ARR 或市场规模。CyberDB 未注明年份的 $2 million 收入估算和 Dealroom 的
              $10–50 million 收入区间说明，订单与收入必须分开看。在获得合同构成、收入确认期间和独立品类支出前，估值应采用情景分析，而非精确的市场份额计算。
            claimRefs:
              - CM002
              - CM013
              - CM014
              - CM015
              - CM016
