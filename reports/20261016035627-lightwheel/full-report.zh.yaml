        title: 成熟度、部署与质量控制
        blocks:
          - type: paragraph
            body: >-
              公开证据已超出仅有概念产品的阶段。NVIDIA 报告了一套结合自动检查与人工审查的两阶段质量流程，并描述 GR00T N1.5 在 Geely 真实工厂的 Unitree H1 机器人上运行。World Labs
              报告 EgoSuite 每周提供超过 20,000 小时真实世界数据，但这是一项合作伙伴发布的数字，不是经审计的吞吐量指标。当前招聘说明寻求支持 100,000 至超过 1,000,000
              数据小时项目的流程；这是产能目标，不是已达规模的证明。公开信息仍缺少正常运行时间、事故记录、验收测试通过率、支持响应时间、部署数量及相对独立真实世界基准的表现。
