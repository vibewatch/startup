      - number: '3.2'
        title: 能力差异化与分销能力
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 有文档支持的最强差异化在于工作流整合。CapitalX 将 SimFoundry 和 EgoSuite 描述为训练数据输入，将 RoboFinals 定义为工业级仿真评估，将
              RoboStack 定义为通往真实机器人部署的桥梁。AGI House 案例研究补充了一个战略机制：OpenUSD 资产、Isaac Sim 与 Isaac Lab 工作流、GR00T 模型、Isaac
              Lab-Arena 评估和 Newton 贡献，使 Lightwheel
              进入独立单点方案难以复制的分销渠道。客户在全流程重复使用校准资产、任务定义和评估输出时，这种整合可以提高切换成本。但它不能证明合同锁定、独家数据权利、留存或定价权。开放格式和多个仿真后端也可能支持多重接入，现有证据没有客户采购记录证明买方替换了内部技术栈或明确的直接竞争对手。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 护城河持久性、定价不透明与替代风险
        blocks:
          - type: paragraph
            body: >-
              核心护城河问题是：在平台层吸收最高价值功能之前，Lightwheel 能否把运营上困难的数据采集和基准维护变成标准。反向证据具体但尚无定论：NVIDIA 的 Edify SimReady、NuRec、Cosmos
              产品及其对 Isaac 分销的控制，均与 Lightwheel 技术栈部分重叠；World Labs
              的生成式环境也给手工资产创建带来压力。制衡因素在组织能力，而不只是技术。运营全球人类数据采集、物理校准和跨引擎评估是服务密集型工作，平台厂商可能更愿意留给合作伙伴。投资判断受证据质量限制：官方预取页面没有可用价格或套餐条款，第三方规模指标也不一致。Tracxn
              报告融资 $145 million，FundedIQ 则报告三轮合计 $293
              million；这里保留为冲突记录，不合并，也不视为可用现金。没有实际定价、续约、可移植性和基准采用数据，差异化可信，但持久性尚未证明。
            claimRefs:
              - CP005
              - CP006
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP014
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 平台分销也是主要替代路径
            body: NVIDIA 为 Lightwheel 带来可信度和触达，但其原生资产、重建、合成数据、仿真和评估能力可能吸收技术栈的一部分，或使其商品化。持久性取决于专有运营数据和基准采用，而现有证据没有独立量化其中任何一项。
            calloutType: risk
            claimRefs:
              - CP004
