              - CO009
              - CO015
      - number: '1.3'
        title: 管理层、治理与依赖
        blocks:
          - type: paragraph
            body: >-
              公开管理层证据显示 Steve Xie 是创始人，Haibo Yang 是联合创始人兼总裁；但未披露完整高管名单、董事会构成、投票控制权或继任安排。Xie 此前在 Cruise、NVIDIA 和 NIO
              负责仿真，使公司具备罕见的创始人与市场直接匹配度；但披露稀少的管理层梯队也带来关键人物不确定性。AGI House 的案例研究描述了 Lightwheel 在资产、仿真、训练和评估技术栈上与 NVIDIA
              的整合。这种关系可以加速分销并提升技术可信度，但若 NVIDIA 将重叠的资产能力自动化，或进一步把评估收入内部，平台风险也会集中。只有审阅公司记录、董事会材料和领导层计划后，才能判断控制权或韧性。
            claimRefs:
              - CO001
              - CO005
              - CO015
