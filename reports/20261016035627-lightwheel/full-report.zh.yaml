            body: >-
              具名客户和部署证据指向咨询式、企业主导的销售模式：客户必须明确数据、仿真环境、评估任务和部署支持的范围，而不是简单启用公开的自助方案。开放资产可以提升开发者认知，但没有留存来源披露转化率、合同期限、实际价格、折扣、销售周期、CAC、回本周期、留存或渠道经济性。运营模式还似乎需要物理校准资产生产、数据采集运营、多引擎评估和客户定制集成。这些活动可能强化差异化，却也会挤压毛利率。因此，投资判断需要按软件、数据许可、评估和服务分别拆分收入与交付成本。
