            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.4'
        title: 里程碑与尽调立场
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，公司从 2023 年成立后迅速经历多次融资、2026 年商业订单公告，以及 2026 年 7 月与 MANUS
              就技术整合、联合市场拓展和共同开发达成合作。这一顺序符合公司扩张广泛基础设施业务的特征，但证据仍主要来自公司公告和私募市场数据库。AGI House 还报告了涵盖大型 AI 和工业公司的客户群，并描述 Geely
              工厂部署；这些是有用的商业化信号，却不能替代客户合同、续约或独立验证的生产经济性。因此，时间线证明了活动，不代表财务质量。投资者应优先核查经审计收入、订单转化、客户集中度、法律实体结构、融资优先权、董事会控制权和独立不利事件。
            claimRefs:
