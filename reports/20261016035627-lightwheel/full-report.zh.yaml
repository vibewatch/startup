chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: 身份与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 由 Steve Xie 于 2023 年创办，将自己定位为物理 AI
              基础设施，而非机器人制造商。其产品把物理就绪仿真资产、第一视角人类示范数据、模型或策略评估串起来，在训练前后都能服务机器人团队。公开信息对地理位置的说法并不统一：2026 年 7 月公司公告称总部在 Santa
              Clara，Dealroom 则列出中国北京海淀区。最稳妥的判断是其跨境运营，而不是已验证的单一总部。官网招聘页还显示 Santa Clara 有办公地点及少量当前招聘，但不能据此可靠推断总员工数或地域构成。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
