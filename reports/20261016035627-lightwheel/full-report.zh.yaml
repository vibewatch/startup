    title: 产品架构与反馈闭环
    type: stack
    summary: 分层展示了从世界输入和行为数据，经仿真、评估到部署反馈的记录路径。
    data:
      layers:
        - label: 世界采集
          detail: 轻量级现实世界输入为环境生成提供基础。
          modules:
            - 360 度采集
            - Marble 世界生成
          outputs:
            - 可用于仿真的世界
        - label: 资产与场景组装
          detail: 具备物理信息的对象和生成环境会转换为仿真器格式。
          modules:
            - SimReady 资产
            - OpenUSD 和 MJCF
          outputs:
            - 已配置的仿真场景
        - label: 行为数据
          detail: 人类演示和远程操控提供观测、动作和修正。
          modules:
            - EgoSuite
            - 虚拟现实远程操控
          outputs:
            - 演示数据集
        - label: 仿真与训练
          detail: 合作伙伴工具执行任务，并扩充合成训练样本。
          modules:
            - Isaac Sim
            - MimicGen 和 DexMimicGen
          outputs:
            - 适配后的机器人策略
        - label: 标准化评估
          detail: 可复现的任务和环境揭示能力边界与故障模式。
          modules:
            - RoboFinals
            - 评估钩子
          outputs:
            - 可比结果与故障样本
        - label: 部署反馈
          detail: 现场异常、约束和交付遥测数据回流到下一轮学习周期。
          modules:
            - RoboStack
            - 数据交付控制
          outputs:
            - 排序后的数据与仿真需求
    approximationNotes: 该顺序综合了审阅过的产品描述；不代表每位客户都会购买每一层，也不代表所有集成都已通过生产认证。
    claimRefs:
      - CE004
      - CE005
      - CE009
      - CE012
  - id: FU001
    title: 证据加权的客户旅程
    type: journey-map
    summary: 公开证明在一次生产部署处最强，在续约和扩张处最弱，因此这一顺序是尽调地图，而非经过测量的转化漏斗。
    data:
      items:
        - label: 发现
          detail: 公开资料页和生态可见度让技术团队认识 Lightwheel。
          value: Weak public signal
          touchpoints:
            - 公司控制的开发者资料页
            - 生态与市场数据列表
        - label: 问题与细分匹配
          detail: 汽车、机器人和 AI 团队被描述为目标用户。
          value: Segment evidence
          touchpoints:
            - 合成数据
            - 仿真资产
            - 评估基础设施
        - label: 商业接洽
          detail: 已点名的关系覆盖 OEM、机器人制造商和前沿实验室。
          value: Named but mostly unqualified
          touchpoints:
            - 合作关系
            - 客户名单引用
        - label: 数据与仿真部署
          detail: Geely 案例描述了合成轨迹和模型微调。
          value: Detailed workflow
          touchpoints:
            - SimReady 资产
            - 100:1 仿真到现实增强
        - label: 生产验证
          detail: 据描述，Geely 正在真实工厂运行经过训练的人形机器人。
          value: One documented proof point
          touchpoints:
            - 零部件运输
            - 零件放置
            - 双臂操作
        - label: 续约与扩张
          detail: 公开来源没有量化留存、交叉销售或客户集中度。
          value: Evidence gap
          touchpoints:
            - 续约队列请求
            - 客户集中度请求
    approximationNotes: 阶段顺序是对公开客户工作流的分析性综合；不代表转化率、经过时间，或每个被点名的客户都走完每个阶段。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU007
      - CU009
      - CU012
      - CU016
  - id: FR001
    title: 风险热力图：定性剩余暴露
    type: matrix
    summary: 展示六个证据最充分的风险集群的定性可能性、影响、缓释成熟度和剩余严重程度。
    data:
      columns:
        - label: 可能性
          detail: 基于保留证据的分析师分类；不是测量得出的概率。
        - label: 影响
          detail: 失败情景发生时可能造成的投资影响。
        - label: 缓释成熟度
          detail: 有公开证据支持的缓释措施，不是管理层口径。
        - label: 剩余严重程度
          detail: 计入有证据支持的缓释措施后仍存的暴露。
      rows:
        - label: NVIDIA 平台依赖
          note: 集成覆盖格式、仿真、模型和评估。
          values:
            - label: 高
              detail: 这一依赖存在于多个产品层。
            - label: 高
              detail: 替代或内部化可能削弱差异化。
            - label: 未验证
              detail: 合同保护和可移植性没有公开。
            - label: 高
              detail: 没有公开证据能够消除平台控制风险。
        - label: 跨境合规
          note: 中国注册和美国运营增加了客户尽调摩擦。
          values:
            - label: 中
              detail: 来源指出存在暴露，不是已经发生执法事件。
            - label: 高
              detail: 限制可能阻断敏感客户或数据流。
            - label: 未验证
              detail: 没有分配一手合规或法律顾问记录。
            - label: 高
              detail: 仍需一手法律证据。
        - label: 服务密集型交付
          note: 解决方案团队覆盖从发现到上线和迭代的全过程。
          values:
            - label: 高
              detail: 运营模式明确要求为客户定制工作。
            - label: 高
              detail: 支持瓶颈可能损害交付和续约。
            - label: 早期
              detail: 可以看到招聘，但可规模化的打法尚未得到证明。
            - label: 高
              detail: 产能和单位经济仍未披露。
        - label: 评估质量
          note: 一位合作伙伴称，世界和资产质量限制评估质量。
          values:
            - label: 中
              detail: 这一约束具有结构性，但没有公开 Lightwheel 的失败率。
            - label: 高
              detail: 无效评估会削弱核心产品主张。
            - label: 已展示
              detail: World Labs 记录了一套可重复的协作工作流。
            - label: 中高
              detail: 独立可重复性和仿真到现实的阈值仍缺失。
        - label: 执行能力
          note: 公开员工数量区间存在重大冲突。
          values:
            - label: Unknown
              detail: 无法对员工规模基线完成对账。
            - label: 高
              detail: 团队规模不足可能限制交付和支持。
            - label: 未验证
              detail: 没有薪资名册或人员配置计划。
            - label: 高
              detail: 这一冲突阻碍产能分析。
        - label: 资本透明度
          note: 融资和收入记录以区间呈现，或彼此冲突。
          values:
            - label: 中
              detail: 可以看到多次融资，但看不到现金可用性。
            - label: 高
              detail: 现金跑道或优先权方面的意外可能损害股权回报。
            - label: 未验证
              detail: 没有银行现金、烧钱速度、债务或优先权明细表。
            - label: 高
              detail: 已筹资金不能视为可用现金。
    approximationNotes: 所有类别均为定性判断；不代表任何概率、事故率或货币损失估算。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从资本获取，经相互冲突的经营证明和结构性风险，最终导向继续研究的决定。
    data:
      nodes:
        - id: financing
          label: 融资信号
          detail: 据报道，RMB 1B A++/A+++ 融资已完成，但公开轮次标签并不一致。
        - id: valuation
          label: 估值口径
          detail: 独立页面显示约 $2B，或更宽的 $1B-$2.5B 区间。
        - id: financial-proof
          label: 财务证明缺口
          detail: 约 $3M 和 $10M-$50M 的收入报道缺少可比期间和分母。
        - id: execution
          label: 执行不确定性
          detail: 外部对约 20 名和 50 名全职员工的估计无法对账。
        - id: structural-risk
          label: 结构性风险
          detail: NVIDIA 平台重叠以及美国—中国暴露可能损害战略价值。
        - id: recommendation
          label: 继续研究
          detail: 在定价前，需要取得融资、收入、股权结构表和退出方面的一手证据。
    approximationNotes: 这是一组定性证据序列，并非按概率加权的模型或价值瀑布。
