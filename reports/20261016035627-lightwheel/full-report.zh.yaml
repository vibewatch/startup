      - number: '1.2'
        title: 融资与规模信号
        blocks:
          - type: paragraph
            body: >-
              第三方融资记录表明 Lightwheel 完成过多轮融资，但无法核对出一个达到尽调标准的总额。FundedIQ 报告三轮合计 $293 million；Caplight 则列出 2024 年 5 月至 2026
              年 6 月的六次事件，但未公开金额。Dealroom 只给出宽泛区间：$1 billion 至 $2.5 billion 估值，以及最近报告财年的 $10 million 至 $50 million
              收入。这些是数据库方向性估算，不是经审计账目。Lightwheel 自称的约 $100 million 2026
              年第一季度数字明确指多个基础设施类别的订单，不应视为确认收入、ARR、已转化为现金的订单或可用现金。员工数同样未解决：FundedIQ 报告 101-250 人，Dealroom 则称少于 100 人。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
