              2026 年第一季度订单                            约 $100 million；据 Embodied Global 转述，公司据称 2025 年收入增长十倍，2026
              年第一季度收入预计超过 2025 年全年。Dealroom 和 CyberDB 发布的收入估算差异很大，期间和方法也不清楚。订单不是确认收入或 ARR，因此这些数字都不能证明存在经常性收入基础。
