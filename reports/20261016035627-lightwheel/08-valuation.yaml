    title: Recommendation summary
    columns: [Decision dimension, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Public financing and valuation marks conflict with incomplete financial proof.", "Do not make a price commitment before primary diligence."]
      - [Confidence, low, "No audited revenue, cap table, preference stack, cash balance, or runway is public.", "Treat scenario outputs as conditional rather than forecast."]
      - [Risk rating, high, "Platform dependency, geopolitical exposure, and financing opacity remain material.", "Require explicit downside protections and governance review."]
      - [Valuation stance, stretched-to-unsupported, "Public marks span $1B-$2.5B while revenue reports span about $3M to $10M-$50M.", "A defensible multiple cannot be calculated from non-comparable periods and denominators."]
      - [Target return / hold / exit, not supportable, "No verified entry price, exit comparable, or liquidity timetable is public.", "Defer return underwriting until transaction and operating data are produced."]
    notes: "Public third-party ranges are reproduced with their original units and qualifications; they are not audited, normalized, or converted into ARR."
    claimRefs: [CV001, CV005, CV006, CV007, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would strengthen the view, What would break the thesis]
    rows:
      - [Capital access, "A reported RMB 1B A++/A+++ financing supports investor demand.", "Signed closing documents and cash receipt evidence.", "Undisclosed debt, recourse, or senior preferences consume equity value."]
      - [Use of proceeds, "Reported deployment toward simulation R&D, evaluation, and global delivery fits the product strategy.", "Milestone budget, hiring plan, and measurable delivery outcomes.", "Capital intensity rises without recognized-revenue conversion."]
      - [Evaluation position, "A benchmark and evaluation layer could become a valuable ecosystem control point.", "Independent adoption, recurring contracts, and cross-platform usage.", "NVIDIA absorbs evaluation into a first-party platform."]
      - [Platform relationship, "NVIDIA alignment can provide credibility and distribution.", "Contractual durability and evidence of non-NVIDIA portability.", "Overlapping NVIDIA products commoditize Lightwheel's assets or tools."]
      - [Geographic access, "US and China exposure may widen customer and talent access.", "Audited legal-entity, data-flow, and export-control compliance.", "Technology decoupling blocks customers, capital, compute, or data."]
      - [Execution capacity, "External team estimates indicate an operating organization but disagree on size.", "Current payroll roster, organization chart, and hiring plan.", "Delivery obligations materially exceed staffed capacity."]
    notes: "Arguments distinguish reported facts from investment interpretation; execution and dependency judgments remain conditional on primary diligence."
    claimRefs: [CV003, CV009, CV010, CV011, CV012, CV013, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified entry near the low end of the reported $1B-$2.5B range; audited revenue near the high end of the reported $10M-$50M band; durable independent benchmark adoption.", "Potentially underwritable only after growth, margin, retention, dilution, and exit evidence establish a target-return path.", "Low until primary financial and adoption evidence is produced.", "Entry price rises or evaluation remains a partner-dependent feature."]
      - [Base, "Entry near the reported approximately $2B mark; financing closes as described; commercial evidence remains incomplete.", "Research-more because neither a comparable multiple nor probability-weighted exit value can be defended.", "Most consistent with the currently conflicting public record.", "Revenue, round classification, or preference terms reconcile adversely."]
      - [Bear, "Entry above the public range; revenue nearer the approximately $3M report; senior preference overhang; platform disintermediation or geopolitical restrictions.", "Downside cannot be bounded without liquidation waterfall, cash, burn, and asset-value evidence.", "Material and not quantifiable from public data.", "NVIDIA absorbs the layer, key markets become inaccessible, or capital no longer converts into commercial proof."]
    notes: "Scenario ranges come only from cited public sources; no probability percentages, ARR, cash burn, runway, exit value, or target return is inferred."
    claimRefs: [CV001, CV005, CV006, CV007, CV009, CV010, CV014, CV015, CV016]
