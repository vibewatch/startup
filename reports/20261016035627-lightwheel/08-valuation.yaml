callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Do not underwrite the reported valuation from orders, funding raised, or broad database
      ranges. Re-open the decision only after audited revenue, signed financing terms, fully
      diluted ownership, preference seniority, cash and runway, customer conversion, and a
      credible exit path are available.
    claimRefs: [CV014, CV015, CV016]
