      - ["SimReady library and custom assets", null, "License or enterprise access inferred", null, "Independent descriptions identify proprietary asset sales", "Executed contracts showing unit, term, usage rights, and renewal"]
      - ["EgoSuite datasets", null, "Data license or custom delivery inferred", null, "No public unit or realized rate", "Invoices and cohorts by hours, task diversity, exclusivity, and geography"]
      - ["RoboFinals evaluation and deployment", null, "Platform, service, or project model inferred", null, "No public unit or discount schedule", "Paid scope, compute pass-through, support burden, and renewal behavior"]
    notes: >-
      Null means the retained source set discloses neither list nor realized pricing;
      inferred contract models are hypotheses for diligence, not reported terms.
    claimRefs: [CI001, CI002]
