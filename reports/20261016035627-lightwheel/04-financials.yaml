figures:
  - id: FI001
    title: Commercial conversion path and public evidence breaks
    type: flow
    summary: >-
      Public sources describe the operating flow through contracts and delivery, but
      do not quantify conversion into recognized revenue, gross profit, or cash.
    data:
      nodes:
        - id: community-entry
          label: Open assets and ecosystem exposure
          detail: Community resources and platform relationships can generate enterprise interest; conversion is undisclosed.
        - id: enterprise-scoping
          label: Enterprise scoping
          detail: Simulation assets, data requirements, evaluation tasks, and deployment support are configured for customer needs.
        - id: contract-or-order
          label: Contract or order
          detail: Approximately $100M of Q1 2026 orders is reported, but contract definitions and cancellation rights are unavailable.
        - id: asset-and-data-delivery
          label: Asset and data delivery
          detail: Physics-calibrated assets and egocentric data require production and quality-control operations.
        - id: evaluation-and-integration
          label: Evaluation and integration
          detail: Multi-engine evaluation and deployment support may add software value and service effort.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Timing, backlog conversion, recurring mix, and concentration are not publicly reconciled.
        - id: gross-profit-and-cash
          label: Gross profit and cash generation
          detail: Gross margin, working capital, burn, and runway are not publicly disclosed.
      edges:
        - from: community-entry
          to: enterprise-scoping
          label: lead generation
        - from: enterprise-scoping
          to: contract-or-order
          label: commercial negotiation
        - from: contract-or-order
          to: asset-and-data-delivery
          label: delivery obligation
        - from: asset-and-data-delivery
          to: evaluation-and-integration
          label: customer workflow
        - from: evaluation-and-integration
          to: recognized-revenue
          label: acceptance and recognition
        - from: recognized-revenue
          to: gross-profit-and-cash
          label: cost and collection
    approximationNotes: >-
      The sequence is an analytical operating model, not a quantified conversion
      funnel; no rates, timing, or proportional widths are implied.
    claimRefs: [CI003, CI008, CI010, CI016]
callouts:
  - calloutType: risk
    title: Orders cannot substitute for audited revenue and liquidity
    body: >-
      Treat the reported Q1 order value as a demand signal only. Underwriting requires
      contract enforceability, backlog conversion, recognized revenue, collections,
      gross margin, cash, and burn before it can support a valuation or runway view.
    claimRefs: [CI003, CI007, CI011, CI016]
