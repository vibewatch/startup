company:
  name: Lightwheel
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a multi-stream enterprise model and strong order and
    financing signals, but the disclosed figures are non-comparable and sometimes
    contradictory. Recognized revenue, recurring mix, gross margin, sales efficiency,
    cash, burn, runway, and obligations remain unavailable, preventing a financeable
    base case.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and commercial traction
    body: >-
      Lightwheel appears to monetize several linked products rather than one clean
      software SKU: enterprise access to simulation assets and tooling, licenses for
      egocentric data, evaluation services, and custom deployment work. That breadth
      creates cross-sell potential, but it also mixes potentially recurring software
      and data revenue with labor-intensive delivery. Public traction cannot yet be
      normalized. RobotToday reports approximately $100 million of Q1 2026 orders,
      while Embodied Global relays company claims of tenfold 2025 revenue growth and
      Q1 2026 revenue expected to exceed all of 2025. Dealroom and CyberDB publish
      sharply different revenue estimates with unclear periods and methods. Orders
      are not recognized revenue or ARR, so none of these figures establishes a
      recurring revenue base.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
  - id: go-to-market-and-unit-economics
    title: Go-to-market and unit-economics implications
    body: >-
      The named-customer and deployment evidence points to a consultative,
      enterprise-led motion: customers must scope data, simulation environments,
      evaluation tasks, and deployment support rather than simply activate a public
      self-serve plan. Open assets can create developer awareness, but no retained
      source discloses conversion, contract duration, realized price, discounting,
      sales cycle, CAC, payback, retention, or channel economics. The operating model
      also appears to require physics-calibrated asset production, data-collection
      operations, multi-engine evaluation, and customer-specific integration. Those
      activities may strengthen differentiation while burdening gross margin.
      Underwriting therefore needs revenue and delivery costs separated by software,
      data-license, evaluation, and services streams.
    claimRefs: [CI001, CI002, CI008, CI009, CI010, CI011]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      The public funding record signals access to capital but does not establish
      capital adequacy. FundedIQ reports $293 million raised across three recorded
      rounds, while RobotToday reports approximately $147 million raised and CyberDB
      estimates $145.64 million. Caplight exposes a longer sequence of round dates
      without public amounts. These differences may reflect cut-off dates, currency
      conversion, duplicate-round treatment, or missing disclosures; they should not
      be blended into a synthetic total. More importantly, funding raised is not cash
      available. No retained source provides cash on hand, monthly burn, working
      capital, capex, debt, project-finance obligations, runway, use of funds, or a
      next-round trigger.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Revenue quality is currently unproven rather than demonstrably weak. The
      reported order volume and customer breadth could support a large enterprise
      business, but the evidence does not show how orders convert to recognized
      revenue, what proportion recurs, whether contracts renew, or whether delivery
      costs scale efficiently. Margin expansion is plausible if reusable assets and
      evaluation tooling dominate; margin compression is equally plausible if
      bespoke data collection and deployment remain central. External estimates also
      disagree on revenue, funding, and workforce scale. The investment case should
      remain blocked on audited financials, contract-level cohort data, stream-level
      gross margins, and a cash-to-milestone plan rather than extrapolating from
      orders or financing announcements.
    claimRefs: [CI007, CI009, CI010, CI011, CI014, CI015, CI016]
