      - ["Recognized revenue", "Dealroom: $10–50M latest reported FY; CyberDB: estimated $2M; Embodied Global relays different growth claims", "Low; periods and methods are not comparable", "Sets actual scale and conversion from reported orders", "Audited FY2025 and 2026 year-to-date revenue by stream and geography"]
      - ["ARR and recurring mix", null, "Unavailable", "Determines predictability and appropriate valuation framework", "ARR bridge with recurring definition, renewals, expansion, churn, and services exclusions"]
      - ["Gross margin", null, "Unavailable", "Tests whether asset and evaluation reuse offsets delivery labor and compute", "Gross margin by software, data, evaluation, and custom services, including compute and collection labor"]
      - ["CAC, sales cycle, and payback", null, "Unavailable", "Tests enterprise sales efficiency and capital needed to grow", "Cohort CAC, fully loaded sales cost, median cycle, win rate, and payback"]
      - ["Funding raised", "FundedIQ: $293M; RobotToday: approximately $147M; CyberDB: $145.64M", "Low; source totals conflict", "Financing access does not equal cash available", "Cap table and bank receipts reconciled by round, currency, fees, and secondary proceeds"]
      - ["Workforce proxy", "Dealroom: <100; FundedIQ: 101–250; CyberDB: 11–50", "Low; bands conflict", "Headcount is a rough operating-cost proxy only", "Current payroll census by function, geography, employee type, and fully loaded cost"]
      - ["Cash, burn, runway, debt, and next-round trigger", null, "Unavailable", "Directly determines capital adequacy and financing dependency", "Bank statements, 18-month cash forecast, obligations schedule, use of funds, and milestone-linked financing plan"]
    notes: >-
      Values preserve each publisher's metric label and range. They are not normalized
