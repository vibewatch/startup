  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-size-gap
      missingEvidence: Independent category spend for simulation assets, physical-AI data, model evaluation, and deployment infrastructure by geography and year.
      whyItMatters: Without a category baseline and explicit inclusions, TAM and SAM would be arbitrary and market share cannot be computed.
      diligencePath: Obtain independent analyst data or construct a bottom-up spend model from customer counts, contract values, product mix, and procurement records.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: budget-ownership
      missingEvidence: Product-level contracts identifying buyer, user, payer, budget owner, term, renewal, and implementation-services share.
      whyItMatters: Aggregate orders cannot distinguish repeatable software demand from custom delivery or reveal the actual procurement path.
      diligencePath: Review a representative contract cohort and interview customer procurement, engineering, and operations sponsors.
      relatedQuestionRefs: [QM004, QM007]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: metric-comparability
      missingEvidence: Audited recognized revenue by period and a reconciliation from booked orders to revenue, cancellations, backlog, and cash collection.
      whyItMatters: Public order and estimated-revenue figures use different periods and denominators and cannot support a growth or share conclusion.
      diligencePath: Request audited statements, order schedules, backlog aging, cancellation terms, and revenue-recognition policy.
      relatedQuestionRefs: [QM007, QM008]
      relatedTableRefs: [TM002]
