callouts:
  - calloutType: risk
    title: Do not convert orders into market share
    body: >-
      The public order claim lacks contract mix, duration, cancellations, revenue-recognition
      timing, and independently verified category spend. It is evidence of demand, not a basis
      for precise SOM or share.
    claimRefs: [CM002, CM015, CM016]
