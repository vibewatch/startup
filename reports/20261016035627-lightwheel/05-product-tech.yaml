  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: >-
        Current security certifications, privacy and consent controls for egocentric data,
        vulnerability-management practices, incident-response procedures, and formal quality
        system documentation.
      whyItMatters: >-
        Enterprise and industrial customers may expose sensitive facilities, worker behavior,
        proprietary processes, and safety-critical evaluation results to the platform.
      diligencePath: >-
        Obtain the security package, data-processing agreement, subprocessor list, penetration-test
        summary, incident log, privacy impact assessment, and applicable certification reports.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Production uptime, failed-job rate, data rejection rate, deployment incident history,
        support response times, acceptance-test results, and customer-level renewal evidence.
      whyItMatters: >-
        Partner demonstrations and recruiting targets do not establish repeatable service quality
        across customers, robot types, or operating environments.
      diligencePath: >-
        Review twelve months of service telemetry, severity-one incident records, customer support
        metrics, acceptance criteria, and three production customer references.
      relatedQuestionRefs: [QE004, QE006]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        Public repository activity, package downloads, release cadence, contributor counts, API
        documentation usage, or practitioner-community engagement tied to Lightwheel products.
      whyItMatters: >-
        An active external technical ecosystem would strengthen integration durability and provide
        an adoption signal beyond company and partner case studies.
      diligencePath: >-
        Request official repository and package identifiers, developer-portal analytics, API usage
        cohorts, and a list of externally maintained integrations.
      relatedQuestionRefs: [QE007]
