  - id: FP001
    title: Competitive positioning by integration breadth and buyer control
    type: quadrant
    summary: >-
      Analyst ordinal synthesis shows the strategic trade-off between an integrated workflow and buyer control;
      coordinates are not market-share, quality, or performance measurements.
    data:
      xAxis:
        label: Integration breadth
        min: 1
        max: 5
        lowLabel: Point solution
        highLabel: End-to-end workflow
        description: Ordinal assessment of how much of the data-to-deployment workflow is covered
      yAxis:
        label: Buyer control and portability
        min: 1
        max: 5
        lowLabel: Platform-dependent
        highLabel: Buyer-controlled
        description: Ordinal assessment of buyer control over tools, data, and integration
      points:
        - label: Lightwheel
          x: 5
          'y': 2
          note: Broad integrated scope with material NVIDIA ecosystem dependence
        - label: NVIDIA-native stack
          x: 4
          'y': 1
          note: Broad platform components with control concentrated in the platform owner
        - label: World Labs Marble
          x: 2
          'y': 2
          note: Narrower environment-generation adjacency in the assigned evidence
        - label: Open-source simulator mix
          x: 3
          'y': 4
