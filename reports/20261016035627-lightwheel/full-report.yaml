            title: Scale metrics are not diligence-grade
            body: >-
              The available order, funding, valuation, revenue, and headcount figures mix company claims with database
              estimates and conflicting scopes; none establishes audited revenue quality, cash availability, retention,
              or current fully diluted valuation.
            calloutType: risk
