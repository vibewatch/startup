            title: Founder-market fit comes with platform concentration
            body: >-
              Steve Xie's simulation background supports the product thesis, while Lightwheel's broad NVIDIA integration
              creates both ecosystem leverage and dependency on a platform owner with overlapping capabilities.
            calloutType: insight
