  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded as physical-AI development and deployment infrastructure, not the
              entire robotics, artificial-intelligence, or industrial-automation economy. Within that boundary,
              Lightwheel says it serves four linked jobs: recreating operating environments, generating behavior data,
              evaluating model readiness, and supporting deployment. Independent profiles place its target users across
              embodied robotics, autonomous driving, world-model development, and industrial automation. The principal
              substitutes are internal simulation and data teams, academic or open-source tooling, direct real-world
              data collection, hardware-based testing, and vertically integrated platform vendors. Robot hardware,
              foundation-model revenue, general GPU spend, and downstream labor savings are adjacencies rather than
              addressable Lightwheel spend and should be excluded from any market total.
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool cannot support a conventional top-down TAM, SAM, and SOM. None of the reviewed
              Dealroom, Caplight, or FundedIQ pages provides category-level spending for physical-AI simulation, data,
              and evaluation, while the broader profiles use inconsistent category labels. Lightwheel's approximately
              $100 million of Q1 2026 orders is the clearest commercial signal, but it is company-issued, may include
              deployment-oriented systems, and cannot be treated as recognized revenue, recurring ARR, or market size.
              CyberDB's unspecified-vintage $2 million revenue estimate and Dealroom's $10–50 million revenue range
              illustrate why order and revenue measures must remain separate. Until contract composition, recognition
              periods, and independent category spend are available, valuation work should use scenarios rather than a
              precise market-share calculation.
            claimRefs:
              - CM002
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM013
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates two converging buyer groups. Frontier physical-AI teams need diverse, physically
              realistic data and repeatable evaluation, while industrial operators need a lower-risk path from a bounded
              task to production. Likely users are simulation engineers, robotics researchers, model-evaluation teams,
              and deployment integrators; likely economic buyers are AI or robotics leaders and operating units that own
              automation outcomes. Those budget assignments remain hypotheses because the assigned sources provide no
              procurement documents, contract values by product, or named budget owners. The plausible commercial model
              is multi-part—software or library access, data licensing, evaluation services, and custom deployment
              work—so recurring software value must not be inferred from aggregate orders without a product-level
              contract breakdown.
            claimRefs:
              - CM003
              - CM005
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by the high cost and limited reproducibility of real-world robot training and testing.
              Company materials argue that simulation lets teams test edge cases before committing hardware or
              interrupting production, while World Labs describes environment creation and scalable evaluation as
              binding bottlenecks. Its partner case study claims that generated worlds can reduce environment creation
              from weeks to minutes, but that statement is partner-issued rather than an independent benchmark.
              Constraints remain material: simulation fidelity, transfer to real environments, workflow integration,
              dependence on NVIDIA-centered tooling, and cross-border data or export-control concerns. Lightwheel
              therefore participates in a potentially valuable picks-and-shovels layer, but adoption speed and margin
              structure will depend on whether customers buy repeatable infrastructure or labor-intensive custom
              delivery.
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert orders into market share
            body: >-
              The public order claim lacks contract mix, duration, cancellations, revenue-recognition timing, and
              independently verified category spend. It is evidence of demand, not a basis for precise SOM or share.
            calloutType: risk
            claimRefs:
              - CM002
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is wider than a list of venture-backed robotics-data vendors. Lightwheel spans
              simulation-ready assets, human and synthetic training data, model evaluation, and deployment support, so a
              buyer can compare it with an integrated platform, assemble open-source simulators and academic benchmarks,
              procure a narrower world-generation or data service, or build the workflow internally. NVIDIA is both the
              most important distribution platform and the strongest likely entrant because its native stack touches
              asset labeling, environment reconstruction, synthetic-data generation, simulation, and foundation models.
              World Labs' Marble is an adjacent environment-generation alternative, while MuJoCo, Genesis, Isaac-based
              tooling, and internal calibration teams are substitutes rather than like-for-like vendors. Third-party
              databases do not resolve the boundary: Tracxn's broad set emphasizes general AI-services firms, while
              Caplight's embedding-based set names Mecka AI, NVIDIA, and Zero Matter. This divergence makes a
              class-based landscape more reliable than an asserted league table.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP011
      - number: '3.2'
        title: Capability differentiation and distribution power
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's strongest documented differentiation is workflow integration. CapitalX describes SimFoundry
              and EgoSuite as training-data inputs, RoboFinals as industrial-grade simulation evaluation, and RoboStack
              as the bridge to real-robot deployment. The AGI House case study adds a strategic mechanism: OpenUSD
              assets, Isaac Sim and Isaac Lab workflows, GR00T model use, Isaac Lab-Arena evaluation, and Newton
              contributions place Lightwheel in a distribution channel that is difficult for an independent point
              solution to reproduce. That integration can raise switching costs when customers reuse calibrated assets,
              task definitions, and evaluation outputs across the workflow. It does not prove contractual lock-in,
              exclusive data rights, retention, or pricing power. Open formats and multiple simulation backends may also
              permit multi-homing, and the assigned evidence contains no customer procurement record showing that a
              buyer displaced an internal stack or a named direct competitor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability, pricing opacity, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The central moat question is whether Lightwheel can turn operationally difficult data collection and
              benchmark curation into a standard before the platform layer absorbs the highest-value functions. The
              adverse evidence is concrete but not conclusive: NVIDIA's Edify SimReady, NuRec, Cosmos products, and
              control of Isaac distribution overlap with parts of Lightwheel's stack, and World Labs' generative
              environments pressure manual asset creation. The counterweight is organizational rather than purely
              technical. Running global human-data collection, physics calibration, and cross-engine evaluation is
              service-heavy work that a platform vendor may prefer to leave to partners. Underwriting is constrained by
              evidence quality: official prefetched pages exposed no usable price or package terms, and third-party
              scale indicators are inconsistent. Tracxn reports $145 million raised, while FundedIQ reports $293 million
              across three rounds; those amounts are retained as conflicting records, not combined or treated as cash
              available. Without realized pricing, renewal, portability, and benchmark-adoption data, differentiation is
              credible but durability is unproven.
            claimRefs:
              - CP005
              - CP006
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform distribution is also the principal displacement vector
            body: >-
              NVIDIA gives Lightwheel credibility and reach, but native asset, reconstruction, synthetic-data,
              simulation, and evaluation capabilities could absorb or commoditize parts of the stack. Durability depends
              on proprietary operational data and benchmark adoption, neither of which is independently quantified in
              the assigned evidence.
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial traction
        blocks:
          - type: paragraph
            body: >-
              Lightwheel appears to monetize several linked products rather than one clean software SKU: enterprise
              access to simulation assets and tooling, licenses for egocentric data, evaluation services, and custom
              deployment work. That breadth creates cross-sell potential, but it also mixes potentially recurring
              software and data revenue with labor-intensive delivery. Public traction cannot yet be normalized.
              RobotToday reports approximately $100 million of Q1 2026 orders, while Embodied Global relays company
              claims of tenfold 2025 revenue growth and Q1 2026 revenue expected to exceed all of 2025. Dealroom and
              CyberDB publish sharply different revenue estimates with unclear periods and methods. Orders are not
              recognized revenue or ARR, so none of these figures establishes a recurring revenue base.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
