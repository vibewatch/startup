      - number: '4.2'
        title: Go-to-market and unit-economics implications
        blocks:
          - type: paragraph
            body: >-
              The named-customer and deployment evidence points to a consultative, enterprise-led motion: customers must
              scope data, simulation environments, evaluation tasks, and deployment support rather than simply activate
              a public self-serve plan. Open assets can create developer awareness, but no retained source discloses
              conversion, contract duration, realized price, discounting, sales cycle, CAC, payback, retention, or
              channel economics. The operating model also appears to require physics-calibrated asset production,
              data-collection operations, multi-engine evaluation, and customer-specific integration. Those activities
              may strengthen differentiation while burdening gross margin. Underwriting therefore needs revenue and
              delivery costs separated by software, data-license, evaluation, and services streams.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI008
              - CI010
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The public funding record signals access to capital but does not establish capital adequacy. FundedIQ
              reports $293 million raised across three recorded rounds, while RobotToday reports approximately $147
              million raised and CyberDB estimates $145.64 million. Caplight exposes a longer sequence of round dates
              without public amounts. These differences may reflect cut-off dates, currency conversion, duplicate-round
              treatment, or missing disclosures; they should not be blended into a synthetic total. More importantly,
              funding raised is not cash available. No retained source provides cash on hand, monthly burn, working
              capital, capex, debt, project-finance obligations, runway, use of funds, or a next-round trigger.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is currently unproven rather than demonstrably weak. The reported order volume and
              customer breadth could support a large enterprise business, but the evidence does not show how orders
              convert to recognized revenue, what proportion recurs, whether contracts renew, or whether delivery costs
              scale efficiently. Margin expansion is plausible if reusable assets and evaluation tooling dominate;
              margin compression is equally plausible if bespoke data collection and deployment remain central. External
              estimates also disagree on revenue, funding, and workforce scale. The investment case should remain
              blocked on audited financials, contract-level cohort data, stream-level gross margins, and a
              cash-to-milestone plan rather than extrapolating from orders or financing announcements.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Orders cannot substitute for audited revenue and liquidity
            body: >-
              Treat the reported Q1 order value as a demand signal only. Underwriting requires contract enforceability,
              backlog conversion, recognized revenue, collections, gross margin, cash, and burn before it can support a
              valuation or runway view.
            calloutType: risk
            claimRefs:
              - CI003
              - CI007
              - CI011
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer job
        blocks:
          - type: paragraph
            body: >-
              Lightwheel packages four linked capabilities rather than a single simulation tool. SimFoundry turns
              real-world inputs into training and validation environments; EgoSuite supplies human-behavior data;
              RoboFinals evaluates robot policies with standardized tasks and reproducible environments; and RoboStack
              returns deployment failures and constraints to the next learning cycle. That structure addresses the
              customer's full job of assembling realistic worlds, producing demonstrations, measuring model performance,
              and improving a deployed system. Independent company databases also describe physics-accurate,
              simulation-ready assets and data solutions, but they do not establish product-level revenue, retention, or
              realized performance. The investable product thesis is therefore breadth and workflow integration, not a
              verified claim that any one module is already a category standard.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
      - number: '5.2'
        title: Architecture and operating workflow
        blocks:
          - type: paragraph
            body: >-
              The documented workflow combines asset formats, simulation platforms, world generation, teleoperation,
              model training, and evaluation. NVIDIA says Lightwheel's platform uses OpenUSD and MJCF assets inside
              Isaac Sim and connects simulation to virtual-reality teleoperation; World Labs describes a complementary
              path from lightweight capture through Marble world generation, USD conversion, Isaac Sim integration,
              behavior execution, and RoboFinals evaluation. The public job specification adds a delivery layer of
              schemas, adapters, conversion, cloud transfer, APIs, SDKs, observability, and cost controls. This is
              technically specific enough to show a coherent operating model, but much of the stack depends on partner
              infrastructure. Customers must diligence portability across physics engines, data formats, cloud
              environments, and model families before treating the workflow as vendor-neutral.
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE012
      - number: '5.3'
        title: Maturity, deployment, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Public evidence moves beyond a concept-only product. NVIDIA reports a two-stage quality process combining
              automated checks with manual review and describes GR00T N1.5 running on Unitree H1 robots in a live Geely
              factory. World Labs reports that EgoSuite supplies more than 20,000 hours of real-world data weekly,
              although that is a partner-published figure rather than an audited throughput metric. A current recruiting
              specification seeks processes for 100,000-to-more-than-1,000,000 data-hour programs; this is a capacity
              target, not proof of achieved scale. Missing public measures include uptime, incident history,
              acceptance-test pass rates, support response times, deployment counts, and performance against independent
              real-world baselines.
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE013
      - number: '5.4'
        title: Differentiation, dependencies, and control gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is the integrated feedback loop: reusable physics-aware assets, scalable
              demonstrations, controlled evaluation, and field feedback can reinforce one another. The same design
              creates concentration risk. AGI House argues that NVIDIA capabilities already overlap portions of
              Lightwheel's stack, making platform evolution a potential substitute as well as an enabler. Public
              developer evidence is also weak: the company-controlled Codédex profile showed no projects or posts when
              accessed, so it cannot substantiate an external contributor ecosystem or adoption funnel. More
              importantly, the reviewed sources do not disclose security certifications, privacy controls for egocentric
              data, model-evaluation governance, vulnerability management, service-level commitments, or formal
              quality-system certifications. Those are material diligence gaps for deployments in factories and other
              sensitive environments.
            claimRefs:
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform leverage cuts both ways
            body: >-
              NVIDIA distribution and tooling accelerate product delivery, but overlapping first-party capabilities
              could reduce Lightwheel's control over formats, simulation workflows, model layers, and customer access.
            calloutType: risk
            claimRefs:
              - CE006
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              Lightwheel appears to sell into two overlapping customer systems. Automotive OEMs, Tier 1 suppliers, and
              autonomous-driving teams buy simulation-ready assets, synthetic data, and deployment support, while
              robotics builders and frontier AI laboratories use data-generation and evaluation infrastructure. Preqin
              identifies Tier 1 and autonomous-driving companies as target users, Dofactory describes support for
              robotics teams, and AGI House names organizations across manufacturing, robotics, and AI research.
              Dealroom separately reports automotive OEM and Tier 1 partnerships in China and international markets. The
              evidence does not cleanly separate buyer, daily user, and economic payer, so the segmentation is
              operational rather than a verified revenue mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption proof and deployment quality
        blocks:
          - type: paragraph
            body: >-
              The best public proof is Geely: AGI House describes a pipeline in which Lightwheel assets and simulation
              environments generated training data for Unitree H1 humanoid robots that were then deployed in a live
              automotive production facility. The same source reports a 100:1 simulated-to-real trajectory ratio and
              names autonomous component transport, part placement, and dual-arm handling as deployed tasks. Other named
              relationships are materially weaker. Google DeepMind, BYD, AgiBot, ByteDance, Fourier, and Galbot appear
              in a customer list without contract or production detail; Figure is corroborated as a relationship by
              Preqin, while Alibaba's Qwen team is described as adopting RoboFinals for model evaluation.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
      - number: '6.3'
        title: Durability and expansion mechanics
        blocks:
          - type: paragraph
            body: >-
              Public descriptions support several plausible expansion paths but do not prove recurring durability. The
              visible model combines simulation-tool subscriptions, data licensing, evaluation services, and custom
              deployment work; a customer could therefore expand from assets into data generation, evaluation, or
              factory implementation. That mechanism is strategically coherent, yet none of the eight retained sources
              discloses NRR, GRR, churn, renewal rates, contract length, or customer revenue concentration. External
              scale proxies also conflict: CyberDB, Dealroom, and FundedIQ publish materially different employee bands,
              which makes those databases unsuitable substitutes for customer-level operating evidence.
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
              - CU009
              - CU012
              - CU016
      - number: '6.4'
        title: Concentration risk and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              NVIDIA is both a distribution advantage and a concentration risk. AGI House says Lightwheel's formats,
              simulation workflow, model fine-tuning, evaluation, and asset contributions run through NVIDIA
              technologies, while warning that overlapping NVIDIA capabilities could compress Lightwheel's role or
              absorb the evaluation layer. This is adverse strategic analysis, not an independent customer benchmark,
              and no public source quantifies revenue exposure to NVIDIA-linked programs or any named customer. The
              investment case therefore requires a contract-level cohort schedule showing pilots, production
              deployments, renewals, expansion, customer concentration, partner-sourced revenue, and cancellations
              before broad adoption or durable land-and-expand economics can be credited.
            claimRefs:
              - CU010
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: One production proof point does not establish portfolio durability
            body: >-
              Geely provides a credible deployment example, but public evidence does not disclose renewal,
              concentration, contract size, or cohort behavior for the broader named customer set.
            calloutType: risk
            claimRefs:
              - CU004
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual exposure
        blocks:
          - type: paragraph
            body: >-
              The risk ranking is led by platform and geopolitical exposure, not by a verified incident. Independent
              analysis describes integration with NVIDIA formats, simulators, models, and evaluation infrastructure
              across the product stack, while also identifying NVIDIA capabilities that could substitute for portions of
              Lightwheel's offering. The same analysis flags compliance friction created by Chinese incorporation,
              United States operations, and work with Western customers. Delivery risk is also material: a reposted
              solutions role describes tailored architecture and direct customer support from discovery through rollout,
              which implies that scaling orders may require scarce technical implementation capacity. The heatmap
              therefore treats mitigation maturity as unverified unless the pool contains a demonstrated operating
              countermeasure; it does not treat the absence of a reported incident as evidence that an incident has not
              occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and corporate-structure risk
        blocks:
          - type: paragraph
            body: >-
              The assigned pool contains no regulator, court, certification, sanctions, privacy, export-control, or
              official corporate-filing record. The available evidence is therefore sufficient to identify exposure but
              not to verify compliance status. AGI House reports a Beijing-incorporated operating company with United
              States operations and says defense-adjacent, export-control-sensitive, or data-sovereignty customers may
              face compliance questions. Dealroom names Guanglun Intelligent (Beijing) Technology as the operating
              business, while Caplight lists financing events but withholds public filing records and transaction
              values. These signals make the legal-entity map, cross-border data flows, investor rights, benchmark IP,
              and contractual termination rights high-priority diligence. None of the sources establishes an enforcement
              action, license failure, or security incident.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
              - CR015
      - number: '7.3'
        title: Operational delivery and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Operational scaling appears implementation-intensive. The solutions role spans customer discovery,
              architecture, engineering coordination, rollout, and iteration across data collection, simulation,
              synthetic data, and evaluation. World Labs provides a mitigating proof point: a collaborative workflow
              connected Marble, Omniverse NuRec, Isaac Sim, and Lightwheel assets, and the partner reports reducing
              environment creation from weeks to minutes. That proof remains partner-issued and does not establish
              repeatable customer economics, reliability, or support load. Capacity is also opaque: Dealroom reports
              fewer than 100 employees, FundedIQ reports a 101-250 band, and CyberDB estimates 11-50. Private-market
              records similarly report funding raised rather than cash available, and Dealroom's revenue field is a
              broad latest-fiscal-year range rather than ARR, margin, burn, or runway.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's ecosystem strategy offers distribution and technical leverage, but it also concentrates
              control outside the company. The NVIDIA relationship touches asset formats, simulation, model fine-tuning,
              and evaluation; the World Labs demonstration adds Marble and NuRec to a workflow that still terminates in
              Isaac Sim. RoboFinals has an early adoption signal from Alibaba's Qwen team, but the source explicitly
              says this is not proof of standard-setting dominance. The investable mitigation would be contractual and
              operational evidence: portable formats, multiple simulator backends, retained IP, replacement suppliers,
              customer-level gross-margin data, and service capacity that scales faster than deployments. Thesis-break
              triggers are loss of platform access or benchmark control, a cross-border restriction blocking material
              customers, repeated deployment failures, or audited cash and margin evidence showing that delivery growth
              consumes rather than creates durable enterprise value.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite from private-market headline metrics
            body: >-
              Dealroom, FundedIQ, CyberDB, and Caplight expose incompatible ranges or incomplete values. Funding raised
              is not cash available, Dealroom revenue is not ARR, and employee bands are not a verified payroll count.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The investable conclusion is research-more, not buy. Independent databases place Lightwheel somewhere
              between a $1 billion and $2.5 billion valuation, while one screener reports approximately $2 billion;
              those marks are directional rather than transaction documents. The same public record reports revenue as
              either approximately $3 million or a broad $10 million to $50 million range, without a common period,
              accounting basis, or recurring-revenue denominator. That prevents a meaningful revenue multiple, cash-flow
              model, target return, hold period, or exit calculation. Entry discipline should therefore require the
              signed financing documents, fully diluted capitalization, liquidation preferences, audited recognized
              revenue, and customer-level conversion of orders into revenue before price negotiations. Until those items
              reconcile, the reported valuation range looks stretched relative to the quality of public financial proof
              rather than demonstrably cheap or expensive on a comparable metric.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and commercial proof
        blocks:
          - type: paragraph
            body: >-
              Financing evidence confirms substantial investor appetite but not a clean capital history. TMTPost reports
              a RMB 1 billion A++/A+++ financing, Unicorn Screener labels the latest round a $147.5 million Series A,
              and StartupFundraising calls a $140 million disclosed total with a March 2026 Series B. These labels and
              totals may reflect different inclusion rules, currencies, tranches, or update vintages, but the public
              pages do not reconcile them. Caplight exposes round dates while withholding amount and valuation fields on
              its public page, reinforcing that the missing cap-table detail is material rather than safely inferable.
              TMTPost says proceeds are intended for simulation-engine R&D, evaluation-system upgrades, and global
              delivery capacity; that is strategically coherent, but funding raised is not cash available and does not
              establish runway. Investors should treat the financing record as proof of access to capital, not proof of
              revenue quality, liquidity, or favorable preference terms.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Thesis, anti-thesis, and risk-adjusted view
        blocks:
          - type: paragraph
            body: >-
              The thesis is that scarce simulation assets, behavior data, and evaluation infrastructure can become a
              control point in physical AI, with external financing and NVIDIA ecosystem alignment providing
              distribution and credibility. The anti-thesis is equally important: AGI House identifies a real platform
              risk because NVIDIA capabilities overlap parts of Lightwheel's stack and could absorb evaluation into a
              first-party platform. The same source describes the company's dual US/China positioning as both an access
              advantage and a vulnerability as export controls, data sovereignty, and technology-stack separation
              intensify. Execution capacity is also unclear: Airframe lists 50 FTEs while Unicorn Screener reports
              approximately 20 team members and 13 open roles. These are not equivalent measures or necessarily
              contemporaneous, so they should be reconciled rather than averaged. The upside case depends on benchmark
              adoption and commercial conversion; the downside case combines platform dependency, geopolitical friction,
              opaque preferences, and weak financial comparability.
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Scenarios, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain conditional because public evidence does not support a probability-weighted
              cash-flow model. A bull case requires authenticated entry pricing near the low end of the reported $1
              billion to $2.5 billion range, audited revenue trending toward the high end of the reported $10 million to
              $50 million band, and evidence that the evaluation layer is becoming a durable standard rather than a
              partner feature. The base case assumes valuation near the approximately $2 billion mark but delays
              underwriting until revenue, cap table, and round taxonomy reconcile. The bear case is a price above the
              reported range, revenue nearer the approximately $3 million report, preference overhang, or NVIDIA
              disintermediation. No public evidence establishes an IPO timetable, strategic buyer, comparable M&A
              transaction, or secondary liquidity path. Final diligence should obtain audited financials,
              order-to-revenue conversion, customer concentration and renewal data, legal-entity structure, preference
              stack, cash balance, burn, runway, and board governance; failure to obtain them is a thesis-break trigger.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Do not underwrite the reported valuation from orders, funding raised, or broad database ranges. Re-open
              the decision only after audited revenue, signed financing terms, fully diluted ownership, preference
              seniority, cash and runway, customer conversion, and a credible exit path are available.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
              - CV016
