  - id: FE001
    title: Product architecture and feedback loop
    type: stack
    summary: >-
      A layered view of the documented path from world inputs and behavior data through simulation, evaluation, and
      deployment feedback.
    data:
      layers:
        - label: World capture
          detail: Lightweight real-world inputs provide grounding for environment generation.
          modules:
            - 360-degree capture
            - Marble world generation
          outputs:
            - Simulation-ready world
        - label: Asset and scene assembly
          detail: Physics-aware objects and generated environments are converted into simulator formats.
          modules:
            - SimReady assets
            - OpenUSD and MJCF
          outputs:
            - Configured simulation scene
        - label: Behavior data
          detail: Human demonstrations and teleoperation supply observations, actions, and corrections.
          modules:
            - EgoSuite
            - Virtual-reality teleoperation
          outputs:
            - Demonstration dataset
        - label: Simulation and training
          detail: Partner tools execute tasks and augment synthetic training examples.
          modules:
            - Isaac Sim
            - MimicGen and DexMimicGen
          outputs:
            - Adapted robot policy
        - label: Standardized evaluation
          detail: Reproducible tasks and environments expose capability boundaries and failure modes.
          modules:
            - RoboFinals
            - Evaluation hooks
          outputs:
            - Comparable results and failure samples
        - label: Deployment feedback
          detail: Field anomalies, constraints, and delivery telemetry return to the next learning cycle.
          modules:
            - RoboStack
            - Data delivery controls
          outputs:
            - Prioritized data and simulation requirements
    approximationNotes: >-
      The ordering synthesizes the reviewed product descriptions; it does not imply that every customer buys every layer
      or that all integrations are production-certified.
    claimRefs:
      - CE004
      - CE005
      - CE009
      - CE012
