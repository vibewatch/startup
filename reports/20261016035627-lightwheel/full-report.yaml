chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Lightwheel was founded in 2023 by Steve Xie and presents itself as infrastructure for physical AI rather
              than as a robot manufacturer. Its product surface links physics-ready simulation assets, egocentric
              human-demonstration data, and model or policy evaluation, creating a data workflow that can serve robotics
              teams before and after training. Public geography is less settled than the brand narrative: a July 2026
              company release calls Lightwheel Santa Clara-headquartered, while Dealroom lists Haidian, China as
              headquarters. The most defensible interpretation is a cross-border operating footprint, not a verified
              single headquarters. The official careers page adds a Santa Clara workplace and a small current hiring
              signal, but it is not a reliable proxy for total headcount or geographic mix.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Financing and scale signals
        blocks:
          - type: paragraph
            body: >-
              Third-party funding records establish that Lightwheel has completed multiple financings, but they do not
              reconcile to a single diligence-grade total. FundedIQ reports $293 million across three recorded rounds,
              whereas Caplight lists six events from May 2024 through June 2026 without public amounts. Dealroom exposes
              only broad ranges: a $1 billion to $2.5 billion valuation and $10 million to $50 million of
              latest-reported fiscal-year revenue. Those figures are directional database estimates, not audited
              accounts. Lightwheel's own approximately $100 million Q1 2026 figure is explicitly orders across several
              infrastructure categories; it should not be treated as recognized revenue, ARR, bookings converted to
              cash, or cash available. Headcount is similarly unresolved because FundedIQ reports a 101-250 band while
              Dealroom reports fewer than 100 people.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO009
              - CO015
      - number: '1.3'
        title: Leadership, governance, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The public leadership evidence identifies Steve Xie as founder and Haibo Yang as co-founder and president;
              it does not reveal a complete executive roster, board composition, voting control, or succession
              arrangements. Xie's prior simulation leadership across Cruise, NVIDIA, and NIO gives the company unusually
              direct founder-market fit, but the sparse disclosed bench also creates key-person uncertainty. AGI House's
              case study describes NVIDIA integration across Lightwheel's assets, simulation, training, and evaluation
              stack. That relationship can accelerate distribution and technical credibility, yet it also concentrates
              platform risk if NVIDIA automates overlapping asset capabilities or brings evaluation further in-house. No
              conclusion about control rights or resilience should be drawn until corporate records, board materials,
              and the leadership plan are reviewed.
            claimRefs:
              - CO001
              - CO005
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.4'
        title: Milestones and diligence posture
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows a fast transition from a 2023 founding to repeated financing events, a 2026
              commercial-order announcement, and a July 2026 MANUS partnership covering technical integration, joint
              go-to-market, and co-development. The sequence is consistent with a company scaling a broad infrastructure
              proposition, but the evidence remains weighted toward company announcements and private-market databases.
              AGI House also reports a customer set spanning major AI and industrial names and describes a Geely factory
              deployment; these are useful commercialization signals but are not substitutes for customer contracts,
              renewals, or independently verified production economics. The timeline therefore establishes activity, not
              financial quality. Investor diligence should prioritize audited revenue, order conversion, customer
              concentration, legal-entity structure, financing preferences, board control, and independent adverse-event
              checks.
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO015
              - CO016
