figures:
  - id: FU001
    title: Evidence-weighted customer journey
    type: journey-map
    summary: >-
      Public proof is strongest at one production deployment and weakest at renewal and
      expansion, so the sequence is a diligence map rather than a measured conversion funnel.
    data:
      items:
        - label: Discovery
          detail: Public profiles and ecosystem visibility introduce Lightwheel to technical teams.
          value: Weak public signal
          touchpoints:
            - Company-controlled developer profile
            - Ecosystem and market-data listings
        - label: Problem and segment fit
          detail: Automotive, robotics, and AI teams are described as target users.
          value: Segment evidence
          touchpoints:
            - Synthetic data
            - Simulation assets
            - Evaluation infrastructure
        - label: Commercial engagement
          detail: Named relationships span OEMs, robot builders, and frontier laboratories.
          value: Named but mostly unqualified
          touchpoints:
            - Partnerships
            - Customer-list references
        - label: Data and simulation deployment
          detail: The Geely case describes synthetic trajectories and model fine-tuning.
          value: Detailed workflow
          touchpoints:
            - SimReady assets
            - "100:1 simulated-to-real augmentation"
        - label: Production validation
          detail: Geely is described as operating trained humanoid robots in a live factory.
          value: One documented proof point
          touchpoints:
            - Component transport
            - Part placement
            - Dual-arm manipulation
        - label: Renewal and expansion
          detail: Public sources do not quantify retention, cross-sell, or customer concentration.
          value: Evidence gap
          touchpoints:
            - Renewal cohort request
            - Account concentration request
    approximationNotes: >-
      Stage order is an analytical synthesis of the public customer workflow; it does not
      imply conversion rates, elapsed time, or that every named account reached each stage.
    claimRefs: [CU001, CU002, CU004, CU005, CU007, CU009, CU012, CU016]
