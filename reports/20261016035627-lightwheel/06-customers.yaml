company:
  name: Lightwheel
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to a mixed customer base spanning automotive manufacturers,
    robotics companies, and frontier AI labs, but only the Geely deployment is described
    with production-level detail. The strongest diligence conclusion is therefore not
    broad adoption, but a narrow proof point surrounded by material retention,
    concentration, contract, and deployment-vintage gaps.
sections:
  - id: customer-segments
    title: Customer segments and buying centers
    body: >-
      Lightwheel appears to sell into two overlapping customer systems. Automotive OEMs,
      Tier 1 suppliers, and autonomous-driving teams buy simulation-ready assets, synthetic
      data, and deployment support, while robotics builders and frontier AI laboratories
      use data-generation and evaluation infrastructure. Preqin identifies Tier 1 and
      autonomous-driving companies as target users, Dofactory describes support for
      robotics teams, and AGI House names organizations across manufacturing, robotics,
      and AI research. Dealroom separately reports automotive OEM and Tier 1 partnerships
      in China and international markets. The evidence does not cleanly separate buyer,
      daily user, and economic payer, so the segmentation is operational rather than a
      verified revenue mix.
    claimRefs: [CU001, CU002, CU003, CU011]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof and deployment quality
    body: >-
      The best public proof is Geely: AGI House describes a pipeline in which Lightwheel
      assets and simulation environments generated training data for Unitree H1 humanoid
      robots that were then deployed in a live automotive production facility. The same
      source reports a 100:1 simulated-to-real trajectory ratio and names autonomous
      component transport, part placement, and dual-arm handling as deployed tasks. Other
      named relationships are materially weaker. Google DeepMind, BYD, AgiBot, ByteDance,
      Fourier, and Galbot appear in a customer list without contract or production detail;
      Figure is corroborated as a relationship by Preqin, while Alibaba's Qwen team is
      described as adopting RoboFinals for model evaluation.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
  - id: durability-expansion
    title: Durability and expansion mechanics
    body: >-
      Public descriptions support several plausible expansion paths but do not prove
      recurring durability. The visible model combines simulation-tool subscriptions,
      data licensing, evaluation services, and custom deployment work; a customer could
      therefore expand from assets into data generation, evaluation, or factory
      implementation. That mechanism is strategically coherent, yet none of the eight
      retained sources discloses NRR, GRR, churn, renewal rates, contract length, or
      customer revenue concentration. External scale proxies also conflict: CyberDB,
      Dealroom, and FundedIQ publish materially different employee bands, which makes
      those databases unsuitable substitutes for customer-level operating evidence.
    claimRefs: [CU009, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
  - id: concentration-diligence
    title: Concentration risk and diligence priorities
    body: >-
      NVIDIA is both a distribution advantage and a concentration risk. AGI House says
      Lightwheel's formats, simulation workflow, model fine-tuning, evaluation, and asset
      contributions run through NVIDIA technologies, while warning that overlapping
      NVIDIA capabilities could compress Lightwheel's role or absorb the evaluation
      layer. This is adverse strategic analysis, not an independent customer benchmark,
      and no public source quantifies revenue exposure to NVIDIA-linked programs or any
      named customer. The investment case therefore requires a contract-level cohort
      schedule showing pilots, production deployments, renewals, expansion, customer
      concentration, partner-sourced revenue, and cancellations before broad adoption or
      durable land-and-expand economics can be credited.
    claimRefs: [CU010, CU016]
callouts:
  - calloutType: risk
    title: One production proof point does not establish portfolio durability
    body: >-
      Geely provides a credible deployment example, but public evidence does not disclose
      renewal, concentration, contract size, or cohort behavior for the broader named
      customer set.
    claimRefs: [CU004, CU016]
