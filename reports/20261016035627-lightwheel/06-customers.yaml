      severity: material
      topic: retention-gap
      missingEvidence: >-
        Account-level NRR, GRR, churn, renewal, contract-duration, expansion, and
        cancellation data segmented by customer cohort.
      whyItMatters: >-
        Named relationships and one production deployment do not establish recurring
        revenue durability or land-and-expand economics.
      diligencePath: >-
        Obtain a management-exported cohort schedule, reconcile it to recognized revenue,
        and sample contracts and invoices for the largest and recently renewed accounts.
      relatedQuestionRefs: [QU006]
    - type: stale
