        - label: "Impact"
          detail: "Potential investment impact if the failure scenario occurs."
        - label: "Mitigation maturity"
          detail: "Publicly evidenced mitigation, not management assertion."
        - label: "Residual severity"
          detail: "Exposure remaining after evidenced mitigations."
      rows:
        - label: "NVIDIA platform dependence"
          note: "Integration spans formats, simulation, models, and evaluation."
          values:
            - label: "High"
              detail: "The dependency is present across multiple product layers."
            - label: "High"
              detail: "Substitution or internalization could weaken differentiation."
            - label: "Unverified"
              detail: "Contract protections and portability were not public."
            - label: "High"
              detail: "No public evidence closes the platform-control risk."
        - label: "Cross-border compliance"
          note: "Chinese incorporation and United States operations create customer diligence friction."
          values:
            - label: "Medium"
              detail: "The source identifies exposure, not an enforcement event."
            - label: "High"
              detail: "Restrictions could block sensitive customers or data flows."
            - label: "Unverified"
              detail: "No primary compliance or counsel record was allocated."
            - label: "High"
              detail: "Primary legal evidence is still required."
        - label: "Service-heavy delivery"
          note: "The solutions role covers discovery through rollout and iteration."
          values:
            - label: "High"
              detail: "The operating model explicitly requires tailored customer work."
            - label: "High"
              detail: "Support bottlenecks could impair delivery and renewals."
            - label: "Early"
              detail: "Hiring is visible, but scalable playbooks are not proven."
            - label: "High"
              detail: "Capacity and unit economics remain undisclosed."
        - label: "Evaluation quality"
          note: "A partner says world and asset quality constrain evaluation quality."
          values:
            - label: "Medium"
              detail: "The constraint is structural, but no Lightwheel failure rate is public."
            - label: "High"
              detail: "Invalid evaluation would weaken the core product proposition."
            - label: "Demonstrated"
              detail: "World Labs documents one repeatable collaborative workflow."
            - label: "Medium-high"
              detail: "Independent repeatability and sim-to-real thresholds remain absent."
        - label: "Execution capacity"
          note: "Public employee bands conflict materially."
          values:
            - label: "Unknown"
              detail: "The workforce baseline cannot be reconciled."
            - label: "High"
              detail: "An undersized team could constrain delivery and support."
            - label: "Unverified"
              detail: "No payroll roster or staffing plan was available."
            - label: "High"
              detail: "The conflict blocks capacity analysis."
        - label: "Capital transparency"
          note: "Funding and revenue records are range-based or conflicting."
          values:
            - label: "Medium"
              detail: "Repeated financing is visible, but cash availability is not."
            - label: "High"
              detail: "Runway or preference surprises can impair equity outcomes."
            - label: "Unverified"
              detail: "No bank cash, burn, debt, or preference schedule was available."
            - label: "High"
              detail: "Funding raised cannot be treated as available cash."
    approximationNotes: "All categories are qualitative; no probability, incident rate, or monetary loss estimate is implied."
    claimRefs: [CR001, CR003, CR004, CR005, CR008, CR009, CR010, CR011, CR012, CR013, CR016]
