callouts:
  - calloutType: risk
    title: Scale metrics are not diligence-grade
    body: >-
      The available order, funding, valuation, revenue, and headcount figures mix company claims
      with database estimates and conflicting scopes; none establishes audited revenue quality,
      cash availability, retention, or current fully diluted valuation.
    claimRefs: [CO007, CO008, CO010, CO011, CO012, CO013, CO014]
  - calloutType: insight
    title: Founder-market fit comes with platform concentration
    body: >-
      Steve Xie's simulation background supports the product thesis, while Lightwheel's broad
      NVIDIA integration creates both ecosystem leverage and dependency on a platform owner with
      overlapping capabilities.
    claimRefs: [CO001, CO015]
