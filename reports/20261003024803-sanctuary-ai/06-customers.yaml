  title: "Customers"
  summary: "Sanctuary AI's customer base remains concentrated in early-stage commercial proofs-of-concept and partner-led technology exploration rather than multi-site production software subscriptions. While early retail teleoperation pilots and Tier 1 automotive factory trials demonstrate technical feasibility for dexterous tasks, contracted recurring revenue, customer retention rates, and long-term expansion metrics remain undisclosed private diligence gaps."
sections:
  - id: "customer-segmentation-and-commercial-model"
    title: "Customer Base Segmentation and Evolving Commercial Interfaces"
    body: "Sanctuary AI targets four primary buyer segments across industrial and enterprise markets: automotive manufacturing suppliers, general industrial automation operators, retail logistics and store operations, and strategic telecommunications and systems integrators. Historically, commercial engagements centered on exploring the Phoenix general-purpose humanoid robot as a physical labor substitute. However, enterprise buyers exhibited hesitation regarding whole-body humanoid hardware maturity, high unit capital costs, and long deployment timelines. In response, Sanctuary AI shifted its commercial interface toward a multi-embodiment Physical AI model that deploys its cognitive manipulation software and proprietary hydraulic dexterity subsystems directly onto commercially available robotic arms. Commercial discussions now focus on industrial manufacturing leaders seeking labor automation for complex assembly tasks that classical fixed automation cannot reliably handle. Strategic enterprise partners such as Accenture, Bell, and Microsoft act as foundational channel facilitators: Accenture incorporates Sanctuary into its Project Spotlight accelerator to evaluate deployments across Global 2000 clients, Bell explores teleoperated labor-as-a-service models, and Microsoft collaborates on Large Behavior Models to facilitate real-world learning across dynamic industrial settings."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-pilot-milestones"
    title: "Adoption Trajectory, Benchmark Outcomes, and Deployment Reality"
    body: "Sanctuary AI's public deployment trajectory spans discrete pilot demonstrations rather than scaled production rollouts across commercial fleets. In retail environments, Canadian Tire Corporation hosted a landmark week-long pilot at a Mark's retail store in Langley, British Columbia, where a teleoperated general-purpose robot completed 110 retail-related tasks across front-of-store and back-of-store workflows. In the industrial manufacturing sector, Sanctuary AI conducted live line trials with a global Tier 1 automotive supplier, deploying its Physical AI system to execute high-precision wire insertion under moving conveyor lines. In that benchmark, the system achieved a 99.5% success rate with an industrial cycle time of 2.54 seconds across 313 insertion cycles during a 40-minute testing run, validating speed and force repeatability on live production lines. While third-party aggregators such as Humanoid Index cite approximately 50 deployed or shipped prototype units, independent industry trackers like RobotHub classify Sanctuary AI's active operational status at the demonstration and pilot stage rather than scaled commercialization. Long-term field durability across multi-shift continuous industrial operations remains an open engineering question."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof-and-retention-gaps"
    title: "Named Customer Proof, Retention Dynamics, and Concentration Risks"
    body: "Named customer evidence for Sanctuary AI is characterized by strategic enterprise pilots and investor-backed commercial collaborations. Canadian Tire Corporation and Magna International represent the company's most visible commercial partners, with Magna providing both strategic venture investment and automotive factory testing environments. Strategic services firms like Accenture provide access to enterprise pipelines, while communications providers like Bell and Verizon examine edge compute and 5G connectivity for remote robot operation. However, audited metrics regarding customer retention, net revenue retention (NRR), gross revenue retention (GRR), and subscription contract renewals are completely undisclosed. Sanctuary AI has not disclosed recurring software contract values, annual recurring revenue (ARR), customer acquisition costs, or multi-year enterprise commitments. Furthermore, customer concentration risk is exceptionally high: near-term commercial viability depends disproportionately on converting early pilots with Magna and automotive tier-one partners into formal recurring software license agreements."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
