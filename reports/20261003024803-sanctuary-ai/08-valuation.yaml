  title: "Valuation"
  summary: "Sanctuary AI's investment case presents exceptional robotic dexterity IP balanced against unverified commercial revenues, private valuation dispersion, and severe dilution overhang. We recommend research-more with high risk and an unknown valuation stance pending independent operating diligence."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "Sanctuary AI occupies a differentiated technical niche in general-purpose humanoid robotics, prioritizing human-level hand dexterity and hydraulic actuation controlled by its Carbon cognitive architecture. The affirmative investment thesis rests on four structural pillars: pioneering manipulation intellectual property, backing from industrial strategics including Magna International and Bell, a strategic $125 million non-dilutive liquidity event via its Apptronik equity divestment, and growing institutional sponsorship from BDC Capital and InBC. These elements position Sanctuary to capture dynamic manufacturing automation workflows that conventional fixed automation cannot automate. However, the anti-thesis is equally formidable: the company lacks disclosed contracted recurring revenue, pilot economics remain opaque, and capital requirements in humanoid hardware are vast. The ouster of co-founder and chief executive Geordie Rose in November 2024 alongside workforce layoffs underscores ongoing governance turbulence during a pivotal commercialization transition."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
    tableRefs:
      - "TV002"
  - id: "recommendation-and-valuation-context"
    title: "Recommendation, Risk Rating, and Valuation Stance"
    body: "We assign Sanctuary AI an overall recommendation of research-more with high risk, medium confidence, and an unknown valuation stance. Publicly reported valuation benchmarks exhibit extreme dispersion across tracking platforms and secondary registries, ranging from $410 million in private strategic rounds to unverified claims exceeding $500 million, while cumulative paid-in capital is estimated at approximately $140 million. Underwriting a buy rating at this stage would require verified customer contract values, unit production economics, and confirmed conversion of pilot deployments into recurring subscriptions or Robot-as-a-Service contracts. The planned $125 million Apptronik share divestment and $50 million Series B-2 equity round co-led by NEA and Kleiner Perkins provide crucial runway, but cap-table structure and liquidation preferences remain undisclosed to outside investors."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-analysis-and-peer-comparables"
    title: "Scenario Analysis, Peer Multiples, and Diligence Asks"
    body: "Underwriting scenarios for Sanctuary AI diverge dramatically across operating outcomes. In the bull case, successful closing of the $125 million Apptronik asset sale and integration of Rapid Robotics provide multi-year non-dilutive runway to scale commercial production of Phoenix with tier-one automotive and logistics partners, validating a multi-billion-dollar enterprise valuation in line with peers. In the base case, capital markets demand demonstrated unit economics and contracted gross margin proof before funding full production runs, requiring bridge debt or down-round equity. In the bear case, severe competitive pressure from mega-cap peers like Tesla and Figure AI, alongside hardware commoditization and leadership instability, leads to significant valuation compression and asset liquidation. Institutional investors must establish firm thesis-break triggers and resolve critical diligence gaps regarding cap-table seniority, unit manufacturing costs, and pilot retention."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV007"
      - "CV008"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
