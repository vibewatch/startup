company:
  name: "Sanctuary AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sanctuary AI is a Vancouver-based robotics and artificial intelligence company founded in 2018 that originally developed the Phoenix humanoid robot powered by its Carbon AI control architecture. In mid-2026, facing intense capital requirements in whole-body humanoid competition, the company pivoted its commercial focus toward deploying Physical AI software and proprietary hydraulic dexterity subsystems across third-party industrial robotic arms under new executive leadership."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Founding Roots, and Strategic Pivot"
    body: "Sanctuary Cognitive Systems Corp., trading commercially as Sanctuary AI, was founded in 2018 in Vancouver, British Columbia, Canada, by Geordie Rose, Suzanne Gildert, Olivia Norton, and Ajay Agrawal. The founding group brought deep technical heritage from prior pioneer ventures including quantum computing leader D-Wave Systems, early robotic reinforcement learning pioneer Kindred, and the Creative Destruction Lab. The company was established with the ambitious mission to build human-like intelligence in general-purpose robots capable of performing physical work alongside human laborers across industrial manufacturing, warehousing, and retail environments. For several years, Sanctuary AI focused on developing its flagship Phoenix general-purpose humanoid robot alongside its proprietary Carbon cognitive architecture, which blends deep learning and modern large language models with symbolic logic, reasoning, and photorealistic simulation. However, as documented in industry analyses and corporate disclosures, whole-body humanoid development demanded immense capital outlays that became challenging against heavily capitalized American robotics developers. On June 17, 2026, Sanctuary AI formally executed a major corporate pivot: rather than continuing to position the fully integrated Phoenix humanoid as its primary commercial product, the company restructured around a multi-embodiment Physical AI software strategy. Under this revised business model, Sanctuary AI packages its production-ready Physical AI platform and industrial-grade hydraulic hands (featuring 17 to 21 degrees of freedom) for deployment on commercially available industrial robot arms, positioning whole-body humanoids as an exploratory long-term path rather than its near-term commercial deliverable."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "governance-and-leadership-transitions"
    title: "Executive Leadership, Governance Turbulence, and Key-Person Continuity"
    body: "Sanctuary AI experienced severe leadership and governance turnover across 2024 and 2025 that fundamentally reshaped its executive committee. Co-founder and Chief Technology Officer Suzanne Gildert departed the company in April 2024 to pursue independent ventures in artificial intelligence consciousness, subsequently founding Nirvanic. Seven months later, in November 2024, Sanctuary AI's board of directors ousted co-founder and Chief Executive Officer Geordie Rose in an unexpected transition accompanied by the layoff of approximately 30 engineering and operational personnel amid mounting pressure regarding fundraising sustainability. Following an interim period where the company floated emergency convertible debt to bridge operations, the board installed Daniel Friedmann—former chief executive officer of aerospace and space robotics leader MDA and industrial decarbonization firm Carbon Engineering—as Chief Executive Officer in June 2026. Friedmann was given an explicit mandate to scale industrial monetization and transition Sanctuary AI from an exploratory hardware research laboratory into an execution-oriented enterprise software and component provider. Operational stability now relies heavily on senior program execution leaders, engineering specialists, and remaining technical co-founders like Chief Technology Officer Olivia Norton, though key-person risk remains elevated following the exit of the founding technical visionary and chief executive."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization Structure, Financing Gaps, and Investor Coalition"
    body: "Sanctuary AI's capitalization history is characterized by a distinctive combination of Canadian sovereign innovation backing, Tier-1 corporate venture arms, and strategic industrial partners. In March 2022, the company completed a C$75.5 million Series A round (US$59 million equivalent) backed by telecommunications carrier Bell, automotive contract manufacturing giant Magna International, Verizon Ventures, Workday Ventures, and Export Development Canada. In November 2022, the federal Government of Canada awarded Sanctuary AI a C$30 million non-dilutive grant through the Strategic Innovation Fund (SIF), bringing total public and private backing over C$100 million. In March 2024, Accenture Ventures completed a strategic investment through its Project Spotlight accelerator to evaluate humanoid applications across global enterprises, followed in July 2024 by strategic equity financing from BDC Capital's Thrive Venture Fund and British Columbia's InBC Investment Corp at an estimated $410 million post-money valuation marker. Third-party industry trackers report cumulative funding exceeding $140 million; however, conflicting capital reports—specifically whether a reported June 2024 US$100 million Series B and the EDC credit facility represented distinct or overlapping instruments—and unconfirmed reports of secondary liquidity from Sanctuary's Apptronik holdings mean the exact cap table, available cash reserves, and active burn rate remain critical private due diligence gaps."
    claimRefs:
