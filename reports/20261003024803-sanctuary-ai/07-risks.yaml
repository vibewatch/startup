callouts:
  - calloutType: "risk"
    title: "Hydraulic Dexterity Complexity vs. Industrial Reliability"
    body: "Sanctuary AI's competitive differentiation centers on its proprietary 20-DOF hydraulic robotic hands. However, hydraulics in fine manipulation introduce persistent seal degradation, fluid leakage risks, and maintenance complexity that may render commercial deployments unviable compared to electric actuation in high-throughput industrial environments."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR010"
  - calloutType: "recommendation"
    title: "Establish Stringent Pilot Exit and Commercial Kill Criteria"
    body: "Underwriters should condition follow-on commitments on demonstrated MTBF data exceeding 500 hours in production environments, formal ISO machinery safety certifications, and audited conversion of pilot deployments into multi-year recurring commercial contracts."
    claimRefs:
      - "CR003"
      - "CR007"
      - "CR015"
