chapter:
  number: 5
  title: "Product & Technology"
  summary: "Sanctuary AI develops the Carbon cognitive AI architecture and Phoenix general-purpose robotic platform, featuring 20-degree-of-freedom hydraulic hands and tactile sensing. In mid-2026, under new CEO Daniel Friedmann, the company pivoted to a hardware-agnostic Physical AI strategy, deploying its manipulation models and end effectors directly onto existing commercial industrial arms and conveyor systems."
sections:
  - id: "embodiment-and-hardware-architecture"
    title: "Robotic Embodiments and Electromechanical Hardware Architecture"
    body: "Sanctuary AI began by building general-purpose humanoid robots designed to navigate unmodified human work environments. Its flagship humanoid platform, Phoenix, stands 5 feet 7 inches tall, weighs 155 pounds, supports a maximum payload of 55 pounds, and operates at speeds up to 3 miles per hour. A central design thesis established by co-founders Geordie Rose and Suzanne Gildert was that human-scale dexterous manipulation requires replicating human hand biomechanics rather than relying on crude industrial parallel grippers. To achieve this, Sanctuary engineered proprietary hydraulic robotic hands providing 20 degrees of freedom alongside integrated haptic sensors capable of detecting subtle mechanical vibrations. By its seventh generation in April 2024, Sanctuary introduced miniaturized hydraulics, enhanced tactile sensing, and improved wrist, hand, and elbow flexibility, while Generation 8 transitioned to a strong torso, dual arms, and sensor head mounted on a wheeled base to improve manufacturing simplicity and sensor bandwidth. However, scaling full humanoid hardware into production proved constrained by cost, thermal management, and electromechanical maintenance, prompting a critical strategic expansion in 2026 toward modular industrial arm deployments."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "cognitive-architecture-and-physical-ai"
    title: "Carbon Cognitive Architecture and Physical AI Control System"
    body: "At the core of Sanctuary AI's software stack is Carbon, a proprietary hybrid cognitive architecture combining symbolic reasoning, modern large language models, deep reinforcement learning, and physics-realistic simulation. Rather than relying purely on end-to-end black-box imitation learning, Carbon implements an explainable four-stage operational loop: Understanding, Planning, Execution, and Learning. In the Understanding phase, language models parse natural language instructions into semantic goals. In the Planning phase, symbolic logic decomposes complex goals into deterministic, auditable action graphs and motion plans. In the Execution phase, low-level neural controllers coordinate high-frequency motor actuation across hydraulic actuators and tactile sensor loops. Finally, during the Learning phase, fleet-wide teleoperation demonstrations and physical interactions feed back into centralized models. Teleoperation with human-in-the-loop demonstration initially required several weeks of data capture per task; by Generation 7, Sanctuary demonstrated 24-hour task learning where autonomous replication succeeded after a single day of demonstration. Despite these algorithmic advances, generalizing manipulation outside narrow task envelopes without human teleoperation interventions remains an ongoing technical frontier."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "industrial-deployment-and-pivot"
    title: "Production Line Integration and the Industrial Automation Expansion"
    body: "In mid-2026, under newly appointed Chief Executive Officer Daniel Friedmann, Sanctuary AI formally broadened its commercial approach from exclusive humanoid embodiment to hardware-agnostic Physical AI for industrial automation. Recognizing that enterprises face immediate labor shortages but cannot wait for mass-market bipedal humanoids, Sanctuary decoupled its Carbon manipulation models and dexterous tooling from the Phoenix chassis. In June 2026, Sanctuary announced a landmark proof-of-concept with a global Tier 1 automotive supplier, deploying dual robotic arms with custom end effectors directly under a moving conveyor line to perform flexible wire plugging. The deployment achieved a 99.5% success rate with an industrial cycle time of 2.54 seconds across 313 insertion trials during a 40-minute test, matching line throughput. However, CEO Friedmann confirmed that this deployment remains at the proof-of-concept stage rather than multi-facility serial production. To transition from prototypes to scalable delivery, Sanctuary is actively recruiting senior electromechanical leadership to enforce Design for Manufacturing (DFM), Design for Testing (DFT), and Design for Reliability (DFR) standards across its global supply chain."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
