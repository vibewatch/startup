callouts:
  - calloutType: "insight"
    title: "Strategic Decoupling of Physical AI from Bipedal Humanoid Hardware"
    body: "Sanctuary AI's pivot to deploy its Carbon AI and dexterous end effectors onto commercial industrial arms marks a pragmatic adaptation to capital-intensive robotics realities. While the Phoenix humanoid demonstrates world-class dexterity with 20-degree-of-freedom hands, industrial customers prioritize immediate cycle times and integration into existing factory lines over bipedal mobility."
    claimRefs:
      - "CE002"
      - "CE012"
      - "CE013"
  - calloutType: "risk"
    title: "Proof-of-Concept to Production Scaling Gap"
    body: "Although Sanctuary achieved a 99.5% success rate at a 2.54-second cycle time in automotive wire plugging, the benchmark was conducted over a single 40-minute window of 313 trials. Sustained industrial adoption requires proving durability across multi-shift continuous operations without hydraulic degradation or software drift."
    claimRefs:
      - "CE014"
      - "CE015"
      - "CE016"
