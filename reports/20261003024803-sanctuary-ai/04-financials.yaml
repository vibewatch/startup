company:
  name: "Sanctuary AI"
chapter:
  number: 4
  title: "Financials"
  summary: "Sanctuary AI has raised approximately $148.6M in cumulative disclosed funding through April 2026, shifting its commercial focus toward software-first Physical AI deployments on industrial arms and dexterous hydraulic end effectors. The business model combines consultative non-recurring engineering fees with pilot hardware charges, but standard pricing, unit economics, customer counts, and recurring ARR remain completely undisclosed."
sections:
  - id: "revenue-model-and-monetization-structure"
    title: "Revenue Model and Monetization Structure"
    body: "Sanctuary AI operates a consultative land-and-expand commercial model designed to automate dynamic industrial tasks that conventional fixed automation cannot reliably handle. The company's initial revenue generation derives primarily from non-recurring engineering fees, custom end-effector configuration charges, and structured deployment milestone billings rather than high-margin recurring software licenses. Long-term commercial plans envision software licensing per robotic cell, annual maintenance and support agreements, ongoing task-policy retraining packages, and centralized fleet-management fees. However, Sanctuary AI has not publicly disclosed standard pricing tiers, list prices, or recurring contract floors. The commercial strategy emphasizes hardware-agnostic deployment of its Carbon and Physical AI intelligence layers on standard commercial robot arms from manufacturers such as FANUC and Universal Robots, targeting high-value manipulation workflows in automotive manufacturing and industrial assembly."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-transparency-and-sales-efficiency-proxies"
    title: "Pricing Transparency and Sales Efficiency Proxies"
    body: "Public pricing transparency for Sanctuary AI's robotics systems is nonexistent, reflecting an early-stage enterprise sales cycle characterized by bespoke proofs of concept and custom partner integrations. In private secondary markets, accredited investor platforms list Sanctuary AI's share price and valuation as undisclosed with no reputable priced transaction benchmarks reported. Enterprise procurement cycles in heavy industrial and automotive environments typically require extensive testing against production performance benchmarks before commercial expansion is considered. Sales efficiency proxies like customer acquisition cost, payback periods, and sales cycle duration cannot be underwritten from public disclosures. Sanctuary AI mitigates direct field service and sales distribution overhead by collaborating with strategic corporate partners like Accenture Ventures and automotive tier-one supplier Magna International to access established Global 2000 industrial customer footprints."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI002"
  - id: "cost-structure-and-capital-expenditure-drivers"
    title: "Cost Structure and Capital Expenditure Drivers"
    body: "Sanctuary AI's operating expense profile is characterized by high fixed research and development expenditures alongside variable deployment integration costs. Major cost drivers encompass specialized AI research talent, electromechanical and hydraulic engineering teams, advanced tactile sensor fabrication, and compute infrastructure utilized for large-scale GPU simulation in NVIDIA Isaac Lab. By adapting its Physical AI software to commercially available robotic arms rather than manufacturing entire humanoid bodies at automotive scale, Sanctuary AI reduces near-term tooling, battery pack, and bipedal chassis capital expenditures. Nonetheless, operational expenditures remain elevated due to specialized hiring across Vancouver and required hands-on engineering for on-site pilot trials. Strategic material partnerships, such as elastomer development collaboration with Zeon Corporation, aim to reduce long-term bill-of-materials costs and enhance hardware durability for hydraulic hands on factory floors."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy and Financing Dependency"
    body: "Sanctuary AI has raised approximately $148.6M in cumulative disclosed capital across equity rounds, venture debt, and Canadian governmental innovation contributions through April 2026. While independent robotics databases record an estimated $410M post-money valuation following mid-2024 strategic financings and historical reports indicate $500M valuation marks, secondary platforms confirm that Sanctuary AI has no official priced round or public exchange valuation. With roughly 50 deployed units reported in early field trials and over 200 personnel, cash burn remains substantial against minimal recognized commercial revenues. Crucially, Sanctuary AI faces a major capital disadvantage compared to Western humanoid competitors such as Figure AI (over $1.75B raised) and Apptronik (over $935M raised), leaving the company heavily dependent on further strategic capital infusions or non-dilutive government support to maintain ongoing R&D and achieve commercial runway."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
