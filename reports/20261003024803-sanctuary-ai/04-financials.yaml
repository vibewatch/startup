callouts:
  - calloutType: "risk"
    title: "Structural Capital Disadvantage Versus Well-Funded Humanoid Peers"
    body: "Sanctuary AI's total disclosed funding of $148.6M is substantially lower than leading humanoid robotics competitors Figure AI ($1.75B+) and Apptronik ($935M+). This capital disparity creates serious risks in sustaining long-term GPU compute access, physical fleet production, and dedicated field integration support during extended enterprise pilot cycles."
    claimRefs:
      - "CI013"
      - "CI016"
  - calloutType: "insight"
    title: "Capital Efficiency via Hardware-Agnostic Deployment"
    body: "By running its Physical AI intelligence layer on commercially available industrial robot arms from Universal Robots and FANUC, Sanctuary AI avoids the intensive capital expenditures required to manufacture and service bespoke bipedal humanoid chassis at automotive scale, focusing capital on dexterous manipulation algorithms."
    claimRefs:
      - "CI004"
      - "CI011"
