company:
  name: "Sanctuary AI"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Sanctuary is differentiated by dexterous manipulation, tactile sensing, and a hardware-agnostic
    Physical AI strategy, but its procurement posture is less transparent than peers with clearer
    product pathways. The competitive risk is not only another humanoid: conventional automation,
    internal integration, and narrower task-specific robots can win whenever buyers value delivery
    certainty over generality.
sections:
  - id: "landscape-and-positioning"
    title: "The competitive set is broader than humanoids"
    body: >-
      Sanctuary competes directly with general-purpose humanoid programs such as Figure, Agility
      Robotics, Apptronik, and 1X, but the buyer's real choice set also includes conventional
      industrial automation, internal integration, and continued manual work. Sanctuary's current
      website emphasizes Physical AI that can run across multiple embodiments, while an independent
      buyer review describes Generation 8 Phoenix as a wheeled platform rather than a standard
      off-the-shelf biped. That shift broadens Sanctuary's addressable workflows but also moves the
      comparison from robot-versus-robot toward complete deployment outcomes. Funding directories
      indicate that several named peers have substantial disclosed capital, although those figures
      are publisher-reported funding raised, not cash available, and are not normalized across
      currencies, dates, or financing instruments.
    claimRefs: [CP001, CP003, CP006, CP007, CP008, CP009, CP010, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "capability-and-procurement"
    title: "Dexterity leads the thesis; procurement clarity trails it"
    body: >-
      Sanctuary's strongest public differentiation is its focus on touch, hands, and difficult
      manipulation. A company-issued release says tactile sensing is intended to support blind
      picking, slip detection, and force control, while the historical Generation 6 launch specified
      a 55-pound maximum payload and a Carbon control stack. Those historical specifications should
      not be applied to Generation 8 without qualification: the independent review says Sanctuary has
      not published an equivalent complete current specification sheet. Figure is presented as a
      vertically integrated biped, Digit as a clearer logistics proposition, Apollo as an industrial
      deployment platform, and 1X NEO as home-focused. These are editorial characterizations rather
      than independent performance benchmarks; current safety certification, uptime, intervention
      rate, and task-cycle comparisons remain unavailable in the assigned evidence.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
  - id: "commercial-model-and-distribution"
    title: "Distribution helps, but pricing and packaging remain opaque"
    body: >-
      No current public Phoenix list price or standard ordering pathway appears in the retained
      evidence. The strongest available buyer review characterizes engagements as project-based and
      advises buyers to obtain a complete proposal covering the embodiment, integration, task policy,
      and support. Accenture's Project Spotlight relationship may improve enterprise access through
      Accenture's Global 2000 network, but it is evidence of channel reach rather than proof of
      deployments or realized revenue. Company-issued job listings also point to active work across
      NPI, pilot builds, ERP, BOM control, suppliers, and manufacturing. Those signals imply that
      switching costs may accrue in integration, production data, end-effectors, and operating
      processes rather than in Phoenix hardware alone; public contract terms, discounts, service
      levels, and exit rights remain unknown.
    claimRefs: [CP002, CP013, CP014, CP016]
    tableRefs: [TP003]
  - id: "moat-and-displacement-risk"
    title: "The moat is plausible but not independently benchmarked"
    body: >-
      Sanctuary's defensibility case rests on proprietary hands, tactile data, control software, and
      the ability to deploy intelligence across more than one hardware form. Its company-issued
      release also cites a strong patent position, but the retained evidence does not provide an
      independent patent-quality analysis or a controlled comparison of manipulation performance.
      The adverse case is therefore practical: a buyer may select Digit for a narrower logistics
      workflow, Figure or Apollo for a clearer humanoid roadmap, 1X for a home use case, or
      conventional automation for a fixed task. Sanctuary wins only where difficult manipulation
      justifies customization and where its deployment can meet cycle-time, intervention, safety,
      and service requirements. Until those measures are independently validated, differentiation
      should be treated as promising rather than durable.
    claimRefs: [CP002, CP004, CP006, CP007, CP008, CP009, CP015, CP016]
