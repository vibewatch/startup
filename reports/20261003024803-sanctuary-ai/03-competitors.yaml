callouts:
  - calloutType: "risk"
    title: "A differentiated hand is not yet a complete moat"
    body: >-
      Buyers still need generation-specific performance, safety, intervention, service, and total-cost
      evidence. Without those data, narrower robots or conventional automation can displace Sanctuary
      even when Phoenix appears technically more general.
    claimRefs: [CP002, CP003, CP016]
