evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-run-rate
    missingEvidence: >-
      Audited financial statements, ARR metrics, software contract license fees, and customer pipeline conversion
      details following the June 2026 pivot to Physical AI software.
    whyItMatters: >-
      Determines whether Sanctuary AI is generating commercial cash flow from software deployments or remains entirely
      dependent on external equity and grant subsidies.
    diligencePath: >-
      Request confidential disclosure of commercial software licensing contracts, customer trial terms, and management
      financial accounts during direct diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-and-arr
    missingEvidence: Disclosed robot-as-a-service hourly rates, hardware unit capital cost, and recurring annual contract values.
    whyItMatters: >-
      Without disclosed unit pricing or contractual ARR, serviceable obtainable market sizing remains entirely
      speculative.
    diligencePath: Review customer pilot contracts under NDA or obtain audited management disclosures on deployment pricing.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: conflicting-data
    severity: minor
    topic: capital-raised-reconciliation
    missingEvidence: >-
      Reconciliation between $81 million equity recorded on RobotHub and $140 million+ total funding cited across other
      industry sources.
    whyItMatters: Affects capital runway estimation and total investment scale underwriting.
    diligencePath: Verify filed corporate share capital issuances and Canadian Strategic Innovation Fund contribution schedules.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current quotes, contract units, deployment scope, discounts, support terms, warranties, and delivery
      commitments for Sanctuary and named peers.
    whyItMatters: >-
      Without complete deployment pricing and terms, buyers cannot compare total cost or allocate integration and
      performance risk.
    diligencePath: Run a common task-based RFP across Sanctuary, two humanoid peers, and a conventional automation integrator.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: funding-conflict
    missingEvidence: >-
      A company-confirmed, instrument-level capitalization history that reconciles the $81M and $140M+ third-party
      totals and distinguishes funding raised from cash available.
    whyItMatters: >-
      Unreconciled funding totals prevent a reliable comparison of peer scale, financing capacity, and potential
      commercialization runway.
    diligencePath: >-
      Obtain the current cap table, financing ledger, grant and debt schedule, and bank-confirmed cash balance under
      NDA.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A controlled, generation-specific comparison of task success, cycle time, intervention rate, safety, uptime, and
      serviceability across Sanctuary and peers.
    whyItMatters: >-
      Feature positioning cannot establish durable technical advantage or production economics without comparable
      operating evidence.
    diligencePath: >-
      Commission a paid pilot using identical objects, workcells, duty cycles, human-intervention rules, and acceptance
      thresholds.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials-and-revenue-scale
    missingEvidence: >-
      Audited financial statements confirming recognized annual revenue, recurring software ARR, gross margins, and
      customer contract backlog.
    whyItMatters: >-
      Without audited revenue breakdowns, underwriters cannot determine whether Sanctuary AI is generating genuine
      software revenue or remaining a subsidized research and services shop.
    diligencePath: >-
      Request GAAP/IFRS audited financial statements, billing schedules, and customer revenue categorization directly
      during management diligence sessions.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway-status
    missingEvidence: Current net monthly cash burn rate, operating cash reserves, and remaining runway timeline.
    whyItMatters: >-
      Given the significant capital disadvantage compared to Western competitors and high compute/engineering costs,
      cash runway dictates insolvency risk and near-term dilution.
    diligencePath: >-
      Review monthly cash flow statements, bank covenants, and projected funding runway through mid-2027 under
      management stress-test assumptions.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: capitalization-and-valuation-benchmarks
    missingEvidence: >-
      Confirmation of whether the mid-2024 strategic financing carried a priced $410M equity valuation or represented
      structured convertible debt.
    whyItMatters: >-
      Third-party databases cite $410M to $500M valuations, while pre-IPO marketplaces disclose that no reputable priced
      round has occurred, obscuring true share dilution.
    diligencePath: >-
      Obtain fully diluted capitalization table, recent 409A valuation reports, and definitive agreements for the BDC
      Capital and InBC transactions.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: humanoid-reliability-mtbf
    missingEvidence: >-
      Mean Time Between Failures (MTBF) and continuous unassisted duty-cycle telemetry for the Phoenix humanoid platform
