            body: >-
              Sanctuary 最受关注的公开差异化优势在于聚焦触觉、灵巧手与高难度操作。官方通稿称其触觉感知旨在支持盲取、滑动检测与力度控制，而早期第 6 代机型发布时曾标明最大负载 55 磅并搭载 Carbon
              控制架构。但不能把这些历史参数直接套用到第 8 代上：第三方评测明确指出，Sanctuary 尚未发布同等完整的当前规格表。在行业认知中，Figure 定位为垂直整合的双足机器人，Digit
