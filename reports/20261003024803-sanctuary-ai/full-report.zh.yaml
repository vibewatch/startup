            body: >-
              Sanctuary AI
              采用顾问式“先切入再扩张”（land-and-expand）商业模式，旨在将传统刚性自动化无法可靠处理的动态工业工序自动化。公司早期收入主要来自非经常性工程费（NRE）、定制末端执行器适配费以及按里程碑结算的部署服务费，而非高毛利的经常性软件许可。长期商业化规划设想按机器人工作站收取软件许可费、年度维保与技术支持费、任务策略持续重训费以及集中式机队管理费。然而，Sanctuary
              AI 尚未公开披露标准定价档位、挂牌价或经常性合同底价。其商业策略重点在于推动 Carbon 与 Physical AI 智能层脱离特定本体，适配 FANUC 和 Universal Robots
              等厂商的标准商用机械臂，主攻汽车制造与工业装配中的高价值操作环节。
