      - number: '7.4'
        title: 资本密集度、融资不确定性与否决红线（Kill Criteria）
        blocks:
          - type: paragraph
            body: >-
              人形机器人研发在硬件迭代、加工制造、数据采集及具身 AI 训练各环节均消耗巨资。数据库记录其累计融资额超过 $140M，估值预估在 $410M 至 $500M+
              之间；但公开证据表明，公司仍停留在技术演示与早期试点阶段，缺乏可查证的客户经常性收入或单机经济模型（unit
              economics）。资本结构模糊且融资数据存在矛盾，若商业化落地迟迟无法实现自我造血，将面临巨大的股权稀释与估值倒挂（down-round）风险。试点客户流失、高管离职潮以及失控的现金消耗，均是触发投资逻辑破裂的关键监测指标。
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 图表与专栏
        blocks:
          - type: callout
            title: 液压灵巧手复杂性与工业可靠性的矛盾
            body: >-
              Sanctuary AI 的核心竞争优势在于自研的 20
              自由度（20-DOF）液压机械手。但在精细操作中引入液压驱动，伴随着密封件持续老化、漏液风险及高昂的维护成本；相比高吞吐工业场景普遍采用的纯电驱动，液压方案可能导致商业化部署在经济上难以为继。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
          - type: callout
            title: 设立严苛的试点退出与商业止损标准
            body: 投资人在考虑后续追加出资时，应将以下几项设为前提条件：在生产环境下验证平均故障间隔时间（MTBF）超过 500 小时、获得正式 ISO 机械安全认证，并有经审计实据证明试点已转化为多年期经常性商业合同。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 在通用人形机器人赛道中卡位鲜明，主打由 Carbon 认知架构控制、具人类水准灵巧度的液压机械手。正面投资逻辑建立在四大支柱之上：先锋级灵巧操作专利储备、Magna
              International 与 Bell 等产业巨头背书、减持 Apptronik 股权斩获 $125M 免稀释流动性资金，以及 BDC Capital 和 InBC
              带来的机构资助。上述优势使其有望切入传统刚性自动化无法覆盖的动态制造工序。但反向逻辑同样尖锐：公司缺乏公开签署的经常性收入合同，试点经济效益不透明，且人形硬件的资金渴求无底洞。2024 年 11
              月联合创始人兼首席执行官 Geordie Rose 被罢免及随后的裁员，凸显出商业化关键转型期的治理层震荡仍在持续。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
