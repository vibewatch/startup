      - number: '5.2'
        title: Carbon 认知架构与 Physical AI 控制系统
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 软件栈的核心是自研混合认知架构 Carbon，该架构融合了符号推理、现代大语言模型、深度强化学习与真实物理仿真。Carbon
              摒弃了纯端到端黑盒模仿学习路线，转而采用可解释的四阶段运行闭环：理解（Understanding）、规划（Planning）、执行（Execution）与学习（Learning）。在理解阶段，语言模型将自然语言指令解析为语义目标；在规划阶段，符号逻辑将复杂目标拆解为确定性、可审计的动作图谱与运动轨迹规划；在执行阶段，底层神经控制器协调高频电机驱动，形成涵盖液压执行器与触觉传感器的控制回路；最后在学习阶段，全机队的遥操作示范与实体交互数据统一回传至中心模型。起初单项任务的人机在环遥操作示范需要数周数据采集，但到第
              7 代时，Sanctuary 验证了 24 小时任务学习机制，即仅需一天示范便能自主复现。尽管算法有所精进，但在脱离人工遥操作干预的情况下，将操作能力泛化到狭小任务区间之外，依然是悬而未决的技术前沿。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
