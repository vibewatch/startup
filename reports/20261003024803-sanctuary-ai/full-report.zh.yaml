      - number: '7.2'
        title: 合规监管、安全认证与部署治理
        blocks:
          - type: paragraph
            body: >-
              将通用人形机器人投入实际工业与商业现场，会触发严苛的职业安全标准、机械指令认证以及责任认定规范。新兴机械安全法规要求，与人类工人近距离协同作业的移动操作机器人必须具备全面的风险评估与故障安全停机机制。鉴于
              Phoenix 将移动操作与自主目标寻优 AI 架构融为一体，想要通过现行 OSHA
              和国际机器人安全标准认证仍是未解难题。在尚未公开披露正式安全认证或第三方审计报告的情况下，商业化推进随时面临监管叫停或保险机构设限的风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 供应链依存度与战略伙伴博弈
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 的规模化落地高度依赖专业化国际供应商与战略企业资方。招聘数据证实，公司正抓紧搭建采购团队，力求在全球供应链中为复杂机电、传感器与网络组件物色供应商。尽管 Magna
              International、Accenture
              及加拿大公共发展基金带来了战略敲门砖，但公司仍面临交易对手执行风险及潜在的战略分歧。双方若在商业化节奏、知识产权归属或试点里程碑上产生分歧，可能打乱规模化推进步伐，制约市场拓展。
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
