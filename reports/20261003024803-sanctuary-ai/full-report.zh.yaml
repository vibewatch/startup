          - type: callout
            title: 兼容工业机械臂消除买方落地顾虑
            body: 将 Physical AI 模型与液压灵巧手脱离整身人形底盘，为工厂管理者大幅消除了落地阻力。工业客户无需重新规划车间安全防护隔离区，即可将先进操作智能直接部署至既有的商用机械臂上。
            calloutType: insight
            claimRefs:
