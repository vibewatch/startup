  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 机器人本体形态与机电硬件架构
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 最初聚焦通用人形机器人研发，旨在适应未经改造的人类物理作业环境。旗舰人形平台 Phoenix 高 5 英尺 7 英寸、重 155 磅，最大负载 55 磅，最高行走速度为每小时 3
              英里。联合创始人 Geordie Rose 和 Suzanne Gildert 确立的核心设计逻辑认为，要实现人类水准的灵巧操作，必须复现人手的生物力学结构，而非沿用粗糙的工业平行夹爪。为此，Sanctuary
              自研了具备 20 个自由度的液压机械手，并集成可检测细微机械振动的触觉传感器。到 2024 年 4 月迭代至第 7 代时，公司引入了微型化液压系统，增强了触觉感知，并提升了手腕、手掌及手肘的灵活性；第 8
              代机型则改为强壮躯干、双臂及传感头部安装在轮式底座上的结构，以简化制造流程并拓宽传感带宽。但整身人形硬件在量产扩张中遭遇成本、热管理及机电维护多重瓶颈，促使公司在 2026
              年做出关键战略延伸，转向模块化工业机械臂部署。
