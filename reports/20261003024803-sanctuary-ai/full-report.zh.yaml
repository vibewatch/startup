  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局远不止人形机器人
        blocks:
          - type: paragraph
            body: >-
              Sanctuary 与 Figure、Agility Robotics、Apptronik 和 1X
              等通用人形机器人项目直接竞争，但企业买方的真实选择面还包括传统工业自动化、自研集成以及维持人工现状。Sanctuary 当前官网强调可适配多种构型的 Physical AI，而第三方买方评测指出第 8 代
              Phoenix
              实际是轮式平台，并非开箱即用的标准双足机器人。此举拓宽了公司的适用场景，但也将评估重点从单纯的机器人机体对比引向整体落地成效。创投数据库显示多家可比同行公布的融资金额体量巨大，不过这些数字只是媒体报道的累计募资额，并非账面可用现金，且未在币种、时间与融资工具维度做标准化处理。
