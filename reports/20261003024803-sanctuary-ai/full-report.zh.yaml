            body: >-
              Sanctuary AI 的公开落地轨迹主要呈现为零星的试点演示，尚未形成商业机队规模的量产铺开。在零售场景，Canadian Tire Corporation 曾于不列颠哥伦比亚省兰里市的 Mark's
              零售门店开展为期一周的标志性试点，遥操作通用机器人完成了横跨前店与后仓的 110 项零售任务。在工业制造领域，Sanctuary AI 与某全球汽车一级供应商进行了实景产线测试，部署其 Physical AI
              系统在运行中的输送带下方执行高精度线束插接。在为期 40 分钟的 313 次插接测试中，该系统达到 99.5% 成功率与 2.54 秒节拍时间，验证了实际生产节拍与力度重复精度。尽管 Humanoid Index
              等第三方数据平台引用了约 50 台样机部署或出货量，但 RobotHub
              等独立行业跟踪机构仍将公司的实际运营状态归类为“技术演示与试点阶段”，而非规模商用。在多班倒连续工业作业环境下的长期耐久度，依旧是有待检验的工程难题。
