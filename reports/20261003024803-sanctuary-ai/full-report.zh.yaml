      - number: '2.2'
        title: 目标市场测算视角与现实边界
        blocks:
          - type: paragraph
            body: >-
              测算 Physical AI 与通用机器人市场规模，必须将自上而下的宏观推演与有实据支撑的近期实际预算剥离开来。业内常引用的宏观研报预测，随着对工业劳动力的广泛替代，全球通用人形与灵巧机器人广义市场在 2030
              年代可能突破 $100B。但 2026 年的商业化实据表明，近期的可服务市场（SAM）仍受限于结构化部件组装和物流领域的实际工业试点，远未普及到随处可见的自主作业。

              Sanctuary AI 的商业落地印证了这一现实：公司与汽车零部件制造伙伴 Magna 在零部件分装领域处于定制试点阶段，同时在零售与物流领域推进早期企业接洽。第三方聚合数据预估其试点现场累计部署约 50
              台设备；数据库记录的股权与加拿大政府资助累计总融资在 $81M 至超过 $140M 之间。由于公司未公开商业化
              ARR、未公布硬件定价，也缺乏经核实的机器人即服务（RaaS）按小时费率，测算可获取市场（SOM）受到极大制约。近期可拿到的支出依然局限于带资 PoC 试点、联合研发投入以及定制化企业集成合同。
