      - number: '1.2'
        title: 核心管理层变动、治理动荡与关键人员传承
        blocks:
          - type: paragraph
            body: >-
              2024 至 2025 年间，Sanctuary AI 经历了剧烈的管理层与治理层动荡，执行委员会成员几乎彻底换血。联合创始人兼首席技术官 Suzanne Gildert 于 2024 年 4 月离职，转去探索
              AI 意识领域并随后创立 Nirvanic。七个月后，即 2024 年 11 月，面对持续融资带来的巨大压力，董事会突遭人事震荡，罢免了联合创始人兼首席执行官 Geordie Rose，并同步裁减约 30
              名研发与运营人员。在发行紧急可转债维持运营的过渡期过后，董事会于 2026 年 6 月任命 Daniel Friedmann 接任首席执行官；Friedmann 此前曾执掌航天与太空机器人领军企业 MDA
              以及工业脱碳企业 Carbon Engineering。董事会赋予他明确的权责：加速工业化变现，推动 Sanctuary AI
              从探索型硬件实验室转型为重交付的企业级软件与核心零部件供应商。目前公司运营稳定性高度倚重高级项目管理骨干、资深工程师，以及留任的技术联合创始人兼首席技术官 Olivia
              Norton；但在失去最初的技术灵魂人物兼一把手后，关键人员流失风险依然偏高。
