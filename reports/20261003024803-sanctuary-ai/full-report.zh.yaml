  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、目标预算与 Physical AI 辐射范围
        blocks:
          - type: paragraph
            body: >-
              界定 Sanctuary AI 的目标市场，首先要把通用 Physical AI
              与灵巧操作同传统工业自动化区分开来。传统工业机器人的支出集中在高度结构化的高吞吐环境，例如固定焊接工位、重型冲压机以及刚性汽车抓取搬运产线。这些传统方案靠专用夹具实现重复性工序自动化，但在需要精细触觉感知和多轴灵巧度的非结构化动态工序中却束手无策。Sanctuary
              AI 将自身平台定位于替代那些传统自动化无法稳定胜任的人力预算。在其战略定位中，公司强调将量产级 Physical AI
              部署至各种市售机器人系统（涵盖工业机械臂与自研液压手），并保留通往通用人形机器人的长期演进路径。

              Sanctuary AI
              瞄准的支出预算涵盖工厂直接人工成本、专业自动化工程集成费以及试点产线治具改造费用；明确剔除传统固定功能自动化设备的资本开支，以及通用按量计费的企业软件订阅。在目标工厂中，现存替代方案仍是人工（往往辅以缺少灵巧末端执行器的传统机械臂）以及遥操作专用工具。在知识产权布局上，Sanctuary
              AI 强调自身在通用机器人与灵巧操作领域的全球专利排名，将触觉与抓取技术视为在动态工业环境中分食人工替代支出的核心支点。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
