  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术可行性与硬件可靠性隐患
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 的 Phoenix 人形机器人搭载了复杂的 20
              个自由度液压机械手，旨在达到人类水准的灵巧度。但在高强度工业作业工况下，保持机械耐久度、密封完整性与确定性控制面临极高的工程失效风险。公司招聘硬件技术项目经理与系统测试工程师的信息表明，其仍在原型、NPI
              和早期小批量试制阶段艰难搭建基础测试验证与工程变更（ECO）流程。此外，在物理环境中结合使用概率性机器学习模型与符号推理，带来了不可忽视的可预测性风险，一旦出现未经充分验证的失效模式，极易酿成车间安全事故或代价高昂的停线损失。
            claimRefs:
              - CR001
              - CR002
