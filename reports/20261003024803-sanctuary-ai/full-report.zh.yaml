          claimRefs:
            - CO002
        - label: 2022-03：Series A 轮
          date: '2022-03-15'
          detail: Sanctuary 完成由 Bell 领投，Magna、Verizon 及 Workday 参投的 C$75.5M（US$59M）Series A 轮融资。
