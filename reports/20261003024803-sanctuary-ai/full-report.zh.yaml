chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业身份、创立渊源与战略转型
        blocks:
          - type: paragraph
            body: >-
              Sanctuary Cognitive Systems Corp.（商业名称为 Sanctuary AI）由 Geordie Rose、Suzanne Gildert、Olivia Norton 和 Ajay
              Agrawal 于 2018 年在加拿大不列颠哥伦比亚省温哥华创立。创始团队拥有深厚的技术积淀，此前曾创办或领导量子计算先驱 D-Wave Systems、早期机器人强化学习开拓者 Kindred 以及创新孵化器
              Creative Destruction Lab。公司初创使命宏大，旨在打造具备类人智能的通用机器人，在工业制造、仓储和零售环境中与人类工人并肩从事体力劳动。数年间，Sanctuary AI
              重点开发其旗舰级通用人形机器人 Phoenix，并同步自研 Carbon
              认知架构；该架构将深度学习、现代大语言模型与符号逻辑、因果推理及拟真仿真环境融为一体。然而，正如行业分析与企业披露所记录，整身人形机器人研发资金吞吐量极大，在面对资本储备雄厚的美国机器人同行时逐渐难以为继。2026
              年 6 月 17 日，Sanctuary AI 正式宣布重大战略转向：不再将整机集成的 Phoenix 人形机器人作为核心商用产品，而是围绕跨构型的 Physical AI
              软件策略重组业务。在新商业模式下，公司将已具备生产级能力的 Physical AI 平台与工业级液压灵巧手（具备 17 至 21
              个自由度）打包，直接适配市售成熟工业机械臂，而将整身人形机器人退居为长期探索方向，不再作为近期交付物。
