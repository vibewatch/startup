      - number: '2.4'
        title: 增长驱动因素、资本密集度与落地阻力
        blocks:
          - type: paragraph
            body: >-
              工业制造、仓储和物流领域的结构性用工荒，叠加企业平抑薪资通胀与人员流失风险的硬性诉求，构成了灵巧 Physical AI 平台的核心驱动力。战略分发渠道（例如通过 Accenture 的 Project
              Spotlight 合作对接 Global 2000 强企业）帮助公司敲开了寻求人机协同的大型工业客户大门。多构型 AI 算法的突破配合自研液压灵巧手，也让以往刚性自动化无法攻克的操作任务具备了自动化可能。

              但现实中的商业阻力依然制约着规模化扩张。其一，Sanctuary AI 完全依赖销售驱动，没有任何公开定价、标准费率表或 RaaS
              按小时基准，意向买方只能走摩擦极高的定制化商务询价。其二，总体拥有成本远超初期硬件报价：早期试点需要大量遥操作人工作业与人机在环辅助来采集动作数据，产生了沉重的运维服务负担。其三，机电硬件迭代工程阻力巨大；内部项目管理流程在原型试制、新产品导入（NPI）和供应商验证各环节均设有严苛的准入与退出准则以防工期延误。上述摩擦点导致客户回本周期和自主作业占空比（duty
              cycles）缺乏公开基准验证。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表与专栏
        blocks:
          - type: callout
            title: 战略投资方渠道高度依存
            body: >-
              Sanctuary AI 的商业落地高度绑定战略投资方——后者身兼研发伙伴、试点客户与分销渠道数职。Magna 提供汽车零部件装配试点工位及潜在制造产能，Accenture 则通过 Project
              Spotlight 带来 Global 2000 强企业资源。这种模式固然能在无需建立公开销售漏斗的情况下锁定早期试点，但也限制了独立价格发现，并遮蔽了通用企业级市场的真实需求。
