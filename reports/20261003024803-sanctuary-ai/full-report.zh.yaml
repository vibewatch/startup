      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资评估结论：审计完成前继续研究
            body: >-
              Sanctuary AI 属于人形机器人灵巧操作领域的顶尖工程资产，但公司口径宣称的 $410M 至 $500M+ 一级市场估值，在缺乏经审计的
              ARR、毛利率以及股权结构表偿付顺位佐证前无法确认。机构投资者应持续跟踪执行里程碑，待确认 Apptronik 股权剥离交易正式交割后再投入风险资本。
