      - number: '2.3'
        title: 企业买方画像、采购决策流与预算归属
        blocks:
          - type: paragraph
            body: >-
              企业采用 Sanctuary AI 的 Physical AI 平台主要分布在三个场景：汽车制造部件分装、合同物流与履约，以及商业零售运营。在汽车制造领域——以公司在战略资方 Magna
              开展的多机试点为例——主要商业决策人是制造工程副总裁或先进自动化副总裁，采购预算来自资本性支出项目与运营持续改进基金。最终使用者是车间一线工人与装配技术人员，而厂长与集团自动化总监负责把关产线安全和节拍时间（cycle
              time）的可预测性。

              在物流和零售场景中，采购流程通常由供应链负责人、物流运营总监或创新负责人发起，动用仓储人工替代预算。不论哪个板块，采购决策都遵循严苛的多阶段卡点评估：初步技术可行性验证、试点工位搭建、安全与作业区集成测试，最后是试点产线实地验证。在供应链侧，Sanctuary
              AI 依赖分布在全球的复杂机电零部件、传感器与结构件网络。公司针对机器人采购岗的招聘信息表明，采购团队横跨硬件、软件及网络部件对接多家供应商，以此支撑研发原型制作与试点小批量试制。
