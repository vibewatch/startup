      - number: '6.3'
        title: 具名客户实证、留存动态与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 的具名客户实证集中在战略级企业试点与投资方主导的商业合作。Canadian Tire Corporation 与 Magna International 是其能见度最高的商业伙伴，其中
              Magna 兼具战略投资与汽车工厂实测支持双重角色。Accenture 等咨询巨头提供企业级销售漏斗入口，Bell 与 Verizon 等电信商则负责探索适配机器人远程作业的边缘计算与 5G
              网络。然而，关于客户留存率、净留存率（NRR）、总留存率（GRR）以及订阅合同续约率等经过审计的指标均未见公开披露。公司从未公布经常性软件合同金额、年经常性收入（ARR）、获客成本或多年期大单承诺。此外，客户集中度风险极高：近期商业化能否走通，几乎全系于能否将
              Magna 等汽车一级供应商的早期试点转化为正式的经常性软件授权合同。
            claimRefs:
              - CU012
              - CU013
              - CU014
