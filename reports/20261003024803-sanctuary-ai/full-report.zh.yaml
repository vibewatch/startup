      - number: '8.3'
        title: 情景分析、同行估值倍数与尽调要点
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 在不同经营结果下的投资评估情景分化极大。乐观情景下，若顺利完成向 Apptronik 出售 $125 million 资产并整合 Rapid
              Robotics，便能获得数年非稀释性现金跑道，从而携手一线汽车与物流伙伴扩大 Phoenix
              量产规模，支撑起与同行持平的数十亿美元企业估值。基准情景下，资本市场在注资支持全面量产前，会要求公司拿出已验证的单机经济模型与合同约定的毛利率证明，届时需要靠过桥债务或折价股权融资度日。悲观情景下，面对
              Tesla、Figure AI
              等巨头同行的激烈竞争，加上硬件同质化与管理层动荡，公司估值将严重缩水，甚至走向资产清算。机构投资者必须设定明确的逻辑证伪触发条件，并彻底摸清股权结构表偿付顺位、单台制造成本以及试点客户留存等关键尽调缺口。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
