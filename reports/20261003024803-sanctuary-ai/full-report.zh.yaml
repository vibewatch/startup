      - number: '6.4'
        title: 图表与专栏
        blocks:
          - type: callout
            title: 从概念验证到量产交付的跨越鸿沟
            body: >-
              Sanctuary AI 在单项技术任务上展现出优秀的基准表现，包括 2.54 秒线束插接、99.5% 成功率以及门店测试中的 110
              项零售任务。但公司尚未公开证实自己能把受限的试点演示，转化为可贡献经常性软件收入的跨工厂量产交付。
            calloutType: risk
