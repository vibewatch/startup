      - number: '1.3'
        title: 资本架构、融资缺口与投资方阵容
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI 的资本结构由加拿大主权创新资金、一线企业创投（CVC）与工业战略伙伴共同出资搭建。2022 年 3 月，公司完成 C$75.5M（约合 US$59M）Series A
              轮融资，投资方包括电信运营商 Bell、汽车代工巨头 Magna International、Verizon Ventures、Workday Ventures 以及加拿大出口发展局（EDC）。2022 年 11
              月，加拿大联邦政府通过战略创新基金（SIF）向公司注资 C$30M 免稀释赠款，使其公私累计融资总额突破 C$100M。2024 年 3 月，Accenture Ventures 通过其 Project
              Spotlight 加速器完成战略注资，旨在评估人形机器人在全球企业中的应用落地；紧接着在 2024 年 7 月，BDC Capital 旗下 Thrive Venture Fund 与不列颠哥伦比亚省 InBC
              Investment Corp 领投战略股权融资，投后估值预估约 $410M。第三方行业监测机构显示其累计融资超过 $140M；然而，公开资金数据存在多处冲突——特别是此前报道的 2024 年 6 月
              US$100M Series B 轮与 EDC 信贷额度究竟属独立还是重叠工具尚不明确，加之公司减持 Apptronik 股份获取老股流动性的传闻未获证实，导致确切的股权结构表（cap
              table）、账面可用现金储备以及实际烧钱速度，仍是私下尽调必须核实的关键缺口。
