        - 参与股权轮次前，须验证单机物料清单（BOM）成本及客户留存情况。
    notes: 评估结论综合自已核实的融资里程碑、未经核实的收入信号以及管理层更迭情况。
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV010
  - id: TV002
    title: 投资逻辑与反向逻辑权衡
    columns:
      - 核心支柱
      - 正向投资逻辑
      - 反向质疑观点
      - 证伪触发条件
    rows:
      - - 精细操作知识产权
        - 类人机器人的灵巧操作能力可胜任固定工业机械臂无法执行的动态制造任务。
        - 机械复杂度高且液压维护开销巨大，拉高了现场实际故障率。
        - 未通过第三方独立基准测试，或客户拒绝承担液压维护要求。
      - - 战略背书
        - Magna、Bell 及 BDC Capital 等一线企业伙伴验证了其技术相关性。
        - 战略投资往往反映探索性概念验证（PoC）测试，而非真正导入产线采购。
        - 战略合作伙伴取消或未续签试点部署协议。
      - - 流动性跑道
        - $125M Apptronik 股权出售与 $50M Series B-2 轮融资提供充足跑道，短期内无需承担股权稀释。
        - 交易交割风险及老股买方监管审批可能拖延或缩减实际到账现金。
        - 未能在预定交易截止日前完成 Apptronik 股权出售交割。
      - - 市场竞争
        - 具备先发优势，深耕触觉传感与具身认知控制架构。
        - 资金雄厚的竞对（Figure AI、Tesla、Apptronik）坐拥远超本公司的资本体量。
        - 竞对人形机器人平台在工业汽车制造试点中迅速抢占市场份额。
    notes: 核心支柱对比了自研技术差异化壁垒与资本密集度及市场竞争之间的博弈。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV012
  - id: TV003
    title: 乐观、基准与悲观情景推演
    columns:
      - 情景
      - 概率
      - 核心假设
      - 估值与资本含义
      - 关键风险与触发因素
    rows:
      - - 乐观情景
        - 25%
        - Apptronik $125M 股权出售顺利交割；整合 Rapid Robotics 扩大美国业务版图；一线客户试点转化为多台规模化 RaaS。
        - 下一轮主力融资中，估值向 $1.5B–$2.5B 的人形机器人同业梯队靠拢。
        - 未能将汽车制造试点转化为多年期经常性商业合同承诺。
      - - 基准情景
        - 50%
        - Apptronik 交易完成交割，但 Series B-2 定价面临投资人审视；试点以适度节奏推进，但伴随高额定制化服务开销。
        - 估值预期在 $400M–$600M 区间整固，伴随平价过桥轮融资。
        - 硬件迭代周期冗长且部署节奏迟缓，持续消耗现金储备。
      - - 悲观情景
        - 25%
        - Apptronik 股权出售遇阻；高额烧钱加速现金耗尽；创始人出局后的管理层动荡打乱技术路线图。
        - 面临严重流血轮融资，或被迫以低于实缴资本的折价出售技术资产。
        - 流动性告急迫使公司寻求紧急结构化融资或承担高稀释性资本重组。
    notes: 情景分析基于流动性事件与落地部署里程碑，建模推演未来多年估值走势。
