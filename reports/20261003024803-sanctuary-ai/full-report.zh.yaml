              - CV012
      - number: '8.2'
        title: 投资建议、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们给予 Sanctuary AI 的综合建议为“继续研究”（research-more），风险评级为高，置信度为中，估值立场为未知。各监测平台与二级市场登记处的公开估值基准离散度极大，从私募战略轮的 $410M
              到未经证实的超 $500M 估值说法不等，而累计实缴资本估计约为 $140M。现阶段若要支撑“买入”评级，必须看到经核实的客户合同金额、单机生产经济效益，以及试点明确转化为经常性订阅或 RaaS
              合同的实证。计划中的 $125M Apptronik 股权转让以及由 NEA 和 Kleiner Perkins 联合领投的 $50M Series B-2
              轮股权融资提供了关键现金跑道，但股权结构与清算优先权细节仍未对外部投资者公开。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
