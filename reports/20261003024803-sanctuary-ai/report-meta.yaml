companyProfile:
  summary: >-
    Sanctuary AI is a Vancouver-based robotics company founded in 2018 around human-like manipulation, Phoenix humanoid
    robots, and the Carbon control stack. In 2026 the company pivoted toward a hardware-agnostic Physical AI strategy
    under new CEO Daniel Friedmann, packaging dexterous hands and manipulation software for third-party industrial arms
    while keeping humanoid robotics as a longer-term path. The business is backed by strategic and sovereign investors,
    but it still has no verified public pricing, ARR, or recurring customer revenue disclosures.
