      - number: '2.2'
        title: Addressable Market Sizing Lenses and Sizing Reality
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for physical AI and general-purpose robotics requires separating speculative top-down
              macroeconomic projections from evidence-constrained near-term addressable budgets. Macroeconomic research
              cited by industry participants projects that the broad market for general-purpose humanoid and dexterous
              robotics could exceed $100 billion globally during the 2030s, predicated on widespread substitution of
              human industrial labor. However, commercial evidence from 2026 demonstrates that the near-term serviceable
              addressable market (SAM) is bounded by active industrial pilots in structured sub-assembly and logistics
              rather than ubiquitous autonomous deployments.

              Sanctuary AI's commercial traction reflects this reality: the company operates in custom pilot stages with
              strategic manufacturing partners such as Magna in automotive sub-assembly, while tracking early enterprise
              engagements across retail and logistics. Third-party aggregator estimates report approximately 50 deployed
              units across pilot sites, while aggregator databases track total capital raised between $81 million and
              over $140 million across equity and Canadian government innovation funding. Sizing the serviceable
              obtainable market (SOM) is severely constrained by the lack of disclosed commercial ARR, published
              hardware pricing, or verified per-hour robot-as-a-service rates. Consequently, near-term obtainable spend
              remains confined to funded proof-of-concept deployments, research-and-development co-investments, and
              bespoke enterprise integration contracts.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: Enterprise Buyer Personas, Procurement Workflows, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of Sanctuary AI's physical AI platform spans three distinct operational segments:
              automotive manufacturing sub-assembly, contract logistics and fulfillment, and commercial retail
              operations. In automotive manufacturing—exemplified by Sanctuary AI's multi-unit deployment pilot with
              strategic backer Magna—the primary economic buyer is the Vice President of Manufacturing Engineering or
              Advanced Automation, with procurement budgets originating from capital projects and operational continuous
              improvement allocations. The end users are plant floor operators and assembly technicians, while plant
              managers and corporate automation directors evaluate line safety and cycle-time predictability.

              In logistics and retail environments, procurement workflows are sponsored by Heads of Supply Chain,
              Logistics Operations Directors, or Innovation Leads, tapping into warehouse labor substitution budgets.
              Across all segments, the procurement pathway follows a multi-stage gated evaluation: initial technical
              feasibility demonstrations, pilot cell buildout, safety and workspace integration testing, and pilot line
              validation. Crucially, Sanctuary AI's procurement operations involve a globally distributed supply chain
              for complex electromechanical parts, sensors, and structural components. Internal operational postings for
              robotics buyers indicate that procurement teams manage multi-vendor supply chains across hardware,
              software, and networking components to support both R&D prototypes and pilot production builds.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Growth Drivers, Capital Intensity, and Deployment Friction
        blocks:
          - type: paragraph
            body: >-
              Adoption of dexterous physical AI platforms is propelled by severe structural labor shortages across
              industrial manufacturing, warehousing, and logistics, coupled with corporate mandates to derisk operations
              from wage inflation and workforce turnover. Strategic distribution channels, such as Accenture's Project
              Spotlight partnership offering access to Global 2000 enterprise clients, provide market entry points into
              large industrial accounts seeking automated assistance for human workers. Furthermore, advancements in
              multi-embodiment AI and proprietary hydraulic hands enable manipulation tasks that previously resisted
              rigid automation.

              However, material commercial constraints severely restrict rapid scaling. First, Sanctuary AI maintains an
              entirely sales-led commercial motion with zero public pricing, rate cards, or robot-as-a-service hourly
              benchmarks, forcing prospective buyers through high-friction bespoke commercial inquiries. Second, the
              total cost of ownership extends far beyond initial hardware quotes: early deployments historically
              required substantial teleoperation labor and human-in-the-loop pilot assistance to collect behavioral
              data, creating heavy operational service overhead. Third, electromechanical hardware development carries
              high execution friction; internal technical program management processes emphasize strict entrance and
              exit criteria across prototype builds, new product introduction (NPI), and supplier verification to
              prevent schedule slips. These friction points make customer payback periods and autonomous duty cycles
              unverified in public benchmarks.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Investor Channel Interdependence
            body: >-
              Sanctuary AI's commercial strategy relies heavily on strategic investors who simultaneously act as
              development partners, pilot customers, and distribution channels. Magna provides automotive sub-assembly
              deployment sites and potential manufacturing scale, while Accenture offers enterprise access to Global
              2000 clients through Project Spotlight. While this structure secures captive early deployments without
              requiring an open public sales funnel, it limits independent pricing discovery and obscures broad-market
              enterprise demand.
            calloutType: insight
            claimRefs:
              - CM006
              - CM010
              - CM014
          - type: callout
            title: Commercial Opacity and Teleoperation Cost Burden
            body: >-
              The absence of public pricing or standardized robot-as-a-service hourly rates creates significant
              evaluation friction for non-strategic enterprise buyers. Furthermore, because early deployments rely on
              human teleoperation pilots to capture manipulation data and guide task execution, prospective buyers face
              an undisclosed and heavy service labor burden alongside physical line integration and workspace adaptation
              costs.
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM015
