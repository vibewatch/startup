            title: Structural Capital Disadvantage Versus Well-Funded Humanoid Peers
            body: >-
              Sanctuary AI's total disclosed funding of $148.6M is substantially lower than leading humanoid robotics
              competitors Figure AI ($1.75B+) and Apptronik ($935M+). This capital disparity creates serious risks in
              sustaining long-term GPU compute access, physical fleet production, and dedicated field integration
              support during extended enterprise pilot cycles.
            calloutType: risk
            claimRefs:
