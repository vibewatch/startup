      - number: '3.3'
        title: Distribution helps, but pricing and packaging remain opaque
        blocks:
          - type: paragraph
            body: >-
              No current public Phoenix list price or standard ordering pathway appears in the retained evidence. The
              strongest available buyer review characterizes engagements as project-based and advises buyers to obtain a
              complete proposal covering the embodiment, integration, task policy, and support. Accenture's Project
              Spotlight relationship may improve enterprise access through Accenture's Global 2000 network, but it is
              evidence of channel reach rather than proof of deployments or realized revenue. Company-issued job
              listings also point to active work across NPI, pilot builds, ERP, BOM control, suppliers, and
              manufacturing. Those signals imply that switching costs may accrue in integration, production data,
              end-effectors, and operating processes rather than in Phoenix hardware alone; public contract terms,
              discounts, service levels, and exit rights remain unknown.
            claimRefs:
              - CP002
              - CP013
