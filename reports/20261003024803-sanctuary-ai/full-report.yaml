              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: Scenario Analysis, Peer Multiples, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Underwriting scenarios for Sanctuary AI diverge dramatically across operating outcomes. In the bull case,
              successful closing of the $125 million Apptronik asset sale and integration of Rapid Robotics provide
              multi-year non-dilutive runway to scale commercial production of Phoenix with tier-one automotive and
              logistics partners, validating a multi-billion-dollar enterprise valuation in line with peers. In the base
              case, capital markets demand demonstrated unit economics and contracted gross margin proof before funding
              full production runs, requiring bridge debt or down-round equity. In the bear case, severe competitive
              pressure from mega-cap peers like Tesla and Figure AI, alongside hardware commoditization and leadership
              instability, leads to significant valuation compression and asset liquidation. Institutional investors
              must establish firm thesis-break triggers and resolve critical diligence gaps regarding cap-table
              seniority, unit manufacturing costs, and pilot retention.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Verdict: Research-More Pending Audit'
            body: >-
              Sanctuary AI represents a premier engineering asset in humanoid dexterity, but private valuation claims of
              $410M to $500M+ cannot be validated without audited ARR, gross margins, and cap-table seniority.
              Institutional allocators should track execution milestones and wait for verified closing of the Apptronik
              equity divestment before committing risk capital.
            calloutType: recommendation
