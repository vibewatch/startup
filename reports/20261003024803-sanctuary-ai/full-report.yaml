chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Strategic Pivot
        blocks:
          - type: paragraph
            body: >-
              Sanctuary Cognitive Systems Corp., trading commercially as Sanctuary AI, was founded in 2018 in Vancouver,
              British Columbia, Canada, by Geordie Rose, Suzanne Gildert, Olivia Norton, and Ajay Agrawal. The founding
              group brought deep technical heritage from prior pioneer ventures including quantum computing leader
              D-Wave Systems, early robotic reinforcement learning pioneer Kindred, and the Creative Destruction Lab.
              The company was established with the ambitious mission to build human-like intelligence in general-purpose
              robots capable of performing physical work alongside human laborers across industrial manufacturing,
              warehousing, and retail environments. For several years, Sanctuary AI focused on developing its flagship
              Phoenix general-purpose humanoid robot alongside its proprietary Carbon cognitive architecture, which
              blends deep learning and modern large language models with symbolic logic, reasoning, and photorealistic
              simulation. However, as documented in industry analyses and corporate disclosures, whole-body humanoid
              development demanded immense capital outlays that became challenging against heavily capitalized American
              robotics developers. On June 17, 2026, Sanctuary AI formally executed a major corporate pivot: rather than
              continuing to position the fully integrated Phoenix humanoid as its primary commercial product, the
              company restructured around a multi-embodiment Physical AI software strategy. Under this revised business
              model, Sanctuary AI packages its production-ready Physical AI platform and industrial-grade hydraulic
              hands (featuring 17 to 21 degrees of freedom) for deployment on commercially available industrial robot
              arms, positioning whole-body humanoids as an exploratory long-term path rather than its near-term
              commercial deliverable.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
