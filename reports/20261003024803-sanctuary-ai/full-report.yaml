      - number: '7.2'
        title: Regulatory Compliance, Safety Certification, and Deployment Governance
        blocks:
          - type: paragraph
            body: >-
              Deploying general-purpose humanoid robots into active industrial and commercial workspaces triggers strict
              occupational safety standards, machine directive certifications, and liability regimes. Emerging machinery
              safety regulations mandate comprehensive risk assessments and fail-safe stop mechanisms for mobile
              manipulators operating in proximity to human workers. Because Phoenix combines mobile manipulation with
              autonomous goal-seeking AI architectures, certifying compliance under existing OSHA and international
              robotics safety standards remains an unresolved hurdle. Without public disclosure of formal safety
              certifications or third-party audits, commercial rollouts remain vulnerable to regulatory halts or
              insurer-mandated operational restrictions.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
