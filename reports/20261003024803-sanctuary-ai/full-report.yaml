      - number: '1.3'
        title: Capitalization Structure, Financing Gaps, and Investor Coalition
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI's capitalization history is characterized by a distinctive combination of Canadian sovereign
              innovation backing, Tier-1 corporate venture arms, and strategic industrial partners. In March 2022, the
              company completed a C$75.5 million Series A round (US$59 million equivalent) backed by telecommunications
              carrier Bell, automotive contract manufacturing giant Magna International, Verizon Ventures, Workday
              Ventures, and Export Development Canada. In November 2022, the federal Government of Canada awarded
              Sanctuary AI a C$30 million non-dilutive grant through the Strategic Innovation Fund (SIF), bringing total
              public and private backing over C$100 million. In March 2024, Accenture Ventures completed a strategic
              investment through its Project Spotlight accelerator to evaluate humanoid applications across global
              enterprises, followed in July 2024 by strategic equity financing from BDC Capital's Thrive Venture Fund
              and British Columbia's InBC Investment Corp at an estimated $410 million post-money valuation marker.
              Third-party industry trackers report cumulative funding exceeding $140 million; however, conflicting
              capital reports—specifically whether a reported June 2024 US$100 million Series B and the EDC credit
              facility represented distinct or overlapping instruments—and unconfirmed reports of secondary liquidity
              from Sanctuary's Apptronik holdings mean the exact cap table, available cash reserves, and active burn
              rate remain critical private due diligence gaps.
