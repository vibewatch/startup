      - number: '3.4'
        title: The moat is plausible but not independently benchmarked
        blocks:
          - type: paragraph
            body: >-
              Sanctuary's defensibility case rests on proprietary hands, tactile data, control software, and the ability
              to deploy intelligence across more than one hardware form. Its company-issued release also cites a strong
              patent position, but the retained evidence does not provide an independent patent-quality analysis or a
              controlled comparison of manipulation performance. The adverse case is therefore practical: a buyer may
              select Digit for a narrower logistics workflow, Figure or Apollo for a clearer humanoid roadmap, 1X for a
              home use case, or conventional automation for a fixed task. Sanctuary wins only where difficult
              manipulation justifies customization and where its deployment can meet cycle-time, intervention, safety,
              and service requirements. Until those measures are independently validated, differentiation should be
              treated as promising rather than durable.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A differentiated hand is not yet a complete moat
            body: >-
              Buyers still need generation-specific performance, safety, intervention, service, and total-cost evidence.
              Without those data, narrower robots or conventional automation can displace Sanctuary even when Phoenix
              appears technically more general.
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI operates a consultative land-and-expand commercial model designed to automate dynamic
              industrial tasks that conventional fixed automation cannot reliably handle. The company's initial revenue
              generation derives primarily from non-recurring engineering fees, custom end-effector configuration
              charges, and structured deployment milestone billings rather than high-margin recurring software licenses.
              Long-term commercial plans envision software licensing per robotic cell, annual maintenance and support
              agreements, ongoing task-policy retraining packages, and centralized fleet-management fees. However,
              Sanctuary AI has not publicly disclosed standard pricing tiers, list prices, or recurring contract floors.
              The commercial strategy emphasizes hardware-agnostic deployment of its Carbon and Physical AI intelligence
              layers on standard commercial robot arms from manufacturers such as FANUC and Universal Robots, targeting
              high-value manipulation workflows in automotive manufacturing and industrial assembly.
            claimRefs:
              - CI001
