      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI has raised approximately $148.6M in cumulative disclosed capital across equity rounds,
              venture debt, and Canadian governmental innovation contributions through April 2026. While independent
              robotics databases record an estimated $410M post-money valuation following mid-2024 strategic financings
              and historical reports indicate $500M valuation marks, secondary platforms confirm that Sanctuary AI has
              no official priced round or public exchange valuation. With roughly 50 deployed units reported in early
              field trials and over 200 personnel, cash burn remains substantial against minimal recognized commercial
              revenues. Crucially, Sanctuary AI faces a major capital disadvantage compared to Western humanoid
              competitors such as Figure AI (over $1.75B raised) and Apptronik (over $935M raised), leaving the company
              heavily dependent on further strategic capital infusions or non-dilutive government support to maintain
              ongoing R&D and achieve commercial runway.
            claimRefs:
