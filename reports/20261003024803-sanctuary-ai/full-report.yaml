  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Target Spend, and Physical AI Scope
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for Sanctuary AI requires distinguishing general-purpose physical AI and
              dexterous manipulation from legacy industrial automation. Traditional industrial robotics spend is
              concentrated in high-throughput, structured environments such as fixed welding cells, heavy stamping
              presses, and rigid automotive pick-and-place lines. These incumbent solutions automate repetitive tasks
              with dedicated, purpose-built fixtures but fail in unstructured, dynamic workflows that demand fine
              tactile sensing and multi-axis dexterity. Sanctuary AI positions its platform to capture labor spend
              allocated to tasks that traditional automation cannot reliably execute. In its strategic positioning,
              Sanctuary AI emphasizes deploying production-ready Physical AI on commercially available robotic systems
              across varied form factors, including industrial robotic arms and proprietary hydraulic hands, with a
              long-term path to general-purpose humanoids.

              The spend targeted by Sanctuary AI includes direct industrial labor budgets, specialized automation
              engineering integration fees, and pilot deployment line tooling. Conversely, the company's scope
              explicitly excludes traditional fixed-function automation capital expenditures and commodity metered
              enterprise software subscriptions. The status-quo substitute across target facilities remains human
              labor—often augmented by legacy robotic arms lacking dexterous end effectors—alongside teleoperated
              specialized tooling. In positioning its intellectual property, Sanctuary AI highlights its global ranking
              in patents for general-purpose robotics and dexterous manipulation, positioning touch and grasping assets
              as core enablers for capturing industrial labor substitution spend in dynamic environments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
