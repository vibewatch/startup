    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of Sanctuary AI from foundation and humanoid prototyping to executive restructuring and
      the 2026 industrial Physical AI software pivot.
    data:
      items:
        - label: '2018: Foundation'
          date: '2018-01-01'
          detail: Sanctuary AI is founded in Vancouver by Geordie Rose, Suzanne Gildert, Olivia Norton, and Ajay Agrawal.
          claimRefs:
            - CO002
        - label: '2022-03: Series A'
          date: '2022-03-15'
          detail: Sanctuary closes a C$75.5M (US$59M) Series A round led by Bell, with Magna, Verizon, and Workday.
          claimRefs:
            - CO011
        - label: '2022-11: Federal SIF Grant'
          date: '2022-11-20'
          detail: Government of Canada awards a C$30M Strategic Innovation Fund grant, bringing total funding over C$100M.
          claimRefs:
            - CO012
        - label: '2023-01: Retail Teleoperation Pilot'
          date: '2023-01-31'
