      - number: '4.2'
        title: Pricing Transparency and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency for Sanctuary AI's robotics systems is nonexistent, reflecting an early-stage
              enterprise sales cycle characterized by bespoke proofs of concept and custom partner integrations. In
              private secondary markets, accredited investor platforms list Sanctuary AI's share price and valuation as
              undisclosed with no reputable priced transaction benchmarks reported. Enterprise procurement cycles in
              heavy industrial and automotive environments typically require extensive testing against production
              performance benchmarks before commercial expansion is considered. Sales efficiency proxies like customer
              acquisition cost, payback periods, and sales cycle duration cannot be underwritten from public
              disclosures. Sanctuary AI mitigates direct field service and sales distribution overhead by collaborating
              with strategic corporate partners like Accenture Ventures and automotive tier-one supplier Magna
              International to access established Global 2000 industrial customer footprints.
            claimRefs:
