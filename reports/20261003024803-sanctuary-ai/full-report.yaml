      - number: '3.2'
        title: Dexterity leads the thesis; procurement clarity trails it
        blocks:
          - type: paragraph
            body: >-
              Sanctuary's strongest public differentiation is its focus on touch, hands, and difficult manipulation. A
              company-issued release says tactile sensing is intended to support blind picking, slip detection, and
              force control, while the historical Generation 6 launch specified a 55-pound maximum payload and a Carbon
              control stack. Those historical specifications should not be applied to Generation 8 without
              qualification: the independent review says Sanctuary has not published an equivalent complete current
              specification sheet. Figure is presented as a vertically integrated biped, Digit as a clearer logistics
              proposition, Apollo as an industrial deployment platform, and 1X NEO as home-focused. These are editorial
              characterizations rather than independent performance benchmarks; current safety certification, uptime,
              intervention rate, and task-cycle comparisons remain unavailable in the assigned evidence.
            claimRefs:
