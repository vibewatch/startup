      - number: '1.2'
        title: Executive Leadership, Governance Turbulence, and Key-Person Continuity
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI experienced severe leadership and governance turnover across 2024 and 2025 that fundamentally
              reshaped its executive committee. Co-founder and Chief Technology Officer Suzanne Gildert departed the
              company in April 2024 to pursue independent ventures in artificial intelligence consciousness,
              subsequently founding Nirvanic. Seven months later, in November 2024, Sanctuary AI's board of directors
              ousted co-founder and Chief Executive Officer Geordie Rose in an unexpected transition accompanied by the
              layoff of approximately 30 engineering and operational personnel amid mounting pressure regarding
              fundraising sustainability. Following an interim period where the company floated emergency convertible
              debt to bridge operations, the board installed Daniel Friedmann—former chief executive officer of
              aerospace and space robotics leader MDA and industrial decarbonization firm Carbon Engineering—as Chief
              Executive Officer in June 2026. Friedmann was given an explicit mandate to scale industrial monetization
              and transition Sanctuary AI from an exploratory hardware research laboratory into an execution-oriented
              enterprise software and component provider. Operational stability now relies heavily on senior program
              execution leaders, engineering specialists, and remaining technical co-founders like Chief Technology
              Officer Olivia Norton, though key-person risk remains elevated following the exit of the founding
              technical visionary and chief executive.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
