              - CE013
      - number: '5.2'
        title: Carbon Cognitive Architecture and Physical AI Control System
        blocks:
          - type: paragraph
            body: >-
              At the core of Sanctuary AI's software stack is Carbon, a proprietary hybrid cognitive architecture
              combining symbolic reasoning, modern large language models, deep reinforcement learning, and
              physics-realistic simulation. Rather than relying purely on end-to-end black-box imitation learning,
              Carbon implements an explainable four-stage operational loop: Understanding, Planning, Execution, and
              Learning. In the Understanding phase, language models parse natural language instructions into semantic
              goals. In the Planning phase, symbolic logic decomposes complex goals into deterministic, auditable action
              graphs and motion plans. In the Execution phase, low-level neural controllers coordinate high-frequency
              motor actuation across hydraulic actuators and tactile sensor loops. Finally, during the Learning phase,
              fleet-wide teleoperation demonstrations and physical interactions feed back into centralized models.
              Teleoperation with human-in-the-loop demonstration initially required several weeks of data capture per
              task; by Generation 7, Sanctuary demonstrated 24-hour task learning where autonomous replication succeeded
              after a single day of demonstration. Despite these algorithmic advances, generalizing manipulation outside
              narrow task envelopes without human teleoperation interventions remains an ongoing technical frontier.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE012
              - CE014
      - number: '5.3'
        title: Production Line Integration and the Industrial Automation Expansion
        blocks:
          - type: paragraph
            body: >-
              In mid-2026, under newly appointed Chief Executive Officer Daniel Friedmann, Sanctuary AI formally
              broadened its commercial approach from exclusive humanoid embodiment to hardware-agnostic Physical AI for
              industrial automation. Recognizing that enterprises face immediate labor shortages but cannot wait for
              mass-market bipedal humanoids, Sanctuary decoupled its Carbon manipulation models and dexterous tooling
              from the Phoenix chassis. In June 2026, Sanctuary announced a landmark proof-of-concept with a global Tier
              1 automotive supplier, deploying dual robotic arms with custom end effectors directly under a moving
              conveyor line to perform flexible wire plugging. The deployment achieved a 99.5% success rate with an
              industrial cycle time of 2.54 seconds across 313 insertion trials during a 40-minute test, matching line
              throughput. However, CEO Friedmann confirmed that this deployment remains at the proof-of-concept stage
              rather than multi-facility serial production. To transition from prototypes to scalable delivery,
              Sanctuary is actively recruiting senior electromechanical leadership to enforce Design for Manufacturing
              (DFM), Design for Testing (DFT), and Design for Reliability (DFR) standards across its global supply
              chain.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
