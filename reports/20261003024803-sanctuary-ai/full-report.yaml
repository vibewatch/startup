    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than humanoids
        blocks:
          - type: paragraph
            body: >-
              Sanctuary competes directly with general-purpose humanoid programs such as Figure, Agility Robotics,
              Apptronik, and 1X, but the buyer's real choice set also includes conventional industrial automation,
              internal integration, and continued manual work. Sanctuary's current website emphasizes Physical AI that
              can run across multiple embodiments, while an independent buyer review describes Generation 8 Phoenix as a
              wheeled platform rather than a standard off-the-shelf biped. That shift broadens Sanctuary's addressable
              workflows but also moves the comparison from robot-versus-robot toward complete deployment outcomes.
              Funding directories indicate that several named peers have substantial disclosed capital, although those
              figures are publisher-reported funding raised, not cash available, and are not normalized across
              currencies, dates, or financing instruments.
