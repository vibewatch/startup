  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Evolving Commercial Interfaces
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI targets four primary buyer segments across industrial and enterprise markets: automotive
              manufacturing suppliers, general industrial automation operators, retail logistics and store operations,
              and strategic telecommunications and systems integrators. Historically, commercial engagements centered on
              exploring the Phoenix general-purpose humanoid robot as a physical labor substitute. However, enterprise
              buyers exhibited hesitation regarding whole-body humanoid hardware maturity, high unit capital costs, and
              long deployment timelines. In response, Sanctuary AI shifted its commercial interface toward a
              multi-embodiment Physical AI model that deploys its cognitive manipulation software and proprietary
              hydraulic dexterity subsystems directly onto commercially available robotic arms. Commercial discussions
              now focus on industrial manufacturing leaders seeking labor automation for complex assembly tasks that
              classical fixed automation cannot reliably handle. Strategic enterprise partners such as Accenture, Bell,
              and Microsoft act as foundational channel facilitators: Accenture incorporates Sanctuary into its Project
              Spotlight accelerator to evaluate deployments across Global 2000 clients, Bell explores teleoperated
              labor-as-a-service models, and Microsoft collaborates on Large Behavior Models to facilitate real-world
              learning across dynamic industrial settings.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
