      - number: '7.4'
        title: Capital Intensity, Financing Uncertainty, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Humanoid robotics development requires exceptional capital expenditure across hardware iteration,
              fabrication, data collection, and embodied AI training. Tracker records report total funding exceeding
              $140M with valuations estimated between $410M and $500M+, yet public evidence indicates the company
              remains in demo and early pilot stages without documented recurring customer revenue or unit economics.
              Unclear capital structures and conflicting financing data create substantial dilution and down-round risks
              if commercial deployments fail to yield cash generation. Monitoring indicators such as pilot attrition,
              executive departures, and uncontained cash burn serve as critical thesis-break triggers.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hydraulic Dexterity Complexity vs. Industrial Reliability
            body: >-
              Sanctuary AI's competitive differentiation centers on its proprietary 20-DOF hydraulic robotic hands.
              However, hydraulics in fine manipulation introduce persistent seal degradation, fluid leakage risks, and
              maintenance complexity that may render commercial deployments unviable compared to electric actuation in
              high-throughput industrial environments.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
          - type: callout
            title: Establish Stringent Pilot Exit and Commercial Kill Criteria
            body: >-
              Underwriters should condition follow-on commitments on demonstrated MTBF data exceeding 500 hours in
              production environments, formal ISO machinery safety certifications, and audited conversion of pilot
              deployments into multi-year recurring commercial contracts.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI occupies a differentiated technical niche in general-purpose humanoid robotics, prioritizing
              human-level hand dexterity and hydraulic actuation controlled by its Carbon cognitive architecture. The
              affirmative investment thesis rests on four structural pillars: pioneering manipulation intellectual
              property, backing from industrial strategics including Magna International and Bell, a strategic $125
              million non-dilutive liquidity event via its Apptronik equity divestment, and growing institutional
              sponsorship from BDC Capital and InBC. These elements position Sanctuary to capture dynamic manufacturing
              automation workflows that conventional fixed automation cannot automate. However, the anti-thesis is
              equally formidable: the company lacks disclosed contracted recurring revenue, pilot economics remain
              opaque, and capital requirements in humanoid hardware are vast. The ouster of co-founder and chief
              executive Geordie Rose in November 2024 alongside workforce layoffs underscores ongoing governance
              turbulence during a pivotal commercialization transition.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV012
      - number: '8.2'
        title: Recommendation, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We assign Sanctuary AI an overall recommendation of research-more with high risk, medium confidence, and
              an unknown valuation stance. Publicly reported valuation benchmarks exhibit extreme dispersion across
              tracking platforms and secondary registries, ranging from $410 million in private strategic rounds to
              unverified claims exceeding $500 million, while cumulative paid-in capital is estimated at approximately
              $140 million. Underwriting a buy rating at this stage would require verified customer contract values,
              unit production economics, and confirmed conversion of pilot deployments into recurring subscriptions or
              Robot-as-a-Service contracts. The planned $125 million Apptronik share divestment and $50 million Series
              B-2 equity round co-led by NEA and Kleiner Perkins provide crucial runway, but cap-table structure and
              liquidation preferences remain undisclosed to outside investors.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
