  - id: TV002
    title: Thesis and Anti-Thesis Balance
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterpoint
      - Falsification Trigger
    rows:
      - - Manipulation IP
        - Human-like robotic dexterity enables dynamic manufacturing tasks that fixed industrial arms cannot execute.
        - High mechanical complexity and hydraulic maintenance overhead increase field failure rates.
        - Independent benchmark failure or customer rejection of hydraulic maintenance requirements.
      - - Strategic Backing
        - Tier-one enterprise partners like Magna, Bell, and BDC Capital validate technology relevance.
        - Strategic investments often signal exploratory proof-of-concept testing rather than production procurement.
        - Cancellation or non-renewal of strategic partner pilot deployment agreements.
      - - Liquidity Runway
        - $125M Apptronik stake sale and $50M Series B-2 provide substantial runway without immediate dilution.
        - Transaction closing risk and secondary buyer regulatory approvals could delay or shrink cash proceeds.
        - Failure to close the Apptronik equity sale by scheduled transaction deadlines.
      - - Market Competition
        - Early entrant advantage with specialized focus on tactile sensing and embodied cognitive architecture.
        - Heavily capitalized peers (Figure AI, Tesla, Apptronik) command vastly superior capital resources.
        - Rapid market share capture by competing humanoid platforms in industrial automotive pilots.
    notes: Pillars contrast proprietary technical differentiation against capital intensity and market competition.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV012
  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Probability
      - Core Assumptions
      - Valuation / Capital Implication
      - Key Risks and Triggers
    rows:
      - - Bull Case
        - 25%
        - >-
          Apptronik $125M sale closes smoothly; Rapid Robotics integration expands US footprint; tier-one pilots convert
          to multi-unit RaaS.
        - Valuation expands toward $1.5B–$2.5B humanoid peer tier in next major financing.
        - Failure to convert automotive pilots into recurring multi-year commercial commitments.
      - - Base Case
        - 50%
        - >-
          Apptronik transaction closes but Series B-2 pricing faces investor scrutiny; pilot progress continues at
          modest pace with high custom service overhead.
        - Valuation marks consolidate around $400M–$600M with flat extension rounds.
        - Prolonged hardware iteration cycles and slow deployment cadence drain cash reserves.
      - - Bear Case
        - 25%
        - >-
          Apptronik stake sale stalls; high burn accelerates cash depletion; post-founder leadership changes disrupt
          technical roadmaps.
        - Severe down-round financing or distressed technology asset sale below paid-in capital.
        - Liquidity shortfall forcing emergency structured capital or dilutive recapitalization.
    notes: Scenario analysis models multi-year valuation outcomes based on liquidity events and deployment milestones.
    claimRefs:
      - CV004
      - CV005
      - CV007
