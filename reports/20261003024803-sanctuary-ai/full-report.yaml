      - number: '4.3'
        title: Cost Structure and Capital Expenditure Drivers
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI's operating expense profile is characterized by high fixed research and development
              expenditures alongside variable deployment integration costs. Major cost drivers encompass specialized AI
              research talent, electromechanical and hydraulic engineering teams, advanced tactile sensor fabrication,
              and compute infrastructure utilized for large-scale GPU simulation in NVIDIA Isaac Lab. By adapting its
              Physical AI software to commercially available robotic arms rather than manufacturing entire humanoid
              bodies at automotive scale, Sanctuary AI reduces near-term tooling, battery pack, and bipedal chassis
              capital expenditures. Nonetheless, operational expenditures remain elevated due to specialized hiring
              across Vancouver and required hands-on engineering for on-site pilot trials. Strategic material
              partnerships, such as elastomer development collaboration with Zeon Corporation, aim to reduce long-term
              bill-of-materials costs and enhance hardware durability for hydraulic hands on factory floors.
            claimRefs:
