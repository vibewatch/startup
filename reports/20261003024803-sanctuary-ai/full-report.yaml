  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Robotic Embodiments and Electromechanical Hardware Architecture
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI began by building general-purpose humanoid robots designed to navigate unmodified human work
              environments. Its flagship humanoid platform, Phoenix, stands 5 feet 7 inches tall, weighs 155 pounds,
              supports a maximum payload of 55 pounds, and operates at speeds up to 3 miles per hour. A central design
              thesis established by co-founders Geordie Rose and Suzanne Gildert was that human-scale dexterous
              manipulation requires replicating human hand biomechanics rather than relying on crude industrial parallel
              grippers. To achieve this, Sanctuary engineered proprietary hydraulic robotic hands providing 20 degrees
              of freedom alongside integrated haptic sensors capable of detecting subtle mechanical vibrations. By its
              seventh generation in April 2024, Sanctuary introduced miniaturized hydraulics, enhanced tactile sensing,
              and improved wrist, hand, and elbow flexibility, while Generation 8 transitioned to a strong torso, dual
              arms, and sensor head mounted on a wheeled base to improve manufacturing simplicity and sensor bandwidth.
              However, scaling full humanoid hardware into production proved constrained by cost, thermal management,
              and electromechanical maintenance, prompting a critical strategic expansion in 2026 toward modular
              industrial arm deployments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE012
              - CE014
          - type: figure
            figureRef: FE001
