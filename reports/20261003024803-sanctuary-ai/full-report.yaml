            title: Proof-of-Concept to Production Scaling Chasm
            body: >-
              Sanctuary AI has demonstrated outstanding technical task benchmarks, including 2.54-second wire insertion
              cycles at a 99.5% success rate and 110 retail tasks in store trials. However, the company has yet to
              publicly demonstrate conversion from bounded pilot demonstrations into multi-facility production rollouts
              generating recurring software revenue.
            calloutType: risk
