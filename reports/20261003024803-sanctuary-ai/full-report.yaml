          - type: callout
            title: Capital Efficiency via Hardware-Agnostic Deployment
            body: >-
              By running its Physical AI intelligence layer on commercially available industrial robot arms from
              Universal Robots and FANUC, Sanctuary AI avoids the intensive capital expenditures required to manufacture
              and service bespoke bipedal humanoid chassis at automotive scale, focusing capital on dexterous
              manipulation algorithms.
            calloutType: insight
            claimRefs:
