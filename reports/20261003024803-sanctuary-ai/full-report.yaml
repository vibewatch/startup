      - number: '6.3'
        title: Named Customer Proof, Retention Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence for Sanctuary AI is characterized by strategic enterprise pilots and
              investor-backed commercial collaborations. Canadian Tire Corporation and Magna International represent the
              company's most visible commercial partners, with Magna providing both strategic venture investment and
              automotive factory testing environments. Strategic services firms like Accenture provide access to
              enterprise pipelines, while communications providers like Bell and Verizon examine edge compute and 5G
              connectivity for remote robot operation. However, audited metrics regarding customer retention, net
              revenue retention (NRR), gross revenue retention (GRR), and subscription contract renewals are completely
              undisclosed. Sanctuary AI has not disclosed recurring software contract values, annual recurring revenue
              (ARR), customer acquisition costs, or multi-year enterprise commitments. Furthermore, customer
              concentration risk is exceptionally high: near-term commercial viability depends disproportionately on
              converting early pilots with Magna and automotive tier-one partners into formal recurring software license
              agreements.
