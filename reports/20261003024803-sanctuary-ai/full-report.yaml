      - number: '7.3'
        title: Supply Chain Dependencies and Strategic Partner Friction
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI's operational scalability depends heavily on specialized international suppliers and
              strategic corporate partners. Recruitment data confirms the company is actively staffing procurement
              functions to establish vendor relationships for complex electromechanical, sensor, and networking
              components across a global supply chain. While strategic backing from industrial leaders like Magna
              International, Accenture, and Canadian public development funds provides strategic entry points, the
              company faces counterparty execution risk and potential strategic divergence. Disagreements over
              commercialization timelines, IP ownership, or pilot milestones could disrupt scaling efforts and limit
              market expansion.
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
          - type: table
