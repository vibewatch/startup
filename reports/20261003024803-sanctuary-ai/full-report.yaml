  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical Feasibility and Hardware Reliability Failures
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI's Phoenix humanoid robot incorporates complex 20-degree-of-freedom hydraulic hands designed
              to achieve human-level dexterity. However, maintaining mechanical durability, seal integrity, and
              deterministic control across demanding industrial duty cycles presents steep engineering failure modes.
              Job requisitions for hardware technical project managers and systems test engineers highlight ongoing
              efforts to establish basic verification, validation, and engineering change order workflows across
              prototype, NPI, and early production phases. The reliance on stochastic machine learning models operating
              alongside symbolic reasoning introduces significant predictability risks in physical environments, where
              unvetted failure modes could lead to workplace safety hazards or costly downtime.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
