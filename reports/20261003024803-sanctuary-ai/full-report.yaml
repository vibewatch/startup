      - number: '6.2'
        title: Adoption Trajectory, Benchmark Outcomes, and Deployment Reality
        blocks:
          - type: paragraph
            body: >-
              Sanctuary AI's public deployment trajectory spans discrete pilot demonstrations rather than scaled
              production rollouts across commercial fleets. In retail environments, Canadian Tire Corporation hosted a
              landmark week-long pilot at a Mark's retail store in Langley, British Columbia, where a teleoperated
              general-purpose robot completed 110 retail-related tasks across front-of-store and back-of-store
              workflows. In the industrial manufacturing sector, Sanctuary AI conducted live line trials with a global
              Tier 1 automotive supplier, deploying its Physical AI system to execute high-precision wire insertion
              under moving conveyor lines. In that benchmark, the system achieved a 99.5% success rate with an
              industrial cycle time of 2.54 seconds across 313 insertion cycles during a 40-minute testing run,
              validating speed and force repeatability on live production lines. While third-party aggregators such as
              Humanoid Index cite approximately 50 deployed or shipped prototype units, independent industry trackers
              like RobotHub classify Sanctuary AI's active operational status at the demonstration and pilot stage
              rather than scaled commercialization. Long-term field durability across multi-shift continuous industrial
              operations remains an open engineering question.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
