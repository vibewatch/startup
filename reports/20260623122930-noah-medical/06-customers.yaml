figures:
  - id: FU001
    title: Galaxy System Customer Journey — Segments, Adoption Surfaces, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      Customer journey from CT-detected nodule through hospital system acquisition,
      physician champion adoption, and network expansion back into new community sites.
    data:
      nodes:
        - id: j1
          label: Nodule Detected
          detail: >-
            Lung nodule identified via LDCT, incidental CT, or screening program. Approximately
            1.6 million nodules detected in the U.S. annually. Patient referred to
            interventional pulmonologist for evaluation.
          tone: neutral
        - id: j2
          label: Physician Champion Awareness
          detail: >-
            Interventional pulmonologist encounters Galaxy System at AABIP/CHEST conference,
            peer publication, or Noah Medical sales outreach. Physician evaluates clinical
            differentiation (TiLT+ imaging, single-use scope, no CBCT requirement).
          tone: neutral
        - id: j3
          label: Hospital Capital Approval
          detail: >-
            Physician champion builds service-line business case covering capital cost,
            per-procedure reimbursement (APC + C1601 TPT), and diagnostic-yield improvement.
            Capital committee approval required; timing varies by hospital budget cycle.
          tone: warning
        - id: j4
          label: Training and First Case
          detail: >-
            System installed in bronchoscopy or endoscopy suite. Physician training on
            TiLT+ navigation, augmented fluoroscopy, and single-use bronchoscope workflow.
            FRONTIER study showed rapid deployment even with minimal robotic experience.
          tone: positive
        - id: j5
          label: Active Procedure Volume
          detail: >-
            Site generates ongoing Galaxy procedures (biopsy of peripheral pulmonary nodules).
            Physician generates field data; selected sites participate in multicenter studies
            (MATCH 2, Beyond the Scope), becoming named KOL evidence contributors.
          tone: positive
        - id: j6
          label: Network Expansion and Referral
          detail: >-
            Active sites drive intra-network diffusion (UChicago → Ingalls Memorial) and
            conference-based peer influence. KOL physicians become advisors, increasing
            system stickiness. New community hospitals enter the journey funnel.
          tone: positive
    claimRefs: [CU002, CU004, CU007, CU009, CU013, CU019, CU024, CU025, CU034]

