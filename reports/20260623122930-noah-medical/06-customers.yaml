company:
  name: Noah Medical

chapter:
  number: 6
  title: Customers
  summary: >-
    Noah Medical's Galaxy System customer base consists of U.S. and international hospital
    systems—principally interventional-pulmonology programs—spanning academic medical centers,
    large community hospitals, and mid-sized health systems. Public evidence confirms at least
    seven named production sites, more than 5,000 U.S. cumulative procedures by March 2025,
    and a traceable 22-month adoption ramp from first commercial case to milestone. Buyer/user
    and payer dynamics center on hospital capital committees, interventional pulmonologist
    champions, and Medicare procedure reimbursement supplemented by transitional pass-through
    (TPT) payments for single-use bronchoscopes. Key proof gaps are the undisclosed total
    installed base, absence of published retention or churn data, and heavy reliance on
    physician investigators with disclosed Noah Medical financial ties at early adopter sites.

sections:
  - id: customer-segments-buyer-dynamics
    title: Customer Base Segmentation and Buyer, User, Payer Roles
    body: >-
      The Galaxy System's end customer is the hospital or health system that purchases the
      robotic capital unit and consumes single-use disposable bronchoscopes per procedure.
      Buyers segment into three identifiable tiers. Academic medical centers (AMCs), such as
      the University of Chicago Medicine and Inova Fairfax Medical Center (Virginia), are
      first-mover adopters with large interventional pulmonology programs, robust research
      infrastructure, and Medicare/commercial payer mixes that support capital investment
      in advanced bronchoscopy. Large community hospitals—exemplified by CHI Memorial in
      Chattanooga, Tennessee (part of the CommonSpirit Health network) and Long Island Jewish
      Medical Center in New Hyde Park, New York (a Northwell Health affiliate)—represent the
      critical second-tier segment where mid-2024 adoption signals a broadening beyond
      research centers. Smaller and rural community hospitals, represented by WVU Camden
      Clark Medical Center in West Virginia, where one of only two interventional pulmonologists
      in the state operates, form the emerging third tier that the "Beyond the Scope" study
      demonstrated can achieve economic sustainability with Galaxy.

      The buyer role is held by hospital administration or a physician-executive service-line
      leader who builds and champions a capital-expenditure business case through the annual
      or ad hoc capital committee process. The user is the interventional pulmonologist (IP)
      who performs procedures; Galaxy's compact footprint and single-use bronchoscope allow
      deployment in an endoscopy suite, not only in an operating room, which broadens the
      user setting for smaller sites. The payer for Galaxy-enabled procedures is Medicare
      (approximately 60% of procedure volume in community settings), supplemented by
      commercial insurance and, to a lesser extent, Medicaid. The champion at most confirmed
      sites has been a named IP physician-investigator with early access to Noah Medical's
      clinical programs and, in several cases, a disclosed financial relationship with the
      company.
    claimRefs: [CU001, CU004, CU005, CU009, CU010, CU024, CU025]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: named-customer-evidence
    title: Named Customer Proof and Clinical Site Evidence
    body: >-
      Seven or more named hospital sites have been confirmed as Galaxy System production users
      through company press releases, hospital newsroom pages, peer-reviewed publications,
      and conference presentations. The University of Chicago Medicine was the first U.S.
      commercial site, performing four successful cases on May 18, 2023—all patients discharged
      same-day—under Dr. Kyle Hogarth. Dr. Hogarth's published conflict-of-interest disclosure
      notes he has been a paid Noah Medical consultant since 2018 and holds an equity interest,
      which is material context when weighting his endorsement as independent physician evidence.
      Ingalls Memorial Hospital in Tinley Park, an affiliate within the UChicago Medicine
      network, launched Galaxy bronchoscopy in April 2026, illustrating intra-network diffusion.

      CHI Memorial in Chattanooga performed the 500th U.S. Galaxy procedure in January 2024,
      was the first Tennessee hospital to adopt the system, and served as a MATCH 2 study
      site under Dr. Krish Bhadra. Dr. Bhadra was subsequently appointed Noah Medical's Chief
      Pulmonary Advisor in June 2026, deepening the company–KOL relationship. Long Island
      Jewish Medical Center (Northwell Health), under Dr. Abhinav Agrawal, performed the
      milestone 5,000th U.S. procedure in March 2025. Inova Fairfax Medical Center in Virginia,
      under Dr. Amit Mahajan, co-led the MATCH 2 study and generated independent field data
      across 165 procedures showing 92–96% diagnostic yield. Prince of Wales Hospital in
      Hong Kong, under Drs. Calvin Ng and Rainbow Lau, conducted the first Asian use in
      December 2023 and initiated the first Galaxy clinical trial in Asia. Macquarie
      University Hospital in Sydney, Australia, hosted the FRONTIER first-in-human trial
      beginning March 2023 under Dr. Tajalli Saghaie. At AABIP 2024, additional named
      Galaxy users were identified: Dr. Joseph Cicenia (Cleveland Clinic), Dr. Matthew
      Federbush (Northwell Health), and Dr. Sean Callahan (Prisma Health).
    claimRefs:
      [CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU011, CU012, CU013,
       CU015, CU016, CU032, CU033, CU034, CU041, CU042, CU047]
    tableRefs: [TU003]

  - id: adoption-trajectory
    title: Adoption Trajectory and Procedural Milestone Evidence
    body: >-
      Noah Medical's procedure-count milestones provide the clearest public proxy for
      adoption velocity. The company reached its first commercial U.S. use in May 2023,
      the 500th U.S. procedure in January 2024 (approximately eight months post-launch),
      and the 5,000th U.S. procedure in March 2025—a 22-month ramp from first case to
      five-thousand. The interval from the 500th to the 5,000th procedure spans approximately
      14 months, implying an average of roughly 320–370 procedures per month during the
      commercial scale-up phase. A run-date (June 2026) cumulative procedure count has not
      been disclosed.

      Geographic expansion tracks parallel to procedure volume growth. The first-in-human
      use in Australia (March 2023) preceded U.S. commercialization and established the
      Macquarie University Hospital as an early clinical evidence generator. The first Asian
      commercial use at Prince of Wales Hospital (December 2023) initiated a prospective
      clinical trial in Hong Kong, extending the evidence base internationally. Intra-network
      diffusion is evidenced by the April 2026 launch at Ingalls Memorial (UChicago Medicine
      network), and the presence of named users across at least six U.S. states
      (California, Tennessee, New York, Virginia, West Virginia, North Carolina/South Carolina
      region via Prisma Health) and two international geographies (Australia, Hong Kong)
      confirms multi-geography deployment.

      The procedural growth trajectory is consistent with multi-site adoption but the total
      installed-base site count remains undisclosed, making it impossible to independently
      calculate per-site average utilization or distinguish fast-scaling sites from
      lower-volume deployments. The company's communications shift from procedure milestones
      to "rapid adoption" language without providing an account count, a common disclosure
      pattern for pre-IPO medical-device companies managing competitive intelligence.
    claimRefs:
      [CU001, CU004, CU005, CU007, CU014, CU017, CU018, CU026, CU040, CU044]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: procurement-training-path
    title: Hospital Procurement Path and Training Adoption Model
    body: >-
      Hospital procurement of the Galaxy System capital unit follows the standard hospital
      capital expenditure process: a physician champion (typically the interventional
      pulmonologist leading the lung nodule program) develops a service-line business case
      covering capital cost, expected per-procedure contribution margin, reimbursement
      economics, and competitive differentiation against first-generation platforms. This
      business case goes to the hospital capital committee, which may be annual or require
      a threshold-crossing approval. Contract negotiation, facility preparation for the
      system's C-arm-compatible bronchoscopy suite, and training then precede first use.

      Noah Medical's FRONTIER study demonstrated that "the system can be rapidly and
      successfully deployed after recommended training, even in areas with minimal robotic
      experience," suggesting a shallow learning curve by design. The AABIP 2024 program
      featured multiple Galaxy simulation sessions under the theme "Tips and Tricks for
      Optimizing Yield in Peripheral Bronchoscopy," and Noah Medical hosted interactive
      simulation and after-hours events to build physician competency at conferences.
      The company also offers a reimbursement-support resource (reimbursement@noahmed.com)
      to help hospital billing teams navigate CPT coding.

      Despite Noah Medical's positioning of rapid adoptability, the broader robotic
      bronchoscopy literature documents that implementation requires multi-disciplinary
      coordination across pulmonology, radiology, anesthesiology, and hospital administration,
      and that general anesthesia access is a structural requirement—one that constrains
      deployment in settings with limited anesthesia availability. These barriers are
      documented by third-party clinical commentators, not company sources, and are
      relevant to modeling expansion beyond well-resourced facilities.
    claimRefs:
      [CU005, CU019, CU024, CU028, CU029, CU037, CU038, CU048]
    tableRefs: [TU004]

  - id: reimbursement-and-economics
    title: Reimbursement Framework and Customer-Site Economics
    body: >-
      The reimbursement environment for Galaxy System procedures has materially improved
      since the 2023 commercial launch. As of January 1, 2024, CMS awarded Transitional
      Pass-Through (TPT) status under HCPCS code C1601 to qualifying single-use pulmonary
      bronchoscopes used in select procedures. A third-party legal analysis conducted for
      Noah Medical concluded that the Galaxy single-use bronchoscope appears to meet the
      criteria for TPT payment, which provides an incremental hospital-outpatient payment
      above standard Medicare APC rates. This TPT designation is set to last three years
      from January 2024, giving customers enhanced reimbursement through at least December
      2026. The primary procedure codes are CPT 31628 and 31629 (transbronchial biopsy),
      which are cited by Noah Medical as billable with C1601.

      The "Beyond the Scope" community hospital study presented at CHEST 2025 quantified
      the economics: procedures in the endoscopy suite produced a cost-benefit ratio of 1.5,
      and in the OR a ratio of 1.1—both above the financially-viable threshold of 1.0
      used by the investigator. The MedCity News opinion article by the Beyond the Scope
      principal investigator (Dr. Mathew, March 2026) elaborated that moving cases from
      the OR to the endoscopy suite, combined with complexity-adjusted APC billing
      (CPT 31628 + 31629 + 31653), can "lift cost-benefit analysis, shorten the payback
      period, and boost contribution margins per case." Dr. Mahajan (Inova Fairfax)
      additionally stated the Galaxy System is "financially sustainable" by minimizing
      direct costs through its single-use bronchoscope design.

      Capital payback timelines depend on procedure volume and the hospital's payer mix.
      For sites with tight margins—particularly smaller community hospitals—the economics
      are viable in endoscopy-suite settings but require disciplined volume ramp and
      billing discipline. The TPT payment mechanism provides an adoption subsidy that
      expires post-2026, creating a potential headwind for new site economics after the
      incentive ends.
    claimRefs:
      [CU020, CU021, CU022, CU035, CU038, CU039]
    tableRefs: [TU006]

  - id: retention-expansion-signals
    title: Retention Signals, KOL Relationships, and Expansion Patterns
    body: >-
      Noah Medical has not published formal customer retention metrics—no NRR, GRR, churn
      rate, contract renewal data, or cohort utilization statistics are publicly available.
      Durability must be inferred from indirect signals. The most compelling retention
      proxy is that named early adopter sites (University of Chicago, CHI Memorial, Inova
      Fairfax) have appeared repeatedly across multiple study cohorts, conference
      presentations, and named-user contexts spanning 2023 through 2026, suggesting continued
      active use. Ingalls Memorial's April 2026 adoption within the UChicago Medicine
      network, more than three years after UChicago's first use, implies that the anchor
      site remained active long enough to influence network diffusion—a meaningful durability
      signal, even if anecdotal.

      The KOL engagement model functions as a hybrid between clinical research partnership
      and customer success. Dr. Bhadra (CHI Memorial) has served as a MATCH 2 investigator,
      a CommonSpirit Health Lung Council co-chair, and—since June 2026—Noah Medical's
      Chief Pulmonary Advisor. Dr. Mahajan (Inova Fairfax) has contributed to both the
      April 2024 field-data whitepaper and the MATCH 2 study, with multiple public
      endorsements of the system's financial and clinical value. These relationships create
      institutional stickiness: physician champions with equity or advisory ties are
      unlikely to switch platforms mid-tenure, and their research publications generate
      independent evidence that fuels inbound interest from other hospitals.

      Expansion signals are visible in two patterns: geographic diffusion from anchor AMCs
      to network affiliates (UChicago → Ingalls Memorial), and conference-driven adoption
      where AABIP and CHEST presentations by named users bring the Galaxy System to the
      attention of the broader interventional pulmonology community. Noah Medical's presence
      at AABIP 2024 with simulation sessions, a symposium, and after-hours events
      explicitly targets physician decision-makers who would become future institutional
      champions.
    claimRefs:
      [CU002, CU011, CU013, CU023, CU031, CU032, CU033, CU034, CU036, CU048]
    figureRefs: [FU003]

  - id: concentration-gaps-barriers
    title: Concentration Risk, Undisclosed Installed Base, and Adoption Barriers
    body: >-
      The most material customer-chapter gap is that Noah Medical has not disclosed the
      total number of hospital sites, active installed base, or customer count as of June
      2026. Public evidence names at minimum seven distinct clinical sites generating
      Galaxy procedures, but this is almost certainly an undercount of the true deployment
      footprint—the 5,000+ U.S. procedures by March 2025 imply a multi-site deployment
      well beyond the seven publicly confirmed names. However, without a stated site count,
      customer concentration cannot be independently assessed. If a significant fraction of
      the 5,000+ cumulative procedures came from a small number of high-volume KOL sites
      (UChicago, Inova Fairfax, CHI Memorial), the installed base may be shallower than
      the procedure milestone implies.

      Adoption barriers documented in independent clinical literature include: (1) high
      upfront capital costs, identified as a "significant financial burden" for institutions
      in a published Thorax BMJ clinical commentary; (2) the requirement for general
      anesthesia access, which limits deployment in nationalized healthcare systems and
      resource-constrained settings; and (3) the need for multi-disciplinary staff
      coordination across pulmonology, anesthesiology, and radiology. These are industry-
      wide constraints, not Galaxy-specific, but they shape the realistic addressable
      hospital universe. The post-2026 expiry of TPT C1601 payments will remove an
      incremental economic subsidy, potentially slowing new-site economics.

      The most prominent adverse data point on customer evidence quality is the conflict-
      of-interest structure at early adopter sites: Dr. Hogarth (University of Chicago)
      disclosed a paid consulting relationship and equity interest; Dr. Bhadra (CHI Memorial)
      transitioned to company advisor in June 2026; Dr. Mahajan (Inova Fairfax) contributed
      to physician-adjudicated (not peer-reviewed) whitepapers and served as MATCH 2 PI.
      The clinical data from these sites is real, but the independence signal is weaker
      than arms-length third-party evaluation. The Frontiers Oncology review article on
      the evolution of robotic bronchoscopy (March 2025) did not reference Galaxy at all,
      centering its analysis on Intuitive Surgical's ION—a signal that Galaxy's academic
      literature footprint is still modest relative to the ION platform.
    claimRefs:
      [CU003, CU018, CU023, CU028, CU029, CU030, CU031, CU036, CU043, CU044, CU046]
    tableRefs: [TU005]

