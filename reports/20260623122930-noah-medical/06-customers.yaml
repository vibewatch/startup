callouts:
  - calloutType: risk
    title: Undisclosed Installed Base Limits Concentration Assessment
    body: >-
      Noah Medical has not disclosed total customer site count, per-site utilization, or
      revenue concentration as of June 2026. The 5,000+ procedure milestone is meaningful
      for adoption velocity, but it does not reveal how many hospital sites generated those
      cases or whether a handful of KOL sites (UChicago, Inova Fairfax, CHI Memorial)
      account for a disproportionate share. Diligence must request account-level data.
    claimRefs: [CU018, CU031, CU044]

  - calloutType: insight
    title: KOL-to-Advisor Pipeline Is a Structural Adoption Moat
    body: >-
      Noah Medical's model of converting active physician users into clinical study
      investigators, named KOLs, and ultimately company advisors (as with Dr. Bhadra in
      June 2026) creates institutional stickiness at adopter sites and a credible peer-
      to-peer evidence cascade that drives inbound interest from the broader IP community.
      This is a strategic customer success mechanism, though it also concentrates the
      independence signal at conflicted sites.
    claimRefs: [CU032, CU033, CU042, CU048]

  - calloutType: strength
    title: Community Hospital Viability Unlocks a Much Larger Addressable Customer Base
    body: >-
      The "Beyond the Scope" study (CHEST 2025) and the Ingalls Memorial April 2026 launch
      demonstrate that Galaxy is viable in community and network-affiliate settings, not
      only research AMCs. With approximately 5,000 U.S. hospitals holding or capable of
      supporting IP programs, the community segment represents a far larger potential
      installed base than the current named evidence implies.
    claimRefs: [CU009, CU013, CU034, CU035, CU039]

