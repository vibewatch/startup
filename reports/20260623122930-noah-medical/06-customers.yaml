  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: undisclosed-installed-base
      missingEvidence: >-
        Total number of hospital sites with an active Galaxy System installation, geographic
        distribution of the installed base, and any top-site concentration metrics
        (e.g., fraction of total procedures at the top 5 sites).
      whyItMatters: >-
        Without a site count or concentration data, it is impossible to assess whether the
        5,000-procedure milestone reflects broad multi-site adoption or heavy concentration
        at a handful of KOL sites, which directly affects durability and expansion modeling.
      diligencePath: >-
        Request directly from Noah Medical management: total active Galaxy sites as of
        run date, installed base by hospital segment (AMC, community, international), and
        per-site average procedure volume.
      relatedQuestionRefs: [QU009, QU023, QU029]

    - type: private-evidence-only
      severity: material
      topic: retention-gaps
      missingEvidence: >-
        Formal customer retention metrics: NRR, GRR, churn rate, contract renewal/non-renewal
        data, and per-site utilization depth over time (procedures per site per quarter).
      whyItMatters: >-
        Galaxy's recurring revenue model depends on ongoing single-use bronchoscope
        consumption. Without retention metrics, it is impossible to evaluate whether the
        procedure volume reflects growing active use or declining or churned sites with new
        replacements.
      diligencePath: >-
        Request from management: multi-quarter utilization per cohort of installed sites,
        any site that has ceased Galaxy use, and the length and structure of service contracts.
      relatedQuestionRefs: [QU023]
      relatedTableRefs: [TU004]

    - type: missing-source
