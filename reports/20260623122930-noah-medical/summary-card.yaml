summary:
  headline: >-
    Noah Medical has built a credible robotic bronchoscopy platform with leading clinical evidence and real commercial
    traction, but the absence of any financial disclosure, two open FDA recalls, and an unconfirmed $2.0B valuation
    demand data-room validation before underwriting.
