  topStrengths:
    - >-
      Galaxy System leads on published diagnostic yield: MATCH 2 reports 96.7% strict yield exceeding published Ion
      benchmarks (up to 87.8%) and Monarch benchmarks (~70%), with 100% navigation success — backed by peer-reviewed
      data rather than company claims alone.
    - >-
      Proprietary TiLT+ Technology (integrated tomosynthesis + augmented fluoroscopy) provides real-time embedded
      imaging without requiring CBCT infrastructure, removing a major hospital access barrier and creating a defensible
      hardware differentiation vs. Ion and Monarch.
    - >-
      Tier-1 investor syndicate — SoftBank Vision Fund, Prosperity7, Tiger Global, Hillhouse, Sequoia China — and a
      reported $2.0B post-money mark signal strong institutional conviction in the platform, with CEO Jian Zhang's Auris
      Health and Intuitive Surgical pedigree underwriting management credibility.
    - >-
      Commercial ramp from first U.S. case (May 2023) to 5,000 U.S. procedures (March 2025) in 22 months, reaching
      10,000+ global procedures by April 2026 across 50+ installed systems, demonstrates real multi-site clinical
      adoption in both academic and community hospital settings.
    - >-
      Single-use bronchoscope eliminates reprocessing costs, creates a compounding recurring revenue stream as the
      installed base grows, and cost-benefit studies (ratio 1.5 in endoscopy suite) support hospital economic
      justification.
  topRisks:
    - >-
      Zero financial disclosure: no revenue, ARR, gross margin, burn rate, cash balance, or unit economics have been
      made public; traditional valuation and underwriting are impossible without direct data-room access, making this a
      research-required rather than actionable investment.
    - >-
      Four FDA Class 2 device recalls issued March 2024–November 2025, including two Open recalls as of June 2026 (power
      supply design defect affecting 26 units; bronchoscope biopsy channel incompatibility), creating ongoing regulatory
      and patient-safety overhang.
    - >-
      Competitive pressure intensifying: Intuitive Surgical Ion reached 1,041 installed systems (39% procedure growth,
      Q1 2026) and J&J Monarch QUEST received AI-enhanced clearance (March 2025), with both incumbents outpacing
      Galaxy's 50+ installed base by an order of magnitude in scale and distribution.
    - >-
      CMS Transitional Pass-Through (TPT) supplemental payments for robotic bronchoscopy disposables (HCPCS C1601)
      expire end of calendar year 2026; no incremental CPT code exists for robotic bronchoscopy, creating near-term
      hospital budget risk as the reimbursement incentive reduces.
    - >-
      The reported $2.0B valuation and $230M later round are unconfirmed by Noah Medical; conflicting Latka estimate
      ($417.9M) illustrates data fragility, and preference-stack overhang from SoftBank-style participating-preferred
      structures could create significant common-equity dilution in downside scenarios.
  unresolvedGaps:
    - >-
      Confirmed revenue or ARR, gross margin by segment (capital vs. disposable), burn rate, cash runway, installed-base
      utilization rate, and customer count — none disclosed publicly.
    - >-
      Confirmation of the reported September 2025 $230M Later Stage VC round, total funding, and post-money valuation
      direct from Noah Medical or a primary source.
    - >-
      Cap-table structure, liquidation preference stack, anti-dilution provisions, investor pro-rata rights, board
      composition, option pool size, and any existing debt or venture debt.
    - >-
      Post-2026 reimbursement strategy when CMS TPT (C1601) expires, and commercial payer coverage posture across major
      insurers for robotic bronchoscopy disposables.
    - >-
      Resolution timeline and scope of the two open FDA recalls (Z-0693-2025 and Z-0679-2025) and the broader
      quality-system implications of four recalls within a 20-month window.
