callouts:
  - calloutType: risk
    title: "Reimbursement Ceiling Constrains All RAB Platforms Equally—and Disproportionately Harms Entrants"
    body: >
      No robotic bronchoscopy platform receives a CPT-code premium over conventional navigational bronchoscopy (CPT 31627, ~$85 facility rate). Financial sustainability requires capturing downstream oncology revenue and achieving minimum procedural volumes (~120/year), thresholds attainable mainly at high-volume academic and large community centers. The absence of a reimbursement moat means Noah Medical, Ion, and Monarch compete on total cost of ownership and downstream revenue capture—not on billable procedure differentiation. For Noah Medical, the risk is that the economics that constrain hospital adoption are equally adverse for Galaxy as for its larger-scale competitors, while those competitors can absorb capital losses more readily from their broader product portfolios.
    claimRefs: [CP036, CP037, CP038, CP039]

  - calloutType: insight
    title: "Galaxy's Embedded Imaging Strategy Opens Community-Hospital Tier Where Ion and Monarch Are Infrastructure-Constrained"
    body: >
      Galaxy's TiLT+ technology achieves 96.7% CBCT-concordant tool-in-lesion confirmation using fluoroscopy equipment already present in most bronchoscopy suites, while Ion requires external CBCT (or radial EBUS plus fluoroscopy) and Monarch QUEST requires the GE OEC 3D C-arm for equivalent 3D confirmation. This means Galaxy can offer high-confidence peripheral nodule biopsy in the approximately 80% of US hospitals that do not have dedicated procedural CBCT, a structural TAM expansion that Ion and Monarch cannot access with their current configurations. Noah Medical's "Beyond the Scope" community hospital data (89% DY, cost-benefit ratio >1) is the initial evidence point for this thesis.
    claimRefs: [CP028, CP031, CP032]

