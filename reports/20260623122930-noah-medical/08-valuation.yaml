- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Revenue and revenue growth
    - FY2024 and FY2025 confirmed revenue, by stream (capital equipment, disposables, service); YoY growth rate
    - Required to apply any revenue multiple; $2.0B valuation implies ~$154M revenue at ISRG multiples — confirmation or denial
      changes the base case range materially
    - CEO / CFO; data room; audited financial statements or investor reporting package
  - - Cap table and preference stack
    - 'Complete cap table: series, share counts, liquidation preferences, anti-dilution provisions, participating vs non-participating
      preferred terms, option pool'
    - Determines economic ownership and downside scenario payout; preference overhang could make common equity (or later-round
      preferred) worth far less than the headline $2.0B mark in scenarios below $1B exit
    - Data room; company cap table management (Carta or equivalent); Series B / 2025 round term sheets
  - - $230M September 2025 round confirmation
    - Official company press release, SEC Form D, or investor communication confirming the reported $230M Later Stage VC round
      and its terms
    - The entire $2.0B valuation anchor rests on an unconfirmed third-party data point; without confirmation the headline
      is not investable
    - Noah Medical investor relations; SEC EDGAR Form D search; direct management inquiry
  - - Gross margin and burn rate
    - Blended gross margin (capital equipment and disposables combined); monthly burn rate; cash balance and runway
    - Determines whether Galaxy's unit economics support scaling and whether the company can reach breakeven without a distressed
      down round; required for DCF framing
    - Data room; audited financials; CFO diligence session
  - - Reimbursement strategy post-TPT
    - Company's formal plan for hospital reimbursement after HCPCS C1601 TPT expires end 2026; CMS filing plans, DRG strategy,
      payer contracting
    - TPT expiration is the single highest-probability near-term catalyst for purchase deferrals; without a clear successor
      strategy the revenue ramp is at risk
    - Management diligence; reimbursement counsel review; CMS regulatory correspondence
  - - Recall resolution status and quality system
    - Current status of open recalls Z-0693-2025 (power supply) and Z-0598-2026 (IFU); QMS audit findings; CAPA closure evidence
    - Two open recalls as of June 2026 represent ongoing regulatory exposure; premium valuation requires confirmation that
      recall pattern is resolved and QMS is fit for scale
    - FDA CDRH recall database (accessdata.fda.gov); Noah Medical quality diligence package; independent QMS audit
