- id: TV002
  title: Investment Thesis and Anti-Thesis
  columns:
  - Dimension
  - Pro-Thesis Argument
  - Anti-Thesis / What Would Change the View
  rows:
  - - Market size
    - Robotic bronchoscopy grows to $234M by 2031; broader surgical robotics $16.4B by 2032; lung cancer screening LDCT driving
      structural demand
    - Market growth fails to materialise; payer restriction or hospital budget pressure limits robotic adoption post-TPT expiry
  - - Technology differentiation
    - TiLT+ integrated tomosynthesis achieves 96.7% yield without CBCT; Galaxy is the only platform not requiring adjunctive
      imaging at community hospitals
    - J&J Monarch QUEST (FDA cleared March 2025) or improved Ion navigation closes the imaging gap; differentiation narrative
      weakens
  - - Commercial traction
    - 10,000+ procedures, 50+ installed systems as of April 2026; rapid procedural ramp from FDA clearance in March 2023
    - Installed base remains sub-scale; procedure volumes concentrated in a small number of high-volume academic sites; community-hospital
      penetration unconfirmed
  - - Financial profile
    - Capital-equipment-plus-disposables razor-and-blades model generates recurring revenue as installed base grows; peer
      ISRG trades at 13x EV/Revenue
    - No revenue confirmed; Latka estimate of $139.3M ARR is low-confidence; burn rate, margins, and runway entirely undisclosed
  - - Exit and returns
    - Strong strategic buyer set (J&J, Intuitive, Stryker, Medtronic, Olympus) with direct portfolio logic; medtech M&A at
      decade-high in 2025 ($80B)
    - No confirmed or rumoured acquisition; preference stack, anti-dilution terms, and liquidation waterfall unknown; IPO
      bar unmet at current disclosure level
  - - Adverse signals
    - Four Class 2 recalls in 26 months; two open recalls as of June 2026; no dedicated CPT code; TPT reimbursement expires
      end of 2026
    - Further recalls or MAUDE adverse events, reimbursement deterioration, or a down round would materially impair the thesis
