- id: scenarios-recommendation
  title: Bull/Base/Bear Scenarios and Investment Recommendation
  body: 'The bull case assumes Noah Medical achieves category leadership in robotic bronchoscopy — reaching 200+ installed
    systems and $300–500M in revenue by 2028–2030 — maintains premium margins (60–70% gross margin consistent with capital-plus-consumables
    robotic medtech), and exits via strategic M&A at 8–12x revenue or via IPO at ISRG-comparable multiples. Under this scenario,
    enterprise value of $3B–$6B is plausible, representing 1.5x–3x the reported 2025 mark. The base case assumes Galaxy builds
    to 80–100 systems, generates revenue of $100–$200M, achieves reimbursement stability post-TPT, and is acquired by a strategic
    buyer or completes a Series C round sustaining the $2.0B mark; dilution-adjusted returns would depend heavily on preference
    structure. The bear case is anchored to three concurrent risks: TPT reimbursement expiration in late 2026 suppresses hospital
    purchasing, competitive displacement by J&J Monarch QUEST or ISRG Ion accelerates, and the company''s recall history creates
    regulatory burden. Under bear-case assumptions, a flat or down round at $0.5B–$1.0B, or a distressed strategic sale below
    the last reported mark, is plausible. The base recommendation is: research more before underwriting. The $2.0B valuation
    is conditionally supported — within the range of comparables for a well-backed late-stage medtech robotics company at
    this stage of commercialisation — but cannot be independently verified or discounted without confirmed revenue, margin,
    burn, preference stack, and cap table. The highest-priority triggers that would change this stance positively are: (1)
    official confirmation of the September 2025 round with round terms; (2) confirmed revenue ≥$150M at ≥65% gross margin;
    (3) TPT extension or dedicated CPT code passage. Negative triggers: reimbursement deterioration, a down round or flat
    round below $2.0B, additional FDA recalls, or clinical data replication failures.

    '
