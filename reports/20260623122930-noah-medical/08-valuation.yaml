- id: FV004
  title: Investment KPIs — IC-Ready Scoring Across Seven Dimensions
  type: kpi
  layout: standard
  summary: 'Seven-dimension scoring (1–5 scale) representing public-evidence quality and investment signal strength for Noah
    Medical as of June 2026. Scores reflect the analyst''s evidence-based assessment, not a mechanical model. High scores
    on market and technology proof contrast with low scores on financial disclosure and valuation basis, reflecting the central
    thesis challenge.

    '
  approximationNotes: 'Scores are 1–5 (1 = very weak, 5 = very strong) based on publicly available evidence through June 23,
    2026. No proprietary data-room access. Scores should be revisited following receipt of audited financials, cap-table terms,
    and confirmed round documentation.

    '
