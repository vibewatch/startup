- id: TV004
  title: Comparable Valuation Table
  enumerationScope:
    coverage: partial
    basis: 'Rows enumerate publicly available valuation data points for Noah Medical and the closest comparable public and
      private companies in robotic bronchoscopy, robotic surgery, and late-stage medtech VC as of June 2026. Public multiples
      are drawn from exchange-level data (stockanalysis.com, companiesmarketcap.com, marketscreener.com). Private valuations
      are sourced from disclosed funding rounds (press releases, PitchBook, Tracxn). Noah Medical private mark is sourced
      from Premier Alternatives / PitchBook and is unconfirmed by the company. Rows are ordered from most to least directly
      comparable.

      '
  columns:
  - Comparable
  - Metric / Stage
  - Multiple or Valuation
  - Relevance to Noah Medical
  - Key Limitation
  rows:
  - - Intuitive Surgical (ISRG) — Ion bronchoscopy + da Vinci
    - Public; FY2025 revenue $10.07B; 1,041 Ion systems Q1 2026; EV $137B
    - EV/Revenue ~13x; PS 13.4x (Jun 2026); market cap $142B
    - Direct Ion competitor; closest public comp for robotic bronchoscopy premium multiple
    - Scale incomparable ($10B revenue vs no disclosed revenue); profitability (~$2.5B net income) not applicable to Noah
      Medical stage; ISRG multiple not transferable to a single-product VC-backed pre-profitability startup
  - - Medtronic (MDT) — Hugo RAS + diversified MedTech
    - Public; Hugo FDA-cleared Dec 2025 urologic; FY2026 Q3 revenue $9.0B
    - Forward P/S ~3.3x; large-cap diversified discount
    - Lower bound for public medtech robotics multiple; illustrates discount for non-dominant, diversified platforms
    - Large-cap diversification discount; Hugo not yet commercially significant; Medtronic multiple reflects legacy businesses
      not robotic growth
  - - CMR Surgical (Versius system) — private
    - Private; $2.7B valuation (2021 Series D); $200M+ raised in 2025; $1B+ total raised; 200+ systems global
    - $2.7B private mark (2021); 2025 round undisclosed valuation — likely sustained or modestly lower
    - Most comparable private surgical robotics peer by funding scale and stage
    - 2021 mark may be stale; no US commercial scale until 2024 FDA clearance; different indication (soft-tissue surgery vs
      bronchoscopy)
  - - Distalmotion (Dexter) — private
    - Private; $150M Series G Nov 2025; $390M total raised; 3,000+ patients; targeting ASCs
    - $390M total raised; valuation undisclosed but Series G likely in $500M–$1B range
    - Late-stage private robotic surgery comp; J&J strategic investor; demonstrating continued VC appetite
    - Smaller scale and earlier US footprint; different indication and hospital setting (ASC vs hospital); valuation undisclosed
  - - Noah Medical (Galaxy System) — primary subject
    - Private; Series B Apr 2023 ($150M confirmed); Later Stage VC Sep 2025 ($230M unconfirmed); 10K+ procedures; 50+ systems
    - $2.0B post-money (Premier Alternatives / PitchBook, Sep 2025) — unconfirmed; $417.9M conflicting (Latka, low confidence)
    - Subject company — mark provided for reference
    - Not officially confirmed; conflicting third-party estimates; no disclosed revenue; cannot be independently verified
  - - Shenzhen Edge Medical — private (robotics IPO)
    - $154M HKEX IPO January 2026; surgical robotics; China-based
    - $154M IPO raise; valuation at IPO undisclosed in available sources
    - Illustrates ongoing capital availability for surgical robotics globally
    - Different geography (China/HK); different indication; HKEX not directly comparable to US market
  notes: 'All public multiples are trailing twelve-month (TTM) as of June 23, 2026 and are sourced from stockanalysis.com
    (ISRG statistics page), companiesmarketcap.com, and marketscreener.com. Private company valuations are sourced from PitchBook
