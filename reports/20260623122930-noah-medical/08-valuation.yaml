chapter:
  number: 8
  title: Valuation
  summary: 'Noah Medical''s most credible post-money valuation anchor is $2.0B as of September 24, 2025, sourced from Premier
    Alternatives (citing PitchBook data) following a reported $230M Later Stage VC round—neither round nor valuation has been
    officially confirmed by the company. Total disclosed capital is approximately $516.8M, producing a capital efficiency
    ratio of 3.87x. A conflicting third-party estimate from Latka reports $417.9M valuation and $139.3M ARR; both the conflicting
    figures and the methodological basis are low-confidence. No revenue, gross margin, burn rate, or preference-stack data
    has been disclosed publicly, making traditional DCF or revenue-multiple valuation impossible without data-room access.
    The closest public comp—Intuitive Surgical—trades at approximately 13.4x PS / 13x EV/Revenue (June 2026) on $10B+ revenue
    and $142B market cap, establishing a ceiling benchmark that Noah Medical at this stage could only approach with confirmed
    revenues in the $150M+ range at premium surgical-robotics multiples. Private comps (CMR Surgical at $2.7B in 2021, Distalmotion
    at $390M raised) provide directional context but are imprecise due to stage and business-model differences. Strategic
    value is real: 10,000+ clinical procedures, 50+ installed systems, 96.7% diagnostic yield, no CBCT requirement, and Tier-1
    capability framing position Noah Medical as a credible M&A candidate for J&J, Stryker, Medtronic, or Intuitive—though
    no deal is rumored or confirmed as of June 2026. Key adverse signals are: TPT reimbursement expiration at end of 2026,
    four Class 2 recalls (2024–2025), two open recalls as of June 2026, absence of a dedicated robotic bronchoscopy CPT code,
    and late-stage medtech valuation compression (two-thirds of Series C+ rounds flat or down in 2024). The recommendation
    stance is conditionally supported: the $2.0B mark appears achievable under a base case but requires data-room confirmation
    of revenue, cap-table structure, and preference overhang before underwriting.

    '
sections:
- id: disclosed-valuation-evidence
  title: Disclosed Valuation and Funding Evidence
  body: 'The most firmly documented financing event for Noah Medical is its $150 million Series B, announced April 19, 2023,
    led by SoftBank Vision Fund and Prosperity7 Ventures (Aramco affiliate), with a broad syndicate including Tiger Global,
    Hillhouse, Sequoia China, Shangbay Capital, Uphonest Capital, Sunmed Capital, Lyfe Capital, 1955 Capital, and AME Cloud
    Ventures. This round was announced via company press release and corroborated by multiple independent deal-coverage outlets.
    It remains the only officially confirmed financing event. Tracxn''s public profile of Noah Medical (last updated June
    6, 2026) classifies the company as a "soonicorn" and shows a January 2021 early-stage VC round as the visible pre-B financing;
    total funding history is partially gated. Premier Alternatives, citing PitchBook data, reports a $230 million Later Stage
    VC round in September 2025 that would bring total capital raised to approximately $516.8M and post-money valuation to
    $2.0B as of September 24, 2025 — a capital efficiency ratio of 3.87x. Noah Medical has made no official press release
    or statement confirming this round, and the absence of official confirmation means the $2.0B figure must be treated as
    reported but unverified. A third source, Latka, reports a deeply conflicting $417.9M valuation with $139.3M ARR; Latka''s
    methodology for private companies is opaque and reliability is low. These three data points—$150M confirmed Series B,
    $2.0B unconfirmed (Premier/PitchBook), and $417.9M conflicting (Latka)—constitute the full universe of publicly available
    valuation evidence as of June 2026.

    '
