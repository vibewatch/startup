- id: funding-based-heuristics
  title: Funding-Based Valuation Heuristics
  body: 'In the absence of confirmed revenue, analysts commonly apply funding-based heuristics to frame private company valuations.
    For Noah Medical, the 3.87x capital efficiency ratio (reported $2.0B valuation / $516.8M raised) is a useful starting
    point, though it conflates post-money accounting with economic value. Private medical robotics companies at the Later
    Stage VC level typically exhibit capital efficiency ratios between 2x and 6x depending on technology maturity, installed
    base, and investor confidence — Noah Medical''s 3.87x sits comfortably within this range. However, capital efficiency
    ratios measure neither profitability nor growth rate; they describe only the relationship between funding and the valuation
    set at the last round. Tracxn''s funding data identifies an early-stage VC round in January 2021 (reported by third parties
    as approximately $137M), prior to the April 2023 Series B. If the reported September 2025 $230M round is genuine, the
    step-up in valuation between the April 2023 Series B and the 2025 round implies meaningful upward re-pricing consistent
    with demonstrated commercial progress (5,000 procedures by March 2025, Galaxy 2.0 launch, CHEST 2025 data). The capital
    efficiency ratio does not imply intrinsic fair value; it is better understood as a market-clearing price set by institutional
    investors with information advantages over public observers. Revenue multiples cannot be calculated without confirmed
    revenue figures; the analyst therefore declines to apply revenue multiples and instead relies on comparable-set benchmarking
    and scenario analysis.

    '
