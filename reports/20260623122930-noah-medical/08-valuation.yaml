- id: private-comp-exit-benchmarks
  title: Private Comparable Context and Exit Benchmarks
  body: 'Among private surgical robotics peers, CMR Surgical is the most directly comparable by stage and capital profile:
    it raised $200M+ in a round led by Trinity Capital in 2025 (after a $2.7B valuation in its 2021 Series D), has deployed
    200+ Versius systems globally, achieved FDA De Novo authorization for cholecystectomy in October 2024, and has raised
    over $1B in total — positioning it as the best-funded private soft-tissue surgical robotics peer. CMR''s $2.7B 2021 mark
    and subsequent undisclosed 2025 raise illustrate the private mark persistence phenomenon: once a premium valuation is
    established in a credible round, it tends to persist absent a formal re-pricing event. Distalmotion ($390M total raised,
    $150M Series G in November 2025) represents a more nascent robotic surgery peer targeting ambulatory surgery centers.
    At the M&A level, medtech deal value reached $80B in 2025 per Bain''s 2026 Global M&A Report — up from $68B in 2024 and
    $39B in 2023 — with the second half of 2025 particularly strong. Stryker''s $4.9B acquisition of Inari Medical illustrates
    the premium paid for category-specific commercial leaders. The Bain 2026 report specifically notes that "softer valuations
    will heighten competition for high-quality assets" in 2026, meaning qualified assets like Noah Medical (if revenue and
    margin profile is confirmed) could attract premium strategic interest in the current environment. Shenzhen Edge Medical
    raised $154M in a January 2026 HKEX IPO for surgical robotics, indicating ongoing international capital availability for
    commercialised platforms. The surgical robotics IPO window is cautiously open in 2026 per healthcare.digital analysis,
    with CMR Surgical actively exploring a potential NASDAQ dual-listing.

    '
