- id: preference-stack-dilution-caveats
  title: Preference Stack, Dilution, and Disclosure Caveats
  body: 'Noah Medical has not publicly disclosed its capitalisation table, liquidation preference structure, anti-dilution
    provisions, investor pro-rata rights, board composition, option pool size, or any debt obligations. These omissions are
    standard for a private company with no public reporting obligation, but they are material blind spots for any investor
    attempting to underwrite fair value or downside scenarios. SoftBank Vision Fund rounds historically include participating
    preferred structures with 1x–2x liquidation preferences; if such terms apply to the Series B, common equity (and later-round
    preferred) holders face meaningful preference overhang in downside scenarios. The late-stage medtech financing environment
    in 2024–2025 was challenging: approximately two-thirds of Series C and later rounds priced flat or down per industry data,
    with investor protections (ratchets, anti-dilution clauses, PIK dividends) becoming more common. Noah Medical appears
    to have avoided a documented down round between April 2023 and September 2025, but the absence of official confirmation
    of the $230M round means even this positive signal is unverifiable. The IPO bar for medtech robotics companies in 2026
    requires $40–60M run-rate revenue and 60–80% gross margins per healthcare.digital analysis; Noah Medical has disclosed
    neither figure. Without data-room access, the analyst cannot model a credible enterprise-value waterfall, dilution scenario,
    or return distribution. All valuation figures in this chapter should therefore be understood as indicative marks rather
    than underwritten fair values. Material gap: the cap table, preference stack, and any debt instruments are the single
    highest-priority diligence items before any investment decision.

    '
