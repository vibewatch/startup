- id: TV005
  title: Thesis-Break and Kill-Criteria Triggers
  columns:
  - Trigger
  - Threshold / Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - TPT reimbursement expires without successor payment
    - CMS does not extend HCPCS C1601 or introduce new bronchoscopy add-on payment by January 2027
    - Hospital purchasing of Galaxy System pauses or reverses; procedure ramp slows; revenue trajectory impaired; bear-case
      scenario probability rises substantially
    - Watch CMS annual fee schedules Q4 2026; monitor hospital customer renewal rates; solicit confirmed reimbursement strategy
      from management
  - - Additional Class 2 or higher recall issued
    - Noah Medical issues a fifth recall or Class 3 voluntary recall for the Galaxy System
    - Compounds existing quality narrative (four recalls 2024–2025); increases hospital hesitation; raises FDA scrutiny risk;
      premium valuation multiple compresses
    - Require full quality management system audit and recall resolution evidence before proceeding
  - - Confirmed down round or flat round below $2.0B
    - Noah Medical raises a subsequent round at valuation below the reported September 2025 $2.0B mark
    - Directly challenges the thesis anchor; anti-dilution provisions triggered if applicable; signals commercial underperformance
    - Reassess thesis entirely; review round terms for preference ratchets; update scenario probabilities
  - - Revenue confirmation materially below $100M
    - Data-room revenue disclosure reveals FY2025 revenue below $100M
    - At ISRG-comparable 13x EV/Revenue, $100M revenue implies $1.3B fair value — 35% below reported mark; bear-case range
      becomes base case
    - Apply 30–40% valuation discount to $2.0B entry price; require expanded data-room diligence
  - - 'Competitive displacement: Ion or Monarch QUEST achieves community-hospital parity'
    - Independent clinical data shows Ion or Monarch QUEST matching Galaxy's yield metrics without CBCT by end of 2026
    - Galaxy's primary differentiation (community-hospital accessibility via TiLT+) eliminated; ASP and volume pricing pressure
      intensify
    - Re-evaluate technology moat; determine whether Galaxy's installed base creates sufficient switching costs
