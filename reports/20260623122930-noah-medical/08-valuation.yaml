  data:
    items:
    - label: Market
      score: 5
      rationale: 'Lung cancer is the leading cancer killer globally; LDCT screening creating structural diagnostic demand;
        robotic bronchoscopy market growing at 22% CAGR; broader surgical robotics TAM $8.28B growing to $16.4B by 2032. Market
        size and structural tailwind are strong.

        '
      evidenceQuality: high
    - label: Technology proof
      score: 4
      rationale: '96.7% diagnostic yield, 96% tool-in-lesion confirmation, FDA cleared, peer-reviewed publications, no-CBCT
        differentiation confirmed at community hospitals. Clinical evidence is the strongest dimension; recall history and
        two open recalls impose a partial discount.

        '
      evidenceQuality: high
    - label: Adoption traction
      score: 3
      rationale: '10,000+ procedures and 50+ installed systems as of April 2026 demonstrates real commercial adoption 3 years
        post-clearance. Galaxy holds ~5% of robotic bronchoscopy share. Rate is promising but absolute scale is sub-critical;
        community-hospital penetration requires confirmation.

        '
      evidenceQuality: medium
    - label: Financial disclosure
      score: 1
      rationale: 'No revenue, no gross margin, no burn rate, no runway, no cap table, no preference stack, no audited financials.
        Single highest-priority diligence gap. Cannot underwrite valuation without this data.

        '
      evidenceQuality: low
    - label: Competitive moat
      score: 3
      rationale: 'TiLT+ integrated tomosynthesis provides genuine no-CBCT differentiation at community hospitals. However,
        J&J Monarch QUEST (FDA cleared March 2025) and Intuitive Ion (1,041 systems, 51% procedure growth in 2025) are well-funded
        incumbents narrowing the gap. Moat is real but contested.

        '
      evidenceQuality: medium
    - label: Valuation basis
      score: 2
      rationale: '$2.0B mark from unconfirmed secondary source; conflicting Latka estimate at $417.9M; no confirmed revenue
        for multiple-based support; capital efficiency ratio 3.87x is plausible but not analytically sufficient. Valuation
        basis is the second-weakest dimension after financial disclosure.

        '
      evidenceQuality: low
    - label: Exit and returns
      score: 3
      rationale: 'Strong strategic buyer logic (J&J, Intuitive, Stryker, Medtronic); medtech M&A at decade high in 2025 ($80B);
        Bain 2026 flags "heightened competition for quality assets." No confirmed or rumoured transaction. IPO conditional
        on revenue/margin thresholds not yet demonstrated.

        '
      evidenceQuality: medium
callouts:
- calloutType: insight
  title: $2.0B Valuation Is Unconfirmed — Do Not Anchor Without Official Confirmation
  body: 'The $2.0B post-money valuation reported for Noah Medical is sourced entirely from Premier Alternatives (citing PitchBook)
    and Tracxn. Noah Medical has issued no press release, no SEC Form D filing, and no official investor communication confirming
    the September 2025 $230M round or the $2.0B mark. The analyst has been unable to locate official documentation through
    June 23, 2026. Any investment decision based on this valuation must require official confirmation as a pre-condition.
    The conflicting $417.9M figure from Latka, while considered low-confidence, is a warning flag about data-source reliability.
    Investors should treat the $2.0B as an indicative range anchor, not an audited or confirmed fair value.

    '
  claimRefs:
  - CV002
  - CV004
  - CV006
- calloutType: risk
  title: TPT Reimbursement Expiry End 2026 — Near-Term Material Catalyst
  body: 'CMS Transitional Pass-Through (TPT) supplemental payments for robotic bronchoscopy (HCPCS code C1601) are scheduled
    to expire at end of calendar year 2026. Multiple reimbursement specialists and clinical journals have flagged that the
    expiration — absent a successor payment mechanism — will remove a meaningful incremental payment that has supported hospital
    purchasing decisions. If hospitals defer or cancel Galaxy System acquisitions pending reimbursement clarity, the procedure-ramp
    trajectory underlying the base-case valuation would be materially impaired. This catalyst is proximate (H2 2026), observable,
    and adversely correlated with the $2.0B mark. It is the single most actionable near-term monitoring item.

    '
  claimRefs:
  - CV039
  - CV046
