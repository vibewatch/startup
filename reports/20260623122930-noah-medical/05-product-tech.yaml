    summary: "Layered architecture of the Galaxy System from clinical input through real-time imaging and tissue sampling."
    data:
      layers:
        - label: "Clinical Input and Planning"
          detail: "Pre-op CT scan (0.8–1 mm slice, DICOM import); 3D bronchial path planning software; EMN board placed under patient"
        - label: "Navigation and Robotic Positioning"
          detail: "EMN field generator and sensors localizing scope tip vs. CT anatomy; off-the-shelf robotic arm with proprietary control calibration; 4-way articulation and tip velocity control (US12035881)"
        - label: "Intraprocedural Imaging — TiLT+"
          detail: "Standard C-arm arc sweep (30° LAO to 30° RAO); proprietary AI/ML 3D reconstruction algorithm; TiLT reference board (metal bead spatial reference)"
        - label: "Guidance Overlay and Confirmation"
          detail: "Augmented fluoroscopy overlay of updated lesion position and tool tip; StrikePoint numeric tool-to-lesion distance; True Targeting continuous update"
        - label: "Tissue Sampling Interface"
          detail: "Single-use bronchoscope (4.0 mm OD, always-on camera, 4-way articulation); 2.1 mm working channel compatible with OTS biopsy tools; ROSE cytology (institution-dependent)"
