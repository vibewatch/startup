callouts:
  - calloutType: strength
    title: TiLT+ Embedded Imaging Eliminates CBCT Infrastructure Dependency
    body: "The 96.7% CBCT concordance in MATCH 2 is the single most defensible technical claim: it empirically supports the thesis that TiLT+ delivers CBCT-equivalent tool-in-lesion confirmation from standard fluoroscopy equipment, directly expanding the addressable market to community hospitals that cannot justify dedicated CBCT investment."
    claimRefs: [CE012, CE013, CE014, CE015]

  - calloutType: risk
    title: Real-World Safety Diverges from Controlled-Trial Results
    body: "The USC learning-curve study (non-sponsored, academic training program, 2024–2025) documented a 13% pneumothorax rate and 68% strict diagnostic yield in year one — materially worse than MATCH 2 (3% pneumothorax, 96.7% yield). The MAUDE database documents a patient death attributable to use error with scope-buckling warnings. These real-world data points represent the most important adverse product-tech signal for diligence."
    claimRefs: [CE032, CE033, CE038, CE039, CE050, CE055, CE056]

  - calloutType: risk
    title: Class 2 FDA Recall for Power Supply Design Issue
    body: "The October 2024 Class 2 recall of 26 Galaxy System units (Z-0693-2025) for a power supply design defect — attributed to Device Design by the FDA — carries a pneumothorax risk if power is lost during a live procedure. Recall resolution status is not publicly confirmed as of June 2026."
    claimRefs: [CE040, CE041]

  - calloutType: insight
    title: IP Portfolio Signals Therapeutic Pipeline Beyond Diagnostics
    body: "Four U.S. patents granted in 2024–2026 cover a triple imaging hybrid probe, endoluminal suturing, configurable bending section, and anti-buckling device — none maps to the current cleared Galaxy System. This signals a therapeutic and multi-modality roadmap, likely targeting lung-cancer treatment applications, that has not yet been publicly announced but is visible in the IP record."
    claimRefs: [CE043, CE044, CE045, CE046, CE047]

