company:
  name: Noah Medical
chapter:
  number: 5
  title: Product & Technology
  summary: >
    The Galaxy System is Noah Medical's sole commercial product: an FDA-cleared (510(k) K223144, March 2023) robotic-assisted bronchoscopy platform whose core differentiator is TiLT+ Technology — integrated digital tomosynthesis and augmented fluoroscopy that confirms tool-in-lesion in real time using standard C-arm fluoroscopy rather than dedicated cone-beam CT. A 4.0 mm OD single-use disposable bronchoscope with a 2.1 mm working channel, compact single-cart footprint, and compatibility with off-the-shelf biopsy tools round out the platform; peer-reviewed evidence through March 2026 shows 96.7% strict diagnostic yield (MATCH 2, n=31) and 100% tool-in-lesion confirmation (FRONTIER, n=19), while an independent real-world academic learning-curve study reports a 13% pneumothorax rate and 68% strict yield in year one, and a Class 2 FDA recall (October 2024) for a power-supply design defect rounds out the post-market safety record.

sections:
  - id: galaxy-system-overview
    title: Galaxy System Architecture, Components, and Technical Specifications
    body: |
      The Galaxy System is an all-in-one integrated robotic bronchoscopy platform delivered on a single mobile cart. The core architecture integrates four interdependent subsystems: (1) a robotic arm that mounts, articulates, and controls the bronchoscope; (2) a single-use, 4.0 mm outer diameter (OD, measured at tip), four-way articulating disposable bronchoscope with an integrated camera, a single LED light, and a 2.1 mm working channel; (3) electromagnetic navigation (EMN) hardware — including an under-table EMN board and field generator — that localizes scope tip position relative to pre-operative CT anatomy; and (4) the TiLT+ imaging stack, which uses a standard C-arm fluoroscopy unit (not proprietary) to perform digital tomosynthesis and augmented fluoroscopy sweeps for real-time tool-in-lesion confirmation.

      The working channel diameter of 2.1 mm is compatible with off-the-shelf biopsy tools including fine-needle aspiration needles, forceps, cytology brushes, and flexible cryoprobes; no proprietary Galaxy-branded biopsy accessories exist as of run date. The single-use scope design eliminates reprocessing; a Noah Medical field representative assists with setup and troubleshooting during early adoption. Noah Medical's careers page describes a team of 150+ engineers; VP of Engineering John Shen has publicly stated the platform is a mix of off-the-shelf components — including the robotic arm itself — combined with proprietary custom hardware and software where true value is added, principally in TiLT+.

      The GUDID database record confirms the Galaxy System (model GAL-001, UDI-DI 00850048825048) is in active commercial distribution. The system requires a pre-procedural CT scan with 0.8–1 mm slice thickness and 0–50% overlap uploaded to the navigational software; the EMN board is placed under the patient on an EMN-compatible procedural table for registration and scope localization.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: tilt-plus-imaging-technology
    title: "TiLT+ Technology: Digital Tomosynthesis, Augmented Fluoroscopy, and Tool-in-Lesion Confirmation"
    body: |
      TiLT+ (Tool-in-Lesion Technology) is the primary technical differentiator of the Galaxy System and is described by VP of Engineering John Shen as "the big differentiator." TiLT+ solves the CT-to-body divergence problem — the systematic mismatch between the pre-procedural CT scan anatomy used for navigation planning and the patient's actual intraprocedural anatomy, which shifts due to breathing, positioning, and tissue deformation. Existing electromagnetic navigation systems rely solely on the pre-op CT registration without a mechanism to update the target position in real time; TiLT+ fills this gap.

      The TiLT+ imaging subsystem works as follows: after the robotic scope navigates to within approximately 2–3 cm of the target lesion using EMN guidance, the operator isocenters a standard C-arm fluoroscopy unit at the lesion site in three planes (AP, 30° RAO, 30° LAO). With the patient held at an inspiratory breath-hold, the C-arm sweeps from 30° LAO to 30° RAO, acquiring a series of 2D X-ray frames from multiple angles over a narrow arc (typically 15–60°, in contrast to a full 360° CT rotation). Noah Medical's proprietary image-processing algorithms — incorporating AI and machine-learning techniques — reconstruct a 3D tomosynthesis image from this 2D stack, localize the lesion in three dimensions, and update the navigation target to match the patient's actual intraprocedural anatomy. A TiLT board — a pattern of metal reference beads placed under the patient — provides spatial reference for 3D reconstruction from 2D imaging.

      The reconstructed target is then displayed on augmented fluoroscopy as a graphical overlay atop the live C-arm image, showing both the updated lesion position and the biopsy tool tip position in real time. A proprietary StrikePoint feature quantifies the distance between the tool tip and the lesion center, providing a numeric measure of tool-in-lesion confirmation. True Targeting updates the lesion overlay continuously as the operator advances the biopsy tool.

      The MATCH 2 prospective bicentric study (Respiratory Medicine, March 2026, PMID 41620189) validated TiLT+ imaging against cone-beam CT (CBCT) ground truth in 31 patients: TiLT+ demonstrated tool-in-lesion in 30 of 31 nodules (96.7%), CBCT subsequently confirmed TIL in 29 of those 30 (concordance 96.7%), and strict diagnostic yield was 96.7%. Mean TiLT+ sweep radiation dose was 59.1 mGy. The FRONTIER first-in-human study reported 100% tool-in-lesion confirmation across 19 nodules with strict diagnostic yield 89.5–94.7%.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE017]
    figureRefs: [FE002]

  - id: procedure-workflow-accessories
    title: Clinical Workflow, Bronchoscope Design, and Accessory Stack
    body: |
      The Galaxy System procedure workflow proceeds in a defined sequence: pre-procedure CT upload and 3D path planning, patient positioning on an EMN-compatible table, scope docking and registration, EMN-guided navigation to the lesion vicinity (~2 cm), TiLT+ tomosynthesis sweep for real-time lesion localization, augmented fluoroscopy-guided biopsy tool deployment, and tissue sampling. Rapid on-site evaluation (ROSE) by a cytotechnologist is used in some institutions to confirm sample adequacy. Published case series at USC and MATCH 2 used general anesthesia with endotracheal intubation; ventilator settings per a modified VESPA trial approach (TV 8 mL/kg IBW, PEEP 8–12 cmH2O) are used in some centers to reduce atelectasis during TiLT+ sweeps.

      The single-use bronchoscope has a 4.0 mm OD, 2.1 mm working channel, and four-way articulation. The camera and LED light are integrated into a tip module that remains in place at the time of biopsy, enabling direct visualization throughout the entire procedure including the sampling moment. This always-on visualization is a key workflow differentiator versus Intuitive Ion's design, where the vision probe must be withdrawn before biopsy tools are inserted.

      Published case series document the following biopsy tools used with the Galaxy System's 2.1 mm working channel: 21-gauge PeriView FLEX transbronchial FNA needle (Olympus), 1.1 mm flexible single-use cryoprobe (ERBECRYO 2, Erbe Elektromedizin), SuperDimension biopsy forceps (Medtronic), and cytology brushes. The 1.1 mm cryoprobe showed the best diagnostic yield in the USC JTD real-world study. Radial EBUS can also be added for independent lesion confirmation.

      Setup and teardown are designed for bronchoscopy suite respiratory therapists, with Noah Medical field representative support during early adoption. The company provides a library of training resources on its Insights page, including white papers and recorded presentations covering institution onboarding (e.g., "Building a Robotic Lung Biopsy Program," "The Galaxy Experience: First 90 Cases").
    claimRefs: [CE018, CE019, CE020, CE021, CE022, CE023, CE024]
    tableRefs: [TE002]

  - id: clinical-evidence-outcomes
    title: "Clinical Evidence — FRONTIER, MATCH, MATCH 2, and Real-World Learning Curve"
    body: |
      Four peer-reviewed or substantively published datasets characterize Galaxy System clinical performance as of June 2026:

      FRONTIER (first-in-human, Macquarie University Hospital, Sydney; published Respirology June 2024, doi 10.1111/resp.14778): 18 patients, 19 nodules, mean lesion size 20 mm, mean distance from pleura 11.6 mm. Results: 100% successful navigation, 100% tool-in-lesion confirmation, strict diagnostic yield 89.5%, intermediate yield 94.7%, diagnostic accuracy 94.7%, sensitivity 94.4%, specificity 100%. Two pneumothoraces (one requiring chest drain). Conducted by interventional pulmonologists with limited prior robotic experience, supporting replicability in centers new to robotic bronchoscopy.

      MATCH (initial study, pre-commercial data): 100% navigation and diagnostic yield, 95% (19/20) TiLT-confirmed TIL, 5% (1/20) tool-touching-lesion, verified by CBCT.

      MATCH 2 (prospective bicentric, Inova Fairfax and CHI Memorial, November 2024–August 2025; Respiratory Medicine March 2026; NCT06685133): 31 patients, mean lesion size 16.99 mm (±6.2 mm), 13% bronchus sign, 31% pleural-based. Results: 100% procedural success, 97% TIL by TiLT+ (30/31), 96.7% concordance between TiLT+ and CBCT (29/30), 93.5% CBCT-confirmed TIL overall (29/31), 96.7% strict diagnostic yield (20 malignant + 10 specific benign), 3% pneumothorax (1/31). Mean procedure time 46 minutes, mean TiLT+ radiation dose 59.1 mGy.

      Learning Curve Study (USC Keck Hospital, Feb 2024–Feb 2025; Journal of Thoracic Disease, 2025): Real-world, non-sponsored, academic training program. 91 patients, 94 nodules, median lesion size 2.1 cm. Overall strict diagnostic yield 68%; pneumothorax 13% (all requiring chest tube); one self-limited massive hemoptysis. Yield improved from 61% in first six months to 75% in subsequent six months. Trainee involvement and complex anatomy identified as contributing factors; comparable to TARGET trial Monarch benchmark (61.6%). Cryoprobe showed superior yield.

      Beyond the Scope (community hospital, 70 consecutive cases, 18 months; CHEST 2025): 89% strict diagnostic yield. Key predictors of yield: localization in ≥2 augmented-fluoroscopy planes (p<0.001) and direct tool adjustments with peripheral visualization (p=0.01). Cost-benefit ratio 1.5 (endoscopy suite) and 1.1 (OR) — both financially viable (>1).
    claimRefs: [CE025, CE026, CE027, CE028, CE029, CE030, CE031, CE032, CE033, CE034]
    tableRefs: [TE005]

  - id: regulatory-safety-adverse
    title: FDA Clearance, Post-Market Safety Record, and Device Recall
    body: |
      The Galaxy System received FDA 510(k) clearance (K223144) on March 1, 2023 under device classification 874.4680 (Bronchoscope, Flexible or Rigid), product code EOQ, with a determination of Substantial Equivalence (SESE) as a Class II device with special controls. The application was received October 4, 2022, reviewed as a Traditional 510(k), and was not reviewed by a third party. Per the GUDID database, the Galaxy System (GAL-001, UDI-DI 00850048825048) is MR Safe, labeled for prescription use only, and single-use by design.

      Post-market safety: The FDA MAUDE database contains reports of adverse events following Galaxy System procedures. A February 2024 event (MDR key 18699853) involved a patient who experienced bilateral pneumothoraces, cardiac arrest, hemorrhage, pneumonia, and septic shock during a Galaxy-assisted bronchoscopy; the investigation concluded the adverse event resulted from use error — the physician dismissed six scope-buckling workflow-inhibitor error messages without performing the IFU-required fluoroscopy verification before continuing scope advancement, resulting in a kinked scope. The patient subsequently died; the attending physician attributed death to septic shock secondary to pneumonia from pre-existing conditions rather than device malfunction. An August 2024 event (MDR key 20730618) reported a post-procedural pneumothorax requiring chest tube, attributed to anatomical factors (airway tortuosity and catheter stability) rather than device malfunction.

      Class 2 Device Recall (Z-0693-2025): On October 25, 2024, Noah Medical initiated a Class 2 recall (posted December 18, 2024) of 26 Galaxy System units due to a power supply design issue. The recall reason: the uninterruptable power supply may have a defective component capable of causing power supply short circuit or protective circuit breaker trips, resulting in sudden, unrecoverable power loss; if during a procedure, this could require manual scope removal with risk of lung injury or pneumothorax. The FDA determined cause as Device Design. The recall was classified Open as of the December 18, 2024 posting; resolution status as of June 2026 is not publicly confirmed.
    claimRefs: [CE035, CE036, CE037, CE038, CE039, CE040, CE041]
    tableRefs: [TE004]

  - id: ip-engineering-signal
    title: IP Portfolio, Engineering Architecture, and Developer Signal
    body: |
      Noah Medical holds a growing portfolio of U.S. patents covering Galaxy System technology. Justia patent assignment records (as of June 2026) document the following issued patents:

      US12193640 (granted January 14, 2025): Robotic bronchoscopy navigation auto-registration method using EM sensor data transformations; co-inventors include founder Jian Zhang.
      US12350092 (granted July 8, 2025): Triple imaging hybrid probe — combines positional sensor, ultrasound transducer, and camera in a removably coupled multimodal sensing probe for fused imaging, suggesting a future capability beyond the current bronchoscope design.
      US12285162 (granted April 29, 2025): Robotic endoluminal suturing instrument with toggle-based needle rotation, indicating a therapeutic roadmap beyond diagnostic bronchoscopy.
      US12035881 (granted July 16, 2024): Tip velocity control for articulating flexible endoscopes.
      US12611092 (granted April 28, 2026): Configurable endoscope bending section enabling stiffness/flexibility tradeoff adjustment.
      US12635860 (granted May 26, 2026): Anti-buckling device for surgical systems — directly addressing the scope-buckling failure mode documented in the February 2024 MAUDE adverse event.

      The engineering architecture combines proprietary and off-the-shelf components. Per VP of Engineering John Shen's published interview, the robotic arm is off-the-shelf; the scope design, robotic control calibration, and TiLT+ algorithm constitute the core proprietary IP. The TiLT+ algorithm uses AI and machine-learning techniques to reconstruct 3D volume from 2D fluoroscopy frames and is under continued development to improve reconstruction quality and speed.

      Developer signal: Noah Medical's careers page (June 2026) describes 150+ engineers and actively recruits software engineers, algorithm engineers, robotics engineers, clinical engineers, and manufacturing engineers. Active Greenhouse job postings include Sr. Clinical Engineer (Sunnyvale) and manufacturing-focused roles, reflecting commercial-stage scaling. No public GitHub repository or open-source software contribution is documented for Noah Medical — this is typical for closed-architecture regulatory-controlled medical device companies.
    claimRefs: [CE042, CE043, CE044, CE045, CE046, CE047, CE048, CE049]
    tableRefs: [TE003]
    figureRefs: [FE003]

  - id: technical-constraints-gaps
    title: Technical Constraints, Evidence Limitations, and Diligence Gaps
    body: |
      Several technical constraints and evidence limitations are material to assessing Galaxy System product risk in 2026:

      Electromagnetic navigation dependency: The Galaxy System uses EMN for pre-biopsy navigation, which is subject to metallic interference and registration errors from EM field distortions in the procedural environment. TiLT+ corrects for anatomy drift post-navigation, but EMN accuracy for initial path-following degrades in high-ferrous environments. Competing shape-sensing systems (Intuitive Ion) avoid this class of error entirely.

      CT-to-body divergence correction window: TiLT+ corrects anatomy drift only after the scope has been navigated to within 2–3 cm of the target by EMN. If the initial EMN path alignment fails in tortuous airways — for example because the correct segmental airway is not accessible — the operator may not achieve a viable starting position for the TiLT+ sweep, making the technology's key advantage unreachable.

      Radiation exposure: The TiLT+ sweep delivers a mean dose of 59.1 mGy per MATCH 2. This is lower than a full CBCT acquisition but is incremental above standard fluoroscopy. In high-volume bronchoscopy programs, cumulative staff and patient radiation exposure from TiLT+ requires tracking per institutional radiation safety protocols; the MATCH 2 paper does not disclose staff dosimetry data.

      Narrow and non-comparative evidence base: All controlled trials explicitly excluded ground-glass nodules (GGOs), which represent a material and growing share of lung cancer screening detections. The MATCH 2 and FRONTIER studies are small single-arm cohorts (n=31 and n=19). No randomized controlled trial comparing Galaxy against Ion or Monarch has been published as of June 2026. The only independent real-world academic study (USC JTD, 2025) showed materially worse outcomes than controlled trials: 68% yield and 13% pneumothorax.

      C-arm dependency and capital requirement: The Galaxy System requires a standard C-arm fluoroscopy unit for every TiLT+ sweep; this C-arm is not proprietary but must be available in the procedural room. Centers without a mobile C-arm in the bronchoscopy suite face an additional capital or scheduling dependency.

      Scope buckling user-error risk: The most severe MAUDE event was caused by repeated dismissal of scope-buckling workflow inhibitor warnings without fluoroscopy verification. The system provides clear on-screen warnings and IFU guidance; the incident was attributed to use error, but the failure pathway requires robust operator training to mitigate. The recently granted anti-buckling patent (US12635860, May 2026) signals active engineering mitigation.

      Power supply recall: The October 2024 Class 2 recall of 26 Galaxy System units for power supply design issues represents a post-market design quality event. The failure mode — unrecoverable power loss during a bronchoscopy procedure requiring manual scope removal — carries pneumothorax risk. Recall resolution as of run date is not publicly confirmed.
    claimRefs: [CE050, CE051, CE052, CE053, CE054, CE055, CE056]
    figureRefs: [FE004]

