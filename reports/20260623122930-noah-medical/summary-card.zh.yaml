summary:
  headline: Noah Medical 已经搭起可信的机器人支气管镜平台，临床证据领先，也有真实商业牵引力；但没有任何财务披露、仍有两项 FDA 召回处于 open 状态，且 $2.0B 估值未经确认，承销前必须进 data room 验证。
