  topStrengths:
    - >-
      Galaxy System 在已发表诊断收益率上领先：MATCH 2 报告 96.7% 严格收益率，高于已发表 Ion 基准（最高 87.8%）和 Monarch 基准（约 70%），导航成功率
      100%——支撑来自同行评议数据，不只是公司口径。
    - 自研 TiLT+ Technology（集成断层合成 + 增强透视）提供实时嵌入式影像，不要求 CBCT 基础设施，移除重要医院准入障碍，并相对 Ion 和 Monarch 形成可防守的硬件差异化。
    - >-
      Tier-1 投资人组合——SoftBank Vision Fund、Prosperity7、Tiger Global、Hillhouse、Sequoia China——以及据报道 $2.0B
      投后估值，显示机构对平台信心强；CEO Jian Zhang 的 Auris Health 和 Intuitive Surgical 履历也支撑管理层可信度。
    - >-
      从首例美国病例（2023 年 5 月）到 5,000 例美国手术（2025 年 3 月）只用了 22 个月，到 2026 年 4 月全球 50+ 台已安装系统完成 10,000+
      例手术，证明学术医院和社区医院都有真实多站点临床采用。
    - 一次性支气管镜消除再处理成本，随着装机量增长形成复利式经常性收入流；成本收益研究（内镜室比率 1.5）也支撑医院经济性。
  topRisks:
    - 财务零披露：收入、ARR、毛利率、烧钱速度、现金余额和单位经济均未公开；没有直接 data room 访问就无法做传统估值和承销，因此更像需要继续研究，而不是可执行投资。
    - 2024 年 3 月至 2025 年 11 月发出四项 FDA Class 2 器械召回，其中截至 2026 年 6 月有两项仍为 Open（影响 26 台的电源设计缺陷；支气管镜活检通道不兼容），形成持续监管和患者安全压力。
    - >-
      竞争压力加剧：Intuitive Surgical Ion 已达 1,041 台装机（Q1 2026 手术增长 39%），J&J Monarch QUEST 获得 AI 增强 clearance（2025 年 3 月）；两家
      incumbent 在规模和分销上都比 Galaxy 的 50+ 台装机高一个数量级。
    - >-
      CMS Transitional Pass-Through（TPT）对机器人支气管镜耗材的补充支付（HCPCS C1601）将在 2026 日历年末到期；机器人支气管镜没有增量 CPT
      code，报销激励减弱后，医院预算存在近端风险。
    - >-
      据报道 $2.0B 估值和 $230M 后续轮未获 Noah Medical 确认；Latka 的冲突估计（$417.9M）显示数据脆弱，SoftBank 式 participating preferred
      结构带来的优先股堆叠压力，也可能在下行情景显著稀释普通股。
  unresolvedGaps:
    - 已确认收入或 ARR、按业务段（资本设备 vs. 耗材）拆分的毛利率、烧钱速度、现金跑道、装机利用率和客户数——均未公开披露。
    - 2025 年 9 月据报道 $230M Later Stage VC 轮、累计融资和投后估值，需要 Noah Medical 或 primary source 直接确认。
    - 股权结构、清算优先权堆叠、反稀释条款、投资人 pro-rata 权利、董事会构成、期权池规模，以及任何现有债务或 venture debt。
    - CMS TPT（C1601）到期后的 2026 年后报销策略，以及主要保险公司对机器人支气管镜耗材的 commercial payer 覆盖态度。
    - 两项 open FDA 召回（Z-0693-2025 和 Z-0679-2025）的解决时间表和范围，以及 20 个月内四次召回对整体质量体系的影响。
