        - No real-time CT-to-body correction; accept EMN position as ground truth
        - TiLT+ C-arm sweep reconstructs 3D position; updates navigation target to intraprocedural anatomy
        - 96.7% TIL concordance with CBCT (MATCH 2); eliminates CBCT need in participating centers
        - Requires breath-hold; adds 59.1 mGy mean radiation dose; C-arm must be present in procedural room
      - - Biopsy tool deployment and confirmation
        - Fluoroscopy-guided tool advancement without real-time overlay
        - Augmented fluoroscopy shows live tool-vs-lesion position; StrikePoint numeric TIL distance; always-on camera
        - 97% TIL at biopsy (MATCH 2); 96.7% strict yield; 89.5–94.7% FRONTIER; always-on camera at biopsy
        - 13% pneumothorax (real-world USC year 1); scope buckling in tortuous airways; IFU compliance critical
      - - Post-procedure scope removal and room turnover
        - Reprocessing of reusable bronchoscope (30–90 min); cross-contamination risk
        - Disposable scope discarded after each case; robotic arm cleaned and reused
        - Reduced turnover time; lower cross-contamination risk; simplified workflow
        - Disposable scope cost per case adds to procedure economics; no public per-case cost disclosed
