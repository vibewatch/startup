      - number: '4.3'
        title: 'Unit Economics: What Is Known and What Is Not'
        blocks:
          - type: paragraph
            body: >
              Noah Medical's unit economics are almost entirely opaque at the public level. No system ASP, disposable
              ASP, gross margin (capital or disposable), customer acquisition cost, payback period, or revenue per
              installed system has been disclosed by the company. The available evidence permits only informed inference
              and peer-benchmarking. On the capital equipment side, the Galaxy System's single-use bronchoscope
              architecture, compact footprint, and positioning as a cost-effective alternative to incumbent platforms
              suggest an intended system price below the Ion's reported $600,000–$750,000, though no list price is
              confirmed. On the disposable side, the Johns Hopkins / Respiration (2026) study and an earlier systematic
              meta-analysis (Solis-Pazmino et al., Respiration 2022) together show that single-use bronchoscopes price
              between $150 and $400 per unit in the broader market; proprietary robotic-platform disposables typically
              command a premium. The margin structure on disposables in analogous medtech systems is high: Intuitive
              Surgical's instruments and accessories segment ran approximately 65–75% gross margin company-wide in
              recent years, a useful benchmark for fully scaled proprietary disposable businesses. The hospital-facing
              procedure economics were partially illuminated by the CHEST 2025 Beyond the Scope study, which reported a
              cost-benefit ratio above 1.0 in both endoscopy suite and OR settings, demonstrating that the Galaxy
              procedure can generate a positive economic return for the adopting institution—a precondition for
              sustained utilization and reorder. However, a positive hospital CBR does not directly translate into Noah
              Medical's unit economics, which depend on system pricing, disposable pricing, COGS (manufacturing cost per
              system and per bronchoscope), and the service cost per installed unit. A Getlatka third-party database
              entry claims $139.3M in ARR for 2025 with a $417.9M valuation, but the same source incorrectly lists a
              different person as CEO and states $0 raised—making its revenue and valuation figures unreliable and
              unusable for underwriting purposes. Revenue and unit economics must be obtained directly from the company
              through a formal diligence process.
