    title: Investment KPIs — IC-Ready Scoring Across Seven Dimensions
    type: kpi
    layout: standard
    summary: >
      Seven-dimension scoring (1–5 scale) representing public-evidence quality and investment signal strength for Noah
      Medical as of June 2026. Scores reflect the analyst's evidence-based assessment, not a mechanical model. High
      scores on market and technology proof contrast with low scores on financial disclosure and valuation basis,
      reflecting the central thesis challenge.
    approximationNotes: >
      Scores are 1–5 (1 = very weak, 5 = very strong) based on publicly available evidence through June 23, 2026. No
      proprietary data-room access. Scores should be revisited following receipt of audited financials, cap-table terms,
      and confirmed round documentation.
    claimRefs:
      - CV015
      - CV022
      - CV023
      - CV025
      - CV028
      - CV032
      - CV037
    data:
      items:
        - label: Market
          score: 5
          rationale: >
            Lung cancer is the leading cancer killer globally; LDCT screening creating structural diagnostic demand;
            robotic bronchoscopy market growing at 22% CAGR; broader surgical robotics TAM $8.28B growing to $16.4B by
            2032. Market size and structural tailwind are strong.
          evidenceQuality: high
        - label: Technology proof
          score: 4
          rationale: >
            96.7% diagnostic yield, 96% tool-in-lesion confirmation, FDA cleared, peer-reviewed publications, no-CBCT
            differentiation confirmed at community hospitals. Clinical evidence is the strongest dimension; recall
            history and two open recalls impose a partial discount.
          evidenceQuality: high
        - label: Adoption traction
          score: 3
          rationale: >
            10,000+ procedures and 50+ installed systems as of April 2026 demonstrates real commercial adoption 3 years
            post-clearance. Galaxy holds ~5% of robotic bronchoscopy share. Rate is promising but absolute scale is
            sub-critical; community-hospital penetration requires confirmation.
          evidenceQuality: medium
        - label: Financial disclosure
          score: 1
          rationale: >
            No revenue, no gross margin, no burn rate, no runway, no cap table, no preference stack, no audited
            financials. Single highest-priority diligence gap. Cannot underwrite valuation without this data.
          evidenceQuality: low
        - label: Competitive moat
          score: 3
          rationale: >
            TiLT+ integrated tomosynthesis provides genuine no-CBCT differentiation at community hospitals. However, J&J
            Monarch QUEST (FDA cleared March 2025) and Intuitive Ion (1,041 systems, 51% procedure growth in 2025) are
            well-funded incumbents narrowing the gap. Moat is real but contested.
          evidenceQuality: medium
        - label: Valuation basis
          score: 2
          rationale: >
            $2.0B mark from unconfirmed secondary source; conflicting Latka estimate at $417.9M; no confirmed revenue
            for multiple-based support; capital efficiency ratio 3.87x is plausible but not analytically sufficient.
            Valuation basis is the second-weakest dimension after financial disclosure.
          evidenceQuality: low
        - label: Exit and returns
          score: 3
          rationale: >
            Strong strategic buyer logic (J&J, Intuitive, Stryker, Medtronic); medtech M&A at decade high in 2025
            ($80B); Bain 2026 flags "heightened competition for quality assets." No confirmed or rumoured transaction.
            IPO conditional on revenue/margin thresholds not yet demonstrated.
          evidenceQuality: medium
