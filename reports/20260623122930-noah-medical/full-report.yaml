      - number: '1.4'
        title: Milestones, commercial traction, and clinical evidence
        blocks:
          - type: paragraph
            body: >-
              Noah Medical's milestone arc is coherent and well-documented. After announcing new research, testing, and
              training facilities in March 2022, the company received FDA 510(k) clearance (K223144) for the Galaxy
              System on March 1, 2023, as a substantially equivalent Class II device. It then completed first-in-human
              use in the FRONTIER study at Macquarie University Hospital in Sydney under Principal Investigator
              Professor Alvin Ing (March 2023), closed its Series B (April 2023), and performed the first U.S.
              commercial cases at the University of Chicago Medicine with Dr. Kyle Hogarth in May 2023, where all four
              initial patients were discharged the same day. International expansion followed with the first Asian use
              at Prince of Wales Hospital in Hong Kong (December 2023). Adoption then accelerated from the 500th U.S.
              procedure at CHI Memorial (January 2024) to surpassing 5,000 U.S. procedures at Long Island Jewish Medical
              Center (March 2025). Clinical evidence deepened at CHEST 2025, where the MATCH 2 study (31 patients)
              reported 96.7% strict diagnostic yield and the community-hospital Beyond the Scope study reported 89%
              yield; MATCH 2 was subsequently published in the peer-reviewed journal Respiratory Medicine in March 2026.
              The earlier MATCH study had reported 100% navigation and diagnostic yield with 95% tool-in-lesion
              accuracy.
