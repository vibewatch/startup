              stated purpose of the Series B was to meet rising demand for the Galaxy System and accelerate R&D for
              non-invasive platforms for patient diagnosis and treatment. Beyond the Series B, pre-B round
              history—implying seed and Series A funding that enabled the company's founding in approximately 2018
              through FDA clearance in March 2023—is not publicly detailed by Noah Medical. Third-party private-company
              databases (PitchBook via Premier Alternatives) report an additional $230 million Later Stage VC round in
              September 2025 that would bring total disclosed capital raised to approximately $516.8 million and
              post-money valuation to approximately $2.0 billion, reflecting a capital efficiency ratio of ~3.87x
              (valuation divided by total funding). Noah Medical has made no press release or official statement
              confirming this later round, and the absence of official confirmation means these figures should be
              treated as reported but unconfirmed. As a private company, Noah Medical has not disclosed its cap table,
              liquidation preference stack, board composition, investor pro-rata rights, or anti-dilution provisions—all
              of which are essential inputs for underwriting valuation and downside scenarios. The company does not hold
              a public securities filing obligation, so structural disclosure depends entirely on direct management or
              investor engagement in a formal data-room process. The funding chronology established in the Company
