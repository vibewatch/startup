            body: >-
              Noah Medical has not published formal customer retention metrics—no NRR, GRR, churn rate, contract renewal
              data, or cohort utilization statistics are publicly available. Durability must be inferred from indirect
              signals. The most compelling retention proxy is that named early adopter sites (University of Chicago, CHI
              Memorial, Inova Fairfax) have appeared repeatedly across multiple study cohorts, conference presentations,
              and named-user contexts spanning 2023 through 2026, suggesting continued active use. Ingalls Memorial's
              April 2026 adoption within the UChicago Medicine network, more than three years after UChicago's first
              use, implies that the anchor site remained active long enough to influence network diffusion—a meaningful
              durability signal, even if anecdotal.

              The KOL engagement model functions as a hybrid between clinical research partnership and customer success.
              Dr. Bhadra (CHI Memorial) has served as a MATCH 2 investigator, a CommonSpirit Health Lung Council
              co-chair, and—since June 2026—Noah Medical's Chief Pulmonary Advisor. Dr. Mahajan (Inova Fairfax) has
              contributed to both the April 2024 field-data whitepaper and the MATCH 2 study, with multiple public
              endorsements of the system's financial and clinical value. These relationships create institutional
              stickiness: physician champions with equity or advisory ties are unlikely to switch platforms mid-tenure,
              and their research publications generate independent evidence that fuels inbound interest from other
              hospitals.

              Expansion signals are visible in two patterns: geographic diffusion from anchor AMCs to network affiliates
              (UChicago → Ingalls Memorial), and conference-driven adoption where AABIP and CHEST presentations by named
              users bring the Galaxy System to the attention of the broader interventional pulmonology community. Noah
              Medical's presence at AABIP 2024 with simulation sessions, a symposium, and after-hours events explicitly
