      - number: '2.6'
        title: Sizing Uncertainties and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The most material evidence gap in this chapter is the ten-fold spread in robotic bronchoscopy market
              sizing estimates—from $77 million to $640 million for the same nominal segment in 2025–2026. This is not
              primarily a forecasting disagreement but a scope definition disagreement: narrowly-scoped reports counting
              only robotic platform hardware revenue arrive at figures one order of magnitude smaller than
              broadly-scoped reports that bundle navigation software, EBUS accessories, and consumables. No report
              provides downloadable methodology that would allow independent reconciliation. As a result, any market
              sizing citation in this chapter should be treated as directionally indicative rather than authoritative,
              and investors should seek primary channel checks with hospital procurement data to construct bottom-up
              estimates. A second gap is the absence of publicly available data on the installed base of robotic
              bronchoscopy systems in the United States. Intuitive Surgical (Ion) and Johnson and Johnson (Monarch)
              disclose only aggregate procedure counts, and Noah Medical's Galaxy System count is similarly opaque after
              surpassing the 500-case milestone. Without an installed base figure, a precise SOM calculation for any
              individual platform is impossible. A third gap is commercial payer policy heterogeneity: while Medicare
              reimbursement under CPT 31627 and APC 5153 is now codified and publicly available, commercial insurer
              prior-authorization requirements and coverage policies for robotic navigation bronchoscopy are highly
              variable and not systematically published, creating unpredictable revenue visibility for hospital
              bronchoscopy programs. These gaps are not fatal to the investment thesis—the disease burden data and
              clinical evidence are robust—but they preclude precise SOM sizing and therefore limit confidence in
              near-term revenue projections for any single-platform competitor in this space.
            claimRefs:
              - CM041
              - CM042
              - CM043
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Reimbursement Gap Undermines Capital Payback
            body: >-
              CPT 31627 (navigational bronchoscopy) pays only $85 at the facility rate in Q2 2026, while robotic
              bronchoscopy platforms cost $1–2 million per unit. Even using the full APC 5153 bundle at $1,800–2,400 per
              encounter, a hospital performing 150 procedures per year faces a capital payback of approximately 3–5
              years before accounting for maintenance and disposables—a challenging economics model that restricts
              meaningful adoption to high-volume or well-capitalized institutions.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
              - CM031
          - type: callout
            title: Market Estimates Differ by 10× Reflecting Scope Not Disagreement
            body: >-
              The published market sizing range for robotic bronchoscopy ($77M–$640M for 2026) largely reflects
              incompatible scope definitions rather than analytical disagreement among qualified forecasters. Narrow
              device-hardware estimates and enterprise system-plus-software estimates describe different portions of the
              value chain. Without disclosing scope methodology, no single estimate should be cited in isolation.
              Investors should weight the bottom-up procedural estimate ($75–150M US) as the more conservative anchor
              for near-term revenue projections.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM020
          - type: callout
            title: Clinical Evidence Supports Safety-Driven Substitution
            body: >-
              The DYSTRICT study (PMC13139926, 2025) provides the strongest randomized comparator data to date:
              shape-sensing robotic bronchoscopy achieved comparable strict diagnostic yield to CT-guided transthoracic
              biopsy (74% vs 79%, p=0.201) with a dramatically better safety profile—pneumothorax OR 0.04 and
              hospitalization OR 0.35. This safety differential creates a payer-aligned economic case for substituting
              robotic bronchoscopy for CT-guided biopsy as the preferred first-line approach for accessible peripheral
              lung nodules, particularly given the downstream cost of pneumothorax management.
            calloutType: strength
            claimRefs:
              - CM021
              - CM022
              - CM023
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Robotic-assisted bronchoscopy (RAB) entered commercial use in 2018 and has since consolidated around three
              FDA-cleared platforms: Intuitive Surgical's Ion (cleared February 2019), Johnson & Johnson's Monarch
              (cleared March 2018, the earliest entrant), and Noah Medical's Galaxy System (cleared March 2023).
              Together they address the same clinical problem—accurate tissue sampling of peripheral pulmonary lesions
              (PPLs)—but via distinct navigation philosophies: shape-sensing fiber optics (Ion), electromagnetic
              navigation with a robotized scope-in-sheath (Monarch), and electromagnetic navigation with embedded
              fluoroscopic tomosynthesis (Galaxy). All three platforms are positioned for the bronchoscopy suite and
              compete head-to-head for capital budgets at academic medical centers and high-volume community hospitals.


              Beyond the three robotic platforms, Noah Medical also contends with non-robotic navigation solutions:
              Medtronic's ILLUMISITE fluoroscopic navigation platform, Olympus's EBUS bronchoscope family (including the
              BF-UCP190F launched September 2025), and institutional CBCT-guided workflows powered by Siemens Cios Spin
              or GE OEC 3D C-arms. CT-guided transthoracic needle biopsy (TTNB) remains a widely available status-quo
              substitute with a mature evidence base but substantially higher pneumothorax rates. The competitive set
              therefore spans high-capital robotic platforms, mid-tier navigation systems, and established procedural
              substitutes, requiring Noah Medical to establish clinical and economic differentiation across all three
              categories.


              Market growth is rapid but the installed base of any individual platform remains small relative to the
              broader bronchoscopy equipment market, which means every new capital placement is contested and
              first-mover advantages at a given institution create meaningful multi-year switching barriers.
            claimRefs:
