      - number: '6.5'
        title: Reimbursement Framework and Customer-Site Economics
        blocks:
          - type: paragraph
            body: >-
              The reimbursement environment for Galaxy System procedures has materially improved since the 2023
              commercial launch. As of January 1, 2024, CMS awarded Transitional Pass-Through (TPT) status under HCPCS
              code C1601 to qualifying single-use pulmonary bronchoscopes used in select procedures. A third-party legal
              analysis conducted for Noah Medical concluded that the Galaxy single-use bronchoscope appears to meet the
              criteria for TPT payment, which provides an incremental hospital-outpatient payment above standard
              Medicare APC rates. This TPT designation is set to last three years from January 2024, giving customers
              enhanced reimbursement through at least December 2026. The primary procedure codes are CPT 31628 and 31629
              (transbronchial biopsy), which are cited by Noah Medical as billable with C1601.

              The "Beyond the Scope" community hospital study presented at CHEST 2025 quantified the economics:
              procedures in the endoscopy suite produced a cost-benefit ratio of 1.5, and in the OR a ratio of 1.1—both
              above the financially-viable threshold of 1.0 used by the investigator. The MedCity News opinion article
              by the Beyond the Scope principal investigator (Dr. Mathew, March 2026) elaborated that moving cases from
              the OR to the endoscopy suite, combined with complexity-adjusted APC billing (CPT 31628 + 31629 + 31653),
              can "lift cost-benefit analysis, shorten the payback period, and boost contribution margins per case." Dr.
              Mahajan (Inova Fairfax) additionally stated the Galaxy System is "financially sustainable" by minimizing
              direct costs through its single-use bronchoscope design.

              Capital payback timelines depend on procedure volume and the hospital's payer mix. For sites with tight
              margins—particularly smaller community hospitals—the economics are viable in endoscopy-suite settings but
              require disciplined volume ramp and billing discipline. The TPT payment mechanism provides an adoption
              subsidy that expires post-2026, creating a potential headwind for new site economics after the incentive
              ends.
            claimRefs:
