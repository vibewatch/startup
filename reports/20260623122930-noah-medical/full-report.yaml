      - number: '5.3'
        title: Clinical Workflow, Bronchoscope Design, and Accessory Stack
        blocks:
          - type: paragraph
            body: >
              The Galaxy System procedure workflow proceeds in a defined sequence: pre-procedure CT upload and 3D path
              planning, patient positioning on an EMN-compatible table, scope docking and registration, EMN-guided
              navigation to the lesion vicinity (~2 cm), TiLT+ tomosynthesis sweep for real-time lesion localization,
              augmented fluoroscopy-guided biopsy tool deployment, and tissue sampling. Rapid on-site evaluation (ROSE)
              by a cytotechnologist is used in some institutions to confirm sample adequacy. Published case series at
              USC and MATCH 2 used general anesthesia with endotracheal intubation; ventilator settings per a modified
              VESPA trial approach (TV 8 mL/kg IBW, PEEP 8–12 cmH2O) are used in some centers to reduce atelectasis
              during TiLT+ sweeps.


              The single-use bronchoscope has a 4.0 mm OD, 2.1 mm working channel, and four-way articulation. The camera
              and LED light are integrated into a tip module that remains in place at the time of biopsy, enabling
              direct visualization throughout the entire procedure including the sampling moment. This always-on
              visualization is a key workflow differentiator versus Intuitive Ion's design, where the vision probe must
              be withdrawn before biopsy tools are inserted.


              Published case series document the following biopsy tools used with the Galaxy System's 2.1 mm working
              channel: 21-gauge PeriView FLEX transbronchial FNA needle (Olympus), 1.1 mm flexible single-use cryoprobe
              (ERBECRYO 2, Erbe Elektromedizin), SuperDimension biopsy forceps (Medtronic), and cytology brushes. The
              1.1 mm cryoprobe showed the best diagnostic yield in the USC JTD real-world study. Radial EBUS can also be
              added for independent lesion confirmation.


              Setup and teardown are designed for bronchoscopy suite respiratory therapists, with Noah Medical field
              representative support during early adoption. The company provides a library of training resources on its
              Insights page, including white papers and recorded presentations covering institution onboarding (e.g.,
              "Building a Robotic Lung Biopsy Program," "The Galaxy Experience: First 90 Cases").
