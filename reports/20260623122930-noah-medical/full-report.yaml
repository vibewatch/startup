      - number: '6.3'
        title: Adoption Trajectory and Procedural Milestone Evidence
        blocks:
          - type: paragraph
            body: >-
              Noah Medical's procedure-count milestones provide the clearest public proxy for adoption velocity. The
              company reached its first commercial U.S. use in May 2023, the 500th U.S. procedure in January 2024
              (approximately eight months post-launch), and the 5,000th U.S. procedure in March 2025—a 22-month ramp
              from first case to five-thousand. The interval from the 500th to the 5,000th procedure spans approximately
              14 months, implying an average of roughly 320–370 procedures per month during the commercial scale-up
              phase. A run-date (June 2026) cumulative procedure count has not been disclosed.

              Geographic expansion tracks parallel to procedure volume growth. The first-in-human use in Australia
              (March 2023) preceded U.S. commercialization and established the Macquarie University Hospital as an early
              clinical evidence generator. The first Asian commercial use at Prince of Wales Hospital (December 2023)
              initiated a prospective clinical trial in Hong Kong, extending the evidence base internationally.
              Intra-network diffusion is evidenced by the April 2026 launch at Ingalls Memorial (UChicago Medicine
              network), and the presence of named users across at least six U.S. states (California, Tennessee, New
              York, Virginia, West Virginia, North Carolina/South Carolina region via Prisma Health) and two
              international geographies (Australia, Hong Kong) confirms multi-geography deployment.

              The procedural growth trajectory is consistent with multi-site adoption but the total installed-base site
              count remains undisclosed, making it impossible to independently calculate per-site average utilization or
              distinguish fast-scaling sites from lower-volume deployments. The company's communications shift from
              procedure milestones to "rapid adoption" language without providing an account count, a common disclosure
              pattern for pre-IPO medical-device companies managing competitive intelligence.
