            title: Real-World Clinical Performance Gap vs. Sponsored Studies
            body: >-
              The USC Keck Hospital learning curve study (JTD 2025, n=91, non-sponsored) is the only independent
              real-world Galaxy dataset and shows a 68% strict diagnostic yield and 13% pneumothorax rate in year one —
              starkly below the 96.7% yield and 3% pneumothorax in MATCH 2 (sponsored, n=31). Intuitive Ion real-world
              data shows 91% yield and near-zero pneumothorax at high-volume centers. This evidence gap is the most
              important clinical risk: payers evaluating coverage, hospitals evaluating procurement, and clinicians
              evaluating patient referral paths will encounter both datasets. Until a large, multi-center, non-sponsored
              study or a head-to-head RCT against Ion is completed, the clinical evidence risk remains unresolved.
