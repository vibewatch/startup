chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and the Galaxy product
        blocks:
          - type: paragraph
            body: >-
              Noah Medical is a privately held medical-robotics company based in San Carlos, California, in Silicon
              Valley, with its headquarters address (1501 Industrial Rd) independently confirmed on the FDA 510(k)
              record for its lead product. Private databases place the company's founding around 2018, though Noah
              Medical does not publicly confirm an exact incorporation date. The company's stated mission is to deliver
              adoptable clinical solutions through innovative endoluminal technologies that enhance the quality of life
              for patients globally, framed concretely around earlier, more accurate lung-cancer diagnosis. Its first
              and only commercial product is the Galaxy System, a robotic-assisted (navigated) bronchoscopy platform
              intended to provide bronchoscopic visualization of, and access to, patient airways for diagnostic and
              therapeutic procedures. The Galaxy System combines proprietary TiLT+ Technology with integrated digital
              tomosynthesis and augmented fluoroscopy, an always-on single-use disposable bronchoscope, and a compact
              footprint; the company markets it as the only navigated bronchoscopy system with a single-use scope and as
              its inaugural commercial robotic system. The business model centers on selling the Galaxy capital system
              plus single-use disposables for peripheral lung-nodule biopsy.
