      - number: '7.3'
        title: Clinical Evidence Limitations, Adoption Friction, and Training Risks
        blocks:
          - type: paragraph
            body: >
              The Galaxy System's sponsor-funded clinical evidence shows compelling results: 96.7% strict diagnostic
              yield (MATCH 2, n=31), 100% tool-in-lesion confirmation (FRONTIER, n=19), and 89% yield in
              community-hospital real-world use (Beyond the Scope, n=70, CHEST 2025). However, the independent,
              non-sponsored USC Keck Hospital learning curve study (Journal of Thoracic Disease 2025, n=91 patients, 94
              nodules) documented a 68% overall strict diagnostic yield and a 13% pneumothorax rate—all requiring chest
              tube placement. A separate case report documented self-limited massive hemoptysis. This
              real-world-versus-study divergence is a classic device adoption risk: sponsor-selected centers with
              experienced operators and optimized protocols outperform community and training environments.


              The 13% pneumothorax rate is clinically meaningful and raises questions about early-center operator
              selection and training adequacy. Intuitive Ion real-world data from high-volume centers (Annals of
              Thoracic Surgery 2025, shape-sensing robotic data) reports diagnostic yield of 91% and effectively zero
              pneumothorax, establishing a credible comparative benchmark that payers and hospital administrators may
              use to evaluate Galaxy's real-world performance. A propensity-score matched comparison of Monarch vs. Ion
              (Annals of Thoracic Surgery 2025) gave Ion 84% yield vs. Monarch's 71%, further illustrating that Galaxy's
              real-world 68% year-one yield is at the lower end of the established robotic bronchoscopy range. Yield
              improved to 75% in the USC study's second six months, suggesting a 20–50-case learning curve is required
              before operators reach confident performance—consistent with industry estimates of 20–50 cases for robotic
              bronchoscopy proficiency.


              Interventional pulmonology (IP) is a small, specialized subspecialty. HRSA's 2023-2038 physician workforce
              projection shows 31 of 35 specialties will face shortfalls by 2037; pulmonology is among the most
              demand-constrained. IP fellowship training positions do not expand proportional to technology adoption,
              which means the pool of qualified Galaxy operators grows slowly. Noah Medical addresses training risk with
              an embedded clinical applications specialist model—field representatives attend early cases—but this model
              has a unit economics ceiling: each additional install requires sustained field-support headcount,
              compressing contribution margins and restricting simultaneous rollout velocity. Hospital credentialing
              committees require documented competency protocols before clearing physicians for independent use, adding
              administrative burden beyond the manufacturer's training program. The Cleveland Clinic advisory identifies
              operator experience, tool selection, and multiplanar visualization use as the primary yield determinants,
              confirming that simply placing a Galaxy System does not guarantee high diagnostic yield without a
              structured training pathway.
