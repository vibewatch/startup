      - number: '6.4'
        title: Hospital Procurement Path and Training Adoption Model
        blocks:
          - type: paragraph
            body: >-
              Hospital procurement of the Galaxy System capital unit follows the standard hospital capital expenditure
              process: a physician champion (typically the interventional pulmonologist leading the lung nodule program)
              develops a service-line business case covering capital cost, expected per-procedure contribution margin,
              reimbursement economics, and competitive differentiation against first-generation platforms. This business
              case goes to the hospital capital committee, which may be annual or require a threshold-crossing approval.
              Contract negotiation, facility preparation for the system's C-arm-compatible bronchoscopy suite, and
              training then precede first use.

              Noah Medical's FRONTIER study demonstrated that "the system can be rapidly and successfully deployed after
              recommended training, even in areas with minimal robotic experience," suggesting a shallow learning curve
              by design. The AABIP 2024 program featured multiple Galaxy simulation sessions under the theme "Tips and
              Tricks for Optimizing Yield in Peripheral Bronchoscopy," and Noah Medical hosted interactive simulation
              and after-hours events to build physician competency at conferences. The company also offers a
              reimbursement-support resource (reimbursement@noahmed.com) to help hospital billing teams navigate CPT
              coding.

              Despite Noah Medical's positioning of rapid adoptability, the broader robotic bronchoscopy literature
              documents that implementation requires multi-disciplinary coordination across pulmonology, radiology,
              anesthesiology, and hospital administration, and that general anesthesia access is a structural
              requirement—one that constrains deployment in settings with limited anesthesia availability. These
              barriers are documented by third-party clinical commentators, not company sources, and are relevant to
              modeling expansion beyond well-resourced facilities.
