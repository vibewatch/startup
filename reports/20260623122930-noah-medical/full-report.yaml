      - number: '7.2'
        title: Reimbursement and Coverage Risks
        blocks:
          - type: paragraph
            body: >
              Medicare does not have a unique CPT code for robotic bronchoscopy. Galaxy System procedures are billed
              under existing conventional bronchoscopy codes: 31628 (transbronchial lung biopsy, single lobe) as the
              primary code, plus add-on code 31627 (computer-assisted navigational component) when electromagnetic
              navigation is used. No incremental robotic premium is available, meaning Noah Medical's sophisticated
              TiLT+ imaging technology generates the same CMS reimbursement as a manually guided procedure. The
              navigator add-on 31627 reimburses approximately $70–$120 per procedure under the Physician Fee Schedule,
              offering marginal uplift versus the operational cost of the Galaxy platform.


              CMS's TCET (Transitional Coverage for Emerging Technologies) pathway, finalized August 2024 and effective
              2025, offers expedited national Medicare coverage for FDA-designated Breakthrough Devices that meet strict
              clinical criteria. The pathway accepts up to five candidates annually. Noah Medical has not publicly
              indicated that the Galaxy System has been nominated for or accepted into the TCET pathway, and the
              Galaxy's 510(k) classification as a standard Class II device rather than a Breakthrough Device may
              preclude eligibility without redesignation. Even if eligible, TCET typically requires Coverage with
              Evidence Development (CED)—additional data collection after commercialization—which extends the period of
              coverage uncertainty and clinical-trial burden.


              CMS implemented a -2.5% efficiency adjustment on many non-time-based physician services in the 2026
              Physician Fee Schedule, further compressing per-procedure reimbursement. Simultaneously, the AHA 2025
              report documented that Medicare reimbursed hospitals only 83 cents per dollar of care delivered in 2023,
              and hospital operating margins remained structurally thin going into 2026. These dynamics increase
              hospital price sensitivity to disposable consumable costs for each Galaxy procedure, potentially
              lengthening the payback period on capital investment. Commercial insurer coverage for robotic bronchoscopy
              is inconsistent across payers and geographies; each new account may require prior authorization workflows,
              clinical documentation requirements, and payer-specific coverage reviews. The RQM+ medtech industry
              analysis warns explicitly that regulatory approval does not guarantee market success: multiple FDA-cleared
              devices have faced years of reimbursement non-coverage after clearance. Without a proactive payer coverage
              strategy—national coverage determination or broad LCD—the Galaxy System's revenue potential is constrained
              to hospitals where favorable payer mix or institutional cost-center absorbs the disposable.
            claimRefs:
