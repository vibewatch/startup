  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Device Safety Risks
        blocks:
          - type: paragraph
            body: >
              The Galaxy System has accumulated four distinct FDA Class 2 device recalls since March 2024, an unusually
              high frequency for a platform with a limited commercial install base estimated below 100 systems. The
              pattern signals design-quality control challenges at a critical commercialization stage and may attract
              enhanced FDA post-market surveillance or require 510(k) supplement filings for design corrections.


              Recall Z-0693-2025 (initiated October 25, 2024; posted December 18, 2024; status Open as of June 2026)
              covers 26 Galaxy System units (GAL-001) with a power supply defect: the uninterruptable power supply
              contains a semiconductor component that can cause a non-recoverable short circuit or circuit-breaker trip.
              If this failure occurs mid-procedure, the bronchoscope must be manually extracted, increasing risk of lung
              laceration and pneumothorax. The corrective action remains incomplete as of June 2026.


              Recall Z-0679-2025 (initiated October 25, 2024; posted December 13, 2024; status Open as of June 2026)
              covers the Galaxy bronchoscope (GALB-001) used with IFU Revision J and all prior versions for the same
              affected system serial numbers. The failure mode: not all biopsy tools fitting the 2.1 mm working channel
              will pass through when the scope is in a sharp bend exceeding approximately 100 degrees; forcing the tool
              risks tissue injury or pneumothorax. This is an inherent geometric constraint of the single-lumen
              disposable design.


              Recall Z-1734-2024 (initiated March 9, 2024; posted May 1, 2024) covers 17 wired controller units
              (GAL-019) whose torque calibration was misaligned, potentially causing unintended robotic scope motion.
              Controller motion errors are categorically dangerous during airway procedures.


              Recall Z-0598-2026 (initiated September 12, 2025; posted November 26, 2025) covers the Galaxy System
              because user manuals were password protected, preventing operator access to safety-critical IFU content.
              Inaccessible instructions are a primary FDA recall trigger for procedural misuse.


              The FDA MAUDE database documents a February 2024 adverse event (MDR 18699853) in which a patient died
              following a Galaxy procedure. The physician dismissed six scope-buckling warning messages without
              performing the IFU-required fluoroscopy verification before continuing scope advancement; the resulting
              kinked scope led to bilateral pneumothorax, cardiac arrest, hemorrhage, and septic shock. While the
              investigation attributed death to pre-existing pneumonia rather than device malfunction, the event
              illustrates that user-error failures are enabled by inadequate safeguards. A second 2025 MAUDE event (MDR
              21200488) recorded a patient stroke two days post-Galaxy procedure; no device malfunction was attributed,
              but the report documents the adverse outcome timeline. Noah Medical was granted patent US12635860 (May 26,
              2026) specifically for an anti-buckling device for surgical systems, directly addressing the
              scope-buckling failure mode.


              The Galaxy System received 510(k) clearance K223144 on March 1, 2023 as a Class II bronchoscope with
              special controls. No de novo, PMA, or Breakthrough Device designation for the Galaxy System has been
              publicly confirmed, which limits access to the CMS TCET coverage pathway and potentially signals the
              regulatory strategy is incremental rather than transformative. International clearance: CE Mark for the EU
              market is not publicly confirmed as of June 2026, restricting the commercial footprint to the US and an
              Asia pilot.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
