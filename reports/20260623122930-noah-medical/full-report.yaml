  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Galaxy System Architecture, Components, and Technical Specifications
        blocks:
          - type: paragraph
            body: >
              The Galaxy System is an all-in-one integrated robotic bronchoscopy platform delivered on a single mobile
              cart. The core architecture integrates four interdependent subsystems: (1) a robotic arm that mounts,
              articulates, and controls the bronchoscope; (2) a single-use, 4.0 mm outer diameter (OD, measured at tip),
              four-way articulating disposable bronchoscope with an integrated camera, a single LED light, and a 2.1 mm
              working channel; (3) electromagnetic navigation (EMN) hardware — including an under-table EMN board and
              field generator — that localizes scope tip position relative to pre-operative CT anatomy; and (4) the
              TiLT+ imaging stack, which uses a standard C-arm fluoroscopy unit (not proprietary) to perform digital
              tomosynthesis and augmented fluoroscopy sweeps for real-time tool-in-lesion confirmation.


              The working channel diameter of 2.1 mm is compatible with off-the-shelf biopsy tools including fine-needle
              aspiration needles, forceps, cytology brushes, and flexible cryoprobes; no proprietary Galaxy-branded
              biopsy accessories exist as of run date. The single-use scope design eliminates reprocessing; a Noah
              Medical field representative assists with setup and troubleshooting during early adoption. Noah Medical's
              careers page describes a team of 150+ engineers; VP of Engineering John Shen has publicly stated the
              platform is a mix of off-the-shelf components — including the robotic arm itself — combined with
              proprietary custom hardware and software where true value is added, principally in TiLT+.


              The GUDID database record confirms the Galaxy System (model GAL-001, UDI-DI 00850048825048) is in active
              commercial distribution. The system requires a pre-procedural CT scan with 0.8–1 mm slice thickness and
              0–50% overlap uploaded to the navigational software; the EMN board is placed under the patient on an
              EMN-compatible procedural table for registration and scope localization.
