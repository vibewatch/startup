        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Noah Medical's most firmly documented financing milestone is its oversubscribed $150 million Series B,
              closed April 19, 2023, and led by SoftBank Vision Fund with Prosperity7 Ventures (affiliated with Saudi
              Aramco) as co-lead. The syndicate also included Tiger Global, Hillhouse, Sequoia China, Shangbay Capital,
