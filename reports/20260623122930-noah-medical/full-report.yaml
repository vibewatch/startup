        blocks:
          - type: paragraph
            body: >-
              Noah Medical is led by founder and CEO Jian Zhang, a surgical-robotics entrepreneur whose founder-market
              fit is unusually strong: he was employee #2 at Auris Health, acquired by Johnson & Johnson for $5.7
              billion in 2019, previously worked at Intuitive Surgical, holds MS and PhD degrees from Columbia
              University, and co-founded prior startups including Robotphoenix. The public leadership page lists a
              functional executive bench drawn heavily from Intuitive, Auris, Stryker, Verb Surgical, and other top
              robotics companies, including Ivy Li as Interim CFO, Joe Riley as VP of Sales and Marketing, John Shen as
              VP of Engineering, Nicky Espinosa as General Counsel, John Mesenbring as VP of Manufacturing Operations,
              and Brent Lloyd as VP of Service and Technology Operations. In June 2026 the company appointed Dr. Krish
              Bhadra, a Stanford Medicine interventional pulmonologist who has performed more than 2,300
              robotic-assisted bronchoscopy procedures, as Chief Pulmonary Advisor in a newly created role. The most
              material governance gap is that the board of directors, investor board seats, and ownership structure are
              not publicly disclosed, and the CFO role is still held on an interim basis, both of which are key-person
              and governance considerations for diligence.
