      - number: '2.5'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The structural growth thesis for robotic bronchoscopy rests on four reinforcing drivers. First, the USPSTF
              guideline expansion in 2021—which nearly doubled the eligible screening population to 14.1 million—is
              progressively increasing LDCT scan volume and therefore the pipeline of detected nodules requiring
              evaluation. Second, clinical evidence is strengthening: the DYSTRICT study (ERJO, 2025, PMC) demonstrated
              that shape-sensing robotic bronchoscopy achieved comparable strict diagnostic yield to CT-guided biopsy
              (74% vs 79%, p=0.201) while delivering substantially lower pneumothorax rates (OR 0.04) and
              hospitalization rates (OR 0.35). This safety profile differential justifies clinical preference,
              particularly as payers increasingly track complication costs. Third, AI and imaging integration are
              reducing the skill barrier: second-generation platforms that embed advanced fluoroscopy or C-arm
              tomography eliminate the need for additional CBCT capital and shorten procedure cycles, making the
              economics viable at community hospitals without large volumes. Fourth, the APC complexity adjustment—using
              bundled codes in an endoscopy suite rather than an OR—converts what had been a marginal or break-even
              procedure into a profitable service line. Against these drivers, the constraints are substantial. The CPT
              31627 facility rate of $85 in 2026 is structurally inadequate relative to capital cost, creating a
              reimbursement gap that requires high procedure volume or creative coding strategies to close. Capital
              expenditure of $1–2 million per platform plus $150,000–$300,000 annually in maintenance and disposables
              creates a payback period that stretches three to five years at moderate volumes. The interventional
              pulmonology fellowship pipeline is limited: ACGME-accredited training programs produce only a modest
              cohort of board-certified interventional pulmonologists each year, creating a workforce bottleneck for
              expansion beyond major centers. Finally, the LDCT screening uptake gap—18% coverage of eligible adults—
              means the demand funnel feeding into biopsy is operating far below theoretical capacity. Improving
              screening adherence and follow-up pathways is a necessary market infrastructure investment that individual
              device companies cannot control but whose pace will significantly determine the size of the accessible
              market over the next five years.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
          - type: table
            tableRef: TM004
