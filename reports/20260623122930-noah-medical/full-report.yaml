      - number: '6.7'
        title: Concentration Risk, Undisclosed Installed Base, and Adoption Barriers
        blocks:
          - type: paragraph
            body: >-
              The most material customer-chapter gap is that Noah Medical has not disclosed the total number of hospital
              sites, active installed base, or customer count as of June 2026. Public evidence names at minimum seven
              distinct clinical sites generating Galaxy procedures, but this is almost certainly an undercount of the
              true deployment footprint—the 5,000+ U.S. procedures by March 2025 imply a multi-site deployment well
              beyond the seven publicly confirmed names. However, without a stated site count, customer concentration
              cannot be independently assessed. If a significant fraction of the 5,000+ cumulative procedures came from
              a small number of high-volume KOL sites (UChicago, Inova Fairfax, CHI Memorial), the installed base may be
              shallower than the procedure milestone implies.

              Adoption barriers documented in independent clinical literature include: (1) high upfront capital costs,
              identified as a "significant financial burden" for institutions in a published Thorax BMJ clinical
              commentary; (2) the requirement for general anesthesia access, which limits deployment in nationalized
              healthcare systems and resource-constrained settings; and (3) the need for multi-disciplinary staff
              coordination across pulmonology, anesthesiology, and radiology. These are industry- wide constraints, not
              Galaxy-specific, but they shape the realistic addressable hospital universe. The post-2026 expiry of TPT
              C1601 payments will remove an incremental economic subsidy, potentially slowing new-site economics.

              The most prominent adverse data point on customer evidence quality is the conflict- of-interest structure
              at early adopter sites: Dr. Hogarth (University of Chicago) disclosed a paid consulting relationship and
              equity interest; Dr. Bhadra (CHI Memorial) transitioned to company advisor in June 2026; Dr. Mahajan
              (Inova Fairfax) contributed to physician-adjudicated (not peer-reviewed) whitepapers and served as MATCH 2
              PI. The clinical data from these sites is real, but the independence signal is weaker than arms-length
              third-party evaluation. The Frontiers Oncology review article on the evolution of robotic bronchoscopy
              (March 2025) did not reference Galaxy at all, centering its analysis on Intuitive Surgical's ION—a signal
              that Galaxy's academic literature footprint is still modest relative to the ION platform.
