  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Substitutes, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The target market is defined as robotic and navigational bronchoscopy for the evaluation and tissue
              sampling of pulmonary nodules and early-stage lung cancer, encompassing the hardware platforms (robotic
              endoluminal systems), single-use disposable bronchoscope catheters, intra-procedural imaging add-ons
              (mobile cone-beam CT, advanced fluoroscopy), biopsy tool consumables, and the procedure-level software
              that enables shape-sensing navigation. This scope intentionally excludes standalone CT scanner capital
              equipment used for primary screening, conventional flexible bronchoscopy without navigational guidance,
              surgical thoracoscopic/VATS biopsy, radiation therapy devices, and downstream molecular or liquid biopsy
              testing. Adjacent spend that is not included but materially affects adoption includes hospital EMR/PACS
              integration middleware, interventional pulmonology suite renovation, and mediastinal staging tools
              (EBUS-TBNA) that are frequently co-billed. The status-quo substitutes competing directly for the same
              diagnostic indication are CT-guided transthoracic needle biopsy (CTTB)—the dominant incumbent for
              peripheral nodules with published yield of 66–100% but pneumothorax rates of up to 25%—and electromagnetic
              navigation bronchoscopy (ENB, primarily Medtronic's SuperDimension). Conventional flexible bronchoscopy
              remains the standard for central airway lesions and is largely non-competitive in the peripheral nodule
              segment. Surgical wedge biopsy provides definitive tissue but with substantially higher morbidity, cost,
              and inpatient bed consumption. Understanding which spend is included matters critically for sizing:
              analyst reports that bundle ENB, EBUS, and diagnostic accessories into a broad "interventional pulmonology
              devices" TAM arrive at figures ten times larger than those that count only purpose-built robotic
              bronchoscopy platforms.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM022
