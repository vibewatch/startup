  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Disclosed Valuation and Funding Evidence
        blocks:
          - type: paragraph
            body: >
              The most firmly documented financing event for Noah Medical is its $150 million Series B, announced April
              19, 2023, led by SoftBank Vision Fund and Prosperity7 Ventures (Aramco affiliate), with a broad syndicate
              including Tiger Global, Hillhouse, Sequoia China, Shangbay Capital, Uphonest Capital, Sunmed Capital, Lyfe
              Capital, 1955 Capital, and AME Cloud Ventures. This round was announced via company press release and
              corroborated by multiple independent deal-coverage outlets. It remains the only officially confirmed
              financing event. Tracxn's public profile of Noah Medical (last updated June 6, 2026) classifies the
              company as a "soonicorn" and shows a January 2021 early-stage VC round as the visible pre-B financing;
              total funding history is partially gated. Premier Alternatives, citing PitchBook data, reports a $230
              million Later Stage VC round in September 2025 that would bring total capital raised to approximately
              $516.8M and post-money valuation to $2.0B as of September 24, 2025 — a capital efficiency ratio of 3.87x.
              Noah Medical has made no official press release or statement confirming this round, and the absence of
              official confirmation means the $2.0B figure must be treated as reported but unverified. A third source,
              Latka, reports a deeply conflicting $417.9M valuation with $139.3M ARR; Latka's methodology for private
              companies is opaque and reliability is low. These three data points—$150M confirmed Series B, $2.0B
              unconfirmed (Premier/PitchBook), and $417.9M conflicting (Latka)—constitute the full universe of publicly
              available valuation evidence as of June 2026.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV043
      - number: '8.2'
        title: Funding-Based Valuation Heuristics
        blocks:
          - type: paragraph
            body: >
              In the absence of confirmed revenue, analysts commonly apply funding-based heuristics to frame private
              company valuations. For Noah Medical, the 3.87x capital efficiency ratio (reported $2.0B valuation /
              $516.8M raised) is a useful starting point, though it conflates post-money accounting with economic value.
              Private medical robotics companies at the Later Stage VC level typically exhibit capital efficiency ratios
              between 2x and 6x depending on technology maturity, installed base, and investor confidence — Noah
              Medical's 3.87x sits comfortably within this range. However, capital efficiency ratios measure neither
              profitability nor growth rate; they describe only the relationship between funding and the valuation set
              at the last round. Tracxn's funding data identifies an early-stage VC round in January 2021 (reported by
              third parties as approximately $137M), prior to the April 2023 Series B. If the reported September 2025
              $230M round is genuine, the step-up in valuation between the April 2023 Series B and the 2025 round
              implies meaningful upward re-pricing consistent with demonstrated commercial progress (5,000 procedures by
              March 2025, Galaxy 2.0 launch, CHEST 2025 data). The capital efficiency ratio does not imply intrinsic
              fair value; it is better understood as a market-clearing price set by institutional investors with
              information advantages over public observers. Revenue multiples cannot be calculated without confirmed
              revenue figures; the analyst therefore declines to apply revenue multiples and instead relies on
              comparable-set benchmarking and scenario analysis.
            claimRefs:
