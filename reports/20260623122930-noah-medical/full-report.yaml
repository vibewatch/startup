  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer, User, Payer Roles
        blocks:
          - type: paragraph
            body: >-
              The Galaxy System's end customer is the hospital or health system that purchases the robotic capital unit
              and consumes single-use disposable bronchoscopes per procedure. Buyers segment into three identifiable
              tiers. Academic medical centers (AMCs), such as the University of Chicago Medicine and Inova Fairfax
              Medical Center (Virginia), are first-mover adopters with large interventional pulmonology programs, robust
              research infrastructure, and Medicare/commercial payer mixes that support capital investment in advanced
              bronchoscopy. Large community hospitals—exemplified by CHI Memorial in Chattanooga, Tennessee (part of the
              CommonSpirit Health network) and Long Island Jewish Medical Center in New Hyde Park, New York (a Northwell
              Health affiliate)—represent the critical second-tier segment where mid-2024 adoption signals a broadening
              beyond research centers. Smaller and rural community hospitals, represented by WVU Camden Clark Medical
              Center in West Virginia, where one of only two interventional pulmonologists in the state operates, form
              the emerging third tier that the "Beyond the Scope" study demonstrated can achieve economic sustainability
              with Galaxy.

              The buyer role is held by hospital administration or a physician-executive service-line leader who builds
              and champions a capital-expenditure business case through the annual or ad hoc capital committee process.
              The user is the interventional pulmonologist (IP) who performs procedures; Galaxy's compact footprint and
              single-use bronchoscope allow deployment in an endoscopy suite, not only in an operating room, which
              broadens the user setting for smaller sites. The payer for Galaxy-enabled procedures is Medicare
              (approximately 60% of procedure volume in community settings), supplemented by commercial insurance and,
              to a lesser extent, Medicaid. The champion at most confirmed sites has been a named IP
              physician-investigator with early access to Noah Medical's clinical programs and, in several cases, a
              disclosed financial relationship with the company.
