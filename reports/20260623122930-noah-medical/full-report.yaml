  - id: FE002
    title: Galaxy System Clinical Workflow — Procedure Flow
    type: flow
    layout: wide
    summary: >-
      Step-by-step procedural flow for a Galaxy System-guided robotic bronchoscopy from patient preparation to scope
      removal.
    data:
      nodes:
        - id: n1
          label: Pre-procedure CT upload and 3D path planning in Galaxy software
          detail: CT 0.8–1 mm slice; DICOM import; automated bronchial tree model; path to target lesion
        - id: n2
          label: Patient positioned; TiLT board placed under patient; scope docked to robotic arm
          detail: EMN-compatible table; intubation (GA); EMN board for scope tip localization
        - id: n3
          label: EMN-guided robotic scope navigation through bronchial tree to ~2–3 cm from target
          detail: Robotic 4-way articulation; EMN real-time position vs. pre-op CT; physician controller
        - id: n4
          label: C-arm isocentered at lesion; inspiratory breath-hold; TiLT+ arc sweep (30° LAO → 30° RAO)
          detail: Radiation dose ~59.1 mGy mean; reconstruct 3D lesion position; update navigation target
        - id: n5
          label: Augmented fluoroscopy overlay; StrikePoint confirms numeric TIL distance; biopsy tool deployed
          detail: Always-on camera maintains direct visualization; True Targeting updates lesion overlay continuously
        - id: n6
          label: Tissue sampling; ROSE cytology adequacy check (optional)
          detail: 'OTS biopsy tools: FNA needle, cryoprobe (best yield per USC study), forceps, or brush'
        - id: n7
          label: Scope retracted; single-use bronchoscope discarded; post-procedure monitoring
          detail: No reprocessing required; rapid room turnover; robotic arm cleaned and reused
      edges:
