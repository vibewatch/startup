      - number: '2.2'
        title: Epidemiological Demand Foundation
        blocks:
          - type: paragraph
            body: >-
              The demand signal for pulmonary nodule diagnostics is driven by two converging forces: the burden of lung
              cancer and the expanding but substantially under-utilized LDCT screening infrastructure. Lung cancer
              remains the leading cause of cancer death in the United States, accounting for an estimated 229,410 new
              cases and 124,990 deaths in 2026, representing 20% of all US cancer mortality. The five-year relative
              survival rate is 29.5%—a persistently poor outcome largely attributable to late-stage diagnosis, since
              early-stage detection carries survival rates exceeding 60%. The broader determinant of downstream
              procedural volume is pulmonary nodule detection: approximately 1.6 million nodules are identified annually
              through chest CT imaging in the United States, detected incidentally in roughly 30% of all chest CTs
              ordered for other indications. This incidental detection rate has accelerated with the proliferation of CT
              use for pulmonary embolism, cardiovascular assessment, and trauma, creating a growing backlog of nodules
              requiring risk stratification and, in a subset, tissue sampling. Against this demand backdrop, the 2021
              USPSTF guideline expansion—reducing the eligibility threshold from age 55–80 and 30 pack-years to age
              50–80 and 20 pack-years—almost doubled the eligible screening population to approximately 14.1 million US
              adults. Despite this, only about 18% of those eligible are currently being screened, representing a
              substantial structural gap. This low uptake is attributed to limited provider awareness, patient stigma
              around tobacco use, fragmented referral pathways, and lack of shared decision-making capacity in primary
              care. The implication for the robotic bronchoscopy market is dual: the screening gap constrains the
              pipeline of CT-detected nodules that would ordinarily funnel into diagnostic biopsy, but it also
              represents an enormous latent demand pool whose activation—through improved screening programs, AI-driven
              nodule tracking, and patient navigation—would materially expand the addressable procedure volume.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
