companyProfile:
  summary: >-
    Noah Medical is a privately held medical-robotics company founded in approximately 2018 by Jian Zhang (former
    employee #2 at Auris Health, acquired by Johnson & Johnson for $5.7 billion, and previously at Intuitive Surgical)
    and headquartered in San Carlos, California. Its sole commercial product, the Galaxy System, is an FDA-cleared
    (510(k) K223144, March 2023) robotic-assisted bronchoscopy platform featuring proprietary TiLT+ Technology —
    integrated digital tomosynthesis combined with augmented fluoroscopy and a single-use disposable bronchoscope — that
    allows real-time imaging of peripheral lung nodules without requiring a CBCT scanner. As of April 2026 the Galaxy
    System has been used in more than 10,000 clinical procedures globally across 50+ installed systems. Noah Medical
    confirmed a $150M Series B in April 2023 led by SoftBank Vision Fund; third-party databases (Premier Alternatives /
    PitchBook) report an additional $230M round in September 2025 bringing total capital to approximately $516.8M and
    post-money valuation to ~$2.0B, neither of which Noah Medical has confirmed publicly. Revenue, margin, and all other
    financial operating metrics remain entirely undisclosed.
