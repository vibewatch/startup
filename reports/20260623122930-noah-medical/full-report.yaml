      - number: '8.4'
        title: Private Comparable Context and Exit Benchmarks
        blocks:
          - type: paragraph
            body: >
              Among private surgical robotics peers, CMR Surgical is the most directly comparable by stage and capital
              profile: it raised $200M+ in a round led by Trinity Capital in 2025 (after a $2.7B valuation in its 2021
              Series D), has deployed 200+ Versius systems globally, achieved FDA De Novo authorization for
              cholecystectomy in October 2024, and has raised over $1B in total — positioning it as the best-funded
              private soft-tissue surgical robotics peer. CMR's $2.7B 2021 mark and subsequent undisclosed 2025 raise
              illustrate the private mark persistence phenomenon: once a premium valuation is established in a credible
              round, it tends to persist absent a formal re-pricing event. Distalmotion ($390M total raised, $150M
              Series G in November 2025) represents a more nascent robotic surgery peer targeting ambulatory surgery
              centers. At the M&A level, medtech deal value reached $80B in 2025 per Bain's 2026 Global M&A Report — up
              from $68B in 2024 and $39B in 2023 — with the second half of 2025 particularly strong. Stryker's $4.9B
              acquisition of Inari Medical illustrates the premium paid for category-specific commercial leaders. The
              Bain 2026 report specifically notes that "softer valuations will heighten competition for high-quality
              assets" in 2026, meaning qualified assets like Noah Medical (if revenue and margin profile is confirmed)
              could attract premium strategic interest in the current environment. Shenzhen Edge Medical raised $154M in
              a January 2026 HKEX IPO for surgical robotics, indicating ongoing international capital availability for
              commercialised platforms. The surgical robotics IPO window is cautiously open in 2026 per
              healthcare.digital analysis, with CMR Surgical actively exploring a potential NASDAQ dual-listing.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV044
              - CV045
      - number: '8.5'
        title: Strategic Value Drivers and M&A Plausibility
        blocks:
          - type: paragraph
            body: >
              Noah Medical's strategic value rests on four pillars: (1) a proprietary real-time imaging technology
              (TiLT+) that enables 96.7% diagnostic yield in peripheral lung nodule biopsy without mandatory CBCT
              infrastructure, directly addressing the community-hospital access gap that Ion and Monarch require
              adjunctive imaging to bridge; (2) FDA 510(k) clearance (K223144, March 2023) with a documented procedure
              safety profile; (3) rapid clinical adoption — 10,000+ procedures as of April 2026, 50+ installed systems —
              providing a growing recurring disposable revenue stream; and (4) strategic investor backing from SoftBank
              Vision Fund, Prosperity7 (Saudi Aramco), Tiger Global, Hillhouse, and Sequoia China, whose combined
              imprimatur provides international commercial optionality. The Tier-1 clinical framing — "enabling
              diagnoses previously infeasible" — that Noah Medical articulated in its April 2026 deep-dive research
              series is consistent with the investor narrative that commands premium multiples in medtech M&A. As of
              June 2026, no acquisition or merger rumors involving Noah Medical and any named strategic buyer (Stryker,
              J&J, Intuitive, Medtronic, Olympus) have been confirmed or credibly reported. However, the strategic logic
              is clear: J&J already operates Monarch and is executing on the Polyphonic AI ecosystem; Intuitive competes
              directly via Ion; and Medtronic, Olympus, and Stryker each have bronchoscopy, robotic surgery, or
              pulmonology adjacencies. Galaxy's community-hospital reach — the one dimension where Ion and Monarch are
              weakest — creates a genuine acqui-hire and installed-base rationale. The M&A discount for Noah Medical's
              stage (single-product, concentrated in US bronchoscopy, two open recalls) means any strategic offer would
              likely price relative to confirmed revenue, not reported valuation.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
      - number: '8.6'
        title: Preference Stack, Dilution, and Disclosure Caveats
        blocks:
          - type: paragraph
            body: >
              Noah Medical has not publicly disclosed its capitalisation table, liquidation preference structure,
              anti-dilution provisions, investor pro-rata rights, board composition, option pool size, or any debt
              obligations. These omissions are standard for a private company with no public reporting obligation, but
              they are material blind spots for any investor attempting to underwrite fair value or downside scenarios.
              SoftBank Vision Fund rounds historically include participating preferred structures with 1x–2x liquidation
              preferences; if such terms apply to the Series B, common equity (and later-round preferred) holders face
              meaningful preference overhang in downside scenarios. The late-stage medtech financing environment in
              2024–2025 was challenging: approximately two-thirds of Series C and later rounds priced flat or down per
              industry data, with investor protections (ratchets, anti-dilution clauses, PIK dividends) becoming more
              common. Noah Medical appears to have avoided a documented down round between April 2023 and September
              2025, but the absence of official confirmation of the $230M round means even this positive signal is
              unverifiable. The IPO bar for medtech robotics companies in 2026 requires $40–60M run-rate revenue and
              60–80% gross margins per healthcare.digital analysis; Noah Medical has disclosed neither figure. Without
              data-room access, the analyst cannot model a credible enterprise-value waterfall, dilution scenario, or
              return distribution. All valuation figures in this chapter should therefore be understood as indicative
              marks rather than underwritten fair values. Material gap: the cap table, preference stack, and any debt
              instruments are the single highest-priority diligence items before any investment decision.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
      - number: '8.7'
        title: Bull/Base/Bear Scenarios and Investment Recommendation
        blocks:
          - type: paragraph
            body: >
              The bull case assumes Noah Medical achieves category leadership in robotic bronchoscopy — reaching 200+
              installed systems and $300–500M in revenue by 2028–2030 — maintains premium margins (60–70% gross margin
              consistent with capital-plus-consumables robotic medtech), and exits via strategic M&A at 8–12x revenue or
              via IPO at ISRG-comparable multiples. Under this scenario, enterprise value of $3B–$6B is plausible,
              representing 1.5x–3x the reported 2025 mark. The base case assumes Galaxy builds to 80–100 systems,
              generates revenue of $100–$200M, achieves reimbursement stability post-TPT, and is acquired by a strategic
              buyer or completes a Series C round sustaining the $2.0B mark; dilution-adjusted returns would depend
              heavily on preference structure. The bear case is anchored to three concurrent risks: TPT reimbursement
              expiration in late 2026 suppresses hospital purchasing, competitive displacement by J&J Monarch QUEST or
              ISRG Ion accelerates, and the company's recall history creates regulatory burden. Under bear-case
              assumptions, a flat or down round at $0.5B–$1.0B, or a distressed strategic sale below the last reported
              mark, is plausible. The base recommendation is: research more before underwriting. The $2.0B valuation is
              conditionally supported — within the range of comparables for a well-backed late-stage medtech robotics
              company at this stage of commercialisation — but cannot be independently verified or discounted without
              confirmed revenue, margin, burn, preference stack, and cap table. The highest-priority triggers that would
              change this stance positively are: (1) official confirmation of the September 2025 round with round terms;
              (2) confirmed revenue ≥$150M at ≥65% gross margin; (3) TPT extension or dedicated CPT code passage.
              Negative triggers: reimbursement deterioration, a down round or flat round below $2.0B, additional FDA
              recalls, or clinical data replication failures.
