      - number: '5.5'
        title: FDA Clearance, Post-Market Safety Record, and Device Recall
        blocks:
          - type: paragraph
            body: >
              The Galaxy System received FDA 510(k) clearance (K223144) on March 1, 2023 under device classification
              874.4680 (Bronchoscope, Flexible or Rigid), product code EOQ, with a determination of Substantial
              Equivalence (SESE) as a Class II device with special controls. The application was received October 4,
              2022, reviewed as a Traditional 510(k), and was not reviewed by a third party. Per the GUDID database, the
              Galaxy System (GAL-001, UDI-DI 00850048825048) is MR Safe, labeled for prescription use only, and
              single-use by design.


              Post-market safety: The FDA MAUDE database contains reports of adverse events following Galaxy System
              procedures. A February 2024 event (MDR key 18699853) involved a patient who experienced bilateral
              pneumothoraces, cardiac arrest, hemorrhage, pneumonia, and septic shock during a Galaxy-assisted
              bronchoscopy; the investigation concluded the adverse event resulted from use error — the physician
              dismissed six scope-buckling workflow-inhibitor error messages without performing the IFU-required
              fluoroscopy verification before continuing scope advancement, resulting in a kinked scope. The patient
              subsequently died; the attending physician attributed death to septic shock secondary to pneumonia from
              pre-existing conditions rather than device malfunction. An August 2024 event (MDR key 20730618) reported a
              post-procedural pneumothorax requiring chest tube, attributed to anatomical factors (airway tortuosity and
              catheter stability) rather than device malfunction.


              Class 2 Device Recall (Z-0693-2025): On October 25, 2024, Noah Medical initiated a Class 2 recall (posted
              December 18, 2024) of 26 Galaxy System units due to a power supply design issue. The recall reason: the
              uninterruptable power supply may have a defective component capable of causing power supply short circuit
              or protective circuit breaker trips, resulting in sudden, unrecoverable power loss; if during a procedure,
              this could require manual scope removal with risk of lung injury or pneumothorax. The FDA determined cause
              as Device Design. The recall was classified Open as of the December 18, 2024 posting; resolution status as
              of June 2026 is not publicly confirmed.
