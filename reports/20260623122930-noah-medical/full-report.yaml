      - number: '4.7'
        title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >
              Noah Medical's financial profile presents a compelling capital formation story anchored by a confirmed
              $150M SoftBank-led round, plausible evidence of a later capital infusion that would bring total raised to
              ~$516M, and a revenue model (capital + recurring disposables) that—if implemented with Ion-level economics
              as a comparator—could support attractive gross margins on disposables at scale. The 5,000+ procedure
              milestone reached by March 2025, the CHEST 2025 evidence of positive procedure economics in community
              hospitals, and the Intuitive Ion's 51% procedure growth in FY2025 all suggest that the robotic
              bronchoscopy market is real and growing. However, Noah Medical's revenue quality, margin trajectory, and
              capital adequacy cannot be assessed from public information. The delta between a theoretical high-margin
              disposables business (if volume scales) and the current cash burn from a sub-scale manufacturing ramp,
              multi-site clinical support, and national commercial expansion represents the core financial underwriting
              gap. The reimbursement environment introduces additional optionality risk: procedure economics are
              positive in current Medicare fee-for-service settings, but any payer-driven coverage restriction or
              capital-budget freeze would slow placement and utilization growth. A formal diligence engagement must
              prioritize: (1) audited or management-prepared revenue and gross margin statements by segment (capital vs.
              disposable vs. service); (2) full funding chronology including pre-B rounds and any 2025 financing; (3)
              monthly burn rate and projected runway; (4) cap table, preference stack, and board composition; (5)
              customer contract terms including pricing and reorder commitments; and (6) manufacturing COGS and
              quality-system audit readiness. Without these, a financially founded investment decision cannot be made.
            claimRefs:
