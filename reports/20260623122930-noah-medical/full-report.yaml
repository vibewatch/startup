  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Noah Medical's business model follows the medtech razor-and-blades pattern: hospitals purchase the Galaxy
              System capital platform, then purchase a single-use disposable bronchoscope for every procedure. The
              company has explicitly described itself as selling a capital system plus single-use disposables for
              peripheral lung-nodule biopsy. This architecture creates two distinct revenue streams: an upfront capital
              sale and a recurring disposable revenue stream that scales with installed base and procedure utilization.
              A third stream—service and maintenance contracts—is standard in robotic medtech but has not been
              separately disclosed by Noah Medical. There is also a potential accessories line for procedure components
              (guide sheaths, needles, and other single-use tools used alongside the bronchoscope), though the company
              has not described a distinct accessories SKU. Noah Medical has not publicly disclosed the list price of
              the Galaxy System, the price of the single-use bronchoscope, or any realized pricing data. Competitive
              context provides useful benchmarks: Intuitive Surgical's Ion endoluminal system is reported in procurement
              sources at roughly $600,000–$750,000 per system, and Intuitive's overall instruments and accessories
              segment generated approximately $6.02 billion in 2025 on 3.15 million da Vinci procedures—a
              recurring-revenue ratio that illustrates the financial leverage of the model at scale. A Johns Hopkins
              University prospective observational study published in Respiration (2026) measured single-use flexible
              bronchoscope cost at $300–$400 per unit, while reusable bronchoscope per-use cost ran $198–$202 in the
              same unit; robotic-compatible proprietary disposables would logically price at or above the commodity
              disposable range. The Beyond the Scope community-hospital study presented at CHEST 2025 reported
              cost-benefit ratios of 1.5 (endoscopy suite) and 1.1 (operating room), indicating financial viability at
              current procedure volumes even in non-academic sites, but does not disclose the company's revenue or
              margin on those procedures.
