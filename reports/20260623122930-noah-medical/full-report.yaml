      - number: '4.5'
        title: Reimbursement Dynamics and Procedure Economics
        blocks:
          - type: paragraph
            body: >
              The commercial viability of the Galaxy System depends not only on Noah Medical's pricing and margin
              structure, but on the hospital's ability to bill and collect for robotic-assisted bronchoscopy procedures.
              Under current Medicare OPPS, bronchoscopy with biopsy (CPT 31625) carries a hospital outpatient facility
              payment of approximately $1,724 (national average, 2025 rates), while physician payment under the Medicare
              Physician Fee Schedule runs approximately $334. These rates apply to the procedure itself regardless of
              whether a conventional or robotic platform is used, meaning the hospital must absorb the cost of the
              Galaxy System and its single-use disposable within this reimbursement envelope. At $300–$400 per
              disposable bronchoscope (per the Johns Hopkins 2026 study benchmark), hospitals must generate sufficient
              procedure volume and margin from the broader lung-cancer-diagnosis workflow to justify the Galaxy capital
              investment and per-procedure consumable cost. The CHEST 2025 Beyond the Scope study's reported CBR of 1.5
              in the endoscopy suite specifically addresses this question, suggesting the Galaxy procedure generates
              positive net value for community hospitals even at current Medicare-level reimbursements. However, the CMS
              regulatory environment introduces material risk: FDA clearance does not guarantee CMS coverage. CMS
              repealed its MCIT program in 2021 and introduced the Transitional Coverage for Emerging Technologies
              (TCET) pathway in June 2023; the gap between device authorization and payer coverage can materially delay
              volume ramp. The RQM+ analysis of medtech reimbursement dynamics explicitly notes that FDA approval does
              not equal reimbursement, and that generating the real-world evidence CMS requires takes years. Hospital
              capital-budget constraints are a separate but related barrier: robotic-surgery adoption requires not just
              positive procedure economics but capital committee approval against competing hospital priorities, and
              health system capital budgets remain tight post-pandemic. CMS TCET finalization in August 2024 provides a
              partial on-ramp for breakthrough devices, but coverage timelines remain uncertain for any platform seeking
              incremental payment recognition.
            claimRefs:
              - CI032
              - CI033
              - CI034
              - CI035
              - CI036
              - CI037
      - number: '4.6'
        title: Financial Disclosure Gaps and Evidence Limitations
        blocks:
          - type: paragraph
            body: >
              Noah Medical's status as a private company means that the standard financial metrics required to
              underwrite an investment are almost entirely unavailable through public sources. The following metrics are
              explicitly undisclosed as of the run date: revenue (any period), annual recurring revenue or ARR, gross
              margin (system or disposable), EBITDA or net income, cash on hand, monthly burn rate, runway, customer
              count, installed base by site, average procedure utilization per installed system, COGS per unit (capital
              or disposable), customer acquisition cost, sales cycle length, reorder rates, and the preference stack and
              liquidation waterfall on existing equity. Valuation is also not confirmed by the company: the
              post-Series-B valuation is entirely undisclosed, and the third-party-reported $2.0B post-money figure
              (premieralts.com / PitchBook) is consistent with the reported $230M round but has not been officially
              confirmed. Additionally, the third-party Getlatka revenue estimate ($139.3M ARR) must be disregarded as
              unreliable given demonstrated factual errors in the same record. Conflicting third-party valuations
              ($417.9M from Getlatka vs. ~$2.0B from Premier Alternatives) illustrate the data quality problem for
              private-company financial analysis: neither figure can be relied upon without direct company confirmation.
              The inability to verify total capital raised (the $230M round is unconfirmed), burn rate, runway, or
              margin means that capital adequacy—a central diligence question for a growth-stage medtech company that
              will need continued investment in manufacturing, commercial expansion, and R&D—cannot be assessed from
              public information alone. These are not unusual gaps for a Series B/late-stage private medtech, but they
              are complete gaps rather than thin disclosures, and they collectively represent the primary blocker to
              forming a founded financial opinion without direct company engagement.
