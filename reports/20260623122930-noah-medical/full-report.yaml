      - number: '8.8'
        title: Exhibits
        blocks:
          - type: callout
            title: $2.0B Valuation Is Unconfirmed — Do Not Anchor Without Official Confirmation
            body: >
              The $2.0B post-money valuation reported for Noah Medical is sourced entirely from Premier Alternatives
              (citing PitchBook) and Tracxn. Noah Medical has issued no press release, no SEC Form D filing, and no
              official investor communication confirming the September 2025 $230M round or the $2.0B mark. The analyst
              has been unable to locate official documentation through June 23, 2026. Any investment decision based on
              this valuation must require official confirmation as a pre-condition. The conflicting $417.9M figure from
              Latka, while considered low-confidence, is a warning flag about data-source reliability. Investors should
              treat the $2.0B as an indicative range anchor, not an audited or confirmed fair value.
            calloutType: insight
            claimRefs:
              - CV002
              - CV004
              - CV006
          - type: callout
            title: TPT Reimbursement Expiry End 2026 — Near-Term Material Catalyst
            body: >
              CMS Transitional Pass-Through (TPT) supplemental payments for robotic bronchoscopy (HCPCS code C1601) are
              scheduled to expire at end of calendar year 2026. Multiple reimbursement specialists and clinical journals
              have flagged that the expiration — absent a successor payment mechanism — will remove a meaningful
              incremental payment that has supported hospital purchasing decisions. If hospitals defer or cancel Galaxy
              System acquisitions pending reimbursement clarity, the procedure-ramp trajectory underlying the base-case
              valuation would be materially impaired. This catalyst is proximate (H2 2026), observable, and adversely
              correlated with the $2.0B mark. It is the single most actionable near-term monitoring item.
            calloutType: risk
            claimRefs:
              - CV039
              - CV046
