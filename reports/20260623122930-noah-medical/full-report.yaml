      - number: '3.6'
        title: Commercial Dynamics, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              Hospital switching costs in robotic bronchoscopy are high and structurally favor incumbents. Robotic
              bronchoscopy systems require proprietary instruments and disposables, 5–10 year service contracts,
              extensive staff credentialing, and procedural room reconfiguration. A hospital that has trained its
              interventional pulmonology team on one platform faces retraining costs, credentialing timelines, and
              stranded inventory if it moves to a competitor. Intuitive Surgical compounds this with cross-platform
              dependencies: Ion customers who also operate da Vinci systems benefit from consolidated training programs
              and service relationships, increasing the integration penalty for switching any single platform.


              Intuitive's scale advantage manifests in procedure economics and data assets. Ion's 39% Q1 2026 procedure
              growth trajectory is generating outcomes data, operator experience, and service-revenue density that
              smaller-installed-base competitors cannot match near-term. J&J's Polyphonic ecosystem investment positions
              Monarch as an enterprise platform within hospital systems that standardize on J&J surgical technologies
              across multiple specialties—a distribution advantage that is difficult for a pure-play bronchoscopy
              company like Noah Medical to replicate.


              The most significant structural constraint on all platforms is reimbursement: robotic bronchoscopy is
              reimbursed under the same CPT codes as conventional navigational bronchoscopy (CPT 31627), with no
              incremental premium for robotic guidance. This caps hospital revenue per procedure regardless of platform
              cost and places the economic justification on secondary benefits (reduced repeat biopsies, downstream
              oncology revenue, patient throughput). A 2024 Baylor College of Medicine analysis found that robotic
              surgery programs typically face lower insurance reimbursement per procedure despite significantly higher
              platform and procedure costs, and that programs require at least 120 procedures/year for financial
              sustainability—a volume threshold that excludes most community hospitals in the near term. This adverse
              economic reality constrains all RAB competitors equally but disproportionately affects newer entrants
              seeking to displace established programs with existing amortized capital.


              Noah Medical's single-use scope strategy lowers sterilization overhead but raises per-case disposable
              cost, creating a different cost structure from Ion. The commercial implication is that Galaxy's total cost
              of ownership relative to Ion and Monarch remains a key diligence ask for hospital procurement teams.
