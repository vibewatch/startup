      - number: '8.3'
        title: Public Comparable Set and Market Multiples
        blocks:
          - type: paragraph
            body: >
              The closest publicly traded comparable company is Intuitive Surgical (ISRG), which operates the Ion
              robotic bronchoscopy platform directly competing with the Galaxy System. As of June 23, 2026, ISRG trades
              with a market cap of approximately $142B, EV/Revenue of approximately 13x (trailing), and a PS ratio of
              13.4x on full-year 2025 revenue of approximately $10.07B — the company grew revenue 21% in 2025 and
              expects 13–15% procedure volume growth in 2026. The Ion platform specifically placed 52 new systems in Q1
              2026, bringing its installed base to 1,041 with 39% YoY procedure growth. ISRG's EV/Revenue and PS
              multiples are appropriate only as a ceiling benchmark for a fully scaled, highly profitable incumbent;
              private-stage comparisons must apply a meaningful illiquidity and stage discount (typically 30–60% for
              VC-backed companies versus publicly traded peers). Medtronic, a diversified large-cap medtech with a
              surgical robotics asset (Hugo, FDA-cleared December 2025 for urologic procedures), trades at approximately
              3.3x forward P/S — reflecting the large-cap diversification discount rather than a pure surgical robotics
              comp. The robotic bronchoscopy market itself was approximately $64.7M globally in 2024, projected to reach
              $234M by 2031 at a 22% CAGR, suggesting Noah Medical's addressable sub-market is relatively small at
              current scale. At the broader surgical robotics level, the market grows from $8.28B in 2025 to an
              estimated $16.4B by 2032 (10.25% CAGR), providing long-term tailwind context. These public comps suggest
              that a $2.0B valuation for Noah Medical is not inherently unreasonable for a company with demonstrated
              category leadership, strong clinical proof, and a differentiated platform in a growing market — but it
              requires revenue in the $150M+ range at ISRG-comparable margins to be technically supportable at
              public-market multiples.
