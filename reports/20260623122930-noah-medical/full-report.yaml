      - number: '5.4'
        title: Clinical Evidence — FRONTIER, MATCH, MATCH 2, and Real-World Learning Curve
        blocks:
          - type: paragraph
            body: >
              Four peer-reviewed or substantively published datasets characterize Galaxy System clinical performance as
              of June 2026:


              FRONTIER (first-in-human, Macquarie University Hospital, Sydney; published Respirology June 2024, doi
              10.1111/resp.14778): 18 patients, 19 nodules, mean lesion size 20 mm, mean distance from pleura 11.6 mm.
              Results: 100% successful navigation, 100% tool-in-lesion confirmation, strict diagnostic yield 89.5%,
              intermediate yield 94.7%, diagnostic accuracy 94.7%, sensitivity 94.4%, specificity 100%. Two
              pneumothoraces (one requiring chest drain). Conducted by interventional pulmonologists with limited prior
              robotic experience, supporting replicability in centers new to robotic bronchoscopy.


              MATCH (initial study, pre-commercial data): 100% navigation and diagnostic yield, 95% (19/20)
              TiLT-confirmed TIL, 5% (1/20) tool-touching-lesion, verified by CBCT.


              MATCH 2 (prospective bicentric, Inova Fairfax and CHI Memorial, November 2024–August 2025; Respiratory
              Medicine March 2026; NCT06685133): 31 patients, mean lesion size 16.99 mm (±6.2 mm), 13% bronchus sign,
              31% pleural-based. Results: 100% procedural success, 97% TIL by TiLT+ (30/31), 96.7% concordance between
              TiLT+ and CBCT (29/30), 93.5% CBCT-confirmed TIL overall (29/31), 96.7% strict diagnostic yield (20
              malignant + 10 specific benign), 3% pneumothorax (1/31). Mean procedure time 46 minutes, mean TiLT+
              radiation dose 59.1 mGy.


              Learning Curve Study (USC Keck Hospital, Feb 2024–Feb 2025; Journal of Thoracic Disease, 2025):
              Real-world, non-sponsored, academic training program. 91 patients, 94 nodules, median lesion size 2.1 cm.
              Overall strict diagnostic yield 68%; pneumothorax 13% (all requiring chest tube); one self-limited massive
              hemoptysis. Yield improved from 61% in first six months to 75% in subsequent six months. Trainee
              involvement and complex anatomy identified as contributing factors; comparable to TARGET trial Monarch
              benchmark (61.6%). Cryoprobe showed superior yield.


              Beyond the Scope (community hospital, 70 consecutive cases, 18 months; CHEST 2025): 89% strict diagnostic
              yield. Key predictors of yield: localization in ≥2 augmented-fluoroscopy planes (p<0.001) and direct tool
              adjustments with peripheral visualization (p=0.01). Cost-benefit ratio 1.5 (endoscopy suite) and 1.1 (OR)
              — both financially viable (>1).
