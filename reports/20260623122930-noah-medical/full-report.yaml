      - number: '4.4'
        title: Capital Intensity, Manufacturing, and Commercialization Costs
        blocks:
          - type: paragraph
            body: >
              Noah Medical operates in one of medtech's most capital-intensive categories: robotic platforms that
              integrate precision electromechanical hardware, proprietary imaging algorithms, and single-use consumables
              manufactured under strict quality and sterilization requirements. Industry data for Class II medical
              device development (the Galaxy System's regulatory class) places total development-to-market costs at
              $2M–$30M, with manufacturing scale-up consuming an estimated 15–25% of total development budget and
              commercialization (sales force, KOL programs, training, clinical support) consuming a further 10–20%. For
              robotic bronchoscopy platforms—which require specialized capital manufacturing infrastructure,
              direct-to-physician sales and training, field clinical support at each installation, and ongoing clinical
              evidence generation—these cost categories are likely at the upper end of the range. Intuitive Surgical's
              Ion placed 195 systems in 2025 and grew Ion procedures 51% year-over-year, but also represented roughly
              $1.3B in R&D and significant service infrastructure at the parent-company level. The global medtech VC
              environment reinforced capital concentration: Q1 2025 saw $3.7 billion deployed across 117 deals, with
              capital concentrated in 13 rounds exceeding $100 million and investors explicitly favoring companies with
              commercial traction, clinical validation, and clear regulatory pathways—exactly the profile Noah Medical
              has been building. Nevertheless, 2024 medtech late-stage funding data showed two-thirds of Series C and
              later rounds securing flat or down valuations, signaling that late-stage capital is harder and more
              dilutive even for well-positioned companies. For a company at Noah Medical's stage—commercially launched,
              past 5,000 cumulative procedures, with active clinical evidence generation and expanding field
              infrastructure—a monthly cash burn estimate of $5–10M is directionally consistent with its disclosed
              headcount (~300+ employees by late 2025 per third-party estimates) and the operational requirements of
              robotic medtech, though this is an industry-informed estimate rather than disclosed data. At $5–10M per
              month, the $150M Series B provided approximately 15–30 months of runway from April 2023 through
              mid-to-late 2025, which is temporally consistent with the reported September 2025 later-stage round.
