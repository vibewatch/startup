      - number: '3.2'
        title: Intuitive Surgical Ion — Primary Incumbent and Scale Leader
        blocks:
          - type: paragraph
            body: >
              Intuitive Surgical's Ion is the market-share leader in robotic bronchoscopy by installed base, with 1,041
              systems globally as of Q1 2026 (up 22% YoY). Ion procedure volume grew 39% YoY in Q1 2026 to approximately
              43,000 procedures, making it the fastest-growing segment within Intuitive's portfolio in that quarter.
              Mayo Clinic data cited on the Q1 2026 earnings call showed a 79% diagnostic yield and 85% sensitivity for
              malignancy, bolstering Intuitive's clinical narrative in hospital procurement discussions.


              Ion's core technical differentiator is its proprietary shape-sensing fiber, which provides continuous
              real-time location feedback along the full catheter length without electromagnetic navigation and thus
              avoids the interference issues and registration errors that affect EMN-based systems like Monarch and
              Galaxy. The system uses a 3.5mm OD articulating catheter with a 1.8mm removable vision probe; the probe
              must be withdrawn before biopsy tools are inserted, precluding direct visualization at the sampling
              moment. Confirmation imaging (radial EBUS, fluoroscopy, or CBCT via Siemens NaviLink 3D or GE OEC
              integration) is therefore operationally important for Ion-based programs.


              Intuitive's competitive moat extends well beyond the bronchoscopy catheter: Ion benefits from the da Vinci
              brand's established hospital relationships, ISRG's training infrastructure and service network covering
              over 11,000 da Vinci systems globally, and the My Intuitive+ digital platform that creates cross-platform
              data integration. Rapid On-Site Evaluation (ROSE) for cytology adequacy is under development for Ion,
              which would address one remaining workflow gap. Ion's pricing (~$1.0–1.1M capital plus proprietary
              instruments) and ISRG's service contracts create high switching costs for any installed customer.
            claimRefs:
              - CP002
              - CP004
