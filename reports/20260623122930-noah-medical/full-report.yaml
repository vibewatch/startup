      - number: '7.4'
        title: Competition, Channel, and Market Position Risks
        blocks:
          - type: paragraph
            body: >
              Intuitive Surgical's Ion platform is the primary competitive threat to Galaxy market share growth. As of
              Q1 2026, Ion's installed base reached 1,041 systems (22% YoY growth), Q1 2026 Ion procedures grew 39% YoY,
              and full-year 2025 Ion procedures reached approximately 144,100 (51% growth). Intuitive posted Q1 2026
              revenue of $2.77 billion (+23% YoY) and ended Q1 2026 with $7.98 billion in cash and investments—a
              financial position Noah Medical cannot approach. Intuitive's scale enables sustained investment in
              clinical evidence generation, sales force deployment, pricing flexibility, and value-based contracting
              with hospital systems. Each quarter Intuitive places 40–52 new Ion systems; at this pace, the Ion
              installed base doubles approximately every 3–4 years with an ever-larger recurring disposable revenue base
              that can fund further R&D and commercial expansion.


              J&J MedTech's Monarch platform, supported by J&J's full legal, regulatory, and financial resources,
              represents a second entrenched competitor. J&J filed and prosecuted a multi-year trade secret lawsuit
              against Noah Medical (2022–2025)—an action that simultaneously pressured Noah's management team, consumed
              legal resources, and served as a competitive intelligence exercise. The dismissal with prejudice in March
              2025 resolved the litigation but does not prevent future IP challenges on different grounds or by
              different J&J subsidiaries. Medtronic's ILLUMISITE and Olympus robotic platforms add further competition
              for hospital bronchoscopy suite capital budgets.


              Galaxy has no published head-to-head randomized trial against Ion or Monarch. All published Galaxy data
              uses single-arm designs, which are vulnerable to sponsor bias, patient-selection effects, and
              non-standardized outcomes definitions. Payers evaluating coverage criteria for robotic bronchoscopy
              generally require head-to-head evidence against the standard of care or an established comparator, and the
              absence of such data delays broad commercial payer acceptance. The competitive timing risk is material: if
              Intuitive Ion achieves a dominant position—hospital relationship lock-in, disposables contract bundling,
              and deep KOL entrenchment—before Galaxy reaches scale, the cost of winning share becomes prohibitive.
              Galaxy's TiLT+ imaging differentiation is real but not irreplaceable: Intuitive has announced continued
              Ion platform development, and the competitor platforms are investing in confirmation imaging capabilities
              (Monarch QUEST, cleared March 2025 with GE OEC 3D integration).
