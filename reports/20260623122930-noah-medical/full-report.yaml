    type: dag
    layout: standard
    summary: >-
      Directed acyclic graph mapping primary risk sources (top) through transmission pathways to downstream impacts on
      revenue, competitive position, financing, and valuation. Demonstrates the interconnected nature of device safety,
      reimbursement, and competitive risks for a single-product medtech startup.
    data:
      nodes:
        - id: r1
          label: FDA device recall / adverse event
          detail: 4 Class 2 recalls (2024–2025); 1 MAUDE death event; 2 recalls Open as of June 2026
        - id: r2
          label: Reimbursement / CPT gap
          detail: No unique robotic CPT code; no confirmed TCET nomination; CMS -2.5% fee adjustment 2026
        - id: r3
          label: Competitive scale disadvantage
          detail: 'Ion: 1,041 installed systems, 144K 2025 procedures, $7.98B cash; Galaxy installed base undisclosed'
        - id: r4
          label: Clinical evidence limitations
          detail: 68% real-world yield; 13% pneumothorax; no head-to-head RCT vs. Ion
        - id: r5
          label: Hospital capex pressure
          detail: 40% execs cutting/deferring capex 2026; tariffs +15% hospital costs; thin operating margins
        - id: r6
          label: Financing uncertainty
          detail: $150M confirmed; $230M unconfirmed; burn $5–10M/month; runway risk by late 2026 absent new capital
        - id: r7
          label: Hospital adoption slowdown
          detail: Fewer Galaxy placements per quarter; lower procedure volume; disposable revenue below plan
        - id: r8
          label: Revenue ramp underperformance
          detail: Delayed breakeven; capital consumed by commercial costs with insufficient disposable contribution
        - id: r9
          label: Valuation compression / down round
          detail: Reduced ability to raise at $2B implied valuation; preference waterfall risk in flat/down round
        - id: r10
          label: Thesis-break scenario
