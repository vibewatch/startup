      - number: '5.7'
        title: Technical Constraints, Evidence Limitations, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Several technical constraints and evidence limitations are material to assessing Galaxy System product
              risk in 2026:


              Electromagnetic navigation dependency: The Galaxy System uses EMN for pre-biopsy navigation, which is
              subject to metallic interference and registration errors from EM field distortions in the procedural
              environment. TiLT+ corrects for anatomy drift post-navigation, but EMN accuracy for initial path-following
              degrades in high-ferrous environments. Competing shape-sensing systems (Intuitive Ion) avoid this class of
              error entirely.


              CT-to-body divergence correction window: TiLT+ corrects anatomy drift only after the scope has been
              navigated to within 2–3 cm of the target by EMN. If the initial EMN path alignment fails in tortuous
              airways — for example because the correct segmental airway is not accessible — the operator may not
              achieve a viable starting position for the TiLT+ sweep, making the technology's key advantage unreachable.


              Radiation exposure: The TiLT+ sweep delivers a mean dose of 59.1 mGy per MATCH 2. This is lower than a
              full CBCT acquisition but is incremental above standard fluoroscopy. In high-volume bronchoscopy programs,
              cumulative staff and patient radiation exposure from TiLT+ requires tracking per institutional radiation
              safety protocols; the MATCH 2 paper does not disclose staff dosimetry data.


              Narrow and non-comparative evidence base: All controlled trials explicitly excluded ground-glass nodules
              (GGOs), which represent a material and growing share of lung cancer screening detections. The MATCH 2 and
              FRONTIER studies are small single-arm cohorts (n=31 and n=19). No randomized controlled trial comparing
              Galaxy against Ion or Monarch has been published as of June 2026. The only independent real-world academic
              study (USC JTD, 2025) showed materially worse outcomes than controlled trials: 68% yield and 13%
              pneumothorax.


              C-arm dependency and capital requirement: The Galaxy System requires a standard C-arm fluoroscopy unit for
              every TiLT+ sweep; this C-arm is not proprietary but must be available in the procedural room. Centers
              without a mobile C-arm in the bronchoscopy suite face an additional capital or scheduling dependency.


              Scope buckling user-error risk: The most severe MAUDE event was caused by repeated dismissal of
              scope-buckling workflow inhibitor warnings without fluoroscopy verification. The system provides clear
              on-screen warnings and IFU guidance; the incident was attributed to use error, but the failure pathway
              requires robust operator training to mitigate. The recently granted anti-buckling patent (US12635860, May
              2026) signals active engineering mitigation.


              Power supply recall: The October 2024 Class 2 recall of 26 Galaxy System units for power supply design
              issues represents a post-market design quality event. The failure mode — unrecoverable power loss during a
              bronchoscopy procedure requiring manual scope removal — carries pneumothorax risk. Recall resolution as of
              run date is not publicly confirmed.
            claimRefs:
              - CE050
              - CE051
              - CE052
              - CE053
