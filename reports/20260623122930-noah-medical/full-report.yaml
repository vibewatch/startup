            title: TiLT+ Embedded Imaging Eliminates CBCT Infrastructure Dependency
            body: >-
              The 96.7% CBCT concordance in MATCH 2 is the single most defensible technical claim: it empirically
              supports the thesis that TiLT+ delivers CBCT-equivalent tool-in-lesion confirmation from standard
              fluoroscopy equipment, directly expanding the addressable market to community hospitals that cannot
              justify dedicated CBCT investment.
