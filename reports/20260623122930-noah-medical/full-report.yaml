            title: Four Class 2 Recalls in 26 Months — Device Quality Pattern Risk
            body: >-
              Noah Medical has issued four Class 2 recalls for Galaxy System components between March 2024 and November
              2025, covering the platform (power supply design), the disposable bronchoscope (biopsy channel geometry),
              the wired controller (calibration), and the IFU (document access). Two recalls remain Open as of June
              2026. For a platform with a limited deployed install base, this frequency signals design maturity
              challenges. The pattern may attract enhanced FDA post-market scrutiny, increase the probability of a 483
              observation or Warning Letter, and undermine hospital procurement confidence. Until all open recalls are
              closed and a root-cause-closed quality review is available, device quality risk should be rated high.
