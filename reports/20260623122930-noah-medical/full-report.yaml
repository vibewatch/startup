        - Manual bronchoscopist annotation of CT path
        - Automated 3D path planning from DICOM CT; 0.8–1 mm slice protocol required
        - Standardized reproducible path; supports multi-operator consistency
        - Requires dedicated CT protocol; non-standard slices degrade navigation accuracy
      - - Navigation to peripheral lesion
        - Manual bronchoscope advancement with fluoroscopy or EM navigation
        - EMN-guided robotic scope advancement with real-time position display vs. pre-op CT
