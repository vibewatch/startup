      - number: '5.2'
        title: 'TiLT+ Technology: Digital Tomosynthesis, Augmented Fluoroscopy, and Tool-in-Lesion Confirmation'
        blocks:
          - type: paragraph
            body: >
              TiLT+ (Tool-in-Lesion Technology) is the primary technical differentiator of the Galaxy System and is
              described by VP of Engineering John Shen as "the big differentiator." TiLT+ solves the CT-to-body
              divergence problem — the systematic mismatch between the pre-procedural CT scan anatomy used for
              navigation planning and the patient's actual intraprocedural anatomy, which shifts due to breathing,
              positioning, and tissue deformation. Existing electromagnetic navigation systems rely solely on the pre-op
              CT registration without a mechanism to update the target position in real time; TiLT+ fills this gap.


              The TiLT+ imaging subsystem works as follows: after the robotic scope navigates to within approximately
              2–3 cm of the target lesion using EMN guidance, the operator isocenters a standard C-arm fluoroscopy unit
              at the lesion site in three planes (AP, 30° RAO, 30° LAO). With the patient held at an inspiratory
              breath-hold, the C-arm sweeps from 30° LAO to 30° RAO, acquiring a series of 2D X-ray frames from multiple
              angles over a narrow arc (typically 15–60°, in contrast to a full 360° CT rotation). Noah Medical's
              proprietary image-processing algorithms — incorporating AI and machine-learning techniques — reconstruct a
              3D tomosynthesis image from this 2D stack, localize the lesion in three dimensions, and update the
              navigation target to match the patient's actual intraprocedural anatomy. A TiLT board — a pattern of metal
              reference beads placed under the patient — provides spatial reference for 3D reconstruction from 2D
              imaging.


              The reconstructed target is then displayed on augmented fluoroscopy as a graphical overlay atop the live
              C-arm image, showing both the updated lesion position and the biopsy tool tip position in real time. A
              proprietary StrikePoint feature quantifies the distance between the tool tip and the lesion center,
              providing a numeric measure of tool-in-lesion confirmation. True Targeting updates the lesion overlay
              continuously as the operator advances the biopsy tool.


              The MATCH 2 prospective bicentric study (Respiratory Medicine, March 2026, PMID 41620189) validated TiLT+
              imaging against cone-beam CT (CBCT) ground truth in 31 patients: TiLT+ demonstrated tool-in-lesion in 30
              of 31 nodules (96.7%), CBCT subsequently confirmed TIL in 29 of those 30 (concordance 96.7%), and strict
              diagnostic yield was 96.7%. Mean TiLT+ sweep radiation dose was 59.1 mGy. The FRONTIER first-in-human
              study reported 100% tool-in-lesion confirmation across 19 nodules with strict diagnostic yield 89.5–94.7%.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
