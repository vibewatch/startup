              US12285162 (granted April 29, 2025): Robotic endoluminal suturing instrument with toggle-based needle
              rotation, indicating a therapeutic roadmap beyond diagnostic bronchoscopy.

              US12035881 (granted July 16, 2024): Tip velocity control for articulating flexible endoscopes.

              US12611092 (granted April 28, 2026): Configurable endoscope bending section enabling stiffness/flexibility
              tradeoff adjustment.

              US12635860 (granted May 26, 2026): Anti-buckling device for surgical systems — directly addressing the
