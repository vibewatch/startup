- id: financial-diligence-gaps
  title: Financial Disclosure Gaps and Evidence Limitations
  body: 'Noah Medical''s status as a private company means that the standard financial metrics required to underwrite an investment
    are almost entirely unavailable through public sources. The following metrics are explicitly undisclosed as of the run
    date: revenue (any period), annual recurring revenue or ARR, gross margin (system or disposable), EBITDA or net income,
    cash on hand, monthly burn rate, runway, customer count, installed base by site, average procedure utilization per installed
    system, COGS per unit (capital or disposable), customer acquisition cost, sales cycle length, reorder rates, and the preference
    stack and liquidation waterfall on existing equity. Valuation is also not confirmed by the company: the post-Series-B
    valuation is entirely undisclosed, and the third-party-reported $2.0B post-money figure (premieralts.com / PitchBook)
    is consistent with the reported $230M round but has not been officially confirmed. Additionally, the third-party Getlatka
    revenue estimate ($139.3M ARR) must be disregarded as unreliable given demonstrated factual errors in the same record.
    Conflicting third-party valuations ($417.9M from Getlatka vs. ~$2.0B from Premier Alternatives) illustrate the data quality
    problem for private-company financial analysis: neither figure can be relied upon without direct company confirmation.
    The inability to verify total capital raised (the $230M round is unconfirmed), burn rate, runway, or margin means that
    capital adequacy—a central diligence question for a growth-stage medtech company that will need continued investment in
    manufacturing, commercial expansion, and R&D—cannot be assessed from public information alone. These are not unusual gaps
    for a Series B/late-stage private medtech, but they are complete gaps rather than thin disclosures, and they collectively
    represent the primary blocker to forming a founded financial opinion without direct company engagement.

    '
