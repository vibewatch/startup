  - Value / Status
  - Confidence
  - Why It Matters
  - Diligence Ask
  rows:
  - - Galaxy System ASP (capital)
    - Undisclosed
    - Low — no company disclosure; competitor Ion $600K–$750K as benchmark
    - Drives capital revenue per placement; determines payback and margin contribution
    - Request list and realized ASP by deal type and geography
  - - Galaxy System COGS (hardware)
    - Undisclosed
    - 'Low — industry norm for Class II robotic medtech: manufacturing scale-up 15–25% of dev budget'
    - Key input to gross margin on capital segment; usually lower margin than disposables early in ramp
    - Request COGS breakdown per system unit by current manufacturing volume
  - - Gross margin on capital equipment
    - Undisclosed
    - Low — early-stage robotic medtech typically 40–65% gross margin on capital pre-scale
    - Determines profitability of system sales; varies with volume and supply-chain maturity
    - Request segment gross margin on capital equipment
  - - Disposable bronchoscope ASP
    - Undisclosed; market benchmark $300–$400/unit
    - Low to medium — benchmark from Johns Hopkins 2026 study; Galaxy proprietary pricing undisclosed
    - Recurring per-procedure revenue; key long-term revenue driver as installed base scales
    - Request list and realized ASP per disposable unit and bundle configuration
  - - Gross margin on disposable bronchoscope
    - Undisclosed; Intuitive Surgical instruments segment ~65–75% as comparator
    - Low — analogical from Intuitive; not confirmed for Galaxy at current scale
    - High-margin disposables are the financial engine of the razor-and-blades model at scale
    - Request disposable gross margin by manufacturing volume tier
  - - Procedures per installed system per year
    - 'Undisclosed; public evidence: 5,000+ cumulative US procedures by March 2025 across an unknown number of installed systems'
    - Low — installed base undisclosed; utilization rate cannot be computed
    - Drives disposable revenue per system; key utilization efficiency metric
    - Request installed system count and average annual procedures per system
  - - Customer (hospital) acquisition cost
    - Undisclosed
    - Low — no proxies available; enterprise robotic medtech CAC can range $50K–$250K+ per account
    - Indicates capital sales efficiency and payback period on commercial investment
    - Request CAC by deal type; compare to lifetime disposable value per account
  - - Revenue per installed system per year (LTV proxy)
    - 'Undisclosed; theoretical: disposable ASP × procedures/year/system + service contract'
    - Low — neither input disclosed; theoretical model only
    - Central LTV-to-CAC ratio for underwriting commercial sustainability
    - Build bottom-up model using disclosed and requested inputs above
  notes: 'All eight metrics are either undisclosed by Noah Medical or derivable only from analogues and industry benchmarks.
    The absence of installed-base count makes it impossible to compute utilization rates even from the publicly disclosed
    5,000-procedure milestone.

