  - - Disposable bronchoscope (single-use)
    - Per-procedure consumable; price per unit sold to hospital
    - Undisclosed; commodity bronchoscope benchmark $300–$400/unit; robotic-specific premium plausible
    - Low to medium — peer study (Johns Hopkins 2026) establishes market comparable; Galaxy price undisclosed
