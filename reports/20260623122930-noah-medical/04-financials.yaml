chapter:
  number: 4
  title: Financials
  summary: 'Noah Medical''s financial profile is anchored by a confirmed $150M Series B (April 2023, SoftBank Vision Fund-led),
    with third-party databases reporting a subsequent $230M Later Stage VC round in September 2025 that would bring total
    disclosed capital to approximately $516.8M and post-money valuation to ~$2.0B—neither confirmed by the company. Revenue
    is generated through a capital-equipment-plus-recurring-disposables model (Galaxy System platform + single-use bronchoscope
    per procedure); list pricing, gross margins, revenue, and burn are entirely undisclosed. A CHEST 2025 field study demonstrated
    cost-benefit ratios above 1.0 in community-hospital settings, validating the procedure-economics argument to hospitals,
    but the path from procedure economics to investor-underwritable unit economics remains opaque. Capital intensity is high:
    manufacturing, clinical-field support, and commercial scale-up for a robotic medtech platform of this type require sustained
    spend well in excess of single-year revenue. The primary financial diligence blockers are the absence of disclosed revenue,
    margins, burn, runway, cap table, and preference stack.

    '
sections:
- id: revenue-model-pricing
  title: Revenue Model and Pricing Architecture
  body: 'Noah Medical''s business model follows the medtech razor-and-blades pattern: hospitals purchase the Galaxy System
    capital platform, then purchase a single-use disposable bronchoscope for every procedure. The company has explicitly described
    itself as selling a capital system plus single-use disposables for peripheral lung-nodule biopsy. This architecture creates
    two distinct revenue streams: an upfront capital sale and a recurring disposable revenue stream that scales with installed
    base and procedure utilization. A third stream—service and maintenance contracts—is standard in robotic medtech but has
    not been separately disclosed by Noah Medical. There is also a potential accessories line for procedure components (guide
    sheaths, needles, and other single-use tools used alongside the bronchoscope), though the company has not described a
    distinct accessories SKU. Noah Medical has not publicly disclosed the list price of the Galaxy System, the price of the
    single-use bronchoscope, or any realized pricing data. Competitive context provides useful benchmarks: Intuitive Surgical''s
    Ion endoluminal system is reported in procurement sources at roughly $600,000–$750,000 per system, and Intuitive''s overall
    instruments and accessories segment generated approximately $6.02 billion in 2025 on 3.15 million da Vinci procedures—a
    recurring-revenue ratio that illustrates the financial leverage of the model at scale. A Johns Hopkins University prospective
    observational study published in Respiration (2026) measured single-use flexible bronchoscope cost at $300–$400 per unit,
    while reusable bronchoscope per-use cost ran $198–$202 in the same unit; robotic-compatible proprietary disposables would
    logically price at or above the commodity disposable range. The Beyond the Scope community-hospital study presented at
    CHEST 2025 reported cost-benefit ratios of 1.5 (endoscopy suite) and 1.1 (operating room), indicating financial viability
    at current procedure volumes even in non-academic sites, but does not disclose the company''s revenue or margin on those
    procedures.

    '
