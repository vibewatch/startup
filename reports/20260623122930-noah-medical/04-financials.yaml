  rows:
  - - Capital equipment (Galaxy System)
    - One-time sale or lease of robotic bronchoscopy console plus accessories kit at system install
    - Per system placed
    - Undisclosed; competitor Ion ~$600K–$750K per system (reported)
    - Lumpy, capital-budget-dependent; creates installed base for recurring revenue
    - Request system ASP, deal structure (purchase vs. lease), and mix of payment models
  - - Single-use disposable bronchoscope
    - Per-procedure sale of proprietary disposable bronchoscope required for every Galaxy procedure
    - Per procedure / per unit
    - Undisclosed; commodity benchmark $300–$400/unit; robotic-proprietary likely at premium
    - Recurring, high-margin potential at scale; constrained by procedure utilization per installed unit
    - Request disposable list price, realized ASP, gross margin, and reorder volumes by account
  - - Service and maintenance contracts
    - Annual service contracts covering hardware support, software updates, and field clinical support
    - Per system per year
    - Not separately disclosed; industry norm 8–12% of system ASP annually
    - Recurring, lower risk once installed; important for long-term margin contribution
    - Request service contract attach rate, pricing, and gross margin on service segment
  - - Accessories and ancillary consumables
    - Procedure-related accessories (guide sheaths, biopsy needles, procedure kits) sold per case alongside bronchoscope
    - Per case
    - Not separately disclosed by Noah Medical
    - Incremental per-case revenue; bundling with disposable bronchoscope is common practice
    - Confirm accessory SKU lineup, per-case bundle pricing, and margin contribution
  - - International / new indication expansion (future)
    - Galaxy system placements outside the US (Hong Kong, Australia) and potential new indication approvals for therapeutic
      bronchoscopy
    - Per country / per indication
    - Early-stage; first Asia use December 2023; not a current material revenue stream
    - Speculative at this stage; contingent on regulatory clearances and distribution partnerships
    - Request international revenue contribution (if any) and expansion roadmap with regulatory status
  notes: 'Revenue stream composition is inferred from public product descriptions and standard medtech capital-plus-consumables
    models; no revenue mix, dollar values, or contribution ratios are confirmed by Noah Medical. The installment count (5,000+
    US procedures as of March 2025) is the only publicly available utilization signal. enumerationScope covers the current
    and near-term disclosed streams only.

    '
