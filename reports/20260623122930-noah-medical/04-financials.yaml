    - Request service contract pricing, attach rate at installation, gross margin, and escalation clauses
  - - Hospital procedure economics (CBR)
    - Galaxy drives procedure reimbursement for hospital (CPT 31625); cost-benefit ratio reported in field study
    - 'CHEST 2025 Beyond the Scope: CBR 1.5 (endo suite), 1.1 (OR) in community hospital'
    - Medium — peer-presented field study; primary investigators disclosed no financial relationship with Noah Medical at
      time of study
