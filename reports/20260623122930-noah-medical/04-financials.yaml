- calloutType: risk
  title: Complete Absence of Revenue and Margin Disclosure
  body: 'Noah Medical has not disclosed any revenue, ARR, gross margin, COGS, or profitability metric. Conflicting third-party
    data (Getlatka $139.3M ARR with demonstrably incorrect CEO and funding data vs. no other credible revenue signal) means
    no financially defensible revenue estimate exists. The financial diligence process must begin with a formal management-provided
    financial package.

    '
  claimRefs:
  - CI038
  - CI039
  - CI040
- calloutType: risk
  title: Medtech Reimbursement Gap and Hospital Capital Budget Risk
  body: 'FDA clearance does not guarantee CMS or commercial insurer coverage for the Galaxy procedure. CMS''s TCET pathway
    provides a potential on-ramp but does not guarantee incremental payment. Hospital capital budgets remain constrained,
    and competing priorities may delay Galaxy placements even where clinical interest exists. These structural reimbursement
    and adoption dynamics represent the primary financial headwinds to procedure volume ramp and should be modeled as a downside
    scenario.

    '
  claimRefs:
  - CI034
  - CI035
  - CI036
  - CI037
