  evidenceGaps:
  - type: missing-data
    severity: critical
    topic: Revenue and financial metrics
    missingEvidence: Noah Medical has disclosed no revenue, ARR, gross margin, burn rate, or profitability data in any public
      source.
    whyItMatters: Without revenue data, the scale and quality of the business cannot be assessed; capital adequacy and runway
      are entirely estimated.
    diligencePath: Request audited financials or management-prepared financial statements (revenue by segment, gross margin,
      P&L) as first step in diligence engagement.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI012
    - QI018
  - type: missing-data
    severity: high
    topic: Installed base and utilization metrics
    missingEvidence: The number of Galaxy Systems installed at hospital sites is not publicly disclosed; per-system utilization
      cannot be calculated from the 5,000-procedure milestone alone.
    whyItMatters: Installed base and utilization determine the recurring disposable revenue run-rate, the most important long-term
      value driver of the business model.
    diligencePath: Request installed base count by geography and site type, average annual procedures per system, and reorder
      rate data.
    relatedQuestionRefs:
    - QI013
    - QI029
  - type: conflicting-estimates
    severity: high
    topic: Valuation and total capital raised
    missingEvidence: Third-party estimates for valuation range from $417.9M (Getlatka, unreliable source) to ~$2.0B (PitchBook
      / Premier Alternatives); neither figure is confirmed by Noah Medical. The reported $230M September 2025 round is also
      unconfirmed.
    whyItMatters: Without a confirmed valuation and capital structure, dilution, preference waterfall, and entry-price risk
      cannot be modeled.
    diligencePath: Request confirmation of any post-Series-B financing, fully diluted cap table, most recent 409A valuation,
      and complete preference stack from management.
