- id: FI001
  title: Revenue Model Bridge — How Galaxy System Activity Converts to Revenue and Gross Profit
  type: flow
  layout: compact
  summary: 'Illustrates the capital-equipment-plus-recurring-disposables revenue model: hospital capital purchase drives system
    placement, which enables per-procedure disposable consumption, which converts to recurring revenue. Service contracts
    add a third recurring stream. All dollar values are unknown; structure is derived from public product descriptions and
    medtech analogues.

    '
  data:
    nodes:
    - id: n1
      label: Hospital capital decision
      detail: Galaxy System purchase or lease (~$600K–$750K competitor benchmark; Galaxy ASP undisclosed)
    - id: n2
      label: System placement & training
      detail: Galaxy installed at hospital bronchoscopy suite; clinical training completed
    - id: n3
      label: Procedure utilization
      detail: Per-procedure consumption of single-use disposable bronchoscope (~$300–$400 commodity benchmark; Galaxy-specific
        price undisclosed)
    - id: n4
      label: Capital + Disposable revenue
      detail: Revenue = capital ASP (at placement) + disposable ASP × annual procedure volume
    - id: n5
      label: Service contract revenue
      detail: Annual service fee (~8–12% of capital ASP by industry norm; undisclosed by Noah Medical)
    - id: n6
      label: Gross profit (estimated)
      detail: Disposables gross margin ~65–75% at scale (Intuitive analogue); capital margin lower and ramp-dependent; service
        margin variable
    edges:
    - from: n1
      to: n2
      label: Placement decision → install
    - from: n2
      to: n3
      label: Installed system enables recurring procedure volume
    - from: n3
      to: n4
      label: Each procedure triggers disposable sale
    - from: n2
      to: n5
      label: Service contract attached at or after installation
    - from: n4
      to: n6
      label: Capital + disposable revenue less COGS
    - from: n5
      to: n6
      label: Service revenue less field service costs
  approximationNotes: 'All specific dollar values are derived from industry benchmarks and competitive analogues (Intuitive
    Ion system pricing, Johns Hopkins single-use bronchoscope study, Intuitive instruments gross margin). No Noah Medical
    pricing, COGS, or gross margin data is confirmed. This flow represents the structural model, not confirmed financial parameters.

