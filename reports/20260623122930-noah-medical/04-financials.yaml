- id: reimbursement-procedure-economics
  title: Reimbursement Dynamics and Procedure Economics
  body: 'The commercial viability of the Galaxy System depends not only on Noah Medical''s pricing and margin structure, but
    on the hospital''s ability to bill and collect for robotic-assisted bronchoscopy procedures. Under current Medicare OPPS,
    bronchoscopy with biopsy (CPT 31625) carries a hospital outpatient facility payment of approximately $1,724 (national
    average, 2025 rates), while physician payment under the Medicare Physician Fee Schedule runs approximately $334. These
    rates apply to the procedure itself regardless of whether a conventional or robotic platform is used, meaning the hospital
    must absorb the cost of the Galaxy System and its single-use disposable within this reimbursement envelope. At $300–$400
    per disposable bronchoscope (per the Johns Hopkins 2026 study benchmark), hospitals must generate sufficient procedure
    volume and margin from the broader lung-cancer-diagnosis workflow to justify the Galaxy capital investment and per-procedure
    consumable cost. The CHEST 2025 Beyond the Scope study''s reported CBR of 1.5 in the endoscopy suite specifically addresses
    this question, suggesting the Galaxy procedure generates positive net value for community hospitals even at current Medicare-level
    reimbursements. However, the CMS regulatory environment introduces material risk: FDA clearance does not guarantee CMS
    coverage. CMS repealed its MCIT program in 2021 and introduced the Transitional Coverage for Emerging Technologies (TCET)
    pathway in June 2023; the gap between device authorization and payer coverage can materially delay volume ramp. The RQM+
    analysis of medtech reimbursement dynamics explicitly notes that FDA approval does not equal reimbursement, and that generating
    the real-world evidence CMS requires takes years. Hospital capital-budget constraints are a separate but related barrier:
    robotic-surgery adoption requires not just positive procedure economics but capital committee approval against competing
    hospital priorities, and health system capital budgets remain tight post-pandemic. CMS TCET finalization in August 2024
    provides a partial on-ramp for breakthrough devices, but coverage timelines remain uncertain for any platform seeking
    incremental payment recognition.

    '
