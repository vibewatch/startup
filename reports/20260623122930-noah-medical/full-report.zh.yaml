      - number: '5.2'
        title: TiLT+ 技术：数字断层合成、增强透视和工具在病灶内确认
        blocks:
          - type: paragraph
            body: >
              TiLT+（Tool-in-Lesion Technology）是 Galaxy System 最核心的技术差异点，工程副总裁 John Shen 称其为「the big
              differentiator」。TiLT+ 解决的是 CT-to-body divergence 问题——导航规划所用的术前 CT
              解剖结构，与患者术中真实解剖之间存在系统性错配；呼吸、体位和组织变形都会造成偏移。现有电磁导航系统只依赖术前 CT 配准，没有实时更新目标位置的机制；TiLT+ 填上了这个缺口。


              TiLT+ 影像子系统的工作流程如下：机器人镜在 EMN 引导下导航到目标病灶约 2–3 cm 内之后，操作者把标准 C-arm 透视设备在病灶处三平面等中心定位（AP、30° RAO、30°
              LAO）。患者吸气屏气时，C-arm 从 30° LAO 扫到 30° RAO，在窄弧范围内从多个角度获取一系列 2D X 光帧（通常 15–60°，不同于完整 360° CT 旋转）。Noah Medical
              的专有图像处理算法——包含 AI 和机器学习技术——从这组 2D 图像重建 3D 断层合成影像，在三维空间定位病灶，并更新导航目标，使其匹配患者术中的真实解剖。TiLT
              板——置于患者身下的一组金属参考珠图案——为从 2D 影像重建 3D 提供空间参考。


              重建后的目标随后以图形叠加形式显示在增强透视的实时 C-arm 影像上，同时展示更新后的病灶位置和活检工具尖端位置。专有的 StrikePoint
              功能量化工具尖端与病灶中心之间的距离，给出工具在病灶内确认的数字指标。操作者推进活检工具时，True Targeting 会持续更新病灶叠加层。


              MATCH 2 前瞻性双中心研究（Respiratory Medicine，2026 年 3 月，PMID 41620189）用锥形束 CT（CBCT）ground truth 验证 TiLT+ 影像，在 31
              名患者中：TiLT+ 在 31 个结节中显示 30 个工具在病灶内（96.7%），CBCT 随后确认这 30 个中的 29 个 TIL（concordance 96.7%），严格诊断率为 96.7%。TiLT+
              平均扫描辐射剂量为 59.1 mGy。FRONTIER 首次人体研究报告，19 个结节 100% 完成工具在病灶内确认，严格诊断率为 89.5–94.7%。
            claimRefs:
