      - number: '7.2'
        title: 报销与覆盖风险
        blocks:
          - type: paragraph
            body: >
              Medicare 没有针对机器人支气管镜的专属 CPT 代码。Galaxy System 手术按现有传统支气管镜代码计费：31628（经支气管肺活检，单肺叶）作为主代码；使用电磁导航时，再加附加代码
              31627（计算机辅助导航组件）。没有增量机器人溢价，也就是说 Noah Medical 复杂的 TiLT+ 成像技术拿到的 CMS 报销，与手动引导手术相同。导航附加代码 31627 在 Physician
              Fee Schedule 下每例约报销 $70–$120，相比 Galaxy 平台运营成本，只带来边际提升。


              CMS 的 TCET（Transitional Coverage for Emerging Technologies）路径于 2024 年 8 月最终确定，并于 2025 年生效，为满足严格临床标准、且获 FDA
              Breakthrough Device designation 的器械提供加速全国 Medicare 覆盖。该路径每年最多接受 5 个候选项目。Noah Medical 尚未公开表示 Galaxy System
              已被提名或纳入 TCET；Galaxy 作为标准 Class II 器械而非 Breakthrough Device 的 510(k) 分类，若未重新指定，可能无法符合资格。即便符合资格，TCET 通常也要求
              Coverage with Evidence Development（CED）——商业化后继续收集数据——这会拉长覆盖不确定期并增加临床试验负担。


              CMS 在 2026 年 Physician Fee Schedule 中，对许多非按时间计费的医生服务实施 -2.5% 效率调整，进一步压缩单例报销。与此同时，AHA 2025 报告显示，2023 年
              Medicare 对医院每提供 1 美元护理仅报销 83 美分；进入 2026 年时，医院运营利润率仍结构性偏薄。这些因素会提高医院对每例 Galaxy
              手术一次性耗材成本的价格敏感度，可能拉长资本投资回本周期。商业保险对机器人支气管镜的覆盖在付款方和地区之间并不一致；每一个新账户都可能需要预授权流程、临床文件要求和付款方专项覆盖审查。RQM+
              医疗科技行业分析明确警告，监管批准并不保证市场成功：多款 FDA clearance 器械在获批后经历了多年报销不覆盖。若没有主动的付款方覆盖策略——全国覆盖决定或广泛 LCD——Galaxy System
              的收入潜力将受限于付款方结构有利、或机构成本中心能够吸收一次性耗材成本的医院。
