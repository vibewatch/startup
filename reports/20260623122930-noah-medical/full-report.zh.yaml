      - number: '6.4'
        title: 医院采购路径和培训采用模型
        blocks:
          - type: paragraph
            body: >-
              医院采购 Galaxy System 资本设备，遵循标准医院资本支出流程：医生
              champion（通常是领导肺结节项目的介入肺科医生）制定服务线商业案例，覆盖资本成本、预期单台手术贡献利润、报销经济性，以及相对第一代平台的竞争差异。该商业案例提交医院资本委员会；委员会可能按年度审批，也可能在超过阈值时单独审批。合同谈判、为系统准备兼容
              C-arm 的支气管镜室，以及培训，随后才进入首次使用。

              Noah Medical 的 FRONTIER 研究证明，「the system can be rapidly and successfully deployed after recommended
              training, even in areas with minimal robotic experience」，说明系统按设计具有较浅学习曲线。AABIP 2024 项目以「Tips and Tricks
              for Optimizing Yield in Peripheral Bronchoscopy」为主题安排多场 Galaxy 模拟培训，Noah Medical
              也通过互动模拟和会后活动在会议场景中培养医生能力。公司还提供报销支持资源（reimbursement@noahmed.com），帮助医院计费团队处理 CPT 编码。

              尽管 Noah Medical
              将系统定位为可快速采用，更广泛的机器人支气管镜文献显示，落地需要肺科、放射科、麻醉科和医院管理层跨学科协调；全身麻醉可及性也是结构性要求，会限制麻醉资源不足场景中的部署。上述障碍来自第三方临床评论者，而非公司来源；建模扩张到资源不那么充足的机构时，它们具有相关性。
