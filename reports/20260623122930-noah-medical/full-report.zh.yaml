      - number: '6.7'
        title: 集中度风险、未披露装机基数与采用障碍
        blocks:
          - type: paragraph
            body: >-
              客户章节最关键的缺口是，截至 2026 年 6 月，Noah Medical 未披露医院站点总数、活跃装机基数或客户数。公开证据至少点名了 7 个产生 Galaxy
              手术的不同临床站点，但几乎肯定低估了真实部署足迹——截至 2025 年 3 月美国 5,000+ 例手术，意味着部署已远不止 7 个公开确认名称。问题是，没有站点数披露，就无法独立评估客户集中度。如果
              5,000+ 累计手术中相当一部分来自少数高量 KOL 站点（UChicago、Inova Fairfax、CHI Memorial），装机基数可能比手术里程碑暗示的更浅。

              独立临床文献记录的采用障碍包括：（1）高额前期资本成本，Thorax BMJ
              发表的临床评论称其给机构带来「重大财务负担」；（2）需要全身麻醉资源，限制其在国有化医疗系统和资源受限场景中的部署；（3）需要肺病、麻醉和放射团队进行多学科人员协调。这些是行业范围约束，并非 Galaxy
              独有，但会塑造现实可触达医院范围。2026 年后 TPT C1601 支付到期，将移除一项增量经济补贴，可能拖慢新站点经济性。

              客户证据质量中最突出的负面点，是早期采用站点的利益冲突结构：Dr. Hogarth（University of Chicago）披露有付费咨询关系和股权权益；Dr. Bhadra（CHI Memorial）于
              2026 年 6 月转任公司顾问；Dr. Mahajan（Inova Fairfax）参与了由医生裁定、非同行评审的白皮书，并担任 MATCH 2
              PI。这些站点的临床数据是真实的，但独立性信号弱于保持距离的第三方评估。Frontiers Oncology 于 2025 年 3 月发表的机器人支气管镜演进综述完全没有提及 Galaxy，而是把分析中心放在
              Intuitive Surgical 的 ION 上——这说明相较 ION 平台，Galaxy 的学术文献足迹仍然有限。
