  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代方案与相邻领域
        blocks:
          - type: paragraph
            body: >-
              目标市场定义为用于肺结节和早期肺癌评估及组织取样的机器人与导航支气管镜，涵盖硬件平台（机器人腔内系统）、一次性支气管镜导管、术中成像附加设备（移动锥形束
              CT、高级透视）、活检工具耗材，以及支持形状感知导航的手术级软件。该范围有意排除用于初筛的独立 CT 扫描仪资本设备、无导航引导的传统柔性支气管镜、外科胸腔镜 / VATS
              活检、放疗设备，以及下游分子或液体活检检测。未纳入但会实质影响采用的相邻支出包括医院 EMR/PACS
              集成中间件、介入肺病套间改造，以及常被共同计费的纵隔分期工具（EBUS-TBNA）。直接争夺同一诊断适应证的现状替代方案，是 CT 引导经胸针吸活检（CTTB）——外周结节的主导既有方案，已发表诊断率为
              66–100%，但气胸率最高可达 25%——以及电磁导航支气管镜（ENB，主要为 Medtronic 的
              SuperDimension）。传统柔性支气管镜仍是中央气道病变的标准方案，在外周结节细分市场基本不构成竞争。外科楔形切除活检能提供确定性组织，但发病率、成本和住院床位消耗显著更高。弄清哪些支出被纳入，对市场规模测算至关重要：把
              ENB、EBUS 和诊断附件打包进宽泛「介入肺病器械」TAM 的分析师报告，得出的规模会比只统计专用机器人支气管镜平台的报告大十倍。
