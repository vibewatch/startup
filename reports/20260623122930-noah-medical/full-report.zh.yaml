              Noah Medical 没有披露任何收入、ARR、毛利率、COGS 或盈利能力指标。第三方数据互相冲突（Getlatka 称 ARR 为 $139.3M，但其 CEO
              和融资数据明显错误；此外没有其他可信收入信号），因此不存在财务上可辩护的收入估算。财务尽调必须从管理层正式提供的财务资料包开始。
