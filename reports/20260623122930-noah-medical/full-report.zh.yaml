      - number: '5.6'
        title: IP 组合、工程架构和开发者信号
        blocks:
          - type: paragraph
            body: >
              Noah Medical 持有不断扩张的美国专利组合，覆盖 Galaxy System 技术。Justia 专利转让记录（截至 2026 年 6 月）列出以下已授权专利：


              US12193640（2025 年 1 月 14 日授权）：使用 EM 传感器数据变换的机器人支气管镜导航自动配准方法；共同发明人包括创始人 Jian Zhang。

              US12350092（2025 年 7 月 8 日授权）：三重影像混合探针——把位置传感器、超声换能器和摄像头组合进可拆卸耦合的多模态感测探针，用于融合影像，暗示超出当前支气管镜设计的未来能力。

              US12285162（2025 年 4 月 29 日授权）：带 toggle 式针旋转的机器人腔内缝合器械，指向诊断性支气管镜之外的治疗路线图。

              US12035881（2024 年 7 月 16 日授权）：关节式柔性内镜的尖端速度控制。

              US12611092（2026 年 4 月 28 日授权）：可配置内镜弯曲段，可调节刚度 / 柔性取舍。

              US12635860（2026 年 5 月 26 日授权）：用于手术系统的防 buckling 装置——直接回应 2024 年 2 月 MAUDE 不良事件中记录的镜体 buckling 失效模式。


              工程架构结合专有和现成组件。根据工程副总裁 John Shen 发表的访谈，机器人臂是现成组件；镜体设计、机器人控制校准和 TiLT+ 算法构成核心专有 IP。TiLT+ 算法使用 AI 和机器学习技术，从 2D
              透视帧重建 3D 体积，并持续开发以提高重建质量和速度。


              开发者信号：Noah Medical 招聘页（2026 年 6 月）称拥有 150+ 名工程师，并在积极招聘软件工程师、算法工程师、机器人工程师、临床工程师和制造工程师。活跃 Greenhouse 岗位包括
              Sr. Clinical Engineer（Sunnyvale）以及偏制造的岗位，反映公司处于商业阶段扩张。没有公开 GitHub 仓库或开源软件贡献记录可归属于 Noah
              Medical——这对封闭架构、受监管医疗器械公司很典型。
