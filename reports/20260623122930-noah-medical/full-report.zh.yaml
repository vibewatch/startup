      - number: '2.4'
        title: 买方与支付方分层
        blocks:
          - type: paragraph
            body: >-
              医院是机器人支气管镜系统的主导买方和运营方。PW Consulting 估算，2025 年医院占终端用户市场份额
              79.6%，其余由日间手术中心和诊断实验室构成。在医院分层中，学术医学中心和大型三级转诊医院是明确的先行者。更高病例复杂度、可获得科研经费、介入肺病 fellows
              供给，以及对未验证技术经济性的容忍度，为早期资本投入创造了条件。社区医院服务美国大多数肺结节患者，但通常缺少受 fellowship 训练的介入肺病医生，面临完全不同的账。此类机构资本预算受限，$1–2
              million 的前置系统成本在现实手术量下意味着多年回本。MedCity News（2026 年 3 月）描述的新兴模式，是转向内镜套间：把机器人支气管镜从手术室移到成本更低的门诊场景，同时利用 APC
              复杂度调整（CPT 31628 + 31629 + 31653 打包）产生足以支撑资本支出的贡献毛利。支付方格局主要是 Medicare，因为肺结节评估患者明显偏向 60 岁以上 Medicare
              受益人。相关报销代码是 CPT 31627（导航支气管镜），2026 年 Q2 设施费率仅支付 $85。不过，该手术通常与 CPT 31628（支气管镜活检）在 APC 5153 下打包计费，每次就诊合计支付约
              $1,800–2,400。商业保险对机器人导航的政策差异很大，部分要求事先授权，制造行政摩擦，对社区项目影响尤其大。资本预算决策权在医院 CFO
              和服务线主任手中；介入肺病医生推动临床采购建议。这种双轨决策结构意味着销售周期长，且必须同时拿下临床和行政拥护者。
