      - number: '1.4'
        title: 里程碑、商业牵引与临床证据
        blocks:
          - type: paragraph
            body: >-
              Noah Medical 的里程碑曲线连贯且记录充分。公司 2022 年 3 月宣布新的研究、测试和培训设施后，于 2023 年 3 月 1 日获得 FDA 510(k) 批准（K223144），Galaxy
              System 被认定为实质等同的 II 类器械。随后，公司在悉尼 Macquarie University Hospital 完成 FRONTIER 研究中的首次人体使用，首席研究者为 Professor
              Alvin Ing（2023 年 3 月）；2023 年 4 月完成 Series B；2023 年 5 月在 University of Chicago Medicine 由 Dr. Kyle Hogarth
              完成美国首批商业病例，最初四名患者均于当天出院。国际扩张随后推进，2023 年 12 月在香港 Prince of Wales Hospital 完成亚洲首例使用。采用速度随后从 CHI Memorial 的第
              500 例美国手术（2024 年 1 月）加速，到 Long Island Jewish Medical Center 超过 5,000 例美国手术（2025 年 3 月）。CHEST 2025
              上临床证据进一步加深：MATCH 2 研究（31 名患者）报告 96.7% 严格诊断率，社区医院 Beyond the Scope 研究报告 89% 诊断率；MATCH 2 随后于 2026 年 3
              月发表于同行评议期刊 Respiratory Medicine。更早的 MATCH 研究报告了 100% 导航和诊断率，以及 95% 病灶内工具准确率。
