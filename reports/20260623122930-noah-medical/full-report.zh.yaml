      - number: '8.3'
        title: 公开可比公司与市场倍数
        blocks:
          - type: paragraph
            body: >
              最接近的上市可比公司是 Intuitive Surgical（ISRG），其 Ion 机器人支气管镜平台直接与 Galaxy System 竞争。截至 2026 年 6 月 23 日，ISRG 市值约
              $142B，EV/Revenue 约 13x（TTM），基于 2025 全年约 $10.07B 收入的 PS ratio 为 13.4x——公司 2025 年收入增长 21%，预计 2026 年手术量增长
              13–15%。Ion 平台在 2026 年 Q1 新增 52 套系统，装机基数达到 1,041，手术量同比增长 39%。ISRG 的 EV/Revenue 和 PS
              倍数只适合作为一个完全规模化、高盈利龙头的上限基准；私营阶段比较必须加入显著的流动性和阶段折价（VC 支持公司相对上市同行通常折价 30–60%）。Medtronic 是拥有手术机器人资产（Hugo，2025 年
              12 月获得 FDA clearance，用于泌尿手术）的多元化大型医疗科技公司，forward P/S 约 3.3x——反映的是大盘多元化折价，而非纯手术机器人可比。机器人支气管镜市场本身 2024 年全球约
              $64.7M，预计到 2031 年达 $234M，CAGR 为 22%，说明 Noah Medical 当前规模下的可触达子市场相对较小。更广义的手术机器人市场从 2025 年 $8.28B 增至 2032
              年预计 $16.4B（CAGR 10.25%），提供长期顺风背景。这些公开可比公司表明，对一个拥有已验证品类领导力、强临床证明、并在增长市场中具备差异化平台的公司而言，Noah Medical 的 $2.0B
              估值并非天然不合理——但若要在公开市场倍数下技术上站得住脚，需要 $150M+ 收入及接近 ISRG 的利润率。
