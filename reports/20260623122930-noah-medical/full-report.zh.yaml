      - number: '7.8'
        title: 图表与证据
        blocks:
          - type: callout
            title: 26 个月四起 Class 2 召回——器械质量模式风险
            body: >-
              2024 年 3 月至 2025 年 11 月，Noah Medical 对 Galaxy System 组件发起四起 Class 2
              召回，涉及平台（电源设计）、一次性支气管镜（活检通道几何）、有线控制器（校准）和 IFU（文件访问）。截至 2026 年 6 月，两起召回仍为
              Open。对于一个部署装机基数有限的平台，这一频率指向设计成熟度挑战。该模式可能引来更强的 FDA 上市后审查，增加 483 observation 或 Warning Letter
              概率，并削弱医院采购信心。在所有未关闭召回完成、且可获得根因闭环质量审查前，器械质量风险应评为高。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR040
          - type: callout
            title: 真实世界临床表现与赞助研究存在差距
            body: >-
              USC Keck Hospital 学习曲线研究（JTD 2025，n=91，非赞助）是唯一独立真实世界 Galaxy 数据集，显示首年严格诊断率 68%、气胸率 13%——明显低于 MATCH
              2（赞助，n=31）的 96.7% 诊断率和 3% 气胸率。Intuitive Ion 真实世界数据在高量中心显示 91%
              诊断率和接近零气胸。这个证据缺口是最重要的临床风险：评估覆盖的付款方、评估采购的医院和评估患者转诊路径的临床医生，都会同时看到两组数据。在完成大型、多中心、非赞助研究，或与 Ion 的头对头 RCT
              前，临床证据风险仍未解决。
            calloutType: risk
            claimRefs:
              - CR014
              - CR015
              - CR016
