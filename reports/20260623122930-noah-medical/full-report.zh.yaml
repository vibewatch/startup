      - number: '7.4'
        title: 竞争、渠道与市场位置风险
        blocks:
          - type: paragraph
            body: >
              Intuitive Surgical 的 Ion 平台是 Galaxy 市占增长的首要竞争威胁。截至 2026 年 Q1，Ion 装机基数达到 1,041 台（同比增长 22%），2026 年 Q1 Ion
              手术量同比增长 39%，2025 全年 Ion 手术量约 144,100 例（增长 51%）。Intuitive 2026 年 Q1 收入为 $2.77B（同比 +23%），期末持有现金和投资
              $7.98B——Noah Medical 无法接近这种财务位置。Intuitive 的规模允许其持续投入临床证据生成、销售队伍部署、价格弹性，以及与医院系统的价值型合约。Intuitive 每季度新增 40–52
              套 Ion 系统；按这个节奏，Ion 装机基数约每 3–4 年翻倍，且不断扩大的经常性一次性耗材收入基数可继续资助研发和商业扩张。


              J&J MedTech 的 Monarch 平台由 J&J 完整的法律、监管和财务资源支持，是第二个已深度扎根的竞争者。J&J 曾对 Noah Medical
              发起并推进多年商业秘密诉讼（2022–2025），这一行动同时压迫 Noah 管理团队、消耗法律资源，也发挥了竞争情报作用。2025 年 3 月有偏见撤诉解决了该诉讼，但并不阻止未来基于不同理由或由不同 J&J
              子公司发起 IP 挑战。Medtronic 的 ILLUMISITE 和 Olympus 机器人平台，也会进一步争夺医院支气管镜室资本预算。


              Galaxy 没有发表过与 Ion 或 Monarch 的头对头随机试验。所有已发表 Galaxy
              数据均采用单臂设计，容易受到赞助方偏差、患者选择效应和非标准化结局定义影响。付款方评估机器人支气管镜覆盖标准时，通常要求与标准治疗或既有比较对象进行头对头证据比较；缺少这类数据会拖慢商业付款方的广泛接受。竞争时点风险很实质：如果
              Intuitive Ion 在 Galaxy 形成规模前取得主导地位——锁定医院关系、捆绑一次性耗材合同、深度扎根 KOL——Galaxy 赢回份额的成本会高到难以承受。Galaxy 的 TiLT+
              成像差异化真实存在，但并非不可替代：Intuitive 已宣布持续开发 Ion 平台，竞争平台也在投入确认成像能力（Monarch QUEST，2025 年 3 月获 clearance，并整合 GE OEC
              3D）。
