chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与 Galaxy 产品
        blocks:
          - type: paragraph
            body: >-
              Noah Medical 是一家位于硅谷加州 San Carlos 的非上市医疗机器人公司；其总部地址（1501 Industrial Rd）已在核心产品的 FDA 510(k)
              记录中得到独立确认。私人数据库显示公司约 2018 年成立，但 Noah Medical
              未公开确认准确注册日期。公司宣称的使命，是借助创新腔内技术交付可被临床采纳的解决方案，提升全球患者生活质量；落到具体场景，就是更早、更准确地诊断肺癌。Galaxy System
              是公司首个也是唯一商业化产品，一套机器人辅助（导航式）支气管镜平台，用于在诊断和治疗过程中提供患者气道的支气管镜可视化和通路。Galaxy System 将自研 TiLT+
              Technology、集成数字断层合成和增强透视、常开的一次性支气管镜以及紧凑占地整合在一起；公司将其定位为唯一配备一次性镜体的导航支气管镜系统，也是其首款商业机器人系统。商业模式围绕销售 Galaxy
              资本设备和用于外周肺结节活检的一次性耗材展开。
