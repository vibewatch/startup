  - id: TE003
    title: Galaxy System——技术与运行架构表
    columns:
      - 层级 / 流程 / 组件
      - 作用
      - 关键依赖
      - 技术风险
    rows:
      - - 术前 CT 导入和 3D 规划软件
        - 解析 DICOM，创建支气管树模型，生成到靶点的导航路径
        - 医院 PACS/DICOM 基础设施；CT 扫描协议合规（0.8–1 mm 层厚）
        - 非标准 CT 层厚削弱路径规划；新医院安装时 PACS 集成复杂
      - - 电磁导航（EMN）场系统
        - 将 EM 传感器读数与 CT 派生气道图比对，实时定位镜体尖端
        - 患者下方 EMN 板；EMN 兼容手术台；低干扰环境
        - 金属设备导致 EM 场畸变，进而产生配准误差；shape-sensing 系统（Ion）不存在这一问题
      - - TiLT+ 重建算法（AI / 图像处理）
        - 从 2D C-arm 透视帧重建 3D 病灶位置；校正 CT-to-body 偏差；更新导航靶点
        - 可完成 60° 弧形扫描的标准 C-arm；患者屏气；患者下方 TiLT 参考板
        - 核心专有 IP；上市后软件算法变更受 510(k) 变更控制约束；弧形扫描不足或患者移动会削弱重建质量
      - - 增强透视显示
        - 在实时 C-arm 画面上以图形标注叠加病灶和工具尖端位置；给出 StrikePoint 数字化 TIL 距离
        - TiLT+ 重建必须先成功；需要接入 C-arm 实时画面
        - TiLT+ 失败时，操作者只能依赖 EMN 或无辅助透视；没有术中 3D 成像后备方案
      - - 机器人镜体弯曲和尖端速度控制
        - 将医生控制器输入转化为支气管镜四向弯曲；尖端速度算法（US12035881）管理插入 / 回撤动态
        - 现成机器人臂硬件；专有控制校准软件；一次性支气管镜（GALB-001）
        - 迂曲气道中的镜体屈曲是主要术中机械风险；用户处理镜体屈曲警告的错误促成了 MAUDE 致死事件
      - - 电源和不间断电源系统（UPS）
        - 手术中为机器人、影像和导航子系统持续供电
        - 市电或内置电池；UPS 组件质量
        - Class 2 召回 Z-0693-2025：26 台设备中存在缺陷 UPS 组件，可能导致术中不可恢复断电，需要手动取出镜体，并带来气胸风险
    notes: 架构来自已发表操作描述、工程副总裁访谈（MedicalDesignandOutsourcing 2023）、JTD 学习曲线论文（2025）、GUDID 设备描述，以及 FDA 召回 / MAUDE 记录。
