      - number: '4.2'
        title: 融资历史和资本结构
        blocks:
          - type: paragraph
            body: >
              Noah Medical 最扎实可验证的融资里程碑，是 2023 年 4 月 19 日完成、超额认购的 $150M Series B。该轮由 SoftBank Vision Fund 领投，Prosperity7
              Ventures（隶属 Saudi Aramco）共同领投；财团还包括 Tiger Global、Hillhouse、Sequoia China、Shangbay Capital、Uphonest
              Capital、Sunmed Capital、Lyfe Capital、1955 Capital、AME Cloud Ventures 以及未披露的战略投资者，公司新闻稿和独立交易报道相互印证。Series B
              的官方用途，是满足 Galaxy System 日益上升的需求，并加速面向患者诊断和治疗的无创平台研发。Series B 之外，B 轮前历史——意味着公司约 2018 年成立到 2023 年 3 月获得 FDA
              批准之间应有种子轮和 Series A 支撑——Noah Medical 没有公开细节。第三方私营公司数据库（Premier Alternatives 引用 PitchBook）报告，2025 年 9 月还有一笔
              $230M Later Stage VC 融资；若属实，已披露融资总额将达到约 $516.8M，投后估值约 $2.0B，对应资本效率比约 3.87x（估值除以总融资额）。Noah Medical
              没有发布新闻稿或官方声明确认这笔后续融资；缺少官方确认，意味着这些数字只能视为「被报道但未确认」。作为私营公司，Noah Medical 没有披露股权结构、清算优先权层级、董事会构成、投资者 pro-rata
              权利或反稀释条款——这些都是承销估值和下行情景必不可少的输入。公司没有公开证券申报义务，因此结构性披露完全取决于正式数据室流程中与管理层或投资人的直接接触。Company Overview（第 1
              章）建立了融资时间线的主要叙事锚点；本章为财务用途单独生成自身 claims，不复制前文 claim ID。
