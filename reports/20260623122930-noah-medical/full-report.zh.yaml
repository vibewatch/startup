      - number: '8.4'
        title: 私营可比背景与退出基准
        blocks:
          - type: paragraph
            body: >
              在私营手术机器人同行中，CMR Surgical 按阶段和资本画像最可比：其 2025 年获得 Trinity Capital 领投的 $200M+ 融资（此前 2021 年 Series D 估值为
              $2.7B），全球部署 200+ 套 Versius 系统，2024 年 10 月获得胆囊切除 FDA De Novo 授权，并累计融资超过 $1B，是资金最充足的私营软组织手术机器人同行。CMR 2021 年
              $2.7B 标记和随后未披露的 2025 年融资，说明私营估值标记的延续性：一旦在可信轮次中确立高溢价估值，除非发生正式重定价事件，否则往往会延续。Distalmotion（累计融资 $390M，2025 年
              11 月 $150M Series G）代表更早期的机器人手术同行，瞄准门诊手术中心。M&A 层面，Bain 2026 Global M&A Report 显示，2025 年医疗科技交易额达到 $80B，高于
              2024 年 $68B 和 2023 年 $39B，且 2025 下半年尤其强劲。Stryker 以 $4.9B 收购 Inari Medical，说明品类型商业化领导者可获得溢价。Bain 2026
              报告特别指出，2026 年「更温和估值将加剧对高质量资产的竞争」，意味着 Noah Medical 这类合格资产（如果收入和利润率画像得到确认）在当前环境下可能吸引战略买家的溢价兴趣。Shenzhen Edge
              Medical 2026 年 1 月 HKEX IPO 融资 $154M，表明商业化平台仍可获得国际资本。healthcare.digital 分析称，2026 年手术机器人 IPO 窗口谨慎打开，CMR
              Surgical 正积极探索潜在 NASDAQ 双重上市。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV044
              - CV045
      - number: '8.5'
        title: 战略价值驱动因素与 M&A 可能性
        blocks:
          - type: paragraph
            body: >
              Noah Medical 的战略价值建立在四根支柱上：（1）专有实时成像技术 TiLT+，在不强制配置 CBCT 基础设施的情况下，使外周肺结节活检达到 96.7% 诊断率，直接回应 Ion 和 Monarch
              需要借助辅助成像才能跨过的社区医院可及性缺口；（2）FDA 510(k) clearance（K223144，2023 年 3 月）及有记录的手术安全画像；（3）快速临床采用——截至 2026 年 4 月
              10,000+ 例手术、50+ 套装机，带来不断增长的经常性一次性耗材收入流；（4）SoftBank Vision Fund、Prosperity7（Saudi Aramco）、Tiger
              Global、Hillhouse 和 Sequoia China 等战略投资者背书，合力赋予国际商业化可选性。Noah Medical 在 2026 年 4 月深度研究系列中提出的 Tier-1
              临床叙事——「让过去不可行的诊断成为可能」——与医疗科技 M&A 中获得高倍数的投资者叙事一致。截至 2026 年 6 月，没有任何涉及 Noah Medical
              与具名战略买家（Stryker、J&J、Intuitive、Medtronic、Olympus）的收购或合并传闻得到确认或可信报道。但战略逻辑清晰：J&J 已运营 Monarch，并推进 Polyphonic
              AI 生态；Intuitive 通过 Ion 直接竞争；Medtronic、Olympus 和 Stryker 各自拥有支气管镜、机器人手术或肺病学邻近业务。Galaxy 的社区医院触达——Ion 和
              Monarch 最弱的一维——形成真实的 acqui-hire 和装机基数收购逻辑。Noah Medical 所处阶段的 M&A
              折价（单产品、集中于美国支气管镜、两起未关闭召回）意味着任何战略报价都可能相对确认收入定价，而不是相对报道估值定价。
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
      - number: '8.6'
        title: 优先权结构、稀释与披露提示
        blocks:
          - type: paragraph
            body: >
              Noah Medical 未公开披露资本结构表、清算优先权结构、反稀释条款、投资者 pro-rata
              权利、董事会构成、期权池规模或任何债务义务。对一家没有公开报告义务的私营公司而言，这些缺口很常见，但对任何试图承销公允价值或下行情景的投资者来说都是实质盲点。SoftBank Vision Fund
              历史轮次常包含参与型优先股结构和 1x–2x 清算优先权；如果这些条款适用于 Series B，普通股（以及后续轮优先股）持有人在下行情景中会面临显著优先权悬挂。2024–2025
              年晚期医疗科技融资环境艰难：行业数据显示，约三分之二 Series C 及以后轮次按平轮或下行轮定价，投资者保护（ratchets、反稀释条款、PIK 股息）更常见。Noah Medical 似乎在 2023 年
              4 月至 2025 年 9 月之间避免了有记录的下行轮，但 $230M 融资缺少官方确认，连这一正面信号也无法验证。healthcare.digital 分析称，2026 年医疗科技机器人公司 IPO 门槛要求
              $40–60M run-rate revenue 和 60–80% 毛利率；Noah Medical 两项均未披露。没有 data-room
              访问权限，分析师无法建立可信的企业价值瀑布、稀释情景或回报分布模型。因此，本章所有估值数字都应理解为指示性标记，而非经承销的公允价值。重大缺口：资本结构表、优先权堆栈和任何债务工具，是任何投资决策前最高优先级尽调事项。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
      - number: '8.7'
        title: 牛市 / 基准 / 熊市情景与投资建议
        blocks:
          - type: paragraph
            body: >
              牛市情景假设 Noah Medical 在机器人支气管镜中取得品类领导地位——到 2028–2030 年达到 200+ 套装机和 $300–500M 收入——保持高端利润率（60–70%
              毛利率，符合资本设备加耗材的机器人医疗科技模式），并以 8–12x 收入倍数通过战略 M&A 退出，或按 ISRG 可比倍数 IPO。在该情景下，$3B–$6B 企业价值具有合理性，相当于报道中 2025
              年估值标记的 1.5x–3x。基准情景假设 Galaxy 扩至 80–100 套系统，产生 $100–$200M 收入，在 TPT 之后实现报销稳定，并被战略买家收购或完成 Series C，维持 $2.0B
              标记；经稀释调整后的回报将高度取决于优先权结构。熊市情景锚定三项并发风险：2026 年末 TPT 报销到期压制医院采购，J&J Monarch QUEST 或 ISRG Ion
              加速竞争替代，公司召回历史带来监管负担。在熊市假设下，以 $0.5B–$1.0B 进行平轮或下行轮，或以低于上一轮报道标记的价格进行困境战略出售，都具有可能性。基准建议是：承销前继续研究。$2.0B
              估值有条件获得支持——落在一家背书良好的晚期医疗科技机器人公司在当前商业化阶段的可比范围内——但没有确认收入、利润率、烧钱速度、优先权堆栈和资本结构表，就无法独立验证或折价。能够正向改变立场的最高优先级触发因素是：（1）官方确认
              2025 年 9 月融资及轮次条款；（2）确认收入 ≥$150M 且毛利率 ≥65%；（3）TPT 延期或专属 CPT 代码通过。负面触发因素包括：报销恶化、低于 $2.0B 的下行轮或平轮、额外 FDA
              召回，或临床数据复现失败。
