      - number: '3.5'
        title: 能力与临床表现对比
        blocks:
          - type: paragraph
            body: >
              三款机器人平台共享同一个基础临床目标——准确活检外周肺结节——但在导航技术、术中成像架构和镜体设计上分化。Galaxy
              的主要技术差异点是嵌入式成像：TiLT+（数字断层合成结合增强透视）使用支气管镜套间已有的标准透视设备，提供实时 3D 靶向确认；在 MATCH 2 前瞻性多中心研究（n=31）中，与专用 CBCT 的一致性达到
              96.7%。这与 Ion 形成对比：Ion 因为在活检步骤撤出视觉探针，需要辅助 CBCT（或其他确认方式）才能获得同等靶向信心。


              Galaxy 每例手术还使用一次性支气管镜，相比 Ion 的可复用导管和 Monarch 的可复用 scope-in-sheath，可消除再处理时间和交叉污染风险。在社区医院实践中，Galaxy 在 70
              个连续病例中报告 89% 严格诊断率；对无法证明 CBCT 基础设施投资合理的中心，这一结果具有现实意义。


              Ion 的形状感知光纤避开了电磁干扰和配准误差，而 Galaxy 和 Monarch 都依赖 EMN 导航，会受这些问题影响。在 2025 年匹配研究中，Ion 更短的手术时间（与 Monarch 相比 37
              vs 70 分钟）和更低辐射剂量，对高量中心有运营意义。Cleveland Clinic
              医生指出，平台选择更多取决于机构成像可及性和流程，而非基础导航能力；经验丰富的操作者配合适当辅助成像时，三套系统都能成功导航至 PPLs。


              无支撑的对比项：Galaxy vs Ion 的多中心 RCT 头对头数据尚不可得；除 BCM 报告的机器人支气管镜平均值外，Galaxy 每例成本未公开披露；Monarch QUEST
              在前瞻性试验中的成像结果仍待公布。
