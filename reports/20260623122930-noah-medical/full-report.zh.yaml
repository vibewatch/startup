              Capital、Uphonest Capital、Sunmed Capital、Lyfe Capital、1955 Capital、AME Cloud
              Ventures，并有未披露战略投资者参与。独立交易报道印证了该轮规模、领投方和财团构成。Series B 之外，公司总融资额未完全披露；第三方数据库显示，截至 2023 年已融资超过 $150M，意味着早期
