      - number: '4.5'
        title: 报销动态和手术经济性
        blocks:
          - type: paragraph
            body: >
              Galaxy System 的商业可行性不仅取决于 Noah Medical 的定价和利润率结构，也取决于医院能否为机器人辅助手术支气管镜检查开票并回款。在当前 Medicare OPPS
              下，带活检的支气管镜检查（CPT 31625）对应医院门诊机构支付约 $1,724（2025 年费率，全国平均），Medicare Physician Fee Schedule 下医生支付约
              $334。无论使用传统平台还是机器人平台，这些费率都适用于手术本身，意味着医院必须在这个报销包里吸收 Galaxy System 及其一次性耗材成本。按 Johns Hopkins 2026
              研究基准，每支一次性支气管镜 $300–$400，医院必须从更广的肺癌诊断流程中跑出足够手术量和利润，才能证明 Galaxy 资本投入和单次手术耗材成本合理。CHEST 2025 Beyond the Scope
              研究报告内镜室 CBR 为 1.5，正面回应了这个问题，暗示即便在当前 Medicare 水平报销下，Galaxy 手术也能为社区医院创造正净值。不过，CMS 监管环境带来实质风险：FDA 批准不等于 CMS
              覆盖。CMS 2021 年废止 MCIT 项目，并在 2023 年 6 月引入 Transitional Coverage for Emerging
              Technologies（TCET）路径；器械获批与支付方覆盖之间的空档，可能显著拖慢放量。RQM+ 对医疗科技报销动态的分析明确指出，FDA approval 不等于 reimbursement，生成 CMS
              所需的真实世界证据需要多年。医院资本预算约束是另一道独立但相关的障碍：机器人手术采用不只需要正向手术经济性，还要在医院优先级竞争中拿到资本委员会批准；疫情后医疗系统资本预算仍然紧张。CMS TCET 于 2024
              年 8 月最终定稿，为突破性器械提供了部分入口，但任何寻求增量支付认可的平台，覆盖时间线仍不确定。
            claimRefs:
              - CI032
              - CI033
              - CI034
              - CI035
              - CI036
