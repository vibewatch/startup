    rows:
      - - Intuitive Surgical Ion
        - 直接机器人竞争对手
        - '上市公司（NASDAQ: ISRG）；2026 年 Q1 已安装 1,041 套系统；2026 年 Q1 收入 $2.77B（全平台）'
        - 具备 CBCT 使用条件的学术医院和大型社区医院
        - 形状感知光纤导航；ISRG 服务网络；da Vinci 品牌光环；手术量同比增长 39%
        - 活检时移除视觉探针；最高置信度仍需 CBCT 辅助；高端定价约 $1.0–1.1M
      - - J&J / Monarch（Auris Health 机器人平台）
        - 直接机器人竞争对手
        - J&J 以 $3.4B 收购（2019）；先发者（2018 年 3 月获批）；隶属 J&J MedTech（约 $32B 板块收入）
        - 与 J&J 有关系的企业级医院系统；寻求数字生态集成的中心
        - Polyphonic 数字生态；MONARCH QUEST AI + CBCT 集成；培训上有 7 年先发优势
        - 2025 年匹配研究中记录的 DY（71.0%）低于 Ion；操作时间更长；QUEST 的 RCT 验证仍待完成
      - - Noah Medical Galaxy System
        - 本报告画像公司
        - 私营；已融资 $150M+（Series B）；2023 年 3 月获 FDA 批准；截至 2025 年 3 月，美国手术量 5,000+ 例
        - 缺乏专用 CBCT 基础设施的学术中心和社区医院
        - 内嵌 TiLT+ 影像（DT + AF），提供 CBCT 等效确认；一次性使用支气管镜；流程效率
        - 装机基础更小；与 Ion/Monarch 相比，已发表对比研究更少；早期采用者之外品牌认知有限
      - - Medtronic ILLUMISITE
        - 非机器人导航替代品
        - '上市公司（NYSE: MDT）；全球 MedTech 龙头；肺健康业务隶属收入 $32B+ 的公司'
        - 寻求较低资本门槛、且有 RCT 证据支撑导航方案的医院；不适合 TTNB 的患者
        - 唯一在 RCT 中相对 CT 引导活检取得阳性结果的平台（VERITAS）；资本成本更低（约 $500K）；连续引导
        - 不是机器人；依赖透视数字断层合成，而非体积 CT；临床热度低于机器人平台
      - - Olympus（EBUS 产品组合）
        - 相邻替代 / 部分重叠
        - 上市公司；全球大型内镜公司；总收入约 $8B；BF-UCP190F 于 2025 年 9 月在 EMEA/APAC 上市
        - 已有 Olympus 内镜关系的医院；纵隔分期项目
        - 全球支气管镜设备装机基础最大；新款纤细 EBUS 镜（外径 5.9mm）延伸外周可达性；实时超声引导
        - 主要用于纵隔分期（中央 EBUS-TBNA）；外周结节可达性弱于机器人平台；没有机器人关节
      - - CBCT 引导支气管镜（Siemens/GE 工作流）
        - 基础设施替代 / 辅助
        - Siemens Healthineers 与 GE HealthCare；移动 CBCT C 臂 $400–700K；领先影像公司
        - 拥有 OR/IR CBCT 使用条件的高病例量学术中心和癌症中心
        - 真正的 3D 体积术中确认；早期病例系列中工具入病灶率最高达 100%；可与 Ion/Monarch 集成
        - 不是独立导航平台；需要机器人或 EMN 系统；总资本支出高；工作流复杂；有辐射暴露
    notes: 规模数据来自 2026 年 Q1 ISRG 财报、公司新闻稿和医疗科技报道；Monarch 装机基础未公开披露；Galaxy 手术量反映 2025 年 3 月里程碑；所有资本成本数字均为公开近似估计，会随地区和合同变化。
