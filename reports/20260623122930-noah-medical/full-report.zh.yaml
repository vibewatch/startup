      - number: '4.6'
        title: 财务披露缺口和证据限制
        blocks:
          - type: paragraph
            body: >
              Noah Medical 是私营公司，这意味着承销投资所需的标准财务指标，几乎都无法从公开来源获得。截至运行日期，以下指标明确未披露：收入（任何期间）、年度经常性收入或 ARR、毛利率（系统或耗材）、EBITDA
              或净利润、账上现金、月度 burn rate、runway、客户数量、按站点划分的装机量、单台系统平均手术使用率、单件 COGS（资本设备或耗材）、获客成本、销售周期、复购率，以及现有股权的优先权层级和清算
              waterfall。估值同样没有公司确认：Series B 后估值完全未披露，第三方报道的 $2.0B 投后估值（premieralts.com / PitchBook）与报道的 $230M
              融资一致，但没有官方确认。此外，第三方 Getlatka 的收入估算（$139.3M ARR）必须剔除，因为同一记录存在已证实的事实错误。第三方估值互相冲突（Getlatka 的 $417.9M vs.
              Premier Alternatives 的约 $2.0B），凸显私营公司财务分析的数据质量问题：没有公司直接确认，两个数字都不能依赖。无法验证总融资额（$230M 轮未确认）、burn rate、runway
              或利润率，意味着资本充足性——成长阶段医疗科技公司需要持续投资制造、商业扩张和研发的核心尽调问题——仅靠公开信息无法评估。这些缺口对 Series B /
              后期私营医疗科技并不罕见，但这里不是披露偏薄，而是成片空白；这些空白共同构成了在不直接接触公司的情况下形成有根据财务判断的主要阻碍。
