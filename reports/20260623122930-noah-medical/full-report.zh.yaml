      - number: '2.2'
        title: 流行病学需求基础
        blocks:
          - type: paragraph
            body: >-
              肺结节诊断需求由两股力量共同驱动：肺癌负担，以及正在扩张但严重低利用的 LDCT 筛查基础设施。肺癌仍是美国癌症死亡的首要原因，2026 年估计新增 229,410 例、死亡 124,990
              例，占美国全部癌症死亡的 20%。五年相对生存率为 29.5%，结果持续偏差，主要因为晚期诊断；早期发现的生存率超过 60%。下游手术量更宽的决定因素是肺结节发现：美国每年约有 1.6 million
              个结节通过胸部 CT 成像被识别，在因其他适应证开具的全部胸部 CT 中，约 30% 会偶然发现结节。随着 CT
              被更多用于肺栓塞、心血管评估和创伤，偶然发现率上升，形成越来越大的结节积压，需要风险分层，并在部分病例中进行组织取样。在这一需求背景下，2021 年 USPSTF 指南扩展——把资格门槛从 55–80 岁且 30
              包年降至 50–80 岁且 20 包年——几乎将符合筛查资格的人群翻倍至约 14.1 million 名美国成年人。即便如此，目前只有约 18%
              的合格人群接受筛查，留下显著结构性缺口。低渗透率来自提供者认知有限、患者对烟草使用的污名、转诊路径碎片化，以及基层医疗缺少共同决策能力。对机器人支气管镜市场而言，含义有两面：筛查缺口限制了 CT
              发现结节流入诊断活检的管线，但也代表一个巨大的潜在需求池；一旦通过改进筛查项目、AI 驱动结节追踪和患者导航被激活，可服务手术量将实质扩张。
