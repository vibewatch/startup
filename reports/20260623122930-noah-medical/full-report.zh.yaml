            body: >-
              Noah Medical 由创始人兼 CEO Jian Zhang 领导。他是外科机器人创业者，创始人-市场匹配度罕见地强：曾是 Auris Health 第 2 号员工（Auris 2019 年被
              Johnson & Johnson 以 $5.7B 收购），此前任职 Intuitive Surgical，拥有 Columbia University 硕士和博士学位，并曾共同创办 Robotphoenix
              等公司。公开领导团队页面显示，公司职能高管班底大量来自 Intuitive、Auris、Stryker、Verb Surgical 等顶级机器人公司，包括临时 CFO Ivy Li、销售与营销 VP Joe
              Riley、工程 VP John Shen、总法律顾问 Nicky Espinosa、制造运营 VP John Mesenbring，以及服务与技术运营 VP Brent Lloyd。2026 年 6
              月，公司任命 Stanford Medicine 介入肺病医生 Dr. Krish Bhadra 为首席肺病顾问，这是新设职位；他已完成超过 2,300
              例机器人辅助支气管镜操作。最关键的治理缺口在于：董事会、投资方董事席位和所有权结构均未公开披露，CFO 仍为临时任命；两点都是尽调中需要关注的关键人和治理事项。
