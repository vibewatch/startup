  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层以及买方、用户、支付方角色
        blocks:
          - type: paragraph
            body: >-
              Galaxy System 的终端客户，是购买机器人资本设备并在每台手术中消耗一次性支气管镜的医院或医疗系统。买方可分成三个可识别层级。学术医学中心（AMCs），例如 University of Chicago
              Medicine 和 Inova Fairfax Medical Center（Virginia），是第一批采用者：它们拥有大型介入肺科项目、强研究基础设施，以及可支持先进支气管镜资本投入的 Medicare /
              商业保险支付方组合。大型社区医院——例如 Tennessee Chattanooga 的 CHI Memorial（CommonSpirit Health 网络的一部分）和 New York New Hyde
              Park 的 Long Island Jewish Medical Center（Northwell Health 附属机构）——构成关键第二层，2024 年中期采用信号显示，Galaxy
              正从研究中心向外扩散。小型和农村社区医院构成正在形成的第三层，代表案例是 West Virginia 的 WVU Camden Clark Medical
              Center；该州仅有两名介入肺科医生之一在此执业，而「Beyond the Scope」研究证明，这类机构也能用 Galaxy 跑出经济可持续性。

              买方角色通常由医院行政管理层或医生兼服务线负责人承担，他们构建资本支出的商业案例，并在年度或临时资本委员会流程中推动通过。用户是执行手术的介入肺科医生（IP）；Galaxy
              占地紧凑、支气管镜一次性使用，使其可部署在内镜室，而不只是在手术室，进而扩大较小站点的使用场景。Galaxy 支持手术的支付方主要是 Medicare（社区场景约占手术量 60%），辅以商业保险，Medicaid
              占比较低。多数已确认站点的推动者，是有姓名的 IP 医生研究者，他们较早接触 Noah Medical 临床项目；其中数人披露与公司存在财务关系。
