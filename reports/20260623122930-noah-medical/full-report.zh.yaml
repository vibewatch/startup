    notes: 情景区间是基于可比公司分析和情景逻辑得出的企业价值锚点，仅用于示意；不是 DCF 输出。概率信号是分析师的定性判断。这些估算没有 Noah Medical 经审计财务数据支撑。
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >
        Rows enumerate publicly available valuation data points for Noah Medical and the closest comparable public and
        private companies in robotic bronchoscopy, robotic surgery, and late-stage medtech VC as of June 2026. Public
        multiples are drawn from exchange-level data (stockanalysis.com, companiesmarketcap.com, marketscreener.com).
        Private valuations are sourced from disclosed funding rounds (press releases, PitchBook, Tracxn). Noah Medical
        private mark is sourced from Premier Alternatives / PitchBook and is unconfirmed by the company. Rows are
        ordered from most to least directly comparable.
    columns:
      - 可比对象
      - 指标 / 阶段
      - 倍数或估值
      - 与 Noah Medical 的相关性
      - 关键限制
    rows:
      - - Intuitive Surgical (ISRG) — Ion 支气管镜 + da Vinci
        - 上市公司；FY2025 收入 $10.07B；2026 年 Q1 Ion 系统 1,041 台；EV $137B
        - EV/Revenue 约 13x；PS 13.4x（2026 年 6 月）；市值 $142B
        - Ion 直接竞争者；最接近机器人支气管镜高溢价倍数的上市可比对象
        - 规模不可比（$10B 收入 vs 未披露收入）；盈利能力（约 $2.5B 净利润）不适用于 Noah Medical 所处阶段；ISRG 倍数不能套用到单一产品、VC 支持且尚未盈利的初创公司
      - - Medtronic (MDT) — Hugo RAS + 多元化医疗科技
        - 上市公司；Hugo 泌尿适应证 2025 年 12 月获 FDA 批准；FY2026 Q3 收入 $9.0B
        - 远期 P/S 约 3.3x；大盘多元化公司折价
        - 上市医疗科技机器人倍数下限；体现非主导、多元化平台的折价
        - 大盘多元化折价；Hugo 商业贡献尚不显著；Medtronic 倍数反映的是传统业务，而非机器人增长
      - - CMR Surgical（Versius 系统）— 私营
        - 私营公司；估值 $2.7B（2021 年 Series D 轮）；2025 年融资 $200M+；累计融资 $1B+；全球系统 200+ 台
        - $2.7B 私募估值标记（2021 年）；2025 年轮次未披露估值——可能维持或小幅下调
        - 按融资规模和阶段看，最可比的私营手术机器人同业
        - 2021 年估值可能已经过时；2024 年获 FDA 批准前没有美国商业化规模；适应证不同（软组织手术 vs 支气管镜）
      - - Distalmotion (Dexter) — 私营
        - 私营公司；2025 年 11 月 Series G 轮融资 $150M；累计融资 $390M；患者 3,000+；瞄准 ASC
        - 累计融资 $390M；估值未披露，但 Series G 轮估值可能在 $500M–$1B 区间
        - 后期私营机器人手术可比对象；J&J 为战略投资方；显示 VC 对该领域仍有投资胃口
        - 规模更小，美国布局更早期；适应证和院端场景不同（ASC vs 医院）；估值未披露
      - - Noah Medical (Galaxy System) — 标的公司
        - 私营公司；2023 年 4 月 Series B 轮（$150M 已确认）；2025 年 9 月后期 VC 轮（$230M 未确认）；手术 10K+ 例；系统 50+ 台
        - $2.0B 投后估值（Premier Alternatives / PitchBook，2025 年 9 月）——未确认；$417.9M 冲突估值（Latka，低置信度）
        - 标的公司——估值标记仅供参考
        - 官方未确认；第三方估算彼此冲突；未披露收入；无法独立验证
      - - Shenzhen Edge Medical — 私营（机器人 IPO）
        - 2026 年 1 月 HKEX IPO 融资 $154M；手术机器人；总部在中国
        - IPO 融资 $154M；可得来源未披露 IPO 估值
        - 显示全球手术机器人仍能获得资本
        - 地域不同（中国 / 香港）；适应证不同；HKEX 与美国市场不可直接类比
    notes: >
      所有上市公司倍数均为截至 2026 年 6 月 23 日的过去十二个月（TTM）口径，来源包括 stockanalysis.com（ISRG 统计页面）、companiesmarketcap.com 和
      marketscreener.com。私营公司估值来自 PitchBook（经 Premier Alternatives 和 Tracxn）以及已披露融资轮新闻稿。Noah Medical 的 $2.0B
      数字来自第三方数据源，不是公司官方披露。由于没有确认收入数字，收入倍数不直接套用到 Noah Medical。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV017
      - CV018
      - CV004
      - CV016
      - CV021
  - id: TV005
    title: 破坏投资论点与终止标准触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - TPT 报销到期且没有后续支付
        - 到 2027 年 1 月，CMS 未延长 HCPCS C1601，也未推出新的支气管镜附加支付
        - 医院暂停或撤回 Galaxy System 采购；手术爬坡放慢；收入轨迹受损；熊市情景概率大幅上升
        - 关注 2026 年 Q4 CMS 年度费用表；跟踪医院客户续约率；向管理层索取已确认的报销策略
      - - 新增 Class 2 或更高级别召回
        - Noah Medical 对 Galaxy System 发起第五次召回或 Class 3 自愿召回
        - 加重既有质量叙事（2024–2025 年四次召回）；医院犹豫加深；FDA 审查风险上升；高溢价估值倍数被压缩
        - 继续推进前，要求完整质量管理体系审计和召回解决证据
      - - 确认低于 $2.0B 的降价轮或平价轮
        - Noah Medical 后续融资估值低于报道的 2025 年 9 月 $2.0B 标记
        - 直接挑战投资论点锚点；如适用，触发反稀释条款；释放商业化表现不及预期信号
        - 全面重估投资论点；审查轮次条款中的优先权棘轮；更新情景概率
      - - 收入确认显著低于 $100M
        - 数据室收入披露显示 FY2025 收入低于 $100M
        - 按 ISRG 可比的 13x EV/Revenue，$100M 收入对应 $1.3B 公允价值——比报道估值低 35%；熊市区间变成基准情景
        - 对 $2.0B 入场价格施加 30–40% 估值折扣；要求扩大数据室尽调
      - - 竞争替代：Ion 或 Monarch QUEST 达到社区医院同等可及性
        - 到 2026 年底，独立临床数据显示 Ion 或 Monarch QUEST 在无需 CBCT 的情况下达到 Galaxy 的诊断率指标
        - Galaxy 的核心差异化（借 TiLT+ 实现社区医院可及性）被抹平；ASP 和放量定价压力加剧
        - 重新评估技术护城河；判断 Galaxy 装机基础是否形成足够转换成本
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV044
      - CV046
    notes: 触发阈值是分析师基于公开可观察指标定义的可监控事件，均非来自 Noah Medical 内部风险管理材料。行动含义是方向性指引，不是正式投资建议。
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与收入增长
        - FY2024 和 FY2025 已确认收入，按收入流拆分（资本设备、耗材、服务）；同比增长率
        - 套用任何收入倍数都需要该数据；按 ISRG 倍数，$2.0B 估值隐含约 $154M 收入——确认或否认都会实质改变基准情景区间
        - CEO / CFO；数据室；经审计财务报表或投资者报告包
      - - 股权结构表与优先权层级
        - 完整股权结构表：轮次、股数、清算优先权、反稀释条款、参与型 vs 非参与型优先股条款、期权池
        - 决定经济所有权和下行情景分配；若退出低于 $1B，优先权包袱可能让普通股（或后轮优先股）价值远低于名义 $2.0B 标记
        - 数据室；公司股权结构管理系统（Carta 或同类）；Series B 轮 / 2025 年轮次条款清单
      - - 2025 年 9 月 $230M 轮次确认
        - 公司官方新闻稿、SEC Form D 或投资者沟通材料，确认报道中的 $230M 后期 VC 轮次及其条款
        - 整个 $2.0B 估值锚点建立在一个未确认的第三方数据点上；没有确认，标题估值不具备投资依据
        - Noah Medical 投资者关系；SEC EDGAR Form D 检索；直接询问管理层
      - - 毛利率与烧钱速度
        - 混合毛利率（资本设备和耗材合并）；月度烧钱速度；现金余额和可支撑月数
        - 判断 Galaxy 单位经济能否支撑扩张，以及公司能否在没有困境降价轮的情况下达到盈亏平衡；DCF 框架也需要这些数据
        - 数据室；经审计财务；CFO 尽调会议
      - - TPT 之后的报销策略
        - HCPCS C1601 TPT 于 2026 年底到期后，公司针对医院报销的正式计划；CMS 申报计划、DRG 策略、支付方签约
        - TPT 到期是近期最可能触发采购推迟的单一催化因素；没有清晰后续策略，收入爬坡会承压
        - 管理层尽调；报销顾问审阅；CMS 监管往来函件
      - - 召回解决状态与质量体系
        - 未关闭召回 Z-0693-2025（电源）和 Z-0598-2026（IFU）的当前状态；QMS 审计发现；CAPA 关闭证据
        - 截至 2026 年 6 月仍有两项未关闭召回，意味着监管暴露仍在；高溢价估值需要确认召回模式已经解决，QMS 能支撑规模化
        - FDA CDRH 召回数据库（accessdata.fda.gov）；Noah Medical 质量尽调包；独立 QMS 审计
    claimRefs:
      - CV028
      - CV032
      - CV033
      - CV039
      - CV040
      - CV046
    notes: 尽调问题反映的是截至 2026 年 6 月 23 日无法由公开证据回答的事项。有些事项（如股权结构表、轮次确认）可能通过正式管理层沟通取得；另一些事项（如报销策略）需要直接接触公司。本表为指示性清单，并非穷尽。
