      - number: '7.5'
        title: 制造、供应链与运营风险
        blocks:
          - type: paragraph
            body: >
              Noah Medical 的商业模式形成两类不同制造依赖：Galaxy System 资本设备平台（精密机电、可复用）和 Galaxy
              支气管镜一次性耗材（一次性、无菌、按例使用）。任一产线受扰，都会直接损害医院手术吞吐量和收入。一次性支气管镜必须规模化生产，才能支撑不断扩大的手术量——每套已安装 Galaxy System
              都需要持续的一次性手术耗材供应，供应短缺会立刻转化为患者手术延期或取消。


              召回历史（约 26 个月内四起 Class 2 召回）反映制造质量挑战。ISO 13485 合规是硬性要求；现场纠正若持续出现，会触发 FDA 质量体系检查或 Warning
              Letter，推高监管负担和成本。Z-0679-2025 记录的活检工具通道不兼容，反映支气管镜中的几何设计约束，影响所有已部署设备，而不是离散制造缺陷——这意味着底层问题需要产品重设计，而非简单现场纠正。


              医院资本开支逆风带来需求侧风险：2025–2026 年受访医院高管中，40% 计划削减或推迟资本设备支出；进口医疗技术部件关税预计使医院费用增加 15% 或更多；CMS 2026 报销调整压缩了单例收入。MPO
              Magazine 2026 年对资本医疗器械销售的分析确认，医院采购方已转向「选择性 capex」姿态，批准高价机器人平台前要求证明 ROI。这些逆风不会阻止 Galaxy
              采用，但会拉长销售周期，并要求更充分的医院经济模型和厂商融资替代方案。


              一次性耗材还会引来环境审查。医院可持续承诺越来越多地评估一次性医疗器械废物流；欧洲监管机构已提出对一次性器械塑料实施扩展生产者责任。这给 Noah Medical
              以一次性耗材为中心的模式带来声誉和监管风险，尤其是 EU 扩张需要 CE Mark，并且要面对要求日益提高的环境监管环境。作为创业公司，供应链集中风险偏高：Noah Medical
              大概率依赖有限数量的合格合同制造商和原材料供应商，采购微电子、光学和聚合物部件；目前没有公开披露供应链多元化策略。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR036
              - CR037
              - CR044
      - number: '7.6'
        title: 法律、IP 与治理风险
        blocks:
          - type: paragraph
            body: >
              已和解的 Auris Health v. Noah Medical 商业秘密诉讼（N.D. Cal. 3:22-cv-08073，2022 年 12 月至 2025 年 3 月）是 Noah Medical
              历史上最重要的法律风险事件。Auris Health（J&J 子公司）、Verb Surgical 和 Cilag GmbH 指控多名前 Auris 员工——包括 Noah Medical 创始人 Dr.
              Jian Zhang——在加入 Noah Medical 时盗用与内镜机器人系统相关的商业秘密。起诉书称，被告未经授权复制机器人平台机密文件，并将其用于 Noah Medical 专利申请和产品开发。案件在
              2023 年 11 月抗过驳回动议并进入证据开示后，于 2025 年 3 月按约定命令有偏见撤诉，表明双方达成保密和解。尽管结果对公司有利，有偏见撤诉并未消除全部 IP 风险：J&J 或其关联方仍可基于不同 IP
              理由提出新主张，和解条款也未披露。更结构性地看，该诉讼确认 Noah Medical 工程团队包含具备深厚机器人内镜经验的前 Auris 员工——这是资产，也持续带来 IP 挑战风险。


              公司治理不透明。Noah Medical 是私营公司，没有 SEC 申报义务；董事会构成、投资者权利协议、清算优先权、反稀释条款和管理层薪酬均未披露。缺少治理披露，意味着投资者无法评估控股投资者（SoftBank
              Vision Fund、Tiger Global）是否持有董事席位并对融资、M&A 或关键人事决策拥有否决权，也无法判断这些权利是否会因财务契约或里程碑失败而触发。SoftBank Vision Fund
              近年经历了显著组合减记和战略转向；SoftBank 投资姿态若改变，可能影响其参与未来轮次或行使治理权的意愿。鉴于 Galaxy System 处理患者影像和 EM 导航数据，数据隐私和 HIPAA
              合规风险存在；Noah Medical 未公开披露其数据安全实践、HIPAA 合规架构或事件历史。
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR041
      - number: '7.7'
        title: 融资、现金跑道与执行风险
        blocks:
          - type: paragraph
            body: >
              Noah Medical 已确认融资总额为 $150M（Series B，2023 年 4 月，由 SoftBank Vision Fund 领投）。Premier Alternatives/PitchBook
              报道称，后续一轮 $230M Later Stage VC（2025 年 9 月）隐含投后估值约
              $2.0B，但公司未通过任何新闻稿或官方沟通确认该轮融资。若只将已确认资本视为既定事实，并套用商业化阶段机器人医疗科技公司的行业基准烧钱速度——约 300 名员工、每月 $5–10M——$150M Series
              B 意味着自交割起约 15–30 个月跑道。该计算将潜在跑道耗尽窗口放在 2025 年 7 月至 2026 年 4 月，除非收入已相当可观或公司已获得额外资本。若未确认的 $230M 融资如报道所称于 2025
              年 9 月完成，则按高端烧钱假设也可把跑道延至 2027 年末；但没有确认，投资者无法承销这一假设。


              收入、ARR、毛利率、烧钱速度、现金余额和跑道全部缺席，使外部无法独立评估 Noah Medical 的财务健康。低可靠性来源 Latka.com 报道 Noah Medical 2025 年 ARR 为
              $139.3M，但同一来源在公司领导层和融资历史上存在可证伪错误，因此该收入数字不可靠。没有可信的独立收入估计。下游融资风险偏高：Nocturnal 2024 投资数据分析显示，2024 年医疗科技 Series
              C 及以后轮次中，三分之二为平轮或下行轮；机器人医疗科技烧钱和资本强度仍高；收入爬坡若失手，或召回活动持续，都可能削弱公司按当前估值倍数融资的能力。


              Noah Medical 是单产品公司。所有收入、运营能力和企业价值都依赖 Galaxy System。重大负面监管事件——召回升级至 Class 1、Warning Letter、退市令或 510(k)
              hold——会同时消灭收入、打击客户信心，并耗尽管理层带宽。Dr. Jian Zhang（CEO 兼联合创始人）和小型高级团队构成关键人依赖和连续性风险；Auris
              诉讼已经证明这些人带有可能再度浮现的诉讼历史。美国单一市场依赖放大集中度风险；CE Mark clearance 尚未确认，EU MDR 合规路径明显比 FDA 510(k) 更苛刻，需要按 MDR Annex
              XIV/XV 标准进行临床评估，并经历 Notified Body 审查，提交后时间线可延至 18–36 个月。
            claimRefs:
