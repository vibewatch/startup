      - number: '2.3'
        title: 市场规模测算——多重口径与矛盾
        blocks:
          - type: paragraph
            body: >-
              机器人支气管镜市场规模在分析师来源之间存在实质争议：2025–2026 年，对名义上同一市场的估算从 $77 million 到 $640 million
              不等。大部分差异来自三类不同范围假设。最窄定义（Statifacts，2026：$94.5M）只计算专用机器人导管系统及其一次性附件，排除 ENB 平台、EBUS 资本设备和软件订阅。中间口径（Market
              Research Intellect，2026：$640M）把机器人系统、附件和相关软件放进「企业级机器人支气管镜」伞下，其中包含部分导航和引导收入。最宽视角（PW
              Consulting，2025：$515M，2026：$609M）在一致的医院手术单位经济模型下，聚合所有应用类型和区域地理的机器人支气管镜。上述报告均未以公开可访问形式发布方法论，CAGR
              估算也同样分叉：同一名义细分市场、可比预测窗口下，分别为 5.5%（Data Insights）、18.3%（PW Consulting）和
              21.85%（Statifacts）。覆盖更广的介入肺病市场提供了更稳定锚点：MarkWide Research 估算 2026 年全球总规模为 $4.8 billion，至 2036 年 CAGR 为
              8.7%；ResearchNester 估算 2026 年为 $4.6 billion，至 2035 年 CAGR 为 5.7%。北美占全球介入肺病量的
              21–38%，取决于口径。自下而上构建美国估算：假设美国每年 500,000 例支气管镜（ResearchNester 引用 NLM），机器人平台渗透率约 10–15%，每例机器人手术平均收入（设备 + 耗材）约
              $1,500–2,000，则美国手术端 SAM 约为每年 $75–150 million——与较窄的 Statifacts
              估算一致，但远低于企业级打包口径。若投资人和分析师直接采用宽口径估算而不调整范围，可能会把 Noah Medical 这类单平台公司眼前可服务市场高估五到八倍。
