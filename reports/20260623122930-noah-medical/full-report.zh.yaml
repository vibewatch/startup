      - number: '6.6'
        title: 留存信号、KOL 关系与扩张模式
        blocks:
          - type: paragraph
            body: >-
              Noah Medical 尚未披露正式客户留存指标——NRR、GRR、流失率、合同续约数据或 cohort
              利用率统计均无公开信息。客户粘性只能从间接信号推断。最有力的留存代理指标是，具名早期采用站点（University of Chicago、CHI Memorial、Inova Fairfax）在 2023 至
              2026 年间反复出现在多个研究 cohort、会议展示和具名用户场景中，显示仍在持续使用。UChicago Medicine 网络内的 Ingalls Memorial 于 2026 年 4 月采用
              Galaxy，距离 UChicago 首次使用已超过三年，说明锚点站点活跃时间足以影响网络内扩散；即使只是轶事证据，也是有意义的耐久性信号。

              KOL 参与模式介于临床研究合作与客户成功之间。Dr. Bhadra（CHI Memorial）曾担任 MATCH 2 研究者、CommonSpirit Health Lung Council 联席主席，并自
              2026 年 6 月起担任 Noah Medical 首席肺科顾问。Dr. Mahajan（Inova Fairfax）参与了 2024 年 4 月现场数据白皮书和 MATCH 2
              研究，并多次公开背书系统的财务和临床价值。上述关系带来机构粘性：拥有股权或顾问关系的医生拥护者，在任期中切换平台的可能性较低；其研究发表又形成独立证据，带动其他医院主动关注。

              扩张信号体现为两种模式：从锚点 AMC 向网络附属机构扩散（UChicago → Ingalls Memorial），以及由会议驱动的采用——具名用户在 AABIP 和 CHEST
              的展示，让更广泛的介入肺病学群体看到 Galaxy System。Noah Medical 在 AABIP 2024 通过模拟环节、专题会和会后活动，明确瞄准未来可成为机构拥护者的医生决策者。
