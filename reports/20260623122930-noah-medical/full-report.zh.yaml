  - id: FI001
    title: 收入模型桥——Galaxy System 活动如何转化为收入和毛利润
    type: flow
    layout: compact
    summary: |
      展示“资本设备 + 经常性耗材”的收入模型：医院资本采购带来系统装机，系统装机带动每例手术的一次性耗材消耗，再转化为经常性收入。服务合同提供第三条经常性收入流。所有美元数值未知；结构来自公开产品描述和医疗科技可比对象。
    data:
      nodes:
        - id: n1
          label: 医院资本决策
          detail: 购买或租赁 Galaxy System（竞争对手基准约 $600K–$750K；Galaxy ASP 未披露）
        - id: n2
          label: 系统装机与培训
          detail: Galaxy 安装在医院支气管镜室；完成临床培训
        - id: n3
          label: 手术使用
          detail: 每例手术消耗一次性支气管镜（商品化基准约 $300–$400；Galaxy 专属价格未披露）
        - id: n4
          label: 资本 + 耗材收入
          detail: 收入 = 资本 ASP（装机时）+ 耗材 ASP × 年手术量
        - id: n5
          label: 服务合同收入
          detail: 年服务费（按行业惯例约为资本 ASP 的 8–12%；Noah Medical 未披露）
        - id: n6
          label: 毛利润（估算）
          detail: 规模化后耗材毛利率约 65–75%（Intuitive 类比）；资本设备毛利率更低，且取决于爬坡；服务毛利率可变
      edges:
        - from: n1
          to: n2
          label: 装机决策 → 安装
        - from: n2
          to: n3
          label: 已装系统带来经常性手术量
        - from: n3
          to: n4
          label: 每例手术触发耗材销售
        - from: n2
          to: n5
          label: 服务合同在安装时或安装后绑定
        - from: n4
          to: n6
          label: 资本 + 耗材收入扣除 COGS
        - from: n5
          to: n6
          label: 服务收入扣除现场服务成本
    approximationNotes: >
      所有具体美元数值均来自行业基准和竞争可比对象（Intuitive Ion 系统定价、Johns Hopkins 一次性支气管镜研究、Intuitive 器械毛利率）。Noah Medical 的定价、COGS
      或毛利率数据均未确认。该流程代表结构模型，不代表已确认财务参数。
