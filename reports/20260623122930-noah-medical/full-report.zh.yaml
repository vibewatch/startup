      - number: '6.2'
        title: 具名客户证明和临床站点证据
        blocks:
          - type: paragraph
            body: >-
              至少七个具名医院站点，已通过公司新闻稿、医院新闻页面、同行评议论文和会议演示，被确认为 Galaxy System 的生产环境用户。University of Chicago Medicine
              是美国首个商业站点，2023 年 5 月 18 日在 Dr. Kyle Hogarth 主导下完成四例成功手术——所有患者当天出院。Dr. Hogarth 发表的利益冲突披露显示，他自 2018 年起一直是
              Noah Medical 付费顾问并持有股权；衡量其背书作为独立医生证据的权重时，这一点是重要背景。UChicago Medicine 网络内的附属机构 Ingalls Memorial
              Hospital（Tinley Park）于 2026 年 4 月启动 Galaxy 支气管镜项目，说明系统在网络内部扩散。

              CHI Memorial（Chattanooga）于 2024 年 1 月完成美国第 500 例 Galaxy 手术，是 Tennessee 首家采用该系统的医院，并在 Dr. Krish Bhadra
              主导下成为 MATCH 2 研究站点。Dr. Bhadra 随后于 2026 年 6 月被任命为 Noah Medical Chief Pulmonary Advisor，进一步加深公司与 KOL
              的关系。Long Island Jewish Medical Center（Northwell Health）在 Dr. Abhinav Agrawal 主导下，于 2025 年 3 月完成第 5,000
              例美国里程碑手术。Virginia 的 Inova Fairfax Medical Center 在 Dr. Amit Mahajan 主导下共同牵头 MATCH 2 研究，并在 165
              例手术中生成独立一线数据，显示诊断率为 92–96%。Hong Kong 的 Prince of Wales Hospital 在 Drs. Calvin Ng 和 Rainbow Lau 主导下，于 2023
              年 12 月完成亚洲首次使用，并启动亚洲首个 Galaxy 临床试验。Sydney, Australia 的 Macquarie University Hospital 从 2023 年 3 月开始，在 Dr.
              Tajalli Saghaie 主导下承接 FRONTIER 首次人体试验。AABIP 2024 还识别出其他具名 Galaxy 用户：Dr. Joseph Cicenia（Cleveland
              Clinic）、Dr. Matthew Federbush（Northwell Health）和 Dr. Sean Callahan（Prisma Health）。
