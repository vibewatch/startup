  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与器械安全风险
        blocks:
          - type: paragraph
            body: >
              Galaxy System 自 2024 年 3 月以来累计发生四起不同的 FDA Class 2 器械召回；对于一个商业装机基数估计低于 100
              台的平台，这一频率异常偏高。该模式指向商业化关键阶段的设计与质量控制挑战，可能引来更强的 FDA 上市后监测，或要求为设计修正提交 510(k) 补充文件。


              召回 Z-0693-2025（2024 年 10 月 25 日启动；2024 年 12 月 18 日发布；截至 2026 年 6 月状态为 Open）涉及 26 台 Galaxy System
              设备（GAL-001）的电源缺陷：不间断电源包含一个半导体部件，可能导致不可恢复短路或断路器跳闸。若故障在手术中发生，支气管镜必须手动取出，增加肺裂伤和气胸风险。截至 2026 年 6 月，纠正措施仍未完成。


              召回 Z-0679-2025（2024 年 10 月 25 日启动；2024 年 12 月 13 日发布；截至 2026 年 6 月状态为 Open）涉及在 IFU Revision J
              及所有更早版本下、与相同受影响系统序列号配套使用的 Galaxy 支气管镜（GALB-001）。失效模式是：当镜体处于超过约 100 度的急弯时，并非所有适配 2.1 mm
              工作通道的活检工具都能通过；强行推进工具会带来组织损伤或气胸风险。这是单腔一次性设计内在的几何约束。


              召回 Z-1734-2024（2024 年 3 月 9 日启动；2024 年 5 月 1 日发布）涉及 17
              台有线控制器（GAL-019），其扭矩校准偏移，可能导致机器人镜体出现非预期运动。气道手术中，控制器运动错误天然具有危险性。


              召回 Z-0598-2026（2025 年 9 月 12 日启动；2025 年 11 月 26 日发布）涉及 Galaxy System，原因是用户手册受密码保护，操作者无法访问安全关键的 IFU
              内容。说明书无法访问，是 FDA 针对程序误用触发召回的核心原因之一。


              FDA MAUDE 数据库记录了 2024 年 2 月的一起不良事件（MDR 18699853）：一名患者在 Galaxy 手术后死亡。医生在未按 IFU 要求进行透视验证的情况下，忽略了 6
              条镜体弯折警告信息并继续推进镜体；由此产生的镜体扭结导致双侧气胸、心脏骤停、出血和感染性休克。尽管调查将死亡归因于既有肺炎而非器械故障，该事件说明安全防护不足会放大用户错误。第二起 2025 年 MAUDE
              事件（MDR 21200488）记录了一名患者在 Galaxy 手术两天后发生卒中；报告未认定器械故障，但记录了不良结局时间线。Noah Medical 于 2026 年 5 月 26 日获得专利
              US12635860，专门针对手术系统防弯折装置，直接回应镜体弯折失效模式。


              Galaxy System 于 2023 年 3 月 1 日获得 510(k) clearance K223144，分类为带特殊控制的 Class II 支气管镜。尚无公开信息确认 Galaxy System
              获得 de novo、PMA 或 Breakthrough Device designation；这限制了其进入 CMS TCET 覆盖路径，也可能说明监管策略偏渐进，而非颠覆式。国际准入方面：截至 2026 年
              6 月，欧盟市场 CE Mark 尚未公开确认，商业足迹因此局限于美国和一个亚洲试点。
