      - number: '4.4'
        title: 资本密集度、制造和商业化成本
        blocks:
          - type: paragraph
            body: >
              Noah Medical 所处赛道，是医疗科技里资本最密集的一类：机器人平台把精密机电硬件、专有影像算法和一次性耗材整合在一起，且耗材必须按严格质量与灭菌要求生产。II 类医疗器械开发（Galaxy System
              的监管类别）的行业数据显示，从开发到上市总成本为 $2M–$30M，其中制造规模化约吃掉总开发预算的 15–25%，商业化（销售团队、KOL 项目、培训、临床支持）再吃掉
              10–20%。机器人支气管镜平台需要专门的资本设备制造基础设施、面向医生的直销和培训、每个装机点的现场临床支持，以及持续临床证据生成，这些成本类别大概率落在区间上沿。Intuitive Surgical 的
              Ion 在 2025 年装机 195 台，Ion 手术量同比增长 51%，但母公司层面也对应约 $1.3B 研发投入和庞大服务基础设施。全球医疗科技 VC 环境进一步强化了资本集中：2025 年 Q1，117
              笔交易共部署 $3.7B，资金集中在 13 笔超过 $100M 的轮次，投资人明确偏好具备商业牵引、临床验证和清晰监管路径的公司——这正是 Noah Medical 一直在搭建的画像。即便如此，2024
              年医疗科技后期融资数据显示，Series C 及以后轮次中有三分之二拿到的是持平或下调估值，说明即便公司位置不错，后期资本也更难、更稀释。以 Noah Medical 当前阶段——已经商业化、累计手术超过
              5,000 例、仍在主动生成临床证据并扩张一线基础设施——估算每月现金消耗 $5–10M，与其披露或第三方估计的员工规模（截至 2025 年底约 300+
              人）和机器人医疗科技的运营要求方向一致；但这是基于行业信息的估算，不是公司披露数据。若每月消耗 $5–10M，$150M Series B 自 2023 年 4 月起提供约 15–30 个月 runway，到
              2025 年中至下半年耗尽，时间上与报道的 2025 年 9 月后期融资相吻合。
