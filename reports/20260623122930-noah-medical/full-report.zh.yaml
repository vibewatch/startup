              已发布的机器人支气管镜市场规模区间（2026 年
              $77M–$640M）主要反映范围定义不兼容，而不是合格预测者之间的分析分歧。窄口径设备硬件估算和企业级系统加软件估算，描述的是价值链不同部分。若不披露范围方法论，任何单一估算都不应孤立引用。投资人应把自下而上的手术量估算（美国
              $75–150M）作为更保守的近期收入预测锚点。
