          score: 3
          rationale: >
            10,000+ procedures and 50+ installed systems as of April 2026 demonstrates real commercial adoption 3 years
            post-clearance. Galaxy holds ~5% of robotic bronchoscopy share. Rate is promising but absolute scale is
            sub-critical; community-hospital penetration requires confirmation.
          evidenceQuality: medium
        - label: 财务披露
          score: 1
          rationale: >
            No revenue, no gross margin, no burn rate, no runway, no cap table, no preference stack, no audited
            financials. Single highest-priority diligence gap. Cannot underwrite valuation without this data.
          evidenceQuality: low
        - label: 竞争护城河
          score: 3
          rationale: >
            TiLT+ integrated tomosynthesis provides genuine no-CBCT differentiation at community hospitals. However, J&J
            Monarch QUEST (FDA cleared March 2025) and Intuitive Ion (1,041 systems, 51% procedure growth in 2025) are
            well-funded incumbents narrowing the gap. Moat is real but contested.
          evidenceQuality: medium
        - label: 估值基础
          score: 2
          rationale: >
            $2.0B mark from unconfirmed secondary source; conflicting Latka estimate at $417.9M; no confirmed revenue
            for multiple-based support; capital efficiency ratio 3.87x is plausible but not analytically sufficient.
            Valuation basis is the second-weakest dimension after financial disclosure.
          evidenceQuality: low
        - label: 退出与回报
          score: 3
          rationale: >
            Strong strategic buyer logic (J&J, Intuitive, Stryker, Medtronic); medtech M&A at decade high in 2025
            ($80B); Bain 2026 flags "heightened competition for quality assets." No confirmed or rumoured transaction.
            IPO conditional on revenue/margin thresholds not yet demonstrated.
          evidenceQuality: medium
