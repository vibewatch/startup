      - number: '4.3'
        title: 单位经济：已知与未知
        blocks:
          - type: paragraph
            body: >
              Noah Medical 的单位经济在公开层面几乎完全不透明。公司没有披露系统 ASP、耗材
              ASP、毛利率（设备或耗材）、获客成本、回本周期，也没有披露单台装机收入。现有证据只能支持有依据的推断和同业基准。资本设备侧，Galaxy System
              的一次性支气管镜架构、紧凑占地，以及作为在位平台高性价比替代方案的定位，都指向公司有意把系统价格压在 Ion 报道的 $600,000–$750,000 之下，但没有确认标价。耗材侧，Johns Hopkins
              / Respiration（2026）研究和更早的系统性荟萃分析（Solis-Pazmino et al., Respiration 2022）共同显示，更广义市场里一次性支气管镜单支价格在 $150–$400
              之间；专有机器人平台耗材通常能拿到溢价。类比医疗科技系统里，耗材利润结构很高：Intuitive Surgical 的器械和配件分部近年公司层面毛利率约
              65–75%，对已经规模化的专有耗材业务是有用锚点。CHEST 2025 Beyond the Scope 研究部分照亮了医院端手术经济性：内镜室和 OR 场景的成本收益比均高于 1.0，说明 Galaxy
              手术可以为采用机构带来正向经济回报——这是持续使用和复购的前提。不过，医院 CBR 为正并不会直接转化为 Noah Medical
              的单位经济；后者取决于系统定价、耗材定价、COGS（每套系统和每支支气管镜的制造成本）以及单台装机的服务成本。Getlatka 第三方数据库条目声称 2025 年 ARR 为 $139.3M、估值
              $417.9M，但同一来源把 CEO 写成了另一个人，还称融资额为 $0——其收入和估值数字不可靠，不能用于承销。收入和单位经济必须通过正式尽调流程直接向公司获取。
