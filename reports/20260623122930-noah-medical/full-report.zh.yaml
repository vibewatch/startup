  - id: TE002
    title: Galaxy System——临床工作流与使用场景表
    columns:
      - 用户任务 / 步骤
      - Galaxy 前工作流
      - Galaxy System 方案
      - 可量化收益
      - 关键限制
    rows:
      - - 术前 CT 规划
        - 支气管镜医生手工标注 CT 路径
        - 从 DICOM CT 自动生成 3D 路径规划；要求 0.8–1 mm 层厚协议
        - 路径标准化、可复现；支持多操作者一致性
        - 需要专用 CT 协议；非标准层厚会削弱导航精度
      - - 导航至外周病灶
        - 手动推进支气管镜，配合透视或 EM 导航
        - EMN 引导机器人镜体推进，并实时显示相对术前 CT 的位置
        - 可到达肺外三分之一；导航成功率 100%（FRONTIER）；降低对操作者技能的依赖
        - EMN 受金属干扰影响；迂曲气道会导致镜体屈曲；距靶点 >2 cm 时精度下降
      - - 术中病灶定位
        - 无实时 CT-to-body 校正；将 EMN 位置作为 ground truth
        - TiLT+ C-arm 扫描重建 3D 位置；把导航靶点更新至术中解剖
        - 与 CBCT 的 TIL 一致率 96.7%（MATCH 2）；参与中心无需 CBCT
        - 需要屏气；增加平均 59.1 mGy 辐射剂量；手术室必须配备 C-arm
      - - 活检工具部署和确认
        - 透视引导工具推进，没有实时叠加显示
        - 增强透视显示实时工具与病灶相对位置；StrikePoint 数字化 TIL 距离；摄像头常开
        - 活检时 TIL 97%（MATCH 2）；严格诊断率 96.7%；FRONTIER 为 89.5–94.7%；活检时摄像头常开
        - USC 真实世界第 1 年气胸率 13%；迂曲气道中的镜体屈曲；IFU 合规至关重要
      - - 术后镜体移除和房间周转
        - 可复用支气管镜再处理（30–90 分钟）；存在交叉污染风险
        - 每例后丢弃一次性镜体；机器人臂清洁后复用
        - 缩短周转时间；降低交叉污染风险；简化工作流
        - 一次性镜体成本会增加单例经济负担；未公开披露单例成本
    notes: 工作流来自 MATCH 2（Respiratory Medicine 2026）和 USC JTD 学习曲线研究（2025）发表的操作描述；收益引用对照试验结果；限制引用 USC 真实世界研究和 MAUDE 不良事件数据。
