  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              机器人辅助支气管镜（RAB）于 2018 年进入商业使用，此后围绕三款 FDA 批准平台集中：Intuitive Surgical 的 Ion（2019 年 2 月获批）、Johnson & Johnson 的
              Monarch（2018 年 3 月获批，最早进入者）以及 Noah Medical 的 Galaxy System（2023 年 3
              月获批）。三者解决同一临床问题——对外周肺部病灶（PPLs）进行准确组织取样——但导航理念不同：形状感知光纤（Ion）、带机器人化 scope-in-sheath
              的电磁导航（Monarch），以及带嵌入式透视断层合成的电磁导航（Galaxy）。三款平台均定位于支气管镜套间，并在学术医学中心和高量社区医院争夺资本预算。


              三款机器人平台之外，Noah Medical 还要面对非机器人导航方案：Medtronic 的 ILLUMISITE 透视导航平台、Olympus 的 EBUS 支气管镜系列（包括 2025 年 9 月推出的
              BF-UCP190F），以及由 Siemens Cios Spin 或 GE OEC 3D C-arm 支撑的机构级 CBCT 引导流程。CT
              引导经胸针吸活检（TTNB）仍是广泛可及的现状替代方案，证据基础成熟，但气胸率显著更高。因此，竞争集合横跨高资本机器人平台、中端导航系统和成熟手术替代方案，要求 Noah Medical
              在三类场景中都建立临床和经济差异化。


              市场增长很快，但任何单个平台的装机基础相对更广泛的支气管镜设备市场仍然很小。这意味着每一次新增资本配置都会被争夺，而某家机构内的先发优势会形成有意义的多年切换壁垒。
            claimRefs:
