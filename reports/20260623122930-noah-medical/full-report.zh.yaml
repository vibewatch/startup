      - number: '5.5'
        title: FDA 批准、上市后安全记录和器械召回
        blocks:
          - type: paragraph
            body: >
              Galaxy System 于 2023 年 3 月 1 日获得 FDA 510(k) 批准（K223144），器械分类 874.4680（Bronchoscope, Flexible or
              Rigid），产品代码 EOQ，被判定为具备 Substantial Equivalence（SESE）的 II 类特殊控制器械。申请于 2022 年 10 月 4 日收到，按 Traditional
              510(k) 审查，未由第三方审查。根据 GUDID 数据库，Galaxy System（GAL-001，UDI-DI 00850048825048）为 MR Safe，标签限处方使用，并按设计为一次性使用。


              上市后安全：FDA MAUDE 数据库包含 Galaxy System 手术后的不良事件报告。2024 年 2 月事件（MDR key 18699853）中，一名患者在 Galaxy
              辅助支气管镜检查期间出现双侧气胸、心脏骤停、出血、肺炎和感染性休克；调查结论认为不良事件源于使用错误——医生在未按 IFU 要求进行透视验证的情况下，连续忽略六条镜体 buckling
              流程抑制错误信息并继续推进镜体，导致镜体打折。患者随后死亡；主治医生将死亡归因于既有疾病导致的肺炎继发感染性休克，而非器械故障。2024 年 8 月事件（MDR key
              20730618）报告术后气胸并需胸管，归因于解剖因素（气道迂曲和导管稳定性），而非器械故障。


              Class 2 Device Recall（Z-0693-2025）：2024 年 10 月 25 日，Noah Medical 发起 Class 2 召回（2024 年 12 月 18 日发布），涉及 26 台
              Galaxy System，原因是电源设计问题。召回原因：不间断电源可能存在缺陷组件，可导致电源短路或保护断路器跳闸，造成突然且不可恢复的断电；若发生在手术中，可能需要手动移除镜体，并带来肺损伤或气胸风险。FDA
              将原因判定为 Device Design。截至 2024 年 12 月 18 日发布时，召回分类为 Open；截至 2026 年 6 月，解决状态没有公开确认。
