      - number: '5.4'
        title: 临床证据——FRONTIER、MATCH、MATCH 2 和真实世界学习曲线
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，四组经同行评议或实质性发表的数据集刻画了 Galaxy System 的临床表现：


              FRONTIER（首次人体，Macquarie University Hospital，Sydney；2024 年 6 月发表于 Respirology，doi 10.1111/resp.14778）：18
              名患者，19 个结节，平均病灶大小 20 mm，距胸膜平均距离 11.6 mm。结果：导航成功率 100%，工具在病灶内确认 100%，严格诊断率 89.5%，中间诊断率 94.7%，诊断准确率
              94.7%，敏感性 94.4%，特异性 100%。两例气胸（一例需要胸腔引流）。研究由既往机器人经验有限的介入肺科医生完成，支持该系统可在机器人支气管镜新中心复制。


              MATCH（初始研究，商业化前数据）：导航和诊断率 100%，TiLT 确认 TIL 为 95%（19/20），工具接触病灶 5%（1/20），由 CBCT 验证。


              MATCH 2（前瞻性双中心，Inova Fairfax 和 CHI Memorial，2024 年 11 月至 2025 年 8 月；Respiratory Medicine 2026 年 3
              月；NCT06685133）：31 名患者，平均病灶大小 16.99 mm（±6.2 mm），13% bronchus sign，31% 胸膜基底。结果：手术成功率 100%，TiLT+ 判定 TIL 为
              97%（30/31），TiLT+ 与 CBCT 一致性 96.7%（29/30），整体 CBCT 确认 TIL 为 93.5%（29/31），严格诊断率 96.7%（20 恶性 + 10 特异性良性），气胸
              3%（1/31）。平均手术时间 46 分钟，平均 TiLT+ 辐射剂量 59.1 mGy。


              学习曲线研究（USC Keck Hospital，2024 年 2 月至 2025 年 2 月；Journal of Thoracic Disease，2025）：真实世界、非赞助、学术培训项目。91
              名患者，94 个结节，中位病灶大小 2.1 cm。整体严格诊断率 68%；气胸 13%（全部需要胸管）；一例自限性大咯血。诊断率从前六个月 61% 提升至随后六个月
              75%。学员参与和复杂解剖被识别为影响因素；结果可比 TARGET 试验 Monarch 基准（61.6%）。冷冻探针显示出更高诊断率。


              Beyond the Scope（社区医院，连续 70 例，18 个月；CHEST 2025）：严格诊断率 89%。诊断率的关键预测因素：≥2
              个增强透视平面定位（p<0.001）以及通过外周可视化进行直接工具调整（p=0.01）。成本收益比 1.5（内镜室）和 1.1（OR）——二者均具备财务可行性（>1）。
