      - number: '3.6'
        title: 商业动态、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              医院在机器人支气管镜上的切换成本很高，结构上有利于既有厂商。机器人支气管镜系统需要专有器械和耗材、5–10
              年服务合同、大量员工资质认证，以及手术房间重新配置。一家医院若已在某个平台上训练介入肺病团队，转向竞争对手时会面对再培训成本、资质认证周期和闲置库存。Intuitive Surgical
              还通过跨平台依赖放大这一点：同时运营 da Vinci 系统的 Ion 客户，可受益于整合培训项目和服务关系，增加切换任何单个平台的集成惩罚。


              Intuitive 的规模优势体现在手术经济性和数据资产上。Ion 2026 年 Q1 手术量 39% 的增长轨迹，正在生成结果数据、操作者经验和服务收入密度，较小装机基础竞争者近期难以匹敌。J&J 对
              Polyphonic 生态的投入，把 Monarch 定位为医院系统中的企业级平台；这些医院系统会在多个专科标准化采用 J&J 外科技术。这是一家 Noah Medical
              这样的纯支气管镜公司难以复制的分销优势。


              所有平台最重要的结构性约束是报销：机器人支气管镜与传统导航支气管镜使用同一套 CPT 代码（CPT
              31627）报销，机器人引导没有增量溢价。无论平台成本如何，这都会封顶医院每例手术收入，并把经济论证压到次级收益上（减少重复活检、下游肿瘤收入、患者周转）。Baylor College of Medicine
              2024 年分析发现，机器人手术项目尽管平台和手术成本显著更高，通常每例保险报销更低；项目需要至少 120 例 / 年才能实现财务可持续——这一量级门槛近期排除了大多数社区医院。该不利经济现实同等约束所有 RAB
              竞争者，但对试图替代既有项目的新进入者影响更大，因为后者面对的是资本已摊销的现有项目。


              Noah Medical 的一次性镜体策略降低了灭菌开销，但提高了单例耗材成本，形成不同于 Ion 的成本结构。商业含义是，Galaxy 相对 Ion 和 Monarch
              的总拥有成本，仍是医院采购团队尽调的关键问题。
