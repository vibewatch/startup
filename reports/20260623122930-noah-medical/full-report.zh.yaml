  - id: TV002
    title: 投资论点与反论点
    columns:
      - 维度
      - 支持论点
      - 反论点 / 哪些因素会改变判断
    rows:
      - - 市场规模
        - 机器人支气管镜市场到 2031 年增长至 $234M；更广义手术机器人市场到 2032 年达 $16.4B；肺癌筛查 LDCT 推动结构性需求
        - 市场增长未兑现；TPT 到期后，付款方限制或医院预算压力压制机器人采用
      - - 技术差异化
        - TiLT+ 集成断层合成无需 CBCT 即实现 96.7% 诊断率；Galaxy 是唯一不要求社区医院配备辅助影像的平台
        - J&J Monarch QUEST（2025 年 3 月获 FDA 批准）或改进后的 Ion 导航缩小影像差距；差异化叙事变弱
      - - 商业牵引
        - 截至 2026 年 4 月，手术量超过 10,000 例、装机超过 50 台；自 2023 年 3 月 FDA 批准以来手术量快速爬坡
        - 装机基数仍未成规模；手术量集中在少数高量学术中心；社区医院渗透尚未确认
      - - 财务画像
        - 资本设备加耗材的剃刀 / 刀片模式会随着装机基数增长产生经常性收入；可比公司 ISRG 交易于 13x EV/Revenue
        - 收入未确认；Latka 对 $139.3M ARR 的估算可信度低；烧钱速度、利润率和 runway 完全未披露
      - - 退出与回报
        - 战略买方池强（J&J、Intuitive、Stryker、Medtronic、Olympus），且与其产品组合逻辑直接匹配；医疗技术 M&A 在 2025 年达到十年高点（$80B）
        - 无确认或传闻收购；优先权堆栈、反稀释条款和清算瀑布未知；以当前披露水平，尚未达到 IPO 门槛
      - - 负面信号
        - 26 个月内四次 Class 2 召回；截至 2026 年 6 月两项召回未关闭；无专用 CPT 代码；TPT 报销在 2026 年底到期
        - 更多召回或 MAUDE 不良事件、报销恶化，或 down round 都会显著削弱论点
    claimRefs:
      - CV001
      - CV012
      - CV015
      - CV022
      - CV028
      - CV039
      - CV040
      - CV044
      - CV046
    notes: 论点和反论点反映截至 2026 年 6 月公开可观察证据和分析推断。重要支持论点依赖未确认财务指标；反论点来自已验证的负面信号。本表并未完整列举所有风险。
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含企业价值
      - 概率信号
      - 下行触发器
    rows:
      - - 牛市
        - 到 2028 年 Galaxy 装机超过 200 台；收入 $300–500M，毛利率 65–70%；TPT 由专用 CPT 代码接续；无新增召回；以 8–12x 收入完成 M&A 退出或 IPO
        - $3.0B–$6.0B
        - 低到中——需要确认商业动能、持续报销和竞争守位
        - 报销坍塌、被 Ion/Monarch QUEST 竞争替代，或新增器械召回
      - - 基准
        - 到 2027 年 Galaxy 装机 80–100 台；收入 $100–200M；TPT 到期但医院通过 DRG 上调吸收；新增一次召回但可控；下一轮或战略出售维持约 $2.0B 标记
        - $1.5B–$2.5B
        - 中——若财务证据确认，则与当前轨迹一致
        - Down round、低于 $2.0B 的 flat round，或社区医院商业化延迟
      - - 熊市
        - TPT 到期且无后续支付；Ion/Monarch QUEST 侵蚀社区医院份额；召回加重医院犹豫；Series C 以 $500M–$1.0B flat 或 down
        - $0.5B–$1.0B
        - 中——负面信号真实且临近（TPT 2026 年底结束）
        - 报销断崖、安全召回升级和竞争份额流失同时发生
    claimRefs:
