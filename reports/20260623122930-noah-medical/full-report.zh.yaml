  - id: TU005
    title: 扩张信号与集中度风险评估
    columns:
      - 因素
      - 观察到的信号 / 证据
      - 集中度 / 扩张风险
      - 影响
      - 尽调路径
    rows:
      - - KOL 驱动采用
        - 早期站点的具名医生（Hogarth、Bhadra、Mahajan）是主要倡导者；他们都已披露或正在形成与 Noah Medical 的联系
        - 早期证据高度集中在存在利益冲突的站点
        - 如果 KOL 医生离职、迁移或减少手术量，站点级使用量可能下降
        - 索取各具名站点的站点级使用量数据和多用户证据
      - - 网络内扩散
        - Ingalls Memorial（2026 年 4 月）借 UChicago Medicine 网络锚点采用；通过 Bhadra 连接 CommonSpirit Health 肺部委员会
        - 医疗系统网络成为自然扩张渠道
        - 可能在大型 IDN（CommonSpirit、Northwell、UChicago）内推动多站点订单
        - 识别已知网络附属机构中具备介入肺病能力的医院数量
      - - 社区医院市场打开
        - Beyond the Scope 和 MedCity News 文章确认社区医院可行；Camden Clark 证据被引用为普及化信号
        - 美国社区医院站点可能再增加数百个
        - 可触达机会大，但需要持续销售支持和账单教育
        - 跟踪 TPT 之后新社区站点上线和报销采用情况
      - - 国际扩张
        - Prince of Wales Hospital（HK）试验进行中；Macquarie（AU）FRONTIER 已发表
        - 亚洲只有单项试验；美国以外未披露商业收入
        - 亚太肺癌负担大；香港试验可能打开中国、日本更多站点
        - 索取按国家划分的国际站点管线和监管状态
      - - TPT 后报销悬崖（2026 年 12 月）
        - CMS C1601 TPT 于 2026 年 12 月到期（自 2024 年 1 月起 3 年窗口）
        - 2026 年后，新 Galaxy 站点经济性失去增量支付
        - 到期后，社区医院潜在客户的 ROI 计算可能放慢；现有站点不受影响
        - 跟踪 CMS 报销更新周期；评估 Noah Medical 缓释策略
      - - 未披露装机基数 / 客户集中度
        - 总站点数、前 5 大客户占比和收入集中度均未披露
        - 如果 5,000 例手术集中在 5–10 个站点，收入会高度集中
        - 如果 KOL 站点贡献大多数手术，客户集中度风险高
        - 索取头部站点手术量、总装机基数和单账户收入
