      - number: '4.7'
        title: 财务结论：收入质量、利润率路径和尽调阻塞点
        blocks:
          - type: paragraph
            body: >
              Noah Medical 的财务画像有一个有吸引力的资本形成故事：已确认的 $150M SoftBank 领投轮、后续注资的可信报道（若属实，总融资约 $516M），以及一个「资本设备 +
              经常性耗材」收入模型；如果该模型按 Ion 级经济性落地，规模化后耗材毛利率可能具备吸引力。到 2025 年 3 月达到 5,000+ 例手术，CHEST 2025
              在社区医院证实正向手术经济性，Intuitive Ion 2025 财年手术量增长 51%，这些都说明机器人支气管镜市场真实存在且在增长。不过，Noah Medical
              的收入质量、利润率轨迹和资本充足性，无法从公开信息评估。理论上的高毛利耗材业务（如果放量）与当前尚未规模化制造爬坡、多站点临床支持、全国商业扩张带来的现金消耗之间的差值，就是核心财务承销缺口。报销环境还带来额外的选择权风险：当前
              Medicare 按服务付费场景下手术经济性为正，但任何支付方驱动的覆盖限制或资本预算冻结，都会拖慢装机和使用率增长。正式尽调必须优先获取：(1) 经审计或管理层编制的分业务收入和毛利表（资本设备 vs. 耗材
              vs. 服务）；(2) 完整融资时间线，包括 B 轮前轮次和任何 2025 年融资；(3) 月度 burn rate 和预计 runway；(4) 股权结构、优先权层级和董事会构成；(5)
              客户合同条款，包括定价和复购承诺；(6) 制造 COGS 和质量体系审计准备度。没有这些，就无法作出有财务依据的投资决策。
