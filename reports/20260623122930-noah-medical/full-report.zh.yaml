      - number: '6.5'
        title: 报销框架和客户站点经济性
        blocks:
          - type: paragraph
            body: >-
              Galaxy System 相关手术的报销环境，自 2023 年商业化启动后已明显改善。截至 2024 年 1 月 1 日，CMS 将符合条件、用于特定手术的一次性肺部支气管镜纳入 HCPCS 代码 C1601
              下的 Transitional Pass-Through（TPT）资格。Noah Medical 委托的第三方法律分析认为，Galaxy 一次性支气管镜似乎符合 TPT 支付标准，可在标准 Medicare
              APC 费率之外，为医院门诊带来增量支付。该 TPT 资格自 2024 年 1 月起为期三年，客户至少到 2026 年 12 月都能获得更强的报销支持。核心手术代码是 CPT 31628 和
              31629（经支气管活检），Noah Medical 称这两个代码可与 C1601 一并计费。

              CHEST 2025 上展示的「Beyond the Scope」社区医院研究量化了经济性：内镜室手术的成本收益比为 1.5，手术室为 1.1，均高于研究者采用的 1.0 财务可行门槛。Beyond the
              Scope 主要研究者 Dr. Mathew 于 2026 年 3 月在 MedCity News 发表的观点文章进一步说明，将病例从手术室转至内镜室，并结合按复杂度调整的 APC 计费（CPT 31628 +
              31629 + 31653），可以「抬高成本收益分析、缩短回本周期，并提升单例贡献利润」。Dr. Mahajan（Inova Fairfax）还表示，Galaxy System
              依靠一次性支气管镜设计压低直接成本，具备「财务可持续性」。

              资本设备回本周期取决于手术量和医院付款方结构。利润率紧张的机构，尤其是较小的社区医院，在内镜室场景下经济性可行，但需要严格拉升手术量并守住计费纪律。TPT 支付机制相当于一项采用补贴，2026
              年后到期；激励结束后，新站点经济性可能面临逆风。
