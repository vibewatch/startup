  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >
              Noah Medical 的商业模式沿用医疗科技里的「剃刀 + 刀片」逻辑：医院先购买 Galaxy System
              资本设备平台，再在每台手术中消耗一支一次性支气管镜。公司明确称，自己销售的是面向外周肺结节活检的资本系统加一次性耗材。这个架构拆出两条收入线：一次性的设备销售，以及随装机量和手术使用率放大的经常性耗材收入。第三条收入——服务和维护合同——在机器人医疗科技里很常见，但
              Noah Medical 尚未单独披露。手术组件也可能形成配件线（导引鞘、针具，以及与支气管镜配套使用的其他一次性工具），不过公司尚未描述独立配件 SKU。Noah Medical 没有公开 Galaxy
              System 的标价、一次性支气管镜价格，也没有披露任何实际成交价。竞争背景给出了有用锚点：采购资料显示，Intuitive Surgical 的 Ion 腔内系统单台约
              $600,000–$750,000；Intuitive 整体器械和配件分部 2025 年在 315 万例 da Vinci 手术上贡献约
              $6.02B，说明该模式规模化后，经常性收入能撬动很高的财务杠杆。Johns Hopkins University 发表在 Respiration（2026）的前瞻性观察研究测得，一次性柔性支气管镜成本为每支
              $300–$400，同一科室可重复使用支气管镜的单次使用成本为 $198–$202；与机器人平台兼容的专有耗材，逻辑上会定价在通用一次性耗材区间或更高。CHEST 2025 上展示的 Beyond the
              Scope 社区医院研究报告，成本收益比分别为 1.5（内镜室）和 1.1（手术室），说明即便在非学术中心，以当前手术量也具备财务可行性；但研究没有披露公司在这些手术上的收入或利润率。
