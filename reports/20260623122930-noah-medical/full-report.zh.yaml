      - number: '8.8'
        title: 图表与证据
        blocks:
          - type: callout
            title: $2.0B 估值未确认——没有官方确认前不要锚定
            body: >
              Noah Medical 的 $2.0B 投后估值完全来自 Premier Alternatives（引用 PitchBook）和 Tracxn。Noah Medical 未发布新闻稿、未提交 SEC Form
              D，也没有任何官方投资者沟通确认 2025 年 9 月 $230M 融资或 $2.0B 标记。分析师截至 2026 年 6 月 23
              日未能找到官方文件。任何基于该估值的投资决策，都必须把官方确认作为前置条件。Latka 提供的 $417.9M 冲突数字虽然置信度较低，但对数据源可靠性构成警示。投资者应将 $2.0B
              视为指示性区间锚点，而非审计或确认后的公允价值。
            calloutType: insight
            claimRefs:
              - CV002
              - CV004
              - CV006
          - type: callout
            title: TPT 报销将于 2026 年底到期——短期重大催化因素
            body: >
              CMS 对机器人支气管镜（HCPCS 代码 C1601）的 Transitional Pass-Through (TPT) 补充支付计划，将在 2026
              日历年底到期。多名报销专家和临床期刊都指出，如果没有后续支付机制，到期会拿掉一笔有意义的增量付款；这笔钱此前支撑了医院采购决策。若医院在报销路径明朗前推迟或取消采购 Galaxy
              System，基础情景估值所依赖的手术量爬坡将受到实质损害。这个催化因素临近（2026 下半年）、可观察，并与 $2.0B 估值标记负相关。它是最值得行动的短期监测事项。
            calloutType: risk
            claimRefs:
              - CV039
              - CV046
