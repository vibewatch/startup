      - number: '5.7'
        title: 技术约束、证据限制和尽调缺口
        blocks:
          - type: paragraph
            body: >
              评估 2026 年 Galaxy System 产品风险时，几个技术约束和证据限制具有实质性：


              电磁导航依赖：Galaxy System 使用 EMN 进行活检前导航，容易受到手术环境中金属干扰和 EM 场畸变导致的配准误差影响。TiLT+ 可在导航后校正解剖漂移，但 EMN
              初始路径跟踪精度会在高铁磁环境中下降。竞争性形状感测系统（Intuitive Ion）完全避开了这一类错误。


              CT-to-body divergence 校正窗口：TiLT+ 只有在镜体已由 EMN 导航到目标 2–3 cm 内之后，才校正解剖漂移。如果初始 EMN
              路径对齐在迂曲气道中失败——例如正确的段支气管无法进入——操作者可能无法获得 TiLT+ 扫描所需的可行起点，技术最关键的优势也就无法触达。


              辐射暴露：按 MATCH 2，TiLT+ 单次扫描平均剂量为 59.1 mGy。它低于完整 CBCT 采集，但仍是在标准透视之上的增量。在高量支气管镜项目中，TiLT+
              带来的医护和患者累积辐射暴露，需要按机构辐射安全规程跟踪；MATCH 2 论文没有披露工作人员剂量监测数据。


              证据基础狭窄且非对照：所有受控试验都明确排除了磨玻璃结节（GGOs），而这类结节在肺癌筛查检出中占比重要且仍在增长。MATCH 2 和 FRONTIER 都是小型单臂队列（n=31 和 n=19）。截至 2026
              年 6 月，没有随机对照试验发表，直接比较 Galaxy 与 Ion 或 Monarch。唯一独立真实世界学术研究（USC JTD，2025）结果显著差于受控试验：诊断率 68%，气胸 13%。


              C-arm 依赖和资本要求：Galaxy System 每次 TiLT+ 扫描都需要标准 C-arm 透视设备；该 C-arm 并非专有设备，但必须在手术房间可用。支气管镜室没有移动 C-arm
              的中心，会面临额外资本投入或排程依赖。


              镜体 buckling 使用错误风险：最严重的 MAUDE 事件，是在没有透视验证的情况下反复忽略镜体 buckling 流程抑制警告导致。系统提供清晰屏幕警告和 IFU
              指引；该事件被归因为使用错误，但这一失效路径需要强操作员培训来缓释。近期授权的防 buckling 专利（US12635860，2026 年 5 月）显示公司正在主动做工程缓释。


              电源召回：2024 年 10 月，26 台 Galaxy System 因电源设计问题发生 Class 2
              召回，属于上市后设计质量事件。失效模式——支气管镜手术中不可恢复断电，需要手动移除镜体——带来气胸风险。截至运行日期，召回解决状态没有公开确认。
