      - number: '6.3'
        title: 采用轨迹和手术里程碑证据
        blocks:
          - type: paragraph
            body: >-
              Noah Medical 的手术量里程碑，是公开层面最清晰的采用速度代理指标。公司于 2023 年 5 月实现美国首次商业使用，2024 年 1 月完成美国第 500 例手术（上市后约八个月），并于 2025 年
              3 月完成美国第 5,000 例手术——从首例到五千例用时 22 个月。从第 500 例到第 5,000 例间隔约 14 个月，意味着商业化放大阶段平均每月约 320–370 例。截至运行日期（2026 年 6
              月），累计手术量未披露。

              地理扩张与手术量增长并行。澳大利亚首次人体使用（2023 年 3 月）早于美国商业化，并使 Macquarie University Hospital 成为早期临床证据生成者。亚洲首次商业使用发生在 Prince
              of Wales Hospital（2023 年 12 月），并在香港启动前瞻性临床试验，把证据基础扩展到国际市场。Ingalls Memorial（UChicago Medicine 网络）2026 年 4
              月上线，证明网络内扩散；具名用户覆盖至少六个美国州（California、Tennessee、New York、Virginia、West Virginia、通过 Prisma Health 覆盖 North
              Carolina / South Carolina 区域）和两个国际地区（Australia、Hong Kong），确认了多地部署。

              手术量增长轨迹与多站点采用一致，但总装机站点数仍未披露，因此无法独立计算单站点平均使用率，也无法区分快速放量站点和低量部署。公司沟通从手术里程碑转向「快速采用」表述，却不给账户数量，这是 pre-IPO
              医疗器械公司管理竞争情报时常见的披露模式。
