      - number: '2.6'
        title: 规模测算不确定性与证据缺口
        blocks:
          - type: paragraph
            body: >-
              本章最重要的证据缺口，是机器人支气管镜市场规模估算相差十倍：同一名义细分市场在 2025–2026 年从 $77 million 到 $640 million
              不等。这主要不是预测分歧，而是范围定义分歧：只计算机器人平台硬件收入的窄口径报告，得出的数字比把导航软件、EBUS
              附件和耗材打包进去的宽口径报告小一个数量级。没有报告提供可下载方法论，无法独立调和。因此，本章任何市场规模引用都应被视为方向性指标，而非权威数字；投资人应通过医院采购数据的一手渠道核查，自下而上搭建估算。第二个缺口是美国机器人支气管镜系统装机基础缺少公开数据。Intuitive
              Surgical（Ion）和 Johnson and Johnson（Monarch）只披露合计手术量；Noah Medical 的 Galaxy System 在超过 500
              例里程碑后，系统数量同样不透明。没有装机基础数字，就无法为任何单个平台精确计算 SOM。第三个缺口是商业支付方政策异质性：Medicare 在 CPT 31627 和 APC 5153
              下的报销已经编码并公开可查，但商业保险对机器人导航支气管镜的事先授权要求和覆盖政策高度可变，且未系统发布，导致医院支气管镜项目收入可见性不可预测。这些缺口不会致命破坏投资假设——疾病负担数据和临床证据扎实——但会阻止精确
              SOM 测算，并因此限制对该领域任何单平台竞争者近期收入预测的信心。
            claimRefs:
              - CM041
              - CM042
              - CM043
