      - number: '3.4'
        title: 相邻方案与非机器人替代方案
        blocks:
          - type: paragraph
            body: >
              Medtronic 的 ILLUMISITE 透视导航平台，是临床验证最充分的非机器人替代方案。ILLUMISITE 使用数字断层合成实时校正 CT-to-body 偏移，并在整个活检序列中提供连续导航引导。关键
              VERITAS 随机对照试验——该领域唯一 RCT——显示，ILLUMISITE 在 12 个月内达到 79.0% 诊断准确率，高于 CT 引导经胸针吸活检的 73.6%，且患者并发症少 6x（5.0% vs
              29.2%）。一项 72 个结节的单中心回顾性研究报告 87% 诊断率。ILLUMISITE 资本成本低于机器人平台（约 ~$500K vs
              $1.0–1.1M），且不需要机器人资本审批流程，因此可进入已推迟机器人采购的机构。


              Olympus 通过 EBUS 支气管镜产品组合竞争，最新产品是 2025 年 9 月在 EMEA 和 Asia-Pacific 推出的 BF-UCP190F。BF-UCP190F 外径 5.9mm（上一代为
              6mm+）、上弯角 170 度、前斜视角 14 度，把 EBUS-TBNA 触达范围延伸到以往凸阵 EBUS 难以进入的段和亚段气道。Olympus
              拥有非常庞大的全球支气管镜设备装机基础，并受益于与肺病科的深厚关系，尤其在纵隔分期场景。Olympus 的外周支气管镜方案（引导鞘、rEBUS）更多是补充机器人导航，而非直接替代；但新的细径 EBUS
              镜缩小了外周病灶场景的差距。


              使用机构 C-arm（Siemens Cios Spin、GE OEC 3D）的 CBCT 引导支气管镜项目，是高性能基础设施替代方案；一些中心会用它替代或搭配机器人平台。CBCT 在导航平台之外增加
              $400–700K 移动 C-arm 资本开支，但提供体积化实时 3D 病灶内工具确认；Siemens 和 GE 都营销与 Ion 集成的专用流程（NaviLink 3D）。在欧洲经济模型中，独立 CBCT
              支气管镜相对 CT 引导 TTNB 已被证明具成本效益。


              一项 ERS 2025 临床试验（University Hospital Zurich，n=78 名患者、127 个结节）显示，机器人辅助支气管镜可到达 84% 的外周肿瘤，传统支气管镜仅
              23%；但研究也指出机器人系统成本 >$1.1M，且每例手术增加约 ~$2,350——这是独立临床研究者给出的明确成本效益警示。
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
