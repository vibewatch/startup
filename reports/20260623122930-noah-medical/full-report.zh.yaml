  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已披露估值与融资证据
        blocks:
          - type: paragraph
            body: >
              Noah Medical 最扎实记录在案的融资事件，是 2023 年 4 月 19 日宣布的 $150M Series B，由 SoftBank Vision Fund 和 Prosperity7
              Ventures（Aramco 关联方）领投，广泛财团包括 Tiger Global、Hillhouse、Sequoia China、Shangbay Capital、Uphonest
              Capital、Sunmed Capital、Lyfe Capital、1955 Capital 和 AME Cloud
              Ventures。该轮通过公司新闻稿宣布，并由多家独立交易报道媒体佐证，仍是唯一官方确认的融资事件。Tracxn 的 Noah Medical 公开档案（最后更新于 2026 年 6 月 6
              日）将公司归类为「soonicorn」，并将 2021 年 1 月早期 VC 轮列为可见的 B 轮前融资；完整融资历史部分受限。Premier Alternatives 引用 PitchBook 数据称，2025
              年 9 月有一轮 $230M Later Stage VC，会使累计融资约达 $516.8M，并在 2025 年 9 月 24 日形成 $2.0B 投后估值——资本效率比为 3.87x。Noah Medical
              未发布任何官方新闻稿或声明确认该轮融资；缺少官方确认，意味着 $2.0B 数字只能视为已报道但未验证。第三个来源 Latka 报告了一个严重冲突的 $417.9M 估值和 $139.3M ARR；Latka
              对私营公司的方法不透明，可靠性较低。截至 2026 年 6 月，上述三个数据点——$150M 已确认 Series B、$2.0B 未确认（Premier/PitchBook）和 $417.9M
              冲突值（Latka）——构成公开可得估值证据的全部范围。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV043
      - number: '8.2'
        title: 基于融资的估值启发式
        blocks:
          - type: paragraph
            body: >
              在没有确认收入的情况下，分析师通常用融资启发式框定私营公司估值。对 Noah Medical 而言，3.87x 资本效率比（报道的 $2.0B 估值 / $516.8M
              融资额）是一个有用起点，尽管它把投后会计口径与经济价值混在一起。Later Stage VC 阶段的私营医疗机器人公司，资本效率比通常在 2x 至 6x 之间，取决于技术成熟度、装机基数和投资者信心——Noah
              Medical 的 3.87x 稳稳落在区间内。但资本效率比既不衡量盈利能力，也不衡量增长率；它只描述融资额与上一轮设定估值之间的关系。Tracxn 融资数据识别出 2021 年 1 月的一轮早期
              VC（第三方报道约 $137M），早于 2023 年 4 月 Series B。若报道中的 2025 年 9 月 $230M 融资属实，则 2023 年 4 月 Series B 到 2025
              年轮次之间的估值上调，隐含与商业进展相一致的显著重定价（截至 2025 年 3 月 5,000 例手术、Galaxy 2.0 发布、CHEST 2025
              数据）。资本效率比不代表内在公允价值；更应理解为拥有信息优势的机构投资者设定的市场出清价格。没有确认收入数字，就无法计算收入倍数；因此分析师拒绝套用收入倍数，改用可比公司基准和情景分析。
