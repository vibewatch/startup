      - number: '3.2'
        title: Intuitive Surgical Ion —— 主要既有厂商与规模领导者
        blocks:
          - type: paragraph
            body: >
              按装机基础看，Intuitive Surgical 的 Ion 是机器人支气管镜市场份额领导者；截至 2026 年 Q1，全球装机 1,041 台（同比增长 22%）。Ion 手术量在 2026 年 Q1
              同比增长 39%，达到约 43,000 例，使其成为当季 Intuitive 产品组合中增长最快的细分业务。Q1 2026 财报电话会上引用的 Mayo Clinic 数据显示，Ion 诊断率
              79%，恶性肿瘤敏感性 85%，强化了 Intuitive 在医院采购讨论中的临床叙事。


              Ion 的核心技术差异点是自研形状感知光纤。该光纤沿导管全长提供连续实时位置反馈，不依赖电磁导航，因此避开了 Monarch 和 Galaxy 等 EMN 系统面临的干扰问题和配准误差。系统使用 3.5mm
              外径可弯曲导管和 1.8mm 可移除视觉探针；插入活检工具前必须撤出探针，因此取样瞬间无法直接可视化。因此，确认成像（径向 EBUS、透视，或通过 Siemens NaviLink 3D / GE OEC 集成的
              CBCT）对 Ion 项目具有运营重要性。


              Intuitive 的竞争护城河远不止支气管镜导管：Ion 受益于 da Vinci 品牌已建立的医院关系、ISRG 覆盖全球 11,000 多台 da Vinci
              系统的培训基础设施和服务网络，以及能产生跨平台数据整合的 My Intuitive+ 数字平台。用于细胞学充分性的 Rapid On-Site Evaluation（ROSE）正在为 Ion
              开发，可补上一个剩余流程缺口。Ion 的定价（约 ~$1.0–1.1M 资本设备加自有器械）和 ISRG 服务合同，为任何已装机客户制造高切换成本。
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: J&J / Auris Monarch —— 先发者，持续投入数字生态
        blocks:
          - type: paragraph
            body: >
              Johnson & Johnson 于 2019 年以 $3.4 billion 收购 Auris Health，此后持续投入，把 Monarch 平台从最初的电磁导航架构推进为 AI
              驱动、成像集成的系统。Monarch 是首个获得 FDA 批准的机器人辅助支气管镜平台（2018 年 3 月），并保留了 Ion 商业发布前几年建立的有意义装机基础。


              最近最重要的进展是 MONARCH QUEST，它于 2025 年 3 月 12 日获得 FDA 510(k) 批准。QUEST 集成了 NVIDIA RTX 驱动的 AI 导航栈，相比上一代将机载算力提高
              260%；通过与 GE HealthCare OEC 3D 移动 CBCT 系统的验证接口，加入术中 3D 成像数据；并把数字能力从术前规划延伸到术后病例分析。QUEST 也把 Monarch 定位为 J&J
              Polyphonic 数字手术生态中未来 AI 软件发布的承载平台。该生态连接 J&J 更广产品组合中的外科技术、机器人和软件；在已押注 J&J 外科产品线的企业级医院系统里，这一平台策略可能让 Monarch
              形成差异化。


              临床结果数据是 Monarch 的实质逆风：一项 2025 年倾向评分匹配、单中心回顾性研究（n=365）发现，Ion 诊断率为 84.2%，Monarch 为 71.0%（p=0.003）；Ion
              还显示更短手术时间（中位数 37 vs 70 分钟，p<0.001）、更短辐射时间和更低辐射剂量。Ion 的气胸率数值更低（1.0% vs
              4.3%），但未达统计显著（p=0.089）。目前尚无随机对照试验直接比较两款平台，该研究的回顾性单中心设计也限制了可推广性。J&J 对 QUEST 的投入及其 CBCT 合作，可能在前瞻性数据中缩小性能差距。
