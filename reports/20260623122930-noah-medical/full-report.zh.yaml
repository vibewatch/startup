      - number: '2.5'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              机器人支气管镜的结构性增长假设建立在四个相互强化的驱动因素上。第一，2021 年 USPSTF 指南扩展将合格筛查人群几乎翻倍至 14.1 million，正在逐步增加 LDCT
              扫描量，进而扩大需要评估的检出结节管线。第二，临床证据正在变强：DYSTRICT 研究（ERJO，2025，PMC）显示，形状感知机器人支气管镜取得与 CT 引导活检相当的严格诊断率（74% vs
              79%，p=0.201），同时气胸率（OR 0.04）和住院率（OR 0.35）显著更低。安全性差异支持临床偏好，尤其在支付方越来越追踪并发症成本时。第三，AI 和成像集成正在降低技能门槛：嵌入高级透视或
              C-arm 断层成像的二代平台无需额外 CBCT 资本设备，并能缩短手术周期，使社区医院即使没有大体量也能跑通经济模型。第四，APC
              复杂度调整——在内镜套间而非手术室使用打包代码——把原本边际或盈亏平衡的手术转化为有利润的服务线。与这些驱动因素相对，约束同样显著。2026 年 CPT 31627 设施费率
              $85，相对资本成本结构性不足，形成报销缺口，需要高手术量或创造性编码策略才能弥合。每个平台 $1–2 million 的资本开支，加上每年 $150,000–$300,000
              的维护和耗材，使中等量级下回本期拉长到三到五年。介入肺病 fellowship 管线有限：ACGME 认证培训项目每年只产出数量不多的委员会认证介入肺病医生，成为主要中心之外扩张的劳动力瓶颈。最后，LDCT
              筛查渗透缺口——合格成年人覆盖率 18%——意味着流入活检的需求漏斗远低于理论容量。提高筛查依从性和随访路径，是必要的市场基础设施投资，单个器械公司无法控制，但其推进速度会显著决定未来五年可触达市场的大小。
            claimRefs:
