      - number: '5.3'
        title: 临床流程、支气管镜设计和配件栈
        blocks:
          - type: paragraph
            body: >
              Galaxy System 手术流程按明确顺序推进：术前 CT 上传和 3D 路径规划、患者在 EMN 兼容手术台上摆位、镜体对接和配准、EMN 引导导航至病灶附近（约 2 cm）、TiLT+
              断层合成扫描实时定位病灶、增强透视引导下部署活检工具，并取样组织。一些机构使用细胞技术师进行快速现场评估（ROSE），确认样本是否足够。USC 和 MATCH 2
              发表的病例系列采用全身麻醉和气管插管；部分中心按改良 VESPA 试验方法设置呼吸机（TV 8 mL/kg IBW，PEEP 8–12 cmH2O），以减少 TiLT+ 扫描期间的肺不张。


              一次性支气管镜外径 4.0 mm，工作通道 2.1 mm，可四向弯曲。摄像头和 LED 光源集成在尖端模块中，活检时仍留在原位，因此整个手术包括取样瞬间都能直接可视化。这种常开可视化，是相对 Intuitive
              Ion 设计的关键流程差异；Ion 在插入活检工具前必须先撤出视觉探针。


              发表病例系列记录了 Galaxy System 2.1 mm 工作通道使用的活检工具：21-gauge PeriView FLEX 经支气管 FNA 针（Olympus）、1.1 mm
              柔性一次性冷冻探针（ERBECRYO 2, Erbe Elektromedizin）、SuperDimension 活检钳（Medtronic）和细胞刷。在 USC JTD 真实世界研究中，1.1 mm
              冷冻探针显示出最高诊断率。径向 EBUS 也可以加入，用于独立确认病灶。


              系统安装和撤场面向支气管镜室呼吸治疗师设计，早期采用阶段由 Noah Medical 现场代表支持。公司在 Insights 页面提供一套培训资源库，包括白皮书和录制演讲，覆盖机构上线主题（例如「Building
              a Robotic Lung Biopsy Program」「The Galaxy Experience: First 90 Cases」）。
