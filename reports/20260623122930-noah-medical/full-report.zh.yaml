          - type: callout
            title: 临床证据支持由安全性驱动的替代
            body: >-
              DYSTRICT 研究（PMC13139926，2025）提供了迄今最强的随机对照数据：形状感知机器人支气管镜达到与 CT 引导经胸活检相当的严格诊断率（74% vs
              79%，p=0.201），且安全性显著更好——气胸 OR 0.04、住院 OR 0.35。安全性差异为用机器人支气管镜替代 CT
              引导活检、作为可达外周肺结节首选一线方案，创造了与支付方一致的经济理由，尤其考虑到气胸管理的下游成本。
