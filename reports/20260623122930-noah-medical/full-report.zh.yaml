      - number: '3.7'
        title: 图表
        blocks:
          - type: callout
            title: 报销天花板同等约束所有 RAB 平台，并对新进入者伤害更大
            body: >
              没有任何机器人支气管镜平台能相对传统导航支气管镜获得 CPT 代码溢价（CPT 31627，设施费率约 ~$85）。财务可持续需要捕获下游肿瘤收入，并达到最低手术量（约 ~120 例 /
              年），这一门槛主要只有高量学术中心和大型社区中心能达到。缺少报销护城河意味着 Noah Medical、Ion 和 Monarch 竞争的是总拥有成本和下游收入捕获，而不是可计费手术差异化。对 Noah
              Medical 而言，风险在于约束医院采用的经济性，对 Galaxy 和更大规模竞争对手同样不利，而后者能借更广产品组合更容易吸收资本损失。
            calloutType: risk
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
          - type: callout
            title: Galaxy 的嵌入式成像策略打开社区医院层级，Ion 和 Monarch 受基础设施限制
            body: >
              Galaxy 的 TiLT+ 技术使用多数支气管镜套间已有的透视设备，实现 96.7% 的 CBCT 一致病灶内工具确认；Ion 需要外部 CBCT（或径向 EBUS 加透视），Monarch QUEST 需要
              GE OEC 3D C-arm，才能获得同等 3D 确认。这意味着 Galaxy 可在约 80% 没有专用手术 CBCT 的美国医院中，提供高置信度外周结节活检；这是 Ion 和 Monarch
              现有配置无法触达的结构性 TAM 扩张。Noah Medical 的「Beyond the Scope」社区医院数据（89% DY，成本收益比 >1）是这一假设的初始证据点。
            calloutType: insight
