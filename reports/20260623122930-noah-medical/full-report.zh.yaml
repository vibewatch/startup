            body: >-
              作为非上市公司，Noah Medical 多项封面指标缺少公开证据支撑，本章将其明确列为缺口，而非估算。估值、收入、客户 / 账户数量和报告日员工数均未披露；唯一员工数信号是未经验证的第三方数据库估算，显示
              2026 年初约为低 300 人。竞争语境同样是身份故事的真实风险：在现有厂商表述中，机器人辅助支气管镜是小而快速增长的细分市场；Noah Medical 面对装机基础更大的成熟平台，主要是 Intuitive
              Surgical 的 Ion 和 Johnson & Johnson 的 Monarch，后者最早上市，并在 2025 年 3 月获批升级了 AI 驱动的 MONARCH QUEST
              导航。采用仍依赖医院资本采购和手术经济性，这是所有进入者都要面对的摩擦。最后，一些最早医生背书披露了利益冲突：University of Chicago 披露说明 Dr. Hogarth 自 2018 年起担任
              Noah Medical 付费顾问并持有股权；评估早期采用者热情时，这一点需要纳入权重。这些缺口不至于推翻投资假设，但界定了后续尽调必须追问的精确问题。
