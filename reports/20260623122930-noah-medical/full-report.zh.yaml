  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Galaxy System 架构、组件和技术规格
        blocks:
          - type: paragraph
            body: >
              Galaxy System 是一套一体化机器人支气管镜平台，集成在单台移动推车上。核心架构整合四个相互依赖的子系统：(1) 用于安装、关节运动并控制支气管镜的机器人臂；(2) 一支一次性支气管镜，外径 4.0
              mm（OD，在尖端测量），四向弯曲，内置摄像头、单个 LED 光源和 2.1 mm 工作通道；(3) 电磁导航（EMN）硬件——包括床下 EMN 板和场发生器——用于把镜头尖端位置定位到术前 CT
              解剖结构上；(4) TiLT+ 影像栈，使用标准 C-arm 透视设备（非专有）执行数字断层合成和增强透视扫描，实时确认工具在病灶内。


              2.1 mm 工作通道兼容现成活检工具，包括细针穿刺针、钳子、细胞刷和柔性冷冻探针；截至运行日期，不存在 Galaxy 品牌专有活检配件。一次性镜体设计取消了再处理；早期采用阶段，Noah Medical
              现场代表协助安装和故障排查。Noah Medical 招聘页称其工程团队超过 150 人；工程副总裁 John Shen
              公开表示，平台混合使用现成组件——包括机器人臂本身——以及真正创造价值处的专有定制硬件和软件，主要集中在 TiLT+。


              GUDID 数据库记录确认，Galaxy System（型号 GAL-001，UDI-DI 00850048825048）处于活跃商业流通状态。系统要求术前 CT 扫描层厚 0.8–1 mm、重叠
              0–50%，并上传至导航软件；EMN 板放在患者身下、兼容 EMN 的手术台上，用于配准和镜体定位。
            claimRefs:
