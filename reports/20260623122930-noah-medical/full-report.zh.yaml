      - number: '7.3'
        title: 临床证据局限、采用摩擦与培训风险
        blocks:
          - type: paragraph
            body: >
              Galaxy System 由赞助方资助的临床证据表现亮眼：96.7% 严格诊断率（MATCH 2，n=31）、100% 工具在病灶内确认（FRONTIER，n=19），以及社区医院真实世界使用中 89%
              诊断率（Beyond the Scope，n=70，CHEST 2025）。但独立、非赞助的 USC Keck Hospital 学习曲线研究（Journal of Thoracic Disease
              2025，n=91 名患者、94 个结节）记录的整体严格诊断率为 68%，气胸率为
              13%，且全部需要胸管置入。另有病例报告记录了自限性大咯血。这种真实世界与研究数据之间的分化，是典型器械采用风险：赞助方选择的中心拥有经验丰富的操作者和优化流程，表现会优于社区和培训环境。


              13% 气胸率具有临床意义，并引发对早期中心操作者筛选和培训充分性的疑问。Intuitive Ion 来自高量中心的真实世界数据（Annals of Thoracic Surgery
              2025，形状感知机器人数据）报告诊断率 91%，气胸几乎为零，建立了付款方和医院管理者评估 Galaxy 真实世界表现时可采用的可信比较基准。Monarch 与 Ion 的倾向评分匹配比较（Annals of
              Thoracic Surgery 2025）显示 Ion 诊断率 84%，Monarch 为 71%，进一步说明 Galaxy 真实世界首年 68% 诊断率处于既有机器人支气管镜范围的低端。USC 研究第二个 6
              个月诊断率提升至 75%，说明操作者在达到稳定表现前可能需要 20–50 例学习曲线——这与行业对机器人支气管镜熟练度需 20–50 例的估计一致。


              介入肺病学（IP）是一个小而专的亚专科。HRSA 2023–2038 医生劳动力预测显示，到 2037 年，35 个专科中有 31 个将面临短缺；肺病学属于需求最受约束的专科之一。IP fellowship
              培训名额不会按技术采用速度同步扩张，因此合格 Galaxy 操作者池增长缓慢。Noah Medical
              通过嵌入式临床应用专家模式应对培训风险——现场代表参加早期病例——但该模式存在单位经济上限：每增加一套装机，都需要持续现场支持人力，压缩贡献利润并限制同步铺开速度。医院资质认证委员会在放行医生独立使用前，要求有成文能力认证流程，给制造商培训计划之外再添行政负担。Cleveland
              Clinic 咨询意见将操作者经验、工具选择和多平面可视化使用列为诊断率的核心决定因素，确认单纯放置一套 Galaxy System，并不能在没有结构化培训路径的情况下保证高诊断率。
