    notes: 否决标准和触发阈值来自公开可得基准（FDA 召回数据库、CMS TCET 公告、Intuitive 季度文件、PACER 案卷、新闻稿）。阈值为分析师估算，旨在作为监测代理；实际投资决策需要额外尽调审阅。
