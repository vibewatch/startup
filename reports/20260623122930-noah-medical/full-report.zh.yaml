companyProfile:
  summary: >-
    Noah Medical 是一家非上市医疗机器人公司，约 2018 年由 Jian Zhang 创立，总部位于加州 San Carlos。Jian Zhang 曾是 Auris Health 第 2 号员工（Auris 后以
    $5.7B 被 Johnson & Johnson 收购），此前也任职于 Intuitive Surgical。公司唯一商业化产品 Galaxy System 是一款已获 FDA 批准的机器人辅助支气管镜平台（510(k)
    K223144，2023 年 3 月）。平台搭载自研 TiLT+ Technology——把数字断层合成、增强透视和一次性支气管镜整合在一起——无需 CBCT 扫描仪即可实时成像外周肺结节。截至 2026 年 4 月，Galaxy
    System 已在全球 50+ 台装机系统上用于超过 10,000 例临床操作。Noah Medical 确认 2023 年 4 月完成由 SoftBank Vision Fund 领投的 $150M Series
    B；第三方数据库（Premier Alternatives / PitchBook）报告 2025 年 9 月另有 $230M 融资，使总融资约达 $516.8M、投后估值约 ~$2.0B，但 Noah Medical
    均未公开确认。收入、毛利率及其他全部财务运营指标仍完全未披露。
