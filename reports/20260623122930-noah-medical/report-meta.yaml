  productSummary: >-
    The Galaxy System is an all-in-one robotic bronchoscopy platform on a single mobile cart,
    comprising a robotic arm, single-use disposable bronchoscope (GALB-001, 4.0 mm OD), and
    integrated TiLT+ imaging combining digital tomosynthesis and augmented fluoroscopy for
    real-time peripheral lung nodule navigation. A single-use bronchoscope is consumed per
    procedure, generating recurring per-procedure disposable revenue in addition to the upfront
    capital system sale.
  customerFocus: >-
    Interventional pulmonologists and thoracic programs at academic medical centers and community
    hospitals performing peripheral lung nodule biopsy and diagnostic bronchoscopy; hospital
    administration and service-line leaders control the capital purchase decision.
  businessModel: >-
    Capital-equipment-plus-recurring-disposables model: hospitals pay an upfront cost for the
    Galaxy System platform (Ion/Monarch-comparable benchmarks suggest $600K–$750K range) and
    purchase one single-use bronchoscope per procedure as the primary recurring revenue stream.
    Service and maintenance contracts represent a third potential revenue stream, though terms are
    undisclosed.
