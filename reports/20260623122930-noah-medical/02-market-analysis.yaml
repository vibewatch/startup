  - id: buyer-payer-segmentation
    title: Buyer and Payer Segmentation
    body: >-
      The hospital is the dominant buyer and operator of robotic bronchoscopy systems.
      PW Consulting estimates that hospitals account for 79.6% of end-user market share
      in 2025, with ambulatory surgical centers and diagnostic laboratories representing
      the remainder. Within the hospital segment, academic medical centers and large
      tertiary referral hospitals are the clear first movers. Their higher case complexity,
      access to grant funding, availability of interventional pulmonology fellows, and
      tolerance for unproven technology economics create conditions favorable to early
      capital commitment. Community hospitals—which serve the majority of patients with
      lung nodules in the United States but typically lack fellowship-trained interventional
      pulmonologists—face a different calculus. Capital budgets at these institutions are
      constrained, and the $1–2 million upfront system cost represents a multi-year payback
      at realistic procedure volumes. The emerging model described in MedCity News (March
      2026) is the pivot to the endoscopy suite: moving robotic bronchoscopy out of the
      operating room and into lower-cost outpatient settings while leveraging APC complexity
      adjustments (CPT 31628 + 31629 + 31653 bundling) to generate contribution margins
      sufficient to justify the capital. The payer landscape is primarily Medicare for
      this patient population—lung nodule evaluation skews heavily toward patients over 60
      who are Medicare beneficiaries. The relevant reimbursement code is CPT 31627
      (navigational bronchoscopy), which pays only $85 at the facility rate in Q2 2026.
      However, the procedure is typically billed as a bundle with CPT 31628 (bronchoscopy
      with biopsy) under APC 5153, which generates a higher aggregate payment of roughly
      $1,800–2,400 per encounter. Commercial payer policies for robotic navigation vary
      significantly, with some requiring prior authorization, creating administrative
      friction that disproportionately affects community programs. The budget decision
      authority sits with hospital CFOs and service-line directors for capital; interventional
      pulmonologists drive the clinical purchase recommendation. This bifurcated decision
      structure means sales cycles are long and require both clinical and administrative
      champions.
    claimRefs:
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
