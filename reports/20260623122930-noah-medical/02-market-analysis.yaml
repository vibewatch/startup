callouts:
  - calloutType: risk
    title: Reimbursement Gap Undermines Capital Payback
    body: >-
      CPT 31627 (navigational bronchoscopy) pays only $85 at the facility rate in Q2 2026,
      while robotic bronchoscopy platforms cost $1–2 million per unit. Even using the full
      APC 5153 bundle at $1,800–2,400 per encounter, a hospital performing 150 procedures
      per year faces a capital payback of approximately 3–5 years before accounting for
      maintenance and disposables—a challenging economics model that restricts meaningful
      adoption to high-volume or well-capitalized institutions.
    claimRefs:
      - CM026
      - CM027
      - CM031

  - calloutType: insight
    title: Market Estimates Differ by 10× Reflecting Scope Not Disagreement
    body: >-
      The published market sizing range for robotic bronchoscopy ($77M–$640M for 2026)
      largely reflects incompatible scope definitions rather than analytical disagreement
      among qualified forecasters. Narrow device-hardware estimates and enterprise
      system-plus-software estimates describe different portions of the value chain.
      Without disclosing scope methodology, no single estimate should be cited in
      isolation. Investors should weight the bottom-up procedural estimate ($75–150M US)
      as the more conservative anchor for near-term revenue projections.
    claimRefs:
      - CM004
      - CM005
      - CM008
      - CM020

  - calloutType: strength
    title: Clinical Evidence Supports Safety-Driven Substitution
    body: >-
      The DYSTRICT study (PMC13139926, 2025) provides the strongest randomized comparator
      data to date: shape-sensing robotic bronchoscopy achieved comparable strict diagnostic
      yield to CT-guided transthoracic biopsy (74% vs 79%, p=0.201) with a dramatically
      better safety profile—pneumothorax OR 0.04 and hospitalization OR 0.35. This safety
      differential creates a payer-aligned economic case for substituting robotic bronchoscopy
      for CT-guided biopsy as the preferred first-line approach for accessible peripheral
      lung nodules, particularly given the downstream cost of pneumothorax management.
    claimRefs:
      - CM021
      - CM022
      - CM023

