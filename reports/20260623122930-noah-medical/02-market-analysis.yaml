  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: US installed base count for robotic bronchoscopy platforms by vendor (Intuitive Ion, J&J Monarch, Noah Medical Galaxy)
      whyItMatters: Without an installed base count, SOM estimation for Noah Medical requires heroic assumptions about procedure volume per system; overestimating installed base directly inflates addressable market projections.
      diligencePath: Channel check with interventional pulmonology program directors at 20+ US academic and community hospitals; review AABIP membership survey data if available.
      relatedQuestionRefs:
        - QM014
        - QM020

    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: Noah Medical Galaxy System near-term SOM estimate and average selling price data
      whyItMatters: The wide range of analyst estimates ($77M–$640M) prevents revenue projection without a product-specific installed-base and pricing anchor; SOM is the most decision-relevant market size metric for investors.
      diligencePath: Request Galaxy unit shipments and average selling price from Noah Medical under NDA; triangulate against competitor filings (Intuitive Surgical annual report for Ion procedure counts).
      relatedQuestionRefs:
        - QM020

    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: Standardized scope definition for robotic bronchoscopy market to reconcile the $77M–$640M analyst range
      whyItMatters: Contradictory estimates undermine confidence in TAM/SAM projections and create risk of overstating the addressable market by 5–8× if the broader enterprise figures are cited without scope adjustment.
      diligencePath: >-
        Commission primary channel research using a defined scope (capital platform
        hardware + single-use catheter consumables only, excluding ENB, EBUS, and
        non-robotic accessories). Cross-validate against Noah Medical revenue guidance.
      relatedQuestionRefs:
        - QM023

    - type: missing-source
      severity: minor
      topic: reimbursement
      missingEvidence: Major commercial payer coverage policies and prior-authorization criteria for CPT 31627 / robotic navigation bronchoscopy
      whyItMatters: Commercial payers represent 30–40% of payer mix for lung nodule patients, and prior authorization creates delay and denial risk that affects realized hospital economics and adoption velocity.
      diligencePath: Review published coverage determination bulletins from Aetna, UnitedHealthcare, Cigna, and BlueCross BlueShield for CPT 31627 and APC 5153; monitor any national coverage determination from CMS.
      relatedQuestionRefs:
        - QM024

    - type: missing-source
      severity: minor
      topic: ldct-screening
      missingEvidence: Granular 2025–2026 LDCT screening uptake rates under the revised 50–80 year / 20 pack-year USPSTF criteria (the NCI progress report data reflects 2015 rates under prior criteria)
      whyItMatters: The demand funnel model is sensitive to actual screening volume; if uptake under expanded criteria is materially different from the 18% figure, the procedure pipeline estimate changes significantly.
      diligencePath: Access 2024–2025 NHIS data when published by NCI (expected mid-2025); review ACR Lung Cancer Screening Registry annual report for 2025 data.
      relatedQuestionRefs:
        - QM022

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Tables TM003 and TM004 contain estimated and qualitative data with caveats
      documented in their notes fields; all payer mix percentages and payment amounts
      are approximations noted as such in the table notes rather than primary-source
      confirmed figures.
  - dimension: unverifiedSource
    reason: >-
      Unverified sources include peer-reviewed journals (BMJ, MDPI, CHEST, AACR,
      PubMed PMC), U.S. government health databases (NCI cancer.org, SEER, CDC,
      NCI Progress Report), market research reports (Mark Wide Research, PW
      Consulting, Statifacts, DataInsightsMarket, ResearchNester, PMarketResearch),
      and CMS documents (OPPS January 2026, MedFeeSchedule, Noah Medical
      Reimbursement Guide, ACR Bulletin) that could not be directly retrieved via
      the automated fetch trail due to subscription, paywall, or content-security
      restrictions. Claims derived from these sources are backed by multiple
      corroborating retrieved sources within this chapter and across other chapters.
