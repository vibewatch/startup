  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The structural growth thesis for robotic bronchoscopy rests on four reinforcing
      drivers. First, the USPSTF guideline expansion in 2021—which nearly doubled the
      eligible screening population to 14.1 million—is progressively increasing LDCT
      scan volume and therefore the pipeline of detected nodules requiring evaluation.
      Second, clinical evidence is strengthening: the DYSTRICT study (ERJO, 2025, PMC)
      demonstrated that shape-sensing robotic bronchoscopy achieved comparable strict
      diagnostic yield to CT-guided biopsy (74% vs 79%, p=0.201) while delivering
      substantially lower pneumothorax rates (OR 0.04) and hospitalization rates
      (OR 0.35). This safety profile differential justifies clinical preference, particularly
      as payers increasingly track complication costs. Third, AI and imaging integration
      are reducing the skill barrier: second-generation platforms that embed advanced
      fluoroscopy or C-arm tomography eliminate the need for additional CBCT capital and
      shorten procedure cycles, making the economics viable at community hospitals without
      large volumes. Fourth, the APC complexity adjustment—using bundled codes in an
      endoscopy suite rather than an OR—converts what had been a marginal or break-even
      procedure into a profitable service line. Against these drivers, the constraints
      are substantial. The CPT 31627 facility rate of $85 in 2026 is structurally
      inadequate relative to capital cost, creating a reimbursement gap that requires
      high procedure volume or creative coding strategies to close. Capital expenditure
      of $1–2 million per platform plus $150,000–$300,000 annually in maintenance and
      disposables creates a payback period that stretches three to five years at moderate
      volumes. The interventional pulmonology fellowship pipeline is limited: ACGME-accredited
      training programs produce only a modest cohort of board-certified interventional
      pulmonologists each year, creating a workforce bottleneck for expansion beyond major
      centers. Finally, the LDCT screening uptake gap—18% coverage of eligible adults—
      means the demand funnel feeding into biopsy is operating far below theoretical
      capacity. Improving screening adherence and follow-up pathways is a necessary
      market infrastructure investment that individual device companies cannot control
      but whose pace will significantly determine the size of the accessible market
      over the next five years.
    claimRefs:
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038
      - CM039
      - CM040
    tableRefs:
      - TM004

  - id: sizing-evidence-gaps
    title: Sizing Uncertainties and Evidence Gaps
    body: >-
      The most material evidence gap in this chapter is the ten-fold spread in robotic
      bronchoscopy market sizing estimates—from $77 million to $640 million for the same
      nominal segment in 2025–2026. This is not primarily a forecasting disagreement but
      a scope definition disagreement: narrowly-scoped reports counting only robotic
      platform hardware revenue arrive at figures one order of magnitude smaller than
      broadly-scoped reports that bundle navigation software, EBUS accessories, and
      consumables. No report provides downloadable methodology that would allow
      independent reconciliation. As a result, any market sizing citation in this chapter
      should be treated as directionally indicative rather than authoritative, and
      investors should seek primary channel checks with hospital procurement data to
      construct bottom-up estimates. A second gap is the absence of publicly available
      data on the installed base of robotic bronchoscopy systems in the United States.
      Intuitive Surgical (Ion) and Johnson and Johnson (Monarch) disclose only aggregate
      procedure counts, and Noah Medical's Galaxy System count is similarly opaque after
      surpassing the 500-case milestone. Without an installed base figure, a precise SOM
      calculation for any individual platform is impossible. A third gap is commercial
      payer policy heterogeneity: while Medicare reimbursement under CPT 31627 and APC
      5153 is now codified and publicly available, commercial insurer prior-authorization
      requirements and coverage policies for robotic navigation bronchoscopy are highly
      variable and not systematically published, creating unpredictable revenue visibility
      for hospital bronchoscopy programs. These gaps are not fatal to the investment
      thesis—the disease burden data and clinical evidence are robust—but they preclude
      precise SOM sizing and therefore limit confidence in near-term revenue projections
      for any single-platform competitor in this space.
    claimRefs:
      - CM041
      - CM042
      - CM043

