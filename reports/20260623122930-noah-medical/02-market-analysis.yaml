  - id: market-sizing
    title: Market Sizing—Multiple Lenses and Contradictions
    body: >-
      Market sizing for robotic bronchoscopy is materially contested across analyst
      sources, with 2025–2026 estimates ranging from $77 million to $640 million for
      what are nominally described as the same market. Three distinct scope assumptions
      account for most of this variance. The narrowest definition (Statifacts, 2026:
      $94.5M) counts only purpose-built robotic catheter systems and their single-use
      accessories, excluding ENB platforms, EBUS capital, and software subscriptions. An
      intermediate view (Market Research Intellect, 2026: $640M) bundles robotic systems,
      accessories, and related software under an "enterprise robotic bronchoscopy" umbrella
      that includes some navigational and guidance revenue. The broadest perspective
      (PW Consulting, 2025: $515M, 2026: $609M) aggregates robotic bronchoscopy across
      all application types and regional geographies under a consistent hospital-procedure
      unit-economics model. None of these reports publishes its methodology in publicly
      accessible form, and the CAGR estimates are equally divergent: 5.5% (Data Insights),
      18.3% (PW Consulting), and 21.85% (Statifacts) for the same nominal segment over
      comparable forecast windows. The encompassing interventional pulmonology market
      provides a more stable anchor: MarkWide Research places the 2026 global total at
      $4.8 billion growing at 8.7% CAGR through 2036, while ResearchNester sizes 2026
      at $4.6 billion at 5.7% CAGR through 2035. North America accounts for 21–38% of
      global interventional pulmonology volume depending on scope. Constructing a
      bottom-up US estimate: assuming 500,000 bronchoscopies annually in the US (NLM
      cited by ResearchNester), robotic platform penetration of approximately 10–15%,
      average revenue per robotic procedure (equipment + consumables) of roughly $1,500–2,000,
      yields a US procedure-side SAM of approximately $75–150 million annually—consistent
      with the narrow Statifacts estimate but far below the enterprise-bundle figures.
      Investors and analysts relying on the broad estimates without adjusting for scope
      risk overstating the immediately addressable market for a single-platform company
      like Noah Medical by a factor of five to eight.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM018
      - CM019
      - CM020
