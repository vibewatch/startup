chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The addressable market for robotic bronchoscopy sits within a $4.6–4.8 billion
    interventional pulmonology sector and is itself a rapidly growing but
    methodologically contested segment, with analyst estimates ranging from $77 million
    to $640 million for 2026 depending on scope definition. Disease burden is unambiguous—
    229,410 new US lung cancer cases and roughly 1.6 million pulmonary nodules detected
    annually—yet only 18% of LDCT-eligible adults are screened, creating both a demand gap
    and a structural constraint on downstream biopsy volume. Reimbursement remains the
    central friction point: CPT 31627 pays only $85 (facility rate) while system capital
    costs run $1–2 million per unit, making academic medical centers the primary early
    buyers and community hospital economics the next unlock.

sections:
  - id: market-boundary
    title: Market Boundary, Substitutes, and Adjacencies
    body: >-
      The target market is defined as robotic and navigational bronchoscopy for the
      evaluation and tissue sampling of pulmonary nodules and early-stage lung cancer,
      encompassing the hardware platforms (robotic endoluminal systems), single-use
      disposable bronchoscope catheters, intra-procedural imaging add-ons (mobile
      cone-beam CT, advanced fluoroscopy), biopsy tool consumables, and the
      procedure-level software that enables shape-sensing navigation. This scope
      intentionally excludes standalone CT scanner capital equipment used for primary
      screening, conventional flexible bronchoscopy without navigational guidance,
      surgical thoracoscopic/VATS biopsy, radiation therapy devices, and downstream
      molecular or liquid biopsy testing. Adjacent spend that is not included but
      materially affects adoption includes hospital EMR/PACS integration middleware,
      interventional pulmonology suite renovation, and mediastinal staging tools (EBUS-TBNA)
      that are frequently co-billed. The status-quo substitutes competing directly for the
      same diagnostic indication are CT-guided transthoracic needle biopsy (CTTB)—the
      dominant incumbent for peripheral nodules with published yield of 66–100% but
      pneumothorax rates of up to 25%—and electromagnetic navigation bronchoscopy (ENB,
      primarily Medtronic's SuperDimension). Conventional flexible bronchoscopy remains
      the standard for central airway lesions and is largely non-competitive in the
      peripheral nodule segment. Surgical wedge biopsy provides definitive tissue but
      with substantially higher morbidity, cost, and inpatient bed consumption.
      Understanding which spend is included matters critically for sizing: analyst reports
      that bundle ENB, EBUS, and diagnostic accessories into a broad "interventional
      pulmonology devices" TAM arrive at figures ten times larger than those that count
      only purpose-built robotic bronchoscopy platforms.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM022
      - CM023
      - CM024
    tableRefs:
      - TM001

  - id: epidemiological-demand
    title: Epidemiological Demand Foundation
    body: >-
      The demand signal for pulmonary nodule diagnostics is driven by two converging
      forces: the burden of lung cancer and the expanding but substantially under-utilized
      LDCT screening infrastructure. Lung cancer remains the leading cause of cancer death
      in the United States, accounting for an estimated 229,410 new cases and 124,990
      deaths in 2026, representing 20% of all US cancer mortality. The five-year relative
      survival rate is 29.5%—a persistently poor outcome largely attributable to late-stage
      diagnosis, since early-stage detection carries survival rates exceeding 60%. The
      broader determinant of downstream procedural volume is pulmonary nodule detection:
      approximately 1.6 million nodules are identified annually through chest CT imaging
      in the United States, detected incidentally in roughly 30% of all chest CTs ordered
      for other indications. This incidental detection rate has accelerated with the
      proliferation of CT use for pulmonary embolism, cardiovascular assessment, and
      trauma, creating a growing backlog of nodules requiring risk stratification and, in
      a subset, tissue sampling. Against this demand backdrop, the 2021 USPSTF guideline
      expansion—reducing the eligibility threshold from age 55–80 and 30 pack-years to
      age 50–80 and 20 pack-years—almost doubled the eligible screening population to
      approximately 14.1 million US adults. Despite this, only about 18% of those eligible
      are currently being screened, representing a substantial structural gap. This low
      uptake is attributed to limited provider awareness, patient stigma around tobacco use,
      fragmented referral pathways, and lack of shared decision-making capacity in primary
      care. The implication for the robotic bronchoscopy market is dual: the screening gap
      constrains the pipeline of CT-detected nodules that would ordinarily funnel into
      diagnostic biopsy, but it also represents an enormous latent demand pool whose
      activation—through improved screening programs, AI-driven nodule tracking, and
      patient navigation—would materially expand the addressable procedure volume.
    claimRefs:
      - CM001
