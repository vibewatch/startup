    "number": 1,
    "title": "Company Overview",
    "summary": "Noah Medical is a privately held, founder-led medical-robotics company in San Carlos, California that commercializes the Galaxy System, an FDA-cleared (510(k) K223144, March 2023) robotic-assisted bronchoscopy platform using TiLT+ integrated tomosynthesis, augmented fluoroscopy, and a single-use bronchoscope for lung-nodule biopsy. Public evidence supports a clear identity, a $150M SoftBank-led Series B, rapid early adoption past 5,000 U.S. procedures, and growing peer-reviewed clinical evidence, while valuation, revenue, customer counts, run-date headcount, and board composition remain undisclosed."
  },
  "sections": [
    {
      "id": "identity-mission-product",
      "title": "Identity, mission, and the Galaxy product",
      "body": "Noah Medical is a privately held medical-robotics company based in San Carlos, California, in Silicon Valley, with its headquarters address (1501 Industrial Rd) independently confirmed on the FDA 510(k) record for its lead product. Private databases place the company's founding around 2018, though Noah Medical does not publicly confirm an exact incorporation date. The company's stated mission is to deliver adoptable clinical solutions through innovative endoluminal technologies that enhance the quality of life for patients globally, framed concretely around earlier, more accurate lung-cancer diagnosis. Its first and only commercial product is the Galaxy System, a robotic-assisted (navigated) bronchoscopy platform intended to provide bronchoscopic visualization of, and access to, patient airways for diagnostic and therapeutic procedures. The Galaxy System combines proprietary TiLT+ Technology with integrated digital tomosynthesis and augmented fluoroscopy, an always-on single-use disposable bronchoscope, and a compact footprint; the company markets it as the only navigated bronchoscopy system with a single-use scope and as its inaugural commercial robotic system. The business model centers on selling the Galaxy capital system plus single-use disposables for peripheral lung-nodule biopsy.",
      "claimRefs": ["CO001", "CO003", "CO004", "CO005", "CO006", "CO007", "CO008", "CO009", "CO010", "CO040", "CO041"],
      "figureRefs": ["FO002"]
    },
    {
      "id": "leadership-and-governance",
      "title": "Founder, leadership team, and governance visibility",
      "body": "Noah Medical is led by founder and CEO Jian Zhang, a surgical-robotics entrepreneur whose founder-market fit is unusually strong: he was employee #2 at Auris Health, acquired by Johnson & Johnson for $5.7 billion in 2019, previously worked at Intuitive Surgical, holds MS and PhD degrees from Columbia University, and co-founded prior startups including Robotphoenix. The public leadership page lists a functional executive bench drawn heavily from Intuitive, Auris, Stryker, Verb Surgical, and other top robotics companies, including Ivy Li as Interim CFO, Joe Riley as VP of Sales and Marketing, John Shen as VP of Engineering, Nicky Espinosa as General Counsel, John Mesenbring as VP of Manufacturing Operations, and Brent Lloyd as VP of Service and Technology Operations. In June 2026 the company appointed Dr. Krish Bhadra, a Stanford Medicine interventional pulmonologist who has performed more than 2,300 robotic-assisted bronchoscopy procedures, as Chief Pulmonary Advisor in a newly created role. The most material governance gap is that the board of directors, investor board seats, and ownership structure are not publicly disclosed, and the CFO role is still held on an interim basis, both of which are key-person and governance considerations for diligence.",
      "claimRefs": ["CO002", "CO011", "CO012", "CO013", "CO014", "CO015", "CO016", "CO017", "CO018", "CO049"],
      "tableRefs": ["TO002"]
    },
    {
      "id": "funding-investors-capital",
      "title": "Funding history, investors, and capital structure",
      "body": "Noah Medical's clearest financing anchor is an oversubscribed $150 million Series B round announced on April 19, 2023, led by the SoftBank Vision Fund and co-led by Prosperity7 Ventures, a venture subsidiary affiliated with Saudi Aramco. The syndicate also included Tiger Global and existing investors Hillhouse, Sequoia China, Shangbay Capital, Uphonest Capital, Sunmed Capital, Lyfe Capital, 1955 Capital, and AME Cloud Ventures, alongside undisclosed strategic investors. Independent deal coverage corroborates the round size, lead investors, and syndicate composition. Beyond the Series B, the company's total capital raised is not fully disclosed; third-party databases indicate more than $150 million raised as of 2023, implying earlier seed and Series A activity that Noah Medical has not detailed publicly. Critically, Noah Medical has not disclosed a post-Series-B valuation, current cap table, liquidation preferences, or board-level investor rights. That combination of a marquee investor base and limited structural disclosure means the capital story is strong on demand signals but thin on the control and economics detail an investor would need to underwrite ownership and downside protection.",
      "claimRefs": ["CO019", "CO020", "CO021", "CO022", "CO023", "CO024"],
      "tableRefs": ["TO003"]
    },
    {
      "id": "milestones-traction-clinical",
      "title": "Milestones, commercial traction, and clinical evidence",
      "body": "Noah Medical's milestone arc is coherent and well-documented. After announcing new research, testing, and training facilities in March 2022, the company received FDA 510(k) clearance (K223144) for the Galaxy System on March 1, 2023, as a substantially equivalent Class II device. It then completed first-in-human use in the FRONTIER study at Macquarie University Hospital in Sydney under Principal Investigator Professor Alvin Ing (March 2023), closed its Series B (April 2023), and performed the first U.S. commercial cases at the University of Chicago Medicine with Dr. Kyle Hogarth in May 2023, where all four initial patients were discharged the same day. International expansion followed with the first Asian use at Prince of Wales Hospital in Hong Kong (December 2023). Adoption then accelerated from the 500th U.S. procedure at CHI Memorial (January 2024) to surpassing 5,000 U.S. procedures at Long Island Jewish Medical Center (March 2025). Clinical evidence deepened at CHEST 2025, where the MATCH 2 study (31 patients) reported 96.7% strict diagnostic yield and the community-hospital Beyond the Scope study reported 89% yield; MATCH 2 was subsequently published in the peer-reviewed journal Respiratory Medicine in March 2026. The earlier MATCH study had reported 100% navigation and diagnostic yield with 95% tool-in-lesion accuracy.",
      "claimRefs": ["CO025", "CO026", "CO027", "CO028", "CO029", "CO030", "CO031", "CO032", "CO033", "CO034", "CO035", "CO036", "CO037", "CO038", "CO039", "CO050"],
      "tableRefs": ["TO004"],
      "figureRefs": ["FO001"]
    },
    {
      "id": "snapshot-metrics-and-gaps",
      "title": "Snapshot metrics, competitive context, and disclosure gaps",
      "body": "As a private company, Noah Medical leaves several cover metrics unsupported by public evidence, and this chapter records them as explicit gaps rather than estimates. Valuation, revenue, customer/account counts, and run-date headcount are all undisclosed; the only headcount signal is an unverified third-party database estimate in the low-300s for early 2026. The competitive context is also a genuine risk to the identity story: robotic-assisted bronchoscopy is described by incumbents as a small but fast-growing segment, and Noah Medical competes against established platforms with larger installed bases, namely Intuitive Surgical's Ion and Johnson & Johnson's Monarch, the latter the first system to market and upgraded with AI-powered MONARCH QUEST navigation cleared in March 2025. Adoption still depends on hospital capital purchases and procedure economics, a friction every entrant faces. Finally, some of the earliest physician endorsements carry disclosed conflicts of interest: University of Chicago disclosure notes that Dr. Hogarth has been a paid Noah Medical consultant since 2018 and holds an equity interest, which is relevant when weighting early adopter enthusiasm. These gaps are not thesis-breaking, but they define the precise questions later diligence must pursue.",
      "claimRefs": ["CO023", "CO042", "CO043", "CO044", "CO045", "CO046", "CO047", "CO048"],
