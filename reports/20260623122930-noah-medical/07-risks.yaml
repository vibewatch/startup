  claims:
    - id: CR001
      statement: >-
        Noah Medical has issued four Class 2 FDA device recalls for Galaxy System components between March 2024 and November 2025: (1) Z-1734-2024 — wired controller calibration; (2) Z-0693-2025 — power supply design defect; (3) Z-0679-2025 — Galaxy bronchoscope biopsy channel incompatibility; (4) Z-0598-2026 — IFU/User Manual password protected.
      type: observed
      topic: device-recalls
      sourceRefs: [SR001, SR002, SR003, SR004]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR002]
    - id: CR002
      statement: >-
        Recall Z-0693-2025 (initiated October 25, 2024; posted December 18, 2024; Open as of June 2026) covers 26 Galaxy System units (GAL-001) with a power supply defect: a defective semiconductor component can cause an unrecoverable power supply short circuit or circuit-breaker trip during a procedure, requiring manual bronchoscope removal with risk of lung injury or pneumothorax.
      type: observed
      topic: power-supply-recall
      sourceRefs: [SR001, SR029]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR001, QR002]
    - id: CR003
      statement: >-
        Recall Z-0679-2025 (initiated October 25, 2024; posted December 13, 2024; Open as of June 2026) covers the Galaxy bronchoscope (GALB-001) with IFU Revision J and all prior versions. Not all biopsy tools designed for the 2.1 mm working channel will pass through when the scope is positioned in a sharp bend exceeding approximately 100 degrees; forcing tool insertion risks tissue injury or pneumothorax.
      type: observed
      topic: bronchoscope-channel-recall
      sourceRefs: [SR002, SR029]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR018]
    - id: CR004
      statement: >-
        Recall Z-1734-2024 (initiated March 9, 2024; posted May 1, 2024) covered 17 Galaxy System wired controllers (GAL-019) with misaligned calibration that could cause unintended robotic scope motion. The recall is classified as resolved by corrective action.
      type: observed
      topic: controller-calibration-recall
      sourceRefs: [SR003, SR029]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR017]
    - id: CR005
      statement: >-
        Recall Z-0598-2026 (initiated September 12, 2025; posted November 26, 2025) was issued because Galaxy System user manuals were password protected, preventing operator access to IFU content — a primary FDA recall trigger for procedural misuse risk. This is the fourth distinct recall event for the Galaxy System platform.
      type: observed
      topic: ifu-access-recall
      sourceRefs: [SR004, SR029]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR031]
    - id: CR006
      statement: >-
        The February 2024 MAUDE adverse event (MDR 18699853) documented a patient who experienced bilateral pneumothoraces, cardiac arrest, hemorrhage, pneumonia, and septic shock during a Galaxy-assisted bronchoscopy. The physician dismissed six scope-buckling workflow-inhibitor error messages without performing the IFU-required fluoroscopy verification before continuing scope advancement, resulting in a kinked scope. The patient subsequently died; investigation attributed death to septic shock from pre-existing pneumonia rather than device malfunction.
      type: observed
      topic: maude-death-event
      sourceRefs: [SR005, SR029]
      confidence: high
      freshness: historical
      answersQuestionRefs: [QR003]
    - id: CR007
      statement: >-
        A 2025 MAUDE adverse event (MDR 21200488) recorded a patient who suffered a stroke two days after a Galaxy System bronchoscopy procedure. No Galaxy device malfunction was reported, and the physician did not attribute the stroke to the device; the event was reported to the FDA due to temporal proximity requirements.
      type: observed
      topic: maude-stroke-event
      sourceRefs: [SR006]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR003]
    - id: CR008
      statement: >-
        Noah Medical was granted US Patent 12635860 on May 26, 2026, covering an anti-buckling device for surgical systems — directly addressing the scope-buckling failure mode documented in the February 2024 MAUDE death event. This patent confirms Noah Medical has engineered a hardware-level mitigation for the buckling risk, but the retrofit schedule for existing deployed units has not been publicly disclosed.
      type: observed
      topic: anti-buckling-patent-mitigation
      sourceRefs: [SR005, SR012]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR023]
    - id: CR009
      statement: >-
        As of June 2026, two Galaxy System recalls remain Open per the FDA recall database: Z-0693-2025 (power supply design defect) and Z-0679-2025 (bronchoscope biopsy channel incompatibility). The simultaneous existence of multiple open recalls for an early-commercial platform increases the probability of enhanced FDA post-market surveillance scrutiny.
      type: inferred
      topic: open-recalls-risk
      sourceRefs: [SR001, SR002]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR001, QR002, QR021]
    - id: CR010
      statement: >-
        Medicare does not have a unique CPT code for robotic bronchoscopy. Galaxy System procedures bill under existing conventional codes: 31628 (transbronchial lung biopsy, single lobe) as the primary procedure code and add-on code 31627 (computer-assisted navigational component) for EMN-guided navigation. No incremental robotic premium is authorized, meaning the sophisticated TiLT+ imaging platform generates no additional direct reimbursement beyond conventional navigated bronchoscopy.
      type: observed
      topic: no-robotic-cpt
      sourceRefs: [SR013, SR015, SR030]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR005, QR025]
    - id: CR011
      statement: >-
        The CMS TCET pathway (finalized August 2024, effective 2025) offers expedited national Medicare coverage for FDA Breakthrough Devices; CMS accepts up to five candidates annually and typically requires Coverage with Evidence Development. The Galaxy System holds a conventional 510(k) clearance (K223144) as a Class II device, not an FDA Breakthrough Device designation, which may preclude TCET eligibility without redesignation. Noah Medical has not publicly confirmed TCET nomination or candidacy as of June 2026.
      type: inferred
      topic: tcet-eligibility-gap
      sourceRefs: [SR009, SR018, SR019]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR013]
    - id: CR012
      statement: >-
        CMS implemented a -2.5% efficiency adjustment on many non-time-based physician services in the 2026 Physician Fee Schedule. This compresses per-procedure reimbursement for bronchoscopy and interventional pulmonology, reducing the hospital financial return per Galaxy procedure at a time when capital budgets are already constrained.
      type: observed
      topic: cms-fee-reduction-2026
      sourceRefs: [SR014, SR013]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR025]
    - id: CR013
      statement: >-
        Commercial insurer coverage for robotic bronchoscopy is inconsistent across payers and geographies; each new hospital account may require prior authorization workflows and payer-specific coverage reviews. Without a CMS National Coverage Determination (NCD) or broad Local Coverage Determination (LCD), reimbursement uncertainty varies by MAC region and insurer, creating adoption barriers and revenue unpredictability.
      type: inferred
      topic: payer-inconsistency
      sourceRefs: [SR013, SR017]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR005, QR025]
    - id: CR014
      statement: >-
