callouts:
  - calloutType: risk
    title: Four Class 2 Recalls in 26 Months — Device Quality Pattern Risk
    body: >-
      Noah Medical has issued four Class 2 recalls for Galaxy System components between March 2024 and November 2025, covering the platform (power supply design), the disposable bronchoscope (biopsy channel geometry), the wired controller (calibration), and the IFU (document access). Two recalls remain Open as of June 2026. For a platform with a limited deployed install base, this frequency signals design maturity challenges. The pattern may attract enhanced FDA post-market scrutiny, increase the probability of a 483 observation or Warning Letter, and undermine hospital procurement confidence. Until all open recalls are closed and a root-cause-closed quality review is available, device quality risk should be rated high.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR009, CR040]
  - calloutType: risk
    title: Real-World Clinical Performance Gap vs. Sponsored Studies
    body: >-
      The USC Keck Hospital learning curve study (JTD 2025, n=91, non-sponsored) is the only independent real-world Galaxy dataset and shows a 68% strict diagnostic yield and 13% pneumothorax rate in year one — starkly below the 96.7% yield and 3% pneumothorax in MATCH 2 (sponsored, n=31). Intuitive Ion real-world data shows 91% yield and near-zero pneumothorax at high-volume centers. This evidence gap is the most important clinical risk: payers evaluating coverage, hospitals evaluating procurement, and clinicians evaluating patient referral paths will encounter both datasets. Until a large, multi-center, non-sponsored study or a head-to-head RCT against Ion is completed, the clinical evidence risk remains unresolved.
    claimRefs: [CR014, CR015, CR016, CR042]

