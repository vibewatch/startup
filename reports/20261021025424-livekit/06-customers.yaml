company:
  name: LiveKit
chapter:
  number: 6
  title: Customers
  summary: >-
    LiveKit has credible adoption signals across AI labs, large technology companies, healthcare,
    language learning, and developer teams, but the public record is much stronger on names and
    developer reach than on commercial durability. Reported customer and developer counts are not
    independently reconciled, while NRR, churn, renewal, contract length, and revenue concentration
    remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      LiveKit primarily serves technical product teams that need real-time media infrastructure,
      rather than business operators buying a finished voice-automation outcome. Its official
      documentation spans AI assistants, customer service, healthcare, video conferencing,
      livestreaming, and robotics, and supports web, mobile, telephone, and physical-device
      surfaces. That range creates several buyer groups: engineering leaders selecting core
      infrastructure, application teams building voice or video products, enterprise platform
      owners choosing managed cloud instead of self-hosting, and specialized teams embedding
      real-time interaction into healthcare or robotics. The user is typically a developer or
      operator, while the payer is more likely an engineering, product, or infrastructure budget
      owner. This segmentation is evidence-backed at the workflow level, but no retained source
      discloses revenue mix, geography, customer size distribution, or segment-level contract value.
    claimRefs: [CU001, CU004, CU010, CU011, CU012]
    tableRefs: [TU001]
  - id: named-customer-proof
    title: Named adoption is broad, but proof quality varies
    body: >-
      The strongest public proof is a combination of independent reporting and founder statements.
      SiliconANGLE reported that LiveKit powers ChatGPT's Advanced Voice Mode and named xAI, Meta,
      and Spotify as customers. In a hosted interview, co-founder Russ d'Sa said the early project
      was used by Spotify, Adobe, eBay, and Oracle, and separately identified Assort Health and
      Speak as users in healthcare intake and language learning. These examples show horizontal
      applicability and provide more signal than an undifferentiated logo wall. They do not,
      however, consistently disclose deployment date, paid status, contract scope, production
      volume, renewal history, or measurable outcomes. The named-customer table is therefore a
      sample of publicly described relationships, not an exhaustive customer roster or a verified
      production census.
    claimRefs: [CU002, CU003, CU005, CU006, CU015]
    tableRefs: [TU003]
  - id: adoption-trajectory
    title: Adoption signals are directional rather than underwritable
    body: >-
      Multiple sources point to material reach, but their denominators and vintages do not align.
      SiliconANGLE described thousands of developers and teams, one company database listed more
      than 100,000 developers and more than 500 paying customers for 2025, YesPress claimed more
      than 300,000 developers, and AdTools reported more than one million monthly Agents toolkit
      downloads. These are different measures: developers, paying customers, toolkit downloads,
      and named organizations cannot be combined into a growth funnel or treated as recurring
      revenue. The retained evidence also contains a consultancy-authored deployment example at
      12,000 calls and roughly 85,000 minutes per month, but it is a single vendor case and not a
      LiveKit-wide cohort. Adoption is credible; growth rate, active-account conversion, usage
      retention, and paid expansion remain unverified.
    claimRefs: [CU002, CU007, CU008, CU009, CU014]
    tableRefs: [TU002]
  - id: durability-and-expansion
    title: Expansion logic is plausible; durability evidence is missing
    body: >-
      The commercial expansion path is coherent: developers can begin with open-source software,
      move to managed LiveKit Cloud when self-operation becomes burdensome, and add telephony,
      model orchestration, observability, and other services as applications reach production.
      Founder testimony that large users asked LiveKit to deploy and scale the system supports this
      mechanism. Yet public proof stops before the metrics needed to judge durability. None of the
      retained sources provides NRR, GRR, logo churn, cohort retention, renewal rate, contract
      length, customer satisfaction, or top-customer revenue concentration. Competitor and
      consultancy sources also warn that infrastructure-shaped adoption demands engineering
      capacity and can lose to more productized platforms at lower volumes. The resulting thesis is
      adoption-positive but retention-unproven, with material implementation and concentration risk
      until management supplies customer-level evidence.
    claimRefs: [CU004, CU011, CU012, CU013, CU015, CU016]
    figureRefs: [FU001]
