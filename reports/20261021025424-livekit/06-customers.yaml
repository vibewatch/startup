figures:
  - id: FU001
    title: Customer adoption surfaces and expansion checkpoints
    type: journey-map
    summary: "An evidence-bounded path from developer evaluation to commercial expansion, with the missing durability proof shown at the final checkpoints."
    data:
      items:
        - label: "Discover"
          detail: "A developer encounters the open-source server, SDKs, or Agents framework."
          touchpoints: ["Open-source project", "Documentation", "SDKs"]
        - label: "Prototype"
          detail: "A technical team builds a real-time voice, video, or AI workflow."
          touchpoints: ["Agents framework", "Web and mobile clients", "Model integrations"]
        - label: "Deploy"
          detail: "The application moves to self-hosted infrastructure or managed LiveKit Cloud."
          touchpoints: ["Self-hosted server", "Managed cloud", "Global media routing"]
        - label: "Operationalize"
          detail: "The team adds telephony, observability, and workflow integrations as use expands."
          touchpoints: ["Telephony", "Monitoring", "Internal tools"]
        - label: "Scale"
          detail: "Higher usage can increase infrastructure depth, but the public evidence does not quantify account expansion."
          touchpoints: ["Usage growth", "Additional modalities", "Managed services"]
        - label: "Renew"
          detail: "Renewal, retention, satisfaction, and concentration remain private-evidence checkpoints."
          touchpoints: ["NRR / GRR", "Contract renewal", "Customer concentration"]
    approximationNotes: "This is a qualitative adoption path synthesized from product and buyer evidence, not an observed cohort funnel; no conversion rates or stage populations are implied."
    claimRefs: [CU004, CU011, CU012, CU013, CU015, CU016]
callouts:
  - calloutType: risk
    title: Commercial durability is the key evidence gap
    body: >-
      Named users and developer reach support product relevance, but they do not substitute for
      NRR, GRR, churn, contract length, paid-account cohorts, or top-customer revenue concentration.
    claimRefs: [CU015, CU016]
