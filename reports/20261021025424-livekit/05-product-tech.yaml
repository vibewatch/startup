chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    LiveKit combines an open-source WebRTC transport layer with an agent runtime,
    managed cloud, model access, telephony, and cross-platform SDKs. The architecture
    offers deployment and model-provider flexibility, but public evidence does not
    independently establish enterprise reliability, compliance scope, or roadmap
    delivery, and the product still requires substantial integration and operations work.
sections:
  - id: "product-scope"
    title: "A programmable realtime platform, not a turnkey agent"
    body: >-
      LiveKit's core product is infrastructure that lets Python or Node.js programs
      participate in realtime rooms alongside users. The official documentation
      positions those programs as stateful agents that can process voice, video, text,
      and tool calls, while third-party descriptions separate the stack into a WebRTC
      server and an agent framework layered above it. The commercial surface extends
      beyond those two open-source components to LiveKit Cloud, client SDKs, LiveKit
      Inference, and telephony. This breadth can reduce the amount of media and agent
      plumbing a customer builds, but it does not make LiveKit a finished voice-agent
      application: the customer still owns workflow logic, model choices, tools, and
      end-user behavior.
    claimRefs: ["CE001", "CE002", "CE006", "CE015"]
    tableRefs: ["TE001"]
  - id: "architecture"
    title: "Room-centric architecture and pluggable intelligence"
    body: >-
      The product's organizing abstraction is a realtime room. A frontend and an agent
      communicate over WebRTC, while the agent reaches the customer's backend through
      HTTP or WebSockets. An agent server registers with either LiveKit Cloud or a
      self-hosted server, receives a dispatch, and starts a job process that joins the
      room. Beneath that lifecycle, an SFU routes media streams without decoding and
      re-encoding them. Above it, AgentSession-style orchestration connects speech
      recognition, language models, speech synthesis, voice activity and turn
      detection, tools, and telemetry. The resulting modularity is technically useful,
      but every added provider creates another latency, availability, privacy, and
      billing boundary.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE016"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "deployment-and-maturity"
    title: "Deployment choice is a strength; maturity proof is uneven"
    body: >-
      LiveKit supports both managed and self-hosted deployment, with official
      documentation describing cloud deployment, transcripts and traces, inference
      access, load balancing, and Kubernetes compatibility. A current practitioner
      guide reported Agents version 1.8.5 in October 2026 with built-in tests,
      simulations, adaptive interruption handling, audio turn detection, and MCP tool
      support. A separate report cited more than one million monthly toolkit downloads,
      which is a useful adoption signal but not a reliability benchmark. The founder's
      own account describes an evolution from an open-source media project into cloud
      and agent infrastructure; it also shows that product expansion is ongoing rather
      than complete.
    claimRefs: ["CE008", "CE010", "CE011", "CE014"]
    tableRefs: ["TE002"]
  - id: "trust-and-technical-risk"
    title: "Control shifts diligence burden to the customer"
    body: >-
      A competitor-authored technical overview attributes end-to-end media encryption,
      track-level controls, and horizontal scaling through Redis and Kubernetes to
      LiveKit, but the assigned evidence does not include first-party certification
      reports, penetration-test results, service-level objectives, incident history, or
      regional failover documentation. Cost and operations are similarly compositional:
      one independent pricing review says WebRTC participant minutes and active agent
      minutes are metered separately, while speech and language-model vendors bill on
      top. In a 2025 interview, cofounder Russ d’Sa explicitly described gaps around
      testing, deployment, load balancing, and observability that the company was
      working to fill. Buyers should therefore underwrite the platform as flexible
      infrastructure whose production outcome depends heavily on their own integration,
      monitoring, safety, and compliance controls.
    claimRefs: ["CE009", "CE012", "CE013"]
