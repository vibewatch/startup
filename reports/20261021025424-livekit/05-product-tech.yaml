callouts:
  - calloutType: "risk"
    title: "Provider flexibility creates compound operating risk"
    body: >-
      Customers can choose model vendors and deployment modes, but they must measure
      total latency, cost, uptime, privacy, and failure behavior across every selected
      component rather than treating LiveKit as the complete service boundary.
    claimRefs: ["CE012", "CE016"]
  - calloutType: "insight"
    title: "The open-source wedge expanded into an end-to-end platform"
    body: >-
      Founder commentary and the current product map show a deliberate progression from
      a WebRTC project to managed cloud, agent orchestration, inference, and operations.
      The strategic upside is a broader control plane; the execution risk is completing
      and integrating all of those surfaces.
    claimRefs: ["CE013", "CE014", "CE015"]
