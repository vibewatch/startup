  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or invalidation trigger
    rows:
      - - Bull
        - >-
          Production voice-AI adoption converts into high-retention managed-cloud revenue; gross margin remains
          attractive after inference and network costs
        - >-
          A premium to the January 2026 mark could become supportable, but no numeric range is defensible before
          operating data
        - Verified ARR growth, NRR, gross margin, and diversified enterprise expansion
        - Growth is download-led rather than paid-production-led
      - - Base
        - Platform adoption continues, but commercialization and product completion require sustained investment
        - The $1B mark remains a financing reference rather than an underwritten enterprise value
        - Stable production workloads plus improving cloud attach and observability
        - No revenue bridge or preference disclosure before the next financing
      - - Bear
        - >-
          Managed competitors win smaller deployments; incomplete tooling slows production conversion; contribution
          margin is pressured
        - Current equity could face multiple compression, preference overhang, or a down round
        - Weak paid conversion, concentrated customers, or rising network and inference costs
        - Financing below the January 2026 mark without compensating operating improvement
    notes: >-
      Scenario ranges are intentionally qualitative because the assigned evidence provides no audited revenue,
      cash-flow, capitalization, or comparable-transaction multiple.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
