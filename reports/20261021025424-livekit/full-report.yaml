        - SIP trunks, phone-number and PSTN providers
        - No carrier mix disclosed
        - Routing or carrier failure interrupts inbound/outbound service
        - High
        - Dual-carrier routing, number-portability plan, and tested fallback
        - Medium; native and external trunk paths still require proof
      - - Runtime platform
        - LiveKit Cloud or customer-operated infrastructure
        - Cloud share versus self-hosted use is undisclosed
        - Cloud dependency or self-host operational failure degrades service
        - High
        - API-compatible self-host exit path plus restore and load tests
        - Medium; portability does not remove migration and operations cost
      - - Customer concentration
        - Named large customers and AI platforms
        - No revenue concentration percentages disclosed
        - Loss, repricing, or insourcing by a large account weakens growth or credibility
        - Unscored
        - Contract, cohort, and pipeline review; diversify production workloads
        - Material unknown until top-customer revenue is disclosed
      - - Capital and valuation expectations
        - Investors and future financing market
        - $100M Series C at $1B reported; primary operating metrics remain incomplete
        - Growth or margin evidence fails to support financing expectations
        - High
        - Board-approved operating plan, runway bridge, and milestone-based valuation discipline
        - High until revenue, ARR, margin, burn, runway, retention, and preferences are reconciled
    notes: >-
      Funding raised is not cash available, and the reported valuation is not operating performance; concentration and
      unit-economics cells are explicitly unresolved where public denominators are absent.
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Strong financing and product signals; missing operating proof
        - Do not underwrite a new entry yet
      - - Confidence
        - Medium
        - Round terms are partially public; financial and cap-table data are not
        - Treat the view as diligence-sensitive
      - - Risk rating
        - High
        - Incomplete platform, uncertain economics, and no disclosed retention or concentration
        - Require downside protection and primary diligence
      - - Valuation stance
        - Stretched
        - $1B financing mark without a disclosed revenue or margin denominator
        - Do not infer a defensible multiple from the round alone
      - - Upgrade condition
        - Conditional
        - Verified recurring revenue, retention, gross margin, and preference stack
        - Reassess only after the evidence package is complete
