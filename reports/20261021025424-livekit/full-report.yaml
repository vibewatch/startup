figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public evidence traces LiveKit from a pandemic-era open-source project through managed cloud launch and successive
      financings to a reported $1 billion valuation.
    data:
      items:
        - date: '2020'
          label: Open-source project begins
          detail: Russ d'Sa dates the project's origin to the pandemic period.
          tone: neutral
          claimRefs:
            - CO003
        - date: '2021'
          label: Company founded
          detail: Public profiles date formal founding by Russ d'Sa and David Zhao to 2021.
          tone: positive
          claimRefs:
            - CO001
        - date: '2021-12-13'
          label: First listed seed round
          detail: A third-party profile lists a $6.74 million seed round.
          tone: neutral
          claimRefs:
            - CO010
        - date: '2022-09-06'
          label: Second listed seed round
          detail: The same profile lists a $7.3 million seed round.
          tone: neutral
          claimRefs:
            - CO010
        - date: '2022'
          label: LiveKit Cloud launches
          detail: The founder interview dates the managed cloud launch to the end of 2022.
          tone: positive
          claimRefs:
            - CO015
        - date: '2024-06-05'
          label: Series A
          detail: A third-party profile reports $22 million raised at a $110 million post-money valuation.
          tone: positive
          claimRefs:
            - CO011
        - date: '2025-04-11'
          label: Series B
          detail: A third-party profile reports $45 million raised at a $345 million post-money valuation.
          tone: positive
          claimRefs:
            - CO012
        - date: '2026-01-22'
          label: Series C and unicorn valuation
          detail: Independent profiles report $100 million raised at a $1 billion valuation.
          tone: positive
          claimRefs:
            - CO007
    approximationNotes: >-
      Year-only dates are used where retained evidence did not establish a specific day; financing amounts and
      valuations are third-party reports rather than filing-derived facts.
    claimRefs:
      - CO001
      - CO003
      - CO007
      - CO010
      - CO011
      - CO012
      - CO015
  - id: FM001
    title: Monthly usage ladder for deployment economics
    type: pyramid
    summary: >-
      A same-unit ladder of cited monthly agent-minute thresholds; it is a deployment-economics lens, not TAM or a
      conversion funnel.
    data:
      items:
        - label: Build included allowance
          value: 1000
          unit: agent-minutes/month
          note: Free prototype tier allowance reported for October 2026.
        - label: Ship included allowance
          value: 5000
          unit: agent-minutes/month
          note: Small-production tier allowance reported for October 2026.
        - label: Framework build threshold
          value: 10000
          unit: agent-minutes/month
          note: Consultancy rule of thumb where custom LiveKit begins to beat managed voice-agent platforms.
        - label: Scale included allowance
          value: 50000
          unit: agent-minutes/month
          note: Growing-production tier allowance reported for October 2026.
        - label: Cloud TCO guidepost
          value: 100000
          unit: agent-minutes/month
          note: Consultancy estimate below which managed Cloud usually wins after engineering time.
        - label: Self-host break-even
          value: 1500000
          unit: agent-minutes/month
          note: Consultancy estimate assuming roughly $15.5K monthly fixed infrastructure and SRE cost.
    approximationNotes: >-
      Values reproduce October 2026 plan allowances and consultancy thresholds. They are not nested market populations,
      forecasts, or conversion stages, and the 10K, 100K, and 1.5M points are workload-dependent estimates.
    claimRefs:
      - CM006
      - CM007
  - id: FP001
    title: Competitive positioning by buyer control and bundled lifecycle breadth
    type: quadrant
    summary: >-
      An ordinal map places LiveKit toward high buyer control and broad lifecycle coverage, between modular frameworks
      and fully managed voice-agent or telecom platforms.
    data:
      xAxis:
        label: Buyer control and deployability
        min: 1
        max: 5
        low: Vendor-managed
        high: Self-hostable and modular
        scale: Analyst ordinal score, not a measured benchmark
      yAxis:
        label: Bundled lifecycle breadth
        min: 1
        max: 5
        low: Single-layer infrastructure
        high: Build, run, telephony, and observe
        scale: Analyst ordinal score, not a measured benchmark
      points:
        - label: LiveKit
          x: 5
          'y': 4
          detail: Self-hostable WebRTC and agents plus managed deployment, telephony, and observability.
        - label: Pipecat
          x: 4
          'y': 3
          detail: Modular open-source framework with optional cloud services; transport and operations remain choices.
        - label: Daily
          x: 3
          'y': 2
          detail: Managed WebRTC transport with broad SDKs; agent orchestration is largely separate.
        - label: Vapi
          x: 2
          'y': 5
          detail: Managed full-call lifecycle and integrations reduce infrastructure work but increase platform dependence.
        - label: Retell AI
          x: 2
          'y': 5
          detail: Managed telephony-agent workflow emphasizes rapid deployment and post-call tooling.
        - label: SignalWire
          x: 2
          'y': 5
          detail: Bundled telecom and AI stack favors breadth and predictable packaging over modular economics.
    approximationNotes: >-
      Coordinates are analyst-assigned ordinal scores from disclosed product scope and deployment models, not latency,
      reliability, price, or market-share measurements. Equal coordinates do not imply equal products, and the source
      set lacks independent benchmark data.
    claimRefs:
      - CP016
  - id: FI001
    title: Revenue model bridge from adoption to monetized workload
    type: flow
    summary: >-
      Public evidence supports the commercial path through metered infrastructure, but not the final conversion from
      revenue to gross profit.
    data:
      nodes:
        - id: open-source
          label: Open-source adoption
          detail: Free self-hosted server and Agents framework create developer distribution.
        - id: application-workload
          label: Application workload
          detail: Developers build persistent real-time voice, video, and agent sessions.
        - id: managed-demand
          label: Managed-cloud demand
          detail: Users that do not want to deploy and scale the stack ask LiveKit to operate it.
        - id: metered-cloud
          label: Metered Cloud sessions
          detail: Managed media and agent-session usage form a recurring workload-linked charge.
        - id: attached-components
          label: Inference and telephony attach
          detail: STT, LLM, TTS, phone numbers, and call minutes add variable usage lines.
        - id: gross-profit-gap
          label: Revenue disclosed; gross profit unavailable
          detail: Public sources do not disclose mix, pass-through cost, realized price, or margin.
      edges:
        - from: open-source
          to: application-workload
          label: Developer adoption
        - from: application-workload
          to: managed-demand
          label: Production scaling need
        - from: managed-demand
          to: metered-cloud
          label: Hosted conversion
        - from: metered-cloud
          to: attached-components
          label: Workload expansion
        - from: attached-components
          to: gross-profit-gap
          label: Revenue less undisclosed delivery costs
    approximationNotes: >-
      Conceptual sequence only; node size is not proportional to revenue, and no public source provides stream mix,
      conversion rates, recognized revenue, or gross profit.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
  - id: FE001
    title: LiveKit product architecture stack
    type: stack
    summary: >-
      The stack separates user surfaces, realtime transport, agent execution, model services, and customer-owned
      application operations.
    data:
      layers:
        - label: User and device surfaces
          modules:
            - Web, mobile, embedded, and game clients
            - Phone callers through SIP / PSTN
        - label: Room and session control
          modules:
            - Participants, tracks, signaling, and room state
        - label: Realtime media transport
          modules:
            - WebRTC connectivity
            - Selective Forwarding Unit media routing
        - label: Agent execution
          modules:
            - Agent server registration and dispatch
            - Per-room job and AgentSession lifecycle
        - label: Model and interaction pipeline
          modules:
            - STT, LLM, TTS, turn detection, and tools
            - LiveKit Inference or external model providers
        - label: Customer application and operations
          modules:
            - Backend APIs over HTTP / WebSockets
            - Deployment, traces, transcripts, evaluation, and support controls
    approximationNotes: >-
      Conceptual layer ordering only; it does not represent latency, throughput, ownership, or deployment boundaries to
      scale.
    claimRefs:
      - CE001
      - CE004
      - CE008
      - CE012
      - CE016
  - id: FU001
    title: Customer adoption surfaces and expansion checkpoints
    type: journey-map
    summary: >-
      An evidence-bounded path from developer evaluation to commercial expansion, with the missing durability proof
      shown at the final checkpoints.
    data:
      items:
        - label: Discover
          detail: A developer encounters the open-source server, SDKs, or Agents framework.
          touchpoints:
            - Open-source project
            - Documentation
            - SDKs
        - label: Prototype
          detail: A technical team builds a real-time voice, video, or AI workflow.
          touchpoints:
            - Agents framework
            - Web and mobile clients
            - Model integrations
        - label: Deploy
          detail: The application moves to self-hosted infrastructure or managed LiveKit Cloud.
          touchpoints:
            - Self-hosted server
            - Managed cloud
            - Global media routing
        - label: Operationalize
          detail: The team adds telephony, observability, and workflow integrations as use expands.
          touchpoints:
            - Telephony
            - Monitoring
            - Internal tools
        - label: Scale
          detail: Higher usage can increase infrastructure depth, but the public evidence does not quantify account expansion.
          touchpoints:
            - Usage growth
            - Additional modalities
            - Managed services
        - label: Renew
          detail: Renewal, retention, satisfaction, and concentration remain private-evidence checkpoints.
          touchpoints:
            - NRR / GRR
            - Contract renewal
            - Customer concentration
    approximationNotes: >-
      This is a qualitative adoption path synthesized from product and buyer evidence, not an observed cohort funnel; no
      conversion rates or stage populations are implied.
    claimRefs:
      - CU004
      - CU011
      - CU012
      - CU013
      - CU015
      - CU016
  - id: FR001
    title: 'Risk heatmap: evidence-based prioritization'
    type: matrix
