        title: Exhibits
        blocks:
          - type: callout
            title: Scale evidence is not financial evidence
            body: >-
              Developer reach and a high-profile deployment validate product relevance, but they do not establish ARR,
              gross margin, retention, customer concentration, or economical fit for lower-volume buyers.
            calloutType: risk
            claimRefs:
