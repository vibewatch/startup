chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              LiveKit is a privately financed real-time communications infrastructure company whose formal founding is
              dated to 2021 by two third-party profiles. Founder Russ d'Sa traces the underlying project to the pandemic
              period, while the company describes an evolution from an open-source WebRTC project for livestreaming and
              video conferencing into a developer platform for voice, video, and physical AI. The commercial model is
              open-core: the server remains self-hostable, while LiveKit Cloud packages managed global media, agent
              hosting, inference, telephony, and observability. This gives developers portability at the code layer
              while concentrating LiveKit's monetization and operating responsibility in the managed service. Public
              headquarters descriptions conflict between San Jose and San Francisco, so neither location should be
              treated as verified without corporate records.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO008
              - CO009
              - CO013
              - CO014
      - number: '1.2'
        title: Financing and scale signals
        blocks:
          - type: paragraph
            body: >-
              The clearest financing event in the retained evidence is the January 2026 Series C: several independent
              profiles report $100 million raised at a $1 billion valuation, led by Index Ventures. Earlier profile data
              describes two seed rounds, a $22 million Series A, and a $45 million Series B, but the underlying
              financing documents were not present in the assigned pool. Even the cumulative total is not stable: one
              profile reports $181 million while another reports about $183 million. Adoption evidence is stronger but
              still company-originated at its root; LiveKit says more than 300,000 developers and teams use the
              platform. No retained company-issued source discloses ARR, profitability, headcount, paying-customer
              count, ownership, or liquidation terms.
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is founder-led. Third-party profiles identify Russ d'Sa as co-founder and
              CEO and David Zhao as co-founder and CTO; the founder interview also depicts Zhao as the technical
              co-creator of the original platform. That pairing provides direct founder-market fit across product
              strategy and infrastructure engineering, but it also implies meaningful key-person dependence because the
              public record does not identify a broader executive bench. The assigned sources do not establish board
              membership, independent directors, voting control, founder ownership, succession planning, or material
              leadership changes. Those omissions prevent a reliable governance assessment and should be closed with
              current corporate records rather than inferred from investor participation.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              LiveKit's sequence shows a credible infrastructure-to-AI transition: an open-source project emerged during
              the pandemic, the company formed in 2021, LiveKit Cloud launched by the end of 2022, and larger venture
              rounds followed through the January 2026 unicorn financing. OpenAI's use of LiveKit Cloud for ChatGPT
              Advanced Voice supplies an important product-validation signal, although LiveKit itself is the source for
              the daily-user claim. The commercial risk is that open-source flexibility does not guarantee an attractive
              deployment choice at every customer scale: an independent implementation consultant recommends managed
              competitors below roughly 10,000 minutes per month once engineering effort is counted. The underwriting
              focus should therefore move from developer reach to verified conversion, retention, concentration, and
              cloud gross-margin evidence.
            claimRefs:
