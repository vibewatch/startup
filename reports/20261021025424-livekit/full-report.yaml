      - CV002
      - CV006
      - CV011
      - CV013
      - CV014
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - Company-reported network usage reaches billions of calls annually
        - Independent usage verification or declining traffic quality
      - - Thesis
        - Agents framework is company-reported at more than 1M monthly downloads
        - Low conversion from downloads to durable paid workloads
      - - Thesis
        - Open-source core plus managed cloud creates a commercialization path
        - Cloud attach and expansion fail to cover network and support costs
      - - Anti-thesis
        - Founder said the platform was not yet complete
        - Delivered testing, deployment, observability, and reliability proof
      - - Anti-thesis
        - Practitioner analysis favors managed platforms below about 10K minutes per month
        - Evidence of efficient low-volume acquisition and retention
      - - Anti-thesis
        - No public ARR, margin, retention, or concentration denominator supports the $1B mark
        - Audited or board-grade operating data supports a durable premium multiple
    notes: >-
      Usage metrics are company claims; cost thresholds are practitioner estimates and should not be treated as audited
      economics.
