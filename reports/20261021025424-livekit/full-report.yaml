      incident or concentration denominators.
    data:
      columns:
        - id: likelihood
          label: Likelihood
        - id: impact
          label: Impact
        - id: mitigation
          label: Mitigation maturity
        - id: residual
          label: Residual severity
      rows:
        - id: compliance
          label: AI disclosure, consent, and data governance
          values:
            - High if in scope
            - High
            - Developing
            - High
        - id: latency
          label: Latency-driven user rejection
          values:
            - High
            - High
            - Moderate
            - High
        - id: regression
          label: Model, prompt, or tool regression
          values:
            - Medium
            - High
            - Moderate
            - Medium
        - id: availability
          label: Cloud or stateful-runtime availability
          values:
            - Unscored
            - High
            - Claimed
            - Material unknown
        - id: dependencies
          label: Model and telephony counterparties
          values:
            - High
            - High
            - Moderate
            - Medium-high
        - id: economics
          label: Economic and concentration opacity
          values:
            - Unscored
            - High
            - Low
            - High
    approximationNotes: >-
      Analyst-defined ordinal labels, not observed incident probabilities; 'unscored' marks missing denominators rather
      than low likelihood.
    claimRefs:
      - CR005
      - CR008
      - CR010
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The evidence chain moves from strategic proof to an explicitly conditional track decision.
    data:
      nodes:
        - id: scale
          label: Scale signal
          detail: Billions of annual calls and more than 1M monthly Agents downloads are company-reported.
        - id: financing
          label: Financing proof
          detail: $100M Series C at a reported $1B valuation.
        - id: product
          label: Product breadth
          detail: Realtime network, Agents, inference, deployment, and observability ambition.
        - id: execution
          label: Execution gap
          detail: Founder acknowledged an incomplete platform and missing lifecycle capabilities.
        - id: valuation
          label: Valuation gap
          detail: No disclosed ARR, margin, retention, concentration, or preference denominator.
        - id: decision
          label: Track / research more
          detail: Require primary operating and cap-table evidence before pricing an entry.
    approximationNotes: The sequence is analytical rather than probabilistic; it does not assign weights or conversion rates.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV011
      - CV013
      - CV014
