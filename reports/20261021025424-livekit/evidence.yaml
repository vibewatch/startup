evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-company-metrics
    missingEvidence: >-
      Company-verified ARR or revenue, gross margin, NRR, paying-customer count, headcount, customer concentration, and
      a reconciliation from bookings to recognized revenue.
    whyItMatters: >-
      Developer adoption and funding do not establish commercial conversion, retention, operating leverage, or the
      durability of the reported valuation.
    diligencePath: >-
      Obtain board-approved monthly financials, cohort retention, customer-level revenue, audited headcount, and
      management's KPI definitions through the data room.
    relatedQuestionRefs:
      - QO004
  - type: conflicting-data
    severity: material
    topic: funding-and-ownership
    missingEvidence: >-
      Executed financing documents, an updated capitalization table, cash-versus-secondary allocation, liquidation
      preferences, investor ownership, and reconciliation of the $181 million and $183 million cumulative-funding
      figures.
    whyItMatters: >-
      Round headlines do not establish cash available, dilution, control rights, or the economic seniority that affects
      investor outcomes.
    diligencePath: >-
      Reconcile signed stock-purchase documents, wire receipts, secondary schedules, and the fully diluted
      capitalization table with company counsel.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Current board and observer roster, voting agreements, founder ownership, executive bench, succession plans, and a
      log of material leadership changes.
    whyItMatters: >-
      Founder-led product and technical coverage may create key-person and control risk that cannot be measured from
      public profiles.
    diligencePath: >-
      Request charter documents, board minutes, voting agreements, organization charts, employment agreements, and
      management succession materials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      An independent market forecast with explicit category boundary, geography, base year, forecast period, CAGR, and
      spend denominator.
    whyItMatters: Without a consistent denominator, TAM, SAM, SOM, growth, and attainable share would be false precision.
    diligencePath: >-
      Obtain current market studies for programmable RTC and voice-agent infrastructure, reconcile their category
      definitions, and test them against bottom-up customer usage.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: adoption-proxies
    missingEvidence: >-
      Primary definitions and dated counts for unique developers, active projects, paying organizations, downloads, and
      annual calls.
    whyItMatters: The retained 100K-plus and 300K-plus developer claims cannot be compared or converted into customers or spend.
    diligencePath: >-
      Request internal metric definitions, monthly cohorts, duplicate-account treatment, and source-system exports, then
      reconcile against billing records.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Segment-level contract value, sales cycle, budget owner, open-source-to-paid conversion, retention, and customer
      concentration.
    whyItMatters: >-
      Public workflow examples do not establish which segments pay, how quickly they adopt, or how durable their spend
      is.
    diligencePath: >-
      Review CRM opportunity history, cohort conversion, retention, gross revenue retention, and top-customer contracts
      by workload and buyer.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A matched-workload benchmark of latency, uptime, call success, interruption quality, staffing burden, and all-in
      cost across LiveKit and material alternatives.
    whyItMatters: >-
      Vendor pages and commercially interested comparisons cannot establish whether LiveKit's control advantage
      translates into superior production economics or reliability.
    diligencePath: >-
      Run a paid pilot on identical call flows and geographies, collect p50/p95 latency, failed call rate, intervention
      hours, and full invoices, and obtain customer references for each shortlisted platform.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: enterprise-contracting
    missingEvidence: >-
      Realized enterprise discounts, concurrency commitments, support SLAs, compliance attachments, data-residency
      terms, and migration assistance for LiveKit and competitors.
    whyItMatters: >-
      Public list prices use different units and exclusions, so contract terms can reverse the apparent cost and risk
      ranking.
    diligencePath: >-
      Issue a common RFP with normalized traffic, regions, model mix, retention, compliance, and support requirements
      and compare binding quotes on a single cost model.
    relatedQuestionRefs:
      - QP004
      - QP007
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Monthly recognized revenue, ARR bridge, revenue mix, realized pricing, deferred revenue, contract duration,
      renewals, churn, NRR, and customer concentration.
    whyItMatters: >-
      These inputs determine whether reported adoption converts into durable, diversified recurring revenue rather than
      volatile usage or concentrated contracts.
    diligencePath: >-
      Obtain the monthly management accounts, customer-level revenue export, contract sample, cohort retention schedule,
      and ARR-to-GAAP-revenue reconciliation.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by product, infrastructure and model-provider spend, support cost, CAC, payback, sales cycle, and
      channel commissions.
    whyItMatters: >-
      Usage growth can increase both revenue and delivery cost, so public prices alone cannot establish operating
      leverage or a credible margin path.
    diligencePath: >-
      Review product-level contribution margins, vendor invoices, cloud commitments, sales attribution, pipeline
      conversion, and customer-support allocation for the latest 12 months.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, monthly net burn, debt and lease obligations, committed infrastructure spend, use of Series C
      proceeds, board plan, and next financing trigger.
    whyItMatters: >-
      Capital raised does not reveal remaining liquidity, and a larger operating base may raise fixed and variable cash
      needs before revenue and margin are independently verified.
    diligencePath: >-
      Obtain bank statements, cap table and financing documents, debt schedule, accounts payable, hiring plan, and a
      monthly 24-month cash forecast with downside sensitivities.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-compliance
    missingEvidence: >-
      Current certification scope, penetration-test results, SLA and SLO history, incident record, data-residency
      controls, and region-level failover design.
    whyItMatters: >-
      Public feature descriptions do not establish whether regulated or business-critical workloads meet a buyer's
      security, availability, and recovery requirements.
    diligencePath: >-
      Request the trust package, architecture review, subprocessors, DPA or BAA terms where applicable, twelve months of
      incident and SLO data, and a failover demonstration.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: material
    topic: framework-maturity
    missingEvidence: >-
      First-party release history and support-lifecycle evidence corroborating the third-party report of Agents version
      1.8.5 and its listed features.
    whyItMatters: >-
      Framework version, deprecation cadence, and long-term support determine migration burden and production upgrade
      risk.
    diligencePath: >-
      Review the official changelog, release artifacts, support policy, deprecation notices, and upgrade telemetry for
      the customer's chosen SDKs.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: private-evidence-only
    severity: material
    topic: production-performance
    missingEvidence: >-
      Workload-matched latency, uptime, concurrency, tool-success, interruption, and end-to-end cost benchmarks from
      production deployments.
    whyItMatters: Architecture descriptions and download counts do not prove performance or economics for a specific traffic shape.
    diligencePath: >-
      Run a paid pilot with representative calls, regions, models, tools, failure injection, and customer-owned
      observability before committing to production.
    relatedQuestionRefs:
      - QE009
      - QE010
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer-level NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort expansion, satisfaction,
      and top-customer revenue concentration.
    whyItMatters: >-
      Without durability and concentration metrics, named adoption cannot establish recurring revenue quality or
      downside exposure.
    diligencePath: >-
      Request anonymized customer and revenue cohorts for at least eight quarters, the top-20 customer schedule, renewal
      calendar, contract terms, and reference calls selected from both renewed and churned accounts.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      An authoritative roster distinguishing paid production customers, pilots, open-source users, partners, and
      historical users, with deployment date, scope, volume, outcome, and renewal status.
    whyItMatters: >-
      Publicly named organizations may represent materially different relationship stages and cannot be treated as a
      uniform customer population.
    diligencePath: >-
      Reconcile the public sample against CRM and billing records, then verify a stratified set of customer references
      directly.
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: adoption-scale
    missingEvidence: >-
      A dated management reconciliation of unique active developers, active organizations, paying customers, toolkit
      downloads, calls, and minutes using stable definitions.
    whyItMatters: The public metrics use different denominators and cannot establish conversion, growth, or retention.
    diligencePath: >-
      Obtain monthly operating dashboards and metric definitions for the past 24 months, including duplicate-account
      treatment and free-to-paid conversion.
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: primary diligence gaps
    missingEvidence: >-
      A primary incident chronology, achieved availability by region, current SOC 2 report and bridge letter,
      contractual SLA, and remediation records.
    whyItMatters: >-
      Without these artifacts, outage and security-control likelihood cannot be quantified and a stated uptime target
      cannot be treated as achieved reliability.
    diligencePath: >-
      Request twelve months of incident and uptime exports, audit reports and exceptions, RTO/RPO results, contractual
      SLA language, and the latest disaster-recovery exercise.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: revenue disclosure
    missingEvidence: >-
      Management-verified revenue, ARR, gross margin, burn, runway, NRR, customer cohorts, top-customer concentration,
      and financing preferences.
    whyItMatters: >-
      Secondary funding and valuation reports do not establish cash availability, recurring revenue quality, capital
      efficiency, retention, or downside protection.
    diligencePath: >-
      Reconcile audited financials, bank cash, board budgets, cohort schedules, customer-level revenue, cap table, debt,
      and preference terms with management.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
