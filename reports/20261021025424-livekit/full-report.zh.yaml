  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的 核心 市场 是 开发者 基础设施 用于 应用 该 必须 承载 与 编排 实时 音频，视频，与 AI-智能体 会话. 纳入的 支出 因此 涵盖 托管 媒体 传输，智能体-会话 编排，部署，电话
              界面，录制，与 可观测性；模型 推理 与 运营商 转嫁通过 成本 是 相邻 输入 而不是 LiveKit 收入 unless purchased 通过 其 gateway. 该 边界 应 不 吞并 该 整个
              联络中心，视频-会议，generative-AI，或 云 市场. 买方 可以 而是 运营 该 Apache 许可的 技术栈，组装 原始 WebRTC 基础设施，使用 传统 通信 API，或 buy 一个 更多
              bundled 语音-智能体 平台. 创始人 证词 称 早期 企业 用户 希望 LiveKit 至 部署 与 规模化 该 开源 软件 用于 它们，确立 托管 运营 - 而不是 该 底层 协议 单独 - 作为 该
              商业 任务 至 成为 done.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 受证据约束的市场规模与采用情况
        blocks:
          - type: paragraph
            body: >-
              没有 保留 来源 提供 一个 市场-广泛 总体，支出 分母，或 可比的 预测 从 其中 至 计算 TAM，SAM，CAGR，或 可实现的 份额. 公司-特定 代理指标 是 directionally 有用 但
              不一致：一个 数据 资料 称 100，000-多 开发者 与 500-多 付费 客户 用于 2025，而 另一个 资料 声称 超过 300，000 开发者 没有 一个 common 衡量 日期 或 定义. 一个
              单独 article 称 超过 一个 百万 月度 Agents-工具包 下载 与 数十亿 的 年度 通话，但 两者都不 metric 指出 独立的 付费 组织 或 LiveKit-attributable 支出.
              一个 私有-公司 数据库 记录 $10m 旁边 该 4 月 2025 融资 而 警告 该 此类 条目 可能 成为 运行费率 收入，ARR，或 LTM 收入. 这些 观察 是 采用 信号，不 可相加的 市场-规模
              组件.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
