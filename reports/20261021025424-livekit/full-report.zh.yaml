              - CM009
              - CM010
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              开发者 与 平台 工程师 是 该 主要 用户，而 产品，工程，基础设施，联络中心，或 digital-运营 负责人 是 该 可能 经济上的 买方. 该 采用 路径 开始，配有 一个 免费 云 额度 或 自托管
              原型，推进 至 一个 托管 生产环境 层级 当……时 正常运行时间 与 运营 简便性 重要，与 可以 转向 转向 企业 合同 或 自托管 作为 并发，合规，数据 控制，与 单位 经济性 become 重大. 该
              付款方 因……而异 由 工作负载：工程 或 云 预算 资助 embedded 通信，客户-experience 预算 资助 支持 智能体，与 受监管的 业务 units 需要 安全，同意，留存率，与 审计 控制.
              证据 仍然 弱 在 实际 采购 cycles，平均 合同 价值，转化 从 开源 用量，与 预算 替代 由 分层.
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 采用驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用 是 拉动 由 该 转变 从 文本 界面 转向 有状态的 语音 与 multimodal 应用，由 企业 该 更偏好 一个 vendor-operated 网络 至 运行 WebRTC 自身，与 由 该
              ability 至 调节 模型 供应商 与 成本. 其 是 constrained 由 延迟 敏感性，推理 与 出口 费用，并发 ceilings，合规 工作，可观测性 要求，与 该 专业的 运营 负担 的
              自托管. 这些 constraints 因……而异 由 工作流：患者 接入 可能 容忍 longer turns，而 沉浸式 语言 学习 取决于 在 conversational 响应速度. 用于 估值，该 相关
              证明 是 不 一个 广泛 语音-AI 预测 但 转化 的 开发者 进入 持久的 付费 工作负载，披露 用量 增长，毛-利润率 行为 跨越 网络 与 推理 成本，留存率，与 客户集中度. 没有 的 这些 队列 或
              单位-经济上的 分母 是 可用 在 该 指定 证据.
            claimRefs:
              - CM007
              - CM008
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 指定证据中没有可辩护的 TAM
            body: >-
              该 保留 来源池 lacks 一个 consistent 市场-支出 分母，市场 预测，或 分层 转化 数据. 视为 开发者，下载，通话-用量，与 公司-收入 数字 作为 单独 代理指标 与 要求 主要 队列 与
              用量 证据 在……之前 投资判断 市场 份额.
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局横跨多个层级
        blocks:
          - type: paragraph
            body: >-
              LiveKit competes 对比 超过 一个 产品 category 因为 买方 可以 replace 该 传输，智能体 框架，托管 runtime，电话 层，或 该 整个 assembled 技术栈.
              一个 竞争对手-撰写的 比较 指出 Pipecat，Vapi，Retell，Daily，Telnyx，SignalWire，与 Agora 作为 替代方案，但 它们 是 不
              interchangeable：Pipecat 是 框架-领投，Daily 是 传输-领投，Vapi 与 Retell emphasize 托管 智能体 部署，与 该 电信-oriented 供应商 bundle
              网络 能力. LiveKit 其本身 结合 一个 Apache 2.0 WebRTC 服务器，配有 一个 智能体 框架 与 Cloud 服务. 其 据报道 1 月 2026 融资 提供 一个 规模化 信号，不
              证明 该 其 产品 outperforms 这些 替代方案. Internal 构建 与 continued 使用 的 单独 WebRTC，模型，SIP，与 可观测性 供应商 保持 status-quo
              substitutes 即使 当……时 没有 单一 竞争对手 replaces 每一 层.
            claimRefs:
              - CP001
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP013
              - CP014
      - number: '3.2'
        title: 控制权与部署灵活性是最清晰的差异化因素
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的 最强 披露 differentiation 是 部署 选择. 该 相同 智能体 代码 可以 connect 至 一个 自托管 服务器 或 LiveKit Cloud，而 该 托管 产品 增加
              一个 全球 媒体 mesh，部署，native 电话，与 会话 可观测性. 该 公司 也 声称 广泛 模型 覆盖 与 bundles 语音，语言-模型，合成，轮次-检测，工具-使用，与 电话 支持 在 其 框架.
              该 广度 reduces 该 需要 至 invent 实时 编排，但 其 无法 使 该 技术栈 没有-代码：一个 独立 目录 与 一个 第三方 评审 两者 characterize LiveKit 作为 基础设施
              该 仍 需要 该 买方 至 构建. 该 由此形成的 position 是 defensible 用于 工程-领投 团队 该 价值 控制，但 更少 compelling 用于 买方 其 主要 criterion 是
              immediate 部署 通过 一个 visual 或 完全 托管 工作流.
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP009
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP009
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: 经济性取决于用量与运营责任
        blocks:
          - type: paragraph
            body: >-
              公开 比较 重大 places LiveKit Cloud's 基础 智能体-会话 收费 于 $0.01 每 分钟 在……之前 语音，模型，电话，与 可观测性 费用. 竞争对手 列表 价格 使用 不同 分母 与
              inclusions，因此 它们 无法 成为 ranked 作为 全部-在 单位 经济性. 一个 语音-工程 咨询机构 估算 该 托管 平台 是 preferable 低于 约 10，000 分钟 每 月 与 该
              LiveKit 可以 更低 每-通话 成本 由 60–80% 于 更高 规模化；该 是 方向性 vendor-side 指导 而不是 经审计 证据. Switching 成本 是 两个-sided：Apache
              许可的 基础设施 与 模型 plugins 降低 平台 lock-在，而 应用 代码，WebRTC 运营，SIP configuration，监控，与 multi-vendor 故障 diagnosis
              raise 实施 成本. Multi-homing 仍然 可能的，但 其 转移 可靠性 所有权 回到 至 该 买方.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
      - number: '3.4'
        title: 护城河可信，但尚未经过独立基准验证
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的 披露 moat 结合 开源 采用，实时 媒体 基础设施，与 一个 widening 托管 生命周期. 公司-据报道 用量 的 300，000-多 开发者，数十亿 的 年度 通话，与 300-多
              模型 integrations suggests 生态系统 触达，但 这些 数字 是 不 independently 验证 在 该 指定 来源池. 更多 importantly，联合创始人 Russ d'Sa
              承认 在 9 月 2025 该 该 产品 曾是 不 尚未 完整 与 指出 缺口 约 评估，部署，与 可观测性；he 也 描述 弥补 这些 缺口 作为 该 战略性 方向. 该 当前 产品 页面 now 市场 这些
              生命周期 能力，implying progress，但 没有 保留 来源 测试 其 可靠性 或 parity 对比 Vapi，Retell，Daily，或 电信 incumbents. Durability 因此
              rests 在 执行：converting 控制 与 生态系统 广度 进入 更低 总额 成本 与 可靠 生产环境 结果 在……之前 托管 竞争对手 commoditize 编排.
            claimRefs:
