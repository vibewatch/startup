              LiveKit 支持 两者 托管 与 自托管 部署，，配有 官方 文档 describing 云 部署，transcripts 与 追溯，推理 access，load balancing，与 Kubernetes
              compatibility. 一个 当前 从业者 guide 据报道 Agents version 1.8.5 在 October 2026，配有 构建-在 测试，simulations，adaptive
              interruption handling，音频 轮次 检测，与 MCP 工具 支持. 一个 单独 报告 cited 超过 一个 百万 月度 工具包 下载，其中 是 一个 有用 采用 信号 但 不 一个 可靠性
              基准. 该 创始人's own 账户 描述 一个 演进 从 一个 开源 媒体 项目 进入 云 与 智能体 基础设施；其 也 显示 该 产品 扩张 是 ongoing 而不是 完整.
