  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从战略层面的证明，走向明确附带条件的跟踪决策。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 年通话量达数十亿次、Agents 月下载量超过 1M，均为公司自报。
        - id: financing
          label: 融资证明
          detail: C 轮融资规模为 $100M，报道估值为 $1B。
        - id: product
          label: 产品广度
          detail: 实时网络、Agents、推理、部署和可观测性布局。
        - id: execution
          label: 执行缺口
          detail: 创始人承认平台尚不完整，且缺少部分生命周期能力。
