        - 云依赖或自托管运营故障拖累服务
        - 高
        - 兼容 API 的自托管退出路径，以及恢复和负载测试
        - 中；可迁移性无法消除迁移和运维成本
      - - 客户集中度
        - 被点名的大客户及 AI 平台
        - 未披露收入集中度百分比
        - 大客户流失、重新定价或内制削弱增长或可信度
        - 未评分
        - 审阅合同、客户分组和销售管线；分散生产工作负载
        - 在披露头部客户收入前为重大未知
      - - 资本与估值预期
        - 投资者及未来融资市场
        - 据报道以 $1B 估值完成 $100M Series C；主要运营指标仍不完整
        - 增长或利润率证据不足以支撑融资预期
        - 高
        - 董事会批准的运营计划、现金跑道桥接及基于里程碑的估值纪律
        - 在收入、ARR、利润率、烧钱、现金跑道、留存和优先权安排完成核对前为高
    notes: 融资额不等于可用现金，报道中的估值也不等于运营表现；当缺少公开分母时，集中度和单位经济性单元明确标记为未解决。
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: 建议摘要
    columns:
      - 决策字段
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 融资和产品信号强，但缺少运营证明
        - 暂不评估新进入机会
      - - 信心
        - 中
        - 轮次条款部分公开；财务和股权表数据未公开
        - 将该判断视为对尽调敏感
      - - 风险评级
        - 高
        - 平台不完整、经济性不确定，且未披露留存或集中度
        - 要求下行保护和一手尽调
      - - 估值立场
        - 偏高
        - $1B 融资估值缺少公开的收入或利润率分母
        - 不要仅凭该轮融资推断站得住脚的倍数
      - - 升级条件
        - 有条件
        - 已验证的经常性收入、留存、毛利率及优先股堆叠
        - 证据包完整后再重新评估
    notes: 该建议是基于证据的筛选判断，不是报价；私有运营和股权表数据仍不可得。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV011
      - CV013
      - CV014
  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 观察角度
      - 有证据支持的论点
      - 哪些变化会改变判断
    rows:
      - - 正方论点
        - 公司报告称网络使用量达到每年数十亿通电话
        - 独立使用量验证，或流量质量下降
      - - 正方论点
        - 公司报告称 Agents 框架月下载量超过 1M
        - 下载转化为持久付费工作负载的比例低
      - - 正方论点
        - 开源核心加托管云构成商业化路径
        - 云端附加销售和扩张不足以覆盖网络及支持成本
      - - 反方论点
        - 创始人称平台尚未完成
        - 已交付测试、部署、可观测性和可靠性证明
      - - 反方论点
        - 从业者分析偏好每月约 10K 分钟以下使用托管平台
        - 低用量获客和留存效率得到证明
      - - 反方论点
        - 没有公开 ARR、利润率、留存或集中度分母来支撑 $1B 估值
        - 经审计或达到董事会标准的运营数据支撑持久的溢价倍数
    notes: 使用量指标属于公司声称；成本阈值是从业者估算，不应视为经审计的经济性。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行或失效触发条件
    rows:
      - - 乐观
        - 生产环境语音 AI 的采用转化为高留存的托管云收入；扣除推理和网络成本后，毛利率仍具吸引力
        - 相对 2026 年 1 月估值的溢价可能变得有依据，但在运营数据出来前，任何数值区间都站不住脚
        - 已验证的 ARR 增长、NRR、毛利率及多元化企业扩张
        - 增长来自下载而非付费生产环境使用
      - - 基准
        - 平台采用继续推进，但商业化和产品完善需要持续投入
        - $1B 估值仍是融资参考，而不是经过投资判断的企业价值
        - 生产工作负载稳定，同时云端附加销售和可观测性改善
        - 下一轮融资前没有收入桥接或优先权披露
      - - 悲观
        - 托管平台竞争对手赢下较小部署；工具不完整拖慢生产转化；贡献利润率承压
        - 当前股权可能面临倍数压缩、优先权悬置或下轮融资
        - 付费转化疲弱、客户集中，或网络与推理成本上升
        - 融资低于 2026 年 1 月估值，且没有运营改善作为补偿
    notes: 情景区间有意保持定性，因为指定证据没有经审计的收入、现金流、资本结构或可比交易倍数。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
