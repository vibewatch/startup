      - CM007
  - id: FP001
    title: 按买方控制力与捆绑生命周期广度定位竞争格局
    type: quadrant
    summary: 序数地图将 LiveKit 放在较高买方控制力和较广生命周期覆盖的位置，介于模块化框架与全托管语音智能体或电信平台之间。
    data:
      xAxis:
        label: 买方控制力与可部署性
        min: 1
        max: 5
        low: 供应商托管
        high: 可自托管且模块化
        scale: Analyst ordinal score, not a measured benchmark
      yAxis:
        label: 捆绑的生命周期广度
        min: 1
        max: 5
        low: 单层基础设施
        high: 构建、运行、电话通信与观测
        scale: Analyst ordinal score, not a measured benchmark
      points:
        - label: LiveKit
          x: 5
          'y': 4
          detail: 可自托管的 WebRTC 和智能体，加上托管部署、电话通信与可观测性。
        - label: Pipecat
          x: 4
          'y': 3
          detail: 模块化开源框架，可选云服务；传输和运维仍由用户自行选择。
        - label: Daily
          x: 3
          'y': 2
          detail: 托管 WebRTC 传输，SDK 覆盖面广；但 Agent 编排基本彼此独立。
        - label: Vapi
          x: 2
          'y': 5
          detail: 托管完整通话生命周期并提供集成，减少基础设施工作，但也加深对平台的依赖。
        - label: Retell AI
          x: 2
          'y': 5
          detail: 托管电话 Agent 工作流，侧重快速部署和通话后工具。
        - label: SignalWire
          x: 2
          'y': 5
          detail: 将电信与 AI 技术栈打包，优先追求覆盖面和可预测的套餐，而非模块化经济性。
    approximationNotes: 坐标是分析师根据已披露的产品范围和部署模式赋予的序数评分，不代表延迟、可靠性、价格或市场份额测量值。坐标相同不代表产品相同，且现有来源缺乏独立基准数据。
    claimRefs:
      - CP016
  - id: FI001
    title: 从采用到工作负载变现的收入模型桥接
    type: flow
    summary: 公开证据支持通过按量计费的基础设施实现商业化，但尚不足以证明收入最终能转化为毛利。
    data:
      nodes:
        - id: open-source
          label: 开源采用
          detail: 免费的自托管服务器和 Agents 框架带来开发者分发。
        - id: application-workload
          label: 应用工作负载
          detail: 开发者构建持续运行的实时语音、视频和 Agent 会话。
        - id: managed-demand
          label: 托管云需求
          detail: 不想自行部署和扩展技术栈的用户，会要求 LiveKit 代为运营。
        - id: metered-cloud
          label: 按量计费的 Cloud 会话
          detail: 托管媒体和 Agent 会话的使用，形成与工作负载挂钩的经常性收费。
        - id: attached-components
          label: 推理与电话服务附加
          detail: STT、LLM、TTS、电话号码和通话分钟数带来可变用量收入。
        - id: gross-profit-gap
          label: 收入已披露；毛利不可得
          detail: 公开来源未披露收入构成、转嫁成本、实际价格或利润率。
      edges:
        - from: open-source
          to: application-workload
          label: 开发者采用
        - from: application-workload
          to: managed-demand
          label: 生产环境扩展需求
        - from: managed-demand
          to: metered-cloud
          label: 转为托管
        - from: metered-cloud
          to: attached-components
          label: 工作负载扩张
        - from: attached-components
          to: gross-profit-gap
          label: 收入扣除未披露的交付成本
    approximationNotes: 这只是概念性链路；节点大小不与收入成比例，且没有公开来源提供收入流构成、转化率、确认收入或毛利。
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
  - id: FE001
    title: LiveKit 产品架构栈
    type: stack
    summary: 该技术栈将用户界面、实时传输、Agent 执行、模型服务与客户自有的应用运营分开。
    data:
      layers:
        - label: 用户与设备界面
          modules:
            - Web、移动端、嵌入式和游戏客户端
            - 通过 SIP / PSTN 接入的电话呼叫方
        - label: 房间与会话控制
          modules:
            - 参与者、轨道、信令和房间状态
        - label: 实时媒体传输
          modules:
            - WebRTC 连接
            - 选择性转发单元媒体路由
        - label: Agent 执行
          modules:
            - Agent 服务器注册与调度
            - 按房间划分的任务和 AgentSession 生命周期
        - label: 模型与交互管线
          modules:
            - STT、LLM、TTS、轮次检测和工具
            - LiveKit Inference 或外部模型提供商
        - label: 客户应用与运营
          modules:
            - 基于 HTTP / WebSockets 的后端 API
            - 部署、追踪、转录文本、评估和支持控制
    approximationNotes: 这只是概念性的分层顺序，不代表延迟、吞吐量、所有权或可扩展部署边界。
    claimRefs:
      - CE001
      - CE004
      - CE008
      - CE012
      - CE016
  - id: FU001
    title: 客户采用路径与扩张检查点
    type: journey-map
    summary: 这条路径从开发者评估走向商业扩张，受证据范围约束；最终检查点明确显示了尚缺的持续性证明。
    data:
      items:
        - label: 发现
          detail: 开发者接触到开源服务器、SDK 或 Agents 框架。
          touchpoints:
            - 开源项目
            - 文档
            - SDK
        - label: 原型
          detail: 技术团队构建实时语音、视频或 AI 工作流。
          touchpoints:
            - Agents 框架
            - Web 和移动端客户端
            - 模型集成
        - label: 部署
          detail: 应用迁移到自托管基础设施或托管的 LiveKit Cloud。
          touchpoints:
            - 自托管服务器
            - 托管云
            - 全球媒体路由
        - label: 运营化
          detail: 随着使用扩大，团队加入电话服务、可观测性和工作流集成。
          touchpoints:
            - 电话服务
            - 监控
            - 内部工具
        - label: 扩展
          detail: 更高的使用量可能带动基础设施深度，但公开证据没有量化账户扩张。
          touchpoints:
            - 使用增长
            - 其他模态
            - 托管服务
        - label: 续约
          detail: 续约、留存、满意度和客户集中度仍是只能靠私有证据验证的检查点。
          touchpoints:
            - NRR / GRR
            - 合同续约
            - 客户集中度
    approximationNotes: 这是一条根据产品和买方证据综合出的定性采用路径，并非观察到的队列漏斗；不代表任何转化率或阶段人数。
