          - type: paragraph
            body: >-
              该 最清晰 当前 legal 触发因素 在 该 reviewed 证据 是 有条件的 在 部署 geography 与 使用 案例. Fora Soft 称 该 EU AI Act Article 50
              transparency 有 applied since 2 August 2026 与 需要 披露 当……时 一个 在-scope 用户 是 interacting，配有 AI；其 也 指出
              录制-同意，erasure，与 PCI handling 作为 工程 要求 而不是 post-推出 paperwork. LiveKit 的 文档 称 构建-在 推理 使用 zero 数据 留存率 由
              default，而 一个 竞争对手 比较 称 该 SOC 2 Type II 称 与 HIPAA eligibility，配有 一个 BAA 是 层级-dependent. 这些 控制 可以 mitigate
              exposure，但 该 指定 来源池 contains 没有 regulator 文本，DPA，BAA，审计 报告，或 客户 合同. 该 投资 implication 是 至 视为 合规 作为 一个 gated
              部署 workstream 与 验证 主要 artifacts 在……之前 受监管的 或 recorded 工作负载 是 计入 在 该 论点.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.2'
        title: 延迟、回归控制与有状态运营主导产品风险
        blocks:
          - type: paragraph
            body: >-
              语音-智能体 质量 取决于 在 一个 端到端至-末期 chain 而不是 一个 基础设施 component. Fora Soft 称 该 responses 高于 600 milliseconds feel
              increasingly sluggish 与 该 callers 可能 hang up 高于 1.5 秒；其 也 cites 生产环境 medians 的 约 1.4-1.7 秒 与 p99 延迟 的 3-5
              秒，underscoring 该 缺口 在……之间 一个 optimized 目标 与 ordinary 生产环境 行为. LiveKit 的 cofounder 分别 描述 智能体 作为 有状态的 与
              always-在，requiring 不同 部署 与 load-balancing practices 从 web 应用. 该 官方 云 页面 advertises 一个 99.99% 正常运行时间 目标，不
              衡量 achieved 正常运行时间. 缺失 主要 事故 历史 means 可用性 likelihood 无法 成为 quantified. Mitigation 成熟度 因此 取决于 在 验证
              SLOs，multi-stage tracing，regression evaluations，工具-通话 confirmation，与 测试 failover 而不是 该 平台 声称 单独.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR015
              - CR016
      - number: '7.3'
        title: 可移植性降低锁定，却无法消除依赖风险
        blocks:
          - type: paragraph
            body: >-
              LiveKit 文件 一个 有意义的 可移植性 valve：该 开源 服务器 与 云 服务 使用 该 相同 API，而 自托管 转移 扩展，telemetry，ingress，出口，与 智能体 运营 回到 至 该
              客户. 该 选择 converts vendor 依赖 进入 运营 complexity 而不是 eliminating 风险. 一个 typical cascade 也 涵盖 语音 识别，一个 语言 模型，语音
              合成，电话，与 应用 工具，因此 延迟，政策，定价，或 可用性 变化 可以 compound 跨越 counterparties. 融资 能力 是 不 该 相同 作为 经济上的 证明. 次级 来源 报告 一个 1
              月 2026 $100m 轮 C 于 一个 $1b 估值，但 一个 次级 资料 两者 displays 一个 “年度 Run 费率” 的 $10M+ 与 称 公开 收入 与 盈利能力 是 不 披露. 收入
              质量，消耗，资金续航，毛利率，留存率，与 客户 客户集中度 因此 保持 尽调 缺口，不 underwritten facts.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: 尽调应把公开说法转化为可监测的验收测试
        blocks:
          - type: paragraph
            body: >-
              公开 证据 支持 一个 有条件的 而不是 complacent 风险 view. 在……之前 投资判断 受监管的 deployments，obtain 该 实际 SOC 2 报告，DPA，BAA 其中
              applicable，subprocessor 列表，留存率 settings，与 录制-同意 工作流. 在……之前 投资判断 可靠性，需要 twelve 月 的 事故 历史，achieved 可用性 由
              region，recovery objectives，p95 与 p99 轮次 延迟，工具-error rates，与 一个 demonstrated rollback drill. 在……之前 投资判断
              经济性，reconcile 收入 versus ARR，毛利率，消耗，资金续航，NRR，与 前客户 客户集中度 从 管理 记录. 分析师-defined 论点-break 触发因素 应 包括 一个 未解决 重大
              控制 exception，repeated 严重 outage 没有 corrective action，sustained p95 response 高于 该 使用-案例
              tolerance，unconfirmed 高-impact 工具 actions，或 经济性 该 无法 支持 该 $1b 融资 基准. 这些 是 proposed 决策 gates，不 声称 该 此类
              failures 有 occurred.
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 论点失效条件
            body: >-
              Pause 部署 或 投资判断 如果 主要 合规 artifacts 无法 成为 produced 用于 该 intended 工作负载，如果 严重 incidents recur 没有 验证
              corrective action，如果 p95 response exceeds 该 使用-案例 tolerance 在……之后 remediation，如果 高-impact 工具 可以 act 没有
              confirmation，或 如果 管理 无法 reconcile 收入，ARR，利润率，消耗，资金续航，留存率，与 前客户 客户集中度. 这些 是 分析师-proposed acceptance 测试；公开
              证据 无法 证明 该 任何 触发因素 有 已经 fired.
            calloutType: risk
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR014
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              该 建议 是 track / research 更多，，配有 中 confidence，高 风险，与 一个 stretched 估值 立场. LiveKit announced 一个 $100m 轮 C 于 一个
              $1b 估值 在 1 月 22，2026，由……领投 Index Ventures 与 joined 由 Salesforce Ventures，Hanabi Capital，Altimeter，与
              Redpoint. 该 事件 demonstrates 资本-市场 sponsorship，但 其 无法 披露 该 收入，毛利率，留存率，客户集中度，或 现金 资料 需要 至 转化 该 headline 估值标记
              进入 一个 运营 multiple. Entry discipline 应 因此 成为 有条件的 而不是 价格-point precise：没有 新 投资 建议 是 supportable 直到 管理 提供 一个
              recurring-收入 桥接表，队列 留存率，毛利率，消耗，与 完全 diluted capitalization. 一个 更低 次级 价格 单独 会 不 cure 缺失 运营 证据 或 未知 优先权.
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 正反论点
        blocks:
          - type: paragraph
            body: >-
              该 论点 是 该 LiveKit occupies 一个 technically 重要 层 在……之间 foundation 模型 与 实时 应用. 该 公司 称 其 Agents 框架 是 downloaded
              超过 一个 百万 times 每个 月 与 其 网络 handles 数十亿 的 通话 annually；一个 创始人 访谈 也 描述 早期 需求 从 大型 企业 与 一个 托管-云 商业化 路径. 该
              anti-论点 是 该 技术 采用 可能 不 translate 进入 持久的，高-利润率 收入. 该 创始人 分别 承认 该 该 平台 曾是 不 尚未 完整 与 指出 缺口 跨越 测试，部署，扩展，与
              可观测性. 独立 从业者 指导 further argues 该 托管 替代方案 可以 成为 更多 经济 低于 约 10，000 分钟 每 月，其中 narrows 该 addressable 工作负载 其中
              custom LiveKit deployments 有 一个 obvious 总额-成本 advantage.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: 融资背景、情景与可比对象
        blocks:
          - type: paragraph
            body: >-
              该 最新 轮次 是 该 仅 决策-grade 估值 anchor 在 该 指定 证据. Simple post-money arithmetic equates 一个 $100m 投资 于 一个 $1b
              post-money 估值 至 约 10% headline 所有权，但 option-来源池 变化，次级 sales，清算 优先权，债务，参与 权利，与 投资者 protections 是 不 公开. 该 可用
              比较 重大 是 运营 而不是 transactional：从业者 分析 contrasts LiveKit，配有 Vapi，Retell，Pipecat，与 Bland 在 构建 time 与 每-分钟 成本，而
              一个 industry 目录 描述 LiveKit 作为 基础设施 而不是 一个 末期 产品. 两者都不 来源 提供 公开-公司 multiples，私有-轮次 收入 multiples，或 相关 M&一个
              consideration. Accordingly，该 bull，基础，与 bear cases 使用 observable 证明 thresholds 而是 的 invented 估值 ranges 或 目标
              returns.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              Exit readiness 无法 成为 已证明 从 该 指定 公开 证据. 一个 战略性 买方 可以 价值 LiveKit 的 实时 网络，开源 采用，模型 编排，与 开发者 distribution，但 没有
              来源 文件 acquisition interest，一个 公开-市场 timetable，经审计 financials，或 治理 readiness. 该 decisive 尽调 package 是 一个 月度
              ARR 与 bookings 桥接表，毛-利润率 decomposition 由 Cloud，Agents，推理，与 电话，net 与 毛 留存率，客户 与 模型-供应商 客户集中度，消耗 与 资金续航，安全 与
              正常运行时间 历史，与 该 完整 优先股堆叠. 论点-break 触发因素 是 measurable：stalled 生产环境 转化，留存率 低于 基础设施-软件 expectations，persistent
              negative contribution 利润率 在……之后 推理 与 网络 成本，严重 客户 客户集中度，或 一个 融资 轮次 低于 该 1 月 2026 估值标记 没有 offsetting 运营
              improvement. 直到 这些 items 是 resolved，一个 exit multiple 或 hold-时期 return 会 成为 false precision.
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: >-
              战略性 相关性 是 不 sufficient 估值 支持. Maintain 一个 track 立场 直到 recurring 收入，留存率，利润率，客户集中度，消耗，与 优先股堆叠 可以 成为 测试 对比 该
              $1b reference 估值标记.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV013
              - CV014
