chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              LiveKit 是 一个 privately financed 实时 通信 基础设施 公司 其 正式 成立 是 dated 至 2021 由 两个 第三方 资料. 创始人 Russ d'Sa 追溯 该 底层 项目
              至 该 疫情 时期，而 该 公司 描述 一个 演进 从 一个 开源 WebRTC 项目 用于 直播 与 视频 会议 进入 一个 开发者 平台 用于 语音，视频，与 实体 AI. 该 商业 模型 是 开放式核心：该
              服务器 仍然 可自托管，而 LiveKit Cloud 打包提供 托管 全球 媒体，智能体 托管，推理，电话，与 可观测性. 该 gives 开发者 可移植性 于 该 代码 层 而 集中 LiveKit 的 变现
              与 运营 责任 在 该 托管 服务. 公开 总部 描述 conflict 在……之间 San Jose 与 San Francisco，因此 两者都不 地点 应 成为 视为 作为 验证 没有 公司 记录.
