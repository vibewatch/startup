  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 可编程的实时平台，而不是开箱即用的智能体
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的 核心 产品 是 基础设施 该 lets Python 或 Node.js programs participate 在 实时 rooms alongside 用户. 该 官方 文档
              positions 这些 programs 作为 有状态的 智能体 该 可以 流程 语音，视频，文本，与 工具 通话，而 第三方 描述 单独 该 技术栈 进入 一个 WebRTC 服务器 与 一个 智能体 框架
              layered 高于 其. 该 商业 surface extends 超出 这些 两个 开源 组件 至 LiveKit Cloud，client SDKs，LiveKit 推理，与 电话. 该 广度 可以 降低
              该 amount 的 媒体 与 智能体 plumbing 一个 客户 builds，但 其 无法 使 LiveKit 一个 finished 语音-智能体 应用：该 客户 仍 owns 工作流 logic，模型
              choices，工具，与 端到端用户 行为.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE008
              - CE011
              - CE015
      - number: '5.2'
        title: 以房间为中心的架构与可插拔智能
        blocks:
          - type: paragraph
            body: >-
              该 产品's organizing abstraction 是 一个 实时 房间. 一个 frontend 与 一个 智能体 communicate 超过 WebRTC，而 该 智能体 reaches 该
              客户's backend 通过 HTTP 或 WebSockets. 一个 智能体 服务器 registers，配有 either LiveKit Cloud 或 一个 自托管 服务器，receives 一个
              dispatch，与 开始 一个 任务 流程 该 joins 该 房间. Beneath 该 生命周期，一个 SFU routes 媒体 streams 没有 decoding 与 re-encoding 它们.
              高于 其，AgentSession-style 编排 connects 语音 识别，语言 模型，语音 合成，语音 activity 与 轮次 检测，工具，与 telemetry. 该 由此形成的
              modularity 是 technically 有用，但 每一 added 供应商 creates 另一个 延迟，可用性，隐私，与 billing 边界.
            claimRefs:
              - CE003
