        blocks:
          - type: paragraph
            body: >-
              LiveKit 的 sequence 显示 一个 可信 基础设施-至-AI 转型：一个 开源 项目 出现 during 该 疫情，该 公司 成立 在 2021，LiveKit Cloud 推出 由 该 末期 的
              2022，与 更大 风险投资 轮次 跟随 通过 该 1 月 2026 unicorn 融资. OpenAI's 使用 的 LiveKit Cloud 用于 ChatGPT Advanced Voice 提供 一个
              重要 产品-validation 信号，尽管 LiveKit 其本身 是 该 来源 用于 该 每日-用户 声称. 该 商业 风险 是 该 开源 灵活性 无法 guarantee 一个 有吸引力 部署 选择 于
