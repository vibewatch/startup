  - id: FM001
    title: 部署经济性的月度用量梯度
    type: pyramid
    summary: 这是引用来源中的同单位月度智能体分钟阈值梯度，用来观察部署经济性，而不是 TAM 或转化漏斗。
    data:
      items:
        - label: Build 包含额度
          value: 1000
          unit: agent-minutes/month
          note: 据报道，2026 年 10 月免费原型层的包含额度。
        - label: Ship 包含额度
          value: 5000
          unit: agent-minutes/month
          note: 据报道，2026 年 10 月小规模生产层的包含额度。
        - label: 框架构建阈值
          value: 10000
          unit: agent-minutes/month
          note: 咨询公司的经验法则：从这一水平起，自定义 LiveKit 开始胜过托管语音智能体平台。
        - label: Scale 包含额度
          value: 50000
          unit: agent-minutes/month
          note: 据报道，2026 年 10 月增长型生产层的包含额度。
        - label: 云端 TCO 参考点
          value: 100000
          unit: agent-minutes/month
          note: 咨询公司估算：低于这一水平时，计入工程时间后托管云通常更划算。
        - label: 自托管盈亏平衡点
          value: 1500000
          unit: agent-minutes/month
          note: 咨询公司估算，假设每月固定基础设施和 SRE 成本约为 $15.5K。
    approximationNotes: 数值复现 2026 年 10 月的套餐额度和咨询公司阈值。它们不是嵌套的市场人群、预测或转化阶段，10K、100K 和 1.5M 三个点是取决于工作负载的估算。
