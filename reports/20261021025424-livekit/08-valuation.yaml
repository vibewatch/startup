company:
  name: LiveKit
chapter:
  number: 8
  title: Valuation
  summary: >-
    LiveKit's $100 million Series C at a reported $1 billion valuation confirms
    financing access and strategic interest in voice-AI infrastructure, but the
    assigned public evidence does not disclose ARR, margins, retention, cap-table
    terms, or defensible transaction comparables. The resulting stance is track
    rather than buy: compelling product and usage signals do not yet support a
    price-based return case.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is track / research more, with medium confidence, high
      risk, and a stretched valuation stance. LiveKit announced a $100 million
      Series C at a $1 billion valuation on January 22, 2026, led by Index
      Ventures and joined by Salesforce Ventures, Hanabi Capital, Altimeter, and
      Redpoint. That event demonstrates capital-market sponsorship, but it does
      not disclose the revenue, gross margin, retention, concentration, or cash
      profile needed to convert the headline mark into an operating multiple.
      Entry discipline should therefore be conditional rather than price-point
      precise: no new investment recommendation is supportable until management
      supplies a recurring-revenue bridge, cohort retention, gross margin, burn,
      and fully diluted capitalization. A lower secondary price alone would not
      cure missing operating evidence or unknown preferences.
    claimRefs: [CV001, CV002, CV011, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that LiveKit occupies a technically important layer between
      foundation models and realtime applications. The company says its Agents
      framework is downloaded more than one million times each month and its
      network handles billions of calls annually; a founder interview also
      describes early demand from large enterprises and a managed-cloud
      commercialization path. The anti-thesis is that technical adoption may
      not translate into durable, high-margin revenue. The founder separately
      acknowledged that the platform was not yet complete and identified gaps
      across testing, deployment, scaling, and observability. Independent
      practitioner guidance further argues that managed alternatives can be more
      economical below roughly 10,000 minutes per month, which narrows the
      addressable workload where custom LiveKit deployments have an obvious
      total-cost advantage.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: financing-scenarios-and-comparables
    title: Financing context, scenarios, and comparables
    body: >-
      The latest round is the only decision-grade valuation anchor in the
      assigned evidence. Simple post-money arithmetic equates a $100 million
      investment at a $1 billion post-money valuation to roughly 10% headline
      ownership, but option-pool changes, secondary sales, liquidation
      preferences, debt, participation rights, and investor protections are not
      public. The available comparison material is operational rather than
      transactional: practitioner analysis contrasts LiveKit with Vapi, Retell,
      Pipecat, and Bland on build time and per-minute cost, while an industry
      directory describes LiveKit as infrastructure rather than an end product.
      Neither source supplies public-company multiples, private-round revenue
      multiples, or relevant M&A consideration. Accordingly, the bull, base, and
      bear cases use observable proof thresholds instead of invented valuation
      ranges or target returns.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness cannot be established from the assigned public evidence.
      A strategic buyer could value LiveKit's realtime network, open-source
      adoption, model orchestration, and developer distribution, but no source
      documents acquisition interest, a public-market timetable, audited
      financials, or governance readiness. The decisive diligence package is a
      monthly ARR and bookings bridge, gross-margin decomposition by Cloud,
      Agents, inference, and telephony, net and gross retention, customer and
      model-provider concentration, burn and runway, security and uptime
      history, and the complete preference stack. Thesis-break triggers are
      measurable: stalled production conversion, retention below
      infrastructure-software expectations, persistent negative contribution
      margin after inference and network costs, severe customer concentration,
      or a financing round below the January 2026 mark without offsetting
      operating improvement. Until those items are resolved, an exit multiple
      or hold-period return would be false precision.
    claimRefs: [CV004, CV006, CV010, CV011, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, "Track / research more", "Strong financing and product signals; missing operating proof", "Do not underwrite a new entry yet"]
      - [Confidence, Medium, "Round terms are partially public; financial and cap-table data are not", "Treat the view as diligence-sensitive"]
      - [Risk rating, High, "Incomplete platform, uncertain economics, and no disclosed retention or concentration", "Require downside protection and primary diligence"]
      - [Valuation stance, Stretched, "$1B financing mark without a disclosed revenue or margin denominator", "Do not infer a defensible multiple from the round alone"]
      - [Upgrade condition, Conditional, "Verified recurring revenue, retention, gross margin, and preference stack", "Reassess only after the evidence package is complete"]
    notes: "The recommendation is an evidence-based screening view, not an offer price; private operating and cap-table data remain unavailable."
    claimRefs: [CV001, CV002, CV006, CV011, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - [Thesis, "Company-reported network usage reaches billions of calls annually", "Independent usage verification or declining traffic quality"]
      - [Thesis, "Agents framework is company-reported at more than 1M monthly downloads", "Low conversion from downloads to durable paid workloads"]
      - [Thesis, "Open-source core plus managed cloud creates a commercialization path", "Cloud attach and expansion fail to cover network and support costs"]
      - [Anti-thesis, "Founder said the platform was not yet complete", "Delivered testing, deployment, observability, and reliability proof"]
      - [Anti-thesis, "Practitioner analysis favors managed platforms below about 10K minutes per month", "Evidence of efficient low-volume acquisition and retention"]
      - [Anti-thesis, "No public ARR, margin, retention, or concentration denominator supports the $1B mark", "Audited or board-grade operating data supports a durable premium multiple"]
    notes: "Usage metrics are company claims; cost thresholds are practitioner estimates and should not be treated as audited economics."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV011]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or invalidation trigger
    rows:
      - [Bull, "Production voice-AI adoption converts into high-retention managed-cloud revenue; gross margin remains attractive after inference and network costs", "A premium to the January 2026 mark could become supportable, but no numeric range is defensible before operating data", "Verified ARR growth, NRR, gross margin, and diversified enterprise expansion", "Growth is download-led rather than paid-production-led"]
      - [Base, "Platform adoption continues, but commercialization and product completion require sustained investment", "The $1B mark remains a financing reference rather than an underwritten enterprise value", "Stable production workloads plus improving cloud attach and observability", "No revenue bridge or preference disclosure before the next financing"]
      - [Bear, "Managed competitors win smaller deployments; incomplete tooling slows production conversion; contribution margin is pressured", "Current equity could face multiple compression, preference overhang, or a down round", "Weak paid conversion, concentrated customers, or rising network and inference costs", "Financing below the January 2026 mark without compensating operating improvement"]
    notes: "Scenario ranges are intentionally qualitative because the assigned evidence provides no audited revenue, cash-flow, capitalization, or comparable-transaction multiple."
    claimRefs: [CV004, CV006, CV007, CV009, CV010, CV011, CV012, CV015, CV016]
