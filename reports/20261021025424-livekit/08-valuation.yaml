callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Strategic relevance is not sufficient valuation support. Maintain a track
      stance until recurring revenue, retention, margin, concentration, burn,
      and preference terms can be tested against the $1 billion reference mark.
    claimRefs: [CV001, CV011, CV013, CV014]
