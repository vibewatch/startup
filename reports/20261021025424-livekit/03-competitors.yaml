  - id: TP002
    title: Capability and buyer-tradeoff matrix
    columns:
      - Buying criterion
      - LiveKit
      - Framework / transport alternatives
      - Managed agent platforms
      - Telecom / network platforms
    rows:
      - ["Deployment control", "Self-hosted server or managed Cloud", "Generally high for Pipecat; managed transport for Daily", "Primarily vendor-managed", "Varies by carrier and product"]
      - ["Time to first production call", "Requires code and integration work", "Requires framework and transport assembly", "Positioned for rapid setup", "Requires telecom configuration despite bundled components"]
      - ["Realtime media layer", "Native distributed WebRTC SFU", "Daily provides transport; Pipecat can use multiple transports", "Abstracted behind managed service", "Carrier or proprietary realtime network"]
      - ["Telephony", "Native SIP and managed telephony disclosed", "May require separate integration", "Typically bundled or directly integrated", "Core capability for Telnyx and SignalWire; third-party SIP for some others"]
      - ["Model and pipeline control", "Plugins plus LiveKit Inference; code-first orchestration", "High in Pipecat's modular pipeline", "Broad integrations but platform-controlled runtime", "Varies; bundled-native economics may constrain choice"]
      - ["Lifecycle tooling", "Deployment and observability marketed by LiveKit", "Depends on cloud layer or external tools", "Testing, analytics, and handoffs are productized", "Varies and is not consistently evidenced"]
      - ["Compliance posture", "Company claims SOC 2 Type II, GDPR, CCPA, and HIPAA", "Plan and hosting dependent", "Plan-level add-ons and terms vary", "Claims vary; assigned evidence does not verify scope"]
      - ["Operational burden", "Higher when self-hosted; multi-vendor diagnosis remains", "Assembly and operations remain with buyer", "Lower infrastructure burden but higher vendor dependence", "Telecom concepts and account controls remain material"]
    notes: >-
      Cells summarize disclosed product positioning rather than measured outcomes. "Varies" and
      "not consistently evidenced" mean the assigned pool did not support a uniform comparison;
      LiveKit compliance statements are company claims with no independent scope verification.
    claimRefs: [CP002, CP006, CP007, CP009, CP012, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Platform
      - Public price cited
      - Unit
      - Included or excluded
      - Evidence date / caveat
      - Buyer implication
    rows:
      - [LiveKit Cloud, "$0.01", "per concurrent AI-agent session minute", "Speech, model, telephony, and observability components can add fees", "Cekura June 2026; Fora Soft October 2026", "Low base fee is not an all-in call cost"]
      - [Pipecat Cloud, "$0.01", "per active agent-1x session minute", "Provider costs remain separate; PSTN reported at $0.018/min", "Cekura June 2026", "Framework economics depend on the selected transport and models"]
      - [Vapi, "$0.05", "platform minute", "Provider costs passed through; some compliance features are monthly add-ons", "Cekura June 2026", "Fast deployment trades against additive provider and compliance costs"]
      - [Retell AI, "$0.07+", "voice-agent minute", "LLM and telephony costs reported separately", "Cekura June 2026", "Advertised rate is not all-in"]
      - [Daily, "$0.004", "participant minute for video and audio", "Participant-based billing; agent logic is separate", "Cekura June 2026", "Different denominator prevents direct comparison with agent-session pricing"]
      - [Telnyx, "$0.05", "Conversational AI minute", "Standard STT and TTS included; model tokens and telephony can vary", "Cekura June 2026", "Carrier integration may reduce assembly but does not fix total model cost"]
      - [SignalWire, "$0.16", "AI minute", "Positioned as including STT, TTS, LLM, and telephony when using native stack", "Cekura June 2026", "Bundling improves predictability but narrows provider-choice economics"]
      - [Agora, "$0.10", "Conversational AI minute", "Managed-key ASR, LLM, and TTS reported included; BYOK adds provider cost", "Cekura June 2026", "Network reach and model sourcing must be evaluated separately"]
    notes: >-
      Prices retain their published units and exclusions and should not be converted into an all-in
      ranking. Cekura sells voice-agent testing and has a commercial interest in the category;
      Fora Soft sells implementation services. Contract discounts, concurrency limits, taxes,
      carrier geography, model mix, and realized spend are unavailable.
    claimRefs: [CP005, CP008]
figures:
  - id: FP001
    title: Competitive positioning by buyer control and bundled lifecycle breadth
    type: quadrant
    summary: >-
      An ordinal map places LiveKit toward high buyer control and broad lifecycle coverage, between
      modular frameworks and fully managed voice-agent or telecom platforms.
    data:
      xAxis:
        label: Buyer control and deployability
        min: 1
        max: 5
        low: Vendor-managed
        high: Self-hostable and modular
        scale: "Analyst ordinal score, not a measured benchmark"
      yAxis:
        label: Bundled lifecycle breadth
        min: 1
        max: 5
        low: Single-layer infrastructure
        high: Build, run, telephony, and observe
        scale: "Analyst ordinal score, not a measured benchmark"
      points:
        - label: LiveKit
          x: 5
          y: 4
          detail: "Self-hostable WebRTC and agents plus managed deployment, telephony, and observability."
        - label: Pipecat
          x: 4
          y: 3
          detail: "Modular open-source framework with optional cloud services; transport and operations remain choices."
        - label: Daily
          x: 3
          y: 2
          detail: "Managed WebRTC transport with broad SDKs; agent orchestration is largely separate."
        - label: Vapi
          x: 2
          y: 5
          detail: "Managed full-call lifecycle and integrations reduce infrastructure work but increase platform dependence."
        - label: Retell AI
          x: 2
          y: 5
          detail: "Managed telephony-agent workflow emphasizes rapid deployment and post-call tooling."
        - label: SignalWire
          x: 2
          y: 5
          detail: "Bundled telecom and AI stack favors breadth and predictable packaging over modular economics."
    approximationNotes: >-
      Coordinates are analyst-assigned ordinal scores from disclosed product scope and deployment
      models, not latency, reliability, price, or market-share measurements. Equal coordinates do
      not imply equal products, and the source set lacks independent benchmark data.
    claimRefs: [CP016]
callouts:
  - calloutType: insight
    title: The competitive unit is the assembled stack
    body: >-
      Comparing only framework fees obscures the buyer's real choice among transport, models,
      telephony, observability, operations, and compliance responsibility.
    claimRefs: [CP004, CP005, CP006]
  - calloutType: risk
    title: Execution must close the platform gap
    body: >-
      LiveKit's founder previously identified evaluation, deployment, and observability gaps; the
      current product markets those capabilities, but the retained evidence does not benchmark
      their production maturity against managed competitors.
    claimRefs: [CP002, CP010, CP011]
