      - [Pipecat, "Open-source agent framework", "Python teams seeking pipeline-level control", "Frame-based speech and model pipeline; optional cloud hosting", "Funding and audited usage not disclosed in assigned evidence", "Vendor-neutral component swapping", "Server framework is Python-first; production scale evidence is supplier-authored"]
      - [Vapi, "Managed voice-agent platform", "API-first teams prioritizing time to deployment", "Agent orchestration, telephony, handoffs, testing, and managed operations", "Customer names are reported, but audited volume is unavailable", "Fast managed deployment and broad integrations", "Provider and compliance add-ons can sit above the platform fee"]
      - [Retell AI, "Managed voice-agent platform", "Teams seeking low-code telephony agents", "Telephony, streaming, batch calling, and post-call analysis", "Review count is reported by Cekura; audited call volume is unavailable", "Fast path to a working phone agent", "Advertised voice-engine price excludes some model and carrier costs"]
      - [Daily / Pipecat Cloud, "Managed WebRTC transport and agent hosting", "Pipecat and realtime-video teams", "WebRTC network, client SDKs, recording, and Pipecat-native transport", "Cekura says Daily has operated WebRTC since 2016", "Long transport operating history and native Pipecat pairing", "Agent orchestration remains separate from raw transport"]
      - [Telnyx, "Carrier and conversational-AI platform", "Telephony-first and regulated deployments", "Carrier network, SIP, speech services, and AI orchestration", "Cekura reports licensed-carrier operations in 45+ countries", "Direct carrier infrastructure and LiveKit speech plugin", "Account verification and non-native model costs complicate comparison"]
      - [SignalWire, "Telecom and AI platform", "Buyers wanting bundled telecom and predictable billing", "SIP, PSTN, WebRTC, model components, and multi-agent orchestration", "Cekura reports 2,000+ production companies", "Bundled telecom stack and single-price positioning", "Bundled rate depends on use of native components"]
      - [Agora, "Global realtime network and agent engine", "Teams with distributed traffic, especially in emerging markets", "Global RTC network, conversational-AI engine, and open-source TEN framework", "Cekura reports 80B minutes per month across 200+ countries", "Network reach and multimodal framework", "Conversational-AI layer is newer than the underlying network"]
    notes: >-
      Profiles are a representative layer map, not an exhaustive market census. Competitor facts
      and scale figures are drawn mainly from Cekura's commercially interested comparison and are
      not independently benchmarked; unknown funding, usage, or contract terms remain explicit.
