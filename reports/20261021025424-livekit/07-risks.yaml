chapter:
  number: 7
  title: "Risks"
  summary: >-
    LiveKit's most material public-evidence risks are executional rather than proof of a known catastrophic event: latency and tool-chain failures can damage the user experience, compliance must be engineered into each deployment, and managed-cloud claims still require contractual verification. Financial and concentration underwriting remains constrained by inconsistent secondary revenue data and the absence of primary incident, customer-concentration, and audited-control evidence in the assigned pool.
sections:
  - id: "regulatory-and-data-governance"
    title: "Regulatory and data-governance exposure is deployment-specific"
    body: >-
      The clearest current legal trigger in the reviewed evidence is conditional on deployment geography and use case. Fora Soft reports that EU AI Act Article 50 transparency has applied since 2 August 2026 and requires disclosure when an in-scope user is interacting with AI; it also identifies recording-consent, erasure, and PCI handling as engineering requirements rather than post-launch paperwork. LiveKit's documentation says built-in inference uses zero data retention by default, while a competitor comparison reports that SOC 2 Type II reports and HIPAA eligibility with a BAA are tier-dependent. Those controls can mitigate exposure, but the assigned pool contains no regulator text, DPA, BAA, audit report, or customer contract. The investment implication is to treat compliance as a gated deployment workstream and verify primary artifacts before regulated or recorded workloads are counted in the thesis.
    claimRefs:
      - "CR003"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-reliability-and-product-quality"
    title: "Latency, regression control, and stateful operations dominate product risk"
    body: >-
      Voice-agent quality depends on an end-to-end chain rather than one infrastructure component. Fora Soft reports that responses above 600 milliseconds feel increasingly sluggish and that callers may hang up above 1.5 seconds; it also cites production medians of roughly 1.4-1.7 seconds and p99 latency of 3-5 seconds, underscoring the gap between an optimized target and ordinary production behavior. LiveKit's cofounder separately described agents as stateful and always-on, requiring different deployment and load-balancing practices from web applications. The official cloud page advertises a 99.99% uptime target, not measured achieved uptime. Missing primary incident history means availability likelihood cannot be quantified. Mitigation maturity therefore depends on verified SLOs, multi-stage tracing, regression evaluations, tool-call confirmation, and tested failover rather than the platform claim alone.
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR016"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "platform-partner-and-financial-dependencies"
    title: "Portability reduces lock-in but does not remove dependency risk"
    body: >-
      LiveKit documents a meaningful portability valve: the open-source server and cloud service use the same APIs, while self-hosting shifts scaling, telemetry, ingress, egress, and agent operations back to the customer. That choice converts vendor dependence into operating complexity rather than eliminating risk. A typical cascade also spans speech recognition, a language model, speech synthesis, telephony, and application tools, so latency, policy, pricing, or availability changes can compound across counterparties. Funding capacity is not the same as economic proof. Secondary sources report a January 2026 $100 million Series C at a $1 billion valuation, but one secondary profile both displays an “Annual Run Rate” of $10M+ and says public revenue and profitability are not disclosed. Revenue quality, burn, runway, gross margin, retention, and customer concentration therefore remain diligence gaps, not underwritten facts.
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR007"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "investment-implications-and-kill-criteria"
    title: "Diligence should convert public claims into monitored acceptance tests"
    body: >-
      Public evidence supports a conditional rather than complacent risk view. Before underwriting regulated deployments, obtain the actual SOC 2 report, DPA, BAA where applicable, subprocessor list, retention settings, and recording-consent workflow. Before underwriting reliability, require twelve months of incident history, achieved availability by region, recovery objectives, p95 and p99 turn latency, tool-error rates, and a demonstrated rollback drill. Before underwriting economics, reconcile revenue versus ARR, gross margin, burn, runway, NRR, and top-customer concentration from management records. Analyst-defined thesis-break triggers should include an unresolved material control exception, repeated severe outage without corrective action, sustained p95 response above the use-case tolerance, unconfirmed high-impact tool actions, or economics that cannot support the $1 billion financing benchmark. These are proposed decision gates, not claims that such failures have occurred.
    claimRefs:
      - "CR001"
      - "CR005"
      - "CR008"
      - "CR010"
      - "CR014"
      - "CR015"
      - "CR016"
