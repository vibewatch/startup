callouts:
  - calloutType: "risk"
    title: "Thesis-break conditions"
    body: >-
      Pause deployment or underwriting if primary compliance artifacts cannot be produced for the intended workload, if severe incidents recur without verified corrective action, if p95 response exceeds the use-case tolerance after remediation, if high-impact tools can act without confirmation, or if management cannot reconcile revenue, ARR, margin, burn, runway, retention, and top-customer concentration. These are analyst-proposed acceptance tests; public evidence does not establish that any trigger has already fired.
