figures:
  - id: FI001
    title: Revenue model bridge from adoption to monetized workload
    type: flow
    summary: >-
      Public evidence supports the commercial path through metered infrastructure, but not the
      final conversion from revenue to gross profit.
    data:
      nodes:
        - id: open-source
          label: Open-source adoption
          detail: Free self-hosted server and Agents framework create developer distribution.
        - id: application-workload
          label: Application workload
          detail: Developers build persistent real-time voice, video, and agent sessions.
        - id: managed-demand
          label: Managed-cloud demand
          detail: Users that do not want to deploy and scale the stack ask LiveKit to operate it.
        - id: metered-cloud
          label: Metered Cloud sessions
          detail: Managed media and agent-session usage form a recurring workload-linked charge.
        - id: attached-components
          label: Inference and telephony attach
          detail: STT, LLM, TTS, phone numbers, and call minutes add variable usage lines.
        - id: gross-profit-gap
          label: Revenue disclosed; gross profit unavailable
          detail: Public sources do not disclose mix, pass-through cost, realized price, or margin.
      edges:
        - from: open-source
          to: application-workload
          label: Developer adoption
        - from: application-workload
          to: managed-demand
          label: Production scaling need
        - from: managed-demand
          to: metered-cloud
          label: Hosted conversion
        - from: metered-cloud
          to: attached-components
          label: Workload expansion
        - from: attached-components
          to: gross-profit-gap
          label: Revenue less undisclosed delivery costs
    approximationNotes: >-
      Conceptual sequence only; node size is not proportional to revenue, and no public source
      provides stream mix, conversion rates, recognized revenue, or gross profit.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
