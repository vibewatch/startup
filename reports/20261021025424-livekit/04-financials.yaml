schemaVersion: report-v2
artifact: financials
slug: livekit
runDate: 2026-10-21
company:
  name: LiveKit
chapter:
  number: 4
  title: Financials
  summary: >-
    LiveKit has a credible open-core monetization path from free developer adoption to metered
    cloud, inference, telephony, and enterprise usage, but the retained evidence does not expose
    audited revenue, gross margin, retention, customer concentration, burn, cash, or runway. A
    $100 million Series C expands financing capacity, yet it cannot substitute for those
    underwriting inputs.
sections:
  - id: revenue-architecture
    title: Open-source adoption feeds a metered infrastructure model
    body: >-
      LiveKit began as open-source real-time media infrastructure, and founder Russ d'Sa described
      the commercial trigger as large users asking LiveKit to deploy and scale the system for them
      in exchange for payment. That supports an open-core model rather than a conventional
      seat-based SaaS interpretation: the free, self-hostable software seeds applications and
      developer adoption, while managed Cloud usage, agent sessions, inference components,
      telephony, observability, and enterprise terms create monetization surfaces. Public
      third-party profiles describe usage-based charges, but the retained evidence does not
      disclose revenue recognition policy, realized discounts, minimum commitments, contract
      duration, or the mix between infrastructure, model pass-through, telephony, and enterprise
      revenue. The model is therefore intelligible, but revenue quality cannot yet be measured.
    claimRefs:
      - CI001
      - CI002
      - CI007
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: traction-and-revenue-disclosure
    title: Commercial traction is visible, while current revenue remains opaque
    body: >-
      TechCrunch reported in April 2025 that d'Sa said LiveKit had more than 500 paying customers,
      over 100,000 developers, and a prior-year run rate above $10 million. LiveKit's January 2026
      announcement adds operational scale signals—more than one million monthly Agents downloads
      and billions of calls per year—but those are company claims and are not a current ARR or
      recognized-revenue bridge. One retained profile lists outside estimates spanning $3.7
      million to $20 million while separately stating that public revenue and profitability are
      not disclosed. That dispersion is too wide for valuation or margin work and may mix ARR,
      annual revenue, and run-rate concepts. The appropriate underwriting stance is to treat
      adoption as demand evidence, not as a substitute for financial statements.
    claimRefs:
      - CI003
      - CI004
      - CI006
      - CI011
      - CI012
    tableRefs:
      - TI003
  - id: unit-economics-and-cost-structure
    title: Public prices reveal cost drivers, not company gross margin
    body: >-
      A 2026 implementation guide reports a roughly $0.01 per-agent-session-minute platform charge
      beyond plan allowances and estimates a full voice-agent stack at about $0.05 to $0.18 per
      minute before a further 20% to 30% first-deployment overhead. Those figures illuminate the
      workload-sensitive cost stack: media sessions, speech recognition, language-model tokens,
      speech synthesis, telephony, retries, idle capacity, and operations all scale with customer
      activity. They do not establish LiveKit's realized price, take rate, infrastructure cost, or
      gross margin. The same source argues that managed platforms can be more economical below
      roughly 10,000 minutes per month, which is useful adverse evidence on pricing power and
      customer segmentation. CAC, payback, NRR, churn, support intensity, and channel economics
      remain absent from the retained public evidence.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
    tableRefs:
      - TI002
  - id: capital-adequacy-and-verdict
    title: New financing provides capacity but not a public runway calculation
    body: >-
      LiveKit announced a $100 million Series C at a $1 billion valuation in January 2026. That is
      meaningful financing capacity, but funding raised is not cash available: the announcement
      does not disclose cash on hand, monthly burn, debt, working-capital requirements, committed
      model or network spend, or runway. Retained third-party profiles also disagree slightly on
      cumulative funding, reporting $181 million and about $183 million. A reported increase from
      roughly 50 employees in April 2025 to 185 in September 2026 would indicate a materially
      larger operating base if measured consistently, but it is only an opex proxy, not a burn
      estimate. The financial verdict is therefore positive on monetization plausibility and
      financing access, but unresolved on revenue durability, margin path, capital intensity, and
      the next financing trigger.
    claimRefs:
      - CI005
      - CI013
      - CI014
      - CI015
      - CI016
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $100 million Series C improves financing capacity, but public evidence still does not
      disclose cash, burn, debt, gross margin, retention, or customer concentration. A data-room
      revenue bridge and monthly cash forecast are required before underwriting capital adequacy.
    claimRefs:
      - CI005
      - CI010
      - CI015
tables:
  - id: TI001
    title: Revenue streams and monetization surfaces
    columns:
      - Stream
      - Mechanism
      - Billing unit
      - Public value or status
      - Revenue-quality read
      - Diligence ask
    rows:
      - - Open-source server and Agents framework
        - Free, self-hostable software seeds developer adoption
        - Software download or self-hosted deployment
        - No direct software fee in retained evidence
        - Acquisition channel rather than demonstrated revenue
        - Conversion by cohort from open source to paid Cloud
      - - LiveKit Cloud
        - Managed deployment, media transport, and agent sessions
        - Usage and agent-session minutes
        - Third-party profiles cite about $0.01 per agent-session minute beyond allowances
        - Recurring with usage, but utilization and discounts are unknown
        - Committed versus variable mix, realized price, and renewal cohorts
      - - Inference and model components
        - Routed STT, LLM, and TTS consumption
        - Minutes, tokens, or characters by component
        - Variable component prices; company take rate is not disclosed
        - Potential attach revenue with material pass-through costs
        - Gross profit by component and provider concentration
      - - Telephony
        - Phone numbers, inbound minutes, and SIP connectivity
        - Number-month and call minute
        - Public third-party guide cites per-number and per-minute prices
        - Usage-linked revenue with carrier cost exposure
        - Carrier terms, regional mix, and telephony gross margin
      - - Enterprise contracts and observability
        - Contracted capacity, support, controls, and monitoring
        - Contract terms not publicly specified
        - Public profiles say enterprise contracts add revenue beyond usage fees
        - Could improve commitment and retention; no mix is disclosed
        - ARR, ACV, term, renewal, expansion, and support burden by segment
    notes: >-
      Public model summary from founder commentary and third-party profiles; listed prices are not
      realized revenue, contract value, or gross profit, and null commercial terms require diligence.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
  - id: TI002
    title: Public pricing and cost benchmarks
    columns:
      - Item
      - Public benchmark
      - Basis
      - Confidence
      - Underwriting limitation
    rows:
      - - LiveKit agent session
        - Approximately $0.01 per minute beyond plan allowance
        - Third-party October 2026 guide
        - Medium
        - Realized discounts, included usage, and enterprise commitments are unknown
      - - US local phone number
        - $1.00 per month with one free per project
        - Third-party October 2026 guide citing the pricing page
        - Medium
        - Geographic mix and carrier cost are unknown
      - - US local inbound telephony
        - $0.01 per minute
        - Third-party October 2026 guide citing the pricing page
        - Medium
        - Does not include all model, media, support, or retry costs
      - - Third-party SIP on Ship plan
        - $0.004 per minute
        - Third-party October 2026 guide citing the pricing page
        - Medium
        - Contract and carrier economics are not disclosed
      - - Full production voice-agent stack
        - Approximately $0.05 to $0.18 per minute
        - Implementation-vendor estimate across budget to premium stacks
        - Low
        - Customer architecture and vendor mix drive the range
      - - Initial deployment overhead
        - 20% to 30% above the illustrative stack
        - Implementation-vendor estimate for retries, unused tokens, and operations
        - Low
        - Not a LiveKit corporate cost or margin disclosure
    notes: >-
      Benchmarks are third-party list-price and implementation estimates as of October 2026; they
      are not audited LiveKit revenue, realized customer pricing, or company cost of revenue.
    claimRefs:
      - CI007
      - CI008
      - CI009
  - id: TI003
    title: Underwriting metrics and capital-adequacy gaps
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Paying customers and developers
        - More than 500 paying customers and over 100,000 developers, reported April 2025
        - Medium
        - Indicates adoption but not revenue quality
        - Current paid logos, cohort conversion, and active-developer definition
      - - Revenue run rate
        - More than $10 million for 2024, according to the founder via TechCrunch
        - Medium
        - Only dated commercial-scale datapoint in retained evidence
        - Monthly recognized revenue and ARR bridge through September 2026
      - - Outside revenue estimates
        - $3.7 million to $20 million
        - Low
        - Wide range prevents a reliable valuation multiple
        - Reconcile ARR, GAAP revenue, run rate, and period definitions
      - - Gross margin
        - null
        - Low
        - Tests infrastructure scalability and model pass-through burden
        - Gross margin by Cloud, inference, telephony, and enterprise support
      - - CAC and payback
        - null
        - Low
        - Determines whether open-source adoption lowers sales cost
        - New-logo CAC, sales cycle, payback, and partner commissions
      - - NRR, churn, and concentration
        - null
        - Low
        - Measures durability and exposure to large AI customers
        - GRR, NRR, logo churn, top-10 share, and expansion by cohort
      - - Series C financing
        - $100 million announced at a $1 billion valuation in January 2026
        - High
        - Provides financing capacity but does not reveal cash available
        - Net cash received, preferences, use of proceeds, and board-approved plan
      - - Cash, burn, debt, and runway
        - null
        - Low
        - Required to assess the next-round trigger and downside protection
        - Monthly cash, burn, debt schedule, commitments, and 24-month forecast
    notes: >-
      Null means the metric was not disclosed in the retained assigned evidence; financing raised
      is shown separately from cash available and does not support a runway estimate.
    claimRefs:
