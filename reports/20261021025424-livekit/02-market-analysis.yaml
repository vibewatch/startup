company:
  name: "LiveKit"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "LiveKit addresses a bounded infrastructure market spanning open-source real-time media, managed WebRTC, voice-agent orchestration, telephony, and observability. The available evidence supports a usage- and buyer-economics view of adoption, but not a defensible TAM/SAM/SOM: developer, customer, download, and call-volume figures lack consistent definitions, periods, and independent corroboration."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      LiveKit's core market is developer infrastructure for applications that must carry and
      orchestrate real-time audio, video, and AI-agent sessions. Included spend therefore spans
      managed media transport, agent-session orchestration, deployment, telephony interfaces,
      recording, and observability; model inference and carrier pass-through costs are adjacent
      inputs rather than LiveKit revenue unless purchased through its gateway. The boundary should
      not absorb the entire contact-center, video-conferencing, generative-AI, or cloud markets.
      Buyers can instead operate the Apache-licensed stack, assemble raw WebRTC infrastructure,
      use classic communications APIs, or buy a more bundled voice-agent platform. Founder
      testimony says early enterprise users wanted LiveKit to deploy and scale the open-source
      software for them, establishing managed operations - rather than the underlying protocol
      alone - as the commercial job to be done.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
  - id: "sizing-without-false-precision"
    title: "Evidence-constrained sizing and adoption"
    body: >-
      No retained source supplies a market-wide population, spend denominator, or comparable
      forecast from which to calculate TAM, SAM, CAGR, or attainable share. Company-specific
      proxies are directionally useful but inconsistent: one data profile reports 100,000-plus
      developers and 500-plus paying customers for 2025, while another profile claims more than
      300,000 developers without a common measurement date or definition. A separate article
      reports more than one million monthly Agents-toolkit downloads and billions of annual calls,
      but neither metric identifies unique paying organizations or LiveKit-attributable spend.
      A private-company database records $10 million beside the April 2025 financing while warning
      that such entries may be run-rate revenue, ARR, or LTM revenue. These observations are
      adoption signals, not additive market-size components.
    claimRefs: [CM008, CM009, CM010, CM011, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-users-and-budgets"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      Developers and platform engineers are the primary users, while product, engineering,
      infrastructure, contact-center, or digital-operations leaders are the likely economic
      buyers. The adoption path starts with a free cloud allowance or self-hosted prototype,
      advances to a managed production tier when uptime and operational simplicity matter, and
      can move toward enterprise contracts or self-hosting as concurrency, compliance, data
      control, and unit economics become material. The payer varies by workload: engineering or
      cloud budgets fund embedded communications, customer-experience budgets fund support agents,
      and regulated business units require security, consent, retention, and audit controls.
      Evidence remains weak on actual procurement cycles, average contract value, conversion from
      open-source usage, and budget displacement by segment.
    claimRefs: [CM006, CM007, CM012, CM015]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Adoption drivers, constraints, and valuation relevance"
    body: >-
      Adoption is pulled by the shift from text interfaces toward stateful voice and multimodal
      applications, by enterprises that prefer a vendor-operated network to running WebRTC
      themselves, and by the ability to tune model providers and costs. It is constrained by
      latency sensitivity, inference and egress charges, concurrency ceilings, compliance work,
      observability requirements, and the specialist operations burden of self-hosting. Those
      constraints vary by workflow: patient intake may tolerate longer turns, while immersive
      language learning depends on conversational responsiveness. For valuation, the relevant
      proof is not a broad voice-AI forecast but conversion of developers into durable paying
      workloads, disclosed usage growth, gross-margin behavior across network and inference costs,
      retention, and concentration. None of those cohort or unit-economic denominators is
      available in the assigned evidence.
    claimRefs: [CM007, CM008, CM013, CM014, CM016]
