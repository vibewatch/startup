companyProfile:
  summary: >-
    LiveKit is a founder-led, privately financed realtime communications infrastructure company. Its self-hostable
    WebRTC server and Agents framework provide an open-source entry point, while LiveKit Cloud monetizes managed media,
    agent hosting, inference, telephony, and observability. Public evidence shows credible developer and strategic-user
    adoption, but operating economics and governance remain largely undisclosed.
