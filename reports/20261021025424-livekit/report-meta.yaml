summary:
  headline: >-
    LiveKit is strategically relevant voice-AI infrastructure, but the $1 billion financing mark remains stretched
    without verified revenue, margins, retention, and concentration.
  overallScore: 6.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
