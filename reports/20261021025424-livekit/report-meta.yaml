    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Open-source distribution and managed cloud create a coherent path from developer adoption to production
      infrastructure revenue.
    - >-
      Named strategic use and broad developer reach support the platform's relevance in realtime voice and multimodal
      AI.
    - A reported $100 million Series C demonstrates financing access and institutional sponsorship.
  topRisks:
    - >-
      The $1 billion valuation lacks verified ARR, gross margin, retention, customer concentration, and preference-stack
      support.
    - >-
      Stateful voice-agent workloads expose LiveKit and its customers to latency, reliability, compliance, and
      product-completion risk.
    - >-
      Founder dependence, opaque governance, third-party model and telephony dependencies, and uncertain customer
      concentration constrain downside analysis.
  unresolvedGaps:
    - >-
      Obtain a monthly ARR and bookings bridge, revenue recognition policy, gross margin by product, NRR, churn, and
      top-customer concentration.
    - >-
      Reconcile cash, burn, runway, debt, total funding, fully diluted ownership, liquidation preferences, board rights,
      and governance.
    - >-
      Verify achieved uptime, incident history, latency distributions, failover tests, security reports, DPA and BAA
      scope, and subprocessor controls.
    - >-
      Reconcile active developers, paying customers, production workloads, contract duration, renewals, and
      segment-level commercial outcomes.
