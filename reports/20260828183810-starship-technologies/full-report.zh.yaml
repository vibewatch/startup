      - number: '4.3'
        title: 成本结构与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              按创业公司标准，公开牵引力披露很强，但仍不足以做投资测算。Starship 给出了可信的规模图景——超过 10 million 次配送、300
              多个地点、每日穿越道路和大规模车队——却没有披露年收入或毛利额。成本端可能很重：机器人制造、电池和零部件、维护、现场运营、监控、软件、保险、支持，以及充电等部署基础设施。公司反复声称，在合适条件下，单笔订单经济性已经优于人工骑手，最新材料在杂货场景上更加强调这一点。上述说法方向上可信，因为密集短半径路线应该有利于电池供电机器人，但缺少利用率、人工介入和维护指标，利润率故事就无法独立验证。因此，强运营验证降低了模型风险，却没有消除财务不透明。
