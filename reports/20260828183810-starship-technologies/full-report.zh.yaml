  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：围绕人行道机器人搭建的配送操作系统
        blocks:
          - type: paragraph
            body: >-
              不能把 Starship 的产品简化成一台可爱的六轮车。放在客户工作流里，产品是一套托管式本地配送系统：伙伴开放下单入口，Starship
              调度并导航车队，机器人完成最后数百米到数英里的路程，客户跟踪送达并解锁货舱，本地支持团队处理异常。因此，公司能在不改变核心服务概念的情况下卖给杂货零售商、配送
              App、校园和工业场站。机器人是看得见的资产，但产品承诺是可靠、低摩擦的配送，落在人工骑手成本过高或运营上别扭的环境中。Starship
              也明确把机器人定位为多模式配送栈的一部分，而不是所有骑手的通用替代品；相比声称机器人能独自解决每个本地配送场景，这种产品叙事更可信。
