        - 核心乐观情景押注经济性优于人工骑手
        - CFO 和运营仪表盘
      - - 2025 年轮次定价与优先权
        - 投后估值、清算优先权堆叠、按比例认购权及任何结构性条款
        - 入场经济性可能与公司表面质量大相径庭
