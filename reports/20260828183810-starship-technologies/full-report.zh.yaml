  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层：杂货、App、校园与工业渠道
        blocks:
          - type: paragraph
            body: >-
              Starship 的客户基础是多层的。机构层面，公司卖给杂货零售商、配送 App
              生态、高校和餐饮服务运营商，以及部分工业场站。用户层面，产品服务杂货购物者、学生、教师、员工和城市餐饮配送顾客。付款方会因细分而不同：杂货商可能把服务作为末端经济性的一部分补贴；学生可能用餐饮点数外加配送费支付；校园或
              App 伙伴可能控制下单界面，而 Starship 提供配送层。这种分层很重要，因为 Starship 的产品并非在每个地方都以同一种方式被购买和使用。杂货客户故事由零售商主导、物流驱动；校园客户故事则是嵌入
              meal-plan 和校园餐饮流程的 B2B2C 便利产品；App 伙伴故事更多取决于渠道集成，而不是 Starship 自有品牌。
