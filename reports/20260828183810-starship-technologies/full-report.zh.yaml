      - number: '4.2'
        title: GTM 动作及可能驱动运营杠杆的因素
        blocks:
          - type: paragraph
            body: >-
              GTM 动作看起来由企业销售牵引、偏运营、可在本地重复，而不像软件业务。Starship 拿下一个伙伴，绘制服务区，集成下单流程，部署机器人；一旦单位经济性和信任得到验证，再扩到更多门店、校园或城市。传统
              SaaS 指标很难衡量这种销售效率，但从部署可重复性和伙伴扩张角度更容易理解。分销合作应降低获客负担，因为 Starship
              可以接入既有消费者需求，而不用从零搭建。运营杠杆随后取决于密度、复购、路径熟悉度和利用率。机器人越频繁地在有限人工介入下完成短途，车队和本地支持的固定成本就越能被摊薄。这也是管理层强调杂货、城市部署、无线充电和平台集成，而不是泛泛讲机器人品牌的原因。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI019
              - CI024
