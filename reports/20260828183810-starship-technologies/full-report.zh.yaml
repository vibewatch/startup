        title: 2026 年退出校园业务后，合作伙伴与商业集中度已无法回避
        blocks:
          - type: paragraph
            body: >-
              最新也最重要的商业风险数据点，不是另一家机器人公司的竞争动作，而是 Starship 自己决定收缩美国大学业务，并把约 1,200
              台机器人重新投向杂货配送。这个动作在战略上也许合理，但它证明，管理层一旦看到更好的垂直场景，就会重新分配稀缺车队产能。对客户和投资人而言，这带来两个相互牵连的问题。第一，合作伙伴依赖度高，因为 app
              集成和机构许可仍然左右订单流、用户访问和单位经济模型。第二，如果一个曾经的核心板块被突然退出，或通知不均，标杆客户质量就会受损。公司现在主张，杂货配送是更好的长周期业务，因为它全年运营、位于城市，且结构上不同于校园业务。这个判断可能成立，但公开证据仍无法回答：杂货叙事有多少来自已签合同，又有多少只是管线乐观。Starship
              确实有工业和其他业务线分散化，但与校园曾经可见的规模相比，证据仍然偏浅。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR037
