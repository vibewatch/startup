      - number: '2.3'
        title: 客户分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Starship 现在服务几类买方，它们都需要短半径配送，但预算归属差异很大。杂货零售商关心配送利润、获客和快速本地履约；配送 App
              想要一支能嵌入现有下单界面的多模式车队；校园过去看重密度和新鲜感，但最终仍是季节性、合同驱动；工业场站则把同一套自动驾驶栈用于内部运输，而不是面向消费者的交易。采用路径也更偏运营，而非愿景叙事。Starship
              自己的材料描述了先绘制配送半径、集成 API 或白标 App、培训本地员工，再支持实时运营。芬兰 Alepa 上线和 S Group 扩容说明，门店集群试点可以变成可重复的生产级铺开。相反，2026
              年美国校园收缩说明，并非每个看似成功的细分都值得继续投入资本。市场形成既取决于可重复部署流程，也取决于原始消费者兴趣。
