              本品类的竞争优势不只是技术。谁掌握下单界面、商户网络、本地许可和实时运营能力，谁往往控制销售。Starship 与 Uber Eats、foodora
              的合作说明管理层似乎理解平台接入价值，因为接入现有平台通常比强迫用户下载独立机器人 App 更有价值。同一逻辑也制造威胁。DoorDash 支持的机器人试验和 Uber 不断扩展的 AV
