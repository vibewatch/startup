            body: >-
              Starship 最强差异化是有证据支撑的运营成熟度。数百万次配送、多年 Level 4
              部署主张，以及横跨雪地、人行道、校园和杂货场景的公开验证，构成了许多机器人公司公开层面拿不出的产品故事。同样重要的是，产品包含伙伴就绪能力：接入零售商或 App
              工作流、区域地图、充电基础设施和本地现场支持闭环。不过，公司在运营护城河上明显强于制造护城河。公开材料没有以能证明硬制造壁垒的方式披露供应商深度、零部件集中度或产能吞吐。核心依赖因此很广：监管方、可通行人行道、本地社区、App
              伙伴、现场技术人员、充电设备和天气适应能力。把产品当成纯硬件来测算会误判重点；把它当成无依赖的软件来测算同样错误。
