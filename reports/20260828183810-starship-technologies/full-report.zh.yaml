      - number: '8.5'
        title: 决策取决于一小组尽调卡点和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              最后的估值立场，与其说取决于精巧建模，不如说取决于管理层愿意展示什么。三类尽调问题真正构成阻塞。第一，投资人需要运营财务证据：按地区和客户拆分的收入、按杂货市场拆分的贡献利润率，以及当前烧钱速度。第二，投资人需要定价条款：2025
              年轮次估值、清算优先权，以及任何会改变新投资人有效经济性的结构。第三，投资人需要转化证据：具名杂货合作伙伴、上线节奏，以及足够稳固、能够抵消校园收缩造成的信任冲击的合同保护。提出这些要求很关键，因为投资逻辑可能很快破裂。一次严重安全或法律事件、一次杂货配送转化失败，或在利润率证据可见前出现的新融资需求，都可能让支付溢价倍数的理由坍塌。如果管理层给出强答案，建议可以上调。否则，纪律应当压过热情。
