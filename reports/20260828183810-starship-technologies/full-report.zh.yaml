      - number: '4.5'
        title: 财务结论：单位经济性有前景，但披露不足以支撑投资测算
        blocks:
          - type: paragraph
            body: >-
              财务故事有前景，但不完整。Starship 看起来已经在密集、短半径配送场景找到产品市场匹配，并围绕杂货越来越明确地主张单位经济性。公司退出校园、转向 365
              天杂货模型，也支持一个判断：管理层是在把资本重新投向经济性更好的细分，而不是到处追增长。同时，最重要的私有事实仍然缺席：收入、毛利额、烧钱速度、利用率、细分结构、维护负担和集中度。Serve Robotics
              提供了有用的公开基准，因为它显示了公开市场在配送机器人公司成熟经济性出现前，可能愿意容忍多少资本和耐心，但它不能替代 Starship 自己的数字。因此，今天正确的投资测算立场不是怀疑 Starship
              能否创造价值，而是怀疑在当前阶段、没有更深访问权限时，有多少价值会归属于股权。
