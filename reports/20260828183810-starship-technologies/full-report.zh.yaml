chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、根基与当前运营版图
        blocks:
          - type: paragraph
            body: >-
              Starship Technologies 是一家由爱沙尼亚团队创立的自动配送公司，如今把自己定位为末端物流人行道机器人全球领导者。官方材料和早期融资公告都把成立时间指向 2014 年 7 月，并把公司源头与
              Skype 联合创始人 Ahti Heinla 和 Janus Friis 绑定。公司商业总部在 San Francisco，工程团队仍扎根 Tallinn，公司称 R&D 位于
              Helsinki。产品范围已不只是校园新奇物：Starship 销售托管式配送服务，覆盖杂货、餐厅餐食、包裹和工业用品。核心实体资产是一台六轮配送机器人，最多可装 3 袋商品，使用 12
              个摄像头组成的传感器套件，并配备雷达和超声波感知；它以 Level 4 自动驾驶运行，必要时有远程人工支持。到 2026 年报告运行日，Starship 声称拥有 3,000 多台机器人、300 多个地点、8
              个国家、超过 10 million 次配送，以及每天 125,000 次道路穿越。上述指标证明了真实商业足迹，但主要仍由公司自行披露，未经过独立审计。
