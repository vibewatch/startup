      - number: '5.2'
        title: 模块与架构
        blocks:
          - type: paragraph
            body: >-
              公开记录支持对 Starship
              技术的模块化理解。硬件层是一台紧凑的六轮机器人，带保温货舱，适合小篮子订单。其上是感知层，由摄像头、雷达、超声波感知、飞行时间组件和神经网络推理构成。再往上是用于人行道、道路穿越、路缘处理和避障的导航与路径逻辑。外围还有更宽的运营架构，包括地图、伙伴集成、少数边缘案例的远程监管，以及本地现场支持。架构重要，是因为
              Starship 的优势看起来不是来自某个神奇传感器，而是来自整套栈在数百万次真实配送中的调校。因此，软件、地图、运营手册和客户交付流程，与机器人硬件本身同样重要。
