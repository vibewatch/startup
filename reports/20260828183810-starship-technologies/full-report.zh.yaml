companyProfile:
  summary: >-
    Starship Technologies
    是一家由爱沙尼亚团队创立的自动配送机器人公司，运营一个围绕小型六轮人行道机器人搭建的托管式末端配送平台。公开证据显示，它兼具少见的技术寿命、多国运营和真实客户验证，其中芬兰杂货配送是可重复密度经济性最强的验证点。公司熬过了许多配送机器人同行并持续拿到融资，但仍是公开财务披露有限的私营公司；投资者看得清运营质量，却很难同样看清收入质量或估值支撑。
