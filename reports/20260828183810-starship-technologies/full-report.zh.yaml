      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              人行道机器人背后的需求顺风真实存在：劳动力短缺、人工骑手成本高、由 App 撮合的餐饮配送增长，以及零售商对低排放履约的兴趣，都改善了采用逻辑。Starship
              自有材料和合作伙伴上线把利润故事讲得很直白，尤其是补货型杂货小篮子，派人工司机在经济上很别扭。但约束同样结构性。品类扩张依赖本地法规、保险、人行道质量、短配送半径，以及顾客接受机器人共享行人空间。Virginia
              的 PDD 制度展示了运营商想要的赋能框架，但 Arlington 和 Alexandria 也说明，本地条例和行人通行权规则仍在塑造部署。Supply Chain Dive
              给出更硬的教训：有些城市法律许可已经存在，却仍缺少大规模铺开的物理条件或政治共识。天气、载荷、可及性和公共路权复杂性叠在一起，意味着市场按城市逐个扩张，而不是一次性爆发。
