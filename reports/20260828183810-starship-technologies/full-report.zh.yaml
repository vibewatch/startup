  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Starship 的经济模型更适合被看作面向企业伙伴的配送即服务，而不是底层偶然带有机器人的消费者 App。公司向杂货零售商、配送
              App、校园和工业场站销售更低成本的履约方式；机器人就是配送基础设施。公开材料强烈暗示，企业合同比消费者配送费更重要，尽管终端用户可能仍会支付小额按单费用。最清晰的旧数字线索，是 2019
              年披露的配送费通常按地点为 $1.99
              或更低，但当前定价似乎按关系定制，并与集成、实时运营和部署范围打包。因此，真正的变现杠杆是订单量、密度、合作伙伴组合和合同结构。同时也带来会计模糊性。公开证据没有拆分企业服务收入和消费者支付的配送费，因此从外部仍无法判断收入结构和确认方式。
            claimRefs:
              - CI001
