      - number: '1.5'
        title: 负面信号与后续章节继承的尽调姿态
        blocks:
          - type: paragraph
            body: >-
              概览不能把规模口径等同于风险出清。TechCrunch 2024 年 2 月报道已把 Starship
              写成一个特例：在人行道机器人领域，许多项目停滞或关停。背景有用，但不等于利润能力已经独立验证。Starship 自己的 2026 年里程碑公告称，杂货配送已比骑手履约便宜 $3 到
              $4，但公开备案或审计财务并未佐证。2026 年的负面报道也显示，实体世界部署即便学习多年，仍会产生法律和社区风险。Retail Technology Innovation Hub 报道了 Arizona
              伤害诉讼，以及 Sheffield 试点因破坏行为和本地摩擦而暂停。上述事件没有抹掉 Starship
              的运营领先，但会收窄本报告后续章节的正确立场：把公司视为真实品类龙头，部署证据异常强；同时继续追问收入质量、估值、治理透明度，以及所称单位经济性是否持久。
