      - number: '7.4'
        title: 即便已是品类龙头，资本强度和执行风险仍未消失
        blocks:
          - type: paragraph
            body: >-
              Starship
              头部指标很亮眼——数百万次配送、数千台机器人、多轮融资——但这些不能等同于财务模型已经去风险。融资历史反而说明，公司仍需要大量外部资本，才能支撑机器人制造、工程、充电基础设施和多市场部署。2024
              年股权融资、2025 年延伸轮，以及更早的 EIB 贷款安排，都支持一个判断：可信投资人仍在支持公司。它们也支持相反结论：业务扩张仍然烧钱，资本可得性是运营模型的一部分，而不只是历史脚注。围绕 Starship
              自身杂货配送利润率的公开证据仍不完整，所以投资人还必须为管理层「杂货配送经济性结构性更好」的说法买单。人和执行风险因此比典型软件公司更重要：领导层、现场运营招聘、监管沟通，以及铺开质量纪律，将决定下一阶段是产生经营杠杆，还是只把成本底座做大。
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR038
              - CR039
              - CR040
