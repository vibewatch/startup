      - number: '8.2'
        title: 投资逻辑与反向逻辑：杂货配送领导力真实存在，但财务桥梁缺失
        blocks:
          - type: paragraph
            body: >-
              Starship 的乐观论据有分量。公司看起来做成了少数机器人创业公司才能做到的事：把自主能力变成跨多国重复发生的商业运营，然后找到一个杂货配送场景，证明需求有真实密度，而不只是试点新鲜感。Finland 和 S
              Group 重要，是因为它们暗示 Starship 可以成为补货型杂货配送的基础设施，而不是校园噱头。反向逻辑同样重要。2026 年，Starship
              退出美国校园，收窄了战略叙事；这可能是聪明选择，但也让下一章更集中在杂货配送执行上。与此同时，收入、利润率、烧钱速度和定价条款仍未公开。这个错位意味着，投资逻辑并不真正取决于机器人是否能跑，而在于杂货配送经济性和合同转化是否足够强，强到可以在没有异常高信任度的情况下，支撑投资人按旧独角兽时代标记或更高价格付钱。简言之，质量看得见，但估值证据仍落后于质量。
