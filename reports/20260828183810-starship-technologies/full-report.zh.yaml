          - type: callout
            title: 退出校园业务，是战略可逆性的最强证据
            body: 投资人不应把集中度和合作伙伴风险当成抽象问题。管理层已经证明，一旦另一个垂直场景更有吸引力，就会改用一支大规模已部署车队，即便会打断现有客户。
            calloutType: risk
