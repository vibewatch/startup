        title: 可及性、安全与街面运营，是抽象风险落地的地方
        blocks:
          - type: paragraph
            body: >-
              Starship 自己的材料说明，管理层明白在人行道运营有多敏感：公司强调车身重量低、速度谨慎、人工远程协助、过街点已测绘、咨询残障群体、隐私最小化，以及硬件设计醒目。这些缓释措施有实质意义，Guide Dogs
              试点也至少提供了一些具体证据，说明设计足够谨慎可以减少无障碍冲突。即便如此，剩余风险仍然重大，因为公共空间机器人往往按极端事件被评判。Arizona 伤害诉讼之所以重要，正因为它检验 Starship
              的安全栈在混乱真实环境里是否足够稳。Sheffield
              破坏事件的重要性则在另一个方向：它说明即便没有灾难性安全事故，社区接受度也可能失守。更广泛的配送机器人证据还显示，人行道开裂、商户培训不足、临时障碍、认知度薄弱，都可能拉低铺开质量。换句话说，Starship
              的技术优势能降低运营风险，但不会把人行道自主配送变成低干预的基础设施生意。公司仍然需要持续守住本地运营纪律。
