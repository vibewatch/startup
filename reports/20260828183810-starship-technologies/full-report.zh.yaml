  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 美国大型杂货商上线，收入披露超过 ~$60M+，芬兰经济模型可迁移，且没有重大安全挫折
        - $1.8B-$2.4B 隐含价值；以 $1.2B 入场约 1.5x-2.0x
        - 执行滑坡、本地监管、毛利夸大
        - 需要新披露和可见的合约转化
      - - 基准
        - 芬兰保持强劲，杂货上线逐步落地，但财务披露仍有限
        - $1.0B-$1.4B 隐含价值；高于上一明确估值时安全边际很小
        - 经济模型不透明、集中度、公开可比公司小幅压缩
        - 最符合当前公开证据
      - - 悲观
        - 杂货转化不及预期，安全或法律问题加剧，或在证据兑现前就需要新资金
        - $0.4B-$0.8B 隐含价值；以 $1.2B 入场约 0.3x-0.7x
        - 下轮估值下调风险和信任侵蚀
        - 由打破投资逻辑的事件触发，而非单个 KPI 未达标
    notes: 这些区间刻意留得很宽，因为 Starship 自身收入和毛利率数据并不公开；精确数字会误导。
