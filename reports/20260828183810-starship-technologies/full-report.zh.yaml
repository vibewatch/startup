      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Starship 的融资历史让资本密集故事非常清楚。公司在 2019、2022、2024 和 2025 年多次大额融资，包括股权轮次和一笔准股权 EIB 工具，后者指定用于 R&D
              并建设数千台更多机器人。融资记录不代表业务疲弱；它说明公司在扩张一个有显著工程和资产要求的实体网络。官方材料试图调和这种张力：一边声称多个地点已盈利、毛利率为正、单位成本低于人工配送；一边继续融资以扩张车队并打入美国市场。未解问题是，上述说法描述的是持久的公司层面经济性，还是扣除持续扩张开支前、较有吸引力的单位贡献。由于
              Starship 不公布现金余额、烧钱速度或现金跑道，仅凭公开证据无法判断当前资本是否充足。审慎结论是，即便部分本地部署经济性强，Starship 仍依赖融资。
            claimRefs:
