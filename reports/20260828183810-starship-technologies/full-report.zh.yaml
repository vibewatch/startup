  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：不只是其他人行道机器人
        blocks:
          - type: paragraph
            body: >-
              Starship
              的竞争场不只是几家配送机器人创业公司的短名单。直接同行包括在有人环境中自动化短途配送的公司，但买方也可以用人工骑手、配送平台、内部运营建设，或最终进入配送的相邻自动驾驶供应商解决同一任务。关键在于，公司卖的不只是一台机器人，而是一种更安全、更低成本、运营上可重复的密集本地订单履约方式。Starship
              从校园转向杂货和 App 驱动配送后，最重要的竞争者将变成拥有零售商分销、餐厅密度或公开市场融资能力的玩家，而不只是有校园新鲜感的公司。因此，Serve 是最有用的公开直接可比公司；Kiwibot
              仍是同一品类参与者；Nuro 已漂向相邻自动驾驶；DoorDash 或 Uber 关联生态则代表由分销牵引的进入者，可能快速改变品类结构。
