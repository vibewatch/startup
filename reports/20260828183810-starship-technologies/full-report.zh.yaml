  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律：公司令人认可，但价格支撑仍不完整
        blocks:
          - type: paragraph
            body: >-
              Starship 作为公司更容易让人喜欢；作为一个已充分定价的投资标的，则没那么容易。公开证据清楚显示，它在真实世界部署中处于品类领先：公司已有数百万次配送、数千台机器人，并在 Finland
              建立了可信的杂货配送据点，看起来明显强于多数配送机器人同行。问题在于，最好的公开价格锚点仍是 2024 年 2 月轮次的第三方估计；Starship 自己的融资公告并未确认 2024 轮或 2025
              年延伸轮的估值。这迫使投资人在显而易见的运营质量和不完整的定价证据之间架桥。实际判断应当对价格和披露都保持敏感：如果估值处在或高于上一轮明确的 $1.2 billion
              标记，公开证据支持继续尽调，甚至可能支持结构化参与，但不足以仅凭当前披露给出干净的买入结论。Starship 也许会跑赢这个标记；但它还没有向公开市场证明。
