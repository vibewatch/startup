      - number: '8.3'
        title: 可比公司分析指向谨慎，而不是免检通行证
        blocks:
          - type: paragraph
            body: >-
              Serve Robotics 是最有用的公开可比公司，不是因为它与 Starship 完全相同，而是因为它显示了公开市场现在如何给一家上市人行道配送机器人运营商定价：收入不高、亏损很重、未来预期却很高。2026
              年 8 月下旬，Serve 的股权价值明显低于 Starship 上一个明确的 $1.2 billion 私募标记；由于资产负债表里现金很多，它的企业价值还要更低。这并不意味着 Starship 应该与
              Serve 一比一定价：Starship 配送次数更多、国际部署更广、杂货配送证据更强。但这确实意味着证明负担很高。公开市场愿意给自主平台激进倍数，也同样容忍剧烈波动和快速倍数压缩。Nuro 的 down
              round 提供了有用的交叉检验：即便是受尊重的自主技术公司，只要商业化拉长或叙事变化，也会被重新定价。结论是，可比公司支持溢价情景，但不支持无条件溢价。
