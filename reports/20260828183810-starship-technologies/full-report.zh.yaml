            body: >-
              Starship 的公开运营证据，对一家私营机器人公司而言异常丰富。公司记录了多国商业使用、每天 125,000 次道路穿越、城市试点、App 集成和多年校园运营。George Mason
              给出具体证据，说明无线充电和更密集商户网络可以随时间提升站点成熟度。芬兰又提供了第二个、技术上更有意思的验证点：冬季轮胎、识雪路径、雪堆检测和集成电池加热开发，都说明 Starship
              已经走出晴天演示。公开路线图线索仍是间接的，但真实存在。公司持续指向更广泛的杂货部署、更多城市铺开、围绕充电的更多自动化，以及改善冬季表现的硬件或软件。区域地图和数据岗位招聘也暗示，部署质量和本地路径智能仍是持续迭代领域。
