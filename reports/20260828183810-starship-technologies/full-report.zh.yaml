  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露仍是首要外部风险组
        blocks:
          - type: paragraph
            body: >-
              Starship 很早就证明自己有能力争取合法运营空间，且证据异常强：Virginia
              仍是标志性案例，公司与立法者合作，为个人配送设备建立了全州框架。框架本身有帮助，因为它澄清了机器人权利、速度限制、制动与操作员身份要求，以及最低责任保险。但同一证据也说明，为何法律胜利不等于无摩擦扩张。Alexandria
              和 Arlington 仍会处理投诉、试点条件和本地安全预期；Next City 记录的市政合同加入了费用，以及 ADA 或地理围栏处罚；Supply Chain Dive
              则显示，各州规则差异足够大，足以形成真实合规税。结果是，Starship
              的监管护城河好坏参半。经验重要，但每个新地区仍带来新的法律起草、本地外交和执法风险。因此，投资者应把政策执行视为持续运营职能，而不是公司已经跨过的一次性门槛。
