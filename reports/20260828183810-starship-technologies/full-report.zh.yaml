      - number: '1.2'
        title: 领导层演变与创始人重新掌控
        blocks:
          - type: paragraph
            body: >-
              领导层历史很重要，因为 Starship 的公开叙事多次在创始人主导和职业经理人主导之间切换。2018 年，Lex Bayer 从 Airbnb 加入担任
              CEO，当时公司正从试点走向商业铺开，释放出一个信号：除了工程可信度，公司还需要业务搭建纪律。2021 年，Starship 从 Alphabet's Loon 招来 Alastair
              Westgarth；官方新闻稿称 Heinla 退回 CTO 角色，由 Westgarth 推动全球扩张。但到 2024 年初，TechCrunch 报道 Heinla 已低调重新出任 CEO，Starship
              随后的 2024、2025 和 2026 年公告也都称他为联合创始人兼
              CEO。这条轨迹说明，上一轮规模化阶段之后，公司回到创始人控制之下；可能是投资人和管理层认为，下一阶段需要技术路线图、部署经济性和资本配置更紧密地咬合。目前官网介绍页公开的团队显示 Heinla
              身边已有更完整的运营班子，但董事会构成和治理权利细节仍未在公开材料中披露。
