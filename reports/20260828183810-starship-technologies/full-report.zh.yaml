  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：超本地配送，不是整个物流市场
        blocks:
          - type: paragraph
            body: >-
              Starship 的市场必须框窄，否则分析会失真。公司争夺的不是所有末端物流支出、所有杂货电商
              GMV，或整个自主机器人市场。它真正的领域，是在人行道和其他行人优先路面做超本地配送：小型机器人以步行速度搬运食物、杂货、包裹或内部场站物品。因此，直接涉及的市场包括零售商出资的杂货配送、配送 App
              的餐食和便利订单、校园餐饮配送，以及部分工业场站内流转。道路 Robotaxi、仓库 AMR 和大多数货运自动驾驶都不在边界内，即便上述品类也会使用相近的机器人和 AI 叙事。边界很关键，因为 Starship
              最强证据来自密集、短半径路线，尤其是杂货和校园环境，而不是重载、长距离或道路认证自动驾驶。正确的现状替代品是人工骑手、自驾取货，或内部员工跑腿，而不是广义全国包裹网络。
