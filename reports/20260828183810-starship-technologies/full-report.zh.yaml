      - number: '1.4'
        title: 从试点到品类规模部署的商业里程碑
        blocks:
          - type: paragraph
            body: >-
              概览里最强的乐观论据是 Starship 的里程碑记录。公司从 2017 年多国试点起步，拿到 Virginia 首个全州美国监管批准，又在 Milton Keynes 启动首次商业配送，并于 2019 年在
              George Mason 落地首个大规模美国大学部署。Series A 直接绑定 100 所校园目标；到 2024 年 1 月，仅 George Mason 就接近 459,000 次配送，车队从 25 台增至
              60 台，商户从 4 家扩至 18 家。芬兰成为城市商超经济性最清晰的验证点：Starship 于 2022 年与 HOK-Elanto 合作上线，到 2025 年末，Starship 与 S Group
              表示，杂货机器人已从 170 多家门店完成超过 1 million 次配送。2024 和 2025 年融资也沿着类似扩张叙事推进，配送量从 6 million 增至 9 million，并在 2026 年超过
              10 million。上述数字支撑了一个判断：Starship 不再是科学项目；它们也解释了公司为何正从校园密度转向与 Bolt、Uber Eats 等平台合作的城市商超配送。
