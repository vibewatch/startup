      - number: '1.3'
        title: 已公开的融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Starship 长期累计了可观融资，但公开记录仍比许多后期私营机器人公司更薄。已披露路径从 2017 年 1 月 $17.2 million 种子轮开始，2018 年 6 月又追加 $25 million，随后
              2019 年 8 月完成 $40 million Series A，明确用于校园扩张。2022 年，公司在新的 $42 million Series B 上叠加 €50 million EIB
              准股权工具，使已披露融资达到 $202 million，并把部分资金绑定欧洲 R&D 和制造扩张。2024 年 2 月那轮又加入 $90 million，使已披露资本达到 $230
              million；TechCrunch 确认估值未披露。2025 年 10 月，公司再融 $50 million，使已披露资本超过 $280
              million，仍未公开估值。投资者因此有一条可用的融资时间线，却看不完整股权稀释、清算优先权、老股交易、债务契约和当前现金跑道。
