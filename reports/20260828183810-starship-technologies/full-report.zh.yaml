      - number: '2.2'
        title: 规模口径：宏观需求很大，纯机器人配送仍小
        blocks:
          - type: paragraph
            body: >-
              公开市场估算解释了为什么 Starship 可以同时讲大市场故事和新兴品类故事。最窄口径下，Precedence 估计全球配送机器人 2024 年只有 USD 409.3 million，不过预计到 2034
              年以 32% CAGR 快速增至 USD 6.58 billion。最宽需求口径下，Mordor 和 Precedence 都认为 2026 年线上餐饮配送已约 USD 285 billion，长期预测区间从大约
              USD 469 billion 到接近 USD 695 billion。IMARC 低得多的 2025 年数字说明，方法论会大幅改写顶线。相邻 AMR
              市场也比纯人行道机器人大得多，但多数支出落在仓库、工厂和物流设施，而不是公共人行道配送。实际结论是：Starship 切入的是一个小而高速增长的自动化利基，嵌在巨大的餐食与杂货需求池里。公开数据仍不足以可信估算
              Starship 的 SOM，因为仅有配送量看不出收入、订单价值或地理份额。
