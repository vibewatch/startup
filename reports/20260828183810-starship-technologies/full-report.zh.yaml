      - number: '8.4'
        title: 情景与敏感性分析说明，买入结论并不显然
        blocks:
          - type: paragraph
            body: >-
              一旦把分析明确转为价格敏感，建议就更清楚了。以 $1.2 billion
              进入并不离谱，但如果没有更强披露，也没多少安全垫。因此，基准情景不是一个上行情景；问题只是公开证据是否足以支撑此前标记。按可比公司口径做数学，最有用的练习是反推：在不同 EV/Sales 水平下，Starship
              需要多少收入才能支撑 $1.2 billion。即便采用接近 Serve 的慷慨公开可比倍数，公司仍需要约 $46 million 年收入；倍数更低时，所需收入会迅速大幅上升。这不能证明 Starship
              达不到门槛。它证明，投资人现在被要求自己推断答案。乐观情景下，Starship
              转化新的杂货零售商，并披露指标证明杂货配送转向能够复利增长。悲观情景下，公司在证据出现之前就需要更多资本。基准情景安全边际有限，所以本章给出的结论是 research-more，而不是 buy。
