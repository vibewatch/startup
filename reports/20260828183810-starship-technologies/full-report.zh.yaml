      - number: '2.5'
        title: 后续章节应把哪些事实视为扎实，哪些视为偏软
        blocks:
          - type: paragraph
            body: >-
              后续章节最强的市场事实是方向性的，不是精确数值。可以确定的是，线上餐饮和杂货需求很大，纯配送机器人仍是小得多的利基，Starship
              最好的公开验证来自杂货和短半径场景，监管与人行道条件是一阶采用约束。较软的是，给 Starship 认定任何精确的全球 TAM，或给出干净的公开
              SOM。品类定义重叠太多——配送机器人、AMR、自动化末端配送、餐饮配送
              TAM——硬压成一个数字会扭曲现实。因此，后续估值工作最稳妥的框架应受证据约束：用窄品类判断当前竞争现实，用广义餐饮配送只作为需求背景，并继续保留机器人可触达份额、垂直结构和收入转化上的明确尽调缺口。
