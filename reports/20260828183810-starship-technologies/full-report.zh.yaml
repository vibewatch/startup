        - 配送成本更低，ETA 有望更短
        - 篮子大小和地理范围受限
      - - 校园餐食配送
        - 学生步行取餐，或等校园配送员
        - 机器人把餐送到宿舍、教学区或图书馆
        - 更方便、更无障碍，也省时间
        - 季节性和校园特定经济性
      - - 餐厅 / 便利店应用订单
        - 平台派骑手履约
        - 机器人接入由应用驱动的多模态车队
        - 短半径履约可能更便宜
        - 需要伙伴集成和适合通行的人行道
      - - 工业场地内部运输
        - 员工手动搬运物资或邮件
        - 机器人承担场地内重复跑腿任务
        - 低价值跑腿节省人力时间
        - 环境和预算负责人不同于消费配送
      - - 深夜或恶劣天气可达性
        - 用户可能放弃下单，或得跑一趟不方便的自提
        - 机器人提供无接触、可追踪配送
        - 在部分场景改善可达性和安全感
        - 天气韧性仍受本地条件限制
    notes: 收益锚定已引用的用例和客户验证来源，而非理论机器人主张。
