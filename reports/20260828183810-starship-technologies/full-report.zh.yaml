      - number: '7.5'
        title: 剩余风险监测应盯住四条打穿投资逻辑的路径
        blocks:
          - type: paragraph
            body: >-
              从投资角度看，关键问题不是机器人能否在人行道搬运货物——Starship
              已经证明可以。关键在于，剩余风险栈能否被监控，以及公司的缓释能力是否成熟得快过扩张赌注的抬升。最重要的观察点很直接。第一，严重伤害或产品责任结果可能重置合作伙伴和监管者的容忍度。第二，地方或州层面收紧规则，可能在杂货配送加速扩张时限制路线密度，或抬高合规成本。第三，如果已宣布的杂货需求不能转化成真正上线的多市场零售合同，2026
              年转向就会更像集中风险，而不是战略聚焦。第四，如果在持久利润率改善的公开证据出现之前，融资需求重新浮现，估值支撑会很快变弱。这些风险没有任何一个足以直接否定公司，但合在一起，足以要求一套有纪律的尽调计划，围绕事故记录、保险条款、合同质量、地理投诉数据，以及已宣布管线转化成运营证据的进度来展开。
            claimRefs:
              - CR041
              - CR042
          - type: table
            tableRef: TR005
