company:
  name: Starship Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Starship has real customer proof across grocery, app, and university channels, but the depth of evidence
    varies materially by segment. Finland and S Group provide the strongest grocery adoption proof, while
    George Mason is the clearest long-running U.S. campus reference. Recent launches across Towson, ODU,
    UNCW, USC, CSU, and Fordham show a standardized deployment model and broad campus transferability,
    yet public retention and concentration data remain sparse. The 2026 pivot away from higher education
    suggests management now sees grocery customers as the more durable strategic core.
sections:
- id: customer-segments
  title: 'Customer segmentation: grocery, apps, campuses, and industrial channels'
  body: >-
    Starship's customer base is multi-layered. At the institutional level, the company sells into grocery
    retailers, delivery-app ecosystems, universities and foodservice operators, and some industrial sites.
    At the user level, the product serves grocery shoppers, students, faculty, staff, and urban food-delivery
    customers. The payer can vary by segment: a grocer may subsidize the service as part of last-mile
    economics; a student may pay with dining dollars plus a delivery fee; and a campus or app partner
    may control the ordering surface while Starship provides the delivery layer. This segmentation matters
    because Starship's product is not bought and used the same way everywhere. The grocery customer story
    is retailer-led and logistics-driven. The campus customer story is a B2B2C convenience product embedded
    inside meal-plan and campus-dining flows. The app-partner story depends more on channel integration
    than on Starship's own brand.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU037
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: 'Adoption trajectory: strongest proof comes from Finland and mature campuses'
  body: >-
    Public adoption proof is strongest where Starship discloses concrete order counts and where counterparties
    describe deployment specifics. Finland stands out because Starship and S Group jointly support a story
    of scale: from six stores and 60 robots in the HOK-Elanto launch to 650-plus robots across 82 towns
    and cities in the S Group case study, and eventually one million deliveries with robot orders reaching
    as much as 20% of online grocery orders. Campus proof is also strong but different. George Mason alone
    neared 500,000 deliveries with merchant density and fleet size expanding over time, while the broader
    campus network reached dozens of schools and millions of users. These facts support real adoption,
    but they do not tell us the same thing. Finland speaks to retail workflow fit and repeat demand; campuses
    speak to accessibility, convenience, and high-frequency localized usage.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU035
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof
  title: 'Named customer proof: many recent launches, but depth varies'
  body: >-
    Named customer proof in this chapter falls into three tiers. At the top are S Group and George Mason,
    where the public record shows scale-up over time and more concrete outcomes. The second tier includes
    campuses such as USC, Towson, ODU, UNCW, CSU, and Fordham, which provide detailed launch information:
    number of robots, eateries, drop-off locations, eligible payment types, and in some cases delivery
    fee disclosures or student staffing models. Those sources are valuable because they show a highly
    standardized deployment template. The third tier includes broader channel partners like Bolt and foodora,
    which confirm that Starship can plug into urban delivery apps but provide less detail on renewal,
    order density, or customer outcomes. The key implication is that logos alone are not the proof; the
    best evidence comes from sources that describe real workflow and visible expansion.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU032
  - CU033
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: durability-and-satisfaction
  title: Durability, repeat use, and what satisfaction data can and cannot prove
  body: >-
    Durability evidence is directionally positive but incomplete. The campus survey gives Starship impressive
    satisfaction and utility signals: students say the robots save time, reduce skipped meals, and improve
    accessibility. George Mason and S Group both show multiyear scale-up, which is stronger evidence than
    a survey alone because it implies recurring demand and operating acceptance. Still, public retention
    disclosure is missing. There is no public NRR, GRR, churn, contract duration, or renewal table. That
    means the public record supports habitual usage and positive user sentiment, but not the deeper institutional
    durability metrics investors would normally demand. Meal-plan compatibility, Grubhub embedding, and
    simple app ordering likely increase repeat behavior because they remove checkout friction, but that
    inference should not be mistaken for audited retention data.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: 'Expansion and concentration: the growth engine shifted, but dependence risks remain'
  body: >-
    Starship's historical growth pattern is clear: land an institutional partner, prove local demand,
    and then expand. The question is which partner types deserve more capital now. The 2026 shift away
    from U.S. universities toward grocery implies that management views grocery customers as the more
    durable or attractive segment. That decision also exposes concentration dynamics. In U.S. campuses,
    Starship appears heavily tied to Grubhub, dining-service channels, and university permissions. In
    grocery, Finland and S Group currently supply the strongest public proof, which can itself become
    a concentration risk in investor perception if comparable evidence elsewhere is thinner. Publicly,
    investors therefore face two simultaneous truths: the customer model has demonstrated real transferability,
    and the strongest current evidence may still be concentrated in a small number of channels or flagship
    customers. Without private renewal and revenue-share data, that concentration cannot be sized cleanly.
  claimRefs:
