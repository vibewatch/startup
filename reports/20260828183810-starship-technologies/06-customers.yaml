- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Land-and-expand inside grocery network
    - Overreliance on Finland / S Group proof
    - Investor narrative may overfit one flagship geography
    - Request country-by-country revenue and utilization by retailer
  - - Grubhub channel distribution
    - Partner concentration in U.S. campuses
    - Channel changes can rapidly alter access to users
    - Review exclusivity, renewal, and economics with Grubhub and dining partners
  - - Campus deployment playbook
    - University permissions and seasonality
    - Growth can stall despite user enthusiasm
    - Compare active campuses retained versus exited
  - - Urban app integrations
    - Platform disintermediation or multi-homing
    - Starship may lose direct leverage with end users
    - Request partner-specific retention and API dependency metrics
  - - Robot redeployment from campuses to grocery
    - Abrupt customer disruption risk
    - Segment shifts can damage reference quality or trust
    - Interview exited campus customers on renewal and offboarding experience
  - - Named launch momentum
    - Recent launches too fresh to prove durability
    - Can overstate retention if launches are mistaken for long-term customers
    - Build cohort view of 12-, 24-, and 36-month customer survival by segment
  notes: The strongest public customer story still leaves concentration and renewal risks largely unsized.
