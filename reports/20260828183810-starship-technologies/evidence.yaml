evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure TO003
    missingEvidence: Current post-money valuation, recent secondary pricing, preference stack, and investor ownership percentages.
    whyItMatters: >-
      Without a live valuation marker or cap-table detail, the report cannot convert operating traction into a precise
      return-underwrite view.
    diligencePath: Request the latest board deck, cap table, and financing documents covering the 2024 and 2025 rounds.
    relatedQuestionRefs:
      - QO014
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-level revenue, gross margin, cash balance, monthly burn, and runway.
    whyItMatters: >-
      Starship's strongest open question is whether its deployment lead already translates into durable unit economics
      and cash-efficiency.
    diligencePath: Obtain the latest management accounts, monthly KPI pack, and board-approved operating plan.
    relatedQuestionRefs:
      - QO023
      - QO024
  - type: missing-source
    severity: minor
    topic: governance TO002
    missingEvidence: Current board composition, committee structure, and any investor-specific governance rights.
    whyItMatters: >-
      Leadership history is visible, but board oversight and control dynamics are not, limiting governance risk
      assessment.
    diligencePath: Request the current board list, observer list, and governance summary from counsel or the data room.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: Starship SOM estimation
    missingEvidence: City-level revenue, order-value, take-rate, and gross-margin data by vertical are not public.
    whyItMatters: >-
      Without revenue conversion and mix data, delivery count cannot be translated into market share or realistic SAM
      capture.
    diligencePath: >-
      Request city-by-city GMV, revenue, and contribution-margin cohorts split across grocery, apps, campuses, and
      industrial sites.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: missing-source
    severity: material
    topic: robot-addressable share of food delivery TAM
    missingEvidence: >-
      No reviewed source quantifies what percentage of food and grocery orders are technically and economically suitable
      for small sidewalk robots.
    whyItMatters: The gap prevents a clean bridge from very large macro food-delivery TAMs into Starship's true addressable share.
    diligencePath: >-
      Build an internal bottom-up SAM model using basket size, distance, neighborhood density, sidewalk coverage, and
      local regulatory eligibility.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: medium
    topic: segment economics by buyer type
    missingEvidence: >-
      There is no public apples-to-apples comparison of grocery, campus, delivery-app, and industrial-site contribution
      economics.
    whyItMatters: >-
      Later valuation work needs evidence on which segment deserves growth capital and which segment should be treated
      as a data-collection or niche channel.
    diligencePath: Request segment-level utilization, cost-to-serve, renewal, and margin cohorts for the last eight quarters.
    relatedQuestionRefs:
      - QM011
      - QM025
  - type: private-evidence-only
    severity: material
    topic: Win rates and renewals by competitor
    missingEvidence: >-
      No retained public source discloses Starship's win/loss rates, contract renewals, or replacement frequency against
      Serve, Kiwibot, or platform-backed pilots.
    whyItMatters: >-
      Without customer decision outcomes, competitive differentiation can be overstated from marketing and scale proof
      alone.
    diligencePath: Request cohort-by-cohort competitive win/loss analysis, renewal rates, and reasons for lost deployments.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: Realized pricing and SLA comparison
    missingEvidence: >-
      Pricing, take-rate, service-level agreements, intervention targets, and uptime guarantees are mostly absent from
      public competitor materials.
    whyItMatters: These are the real levers of enterprise buying and margin competition.
    diligencePath: Collect sample MSAs, SOWs, realized per-delivery pricing, and SLA scorecards across major customers.
    relatedQuestionRefs:
      - QP011
      - QP023
  - type: missing-source
    severity: medium
    topic: Internal build economics
    missingEvidence: >-
      Public evidence is thin on how often large retailers or platforms choose to build internally rather than partner
      with robot vendors.
    whyItMatters: Internal build is a strategic substitute that could cap vendor bargaining power.
    diligencePath: Interview enterprise buyers and platform product leaders on build-versus-buy thresholds and prior evaluations.
    relatedQuestionRefs:
      - QP002
      - QP006
  - type: private-evidence-only
    severity: material
    topic: Current cash and runway
    missingEvidence: >-
      Starship does not disclose current cash balance, burn rate, runway, or next-round trigger in retained public
      evidence.
    whyItMatters: Capital adequacy is the central financial underwriting question for a hardware-heavy network business.
    diligencePath: Request latest monthly cash forecast, board budget, and financing contingency plan.
    relatedQuestionRefs:
      - QI016
      - QI025
  - type: private-evidence-only
    severity: material
    topic: Segment-level unit economics
    missingEvidence: >-
      No public source separates revenue, contribution margin, or maintenance burden across grocery, campus, apps, and
      industrial use cases.
    whyItMatters: >-
      The 2026 pivot implicitly claims grocery economics are stronger, but public evidence cannot quantify the gap.
      Public delivery counts also cannot be translated into revenue without mix and pricing data.
    diligencePath: Request quarterly segment P&Ls with orders, revenue, contribution margin, and robot utilization by vertical.
    relatedQuestionRefs:
      - QI012
      - QI019
      - QI021
  - type: private-evidence-only
    severity: medium
    topic: Revenue recognition and contract structure
    missingEvidence: >-
      Public sources do not explain whether Starship books gross or net revenue across partner channels, or how setup
      fees, delivery fees, and service terms are recognized.
    whyItMatters: Revenue multiples and gross-margin comparisons are unreliable without understanding what counts as revenue.
    diligencePath: >-
      Review sample contracts and accounting policy memo covering partner billing, end-user fees, and implementation
      services.
    relatedQuestionRefs:
      - QI003
      - QI023
  - type: missing-source
    severity: material
    topic: Manufacturing and supply-chain moat
    missingEvidence: >-
      Public sources do not identify key suppliers, production throughput, facility output, or inventory strategy for
      robot manufacturing.
    whyItMatters: >-
      Without supplier and throughput visibility, investors cannot judge whether Starship's hardware can scale
      economically or whether component bottlenecks create hidden fragility.
    diligencePath: >-
      Request manufacturing footprint, key-component concentration, annual build capacity, and contract-manufacturing
      arrangements.
    relatedQuestionRefs:
      - QE016
  - type: missing-source
    severity: material
    topic: Formal security and software assurance
    missingEvidence: >-
      Retained public evidence lacks clear named security standards, release-governance process, incident-rate
      disclosure, and independent assurance artifacts.
    whyItMatters: >-
      A public-space robotics fleet accumulates legal and reputational risk if safety or software controls are weak or
      under-documented.
    diligencePath: >-
      Request security program overview, SDLC controls, release sign-off process, penetration testing, and incident
      reporting metrics.
    relatedQuestionRefs:
      - QE021
      - QE025
  - type: private-evidence-only
    severity: medium
    topic: Operational reliability metrics
    missingEvidence: Public materials do not provide intervention frequency, MTBF, charger uptime, or maintenance cost per robot.
    whyItMatters: These are the metrics that convert an impressive demo fleet into an investable industrial system.
    diligencePath: >-
      Request p50/p90 intervention rate, maintenance hours, crash or near-miss rate, charger uptime, and adverse-weather
      performance cohorts.
    relatedQuestionRefs:
      - QE010
      - QE025
