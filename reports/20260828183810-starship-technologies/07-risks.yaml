  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Arizona lawsuit outcome, reserves, and insurance sufficiency
    missingEvidence: Public sources show the existence of a lawsuit and statutory minimum insurance rules,
      but not the insurer tower, deductibles, reserve posture, comparable prior claims, or case outcome
      probability.
    whyItMatters: A single adverse product-liability event can materially alter partner diligence, future
      premiums, and regulator tolerance.
    diligencePath: Request outside-counsel memo, claim file summary, incident logs, insurer correspondence,
      and product-liability coverage structure.
    relatedQuestionRefs:
    - QR013
    - QR031
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: Grocery contract conversion and concentration
    missingEvidence: Management describes major U.S. grocery contracts in progress, but public evidence
      does not identify contract count, rollout timing, exclusivity terms, or revenue concentration by
      retailer.
    whyItMatters: The 2026 pivot only lowers risk if pipeline converts into diversified, durable grocery
      demand rather than dependence on a few launches.
    diligencePath: Request signed retailer pipeline, launch calendar, contracted robot counts, and top-customer
      revenue mix.
    relatedQuestionRefs:
    - QR019
    - QR026
    - QR033
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: medium
    topic: Campus offboarding terms and partner notice protections
    missingEvidence: Independent reporting suggests some university customers experienced short notice,
      but public sources do not disclose termination clauses, notice periods, service remedies, or partner-specific
      transition plans.
    whyItMatters: Abrupt exits weaken enterprise trust and increase the risk that grocery or municipal
      partners demand tighter commercial protections.
    diligencePath: Request representative customer contracts, notice provisions, and partner communications
      for the 2026 campus wind-down.
    relatedQuestionRefs:
    - QR020
    - QR032
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: medium
    topic: Operational intervention rates and route-quality variance
    missingEvidence: Public materials emphasize autonomy and safety but do not disclose intervention frequency,
      uptime by weather, route abandonment, failed crossings, or vandalism losses by market.
    whyItMatters: Without operating-control metrics, investors cannot tell whether the grocery pivot improves
      unit economics or simply shifts the burden into denser, harder routes.
    diligencePath: Request weekly operating dashboard with interventions, uptime, exception handling,
      and maintenance incidents by city and vertical.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR018
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: medium
    topic: Comprehensive jurisdiction register for TR001 sample coverage
    missingEvidence: TR001 covers the best-evidenced high-salience legal risks, not a complete jurisdiction-by-jurisdiction
      register across all operating countries and states.
    whyItMatters: A sample register can miss one problematic city or country whose rules become a disproportionate
      bottleneck during expansion.
    diligencePath: Obtain internal compliance matrix covering every active and planned geography, with
      permit owners, complaint thresholds, and blocked-route maps.
    relatedQuestionRefs:
    - QR001
    - QR004
    - QR030
    relatedTableRefs:
    - TR001
