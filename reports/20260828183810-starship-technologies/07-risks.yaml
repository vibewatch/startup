company:
  name: Starship Technologies
chapter:
  number: 7
  title: Risks
  summary: >-
    Starship's largest residual risks now sit outside the core autonomy demo. The company has credible
    technical and policy capabilities, but investors still have to underwrite a patchwork legal environment,
    accessibility and bodily-injury exposure, community acceptance in public space, dependence on partner-controlled
    demand surfaces, and a capital-intensive pivot from campuses toward grocery. Virginia proves that
    regulation can be shaped in Starship's favor, yet municipal restrictions and complaint channels show
    that authorization is not the same thing as frictionless deployment. The Arizona lawsuit and Sheffield
    vandalism episode are the strongest adverse proofs that real-world operating risk remains material.
    The investment case therefore depends on Starship converting announced grocery momentum into durable
    contracts before safety, policy, or financing issues compress the value of its fleet scale.
sections:
- id: SR001
  title: Regulatory and legal exposure remains the primary external risk cluster
  body: >-
    Starship has unusually strong early proof that it can win legal room to operate: Virginia remains
    a landmark example where the company worked with lawmakers to establish a statewide framework for
    personal delivery devices. That framework is helpful because it clarifies robot rights, speed limits,
    braking and operator-identification requirements, and minimum liability insurance. But the same evidence
    also shows why legal victory does not equal frictionless scaling. Alexandria and Arlington still channel
    complaints, pilot conditions, and local safety expectations; Next City documents municipal contracts
    that add fees and ADA or geofencing penalties; and Supply Chain Dive shows that state-by-state rules
    differ materially enough to create a real compliance tax. The result is that Starship's regulatory
    moat is mixed. Experience matters, but every new geography still carries fresh legal drafting, local
    diplomacy, and enforcement risk. Investors should therefore treat policy execution as an ongoing operating
    function rather than a one-time hurdle the company has already cleared.
