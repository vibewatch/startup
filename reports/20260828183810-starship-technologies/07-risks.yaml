- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Product-liability escalation
    - Serious-injury case outcome or new similar incidents
    - Adverse judgment, recall, or multiple substantiated injury claims
    - Pause underwriting until safety, reserve, and insurance impact is quantified
  - - Regulatory tightening
    - New city or state restrictions
    - Material route bans, added fees, or ADA/geofence enforcement trends
    - Reduce growth assumptions and re-rate rollout timelines
  - - Grocery pivot under-conversion
    - Named retailer launches and market count
    - Missed milestone for major U.S. grocery deployments within the next 6-12 months
    - Treat the pivot as concentration, not de-risking
  - - Financing pressure before margin proof
    - Runway, cash use, and fundraising activity
    - Need for new capital before investors can verify durable grocery economics
    - Expect valuation pressure or tougher terms
  - - Reference-quality erosion
    - Former campus or city partner sentiment
    - Pattern of abrupt exits, complaints, or replacement by rivals
    - Increase discount rate on enterprise-customer durability
  - - Community hostility
    - Vandalism, complaints, media backlash
    - Repeated local incidents across more than one launch city
    - Underwrite slower expansion and higher operating overhead
  notes: Kill criteria are designed to be observable from diligence materials or public updates rather
