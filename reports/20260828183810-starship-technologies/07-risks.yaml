- id: SR002
  title: Accessibility, safety, and street-level operations are where abstract risk becomes real
  body: >-
    Starship's own materials show that management understands the sensitivity of operating on sidewalks:
    the company emphasizes low weight, cautious speed, human tele-assist, mapped crossings, disability-group
    consultation, privacy minimization, and visible hardware design. Those are meaningful mitigations,
    and the Guide Dogs pilot offers at least some concrete support that careful design can reduce accessibility
    conflict. Even so, the residual exposure remains material because public-space robotics is judged
    by outlier events. The Arizona injury lawsuit matters precisely because it tests whether Starship's
    safety stack is robust enough under messy real-world conditions. The Sheffield vandalism episode matters
    for a different reason: it demonstrates that community acceptance can fail even without a catastrophic
    safety incident. Broader delivery-robot evidence further shows that cracked sidewalks, poor merchant
    training, temporary obstacles, and weak awareness can all undermine rollout quality. In other words,
    Starship's technical edge reduces operational risk, but it does not convert sidewalk autonomy into
    a low-touch infrastructure business. The company still needs constant local operating discipline.
  tableRefs:
  - TR002
