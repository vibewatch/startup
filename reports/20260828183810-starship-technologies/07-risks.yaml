- id: SR003
  title: The 2026 campus exit makes partner and commercial concentration impossible to ignore
  body: >-
    The most important new commercial-risk datapoint is not a competitive move by another robot company;
    it is Starship's own decision to wind down U.S. university operations and redeploy roughly 1,200 robots
    toward grocery. That move may be strategically rational, but it proves that management will reallocate
    scarce fleet capacity when it sees a better vertical. For customers and investors, that raises two
    linked issues. First, partner dependence is high because app integrations and institutional permissions
    still shape order flow, user access, and unit economics. Second, reference quality can degrade when
    a once-core segment is exited abruptly or with uneven notice. The company now argues that grocery
    is the better long-duration business because it is year-round, urban, and structurally different from
    campus operations. That may be right, but the public evidence still leaves uncertainty around how
    much of the grocery narrative is supported by signed contracts versus pipeline optimism. Starship
    does have industrial and other business-line diversification, yet the proof remains shallow compared
    with the scale once visible on campuses.
  tableRefs:
  - TR003
  claimRefs:
  - CR027
