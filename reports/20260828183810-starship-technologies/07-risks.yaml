- id: SR005
  title: Residual-risk monitoring should focus on four thesis-break pathways
  body: >-
    From an investment perspective, the key question is not whether robots can move goods on sidewalks
    — Starship has already proven that. The key question is whether the remaining risk stack is monitorable
    and whether the company's mitigations are maturing faster than the stakes of its expansion. The most
    important watchpoints are straightforward. First, serious injury or product-liability outcomes could
    reset partner and regulator tolerance. Second, local or state rule-tightening could constrain route
    density or raise compliance cost just as grocery expansion accelerates. Third, if announced grocery
    demand does not translate into live multi-market retailer contracts, the 2026 pivot will look more
    like concentration than focus. Fourth, if financing needs reappear before public evidence of durable
    margin improvement arrives, valuation support will weaken quickly. None of these risks invalidates
    the company outright, but together they justify a disciplined diligence plan centered on incident
    logs, insurance terms, contract quality, geographic complaint data, and conversion of announced pipeline
    into operational proof.
