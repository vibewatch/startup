- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: >-
    The demand tailwinds behind sidewalk robotics are real: labor shortages, expensive human courier economics,
    growth in app-mediated food delivery, and retailer interest in lower-emission fulfillment all improve
    the adoption case. Starship's own materials and partner launches make the margin story explicit, especially
    for top-up grocery baskets where sending a human driver is economically awkward. Yet constraints remain
    just as structural. The category depends on local law, insurance, sidewalk quality, short delivery
    radii, and customer acceptance of robots sharing pedestrian space. Virginia's PDD regime shows the
    kind of enabling framework operators want, but Arlington and Alexandria also show that local ordinances
    and pedestrian-right rules still shape deployment. Supply Chain Dive adds the harder lesson: some
    cities have the law but still lack the physical conditions or political consensus for broad rollout.
    Weather, payload size, accessibility, and public-right-of-way complexity together mean this market
    scales city by city, not all at once.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
  - CM032
  - CM033
  - CM034
  - CM037
  - CM038
