  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Starship SOM estimation
    missingEvidence: City-level revenue, order-value, take-rate, and gross-margin data by vertical are
      not public.
    whyItMatters: Without revenue conversion and mix data, delivery count cannot be translated into market
      share or realistic SAM capture.
    diligencePath: Request city-by-city GMV, revenue, and contribution-margin cohorts split across grocery,
      apps, campuses, and industrial sites.
    relatedQuestionRefs:
    - QM022
    - QM023
  - type: missing-source
    severity: material
    topic: robot-addressable share of food delivery TAM
    missingEvidence: No reviewed source quantifies what percentage of food and grocery orders are technically
      and economically suitable for small sidewalk robots.
    whyItMatters: The gap prevents a clean bridge from very large macro food-delivery TAMs into Starship's
      true addressable share.
    diligencePath: Build an internal bottom-up SAM model using basket size, distance, neighborhood density,
      sidewalk coverage, and local regulatory eligibility.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: medium
    topic: segment economics by buyer type
    missingEvidence: There is no public apples-to-apples comparison of grocery, campus, delivery-app,
      and industrial-site contribution economics.
    whyItMatters: Later valuation work needs evidence on which segment deserves growth capital and which
      segment should be treated as a data-collection or niche channel.
    diligencePath: Request segment-level utilization, cost-to-serve, renewal, and margin cohorts for the
      last eight quarters.
    relatedQuestionRefs:
    - QM011
    - QM025
