slug: starship-technologies
runDate: '2026-08-28'
company:
  name: Starship Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Starship operates in a narrowly defined but quickly scaling slice of last-mile automation: short-radius
    sidewalk delivery for grocery, meal, parcel, and industrial-site workflows. The pure-play delivery-robot
    category is still small relative to the massive online food-delivery demand pool, which means valuation
    discipline depends on not confusing macro demand with Starship's true serviceable market. The strongest
    public proof sits in grocery and app-integrated hyperlocal delivery, especially Finland; the key constraints
    remain regulation, sidewalk quality, payload limits, and the still-unquantified share of food-delivery
    demand that robots can actually serve profitably.
sections:
- id: market-boundary-definition
  title: 'Market boundary: hyperlocal delivery, not all of logistics'
  body: >-
    Starship's market has to be bounded tightly or the analysis becomes meaningless. The company is not
    competing for all last-mile logistics spend, all grocery e-commerce GMV, or the full autonomous-robotics
    market. Its actual domain is hyperlocal delivery on sidewalks and other pedestrian-priority surfaces
    where a small robot can move food, groceries, parcels, or internal-site goods at walking speed. That
    means the directly relevant market includes retailer-funded grocery runs, delivery-app meal and convenience
    orders, campus dining deliveries, and certain industrial-site movements. It excludes road robotaxis,
    warehouse AMRs, and most freight autonomy even though those categories use related robotics and AI
    language. This boundary matters because Starship's strongest evidence comes from dense short-radius
    routes, especially grocery and campus environments, not from heavy payload, long distance, or road-certified
    autonomy. The right status-quo substitutes are human couriers, self-pickup by car, or internal staff
    runners — not broad national parcel networks.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM013
  - CM017
  - CM036
  tableRefs:
  - TM001
- id: tam-sam-som-lenses
  title: 'Sizing lenses: macro demand is huge, pure-play robot delivery is still small'
  body: >-
    Published market estimates show why Starship can tell both a large-market story and a still-emerging-category
    story at the same time. At the narrowest lens, Precedence pegs global delivery robots at just USD
    409.3 million in 2024, albeit with rapid 32% expected CAGR to USD 6.58 billion by 2034. At the broadest
    demand lens, online food delivery is already around USD 285 billion in 2026 by both Mordor and Precedence,
    with long-range forecasts ranging from roughly USD 469 billion to almost USD 695 billion. IMARC's
    much lower 2025 figure illustrates how much methodology changes the top line. The adjacent AMR market
    is also much larger than pure-play sidewalk robots, but most of that spend sits in warehouses, factories,
    and logistics facilities rather than public-sidewalk delivery. The practical conclusion is that Starship
    addresses a small but fast-growing automation niche embedded inside a huge food-and-grocery demand
    pool. Public data is still insufficient to estimate Starship's SOM credibly, because delivery count
    alone does not reveal revenue, order value, or geographic share.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
