- id: buyer-segments-and-adoption
  title: Buyer segmentation and adoption path
  body: >-
    Starship now serves several distinct buyer archetypes that share a need for short-radius delivery
    but differ materially in budget ownership. Grocery retailers care about delivery margin, customer
    acquisition, and fast local fulfillment; delivery apps want a multimodal fleet that can be inserted
    into an existing ordering surface; campuses historically valued density and novelty but ultimately
    remained seasonal and contract-driven; and industrial sites use the same autonomy stack for internal
    transport rather than consumer commerce. The adoption path is also more operational than visionary.
    Starship's own materials describe mapping a delivery radius, integrating APIs or a white-label app,
    training local staff, and then supporting live operations. Finland's Alepa launch and the S Group
    scale-up show how store-cluster pilots can become repeatable production rollouts. By contrast, the
    2026 U.S. campus wind-down shows that not every apparently successful segment deserves ongoing capital
    allocation. Market formation depends as much on repeatable deployment workflow as on raw consumer
    interest.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
