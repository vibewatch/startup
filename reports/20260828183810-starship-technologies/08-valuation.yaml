- id: SV005
  title: The decision turns on a short list of diligence blockers and thesis-break triggers
  body: >-
    The final valuation stance is less about elegant modeling and more about what management is willing
    to show. Three diligence buckets are genuinely blocking. First, investors need operating-financial
    evidence: revenue by geography and customer, contribution margin by grocery market, and current burn.
    Second, they need pricing terms: the 2025 round valuation, liquidation preferences, and any structure
    that changes effective economics for a new investor. Third, they need conversion proof: named grocery
    partners, launch cadence, and contract protections robust enough to overcome the trust hit created
    by the campus wind-down. These asks matter because the thesis can break quickly. A serious safety
    or legal event, a failed grocery conversion, or a new financing need before margin proof becomes visible
    would all collapse the case for paying a premium multiple. If management supplies strong answers,
    the recommendation can move. Without them, discipline should dominate enthusiasm.
  tableRefs:
  - TV005
  - TV006
