company:
  name: Starship Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Starship looks like a real category leader, but the current public record does not justify a clean
    buy at or above the last explicit $1.2 billion mark. The bullish case is clear: 10 million-plus deliveries,
    3,000-plus robots, strong Finland grocery proof, durable investor support, and a better operating
    footprint than most sidewalk-robot peers. The counterweight is just as clear: Starship's own revenue,
    margins, burn, 2025 round valuation, and preference structure remain private. Public comps such as
    Serve show that autonomy markets will pay rich forward multiples, but also that those multiples are
    volatile and sensitive to execution misses. The most defensible call today is therefore research-more
    or structured-only at current pricing: base-case public evidence largely brackets the old unicorn
    mark, bull-case upside requires fresh contract and margin proof, and bear-case downside remains material
    if the grocery pivot slips or financing is needed before proof arrives.
sections:
- id: SV001
  title: 'Recommendation and price discipline: impressive company, incomplete price support'
  body: >-
    Starship is easier to like as a company than as a fully underwritten price. Public evidence clearly
    shows category leadership in real-world deployment: the company has millions of deliveries, thousands
    of robots, and a credible grocery foothold in Finland that looks materially stronger than most delivery-robot
    peers. The problem is that the best public price anchor is still a third-party estimate for the February
    2024 round, while Starship's own financing announcements stop short of confirming a valuation for
    either the 2024 round or the 2025 extension. That forces an investor to bridge the gap between obvious
    operational quality and incomplete pricing evidence. In practice, that means the correct stance is
    price-sensitive and disclosure-sensitive: at or above the last explicit $1.2 billion mark, public
    evidence supports continued diligence and possibly structured participation, but not a clean buy based
    purely on what is currently disclosed. Starship may outperform that mark; it has not yet proved it
    publicly.
  tableRefs:
