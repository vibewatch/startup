- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Safety / legal escalation
    - Serious injury judgment, regulatory restriction, or cluster of substantiated incidents
    - Would damage trust, increase insurance burden, and slow rollout
    - Pause investment or re-cut valuation materially lower
  - - Grocery pipeline miss
    - No meaningful U.S. grocery launches or weak utilization after launch
    - Turns the pivot into concentration rather than de-risking
    - Move to bear case and demand price protection
  - - New capital before proof
    - Fundraise needed before investors can verify margin improvement
    - Signals that scale has not yet produced economic leverage
    - Expect tougher terms or a lower mark
  - - Finland proof deterioration
    - 20% share or flagship grocer relationship weakens
    - Undercuts the strongest real grocery proof point
    - Reduce premium versus Serve-like public comps
  - - Cap-table surprise
    - Hidden preferences or seniority materially change effective entry price
    - Can destroy expected return even if company performance is good
    - Do not proceed until terms are fully understood
  notes: These kill triggers are deliberately narrow and monitorable; each would independently alter the
    valuation stance.
  claimRefs:
  - CV031
  - CV032
  - CV037
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue by geography and customer
    - Current revenue split across Finland, other Europe, and U.S. grocery
    - Needed to test whether current scale can support the last explicit mark
    - Finance team / management data room
  - - Grocery contribution margin
    - Per-delivery contribution margin by flagship grocery market
    - The core bull case rests on better economics than couriers
    - CFO and operating dashboards
  - - 2025 round pricing and preferences
    - Post-money valuation, liquidation stack, pro rata, and any structure
    - Entry economics can differ sharply from headline company quality
    - Lead investor docs and cap table
  - - Signed grocery pipeline
    - Named retailers, rollout dates, committed robot counts, and SLAs
    - The pivot only deserves credit if pipeline converts into contracted demand
    - Commercial team and contract summary
  - - Concentration and contract protections
    - Top-customer mix, termination rights, and notice periods after campus exit
    - Needed to judge customer durability and downside
    - Legal and customer success teams
  - - Current burn and runway
    - Monthly cash burn, capex plan, and hiring pace under grocery expansion
    - Determines whether a new round will be needed before proof arrives
    - CFO and board materials
  notes: These asks are blocking rather than nice-to-have because each one directly changes valuation
    support, not just narrative comfort.
