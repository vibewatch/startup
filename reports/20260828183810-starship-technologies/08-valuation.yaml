    - TV006
  - type: private-evidence-only
    severity: material
    topic: Signed U.S. grocery pipeline and concentration
    missingEvidence: Management describes grocery momentum, but public sources do not identify contract
      count, launch timing, committed robot counts, top-customer mix, or SLA economics.
    whyItMatters: The bull case depends on contract conversion, not on narrative momentum alone.
    diligencePath: Request signed customer pipeline, rollout calendar, cohort economics for first grocery
      markets, and customer concentration tables.
