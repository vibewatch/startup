- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - Category-leading deployment scale
    - 10M+ deliveries, 3,000+ robots, 300+ locations, 8 countries
    - Show how scale translates into revenue and gross margin rather than just operational bragging rights
  - - Finland proves grocery density
    - S Group and Finland data show 20% of online grocery orders and 800+ robots
    - Prove comparable density or contribution margin in at least one major U.S. grocery market
  - - Investor support remains available
    - $50M extension in 2025 and long funding history show continuing backers
    - Disclose whether the 2025 round held, increased, or reset the effective valuation
  - - Financial opacity is the core anti-thesis
    - No public revenue, margin, or burn disclosure for Starship
    - Provide audited or management-quality KPI package by geography and customer
  - - Pivot risk remains real
    - Campus exit proves the story is now narrower and more concentrated on grocery
    - Demonstrate signed grocery launches large enough to offset lost campus relevance
  - - Public comp support is volatile
    - Serve and Nuro show both upside appetite and repricing risk in autonomy
    - Sustain proof through commercial execution, not just funding headlines
  notes: The anti-thesis is not that the technology is weak; it is that the current public evidence is
    too thin for false precision on price.
