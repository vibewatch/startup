- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Starship Feb 2024 Series C
    - External post-money mark
    - ~$1.2B per Sacra after $90M round
    - Best last explicit anchor for current entry discussions
    - Company did not publicly confirm the valuation
  - - Starship Oct 2025 extension
    - Follow-on financing
    - '>$50M raised; valuation not disclosed'
    - Shows continuing insider and investor support
    - No public price reset or preference detail
  - - Serve Robotics public trading
    - Late Aug 2026 market value
    - ~$0.42-$0.44B market cap; ~$0.20B EV
    - Closest listed sidewalk robot comparable
    - Tiny revenue, heavy losses, and large cash balance distort direct comparisons
  - - Serve 2026E consensus
    - Forward revenue expectation
    - ~$26M 2026E revenue; ~200%+ growth into 2027
    - Illustrates how far ahead public comps price future wins
    - Forecast-based and extremely sentiment-sensitive
