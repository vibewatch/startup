- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Major U.S. grocers launch, revenue disclosure clears ~$60M+, Finland economics travel, no major
      safety setback
    - $1.8B-$2.4B implied value; roughly 1.5x-2.0x on a $1.2B entry
    - Execution slip, local regulation, margin overstatement
    - Requires new disclosure and visible contract conversion
  - - Base
    - Finland stays strong, grocery launches arrive incrementally, but financial disclosure remains limited
    - $1.0B-$1.4B implied value; little margin of safety above the last explicit mark
    - Opaque economics, concentration, modest public-comp compression
    - Best fit with current public evidence
  - - Bear
    - Grocery conversion disappoints, safety or legal issues intensify, or new capital is needed before
      proof arrives
    - $0.4B-$0.8B implied value; roughly 0.3x-0.7x on a $1.2B entry
    - Down-round risk and trust erosion
    - Triggered by thesis-break events rather than by a single missed KPI
  notes: These ranges are intentionally broad because Starship's own revenue and margin data are not public;
    precision would be misleading.
