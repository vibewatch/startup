  - type: private-evidence-only
    severity: material
    topic: 2025 round pricing and liquidation structure
    missingEvidence: Public materials disclose the size of the 2025 extension round but not the post-money
      valuation, liquidation preferences, seniority, anti-dilution, or pro rata rights.
    whyItMatters: Effective entry price and downside protection can differ sharply from the headline quality
      of the company.
    diligencePath: Review cap table, charter documents, side letters, and the most recent lead-investor
      term sheet or closing set.
    relatedQuestionRefs:
