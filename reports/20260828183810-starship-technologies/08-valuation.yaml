  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Current revenue, margin, and burn data
    missingEvidence: No retained public source provides Starship's current revenue by geography, gross
      margin, contribution margin by market, or current cash burn.
    whyItMatters: These are the core inputs required to determine whether the last explicit $1.2B mark
      offers real upside or merely fair value.
    diligencePath: Request current management KPI pack, board materials, and audited or at least finance-reviewed
      monthly operating summaries.
    relatedQuestionRefs:
