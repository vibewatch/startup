    - Private autonomy comp
    - $6B, down from $8.6B in 2021
    - Shows that later-stage autonomy capital still exists but reprices on strategy changes
    - Business model is on-road autonomy licensing, not sidewalk delivery
  notes: The comparable set is intentionally milestone-based, not exhaustive, because the pure-play sidewalk-delivery
