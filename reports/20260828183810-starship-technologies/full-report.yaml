  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: a delivery operating system wrapped around a sidewalk robot'
        blocks:
          - type: paragraph
            body: >-
              Starship's product should not be reduced to a cute six-wheeled vehicle. In customer workflow terms, the
              product is a managed local-delivery system: the partner exposes ordering, Starship dispatches and
              navigates the fleet, the robot completes the last hundred meters to a few miles, the customer tracks
              arrival and unlocks the compartment, and local support handles exceptions. That is why the company can
              sell into grocery retailers, delivery apps, campuses, and industrial sites without changing the core
              service concept. The robot is the visible asset, but the product promise is reliable, low-friction
              delivery in environments where a human courier is either too expensive or operationally awkward. Starship
              also explicitly positions robots as part of a multi-modal delivery stack rather than as a universal
              substitute for all couriers, which is a more credible product framing than claiming robotics alone can
              solve every local-delivery use case.
