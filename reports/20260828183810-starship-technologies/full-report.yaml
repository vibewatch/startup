      - number: '2.5'
        title: What later chapters should treat as solid versus soft
        blocks:
          - type: paragraph
            body: >-
              The strongest market facts for the rest of the report are directional, not exact. It is solid that online
              food and grocery demand is very large, that pure-play delivery robots remain a much smaller niche, that
              Starship's best public proof comes from grocery and short-radius use cases, and that regulation plus
              sidewalk conditions are first-order adoption constraints. It is softer to claim any precise global TAM for
              Starship or any clean public SOM. The category has too many overlapping definitions — delivery robots,
              AMRs, autonomous last-mile, and food-delivery TAMs — to collapse into one number without distorting
              reality. The most defensible framing for later valuation work is therefore evidence-constrained: use the
              narrow category for present competitive reality, use broad food delivery only as a demand backdrop, and
              carry forward explicit diligence gaps on robot-addressable share, vertical mix, and revenue conversion.
            claimRefs:
