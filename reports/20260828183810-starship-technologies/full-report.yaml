            title: Virginia legality is a proof point, not a blanket de-risker
            body: >-
              Starship deserves credit for helping create early PDD rules, but the better read is that policy work is a
              continuing capability requirement. Local implementation, accessibility expectations, and city-level fee or
              geofence rules still matter.
