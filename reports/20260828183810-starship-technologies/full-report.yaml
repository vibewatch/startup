      - number: '4.3'
        title: Cost structure and public traction
        blocks:
          - type: paragraph
            body: >-
              Public traction disclosure is strong by startup standards but still incomplete for underwriting. Starship
              provides a credible picture of scale — more than 10 million deliveries, 300-plus locations, daily
              crossings, and a large fleet — yet does not disclose annual revenue or gross profit dollars. On the cost
              side, the likely expense base is heavy: robot manufacturing, batteries and components, maintenance, field
              operations, oversight, software, insurance, support, and deployment infrastructure such as charging. The
              company has repeatedly argued that per-order economics are now better than human couriers in the right
              conditions, and its latest materials push that point harder in grocery. Those claims are directionally
              plausible because dense short-radius routes should favor a battery-powered robot, but the absence of
              utilization, intervention, and maintenance metrics means the margin story cannot be verified
              independently. Strong operational proof therefore reduces model risk, but does not eliminate financial
              opacity.
