      - number: '4.2'
        title: GTM motion and what likely drives operating leverage
        blocks:
          - type: paragraph
            body: >-
              The GTM motion looks enterprise-led, operational, and locally repeatable rather than software-like.
              Starship wins a partner, maps a service area, integrates ordering flows, deploys robots, then expands to
              more stores, campuses, or cities once unit economics and trust are validated. That makes sales efficiency
              hard to measure with classic SaaS metrics, but easier to think about in terms of deployment repeatability
              and partner expansion. Distribution partnerships should lower customer-acquisition burden because Starship
              can plug into existing consumer demand instead of building it from scratch. Operating leverage then
              depends on density, repeat orders, route familiarity, and utilization. The more often a robot can complete
              short trips with limited human intervention, the more the fixed cost of the fleet and local support is
              absorbed. This is why management emphasizes grocery, urban deployments, wireless charging, and platform
              integrations rather than generic robotics branding.
