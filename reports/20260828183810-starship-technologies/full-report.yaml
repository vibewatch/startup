  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Starship's economic model is best framed as delivery-as-a-service for enterprise partners, not as a
              consumer app with incidental robotics underneath. The company sells a lower-cost fulfillment method to
              grocery retailers, delivery apps, campuses, and industrial sites; the robot is the delivery
              infrastructure. Public materials strongly suggest that enterprise contracts matter more than consumer
              delivery fees, even though end users may still pay small per-order charges. The clearest old numeric clue
              is a 2019 disclosure that delivery fees were typically $1.99 or less by location, but current pricing
              appears relationship-specific and bundled with integrations, live operations, and deployment scope. That
              implies the real monetization levers are order volume, density, partner mix, and contract structure. It
              also creates accounting ambiguity. Public evidence does not separate enterprise service revenue from
              consumer-paid delivery fees, so revenue mix and recognition remain unresolved from the outside.
