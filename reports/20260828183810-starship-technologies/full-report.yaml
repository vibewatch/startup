      - number: '7.4'
        title: Capital intensity and execution risk persist despite category leadership
        blocks:
          - type: paragraph
            body: >-
              Starship's headline leadership metrics — millions of deliveries, thousands of robots, and multiple funding
              rounds — should not be confused with a de-risked financial model. The funding history instead suggests a
              company that still needs substantial external capital to support robot manufacturing, engineering,
              charging infrastructure, and multi-market deployment. The 2024 equity round, the 2025 extension round, and
              the earlier EIB facility all support the view that credible investors still back the company. They also
              support the opposite conclusion that the business remains expensive to scale and that capital availability
              is part of the operating model, not just a historical footnote. Public evidence around Starship-specific
              grocery margins remains incomplete, so investors are still being asked to underwrite management's claim
              that grocery economics are structurally superior. That makes people and execution risk more important than
              a typical software story: leadership, field-ops hiring, regulatory engagement, and disciplined rollout
              quality will determine whether the next phase produces leverage or merely a larger cost base.
            claimRefs:
