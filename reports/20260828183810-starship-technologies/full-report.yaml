            body: >-
              Starship's funding history makes the capital-intensity story unmistakable. The company raised substantial
              capital across 2019, 2022, 2024, and 2025, including equity rounds and a quasi-equity EIB facility
              earmarked for R&D and building thousands more robots. That financing record does not mean the business is
              weak; it means the company is scaling a physical network with meaningful engineering and asset
              requirements. Official materials try to square that tension by claiming profitability in several
              locations, positive gross margins, and lower unit cost than human delivery, while simultaneously raising
              more capital for fleet expansion and U.S. market penetration. The unresolved question is whether those
              claims describe durable corporate economics or simply attractive unit contribution before ongoing
              expansion spend. Because Starship does not publish cash balance, burn, or runway, current capital adequacy
              is unknowable from public evidence alone. The prudent conclusion is that Starship remains
              financing-dependent even if some local deployments are economically strong.
