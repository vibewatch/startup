  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Shows how institutional buyers and end users interact across Starship's main segments.
    data:
      items:
        - label: Institutional decision
          value: 1
          note: Grocer, campus, or app partner selects robot delivery to improve convenience or unit economics.
        - label: Integration / setup
          value: 2
          note: Service area, ordering surface, payment rules, and operations are configured between partner and Starship.
        - label: First order
          value: 3
          note: Shopper or student places order through the app surface and selects a delivery destination.
        - label: Tracked fulfillment
          value: 4
          note: Robot delivery is visible in-app and the customer receives a simple arrival-and-unlock flow.
        - label: Habit loop
          value: 5
          note: >-
            Repeat convenience drives usage while the institutional buyer decides whether to expand or renew the
            program.
