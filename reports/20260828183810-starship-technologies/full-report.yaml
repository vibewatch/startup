      - number: '8.2'
        title: 'Thesis and anti-thesis: grocery leadership is real, but the financial bridge is missing'
        blocks:
          - type: paragraph
            body: >-
              The bullish argument for Starship is substantive. The company appears to have done something few robotics
              startups achieve: it turned autonomy into repeated commercial operations across multiple countries, then
              found a grocery use case that shows genuine density rather than just pilot novelty. Finland and S Group
              matter because they suggest Starship can become infrastructure for top-up grocery rather than a campus
              gimmick. The anti-thesis is equally important. In 2026 Starship narrowed its strategic story by exiting
              U.S. campuses, which may be smart but also makes the next chapter more concentrated on grocery execution.
              At the same time, revenue, margin, burn, and pricing terms remain private. That mismatch means the thesis
              is not really about whether robots work; it is about whether grocery economics and contract conversion are
              strong enough to justify paying at or above an old unicorn-era mark without an unusual amount of trust. In
              short, quality is visible, but valuation proof still lags quality.
            claimRefs:
              - CV005
              - CV006
