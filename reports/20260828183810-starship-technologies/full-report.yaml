  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation and price discipline: impressive company, incomplete price support'
        blocks:
          - type: paragraph
            body: >-
              Starship is easier to like as a company than as a fully underwritten price. Public evidence clearly shows
              category leadership in real-world deployment: the company has millions of deliveries, thousands of robots,
              and a credible grocery foothold in Finland that looks materially stronger than most delivery-robot peers.
              The problem is that the best public price anchor is still a third-party estimate for the February 2024
              round, while Starship's own financing announcements stop short of confirming a valuation for either the
              2024 round or the 2025 extension. That forces an investor to bridge the gap between obvious operational
              quality and incomplete pricing evidence. In practice, that means the correct stance is price-sensitive and
              disclosure-sensitive: at or above the last explicit $1.2 billion mark, public evidence supports continued
              diligence and possibly structured participation, but not a clean buy based purely on what is currently
              disclosed. Starship may outperform that mark; it has not yet proved it publicly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV024
              - CV025
              - CV032
              - CV042
