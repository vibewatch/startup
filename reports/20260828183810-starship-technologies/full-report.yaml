  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Regulatory patchwork and bodily-injury liability are the highest-severity risks, while community hostility and
      partner concentration sit just below them because they can quickly cascade into lost growth or tighter oversight.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Severity
          values:
            - label: —
            - label: Serious injury / liability shock
            - label: —
        - label: High Severity
          values:
            - label: Privacy or surveillance challenge
            - label: Accessibility complaints; grocery pipeline miss
            - label: Patchwork regulation; partner concentration
        - label: Medium Severity
          values:
            - label: Cyber / tele-assist failure
            - label: Vandalism; charging bottlenecks; local fee tightening
            - label: Infrastructure mismatch / route friction
        - label: Low Severity
          values:
            - label: Hazmat edge-case noncompliance
            - label: Industrial diversification stays small
            - label: Campus-reference erosion
    claimRefs:
      - CR011
      - CR017
      - CR018
      - CR024
      - CR027
      - CR033
      - CR036
      - CR041
      - CR042
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The key transmission path runs from safety or community incidents into regulatory review, partner hesitation,
      slower rollout, financing pressure, and valuation compression.
    data:
      nodes:
        - id: n1
          label: Serious sidewalk injury
          type: operational
        - id: n2
          label: Accessibility / obstruction complaints
          type: regulatory
        - id: n3
          label: Community vandalism / backlash
          type: social
        - id: n4
          label: Regulatory tightening
          type: regulatory
        - id: n5
          label: Partner diligence hardens
          type: commercial
        - id: n6
          label: Route density shrinks
          type: operations
        - id: n7
          label: Grocery rollout slows
          type: commercial
        - id: n8
          label: Cash burn stays elevated
          type: financial
        - id: n9
          label: Financing pressure
          type: financial
        - id: n10
          label: Valuation support weakens
          type: impact
      edges:
        - from: n1
          to: n4
          label: Safety scrutiny
        - from: n1
          to: n5
          label: Liability concern
        - from: n2
          to: n4
          label: Complaint-driven rules
        - from: n3
          to: n4
          label: Political backlash
        - from: n3
          to: n5
          label: Brand concern
        - from: n4
          to: n6
          label: Less usable geography
        - from: n5
          to: n7
          label: Longer sales cycle
        - from: n6
          to: n7
          label: Lower density economics
        - from: n7
          to: n8
          label: Utilization miss
        - from: n8
          to: n9
          label: More external capital
        - from: n9
          to: n10
          label: Down-round / discount risk
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR027
      - CR033
      - CR034
      - CR041
      - CR042
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Starship's next phase depends on a chain of legal access, partner demand surfaces, hardware and charging support,
      field operations, and fresh capital — weakness at any link lowers the value of fleet scale.
    data:
      nodes:
        - id: d1
          label: State & city legal access
          type: regulatory
        - id: d2
          label: Delivery-app / retailer integration
          type: partner
        - id: d3
          label: Mapped routes & geofencing
          type: operations
        - id: d4
          label: Charging / maintenance hubs
          type: operations
        - id: d5
          label: Tallinn engineering core
          type: people
        - id: d6
          label: Redeployed robot fleet
          type: asset
        - id: d7
          label: Major grocery launches
          type: commercial
        - id: d8
          label: Utilization and margin proof
          type: financial
        - id: d9
          label: Follow-on capital availability
          type: financial
      edges:
        - from: d1
          to: d3
          label: Defines where robots may go
        - from: d2
          to: d7
          label: Controls demand surface
        - from: d3
          to: d7
          label: Enables live service
        - from: d4
          to: d7
          label: Supports uptime
        - from: d5
          to: d6
          label: Improves autonomy and ops tooling
        - from: d6
          to: d7
          label: Provides capacity
        - from: d7
          to: d8
          label: Creates economic evidence
        - from: d8
          to: d9
          label: Shapes financing terms
    claimRefs:
