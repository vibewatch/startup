      - number: '1.3'
        title: Funding history and capital structure that are actually public
        blocks:
          - type: paragraph
            body: >-
              Starship has raised meaningful capital over a long period, but the public record is still thinner than
              many later-stage private robotics companies. The disclosed path begins with a $17.2 million seed round in
              January 2017, then a $25 million top-up in June 2018, followed by a $40 million Series A in August 2019
              that explicitly financed campus expansion. In 2022 the company layered a €50 million quasi-equity EIB
              facility onto a new $42 million Series B, taking disclosed funding to $202 million and tying part of the
              capital to European R&D and manufacturing expansion. The February 2024 round added another $90 million and
              brought disclosed capital to $230 million; TechCrunch confirmed that valuation was not disclosed. The
              October 2025 round added $50 million more and pushed disclosed capital above $280 million, again without a
              public valuation. That leaves investors with a usable funding chronology but an incomplete view of
              ownership dilution, liquidation preferences, secondary transactions, debt covenants, and current cash
              runway.
