      - number: '1.4'
        title: Commercial milestones from pilots to category-scale deployment
        blocks:
          - type: paragraph
            body: >-
              The strongest bull case in the overview is Starship's milestone record. The company moved from 2017 pilot
              activity in multiple countries to the first statewide US regulatory approval in Virginia, then to first
              commercial deliveries in Milton Keynes and the first large-scale US university deployment at George Mason
              in 2019. Series A was tied directly to a 100-campus ambition, and by January 2024 George Mason alone had
              logged almost 459,000 deliveries, grown from 25 to 60 robots, and expanded from 4 to 18 merchants. Finland
              became the clearest proof point for city grocery economics: Starship launched with HOK-Elanto in 2022, and
              by late 2025 Starship and S Group said grocery robots had passed one million deliveries from more than 170
              stores. The 2024 and 2025 capital raises track a similar scaling story, moving from six million deliveries
              to nine million and then to ten million-plus in 2026. Those numbers support the claim that Starship is no
              longer a science project; they also show why the company is now pivoting from campus density toward urban
              grocery distribution with platforms like Bolt and Uber Eats.
