  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: more than just other sidewalk robots'
        blocks:
          - type: paragraph
            body: >-
              Starship's competitive field is broader than a short list of delivery-robot startups. The direct peer set
              includes companies trying to automate short-range delivery in human environments, but buyers can also
              solve the same job with human couriers, delivery platforms, internal operational buildout, or adjacent
              autonomy providers that eventually move into delivery. That matters because the company is not merely
              selling a robot; it is selling a safer, lower-cost, operationally repeatable way to complete dense local
              orders. As Starship shifts away from campuses and toward grocery plus app-led delivery, the most important
              competitors become those with retailer distribution, restaurant density, or public-market access rather
              than those with campus novelty alone. Serve is therefore the most useful public direct peer, Kiwibot
              remains a relevant category participant, Nuro has drifted into adjacent autonomy, and DoorDash or
              Uber-linked ecosystems represent distribution-led entrants that could alter category structure quickly.
            claimRefs:
