      - number: '1.2'
        title: Leadership evolution and founder-led control
        blocks:
          - type: paragraph
            body: >-
              Leadership history matters because Starship's public story has repeatedly shifted between founder-led and
              operator-led phases. Lex Bayer joined as CEO in 2018 from Airbnb just as the company moved from pilots
              toward commercial rollout, which signaled a need for business-building discipline alongside engineering
              credibility. In 2021 Starship recruited Alastair Westgarth from Alphabet's Loon, and official releases
              described Heinla stepping back into a CTO role while Westgarth scaled the business globally. Yet by early
              2024 TechCrunch reported that Heinla had quietly been reinstated as CEO, and subsequent 2024, 2025, and
              2026 Starship releases all describe him as co-founder and CEO. That arc suggests the company returned to
              founder control after the previous scaling phase, likely because investors and management concluded the
              next chapter required tighter alignment between technical roadmap, deployment economics, and capital
              allocation. The current public bench visible on the About page shows a fuller operating team around
              Heinla, but detailed board composition and governance rights remain undisclosed in public materials.
