          - type: callout
            title: The biggest missing KPI is not deliveries — it is revenue against price
            body: >-
              Without current revenue and contribution-margin disclosure, investors cannot tell whether $1.2B represents
              a bargain, fair value, or a future write-down waiting for a catalyst.
            calloutType: risk
            claimRefs:
              - CV018
