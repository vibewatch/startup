      - number: '2.2'
        title: 'Sizing lenses: macro demand is huge, pure-play robot delivery is still small'
        blocks:
          - type: paragraph
            body: >-
              Published market estimates show why Starship can tell both a large-market story and a
              still-emerging-category story at the same time. At the narrowest lens, Precedence pegs global delivery
              robots at just USD 409.3 million in 2024, albeit with rapid 32% expected CAGR to USD 6.58 billion by 2034.
              At the broadest demand lens, online food delivery is already around USD 285 billion in 2026 by both Mordor
              and Precedence, with long-range forecasts ranging from roughly USD 469 billion to almost USD 695 billion.
              IMARC's much lower 2025 figure illustrates how much methodology changes the top line. The adjacent AMR
              market is also much larger than pure-play sidewalk robots, but most of that spend sits in warehouses,
              factories, and logistics facilities rather than public-sidewalk delivery. The practical conclusion is that
              Starship addresses a small but fast-growing automation niche embedded inside a huge food-and-grocery
              demand pool. Public data is still insufficient to estimate Starship's SOM credibly, because delivery count
              alone does not reveal revenue, order value, or geographic share.
