      - CR025
      - CR030
      - CR031
      - CR033
      - CR035
      - CR038
      - CR040
  - id: FV001
    type: flow
    title: Recommendation logic
    description: >-
      Shows why strong company quality still resolves to a research-more recommendation at the current public valuation
      anchor.
    data:
      nodes:
        - id: n1
          label: Category-leading scale
          description: 10M+ deliveries, 3,000+ robots, 8 countries
        - id: n2
          label: Finland grocery proof
          description: 20% of online grocery orders and 800+ robots in Finland
        - id: n3
          label: Continuing investor support
          description: $50M extension in 2025 and durable funding history
        - id: n4
          label: Opaque financials
          description: No public Starship revenue, gross margin, or burn disclosure
        - id: n5
          label: Volatile comp set
          description: Serve is richly valued but loss-making and volatile; Nuro shows down-round risk
        - id: n6
          label: Research more / structured-only at $1.2B+
          description: Proceed only with better data, stronger terms, or a better price
      edges:
        - from: n1
          to: n6
          label: supports interest
        - from: n2
          to: n6
          label: supports premium
        - from: n3
          to: n6
          label: supports survivability
        - from: n4
          to: n6
          label: blocks clean buy
        - from: n5
          to: n6
          label: demands price discipline
    claimRefs:
      - CV005
      - CV006
      - CV013
      - CV020
      - CV032
      - CV042
  - id: FV002
    type: bar
    title: Valuation sensitivity
    description: Required annual revenue to support a $1.2B enterprise value under different EV/Sales assumptions.
    approximationNotes: >-
      This is an illustrative sensitivity, not a forecast. It shows the revenue Starship would need if investors
      eventually anchor on public-comp-style EV/Sales ranges.
    data:
      items:
        - label: 10x EV/Sales
          value: 120
          unit: $M
          notes: Conservative high-growth multiple still needs triple-digit revenue
        - label: 15x EV/Sales
          value: 80
          unit: $M
          notes: Still requires revenue well above any public disclosure
        - label: 20x EV/Sales
          value: 60
          unit: $M
          notes: Bull-case threshold for meaningful comfort above current opacity
        - label: 26x EV/Sales (Serve-like)
          value: 46.1
          unit: $M
          notes: Equivalent to applying Serve's current EV/Sales ratio
        - label: 30x EV/Sales
          value: 40
          unit: $M
          notes: Very generous multiple still requires substantial undisclosed revenue
    claimRefs:
      - CV018
      - CV019
      - CV035
  - id: FV003
    type: range
    title: Valuation / return range
    description: >-
      Broad current and forward valuation ranges plus the implied MOIC on a $1.2B entry, reflecting how little base-case
      cushion is visible publicly.
    approximationNotes: >-
      Ranges are intentionally wide because Starship has not publicly disclosed the primary financial inputs that would
      justify a narrow point estimate.
    data:
      items:
        - label: Current public-support range
          low: 0.6
          base: 1.2
          high: 1.6
          unit: $B
          notes: Today supported value from public evidence alone
        - label: 24-month outcome range
          low: 0.4
          base: 1.3
          high: 2.2
          unit: $B
          notes: Depends on grocery conversion and financial disclosure
        - label: MOIC on $1.2B entry
          low: 0.3
          base: 1.1
          high: 1.8
          unit: x
          notes: Base-case upside is limited without better evidence or a lower price
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: FV004
    type: kpi
    title: Investment KPIs
    description: >-
      IC-ready snapshot of the operating and comparable signals most relevant to a Starship primary at the last explicit
      public mark.
    data:
      items:
        - label: Last explicit post-money mark
          value: 1.2
          unit: $B
          notes: Third-party Sacra estimate for the February 2024 round
          claimRefs:
            - CV001
        - label: Total funding disclosed by company
          value: 280
          unit: +$M
          notes: October 2025 release says total funding exceeded $280M
          claimRefs:
            - CV002
            - CV004
        - label: Completed deliveries
          value: 10
          unit: +M
          notes: Operational scale is among the strongest parts of the case
          claimRefs:
            - CV005
        - label: Finland grocery share
          value: 20
          unit: '%'
          notes: Best public grocery-density proof point
          claimRefs:
            - CV006
        - label: Serve public market cap
          value: 0.43
          unit: $B
          notes: Closest listed sidewalk-delivery comp
          claimRefs:
            - CV008
        - label: Serve EV/Sales
          value: 26.01
          unit: x
          notes: Useful comp multiple for sensitivity, not a guarantee of support
          claimRefs:
            - CV011
            - CV018
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
      - CV018
