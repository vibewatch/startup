            body: >-
              The financial story is promising but incomplete. Starship appears to have found product-market fit in
              dense, short-radius delivery use cases and is making increasingly explicit unit-economics claims around
              grocery. The campus exit in favor of a 365-day grocery model also supports the idea that management is
              reallocating capital toward the better economic segment rather than simply chasing growth everywhere. At
              the same time, the most important private facts remain absent: revenue, gross margin dollars, burn,
              utilization, segment mix, maintenance burden, and concentration. Serve Robotics provides a useful public
              benchmark because it shows how much capital and patience public markets may tolerate for a delivery-robot
              company before mature economics appear, but it cannot substitute for Starship's own numbers. As a result,
              the correct underwriting stance today is not skepticism about whether Starship can generate value, but
