        - ~$0.42-$0.44B market cap; ~$0.20B EV
        - Closest listed sidewalk robot comparable
        - Tiny revenue, heavy losses, and large cash balance distort direct comparisons
      - - Serve 2026E consensus
        - Forward revenue expectation
        - ~$26M 2026E revenue; ~200%+ growth into 2027
        - Illustrates how far ahead public comps price future wins
        - Forecast-based and extremely sentiment-sensitive
      - - Nuro Apr 2025 Series E
        - Private autonomy comp
        - $6B, down from $8.6B in 2021
        - Shows that later-stage autonomy capital still exists but reprices on strategy changes
        - Business model is on-road autonomy licensing, not sidewalk delivery
    notes: >-
      The comparable set is intentionally milestone-based, not exhaustive, because the pure-play sidewalk-delivery peer
      set is extremely thin.
