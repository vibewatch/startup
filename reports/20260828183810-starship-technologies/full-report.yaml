  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure remains the primary external risk cluster
        blocks:
          - type: paragraph
            body: >-
              Starship has unusually strong early proof that it can win legal room to operate: Virginia remains a
              landmark example where the company worked with lawmakers to establish a statewide framework for personal
              delivery devices. That framework is helpful because it clarifies robot rights, speed limits, braking and
              operator-identification requirements, and minimum liability insurance. But the same evidence also shows
              why legal victory does not equal frictionless scaling. Alexandria and Arlington still channel complaints,
              pilot conditions, and local safety expectations; Next City documents municipal contracts that add fees and
              ADA or geofencing penalties; and Supply Chain Dive shows that state-by-state rules differ materially
              enough to create a real compliance tax. The result is that Starship's regulatory moat is mixed. Experience
              matters, but every new geography still carries fresh legal drafting, local diplomacy, and enforcement
              risk. Investors should therefore treat policy execution as an ongoing operating function rather than a
              one-time hurdle the company has already cleared.
