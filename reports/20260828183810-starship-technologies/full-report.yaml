  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: hyperlocal delivery, not all of logistics'
        blocks:
          - type: paragraph
            body: >-
              Starship's market has to be bounded tightly or the analysis becomes meaningless. The company is not
              competing for all last-mile logistics spend, all grocery e-commerce GMV, or the full autonomous-robotics
              market. Its actual domain is hyperlocal delivery on sidewalks and other pedestrian-priority surfaces where
              a small robot can move food, groceries, parcels, or internal-site goods at walking speed. That means the
              directly relevant market includes retailer-funded grocery runs, delivery-app meal and convenience orders,
              campus dining deliveries, and certain industrial-site movements. It excludes road robotaxis, warehouse
              AMRs, and most freight autonomy even though those categories use related robotics and AI language. This
              boundary matters because Starship's strongest evidence comes from dense short-radius routes, especially
              grocery and campus environments, not from heavy payload, long distance, or road-certified autonomy. The
              right status-quo substitutes are human couriers, self-pickup by car, or internal staff runners — not broad
              national parcel networks.
