        title: 'Direct peers: Starship versus Serve, Kiwibot, and adjacent Nuro'
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes Serve Robotics the cleanest like-for-like comparator, even though it is smaller and
              more U.S.-restaurant-centric than Starship. Serve's public materials describe more than 2,000 robots,
              4,000-plus restaurants, and broad restaurant delivery relationships; Starship cites more than 3,000
              robots, 10 million deliveries, and operations across eight countries. Kiwibot, now marketed through
              Robot.com, still matters as a campus and low-speed-delivery peer, but its public narrative has broadened
              into other robot forms, which makes its current competitive posture less focused than Starship's. Nuro
              deserves attention but for a different reason. Its product has shifted toward road autonomy licensing, not
              a direct contest for Starship's current grocery-centered sidewalk deployments. In that sense, Nuro is more
              informative as a capital-intensity warning and future adjacent threat than as a daily direct competitor in
              Starship's current sales motion.
