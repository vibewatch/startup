              - CV038
              - CV039
              - CV040
              - CV041
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The company may deserve admiration before it deserves the price
            body: >-
              Starship's operating proof is better than most robotics startups ever achieve. The reason this chapter
              does not say 'buy' is not that the company looks weak — it is that current public evidence does not prove
              enough incremental upside at the old unicorn mark.
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV025
              - CV032
