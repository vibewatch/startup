        title: 'Customer segmentation: grocery, apps, campuses, and industrial channels'
        blocks:
          - type: paragraph
            body: >-
              Starship's customer base is multi-layered. At the institutional level, the company sells into grocery
              retailers, delivery-app ecosystems, universities and foodservice operators, and some industrial sites. At
              the user level, the product serves grocery shoppers, students, faculty, staff, and urban food-delivery
              customers. The payer can vary by segment: a grocer may subsidize the service as part of last-mile
              economics; a student may pay with dining dollars plus a delivery fee; and a campus or app partner may
              control the ordering surface while Starship provides the delivery layer. This segmentation matters because
              Starship's product is not bought and used the same way everywhere. The grocery customer story is
              retailer-led and logistics-driven. The campus customer story is a B2B2C convenience product embedded
              inside meal-plan and campus-dining flows. The app-partner story depends more on channel integration than
              on Starship's own brand.
