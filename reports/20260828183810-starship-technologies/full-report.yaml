      - number: '8.4'
        title: Scenario and sensitivity work show why the call is not an obvious buy
        blocks:
          - type: paragraph
            body: >-
              Once the analysis is made explicitly price-sensitive, the recommendation becomes clearer. A $1.2 billion
              entry does not look wildly wrong, but it also does not offer much cushion without stronger disclosure. The
              base case is therefore not an upside story; it is a question of whether public evidence merely supports
              the prior mark. On comp-style math, the most useful exercise is to ask what revenue Starship would need at
              different EV/Sales levels to justify $1.2 billion. Even using a generous public comp multiple comparable
              to Serve, the company would still need roughly $46 million of annual revenue, and lower multiples quickly
              push the required revenue far higher. That does not prove Starship cannot meet the bar. It proves that
              investors are currently being asked to infer the answer. In the bull case, Starship converts new grocers
              and discloses metrics that prove the grocery pivot compounds. In the bear case, it needs more capital
              before that evidence arrives. The limited base-case margin of safety is why the chapter lands on
              research-more, not buy.
            claimRefs:
              - CV018
              - CV019
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
