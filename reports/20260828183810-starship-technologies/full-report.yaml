      - number: '8.3'
        title: Comparable analysis points to caution, not to a free pass
        blocks:
          - type: paragraph
            body: >-
              Serve Robotics is the most useful public comparable not because it is identical, but because it shows how
              public markets currently price a listed sidewalk-delivery robot operator with modest revenue, heavy
              losses, and high future expectations. Serve's equity value in late August 2026 sits well below Starship's
              last explicit $1.2 billion private mark, and even its enterprise value is lower still because so much of
              the balance sheet is cash. That does not mean Starship should trade like Serve one-for-one: Starship has
              more deliveries, broader international deployment, and better grocery proof. But it does mean the burden
              of proof is high. Public markets are willing to assign aggressive multiples to autonomy platforms, yet
              those same markets also tolerate violent volatility and quick multiple compression. Nuro's down round adds
              a useful cross-check: even respected autonomy names can be repriced when commercialization takes longer or
              the story changes. The lesson is that comparables support a premium case, but not an unquestioned one.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
