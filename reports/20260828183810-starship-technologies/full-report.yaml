            body: >-
              The public record supports a modular view of Starship's technology. At the hardware layer sits a compact
              six-wheeled robot with insulated cargo space sized for small baskets. Above that is a perception layer
              built from cameras, radars, ultrasonic sensing, time-of-flight components, and neural-network inference.
              Then comes navigation and route logic for sidewalks, road crossings, curb handling, and obstacle
              avoidance. Around those sits a wider operating architecture that includes mapping, partner integrations,
              remote oversight for rare edge cases, and local field support. This architecture matters because
              Starship's advantage does not appear to come from one magic sensor. It comes from how the stack has been
              tuned across millions of real deliveries. The software, maps, operating playbooks, and customer-hand-off
