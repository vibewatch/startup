            body: >-
              The most durable competitor takeaways for the rest of the report are fourfold. First, Starship has
              meaningful public scale proof versus private peers. Second, Serve is the cleanest public comp because it
              shares the operating domain and discloses economic information, even if its footprint is smaller. Third,
              distribution power from platforms like Uber and DoorDash is a central strategic variable that could either
              accelerate Starship through partnership or compress its role through disintermediation. Fourth, category
              volatility is not hypothetical: competitors have restructured, pivoted, or broadened scope in ways that
