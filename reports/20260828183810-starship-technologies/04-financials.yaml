  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Current cash and runway
    missingEvidence: Starship does not disclose current cash balance, burn rate, runway, or next-round
      trigger in retained public evidence.
    whyItMatters: Capital adequacy is the central financial underwriting question for a hardware-heavy
      network business.
    diligencePath: Request latest monthly cash forecast, board budget, and financing contingency plan.
    relatedQuestionRefs:
    - QI016
    - QI025
  - type: private-evidence-only
    severity: material
    topic: Segment-level unit economics
    missingEvidence: No public source separates revenue, contribution margin, or maintenance burden across
      grocery, campus, apps, and industrial use cases.
    whyItMatters: The 2026 pivot implicitly claims grocery economics are stronger, but public evidence
      cannot quantify the gap. Public delivery counts also cannot be translated into revenue without mix
      and pricing data.
    diligencePath: Request quarterly segment P&Ls with orders, revenue, contribution margin, and robot
      utilization by vertical.
    relatedQuestionRefs:
    - QI012
    - QI019
    - QI021
  - type: private-evidence-only
    severity: medium
    topic: Revenue recognition and contract structure
    missingEvidence: Public sources do not explain whether Starship books gross or net revenue across
      partner channels, or how setup fees, delivery fees, and service terms are recognized.
    whyItMatters: Revenue multiples and gross-margin comparisons are unreliable without understanding
      what counts as revenue.
    diligencePath: Review sample contracts and accounting policy memo covering partner billing, end-user
      fees, and implementation services.
    relatedQuestionRefs:
    - QI003
    - QI023
