  - - 2022 funding burst
    - $100M in 30 days including $42M Series B and announced EIB support
    - Historical, verified by company
    - Rapid capital infusion matched delivery growth and new-city expansion
    - Separate equity from quasi-debt economics and covenant burden
  - - EIB quasi-equity facility
    - €50M
    - Historical, verified by company
    - Suggests institutional capital was needed for R&D and robot buildout
    - Disclose draw schedule, repayment terms, and covenants
  - - 2024 equity raise
    - $90M; total raised $230M
    - Verified by official and independent press
    - Capital funded global expansion and DaaS buildout
    - Show how much 2024 capital remained entering 2025
  - - 2025 Series C
    - $50M; total funding >$280M
    - Verified by company
    - Further supports ongoing financing dependence during growth
    - Disclose 2025 post-money valuation, preference stack, and use of proceeds
  - - Current cash / runway
    - Null public disclosure
    - Unavailable
    - Largest single capital adequacy blocker
    - Provide cash, burn, runway, and financing plan
  - - 'Public comp reference: Serve liquidity'
    - $79.1M cash + $156.3M short-term securities at 2026-06-30
    - Verified by filing
    - Shows how much capital public peers can hold before economics mature
    - Benchmark Starship's needed liquidity against Serve and internal plan
  notes: This table focuses on forward capital adequacy rather than re-telling every round in full detail.
