- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Annual revenue by year and segment
    - Cannot value Starship on revenue multiples with confidence
    - Request audited or board-ready revenue breakdown by vertical and geography
  - - Gross margin dollars and percentages
    - Positive gross-margin claims cannot be tested
    - Request gross margin bridge from order economics to reported margin
  - - Cash balance, burn, and runway
    - Current financing dependence cannot be underwritten
    - Request latest balance sheet, cash forecast, and next-round trigger
  - - Utilization / orders per robot day
    - Fleet economics and payback remain opaque
    - Request utilization cohorts by city, weather, and partner type
  - - Maintenance and intervention cost
    - Labor and service burden remain unbounded
    - Request maintenance labor, parts expense, and intervention rates
  - - Customer concentration and contract duration
    - Revenue durability cannot be judged
    - Request top-customer concentration, term lengths, and renewal schedules
  - - 'Segment-level economics: grocery vs campus vs apps'
    - Strategic pivot cannot be fully validated
    - Request contribution margin and CAC/payback by segment
  notes: These are the minimum private metrics required before a real investment underwriting call would
    be credible.
