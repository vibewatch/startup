    - Lower than human equivalent; grocery $3-4 lower per delivery
    - Medium
    - Core margin thesis for adoption
    - Provide audited before/after delivery-cost studies by city and vertical
  - - Gross margin status
    - Positive gross margins claimed; profitable in several locations claimed
    - Low-Medium
    - Separates attractive pilots from scalable business
    - Disclose gross margin by segment and corporate gross margin bridge
  - - Consumer delivery fee
    - Historically about $1.99 or less in some campus deployments
    - Low-Medium
    - Helps frame consumer willingness to pay
    - Show current fees by geography and attach rate
  - - Robot battery / operating window
    - 18 hours on a single charge
    - Medium
    - Utilization and downtime affect order economics
    - Provide average orders per robot day and charging downtime
  - - Intervention rate
    - 'Null'
    - Low
    - Directly affects labor cost and trust
    - Provide intervention per 100 deliveries by city/weather
  - - Maintenance cost per robot
    - 'Null'
    - Low
    - Key determinant of fleet economics
    - Provide maintenance labor, parts, and swap rates
  - - Utilization per robot per day
    - Null publicly, but one 2023 PR cites 24 deliveries in 16 hours as a record
    - Low
    - Density and payback depend on throughput
    - Provide p50/p90 utilization by segment
  - - Contribution margin by segment
    - 'Null'
    - Low
    - Determines whether grocery truly dominates campus financially
    - Provide contribution margin by grocery, campus, app, and industrial cohorts
