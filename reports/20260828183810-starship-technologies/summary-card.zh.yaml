  topStrengths:
    - Starship 拿出了机器人行业少见的真实部署证据：配送量超过 10 million、机器人超过 3,000 台，并在多国运营。
    - 芬兰和 S Group 提供了最清晰的公开证据之一：人行道机器人能跑出重复的生鲜杂货密度，而不是停留在试点表演。
    - 许多自动驾驶同行收缩时，公司到 2025 年仍能持续融资，显示投资人对平台的信心有韧性。
  topRisks:
    - 收入、毛利率、贡献利润率、烧钱速度和客户集中度基本仍未公开披露。
    - 美国校园业务收缩后，战略更集中于生鲜杂货，也提高了公司对生鲜杂货转化成功的依赖。
    - 在公共空间部署硬件，仍暴露于监管、法律、安全、破坏和运营风险。
    - 若要显著高于上一次明确估值标记出价，就必须相信其经济性和条款；但公开记录仍没有给出这些证据。
  unresolvedGaps:
    - 按地区和客户拆分的收入，以及按生鲜杂货市场拆分的毛利率和贡献利润率。
    - 2025 年融资轮定价、清算优先权、同比例跟投权和其他实际进入条款细节。
    - 退出校园业务后的具名美国生鲜杂货客户、铺开时间表、已承诺机器人数量和合同保护。
    - 当前烧钱速度、现金跑道，以及芬兰式单位经济性能否复制到最强参考市场之外的证据。
