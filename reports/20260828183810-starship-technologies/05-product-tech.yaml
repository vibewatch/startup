company:
  name: Starship Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Starship's product is a managed autonomous delivery system rather than merely a sidewalk robot SKU.
    Public evidence strongly supports a compact hardware platform combined with sensor fusion, route intelligence,
    partner integrations, charging infrastructure, and field-operations support — all tuned through millions
    of real deliveries. The company looks strongest on operating maturity, winter adaptation, and partner
    readiness; weaker on public disclosure of manufacturing depth, formal security or certification controls,
    and hard operational reliability metrics such as intervention or maintenance rates.
sections:
- id: product-definition
  title: 'Product definition: a delivery operating system wrapped around a sidewalk robot'
  body: >-
    Starship's product should not be reduced to a cute six-wheeled vehicle. In customer workflow terms,
    the product is a managed local-delivery system: the partner exposes ordering, Starship dispatches
    and navigates the fleet, the robot completes the last hundred meters to a few miles, the customer
    tracks arrival and unlocks the compartment, and local support handles exceptions. That is why the
    company can sell into grocery retailers, delivery apps, campuses, and industrial sites without changing
    the core service concept. The robot is the visible asset, but the product promise is reliable, low-friction
    delivery in environments where a human courier is either too expensive or operationally awkward. Starship
    also explicitly positions robots as part of a multi-modal delivery stack rather than as a universal
    substitute for all couriers, which is a more credible product framing than claiming robotics alone
    can solve every local-delivery use case.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE034
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: modules-and-architecture
  title: Modules and architecture
  body: >-
    The public record supports a modular view of Starship's technology. At the hardware layer sits a compact
    six-wheeled robot with insulated cargo space sized for small baskets. Above that is a perception layer
    built from cameras, radars, ultrasonic sensing, time-of-flight components, and neural-network inference.
    Then comes navigation and route logic for sidewalks, road crossings, curb handling, and obstacle avoidance.
    Around those sits a wider operating architecture that includes mapping, partner integrations, remote
    oversight for rare edge cases, and local field support. This architecture matters because Starship's
    advantage does not appear to come from one magic sensor. It comes from how the stack has been tuned
    across millions of real deliveries. The software, maps, operating playbooks, and customer-hand-off
    flow are therefore as important as the robot hardware itself.
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE032
