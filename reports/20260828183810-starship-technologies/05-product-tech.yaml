- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Sensor fusion
    - Detect obstacles, people, vehicles, and environment
    - Cameras, radar, ultrasonic, TOF
    - Sensor failure or misclassification in edge cases
  - - Navigation logic
    - Plan routes, stop, reroute, cross roads, climb curbs
    - Map quality and local sidewalk conditions
    - Obstacle-rich environments reduce reliability
  - - Remote oversight
    - Handle rare exceptions and safety monitoring
    - Reliable connectivity and trained operators
    - Labor intensity or response lag in edge cases
  - - Area mapping
    - Prepare service zones for live deployment
    - Local surveying and data upkeep
    - New-area rollout remains human-dependent
  - - Charging infrastructure
    - Keep fleets available and improve utilization
    - Site access, power, wireless charging hardware
    - Charger outages or insufficient charging density
  - - Partner app integration
    - Expose robot delivery inside existing demand surfaces
    - Retailer/platform APIs and workflows
    - Weak integration can block adoption regardless of robot quality
  notes: This table highlights that Starship's operating architecture is a chain of technical and operational
    dependencies, not a stand-alone robot artifact.
