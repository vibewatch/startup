  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Manufacturing and supply-chain moat
    missingEvidence: Public sources do not identify key suppliers, production throughput, facility output,
      or inventory strategy for robot manufacturing.
    whyItMatters: Without supplier and throughput visibility, investors cannot judge whether Starship's
      hardware can scale economically or whether component bottlenecks create hidden fragility.
    diligencePath: Request manufacturing footprint, key-component concentration, annual build capacity,
      and contract-manufacturing arrangements.
    relatedQuestionRefs:
    - QE016
  - type: missing-source
    severity: material
    topic: Formal security and software assurance
    missingEvidence: Retained public evidence lacks clear named security standards, release-governance
      process, incident-rate disclosure, and independent assurance artifacts.
    whyItMatters: A public-space robotics fleet accumulates legal and reputational risk if safety or software
      controls are weak or under-documented.
    diligencePath: Request security program overview, SDLC controls, release sign-off process, penetration
      testing, and incident reporting metrics.
    relatedQuestionRefs:
    - QE021
    - QE025
  - type: private-evidence-only
    severity: medium
