- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Starship solution
  - Measurable benefit
  - Limitation
  rows:
  - - Top-up grocery delivery
    - Short local basket would otherwise use courier or car trip
    - Robot picks up from nearby store and delivers to doorstep
    - Lower delivery cost and short ETA potential
    - Limited basket size and geography
  - - On-campus meal delivery
    - Student walks or waits for campus runner
    - Robot carries meal to dorm, class area, or library
    - Convenience, accessibility, and time saved
    - Seasonality and campus-specific economics
  - - Restaurant / convenience app order
    - Platform dispatches courier
    - Robot inserted into multimodal app-driven fleet
    - Potentially cheaper short-radius fulfillment
    - Requires partner integration and supportive sidewalks
  - - Industrial-site internal transport
    - Staff manually move supplies or mail
    - Robot handles repetitive internal site runs
    - Labor time saved on low-value trips
    - Different environment and budget owner than consumer delivery
  - - Late-night or poor-weather access
    - User may skip order or face awkward pickup trip
    - Robot provides contactless, trackable delivery
    - Improves access and perceived safety in some contexts
    - Weather resilience still bounded by local conditions
  notes: Benefits are grounded in cited use cases and customer-proof sources rather than theoretical robotics
    claims.
