- id: deployment-reliability-roadmap
  title: Deployment, reliability, and roadmap clues
  body: >-
    Starship's public operating evidence is unusually rich for a private robotics company. The company
    documents commercial use in multiple countries, 125,000 daily crossings, urban pilots, app integrations,
    and years of campus operations. George Mason provides concrete proof that wireless charging and denser
    merchant networks can improve site-level maturity over time. Finland adds a second, more technically
    interesting proof point: winter tyres, snow-aware routing, snow-pile detection, and integrated battery-heating
    development all suggest that Starship has moved beyond fair-weather demos. Public roadmap clues are
    still indirect, but they are real. The company keeps pointing toward broader grocery deployment, more
    urban rollouts, more automation around charging, and hardware or software improvements for winter
    performance. Hiring for area mapping and data work also implies that deployment quality and local
    route intelligence remain active areas of iteration.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE030
  - CE031
  - CE033
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: differentiation-and-dependencies
  title: Differentiation and dependency map
  body: >-
    Starship's strongest differentiation is evidence-backed operating maturity. Millions of deliveries,
    years of Level 4 deployment claims, and public proof across snow, sidewalks, campuses, and grocery
    contexts create a defensible product story that many robotics companies cannot match publicly. Just
    as important, the product includes partner readiness: integrations into retailer or app workflows,
    area mapping, charging infrastructure, and local field-support loops. That said, the company looks
    much stronger on operations moat than on manufacturing moat. Public materials do not disclose supplier
    depth, component concentration, or production throughput in a way that would prove a hard manufacturing
    barrier. The core dependencies are therefore wide: regulators, accessible sidewalks, local communities,
    app partners, field technicians, chargers, and weather-adaptation capability. Underwriting the product
    as mere hardware would miss the point, but underwriting it as dependency-free software would be equally
    wrong.
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE030
  - CE032
  - CE035
  - CE037
  tableRefs:
  - TE003
- id: trust-safety-privacy
  title: Trust, safety, privacy, and unresolved control gaps
  body: >-
    Trust evidence is mixed but meaningful. On the positive side, Starship provides clear privacy language
    saying robot cameras are for navigation rather than identity capture, and it has published accessibility-oriented
    material including the Guide Dogs pilot. Those sources make the company look more intentional about
    public coexistence than many peers. On the negative side, the public record still lacks the kind of
    formal compliance package that enterprise investors often want to see: named security standards, release-governance
    detail, intervention-rate disclosure, or comprehensive incident metrics. Adverse reporting also matters
    here. A real injury lawsuit and Sheffield vandalism illustrate that public-space robotics creates
    not only technical edge cases but also legal and community-risk exposure. The right diligence conclusion
    is that Starship appears advanced on real-world behavioral safety and accessibility learning, but
    still under-documented on formal assurance frameworks and operational risk metrics.
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE036
  - CE037
  tableRefs:
  - TE004
