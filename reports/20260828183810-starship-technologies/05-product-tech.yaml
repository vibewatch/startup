  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Robot hardware platform
    - End customer / field ops
    - Commercial and mature
    - Compact form factor, insulated cargo, curb handling
    - Supplier base and manufacturing throughput not disclosed
  - - Perception and autonomy stack
    - Fleet ops / safety systems
    - Commercial and iterated at scale
    - 12 cameras plus radar/ultrasonic/TOF and L4 claims
    - Intervention rates and model-validation process undisclosed
  - - Routing and mapping layer
    - Area mappers / fleet ops
    - Commercial, evidently evolving
    - Supports sidewalks, crossings, snow-aware routing and service-area rollout
    - No map-refresh cadence or tooling detail disclosed
  - - Charging infrastructure
    - Fleet ops / site hosts
    - Commercial in some sites
    - Wireless charging is publicly claimed as a first-of-its-kind deployment tool
    - Charger uptime and economics not disclosed
  - - Partner integration layer
    - Retailers / apps / campuses
    - Commercial
    - Integrates into existing ordering surfaces in weeks
    - API depth, uptime SLAs, and data-sharing terms undisclosed
  - - Field-support / live-ops system
    - Technicians / operations teams
    - Commercial
    - Bridges rare exceptions and deployment realities
    - Headcount intensity and support cost per robot undisclosed
  notes: The product is decomposed into visible hardware and less-visible operating-system layers because
    buyer value depends on both.
