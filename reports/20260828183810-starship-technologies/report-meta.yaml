subtitle: Sidewalk-robotics category leader with real grocery proof, but still short of fully underwritten price support above its last explicit unicorn mark
coverageNotes: >-
  Public evidence through 2026-08-28 supports Starship's leadership in deployed sidewalk robotics,
  its Finland grocery proof point, and its ability to keep attracting capital. The same public record
  still leaves material blind spots around revenue, gross margin, contribution margin, burn, contract
  concentration, and the actual pricing and preference terms of the 2025 extension round. As a result,
  this report can support a quality judgment and a price-sensitive range, but not a fully underwritten
  valuation call based on audited financial disclosure.
