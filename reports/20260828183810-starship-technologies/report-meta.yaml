companyProfile:
  summary: >-
    Starship Technologies is an Estonian-founded autonomous delivery robotics company that operates a
    managed last-mile platform built around small six-wheeled sidewalk robots. Public evidence shows
    a rare combination of technical longevity, multi-country operations, and real customer proof, with
    Finland grocery delivery emerging as the strongest validation of repeatable density economics. The
    company has outlived many delivery-robot peers and kept funding access open, but it remains a
    private company with limited public financial disclosure, so investors can see operating quality far
    more clearly than they can see revenue quality or valuation support.
  foundedDate: '2014-07-03'
  founders:
    - name: Ahti Heinla
      role: Co-founder and current CEO
      background: Skype co-founder and original technical architect behind Starship's autonomy push.
      claimRefs: [CO001, CO011]
    - name: Janus Friis
      role: Co-founder
      background: Skype co-founder associated with Starship's original founding team.
      claimRefs: [CO001]
  foundingLocation: Tallinn, Estonia
  headquarters: San Francisco, California, with engineering anchored in Tallinn
  productSummary: >-
    Starship sells a robot-enabled local delivery service for groceries, meals, packages, and selected
    industrial or campus use cases, combining Level 4 sidewalk autonomy with remote support, charging,
    routing software, and partner integrations.
  customerFocus: Grocery retailers, delivery platforms, universities, and selected enterprise sites needing short-radius autonomous delivery.
  businessModel: >-
    The company monetizes autonomous last-mile delivery through per-delivery and enterprise-partnership
    economics, supplying robot infrastructure and operating software to named retailers, platforms, and
    institutions.
  stage: Late-stage private / Series C extension-backed
  fundingStatus: >-
    Starship publicly confirmed a $90 million round in February 2024 and a further $50 million Series C
    extension in October 2025, taking disclosed lifetime funding above $280 million, but it has not
    publicly confirmed a post-money valuation for either round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO006, CO023, CO030, CV002, CV003, CV006, CV007]
summary:
  headline: >-
    Starship looks like the strongest scaled sidewalk-robotics company in public view, but incomplete
    revenue and term disclosure keep the current case in research-more territory rather than buy territory
    at or above the last explicit $1.2 billion mark.
