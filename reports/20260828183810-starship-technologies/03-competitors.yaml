- id: moat-durability
  title: 'Moat durability: operating proof is real, but commoditization risk is also real'
  body: >-
    Starship's moat looks strongest in accumulated operating proof rather than in any single hardware
    feature. Millions of deliveries, thousands of robots, repeated public-right-of-way interactions, and
    cross-country deployment history create a body of safety, mapping, operations, and partner-learning
    data that late entrants do not yet match publicly. The company's explicit accessibility and pedestrian-trust
    posture may also help it win permits and enterprise comfort faster than rivals with less visible public-safety
    messaging. But the adverse case remains material. Sensors, compute, and robot manufacturing are not
    inherently proprietary enough to stop well-funded entrants forever, especially when platforms or large
    retailers can sponsor alternatives. Public category history — Nuro's layoffs and pivot, the rise of
    app-backed experiments, and imperfect public-market economics among peers — argues for underwriting
    Starship as a likely category leader with meaningful execution advantage, not as an unassailable monopoly.
    The thesis holds best if Starship remains the easiest, safest, and fastest partner to deploy at scale.
  claimRefs:
  - CP020
  - CP021
  - CP022
  - CP023
