company:
  name: Starship Technologies
chapter:
  number: 3
  title: Competitors
  summary: >-
    Starship competes in a layered field that includes direct sidewalk-robot peers, adjacent autonomy
    players, platform-led entrants, and the persistent substitute of human couriers. Serve Robotics is
    the clearest public direct comparable because it shares the operating domain and discloses economics,
    while Kiwibot remains a relevant but less focused peer and Nuro has shifted into adjacent road-autonomy
    licensing. Starship's public scale proof is strong, but its most credible strategic threat comes from
    distribution power: delivery platforms can multi-home, sponsor internal alternatives, or compress
    robot suppliers into lower-margin roles if Starship's operational advantage is not compelling enough.
sections:
- id: landscape-shape
  title: 'Competitive landscape: more than just other sidewalk robots'
  body: >-
    Starship's competitive field is broader than a short list of delivery-robot startups. The direct peer
    set includes companies trying to automate short-range delivery in human environments, but buyers can
    also solve the same job with human couriers, delivery platforms, internal operational buildout, or
    adjacent autonomy providers that eventually move into delivery. That matters because the company is
    not merely selling a robot; it is selling a safer, lower-cost, operationally repeatable way to complete
    dense local orders. As Starship shifts away from campuses and toward grocery plus app-led delivery,
    the most important competitors become those with retailer distribution, restaurant density, or public-market
    access rather than those with campus novelty alone. Serve is therefore the most useful public direct
    peer, Kiwibot remains a relevant category participant, Nuro has drifted into adjacent autonomy, and
    DoorDash or Uber-linked ecosystems represent distribution-led entrants that could alter category structure
    quickly.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP006
  - CP008
  - CP011
  - CP012
  - CP036
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: peer-profiles
  title: 'Direct peers: Starship versus Serve, Kiwibot, and adjacent Nuro'
  body: >-
    Public evidence makes Serve Robotics the cleanest like-for-like comparator, even though it is smaller
    and more U.S.-restaurant-centric than Starship. Serve's public materials describe more than 2,000
    robots, 4,000-plus restaurants, and broad restaurant delivery relationships; Starship cites more than
    3,000 robots, 10 million deliveries, and operations across eight countries. Kiwibot, now marketed
    through Robot.com, still matters as a campus and low-speed-delivery peer, but its public narrative
    has broadened into other robot forms, which makes its current competitive posture less focused than
    Starship's. Nuro deserves attention but for a different reason. Its product has shifted toward road
    autonomy licensing, not a direct contest for Starship's current grocery-centered sidewalk deployments.
    In that sense, Nuro is more informative as a capital-intensity warning and future adjacent threat
    than as a daily direct competitor in Starship's current sales motion.
  claimRefs:
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
  - CP009
  - CP010
  - CP019
  - CP030
