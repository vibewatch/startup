- id: what-matters-for-underwriting
  title: What later chapters should carry forward
  body: >-
    The most durable competitor takeaways for the rest of the report are fourfold. First, Starship has
    meaningful public scale proof versus private peers. Second, Serve is the cleanest public comp because
    it shares the operating domain and discloses economic information, even if its footprint is smaller.
    Third, distribution power from platforms like Uber and DoorDash is a central strategic variable that
    could either accelerate Starship through partnership or compress its role through disintermediation.
    Fourth, category volatility is not hypothetical: competitors have restructured, pivoted, or broadened
    scope in ways that highlight how hard it is to scale autonomy commercially. What remains soft is exact
    contract economics, win rates, and renewal dynamics. Those gaps should temper any attempt to infer
    pricing power or customer lock-in from public evidence alone.
  claimRefs:
  - CP018
  - CP019
  - CP031
  - CP032
  - CP033
  - CP038
