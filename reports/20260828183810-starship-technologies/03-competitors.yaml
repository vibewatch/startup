- id: distribution-and-substitutes
  title: Distribution power, substitutes, and packaging matter as much as autonomy
  body: >-
    Competitive advantage in this category is not purely technical. Whoever owns the order surface, merchant
    network, local permits, and live-operations muscle often controls the sale. Starship's own partnerships
    with Uber Eats and foodora show that management appears to understand this, because plugging into
    existing platforms is often more valuable than forcing users into a stand-alone robotics app. That
    same logic creates threat vectors. DoorDash-backed robotics experiments and Uber's expanding AV partnership
    web mean large platforms can multi-home across suppliers, pressure margins, or eventually favor internal
    alternatives. The status quo also remains strong: human couriers can handle larger baskets, cross
    the street without political controversy, and go wherever sidewalks or regulations are weak. Public
    pricing is scarce across the entire category, so packaging, reliability, regulatory approval speed,
    and channel access become the buyer-facing proxies for price competition.
  claimRefs:
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
  - CP016
