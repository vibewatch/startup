- id: SO002
  title: Leadership evolution and founder-led control
  body: >-
    Leadership history matters because Starship's public story has repeatedly shifted between founder-led
    and operator-led phases. Lex Bayer joined as CEO in 2018 from Airbnb just as the company moved from
    pilots toward commercial rollout, which signaled a need for business-building discipline alongside
    engineering credibility. In 2021 Starship recruited Alastair Westgarth from Alphabet's Loon, and official
    releases described Heinla stepping back into a CTO role while Westgarth scaled the business globally.
    Yet by early 2024 TechCrunch reported that Heinla had quietly been reinstated as CEO, and subsequent
    2024, 2025, and 2026 Starship releases all describe him as co-founder and CEO. That arc suggests the
    company returned to founder control after the previous scaling phase, likely because investors and
    management concluded the next chapter required tighter alignment between technical roadmap, deployment
    economics, and capital allocation. The current public bench visible on the About page shows a fuller
    operating team around Heinla, but detailed board composition and governance rights remain undisclosed
    in public materials.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO040
  tableRefs:
  - TO002
- id: SO003
  title: Funding history and capital structure that are actually public
  body: >-
    Starship has raised meaningful capital over a long period, but the public record is still thinner
    than many later-stage private robotics companies. The disclosed path begins with a $17.2 million seed
    round in January 2017, then a $25 million top-up in June 2018, followed by a $40 million Series A
    in August 2019 that explicitly financed campus expansion. In 2022 the company layered a €50 million
    quasi-equity EIB facility onto a new $42 million Series B, taking disclosed funding to $202 million
    and tying part of the capital to European R&D and manufacturing expansion. The February 2024 round
    added another $90 million and brought disclosed capital to $230 million; TechCrunch confirmed that
    valuation was not disclosed. The October 2025 round added $50 million more and pushed disclosed capital
    above $280 million, again without a public valuation. That leaves investors with a usable funding
    chronology but an incomplete view of ownership dilution, liquidation preferences, secondary transactions,
    debt covenants, and current cash runway.
  claimRefs:
  - CO013
  - CO015
  - CO016
  - CO017
  - CO018
  - CO020
  - CO021
  - CO023
  - CO040
