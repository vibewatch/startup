- calloutType: strength
  title: Real-world deployment evidence is the chapter's strongest fact pattern
  body: Starship's 10-million-delivery milestone, Finland grocery scale, and George Mason longevity are
    unusually concrete for a private robotics company. That does not prove attractive economics, but it
    does prove the company cleared many commercialization hurdles that stopped peers.
  claimRefs:
  - CO025
  - CO028
  - CO031
- calloutType: risk
  title: Disclosure quality is still too weak for a clean late-stage underwriting view
  body: Funding history is usable, but valuation, revenue, runway, board composition, and current margin
    data remain undisclosed. The report should therefore treat Starship as a high-evidence operating story
    paired with a medium-evidence financial story.
