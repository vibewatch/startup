company:
  name: Starship Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Starship Technologies is a founder-led autonomous delivery robot company founded in 2014 that has
    built the deepest public deployment record in sidewalk robotics: more than 10 million deliveries,
    over 3,000 robots, and 300-plus locations across eight countries. The company has disclosed more than
    $280 million of capital raised through October 2025 and has shifted from its historic US campus base
    toward urban grocery and app-integrated city delivery. The strongest evidence is operational scale;
    the weakest evidence remains valuation, revenue, governance, and independently verified unit economics.
sections:
- id: SO001
  title: Identity, roots, and current operating footprint
  body: >-
    Starship Technologies is an Estonian-founded autonomous delivery company that now presents itself
    as the global leader in sidewalk robotics for last-mile logistics. Official company materials and
    early funding announcements consistently date the founding to July 2014 and tie the venture to Skype
    co-founders Ahti Heinla and Janus Friis. The company's business headquarters are in San Francisco,
    while engineering remains anchored in Tallinn and the company says R&D is based in Helsinki. The product
    scope is now broader than a campus novelty: Starship sells a managed delivery service for groceries,
    restaurant meals, packages, and industrial supplies. Its core physical asset is a six-wheeled delivery
    robot that carries up to three bags, uses a twelve-camera sensor suite plus radar and ultrasonic sensing,
    and operates at Level 4 autonomy with remote human support available when needed. By the 2026 run
    date, Starship is claiming more than 3,000 robots, 300-plus locations, eight countries, more than
    10 million deliveries, and 125,000 road crossings a day. Those metrics establish real commercial footprint,
    but they remain largely company-reported rather than independently audited.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
