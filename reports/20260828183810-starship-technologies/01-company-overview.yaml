- id: SO005
  title: Adverse signals and the diligence posture inherited by later chapters
  body: >-
    The overview should not confuse scale claims with de-risking. TechCrunch's February 2024 coverage
    already framed Starship as an exception in a sector where sidewalk-robot programs had stalled or shut
    down, which is helpful context but not the same thing as independently verified profitability. Starship's
    own 2026 milestone release argues that grocery deliveries are already $3 to $4 cheaper than rider
    fulfillment, yet public filings or audited financials do not corroborate that statement. Adverse coverage
    in 2026 also shows that physical-world deployment creates legal and community risk even after years
    of learning. Retail Technology Innovation Hub reported an Arizona injury lawsuit and a Sheffield pilot
    pause after vandalism and local friction. These do not erase Starship's operating lead, but they do
    narrow the correct stance for the rest of the report: treat the company as a real category leader
    with unusually strong deployment evidence, while carrying forward unresolved questions on revenue
    quality, valuation, governance transparency, and durability of claimed unit economics.
  claimRefs:
  - CO032
  - CO033
  - CO036
  - CO037
  - CO038
  - CO039
  - CO040
