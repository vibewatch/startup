  topStrengths:
    - >-
      Starship has unusually strong real-world deployment evidence for robotics, including 10 million-plus deliveries,
      3,000-plus robots, and multi-country operations.
    - >-
      Finland and S Group provide one of the clearest public proofs that sidewalk robots can reach repeat grocery
      density rather than remain pilot theater.
    - >-
      The company has continued attracting capital through 2025 while many autonomy peers retrenched, suggesting durable
      investor confidence in the platform.
  topRisks:
    - Revenue, gross margin, contribution margin, burn, and customer concentration remain largely undisclosed publicly.
    - >-
      The strategy has narrowed toward grocery after the U.S. campus wind-down, increasing dependence on successful
      grocery conversion.
    - >-
      Hardware deployment in public space still carries regulatory, legal, safety, vandalism, and operational-risk
      exposure.
    - >-
      Paying materially above the last explicit valuation mark would require trust in economics and terms that the
      public record still does not show.
  unresolvedGaps:
    - Revenue by geography and customer, plus gross and contribution margin by grocery market.
    - 2025 round pricing, liquidation preferences, pro rata rights, and other effective entry-term details.
    - >-
      Named U.S. grocery customers, rollout timing, committed robot counts, and contract protections after the campus
      exit.
    - >-
      Current burn, runway, and evidence that Finland-style unit economics travel outside the strongest reference
      market.
