evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: legal-domicile
    missingEvidence: >-
      Current legal-entity chart, principal registrant, and exact corporate domicile after the U.S. headquarters
      changes.
    whyItMatters: HQ and domicile precision matter for regulatory, tax, and IPO-readiness diligence.
    diligencePath: Request the latest legal-entity org chart and secretary certificate from management.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Post-secondary board composition, protective provisions, and voting-control breakdown.
    whyItMatters: Control rights determine governance quality and investor alignment after the liquidity event.
    diligencePath: Request the current board observer list, shareholder agreement summary, and cap-table control schedule.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Lifetime primary capital raised versus employee or investor secondary liquidity since inception.
    whyItMatters: Secondary-heavy value creation is different from primary-capital-fueled scaling and changes return interpretation.
    diligencePath: Request financing history with primary proceeds, secondary volume, and use-of-funds by transaction.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single dated management-certified headcount figure.
    whyItMatters: >-
      Public sources show >5,000 employees in 2024 and 7k+ on the current site, which is directionally positive but not
      exact.
    diligencePath: Request latest HR headcount by country and employee type.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership table TO002 lacks a public full board register
    missingEvidence: Full board and executive roster with committee assignments.
    whyItMatters: >-
      The leadership table is intentionally partial because public materials emphasize the CEO and a handful of senior
      operators, not full governance coverage.
    diligencePath: Request the current leadership roster and board committee list from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: veeam-specific-sam
    missingEvidence: A clean Veeam-specific SAM split across core backup, SaaS backup, Kubernetes, and channel-led SMB.
    whyItMatters: Headline TAM overstates what Veeam can monetize if workloads or price points differ by segment.
    diligencePath: Request management segmentation of ARR by workload family and customer size.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: hyperscaler substitution
    missingEvidence: Win/loss data against AWS Backup, Azure Backup, and native SaaS retention tools.
    whyItMatters: The key market risk is commoditization at the low end, which public analyst material does not quantify well.
    diligencePath: Request top-50 competitive win/loss logs and churn reasons by workload.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: market-size-boundary
    missingEvidence: One normalized market-sizing methodology across 2023 vendor-revenue and 2025 platform-forecast estimates.
    whyItMatters: Different market-research boundaries can make growth look stronger or weaker than it really is.
    diligencePath: Normalize sources by included workload types, deployments, and service layers before using them in a model.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Public, apples-to-apples realized pricing across Veeam, Rubrik, Commvault, Cohesity, and Druva.
    whyItMatters: Packaging logic is visible, but actual price competitiveness by workload and segment is not.
    diligencePath: Request win/loss pricing sheets, discount bands, and renewal uplifts by segment.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: win-rate-translation
    missingEvidence: Channel-level win rates and attach rates showing how partner reach converts into bookings.
    whyItMatters: A large partner ecosystem is powerful only if it meaningfully drives close rates and expansion.
    diligencePath: Request partner-sourced pipeline, win-rate, and attach-rate dashboards by route to market.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: switching-evidence
    missingEvidence: Independent case studies quantifying full-platform migration costs away from Veeam or toward Veeam.
    whyItMatters: Switching-cost logic is plausible but not well quantified in public sources.
    diligencePath: Request three recent competitive displacement case studies with timeline, labor, and downtime metrics.
    relatedQuestionRefs:
      - QP019
      - QP020
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited income statement, cash-flow statement, and balance sheet.
    whyItMatters: Management metrics are helpful but not enough for public-company-style underwriting.
    diligencePath: Request audited historical financial statements and monthly trailing KPI bridge.
    relatedQuestionRefs:
      - QI017
      - QI023
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: NRR, GRR, and renewal rates by product family and channel.
    whyItMatters: Recurring revenue quality depends on retention durability, not just headline ARR.
    diligencePath: Request cohort retention and expansion deck by workload family.
    relatedQuestionRefs:
      - QI019
  - type: private-evidence-only
    severity: material
    topic: balance-sheet
    missingEvidence: Cash, debt, working capital, and any preferred-equity or debt-service obligations.
    whyItMatters: Capital adequacy cannot be fully judged from EBITDA alone.
    diligencePath: Request latest balance sheet and debt schedule.
    relatedQuestionRefs:
      - QI018
      - QI020
  - type: private-evidence-only
    severity: material
    topic: product-usage-depth
    missingEvidence: Active-usage telemetry by module, not just customer counts or protected users.
    whyItMatters: Breadth matters less than actual module adoption and cross-sell depth.
    diligencePath: Request module attach rates, active admin counts, and restore-event volume by product family.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: platform-cohesion
    missingEvidence: >-
