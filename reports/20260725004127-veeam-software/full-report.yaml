      - number: '8.3'
        title: Scenario analysis frames upside, but comparables still argue against paying any price
        blocks:
          - type: paragraph
            body: >-
              The best valuation frame for Veeam is scenario-based rather than single-point precision. The base case
              assumes the company sustains high-teens growth, keeps EBITDA margins strong, expands SaaS and
              cloud-delivered mix, and progresses toward IPO-grade readiness. That roughly supports the known $15
              billion mark and modest upside into a future public window. The bull case requires evidence that Veeam can
              narrow the narrative gap with faster-growth public peers such as Rubrik while maintaining profitability
              and expanding cloud-first workloads. The bear case assumes multiple compression, weaker-than-expected
              retention, or security incidents that damage trust at the wrong moment. Public comparables help, but each
              has limits: Rubrik carries growth-premium framing and public-market optionality; Commvault is a slower,
              more mature public benchmark; Cohesity/Veritas is private and strategically complex; Dell and IBM are too
              conglomerate-like to be clean comps. As a result, the comp set is informative but not dispositive. The
              disciplined conclusion is that Veeam is a strong business whose future returns are now much more
              price-sensitive than quality-sensitive.
