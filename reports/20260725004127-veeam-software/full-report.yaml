      - number: '3.2'
        title: Capability competition has shifted from core backup to breadth, cloud, and cyber recovery
        blocks:
          - type: paragraph
            body: >-
              Veeam still benefits from broad workload support and strong ransomware-positioning, but capability
              leadership is now specific rather than generic. Virtualization Review’s Gartner-linked summaries say Veeam
              is strongest on ability to execute and strong ransomware defense, while Rubrik wins more vision credit
              with unified cloud administration and identity coverage. Commvault is pushing cloud-native application
              recovery and identity resilience, Cohesity combines recovery orchestration and AI messaging with Veritas
              scale, and Druva leans into operational simplicity as a fully managed service. Dell and IBM are harder to
              dismiss than startup narratives imply because both continue to offer enterprise-scale resilience, object
              storage, and ransomware-relevant tooling inside long-standing infrastructure relationships. Veeam’s own
              product mix—Data Platform, Data Cloud for Microsoft 365, Kasten, Service Provider Console, and Cloud
              Connect—shows that it understands the shift, but Gartner’s 2026 cautions on SaaS breadth and identity
              recovery suggest there are still product gaps that a determined buyer can use to justify a Rubrik, Druva,
              or Commvault shortlist instead.
