  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and current scale are visible at the top line
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence came with the December 2024 secondary. Veeam said it had reached
              $1.7 billion of ARR by September 2024, growing 18% year over year, with 31% growth in software-plus-SaaS
              subscriptions and 30% EBITDA margins. Those are not vague growth-company claims; they are operating
              metrics sophisticated secondary investors use to judge whether a business is approaching public-company
              quality. Earlier data points support the trajectory. In early 2021, Veeam said it had delivered its second
              consecutive year of bookings above $1 billion, grown ARR 22% in 2020, and surpassed 400,000 customers.
              Combined with Gartner-linked market-share data showing $1.5 billion of 2023 revenue and first-place share,
              the public record supports a picture of a company that has scaled from hybrid-cloud backup specialist into
              a broad, highly recurring software vendor. What remains opaque is the exact revenue split across classic
              software, SaaS, maintenance-like elements, professional services, and partner-led service-provider resale
              motion.
