      - number: '1.4'
        title: Market position and the still-open diligence questions
        blocks:
          - type: paragraph
            body: >-
              Veeam now presents itself as the global leader in data resilience rather than simply a backup vendor, and
              third-party market-share messaging supports that repositioning. A 2024 Gartner market-share release cited
              Veeam as the number-one enterprise backup and recovery software vendor with 15.1% share and $1.5 billion
              in 2023 revenue, while later Veeam press releases described a ninth straight 2025 Gartner Magic Quadrant
              leadership position and a tenth year as a leader in the 2026 edition. The company's product pages further
              show the strategic broadening into AI-guided operations, security posture, and portable recovery across
              hybrid and multicloud estates. Even so, several diligence items remain unresolved from public data alone:
              the exact current employee count differs by source and year, the legal-versus-operating headquarters
              wording shifted over time, the board and control map after the 2024 secondary is only partly public, and
              lifetime primary capital raised is not disclosed with the same clarity as valuation marks. Those are
              manageable gaps for a private company of this scale, but they matter if the report is being used to
              underwrite governance quality or IPO readiness rather than simply company quality. Another reason
              disclosure quality matters is that critical vulnerabilities affecting backup infrastructure can become
              business and reputation events quickly.
