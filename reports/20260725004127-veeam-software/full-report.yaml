  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary has expanded from backup and recovery into data protection platforms
        blocks:
          - type: paragraph
            body: >-
              The most important market fact for Veeam is definitional. Gartner and adjacent trade analysis now describe
              the category as backup and data protection platforms rather than just backup and recovery software. That
              shift matters because buyers are no longer procuring point tools simply to restore files after an outage.
              They increasingly expect a platform to orchestrate protection across virtual machines, physical systems,
              object storage, SaaS applications, Kubernetes estates, and cyber recovery workflows. Market commentary in
              2025 and 2026 explicitly ties the category to cyber resilience, AI-assisted operations, data discovery,
              identity recovery, and centralized control planes. Veeam’s own product pages reflect the same expansion,
              with Data Platform, Data Cloud, Microsoft 365 backup, and Kasten for Kubernetes all positioned as parts of
              a broader resilience fabric. The competitive set therefore includes traditional enterprise backup
              incumbents, cloud-native SaaS vendors, DR specialists, and hyperscaler-adjacent protection layers rather
              than only legacy on-prem backup suites.
