      - number: '3.4'
        title: Veeam’s moat is real, but parts of it are under active attack
        blocks:
          - type: paragraph
            body: >-
              Veeam’s moat rests on brand trust, workload breadth, partner reach, and a large installed base, not on the
              absence of competition. Public evidence supports each leg: Gartner-linked market-share leadership,
              550,000-plus customers, a 35,000-plus partner network, and consistent leadership-quadrant placement. But
              those same attributes attract targeted attack vectors. Rubrik is public and growing quickly, giving it
              capital-market credibility and a strong AI-governance narrative. Commvault is no longer a sleepy
              incumbent; it is growing ARR above 20% while generating cash. Cohesity’s Veritas combination created
              immediate scale. Druva keeps pressing the ‘no hardware, no patches’ message against vendors with more
              operational complexity. Even Gartner’s 2026 cautions on Veeam—fragmented management experience, limited
              SaaS application coverage, and slower identity-recovery progress—read like a checklist for how competitors
              will frame Veeam in enterprise deals. The durable conclusion is not that Veeam lacks moat, but that its
              moat is increasingly platform-and-execution based rather than category-default based.
