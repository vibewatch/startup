  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The top risks cluster around security execution, partner opacity, and premium-price expectations
        blocks:
          - type: paragraph
            body: >-
              The most serious risks are not random; they transmit directly into customer trust, growth durability, and
              exit readiness. First, Veeam has repeatedly been affected by high-severity vulnerabilities in backup
              infrastructure that attackers care about precisely because backups are a recovery control plane. CISA,
              NVD, Rapid7, Qualys, CyberCentaurs, and Veeam’s own KB materials make this impossible to ignore. Second,
              the company’s go-to-market model is broad but opaque: public materials show very large channel and
              provider ecosystems, yet they do not disclose top-partner concentration, cohort retention, or
              direct-versus-indirect revenue mix. Third, the private-market price is now high enough that any material
              slip in growth, margin, or IPO readiness could compress valuation. Additional but lower-ranked risks
              include legal and privacy obligations across global operations, management execution risk as the company
              repositions around SaaS resilience, and geopolitical optics from its founding history and changing
              headquarters narrative. None of these risks by itself breaks the company today; taken together, they
              define the diligence agenda.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
