  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape has a clear leadership tier but multiple substitute paths
        blocks:
          - type: paragraph
            body: >-
              The modern competitive field is wider than classic backup-vendor matrices suggested a decade ago.
              Gartner-oriented 2025 and 2026 coverage places Veeam, Rubrik, Commvault, Cohesity, Dell, and Druva in the
              leading cohort, but those firms do not all attack the same demand pocket. Rubrik sells a public-market,
              cyber-resilience and cloud-story premium. Commvault attacks from scaled incumbent credibility with a
              cloud-native, AI-enabled platform and large cash generation. Cohesity, after combining with Veritas, now
              argues for market-share leadership and the broadest workload support. Druva pushes a fully managed SaaS
              posture with no hardware or patching burden. Dell and IBM matter because incumbent infrastructure
              footprints still influence enterprise shortlist formation, while Zerto remains a recovery-first option in
              disaster-recovery-led deals. Acronis is a different but real rival in MSP-heavy and SMB-adjacent segments
              where security-plus-backup bundling matters. The result is a market where Veeam must defend several fronts
              at once rather than simply outrunning one direct peer.
