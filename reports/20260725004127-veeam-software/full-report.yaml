      - number: '2.4'
        title: The category is attractive, but leadership is contested and basic backup is commoditizing
        blocks:
          - type: paragraph
            body: >-
              Veeam’s opportunity exists in a market with real competitive velocity. In Gartner-oriented trade coverage,
              Veeam and Rubrik sit at the top of the 2026 leadership axes, with Commvault, Cohesity, Dell, and Druva
              forming the rest of the upper cohort. But the same sources also make clear that each competitor represents
              a different attack vector on Veeam’s economics. Rubrik is public, fast-growing, and strong in
              cloud/security storytelling; Commvault is cloud-native in control plane and now much larger in ARR than
              many private peers realize; Cohesity’s Veritas combination creates a scale heavyweight; Druva pushes a
              pure SaaS, no-hardware model; IBM and Dell remain sticky in large incumbent accounts; and Zerto remains
              relevant for disaster-recovery-led use cases under HPE. Even Gartner’s 2026 cautions on Veeam—fragmented
              management experience, limited SaaS application coverage, and slower identity-recovery progress—show that
              leadership is relative rather than absolute. The market is therefore attractive enough to sustain Veeam’s
              growth, but not so structurally easy that its 2024 valuation can be justified by category growth alone.
