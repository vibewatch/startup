  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The recommendation is positive on company quality but disciplined on entry price
        blocks:
          - type: paragraph
            body: >-
              The core investment conclusion is straightforward: Veeam looks like a real category leader, but public
              evidence does not justify treating it as a low-risk bargain. The December 2024 secondary established a
              clear private-market mark at $15 billion. Against the company’s disclosed $1.7 billion ARR and 18%
              year-over-year growth, that implies roughly 8.8x ARR—premium to slower, more mature software names but
              still below the richer valuation frameworks sometimes awarded to faster-growth cyber and cloud peers. That
              level seems supportable because Veeam shows breadth, profitability claims, partner scale, and credible
              product evolution into cloud-delivered resilience. It is not obviously cheap because key support
              variables—NRR, ARR concentration, SaaS mix quality, patch-execution confidence, and IPO readiness—remain
              under-disclosed. Recommendation quality therefore depends on price discipline. If the entry price is
              around the known secondary mark and management can close the missing-metric gaps, the case is attractive.
              If valuation stretches toward high-growth-cloud multiples without stronger evidence, the margin of safety
              disappears quickly.
            claimRefs:
              - CV001
              - CV002
              - CV003
