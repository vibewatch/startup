      - number: '2.2'
        title: Market size is large enough to matter, but the real story is the workload mix
        blocks:
          - type: paragraph
            body: >-
              Public sizing is directionally robust even if exact TAM numbers vary by source and category boundary.
              Mordor Intelligence estimates the enterprise backup and recovery software market at $10.63 billion in
              2025, reaching $16.86 billion by 2030 at a 9.67% CAGR. Separately, Gartner-cited 2023 vendor-market-share
              commentary places the legacy enterprise backup and recovery software market at nearly $10 billion of
              annual revenue. Those two datapoints are not contradictory; one measures the current platform market in
              2025 and the other gives a 2023 historical anchor. More revealing than the headline TAM are the segment
              splits. Mordor says hybrid and multi-cloud configurations accounted for 45.32% of 2024 share, while large
              enterprises represented 63.39% of revenue and SMEs are now growing slightly faster. That mix favors
              vendors able to serve both large regulated estates and channel-led midmarket segments. Veeam’s Microsoft
              365 and Kubernetes positioning also shows where the marginal wallet expansion is happening: SaaS and
              cloud-native workloads rather than only core virtual machine backup.
