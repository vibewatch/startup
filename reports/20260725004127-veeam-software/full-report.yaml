companyProfile:
  summary: >-
    Veeam Software is a private data-resilience vendor founded in 2006 that evolved from VMware-centric backup software
    into a broader platform spanning enterprise backup, Microsoft 365 protection, managed data-cloud offerings,
    Kubernetes backup, ransomware-oriented recovery, and service-provider tooling. The company was taken private by
    Insight Partners in 2020 for $5 billion and, by December 2024, completed a $2 billion secondary transaction led by
    TPG and other investors at a $15 billion valuation. Public evidence supports meaningful scale—$1.7 billion ARR, 18%
    year-over-year growth, more than 550,000 customers, and broad enterprise/channel reach—but still leaves important
    diligence gaps around retention, concentration, detailed SaaS economics, and IPO readiness.
