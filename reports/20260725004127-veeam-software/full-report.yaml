      - number: '8.4'
        title: Final diligence should focus on the few variables that could still move the recommendation materially
        blocks:
          - type: paragraph
            body: >-
              The remaining work is not broad exploratory research; it is targeted confirmation. The most important asks
              are cohort economics by product and route to market, partner concentration, SaaS / software mix by ARR and
              margin, security operating metrics, and IPO-readiness evidence. These are exactly the areas where the
              company can either earn a premium-quality multiple or lose it. If management shows strong NRR, balanced
              concentration, fast patch adoption, and a credible path to public disclosure standards, the recommendation
              can move toward invest or pay-up-for-quality. If those areas disappoint, even a good business at $15
              billion could become a poor investment. The thesis-break triggers are therefore clear: a meaningful growth
              slowdown, evidence of concentrated channel dependence, public signs of security-execution failure, or an
              extended delay in liquidity readiness. Until those items are resolved, the right stance is constructive
              but conditional.
