  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The portfolio now covers multiple recovery workflows under one brand
        blocks:
          - type: paragraph
            body: >-
              Veeam’s current portfolio is best understood as a layered resilience stack rather than a single backup
              SKU. Veeam Data Platform remains the primary enterprise control layer for backup, recovery, security, and
              compliance across virtual, physical, cloud, and SaaS workloads. Backup & Replication remains the engine
              for classic enterprise protection and fast restore. Veeam ONE covers monitoring and analytics. Veeam Data
              Cloud and the Microsoft 365-specific Data Cloud offer shift key workloads into managed SaaS delivery.
              Kasten extends Veeam into Kubernetes-native application protection, and Service Provider Console plus
              Cloud Connect anchor the MSP and BaaS operating model. The connective tissue across these products is
              explicit in Veeam’s messaging: instant recovery, immutable storage, clean recovery, AI-guided operations,
              and workload portability. That breadth is a product strength because it lets Veeam sell into hybrid
              estates without forcing one deployment model. It also creates a complexity risk because breadth has to
              remain coherent across interfaces, policy engines, and recovery workflows if the customer is to experience
              one platform rather than a family of adjacent tools.
