      - number: '2.3'
        title: Buyers are pulled by ransomware, SaaS responsibility, and compliance—but pushed back by cost and complexity
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are unusually concrete in this market. Ransomware and extortion pressure keep backup
              infrastructure budget-worthy because compromised backups turn a breach into a business-continuity event.
              SaaS protection is another major pull factor: Gartner forecast that by 2028, 75% of enterprises would
              prioritize backup of SaaS applications as a critical requirement, while Veeam’s Microsoft 365 materials
              explicitly push the shared-responsibility argument that the customer, not Microsoft, owns data protection
              outcomes. Regulatory drivers also matter. Mordor highlights DORA, DPDP, and broader auditability pressures
              that favor immutable, tested, geographically controlled recovery copies. But the market is not
              frictionless. Mordor also identifies rising egress fees, backup-tool sprawl, compliance-audit complexity,
              and cross-cloud restore economics as material constraints. Those frictions explain why buyers increasingly
              want a unified platform or vendor-hosted control plane rather than stitching together many point products.
              They also create room for differentiated control planes, faster restore orchestration, and cleaner
              per-seat or per-workload SaaS packaging.
