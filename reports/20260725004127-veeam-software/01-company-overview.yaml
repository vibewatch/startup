    {
      "id": "capital-ownership-and-scale",
      "title": "Capital structure, ownership, and operating scale",
      "body": "Veeam's most important ownership markers are visible. Insight Partners completed its roughly $5 billion acquisition in March 2020, taking the company private and setting up a U.S.-centered expansion strategy. Four years later, the company expanded its shareholder base through a $2 billion secondary offering that valued Veeam at $15 billion, roughly tripling the 2020 mark. TPG led the transaction, with Temasek, Neuberger Berman Capital Solutions, and other investors participating, while Insight remained the largest shareholder. The disclosed operating metrics around that event are unusually strong for a private software company: as of September 2024 Veeam reported $1.7 billion of ARR, 18% year-over-year growth, 31% growth in software-plus-SaaS subscriptions, and 30% EBITDA margins, which management described as exceeding the Rule of 40. Public materials also point to over 550,000 customers, substantial Fortune 500/Global 2000 penetration, and a partner base above 34,000. Those figures support the view that the 2024 transaction was not a rescue financing but a shareholder-liquidity and cap-table diversification event ahead of a possible IPO path.",
