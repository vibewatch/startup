  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Veeam Software is a 2006-founded backup and data resilience vendor now headquartered in the Seattle area, led by CEO Anand Eswaran, and revalued from Insight Partners' 2020 $5 billion take-private to a December 2024 $15 billion secondary led by TPG. Public evidence supports strong scale and profitability signals\u2014$1.7 billion ARR, 550,000+ customers, and double-digit growth\u2014but governance, exact board composition, and total lifetime capital raised remain only partially disclosed."
  },
  "sections": [
    {
      "id": "identity-and-headquarters",
      "title": "Identity, origins, and headquarters evolution",
      "body": "Veeam began in 2006 as a virtualization-focused backup software company founded by Ratmir Timashev and Andrei Baronov after the pair sold Aelita Software to Quest Software. The original product thesis was simple but valuable: virtual machine environments needed purpose-built backup and recovery rather than legacy agent-heavy tooling. Over time the company broadened from VMware-centered backup into a wider data resilience platform spanning cloud, SaaS, physical infrastructure, Kubernetes, security, and recovery orchestration. Public records show a headquarters journey that matters for diligence. Veeam had long operated with Swiss identity and significant U.S. operations, then moved its headquarters to the United States after Insight Partners acquired it in 2020, with Alpharetta, Georgia highlighted as a focal U.S. base during that transition. By late 2024, GeekWire reported another relocation into Kirkland, Washington to sit closer to hyperscaler and enterprise-software talent. Current Veeam press releases describe the company as headquartered in Seattle with offices in more than 30 countries, which is directionally consistent with the Kirkland move but leaves the exact legal-entity and operating-HQ distinction only partially explicit in public materials. The public adverse event most visible in the reviewed overview materials is product-security pressure: Rapid7 highlighted a critical unauthenticated Veeam Backup & Replication remote-code-execution bug disclosed in September 2024, reminding investors that category leadership also makes Veeam backup infrastructure a high-value attack target.",
