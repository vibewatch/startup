  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Veeam has very broad adoption by count, but the most important commercial fact is the durability of its channel-heavy customer system: enterprise direct customers, managed-service-provider partners, and downstream end customers are all part of the revenue engine. Public evidence strongly supports deployment breadth, named production use cases, and partner-scale distribution; it is much weaker on retention, net revenue retention, and customer concentration, which remain key diligence asks."
  },
  "sections": [
    {
      "id": "who-buys-and-uses-veeam",
      "title": "Veeam sells into a mixed customer system, not a single homogeneous buyer base",
      "body": "Veeam\u2019s public customer footprint is unusually broad: more than 550,000 customers worldwide, a stated presence in more than 180 countries, and a large share of the Fortune 500. But these headline counts flatten an important reality: Veeam serves several different buyer and operator archetypes. Large enterprises buy direct or through large resellers for hybrid backup, recovery, and compliance. Mid-market and SMB customers are often mediated through MSPs and cloud/service providers using Veeam Cloud Connect, Service Provider Console, or the broader VCSP program. Microsoft 365 and Data Cloud buyers can come from different administrative centers than classic infrastructure backup buyers, making the portfolio more multi-buyer over time. Public-sector pages and named city/government stories show adoption in state and local government. Service-provider materials and partner stories show that some \u201ccustomers\u201d are in fact revenue-amplifying intermediaries who package Veeam into downstream backup-as-a-service or DRaaS offerings. This mixed model is a strength because it diversifies route-to-market and end use cases. It also complicates durability analysis because Veeam\u2019s true economic customer may be a partner, an end account, or both depending on the product and motion.",
      "claimRefs": [
        "CU001",
