    },
    {
      "id": "adoption-trajectory-and-retention-visibility",
      "title": "Adoption breadth is proven; retention and cohort durability are not",
      "body": "Public adoption signals are strong at the surface level. Veeam claims more than 550,000 customers and 82% of the Fortune 500 on current customer-facing pages, while older company materials cited 77% of the Fortune 500 and more than 35,000 partners or resellers. The Microsoft 365 release pointed to more than 21 million protected users, which is a useful workload-scale signal, even though it is not the same as paid customer count. TrustRadius reviews highlight strong disaster-recovery confidence, especially in virtualized environments, while also surfacing demands for a more unified interface and easier licensing. Public marketplace listings on Microsoft and AWS reinforce active commercial packaging in cloud procurement channels. However, Veeam does not publicly disclose GRR, NRR, churn, cohort retention, average contract term, or top-customer concentration. In a channel-heavy business, that omission matters. Strong customer count and partner breadth can coexist with weaker direct retention economics or concentration in large service-provider relationships. The public record supports adoption momentum; it does not fully prove revenue durability.",
      "claimRefs": [
        "CU021",
