    {
      "id": "profitability-capital-adequacy-and-comparables",
      "title": "Profitability and capital adequacy look strong, but comparables reveal what is missing",
      "body": "The 30% EBITDA-margin figure disclosed in the 2024 secondary is unusually robust for a private infrastructure-software vendor growing near 20%. It implies that Veeam is not just large, but also already funding product and go-to-market investment from operating scale. That makes the 2024 transaction look more like shareholder liquidity and cap-table diversification than balance-sheet rescue capital. The peer context supports that reading. Rubrik, a closer public growth benchmark, reported $1.46 billion of ARR and $237.8 million of free cash flow in fiscal 2026. Commvault reported $1.122 billion of ARR, $1.184 billion of revenue, and $237 million of free cash flow in fiscal 2026. Cohesity\u2019s combined company with Veritas disclosed $1.5 billion of ARR and a 28% adjusted cash EBITDA margin on a pro forma basis. Against that backdrop, Veeam\u2019s own $1.7 billion ARR and 30% EBITDA margin suggest it belongs at the upper end of the quality distribution for the category. The missing pieces are classic diligence blockers: audited financial statements, GAAP or non-GAAP bridges, cash and debt balances, working-capital dynamics, and segment-level profitability by workload family.",
