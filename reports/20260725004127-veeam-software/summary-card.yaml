  topStrengths:
    - Scaled market position with $1.7B ARR, 550,000+ customers, and broad enterprise plus partner reach.
    - >-
      Product breadth now spans self-managed backup, SaaS-delivered resilience, Microsoft 365 protection, Kubernetes
      backup, and service-provider workflows.
    - >-
      The December 2024 secondary at $15B gives a concrete market-clearing valuation reference rather than a purely
      speculative mark.
    - >-
      Profitability signals, including public 30% EBITDA-margin language, suggest higher business quality than many
      late-stage private software peers.
  topRisks:
    - >-
      Public disclosure remains thin on NRR, GRR, churn, top-partner concentration, top-customer concentration,
      cash/debt, and detailed SaaS economics.
    - >-
      Repeated high-severity vulnerabilities and exploited CVEs make security execution a direct valuation and trust
      risk.
    - >-
      A mixed direct/channel go-to-market model creates real scale benefits but also concentration opacity and
      renewal-proof gaps.
    - >-
      At roughly 8.8x ARR on public numbers, the $15B reference price leaves less room for execution mistakes or IPO
      slippage.
  unresolvedGaps:
    - Retention cohorts, route-to-market concentration, and module attach rates by product family.
    - >-
      Software-versus-SaaS ARR mix, gross-margin profile, and cash-flow detail beyond public headline profitability
      statements.
    - Patch-latency, upgrade adoption, and secure-development metrics needed to score security remediation maturity.
    - IPO-readiness evidence including governance, controls, disclosure cadence, and cap-table / preference overhang.
