    },
    {
      "id": "roadmap-differentiation-and-saas-expansion",
      "title": "Roadmap energy is concentrated in SaaS workloads, identity, and managed operations",
      "body": "Public release cadence shows where Veeam is putting engineering emphasis. The July 2024 Microsoft 365 release added Microsoft 365 Backup Storage integration and emphasized over 21 million protected users. The December 2024 v12.3 release added Microsoft Entra ID protection and broader enterprise capabilities. The Data Cloud page now supports Microsoft 365, Entra ID, Salesforce, and Azure, while Data Cloud Vault adds immutable storage as a service. These changes all point in the same direction: Veeam is turning strong classic backup roots into cloud-delivered resilience services and identity-adjacent protection. The M365 page continues to stress shared responsibility, eDiscovery, large-scale recovery, and bundled pricing\u2014features that matter because Microsoft 365 is both a high-volume data set and a gateway workload into broader SaaS protection. Kasten adds cloud-native credibility in containers, and Splunk integration pushes further into security operations. The roadmap therefore looks less like incremental backup-feature iteration and more like a controlled migration toward broader data-resilience-as-a-service, though the company must still prove unified operations across the enlarged product set.",
      "claimRefs": [
        "CE021",
        "CE022",
        "CE023",
        "CE024",
