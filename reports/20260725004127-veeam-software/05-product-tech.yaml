    },
    {
      "id": "architecture-and-deployment-model",
      "title": "Architecture spans self-managed and SaaS control planes",
      "body": "The most important architectural choice Veeam has made is not one feature release, but the coexistence of self-managed and SaaS delivery models. The Data Platform page presents Veeam as a software appliance and platform for hybrid and multicloud estates, while Veeam Data Cloud packages software, infrastructure, and storage into an all-inclusive SaaS offer. The backup documentation, Data Cloud guide, and Service Provider Console documentation all reinforce this two-speed model: organizations can run Veeam directly in their own infrastructure, buy SaaS-delivered workload protection, or deliver protection to end customers through a VCSP service-provider architecture. Kasten\u2019s documentation shows a separate application-centric architecture built for Kubernetes rather than virtual-machine-first administration. That diversity is strategically sound because customer estates are heterogeneous. But it also means Veeam has to manage technology cohesion across different control planes, deployment assumptions, and administrative surfaces. Gartner-linked commentary about fragmented management experience suggests the platform integration story is not fully complete, even if capability breadth is real.",
      "claimRefs": [
        "CE011",
        "CE012",
        "CE013",
        "CE014",
        "CE015",
