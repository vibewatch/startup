      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 增长重新加速，SaaS 组合扩大，安全执行干净，IPO 路径可信
        - 可支撑高于当前估值标记的溢价，并带来公开市场上行
        - 竞争和披露仍然重要
        - 有可能，但尚未证明
      - - 基准
        - 增长在高十几位数，盈利能力强，云扩张稳，没有重大信任事件
        - 可支撑已知二级市场估值标记附近的估值，并有温和上行
        - 披露缺口限制重估速度
        - 公开证据最能支撑
      - - 熊市
        - 增长放缓，集中度或留存不及预期，或严重安全问题冲击信任
        - 倍数压缩到二级市场参考价格以下
        - 溢价标记让下行保护更少
        - 如果数据室指标不及预期，该情景成立
