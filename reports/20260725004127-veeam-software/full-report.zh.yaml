chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起点与总部演变
        blocks:
          - type: paragraph
            body: >-
              Veeam 起步于 2006 年，是一家聚焦虚拟化的备份软件公司。Ratmir Timashev 和 Andrei Baronov 在将 Aelita Software 出售给 Quest Software
              后创立了它。最初的产品判断很简单， 也很值钱：虚拟机环境需要专门的备份与恢复，而不是沉重的传统重代理工具。此后，Veeam 从围绕 VMware
              的备份，扩展成更宽的数据韧性平台，覆盖云、SaaS、物理基础设施、Kubernetes、安全和恢复编排。 公开记录显示，总部路径本身就值得尽调。Veeam 长期带有瑞士身份，同时在美国有重要运营；Insight
              Partners 于 2020 年收购后，公司把总部迁至美国，转型期以 Georgia 州 Alpharetta 为美国基地重点。 到 2024 年底，GeekWire 报道公司又迁往 Washington 州
              Kirkland，以靠近超大规模云厂商和企业软件人才。 Veeam 当前新闻稿称公司总部位于 Seattle，并在 30 多个国家设有办公室；这与 Kirkland 迁址方向一致，
              但公开材料只部分说清了法律实体总部和运营总部的区别。已审阅概览材料中最显眼的公开负面事件是产品安全压力： Rapid7 在 September 2024 披露 Veeam Backup & Replication
              存在一个关键的未认证远程代码执行漏洞， 也提醒投资者，品类龙头地位会让 Veeam 的备份基础设施成为高价值攻击目标。
