      - number: '7.4'
        title: 多数风险可监测，但要有把握下调风险评级，仍需管理层独有证据
        blocks:
          - type: paragraph
            body: >-
              Veeam 风险画像里积极的一点，是多数重大风险都能监测。安全风险可用补丁滞后、已披露漏洞、独立利用报告、渗透测试结果和客户升级采用率追踪。伙伴集中度可用头部服务商 ARR 占比和流失集中度衡量。估值风险可看
              ARR 增长、SaaS 占比、企业客户扩张以及 IPO 文件准备。法律 /
              隐私风险可通过成熟的数据治理控制、清晰合同和干净监管记录来降低。更棘手的是，许多决定性证据并不公开。公开队列数据无法回答耐久性问题；公开资本表细节无法厘清优先权包袱；公开集中度表也看不出少数渠道账户是否主导增长。因此，当前姿态不是恐慌，而是有条件的信心：只有管理层能快速、可信地补齐一组聚焦证据缺口，Veeam
              才值得投资。
