            body: >-
              Veeam 最重要的架构选择不是某个功能发布，而是自管理与 SaaS 交付模型并存。Data Platform 页面把 Veeam 呈现为面向混合和多云资产的软件设备与平台； Veeam Data Cloud
              则把软件、基础设施和存储打包成一体化 SaaS 产品。备份文档、Data Cloud 指南和 Service Provider Console 文档都强化了这种双速模型：组织可以在自己的基础设施中直接运行
              Veeam，也可以买 SaaS 交付的工作负载保护， 或通过 VCSP 服务提供商架构向终端客户交付保护。Kasten 文档展示的是另一套以应用为中心、为 Kubernetes 构建的架构，
              而不是优先服务虚拟机管理。这种多样性在战略上合理，因为客户资产本来就异构。但这也意味着 Veeam 必须在不同控制平面、 部署假设和管理界面之间管理技术一致性。Gartner
              相关评论提到管理体验碎片化，说明即便能力宽度真实存在，平台整合故事仍没有完全讲完。
