  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界已从备份与恢复扩展到数据保护平台
        blocks:
          - type: paragraph
            body: >-
              Veeam 面临的最重要市场事实，是定义变了。Gartner 和相邻行业分析现在把这个品类称为备份与数据保护平台， 而不只是备份与恢复软件。这个变化很关键：买家不再只是为了宕机后恢复文件而采购点状工具。
              他们越来越希望一个平台能跨虚拟机、物理系统、对象存储、SaaS 应用、Kubernetes 资产和网络攻击恢复流程编排保护。 2025 和 2026 年的市场评论明确把这个品类与网络韧性、AI
              辅助运营、数据发现、身份恢复和集中控制平面联系起来。 Veeam 自己的产品页也反映了同样扩张：Data Platform、Data Cloud、Microsoft 365 备份和 Kasten for
              Kubernetes 都被放进更大的韧性底座中。因此，竞争集合不只包括传统企业备份厂商， 还包括云原生 SaaS 厂商、DR 专家和靠近超大规模云厂商的保护层，而不只是遗留本地备份套件。
