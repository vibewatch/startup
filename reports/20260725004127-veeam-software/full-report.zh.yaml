  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 力量
      - 方向
      - 证据
      - 对 Veeam 的影响
      - 对市场的影响
    rows:
      - - 勒索软件瞄准备份
        - 驱动因素
        - 备份完整性直接影响恢复经济性
        - 支撑不可变和干净恢复功能的溢价
        - 维持网络韧性支出的抗压性
      - - SaaS 共同责任缺口
        - 驱动因素
        - 企业越来越优先考虑 SaaS 备份
        - 扩大 M365 和其他 SaaS 钱包
        - 推动品类超越 VM 备份
      - - 混合 / 多云蔓延
        - 驱动因素
        - 45.32% 的部署份额和不断上升的编排需求
        - 让广泛工作负载支持更有价值
        - 提高有能力平台的切换成本
      - - 合规 / 主权要求
        - 驱动因素
        - DORA 等规则要求恢复方案经过测试且防篡改
        - 强化审计 / 报告价值主张
        - 推高非可选备份支出
      - - 出站费与恢复 TCO
        - 约束
        - 跨云恢复成本可能很高
        - 迫使买方要求更高效的数据放置和定价
        - 可能拖慢重度上云客户的采用
      - - 备份工具蔓延
        - 约束
        - 组织要同时应付多套工具和复杂审计
        - 为 Veeam 创造整合机会
        - 但也抬高了集成证明门槛
      - - 云原生竞争者
        - 约束 / 竞争
        - Druva 和 Rubrik 主打更简单的云优先叙事
        - 在 SaaS 广度和控制平面简洁度上挑战 Veeam
        - 推动市场转向经常性 SaaS 交付
      - - 超大云厂商原生功能
        - 约束 / 替代
        - 部分工作负载里，云原生备份能覆盖基础任务
        - 压缩低端备份经济性
        - 把价值推向跨平台韧性
    notes: 市场由真实痛点驱动，但同一批驱动因素也会加剧替代压力和价格审视。
