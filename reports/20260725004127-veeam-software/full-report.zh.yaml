      - number: '8.4'
        title: 最终尽调应盯住少数仍能显著改变建议的变量
        blocks:
          - type: paragraph
            body: >-
              剩余工作不是宽泛探索，而是定向确认。最重要的要求是按产品和销售路径拆分的队列经济性、伙伴集中度、按 ARR 和利润率拆分的 SaaS / 软件组合、安全运营指标，以及 IPO
              准备度证据。这些领域正是公司赢得优质溢价倍数或失去它的地方。管理层如果能证明 NRR
              强劲、集中度均衡、补丁采用快，并且有可信路径达到公开披露标准，建议可以转向投资或为质量付溢价。如果这些领域不及预期，即便业务不错，$15 billion 的 Veeam
              也可能变成糟糕投资。因此，打破论点的触发器很清楚：增长显著放缓、渠道依赖集中的证据、安全执行失败的公开信号，或流动性准备长期延迟。上述问题解决前，正确立场是建设性但有条件。
