      - number: '8.3'
        title: 情景分析能框出上行，但可比公司仍不支持不计价格买入
        blocks:
          - type: paragraph
            body: >-
              Veeam 最合适的估值框架是情景法，而不是单点精确。基准情景假设公司维持十几个百分点高位增长，保持强 EBITDA 利润率，扩大 SaaS 和云交付组合，并向 IPO 级准备度推进。这大致支撑已知的 $15
              billion 标记，并在未来公开市场窗口带来温和上行。多头情景需要证据表明，Veeam 能在保持盈利的同时扩大云优先工作负载，并缩小与 Rubrik
              等更高增长上市同业之间的叙事差距。空头情景则假设倍数压缩、留存弱于预期，或安全事件在错误时点损伤信任。公开可比公司有帮助，但都有局限：Rubrik 带有增长溢价叙事和公开市场可选性；Commvault
              是增速更慢、更成熟的上市基准；Cohesity / Veritas 仍为私营且战略结构复杂；Dell 和 IBM 过于集团化，难做干净可比。因此，可比组有信息量，但不能一锤定音。纪律性结论是：Veeam
              是一家强公司，但未来回报现在对价格的敏感度远高于对质量的敏感度。
