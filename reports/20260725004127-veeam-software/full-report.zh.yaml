      - number: '1.3'
        title: 资本结构、所有权与运营规模
        blocks:
          - type: paragraph
            body: >-
              Veeam 最重要的所有权节点是可见的。Insight Partners 在 March 2020 完成约 $5 billion 收购， 将公司私有化，并搭起以美国为中心的扩张战略。四年后，Veeam 通过 $2
              billion 二级发行扩大股东基础， 估值达到 $15 billion，约为 2020 年估值的三倍。TPG 领投，Temasek、Neuberger Berman Capital Solutions
              和其他投资者参与，Insight 仍是最大股东。围绕这次事件披露的运营指标，在私有软件公司中异常强： 截至 September 2024，Veeam 报告 $1.7 billion ARR、18%
              同比增长、软件加 SaaS 订阅增长 31%， EBITDA 利润率 30%；管理层称其超过 Rule of 40。公开材料还显示，公司拥有超过 550,000 名客户， 在 Fortune 500 /
              Global 2000 中有相当渗透，并拥有超过 34,000 个合作伙伴。上述数字支持一个判断： 2024 年交易不是救急融资，而是潜在 IPO 路径前的股东流动性和股权结构多元化事件。
