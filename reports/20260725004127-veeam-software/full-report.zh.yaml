  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合已在一个品牌下覆盖多种恢复工作流
        blocks:
          - type: paragraph
            body: >-
              Veeam 当前产品组合更适合被理解为分层韧性栈，而不是单一备份 SKU。Veeam Data Platform 仍是企业在虚拟、 物理、云和 SaaS
              工作负载上做备份、恢复、安全和合规的主要控制层。Backup & Replication 仍是经典企业保护和快速恢复的引擎。 Veeam ONE 覆盖监控与分析。Veeam Data Cloud 以及面向
              Microsoft 365 的 Data Cloud，把关键工作负载转向托管式 SaaS 交付。Kasten 将 Veeam 延伸到 Kubernetes 原生应用保护；Service Provider
              Console 加 Cloud Connect 则锚定 MSP 和 BaaS 运营模式。这些产品之间的连接点，在 Veeam 信息中很明确：即时恢复、不可变存储、洁净恢复、 AI
              引导运营和工作负载可移植性。宽度是产品优势，因为 Veeam 能卖进混合资产，而不强迫客户采用单一部署模式。
