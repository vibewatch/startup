      - number: '1.4'
        title: 市场位置与仍未关闭的尽调问题
        blocks:
          - type: paragraph
            body: >-
              Veeam 现在把自己定义为全球数据韧性领导者，而不只是备份厂商；第三方市场份额口径也支撑这种重新定位。 一份 2024 Gartner 市场份额发布称，Veeam 是排名第一的企业备份与恢复软件厂商，份额
              15.1%， 2023 年收入 $1.5 billion；之后 Veeam 新闻稿又称，公司在 2025 Gartner Magic Quadrant 中连续第九年处于领导者位置， 并在 2026
              版中第十年成为领导者。公司产品页进一步显示，战略宽度已经延伸到 AI 引导运营、安全态势，以及跨混合和多云资产的可移植恢复。
              即便如此，单靠公开数据仍有几个尽调项没有解决：当前员工人数因来源和年份不同而不一致，法律总部与运营总部表述随时间变化， 2024
              年二级交易后的董事会和控制权图谱只部分公开，累计一级资本融资也没有估值标记那么清晰。放在这种规模的私有公司里， 上述缺口可以管理；但如果报告用于承销治理质量或 IPO
              准备度，而不是单纯判断公司质量，它们就很重要。 披露质量重要的另一层原因是，影响备份基础设施的关键漏洞可能很快演变成业务和声誉事件。
