  - id: TM001
    title: 市场定义表
    columns:
      - 纳入支出
      - 纳入原因
      - 排除 / 相邻支出
      - 边界重要性
    rows:
      - - 企业备份与恢复软件
        - Veeam 已在 Gartner 市场份额中领先的核心品类
        - 消费者备份工具
        - 买方、ACV 和合规门槛不同
      - - 备份和数据保护平台
        - 现代品类定义纳入网络恢复、不可变存储、SaaS 和云工作负载保护
        - 没有保护软件的纯存储硬件
        - 硬件利润率不等于平台软件需求
      - - SaaS 备份与恢复
        - Microsoft 365、Entra ID 和其他 SaaS 工作负载已成为明确买方需求
        - 没有第三方恢复工具的原生 SaaS 保留
        - 共同责任缺口为第三方留下预算
      - - Kubernetes / 云原生数据保护
        - 容器化应用现在也是工作负载覆盖决策的一部分
        - 单纯通用云对象存储
        - 没有策略、编排或恢复逻辑的存储不是同一种产品
      - - DR / 网络恢复编排
        - 恢复计划和洁净室工作流会影响交易选择
        - 没有备份平台绑定的 IR 服务
        - 纯服务响应是相邻项，不是完整平台替代品
    notes: 边界结合 Gartner 式平台框架、Veeam 产品证据和工作负载层面的买方需求。
