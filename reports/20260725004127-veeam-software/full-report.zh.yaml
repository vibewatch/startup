companyProfile:
  summary: >-
    Veeam Software 是一家私有数据韧性厂商，成立于 2006 年。公司最初做面向 VMware 的备份软件， 后来扩展成覆盖企业备份、Microsoft 365 保护、托管式数据云产品、Kubernetes
    备份、面向勒索软件的恢复， 以及服务提供商工具的更大平台。Insight Partners 在 2020 年以 $5 billion 将公司私有化；到 December 2024，Veeam 完成由 TPG 等投资者领投的 $2
    billion 二级交易，估值 $15 billion。 公开证据证明公司已具规模——$1.7 billion ARR、18% 同比增长、超过 550,000 名客户，以及广泛的企业和渠道覆盖—— 但留存、集中度、SaaS
    经济性细节和 IPO 准备度仍是关键尽调缺口。
