      - number: '8.2'
        title: 强项在市场地位；反方主要质疑高溢价下的证据质量
        blocks:
          - type: paragraph
            body: >-
              多头逻辑从质量出发：Veeam 是一家有规模的私营公司，覆盖广泛工作负载，客户底盘庞大，在 Data Cloud、Microsoft 365 保护和面向勒索软件的恢复上也有可见产品动能。按已披露 EBITDA
              利润率表述，它似乎已经盈利或接近盈利，规模足以在整合中的品类里占据分量。反向论点不是公司没有市场，而是买方可能被要求支付高质量价格，却拿不到完整的高质量披露。公开证据还没有证明 Veeam
              具备一流留存、伙伴集中度可控，或符合上市公司标准的运营模型。安全执行也是估值变量，不只是技术变量，因为严重且已被利用的漏洞可能比产品广度重建信任更快压缩信任。因此，估值支撑真实存在但有条件：如果云优先转型和运营证据继续兑现，Veeam
              应该高于低增长传统同业；但在更深披露出现前，它也应低于估值最贵的成长可比公司。
