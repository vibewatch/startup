    title: 论点破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 增长质量不及预期
        - ARR 增速明显低于十几个百分点高段，且没有利润率或 SaaS 结构优势抵消
        - 击穿溢价倍数支撑
        - 不要支付私营公司溢价倍数
      - - 留存或集中度走弱
        - NRR/GRR 或头部合作伙伴数据显著差于预期
        - 削弱持续性叙事
        - 要求折价，或放弃
      - - 安全执行恶化
        - 再出现严重在野利用漏洞，且补丁采纳偏弱
        - 压低信任度和退出准备度
        - 暂停投资
      - - IPO 准备停滞
        - 控制和披露没有可信进展
        - 拉长持有期，降低退出信心
        - 重估回报预期
      - - 估值上漂，脱离证据支撑
        - 新一轮估值明显高于可比对象支撑区间，且证据没有改善
        - 抹掉安全边际
        - 跟踪，不追高
    notes: 触发项按决策而非单纯风险来定义。
