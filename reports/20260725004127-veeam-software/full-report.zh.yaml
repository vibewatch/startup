  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 头部风险集中在安全执行、合作伙伴不透明和高价预期
        blocks:
          - type: paragraph
            body: >-
              最严重的风险并不随机；它们会直接传导到客户信任、增长耐久性和退出准备度。第一，Veeam 多次受到高严重性备份基础设施漏洞影响，
              攻击者重视这些漏洞，正是因为备份是恢复控制平面。CISA、NVD、Rapid7、Qualys、CyberCentaurs 以及 Veeam 自己的 KB 材料，让这一点无法忽视。第二，公司的 GTM
              模型很宽但不透明：公开材料显示其渠道和提供商生态非常庞大， 却不披露头部合作伙伴集中度、队列留存或直接与间接收入拆分。第三，私募市场价格已经足够高，增长、利润率或 IPO 准备度一旦出现实质滑坡，
              估值都可能被压缩。额外但排序较低的风险包括全球运营中的法律和隐私义务、公司围绕 SaaS 韧性重新定位时的管理执行风险，
              以及由创始历史和不断变化的总部叙事带来的地缘政治观感。上述风险单独看都不会在今天击穿公司；合在一起，它们定义了尽调议程。
