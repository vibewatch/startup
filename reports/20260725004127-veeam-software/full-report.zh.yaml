      - number: '2.2'
        title: 市场规模足够大，但真正的故事在工作负载组合
        blocks:
          - type: paragraph
            body: >-
              即便不同来源和品类边界给出的精确 TAM 不同，公开规模测算在方向上仍然扎实。Mordor Intelligence 估计， 企业备份与恢复软件市场 2025 年为 $10.63 billion，到 2030
              年达到 $16.86 billion，CAGR 为 9.67%。 另一个 Gartner 引用的 2023 年厂商市场份额评论，把传统企业备份与恢复软件市场放在接近 $10 billion 年收入。
              这两个数据点并不矛盾：一个衡量 2025 年当前平台市场，另一个给出 2023 年历史锚点。比标题 TAM 更有信息量的是细分结构。 Mordor 称，混合和多云配置占 2024 年份额的
              45.32%，大型企业贡献 63.39% 收入，SME 现在增速略快。 这种组合有利于能同时服务大型受监管资产和渠道驱动中端市场的厂商。Veeam 的 Microsoft 365 和 Kubernetes
              定位也说明边际钱包扩张发生在哪里： SaaS 和云原生工作负载，而不是只有核心虚拟机备份。
