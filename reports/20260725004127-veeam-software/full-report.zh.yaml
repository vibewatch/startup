        blocks:
          - type: paragraph
            body: >-
              Veeam 的安全风险高于一般软件厂商，因为公司的产品常位于特权恢复路径上。Veeam 自己的 KB4649 披露了 Backup & Replication 中的未认证远程代码执行问题；CISA 和 NVD
              通过收录该漏洞并指出真实世界利用，把严重性进一步抬高。 Rapid7 和 Qualys 提供了外部证据，说明攻击者会主动瞄准这一攻击面，且严重漏洞延续到 2025 年。CyberCentaurs 进一步指出，
              勒索软件行为者盯紧 Veeam 备份，因为备份控制层给了阻碍恢复的直接路径。缓解叙事是真实的——补丁、公告、更新指引、 遥测，以及 EULA
              中的默认更新逻辑——但剩余风险仍然高，因为客户危机时刻必须信任这家公司。法律和隐私风险更常规， 但仍然相关：隐私通知显示跨境个人数据处理和 DPF 承诺；EULA
              保留审计、遥测、授权和更新权利，如果处理不好会制造客户摩擦。 公开记录没有显示 Veeam 遭遇重大公开执法，但确实显示它在许多司法辖区承担有意义的合规义务。
