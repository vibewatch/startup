      - number: '1.2'
        title: 私有化后的领导层与治理重置
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开领导层拐点出现在 December 2021：Veeam 任命 Anand Eswaran 为 CEO，并让他进入董事会。 这不是象征性调整。公司把 Eswaran 定位为带领 Veeam 在
              2021 年跨过 $1 billion ARR 门槛后， 迈向下一个 $1 billion ARR 的高管。他最近担任 RingCentral 总裁兼 COO，此前是 Microsoft 企业业务高管；
              这套履历契合 Veeam 从创始人主导的基础设施厂商，转向规模化企业软件平台的路径。Bill Largent 卸任 CEO， 但继续担任董事长，给所有权变化保留连续性。公开报道还把 COO Matthew
              Bishop 放在 2024 年迁址后的 Seattle 地区领导核心中。透明度较弱的是 2024 年二级交易后的完整董事会构成，以及 Insight、TPG、Temasek、 Neuberger Berman
              和管理层之间控制权的具体划分。也就是说，公开记录足以支撑 CEO 质量和战略运营领导力， 但治理细节弱于一家 IPO 就绪公司通常会在 S-1 中披露的水平。
