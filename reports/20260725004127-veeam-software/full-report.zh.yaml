      - number: '2.3'
        title: 勒索软件、SaaS 责任和合规拉动买家，但成本与复杂度也在反推
        blocks:
          - type: paragraph
            body: >-
              这个市场的需求驱动因素异常具体。勒索软件和敲诈压力让备份基础设施值得预算投入，因为备份一旦被攻破，安全事件就会变成业务连续性事件。 SaaS 保护是另一个主要拉力：Gartner 预测，到 2028 年，75%
              的企业会把 SaaS 应用备份列为关键要求； Veeam 的 Microsoft 365 材料也明确强调共同责任，即数据保护结果由客户而不是 Microsoft 承担。 监管驱动同样重要。Mordor 提到
              DORA、DPDP 和更广泛的可审计性压力，这些都利好不可变、经过测试、地理位置可控的恢复副本。 但市场并非没有摩擦。Mordor
              也指出，不断上升的出口费用、备份工具蔓延、合规审计复杂度，以及跨云恢复经济性，都是实质约束。 这些摩擦解释了为什么买家越来越想要统一平台或厂商托管控制平面，而不是自己拼接许多点状产品。
              它们也给差异化控制平面、更快的恢复编排，以及更清晰的按席位或按工作负载 SaaS 打包留下空间。
