  topStrengths:
    - >-
      TymeBank SA reached its first profitable calendar month in December 2023, becoming Africa's first digital bank to
      achieve monthly profitability at scale — validating the hybrid kiosk-plus-app model.
    - >-
      Nubank's $150M entry at a 10% stake is the most credible external valuation signal: a public company with SEC
      filings committed capital at the $1.5B mark, providing independent pricing confirmation.
    - >-
      GoTyme Philippines achieved #1 Visa debit card issuer status by active usage in under three years of operation,
      demonstrating the model's portability across emerging markets.
    - >-
      TymeBank SA's 29% YoY revenue growth to R3.11B in FY2025 and a rapidly improving cost-to-income ratio demonstrate
      approaching break-even economics at the SA entity level.
    - >-
      African Rainbow Capital's ~40% anchor stake and confirmed capital support provides near-term liquidity backstop
      while the group scales toward a 2028 IPO.
  topRisks:
    - >-
      Going-concern qualification: TymeBank SA's FY2025 audited financials include a going-concern disclosure; ARC's
      capital support is confirmed only through October 2026, creating a hard funding deadline.
    - >-
      No consolidated group-level audited financials are publicly available; the gap between SA entity economics and
      group economics (including Philippine losses and holding company costs) is unknown and material.
    - >-
      Credit impairment charges grew 51% YoY to R534M in FY2025, outpacing revenue growth of 29%, raising questions
      about credit risk management as the loan book scales.
    - >-
      Home Affairs identity-verification fee increase (from 15c to R10 per query) could raise TymeBank SA's customer
      acquisition cost by 20–50% and trigger legal exposure if implemented.
    - >-
      Retail partner concentration: GoTyme SA's kiosk onboarding depends heavily on Pick n Pay and Boxer; any reduction
      in retail partnerships would directly impair customer acquisition.
  unresolvedGaps:
    - >-
      Consolidated Tyme Group Pte Ltd (Singapore holding) audited P&L, balance sheet, and cash flow for FY2025 — not
      publicly available; group profitability and cash burn cannot be assessed.
    - >-
      Post-Series D fully diluted cap table with all shareholder percentages, liquidation preference stack, governance
      rights, and ARC/Nubank voting provisions — not publicly disclosed.
    - >-
      GoTyme Philippines standalone audited financial statements for FY2025 and confirmed path to break-even — not
      publicly available; Philippine profitability timeline is unverifiable.
    - >-
      Binding capital commitment or financing plan for Tyme Group beyond 31 October 2026, including IPO timeline,
      pre-IPO bridge terms, or ARC follow-on commitment letter.
    - >-
      Customer acquisition cost (CAC), cohort lifetime value (LTV), and churn rates by segment — private; unit economics
      can only be inferred from aggregate disclosed data.
