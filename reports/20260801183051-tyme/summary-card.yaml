summary:
  headline: >-
    Tyme Group is a structurally credible emerging-market neobank with proven South African unit economics and Nubank's
    strategic endorsement, but information asymmetry — no consolidated group audited financials, unconfirmed Philippine
    profitability, and partial cap table disclosure — prevents a high-confidence buy recommendation on publicly
    available evidence alone; track and request group financials before committing.
