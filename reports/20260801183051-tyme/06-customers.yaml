      "id": "retention-satisfaction",
      "title": "Retention, Satisfaction, and Durability Evidence",
      "body": "Public retention evidence for Tyme Group is limited, with no NRR, GRR, or cohort data disclosed. The strongest durability signals come from three proxies: (1) TymeBank's NPS, described as one of the highest of all South African retail banks across low- and middle-income brackets per the 2021 Kantar study; (2) the 32% active-to-registered ratio from the June 2025 Pillar III filing, which is a concerning figure requiring management clarification — it could reflect dormant accounts from early mass-acquisition campaigns or could be a product of the bank's zero-friction low-barrier onboarding model; and (3) GoTyme PH's deposit growth trajectory (from P24 billion in December 2024 to P43 billion in February 2026) implies significant net retention and balance accumulation rather than one-time account opening. TymeBank's (now GoTyme SA) GoalSave product, which offers up to 10% per annum on locked savings, serves as a stickiness mechanism for the savings segment. MoreTyme BNPL, deployed at 5,500+ physical stores and 1,200+ e-commerce sites as of the January 2024 press release, creates recurring transactional engagement that should support retention in the retail consumer segment. HelloPeter, South Africa's primary consumer complaints platform, lists GoTyme/TymeBank as a searchable entity, but the content requires JavaScript to render and specific rating data was not retrievable during this review. No net promoter score or CSAT metric has been publicly disclosed for GoTyme Philippines.",
