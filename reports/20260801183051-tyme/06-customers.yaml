    {
      "id": "named-customer-proof",
      "title": "Named Customer and Deployment Proof",
      "body": "Production evidence for GoTyme Group's customer base spans four distinct deployment archetypes. First, the South African retail consumer franchise is in full production, having crossed 8.5 million customers by January 2024 and achieved bank-level profitability in December 2023 — the first digital bank in Africa to do so. Second, the SME and micro-merchant segment is evidenced by Retail Capital's more than 50,000 active merchant borrowers and R9.5 billion in deployed working capital at a ~30% annual portfolio growth rate, as of the January 2024 press release. Third, GoTyme Bank Philippines' consumer deployment is confirmed by the Visa recognition of 8 million-plus active Visa debit cardholders and P43 billion in deposits. Fourth, the social-grant segment is documented: as of the January 2024 announcement, Grant Advance customers were 78% caregivers, 13% old-age grant recipients, and 10% disability grant recipients, signalling intentional financial-inclusion targeting. A fifth archetype — township micro-merchants using TymePOS — remains in early rollout, with only a pilot partnership with Khona La Local Stores documented publicly. The Forbes Best Digital Bank in the Philippines award (GoTyme PH, two consecutive years) and Visa's #1 debit card ranking provide independent third-party validation of the consumer franchise quality, though the underlying data behind the Forbes award is not publicly disclosed. The Robinsons Retail partnership, formalised at GoTyme PH launch in November 2022, embeds the bank within major Philippine retail chains, acting as a phygital acquisition channel with Go Rewards loyalty integration.",
