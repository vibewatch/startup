    "title": "Customers",
    "summary": "Tyme Group serves 17 million-plus customers across South Africa and the Philippines as of mid-2025, comprising mass-market retail consumers, social grant recipients, SME merchants, and Gokongwei ecosystem shoppers. GoTyme Bank SA (formerly TymeBank) held 11.6 million registered and 3.7 million active customers per its June 2025 Basel Pillar III filing, while GoTyme Bank Philippines surpassed 8 million Visa debit card users with P43 billion in deposits by February 2026, achieving the #1 Visa debit issuer position in the country. Key durability watchpoints include a 32% SA activation rate that management has not publicly explained, absence of published NRR or churn cohorts, and structural concentration in the Pick n Pay/Boxer retail distribution partnership."
