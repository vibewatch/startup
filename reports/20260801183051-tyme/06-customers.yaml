      "id": "expansion-concentration",
      "title": "Expansion Dynamics and Concentration Risks",
      "body": "Tyme Group's expansion strategy follows a product land-and-expand logic: new customers are acquired via free current accounts and card, then cross-sold savings (GoalSave), BNPL (MoreTyme), credit (personal loans, Retail Capital advances), and increasingly crypto (GoTyme PH VASP-licensed). The GoTyme SA Business Advance product (up to R5 million, no collateral required) extends the SME segment beyond Retail Capital's existing merchant cash advance book. In the Philippines, GoTyme PH's introduction of MoreTyme, Google Wallet/Google Pay integration, and crypto services reflect the same upsell trajectory. Concentration risks are material: the South African franchise depends on the Pick n Pay, Boxer, and TFG distribution partnership for its low-cost kiosk-led customer acquisition; any significant disruption to that network would increase the cost of acquiring new customers and potentially disrupt the existing acquisition run rate. In the Philippines, GoTyme PH is structurally embedded in the Gokongwei group's retail ecosystem, creating alignment of interest but also a risk that the bank's growth outside the Gokongwei network is less well-tested. At the SME level, Retail Capital's R9.5 billion portfolio is concentrated in merchant cash advances, a product inherently sensitive to merchant revenue volatility. No top-customer concentration data is publicly disclosed. The Tyme Group's third-market strategy (Vietnam or Indonesia) is intended to reduce country concentration, but no live banking customers have been reported in a third market as of the May 2026 run date.",
