    {
      "id": "adoption-trajectory",
      "title": "Adoption Trajectory and Growth Milestones",
      "body": "GoTyme Bank SA has followed a steep adoption curve since the February 2019 launch, achieving 8.5 million customers by the January 2024 profitability announcement and reaching 11.6 million registered customers by June 2025 per the Basel Pillar III disclosure. The bank was acquiring approximately 150,000 new customers per month as of early 2024, a run rate that implies significant organic growth underpinned by low marginal CAC through the existing retail network. However, the Pillar III filing also reveals only 3.7 million active customers against 11.6 million registered — a 32% activation rate — which is a material gap management has not publicly explained and raises questions about the depth of engagement for a majority of the registered base. In the Philippines, GoTyme Bank Philippines expanded from launch in October 2022 to 5.1 million customers by December 2024 (per the BusinessWorld CEO interview) and surpassed 8 million Visa debit card users with P43 billion in customer deposits by February 2026 per Visa's official release. Visa's recognition of GoTyme PH as the #1 active Visa debit issuer in the country — with payment volume growing more than 150% year-on-year through 2025 — corroborates the deposit and card figures. GoTyme Bank PH CEO Nate Clarke attributed the acceleration to an underserved young market, the phygital kiosk model, and the Gokongwei retail network. At the group level, Tyme Group reported 17 million-plus customers across both markets in mid-2025.",
