    {
      "calloutType": "risk",
      "title": "32% Activation Rate Requires Explanation",
      "body": "TymeBank/GoTyme SA's June 2025 Pillar III filing discloses 11.6 million registered customers but only 3.7 million active, implying 68% of registered accounts are inactive or dormant. This gap is material: it affects ARPU calculations, CAC payback periods, and the quality of the reported customer base. Management has not publicly explained the 'active' definition or provided a segment breakdown of the inactive pool.",
