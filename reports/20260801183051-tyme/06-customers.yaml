      "id": "customer-segmentation",
      "title": "Customer Segmentation and Market Reach",
      "body": "Tyme Group operates two live banking franchises — GoTyme Bank SA (formerly TymeBank, rebranded 2025–2026) in South Africa and GoTyme Bank Philippines — with a combined reported base of 17 million-plus customers as of mid-2025. The South African franchise serves four identifiable segments: (1) mass-market retail consumers who value zero monthly fees, instant account opening via Pick n Pay, Boxer, and TFG kiosks, and high-yield GoalSave savings; (2) social grant recipients who rely on the Grant Advance product for early, fee-free access to government disbursements; (3) SME merchants who access working capital through the Retail Capital division; and (4) micro-merchants and spaza shop owners who accept cashless payments via TymePOS. In the Philippines, GoTyme Bank's primary segment is mass-market digital-first consumers embedded within the Gokongwei retail ecosystem — shoppers at Robinsons malls and associated retailers who benefit from Go Rewards loyalty integration and instant in-store kiosk account opening. The Kantar 2021 study cited by TymeBank (now GoTyme SA) confirmed that customers join primarily for no bank charges, app ease of use, retail convenience, inclusivity, Smart Shopper loyalty points, and above-market savings rates. The growing appeal to consumers earning R25,000–R40,000 per month in South Africa signals an upward segment drift beyond the original lower-income base. GoTyme SA's Flex for Business community app has also attracted more than 50,000 South African entrepreneurs as a brand-extension retention vehicle outside core banking.",
