  shortDescription: >-
    Tyme Group is a Singapore-headquartered digital banking group operating TymeBank (South Africa, rebranding to
    GoTyme) and GoTyme Bank (Philippines) through a high-tech, high-touch model embedded in retail ecosystems. The
    company raised $250 million in a December 2024 Series D at a $1.5 billion valuation led by Nubank, with African
    Rainbow Capital retaining ~40% ownership. TymeBank SA achieved its first profitable month in December 2023 and
    reported R3.11B in revenue for FY2025. The group serves 17 million-plus customers across South Africa and the
    Philippines and is tracking toward a 2028 IPO.
