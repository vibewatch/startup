  topStrengths:
    - TymeBank SA 在 2023 年 12 月首次实现单月盈利，成为非洲第一家规模化实现月度盈利的数字银行，验证了 kiosk 加 app 的混合模式。
    - Nubank 以 $150M 入股 10%，是最可信的外部估值信号：一家有 SEC 申报的上市公司按 $1.5B 标记投入资本，提供了独立定价确认。
    - GoTyme Philippines 运营不到三年，就按活跃使用量成为 Visa 借记卡第一大发卡方，证明该模式能迁移到其他新兴市场。
    - FY2025 TymeBank SA 收入同比增长 29% 至 R3.11B，成本收入比快速改善，说明南非法人层面的经济性正接近盈亏平衡。
    - African Rainbow Capital 约 40% 的锚定持股和已确认资本支持，为集团迈向 2028 年 IPO 的扩张提供近端流动性后盾。
  topRisks:
    - 持续经营保留意见：TymeBank SA 的 FY2025 审计财务包含持续经营披露；ARC 的资本支持只确认到 2026 年 10 月，形成硬融资期限。
    - 公开渠道没有集团层面合并审计财务；南非法人经济性与集团经济性之间的差距（包括菲律宾亏损和控股公司成本）未知且重要。
    - FY2025 信用减值费用同比增长 51% 至 R534M，快于 29% 的收入增长；贷款簿扩张时，信用风险管理开始被质疑。
    - Home Affairs 身份验证费若从每次查询 15c 提高到 R10，可能把 TymeBank SA 的获客成本推高 20–50%，并触发法律风险。
    - 零售伙伴集中：GoTyme SA 的 kiosk 开户高度依赖 Pick n Pay 和 Boxer；零售合作一旦收缩，会直接伤害获客。
  unresolvedGaps:
    - Tyme Group Pte Ltd（新加坡控股）FY2025 合并审计损益表、资产负债表和现金流——公开渠道不可得，无法评估集团盈利能力和现金消耗。
    - Series D 后完全稀释股权结构，包括全部股东比例、清算优先权结构、治理权以及 ARC/Nubank 投票安排——未公开披露。
    - GoTyme Philippines FY2025 单体审计财务报表和确认后的盈亏平衡路径——公开渠道不可得，菲律宾盈利时间线无法验证。
    - 2026 年 10 月 31 日之后 Tyme Group 具有约束力的资本承诺或融资计划，包括 IPO 时间线、IPO 前过桥条款或 ARC 跟投承诺函。
    - 分客群获客成本（CAC）、同期群生命周期价值（LTV）和流失率仍属私有数据；单元经济性只能从已披露汇总数据推断。
