summary:
  headline: >-
    Tyme Group 是一家结构上可信的新兴市场数字银行，南非单元经济性已经跑通，也得到 Nubank
    战略背书；但信息不对称仍重——没有集团合并审计财务、菲律宾盈利未获确认、股权结构只披露部分——仅凭公开证据无法高置信买入，应先跟踪并要求集团财务再投入。
