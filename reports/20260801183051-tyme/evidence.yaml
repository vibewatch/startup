evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: group-revenue
    missingEvidence: >-
      Current group-level revenue, net interest income, gross margin, and EBITDA disclosures after the May 2023 >$100M
      run-rate statement.
    whyItMatters: >-
      Without updated economics, investors cannot test whether customer growth is converting into durable group
      profitability rather than isolated bank-level break-even.
    diligencePath: >-
      Request board pack or investor-update financials covering FY2025 and FY2026 group P&L, segment revenue, and margin
      by country.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      A current diluted cap table showing exact post-Series D ownership for all major shareholders, employee pools, and
      any preference stack.
    whyItMatters: >-
      Public sources only expose ARC's rough stake and Nubank's 10% entry point, which is insufficient for governance,
      dilution, and exit modelling.
    diligencePath: >-
      Obtain the latest shareholder register, shareholders' agreement summary, and post-Series D capitalization table
      from management or counsel.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: rebrand-completion
    missingEvidence: >-
      An official document fixing the legal effective date and customer-migration scope of the TymeBank-to-GoTyme South
      Africa rebrand.
    whyItMatters: >-
      The live redirect and media reports show the transition is underway, but the exact completion point affects brand,
      compliance, and customer-communication risk.
    diligencePath: >-
      Collect the final regulator-approved rebrand notice, customer communication plan, and marketing cutover memo from
      GoTyme South Africa.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: minor
    topic: group-governance
    missingEvidence: >-
      A full Tyme Group board list, committee structure, and reserved-matters schedule for the holdco after the
      2024-2025 capital rounds.
    whyItMatters: >-
      Public evidence names executives and bank directors but not the full governance architecture that determines how
      group-level decisions are made.
    diligencePath: >-
      Request the current board pack cover sheet, board committee charters, and shareholder governance schedule from
      legal or investor relations.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: ipo-and-new-markets
    missingEvidence: >-
      A formal management document stating the target timing, prerequisites, and sequencing for IPO preparation,
      Indonesia retail banking, and Hong Kong lending expansion.
    whyItMatters: >-
      Public references to future markets and an eventual IPO are directional; they are not enough for timing,
      capital-needs, or execution-risk underwriting.
    diligencePath: >-
      Ask management for the latest strategic plan, market-entry approval tracker, and capital-allocation memo covering
      2026-2028 priorities.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: material
    topic: tyme-specific-tam
    missingEvidence: >-
      A public market-size estimate that isolates only Tyme's addressable revenue pool across South Africa and the
      Philippines instead of broader banking or fintech categories.
    whyItMatters: >-
      Current public sources are strong on inclusion and connectivity but weak on converting those lenses into a revenue
