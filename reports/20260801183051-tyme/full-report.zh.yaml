  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 信用、资本与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank FY2025 Annual Financial Statements 由 PricewaterhouseCoopers 审计，其中持续经营披露写明：Tyme Group 确认只为 GoTyme
              Bank Limited 提供资本支持至 2026 年 10 月 31 日；之后仍存在重大不确定性，能否消除取决于计划中的 NYSE
              IPO、追加融资或股东继续支持。这是本报告最重要的近期风险。资本充足率单看很强——CET1 为 21.29%，接近 SARB 约 11% 最低要求的两倍——但 CET1
              衡量的是南非运营实体，不是集团合并流动性。2024 年 12 月 Series D 由 Nubank 领投 $150 million，延长了现金跑道；但 TymeBank 资产负债表上的累计亏损已达 R7.72
              billion，反映 2015 年以来的累计投入。信用侧，FY2025 减值费用增长 51% 至 R534 million，驱动来自贷款账本快速扩张，而不是旧批次质量恶化；但公司不公开 NPL
              比率、vintage 曲线或拨备覆盖指标，仅凭公开披露无法独立承保信用风险。Retail Capital 每年向 SME 客户发放 R9.5 billion
              商户现金垫款，又增加了一层表外信用集中。每活跃客户年减值约 R144，与同业相比仍有优势，但随着 Tyme 放贷账本扩张快于成熟速度，单客减值正在上升。金融风险的关键论点破坏信号，是集团管理层能否在 2026 年
              10 月前锁定 IPO 或股权承诺；若失败，公司可能需要按不利条款获取紧急过桥资金。
