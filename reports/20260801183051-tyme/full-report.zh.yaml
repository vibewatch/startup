      - number: '2.2'
        title: 国家规模测算视角
        blocks:
          - type: paragraph
            body: >-
              南非和菲律宾需要不同的规模测算逻辑。南非的宽市场不是“只看未开户人群”的故事：世界银行证据显示，85% 的成年人已经拥有账户；GSMA 报告的移动互联网使用量相当于成年人口的
              74%。剩余可变现缺口的关键是深度，而不是首次接入——低费率日常银行、数字辅助开户、现金替代，以及面向高度非正式小企业基础的 SME 信贷。同一份 GSMA 报告称，86% 的 MSME 是非正式经营，79%
              的非正式 MSME 从未借过款，说明贷款、商户获取和存款主账户地位比单纯计数账户更重要。菲律宾则更明显仍处于包容性建设阶段：BSP 2025 年 CFIS 显示，只有 50% 的成年人拥有正规账户，但 85%
              的家庭至少有一个账户，62% 的家庭已经借助电子设备进行金融交易，智能手机拥有率为 86%，互联网使用率为 89%。与此同时，BSP 2024 年状态报告显示，数字零售支付在笔数和金额中的占比分别达到 57.4%
              和 59.0%，说明支付轨道成熟速度快于完整主银行关系的建立。对 Tyme 而言，这意味着南非的 SAM 由一个大体已开户人群中的服务不足经济性驱动；菲律宾则在较低账户拥有率基础上，同时提供包容性扩张和产品深化。
            claimRefs:
