            body: >-
              Capitec 是南非最难对标的公司，因为它把简单价值主张和巨大规模结合在一起：Reuters 报道，其 2025 年 8 月半年度活跃客户为 2,500 万，到 2026 年 2 月年末已超过 2,600
              万。Discovery 规模小得多，但已突破 100 万客户和 200 多万活跃账户，并把银行嵌入更广的保险与奖励生态。Tyme 的公开叙事仍强调无月费、快速开户，以及超过 1,000 台自助机和 15,000
              个零售点的零售伙伴版图；差异化明确，但产品宽度窄于最大型传统银行。菲律宾方面，GoTyme 的线上线下一体模式扩张很快，14 个月达到 230 万客户、约 500
              台自助机，但它面对的是体量更大的消费平台。GCash 称 9,400 万菲律宾人用过该 App；Maya 则披露，到 2025 年二季度拥有 820 万银行客户、210 万借款人和 P50 billion
