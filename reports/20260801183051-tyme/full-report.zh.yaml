      - number: '6.6'
        title: 展项
        blocks:
          - type: callout
            title: 32% 激活率需要解释
            body: >-
              TymeBank/GoTyme SA 的 2025 年 6 月 Pillar III 文件披露 1160 万注册客户，但活跃客户只有 370 万，意味着 68% 注册账户处于非活跃或沉睡状态。该缺口很重要：它影响
              ARPU 计算、CAC 回收期和披露客户基础的质量。管理层尚未公开解释「活跃」的定义，也未提供非活跃池的分客群拆分。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
          - type: callout
            title: GoTyme PH 成为菲律宾 Visa 借记卡活跃使用第一
            body: >-
              GoTyme Bank Philippines 获 Visa 认定为菲律宾活跃使用排名第一的 Visa 借记卡发行方——Visa 2026 年 2 月官方新闻稿已确认——且拥有超过 800 万 Visa
              借记卡用户和 P43 billion 存款，这是采用质量和留存深度获得第三方强背书的信号，在这一指标上超过菲律宾所有传统银行。
            calloutType: strength
            claimRefs:
              - CU007
              - CU010
              - CU031
          - type: callout
            title: 零售伙伴集中是核心获客风险
            body: >-
              GoTyme SA 每月新增约 150,000 名客户，很大程度依赖 Pick n Pay、Boxer 和 TFG 门店自助机网络。GoTyme PH 的线上线下融合增长同样嵌入 Gokongwei
              集团零售。两项业务都还没有证明自己能大规模、纯线上获客，因此伙伴集中是最主要的客户增长风险。
