      - number: '7.2'
        title: 监管、法律与 AML/KYC 风险
        blocks:
          - type: paragraph
            body: >-
              南非 TymeBank（更名后以 GoTyme Bank Limited 运营）受 South African Reserve Bank 旗下 Prudential Authority 监管银行审慎标准，受
              Financial Sector Conduct Authority（FSCA）按 Financial Sector Regulation Act（No. 9 of 2017）监管市场行为，并由 National
              Credit Regulator（NCR）按 National Credit Act 监管消费者信贷。SARB 2026 年 4 月注册银行名单将 Cheslyn Jacobs 列为 GoTyme Bank
              Limited CEO，确认牌照仍有效。菲律宾方面，Bangko Sentral ng Pilipinas（BSP）于 2022 年 7 月 29 日向 GoTyme Bank Corporation 颁发
              Certificate of Authority，确认其符合 Bank Secrecy Act、Anti-Money Laundering Act、Customer Protection Act 和 Data
              Protection Act，并核验了稳健的 IT Risk Management Framework。南非在完善 AML/CFT 国家框架后，于 2023 年 10 月退出 Financial Action
              Task Force 灰名单；但 2021 年 FATF Mutual Evaluation 曾将南非多项评级定为 Partially Compliant，包括客户尽调和新技术，这说明 TymeBank
              所处系统性风险环境仍不可忽视。最急迫的法律风险，是 Home Affairs 拟按 FICA 将实时身份验证查询费从 15 cents 提高到 R10。Tyme CEO Coen Jonker
              称涨价是「对普惠金融的沉重打击」，公开报道也确认 TymeBank 正考虑采取法律行动。若 R10 费率落地且没有豁免，TymeBank 的 KYC
              获客成本会大幅上升；相比更多依赖夜间批量验证的传统银行，它的无网点、大众市场开户模型受冲击更大。Competition Commission of South Africa 和 POPIA（Protection
              of Personal Information Act）义务又增加了合规层，但公开记录未发现针对 TymeBank 的执法行动。
