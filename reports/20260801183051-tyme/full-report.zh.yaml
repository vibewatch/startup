      - number: '5.5'
        title: 信任、安全、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              公开可见的信任控制多于硬性可靠性指标。南非方面，GoTyme
              安全页列出生物识别、端到端加密、多因素认证、全天候欺诈监控、锁卡控制和定期安全审计；应用商店页面则强调安全开户、凭证卫生，以及与安全和稳定性绑定的产品更新。菲律宾方面，产品页强调 BSP 监管、PDIC
              存款保险，并针对加密资产进一步给出风险框架，包括 VASP 牌照、闭环资金保护，以及明确警示加密资产 不是存款产品。信任图景的不利面是结构性的，而非灾难性的。TechCentral 对 Home Affairs
              身份验证费用的报道显示，Tyme 的辅助开户模式仍依赖外部 KYC 轨道保持可负担。公开开发者信号也很薄：TymeBank GitHub 组织没有公开仓库，公开材料仍未说出核心银行供应商，也没有公布 正常运行时间
              / SLA 目标。因此，就控制和牌照而言，信任姿态足以支撑公开尽调草稿；但若没有管理层侧披露，还不足以做深度技术承保。
