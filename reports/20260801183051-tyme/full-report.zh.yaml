      - number: '4.7'
        title: 关键证据
        blocks:
          - type: callout
            title: 收入规模与效率拐点
            body: >-
              TymeBank 年收入已达到 R3.1B，成本收入比 83%，接近南非成熟银行的效率水平。自 FY2022 以来，收入复合增速年化超过 70%，税前亏损两年收窄 76%。无费用获客模型已以低成本累积 R7.7B
              存款基础，为增长中的贷款账簿提供资金。
            calloutType: strength
            claimRefs:
              - CI001
              - CI007
              - CI009
              - CI013
          - type: callout
            title: 持续经营重大不确定性：资本支持仅确认至 2026 年 10 月
            body: >-
              TymeBank FY2025 年度财务报表（2025 年 10 月，PwC 审计）包含持续经营披露，说明 Tyme Group 仅确认提供资本支持至 2026 年 10 月 31
              日。此后，持续经营取决于获得股东支持、额外融资，或完成计划中的 2028 年 NYSE IPO。这是任何投资人都必须对照 IPO 时间线评估的重大不确定性。
            calloutType: risk
            claimRefs:
              - CI036
              - CI026
          - type: callout
            title: 信贷减值增速快于收入
            body: FY2025 信贷减值费用同比增长 51% 至 R534M，超过 29% 的收入增速。减值目前占总收入 17%。增长中的贷款账簿天然需要更高拨备，但随着贷款组合成熟，减值增速值得密切监控。
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
          - type: callout
            title: 没有公开的集团合并损益表
            body: >-
              Tyme Group Pte Ltd（新加坡）是最终集团控股公司，但不发布合并财务报表。TymeBank SA 的经审计 IFRS 账目可得；GoTyme Philippines
              财务数据不可得。这限制了对集团层面经济性、公司间技术授权费用流，以及菲律宾扩张资本拖累的完整评估。
