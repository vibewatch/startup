      - number: '6.2'
        title: 采用轨迹和增长里程碑
        blocks:
          - type: paragraph
            body: >-
              GoTyme Bank SA 自 2019 年 2 月上线后客户增长曲线陡峭：2024 年 1 月宣布盈利时客户达到 850 万，2025 年 6 月 Basel Pillar III 披露显示注册客户达到
              1160 万。2024 年初，银行每月新增约 150,000 名客户；这一速度指向强劲有机增长，背后是既有零售网络带来的低边际 CAC。但 Pillar III 文件也显示，1160 万注册客户中只有 370
              万活跃客户，激活率为 32%。这一缺口很重要，管理层尚未公开解释，也让注册客户多数的参与深度存疑。菲律宾方面，GoTyme Bank Philippines 从 2022 年 10 月上线，到 2024 年 12
              月达到 510 万客户（BusinessWorld CEO 访谈），再到 2026 年 2 月按 Visa 官方稿超过 800 万 Visa 借记卡用户、客户存款 P43 billion。Visa 认定
              GoTyme PH 是菲律宾活跃 Visa 借记卡发行量第一，且 2025 年支付额同比增长超过 150%，这印证了存款和卡用户数据。GoTyme Bank PH CEO Nate Clarke
              将加速归因于未被充分服务的年轻市场、线上线下融合的自助机模式，以及 Gokongwei 零售网络。集团层面，Tyme Group 在 2025 年中披露两地客户合计超过 1700 万。
