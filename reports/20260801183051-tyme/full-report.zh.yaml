        - 8.2M 银行客户、2.1M 借款人，截至 2025 年 Q2 存款 P50B
        - 数字优先消费者和 MSME 客群
        - 支付、存款和信贷一体化，替代数据风控较强
        - 重促销和奖励竞争会压缩经济性
