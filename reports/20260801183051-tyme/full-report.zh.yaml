companyProfile:
  summary: >-
    Tyme Group 是一家注册在新加坡的数字银行控股公司，面向金融服务不足的新兴市场搭建并运营新银行；模式上把移动优先 App 与零售门店自助机开户结合起来。集团目前运营两家银行：TymeBank（南非，正更名为 GoTyme
    Bank SA）和 GoTyme Bank（菲律宾，与 Gokongwei Group 的合资公司）。第三个品牌 TymeX 设在越南工程中心，为集团提供共享技术平台。TymeBank SA 在 2023 年 12
    月实现首个单月盈利，FY2025 总收入达到 R3.11B（同比增长 29%），但实体层面仍亏损，FY2025 综合亏损总额为 R219M。GoTyme Philippines 于 2022 年 10 月上线，到 2026 年 5
    月客户数已超过 900 万，并按活跃使用量成为菲律宾第一大 Visa 借记卡发行方。2024 年 12 月，Tyme Group 完成 $250 million Series D，估值 $1.5 billion，由 Nubank
    领投（$150M 换取 10%），M&G Catalyst（$50M）和现有股东跟投。African Rainbow Capital 持有集团约 40%。累计融资约 $600 million。集团在各市场服务 1,700
    多万客户，全球员工超过 1,500 人。
