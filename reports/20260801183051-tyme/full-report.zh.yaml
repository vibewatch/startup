      - number: '7.3'
        title: 运营、技术与集中度风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank 将关键任务服务跑在 Amazon Web Services（ECS 和 EKS）上；TymeX 管理层称这次云迁移是集团连续造银行模型的基础。这带来单一供应商集中风险：AWS
              在非洲或亚太区域若发生故障，会同时影响 TymeBank SA 和 GoTyme Philippines，而公司没有公开披露
              SLA、恢复时间目标（RTO）或灾备拓扑。集团未在任何公开披露中说明核心银行供应商或账本技术栈，外部很难评估供应商锁定、迁移风险，或交易处理层是否存在单点故障。南非从 TymeBank 更名为
              GoTyme——GoTyme app 从 2026 年 1 月开始分阶段迁移——带来近期运营风险，包括客户沟通失误、银行卡迁移错误和产品功能不一致。TymeBank GitHub
              没有公开仓库，也就缺少关于安全基本功、依赖管理或代码节奏的公开开发者信号。除云集中之外，最大的单一运营风险是 KYC 通道：TymeBank 无网点模型依赖 Home Affairs National
              Population Register 的实时 FICA 身份验证；拟议 R10/次查询费会让自助机每新增客户成本估计增加 R40，显著高于现有成本结构。Retail Capital 的 SME
              商户现金垫款模型还带来信用运营风险，因为 SME 违约周期可能比年度信贷复核周期变化更快。
