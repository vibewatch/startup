      - number: '5.2'
        title: 产品线地图与能力成熟度
        blocks:
          - type: paragraph
            body: >-
              两个市场里，可见产品线都已超过简单活期账户。南非消费者菜单现在包括活期账户银行、GoalSave、定存、个人贷款、卡、即时支付和人工支持；企业端则增加营运资金融资、创业者社区功能，以及与 iKhokha
              连接的收款能力。菲律宾 App 覆盖日常银行、Go Save、多币种定期存款、转账、QRPh 支付、Visa 卡支付、奖励、加密资产，以及已披露的 BNPL
              沟通流程。成熟度不均衡是有意为之。核心开户、卡、储蓄和转账功能看起来成熟，因为它们横跨两国，并嵌入开户体验。加密资产、BNPL
              和南非更名期间的钱包升级等较新或更本地化模块，明显仍处早期，仍依赖本地监管批准、合作伙伴生态和分阶段功能上线。因此，模块地图支持这样一种判断：Tyme
              是一套带有各国特定外壳和附加模块的可复用平台，而不是一个跨境完全相同的产品。
