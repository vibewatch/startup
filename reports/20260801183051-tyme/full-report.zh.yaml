      - number: '4.5'
        title: SME 贷款与 GoTyme Philippines 财务贡献
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的 SME 部门 Retail Capital（2022 年 12 月收购）已向 50,000 多家南非企业投放 R9.5B 商户现金预支。GoTyme Business Advance
              为南非企业客户提供最高 R5M、无需抵押的贷款。SME 贷款垂直代表更高毛利的信贷产品品类，可补充零售贷款账簿并加深商户关系。国际市场方面，GoTyme Philippines 增长迅速：该银行到 2024 年
              12 月注册客户超过 510 万；自 2022 年 10 月上线后，前 18 个月签下 360 万客户。GoTyme PH 是与 JG Summit Holdings 和 Robinson's Retail
              的合资公司。其财务结果没有合并进 TymeBank SA 的 IFRS 报表；两家实体都并入 Tyme Group Pte Ltd（新加坡），而该集团层面的损益表未公开披露。TechCrunch
              曾报道，Series D 时合并集团在两个市场拥有超过 $400M 客户存款和 $600M SME 融资，与南非监管数据一致。GoTyme Philippines
              尚未单独披露盈亏平衡，菲律宾运营成本结构（快速增长带来的更高 CAC）也未知。
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
              - CI039
      - number: '4.6'
        title: 财务结论与未解决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的财务轨迹可信且持续改善。R3.11B 收入、83% 成本收入比，以及按全年 IFRS 口径走向盈亏平衡的路径，让它成为全球少数接近这一里程碑的数字银行之一。2024 年 12 月由
              Nubank 领投、估值 $1.5B 的 $250M Series D，验证了增长故事。但几个重大缺口仍阻止完整财务评估。第一，Tyme Group Pte Ltd
              不发布合并利润表，集团层面盈利能力、公司间费用流和集团控股成本分摊都不透明。第二，TymeBank FY2025 AFS 中的持续经营事项显示，股东支持只确认到 2026 年 10 月；持续经营取决于计划中的
              2028 年 NYSE IPO、进一步融资或股东继续出资。第三，GoTyme Philippines
              财务数据未公开，国际扩张带来的资本拖累存在不确定性。第四，信贷减值成本按比例增长快于收入，随着贷款账簿成熟，需要密切监控。ARC 约 40% 持股和 Nubank 关系提供了机构背书，但私募市场投资人和计划中的
              IPO 最终会检验估值假设。
            claimRefs:
              - CI023
