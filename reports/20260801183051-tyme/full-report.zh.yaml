            body: >-
              Tyme
              的护城河存在，但很窄。零售伙伴开户、自助机发卡，以及横跨南非和菲律宾的共享技术，可以比单国挑战者降低获客和搭建成本。这些优势对金融服务不足或心存怀疑、重视线下信任提示的用户最有价值。但当竞争从开户转向存款主账户地位、奖励深度和交易数据风控时，护城河会变弱。Discovery
              可以靠一体化保险和奖励栈抬高切换成本；GCash 可以靠商户接受度和超级 App 高频使用做到这一点；Maya 则明确在支付行为之上搭建更强的贷款和储蓄循环。公开证据还显示，GCash 和 Maya 都在探索
