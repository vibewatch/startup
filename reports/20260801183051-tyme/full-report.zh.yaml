  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论证类型
      - 论点
      - 关键证据
      - 哪些情况会改变这一观点
    rows:
      - - 论点
        - 可复制的银行搭建模型已在南非规模化验证
        - TymeBank 自 2023 年 12 月起盈利；FY2025 收入 R3.11B；9.6M 客户
        - 南非申报中每客户收入下降，或成本收入比大幅上升
      - - 论点
        - 与 Nubank 的战略合作压缩菲律宾扩张学习曲线
        - Nubank 以 $1.5B 估值投资 $150M；可借鉴 110M+ 客户增长范式
        - Nubank 脱钩，或自身市场地位明显恶化
      - - 论点
        - 新兴市场 TAM 大且渗透不足；监管顺风
        - GSMA 2024：1.75B 注册账户；增长集中在南非和东南亚
        - BSP/SARB 施加限制性资本或牌照要求，压低 TAM
      - - 反论点
        - 没有合并集团审计财务；菲律宾盈利未证实
        - 公开申报未披露集团 P&L；GoTyme 目标 2026 年盈亏平衡
        - 取得经审计集团账目，确认盈利轨迹
      - - 反论点
        - 倍数压缩风险：2022-23 年金融科技 P/S 倍数收缩 50-70%
        - Revolut $75B 估值反映私募市场偏热；历史上已有压缩先例
        - IPO 申报时，上市金融科技可比公司向上重估
      - - 反论点
        - ARC 40% 持股集中带来治理和退出依赖
        - TechCrunch 确认 Series D 后 ARC 仍保留约 40%；未披露治理细节
        - ARC 发布治理权利摘要，或正式披露股东协议
    notes: 论点和反论点权重并不相同。反论点部分的文件缺口，是 IC 准备度近期最大的担忧。
