        - 菲律宾利润率不达预期；宏观汇率逆风；IPO 市场窗口关闭
      - - 基准（50% 概率）
        - 2028-2029 年 IPO；22-25M 客户；GoTyme 菲律宾 2027 年盈亏平衡；无新市场；收入 $400-500M；4-6× 倍数
        - $1.6–3.0B；入场回报 1–2×；4-5 年年化 IRR 8–15%
