      - number: '5.3'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开架构披露来自 TymeX 和 AWS 支持的材料，而不是深度技术白皮书。Tyme 称 TymeX 是集团的多国技术和产品开发引擎，会打造可按国家本地化的自有可复用资产。TymeX
              页面进一步明确列出运营模式：微服务架构、容器化服务、持续代码部署、自动化测试、异步消息和全云托管基础设施。第三方 AWS 关联报道提供了更多细节，称 TymeBank 上线时把大部分基础设施迁移到 AWS，并在
              Amazon ECS 和 Amazon EKS 上运行关键任务服务；TymeX
              领导层则把集团描述为连续银行搭建者，速度和灵活性取决于云经济性。技术上的差异点不只是使用云——这已经很常见——而是把可复用银行平台与零售商生态中的实体分销配在一起。尚未披露的是核心栈最深处：公开来源仍没有说出总账
              / 核心银行供应商层，也没有公布面向客户服务的硬性正常运行时间目标。
