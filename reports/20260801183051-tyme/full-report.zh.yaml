  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Tyme 的公开材料描述的是一套围绕便利、辅助信任和低摩擦开户构建的银行工作流，而不是以网点为中心的开户流程。南非市场里，GoTyme 主打免费日常银行、储蓄、卡和支持服务，客户可经由
              App、自助机和客户中心访问。独立报道解释了这件事在运营上的重要性：自助机用户可借助基于指纹的身份检查完成验证，当场获批、打印卡片，并在无需到访网点的情况下开始交易。菲律宾市场里，GoTyme
              首页和介绍页描述了一条类似路径，但围绕 Gokongwei 零售分销和 Go Rewards 本地化。客户可以从 App 或自助机 开始，几分钟内拿到 Visa 借记卡，然后立即进入储蓄、转账、QR
              支付和奖励兑换。因此，产品定义最好理解为一条高科技、高触达工作流：在实体零售场景获客，在线上激活，再用相邻储蓄和支付工具扩大钱包份额。
