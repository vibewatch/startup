  productSummary: >-
    Tyme Group 的核心产品是一套可复用的银行搭建平台，包括：（1）移动优先的银行 App（储蓄、支付、贷款、保险），采用 API 优先架构；（2）自研自助机硬件，放在合作零售门店内，可即时开立账户并发行借记卡（Pick n
    Pay、Boxer SA；Robinsons PH）；（3）TymeX——越南团队打造的共享工程平台，承载核心银行、风控和合规；（4）Retail Capital，商户现金预支贷款部门（R9.5B 的南非 MCA
    组合）。GoTyme PH 提供储蓄账户、Visa 借记卡、QR 支付和小额贷款。
  customerFocus: 南非和菲律宾的大众消费者，尤其是金融服务不足、首次开户且经由店内自助机网络导入的用户。次级客群包括 Retail Capital MCA 产品服务的 SME，以及来自合作渠道的企业客户。
  businessModel: >-
    零售银行：净利息收入（贷款与储蓄利差）、手续费及佣金收入（交易费、卡交换费、保险佣金）和商户现金预支费用（Retail Capital）。收入在运营银行实体层面报告。不存在技术授权或 SaaS
    收入流；变现发生在受监管银行的损益表中。
