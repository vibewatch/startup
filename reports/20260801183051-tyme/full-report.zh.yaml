      - number: '1.3'
        title: 融资、股东与资本形成
        blocks:
          - type: paragraph
            body: >-
              Tyme 的资本历史显示，它从南非银行搭建者一路演进为新兴市场独角兽。公司 2023 年 5 月 Pre-Series C 公告称，股东合计投资 $77.8 million，Norrsken22 和 Blue
              Earth Capital 作为新投资方加入，资金将用于南非和菲律宾增长、东南亚扩张以及部分股份回购。同一公告披露收入运行率超过 $100 million、每月开户超过 30
              万，让投资人在完全盈利前先看到规模叙事。到 2024 年 12 月，TechCrunch 报道 Tyme 完成 $250 million Series D，估值 $1.5 billion；Nubank 以
              $150 million 出资领投，获得 10% 股权，M&G Catalyst 投资 $50 million，现有股东再投 $50 million。TechCrunch 还报道累计融资接近 $600
              million，African Rainbow Capital 仍持有约 40%。合作方资料拓宽了投资人名单：British International Investment、Blue
              Earth、Apis、Tencent、Gokongwei Group 和 Norrsken22 都出现在官方或股东沟通中。尚未披露的是 ARC 和 Nubank 这两个数据点之外的 Series D
