              首席执行官。这条交接顺序很重要：创始团队上移到集团战略层，运营银行则围绕新的职业经理人班子专业化。同一组证据也说明，最可见的治理披露仍集中在受监管银行层面，强于集团控股公司层面。公开材料能清楚识别创始人和高管，但没有公布完整的集团董事会、委员会图谱或
