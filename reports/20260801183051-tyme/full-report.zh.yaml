    rows:
      - - 先占地再扩张的产品交叉销售：活期账户 → 储蓄 → BNPL → 信贷 → 加密 / 投资
        - SA 只有一个零售分发网络（Pick n Pay、Boxer、TFG 自助亭）构成主要低成本获客引擎
        - 一旦零售合作协议丢失或重新谈判，CAC 会显著上升，净新增客户放缓
        - 确认与核心零售伙伴的合同条款、排他性安排和收入分成；评估替代分发后备方案
      - - PH 嵌入 Gokongwei 生态：Go Rewards 忠诚度 + Robinsons 零售网络
        - GoTyme PH 的线上线下一体化增长结构性绑定 Gokongwei Group 零售版图；网络外获客验证不足
        - Gokongwei Group 业务调整或战略分歧，可能减少自助亭触达并压低获客速度
        - 审查 JV 协议治理条款；评估 GoTyme PH 来自非 Gokongwei 获客渠道的表现
      - - 通过 Retail Capital 扩张 SME——GoTyme Business Advance 最高 R5M
        - Retail Capital 的商户现金预支组合集中在单一信贷产品类型；宏观或行业压力会让违约集中暴露
        - R9.5B+ MCA 账簿；若出现 10% 违约周期，将产生约 R950M 损失，单靠手续费收入无法抵消
        - 要求 Retail Capital 提供按放款批次的违约曲线、行业拆分和最大单一借款人敞口
      - - 进入第三市场（Vietnam、Indonesia），降低国家集中度
        - 收入目前只分布在两个市场；任何 SA 监管冲击或盈利逆转都会影响集团收入主体
        - SA 若出现 SARB 执法行动或资本成本冲击，将打击集团最成熟的利润中心
        - 跟踪 Indonesia / Vietnam 数字银行牌照监管时间线；评估第三市场何时贡献实质收入
    notes: >-
      扩张驱动因素和风险分析来自公开商业模式描述和新闻稿推断；没有内部风险披露。Retail Capital 组合规模来自 January 2024 新闻稿，可能已经变化。Retail Capital
