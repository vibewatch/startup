  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 风险 / 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - GoTyme 菲律宾未能盈亏平衡
        - GoTyme 菲律宾 2027 年四个季度 EBITDA 全部为负
        - 削弱双地域模型论点和 2028 年 IPO 准备叙事
        - 降级为持有；重新评估 $1.5B 入场估值；评估战略选项
      - - ARC 或 Nubank 折价二级出售
        - 任一股东按低于 $1.2B 的隐含集团估值进行二级交易
        - 主要投资者不预期估值恢复到 $1.5B+ 的一级市场信号
        - 立即重新评估；可能按市场价退出；降估值融资情境
      - - TymeBank 南非失去前三排名
        - Capitec、FNB 或其他挑战者在 SARB 数据中按客户数超过 TymeBank 南非
        - 核心资产恶化；建立在南非锚点上的集团论点走弱
        - 要求管理层解释；观察六个月；可能减仓
      - - IPO 推迟到 2030 年之后
        - 管理层公开宣布 IPO 目标推迟到 2030 年之后，且无战略理由
        - 流动性事件周期拉长；回报画像恶化；Series D 起资本锁定 8+ 年
        - 上调至治理评审；评估二级市场流动性选项
      - - 监管成本冲击导致获客成本增加超过 20%
        - Home Affairs 收费实施，或 BSP 数字银行政策把 KYC 成本推高到模型水平以上
        - 单位经济性恶化；回收期拉长；获客放缓
        - 修订经济性模型；评估缓释措施；寻求管理层评论
    notes: 否决触发因素是二元信号。财务和运营论点假设基准情境下这些事件均不发生；任何单一事件都应触发正式复审。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 集团层面审计财务
        - 合并集团 FY2025 和 H1-2026 的 P&L、资产负债表和现金流，纳入 TymeX 和 GoTyme 菲律宾
        - 无法验证集团盈利或亏损合并；仅有南非银行 P&L，不足以支撑 $1.5B 集团估值
        - 向 Tyme Group CFO 索取投资者更新包或管理账目
      - - Series D 后股权结构表
        - 完全摊薄股权结构表，包括持股比例、清算优先权、反稀释条款和强制随售权
        - 没有股权结构条款，无法评估优先权悬空、回报瀑布或下行保护
        - 向 Tyme CFO 或交易律师索取；审阅认购协议
      - - GoTyme 菲律宾盈利时间表
        - GoTyme Bank Philippines 截至 2026 年的季度 P&L 轨迹；经确认的盈亏平衡日期和路径
        - 基准情境依赖 2026 年菲律宾盈亏平衡；任何滑坡都会实质改变估值
        - 向 GoTyme 菲律宾 CEO 索取；审阅 BSP 监管披露
      - - ARC 在 Series D 后的治理权利
        - ARC 在集团控股公司层面持有的投票权、董事会席位分配、同意权和优先认购权
        - ARC 40% 持股集中是治理风险；没有控股公司条款就无法评估投资者权利
        - 向 ARC 投资者关系或 Tyme Group 法律顾问索取
      - - BII 退出及影响
        - 确认 BII 退出机制、退出价格，以及退出是否发生在 $1.5B 或以下
        - BII 退出表明，一个早期进入的发展金融投资者决定不再跟进
        - 向 Tyme IR 索取；交叉核对 BII 投资页面记录
    notes: 最终 IC 建议前必须完成这五项尽调。第 1 和第 2 项（集团财务和股权结构表）是任何投资承诺的阻断性尽调项。
    claimRefs:
      - CV043
      - CV044
      - CV047
      - CV048
