  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与市场触达
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 目前经营两块已经上线的银行业务：南非的 GoTyme Bank SA（原 TymeBank，2025–2026 年更名）和 GoTyme Bank Philippines；截至 2025
              年中，两地合计披露客户超过 1700 万。南非业务覆盖四类清晰人群：（1）大众零售消费者，看重零月费、可在 Pick n Pay、Boxer 和 TFG 自助机即时开户，以及高收益 GoalSave
              储蓄；（2）社会救助金领取者，依靠 Grant Advance 提前、免手续费拿到政府发放款；（3）通过 Retail Capital 获得营运资金的 SME 商户；（4）用 TymePOS
              接受无现金付款的微商户和 spaza 店主。菲律宾业务的核心人群是 Gokongwei 零售生态里的大众数字优先消费者——Robinsons 商场及关联零售门店的购物者，他们受益于 Go Rewards
              会员积分打通和店内自助机即时开户。TymeBank（现 GoTyme SA）引用的 Kantar 2021 年研究确认，客户加入主要因为没有银行收费、App 好用、零售触点便利、包容性、Smart Shopper
              积分，以及高于市场的储蓄利率。南非月收入 R25,000–R40,000 的消费者吸引力上升，说明客群正从最初的低收入人群向上漂移。GoTyme SA 的 Flex for Business 社区 App
              也吸引了 50,000 多名南非创业者，成为核心银行业务之外的品牌延展式留存工具。
