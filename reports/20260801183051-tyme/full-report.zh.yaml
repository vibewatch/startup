      - number: '6.5'
        title: 扩张动力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 的扩张策略遵循产品先落地再扩张：先用免费活期账户和银行卡获客，再交叉销售储蓄（GoalSave）、BNPL（MoreTyme）、信贷（个人贷款、Retail Capital
              垫款），以及日益增加的加密服务（GoTyme PH 持 VASP 牌照）。GoTyme SA 的 Business Advance 产品（最高 R5 million、无需抵押）把 SME 客群延伸到 Retail
              Capital 既有商户现金垫款账本之外。菲律宾方面，GoTyme PH 推出 MoreTyme、接入 Google Wallet/Google
              Pay、上线加密服务，反映同一条上行销售路径。集中度风险很大：南非业务依赖 Pick n Pay、Boxer 和 TFG
              分销合作，用低成本自助机网络获客；这一网络若出现重大中断，新增客户成本会上升，既有获客速度也可能被打断。菲律宾方面，GoTyme PH 在结构上嵌入 Gokongwei 集团零售生态，利益更一致，但银行在
              Gokongwei 网络之外的增长还缺少充分验证。SME 层面，Retail Capital 的 R9.5 billion
              组合集中在商户现金垫款，这类产品天然对商户收入波动敏感。公司未公开披露头部客户集中度数据。Tyme Group 的第三市场战略（越南或印度尼西亚）意在降低国家集中度，但截至 2026 年 5
              月本次报告运行日，第三个市场尚未披露任何真实银行客户。
