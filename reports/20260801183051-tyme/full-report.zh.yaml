      - number: '2.3'
        title: 买方、用户、付费方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              在 Tyme
              的市场里，买方、用户和付费方常常是同一个人，但采用路径仍由生态、雇主、商户和政府轨道居中影响。最重要的客户群包括：需要低成本主账户的工薪大众成年人；希望更安全储值、低摩擦支付的现金依赖家庭；需要营运资金和收款能力的微型商户与
              MSME；以及提供开户实体触点的生态伙伴。南非的零售商辅助开户很关键，因为数字接入已经广泛，但可负担性、信任和实体现金行为仍塑造使用。菲律宾账户拥有率较低，但智能手机、电子货币和快速数字化的零售支付已经带来较高数字熟悉度。因此，产品旅程往往从支付和存款开始，再扩展到储蓄、工资关联或个人信贷，以及商户金融。付费逻辑也因用例而异：家庭自掏腰包，商户用手续费或融资利差付费，生态伙伴则把
              自助机、卡和奖励嵌入既有客流，事实上补贴获客。Tyme 的市场进入逻辑因此取决于产品顺序能否贴合客户准备度：先支付和开户，再活跃使用，最后在交易数据和信任积累后加深贷款。
