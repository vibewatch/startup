      - number: '4.4'
        title: 单位经济代理指标与成本结构
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 没有公开披露 TymeBank SA 或 GoTyme Philippines 的客户获取成本（CAC）、生命周期价值（LTV）、ARPU
              或净收入留存指标。公开披露可以推导代理估算。按总注册客户计，年收入约 R267（R3.11B / 1,160 万客户）；按活跃客户计，年收入约 R838（第三支柱口径 370 万活跃客户）。按总客户计，运营费用约
              R155/年（R1.80B 运营费用 / 1,160 万客户），意味着扣除信贷减值前单客运营贡献为正。若把 R534M 信贷减值费用分摊到 370 万活跃客户，相当于每活跃客户
              R144，使全口径运营亏损约为每活跃客户每年 R59——较 FY2024 估算的每活跃客户 R94 亏损大幅改善。无月费意味着 TymeBank
              在获客时有意放弃费用收入，依靠交叉销售高毛利产品（定存、MoreTyme BNPL、商户现金预支）逐步改善单位经济。Solidarity 研究确认，TymeBank 交易成本比南非大型银行低
              30-50%，支撑价值主张，但也压缩单笔交易手续费收入。与 Sanlam Personal Loans 的合资安排，依托 SPL 的 R6B 账簿发放和管理无抵押贷款，是迈向更高毛利信贷收入的一步。
