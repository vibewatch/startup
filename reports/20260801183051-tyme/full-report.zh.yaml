      - number: '1.4'
        title: 里程碑、品牌重塑与外部依赖
        blocks:
          - type: paragraph
            body: >-
              作为一家私营金融科技公司，Tyme 的里程碑记录罕见清晰。独立报道把业务追溯到 2012 年由 Coenraad Jonker 和 Tjaart van der Walt 创建的移动货币与金融服务项目；随后是
              Commonwealth Bank of Australia 在 2015 年收购该技术平台，2017 年完成南非银行牌照流程，African Rainbow Capital 在 2018 年收购
              TymeDigital，以及 TymeBank 在 2019 年 2 月商业上线。此后，运营模式由实体分销合作定义——尤其是 Pick n Pay、Boxer、TFG 和更广泛的 Gokongwei
              生态——同时加入 SME 贷款、BNPL 和工资关联信贷等产品。下一个重要里程碑是品牌收敛：南非银行的现网已运行在 gotyme.co.za，TechCentral 报道管理层计划在 2026 年上半年完成
              GoTyme 更名。里程碑的不利面在于，Tyme 仍暴露在影响低收入开户经济性的政策决定下。2025 年 6 月，Tyme 管理层称正考虑就 Home Affairs
              拟提高身份验证费用采取法律行动，理由是费用上调会推高获客成本并削弱金融包容。该争议具有战略重要性，因为 Tyme 的无网点大众市场模式依赖低成本
              KYC、零售商辅助开户，以及能让服务金融不足客户保持经济可行的监管环境。
