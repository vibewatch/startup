            body: >-
              截至 2025 年 6 月 30 日，TymeBank 资产负债表总资产增至 R11.09B，较 2024 年 6 月的 R6.67B 增长 66%。客户存款达到
              R7.66B，提供稳定的低成本资金基础。净贷款合计 R2.25B（+17%），金融资产（主要是为流动性持有的政府债券）为 R5.13B。风险加权资产增长 46% 至
              R5.36B，反映贷款账簿快速扩张。即便如此，监管资本比率仍远高于最低要求：CET1 为 21.29%（监管最低约 11%），总资本比率 21.73%，杠杆率
              11.23%。银行的巴塞尔第三支柱披露在权益端列示集团累计亏损 R7.72B，反映 2015 年以来的累计投入；这部分由 2025 年 6 月 R2.09B 的集团权益部分抵消。FY2025 AFS
              的持续经营附注称，Tyme Group 已确认提供资本支持至 2026 年 10 月 31 日；但此后仍存在“重大不确定性”，取决于计划中的 NYSE IPO、额外融资或股东继续支持能否完成。Nubank
              2024 年 12 月的 $150M Series D 投资已显著增强资本位置。
