      - number: '6.4'
        title: 留存、满意度和韧性证据
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 的公开留存证据有限，没有披露 NRR、GRR 或 cohort 数据。最强的韧性信号来自三个代理指标：（1）TymeBank 的 NPS；Kantar 2021
              年研究称，在南非低收入和中等收入客群中，它位列零售银行最高梯队；（2）2025 年 6 月 Pillar III 文件披露的活跃 / 注册比例为
              32%，这是一个需要管理层澄清的警示数字——它可能反映早期大规模获客活动留下的沉睡账户，也可能来自该行零摩擦、低门槛的开户模型；（3）GoTyme PH 存款从 2024 年 12 月 P24 billion
              增至 2026 年 2 月 P43 billion，说明客户并非只开户一次，而是在持续留下余额、形成显著净留存。TymeBank（现 GoTyme SA）的 GoalSave 产品对锁定储蓄提供最高年化
              10%，是储蓄客群的粘性机制。MoreTyme BNPL 按 2024 年 1 月新闻稿已覆盖 5,500 多家实体店和 1,200
              多个电商网站，可制造反复交易接触，应该支撑零售消费者客群留存。HelloPeter 是南非主要消费者投诉平台，平台将 GoTyme/TymeBank 列为可检索实体，但内容需要 JavaScript
              渲染，本次审阅无法取得具体评分数据。GoTyme Philippines 尚未公开披露净推荐值或 CSAT 指标。
