  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与可比公司
        blocks:
          - type: paragraph
            body: >-
              Tyme 面对的不是一组整齐的同业。南非市场里，它要同时打三条战线：Capitec 是最接近的大众市场数字标杆，Discovery
              是收入更高客群里的数字加奖励挑战者，大型传统银行仍主导资产负债表深度、网点、现金基础设施和 SME 资金。PwC 2026 年 3
              月主要银行回顾清楚表明，南非大型银行资本充足，并强烈聚焦数字增长，即便挑战者银行开始重塑下一轮周期。菲律宾市场里，替代品范围比持牌数字银行更广。GCash 已经在全国尺度掌握日常支付普及度，Maya
              正把支付转化为高增长存款和信贷引擎，而传统综合银行仍控制重要的工资、信任和多产品关系。实际含义是，Tyme 争夺的是主账户使用和交易频次，而不只是首次开户。
