chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、架构与运营版图
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 称自己是一家聚焦新兴市场的多国数字银行集团，围绕高科技、高触达的银行模式组织业务，并嵌入实体零售生态。当前公开公司网站是 tyme.com，而不是任务简报中给出的停放域名
              tymegroup.com；官网把新加坡列为集团总部，同时强调南非、菲律宾和越南技术中心这几块主要运营版图。南非一侧，TymeBank 于 2019 年 2 月上线；到 2026 年 5
              月，面向消费者的网站已跳转到 gotyme.co.za，显示南非业务正在推进更广泛的 GoTyme 品牌统一。菲律宾一侧，GoTyme 于 2022 年 10 月与 Gokongwei Group
              联合上线，同样靠自助机、借记卡和 App 优先开户，把零售带动的开户逻辑落地。集团官网披露客户数超过 1,500 万、员工超过 1,500 人；2025 年后续公司沟通则把客户数放在 1,700 万以上，因为
              Tyme 又增加了印度尼西亚和香港贷款业务等新市场。也就是说，Tyme 不是单一国家的数字银行，而是一套可复用的银行搭建平台：一个成熟的南非资产、一个快速扩张的菲律宾合资公司，以及早期相邻市场扩张。
