      - number: '7.6'
        title: 展项
        blocks:
          - type: callout
            title: 持续经营资本窗口将于 2026 年 10 月关闭
            body: >-
              FY2025 AFS 的持续经营披露，是外部投资者面临的单一最重要风险：Tyme Group 确认对南非银行的资本支持只到 2026 年 10 月 31 日，之后取决于能否完成 NYSE
              IPO、募集额外股权或获得股东继续支持。ARC 或其他股东尚未公开承诺在该日期后继续支持。若 IPO 延迟或撤回，公司可能需要按不利条款取得紧急过桥资金。
