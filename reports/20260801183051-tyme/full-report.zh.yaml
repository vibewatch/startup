  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现模型
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的收入模型建立在两条主线之上：来自存款支持资产负债表的净利息收入（NII），以及来自日常交易活动的手续费及佣金净收入。银行不收月度维护费，而是依靠存款利率（低成本活期账户、GoalSave 和
              11% 年化定存）与 R2.25B 净贷款账簿利率之间的利差，再加上卡交换费、MoreTyme BNPL 放款和商户服务带来的费用收入。截止 2025 年 6 月 30 日的年度，NII 合计 R1.24B（同比
              +18%），手续费总收入 R1.55B（同比 +38%），但 R662M 的手续费支出把手续费净收入压到 R886M。其他经营收益 R45M（外汇及杂项）补足收入端。TymeBank 的 SME 贷款部门
              Retail Capital 已投放 R9.5B 商户现金预支，带来额外信贷利差。GoTyme Philippines
              贡献集团客户增长，但其单独财务结果没有在集团层面公开合并。无费用获客策略压低了单客手续费收入，却推动存款累积，并用低成本资金支撑生息资产账簿。
