      - number: '8.4'
        title: 情景分析：牛市、基准与熊市案例
        blocks:
          - type: paragraph
            body: >-
              三个情景覆盖 Series D 以 $1.5 billion 进入后的合理投资结果。牛市情景下，Tyme 按计划在 2028 年完成 NYSE IPO，集团客户超过 3000 万，GoTyme
              Philippines 按目标在 2026 年盈利，新市场（越南、印度尼西亚）贡献增量收入。沿着这条轨迹，以估计集团收入 $600–700 million、5–8× 收入倍数计算，IPO 估值为 $3–5.6
              billion；在潜在后续融资轮稀释前，Series D 价格对应 2–4× 回报。Nubank 对比在方向上提供支持：Nubank 从 IPO 前 $25 billion 估值时约 1000
              万客户，四年内增长到 1.1 亿客户、市值 $60 billion。


              基准情景假设执行中等：GoTyme Philippines 达到盈亏平衡，但盈利推迟到 2027 年；新市场进入推迟到 2029 年；集团到 2028 年达到 2200–2500 万客户。若按 $400–500
              million 集团收入、4–6× 收入倍数 IPO，估值为 $1.6–3.0 billion。该区间低端意味着 Series D 投资者在稀释前接近或刚好回本。Nubank 按 10%
              优先股位置定价，若能代表整体股权结构表，则后续权益层相对企业价值的优先权悬垂可能有限——但公开证据无法确认。


              熊市情景由倍数压缩和执行失误驱动。若全球金融科技 P/S 倍数从 2024 年峰值到 2028 年收缩到 2× 收入，而集团收入只有 $300 million（菲律宾监管摩擦或 GCash、Maya
              竞争加剧导致增长不及预期），隐含估值 $600 million，相当于 Series D 价格损失 60%。尾部风险是 IPO 结构性推迟到 2030 年之后，这会拉长持有期并进一步压缩年化回报。南非 Home
              Affairs 身份验证费争议带来的监管风险，又增加了一个下行情景：获客成本可能上升 20–30%，并压缩单位经济性。
