  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚与 Series D 背景
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 最近且最权威的估值锚是 2024 年 12 月 Series D：融资 $250 million 后，投后估值为 $1.5 billion。Tyme Group 官方新闻稿确认，Nubank
              领投本轮，以 $150 million 投资取得约 10% 股权，意味着 Nubank 进入时按投后 $1.5 billion 为公司定价。TechCrunch 独立报道了同样条款，并指出 Tyme
              自成立以来累计融资约 $600 million。本轮结构增加了可信度：Nubank 这种量级的战略投资者——本身是在 NYSE 上市、市值 $60 billion 的公司——独立尽调后按 $1.5 billion
              定价，这是有意义的第三方锚，而不是只有发起方自己标价。


              Series D 之前，早期轮次也给出清晰递进。2023 年 5 月 pre-Series C 融资从 Norrsken22 和 Blue Earth Capital 获得 $77.8 million；Tyme
              官方稿披露，当时年化收入超过 $100 million，每月新增 300,000 名客户。2021 年 Series B 融资 $180 million，投资方包括 Tencent 和 CDC（现 British
              International Investment）。African Rainbow Capital 在 Series D 后仍持有约 40%，意味着单一南非锚定股东在治理上权重很高。


              估值背景有两个重要限制。第一，TymeBank 法定文件（AFS 2025、Pillar III 2025）包含南非实体数据，但不披露集团合并经济性，因此无法把 $1.5 billion 标价独立对应到集团
              P&L。第二，BII 投资页面将 Tyme Bank 投资状态列为截至 2025 年 12 月已退出，缩小了开发金融机构投资者基础的广度。尽管有限制，Series D 价格仍是第 8
              章构建情景时最可辩护的公开基准。
