      - number: '6.3'
        title: 具名客户与落地证明
        blocks:
          - type: paragraph
            body: >-
              GoTyme Group 客户基础的真实运营证据覆盖四类落地形态。第一，南非零售消费者业务已全量投产，2024 年 1 月客户突破 850 万，并在 2023 年 12
              月实现银行层面盈利——这是非洲首家做到这一点的数字银行。第二，SME 和微商户板块有 Retail Capital 超过 50,000 名活跃商户借款人、累计投放 R9.5 billion 营运资金作为证据；按
              2024 年 1 月新闻稿，年化组合增速约 30%。第三，GoTyme Bank Philippines 的消费者落地由 Visa 认证：800 多万活跃 Visa 借记卡持卡人、P43 billion
              存款。第四，社会救助金客群有明确记录：截至 2024 年 1 月公告，Grant Advance 客户中 78% 是照护者，13% 是老年补助领取者，10%
              是残障补助领取者，显示公司有意瞄准普惠金融人群。第五类形态——使用 TymePOS 的城镇区微商户——仍处早期推广，公开资料只记录了与 Khona La Local Stores 的试点合作。Forbes
              菲律宾最佳数字银行奖（GoTyme PH 连续两年）和 Visa 借记卡第一排名，为消费者业务质量提供了独立第三方背书；不过 Forbes 奖项背后的底层数据未公开披露。Robinsons Retail 合作在
              2022 年 11 月 GoTyme PH 上线时正式确立，把银行嵌入菲律宾主要零售连锁，并凭 Go Rewards 会员整合形成线上线下融合的获客渠道。
