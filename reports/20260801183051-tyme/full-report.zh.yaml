  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 阶段 / 类型
      - 估值 / 市值
      - 关键指标
      - 与 Tyme 的相关性
      - 局限
    rows:
      - - Nu Holdings（Nubank）
        - 上市（NYSE:NU）；成熟数字银行
        - 约 $59.75B 市值（2026 年 5 月）；TTM P/E 约 19×
        - 110M 客户；2023 年收入 $8B+；2026 年提交 20-F
        - Series D 领投方；在新兴市场有直接运营可比性
        - 规模成熟；拉美市场；货币和监管画像与南非 / 菲律宾很不同
      - - Revolut
        - 私营；后期；泛欧洲 / 全球
        - $75B（2025 年 11 月私募轮）
        - 全球 40M+ 客户；金融科技产品套件广
        - 高端估值基准；显示私募市场对数字银行仍有胃口
        - 欧洲监管结构；竞争环境很不同；仅为 IPO 前参照
      - - Moniepoint
        - 私营；Series C；非洲金融科技
        - 约 $1B（2024 年 10 月 Series C）
        - 商业支付驱动；聚焦尼日利亚
        - 相邻阶段的直接非洲金融科技同业；验证新兴市场独角兽需求
        - 支付权重高，非存款驱动模型；尼日利亚市场不同于南非；公开财务有限
      - - Maya Bank（菲律宾）
        - 私营；数字银行
        - 未公开披露；菲律宾实体已盈利
        - 2025 年净利润 PHP1.7B；PLDT Group 子公司
        - 菲律宾市场直接可比；证明菲律宾数字银行经济性可以跑通
        - 背靠 PLDT 集团；所有权结构不同；独立可比性有限
      - - GoTyme 菲律宾同业池（BSP 持牌）
        - 私营；菲律宾数字银行队列
        - BSP：2025 年菲律宾数字银行存款 PHP139B
        - 多家持牌数字银行；BSP 监管
        - 显示 GoTyme 身处增长但竞争激烈的市场
        - 队列合计值，不是单体；GoTyme 份额未公开披露
      - - TymeBank 南非隐含入场估值（Series D）
        - 私营；IPO 前；南非持牌数字银行
        - $1.5B 集团投后估值（2024 年 12 月）
        - 2024 年 6 月约 9.6M 客户，仅 TymeBank；到 2025 年 6 月集团客户 17M+
        - 所有情境的自我参照锚点
        - 集团估值包含 GoTyme 菲律宾和 TymeX；单独南非银行估值会更低
    enumerationScope:
