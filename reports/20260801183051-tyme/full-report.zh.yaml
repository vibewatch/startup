              Tyme 的公开领导层资料和银行披露显示，治理结构分层，横跨集团控股公司、南非银行、菲律宾银行和越南产品工程单元。Tyme 官网列明：Coenraad Jonker 是 Tyme 执行主席兼联合创始人，David
