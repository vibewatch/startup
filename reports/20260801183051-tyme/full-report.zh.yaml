  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Tyme 的可服务市场比抽象意义上的“银行业”更窄。公司争夺的是南非和菲律宾金融服务不足消费者与 SME
              的日常金融生活：交易账户、工资和账单流、储蓄余额、商户及个人信贷，以及相邻的数字支付活动。这不同于企业资金管理、投行、财富管理或纯保险支出；这些都不在 Tyme
              零售嵌入式模式的实际采用路径内。南非和菲律宾的公共政策文件强化了这一界定。South African Reserve Bank 的数字支付路线图把竞争、互操作性和包容性直接绑定到低成本交易流；BSP
              路线图则把支付和交易账户描述为进入正规金融包容的入口。因此，最强的既有替代品不是高端全服务银行组合，而是传统零售银行账户、现金、电子钱包、工资关联借款，以及非正式或半正式 SME
              融资。在两国，大众市场机会不太取决于说服已经富裕且多银行的客户换行，更取决于把现金占比高、数字可触达的成年人和商户转化为活跃的账户、支付和信贷用户。账户深度与首次接入的差异，让 Tyme
              的零售商辅助数字模式即便在正规账户拥有率已相对较高的市场也具备经济意义。
