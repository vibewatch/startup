      - number: '8.6'
        title: 展项
        blocks:
          - type: callout
            title: 信息不对称是主导风险
            body: 投资建议面临的最大单一风险，是缺少集团层面合并审计财务。本章所有情景分析都建立在 TymeBank SA 法定文件和管理层表述外推之上。南非实体经济性与集团经济性之间的缺口未知，且可能很大。
            calloutType: risk
            claimRefs:
              - CV043
          - type: callout
            title: Nubank 以 $150M 入局，是最可信的外部估值信号
            body: Nu Holdings 是一家有自身股东、SEC 文件和声誉约束的上市公司。它在独立尽调后按 $1.5 billion 定价，是公开证据中最可辩护的第三方锚。其战略理由（新兴市场模式迁移）也连贯且有文件支持。
            calloutType: strength
            claimRefs:
              - CV002
              - CV019
          - type: callout
            title: 五项尽调材料是任何承诺的前置条件
            body: 集团审计财务、Series D 后股权结构表、GoTyme PH P&L 轨迹、ARC 治理权利和 BII 退出条款均缺失。这些都无法从公开来源推断。五项材料全部收到并审阅前，不应出具最终 IC 建议。
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV047
