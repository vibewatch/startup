            body: >-
              Tyme 的部署姿态更多体现在产品如何上线和支持，而不是正式 SLA。南非更名给出了最近最好的信号。Moneyweb 报道，新 GoTyme App 于 2026 年 1 月 22 日按分阶段迁移计划上线；iOS
              页面确认 1.6.0 版本新增 Apple Pay，并明确提到后续还会围绕质量、可靠性和安全继续分阶段上线。这支持一个判断：Tyme
              主动升级南非客户层，而不只是给品牌换漆。菲律宾市场里，产品范围仍在拓宽：GoTyme 产品页现在包括加密资产，BNPL 沟通页则确认 BNPL 申请有独立通知流。Tyme
              新闻室也显示，公开沟通由里程碑驱动，而非工程驱动；这有助于追踪上线，但对发布节奏、事故历史或客户层面服务表现，公开证据有限。支持本身仍是部署模型的一部分：南非提供电话人工支持，菲律宾提供热线 /
