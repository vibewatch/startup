      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场驱动真实且可量化。BCG 认为，非洲是全球增长最快的金融科技区域，收入到 2030 年可能增长 13 倍至约 $65 billion，并指出超过一半的非洲金融科技公司经营支付和贷款——这正是 Tyme
              最需要的品类。在菲律宾，监管机构已经把数字零售支付推到路线图目标之上，为数字银行获客搭起有利的基础设施底座。但结构性摩擦仍然很重。南非方面，GSMA
              点出设备可负担性、电费、基础设施犯罪、监管不确定性和数字技能缺口，都是深化数字采用的现实障碍。BIS 和 SARB 也指出，南非仍高度依赖现金；PayShap
              这类新轨道虽有前景，但尚未在大众市场规模上完全替代现金。放到整个非洲，BCG 认为薄档案
              SME、薄弱征信、高资本成本和数据碎片化仍限制基于风险的贷款深度。菲律宾方面，家庭层面的正规账户接入改善了，但个人账户拥有率下滑，说明只有账户接入并不能保证深度产品使用。对 Tyme
              的投资结论是：数字账户和支付增长具备强结构性，但有利可图的市场获取仍要逐国解决信任、KYC、数据和信贷深度瓶颈。
