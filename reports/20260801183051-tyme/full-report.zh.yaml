          label: 关键风险
          detail: 无集团 P&L；PH 盈利未确认；股权结构不透明
        - id: gaps
          label: 信息缺口
          detail: 缺少集团财务、股权结构、ARC 治理、BII 退出条款
        - id: recommendation
          label: 投资建议
          detail: 投机性买入，高风险评级，取决于 5 项尽调事项
      edges:
        - from: scale
          to: recommendation
        - from: financing
          to: recommendation
        - from: comps
          to: recommendation
        - from: risks
          to: recommendation
        - from: gaps
          to: recommendation
    approximationNotes: 流程表示投资建议的逻辑输入，不是量化模型。每个节点都是本章某个完整章节或表格的摘要。
  - id: FV002
    title: 估值敏感性
    type: bar
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV017
      - CV021
    data:
      items:
        - label: 熊市（2× 收入，$250M 收入）
          value: 500
          unit: USD million
          tone: negative
          detail: 按 $250M 集团收入取 2× 收入 = $500M 隐含估值
        - label: 基准低位（4× 收入，$400M 收入）
          value: 1600
          unit: USD million
          tone: neutral
          detail: 按 $400M 取 4× 收入 = $1.6B；接近 Series D 入场价
        - label: 基准中位（5× 收入，$450M 收入）
          value: 2250
          unit: USD million
          tone: neutral
          detail: 按 $450M 取 5× 收入 = $2.25B；较入场价小幅上行
        - label: 牛市（6× 收入，$600M 收入）
          value: 3600
          unit: USD million
          tone: positive
          detail: 按 $600M 取 6× 收入 = $3.6B；相对 $1.5B 入场价 2.4×
        - label: 高位牛市（8× 收入，$700M 收入）
          value: 5600
          unit: USD million
          tone: positive
          detail: 按 $700M 取 8× 收入 = $5.6B；相对 $1.5B 入场价 3.7×——需要 Nubank 式加速
    approximationNotes: 收入和倍数假设仅作示意。集团合并收入未公开披露；数字由 TymeBank SA（R3.11B FY2025）外推，并加入估算的 GoTyme PH 贡献。倍数参照 Nubank P/S 和同业组分析。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
    data:
      items:
        - label: 熊市退出估值
          low: 400
          mid: 650
          high: 900
          unit: USD million
          detail: 降轮或低迷 IPO；相对 $1.5B Series D 入场价 0.3–0.6×
        - label: 基准退出估值
          low: 1600
          mid: 2200
          high: 3000
          unit: USD million
          detail: 温和 IPO；相对 Series D 入场价 1–2×；取决于 2028 窗口
        - label: 牛市退出估值
          low: 3000
          mid: 4200
          high: 5600
          unit: USD million
          detail: 上行 IPO；相对 Series D 入场价 2–4×；需要菲律宾成功和新市场
    approximationNotes: 区间反映场景带，而非建模分布。中点是各场景内分析师的中心估计。未建模 IPO 前潜在追加融资轮带来的稀释。
  - id: FV004
    title: 投资 KPI
    type: kpi
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV017
      - CV043
      - CV044
      - CV047
    data:
      items:
        - label: 市场证据质量
          value: Medium
          period: May 2026
          tone: neutral
          detail: Series D 价格由 Nubank 入场锚定；无集团审计 P&L
        - label: 规模证据
          value: High
          period: Jun 2025
          tone: positive
          detail: 17M+ 客户；SA 已盈利；GoTyme PH 拥有 5.1M 客户和存款
        - label: 护城河强度
          value: Medium
          period: May 2026
          tone: neutral
          detail: 零售自助柜台分销有差异化；既有银行可用资本开支复制
        - label: 单位经济质量
          value: Medium-low
          period: FY2025
          tone: neutral
          detail: SA 申报数据强；PH 和集团未确认；仅披露 SA 收入
        - label: 估值纪律
          value: Medium
          period: Dec 2024
          tone: neutral
          detail: $1.5B 相对 Nubank 可比估值有支撑，但要取得有意义回报，需要牛市情景执行到位
        - label: 退出准备度
          value: Medium
          period: 2028 target
          tone: neutral
          detail: 指引 2028 年 NYSE IPO；SA 盈利已确认；PH 和集团盈亏平衡未确认
        - label: 信息完整度
          value: Low-medium
          period: May 2026
          tone: warning
          detail: 5 项阻塞尽调事项；无集团 P&L；股权结构未披露；BII 退出未验证
    approximationNotes: KPI 评估仅基于公开证据。可提交 IC 的打分只作建议，不能替代完成尽调。
