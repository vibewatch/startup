      - number: '7.4'
        title: 竞争与战略风险
        blocks:
          - type: paragraph
            body: >-
              在南非，Capitec 仍是主导性的挑战者银行竞争对手，并且在 Home Affairs 费用争议中主动站到对立面，公开支持 DHA 的涨费计划。这说明 Capitec 可能把费率结构视为打击更依赖实时 FICA
              验证的金融科技公司的竞争工具。Capitec FY2026 利润增长 23%，相较仍在报告净亏损的 TymeBank，单位经济差距进一步拉开。Discovery Bank 客户达到 100
              万，证明高端客群已经有人竞争。TymeBank 计划 2028 年进入南非银行前三，这需要它从当前不到 2% 的市场份额持续拿到存款份额，是一条多年路径，执行风险不小。菲律宾方面，GoTyme 面对
              GCash（Mynt）——直到 2026 年仍有 IPO 猜测——以及 Maya Bank，后者 2025 年净收入 PHP 1.7 billion。菲律宾数字银行存款 2025 年达到 PHP 139
              billion；GoTyme 的 PHP 40 billion 份额有意义，但相对 GCash 生态仍有大量空间要追。GoTyme Philippines 2025 年 Q1
              盈利里程碑令人鼓舞，但资本充足的对手持续施压，维持获客动能还需要持续投放营销和产品投资。集团层面的战略风险是 NYSE IPO 执行：若 IPO 成功且估值不低于 $1.5 billion Series
              D，将验证投资论点；但市场环境不利或财务里程碑落空，可能迫使公司以低于 Series D 的价格发行，或推迟上市并挤压 2026 年 10 月资本承诺窗口。
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
      - number: '7.5'
        title: 治理、国家与执行风险
        blocks:
          - type: paragraph
            body: >-
              African Rainbow Capital 在 2024 年 12 月 Series D 后仍持有 Tyme Group 约 40%，以相当大幅度成为主导股东。ARC
              的持股提供融资确定性，也与南非市场发展保持一致，但同时形成治理集中：ARC 自身财务状况会影响其继续提供资本支持的能力和意愿，任何 ARC 战略转向都可能限制 Tyme 的选项。Nubank 持股约
              10%，带来战略合作和品牌信用，但它也是另一个大股东，有自己的巴西中心战略议程。Series D 后完整股权结构表从未公开，仅凭公开证据无法评估治理权利。Tyme Group Pte Ltd
              注册在新加坡，运营银行位于南非和菲律宾，越南有技术实体，集团 CEO 常驻荷兰——多司法辖区控股结构增加了实体间资本流动、内部定价和监管报告义务的复杂度。南非结构性经济逆风包括 30%
              以上失业率、限制政府支持数字普惠项目的财政压力，以及偶发影响自助机和网络连接 uptime 的电力基础设施约束。IMF 和 World Bank 对南非的国别评估将主权债务轨迹和财政整顿风险列为中期关切。菲律宾
              GDP 仍保持正增长，但 BSP 监管演进——包括可能提高数字银行资本要求——可能要求合资伙伴追加资本。持续经营披露叠加多司法辖区控股结构和有限的公开股权结构透明度，意味着相较一家估值 $1.5
              billion、准备在主要交易所上市的公司，外部投资者能看到的信息更少。
            claimRefs:
