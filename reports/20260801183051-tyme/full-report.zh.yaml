      - number: '8.3'
        title: 可比公司组合与倍数基准
        blocks:
          - type: paragraph
            body: >-
              为 Tyme 构建可比组，需要区分公开市场基准（设定倍数天花板和地板）、私募轮次基准（校准相似阶段同业定价）和新兴市场专属参考（调整地理风险溢价）。最直接的公开可比公司是 Nu Holdings（NYSE:
              NU），即 Nubank 母公司。截至 2026 年 5 月，Yahoo Finance 数据显示 Nu Holdings 市值约 $59.75 billion，滚动 P/E 为
              18.9×，服务巴西、墨西哥和哥伦比亚超过 1.1 亿客户。Nu 2026 年 4 月向 SEC 提交的 20-F 确认 2025 全年盈利并持续增长收入。按 Nubank 的规模，其市值隐含每客价格约
              $543，显著高于 Tyme Series D 隐含的 $100。


              私募轮次同业中，Revolut 可作为高端参考：Wikipedia 报道 Revolut 2025 年 11 月估值 $75 billion，隐含倍数远高于 Tyme 目前水平。Moniepoint
              是更接近的非洲金融科技同业，2024 年 10 月 Series C 估值 $1.0 billion，拥有强劲尼日利亚支付基础——地理和阶段上直接可比，但产品组合不同。菲律宾方面，Maya Bank（原
              PayMaya）2025 年净收入 PHP1.7 billion；菲律宾数字银行整体存款池到 2025 年达到 PHP139 billion，说明竞争环境仍碎片化且增长丰富。GSMA 2024 State of
              the Industry 移动货币报告提供宏观锚：全球 17.5 亿注册移动货币账户，2023 年交易额 $1.68 trillion，撒哈拉以南非洲和东南亚增速最快。


              对 Tyme 估值的实际含义，是一个每客价格倍数收敛故事：若 Tyme 到 IPO 时能增长到 3500–4000 万客户，并证明集团盈利，那么 $4–7 billion IPO 市值对应的每客隐含价值为
              $100–200，仍低于 Nubank 成熟市场的 $543，但对于新兴市场早期溢价是合理的。关键敏感项是增长率，不是当前倍数。
