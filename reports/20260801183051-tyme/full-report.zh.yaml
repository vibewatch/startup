      - number: '8.5'
        title: 建议、风险评级和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              市场证据、可比组、情景分析和已识别缺口合在一起，给出的是有条件建议。对投资期限 5–7 年、能承受新兴市场执行风险的投资者而言，Tyme Group 在 $1.5 billion
              估值上是一个结构上可信的投资标的。TymeBank SA 已证明盈利，Nubank 给出战略背书，2028 年 IPO
              路径也现实；这几项组合让它区别于泛泛的新兴市场金融科技敞口。不过，集团合并审计财务缺失、菲律宾盈利时间线未确认、股权结构表只部分披露，造成信息不对称；仅凭公开证据，无法给出高置信度买入建议。


              建议立场是高风险评级下的投机性买入，前提是取得：（1）覆盖 FY2025 和 H1-2026 的集团层面投资者更新或管理账；（2）GoTyme Philippines 季度
              P&L，证明可信的盈亏平衡路径；（3）Series D 后完全稀释股权结构表及清算优先权细节；（4）对 ARC 投票权和治理条款的尽调。


              会促使重新评估为中性或卖出的论点破坏触发器包括：GoTyme Philippines 到 2027 年底仍未达到盈亏平衡（说明是结构性单位经济问题，而不只是时间问题）；ARC 或 Nubank 以明显低于
              $1.5 billion 标价的价格进行二级出售；TymeBank SA 在南非客户数前三位置输给既有挑战者；或 Tyme 在没有战略解释的情况下公开将 IPO 推迟到 2030 年之后。IFC
              的数字金融工作和该领域更广泛的开发金融投资确认了宏观顺风，但不能消除公司特定执行风险。最终投资决策需要公开市场拿不到的数据。
            claimRefs:
