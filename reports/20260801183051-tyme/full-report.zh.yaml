      - 阈值 / 事件
      - 行动含义
    rows:
      - - 持续经营 / 资本
        - 2026 年 10 月前的集团资本公告
        - 2026 年 Q3 前未启动 NYSE IPO 路演，也未取得股权承诺
        - 退出头寸；按困境信号处理
      - - 信贷质量
        - 年度减值费用和 NPL 率
        - 减值 > R800M/年，或 NPL > 账面 20%
        - 降级为回避；召开信贷风险评审
      - - 监管 — SARB
        - SARB 审慎监管局执法通知
        - SARB 对 GoTyme Bank Limited 采取任何正式执法行动
        - 立即标记风险；召开合规评审
      - - KYC 成本冲击（Home Affairs）
        - 终审判决或收费生效日期
        - R10/次查询收费落地且无法律救济
        - 重置 CAC 模型；重新评估单位经济性
      - - 竞争 — 南非存款
        - TymeBank 月度存款市场份额数据（通过 SARB 统计）
        - 到 2027 年 12 月，南非存款份额低于 1.5%
        - 重新评估竞争护城河假设
      - - AWS 集中度
        - TymeBank / GoTyme 服务中断被报道
        - 中断 > 6 小时并影响客户交易
        - 上调技术风险；要求披露灾备架构
      - - IPO 执行风险
        - NYSE IPO 定价相对 Series D 的水平
        - IPO 估值低于 $1.5B，或推迟到 2028 年之后
        - 投资者信心负面信号；重新评估退出时间表
    notes: 否决标准是投资决策触发项，不是银行运营阈值。阈值具方向性；需结合投资者持有期和风险容忍度校准。
  - id: TV001
    title: 建议摘要表
