callouts:
  - calloutType: strength
    title: Aggregate customer evidence is strong even if named proof is thin
    body: The best signal in this chapter is not a single marquee logo; it is the combination of 800,000+ active retailers, 10M+ relationships, NDR above 110%, and 100,000+ Insider members. Those metrics imply that Faire is already operating as a scaled repeat-purchase network, not a one-time discovery catalog.
    claimRefs:
      - CU003
      - CU009
      - CU021
      - CU024
      - CU025
  - calloutType: risk
    title: Customer durability is still less transparent than customer count
    body: The central customer diligence gap is cohort quality. Public sources do not disclose GRR, logo churn, top-customer concentration, or acquisition-channel retention, and management has already acknowledged that incentive-led cohorts underperformed during the 2021-2022 overgrowth period.
    claimRefs:
      - CU022
      - CU029
      - CU033
      - CU040
  - calloutType: insight
    title: Competitive displacement is segment-specific, not winner-take-all
    body: 'Faire still looks strongest in indie-retailer network density, but competitors attack different slices of the customer journey: RangeMe and Ankorstore on discovery, NuOrder on enterprise operations, Amazon Business on procurement scale, and trade shows on relationship-led sourcing. That means churn risk should be modeled by cohort, not by assuming one uniform competitor set.'
    claimRefs:
      - CU035
      - CU036
      - CU037
      - CU038
