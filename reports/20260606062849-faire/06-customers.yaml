tables:
  - id: TU001
    title: Customer segmentation table
    description: Key customer segments on both sides of Faire's network and what public evidence reveals about their scale and value.
    columns:
      - Segment
      - Buyer/User/Payer
      - Use Case
      - Scale
      - Revenue/Strategic Value
      - Gap
    rows:
      - - Independent boutique retailer
        - 'Buyer: owner or merchandiser; User: store buyer; Payer: retailer order spend and optional Insider fee'
        - Discover unique brands with low-risk first orders
        - 800,000+ active retailers overall
        - Core demand side that drives GMV, review volume, and NDR
        - No public split by boutique count, order frequency, or spend band
      - - Multi-location / storefront retailer
        - 'Buyer: category buyer; User: store ops and replenishment staff; Payer: retailer'
        - Reorder across storefronts and connect buying to stores
        - 35,000+ storefronts in North America
        - Higher operational lock-in and more orders from integrated cohorts
        - No disclosed GMV share or churn for Stores users
      - - Larger retailer cohort ($1M+ annual sales)
        - 'Buyer: professional merchandising team; User: inventory planners; Payer: retailer'
        - Scale assortment across many brands
        - '>20% of order volume'
        - Shows Faire reaches meaningful higher-value accounts beyond micro-shops
        - No public named account list or cohort economics
      - - Bookstore / media buyer
        - 'Buyer: book buyer; User: category staff; Payer: retailer'
        - Source books and publishers online instead of only at shows
        - ~50,000 retailers buying books; $100M+ volume
        - Evidence of vertical expansion beyond gift and apparel
        - No publisher concentration or reorder cadence by title
      - - Emerging brand / indie supplier
        - 'Buyer: brand founder; User: wholesale sales ops; Payer: brand via commission and ads'
        - Reach retailers without trade-show travel or cold outreach
        - 100,000+ brands on platform
        - Supply liquidity underpins retailer discovery and ad monetization
        - No public win-rate, CAC, or seller concentration disclosure
      - - Scaled supplier / publisher
        - 'Buyer: wholesale account lead; User: sales team; Payer: supplier'
        - Use Faire to access thousands of storefronts quickly
        - Simon & Schuster reached 5,000+ storefronts
        - Shows platform can onboard larger suppliers, not just indie brands
        - Public proof is anecdotal and not revenue-quantified
    notes: Rows summarize the most visible retailer and supplier cohorts supported by official pages, Sacra, and review surfaces as of 2026-06-06.
