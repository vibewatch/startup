schemaVersion: report-v2
artifact: customers
slug: faire
runDate: '2026-06-06'
company:
  name: Faire
chapter:
  number: 6
  title: Customers
  summary: Faire has built one of the broadest public retailer networks in modern wholesale, with 800,000+ active retailers, 100,000+ brands, and net dollar retention above 110% by third-party reporting. The strongest customer signal is aggregate network density and repeat-spend expansion; the weakest is depth of named proof, because public references are mostly testimonials rather than quantified case studies. The key diligence gap is therefore not whether customers exist, but how durable the best cohorts are once incentives, geography, and top-customer concentration are stripped out.
sections:
  - id: customer-base-segmentation-and-geographic-scale
    title: Customer base segmentation and geographic scale
    body: 'Faire''s customer base is broad on both sides of the network, but the retailer side is the clearest public demand signal. Official pages still frame the platform around independent retailers across categories from clothing boutiques to grocery stores, while Sacra''s market mapping indicates the platform has already scaled to more than 800,000 active retailers and 100,000 brands. The platform is not only a micro-boutique discovery tool: Sacra says retailers doing more than $1 million in annual sales account for over 20% of order volume, and 35,000+ storefronts in North America now use the Stores workflow. Geography matters as well. Europe is growing about twice as fast as North America, Australia has already passed 10,000 transacting retailers, and Faire now operates across 35 markets. That breadth supports a real scale thesis, even though public sources still do not break customer volume by top cohort, country, or vertical with the granularity an investor would ideally want.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-platform-traction
    title: Adoption trajectory and platform traction
    body: The adoption trajectory looks more like a scaled marketplace than a still-experimental sourcing tool. Sacra's dataset points to more than 10 million brand-retailer relationships and over $8 billion of wholesale inventory sold to date, while 2025 GMV was expected to approach $3 billion and revenue was annualizing above $500 million. Growth was still accelerating through Q3 2025, with eight consecutive quarters of GMV expansion, which matters because it implies the post-reset business has not stalled even after management's earlier growth correction. Public evidence also shows traction in newer surfaces rather than only the core browse-and-buy loop. Faire Market generated 136,000+ new brand-retailer relationships, books exceeded $100 million of annualized volume, and international launches built a 35,000+ retailer waitlist. That combination suggests a platform that continues to deepen usage density as well as add net-new accounts.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-customer-proof-and-evidence-quality
    title: Named customer proof and evidence quality
    body: >-
      Named customer proof exists, but it is thinner than the aggregate metrics. The strongest independently surfaced retailer testimonial is Glad & Young Studio: Digital Commerce 360 quoted co-founder Anna Zietz saying that before Faire the team spent too much time finding vendors and that the platform helped the business succeed. The clearest official retailer proof is Tula House, whose founders are featured on Faire's homepage. On the supplier side, Sacra cites Simon & Schuster reaching more than 5,000 storefronts after joining the platform, which is useful because it shows Faire can attract scaled publishers as well as indie brands. The problem is measurement quality. These examples are production references, not hypothetical pilots, but they remain testimonial-grade. The broader proof set actually comes from review surfaces such as Trustpilot and the Shopify app store, which are fresher and wider, yet still not substitutes for cohort-level ROI, retention, or contract data by named
      account.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU026
      - CU027
      - CU028
      - CU039
      - CU044
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention-repeat-purchasing-and-net-dollar-expansion
    title: Retention, repeat purchasing, and net dollar expansion
    body: 'Public retention evidence is directionally strong but incomplete. Faire''s first-order free returns and net 60 terms clearly reduce trial risk for new retailers, and Sacra plus Digital Commerce 360 both report net dollar retention above 110%, meaning existing retailers are spending more over time. Faire Insider, with 100,000+ enrolled members, adds another repeat-usage loop tied to shipping value, while advertising already contributing more than 5% of revenue suggests mature cohorts expand into additional monetization surfaces. The complication is that the public record also contains a real scar from 2021-2022: CNBC reported that retention deteriorated when the company over-indexed on incentives and attracted lower-quality demand. Management now says retention is back up sharply, but no public GRR, logo churn, or disclosed cohort curves let an investor verify the magnitude of the improvement. Retention therefore looks promising, not fully underwritten.'
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: adverse-signals-concentration-risks-and-competitive-displacement
    title: Adverse signals, concentration risks, and competitive displacement
    body: The biggest customer risk is not that Faire lacks users, but that public evidence does not fully separate durable cohorts from incentive-driven or concentrated ones. BBB complaints and critical reviews describe approval hurdles, inflexible credit enforcement, and pricing friction, while CNBC's account of the 2021-2022 period shows that a portion of demand had been attracted by discounts rather than enduring product-market fit. Public sources also do not disclose top-customer GMV mix, so the apparent breadth of the retailer base may hide meaningful concentration in the most valuable cohorts. Competitive displacement remains real. RangeMe and Ankorstore compete on discovery, NuOrder on enterprise wholesale operations, and Abound, Amazon Business, Qogita, Orderchamp, and physical trade shows all offer alternative routes to sourcing. Faire still looks strongest in network density and workflow adjacency, but the burden of proof is now on cohort durability, not raw account count.
    claimRefs:
      - CU030
