  - id: TU005
    title: Expansion and concentration risk table
    description: The main expansion loops visible publicly and the concentration or quality risks still hidden behind them.
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact
      - Diligence Path
    rows:
      - - Net 60 terms + first-order free returns
        - Can over-index low-quality or incentive-seeking demand
        - Top-of-funnel growth may overstate durable cohort quality
        - Compare retention for incentive-exposed versus organic cohorts
      - - 10M+ brand-retailer relationships
        - Top-customer spend mix is undisclosed
        - Hidden concentration could magnify churn from a small number of valuable buyers
        - Request top-10 and top-50 retailer GMV share plus NDR by spend band
      - - Stores / 35,000+ storefront adoption
        - GMV share from storefront users is not public
        - Operational lock-in may be real but hard to size
        - Request order frequency and churn by Stores/POS cohort
      - - Insider + ads monetization
        - Expansion revenue may depend on subsidy economics or paid placement quality
        - Can boost revenue without clarifying core marketplace health
        - Request member economics and ad-retention / incrementality data
      - - Europe growth and 35,000+ waitlist
        - Launch-market cohort quality is undisclosed
        - Fast geography expansion can mask lower-quality or more incentive-dependent demand
        - Request launch-market cohort curves, CAC payback, and repeat-order rate
    notes: Each row pairs an observable expansion mechanic with the most important unresolved underwriting question behind it.
    claimRefs:
