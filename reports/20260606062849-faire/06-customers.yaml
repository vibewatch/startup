  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cohort-retention-disclosure
      missingEvidence: Actual GRR, logo churn, contract length, and year-1/year-2 cohort retention tables by acquisition channel, geography, and spend band.
      whyItMatters: Public NDR and review signals imply durability, but they are not sufficient to underwrite how fast cohorts decay or re-activate over time.
      diligencePath: Request cohort-retention tables, logo-retention bridges, GRR by cohort vintage, and a management explanation of the 2021-2022 retention dip versus current baselines.
      relatedQuestionRefs:
        - QU016
        - QU017
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-10 and top-50 retailer GMV share, spend distribution by cohort, and concentration of gross profit or ad spend among the most valuable customers.
      whyItMatters: A very broad customer count can still mask meaningful concentration in the most monetizable cohorts, which would change churn and valuation sensitivity.
      diligencePath: Request retailer concentration tables, NDR by spend band, and cohort contribution to GMV, ads, and Insider revenue.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU005
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof-table
      missingEvidence: A larger sample of named customers with verified spend, retention, or quantified outcomes across retailer and supplier segments.
      whyItMatters: The current public proof set is too small and testimonial-heavy to know whether the strongest cohorts are representative of the broader customer base.
      diligencePath: Request ten or more referenceable customers by segment, each with deployment age, GMV or spend level, reorder frequency, and a named operational owner.
      relatedQuestionRefs:
        - QU009
        - QU011
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: acquisition-quality-by-channel
      missingEvidence: Retention, payback, and reorder curves for cohorts acquired through incentives, events, organic marketplace discovery, and international launch waitlists.
      whyItMatters: Management has already acknowledged that some growth-era cohorts were low quality, so channel-level durability is essential to judge whether the current growth engine is healthier.
      diligencePath: Request acquisition-channel cohort tables showing CAC, first-to-second-order conversion, year-1 retention, and gross profit by channel and geography.
      relatedQuestionRefs:
        - QU020
        - QU021
        - QU023
      relatedTableRefs:
        - TU004
        - TU005
