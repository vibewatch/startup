- id: TE002
  title: Workflow / use-case table
  description: Observable buyer and seller workflows on Faire with benefits and limitations.
  columns:
  - User job
  - Current workflow
  - Faire solution
  - Measurable benefit
  - Limitation
  enumerationScope:
    coverage: sample
    basis: Rows cover the most visible brand and retailer jobs documented in official materials, product analysis, and reviews; they are representative workflows rather than an exhaustive task inventory.
  rows:
  - - Launch a wholesale channel
    - Build catalog, collect retailer interest, manage orders manually
    - Marketplace onboarding plus Brand Portal
    - Access to an 800,000+ retailer network and centralized order workflow
    - No public implementation-timeline or onboarding-cost benchmark
  - - Bring existing retail accounts onto platform
    - Email linesheets and manage repeat wholesale orders offline
    - Faire Direct custom-link workflow
    - 0% commission on referred customers
    - Public data does not show what share of GMV is direct versus marketplace
  - - Place a first order with reduced risk
    - Buy inventory upfront with uncertain sell-through
    - Net 60 payment terms plus first-order free returns
    - Retailers can buy now, pay later, and return first orders within 60 days
    - Loss rates and dispute rates are not public
  - - Operate multiple stores with synced inventory
    - Re-enter products across locations and POS systems
    - Stores plus POS integrations
    - POS-integrated retailers place about 20% more orders
    - Detailed sync-error rates and exception workflows are not public
  - - Lower shipping friction for brands
    - Source postage independently and handle customs paperwork manually
    - Ship with Faire
    - 5M+ shipments in 2025 and additional UPS discounts in 2026
    - Carrier service consistency and unit-margin impact are private
  - - Buy discovery or growth placement
    - Rely only on organic marketplace ranking
    - Promoted Listings
    - 70%+ more product views and 25%+ higher total sales by claim
    - Attribution and auction transparency are limited
  notes: Workflow outcomes mix company claims with third-party observations; benefit metrics are public claims, not independently audited results.
  claimRefs:
  - CE002
  - CE004
  - CE005
  - CE008
  - CE013
  - CE020
  - CE022
  - CE026
- id: TE003
  title: Technology / operating architecture table
  description: Inferred architecture layers, their role, key dependencies, and risks.
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  enumerationScope:
    coverage: partial
    basis: The architecture is reconstructed from public product pages, pricing, leadership interviews, and external analysis because Faire does not publish a complete public systems diagram or open API model.
  rows:
  - - Marketplace surfaces
    - Hosts retailer discovery, search, order flow, and brand storefront interaction
    - Web and app product experience plus ranking systems
    - Marketplace UX can degrade under scale stress, as leadership has acknowledged
  - - Brand operating layer
    - Manages catalog, orders, balances, and linesheets for suppliers
    - Brand Portal data model and Shopify sync
    - Public admin, permissions, and reliability details are limited
  - - Retail operations layer
    - Connects retailer replenishment to Stores and POS environments
    - Shopify, Square, Clover, and Lightspeed Retail integrations
    - Partner schema changes or sync failures can disrupt ordering
  - - Payments and trust layer
    - Enables commissions, payout timing, net 60 terms, and return protection
    - Credit underwriting, payment processing, and returns operations
    - Loss rates and underlying risk controls are private
  - - Logistics orchestration layer
    - Supports shipping labels, rate reduction, customs forms, and international workflow
    - UPS collaboration, carrier services, customs data, and warehouse operations
    - Execution quality and economics depend on external carrier and fulfillment partners
  - - Ranking, advertising, and AI layer
    - Powers search relevance, listing quality, promoted inventory, and assistant experiences
    - Behavioral data, model training, and merchandising feedback loops
    - Model-performance and governance evidence is mostly company-claimed
  - - Pod-based product operating model
    - Coordinates feature delivery across product, engineering, and design teams
    - Decentralized pods with OKRs and leadership oversight
    - Layoffs and organization changes can reduce continuity on platform-wide work
  notes: Dependencies and risks are inferred from public evidence rather than confirmed via architecture documentation or customer engineering references.
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE022
  - CE028
  - CE042
- id: TE004
  title: Trust / quality / compliance table
  description: Public trust controls, quality signals, and the gaps that remain after open-source review.
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  enumerationScope:
    coverage: partial
    basis: Rows summarize only the trust and quality controls that could be observed from public support, review, complaint, and blocked trust pages on 2026-06-06; private security questionnaires and audit reports were unavailable.
  rows:
  - - First-order free returns
    - Confirmed publicly
    - Retailer risk reduction on first orders within 60 days
    - Return abuse rates, merchant burden, and dispute resolution metrics are not public
  - - Net 60 terms and payout options
    - Confirmed publicly
    - Retailer financing and brand payout timing menu
    - Underwriting criteria, defaults, and fraud controls are not public
  - - Support knowledge base
    - Confirmed publicly
    - Support center covers orders, returns, pricing, and operational help topics
    - No published SLA, first-response metric, or uptime commitment
  - - Security page
    - Access blocked
    - Intended public trust surface for security claims
    - Could not confirm certifications, control framework, or incident posture from the blocked page
  - - Privacy page
    - Access blocked
    - Intended public privacy disclosure surface
    - Could not review detailed data-handling and regional transfer terms from the blocked page
  - - External quality signals
    - Mixed
    - Shopify app reviews are strong while BBB complaints and critical reviews show friction
    - Public evidence confirms adoption but not consistently strong support outcomes
  notes: Trust posture is only partially inspectable because the security and privacy URLs were blocked; external review sources therefore carry more weight than usual in this chapter.
