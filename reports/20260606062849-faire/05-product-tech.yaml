tables:
- id: TE001
  title: Product module / asset matrix
  description: Faire product modules mapped to user, maturity, differentiation, and diligence gap.
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  enumerationScope:
    coverage: partial
    basis: Rows summarize the major public product modules visible across official pages, support content, reviews, and analysis as of 2026-06-06; private internal tooling and undisclosed beta surfaces are excluded.
  rows:
  - - Marketplace discovery and ordering network
    - Brands and retailers
    - GA at scale
    - Two-sided wholesale graph with 100,000+ brands and 800,000+ retailers
    - Take-rate durability and marketplace cohort economics are not publicly broken out
  - - Brand Portal
    - Brands
    - GA
    - Real-time dashboard with orders, balances, linesheets, and operational controls
    - No public SLA, admin permissions model, or sync-error-rate disclosure
  - - Faire Direct
    - Brands bringing existing buyers
    - GA
    - 0% commission on referred customers keeps transactions on-platform
    - Cannibalization vs marketplace-generated demand is not disclosed
  - - Retailer terms and first-order returns
    - Retailers
    - GA
    - Net 60 terms plus 60-day first-order free returns reduce trial friction
    - Credit-loss and return-abuse rates remain private
  - - Ship with Faire
    - Brands and retailers
    - Scaling in 2025-2026
    - Integrated shipping discounts, customs automation, and cross-border workflow support
    - Carrier mix, service quality, and gross-margin contribution are not public
  - - POS integrations and Stores
    - Retailers with storefront operations
    - Scaling in 2026
    - 75,000 active integrations, 10M+ synced products, and multi-location support
    - Open API details and sync reliability metrics are unavailable publicly
  - - Promoted Listings
    - Brands
    - Scaling monetization layer
    - Marketplace-native advertising tied to discovery intent and sales lift claims
    - Auction mechanics, incrementality, and advertiser concentration are opaque
  - - Faire Insider
    - Retailers
    - GA subscription
    - Subscription converts shipping value into recurring revenue and member retention
    - Attach rate, churn, and profitability are not disclosed
  - - AI discovery and virtual assistance
    - Retailers and brands
    - GA plus preview roadmap
    - Natural-language search, image discovery, ranking models, and assistant roadmap
    - Model governance, evaluation metrics, and usage penetration are only partly disclosed
  notes: Product breadth is compiled from official, analysis, review, and developer-signal sources; maturity reflects what is publicly shipping versus announced.
