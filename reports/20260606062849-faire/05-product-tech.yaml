callouts:
- calloutType: strength
  title: Faire has evolved into a workflow platform, not just a wholesale marketplace
  body: The strongest product signal is module adjacency. Financing, shipping, advertising, subscriptions, and POS sync all sit on top of the same marketplace graph, which gives Faire more ways to monetize and retain participants than a simple listing marketplace would have.
  claimRefs:
  - CE001
  - CE004
  - CE020
  - CE024
  - CE025
  - CE027
- calloutType: risk
  title: Public diligence is constrained by blocked trust and developer surfaces
  body: The biggest product-tech diligence gap is not feature scarcity but inspectability. Developer docs, security content, and privacy content were not openly reviewable on the access date, so architecture openness, auth design, certifications, and some control details remain under-documented in public sources.
  claimRefs:
  - CE014
  - CE015
  - CE035
- calloutType: insight
  title: 2026 releases suggest the post-layoff platform agenda is operational depth
  body: Despite substantial layoffs in 2022 and 2023, the most visible 2026 product moves—new POS coverage, deeper shipping economics, tariff tooling, and AI assistants—suggest Faire is prioritizing merchant operating leverage over a return to pure marketplace expansion narratives.
  claimRefs:
  - CE022
  - CE030
  - CE031
  - CE041
  - CE042
