  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: developer-ecosystem
    missingEvidence: Readable public API or partner integration documentation showing authentication, scopes, rate limits, objects, webhooks, and sandbox behavior.
    whyItMatters: Open integration depth is strategically important to POS, Shopify, and operational workflows, but blocked docs prevent a true technical diligence assessment.
    diligencePath: Request partner API documentation, sample payloads, auth design, and integration onboarding materials directly from Faire.
    relatedQuestionRefs:
    - QE015
    - QE016
    - QE030
    relatedTableRefs:
    - TE003
  - type: access-blocked
    severity: material
    topic: trust-gap
    missingEvidence: Readable security and privacy materials plus any SOC 2, ISO 27001, penetration-test, or data-processing documentation.
    whyItMatters: Trust evidence is central to underwriting payments, merchant data handling, and cross-border workflows, but the public trust surfaces were blocked.
    diligencePath: Request trust-center access, latest security questionnaire, incident history, and privacy or data-transfer documentation during diligence.
    relatedQuestionRefs:
    - QE023
    - QE030
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Module-level adoption, churn, attach, support-SLA, sync-error, shipping-margin, and credit-loss metrics for Insider, POS, shipping, returns, and payments.
    whyItMatters: Public feature breadth is strong, but investors still need private operating metrics to determine which modules are durable value drivers versus promotional narratives.
    diligencePath: Request a module KPI pack covering adoption, retention, support quality, returns, losses, and monetization by product area.
    relatedQuestionRefs:
    - QE018
    - QE024
    - QE029
    - QE030
    relatedTableRefs:
    - TE001
    - TE004
    - TE005
  - type: missing-source
    severity: minor
    topic: architecture
    missingEvidence: A formal architecture overview or customer engineering reference describing system boundaries, data flows, and failure-handling for integrations and logistics.
    whyItMatters: The inferred architecture is credible, but without a direct systems description it remains harder to test resilience, data consistency, and integration complexity.
    diligencePath: Ask product and engineering leaders for a reference architecture, dependency map, and examples of platform-level reliability controls.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE030
    relatedTableRefs:
    - TE003
