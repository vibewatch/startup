  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Faire is a wholesale B2B marketplace founded in 2017 that connects independent retailers with independent brands and has grown into a scaled private commerce platform with 800K+ retailers, 100K+ brands, and roughly $1.7B of funding. Public evidence shows a sharp valuation reset from the 2022 peak to a $5.2B 2025 tender price, but also points to durable marketplace traction, monetization breadth, and a management narrative increasingly centered on break-even and IPO readiness."
  },
  "sections": [
    {
      "id": "identity-and-business-model",
      "title": "Identity and business model",
      "body": "Faire is a San Francisco-based B2B wholesale marketplace that connects independent brands with independent retailers and positions itself as a digital replacement for fragmented offline wholesale discovery. Public materials and third-party profiles align on a 2017 operating launch, Y Combinator W17 origins, and the legal entity Faire Wholesale, Inc., which Tracxn lists as incorporated in late 2016. The homepage says retailers can shop wholesale from more than 100,000 brands, while outside research describes the company as one of the largest curated wholesale networks for small and midsize merchants. The business model mixes marketplace discovery, order flow, financing support, and operational tooling rather than acting as a simple directory. Brands pay transaction fees on marketplace orders, retailers get Net 60 terms and free-return policies that reduce trial risk, and the platform has built formal pricing, support, and legal surfaces that indicate a mature operating stack rather than a lightweight listing site.",
