    {
      "id": "milestones-and-adverse-signals",
      "title": "Milestones and adverse signals",
      "body": "The milestone record shows both impressive scaling and real stress. Faire reached more than $1 billion in GMV by late 2021, then hit its valuation peak in May 2022 before entering a harder discipline phase marked by an initial layoff of about 7% in October 2022 and a second, deeper cut of roughly 20% or 250 employees in 2023. Around the same period, Shopify invested and made Faire its recommended wholesale marketplace, reinforcing channel value even as internal cost controls tightened. Public reporting in 2025 and 2026 reframed the narrative toward break-even and eventual IPO readiness rather than growth-at-all-costs. Legal filings add another adverse thread: Faire Wholesale, Inc. sued competitor Tundra in May 2023, Tundra counter-sued, and dismissal records suggest the dispute later moved toward resolution. Review and complaint surfaces also highlight stricter credit enforcement, approval hurdles, and customer-support frustration, which matter because trust is central to repeat wholesale ordering.",
