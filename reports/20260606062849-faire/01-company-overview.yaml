    {
      "id": "funding-valuation-and-stakeholders",
      "title": "Funding history, valuation, and stakeholder map",
      "body": "Faire built one of the larger capital bases in venture-backed commerce infrastructure. Public reporting indicates the company raised more than $1 billion in its first five years and roughly $1.7 billion in total through late 2025, spanning YC backing, multiple growth rounds, a 2021 Series G, a 2022 Series G extension, Shopify’s 2023 strategic investment, and a November 2025 Series I or tender-linked financing at a $5.2 billion valuation. That latest mark represented a sharp reset from the May 2022 peak valuation of roughly $12.59 billion, but it still left Faire as a scaled private marketplace with a deep roster of investors including Sequoia, Y Combinator, Founders Fund, Lightspeed, WCM Investment Management, Shopify, and True North Fund. The stakeholder map therefore matters not just for prestige but for strategic leverage: Shopify can drive distribution, while late-stage capital providers influence employee liquidity, pricing discipline, and IPO timing expectations.",
