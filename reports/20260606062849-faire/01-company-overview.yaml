    {
      "id": "scale-economics-and-traction",
      "title": "Scale, economics, and traction signals",
      "body": "Late-2025 evidence shows a marketplace that is large enough to matter even after a valuation reset. Sacra and Digital Commerce 360 point to more than 800,000 retailers, over 100,000 brands, net dollar retention above 110%, and expected 2025 GMV around $3 billion. On monetization, public sources align around a 15% base commission, added payment-processing fees, a $10 opening-order fee, and 0% commission on Faire Direct traffic, while also describing ancillary revenue from Insider subscriptions and a growing ads business that accounts for more than 5% of revenue. Revenue quality is less certain than network scale because the company is private, but the public data set is still meaningful: Sacra estimates 2023 revenue at $616 million, Digital Commerce 360 says revenue was annualizing above $500 million with over 40% growth in Q3 2025, and CNBC reports 32% growth in 2025 versus 2024. Integrations with Shopify, Square, Clover, and Lightspeed suggest platform lock-in goes beyond marketplace listing visibility alone.",
