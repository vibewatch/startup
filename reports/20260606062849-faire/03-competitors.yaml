  - id: section-3
    title: Pricing, commission structures, and switching cost analysis
    body: >-
      Faire's pricing structure—15% commission on most brand orders plus a $10 fee on opening orders from new
      retailers, plus 1.9% to 3.5% payment processing depending on payout speed—is one of the highest take rates in
      the B2B wholesale marketplace space. Ankorstore charges 10% on repeat orders (20% on first-order), Qogita does
      not publicly disclose a flat commission and instead negotiates bulk pricing on retailer behalf, and Orderchamp
      similarly offers free shipping and low minimums rather than competing on flat commission alone. Only Faire Direct
      links create zero-commission pathways, but Faire changed Direct orders to include processing fees in July 2023.
      Reviewers note that many brands compensate by pricing Faire listings 10–20% above their own wholesale prices,
      which creates friction for price-conscious retailers.


      Switching costs for retailers are real but not prohibitive. Faire's Net 60 terms, free returns on opening orders,
      Shopify integration with 75K actively connected retailers, and broad brand discovery are genuine stickiness
      drivers. POS-integrated retailers place nearly 20% more orders than non-integrated peers and represent the
      stickiest segment. However, multi-homing is plausible: a retailer can simultaneously use Faire, Ankorstore,
      Orderchamp, and a trade show order pad without technical barrier. For brands, the most binding lock-in comes
      from Faire's ToS—which contained a clause that once a brand completes an order with a retailer on Faire,
      completing orders with the same retailer through competing platforms is prohibited. Tundra's antitrust lawsuit
      made this clause its central allegation, though the court ultimately dismissed the case in November 2024.
    claimRefs:
      - CP002
