callouts:
  - calloutType: strength
    title: Network density and Shopify distribution give Faire a durable first-mover advantage
    body: >-
      Ten million brand-retailer relationships and 800K active retailers make Faire's matching quality and
      discovery relevance structurally hard to replicate. The Shopify preferred-partner status reinforces this
      by routing Shopify's merchant base toward Faire at the moment of wholesale sourcing intent.
    claimRefs:
      - CP001
      - CP023
      - CP024
      - CP032

  - calloutType: risk
    title: Faire's 15%+ brand commission is the highest in the peer set and a durable competitive vulnerability
    body: >-
      Both Ankorstore (10% repeat-order) and physical trade shows (zero variable commission) offer brands a
      structurally lower-cost alternative channel. Reviewers note that brands respond by pricing Faire listings
      higher, which reduces retailer value. A well-capitalized entrant can exploit this with a subsidized
      lower-commission launch.
    claimRefs:
      - CP002
      - CP007
      - CP013
      - CP025

  - calloutType: risk
    title: Exclusive dealing controversy in brand ToS creates ongoing regulatory and reputational exposure
    body: >-
      The Tundra antitrust case (dismissed Nov 2024) surfaced public awareness that Faire's brand Terms of Service
      may create exclusive dealing obligations. While the case was dismissed, the clause language and enforcement
      posture remain a diligence item, particularly as Faire expands in EU markets with more active competition law.
    claimRefs:
      - CP015
      - CP016
      - CP019
      - CP031

