    rows:
      - - Network density (10M+ relationships, 800K retailers) makes matching quality hard to replicate
        - European peers are building competing networks; Ankorstore had 200K retailers in early 2022 with strong local curation
        - medium
        - Track European retailer and brand acquisition rate vs. Ankorstore and Orderchamp; request cohort retention by geography
      - - Shopify strategic partnership routes millions of merchants toward Faire
        - Shopify could end or renegotiate the preferred partner relationship; Shopify took equity in 2023 deal
        - medium
        - Review Shopify partnership contract length, exclusivity provisions, and renegotiation terms
      - - Net 60 terms and free returns create retailer stickiness
        - Ankorstore and Orderchamp also offer Net 60; terms are a table-stake feature, not a unique moat
        - low
        - Confirm whether Faire offers higher credit limits or broader retailer eligibility than peers
      - - Faire Direct links lock in brand-retailer relationships at zero commission
        - Processing fees introduced in July 2023 eroded the true zero-commission story; brands can still go direct
        - low
        - Confirm retention impact of July 2023 Faire Direct fee change; monitor brand churn in high-Direct-usage cohorts
      - - Exclusive dealing clause in brand ToS creates platform stickiness
        - Tundra antitrust case (dismissed Nov 2024) surfaced regulatory risk; continued scrutiny possible
        - medium
        - Review current Terms of Service to confirm enforcement posture; ask for legal counsel assessment of antitrust exposure
      - - Brand commission premium (15%+) funds subsidized retailer terms
        - 15%+ commission is highest in peer set; a well-funded competitor with lower take rate could peel away brands
        - high
        - Monitor competitive commission offerings and Faire's brand churn rate by commission sensitivity segment
    notes: >-
      Severity reflects potential impact on underwriting assumptions if the threat materializes, not current
      probability of occurrence.
