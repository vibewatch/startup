company:
  name: Faire
chapter:
  number: 3
  title: Competitors
  summary: >-
    Faire holds a clear scale advantage in B2B wholesale over its closest digital peers, but the competitive landscape
    is wider than the typical peer-set narrative suggests. European rivals Ankorstore and Qogita have meaningful
    regional footholds; adjacent platforms like NuORDER/Lightspeed target larger enterprise brands outside Faire's
    indie sweet spot; and physical trade shows—rebounding to ~$16 billion by 2024—remain the incumbent status-quo
    substitute for tens of thousands of retailers. Faire's moat rests on network density (800K+ retailers, 100K+
    brands, 10M+ relationships), Shopify distribution, and Net 60 working-capital terms. However, Faire's 15%+ brand
    commission structure is a recurring friction point that fuels multi-homing and brand direct-to-wholesale
    alternatives. The 2023–2024 Tundra antitrust case, ultimately dismissed, surfaced a real debate over whether
    Faire's brand Terms of Service imposed exclusive dealing. Faire's European push faces Ankorstore on its home turf,
    and the platform's moat looks durable but not impregnable if commission pressure or entrants like Amazon Business
    scale their indie-brand supplier catalogs.
sections:
  - id: section-1
    title: 'Landscape: direct B2B wholesale peers, adjacent platforms, incumbents, and status-quo substitutes'
    body: >-
      Faire's competitive landscape spans four distinct layers. The closest direct peers are European-focused B2B
      wholesale marketplaces—Ankorstore, Qogita, and Orderchamp—that mirror Faire's two-sided model connecting indie
      brands with independent retailers. Ankorstore is the clearest head-to-head rival: it reached a $2 billion
      valuation in January 2022, operates across 23 European markets with 200K retailers and 15K brands, and charges
      a 10% commission on repeat orders (20% on the first order), materially below Faire's 15% base rate. Qogita
      and Orderchamp are smaller but growing European alternatives with similar Net-terms propositions.


      The adjacent layer includes platforms that solve a related but distinct job. NuORDER (part of Lightspeed) targets
      larger enterprise brands with a digital B2B ordering workflow aimed at the traditional apparel and mid-market
      brand segment rather than Faire's indie-brand focus. RangeMe/ECRM connects brands with large-chain grocery and
      retail buyers through structured category sessions—a product-discovery and supplier-qualification platform rather
      than a transaction marketplace. Mable serves the natural and specialty food segment, while Carro (dropshipping)
      offers retailers inventory expansion without purchase-order risk.


      The incumbent and status-quo layer is the largest and least often enumerated. Physical trade shows rebounded to
      an estimated $16 billion market by 2024 (PwC data cited by CNBC), and major events attract tens of thousands of
      retailers making inventory purchase decisions. Amazon Business and Alibaba each offer B2B procurement at a scale
      that dwarfs Faire's current GMV, though neither replicates Faire's indie-brand curation or Net 60 terms for
      small retailers. Direct dealer relationships and cold outreach remain the default for many brands outside North
      America.
