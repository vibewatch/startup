      - - Qogita
        - B2B wholesale catalog aggregator (EU/UK)
        - 500+ vetted suppliers, 10K+ brands, 500K+ products, 100K+ retail businesses
        - European retailers seeking bulk pricing across multiple suppliers in single cart
        - Negotiates bulk pricing on retailer's behalf; EU/UK ship-from warehouses; guaranteed authenticity
        - Supplier-side aggregation model differs from brand-direct Faire model; commission structure not public
      - - Orderchamp
        - Direct B2B wholesale marketplace (European)
        - 7,000+ brands, 200,000+ retailers; no disclosed funding in retained sources
        - European independent retailers seeking low-minimum wholesale with free shipping
        - Free shipping, low minimums, Net 60 payment terms, direct brand-to-retailer orders
        - Smaller brand catalog than Faire; limited North American or global footprint
      - - NuORDER / Lightspeed
        - B2B digital ordering platform (enterprise-adjacent)
        - Part of Lightspeed (public company); targets mid-market to enterprise brands and multi-door retailers
        - Established brands selling to specialty retail chains, department stores, multi-brand showrooms
        - Digital order management for larger brand-retailer relationships; Lightspeed commerce integration
        - Not a brand-discovery marketplace; targets different customer profile than indie Faire brands
      - - RangeMe / ECRM
        - B2B product-discovery and buyer-matching platform (large-chain focus)
        - World's leading product discovery platform; trusted by hundreds of large-chain retailers
        - Brands seeking placement in grocery, pharmacy, general merchandise large chains
        - Category-specific buyer-seller matching sessions; large-chain buyer relationships; ECRM acquisition
        - Serves different buyer/seller pair than Faire; not an indie-retail wholesale ordering platform
      - - Amazon Business
        - B2B procurement platform (incumbent large-scale substitute)
        - Amazon B2B channel for business buyers; volume pricing; multi-user account management
        - Businesses of all sizes seeking volume pricing across Amazon's full product catalog
        - Massive SKU breadth, volume discounts, Prime delivery, integrated invoicing
        - Does not curate indie brands or offer Net 60 terms; primarily a procurement tool not a discovery marketplace
      - - Physical trade shows (status quo)
        - Status-quo incumbent and direct substitute
        - Estimated ~$16B market by 2024 (PwC); major events attract tens of thousands of retailers
        - Retailers who prefer in-person brand discovery and relationship-based wholesale ordering
        - Human relationship, in-person product experience, multi-brand ordering events, seasonal timing
        - Logistics-intensive, geographically limited, seasonal; rebounded post-COVID but structurally slower
    notes: >-
