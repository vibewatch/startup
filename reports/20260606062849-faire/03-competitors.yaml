  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Ankorstore post-2022 scale
      missingEvidence: >-
        Ankorstore's most recent disclosed retailer count, brand count, GMV, and revenue are from the January
        2022 Series C announcement. No post-2022 metrics are available in retained public sources.
      whyItMatters: >-
        Without current Ankorstore scale data, the intensity of head-to-head competition in European markets
        and the gap between Faire's and Ankorstore's EU positions cannot be quantified.
      diligencePath: >-
        Request any Ankorstore investor updates or press releases with post-2022 GMV or retailer count; monitor
        EU trade publications for Ankorstore market-share claims.
      relatedQuestionRefs:
        - QP004
        - QP017
    - type: private-evidence-only
      severity: material
      topic: Faire brand churn and commission sensitivity data
      missingEvidence: >-
        No public data on brand churn rate, brand satisfaction segmented by commission sensitivity, or win/loss
        breakdown between Faire and Ankorstore or trade shows is available.
      whyItMatters: >-
        Whether Faire's 15%+ commission structure causes meaningful brand attrition to lower-commission
        alternatives is the key uncertainty in evaluating moat durability.
      diligencePath: >-
        Request brand cohort churn data, NPS or satisfaction segmented by Faire Direct vs. marketplace brands,
        and win/loss data vs. Ankorstore and trade shows.
      relatedQuestionRefs:
        - QP018
        - QP025
    - type: missing-source
      severity: minor
      topic: Faire Terms of Service current exclusive-dealing posture
      missingEvidence: >-
        The current (post-dismissal) Faire brand Terms of Service was not retained in source material. It is
        unclear whether the exclusive dealing language noted in the Tundra FAC was modified after dismissal.
      whyItMatters: >-
        If the clause persists in its original form, it remains a risk factor for future regulatory or
        competitive challenge in EU markets with active competition-law enforcement.
      diligencePath: >-
        Review current Faire brand Terms of Service (faire.com/terms) against the language quoted in the
        Tundra FAC; confirm with Faire legal counsel whether any modifications were made post-dismissal.
      relatedQuestionRefs:
        - QP019
        - QP013
