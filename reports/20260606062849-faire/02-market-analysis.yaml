- id: geography-and-trade-environment
  title: 'Geography and trade environment: U.S., Europe, and RoW'
  body: 'Geography matters because Faire is not expanding into equally legible markets. The U.S. remains the most measurable market in public evidence: there is direct merchant-wholesale sales data, labor-market data for wholesale and retail, and at least one retained estimate for current online procurement penetration. Europe looks like the clearest growth adjacency, not because it offers a clean wholesale TAM, but because digital behavior is already mainstream, B2C e-commerce turnover exceeded €842 billion in 2024, and Faire’s own retained third-party coverage says Europe is growing roughly twice as fast as North America. Within Europe, however, Western Europe is more mature while Eastern and Southern Europe still show lower e-shopper penetration and therefore a different adoption curve. RoW is the least underwritten zone: Sacra cites traction in Australia and later New Zealand expansion, but retained public evidence for other regions is much thinner. The trade environment increases the
    spread between geographies. USTR’s 2026 agenda keeps tariffs, market access, customs enforcement, duty evasion, and de minimis on the policy front line, while BEA’s March 2026 goods deficit shows how exposed retailer procurement remains to cross-border flows. The market is therefore global in aspiration, but still U.S.-anchored in underwritable evidence.'
