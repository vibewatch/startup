tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / spend bucket
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core wholesale marketplace
    - Inventory purchased for resale between brands and retailers
    - Consumer checkout, retail payroll, general software spend
    - Retailer buyer and brand seller both pay through transaction economics
    - This is Faire’s direct transaction layer
  - - Independent specialty retail
    - Boutiques, gift, beauty, food, pets, books, and similar stores buying differentiated merchandise
    - Big-box replenishment and enterprise procurement programs
    - Retail owner, buyer, or merchandiser pays from store P&L
    - Best fit with Faire’s curated assortment and low-minimum proposition
  - - Brand distribution acquisition
    - Commissions, processing, promotion, and distribution spend from brands seeking retail reach
    - Pure DTC marketing or marketplace ads outside wholesale conversion
    - Brand founder or wholesale lead funds the channel
    - Important because brands are a paying side, not just supply inventory
  - - Status-quo substitutes
    - Trade shows, direct brand outreach, incumbent wholesalers, and offline ordering relationships
    - Consumer search, retail media, and unrelated procurement
    - Either side pays travel, relationship, or account-management costs
    - These channels set the baseline adoption hurdle for digital marketplaces
  - - Adjacent digital procurement
    - Alibaba, Amazon Business, Qogita, Orderchamp, Ankorstore, and NuORDER for overlapping jobs
    - Non-merchandise procurement and non-resale spend
    - Varies by platform and workflow
    - Useful for boundary logic because many buyers compare these tools even when jobs differ
  notes: Boundary rows distinguish direct wholesale-resale economics from downstream consumer retail and from broader procurement adjacencies.
