- id: FM003
  title: Buyer adoption journey
  type: journey-map
  layout: wide
  summary: Retailer adoption starts with risk removal and only later deepens into operational workflow, repeat spend, and subscription or integration-driven monetization.
  data:
    nodes:
    - label: Discover differentiated brands
      detail: Retail buyer searches for unique assortment rather than commodity replenishment.
    - label: Evaluate risk and terms
      detail: Low minimums, 60-day terms, and free first-order returns lower the cost of trying the channel.
    - label: Place first order
      detail: Owner or merchandiser acts as buyer and payer for trial inventory.
    - label: Reorder and expand assortment
      detail: Successful sell-through turns discovery into repeat purchasing across more brands.
    - label: Adopt workflow tools
      detail: Stores, POS integrations, and Insider deepen operational embed and monetization.
    - label: Move upmarket or cross-border
      detail: Larger accounts and geography expansion require more compliance, finance, and logistics support.
