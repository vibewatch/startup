- id: TM004
  title: Growth drivers and adoption constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Only ~5% of U.S. inventory sourcing is online
    - Driver
    - Near to medium term
    - Offline-to-online migration can power continued marketplace growth
    - Request a current, audited online-share denominator by retail segment
  - - 60-day terms, low minimums, and free first-order returns
    - Driver
    - Immediate
    - Risk reduction helps early trial and faster retailer onboarding
    - Request conversion data from first order to second order by cohort
  - - Internet, e-shopper, logistics, payments, and AI improvements in Europe
    - Driver
    - Medium term
    - Digital readiness supports geographic expansion and workflow depth
    - Request regional CAC, activation, and payback by market
  - - Fragmented small-business base
    - Driver
    - Structural
    - Search and trust intermediation are valuable where supply and demand are long-tail
    - Request retailer count and spend distribution by size band
  - - Weak discretionary demand and price pressure in European retail
    - Constraint
    - Current
    - Margin pressure can slow experimentation and reduce order frequency
    - Request category-level resilience and reorder data by geography
  - - Regulatory complexity and unfair competition from non-EU sellers
    - Constraint
    - Current to medium term
    - Compliance burden raises operating cost and can slow cross-border rollout
    - Request product-origin mix and compliance cost by region
  - - Only 6% of SMEs meet the EU high digital-intensity threshold
    - Constraint
    - Medium term
    - Adoption of advanced tools may lag even when internet access is high
    - Request usage of advanced workflows by SMB maturity segment
  - - Tariffs, duties, customs, VAT, and import dependence
    - Constraint
    - Current
    - Cross-border economics can change faster than software adoption curves
    - Scenario-test GMV, take rate, and retailer credit loss under tariff shocks
  notes: Rows tie each driver or constraint to timing and a concrete next diligence step rather than treating market growth as automatic.
