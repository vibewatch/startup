- id: TM003
  title: Buyer / user / payer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Adoption trigger
  rows:
  - - Single-store indie retailer
    - Owner or buyer
    - Store team
    - Retail business
    - Discover new brands and place first orders
    - Need differentiated assortment with low inventory risk
  - - Multi-location retailer
    - Category buyer or merch lead
    - Store ops and replenishment staff
    - Retail business
    - Order across storefronts and connect to operational workflows
    - Need repeatable replenishment and multi-store control
  - - Larger retailer cohort
    - Professional merchandising team
    - Inventory planners and finance ops
    - Retail business
    - Scale spend across more brands and locations
    - Need broader assortment plus workflow depth
  - - Emerging brand
    - Founder or wholesale lead
    - Sales and catalog ops
    - Brand
    - List products and acquire new retail accounts
    - Need distribution without trade-show travel or cold outreach
  - - Scaled brand or publisher
    - Wholesale account lead
    - Sales ops
    - Brand
    - Reach many storefronts through one channel
    - Need efficient account acquisition and reorder visibility
  - - Cross-border margin seeker
    - Retail buyer or procurement manager
    - Operations or marketplace team
    - Retail business
    - Compare global or regional supply with tax and shipping implications
    - Need better margins or broader catalog than local suppliers provide
  notes: 'The marketplace has dual payer logic: retailers pay with inventory budgets and optional subscription spend, while brands fund distribution through commissions, fees, and promotional tools.'
