- id: sizing-lenses-and-constrained-opportunity
  title: 'Constrained sizing: multiple lenses, not one TAM'
  body: 'The best public sizing approach is to triangulate rather than force a false precision TAM. At the broadest end, the Census Bureau reported $772.2 billion of U.S. merchant-wholesaler sales in March 2026 alone, which annualizes to roughly $9.3 trillion if one uses a single-month run rate. That is too broad and too noisy to treat as Faire’s TAM, but it does show the economic layer the company sits inside. A more relevant management-style lens comes from Digital Commerce 360: U.S. retailers spend hundreds of billions of dollars each year sourcing inventory, yet only about 5 percent of that purchasing currently happens online. Sacra’s estimate of roughly $3 billion in 2025 GMV then gives a current platform checkpoint inside that still-under-digitized pool. Europe provides a second, adjacent lens: EuroCommerce’s 2025 report puts 2024 European B2C e-commerce turnover at €842 billion and projects another 7 percent growth in 2025. That is not wholesale TAM either, but it is a strong proxy
    for digital readiness. The right conclusion is therefore not “the market is huge,” but that public evidence supports a large, fragmented, only partially digitized sourcing market with material measurement gaps.'
