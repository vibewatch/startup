  claims:
  - id: CM001
    statement: Faire positions itself as a two-sided wholesale marketplace connecting independent brands with retailers sourcing inventory for resale.
    type: observed
    topic: market-boundary
    sourceRefs:
    - SM013
    - SM014
    - SM016
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM002
    statement: Faire publicly merchandises categories spanning home decor, food and drink, beauty and wellness, jewelry, paper and novelty, kids and baby, pets, men, and books, indicating a broad general-merchandise scope rather than a single vertical.
    type: observed
    topic: market-boundary
    sourceRefs:
    - SM013
    - SM014
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM001
    - QM002
  - id: CM003
    statement: BLS defines wholesale trade as the intermediate distribution step where goods are sold for resale to retailers or other businesses, which matches the economic layer Faire intermediates.
    type: observed
    topic: market-boundary
    sourceRefs:
    - SM005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM004
    statement: BLS defines retail trade as the final step in distribution selling goods in small quantities to the general public, so consumer retail spend is downstream from Faire rather than the platform's direct transaction market.
    type: observed
    topic: market-boundary
    sourceRefs:
    - SM006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM005
    statement: The latest accessible SBA FAQ compilation says small businesses represented 30.7 million U.S. firms and 99.9 percent of all firms in 2016, supporting the view that independent retail demand is structurally fragmented.
    type: third-party-reported
    topic: buyer-fragmentation
    sourceRefs:
    - SM003
    - SM004
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QM003
  - id: CM006
    statement: The same SBA compilation says small businesses made up 97.5 percent of exporting firms but only 33.3 percent of known export value, implying a long tail of small merchants alongside concentrated trade value.
    type: third-party-reported
    topic: buyer-fragmentation
    sourceRefs:
    - SM004
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QM003
