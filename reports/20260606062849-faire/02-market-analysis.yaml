- id: TM005
  title: Geographic breakdown table
  columns:
  - Region
  - Strongest public indicator
  - Adoption signal
  - Main friction
  - Implication
  rows:
  - - U.S. / North America
    - Census monthly wholesale sales and BLS retail / wholesale labor data
    - Best measurable core market and clearest online-share estimate
    - Still mostly offline and sensitive to tariffs and import costs
    - Primary underwriting geography
  - - Western Europe
    - Large digital base and mature internet/e-shopper penetration
    - Faire says Europe is growing faster than North America
    - More mature competition and higher compliance complexity
    - Best second geography but not frictionless
  - - Southern Europe
    - 9% 2024 e-commerce growth
    - Catching up in digital adoption
    - Lower e-shopper penetration than Western Europe
    - Expansion opportunity with more onboarding work
  - - Eastern Europe
    - 18% 2024 e-commerce growth from a smaller base
    - Longer runway for penetration gains
    - Lower internet and e-shopper penetration plus policy and logistics variation
    - Longer-dated opportunity rather than immediate core
  - - RoW
    - Australia traction and New Zealand expansion cited by Sacra
    - Proof that model travels beyond U.S. and Europe
    - Sparse public market-size data and less underwritable public evidence
    - Optionality exists but should be discounted in near-term sizing
  notes: Regional rows emphasize evidence quality as much as market attractiveness because this chapter is constrained by public underwriting rather than internal management data.
