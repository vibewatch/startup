- id: buyer-user-payer-segmentation-and-adoption-path
  title: Buyer, user, payer, and the adoption path
  body: 'The buyer journey is asymmetric across the two sides of the marketplace. On the retailer side, the buyer is typically the owner, merchandiser, or category buyer; the user is store staff or operations; and the payer is the retail business itself. On the brand side, the decision maker is usually the founder or wholesale lead, the user is sales or catalog operations, and the payer is the brand funding commission, payment-processing, and optional promotion. That split matters because Faire’s adoption wedge is risk reduction first and workflow depth second. The retailer-side wedge is low or no minimums, 60-day terms, and free first-order returns, which lower trial friction for discovery-led buying. The monetization and retention wedge arrives later through repeat ordering, Insider subscription economics, POS integrations, and the Stores workflow for multi-location accounts. Public evidence suggests Faire is already moving upmarket: Sacra says retailers above $1 million in annual sales
    account for more than 20 percent of order volume and Stores is used by more than 35,000 storefronts. Competitor positioning shows why segmentation matters: Orderchamp competes on discovery and easy terms, Qogita on margin and cross-border operations, Alibaba on catalog breadth, and Amazon Business on general procurement rather than curated indie assortment.'
