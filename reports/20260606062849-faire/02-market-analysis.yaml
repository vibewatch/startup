callouts:
- calloutType: strength
  title: The core opportunity is under-digitized, not unproven
  body: The cleanest bullish signal is not a giant TAM deck number; it is that public evidence still says U.S. retailers source hundreds of billions of dollars of inventory while only about 5 percent is online. That leaves meaningful room for workflow-led migration even after Faire has already reached multi-billion-dollar GMV scale.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM033
- calloutType: insight
  title: Buyer adoption is a financing and trust journey before it becomes a software workflow
  body: Faire’s earliest wedge is risk removal through low minimums, delayed payment, and free first-order returns. The durable monetization wedge comes later through repeat ordering, subscription, and operational tooling such as Stores and POS integrations.
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
  - CM027
- calloutType: risk
  title: Trade policy and measurement gaps both limit precision
  body: The same market can look enormous or modest depending on whether one starts from U.S. wholesale gross flow, retailer procurement spend, or consumer e-commerce turnover. At the same time, tariffs, customs, VAT, and de minimis policy remain active variables that can change marketplace unit economics by geography.
  claimRefs:
  - CM020
  - CM040
  - CM041
  - CM048
