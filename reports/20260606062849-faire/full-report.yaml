  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment stance
        blocks:
          - type: paragraph
            body: >-
              Faire's latest market pricing is $5.2B from the November 2025 tender offer, implying roughly 10x
              annualized revenue on a disclosed run-rate above $500M. That multiple is not irrational for a marketplace
              with accelerating GMV, NDR above 110%, and a near-breakeven trajectory. But it leaves no room for
              surprise: any credit-loss materialization on the 60-day net-terms portfolio, any deterioration in the
              Shopify partnership, or any sustained growth deceleration would compress the multiple materially. The
              right stance is track with conditional research-more. The company is not an avoid — the operating
              trajectory and leadership reflexes post-restructuring are genuinely strong — but a clean buy call requires
              three specific diligence deliverables: (1) historical credit-loss and default rates on net-60 terms, (2)
              audited or board-certified revenue and margin data, and (3) the commercial terms of the Shopify
              preferred-partner agreement. Until those are available, investors are pricing into an opaque credit
              exposure layered over a marketplace business. The 10x multiple is defensible only if Faire's take-rate
              durability and credit quality are materially better than public evidence currently allows investors to
              confirm.
            claimRefs:
              - CV001
              - CV002
              - CV003
