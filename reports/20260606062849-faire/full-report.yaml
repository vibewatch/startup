      - number: '8.4'
        title: Bull, base, and bear scenario analysis
        blocks:
          - type: paragraph
            body: >-
              In the bull case, Faire sustains 30-40% revenue growth through 2027, reaches breakeven in 2026, and
              expands its take rate modestly through advertising and logistics penetration. At 12-15x 2026 revenue of
              ~$700M, the equity value is $8-10B — well above the $5.2B entry. The key assumptions are: credit losses
              remain below 0.5% of GMV, Shopify partnership remains intact, and Europe grows to 40%+ of total revenue.
              In the base case, growth decelerates to 20-25%, breakeven arrives in 2026-2027, and the multiple range is
              8-10x on $600-650M revenue, implying an equity value of $5-6.5B — roughly in line with or modestly above
              the current mark. In the bear case, credit losses materialize above 1.5% of GMV, the Shopify partnership
              degrades, or European expansion stalls. Growth decelerates below 15%, the multiple compresses to 4-6x, and
              equity value falls to $3-4B — a 30-40% loss from the tender price. The downside case is not a tail risk;
              it has identifiable triggers and historical precedents in Faire's own 2022 growth collapse.
