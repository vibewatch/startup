            body: >-
              Faire’s public trust posture is mixed. On the positive side, the product offers strong merchant-adoption
              mechanics such as net 60 terms, free returns on first orders, a large support surface, and strong Shopify
              app sentiment around inventory sync and wholesale workflows. Those are not trivial: they help explain why
              the platform can convert both brands and retailers into repeat usage. But two public gaps remain material.
              First, the security and privacy pages were blocked from review on the access date, which leaves
              certifications, data-handling detail, and security architecture only partially inspectable. Second,
              external signals reveal organizational and support risk. BBB complaints and critical reviews show friction
