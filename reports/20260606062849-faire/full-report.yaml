      - number: '4.4'
        title: Capital adequacy, funding dependency, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              As referenced in Company Overview's funding chronology, Faire has already consumed a large amount of
              venture capital; the financial question now is whether the latest round changed operating resilience or
              mainly cleared liquidity pressure. The late-2025 tender clearly supports the latter interpretation.
              Bloomberg described the transaction as roughly $100 million of employee share sales, and Faire's own
              announcement framed it as liquidity for long-term employees and early shareholders at a $5.2 billion
              valuation. That is useful for cap-table hygiene and retention, but it is not the same as disclosed fresh
              balance-sheet cash. Tracxn's funding dataset shows $1.7 billion across nine rounds, while PitchBook shows
              $1.51 billion — a reminder that even basic private-company database fields diverge and should not be
              mistaken for audited truth. Meanwhile, 2023 layoffs of roughly 250 people after a 2022 cut support
              management's claim that the company reset its cost base. What remains missing is the actual
              capital-adequacy package: cash on hand, burn, runway, debt or credit facilities, reserve policy, and
              tender primary-versus-secondary split. Without those, investors can describe trajectory but cannot verify
              solvency durability.
