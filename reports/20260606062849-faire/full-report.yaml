      - number: '3.2'
        title: 'Competitor profiles: scale, funding, differentiation, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              Ankorstore remains the clearest direct competitor for Faire's European ambitions. Funded to $2 billion by
              Bond and Tiger Global in January 2022, it operates in 23 countries and has a commission structure (10%
              repeat, 20% first-order) that is cheaper for brands than Faire's 15% plus fees—a structural pricing
              advantage that Faire has acknowledged. Qogita positions itself differently: rather than being a
              marketplace brand can apply to list on, it aggregates 500+ vetted suppliers and 10K+ brands into a
              consolidated catalog where it negotiates on retailers' behalf. Orderchamp, with 7K brands and 200K
              European retailers, operates on similar Net-60-like terms and free shipping, providing a lighter-weight
              version of Faire's proposition for the EU market.


              NuORDER and Lightspeed occupy a distinct segment. Lightspeed acquired NuORDER to build a B2B ordering
              platform for larger brands and multi-door retailers, often in apparel and mid-market segments rather than
              the long-tail indie brands that Faire focuses on. Their target customer—a brand selling to department
              stores, specialty chains, or multi-brand showrooms—typically has higher minimum order quantities and more
              complex trade terms than Faire accommodates easily. RangeMe's ECRM-backed model connects vendors to major
              retailers (grocery, pharmacy, general merchandise) through curated sessions—a buyer type Faire does not
              primarily serve.


              Amazon Business entered B2B procurement with business pricing, multi-user accounts, and volume discounting
              across Amazon's full product catalog—a very different proposition but one that captures budget from the
              same cost-focused retailer buyer. Alibaba serves cross-border wholesale primarily to higher-volume buyers,
              creating a substitute for the brand discovery mission that is less relevant for Faire's indie segment but
              relevant for larger or more price-sensitive retailers willing to import direct.
