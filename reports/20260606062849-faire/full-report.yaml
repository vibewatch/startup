      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Faire’s founding bench is unusually well documented for a private marketplace company. Max Rhodes serves
              as chief executive officer and is repeatedly described as bringing relevant Square product experience from
              Cash App and Square Capital, which helps explain Faire’s emphasis on financing, merchant workflow, and
              software-led wholesale. Marcelo Cortes is the technical co-founder and CTO, Jeffrey Kolovson is COO, and
              Daniele Perito leads data functions, giving the founding team broad coverage across product, engineering,
              operations, and data science. In February 2026, Sacra reported the addition of Sanjay Raman as chief
              product officer after senior roles at Tripadvisor, Airbnb, and Houzz, signaling continuing investment in
              platform depth. What remains notably thin in public evidence is the full current board composition,
              ownership concentration, and formal governance package. That opacity makes key-person dependence on Rhodes
              and the founder group a real diligence issue even though public leadership continuity itself appears
              strong.
