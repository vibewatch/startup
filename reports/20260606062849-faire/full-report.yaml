  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and module map
        blocks:
          - type: paragraph
            body: >-
              Faire is no longer just a wholesale discovery catalog. Public product evidence shows a multi-sided
              commerce operating system that combines marketplace demand generation, embedded retailer financing, brand
              onboarding, catalog sync, shipping services, and merchant monetization tools inside one workflow. The core
              platform still begins with the two-sided marketplace that connects more than 100,000 brands and 800,000
              retailers globally, but the observable module map now stretches well beyond simple listing and checkout.
              Brands can operate through Brand Portal, use Faire Direct to bring existing retail accounts onto the
              platform, buy logistics services through Ship with Faire, and spend on Promoted Listings. Retailers can
              use net 60 terms, first-order free returns, Faire Insider membership benefits, POS sync, and
              multi-location Stores workflows. That breadth matters because the product strategy monetizes not only take
              rate, but also payments, subscriptions, advertising, and fulfillment. The main diligence question is
              therefore not product breadth, which is evident, but whether the underlying technical and trust layers are
              as durable and inspectable as the front-end feature set suggests.
