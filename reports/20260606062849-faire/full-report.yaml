  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct B2B wholesale peers, adjacent platforms, incumbents, and status-quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              Faire's competitive landscape spans four distinct layers. The closest direct peers are European-focused
              B2B wholesale marketplaces—Ankorstore, Qogita, and Orderchamp—that mirror Faire's two-sided model
              connecting indie brands with independent retailers. Ankorstore is the clearest head-to-head rival: it
              reached a $2 billion valuation in January 2022, operates across 23 European markets with 200K retailers
              and 15K brands, and charges a 10% commission on repeat orders (20% on the first order), materially below
              Faire's 15% base rate. Qogita and Orderchamp are smaller but growing European alternatives with similar
              Net-terms propositions.


              The adjacent layer includes platforms that solve a related but distinct job. NuORDER (part of Lightspeed)
              targets larger enterprise brands with a digital B2B ordering workflow aimed at the traditional apparel and
              mid-market brand segment rather than Faire's indie-brand focus. RangeMe/ECRM connects brands with
              large-chain grocery and retail buyers through structured category sessions—a product-discovery and
              supplier-qualification platform rather than a transaction marketplace. Mable serves the natural and
              specialty food segment, while Carro (dropshipping) offers retailers inventory expansion without
              purchase-order risk.


              The incumbent and status-quo layer is the largest and least often enumerated. Physical trade shows
              rebounded to an estimated $16 billion market by 2024 (PwC data cited by CNBC), and major events attract
              tens of thousands of retailers making inventory purchase decisions. Amazon Business and Alibaba each offer
              B2B procurement at a scale that dwarfs Faire's current GMV, though neither replicates Faire's indie-brand
              curation or Net 60 terms for small retailers. Direct dealer relationships and cold outreach remain the
              default for many brands outside North America.
