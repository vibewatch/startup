  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Credit loss disclosure
        - Net-60 default rates exceed 2% of trailing GMV in any disclosed period
        - >-
          Reframes Faire as a credit business layered under marketplace revenue; materially impairs margin and capital
          efficiency thesis
        - >-
          Move to avoid; require full reserve disclosure and recalibrate valuation to 5-6x net revenue (excluding
          credit-loss-adjusted GMV from revenue base)
      - - Shopify partnership change
        - >-
          Shopify publicly withdraws preferred-marketplace status, reduces API access, or launches competing wholesale
          marketplace
        - >-
          Removes primary new-retailer acquisition channel; reduces GMV growth assumption by 20-30%; increases CAC
          materially
        - >-
          Move to track; reduce bull-case valuation by 25%; require evidence of alternative acquisition channel
          viability before re-rating
      - - Revenue growth deceleration
        - Full-year 2026 revenue growth below 15% after 32% disclosed in 2025
        - >-
          Signals a second deceleration cycle similar to 2022; could indicate structural market saturation or
          intensifying competition from Amazon Business
        - >-
          Move to track; reduce multiple to 6-7x forward revenue; engage management for explanation before further
          action
      - - Second antitrust filing
        - New antitrust lawsuit alleging exclusive dealing or anti-competitive ToS clauses filed after Tundra dismissal
        - >-
          Documents ongoing legal risk in a higher-profile format; could trigger regulatory review and ToS changes that
          reduce brand lock-in
        - Place on hold pending legal outcome; evaluate what ToS changes management has planned or already made
      - - IPO delay beyond 2027
        - No public S-1 filing or clear IPO timeline by end of 2027
        - >-
          Secondary liquidity path is less clear; preference holders face longer hold; dilution risk from potential
          additional funding rounds increases
        - >-
          Reassess holding thesis; verify cap table and liquidation preference stack; negotiate secondary liquidity if
          available
    notes: >-
      Kill triggers are not guarantees of loss; they are observable, time-bounded events that would change the
      investment posture from track to avoid or require active engagement with management.
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Credit-loss and default rates
        - No public disclosure of net-60 default rates, reserve methodology, or credit-quality cohort distribution
        - >-
          A 1-2% GMV credit loss rate would represent $30-60M in annual losses; the valuation is uninvestable without
          this data
        - >-
          Request from CFO; historical monthly loss data by retailer cohort, segment, and geography for at least 24
          months
      - - Audited financials and gross margin
        - No audited 2024-2025 financials, no gross margin disclosure, no contribution margin by segment
        - >-
          Margin structure determines whether Faire is a software-like marketplace or a thin-margin financial-services
          platform
        - Request from CFO; full P&L, gross margin bridge, segment economics, and advertising margin specifically
      - - Shopify commercial agreement
        - Full terms of the Shopify preferred-partner agreement and shareholder agreement
        - >-
          Termination triggers, exclusivity terms, and renewal rights determine the reliability of the primary
          acquisition channel
        - Request from CEO/CLO; commercial agreement, termination provisions, and any most-favored-nation provisions
      - - Cap table and preference stack
        - No public disclosure of preference waterfall, ratchets, or anti-dilution terms
        - >-
          Full preference stack determines actual equity value at various exit prices; $5.2B equity claim may overstate
          common equity value
        - >-
          Request from CFO/counsel; full cap table, preference rights, and liquidation waterfall model at $5B and $10B
          exit scenarios
      - - European market unit economics
        - No disclosure of European profitability, CAC, LTV, or market-by-market GMV concentration
        - >-
          Europe growing at 2x North America is a headline claim; the bull case requires Europe to be margin-accretive,
          not just growth-additive
        - Request from CFO; European revenue by market, gross margin by geography, and CAC/LTV for EU top 5 markets
      - - AI and logistics investment plan
        - >-
          No public disclosure of capex or opex budget for AI buying assistant, Ship with Faire consolidation, and
          logistics buildout
        - >-
          Capital intensity of the logistics and AI roadmap determines whether near-breakeven is sustainable or requires
          a new funding round
        - >-
          Request from CFO/CPO; 3-year operating plan, capex by initiative, and unit economics projections for Ship with
          Faire and AI features
    notes: >-
      These are non-negotiable diligence items. None of them requires proprietary information beyond what would be in a
      Series-stage data room. Absence of any one of them is a red flag for governance and investment readiness.
    claimRefs:
      - CV001
      - CV004
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
