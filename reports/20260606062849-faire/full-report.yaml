      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Critical missing input: credit-loss data on 60-day net terms'
            body: >-
              The single most important undisclosed piece of information is Faire's historical default and credit-loss
              rate on the 60-day net-terms portfolio. At $3B GMV with a ~19% take rate, even a 1% annualized default
              rate represents ~$30M in losses — roughly 5% of expected 2025 revenue. Investors cannot responsibly
              underwrite the current valuation without this data. It is a non-negotiable diligence ask.
            calloutType: risk
            claimRefs:
              - CV003
