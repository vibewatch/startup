      - number: '7.2'
        title: Legal, regulatory, and platform-governance risks
        blocks:
          - type: paragraph
            body: >-
              The most concrete public legal risk is Tundra Inc.'s antitrust case against Faire in the Northern District
              of California. Tundra alleged that Faire's terms with brands effectively required brands that first met a
              retailer on Faire to continue transacting with that retailer only through Faire, turning the marketplace
              into a de facto exclusive-dealing mechanism. The complaint also alleged that Faire required full-catalog
              listings, used payment withholding and commission waivers to enforce compliance, and targeted
              Tundra-affiliated brands. The court granted Faire's motion to dismiss in November 2024, but the dismissal
              did not erase the factual record created by the complaint and motion papers. That matters because a future
              plaintiff with stronger market-definition evidence could revisit the same conduct as Faire grows. That
              residual exposure also sits inside a live competition-law framework: FTC and DOJ guidance both describe
              exclusive dealing, tying, and related restraints as standard antitrust concerns, while the European
              Commission maintains a separate competition-policy regime that could become relevant as Faire scales
              across Europe. Separately, Faire's operation across more than 35 countries creates an ongoing GDPR,
              ePrivacy, and cross-border data-transfer burden. Its privacy materials indicate data collection and
              sharing with multiple third parties, which raises the cost of ongoing compliance. Even without a public
              FTC action, the company sits inside a regulatory perimeter that includes the FTC's Bureau of Consumer
              Protection and the Better Business Bureau complaint channel, so governance failures would likely become
              visible through multiple venues at once.
            claimRefs:
