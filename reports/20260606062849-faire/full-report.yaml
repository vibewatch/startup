      - number: '4.2'
        title: Unit economics and sales efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public unit economics are incomplete, so underwriting has to rely on proxies rather than true CAC, LTV, or
              payback math. The best positive proxy is retention quality: Sacra cites net dollar retention above 110%,
              while the Shopify app ecosystem shows real merchant adoption with hundreds of reviews and consistent
              comments that Faire increases wholesale order volume while reducing catalog and order-management friction.
              Those signals imply a self-service growth loop where distribution, integration, and repeat ordering matter
              more than a high-touch sales model. But the public record never discloses actual acquisition cost, cohort
              payback, gross margin, or contribution margin by stream. CNBC helps on trajectory rather than precision:
              2025 revenue reportedly grew 32% over 2024 and management says the business is nearing breakeven, yet the
              company declined to provide documentation verifying that growth. That combination is encouraging for
              efficiency direction, but insufficient for a real CAC/LTV underwriting model. For this chapter, the right
              stance is to score retention and channel fit as positive proxies while keeping the core unit-economics
              cells null until management provides cohort, margin, and acquisition data.
