      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The underwriting verdict is mixed but usable. Revenue quality is better than a one-dimensional transaction
              marketplace because Faire now has visible fee layers in ads, payments, subscriptions, and logistics, and
              because retention/take-rate data improved after the 2022-2023 reset. Public comp framing is also
              supportive: at roughly $500M+ revenue run rate, Faire is already operating at a scale where the comparison
              set is no longer tiny startup marketplaces but listed commerce platforms that disclose quarterly reports,
              SEC filings, and investor presentations. Yet the chapter still ends with material blockers. The biggest is
              credit opacity: no public default rate, reserve build, or delinquency vintage data exists for the Net 60
              book. The second is margin opacity: no audited revenue, gross margin by stream, or contribution margin for
              logistics/ads/subscription is public. The third is capital opacity: no disclosed cash balance, burn,
              runway, or primary cash raised in the latest event. Until those three packages are produced, Faire looks
              like a strong revenue engine with an unverified balance-sheet model rather than a fully underwritable
              late-stage marketplace.
