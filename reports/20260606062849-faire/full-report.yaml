      - number: '7.3'
        title: Credit, working-capital, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Faire's financial-model risk is dominated by the mismatch between how quickly it pays brands and how
              slowly it collects from retailers. Public materials indicate that retailers can receive net-60 terms while
              brands can choose accelerated payouts in as little as one day for a higher fee. That creates a funding gap
              that scales directly with GMV and becomes more dangerous if defaults, fraud, or return rates rise. The
              free-returns promise on opening orders is strategically useful because it reduces retailer purchase
              friction, but it also gives Faire another balance-sheet exposure that is tied to transaction volume and
              customer behavior. Sacra's estimates imply about $3 billion of GMV in 2025 and roughly a 19% take rate,
              which translates into about $570 million of revenue before considering bad debt, returns, or logistics
              complications. A 1% to 2% loss rate on GMV would therefore imply about $30 million to $60 million of
              annual downside, large enough to matter even for a company approaching breakeven. Because many Faire
              retailers ultimately sell into consumer end-markets, Federal Reserve consumer-credit conditions are also a
              useful external leading indicator for retailer cash-flow stress and default sensitivity. Advertising
              revenue and the Insider subscription add diversification, but they are not yet large enough to offset a
              material deterioration in credit performance. Ship with Faire adds more utility and revenue, yet it also
              deepens working-capital and operational exposure by tying fulfillment quality and shipping economics to
              marketplace trust.
            claimRefs:
              - CR016
              - CR017
