  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and geographic scale
        blocks:
          - type: paragraph
            body: >-
              Faire's customer base is broad on both sides of the network, but the retailer side is the clearest public
              demand signal. Official pages still frame the platform around independent retailers across categories from
              clothing boutiques to grocery stores, while Sacra's market mapping indicates the platform has already
