chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Faire is a San Francisco-based B2B wholesale marketplace that connects independent brands with independent
              retailers and positions itself as a digital replacement for fragmented offline wholesale discovery. Public
              materials and third-party profiles align on a 2017 operating launch, Y Combinator W17 origins, and the
              legal entity Faire Wholesale, Inc., which Tracxn lists as incorporated in late 2016. The homepage says
              retailers can shop wholesale from more than 100,000 brands, while outside research describes the company
              as one of the largest curated wholesale networks for small and midsize merchants. The business model mixes
              marketplace discovery, order flow, financing support, and operational tooling rather than acting as a
              simple directory. Brands pay transaction fees on marketplace orders, retailers get Net 60 terms and
              free-return policies that reduce trial risk, and the platform has built formal pricing, support, and legal
              surfaces that indicate a mature operating stack rather than a lightweight listing site.
