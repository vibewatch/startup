  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - vendor
      - commission / fee model
      - included capabilities
      - discount or zero-commission path
      - implication
    rows:
      - - Faire
        - 15% brand commission + $10 opening-order fee + 1.9–3.5% payment processing fee
        - Net 60 terms, free returns on opening orders, Shopify sync, promoted listings, Ship with Faire logistics
        - Faire Direct link = 0% commission (but processing fees apply since July 2023)
        - Effective take ~19%; high for brands, but retailer Net 60 and free returns subsidize the margin take
      - - Ankorstore
        - 20% first-order commission; 10% repeat-order commission
        - Net 60 retailer terms, broad European market reach, no warehouse intermediation
        - Lower repeat-order commission than Faire creates cost advantage for brands with repeat business
        - Lower take rate creates pricing leverage; Faire must differentiate on reach and tools to justify premium
      - - Qogita
        - Commission structure not publicly disclosed; model is supplier-aggregation and bulk negotiation
        - 500+ supplier catalog, EU/UK fulfillment, guaranteed authenticity, seamless onboarding
        - Negotiated bulk pricing delivered directly to retailers; no explicit Faire Direct analog
        - Different model—retailer pays catalog price, Qogita extracts margin from supplier negotiations
      - - Orderchamp
        - Commission not disclosed; free shipping and low minimum orders marketed as core value proposition
        - Net 60 payment, low minimums, direct brand-to-retailer fulfillment, European catalog
        - Not applicable (no published Direct equivalent)
        - Orderchamp competes on retailer economics rather than disclosed commission rate
      - - NuORDER / Lightspeed
        - Not a commission marketplace; enterprise B2B order management with subscription pricing
        - Digital linesheets, order management, Lightspeed POS integration
        - No commission model; subscription-based SaaS pricing for brands
        - Different revenue model reduces direct price competition with Faire for indie brands
      - - Physical trade shows
        - Booth rental / exhibitor fee; no commission on transactions
        - In-person discovery, sample viewing, relationship building, seasonal event timing
        - No commission on orders placed at the show; brands pay fixed booth fee
        - Zero variable commission on show orders is structurally advantaged; cost is fixed booth participation
    notes: >-
      Faire's pricing is the most fully documented in retained sources. Ankorstore's commission is from 2022 Series C
      coverage. Qogita and Orderchamp commission details are not publicly disclosed in retained evidence.
    claimRefs:
      - CP002
      - CP003
      - CP007
      - CP013
      - CP025
