      - number: '3.5'
        title: 'Adverse competitor evidence: exclusive dealing controversy, commoditization pressure, and European rivalry'
        blocks:
          - type: paragraph
            body: >-
              The Tundra litigation illuminated a genuine competitive risk embedded in Faire's brand Terms of Service.
              Tundra, which offered a zero-commission model funded by advertising, alleged that Faire's ToS prohibited
              brands from completing orders with competing platforms for retailers they had already served through
              Faire—a classic exclusive dealing pattern. While the Northern District of California dismissed Tundra's
              First Amended Complaint in November 2024, the episode drew regulatory and competitive attention to Faire's
              distribution practices. Tundra itself struggled commercially, but its zero-commission model exposed the
              ceiling on brand margin tolerance for 15%+ take rates, and other well-funded entrants could revive that
              pricing challenge.


              Reviewer evidence adds to the adverse picture: brands report inflated Faire list prices relative to their
              own wholesale sites, strict credit enforcement that removes Net 60 for missed payments without grace
              periods, and declining customer service quality. BBB complaints record disputes over credit enforcement
              and account access decisions. These adverse user signals are consistent with a platform whose terms of
              service and enforcement posture prioritize scalable rule-sets over relationship management—a rational
              trade-off for Faire's scale but a competitive vulnerability when boutique or curated alternative platforms
              use service quality as a wedge. Faire's GMV acceleration and revenue growth are genuine, but the
              brand-commission friction and customer service gaps are real openings for well-capitalized competitors in
              specific regions or categories.
