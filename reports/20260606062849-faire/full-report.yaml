      - number: '7.4'
        title: Partner and platform-dependency risks
        blocks:
          - type: paragraph
            body: >-
              Faire's dependency profile is unusually concentrated for a marketplace that otherwise presents itself as a
              broad network. Shopify is the most important single counterparty because it is both a shareholder and the
              platform that recommends Faire as the preferred wholesale marketplace for merchants. If Shopify changes
              API economics, revokes preferred status, or launches a more direct competing product, Faire could lose a
              meaningful share of retailer acquisition momentum while also facing disruption across its integration
              layer. Dependence also exists on the supply side. Although Faire has more than 100,000 brands, public data
              still do not show how much GMV is concentrated in the top brands, which means network depth may hide
              meaningful revenue concentration. The company also competes with multiple discovery channels, including
              revived physical trade shows and scaled B2B platforms such as Amazon Business, Alibaba, Ankorstore, and
              Qogita. Logistics adds another layer: Ship with Faire now touches about half of all orders, which improves
              control and monetization but creates exposure to carrier pricing and service quality. POS integrations
              with Shopify, Square, Clover, and Lightspeed help retention, yet they also tie operational performance to
              outside platforms whose roadmaps and commercial incentives Faire does not control.
