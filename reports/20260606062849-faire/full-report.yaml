companyProfile:
  summary: >-
    Faire is a San Francisco-based wholesale marketplace founded in 2017 that connects independent retailers with
    independent brands and wraps that marketplace with Net 60 payment terms, first-order free returns, advertising,
    subscriptions, and logistics services. Public evidence supports genuine scale rather than a narrow niche: the
    company says it offers more than 100,000 brands, Sacra describes more than 800,000 retailers on the platform, and
    public sources indicate roughly $1.7 billion of total funding culminating in a November 2025 valuation around $5.2
    billion. The central diligence question is no longer whether Faire has market presence; it is whether the company
    can sustain premium marketplace economics after accounting for credit, returns, and operating complexity.
