      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Faire has raised $1.7 billion in total funding across nine rounds. The Series I in November 2025 ($100M at
              $5.2B) was led by WCM Investment Management with participation from Baillie Gifford and True North Fund.
              The $5.2B valuation represents a 59% decline from the May 2022 Series G extension peak of $12.59B, a
              correction that CEO Max Rhodes has described as a healthy recalibration from overbuilding. The most
              important shift in the financing context is that Faire is no longer selling a growth story at any price —
              it is now positioned as a durable-growth business approaching breakeven. The $5.2B mark is therefore a
              floor test, not a growth premium. Shopify joined as both a strategic shareholder and a distribution
              partner in September 2023, adding an aligned institutional incentive to protect the partnership. No public
              information on preference stack, liquidation waterfall, or anti-dilution terms is available. Investors
              considering secondary or co-investment positions should treat the preference overhang as unknown and seek
              direct disclosure before pricing risk.
            claimRefs:
              - CV007
