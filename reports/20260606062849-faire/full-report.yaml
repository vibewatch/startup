  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Type
      - Metric
      - Multiple / valuation
      - Relevance
      - Limitation
    rows:
      - - Etsy (ETSY)
        - Public marketplace
        - FY2024 revenue ~$2.8B, market cap ~$6B
        - ~2-2.5x EV/revenue
        - >-
          Direct marketplace comp; also two-sided with sellers and buyers; consumer-facing but B2B dynamics in its
          wholesale vertical
        - >-
          Etsy's growth is slower and margin is higher; it has proven profitability; Faire has neither of these at the
          same level yet
      - - Shopify (SHOP)
        - Public commerce platform
        - FY2024 revenue ~$9B, market cap ~$100B+
        - ~10-12x revenue
        - Infrastructure platform with SaaS-like recurring revenue; Faire's strategic partner and shareholder
        - >-
          Shopify has much higher gross margins (50%+) and a subscription+transaction blend; Faire is more
          marketplace-dependent
      - - Ankorstore
        - Private European direct competitor
        - $2B valuation (Jan 2022, stale)
        - ~stale; likely lower post-multiple compression
        - Most direct European comp; operates same B2B wholesale model
        - Valuation is 3+ years old; market multiples have compressed significantly since early 2022
      - - Global-E Online (GLBE)
        - Public cross-border commerce
        - FY2024 revenue ~$800M, market cap ~$3-4B
        - ~4-5x revenue
        - Relevant comp for Faire's international cross-border expansion premium
        - Different model (global checkout, not discovery); lower take rate; different network effects
      - - Faire (entry price)
        - Private tender offer
        - $500M+ annualized revenue, $5.2B valuation
        - ~10x annualized revenue
        - Actual entry price anchor
        - Based on management-disclosed run rate, not audited; credit opacity prevents clean multiple confirmation
    notes: >-
      Comps are illustrative anchors, not precise marks; all multiples are approximate and based on public market data
      at time of report. Faire's 10x multiple sits above the Etsy floor (2x) and near the lower end of Shopify's premium
      (10x+).
