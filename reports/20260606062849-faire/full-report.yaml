      - number: '3.4'
        title: Network effects, Shopify distribution, and multi-homing risk
        blocks:
          - type: paragraph
            body: >-
              Faire's most durable competitive advantage is network density rather than pricing or product features
              alone. With 10 million brand-retailer relationships, 800K retailers, and 100K+ brands, the platform's
              matching quality and recommendation relevance compounds with scale in ways that smaller marketplaces
              cannot quickly replicate. The Shopify partnership (September 2023) that made Faire the recommended
              wholesale marketplace for Shopify reinforces this density by routing Shopify's millions of merchants
              toward Faire at a critical buying moment. 75K actively integrated retailers placing 20% more orders
              demonstrates that integration-driven retention is measurable and growing.


              The adverse constraint is that network density is a moat, not a wall. European peers are building their
              own networks with meaningful scale: Ankorstore had 200K retailers in early 2022 and operates in 23 markets
              with EU local-brand curation that Faire cannot immediately replicate even with its faster EU expansion.
              Tracxn counts 387 active competitors for Faire across global markets, including 21 funded peers.
              Multi-homing remains easy for both brands (who can list on multiple platforms) and retailers (who can buy
              from multiple sources without switching costs), which means Faire must keep converting platform scale into
              observable order frequency advantages to sustain its GMV lead.
