          - type: callout
            title: Path from track to buy
            body: >-
              The recommendation moves from track to buy if management confirms three conditions: (1) trailing 24-month
              credit-loss rates on net-60 terms below 1% of GMV; (2) 2024-2025 gross margin above 40%; and (3) Shopify
              partnership terms including multi-year renewal provisions. If all three are confirmed at a valuation at or
              below $5.2B, the investment case becomes compelling at the base-case growth trajectory.
            calloutType: recommendation
