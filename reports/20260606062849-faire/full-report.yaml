      - number: '8.3'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core thesis for Faire is that the B2B wholesale market is structurally under-digitized — only about 5%
              of U.S. retailer purchasing happens online — and Faire is the clear leader in converting that market. The
              evidence supporting this is strong: $3B GMV growing for eight consecutive quarters, NDR above 110% proving
              wallet-share expansion, a European business growing at twice the North American rate, and an emerging ads
              business that adds a higher-margin revenue layer. The anti-thesis starts with the credit model. Faire's
              60-day net-terms offering is its most powerful retailer acquisition tool and its most opaque financial
              risk. No public disclosure of default rates, reserve methodology, or credit-quality distribution exists.
              Additionally, the Shopify dependency concentrates Faire's primary acquisition channel in a single
              counterparty that is also a competitor in adjacent commerce infrastructure. Two rounds of layoffs in
              2022-2023 and CEO Max Rhodes' own admission that the company “took shortcuts” and lost track of retention
              metrics establish that execution risk is real and historically validated, not hypothetical.
            claimRefs:
