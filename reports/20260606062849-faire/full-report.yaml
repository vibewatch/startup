  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Faire sits inside a narrower market than the generic label “e-commerce” suggests. The company
              intermediates wholesale merchandise flows between brands and retailers, so the included spend is inventory
              purchased for resale, not consumer checkout, retail payroll, or general SaaS spend. BLS’s sector
              definitions are useful here: wholesale is the intermediate step that sells goods for resale, while retail
              is the final step that sells small quantities to end consumers. Faire’s own merchandising confirms that
              the platform is broad within that boundary—home decor, food and drink, beauty, jewelry, paper, kids, pets,
              men, and books—but it is still a resale marketplace rather than a general procurement network. The
              practical substitutes therefore include trade shows, incumbent wholesalers, direct brand relationships,
              and a wider set of digital procurement surfaces such as Alibaba, Amazon Business, Qogita, Orderchamp,
              Ankorstore, and NuORDER. SBA’s small-business data adds an important structural point: the demand side is
              fragmented, which is exactly the kind of environment where search, financing, and trust intermediation can
              create value.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
