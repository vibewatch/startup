      - number: '7.5'
        title: People and execution risks
        blocks:
          - type: paragraph
            body: >-
              Faire's people risk is not abstract; management has already acknowledged that the company over-expanded
              and damaged execution quality in the process. The first signal was the October 2022 layoff, when Faire cut
              about 7% of a roughly 1,200-person workforce. The second was the deeper February 2023 restructuring that
              eliminated about 20% of staff, including core functions such as engineering, product, design, and data
              science. Max Rhodes' March 2026 comments make the risk more credible because they were unusually candid:
              he said the company got addicted to growth, took shortcuts, and saw retention and product quality
              deteriorate. That combination indicates the previous operating model was already failing before the reset.
              Faire has meaningful leadership strength in its co-founding bench, including technical and operating
              co-founders who remain at the company, but the cost of restructuring should not be minimized. TeamBlind's
              3.8 out of 5 employee rating suggests a decent but not elite internal sentiment profile, and the arrival
              of a new CPO in February 2026 means product leadership is still settling. Execution risk is therefore
              concentrated in two areas at once: maintaining cultural stability after painful cuts and delivering
              European expansion, logistics, and AI initiatives without repeating the same overreach.
