      - number: '7.6'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Faire does have real mitigants, which is why the company remains investable despite the risk profile. Net
              dollar retention above 110% implies that existing retailers continue to spend more over time, which lowers
              the probability that all growth is coming from weak-quality demand. Europe is growing faster than North
              America, providing a geographic diversification narrative rather than a single-market story. The company
              also has newer, more recurring revenue streams in ads and Faire Insider, while $1.7 billion of cumulative
              funding provides an operating cushion if growth remains disciplined. Management deserves some credit for
              acknowledging mistakes early enough to restructure rather than preserving a false growth story. Shopify's
              shareholder position also creates alignment, not just dependence, because Shopify has a financial reason
              to preserve the partnership if it remains strategically useful. Still, mitigants do not remove the need
              for hard monitoring. Investors should track loss rates on net-60 terms, opening-order return costs, the
              exact commercial terms of the Shopify relationship, brand and retailer concentration, European
              profitability, and the credibility of the path to breakeven. The thesis should break if credit losses
              exceed 2% of GMV, Shopify materially weakens the partnership, Europe loses its relative growth advantage,
              or a second antitrust challenge gains real traction.
