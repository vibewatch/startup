      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The structural bull case is straightforward: public evidence still implies that wholesale sourcing remains
              mostly offline, so digital migration alone can power years of growth if buyers trust the workflow. Digital
              Commerce 360’s estimate that only about 5 percent of U.S. inventory sourcing is online is the clearest
              proof point. Europe adds another supportive signal because internet penetration is already above 90
              percent and e-shopper penetration has reached 73 percent, while EuroCommerce points to continuing
              innovation in payments, logistics, and AI. Those drivers, however, sit beside real adoption constraints.
              EuroCommerce’s retail work describes a European nongrocery sector still dealing with cautious spending,
              supply-chain disruption, discounters, and pricing pressure. Its 2025 e-commerce report says only 6 percent
              of SMEs meet the EU’s very high digital-intensity threshold, which limits adoption of advanced tools.
              Cross-border complexity is another real constraint: the same report highlights regulatory burden and
              unfair competition concerns, while Qogita makes VAT, customs, and documentation support an explicit
              product feature. In other words, growth is available, but it is not frictionless; financing, trust,
              compliance, and usability remain core adoption gates.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM042
