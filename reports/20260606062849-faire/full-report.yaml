  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Implied valuation
      - Key risks
      - Probability signal
    rows:
      - - BULL
        - >-
          Revenue grows 35-40% to ~$700M in 2026; breakeven achieved mid-2026; NDR expands to 115%; Europe becomes 40%
          of revenue; credit losses remain below 0.5% GMV
        - 12-15x 2026 revenue = $8.5-10.5B; ~63-100% upside from $5.2B
        - Shopify terms change; credit losses surprise to upside; EU regulatory barriers accelerate
        - >-
          Signals: Q3-Q4 2026 revenue growth above 35% + public breakeven announcement + EU disclosure of 40%+ revenue
          share
      - - BASE
        - >-
          Revenue grows 20-25% to ~$625M in 2026; near-breakeven in 2026-2027; NDR holds at 110%; credit losses below 1%
          GMV
        - 8-10x 2026 revenue = $5-6.5B; in line with or modest premium to current $5.2B
        - Execution risk on AI product delivery; credit losses rising above 1%; Shopify partnership friction
        - >-
          Signals: Revenue growth within 20-30% range + no major negative credit disclosure + Shopify partnership
          continued intact
      - - BEAR
        - >-
          Revenue growth decelerates below 15%; credit losses emerge above 1.5% GMV; Shopify reduces preferred-partner
          status or builds competing wholesale marketplace
        - 4-6x $550M+ revenue = $2.2-3.3B; 37-58% loss from $5.2B
        - Multiple compression plus credit impairment + growth deceleration simultaneously
        - >-
          Signals: Q3-Q4 2026 growth below 15% + credit-loss disclosure above 1.5% GMV + Shopify partnership
          announcement change
    notes: >-
      Scenarios are not probability-weighted; they are designed to be monitored against specific observable triggers,
      not modeled as point estimates.
