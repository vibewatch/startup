  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              Faire's risk stack is best understood as a severity-ranked chain rather than a loose list of independent
              issues. First, credit and working-capital exposure is the most important risk because Faire extends net-60
              payment terms to more than 800,000 retailers while also subsidizing free returns on opening orders. That
              means downside scales with GMV, and the public record still does not disclose default rates, reserve
              policy, or loss severity. Second, Shopify dependency is structural: Shopify became both an investor and
              the platform that recommends Faire as the default wholesale marketplace for many merchants, so a single
              partner influences top-of-funnel acquisition, integration depth, and strategic leverage. Third, antitrust
              and platform-governance risk remains live even after Tundra's lawsuit was dismissed, because the
              litigation put Faire's restrictive marketplace terms into the public record. Fourth, execution and talent
              risk matters because layoffs and management's own admissions about declining retention and product quality
              show the organization already stretched too far once. Fifth, regulatory and privacy risk widens as Faire
              operates across more than 35 markets. The clearest thesis-break point is simple: if credit losses begin to
              materialize at GMV scale, Faire starts to look less like a pure marketplace and more like a thin-margin
              credit intermediary. A secondary underwriting risk is data quality: at least one third-party company
              database appears to conflate Faire with a different business, so investors should anchor core diligence on
              primary materials and company-supplied data.
            claimRefs:
