  rows:
  - - 'Antitrust / exclusive-dealing ToS risk'
    - 'Tundra v. Faire (23-cv-02513) filed May 2023; motion to dismiss granted Nov 2024, but documented ToS clause prohibiting brand-retailer dealing outside Faire'
    - 'Medium'
    - 'High'
    - 'Motion dismissed on market-definition grounds, not because the clause is unproblematic'
    - 'Any future antitrust action with stronger market-definition evidence could reinstate risk; obtain current ToS and map clause to current market share'
  - - 'EU GDPR and multi-market privacy compliance'
    - 'Faire operates in 35+ markets including all EU member states; privacy obligations under GDPR and ePrivacy Directive apply'
    - 'High'
    - 'Medium'
    - 'Faire has data-sharing terms and EU market presence, suggesting some compliance infrastructure'
    - 'Request DPA registry, privacy team composition, consent logs, and data-transfer mechanisms (SCCs or adequacy decisions)'
  - - 'FTC and consumer-protection oversight'
    - 'FTC Bureau of Consumer Protection actively enforces B2B marketplace conduct rules; BBB maintains a consumer-complaints record for Faire'
    - 'Medium'
    - 'Medium'
    - 'No public FTC action found against Faire; BBB profile establishes complaint-handling baseline'
    - 'Confirm FTC-compliance review cadence, BBB complaint resolution rate, and any state AG inquiries'
  - - 'US tariff and trade-policy risk'
    - 'US tariff changes in 2025 pressured sourcing costs; Faire launched a No Import Duties filter and cut Ship with Faire rates 20%'
    - 'High'
    - 'Medium'
    - 'Faire has proactively mitigated through product features and shipping-rate reductions'
    - 'Monitor tariff policy changes affecting small brands; confirm credit-limit increase programme absorbs retailer cost pressure'
  notes: 'Severity reflects investment consequence, not enforcement probability. The antitrust risk is residual because the dismissal was on narrow grounds; GDPR is ongoing and structural for any 35-market operator.'
