  body: 'Faire''s 60-day net terms model is the company''s strongest retailer-acquisition tool and its most opaque financial risk. With roughly $3 billion of GMV implied for 2025, even a 1% default rate would translate into about $30 million of annual losses. Public sources do not disclose default rates, reserve methodology, or credit-quality distribution, so investors cannot fully underwrite the valuation without private credit data.'
  claimRefs:
  - 'CR016'
  - 'CR017'
  - 'CR018'
  - 'CR019'
- calloutType: 'recommendation'
  title: 'Thesis-break threshold'
  body: 'If Shopify terminates or materially degrades the recommended-partner agreement, and if credit losses on net-60 terms are not disclosed and confirmed to be below 2% of GMV, the investment thesis loses its two strongest structural supports simultaneously. Neither condition should remain unresolved before investment.'
  claimRefs:
  - 'CR023'
  - 'CR024'
  - 'CR039'
  - 'CR040'
