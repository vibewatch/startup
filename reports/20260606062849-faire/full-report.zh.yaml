      - number: '1.3'
        title: 融资历史、估值与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Faire 已经搭出风投支持的商业基础设施中较大的资本底座之一。公开报道显示，公司前五年融资超过 $1 billion，截至 2025 年末累计约 $1.7 billion，涵盖 YC 支持、多轮增长轮、2021
              年 Series G、2022 年 Series G 扩展轮、Shopify 2023 年战略投资，以及 2025 年 11 月按 $5.2 billion 估值完成的 Series I
              轮或与要约交易挂钩的融资。最新估值较 2022 年 5 月约 $12.59 billion 的峰值大幅重置，但 Faire 仍是规模化私营市场平台，投资人名单深厚，包括 Sequoia、Y
              Combinator、Founders Fund、Lightspeed、WCM Investment Management、Shopify 和 True North
              Fund。因此，利益相关方地图的意义不只是声望，也关系到战略杠杆：Shopify 能带来分发，后期资本提供方则会影响员工流动性、定价纪律和 IPO 时间预期。
