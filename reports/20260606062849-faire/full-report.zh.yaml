      - number: '3.5'
        title: 反向竞争证据：排他交易争议、商品化压力与欧洲竞争
        blocks:
          - type: paragraph
            body: >-
              Tundra 诉讼揭示了嵌在 Faire 品牌服务条款里的真实竞争风险。Tundra 提供由广告资助的零佣金模式，指控 Faire 的 ToS 禁止品牌通过竞争平台与已经在 Faire
              服务过的零售商完成订单——这是典型排他交易模式。尽管 Northern District of California 在 2024 年 11 月驳回了 Tundra 的 First Amended
              Complaint，这一事件仍把监管和竞争注意力引向 Faire 的分发做法。Tundra 自身商业表现不佳，但它的零佣金模式暴露了品牌对 15%+
              抽佣率的利润率容忍上限，其他资金充足的新进入者可能重启这种价格挑战。


              评论者证据进一步加重反向图景：品牌报告称 Faire 列表价相对自有批发网站被抬高，严格信贷执行会在未按时付款且没有宽限期时取消 Net 60，客服质量也在下降。BBB
              投诉记录了围绕信贷执行和账户访问决定的争议。这些反向用户信号符合一个平台的状态：服务条款和执行姿态优先考虑可规模化规则集，而不是关系管理。对 Faire
              的规模而言，这种取舍理性，但当精品或策展式替代平台把服务质量作为楔子时，它也会成为竞争漏洞。Faire 的 GMV
              加速和收入增长是真实的，但品牌佣金摩擦和客服缺口，也给资金充足的竞争者在特定地区或品类切入留下了真实开口。
