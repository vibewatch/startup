      - 相关性
    rows:
      - - 核心批发市场平台
        - 品牌和零售商之间为转售而采购的库存
        - 消费者结账、零售薪资、一般软件支出
        - 零售商买方和品牌卖方都通过交易经济性付费
        - 这是 Faire 的直接交易层
      - - 独立特色零售
        - 精品店、礼品、美妆、食品、宠物、图书及类似门店采购差异化商品
        - 大卖场补货和企业采购项目
        - 零售店主、买手或商品负责人从门店 P&L 支付
        - 最契合 Faire 的精选品类和低起订量主张
      - - 品牌分销获客
        - 品牌为触达零售渠道而支付的佣金、处理费、促销和分销支出
        - 批发转化之外的纯 DTC 营销或市场平台广告
        - 品牌创始人或批发负责人为渠道出资
        - 重要，因为品牌是付费侧，不只是供给库存
      - - 现状替代品
        - 展会、品牌直联、既有批发商和线下订货关系
        - 消费者搜索、零售媒体和无关采购
        - 任一方支付差旅、关系或客户管理成本
        - 这些渠道设定了数字市场平台采用的基准门槛
      - - 相邻数字采购
        - Alibaba、Amazon Business、Qogita、Orderchamp、Ankorstore 和 NuORDER，覆盖重叠任务
        - 非商品采购和非转售支出
        - 因平台和工作流而异
        - 有助于边界判断，因为许多买方即便任务不同也会比较这些工具
    notes: 边界行把直接批发转售经济性，与下游消费者零售和更广泛采购邻接区分开。
