      - number: '4.4'
        title: 资本充足性、融资依赖与披露质量
        blocks:
          - type: paragraph
            body: >-
              如公司概况的融资时间线所述，Faire 已经消耗大量风险资本；现在的财务问题是，最新一轮融资改变了运营韧性，还是主要清理了流动性压力。2025 年末要约交易明显支持后者。Bloomberg 将这笔交易描述为约
              $100 million 的员工股份出售，Faire 自己的公告也把它表述为给长期员工和早期股东提供流动性，估值为 $5.2
              billion。这有助于股权结构表卫生和留才，但不等同于披露了新的资产负债表现金。Tracxn 融资数据集显示九轮合计 $1.7 billion，PitchBook 显示 $1.51
              billion——这提醒我们，即便是基础私营公司数据库字段也会分歧，不能误当作经审计事实。与此同时，2023 年在 2022 年裁员后又裁约 250
              人，支持管理层关于公司重置成本基础的说法。缺失的仍是实际资本充足性包：手头现金、烧钱速度、现金跑道、债务或信贷额度、准备金政策，以及要约交易中新股和老股拆分。没有这些，投资者可以描述轨迹，却无法验证偿付能力的持久性。
