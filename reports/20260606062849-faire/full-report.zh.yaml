  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑：B2B 批发市场数字化率只有 5%；Faire 凭 800K+ 零售商、$3B GMV 和连续八个季度 GMV 增长引领迁移。
        - 若 GMV 同比增速超过 40%，且欧洲增速再连续两年超过北美 2x，判断会增强。
      - - 投资逻辑：NDR 高于 110%，证明零售商在平台上的钱包份额扩大，是产品市场契合和留存质量的强信号。
        - 若经审计披露确认 NDR 达 115%+，且队列数据显示规模化后留存改善，判断会增强。
      - - 投资逻辑：广告业务（>5% 收入）和 Faire Insider 订阅在交易佣金基础上叠加更高利润率收入层。
        - 若广告收入增至总收入 10%+，且订阅渗透超过 200,000 名已加入零售商，判断会增强。
      - - 反向逻辑：60 天净账期模式形成不透明信用敞口，并随 GMV 放大；公司未公开披露违约率或信用损失准备金。
        - 若管理层提供历史违约率低于 GMV 0.5%，且准备金覆盖达到预期年损失的 2x，反向判断会缓和。
      - - 反向逻辑：Shopify 合作把零售商获客集中到一个单一交易对手，而该方也是相邻基础设施领域的竞争者；合作条款未公开。
        - 若 Shopify 合作条款包含多年排他条款，且能确认其在新增零售商获客中的占比低于 20%，反向判断会缓和。
    notes: 这些论点是投资主张，不是公司描述；每条都绑定公开证据来源，并有具体修正条件。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年收入增长 35-40% 至约 $700M；2026 年中实现盈亏平衡；NDR 扩至 115%；欧洲占收入 40%；信用损失保持在 GMV 的 0.5% 以下
        - 2026 年收入的 12-15x = $8.5-10.5B；较 $5.2B 有约 63-100% 上行空间
        - Shopify 条款变化；信用损失意外上行；EU 监管壁垒加速
        - 信号：2026 年 Q3-Q4 收入增长高于 35% + 公开宣布盈亏平衡 + 披露 EU 收入占比 40%+
      - - 基准
        - 2026 年收入增长 20-25% 至约 $625M；2026-2027 年接近盈亏平衡；NDR 保持 110%；信用损失低于 GMV 的 1%
        - 2026 年收入的 8-10x = $5-6.5B；与当前 $5.2B 持平或小幅溢价
        - AI 产品交付执行风险；信用损失升至 1% 以上；Shopify 合作摩擦
        - 信号：收入增速维持在 20-30% 区间 + 无重大负面信用披露 + Shopify 合作关系继续完整
      - - 悲观情景
        - 收入增速降至 15% 以下；信用损失超过 GMV 的 1.5%；Shopify 降低优先合作伙伴地位，或自建竞争性批发市场
        - $550M+ 收入的 4-6x = $2.2-3.3B；较 $5.2B 下跌 37-58%
        - 估值倍数压缩、信用减值与增长放缓同时发生
        - 信号：2026 年 Q3-Q4 增速低于 15% + 信用损失披露超过 GMV 的 1.5% + Shopify 合作公告发生变化
    notes: 情景不按概率加权；它们用于对照具体可观察触发因素来监测，而不是作为点估计建模。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标
      - 倍数 / 估值
      - 相关性
      - 局限性
    rows:
      - - Etsy (ETSY)
        - 公开上市市场平台
        - FY2024 收入约 $2.8B，市值约 $6B
        - 约 2-2.5x EV / 收入
        - 直接的市场平台可比对象；同样连接卖家与买家两端；面向消费者，但其批发垂直业务带有 B2B 动态
        - Etsy 增长更慢、利润率更高；已经证明盈利能力；Faire 目前两者都未达到同等水平
      - - Shopify (SHOP)
        - 公开上市商业平台
        - FY2024 收入约 $9B，市值约 $100B+
        - 约 10-12x 收入
        - 基础设施平台，具备类似 SaaS 的经常性收入；也是 Faire 的战略合作伙伴和股东
        - Shopify 毛利率高得多（50%+），且收入混合订阅与交易；Faire 更依赖市场平台
      - - Ankorstore
        - 欧洲非上市直接竞争对手
        - $2B 估值（2022 年 1 月，已过时）
        - 已过时；估值倍数压缩后可能更低
        - 最直接的欧洲可比对象；运营相同 B2B 批发模式
        - 估值已超过 3 年；自 2022 年初以来，市场倍数已明显压缩
      - - Global-E Online (GLBE)
        - 公开上市跨境电商
        - FY2024 收入约 $800M，市值约 $3-4B
        - 约 4-5x 收入
        - 可参考 Faire 国际跨境扩张溢价
        - 模式不同（全球结账，不是发现）；抽佣率更低；网络效应不同
      - - Faire（入场价）
        - 非上市公司要约交易
        - $500M+ 年化收入，$5.2B 估值
        - 约 10x 年化收入
        - 实际入场价格锚点
        - 基于管理层披露的收入运行率，未经审计；信用不透明使倍数难以干净确认
    notes: 可比对象只是示意性锚点，不是精确标记；所有倍数均为近似值，基于报告时的公开市场数据。Faire 的 10x 倍数高于 Etsy 的下限（2x），接近 Shopify 溢价区间（10x+）的低端。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This register covers every named public comparable and private competitor valuation reference available in the
        public source set used for this chapter: Etsy public market data, Shopify public market data, Ankorstore funding
        announcement, and Global-E public market data.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV005
    title: 投资逻辑失效与止损触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 信用损失披露
        - 任一披露期内，Net 60 违约率超过滚动 GMV 的 2%
        - 将 Faire 重新定义为市场平台收入之下叠加的信用业务；会实质削弱利润率与资本效率逻辑
        - 转为回避；要求完整披露准备金，并将估值重校到净收入的 5-6x（从收入基数中剔除经信用损失调整的 GMV）
      - - Shopify 合作关系变化
        - Shopify 公开撤回优先市场平台地位、降低 API 访问权限，或推出竞争性批发市场
        - 移除主要新零售商获客渠道；GMV 增长假设下调 20-30%；CAC 明显上升
        - 转为观察；将乐观情景估值下调 25%；重新评级前，要求证明替代获客渠道可行
      - - 收入增速放缓
        - 2025 年披露增速 32% 后，2026 全年收入增速低于 15%
        - 释放类似 2022 年的第二轮减速信号；可能意味着市场结构性饱和，或 Amazon Business 竞争加剧
        - 转为观察；将倍数下调至未来收入的 6-7x；进一步行动前与管理层沟通解释
      - - 第二起反垄断诉讼
        - Tundra 案驳回后，又出现指控排他交易或反竞争 ToS 条款的新反垄断诉讼
        - 以更高关注度记录持续法律风险；可能引发监管审查和 ToS 修改，削弱品牌锁定
        - 搁置至法律结果明朗；评估管理层计划或已经完成的 ToS 修改
      - - IPO 延迟至 2027 年以后
        - 截至 2027 年底仍无公开 S-1 文件或明确 IPO 时间表
        - 二级流动性路径更不清晰；优先股持有人持有期拉长；潜在新一轮融资带来的稀释风险上升
        - 重新评估持有逻辑；核实股权结构表和清算优先权堆叠；如有机会，谈判二级流动性
    notes: 止损触发因素不等于亏损保证；它们是可观察、有时间边界的事件，会把投资姿态从观察改为回避，或要求主动与管理层沟通。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 信用损失与违约率
        - 未公开披露 Net 60 违约率、准备金方法，或信用质量队列分布
        - GMV 的 1-2% 信用损失率意味着每年 $30-60M 损失；没有这些数据，估值无法投资
        - 向 CFO 索取；至少 24 个月按零售商队列、细分市场和地域拆分的月度历史损失数据
      - - 经审计财务与毛利率
        - 无 2024-2025 年经审计财务、无毛利率披露、无按细分市场拆分的贡献利润率
        - 利润率结构决定 Faire 是类软件市场平台，还是薄利金融服务平台
        - 向 CFO 索取；完整 P&L、毛利率桥表、细分市场经济性，尤其是广告利润率
      - - Shopify 商业协议
        - Shopify 优先合作伙伴协议和股东协议的完整条款
        - 终止触发、排他条款和续约权决定主要获客渠道是否可靠
        - 向 CEO / CLO 索取；商业协议、终止条款和任何最惠国条款
      - - 股权结构表与优先股堆叠
        - 未公开披露优先权分配瀑布、棘轮条款或反稀释条款
        - 完整优先股堆叠决定不同退出价格下的实际股权价值；$5.2B 股权主张可能高估普通股价值
        - 向 CFO / 法律顾问索取；完整股权结构表、优先权，以及 $5B 和 $10B 退出情景下的清算瀑布模型
      - - 欧洲市场单位经济
        - 未披露欧洲盈利能力、CAC、LTV，或各市场 GMV 集中度
        - 欧洲增速为北美 2x 是醒目的公开说法；乐观情景要求欧洲能增厚利润，而不只是贡献增长
        - 向 CFO 索取；按市场拆分的欧洲收入、按地域拆分的毛利率，以及 EU 前 5 大市场的 CAC / LTV
      - - AI 与物流投资计划
        - 未公开披露 AI 采购助手、Ship with Faire 合并和物流建设的 capex 或 opex 预算
        - 物流与 AI 路线图的资本强度决定接近盈亏平衡能否持续，还是需要新一轮融资
        - 向 CFO / CPO 索取；3 年经营计划、按项目拆分的 capex，以及 Ship with Faire 和 AI 功能的单位经济预测
    notes: 这些是不可谈判的尽调事项。它们都不要求超出 Series 阶段数据室应提供范围的专有信息。缺少任意一项，都是治理与投资准备度的红旗。
    claimRefs:
      - CV001
      - CV004
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
