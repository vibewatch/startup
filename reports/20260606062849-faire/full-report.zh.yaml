      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              在私营市场平台公司里，Faire 的创始团队记录得相当充分。Max Rhodes 担任 CEO，外部资料反复强调他在 Square 的 Cash App 和 Square Capital
              积累了相关产品经验，这也解释了 Faire 为什么重视融资、商户工作流和软件驱动的批发。Marcelo Cortes 是技术联合创始人兼 CTO，Jeffrey Kolovson 是 COO，Daniele
              Perito 负责数据职能；创始团队覆盖产品、工程、运营和数据科学。2026 年 2 月，Sacra 报道公司任命 Sanjay Raman 为首席产品官，他此前在 Tripadvisor、Airbnb 和
              Houzz 担任高管，显示 Faire 仍在投入平台深度。公开证据明显薄弱的，是当前完整董事会构成、股权集中度和正式治理包。尽管公开层面的领导层连续性本身看起来较强，这种不透明仍使 Rhodes
              和创始团队的关键人物依赖成为真实尽调问题。
