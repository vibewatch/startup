companyProfile:
  summary: >-
    Faire 是一家总部位于 San Francisco 的批发市场，成立于 2017 年，连接独立零售商与独立品牌，并在交易层外叠加 Net 60
    账期、首单免费退货、广告、订阅和物流服务。公开证据支持的不是小众市场，而是真正规模：公司称平台提供超过 100,000 个品牌，Sacra 描述平台上有超过 800,000 家零售商，公开资料显示累计融资约 $1.7
    billion，并在 2025 年 11 月达到约 $5.2 billion 估值。核心尽调问题已经不是 Faire 有没有市场存在感，而是扣除信贷、退货和运营复杂度之后，公司能否守住高质量市场经济性。
