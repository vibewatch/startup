    type: bar
    layout: wide
    summary: 在不同收入增长和倍数扩张假设下，Faire 的隐含估值差异很大；当前 $5.2B 价格落在情景区间中部。
    data:
      items:
        - label: 悲观情景：$550M × 4x
          value: 2.2
          note: 悲观情景低端结果（$B）
        - label: 悲观情景：$550M × 6x
          value: 3.3
          note: 悲观情景高端结果（$B）
        - label: 基准情景：$550M × 8x
          value: 4.4
          note: 基准情景低端结果（$B）
        - label: 基准情景：$550M × 10x
          value: 5.5
          note: 基准情景高端结果（$B）
        - label: 乐观情景：$550M × 12x
          value: 6.6
          note: 乐观情景低端结果（$B）
        - label: 乐观情景：$550M × 15x
          value: 8.25
          note: 乐观情景高端结果（$B）
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 按 $5.2B 入场价，乐观情景有 ~60-100% 上行空间，基准情景大致持平至 +25%，悲观情景则亏损 35-57%。
    data:
      items:
        - label: 乐观情景
          low: 8500
          mid: 9500
          high: 10500
          unit: $M
          detail: 收入增长 35-40%，2026 年盈亏平衡，NDR 115%+，信用损失 <0.5% GMV
          tone: positive
        - label: 基准情景
          low: 5000
          mid: 5800
          high: 6500
          unit: $M
          detail: 收入增长 20-25%，2027 年接近盈亏平衡，NDR 保持 110%，信用损失 <1% GMV
          tone: neutral
        - label: 悲观情景
          low: 2200
          mid: 2700
          high: 3300
          unit: $M
          detail: 收入增长低于 15%，信用损失 >1.5% GMV，Shopify 合作关系走弱
          tone: risk
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向投委会的七项估值维度评分；Faire 在市场机会和采用证据上得分高，但财务透明度和估值风险偏弱。
    data:
      items:
        - label: 市场机会
          value: Strong
          tone: positive
          detail: 全球 B2B 批发市场 $10T+；数字化率只有 5%；结构性顺风已确认。
        - label: 采用与留存证据
          value: Strong
          tone: positive
          detail: 800K 家零售商，$3B GMV 连续 8 个季度增长，NDR >110%，广告收入占比 >5%。
        - label: 竞争护城河
          value: Moderate
          tone: neutral
          detail: 网络效应真实存在，但 Shopify 和 Amazon Business 是结构性威胁；Ankorstore 在欧盟直接竞争。
        - label: 财务透明度
          value: Weak
          tone: risk
          detail: 没有经审计财务报表，没有信用损失率，也没有毛利率披露；优先股堆叠不透明。
        - label: 信用与营运资本质量
          value: Unknown
          tone: risk
          detail: 在 $3B GMV 下给 60 天账期，意味着重大未披露敞口；没有拨备数据。
        - label: 估值风险
          value: High
          tone: risk
          detail: 一家仍未盈利且信用风险不透明的公司按 10x 收入估值；较峰值低 59%，但仍不便宜。
        - label: 证据质量
          value: Moderate
          tone: neutral
          detail: 多家独立来源确认收入和 GMV 轨迹；财务不透明压低整体证据评级。
    claimRefs:
      - CV001
      - CV007
      - CV013
      - CV014
      - CV015
      - CV027
      - CV041
