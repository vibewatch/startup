  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与替代方案
        blocks:
          - type: paragraph
            body: >-
              Faire 所在市场比“电商”这个泛化标签更窄。公司中介的是品牌与零售商之间的批发商品流，因此纳入的支出是为转售而采购的库存，而不是消费者结账、零售工资或一般 SaaS 支出。BLS
              的行业定义在这里有用：批发是销售用于转售商品的中间环节，零售则是向终端消费者小批量销售的最终环节。Faire
              自己的品类陈列说明平台在这个边界内很宽——家居装饰、食品饮料、美妆、珠宝、纸品、儿童、宠物、男装和图书——但它仍是转售市场，而不是通用采购网络。实际替代方案包括展会、既有批发商、品牌直连关系，以及
              Alibaba、Amazon Business、Qogita、Orderchamp、Ankorstore 和 NuORDER 等更广泛的数字采购界面。SBA
              的小企业数据补充了一个重要结构点：需求侧高度碎片化，而搜索、融资和信任中介正是在这种环境里创造价值。
