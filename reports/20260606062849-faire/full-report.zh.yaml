  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 为何重要
      - 最佳公开代理
      - 当前判断
      - 具体尽调路径
    rows:
      - - 按年审计收入
        - 需要对齐 2023 年估计、2025 年收入运行率和 2025 年增长说法
        - Sacra 2023 年估计 + 官方 2025 年运行率 + CNBC 2025 年增长说法
        - 方向正面，但不到审计级别
        - 索取 2023–2025 年经审计或董事会认证财务报表
      - - 按收入流拆分的毛利率
        - 需要判断广告 / 订阅拉升是否抵消物流 / 支付拖累
        - 抽成率改善且广告收入占比 >5%，暗示上行空间，但没有毛利率披露
        - 重大阻碍
        - 索取按市场、广告、订阅、物流拆分的收入和毛利
      - - Net 60 信用损失 / 准备金
        - 需要检验融资经济性是增厚还是侵蚀价值
        - 独立指南确认 Faire 承担风险；无公开损失数据
        - 最高优先级阻碍
        - 索取违约、逾期、准备金、回收和批次曲线
      - - 现金余额和现金跑道
        - 需要判断公司是自我造血还是依赖融资
        - 裁员和要约交易显示纪律 / 流动性管理，但不代表现金跑道
        - 重大阻碍
        - 索取最新资产负债表、现金瀑布和下行现金跑道方案
      - - 按渠道拆分的 CAC / 回本
        - 需要测试销售效率和增长耐久性
        - Shopify 评论和 NDR 暗示渠道 / 产品强度，但 CAC 未公开
        - 重要缺口
        - 索取 Shopify、直接和自然队列的获客成本、激励和回本
      - - 按收入流拆分的收入组合
        - 需要判断多少收入具备经常性或更高毛利
        - 广告 >5% 和 Insider 注册 100k+ 显示组合宽度，但没有贡献金额
        - 重大缺口
        - 索取收入流层面的收入桥和附加率趋势
      - - 营运资本资金结构
        - 需要了解是否由仓储线或表外融资支撑 Net 60
        - 未发现公开债务或融资工具披露
        - 重大缺口
        - 索取债务协议、融资工具规模、定价和契约
      - - 要约交易后股权结构 / 优先权
        - 需要了解偿付优先级、优先权包袱和员工流动性影响
        - 要约交易估值公开；优先权堆栈不公开
        - 重大缺口
        - 索取要约交易后股权结构、清算优先权堆栈和期权池数据
      - - 实际费率阶梯
        - 需要把标价转成按打款选项拆分的净收入和毛利
        - 官方存档页可读性弱；第三方工具方向一致
        - 小但可执行的缺口
        - 导出实时帮助中心费率表和打款选项使用数据
    notes: 该登记表旨在穷尽截至 runDate 仍阻碍 Faire 完整财务测算的重大公开数据缺口。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All material underwriting gaps identifiable from the retained public source set for revenue quality, margin
        path, working capital, and capital adequacy.
    claimRefs:
