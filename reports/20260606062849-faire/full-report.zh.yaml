      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，Faire 到 2027 年维持 30-40% 收入增长，2026 年达到盈亏平衡，并通过广告和物流渗透小幅扩张抽佣率。 按 2026 年约 ~$700M 收入的 12-15x，股权价值为
              $8-10B，显著高于 $5.2B 进入价。关键假设是： 信用损失保持在 GMV 的 0.5% 以下，Shopify 合作关系保持完整，欧洲增长到总收入的 40%+。基准情景下， 增长放缓到
              20-25%，盈亏平衡在 2026-2027 到来，倍数区间为 $600-650M 收入上的 8-10x，对应 $5-6.5B 股权价值，大致等于或略高于当前标记。悲观情景下，信用损失显现并超过 GMV 的
              1.5%，Shopify 合作恶化， 或欧洲扩张停滞。增长放缓到 15% 以下，倍数压缩到 4-6x，股权价值降至 $3-4B，较要约价格损失 30-40%。 下行情景不是尾部风险；它有可识别触发器，也有
              Faire 自身 2022 年增长崩塌的历史先例。
            claimRefs:
              - CV021
              - CV022
              - CV023
