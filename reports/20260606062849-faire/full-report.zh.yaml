    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Faire 是一家总部位于 San Francisco 的 B2B 批发市场，连接独立品牌与独立零售商，并把自己定位为碎片化线下批发发现流程的数字替代方案。公开材料和第三方画像对几个事实基本一致：2017
              年开始运营、源自 Y Combinator W17，法律实体为 Faire Wholesale, Inc.；Tracxn 显示该实体在 2016 年末注册。官网称零售商可以从超过 100,000
              个品牌采购批发商品，外部研究则把公司描述为面向中小商户的最大策展式批发网络之一。它的商业模式混合市场发现、订单流、融资支持和运营工具，而不是一个简单目录。品牌为市场订单支付交易费用，零售商获得 Net 60
              账期和降低试错风险的免费退货政策；平台也已经搭出正式的定价、支持和法律界面，显示它是成熟运营栈，而不是轻量级列表站。
