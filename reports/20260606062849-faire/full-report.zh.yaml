      - number: '8.5'
        title: 可比公司组与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              Faire 最直接的可比公司是 Etsy（公开市场平台，约 $6B 市值、约 $2.8B 收入，约 2x EV/revenue）和 Shopify（公开商业平台，在 SaaS 溢价下按 10-15x
              收入交易）。Etsy 较低倍数反映了更慢增长和偏消费者而非 B2B 的定位，可为 Faire 提供底部边界。Shopify 的更高倍数只有在软件式利润率得到证明时才可能适用，而 Faire
              还未披露这一点。欧洲批发竞争对手 Ankorstore 在 January 2022 估值 $2B；在市场平台倍数压缩后，这个标记已经陈旧， 现在可能更低。Global-E
              Online（GLBE）是跨境商业平台，为 Faire 的国际扩张溢价提供了相关公开可比。 Lightspeed Commerce 则提供另一个相邻商业软件参照：其公开收入规模有意义，但并未获得 Shopify
              式估值溢价， 反衬出 Faire 10x 收入标记的要求有多高。在 $5.2B 估值、约 ~$500M 年化收入下，Faire 按约 ~10x 收入交易—— 高于 Etsy 底部（2x），低于 Shopify
              溢价（12x+）。只有当 Faire 能证明 NDR 耐久性、利润率扩张和规模化信用质量时， 这个位置才站得住。Amazon Business 和 Alibaba B2B 是长期竞争威胁，可能随着时间压缩
              Faire 的抽佣率。
