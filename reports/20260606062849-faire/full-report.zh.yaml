            body: 如果 Shopify 终止或实质削弱推荐合作伙伴协议，同时 net-60 账期的信用损失没有披露并确认低于 GMV 的 2%， 投资逻辑会同时失去两个最强结构性支撑。投资前不应让任一条件悬而未决。
            calloutType: recommendation
            claimRefs:
