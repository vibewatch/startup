      - number: '3.2'
        title: 竞争对手画像：规模、融资、差异化与战略方向
        blocks:
          - type: paragraph
            body: >-
              对 Faire 的欧洲野心而言，Ankorstore 仍是最清晰的直接竞争者。它在 2022 年 1 月由 Bond 和 Tiger Global 支持至 $2 billion 估值，业务覆盖 23
              个国家，佣金结构（复购 10%、首单 20%）对品牌而言低于 Faire 的 15% 加费用——这是 Faire 已经承认的结构性价格优势。Qogita 的定位不同：它不是让品牌申请入驻的市场，而是聚合 500+
              家审核供应商和 10K+ 个品牌，形成整合目录，并代表零售商谈判。Orderchamp 拥有 7K 个品牌和 200K 家欧洲零售商，采用类似 Net 60 的账期和免费配送，为欧盟市场提供更轻量版的 Faire
              主张。


              NuORDER 和 Lightspeed 处于另一个细分市场。Lightspeed 收购 NuORDER，是为了给更大型品牌和多门店零售商搭建 B2B 订货平台，常见于服装和中型市场，而不是 Faire
              聚焦的长尾独立品牌。它们的目标客户——向百货商店、专业连锁或多品牌展厅销售的品牌——通常拥有更高最低订货量和更复杂贸易条款，Faire 不容易适配。RangeMe 由 ECRM
              支持的模式通过策展会议把供应商连接到大型零售商（杂货、药房、综合商品）；这种买方类型并不是 Faire 的主要服务对象。


              Amazon Business 以企业定价、多用户账户和批量折扣切入 B2B 采购，覆盖 Amazon 全品类目录——这是一种完全不同的主张，但会吸走同一批注重成本的零售商买方预算。Alibaba
              主要面向更大批量买方提供跨境批发，为品牌发现任务提供替代；它对 Faire 的独立品牌细分市场相关性较低，但对愿意直接进口的更大型或更价格敏感零售商相关。
