      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 关键信息缺口：60 天净账期的信用损失数据
            body: >-
              最重要的未披露信息，是 Faire 60 天净账期组合的历史违约率和信用损失率。在 $3B GMV、约 ~19% 抽佣率下， 即便 1% 年化违约率也代表约 ~$30M 损失，约为 2025 年预期收入的
              5%。没有这项数据，投资人无法负责任地承保当前估值。 这是不可谈判的尽调要求。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV021
