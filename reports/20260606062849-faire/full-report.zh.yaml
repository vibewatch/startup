  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与地理规模
        blocks:
          - type: paragraph
            body: >-
              Faire 的客户基础在网络两端都很宽，但零售商一侧给出的公开需求信号最清楚。官方页面仍把平台定位在服务独立零售商， 覆盖服装精品店到杂货店等多个品类；Sacra 的市场梳理则显示，平台已扩张到超过
              800,000 家活跃零售商和 100,000 个品牌。它不只是一个服务微型精品店的发现工具：Sacra 称，年销售额超过 $1 million 的零售商贡献了超过 20% 的订单量， 北美已有 35,000+
              家门店使用 Stores 工作流。地域也很关键。欧洲增速约为北美的两倍，澳大利亚已有超过 10,000 家交易零售商， Faire 目前覆盖 35
              个市场。这种广度支撑了真实的规模逻辑，即便公开资料仍未按头部队列、国家或垂直品类拆出客户量， 细度达不到投资人理想中的尽调标准。
