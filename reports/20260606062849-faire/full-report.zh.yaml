  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商
      - 佣金 / 费用模式
      - 包含能力
      - 折扣或零佣金路径
      - 含义
    rows:
      - - Faire
        - 15% 品牌佣金 + $10 首单费用 + 1.9–3.5% 支付处理费
        - Net 60 账期、首单免费退货、Shopify 同步、推广列表、Ship with Faire 物流
        - Faire Direct 链接 = 0% 佣金（但自 2023 年 7 月起需支付处理费）
        - 有效抽佣约 19%；对品牌偏高，但零售商 Net 60 和免费退货支撑了这部分抽成
      - - Ankorstore
        - 首单佣金 20%；复购订单佣金 10%
        - 零售商 Net 60 账期、欧洲市场覆盖广、无仓储中介
        - 复购佣金低于 Faire，给有复购的品牌带来成本优势
        - 较低抽佣率带来定价杠杆；Faire 必须靠触达和工具差异化来证明溢价合理
      - - Qogita
        - 佣金结构未公开；模式是供应商聚合和批量议价
        - 500+ 供应商目录、欧盟 / 英国履约、保证正品、无缝入驻
        - 议定的批量价格直接交付给零售商；没有明确的 Faire Direct 对应物
        - 模式不同——零售商支付目录价，Qogita 从供应商谈判中提取利润
      - - Orderchamp
        - 佣金未披露；包邮和低起订量被营销为核心价值主张
        - Net 60 付款、低起订量、品牌到零售商直发履约、欧洲目录
        - 不适用（未发布 Direct 等价方案）
        - Orderchamp 比拼零售商经济性，而不是已披露佣金率
      - - NuORDER / Lightspeed
        - 不是佣金型市场平台；企业级 B2B 订单管理采用订阅定价
        - 数字款式表、订单管理、Lightspeed POS 集成
        - 无佣金模式；面向品牌的订阅制 SaaS 定价
        - 收入模式不同，降低了与 Faire 在独立品牌上的直接价格竞争
      - - 线下展会
        - 展位租金 / 参展费；交易不抽佣
        - 线下发现、看样、建立关系、季节性活动档期
        - 展会现场下单不抽佣；品牌支付固定展位费
        - 展会订单零可变佣金具备结构性优势；成本是固定参展展位费
    notes: Faire 的定价在保留来源中记录最完整。Ankorstore 的佣金来自 2022 年 Series C 报道。Qogita 和 Orderchamp 的佣金细节在保留证据中未公开。
