          - type: callout
            title: 从观察走向买入的路径
            body: >-
              如果管理层确认三项条件，投资建议可从观察转为买入：（1）过去 24 个月 net-60 账期信用损失率低于 GMV 的 1%； （2）2024-2025 毛利率高于 40%；（3）Shopify
              合作条款包含多年续约条款。若三项均获确认，且估值等于或低于 $5.2B，那么在基准增长轨迹下，投资案将变得有吸引力。
            calloutType: recommendation
