              里程碑记录同时显示了惊人扩张和真实压力。Faire 在 2021 年末 GMV 超过 $1 billion，随后于 2022 年 5 月触及估值峰值，并进入更强调纪律的阶段：2022 年 10 月先裁员约
              7%，2023 年又进行第二轮更深裁员，约 20% 或 250 人。同期，Shopify 投资并将 Faire 设为推荐批发市场，尽管内部成本控制收紧，渠道价值仍得到强化。2025 年和 2026
              年的公开报道把叙事重新框定为盈亏平衡和最终 IPO 准备，而不是不计成本增长。法律文件增加了另一条反向线索：Faire Wholesale, Inc. 于 2023 年 5 月起诉竞争对手
              Tundra，Tundra 反诉，驳回记录显示争议后来走向解决。评论和投诉界面也突出更严格的信贷执行、审批门槛和客服挫败感；信任是批发复购的核心，这些信号因此重要。
