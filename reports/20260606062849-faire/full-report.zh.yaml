        - Craftybase 和商业模式分析写得清楚
        - 尽管直接变现更低，仍能守住留存和渠道整合
      - - 次日打款
        - 品牌
        - 最快打款，最高费率档
        - 公开信息有方向性支持，当前官方精确阶梯仍需确认
