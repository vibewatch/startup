  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 机制
      - 单位
      - 公开证据 / 当前状态
      - 收入质量判断
      - 尽调要求
    rows:
      - - 市场佣金
        - 品牌为 Faire 导流订单支付平台抽成
        - 商品小计占比
        - 15% 标价佣金被广泛引用；Sacra 称调价后有效抽成率达到约 19%
        - 核心收入流；如果复购订单占比能守住，质量较高，但仍与 GMV 挂钩
        - 披露按队列、地区、首单与复购组合拆分的实际抽成率
      - - 首单获客费
        - 零售商首单时品牌支付固定费用
        - $/order
        - Craftybase 称首单收取 $10 新零售商费用
        - 高毛利但受交易量影响；体现获客变现
        - 确认该费用是否仍按地区和品牌计划普遍适用
      - - 支付处理 / 回款时点
        - 品牌支付处理费和 / 或加速打款费
        - 订单金额占比 + 固定费用
        - 第三方资料把阶梯区间放在 1.9% 到 3.5%，外加 $0.30，打款越快，费用大致越高
        - 有用的变现杠杆，但现行费率表仍难以从官方存档页核验
        - 导出现行帮助中心费率表，并按品牌队列披露打款组合
      - - Faire Direct
        - 品牌把自有零售商带到 Faire
        - 佣金占比 + 处理费
        - Craftybase 称 Direct 订单佣金为 0%，只收处理费
        - 单笔订单变现更低，但有助于留存和渠道整合
        - 拆分 Direct 在 GMV、收入中的占比，以及其他服务的附加率
      - - Faire Insider
        - 面向零售商的订阅，提供配送和发现权益
        - $ / 月
        - Sacra 列示 Faire Insider 月费 $19.99，已注册零售商 100,000+
        - 相比纯交易费，经常性收入质量更高，但公开收入贡献未披露
        - 提供订阅用户数趋势、总流失率和净收入贡献
      - - Promoted Listings / 广告
        - 品牌为发现位和赞助曝光付费
        - 收入占比 / 品牌数
        - 官方和新闻来源称广告超过收入的 5%；Sacra 称美国近 10,000 个品牌使用该产品
        - 可能毛利更高，且具战略意义，因为它不抬高佣金也能扩大抽成率
        - 披露广告收入、活跃品牌采用率和增量利润率
      - - Ship with Faire / 物流相关费用
        - 叠加在市场订单上的配送和履约相关服务
        - 发货量 / 配送支出
        - Sacra 称 Ship with Faire 在 2025 年处理 5M+ 票发货，零售商配送支出为 $200M
        - 规模可能有意义，但盈利能力和补贴水平未知
        - 披露物流收入、毛利率和配送补贴政策
    notes: 标价和变现组合只能部分三角验证，因为官方费率存档页可读性较弱；在测算实际毛利前，应使用实时帮助中心导出确认当前打款费率阶梯。
