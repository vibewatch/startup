      - number: '2.5'
        title: 地理与贸易环境：美国、欧洲和世界其他地区
        blocks:
          - type: paragraph
            body: >-
              地理位置重要，因为 Faire
              并不是进入同样清晰可读的市场。美国仍是公开证据中最可测的市场：有直接的商户批发销售数据、批发和零售劳动力市场数据，以及至少一个保留下来的当前线上采购渗透率估计。欧洲看起来是最清晰的增长相邻市场，不是因为它提供了干净的批发
              TAM，而是因为数字行为已经主流化，B2C 电商营业额在 2024 年超过 €842 billion，Faire
              自己保留的第三方报道还称欧洲增长速度约为北美两倍。不过在欧洲内部，西欧更成熟，东欧和南欧线上购物者渗透率仍较低，因此采用曲线不同。世界其他地区是最缺少承保证据的区域：Sacra
              提到澳大利亚牵引和后续新西兰扩张，但其他地区的保留公开证据薄得多。贸易环境进一步拉大地区差异。USTR 2026 年议程把关税、市场准入、海关执法、逃避关税和 de minimis 继续放在政策前线；BEA
              2026 年 3 月商品逆差也显示零售商采购对跨境流动仍然暴露。因此，市场愿景是全球化的，但可承保证据仍以美国为锚。
