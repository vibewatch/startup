  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现组合
        blocks:
          - type: paragraph
            body: >-
              Faire 公开可见的变现栈比简单市场佣金更宽。面向零售商的官网仍在营销核心需求引擎——超过 100,000 个品牌、先买后付账期和首单免费退货——第三方费用三角校验则显示，品牌侧支付 15% 市场佣金、$10
              首单费，以及随回款速度变化的处理费。Sacra 2025 年经营摘要补上了官方定价页缺失的关键组合信号：有效抽佣率从约 16.5% 升至 19%，广告在上线两年内超过收入 5%，Faire Insider 月费为
              $19.99 且已有 100,000+ 个注册零售商，Ship with Faire 等物流产品规模也足以推动数百万票发货。结果是，变现组合越来越多元，但根本上仍绑定
              GMV、零售商留存，以及平台愿意承保延期付款便利的程度。官方存档定价/支持页面存在，但抓取内容机器可读性不足，不能替代尽调资料室对实时费用阶梯的确认。
