      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              结构性乐观情景很直接：公开证据仍暗示批发采购大多在线下完成，只要买方信任这个工作流，单是数字迁移就能支撑多年增长。Digital Commerce 360 估计美国库存采购只有约 5%
              在线上完成，这是最清晰的证据点。欧洲也给出支持信号：互联网渗透率已经超过 90%，线上购物者渗透率达到 73%，EuroCommerce 还指向支付、物流和 AI
              的持续创新。但这些驱动旁边也有真实采用约束。EuroCommerce 的零售研究描述，欧洲非食品杂货行业仍在应对谨慎消费、供应链扰动、折扣商和价格压力。其 2025 年电商报告称，只有 6%
              的中小企业达到欧盟“非常高数字强度”门槛，这限制了高级工具采用。跨境复杂度也是现实约束：同一报告强调监管负担和不公平竞争担忧，Qogita 则把
              VAT、海关和文件支持做成明确产品功能。换言之，增长空间存在，但并非没有摩擦；融资、信任、合规和可用性仍是核心采用闸门。
