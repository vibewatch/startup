      - number: '7.3'
        title: 信用、营运资本与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Faire 的财务模型风险主要来自一个错配：公司给品牌付款很快，向零售商收款很慢。公开材料显示，零售商可获得 net-60 账期，而品牌支付更高费用后，可选择最快一天内加速收款。这个资金缺口会随 GMV
              直接放大；一旦违约、欺诈或退货率上升， 风险更危险。首单免费退货承诺在战略上有用，因为它降低零售商采购摩擦，但也给 Faire 增加了另一个与交易量和客户行为挂钩的资产负债表敞口。 Sacra 的估计意味着
              2025 年约 $3 billion GMV、约 19% 抽佣率，对应约 $570 million 收入；这还未计入坏账、 退货或物流复杂度。GMV 上 1% 到 2% 的损失率，意味着每年约 $30
              million 到 $60 million 的下行， 即便对一家接近盈亏平衡的公司也足够重要。许多 Faire 零售商最终面向消费终端市场销售，因此 Federal Reserve
              消费信贷环境也是判断零售商现金流压力和违约敏感性的有用外部领先指标。广告收入和 Insider 订阅增加了收入多元化， 但规模尚不足以抵消信用表现的实质恶化。Ship with Faire
              增加了效用和收入，也把履约质量和运费经济性绑到市场信任上， 进一步加深营运资本和运营敞口。
