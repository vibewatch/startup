      - number: '5.4'
        title: AI、物流与路线图
        blocks:
          - type: paragraph
            body: >-
              自核心市场搭建完成以来，Faire 最重要的产品扩张，是把物流、商品化和 AI 叠加到交易图谱之上。Ship with Faire 已经达到有意义的运营规模，2025 年处理超过 5 million
              票发货，并声称通过 UPS 关系获得实质承运商节省。公开材料还显示，公司正在把运营工具转化为变现和留存产品：Faire Insider 把配送价值转化为订阅收入，Promoted Listings
              把搜索和浏览流量转化为广告支出，关税工具则降低全球货品发现中的跨境摩擦。AI 既用于当前体验，也用于路线图。当前能力包括自然语言搜索、图像驱动发现、排序和列表质量模型，以及虚拟助手。路线图信号指向面向零售商的
              AI 采购助手、面向品牌的 AI 顾问，以及能把多品牌履约压缩进更顺畅订单流的整合配送。这些新增能力让 Faire 进一步远离纯批发市场，更接近垂直整合的商业运营层。
