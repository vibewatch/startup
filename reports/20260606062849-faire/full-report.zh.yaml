        - 验证裁员后工程团队稳定性，并识别关键岗位流失
      - - 合规和法律
        - 覆盖 35 个市场的运营需要更强隐私、法律和税务基础设施，公开记录尚未体现
        - 中
        - 高
        - 多年 EU 扩张说明公司已有一定合规机制
        - 要求合规组织架构图、法律实体地图和外部律师关系
    notes: Faire 的人员风险为中等。两轮裁员历史值得跟踪，但 CEO 负责态度和成功复苏降低了重演概率。新 CPO 领导带来短期产品不确定性。
