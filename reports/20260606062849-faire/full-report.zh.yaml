  - id: FI001
    title: 收入模型桥接图
    type: flow
    layout: wide
    summary: Faire 将零售商订单流转化为品牌侧费用和附加变现，但其中一部分收入是在 Faire 同时承担账期、退货和信用风险时赚取的。
    data:
      nodes:
        - id: N1
          label: 零售商下单
          detail: 需求从商品发现、低起订量、首单免费退货和符合条件的 Net 60 账期开始。
          tone: positive
        - id: N2
          label: 核心交易费用
          detail: 市场平台订单收取 15% 佣金，新的零售商关系首单另收 $10 费用。
          tone: positive
        - id: N3
          label: 回款时点费用
          detail: 品牌可以牺牲利润率换取更快回款，形成与营运资金便利相关的费用收入。
          tone: neutral
        - id: N4
          label: Faire 向品牌付款
          detail: 符合条件的品牌可在零售商账单到期前收到付款。
          tone: neutral
        - id: N5
          label: 零售商延后向 Faire 付款
          detail: 符合条件的零售商可在大约 60 天后付款，Faire 负责收款并承担违约风险。
          tone: risk
        - id: N6
          label: 附加变现
          detail: 广告、Insider 订阅和物流周边服务，把收入结构从单一佣金拓宽出去。
          tone: positive
        - id: N7
          label: 毛利结果
          detail: 抽佣率提高有帮助，但实际利润率取决于坏账、退货、支付通道和配送经济性。
          tone: risk
      edges:
        - from: N1
          to: N2
          label: 订单转化为佣金
        - from: N1
          to: N3
          label: 收款选项带来处理费收入
        - from: N2
          to: N4
