        - 按市场、广告、订阅和物流披露毛利率
      - - CAC
        - 未公开；最佳代理是 Shopify 带来的自助 / 伙伴主导分发，以及复购行为
        - 低
        - 没有 CAC，就无法真正分析回本或销售效率
        - 提供混合 CAC 和分渠道 CAC，包括激励
      - - LTV
        - 仅代理指标：NDR >110%，叠加经常性附加产品
        - 低
