  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资逻辑破裂框架
        blocks:
          - type: paragraph
            body: >-
              Faire 的风险堆栈最好理解为按严重性排序的链条，而不是一串松散独立的问题。第一，信用和营运资本敞口是最重要的风险： Faire 向超过 800,000 家零售商提供 net-60
              付款账期，同时还补贴首单免费退货。这意味着下行情景会随着 GMV 放大， 而公开记录仍未披露违约率、准备金政策或损失严重度。第二，Shopify 依赖是结构性的：Shopify 既是投资人， 也是向许多商户推荐
              Faire 作为默认批发市场的平台，因此单一合作伙伴会影响漏斗顶部获客、集成深度和战略杠杆。第三， 即便 Tundra 诉讼已被驳回，反垄断和平台治理风险仍在，因为该诉讼把 Faire
              的限制性市场条款放进了公开记录。第四， 执行和人才风险重要，因为裁员以及管理层自己承认留存和产品质量下滑，说明组织曾经扩张过头。第五，随着 Faire 覆盖超过 35
              个市场，监管和隐私风险也在扩大。最清楚的投资逻辑破裂点很简单：如果信用损失开始在 GMV 规模上显现， Faire
              就不再像一个纯市场平台，而更像一个薄利的信用中介。另一个承保风险是数据质量：至少一个第三方公司数据库似乎把 Faire 和另一家公司混在一起，因此投资人应把核心尽调锚定在一手材料和公司提供的数据上。
