      - number: '7.2'
        title: 法律、监管与平台治理风险
        blocks:
          - type: paragraph
            body: >-
              最具体的公开法律风险，是 Tundra Inc. 在加利福尼亚北区对 Faire 提起的反垄断案。Tundra 指称，Faire 与品牌签订的条款实际上要求品牌一旦先在 Faire
              上接触某个零售商，之后就只能继续通过 Faire 与该零售商交易， 把市场平台变成事实上的独家交易机制。起诉书还称，Faire 要求全目录上架，用扣留付款和佣金减免来执行合规， 并针对与 Tundra
              有关联的品牌。法院在 November 2024 批准了 Faire 的驳回动议，但驳回并没有抹去起诉书和动议文件形成的事实记录。 这很重要，因为随着 Faire
              继续长大，若未来原告拿出更强的市场界定证据，可能会围绕同一行为重新起诉。这一残余敞口还处在活跃的竞争法框架内： FTC 和 DOJ 指引都把独家交易、搭售及相关限制列为标准反垄断关注点；European
              Commission 另有竞争政策体系， 随着 Faire 在欧洲扩张，也可能变得相关。另一个独立风险是，Faire 在超过 35 个国家运营，持续背负 GDPR、ePrivacy
              和跨境数据传输负担。其隐私材料显示，公司会收集数据并与多个第三方共享，这会抬高持续合规成本。即便没有公开 FTC 行动， 公司也处在包括 FTC's Bureau of Consumer Protection 和
              Better Business Bureau 投诉渠道在内的监管边界内； 一旦治理失灵，很可能会同时通过多个场域暴露。
