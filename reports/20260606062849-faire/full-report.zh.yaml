      - number: '3.4'
        title: 网络效应、Shopify 分发与多平台并用风险
        blocks:
          - type: paragraph
            body: >-
              Faire 最持久的竞争优势是网络密度，而不只是价格或产品功能。拥有 10 million 个品牌—零售商关系、800K 家零售商和 100K+
              个品牌后，平台的匹配质量和推荐相关性会随规模复利，较小市场很难迅速复制。2023 年 9 月的 Shopify 合作让 Faire 成为 Shopify 推荐的批发市场，在商户出现关键采购意图时把 Shopify
              数百万商户导向 Faire，从而强化这种密度。75K 个活跃集成零售商下单量高 20%，说明集成驱动的留存可测且在增长。


              反向约束是，网络密度是护城河，不是城墙。欧洲同行正在搭建具备实际规模的自有网络：Ankorstore 在 2022 年初已有 200K 家零售商，覆盖 23 个市场，并拥有欧盟本地品牌策展；即使 Faire
              在欧盟扩张更快，也无法立刻复制这些能力。Tracxn 统计 Faire 在全球市场有 387 个活跃竞争者，其中 21
              个已融资同行。品牌可以在多个平台上架，零售商也能在没有切换成本的情况下从多个来源采购，多平台并用对双方都容易。因此，Faire 必须持续把平台规模转化为可观察的下单频率优势，才能守住 GMV 领先。
