  - id: TR005
    title: 缓释与终止投资条件表
    columns:
      - 风险领域
      - 可监测触发项
      - 阈值或事件
      - 投资含义
    rows:
      - - 信用 / 营运资本
        - 60 天违约率
        - 任意过去十二个月内，net-60 账期违约率超过 GMV 的 2%
        - 将 Faire 重新定义为信用业务而非市场平台，并大幅下调估值
      - - Shopify 依赖
        - 合作协议变化
        - Shopify 撤回推荐市场身份，或降低 API 权限
        - 下调零售商获客展望，并降低长期 GMV 增长假设
      - - 反垄断 / 平台治理
        - 新反垄断诉讼
        - Tundra 驳回后，第二起带有更强市场定义证据的反垄断投诉被提交
        - 暂停投资，直至法律结果和管理层回应更清晰
      - - 执行和留存
        - 收入增长率
        - 管理层强调 2025 年增长 32% 后，2026 年收入增长跌破 20%
        - 视为重新减速信号，并检验信用损失或留存是否同步恶化
      - - EU 扩张
        - 欧洲相对北美的增长率
        - 欧洲增长率连续两个季度低于北美
        - 降低对最强增量增长引擎的信心，并下调乐观情景估值
    notes: 这些不是预测；它们是可观察、有时间边界的事件，会把已知风险转化为打破投资逻辑的证据，并要求投资人行动。
    claimRefs:
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 投资建议
        - 观察 / 有条件继续研究
        - 在当前价格投入资本前，先跟踪信用损失披露和增长轨迹。
      - - 置信度
        - 中
        - 公开证据足以支撑清晰的乐观 / 悲观框架，但没有管理层披露，仍无法判断信用质量或利润率结构。
      - - 风险评级
        - 高
        - 60 天账期的信用不透明、Shopify 依赖和过往执行失误都仍部分未解决。
      - - 估值立场
        - 偏高，但有条件可支撑
        - 按 10x 收入估值，只有在信用质量强、NDR 持续高于 110% 的乐观情景下才说得通。
      - - 入场纪律
        - 投入前要求信用披露
        - 若信用损失率超过 GMV 的 1%，或毛利率低于 40%，价格应下调。
    notes: 该立场对价格和证据都敏感；它不是对公司质量的静态看法。若三项不可妥协的尽调交付物得到确认，可转为买入。
