  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Faire 已经不只是批发发现目录。公开产品证据显示，它是一个多边商业运营系统，把市场需求生成、嵌入式零售商融资、品牌入驻、目录同步、配送服务和商户变现工具放进同一个工作流。核心平台仍从连接全球超过
              100,000 个品牌和 800,000 家零售商的双边市场开始，但可观察的模块地图已经远超简单列表和结账。品牌可以通过 Brand Portal 运营，用 Faire Direct 把既有零售账户带上平台，通过
              Ship with Faire 购买物流服务，并在 Promoted Listings 上投放。零售商可以使用 net 60 账期、首单免费退货、Faire Insider 会员权益、POS 同步和多门店
              Stores 工作流。这种宽度重要，因为产品策略变现的不只是抽佣率，也包括支付、订阅、广告和履约。主要尽调问题因此不是产品宽度——这已经很明显——而是底层技术和信任层是否像前端功能集看起来那样持久且可检查。
