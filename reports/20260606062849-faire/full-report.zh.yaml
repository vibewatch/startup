      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              双边市场的买方旅程并不对称。零售商一侧，买方通常是店主、采购/选品人员或品类买手；用户是门店员工或运营；付款方是零售业务本身。品牌一侧，决策者通常是创始人或批发负责人；用户是销售或目录运营；付款方是承担佣金、支付处理费和可选推广费用的品牌。这个拆分很重要，因为
              Faire 的采用楔子先是降低风险，其次才是工作流深度。零售商侧的楔子是低起订量或无起订量、60 天账期和首单免费退货，降低以发现驱动采购时的试错摩擦。变现和留存楔子随后来自复购、Insider
              订阅经济性、POS 集成，以及面向多门店账户的 Stores 工作流。公开证据显示 Faire 已经在上探：Sacra 称年销售额超过 $1 million 的零售商贡献超过 20% 的订单量，Stores
              被超过 35,000 个门店使用。竞争对手定位说明分层为什么重要：Orderchamp 主打发现和简单账期，Qogita 主打利润率和跨境运营，Alibaba 主打目录广度，Amazon Business
              则主打通用采购，而非策展式独立品牌组合。
