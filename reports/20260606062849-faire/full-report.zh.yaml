      - number: '2.2'
        title: 受约束的规模测算：多重视角，而不是单一 TAM
        blocks:
          - type: paragraph
            body: >-
              最好的公开规模测算方法是三角校验，而不是强行给出虚假的精确 TAM。在最宽口径下，Census Bureau 报告 2026 年 3 月美国商户批发商销售额单月为 $772.2
              billion；如果用单月运行率年化，约为 $9.3 trillion。这个口径太宽、噪声太大，不能当作 Faire 的 TAM，但它确实显示了公司所处的经济层。更贴近管理层视角的口径来自 Digital
              Commerce 360：美国零售商每年花费数千亿美元采购库存，但目前只有约 5% 的采购在线上完成。Sacra 估计 2025 年 GMV 约 $3
              billion，则给出了公司在这个仍未充分数字化池子里的当前平台检查点。欧洲提供了第二个相邻视角：EuroCommerce 2025 年报告称，2024 年欧洲 B2C 电商营业额为 €842
              billion，并预计 2025 年再增长 7%。这同样不是批发 TAM，但它是数字化准备度的强代理。正确结论不是“市场巨大”，而是公开证据支持一个规模大、碎片化、仅部分数字化的采购市场，同时仍有重要测量缺口。
