      - 公开披露
      - 可能含义
      - 投资测算解读
      - 尽调要求
    rows:
      - - 历史融资基础
        - Tracxn 显示 9 轮累计 $1.7B
        - Faire 在多个增长阶段大量依赖股权融资
        - 过去融资能力清楚，但当前可用现金不清楚
        - 提供从最后一轮新股融资至今的经审计现金桥
      - - 最新披露事件
        - 估值 $5.2B 的约 $100M 要约 / 老股交易
        - 流动性事件改善了员工 / 股东流动性
        - 没有新股现金拆分前，不要假设它实质延长现金跑道
        - 提供新股与老股交易拆分及进入公司的现金
      - - 最新估值
        - 2025 年 11 月 $5.2B
        - 较 2021–2023 年峰值估值回落，但相对许多市场型公司可比对象仍有溢价
        - 估值只是市场背景，不证明利润率耐久性
        - 提供董事会批准的公允价值方法和股权结构摘要
      - - 最大既往新股轮
        - 2021 年 11 月 $596M
        - 公司曾筹集大额资金以激进扩张
        - 过去能拿钱不消除当前现金跑道风险
        - 提供剩余款项和按年用途
      - - 成本重置信号
        - 2022 和 2023 年裁员，包括 2023 年约 250 人
        - 管理层采取行动降低烧钱并精简管理层级
        - 纪律信号较好，但不能替代经审计烧钱数据
        - 提供重组前后的月度烧钱
      - - 在手现金
        - 未公开
        - 无法核验流动性缓冲
        - 偿付能力测算的重大阻碍
        - 提供最新资产负债表和不受限现金
      - - 月度烧钱 / EBITDA
        - 未公开
        - 无法测试接近盈亏平衡是会计口径、EBITDA 口径还是现金流口径
        - 现金跑道分析的重大阻碍
        - 提供过去 12 个月烧钱和 EBITDA 桥
      - - 债务 / 仓储 / 授信工具
        - 未公开
        - 未知 Net 60 是仅由现金、银行授信还是结构化工具支撑
        - 可能显著改变资本强度和下行风险
        - 提供所有债务、契约和仓储融资文件
      - - 下一轮 / IPO 触发条件
        - 公开讨论过 IPO；未发布明确触发条件
        - 未来资本事件可能取决于持续增长和清晰披露
        - 如果利润率和损失受控，公司可能不需要新股权，但目前没有证据
        - 提供董事会计划、KPI 触发条件和下行情景融资方案
    notes: 仅靠公开来源无法闭合资本充足性，因为最新披露交易看起来主要以流动性为导向，资产负债表仍未公开。
