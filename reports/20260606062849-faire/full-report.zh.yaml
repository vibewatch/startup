      - CR007
      - CR015
      - CR016
      - CR023
      - CR031
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Faire 的主要风险沿信用栈和 Shopify 渠道传导，而不只是产品质量或技术故障。
    data:
      nodes:
        - id: R1
          label: GMV 增长
          detail: GMV 越高，收入和绝对信用损失敞口都会增加。
          tone: neutral
        - id: R2
          label: 60 天信用损失
          detail: 零售商违约随 GMV 放大，但未见公开损失率披露。
          tone: risk
        - id: R3
          label: 营运资金挤压
          detail: 信用损失和快速向供应商付款，会吃掉可用于扩张的利润空间。
          tone: risk
        - id: R4
          label: Shopify 条款变化
          detail: 推荐合作伙伴身份和集成深度，带来显著单一交易对手风险。
          tone: risk
        - id: R5
          label: 零售商获客放缓
          detail: 若失去 Shopify 杠杆，漏斗顶部增长和入驻效率都可能下降。
          tone: risk
        - id: R6
          label: 收入增长放缓
          detail: GMV 增速下降会叠加利润率压力，并削弱规模叙事。
          tone: risk
        - id: R7
          label: 估值重置
          detail: 增长放缓或大额信用损失会压缩收入倍数。
          tone: risk
        - id: R8
          label: EU 监管壁垒
          detail: 跨境合规摩擦可能拖慢目前增长最快的区域。
          tone: risk
      edges:
        - from: R1
          to: R2
          label: 信用敞口随交易量放大
        - from: R2
          to: R3
          label: 损失压低利润率
        - from: R3
          to: R6
          label: 资本压力限制投资
        - from: R4
          to: R5
          label: 渠道中断
        - from: R5
          to: R6
          label: 漏斗顶部放缓
        - from: R6
          to: R7
          label: 倍数压缩
        - from: R8
          to: R6
          label: 增长受限
        - from: R2
          to: R7
          label: 直接损失削弱投资逻辑
