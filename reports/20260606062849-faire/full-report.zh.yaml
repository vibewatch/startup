      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Faire 已在九轮融资中累计募资 $1.7 billion。November 2025 的 Series I（$100M，估值 $5.2B）由 WCM Investment Management
              领投，Baillie Gifford 和 True North Fund 参投。$5.2B 估值比 May 2022 Series G extension 的 $12.59B 峰值下降 59%；CEO Max
              Rhodes 将其称为从过度建设回到健康校准。 融资语境中最重要的变化是，Faire 不再以任何价格兜售增长故事，而是被定位成一个接近盈亏平衡的耐久增长业务。 因此，$5.2B
              标记是底部测试，不是增长溢价。Shopify 在 September 2023 以战略股东和分销伙伴双重身份加入，
              给维护合作关系增加了利益一致的机构动机。公开信息没有披露优先股堆叠、清算瀑布或反稀释条款。考虑老股或共同投资仓位的投资人， 应把优先权悬挂视为未知，并在定价风险前要求直接披露。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Faire 的核心投资逻辑是：B2B 批发市场结构性数字化不足——美国零售商采购只有约 5% 在线上完成——而 Faire 是转化这一市场的明确领导者。 支撑这一点的证据很强：$3B GMV
              连续八个季度增长，超过 110% 的 NDR 证明钱包份额扩张，欧洲业务增速达到北美两倍， 新兴广告业务又增加了一层更高利润率收入。反向逻辑从信用模型开始。Faire 的 60
              天净账期是它最强大的零售商获客工具， 也是最不透明的财务风险。公开资料没有披露违约率、准备金方法或信用质量分布。此外，Shopify 依赖把 Faire
              的主要获客渠道集中到单一交易对手，而这个对手同时也是相邻商业基础设施里的竞争者。2022-2023 两轮裁员，以及 CEO Max Rhodes
              自己承认公司“走了捷径”、忽视了留存指标，说明执行风险是真实且有历史验证的，不是假设。
            claimRefs:
