  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Faire 位于独立品牌与零售商之间，围绕核心市场平台叠加融资、工作流和资本支持。
    data:
      nodes:
        - id: n1
          label: 独立品牌
          description: 供应商借助 Faire 做分销、需求生成和订单流转。
        - id: n2
          label: Faire 市场平台
          description: 连接品牌与零售商的核心发现和交易层。
        - id: n3
          label: 独立零售商
