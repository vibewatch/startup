      - number: '4.2'
        title: 单位经济性与销售效率代理
        blocks:
          - type: paragraph
            body: >-
              公开单位经济性并不完整，因此承保只能依赖代理指标，而不是真正的 CAC、LTV 或回本周期计算。最好的正向代理是留存质量：Sacra 提到净美元留存率超过 110%，Shopify
              应用生态也显示商户真实采用，有数百条评论，并持续提到 Faire
              提高批发订单量，同时降低目录和订单管理摩擦。这些信号暗示一个自助式增长循环：分发、集成和复购比高接触销售模型更重要。但公开记录从未披露实际获客成本、队列回本、毛利率或各收入流贡献利润率。CNBC
              能帮助判断趋势，而不是给出精度：据报道 2025 年收入较 2024 年增长 32%，管理层称业务接近盈亏平衡，但公司拒绝提供验证该增长的文件。这种组合对效率方向是鼓舞的，却不足以支撑真正的 CAC/LTV
              承保模型。本章应采取的立场是，把留存和渠道契合作为正向代理打分，同时在管理层提供队列、利润率和获客数据之前，让核心单位经济性单元保持空白。
