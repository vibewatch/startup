      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              承保结论是混合但可用。Faire 现在在广告、支付、订阅和物流上拥有可见费用层，且 2022–2023 年重置后留存/抽佣率数据改善，因此收入质量好过一维交易市场。公开可比框架也有支持作用：收入运行率约
              $500M+ 时，Faire 的规模已经不再对应小型初创市场，而是对应会披露季度报告、SEC 文件和投资者演示的上市商业平台。但本章仍以重要阻断项收尾。最大问题是信贷不透明：Net 60
              账本没有公开违约率、准备金计提或逾期 vintage
              数据。第二是利润率不透明：没有公开经审计收入、各收入流毛利率，或物流/广告/订阅贡献利润率。第三是资本不透明：没有披露现金余额、烧钱速度、现金跑道，或最新事件中募集的一手现金。在这三组资料拿出来之前，Faire
              更像一个强收入引擎，但资产负债表模型未经验证，而不是一个完全可承保的后期市场平台。
