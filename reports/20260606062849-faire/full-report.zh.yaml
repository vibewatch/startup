      - number: '6.2'
        title: 采用轨迹与平台牵引力
        blocks:
          - type: paragraph
            body: >-
              采用轨迹看起来更像一个已经规模化的市场平台，而不是仍在试验阶段的采购工具。Sacra 的数据指向超过 10 million 组品牌—零售商关系，以及迄今超过 $8 billion 的批发库存销售额；2025 年
              GMV 预计接近 $3 billion，收入年化超过 $500 million。到 2025-Q3，增长仍在加速，GMV 连续八个季度扩张；这很重要，因为它说明管理层早前修正增长后，
              重置后的业务并未停滞。公开证据还显示，牵引力不只来自核心浏览—下单闭环，也来自新界面。Faire Market 促成 136,000+ 组新的品牌—零售商关系，图书品类年化交易量超过 $100
