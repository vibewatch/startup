  - id: TI004
    title: 营运资本与信用敞口表
    columns:
      - 敞口
      - 公开证据
      - 现金流时点
      - 利润率 / 流动性影响
      - 尽调要求
    rows:
      - - Net 60 应收账款缺口
        - 零售商可 60 天后付款，而品牌更早拿款
        - 零售商约第 60 天向 Faire 付款；品牌可次日或稍后收款
        - 市场增长可能推高应收账款和准备金需求，速度快过收入所显示的增长
        - 提供应收账款账龄、批次损失和准备金方法
      - - 品牌加速打款
        - 品牌可选择更快打款选项，支付更高费用
        - Faire 在符合条件的订单上先于零售商结算垫付现金
        - 加速打款把便利性变成费用收入，但增加资金需求
        - 披露打款选项组合和垫资资金来源
      - - 零售商违约风险
        - 独立指南称 Faire 承担信用风险和催收
        - 损失在发货后、发票到期日前后体现
        - 如果风控放松，信用损失会吃掉抽成率提升
        - 提供违约、逾期、回收和核销历史
      - - 首单免费退货
        - 首页宣传每个品牌首单均可免费退货
        - 转售或索赔回收前可能先发生现金流出
        - 支撑 GMV 增长和试用，但带来履约与退货成本
        - 披露退货率、运费承担方和利润率影响
      - - 物流 / 配送补贴
        - Ship with Faire 和配送节省可见，但毛利经济性不可见
        - 成本在订单发出时发生，而不是零售商付款时
        - 若配送节省来自补贴，可能压低贡献毛利率
        - 提供物流毛利和补贴率
      - - 延期付款竞争
        - Orderchamp 也宣传发货后最多 60 天付款条款
        - 竞争性匹配会随时间压缩经济性
        - 单靠融资便利可能守不住溢价费率堆栈
        - 展示相对竞品融资渠道的转化提升和损失表现
    notes: 本表关注现金时点和风险转移，不讨论会计列报；缺失的准备金 / 违约资料包是本章最大阻碍。
