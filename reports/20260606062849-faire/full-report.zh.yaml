  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险最高的点集中在右上象限：规模化信用损失敞口和 Shopify 渠道依赖影响都高；监管和反垄断风险处在中等可能性、高影响。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - label: 关税 / 贸易政策摩擦
              tone: neutral
              detail: 关税持续变化推高成本压力，但 Faire 已用产品功能和运费下调回应。
            - label: EU GDPR 合规负担
              tone: risk
              detail: 欧洲版图扩大，多市场数据治理成了持续义务。
            - label: 60 天账期信用损失
              tone: risk
              detail: 违约风险随 GMV 放大，但公开信息仍未披露损失率和准备金数据。
        - label: 中等可能性
          values:
            - label: 品牌集中度
              tone: neutral
              detail: 头部品牌退出风险真实存在，但零售商留存和网络效应可部分缓冲。
            - label: Shopify 渠道依赖风险
              tone: risk
              detail: 推荐合作伙伴身份拉动增长，也带来结构性交易对手依赖。
            - label: 反垄断 / ToS 挑战
              tone: risk
              detail: 2024 年已被驳回，但记录在案的排他性指控，可能在规模更大后引来新挑战。
        - label: 低可能性
          values:
            - label: CEO 或联合创始人离任
              tone: neutral
              detail: 创始人仍深度参与，复苏也改善了目标一致性，因此短期离任风险看起来较低。
            - label: 物流网络故障
              tone: neutral
              detail: Ship with Faire 正快速扩展，承运商合作也提供一定备用能力。
            - label: 重大数据泄露
              tone: risk
              detail: 未发现公开泄露事件，但支付和交易数据敏感，固有风险仍高。
    claimRefs:
