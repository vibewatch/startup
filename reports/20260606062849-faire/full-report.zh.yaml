      - number: '7.4'
        title: 合作伙伴与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Faire 的依赖结构对一个自称广泛网络的市场平台来说异常集中。Shopify 是最重要的单一交易对手，因为它既是股东， 也是向商户推荐 Faire 作为首选批发市场的平台。如果 Shopify 改变 API
              经济性、撤销首选地位，或推出更直接的竞争产品， Faire 可能失去相当一部分零售商获客动能，同时集成层也会受扰动。供给侧同样存在依赖。虽然 Faire 拥有超过 100,000
              个品牌，公开数据仍看不到头部品牌集中多少 GMV，这意味着网络深度可能掩盖实质收入集中。公司还面对多个发现渠道竞争， 包括复苏中的线下展会，以及 Amazon
              Business、Alibaba、Ankorstore、Qogita 等规模化 B2B 平台。物流又叠加一层风险： Ship with Faire
              目前触达约一半订单，这提升控制力和变现，但也让公司暴露于承运商定价和服务质量。与 Shopify、 Square、Clover、Lightspeed 的 POS
              集成有助于留存，但也把运营表现绑定到外部平台；这些平台的路线图和商业激励并不由 Faire 控制。
