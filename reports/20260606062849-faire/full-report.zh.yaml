  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与投资立场
        blocks:
          - type: paragraph
            body: >-
              Faire 最新市场定价来自 November 2025 要约收购，估值 $5.2B；在已披露超过 $500M 的收入运行率上， 约等于 10x 年化收入。对一个 GMV 加速、NDR 超过
              110%、接近盈亏平衡的市场平台来说，这个倍数并不荒唐。 但它没有给意外留下空间：60 天净账期组合一旦出现信用损失实质化、Shopify 合作关系恶化，或增长持续减速，
              倍数都会明显压缩。正确立场是观察，并附带条件性继续研究。公司不是回避对象——重组后的经营轨迹和领导层反应确实很强—— 但要给出干净的买入判断，需要三项具体尽调交付物：（1）net-60
              账期的历史信用损失和违约率；（2）审计或董事会认证的收入和利润率数据； （3）Shopify 首选合作伙伴协议的商业条款。在这些材料可得之前，投资人是在一个市场平台业务之上给不透明信用敞口定价。 只有当
              Faire 的抽佣率耐久性和信用质量显著好于公开证据目前能让投资人确认的水平时，10x 倍数才站得住。
