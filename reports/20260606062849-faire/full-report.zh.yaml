  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接 B2B 批发同行、相邻平台、既有玩家与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Faire 的竞争格局分为四个清晰层次。最近的直接同行是聚焦欧洲的 B2B 批发市场——Ankorstore、Qogita 和 Orderchamp——它们复制了 Faire
              连接独立品牌与独立零售商的双边模式。Ankorstore 是最明确的正面竞争者：2022 年 1 月达到 $2 billion 估值，覆盖 23 个欧洲市场，拥有 200K 家零售商和 15K
              个品牌，并对复购订单收取 10% 佣金（首单 20%），显著低于 Faire 的 15% 基础费率。Qogita 和 Orderchamp 规模更小，但同样是增长中的欧洲替代方案，也提供类似 Net 账期主张。


              相邻层包括解决相关但不同任务的平台。NuORDER（Lightspeed 旗下）面向更大型企业品牌，提供数字 B2B 订货工作流，目标是传统服装和中型品牌，而不是 Faire
              聚焦的独立品牌。RangeMe/ECRM 通过结构化品类会议连接品牌与大型连锁杂货和零售买家——这是产品发现和供应商资格筛选平台，而非交易市场。Mable
              服务天然和特色食品品类，Carro（dropshipping）则让零售商在不承担采购订单风险的情况下扩充库存。


              既有玩家和现状替代层最大，也最少被系统列举。实体展会到 2024 年反弹至估计 $16 billion 市场（CNBC 引用 PwC 数据），大型活动吸引数万名零售商做出库存采购决定。Amazon
              Business 和 Alibaba 都以远超 Faire 当前 GMV 的规模提供 B2B 采购，尽管两者都没有复制 Faire 的独立品牌策展或面向小零售商的 Net 60
              账期。北美以外，直接经销商关系和冷启动外联仍是许多品牌的默认路径。
