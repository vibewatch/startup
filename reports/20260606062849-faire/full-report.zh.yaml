      - number: '7.6'
        title: 缓释因素、监控指标与否决条件
        blocks:
          - type: paragraph
            body: >-
              Faire 确实有真实缓释因素，这也是公司在这种风险结构下仍具可投性的原因。超过 110% 的净美元留存率意味着既有零售商会随着时间继续多花钱，
              降低了所有增长都来自弱质量需求的概率。欧洲增速快于北美，提供的是地域多元化叙事，而不是单一市场故事。公司还拥有广告和 Faire Insider 等更新、更经常性的收入流；累计 $1.7 billion
              融资也在增长保持纪律时提供运营缓冲。管理层足够早地承认错误并选择重组， 而不是维护虚假的增长故事，这一点值得一定认可。Shopify 的股东身份也创造了利益一致，而不只是依赖，因为只要合作仍有战略价值，
              Shopify 就有财务理由维护关系。即便如此，缓释因素不能替代硬监控。投资人应跟踪 net-60 账期的损失率、首单退货成本、 Shopify
              关系的具体商业条款、品牌和零售商集中度、欧洲盈利能力，以及通往盈亏平衡路径的可信度。若信用损失超过 GMV 的 2%， Shopify
              实质削弱合作，欧洲失去相对增长优势，或第二起反垄断挑战获得真实牵引力，投资逻辑就应破裂。
