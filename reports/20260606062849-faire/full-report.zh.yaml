      - number: '4.3'
        title: 成本结构、营运资本与信贷暴露
        blocks:
          - type: paragraph
            body: >-
              Faire 最重要的财务风险不是标价佣金，而是藏在 Net 60 下面的现金流桥。独立支付条款分析称，平台会在合格零售商结清发票前先向品牌付款，处理催收，并在零售商违约时承担信贷风险。Latterly
              的模型框架在方向上相符：一旦市场平台加入融资、退货、支付、物流和国际化运营，成本结构就会从软件和销售扩展到资本拨备、欺诈、催收、支持、支付轨道和运费补贴。这也是为什么即便 2025
              年收入故事明显改善，公开利润率故事仍不完整。经济问题不是 Net 60 是否帮助 GMV——它显然有帮助——而是信贷损失、准备金政策和回款时点是否吃掉太多抽佣率提升。Orderchamp
              竞争性的低起订量和交付后最长 60 天付款承诺在这里也重要：延期付款具有商业价值，但并非 Faire 独有。如果竞争平台能缩小便利性差距，Faire 更强的发现、留存和承保质量就必须证明更高有效收费结构合理。
