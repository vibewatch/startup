            body: >-
              2025 年末的证据显示，即便经历估值重置，Faire 的市场规模也已经足够重要。Sacra 和 Digital Commerce 360 指向超过 800,000 家零售商、超过 100,000 个品牌、超过
              110% 的净美元留存率，以及 2025 年预计约 $3 billion 的 GMV。变现方面，公开来源大致指向 15% 基础佣金、额外支付处理费、$10 首单费，以及 Faire Direct 流量 0%
              佣金；同时也描述了 Insider 订阅和增长中的广告业务带来的附属收入，广告已占收入超过 5%。收入质量不如网络规模确定，因为公司仍是私营公司，但公开数据集仍有意义：Sacra 估计 2023 年收入为
              $616 million，Digital Commerce 360 称收入运行率超过 $500 million，且 2025 年 Q3 增长超过 40%；CNBC 报道 2025 年较 2024 年增长
              32%。与 Shopify、Square、Clover 和 Lightspeed 的集成说明，平台锁定效应已经不只是市场列表曝光。
