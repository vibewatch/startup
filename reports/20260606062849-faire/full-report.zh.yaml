      - number: '7.5'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              Faire 的人才风险并不抽象；管理层已经承认，公司过度扩张，并在过程中损害了执行质量。第一信号是 October 2022 裁员， Faire 裁掉约 7%，当时员工总数约 1,200 人。第二信号是
              February 2023 更深的重组，裁撤约 20% 员工， 包括工程、产品、设计和数据科学等核心职能。Max Rhodes 在 March 2026 的评论让风险更可信，因为他说得异常坦诚：
              公司对增长上瘾，走了捷径，并看到留存和产品质量恶化。这个组合说明，重置前的运营模型已经在失效。Faire 的联合创始人班底仍有明显领导力，
              包括仍留在公司的技术和运营联合创始人，但重组成本不能低估。TeamBlind 3.8/5 的员工评分显示内部情绪不错但谈不上顶尖； February 2026 新 CPO
              到任，也意味着产品领导层仍在磨合。因此，执行风险同时集中在两个地方：痛苦裁员后维持文化稳定， 以及在不重演过度扩张的情况下交付欧洲扩张、物流和 AI 计划。
