      - number: '8.6'
        title: 退出准备度、投资逻辑破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Faire 提到 IPO 是长期目标——Bloomberg 报道 November 2025 要约收购时指出，公司正在考虑潜在 IPO。 IPO
              路径需要经审计财务报表、干净的信用损失披露记录，以及持续接近盈亏平衡或盈利。由于缺少公开审计财务报表， 公司还没准备好近期 IPO，但经营轨迹正朝那个方向移动。投资逻辑破裂触发器具体且可监控：net-60
              账期信用损失超过 GMV 的 2%；Shopify 终止或实质削弱首选合作伙伴身份；在 2025 年 32% 增长之后，2026 年收入增长降至 20%
              以下；或第二起重大反垄断诉讼。最终尽调问题集中在三项不可谈判披露：net-60 账期的信用损失和准备金历史， 包括毛利率在内的 2024-2025 审计或董事会认证财务数据，以及完整 Shopify
              合作商业条款。没有这些， 投资人无法负责任地承保当前估值或 IPO 轨迹。
            claimRefs:
