  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - Faire
        - 直连式 B2B 批发市场平台（在位者）
        - 800K+ 零售商、100K+ 品牌、已融资 $1.7B、估值 $5.2B（2025 年 11 月）、2025 年 GMV 约 $3B
        - 全球独立精品零售商；独立手工 / 工艺品牌
        - 网络密度（10M+ 关系）、Net 60 账期、免费退货、Shopify 集成、推广列表
        - 15%+ 佣金率处于同业最高区间；私有财务数据限制完整尽调
      - - Ankorstore
        - 直连式 B2B 批发市场平台（欧洲）
        - $2B 估值（2022 年 1 月 Series C）；融资时有 200K 零售商、15K 品牌
        - 欧洲独立零售商；覆盖欧盟市场的独立品牌
        - 复购佣金较低，为 10%（首单 20%）；覆盖 23 个欧洲市场；无仓储模式
        - 公开规模数据只到 2022 年 1 月 Series C；融资后指标未完整披露
      - - Qogita
        - B2B 批发目录聚合商（欧盟 / 英国）
        - 500+ 家经审核供应商、10K+ 品牌、500K+ 商品、100K+ 零售企业
        - 希望在一个购物车里拿到多供应商批量价格的欧洲零售商
        - 代表零售商谈批量价格；欧盟 / 英国仓发货；保证正品
        - 供应侧聚合模式不同于 Faire 的品牌直连模式；佣金结构未公开
      - - Orderchamp
        - 直连式 B2B 批发市场平台（欧洲）
        - 7,000+ 品牌、200,000+ 零售商；保留来源未披露融资
        - 寻求低起订量、包邮批发的欧洲独立零售商
        - 包邮、低起订量、Net 60 账期、品牌到零售商直发订单
        - 品牌目录小于 Faire；北美或全球覆盖有限
      - - NuORDER / Lightspeed
        - B2B 数字订货平台（邻近企业级）
        - 隶属 Lightspeed（上市公司）；面向中端市场至企业级品牌和多门店零售商
        - 向专业零售连锁、百货和多品牌展厅销售的成熟品牌
        - 服务较大品牌—零售商关系的数字订单管理；集成 Lightspeed Commerce
        - 不是品牌发现型市场平台；目标客户画像不同于 Faire 的独立品牌
      - - RangeMe / ECRM
        - B2B 商品发现和买家匹配平台（聚焦大型连锁）
        - 全球领先商品发现平台；获得数百家大型连锁零售商信任
        - 希望进入杂货、药房、综合商品大型连锁的品牌
        - 按品类组织买卖双方匹配会；大型连锁买家关系；ECRM 收购
        - 服务的买卖双方不同于 Faire；不是独立零售批发订货平台
      - - Amazon Business
        - B2B 采购平台（在位大型替代品）
        - 面向企业买家的 Amazon B2B 渠道；批量定价；多用户账户管理
        - 希望在 Amazon 全品类目录中获得批量定价的各类企业
        - SKU 覆盖极宽、批量折扣、Prime 配送、集成开票
        - 不策展独立品牌，也不提供 Net 60 账期；主要是采购工具，不是发现型市场平台
      - - 线下展会（现状）
        - 现状型在位者和直接替代品
        - PwC 估计 2024 年市场约 $16B；大型活动吸引数万零售商
        - 偏好线下发现品牌、靠关系订批发货的零售商
        - 人际关系、线下产品体验、多品牌订货活动、季节性档期
        - 重物流、受地域限制且有季节性；COVID 后反弹，但结构上更慢
    notes: 规模数据反映保留公开证据中的最新信息；融资后披露较薄的行（Ankorstore、Orderchamp）已标注。纳入展会，是因为这与 Faire CEO 对现状替代品的公开表述一致。
