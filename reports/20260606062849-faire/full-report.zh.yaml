      - number: '3.3'
        title: 定价、佣金结构与切换成本分析
        blocks:
          - type: paragraph
            body: >-
              Faire 的定价结构——多数品牌订单收取 15% 佣金，新零售商首单另收 $10，加上按回款速度不同收取 1.9% 至 3.5% 支付处理费——是 B2B 批发市场中最高的抽佣水平之一。Ankorstore
              对复购订单收取 10%（首单 20%），Qogita 不公开披露固定佣金，而是代表零售商谈判批量价格；Orderchamp 同样以免费配送和低起订量为主，而不是单靠固定佣金竞争。只有 Faire Direct
              链接能创造零佣金路径，但 Faire 在 2023 年 7 月把 Direct 订单改为包含处理费。评论者指出，许多品牌会把 Faire 列表价定得比自己批发价高 10–20%
              来补偿费用，这会给价格敏感的零售商制造摩擦。


              零售商的切换成本真实存在，但不算高。Faire 的 Net 60 账期、首单免费退货、与 75K 个活跃连接零售商的 Shopify 集成，以及广泛品牌发现，都是实际黏性来源。接入 POS
              的零售商下单量比未接入者高近 20%，也是黏性最强的细分群体。不过，多平台并用完全可行：零售商可以同时使用 Faire、Ankorstore、Orderchamp 和展会订货单，没有技术壁垒。品牌侧最强的锁定来自
              Faire 的 ToS——其中曾包含一条款：品牌一旦在 Faire 上与某零售商完成订单，就不得再通过竞争平台与同一零售商完成订单。Tundra 的反垄断诉讼把这条款作为核心指控，尽管法院最终在 2024 年
              11 月驳回了该案。
