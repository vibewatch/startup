  topStrengths:
    - >-
      Faire has reached genuine marketplace density with 800K+ retailers and 100K+ brands, making it one of the scaled
      leaders in digitized indie wholesale.
    - >-
      Monetization is broader than a simple commission business because advertising, subscriptions, logistics, and
      financing all deepen revenue per cohort.
    - >-
      Public evidence suggests execution improved after the 2022-2024 reset, with eight consecutive quarters of GMV
      growth, NDR above 110%, and management signaling near-breakeven trajectory.
  topRisks:
    - >-
      Credit concentration risk from materially scaled 60-day retailer receivables without public default-rate or
      reserve disclosure.
    - Shopify platform dependency because Shopify is both an investor and an important distribution/integration channel.
    - >-
      Commission pressure, first-order subsidies, and multi-homing risk could compress realized take rate if discovery
      edge weakens.
    - >-
      European expansion still faces local competitors, cross-border trade friction, and multi-jurisdiction compliance
      complexity.
    - >-
      Two layoff cycles and management's own growth-reset narrative show that execution quality can deteriorate quickly
      under aggressive expansion.
  unresolvedGaps:
    - Audited financial statements and exact revenue, gross margin, and contribution-margin data remain undisclosed.
    - Net 60 credit loss rates, reserve policy, delinquency aging, and recovery data are not public.
    - Full board composition, governance documents, and shareholder-rights details remain opaque.
    - >-
      Exact take-rate mix across marketplace commissions, financing, subscriptions, advertising, and logistics is still
      not broken out publicly.
