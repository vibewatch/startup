  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: credit-losses
    missingEvidence: Trailing 24-month default, delinquency, recovery, and reserve data for the Net 60 book.
    whyItMatters: Without loss and reserve history, investors cannot tell whether deferred-payment growth is accretive or quietly consuming take-rate gains.
    diligencePath: Request monthly credit-performance packs, vintage curves, reserve policy memos, and any warehouse-line reporting used internally.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and contribution margin by marketplace, ads, subscription, logistics, and payments.
    whyItMatters: Revenue mix only improves valuation if the higher-growth add-ons carry durable incremental margin.
    diligencePath: Request audited income statements with segment or management-reporting breakdowns for 2024-2025.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Latest unrestricted cash, monthly burn, runway bridge, and any debt or warehouse facilities supporting Net 60 advances.
    whyItMatters: Capital adequacy cannot be underwritten from valuation headlines or secondary liquidity alone.
    diligencePath: Request the latest balance sheet, debt schedule, covenant summary, treasury policy, and downside runway case.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: Channel-level CAC, sales and marketing spend, incentive spend, and payback by cohort.
    whyItMatters: Public retention proxies are encouraging, but they do not prove efficient new-logo acquisition or payback discipline.
    diligencePath: Request acquisition-cost reporting by Shopify, direct, paid, and referral channels plus cohort revenue waterfalls.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: tender-cap-table
    missingEvidence: Primary-versus-secondary split, updated cap table, preference stack, and any tender-related side letters.
    whyItMatters: A liquidity event can clean up employee incentives without materially improving runway, and preference seniority still matters for downside underwriting.
    diligencePath: Request board materials for the tender, post-transaction cap table, option-pool summary, and liquidation preference schedule.
    relatedQuestionRefs:
    - QI017
    - QI024
    relatedTableRefs:
    - TI005
    - TI006
