- id: cost-structure-working-capital-and-credit
  title: Cost structure, working capital, and credit exposure
  body: |-
    Faire's most important financial risk is not the sticker commission but the cash-flow bridge hidden underneath Net 60. Independent payment-terms analysis says the platform pays brands before eligible retailers settle their invoices, handles collections, and assumes credit risk if a retailer defaults. Latterly's model framing is directionally consistent: once a marketplace adds financing, returns, payments, logistics, and international operations, cost structure expands beyond software and sales into capital provisioning, fraud, collections, support, payment rails, and shipping subsidies. That is why the public margin story is still incomplete even though the revenue story improved materially in 2025. The economic question is not whether Net 60 helps GMV — it clearly does — but whether credit losses, reserve policy, and payout timing consume too much of the take-rate improvement. Orderchamp's competing promise of low minimums and pay-up-to-60-days-after-delivery terms also matters here: deferred payment is commercially valuable, but it is not uniquely owned by Faire. If competing platforms can narrow the convenience gap, Faire's superior discovery, retention, and underwriting quality must justify the higher effective fee stack.
