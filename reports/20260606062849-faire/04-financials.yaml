    - Retailer / Faire balance sheet
    - Buy now, pay 60 days later with zero fees for eligible retailers
    - Clear on homepage and independent payment-terms guides
    - Powerful conversion lever, but shifts credit exposure to Faire
  - - Faire Insider
    - Retailer
    - $19.99 per month
    - Explicit in Sacra
    - Recurring subscription layer improves quality of revenue if churn is low
  notes: This is a pricing snapshot, not realized net revenue; official archived fee pages are partially unreadable, so live customer-support exports should be requested in diligence.
