- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Net dollar retention
    - '>110%'
    - Medium
    - Best public LTV-quality proxy; shows existing retailers expand wallet share
    - Provide cohort NRR/GRR by retailer size, region, and vintage
  - - Effective take rate
    - ~19% after rising from ~16.5%
    - Medium
    - Shows monetization power and room for margin expansion if losses stay controlled
    - Show take rate by stream, first-vs-repeat, and geography
  - - 2025 revenue growth
    - 32% vs 2024
    - Medium
    - Signals efficiency rebound after restructuring, but not enough to infer CAC payback
    - Provide audited monthly revenue bridge and sales & marketing spend
  - - Gross margin
    - Not public
    - Low
    - Core missing variable for underwriting the path from revenue to free cash flow
    - Disclose gross margin by marketplace, ads, subscription, and logistics
  - - CAC
    - Not public; best proxy is self-serve/partner-led distribution via Shopify and repeat ordering
    - Low
    - Without CAC, no true payback or sales-efficiency analysis is possible
    - Provide blended and channel-specific CAC including incentives
  - - LTV
    - 'Proxy only: NDR >110% plus recurring attach products'
    - Low
    - Retention looks healthy, but there is no churn, gross retention, or cohort margin data
    - Disclose cohort lifetime gross profit by retailer/brand segment
  - - CAC payback
    - Not public
    - Low
    - Critical for judging whether the post-reset growth engine is efficient
    - Provide sales efficiency and payback by acquisition channel
  - - Channel efficiency proxy
    - 396 Shopify app reviews, 4.5 rating, with merchant comments about increased wholesale orders and easier operations
    - Low
    - Suggests a scalable partner channel and product-led workflow, not proof of CAC economics
    - Disclose Shopify-sourced activation, conversion, and payback by cohort
  notes: Public unit economics are proxy-heavy by design; null or low-confidence cells indicate that the metric is not directly disclosed rather than economically irrelevant.
