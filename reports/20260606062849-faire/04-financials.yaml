      label: Core transaction fees
      detail: Marketplace orders carry 15% commission plus a $10 first-order fee for new retailer relationships.
      tone: positive
    - id: N3
      label: Payout timing fees
      detail: Brands can trade margin for faster payout, creating fee revenue tied to working-capital convenience.
      tone: neutral
    - id: N4
      label: Faire pays brand
      detail: Eligible brand payouts can occur before the retailer invoice is due.
      tone: neutral
    - id: N5
