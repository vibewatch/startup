tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Public evidence / current status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Marketplace commission
    - Brand pays marketplace take rate on Faire-sourced orders
    - '% of product subtotal'
    - 15% list commission is widely cited; Sacra says effective take rate reached ~19% after pricing changes
    - Core revenue stream; high quality if repeat order mix is durable, but still GMV-linked
    - Disclose realized take rate by cohort, region, and first-vs-repeat mix
  - - First-order acquisition fee
    - Brand pays flat fee on a retailer's first order
    - $/order
    - Craftybase cites a $10 new-retailer fee on first orders
    - High-margin but volume-sensitive; reflects customer acquisition monetization
    - Confirm whether fee is still universal by geography and brand program
  - - Payment processing / payout timing
    - Brand pays processing and/or accelerated payout fees
    - '% of order + fixed fee'
    - Third-party sources place the ladder between 1.9% and 3.5% plus $0.30, with directionally higher fees for faster payout
    - Useful monetization lever, but live schedule remains hard to verify from archived official pages
    - Export current help-center fee table and payout mix by brand cohort
  - - Faire Direct
    - Brands bring their own retailers onto Faire
    - '% commission + processing'
    - Craftybase says Direct orders have 0% commission and only processing fees
    - Lower monetization per order, but protective for retention and channel consolidation
    - Break out Direct share of GMV, revenue, and attach rates for other services
  - - Faire Insider
    - Retailer subscription for shipping and discovery perks
    - $ / month
    - Sacra lists Faire Insider at $19.99 per month with 100,000+ enrolled retailers
    - Higher-quality recurring revenue than pure transaction fees, but public revenue contribution is undisclosed
    - Provide subscriber count trend, gross churn, and net revenue contribution
  - - Promoted Listings / ads
    - Brands pay for discovery placement and sponsored visibility
    - '% of revenue / brand count'
    - Official/news sources say ads exceed 5% of revenue; Sacra says nearly 10,000 brands use the product in the U.S.
    - Likely higher-margin and strategically important because it expands take rate without raising commission
    - Disclose ads revenue, adoption rate by active brand, and incremental margin
  - - Ship with Faire / logistics-adjacent fees
    - Shipping and fulfillment-related services layered on marketplace orders
    - Shipment volume / shipping spend
    - Sacra says Ship with Faire moved 5M+ shipments in 2025 and retailers spent $200M on shipping
    - Potentially meaningful scale, but profitability and subsidy level are unknown
    - Disclose logistics revenue, gross margin, and shipping-subsidy policy
  notes: List pricing and monetization mix are partially triangulated because archived official fee pages are weakly readable; use live help-center exports to confirm the current payout ladder before underwriting
    realized gross profit.
  enumerationScope:
    coverage: exhaustive
    basis: 'Every publicly observable monetization stream retained for this chapter: core transaction fees, payout fees, subscriptions, ads, and logistics-adjacent services.'
