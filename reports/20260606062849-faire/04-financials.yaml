    - Third-party calculators and analyses are explicit; archived official page is not
    - High headline take rate supports revenue, but also creates price-elasticity risk
  - - First order fee
    - Brand
    - $10 on first retailer order
    - Clear in Craftybase; not cleanly machine-readable in official archive
    - Improves monetization of new account acquisition but hits small orders hardest
  - - Faire Direct order
    - Brand
    - 0% commission; processing still applies
    - Clear in Craftybase and business-model writeups
    - Protects retention and channel consolidation even though direct monetization is lower
  - - Next-day payout
    - Brand
    - Fastest payout, highest fee band
    - Directional public support exists, exact current official ladder needs confirmation
    - Higher fee monetizes working-capital convenience
  - - 30-day / 60-day payout
    - Brand
    - Lower fee or zero-fee options depending on schedule
    - Independent guides disagree on exact ladder details
    - Choice architecture affects brand margin and Faire's fee capture
