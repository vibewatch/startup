- id: TI004
  title: Working-capital and credit exposure table
  columns:
  - Exposure
  - Public evidence
  - Cash-flow timing
  - Margin / liquidity implication
  - Diligence ask
  rows:
  - - Net 60 receivable gap
    - Retailers can pay 60 days later while brands are paid earlier
    - Retailer pays Faire around day 60; brand can be paid next day or later
    - Marketplace growth can increase receivables and reserve needs faster than revenue implies
    - Provide AR aging, vintage losses, and reserve methodology
  - - Brand payout acceleration
    - Brands can choose faster payout options with higher fees
    - Faire advances cash before retailer settlement on eligible orders
    - Accelerated payout monetizes convenience but increases funding needs
    - Disclose payout-option mix and funding source for advances
  - - Retailer default risk
    - Independent guides say Faire assumes credit risk and collections
    - Losses materialize after shipment and before/after invoice due date
    - Credit losses can erase take-rate gains if underwriting loosens
    - Provide default, delinquency, recovery, and write-off history
  - - Free first-order returns
    - Homepage markets free returns on every first order with a brand
    - Cash outflow can occur before re-sell or claim recovery
    - Supports GMV growth and trial but creates fulfillment and returns cost
    - Disclose return rate, who bears freight, and margin impact
  - - Logistics / shipping subsidies
    - Ship with Faire and shipping savings are visible but gross economics are not
    - Costs hit as orders are shipped, not when retailers pay
    - Could pressure contribution margin if shipping savings are subsidized
    - Provide logistics gross profit and subsidy rates
  - - Deferred-payment competition
    - Orderchamp also markets pay-up-to-60-days-after-delivery terms
    - Competitive matching can compress economics over time
    - Financing convenience alone may not defend a premium fee stack
    - Show conversion uplift and loss performance versus competing financed channels
  notes: This table focuses on cash timing and risk transfer, not accounting presentation; the missing reserve/default package is the single biggest blocker in the chapter.
  claimRefs:
