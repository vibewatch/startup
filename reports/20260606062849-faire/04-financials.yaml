- id: TI006
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why missing matters
  - Best public proxy
  - Current assessment
  - Exact diligence path
  rows:
  - - Audited annual revenue by year
    - Needed to reconcile 2023 estimates, 2025 run-rate, and 2025 growth claims
    - Sacra 2023 estimate + official 2025 run-rate + CNBC 2025 growth claim
    - Directionally positive, not audit-grade
    - Request 2023-2025 audited or board-certified financial statements
  - - Gross margin by stream
    - Needed to judge ads/subscription uplift versus logistics/payment drag
    - Take-rate improvement and ads share >5% suggest upside, but no margin disclosure exists
    - Material blocker
    - Request revenue and gross profit by marketplace, ads, subscription, logistics
  - - Credit losses / reserves on Net 60
    - Needed to test whether financing economics are accretive or destructive
    - Independent guides confirm Faire takes the risk; no loss data is public
    - Highest-priority blocker
    - Request default, delinquency, reserve, recovery, and vintage curves
  - - Cash balance and runway
    - Needed to judge whether the company is self-funding or financing-dependent
    - Layoffs and tender indicate discipline/liquidity management but not runway
    - Material blocker
    - Request latest balance sheet, cash waterfall, and downside runway plan
  - - CAC / payback by channel
    - Needed to test sales efficiency and growth durability
    - Shopify reviews and NDR suggest channel/product strength, but no CAC is public
    - Meaningful gap
    - Request acquisition cost, incentives, and payback by Shopify, direct, and organic cohorts
  - - Revenue mix by stream
    - Needed to determine how much of revenue is recurring or higher-margin
    - Ads >5% and Insider 100k+ enrolled show mix breadth, but not contribution dollars
    - Material gap
    - Request stream-level revenue bridge and attach-rate trend
  - - Working-capital funding structure
    - Needed to understand whether warehouse lines or off-balance-sheet financing support Net 60
    - No public debt or facility disclosure found
    - Material gap
    - Request debt agreements, facility size, pricing, and covenants
  - - Tender cap table / preferences
    - Needed to know seniority, preference overhang, and employee-liquidity impact
    - Tender valuation is public; preference stack is not
    - Material gap
    - Request post-tender cap table, liquidation stack, and option-pool data
  - - Realized fee ladder
    - Needed to translate list pricing into net revenue and margin by payout option
    - Official archived pages are weakly readable; third-party tools agree directionally
    - Minor but actionable gap
    - Export live help-center fee tables and payout-option usage data
  notes: This register is intended to be exhaustive for the material public-data gaps that still block full financial underwriting of Faire as of runDate.
