- id: TI005
  title: Capital adequacy table
  columns:
  - Item
  - Public disclosure
  - What it likely means
  - Underwriting read-through
  - Diligence ask
  rows:
  - - Historical funding base
    - $1.7B over 9 rounds per Tracxn
    - Faire has been heavily equity-funded across growth stages
    - Past fundraising strength is clear, but available cash today is not
    - Provide audited cash bridge from last primary round to today
  - - Latest disclosed event
    - ~$100M tender / secondary at $5.2B
    - Liquidity event improved employee/shareholder liquidity
    - Do not assume it materially extended runway without a primary-cash breakout
    - Provide primary vs. secondary split and cash to company
  - - Latest valuation
    - $5.2B in Nov 2025
    - Reset from 2021-2023 peak valuations, but still premium to many marketplace comps
    - Valuation is market context, not proof of margin durability
    - Provide board-approved fair value methodology and cap-table summary
  - - Largest prior primary round
    - $596M in Nov 2021
    - Company once raised large amounts to scale aggressively
    - Past capital access does not eliminate current runway risk
    - Provide remaining proceeds and uses by year
  - - Cost reset signals
    - 2022 and 2023 layoffs, including ~250 people in 2023
    - Management acted to reduce burn and flatten bureaucracy
    - Good discipline signal, but not a substitute for audited burn data
    - Provide monthly burn before and after restructuring
  - - Cash on hand
    - Not disclosed publicly
    - Cannot verify liquidity buffer
    - Major blocker for solvency underwriting
    - Provide latest balance sheet and unrestricted cash
  - - Monthly burn / EBITDA
    - Not disclosed publicly
    - Cannot test whether near-breakeven is accounting, EBITDA, or cash-flow based
    - Major blocker for runway analysis
    - Provide trailing 12-month burn and EBITDA bridge
  - - Debt / warehouse / credit facilities
    - Not disclosed publicly
    - Unknown whether Net 60 is supported purely by cash, bank lines, or structured facilities
    - Could materially change capital intensity and downside risk
    - Provide all debt, covenant, and warehouse-finance documents
  - - Next-round / IPO trigger
    - IPO discussed publicly; no explicit trigger published
    - Future capital event likely depends on sustained growth plus clean disclosure
    - Company may not need new equity if margins and losses are contained, but no proof exists
    - Provide board plan, KPI triggers, and downside financing case
  notes: Capital adequacy cannot be closed from public sources alone because the latest disclosed transaction looks primarily liquidity-oriented and the balance sheet is still private.
