company:
  name: Faire
chapter:
  number: 4
  title: Financials
  summary: Faire monetizes a wholesale marketplace through commissions, first-order fees, payment timing, advertising, subscriptions, and logistics-adjacent services, but the public record still stops well
    short of filing-grade underwriting. Revenue quality looks directionally better than a single-stream marketplace because take rate, ads, and retention have improved, yet margin path and capital adequacy
    remain blocked by missing credit-loss, gross-margin, burn, and primary-versus-secondary financing disclosure.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization mix
  body: |-
    Faire's public monetization stack is broader than a simple marketplace commission. The retailer-facing homepage still markets the core demand engine — over 100,000 brands, buy-now-pay-later terms, and free first-order returns — while third-party fee triangulation shows the brand side pays 15% marketplace commission, a $10 first-order fee, and payout-dependent processing charges. Sacra's 2025 operating summary then adds the key mix signals missing from the official pricing pages: effective take rate rose from roughly 16.5% to 19%, advertising exceeded 5% of revenue within two years of launch, Faire Insider is priced at $19.99 per month with 100,000+ enrolled retailers, and logistics products such as Ship with Faire are now large enough to move millions of shipments. The result is a monetization mix that is increasingly diversified, but still fundamentally tied to GMV, retailer retention, and the platform's willingness to underwrite deferred-payment convenience. Official archived pricing/support pages exist, but their fetches are not machine-readable enough to replace diligence-room confirmation of the exact live fee ladder.
