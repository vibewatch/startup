evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited 2025-2026 revenue, EBITDA, burn, cash balance, and a full cap table with tender mechanics are not publicly
      available.
    whyItMatters: >-
      Without audited financial statements and ownership detail, valuation multiples, dilution risk, and IPO readiness
      cannot be underwritten with institutional confidence.
    diligencePath: Request board materials, audited financial statements, cap table, and 2025 tender documentation in the data room.
    relatedQuestionRefs:
      - QO021
      - QO026
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, investor rights, liquidation preferences, and any Shopify or tender-side governance
      protections are not fully public.
    whyItMatters: >-
      These terms determine control, downside protection, and how much influence strategic or late-stage investors
      actually hold.
    diligencePath: >-
      Request the latest board roster, shareholder agreement, voting agreements, and side letters tied to the 2023
      Shopify investment and 2025 tender.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: >-
      Public sources do not cleanly reconcile Faire’s current 2026 operating headcount after the 2023 layoffs and 2025
      tender period.
    whyItMatters: >-
      Headcount trend is a useful proxy for operating leverage, hiring confidence, and the magnitude of restructuring
      already absorbed.
    diligencePath: Request current org charts, historical employee counts by quarter, and a post-restructuring headcount bridge.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO004
