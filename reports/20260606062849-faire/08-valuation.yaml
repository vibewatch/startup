      - - 'THESIS: Advertising business (>5% of revenue) and Faire Insider subscription create higher-margin revenue layers above the transaction commission base.'
        - 'View strengthens if ads revenue grows to 10%+ of total revenue and subscription penetration exceeds 200,000 enrolled retailers.'
      - - 'ANTI-THESIS: 60-day net-terms model creates an opaque credit exposure that scales with GMV; no public disclosure of default rates or credit-loss reserves exists.'
