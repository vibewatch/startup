    title: 'Critical missing input: credit-loss data on 60-day net terms'
    body: 'The single most important undisclosed piece of information is Faire''s historical default and credit-loss rate on the 60-day net-terms portfolio. At $3B GMV with a ~19% take rate, even a 1% annualized default rate represents ~$30M in losses — roughly 5% of expected 2025 revenue. Investors cannot responsibly underwrite the current valuation without this data. It is a non-negotiable diligence ask.'
    claimRefs:
      - 'CV003'
      - 'CV004'
      - 'CV021'
      - 'CV036'
  - calloutType: 'recommendation'
    title: 'Path from track to buy'
    body: 'The recommendation moves from track to buy if management confirms three conditions: (1) trailing 24-month credit-loss rates on net-60 terms below 1% of GMV; (2) 2024-2025 gross margin above 40%; and (3) Shopify partnership terms including multi-year renewal provisions. If all three are confirmed at a valuation at or below $5.2B, the investment case becomes compelling at the base-case growth trajectory.'
    claimRefs:
      - 'CV001'
      - 'CV005'
      - 'CV036'
      - 'CV038'
      - 'CV041'
