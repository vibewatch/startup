        - 'Move to track; reduce multiple to 6-7x forward revenue; engage management for explanation before further action'
      - - 'Second antitrust filing'
        - 'New antitrust lawsuit alleging exclusive dealing or anti-competitive ToS clauses filed after Tundra dismissal'
        - 'Documents ongoing legal risk in a higher-profile format; could trigger regulatory review and ToS changes that reduce brand lock-in'
        - 'Place on hold pending legal outcome; evaluate what ToS changes management has planned or already made'
      - - 'IPO delay beyond 2027'
        - 'No public S-1 filing or clear IPO timeline by end of 2027'
        - 'Secondary liquidity path is less clear; preference holders face longer hold; dilution risk from potential additional funding rounds increases'
        - 'Reassess holding thesis; verify cap table and liquidation preference stack; negotiate secondary liquidity if available'
    notes: 'Kill triggers are not guarantees of loss; they are observable, time-bounded events that would change the investment posture from track to avoid or require active engagement with management.'
