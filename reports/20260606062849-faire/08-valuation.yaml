    figureRefs:
      - 'FV003'
  - id: 'comparable-set-and-multiples'
    title: 'Comparable set and implied multiples'
    body: 'Faire''s most direct comparables are Etsy (public marketplace, ~$6B market cap on ~$2.8B revenue = ~2x EV/revenue) and Shopify (public commerce platform, trades at 10-15x revenue with SaaS premium). Etsy''s lower multiple reflects slower growth and a consumer rather than B2B focus, providing a floor bound for Faire. Shopify''s higher multiple is possible only with proven software-like margins, which Faire has not yet disclosed. European wholesale competitor Ankorstore was valued at $2B in January 2022 — a mark that is now stale and likely lower given marketplace multiple compression. Global-E Online (GLBE), a cross-border commerce platform, provides a relevant public comp for Faire''s international expansion premium. Lightspeed Commerce adds another adjacent commerce-software reference point: its public revenue scale is meaningful, but it has not earned Shopify-like valuation premium, underscoring how demanding Faire''s 10x revenue mark remains. At $5.2B and ~$500M annualized revenue, Faire trades at ~10x revenue — above the Etsy floor (2x) but below the Shopify premium (12x+). That positioning is defensible only if Faire can demonstrate NDR durability, margin expansion, and credit-quality at scale. Amazon Business and Alibaba B2B represent the long-term competitive threat that could compress Faire''s take rate over time.'
