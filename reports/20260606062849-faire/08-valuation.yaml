  - id: 'exit-readiness-and-diligence'
    title: 'Exit readiness, thesis-break triggers, and final diligence asks'
    body: 'Faire has mentioned an IPO as a long-term objective — Bloomberg reported the November 2025 tender offer while noting the company is eyeing a potential IPO. An IPO path would require audited financials, a clean credit-loss disclosure track record, and sustained near-breakeven or profitability. The company is not ready for a near-term IPO given the absence of public audited financials, but the operational trajectory is moving in that direction. Thesis-break triggers are specific and monitorable: credit losses on net-60 terms exceeding 2% of GMV; Shopify terminating or materially degrading the preferred-partner designation; revenue growth decelerating below 20% in 2026 after the 32% 2025 print; or a second major antitrust filing. Final diligence asks center on three non-negotiable disclosures: the credit-loss and reserve history on net-60 terms, audited or board-certified 2024-2025 financials including gross margin, and the full Shopify partnership commercial terms. Without these, investors cannot responsibly underwrite either the current valuation or the IPO trajectory.'
