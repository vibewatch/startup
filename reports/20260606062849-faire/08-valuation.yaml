  - id: 'TV006'
    title: 'Final diligence asks table'
    columns:
      - 'Topic'
      - 'Missing evidence'
      - 'Why it matters'
      - 'Owner or diligence path'
    rows:
      - - 'Credit-loss and default rates'
        - 'No public disclosure of net-60 default rates, reserve methodology, or credit-quality cohort distribution'
        - 'A 1-2% GMV credit loss rate would represent $30-60M in annual losses; the valuation is uninvestable without this data'
        - 'Request from CFO; historical monthly loss data by retailer cohort, segment, and geography for at least 24 months'
      - - 'Audited financials and gross margin'
        - 'No audited 2024-2025 financials, no gross margin disclosure, no contribution margin by segment'
        - 'Margin structure determines whether Faire is a software-like marketplace or a thin-margin financial-services platform'
        - 'Request from CFO; full P&L, gross margin bridge, segment economics, and advertising margin specifically'
      - - 'Shopify commercial agreement'
        - 'Full terms of the Shopify preferred-partner agreement and shareholder agreement'
        - 'Termination triggers, exclusivity terms, and renewal rights determine the reliability of the primary acquisition channel'
        - 'Request from CEO/CLO; commercial agreement, termination provisions, and any most-favored-nation provisions'
      - - 'Cap table and preference stack'
        - 'No public disclosure of preference waterfall, ratchets, or anti-dilution terms'
        - 'Full preference stack determines actual equity value at various exit prices; $5.2B equity claim may overstate common equity value'
        - 'Request from CFO/counsel; full cap table, preference rights, and liquidation waterfall model at $5B and $10B exit scenarios'
      - - 'European market unit economics'
        - 'No disclosure of European profitability, CAC, LTV, or market-by-market GMV concentration'
        - 'Europe growing at 2x North America is a headline claim; the bull case requires Europe to be margin-accretive, not just growth-additive'
        - 'Request from CFO; European revenue by market, gross margin by geography, and CAC/LTV for EU top 5 markets'
      - - 'AI and logistics investment plan'
        - 'No public disclosure of capex or opex budget for AI buying assistant, Ship with Faire consolidation, and logistics buildout'
        - 'Capital intensity of the logistics and AI roadmap determines whether near-breakeven is sustainable or requires a new funding round'
        - 'Request from CFO/CPO; 3-year operating plan, capex by initiative, and unit economics projections for Ship with Faire and AI features'
    notes: 'These are non-negotiable diligence items. None of them requires proprietary information beyond what would be in a Series-stage data room. Absence of any one of them is a red flag for governance and investment readiness.'
