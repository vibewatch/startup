        - 'Reframes Faire as a credit business layered under marketplace revenue; materially impairs margin and capital efficiency thesis'
        - 'Move to avoid; require full reserve disclosure and recalibrate valuation to 5-6x net revenue (excluding credit-loss-adjusted GMV from revenue base)'
      - - 'Shopify partnership change'
        - 'Shopify publicly withdraws preferred-marketplace status, reduces API access, or launches competing wholesale marketplace'
