      - number: '1.4'
        title: Milestones, operating risks, and unresolved evidence
        blocks:
          - type: paragraph
            body: >-
              The dated record shows a rapid progression: founding in 2021, the Legends acquisition in 2025,
              increasingly visible advisor and booking scale in early 2026, and the Series D in July 2026. The company
              says the first $1 billion of bookings took about three years, the second took eight months, and the third
              took five months. That acceleration is encouraging but remains company-reported and lacks advisor-cohort,
              traveler-repeat, take-rate, or supplier-concentration denominators. A Reddit discussion supplies an
              adverse, anecdotal counterweight: one contributor described a barebones CRM and a 70/30 commission split.
              The thread is not a representative survey, so it identifies diligence questions rather than proving broad
