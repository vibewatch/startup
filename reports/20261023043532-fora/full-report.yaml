chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Fora is a New York-based platform for independent travel advisors, founded in 2021. Its proposition is
              neither a conventional online travel agency nor pure software: advisors retain the traveler relationship
              while Fora supplies training, supplier access, booking workflows, payment infrastructure, community, and
              AI-enabled tools. Independent company profiles and an executive interview consistently describe this
              human-plus-technology model, although they do not independently audit platform performance. Public scale
              indicators are substantial. July 2026 reporting cited more than 15,000 active advisors and more than $3
              billion of lifetime travel bookings, while an April Skift interview cited 200 employees, about half
              engineers. These measures describe network activity and organizational investment; they are not Fora
              revenue, ARR, cash, or profitability.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO011
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
