  - id: FP001
    title: Competitive positioning by workflow integration and human-advisor centrality
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning shows Fora's intended integrated, human-centered posture while separating
      software, distributor, manual, and autonomous-agent alternatives.
    data:
      xAxis:
        label: 'Workflow integration: 1 fragmented to 5 integrated'
        min: 1
        max: 5
      yAxis:
        label: 'Human-advisor centrality: 1 low to 5 high'
        min: 1
        max: 5
      points:
        - label: Fora
          x: 5
          'y': 5
          detail: Host infrastructure, supplier access, workflow tooling, community, and AI are bundled around the advisor.
        - label: TravelJoy
          x: 3
          'y': 4
          detail: >-
            Integrated workflow software supports advisors but does not include a host-agency bundle in retained
            evidence.
        - label: Large online distributors
          x: 4
          'y': 1
          detail: >-
            Scaled booking distribution is integrated, while the retained evidence does not show a
            human-advisor-centered model.
        - label: Established host networks
          x: 3
          'y': 5
          detail: Advisor affiliation is central, but comparable workflow-integration evidence was unavailable.
        - label: Manual or internal stack
          x: 1
          'y': 5
          detail: The advisor remains central while combining separate CRM, supplier, and payment processes.
        - label: Autonomous AI booking agents
          x: 4
          'y': 1
          detail: The intended model plans and books without a human advisor, but current performance was not benchmarked.
    approximationNotes: >-
      Scores are analyst-authored ordinal positions, not measured market benchmarks. They encode only the capability
      patterns supported by retained evidence; unknown dimensions were not converted into false precision.
    claimRefs:
      - CP005
      - CP010
      - CP013
      - CP016
