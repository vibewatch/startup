  - id: FE001
    title: Fora product architecture map
    type: stack
    summary: >-
      Fora layers supplier connectivity, advisor commerce workflows, operations, and AI assistance around a human
      advisor relationship.
    data:
      layers:
        - label: Inventory and distribution
          detail: Supplier and booking access spans travel inventory, GDS content, and partner deals.
          modules:
            - Hotel, cruise, and tour inventory
            - GDS and partner connectivity
        - label: Advisor commerce
          detail: The Portal supports research, quotes, booking, itinerary creation, and rate monitoring.
          modules:
            - Search and book
            - Itinerary and proposal builder
        - label: Operating infrastructure
          detail: Payments, card storage, commission, invoicing, intake, and CRM functions support the workflow.
          modules:
            - Payments and card vault
            - Commissions and client management
        - label: Client experience
          detail: >-
            Bookable quotes, branded links, mobile-friendly itineraries, and traveler support carry the workflow to the
            client.
          modules:
            - Bookable quotes and branded links
            - Traveler support and changes
        - label: AI augmentation
          detail: Sidekick and Via assist with research, supplier knowledge, itinerary, proposal, and administrative tasks.
          modules:
            - Sidekick / Via
            - Human-in-the-loop review
        - label: Trust and operations
          detail: Human advisor judgment and HQ support remain the control layer described around the automation.
          modules:
            - Advisor accountability
            - Operational escalation
    approximationNotes: >-
      This is a disclosed operating-model synthesis, not a verified systems diagram; interfaces, hosting, controls, and
      data flows are not public in the assigned evidence.
    claimRefs:
      - CE005
      - CE007
      - CE009
      - CE011
  - id: FU001
    title: Advisor-to-traveler customer journey
    summary: >-
      Fora's observable customer journey runs from advisor recruitment and enablement through supplier booking and
      traveler service, with retention and expansion only partly disclosed.
    type: journey-map
    data:
      nodes:
        - id: recruit
          label: Advisor recruitment
          title: New advisor enters the network
          touchpoints:
            - Application and vetting
            - Membership access
          note: >-
            Public evidence says no prior travel-advising experience is required, but selection criteria and conversion
            are not disclosed.
        - id: enable
          label: Enablement
          title: Training, accreditation, and tools
          touchpoints:
            - Live training
            - Supplier access
            - Booking and CRM tooling
          note: >-
            More than 80 hours of live training per month was reported; training completion and time-to-first-booking
            are not public.
        - id: acquire
          label: Client acquisition
          title: Advisor brings traveler demand
          touchpoints:
            - Personal network
            - Content and referrals
            - Advisor judgment
          note: Sources indicate advisors are responsible for generating demand; Fora does not disclose lead volume.
        - id: book
          label: Booking
          title: Supplier booking and commission event
          touchpoints:
            - Hotels, cruises, and tours
            - Supplier commission
            - Fora-advisor split
          note: Booking volume is public, but net revenue, cancellations, and per-advisor distribution are not.
        - id: service
          label: Service
          title: Advisor supports the traveler
          touchpoints:
            - Itinerary and recommendations
            - Disruption handling
            - Repeat relationship
          note: >-
            Human support is positioned as valuable during travel problems; service workload and SLA data are not
            public.
        - id: expand
          label: Expansion
          title: Repeat trips and higher advisor productivity
          touchpoints:
            - Repeat clients
            - Higher booking tiers
            - More bookings per advisor
          note: >-
            Fora says it monitors clients and booking value per client and trip, but does not publish cohort retention
            or expansion rates.
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU011
      - CU013
      - CU014
      - CU015
