      - number: '1.3'
        title: Capital, valuation, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Bloomberg, PAX, and Travel Weekly reported that Fora raised $60 million in a July 2026 Series D at a $1
              billion valuation. PAX described the valuation as post-money and reported total funding of $138.5 million.
              Forerunner and Tactile Ventures led the round, with existing and new investors also participating. The
              financing validates access to institutional capital, but funding raised is not cash available: no current
              cash balance, debt schedule, runway, preference stack, dilution history, or security terms are public in
              the assigned evidence. Likewise, more than $3 billion in cumulative bookings is a gross transaction-volume
              measure. It should not be treated as revenue. The evidence base therefore supports scale and fundraising
              momentum but not a revenue-based underwriting of the unicorn valuation.
