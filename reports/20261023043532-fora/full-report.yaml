              - CO013
      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Public sources identify Henley Vazquez, Evan Frank, and Jake Peters as Fora's co-founders. Peters is
              specifically identified as chief product and technology officer, while Frank is quoted on the advisor
              infrastructure and Vazquez supplies many of the operating scale disclosures in trade reporting. This
              establishes founder coverage across product, technology, company narrative, and travel distribution, but
              the evidence does not provide a complete executive roster, current board membership, committee structure,
              succession plan, or key-person protections. The founders remain central to product and fundraising
              communications. Fora's August 2025 acquisition of AI-focused data platform Legends added product
              capability, but the assigned evidence does not disclose integration milestones, acquisition economics, or
              whether the transaction materially reduced founder dependence.
            claimRefs:
              - CO004
              - CO005
              - CO015
