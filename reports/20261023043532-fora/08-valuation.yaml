schemaVersion: "report-v2"
artifact: valuation
slug: fora
runDate: 2026-10-23
company:
  name: Fora
chapter:
  number: 8
  title: Valuation
  summary: "Fora has achieved a reported $1 billion post-money valuation alongside accelerating booking volume and a $60 million Series D, but public evidence does not disclose revenue, margins, retention, or preference-stack economics. The resulting call is research-more: the operating trajectory is credible, while entry price and downside protection remain difficult to underwrite."
sections:
  - id: price-and-proof
    title: Price, financing and operating proof
    body: >-
      The strongest public price anchor is Fora's July 16, 2026 Series D: Forge reports
      $59.41 million raised at a $1 billion post-money valuation, while Bloomberg reports
      $60 million at the same valuation. Forge also shows a $33.16 per-share price and
      first liquidation-preference order, but explicitly says its post-money valuation is
      estimated from company-submitted incorporation certificates and that its private
      company data is not independently audited. Skift reports roughly $2.3 billion of
      cumulative sales and 15,000 advisors making at least one booking in February, while
      Bloomberg's funding report describes the financing as supporting AI tools. These are
      meaningful scale signals, but bookings are not revenue and no public source here
      supplies a revenue, gross-margin, cash-burn, or cohort denominator.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: scenarios-and-comparables
    title: Scenario underwriting and comparables
    body: >-
      A defensible valuation method must separate the reported financing mark from an
      investable return case. Fora's model appears to combine advisor subscriptions,
      supplier commissions, booking infrastructure and AI-enabled workflow, but the public
      record does not establish the mix or contribution margin. A Reddit advisor account
      describes a 70/30 commission split and a limited booking engine, useful as a
      practitioner signal but not a company-wide metric. The closest public comparator in
      this pool is not a direct multiple: Booking Holdings had a $124.83 billion market
      capitalization in October 2026, while Navan's 2025 IPO was reported at $6.2 billion
      after a $923 million offering. Those scale and liquidity differences make them
      context, not a mechanically transferable multiple. Bull, base and bear cases
      therefore use probability signals and diligence gates rather than false precision.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002, TV003]
  - id: decision-and-diligence
    title: Decision, downside and exit readiness
    body: >-
      The evidence supports a differentiated platform thesis: Fora is building an
      advisor-centered distribution and workflow layer, and PhocusWire reports that its
      acquisition of Legends will integrate predictive consumer-data technology into
      advisor and supplier products. The anti-thesis is equally material: valuation rests
      on a private financing mark, the Forge page says price is not available, and the
      sources do not disclose revenue quality, gross margin, retention, concentration,
      runway, dilution or preference overhang beyond the reported first-order 1.0x
      non-participating preference. Travel Trends describes product depth, but its
      $1.5 billion annual-sales reference is not reconciled to Skift's $2.3 billion
      cumulative-sales figure or to revenue. A separate startup profile asserts broad
      supplier inventory, but that claim lacks primary corroboration and is not valuation
      support. A research-more recommendation is therefore price-sensitive: it could
      improve with verified revenue and margin data, or worsen after a down-round, weak
      cohorts, or unfavorable preference terms.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: Research-more at the reported $1 billion post-money valuation; do not underwrite a buy without verified revenue, margin, cohort and capitalization data.
    claimRefs: [CV002, CV013, CV015]
  - calloutType: risk
    title: Thesis-break trigger
    body: A down-round, material advisor concentration, or evidence that booking growth does not convert into durable contribution profit would break the current underwriting case.
    claimRefs: [CV006, CV013, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Require operating and capitalization diligence before investing."]
      - [Confidence, medium, "Public financing and scale evidence is meaningful, but core economics remain private."]
      - [Risk rating, high, "Private valuation, opaque margins, concentration and preference terms create downside uncertainty."]
      - [Valuation stance, stretched, "A $1 billion mark is not supported by a public revenue or margin denominator."]
    notes: >-
      Assessments synthesize assigned public sources; valuation is a reported post-money
      financing mark, not an independently verified fair value, and unavailable metrics are
      not treated as zero.
    claimRefs: [CV002, CV003, CV013, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Accelerating distribution, "Skift reports $2.3B cumulative sales and 15,000 advisors making at least one booking in February.", "Verify booking-to-revenue conversion and repeat cohorts."]
      - [AI and workflow differentiation, "Bloomberg links the financing to AI tools; PhocusWire reports Legends integration.", "Show adoption, time saved, margin impact and retention."]
      - [Private-market price support, "Forge reports $1B post-money and $33.16 per share in Series D.", "Obtain cap table, preferences, latest secondary data and audited support."]
      - [Distribution economics and service burden, "A Reddit contributor reports a 70/30 commission split and describes meaningful advisor servicing work.", "Verify take rate, support cost, advisor productivity and concentration with company data."]
    notes: >-
      Evidence mixes reported company-scale metrics, independent reporting and a
      practitioner account; each row states a diligence test rather than implying causal
      proof from a single source.
    claimRefs: [CV002, CV003, CV004, CV006, CV011, CV013, CV016]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Key risk]
    rows:
      - [Bull, "Booking growth converts into disclosed recurring and commission revenue; AI improves advisor productivity; retention is strong.", "A verified earnings denominator could justify the financing mark or better.", "Low-to-medium until financials are shared.", "AI adoption or supplier economics fail to scale."]
      - [Base, "Advisor and booking growth continue, but margins, mix and cohorts remain partly opaque.", "Treat $1B as an unverified reference mark and require a discount or stronger terms.", "Medium.", "Private mark lacks liquidity and return visibility."]
      - [Bear, "Bookings decelerate, advisors are concentrated, or a down-round exposes weak economics.", "Capital impairment and dilution risk rise; wait for a reset.", "Material downside signal.", "Preference stack, runway and retention remain unknown."]
      - [Diligence gate, "Obtain revenue by stream, gross/contribution margin, cohort retention, cap table and preference schedule.", "No price target until inputs are verified.", "Required before an investable call.", "Missing data itself prevents precision."]
    notes: >-
      Scenarios are qualitative because assigned sources do not provide a consistent
      revenue, margin or cash-flow denominator; the $1B figure is a reported post-money
      valuation, not a modeled intrinsic value.
    claimRefs: [CV002, CV006, CV009, CV013, CV014, CV015]
