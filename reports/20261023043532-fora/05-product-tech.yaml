    title: Product module / asset matrix
    columns: [Module or asset, User, Status or maturity, Differentiation, Diligence gap]
    rows:
      - [Advisor Portal, "Travel advisors", "Live platform surface described in public materials", "Combines booking, training, client tools, and community", "Obtain active-user adoption and workflow-completion metrics"]
      - [Booking platform, "Travel advisors", "Live; inventory and integrations continue to expand", "Search-to-confirmation workflow with quotes and supplier access", "Measure coverage, failed bookings, latency, and third-party dependencies"]
      - [Client intake and proposals, "Advisors and travelers", "Live capabilities described; depth not independently benchmarked", "Bookable quotes, branded links, and itinerary builder", "Validate conversion, edit rates, and client-facing error controls"]
      - ["Payments, commission, and card vault", "Advisors and operations teams", "Operational capability described", "Integrated payment and commission infrastructure", "Review PCI scope, reconciliation controls, and exception handling"]
    notes: "Sources are a mixed public product profile, practitioner discussion, and company-interview coverage; maturity labels are not an independent product audit."
    claimRefs: [CE001, CE003, CE005, CE013]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Fora solution, Measurable benefit, Limitation]
    rows:
      - ["Research a trip", "Advisor searches supplier and destination information", "Portal inventory plus Sidekick/Via assistance", "Less manual research time is the stated objective", "No public time-saved or accuracy denominator"]
      - ["Create a proposal", "Advisor assembles rates, text, and itinerary content", "Bookable quotes and itinerary/proposal tooling", "Faster client-ready presentation is described", "No public proposal-to-booking conversion"]
      - ["Manage a booking", "Advisor tracks payment, rates, commissions, and changes", "Payment vault, commission tooling, monitoring, and rebooking", "Centralizes operational work", "No public failure or recovery statistics"]
      - ["Support a traveler", "Advisor handles changes and special requests", "Advisor remains the human service layer", "Preserves personalization and accountability", "Availability, escalation, and service-level controls are undisclosed"]
    notes: "Benefits are described or implied by the cited sources; unavailable quantitative outcomes remain qualitative rather than estimated."
    claimRefs: [CE002, CE004, CE006, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Inventory and supplier connectivity", "Expose hotels, cruises, tours, preferred rates, and partner information", "Supplier relationships, GDS, and inventory providers", "Coverage gaps, stale rates, and upstream schema changes"]
      - ["Advisor commerce workflow", "Search, quote, itinerary, booking, payment, and commission operations", "Portal services and advisor-entered client data", "Booking errors, reconciliation exceptions, and fragmented off-platform work"]
      - ["AI augmentation", "Search internal knowledge, reformat GDS text, draft itineraries and proposals", "Fora content corpus, model provider, prompts, and human review", "Hallucination, privacy leakage, incorrect supplier or rate information"]
      - ["Trust and support operations", "Handle client changes, support, and operational exceptions", "HQ staff, advisor judgment, and supplier escalation paths", "Unclear uptime, recovery, security certification, and incident controls"]
    notes: "The layer map synthesizes disclosed capabilities and explicitly retains unverified dependencies and controls as risks."
    claimRefs: [CE007, CE008, CE009, CE015]
