    title: Fora product architecture map
    type: stack
    summary: "Fora layers supplier connectivity, advisor commerce workflows, operations, and AI assistance around a human advisor relationship."
    data:
      layers:
        - label: Inventory and distribution
          detail: "Supplier and booking access spans travel inventory, GDS content, and partner deals."
          modules: ["Hotel, cruise, and tour inventory", "GDS and partner connectivity"]
        - label: Advisor commerce
          detail: "The Portal supports research, quotes, booking, itinerary creation, and rate monitoring."
          modules: ["Search and book", "Itinerary and proposal builder"]
        - label: Operating infrastructure
          detail: "Payments, card storage, commission, invoicing, intake, and CRM functions support the workflow."
          modules: ["Payments and card vault", "Commissions and client management"]
        - label: Client experience
          detail: "Bookable quotes, branded links, mobile-friendly itineraries, and traveler support carry the workflow to the client."
          modules: ["Bookable quotes and branded links", "Traveler support and changes"]
        - label: AI augmentation
          detail: "Sidekick and Via assist with research, supplier knowledge, itinerary, proposal, and administrative tasks."
          modules: ["Sidekick / Via", "Human-in-the-loop review"]
        - label: Trust and operations
          detail: "Human advisor judgment and HQ support remain the control layer described around the automation."
          modules: ["Advisor accountability", "Operational escalation"]
    approximationNotes: "This is a disclosed operating-model synthesis, not a verified systems diagram; interfaces, hosting, controls, and data flows are not public in the assigned evidence."
    claimRefs: [CE005, CE007, CE009, CE011]
callouts:
  - calloutType: strength
    title: Workflow-context advantage
    body: "Fora's most credible product advantage is the combination of advisor distribution, booking operations, and contextual AI embedded in the same workflow, rather than a demonstrated foundation-model moat."
    claimRefs: [CE001, CE009, CE012]
  - calloutType: risk
    title: Control depth is unproven
    body: "The assigned evidence does not verify security certifications, reliability metrics, AI evaluation, or supplier-integration resilience; these should be gating diligence requests before relying on technical differentiation."
    claimRefs: [CE013, CE015]
