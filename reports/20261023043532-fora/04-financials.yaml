    title: Demonstrated network and booking momentum
    body: "Public reporting supports rapid growth in cumulative travel booked and a large advisor network, providing evidence of distribution activity even though the monetization conversion remains undisclosed."
    claimRefs: [CI003, CI005, CI013]
  - calloutType: risk
    title: Capital adequacy cannot be underwritten publicly
    body: "The financing amount and stated uses are public, but cash, burn, debt, runway, margin, and cohort economics are not, so the next-round dependency is unresolved."
    claimRefs: [CI010, CI011, CI012, CI014]
