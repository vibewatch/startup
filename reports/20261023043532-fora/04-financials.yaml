    title: Revenue streams
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Advisor access fee, "Advisor pays for platform and host-agency access", "USD per advisor", "$299 annually or $99 quarterly reported by Forbes", "Company-model description reported by independent coverage; realized collection and mix unknown", "Monthly billings, churn, discounts, refunds, and deferred-revenue policy"]
      - [Retained supplier commissions, "Fora retains a share of commissions generated by advisor bookings", "% of supplier commission", "10%-30% depending on production reported by Forbes", "Publicly described range; not a realized blended rate", "Supplier contracts, net/gross recognition, clawbacks, and payment lag"]
      - [Travel transaction volume, "Advisors book travel through the network and supplier relationships", "Gross travel booked", "More than $3 billion cumulatively since launch", "Company claim reported by TechCrunch; not revenue or cash", "Booking ledger, cancellations, refunds, and reconciliation to recognized revenue"]
      - [Supplier distribution value, "Network is marketed as a customer-acquisition channel for suppliers", "Supplier acquisition cost", "Fora claims lower cost than other channels; no public methodology", "Unsubstantiated company claim reported by Forbes", "Supplier-level CAC comparison, attribution method, and contract terms"]
    notes: "Public sources mix company claims, reported pricing, gross booking volume, and an unsubstantiated acquisition-cost comparison; none establishes Fora's recognized revenue mix."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization
    columns: [Price or contract, Basis, List vs realized, Discount or unknown, Implication]
    rows:
      - ["$299 annual fee", "Advisor access", "Reported list price", "Realized collection, discounts, and churn unknown", "Potential recurring access revenue but insufficient for ARR calculation"]
      - ["$99 quarterly fee", "Advisor access", "Reported list price", "Annualized equivalence is not evidence of mix or retention", "Requires cohort and billing data"]
      - ["10%-30% retained commission share", "Supplier commissions by advisor production", "Reported contractual range", "Blended take rate and supplier-specific exceptions unknown", "Transaction yield cannot be inferred from gross bookings"]
      - ["70/30 advisor split", "Commission sharing", "Anecdotal advisor discussion", "May vary by plan, category, or current terms", "Use only as a diligence lead, not as a companywide assumption"]
    notes: "Pricing and split figures are not interchangeable with realized revenue, ARR, gross margin, or cash generation; the 70/30 split is anecdotal user-generated evidence."
    claimRefs: [CI002, CI006, CI007]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Cumulative gross travel booked, "$3B+", "Medium", "Indicates network activity but not recognized revenue", "Reconcile bookings to commission and fee revenue by month"]
      - [Active advisors, "15,000+", "Medium", "Potential monetizable network scale", "Define active, cohort retention, production distribution, and concentration"]
      - [Top-advisor concentration, "$200M+ from top 100 in 2025", "Medium", "May indicate material volume concentration", "Obtain full advisor deciles, repeat rates, and churn"]
      - [Advisor acquisition cost, null, "Unavailable", "Determines whether network growth is economically scalable", "Paid and organic acquisition spend with cohort payback"]
      - [Advisor contribution margin, null, "Unavailable", "Tests whether service and support costs are covered", "Revenue, commissions, support labor, insurance, and payment costs per cohort"]
      - [Gross margin, null, "Unavailable", "Required to assess software versus agency economics", "Audited gross-margin bridge by revenue stream"]
      - [Operating staff, "200; around half engineers", "Medium", "Shows a substantial technology payroll within the service model", "Payroll, contractor, support, and infrastructure cost by function"]
      - [Planned engineering hiring, "55 engineers", "Medium", "Adds execution capacity but increases forward fixed cost", "Approved hiring plan, fully loaded cost, timing, and productivity milestones"]
      - [Cash balance and runway, null, "Unavailable", "Determines financing dependency after Series D", "Latest cash, burn, debt, commitments, and board plan"]
      - [Net revenue retention, null, "Unavailable", "Tests repeat and expansion quality", "Advisor and supplier cohort retention and expansion definitions"]
    notes: "Null values denote unavailable public evidence, not zero. The top-100 and booking figures are reported company metrics; all unreported economics require primary diligence."
    claimRefs: [CI003, CI005, CI008, CI010, CI011, CI012, CI013, CI014]
