  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: "Monthly recognized revenue by advisor fees, retained commissions, and any enterprise or supplier revenue, reconciled to bookings."
      whyItMatters: "Without revenue and recognition data, gross booking volume cannot support a valuation multiple or establish recurring-revenue quality."
      diligencePath: "Obtain the latest twelve months of monthly management accounts, revenue-recognition policy, booking reconciliation, refunds, and deferred-revenue schedule."
      relatedQuestionRefs: [QI001, QI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "Advisor and client acquisition cost, retention, production concentration, contribution margin, and support cost by cohort."
      whyItMatters: "A large advisor network may still be uneconomic if acquisition, service, commission, or churn costs consume the platform's fees and retained commissions."
      diligencePath: "Request cohort-level CAC, payback, churn, booking frequency, gross-to-net commission, support hours, and contribution-margin reporting."
      relatedQuestionRefs: [QI004, QI005, QI007]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current cash, monthly burn, debt and commitments, runway, and board-approved use-of-funds plan after the Series D."
      whyItMatters: "The financing amount alone does not show whether Fora can reach operating breakeven or will require another round before the plan is complete."
      diligencePath: "Obtain the latest balance sheet, thirteen-week cash forecast, debt schedule, cap table, hiring plan, and financing-case sensitivities."
      relatedQuestionRefs: [QI006, QI007]
    - type: conflicting-data
      severity: material
      topic: gross-travel-booked
