company:
  name: Fora
chapter:
  number: 1
  title: Company Overview
  summary: Fora is a New York-based travel-advisor platform founded in 2021 that pairs independent advisors with booking, training, supplier, and AI-enabled workflow infrastructure. Public evidence supports rapid booking and advisor growth plus a $1 billion valuation after a $60 million Series D, but revenue, margins, governance, ownership, and cohort quality remain undisclosed.
sections:
  - id: identity-and-model
    title: Identity, model, and operating footprint
    body: >-
      Fora is a New York-based platform for independent travel advisors, founded in 2021.
      Its proposition is neither a conventional online travel agency nor pure software:
      advisors retain the traveler relationship while Fora supplies training, supplier
      access, booking workflows, payment infrastructure, community, and AI-enabled tools.
      Independent company profiles and an executive interview consistently describe this
      human-plus-technology model, although they do not independently audit platform
      performance. Public scale indicators are substantial. July 2026 reporting cited more
      than 15,000 active advisors and more than $3 billion of lifetime travel bookings, while
      an April Skift interview cited 200 employees, about half engineers. These measures
      describe network activity and organizational investment; they are not Fora revenue,
      ARR, cash, or profitability.
    claimRefs: [CO001, CO002, CO003, CO009, CO011, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and key-person dependence
    body: >-
      Public sources identify Henley Vazquez, Evan Frank, and Jake Peters as Fora's
      co-founders. Peters is specifically identified as chief product and technology officer,
      while Frank is quoted on the advisor infrastructure and Vazquez supplies many of the
      operating scale disclosures in trade reporting. This establishes founder coverage
      across product, technology, company narrative, and travel distribution, but the
      evidence does not provide a complete executive roster, current board membership,
      committee structure, succession plan, or key-person protections. The founders remain
      central to product and fundraising communications. Fora's August 2025 acquisition of
      AI-focused data platform Legends added product capability, but the assigned evidence
      does not disclose integration milestones, acquisition economics, or whether the
      transaction materially reduced founder dependence.
    claimRefs: [CO004, CO005, CO015]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital, valuation, and scale signals
    body: >-
      Bloomberg, PAX, and Travel Weekly reported that Fora raised $60 million in a July 2026
      Series D at a $1 billion valuation. PAX described the valuation as post-money and
      reported total funding of $138.5 million. Forerunner and Tactile Ventures led the round,
      with existing and new investors also participating. The financing validates access to
      institutional capital, but funding raised is not cash available: no current cash
      balance, debt schedule, runway, preference stack, dilution history, or security terms
      are public in the assigned evidence. Likewise, more than $3 billion in cumulative
      bookings is a gross transaction-volume measure. It should not be treated as revenue.
      The evidence base therefore supports scale and fundraising momentum but not a
      revenue-based underwriting of the unicorn valuation.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: milestones-and-diligence-gaps
    title: Milestones, operating risks, and unresolved evidence
    body: >-
      The dated record shows a rapid progression: founding in 2021, the Legends acquisition
      in 2025, increasingly visible advisor and booking scale in early 2026, and the Series D
      in July 2026. The company says the first $1 billion of bookings took about three years,
      the second took eight months, and the third took five months. That acceleration is
      encouraging but remains company-reported and lacks advisor-cohort, traveler-repeat,
      take-rate, or supplier-concentration denominators. A Reddit discussion supplies an
      adverse, anecdotal counterweight: one contributor described a barebones CRM and a
      70/30 commission split. The thread is not a representative survey, so it identifies
      diligence questions rather than proving broad dissatisfaction. Regulatory history,
      complaints, outages, and legal exposure also remain under-evidenced in this allocation.
    claimRefs: [CO010, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Scale signals are visible
    body: >-
      Multiple current reports support the financing and advisor-scale milestones, while
      company-attributed disclosures show accelerating cumulative booking volume.
    claimRefs: [CO006, CO009, CO010, CO011]
  - calloutType: risk
    title: Economic quality remains opaque
    body: >-
      Public booking, advisor, staffing, and funding figures do not reveal revenue, margins,
      retention, concentration, ownership, or current liquidity.
    claimRefs: [CO006, CO009, CO011, CO013]
