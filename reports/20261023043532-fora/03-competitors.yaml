  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-benchmarking
      missingEvidence: >-
        Comparable peer funding, advisor counts, booking volume, retention, product adoption,
        customer mix, and strategic-roadmap data for material host agencies and networks.
      whyItMatters: >-
        Fora's scale and differentiation cannot be ranked rigorously when most peer denominators
        and contract terms are absent.
      diligencePath: >-
        Obtain current peer contracts and product demos, interview advisors who switched among
        host agencies, and source audited or lender-verified operating metrics where available.
      relatedQuestionRefs: [QP002]
      relatedTableRefs: [TP001]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-switching
      missingEvidence: >-
        Current official Fora advisor fees, commission schedules, realized supplier economics,
        migration friction, and directly comparable host-agency contract terms.
      whyItMatters: >-
        Anecdotal and list-price evidence cannot establish net advisor economics, switching cost,
        or a durable pricing advantage.
      diligencePath: >-
        Review Fora's current advisor agreement, anonymized commission statements, supplier
        contracts, and churn interviews alongside at least three peer host-agency agreements.
      relatedQuestionRefs: [QP004, QP006]
      relatedTableRefs: [TP003]
