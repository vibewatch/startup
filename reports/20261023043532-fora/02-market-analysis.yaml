    notes: "Values preserve each publisher's metric, period, population, and uncertainty; no CAGR, market share, SAM, SOM, or revenue conversion is derived."
    claimRefs: [CM004, CM005, CM006, CM008, CM010]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger, Key constraint]
    rows:
      - ["Independent or aspiring advisor", "Advisor", "Advisor", "Advisor business", "Learn, research, quote, book, and service trips", "Lower administrative burden and supplier access", "Membership cost, commission share, and uncertain lead flow"]
      - ["Experienced advisor business", "Advisor or small agency", "Advisor and support staff", "Advisor business", "Manage clients, complex trips, commissions, and repeat travel", "Faster workflow and broader inventory", "Switching cost, data migration, and service reliability"]
      - ["Traveler", "Traveler or household", "Traveler", "Trip budget", "Discovery, itinerary, booking, changes, and support", "Trust, curation, perks, and accountability", "Direct-booking convenience and price transparency"]
      - ["Travel supplier", "Distribution or partnership team", "Sales and account teams", "Commission and marketing budget", "Reach advisor demand and attribute bookings", "Incremental and targeted distribution", "Integration cost and channel conflict"]
      - ["Fora platform operator", "Fora", "Advisors and operating teams", "Platform operating budget", "Recruit, train, support, and retain advisors", "Network growth and workflow data", "Compliance, support cost, and advisor concentration"]
    notes: "Operating segmentation is inferred from retained evidence; segment budgets, conversion, retention, and unit economics are not publicly disclosed."
    claimRefs: [CM002, CM003, CM012, CM013, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Addressability evidence stack, not a TAM/SAM/SOM funnel
    type: pyramid
    summary: "Ordered layers move from broad travel context to narrower Fora operating indicators while preserving incompatible units and periods."
    data:
      nodes:
        - label: "Global travel-spend envelope"
          value: ">$11T"
          unit: "USD, 2026 estimate"
          note: "Broad context; includes spend outside advisor distribution"
        - label: "Fora sales since founding"
          value: "$2.3B"
          unit: "USD, reported April 2026"
          note: "Five-year company-scale lens; not recognized revenue"
        - label: "Fora annual sales"
          value: "$1.5B"
          unit: "USD, January 2026 episode"
          note: "Company-derived interview introduction; definition unaudited"
        - label: "Active-booking advisors"
          value: "15,000"
          unit: "advisors, February 2026"
          note: "At least one booking; retention and productivity undisclosed"
        - label: "Advisor community"
          value: "11,000"
          unit: "advisors, January 2026 episode"
          note: "Different population and date from active-booking count"
        - label: "Bookable inventory"
          value: ">180,000"
          unit: "hotels, cruises, and tours"
          note: "Undated profile; breadth is not demand"
    approximationNotes: "The six layers use incompatible units, periods, and populations. Order reflects analytical narrowing only; widths are not proportional, and no conversion rate or market share is inferred."
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM011]
callouts:
  - calloutType: insight
    title: Scale evidence is not addressability
    body: "Reported sales, advisor counts, supplier counts, and inventory breadth indicate operating reach but cannot be converted into revenue, market share, SAM, or SOM without consistent definitions and private unit economics."
    claimRefs: [CM005, CM006, CM008, CM009, CM010, CM011]
  - calloutType: risk
    title: Workflow value must survive real-world servicing
    body: "The platform must combine AI efficiency with complete inventory, timely advisor support, supplier integration, and compliant data use; broad travel growth does not prove those operating requirements."
    claimRefs: [CM013, CM014, CM015, CM016]
