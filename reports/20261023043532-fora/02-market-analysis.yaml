      - ["Travel Trends Podcast", "Episode published January 2026", "Fora network", "$1.5 billion", "Annual sales", "Host introduction to founder interview", "Low", "Company-derived metric with no audited definition"]
      - ["Skift", "February 2026", "93 countries and every U.S. state", "15,000", "Advisors with at least one booking", "Founder figure reported by Skift", "Medium", "Activity threshold does not reveal retention or productivity"]
      - ["Travel Trends Podcast", "Episode published January 2026", "Fora network", "11,000", "Advisor community", "Host introduction to founder interview", "Low", "Community membership differs from active-booking advisors"]
