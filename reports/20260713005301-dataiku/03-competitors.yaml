    {
      "id": "capability-and-packaging-comparison",
      "title": "Capability and packaging comparison",
      "body": "The public packaging surfaces show a clear divide. Hyperscaler-native options expose granular usage pricing, while Dataiku and most specialist peers still sell an enterprise contract and architecture decision rather than a simple list-price SKU. Dataiku's archived plans page shows exactly how it historically framed the product: broader connector depth, automation, and governed deployment capabilities unlocked as teams move from free or small-team use into enterprise-scale adoption. Databricks is somewhat more transparent because it publishes a price list for SKU groups, but even there the buyer still has to map usage onto cloud-specific services and discounts. AWS, Azure, and Vertex AI make metered economics explicit, which helps comparison at the feature level but also shifts cost risk toward architecture and runtime choices. DataRobot, H2O.ai, and Alteryx stay closer to demo-led or contact-sales motions, which is typical for enterprise software but makes apples-to-apples TCO comparisons difficult from public information alone.",
