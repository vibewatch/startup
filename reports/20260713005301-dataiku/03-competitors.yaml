    {
      "id": "moat-durability-and-adverse-readthroughs",
      "title": "Moat durability and adverse readthroughs",
      "body": "The adverse evidence does not say Dataiku is weak; it says the category is unforgiving when a standalone AI platform loses differentiation against bundled infrastructure or a broader system of record. Databricks is the highest-severity threat because it is scaling faster, is far better capitalized, and keeps widening from data infrastructure into governance, AI agents, and application surfaces. The hyperscalers are the second structural threat because they can make native tooling feel ‘free enough’ inside a cloud commitment. DataRobot offers the clearest warning case: a once-hot standalone AI company can lose strategic relevance quickly when native cloud tools and paradigm shifts change what buyers care about. H2O.ai and Alteryx show that adjacencies remain valuable, but also that not every adjacent category earns AI-platform multiples. Dataiku's best defense is to keep being the neutral, governed workflow layer in accounts that will remain multi-cloud and multi-tool even as native AI features improve.",
      "claimRefs": [
