  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Dataiku is a French-founded, New York-headquartered enterprise AI platform company that reported $300M+ ARR in January 2025 and $350M+ ARR by October 2025 while serving 750+ organizations globally. Public evidence supports a last disclosed $3.7B valuation from the December 2022 Series F, a deep enterprise partner ecosystem, and concrete IPO preparation in late 2025, but not a completed listing or current 2026 financial disclosure."
  },
  "sections": [
    {
      "id": "identity-and-platform",
      "title": "Identity, headquarters, and what Dataiku actually sells",
      "body": "Dataiku is a late-stage private enterprise software company founded in 2013 and now headquartered in New York, even though its roots and founding team are unmistakably French. The company still describes itself through the same core idea that powered its early growth: turning data and AI into an everyday operating capability rather than a specialist project. In 2026 its own language has shifted from the older \"Everyday AI\" framing toward \"The Platform for AI Success,\" but the operating proposition is consistent \u2014 one control plane where business users, analysts, data scientists, engineers, and risk owners can build analytics, machine learning, and AI-agent workflows together. That positioning matters because Dataiku is not selling a single-model tool or a point AutoML product; it is selling orchestration, governance, and multi-user collaboration on top of customer data stacks. Archived plans pages and current partner materials show three durable deployment paths: hosted SaaS, customer-managed cloud, and on-prem/private-cloud installation. That deployment flexibility, plus no-, low-, and full-code workflows, is central to the company's value proposition and also explains why buyers tend to be large enterprises with heterogeneous infrastructure rather than SMBs looking for one-click AI.",
