    {
      "id": "founders-leadership-governance",
      "title": "Founders, leadership bench, and governance signals",
      "body": "The public leadership picture is strongest around the founding core and the newer go-to-market bench. Florian Douetteau remains the clear key person as co-founder and CEO, while Cl\u00e9ment Stenac remains the technical anchor as co-founder and CTO. Public founder references consistently list Thomas Cabrol and Marc Batty alongside them, but their current operating roles are much less visible than Douetteau and Stenac, which is typical for a mature private company but still leaves governance detail thinner than a public-market investor would want. The most relevant 2026 management event is the June hiring of Maxwell Long as President and CRO. That move reads as classic late-stage scaling behavior: Long was hired specifically to run global sales, customer success, and partnership teams after helping Smartsheet scale past $1 billion ARR and into an $8.4 billion exit. Combined with the 2025 addition of a high-profile CMO and the continued emphasis on partners, the leadership pattern is consistent with a company professionalizing its commercial engine ahead of a potential liquidity event. What remains under-disclosed is board composition, independence, and the precise division of authority among late-stage investors and operators.",
