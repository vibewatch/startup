  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——Dataiku 实际参与的位置
        blocks:
          - type: paragraph
            body: >-
              定义 Dataiku 市场，最清楚的方式不是把所有 AI 软件都算进去，甚至也不是把所有机器学习都算进去。Dataiku 位于受治理的企业 AI 编排层：这类软件让组织准备数据、开发分析和模型、把 AI
              工作流投入运营，并越来越多地跨团队和基础设施管理基于代理的系统。因此，相关市场包括传统数据科学与机器学习平台、MLOps 工具、AI
              治理软件，以及新兴企业代理平台栈的一部分。它不包括原始云基础设施、对独立基础模型供应商的商品化 API 调用，也不包括不需要工作流编排、多人治理或部署管理的轻量单点 copilot
              工具。这个区分很重要，因为最宽口径的市场研究会给出巨大的 TAM，但其中包含 Dataiku 不直接变现的区域。现实替代集合也很混杂：超大规模云厂商捆绑原生工具，Databricks 销售湖仓加 AI
              控制平面的替代方案，DataRobot、H2O.ai、Alteryx 等供应商覆盖相邻的自动化或低代码分析场景。当客户需要一个受治理的运营层，横跨这些碎片化组件，而不是再多一个孤立工具时，Dataiku 才会赢。
