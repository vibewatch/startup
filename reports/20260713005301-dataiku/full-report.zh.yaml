        - label: NRR / GRR / 流失
          values:
            - 否
            - 否
            - 是
            - 否
        - label: 头部客户集中度
          values:
            - 否
            - 否
            - 是
            - 否
        - label: 实施满意度
          values:
            - 部分
            - 部分
            - 是
            - 部分
    approximationNotes: 该矩阵评估证据可见度，不评估表现质量。「独立佐证」指来自非供应商来源的佐证；在留存和集中度上，这类证据有限。
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Dataiku 最高的残余风险，不是单一生死线，而是监管范围、安全补丁执行力、客户与财务不透明叠在一起。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余风险
      rows:
        - label: AI 治理 / 隐私合规
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 重大产品安全问题
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 落地 / 集成摩擦
          values:
            - 中
            - 中高
            - 中
            - 中高
        - label: 合作伙伴 / 生态依赖
          values:
            - 中
            - 中
            - 中低
            - 中
        - label: 客户集中度不透明
          values:
            - Unknown
            - 高
            - 低
            - 高
        - label: IPO / 融资传导
          values:
            - 中
            - 高
            - 中低
            - 高
    approximationNotes: 该热力图是基于公开证据综合出的投资视角，不是管理层发布、带校准概率的风险登记册。
    claimRefs:
      - CR007
      - CR014
      - CR024
      - CR026
      - CR038
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 安全、监管和落地一旦失手，可能先打到信任与扩张，再拖累估值和融资选择权。
    data:
      nodes:
        - id: n1
          label: 安全 / 合规事件
          detail: CVE、隐私事故或 AI 治理失误
        - id: n2
          label: 客户信任流失
          detail: 采购放慢；标杆背书变弱
        - id: n3
          label: 扩张 / 续约压力
          detail: 销售周期拉长、扩张走弱、可能降级
        - id: n4
          label: ARR 质量不确定
          detail: NRR 与利润率不透明，放大下行风险
        - id: n5
          label: IPO / 融资延后
          detail: 公开市场准备度走弱
        - id: n6
          label: 估值压缩
          detail: 倍数下调或持有期拉长
      edges:
        - from: n1
          to: n2
          label: 信任受损
        - from: n2
          to: n3
          label: 商业摩擦
        - from: n3
          to: n4
          label: 收入质量不确定
        - from: n4
          to: n5
          label: 准备度下降
        - from: n5
          to: n6
          label: 退出价值走弱
        - from: n1
          to: n5
          label: 直接审查
    claimRefs:
      - CR024
      - CR025
      - CR026
      - CR030
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Dataiku 的投资逻辑靠云、模型供应商、集成商和旗舰企业客户共同撑着；任一层失效，投资论点都会变弱。
    data:
      nodes:
        - id: d1
          label: 云服务商
          detail: 基础设施与可用性边界
        - id: d2
          label: 第三方 AI 供应商
          detail: 模型访问与数据处理链
        - id: d3
          label: 集成端点
          detail: Snowflake、Azure、ServiceNow、PowerBI 等
        - id: d4
          label: SI / 咨询伙伴
          detail: 转型与实施杠杆
        - id: d5
          label: 旗舰企业客户
          detail: 证明力、ARR 与 IPO 叙事
        - id: d6
          label: Dataiku 平台
          detail: 受治理的 AI、分析与智能体
      edges:
        - from: d1
          to: d6
          label: 托管 / 支撑服务
        - from: d2
          to: d6
          label: 驱动 AI 服务
        - from: d3
          to: d6
          label: 输入工作流
        - from: d4
          to: d6
          label: 实施 / 销售
        - from: d6
          to: d5
          label: 交付价值
        - from: d3
          to: d5
          label: 客户环境依赖
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR034
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议一边来自真实经营规模和客户证据，另一边受经济性缺口与执行风险牵制。
    data:
      nodes:
        - id: a
          label: 规模证明
          detail: $300M+ 后到 $350M+ ARR；客户从 700+ 到 750+
        - id: b
          label: 客户质量
          detail: 蓝筹企业名单与治理驱动用例
        - id: c
          label: 可比公司支撑
          detail: 约 10-12x 的旧私募 ARR 倍数，相比上市可比公司处于中段
        - id: d
          label: 经济性不透明
          detail: NRR、利润率、烧钱速度和集中度仍未披露
        - id: e
          label: 残余风险
          detail: 安全、监管、落地和 IPO 传导风险
        - id: f
          label: 投资建议
          detail: 跟踪，中等置信度，估值公允
      edges:
        - from: a
          to: f
          label: 支撑价值
        - from: b
          to: f
          label: 支撑质量
        - from: c
          to: f
          label: 支撑公允性
        - from: d
          to: f
          label: 压低确信度
        - from: e
          to: f
          label: 限制进攻性
    claimRefs:
      - CV004
      - CV006
      - CV020
      - CV027
      - CV028
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 上市可比公司的市值 / 收入代理倍数显示，Dataiku 的估值判断会随选取的参考组快速变化。
    data:
      items:
        - label: C3.ai
          value: 4.6
        - label: ServiceNow
          value: 8
        - label: Confluent
          value: 9.6
        - label: MongoDB
          value: 11.2
        - label: Dataiku（$3.7B / $350M）
          value: 10.6
        - label: Snowflake
          value: 19.4
        - label: Datadog
          value: 25
        - label: Palantir
          value: 58.2
    approximationNotes: 这些是由公开市值和收入页面推算的市值 / 收入代理倍数，不是按净现金或债务调整后的企业价值倍数。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV020
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间说明，当前估值看起来公允，但谈不上明显便宜。
    data:
      items:
        - label: 悲观
          low: 2.5
          mid: 2.85
          high: 3.2
        - label: 基准
          low: 3.5
          mid: 4
          high: 4.5
        - label: 乐观
          low: 5
          mid: 5.75
          high: 6.5
        - label: 当前披露估值
          low: 3.7
          mid: 3.7
          high: 3.7
    approximationNotes: 区间为作者估算，锚定最近披露估值、当前 ARR 披露和上市可比公司代理倍数。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV031
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式汇报的核心指标。
    data:
      items:
        - label: 建议
          value: Track
          trend: flat
        - label: 总体评分
          value: 7.4/10
          trend: flat
        - label: 估值立场
          value: Fair
          trend: flat
        - label: 当前 ARR 倍数
          value: ~10.6x
          trend: flat
        - label: 风险评级
          value: Medium-high
          trend: down
        - label: 置信度
          value: Medium
          trend: flat
    approximationNotes: KPI 汇总投资建议和估值分析；ARR 倍数使用最近披露的 $3.7B 估值与 2025 年 10 月 ARR 里程碑。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV040
