      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              外部对 Dataiku 实际成本结构的可见度很差，因此本章必须把可观察事实和只能推断的内容分开。可观察的是：Dataiku 2025 年 1 月 ARR 越过 $300M，2025 年 10 月 ARR 越过
              $350M；自 2022 年 Series F 后没有公开宣布新融资；并据报道在 2025 年末准备可能的美国 IPO。Sacra 估计其累计融资约 $846.8M，2025 年 9 月 ARR 约
              $342.5M，整体与公司官方披露吻合。可推断的是：一家以这种规模运营的公司，很可能在企业销售、客户成功、产品开发、云基础设施和合作伙伴赋能上投入很重。但推断不足以支撑承销。公开资料没有现金余额、现金消耗历史、有意义的债务披露、留存指标，也没有直接毛利披露。因此，公平的资本充足性解读应保持谨慎：公开记录中没有任何内容强烈指向困境，但也没有任何内容能让投资人验证现金可支撑时间或融资依赖。IPO
              选择权看起来像战略选择，而不是已被证明的必要性。
