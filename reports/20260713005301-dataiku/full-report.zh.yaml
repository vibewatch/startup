        - 超大云厂商原生 ML 技术栈
        - Microsoft 企业协议杠杆和按量付费选项
        - Azure 优先企业，尤其是既有 Microsoft 体系
        - Azure 体系内的企业 MLOps 与负责任 AI 框架
        - 经济性和路线图仍绑定 Azure 消费选择
      - - Vertex AI / Agent Platform 平台
        - 超大云厂商原生 ML 与智能体技术栈
        - Google 模型、训练与推理价格公开披露
        - 以 GCP 为中心的数据和 GenAI 团队
        - Gemini 原生工具，加上细颗粒度模型运营定价
        - 仍锚定 Google Cloud，而非跨云中立
      - - DataRobot
        - 专精型企业 AI 套件
        - 2024 年收入约 $285M；此前估值峰值 $6.3B
        - 希望不用重建整个平台、优先获得引导式企业 AI 交付的团队
        - 可在 on-prem、VPC 和 SaaS 间选择部署，并主打集成套件
        - 反向证据显示，相比打包平台，品类韧性较弱
      - - H2O.ai
        - 专精型混合 / AutoML 平台
        - 2021 年 $100M Series E 轮，估值 $1.7B；声称覆盖 20,000 家组织
        - 需要开源血统、混合部署和 AutoML 的用户
        - 开源根基和混合云灵活性
        - 已披露资本基础远小于 Databricks 或 Dataiku
      - - Alteryx
        - 相邻的分析自动化替代品
        - 2023 年以 $4.4B 被收购；8,000+ 家客户
        - 商业分析和低代码自动化团队
        - 大众化分析和工作流自动化品牌强
        - 对端到端 ML / 智能体生命周期深度聚焦较少
