        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              正面结论很直接：Dataiku 有真实规模、经常性收入和足够的类别可信度，可以被放在 IPO
              候选公司中讨论，而不是私营实验项目。负面结论同样直接：公开记录仍不足以让人有信心承销利润率路径、现金效率或稀释风险。ARR
              里程碑、客户广度和平台定位都支持它是一家高质量企业软件公司的判断。但缺失字段正是区分「有意思的私营公司」和「可投资公司」的字段：净收入留存、毛利、服务收入占比、CAC
              回收期、销售效率、当前现金、现金消耗和合同积压。上市公司比较只能当护栏。Snowflake 展示强软件经济性可以是什么样；C3.ai 展示执行问题和服务强度如何压缩利润率。Dataiku
              可能位于两者之间，但公开证据无法判断精确位置。因此，正确的承销态度不是看空牵引力，而是对缺失经济性保持纪律。
