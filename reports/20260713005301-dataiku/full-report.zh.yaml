  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的多头逻辑很直接。公司已有真实企业级规模、已披露 ARR 里程碑、蓝筹客户名单、契合当前企业 AI 时点的重治理产品叙事， 以及一个尚未像部分 AI 公司那样明显跑在收入前面的私募估值锚。2025
              年 1 月，Dataiku 披露 $300M+ ARR 和 700+ 客户； 2025 年 10 月，公司披露 $350M+ ARR、750+ 客户和 1,250+
              员工。这是真实的运营体量。反论点不是公司没有业务牵引力， 而是投资者仍不够了解牵引力背后的经济性。毛利率、NRR、现金消耗、服务交付强度和头部客户集中度仍未披露，同时 Databricks
              和超大云厂商的竞争还在加剧。如果业务比公开叙事更重服务、更依赖渠道，或粘性更弱，公允估值会很快变成高估。
            claimRefs:
