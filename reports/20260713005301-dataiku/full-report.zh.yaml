        - 暂停投资判断，直到补丁节奏和客户升级覆盖得到证明
      - - 监管姿态
        - 重大执法事件
        - 涉及 Dataiku 或大型客户部署、且归因于 Dataiku 平台的 GDPR / FTC / 行业监管行动或同意令
        - 立即重切风险评级和估值区间
      - - 客户韧性
        - 续约 / 扩张恶化
        - 私有 NRR 低于企业软件预期，或头部客户出现明显降级
        - 建议转向等待 / 重定价
      - - 合作伙伴依赖
        - 渠道集中
        - 新 ARR 或服务交付中 >40% 依赖单一渠道伙伴或单一路云路径
        - 对利润率路径和执行信心打折
      - - 实施复杂度
        - 价值实现慢
        - 平均企业实施周期显著长于管理层指引，或扩张转化下滑
        - 在证伪前，把客户案例视为不具代表性
      - - IPO 准备度
        - 融资延误
        - IPO 时间表延后，同时增长或治理指标走弱
        - 假设私有持有期更长，下轮估值下调风险更高
    notes: 这些终止标准刻意设计成可监控项；它们把宽泛担忧转成足以改变投资决策的阈值。
