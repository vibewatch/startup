    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开记录足以识别 Dataiku 的商业形态，尽管还不足以精确建模。Dataiku 显然是一家经常性企业软件公司，不是广告支持产品、市场平台，也不是纯粹按用量计费的 API 供应商。公司 2025 年发布以
              ARR
              而不是订单额或服务收入来描述增长；其归档方案页面也显示，从免费或小团队入口，到更深的自动化、部署、安全和治理能力，产品存在结构化升级路径。当前产品页面进一步强化了平台围绕广度销售：编排、治理、代理和企业数据控制。也就是说，买方购买的是一个跨职能控制平面，其价值随部署范围扩大而增加，而不是单模块点解决方案。关键细节在于，公开材料没有披露实际标价或具体收入确认机制。与
              Databricks 和超大规模云厂商相比，Dataiku 看起来更偏合同导向，用量定价透明度较低；这可能提升预算可预测性，但也让外部仅凭公开信息无法对实际经济性做基准比较。
