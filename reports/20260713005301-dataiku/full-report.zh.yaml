      - number: '2.3'
        title: 买方、用户与企业采用路径
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的买方地图在结构上明显偏大型企业。广泛研究显示，大型企业主导 ML 支出；Dataiku 自身客户表面也印证了这一点：制药、银行、物流、制造、保险和交易所运营商在公开资料中反复出现。典型经济买方是
              CIO、CDO、分析或数据平台负责人，或掌管受治理数据预算的转型负责人。用户群比买方群更宽。Snowflake、AWS 和 Google Cloud
              的合作材料都强调业务与领域专家，而不只是数据科学家；这意味着该平台类别由中心化预算购买，却通过广泛内部使用变现。Dataiku
              的归档打包方式透露了标准的先落地再扩张路径：免费或小团队入口可行，但当客户需要自动化、部署、审批工作流和更广治理时，真正产品价值才会释放。系统集成商很重要，因为买方往往需要改变运营模式，而不只是安装软件。KPMG
              联盟与 Snowflake 的 300+ 共同客户说法都表明，生态能把产品带入大客户转型项目；这些项目采购周期长，且跨职能。
