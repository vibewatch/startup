      - number: '5.2'
        title: 架构、部署与 API
        blocks:
          - type: paragraph
            body: >-
              官方页面、归档打包、合作伙伴页面和技术文档中最一致的产品主题，是灵活性。文档显示，Dataiku 支持 SaaS、客户自管云，以及本地或私有云运营模式。它为非代码用户提供可视化界面，也通过
              API、代码配方、notebook、场景和客户端工具提供完整开发者界面。Python API 参考明确表示，Dataiku 工具可以在 DSS 内任何运行代码的地方使用；开源的 GitHub API client
              和 README 也表明，针对平台的外部自动化并非只限内部。与 AWS、Google Cloud、Databricks 和 NVIDIA 的合作页面进一步说明，Dataiku 的架构是坐在客户基础设施和外部 AI
              栈之上，而不是替代它们。这一点有战略意义：平台的技术身份首先是编排，其次是集成。它也意味着，对云、模型和合作伙伴生态的依赖是设计特征，不是偶然副产品。
