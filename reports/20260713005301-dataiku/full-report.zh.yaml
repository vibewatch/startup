      - number: '3.3'
        title: 转换成本与分发力量
        blocks:
          - type: paragraph
            body: >-
              Dataiku 真正的护城河不是单一模型或专有数据资产，而是在异构工具、云和用户类型之间提供受治理协作的运营便利。这一点在已经并行运行 Snowflake、Databricks、AWS、Google Cloud
              和内部代码工具的企业中最关键。在这种环境下，Dataiku 可以作为横跨技术栈的编排和治理层取胜。但同一架构也带来主要战略脆弱性：超大规模云厂商可以从买方既有合同、身份系统和云端数据引力出发；Databricks
              则可以从数据与计算工作流本身的所有权出发。公开合作伙伴页面显示，Dataiku
              更倾向于共存，而不是推倒重来式替换；这扩大了分发，也降低了孤立风险。专家型供应商在买方想要较短见效周期或低代码自动化时仍有空间，但它们通常缺少最大平台竞争者的生态杠杆广度或已披露资本规模。这也意味着销售竞争往往由集成可信度和变革管理舒适度决定，而不只是原始模型功能。
