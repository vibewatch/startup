chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部，以及 Dataiku 到底卖什么
        blocks:
          - type: paragraph
            body: >-
              Dataiku 是一家后期私营企业软件公司，2013 年创立，如今总部位于 New York；不过它的根基和创始团队明显来自法国。公司仍用推动早期增长的同一个核心想法描述自己：把数据和 AI
              变成日常运营能力，而不是专家项目。到 2026 年，公司话术已从较早的「Everyday AI」转向「The Platform for AI
              Success」，但运营主张没有变——用一个控制平面，让业务用户、分析师、数据科学家、工程师和风险负责人共同构建分析、机器学习和 AI 代理工作流。这个定位很重要，因为 Dataiku
              卖的不是单一模型工具，也不是单点 AutoML 产品；它卖的是客户数据栈之上的编排、治理和多人协作。归档的方案页面和当前合作伙伴材料显示，Dataiku 有三条稳定部署路径：托管 SaaS、客户自管云，以及本地
              / 私有云安装。这种部署灵活性，加上无代码、低代码和全代码工作流，是公司价值主张的核心，也解释了为什么买方往往是基础设施异构的大型企业，而不是想要一键式 AI 的 SMB。
