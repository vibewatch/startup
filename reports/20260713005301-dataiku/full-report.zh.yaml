        title: 销售动作与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的产品和客户模式指向经典的企业级先落地再扩张模式，但硬性的单位经济字段仍未披露。大型客户、合作伙伴生态和云无关部署都指向长销售周期、高 ACV 与多利益相关方采购；同时 2025 年 ARR
              里程碑显示，该模式可以越过试点阶段继续放大。最好的公开代理指标来自相邻上市公司。C3.ai 的申报文件和 FY2026 业绩显示，企业 AI
              软件可以高度由订阅驱动，但仍带有服务和优先工程工作，以支撑部署和路线图加速。Snowflake
              年报展示了变现光谱的另一端：消费驱动模式、很高的产品毛利、可观的剩余履约义务和强劲经营现金生成，但客户可以优化用量，因此收入可见性不那么线性。合在一起，这些可比公司说明，对 Dataiku
              的真正承销问题不是公司有没有牵引力，而是服务强度、云成本和合作伙伴经济性是否能在 ARR 扩大后让业务收敛到强软件利润率。
