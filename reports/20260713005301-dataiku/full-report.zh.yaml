      - number: '1.4'
        title: IPO 路径、生态强度与主要反向解读
        blocks:
          - type: paragraph
            body: >-
              Dataiku 进入 IPO 观察期的最强信号，是 Reuters 2025 年 10 月报道称 Morgan Stanley 和 Citigroup 已受聘，为最早可能在 2026
              年上半年进行的美国上市做准备。截至运行日期，公司仍没有公开申报文件，所以公平表述应是「正在准备，但尚未上市」。这个细节重要，因为公司的商业化和生态故事显然在增强：Snowflake 材料指向 300+
              共同客户和重要联合销售动能，KPMG 在 2024 年公开与 Dataiku 结盟，Dataiku
              自己的合作伙伴目录也显示，它在超大规模云厂商、数据平台和集成商中覆盖很深。但并非所有信号都干净利好。Gartner 评论页包含对私有云集成的明确批评，更广泛的市场分析也警告，企业代理式 AI
              采用仍受信任、集成和治理缺口限制。换句话说，Dataiku 很适合承接下一波企业 AI 预算，但这波预算释放有多快、规模是否足以支撑其 IPO 溢价高于 2022
              年估值标记，仍取决于一个比供应商叙事更难落地的采用环境。
