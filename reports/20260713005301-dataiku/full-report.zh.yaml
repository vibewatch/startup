      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最主要的市场驱动力，是 AI 从实验转向受治理的生产使用。Dataiku 自己的发布明确这么表述，合作伙伴页面也说明原因：企业想要 GenAI
              和代理能力，但不想失去对成本、数据血缘或部署标准的控制。因此，信任和治理不只是风险控制，也是需求创造器。但类别的主要约束同样可见。Deloitte 2025 年调查发现，在财务与会计中已使用代理式 AI
              的比例仍只是少数，信任是首要障碍。SiliconANGLE 和 2026 年 arXiv 行业研究从不同角度强化了同一信息：数据质量、集成、验证和人工监督仍是瓶颈。Observer
              进一步给出经济解读：架构复杂时，回报可能要按年而不是按季度兑现。对 Dataiku
              来说，这意味着市场有吸引力，恰恰因为问题很难；但也意味着销售周期、验证要求和实施摩擦会继续很重。公司受益于治理和编排需求，但同一需求也会放慢类别渗透；如果没有内部赢单率和预算数据，完全受约束的 SAM/SOM
              分析仍不完整。
