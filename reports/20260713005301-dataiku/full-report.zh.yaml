            body: >-
              在 Dataiku 的公开叙事里，治理不是薄薄一层勾选框，而是主要产品支柱之一。Govern 产品页和 Govern
              文档都描述了集中式项目跟踪、资产登记、工作流审批、签核规则和审计时间线。公开材料还把这些控制直接连接到监管压力，明确提到 EU AI Act 准备度和减少 shadow AI。技术文档进一步说明 Standard
              和 Advanced govern 许可证；Advanced 功能覆盖 GenAI 登记库、自定义治理模板、自定义动作和脚本。安全证据更混杂，但仍有可信度。Dataiku
              安全页面和安全文档显示公司有活跃安全运营；同时，一页 2026 年警告文档为影响 Dataiku 环境的 Linux 本地提权漏洞给出响应指引。公司的 SOC 2
              公告时间较早，不应被视作完整当前认证清单，但它仍提供证据：正式合规工作多年来一直是产品和运营故事的一部分。
