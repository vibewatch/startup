  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的客户足迹明显由大型企业主导，而不是 SMB 主导；公开证据覆盖多个受监管且运营复杂的垂直行业。公司称，2025 年 1 月服务超过 700 家组织，2025 年 10 月超过 750
              家；2024 年 7 月与 KPMG 的联盟发布则称，Dataiku 已拥有超过 600 家客户和 200 家 Forbes Global 2000 客户。Dataiku
              客户页面可见的具名客户集中在医疗健康与生命科学（Johnson & Johnson、Novartis、Roche）、制造与工业（Michelin、Mitsubishi
              Electric、SLB）、金融服务与资本市场（Standard Chartered、Euronext）、物流与交通（Geodis、Prologis）、食品 / 农业（Perdue
              Farms）。用户很少只是单个数据科学家。更常见的模式是一个跨职能联盟，把数据科学家、分析师、工程师、运营专家和业务领域用户放在同一个受治理平台上。这让经济买方更可能来自中心化的数据、分析、数字化转型或业务平台预算，而不是按席位购买的部门预算。因此，分层证据对谁在使用
              Dataiku、什么类型企业会采用它很强，但对按垂直、地理或账户规模分段的精确收入结构仍很弱。
