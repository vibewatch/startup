      - number: '1.2'
        title: 创始人、领导梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              公开领导层图景中，创始核心和更新后的商业化梯队最清晰。Florian Douetteau 仍是明确关键人物，担任联合创始人兼 CEO；Clément Stenac 仍是技术锚点，担任联合创始人兼
              CTO。公开创始人资料也持续把 Thomas Cabrol 和 Marc Batty 列在其中，但他们当前运营角色的可见度远低于 Douetteau 和
              Stenac。这对成熟私营公司并不少见，却仍让治理细节达不到公开市场投资人想要的厚度。2026 年最相关的管理层事件，是 6 月聘任 Maxwell Long 出任 President 兼
              CRO。这一动作很像典型后期扩张：Long 曾帮助 Smartsheet 跨过 $1B ARR 并走向 $8.4B 退出，Dataiku 聘他专门管理全球销售、客户成功和合作伙伴团队。叠加 2025
              年引入一位高知名度 CMO，以及公司持续强调合作伙伴，领导层模式符合一家企业在潜在流动性事件前把商业引擎专业化的路径。仍披露不足的是董事会构成、独立性，以及后期投资人与经营团队之间的精确权力分工。
