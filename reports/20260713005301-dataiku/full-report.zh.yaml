            body: >-
              作为一家私营基础设施软件公司，Dataiku 的公开证明集异常丰富，因为许多客户故事包含具名高管、具体工作流和量化结果。最好的证据是运营性的，而不是炫耀 logo。Novartis 称，一个 GenAI
              用例的洞察时间缩短 90%，基于电子表格的数据摄取提速 600%。Michelin 称，一个过去最长需要六个月的根因分析流程，现在约一小时就能运行；同时，十多家工厂的 600 多名工程师和技术人员依赖一个基于
              Dataiku 的参数分析解决方案。Prologis 称，它从 5 个已生产化数据科学产品，推进到 30 个项目和 30 个 API 正在活跃使用，并把 60 多个 AI/ML 项目投入生产。Roche 描述了新
              GenAI 项目构建时间从数月压缩到数天、每年节省六位数律师工时，并计划从 80 名欧洲专利专业人员扩展到全球最多 250 名用户。Geodis、Euronext、Perdue Farms、Standard
