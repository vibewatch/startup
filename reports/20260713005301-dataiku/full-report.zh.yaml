            body: >-
              客户质量的公开证据，最强在采用广度和结果轶事，最弱在续约机制。Dataiku 不公开披露净收入留存、总留存、流失、合同期限、头部客户集中度，或前十大账户贡献的 ARR 份额。Gartner 2026
              年评论页方向上偏正面，本次抓取页面显示五星占 75%、四星占 23%；Dataiku 2025 年 1 月发布也引用了 96% 的 Gartner 愿意推荐得分。但同一 Gartner
              页面也包含一条批评性评论标题，描述云集成问题；这很重要，因为困难的企业集成正是 AI 平台落地容易卡住的地方。FeaturedCustomers 和 TrustRadius
              确认了可见的评论与案例研究语料，但不能解决续约或集中度这些核心承销问题。公平解读是，Dataiku
              在成功企业部署中很可能享有有意义的转换成本，因为工作流、治理和非技术用户习惯会随时间积累；不过，在私有留存分组和集中度表披露前，这种耐久性仍只能给中等置信度。
