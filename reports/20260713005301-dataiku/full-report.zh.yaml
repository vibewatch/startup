      - number: '3.4'
        title: 护城河耐久性与反向解读
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是说 Dataiku 弱；它说明当独立 AI 平台面对捆绑基础设施或更广系统记录时失去差异化，这个类别会非常残酷。Databricks
              是最高严重度威胁，因为它扩张更快、资本实力强得多，并持续从数据基础设施扩展到治理、AI 代理和应用界面。超大规模云厂商是第二个结构性威胁，因为它们能让原生工具在云承诺内部显得「足够免费」。DataRobot
              提供了最清楚的警示案例：曾经炙手可热的独立 AI 公司，在原生云工具和范式变化改变买方关注点时，战略相关性会迅速流失。H2O.ai 和 Alteryx 说明相邻领域仍有价值，但也说明并非每个相邻类别都能拿到 AI
              平台倍数。Dataiku 最好的防守，是继续在那些即便原生 AI 功能改善后仍会保持多云、多工具的账户中，成为中立、受治理的工作流层。
