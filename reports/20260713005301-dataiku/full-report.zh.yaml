      - number: '6.4'
        title: 扩张动作与生态杠杆
        blocks:
          - type: paragraph
            body: >-
              公开材料中可见的商业动作，是通过平台标准化、业务用户赋能和合作伙伴辅助的企业转型来先落地再扩张。案例研究反复从单个运营痛点开始，但最终走向更广的受治理分析和 AI 采用。Michelin
              从数字化制造起步，随后扩展到工厂、R&D 和公司职能。Prologis 从描述性分析扩展到地理空间分析、预测建模和企业 GenAI。Roche 从专利搜索试点起步，再把多个 GenAI
              项目整合进一个代理式界面。KPMG 联盟说明 Dataiku 也通过现代化和治理项目销售，而不只是直接软件采购；2025 年 Frontrunner Awards 则显示，客户因多个行业中的代理式
              AI、治理和生产率用例而获认可。这套扩张逻辑重要，因为它说明 Dataiku
              最好的账户之所以粘性强，不只因为模型进入生产，更因为平台变成了组织工作流、培训和治理层。仍未知的是，有多少销售管线来自合作伙伴，多少收入受市场平台或服务影响，以及扩张是在长尾中广泛发生，还是集中在少数旗舰账户。
