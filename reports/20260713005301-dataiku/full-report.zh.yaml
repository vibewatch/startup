  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与最接近的对手
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的竞争集合比一份 DSML 候选清单更宽。现实买方替代方案包括 Databricks 这类统一数据与 AI 平台，Amazon SageMaker、Azure Machine
              Learning、Vertex AI 这类超大规模云厂商原生 ML 栈，以及 DataRobot、H2O.ai、Alteryx
              这类更窄的专家型供应商；后者用不同部署和定价假设解决相邻任务。最重要的区别在于，Dataiku 想成为既有企业数据资产之上的中立控制层，而不是存储、计算和模型服务发生的唯一地点。这让 Databricks
              成为最接近的广义平台同行，因为它现在把数据、治理、MLOps 和代理工具放在一个产品家族里销售；超大规模云厂商则通过把 AI
              做成既有云采购的另一个功能来竞争。专家型供应商同样重要，因为它们显示，在更窄的见效速度、AutoML 或分析自动化路径上，预算仍可能从完整编排平台流走。
