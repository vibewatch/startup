        - 公开价格透明度有限，规模小于 Databricks
      - - Databricks
        - 统一数据 + AI 平台
        - 2026 年年化收入 $6.9B；2025 年 12 月估值 $134B
        - 整合数据工程、分析与 AI 的企业
        - 同时掌握数据和 AI 工作流界面，智能体路线图强
        - 中立性较弱，因为它也想成为核心数据平台
      - - Amazon SageMaker
        - 超大云厂商原生 ML 技术栈
        - AWS 级采购通道和细颗粒度用量计费
        - 以 AWS 为中心的工程和 ML 团队
        - 原生 AWS 集成，按工作负载计量定价
        - 更像组件化工具，不像跨异构技术栈的中立层
