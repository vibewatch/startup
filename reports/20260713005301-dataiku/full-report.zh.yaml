      - number: '7.4'
        title: 财务不透明与 IPO 传导风险
        blocks:
          - type: paragraph
            body: >-
              最后一层风险在于传导：技术、监管或客户问题会怎样影响融资和估值。Reuters 报道，Dataiku 于 2025 年 10 月聘请 Morgan Stanley 和 Citigroup，为潜在美国 IPO
              做准备；这意味着公司面对的隐含审视门槛，高于普通后期私营软件厂商。与此同时，公开证据仍未披露毛利率、 NRR、现金消耗或头部客户占比等核心承保字段。缺失字段很关键，因为它们决定 Dataiku
              能不能扛住冲击。毛利强、现金深、扩张分散的公司， 能熬过交易窗口延后或一次实施失误；缺少这些缓冲的公司，会很快失去谈判筹码。因此，正确的风险框架不只是「IPO 窗口风险」。
              安全缺陷、合规失误、合作伙伴摩擦或客户扩张停滞，都可能传导成续约假设下调、公开市场可比公司倍数下降，或可信上市前更长的私有持有期。 Dataiku 的管控姿态和产品贴合度是实质缓释因素，但剩余暴露仍高于普通
              SaaS，因为平台直接嵌在企业 AI 治理和运营工作流里； 这类场景一旦失败，会很快传到信任、采购和估值。
