      - number: '8.4'
        title: 最终尽调与论点失效触发项
        blocks:
          - type: paragraph
            body: >-
              要给出明确买入判断，剩下的不是理念问题，而是材料问题。投资者需要截至 runDate 的当前 ARR 桥接、毛利率拆分、NRR 和流失分群、
              头部客户集中度、合作伙伴来源销售管线、服务组合、现金和消耗，以及未来融资或 IPO 时的优先权结构。这些问题重要， 因为倍数争论已经不再是学术题。Dataiku
              已经足够大，主导风险的不再是需求缺失，而是经济性缺失。若留存明显弱于客户故事暗示， 若安全或监管问题打断 IPO 时间表，若 ARR 增速低于 $3.7B+
              估值锚所隐含的预期，或若合作伙伴依赖被证明是在弥补直接产品杠杆不足， 论点就会失效。在这些问题得到回答前，正确姿态是有纪律地贴近跟踪，而不是给出最高确信度。二级市场或跨界投资者也不应把没有坏消息，
              等同于优质经济性的证据。
