      - number: '8.2'
        title: 融资背景与公开可比公司桥接
        blocks:
          - type: paragraph
            body: >-
              Dataiku 最近一次披露的私募估值，仍是 2022 年 12 月 Series F 的 $3.7B。此后，公开运营里程碑继续改善，但估值锚没有公开重设；
              这不常见，却有分析价值。按上次披露估值计算，Dataiku 在 2025 年 1 月 $300M ARR 里程碑上约为 12.3x ARR，在 2025 年 10 月 $350M ARR 里程碑上约为 10.6x
              ARR；Sacra 对 2025 年 9 月约 $342.5M 的估算，对应约 10.8x。这些倍数不便宜， 但也没到公开市场顶级 AI 或数据平台资产的峰值区间。公开市值 /
              收入代理指标区间很宽：Palantir 约 58.2x、Datadog 25.0x、 Snowflake 19.4x、MongoDB 11.2x、Confluent 9.6x、ServiceNow
              8.0x、C3.ai 4.6x。因此，Dataiku 滞后的私募倍数 更接近公开区间中部，而不是两端。估值问题不是公司是否配得上溢价，而是一家私营、不透明、面向企业治理的 AI 平台， 应该落在这个宽区间的哪里。
