      - number: '1.3'
        title: 融资历史、估值，以及已有的公开规模指标
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的融资史显示，公司在 2018-2022 年软件牛市中激进扩张，此后选择不再宣布新的一级融资。第三方轮次历史显示，公司估值逐级抬升：2018 年完成 $101M Series C，2019 年在
              CapitalG 支持下进入独角兽行列，2020 年完成 $100M Series D，2021 年以 $4.6B 估值完成 $400M Series E，并在 2022 年 12 月以 $3.7B 估值完成
              $200M Series F。Sacra 2025 年研究把累计融资额估在约 $846.8M；虽然私营公司的股权结构数据仍不完整，这个数与已披露时间线方向一致。作为一家私营 AI 平台供应商，Dataiku
              的公开运营规模异常可见。公司官方称，2025 年 1 月 ARR 达 $300M，2025 年 10 月超过 $350M；同期客户数从 700+ 增至 750+，员工数从 1,100+ 增至
              1,250+。公司还称拥有 13 个办公室，并渗透了 Forbes Global 2000
              中的四分之一。这些都是强劲的后期软件指标，但仍是新闻稿指标，不是审计文件。因此，本章把它们视为有二级研究相互印证的公司说法，而非达到上市公司质量的披露。
