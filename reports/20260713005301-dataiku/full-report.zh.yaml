      - number: '7.3'
        title: 依赖、客户与执行风险
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的 GTM 依赖本身也是风险传导通道。KPMG 联盟说明，公司能嵌入更大的现代化和治理项目里拿单；这有利于放大规模， 但也让合作伙伴质量和服务经济性更关键。客户案例反复强调，它能与
              Snowflake、Azure、ServiceNow、PowerBI 等系统互通。 互操作性是优势，但连接器故障、云政策变化或模型供应商争端，都可能传导成客户不满。客户基础质量高，却很难尽调定价。
              公开证明覆盖医疗、银行、物流、制造和资本市场；受监管买方重视治理，战略上很有吸引力。但运营上也危险：控制、文档或事件响应一旦短板， 这类买方不会宽容。公开来源仍未披露头部客户集中度、合作伙伴来源销售管线或
              NRR。丰富证据大多来自供应商筛选过的标杆案例， 而不是独立的分群披露。人员和执行层面，公司已扩张到 1,250 多名员工，并在筹备潜在 IPO 的同时补入资深商业领导层。
              纪律性可能因此改善，但产品、客户成功或合作伙伴管理的执行滑坡，也更可能在最不合适的时间点暴露出来。
