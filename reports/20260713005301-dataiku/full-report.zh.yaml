      - number: '7.2'
        title: 安全与运营可靠性风险
        blocks:
          - type: paragraph
            body: >-
              Dataiku 不是狭窄功能产品，因此运营风险画像偏高。它横跨数据访问、notebook、API、自动化、模型部署、治理，以及现在的代理式 AI 编排，攻击面天然很宽。OpenCVE 显示 Dataiku DSS
              曾有重要已披露漏洞，包括 2025 年 6 月披露的一个 9.8
              分关键认证绕过问题，以及一系列较早的访问控制和信息泄露问题。这本身不能证明安全文化薄弱——每个成熟企业平台都必须修补问题——但确实证明补丁纪律至关重要。产品的运营形态还带来分裂的风险模型。在自管部署中，Dataiku
              称默认不处理或存储客户数据，这降低了供应商数据保管暴露，但也把更多配置、可用性和安全负担转移到客户环境。在 Dataiku Cloud
              中，公司成为事件处理和子处理方管理的更直接控制点，同时也继承云提供商基础设施风险。Gartner
              评论内容补充了另一个实务风险：抓取页面上至少一条批评性评论标题指向私有云集成摩擦。这一点重要，因为常常不是软件缺陷，而是实施复杂度，把一个技术上可靠的平台变成商业上痛苦的落地。
