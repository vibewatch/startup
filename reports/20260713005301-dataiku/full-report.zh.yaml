      - number: '2.2'
        title: 规模测算口径——市场很大，但有多个合理分母
        blocks:
          - type: paragraph
            body: >-
              面向 Dataiku 机会的公开市场规模测算跨度异常大，因为分析师测的是相互重叠但并不相同的类别。最宽口径下，Fortune Business Insights 预计 2026 年全球机器学习软件支出为
              $65.28B，Precedence Research 则给出同年 $126.91B。严格说，这两个数字都不算错；它们只是口径很宽。更窄的类别镜头对承销 Dataiku 更有用。MarketsandMarkets
              预计 MLOps 到 2027 年为 $5.9B、AI 治理到 2029 年为 $5.78B、AI Studio 到 2029 年为 $32.7B。这些窄口径更贴近 Dataiku
              变现的受治理开发、部署和监控界面。正确的分析结论不是挑一个 TAM 并为它辩护，而是保留区间，并明确说明 Dataiku 为什么可能捕获三层中的部分份额。估值工作中，本章把宽口径 ML 市场研究当作天花板背景，把
              MLOps 和 AI 治理研究当作更接近公司当前 SAM 的代理，把 AI Studio 框架视为桥接类别，用来解释代理和治理融合后市场为什么会变宽。
