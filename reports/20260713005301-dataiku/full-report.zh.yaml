  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与法律风险
        blocks:
          - type: paragraph
            body: >-
              Dataiku 的法律风险与其说来自某个可见诉讼，不如说来自它身处不断扩大的合规边界。按私营软件标准，公司法律和隐私表面较成熟：当前隐私政策、云条款栈、2026 年 DPA，以及明确讨论隐私保护设计、负责任 AI
              和集成管理体系的信任页面。这些是真实缓释因素，尤其有利于企业采购。它们也是真实义务。隐私政策称，Dataiku 对其在该政策下收集的数据担任控制者；云 DPA 则把 Dataiku 定义为 SaaS
              场景中客户个人数据的处理者，并把运营连接到 GDPR、CCPA、SCCs 和事件处理。监管背景只会更难，不会更容易。EU AI Act 现在禁止某些做法，对高风险系统施加严格义务，并将在 2026 年 8
              月让生成式 AI 透明度规则生效。NIST 的 AI RMF 和 GenAI profile 也强化了市场预期：企业 AI 供应商必须把可追溯性、监督和风险管理运营起来，而不是只拿来营销。因此，主要法律风险不是
              Dataiku 已知遭遇公开执法，而是广泛企业部署、第三方模型供应商链条，或客户在敏感工作流中误用，可能让公司面对更慢销售周期、更高赔偿谈判成本，或未来监管审查。
