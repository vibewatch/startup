            body: >-
              最强的商业解读是，Dataiku 看起来正从一个大型企业平台，走向更广安装基础和更深内部使用。Sacra 估计 2023 年底约有 500 家客户；这个基准与官方披露方向一致，即 2025 年 1 月客户超过
              700 家，2025 年 10 月超过 750 家。多个案例研究展示的不只是拿下客户 logo，还有内部采用扩大。Johnson & Johnson 的 Vision 组织称，超过 80
              名分析和数据科学专业人员采用 Dataiku，页面标题还写明 650+ 名员工使用 Dataiku。Michelin 从 2021 年的 35 名用户，扩展到 2025 年中 50+ 家工厂的 1,500+
              名用户，其中 80% 用户被描述为业务专家。Standard Chartered 称，自 2020 年以来已有 518 名员工完成公民数据科学项目，700 多人完成在线 Dataiku 培训课程；Prologis
              称，超过 2,000 名用户通过其用 Dataiku 构建的企业 ChatGPT 部署使用 AI。这些不是完美的留存指标，但它们是有意义的部署规模信号，表明 Dataiku
