  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 公司
      - 公开合同模式
      - 可见包含内容
      - 未知项
      - 含义
    rows:
      - - Dataiku
        - 企业分层；存档资料显示 free / discover / business / enterprise 框架
        - 协作、连接器、自动化、部署选项、治理深度
        - 当前实际成交价格、折扣和云托管加价不公开
        - 采购由架构牵引，而非由自助价格牵引
      - - Databricks
        - 基于用量的 SKU 定价，并有分云价格表
        - 平台服务按标价 SKU 和组合销售
        - 实际折扣和按工作负载计算的完整 TCO 仍不公开
        - 公开透明度高于多数同业，但财务团队仍不容易理解
      - - Amazon SageMaker
        - 按实例、时长、存储和推理模式，对功能逐项计量定价
        - Notebook、训练、推理、特征库、处理、MLflow 等服务
        - 完整账单取决于架构、实例选择和工作负载强度
        - 可以小规模起步，但一旦计算密集型场景跑通，支出可能不可预测地上升
      - - Azure Machine Learning
        - 报价驱动的 Azure 服务，支持按量付费、预留和节省计划
        - 叠加在 Azure 计算选择之上的端到端 ML 生命周期服务
        - 企业实际价格取决于 Microsoft 协议条款和所选基础设施
        - 对既有 Azure 体系很强；外部比较时透明度较低
      - - Vertex AI / Agent Platform 平台
        - 训练、部署、AutoML 和预测按量定价
        - 模型运营按小时计费，无最低使用时长，预测按次数分层
        - 混合成本仍取决于模型选择、端点设计和 GCP 使用模式
        - 对突发式试验有吸引力，但原生云锁定仍在
      - - DataRobot、H2O.ai 与 Alteryx
        - 多数是演示驱动或联系销售的企业销售动作
        - 套件定位、部署选项和包装线索公开
        - 已抓取页面没有详细企业标价
        - 与 Dataiku 的公开 TCO 对比在结构上不完整
    notes: 本表比较已抓取来源包实际披露的内容，而不是私下谈判合同最终可能长什么样。
