            body: >-
              与其把 Dataiku 理解成单一建模功能，不如把它看成企业 AI 工作的共享运营层。当前产品页围绕三项功能描述平台：人来构建，编排来连接，治理来保护。这个框架与底层文档一致。DSS
              结合了可视化数据准备、notebook 式代码工作、自动化、部署和 API 访问。Govern 增加了一个独立监督节点，用于跟踪 AI 项目、审批、登记和审计工作流。围绕代理和受治理 AI
              的当前营销显示，Dataiku 现在想成为企业设计、监控和路由代理式工作负载的地方，而不只是训练经典 ML 模型的地方。因此，产品横跨多类角色：分析师、数据科学家、ML
              工程师、平台负责人、治理团队和业务利益相关方。重要的技术含义是，Dataiku 的价值不在某一个算法，而在一个受控环境里协调异构的人、数据、模型和审批工作流。
