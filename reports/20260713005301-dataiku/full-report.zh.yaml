            body: >-
              发布说明清楚显示，Dataiku 按持续的企业节奏出货，而不是躺在较老的 DSS 核心上。Version 14 发布流显示，2026 年 6 月和 7 月，公司在代理式 AI 与 RAG、LLM
              Mesh、治理、MLOps、AI 助手、数据质量、Git、安全和代码工具上反复更新。这支撑了成熟度判断：Dataiku 不是试点时代的平台。与此同时，路线图证据也凸显依赖和风险。发布说明提到 Python
              版本变化、Java 最低版本上调、Llama 模型移除、容器镜像和 OS 变化，以及云栈注意事项。这些都是真实企业平台的正常信号，但也确认 Dataiku
              的产品依赖底层云、OS、模型和开源生态保持稳定。外部产品证明比官方文档薄。Gartner 评论证据仍至少包含一条关于私有云集成的批评，公开表面也没有提供经过基准测试的性能、uptime SLA
