      - number: '8.3'
        title: 情景估值与建议
        blocks:
          - type: paragraph
            body: >-
              我们的基准情景假设，2025 年 10 月披露的 $350M+ ARR 在方向上足够接近当前，可作为估值锚；但在毛利、留存和现金效率证据改善前， 投资者仍应给出私营公司折扣。基于此，公允的基准估值区间约为
              $3.5B-$4.5B，整体接近或略高于上次披露的 $3.7B。 如果 Dataiku 能证明可信 AI 治理、750+ 企业客户和 IPO 准备度能转化为持久扩张和软件式毛利，多头情景可支持约
              $5.0B-$6.5B。 如果增长放缓、留存不及预期，或公开市场投资者因不透明和实施风险给出更重折扣，空头情景约为 $2.5B-$3.2B。
              因此，当前公开证据支持「跟踪」建议、中等置信度、中高风险和公允估值立场。公司真实到不能忽视，也不透明到不该以溢价激进承保。
