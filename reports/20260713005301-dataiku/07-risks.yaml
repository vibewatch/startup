  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Dataiku's risk profile is shaped by a difficult combination: it is a governance-first enterprise AI platform operating in regulated customer environments while also shipping a technically broad product surface with notebooks, APIs, agents, and third-party model integrations. The company's legal and security controls are credible, but public disclosures still leave material uncertainty around patch cadence, customer concentration, partner dependence, and the financial resilience needed to absorb a pre-IPO stumble."
  },
  "sections": [
    {
      "id": "regulatory-privacy-and-legal-risk",
      "title": "Regulatory, privacy, and legal risk",
      "body": "Dataiku's legal risk is less about one visible lawsuit and more about living inside a widening compliance perimeter. The company's legal and privacy surfaces are mature by private-software standards: a current privacy policy, a cloud terms stack, a 2026 DPA, and a trust page that explicitly discusses privacy-by-design, responsible AI, and integrated management systems. Those are real mitigants, especially for enterprise procurement. They are also real obligations. The privacy policy says Dataiku is a controller for data it collects under that policy, while the cloud DPA defines Dataiku as a processor for customer personal data in the SaaS context and ties operations to GDPR, CCPA, SCCs, and incident handling. The regulatory backdrop is getting harder, not easier. The EU AI Act now bans certain practices, imposes strict obligations on high-risk systems, and brings transparency rules for generative AI into force in August 2026. NIST's AI RMF and GenAI profile reinforce the market expectation that enterprise AI vendors operationalize traceability, oversight, and risk management rather than merely market them. The main legal risk is therefore not a known public enforcement action against Dataiku; it is the possibility that broad enterprise deployments, third-party model-provider chains, or customer misuse in sensitive workflows expose the company to slower sales cycles, higher indemnity negotiation, or future regulatory scrutiny.",
