            body: >-
              Dataiku's customer footprint is clearly enterprise-led rather than SMB-led, and the public evidence spans
              several regulated and operationally complex verticals. The company itself said it served more than 700
              organizations in January 2025 and more than 750 in October 2025, while a July 2024 alliance release with
              KPMG said Dataiku already had more than 600 customers and 200 Forbes Global 2000 customers. The
              named-customer roster visible on Dataiku's customer surfaces clusters into healthcare and life sciences
              (Johnson & Johnson, Novartis, Roche), manufacturing and industrials (Michelin, Mitsubishi Electric, SLB),
              financial services and capital markets (Standard Chartered, Euronext), logistics and transportation
              (Geodis, Prologis), and food/agriculture (Perdue Farms). The user is rarely a single data scientist.
              Instead, the recurring pattern is a cross-functional coalition that mixes data scientists, analysts,
              engineers, operations experts, and business-domain users on a common governed platform. That makes the
              economic buyer more likely a centralized data, analytics, digital-transformation, or business-platform
              budget rather than a seat-by-seat departmental purchase. The segmentation evidence is therefore strong on
              who uses Dataiku and what kinds of enterprises adopt it, but still weak on exact revenue mix by vertical,
              geography, or account size band.
