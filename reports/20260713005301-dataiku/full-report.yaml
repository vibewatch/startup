      - number: '1.3'
        title: Funding history, valuation, and the public scale markers that do exist
        blocks:
          - type: paragraph
            body: >-
              Dataiku's funding history shows a company that scaled aggressively through the 2018-2022 software bull
              market, then chose not to announce a fresh primary round afterward. Third-party round histories show
              step-ups from a $101 million Series C in 2018 to CapitalG-backed unicorn status in 2019, a $100 million
              Series D in 2020, a $400 million Series E in 2021 at a $4.6 billion valuation, and a $200 million Series F
              in December 2022 at a $3.7 billion valuation. Sacra's 2025 research pegs lifetime funding at roughly
              $846.8 million, which is directionally consistent with the disclosed chronology even if private-company
              cap-table data remains incomplete. Public operating scale is unusually visible for a private AI platform
              vendor. Dataiku officially reported $300 million ARR in January 2025 and more than $350 million ARR by
              October 2025, while customer count moved from 700+ to 750+ and employee count from 1,100+ to 1,250+ over
              the same period. The company also claimed 13 offices and one-in-four penetration of the Forbes Global
              2000. Those are strong late-stage software metrics, but they are still press-release metrics rather than
              audited filings, so the chapter treats them as company claims backed by corroborating secondary analysis
              instead of as public-company-quality disclosures.
