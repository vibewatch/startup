      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not chase
            body: >-
              Dataiku looks like a real late-stage enterprise AI leader, but the current evidence supports disciplined
              tracking rather than paying a premium without margin, retention, and cash-efficiency proof.
            calloutType: recommendation
            claimRefs:
              - CV027
