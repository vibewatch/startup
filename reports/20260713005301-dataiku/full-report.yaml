  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Dataiku is straightforward. It has genuine enterprise scale, disclosed ARR milestones, a
              blue-chip customer roster, a governance-heavy product narrative that fits the current enterprise AI
              moment, and a still-private valuation mark that has not obviously outrun revenue in the way some AI names
              have. In January 2025 Dataiku disclosed $300M+ ARR and 700+ customers; in October 2025 it disclosed $350M+
              ARR, 750+ customers, and 1,250+ employees. That is real operating heft. The anti-thesis is not that the
              company lacks traction; it is that investors still do not know enough about the economics behind the
              traction. Gross margin, NRR, cash burn, services intensity, and top-customer concentration remain
              undisclosed, while competition from Databricks and hyperscalers keeps increasing. A fair valuation can
              become an overvaluation very quickly if the business is more services-heavy, more channel-dependent, or
              less sticky than its public narrative suggests.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
