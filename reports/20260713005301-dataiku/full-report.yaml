      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public visibility on Dataiku’s actual cost structure is poor, so the chapter has to separate what is
              observable from what is only inferable. Observable: Dataiku crossed $300M ARR in January 2025 and $350M
              ARR in October 2025, has not publicly announced a new round since the 2022 Series F, and was reportedly
              preparing for a possible U.S. IPO in late 2025. Sacra estimates roughly $846.8M of lifetime funding and
              about $342.5M ARR in September 2025, which broadly fits the company’s official disclosures. Inferable: a
              company operating at this scale likely spends heavily on enterprise sales, customer success, product
              development, cloud infrastructure, and partner enablement. But inferable is not good enough for
              underwriting. There is no public cash balance, no burn history, no debt disclosure of note, no retention
              metric, and no direct gross margin disclosure. The fair capital-adequacy readthrough is therefore
              cautious: nothing in the public record screams distress, but nothing lets an investor verify runway or
              financing dependency either. IPO optionality looks like a strategic choice, not a proven necessity.
