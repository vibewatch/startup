        title: What the product actually delivers
        blocks:
          - type: paragraph
            body: >-
              Dataiku is best understood as a shared operating layer for enterprise AI work rather than as a single
              modeling feature. The current product page frames the platform around three functions: people build,
              orchestration connects, and governance protects. That framing matches the underlying documentation. DSS
              combines visual data preparation, notebook-style code work, automation, deployment, and API access. Govern
              adds a separate oversight node for tracking AI initiatives, approvals, registries, and audit workflows.
              Current marketing around agents and governed AI highlights that Dataiku now wants to be where enterprises
              design, monitor, and route agentic workloads rather than just train classical ML models. The product
              therefore spans multiple personas: analysts, data scientists, ML engineers, platform owners, governance
              teams, and business stakeholders. The important technical implication is that Dataiku’s value is less
              about any one algorithm and more about coordinating heterogeneous human, data, model, and approval
