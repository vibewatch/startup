          label: Governance, training, and reusable assets make Dataiku part of the AI operating model
    approximationNotes: >-
      The journey synthesizes recurring patterns visible across Michelin, Prologis, Roche, Standard Chartered, and J&J
      case studies; not every customer follows each stage identically.
