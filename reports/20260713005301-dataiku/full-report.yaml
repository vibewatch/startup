      - number: '7.4'
        title: Financial opacity and IPO transmission risk
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is transmission: how a technical, regulatory, or customer issue would affect
              financing and valuation. Reuters reported that Dataiku hired Morgan Stanley and Citigroup in October 2025
              to prepare for a possible U.S. IPO, which means the company is operating under a higher implied scrutiny
              bar than a normal late-stage private software vendor. At the same time, public evidence still does not
              disclose core underwriting fields such as gross margin, NRR, cash burn, or top-customer share. That
              matters because these missing fields determine whether Dataiku can absorb a shock. A company with strong
              margins, deep cash, and diversified expansion can survive a delayed deal window or an implementation
              stumble; a company without those cushions can quickly lose negotiating leverage. The right risk framing is
              therefore not simply “IPO window risk.” It is that security flaws, compliance misses, partner friction, or
              stalled customer expansion could all transmit into weaker renewal assumptions, lower public-market
              comparables, or a longer private holding period before a credible listing. Dataiku's control posture and
              product relevance are meaningful mitigants, but the residual exposure remains above ordinary SaaS because
              the platform sits directly in enterprise AI governance and operational workflows, where failures travel
              quickly into trust, procurement, and valuation.
            claimRefs:
              - CR024
