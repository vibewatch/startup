chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and what Dataiku actually sells
        blocks:
          - type: paragraph
            body: >-
              Dataiku is a late-stage private enterprise software company founded in 2013 and now headquartered in New
              York, even though its roots and founding team are unmistakably French. The company still describes itself
              through the same core idea that powered its early growth: turning data and AI into an everyday operating
              capability rather than a specialist project. In 2026 its own language has shifted from the older "Everyday
              AI" framing toward "The Platform for AI Success," but the operating proposition is consistent — one
              control plane where business users, analysts, data scientists, engineers, and risk owners can build
              analytics, machine learning, and AI-agent workflows together. That positioning matters because Dataiku is
              not selling a single-model tool or a point AutoML product; it is selling orchestration, governance, and
              multi-user collaboration on top of customer data stacks. Archived plans pages and current partner
              materials show three durable deployment paths: hosted SaaS, customer-managed cloud, and
              on-prem/private-cloud installation. That deployment flexibility, plus no-, low-, and full-code workflows,
              is central to the company's value proposition and also explains why buyers tend to be large enterprises
              with heterogeneous infrastructure rather than SMBs looking for one-click AI.
