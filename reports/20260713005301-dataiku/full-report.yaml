      - number: '7.3'
        title: Dependency, customer, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Dataiku's go-to-market dependencies are also risk channels. The KPMG alliance shows that the company can
              win as part of a broader modernization and governance program, which is helpful for scale but can make
              partner quality and services economics more consequential. Customer stories repeatedly highlight
              interoperability with Snowflake, Azure, ServiceNow, PowerBI, and other systems. That interoperability is a
              strength, but it means connector breakage, cloud-policy changes, or model-provider disputes can propagate
              into customer dissatisfaction. The customer base itself is high quality but hard to underwrite. Public
              proof spans healthcare, banking, logistics, manufacturing, and capital markets, which is strategically
              attractive because regulated buyers care about governance. It is also operationally dangerous because
              these buyers are unforgiving when controls, documentation, or incident response fall short. Public sources
              still do not reveal top-customer concentration, partner-sourced pipeline, or NRR. Most of the rich
              evidence comes from vendor-curated flagship stories, not from independent cohort disclosures. On people
              and execution, the company has grown to more than 1,250 employees and is layering in senior commercial
              leadership while preparing for a possible IPO. That can improve discipline, but it also raises the odds
              that execution slippage in product, customer success, or partner management becomes visible at exactly the
              wrong moment.
