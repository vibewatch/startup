  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and the closest rivals
        blocks:
          - type: paragraph
            body: >-
              Dataiku's competitive set is wider than a single DSML shortlist. The practical buyer alternative set
              includes unified data-and-AI platforms such as Databricks, hyperscaler-native ML stacks such as Amazon
              SageMaker, Azure Machine Learning, and Vertex AI, plus narrower specialists such as DataRobot, H2O.ai, and
              Alteryx that solve adjacent jobs with different deployment and pricing assumptions. The most important
              distinction is that Dataiku is trying to be a neutral control layer across existing enterprise data
              estates, not the only place where storage, compute, and model serving happen. That makes Databricks the
              closest broad-platform peer because it now sells data, governance, MLOps, and agent tooling in one product
              family, while the hyperscalers compete by making AI another feature of existing cloud procurement. The
              specialists matter because they show where narrower time-to-value, AutoML, or analytics-automation motions
              can still divert budgets away from a full orchestration platform.
