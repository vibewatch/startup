      - CR023
      - CR034
      - CR038
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from real operating scale and customer proof on one side, and missing economics plus
      execution risk on the other.
    data:
      nodes:
        - id: a
          label: Scale proof
          detail: $300M+ then $350M+ ARR; 700+ then 750+ customers
        - id: b
          label: Customer quality
          detail: Blue-chip enterprise roster and governance-led use cases
        - id: c
          label: Comparable support
          detail: ~10-12x stale private ARR multiple is mid-band vs public comps
        - id: d
          label: Economic opacity
          detail: NRR, margins, burn, and concentration remain undisclosed
        - id: e
          label: Residual risk
          detail: Security, regulatory, implementation, and IPO transmission risk
        - id: f
          label: Recommendation
          detail: Track, medium confidence, fair valuation stance
      edges:
        - from: a
          to: f
          label: Supports value
        - from: b
          to: f
          label: Supports quality
        - from: c
          to: f
          label: Supports fairness
        - from: d
          to: f
          label: Caps conviction
        - from: e
          to: f
          label: Caps aggressiveness
    claimRefs:
