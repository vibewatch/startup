  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary — where Dataiku actually plays
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Dataiku's market is not all AI software and not even all machine learning.
              Dataiku sits in the governed enterprise AI orchestration layer: the software that lets organizations
              prepare data, develop analytics and models, operationalize AI workflows, and increasingly manage
              agent-based systems across multiple teams and infrastructures. That means the relevant market includes
              classic data-science-and-machine-learning platforms, MLOps tooling, AI-governance software, and parts of
              the emerging enterprise agent platform stack. It excludes raw cloud infrastructure, commodity API calls to
              standalone foundation-model providers, and lightweight point copilots that do not require workflow
              orchestration, multi-user governance, or deployment management. This distinction matters because the
              broadest market studies produce enormous TAMs, but those numbers include areas where Dataiku does not
              directly monetize. The practical substitute set is also mixed: hyperscalers bundle native tools,
              Databricks sells a lakehouse-plus-AI-control-plane alternative, and vendors like DataRobot, H2O.ai, and
              Alteryx cover adjacent automation or low-code analytics use cases. Dataiku wins when customers need one
              governed operating layer across these fragmented components rather than one more isolated tool.
            claimRefs:
