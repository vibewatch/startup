  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Security, regulatory, and implementation failures would likely transmit first into trust and expansion, then into
      valuation and financing optionality.
    data:
      nodes:
        - id: n1
          label: Security / compliance incident
          detail: CVE, privacy failure, or AI-governance miss
        - id: n2
          label: Customer trust erosion
          detail: Procurement slows; reference quality weakens
        - id: n3
          label: Expansion / renewal pressure
          detail: Longer sales cycles, weaker expansion, possible downgrades
        - id: n4
          label: ARR quality uncertainty
          detail: Opacity on NRR and margin magnifies downside
        - id: n5
          label: IPO / financing delay
          detail: Public-market readiness weakens
        - id: n6
          label: Valuation compression
          detail: Lower multiple or longer hold period
      edges:
        - from: n1
          to: n2
          label: Trust damage
        - from: n2
          to: n3
          label: Commercial friction
        - from: n3
          to: n4
          label: Revenue quality uncertainty
        - from: n4
          to: n5
          label: Readiness falls
        - from: n5
          to: n6
          label: Exit value weakens
        - from: n1
          to: n5
          label: Direct scrutiny
