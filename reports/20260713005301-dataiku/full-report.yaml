        - Company finance
      - - Gross margin
        - Software, hosting, and services gross margin split
        - Determines where Dataiku sits inside public comp band
        - Company finance
      - - NRR / churn
        - Cohort retention and downgrade history
        - Separates real platform durability from curated case studies
        - Company RevOps
      - - Cash and burn
        - Cash balance, burn, runway, financing plan
        - Tests downside resilience if IPO timing slips
        - Company finance / board
      - - Customer concentration
        - Top-10 revenue share and segment mix
        - Validates breadth implied by 750+ customers
        - Company sales / finance
      - - Partner economics
        - Partner-sourced bookings and services attach
        - Shows whether partner leverage helps or hurts quality of growth
        - Company partnerships
      - - Preference stack
        - Current liquidation preferences and dilution overhang
        - Matters for late-stage entry economics
        - Company legal / finance
    notes: These are the minimum missing data points needed to move from a track stance to a committed price call.
