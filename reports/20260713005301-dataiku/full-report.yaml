      - number: '7.2'
        title: Security and operational reliability risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk profile is elevated because Dataiku is not a narrow feature product. It spans data
              access, notebooks, APIs, automation, model deployment, governance, and now agentic-AI orchestration, which
              means the attack surface is inherently broad. OpenCVE shows that Dataiku DSS has had significant disclosed
              vulnerabilities, including a critical 9.8 authentication-bypass issue disclosed in June 2025 and a series
              of older access-control and information-disclosure problems. That does not prove weak security culture by
              itself—every mature enterprise platform has to patch issues—but it does prove that patch discipline
              matters materially. The operational shape of the product also creates a split risk model. In self-managed
              deployments, Dataiku says it does not process or store client data by default, which reduces vendor
              data-custody exposure but shifts more configuration, availability, and security burden to the customer
              environment. In Dataiku Cloud, the company becomes a more direct control point for incident handling and
              subprocessor management while also inheriting risk from cloud-provider infrastructure. Gartner review
              content adds another practical risk: at least one critical review headline on the fetched page points to
              private-cloud integration friction. That is important because implementation complexity, not just software
              defects, is often what converts a technically sound platform into a commercially painful rollout.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR030
              - CR032
              - CR036
