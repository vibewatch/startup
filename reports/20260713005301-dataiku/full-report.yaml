      - number: '2.2'
        title: Sizing lenses — big market, but multiple legitimate denominators
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for Dataiku's opportunity spans an unusually wide range because analysts are
              measuring overlapping but non-identical categories. At the broadest level, Fortune Business Insights puts
              global machine-learning software spend at $65.28 billion in 2026, while Precedence Research puts it at
              $126.91 billion in the same year. Neither number is wrong in a strict sense; they are simply broad.
              Narrower category lenses are more useful for underwriting Dataiku. MarketsandMarkets sizes MLOps at $5.9
              billion by 2027, AI governance at $5.78 billion by 2029, and AI Studio at $32.7 billion by 2029. Those
              narrower lenses more closely map to the governed development, deployment, and monitoring surfaces where
              Dataiku monetizes. The right analytical conclusion is not to choose one TAM and defend it, but to preserve
              the range and explicitly show why Dataiku may capture pieces of all three layers. For valuation work, this
              chapter treats broad ML market studies as ceiling context, MLOps and AI-governance studies as closer
              proxies for the company's current SAM, and the AI-studio framing as a bridge category that explains why
              the market can widen as agents and governance converge.
            claimRefs:
