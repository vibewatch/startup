      - number: '3.3'
        title: Switching costs and distribution power
        blocks:
          - type: paragraph
            body: >-
              Dataiku's real moat is not a single model or proprietary data asset; it is the operating convenience of
              governed collaboration across heterogeneous tools, clouds, and user types. That matters most in
              enterprises that already run Snowflake, Databricks, AWS, Google Cloud, and internal code-based tooling in
              parallel. In that context, Dataiku can win as the orchestration and governance layer that spans the stack.
              But the same architecture creates its main strategic vulnerability: hyperscalers can start from the
              buyer's existing contract, identity system, and cloud data gravity, while Databricks can start from
              ownership of the data-and-compute workflow itself. Public partner pages show Dataiku leaning into
              coexistence rather than rip-and-replace, which broadens distribution and reduces isolation. Specialists
              still have room where the buyer wants narrow time-to-value or low-code automation, but they generally lack
              the same breadth of ecosystem leverage or disclosed capital scale as the largest platform rivals. It also
              means the sales contest is often decided by integration credibility and change-management comfort, not
              just by raw model features.
