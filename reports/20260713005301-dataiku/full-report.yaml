  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention shortfall
        - Private NRR or renewal cohorts materially below enterprise-software norms
        - Undermines land-and-expand and premium-multiple logic
        - Downgrade to wait / reprice
      - - Gross-margin weakness
        - Software gross margin materially below strong-platform expectations
        - Suggests services or hosting drag is larger than the market narrative implies
        - Move toward bear case
      - - Security / regulatory event
        - Material breach, enforcement action, or major control failure near IPO process
        - Hits trust, procurement, and exit timing simultaneously
        - Cut fair-value range
      - - Growth deceleration
        - Updated ARR bridge shows slower growth than implied by 2025 disclosures
        - Reduces premium-multiple support
        - Re-underwrite using lower-band comps
      - - Customer concentration
        - Top-customer share or partner dependence is too high
        - Makes revenue quality less durable than logo count implies
        - Apply liquidity and concentration discount
      - - IPO slippage
        - IPO path slips while disclosures remain weak
        - Extends private hold and increases valuation-mark risk
        - Stay on track, do not pay premium
    notes: >-
