  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Dataiku's highest residual risks combine regulatory breadth, security patch discipline, and customer/financial
      opacity rather than a single existential fault line.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual risk
      rows:
