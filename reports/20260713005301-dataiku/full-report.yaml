            body: >-
              The positive verdict is straightforward: Dataiku has real scale, recurring revenue, and enough category
              credibility to be discussed alongside IPO candidates rather than private experiments. The negative verdict
              is equally straightforward: the public record still does not reveal enough to underwrite margin path, cash
              efficiency, or dilution risk with confidence. ARR milestones, customer breadth, and platform positioning
              all support the idea of a high-quality enterprise software business. Yet the missing fields remain the
              ones that separate an interesting private company from an investable one: net revenue retention, gross
              margin, services mix, CAC payback, sales productivity, current cash, burn, and contractual backlog.
              Public-company comparisons are useful only as guardrails. Snowflake shows what strong software economics
              can look like; C3.ai shows how execution problems and services intensity can compress them. Dataiku
              plausibly sits somewhere between those poles, but the exact position is unknowable from public evidence.
              The right underwriting stance is therefore not bearish on traction, but disciplined on missing economics.
