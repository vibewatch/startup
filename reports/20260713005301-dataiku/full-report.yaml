          - type: callout
            title: The valuation is fair only if the hidden metrics are healthy
            body: >-
              At roughly 10.6x ARR on the latest official milestone, Dataiku is not obviously overvalued versus public
              AI/data peers. But that fairness collapses quickly if gross margin, NRR, or concentration are weaker than
              investors expect.
            calloutType: risk
            claimRefs:
              - CV020
