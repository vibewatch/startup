      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The primary market driver is the shift from AI experimentation to governed production use. Dataiku's own
              releases frame that move explicitly, and the partner pages show why: enterprises want GenAI and agent
              capabilities without losing control over cost, data lineage, or deployment standards. Trust and governance
              are therefore not just risk controls; they are demand creators. But the category's main constraints are
              equally visible. Deloitte's 2025 poll found only a small minority already using agentic AI in finance and
              accounting, with trust as the top barrier. SiliconANGLE and the 2026 arXiv industry study reinforce the
              same message from different angles: data quality, integration, verification, and human oversight remain
              bottlenecks. Observer adds the economic readthrough that returns may take years, not quarters, when
              architectures are complex. For Dataiku, this means the market is attractive precisely because the problem
              is hard — but also that sales cycles, proof requirements, and implementation friction will remain
              significant. The company benefits from the need for governance and orchestration, yet that same need slows
              category penetration and keeps a fully constrained SAM/SOM analysis incomplete without internal win-rate
              and budget data.
