  topStrengths:
    - $350M+ ARR、750+ 客户和 1,250+ 员工，支撑它具备真实后期企业级规模。
    - 治理优先的定位，切中企业对可信、可审计 AI 和智能体工作流的需求。
    - 作为私有基础设施厂商，Dataiku 的客户验证异常扎实，Michelin、Novartis、Roche、Prologis、Standard Chartered 和 SLB 都有具名结果。
    - 虽然 $3.7B 估值锚点已经不新，但放到上市 AI / 数据软件可比公司倍数里看，大致处于中段，而不是泡沫高点。
  topRisks:
    - 毛利率、NRR、流失、现金消耗和客户集中度仍未披露，压住了估值信心。
    - Databricks、超大规模云厂商和相邻上市数据 / AI 平台的竞争，可能压缩扩张假设和估值倍数。
    - EU AI Act 和其他企业合规要求抬高门槛，安全、隐私和 AI 治理义务还在变宽。
    - IPO 时点可能放大任何实施、监管或客户留存失误的影响。
  unresolvedGaps:
    - 除 2025 年 10 月 $350M+ ARR 里程碑外，没有当前经审计财务披露，也没有 2026 ARR 衔接数据。
    - 没有公开披露毛利率、NRR、GRR、流失或客户集中度。
    - 合作伙伴带来的销售管线、服务收入占比，以及真实实施强度都缺少公开清晰度。
    - 当前现金、烧钱速度，或未来融资可能带来的清算优先权压力，都没有公开视图。
