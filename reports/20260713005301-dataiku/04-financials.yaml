    {
      "id": "sales-motion-and-unit-economics-proxies",
      "title": "Sales motion and unit-economics proxies",
      "body": "Dataiku’s product and customer pattern imply a classic enterprise land-and-expand motion, but the hard unit-economics fields remain undisclosed. Large customers, partner ecosystems, and cloud-agnostic deployment all point to long sales cycles, high ACVs, and multistakeholder procurement, while the 2025 ARR milestones show that the model can scale beyond pilot stage. The best public proxies come from adjacent public companies. C3.ai’s filings and FY2026 results show how enterprise AI software can remain overwhelmingly subscription-led while still carrying services and prioritized engineering work that supports deployment and roadmap acceleration. Snowflake’s annual report shows the opposite end of the monetization spectrum: a consumption-led model with very high product margins, substantial remaining performance obligations, and strong operating cash generation, but also less linear revenue visibility because customers can optimize usage. Taken together, those comps suggest the real underwriting question for Dataiku is not whether the company has traction; it is whether services intensity, cloud costs, and partner economics allow the business to converge toward strong software margins as ARR scales.",
