    "number": 4,
    "title": "Financials",
    "summary": "Public evidence supports that Dataiku has grown into a large recurring-revenue enterprise software business, crossing $300M ARR in January 2025 and $350M ARR in October 2025 without announcing new primary financing after its 2022 Series F. What remains missing is exactly what matters most for underwriting: revenue mix, gross margin, cash burn, retention, and runway."
  },
  "sections": [
    {
      "id": "revenue-model-and-monetization",
      "title": "Revenue model and monetization",
      "body": "The public record is strong enough to identify Dataiku’s commercial shape even if it is not strong enough to model it precisely. Dataiku is clearly a recurring enterprise software business, not an ad-supported product, a marketplace, or a purely usage-metered API vendor. Its own 2025 releases frame growth in ARR, not bookings or services revenue, and its archived plans page shows a structured progression from free or small-team entry into deeper automation, deployment, security, and governance capability. Current product pages reinforce that the platform is sold around breadth: orchestration, governance, agents, and enterprise data controls. That suggests the buyer is purchasing a cross-functional control plane whose value increases with deployment scope, not a single-module point solution. The key nuance is that public materials do not disclose realized list pricing or exact revenue recognition mechanics. Compared with Databricks and the hyperscalers, Dataiku appears more contract-oriented and less transparently usage-priced, which may improve budget predictability but also leaves outsiders unable to benchmark realized economics from public information alone.",
