  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Dataiku's true market is narrower than the broad machine-learning software TAM but wider than pure MLOps: it sits in the governed enterprise AI orchestration layer spanning DSML, deployment, governance, and emerging agent platforms. Public market studies support a large and fast-growing category, but they also show why disciplined investors should preserve multiple sizing lenses and take enterprise trust, integration, and ROI friction seriously."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary \u2014 where Dataiku actually plays",
      "body": "The cleanest way to define Dataiku's market is not all AI software and not even all machine learning. Dataiku sits in the governed enterprise AI orchestration layer: the software that lets organizations prepare data, develop analytics and models, operationalize AI workflows, and increasingly manage agent-based systems across multiple teams and infrastructures. That means the relevant market includes classic data-science-and-machine-learning platforms, MLOps tooling, AI-governance software, and parts of the emerging enterprise agent platform stack. It excludes raw cloud infrastructure, commodity API calls to standalone foundation-model providers, and lightweight point copilots that do not require workflow orchestration, multi-user governance, or deployment management. This distinction matters because the broadest market studies produce enormous TAMs, but those numbers include areas where Dataiku does not directly monetize. The practical substitute set is also mixed: hyperscalers bundle native tools, Databricks sells a lakehouse-plus-AI-control-plane alternative, and vendors like DataRobot, H2O.ai, and Alteryx cover adjacent automation or low-code analytics use cases. Dataiku wins when customers need one governed operating layer across these fragmented components rather than one more isolated tool.",
