    {
      "id": "buyers-and-adoption-path",
      "title": "Buyers, users, and the enterprise adoption path",
      "body": "The buyer map for Dataiku is structurally enterprise-heavy. Broad research says large enterprises dominate ML spending, and Dataiku's own customer surface confirms it: pharma, banking, logistics, manufacturing, insurance, and exchange operators recur across public references. The usual economic buyer is a CIO, CDO, analytics or data-platform lead, or a transformation owner sitting over a governed data budget. The user base is wider than that buyer base. Snowflake, AWS, and Google Cloud partnership materials all emphasize business and domain experts, not only data scientists, which means the platform category is bought centrally but monetized through broad internal usage. Dataiku's archived packaging hints at the standard land-and-expand motion: free or small-team entry is possible, but the real product value emerges when customers need automation, deployment, approval workflows, and broader governance. Systems integrators matter because buyers often need operating-model change, not just software installation. KPMG's alliance and Snowflake's 300+ joint-customer claim both show that ecosystems help carry the product into large-account transformation programs where procurement cycles are long and cross-functional.",
