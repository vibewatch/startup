      claimRefs: [CO002]
  foundingLocation: Paris, France
  headquarters: New York, New York, USA
  productSummary: >-
    A unified platform for analytics, machine learning, AI governance, and agentic-AI orchestration,
    combining no-code, low-code, and full-code workflows with cloud and model optionality.
  customerFocus: >-
    Large enterprises across healthcare, manufacturing, financial services, logistics, and other
    regulated or operationally complex sectors.
  businessModel: >-
    Enterprise software subscription model sold around platform breadth, governance, and deployment
    flexibility, supported by partner-led transformation and customer expansion inside large accounts.
  stage: Series F (private)
  fundingStatus: >-
    $200M Series F at a $3.7B valuation in December 2022; no newer primary round is publicly confirmed,
