companyProfile:
  summary: >-
    Dataiku is a French-founded, New York-headquartered enterprise AI platform company founded in 2013.
    It positions itself as a governed orchestration layer where analysts, engineers, data scientists,
    and business users can collaboratively build analytics, machine-learning models, and AI agents across
    cloud, on-prem, and hybrid environments. Public evidence shows the company scaled to $350M+ ARR,
    750+ customers, and 1,250+ employees by October 2025 while preparing for a possible U.S. IPO.
  foundedDate: '2013-01-01'
  founders:
    - name: Florian Douetteau
      role: CEO & Co-founder
      background: Longtime public face of Dataiku and continuing commercial and strategic leader.
      claimRefs: [CO002, CO006]
    - name: Clément Stenac
