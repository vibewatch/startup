  topStrengths:
    - "$350M+ ARR, 750+ customers, and 1,250+ employees support genuine late-stage enterprise scale."
    - "Governance-first positioning fits enterprise demand for trusted, auditable AI and agent workflows."
    - "Customer proof is unusually strong for a private infrastructure vendor, with named results across Michelin, Novartis, Roche, Prologis, Standard Chartered, and SLB."
    - "A stale $3.7B valuation anchor now screens as roughly mid-band against public AI/data software comp multiples rather than peak-bubble territory."
  topRisks:
    - "Gross margin, NRR, churn, cash burn, and concentration remain undisclosed, capping valuation confidence."
    - "Competition from Databricks, hyperscalers, and adjacent public data/AI platforms can compress expansion assumptions and multiples."
    - "Security, privacy, and AI-governance obligations are widening under the EU AI Act and other enterprise compliance expectations."
    - "IPO timing can amplify the impact of any implementation, regulatory, or customer-retention stumble."
  unresolvedGaps:
    - "No current audited financial disclosure or 2026 ARR bridge beyond the October 2025 $350M+ milestone."
    - "No public gross-margin, NRR, GRR, churn, or customer-concentration disclosure."
    - "No public clarity on partner-sourced pipeline, services mix, or the true degree of implementation intensity."
    - "No public view into current cash, burn, or liquidation-preference overhang if a future financing occurs."
