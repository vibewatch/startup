evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board roster, independence mix, observer rights, and governance committee structure.
    whyItMatters: Late-stage private governance quality matters for IPO readiness, investor protections, and decision control.
    diligencePath: Request a current board deck, charter documents, and post-Series-F governance map from management.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash on hand, burn profile, debt obligations, and secondary liquidity terms since Series F.
    whyItMatters: Without cash and liquidity data, the difference between IPO optionality and IPO necessity cannot be judged.
    diligencePath: Request monthly cash, burn, runway, and debt schedules plus any 2024-2026 secondary transactions.
    relatedQuestionRefs:
      - QO018
      - QO024
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: current-arr
    missingEvidence: A post-October-2025 update on ARR, growth rate, and customer count as of the run date.
    whyItMatters: >-
      The valuation stance in chapter 8 depends on whether 2025 momentum persisted into 2026 rather than peaked before
      IPO prep.
    diligencePath: Ask management for 2026 YTD ARR, customer count, NRR, and sales pipeline conversion data.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: founder-roles
    missingEvidence: Current operating or board responsibilities for Thomas Cabrol and Marc Batty.
    whyItMatters: This shapes key-person dependence and the depth of founder continuity beyond the CEO/CTO pair.
    diligencePath: Confirm current roles through management bios, org charts, or board materials.
    relatedQuestionRefs:
      - QO002
  - type: stale
    severity: material
    topic: ipo-readiness
    missingEvidence: >-
      Whether an S-1 draft exists, what workstreams the banks were hired to complete, and whether the IPO timeline
      slipped.
    whyItMatters: >-
      IPO timing determines exit optionality, messaging discipline, and whether valuation needs to clear a public-market
      window soon.
    diligencePath: Request banker materials, readiness checklists, and a current capital-markets plan from management and counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: constrained-sam
    missingEvidence: >-
      A public source that isolates spend specifically on governed enterprise AI orchestration platforms with
      multi-person workflow control.
    whyItMatters: Broad ML and narrow MLOps studies bracket the opportunity, but neither directly measures Dataiku's exact SAM.
    diligencePath: Request management's internal category sizing, win/loss segmentation, and budget-ownership analysis by vertical.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Pipeline mix by buyer type, partner-sourced demand, and deployment model split.
    whyItMatters: >-
      These determine whether the category scales primarily through central platform budgets or distributed departmental
      expansion.
    diligencePath: Request CRM segmentation by buyer persona, sourced pipeline, and deployment choice.
    relatedQuestionRefs:
      - QM015
      - QM024
  - type: conflicting-data
    severity: minor
    topic: tam-variance
    missingEvidence: Comparable methodology notes that reconcile why broad ML market estimates differ so widely.
    whyItMatters: Without preserving variance, later valuation work can overstate certainty around TAM.
    diligencePath: Collect full analyst methodology sections or triangulate using public-company revenue pools.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: implementation-roi
    missingEvidence: Median time-to-value, services dependency, and renewal behavior for Dataiku deployments by vertical.
    whyItMatters: Category attractiveness depends not only on demand but on deployment friction and realized ROI.
    diligencePath: Request customer cohort implementation data and post-go-live expansion metrics.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: material
    topic: realized-tco
    missingEvidence: Negotiated contract pricing, discount ladders, and services mix for Dataiku and its peers.
    whyItMatters: Public list prices do not reveal real platform economics or margin structure in enterprise accounts.
    diligencePath: >-
      Request redlined order forms, realized cloud bills, and implementation statements of work from matched customer
      cohorts.
    relatedQuestionRefs:
      - QP020
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-by-cloud
    missingEvidence: Win/loss and renewal data segmented by AWS-, Azure-, GCP-, Databricks-, and Snowflake-centered accounts.
    whyItMatters: That data determines whether Dataiku's neutrality is actually durable or only a greenfield wedge.
    diligencePath: Request CRM win/loss reporting, renewal notes, and pipeline conversion by ecosystem anchor.
    relatedQuestionRefs:
      - QP015
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: current-specialist-pricing
    missingEvidence: Current detailed list pricing for DataRobot, H2O.ai, and Alteryx enterprise packages in fetched public materials.
    whyItMatters: >-
      Without public specialist pricing, the packaging comparison can only compare transparency and model type, not
      realized cost parity.
    diligencePath: Request vendor quotes or procurement screenshots for comparable enterprise bundles.
    relatedQuestionRefs:
      - QP020
      - QP023
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: datarobot-current-health
    missingEvidence: >-
      High-reputation, recent third-party reporting that reconciles DataRobot's current revenue, customer base, and
      valuation after its post-2021 reset.
    whyItMatters: Available adverse evidence is directionally useful but lower quality than filing-grade public-company data.
    diligencePath: Look for lender, secondary-market, or board-level disclosures; request management's competitive-intelligence pack.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: Share of bookings and deployments sourced or influenced by large ecosystem partners.
    whyItMatters: >-
      Partner leverage can be either a moat amplifier or a hidden dependency if the same partners steer customers to
