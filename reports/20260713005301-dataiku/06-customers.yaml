    {
      "id": "named-customer-proof-and-outcomes",
      "title": "Named customer proof and outcomes",
      "body": "Dataiku's public proof set is unusually rich for a private infrastructure-software company because many customer stories include named executives, concrete workflows, and quantified outcomes. The best evidence is operational rather than vanity-logo based. Novartis reported a 90% reduction in time to insight for a GenAI use case and a 600% acceleration in spreadsheet-driven data ingestion. Michelin said a root-cause analysis process that previously took up to six months can now run in about an hour, and that more than 600 engineers and technicians across more than ten factories rely on a Dataiku-based parameters-analyzer solution. Prologis said it moved from five productionalized data-science products to 30 projects and 30 APIs in active use while putting over 60 AI/ML projects into production. Roche described months-to-days build-time compression for new GenAI projects, six-figure annual attorney-hour savings, and a planned expansion from 80 European patent professionals to as many as 250 users globally. Geodis, Euronext, Perdue Farms, Standard Chartered, SLB, and Mitsubishi Electric all publish similarly specific productivity or decision-support improvements. The key caveat is that these are vendor-curated customer stories, so they prove real deployment and outcomes for named accounts but not the typical experience across the full customer base.",
