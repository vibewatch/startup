    {
      "id": "adoption-trajectory-and-scale-signals",
      "title": "Adoption trajectory and scale signals",
      "body": "The strongest commercial readthrough is that Dataiku appears to be moving from a large enterprise platform into a broad installed base with deeper internal usage. Sacra estimated roughly 500 customers at the end of 2023, and that benchmark lines up directionally with official disclosures showing 700-plus customers by January 2025 and 750-plus by October 2025. Several case studies show not just logo acquisition but widening internal adoption. Johnson & Johnson's Vision organization says more than 80 analytics and data-science professionals adopted Dataiku and the page headline states 650-plus employees use Dataiku. Michelin expanded from 35 users in 2021 to 1,500-plus users across 50-plus factories by mid-2025, with 80% of users described as business experts. Standard Chartered reported 518 staff completed its citizen-data-science program since 2020 and more than 700 completed online Dataiku training courses, while Prologis said over 2,000 users leverage AI through its enterprise ChatGPT deployment built with Dataiku. These are not perfect retention metrics, but they are meaningful deployment-scale signals showing that Dataiku often lands as a platform and then broadens within the customer organization.",
