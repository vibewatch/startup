      "id": "durability-retention-and-adverse-readthroughs",
      "title": "Durability, retention, and adverse readthroughs",
      "body": "Public evidence on customer quality is strongest on adoption breadth and outcome anecdotes, and weakest on renewal mechanics. Dataiku does not publicly disclose net revenue retention, gross retention, churn, contract lengths, top-customer concentration, or share of ARR from the ten largest accounts. Gartner's 2026 review surface is directionally positive, with a 75% five-star and 23% four-star distribution on the page fetched for this run, and Dataiku's January 2025 release cited a 96% Gartner willingness-to-recommend score. But the same Gartner page also contains a critical review headline describing cloud-integration issues, which matters because difficult enterprise integration is exactly where AI-platform rollouts can stall. FeaturedCustomers and TrustRadius confirm a visible review and case-study corpus, but they do not solve the core underwriting questions around renewals or concentration. The fair readthrough is that Dataiku likely enjoys meaningful switching costs inside successful enterprise deployments because workflows, governance, and nontechnical user habits accumulate over time; however, that durability remains medium-confidence until private retention cohorts and concentration schedules are disclosed.",
