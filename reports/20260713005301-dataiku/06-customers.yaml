    {
      "id": "expansion-motion-and-ecosystem-leverage",
      "title": "Expansion motion and ecosystem leverage",
      "body": "The commercial motion visible in public materials is land-and-expand via platform standardization, citizen enablement, and partner-assisted enterprise transformation. Case studies repeatedly start with a single operational pain point, but they end with broader governed analytics and AI adoption. Michelin began with digital manufacturing and then spread across factories, R&D, and corporate functions. Prologis moved from descriptive analytics into geospatial analysis, predictive modeling, and enterprise GenAI. Roche started with patent-search pilots before consolidating multiple GenAI projects into an agentic interface. The KPMG alliance indicates Dataiku is also sold through modernization and governance programs rather than only direct software procurement, while the 2025 Frontrunner Awards show customers being recognized for agentic AI, governance, and productivity use cases across multiple industries. This expansion logic matters because it suggests Dataiku's best accounts are sticky not only because of models in production, but because the platform becomes an organizational workflow, training, and governance layer. What remains unknown is how much pipeline comes through partners, how much revenue is marketplace or services influenced, and whether expansion is broad across the long tail or concentrated in a smaller set of flagship accounts.",
