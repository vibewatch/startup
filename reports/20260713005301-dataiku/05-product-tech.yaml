    },
    {
      "id": "roadmap-dependencies-and-product-risks",
      "title": "Roadmap, dependencies, and product risks",
      "body": "Release notes make clear that Dataiku is shipping on an ongoing enterprise cadence rather than resting on an older DSS core. The version 14 release stream shows repeated updates in June and July 2026 across agentic AI and RAG, LLM Mesh, governance, MLOps, AI assistants, data quality, Git, security, and code tooling. That supports a maturity thesis: Dataiku is not a pilot-era platform. At the same time, the roadmap evidence also highlights dependencies and risk. Release notes mention Python version changes, Java minimum-version bumps, Llama model removals, container-image and OS changes, and cloud-stack cautions. Those are normal signals for a real enterprise platform, but they also confirm that Dataiku’s product depends on underlying cloud, OS, model, and open-source ecosystems remaining stable. External product proof is thinner than official docs. Gartner review evidence still includes at least one criticism around private-cloud integration, and the public surface does not provide benchmarked performance, uptime SLAs, or quantified agent accuracy. For diligence, the main product question is not breadth; it is operational depth and implementation friction.",
