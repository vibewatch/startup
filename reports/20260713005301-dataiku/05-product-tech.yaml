  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Dataiku’s product surface has evolved from a data-science workbench into a broader enterprise AI control plane spanning visual workflows, code APIs, governance, agent orchestration, and deployment operations. Public docs and release notes show a mature and actively shipped platform with meaningful governance depth and programmable interfaces, although external proof on performance, reliability, and integration friction is thinner than the breadth of the marketing surface."
  },
  "sections": [
    {
      "id": "what-the-product-delivers",
      "title": "What the product actually delivers",
      "body": "Dataiku is best understood as a shared operating layer for enterprise AI work rather than as a single modeling feature. The current product page frames the platform around three functions: people build, orchestration connects, and governance protects. That framing matches the underlying documentation. DSS combines visual data preparation, notebook-style code work, automation, deployment, and API access. Govern adds a separate oversight node for tracking AI initiatives, approvals, registries, and audit workflows. Current marketing around agents and governed AI highlights that Dataiku now wants to be where enterprises design, monitor, and route agentic workloads rather than just train classical ML models. The product therefore spans multiple personas: analysts, data scientists, ML engineers, platform owners, governance teams, and business stakeholders. The important technical implication is that Dataiku’s value is less about any one algorithm and more about coordinating heterogeneous human, data, model, and approval workflows in one controlled environment.",
      "claimRefs": [
