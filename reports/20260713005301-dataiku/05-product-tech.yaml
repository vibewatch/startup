    {
      "id": "architecture-deployment-and-apis",
      "title": "Architecture, deployment, and APIs",
      "body": "The most consistent product theme across official pages, archived packaging, partner pages, and technical docs is flexibility. Dataiku is documented as supporting SaaS, customer-managed cloud, and on-prem or private-cloud styles of operation. It exposes visual interfaces for non-coders but also a full developer surface through APIs, code recipes, notebooks, scenarios, and client tooling. The Python API reference explicitly says Dataiku tools can be used anywhere code runs inside DSS, while the open GitHub API client and README show that external automation against the platform is not an internal-only capability. Partnership pages with AWS, Google Cloud, Databricks, and NVIDIA further imply that Dataiku is architected to sit on top of customer infrastructure and external AI stacks rather than replace them. That is strategically important: the platform’s technical identity is orchestration-first and integration-first. It also means that dependencies on cloud, model, and partner ecosystems are a feature of the design, not an accidental by-product.",
      "claimRefs": [
        "CE007",
        "CE008",
