    },
    {
      "id": "trust-security-and-governance-controls",
      "title": "Trust, security, and governance controls",
      "body": "Governance is not a thin checkbox layer in the public Dataiku story; it is one of the main product pillars. The govern product page and the Govern documentation both describe centralized project tracking, asset registries, workflow approvals, signoff rules, and audit timelines. Public materials also connect these controls directly to regulatory pressure, explicitly naming EU AI Act readiness and shadow-AI reduction. The technical docs go further by describing Standard and Advanced govern licenses, with advanced features for GenAI registries, custom governance templates, custom actions, and scripting. Security evidence is more mixed but still credible. Dataiku’s security page and security documentation show active security operations, while a 2026 warning page documents response guidance for Linux local-privilege-escalation vulnerabilities affecting Dataiku environments. The company’s SOC 2 announcement is dated and should not be treated as a full current certification inventory, but it still adds evidence that formal compliance work has been part of the product and operating story for years.",
      "claimRefs": [
        "CE005",
        "CE006",
