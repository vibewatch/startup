    {
      "id": "final-diligence-and-kill-triggers",
      "title": "Final diligence and thesis-break triggers",
      "body": "The remaining work before a firm buy call is not philosophical; it is documentary. Investors need a current ARR bridge through runDate, a gross-margin decomposition, NRR and churn cohorts, top-customer concentration, partner-sourced pipeline, services mix, cash and burn, and the preference stack if a future round or IPO occurs. These asks matter because the multiple debate is no longer academic. Dataiku is already large enough that missing economics, not missing demand, now dominate the risk. The thesis breaks if retention is materially weaker than the customer stories imply, if security or regulatory issues interrupt IPO timing, if ARR growth slows below the expectations embedded in a $3.7B+ mark, or if partner dependence turns out to be compensating for weak direct product leverage. Until those questions are answered, the correct posture is disciplined proximity rather than maximal conviction. It also means secondary or crossover investors should resist treating the absence of bad news as equivalent to proof of premium economics.",
