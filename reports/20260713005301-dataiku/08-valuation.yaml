    {
      "id": "financing-context-and-public-comp-bridge",
      "title": "Financing context and public comp bridge",
      "body": "Dataiku's most recent disclosed private mark remains the December 2022 Series F at $3.7B. Since then, public operating milestones improved while the valuation anchor did not publicly reset, which is unusual but analytically useful. Using the last disclosed mark, Dataiku traded at about 12.3x ARR on the January 2025 $300M milestone and about 10.6x ARR on the October 2025 $350M milestone; Sacra's roughly $342.5M September 2025 estimate implies about 10.8x. Those are not cheap multiples, but they are also not public-market peak territory for elite AI or data-platform assets. Public market-cap-to-revenue proxies show a wide band: roughly 58.2x for Palantir, 25.0x for Datadog, 19.4x for Snowflake, 11.2x for MongoDB, 9.6x for Confluent, 8.0x for ServiceNow, and 4.6x for C3.ai. Dataiku's stale private multiple therefore sits closer to the middle of the public range than the extremes. The valuation question is not whether the company deserves any premium; it is where inside that wide band a private, opaque, enterprise-governance AI platform should trade.",
