  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Dataiku's last disclosed private valuation, $3.7B from the December 2022 Series F, now sits against a much larger operating base: $300M+ ARR in January 2025 and $350M+ ARR in October 2025. That stale mark implies roughly 10.6x ARR on the latest official milestone—expensive relative to weaker public AI software names, but still below premium public data/AI multiples such as Snowflake, Datadog, and especially Palantir. The evidence supports a track recommendation with medium confidence, medium-high risk, and a fair current valuation stance rather than a clear bargain or obvious overvaluation."
  },
  "sections": [
    {
      "id": "thesis-antithesis",
      "title": "Investment thesis and anti-thesis",
      "body": "The bull case for Dataiku is straightforward. It has genuine enterprise scale, disclosed ARR milestones, a blue-chip customer roster, a governance-heavy product narrative that fits the current enterprise AI moment, and a still-private valuation mark that has not obviously outrun revenue in the way some AI names have. In January 2025 Dataiku disclosed $300M+ ARR and 700+ customers; in October 2025 it disclosed $350M+ ARR, 750+ customers, and 1,250+ employees. That is real operating heft. The anti-thesis is not that the company lacks traction; it is that investors still do not know enough about the economics behind the traction. Gross margin, NRR, cash burn, services intensity, and top-customer concentration remain undisclosed, while competition from Databricks and hyperscalers keeps increasing. A fair valuation can become an overvaluation very quickly if the business is more services-heavy, more channel-dependent, or less sticky than its public narrative suggests.",
