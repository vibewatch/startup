summary:
  headline: >-
    Kailera is one of the best-capitalized public obesity biotechs and already has unusually strong precommercial
    efficacy positioning, but public investors still need global Phase 3 confirmation before the valuation case
    graduates from a catalyst-driven track posture to a clear buy.
