  topStrengths:
    - >-
      Lead injectable ribupatide already sits in global Phase 3 with one of the strongest prelaunch obesity efficacy
      signals in the field.
    - >-
      Kailera entered public markets with an unusually deep capital base that appears sufficient to reach major clinical
      catalysts.
    - >-
      Management and board bring repeat biotech-exit, obesity-commercialization, and public-company operating
      experience.
    - The pipeline spans multiple modalities and mechanisms, reducing dependence on a single oral or injectable format.
  topRisks:
    - >-
      The core value driver is still a 2028 binary KaiNETIC Phase 3 readout, leaving investors exposed to a long
      catalyst gap.
    - >-
      Most efficacy proof outside the lead global program still originates from Hengrui-run China studies and carries
      translation risk.
    - >-
      Kailera depends heavily on one licensing and supply relationship with Hengrui while also owing large milestone and
      royalty obligations.
    - >-
      Obesity competition is unusually intense, with Lilly, Novo, Viking, Structure, and others racing across injectable
      and oral formats.
    - >-
      The company remains pre-revenue, with no payer contracts, customer cohorts, or launch-access proof to offset
      clinical and reimbursement uncertainty.
  unresolvedGaps:
    - >-
      Detailed Hengrui license economics by trigger, termination right, and operational responsibility beyond disclosed
      milestone and royalty ranges.
    - Verified headcount, functional staffing plan, and operating-burn trajectory beyond Q1 2026.
    - Kailera-specific payer-access strategy, pricing corridor, and launch sequencing assumptions.
    - >-
      Evidence that China-generated ribupatide and KAI-7535 data reproduce cleanly in global populations and trial
      designs.
    - Any interim KaiNETIC enrollment or safety disclosures that would reduce the long wait to 2028 topline data.
