        - Sell KAI-7535 value; monitor KAI-9531
      - - Thesis-break
        - KaiNETIC interim or topline data showing <15% mean weight loss globally
        - 2027–2028
        - "Near-tirzepatide-equivalence destroys commercial differentiation thesis"
        - Reassess; potential full exit
      - - Thesis-break
        - Lilly or Novo launch injectable program exceeding ribupatide's 23.6% China signal
        - 2026–2028
        - "Eliminates best-in-class injectable claim even before global proof"
        - Materially negative; revisit thesis
    notes: Triggers are event-driven and should be re-evaluated at each significant clinical milestone, competitor announcement, or quarterly financial disclosure. The most important single trigger is KaiNETIC Phase 3 enrollment and data timing integrity.
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051

  - id: TV007
    title: Final Diligence Asks and Open Questions
    columns:
      - Priority
      - Topic
      - Specific ask
      - Why it matters
    rows:
      - - P1
        - KaiNETIC Phase 3 design
        - Obtain full protocol; confirm primary endpoints, non-inferiority/superiority benchmarks, and any tirzepatide comparator arm
        - "If KaiNETIC is placebo-controlled only, differentiation from tirzepatide requires indirect comparison — weakening the commercial case even if the trial succeeds"
      - - P1
        - Hengrui license agreement
        - Review termination clauses, milestone schedule, co-development obligations, and change-of-control provisions
        - Single-licensor dependency; contract terms determine whether Kailera retains rights after a Phase 3 failure or a potential acquirer deal
      - - P1
        - China-to-global regulatory bridging plan
        - Understand FDA and EMA written feedback on extent to which KaiNETIC can rely on Hengrui China Phase 2 data
        - If FDA requires U.S.-only Phase 2 data before KaiNETIC results are accepted, timeline and cost estimates change materially
      - - P2
        - KAI-7535 hepatic safety protocol
        - Confirm prespecified liver enzyme monitoring endpoints in global Phase 2 obesity trial design
        - lotiglipron and TERN-601 failures were driven by hepatic signals; absence of hepatic monitoring pre-specification would be a diligence gap
      - - P2
        - Orforglipron launch impact on oral ribupatide market sizing
        - Obtain or construct market share model for oral ribupatide given orforglipron's first-mover oral GLP-1 position
        - If orforglipron establishes oral GLP-1 standard before oral ribupatide completes Phase 3, the oral program's commercial ceiling is lower
      - - P3
        - Cash-burn trajectory under all-4-programs advancement
        - Request updated multi-year pro forma cash model under optimistic (all Phase 3s proceed) and conservative (2 programs deprioritized) scenarios
        - At $300M+/year burn, a single program delay that extends runway requirements could force dilutive financing before 2028 data
    notes: P1 = highest priority; P2 = secondary; P3 = important but less time-sensitive. All asks should be addressed before initiating a position larger than a starter tracking stake.
    claimRefs:
      - CV047
      - CV050
      - CV051
      - CV052

