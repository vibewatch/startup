  - id: valuation-framework
    title: "Valuation Framework: Sum-of-Parts, rNPV, and Market Opportunity"
    body: >-
      Valuing a pre-commercial, pipeline-dependent biotech like Kailera requires a risk-adjusted net present value (rNPV) sum-of-parts approach rather than revenue multiples or EV/EBITDA, since the company generates no revenue and all value derives from probability-weighted pipeline commercialization. The iValuate framework and the Analysis Group practitioner's guide both identify rNPV as the industry standard for such companies, applying stage-specific probability of success (PoS) factors from the Biotechnology Innovation Organization's clinical success rate data. BIO's 2024 data show a Phase 3-to-regulatory approval success rate of approximately 59% for small-molecule programs and approximately 47% for biologics; Phase 2 to Phase 3 transition is historically approximately 58%. For ribupatide injection at Phase 3, the pipeline-wide PoS is approximately 35–55% depending on whether the obesity indication and China-to-global bridging risk are discounted. The Analysis Group paper calculates discount rates of 10–15% for late-stage assets, consistent with the range used to discount Kailera's ribupatide injection cash flows.


      The global anti-obesity drug market is the revenue ceiling for rNPV modeling. JPMorgan Global Research estimates the incretin market will reach $200 billion by 2030, with approximately 25 million Americans on GLP-1 treatment by 2030. Precedence Research sizes the anti-obesity drug segment at $64.96 billion by 2035 (CAGR 24.71% from 2026), while Fortune Business Insights projects $67.16 billion by 2034 (CAGR 29.2%). Consistent with these estimates, the total addressable U.S. obesity population exceeds 100 million adults, and payer access expansion under the BALANCE CMS program (announced late 2025, seeking $50/month Medicare GLP-1 copay cap) could dramatically expand market penetration. In this context, even a 2–5% share of the global injectable obesity market at peak represents $2–$5 billion in peak sales for ribupatide injection, supporting high-teens to low-twenties percent probability-of-success discount rates to produce a $500 million to $2 billion net present value for the program alone.


      The net pipeline EV implied by the $16 IPO price ($770 million) assigns an average PoS-weighted NPV of roughly $190 million per program — a figure that appears conservative relative to precedent transactions for single-program assets at similar or earlier stages. The market appears to be applying a significant China-data haircut, which is appropriate given that all Phase 2 evidence for ribupatide, KAI-7535, and KAI-4729 comes from Hengrui-conducted trials in Chinese participants that must be bridged to global populations. The Phase 1 SAD bridging study conducted by Kailera in Australia confirmed similar pharmacokinetics across Asian and non-Asian participants, but regulators will require substantially more than a single-dose bridging study to validate Chinese Phase 2 efficacy as the primary basis for global registration.
