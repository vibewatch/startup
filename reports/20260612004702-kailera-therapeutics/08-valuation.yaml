  - id: bull-base-bear-scenarios
    title: "Bull, Base, and Bear Scenarios with Probability-Weighted Valuation"
    body: >-
      The base case assigns a probability of successful KaiNETIC Phase 3 data at approximately 35–45% (below the historical 59% Phase 3 success rate for small molecules, discounted for China-to-global bridging risk, competitive execution risk, and dose selection uncertainty). At that PoS range and applying a 12–15% discount rate to ribupatide injection peak sales of $3.5–$5 billion (2% to 3% global obesity market share by 2033), the program's rNPV contribution to enterprise value ranges from $800 million to $2 billion, depending on dose, label breadth, and competitive position. Adding oral ribupatide at a deeper China-to-global bridging discount (Phase 2 complete, Phase 3 not yet started), KAI-7535 (Phase 2 obesity data 2027; small-molecule DILI risk discounted), and KAI-4729 (Phase 1 MAD; earliest stage; exploratory value), the total sum-of-parts rNPV in the base case is $3.0–$5.0 billion fully diluted. That corresponds to a per-share range of approximately $23–$39 at the current share count, representing 45–145% upside to the $16 IPO price.


      The bull case ($7–$10 billion) requires KaiNETIC data confirming ribupatide injection efficacy at ≥20% mean weight loss in a global Phase 3 (matching or exceeding tirzepatide), combined with oral ribupatide Phase 3 initiation (1H'2027) on schedule and KAI-7535 Phase 2 obesity topline positive (2027). In this scenario, Kailera could command a strategic acquisition premium similar to Metsera/Pfizer, making it a plausible $6–$9 billion takeover target. The bear case ($1.0–$1.5 billion) reflects a scenario where KaiNETIC data are negative, significantly inferior to tirzepatide, or complicated by a safety signal, in which case the company's value would be limited to cash ($1.3 billion) minus ongoing burn, plus residual value in the non-ribupatide programs (KAI-7535 and KAI-4729 would retain some value as early-stage assets).


      The most important qualitative risk that the quantitative scenarios cannot fully capture is the competitive compression from Lilly and Novo. Orforglipron is at the regulatory submission stage for both T2D and obesity, and will establish daily oral GLP-1 prescriber habits and payer access before Kailera's oral programs complete Phase 3. Pfizer's lotiglipron discontinuation (liver enzymes) and Terns' TERN-601 failure (efficacy and DILI) are cautionary precedents for oral small-molecule programs. If VK2735 oral Phase 3 data arrive before ribupatide oral Phase 3 completes, Viking could establish the oral dual-agonist category with first-mover advantage. These competitive dynamics compress Kailera's addressable market opportunity and require Kailera to prove best-in-class efficacy, not just sufficient efficacy, to achieve a differentiated commercial position.
