  - id: FV004
    title: "Recommendation Logic Flow — Kailera TRACK Rationale"
    type: flow
    layout: standard
    summary: Decision logic supporting TRACK recommendation; key uncertainties are Phase 3 data timing (2028) and China-to-global efficacy translation; buy conditions require catalyst confirmation.
    approximationNotes: Flow represents analytical decision logic, not a mechanical algorithm. All branches reflect available evidence as of June 2026.
    data:
