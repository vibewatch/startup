companyProfile:
  summary: >-
    Kailera Therapeutics is a Delaware-incorporated obesity biotech founded in May 2024 and now
    listed on Nasdaq as KLRA. It licensed four GLP-1-based candidates from Jiangsu Hengrui
    Pharmaceuticals, with lead injectable ribupatide already in global Phase 3, oral ribupatide and
    KAI-7535 in Phase 2, and KAI-4729 in Phase 1. The company moved unusually quickly from
    formation to scale capital formation, raising large Series A and Series B rounds before a
    $718.8 million IPO in April 2026. Its public case is strongest on financing depth, leadership
    pedigree, and late-stage obesity positioning, while the main unresolved question is whether the
    China-led efficacy package can be reproduced in global registrational studies before the market
    gets even more competitive.
  foundedDate: '2024-05-08'
  foundingLocation: Delaware, USA
  headquarters: Waltham, Massachusetts, USA
  productSummary: >-
    Four clinical-stage obesity therapies spanning once-weekly injectable ribupatide, once-daily
    oral ribupatide, once-daily oral small-molecule GLP-1 agonist KAI-7535, and once-weekly
    injectable tri-agonist KAI-4729.
  customerFocus: >-
    Future obesity patients, prescribers, and payers, with strategic relevance also to large-pharma
    commercialization and partnering counterparties.
  businessModel: >-
    Pre-revenue biotech model funded by equity capital today, with future value expected from
    approved obesity medicines and potential partnering, licensing, or strategic-transaction
    outcomes.
  stage: 'Clinical-stage public biotech / Nasdaq: KLRA'
  fundingStatus: >-
    Approximately $1.62 billion raised since inception through large private rounds and an April
    2026 IPO; management guides that cash and marketable securities plus IPO proceeds fund
    operations into mid-2028.
