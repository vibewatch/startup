      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Record IPO and blue-chip syndicate validate pipeline thesis
            body: >-
              Kailera's $718.8 million IPO—the largest biotech IPO in history—and its blue-chip investor syndicate
              including Bain Capital (both PE and LS arms), QIA, Atlas Venture, RTW Investments, and CPP Investments
              signal extraordinary institutional conviction in the obesity category and in ribupatide's differentiated
              profile. The 63% first-day trading premium further confirms market appetite.
            calloutType: strength
            claimRefs:
              - CO036
              - CO039
              - CO042
          - type: callout
            title: Single-source pipeline from a Chinese pharma creates geopolitical concentration risk
            body: >-
              Every Kailera product candidate was originally discovered and developed by Jiangsu Hengrui
              Pharmaceuticals. Termination or impairment of the Hengrui License Agreement—whether through commercial
              dispute, regulatory action, or geopolitical disruption—would eliminate Kailera's entire pipeline. The
              S-1/A enumerates this risk at length and it remains the most structurally distinctive adverse feature of
              the company profile.
            calloutType: risk
            claimRefs:
              - CO005
              - CO006
              - CO043
              - CO054
          - type: callout
            title: 2028 Phase 3 topline creates a multi-year binary clinical risk horizon
            body: >-
              KaiNETIC topline data is not expected until 2028, meaning investors who bought the IPO have accepted a
              two-plus year wait for the primary efficacy readout. This is consistent with Phase 3 obesity trial
              timelines but means the stock will trade on incremental clinical signals (Phase 2b high-dose data in 2027,
              oral ribupatide Phase 3 initiation, additional Hengrui China data) rather than definitive regulatory
              events for the foreseeable future.
            calloutType: insight
