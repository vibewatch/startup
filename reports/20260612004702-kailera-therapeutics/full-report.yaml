      - number: '7.2'
        title: Hengrui, China Geopolitical, and BIOSECURE Risks
        blocks:
          - type: paragraph
            body: >-
              Kailera's central dependency is not abstract partner risk but a single upstream relationship with Hengrui
              that touches asset origin, core know-how, historical data, and current drug supply. Filings state that all
              four product candidates were licensed exclusively from Hengrui for territories outside Greater China and
              that Hengrui remains the primary manufacturer for clinical supply. That concentration makes Kailera
              unusually sensitive to cross-border policy change, data-provenance diligence, and contract interpretation.


              BIOSECURE crystallizes that exposure. Congress.gov and the BIOSECURE information site both indicate
              enactment in December 2025 with a five-year grandfathering window for existing contracts. That delays
              immediate disruption but does not solve the problem: Kailera still faces a 2030 decision point if
              Hengrui-linked manufacturing or service relationships remain exposed. Because the company has not publicly
              disclosed a substitute manufacturing network, step-in plan, or asset migration timetable, the risk is best
              viewed as deferred concentration rather than removed concentration.


              China-origin development data create a second layer of dependence. Kailera benefits from Hengrui's prior
              clinical work and the disclosed NMPA NDA activity around ribupatide, but FDA review of ex-China filings
              can still turn on data quality, comparability, and CMC transfer evidence. Investors therefore should treat
              Hengrui as both the main accelerator of Kailera's timeline and the main transmission channel through which
              policy, legal, and geopolitical shocks could impair value.
