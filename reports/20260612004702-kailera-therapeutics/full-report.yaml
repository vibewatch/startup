  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: IPO Economics and Post-IPO Financing Context
        blocks:
          - type: paragraph
            body: >-
              Kailera's April 2026 IPO established the company's public entry point and capital base. The offering
              priced at $16 per share — the top of the revised $14–$16 range — and sold 39,062,500 primary shares before
              the underwriter exercised its full greenshoe option for an additional 5,859,375 shares, bringing total
              shares sold to 44,921,875 and gross proceeds to $718.8 million before underwriting discounts and offering
              expenses. Kailera began trading on the Nasdaq Global Select Market under the ticker symbol KLRA on April
              17, 2026. Fierce Biotech noted the offering set a new benchmark for biotech IPOs.


              As of March 31, 2026 (immediately pre-IPO), Kailera held $111.8 million in cash and cash equivalents,
              $407.3 million in short-term marketable securities, and $62.7 million in long-term marketable securities,
              totaling approximately $581.9 million. After incorporating IPO proceeds net of underwriting fees
              (approximately $685–$695 million net), Kailera's combined cash base exceeded $1.2 billion and management
              stated that combined cash and proceeds are expected to fund operations into mid-2028. At 129,565,608 total
              shares outstanding as of May 20, 2026, the IPO market capitalization was approximately $2.07 billion at
              the $16 offering price. The most recent pre-IPO funding was a $600 million Series B financing closed in
              October 2025 led by Bain Capital Private Equity with participation from CPP Investments, QIA, T. Rowe
              Price, Royalty Pharma, Adage Capital Management, and Janus Henderson; the Series B investor syndicate
              joined Atlas Venture, Bain Capital Life Sciences, and RTW Investments as existing investors.


              The IPO entry price of $16 implies a net pipeline enterprise value (market cap minus cash) of roughly $770
              million. This is the key valuation anchor: the market at IPO was attributing approximately $770 million to
              the probability-weighted future commercialization value of four clinical-stage programs across injectable
              ribupatide (Phase 3), oral ribupatide (Phase 2 complete), KAI-7535 (Phase 2), and KAI-4729 (Phase 1 MAD).
              The rate of cash consumption matters: at Q1 2026 levels ($78.9 million net loss; $70.9 million R&D, $13.8
              million G&A), the annual burn rate exceeds $300 million, implying that without additional financing
              events, the cash base supports approximately four additional years of operation — reaching beyond the 2028
              KaiNETIC data target.
