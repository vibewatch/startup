companyProfile:
  summary: >-
    Kailera Therapeutics is a Delaware-incorporated obesity biotech founded in May 2024 and now listed on Nasdaq as
    KLRA. It licensed four GLP-1-based candidates from Jiangsu Hengrui Pharmaceuticals, with lead injectable ribupatide
    already in global Phase 3, oral ribupatide and KAI-7535 in Phase 2, and KAI-4729 in Phase 1. The company moved
    unusually quickly from formation to scale capital formation, raising large Series A and Series B rounds before a
    $718.8 million IPO in April 2026. Its public case is strongest on financing depth, leadership pedigree, and
    late-stage obesity positioning, while the main unresolved question is whether the China-led efficacy package can be
    reproduced in global registrational studies before the market gets even more competitive.
