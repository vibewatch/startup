  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: severe-obesity injectable tier first, oral tier second'
        blocks:
          - type: paragraph
            body: >-
              Kailera's relevant market is not all obesity care, not general wellness, and not even every GLP-1
              prescription. The company's own framing points to a narrower and more investable boundary. Ribupatide
              injectable is a Phase 3 once-weekly GLP-1/GIP dual agonist being advanced specifically for people who need
              substantial weight reduction, with Kailera explicitly emphasizing the BMI 35+ population as the
              fastest-growing and largest segment of obesity care. That makes the lead opportunity the
              highest-weight-loss injectable tier of the obesity-drug market, where physicians and patients care
              primarily about magnitude of weight loss rather than convenience alone. A second, adjacent market is the
              oral obesity-convenience tier represented by oral ribupatide and KAI-7535. A third and broader market lens
              is the total incretin-based obesity category measured by IQVIA and public spending sources. The practical
              conclusion is that Kailera is not a single-modality oral story. It is a public company trying to win first
              in severe-obesity injectables while preserving optionality to expand into oral segments if the data and
              payer access justify it.
