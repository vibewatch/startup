      - number: '4.3'
        title: Capital adequacy and runway
        blocks:
          - type: paragraph
            body: >-
              Kailera's balance sheet at the time of the IPO is exceptional by any clinical-stage biotech standard. As
              of March 31, 2026, the company held $581.9 million in cash, cash equivalents, and marketable securities
              before counting the April 2026 IPO proceeds. The IPO raised $718.8 million gross ($625 million base at
              $16/share plus full exercise of the overallotment option for an additional $93.8 million). After estimated
              underwriting discounts of approximately $46 million, net IPO proceeds were approximately $672.7 million.
              Management's stated use-of-proceeds guidance covers continued development of ribupatide across the
              KaiNETIC and Phase 2b programs, advancement of oral ribupatide, KAI-7535, and KAI-4729 through their
              respective next milestones, working capital, and general corporate purposes. Combined with pre-IPO cash,
              the post-IPO liquidity base approaches $1.25 billion, which management projects as sufficient to fund
              operations into mid-2028. That guidance implies a blended quarterly burn of roughly $84–100 million,
              broadly consistent with the Q1 2026 operating expense run rate. The runway projection depends on the
              number and pace of patients enrolled across six programs — any acceleration of enrollment or addition of
              new programs would shorten it. The company will require additional capital before its products could
              generate commercial revenue, making the 2026–2027 window for follow-on equity raises or partnership
              transactions the key financing execution risk. Prior financing history (Series A $400M closed October
              2024, Series B $600M October 2025, then the IPO) demonstrates the management team's ability to access
              large pools of capital, but each successive round at clinical-stage pricing implies significant ongoing
              dilution and dependence on a favorable biotech capital market.
