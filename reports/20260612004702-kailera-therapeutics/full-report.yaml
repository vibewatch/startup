          detail: GSBR-1290 Phase 2a positive; ~$1.2B net pipeline EV (approx.)
          tone: neutral
        - label: Metsera — M&A comp
          x: 6
          'y': 4.9
          detail: Pfizer paid $4.9B upfront; Phase 2 injectable + Phase 1 oral at acquisition
          tone: positive
        - label: Petrelintide (Zealand-Roche deal)
          x: 4
          'y': 1.65
