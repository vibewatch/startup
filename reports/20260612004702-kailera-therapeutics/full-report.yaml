      - number: '7.3'
        title: Manufacturing, Supply Chain, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Kailera's operating model is fast because it externalizes much of the hard work to Hengrui and a broader
              trial network, but that speed comes with unusually high operational fragility. Injectable ribupatide, oral
              ribupatide, and KAI-7535 all require dependable CMC execution while Kailera simultaneously runs three
              pivotal trials, a high- dose expansion, and a new Phase 2 study. Public materials support the existence of
              this activity but do not disclose batch reproducibility, alternate supplier qualification, release
              specifications, validation progress, or contingency manufacturing if Hengrui supply is interrupted.


              Oral programs magnify the issue. Oral ribupatide still depends on peptide formulation discipline, and
              KAI-7535 adds small-molecule scale-up and dose-exposure optimization risk at the same time that Lilly's
              approved oral orforglipron resets convenience expectations. Even the company's favorable China
              tolerability disclosures do not eliminate execution risk when studies expand across multiple countries,
              CROs, trial sites, and comparator arms.


              Operationally, the risk is not one catastrophic failure but compounding slippage: a supply interruption
              can slow enrollment, a CMC delay can postpone regulatory interactions, and a late operational miss can
              force capital to be consumed before differentiating data arrive. Because Kailera has not publicly
              disclosed a diversified supplier map or detailed resourcing plan, residual exposure remains high despite
              the strong cash balance.
            claimRefs:
              - CR014
              - CR016
              - CR020
              - CR021
              - CR022
              - CR024
