      - number: '6.4'
        title: Repeat use remains the hardest commercial unknown
        blocks:
          - type: paragraph
            body: >-
              Even if Kailera eventually wins prescriptions, retention still determines whether those prescriptions
              become attractive customers. AAFP highlights how weak obesity-drug persistence can be in practice, and
              competitor oral data show that convenience does not eliminate tolerability-driven discontinuation. Kailera
              has no commercial refill history, no disclosed NRR or GRR, and no public satisfaction data because it has
              nothing on market yet. That means today's diligence can only use public GLP-1 benchmarks as a proxy, and
              those proxies are not comforting. The practical consequence is that Kailera's commercial thesis should not
              be underwritten from initiation demand alone. It needs a future answer to a much harder question: can the
              company create enough durable efficacy, affordability, and support to keep people on therapy after the
              first prescription? Until there is a marketable product and real refill behavior, repeat-use economics
              remain a major gap.
