    title: 'Public Obesity Biotech Positioning: Net Pipeline EV vs. Clinical Maturity'
    type: quadrant
    layout: standard
    summary: >-
      Kailera's net pipeline EV of ~$770M appears low relative to clinical maturity (Phase 3 lead) when compared to
      Viking, Zealand, and M&A comps; reflects China-data discount and 2028 binary wait.
    approximationNotes: >-
      Net pipeline EV estimated as approximate public market capitalization minus reported or estimated cash. Clinical
      maturity scored 1–10 (1=Phase 1 only, 10=marketed). Values are approximate based on publicly available Q2 2026
      data. M&A comps plotted at deal value minus estimated cash at time of deal.
