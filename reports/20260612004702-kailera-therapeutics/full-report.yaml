  - id: FV001
    title: Kailera Valuation KPI Dashboard
    type: kpi
    layout: standard
    summary: >-
      Core valuation metrics for Kailera at IPO price; net pipeline EV of ~$770M appears conservative relative to M&A
      precedents and Phase 3 PoS-adjusted rNPV.
    approximationNotes: >-
      Market cap and net pipeline EV derived from IPO price ($16) × post-IPO shares (129,565,608 from Q1 2026 10-Q).
      Post-IPO cash is estimated from pre-IPO balance sheet plus net IPO proceeds.
    data:
      items:
        - label: IPO market capitalization
          value: ~$2.07 billion
          detail: $16/share × 129,565,608 shares; Kailera began trading April 17, 2026
          tone: neutral
        - label: Net pipeline enterprise value
          value: ~$770 million
          detail: Market cap minus estimated post-IPO cash of ~$1.3 billion
          tone: neutral
        - label: Post-IPO cash and securities
          value: ~$1.27 billion
          detail: Pre-IPO $581.9M + net IPO proceeds ~$690M; runway into mid-2028
          tone: positive
        - label: Q1 2026 quarterly burn rate
          value: $78.9 million net loss
          detail: $70.9M R&D + $13.8M G&A; four parallel clinical programs
          tone: warning
        - label: Estimated annual run rate
          value: ~$316 million/year
          detail: Based on Q1 burn; burn likely increases as Phase 3 ramps
          tone: warning
        - label: Net pipeline EV per program (simple average)
          value: ~$193 million per program
          detail: $770M / 4 programs; far below M&A precedent for comparable-stage assets
          tone: positive
        - label: Comparable M&A precedent (Metsera/Pfizer)
          value: $4.9B upfront for 2-program portfolio
          detail: Phase 2 injectable + Phase 1 oral; sets strategic acquisition ceiling
          tone: positive
        - label: Bull-to-bear upside/downside range
          value: $8–$77/share
          detail: Bear $8–$12; Base $23–$39; Bull $54–$77; all vs. $16 IPO price
          tone: neutral
