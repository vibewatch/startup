  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: No current commercial customers means the chapter is really a stakeholder-conversion map
        blocks:
          - type: paragraph
            body: >-
              Kailera is still a clinical-stage biotechnology company with no approved products and no product revenue.
              That matters because there are no current enterprise accounts, no signed payer wins, and no renewal
              cohorts to analyze the way one would for a commercial healthcare company. Instead, the relevant
              “customers” are the future stakeholder groups that must convert for commercialization to work: patients
              living with obesity, prescribers who decide whether the data justify use, payers who decide whether the
              product is affordable enough to cover, and potential pharma partners who may help commercialize,
              co-develop, or validate the platform. Kailera's website positioning supports that framing because it
              emphasizes giving people options across different treatment journeys rather than selling a single narrowly
              scoped obesity product. The presence of Jamie Coleman, who most recently ran the Zepbound brand at Lilly,
              strengthens this section of the story: commercial know-how is already in the building even though customer
              revenue is not.
