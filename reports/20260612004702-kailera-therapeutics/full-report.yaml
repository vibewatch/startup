  - id: FV004
    title: Recommendation Logic Flow — Kailera TRACK Rationale
    type: flow
    layout: standard
    summary: >-
      Decision logic supporting TRACK recommendation; key uncertainties are Phase 3 data timing (2028) and
      China-to-global efficacy translation; buy conditions require catalyst confirmation.
    approximationNotes: >-
      Flow represents analytical decision logic, not a mechanical algorithm. All branches reflect available evidence as
      of June 2026.
    data:
      nodes:
        - id: N1
          label: Best non-incumbent efficacy signal (23.6% at 36w)
          detail: Ribupatide injection Phase 2 China data; no-plateau; favorable safety
          tone: positive
        - id: N2
          label: Net pipeline EV ~$770M — appears undervalued vs. M&A comps
          detail: Metsera at $4.9B; petrelintide at $1.65B upfront; comparable or weaker signals
          tone: positive
        - id: N3
          label: China-data discount applies (all data from Hengrui China trials)
          detail: Global Phase 3 must bridge to Western populations; bridging study supports PK similarity
          tone: warning
        - id: N4
          label: 2-year binary wait (KaiNETIC data 2028)
          detail: Primary proof-point >2 years away; capital tied up in binary; competitive field advancing
          tone: warning
        - id: N5
          label: TRACK — monitor catalysts before adding
          detail: Enter starter tracking position; do not initiate full buy until catalyst confirmation
          tone: neutral
        - id: N6
          label: BUY trigger — KaiNETIC interim or oral Ph3 start (2027)
          detail: If KaiNETIC interim confirms ≥18% or oral ribupatide Ph3 starts on schedule
          tone: positive
        - id: N7
          label: SELL/EXIT trigger — Phase 3 failure or serious safety signal
          detail: KaiNETIC <15% globally or Grade ≥3 hepatic in KAI-7535
          tone: warning
      edges:
        - from: N1
          to: N2
          label: Supports upside thesis
        - from: N2
          to: N3
          label: But constrained by
        - from: N3
          to: N4
          label: Compounds risk with
        - from: N4
          to: N5
          label: Therefore
        - from: N5
          to: N6
          label: Upgrade condition
        - from: N5
          to: N7
          label: Downgrade condition
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
      - CV048
