  - id: FU001
    title: Future stakeholder journey map
    type: journey-map
    layout: wide
    summary: >-
      Kailera's future customer path runs from obesity need to evidence review, coverage approval, initiation, and
      repeat use rather than from logo sale to renewal.
    data:
      items:
        - id: need
          label: Clinical need emerges
          actor: Patient and clinician
          description: Obesity or overweight plus comorbidity is recognized as requiring pharmacologic support.
          channels:
            - Physician visit
            - Specialist referral
            - Patient self-identification
        - id: evidence
          label: Evidence review
          actor: Prescriber
          description: Clinician evaluates Phase 3 and oral-program data for efficacy, safety, and usability.
          channels:
            - Clinical data
            - Medical congresses
            - Competitor benchmarks
        - id: coverage
          label: Coverage decision
          actor: Payer / PBM / CMS
          description: Budget owner decides if the therapy is reimbursed and under what restrictions.
          channels:
            - Formulary review
            - Prior authorization
            - Bridge models
        - id: start
          label: Therapy start
          actor: Patient
          description: Patient initiates therapy if access, education, and tolerability hurdles are cleared.
          channels:
            - Prescription
            - Specialty pharmacy
            - Patient support
        - id: persist
          label: Repeat use
          actor: Patient + payer + physician
          description: Refills depend on durable efficacy, affordability, and GI tolerability.
          channels:
            - Refill behavior
            - Follow-up visits
            - Coverage renewal
        - id: expand
          label: Platform expansion
          actor: Partner / prescriber / investor
          description: If the lead works, oral programs and partnerships widen Kailera's future customer map.
          channels:
            - BD discussions
            - Lifecycle planning
            - Launch preparation
