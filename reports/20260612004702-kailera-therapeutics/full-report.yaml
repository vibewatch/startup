        title: Prescriber demand and payer pathways exist, but Kailera still has to earn them specifically
        blocks:
          - type: paragraph
            body: >-
              The broader market does provide real demand signals. CMS's BALANCE model and the Medicare GLP-1 Bridge
              show that public access to selected obesity GLP-1 use is expanding in 2026, and KFF shows why this matters
              financially: GLP-1 spending in Medicare is already large even before broad obesity coverage arrives. On
              the prescriber side, Fierce Pharma's reporting on a Spherix survey suggests that physicians, especially
              PCPs, are highly interested in oral obesity options, while IQVIA said oral Wegovy captured about one-third
              of new-to-brand prescriptions in its first eight weeks. Those signals support the idea that route of
              administration can widen the market. But they are still analogs, not Kailera-specific wins. Kailera has
              not disclosed any payer agreement, formulary placement, or commercial pricing corridor. So the commercial
              interpretation is positive but constrained: future customers likely exist, yet Kailera still must prove
