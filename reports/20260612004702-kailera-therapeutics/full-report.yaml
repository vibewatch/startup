  - id: TM002
    title: Kailera obesity-market sizing lenses
    columns:
      - Lens
      - Metric
      - Current value
      - Forward trajectory
      - Limitation
      - Implication for Kailera
    rows:
      - - Global obesity burden
        - Adults living with obesity
        - '890000000'
        - Still rising; over 1 billion people affected when broader WHO framing is used
        - Patient counts are not reimbursed TAM
        - Confirms massive underlying need before payer filtering
      - - U.S. obesity burden
        - Adult obesity / severe obesity prevalence
        - 40.3% / 9.7%
        - BMI 35+ share expected to rise through 2030
        - Prevalence is not equal to treated demand
        - Supports focus on severe-obesity cohorts that need more weight loss
      - - Global diabetes overlap
        - Adults with diabetes
        - '589000000'
        - 853 million projected by 2050; >90% type 2
        - Diabetes is adjacent, not identical, to obesity indication demand
        - Creates coverage and prescriber adjacency for obesity entrants
      - - Global obesity-medicines market
        - List-price sales
        - 66B in 2025; 92B in 2026
        - 105B to 200B from 2027 onward
        - Range mixes multiple scenarios and adoption assumptions
        - Kailera does not need category creation; it needs differentiated share
      - - Medicare budget pressure
        - Gross Part D GLP-1 spending
        - 27.5B in 2024
        - Coverage pilots may expand while negotiated pricing begins in 2027
        - Public spending is not equivalent to obesity-only coverage
        - Shows why payer affordability matters as much as efficacy
      - - Macro burden
        - Economic and health-system burden
        - Large and rising
        - Policy pressure should continue globally
        - Macro burden does not guarantee reimbursement
        - Supports long-term demand narrative but not near-term pricing power
    notes: >-
      This table intentionally mixes prevalence, drug-sales, and budget-impact lenses because no single public TAM
      estimate cleanly matches Kailera's Phase 3 plus oral-pipeline footprint.
