  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pre-revenue status
        blocks:
          - type: paragraph
            body: >-
              Kailera has generated no revenue from product sales since its incorporation on May 8, 2024. The Q1 2026
              10-Q, the 424B4 final prospectus, and every company press release uniformly confirm that Kailera does not
              have any products approved for commercial sale and has no licensing, royalty, or collaboration revenue to
              report. The company is wholly dependent on equity capital to fund operations. The intended monetization
              path is conventional for a clinical-stage biotech: first, earn product sales revenue if ribupatide
              (KAI-9531) or follow-on assets secure FDA approval — the earliest plausible date for KaiNETIC topline
              readout is 2028 and subsequent NDA filing and review would add at least another 12–18 months. Second,
              pursue regional or global partnership deals that could generate upfront payments, development-funding
              milestones, and royalties prior to a product launch. Third, monetize assets acquired through the Hengrui
              right of first refusal on future metabolic candidates, although the ROFR terms are not fully spelled out
              in public filings. None of these monetization paths produces revenue in the current reporting period. The
              company does earn non-trivial interest income on its cash and marketable securities — $5.8 million in Q1
              2026, which partially offsets the operating loss and results in a reported net loss of $78.9 million
              versus operating expenses of $84.7 million. That interest income is a function of cash balances and rates,
              not a business model, and will compress as the cash is deployed into clinical spending. The revenue
              picture for this chapter is therefore entirely prospective: the analyst must underwrite Kailera on the
              timeline, probability, and value of clinical milestones rather than present-day revenue quality.
