      - number: '2.2'
        title: 'Multi-lens sizing: huge disease burden, huge category sales, but not a clean Kailera SAM'
        blocks:
          - type: paragraph
            body: >-
              The disease burden behind obesity pharmacotherapy is unmistakably large. WHO says more than 890 million
              adults were living with obesity in 2022 and Kailera's S-1/A frames obesity as affecting more than one
              billion people globally. In the United States, CDC's latest update put adult obesity at 40.3% and severe
              obesity at 9.7%, while diabetes remains a major adjacent pool with 40.1 million U.S. people affected and
              589 million adults globally. Those are need metrics, not reimbursed market metrics. The more relevant
              financial lens is drug spending. IQVIA estimated global obesity-medicine sales of $66 billion in 2025 and
              $92 billion in 2026, with much wider scenarios after 2027. That is already blockbuster-scale demand, but
              it still does not isolate Kailera's serviceable share. Public evidence can size the category and its
              growth rate; it cannot yet cleanly separate a Kailera-specific SAM by BMI band, payer line, or
              injectable-versus-oral mix. The disciplined view is that the top-down TAM is unquestionably large, while
              the bottom-up paid launch population remains evidence-constrained.
