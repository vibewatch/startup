  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Kailera's Starting Position
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set for Kailera spans at least four distinct substitution groups, all solving the
              same obesity-treatment job from different directions. The first group is the marketed injectable
              incumbents: Novo's semaglutide (Wegovy) and Lilly's tirzepatide (Zepbound) have already trained
              prescribers, payers, and patients on what best-in-class injectable obesity therapy looks and feels like,
              and both companies are deploying commercial infrastructure that dwarfs anything a clinical-stage biotech
              can match. The second group is the near-launch oral small molecules: Lilly's orforglipron is at the
              regulatory submission stage in 40-plus countries and has demonstrated superiority to oral semaglutide in a
              head-to-head trial. The third group is the competitive next-wave: Viking VK2735 oral, Novo oral amycretin,
              and Structure GSBR-1290 are all showing meaningful Phase 2 efficacy and represent likely Phase 3
              contemporaries to Kailera's oral programs. The fourth group is adjacent high-value bets: Zealand and
              Roche's petrelintide amylin deal and Pfizer's $4.9 billion Metsera acquisition signal that large pharma
              will keep paying to fill obesity pipeline gaps, which both validates Kailera's category and raises M&A
              scarcity pricing for competing assets.


              Kailera's starting position in this landscape is credible and differentiated in ways that matter. The
              company entered the public market in April 2026 with a $718.8 million IPO — the largest biotech IPO in
              recent memory — funded by a $400 million Series A (May 2024) and a $600 million Series B (October 2025).
              It is advancing four clinical-stage programs across injectable, oral peptide, oral small molecule, and
              injectable tri-agonist modalities. The lead injectable ribupatide program has already generated the most
              compelling Phase 2 efficacy signal among the non-Lilly/Novo field: 23.6% mean weight loss at 36 weeks in a
              Hengrui Phase 2 trial in China (8 mg dose). Global Phase 3 KaiNETIC trials initiated in Q1 2026 with
              readouts anticipated in 2028. The key problem is timing: the global Phase 3 efficacy proof that would
              elevate ribupatide to a fully validated status will arrive well after multiple oral competitors have
              already generated their own Phase 3 readouts.
