          detail: Phase 3 lead (ribupatide inj.) + Phase 2 oral + Phase 2 KAI-7535; $770M net pipeline EV at $16
          tone: positive
        - label: Viking (VKTX) — approx.
          x: 8
          'y': 3
          detail: SC VK2735 Phase 3 enrolled + oral VK2735 Phase 2 positive; ~$3B net pipeline EV (approx.)
          tone: warning
        - label: Zealand Pharma — approx.
          x: 7
          'y': 2.5
          detail: Petrelintide Phase 3 planned + Roche partnership; ~$2.5B net pipeline EV (approx.)
          tone: warning
        - label: Structure (GPCR) — approx.
