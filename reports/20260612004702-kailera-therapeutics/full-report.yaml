      - number: '5.2'
        title: Ribupatide mechanism, clinical data, and Phase 3 KaiNETIC program
        blocks:
          - type: paragraph
            body: >
              Ribupatide (KAI-9531) is a once-weekly injectable GLP-1/GIP receptor dual agonist peptide that was
              designed to achieve greater weight loss than tirzepatide (the most prescribed obesity medicine as of 2026)
              by engineering modified receptor potency: in vitro studies show 3x GLP-1 receptor binding affinity and
              0.5x GIP receptor binding affinity compared to tirzepatide, plus a half-life of approximately seven
              days—roughly two days longer than tirzepatide—resulting in sustained weekly exposure. Ribupatide has not
              been tested head-to-head against tirzepatide or semaglutide in a clinical trial; all comparisons are
              mechanistic or modeled.


              The clinical evidence underpinning the KaiNETIC launch is substantial by Phase 3-initiation standards.
              Over 2,500 participants have been dosed in Hengrui trials, including a 48-week Phase 3 study in China that
              showed up to 19.2% mean weight reduction at the 6 mg top dose (17.7% by treatment-policy estimand), with
              weight loss not plateauing. A separate Phase 2 study evaluated the 8 mg dose and produced 23.6% weight
              reduction from baseline at only 12 weeks of treatment using the efficacy estimand (22.8% by
              treatment-policy estimand). GI adverse events were mild-to-moderate, consistent with the GLP-1 class, and
              importantly, AEs stabilized at doses of 3 mg and above, suggesting that higher doses can be explored
              without proportionally increasing GI burden.


              The KaiNETIC global Phase 3 program comprises three concurrent double-blind, randomized,
              placebo-controlled 76-week trials evaluating doses of 4, 6, 8, and 10 mg: KaiNETIC-1 (NCT07284875, ~1,800
              adults, BMI ≥30 or ≥27 with comorbidity, no T2D), KaiNETIC-2 (NCT07284901, ~1,700 adults, BMI ≥27 with
              T2D), and KaiNETIC-3 (NCT07284979, ~1,200 adults, BMI ≥35 without T2D, including an open-label semaglutide
              2.4 mg arm). All three trials were initiated in late 2025 or January 2026, with topline results expected
              in 2028. Kailera has also launched a Phase 2b high-dose trial (up to 20 mg) in March 2026, targeting
              topline results in 2027, to evaluate whether greater weight loss is achievable at doses above the Phase 3
              range.
