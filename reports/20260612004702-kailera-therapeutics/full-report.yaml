  - id: TP001
    title: Direct and Adjacent Obesity Competitor Profiles Relevant to Kailera
    enumerationScope:
      coverage: partial
      basis: >-
        Twelve most decision-relevant programs competing with or adjacent to Kailera's obesity pipeline as of June 2026,
        covering injectable and oral incretins, multi-mechanism programs, and amylin-based approaches.
    columns:
      - Program / Company
      - Modality and mechanism
      - Stage (Jun-2026)
      - Best public efficacy signal
      - Key tolerability signal
      - Strategic position
    rows:
      - - Ribupatide injection / Kailera
        - Once-weekly SC GLP-1/GIP dual agonist
        - Phase 3 KaiNETIC (3 trials); U.S. Ph2b high-dose also initiated
        - 23.6% mean weight loss at 36 weeks (Hengrui China Phase 2, 8 mg)
        - >-
          Favorable safety in >2,500 participants; consistent with GLP-1 class; Ph1 bridging confirmed similar PK in
          Asian/non-Asian
        - Lead program; potential best-in-class injectable; global Ph3 data expected 2028
      - - Oral ribupatide / Kailera
        - Once-daily oral GLP-1/GIP dual agonist peptide tablet
        - Phase 2 complete (China); global Ph3 planned 1H'2027
        - 12.1% mean weight loss at 26 weeks (Hengrui China Phase 2, 25 mg/50 mg)
        - Low GI AE rates; no treatment discontinuations from GI AEs; no liver signal
        - Part of ribupatide franchise; bridges injectable efficacy to oral convenience
      - - KAI-7535 / Kailera
        - Once-daily oral small-molecule GLP-1 agonist
        - Global Ph2 obesity initiated 2026; Ph3 T2D OUTSTAND-1 positive in China
        - OUTSTAND-1 T2D trial met primary endpoint (HbA1c reduction vs placebo at 32 weeks)
        - Favorable safety and tolerability; no liver safety signal in T2D program
        - Oral small-molecule with Phase 3 China T2D proof; global Ph2 obesity data expected 2027
      - - KAI-4729 / Kailera
        - Once-weekly injectable GLP-1/GIP/glucagon tri-agonist
        - Phase 1 MAD complete; Ph2 planned 2026
        - 16.0% mean weight loss at 12 weeks (12 mg) in Phase 1 MAD
        - Mild-to-moderate GI-related TEAEs; dose-dependent liver fat reduction (MRI PDFF)
        - Tri-agonist with MASH and obesity potential; differentiated via glucagon arm
      - - Zepbound/tirzepatide / Lilly
        - Once-weekly SC GLP-1/GIP dual agonist
        - Marketed (FDA approved 2023); OSA indication added 2024
        - ~21.8% placebo-adjusted weight loss at 72 weeks in SURMOUNT-1 (15 mg)
        - GI adverse events consistent with class; tolerable in large SURMOUNT program
        - Commercial benchmark; largest obesity-indication market share; ~$50B revenue trajectory
      - - Wegovy/semaglutide / Novo
        - Once-weekly SC GLP-1 agonist
        - Marketed (FDA approved 2021); SELECT CVD trial adds cardiovascular label
        - ~14.9% mean weight loss vs placebo at 68 weeks in STEP-1 (2.4 mg)
        - GI events common (40%+ any event); fasting instructions for injectable version
        - Incumbent injectable market leader; multiple indications; billions in annual sales
      - - Orforglipron / Lilly
        - Once-daily oral non-peptide small-molecule GLP-1 agonist
        - Submission stage globally (40+ countries); potential U.S. obesity action Q2 2026
        - 9.2% weight loss at 52 weeks vs 5.3% oral semaglutide in ACHIEVE-3 (T2D head-to-head)
        - No food/water restrictions; GI events manageable; no liver safety concern in cited data
        - First-mover advantage in daily oral non-peptide GLP-1; Lilly manufacturing scale
      - - Oral amycretin / Novo
        - Once-daily oral GLP-1/amylin dual agonist
        - Phase 2 positive; Phase 3 planned 2026
        - 10.1% weight loss at 36 weeks (oral); 14.5% in SC arm; T2D HbA1c reduction confirmed
        - Mostly mild-to-moderate GI events in Phase 2 disclosure
        - Novo's next-generation combo asset; extends beyond semaglutide into combination biology
      - - VK2735 oral / Viking
        - Once-daily oral GLP-1/GIP dual agonist (VK2735 tablet)
        - Phase 2 VENTURE complete; Phase 3 (VANQUISH) planned 2026
        - 12.2% mean weight loss at 13 weeks (120 mg); 97% achieved ≥5% weight loss vs 10% placebo
        - Mostly mild/moderate TEAEs; GI events diminished over time; no liver signal cited
        - Public biotech; SC VK2735 also in Phase 3; lifecycle injection-to-oral strategy
      - - GSBR-1290 / Structure
        - Once-daily oral non-peptide small-molecule GLP-1 agonist (tablet)
        - Phase 2a positive; Phase 2b-ready / mid-stage
        - 6.2% placebo-adjusted weight loss at 12 weeks; up to 6.9% in tablet PK study
        - Zero DILI or persistent liver enzyme elevations; GI AEs early and attenuating
        - Public biotech; explicit scale and global manufacturing narrative
      - - Petrelintide / Zealand-Roche
        - Once-weekly SC amylin analog
        - Phase 3 planned H2 2026; backed by Roche $1.65B upfront
        - 'Phase 1b: ~8.6% weight loss at 16 weeks (4.8 mg); lean-mass preservation emphasis'
        - Mostly mild GI events; tolerability cited as asset over GLP-1 class standard
        - Amylin-based adjacent; big-pharma partner elevates execution and reach
      - - Elecoglipron / AstraZeneca-Eccogene
        - Once-daily oral non-peptide small-molecule GLP-1 agonist
        - Phase 1b positive in China; global Phase 3 planned
        - Meaningful weight reduction and glycemic improvement at 16 weeks (China Phase 1b)
        - No liver safety signals in China Phase 1b
        - Big-pharma backed; AstraZeneca licensing shows oral GLP-1 M&A appetite persists
    notes: >-
      Rows normalize the most material public efficacy, safety, and stage signals as of June 2026 run date. China-only
      trials (ribupatide, OUTSTAND-1, elecoglipron) are not directly comparable to Western-only studies due to patient
      population, dosing design, and regulatory context differences. Efficacy cells mix primary-endpoint results,
      company-disclosed toplines, and published trial summaries — treat as screening evidence rather than head-to-head
      comparisons.
