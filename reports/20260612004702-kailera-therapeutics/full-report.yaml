            body: >
              Ribupatide's 8 mg data showing 23.6% body-weight reduction at only 12 weeks of treatment is the single
              most compelling data point in Kailera's public record. If the KaiNETIC trials replicate comparable
              efficacy at 76 weeks with acceptable tolerability, ribupatide would have the strongest weight-loss profile
