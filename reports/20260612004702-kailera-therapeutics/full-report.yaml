      - number: '3.3'
        title: 'Next-Wave Oral and Phase 3 Peers: Viking, Structure, Terns'
        blocks:
          - type: paragraph
            body: >-
              The next-wave oral competitors matter because they determine how crowded the oral obesity race will be by
              the time ribupatide oral reaches Phase 3. Viking Therapeutics is the most important single-company threat:
              the company has shown 12.2% mean weight loss at 13 weeks with no plateau in the VENTURE-Oral Phase 2 trial
              of VK2735 (120 mg dose), and 97% of VK2735-treated participants achieved ≥5% weight loss versus 10% for
              placebo. Viking's Chief Executive Officer stated at ECO 2026 that they believe oral VK2735 has the
              potential to become the first oral dual GLP-1/GIP agonist to reach the market, and the company is moving
              to Phase 3 later in 2026. The lifecycle advantage is also strategic: VK2735 sub-Q is in the Phase 3
              VANQUISH program simultaneously, meaning Viking can potentially offer a physician-friendly switch from
              injection to the same molecule in oral form — a direct competitive counter to Kailera's ribupatide
              injection-to-oral franchise story. If VK2735 oral Phase 3 data arrives before ribupatide oral Phase 3
              completes, Viking could establish the dual-agonist oral category before Kailera.


              Structure Therapeutics GSBR-1290 is the primary small-molecule non-peptide oral comparator for Kailera's
              KAI-7535. GSBR-1290's Phase 2a data showed 6.2% placebo-adjusted weight loss at 12 weeks with zero
              drug-induced liver injury or persistent liver enzyme elevations, a clean-signal story that helps Structure
              argue it avoids the hepatic risk that ended Pfizer's lotiglipron. GSBR-1290 is a tablet (not a capsule),
              which Structure explicitly frames as a manufacturing and global-scale differentiator. Terns
              Pharmaceuticals is the cautionary lesson: TERN-601 progressed through Phase 1 with reasonable data, but
              when Phase 2 results were reported, efficacy underwhelmed and adverse events — including gastrointestinal
              burden and DILI-consistent liver cases — led Terns to mothball the program. For Kailera's KAI-7535, the
              Terns experience is a direct reminder that oral small-molecule GLP-1 programs face a high bar on both
              efficacy ceiling and hepatic safety, and that a promising Phase 1 is not a commercial guarantee. Lilly's
              earlier lotiglipron discontinuation in 2023 reinforced the same message.
