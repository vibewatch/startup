  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Pipeline architecture and four-candidate asset map
        blocks:
          - type: paragraph
            body: >
              Kailera entered the public market with four clinical-stage product candidates that cover all three
              dominant GLP-1-based mechanistic archetypes in obesity pharmacotherapy: a GLP-1/GIP dual agonist peptide
              (injectable ribupatide), an oral peptide formulation of the same molecule (oral ribupatide), an oral
              small-molecule GLP-1 receptor agonist (KAI-7535), and a GLP-1/GIP/glucagon tri-agonist peptide (KAI-4729).
              The portfolio was assembled through a single licensing act rather than internal discovery: Kailera entered
              the Hengrui License Agreement shortly after its formation and obtained exclusive development and
              commercialization rights to all four candidates outside of Greater China (mainland China, Hong Kong,
              Macau, and Taiwan), with Hengrui retaining the same rights within Greater China. This structure gives
              Kailera access to deep Hengrui clinical data across the portfolio and enables faster development, but it
              also means every product traces its origin, manufacturing, and core IP to a single Chinese partner.


              The portfolio architecture is strategic rather than accidental. Injectable ribupatide is the lead asset
              and is currently in three parallel Phase 3 trials (the KaiNETIC program), targeting topline readouts in
              2028. Oral ribupatide and KAI-7535 address the industry-wide commercial push toward no-injection obesity
              therapy, with oral ribupatide offering continuity with the injectable franchise and KAI-7535 offering a
              small-molecule alternative. KAI-4729 extends the platform into next-generation tri-agonism. Each asset
              leverages clinical data already generated by Hengrui in China, giving Kailera a meaningful informational
              head-start on dosing, titration, tolerability, and dose-limiting toxicity before initiating global trials.
            claimRefs:
