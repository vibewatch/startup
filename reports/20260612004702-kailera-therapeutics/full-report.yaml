  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Clinical, and IP Risks
        blocks:
          - type: paragraph
            body: >-
              Kailera's lead risk remains regulatory and clinical path uncertainty rather than simple lack of capital.
              The company is running three parallel KaiNETIC Phase 3 obesity studies off Hengrui-originated data, but
              the public record still frames approval as contingent on large, long-duration evidence packages and
              class-consistent safety management. Kailera's own filings acknowledge an ongoing NDA-versus-BLA
              classification dispute for peptide GLP-1 candidates: if the historical CDER / NDA pathway holds, the
              programs remain burdensome but conventional; if FDA or litigation pressure pushes the assets toward a
              biologics-style pathway, timing, CMC, comparability, and cost requirements could all expand materially.


              The near-term public evidence is mixed rather than fatal. No clinical hold, enforcement action, or
              ribupatide- specific safety shutdown was identified, and the KaiNETIC trials are formally registered with
              2028 topline timing. But absence of a disclosed hold is not the same as low residual risk. Obesity drugs
              remain governed by class-like GI tolerability, pancreatitis, gallbladder, renal, and thyroid warning
              questions, and Kailera has not yet shown global Phase 3 data that resolve long-term maintenance or
              discontinuation concerns.


              IP posture is similarly adequate for launch planning but unresolved for underwriting. All four programs
              are licensed from Hengrui, Kailera does not publicly itemize an independent patent estate sufficient to
              operate without that partner, and no public freedom-to-operate opinion or specific litigation resolution
              was identified. The result is a thesis that can work, but only if clinical execution, regulatory pathway
              stability, and licensed IP continuity all hold simultaneously.
