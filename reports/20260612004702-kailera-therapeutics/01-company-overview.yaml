company:
  name: Kailera Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Kailera Therapeutics is a Delaware-incorporated, clinical-stage obesity biotech that went public on Nasdaq in April 2026 after raising roughly $1.6 billion since its May 2024 inception, including a record-breaking $718.8 million IPO. Its four GLP-1-based pipeline assets—all licensed from Jiangsu Hengrui Pharmaceuticals—are led by ribupatide (KAI-9531), a once-weekly injectable dual agonist now in global Phase 3 trials under the KaiNETIC program, with topline data expected in 2028. The company has generated no revenue, carries an accumulated deficit of $447.5 million as of March 2026, and management is guiding to runway into mid-2028 on combined pre-IPO cash and IPO proceeds.
sections:
- id: identity-headquarters-and-product-thesis
  title: Identity, headquarters, and product thesis
  body: 'Kailera Therapeutics, Inc. is a Delaware corporation with an inception date of May 8, 2024. Its principal executive offices are located at 180 Third Avenue, 4th Floor, Waltham, Massachusetts 02451. The company completed an initial public offering on April 20, 2026, at $16.00 per share on the Nasdaq Global Select Market under the ticker symbol KLRA, and as of May 20, 2026 had 129,565,608 shares of common stock outstanding. Kailera describes itself as an advanced clinical-stage biotechnology company focused on elevating the next era of obesity care by advancing a diversified pipeline to provide options for people living with obesity no matter where they are in their treatment journey.

    The product thesis rests on four clinical-stage GLP-1-based product candidates, all of which were initially discovered and developed for the Chinese market by Jiangsu Hengrui Pharmaceuticals Co., Ltd. (Hengrui), licensed to Kailera in May 2024. Kailera holds exclusive worldwide development and commercialization rights to all four candidates outside of China, Hong Kong, Macau and Taiwan (collectively, Greater China). The lead candidate is ribupatide, also known as KAI-9531, a once-weekly injectable GLP-1/glucose-dependent insulinotropic polypeptide (GIP) receptor dual agonist currently in global Phase 3 evaluation through the KaiNETIC program. The three supplemental candidates are oral ribupatide (KAI-9531-T), a once-daily oral formulation of the same peptide; KAI-7535, a once-daily oral small-molecule GLP-1 receptor agonist; and KAI-4729, a once-weekly injectable GLP-1/GIP/glucagon receptor tri-agonist. Kailera has not generated any revenue from any source since inception and remains entirely pre-commercial.'
