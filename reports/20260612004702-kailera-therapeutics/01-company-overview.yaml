- id: leadership-bench-and-board-governance
  title: Leadership bench and board governance
  body: 'Kailera assembled an experienced management team drawing heavily from the Cerevel Therapeutics and Translate Bio alumni network. Ron Renaud serves as President and Chief Executive Officer, having previously led Cerevel Therapeutics to its acquisition by AbbVie in 2024 and before that served as Chairman and CEO of Translate Bio through its 2021 Sanofi acquisition. The Cerevel pipeline extends to the operating bench: Scott Akamine (Chief Legal Officer) and Paul Burgess (Chief Operating Officer and Chief Business Officer) also held senior roles at Cerevel. Doug Pagán (Chief Financial Officer) brings a track record of biotech exits including Jnana Therapeutics (acquired by Otsuka for ~$1 billion) and Dicerna Pharmaceuticals (acquired by Novo Nordisk for $3.3 billion). Scott Wasserman, M.D. (Chief Medical Officer) is a former Amgen VP and Global Development Therapeutic Area Head for bone, cardiovascular, metabolic and neuroscience. Jamie Coleman (Chief Commercial Officer) brings nearly 25 years of commercial experience at Eli Lilly, including the role of U.S. Brand Leader for Zepbound. Paula Cloghessy (Chief People Officer) rounds out the suite with prior roles at Seres Therapeutics and Translate Bio.

    The board of directors is chaired by John F. Milligan, Ph.D., who spent 29 years at Gilead Sciences and retired as its President and CEO in 2018. Additional board members include Frank K. Clyburn Jr. (former EVP and Division President of Human Health at Merck), Christopher Hite (Chairman, Partnering & Investments at Royalty Pharma, serving as independent board member and audit committee chair), Andrew Kaplan (Partner, Bain Capital Private Equity), Adam Koppel, M.D., Ph.D. (Partner, Bain Capital Life Sciences), Yuting (Shelley) Liu, Ph.D. (Head of China Business Development and Strategy at Jiangsu Hengrui Pharmaceuticals), and Martin Mackay, Ph.D. (Co-Founder and Board Chair, Rallybio Corporation). The concentration of Cerevel and Translate Bio alumni across the management team represents meaningful key-person dependency that merits ongoing scrutiny, as does the presence of a Hengrui-affiliated board seat, which may create potential governance tension in commercial negotiation scenarios.'
