- id: funding-history-and-capital-markets
  title: Funding history, IPO, and capital markets
  body: 'Kailera launched publicly in October 2024 with an announcement of $400 million in Series A financing, though the first $200 million tranche had been raised confidentially in May 2024 simultaneous with the Hengrui license. An additional $100 million of Series A-1 shares was issued in December 2024 and a final $100 million convertible note tranche was issued in May 2025, bringing the committed Series A total to $400 million. The Series A syndicate included Bain Capital Life Sciences, Bain Capital Private Equity, RTW Investments, Atlas Venture, and Canada Pension Plan Investment Board (CPP Investments). On October 31, 2025, Kailera completed a $500 million cash close of its Series B preferred stock round at $14.00 per share; the contemporaneous conversion of the $103.2 million in notes into Series B brought the Series B total liquidation value to approximately $603.2 million. The pre-IPO capital raised totaled approximately $900 million in equity proceeds per the prospectus. Bain Capital Private Equity, Bain Capital Life Sciences, and Qatar Investment Authority were named as existing stockholders with indications of interest in the IPO.

    On April 17, 2026, Kailera priced its IPO at $16.00 per share, selling 39,062,500 shares for base gross proceeds of $625 million—described by industry press as the largest biotech IPO in history, surpassing Moderna''s 2018 record. The underwriters, led by J.P. Morgan, Jefferies, Leerink Partners, TD Cowen, Evercore ISI, and William Blair, exercised their full 5,859,375-share overallotment option, and the offering closed on April 20, 2026 with total gross proceeds of $718.8 million. Shares began trading under KLRA and opened at approximately $26, a 63 percent premium to the $16 IPO price. The fully diluted market capitalization at the IPO price implied a valuation in the range of $2.1 billion to $3.1 billion depending on treatment of dilutive securities.'
