tables:
- id: TR001
  title: Regulatory / legal risk register
  enumeration: true
  expectedMinRows: 6
  enumerationScope:
    coverage: partial
    basis: >-
      This register covers the public regulatory, legal, licensing, pathway, and policy risks most directly tied to
      Kailera's obesity programs, Hengrui relationship, and BIOSECURE exposure. It excludes private FDA meeting
      minutes, the full Hengrui license schedules, unpublished litigation papers, and non-public IP work product.
  columns:
  - Risk / rule / case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - FDA obesity evidence expectations and long-duration safety package
    - United States
    - Active; Kailera is in Phase 3 but not yet filed
    - Medium-High
    - Critical
    - Three pivotal KaiNETIC trials plus additional dose exploration create a large evidence base before filing
    - High — ultimate approval burden may expand if long-term maintenance, tolerability, or comparator expectations rise
    - Obtain FDA meeting minutes, integrated safety plan, and any planned post-Phase-3 long-term extension design
  - - NDA versus BLA classification dispute for peptide GLP-1 assets
    - United States
    - Disclosed as ongoing litigation / classification risk in filings
    - Medium
    - Critical
    - Kailera currently plans NDA submissions consistent with historical GLP-1 precedent
    - High — reclassification would expand CMC, comparability, and review burden and could materially delay launch
    - Request outside-counsel memo, any formal agency correspondence, and management's contingency filing plan
  - - BIOSECURE Act grandfathering and 2030 re-sourcing cliff
    - United States / cross-border contract
    - Enacted December 2025 with five-year grandfathering for existing contracts
    - Medium-High
    - High
    - Existing relationships appear operable in the near term while alternatives can theoretically be built
    - High — no public alternative network or migration timeline has been disclosed
    - Review all Hengrui-linked service and supply contracts, expiration dates, and transition-right provisions
  - - Hengrui license termination, milestone, and disclosure obligations
    - Cross-border contract
    - License active; detailed schedules not public
    - Medium
    - High
    - Kailera has already raised large sums and advanced multiple programs before the first registrational filings
    - High — termination or undisclosed milestone triggers could impair supply, IP rights, and financing flexibility
    - Request full agreement, royalty schedule, step-in rights, audit rights, termination clauses, and dispute mechanics
  - - GLP-1 class label and long-term safety warning profile
    - United States / global
    - Class-wide warnings exist across approved obesity therapies
    - Medium
    - High
    - Titration, exclusion criteria, and class-consistent monitoring are embedded in obesity trial design
    - Medium-High — ribupatide-specific long-term global data remain unproven
    - Compare Kailera protocols and draft labels against approved GLP-1 obesity precedents and DSMB materials
  - - IP / patent exposure on Hengrui-originated assets
    - United States / Europe / China
    - No public challenge identified; independent FTO not disclosed
    - Medium
    - High
    - Reliance on Hengrui-licensed IP and continuing prosecution / maintenance
    - High — no public evidence that Kailera can operate independently of Hengrui's patent estate
    - Commission third-party FTO review and request patent schedule, expiry map, and prosecution history
  notes: >-
    Likelihood and severity are qualitative and based on public evidence only. The Hengrui license and pathway rows are
    probably understating true exposure because private contract schedules and regulator correspondence are unavailable.
