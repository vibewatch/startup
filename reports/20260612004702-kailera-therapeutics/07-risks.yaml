- id: SR004
  title: Financing, Competitive, Reimbursement, and Governance Risks
  body: >-
    Kailera enters this risk chapter with far more cash than a typical clinical-stage obesity company, but the main
    financing question is duration, not absolute dollars. The March 31, 2026 balance sheet showed $581.9 million of
    cash, cash equivalents, and marketable securities before the IPO, and the IPO added $718.8 million gross. Yet the
    company also disclosed roughly $825 million of named program allocations for injectable ribupatide, oral
    ribupatide, and KAI-7535 alone, while Q1 operating cash use of $68.3 million implies a burn trajectory that can
    still force new capital before commercialization if timelines slip.


    Competitive and reimbursement risks intensify that financing pressure. Lilly's FDA-approved oral orforglipron and
    continuing Novo, Lilly, and broader GLP-1 pipeline activity mean Kailera's oral programs no longer enjoy an
    open-lane narrative. At the same time, KFF, CMS, and ICER materials all point to an access environment that is
    improving slowly but remains highly price- and policy-sensitive, making future margins and uptake less certain
    than topline efficacy alone might suggest.


    Governance is a softer but still real risk. Public leadership and committee disclosures show an experienced board
    and executive team, but they also show a company whose strategy, financing access, Hengrui oversight, and
    late-stage execution remain concentrated in a narrow visible bench. That combination argues for milestone-based
    underwriting, explicit kill criteria, and diligence focused on succession depth, board independence, and 2030
    BIOSECURE contingency planning rather than comfort from cash alone.
