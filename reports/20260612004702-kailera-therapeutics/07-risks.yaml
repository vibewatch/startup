- id: TR005
  title: Mitigation and kill criteria
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Clinical failure or non-differentiated efficacy
    - KaiNETIC or high-dose ribupatide topline disclosures
    - Weight loss, discontinuation, or safety profile fails to support premium positioning versus existing GLP-1 benchmarks
    - Treat as thesis break or severe valuation reset; do not underwrite Phase 3 premium narrative
  - - BIOSECURE re-sourcing failure
    - Contract updates, supplier announcements, or legislative / enforcement developments
    - No credible alternative manufacturing and service path is visible by 2028–2029 ahead of 2030 grandfathering expiry
    - Apply material discount to durability of pipeline rights and supply continuity
  - - Regulatory path expansion
    - FDA correspondence, litigation milestones, or disclosure of new filing strategy
    - NDA pathway no longer looks secure and Kailera must prepare for materially broader biologics-style requirements
    - Rebuild timeline, cash need, and probability-of-approval assumptions
  - - Competitive displacement in oral obesity
    - Lilly, Novo, Viking, Structure, or other peer data / launches
    - Oral competitors lock in better efficacy, tolerability, or convenience before Kailera's oral programs reach pivotal stage
    - Compress commercial TAM, peak share, and strategic value assumptions
  - - Financing gap before approval
    - Follow-on offering, partnership search, or internal runway update
    - Additional capital is required before critical 2028 readouts or before NDA preparation without strong de-risking data
    - Assume dilution, tighter investor protections, or forced partnership economics
  notes: >-
    These criteria are deliberately investment-oriented rather than operational KPIs. Each trigger maps to a likely step-
    change in value, financing leverage, or probability of strategic independence.
