  - id: FP003
    title: Competitive Durability KPIs for Kailera vs. Obesity Field
    type: kpi
    layout: standard
    summary: Kailera holds the best pre-commercial efficacy credentials in the obesity field but depends on 2028 Phase 3 data to translate that signal into a validated commercial moat.
    approximationNotes: KPI values are drawn from primary source disclosures and company-reported data as of June 2026; competitive comparisons are qualitative where numerical head-to-head data are unavailable.
    data:
      items:
        - label: Best injectable efficacy signal (non-marketed programs)
          value: 23.6% weight loss at 36 weeks
          detail: Ribupatide injection, Hengrui Phase 2 China, 8 mg; no plateau; favorable safety
          tone: positive
        - label: Best oral efficacy signal (non-orforglipron)
          value: 12.1% weight loss at 26 weeks
          detail: Oral ribupatide, Hengrui Phase 2 China, 25/50 mg; no GI treatment discontinuations
          tone: positive
        - label: Kailera's primary Phase 3 readout timeline
          value: 2028 (KaiNETIC injectable)
          detail: Binary wait period before primary commercial proof; oral Ph3 planned 2027
          tone: warning
        - label: Most proximate oral competitor readout
          value: 2027 (VK2735 oral Phase 3)
          detail: Viking initiating oral Phase 3 in 2026; data likely before Kailera oral Phase 3 completes
          tone: warning
        - label: Orforglipron first-mover in daily oral market
          value: Submission stage (mid-2026)
          detail: Lilly at regulatory decision stage; will establish oral-GLP-1 commercial standard before Kailera oral Ph3 data
          tone: warning
        - label: Kailera portfolio breadth
          value: 4 clinical-stage programs
          detail: Two modalities (injectable, oral), two mechanisms (dual agonist, small molecule, tri-agonist); unique breadth
          tone: positive
        - label: Adverse precedent for oral small-molecule GLP-1
          value: Lotiglipron discontinued 2023; TERN-601 mothballed 2025
          detail: Both failed on tolerability or liver signals; validates peptide approach but shows high KAI-7535 execution risk
          tone: warning
        - label: Strategic M&A valuation anchor
          value: Metsera acquired by Pfizer ~$4.9B upfront
          detail: Sets floor for what integrated obesity portfolios can command; Kailera's IPO market cap ~$2.1B is well below that ceiling
          tone: positive
