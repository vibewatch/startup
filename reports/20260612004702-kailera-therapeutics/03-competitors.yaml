  - id: incumbent-commercial-bar
    title: "Lilly and Novo: The Commercial and Clinical Standard Kailera Must Beat"
    body: >-
      Lilly's Zepbound and Novo's Wegovy collectively define what obesity drugs can achieve commercially and what efficacy bar the market will use to judge every challenger. Zepbound is the efficacy benchmark in the injectable class: tirzepatide's 21.8% mean placebo-adjusted weight loss at 72 weeks in SURMOUNT-1 (15 mg dose) is the highest approved-drug efficacy signal in obesity pharmacotherapy and has become the de facto comparison anchor for any new entrant. Ribupatide has shown 23.6% mean weight loss at 36 weeks in China at 8 mg, which Kailera cites as supporting best-in-class potential, but the trial population (Chinese participants), dose duration, and trial design cannot be directly equated to SURMOUNT, and only global Phase 3 will answer whether that efficacy margin persists outside China.


      Novo's Wegovy (semaglutide 2.4 mg SC) represents the incumbent standard for physicians already comfortable prescribing injectable GLP-1s: large STEP program evidence base, over two years of commercial experience, and branded prescriber loyalty make Wegovy the baseline from which any new injectable must differentiate. Lilly's orforglipron, sitting at the regulatory submission stage as of mid-2026, adds a different pressure: a daily oral non-peptide GLP-1 with no food or water restrictions that beat oral semaglutide on both glycemic control and weight loss in the ACHIEVE-3 head-to-head trial (9.2% vs 5.3% weight loss at 52 weeks). Orforglipron's approval would be the most direct oral benchmark for Kailera's oral ribupatide and KAI-7535 programs because it will establish patient and payer price anchors, first-mover daily-oral infrastructure, and a comparative efficacy bar before either of Kailera's oral programs reaches Phase 3 pivotal data. Novo's oral amycretin, a GLP-1/amylin dual agonist, adds an adjacent next-generation threat: it showed 10.1% weight loss at 36 weeks in the oral arm and 14.5% in the subcutaneous arm in Phase 2 data, and Novo plans to advance to Phase 3 in 2026. The combination signal for amycretin matters because it goes directly at the same biological rationale — GLP-1 plus a complementary mechanism — that underlies Kailera's own thinking about combination approaches in future programs.
