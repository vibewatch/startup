  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat claim
      - Competitive threat
      - Severity
      - Evidence quality
      - Mitigation / diligence ask
    rows:
      - - Injectable ribupatide best-in-class efficacy (23.6% at 36w in China)
        - "China data may not replicate globally; Lilly tirzepatide remains marketed benchmark"
        - High
        - Indirect — Hengrui China Phase 2 data only; Phase 1 SAD bridging supports PK similarity
        - Monitor KaiNETIC Phase 3 interim data; confirm regulatory dialogue on China-data reliance
      - - Oral ribupatide differentiated tolerability (no GI treatment discontinuations)
        - Viking VK2735 oral also shows good tolerability; orforglipron has no food restrictions
        - Medium
        - Direct — Hengrui China Phase 2 shows low GI AEs; global data pending
        - Compare head-to-head discontinuation rates in future global Phase 3
      - - Portfolio breadth (4 programs covering injectable, oral, tri-agonist)
        - Each program faces independent clinical failure risk; capital burn accelerates with parallel trials
        - Medium
        - Direct — IPO proceeds fund 4 programs simultaneously through mid-2028
        - Verify that $1.3B+ cash is sufficient for all 4 programs without dilution risk
      - - Hengrui strategic partnership and data access
        - Single-licensor dependency; NMPA/FDA regulatory divergence risk; Chinese regulatory changes
        - High
        - Direct — all clinical data to date from Hengrui China trials; Kailera owns ex-Greater China rights
        - Review license terms for termination/change of control provisions; assess regulatory bridging requirements
      - - First-mover in dual-agonist injectable global Phase 3 (vs. post-approval competitors)
        - Viking VK2735 SC also in Phase 3 (VANQUISH); tirzepatide already marketed globally
        - Medium
        - Indirect — phase timing comparison; VK2735 has not released full Phase 3 enrollment data
        - Track VANQUISH and KaiNETIC enrollment pace and expected readout timelines
      - - Oral small molecule KAI-7535 competitive positioning vs orforglipron/GSBR-1290
