  - id: TP003
    title: Pricing, Packaging, and Market Access Context
    columns:
      - Product / Company
      - WAC or list price (approx. US, 2026)
      - Dosing format
      - Payer access signal
      - Implication for Kailera competition
    rows:
      - - Wegovy (semaglutide 2.4 mg) / Novo
        - "~$1,350-$1,500/month list; significant rebate variability"
        - Once-weekly subcutaneous auto-injector
        - Major PBMs on formulary with PA; CMS GLP-1 coverage expansion pending
        - Sets price-ceiling and payer negotiation template for injectable obesity class
      - - Zepbound (tirzepatide) / Lilly
        - "~$1,060-$1,200/month list; Lilly discount programs below $350 for some"
        - Once-weekly subcutaneous auto-injector
        - Expanding formulary access; Lilly Savings Card for eligible patients
        - Leading injectable; its access programs create price pressure on any Kailera future launch
      - - Orforglipron / Lilly (pending launch)
        - Not yet priced; oral formulation may price below injectable benchmarks
        - Once-daily oral tablet; no food/water restrictions
        - Will depend on first-market decision; oral convenience expected to improve adherence
        - If priced at parity or premium to injectables, oral market opens; Kailera oral programs must plan around this anchor
      - - Oral semaglutide (Rybelsus) / Novo
        - "~$900-$1,000/month list for T2D formulation; obesity pricing not disclosed"
        - Once-daily oral tablet with fasting requirement
        - Narrower coverage in obesity vs injectable; fasting burdens limit adoption
        - Establishes daily oral GLP-1 as a prescriber category before Kailera oral programs arrive
      - - Wegovy-comparable biosimilar (generic horizon)
        - No approved biosimilar as of mid-2026; expected after ~2028-2030 patent expirations
        - N/A
        - Biosimilar semaglutide could pressure entire obesity injectable pricing by late 2020s
        - Long-term pricing compression risk for Kailera once it potentially commercializes ribupatide
      - - Kailera ribupatide injection (pre-commercial)
        - Not priced; company has not disclosed intended pricing
        - Once-weekly subcutaneous injection
        - No payer access yet; Phase 3 data required before formulary discussions
        - Will have to negotiate payer access in a market already shaped by Lilly/Novo contracts
    notes: Prices are approximate U.S. list prices from publicly available sources as of mid-2026 and before rebates, discounts, or copay programs. Kailera's pre-commercial programs have no pricing data. International pricing varies materially and is not covered here.
