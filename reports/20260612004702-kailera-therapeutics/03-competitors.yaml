  - id: moat-durability-and-verdict
    title: Moat Durability, Switching Logic, and Competitive Verdict
    body: >-
      Kailera's competitive moat rests on two pillars: the quality of ribupatide's efficacy signal relative to every other non-Lilly/Novo program, and the portfolio breadth that lets Kailera address multiple treatment modalities under a single corporate franchise. The first pillar is real and currently undervalued relative to press coverage: 23.6% mean weight loss at 36 weeks in China for injectable ribupatide is the best Phase 2/3 data point for any ex-Lilly/Novo obesity program. The oral ribupatide data (12.1% at 26 weeks, no treatment discontinuations from GI AEs) compares favorably to Viking VK2735 oral (12.2% at 13 weeks) on tolerability and compares less favorably on duration, though the no-plateau signal with no GI discontinuations is clinically differentiated. The tri-agonist KAI-4729 showing 16% weight loss at 12 weeks in the Phase 1 MAD at 12 mg adds a further optionality layer.


      The second pillar — portfolio breadth — is structurally valuable but creates execution risk. Running four clinical programs in parallel while burning $78.9 million per quarter in Q1 2026 means Kailera cannot afford a prolonged period of binary waiting on any one asset; the cash runway extends into mid-2028 but requires disciplined portfolio prioritization. Commercially, switching costs in obesity pharmacotherapy are low once competitive alternatives exist and payers have validated them, so market share in a differentiated landscape typically goes to programs with the best evidence density, physician familiarity, and access infrastructure. That favors Lilly and Novo today, and it means ribupatide's injectable moat claim depends entirely on proving superior global efficacy in KaiNETIC data that will not arrive until 2028. The competitive verdict is nuanced: Kailera holds the best pre-commercial efficacy credentials of any non-incumbent obesity company, but the relevant proof is 2+ years away, Viking is accelerating its own oral Phase 3, and Lilly will have orforglipron on market before any Kailera oral program completes pivotal work.
