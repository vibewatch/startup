- id: TM004
  title: Kailera modality tiers and what each tier is trying to win
  columns:
  - Program tier
  - Modality
  - Primary job to be done
  - Evidence base today
  - Scaling advantage
  - Core risk
  rows:
  - - Ribupatide injectable Phase 3
    - Weekly peptide injection
    - Deliver top-tier weight-loss magnitude for obesity, especially BMI 35+
    - Global Phase 3 plus extensive Chinese data
    - Clinical maturity and magnitude narrative
    - Peptide supply and late-stage execution
  - - High-dose ribupatide Phase 2b
    - Weekly peptide injection up to 20 mg
    - Test whether more weight loss is achievable in severe obesity
    - 250-participant higher-dose trial underway
    - Could extend magnitude differentiation
    - Higher tolerability burden and longer development
  - - Oral ribupatide Phase 2
    - Daily peptide tablet
    - Offer oral access without giving up too much efficacy
    - 26-week Chinese data show double-digit weight loss
    - Expands route-of-administration options within same franchise
    - Daily dosing and peptide manufacturing still matter
  - - KAI-7535 Phase 2
    - Daily oral small molecule
    - Provide a more scalable oral GLP-1 option
    - Exploratory Chinese weight-loss signal plus new global Phase 2
    - Potential manufacturing and supply advantages versus peptides
    - Efficacy may need to catch up to leading injectables
  - - KAI-4729 pre-Phase 1 / early clinical
    - Weekly tri-agonist injection
    - Preserve future upside beyond two-modality franchise
    - Early clinical signal only
    - Keeps Kailera in next-wave obesity mechanisms
    - Far from commercialization and crowded by large-cap peers
  notes: This table is a market-positioning lens rather than a pure product summary. It shows how Kailera spans different commercial jobs rather than making a single oral-or-injectable bet.
