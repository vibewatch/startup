- id: TM003
  title: Buyer / user / payer map for Kailera's obesity pipeline
  columns:
  - Segment
  - Buyer / decision-maker
  - End user
  - Budget owner / payer
  - Adoption trigger
  - Main access friction
  rows:
  - - Commercial obesity treatment
    - Primary care physician or obesity specialist
    - Adult with obesity or overweight plus comorbidity
    - Commercial plan, employer, PBM, or self-pay patient
    - Category-leading weight loss with acceptable GI profile
    - Prior authorization and high out-of-pocket cost
  - - BMI 35+ high-need cohort
    - Specialist prescriber and motivated patient
    - Adult with severe obesity without T2D or with major comorbid burden
    - Commercial plan or cash-pay mix
    - Greater expected weight loss than current therapies
    - Need evidence that outcomes beat or justify injectable incumbents
  - - Type 2 diabetes overlap
    - Endocrinologist or primary care physician
    - Adult with obesity and T2D
    - Commercial insurance, Medicare, or PBM for covered indications
    - Weight loss plus glycemic benefit
    - Label and reimbursement may diverge from obesity-only path
  - - Oral convenience segment
    - Primary care prescriber and patient
    - Needle-averse or convenience-led adult
    - Commercial plans and self-pay channels
    - Simpler uptake versus injections
    - Crowded oral pipeline and uncertain persistence uplift
  - - Public-program access pathway
    - CMS / Medicaid policy plus prescriber documentation
    - Eligible Medicare or Medicaid beneficiary
    - Government program budget
    - Bridge models or future coverage reinterpretation
    - Cohort limits, participation rules, and utilization management
  notes: The patient is the user, but prescribers and payers gate almost every commercial path. Kailera therefore needs evidence that is strong enough for physicians and affordable enough for formularies.
