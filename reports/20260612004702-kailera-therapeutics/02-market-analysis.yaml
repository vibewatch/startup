tables:
- id: TM001
  title: Kailera market-definition table
  columns:
  - Market layer
  - Included spend
  - Excluded spend / substitute
  - Primary buyer / payer
  - Why it matters
  rows:
  - - Highest-weight-loss injectable obesity tier
    - Weekly injectable obesity medicines and related reimbursement / cash-pay spend
    - Lifestyle-only care and bariatric surgery are substitutes, not core drug spend
    - Commercial plans, employers, PBMs, self-pay patients
    - Ribupatide injectable competes here first because Kailera emphasizes magnitude of weight loss and BMI 35+ need
  - - BMI 35+ severe-obesity segment
    - Drug spending tied to adults with BMI 35+ or major obesity burden
    - General overweight wellness programs
    - Specialist prescribers plus payer prior authorization
    - This is where Kailera claims the unmet need is largest and fastest growing
  - - Oral obesity convenience tier
    - Oral obesity medicines, patient-support programs, and early self-pay / commercial channels
    - Injectables remain the benchmark substitute
    - Primary care prescribers, commercial plans, cash-pay patients
    - Oral ribupatide and KAI-7535 provide diversification beyond a single injectable bet
  - - Broad incretin obesity market
    - Total GLP-1, GLP-1/GIP, and adjacent obesity-drug spending
    - Non-pharma obesity care and unrelated metabolic drugs
    - Mixed commercial and public payers
    - This is the investor narrative and the source of IQVIA's $66B to $200B sizing lens
  - - Public-policy access layer
    - Medicare / Medicaid demonstrations and coverage changes for selected GLP-1 uses
    - Statutory obesity exclusion remains for most traditional Part D use
    - CMS, state Medicaid agencies, and plan administrators
    - Coverage policy determines how much of the headline demand becomes paid volume
  notes: Boundary logic centers the market Kailera can plausibly serve with its current pipeline rather than all obesity spending or the total social cost of obesity.
