- id: buyer-user-payer
  title: 'Buyer, user, and payer logic: prescribers and formularies decide whether demand converts'
  body: 'The user is the patient living with obesity, but the economic buyer is usually someone else. Commercial plans, employers, PBMs, and public programs decide whether a prescription is affordable enough to clear prior authorization and remain on therapy. That distinction matters because obesity-drug demand is already financially material before broad obesity reimbursement exists: KFF reported $27.5 billion of gross Medicare Part D GLP-1 spending in 2024 and roughly 2 million Part D Ozempic users. Yet Medicare still generally excludes obesity-only drug coverage outside other approved indications, and even policy expansion proposals preserve utilization controls. For Kailera, that means adoption cannot be analyzed as a simple patient-preference curve. It must be analyzed as a multi-gate process: physicians must believe the efficacy story, payers must fund the indication, and patients must tolerate and continue therapy. The oral assets help because they open a different segment, including
    primary-care-led and needle-averse cohorts, but they do not bypass the payer gate.'
