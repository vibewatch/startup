callouts:
- calloutType: strength
  title: Kailera is playing in the biggest part of obesity biopharma, not inventing a new category
  body: 'IQVIA, WHO, CDC, and IDF all support the same conclusion: Kailera does not face market-existence risk. Its question is whether its weight-loss profile and modality breadth are strong enough to capture share within a market that is already at blockbuster scale.'
  claimRefs:
  - CM001
  - CM003
  - CM005
  - CM008
  - CM018
- calloutType: insight
  title: The real differentiation is magnitude-first injectable positioning plus oral optionality
  body: Kailera is not just another oral obesity thesis. Its lead market is the highest-weight-loss injectable tier for severe obesity, while its oral assets create a second and third route to monetize convenience-led demand if the data hold up.
  claimRefs:
  - CM019
  - CM020
  - CM024
  - CM025
  - CM029
  - CM030
  - CM031
- calloutType: risk
  title: Affordability, manufacturing, and persistence can compress a huge TAM into a much smaller realized market
  body: 'Headline prevalence and IQVIA sales curves do not solve the three execution bottlenecks Kailera still faces: getting payer approval at acceptable net prices, scaling supply through third-party manufacturers, and keeping patients on therapy long enough to support durable economics.'
