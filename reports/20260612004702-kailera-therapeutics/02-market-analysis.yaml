- id: TM005
  title: Growth drivers and adoption constraints for Kailera's market entry
  columns:
  - Factor
  - Direction
  - Timing
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Massive obesity and diabetes prevalence
    - Driver
    - Current
    - WHO, CDC, IDF
    - Demand does not depend on category education
    - Quantify the paid launch cohort after coverage filters
  - - BMI 35+ unmet need and weight-loss expectations
    - Driver
    - Current to 2028
    - Kailera S-1/A and KaiNETIC materials
    - Supports Kailera's magnitude-first positioning
    - Validate whether Phase 3 reproduces Chinese weight-loss profile
  - - Oral category expansion
    - Driver
    - Current to near term
    - IQVIA, Fierce, Lilly, BioPharma Dive
    - Oral assets can widen prescriber and patient uptake
    - Test whether Kailera's oral programs beat convenience benchmarks
  - - Public-company scrutiny
    - Constraint
    - Current
    - 424B4, 10-Q, Deloitte
    - Quarterly milestones matter for investor confidence and financing leverage
    - Track readout timing, enrollment, and manufacturing readiness each quarter
  - - Coverage and affordability pressure
    - Constraint
    - Current to near term
    - KFF and ICER
    - Payer math can suppress realized volume even in a huge TAM
    - Map reimbursement by indication, channel, and price corridor
  - - Manufacturing and persistence risk
    - Constraint
    - Current to near term
    - S-1/A, AAFP, Deloitte, IQVIA
    - Supply and refill durability can cap commercial value
    - Pressure-test CMO strategy and long-term patient retention assumptions
  notes: The biggest open variable is not whether obesity demand exists. It is whether high-efficacy therapies can scale through payer budgets, supply systems, and long-term persistence.
