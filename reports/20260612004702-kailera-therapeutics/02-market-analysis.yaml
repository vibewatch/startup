- id: drivers-constraints-and-public-market-dynamics
  title: Growth drivers are obvious; realization risk sits in supply, persistence, and scrutiny
  body: 'Kailera has three obvious demand-side tailwinds. First, the obesity burden is enormous and still growing. Second, IQVIA and Deloitte both describe obesity as one of the most valuable and strategically important areas in pharma. Third, Kailera''s own market positioning is aimed at a segment where current therapy still appears incomplete: its S-1/A cites SURMOUNT-1 data showing that most BMI 35+ tirzepatide patients still remained obese after treatment, which supports a magnitude-first thesis for ribupatide. But those drivers sit beside three equally important constraints. Affordability remains unresolved, with KFF and ICER showing how high list prices and public-budget pressure can limit access. Persistence is weak, with AAFP citing nearly 65% first-year discontinuation. Manufacturing is also non-trivial because Kailera relies on third parties and must scale both peptide and small-molecule programs under different supply dynamics. Because Kailera is already public, these constraints
    will be judged quarter by quarter, not only when products reach market.'
