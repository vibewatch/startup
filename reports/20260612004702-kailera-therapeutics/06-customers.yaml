  - CU020
  - CU021
  - CU033
  tableRefs: []
  figureRefs:
  - FU003
- id: retention-and-repeat-use-risk
  title: Repeat use remains the hardest commercial unknown
  body: 'Even if Kailera eventually wins prescriptions, retention still determines whether those prescriptions become attractive customers. AAFP highlights how weak obesity-drug persistence can be in practice, and competitor oral data show that convenience does not eliminate tolerability-driven discontinuation. Kailera has no commercial refill history, no disclosed NRR or GRR, and no public satisfaction data because it has nothing on market yet. That means today''s diligence can only use public GLP-1 benchmarks as a proxy, and those proxies are not comforting. The practical consequence is that Kailera''s commercial thesis should not be underwritten from initiation demand alone. It needs a future answer to a much harder question: can the company create enough durable efficacy, affordability, and support to keep people on therapy after the first prescription? Until there is a marketable product and real refill behavior, repeat-use economics remain a major gap.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU037
  - CU041
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: partner-demand-and-gating-event-concentration
  title: Partner demand is real, but Kailera is still concentrated on a small number of gating events
  body: 'The partner market is clearly active. Pfizer''s Metsera acquisition and Roche''s collaboration with Zealand around petrelintide both show that large companies are willing to spend heavily for obesity platforms before those assets become standard-of-care products. BioPharma Dive''s broader observation that metabolic-treatment investment more than tripled between 2023 and 2024 points in the same direction. Kailera also has public-market funding and a sizable balance sheet, which means it is not obviously blocked from continuing development. But the concentration risk has only shifted form. Instead of depending on one or two current customers, Kailera currently depends on one or two categories of future gating events: strong clinical readouts, a credible payer-access plan, and possibly strategic partnering if management chooses not to commercialize alone. If any of those channels slips, the company could operate in a high-demand obesity category while still lacking practical access
    to durable customers.'
