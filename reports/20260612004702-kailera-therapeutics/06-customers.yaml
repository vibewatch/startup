company:
  name: Kailera Therapeutics
chapter:
  number: 6
  title: Customers
summary: 'Kailera has no current commercial customers, no approved products, and no revenue, so the practical question is whether it is building the stakeholder proof needed to convert future patients, physicians, payers, and partners. The strongest present-day evidence is operational: a live global KaiNETIC Phase 3 recruitment funnel, a commercial leader who ran Zepbound at Lilly, and public analogs showing strong physician interest in oral obesity medicines. The biggest gaps remain payer contracting, Kailera-specific retention economics, and proof that clinical engagement will translate into reimbursed repeat use after launch.'
sections:
- id: future-stakeholder-map
  title: No current commercial customers means the chapter is really a stakeholder-conversion map
  body: 'Kailera is still a clinical-stage biotechnology company with no approved products and no product revenue. That matters because there are no current enterprise accounts, no signed payer wins, and no renewal cohorts to analyze the way one would for a commercial healthcare company. Instead, the relevant “customers” are the future stakeholder groups that must convert for commercialization to work: patients living with obesity, prescribers who decide whether the data justify use, payers who decide whether the product is affordable enough to cover, and potential pharma partners who may help commercialize, co-develop, or validate the platform. Kailera''s website positioning supports that framing because it emphasizes giving people options across different treatment journeys rather than selling a single narrowly scoped obesity product. The presence of Jamie Coleman, who most recently ran the Zepbound brand at Lilly, strengthens this section of the story: commercial know-how is already in
    the building even though customer revenue is not.'
