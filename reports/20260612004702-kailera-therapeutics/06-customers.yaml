- calloutType: strength
  title: Clinical operations are the most credible present-day proof surface
  body: In a precommercial biotech, the closest thing to customer proof is whether investigators, sites, and participants are actually engaging. KaiNETIC's live multinational recruitment funnel is stronger evidence than a slide promising future demand.
  claimRefs:
  - CU007
  - CU008
  - CU009
