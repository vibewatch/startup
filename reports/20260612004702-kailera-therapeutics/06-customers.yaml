  title: Future customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Core job to be done
  - Current proof
  - Strategic value / gap
  rows:
  - - Patients with obesity or overweight
    - User; influenced by physician and payer
    - Lose significant weight with manageable side effects and ongoing affordability
    - Category prevalence plus live KaiNETIC recruitment site
    - Largest value pool, but no Kailera-specific preference or willingness-to-pay data
  - - Primary care physicians, endocrinologists, obesity specialists
    - Prescriber / gatekeeper
    - See convincing efficacy, safety, and access support
    - KaiNETIC trial operations plus oral-obesity physician surveys
    - Critical adoption surface, but no marketed Kailera brand proof
  - - Payers, PBMs, Medicare / Medicaid programs
    - Economic buyer / coverage gatekeeper
    - Fund therapy within budget and utilization controls
    - KFF and CMS models show access experimentation
    - Determines net access, but Kailera has no disclosed contracts or price corridor
  - - Pharma partners and regional commercialization allies
    - Partner / channel / co-development buyer
    - Acquire differentiated obesity assets with late-stage potential
    - Large recent BD and M&A deals support appetite
    - Could de-risk launch, but Kailera has no disclosed strategic deal
  - - Public-market investors and analysts
    - Capital provider and external monitor
    - See milestone progress toward future customer conversion
    - IPO plus quarterly updates
    - Not a paying customer, but now an unavoidable audience for every commercial milestone
  notes: Kailera has no current commercial customers, so segmentation is future-state and anchored on who will ultimately prescribe, pay, adopt, or partner around the platform.
