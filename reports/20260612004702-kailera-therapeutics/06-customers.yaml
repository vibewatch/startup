  evidenceGaps:
  - type: missing-source
    severity: material
    topic: investigator-density
    missingEvidence: Named trial investigators or public site counts for the KaiNETIC program beyond the broad global-geography disclosure.
    whyItMatters: More granular site and investigator evidence would sharpen whether clinical engagement is deep or merely broad.
    diligencePath: Request country-level site counts, investigator specialties, and activation progress from management or the CRO.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: payer-readiness
    missingEvidence: Kailera's internal launch-access plan including target payer cohorts, gross-to-net assumptions, and evidence package for formulary review.
    whyItMatters: Public pilots show access can widen, but they do not show where Kailera itself expects to win coverage first.
    diligencePath: Request management's pre-launch access sequencing memo by line of business and target patient segment.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Kailera-specific persistence assumptions, patient-support design, and modeled refill behavior for injectable and oral programs.
    whyItMatters: Without retention assumptions, it is impossible to underwrite customer lifetime value or payer confidence from public evidence alone.
    diligencePath: Request launch-planning materials that show discontinuation assumptions, support services, and refill expectations by modality.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
