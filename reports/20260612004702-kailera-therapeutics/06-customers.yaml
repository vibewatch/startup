- id: clinical-operations-proof
  title: Clinical operations are the best current proof that physicians and participants are engaging
  body: 'The strongest concrete proof surface Kailera has today is not a payer contract or product sale. It is the KaiNETIC Phase 3 clinical program. Kailera publicly announced first participant randomization in late 2025 and early 2026, and its own clinical-trials page describes three global placebo-controlled studies spanning about 4,700 planned participants. That is meaningful because live enrollment at this scale requires investigators, sites, coordinators, and participants to engage with the program in multiple geographies. The dedicated recruitment site goes further by showing what potential participants actually see: a simple eligibility path, study medication at no cost, study-related local-doctor care at no cost, and travel reimbursement. None of this proves future prescriber pull at launch, but it does prove the company is already operating a multinational obesity-acquisition funnel rather than merely describing one in investor slides. For a precommercial biotech, that is the closest
    current analog to customer traction.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
