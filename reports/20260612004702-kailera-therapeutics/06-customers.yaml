  title: Kailera has customer-signal breadth but not customer proof depth
  body: The company already shows live recruitment operations, an experienced obesity launch executive, and a market full of prescriber and partner analogs. What it does not yet show is a paid customer, a payer contract, or a refill curve.
  claimRefs:
