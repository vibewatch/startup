  title: Revenue streams table
  columns:
  - Revenue stream
  - Status
  - Mechanism
  - Earliest realistic timing
  - Key dependencies
  rows:
  - - Product sales (ribupatide / KAI-9531 injectable)
    - Pre-revenue; no approved products
    - Prescription sales through specialty pharmacy and health system channel if NDA approved
    - 2029–2030 earliest (post-KaiNETIC topline 2028 + NDA review)
    - Phase 3 success across KaiNETIC-1/2/3; FDA approval; reimbursement coverage
  - - Product sales (oral ribupatide)
    - Phase 2→3 transition planned H1 2027
    - Oral prescription sales; higher patient convenience and potential broader market
    - 2030+ if Phase 3 initiated H1 2027 and succeeds
    - Phase 2b positive readout (topline expected 2027); Phase 3 enrollment; NDA
  - - Product sales (KAI-7535)
    - Phase 2; Phase 3 T2D positive data (May 2026); pivotal decision pending
    - Prescription sales in obesity/T2D; triple-G mechanism is differentiated
    - 2031+ (Phase 3 initiation, enrollment, and review timeline)
    - Phase 2b readout; pivotal design finalization; FDA alignment
  - - Regional or global partnership (upfront + milestones + royalties)
    - No deals announced; management has not guided on business development timeline
    - Strategic partner pays upfront and development milestones; Kailera retains U.S. rights; royalties on partner territory sales
    - Possible before pivotal readouts if Phase 2b data are strong; no public timeline
    - Clinical data quality; partner appetite; competitive dynamics
  - - Hengrui commercial milestone payments
    - Triggered only on commercial success; not revenue
    - Milestone payments from Hengrui upon product launch and net sales thresholds
    - 2030+ contingent on U.S. approval and strong launch
    - All of the above; commercially contingent; structurally desirable
  notes: All revenue streams are prospective; Kailera has generated zero revenue since inception May 2024. Interest
    income ($5.8M Q1 2026) is not a revenue stream but partially offsets operating expense.
