- id: TI002
  title: Pricing / monetization table
  columns:
  - Reference point
  - Price or metric
  - Basis
  - Implication for Kailera
  rows:
  - - Semaglutide (Ozempic/Wegovy) list price
    - ~$900–$1,400/month (U.S. wholesale acquisition cost)
    - Published GLP-1 market pricing; widely reported
    - Establishes market willingness to pay; Kailera's injectable may need to price in this range or justify a premium/discount
  - - Tirzepatide (Zepbound) list price
    - ~$1,000/month (U.S. list)
    - Eli Lilly launch pricing; reported in press
    - Closest comparison; Kailera's CMO came from Zepbound launch team — implies commercial design alignment
  - - Reimbursement coverage (GLP-1 obesity class)
    - Variable; Medicare Part D coverage for obesity launched Jan 2026 per Inflation Reduction Act provision
    - U.S. policy shift; broad implications for market access in Medicare population
    - If ribupatide reaches market, Medicare coverage framework will be established; removes a key access barrier
  - - Hengrui royalty obligation (ribupatide / KAI-9531)
    - Mid-single digit to low-teens % of net sales
    - 424B4 prospectus and Q1 2026 10-Q (License Agreement terms)
    - Permanent margin drag; a $2B net sales product would generate $100–200M+ in royalties to Hengrui, reducing gross margin
  - - IPO price
    - $16.00/share; $718.8M gross proceeds
    - 424B4 final prospectus; IPO closing press release
    - Public market assigned significant value premium to the pipeline at launch; clinical failure would be severely dilutive
  notes: GLP-1 market pricing is based on public reports and may not reflect net prices after PBM rebates. Hengrui royalty
    is per filing; exact rate depends on net sales level and geography.
