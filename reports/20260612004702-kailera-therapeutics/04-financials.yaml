- id: cost-structure-and-rd-investment
  title: Cost structure and R&D investment
  body: "Kailera's operating cost structure is dominated by R&D, consistent with a company running six distinct\
    \ clinical programs simultaneously. In Q1 2026, R&D expense was $70.9 million (83.7% of total operating expenses),\
    \ G&A was $13.8 million (16.3%), and total operating expenses were $84.7 million. Interest income of $5.8\
    \ million reduced the reported net loss to $78.9 million for the quarter, implying an annualized gross burn\
    \ rate approaching $340 million on operating expenses alone — substantially higher than FY2025's full-year\
    \ net loss of $149.0 million, reflecting the ramp-up of three KaiNETIC Phase 3 trials initiated in late 2025\
    \ and early 2026 and the Phase 2b high-dose expansion initiated in March 2026. For reference, the FY2024\
    \ (inception May 8 to December 31, 2024) net loss was $219.7 million, which included the $100 million Hengrui\
    \ upfront payment and $10 million technology transfer fee as one-time items. The composition of R&D spend\
    \ reflects a multi-program portfolio: KaiNETIC-1 (injectable ribupatide, ~2,340 participants), KaiNETIC-2\
    \ (~1,156 T2D patients), and KaiNETIC-3 (~1,200 BMI 35+ patients) are concurrently enrolling, creating\
    \ significant CRO and manufacturing costs. The Phase 2b high-dose ribupatide study (~250 participants) and\
    \ the KAI-7535 Phase 2 (initiated April 2026) add incremental costs. G&A is elevated relative to a pre-IPO\
    \ company partly because of the infrastructure buildup for public-company compliance, D&O insurance, and\
    \ executive compensation. Notable balance sheet items include accrued clinical trial costs and accrued manufacturing\
    \ costs in the tens of millions, as well as operating lease obligations for office space in Waltham, MA and\
    \ Cambridge, MA totaling approximately $14.9 million."
