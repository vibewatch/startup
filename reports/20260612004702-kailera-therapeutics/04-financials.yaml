- id: hengrui-licensing-financial-obligations
  title: Hengrui licensing financial obligations
  body: "The Hengrui License Agreement is both Kailera's most important strategic asset and its most significant\
    \ financial obligation. Under the agreement, Kailera paid Jiangsu Hengrui Pharmaceuticals $100 million in\
    \ non-refundable upfront cash and a $10 million technology transfer fee at inception (May 2024), and issued\
    \ Hengrui Series A-2 preferred stock representing 19.9% of fully diluted capital at the time. Kailera is\
    \ further obligated to pay up to $200 million in clinical and regulatory milestone payments and up to\
    \ $5.7 billion in commercial milestone payments — the latter only materialize if Kailera products generate\
    \ very large commercial revenues and are therefore financially desirable outcomes. Ongoing royalties range\
    \ from mid-single digit to low-teens percent of net sales, which is a material and structurally embedded\
    \ cost that will reduce gross margins once commercial. In FY2024, the one-time $110 million Hengrui payments\
    \ (upfront + technology transfer) materially inflated the cost structure and contributed to the $219.7 million\
    \ net loss that year. These costs do not recur in the operating baseline, but the forward royalty and milestone\
    \ obligations are permanent features of the financial model. There is a right of first refusal on additional\
    \ Hengrui metabolic assets that is mentioned in the S-1/A but not fully specified, representing a potential\
    \ capital allocation option that cannot be underwritten from public filings. Hengrui also holds a board\
    \ seat (Shelley Liu), a potential conflict of interest that raises governance questions about commercial\
    \ negotiation and IP strategy — a diligence vector that investors should probe."
