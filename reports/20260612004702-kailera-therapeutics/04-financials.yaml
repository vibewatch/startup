  evidenceGaps:
  - type: missing-source
    severity: material
    topic: per-program-R&D-spending
    missingEvidence: No public filing or press release discloses how the $70.9 million Q1 2026 R&D expense is allocated across the six active clinical programs.
    whyItMatters: Without program-level spend, it is impossible to assess which programs are absorbing the most capital or to model what a prioritization decision would save.
    diligencePath: Request clinical trial budget by program; review CRO contract disclosures in future 10-K/10-Q filings.
    relatedQuestionRefs:
    - QI003
    - QI012
    - QI013
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Kailera does not publicly disclose total employee count or functional headcount breakdown in any reviewed filing or press release.
    whyItMatters: Headcount is a key capacity indicator; its absence makes organizational scaling assessment impossible.
    diligencePath: Request current headcount from Kailera IR; review proxy statement (DEF 14A) when filed.
    relatedQuestionRefs:
    - QI011
  - type: missing-source
    severity: material
    topic: trial-cost-guidance
    missingEvidence: Kailera has not publicly disclosed any per-trial cost guidance, total KaiNETIC program budget, or cost-per-patient assumptions for any of its six active clinical programs as of June 2026.
    whyItMatters: Without trial cost guidance, investors cannot independently verify whether the mid-2028 runway is adequate for all six programs or whether prioritization decisions may be required.
    diligencePath: Request clinical development budget from management; ask CFO for per-program cost allocation at next investor conference.
    relatedQuestionRefs:
    - QI014
  - type: missing-source
    severity: material
    topic: commercial-pricing-strategy
    missingEvidence: Kailera has not publicly disclosed any pricing strategy, WAC target, payer negotiation approach, or reimbursement coverage plan for ribupatide or any pipeline asset.
    whyItMatters: Commercial revenue modeling is entirely speculative without pricing; the Hengrui royalty drag makes gross margin modeling impossible without a net price anchor.
    diligencePath: Request commercial planning materials from management; review any investor day presentations post-IPO.
    relatedQuestionRefs:
    - QI016
  - type: private-evidence-only
    severity: minor
    topic: Hengrui-ROFR-terms
    missingEvidence: The Hengrui ROFR for additional metabolic disease candidates is mentioned in the S-1/A but detailed financial terms (exercise price, timing, covered programs) are not publicly disclosed.
    whyItMatters: The ROFR could represent material future capital outlays or pipeline expansion; its value is unmodellable without terms.
    diligencePath: Request full Hengrui License Agreement from Kailera; review any future exhibit filings on EDGAR.
    relatedQuestionRefs:
    - QI019
  - type: missing-source
    severity: minor
    topic: net-IPO-proceeds
    missingEvidence: Exact net IPO proceeds after underwriting discounts and offering expenses have not yet appeared in a filed financial statement as of June 2026.
    whyItMatters: The difference between gross ($718.8M) and net proceeds affects the precision of runway modeling.
    diligencePath: Review Q2 2026 Form 10-Q (expected August 2026) for reported net proceeds and exact cash balance.
    relatedQuestionRefs:
    - QI025

acknowledgedWarnings:
- dimension: tableNotes
  reason: TI001 and TI002 are factual snapshot tables covering pre-revenue and pricing benchmark information; per-row notes are embedded inline and a separate notes field adds redundancy for these table types.
- dimension: figureType
  reason: Planned figure types (Revenue model bridge, Unit economics bridge, Financial estimate range, Capital intensity map) are rendered as flow, waterfall, range, and bar respectively. The flow and waterfall types are not on the planned list in runtimeContext but are the most appropriate renderer contracts for a pre-revenue monetization map and a capital raise waterfall; substituting a table would reduce analytical clarity. The range and bar types are appropriate for scenario and cost composition figures.
