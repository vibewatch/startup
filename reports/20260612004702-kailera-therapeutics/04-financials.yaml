callouts:
- calloutType: risk
  title: Pre-revenue financing dependency is the central financial risk
  body: Kailera will require additional capital beyond the mid-2028 runway before any product could generate commercial
    revenue. The 2026–2027 capital markets window is critical — a sector downturn or clinical setback during this
    window could force a dilutive emergency raise or a value-destructive partnership.
  claimRefs:
  - CI025
  - CI026
  - CI042
  - CI043

- calloutType: strength
  title: Exceptional balance sheet buys clinical execution time
  body: With approximately $1.25 billion in estimated post-IPO liquidity and a management team that has raised
    $900 million in pre-IPO equity in under two years, Kailera has a differentiated near-term financial position.
    The runway through mid-2028 covers every Phase 3 topline readout without an emergency raise.
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026

- calloutType: risk
  title: Hengrui royalties are a permanent gross margin headwind
  body: Once ribupatide or other in-licensed assets reach commercial stage, mid-single to low-teens royalties
    to Hengrui will be a structural and non-negotiable gross margin drag. For context, a $2 billion net sales
    asset bearing a 10% royalty generates $200 million per year to Hengrui — a very large line item relative
    to near-term operating expense levels.
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI035

