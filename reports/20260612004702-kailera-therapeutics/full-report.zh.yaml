      - number: '2.3'
        title: 买方、用户与支付方逻辑：处方医生和处方集决定需求能否转化
        blocks:
          - type: paragraph
            body: >-
              用户是肥胖症患者，但经济买方通常是别人。商业保险、雇主、PBM 和公共项目决定一张处方是否足够可负担，能通过 prior authorization
              并持续用药。这个差异很重要，因为在广泛肥胖症报销形成之前，肥胖症药物需求已经具备财务体量：KFF 报告 2024 年 Medicare Part D GLP-1 总支出为 $27.5 billion，Part D
              Ozempic 用户约 2 million。但 Medicare 仍通常排除其他获批适应症之外的单纯肥胖症用药覆盖，即便政策扩张提案也保留使用控制。对 Kailera
              而言，采纳不能简单按患者偏好曲线分析。它必须被看作多道门：医生要相信疗效故事，支付方要为适应症买单，患者要耐受并持续治疗。口服资产有帮助，因为它们打开了不同细分，包括由初级保健牵头和抗拒针剂的人群，但它们绕不过支付方这道门。
