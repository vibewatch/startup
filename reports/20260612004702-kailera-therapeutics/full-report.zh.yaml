  - id: TM001
    title: Kailera 市场定义表
    columns:
      - 市场层级
      - 纳入支出
      - 排除支出 / 替代方案
      - 主要买方 / 支付方
      - 重要性
    rows:
      - - 最高减重注射型肥胖症层级
        - 每周注射肥胖症药物，以及相关报销 / 自费支出
        - 仅生活方式干预和减重手术是替代方案，不属于核心药物支出
        - 商业医保、雇主、PBM、自费患者
        - Kailera 首先让 ribupatide 注射剂在这里竞争，因为公司强调减重幅度和 BMI 35+ 需求
      - - BMI 35+ 重度肥胖人群
        - 与 BMI 35+ 成人或重大肥胖负担挂钩的药物支出
        - 泛超重健康管理项目
        - 专科处方医生加支付方事前授权
        - Kailera 称这一人群的未满足需求最大、增长最快
      - - 口服肥胖症便利层级
        - 口服肥胖症药物、患者支持项目，以及早期自费 / 商业渠道
        - 注射剂仍是基准替代方案
        - 初级保健处方医生、商业医保、自费患者
        - 口服 ribupatide 和 KAI-7535 让公司不只押注单一注射剂
      - - 广义肠促胰素肥胖症市场
        - GLP-1、GLP-1/GIP 及相邻肥胖症药物总支出
        - 非药物肥胖症护理和无关代谢药物
        - 商业支付方与公共支付方混合
        - 这是投资者叙事，也是 IQVIA $66B 至 $200B 规模测算的来源
      - - 公共政策准入层
        - Medicare / Medicaid 试点，以及部分 GLP-1 用途的覆盖变化
        - 法定肥胖症排除条款仍适用于多数传统 Part D 用途
        - CMS、州 Medicaid 机构和计划管理方
        - 覆盖政策决定名义需求中有多少会转成付费用量
    notes: 边界逻辑聚焦 Kailera 凭当前管线可合理服务的市场，而不是全部肥胖症支出或肥胖症总社会成本。
