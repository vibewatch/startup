    rows:
      - - 全球肥胖症负担
        - 肥胖成人
        - '890000000'
        - 仍在上升；按 WHO 更宽口径，受影响人群超过 10 亿
        - 患者人数不是可报销 TAM
        - 在支付方过滤前，证明底层需求极大
      - - 美国肥胖症负担
        - 成人肥胖 / 重度肥胖患病率
        - 40.3% / 9.7%
        - BMI 35+ 占比预计到 2030 年继续上升
        - 患病率不等于已治疗需求
        - 支撑其聚焦需要更大减重幅度的重度肥胖队列
      - - 全球糖尿病重叠
        - 糖尿病成人
        - '589000000'
        - 2050 年预计 8.53 亿；>90% 为 2 型
        - 糖尿病与肥胖症适应症需求相邻，但不相同
        - 为肥胖症新进入者创造覆盖和处方医生邻近性
      - - 全球肥胖症药物市场
        - 标价销售额
        - 2025 年 66B；2026 年 92B
        - 2027 年起 105B 至 200B
        - 区间混合了多种情景和采用假设
        - Kailera 不需要创造品类；需要拿到差异化份额
      - - Medicare 预算压力
        - Part D GLP-1 总支出
        - 2024 年 27.5B
        - 覆盖试点可能扩大，同时谈判价格将于 2027 年开始
        - 公共支出不等同于仅肥胖症覆盖
        - 说明支付方可负担性与疗效同样重要
      - - 宏观负担
        - 经济和卫生系统负担
        - 大且仍在上升
        - 全球政策压力应会持续
        - 宏观负担不保证报销
        - 支撑长期需求叙事，但不支撑短期定价权
    notes: 本表有意混合患病率、药物销售和预算影响视角，因为没有单一公开 TAM 估计能完全匹配 Kailera 的 3 期加口服管线覆盖面。
