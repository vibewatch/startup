  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、临床与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              Kailera 的首要风险仍是监管和临床路径不确定，而不是简单缺钱。公司基于 Hengrui 原始数据同步推进三项 KaiNETIC Phase 3
              肥胖研究，但公开记录仍把获批建立在大规模、长周期证据包和同类一致安全管理之上。Kailera 自己的文件承认，肽类 GLP-1 候选药物仍存在 NDA 与 BLA 分类争议：如果历史 CDER / NDA
              路径维持，项目负担仍重但属于常规；如果 FDA 或诉讼压力把资产推向生物制品式路径，时间、CMC、可比性和成本要求都可能显著增加。


              近期公开证据是混合的，不是致命的。未发现临床暂停、执法行动或 ribupatide 特异性安全停摆，KaiNETIC 试验也已正式注册并指向 2028 年 topline
              时间。但没有披露暂停，并不等于剩余风险低。肥胖药仍受同类胃肠耐受性、胰腺炎、胆囊、肾脏和甲状腺警示问题约束；Kailera 尚未拿出全球 Phase 3 数据，来回答长期维持或停药担忧。


              IP 姿态同样足以支持上市规划，但不足以支撑承销判断。四个项目均由 Hengrui 授权，Kailera 没有公开逐项列出足以脱离该合作方独立运营的专利组合，也未发现公开的 freedom-to-operate
              意见或具体诉讼解决方案。结论是：这一逻辑可以成立，但前提是临床执行、监管路径稳定性和授权 IP 连续性必须同时守住。
