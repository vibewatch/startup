      - number: '2.4'
        title: 增长驱动显而易见；兑现风险在供应、持续用药和审查
        blocks:
          - type: paragraph
            body: >-
              Kailera 有三个明显的需求侧顺风。第一，肥胖症负担巨大且仍在增长。第二，IQVIA 和 Deloitte 都把肥胖症描述为药企中价值最高、战略意义最强的领域之一。第三，Kailera
              自身市场定位瞄准一个当前疗法仍显不足的细分：其 S-1/A 引用 SURMOUNT-1 数据显示，大多数 BMI 35+ tirzepatide 患者治疗后仍处于肥胖状态，这支持 ribupatide
              的幅度优先论点。但这些驱动旁边有三个同样重要的约束。可负担性仍未解决，KFF 和 ICER 显示，高标价和公共预算压力会限制准入。持续用药弱，AAFP 引用近 65% 的第一年停药率。制造也不简单，因为
              Kailera 依赖第三方，且必须在不同供应动态下同时放大小分子和肽类项目。Kailera 已经上市，这些约束会按季度被检验，而不只是等产品上市时才被检验。
