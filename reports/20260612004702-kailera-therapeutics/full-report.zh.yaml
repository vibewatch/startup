      - number: '5.4'
        title: 开发架构、Hengrui 制造与质量控制
        blocks:
          - type: paragraph
            body: >
              Kailera 的开发架构围绕“先授权”的运营模式搭建：Hengrui 同时是原始 IP 授权方、大中华区的活跃临床开发方，以及 Kailera 全球临床试验药物原料的主要制造商。根据 Hengrui
              License Agreement，Kailera 获得在大中华区以外开发和商业化四个候选药物的独家权利。作为交换，Kailera
              必须以商业上合理的努力开发和商业化授权产品，必须在规定时间内完成若干监管里程碑义务，并向 Hengrui 支付里程碑款和特许权使用费。Hengrui 继续在肥胖相关适应症中生成数据，为 Kailera
              的策略提供参考；Kailera 对 Hengrui 若干额外代谢资产享有优先拒绝权。


              这套架构带来显著资本效率：Kailera 在启动全球试验前，就能使用 Hengrui 已在中国生成的广而深的临床数据包（给药、滴定、患者人群、安全性），避免重复承担 Phase 1/Phase 2
              成本。同一结构也带来运营和地缘政治依赖。Kailera 当前临床试验药物供应依赖 Hengrui；如果授权因任何原因终止，供应也会终止。没有 Hengrui 参与，Kailera 无法独立复制从 Hengrui
              授权而来的专有 IP、制剂 know-how 或制造工艺。美国 BIOSECURE Act（2025 年 12 月生效）增加了监管暴露，因为该法禁止联邦机构向某些中国生物技术公司采购；Kailera 披露，包括
              Hengrui 在内的一些合同对手方可能受到影响。


              KaiNETIC 项目的质量控制遵循行业标准：双盲、随机、安慰剂对照设计；对胰腺炎、严重肾功能损害和既往减重手术设置入组与安全排除；用剂量递增滴定方案管理胃肠耐受性；按 Phase 3 规模推断应有 DSMB
              监督。临床试验记录已在 ClinicalTrials.gov 公开注册。Kailera 的主要监管策略是通过 NDA 寻求批准，但公司披露仍有诉讼风险，可能要求将肽类候选药物从药品重新归类为生物制品（BLA
              路径），从而施加显著更重的要求。
