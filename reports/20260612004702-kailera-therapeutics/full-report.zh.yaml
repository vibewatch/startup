      - number: '4.4'
        title: Hengrui 授权财务义务
        blocks:
          - type: paragraph
            body: >-
              Hengrui License Agreement 既是 Kailera 最重要的战略资产，也是最重大的财务义务。根据协议，Kailera 在成立时（2024 年 5 月）向 Jiangsu Hengrui
              Pharmaceuticals 支付 $100 million 不可退还首付款和 $10 million 技术转让费，并向 Hengrui 发行 Series A-2 优先股，占当时完全摊薄资本的
              19.9%。Kailera 还需支付最高 $200 million 临床和监管里程碑付款，以及最高 $5.7 billion 商业里程碑付款——后者只有在 Kailera
              产品产生很大商业收入时才会触发，因此本身对应的是财务上理想的结果。持续版税为净销售额中个位数中段至低十位数百分比，这是重大且结构性嵌入的成本，商业化后会压低毛利率。FY2024，一次性 $110 million
              Hengrui 付款（首付款 + 技术转让）显著抬高成本结构，并推动当年 $219.7 million 净亏损。这些成本不会在运营基线中重复，但未来版税和里程碑义务是财务模型中的永久特征。S-1/A 提到对额外
              Hengrui 代谢资产的优先拒绝权，但未完整说明，代表一个无法用公开文件承销的潜在资本配置选项。Hengrui 还持有一个董事席位（Shelley Liu），这是潜在利益冲突，给商业谈判和 IP
              策略带来治理问题——投资者应重点追问。
