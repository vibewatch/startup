      - number: '4.3'
        title: 资本充足性与 runway
        blocks:
          - type: paragraph
            body: >-
              按任何临床阶段生物科技标准看，Kailera IPO 时的资产负债表都异常强。2026 年 3 月 31 日，公司在计入 2026 年 4 月 IPO 募资前，持有 $581.9 million
              现金、现金等价物和有价证券。IPO 募资总额 $718.8 million（基础发行 $625 million，每股 $16；另因超额配售权全额行使增加 $93.8 million）。扣除估计约 $46
              million 承销折扣后，IPO 净募资约 $672.7 million。管理层披露的募资用途覆盖 ribupatide 在 KaiNETIC 和 Phase 2b 项目中的持续开发、口服
              ribupatide、KAI-7535 和 KAI-4729 推进至各自下一里程碑、营运资金及一般公司用途。与 IPO 前现金合计后，IPO 后流动性基础接近 $1.25 billion，管理层预计足以支撑运营至
              2028 年中。该指引隐含混合季度 burn 约 $84–100 million，大体符合 2026 年 Q1 运营费用 run rate。runway
              预测取决于六个项目入组患者的数量和速度——任何入组加速或新增项目都会缩短 runway。在产品产生商业收入之前，公司仍需要额外资本，因此 2026–2027
              年后续股权融资或合作交易窗口是关键融资执行风险。此前融资历史（2024 年 10 月完成 $400M Series A，2025 年 10 月完成 $600M Series B，随后
              IPO）证明管理团队能调动大额资本池，但每一轮临床阶段定价的连续融资都意味着显著持续稀释，并依赖有利的生物科技资本市场。
