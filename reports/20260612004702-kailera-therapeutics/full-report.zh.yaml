companyProfile:
  summary: >-
    Kailera Therapeutics 是一家 2024 年 5 月成立、注册于 Delaware 的肥胖症生物科技公司，现以 KLRA 在 Nasdaq 上市。公司从 Jiangsu Hengrui
    Pharmaceuticals 授权引进四个基于 GLP-1 的候选药物，其中牵头注射剂 ribupatide 已进入全球 Phase 3，口服 ribupatide 和 KAI-7535 处于 Phase 2，KAI-4729
    处于 Phase 1。公司从成立到完成大额资本化速度异常快，先后完成大额 Series A 和 Series B，并于 2026 年 4 月完成 $718.8 million
    IPO。上市故事最强的部分是资金深度、管理层履历和后期肥胖症定位；最大悬念是，中国主导的疗效包能否在全球注册性研究中复现，而市场在此之前会变得更拥挤。
