      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Kailera
              的财务结论很清楚：这是一家前收入、资本密集、依赖融资的临床阶段生物科技公司，短期资产负债表异常强，但没有来自商业运营的安全垫。收入质量为零，因为没有收入。毛利率路径无法正式建模，因为上市取决于临床成功，最早也要
              2028 年之后，监管批准大约在 2029–2030 年。相较多数临床阶段公司，资本强度极高，源于同时跑六个项目的决定——这是一项高信念押注，需要异常强执行力，也只有 $1.25 billion
              流动性基础才负担得起。Hengrui 授权下的版税结构（净销售额中个位数中段至低十位数百分比）会永久拖累未来毛利率，无法重新谈判或减记。主要尽调阻断点包括：（1）没有公开披露单试验或单项目成本指引，导致自下而上
              burn 建模不可能；（2）Hengrui ROFR 细节未披露，可能代表重大额外现金支出；（3）ribupatide 或 KAI-7535
              未披露定价策略，使商业收入建模带有猜测；（4）未披露员工数，限制运营能力评估。正面财务属性包括：（a）出色的 Series A–B–IPO 记录，证明其能进入深厚生物科技资本池；（b）runway 覆盖到
              2028 年中每个关键 Phase 3 topline 读数，无需紧急融资；（c）大额现金头寸产生的利息收入显著抵消 2026 年 Q1
              运营成本；（d）管理团队有多次此前大型退出事件，增强资本部署叙事可信度。财务风险溢价主要来自临床（KaiNETIC 成功概率）和竞争（GLP-1 格局定价与市场份额），不是短期流动性。
