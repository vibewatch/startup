      - number: '8.5'
        title: 建议、投资逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议：观察。Kailera 拥有 Lilly 和 Novo 之外肥胖领域最强的商业化前疗效资质——注射 ribupatide 的 23.6% Phase 2
              信号，是任何未上市肥胖项目公开报告的最高减重结果——但主要证明点是 2028 年的二元事件。按每股 $16 计算，隐含净管线 EV 约 $770 million，只给 ribupatide 注射剂 Phase 3
              成功赋予了温和的 20–25% 概率，远低于 BIO 历史 Phase 3 成功率约 59%。这意味着公开市场正在施加显著中国数据折价。如果未来 12–18 个月内，这一折价通过 KaiNETIC
              中期入组里程碑、口服 ribupatide Phase 3 启动和 KAI-7535 Phase 2 肥胖 topline
              数据得到部分消解，概率加权价值应被市场确认。不过，我们不建议在这些催化剂前建立买入仓位，因为不对称下行风险（Phase 3 失败会抹去 $770M+ 净管线
              EV，同时现金仍保留）意味着，等待催化剂确认后的入场点优于二元投机。


              关键正向催化剂：（1）2026 年确认 KaiNETIC 入组节奏，说明 2028 年主要数据时间线可信；（2）按指引在 1H'2027 启动口服 ribupatide 全球 Phase
              3；（3）KAI-7535 全球 Phase 2 肥胖 topline 在 2027 年为阳性；（4）2027 年任何 KaiNETIC Phase 3 中期数据信号；（5）如果 ribupatide Phase
              3 中期数据强劲，Kailera 成为 M&A 目标。投资逻辑破裂触发点（退出或做空理由）：（1）KaiNETIC Phase 3
              入组较指引时间线延迟超过六个月，提示研究中心准入或安全监测问题；（2）KAI-7535 全球 Phase 2 出现任何严重不良事件或 Grade ≥3 肝脏信号，将触发 lotiglipron/TERN-601
              先例；（3）ribupatide Phase 3 中期数据披露平均减重 < 15%，显著低于中国 Phase 2 信号；（4）战略环境变化：Lilly 或 Novo 在全球 Phase 3 中以尚未上市剂量实现
              best-in-class 注射疗效，消除第二个 best-in-class 进入者的理由。


              最终尽调问题：（1）审阅 KaiNETIC 试验方案，确认是否有任何非劣效参考臂会预先设定与 tirzepatide 的统计比较——如果没有，Phase 3
              成功只按安慰剂比较定义，差异化主张需要间接比较；（2）获取 Hengrui 授权协议摘要，覆盖终止条款、里程碑时间表和共同开发义务；（3）审阅 Kailera S-1/A 风险因素披露中关于 ribupatide
              在大中华区以外知识产权覆盖的内容；（4）评估 Kailera CFO/投资者关系团队是否提供了最低 KaiNETIC 入组速度或中期安全读出指引；（5）跟踪季度 KLRA 10-Q
              文件，查看任何管线进展说明或管理层对入组节奏的评论。
