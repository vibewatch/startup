      - number: '8.3'
        title: 可比交易与公开市场背景
        blocks:
          - type: paragraph
            body: >-
              与 Kailera 最直接相关的 M&A 可比交易，是 2026 年 1 月宣布的 Pfizer/Metsera 收购。Pfizer 同意以约 $4.9 billion upfront 加或有价值权利收购
              Metsera 及其下一代肥胖管线；外界广泛报道，这是 Pfizer 与 Novo Nordisk 竞购战的结果。Metsera 管线包括一个 Phase 2 每周一次注射 GLP-1/amylin
              双激动剂和一个口服 GLP-1 候选药物——在阶段和机制上大体可比于 ribupatide 注射剂和口服 ribupatide。$4.9 billion upfront 对价约为 Kailera IPO 市值的
              6.4×。如果 Kailera 的管线在 Phase 3 完成或中期数据阶段获得可比战略溢价，隐含收购价值将大幅超过 $16 IPO 价格。


              Zealand/Roche petrelintide 交易（2025 年 10 月）把一个 Phase 1b 阶段 amylin 类似物估值为 $1.65 billion upfront（总潜在价值 $5.3
              billion），说明大型药企愿意为差异化机制的肥胖资产付费，而且证据阶段可以远低于 Phase 3。Petrelintide 的 Phase 1b 疗效信号（16 周减重 8.6%）明显弱于
              ribupatide 注射剂 Phase 2 信号（36 周 23.6%），说明如果 ribupatide 的更高质量疗效数据能在全球复制，可能获得类似或更大的战略溢价。不过，Zealand 股价在 Phase
              2 中期试验结果（42 周减重 10.7%）低于投资者预期后，单日暴跌超过 30%；这直接提醒投资者，即便资产已有强合作方，延长试验仍可能令人失望，Phase 1b 信号也不能保证 Phase 2 或 Phase
              3 得到确认。


              在公开交易的 biotech 同业中，Viking Therapeutics（VKTX）的双激动剂 VK2735 项目在 Phase 2 完成时曾以 $3–$5 billion 市值交易；Zealand
              Pharma 即便 Phase 2 结果令人失望，也维持在 $2–$4 billion 区间的公开市场估值。Structure Therapeutics（GPCR）凭 Phase 2a 阶段口服小分子项目，市值约
              $1.5 billion。这些 comps 显示，Kailera $2.07 billion 的 IPO 市值对一家拥有四个临床阶段项目、主要注射剂 Phase 3 数据在 2028 年、现金支持至 2028
              年中的公司而言合理但不高估。经现金充裕度调整后，隐含 $770 million 净管线 EV 相比 comps 有利。
