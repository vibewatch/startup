      - number: '8.2'
        title: 估值框架：分部加总、rNPV 与市场机会
        blocks:
          - type: paragraph
            body: >-
              给 Kailera 这样一家商业化前、依赖管线的 biotech 估值，需要使用风险调整净现值（rNPV）的分部加总方法，而不是收入倍数或
              EV/EBITDA，因为公司没有收入，所有价值都来自概率加权的管线商业化。iValuate 框架和 Analysis Group 执业指南均将 rNPV 认定为这类公司的行业标准，并使用
              Biotechnology Innovation Organization 临床成功率数据中的阶段特定成功概率（PoS）因子。BIO 2024 年数据显示，小分子项目从 Phase 3 到监管批准的成功率约
              59%，生物制品约 47%；Phase 2 到 Phase 3 转化历史上约 58%。对处于 Phase 3 的 ribupatide 注射剂而言，管线整体 PoS 约为
              35–55%，取决于是否折价肥胖适应症以及中国到全球桥接风险。Analysis Group 论文计算后期资产折现率为 10–15%，与用于折现 Kailera ribupatide 注射剂现金流的区间一致。


              全球抗肥胖药物市场是 rNPV 建模的收入上限。JPMorgan Global Research 估计，incretin 市场到 2030 年将达到 $200 billion，到 2030 年约有 25
              million 美国人接受 GLP-1 治疗。Precedence Research 估计抗肥胖药物细分市场到 2035 年达到 $64.96 billion（2026 年起 CAGR
              24.71%），Fortune Business Insights 预计到 2034 年达到 $67.16 billion（CAGR 29.2%）。与这些估计一致，美国肥胖总可服务成人群超过 100
              million；BALANCE CMS 项目（2025 年末宣布，寻求 Medicare GLP-1 共付上限 $50/month）下的付款方准入扩张，可能大幅提高市场渗透。在这一背景下，即便 peak
              时拿下全球注射肥胖市场 2–5% 份额，也意味着 ribupatide 注射剂 peak sales 为 $2–$5 billion，足以支撑高十位数到低二十位数百分比的成功概率折现率，使该项目单独产生 $500
              million 至 $2 billion 净现值。


              $16 IPO 价格隐含的净管线 EV（$770 million）给每个项目平均分配约 $190 million PoS 加权
              NPV——相较类似或更早阶段单项目资产的先例交易，这一数字看起来保守。市场似乎施加了显著的中国数据折价；鉴于 ribupatide、KAI-7535 和 KAI-4729 的全部 Phase 2 证据都来自
              Hengrui 在中国参与者中开展的试验，并且必须桥接到全球人群，这种折价是合理的。Kailera 在澳大利亚开展的 Phase 1 SAD 桥接研究确认，亚洲与非亚洲参与者药代动力学相似；但监管方要接受中国
              Phase 2 疗效作为全球注册的主要依据，需要的远不止一项单剂量桥接研究。
