      - number: '7.2'
        title: Hengrui、中国地缘政治与 BIOSECURE 风险
        blocks:
          - type: paragraph
            body: >-
              Kailera 的核心依赖不是抽象的合作方风险，而是与 Hengrui 的单一上游关系；这条关系触及资产来源、核心 know-how、历史数据和当前药物供应。文件称，四个候选产品均由 Hengrui 独家授权给
              Kailera，用于大中华区以外地区，且 Hengrui 仍是临床供应的主要制造商。这种集中让 Kailera 对跨境政策变化、数据来源尽调和合同解释异常敏感。


              BIOSECURE 将这种暴露具体化。Congress.gov 和 BIOSECURE 信息网站均显示，该法于 2025 年 12
              月生效，并为既有合同设置五年祖父条款窗口。这会延后即时扰动，但没有解决问题：如果与 Hengrui 相关的制造或服务关系仍处于暴露状态，Kailera 仍会在 2030
              年面对决策点。由于公司没有公开披露替代制造网络、接管方案或资产迁移时间表，风险最好理解为集中度被推迟，而不是集中度被移除。


              中国来源开发数据构成第二层依赖。Kailera 受益于 Hengrui 既往临床工作和围绕 ribupatide 披露的 NMPA NDA 活动，但 FDA 审评中国以外申报时，仍可能取决于数据质量、可比性和
              CMC 转移证据。因此投资者应把 Hengrui 同时视为 Kailera 时间线的主要加速器，以及政策、法律和地缘政治冲击传导并损害价值的主要通道。
