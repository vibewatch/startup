      - number: '5.5'
        title: 竞争差异化与 IP 姿态
        blocks:
          - type: paragraph
            body: >
              Kailera 的竞争差异化逻辑有三根支柱：ribupatide 相对 tirzepatide（市场领导者）的更高疗效定位；管线宽度覆盖口服与注射给药，并横跨三种机制原型；以及 Hengrui
              中国以外数据包带来的上市速度优势。注射 ribupatide 瞄准当前 Phase 3 中追求的最高减重结果，8 mg 剂量数据显示 12 周减重 23.6%——如果 KaiNETIC 试验能在 76
              周维持这一水平，就会超过 tirzepatide Phase 3 中最高结果。口服 ribupatide 瞄准每日口服市场中的差异化耐受性，该市场正由 orforglipron（Eli Lilly，近期获 FDA
              批准）和每周一次口服 VK2735（Viking Therapeutics，Phase 3）进入。KAI-7535 则会在 GSBR-1290（Structure
              Therapeutics）等候选药物推进的小分子赛道中增加一个替代选择。


              IP 基础来自 Hengrui。除 S-1 风险因素披露外，Kailera 公开信息并未独立披露覆盖 ribupatide、口服 ribupatide 或 KAI-7535 成分与制剂的专利族；这些披露提到 IP
              来自 Hengrui 授权，第三方可能在与 KAI-7535 类似的化学骨架和机制上持有权利。Kailera 没有公开描述其 freedom-to-operate 状态，S-1 也将 IP
              授权终止风险列为重大风险因素。Kailera 围绕 Hengrui 管线的 IP 策略，取决于 Hengrui 准确维护并推进底层 IP，而 Kailera 无法独立核验这一点。
