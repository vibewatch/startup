      - number: '2.2'
        title: 多镜头测算：疾病负担巨大，品类销售巨大，但还不是干净的 Kailera SAM
        blocks:
          - type: paragraph
            body: >-
              肥胖症药物治疗背后的疾病负担无疑很大。WHO 称 2022 年有超过 890 million 成年人患有肥胖症，Kailera 的 S-1/A 则把肥胖症描述为影响全球超过 one billion
              人。在美国，CDC 最新更新显示成人肥胖率为 40.3%，重度肥胖率为 9.7%；糖尿病仍是重要相邻人群，美国有 40.1 million 人受影响，全球成年患者 589
              million。这些是需求指标，不是可报销市场指标。更相关的财务镜头是药品支出。IQVIA 估计全球肥胖症药物销售额 2025 年为 $66 billion、2026 年为 $92 billion，2027
              年后情景区间更宽。这已经是 blockbuster 级需求，但仍无法隔离 Kailera 可服务份额。公开证据可以测算品类规模和增长率；还不能按 BMI 区间、支付方线别或注射剂与口服组合干净拆出 Kailera
              专属 SAM。更自律的看法是：自上而下 TAM 无疑很大，但自下而上的付费上市人群仍受证据约束。
