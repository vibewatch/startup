      - number: '7.4'
        title: 融资、竞争、报销与治理风险
        blocks:
          - type: paragraph
            body: >-
              Kailera 进入风险章节时，现金远多于典型临床阶段肥胖公司，但融资的核心问题是时长，不是绝对金额。2026 年 3 月 31 日资产负债表显示，IPO 前公司持有 $581.9 million
              现金、现金等价物和有价证券；IPO 又带来 $718.8 million 毛 proceeds。不过，公司也披露，仅注射 ribupatide、口服 ribupatide 和 KAI-7535
              三个具名项目的资金分配就约 $825 million；Q1 经营现金消耗 $68.3 million，意味着如果时间线滑坡，烧钱轨迹仍可能在商业化前迫使公司再融资。


              竞争和报销风险会加剧融资压力。Lilly 的 FDA 批准口服 orforglipron，以及 Novo、Lilly 和更广泛 GLP-1 管线持续推进，意味着 Kailera
              的口服项目不再享有开放车道叙事。与此同时，KFF、CMS 和 ICER 材料都指向一个缓慢改善、但仍高度受价格和政策影响的准入环境，使未来利润率和采用率没有 topline 疗效本身暗示的那么确定。


              治理是更软但仍真实的风险。公开领导层和委员会披露显示，董事会和高管团队经验丰富；但也显示公司的战略、融资能力、Hengrui 监督和后期执行集中在一个可见但狭窄的班底里。这种组合要求按里程碑承销、设置明确
              kill criteria，并把尽调重点放在继任深度、董事会独立性和 2030 年 BIOSECURE 应急规划上，而不是仅因现金充足就感到安心。
