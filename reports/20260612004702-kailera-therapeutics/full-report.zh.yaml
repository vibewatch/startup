  - id: FM004
    title: Kailera 市场转化流程
    type: flow
    layout: standard
    summary: 从患病率到可持续收入，中间要穿过适用资格、处方医生选择、支付方批准、治疗启动和持续用药。
    data:
      nodes:
        - id: need
          label: 临床需求
          description: 肥胖和糖尿病负担庞大，带来需求。
        - id: segment
          label: 人群选择
          description: Kailera 将 BMI 35+ 和其他重度肥胖人群作为核心注射剂项目的优先目标。
        - id: prescriber
          label: 处方医生选择
          description: 初级保健和专科医生决定，减重幅度还是口服便利性更重要。
        - id: coverage
          label: 覆盖批准
          description: 商业保险、PBM 和 CMS 介导路径决定可负担性。
        - id: initiation
          label: 治疗启动
          description: 成本和准入障碍清除后，患者才会开始注射或口服治疗。
        - id: persistence
          label: 持续用药
          description: GI 耐受性、成本和体重反弹担忧决定复购经济性。
        - id: value
          label: 实现的市场价值
          description: 只有可持续、可报销的使用，才能把庞大患者池转化为持久收入。
      edges:
        - from: need
          to: segment
          label: 不是每个患者都是早期目标
        - from: segment
          to: prescriber
          label: 目标人群进入医生决策路径
        - from: prescriber
          to: coverage
          label: 处方必须通过预算关口
        - from: coverage
          to: initiation
          label: 获批患者开始治疗
        - from: initiation
          to: persistence
          label: 耐受性和便利性影响延续
        - from: persistence
          to: value
          label: 留存驱动实现的经济性
        - from: coverage
          to: value
          label: 覆盖广度限制可触达量
    approximationNotes: 流程是示意图，不是合约路径。它强调为何患病率和品类销售额会高估任何单一进入者可捕获的规模。
