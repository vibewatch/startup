      - number: '1.4'
        title: 里程碑、规模标记与负面信号
        blocks:
          - type: paragraph
            body: >-
              以成立时间衡量，Kailera 的公开里程碑节奏异常快。公司第一年内完成了 2024 年 5 月的 Hengrui 授权，低调募得 $200 million，随后在 2024 年 10 月凭 $400
              million 融资轮和完整的七人高管团队公开亮相。KaiNETIC 全球 Phase 3 项目——三项随机对照试验，覆盖 BMI 30+、T2D 和 BMI 35+ 人群——于 2025 年 12 月和
              2026 年 1 月启动。ribupatide 高剂量 Phase 2b 试验（最高 20 mg）于 2026 年 3 月启动，KAI-7535 Phase 2 试验于 2026 年 4 月启动，IPO 也于
              2026 年 4 月定价。2026 年 5 月，Hengrui 正在中国开展的项目披露了两项结果：KAI-7535（HRS-7535）Phase 3 T2D topline 达到主要终点，第 32 周 HbA1c
              下降 1.40–1.68%；KAI-4729 Phase 1 SAD/MAD 第 12 周平均减重 16%。这显著降低了两项管线资产风险。

              公开记录中的主要负面信号更多是结构性，而非运营性。第一，Kailera 整条管线均授权自并依赖同一家中国药企 Hengrui，形成监管、地缘政治和供应链集中风险，S-1/A 对此有长篇列举。第二，Hengrui
              License Agreement 包含最高 $5.7 billion 商业里程碑付款，以及净销售额中个位数中段至低十位数百分比的版税，未来义务堆栈很重。第三，Kailera
              进入的是行业内竞争最激烈的治疗类别之一，Novo Nordisk（semaglutide/Wegovy）和 Eli
              Lilly（tirzepatide/Zepbound）合计主导当前市场，多个资金充足的新进入者也在推进。第四，公司未公开披露员工数，管理层关于现金可支撑至 2028
              年中的指引明确是基于当前运营计划的估计，可能被证伪。第五，KaiNETIC Phase 3 topline 数据预计到 2028 年才会出来，投资者要面对多年二元临床风险窗口。
