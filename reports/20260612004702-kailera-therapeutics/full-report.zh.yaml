              对口服肥胖方案兴趣很高；IQVIA 称，口服 Wegovy 在上市前八周拿下约三分之一的新品牌处方。这些信号支持给药途径可以扩大市场的判断。但它们仍是类比，不是 Kailera 自身胜利。Kailera
