      - number: '7.3'
        title: 制造、供应链与运营风险
        blocks:
          - type: paragraph
            body: >-
              Kailera 的运营模式跑得快，是因为它把许多硬活外部化给 Hengrui 和更广泛的试验网络；但这种速度伴随异常高的运营脆弱性。注射 ribupatide、口服 ribupatide 和 KAI-7535
              都需要可靠的 CMC 执行，而 Kailera 同时在推进三项关键试验、一项高剂量扩展和一项新的 Phase 2 研究。公开材料能证明这些活动存在，但没有披露批次可重复性、备用供应商资质、放行规格、验证进展，或
              Hengrui 供应中断时的应急制造方案。


              口服项目会放大这个问题。口服 ribupatide 仍依赖肽制剂纪律，KAI-7535 则在 Lilly 已获批口服 orforglipron
              重设便利性预期的同时，叠加小分子放大生产和剂量暴露优化风险。即便公司在中国披露的耐受性数据有利，研究扩展到多个国家、CRO、试验中心和对照臂时，也不能消除执行风险。


              从运营上看，风险不是一次灾难性失败，而是滑坡叠加：供应中断会拖慢入组，CMC 延迟会推迟监管互动，后期一次运营失误会在差异化数据到来前吃掉资本。由于 Kailera
              没有公开披露多元供应商地图或详细资源计划，即便现金余额强劲，剩余暴露仍高。
