      - number: '1.3'
        title: 融资历史、IPO 与资本市场
        blocks:
          - type: paragraph
            body: >-
              Kailera 于 2024 年 10 月公开亮相，宣布完成 $400 million Series A 融资；其中第一笔 $200 million tranche 已在 2024 年 5 月与 Hengrui
              授权同步秘密完成。公司于 2024 年 12 月额外发行 $100 million Series A-1 股份，并在 2025 年 5 月发行最后一笔 $100 million 可转债 tranche，使承诺
              Series A 总额达到 $400 million。Series A 财团包括 Bain Capital Life Sciences、Bain Capital Private Equity、RTW
              Investments、Atlas Venture 和 Canada Pension Plan Investment Board（CPP Investments）。2025 年 10 月 31 日，Kailera
              以每股 $14.00 完成 Series B 优先股轮 $500 million 现金交割；同期 $103.2 million 票据转换为 Series B 后，Series B 总清算价值约 $603.2
              million。招股书显示 IPO 前股权融资约 $900 million。Bain Capital Private Equity、Bain Capital Life Sciences 和 Qatar
              Investment Authority 被列为对 IPO 表达认购意向的现有股东。

              2026 年 4 月 17 日，Kailera 将 IPO 定价为每股 $16.00，出售 39,062,500 股，基础募资总额 $625 million——行业媒体称其为史上最大生物科技 IPO，超过
              Moderna 2018 年纪录。由 J.P. Morgan、Jefferies、Leerink Partners、TD Cowen、Evercore ISI 和 William Blair 牵头的承销商全额行使
              5,859,375 股超额配售权；发行于 2026 年 4 月 20 日完成，总募资额 $718.8 million。股票以 KLRA 开始交易，开盘价约 $26，较 $16 IPO 价溢价 63%。按 IPO
              价计算，完全摊薄市值视稀释性证券处理方式不同，隐含估值约 $2.1 billion 至 $3.1 billion。
