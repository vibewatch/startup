      - number: '3.4'
        title: 相邻与战略威胁：Zealand/Roche、Altimmune、中国背景、Metsera/Pfizer
        blocks:
          - type: paragraph
            body: >-
              相邻项目和战略交易共同定义 Kailera 的上行选择权与下行估值风险框架。Zealand 与 Roche 共同开发 petrelintide 这一每周一次皮下注射 amylin
              analog，是最具战略相关性的相邻威胁：交易包含 $1.65 billion 首付款和最高 $5.3 billion 潜在总对价，petrelintide 正推进至 Phase
              3，并主打差异化的瘦体重保留叙事。petrelintide 在机制上不直接与 ribupatide 竞争，但它争夺下一代肥胖症护理中同一批支付方、医生和组合伙伴的心智，尤其当 petrelintide
              显示更好耐受性或肌肉量保护时。Altimmune 的 pemvidutide 是 GLP-1/glucagon 双重激动剂，为已经拥挤的相邻项目名单再增加一种组合机制选择，尽管其在 MASH
              阶段更靠后，在肥胖症中比 Kailera 项目更早。

              中国竞争背景对 Kailera 具有结构性重要性，因为 Kailera 迄今所有数据都来自 Hengrui 在中国受试者中开展的试验。Hengrui 已向中国 NMPA 提交注射 ribupatide
              上市许可申请，并计划独立在中国将口服 ribupatide 推进到 Phase 3。同时，Hengrui 正在中国推进 KAI-7535（HRS-7535）的 T2D Phase 3（OUTSTAND-1
              达到主要终点），肥胖症 Phase 3 数据预计 2026 年晚些时候出来。中国数据机器是 Kailera 的资产——它在 Kailera 自身全球试验时间线之前生成临床证明点——但也意味着 Kailera
              的全球监管申报需要桥接证据。Kailera 在澳大利亚开展的 Phase 1 SAD 桥接研究确认亚洲和非亚洲受试者 PK/PD 相似，支撑全球 KaiNETIC
              项目；但监管机构通常需要远多于单剂量桥接研究的证据。Pfizer $4.9 billion 收购 Metsera，以及 Pfizer 与 Novo 围绕 Metsera 的 $10+ billion
              竞价战，确认大型药企愿意为差异化肥胖症资产支付异常高的战略溢价——若 ribupatide 全球 Phase 3 数据强，这一信号最终利好 Kailera。
