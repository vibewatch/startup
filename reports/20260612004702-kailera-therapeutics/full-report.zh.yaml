    sections:
      - number: '1.1'
        title: 身份、总部与产品论点
        blocks:
          - type: paragraph
            body: >-
              Kailera Therapeutics, Inc. 是一家 Delaware 公司，成立日期为 2024 年 5 月 8 日。其主要执行办公室位于 180 Third Avenue, 4th Floor,
              Waltham, Massachusetts 02451。公司于 2026 年 4 月 20 日以每股 $16.00 在 Nasdaq Global Select Market 完成 IPO，股票代码
              KLRA；截至 2026 年 5 月 20 日，公司有 129,565,608 股普通股流通。Kailera
              自称是一家先进临床阶段生物技术公司，专注于推进多元化管线，为肥胖症患者在治疗旅程的不同阶段提供选择，从而提升下一代肥胖症护理。

              产品论点建立在四个基于 GLP-1 的临床阶段候选药物上，这些候选药物最初均由 Jiangsu Hengrui Pharmaceuticals Co., Ltd.（Hengrui）面向中国市场发现和开发，并于
              2024 年 5 月授权给 Kailera。Kailera 持有四个候选药物在中国、香港、澳门和台湾（合称大中华区）以外的全球独家开发和商业化权利。牵头候选药物是 ribupatide，也称
              KAI-9531，是每周一次注射的 GLP-1 / 葡萄糖依赖性促胰岛素多肽（GIP）受体双重激动剂，目前通过 KaiNETIC 项目开展全球 Phase 3 评估。三个补充候选药物分别是口服
              ribupatide（KAI-9531-T，同一肽分子的每日一次口服制剂）、KAI-7535（每日一次口服小分子 GLP-1 受体激动剂）和 KAI-4729（每周一次注射
              GLP-1/GIP/胰高血糖素受体三重激动剂）。Kailera 自成立以来未从任何来源产生收入，仍完全处于商业化前阶段。
