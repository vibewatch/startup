            body: >
              Ribupatide 8 mg 数据显示，仅治疗 12 周即可降低体重 23.6%，这是 Kailera 公开记录中最有说服力的单一数据点。如果 KaiNETIC 试验能在 76
              周复制可比疗效，并保持可接受耐受性，ribupatide 将拥有任何已获批或接近获批肥胖药物中最强的减重曲线。
