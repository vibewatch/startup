  - id: FV001
    title: Kailera 估值 KPI 仪表盘
    type: kpi
    layout: standard
    summary: Kailera IPO 价格下的核心估值指标；相较 M&A 先例和按 3 期 PoS 调整的 rNPV，约 $770M 的净管线企业价值显得保守。
    approximationNotes: 市值和净管线企业价值由 IPO 价格（$16）× IPO 后股数（Q1 2026 10-Q 披露的 129,565,608 股）推导。IPO 后现金根据 IPO 前资产负债表加 IPO 净募资估计。
    data:
      items:
        - label: IPO 市值
          value: ~$2.07 billion
          detail: $16/股 × 129,565,608 股；Kailera 于 2026 年 4 月 17 日开始交易
          tone: neutral
        - label: 净管线企业价值
          value: ~$770 million
          detail: 市值减去估计 IPO 后现金约 $1.3 billion
          tone: neutral
        - label: IPO 后现金和证券
          value: ~$1.27 billion
          detail: IPO 前 $581.9M + IPO 净募资约 $690M；现金跑道到 2028 年中
          tone: positive
        - label: Q1 2026 季度烧钱速度
          value: $78.9 million net loss
          detail: $70.9M R&D + $13.8M G&A；四个临床项目并行
          tone: warning
        - label: 估计年度运行率
          value: ~$316 million/year
          detail: 基于 Q1 烧钱速度；3 期爬坡后烧钱大概率上升
          tone: warning
        - label: 每个项目净管线 EV（简单平均）
          value: ~$193 million per program
          detail: $770M / 4 个项目；远低于同阶段资产的 M&A 先例
          tone: positive
        - label: 可比 M&A 先例（Metsera/Pfizer）
          value: $4.9B upfront for 2-program portfolio
          detail: 2 期注射剂 + 1 期口服；设定战略收购天花板
          tone: positive
        - label: 乐观到悲观上行 / 下行区间
          value: $8–$77/share
          detail: 悲观 $8–$12；基准 $23–$39；乐观 $54–$77；均相对于 $16 IPO 价格
          tone: neutral
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV026
      - CV037
      - CV038
  - id: FV002
    title: 估值敏感性：Ribupatide 注射剂的 PoS vs. rNPV
    type: matrix
    layout: standard
    summary: Ribupatide 注射剂 rNPV 对 3 期 PoS 和峰值销售假设的敏感性；它说明 Kailera 价值具有二元结果属性，合理结果区间很宽。
    approximationNotes: rNPV 估计仅作示意。基准峰值销售区间为 $3.5–$5B。折现率 12–15%。假设 2030 年上市。所有数值单位为 $M。成功概率包括完成 3 期以及获得 FDA/EMA 批准。
    data:
      columns:
        - 峰值销售 $3B（低）
        - 峰值销售 $4B（中）
        - 峰值销售 $5B（高）
      rows:
        - label: PoS 20%（深度中国折价）
          values:
            - label: $300M rNPV
              tone: warning
            - label: $400M rNPV
              tone: warning
            - label: $500M rNPV
              tone: warning
        - label: PoS 35%（基准情景）
          values:
            - label: $525M rNPV
              tone: neutral
            - label: $700M rNPV
              tone: neutral
            - label: $875M rNPV
              tone: positive
        - label: PoS 50%（确认性桥接）
          values:
            - label: $750M rNPV
              tone: positive
            - label: $1.0B rNPV
              tone: positive
            - label: $1.25B rNPV
              tone: positive
        - label: PoS 60%（历史 3 期成功率）
          values:
            - label: $900M rNPV
              tone: positive
            - label: $1.2B rNPV
              tone: positive
            - label: $1.5B rNPV
              tone: positive
    claimRefs:
      - CV020
      - CV021
      - CV023
      - CV036
      - CV039
      - CV040
  - id: FV003
    title: 公开肥胖生物科技定位：净管线 EV 对比临床成熟度
    type: quadrant
    layout: standard
    summary: 与 Viking、Zealand 和 M&A 可比案例相比，Kailera 约 $770M 的净管线 EV 相对临床成熟度（主项目 3 期）偏低；这反映中国数据折价和到 2028 年前的二元等待。
    approximationNotes: 净管线 EV 估计为近似公开市值减去已披露或估计现金。临床成熟度按 1–10 打分（1=仅 1 期，10=已上市）。数值基于截至 2026 年 Q2 的公开数据估计。M&A 可比案例按交易价值减去交易时估计现金绘制。
    data:
      xAxis:
        label: 主项目临床成熟度（1=1 期，10=已上市）
      yAxis:
        label: 净管线 EV / 收购价值（$B）
      points:
        - label: Kailera（KLRA）——IPO 价格
          x: 7
          'y': 0.77
          detail: 3 期主项目（ribupatide 注射剂）+ 2 期口服 + 2 期 KAI-7535；$16 时净管线 EV 为 $770M
          tone: positive
        - label: Viking（VKTX）——约
          x: 8
          'y': 3
          detail: 皮下 VK2735 3 期已入组 + 口服 VK2735 2 期阳性；净管线 EV 约 $3B
          tone: warning
        - label: Zealand Pharma——约
          x: 7
          'y': 2.5
          detail: Petrelintide 计划进入 3 期 + Roche 合作；净管线 EV 约 $2.5B
          tone: warning
        - label: Structure（GPCR）——约
          x: 5
          'y': 1.2
          detail: GSBR-1290 2a 期阳性；净管线 EV 约 $1.2B
          tone: neutral
        - label: Metsera——M&A 可比案例
          x: 6
          'y': 4.9
          detail: Pfizer 预付 $4.9B；收购时为 2 期注射剂 + 1 期口服
          tone: positive
        - label: Petrelintide（Zealand-Roche 交易）
          x: 4
          'y': 1.65
          detail: 1b 期 amylin 类似物预付款 $1.65B；Kailera ribupatide 的 2 期信号更强
          tone: positive
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV034
      - CV035
  - id: FV004
    title: Kailera 观察建议逻辑流
    type: flow
    layout: standard
    summary: 决策逻辑支持观察建议；关键不确定性在于 3 期数据时间（2028）和中国疗效向全球转化；买入条件需要催化剂确认。
    approximationNotes: 流程代表分析决策逻辑，不是机械算法。所有分支反映截至 2026 年 6 月的可得证据。
    data:
      nodes:
        - id: N1
          label: 非现有龙头中最佳疗效信号（36w 达 23.6%）
          detail: Ribupatide 注射剂中国 2 期数据；未见平台期；安全性良好
          tone: positive
        - id: N2
          label: 净管线 EV 约 $770M——相对 M&A 可比案例似乎低估
          detail: Metsera 估值 $4.9B；petrelintide 预付款 $1.65B；信号相当或更弱
          tone: positive
        - id: N3
          label: 中国数据折价适用（所有数据来自 Hengrui 中国试验）
          detail: 全球 3 期必须桥接到西方人群；桥接研究支持 PK 相似性
          tone: warning
        - id: N4
          label: 2 年二元等待（KaiNETIC 数据 2028）
          detail: 主要验证点在 2 年多以后；资本被锁在二元结果里；竞争格局仍在推进
          tone: warning
        - id: N5
          label: 观察——加仓前跟踪催化剂
          detail: 建立起始跟踪仓位；催化剂确认前不要全面买入
          tone: neutral
        - id: N6
          label: 买入触发——KaiNETIC 期中或口服 3 期启动（2027）
          detail: 如果 KaiNETIC 期中确认 ≥18%，或口服 ribupatide 3 期按计划启动
          tone: positive
        - id: N7
          label: 卖出/退出触发——3 期失败或严重安全信号
          detail: KaiNETIC 全球 <15%，或 KAI-7535 出现 Grade ≥3 肝脏事件
          tone: warning
      edges:
        - from: N1
          to: N2
          label: 支撑上行逻辑
        - from: N2
          to: N3
          label: 但受制于
        - from: N3
          to: N4
          label: 叠加风险
        - from: N4
          to: N5
          label: 因此
        - from: N5
          to: N6
          label: 上调条件
        - from: N5
          to: N7
          label: 下调条件
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
      - CV048
