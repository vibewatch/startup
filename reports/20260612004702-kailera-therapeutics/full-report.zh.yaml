      - number: '3.5'
        title: 护城河耐久性、切换逻辑与竞争结论
        blocks:
          - type: paragraph
            body: >-
              Kailera 的竞争护城河建立在两根柱子上：ribupatide 疗效信号相对其他非 Lilly/Novo 项目的质量，以及让 Kailera 能在单一公司 franchise
              下覆盖多种治疗形态的组合广度。第一根柱子真实存在，且相对媒体报道仍被低估：注射 ribupatide 在中国 36 周平均减重 23.6%，是任何 ex-Lilly/Novo 肥胖症项目最好的 Phase 2/3
              数据点。口服 ribupatide 数据（26 周 12.1%，无因 GI AE 停药）在耐受性上优于 Viking VK2735 口服（13 周 12.2%），在时长上不如后者；但无平台期且无 GI
              停药的信号具临床差异。KAI-4729 三重激动剂在 Phase 1 MAD、12 mg 剂量下 12 周减重 16%，又增加了一层选择权。

              第二根柱子——组合广度——结构上有价值，但也制造执行风险。Kailera 在 2026 年 Q1 单季烧掉 $78.9 million 的同时并行推进四个临床项目，无法承受围绕任一资产长期二元等待；现金
              runway 延伸至 2028
              年中，但要求严格的组合优先级。商业上，一旦有竞争替代方案且支付方验证它们，肥胖症药物治疗的切换成本就很低；在差异化格局中，市场份额通常流向证据密度最高、医生最熟悉、准入基础设施最强的项目。今天这偏向 Lilly
              和 Novo，也意味着 ribupatide 的注射剂护城河主张完全取决于 KaiNETIC 数据能否证明更优全球疗效，而该数据到 2028 年才会出来。竞争结论需要带细节：Kailera 拥有所有非
              incumbent 肥胖症公司中最强的商业化前疗效资质，但相关证明还在 2 年多以后；Viking 正加速自己的口服 Phase 3；Lilly 会在任何 Kailera 口服项目完成关键研究之前，让
              orforglipron 上市。
