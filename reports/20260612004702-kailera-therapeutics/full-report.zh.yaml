      - number: '1.2'
        title: 管理层板凳与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Kailera 组建了一支经验丰富的管理团队，核心来自 Cerevel Therapeutics 和 Translate Bio 校友网络。Ron Renaud 担任总裁兼首席执行官，此前带领 Cerevel
              Therapeutics 于 2024 年被 AbbVie 收购，再之前曾任 Translate Bio 董事长兼 CEO，直至其 2021 年被 Sanofi 收购。Cerevel 背景延伸到运营层：Scott
              Akamine（首席法务官）和 Paul Burgess（首席运营官兼首席商务官）也曾在 Cerevel 任高级职位。Doug Pagán（首席财务官）有多次生物科技退出记录，包括 Jnana
              Therapeutics（被 Otsuka 以约 $1 billion 收购）和 Dicerna Pharmaceuticals（被 Novo Nordisk 以 $3.3 billion 收购）。Scott
              Wasserman, M.D.（首席医学官）曾任 Amgen VP 及骨骼、心血管、代谢和神经科学全球开发治疗领域负责人。Jamie Coleman（首席商务官）在 Eli Lilly 拥有近 25
              年商业经验，包括担任 Zepbound 美国品牌负责人。Paula Cloghessy（首席人力官）此前任职于 Seres Therapeutics 和 Translate Bio。

              董事会由 John F. Milligan, Ph.D. 担任主席；他在 Gilead Sciences 任职 29 年，并于 2018 年以总裁兼 CEO 身份退休。其他董事包括 Frank K.
              Clyburn Jr.（Merck 前 EVP、人类健康事业部总裁）、Christopher Hite（Royalty Pharma Partnering & Investments
              主席，任独立董事和审计委员会主席）、Andrew Kaplan（Bain Capital Private Equity 合伙人）、Adam Koppel, M.D., Ph.D.（Bain Capital
              Life Sciences 合伙人）、Yuting (Shelley) Liu, Ph.D.（Jiangsu Hengrui Pharmaceuticals 中国业务发展与战略负责人）和 Martin
              Mackay, Ph.D.（Rallybio Corporation 联合创始人兼董事长）。管理团队中 Cerevel 和 Translate Bio 校友高度集中，构成值得持续审视的关键人依赖；Hengrui
              关联董事席位也可能在商业谈判场景中制造潜在治理张力。
