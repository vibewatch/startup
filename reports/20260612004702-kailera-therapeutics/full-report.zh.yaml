      - number: '3.2'
        title: Lilly 与 Novo：Kailera 必须打败的商业和临床标准
        blocks:
          - type: paragraph
            body: >-
              Lilly 的 Zepbound 和 Novo 的 Wegovy 共同定义了肥胖症药物能达到的商业体量，也定义了市场评判每个挑战者的疗效门槛。Zepbound 是注射剂类别的疗效基准：tirzepatide 在
              SURMOUNT-1 中 72 周平均安慰剂校正减重 21.8%（15 mg 剂量），是获批肥胖症药物中最高的疗效信号，也成为任何新进入者事实上的比较锚点。ribupatide 在中国 8 mg 剂量 36
              周显示 23.6% 平均减重，Kailera 用它支撑 best-in-class 潜力；但试验人群（中国受试者）、给药时长和试验设计不能直接等同于 SURMOUNT，只有全球 Phase 3
              能回答该疗效差距在中国以外是否持续。

              Novo 的 Wegovy（semaglutide 2.4 mg SC）代表了已习惯开具注射 GLP-1 的医生心中的 incumbent 标准：大规模 STEP
              项目证据、两年以上商业经验和品牌化处方医生忠诚度，使 Wegovy 成为任何新注射剂必须从其上做差异化的基线。Lilly 的 orforglipron 截至 2026
              年中已处于监管申报阶段，带来另一种压力：每日一次口服非肽 GLP-1，无食物或饮水限制，并在 ACHIEVE-3 头对头试验中于血糖控制和减重两项指标击败口服 semaglutide（52 周减重 9.2% vs
              5.3%）。Orforglipron 若获批，将成为 Kailera 口服 ribupatide 和 KAI-7535 项目最直接的口服基准，因为它会在 Kailera 任一口服项目拿到 Phase 3
              关键数据之前，先建立患者和支付方价格锚点、先发每日口服基础设施和比较疗效门槛。Novo 的口服 amycretin 是 GLP-1/amylin 双重激动剂，增加了相邻下一代威胁：Phase 2 数据中，口服组
              36 周减重 10.1%，皮下注射组 14.5%；Novo 计划 2026 年推进至 Phase 3。amycretin 的组合信号重要，是因为它直接瞄准同一套生物学逻辑——GLP-1 加互补机制——这也是
              Kailera 对未来项目组合路径的底层思路。
