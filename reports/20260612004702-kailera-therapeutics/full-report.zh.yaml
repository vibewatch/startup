  - id: FU001
    title: 未来利益相关方旅程图
    type: journey-map
    layout: wide
    summary: Kailera 未来客户路径不是从卖出客户标识走到续约，而是从肥胖治疗需求出发，经过证据审查、覆盖批准、治疗启动，再到重复使用。
    data:
      items:
        - id: need
          label: 临床需求出现
          actor: 患者和临床医生
          description: 肥胖或超重叠加合并症，被判断为需要药物支持。
          channels:
            - 医生就诊
            - 专科转诊
            - 患者自我识别
        - id: evidence
          label: 证据审查
          actor: 处方医生
          description: 临床医生评估 3 期和口服项目数据，看疗效、安全性和可用性。
          channels:
            - 临床数据
            - 医学会议
            - 竞品基准
        - id: coverage
          label: 覆盖决定
          actor: 支付方 / PBM / CMS
          description: 预算方决定疗法是否报销，以及附带哪些限制。
          channels:
            - 药品目录审查
            - 事先授权
            - 过渡支付模型
        - id: start
          label: 治疗启动
          actor: 患者
          description: 只要可及性、教育和耐受性门槛跨过去，患者就会开始治疗。
          channels:
            - 处方
            - 专科药房
            - 患者支持
        - id: persist
          label: 重复使用
          actor: 患者 + 支付方 + 医生
          description: 复购取决于疗效能否维持、价格能否负担，以及 GI 耐受性。
          channels:
            - 续方行为
            - 随访就诊
            - 覆盖续审
        - id: expand
          label: 平台扩张
          actor: 合作伙伴 / 处方医生 / 投资者
          description: 如果主项目跑通，口服项目和合作会拓宽 Kailera 未来客户版图。
          channels:
            - BD 讨论
            - 生命周期规划
            - 上市准备
