      - number: '5.2'
        title: Ribupatide 机制、临床数据与 Phase 3 KaiNETIC 项目
        blocks:
          - type: paragraph
            body: >
              Ribupatide（KAI-9531）是一种每周一次注射的 GLP-1/GIP 受体双激动剂肽，设计目标是靠改造后的受体效力，达到比 tirzepatide（截至 2026
              年处方量最高的肥胖药物）更高的减重幅度：体外研究显示，与 tirzepatide 相比，它的 GLP-1 受体结合亲和力为 3x，GIP 受体结合亲和力为 0.5x，半衰期约 7 天——大约比
              tirzepatide 长两天——从而维持每周暴露。Ribupatide 尚未在临床试验中与 tirzepatide 或 semaglutide 做头对头比较；所有比较都来自机制推断或模型估算。


              支撑 KaiNETIC 启动的临床证据，以进入 Phase 3 的标准看相当扎实。Hengrui 试验累计给药超过 2,500 名参与者，包括一项在中国开展的 48 周 Phase 3 研究：6 mg
              最高剂量组平均体重最多下降 19.2%（按治疗政策估计量为 17.7%），且减重尚未平台化。另一项 Phase 2 研究评估 8 mg 剂量，仅治疗 12 周，按疗效估计量计算体重较基线下降
              23.6%（按治疗政策估计量为 22.8%）。胃肠道不良事件为轻至中度，与 GLP-1 类别一致；更重要的是，3 mg 及以上剂量的不良事件趋于稳定，说明更高剂量或可继续探索，而不会按比例增加胃肠负担。


              KaiNETIC 全球 Phase 3 项目由三项同步开展的双盲、随机、安慰剂对照 76 周试验组成，评估 4、6、8、10 mg 剂量：KaiNETIC-1（NCT07284875，约 1,800
              名成人，BMI ≥30，或 BMI ≥27 且伴合并症，无 T2D）、KaiNETIC-2（NCT07284901，约 1,700 名成人，BMI ≥27 且伴
              T2D）、KaiNETIC-3（NCT07284979，约 1,200 名成人，BMI ≥35 且无 T2D，包括一个开放标签 semaglutide 2.4 mg 组）。三项试验均在 2025 年末或 2026
              年 1 月启动，预计 2028 年公布 topline 结果。Kailera 还在 2026 年 3 月启动一项 Phase 2b 高剂量试验（最高 20 mg），目标是在 2027 年获得 topline
              结果，用来评估 Phase 3 剂量范围以上能否带来更大减重。
