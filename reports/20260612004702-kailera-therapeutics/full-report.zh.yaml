  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: IPO 经济性与 IPO 后融资背景
        blocks:
          - type: paragraph
            body: >-
              Kailera 2026 年 4 月 IPO 确立了公司的公开市场入口点和资本基础。发行价为每股 $16——位于修订后 $14–$16 区间上端——在承销商全额行使绿鞋、额外购买 5,859,375 股前，先发行
              39,062,500 股 primary shares；最终总发行股数达到 44,921,875 股，扣除承销折扣和发行费用前毛 proceeds 为 $718.8 million。Kailera 于 2026
              年 4 月 17 日开始在 Nasdaq Global Select Market 以代码 KLRA 交易。Fierce Biotech 指出，这次发行刷新了 biotech IPO 的新标杆。


              截至 2026 年 3 月 31 日（IPO 前夕），Kailera 持有 $111.8 million 现金及现金等价物、$407.3 million 短期有价证券和 $62.7 million
              长期有价证券，合计约 $581.9 million。纳入扣除承销费后的 IPO 净 proceeds（约 $685–$695 million）后，Kailera 合计现金基础超过 $1.2
              billion；管理层表示，合计现金和 proceeds 预计可支持运营至 2028 年中。按 2026 年 5 月 20 日总流通股 129,565,608 股计算，$16 发行价对应的 IPO 市值约为
              $2.07 billion。最近一轮 IPO 前融资是 2025 年 10 月完成的 $600 million Series B，由 Bain Capital Private Equity 领投，CPP
              Investments、QIA、T. Rowe Price、Royalty Pharma、Adage Capital Management 和 Janus Henderson 参与；Series B
              投资者集团与既有投资者 Atlas Venture、Bain Capital Life Sciences 和 RTW Investments 汇合。


              $16 的 IPO 进入价格意味着净管线企业价值（市值减现金）约 $770 million。这是关键估值锚：IPO 时市场给四个临床阶段项目的概率加权未来商业化价值合计定价约 $770 million，包括注射
              ribupatide（Phase 3）、口服 ribupatide（Phase 2 完成）、KAI-7535（Phase 2）和 KAI-4729（Phase 1 MAD）。现金消耗速度很重要：按 2026 年
              Q1 水平（净亏损 $78.9 million；R&D $70.9 million，G&A $13.8 million），年化烧钱超过 $300
              million，意味着若无额外融资事件，现金基础还能支持约四年运营——覆盖至 2028 年 KaiNETIC 数据目标之后。
