  - id: TP001
    title: 与 Kailera 直接及相邻的肥胖竞争项目画像
    enumerationScope:
      coverage: partial
      basis: >-
        Twelve most decision-relevant programs competing with or adjacent to Kailera's obesity pipeline as of June 2026,
        covering injectable and oral incretins, multi-mechanism programs, and amylin-based approaches.
    columns:
      - 项目 / 公司
      - 给药形式与机制
      - 阶段（Jun-2026）
      - 最佳公开疗效信号
      - 关键耐受性信号
      - 战略位置
    rows:
      - - Ribupatide 注射剂 / Kailera
        - 每周一次皮下注射 GLP-1/GIP 双重激动剂
        - Phase 3 KaiNETIC（3 项试验）；美国 Ph2b 高剂量也已启动
        - 36 周平均减重 23.6%（Hengrui 中国 Phase 2，8 mg）
        - '>2,500 名受试者中安全性良好；与 GLP-1 类别一致；Ph1 桥接确认亚洲 / 非亚洲人群 PK 相近'
        - 先导项目；有潜力成为同类最佳注射剂；全球 Ph3 数据预计 2028 年公布
      - - 口服 ribupatide / Kailera
        - 每日一次口服 GLP-1/GIP 双重激动剂多肽片剂
        - Phase 2 已完成（中国）；全球 Ph3 计划 1H'2027
        - 26 周平均减重 12.1%（Hengrui 中国 Phase 2，25 mg/50 mg）
        - 胃肠道 AE 发生率低；无因胃肠道 AE 停药；无肝脏信号
        - ribupatide 产品族的一部分；把注射剂疗效接到口服便利性上
      - - KAI-7535 / Kailera
        - 每日一次口服小分子 GLP-1 激动剂
        - 全球 Ph2 肥胖适应症 2026 年启动；中国 Ph3 T2D OUTSTAND-1 阳性
        - OUTSTAND-1 T2D 试验达到主要终点（32 周 HbA1c 降幅相对安慰剂）
        - 安全性和耐受性良好；T2D 项目无肝脏安全信号
        - 具备中国 T2D Phase 3 证据的口服小分子；全球 Ph2 肥胖数据预计 2027 年公布
      - - KAI-4729 / Kailera
        - 每周一次注射 GLP-1/GIP/glucagon 三重激动剂
        - Phase 1 MAD 已完成；Ph2 计划 2026 年
        - Phase 1 MAD 中 12 周平均减重 16.0%（12 mg）
        - 轻至中度胃肠道相关 TEAE；肝脂肪按剂量下降（MRI PDFF）
        - 具备 MASH 和肥胖潜力的三重激动剂；靠 glucagon 臂做出差异化
      - - Zepbound/tirzepatide / Lilly（竞品）
        - 每周一次皮下注射 GLP-1/GIP 双重激动剂
        - 已上市（FDA 2023 年批准）；2024 年新增 OSA 适应症
        - SURMOUNT-1 中 72 周安慰剂校正减重约 21.8%（15 mg）
        - 胃肠道不良事件与类别一致；大型 SURMOUNT 项目显示可耐受
        - 商业基准；肥胖适应症最大市场份额；收入轨迹约 $50B
      - - Wegovy/semaglutide / Novo（竞品）
        - 每周一次皮下注射 GLP-1 激动剂
        - 已上市（FDA 2021 年批准）；SELECT CVD 试验增加心血管标签
        - STEP-1 中 68 周平均减重相对安慰剂约 14.9%（2.4 mg）
        - 胃肠道事件常见（任一事件 40%+）；注射版本有禁食说明
        - 现有注射剂市场领导者；多个适应症；年销售额数十亿美元
      - - Orforglipron / Lilly
        - 每日一次口服非肽类小分子 GLP-1 激动剂
        - 全球申报阶段（40+ 个国家）；美国肥胖适应症可能 Q2 2026 行动
        - ACHIEVE-3（T2D 头对头）中 52 周减重 9.2%，口服 semaglutide 为 5.3%
        - 无食物 / 饮水限制；胃肠道事件可控；引用数据中无肝脏安全顾虑
        - 每日口服非肽 GLP-1 的先发优势；Lilly 生产规模
      - - 口服 amycretin / Novo
        - 每日一次口服 GLP-1/amylin 双重激动剂
        - Phase 2 阳性；Phase 3 计划 2026 年
        - 36 周减重 10.1%（口服）；SC 臂 14.5%；已确认 T2D HbA1c 下降
        - Phase 2 披露中以轻至中度胃肠道事件为主
        - Novo 下一代组合资产；从 semaglutide 延伸到组合生物学
      - - VK2735 口服 / Viking
        - 每日一次口服 GLP-1/GIP 双重激动剂（VK2735 片剂）
        - Phase 2 VENTURE 已完成；Phase 3（VANQUISH）计划 2026 年
        - 13 周平均减重 12.2%（120 mg）；97% 达到 ≥5% 减重，安慰剂为 10%
        - 以轻度 / 中度 TEAE 为主；胃肠道事件随时间减弱；未引用肝脏信号
        - 上市生物科技公司；SC VK2735 也处于 Phase 3；注射到口服的生命周期策略
      - - GSBR-1290 / Structure
        - 每日一次口服非肽类小分子 GLP-1 激动剂（片剂）
        - Phase 2a 阳性；已准备 Phase 2b / 中期阶段
        - 12 周安慰剂校正减重 6.2%；片剂 PK 研究最高 6.9%
        - DILI 或持续肝酶升高为零；胃肠道 AE 早期出现并减弱
        - 上市生物科技公司；明确讲规模和全球生产叙事
      - - Petrelintide / Zealand-Roche
        - 每周一次皮下注射 amylin 类似物
        - Phase 3 计划 H2 2026；Roche $1.65B 首付款支持
        - Phase 1b：16 周减重约 8.6%（4.8 mg）；强调保留瘦体重
        - 以轻度胃肠道事件为主；耐受性被引用为相对 GLP-1 类别标准的资产
        - 基于 amylin 的相邻项目；大药企伙伴抬高执行和触达能力
      - - Elecoglipron / AstraZeneca-Eccogene
        - 每日一次口服非肽类小分子 GLP-1 激动剂
        - 中国 Phase 1b 阳性；全球 Phase 3 计划中
