  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 管线架构与四个候选资产地图
        blocks:
          - type: paragraph
            body: >
              Kailera 进入公开市场时，拥有四个临床阶段候选产品，覆盖肥胖症药物治疗中基于 GLP-1 的三类主流机制原型：GLP-1/GIP 双重激动剂肽（注射 ribupatide）、同一分子的口服肽制剂（口服
              ribupatide）、口服小分子 GLP-1 受体激动剂（KAI-7535），以及
              GLP-1/GIP/胰高血糖素三重激动剂肽（KAI-4729）。这一组合不是内部发现拼出来的，而是通过一次授权搭建：Kailera 成立后不久签署 Hengrui License
              Agreement，取得四个候选药物在大中华区（中国大陆、香港、澳门和台湾）以外的独家开发和商业化权利，Hengrui 保留大中华区内相同权利。该结构让 Kailera 能拿到 Hengrui
              覆盖整个组合的深度临床数据，并加速开发；但也意味着每个产品的来源、制造和核心 IP 都追溯到同一个中国合作方。

              组合架构带有战略性，而非偶然。注射 ribupatide 是牵头资产，目前处于三项并行 Phase 3 试验（KaiNETIC 项目），目标 2028 年取得 topline 读数。口服 ribupatide 和
              KAI-7535 应对行业向无针肥胖症治疗推进的商业趋势；口服 ribupatide 延续注射 franchise，KAI-7535 提供小分子替代方案。KAI-4729
              将平台延伸到下一代三重激动。每项资产都借力 Hengrui 已在中国生成的临床数据，让 Kailera 在启动全球试验前，对剂量、滴定、耐受性和剂量限制性毒性拥有有意义的信息领先。
