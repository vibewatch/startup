        - IP 许可方及中国地区权益持有人
        - 大中华区以外开发和商业化的独家许可
        - 合同里程碑、CRE 义务、版税结构
        - 协议终止或不可执行会让所有项目停摆
      - - Hengrui 临床数据包
        - 全球剂量和设计决策的信息基础
        - Kailera 依赖 Hengrui 准确生成、收集并报告数据
        - 数据审计权；监管申报由机构验证
        - 数据完整性风险；FDA 可能不会完全接受仅来自中国的疗效数据用于 NDA
      - - Hengrui 制造（原料药）
        - Kailera 全球临床试验原料药的主要供应商
        - 单一来源供应商；供应协议与许可绑定
        - Hengrui 中国设施按 GMP 制造
        - 地缘政治事件、BIOSECURE Act 或许可终止可能扰乱供应
      - - ClinicalTrials.gov 注册
        - 公开试验透明度和全球监管合规
        - KaiNETIC-1/2/3 已注册；Phase 2 高剂量待注册
        - ICMJE 注册要求；FDA 注册强制要求
        - 偏离已注册方案需要修订
      - - KaiNETIC DSMB / 安全监督
        - 为 76 周安慰剂对照试验提供独立安全监测
        - 对累积安全数据进行非盲审查
        - 期中分析触发条件和停止规则
        - DSMB 构成和期中决策标准未公开披露
      - - NDA 监管路径
        - FDA 批准路径；Kailera 目标是 NDA 而非 BLA
        - 围绕肽类生物制品重新分类的诉讼仍在进行
        - 与 FDA 历史上将 GLP-1 肽作为药物处理一致
        - 不利的重新分类裁决会要求走 BLA，并重做开发计划
    notes: |
      架构各行来自 S-1/A、424B4 和 10-Q 披露。除随机试验设计的一般披露外，DSMB 和安全监督细节未公开量化。
