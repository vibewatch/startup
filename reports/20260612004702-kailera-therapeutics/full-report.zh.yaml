      - number: '3.3'
        title: 下一波口服与 Phase 3 同行：Viking、Structure、Terns
        blocks:
          - type: paragraph
            body: >-
              下一波口服竞争者重要，是因为它们决定 ribupatide 口服进入 Phase 3 时，口服肥胖症赛道会有多拥挤。Viking Therapeutics 是最重要的单家公司威胁：VK2735（120 mg
              剂量）在 VENTURE-Oral Phase 2 试验中 13 周平均减重 12.2%，且无平台期；97% 的 VK2735 治疗受试者达到 ≥5% 减重，而安慰剂为 10%。Viking 首席执行官在 ECO
              2026 表示，他们相信口服 VK2735 有潜力成为首个上市的口服 GLP-1/GIP 双重激动剂，公司正准备在 2026 年晚些时候进入 Phase 3。生命周期优势也具战略性：VK2735 sub-Q
              同时处于 Phase 3 VANQUISH 项目，这意味着 Viking 可能为医生提供一个友好的从注射转向同分子口服的切换路径——这是对 Kailera ribupatide 注射转口服 franchise
              故事的直接竞争反制。若 VK2735 口服 Phase 3 数据早于 ribupatide 口服 Phase 3 完成，Viking 可能先于 Kailera 建立双重激动剂口服类别。

              Structure Therapeutics GSBR-1290 是 Kailera KAI-7535 的主要小分子非肽口服对照物。GSBR-1290 的 Phase 2a 数据显示，12 周安慰剂校正减重
              6.2%，且无药物诱导肝损伤或持续肝酶升高；这一干净信号帮助 Structure 主张其避开了导致 Pfizer lotiglipron 终止的肝毒性风险。GSBR-1290
              是片剂（不是胶囊），Structure 明确把它包装成制造和全球规模化差异点。Terns Pharmaceuticals 则是反面教材：TERN-601 以合理数据走过 Phase 1，但 Phase 2
              结果披露后，疗效不及预期，且不良事件——包括胃肠负担和符合 DILI 的肝脏病例——促使 Terns 搁置该项目。对 Kailera 的 KAI-7535 而言，Terns 经历直接提醒：口服小分子 GLP-1
              项目在疗效上限和肝脏安全性两端都有高门槛，漂亮 Phase 1 不是商业保证。Lilly 早前在 2023 年终止 lotiglipron，也强化了同一信息。
