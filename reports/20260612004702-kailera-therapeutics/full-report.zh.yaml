      - number: '5.3'
        title: 口服 ribupatide、KAI-7535 与 KAI-4729——口服和下一代管线
        blocks:
          - type: paragraph
            body: >
              口服 ribupatide（KAI-9531-T）是与注射 ribupatide 使用同一肽分子的每日一次口服片剂。Hengrui 在中国开展的 Phase 2 试验纳入 166 名肥胖成人，在 26
              周内评估最高 50 mg 剂量。Top-line 结果显示，平均体重最多下降 12.1%（疗效估计量）和 11.9%（治疗政策估计量），减重未见平台。耐受性看起来高度差异化：恶心率从 11.9%（10 mg）到
              22.7%（25 mg）和 20.0%（50 mg）不等，呕吐率更低，分别为 2.4%（10 mg）、11.4%（25 mg）和 7.5%（50 mg）——Kailera 称这些数字体现了潜在
              best-in-class 口服耐受性。由于口服 ribupatide 与已有充分表征的注射项目共享肽骨架，Kailera 主张可获得监管和开发效率，包括更快审批路径和信息桥接。全球 Phase 3 试验计划于
              2027 年上半年启动，前提是与 FDA 及其他监管机构讨论后可行。Hengrui 也在中国的一项 Phase 1 研究中评估下一代增强生物利用度制剂。


              KAI-7535 是每日一次口服小分子 GLP-1 受体激动剂（Hengrui 代号 HRS-7535）。Hengrui 在中国开展的 Phase 2 研究显示，按疗效估计量，180 mg 剂量在第 36 周实现
              9.5% 平均体重下降（安慰剂校正后为 8.1%）；一项针对药物浓度稳定患者的事后按方案分析显示减重 15.0%。Hengrui 的 Phase 3 研究（180 mg、两种滴定方案、中国 556
              名成人）仍在进行，预计 2026 年获得 topline 结果。Kailera 于 2026 年 4 月启动自己的 KAI-7535 Phase 2 研究，计划纳入约 320 名参与者（BMI ≥30，或 BMI
              ≥27 且伴合并症），在 44 周内评估最高 360 mg 剂量，预计 2027 年公布 topline 结果。


              KAI-4729（HRS-4729）是每周一次注射的 GLP-1/GIP/glucagon 受体三激动剂，设计目标是在 retatrutide（Eli Lilly 的三激动剂）基础上改进。体外数据显示，相比
              retatrutide，它的 GLP-1 受体结合亲和力高 1.6x，GIP 和 glucagon 受体效力相近。临床前动物数据提示更大的减重潜力。Hengrui 在中国仍有一项 HRS-4729 Phase 1
              SAD/MAD 试验进行中。Kailera 计划在 2026 年启动自己的 KAI-4729 Phase 1 试验，预计 2027 年获得该试验的 topline 结果。
