            body: >-
              Kailera
              仍是一家临床阶段生物技术公司，没有获批产品，也没有产品收入。关键在于，公司没有现有企业账户、没有已签约的付款方胜利，也没有续约队列可像商业化医疗公司那样分析。真正相关的“客户”，是未来必须完成转化、商业化才跑得通的利益相关方：肥胖患者、决定数据是否足以支持使用的处方医生、决定产品是否足够可负担并纳入报销的付款方，以及可能帮助商业化、共同开发或验证平台的潜在药企合作伙伴。Kailera
              网站定位也支持这一框架：它强调为不同治疗旅程的人群提供选择，而不是销售一个范围狭窄的单一肥胖产品。Jamie Coleman 最近曾负责 Lilly 的 Zepbound
