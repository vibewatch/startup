  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：先打重度肥胖注射剂层，再看口服层
        blocks:
          - type: paragraph
            body: >-
              Kailera 的相关市场不是全部肥胖护理，不是一般健康管理，甚至也不是每一张 GLP-1 处方。公司自己的叙事指向一个更窄、也更适合投资判断的边界。注射剂 ribupatide 是 Phase
              3、每周一次给药的 GLP-1/GIP 双重激动剂，专门推进给需要大幅减重的人群；Kailera 明确强调 BMI 35+
              人群是肥胖护理中增长最快、规模最大的细分。这使牵头机会落在肥胖药物市场中减重幅度最高的注射剂层，在这里医生和患者首要关心的是减重幅度，而不只是便利性。第二个相邻市场是口服 ribupatide 和
              KAI-7535 所代表的口服肥胖症便利性层。第三个、更宽的市场视角，则是 IQVIA 和公共支出来源衡量的整个基于 incretin 的肥胖症类别。实际结论是，Kailera
              不是单一形态的口服故事，而是一家上市公司：先试图在重度肥胖注射剂中取胜；若数据和支付方准入支撑，再保留扩张到口服细分的选择权。
