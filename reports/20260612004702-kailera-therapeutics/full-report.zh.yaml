      - number: '8.4'
        title: 乐观、基准和悲观情景及概率加权估值
        blocks:
          - type: paragraph
            body: >-
              基准情景假设 KaiNETIC Phase 3 数据成功概率约 35–45%（低于小分子历史 59% Phase 3 成功率，并因中国到全球桥接风险、竞争执行风险和剂量选择不确定性折价）。在这一 PoS
              区间下，对 ribupatide 注射剂 peak sales $3.5–$5 billion（到 2033 年占全球肥胖市场 2% 至 3%）使用 12–15% 折现率，该项目对企业价值的 rNPV 贡献为
              $800 million 至 $2 billion，取决于剂量、标签宽度和竞争位置。再加入更深中国到全球桥接折价的口服 ribupatide（Phase 2 完成，Phase 3
              尚未启动）、KAI-7535（2027 年 Phase 2 肥胖数据；小分子 DILI 风险折价）和 KAI-4729（Phase 1 MAD；最早阶段；探索性价值），基准情景下完全稀释后的分部加总 rNPV 为
              $3.0–$5.0 billion。对应当前股本，每股区间约 $23–$39，相比 $16 IPO 价格有 45–145% 上行。


              乐观情景（$7–$10 billion）要求 KaiNETIC 数据确认 ribupatide 注射剂在全球 Phase 3 中达到 ≥20% 平均减重（匹配或超过 tirzepatide），同时口服
              ribupatide Phase 3 按计划在 1H'2027 启动，KAI-7535 Phase 2 肥胖 topline 在 2027 年为阳性。在这一情景下，Kailera 可能获得类似
              Metsera/Pfizer 的战略收购溢价，成为一个合理的 $6–$9 billion 收购目标。悲观情景（$1.0–$1.5 billion）反映 KaiNETIC 数据为阴性、显著劣于
              tirzepatide，或受到安全信号干扰；届时公司价值将主要限于现金（$1.3 billion）扣除持续烧钱，加上非 ribupatide 项目的剩余价值（KAI-7535 和 KAI-4729
              作为早期资产仍会保留一些价值）。


              定量情景无法完全捕捉的最重要定性风险，是 Lilly 和 Novo 带来的竞争压缩。Orforglipron 在 T2D 和肥胖适应症上均处于监管申报阶段，并将在 Kailera 口服项目完成 Phase 3
              之前，建立每日口服 GLP-1 的处方医生习惯和付款方准入。Pfizer lotiglipron 停止开发（肝酶）和 Terns TERN-601 失败（疗效和 DILI），都是口服小分子项目的警示先例。如果
              VK2735 口服 Phase 3 数据早于 ribupatide 口服 Phase 3 完成，Viking 可能凭先发优势建立口服双激动剂品类。这些竞争动态会压缩 Kailera 的可服务市场机会，并要求
              Kailera 证明 best-in-class 疗效，而不只是足够疗效，才能获得差异化商业位置。
