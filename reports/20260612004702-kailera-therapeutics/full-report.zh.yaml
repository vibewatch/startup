            title: 2028 年 Phase 3 topline 制造多年二元临床风险窗口
            body: >-
              KaiNETIC topline 数据预计到 2028 年才会出来，也就是说，买入 IPO 的投资者接受了两年以上等待主要疗效读数的周期。这符合 Phase 3
              肥胖症试验时间线，但也意味着，在可见未来，股票交易将更多依赖增量临床信号（2027 年 Phase 2b 高剂量数据、口服 ribupatide 启动 Phase 3、更多 Hengrui
              中国数据），而不是确定性的监管事件。
