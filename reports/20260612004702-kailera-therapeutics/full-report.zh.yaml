  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与前收入状态
        blocks:
          - type: paragraph
            body: >-
              Kailera 自 2024 年 5 月 8 日注册成立以来，没有产生任何产品销售收入。2026 年 Q1 10-Q、424B4 最终招股书和每份公司新闻稿都一致确认，Kailera
              没有任何获批可商业销售的产品，也没有可报告的授权、版税或合作收入。公司完全依赖股权资本资助运营。预期货币化路径符合临床阶段生物科技常规：第一，若 ribupatide（KAI-9531）或后续资产获得 FDA
              批准，则取得产品销售收入——KaiNETIC topline 读数最早合理时间是 2028 年，随后 NDA 申报和审评至少还要增加 12–18
              个月。第二，寻求区域或全球合作交易，在产品上市前取得首付款、开发资金里程碑和版税。第三，货币化通过 Hengrui 对未来代谢候选药物优先拒绝权取得的资产，尽管 ROFR
              条款并未在公开文件中完整说明。这些货币化路径在当前报告期都不产生收入。公司确实从现金和有价证券上赚取不小的利息收入——2026 年 Q1 为 $5.8 million，部分抵消运营亏损，使报告净亏损为 $78.9
              million，而运营费用为 $84.7
              million。该利息收入由现金余额和利率决定，不是商业模式；现金投入临床开支后会收缩。因此，本章收入图景完全是前瞻性的：分析师必须基于临床里程碑的时间线、概率和价值来承销
              Kailera，而不是基于当下收入质量。
