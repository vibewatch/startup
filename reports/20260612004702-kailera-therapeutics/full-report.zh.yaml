      - number: '4.2'
        title: 成本结构与 R&D 投入
        blocks:
          - type: paragraph
            body: >-
              Kailera 的运营成本结构由 R&D 主导，这符合一家同时推进六个不同临床项目的公司特征。2026 年 Q1，R&D 费用为 $70.9 million（占总运营费用 83.7%），G&A 为 $13.8
              million（16.3%），总运营费用为 $84.7 million。$5.8 million 利息收入将季度报告净亏损降至 $78.9 million，意味着仅按运营费用计算，年化总 burn rate 接近
              $340 million——显著高于 FY2025 全年 $149.0 million 净亏损，反映 2025 年末和 2026 年初启动的三项 KaiNETIC Phase 3 试验，以及 2026 年 3
              月启动的 Phase 2b 高剂量扩展。作为参照，FY2024（2024 年 5 月 8 日成立至 2024 年 12 月 31 日）净亏损为 $219.7 million，其中包括 $100 million
              Hengrui 首付款和 $10 million 技术转让费这两项一次性项目。R&D 支出构成反映了多项目组合：KaiNETIC-1（注射 ribupatide，约 2,340
              名受试者）、KaiNETIC-2（约 1,156 名 T2D 患者）和 KaiNETIC-3（约 1,200 名 BMI 35+ 患者）正在同步入组，带来显著 CRO 和制造成本。Phase 2b 高剂量
              ribupatide 研究（约 250 名受试者）和 KAI-7535 Phase 2（2026 年 4 月启动）又增加增量成本。G&A 相对 IPO 前公司偏高，部分来自上市公司合规、D&O
              保险和高管薪酬的基础设施建设。资产负债表值得注意的项目包括数千万美元级别的应计临床试验成本和应计制造成本，以及 Waltham, MA 和 Cambridge, MA 办公空间合计约 $14.9 million
              的经营租赁义务。
