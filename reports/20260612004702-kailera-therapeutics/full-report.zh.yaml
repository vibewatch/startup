  - id: TV007
    title: 最终尽调要求与未决问题
    columns:
      - 优先级
      - 主题
      - 具体要求
      - 重要性
    rows:
      - - P1
        - KaiNETIC 3 期设计
        - 获取完整方案；确认主要终点、非劣效 / 优效基准，以及是否设有 tirzepatide 对照组
        - 如果 KaiNETIC 仅做安慰剂对照，tirzepatide 差异化只能靠间接比较；即便试验成功，商业理由也会被削弱
      - - P1
        - Hengrui 授权协议
        - 审查终止条款、里程碑安排、共同开发义务和控制权变更条款
        - 单一授权方依赖；合同条款决定 Kailera 在 3 期失败或潜在收购方交易后能否保住权益
      - - P1
        - 中国到全球监管桥接计划
        - 了解 FDA 和 EMA 就 KaiNETIC 可在多大程度上依赖 Hengrui 中国 2 期数据给出的书面反馈
        - 如果 FDA 要求先取得美国本土 2 期数据再接受 KaiNETIC 结果，时间线和成本估算都会实质性变化
      - - P2
        - KAI-7535 肝脏安全方案
        - 确认全球 2 期肥胖试验设计中预设的肝酶监测终点
        - lotiglipron 和 TERN-601 的失败由肝脏信号驱动；若没有预设肝脏监测，就是尽调缺口
      - - P2
        - Orforglipron 上市对口服 ribupatide 市场规模的影响
        - 获取或搭建市场份额模型，评估 orforglipron 作为先发口服 GLP-1 后，口服 ribupatide 的空间
        - 如果 orforglipron 在口服 ribupatide 完成 3 期前确立口服 GLP-1 标准，口服项目商业天花板会更低
      - - P3
        - 全部 4 个项目推进下的现金消耗轨迹
        - 要求提供更新后的多年 pro forma 现金模型，覆盖乐观情景（所有 3 期推进）和保守情景（2 个项目降优先级）
        - 若年消耗超过 $300M，单一项目延迟并拉长现金跑道需求，就可能迫使公司在 2028 年数据前进行稀释性融资
    notes: P1 = 最高优先级；P2 = 次级；P3 = 重要但时间敏感度较低。所有问题都应在建立超过起步跟踪仓的头寸前解决。
    claimRefs:
      - CV047
      - CV050
      - CV051
      - CV052
