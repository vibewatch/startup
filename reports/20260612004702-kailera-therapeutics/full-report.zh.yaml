  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与 Kailera 的起点
        blocks:
          - type: paragraph
            body: >-
              Kailera 的相关竞争集至少横跨四类替代方案，它们从不同方向解决同一个肥胖症治疗任务。第一类是已经上市的注射剂 incumbents：Novo 的 semaglutide（Wegovy）和 Lilly 的
              tirzepatide（Zepbound）已经让处方医生、支付方和患者知道 best-in-class
              注射肥胖症疗法该有什么效果和体验，两家公司正在部署的商业基础设施也远超任何临床阶段生物科技公司可匹配的水平。第二类是接近上市的口服小分子：Lilly 的 orforglipron 已在 40
              多个国家进入监管申报阶段，并在头对头试验中优于口服 semaglutide。第三类是下一波竞争者：Viking VK2735 口服、Novo 口服 amycretin 和 Structure GSBR-1290
              均显示有意义的 Phase 2 疗效，并可能在 Phase 3 与 Kailera 的口服项目同期竞争。第四类是相邻高价值押注：Zealand 与 Roche 的 petrelintide amylin
              交易，以及 Pfizer $4.9 billion 收购 Metsera，都说明大型药企会继续花钱填补肥胖症管线缺口，这既验证了 Kailera 所在品类，也抬高了竞争资产的 M&A 稀缺性定价。

              在这片格局中，Kailera 的起点可信，也有关键差异。公司 2026 年 4 月进入公开市场，完成 $718.8 million IPO——近年记忆中最大的生物科技 IPO——此前已由 $400 million
              Series A（2024 年 5 月）和 $600 million Series B（2025 年 10 月）供血。公司同时推进四个临床阶段项目，覆盖注射剂、口服肽、口服小分子和注射三重激动剂。牵头注射
              ribupatide 项目已经在非 Lilly/Novo 阵营中生成最有吸引力的 Phase 2 疗效信号：中国 Hengrui Phase 2 试验中，8 mg 剂量 36 周平均减重 23.6%。全球
              Phase 3 KaiNETIC 试验已在 2026 年 Q1 启动，预计 2028 年读数。关键问题是时间：能把 ribupatide 推到完全验证状态的全球 Phase 3
              疗效证明，会在多个口服竞争者已经拿到各自 Phase 3 读数之后才到来。
