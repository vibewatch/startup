- id: hengrui-architecture-manufacturing-and-quality
  title: Development architecture, Hengrui manufacturing, and quality controls
  body: >
    Kailera's development architecture is built around a licensing-first operating model in which
    Hengrui functions simultaneously as the originating IP licensor, the active clinical developer
    in Greater China, and the primary manufacturer of drug substance for Kailera's global clinical
    trials. Under the Hengrui License Agreement, Kailera receives exclusive rights outside Greater
    China to develop and commercialize all four candidates. In return, Kailera must use commercially
    reasonable efforts to develop and commercialize licensed products, must achieve certain
    regulatory milestone obligations within specified timelines, and must pay Hengrui milestone
    payments and royalties. Hengrui continues to generate data in obesity-related conditions that
    inform Kailera's strategy, and Kailera holds a right of first refusal on certain additional
    Hengrui metabolic assets.


    This architecture generates meaningful capital efficiency: Kailera accesses broad, deep
    clinical data packages (dosing, titration, patient populations, safety) already generated by
    Hengrui in China before initiating global trials, avoiding duplicative Phase 1/Phase 2 costs.
    The same structure carries operational and geopolitical dependencies. Kailera relies on
    Hengrui for current clinical-trial drug supply, and if the license is terminated for any
    reason, supply would also be terminated. Kailera cannot independently replicate the proprietary
    IP, formulation know-how, or manufacturing processes licensed from Hengrui without Hengrui's
    involvement. The U.S. BIOSECURE Act (enacted December 2025) creates additional regulatory
    exposure, as it prohibits federal agency procurement from certain Chinese biotechnology
    companies; Kailera discloses that some contractual counterparties, including Hengrui, could
    be impacted.


    Quality controls in the KaiNETIC program follow industry standards: double-blind, randomized,
    placebo-controlled designs; eligibility and safety exclusions for pancreatitis, severe renal
    impairment, and prior weight-loss surgery; dose-escalation titration protocols to manage GI
    tolerability; and DSMB oversight implied by Phase 3 scale. Clinical trial records are publicly
    registered at ClinicalTrials.gov. Kailera's lead regulatory strategy is to seek approval via
    NDA, though it discloses an ongoing litigation risk that could require reclassification of
    peptide candidates from drugs to biologics (BLA pathway), which would impose significantly
    more burdensome requirements.
