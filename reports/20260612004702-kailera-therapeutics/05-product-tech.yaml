- id: oral-programs-small-molecule-and-tri-agonist
  title: Oral ribupatide, KAI-7535, and KAI-4729 — the oral and next-generation pipeline
  body: >
    Oral ribupatide (KAI-9531-T) is a once-daily oral tablet formulation of the same peptide as
    injectable ribupatide. A Phase 2 trial conducted by Hengrui in China enrolled 166 adults with
    obesity and evaluated doses up to 50 mg over 26 weeks. The top-line results reported a mean
    weight reduction of up to 12.1% (efficacy estimand) and 11.9% (treatment-policy estimand),
    with no observed plateau in weight loss. Tolerability appeared highly differentiated: nausea
    rates ranged from 11.9% (10 mg) to 22.7% (25 mg) and 20.0% (50 mg), and vomiting rates were
    lower at 2.4% (10 mg), 11.4% (25 mg), and 7.5% (50 mg)—figures Kailera characterizes as
    illustrating potential best-in-class oral tolerability. Because oral ribupatide shares its
    peptide backbone with the extensively characterized injectable program, Kailera argues for
    regulatory and development efficiencies including faster approval pathways and informational
    bridging. Global Phase 3 trials are planned for H1 2027, subject to FDA and other regulatory
    agency discussions. Hengrui is also evaluating a next-generation enhanced-bioavailability
    formulation in a Phase 1 study in China.


    KAI-7535 is a once-daily oral small-molecule GLP-1 receptor agonist (Hengrui designation
    HRS-7535). A Hengrui Phase 2 study in China showed 9.5% mean weight reduction (8.1%
    placebo-adjusted) at Week 36 with the 180 mg dose using the efficacy estimand; a post-hoc
    per-protocol analysis in patients with consistent drug concentrations showed 15.0% weight loss.
    Hengrui's Phase 3 study (180 mg, two titration schedules, 556 adults in China) is ongoing, with
    topline results anticipated in 2026. Kailera initiated its own Phase 2 of KAI-7535 in April
    2026, enrolling ~320 participants (BMI ≥30 or ≥27 with comorbidity) at doses up to 360 mg over
    44 weeks, with topline results expected in 2027.


    KAI-4729 (HRS-4729) is a once-weekly injectable GLP-1/GIP/glucagon receptor tri-agonist
    designed to improve on retatrutide (Eli Lilly's tri-agonist). In vitro data show 1.6x higher
    GLP-1 receptor binding affinity compared to retatrutide, with similar GIP and glucagon receptor
    potency. Preclinical animal data suggest greater weight-loss potential. Hengrui has an ongoing
    Phase 1 SAD/MAD trial of HRS-4729 in China. Kailera plans to initiate its own Phase 1 trial
    of KAI-4729 in 2026, with topline results expected from that trial in 2027.
