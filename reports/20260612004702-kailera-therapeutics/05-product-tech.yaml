      discloses that it licenses IP from Hengrui but does not itemize the patent portfolio.
    whyItMatters: >
      If Hengrui's underlying IP is inadequate, or if third parties hold blocking patents
      on ribupatide or KAI-7535 molecular scaffolds, Kailera's ability to commercialize
      outside Greater China would be materially impaired.
    diligencePath: >
      Request IP schedule from Hengrui License Agreement; conduct independent freedom-to-operate
