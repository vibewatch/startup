callouts:
- calloutType: strength
  title: 23.6% weight loss at 12 weeks — a potential clinical benchmark
  body: >
    Ribupatide's 8 mg data showing 23.6% body-weight reduction at only 12 weeks of treatment
    is the single most compelling data point in Kailera's public record. If the KaiNETIC trials
    replicate comparable efficacy at 76 weeks with acceptable tolerability, ribupatide would have
    the strongest weight-loss profile of any approved or near-approved obesity agent.
  claimRefs:
  - CE009

- calloutType: risk
  title: Entire portfolio sourced from one Chinese licensor
  body: >
    Every Kailera product candidate originates from Hengrui, and Hengrui is Kailera's primary
    drug substance manufacturer for clinical trials. Termination of the Hengrui License Agreement
    or supply disruption — whether from geopolitical events, the BIOSECURE Act, or contract
    default — would simultaneously halt all four programs and cut off drug supply.
  claimRefs:
  - CE028
  - CE030
  - CE032
  - CE033

- calloutType: insight
  title: Oral programs face a steepening competitive bar by 2027
  body: >
    When Kailera reports oral ribupatide Phase 3 initiation in H1 2027 and KAI-7535 Phase 2
    topline results in 2027, the FDA-approved oral landscape is likely to include at least
    orforglipron (Lilly) and potentially oral semaglutide with updated indications. The oral
    franchise differentiation window is narrowing faster than the injectable one, where ribupatide
    has a more direct path to best-in-class positioning.
  claimRefs:
  - CE039
  - CE040
  - CE041

