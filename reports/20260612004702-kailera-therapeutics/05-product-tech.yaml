    relatedQuestionRefs: [QE012]

  - type: private-evidence-only
    severity: minor
    topic: oral-ribupatide-comparator-tolerability
    missingEvidence: >
      Direct head-to-head or cross-trial comparison of oral ribupatide tolerability (nausea,
