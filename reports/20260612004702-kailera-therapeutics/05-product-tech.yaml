    whyItMatters: >
      Commercial and regulatory value of oral ribupatide depends critically on whether
      administration requires fasting conditions and whether bioavailability is reproducible
      at scale — neither is publicly disclosed.
    diligencePath: >
      Request Phase 2 clinical study report (CSR) for the Hengrui oral ribupatide Phase 2;
      review pre-Phase 3 FDA meeting minutes when available.
    relatedQuestionRefs: [QE017, QE018]

  - type: private-evidence-only
    severity: material
    topic: Hengrui-manufacturing
    missingEvidence: >
      GMP batch records, CAPA history, CMC package details, cost-of-goods estimates, and
      manufacturing scale-up plans for ribupatide and oral ribupatide commercial supply.
    whyItMatters: >
      Kailera depends entirely on Hengrui for drug substance supply; commercial-scale
      manufacturing adequacy cannot be assessed from public disclosures alone.
    diligencePath: >
      Request manufacturing due diligence package from Kailera; review FDA pre-NDA meeting
      minutes when available; inspect Hengrui's relevant manufacturing sites.
    relatedQuestionRefs: [QE024]

  - type: private-evidence-only
    severity: material
    topic: IP-posture
    missingEvidence: >
      Specific patent family names, expiry dates, freedom-to-operate opinions, and independent
