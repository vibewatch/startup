    claimRefs: [CP005, CP006, CP007, CP010]
figures:
  - id: "FP001"
    title: "Competitive positioning by cross-institution reach and patient-side alignment"
    type: "quadrant"
    summary: >-
      An evidence-constrained ordinal map of solution classes, not a market-share,
      quality, or outcomes benchmark.
    xAxis:
      label: "Cross-institution reach (1=single setting, 5=national/cross-setting)"
      min: 1
      max: 5
    yAxis:
      label: "Patient-side alignment (1=sponsor-first, 5=patient-engaged)"
      min: 1
      max: 5
    data:
      points:
        - {label: "Solace", x: 5, y: 5, detail: "Dedicated patient advocate, national virtual delivery, and insurance billing"}
        - {label: "Payer case manager", x: 4, y: 2, detail: "Broad member reach but employed by the insurer"}
        - {label: "Hospital representative", x: 2, y: 3, detail: "Useful inside a facility, with limited cross-system scope"}
        - {label: "Independent advocate", x: 3, y: 5, detail: "Patient-paid and patient-side; reach varies by provider"}
        - {label: "Government / nonprofit program", x: 3, y: 4, detail: "Independent help for defined benefits, rights, or conditions"}
        - {label: "Employer navigation benefit", x: 4, y: 3, detail: "Broad sponsored access; service and accountability vary"}
    approximationNotes: >-
      Ordinal 1-5 coordinates are analyst synthesis from source-described employer,
      accountability, setting, and virtual reach. They are not measured scores,
      benchmark thresholds, or value-proportional distances.
    claimRefs: [CP013, CP014]
callouts:
  - calloutType: "risk"
    title: "The public record does not prove a named-peer moat"
    body: >-
      The assigned evidence establishes Solace's disclosed model and scale but not
      peer-level pricing, retention, service quality, win/loss, or independently
      measured outcomes. Those gaps prevent a defensible direct-company ranking.
    claimRefs: [CP015]
