    rows:
      - ["Dedicated continuing person", "Yes, company-described", "Varies / unknown", "Usually episode or facility bounded", "Varies by engagement", "Only Solace's model is specifically evidenced"]
      - ["Cross-provider coordination", "Yes, company-described", "Within plan workflows", "Often within the health system", "Potentially yes", "No comparative benchmark was available"]
      - ["Insurance denial and billing support", "Yes, company-described", "Authorization support but payer-employed", "Sometimes", "May specialize in appeals or billing", "Competitor depth and success rates are unknown"]
      - ["Appointment participation", "Remote participation described", "Unknown", "Primarily during facility care", "Varies", "No service-level comparison was available"]
      - ["Diagnosis or prescribing", "No", "Not established", "Not the representative's role", "Generally no unless separately licensed", "Advocacy complements rather than replaces clinicians"]
      - ["National virtual access", "All 50 states claimed", "Plan dependent", "Facility dependent", "Provider dependent", "Solace reach is company-reported"]
    notes: >-
      Capability cells reflect only the assigned sources; "varies" and "unknown"
      deliberately preserve unsupported competitor details rather than infer parity.
    claimRefs: [CP002, CP003, CP012]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Option"
      - "Payment or contract model"
      - "Included scope"
      - "Known price signal"
      - "Competitive implication"
    rows:
      - ["Solace under Original Medicare or Medicare Advantage", "Insurance billing subject to eligibility and plan terms", "Dedicated advocate, care coordination, appeals, records, appointments, and resources", "Often no cost beyond applicable deductible or coinsurance, according to Solace", "Reduces direct-pay friction but depends on reimbursement and coverage"]
      - ["Solace under commercial insurance", "Company-claimed insurer coverage", "Virtual advocacy and coordination", "Exact plan economics and realized patient cost unknown", "Expands distribution but public payer mix is unavailable"]
      - ["Independent paid advocate", "Hourly fee or monthly retainer", "Scope negotiated directly with patient or family", "$75-$300 per hour or $200-$1,000 monthly retainer, as cited by Solace", "Patient-aligned but can be expensive without coverage"]
      - ["Hospital, payer, employer, or disease-program advocate", "Bundled with institutional relationship or benefit", "Program-specific navigation, case management, or rights support", "Frequently free to the user; exact sponsor economics unknown", "Strong distribution but potentially narrower scope or divided accountability"]
      - ["Patient or family self-navigation", "Unpaid internal effort", "Scheduling, records, calls, appeals, and follow-up", "No vendor fee; time and execution cost unmeasured", "The default substitute remains available and creates price pressure"]
    notes: >-
      Public list prices, realized reimbursement, discounts, contract terms, and
