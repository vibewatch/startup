  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and investment implications
        blocks:
          - type: paragraph
            body: >-
              The most consequential exposure is the interaction between payer eligibility and a delivery model built
              around dedicated human advocates. Solace says Original Medicare and many Medicare Advantage plans cover
              the service, while its own materials caution that eligibility varies by plan; an independent review
              likewise identifies plan eligibility and inconsistent advocate availability as complaint themes. The
              company has expanded into named commercial plans, but the retained sources disclose neither payer
              concentration nor implementation performance. The resulting residual-risk ratings are analyst assessments,
              not incident frequencies: reimbursement and capacity rank high because a coverage disruption or service
              bottleneck would directly impair access and growth. Privacy/security likelihood remains unscored rather
              than presumed low because the pool contains a company HIPAA assertion but no independent control audit or
              incident-history source.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and privacy exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence establishes the company's stated operating boundaries but not the underlying regulatory
              file. Solace says coverage spans Original Medicare and many Medicare Advantage plans, subject to normal
              deductible or coinsurance and plan-specific eligibility, and separately disclaims medical and legal
              advice. The independent review reinforces both eligibility limits and the non-clinical scope. Those
              boundaries reduce some clinical-practice exposure, yet the assigned pool contains no CMS billing
              authority, claims code, state licensure analysis, litigation record, malpractice coverage, or
              regulator-issued privacy assessment. Solace also describes its platform as HIPAA-compliant, but that is a
              company claim rather than an independent assurance report. Diligence should therefore treat reimbursement
              authority, scope-of-practice controls, and security compliance as open verification items rather than
              infer a clean record from the absence of an adverse filing in this limited pool.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR015
      - number: '7.3'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              The model combines experienced personnel with a potentially demanding labor profile. Solace repeatedly
              says advocates average 16 years in healthcare and that each patient keeps a dedicated advocate, but it
              also says one hour of direct patient help requires an average of three additional coordination hours. That
              ratio is not a cost or productivity metric, yet it makes caseload, scheduling, and automation quality
              central diligence questions. A third-party review reports inconsistent availability as a complaint theme
              and relays employee-review concerns about management and burnout; because that evidence is secondary and
              low-reputation, it is a risk signal rather than proof of a systemic failure. The virtual service surface
              further makes uptime, secure messaging, access controls, and incident response material, but no SLA,
              outage record, penetration test, or independent security audit appears in the assigned evidence.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.4'
        title: Partner, financial-model, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              Solace's expansion into UnitedHealthcare, Anthem Blue Cross Blue Shield, and other commercial plans
              diversifies the coverage story, but public disclosure does not show member activation, claims acceptance,
              contract durability, or revenue concentration by payer. A third-party profile reports 20,000-plus patients
              per month as of February 2026 and 435 employees in May 2026, yet its financial section offers only a
              revenue estimate attributed to ZoomInfo and says no public profitability figure was disclosed. Those
              figures are not a substitute for audited revenue, gross margin, burn, or runway. Practical thesis-break
              triggers are a material loss of covered eligibility, sustained advocate-response degradation, a serious
              privacy or security control failure, or diligence showing that claims collection and labor costs prevent
              acceptable contribution margin. Until payer concentration, caseload, denial, retention, and cash data are
              produced, the mitigation case remains incomplete.
            claimRefs:
              - CR003
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Reassess the investment case if covered eligibility materially contracts, advocate response or continuity
              deteriorates, independent control testing identifies a serious privacy or security weakness, or
              payer-level claims and labor data show structurally negative contribution economics.
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a track/research-more recommendation rather than an invest decision. Solace
              announced a $130 million Series C in February 2026 at a valuation above $1 billion, following disclosed
              Series A and Series B rounds of $14 million and $60 million. That sequence demonstrates investor demand
              and substantial capitalization, but it is not an operating valuation method. The retained financing
              materials provide no audited revenue, gross margin, cash burn, runway, fully diluted ownership,
              liquidation preferences, debt, secondary component, or investor-control terms. SetterVC also labels its
              company data and valuation marks as estimates that may be incomplete, stale, erroneous, or revised. Entry
              discipline should therefore require either private evidence that supports the latest mark or terms that
              compensate for the unresolved economics and preference overhang; the headline unicorn valuation alone is
              insufficient.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that reimbursed advocacy can become durable healthcare infrastructure rather than a
              discretionary concierge service. Solace says its services are covered by Original Medicare and many
              Medicare Advantage plans, and its Series C announcement described a national network of more than 2,000
              advocates. Distribution expanded through announced placements with Walmart's Better Care Services platform
              and The American Legion. Those signals support access and awareness, but the announcements are company- or
              partner-issued and disclose neither contract economics nor attributable revenue. The anti-thesis is
              equally concrete: an independent profile notes that advocates cannot diagnose, prescribe, or guarantee an
              insurer's answer, while the exact operating cost remains private. A people-intensive service can create
              value and still fail to produce venture-scale margins, retention, or cash efficiency. Current evidence
              establishes reach and financing, not the quality of the economic engine.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              A numerical bull/base/bear valuation range would be false precision because no retained source supplies a
              reliable revenue base, growth rate, margin, retention, burn, or comparable transaction multiple. The bull
              case requires audited evidence that advocacy reimbursement is durable, contracted distribution converts
              into retained patients, and scale improves margins. The base case treats the February 2026 mark as a
              financing reference only and defers underwriting until economics and security terms are available. The
              bear case is a material down-round or preference-impaired outcome if reimbursement weakens, utilization
              fails to monetize, or labor intensity prevents operating leverage. The nearest cited private-company
              reference, Citizen Health, provides funding amounts but no valuation or comparable economics, so it cannot
              establish a multiple. Exit readiness is likewise unproven: final diligence must obtain audited cohort
              economics, claims collection and denial data, payer and channel concentration, capitalization and
              preference terms, and a credible path to strategic or public-market liquidity.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the missing bridge
            body: >-
              Solace can be a compelling company and still be an unattractive security. Proceed only after audited
              economics and financing terms support the entry price, or after price and protections offset the
              unresolved downside.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV014
              - CV015
