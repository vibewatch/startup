chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Solace was founded in July 2022 by Jeremy Gurewitz and Sara Sargent and publicly launched in 2023. Its
              core proposition is a virtual relationship with a dedicated healthcare advocate who helps patients
              coordinate providers, records, appointments, benefits, and insurance disputes. Bloomberg describes the
              monetization more precisely: Solace handles Medicare billing and takes a variable share of reimbursements
              paid to advocates, making reimbursement operations central to the business rather than incidental
              administration. The company says Original Medicare and many Medicare Advantage plans cover the service
              nationwide. The public record does not establish a single headquarters: one August 2026 profile lists
              Redwood City, while FundedIQ lists Austin. That discrepancy should remain open until corporate records or
              management materials identify the principal executive office.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
              - CO016
      - number: '1.2'
        title: Capital formation and reported scale
        blocks:
          - type: paragraph
            body: >-
              The financing sequence accelerated from a $14 million Series A in August 2024 to a $60 million Series B in
              April 2025 and a $130 million Series C in February 2026. The Bloomberg-authored account says IVP led the
              Series C, the round valued Solace at $1 billion, and total capital raised reached $211 million. That is
              the best-supported current financing record in this pool, but it is not equivalent to cash available,
              revenue, ARR, or runway. Reported operating scale is also uneven: Bloomberg cites more than 2,000
              registered-nurse advocates, while an independent August profile reports more than 20,000 patients per
              month. No retained source substantiates current revenue, ARR, margins, burn, or cash. FundedIQ's October
              2026 page still calls the Series B the latest round and reports only $74 million raised, making it an
              adverse freshness signal rather than a reliable current total.
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO008
      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently identify Jeremy Gurewitz as co-founder and chief executive and Sara Sargent
              as co-founder and chief product officer. Their founder-market fit is rooted in Gurewitz's experience
              helping his mother navigate pancreatic-cancer care and in a product thesis that combines healthcare
              expertise with workflow software. The retained evidence supports founder continuity but not a complete
              executive roster, board composition, voting control, investor protective provisions, or succession plan.
              That makes key-person dependence difficult to quantify. IVP's leadership of the latest round and
              participation by repeat investors create economically important stakeholder relationships, yet financing
              participation alone does not establish board seats or control rights. Those terms require the
              capitalization table and governing documents.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
      - number: '1.4'
        title: Milestones and diligence posture
        blocks:
          - type: paragraph
            body: >-
              Solace's milestones show a rapid transition from founding to nationally marketed, reimbursement-backed
              scale: a 2023 public launch, Medicare's 2024 coverage change, three successively larger disclosed rounds,
              and September 2026 availability through Walmart's Better Care Services platform. The timeline is
              meaningful distribution and capital evidence, but it is not proof of durable unit economics, clinical
              outcomes, or insurer retention. Workforce records are particularly unreliable: one independent profile
              reports 435 employees in May 2026, while FundedIQ reports an 11-50 band. The retained pool also contains
              no regulator, court, incident, or audited-security record; that absence is an evidence gap, not evidence
              that no adverse event occurred. Investment diligence should therefore verify corporate identity, financing
              terms, operating metrics, governance, and risk history directly.
