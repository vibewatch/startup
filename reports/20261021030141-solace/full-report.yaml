              - CU007
              - CU008
              - CU010
              - CU012
      - number: '6.2'
        title: Adoption trajectory and operating scale
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption snapshot comes from Solace's February 2026 Series C announcement: more than 20,000
              patients served monthly, more than 2,000 advocates, and 10x year-over-year growth. Fierce Healthcare
              repeated the patient and advocate figures, but the underlying disclosure remains company-originated and
              does not define whether "served monthly" means enrolled, actively engaged, billed, or completed cases.
              Earlier 2025 materials established all-state advocate availability and major Medicare Advantage coverage,
              while the 2026 commercial launch extended eligibility beyond that base. These data show rapid reach
              expansion, not durable retention: no cohort size, utilization distribution, repeat-engagement rate,
              renewal rate, or payer-level revenue denominator is public.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.3'
        title: Named proof and durability
        blocks:
          - type: paragraph
            body: >-
              Solace publishes specific patient stories spanning authorization recovery, specialist coordination,
              surgery, and hospice planning. These anecdotes are more informative than logo evidence because they
              identify a user, workflow, and reported outcome, but they remain company-selected testimonials without
              dates, contract context, independent verification, or a disclosed sampling frame. Fierce Healthcare also
              relayed 98% and 92% outcome statistics while explicitly calling them company claims and tracing them to a
              2023 advocacy-industry report rather than a Solace customer cohort. Across the retained sources, no NRR,
              GRR, churn, renewal, contract-length, satisfaction-cohort, or top-customer concentration metric is
              disclosed. The evidence therefore supports real use cases but not the durability or representativeness of
              adoption.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU014
      - number: '6.4'
        title: Journey mechanics and expansion risk
        blocks:
          - type: paragraph
            body: >-
              The documented customer journey starts with eligibility verification and a short physician intake, then
              matches the patient to a dedicated advocate who coordinates care through phone, video, text, and email.
              The workflow can deepen from appointment preparation into records, referrals, billing, prior
              authorization, appeals, and caregiver coordination, creating a plausible expansion loop within one
              patient's care journey. However, product breadth should not be confused with account expansion or revenue
              retention. Commercial eligibility adds distribution breadth, while dependence on reimbursement rules and
              named health-plan coverage introduces channel and payer exposure. Without payer-level mix, denial rates,
              utilization cohorts, or sponsor renewals, the public evidence cannot show whether scale is diversified or
              concentrated.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU012
              - CU013
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
