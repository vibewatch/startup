  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than digital health and broader than a software workflow category.
              Solace sells insurance-reimbursable, human-led patient advocacy supported by a virtual platform: advocates
              coordinate appointments and records, communicate across providers, pursue approvals and appeals, and help
              patients understand the next step. Diagnosis, prescribing, emergency response, and legal representation
              are outside the boundary. The relevant status quo includes unpaid patient or caregiver labor, hospital
              patient representatives, insurer case managers, government counseling and ombudsman programs, employer
              navigation benefits, and cash-pay independent advocates. These alternatives matter because several are
              already funded by institutions and can satisfy part of the same job without a separate Solace
              relationship.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence does not support a monetary TAM, SAM, or SOM. A 2024 company-issued release
              framed 65 million Medicare enrollees as the initial access pool, while current company materials say
              Original Medicare and many Medicare Advantage plans cover the service nationwide. Those are eligibility
              and distribution lenses, not revenue: not every beneficiary has a qualifying need, chooses an advocate,
              obtains coverage, or generates the same reimbursable workload. Network scale and venture financing show
              operating capacity and investor conviction, but neither is market spend. The exhibit therefore keeps
              population, access, supply, and capital signals separate instead of converting them into an unsupported
              top-down forecast.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The patient is the user and beneficiary, but the economic buyer is usually an insurer or another
              organization that can route an eligible person into the service. Public descriptions show provider
              referrals, direct consumer eligibility checks, Medicare and Medicare Advantage coverage, newer
              commercial-plan coverage, and distribution through Walmart's Better Care Services. The American Legion
              partnership adds an affinity route for veterans whose care crosses VA, Medicare, commercial, and
              private-provider systems. Adoption therefore requires both need recognition and a viable payment path. The
              evidence does not identify the internal budget owner, procurement cycle, authorization rules, or
              conversion rate for any channel, so channel announcements should not be read as contracted patient volume.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Reimbursement is the central adoption driver. YesPress reports that Medicare's 2024 navigation and
              community-health-integration payment rules turned some advocacy work into billable services; Solace's 2026
              commercial coverage announcement broadens the potential payer set. Fragmented care, denial management, and
              administrative burden create persistent demand, but the same model remains exposed to eligibility,
              documentation, collection, and reimbursement-policy execution. Solace itself cites an 88% health literacy
              statistic based on 2006 government data, illustrating that the need thesis is plausible but some headline
              proof is stale. Public pricing is plan-dependent, and the reviewed sources provide no independent
              category-level ROI, utilization, renewal, or reimbursement-yield evidence. The $130 million Series C and
              above-$1 billion valuation are financing signals, not substitutes for those operating metrics.
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market size remains an underwriting gap
            body: >-
              Public materials establish a large need pool and expanding access routes, but not category spend, eligible
              lives, reimbursement yield, utilization, retention, or independently measured savings.
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is fragmented across institutional and independent alternatives
        blocks:
          - type: paragraph
            body: >-
              The buyer's alternative is often not another venture-backed patient-advocacy platform. It is a payer case
              manager, a hospital patient representative or nurse navigator, an independent advocate paid directly by
              the patient, a government counseling or ombudsman program, an employer navigation benefit, or the patient
              and family doing the work themselves. Solace sits across these categories: it presents itself as
              patient-side, virtual, nationally available, and able to coordinate work across providers and insurers.
              That breadth is strategically useful, but the assigned public record does not identify a complete
              named-peer universe. The landscape should therefore be read as a solution-class map, not an exhaustive
              competitor census.
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP015
      - number: '3.2'
        title: Continuity and execution, not diagnosis, define the disclosed product edge
        blocks:
          - type: paragraph
            body: >-
              Solace's disclosed product centers on one continuing advocate who can schedule appointments, coordinate
              providers, organize records, support appeals, review bills, locate resources, and join visits remotely.
              The advocate does not diagnose or prescribe, which keeps the service complementary to clinical care rather
              than a substitute for it. More than 20,000 monthly patients and a network exceeding 2,000 advocates
              indicate operating scale, although these figures remain company-reported through press coverage. The more
              defensible differentiation is the combined operating system: human continuity, virtual access, intake and
              matching, and reimbursement machinery. None of the assigned evidence independently benchmarks execution
              quality against a direct peer.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP012
      - number: '3.3'
        title: Insurance distribution can reduce patient price friction while increasing payer exposure
        blocks:
          - type: paragraph
            body: >-
              Solace says Original Medicare and many Medicare Advantage plans cover its advocates nationwide, while
              newer company material also claims nationwide commercial-plan availability. That distribution can make the
              patient price materially lower than direct-pay independent advocacy, for which Solace's own educational
              article cites hourly and retainer ranges. The tradeoff is channel dependence: eligibility, deductibles,
              coinsurance, payer contracting, and reimbursement operations influence access. Continuity with one
              advocate and accumulated case context create relationship switching costs, but they are not hard lock-in.
              Patients can still use insurer, hospital, government, employer, independent, and family support in
              parallel, so multi-homing remains plausible.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.4'
        title: Capital and workflow integration may deepen the moat, but proof remains incomplete
        blocks:
          - type: paragraph
            body: >-
              The 2026 financing was explicitly tied to expanding the advocate network, investing in the platform and
              clinical research, and deepening payer and provider partnerships. Those investments could compound supply,
              distribution, and workflow integration. They could also attract incumbent response: payers, hospitals,
              employers, and disease organizations already control adjacent channels and can bundle navigation into
              existing relationships. The positioning map therefore treats reach and patient-side alignment as ordinal
              judgments derived from disclosed accountability and delivery models, not measured market shares or
              service-quality scores. The central adverse conclusion is evidentiary: without peer pricing, independent
              outcomes, retention, win/loss, or switching data, Solace's durable superiority remains unproven.
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The public record does not prove a named-peer moat
            body: >-
              The assigned evidence establishes Solace's disclosed model and scale but not peer-level pricing,
              retention, service quality, win/loss, or independently measured outcomes. Those gaps prevent a defensible
              direct-company ranking.
            calloutType: risk
            claimRefs:
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue engine and delivery model
        blocks:
          - type: paragraph
            body: >-
              Solace's public model is reimbursement-led rather than a conventional patient-paid subscription. An
              independent profile reports that the platform takes a variable share of Medicare reimbursements paid to
              advocates, while Solace says it bills Medicare directly for covered services. The economic bridge
              therefore runs from an eligible patient and physician intake through advocate-delivered work, claim
              submission, payer reimbursement, and a platform share. This is a service-and-software model whose gross
              profit depends on reimbursement rates, advocate compensation, billable utilization, documentation quality,
              denial rates, and collection timing. Solace also says each direct hour can require three additional
              coordination hours, making labor productivity and the billable treatment of behind-the-scenes work central
              underwriting questions rather than incidental operating details.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
              - CI013
              - CI016
      - number: '4.2'
        title: Pricing, coverage, and public traction
        blocks:
          - type: paragraph
            body: >-
              The patient-facing price is plan-dependent. Solace says Original Medicare and many Medicare Advantage
              plans cover its advocates and that patients generally face only applicable deductibles or coinsurance;
              another company page says Solace verifies coverage before service. These statements establish a
              reimbursement pathway, not realized price, net revenue per patient, or gross margin. Public scale
              indicators are meaningful but should not be confused with revenue: an August 2026 profile reports more
              than 20,000 patients served per month, while YesPress reports a company-stated network above 2,000
              advocates and more than 200,000 patients and families helped cumulatively. Neither source discloses paid
              claims, recognized revenue, payer mix, active-duration cohorts, or collections.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI013
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI013
              - CI015
      - number: '4.3'
        title: Conflicting revenue signals and missing unit economics
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish a reliable revenue baseline. Multiples records $100 million
              alongside the April 2025 Series B but explicitly labels its field as “Revenue (or ARR)” and says it may
              represent run-rate revenue or reported LTM revenue. A separate August 2026 company profile reports a $17.6
              million revenue estimate attributed to ZoomInfo and says no public profitability figure was disclosed. The
              divergence is too large and the definitions too uncertain to reconcile as growth. It instead demonstrates
              why management must provide audited revenue recognition, payer and service-line mix, gross-to-net claims
              waterfalls, denial and collection data, advocate payouts, and cohort contribution margins before either
              figure can be used in valuation or runway analysis.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI008
              - CI014
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financing provides capacity but does not prove liquidity or runway. Solace announced a $60 million Series
              B in April 2025 for product development and network scaling, and independent profiles report a $130
              million Series C in February 2026. The three named rounds total $204 million, while YesPress cites a
              Bloomberg total of $211 million, suggesting earlier or otherwise unitemized capital rather than cash
              currently available. No retained source discloses cash on hand, debt, monthly burn, working capital,
              capex, claims receivables, or next-round triggers. The financial verdict is therefore mixed: reimbursement
              can support recurring demand, but a human-intensive delivery model and opaque claims economics leave
              revenue quality, margin durability, and capital adequacy unproven.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue estimates are not underwriting-ready
            body: >-
              The $100 million and $17.6 million figures cannot be reconciled without definitions, periods, and source
              data; neither should be treated as ARR, audited revenue, or a growth series.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
          - type: callout
            title: Make the claims waterfall the first finance diligence request
            body: >-
              Request service-code volume, submitted and allowed amounts, denial and appeal outcomes, collections,
              advocate payouts, and support costs by cohort before assigning a revenue multiple or crediting the
              financing as runway.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a continuing advocate relationship, not a self-service app
        blocks:
          - type: paragraph
            body: >-
              Solace's customer-facing product begins with eligibility and a short virtual physician intake, then
              assigns one advocate who remains the patient's point of continuity. The advocate works across provider
              scheduling, records, insurance denials, billing questions, care transitions, and preparation for medical
              appointments; communication can continue by phone, video, text, or email. This makes the service closer to
              technology-enabled managed operations than to a software tool sold for autonomous patient use. The public
              workflow is specific enough to establish what customers receive, and independent editorial coverage also
              centers the dedicated advocate rather than the interface. However, published examples are selective and do
              not establish typical task resolution times, clinical outcomes, or workload per advocate.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
      - number: '5.2'
        title: A full-stack operating system is asserted, but the implementation is opaque
        blocks:
          - type: paragraph
            body: >-
              SignalFire describes an integrated stack spanning intake, advocate workflows, physician oversight,
              documentation, billing, task routing, triage, and EHR interoperability. Solace's 2024 release adds a
              matching algorithm, real-time patient interaction, progress tracking, and quality inputs from surveys,
              physicians, and electronic medical records. Together these sources suggest that software standardizes and
              monetizes a labor-intensive service rather than replacing advocate judgment. The architecture is plausible
              and operationally coherent, but the strongest detail comes from an investor and a company-issued release.
              No public technical documentation in the assigned evidence explains data models, integration methods,
              model governance, availability design, or whether the matching and routing systems are automated,
              rules-based, or manually supervised.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE011
      - number: '5.3'
        title: Distribution is expanding while service continuity remains the differentiator
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation is the combination of one continuing advocate, insurance billing
              infrastructure, and cross-institution coordination. SignalFire reports more than 2,000 advocates supported
              by the platform, while 2026 company-issued partnership releases describe advocates averaging 16 years of
              healthcare experience. Walmart's Better Care Services listing creates a new discovery surface, and the
              American Legion partnership targets veterans who move among VA, Medicare, commercial insurance, and
              private providers. These announcements support deployment breadth, not deep technical integration: neither
              release discloses API scope, implementation effort, uptime, service levels, or measured partner
              conversion. The defensible asset may therefore be the operating playbook and reimbursement workflow as
              much as proprietary software.
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE012
              - CE013
      - number: '5.4'
        title: Trust claims are visible; independent control evidence is not
        blocks:
          - type: paragraph
            body: >-
              Solace states that eligibility information is handled on a HIPAA-compliant platform and that quality
              monitoring uses patient surveys, supporting physicians, and electronic medical records. It also says
              advocates do not diagnose or make medical decisions, which defines an important scope boundary. Those
              statements are relevant controls, but they do not substitute for independent security testing, audit
              reports, incident history, credentialing procedures, clinical escalation rules, or service-level
              performance. Public roadmap detail is similarly thin: the available material shows additional payer and
              partner surfaces, not a dated product roadmap. Diligence should therefore treat security posture,
              integration reliability, advocate capacity, and quality consistency as material unverified dependencies
              rather than assume that nationwide availability proves technical maturity.
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE015
              - CE016
