    type: flow
    summary: >-
      Positive reimbursement, scale, distribution, and financing signals lead to a track stance because operating
      economics and security terms remain absent.
    data:
      nodes:
        - id: reimbursement
          label: Reimbursement access
          detail: Company materials describe Original Medicare and broad Medicare Advantage coverage.
        - id: network
          label: Delivery scale
          detail: The Series C release reported more than 2,000 advocates.
        - id: channels
          label: Distribution signals
          detail: Walmart and American Legion announcements expand discovery and referral surfaces.
        - id: financing
          label: Latest price marker
          detail: The February 2026 Series C raised $130 million at more than $1 billion.
        - id: evidence-gap
          label: Underwriting gap
          detail: Revenue, margins, burn, ownership, preferences, and target returns are undisclosed.
        - id: recommendation
          label: Track / research more
          detail: Require operating proof or materially better entry economics before investing.
