        title: Exhibits
        blocks:
          - type: callout
            title: Product maturity is ahead of public technical proof
            body: >-
              National availability and partner listings demonstrate a deployed service, but they do not verify security
              controls, reliability, interoperability depth, advocate capacity, or consistent outcomes.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer and payer segments
        blocks:
          - type: paragraph
            body: >-
              Solace operates a multi-party customer model: patients and families use the service, advocates deliver it,
              and Medicare, Medicare Advantage, or commercial health plans generally fund eligible access. The initial
              center of gravity was Medicare and Medicare Advantage, with company materials describing nationwide
              Original Medicare coverage and participation by major Medicare Advantage insurers. Fierce Healthcare
              reported an April 2026 expansion to commercially insured patients through UnitedHealthcare and Anthem Blue
              Cross Blue Shield, but noted that other commercial plans were not specified. This broadens the reachable
              population without establishing payer mix, covered-life penetration, employer adoption, or revenue
              concentration. Families and caregivers are important workflow participants, yet the public record does not
              identify a distinct payer or contract structure for that segment.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
