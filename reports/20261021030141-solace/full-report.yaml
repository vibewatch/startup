              - CU007
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible, but its unit is operational
            body: >-
              More than 20,000 patients served monthly and more than 2,000 advocates indicate meaningful delivery scale,
              but neither metric establishes active enrollment, recurring revenue, utilization intensity, or retention.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: callout
            title: Customer durability remains a private-data question
            body: >-
              Public sources do not disclose renewal, churn, payer concentration, contract term, or cohort utilization,
              so rapid coverage expansion cannot yet be translated into durable customer economics.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
