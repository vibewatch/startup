    title: Market size remains an underwriting gap
    body: >-
      Public materials establish a large need pool and expanding access routes,
      but not category spend, eligible lives, reimbursement yield, utilization,
      retention, or independently measured savings.
    claimRefs: [CM006, CM012, CM014, CM016]
