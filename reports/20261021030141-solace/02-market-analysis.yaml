figures:
  - id: FM001
    title: Evidence-constrained market-access stack
    type: pyramid
    summary: >-
      Six separate evidence layers show need, population, coverage, supply, and
      distribution without implying that they form a nested TAM/SAM/SOM funnel.
    data:
      items:
        - label: Navigation need signal
          value: 88%
          unit: U.S. adults
          detail: Company release cites 2006 federal health-literacy data; stale and not Solace-specific.
        - label: Medicare entry population
          value: 65 million
          unit: enrollees
          detail: 2024 company-issued population lens, not an eligible or adopting cohort.
        - label: Geographic footprint
          value: 50 states plus D.C.
          unit: coverage area
          detail: Company-claimed availability, not utilization.
        - label: Insurance pathways
          value: Original Medicare, many Medicare Advantage plans, and select commercial plans
          unit: payer routes
          detail: Eligibility varies by plan and standard cost sharing can apply.
        - label: Advocate supply
          value: 2,000+
          unit: advocates on platform
          detail: Company-reported measure repeated by YesPress; active capacity is undisclosed.
        - label: Distribution extensions
          value: Walmart and The American Legion
          unit: announced channels
          detail: Access announcements do not disclose conversion or contracted patient volume.
    approximationNotes: >-
      The layers use different units and denominators and are intentionally
      nonadditive; no monetary TAM, SAM, SOM, conversion rate, or proportional
      layer width is inferred.
    claimRefs: [CM006, CM007, CM008, CM010, CM011, CM012, CM013]
callouts:
