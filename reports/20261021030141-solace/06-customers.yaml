artifact: customers
slug: solace
runDate: 2026-10-21
company:
  name: Solace
chapter:
  number: 6
  title: Customers
  summary: >-
    Solace reported more than 20,000 patients served monthly and more than 2,000
    advocates by February 2026, then expanded from Medicare-focused coverage into
    commercial insurance. Public evidence supports reach and workflow breadth,
    but retention, payer concentration, cohort durability, and independently
    verified customer outcomes remain undisclosed.
sections:
  - id: customer-and-payer-segments
    title: Customer and payer segments
    body: >-
      Solace operates a multi-party customer model: patients and families use the
      service, advocates deliver it, and Medicare, Medicare Advantage, or
      commercial health plans generally fund eligible access. The initial center
      of gravity was Medicare and Medicare Advantage, with company materials
      describing nationwide Original Medicare coverage and participation by
      major Medicare Advantage insurers. Fierce Healthcare reported an April
      2026 expansion to commercially insured patients through UnitedHealthcare
      and Anthem Blue Cross Blue Shield, but noted that other commercial plans
      were not specified. This broadens the reachable population without
      establishing payer mix, covered-life penetration, employer adoption, or
      revenue concentration. Families and caregivers are important workflow
      participants, yet the public record does not identify a distinct payer or
      contract structure for that segment.
    claimRefs: [CU004, CU005, CU007, CU008, CU012]
    tableRefs: [TU001]
  - id: adoption-and-scale
    title: Adoption trajectory and operating scale
    body: >-
      The clearest adoption snapshot comes from Solace's February 2026 Series C
      announcement: more than 20,000 patients served monthly, more than 2,000
      advocates, and 10x year-over-year growth. Fierce Healthcare repeated the
      patient and advocate figures, but the underlying disclosure remains
      company-originated and does not define whether "served monthly" means
      enrolled, actively engaged, billed, or completed cases. Earlier 2025
      materials established all-state advocate availability and major Medicare
      Advantage coverage, while the 2026 commercial launch extended eligibility
      beyond that base. These data show rapid reach expansion, not durable
      retention: no cohort size, utilization distribution, repeat-engagement
      rate, renewal rate, or payer-level revenue denominator is public.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU011]
    tableRefs: [TU002]
  - id: customer-proof-and-durability
    title: Named proof and durability
    body: >-
      Solace publishes specific patient stories spanning authorization recovery,
      specialist coordination, surgery, and hospice planning. These anecdotes
      are more informative than logo evidence because they identify a user,
      workflow, and reported outcome, but they remain company-selected
      testimonials without dates, contract context, independent verification, or
      a disclosed sampling frame. Fierce Healthcare also relayed 98% and 92%
      outcome statistics while explicitly calling them company claims and
      tracing them to a 2023 advocacy-industry report rather than a Solace
      customer cohort. Across the retained sources, no NRR, GRR, churn, renewal,
      contract-length, satisfaction-cohort, or top-customer concentration metric
      is disclosed. The evidence therefore supports real use cases but not the
      durability or representativeness of adoption.
    claimRefs: [CU009, CU010, CU011, CU014]
    tableRefs: [TU003]
  - id: journey-and-expansion-risk
    title: Journey mechanics and expansion risk
    body: >-
      The documented customer journey starts with eligibility verification and a
      short physician intake, then matches the patient to a dedicated advocate
      who coordinates care through phone, video, text, and email. The workflow
      can deepen from appointment preparation into records, referrals, billing,
      prior authorization, appeals, and caregiver coordination, creating a
      plausible expansion loop within one patient's care journey. However,
      product breadth should not be confused with account expansion or revenue
      retention. Commercial eligibility adds distribution breadth, while
      dependence on reimbursement rules and named health-plan coverage introduces
      channel and payer exposure. Without payer-level mix, denial rates,
      utilization cohorts, or sponsor renewals, the public evidence cannot show
      whether scale is diversified or concentrated.
    claimRefs: [CU006, CU007, CU008, CU012, CU013, CU015]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by user and payer
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale evidence
      - Strategic value
      - Diligence gap
    rows:
      - - Original Medicare beneficiaries
        - "User: patient or family; payer: Original Medicare for eligible services"
        - Care coordination, appointment support, denials, billing, and transitions
        - Company states coverage is available nationwide
        - Core reimbursed entry segment with national reach
        - No eligible-member penetration, utilization cohort, or payer economics disclosed
      - - Medicare Advantage members
        - "User: patient or family; payer: participating Medicare Advantage plan"
        - Ongoing navigation across providers, insurance, and chronic care
        - Company names Aetna, BCBS, Cigna, Humana, and UnitedHealthcare
        - Broadens plan access within the initial senior and complex-care focus
        - No plan-level membership, revenue mix, renewal, or denial data disclosed
      - - Commercially insured patients
        - "User: insured patient; payer: commercial health plan or employer-sponsored plan"
        - Navigation for administrative, care-coordination, and insurance friction
        - Fierce Healthcare names UnitedHealthcare and Anthem BCBS in the 2026 expansion
        - Extends access beyond the Medicare-centered base
        - Other plans, covered lives, production volume, and contract structure were not specified
      - - Family and caregiver-assisted cases
        - "User: patient plus caregiver; payer follows the patient's eligible plan"
        - Appointment participation, care transitions, resource access, and hospice coordination
        - Company testimonials describe caregiver-supported dementia and complex-care cases
        - May increase engagement depth and continuity around complex care
        - No distinct segment size, payer, retention, or revenue contribution disclosed
    notes: >-
      Segments synthesize company coverage statements and Fierce Healthcare's
      commercial-expansion report; scale and economics are partial, and missing
      values mean not disclosed in the retained public sources.
    claimRefs: [CU004, CU005, CU007, CU008, CU010, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - Period
      - Source posture
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Advocate coverage footprint
        - Network across all 50 U.S. states
        - April 2025
        - Company-issued Series B release
        - Medium
        - National delivery capacity predated the Series C
        - Active advocates, patients per state, and utilization were not disclosed
      - - Patients served monthly
        - More than 20,000
        - February 2026
        - Company-issued Series C release, repeated by Fierce Healthcare
        - Medium
        - Demonstrates material monthly service volume
        - Definition of served, enrolled base, billed cases, and unique-patient count were not disclosed
      - - Advocate network
        - More than 2,000
        - February 2026
        - Company-issued Series C release, repeated by Fierce Healthcare
        - Medium
        - Indicates a large human-service delivery layer
        - Active status, hours, caseload distribution, and attrition were not disclosed
      - - Year-over-year growth
        - 10x
        - February 2026 announcement
        - Company-issued Series C release
        - Medium
        - Signals rapid adoption acceleration
        - Baseline metric, period endpoints, revenue linkage, and cohort composition were not disclosed
      - - Commercial insurance expansion
        - UnitedHealthcare and Anthem BCBS named
        - April 2026
        - Independent trade press citing a company release
        - Medium
        - Adds a non-Medicare access channel
        - Other plan names, covered lives, active patients, and contract economics were not disclosed
    notes: >-
      Values preserve each source's metric name and period; no row converts
      patients served, advocate count, coverage, or growth into revenue, retention,
      or market share.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - Molly R.
        - Medicare patient
        - Prior-authorization denial immediately before surgery
        - Presented as an active patient relationship; no formal deployment status disclosed
        - Company testimonial says the issue was resolved and surgery proceeded as planned
        - No date, payer record, case file, or independent verification
      - - Frederick A.
        - Complex-care patient
        - Specialist coordination and access to oral surgery
        - Presented as an active patient relationship; no formal deployment status disclosed
        - Company testimonial reports completed oral surgery and pending specialist visits
        - No date, baseline, follow-up period, or independent verification
      - - Julie B.
        - Family caregiver for a dementia patient
        - Advocate joined appointments and helped arrange hospice care
        - Labeled a verified Solace patient story; verification method is not disclosed
        - Company testimonial reports improved caregiver support and hospice coordination
        - No date, clinical outcome measure, sampling frame, or independent verification
    notes: >-
      Sample is limited to named patient stories in Solace's Medicare coverage
      article; Fierce Healthcare independently reports that broader outcome
      percentages are company claims, not validation of these individual cases.
    enumerationScope:
      coverage: sample
      basis: >-
        Named patient stories available in the assigned Solace customer evidence,
        excluding unnamed aggregate claims and advocate-authored examples.
    claimRefs: [CU009, CU010, CU014]
figures:
  - id: FU001
    title: Documented customer journey and engagement surfaces
    type: journey-map
    summary: >-
      The public workflow progresses from eligibility through ongoing advocacy;
      the sequence shows service touchpoints, not measured conversion or retention.
    data:
      nodes:
        - id: eligibility
          label: Eligibility check
          detail: Patient checks Medicare, Medicare Advantage, or commercial-plan eligibility.
          touchpoints:
            - Online eligibility flow
            - Plan coverage
        - id: intake
          label: Physician intake
          detail: A short virtual physician conversation captures goals and challenges.
          touchpoints:
            - Video or phone
            - Care-needs assessment
        - id: matching
          label: Advocate matching
          detail: Solace pairs the patient with a dedicated advocate suited to the case.
          touchpoints:
            - Background fit
            - Communication preference
        - id: coordination
          label: Active coordination
          detail: The advocate organizes records, appointments, referrals, and follow-up.
          touchpoints:
            - Text
            - Phone
            - Video
            - Email
        - id: resolution
          label: Barrier resolution
          detail: Work may extend into authorizations, appeals, billing, and resource access.
          touchpoints:
            - Insurer and provider calls
            - Appeals
            - Scheduling
        - id: continuity
          label: Ongoing relationship
          detail: Company materials state the same advocate can remain through continuing needs.
          touchpoints:
            - Regular check-ins
            - Caregiver coordination
            - New care episodes
    approximationNotes: >-
      Stage order is reconstructed from company-described workflow; no conversion,
      duration, utilization, or retention rate is implied.
    claimRefs: [CU006, CU007, CU013, CU015]
callouts:
  - calloutType: strength
    title: Scale is visible, but its unit is operational
    body: >-
      More than 20,000 patients served monthly and more than 2,000 advocates
      indicate meaningful delivery scale, but neither metric establishes active
      enrollment, recurring revenue, utilization intensity, or retention.
    claimRefs: [CU001, CU002, CU011]
  - calloutType: risk
    title: Customer durability remains a private-data question
    body: >-
      Public sources do not disclose renewal, churn, payer concentration,
      contract term, or cohort utilization, so rapid coverage expansion cannot
      yet be translated into durable customer economics.
    claimRefs: [CU011, CU012, CU014]
