evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, capitalization table, voting rights, liquidation preferences, debt, secondary transactions, and
      founder succession arrangements.
    whyItMatters: These terms determine control, downside protection, dilution, and key-person exposure.
    diligencePath: >-
      Request the current capitalization table, charter, investor-rights agreements, board minutes, debt schedule, and
      management succession plan.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-investors
    missingEvidence: A complete current executive, board, and beneficial-owner roster with roles and ownership.
    whyItMatters: The public roster is insufficient to assess functional coverage, governance concentration, or stakeholder control.
    diligencePath: >-
      Obtain management's organization chart, board roster, fully diluted ownership schedule, and investor-rights
      summary.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Current revenue or ARR, cash balance, gross margin, burn, runway, reimbursement collection, and denial or appeal
      outcomes.
    whyItMatters: Funding raised and valuation do not establish operating performance, liquidity, or reimbursement quality.
    diligencePath: >-
      Review monthly financial statements, bank statements, revenue recognition policy, claims aging, denial logs, and
      board-approved forecast.
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee roster reconciled to payroll and contractor counts.
    whyItMatters: Public estimates differ by nearly an order of magnitude and cannot support organization-scale analysis.
    diligencePath: >-
      Request anonymized payroll counts by function and geography, contractor totals, and monthly hiring and attrition
      history.
    relatedQuestionRefs:
      - QO006
      - QO009
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: Regulatory, litigation, security-incident, outage, and claims-compliance records from authoritative sources.
    whyItMatters: The absence of an incident in this assigned pool cannot establish that no adverse event occurred.
    diligencePath: >-
      Run legal and regulator searches, review incident and complaint logs, and obtain independent security-audit
      reports.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent category-specific spend, eligible-life, utilization, and reimbursement data sufficient to construct
      monetary TAM, SAM, and SOM.
    whyItMatters: >-
      Population and coverage counts cannot establish revenue opportunity or attainable penetration without eligibility
      and utilization denominators.
    diligencePath: >-
      Obtain payer claims extracts and category research, define reimbursable codes and rates, and reconcile eligible
      lives to actual advocacy use.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Independent ROI, avoidable-utilization, reimbursement yield, denial, collection, renewal, channel-conversion, and
      patient-retention evidence.
    whyItMatters: >-
      These measures determine whether need and nominal coverage convert into durable paid demand and justify the
      current capital-market expectations.
    diligencePath: >-
      Request de-identified cohort studies, payer contracts, claims-aging data, channel funnels, renewals, and matched
      control analyses from management.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: competitive-proof-gap
    missingEvidence: >-
      A current named-peer list with comparable pricing, scope, scale, buyer segment, and independently measured
      outcomes.
    whyItMatters: Without comparable peer evidence, Solace's differentiation and competitive rank cannot be independently tested.
    diligencePath: >-
      Request management's named competitor set, recent win-loss analysis, payer procurement comparisons, and
      third-party outcome benchmarks.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Retention, advocate continuity, multi-homing, payer renewal, and cohort-level switching data.
    whyItMatters: >-
      Relationship continuity is central to the moat thesis, but public evidence does not quantify whether it improves
      retention or pricing power.
    diligencePath: Review patient and payer retention cohorts, advocate reassignment rates, contract renewals, and churn interviews.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: Realized reimbursement, patient cost sharing, direct-pay pricing, discounting, and named-peer contract terms.
    whyItMatters: >-
      Coverage can accelerate adoption while concentrating channel and reimbursement risk; list-level statements do not
      reveal unit economics.
    diligencePath: Obtain anonymized claims, payer contracts, patient invoices, and comparable competitor proposals.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, referral and channel mix, sales cycle, conversion, channel fees, retention, and payback by payer and
      acquisition cohort.
    whyItMatters: >-
      Without acquisition cost and retention data, public traction cannot establish efficient growth or lifetime-value
      economics.
    diligencePath: >-
      Request monthly cohort data and reconcile marketing and sales spend to acquired, activated, retained, and
      reimbursed patients.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, debt and credit facilities, monthly net burn, working-capital needs, capex, runway, and
      next-round triggers.
    whyItMatters: >-
      Funding raised does not equal cash available, and claims collection timing may create material working-capital
      requirements.
    diligencePath: >-
      Obtain the latest balance sheet, cash-flow statement, debt schedule, 24-month operating plan, and base/downside
      liquidity bridge.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-estimate
    missingEvidence: >-
      Audited revenue with a consistent period and definition that reconciles the $100 million revenue-or-ARR field and
      the $17.6 million estimate.
    whyItMatters: >-
      The conflicting values cannot support growth, valuation, or runway analysis and may represent different
      definitions or unreliable estimates.
    diligencePath: >-
      Request audited annual and monthly revenue, deferred revenue, gross-to-net claims adjustments, and a
      source-by-source reconciliation.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-assurance
    missingEvidence: >-
      Independent security audit, incident history, availability metrics, response-time SLAs, and named interoperability
      evidence.
    whyItMatters: >-
      These controls determine whether a sensitive, labor-intensive healthcare service can scale without privacy,
      continuity, or implementation failures.
    diligencePath: >-
      Review SOC 2 or equivalent reports, penetration-test summaries, incident registers, uptime dashboards, EHR
      integration inventories, and support SLA performance.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: advocate-operations
    missingEvidence: >-
      Advocate credentialing standards, caseload distributions, attrition, escalation rules, and audited service-quality
      outcomes.
    whyItMatters: >-
      Software-assisted routing does not by itself establish consistent human-service capacity or clinical-quality
      boundaries.
    diligencePath: >-
      Sample credential files and quality reviews, inspect caseload and attrition cohorts, and reconcile escalations and
      outcomes to source systems.
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: roadmap-and-outcomes
    missingEvidence: >-
      A dated product roadmap and product-level adoption metrics for the Walmart and American Legion distribution
      surfaces.
    whyItMatters: >-
      Announced availability does not establish integration depth, converted demand, or the pace of future product
      development.
    diligencePath: >-
      Obtain the board-approved roadmap, partner implementation plans, launch cohorts, conversion funnels, and renewal
      or usage data.
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      NRR, GRR, churn, renewal rates, contract duration, cohort utilization, payer-level revenue mix, and top-customer
      concentration.
    whyItMatters: >-
      These measures determine whether rapid patient and plan expansion creates durable recurring economics or hides
      payer and channel concentration.
    diligencePath: >-
      Request monthly patient cohorts, sponsor renewal schedules, payer-level revenue and claims mix, contract terms,
      and churn bridges for 2024-2026.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete dated customer-reference list with consented case files, production status, baseline measures,
      outcomes, and independent validation.
    whyItMatters: >-
      Company-selected anecdotes cannot establish how representative or durable the reported patient outcomes are across
      the served population.
    diligencePath: >-
      Interview a stratified sample of current and former patients, caregivers, advocates, payer sponsors, and provider
      counterparts and reconcile each case to utilization and claims records.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: commercial-expansion
    missingEvidence: >-
      Named commercial plan contracts beyond the two disclosed brands, covered lives, active-patient counts, employer
      channels, and plan-level economics.
    whyItMatters: >-
      Eligibility expansion alone does not show production deployment, customer diversification, or economic
      contribution outside Medicare.
    diligencePath: >-
      Obtain executed payer and employer agreements, implementation dates, covered-life rosters, active utilization,
      claims acceptance, and revenue by commercial sponsor.
    relatedQuestionRefs:
      - QU001
      - QU002
      - QU005
  - type: missing-source
    severity: material
    topic: regulatory-legal
    missingEvidence: >-
      Regulator-issued Medicare billing authority, claims codes, state licensure analysis, complaint and litigation
      searches, and malpractice coverage.
    whyItMatters: >-
      Company and review sources establish only stated eligibility and role boundaries, not whether reimbursement and
