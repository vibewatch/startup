callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Reassess the investment case if covered eligibility materially contracts,
      advocate response or continuity deteriorates, independent control testing
      identifies a serious privacy or security weakness, or payer-level claims and
      labor data show structurally negative contribution economics.
    claimRefs: [CR007, CR009, CR014, CR015, CR016]
