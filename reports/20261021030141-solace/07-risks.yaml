      topic: regulatory-legal
      missingEvidence: >-
        Regulator-issued Medicare billing authority, claims codes, state licensure
        analysis, complaint and litigation searches, and malpractice coverage.
      whyItMatters: >-
        Company and review sources establish only stated eligibility and role
        boundaries, not whether reimbursement and scope controls withstand audit.
      diligencePath: >-
        Obtain CMS billing guidance and audit correspondence, state-by-state
        licensure mapping, claims-denial logs, complaint records, and counsel's
        litigation and regulatory memorandum.
      relatedQuestionRefs: [QR001, QR004]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: privacy-security
      missingEvidence: >-
        Independent SOC 2 or HITRUST evidence, penetration-test results, BAA and
        subprocessor inventories, uptime records, and complete incident history.
      whyItMatters: >-
        A company HIPAA assertion does not establish control effectiveness or the
        absence of prior security and availability incidents.
      diligencePath: >-
        Review current audit reports and remediation exceptions in a data room,
        interview the security owner, and sample incident and disaster-recovery logs.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: workforce-capacity
      missingEvidence: >-
        Advocate caseload distributions, attrition, utilization, response SLAs,
        scheduling backlog, quality audits, and escalation outcomes.
      whyItMatters: >-
        Public experience claims and a secondary burnout signal cannot determine
        whether dedicated-advocate continuity scales without service degradation.
      diligencePath: >-
        Obtain monthly cohort data by advocate tenure and specialty, then test
        caseload, response time, churn, absence, complaint, and escalation trends.
      relatedQuestionRefs: [QR003, QR006]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: >-
        Audited revenue, payer mix, claims acceptance and collection lags, gross
        margin, advocate cost per case, burn, cash balance, and runway.
      whyItMatters: >-
        Funding and patient-volume disclosures do not establish cash availability,
        revenue quality, profitability, or scalable contribution economics.
      diligencePath: >-
        Reconcile payer-level claims to cash, inspect monthly financial statements
        and cash forecasts, and build contribution-margin cohorts by plan and case.
      relatedQuestionRefs: [QR009, QR010]
      relatedTableRefs: [TR003]
