        - CO004
    - name: Sara Sargent
      role: Co-founder and CPO
      claimRefs:
        - CO001
        - CO004
  foundingLocation: null
  headquarters: null
  productSummary: >-
    A virtual, human-in-the-loop care-navigation service that matches eligible patients with a continuing healthcare
    advocate and supports coordination, insurance, billing, records, appointments, and care transitions.
  customerFocus: >-
    Medicare and Medicare Advantage beneficiaries, commercially insured patients, families and caregivers navigating
    complex healthcare needs.
  businessModel: >-
    Insurance-reimbursed advocacy in which Solace handles billing and takes a variable share of reimbursements paid to
    advocates using its platform.
  stage: Series C
  fundingStatus: >-
