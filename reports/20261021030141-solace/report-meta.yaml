companyProfile:
  summary: >-
    Solace is a healthcare-advocacy platform founded in July 2022 by Jeremy Gurewitz and Sara Sargent. It pairs patients
    with dedicated advocates who coordinate care, records, appointments, benefits, and insurance disputes, while Solace
    handles billing and retains a variable share of reimbursements. The company reports nationwide access through
    Original Medicare and many Medicare Advantage plans, with newer commercial and retail distribution.
  founders:
