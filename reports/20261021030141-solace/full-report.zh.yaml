  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入引擎与交付模式
        blocks:
          - type: paragraph
            body: >-
              Solace 的公开模式由报销驱动，而不是传统的患者付费订阅。一份独立画像称，平台从支付给倡导者的 Medicare 报销中抽取浮动份额；Solace 则称其会直接向 Medicare
              为覆盖服务计费。因此，经济链条从符合条件的患者和医生接诊开始，经倡导者交付服务、提交索赔、付款方报销，再到平台分成。这是一种服务加软件模式，其毛利取决于报销费率、倡导者薪酬、可计费使用量、文档质量、拒赔率和回款时间。Solace
              还称，每一小时直接服务可能需要额外三小时协调工作，因此劳动生产率和幕后工作能否计费，是核心投资判断问题，而不是附带的运营细节。
            claimRefs:
              - CI001
              - CI002
