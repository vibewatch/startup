  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持“跟踪/继续研究”，而非直接投资。Solace 宣布 2026 年 2 月完成 $130 million Series C，估值超过 $1 billion；此前披露的 Series A 和
              Series B 分别为 $14 million 和 $60
              million。这一融资序列说明投资人需求和资本充足，但不是运营估值方法。保留融资材料没有提供经审计收入、毛利率、现金消耗、现金跑道、完全稀释后持股、清算优先权、债务、老股转让成分或投资人控制条款。SetterVC
              也将其公司数据和估值标记称为可能不完整、过时、错误或会被修订的估算。因此，进入价格纪律应要求私有证据支持最新估值，或要求足以补偿未解决经济问题和优先权悬垂的条款；仅凭独角兽估值不足以投资。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
