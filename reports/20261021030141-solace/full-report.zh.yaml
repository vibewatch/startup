  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 报销持久、回款强劲、渠道队列留存，且服务利润率改善。
        - 只有经审计的经济数据证明其具备高增长、高利润率特征后，最新估值标记的上行空间才有依据；公开信息无法支持任何区间。
        - 支付方续约获确认、队列留存，以及贡献利润为正。
        - 报销范围收窄，或渠道队列无法留存。
      - - 基准
        - 分销扩大，但经济性证明和证券条款仍不完整。
        - 将高于 $1 billion 的估值标记视为融资参考，而非公允价值；暂不设定精确区间和目标回报。
        - 私有数据能够核对增长、利润率、现金消耗和资本结构，且不改变风险判断。
        - 下一轮融资或二级交易机会出现时，证据仍不可得。
      - - 悲观
        - 人力密度持续、公司口径的理赔经济性令人失望，或融资优先权吞噬普通股价值。
        - 大幅折价或下轮融资均有可能，但公开证据无法量化幅度。
        - 使用率放缓、回款疲弱、现金消耗上升，或出现保护投资人的条款。
        - 报销政策不利变化、失去支付方，或无法在没有高级优先权的情况下融资。
    notes: 情景区间和概率特意保持定性，因为留存来源未披露进行可辩护的数值估值或回报估算所需的分母指标和证券条款。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV011
      - CV013
      - CV014
      - CV015
