      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              融资提供扩张能力，但不等于流动性或现金跑道。Solace 宣布 2025 年 4 月完成 $60 million Series B，用于产品开发和网络扩张；独立画像则报告 2026 年 2 月完成 $130
              million Series C。三轮有名融资合计 $204 million，而 YesPress 引用 Bloomberg 的总额为 $211
              million，说明可能存在早期或未逐项列出的资本，而非当前可用现金。保留资料没有披露现金余额、债务、月度现金消耗、营运资本、资本开支、公司理赔应收款或下一轮融资触发条件。因此财务结论是混合的：报销可能支撑经常性需求，但以人为核心的交付模式和不透明的公司口径理赔经济性，使收入质量、利润率持久性和资本充足性仍未经证明。
