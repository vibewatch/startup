        blocks:
          - type: paragraph
            body: >-
              融资节奏从 2024 年 8 月的 $14 million Series A，加速到 2025 年 4 月的 $60 million Series B，再到 2026 年 2 月的 $130 million
              Series C。Bloomberg 撰写的报道称 IVP 领投 Series C，该轮将 Solace 估值推至 $1 billion，累计融资达到 $211
              million。这是当前资料池中支持最充分的融资记录，但不等于可用现金、收入、ARR 或现金跑道。已披露运营规模也不一致：Bloomberg 提到超过 2,000 名注册护士倡导者，而一份独立的 8
              月画像称每月服务超过 20,000 名患者。保留资料没有证明当前收入、ARR、利润率、现金消耗或现金余额。FundedIQ 的 2026 年 10 月页面仍把 Series B 称为最新轮次，只报告融资 $74
              million，因此它更像是新鲜度不佳的信号，而非可靠的当前总额。
