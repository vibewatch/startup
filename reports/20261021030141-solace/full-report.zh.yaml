            body: >-
              Solace 扩展至 UnitedHealthcare、Anthem Blue Cross Blue Shield
              和其他商业计划，分散了覆盖叙事，但公开披露没有说明会员激活、索赔受理、合同持久性或各付款方收入集中度。一份第三方画像称截至 2026 年 2 月每月患者超过 20,000 人、2026 年 5 月员工 435
              人，但其财务部分只有归因于 ZoomInfo
              的收入估算，并称没有公开利润数据。这些数字不能替代经审计收入、毛利率、现金消耗或现金跑道。实际的论点失效触发因素包括覆盖资格大幅收缩、倡导者响应持续恶化、严重隐私或安全控制失败，或尽调发现索赔回款和劳动成本无法支撑可接受的贡献利润。在提供付款方集中度、案件量、拒赔、留存和现金数据前，缓释方案仍不完整。
