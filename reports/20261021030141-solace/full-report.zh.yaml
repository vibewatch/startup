        title: 风险优先级与投资含义
        blocks:
          - type: paragraph
            body: >-
              最重要的风险在于付款方资格与依赖专属人工倡导者的交付模式相互叠加。Solace 称 Original Medicare 和多项 Medicare Advantage
              计划覆盖该服务，但公司材料也提醒资格因计划而异；一份独立评测同样将计划资格和倡导者供给不稳定列为投诉主题。公司已扩展至指定商业计划，但保留来源没有披露付款方集中度或实施表现。由此得出的剩余风险评级是分析师判断，不是事故频率：报销和产能评级较高，因为覆盖中断或服务瓶颈会直接损害可及性和增长。隐私/安全发生概率没有评分，而非被假定为低，因为资料池中只有公司的
              HIPAA 声明，没有独立控制审计或事故历史来源。
            claimRefs:
              - CR001
              - CR002
