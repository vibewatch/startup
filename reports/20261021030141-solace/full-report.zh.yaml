          x: 3
          'y': 5
          detail: 患者付费、站在患者一侧；触达范围因服务方而异
        - label: 政府 / 非营利项目
          x: 3
          'y': 4
          detail: 针对特定福利、权利或病症提供独立帮助
        - label: 雇主导航福利
          x: 4
          'y': 3
          detail: 由赞助方提供广泛访问；服务和问责程度不一
    approximationNotes: 1-5 序数坐标由分析师根据来源描述的雇主、问责、场景和虚拟触达综合得出。它们不是测量分数、基准阈值或与价值成比例的距离。
    claimRefs:
      - CP013
      - CP014
  - id: FI001
    title: 从报销到毛利的证据桥
    type: flow
    summary: 公开证据支持从服务运营到报销的流程，但留存来源未披露量化收入或毛利所需的金额。
    data:
      nodes:
        - id: eligibility
          label: 覆盖资格
          detail: Solace 核查 Medicare、Medicare Advantage 或商业计划资格。
        - id: intake
          label: 医生接诊
          detail: 简短的医生问诊确认需求并匹配倡导人员。
        - id: advocacy
          label: 倡导服务
          detail: 专属倡导人员提供远程协调、申诉和跟进。
        - id: claim
          label: 理赔提交
          detail: Solace 称已搭建基础设施，可直接向 Medicare 计费。
        - id: reimbursement
          label: 支付方报销
          detail: 允许金额、拒付率和回款时间均未公开披露。
        - id: gross-profit
          label: 平台毛利
          detail: 平台可变分成扣除倡导及支持服务成本；金额不可得。
    approximationNotes: 该流程有证据支持，但未估算金额、转化率、抽成率或利润率。
