  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场比数字医疗更窄，又比软件工作流品类更宽。Solace
              销售的是由保险报销、以人为核心并由虚拟平台支持的患者倡导服务：倡导者协调预约和病历，跨医疗机构沟通，推进批准和申诉，并帮助患者理解下一步。诊断、开药、急救响应和法律代理不在边界内。相关的现状方案包括患者或照护者无偿投入、医院患者代表、保险方个案经理、政府咨询和申诉专员项目、雇主导航福利，以及现金支付的独立倡导者。这些替代方案很重要，因为其中若干已经由机构出资，能够在没有单独建立
              Solace 关系的情况下完成部分相同工作。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定的公开证据不足以支持货币口径的 TAM、SAM 或 SOM。2024 年一份公司发布的公告将 6,500 万 Medicare 参保人列为初始触达池，而当前公司材料称 Original Medicare
              和多项 Medicare Advantage
              计划在全国覆盖该服务。这些是资格和分发口径，不是收入：并非每位受益人都有符合条件的需求、会选择倡导者、能获得覆盖，或产生相同的可报销工作量。网络规模和风险投资融资能说明运营能力和投资人信心，但都不是市场支出。因而本展示将人口、可触达性、供给和资本信号分开呈现，没有把它们转换成缺乏支持的自上而下预测。
            claimRefs:
