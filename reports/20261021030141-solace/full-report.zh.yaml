  - id: FU001
    title: 已记录的客户旅程与互动触点
    type: journey-map
    summary: 公开工作流从资格核查推进到持续倡导；该顺序展示服务触点，不代表实测转化率或留存率。
    data:
      nodes:
        - id: eligibility
          label: 资格核查
          detail: 患者核查 Medicare、Medicare Advantage 或商业计划资格。
          touchpoints:
            - Online eligibility flow
            - Plan coverage
        - id: intake
          label: 医生接诊
          detail: 简短的虚拟医生沟通了解目标和挑战。
          touchpoints:
            - Video or phone
            - Care-needs assessment
        - id: matching
          label: 倡导人员匹配
          detail: Solace 为患者匹配适合该病例的专属倡导人员。
          touchpoints:
            - Background fit
            - Communication preference
        - id: coordination
          label: 积极协调
          detail: 倡导人员整理记录、预约、转诊和跟进事项。
          touchpoints:
            - Text
            - Phone
            - Video
            - Email
        - id: resolution
          label: 解决障碍
          detail: 工作可能延伸至授权、申诉、计费和资源获取。
          touchpoints:
            - Insurer and provider calls
            - Appeals
            - Scheduling
        - id: continuity
          label: 持续关系
          detail: 公司材料称，同一名倡导人员可以持续服务患者后续需求。
          touchpoints:
            - Regular check-ins
            - Caregiver coordination
            - New care episodes
    approximationNotes: 阶段顺序根据公司描述的工作流重构；不代表任何转化率、持续时间、使用率或留存率。
