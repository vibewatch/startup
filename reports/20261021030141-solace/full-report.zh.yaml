      - number: '4.2'
        title: 价格、覆盖与公开成效
        blocks:
          - type: paragraph
            body: >-
              患者承担的价格取决于计划。Solace 称 Original Medicare 和多项 Medicare Advantage 计划覆盖其倡导者服务，患者通常只需承担适用的免赔额或共同保险；另一份公司页面称
              Solace 会在服务前核验覆盖情况。这些说法证明了报销路径，但没有证明实际价格、每位患者净收入或毛利率。公开规模指标很有意义，但不应与收入混淆：一份 2026 年 8 月的画像称每月服务超过 20,000
              名患者，而 YesPress 报道公司称平台拥有超过 2,000 名倡导者，并累计帮助超过 200,000 名患者和家属。两份来源都没有披露已支付理赔、确认收入、付款方结构、活跃时长队列或回款。
