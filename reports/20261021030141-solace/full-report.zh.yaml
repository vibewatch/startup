            body: >-
              Solace
              面向客户的产品从资格核验和简短的虚拟医生接诊开始，随后为患者分配一名持续服务的倡导者，由其承担关系连续性。倡导者处理医疗机构预约、病历、保险拒赔、账单问题、照护转接和就诊准备；沟通可以通过电话、视频、短信或电子邮件继续。这使服务更接近技术支持的管理运营，而不是供患者自主使用的软件工具。公开工作流已足以说明客户获得什么，独立媒体报道也聚焦于专属倡导者，而非界面。不过，已发布案例具有选择性，无法证明典型任务解决时间、临床结果或每名倡导者的工作量。
            claimRefs:
              - CE001
