              - CP012
      - number: '3.3'
        title: 保险分发可以降低患者价格摩擦，但也会增加付款方暴露
        blocks:
          - type: paragraph
            body: >-
              Solace 称 Original Medicare 和多项 Medicare Advantage
              计划在全国覆盖其倡导者服务，较新的公司材料还声称商业计划也可在全国使用。相较于直接向患者收费的独立倡导服务，这种分发能显著降低患者价格；Solace
              自己的科普文章列出了独立服务的小时费率和预付费区间。代价是渠道依赖：资格、免赔额、共同保险、付款方签约和报销运营都会影响可及性。与同一名倡导者保持连续关系、积累病例背景，会带来关系切换成本，但并非不可替代的锁定。患者仍可并行使用保险方、医院、政府、雇主、独立倡导者和家属支持，因此多重使用仍然可能。
            claimRefs:
