      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              患者是用户和受益人，但经济买方通常是能够将符合条件的人导入服务的保险方或其他机构。公开描述显示，服务来源包括医疗机构转介、消费者直接资格核验、Medicare 和 Medicare Advantage
              覆盖、新增商业计划覆盖，以及 Walmart 的 Better Care Services 分发。与 American Legion 的合作为退伍军人增加了一条关系渠道，因为他们的照护可能跨越
              VA、Medicare、商业保险和私人医疗机构。因此，采用既需要用户意识到需求，也需要可行的支付路径。证据没有说明任何渠道的内部预算负责人、采购周期、授权规则或转化率，因此渠道公告不应被解读为已签约的患者数量。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              报销是采用的核心驱动因素。YesPress 报道，Medicare 在 2024 年出台的导航和社区健康整合支付规则，将部分倡导工作变成可计费服务；Solace 在 2026
              年宣布的商业保险覆盖扩大了潜在付款方范围。照护碎片化、拒赔管理和行政负担会持续制造需求，但同一模式也暴露于资格认定、文档、回款和报销政策执行风险。Solace 自身引用了一项基于 2006 年政府数据的 88%
              健康素养统计，说明需求逻辑合理，但部分核心证明已经过时。公开价格取决于计划，已审阅来源没有提供独立的品类级 ROI、使用率、续约或报销产出证据。$130 million Series C 和超过 $1
              billion 的估值是融资信号，不能替代这些运营指标。
            claimRefs:
              - CM005
              - CM008
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 市场规模仍是投资判断缺口
            body: 公开材料证明了庞大的需求池和不断扩大的触达路径，但没有证明品类支出、符合条件的人数、报销产出、使用率、留存或经独立测量的节省金额。
            calloutType: risk
            claimRefs:
              - CM006
