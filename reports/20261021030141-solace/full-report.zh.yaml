      - number: '3.2'
        title: 已披露的产品优势在于连续服务与执行，而非诊断
        blocks:
          - type: paragraph
            body: >-
              Solace 披露的产品以一名持续服务的倡导者为核心：其可安排预约、协调医疗机构、整理病历、支持申诉、审阅账单、寻找资源，并远程参与就诊。倡导者不做诊断或开药，因此服务是临床照护的补充，而非替代。每月超过
              20,000 名患者和超过 2,000
              名倡导者的网络说明已有运营规模，但这些数字仍是通过媒体披露的公司口径。更稳妥的差异化判断是其组合式运营系统：人工连续性、虚拟触达、接收与匹配，以及报销机制。指定证据没有独立比较其执行质量与直接竞争者的差异。
            claimRefs:
              - CP002
