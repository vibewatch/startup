        title: 相互冲突的收入信号与缺失的单位经济
        blocks:
          - type: paragraph
            body: >-
              保留证据无法建立可靠的收入基线。Multiples 在 2025 年 4 月 Series B 旁列出 $100 million，同时明确把字段标为“Revenue (or
              ARR)”，并称该数字可能代表运行率收入或已披露的过去十二个月收入。另一份 2026 年 8 月公司画像报告了由 ZoomInfo 提供的 $17.6 million
              收入估算，并称没有公开利润数据。差距过大，定义也过于不确定，无法将其视为增长轨迹；它反而说明管理层必须提供经审计的收入确认、付款方和服务线结构、总额到净额的索赔瀑布、拒赔和回款数据、倡导者支付，以及按队列计算的贡献利润，之后才能将任一数字用于估值或现金跑道分析。
