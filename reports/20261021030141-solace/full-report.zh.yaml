chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Solace 由 Jeremy Gurewitz 和 Sara Sargent 于 2022 年 7 月创立，并于 2023
              年公开上线。其核心服务是让患者与专属医疗倡导者建立虚拟关系，由倡导者协助协调医疗机构、病历、预约、福利和保险争议。Bloomberg 对变现方式的描述更具体：Solace 负责 Medicare
              计费，并从支付给倡导者的报销中抽取浮动份额，因此报销运营是业务核心，而非附带的行政工作。公司称 Original Medicare 和多项 Medicare Advantage
              计划已在全国覆盖该服务。公开记录无法确定唯一总部：一份 2026 年 8 月的画像列出 Redwood City，FundedIQ 则列出
              Austin。在公司记录或管理层材料确认主要执行办公室前，这一差异应保持未决。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
