              - CV006
              - CV007
              - CV011
              - CV014
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：报销驱动的倡导服务可以成为持久的医疗基础设施，而非可有可无的礼宾服务。Solace 称其服务由 Original Medicare 和多项 Medicare Advantage 计划覆盖，Series
              C 公告称全国拥有超过 2,000 名倡导者。分发还通过 Walmart 的 Better Care Services 平台和 The American Legion
              的已宣布上架或合作扩大。这些信号支持可及性和认知度，但公告由公司或合作方发布，没有披露合同经济或可归因收入。反论点同样具体：一份独立画像指出倡导者不能诊断、开药或保证保险方的答复，而确切运营成本仍不公开。以人为核心的服务可以创造价值，却仍可能无法产生风险投资级利润率、留存或现金效率。当前证据证明了触达和融资，而非经济引擎的质量。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              由于保留来源没有提供可靠的收入基线、增长率、利润率、留存、现金消耗或可比交易倍数，给出数字化的乐观/基准/悲观估值区间会制造虚假精确。乐观情景要求经审计证据证明倡导报销具有持久性、已签约分发能转化为留存患者，且规模扩大能改善利润率。基准情景只将
              2026 年 2 月估值视为融资参考，等到经济性和证券条款可得后再做投资判断。悲观情景是报销减弱、使用量无法变现，或劳动强度阻止运营杠杆时出现大幅下轮融资或优先权受损结果。最近的私有公司参考 Citizen
              Health
              只提供融资金额，没有估值或可比经济性，因此无法建立倍数。退出准备度同样未经证明：最终尽调必须取得经审计的队列经济、公司口径的索赔回款和拒赔数据、付款方及渠道集中度、资本结构和优先权条款，以及通往战略或公开市场流动性的可信路径。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 价格是缺失的桥梁
            body: Solace 可以是一家有吸引力的公司，同时仍是一项缺乏吸引力的证券。只有在经审计经济性和融资条款支持进入价格，或价格与保护条款足以抵消未解决的下行风险后，才应推进。
            calloutType: recommendation
            claimRefs:
              - CV011
