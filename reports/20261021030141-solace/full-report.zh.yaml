              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合横跨机构方案与独立替代者，且高度分散
        blocks:
          - type: paragraph
            body: >-
              买方的替代方案往往不是另一家风险投资支持的患者倡导平台，而是付款方个案经理、医院患者代表或护士导航员、由患者直接付费的独立倡导者、政府咨询或申诉专员项目、雇主导航福利，或者患者和家属自行完成这些工作。Solace
              横跨这些类别：公司将自己定位为站在患者一侧、以虚拟方式提供服务、覆盖全国，并能跨医疗机构和保险方协调工作。这种广度具有战略价值，但指定的公开记录没有列出完整的同类公司名单。因此，这个市场更适合看作解决方案类别地图，而不是穷尽式竞争者清单。
            claimRefs:
              - CP001
              - CP008
