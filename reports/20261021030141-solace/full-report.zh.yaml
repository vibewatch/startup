              该模式将经验丰富的人员与可能高负荷的劳动结构结合起来。Solace 多次称倡导者平均拥有 16
              年医疗经验，且每名患者都由专属倡导者服务；但公司也称每小时直接帮助患者平均需要额外三小时协调。这一比例不是成本或生产率指标，却使案件量、排班和自动化质量成为核心尽调问题。第三方评测将供给不稳定列为投诉主题，并转述员工评价中关于管理和倦怠的担忧；由于证据来自二手且信誉较低的来源，它是风险信号，而非系统性失败的证明。虚拟服务界面还使正常运行时间、安全消息、访问控制和事故响应变得重要，但指定证据中没有
              SLA、宕机记录、渗透测试或独立安全审计。
