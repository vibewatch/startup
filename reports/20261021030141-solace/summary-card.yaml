  topStrengths:
    - >-
      Reimbursement-backed access through Original Medicare, many Medicare Advantage plans, and expanding commercial
      coverage reduces direct-pay friction for eligible patients.
    - >-
      Reported scale of more than 20,000 monthly patients and more than 2,000 advocates indicates meaningful operating
      reach.
    - >-
      Dedicated-advocate continuity, virtual delivery, and billing infrastructure provide a differentiated operating
      model across a fragmented market.
    - >-
      A $130 million Series C and newer Walmart and American Legion distribution surfaces provide capital and potential
      demand channels.
  topRisks:
    - >-
      Audited revenue, gross margin, burn, runway, claims realization, CAC, payback, and retention remain undisclosed,
      while public revenue estimates conflict materially.
    - >-
      Plan-specific eligibility, reimbursement execution, and undisclosed payer concentration create high channel and
      policy dependence.
    - >-
      Labor-intensive service delivery makes advocate caseload, attrition, response time, quality control, and
      contribution margin critical but unverified.
    - >-
      Independent security audits, incident history, availability metrics, and detailed regulatory and litigation
      records are not available in the retained evidence.
    - >-
      The $1 billion valuation lacks disclosed ownership, preferences, debt, secondary components, comparable multiples,
      or operating denominators.
  unresolvedGaps:
    - >-
      Audited revenue or ARR, growth, gross margin, contribution margin, cash, burn, runway, claims acceptance,
      collection timing, CAC, and payback.
    - >-
      Fully diluted capitalization, Series C price per share, liquidation preferences, investor control rights, debt,
      and secondary transactions.
    - >-
      Payer and channel concentration, NRR, GRR, churn, renewal, contract duration, cohort utilization, and economics
      attributable to commercial, Walmart, and American Legion channels.
    - >-
      Independent SOC 2 or HITRUST evidence, penetration tests, incident and uptime history, interoperability inventory,
      and response-time SLAs.
    - >-
      Advocate credentials, caseloads, attrition, escalation outcomes, quality audits, and independently validated
      patient or payer outcomes.
    - >-
      Defensible monetary TAM, named-peer pricing and outcomes, recent comparable transactions, and independently
      measured competitive win rates.
