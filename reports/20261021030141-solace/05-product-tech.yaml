company:
  name: Solace
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Solace delivers a human-in-the-loop healthcare navigation service: patients complete
    virtual intake, are matched to a dedicated advocate, and continue through phone, video,
    text, or email while the operating platform supports coordination and reimbursement.
    Public evidence describes a broad workflow stack, but most technical, reliability,
    security, and quality assertions remain company- or investor-issued rather than
    independently audited.
sections:
  - id: patient-workflow
    title: The product is a continuing advocate relationship, not a self-service app
    body: >-
      Solace's customer-facing product begins with eligibility and a short virtual physician
      intake, then assigns one advocate who remains the patient's point of continuity. The
      advocate works across provider scheduling, records, insurance denials, billing questions,
      care transitions, and preparation for medical appointments; communication can continue
      by phone, video, text, or email. This makes the service closer to technology-enabled
      managed operations than to a software tool sold for autonomous patient use. The public
      workflow is specific enough to establish what customers receive, and independent
      editorial coverage also centers the dedicated advocate rather than the interface.
      However, published examples are selective and do not establish typical task resolution
      times, clinical outcomes, or workload per advocate.
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE014]
    tableRefs: [TE002]
  - id: operating-stack
    title: A full-stack operating system is asserted, but the implementation is opaque
    body: >-
      SignalFire describes an integrated stack spanning intake, advocate workflows, physician
      oversight, documentation, billing, task routing, triage, and EHR interoperability.
      Solace's 2024 release adds a matching algorithm, real-time patient interaction, progress
      tracking, and quality inputs from surveys, physicians, and electronic medical records.
      Together these sources suggest that software standardizes and monetizes a labor-intensive
      service rather than replacing advocate judgment. The architecture is plausible and
      operationally coherent, but the strongest detail comes from an investor and a
      company-issued release. No public technical documentation in the assigned evidence
      explains data models, integration methods, model governance, availability design, or
      whether the matching and routing systems are automated, rules-based, or manually
      supervised.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: deployment-and-differentiation
    title: Distribution is expanding while service continuity remains the differentiator
    body: >-
      The clearest differentiation is the combination of one continuing advocate, insurance
      billing infrastructure, and cross-institution coordination. SignalFire reports more than
      2,000 advocates supported by the platform, while 2026 company-issued partnership releases
      describe advocates averaging 16 years of healthcare experience. Walmart's Better Care
      Services listing creates a new discovery surface, and the American Legion partnership
      targets veterans who move among VA, Medicare, commercial insurance, and private
      providers. These announcements support deployment breadth, not deep technical
      integration: neither release discloses API scope, implementation effort, uptime, service
      levels, or measured partner conversion. The defensible asset may therefore be the
      operating playbook and reimbursement workflow as much as proprietary software.
    claimRefs: [CE007, CE008, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: trust-quality-and-roadmap
    title: Trust claims are visible; independent control evidence is not
    body: >-
      Solace states that eligibility information is handled on a HIPAA-compliant platform and
      that quality monitoring uses patient surveys, supporting physicians, and electronic
      medical records. It also says advocates do not diagnose or make medical decisions, which
      defines an important scope boundary. Those statements are relevant controls, but they do
      not substitute for independent security testing, audit reports, incident history,
      credentialing procedures, clinical escalation rules, or service-level performance.
      Public roadmap detail is similarly thin: the available material shows additional payer
      and partner surfaces, not a dated product roadmap. Diligence should therefore treat
      security posture, integration reliability, advocate capacity, and quality consistency as
      material unverified dependencies rather than assume that nationwide availability proves
      technical maturity.
    claimRefs: [CE010, CE012, CE013, CE015, CE016]
