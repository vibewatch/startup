  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-assurance
      missingEvidence: Independent security audit, incident history, availability metrics, response-time SLAs, and named interoperability evidence.
      whyItMatters: These controls determine whether a sensitive, labor-intensive healthcare service can scale without privacy, continuity, or implementation failures.
      diligencePath: Review SOC 2 or equivalent reports, penetration-test summaries, incident registers, uptime dashboards, EHR integration inventories, and support SLA performance.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE001, TE003]
    - type: private-evidence-only
      severity: material
      topic: advocate-operations
      missingEvidence: Advocate credentialing standards, caseload distributions, attrition, escalation rules, and audited service-quality outcomes.
      whyItMatters: Software-assisted routing does not by itself establish consistent human-service capacity or clinical-quality boundaries.
      diligencePath: Sample credential files and quality reviews, inspect caseload and attrition cohorts, and reconcile escalations and outcomes to source systems.
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: minor
      topic: roadmap-and-outcomes
      missingEvidence: A dated product roadmap and product-level adoption metrics for the Walmart and American Legion distribution surfaces.
      whyItMatters: Announced availability does not establish integration depth, converted demand, or the pace of future product development.
      diligencePath: Obtain the board-approved roadmap, partner implementation plans, launch cohorts, conversion funnels, and renewal or usage data.
      relatedTableRefs: [TE003]
