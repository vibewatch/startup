  topStrengths:
    - Original Medicare、众多 Medicare Advantage 计划及不断扩大的商业保险覆盖，为符合条件的患者提供报销支持，降低了自费就医阻力。
    - 据报道，每月服务患者超过 20,000 人、倡导员超过 2,000 名，说明其运营触达已具备一定规模。
    - 专属倡导员的连续服务、线上交付和账单基础设施，在分散的市场中构成了差异化运营模式。
    - $130 million 的 Series C 融资，以及新增的 Walmart 和 American Legion 分销触点，带来了资本和潜在需求渠道。
  topRisks:
    - 经审计收入、毛利率、资金消耗、资金续航、公司口径中的保险理赔兑现、CAC、回收期和留存率仍未披露，而公开收入估算之间存在重大冲突。
    - 计划级别的资格条件、报销执行情况和未披露的支付方集中度，使公司高度依赖渠道和政策。
    - 劳动密集型服务交付使倡导员人均负荷、流失率、响应时间、质量控制和贡献毛利成为关键变量，但这些指标尚未得到验证。
    - 留存证据中没有独立安全审计、事件历史、可用性指标，以及详细监管和诉讼记录。
    - $1 billion 估值未披露股权结构、优先权、债务、老股转让部分、可比倍数或运营分母。
  unresolvedGaps:
    - 经审计收入或 ARR、增长、毛利率、贡献毛利、现金、资金消耗、资金续航、公司口径中的保险理赔获批、回款时间、CAC 和回收期。
    - 完全摊薄后的资本结构、Series C 每股价格、清算优先权、投资人控制权、债务和老股交易。
    - 支付方和渠道集中度、NRR、GRR、流失、续约、合同期限、队列使用率，以及商业保险、Walmart 和 American Legion 渠道贡献的经营数据。
    - 独立 SOC 2 或 HITRUST 证据、渗透测试、事件和正常运行时间历史、互操作性清单，以及响应时间 SLA。
    - 倡导员资质、人均负荷、流失率、升级处理结果、质量审计，以及经独立验证的患者或支付方结果。
    - 可经得起检验的货币化 TAM、具名同行的定价和结果、近期可比交易，以及经独立测量的竞争胜率。
