        - id: financing
          label: Latest price marker
          detail: The February 2026 Series C raised $130 million at more than $1 billion.
        - id: evidence-gap
          label: Underwriting gap
          detail: Revenue, margins, burn, ownership, preferences, and target returns are undisclosed.
        - id: recommendation
          label: Track / research more
          detail: Require operating proof or materially better entry economics before investing.
    approximationNotes: >-
      The ordered flow is analytical rather than causal; it does not assign
      weights, conversion rates, or a numerical valuation.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV011
      - CV014
callouts:
  - calloutType: recommendation
    title: Price is the missing bridge
    body: >-
      Solace can be a compelling company and still be an unattractive security.
      Proceed only after audited economics and financing terms support the entry
      price, or after price and protections offset the unresolved downside.
    claimRefs:
      - CV011
      - CV014
      - CV015
