      - [Medicare Advantage, "Many plans covered; major carriers named", "Coverage statement, not a contracted price", "Plan terms and patient cost sharing vary", "Payer mix may create rate, authorization, and collection variability"]
      - [Private-pay advocacy benchmark, "$75-$300 per hour or $200-$1,000 monthly retainers", "General market range cited by Solace, not Solace pricing", "Company-issued benchmark is not independent proof", "Shows the cash-pay alternative can be costly but does not establish Solace revenue"]
    notes: "Amounts are patient-facing coverage statements or a company-published market benchmark; they are not Solace realized prices, allowed amounts, or recognized revenue."
    claimRefs: [CI001, CI013, CI015]
  - id: TI003
    title: Unit economics and capital underwriting matrix
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$100M recorded by Multiples for Apr. 2025; $17.6M estimate attributed to ZoomInfo in another profile", Low, "Definitions and values conflict materially", "Audited GAAP revenue and monthly revenue bridge by payer and service line"]
      - [Gross margin, null, Low, "Determines whether a labor-enabled model scales economically", "Gross margin by payer, service code, and advocate cohort, including support labor"]
      - [Platform take rate, "Variable share reported; percentage unavailable", Medium, "Links claims reimbursement to platform revenue", "Contractual take rate, changes by code or payer, and advocate payout waterfall"]
      - [Sales efficiency, null, Low, "Tests whether growth requires uneconomic marketing or channel spend", "CAC, sales cycle, referral conversion, channel fees, and payback by acquisition source"]
      - [Cash burn and runway, null, Low, "Funding raised is not cash available", "Current cash, restricted cash, debt, monthly net burn, working capital, and base/downside runway"]
      - [Claims performance, null, Low, "Denials and collection lag can consume working capital and compress realized revenue", "Submitted, allowed, denied, appealed, paid, and days-sales-outstanding cohorts"]
    notes: "Null means no usable value appears in the eight retained sources; the two revenue figures use different or ambiguous definitions and must not be treated as a time series."
    claimRefs: [CI002, CI006, CI007, CI008, CI014, CI016]
figures:
