company:
  name: Solace
chapter:
  number: 4
  title: Financials
  summary: >-
    Solace appears to monetize a labor-enabled advocacy service through insurance reimbursement,
    with the platform taking a variable share of payments to advocates. Public evidence supports
    growing operating scale and substantial financing, but conflicting revenue estimates and the
    absence of gross margin, burn, collection, CAC, and runway data prevent a financeable unit-
    economics conclusion.
sections:
  - id: revenue-engine
    title: Revenue engine and delivery model
    body: >-
      Solace's public model is reimbursement-led rather than a conventional patient-paid
      subscription. An independent profile reports that the platform takes a variable share of
      Medicare reimbursements paid to advocates, while Solace says it bills Medicare directly for
      covered services. The economic bridge therefore runs from an eligible patient and physician
      intake through advocate-delivered work, claim submission, payer reimbursement, and a platform
      share. This is a service-and-software model whose gross profit depends on reimbursement rates,
      advocate compensation, billable utilization, documentation quality, denial rates, and
      collection timing. Solace also says each direct hour can require three additional coordination
      hours, making labor productivity and the billable treatment of behind-the-scenes work central
      underwriting questions rather than incidental operating details.
    claimRefs: [CI001, CI002, CI003, CI013, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-traction
    title: Pricing, coverage, and public traction
    body: >-
      The patient-facing price is plan-dependent. Solace says Original Medicare and many Medicare
      Advantage plans cover its advocates and that patients generally face only applicable
      deductibles or coinsurance; another company page says Solace verifies coverage before service.
      These statements establish a reimbursement pathway, not realized price, net revenue per
      patient, or gross margin. Public scale indicators are meaningful but should not be confused
      with revenue: an August 2026 profile reports more than 20,000 patients served per month, while
      YesPress reports a company-stated network above 2,000 advocates and more than 200,000 patients
      and families helped cumulatively. Neither source discloses paid claims, recognized revenue,
      payer mix, active-duration cohorts, or collections.
    claimRefs: [CI001, CI004, CI005, CI013, CI015]
    tableRefs: [TI002]
  - id: reported-financials
    title: Conflicting revenue signals and missing unit economics
    body: >-
      The retained evidence does not establish a reliable revenue baseline. Multiples records
      $100 million alongside the April 2025 Series B but explicitly labels its field as “Revenue
      (or ARR)” and says it may represent run-rate revenue or reported LTM revenue. A separate
      August 2026 company profile reports a $17.6 million revenue estimate attributed to ZoomInfo
      and says no public profitability figure was disclosed. The divergence is too large and the
      definitions too uncertain to reconcile as growth. It instead demonstrates why management
      must provide audited revenue recognition, payer and service-line mix, gross-to-net claims
      waterfalls, denial and collection data, advocate payouts, and cohort contribution margins
      before either figure can be used in valuation or runway analysis.
    claimRefs: [CI006, CI007, CI008, CI014, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Financing provides capacity but does not prove liquidity or runway. Solace announced a
      $60 million Series B in April 2025 for product development and network scaling, and independent
      profiles report a $130 million Series C in February 2026. The three named rounds total
      $204 million, while YesPress cites a Bloomberg total of $211 million, suggesting earlier or
      otherwise unitemized capital rather than cash currently available. No retained source
      discloses cash on hand, debt, monthly burn, working capital, capex, claims receivables, or
      next-round triggers. The financial verdict is therefore mixed: reimbursement can support
      recurring demand, but a human-intensive delivery model and opaque claims economics leave
      revenue quality, margin durability, and capital adequacy unproven.
    claimRefs: [CI009, CI010, CI011, CI012, CI014, CI016]
