    title: Reimbursement-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence supports the operating sequence through reimbursement, but the retained
      sources do not disclose the monetary values needed to quantify revenue or gross profit.
    data:
      nodes:
        - id: eligibility
          label: Coverage eligibility
          detail: "Solace checks Medicare, Medicare Advantage, or commercial-plan eligibility."
        - id: intake
          label: Physician intake
          detail: "A short physician consultation establishes need and advocate matching."
        - id: advocacy
          label: Advocate service
          detail: "Dedicated advocates deliver remote coordination, appeals, and follow-up."
        - id: claim
          label: Claim submission
          detail: "Solace says it built infrastructure to bill Medicare directly."
        - id: reimbursement
          label: Payer reimbursement
          detail: "Allowed amount, denial rate, and collection timing are not publicly disclosed."
        - id: gross-profit
          label: Platform gross profit
          detail: "Variable platform share less advocate and support delivery costs; values unavailable."
    approximationNotes: "The sequence is evidence-backed, but no amounts, conversion rates, take rate, or margin are estimated."
    claimRefs: [CI001, CI002, CI003, CI012, CI013, CI016]
callouts:
  - calloutType: risk
    title: Revenue estimates are not underwriting-ready
    body: >-
      The $100 million and $17.6 million figures cannot be reconciled without definitions, periods,
      and source data; neither should be treated as ARR, audited revenue, or a growth series.
    claimRefs: [CI006, CI007]
  - calloutType: recommendation
    title: Make the claims waterfall the first finance diligence request
    body: >-
      Request service-code volume, submitted and allowed amounts, denial and appeal outcomes,
      collections, advocate payouts, and support costs by cohort before assigning a revenue
      multiple or crediting the financing as runway.
    claimRefs: [CI002, CI014, CI016]
