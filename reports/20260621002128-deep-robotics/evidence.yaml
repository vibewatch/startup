evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-governance-disclosure
    missingEvidence: >-
      A current board roster, independent-director list, and detailed executive lineup after the 2025 shareholding
      reform.
    whyItMatters: Late-stage private governance quality affects underwriting confidence, succession planning, and IPO readiness.
    diligencePath: >-
      Request current board materials, shareholder resolutions from the reform, and a management-prepared organization
      chart.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: lifetime-capital-and-cap-table
    missingEvidence: >-
      A round-by-round financing schedule with exact amounts, ownership percentages, option pool, and any secondary
      sales.
    whyItMatters: >-
      The IPO story and current valuation cannot be underwritten cleanly without knowing the cumulative capital base and
      dilution history.
    diligencePath: >-
      Request the cap table, financing documents, and a management-prepared funding history bridge from angel through
      pre-IPO.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-disclosure
    missingEvidence: Audited 2024 revenue, gross margin, operating-loss or profit, cash burn, and balance-sheet detail.
    whyItMatters: >-
      Management commentary implies momentum and possible breakeven, but investment judgment needs audited numbers
      rather than quotes.
    diligencePath: >-
      Request audited financial statements or IPO-prep financial schedules with revenue mix, gross margin, and cash-flow
      detail.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO027
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: formal-ipo-status
    missingEvidence: >-
      Primary CSRC or exchange documentation confirming whether tutoring is completed and whether a formal prospectus
      has been submitted.
    whyItMatters: >-
      The difference between tutoring, filing readiness, and an actual prospectus submission changes both timing and
      risk for the listing path.
    diligencePath: >-
      Monitor CSRC and target-exchange filings directly and ask counsel for the latest listing workplan and blocker
      list.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: early-funding-and-milestone-precision
    missingEvidence: Exact dates and sizes for the Series A, Series A+, and some early product milestones before 2022.
    whyItMatters: >-
      The broad chronology is credible, but missing early precision limits longitudinal analysis of capital efficiency
      and pace of commercialization.
    diligencePath: >-
      Request an internal company timeline or older financing announcements that pin down early round dates, sizes, and
      milestone dates.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-isolation
    missingEvidence: >-
      A public source that isolates Deep Robotics' serviceable market in utilities and industrial inspection instead of
      broad quadruped TAM.
    whyItMatters: Without a bounded SAM or SOM, valuation can drift toward whichever analyst TAM is most flattering.
    diligencePath: >-
      Request management's segment revenue split, qualified pipeline by vertical, and any internal market study used for
      planning.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: certification-status
    missingEvidence: >-
      Direct proof of whether Deep Robotics has ATEX, IECEx, or equivalent hazardous-site certification for any current
      platform.
    whyItMatters: >-
      Hazardous-site certification determines whether Deep can compete for some of the highest-value oil and gas
      inspection budgets.
    diligencePath: Ask for certification certificates, current audit status, and customer references in hazardous facilities.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-and-tco
    missingEvidence: Current pricing, warranty, software, and service terms for Deep Robotics' X30 and Lynx platforms.
    whyItMatters: >-
      Public valuation of market adoption needs a real TCO comparison against Spot, ANYmal, and Unitree rather than
      hardware capability alone.
    diligencePath: Request live quotes, average selling price by product, and any recurring software or maintenance attachment rate.
  - type: missing-source
    severity: material
    topic: western-procurement
    missingEvidence: >-
      Primary regulatory analysis on whether Chinese-origin quadrupeds like Deep Robotics face civilian procurement
      restrictions outside defense.
    whyItMatters: Restrictions that spill from defense into infrastructure or utilities could cap high-value Western market access.
    diligencePath: Obtain export-control and public-procurement counsel review for the US, EU, and Gulf markets.
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Revenue or installed-base mix by utilities, renewables, research, emergency response, and international accounts.
    whyItMatters: >-
      Market quality is very different if sales are concentrated in lower-ticket research units instead of recurring
      industrial deployments.
    diligencePath: >-
      Ask management for customer count, ARR or service revenue mix, and top vertical concentration for the last twelve
      months.
  - type: private-evidence-only
    severity: material
    topic: deep-pricing
    missingEvidence: >-
      Current quoted pricing, software bundle terms, service package scope, and deployment economics for X30 and Lynx
      M20.
    whyItMatters: >-
      Without current pricing and service terms, peer ROI comparisons remain incomplete and public price anchors
      over-weight Boston Dynamics' historical benchmark.
    diligencePath: Request current quote sheets, support SLAs, and at least one signed deployment proposal from management.
    relatedQuestionRefs:
      - QP008
      - QP021
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: deep-hazardous-certification
    missingEvidence: >-
      A public certificate, regulator listing, or formal product document showing whether Deep Robotics holds ATEX or
      IECEx hazardous-area approval.
    whyItMatters: >-
      Hazardous-area credentials are a real trust moat in global energy inspection and materially affect the comparison
      with ANYbotics.
    diligencePath: >-
      Ask management for current certification certificates, notified-body references, or explicit confirmation that the
      products are not certified.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: deep-installed-base
    missingEvidence: Installed-base counts, renewal data, and referenceable customer list by vertical and geography.
    whyItMatters: >-
      Deep's current moat claim relies on deployment proof, so renewal and fleet-scale evidence would show whether those
      case studies are repeatable advantages or one-off showcases.
    diligencePath: >-
      Request cohort deployment history, customer retention data, and named references for utilities and overseas
      projects.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: defense-access
    missingEvidence: >-
      Primary legal or procurement guidance showing how far U.S. or allied defense procurement rules exclude
      Chinese-origin quadrupeds like Deep Robotics.
    whyItMatters: Defense TAM can make the category look larger than the realistic market actually open to Deep Robotics.
    diligencePath: Obtain export-control and procurement counsel memo tied to target geographies and contracting channels.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash balance, monthly operating burn, capex, and runway through the planned IPO window.
    whyItMatters: >-
      Without the liquidity bridge, the chapter cannot tell whether the planned IPO is strategic acceleration or a
      financing necessity.
    diligencePath: Request monthly management accounts, bank statements, and a 12-month base/downside liquidity model.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: leverage
    missingEvidence: Debt schedule, guarantees, pledged assets, leasing, and any project-finance or supplier-finance obligations.
    whyItMatters: Hidden leverage can make 2025 profitability less meaningful and can subordinate equity value if growth stalls.
    diligencePath: >-
      Request debt agreements, security packages, covenant schedule, and auditor confirmation of off-balance-sheet
      liabilities.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue shares, renewal history, public-sector exposure, and tender concentration in power-grid
      accounts.
    whyItMatters: >-
      A hardware business can look profitable while still depending on a narrow set of state-linked customers whose
      procurement cycles are lumpy.
    diligencePath: Request customer cohort data, top-10 customer list by revenue and margin, and renewal or repeat-order history.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI005
