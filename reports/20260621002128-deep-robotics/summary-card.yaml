summary:
  headline: >-
    Deep Robotics has moved beyond robotics narrative into real industrial revenue and first-time profitability, but
    private/pre-IPO status, capital intensity, and noisy valuation evidence keep the right call at track rather than
    buy.
  overallScore: 6.2
