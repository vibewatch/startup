  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention metrics
      missingEvidence: Account-level NRR, GRR, churn, renewal, utilization, and follow-on order metrics by vertical.
      whyItMatters: Without durability metrics, named deployments prove adoption but not revenue quality or customer stickiness.
      diligencePath: Request cohort retention, renewal history, and repeat-order data for utilities, security, and education accounts.
      relatedQuestionRefs:
        - QU013
        - QU014
        - QU025
    - type: missing-source
      severity: material
      topic: customer concentration
      missingEvidence: Top-customer revenue share, contract size, robot count per customer, and segment-level revenue mix.
      whyItMatters: Utility concentration could be either a moat or a concentration risk, but the public pack does not quantify it.
      diligencePath: Ask management for top-10-customer exposure, average contract value, and revenue mix by utilities, security, education, and other verticals.
    - type: enumeration-incomplete
      severity: material
      topic: named-customer roster
      missingEvidence: A fuller named roster that distinguishes current production accounts, pilots, distributor-led projects, and expired or one-off scenarios.
      whyItMatters: Broad reach claims are easy to overread when the public named-deployment ledger is partial and unevenly corroborated.
      diligencePath: Request a referenceable customer list with deployment status, start date, geography, and whether each account has placed repeat orders.
      relatedTableRefs:
        - TU003
        - TU006
    - type: private-evidence-only
      severity: material
      topic: overseas support and SLA
      missingEvidence: International service-level terms, field-support footprint, spare-parts logistics, and uptime commitments outside mainland China.
      whyItMatters: Deployment durability in critical infrastructure depends on support quality, not just robot capability.
      diligencePath: Review distributor agreements, overseas support contracts, and customer SLA decks for Singapore, the Middle East, and North America.
      relatedQuestionRefs:
        - QU016
    - type: missing-source
      severity: minor
      topic: customer voice
      missingEvidence: Independent customer interviews, satisfaction surveys, complaint databases, or procurement postmortems for named accounts.
      whyItMatters: Today the chapter relies heavily on company-curated proof outside the SP Group utility case.
      diligencePath: Seek direct customer reference calls or public procurement debriefs from utilities and public-safety buyers.
      relatedQuestionRefs:
        - QU021
        - QU022
