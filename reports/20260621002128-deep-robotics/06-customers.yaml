  - id: TU004
    title: Retention / repeat usage / support visibility table
    columns:
      - metric or proxy
      - current public reading
      - confidence
      - why it matters
      - diligence ask
    rows:
      - - NRR / GRR / churn
        - Not publicly disclosed
        - Medium
        - No direct durability metric exists in the open record
        - Request account-level retention and cohort data by major vertical
      - - Repeat deployment proxy
        - SP Group plans wider rollout after pilot; China Southern Power Grid and State Grid-linked utility narratives imply multi-site continuation
        - Medium
        - Utilities look like the best candidate for repeat usage and expansion
        - Confirm repeat-order volumes and time between first pilot and follow-on purchase
      - - Workflow embed
        - SP Group inspectors continue training SPock with defect images and simulated scenarios
        - High
        - Indicates the robot is part of an operating process rather than a shelf demo
        - Ask for utilization hours, defect-detection precision over time, and operator adoption metrics
      - - Overseas support visibility
        - Public CN after-sales terms are mainland-only, remote-diagnosis first, and often customer-shipping dependent
        - Medium
        - International durability depends on field support and SLA strength, which remain opaque
        - Request overseas service footprint, spare-parts logistics, and uptime SLAs
      - - Academic repeatability
        - Lite3 is repeatedly cited by universities and DEEP says ICRA 2026 generated more European pilot interest
        - Medium
        - Suggests a long-tail customer motion beyond utilities
        - Quantify annual education-unit sales, repeat institutions, and distributor contribution
    notes: The chapter can see repeat-use proxies, but not the revenue-quality data needed to underwrite retention confidently.
    claimRefs:
      - CU014
      - CU022
      - CU025
      - CU026
      - CU027
      - CU028
      - CU030
      - CU043
  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - risk or expansion lever
      - current evidence
      - impact
      - implication
      - diligence path
    rows:
      - - Utility vertical concentration
        - Named proof is heaviest in utilities and power-grid inspection
        - High
        - Strong PMF in one vertical can become revenue concentration if other sectors stay early
        - Request revenue mix and top-10-customer exposure by vertical
      - - International localization burden
        - Singapore deployment required months of sensor, algorithm, and navigation localization
        - Medium-High
        - New-account expansion may be services-heavy and slower than robot-unit headlines imply
        - Ask for deployment gross margin and localization labor per new site
      - - Official-only overseas proofs
        - NEOM, North America storage park, and Hoh Xil are publicized by the company with limited third-party customer validation
        - Medium
        - Expansion story is real but less bankable than SP Group
        - Ask for signed customer references and follow-on order history
      - - Regulatory or procurement friction abroad
        - 2026 U.S. legislative proposals target Chinese quadruped and humanoid robots in federal settings
        - Medium
        - Could constrain U.S. public-sector and critical-infrastructure expansion
        - Track whether Deep Robotics or its distributors are named in future rulemaking
      - - Support and data-governance diligence
        - Public terms highlight mainland-only after-sales policy and potential disclosure of operational data to authorities when required by law
        - Medium
        - Sensitive infrastructure customers may demand stronger contractual safeguards
        - Request international DPA language, audit rights, and overseas support structure
    notes: Customer upside is visible, but the biggest unresolved commercial questions are concentration, localization cost, and the true durability of international accounts.
    claimRefs:
      - CU021
      - CU027
      - CU028
      - CU029
      - CU035
      - CU036
      - CU039
      - CU040
  - id: TU006
    title: Verified deployments vs logos and unsupported customer-count claims
    columns:
      - signal type
      - example
      - what it does prove
      - what it does not prove
    rows:
      - - Independently corroborated named deployment
        - SP Group SPock tunnel inspection
        - Real operational use case, workflow detail, and outcome proxy
        - Full revenue scale, robot count, or renewal terms
      - - Named official deployment
        - China Southern Power Grid, Xining Public Security Bureau, Yiwu International Trade City, Certis
        - The company has specific named scenario references beyond a generic logo wall
        - Independent customer testimony or contract economics
      - - Drill or scenario validation
        - Zhejiang Fire Brigade joint drill
        - Product relevance in harsh real-world conditions
        - Recurring production deployment or durable customer revenue
      - - Research and education user reference
        - Tsinghua, Peking, Edinburgh, UCL, plus Tencent and Alibaba mentions around Lite3
        - Real platform adoption in education and R&D contexts
        - Production deployment depth or current spend per account
      - - Unsupported broad scale claim
        - 100+ clients, 44 countries, 600+ scenarios
        - Directional breadth and marketing reach
        - Audited run-date paying-customer count, active-account count, or concentration profile
    notes: This exhibit is the chapter's control against overreading logos and scenario counts as if they were audited customer metrics.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU020
      - CU037
      - CU038
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: Utility and security customers appear to move through a high-touch motion from problem selection to localization, operational proof, and only then wider rollout.
    data:
      items:
        - label: Identify hazardous workflow
          detail: Buyer targets inspection, patrol, or rescue tasks that are repetitive, dangerous, or coverage constrained.
          tone: positive
        - label: Pilot in a live environment
          detail: Robots enter tunnels, substations, industrial parks, or drills to prove mobility and sensing against a real workflow.
          tone: neutral
        - label: Localize hardware and software
          detail: Sensors, navigation logic, and safety rules are tuned for the site, as seen in Singapore.
          tone: warning
        - label: Operationalize with humans in loop
          detail: Operators use reports, train models with defects, and integrate patrols into existing maintenance or control workflows.
          tone: positive
        - label: Expand to multi-site or multi-role use
          detail: Wider rollout or cross-site replication becomes possible only after workflow embed and trust are established.
          tone: neutral
        - label: Retain through support and ROI
          detail: Long-term durability depends on field support, localization cost, customer economics, and procurement policy.
          tone: warning
    approximationNotes: null
    claimRefs:
      - CU002
      - CU004
      - CU026
      - CU027
      - CU039
      - CU040
