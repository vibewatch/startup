  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: Covers the best publicly named deployments and customer references found for chapter 6, separating operational deployments, drills, and official-only claims rather than attempting an exhaustive roster.
    columns:
      - customer or account
      - segment
      - deployment or use case
      - production vs pilot
      - outcome or proof quality
      - limitation
    rows:
      - - Singapore Power Group (SP Group)
        - Utility infrastructure
        - X30 SPock tunnel inspection in underground power transmission network
        - Operational pilot with wider rollout planned
        - Independently corroborated named deployment with localization details and 480-hour annual labor-saving claim
        - Contract value, robot count, and renewal terms are undisclosed
      - - China Southern Power Grid
        - Utility infrastructure
        - Quadruped deployment across nearly 30 substations for intelligent inspection
        - Production deployment
        - Official scale and ROI claims suggest meaningful domestic usage
        - Independent substation-level corroboration is limited
      - - Xining Public Security Bureau
        - Public safety
        - Autonomous patrol with loudspeaker, identification, and data collection
        - Operational deployment
        - Named government user in official Series C deployment summary
        - Public proof is mostly company-issued
      - - Yiwu International Trade City
        - Security operations
        - X30 mobile security outpost for patrol, fire-hazard detection, and anomaly warning
        - Operational deployment
        - Specific workflow description supports real use rather than a pure logo
        - No public commercial terms or customer testimony
      - - Certis industrial park, Singapore
        - Security operations
        - All-weather patrol, rule-violation warning, and charging-pile monitoring
        - Operational deployment
        - Clear operational narrative for closed-loop patrol use in Singapore
        - Evidence is a company-distributed press release, not independent customer voice
      - - Zhejiang Fire Brigade
        - Emergency response
        - Joint rescue drill combining X30 robots and drones
        - Drill / validation, not production revenue proof
        - Good evidence that the platform works in harsh rescue conditions
        - Does not prove recurring purchase or retention
      - - NEOM, Saudi Arabia
        - Extreme-environment inspection
        - Fully automated outdoor inspection system in beach conditions
        - Operational deployment claimed by company
        - Strong scenario specificity if accurate
        - Public proof is official-only and not independently validated in this run
      - - Hoh Xil conservation project
        - Environmental monitoring
        - Wildlife-monitoring robot used for Tibetan antelope observation at high altitude
        - Scenario deployment
        - Shows the robot can support specialized field use cases
        - Commercial structure and revenue significance are unknown
    notes: This table intentionally distinguishes production-like deployments from drill evidence, scenario proofs, and official-only claims.
