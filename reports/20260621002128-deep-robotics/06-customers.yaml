  - id: research-platform-users-versus-logo-claims
    title: Research and education adoption is real, but logos and reach metrics should not be overread
    body: >-
      Deep Robotics also has a second customer motion that looks very different from
      industrial inspection. Lite3 and related open platforms are positioned for
      universities, labs, and developer teams that value modularity, SDK access,
      sensor openness, and lower price points. Official and third-party sources
      repeatedly cite Tsinghua, Peking University, University of Edinburgh, and
      University College London, which is enough to treat academic adoption as real.
      References to Tencent and Alibaba are weaker: they show platform interest or
      R&D usage, not the kind of production-deployment detail that would let an
      investor infer durable enterprise revenue. The same caution applies to the
      company's large top-line reach claims. Statements like 100+ clients in 26
      Chinese provinces, 44 countries and regions, and 600+ industry scenarios are
      useful directional adoption signals, but they are not the same as a run-date
      paying-customer count, and they do not tell us how many accounts are active,
      repeat buyers, or revenue-significant. This is the chapter's main line between
      verified named proof and marketing breadth.
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
      - CU030
      - CU033
      - CU034
      - CU038
      - CU043
    tableRefs:
      - TU006
    figureRefs: []
  - id: durability-concentration-and-expansion-risk
    title: Customer durability looks promising in utilities, but retention, concentration, and policy risk remain underdisclosed
    body: >-
      The customer verdict is constructive but not fully underwritten. The positive
      read is that several deployments are clearly beyond demo-stage theater: SP
      Group operationalized SPock inside a mission-critical tunnel workflow, China
      Southern Power Grid reportedly expanded across many substations, and
      public-safety/security scenarios show that the robots can handle more than
      static inspection. The negative read is that Deep Robotics still does not
      disclose the metrics that convert usage proof into revenue-quality proof. There
      is no public NRR, GRR, churn, renewal, cohort, or top-customer revenue
      breakdown. International customer durability also depends on localization and
      support intensity: the Singapore case required months of adaptation, and the
      public mainland after-sales terms do not provide a clean picture of overseas
      SLA strength. Finally, U.S. lawmakers' 2026 push to limit Chinese-made
      quadruped and humanoid robots in federal settings is not a current Deep
      Robotics customer loss, but it is a real category-level blocker for future
      public-sector expansion in the United States.
    claimRefs:
