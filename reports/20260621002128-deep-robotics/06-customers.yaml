tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - segment
      - buyer / user / payer
      - main use case
      - best public proof
      - strategic value
      - key limitation
    rows:
      - - Utilities and grid operators
        - Utility or grid operator pays; inspection and maintenance teams use the robots in tunnels, substations, and cable galleries
        - Hazardous inspection, defect detection, first response, and digital O&M workflows
        - SP Group SPock deployment plus China Southern Power Grid and State Grid-linked inspection narratives
        - Highest-quality industrial proof and clearest ROI logic in the public pack
        - Revenue concentration by utility customer is not disclosed
      - - Public safety and security operators
        - Public-security bureau, market operator, or industrial-park security operator pays; patrol staff and control centers use the robots
        - Patrol, fire-hazard detection, early warning, and closed-loop intervention
        - Xining Public Security Bureau, Yiwu International Trade City, and Certis industrial park in Singapore
        - Shows the platform can support operational patrol workflows beyond inspection
        - Most evidence is company-issued or company-distributed rather than customer-authored
      - - Emergency response and fire-rescue teams
        - Brigade, emergency authority, or drill organizer is the likely buyer; rescue commanders and field teams are end users
        - Disaster-scene reconnaissance, toxic-gas sensing, air-ground coordination, and flood or fire drills
        - Zhejiang Fire Brigade joint drill and 2022-onward fire-emergency solution materials
        - Strong harsh-environment fit and sensor payload relevance
        - Public proof is mainly drill and scenario validation, not recurring contract disclosure
      - - Research and education buyers
        - University, lab, or R&D team pays; students, researchers, and engineers use the platforms
        - Open robotics research, autonomous navigation, reinforcement learning, and teaching labs
        - Lite3 citations naming Tsinghua, Peking, Edinburgh, and UCL
        - Diversifies the customer base and broadens volume beyond high-ASP utilities
        - Public evidence does not disclose renewal, fleet size, or revenue contribution by institution
      - - Emerging international scenario buyers
        - Customer identity varies by site; local operator or partner likely pays while field staff use the robots
        - Warehouse security, wildlife monitoring, and extreme-environment inspection
        - North America storage park, Hoh Xil conservation, and NEOM outdoor inspection system
        - Shows the product can travel across geographies and workflow types
        - These proofs are mostly official-only and thin on contract economics or independent validation
    notes: Segmentation separates buyer type and workflow because utilities, patrol/security operators, emergency organizations, and universities all buy for different jobs to be done.
    claimRefs:
