callouts:
  - calloutType: strength
    title: Singapore Power is the chapter's anchor proof
    body: SP Group is the cleanest evidence that Deep Robotics can localize a robot into a mission-critical customer workflow, with both independent corroboration and a concrete labor-savings outcome.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU018
  - calloutType: risk
    title: Reach metrics are not audited customer counts
    body: Investors should not read 100+ clients, 44 countries, or 600+ scenarios as equivalent to a current paying-customer count. Those are breadth signals, not audited active-account or concentration disclosures.
    claimRefs:
      - CU016
      - CU017
      - CU039
  - calloutType: assumption
    title: Utilities likely drive the best repeat economics
    body: The public pack implies utilities are the most durable segment because the robots get embedded into hazardous recurring workflows, but that still needs customer-level renewal and concentration data.
    claimRefs:
      - CU022
