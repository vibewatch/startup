chapter:
  number: 6
  title: Customers
  summary: Deep Robotics has real customer proof in utilities, public safety, emergency-response validation, and research/education, but the evidence tiers are uneven. The strongest named deployment is Singapore Power Group's SPock tunnel-inspection program, which is independently corroborated and includes concrete workflow and labor-savings detail; China Southern Power Grid also looks meaningful, but its scale and ROI claims remain company-reported rather than independently reconciled. The rest of the customer story mixes genuine named deployments, drill or pilot evidence, logo-style references, and broad reach claims such as 100+ clients, 44 countries, and 600+ scenarios that should not be treated as audited paying-customer counts. Retention, concentration, and international after-sales visibility remain the main diligence gaps.
sections:
  - id: customer-segmentation-and-evidence-tiers
    title: Customer segments are real, but the evidence quality differs sharply by vertical
    body: Deep Robotics is not selling to one monolithic buyer class. The public record supports at least four practical customer buckets. First, utilities and grid operators buy quadrupeds and wheel-legged robots for tunnel, substation, cable-gallery, and hazardous-inspection work; this is where the company has the most concrete named proof and the clearest operating outcomes. Second, public-safety and security buyers use robots for patrol, fire-hazard detection, perimeter monitoring, and incident response, with named references including Xining Public Security Bureau, Yiwu International Trade City, and Singapore's Certis industrial park. Third, emergency-response organizations and fire brigades appear in drills and scenario validation, which proves product-market fit for harsh environments but does not necessarily prove recurring revenue. Fourth, universities and research labs use Lite3 and related open platforms as education and R&D tools. The key diligence distinction is not whether these segments exist, but which are evidenced by independently corroborated operational deployment versus company-curated examples, partner-like showcases, or logo-and-reach marketing.
    claimRefs:
      - CU001
      - CU002
      - CU010
      - CU014
      - CU021
      - CU032
      - CU038
      - CU040
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: named-deployments-and-adoption-proof
    title: Named customer proof is strongest in utilities, with Singapore Power as the anchor case
    body: >-
      The best-supported customer proof is Singapore Power Group. Across the official
      SPock case study and multiple independent trade articles, the same core story
      holds: X30 patrols sections of SP Group's underground power transmission tunnel
      network, performs thermal and visual inspection tasks, required site-specific
      localization work, and is expected to save roughly 480 manual inspection hours
      per year if rollout expands. China Southern Power Grid is the next-most-important
      named account because Deep Robotics says its robots now serve nearly 30
      substations with meaningful cost and efficiency improvement, but that scale is
      still disclosed through company materials rather than customer filings. A
      broader State Grid relationship is plausible and increasingly important,
      especially given 2026 utility procurement plans and Jiemian's report of a prior
      framework agreement, yet those signals still sit one level below SP Group in
      proof quality. Outside utilities, named deployments exist in security,
      conservation, warehousing, and Saudi outdoor inspection, but most of them
      remain official-only proofs with less disclosed commercial depth.
