  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-and-governance-disclosure
    missingEvidence: A current board roster, independent-director list, and detailed executive lineup after the 2025 shareholding reform.
    whyItMatters: Late-stage private governance quality affects underwriting confidence, succession planning, and IPO readiness.
    diligencePath: Request current board materials, shareholder resolutions from the reform, and a management-prepared organization chart.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: lifetime-capital-and-cap-table
    missingEvidence: A round-by-round financing schedule with exact amounts, ownership percentages, option pool, and any secondary sales.
    whyItMatters: The IPO story and current valuation cannot be underwritten cleanly without knowing the cumulative capital base and dilution history.
    diligencePath: Request the cap table, financing documents, and a management-prepared funding history bridge from angel through pre-IPO.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financial-disclosure
    missingEvidence: Audited 2024 revenue, gross margin, operating-loss or profit, cash burn, and balance-sheet detail.
    whyItMatters: Management commentary implies momentum and possible breakeven, but investment judgment needs audited numbers rather than quotes.
    diligencePath: Request audited financial statements or IPO-prep financial schedules with revenue mix, gross margin, and cash-flow detail.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO027
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: formal-ipo-status
    missingEvidence: Primary CSRC or exchange documentation confirming whether tutoring is completed and whether a formal prospectus has been submitted.
    whyItMatters: The difference between tutoring, filing readiness, and an actual prospectus submission changes both timing and risk for the listing path.
    diligencePath: Monitor CSRC and target-exchange filings directly and ask counsel for the latest listing workplan and blocker list.
    relatedQuestionRefs:
    - QO009
    - QO010
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: early-funding-and-milestone-precision
    missingEvidence: Exact dates and sizes for the Series A, Series A+, and some early product milestones before 2022.
    whyItMatters: The broad chronology is credible, but missing early precision limits longitudinal analysis of capital efficiency and pace of commercialization.
    diligencePath: Request an internal company timeline or older financing announcements that pin down early round dates, sizes, and milestone dates.
    relatedQuestionRefs:
    - QO015
    - QO025
    relatedTableRefs:
    - TO004
