company:
  name: Deep Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Deep Robotics is a Hangzhou-based private legged-robotics company founded in November 2017 by Zhejiang University researchers Zhu Qiuguo and Li Chao. By June 2026 it has built a credible industrial foothold in quadruped robots, expanded into wheeled-legged and humanoid products, completed shareholding reform, and entered China's IPO tutoring process, but the public record still leaves major gaps around board composition, exact lifetime capital raised, and audited financial disclosure.
sections:
- id: identity-stage-and-business-model
  title: Identity, stage, and business model
  body: 'Deep Robotics presents itself as an embodied-AI robotics company built around hazardous and industrial use cases rather than a consumer robotics story. Official materials describe a Hangzhou-based high-tech enterprise focused on quadruped robots, humanoid robots, and core robotic components, with a full-stack “Perception–Decision–Execution” framework aimed at energy, emergency response, industrial operations, and education. Independent reporting lines up with that framing: the company was founded in November 2017, remains private, and is now best understood as a late-private, pre-IPO industrial robotics company rather than an early research spinout. The business model visible in the public pack is hardware-and-solution sales into inspection, rescue, logistics, and research scenarios, with later humanoid work layered on top of an already commercial quadruped base. The core diligence caveat is disclosure depth. Basic identity and product scope are clear, but audited financials, current
    customer count, and a precise lifetime capital tally are still not publicly reconciled.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO007
  - CO041
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-public-leadership-and-governance
  title: Founders, public leadership bench, and governance visibility
  body: The founding story is a genuine part of the underwriting case because Deep Robotics still looks founder-led in both technology direction and public narrative. Zhu Qiuguo and Li Chao came from the Zhejiang University robotics ecosystem, and public interviews portray Zhu as the strategic, commercial, and mission-setting voice while Li covers technical commercialization, industrial applicability, and sector positioning. That founder-market fit is reinforced by Zhu’s associate-professor role and the company’s repeated claims of full-stack self-development, patent depth, and industrial deployment discipline. What is less reassuring is the thin public governance layer outside the founders. Reviewed sources name several public-facing operators—such as product and overseas-sales leads—but do not provide a clean board roster, independent-director list, or a fully itemized post-reform executive lineup. That means leadership depth is visible mainly through public spokespeople and customer-facing
    operators rather than through a standard late-stage governance disclosure package.
  claimRefs:
  - CO003
  - CO004
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
  tableRefs:
  - TO002
- id: capital-base-private-status-and-stakeholders
  title: Capital base, private status, and stakeholder map
  body: 'Deep Robotics’ financing story is substantial, but not yet fully disclosure-grade. Public reporting supports a clear sequence of recent financings: a nearly CNY500 million pre-Series C round in July 2025, a more than CNY500 million Series C in December 2025, and an early-2026 pre-IPO round described only as hundreds of millions of renminbi. The company also completed a November 2025 shareholding reform into a non-listed joint-stock company and then filed for IPO tutoring on December 23, 2025 after signing its advisory package on December 8. Taken together, those steps strongly support the view that the company is still private but actively preparing for a mainland listing. The public record also supports a media-reported valuation around CNY8 billion, but not a prospectus-grade ownership picture. Exact lifetime capital raised, debt or credit exposure, and any secondary-sale history remain unresolved, so investors can understand momentum and funding direction but not yet reconstruct
    a clean cap-table or mark history from public documents alone.'
  claimRefs:
