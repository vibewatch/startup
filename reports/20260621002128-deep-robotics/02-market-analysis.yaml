- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - China robotics policy and low robot density
    - Positive
    - Current to long-term
    - Expands domestic automation appetite and legitimizes inspection robotics pilots
    - How much of this demand reaches mobile inspection versus factory robots?
  - - Safety pressure on hazardous inspections
    - Positive
    - Current
    - Lets payers justify robots on injury avoidance as well as labor efficiency
    - Which buyer actually owns the safety budget in target accounts?
  - - Measured inspection ROI
    - Positive
    - Current
    - Deep and market reports both frame meaningful efficiency gains from autonomous inspections
    - Are those gains durable outside company-authored case studies?
  - - Hazardous-site certification barrier
    - Negative
    - Current
    - ATEX and IECEx requirements can exclude uncertified robots from high-value oil and gas sites
    - Does Deep have any verifiable certification roadmap?
  - - Autonomy still needs human support
    - Negative
    - Current
    - Manual operation and secondary development raise total cost and slow rollout
    - How much engineering effort is required after purchase?
  - - Manufacturing and reliability scaling risk
    - Negative
    - Current to medium-term
    - Prototype success does not guarantee consistent field uptime at fleet scale
    - What warranty, MTBF, or fleet-retention data exists?
  - - Hardware-plus-software enterprise spend
    - Mixed
    - Current
    - Fleet orchestration and analysis software increase budget size but can raise stickiness
    - Does Deep monetize recurring software today?
  - - Regional procurement restrictions
    - Negative
    - Current
    - Defense and protected channels are structurally harder for Chinese vendors to enter
    - Which civilian markets could face spillover restrictions?
  notes: The biggest valuation swing factor is whether Deep can pair hardware proof with certification, software, and fleet reliability, not whether robots are technically possible.
