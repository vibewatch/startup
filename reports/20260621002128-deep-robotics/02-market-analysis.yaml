  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-isolation
    missingEvidence: A public source that isolates Deep Robotics' serviceable market in utilities and industrial inspection instead of broad quadruped TAM.
    whyItMatters: Without a bounded SAM or SOM, valuation can drift toward whichever analyst TAM is most flattering.
    diligencePath: Request management's segment revenue split, qualified pipeline by vertical, and any internal market study used for planning.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: certification-status
    missingEvidence: Direct proof of whether Deep Robotics has ATEX, IECEx, or equivalent hazardous-site certification for any current platform.
    whyItMatters: Hazardous-site certification determines whether Deep can compete for some of the highest-value oil and gas inspection budgets.
    diligencePath: Ask for certification certificates, current audit status, and customer references in hazardous facilities.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-and-tco
    missingEvidence: Current pricing, warranty, software, and service terms for Deep Robotics' X30 and Lynx platforms.
    whyItMatters: Public valuation of market adoption needs a real TCO comparison against Spot, ANYmal, and Unitree rather than hardware capability alone.
    diligencePath: Request live quotes, average selling price by product, and any recurring software or maintenance attachment rate.
  - type: missing-source
    severity: material
    topic: western-procurement
    missingEvidence: Primary regulatory analysis on whether Chinese-origin quadrupeds like Deep Robotics face civilian procurement restrictions outside defense.
    whyItMatters: Restrictions that spill from defense into infrastructure or utilities could cap high-value Western market access.
    diligencePath: Obtain export-control and public-procurement counsel review for the US, EU, and Gulf markets.
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Revenue or installed-base mix by utilities, renewables, research, emergency response, and international accounts.
    whyItMatters: Market quality is very different if sales are concentrated in lower-ticket research units instead of recurring industrial deployments.
    diligencePath: Ask management for customer count, ARR or service revenue mix, and top vertical concentration for the last twelve months.
