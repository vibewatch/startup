- id: sizing-lenses-and-contradictory-estimates
  title: Sizing Lenses and Contradictory Estimates
  body: 'The public corpus does not support one clean headline TAM for Deep Robotics. The best broad market data comes from quadruped-market reports, but those estimates diverge materially. Precedence projects USD 3.71 billion in 2026 and USD 17.53 billion by 2035, while Emergen starts from USD 1.2 billion in 2024 and reaches only USD 4.8 billion by 2034. The contradiction does not mean the market is fake; it means category definitions differ, especially around whether defense, logistics, research, and inspection are bundled together. Deep Robotics therefore has to be sized through multiple lenses: the broad quadruped TAM, China''s huge robot-installation base and policy support, and the narrower evidence-backed slice where utilities and industrial operators are already deploying inspection robots. Investors should treat the gap between broad TAM and reachable SAM as a core diligence issue, not as a rounding error. That gap is valuation-relevant because different publishers can make the
    same company look niche or huge.'
  claimRefs:
