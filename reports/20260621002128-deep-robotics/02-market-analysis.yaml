company:
  name: Deep Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Deep Robotics participates in a real but easily overstated market: not all quadruped robotics, but the narrower slice of industrial inspection and adjacent field operations where legged mobility beats manual patrols, drones, or purely wheeled robots. Public market estimates diverge sharply, buyers split by utility, hazardous-industry, defense, and research budgets, and adoption depends as much on certification, software, and deployment proof as on robot hardware itself.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Deep Robotics should not be valued against the whole robotics economy or even the whole quadruped category. The company''s own public evidence is much narrower: industrial inspection, underground navigation, emergency response, and research deployments anchored in hard-to-access environments. That boundary implies included spend around mobile inspection hardware, payloads, autonomy software, and deployment services for utilities and industrial operators. It also implies explicit exclusions. Defense-only UGV programs, consumer quadrupeds, fixed sensors, and drone-only budgets belong in adjacent or substitute pools, not in a Deep-specific TAM story. This distinction matters because the status quo is not empty; manual patrols, wheeled robots, fixed sensing, and drones already cover many inspection jobs. Deep Robotics only wins when stairs, confined spaces, irregular terrain, or contact-rich sensing make legged mobility materially better than those substitutes.'
