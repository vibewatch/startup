    {
      "id": "operations-and-dependencies",
      "title": "Operational proof is credible, but it is concentrated in customized utility deployments that depend on partners, trust, and field execution",
      "body": "Deep has stronger real-world operational evidence than many robotics startups. The public record shows a technically capable inspection platform: X30 is ruggedized for harsh environments, the substation case claims meaningful accuracy and labor savings, and the Singapore SPock deployment moved beyond demo language into a live tunnel patrol workflow with measurable time savings. That matters because it proves the company can solve expensive inspection problems in real infrastructure rather than simply shipping research hardware. However, the same evidence also reveals the operational risk profile. Deep's best references are customized utility and substation deployments that require route mapping, localization, software refinement, and tight workflow integration. The foreign flagship in Singapore required months of safety assessment and local tuning, which is exactly what an investor wants to see from a serious deployment but also exactly what makes expansion service-heavy and harder to scale than pure hardware revenue.\n\nPublic proof is also concentrated. State-linked and utility-style accounts dominate the named reference set, and even the strongest overseas proof is still a partner-enabled pilot rather than a broad cohort of repeat deployments across multiple private operators. That concentration is amplified by dependency risk. Overseas delivery already relies on partners such as EGP, while high-trust hazardous inspection channels are being locked down by competitors with stronger certifications and industrial-software alliances. A further operational complication is cyber trust: the sector now faces customer skepticism about Chinese-origin robots in data-sensitive sites, especially after peer hardware-security concerns surfaced. Put simply, Deep's current moat is deployment know-how in harsh utility environments, but that moat is only as strong as its service bench, partner quality, and ability to clear customer trust screens account by account.",
