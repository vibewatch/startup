    "number": 7,
    "title": "Risks",
    "summary": "Deep Robotics' risk profile is dominated by three coupled constraints: national-origin screening that can cap overseas public-sector and critical-infrastructure demand, a concentrated utility-heavy proof set that is expensive to replicate internationally, and a financing model that now has to carry humanoid and manufacturing expansion on top of a newly profitable quadruped base. The company has real operational traction, but the thesis breaks quickly if certification, diversification, and capital discipline do not mature as fast as product scope does."
  },
  "sections": [
    {
      "id": "regulatory-legal-screening",
      "title": "Regulatory and legal risk is now a real market-access constraint, not just a theoretical geopolitical overhang",
      "body": "Deep Robotics' most serious external risk is not a single export ban already aimed at the company; it is the widening lattice of U.S. procurement, supply-chain, and technology-control rules that can narrow addressable markets before a direct designation ever arrives. The FY2025 NDAA is especially relevant because it covers the exact components and system types Deep markets: LiDAR-dependent inspection systems and unmanned ground vehicles from covered foreign countries. At the same time, the June 2026 1260H notice shows that a close quadruped peer, Unitree, has already crossed from abstract scrutiny into formal U.S. military-company designation. Deep's own positioning compounds the exposure. Its official materials repeatedly target substations, tunnels, gas detection, emergency response, and public-safety workflows, which are precisely the kinds of environments where public buyers, defense-adjacent contractors, and critical-infrastructure operators apply elevated supplier screening.\n\nThe practical implication is that Deep should be underwritten as a company whose best overseas opportunities are civilian industrial accounts willing to localize around Chinese hardware, not as a vendor with frictionless access to Western public-sector or defense budgets. A second legal-commercial constraint is certification. ANYbotics now advertises ATEX/IECEx Zone 1 readiness with Yokogawa-backed channel support into energy and hazardous industries, while the retained Deep public pack shows optional explosion-proof sensing but not a system-level certificate. That does not disqualify Deep from utilities and tunnels, where it already has strong proof, but it does create a clear boundary around the most demanding hazardous-process environments. The right diligence stance is therefore to assume regulation and certification will shape product-market fit, channel design, and valuation simultaneously rather than treating them as downstream compliance tasks.",
