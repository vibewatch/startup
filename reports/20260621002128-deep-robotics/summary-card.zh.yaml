  topStrengths:
    - 2025 年公开申报摘要显示商业化已成立：收入 RMB 337 million、首次盈利、毛利率 52.83%，不再只是原型机故事。
    - 公司已拼出覆盖四足、轮足机器人和早期人形产品的多产品栈，最清晰的落地证据来自电力巡检和 Singapore Power 隧道作业流。
    - Deep Robotics 已完成股改、辅导并获得 STAR Market 申报受理，同时仍有国内战略投资者支持，退出准备度好于多数私有机器人同行。
  topRisks:
    - 公开估值证据不一致，且高于纪律性低十亿美元区间后显得偏紧：late-2025 私募标记、2026 媒体标记和更高的 $3.5 billion IPO 标题同时流传。
    - 下一阶段仍很吃资本；拟募资 RMB 2.503 billion 将投向具身 AI 研发、机器人本体、产业化和制造扩张。
    - 收入质量披露仍不足：现金、烧钱速度、客户集中度、实际折扣、经常性服务占比、保修负担和复购队列都未公开。
    - 竞争、认证和地缘政治压力可能压缩利润率或 TAM，尤其是在价格 / 性能上面对 Unitree、在海外关键基础设施市场落地时。
  unresolvedGaps:
    - 完整股权结构表、清算优先权、VAM 或特殊权利条款，以及 IPO 进程延后时这些权利如何生效
    - 客户集中度、复购队列、服务附加、保修负担，以及按产品线拆分的实际折扣
    - 现金、月度烧钱速度、营运资金需求，以及现金跑道相对于计划 STAR Market 募资时间和确定性的情况
    - 已具名多台人形机器人商业化案例，以及系统级危险场景或安全 / 合规认证
