      - number: '5.2'
        title: 核心架构是从感知到执行的全栈系统，最具体的公开证据在开发者栈
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 最可信的技术主张，不是某个单一速度或载荷数字，而是公司通过产品页面、GitHub 仓库和 2025 年后续公告展现出的栈一致性。公司介绍和 Series C
              发布使用同一套「感知—决策—行动」框架，DeepVLA 1.0
              则加入更明确的软件层：开放词汇语义点云、大语言模型命令解析，以及用于多楼层门到门导航的拓扑路网。硬件侧，公开页面呈现出一致模式：多模态感知、机载计算、模块化载荷安装和加固型运动能力。Lynx M20
              是最清楚的例子，因为其官方页面把双工业处理器、双 96 线 LiDAR、双广角相机、Ethernet、热插拔电池和 OTA 升级放在同一个 SKU 中发布。

              开发者表面强于许多未上市机器人公司。DeepRoboticsLab 发布 MJCF/URDF/USD 机器人模型、基于 IsaacLab 的 Lite3 和 M20 强化学习环境、ROS2 部署 SDK，以及
              J60 模块的 CAN 级关节控制。美国站上的 Lite3 文档走得更远，描述了 ROS1/ROS2 支持、Motion SDK 访问、LiDAR SLAM 示例、基于 Jetson 的感知主机，以及
              sim-to-real 强化学习工作流。这对尽调很重要，因为它把产品从封闭设备变成客户、大学和集成商可以扩展的平台。限制在于范围：开放生态在 Lite3 和较新平台上最深，X20/X30/DR02
              则更多停留在营销页面可见，而不是 SDK 可见。
