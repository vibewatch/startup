        - 如果上市首年定价能维持，新轮足产品有望具备吸引力。
        - 说明 2025 年是否包含上市补贴或异常有利的产品组合。
      - - 变电站部署 ROI 代理指标
        - 一个官方案例显示，人工工作量削减 >50%，运营成本约下降 70%
        - 中
        - 客户 ROI 是判断回本和复购的最佳公开代理指标。
        - 提供已签署的回本模型和实际合同续约数据。
      - - 巡检效率代理指标
        - 全站巡检不到 35 分钟，人工超过 1 小时；准确率 98%
        - 中
        - 效率和准确率提升可支撑危险场景中的溢价定价。
        - 提供部署前后工时、避免停机时间和缺陷预防经济性。
      - - 海外劳动力套利信号
        - 新加坡部署预计每年节省 >480 个人工小时
        - 中
        - 劳动力成本高的市场具备国际付费意愿。
        - 提供分国家 ROI 和本地支持成本结构。
      - - CAC、回本期、NRR 和流失率
        - 未公开披露
        - 低
        - 这些指标决定毛利能否转化为高效增长。
        - 按细分市场提交 cohort 数据、续约曲线和销售效率指标。
