  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险现在是真实的市场准入约束，而不只是理论上的地缘政治阴影
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 最严峻的外部风险，不是某一条已经点名公司的出口禁令，而是美国采购、供应链和技术管制规则越织越密， 在直接列名出现之前就可能压窄可服务市场。FY2025 NDAA
              尤其关键，因为它覆盖的正是 Deep 对外销售的组件和系统类型： 依赖 LiDAR 的巡检系统，以及来自受覆盖外国国家的无人地面车辆。与此同时，2026 年 6 月的 1260H 通知显示， 四足机器人近邻
              Unitree 已经从抽象审查进入美国军事企业正式认定。Deep 自身定位又放大了敞口。官方材料反复瞄准变电站、
              隧道、气体检测、应急响应和公共安全流程，而这些场景恰恰是公共买家、国防相邻承包商和关键基础设施运营方提高供应商筛查的地方。


              实际含义是，承销 Deep 时应把它看作一家海外最佳机会来自民用工业客户的公司，这些客户愿意围绕中国硬件做本地化；
              不能把它看成能无摩擦进入西方公共部门或国防预算的供应商。第二个法律与商业约束是认证。ANYbotics 现在宣传已具备 ATEX/IECEx Zone 1 准入，并借助 Yokogawa
              渠道进入能源和危险行业；保留的 Deep 公开资料显示其可选防爆传感， 但没有系统级证书。这并不排除 Deep 进入公用事业和隧道场景，它在这些场景已经有强证明；但在要求最高的危险流程环境里，
              这划出了一条清晰边界。因此，正确的尽调姿态是默认监管和认证会同时塑造产品市场契合度、渠道设计和估值，而不是把它们当成下游合规任务。
