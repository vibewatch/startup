      - number: '3.4'
        title: 护城河持久性和反向证据
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是说 Deep Robotics 弱，而是说这个品类越来越难防守。Gasgoo 2026 年 1 月对 MirrorMe Apollo
              发布的报道，是最重要的反证信号，因为它认为，稳定制造和单点创新本身已不再构成持久护城河；真正重要的是迭代与工业验证之间的反馈循环。这一点与 Deep
              相关，因为它今天最好的差异化恰恰是公用事业里的部署反馈循环，而不是公开可见的认证、软件或采购垄断。Unitree 可以从下方用灵活硬件和低端可及性施压，ANYbotics
              可以从上方用危险区域信任和全球能源参考案例施压，Boston Dynamics 也能继续定义软件驱动巡检的高端标杆。同时，Ghost Robotics
              显示，美国国家安全采购这一大需求池，无论技术优劣，可能仍相对不向中国来源供应商开放。因此，Deep 的轮足 Lynx
              应对在战略上是正面的：它说明公司在适应现场现实，而不是过度押注单一运动形态。尽管如此，未解决事项对尽调很重要：当前公开定价、装机基础透明度、ATEX/IECEx
              状态，以及公司的海外活动有多少是可重复的渠道增长，多少只是展示驱动的市场进入。
