      - number: '5.4'
        title: 从四足机器人走向具身导航和人形机器人的路线图可信，但核心巡检之外的商业化证据很快变薄
        blocks:
          - type: paragraph
            body: >-
              官方表面的 2025 年路线图显示的是真实出货进展，而不是模糊的未来承诺。Deep Robotics 在 4 月发布 Lynx M20，年中扩展公用事业和救援案例研究，10 月发布 DR02
              作为工业人形机器人，并在 12 月 Series C 公告中把产品、DeepVLA 1.0 和具身 AI
              试产基地串成一个扩张叙事。同一公告还称，新资本将投入更多研发、更多人才，以及持续的四足机器人加人形机器人开发，这意味着公司并不把人形机器人视为副业。

              主要技术风险不是机器人能否移动，而是 Deep Robotics 能否把强运动和感知基础转化成可持续、可支持、可治理，并能跨多个地区和产品家族量产的系统。在这方面，DR02
              仍处早期：公开证据集中在产品页面和展会演示，而不是具名生产部署或公开 SDK。DeepVLA 1.0
              具有战略重要性，但已审阅语料仍主要把它呈现为公司声称的使能层，而不是公开基准测试过的现场系统。并且，虽然公司显然在思考机器狗、无人机和固定传感器的集群作业，开源和公开文档对 Lite3 和 M20
              的支撑明显强于整个商用机队。因此，技术论点是正面的，但尽调至少应像审运动能力一样，严格承销可支持性、数据治理和部署可重复性。
