chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段和商业模式
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 把自己定位成一家围绕危险和工业场景打造的具身 AI
              机器人公司，而不是消费机器人故事。官方材料称，公司是总部位于杭州的高科技企业，聚焦四足机器人、人形机器人和机器人核心部件，采用全栈「感知—决策—执行」框架，面向能源、应急响应、工业运营和教育。独立报道与这一叙事一致：公司成立于
              2017 年 11 月，仍未上市；现在更适合被理解为一家接近 IPO
              的晚期未上市工业机器人公司，而不是早期科研衍生项目。公开资料里可见的商业模式，是向巡检、救援、物流和科研场景销售硬件和解决方案，并在已商业化的四足机器人基础上叠加后续人形机器人工作。核心尽调提醒是披露深度。基本身份和产品范围已经清楚，但审计财务、当前客户数和精确累计融资额仍未在公开口径中核清。
