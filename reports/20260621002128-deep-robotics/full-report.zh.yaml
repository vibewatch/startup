      - number: '5.3'
        title: 部署证据在公用事业巡检中最强，但信任和支持控制落后于运动能力叙事
        blocks:
          - type: paragraph
            body: >-
              当工作流狭窄、重复且危险时，产品最容易被相信。公用事业和隧道巡检符合这个模式，已审阅案例显示 Deep Robotics
              反复围绕地形进入、数据采集和减少人员暴露来销售。对一家未上市机器人厂商来说，变电站证据异常具体：官方页面声称覆盖近 30 座 China Southern Power Grid 变电站，成本降低约
              70%，效率提升超过 50%，巡检检测准确率超过 95%，并在宁夏沙漠部署中达到 96.5% 识别准确率。Singapore Power 的 SPock 部署给出第二个、更国际化的工作流证据点：X30 巡逻一条
              40 km 电力隧道，检测渗漏和热异常，并触发了更大规模部署计划。

              信任和质量信号真实存在，但不均匀。硬件加固很具体，工业线具有 IP66 或 IP67 等级，DR02
              的模块化快拆设计也被明确定位为运维特性。与此同时，除防护等级和可靠性营销主张外，公开合规证据很薄。支持和隐私页面制造了真实尽调旗帜：售后条款仅面向中国大陆，恶劣环境和未授权改装的保修排除很宽，隐私政策允许收集日志、时间、位置、设备配置和
              IP 数据，并在法律要求时向主管机关披露。换句话说，运动栈看起来比公开信任、安全和全球支持包走得更远。
