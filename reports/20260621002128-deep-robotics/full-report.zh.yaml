          label: 仍未上市
          detail: 辅导完成且申报获受理，但尚未挂牌。
        - id: n2
          label: 2025 真实验证
          detail: 收入人民币 3.37 亿元，首次盈利，毛利率 52.83%。
        - id: n3
          label: 工业楔子
          detail: 公用事业和巡检部署具备商业可信度。
        - id: n4
          label: 估值噪音
          detail: 公开估值从约人民币 80 亿元到约 $3.5bn 的头条数字不等。
        - id: n5
          label: 股权结构风险
          detail: VAM 和优先权细节尚未完全公开。
