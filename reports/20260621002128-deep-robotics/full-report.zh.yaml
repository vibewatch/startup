      - number: '4.4'
        title: 财务结论：商业上可信的工业机器人生意，但还不是完整、可尽调闭环的案例
        blocks:
          - type: paragraph
            body: >-
              正面逻辑对一家未上市机器人公司来说异常具体。Deep Robotics 现在有招股书支撑的收入、产品级 ASP 披露、改善中的毛利率、首次盈利、可见海外收入，以及真实基础设施场景里的客户 ROI
              故事。这些信号不小：它们把公司和那些仍几乎完全依赖演示、科研销售或叙事融资的机器人厂商区分开。

              负面逻辑在于，剩余盲点恰好决定 2025 年盈利能否复利。公开来源没有披露现金余额、月度烧钱速度、债务额度、营运资本压力、backlog
              质量、按收入划分的客户集中度、实际折扣，或服务与保修经济性。反向市场来源还提醒，人形机器人竞赛正在变成资金储备之战；管理层自身也强调价格压力和人才挖角。因此，本章结论是平衡的：Deep Robotics
              今天看起来像一家拥有可防守需求的真实工业硬件公司，但前瞻承销仍取决于流动性、集中度，以及利润率能否撑过从四足机器人转向更重资本人形项目的私人证据。
