      - number: '4.3'
        title: 2025 年盈利是真实的，但人形机器人扩张和制造规模仍让融资依赖成为核心
        blocks:
          - type: paragraph
            body: >-
              相比大多数未上市机器人公司，Deep Robotics 进入本章时已经有更好的公开财务证据。2025 年申报摘要显示，公司首次盈利，毛利率为
              52.83%，海外收入贡献也有分量。近期私募融资看起来同样可观：2025 年 7 月约人民币 5 亿元，2025 年 12 月超过人民币 5 亿元，以及 2026 年初据报道单独完成的数亿元 pre-IPO
              轮。截至运行日，公司仍未上市，但科创板申请已获受理，计划 IPO 将募集约人民币 25.03 亿元，用于具身 AI 模型、新机器人本体、产业化和基地建设。

              承销问题不是 Deep Robotics 能否融资，而是当前利润率能否在没有新资本、也没有有利产品组合的情况下持续。公开报道反复把下一阶段增长与人形机器人研发、制造扩张和持续招人绑定。基于招股书的报道称，2025
              年研发已消耗人民币 8430 万元，约占收入 25%；公司自身也提示，快速技术迭代可能导致盈利波动。由于手头现金、烧钱速度、债务和现金跑道仍未披露，更稳妥的结论是，2025
              年利润证明了工业四足机器人的可行性，但并没有消除未来融资依赖。
