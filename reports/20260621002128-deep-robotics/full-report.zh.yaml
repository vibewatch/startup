    rows:
      - - 投资论点
        - Deep Robotics 已经证明，工业四足能在危险环境中创造真实收入、真实利润和真实部署 ROI。
        - 披露复购队列、服务附着和客户集中度数据，证明 2025 年不是一次性利润率尖峰。
      - - 投资论点
        - 公司比多数机器人初创企业更接近流动性，因为辅导已经完成，STAR Market 申请也已获受理。
        - 提供最终审批里程碑、承销商价格指引，以及上市后流通盘 / 流动性假设。
      - - 投资论点
        - 如果 2026 年执行继续强劲，工业证明叠加早期人形可选性，可以支撑较普通硬件可比公司的溢价。
        - 展示多台人形销售，而不只是单笔高 ASP 证明交易，同时维持高毛利率。
      - - 反论点
        - 公开估值证据不一致，可能混杂了私募估值、媒体预期和上市后愿景式结果。
        - 发布更收敛的当前投后估值参考，或有投行背书的定价区间。
      - - 反论点
        - 在人形商业化和软件变现上，Deep Robotics 仍明显早于估值最高的机器人可比公司。
        - 证明人形、软件或服务能对经常性经济产生实质贡献，而不只是贡献故事价值。
      - - 反论点
        - 地缘政治和市场准入风险意味着，中国工业机器人发行人相对西方或已上市中国同业可能应该折价，而不是溢价。
        - 提供在地缘政治不那么敏感的渠道中，海外企业需求具备韧性的证据，并说明出口算力韧性。
