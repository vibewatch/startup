      - number: '2.3'
        title: 买方、用户、付款方和区域滩头
        blocks:
          - type: paragraph
            body: >-
              证据最充分的近期买方是公用事业和能源基础设施运营商，而不是泛泛的「企业」桶。Deep Robotics
              自己的案例研究指向变电站、风电场、特高压资产和新加坡电力隧道，这意味着用户包括维护人员、现场巡检员和运营团队。不过，付款方或赞助方更可能是掌握维护、安全和自动化预算的电网运营商、工厂业主或工业运营职能。科研和教育买家遵循另一套逻辑：他们更在意可负担性和实验空间，而不是认证后的正常运行时间。竞争证据进一步把图像拉清楚。ANYbotics
              面向危险工业运营商，并在油气领域拥有认证和渠道优势；Ghost 主要服务防务机构；Unitree 则显示中国厂商正在向公用事业巡检收敛，同时也覆盖低成本科研需求。因此，Deep
              的公开滩头在能源基础设施最强，中国和周边亚洲的证据强于西方。这个分裂也影响销售动作：公用事业账户需要现场集成和采购耐心，科研买家成交更快，但合同金额小得多。
