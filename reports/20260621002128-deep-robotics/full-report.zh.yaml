        - 一笔 DR02 销售不能证明商业可复制。
        - 要求提供试点经济性、部署成本和人形机器人的目标毛利爬坡。
    notes: 要把积极的商业叙事变成经完整尽调的财务承销案例，至少需要补齐这些私有数据。
