      - number: '7.4'
        title: 人才与执行风险卡在组织宽度：如果 Deep 不能像加产品一样快速补上合规、服务和资本纪律，投资逻辑就会断裂
        blocks:
          - type: paragraph
            body: >-
              Deep 的执行挑战不止产品工程。公司材料把它描述成一家全栈机器人组织，横跨核心部件、四足机器人、人形机器人、制造、销售和服务。
              这种宽度是战略抱负，也是人才和控制问题，因为公司必须同时扩张合规、现场支持、认证工作、伙伴管理和资本配置。 目前最强的证据仍落在公用事业和严苛巡检路线里的工业四足机器人。Deep
              越是从这条主线走向国际渠道建设、危险行业认证和人形机器人商业化， 瓶颈就越会从技术可能性转向管理带宽。


              因此，最有用的投资人框架是触发器驱动。有些风险如果保持有边界就可管理：只要客户多元化改善，服务密集型海外铺开可以接受； 只要四足机器人毛利健康、融资通道保持打开，人形机器人扩张可以接受；只要 Deep
              聚焦于本地部署和民用流程已经足够的市场， 国别来源筛查也可以容忍。但如果这些缓释措施没有成熟，投资逻辑就会断裂。杀伤条件并不玄妙，而是具体事件：
              没有认证路径、电力公用事业之外没有多元化、价格压力下毛利率可见下滑，或在研发强度仍高时 IPO 和融资延迟。
              在管理层证明组织能像工业化机器人本体一样快速工业化控制体系和渠道之前，执行风险都应被视为支撑估值的关键约束之一。
