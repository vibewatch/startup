  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Deep Robotics 已深度进入 IPO 流程，但仍是私有公司，估值记录依旧嘈杂
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 已不再是寻找第一场市场定价事件的概念期机器人初创公司。截至本次报告日，公司已经完成 IPO 辅导， STAR Market
              申请已获受理，招股书摘要也在多家中英文媒体流传。这很重要，因为它给投资人的运营证据，远多于多数私有机器人公司。 同时，上述步骤都不等于公司已经上市。截至 2026-06-21，Deep Robotics
              仍处于上市前状态：私有、申报推进中， 真正流动性还取决于最终审核、定价和市场窗口。因此，估值线索是混杂的，不是干净的。Caixin 在 2025 年 12 月把公司描述为约人民币 80 亿元； Humanoids
              Daily 随后称业务估值超过人民币 100 亿元；Pandaily 则描述潜在上市后估值约 $3.5 billion。 这些不是等价参照。有些是当前私有或 IPO
              前标记，有些是申报期价值的媒体摘要，还有些是完成公开交易后的标题式预期。 谨慎的承销姿态，是把可观察事实与愿景切开：公司显然奔着 IPO 去，但被充分证据支撑的估值区间，明显窄于最具宣传性的标题所暗示的范围。
