  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Deep Robotics 的公开技术栈从面向具体流程的机器人本体出发，向上延伸到感知、导航软件、开发者工具和全生命周期运营。
    data:
      layers:
        - label: 机器人本体层
          detail: SKU 系列对应不同任务：X-series 面向工业四足巡检，Lynx 负责轮足地形通行，Lite3 用于科研，DR 面向人形机器人。
          items:
            - X20 / X30 巡检本体
            - Lynx S10 / Lynx M20 轮足本体
            - Lite3 科研版本
            - DR01 / DR02 人形机器人线
        - label: 感知与执行层
          detail: 多模态感知和自研关节，把移动硬件变成能执行任务的机器人。
          items:
            - 广角相机和热成像
            - 96 线 LiDAR 和点云环视
            - 气体和超声波传感器
            - J60 / J100 关节和 CAN 控制栈
        - label: 机载计算与控制层
          detail: 嵌入式处理器、运动控制和状态估计，在机器端就近处理地形适配和自主运行。
          items:
            - Lynx M20 双工业处理器
            - 高端 Lite3 版本的 Jetson 感知主机
            - AI 运动控制和步态算法
            - X30 的暗光一体化感知
        - label: 导航与具身 AI 层
          detail: 软件把传感器数据和指令转成路线决策、巡检动作和语义导航。
          items:
            - 动态避障
            - 地形识别和自主巡检
            - DeepVLA 1.0 语义导航
            - 自然语言路径调整
        - label: 开发者与生命周期层
          detail: 公开代码仓库、OTA 更新、电池运营和服务政策，决定机器人能否在现场扩展和维护。
          items:
            - rl_training 和 sdk_deploy
            - MJCF / URDF / USD 模型库
            - J60 的 Deep Motor SDK
            - OTA 更新、热插拔电池、可选充电
    approximationNotes: 该技术栈由产品页面、GitHub 文档和 Series C 新闻稿拼出；公开来源没有披露完整内部云架构或闭源车队管理器。
