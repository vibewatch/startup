  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和定价信号现在更像工业化、产品化业务，但实际定价仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据现在显示，公司已有真实收入引擎，而不是概念阶段机器人故事。通过 Sina、CnTechPost 和 Humanoids Daily 审阅的招股书摘要都指向同一幅 2025 年图像：Deep
              Robotics 实现人民币 3.37 亿元收入，具身机器人贡献了核心业务收入的 95% 以上，产品组合由工业绝影 X 系列、较低价的 Lite 线，以及新推出的 Lynx M20
              轮足机器人带动。因此，公司的变现面看起来以硬件优先、企业客户驱动为主，部件和服务存在，但经济重要性低于机器人本体销售。这一点很关键，因为承销判断应从出货量、ASP 和各产品家族毛利率开始，而不是从经常性 SaaS
              指标开始。

              定价只以局部形式可见。最清晰的公开信号，是 2025 年招股书中的 ASP：X 系列约人民币 28.75 万元，Lite 约人民币 2.77 万元，Lynx 约人民币 19.76 万元，单台 DR
              人形机器人销售为人民币 82.3 万元。管理层和第三方报道也把 Deep Robotics 描述为显著低于 Boston Dynamics
              和部分韩国同行，但这些是定位主张，不是实际合同经济。公开记录仍未披露折扣表、软件附加率、维护定价，或项目收入中服务与机器人硬件各占多少。
