      - number: '8.2'
        title: 商业证明真实，但可比倍数仍要求入口纪律，而不是动量定价
        blocks:
          - type: paragraph
            body: >-
              相比通用工业硬件倍数，愿意为 Deep Robotics 支付显著溢价的最强理由，是它已经跨过了许多机器人同业尚未跨过的门槛。 招股书衍生报道显示，公司 2025 年收入人民币 3.37 亿元、净利润人民币
              2868 万元、毛利率 52.83%， 具身机器人收入占比较高，并在电力巡检和新加坡公用事业隧道有可见的工业部署证明。这些是严肃信号，不是演示剧场。
              但估值必须放到其他机器人标记已经能买到什么的背景里看。Unitree 是最接近的私有可比公司，因为它同样立足中国、 有足式机器人传承，也在 IPO 路径上；但 Unitree 收入已越过人民币 10
              亿元，私有估值仍被讨论在约人民币 120 亿元， IPO 目标则激进得多，约 $7 billion。UBTECH 提供了一个正在交易的中国公开市场基准，2025 年营业额约人民币 20 亿元，
              市值达数十亿美元；Boston Dynamics 和 Skild AI 则显示，公开市场和战略投资人会给品类领导者或软件优先平台分配多少可选性。 Deep Robotics 在规模和宽度上低于这些天花板。它
              2025 年卖出一台人形机器人，四足机器人和 Lynx 有实质牵引， 工业切入点很强；但它也面对不利市场来源强调的同样价格压力、地缘政治折价和人形机器人资本开支负担。
              这种组合支持相对无差异硬件的溢价，但不支持开空白支票。
