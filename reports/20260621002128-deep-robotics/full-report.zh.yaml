      - number: '1.2'
        title: 创始人、公开管理梯队和治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始故事确实构成了承销判断的一部分，因为 Deep Robotics
              在技术方向和公开叙事上仍明显由创始人主导。朱秋国和李超来自浙江大学机器人生态，公开访谈把朱秋国呈现为战略、商业和使命设定的声音，李超则负责技术商业化、工业适用性和行业定位。朱秋国的副教授身份，以及公司反复强调的全栈自研、专利深度和工业部署纪律，也强化了这种创始人—市场匹配。更不让人安心的是，创始人之外的公开治理层很薄。已审阅来源提到若干面向公众的运营负责人，例如产品和海外销售负责人，但没有给出清晰的董事会名单、独立董事名单，或股改后的完整高管明细。这意味着，领导层深度主要通过公开发言人和客户侧运营人员可见，而不是通过标准的晚期治理披露包可见。
