  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在噪音较大的头条估值走廊下，Deep Robotics 可被公开证据支撑的价值区间。
    approximationNotes: 这些是公开证据可支撑的区间，并非断言最终 IPO 必须按哪个价格定价。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
    data:
      items:
        - label: 媒体估值走廊
          low: 1100
          mid: 1500
          high: 3500
          detail: 2025 年末私募估值到 2026 年目标 IPO 头条数字。
        - label: 熊市情形
          low: 450
          mid: 675
          high: 900
          detail: IPO 延后、增速降低，利润率回归常态。
        - label: 基准情形
          low: 800
          mid: 1200
          high: 1600
          detail: 工业验证持续复利，人形机器人上行仍处早期。
        - label: 牛市情形
          low: 1800
          mid: 2400
          high: 3000
          detail: 持续超高速增长，新形态产品真正商业化。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，覆盖最可能决定 Deep Robotics 上市前是否值得高价进入的维度。
    approximationNotes: 分数是基于保留证据给出的 0-10 编辑判断，不是外部评级。
    claimRefs:
      - CV006
      - CV007
      - CV018
      - CV031
      - CV034
      - CV047
      - CV048
      - CV051
      - CV052
    data:
      items:
        - label: 商业验证
          score: 8
          detail: 2025 年收入、利润和具名工业部署都很具体，在私营机器人公司里并不常见。
        - label: 估值透明度
          score: 3
          detail: 公开估值互相冲突，当前股权结构经济条款仍看不全。
        - label: 利润率证据
          score: 7
          detail: 52.83% 毛利率很强，但产品组合和支持成本变化后的持久性仍未验证。
        - label: 人形机器人可选性
          score: 5
          detail: 真实产品动作已经出现，但商业化仍停留在验证点层面。
        - label: 地缘政治韧性
          score: 3
          detail: 中国来源采购和出口管制风险仍应对应一笔有意义的折价。
        - label: 退出就绪度
          score: 6.5
          detail: 辅导完成且申报获受理，但定价和审批还在前面。
        - label: 入场纪律机会
          score: 4
          detail: 公司有意思，但在更高的媒体估值下，并不显然便宜。
