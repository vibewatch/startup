        - Lynx M20 和 X30 结合机动性、双光成像、气体传感器，有时还协同无人机
        - 官方演练证据显示空地协同和远程危险感知
        - 相比公开复盘绩效数据，营销更强调场景广度。
      - - 教育和开发者研究
        - 实验室需要可用 SDK 的四足机器人，用于运动、感知和 sim-to-real 实验
        - Lite3 版本开放 ROS、SDK、运动 / 感知开发和 RL 部署资源
        - 多份官方文档和 GitHub 仓库显示真实的二次开发界面
        - 这是公开工具链最深的一条线，但不等同于大规模工业车队证据。
