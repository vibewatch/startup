companyProfile:
  summary: >-
    Deep Robotics 是一家杭州起家的工业机器人公司，由浙江大学研究人员朱秋国和李超创办。公司的商业化产品面已覆盖 X 系列四足机器人、Lynx 轮足机器人、Lite3 开发者平台和早期 DR
    人形机器人线；公开客户证据最强的是电力巡检，以及 Singapore Power 的隧道巡检部署。到 2026 年运行日，公司仍未上市，但已完成辅导并获得科创板申报受理；公开申报摘要显示，2025 年收入为人民币 3.37
    亿元、首次盈利，毛利率超过 50%。尽调约束不在于业务是否真实，而在于股权结构条款、现金 / 现金跑道、客户集中度和经常性收入质量仍明显披露不足。
