      - - 地下隧道巡检
        - 工人步行穿过长距离电缆隧道，发现裂缝、渗水、泄漏和热异常
        - X30 SPock 在 Singapore Power 隧道中巡线、捕捉缺陷并生成报告
        - SP Group 预计扩大部署，每年节省约 480 个人工小时
        - 公开证据未量化机器人停机、误报或维护人工。
      - - 安防巡逻
        - 保安巡逻大型园区或市场综合体，视野不完整，响应速度不稳定
        - 机器狗增加扩音、识别、数据采集、跟随和连续路线巡逻
        - 西宁警方和义乌市场案例展示 24/7 巡逻定位和风险检测
        - 采购、隐私和公共空间运营规则仍记录较少。
      - - 应急救援和消防
