        - 盈利仍可能掩盖重 capex 或营运资金流出。
        - 要求提供月度经营现金流、capex 和情景跑道模型。
      - - 债务、担保和项目融资义务
        - 隐性杠杆会削弱表面上的毛利叙事。
        - 要求提供债务明细、担保、质押资产和契约包。
      - - 按收入计的客户集中度
        - 国家电网集中度可能让收入质量不如表面增长那样耐久。
        - 要求提供前 10 大客户、收入占比、续约日期和公共部门敞口拆分。
