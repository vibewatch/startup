      - number: '7.3'
        title: 财务模型已经转向盈利，但下一阶段同时面对价格压力、资本强度和异常拥挤的 2026 融资窗口
        blocks:
          - type: paragraph
            body: >-
              正面的财务事实确实存在。多份基于招股书的摘要都指向同一组结论：Deep 2025 年收入约人民币 3.37 亿元， 毛利率超过
              52%，并首次实现盈利。与很多私有机器人公司可见的公开证据相比，这明显更强。承销难题在于下一步。 让公司更可投资的每一条来源，也让它显得更吃资本。公司现在同时推进 Lynx 家族、国际现场部署和 DR02
              人形机器人项目； 招股书相关报道还称，下一轮融资将用于具身 AI 算法、大模型、新机器人本体和制造扩张。换句话说， 今天已经盈利的四足机器人业务，被要求为明天更宽的机器人平台融资。


              竞争让这场平衡更难。Unitree 仍是这个品类的价格和出货量参照，头部硬件指标更强，单位规模也深得多。 SemiAnalysis 和其他保留来源显示，Deep 相对 Unitree 仍有溢价，但没有
              Unitree 的出货基础，也没有消费或学术飞轮。 同时，中国机器人 IPO 队列正在拥挤：同业也在冲向公开或准公开流动性事件，行业评论反复回到同一个未解问题——量产经济性。
              结果是一组更像硬件成长公司、而非纯软件故事的风险叠加：毛利率可能压缩，营运资本可能膨胀；如果 IPO 窗口滑走， 或人形机器人投入跑得比工业业务现金生成更快，估值叙事会迅速松动。
