      - number: '2.2'
        title: 规模测算口径和相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开语料无法支撑一个干净的 Deep Robotics 标题 TAM。最好的大市场数据来自四足机器人市场报告，但这些估计差异很大。Precedence 预计 2026 年市场为 USD 3.71
              billion，到 2035 年为 USD 17.53 billion；Emergen 则从 2024 年 USD 1.2 billion 起步，到 2034 年仅达到 USD 4.8
              billion。矛盾不代表市场是假的，而是品类定义不同，尤其是防务、物流、科研和巡检是否被打包在一起。Deep Robotics 因此必须用多重口径来测算：广义四足机器人
              TAM、中国巨大的机器人安装基础和政策支持，以及由证据支撑、更窄的公用事业和工业运营商已部署巡检机器人切片。投资者应把广义 TAM 与可触达 SAM
              之间的差距当作核心尽调问题，而不是舍入误差。这个差距会影响估值，因为不同发布机构能让同一家公司看起来很小众，也能看起来很巨大。
