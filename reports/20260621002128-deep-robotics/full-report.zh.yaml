  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Deep Robotics
              按整个机器人经济，甚至整个四足机器人品类来估值。公司自己的公开证据窄得多：工业巡检、地下导航、应急响应，以及围绕难以进入环境的科研部署。这个边界意味着，纳入支出应围绕公用事业和工业运营商的移动巡检硬件、载荷、自主软件和部署服务。它也意味着明确排除项。纯防务
              UGV 项目、消费四足机器人、固定传感器和纯无人机预算，应放进相邻或替代池，而不是 Deep 专属 TAM
              故事。这个区分很关键，因为现状并非空白；人工巡检、轮式机器人、固定感知和无人机已经覆盖许多巡检任务。只有当楼梯、狭小空间、不规则地形或接触式感知让足式移动明显优于这些替代方案时，Deep Robotics
              才能赢。
