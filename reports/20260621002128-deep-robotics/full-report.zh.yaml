      - number: '3.2'
        title: 能力、定价和买方适配对比
        blocks:
          - type: paragraph
            body: >-
              从能力看，当巡检买家更在意地形处理、公用事业工作流和集成感知，而不是品牌或防务血统时，Deep Robotics 最强。X30 规格表强调 IP67 防护、多传感器融合和 2.5-4
              小时任务，工业巡检页面还加入热成像、声学和机械臂选项，能清晰映射到公用事业和工厂维护工作流。Lynx M20 具有战略意义，因为它显示 Deep
              并不执着于纯四足机器人：当速度和走廊效率重要时，公司正转向轮足设计。Unitree B2
              是更显眼、进攻性更强的通用硬件挑战者，拥有更高的标称速度、载重和轮足可选性，但其关于手动操作的公开免责声明削弱了它对完全无人值守巡检的论证。Boston Dynamics 依靠 Orbit
              和预配置包，仍是托管巡检软件的标杆；不过 Spot 历史定价也解释了为什么许多买家会先测试更便宜或按报价销售的亚洲替代方案。ANYbotics 通过认证后的 Zone 1 就绪度赢得证据最充分的危险环境位置，而
              Ghost Robotics 更贴合防务任务，不是民用能源资产。这个市场的公开定价披露仍然很薄，因此可执行的比较重点不在精确标价，而在于哪些厂商最适合具体买方任务、监管环境和自主性预期。
