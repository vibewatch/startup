      - number: '8.3'
        title: 证据支持“跟踪”建议：纪律性私有标记附近可买，激进 IPO 标题价下偏投机
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Deep Robotics 抽象上是不是一家好公司，而是当前可观察价格走廊是否还留有有吸引力的风险调整回报空间。 按 2025 年约 $49.5-49.6 million 的追踪收入，2025
              年 12 月 Caixin 式人民币 80 亿元标记已经意味着约 22 倍销售额。 如果按超过人民币 100 亿元理解，公司会被推向约 28 倍销售额；尽管规模明显更小、人形机器人证明也少得多， 估值却已接近
              Unitree 式区域。$3.5 billion 的上市后标题价则意味着约 70 倍追踪销售额， 更接近软件式或投机性人形机器人可选性定价，而不是证据支撑的工业机器人定价。这并不意味着公司不可投资，
              而是估值需要场景纪律。熊市情形下，硬件倍数压缩、IPO 延迟或毛利率正常化，都可能把公允价值拖到近期私有标题价之下。 基准情形下，持续工业增长加上可信但仍早期的人形机器人可选性，可以支撑低到中段 $1
              billions 区间。 牛市情形下，Deep Robotics 不仅需要继续兑现四足机器人执行，还需要 2026 年持续增长、稳定高毛利率，
              并拿出真实证据证明人形机器人能成为可重复业务，而不只是叙事延伸。这就是建议为跟踪而非买入的原因。 证据足以让投资人保持兴趣，但还不足以在没有更锋利入口价或更深尽调的情况下承销最激进标记。
