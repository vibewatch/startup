        - 如果大客户拿到大幅让利，ASP 可能高估可持续定价。
        - 要求提供投标中标表、折扣区间和按客户 cohort 划分的毛利率。
      - - 服务和维护附着率
        - 只看硬件毛利，无法判断生命周期价值或现场服务负担。
        - 要求提供年度维护收入、备件毛利和质保准备历史。
      - - 在手订单和管线转化
        - 有已签在手订单可见度，出货增长才更容易承销。
        - 要求提供已预订 backlog、管线阶段和取消历史。
