        - 中国腿式机器人中最接近的可比公司，规模更强，人形叙事也更宽
        - 目标 IPO 估值不等于最终定价，且已包含市场乐观预期
      - - UBTECH 上市基准
        - 2025 年营业额与市值
        - 2025 年营业额 RMB 2.001B，估值参考约 $7B
        - 提供一个已上市中国基准，观察公开市场如何给机器人规模定价
        - 业务组合比 Deep Robotics 更宽，市值参考也不是运行日的即时报价
      - - Boston Dynamics 战略估值天花板
        - 最新战略估值参考
        - 分析师估计约 $25B；Hyundai 2021 年收购价为 $1.1B
        - 展示有全球工业母公司背书时，品类龙头能吸引多少期权价值
        - 对一家聚焦巡检的中国私营发行人来说，不是干净的直接可比
      - - Skild AI 软件溢价
