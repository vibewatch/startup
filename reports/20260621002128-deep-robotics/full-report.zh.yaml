            body: >-
              Deep Robotics 还有第二条客户动作，和工业巡检很不一样。Lite3 及相关开放平台面向大学、实验室和开发者团队，这些客户看重模块化、SDK 访问、传感器开放性和更低价格。官方和第三方来源反复提到
              Tsinghua、Peking University、University of Edinburgh 和 University College London，足以把学术采用视为真实。关于 Tencent 和
              Alibaba 的引用较弱：它们显示平台兴趣或研发使用，而不是足以让投资者推断稳定企业收入的生产部署细节。对公司宏大的顶线触达声明也应保持同样谨慎。100+ 客户、覆盖 26 个中国省份、44
              个国家和地区、600+ 行业场景这类说法，是有用的方向性采用信号，但不等于运行日付费客户数，也不能告诉我们有多少账户是活跃客户、复购客户或收入重要客户。这是本章在已验证具名证据和营销广度之间划出的主线。
