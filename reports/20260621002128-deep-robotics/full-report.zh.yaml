      - number: '2.4'
        title: 采用驱动因素、约束和估值相关性
        blocks:
          - type: paragraph
            body: >-
              当机器人能解决昂贵、危险或重复的巡检工作时，采用逻辑最强。Deep Robotics 声称在变电站和风电场实现了有意义的效率和准确率提升，Emergen 引用自主系统带来的重大巡检成本下降，OSHA
              统计也让工业付款方持续面对工人安全压力。中国还通过第十五个五年规划和仍偏低的机器人密度提供政策顺风。但约束对估值同样重要。ANYbotics 的 ATEX 和 IECEx
              认证说明，危险场所合规是一条真实的商业护城河。Unitree 公开承认自主性限制，GasGoo 强调量产和可靠性摩擦，Boston Dynamics 的定价加 Orbit
              软件也说明企业买家必须同时消化硬件和编排支出。这些约束意味着 Deep Robotics 有理由在公用事业和选定工业场景增长，但除非认证、软件和可靠性一起提升，市场不会按完整 TAM 出清。
