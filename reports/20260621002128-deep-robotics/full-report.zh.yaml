      - number: '1.3'
        title: 资本基础、未上市状态和利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 的融资故事规模不小，但还没达到完整披露级别。公开报道支撑了一条清晰的近期融资序列：2025 年 7 月近 CNY500 million 的 pre-Series C，2025 年 12
              月超过 CNY500 million 的 Series C，以及 2026 年初仅被描述为数亿元人民币的 pre-IPO 轮。公司还在 2025 年 11 月完成股份制改制，变为未上市股份公司，并在 12 月 8
              日签署辅导协议后，于 12 月 23 日提交 IPO 辅导备案。合在一起看，这些步骤强烈支持一个判断：公司仍未上市，但正在积极准备境内上市。公开记录也支持媒体报道的约 CNY8 billion
              估值，但还无法拼出招股书级别的股权图。精确累计融资额、债务或授信敞口，以及任何老股交易历史仍未解决，因此投资者能看清动能和融资方向，却还不能只靠公开文件重建干净的股权结构表或估值标记历史。
