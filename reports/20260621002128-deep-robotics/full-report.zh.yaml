            title: 正确边界是巡检驱动的移动能力，而不是所有四足机器人
            body: 当市场被限定在公用事业和基础设施里的高难度巡检路线时，Deep Robotics 看起来更强；用泛化四足机器人 TAM 走捷径时，公司反而更弱。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM011
              - CM035
          - type: callout
            title: 认证和软件可能比运动能力炫技更关键
            body: ANYbotics 和 Boston Dynamics 表明，即使多家厂商都有可用硬件，危险场所审批和机队软件也能决定购买结果。
            calloutType: risk
            claimRefs:
