  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层真实存在，但各垂直领域的证据质量差异很大
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics
              并不是卖给单一、同质的买方类别。公开记录至少支持四个实际客户桶。第一，公用事业和电网运营商购买四足和轮足机器人，用于隧道、变电站、电缆廊和危险巡检；这是公司具名证据最具体、运营结果最清楚的地方。第二，公共安全和安防买家使用机器人进行巡逻、火灾隐患检测、周界监控和事件响应，具名参考包括
              Xining Public Security Bureau、Yiwu International Trade City 和 Singapore 的 Certis industrial
              park。第三，应急响应组织和消防队出现在演练和场景验证中，这证明了恶劣环境下的产品—市场匹配，但不一定证明经常性收入。第四，大学和研究实验室把 Lite3
              及相关开放平台用于教育和研发工具。关键尽调区分不在于这些细分是否存在，而在于哪些有独立佐证的运营部署证据，哪些只是公司精选案例、类似合作伙伴的展示，或 logo 与触达范围营销。
