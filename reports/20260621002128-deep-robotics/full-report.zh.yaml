        title: 里程碑和主要反向张力
        blocks:
          - type: paragraph
            body: >-
              里程碑记录让 Deep Robotics 看起来明显比纯概念阶段的人形机器人初创公司成熟。从 2018 年第一代四足机器人和 2020
              年电网试点开始，公司推进到产品化工业四足机器人、海外部署、新产品品类、反复融资和正式 IPO 准备。公开来源还显示，2024 年收入同比翻倍以上，员工数达到大约 400
              人，管理层也愿意表示公司没有亏损经营。反向张力不是缺少动作，而是缺少完整证明。投资者和行业分析师的公开评论仍在质疑，机器人头部公司能否足够快地放大 ROI 为正的部署，从而支撑当前估值标记；DR02
              发布本身也留下了自主性、续航和成本问题。换句话说，Deep Robotics 的商业化进度似乎领先许多人形机器人同行，但公开资料仍支持谨慎读法：真实牵引、真实里程碑、真实 IPO
              准备，与不完整的治理和财务披露，以及尚未解决的商业化质疑并存。
