  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线真实存在、按工作流分层，简报里的「L20」标签与公开产品面不匹配
        blocks:
          - type: paragraph
            body: >-
              公开产品面已经足够宽，可以把 Deep Robotics 按平台公司承销，而不只是单一四足机器人厂商。官方页面和 2025 年末发布显示出四条清晰赛道：面向工业四足巡检的 X
              系列、面向更狭窄或更复杂地形轮足作业的 Lynx 系列、面向教育和开发者使用的 Lite3 家族，以及面向工业具身 AI 扩张的 DR 人形机器人线。在这套产品栈中，X20 仍是更轻量的工业四足机器人，X30
              是更坚固的旗舰，Lynx M20 是更重型的工业轮足机器人，Lynx S10 是面向狭窄空间的小型轮足机器人，Lite3 是开放科研平台，DR01 是展会阶段的人形机器人演示机，DR02
              则是第一个看起来像商业人形机器人方案的产品页面。

              一个简报假设经不起来源审阅：没有任何已审阅的官方页面、FAQ、GitHub 页面或第三方报道提到「L20」型号。反复出现的名称是 X20 和 Lynx
              M20，因此最可辩护的解释是简报指的是其中之一。工作流分割也有意义。公用事业和隧道运营商购买 X 系列或 Lynx 机器人用于巡检和缺陷检测；应急团队购买的是地形进入能力加气体、热成像和影像载荷搭载；研究人员购买
              Lite3，因为它开放 ROS、SDK 和 sim-to-real 工具。这种分层让产品组合比泛化的「机器狗」故事更容易映射到真实预算和部署动作。
