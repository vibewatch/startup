    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从未上市状态、经营验证、估值模糊度和资本强度出发，推导出跟踪建议的决策流。
    approximationNotes: 该图服务于决策，而非穷尽所有因素；它展示最可能改变建议的变量。
    claimRefs:
