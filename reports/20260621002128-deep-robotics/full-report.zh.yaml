  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局和竞争赛道
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 面对的是分层竞争场，而不是单一参照对手。在自己的主赛道里，公司把 X30 和 Lynx
              定位为面向管线、变电站、隧道和其他危险基础设施环境的工业巡检机器人，并用中国变电站、宁夏风电资产、新加坡电缆隧道和特高压站案例支撑这个定位。Unitree
              是最接近的国内硬件同行，因为它同时覆盖民用和工业四足机器人，但其公开材料仍披露了部分栈存在手动操作和二次开发限制。ANYbotics 是最危险的全球工业巡检对手，因为它在电力、能源和公用事业上与 Deep
              重叠，同时持有 Deep 尚未公开展示的 ATEX/IECEx 危险区域资质。Boston Dynamics
              仍是品类里最知名的高端品牌，但其市场角色是更高成本的平台加软件方案，而不是低成本中国公用事业专家。Ghost Robotics
              在公用事业巡检中重要性较低，却提醒我们，四足机器人需求也流向防务和政府预算；中国来源硬件在那里可能面对结构性采购壁垒。替代方法仍然真实存在：室内无人机、固定传感器和现状下的人工巡检仍能解决部分巡检任务，尤其是在不需要完整四足移动能力的场景。
