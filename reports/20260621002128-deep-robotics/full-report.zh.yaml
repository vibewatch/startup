      - number: '3.3'
        title: 切换成本、替代方案和渠道进入
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Deep Robotics 似乎没有硬性合同锁定；切换成本更多来自运营和场景。一旦工厂或公用事业客户完成路线建图、调好巡检载荷、把热成像 /
              声学读数接入工作流，并训练员工使用某个机器人家族，更换厂商就会产生摩擦——但这不是某些企业软件市场里的排他数据护城河。因此，多供应商并用是可信的。买家可以在变电站试点一款四足机器人，在危险石化区域部署另一款，同时仍用无人机或固定传感器处理开阔区域或连续监测任务。最强替代方案不是另一只机器狗，而是混合栈：例如
              Flyability 的 Elios 3 这类用于室内 / 狭小空间成像的无人机、用于全天候告警的固定传感器、ABB
              这类常规工业自动化厂商提供的更广巡检和测试自动化，以及用于低频或低复杂度路线的人工班组。当任务需要楼梯、隧道、杂乱环境、接触式感知或无需重度场地改造的频繁重新部署时，Deep
              有优势。若买方需要认证防爆准入、公开证明的美国防务资格，或高度成熟的机队软件，公司则较弱。国际上，新加坡和 GITEX 显示出出口意图，但渠道力量看起来仍比 ANYbotics 所称的区域企业覆盖、或 Ghost
              Robotics 所称的政府基础更早期。
