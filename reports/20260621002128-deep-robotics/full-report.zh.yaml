      - number: '7.2'
        title: 运营证明可信，但集中在依赖伙伴、信任和现场执行的定制化公用事业部署
        blocks:
          - type: paragraph
            body: >-
              相比许多机器人初创公司，Deep 的真实运营证据更强。公开记录显示，它的巡检平台技术能力扎实：X30 针对严苛环境做了加固， 变电站案例声称带来可观的准确率和人力节省，新加坡 SPock
              部署也不只是演示话术，而是进入了真实隧道巡逻流程，并有可衡量的时间节省。 这很重要，因为它证明公司能在真实基础设施里解决昂贵的巡检问题，而不只是交付研究硬件。但同一组证据也暴露了运营风险画像。 Deep
              最好的引用案例，是需要路线建图、定位、软件打磨和深度流程集成的定制化公用事业与变电站部署。新加坡这个海外旗舰项目经历了数月安全评估和本地调校；
              这是严肃部署应有的样子，投资人乐见其成，但也正是它让扩张更依赖服务，比纯硬件收入更难规模化。


              公开证明也很集中。具名引用主要来自国家关联或公用事业式客户；即便最强的海外证明，也仍是伙伴推动的试点， 不是跨多个民营运营方反复落地的广泛客户群。这种集中度又被依赖风险放大。海外交付已经依靠 EGP 等伙伴，
              高信任危险巡检渠道则正被认证更强、工业软件联盟更深的竞争对手锁住。另一个运营复杂点是网络信任：尤其在同业硬件安全担忧浮出水面之后， 客户对中国来源机器人进入数据敏感场所更谨慎。直白说，Deep
              目前的护城河是严苛公用事业环境里的部署 know-how， 但这条护城河有多深，取决于服务团队、伙伴质量，以及逐个客户通过信任筛查的能力。
