      - - IPO 进程停滞或大幅降价
        - 辅导 / 受理文件推进未能转化为市场化发行，或最终定价较媒体预期大幅折价
        - 证实当前标题估值高估了市场胃口或股权结构质量
        - 从跟踪下调为回避，直到出现新的干净入场价格
      - - 2026 年增长放缓，同时人形机器人投入上升
        - 相比 2025 年增长明显转弱，且没有软件或人形机器人收入证据抵消
        - 打破公司可用复合增长的工业基本盘为期权价值供血的判断
        - 转入熊市情形承销，并要求硬性下行保护
      - - 毛利率显著低于 2025 年水平
        - 从 52.83% 持续回落，且没有产品组合或规模解释
        - 暗示 2025 年盈利能力只是阶段性，或高度依赖产品组合
        - 按更低硬件倍数重新定价
      - - 出口管制或采购壁垒收紧
        - 新限制削弱进入海外关键基础设施或先进算力路径的能力
        - 推高折现率，并压缩现实的海外 TAM
        - 假设退出倍数更低、国际渗透更慢
      - - 人形机器人商业化仍可忽略
        - IPO 进程推进后，仍无有意义的多台人形机器人收入或重复部署
        - 拿掉激进估值中内含的期权溢价
        - 主要按工业四足和轮腿式硬件厂商给公司估值
    notes: 每个触发因素都应能在当前到任何定价交易之间被监测，而不只是描述性指标。
    claimRefs:
      - CV016
      - CV031
      - CV032
      - CV034
      - CV035
      - CV043
      - CV045
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前股权结构与优先权栈
        - 最新投后估值、清算优先权、反稀释条款，以及任何投资者附带协议
        - 即使标题估值看似不变，入场经济性也可能剧烈变化
        - 定价任何一轮前，要求提供完整股权结构、融资文件和律师审查
      - - VAM / 特殊股东权利
        - 若 IPO 进程停滞，受影响的触发条件、经济条款和相关方
        - 招股书阶段摘要已经提示，IPO 失败时投资者权利可能恢复
        - 获取已签署的股东协议和承销商 / 法律备忘录
      - - 收入质量
        - 经常性服务占比、质保负担、实际折扣，以及按产品家族划分的复购队列
        - 2025 年利润率和利润只有在规模化与支持义务下守得住才有意义
        - 要求产品线 P&L、队列留存和服务附着分析
      - - 客户集中度
        - 国家电网、南方电网、海外公用事业和其他大客户之间的收入集中度
        - 集中的工业基本盘会在上市时同时放大上行和下行
        - 要求管理层提供前十大客户明细和集中度说明
      - - 人形机器人商业化
        - 除 2025 年披露的一台销量外，管线、已签订单、单位经济性和附着率
        - 激进估值情形隐含为人形机器人上行付费
        - 要求已签管线明细和制造就绪度审查
      - - IPO 准备度与价格发现
        - 承销商反馈、指示性定价区间、流通股、基石投资者胃口和上市时间表
        - 私募估值与市场化 IPO 之间，差距可能达到数亿美元
        - 直接做投行尽调，并与公开同业交易窗口比较
    notes: 这些问题优先围绕最能快速改变投资判断或可接受入场价格的证据。
    claimRefs:
      - CV005
      - CV016
      - CV049
      - CV050
      - CV051
      - CV052
