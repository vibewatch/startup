      - number: '8.4'
        title: 退出准备度好于多数私有同业，但公开市场准备度不等于估值准备度
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 看起来比许多私有机器人公司更接近退出，因为它已经完成辅导、STAR Market 申报获受理， 通过招股书摘要披露了 2025
              年盈利，并且资本用途计划与下一阶段路线图相匹配。这比依赖风险投资路演材料或未定价传闻轮要扎实得多。 即便如此，IPO 路径不等于一份已经尽调完整的投资案例。BigGo 的招股书摘要在这里尤其重要：它称如果 IPO
              流程停滞， 投资人估值调整权可能重新出现，这意味着优先权和治理条款仍可能扭曲普通股经济性。其他未解问题同样现实。 公开记录仍未显示准确的当前投后估值、优先权栈、清算保护、按收入计的客户集中度、复购
              cohort、质保负担、 服务绑定率，或 2025 年的毛利率画像能否经受更广泛的人形机器人推进。监管和地缘政治摩擦也仍然重要。 美国采购和出口管制体系到 2026 年继续收紧；同时，拥挤的机器人 IPO
              日程和资金充足的 AI 软件挑战者，让全球竞争进一步升温。 因此，最终投资问题是运营性的：买方能否拿到足够的私有尽调，确认 Deep Robotics 不只是具备 IPO 能力，
              而且值得在市场给出公开价格之前支付溢价？在答案更清楚之前，正确姿态是主动跟踪、定义杀伤触发器，并要求证据补上股权结构和收入质量缺口。
