      - number: '4.2'
        title: GTM 动作围绕危险巡检、由解决方案驱动，ROI 代理指标强，但单位经济缺口很大
        blocks:
          - type: paragraph
            body: >-
              已审阅来源一致把 Deep Robotics 描述为企业解决方案卖方，而不是消费机器人厂商。官方页面强调工业巡检、应急响应和危险环境部署；管理层访谈把电力巡检称为切入口，因为中国约有 20,000
              座变电站，巡检工作重复且规则明确；Singapore Power
              这类海外证据点也显示，同样模式是在关键任务基础设施中做定制化部署。这在财务上重要，因为公司似乎靠运营可靠性、环境韧性和部署支持赢得业务，而不是靠低摩擦的自助下单。

              公开 ROI 信号强于许多机器人初创公司，但仍不完整。官方案例研究声称巡检准确率 98%，全站巡检不到 35 分钟、人工超过一小时，工作量减少 50% 以上，并在某个变电站场景下降低约 70%
              运营成本。Singapore Power 预计每年节省超过 480 个工时。李超访谈还给出一个有用的商业测试：客户买一次只说明产品可用；如果带来 100、300 或 500
              台复购，才算「好用」。即便如此，公开记录仍未给出 CAC、回本周期、流失率、NRR、服务附加、保修负担或安装毛利，因此收入质量判断是方向性正面，而不是已完全承销。
