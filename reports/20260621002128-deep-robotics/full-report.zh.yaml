      - number: '1.4'
        title: 产品、客户证据和规模信号
        blocks:
          - type: paragraph
            body: >-
              公司概况里最强的一点是，Deep Robotics 没有直接跳进人形机器人营销，而是先在电力巡检和其他高风险环境中做出可用的四足机器人生意。公开证据显示，公司已有一条工业产品阶梯：X20
              奠定全天候四足机器人基线，X30 成为出口级巡检旗舰，DR01 在 2024 年完成人形机器人首秀，Lynx M20 在 2025 年 4 月把产品组合扩展到轮足移动，DR02 则在 2025 年 10
              月把公司推向工业人形机器人。客户和部署证据在电力基础设施中最强。Singapore Power Group 的 SPock 部署既有独立佐证，也有具体运营细节，包括隧道巡检、定位工作，以及估计每年节省 480
              个工时。管理层访谈还指向应急响应、安防巡逻、科研和工业现场的应用深度正在扩大，并提到超过 600 个项目和 2025 年 10,000 台出货目标。即便审计后的客户数和 backlog
              披露仍缺席，这仍是一个有分量的商业化信号。
