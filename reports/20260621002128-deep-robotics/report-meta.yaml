  topStrengths:
    - 2025 public filing summaries show real commercialization, with RMB 337 million of revenue, first-time profitability, and 52.83% gross margin rather than a pure prototype story.
    - The company now has a credible multi-product stack across quadrupeds, wheel-legged robots, and an early humanoid line, with the cleanest deployment proof in utility inspection and Singapore Power's tunnel workflow.
    - Exit readiness is better than at most private robotics peers because Deep Robotics completed shareholding reform, tutoring, and an accepted STAR Market filing while still showing domestic strategic investor support.
  topRisks:
    - Public valuation evidence is inconsistent and looks stretched above disciplined low-$1 billion territory, with late-2025 private marks, 2026 media marks, and a far richer $3.5 billion IPO headline all in circulation.
    - The next phase remains capital intensive because the planned RMB 2.503 billion raise is aimed at embodied-AI R&D, robot bodies, industrialization, and manufacturing expansion.
    - 'Revenue quality is still under-disclosed: cash, burn, customer concentration, realized discounting, recurring service share, warranty burden, and repeat-order cohorts are not public.'
    - Competitive, certification, and geopolitical pressures could compress margins or TAM, especially against Unitree on price/performance and in overseas critical-infrastructure markets.
  unresolvedGaps:
    - Full cap table, liquidation preferences, VAM or special-rights terms, and how those rights behave if the IPO process slips
    - Customer concentration, repeat-order cohorts, service attach, warranty burden, and realized discounting by product line
    - Cash, monthly burn, working-capital needs, and runway versus the timing and certainty of the planned STAR Market raise
    - Named multi-unit humanoid commercialization and any system-level hazardous-site or security/compliance certifications
disclaimer: >-
  This report is an AI-assisted diligence summary based on public information available as of 2026-06-21 and is not investment advice. Deep Robotics now has unusually strong public operating signals for a private robotics company, but the valuation case and downside protection still require direct diligence on cap-table terms, customer economics, cash runway, and IPO execution before capital is committed.
