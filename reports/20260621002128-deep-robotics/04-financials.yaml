  - id: TI003
    title: Unit economics table
    columns:
      - metric
      - value or status
      - confidence
      - why it matters
      - diligence ask
    rows:
      - - Comprehensive gross margin
        - 52.83% in 2025
        - High
        - Shows the industrial hardware business can already support attractive unit-level economics.
        - Reconcile gross margin by hardware, software, services, and geography.
      - - X series product gross margin
        - 54.35% in 2025
        - High
        - Indicates the flagship industrial SKU is not being sold at obvious loss-leading prices.
        - Provide warranty reserve, field-service burden, and sensor-package mix.
      - - Lite series product gross margin
        - 38.52% in 2025
        - High
        - Lower-cost SKUs likely dilute blend while helping volume.
        - Provide education versus commercial buyer mix and channel margin.
      - - Lynx M20 product gross margin
        - 57.50% in 2025
        - Medium
        - Suggests new wheel-legged products can be attractive if launch-year pricing holds.
        - Show whether 2025 included launch subsidies or unusually favorable mix.
      - - Substation deployment ROI proxy
        - ">50% manual-workload reduction and about 70% operating-cost reduction in one official case study"
        - Medium
        - Customer ROI is the best available proxy for payback and repeat buying.
        - Provide signed payback models and realized contract renewal data.
      - - Inspection efficiency proxy
        - Under 35 minutes per full-station inspection versus over 1 hour manually; 98% accuracy
        - Medium
        - Efficiency and accuracy improvements can justify premium pricing in hazardous settings.
        - Provide pre/post labor hours, downtime avoided, and defect-prevention economics.
      - - Overseas labor-arbitrage signal
        - Singapore deployment expected to save >480 manual hours per year
        - Medium
        - Supports international willingness to pay where labor costs are high.
        - Provide country-by-country ROI and local support cost structure.
      - - CAC, payback, NRR, and churn
        - Not publicly disclosed
        - Low
        - These metrics determine whether gross profit converts into efficient growth.
        - Deliver cohort data, renewal curves, and sales-efficiency metrics by segment.
    notes: >-
      Public evidence supports product margins and customer-outcome proxies, but not full SaaS-style or project-based unit
      economics. Nulls are true diligence gaps, not zeros.
