    title: Industrial wedge is already monetizing
    body: >-
      Deep Robotics is no longer just selling the future of robotics. The 2025 filing summaries show real product-level
      revenue, improving gross margins, and first-time profitability anchored in industrial quadrupeds and wheel-legged
      deployments rather than humanoid narrative alone.
    claimRefs:
      - CI002
      - CI004
      - CI006
      - CI008
  - calloutType: risk
    title: IPO capital looks necessary, not merely opportunistic
    body: >-
      The company’s next phase explicitly depends on funding embodied-AI models, new robot bodies, and manufacturing base
      expansion. Without current cash and burn disclosure, the prudent assumption is that the planned STAR Market raise is
      a core financing leg, not excess optionality.
