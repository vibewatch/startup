  - id: verdict-gaps
    title: 'Financial verdict: commercially credible industrial robot business, but still not a complete diligence-ready case'
    body: >-
      The positive case is unusually concrete for a private robotics company. Deep Robotics now has prospectus-backed
      revenue, product-level ASP disclosures, improving gross margins, first-time profitability, visible overseas revenue,
      and customer ROI stories in real infrastructure settings. Those are not trivial signals: they separate the company
      from robotics vendors that still rely almost entirely on demos, research sales, or narrative financing.

      The negative case is that the remaining blind spots are exactly the ones that decide whether a profitable 2025 can
      compound. Public sources do not disclose cash balances, monthly burn, debt facilities, working-capital strain,
      backlog quality, customer concentration by revenue, realized discounting, or service and warranty economics.
      Adverse market sources also warn that the humanoid race is becoming a war-chest contest, while management itself
      highlights price pressure and talent poaching. The chapter verdict is therefore balanced: Deep Robotics looks like a
      real industrial-hardware business with defensible demand today, but forward underwriting still hinges on private
      evidence about liquidity, concentration, and whether margin survives the shift from quadrupeds to more capital-heavy
      humanoid programs.
