      - price/unit/contract
      - list vs realized pricing
      - discounts/unknowns
      - implication
    rows:
      - - Jueying X series
        - ASP about RMB 287.5k per unit in 2025
        - Realized ASP from filing summary, not a public list-price card
        - No public discounting, sensor-bundle pricing, or service uplift
        - Enterprise inspection robotics already support high-ticket industrial budgets.
      - - Jueying Lite series
        - ASP about RMB 27.7k per unit in 2025
        - Realized ASP from filing summary
        - No public regional pricing or channel margin disclosure
        - Lower-price SKU broadens volume but likely lowers blended gross profit per unit.
      - - Lynx M20
        - ASP about RMB 197.6k per unit in 2025
        - Realized ASP from filing summary in launch year
        - Pre-order pricing, support fees, and deployment charges are not public
        - Wheel-legged products can expand average contract value beyond Lite without needing humanoid maturity.
      - - DR humanoid
        - One 2025 sale at RMB 823k
        - Observed realized price from one disclosed transaction
        - No evidence on repeatability, autonomy package, or service economics
        - Humanoid pricing is visible only as a proof point, not yet a bankable revenue stream.
      - - Relative market positioning
        - Management says comparable-performance robots cost one-third to one-half of Boston Dynamics; Korean sales says 20-30% cheaper than Boston Dynamics and Rainbow Robotics
        - Relative positioning claim rather than customer contract schedule
        - No public competitor-adjusted BOM, warranty, or discount data
        - Premium industrial pricing appears defensible today, but relative pricing still needs contract-level proof.
    notes: >-
      The chapter relies on realized ASPs, management positioning, and third-party price comparisons because Deep
      Robotics does not publish a normalized enterprise rate card.
