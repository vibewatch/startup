    rows:
      - - 2025 profitability
        - Net profit RMB 28.68 million after a 2024 net loss
        - Prospectus summaries from Sina, CnTechPost, and Humanoids Daily
        - Confirms the industrial quadruped business can clear profitability before IPO.
        - Provide monthly profit bridge and non-recurring items.
      - - July 2025 pre-Series C
        - Around RMB 500 million raised
        - Yicai plus management interviews
        - Material private capital arrived before filing and likely funded line expansion and hiring.
        - Provide close date, instrument terms, and post-money valuation.
      - - December 2025 Series C
        - More than RMB 500 million raised
        - Yicai article with strategic telecom-linked investors
        - Strategic capital broadened industrial channels but may also increase policy-linked expectations.
        - Provide liquidation terms, board rights, and any commercial side agreements.
      - - Early-2026 pre-IPO financing
        - Hundreds of millions of yuan reportedly raised
        - 36Kr/Tian Tian IPO reporting
        - Suggests the company sought bridge capital even after the Series C.
        - Confirm exact amount, investor list, and whether proceeds remain unrestricted.
      - - Planned STAR Market IPO
        - RMB 2.503 billion raise planned; application accepted in May 2026
        - Filing page plus multiple prospectus summaries
        - IPO is the largest visible funding leg and central to the next capex/R&D phase.
        - Provide expected timing, fallback financing plan, and minimum-cash threshold if markets slip.
      - - Use of proceeds
        - Embodied algorithm/model R&D, robot body/solution R&D, industrialization, and manufacturing/base build-out
        - Prospectus summaries
        - Capital is being directed toward long-horizon capability building, not just sales expansion.
        - Provide stage gates, milestone budgets, and break-even expectations per project.
      - - Cash, burn, runway, debt, and project finance
        - Not publicly disclosed
        - No reviewed source gives cash balance, monthly burn, or leverage schedule
        - This is the main blocker to a clean capital-adequacy conclusion.
        - Deliver current cash, 12-month burn plan, debt covenants, and downside liquidity case.
    notes: >-
      Historical round chronology lives in Company Overview; this table focuses on capital sufficiency from the latest
      private rounds through the still-pending 2026 IPO.
