  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: liquidity
      missingEvidence: Current cash balance, monthly operating burn, capex, and runway through the planned IPO window.
      whyItMatters: Without the liquidity bridge, the chapter cannot tell whether the planned IPO is strategic acceleration or a financing necessity.
      diligencePath: Request monthly management accounts, bank statements, and a 12-month base/downside liquidity model.
      relatedQuestionRefs:
        - QI018
      relatedTableRefs:
        - TI004
    - type: missing-source
      severity: material
      topic: leverage
      missingEvidence: Debt schedule, guarantees, pledged assets, leasing, and any project-finance or supplier-finance obligations.
      whyItMatters: Hidden leverage can make 2025 profitability less meaningful and can subordinate equity value if growth stalls.
      diligencePath: Request debt agreements, security packages, covenant schedule, and auditor confirmation of off-balance-sheet liabilities.
      relatedQuestionRefs:
        - QI019
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue shares, renewal history, public-sector exposure, and tender concentration in power-grid accounts.
      whyItMatters: A hardware business can look profitable while still depending on a narrow set of state-linked customers whose procurement cycles are lumpy.
      diligencePath: Request customer cohort data, top-10 customer list by revenue and margin, and renewal or repeat-order history.
      relatedQuestionRefs:
        - QI020
      relatedTableRefs:
        - TI005
