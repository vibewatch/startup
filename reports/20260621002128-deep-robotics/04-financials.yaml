  - id: capital-adequacy
    title: 2025 profitability is real, but humanoid expansion and manufacturing scale still make financing dependency central
    body: >-
      Deep Robotics enters this chapter with better public financial evidence than most private robotics companies. The
      2025 filing summaries indicate first-time profitability, 52.83% gross margin, and a meaningful overseas revenue
      contribution. Recent private financing also looks substantial: roughly RMB 500 million in July 2025, more than RMB
      500 million in December 2025, and a separate pre-IPO round of hundreds of millions of yuan reported in early 2026.
      The company remains private as of the run date, but its STAR Market application has been accepted and the planned
      IPO would raise about RMB 2.503 billion for embodied-AI models, new robot bodies, industrialization, and base
      construction.

      The underwriting issue is not whether Deep Robotics can raise capital; it is whether the current margin profile is
      durable without fresh capital and without a favorable product mix. Public coverage repeatedly ties the next phase of
      growth to humanoid R&D, expanded manufacturing, and continued talent hiring. Prospectus-based reporting says R&D
      already consumed RMB 84.3 million, or about 25% of revenue, in 2025, and the company itself warned that rapid
      technological iteration could cause profitability volatility. Because cash on hand, burn, debt, and runway are still
      undisclosed, the safer conclusion is that 2025 profit demonstrates viability in industrial quadrupeds but does not
      eliminate forward financing dependence.
