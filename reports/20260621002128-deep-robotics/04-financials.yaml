  - id: TI005
    title: Public financial gaps table
    columns:
      - missing private metric
      - impact
      - exact diligence path
    rows:
      - - Cash on hand by month
        - Cannot test liquidity if IPO timing slips.
        - Request monthly cash balance from January 2025 through latest month with bank statements.
      - - Monthly burn and runway
        - Profitability could still mask heavy capex or working-capital outflow.
        - Request monthly operating cash flow, capex, and scenario runway model.
      - - Debt, guarantees, and project-finance obligations
        - Hidden leverage can weaken the apparent margin story.
        - Request debt schedule, guarantees, pledged assets, and covenant package.
      - - Customer concentration by revenue
        - State-grid concentration could make revenue quality less durable than headline growth suggests.
        - Request top-10 customers, share of revenue, renewal dates, and public-sector exposure split.
      - - Realized discounting and tender pricing
        - ASPs may overstate sustainable pricing if large buyers receive steep concessions.
        - Request tender win sheets, discount bands, and gross margin by customer cohort.
      - - Service and maintenance attach rate
        - Hardware margin alone does not show lifetime value or field-service burden.
        - Request annual maintenance revenue, spare-parts margin, and warranty reserve history.
      - - Backlog and pipeline conversion
        - Shipment growth is easier to underwrite with signed backlog visibility.
        - Request booked backlog, pipeline stages, and cancellation history.
      - - Humanoid pilot economics
        - One DR02 sale does not prove commercial repeatability.
        - Request pilot economics, deployment costs, and target margin ramp for humanoids.
    notes: >-
      These gaps are the minimum private-data package required to turn a positive commercial narrative into a fully
      diligenced financial underwriting case.
    claimRefs:
      - CI025
      - CI037
      - CI045
