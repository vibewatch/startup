  - id: gtm-unit-economics
    title: GTM motion is solution-led around hazardous inspection, with strong ROI proxies but large unit-economics gaps
    body: >-
      The reviewed sources consistently describe Deep Robotics as an enterprise solutions seller, not a consumer robot
      vendor. Official pages emphasize industrial inspection, emergency response, and hazardous-environment deployment;
      management interviews point to power inspection as the wedge because China has roughly 20,000 substations with
      repetitive, rules-based inspection workflows; and overseas proof points such as Singapore Power show the same
      pattern of customized deployment into mission-critical infrastructure. This is financially important because the
      company appears to win business through operational reliability, environmental resilience, and deployment support
      rather than through low-friction self-serve checkout.

      Public ROI signals are stronger than for many robotics startups but still incomplete. Official case studies claim
      98% inspection accuracy, sub-35-minute full-station patrols versus more than an hour manually, more than 50%
      workload reduction, and about 70% operating-cost reduction in one substation setting. Singapore Power expects more
      than 480 annual labor hours saved. Li Chao’s interview adds a useful commercial test: a product is merely usable
      when a customer buys once, but “good-to-use” when it leads to 100-, 300-, or 500-unit repeat purchases. Even so,
      the public record still does not give CAC, payback, churn, NRR, service attachment, warranty burden, or
      installation margin, so the revenue-quality case is directionally positive rather than fully underwritten.
    claimRefs:
