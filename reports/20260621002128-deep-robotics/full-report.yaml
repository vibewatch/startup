      - number: '1.2'
        title: Founders, public leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founding story is a genuine part of the underwriting case because Deep Robotics still looks
              founder-led in both technology direction and public narrative. Zhu Qiuguo and Li Chao came from the
              Zhejiang University robotics ecosystem, and public interviews portray Zhu as the strategic, commercial,
              and mission-setting voice while Li covers technical commercialization, industrial applicability, and
              sector positioning. That founder-market fit is reinforced by Zhu’s associate-professor role and the
              company’s repeated claims of full-stack self-development, patent depth, and industrial deployment
              discipline. What is less reassuring is the thin public governance layer outside the founders. Reviewed
              sources name several public-facing operators—such as product and overseas-sales leads—but do not provide a
              clean board roster, independent-director list, or a fully itemized post-reform executive lineup. That
              means leadership depth is visible mainly through public spokespeople and customer-facing operators rather
              than through a standard late-stage governance disclosure package.
