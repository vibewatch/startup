  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Deep Robotics' public stack runs from workflow-specific robot bodies up through sensing, navigation software,
      developer tooling, and lifecycle operations.
    data:
      layers:
        - label: Robot body layer
          detail: >-
            SKU families map to distinct jobs: X-series for industrial quadruped inspection, Lynx for wheel-legged
            terrain access, Lite3 for research, and DR for humanoids.
          items:
            - X20 / X30 inspection bodies
            - Lynx S10 / Lynx M20 wheel-legged bodies
            - Lite3 research variants
            - DR01 / DR02 humanoid line
        - label: Perception and actuation layer
          detail: Multimodal sensing and proprietary joints turn mobility hardware into task-capable robots.
          items:
            - Wide-angle cameras and thermal imaging
            - 96-line LiDAR and point-cloud surround view
            - Gas and ultrasonic sensors
            - J60 / J100 joints and CAN-control stack
        - label: Onboard compute and control layer
          detail: >-
            Embedded processors, motion control, and state estimation handle terrain adaptation and autonomy close to
            the machine.
          items:
            - Dual industrial processors on Lynx M20
            - Jetson perception host on higher-end Lite3 variants
            - AI motion-control and gait algorithms
            - Darkness-tolerant integrated perception on X30
        - label: Navigation and embodied AI layer
          detail: >-
            Software translates sensor data and commands into route decisions, inspection actions, and semantic
            navigation.
          items:
            - Dynamic obstacle avoidance
            - Terrain recognition and autonomous inspection
            - DeepVLA 1.0 semantic navigation
            - Natural-language path adjustment
        - label: Developer and lifecycle layer
          detail: >-
            Public repositories, OTA updates, battery operations, and service policies determine whether the robots are
            extendable and maintainable in the field.
          items:
            - rl_training and sdk_deploy
            - MJCF / URDF / USD model library
            - Deep Motor SDK for J60
            - OTA updates, hot-swap batteries, optional charging
    approximationNotes: >-
      The stack is assembled from product pages, GitHub documentation, and the Series C release; public sources do not
      expose a complete internal cloud architecture or closed-source fleet manager.
