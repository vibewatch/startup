              embodied-AI models, new robot bodies, industrialization, and base construction.

              The underwriting issue is not whether Deep Robotics can raise capital; it is whether the current margin
              profile is durable without fresh capital and without a favorable product mix. Public coverage repeatedly
              ties the next phase of growth to humanoid R&D, expanded manufacturing, and continued talent hiring.
              Prospectus-based reporting says R&D already consumed RMB 84.3 million, or about 25% of revenue, in 2025,
              and the company itself warned that rapid technological iteration could cause profitability volatility.
              Because cash on hand, burn, debt, and runway are still undisclosed, the safer conclusion is that 2025
              profit demonstrates viability in industrial quadrupeds but does not eliminate forward financing
              dependence.
