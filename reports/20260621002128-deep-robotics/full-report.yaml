        title: Revenue model and pricing signals now look industrial and productized, but realized pricing is still opaque
        blocks:
          - type: paragraph
            body: >-
              Public evidence now shows a real revenue engine rather than a concept-stage robotics story. The prospectus
              summaries reviewed through Sina, CnTechPost, and Humanoids Daily all point to the same 2025 picture: Deep
              Robotics generated RMB 337 million of revenue, with embodied robots contributing more than 95% of core
              business income, and product mix led by the industrial Jueying X series, the lower-priced Lite line, and
              the newly launched Lynx M20 wheel-legged robot. The company’s monetization surface therefore appears
              hardware-first and enterprise-led, with components and services present but economically secondary to
              robot-body sales. That matters because it means underwriting starts from shipment volume, ASP, and gross
              margin by product family rather than from recurring SaaS metrics.

              Pricing is visible only in partial form. The clearest public signals are 2025 prospectus ASPs of roughly
              RMB 287.5 thousand for the X series, RMB 27.7 thousand for Lite, RMB 197.6 thousand for Lynx, and RMB 823
              thousand for the single DR humanoid sale. Management and third-party coverage also frame Deep Robotics as
              materially cheaper than Boston Dynamics and some Korean peers, but those are positioning claims rather
              than realized contract economics. The record still does not disclose discount schedules, software attach
              rates, maintenance pricing, or what portion of project revenue sits in services versus robot hardware.
