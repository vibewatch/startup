      - number: '8.2'
        title: >-
          Commercial proof is real, but comparable multiples still argue for entry discipline rather than momentum
          pricing
        blocks:
          - type: paragraph
            body: >-
              The strongest argument for paying a meaningful premium over a generic industrial-hardware multiple is that
              Deep Robotics has crossed several thresholds that many robotics peers have not. Prospectus-derived
              reporting now shows RMB 337 million of 2025 revenue, RMB 28.68 million of net profit, 52.83% gross margin,
              heavy embodied-robot mix, and visible industrial deployment proof in power inspection and Singapore
              utility tunnels. Those are serious signals, not demo-theater. But valuation has to be framed against what
              other robotics marks already buy. Unitree is the closest private comparator because it shares a China
              base, legged-robot heritage, and IPO path; yet Unitree crossed RMB 1 billion of revenue and was still
              discussed at roughly RMB 12 billion private and a much more aggressive ~$7 billion IPO target. UBTECH
              provides a live Chinese public benchmark, with 2025 turnover of about RMB 2.0 billion and a
              multi-billion-dollar market value, while Boston Dynamics and Skild AI show how much optionality public and
              strategic investors can assign to category leaders or software-first platforms. Deep Robotics sits below
              those ceilings on scale and breadth. It has one sold humanoid unit in 2025, meaningful quadruped and Lynx
              traction, and a strong industrial wedge, but it also faces the same price pressure, geopolitical
              discounting, and humanoid-capex burden highlighted by adverse market sources. That mix supports a premium
              to undifferentiated hardware, but not a blank check.
