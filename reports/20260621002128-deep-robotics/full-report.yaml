  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive lanes
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics faces a layered field rather than one single reference rival. In its home lane, the company
              positions X30 and Lynx as industrial inspection robots for pipelines, substations, tunnels, and other
              hazardous infrastructure environments, then backs that positioning with case studies in Chinese
              substations, Ningxia wind assets, Singapore cable tunnels, and UHV stations. Unitree is the closest
              domestic hardware peer because it spans both civilian and industrial quadrupeds, but its public materials
              still disclose manual-operation and secondary-development limits on parts of the stack. ANYbotics is the
              most dangerous global industrial-inspection rival because it overlaps on power, energy, and utilities
              while also holding ATEX/IECEx hazardous-area credentials that Deep has not publicly shown. Boston Dynamics
              is still the category's best-known premium brand, yet its market role is a higher-cost
              platform-plus-software offer, not a low-cost China utility specialist. Ghost Robotics matters less in
              utility inspection but more as a reminder that quadruped demand also flows through defense and government
              budgets where Chinese-origin hardware can face structural procurement barriers. Substitute methods remain
              real: indoor drones, fixed sensors, and status-quo manual rounds still solve parts of the inspection job,
              especially where full quadruped mobility is unnecessary.
