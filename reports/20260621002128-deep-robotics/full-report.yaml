              setting. Singapore Power expects more than 480 annual labor hours saved. Li Chao’s interview adds a useful
              commercial test: a product is merely usable when a customer buys once, but “good-to-use” when it leads to
              100-, 300-, or 500-unit repeat purchases. Even so, the public record still does not give CAC, payback,
              churn, NRR, service attachment, warranty burden, or installation margin, so the revenue-quality case is
