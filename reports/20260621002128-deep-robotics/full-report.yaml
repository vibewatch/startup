chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics presents itself as an embodied-AI robotics company built around hazardous and industrial use
              cases rather than a consumer robotics story. Official materials describe a Hangzhou-based high-tech
              enterprise focused on quadruped robots, humanoid robots, and core robotic components, with a full-stack
              “Perception–Decision–Execution” framework aimed at energy, emergency response, industrial operations, and
              education. Independent reporting lines up with that framing: the company was founded in November 2017,
              remains private, and is now best understood as a late-private, pre-IPO industrial robotics company rather
              than an early research spinout. The business model visible in the public pack is hardware-and-solution
              sales into inspection, rescue, logistics, and research scenarios, with later humanoid work layered on top
              of an already commercial quadruped base. The core diligence caveat is disclosure depth. Basic identity and
              product scope are clear, but audited financials, current customer count, and a precise lifetime capital
              tally are still not publicly reconciled.
