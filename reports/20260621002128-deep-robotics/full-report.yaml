      - number: '7.4'
        title: >-
          People and execution risk sits in organizational breadth: the thesis breaks if Deep cannot add compliance,
          service, and capital discipline as fast as it adds products
        blocks:
          - type: paragraph
            body: >-
              Deep's execution challenge is broader than product engineering. Its own company materials present a
              full-stack robotics organization spanning core components, quadrupeds, humanoids, manufacturing, sales,
              and service. That breadth is a strategic ambition, but it is also a people and control problem because the
              company must scale compliance, field support, certification work, partner management, and capital
              allocation at the same time. The strongest current evidence still sits in industrial quadrupeds for
              utilities and harsh inspection routes. The farther Deep moves from that lane into international channel
              building, hazardous-industry certification, and humanoid commercialization, the more the bottleneck shifts
              from technical possibility to management bandwidth.


              The most useful investor framing is therefore trigger-based. Some risks are manageable if they remain
              bounded: a service-heavy overseas rollout is acceptable if customer diversification improves; humanoid
              expansion is acceptable if quadruped margins stay healthy and the financing path remains open;
              national-origin screening is tolerable if Deep remains focused on markets where on-prem deployment and
              civilian workflows are enough. But the thesis breaks if these mitigations do not mature. The kill criteria
              are not exotic. They are concrete events: no certification path, no diversification beyond power
              utilities, visible margin erosion under price pressure, or IPO and financing delays while R&D intensity
              stays elevated. Until management proves that the organization can industrialize controls and channels as
              quickly as it industrializes robot bodies, execution risk should be treated as one of the load-bearing
              valuation constraints.
