        title: Deployment proof is strongest in utility inspection, but trust and support controls lag the locomotion story
        blocks:
          - type: paragraph
            body: >-
              The product is easiest to believe where the workflow is narrow, repetitive, and hazardous. Utility and
              tunnel inspection fit that pattern, and the reviewed cases show Deep Robotics repeatedly selling around
              terrain access, data collection, and reduced human exposure. The substation evidence is unusually specific
              for a private robotics vendor: official pages claim nearly thirty China Southern Power Grid substations,
              cost reduction of roughly 70 percent, efficiency gains above 50 percent, greater than 95 percent
              inspection-detection accuracy, and 96.5 percent recognition accuracy in a Ningxia desert deployment.
              Singapore Power's SPock deployment gives a second, more international workflow proof point: X30 patrols a
              40 km power tunnel, detects leaks and thermal anomalies, and triggered a wider-scale deployment plan.

              Trust and quality signals are real but uneven. Hardware ruggedization is concrete, with IP66 or IP67
              ratings across the industrial line and DR02's modular quick-detach design explicitly positioned as an O&M
              feature. At the same time, public compliance evidence is thin beyond ingress ratings and marketing claims
              of reliability. The support and privacy pages create real diligence flags: after-sales terms are stated
              for mainland China only, warranty exclusions are broad for harsh environments and unauthorized
              modification, and the privacy policy allows collection of logs, time, location, device configuration, and
              IP data with disclosure to authorities when legally required. In other words, the locomotion stack looks
              farther along than the public trust, security, and global support package.
