companyProfile:
  summary: >-
    Deep Robotics is a Hangzhou-founded industrial robotics company created by Zhejiang University researchers Zhu
    Qiuguo and Li Chao. Its commercial surface now spans X-series quadrupeds, Lynx wheel-legged robots, Lite3 developer
    platforms, and the early DR humanoid line, with the strongest public customer proof in utility inspection and
    Singapore Power's tunnel-inspection deployment. By the 2026 run date, the company remained private but had completed
    tutoring and reached an accepted STAR Market filing while public filing summaries pointed to RMB 337 million of 2025
    revenue, first-time profitability, and gross margin above 50%. The diligence constraint is not whether the business
    is real; it is that cap-table terms, cash/runway, customer concentration, and recurring revenue quality remain
    materially under-disclosed.
