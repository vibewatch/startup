  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Deep Robotics is deep into the IPO process, but it remains private and the valuation record is still noisy
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics is no longer a concept-stage robotics startup looking for its first market-clearing event.
              By the run date, the company had completed IPO tutoring, had its STAR Market application accepted, and had
              prospectus summaries circulating through multiple Chinese and English-language outlets. That matters
              because it gives investors much more operating evidence than most private robotics companies can offer. At
              the same time, none of those steps means the company is already public. As of 2026-06-21, Deep Robotics
              still sits in a pre-listing state: private, filing in motion, and dependent on final review, pricing, and
              market-window conditions before liquidity is real. The valuation trail is therefore mixed rather than
              clean. Caixin described the company at roughly RMB 8 billion in December 2025, Humanoids Daily later
              framed the business at more than RMB 10 billion, and Pandaily described a potential post-listing valuation
              around $3.5 billion. Those are not equivalent reference points. Some are current-private or pre-IPO marks,
              some are media summaries of filing-era value, and some are headline expectations for a completed public
              transaction. The prudent underwriting stance is to separate what is observable from what is aspirational:
              the company is clearly IPO-bound, but the fully supported valuation range is materially narrower than the
              most promotional headlines imply.
            claimRefs:
