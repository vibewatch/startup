  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics should not be valued against the whole robotics economy or even the whole quadruped
              category. The company's own public evidence is much narrower: industrial inspection, underground
              navigation, emergency response, and research deployments anchored in hard-to-access environments. That
              boundary implies included spend around mobile inspection hardware, payloads, autonomy software, and
              deployment services for utilities and industrial operators. It also implies explicit exclusions.
              Defense-only UGV programs, consumer quadrupeds, fixed sensors, and drone-only budgets belong in adjacent
              or substitute pools, not in a Deep-specific TAM story. This distinction matters because the status quo is
              not empty; manual patrols, wheeled robots, fixed sensing, and drones already cover many inspection jobs.
              Deep Robotics only wins when stairs, confined spaces, irregular terrain, or contact-rich sensing make
              legged mobility materially better than those substitutes.
            claimRefs:
