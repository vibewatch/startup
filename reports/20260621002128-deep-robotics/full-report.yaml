      - number: '1.3'
        title: Capital base, private status, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics’ financing story is substantial, but not yet fully disclosure-grade. Public reporting
              supports a clear sequence of recent financings: a nearly CNY500 million pre-Series C round in July 2025, a
              more than CNY500 million Series C in December 2025, and an early-2026 pre-IPO round described only as
              hundreds of millions of renminbi. The company also completed a November 2025 shareholding reform into a
              non-listed joint-stock company and then filed for IPO tutoring on December 23, 2025 after signing its
              advisory package on December 8. Taken together, those steps strongly support the view that the company is
              still private but actively preparing for a mainland listing. The public record also supports a
              media-reported valuation around CNY8 billion, but not a prospectus-grade ownership picture. Exact lifetime
              capital raised, debt or credit exposure, and any secondary-sale history remain unresolved, so investors
              can understand momentum and funding direction but not yet reconstruct a clean cap-table or mark history
              from public documents alone.
