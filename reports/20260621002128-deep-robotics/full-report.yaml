        title: Customer segments are real, but the evidence quality differs sharply by vertical
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics is not selling to one monolithic buyer class. The public record supports at least four
              practical customer buckets. First, utilities and grid operators buy quadrupeds and wheel-legged robots for
              tunnel, substation, cable-gallery, and hazardous-inspection work; this is where the company has the most
              concrete named proof and the clearest operating outcomes. Second, public-safety and security buyers use
              robots for patrol, fire-hazard detection, perimeter monitoring, and incident response, with named
              references including Xining Public Security Bureau, Yiwu International Trade City, and Singapore's Certis
              industrial park. Third, emergency-response organizations and fire brigades appear in drills and scenario
              validation, which proves product-market fit for harsh environments but does not necessarily prove
              recurring revenue. Fourth, universities and research labs use Lite3 and related open platforms as
              education and R&D tools. The key diligence distinction is not whether these segments exist, but which are
              evidenced by independently corroborated operational deployment versus company-curated examples,
              partner-like showcases, or logo-and-reach marketing.
