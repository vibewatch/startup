            2025 revenue, profit, and named industrial deployments are unusually concrete for a private robotics
            company.
        - label: Valuation transparency
          score: 3
          detail: Public marks conflict and the current cap-table economics are not fully visible.
        - label: Margin evidence
          score: 7
          detail: 52.83% gross margin is strong, but durability across mix and support costs is still unproven.
        - label: Humanoid optionality
          score: 5
          detail: Real product motion exists, but commercialization is still at proof-point level.
        - label: Geopolitical resilience
          score: 3
          detail: China-origin procurement and export-control risk still deserve a meaningful discount.
        - label: Exit readiness
          score: 6.5
          detail: Tutoring complete and filing accepted, but pricing and approval are still ahead.
        - label: Entry discipline opportunity
          score: 4
          detail: Interesting company, but not obviously cheap at the richer media marks.
