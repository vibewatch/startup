      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence does not say Deep Robotics is weak; it says the category is getting harder to defend.
              Gasgoo's January 2026 coverage of MirrorMe's Apollo launch is the most important disconfirming signal
              because it argues that stable manufacturing and standalone innovation no longer form a durable moat by
              themselves—what matters is the feedback loop between iteration and industrial verification. That is
              relevant to Deep because its best differentiator today is exactly that deployment-feedback loop in
              utilities, not a publicly visible certification, software, or procurement monopoly. Unitree can push from
              below on flexible hardware and lower-end accessibility, ANYbotics can pressure from above on
              hazardous-area trust and global energy references, and Boston Dynamics can continue to define the premium
              software-led inspection benchmark. Meanwhile, Ghost Robotics shows that one large demand pool—U.S.
              national-security procurement—may remain relatively closed to Chinese-origin suppliers regardless of
              technical merit. Deep's wheel-legged Lynx response is therefore strategically positive: it suggests the
              company is adapting to site reality instead of overcommitting to one locomotion form. Still, the
              unresolved items matter for diligence: current public pricing, installed-base transparency, ATEX/IECEx
              status, and how much of the company's overseas activity is repeatable channel growth versus showcase-led
              market entry.
