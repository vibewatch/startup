              companies. The 2025 filing summaries indicate first-time profitability, 52.83% gross margin, and a
              meaningful overseas revenue contribution. Recent private financing also looks substantial: roughly RMB 500
              million in July 2025, more than RMB 500 million in December 2025, and a separate pre-IPO round of hundreds
