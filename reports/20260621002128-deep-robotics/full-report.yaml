      - CE010
      - CE016
      - CE017
      - CE018
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      The core commercial motion starts with a hazardous inspection or response route, proves autonomous data capture,
      then expands only if integration and support hold.
    data:
      nodes:
        - id: route
          label: Hazardous or repetitive route exists
          detail: Utility tunnel, substation, patrol perimeter, or rescue zone has recurring human work and safety cost.
        - id: robot
          label: Robot body is matched to terrain
          detail: X-series handles rugged quadruped inspection, Lynx adds wheel-legged access, Lite3 serves research pilots.
        - id: sensors
          label: Sensor payload captures evidence
          detail: Cameras, LiDAR, thermal, gas, and other payloads collect the data humans previously gathered manually.
        - id: autonomy
          label: Autonomy executes the route
          detail: Navigation, obstacle avoidance, and gait adaptation reduce direct human presence in the hazard zone.
        - id: report
          label: Findings return to operators
          detail: Defect reports, alarms, or patrol data flow back into maintenance, security, or rescue command routines.
        - id: scale
