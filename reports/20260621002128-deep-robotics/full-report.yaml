  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public maturity is highest for quadruped inspection and lowest for humanoid commercialization, while developer
      openness is concentrated in Lite3 and M20.
    data:
      columns:
        - Deployment proof
        - Developer openness
        - Terrain capability
        - Commercial maturity
      rows:
        - label: X20 / X30
          values:
            - Named industrial deployments and repeated inspection use cases
            - Limited public SDK detail compared with Lite3 and M20
            - Strong on stairs, slopes, darkness, and harsh weather
            - Highest maturity in the current portfolio
        - label: Lynx M20 / Lynx S10
          values:
            - Strong launch-era case studies, but fewer named fleet references than X30
            - Moderate public openness through repos and deployment SDK support for M20
            - Strongest public evidence for narrow-space and mixed wheel-leg terrain access
            - Commercially promising but newer than X-series
        - label: Lite3
          values:
            - Research and education proof outweighs industrial production proof
            - Deepest public docs, SDK, RL, ROS, and model coverage
            - Good locomotion and perception flexibility for labs, not positioned as harsh-environment flagship
            - Mature as a developer platform, not as the main industrial revenue engine
        - label: DR01 / DR02
          values:
            - Mostly demos and product claims, with no reviewed named production deployment for DR02
            - Minimal public tooling compared with Lite3 or M20
            - Humanoid compatibility with human spaces is strategically attractive
            - Earliest commercial maturity and highest execution risk
