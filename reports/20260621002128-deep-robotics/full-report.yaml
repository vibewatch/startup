      - number: '1.4'
        title: Products, customer proof, and scale signals
        blocks:
          - type: paragraph
            body: >-
              The strongest part of the company-overview story is that Deep Robotics did not jump straight into humanoid
              marketing; it first built a usable quadruped business in power inspection and other high-risk
              environments. Public evidence shows an industrial product ladder: the X20 established the all-weather
              quadruped baseline, the X30 became the export-grade inspection flagship, the DR01 marked the first
              humanoid debut in 2024, the Lynx M20 widened the portfolio into wheeled-legged mobility in April 2025, and
              the DR02 pushed the company into industrial humanoids by October 2025. Customer and deployment proof is
              strongest in power infrastructure. The Singapore Power Group SPock deployment is independently
              corroborated and operationally specific, including tunnel inspections, localization work, and an estimated
              480 annual labor hours saved. Management interviews also point to broadening application depth across
              emergency response, security patrol, research, and industrial sites, with more than 600 projects reported
              and a 10,000-unit shipment target for 2025. That is a meaningful commercial signal even though audited
              customer-count and backlog disclosure remain absent.
