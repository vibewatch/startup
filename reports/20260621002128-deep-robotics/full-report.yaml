      - number: '1.5'
        title: Milestones and the main adverse tension
        blocks:
          - type: paragraph
            body: >-
              The milestone record makes Deep Robotics look materially more mature than a pure concept-stage humanoid
              startup. From the 2018 first-generation quadruped and the 2020 power-grid pilot, the company progressed
              into productized industrial quadrupeds, overseas deployment, new product categories, repeated fundraising,
              and formal IPO preparation. Public sources also show that 2024 revenue more than doubled year over year,
              headcount reached roughly 400, and management is willing to say the company is not operating at a loss.
              The adverse tension is not lack of activity but lack of full proof. Public commentary from investors and
              sector analysts still questions whether robotics leaders can scale ROI-positive deployments fast enough to
              justify current marks, and the DR02 launch itself left autonomy, battery-life, and cost questions
              unanswered. In other words, Deep Robotics appears commercially ahead of many humanoid peers, but the
              public pack still supports a cautious reading: real traction, real milestones, and real IPO preparation,
              paired with incomplete governance and financial disclosure plus unresolved commercialization skepticism.
