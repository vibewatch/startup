      - number: '7.3'
        title: >-
          The financial model has crossed into profitability, but the next stage mixes price pressure, capital
          intensity, and an unusually crowded 2026 financing window
        blocks:
          - type: paragraph
            body: >-
              The positive financial fact pattern is real. Multiple prospectus-based summaries agree that Deep reached
              roughly RMB 337 million of 2025 revenue, delivered gross margin above 52%, and turned profitable for the
              first time. That is materially better than the public evidence available for many private robotics names.
              The underwriting problem is what comes next. Every source that makes the business look more investable
              also makes it look more capital intensive. The company is now simultaneously pushing the Lynx family,
              international field deployments, and the DR02 humanoid program, while prospectus-linked coverage says the
              next financing step is meant to fund embodied-AI algorithms, large models, new robot bodies, and expanded
              manufacturing. In other words, today's profitable quadruped business is being asked to finance tomorrow's
              broader robotics platform.


              Competition makes that balancing act harder. Unitree remains the category's price and volume reference
              point, with better headline hardware benchmarks and much deeper unit scale. SemiAnalysis and other
              retained sources suggest Deep still prices at a premium to Unitree while lacking Unitree's shipment base
              and consumer or academic flywheel. At the same time, the China robotics IPO queue is becoming crowded:
              peers are also pushing toward public or quasi-public liquidity events, and industry commentary keeps
              returning to the same unresolved question of mass-production economics. The result is a risk stack that
              looks more like a hardware growth company than a pure software story: margins can compress, working
              capital can expand, and the valuation case can unwind quickly if the IPO window slips or if humanoid spend
              outpaces industrial cash generation.
