    {
      "id": "switching-costs-and-substitutes",
      "title": "Switching costs, substitutes, and channel access",
      "body": "Deep Robotics does not appear to enjoy hard contractual lock-in from public evidence; instead, switching costs are operational and situational. Once a plant or utility has mapped routes, tuned inspection payloads, integrated thermal/acoustic readings into workflows, and trained staff on one robot family, changing vendors creates friction—but not the kind of exclusive data moat seen in some enterprise software markets. That makes multi-homing credible. Buyers can pilot one quadruped in substations, deploy a different one in hazardous petrochemical zones, and still use drones or fixed sensors for open-area or continuous-monitoring tasks. The strongest substitute is not another dog alone but the mixed stack: drones such as Flyability's Elios 3 for indoor/confined-space imaging, fixed sensors for always-on alerts, conventional industrial-automation vendors such as ABB for broader inspection-and-testing automation, and manual crews for low-frequency or low-complexity routes. Deep has an advantage where the job requires stairs, tunnels, clutter, contact-sensing, or frequent redeployment without heavy site modifications. The company is weaker where the buyer needs certified explosion-proof access, publicly demonstrated U.S. defense eligibility, or highly mature fleet software. Internationally, Singapore and GITEX show export intent, but channel power still looks earlier-stage than the regional enterprise reach claimed by ANYbotics or the government base claimed by Ghost Robotics.",
