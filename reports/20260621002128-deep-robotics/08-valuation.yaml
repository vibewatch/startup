- id: exit-readiness-and-final-asks
  title: Exit readiness is better than at most private peers, but public-market readiness is still not the same thing as valuation readiness
  body: 'Deep Robotics looks more exit-ready than many private robotics names because it has already completed tutoring, has an accepted STAR Market filing, has disclosed 2025 profitability through prospectus summaries, and has a capital-use plan that fits its next-stage roadmap. That is materially better than relying on venture decks or unpriced rumor rounds. Even so, an IPO pathway is not the same as a fully diligenced investment case. BigGo’s prospectus summary is especially important here: it says investor valuation-adjustment rights can reappear if the IPO process stalls, which means preference and governance terms may still distort common-equity economics. Other unresolved issues are equally practical. The public record still does not show exact current post-money, preference stack, liquidation protections, customer concentration by revenue, repeat-order cohorts, warranty burden, service attach, or whether 2025’s margin profile survives a broader humanoid push. Regulatory and geopolitical
    friction also remain material. US procurement and export-control regimes continued tightening into 2026, while global competition intensified through crowded robotics IPO calendars and heavily funded AI-software challengers. The final investment question is therefore operational: can a buyer obtain enough private diligence to confirm that Deep Robotics is not only IPO-capable, but also worth paying a premium for before the market sets a public price? Until that answer is clearer, the right posture is to monitor actively, define kill triggers, and insist on evidence that closes the cap-table and quality-of-revenue gaps.'
