- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: 'Uses the most decision-relevant disclosed marks in the retained 2025-2026 source set: Deep Robotics current and aspirational marks, closest Chinese legged-robot peers, one listed China benchmark, and ceiling-style strategic comparables.'
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Deep Robotics current private/media corridor
    - 2025 revenue vs reported private marks
    - ~$1.1B at Caixin-style 8bn yuan (~22x sales) to >$1.5B at 10bn+ yuan (~28x sales)
    - Best anchor for present entry discipline because it uses the company’s own disclosed revenue base
    - Still mixes late-2025 private context with 2026 media summaries rather than a signed priced round
  - - Deep Robotics aspirational IPO headline
    - 2025 revenue vs post-listing expectation
    - ~$3.5B headline (~70x trailing sales)
    - Shows the upside narrative underwriting some media coverage
    - Looks far richer than current proof supports for a company with one sold humanoid unit in 2025
  - - Unitree private-to-IPO path
    - 2025 revenue and private / IPO marks
    - '>12bn yuan post-Series C and ~$7B targeted STAR IPO on ~$248M 2025 revenue'
    - Closest China legged-robot comp with stronger scale and broader humanoid narrative
    - Targeted IPO value is not the same as realized pricing and already embeds market optimism
  - - UBTECH public benchmark
    - 2025 turnover and market value
    - RMB 2.001B 2025 turnover with roughly ~$7B valuation reference
    - Provides a listed Chinese benchmark for how public markets price robotics scale
    - Business mix is broader than Deep Robotics and the market cap reference is not a point-in-time run-date quote
  - - Boston Dynamics strategic ceiling
    - Latest strategic valuation reference
    - ~$25B analyst estimate; Hyundai acquisition was $1.1B in 2021
    - Shows how much optionality a category leader can attract when backed by a global industrial parent
    - Not a clean direct comp for an inspection-focused private Chinese issuer
  - - Skild AI software premium
    - Latest financing valuation
    - ~$4.5B Series B valuation for a robotics foundation-model company
    - Illustrates how the market currently over-rewards software and AI optionality relative to hardware-first players
    - Software-first AI is not a like-for-like multiple for Deep Robotics
  notes: Mixed public, private, and targeted values are shown because the retained source set is the real market context investors would encounter. Derived sales multiples use disclosed 2025 revenue where available.
