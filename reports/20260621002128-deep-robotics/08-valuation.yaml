- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Current cap table and preference stack
    - Latest post-money, liquidation preferences, anti-dilution terms, and any investor side letters
    - Entry economics can change dramatically even if the headline valuation looks unchanged
    - Request full cap table, financing documents, and counsel review before pricing any round
  - - VAM / special shareholder rights
    - Exact triggers, economics, and parties affected if the IPO process stalls
    - Prospectus-era summaries already warn that investor rights can revive on IPO failure
    - Obtain the signed shareholder agreements and underwriter/legal memo
  - - Quality of revenue
    - Recurring service share, warranty burden, realized discounting, and repeat-order cohorts by product family
    - 2025 margin and profit only matter if they survive scale and support obligations
    - Demand product-line P&L, cohort retention, and service attachment analysis
  - - Customer concentration
    - Revenue concentration across State Grid, Southern Power Grid, overseas utilities, and other large accounts
    - A concentrated industrial base can magnify both upside and downside at listing
    - Request top-10 customer schedule and concentration commentary from management
  - - Humanoid commercialization
    - Pipeline, signed orders, unit economics, and attach rates beyond the single disclosed 2025 sale
    - Aggressive valuation cases implicitly pay for humanoid upside
    - Require signed pipeline detail and manufacturing-readiness review
  - - IPO readiness and price discovery
    - Underwriter feedback, indicative pricing range, float, cornerstone appetite, and listing timeline
    - The difference between a private mark and a marketed IPO can be hundreds of millions of dollars
    - Run direct banker diligence and compare with public-peer trading windows
  notes: These asks are prioritized around evidence that can most quickly change the investment call or the acceptable entry price.
