- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - IPO process stalls or reprices sharply lower
    - Tutoring/accepted-filing momentum fails to convert into a marketed deal, or the priced deal implies a major haircut to media expectations
    - Confirms that current headline marks overstated market appetite or cap-table quality
    - Downgrade from track to avoid until a new clean entry price is available
  - - 2026 growth slows while humanoid spend rises
    - Evidence of materially weaker growth versus 2025 with no offsetting software or humanoid revenue proof
    - Breaks the idea that the company can fund optionality from a compounding industrial base
    - Move to bear-case underwriting and demand hard downside protection
  - - Gross margin falls materially below 2025 level
    - Sustained retreat from 52.83% without a compensating mix or scale explanation
    - Suggests 2025 profitability was transitory or heavily mix-driven
    - Re-rate toward lower hardware multiples
  - - Export-control or procurement barriers tighten
    - New restrictions reduce access to foreign critical-infrastructure or advanced-compute pathways
    - Raises the discount rate and shrinks the realistic overseas TAM
    - Assume lower exit multiple and slower international penetration
  - - Humanoid commercialization remains negligible
    - No meaningful multi-unit humanoid revenue or repeat deployments after the IPO process advances
    - Removes the optionality premium embedded in aggressive marks
    - Value the company primarily as an industrial quadruped and wheel-legged hardware vendor
  notes: Each trigger is intended to be monitorable between now and any priced transaction, not merely descriptive.
