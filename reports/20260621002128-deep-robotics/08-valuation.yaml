- id: recommendation-and-scenarios
  title: 'The evidence supports a track recommendation: buyable near disciplined private marks, speculative at aggressive IPO headlines'
  body: The key valuation question is not whether Deep Robotics is a good company in the abstract. It is whether the currently observable price corridor leaves room for attractive risk-adjusted returns. On trailing 2025 revenue of roughly $49.5-49.6 million, the December 2025 Caixin-style RMB 8 billion mark already implies around 22x sales. A north-of-RMB-10-billion interpretation pushes the company toward roughly 28x sales, effectively Unitree-style territory despite materially smaller scale and much less humanoid proof. A $3.5 billion post-listing headline would imply roughly 70x trailing sales, which is closer to software-style or speculative-humanoid-optionality pricing than to evidence-supported industrial robotics. That does not make the company uninvestable. It means valuation needs scenario discipline. In a bear case, hardware multiple compression, IPO delay, or margin normalization could drag fair value well below recent private headlines. In a base case, continued industrial growth
    plus credible but still early humanoid optionality can justify a low- to mid-$1 billions range. In a bull case, Deep Robotics would need not just continued quadruped execution, but sustained 2026 growth, stable high gross margins, and real evidence that humanoids can become a repeatable business rather than a narrative extension. That is why the recommendation is track rather than buy. There is enough proof to stay interested, but not enough to underwrite the most aggressive marks without demanding a sharper entry price or deeper diligence.
