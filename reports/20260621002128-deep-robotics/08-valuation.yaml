- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument type
  - argument
  - what would change the view
  rows:
  - - Thesis
    - Deep Robotics has already proven that industrial quadrupeds can generate real revenue, real profit, and real deployment ROI in hazardous environments.
    - Publish repeat-order cohorts, service attach, and customer concentration data showing 2025 was not a one-off margin spike.
  - - Thesis
    - The company is closer to liquidity than most robotics startups because tutoring is complete and the STAR Market application has already been accepted.
    - Provide final approval milestones, underwriter price guidance, and post-listing float/liquidity assumptions.
  - - Thesis
    - Industrial proof plus early humanoid optionality can justify a premium to plain hardware comps if 2026 execution stays strong.
    - Show multi-unit humanoid sales, not just one high-ASP proof transaction, plus sustained high gross margins.
  - - Anti-thesis
    - Public valuation evidence is inconsistent and may be mixing private marks, media expectations, and aspirational post-listing outcomes.
    - Release a tighter current post-money reference or banker-backed pricing range.
  - - Anti-thesis
    - Deep Robotics is still much earlier than the most expensive robotics comps on humanoid commercialization and software monetization.
    - Demonstrate that humanoids, software, or services contribute meaningfully to recurring economics rather than to story value only.
  - - Anti-thesis
    - Geopolitical and market-access risks mean a Chinese industrial-robotics issuer may deserve a discount versus Western or listed Chinese peers, not a premium.
    - Provide evidence of durable overseas enterprise demand in less geopolitically sensitive channels and clarify export-compute resilience.
  notes: 'The chapter is price-sensitive by design: company quality and valuation support are judged separately.'
