- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bear
    - IPO timing slips, industrial growth normalizes, humanoid commercialization stays narrative-level, and margin falls back from 2025 highs.
    - Supportable equity value falls to roughly $450M-$900M; entry at late-2025 or richer marks would face clear downside.
    - Multiple compression, export-control friction, competition from Unitree and public-market fatigue.
    - Credible if 2026 growth slows materially or if margins retreat while capex remains high.
  - - Base
    - Industrial quadruped and Lynx growth continue, profit remains positive but volatile, and humanoid optionality stays early rather than transformative.
    - Supportable equity value clusters around roughly $800M-$1.6B; disciplined participation is plausible only near the low end of recent media marks.
    - Need to sustain execution without relying on a software-like re-rating.
    - Best fit with the currently observable evidence set.
  - - Bull
    - Deep Robotics sustains hyper-growth, keeps gross margin near current levels, clears IPO smoothly, and turns humanoids into a repeatable commercial platform.
    - Supportable value reaches roughly $1.8B-$3.0B, leaving only partial support for the most aggressive $3.5B headline.
    - Requires unusually strong 2026 proof on scale, margin, and new-form-factor traction.
    - Possible, but dependent on evidence that is not yet public.
  notes: Scenario ranges are supportable-value guardrails derived from public evidence, not forecasts of the final IPO price.
