  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: Full current cap table, investor preference stack, VAM language, anti-dilution terms, and liquidation waterfall.
    whyItMatters: Headline valuation can look acceptable while common-equity outcomes remain unattractive because of hidden senior rights.
    diligencePath: Obtain financing documents and have counsel map control, downside, and IPO-failure economics.
    relatedQuestionRefs:
    - QV004
    - QV030
  - type: private-evidence-only
    severity: material
    topic: quality-of-revenue
    missingEvidence: Product-line repeat-order cohorts, service attach rates, warranty costs, and realized discount schedules.
    whyItMatters: The base and bull cases depend on 2025 profitability being durable rather than mix- or launch-driven.
    diligencePath: Request cohort tables, support P&L, and top-customer revenue bridges from management.
    relatedQuestionRefs:
    - QV008
    - QV009
    - QV030
  - type: conflicting-data
    severity: material
    topic: valuation-dispersion
    missingEvidence: A banker-backed current price range or signed recent post-money reference that reconciles the 8bn yuan, 10bn+ yuan, and $3.5B narratives.
    whyItMatters: The investment call is price-sensitive; unresolved valuation dispersion makes return underwriting unreliable.
    diligencePath: Ask the sponsor bank or management for current valuation guidance, expected float, and pricing assumptions.
