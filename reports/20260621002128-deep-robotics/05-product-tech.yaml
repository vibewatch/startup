  - id: roadmap-and-technical-risks
    title: The roadmap is credible from quadrupeds into embodied navigation and humanoids, but commercialization proof thins quickly outside core inspection
    body: >-
      The 2025 roadmap on the official surface shows real shipping progress rather than a vague future promise. Deep Robotics launched Lynx M20 in
      April, expanded utility and rescue case studies through mid-2025, unveiled DR02 in October as an industrial humanoid, and then used the
      December Series C announcement to tie products, DeepVLA 1.0, and an embodied-AI pilot production base into one scaling narrative. The same
      announcement also says new capital will fund more R&D, more talent, and continued quadruped plus humanoid development, which implies the
      company does not view humanoids as a side project.

      The main technical risk is not whether the robots can move; it is whether Deep Robotics can turn a strong locomotion and perception base into
      durable, supportable, and governable production systems across many geographies and product families. DR02 is still early in that respect:
      public evidence centers on product pages and expo demonstrations rather than named production deployments or public SDKs. DeepVLA 1.0 is
      strategically important, but the reviewed corpus still shows it mainly as a company-claimed enabling layer, not a publicly benchmarked field
      system. And while the company is clearly thinking about clustered robot-dog, drone, and fixed-sensor operations, the open-source and public
      documentation are materially stronger for Lite3 and M20 than for the entire commercial fleet. The technology thesis is therefore positive,
      but diligence should underwrite supportability, data governance, and deployment repeatability at least as hard as raw motion capability.
