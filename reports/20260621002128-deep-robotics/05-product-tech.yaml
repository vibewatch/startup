  - id: architecture-and-developer-stack
    title: The core architecture is a full-stack perception-to-actuation system, with the most concrete public proof in the developer stack
    body: >-
      Deep Robotics' most credible technology claim is not any single speed or payload number; it is the coherence of the stack the company has
      exposed across product pages, GitHub repositories, and later 2025 announcements. The corporate description and Series C release use the
      same "perception-decision-action" framing, while DeepVLA 1.0 adds a more explicit software layer: open-vocabulary semantic point clouds,
      large language model command parsing, and a topological road network for multi-floor door-to-door navigation. On the hardware side, public
      pages expose a consistent pattern of multimodal sensing, onboard compute, modular payload mounting, and ruggedized locomotion. Lynx M20 is
      the clearest example because its official page publishes dual industrial processors, dual 96-line LiDARs, dual wide-angle cameras, Ethernet,
      hot-swap batteries, and OTA upgrades in one SKU.

      The developer surface is stronger than for many private robotics companies. DeepRoboticsLab publishes robot models in MJCF/URDF/USD,
      IsaacLab-based reinforcement-learning environments for Lite3 and M20, a ROS2 deployment SDK, and CAN-level joint control for J60 modules.
      Lite3 documentation on the U.S. site goes further by describing ROS1/ROS2 support, Motion SDK access, LiDAR SLAM examples, Jetson-based
      perception hosts, and sim-to-real reinforcement-learning workflows. That matters for diligence because it turns the product from a closed
      appliance into a platform that customers, universities, and integrators can extend. The caveat is scope: the open ecosystem is deepest for
      Lite3 and newer platforms, while X20/X30/DR02 remain much more marketing-page-visible than SDK-visible.
