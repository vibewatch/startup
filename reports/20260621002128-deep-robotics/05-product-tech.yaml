  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cybersecurity-and-quality-certifications
      missingEvidence: Public certificate numbers, issuing bodies, or audit summaries for cybersecurity, quality-management, or industrial safety certifications.
      whyItMatters: Infrastructure and public-safety buyers often need formal assurance artifacts that go beyond ingress ratings and marketing reliability claims.
      diligencePath: Request ISO, cyber, and product-safety certificate packs plus the exact scopes that cover each SKU and software environment.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: deepvla-production-proof
      missingEvidence: Independent customer-side proof that DeepVLA 1.0 is deployed in production routes with measurable autonomy or labor outcomes.
      whyItMatters: DeepVLA is the clearest software-moat claim, but public evidence still reads more like a platform announcement than a field-benchmarked system.
      diligencePath: Ask for named customer deployments, before-and-after route metrics, and architecture diagrams showing how DeepVLA is integrated into live operations.
      relatedQuestionRefs:
        - QE019
    - type: private-evidence-only
      severity: material
      topic: dr02-production-maturity
      missingEvidence: Named production deployments, uptime metrics, and support documentation for DR02.
      whyItMatters: Humanoids can widen TAM and valuation narrative, but without production proof they remain roadmap risk rather than validated product revenue.
      diligencePath: Request customer references, paid pilot conversion rates, deployment footage, and the commercial support package for DR02.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: minor
      topic: commercial-fleet-developer-surface
      missingEvidence: Public SDK, integration, and fleet-management documentation for X20, X30, and DR02 comparable to the Lite3 and M20 surfaces.
      whyItMatters: A shallow public integration surface can slow partner adoption and makes the company's openness appear narrower than its portfolio breadth.
      diligencePath: Request customer integration manuals, API references, and fleet software documentation for non-Lite commercial SKUs.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE003
