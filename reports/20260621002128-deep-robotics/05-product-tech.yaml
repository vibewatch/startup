  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job
      - current workflow
      - company solution
      - measurable benefit
      - limitation
    rows:
      - - UHV and substation inspection
        - Human patrols inspect meters, switches, thermal conditions, and partial-discharge signals in dangerous terrain
        - X30 and Lynx M20 carry cameras, thermal inspection, LiDAR, and autonomous navigation into hard-to-reach routes
        - Official cases cite >95% detection accuracy, 96.5% recognition accuracy, ~70% O&M cost reduction, and >50% efficiency gain
        - Metrics are company-claimed and site-level cost baselines are not publicly disclosed.
      - - Underground tunnel inspection
        - Workers walk long cable tunnels to spot cracks, seepage, leaks, and thermal anomalies
        - X30 SPock performs route patrol, defect capture, and report generation in Singapore Power tunnels
        - SP Group expects wider rollout and about 480 manual hours saved annually
        - Public evidence does not quantify robot downtime, false positives, or maintenance labor.
      - - Security patrol
        - Guards patrol large campuses or market complexes with incomplete visibility and variable response speed
        - Robot dogs add loudspeaker, identification, data collection, following, and continuous route patrol
        - Xining police and Yiwu market examples show 24/7 patrol positioning and risk detection
        - Procurement, privacy, and public-space operating rules remain lightly documented.
      - - Emergency rescue and firefighting
        - Teams need terrain access, gas/thermal awareness, and lower human exposure in unstable zones
        - Lynx M20 and X30 pair mobility, dual-light imaging, gas sensors, and sometimes drone coordination
        - Official drill evidence shows air-ground collaboration and remote hazard sensing
        - Marketing overweights scenario breadth relative to public after-action performance data.
      - - Education and developer research
        - Labs need an SDK-ready quadruped for locomotion, perception, and sim-to-real experiments
        - Lite3 variants expose ROS, SDK, motion/perception development, and RL deployment resources
        - Multiple official docs and GitHub repos show a genuine secondary-development surface
        - This is the deepest public tooling lane, but it is not the same as large-scale industrial fleet proof.
    notes: >-
      Benefit metrics mix official case-study numbers with one independently reported Singapore labor-saving figure; readers should not assume all workflows have the same ROI.
    claimRefs:
