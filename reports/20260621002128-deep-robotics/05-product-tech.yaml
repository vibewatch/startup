  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer or component
      - role
      - public evidence
      - key dependency
      - main risk
    rows:
      - - Mobility and mechanics
        - Legged and wheel-legged locomotion provide terrain access where wheeled robots and humans struggle
        - X20, X30, Lynx M20, Lynx S10, DR01, and DR02 pages all emphasize stairs, slopes, and obstacle handling
        - Joint power density, gait algorithms, and rugged chassis durability
        - Real field durability may diverge from lab-tested spec sheets.
      - - Perception stack
        - Cameras, LiDAR, gas sensors, and thermal payloads generate the scene understanding required for inspection and rescue
        - X30 dark-environment perception, Lynx M20 dual 96-line LiDAR, and Lite3 perception manuals are public
        - Sensor calibration, environmental robustness, and payload integration
        - Public benchmarking is thin outside company cases.
      - - Onboard compute
        - Embedded processors run navigation, perception, and control close to the robot
        - Lynx M20 publishes dual industrial processors; Lite3 publishes RK3588 plus Jetson Xavier NX on higher variants
        - Thermal budget, power draw, and software optimization
        - Public docs do not show fleet-scale failure modes or compute utilization.
      - - Autonomy and navigation software
        - Planning, obstacle avoidance, terrain recognition, semantic navigation, and report generation convert hardware into workflow value
        - Company pages describe perception-decision-action architecture and DeepVLA 1.0 semantic navigation
        - High-quality mapping, state estimation, and site-specific tuning
        - DeepVLA production performance is still company-claimed rather than independently benchmarked.
      - - Developer and integration layer
        - SDKs, URDF/MJCF/USD models, ROS bridges, and RL environments let users extend the robots or build internal tooling
        - GitHub exposes rl_training, sdk_deploy, deep_robotics_model, and Deep_Motor_SDK
        - Repository maintenance, documentation quality, and model coverage by SKU
        - Public tooling is much deeper for Lite3 and M20 than for the full commercial fleet.
      - - Service and lifecycle layer
        - Hot-swap batteries, optional autonomous charging, modular quick-detach limbs, and remote/OTA updates support long-lived deployment
        - Lynx M20 and DR02 pages explicitly position these features as operational enablers
        - Spare parts, support geography, and trained field-service coverage
        - Mainland-only after-sales terms and broad warranty exclusions constrain external trust.
    notes: >-
      Architecture rows separate what is explicitly documented from what still requires customer diligence; no public source reviewed here exposes a full fleet-management or cloud-control manual.
