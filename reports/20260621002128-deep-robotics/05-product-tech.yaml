  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - control or signal
      - status
      - scope
      - evidence
      - gap or risk
    rows:
      - - Ingress and environment ratings
        - Publicly documented
        - X20 IP66, X30 IP67, Lynx S10 IP66, Lynx M20 IP66, DR02 IP66, with broad -20°C to 55°C ranges on higher-end models
        - Official product pages and product articles
        - Ratings help, but public certification bodies and test reports are not shown.
      - - Modular serviceability
        - Publicly documented for DR02 and partially for Lynx M20
        - Quick-detach limbs on DR02, hot-swap batteries and optional autonomous charging on Lynx M20
        - Product pages and utility case studies
        - No public MTBF, spare-part SLA, or field-service metrics.
      - - Reliability claims
        - Mixed
        - Lynx S10 says its body passed rigorous reliability tests; utility cases claim >95% detection accuracy
        - Product page plus official case studies
        - Test protocol, sample size, and audit methodology are not published.
      - - Data and privacy handling
        - Publicly documented but broad
        - Logs, time, location, device configuration, and IP address can be collected and disclosed under legal requirements
        - Official privacy terms
        - Cross-border infrastructure buyers will likely require tighter contractual controls.
      - - Warranty and operating boundaries
        - Publicly documented and restrictive
        - Warranty excludes self-modification, unofficial repair, harsh interference, water/debris ingress, chemical damage, and some extreme-use scenarios
        - Official support terms and Lite3 disclaimer page
        - Marketing use cases extend into hazardous scenarios that the terms partially disclaim.
      - - Global service coverage
        - Weakly documented
        - The reviewed after-sales policy explicitly says it applies only in mainland China
        - Official support terms
        - Overseas fleet support, parts stocking, and escalation paths remain a diligence item.
    notes: >-
      The table focuses on public operating-control evidence only; absence of published ISO-style certificates or cyber attestations is treated as an evidence gap, not a confirmed negative fact.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
