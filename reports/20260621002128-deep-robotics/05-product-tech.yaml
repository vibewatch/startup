company:
  name: Deep Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Deep Robotics now has a real, segmented product stack rather than a single robot-dog demo: X20/X30 cover rugged quadruped inspection,
    Lynx M20 and Lynx S10 extend the wheel-legged line, Lite3 anchors the developer and research surface, and DR02 is the company's first
    clearly industrialized humanoid. The important correction is that the brief's "L20" appears wrong in the reviewed corpus: official product
    pages expose X20 and Lynx M20, not an L20 SKU.
sections:
  - id: lineup-and-workflows
    title: The lineup is real, segmented by workflow, and the brief's "L20" label does not match public product surfaces
    body: >-
      The public product surface is now broad enough to underwrite Deep Robotics as a platform company, not just a one-model quadruped vendor.
      Official pages and late-2025 releases show four distinct lanes: the X series for industrial quadruped inspection, the Lynx series for
      wheel-legged operation in tighter or rougher terrain, the Lite3 family for education and developer use, and the DR humanoid line for
      industrial embodied-AI expansion. Within that stack, X20 remains the lighter industrial quadruped, X30 the more rugged flagship,
      Lynx M20 the heavier industrial wheel-legged robot, Lynx S10 the smaller wheel-legged robot for narrow spaces, Lite3 the open research
      platform, DR01 the expo-stage humanoid demonstrator, and DR02 the first product page that looks like a commercial humanoid offer.

      One briefing assumption does not survive source review: no reviewed official page, FAQ, GitHub surface, or third-party coverage names an
      "L20" model. The recurring names are X20 and Lynx M20, so the most defensible interpretation is that the brief meant one of those. The
      workflow split is also meaningful. Utilities and tunnel operators buy X-series or Lynx robots for patrol and defect detection; emergency
      teams buy terrain access plus gas, thermal, and imaging payload carriage; researchers buy Lite3 because it exposes ROS, SDK, and sim-to-real
      tooling. That segmentation makes the portfolio easier to map to actual budgets and deployment motions than a generic "robot dog" story.
