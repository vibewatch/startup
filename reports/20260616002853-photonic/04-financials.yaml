- id: TI005
  title: Public financial gaps table
  columns:
  - missing metric
  - impact on judgment
  - exact diligence path
  rows:
  - - Current ARR / trailing-twelve-month revenue
    - Without a clean denominator, valuation and revenue-quality judgment remain fragile
    - Request monthly recognized revenue for the last 24 months and backlog by product line
  - - Revenue-recognition split between grants, pilots, services, and systems
    - Program support can be misread as commercial traction if the mix is not disclosed
    - Request accounting-policy memo plus revenue waterfall by stream
  - - Realized pricing and contract duration
    - No way to test pricing power, discounting, or renewal durability
    - Request top 20 customer contracts with ACV, term, renewals, and cancellation rights
  - - Paying-customer count and concentration
    - The business could still be dependent on a handful of strategic buyers
    - Request live paying-customer count and top-10 revenue concentration
  - - Gross margin by stream
    - Margin path cannot be distinguished between software, services, and hardware heavy delivery
    - Request COGS bridge and stream-level gross margin
  - - Monthly burn and runway
    - Capital adequacy cannot be converted into time without this
    - Request current cash, monthly cash burn, and runway sensitivity cases
  - - Capex versus opex split for labs, cryogenics, and networking hardware
    - Required to understand how much spend is one-time build versus recurring burden
    - Request FY2026-FY2028 capex plan and depreciation assumptions
  - - Bookings / backlog / remaining performance obligations
    - Needed to compare Photonic with public peers that disclose contracted future revenue
    - Request committed backlog, expected recognition timing, and churn or slippage history
  - - Working-capital profile and milestone payment timing
    - Large hardware or government programs can distort near-term cash generation
    - Request DSO, deferred revenue, milestone billing terms, and any customer prepayments
  - - Government-program dependency
    - Needed to know whether private-market valuation rests on subsidized R&D rather than repeat market demand
    - Request share of engineering spend and revenue tied to CQCP, IDEaS, DARPA, or adjacent programs
  notes: Each row is written as a concrete data-room request so the chapter can turn public opacity into an actionable diligence checklist.
