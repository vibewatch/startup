- id: TI004
  title: Capital adequacy table
  columns:
  - input
  - public figure / status
  - implication
  - confidence
  - diligence ask
  rows:
  - - 2026 financing size
    - '>$200M USD ($275M CAD)'
    - Large enough to fund a meaningful next phase of hiring, labs, and commercialization
    - high
    - Provide draw timing, capital allocation, and closing-cost detail
  - - Lifetime capital raised
    - '>$350M USD ($475M CAD)'
    - Places Photonic among the most heavily funded private quantum companies in Canada
    - high
    - Provide round-by-round post-money and share-count bridge
  - - Post-money valuation
    - $2B USD ($2.7B CAD)
    - Explains why investors need stronger revenue-quality proof than the public record currently provides
    - high
    - Provide valuation methodology, preference stack, and any ratchet or liquidation terms
  - - CQCP support
    - Up to CA$23M
    - Meaningful non-dilutive support, but still small relative to the 2026 equity round and overall build cost
    - high
    - Disclose milestone schedule and whether support is recognized as revenue, contra-expense, or deferred funding
  - - IDEaS support
    - Initial CA$1M grant
    - Helpful targeted support for networking work, but not transformative versus total spend needs
    - high
    - Disclose follow-on milestone potential and matching-spend requirements
  - - Disclosed cash on hand
    - 'null'
    - The biggest remaining blocker to underwriting exact runway
    - high
    - Provide current cash, restricted cash, and marketable-securities balances
  - - Disclosed monthly burn
    - 'null'
    - Without burn, the raise cannot be converted into runway months
    - high
    - Provide GAAP and cash burn, with R&D versus SG&A split
  - - Disclosed runway months
    - 'null'
    - Management commentary about runway cannot be stress-tested externally
    - high
    - Provide management base-case runway and covenant / milestone dependencies
  - - Use of proceeds
    - Milestones, team growth, labs, and partnerships
    - Confirms that the raise is for execution and scale-up, not just balance-sheet defense
    - high
    - Provide budget by lab build-out, hiring, partner programs, and customer delivery
  - - Growth commitments
    - "70 commercialization hires mentioned in January; 170 to >200 headcount plan in May; >£25M UK facility over three years"
    - These commitments imply continued cash consumption before broad commercial proof
    - medium
    - Provide phased hiring plan, facility capex/opex split, and breakeven utilization assumptions
  - - Next-round trigger
    - Management said January could be the last round to cash-flow positive and May gave runway to stay private for now
    - Encouraging signal, but not a substitute for actual cash and burn disclosure
    - medium
    - Provide explicit trigger metrics for raising again or moving to public markets
