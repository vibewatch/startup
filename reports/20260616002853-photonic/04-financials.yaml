- id: traction-and-unit-economics
  title: Public traction and unit-economics proxies
  body: The cleanest traction read is that commercialization is real but still narrow. Photonic moved from 150-plus employees at the January first close to 160-plus at the May final close, while BetaKit described a 170-person team and plans to grow above 200. That hiring profile, combined with only single-digit-millions revenue, points to a business still being built ahead of scale rather than a company already harvesting operating leverage. Because Photonic does not publish gross margin, CAC, payback, retention, backlog, or customer concentration, the best available unit-economics lens comes from public quantum peers. IonQ has already reached much larger revenue, but it still posted a very large adjusted EBITDA loss; Rigetti and D-Wave remain low-revenue, loss-making, and liquidity dependent; Xanadu's first public quarter also paired modest revenue with a meaningful loss and a fresh capital-raising facility. Those peers do not prove Photonic will follow the same path, but they do show that
    capital intensity and delayed margin realization are normal in this category. The underwriting conclusion is that public traction exists, yet revenue quality is still being inferred through partner, program, and hiring signals rather than through directly disclosed operating metrics.
