- id: TI003
  title: Unit economics table
  columns:
  - metric
  - value / status
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Public revenue baseline
    - Single-digit millions as of January 2026
    - low
    - Establishes that commercialization has started, but the absolute scale is still very small relative to valuation and team size
    - Provide audited trailing-twelve-month revenue and quarter-by-quarter bookings
  - - Forward revenue ambition
    - Tens of millions next year
    - low
    - Shows management targets, but not contracted demand
    - Provide pipeline conversion assumptions behind the target
  - - Team-size load
    - 150+ official in January; 160+ official in May; ~170 in BetaKit with plan for >200
    - medium
    - A rising fixed-cost base can outrun early revenue if utilization and customer conversion lag
    - Provide monthly headcount by R&D, G&A, and commercial functions
  - - Revenue-per-employee proxy
    - 'null'
    - high
    - Public revenue timing basis is too unclear to compute a defensible ratio, but the direction is obviously low for a 160-170+ person company
    - Clarify whether the disclosed revenue figure is quarterly, annualized, or cumulative and provide internal revenue per employee
  - - Gross margin
    - 'null'
    - high
    - Without gross margin, investors cannot distinguish software-like economics from hardware- or services-heavy delivery
    - Provide gross margin by compute services, networking, and program-funded work
  - - Burn / runway
    - 'null'
    - high
    - Capital adequacy cannot be underwritten without burn and runway
    - Provide current cash, monthly burn, and base / upside / downside runway cases
  - - Peer loss intensity
    - Public peers range from roughly 1.5x to 11.3x loss intensity versus quarterly revenue
    - medium
    - Peers show that even visible revenue can coexist with large operating losses in quantum
    - Benchmark Photonic's internal burn-to-revenue profile against peer ranges
  - - Public support offset
    - Identified non-dilutive support is CA$24M versus a CA$275M 2026 equity round
    - high
    - Government support helps but does not change the fact that equity capital is the dominant funding source
    - Show what share of engineering payroll or capex the public programs actually cover
  notes: Nulls are deliberate where the public record is insufficient. Derived peer ratios use reported quarterly loss and revenue figures as directional proxies, not a substitute for Photonic's own unit-economics reporting.
