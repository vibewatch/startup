- id: cost-structure-and-capital-adequacy
  title: Cost structure, capital intensity, and adequacy of funding
  body: "Photonic's architecture points to a cost stack that should be analyzed more like deep-tech infrastructure than like lightweight software. The company highlights cryogenic quantum-processing hardware, integrated photonic switches, telecom-fibre networking, and a software-and-control layer that manages entanglement, scheduling, and error correction. Management also directed 2026 financing toward milestones, labs, team growth, and partnerships, while separately announcing a UK R&D facility that will absorb more than £25 million across three years. Non-dilutive support helps, but it is modest relative to the overall build. CQCP contributes up to CA$23 million and IDEaS adds an initial CA$1 million grant, while the 2026 equity round itself exceeded US$200 million and lifetime capital surpassed US$350 million. That funding stack is enough to treat near-term capital adequacy as credible, especially because management said the January round could be the last one needed to reach cash-flow\
    \ positivity and later said the final close lets the company remain private for now. The problem is verification: none of the reviewed public sources disclose exact cash on hand, monthly burn, runway months, capex commitments, or working-capital profile, so adequacy remains a directional judgment rather than a fully underwritten one."
