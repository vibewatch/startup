- id: financial-verdict-and-gaps
  title: Financial verdict and diligence blockers
  body: 'The final financial verdict is mixed but investable with conditions. Revenue quality is still low to medium because public evidence stops at a management-reported single-digit-millions number, unnamed journey customers, and indirect channel or program proof. Margin path is conceptually attractive because Photonic argues that QLDPC codes and telecom-native networking cut qubit overhead and scaling cost, but that remains an engineering claim rather than a disclosed gross-profit bridge. Capital adequacy looks materially better than the disclosure profile: the company clearly has a large fresh equity cushion plus some non-dilutive program support, yet it has not shown the cash, burn, or runway data needed to prove that this is truly the last major private round before self-funding. Public quantum peers strengthen the caution. Even companies with much deeper liquidity and more transparent reporting still show heavy losses or fresh financing dependence. As a result, the best underwriting
    stance today is that Photonic has enough capital to keep executing, but not enough public transparency to underwrite durable revenue quality, margin progression, or exact next-round risk without management-level data-room access.'
