- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - current public status
  - likely unit
  - quality
  - diligence ask
  rows:
  - - Quantum-computing services
    - Sell compute capability to enterprises and, eventually, governments rather than only sell full machines
    - Management said revenue is in the single-digit millions with initial journey customers
    - Contracted service revenue / usage-backed program spend
    - 'Low-to-medium: model is explicit, scale is not'
    - Provide top 20 contracts, start dates, minimum commitments, and revenue-recognition basis
  - - Cloud / platform distribution
    - Integrate Photonic hardware and networking capability into Azure Quantum Elements and partner channels
    - Azure integration path is public, but no booked revenue or channel economics are disclosed
    - Platform contract / usage share
    - 'Low: route to market is visible, economics are opaque'
    - Disclose whether Azure is pilot, paid integration, or booked commercial demand
  - - Quantum networking products
    - Potential repeaters, switches, and QKD-style solutions on top of telecom-compatible networking
    - Product family is public, but no customer, SKU, or pricing disclosure was reviewed
    - Project / system / network contract
    - 'Low: product family is real, monetization timing is unclear'
    - Provide paid pilot list, product roadmap, and first commercial shipment targets
  - - Government benchmarking and defence work
    - CQCP, DARPA-related commitments, and IDEaS-backed networking work can support milestone revenue or non-dilutive funding
    - Programs are public, but revenue recognition versus support funding is not disclosed
    - Milestone payments / grants / reimbursable work
    - Medium for existence, low for accounting treatment
    - Break out grant revenue, contract revenue, and deferred program milestones
  - - Custom pilot / strategic customer commitments
    - Named partner and customer commitments suggest bespoke early deployments rather than standardized volume contracts
    - Official release cites commitments to customers but not contract count or concentration
    - Pilot or milestone contract
    - 'Low: active commitments exist, but repeatability is unproven'
    - Provide paying-customer count, average contract value, and concentration of top five customers
  notes: Rows separate publicly described monetization surfaces from actually disclosed revenue. Where accounting treatment is not stated, the table uses cautious language rather than assuming recurring software revenue.
