  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Exact cash on hand, monthly burn, and management runway cases.
    whyItMatters: Without these numbers, investors cannot convert the 2026 financing into time-to-next-funding or test management's cash-flow-positive claim.
    diligencePath: Request the latest monthly cash bridge, board reporting pack, and base / upside / downside runway model.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, contract duration, discounting, and renewal structure by revenue stream.
    whyItMatters: Revenue quality cannot be judged from a topline number alone when pricing power and contract durability are missing.
    diligencePath: Request top customer contracts, ACV / TCV summaries, pricing schedules, and renewal or termination terms.
    relatedQuestionRefs:
    - QI007
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and cost-of-delivery split across compute services, networking products, and program-funded work.
    whyItMatters: The core margin thesis depends on whether Photonic is becoming more software-like or remaining delivery-heavy.
    diligencePath: Request a stream-level gross-margin bridge plus the cost categories rolled into COGS.
    relatedQuestionRefs:
    - QI013
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Paying-customer count, concentration of top accounts, and the share of revenue tied to programs versus repeat commercial users.
    whyItMatters: A later-stage valuation can look very different if most revenue still comes from a few strategic or subsidized engagements.
    diligencePath: Request customer cohort tables, top-10 revenue concentration, and a split between government, partner, and enterprise demand.
    relatedQuestionRefs:
    - QI006
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: minor
    topic: revenue-recognition
    missingEvidence: A source that clearly explains how program funding, pilot milestones, and commercial services are recognized in revenue.
    whyItMatters: The chapter can describe monetization surfaces, but not the exact accounting quality of growth.
    diligencePath: Request audited revenue-recognition policy language and the monthly bookings-to-revenue waterfall by stream.
    relatedQuestionRefs:
    - QI001
    - QI015
    relatedTableRefs:
    - TI001
    - TI005
