callouts:
- calloutType: risk
  title: Capital is abundant; proof is not
  body: Photonic has raised enough capital to keep building, but the public pack still does not reveal cash, burn, runway, gross margin, or customer concentration. The valuation therefore rests more on technical promise and partner confidence than on fully visible financial quality.
  claimRefs:
  - CI021
  - CI024
  - CI043
  - CI045
- calloutType: insight
  title: Public peers are the best current cost proxy
  body: IonQ, Rigetti, D-Wave, and Xanadu all show that quantum revenue can coexist with very large losses or fresh financing needs. Until Photonic opens its own margin and burn data, peer disclosures are the clearest external proxy for sector economics.
  claimRefs:
  - CI027
  - CI029
  - CI032
  - CI036
  - CI038
  - CI039
  - CI045
