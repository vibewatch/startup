- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating assumption
  - Valuation logic
  - Indicative value range
  - Probability signal
  - Main trigger
  rows:
  - - Bear
    - Revenue growth remains modest, public quantum multiples compress, and the next financing requires a reset below today's mark.
    - 80x-120x on a still-small revenue base or a fallback toward lower private comparable territory.
    - $0.8B-$1.2B
    - '~25%: credible if commercialization timing slips or public peer sentiment breaks'
    - Missed scale milestones or a down-round financing process
  - - Base
    - Photonic stays private, advances technical milestones, and grows commercial proof gradually but not explosively.
    - The current round remains roughly fair because the company keeps strategic scarcity but still lacks full revenue-quality disclosure.
    - $1.5B-$2.2B
    - '~50%: most consistent with current evidence'
    - Solid execution with only partial revenue and margin transparency
  - - Bull
    - Partner and government proof convert into repeatable commercial revenue, and investors continue paying a premium for photonic-quantum leadership.
    - Photonic keeps a valuation band closer to Xanadu and the stronger private cohort rather than drifting toward lower private marks.
    - $2.7B-$4.0B
    - '~25%: requires visible commercialization acceleration'
    - Durable revenue scaling, better margin evidence, and sustained premium peer multiples
  notes: These ranges are directional private-market screens rather than a DCF; they preserve uncertainty around revenue scale, margin path, and timing.
