    - TRACK / RESEARCH-MORE
    - Strong technology and funding signals exist, but public operating disclosure is still too thin for a clean buy call.
  - - Confidence
    - Medium
    - The numerator is well sourced, but the denominator still depends on management commentary and peer inference.
  - - Risk rating
    - High
    - Commercialization timing, multiple compression, and financing opacity can all impair the next mark.
  - - Valuation stance
    - Stretched but not uniquely irrational in the 2026 quantum cohort
    - Photonic sits below several public and private peer marks, yet still implies a very high revenue multiple on disclosed revenue.
  - - Decision implication
    - Wait for revenue-quality disclosure or a better entry
    - Public evidence supports follow-up diligence, not immediate price-insensitive conviction.
  - - Exit readiness
    - Stay private for now
    - Public peers remain volatile despite fuller disclosure, while Photonic still lacks a public margin and recurring-revenue bridge.
  notes: This table is an entry-discipline summary, not a verdict that Photonic lacks strategic value.
