  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: runway-proof
    missingEvidence: Exact cash on hand, monthly burn, hiring ramp cost, and runway sensitivity at the current operating plan.
    whyItMatters: Management commentary suggests the round could be enough, but investors still cannot test whether the company can truly stay private through the next milestone set.
    diligencePath: Request monthly cash bridge, cash-burn model, capex schedule, and downside runway scenarios from finance.
    relatedQuestionRefs:
    - QV005
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Fully diluted cap table, liquidation preferences, anti-dilution terms, and side letters for the 2026 financing.
    whyItMatters: The headline post-money valuation may not match the economic value available to new or common-equity investors.
    diligencePath: Request the post-close cap-table waterfall, preference stack summary, and investor rights schedule.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Customer count, top-customer concentration, stream-level gross margin, renewal behavior, and government versus enterprise revenue mix.
    whyItMatters: The current recommendation hinges on whether Photonic is building repeatable commercial demand or mostly milestone-heavy strategic work.
    diligencePath: Request a bookings-to-revenue bridge, top-10 customer table, revenue mix by stream, and gross-margin history.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage-tv004
    missingEvidence: A fuller disclosed set of private quantum valuations with comparable revenue, customer, and preference details for true apples-to-apples benchmarking.
    whyItMatters: TV004 is necessarily partial because the best retained peers disclose very different operating depths and only a subset of private rounds publish usable economics.
    diligencePath: Extend the comp pack with additional disclosed private round materials or banker screens before pricing a live transaction.
    relatedTableRefs:
    - TV004
