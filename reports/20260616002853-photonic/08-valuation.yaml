- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the most useful retained 2025-2026 public and private quantum valuation references for Photonic's current round; no perfect disclosed pure-play comparable exists.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Xanadu
    - June 2026 market cap after public listing
    - $4.16B market cap; publicly listed photonic quantum company
    - Closest photonic-architecture public numerator in the retained set
    - Market cap is current trading value, not a steady private round mark, and full operating economics are still evolving
  - - Nord Quantique
    - Spring 2026 private financing
    - $1.4B valuation after $30M growth equity round
    - Useful Canadian private comp showing investors still funding earlier-scale quantum players
    - Smaller round size and less public operating detail than Photonic
  - - Quantinuum
    - September 2025 private financing
    - $10B pre-money valuation after a $600M raise
    - Upper-bound private reference for scaled quantum leadership and commercialization narrative
    - Far larger platform, funding base, and maturity than Photonic
  - - PsiQuantum
    - September 2025 private financing
    - $7B valuation after a $1B Series E
    - Another photonic-quantum private mark showing how aggressively the market prices perceived category leaders
    - Funding scale and manufacturing ambitions exceed Photonic's public disclosure set
  - - IonQ
    - June 2026 market cap vs Q1 2026 revenue
    - $22.83B market cap; $64.7M Q1 revenue; $3.1B cash
    - Shows how high the public market will still price a leading disclosed quantum platform
    - Public-market enthusiasm and one-time accounting items make the valuation hard to treat as a sober fair-value anchor
  - - Rigetti
    - June 2026 market cap vs Q1 2026 revenue
    - $7.54B market cap; $4.4M Q1 revenue; $569M cash
    - Useful caution comp for how tiny revenue can still support a multi-billion public numerator
    - Continued losses and small revenue base show that the multiple is highly narrative-dependent
  - - D-Wave
    - June 2026 market cap vs Q1 2026 revenue and bookings
    - $9.72B market cap; $2.9M Q1 revenue; $33.4M bookings; $588M cash
    - Helpful for showing that system-sales excitement and bookings can still outrun current revenue
    - A bookings-heavy story can be volatile if conversions or margin proof weaken
  - - Quantum Computing Inc.
    - June 2026 market cap vs Q1 2026 revenue
    - $2.50B market cap; $3.7M Q1 revenue; $1.4B cash
    - Closest disclosed public numerator to Photonic's current $2B valuation
    - Recent acquisitions and cash-rich balance sheet complicate simple revenue-multiple comparisons
  notes: Public and private comps justify using wide valuation bands, not pretending that one clean peer multiple exists for Photonic today.
