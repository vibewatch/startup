- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Scarce photonic-quantum positioning can still command a premium in 2026'
    - Xanadu, Quantinuum, and PsiQuantum show investors still paying multi-billion-dollar marks for category leaders.
    - Would strengthen if Photonic proves it belongs in that upper tier with disclosed customer and revenue progression.
  - - 'THESIS: Fresh capital and DARPA validation reduce near-term survival risk'
    - More than $200M of fresh May capital plus QBI Stage B participation support continued execution.
    - Would strengthen if management discloses burn and runway instead of only qualitative commentary.
  - - 'THESIS: Service-led distribution gives Photonic a broader upside path than hardware-only sales'
    - Management described a 10,000-company service ambition and Microsoft collaboration supports ecosystem access.
    - Would strengthen if the company shows realized commercial usage, renewals, and margin improvement.
  - - 'ANTI-THESIS: Public revenue is still only single-digit millions'
    - The best public revenue anchor is a January 2026 management interview, not a recurring-revenue disclosure package.
    - Would ease with audited or filed-style disclosure of revenue mix, growth, and customer concentration.
  - - 'ANTI-THESIS: The current mark still implies a triple-digit revenue multiple'
    - Even a generous top-end reading of single-digit millions leaves the $2B mark above 200x revenue.
    - Would ease with materially higher revenue, better margins, or a lower entry valuation.
  - - 'ANTI-THESIS: Public quantum comps prove appetite but also prove volatility'
    - Listed peers rerated on policy and narrative while still posting small revenue bases or ongoing losses.
    - Would ease if public comps hold their multiples through more quarters of execution and Photonic gains comparable disclosure quality.
  notes: The anti-thesis is mainly valuation- and disclosure-sensitive, not a dismissal of Photonic's technical ambition.
