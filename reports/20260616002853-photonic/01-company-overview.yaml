callouts:
- calloutType: strength
  title: Photonic now has one of the more strategically diverse syndicates in private quantum
  body: By May 2026, Photonic had combined growth equity, strategic cloud and telecom investors, Canadian public-capital institutions, and benchmark-style government programs into one financing and validation stack. That does not prove product-market fit, but it materially improves the company’s odds of staying funded long enough to pursue it.
  claimRefs:
