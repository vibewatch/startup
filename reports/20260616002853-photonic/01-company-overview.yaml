- id: capital-stack-and-stakeholders
  title: Funding history, valuation, and stakeholder map
  body: >-
    Photonic’s financing history now supports a late-stage private-company framing rather than an early deep-tech venture framing. The first public step-change came in November 2023, when the company announced a $100M USD round backed by BCI, Microsoft, the UK’s NSSIF, Inovia Capital, and Amadeus Capital Partners, taking lifetime funding to $140M USD. That round also formalized the Microsoft relationship as both strategic capital and a route to Azure Quantum Elements integration.


    The larger inflection arrived in 2026. The January first close raised $180M CAD ($130M USD) led by Planet First Partners with new participation from RBC and TELUS and returning support from BCI and Microsoft. Official materials then put lifetime capital at $375M CAD ($271M USD). In May 2026, another $70M USD ($95M CAD) extended that financing above $200M USD ($275M CAD) and set a $2B USD ($2.7B CAD) post-money valuation, while adding BDC, EDC, Bell Ventures, Firgun Ventures, InBC, and follow-on support from Mubadala Capital. That makes the cap table strategically notable: growth equity, telecom, cloud, Canadian public capital, and sovereign-style investors are all represented. What remains opaque is control—public sources still do not disclose ownership percentages, preference stacks, board committees, or veto rights.
