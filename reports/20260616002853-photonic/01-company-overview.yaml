- calloutType: risk
  title: Benchmarking and skepticism both say commercial utility is still unproven
  body: DARPA’s Stage B promotion means Photonic has a plausible roadmap, not a proven business. That distinction matters because the most cautionary outside sources still argue the industry may be years from practical, economical quantum utility and that marquee use cases like drug discovery remain more aspirational than deployed.
  claimRefs:
  - CO041
  - CO042
  - CO050
  - CO051
- calloutType: insight
  title: The Don Mattrick move is the clearest sign that the company believes the science story is mature enough to package
  body: Putting an early investor with major software-and-games operating experience into the CEO seat while moving Paul Terry to CPO suggests Photonic is trying to translate architectural differentiation into repeatable product, partner, and sales motion. Investors should read the leadership change as a commercialization bet, not merely a personnel shuffle.
