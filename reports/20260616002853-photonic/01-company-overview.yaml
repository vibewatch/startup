  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited revenue, ARR, gross margin, and contracted backlog by customer segment.
    whyItMatters: The company is now valued like a late-stage scale-up, but the public record still has only a management interview reference to single-digit-millions revenue.
    diligencePath: Request management accounts, board decks, and customer cohort reporting covering 2024-2026.
    relatedQuestionRefs:
    - QO016
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Current customer count, production deployments, top accounts, and renewal profile.
    whyItMatters: Without customer evidence, later chapters cannot cleanly bridge from valuation and partnerships to commercial traction.
    diligencePath: Request customer roster, pilot-to-production conversion data, and any Azure or TELUS-sourced commercial contracts.
    relatedQuestionRefs:
    - QO017
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance-control-rights
    missingEvidence: Full cap table, board committees, shareholder rights, and post-2026 governance documents.
    whyItMatters: The financing story is strong, but public sources do not reveal who actually controls key decisions or what protections strategic investors received.
    diligencePath: Request term sheets, shareholder agreements, board committee charters, and the current capitalization table.
    relatedQuestionRefs:
    - QO006
    - QO012
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters-label
    missingEvidence: A precise current principal-office or campus description that reconciles Vancouver and Coquitlam references.
    whyItMatters: Most diligence work can safely treat Photonic as Vancouver-metro, but facility-specific diligence, subsidies, or talent mapping may need exact site language.
    diligencePath: Confirm current principal office, lab locations, and any distinction between legal, mailing, and operating addresses.
    relatedQuestionRefs:
    - QO002
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology
    missingEvidence: Exact day-level dates and any undisclosed pilot or commercial-launch milestones between 2021 and 2026.
    whyItMatters: The current chronology is strong enough for chapter reuse, but exact sequencing would matter for detailed underwriting of product maturity and customer development.
    diligencePath: Request an internal company timeline mapping R&D, product, financing, program, and partner milestones to quarter and date.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
