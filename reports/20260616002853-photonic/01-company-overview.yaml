company:
  name: Photonic
chapter:
  number: 1
  title: Company Overview
  summary: Photonic is a Vancouver-metro quantum infrastructure company founded in 2016 by Stephanie Simmons and Michael Thewalt to commercialize T-centre-based distributed quantum computing. Between November 2023 and May 2026 it moved from a $100M USD round and Microsoft partnership to more than $350M USD total funding, a $2B USD post-money valuation, a Don Mattrick-led commercialization push, and participation in both DARPA’s QBI Stage B and Canada’s CQCP. The biggest remaining diligence caveats are private revenue and customer data, incomplete public control-rights disclosure, and a sector-wide risk that useful quantum advantage still takes longer to monetize than current narratives imply.
sections:
- id: identity-and-platform
  title: Identity, headquarters, and platform model
  body: >-
    Photonic presents itself as a commercial-scale quantum computing and networking company rather than a pure research lab. The founding record is strong: official and independent sources align on a 2016 start, with Dr. Stephanie Simmons and Dr. Michael Thewalt named as co-founders and the original technical thesis tied to silicon T-centre research. Official company language consistently places Photonic in Vancouver, British Columbia with operations in the United States and United Kingdom, while one 2025 BetaKit CQCP article calls the company Coquitlam-based. Because both references sit inside the same Vancouver metro ecosystem, later chapters should treat the company as Vancouver-metro or British Columbia-based unless a site-specific facility address matters.


    The product story is intentionally broad but coherent. Photonic says it will offer quantum computing through cloud-based services on Microsoft Azure or through dedicated private systems, while also selling quantum-secure networking infrastructure to sectors such as telecom, government, and finance. The core technical claim is concise enough to reuse: Photonic’s Entanglement First architecture uses optically linked silicon spin qubits based on T centres so compute, memory, and communication are integrated at telecom wavelengths. Official background copy also says commercialization efforts began in 2021, which matters because the company is now framing itself as a scale-up crossing from platform proof into go-to-market execution.
