evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited revenue, ARR, gross margin, and contracted backlog by customer segment.
    whyItMatters: >-
      The company is now valued like a late-stage scale-up, but the public record still has only a management interview
      reference to single-digit-millions revenue.
    diligencePath: Request management accounts, board decks, and customer cohort reporting covering 2024-2026.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Current customer count, production deployments, top accounts, and renewal profile.
    whyItMatters: >-
      Without customer evidence, later chapters cannot cleanly bridge from valuation and partnerships to commercial
      traction.
    diligencePath: Request customer roster, pilot-to-production conversion data, and any Azure or TELUS-sourced commercial contracts.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-control-rights
    missingEvidence: Full cap table, board committees, shareholder rights, and post-2026 governance documents.
    whyItMatters: >-
      The financing story is strong, but public sources do not reveal who actually controls key decisions or what
      protections strategic investors received.
    diligencePath: Request term sheets, shareholder agreements, board committee charters, and the current capitalization table.
    relatedQuestionRefs:
      - QO006
      - QO012
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters-label
    missingEvidence: A precise current principal-office or campus description that reconciles Vancouver and Coquitlam references.
    whyItMatters: >-
      Most diligence work can safely treat Photonic as Vancouver-metro, but facility-specific diligence, subsidies, or
      talent mapping may need exact site language.
    diligencePath: >-
      Confirm current principal office, lab locations, and any distinction between legal, mailing, and operating
      addresses.
    relatedQuestionRefs:
      - QO002
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology
    missingEvidence: Exact day-level dates and any undisclosed pilot or commercial-launch milestones between 2021 and 2026.
    whyItMatters: >-
      The current chronology is strong enough for chapter reuse, but exact sequencing would matter for detailed
      underwriting of product maturity and customer development.
    diligencePath: >-
      Request an internal company timeline mapping R&D, product, financing, program, and partner milestones to quarter
      and date.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: networking monetization
    missingEvidence: >-
      Public pricing, contract terms, or recurring-revenue disclosures for quantum networking, repeater, or
      secure-communications products.
    whyItMatters: >-
      Without commercial terms, the chapter can only treat networking as an adjacency and pilot path rather than a
      proven monetization layer.
    diligencePath: >-
      Request customer contracts, pilot-to-production conversion data, and segment-level revenue split between compute
      and networking products.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: export controls and foreign procurement
    missingEvidence: >-
      Primary-source evidence on export controls, security screening, or foreign-procurement restrictions specific to
      Photonic's hardware or networking stack.
    whyItMatters: >-
      National-security technologies can face jurisdictional limits that narrow reachable demand even when technical
      interest is high.
    diligencePath: >-
      Review export-control counsel memos, government security filings, and procurement terms for U.S., Canada, and
      allied programs.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: serviceable obtainable market
    missingEvidence: >-
      Current revenue, backlog, booked contracts, and annualized spend attributable to Photonic's active programs and
      partnerships.
    whyItMatters: >-
      SOM cannot be sized credibly from public sources without knowing how much pilot and benchmark activity converts
      into contracted revenue.
    diligencePath: >-
      Request management KPI pack showing government-program revenue, partner revenue, backlog, and pilot conversion by
      segment.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: commercialization timeline
    missingEvidence: >-
      Independent, architecture-agnostic evidence reconciling DARPA's 2033 utility target with public skeptic timelines
      and vendor roadmaps.
    whyItMatters: Timing drives both valuation multiples and which customer budgets are actually reachable in the next five years.
    diligencePath: >-
      Request third-party technical diligence, milestone scorecards, and architecture comparison work used by DARPA,
      NRC, or independent national-lab reviewers.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Public list pricing or normalized enterprise quote data for IBM, Rigetti, Quantinuum, IQM, and Photonic itself.
    whyItMatters: >-
      Without comparable prices, packaging and access model are easier to compare than buyer cost, which limits margin
      and switching-cost analysis.
    diligencePath: >-
      Request enterprise quote sheets, marketplace SKUs, and any pilot-to-production price transition terms from the
      core vendors and from Photonic management.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-adoption
    missingEvidence: Current customer counts, backlog, and production usage metrics for private competitors and for Photonic.
    whyItMatters: >-
      Commercial maturity is central to the threat assessment, but most private vendors disclose funding and roadmap far
      more readily than recurring usage.
    diligencePath: >-
      Ask management for customer-by-customer pipeline, renewal data, and cloud or on-prem utilization metrics
      benchmarked against the named peers.
    relatedQuestionRefs:
      - QP008
      - QP011
      - QP015
      - QP026
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: commercialization-timeline
    missingEvidence: >-
      Independent architecture-agnostic work reconciling D-Wave's “commercial today” posture, Google's fault-tolerance
      progress, and broader skepticism about when utility-scale quantum becomes very useful.
    whyItMatters: >-
      Timeline disagreement determines whether Photonic is competing for near-term budgets, strategic options, or a
      still-distant platform market.
    diligencePath: >-
      Commission third-party technical diligence that compares commercialization readiness by modality, not just by
      vendor marketing narrative.
    relatedQuestionRefs:
      - QP005
      - QP018
      - QP024
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Exact cash on hand, monthly burn, and management runway cases.
    whyItMatters: >-
      Without these numbers, investors cannot convert the 2026 financing into time-to-next-funding or test management's
      cash-flow-positive claim.
    diligencePath: Request the latest monthly cash bridge, board reporting pack, and base / upside / downside runway model.
    relatedQuestionRefs:
      - QI023
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, contract duration, discounting, and renewal structure by revenue stream.
    whyItMatters: >-
      Revenue quality cannot be judged from a topline number alone when pricing power and contract durability are
      missing.
    diligencePath: Request top customer contracts, ACV / TCV summaries, pricing schedules, and renewal or termination terms.
    relatedQuestionRefs:
      - QI007
      - QI025
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and cost-of-delivery split across compute services, networking products, and program-funded work.
    whyItMatters: The core margin thesis depends on whether Photonic is becoming more software-like or remaining delivery-heavy.
    diligencePath: Request a stream-level gross-margin bridge plus the cost categories rolled into COGS.
    relatedQuestionRefs:
      - QI013
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Paying-customer count, concentration of top accounts, and the share of revenue tied to programs versus repeat
      commercial users.
    whyItMatters: >-
      A later-stage valuation can look very different if most revenue still comes from a few strategic or subsidized
      engagements.
    diligencePath: >-
      Request customer cohort tables, top-10 revenue concentration, and a split between government, partner, and
      enterprise demand.
    relatedQuestionRefs:
      - QI006
      - QI025
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: minor
    topic: revenue-recognition
    missingEvidence: >-
      A source that clearly explains how program funding, pilot milestones, and commercial services are recognized in
      revenue.
    whyItMatters: The chapter can describe monetization surfaces, but not the exact accounting quality of growth.
    diligencePath: Request audited revenue-recognition policy language and the monthly bookings-to-revenue waterfall by stream.
    relatedQuestionRefs:
      - QI001
      - QI015
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: material
    topic: assurance-gap
    missingEvidence: >-
      Independent or official documentation of security certifications, assurance reviews, uptime SLOs, incident
      response commitments, or a production status surface for Photonic's compute and networking products.
    whyItMatters: >-
      Enterprise and regulated-network buyers need formal assurance artifacts before trusting quantum infrastructure in
