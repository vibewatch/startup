- id: TU003
  title: Named customer proof table
  columns:
  - Counterparty / program
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof
  - Limitation
  rows:
  - - Microsoft / Azure Quantum Elements
    - Cloud platform partner
    - Co-innovation and planned future hardware access through Azure
    - Partner integration path, not public production demand
    - Named external platform partner with technical and distribution roadmap
    - No disclosed paying Azure customer usage or production account list
  - - TELUS
    - Telecom / secure networking
    - Commercial-fibre network testing and 30 km teleportation demonstration
    - Advanced field proof with expanded collaboration
    - Named operator, installed network, and quoted executive endorsement
    - Economics, contract scope, and repeat deployments are undisclosed
  - - DARPA Quantum Benchmarking Initiative
    - US government benchmark / procurement-style program
    - Utility-scale quantum benchmark process and Stage B advancement
    - Milestone-based program validation, not production revenue
    - Independent government naming of Photonic inside Stage B cohort
    - DARPA explicitly says Stage B is still R&D-plan scrutiny
  - - Canadian Quantum Champions Program
    - Canadian public-sector funding program
    - Phase 1 support for fault-tolerant quantum computing development
    - Milestone-based funding program
    - Named up-to-$23M Phase 1 award with national benchmarking structure
    - Not equivalent to recurring customer usage or revenue disclosure
  - - IDEaS NORAD modernization challenge
    - Canadian defence program
    - Quantum networking work backed by initial grant
    - Contest / semi-finalist stage
    - Adds named defence-oriented counterparty and non-dilutive funding
    - Too early to prove deployment scale or follow-on production contracts
  notes: This enumeration is intentionally limited to publicly named external counterparties from 2023-2026; it excludes unnamed journey customers and undisclosed commercial contracts.
