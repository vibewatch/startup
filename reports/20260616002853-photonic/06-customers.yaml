tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Current read
  - Strategic value
  - Gap
  rows:
  - - Cloud/platform channel
    - Microsoft is the platform partner and potential distribution path; Azure customers would be future users
    - Microsoft Azure Quantum Elements
    - Strong partner proof, not broad current end-customer proof
    - Could put Photonic hardware behind an existing cloud demand surface
    - No public data on paying Azure usage, contracts, or active accounts
  - - Telecom / secure-networking channel
    - TELUS supplies network infrastructure, technical teams, and a potential telecom buyer lens
    - TELUS PureFibre partnership and teleportation demo
    - Strongest real-world deployment environment in the pack
    - Shows existing fibre can host Photonic use cases and could seed telecom revenue
    - Commercial terms, contract size, and repeat deployment count are undisclosed
  - - US government benchmark / defence programs
    - DARPA and defence stakeholders fund or evaluate the work; government is the payer and validation owner
    - DARPA QBI and IDEaS NORAD challenge
    - Genuine external customer-proof, still benchmark / contest shaped
    - Adds procurement-style credibility and milestone funding
    - Does not yet prove production utilization or recurring program revenue
  - - Canadian federal quantum programs
    - Government funds milestone-based development while NRC-style experts benchmark progress
    - CQCP Phase 1 award
    - Named public-sector counterparty proof
    - Supports sovereignty thesis and anchors Photonic in Canada
    - Still pre-revenue in appearance and conditioned on milestones
  - - Finance-sector demand signal
    - RBC is investor and prospective use-case validator; financial institutions would be future buyers or users
    - RBC statements on security and risk modelling
    - Strategic signal only, not operating-customer proof
    - Suggests a credible future vertical for quantum services
    - No disclosed RBC deployment, contract, or paid pilot
  - - Unnamed early enterprise customers
    - Corporations are the intended buyers and users of cloud-delivered quantum services
    - BetaKit interview citing journey customers
    - Early commercialization signal only
    - Shows some revenue and initial demand exist
    - No names, customer count, contract length, or concentration disclosure
  notes: Rows distinguish customer-proof, partner-proof, program funding, and management-claimed early demand so investor validation is not mistaken for disclosed paying production adoption.
