  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-paying-customers
    missingEvidence: A public or diligence-room list of named paying enterprise customers, their use cases, and whether each is pilot, paid pilot, production, or channel partner.
    whyItMatters: Without named accounts, the chapter cannot separate strategic relationship quality from actual production customer breadth.
    diligencePath: Request a customer ledger that names every paying enterprise, government, and partner-linked account, along with contract stage, start date, and revenue contribution.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer count, NRR, GRR, churn, renewal rates, contract duration, and customer satisfaction by channel.
    whyItMatters: Partner continuity can look strong even when customer economics are weak; true durability requires retention and renewal evidence.
    diligencePath: Request quarterly cohort retention tables and renewal schedules for Azure-linked, telecom, government, and direct enterprise accounts.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share, segment revenue mix, backlog composition, and program funding versus commercial revenue split.
    whyItMatters: A handful of flagship relationships can dominate public narrative while masking narrow revenue concentration or dependence on grant-like funding.
    diligencePath: Request bookings, revenue, and backlog by channel plus top-5 customer concentration and the share attributable to government programs.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: program-to-production-conversion
    missingEvidence: Direct evidence that DARPA, CQCP, IDEaS, Microsoft, or TELUS relationships have converted into paid production contracts, active workloads, or recurring usage.
    whyItMatters: The chapter can prove validation and continuity, but not whether that validation is already compounding into scaled production customer revenue.
    diligencePath: Request signed contract summaries, active workload metrics, or customer references showing production usage and post-milestone expansion.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
