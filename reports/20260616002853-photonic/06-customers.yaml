- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or concentration risk
  - Current evidence
  - Impact
  - Diligence path
  rows:
  - - Azure channel expansion
    - Microsoft sources say Azure Quantum Elements customers could access Photonic hardware when available
    - Could turn one strategic partner into broad indirect distribution
    - Request partner agreement scope, go-live timing, and customer onboarding plan
  - - Telecom-secure networking expansion
    - TELUS provides installed fibre, technical endorsement, and a broader project set
    - Could create real-world network products faster than pure compute sales
    - Request signed project roadmap, commercialization timeline, and buyer budget owner
  - - Government-program conversion
    - DARPA, CQCP, and IDEaS all provide milestone funding or benchmark access
    - Could convert validation into procurement-style revenue and defence relationships
    - Request follow-on contract terms, deliverables, and revenue recognition path
  - - Named-relationship concentration
    - Public disclosure is dominated by Microsoft, TELUS, DARPA, and Canadian government programs
    - A small proof set can overstate demand breadth and mask narrow revenue concentration
    - Request top-customer share, bookings mix, and backlog by channel
  - - Pilot-to-production uncertainty
    - Most disclosed proof points are technical milestones or funding programs rather than named production buyers
    - Could delay revenue scaling even if the science advances
    - Request list of paid production deployments, active pilots, and conversion rates
  - - Sovereignty / location conditions
    - CQCP support is tied to remaining headquartered in Canada
    - Helpful for policy support but potentially constraining for strategic flexibility
    - Request covenant details and any restrictions on IP transfer, contracting, or HQ decisions
  notes: The table separates growth wedges from concentration and conversion risks because Photonic’s public customer narrative is still more strategic than revenue-transparent.
