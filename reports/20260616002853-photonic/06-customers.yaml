  title: Customers
summary: Photonic's strongest public customer evidence is strategic-counterparty traction with Microsoft, TELUS, DARPA, and Canadian government programs rather than a disclosed roster of scaled paying production customers. The public record proves real external validation, milestone funding, and multi-year partner continuity, and BetaKit says the company has initial 'journey' customers plus single-digit millions of revenue. But no named enterprise accounts, customer count, retention metrics, or concentration disclosure are public, so the customer story should be scored as credible but early.
sections:
- id: customer-surfaces-and-proof-boundaries
  title: 'Customer surfaces: real external counterparties exist, but most public proof is partner or program shaped'
  body: 'Photonic does have visible external counterparties, but the public pack is narrower than the investor list or the set of industries management says quantum could eventually serve. The disclosed surfaces fall into five buckets: Microsoft as cloud and platform partner, TELUS as telecom network operator and deployment environment, United States government benchmark and defence programs, Canadian federal quantum programs, and an unnamed set of early enterprise or ''journey'' customers referenced in management interviews. That mix matters because it separates customer-adjacent traction from scaled paying-customer proof. Microsoft and TELUS are meaningful because they are named external institutions willing to put brand, infrastructure, and technical teams behind the relationship. DARPA, CQCP, and IDEaS are also meaningful because they name Photonic in milestone-based government programs and put real non-dilutive or contract-style support behind the work. But none of those categories
    equals a public list of recurring production accounts with contract values, usage growth, or renewals. Even BetaKit''s strongest commercialization interview still stops at unnamed customers and single-digit millions of revenue. The right analytical boundary is therefore strict: partner proof and program proof are real, yet they are not the same thing as a broad disclosed production customer base.'
