- id: TU002
  title: Customer growth / adoption trajectory table
  columns:
  - Signal
  - Public detail
  - Date / stage
  - Source basis
  - Implication
  - Missing denominator
  rows:
  - - Microsoft co-innovation launch
    - Strategic collaboration announced with plan to integrate Photonic into Azure Quantum Elements
    - 2023-11
    - Microsoft Azure + Microsoft Quantum pages
    - Photonic won a named cloud platform route early
    - No public customer usage, pricing, or pipeline volume
  - - Microsoft technical follow-on
    - Telecom-wavelength distributed entanglement and future Azure customer access when hardware is available
    - 2024-05
    - Azure Quantum Blog
    - Relationship advanced beyond concept into technical proof
    - No disclosed conversion from milestone to paid customer access
  - - TELUS field-testing partnership
    - TELUS opened its fibre network to Photonic for testing quantum networking applications
    - '2024'
    - Business in Vancouver
    - Real-world network environment became available
    - No contract value or deployment count
  - - DARPA initial cohort
    - Photonic joined DARPA QBI initial stage alongside other quantum companies
    - 2025 initial stage
    - DARPA + BetaKit + EE Times
    - US government diligence team accepted the architecture into the benchmark funnel
    - Entry alone is not proof of utility or production use
  - - DARPA Stage B
    - DARPA named Photonic among 11 Stage B companies and required detailed R&D and risk-mitigation plans
    - 2025-11
    - DARPA Stage B page + Photonic release
    - Follow-on institutional validation exists
    - No guarantee of Stage C or commercial deployment
  - - CQCP Phase 1
    - Photonic signed for up to $23M inside a $92M Phase 1 Canadian program
    - 2025-12
    - Photonic + CNW + BetaKit + QCR
    - Canada created a second public counterparty path
    - Milestone-based funding is not the same as contracted customer usage
  - - IDEaS defence challenge
    - Semi-finalist status plus an initial $1M grant for quantum networking
    - 2025-08
    - Photonic release
    - Defence customer adjacency broadened beyond DARPA
    - Contest-stage evidence, not a scaled deployment contract
  - - Initial journey customers
    - Management said Photonic had single-digit millions of revenue from initial customers and aimed for tens of millions next year
    - 2026-01
    - BetaKit interview
    - There is some real commercialization beyond lab milestones
    - No names, account count, churn, or segment mix disclosed
  - - TELUS expanded partnership
    - Joint 30 km teleportation demo and broader project set over installed commercial fibre
    - 2026-02
    - Photonic + TELUS
    - Public proof improved from testing access to expanded collaboration
    - Still no disclosed revenue or multi-site rollout
  notes: Trajectory rows track publicly visible milestone progression, not booked revenue, active-seat counts, or internal sales-funnel conversion metrics.
