- id: adoption-trajectory-and-named-proof-quality
  title: 'Adoption trajectory: the timeline shows follow-on validation, but still not broad production customer disclosure'
  body: 'The visible trajectory has progressed from strategic announcements to more demanding technical and program milestones. Microsoft announced a co-innovation collaboration with Photonic in late 2023 and framed the goal as integrating Photonic''s scalable offering into Azure Quantum Elements. By May 2024, Microsoft and Photonic were publicly describing telecom-wavelength distributed entanglement and a future path for Azure customers to access Photonic hardware when available. TELUS adds a second important proof surface. Independent coverage in 2024 said TELUS opened its fibre network to Photonic for testing, and the 2026 joint releases say the companies expanded the relationship and completed a 30-kilometre teleportation result over installed commercial fibre. Government evidence is similarly sequential rather than one-off: DARPA''s QBI first named Photonic in the initial cohort and then in the smaller Stage B set of 11 companies, while Canada''s CQCP named Photonic for up to $23 million
    in Phase 1 and the IDEaS contest added an initial $1 million defence-oriented grant. Those are genuine external validations and they do show follow-on momentum. What they do not yet show is a public roster of named production buyers, deployment counts, or account-level expansion across enterprise verticals.'
