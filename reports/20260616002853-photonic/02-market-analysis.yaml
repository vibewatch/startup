chapter:
  number: 2
  title: Market Analysis
  summary: Photonic participates in a very large long-term quantum-computing and quantum-networking opportunity, but its underwritable market today is far narrower than headline TAM forecasts. Public evidence points to a procurement-led near-term SAM anchored in government benchmarking, national labs, hyperscaler integrations, and telecom/security pilots, while error-correction overhead, capital intensity, talent constraints, and skepticism about commercialization timing remain the key limits on adoption and valuation.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'Photonic should be analyzed as a seller of quantum-computing infrastructure and future utility-scale networking capability, not as a present-day mass-market software vendor. Its official technology pages frame the company around distributed quantum computing, silicon spin qubits, telecom-compatible networking, and error-corrected scaling rather than around self-serve application seats. That boundary matters because broad quantum market reports often pool together systems, services, cloud access, and adjacent categories, while Photonic''s current reachable demand is concentrated in buyers willing to fund architecture validation, networked prototypes, and strategic infrastructure. The included spend therefore covers quantum hardware, control and error-correction stacks, cloud or platform integrations that expose quantum resources, and quantum networking products such as repeaters, switches, and secure links. It should exclude ordinary high-performance computing, generic cybersecurity,
    non-quantum semiconductors, and mainstream SaaS workloads that do not require quantum advantage. The substitute set is also real: IBM, IonQ, Quantinuum, PsiQuantum, Google, and Microsoft all show that buyers can back different architectures or consume quantum capability through cloud platforms without choosing Photonic specifically.'
