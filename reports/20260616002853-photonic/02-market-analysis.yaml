  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: networking monetization
    missingEvidence: Public pricing, contract terms, or recurring-revenue disclosures for quantum networking, repeater, or secure-communications products.
    whyItMatters: Without commercial terms, the chapter can only treat networking as an adjacency and pilot path rather than a proven monetization layer.
    diligencePath: Request customer contracts, pilot-to-production conversion data, and segment-level revenue split between compute and networking products.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: export controls and foreign procurement
    missingEvidence: Primary-source evidence on export controls, security screening, or foreign-procurement restrictions specific to Photonic's hardware or networking stack.
    whyItMatters: National-security technologies can face jurisdictional limits that narrow reachable demand even when technical interest is high.
    diligencePath: Review export-control counsel memos, government security filings, and procurement terms for U.S., Canada, and allied programs.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: serviceable obtainable market
    missingEvidence: Current revenue, backlog, booked contracts, and annualized spend attributable to Photonic's active programs and partnerships.
    whyItMatters: SOM cannot be sized credibly from public sources without knowing how much pilot and benchmark activity converts into contracted revenue.
    diligencePath: Request management KPI pack showing government-program revenue, partner revenue, backlog, and pilot conversion by segment.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: commercialization timeline
    missingEvidence: Independent, architecture-agnostic evidence reconciling DARPA's 2033 utility target with public skeptic timelines and vendor roadmaps.
    whyItMatters: Timing drives both valuation multiples and which customer budgets are actually reachable in the next five years.
    diligencePath: Request third-party technical diligence, milestone scorecards, and architecture comparison work used by DARPA, NRC, or independent national-lab reviewers.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
