- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Post-quantum migration urgency
    - up
    - current to 2035
    - Raises the strategic value of quantum-safe networking and secure communications adjacent to compute
    - Request Photonic's product roadmap for networking, PQC coexistence, and secure-communications monetization.
  - - Sovereign compute and defence funding
    - up
    - current
    - Supports milestone-based programs even before broad commercial demand exists
    - Request pipeline detail across DARPA, CQCP, IDEaS, and other public-sector opportunities.
  - - Cloud and platform access
    - up
    - current
    - Lets buyers test quantum capability through hyperscalers before owning full hardware stacks
    - Request how Azure or other platform partnerships convert into recurring revenue or design wins.
  - - Telecom-compatible modular architecture
    - up
    - 1-3 years
    - Expands the buyer set to telecom and network-security actors, not just compute labs
    - Request proof that networking products can monetize independently of utility-scale compute.
  - - Error-correction overhead
    - down
    - current and structural
    - Physical-to-logical qubit ratios still dominate economics and timelines
    - Request independent validation of QLDPC gains and the hardware requirements to realize them.
  - - Capital intensity and engineering complexity
    - down
    - current
    - Cryogenics, fabrication, control electronics, and integration keep deployment expensive
    - Request capital needs and partner dependencies for each technical milestone.
  - - Quantum talent scarcity
    - down
    - 1-5 years
    - Specialized hardware, code, and systems talent can bottleneck execution and customer adoption
    - Request hiring plan, key-person dependence, and critical external talent gaps.
  - - Procurement cycle length
    - down
    - 1-3 years
    - Government and critical-infrastructure buyers move slowly and require extensive validation
    - Request average pilot-to-contract timelines by segment and the milestones buyers demand.
  - - Unclear near-term ROI in pharma and optimization
    - down
    - current
    - Some headline enterprise use cases may remain scientifically interesting but commercially thin
    - Request customer evidence that pilots move beyond exploration into budgeted production programs.
  - - Timeline skepticism and market volatility
    - mixed
    - current
    - Contradictory public timelines compress valuation multiples when milestones slip
    - Request management's milestone map, downside cases, and contingency plans if useful workloads arrive later.
  notes: This table mixes demand drivers with timing frictions because the valuation question is not whether quantum is strategically important, but whether Photonic can convert that importance into repeatable contracts before cost, skepticism, and long procurement cycles dominate.
