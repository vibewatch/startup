- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Utility-scale quantum computing infrastructure
    - Quantum processors, control stacks, fault-tolerance tooling, orchestration, and access layers for utility-scale systems
    - Classical HPC clusters, AI accelerators, and general semiconductors without quantum advantage
    - Government labs, hyperscalers, national labs, and strategic enterprise research budgets
    - Core long-term TAM lens for Photonic
  - - Quantum networking and security
    - Repeaters, switches, entanglement distribution, quantum-secure links, and telecom-compatible quantum network infrastructure
    - Conventional networking gear, generic cybersecurity software, and classical encrypted WAN services
    - Telecom operators, defence/security agencies, and critical-infrastructure owners
    - Direct adjacency where Photonic can sell before broad quantum-compute deployment
  - - Government benchmarking and R&D procurement
    - DARPA QBI work, defence science programs, open-access research infrastructure, and milestone-based validation contracts
    - Generic academic science grants without hardware or networking commercialization relevance
    - Defense agencies, public R&D programs, and national labs
    - Most visible near-term SAM for Photonic today
  - - Hyperscaler and platform integration
    - Cloud distribution, co-development, and hardware/network integration inside quantum platforms
    - Mass end-user SaaS, consumer software, and broad enterprise seat sales
    - Cloud platforms, quantum service operators, and advanced R&D groups
    - Important route to market because platforms can intermediate demand
  - - Strategic enterprise pilots
    - Exploratory simulation, optimization, materials, pharma, or finance workloads with explicit quantum-evaluation budgets
    - Routine enterprise analytics and production workflows that do not need quantum advantage
    - Innovation leaders, CTO offices, and research teams inside large enterprises
    - Relevant but still narrow because ROI proof is limited
  - - Academic and national-lab access
    - Shared quantum testbeds, benchmarking facilities, and workforce-development environments
    - Consumer education and undifferentiated classroom software
    - National labs, universities, and public research consortia
    - Useful as ecosystem demand, but monetization is slower and programmatic
  notes: Included spend follows Photonic's infrastructure and networking architecture; excluded spend removes classical compute and software categories that inflate TAM without directly improving Photonic's near-term monetization path.
