- id: FM002
  title: Commercialization horizon range
  type: range
  layout: standard
  summary: Public sources disagree sharply on how quickly quantum systems become broadly useful, which is why timing risk must remain explicit in market analysis.
  data:
    items:
    - label: DARPA utility-scale evaluation target
      low: 8
      mid: 9
      high: 10
      unit: years
      detail: QBI launched in 2024 and asks whether utility-scale operation is achievable by 2033.
    - label: Expert range for commercially usable systems
      low: 5
      mid: 12.5
      high: 20
      unit: years
      detail: BetaKit reported experts placing usable quantum timelines anywhere from five to 20 years.
    - label: Jensen Huang very-useful range
      low: 15
      mid: 20
      high: 30
      unit: years
      detail: Huang said 15 years would be early, 30 late, and 20 a widely believable midpoint.
  approximationNotes: All rows use years as the unit. The midpoint is a simple visual anchor, not an additional published estimate.
