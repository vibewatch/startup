    "number": 7,
    "title": "Risks",
    "summary": "Photonic's risk stack is led by technical-scale uncertainty, partner-and-competitor conflict, and commercialization timing rather than by lack of scientific ambition. DARPA's own framing, public T-centre tuning results, the Microsoft/TELUS dependency chain, and rival progress from Google, Microsoft, Quantinuum, and D-Wave all point to a company that may be directionally right on architecture but still has to clear yield, assurance, procurement, and financing hurdles before the thesis deserves a lower-risk rating."
  },
  "sections": [
    {
      "id": "risk-overview-and-transmission",
      "title": "Risk overview and transmission",
      "body": "Photonic's highest-ranked risks come from timing mismatch rather than from absence of technical imagination. The architecture remains differentiated, but the public record still shows a company trying to convert a technically credible distributed-silicon roadmap into a repeatable commercial product while peers keep shortening buyer wait times. DARPA's benchmarking program is helpful because it screens hype, yet its own language is cautionary: it says it is still unclear what size, quality, and configuration of quantum computer will unlock the promised use cases, and Stage B exists to force risk-reduction plans rather than to certify a winner. At the same time, Photonic's disclosed revenue is still only in the single-digit millions, while the company is expanding teams, facilities, and partner programs. That means technical slippage, partner friction, or market skepticism can transmit directly into lower bookings, weaker bargaining power with Microsoft or TELUS, more financing dependence, and eventual valuation pressure. The top investment question is therefore not whether the science is interesting; it is whether Photonic can become commercially unavoidable before larger or more mature platforms absorb the demand window.",
