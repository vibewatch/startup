      "id": "technical-scale-and-competitive-displacement",
      "title": "Technical scale and competitive displacement",
      "body": "The central technical risk is that Photonic still needs several hard engineering problems to break in the right direction at once. The 2026 Stark-tuning paper is encouraging because it shows local control and better usable yield, but it is also explicit that nanophotonic integration broadens linewidths and that only roughly 55 percent of on-chip T centres can currently be brought into mutual resonance. The older silicon-photonic roadmap paper is even more direct: the path to fault-tolerant computing remains elusive, photon loss remains a critical constraint, active switches are a limiting element, and the fault-tolerance threshold for the proposed architecture still had to be identified. That technical uncertainty now sits against a much louder competitive backdrop. Google says Willow has crossed a below-threshold error-correction milestone; Microsoft says Majorana 1 is on a years-not-decades path inside DARPA's final-phase effort; Quantinuum already sells subscriptions and claims real-time error correction; D-Wave already sells cloud access and production use cases. Even if those platforms are not directly equivalent to Photonic's architecture, they still compete for budget, talent, partner attention, and investor patience.",
