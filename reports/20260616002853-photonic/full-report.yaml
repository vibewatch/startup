        - $1.5B-$2.2B
        - '~50%: most consistent with current evidence'
        - Solid execution with only partial revenue and margin transparency
      - - Bull
        - >-
          Partner and government proof convert into repeatable commercial revenue, and investors continue paying a
          premium for photonic-quantum leadership.
        - >-
          Photonic keeps a valuation band closer to Xanadu and the stronger private cohort rather than drifting toward
          lower private marks.
        - $2.7B-$4.0B
        - '~25%: requires visible commercialization acceleration'
        - Durable revenue scaling, better margin evidence, and sustained premium peer multiples
    notes: >-
      These ranges are directional private-market screens rather than a DCF; they preserve uncertainty around revenue
      scale, margin path, and timing.
