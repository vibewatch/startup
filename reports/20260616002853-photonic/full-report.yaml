      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Photonic's buyer map is concentrated in organizations that can justify strategic rather than purely
              operational budgets. Government R&D agencies, defence buyers, national labs, and publicly funded
              benchmarking platforms are the clearest near-term payers because they can underwrite technical risk in
              exchange for sovereignty, security, and first-mover advantage. Hyperscalers and quantum-platform operators
              are another important segment because they can buy or integrate hardware and networking capabilities
              before broad end-user demand exists; Microsoft's Azure collaboration is the clearest public signal of that
              path. A third segment is large enterprise research teams in pharma, materials, finance, and advanced
              industry, where users want simulation or optimization capability but procurement usually starts as an
              exploratory R&D or innovation budget rather than a production line item. The fourth segment is telecom and
              network-security actors, where TELUS and government communications missions matter because Photonic's
              telecom-band architecture can piggyback on existing fibre networks and connect the quantum-computing story
              to secure infrastructure budgets. Across segments, the adoption path is similar: architecture diligence,
              funded benchmark or pilot, integration and security review, then only later a repeat budget line or
              multiyear contract.
