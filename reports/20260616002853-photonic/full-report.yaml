            body: >-
              The adverse evidence is straightforward: the field already contains rivals with more mature public
              commercialization, more government validation, or much larger disclosed capitalization than Photonic.
              Google has already published a below-threshold error-correction result. Microsoft and PsiQuantum reached
              the validation stage of DARPA's US2QC effort. Quantinuum and PsiQuantum disclosed multibillion-dollar
