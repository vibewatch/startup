      - number: '8.2'
        title: Comparable set and why the current round is only conditionally defensible
        blocks:
          - type: paragraph
            body: >
              The comparable set cuts both ways. On the supportive side, 2026 quantum valuations remain elevated across
              both private and public markets: Xanadu entered public markets and screens above $4 billion, Quantinuum
              raised at a $10 billion pre-money valuation, PsiQuantum hit $7 billion, and even smaller or less mature
              public names such as QCi, Rigetti, and D-Wave still command multi-billion-dollar market caps. That matters
              because it shows Photonic's $2 billion mark is not the most aggressive numerator in the category. The
              negative read is that most of those peers disclose much more operating evidence than Photonic does, and
              even then their valuations still look driven by long-duration execution expectations. S&P's May 2026
              market note explicitly showed listed quantum equities jumping on a U.S. policy announcement while revenue
              forecasts remained relatively small, and BetaKit's own caution around Xanadu and other public peers
              underscored how quickly enthusiasm can outrun earnings. The lesson is not that Photonic must trade
              cheaply, but that any premium needs to be defended by sharper commercial evidence than the company
              currently publishes. In short, comps defend why a serious quantum company can still be worth billions in
              2026, but they do not prove that Photonic specifically has earned its current mark without a stronger
              revenue bridge.
