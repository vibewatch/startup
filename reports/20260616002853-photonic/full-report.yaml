      - number: '7.4'
        title: Partner dependencies and channel conflicts
        blocks:
          - type: paragraph
            body: >-
              Photonic's public commercialization path is unusually concentrated in a small number of strategic
              relationships. Microsoft is the most obvious example: it participates in financing, offers Azure
              infrastructure, and is the named route for eventual integration into Azure Quantum Elements, yet it is
              also independently racing with Majorana 1 and sits deeper inside DARPA's utility-scale program. That dual
              role creates a classic dependency conflict: Microsoft can be Photonic's fastest path to enterprise reach
              and its fastest path to disintermediation. TELUS is a similar, though narrower, dependency. The telecom
              relationship proves real-world fibre compatibility and gives Photonic a deployment environment, but it
              does not by itself prove repeatable customer conversion, pricing power, or margin durability. Government
              programs introduce a third dependency layer. DARPA and Canadian sovereign-security programs add valuable
              validation and anchoring support, but they also increase scrutiny and can tilt the company toward
              milestone-driven, procurement-heavy channels. The underwriting implication is that Photonic's partner map
              is powerful but fragile: each major ally also represents a concentration point where terms opacity,
              strategic divergence, or slower-than-expected customer handoff can materially weaken the thesis.
            claimRefs:
