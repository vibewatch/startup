      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The core operating model is modular by design. Photonic's own architecture materials describe a quantum
              processor chip cooled in a 1 K cryostat, hosting integrated silicon T centres within optical cavities,
              photonic switches, and single-photon detectors, with telecom-fibre input-output ports connected to
              room-temperature optical switches and control electronics. The T centre itself is the keystone because it
              combines a telecom-band optical interface with silicon spin qubits, allowing the same platform to handle
              computation, communication, and memory rather than bolting networking on after the fact. That is why
              Photonic keeps emphasizing any-to-any connectivity across neighbouring qubits, chips, racks, and data
              centres. The workflow implication is straightforward: a computation or networking task can be prepared
              locally, entanglement can be generated and routed through the optical layer, and non-local operations can
              then be executed between modules by consuming that entanglement. Public proof is meaningful here. The
              company and associated papers moved from single-spin optical observation and SOI implantation, to
              waveguide integration and memory/transduction design work, and then to a teleported CNOT sequence between
              memory qubits in separate cryostats linked by telecom fibre. That is still far from a production quantum
              service, but it is a more concrete systems story than a purely monolithic roadmap.
