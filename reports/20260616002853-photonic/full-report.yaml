  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue scale stalls
        - Revenue still looks single-digit millions deep into the next milestone cycle
        - Breaks the case that commercialization is catching up with the $2B mark
        - Downgrade to avoid or require a substantially lower entry valuation
      - - Next financing resets the mark
        - New money clears below the May 2026 post-money valuation
        - Signals the market no longer believes the current round can be defended
        - Treat as a thesis break until new economics or protections are disclosed
      - - Margin and customer quality disappoint
        - Data room evidence shows weak gross margin, heavy concentration, or mostly non-repeatable project revenue
        - Undercuts the argument that service-led scaling can support premium multiples
        - Re-cut base and bull valuation bands lower
      - - Public comp multiples compress
        - Listed quantum peers rerate downward materially on execution or policy disappointment
        - Removes the external support for multi-billion marks across the cohort
        - Tighten entry discipline and delay any public-exit expectation
      - - DARPA / ecosystem momentum fades
        - Technical milestones slip or key partner/program support weakens without offsetting commercial wins
        - Reduces the strategic scarcity premium built into the thesis
        - Move the recommendation to research-only until momentum is re-established
    notes: Each trigger is intentionally monitorable from financing, disclosure, or widely covered market signals.
    claimRefs:
      - CV005
      - CV019
      - CV020
      - CV041
      - CV046
      - CV049
      - CV052
      - CV053
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge
        - Current customer count, contract count, and a bridge from single-digit millions to next-year target revenue
        - The valuation debate cannot be closed without knowing what is actually recurring versus aspirational
        - Management / CFO / data room
      - - Gross-margin path
        - Stream-level gross margin for compute services, networking products, and program-funded work
        - A service-led premium depends on margin direction, not only on technical narrative
        - Management / finance / operating model review
      - - Customer concentration
        - Revenue share of top customers and split across government, partner, and enterprise demand
        - A concentrated revenue base should trade differently from a broad commercial platform
        - Management / revenue operations / contract review
      - - Burn and runway
        - Monthly burn, capex plan, and runway sensitivity at current hiring and facility build pace
        - The round may be large, but investors still need to know how much time it truly buys
        - Management / FP&A / board materials
      - - Cap table and preferences
        - Fully diluted ownership, liquidation preferences, anti-dilution terms, and any investor side letters
        - The headline post-money may overstate common-equity economics if preference overhang is heavy
        - Finance / legal / cap-table waterfall
      - - Exit readiness
        - Internal threshold for IPO versus staying private, including minimum revenue and disclosure milestones
        - The timing of a liquidity path matters for return expectations and future dilution risk
        - CEO / board / investor relations preparation materials
    notes: >-
      These asks are valuation-critical because each one changes either the denominator, the risk rating, or the likely
      exit path.
    claimRefs:
      - CV005
      - CV009
