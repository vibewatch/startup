  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing posture, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real but still early commercialization story. The strongest monetization signal
              is Paul Terry's January 2026 description of selling quantum-computing services to thousands of companies
              rather than selling a small number of expensive boxes, which fits Microsoft's Azure Quantum Elements
              integration path and Photonic's own product language around commercial-scale distributed systems. A second
              monetization surface comes from the networking side of the platform, where Photonic explicitly describes
              repeaters, switches, and QKD-style secure-network products. Government-backed benchmarking and defence
              programs add a third path, but they are best treated as milestone or support revenue until the company
              discloses how much is recognized as sales versus non-dilutive assistance. The weakness is disclosure, not
              narrative. Public revenue is only "single-digit millions" with "journey customers," there is no
              customer-count disclosure, and no source reviewed here publishes list pricing, realized pricing, contract
              duration, or revenue-recognition policy. That means the revenue model is plausible and strategically
              aligned with partners, but still too opaque to treat as a mature recurring-software engine.
