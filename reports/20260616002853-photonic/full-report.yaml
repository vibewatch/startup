      - number: '1.2'
        title: Founders, leadership transition, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership is now split between the founding scientific voice and a newer commercialization-oriented chief
              executive. Stephanie Simmons remains the company’s most visible technical figure as founder and chief
              quantum officer, and outside recognition such as UNESCO’s Quantum 100 reinforces both founder-market fit
              and key-person concentration. Thewalt remains a named co-founder in public materials, but the public
              operating story since 2023 has centered far more on Simmons and then-CEO Paul Terry.


              Governance visibility improved materially in early 2026. Following the January financing, Photonic
              publicly disclosed a board expansion led by Alex van Someren as executive chair, Don Mattrick as vice
              chair, and Nathan Medlock and Ashton Scordo as new directors. A month later the company shifted Don
              Mattrick into the CEO seat while moving Paul Terry to chief product officer, framing the change as added
              executive capacity for commercialization and long-term growth. That is a meaningful signal that the
              company believes it has moved past pure architecture formation and into market-building mode. Even so, the
              public record still does not disclose board committees, control rights, or a detailed succession framework
              beyond the new CEO/CPO split, so downstream governance analysis will need to treat those items as
              unresolved.
