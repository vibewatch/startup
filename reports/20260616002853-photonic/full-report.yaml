      - number: '2.2'
        title: TAM, SAM, SOM, and timing uncertainty
        blocks:
          - type: paragraph
            body: >-
              The long-term TAM is easy to make look huge, but the public evidence is better used as a set of lenses
              than as one precise number. MarketsandMarkets estimates the global quantum computing market at $3.52
              billion in 2025 and $20.20 billion by 2030, a 41.8 percent CAGR, which is useful as a broad top-down
              envelope that includes hardware, services, and cloud access. Canada's own policy documents add another
              outer-envelope lens by projecting a $17.7 billion GDP contribution from the domestic quantum sector by
              2045, while also committing $334.3 million over five years and up to $92 million in Phase 1 of the
              Canadian Quantum Champions Program. But those figures are not interchangeable with Photonic's near-term
              revenue opportunity. A more defensible SAM is the subset of public budgets and strategic programs where
              buyers are already paying for milestone-based progress: DARPA's QBI, Canada's CQCP and IDEaS programs,
              open-access research facilities, hyperscaler integrations such as Azure, and telecom-security pilots such
              as TELUS. That is why current SOM is best proxied by funded programs, platform integrations, and repeat
              pilots rather than by assuming mass enterprise penetration. Contradictory timing signals need to be
              preserved: DARPA is explicitly testing whether utility-scale systems can be plausible by 2033, while
              skeptics and industry critics still argue that practical commercial impact may be a decade or more away.
