  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer surfaces: real external counterparties exist, but most public proof is partner or program shaped'
        blocks:
          - type: paragraph
            body: >-
              Photonic does have visible external counterparties, but the public pack is narrower than the investor list
              or the set of industries management says quantum could eventually serve. The disclosed surfaces fall into
              five buckets: Microsoft as cloud and platform partner, TELUS as telecom network operator and deployment
              environment, United States government benchmark and defence programs, Canadian federal quantum programs,
              and an unnamed set of early enterprise or 'journey' customers referenced in management interviews. That
              mix matters because it separates customer-adjacent traction from scaled paying-customer proof. Microsoft
              and TELUS are meaningful because they are named external institutions willing to put brand,
              infrastructure, and technical teams behind the relationship. DARPA, CQCP, and IDEaS are also meaningful
              because they name Photonic in milestone-based government programs and put real non-dilutive or
