          label: Choose access path
          detail: Use cloud-linked access, private-system engagement, or a carrier-style network test environment
          tone: neutral
        - id: wf3
          label: Prepare module and control plan
          detail: >-
            Photonic software schedules local operations, entanglement resources, and error-correction logic around the
            selected task
          tone: positive
        - id: wf4
          label: Generate and route entanglement
          detail: >-
            Telecom-band photons are routed across on-chip and fibre links to create Bell-pair resources between
            relevant qubits or modules
          tone: positive
        - id: wf5
