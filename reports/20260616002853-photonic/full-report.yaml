      - number: '7.2'
        title: Legal, regulatory, and sovereignty risk
        blocks:
          - type: paragraph
            body: >-
              Photonic sits inside a policy domain that is getting more regulated before it is fully commercialized. On
              the defensive side, NIST is telling organizations to migrate to post-quantum cryptography now and to
              remove vulnerable algorithms on a defined timeline, which helps demand for quantum-secure networking but
              also reframes value toward security transitions rather than toward near-term utility-scale compute. On the
              restrictive side, U.S. export controls now cover quantum computers, components, software, and related
              technology, while Canadian guidance treats quantum as a dual-use area that requires tighter controls
              around partnerships, affiliations, physical access, cyber security, and intellectual property sharing.
              Photonic's own terms then add a narrower but still relevant legal signal: its QRE, QNet, and QaaS-style
              application surfaces are governed by broad outage, third-party-service, and no-perfect-security language.
              None of that is unusual for a startup, but it does mean investors should view regulatory and legal risk as
              an operating constraint on global scaling, partner selection, hosted-service assurance, and sovereign
              go-to-market strategy rather than as a distant compliance afterthought.
            claimRefs:
              - CR015
              - CR016
