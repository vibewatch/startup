            body: >-
              The strongest direct budget competitors are not identical in modality, but they all compete for the same
              strategic procurement pools. IBM already has a large partner base, multiple >100-qubit systems, and a
              mature roadmap narrative. Google has public error-correction credibility via Willow. IonQ and Quantinuum
