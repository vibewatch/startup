      - number: '3.4'
        title: Switching cost, lock-in, and partner leverage
        blocks:
          - type: paragraph
            body: >-
              Switching costs remain lower than many startup narratives imply. Quantum hardware is still procured mostly
              through evaluation programs, cloud credits, subscriptions, or bespoke enterprise relationships, so buyers
              can multi-home across modalities for years before settling on one system architecture. The more durable
              advantage sits in distribution, supply, and trusted deployment. IBM brings partner breadth and
              datacenter-grade reliability. IonQ and Quantinuum have clearer merchant and cloud motions. D-Wave and IQM
              each offer on-prem or tightly integrated paths for organizations that care about latency, sovereignty, or
              control. PsiQuantum, QuEra, and Quantinuum all lean on powerful manufacturing, cloud, or capital partners.
              Photonic's telecom-native architecture could create real lock-in if it becomes the preferred route for
              networked quantum systems, but today buyers still retain meaningful optionality because access and
