      - number: '6.3'
        title: 'Durability and expansion: continuity is visible, but retention economics and concentration remain undisclosed'
        blocks:
          - type: paragraph
            body: >-
              Photonic's durability case is currently a continuity story, not a disclosed retention story. Microsoft
              continuity is visible across the 2023 Azure announcement, the 2024 technical milestone, and the 2026
              financing materials that still describe Microsoft as an existing strategic supporter. TELUS continuity is
              also visible because the 2026 release explicitly says the work builds on the 2024 partnership. DARPA shows
              the same pattern in institutional form, moving from initial participation to Stage B. Those are the best
              available repeat-use or repeat-validation proxies in the public record, and they are valuable because they
              show relationships surviving beyond a launch headline. Still, the analyst cannot translate that into
              customer durability economics. There is no public customer count, NRR, GRR, churn, contract length,
              revenue mix, or top-customer concentration. The main expansion wedges are also easy to name but hard to
              quantify: Azure distribution, telecom-secure networking, and public-sector procurement conversion. That
              leaves a familiar deep-tech risk pattern. A small number of flagship relationships dominate disclosure,
              while production revenue breadth stays opaque. BetaKit's June 2026 piece on quantum drug discovery adds a
              useful adverse lens: marquee end markets still have not reached a ChatGPT-like breakthrough, so it would
              be premature to read technical milestones as broad customer adoption. The practical verdict is
              constructive but cautious: the public set proves serious external traction, yet it proves partner and
              program credibility more clearly than scaled commercial demand.
