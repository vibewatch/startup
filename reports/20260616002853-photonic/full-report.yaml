      - number: '1.4'
        title: Scale metrics, stage, and explicit disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators improved during 2025-2026 but still stop well short of what a later-stage capital
              raise might imply. Official headcount moved from more than 120 employees in 2023 to 150-plus around the
              late-2025 and early-2026 period, then 160-plus by the May 2026 final close. BetaKit’s follow-up interview
              put the current team at roughly 170 people and said management planned to grow above 200, which is
              directionally useful but still not a canonical filed or audited figure.


              Revenue disclosure is even thinner. The best public number in the pack is a January 2026 BetaKit interview
              in which Paul Terry said revenue was in the single-digit millions with initial journey customers and that
              the company hoped to reach tens of millions the following year. That is useful color, but it is still
              management interview guidance rather than independently corroborated revenue, ARR, or contract data. The
              company also does not publish a current customer count. As a result, this chapter can confidently carry
              valuation, lifetime funding, team-size range, and public-program support into later chapters, but it
              should leave customer count null and keep revenue as a caveated management-reported figure only. The same
              caution applies to exact HQ site labeling and to any claim about control rights or mature commercial
              deployments by vertical.
