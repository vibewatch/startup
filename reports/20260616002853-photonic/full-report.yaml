      - number: '1.5'
        title: Milestones, external validation, and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              The public milestone record is strong enough to anchor the rest of the report. The sequence starts with
              the 2016 founding and the 2021 shift into commercialization, then becomes much clearer from late 2023
              onward: the Microsoft collaboration and $100M USD raise, the 2024 distributed-entanglement milestone, 2025
              entry into Canada’s CQCP and DARPA’s QBI Stage B, the January 2026 first close, the February board
              expansion, the March CEO transition, the May 2026 final close at a $2B USD valuation, and the TELUS fibre
              teleportation demonstration. Together these milestones show a company trying to convert differentiated
              architecture into partner-backed commercialization and public-sector validation.


              But validation is not the same as proof of utility. DARPA’s own QBI framing emphasizes a hard 2033 test:
              computational value must exceed cost, and Stage B only examines the plausibility of the R&D plan. That
              caution matters because Photonic’s use-case story still leans heavily on future value in drug discovery,
              materials, climate, and security. Independent adverse coverage reinforces the gap between promise and
              proof: IEEE Spectrum argues practical fault-tolerant quantum computing could still be a decade away, and a
              June 2026 BetaKit article on quantum chemistry says the field has not yet had a ChatGPT-like breakthrough
              in real drug-discovery workflows. The right reusable conclusion is that Photonic has unusually strong
              capital, partnerships, and benchmark-program visibility for a private quantum company, but it is still
              pre-proof on broad commercial utility.
