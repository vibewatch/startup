      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand-side drivers are credible, but they are not enough to erase the execution gap. NIST's
              post-quantum cryptography program and FIPS 203 create a concrete security migration timeline that raises
              the strategic value of quantum-safe networking and secure communications. Quantum.gov and Canada's
              National Quantum Strategy show that sovereign compute, secure communications, talent retention, and
              national-security goals are already shaping budgets, while cloud access and modular architectures widen
              the pool of technical evaluators who can test quantum systems without owning the full stack. At the same
              time, the constraint stack remains severe. Photonic itself argues that better error correction and
              any-to-any connectivity are necessary because today's architectures still struggle with
              physical-to-logical qubit overhead. Analyst and skeptical coverage reinforces the same point: high error
              rates, expensive infrastructure, scarce talent, and unclear real-world economics slow the path from
              scientific promise to durable revenue. Even use cases often cited as early wins, such as drug discovery,
              face buyer skepticism because the workflow bottleneck may sit in wet-lab biology rather than in molecular
              simulation. The practical underwriting conclusion is that Photonic has exposure to a strategically
              important category, but valuation should weight milestone conversion, procurement repeatability, and
              networking monetization more heavily than broad TAM rhetoric.
