      - number: '8.3'
        title: Scenario range, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >
              Scenario work should stay deliberately broad because the biggest missing variables are still private. The
              bull case assumes Photonic converts DARPA, Azure, and networking credibility into repeatable commercial
              revenue, moves well beyond single-digit millions, and keeps its multiple in the same neighborhood as the
              stronger photonic-quantum names. The base case is less ambitious: Photonic remains private, keeps
              technical momentum, but only slowly discloses revenue quality, leaving the next round or eventual IPO
              window closer to the current mark than to the highest cohort valuations. The bear case is not exotic. If
              commercialization timing slips, if public quantum multiples compress, or if the next raise clears below
              today's valuation, the company could rerate toward the lower end of private comparables despite genuine
              technical promise. That is why exit readiness today should be scored as not-yet-ready for public markets.
              Public readiness needs both scale and disclosure, and Photonic clearly has not crossed that line yet.
              Photonic has the strategic story and funding to keep building, but not the public operating evidence to
              behave like a de-risked IPO candidate. The final diligence asks are therefore straightforward: prove the
              revenue bridge, prove gross-margin direction, prove customer diversification, prove runway, and prove
              there is no preference overhang that makes the headline mark look better than the economic reality.
