  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              Photonic is not entering a greenfield category. Buyers evaluating utility-scale quantum systems can choose
              among superconducting incumbents such as IBM and Google, trapped-ion platforms such as IonQ and
              Quantinuum, photonic architectures from PsiQuantum and Xanadu, neutral-atom systems from QuEra, annealing
              hardware from D-Wave, and adjacent topological efforts from Microsoft. DARPA's QBI and US2QC programs
              reinforce that the field is being benchmarked across multiple modalities rather than converging on a
