      - number: '7.5'
        title: People, capital, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk is amplified by both leadership concentration and the sheer breadth of what Photonic is
              attempting at once. In March 2026 the company shifted Don Mattrick into the CEO role and moved Paul Terry
              into chief product officer, explicitly to strengthen commercialization, while Stephanie Simmons remained
              founder and chief quantum officer and still anchors much of the scientific credibility, sovereign-policy
              connectivity, and architecture narrative. That combination can be an advantage if productization
              accelerates, but it also means key-person risk has not gone away; it has become more bifurcated between
              technical leadership and go-to-market execution. Financially, the company is well funded in relative
              terms, yet the disclosed business is still early: more than $350 million raised, roughly a $2 billion
              valuation, single-digit-millions revenue, 150-plus employees, additional hiring plans, and a new U.K.
              facility. ResearchMoney and Means & Ways both frame the Canadian quantum opportunity as capital intensive
              and sensitive to risk aversion. For investors, that means the round bought time, but not immunity. If
              technical readiness, paid deployments, or partner conversion lag, the next financing discussion could
              arrive before the market grants Photonic the benefit of the doubt.
