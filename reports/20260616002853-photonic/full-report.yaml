  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and pricing discipline
        blocks:
          - type: paragraph
            body: >
              Photonic has enough evidence to remain investable in principle, but not enough to support a clean buy at
              the current private mark. The strongest positives are real: the company closed more than $200 million of
              fresh capital in May 2026 at a $2.0 billion post-money valuation, has now raised more than $350 million
              lifetime, remains inside DARPA's Stage B benchmarking process, and still benefits from a Microsoft-led
              ecosystem narrative plus a service model aimed at broad commercial access rather than a tiny number of box
              sales. The problem is denominator quality. Public revenue disclosure remains only single-digit millions
              with initial journey customers, while exact cash, burn, gross margin, customer concentration, and
              preference-stack details remain private. That means the numerator is known but the economic engine behind
              it is still mostly inferred. The right call is therefore track / research-more with medium confidence,
              high risk, and a stretched but not uniquely irrational valuation stance: the business may deserve
              continued attention, yet a disciplined investor should ask for more proof or a better entry rather than
              underwrite $2.0 billion on narrative alone.
