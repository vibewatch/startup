companyProfile:
  summary: >-
    Photonic is a Coquitlam / Greater Vancouver quantum-computing infrastructure company founded in 2016 by Dr.
    Stephanie Simmons and Dr. Michael Thewalt to commercialize silicon T-centre spin qubits linked at telecom
    wavelengths. The company sells a long-duration vision rather than a mature current product line: distributed quantum
    computing and quantum-networking systems that can scale through its Entanglement First architecture, reach cloud
    users through Microsoft Azure relationships, and potentially fit telecom and government-security deployments through
    fibre-compatible networking. By mid-2026 Photonic had raised more than $350 million, closed a >$200 million
    financing at a $2.0 billion post-money valuation, joined DARPA's QBI Stage B cohort, won Canadian Quantum Champions
    Program support, and expanded work with TELUS and Microsoft. What remains less visible is the actual commercial
    engine behind that progress: public revenue is still only management-described single-digit millions, customer names
    are sparse, and unit economics remain undisclosed.
