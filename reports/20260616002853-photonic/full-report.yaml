  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Photonic is not selling a single isolated quantum box in the way many early hardware narratives implied.
              The reviewed public surface consistently frames the company as building a unified quantum computing and
              networking platform in which the core product is a modular, telecom-connected system that can be consumed
              as cloud-accessed compute, deployed as a dedicated private system, or extended into secure-networking
              products such as repeaters, switches, and quantum-key-distribution-style links. In workflow terms, the
              buyer is selecting either a compute path or a secure-network path, but both paths sit on the same
              underlying asset stack: T-centre silicon spin-photon qubits, cryogenic processing modules, on-chip
              photonics, room-temperature optical switching, and a software layer that schedules entanglement,
              operations, and error correction. That matters because Photonic's commercial narrative depends less on a
              single SKU than on a system architecture that can serve multiple operating contexts. The strength is
              architectural coherence. The weakness is packaging. Public sources describe the layers and target outcomes
              clearly, but they do not yet disclose general-availability SKUs, support tiers, or a clean product catalog
              that would let an enterprise buyer distinguish today's deployable offer from the roadmap that still sits
              ahead.
