- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - key dependency
  - key risk
  rows:
  - - T-centre defect register
    - Provides communication, computation, and memory primitives in silicon
    - Stable telecom-band spin-photon interface and usable spin coherence
    - Optical quality and spin performance still depend on fabrication and local environment
  - - Nanophotonic cavities and waveguides
    - Collect, route, and enhance single-photon emission on chip
    - High-Q cavity fabrication, alignment, and low-loss photonics
    - Nanophotonic integration can broaden linewidths and introduce spectral instability
  - - Cryogenic module
    - Hosts the quantum processor chip, cavities, switches, and detectors in a 1 K environment
    - Reliable cryogenic packaging, thermal control, and module serviceability
    - Capacity, maintainability, and cost at system scale are not publicly quantified
  - - On-chip and room-temperature switching
    - Routes photons within modules and between fibre-linked modules
    - Low-loss switching, timing, and detector synchronization
    - Throughput bottlenecks or synchronization drift could cap entanglement rate
  - - Telecom-fibre interconnect
    - Carries entanglement and enables chip-to-chip and cryostat-to-cryostat operations
    - Existing fibre infrastructure and efficient O-band emission
    - Loss, indistinguishability, and routing overhead still determine usable inter-module performance
  - - Control, scheduling, and error-correction software
    - Manages entanglement generation, scheduling, computation, and SHYPS-style error correction
    - Mature compilers, decoders, and orchestration software around high-connectivity hardware
    - Public sources do not disclose software benchmarks, support tooling, or production observability
  - - Delivery and partner layer
    - Connects the hardware stack to Azure, private systems, and telecom-network experiments
    - Partner APIs, procurement alignment, and field deployment capability
    - Productization can lag architecture if partner integration and support packaging stay immature
  notes: The architecture is synthesized from official diagrams, whitepapers, and device papers because Photonic does not publish a single exhaustive system specification sheet.
