  evidenceGaps:
  - type: missing-source
    severity: material
    topic: assurance-gap
    missingEvidence: Independent or official documentation of security certifications, assurance reviews, uptime SLOs, incident response commitments, or a production status surface for Photonic's compute and networking products.
    whyItMatters: Enterprise and regulated-network buyers need formal assurance artifacts before trusting quantum infrastructure in production environments.
    diligencePath: Request Photonic's security questionnaire, certification list, status and incident policies, and any cloud or private-system operating commitments.
    relatedQuestionRefs:
    - QE021
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: commercial-surface
    missingEvidence: Named SKUs, launch dates, pricing or contracting model, and support SLAs for Azure-linked access, private deployments, or networking products.
    whyItMatters: Without a ship-ready commercial surface, it is difficult to separate partner interest and roadmap intent from a currently buyable product.
    diligencePath: Request the current product catalog, launch calendar, customer handoff model, and support handbook for each delivery path.
    relatedQuestionRefs:
    - QE009
    - QE021
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: entanglement-rate
    missingEvidence: Module-level entanglement rates, repeated-run uptime, and operational calibration burden at multi-module system scale.
    whyItMatters: Economic value depends on repeatable distributed entanglement under sustained operation, not only milestone demonstrations between a small number of modules.
    diligencePath: Review internal benchmark dashboards, entanglement-rate logs, and fault-tolerant experiment reports from multi-module testbeds.
    relatedQuestionRefs:
    - QE011
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: yield-and-fabrication
    missingEvidence: Wafer-level yield distribution for cavity-coupled T centres after Stark tuning, spectral-stability mitigation, and device qualification.
    whyItMatters: Scale economics depend on how many usable emitters per chip survive nanofabrication, resonance alignment, and calibration.
    diligencePath: Request wafer maps, yield histograms, resonance-control data, and process-control reporting for the most recent device generations.
