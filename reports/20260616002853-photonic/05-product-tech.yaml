tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - module / asset
  - primary user
  - status / maturity
  - differentiation
  - diligence gap
  rows:
  - - T-centre silicon spin-photon qubit
    - Quantum hardware and architecture team
    - Research-proven core modality with multiple papers and official technical positioning
    - Combines telecom-band photonic interface with silicon spin qubits and memory potential in one platform
    - Need wafer-level yield, reproducibility, and long-run operating data beyond paper milestones
  - - Cryogenic quantum processing module
    - Internal operations; future private-system customer
    - Architecture-defined and partially demonstrated between separate cryostats
    - Packs qubits, cavities, switches, and detectors into a modular 1 K node rather than a single giant monolith
    - Public sources do not disclose module qubit count, serviceability, or field-maintenance model
  - - On-chip photonic cavities, waveguides, and detectors
    - Device and systems engineering teams
    - Demonstrated in papers and architecture whitepapers
    - Native silicon photonics path improves collection, routing, and CMOS compatibility
    - Detector yield, packaging complexity, and full-chip resonance distribution remain undisclosed
  - - Room-temperature optical switch and control layer
    - Systems software and control teams
    - Publicly described as part of the operating architecture
    - Lets telecom fibre and control electronics stay outside the cryostat for modular scaling
    - No public throughput, latency, or orchestration benchmarks were reviewed
  - - Distributed compute service surface
    - Enterprise and government compute buyer
    - Roadmap-level commercial surface with Azure and private-system language
    - Same architecture can be sold as services rather than only as expensive dedicated hardware
    - No public GA date, named SKU, pricing sheet, or uptime commitment was found
  - - Quantum networking products
    - Telecom, security, and public-sector network operator
    - Early product-family positioning
    - Repeaters, switches, and QKD-style solutions reuse the same telecom-native platform
    - Commercial deployment references are still pilot and partner led, not broad product rollouts
  - - Partner delivery layer
    - Cloud and carrier partner
    - Demonstrated at partnership and test-network level
    - Microsoft and TELUS give real integration surfaces instead of purely hypothetical channels
    - Revenue split, support ownership, and customer handoff remain undisclosed
  - - Engineering and support organization
    - Photonic internal builders; future customers indirectly
    - Visible through careers and recruiting surface
    - Multi-disciplinary buildout across software, hardware, photonics, product, and operations is consistent with a full-stack platform
    - Public support processes are described culturally, not as enterprise operations commitments
  notes: Rows separate architecture assets that are clearly evidenced from commercial packaging that remains partly roadmap-level. Status labels refer to reviewed public evidence, not internal readiness.
