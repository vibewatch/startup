    - label: Access and use-case layer
      detail: Cloud-accessed compute, private-system access, and secure-networking product surfaces for enterprise, telecom, and government users
      tone: neutral
    - label: Workflow and orchestration layer
      detail: Job scheduling, entanglement management, computation, and error-correction control software
      tone: positive
    - label: Partner and interconnect layer
      detail: Azure integration surface, telecom fibre links, and room-temperature optical switch network outside the cryostat
      tone: neutral
    - label: Module networking layer
      detail: Any-to-any links between qubits, chips, cryostats, racks, and potentially data centres using telecom photons
      tone: positive
    - label: Cryogenic processing layer
      detail: 1 K cryostat modules hosting the quantum processor chip and local photonic hardware
      tone: neutral
