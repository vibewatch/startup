- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Photonic solution
  - measurable benefit
  - limitation
  rows:
  - - Run a large-scale quantum algorithm
    - Access future cloud or dedicated compute capacity rather than buy a monolithic one-off machine
    - Distributed entanglement links silicon modules so non-local quantum logic can run across the system
    - Architecture and QRE materials claim scale-out can support commercially relevant qubit counts
    - Public proof is still milestone and simulation heavy rather than GA service evidence
  - - Deploy a sovereign or private quantum system
    - Keep sensitive workloads in a dedicated environment instead of only a shared cloud endpoint
    - Photonic explicitly markets private-system access alongside cloud-accessed services
    - Same underlying architecture can serve compute buyers that need control over environment and integration
    - No public deployment playbook, support SLA, or system configuration sheet was reviewed
  - - Build a telecom-secure quantum network
    - Use existing fibre plant and partner lab environments for testing secure quantum links
    - Telecom-band photons, dedicated fibre, and room-temperature switching enable network-style operating flows
    - TELUS partnership provides a 30-km dedicated network for increasingly complex tests and QKD-style work
    - Pilot and testbed evidence does not yet equal scaled carrier product availability
  - - Validate a utility-scale roadmap with government or strategic stakeholders
    - Submit architecture, milestones, and risk plans to technical review programs
    - DARPA QBI and CQCP give Photonic external scrutiny on feasibility and risk-reduction plans
    - Raises confidence that the roadmap is technically serious rather than purely promotional
    - These programs test plausibility, not customer adoption or service reliability
  - - Integrate quantum access into partner ecosystems
    - Reach users through cloud and telecom partners rather than only direct hardware sale
    - Microsoft and TELUS provide explicit cloud and network integration surfaces
    - Expands route to market beyond a tiny set of buyers able to procure bespoke hardware
    - Commercial terms, onboarding process, and customer support split remain undisclosed
  notes: Benefits are stated as demonstrated milestones or explicit partner-supported workflow claims. They should not be read as proof of present-day production-scale adoption.
