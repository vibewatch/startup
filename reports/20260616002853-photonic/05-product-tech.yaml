- id: TE005
  title: Roadmap / release / development-stage table
  columns:
  - date / stage
  - feature or milestone
  - status
  - implication
  - source
  rows:
  - - 2021 research
    - Optical observation of single T-centre spins in silicon
    - Demonstrated
    - Established the T centre as an individually addressable telecom-band spin-photon qubit candidate
    - arXiv 2103.07580 and Nature follow-on page
  - - 2021 process work
    - T centres created in SOI wafers with quantified spectral diffusion
    - Demonstrated
    - Moved the modality toward device-compatible silicon photonics while surfacing interface-stability risk
    - arXiv 2103.03998
  - - 2022 integration
    - Waveguide-integrated T centres and memory/transduction design studies
    - Demonstrated and characterized
    - Expanded from defect physics into photonic-chip integration and memory architecture planning
    - arXiv 2209.14260 and 2209.11731
  - - 2023 architecture launch
    - Entanglement First architecture plus Microsoft co-innovation announcement
    - Public launch
    - Turned the science stack into a partner-facing product and ecosystem roadmap
    - Photonic news, Microsoft page, and networked-supercomputers whitepaper
  - - 2024 distributed milestone
    - Distributed entanglement and teleported CNOT between separate cryostats over telecom fibre
    - Demonstrated
    - Validated the scale-out thesis beyond a single chip or single cryostat
    - Distributed quantum computing whitepaper and official technology pages
  - - 2025 error-correction layer
    - SHYPS QLDPC launch and companion scientific paper
    - Publicly claimed and simulation-backed
    - Major differentiation claim on physical overhead and logical-clock efficiency, but not yet a public logical-qubit product demo
    - Photonic error-correction page, BusinessWire release, and SHYPS whitepaper
  - - 2025 control milestone
    - Electrically triggered spin-photon device in silicon
    - Demonstrated
    - Supports the case for parallelizable electrical control and CMOS-compatible scaling
    - arXiv 2501.10597 and PostQuantum explainer
  - - 2025-2026 validation and tuning
    - DARPA Stage B, CQCP Phase 1, SHYPS-to-Shor's QRE, memory protection, and Stark tuning
    - In progress
    - Shows a shift from architecture proof to yield, roadmap scrutiny, and system-level optimization rather than finished product rollout
    - DARPA, CQCP, SHYPS-to-Shor's, arXiv 2512.16047, and arXiv 2604.25170
  notes: Chronology mixes device, architecture, and validation milestones because Photonic's public roadmap is still R&D-led. "Status" refers to the state of public evidence, not internal commercialization gating.
