- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control or metric
  - status
  - scope
  - gap
  rows:
  - - Telecom-band native photon interface
    - Demonstrated and repeatedly described across official and academic sources
    - Low-loss fibre compatibility for networking and distributed entanglement
    - Public sources do not disclose end-to-end service reliability targets on live networks
  - - Teleported inter-module gate sequence
    - Demonstrated between memory qubits in separate cryostats over 40 m fibre
    - Proof that distributed entanglement can be consumed for non-local operations
    - Entanglement rate, repeated-run yield, and uptime under sustained operation are not public
  - - Electrical single-photon and spin initialization control
    - Demonstrated with single-photon electroluminescence and 92(8)% heralded initialization fidelity
    - Supports scalable actuation and reset concepts on silicon photonic hardware
    - Multi-qubit electrical control, cross-talk, and fleet-scale calibration remain unproven publicly
  - - Spectral stability and resonance control
    - Active research area with resonance-check narrowing and Stark tuning up to 30 GHz
    - Improves indistinguishability and raises the share of mutually resonant on-chip emitters
    - Public data still show spectral diffusion, excited-state mixing, and only partial usable-device yield
  - - External technical diligence
    - DARPA Stage B and CQCP Phase 1 selected Photonic for formal roadmap scrutiny
    - Independent review of feasibility, risks, and required prototypes
    - These are technical diligence programs, not customer security certifications or compliance audits
  - - Enterprise assurance disclosures
    - Not publicly disclosed in the reviewed pack
    - Security certifications, status reporting, uptime commitments, and support SLAs
    - SOC 2, ISO 27001, status page, incident response commitments, and GA support documentation were not found
  notes: This table distinguishes technical quality controls from enterprise assurance. The former are visible in papers; the latter remain materially under-disclosed.
