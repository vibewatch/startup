- id: maturity-roadmap-and-differentiation
  title: Maturity, roadmap, and differentiation
  body: >-
    Photonic's differentiation is real, but readers should separate
    architecture advantage from already-shipping product maturity. The
    differentiated core is the combination of telecom-wavelength T centres in
    silicon, modular fibre-linked scale-out, and non-local connectivity that
    can support SHYPS QLDPC codes. In principle that gives Photonic an
    architecture that is better aligned with distributed fault tolerance than
    systems that must add transduction layers or nearest-neighbour routing
    overhead later. The public milestone trail also shows real progress rather
    than a static concept slide: early T-centre observation, SOI implantation,
    waveguide integration, distributed entanglement between cryostats,
    electrically triggered spin-photon devices, SHYPS error-correction papers,
    and 2026 Stark-tuning results aimed at improving usable-device yield. But
    the strongest caveat in this chapter is that the most dramatic
    error-correction and quantum-resource-estimation claims remain model- and
    simulation-led. SHYPS may indeed lower physical overhead and speed the
    logical clock, and the distributed QRE work is intellectually substantive,
    yet none of that is the same thing as a publicly demonstrated large
    logical-qubit system or a broadly available commercial service. DARPA Stage
    B and CQCP help validate plausibility and roadmap discipline, but they are
    still diligence programs, not market proof.
