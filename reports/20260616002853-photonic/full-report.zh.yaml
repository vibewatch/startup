            title: DARPA 验证不等于市场验证
            body: B 阶段有助于把严肃方案和炒作分开，但 DARPA 自己也说，到 2033 年，可能有多个、一个，甚至没有团队达到工业实用性。因此，Photonic 应因经受审查而获得认可，而不是被视为已经赢下商业化竞赛。
