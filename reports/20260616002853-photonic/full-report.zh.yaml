        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              Photonic 进入的不是绿地市场。评估实用规模量子系统的买家，可以在 IBM 和 Google 等超导既有厂商、IonQ 和 Quantinuum 等囚禁离子平台、PsiQuantum 和 Xanadu
              的光子架构、QuEra 的中性原子系统、D-Wave 的退火硬件，以及 Microsoft 相邻拓扑路线之间选择。DARPA 的 QBI 和 US2QC
              项目也强化了一点：这个领域是在多个模态之间做基准，而不是向单一赢家收敛。这意味着直接同行、相邻架构、现状替代品和潜在进入者必须同时纳入。近期替代集合尤其重要，因为买家已经可以通过公有云、订阅或伙伴项目测试多个竞争系统，无需先押注
