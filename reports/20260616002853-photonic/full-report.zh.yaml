companyProfile:
  summary: >-
    Photonic 是一家位于 Coquitlam / Greater Vancouver 的量子计算基础设施公司，由 Dr. Stephanie Simmons 和 Dr. Michael Thewalt 于 2016
    年创立，目标是把以电信波长连接的硅 T-centre 自旋量子比特商业化。公司卖的不是成熟现货产品线，而是一套长期愿景：分布式量子计算和量子网络系统，靠 Entanglement First 架构扩展，通过 Microsoft
    Azure 关系触达云用户，并可能借助兼容光纤的网络能力进入电信和政府安全部署场景。到 2026 年中，Photonic 已累计融资超过 $350 million，以 $2.0 billion 投后估值完成 >$200
    million 融资，进入 DARPA QBI Stage B 队列，获得 Canadian Quantum Champions Program 支持，并扩大了与 TELUS 和 Microsoft
    的合作。真正不透明的是这些进展背后的商业引擎：公开收入仍只是管理层所说的个位数百万美元，客户名称稀少，单位经济性也未披露。
