  - id: TV005
    title: 论点失效和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入规模停滞
        - 进入下一个里程碑周期后，收入看起来仍只有个位数百万美元
        - 击穿商业化正在追上 $2B 标记的判断
        - 下调为回避，或要求入场估值大幅降低
      - - 下一轮融资重设估值
        - 新资金成交价格低于 2026 年 5 月投后估值
        - 表明市场不再相信当前轮次站得住
        - 在新经济条款或保护条款披露前，视为论点失效
      - - 利润率和客户质量不及预期
        - 数据室证据显示毛利率弱、集中度高，或收入主要来自不可重复项目
        - 削弱服务驱动规模化能够支撑溢价倍数的论点
        - 下调基准和牛市估值带
      - - 上市可比公司倍数压缩
        - 上市量子同业因执行或政策失望而明显下修估值
        - 拿走整个梯队数十亿美元标记的外部支撑
        - 收紧入场纪律，并推迟任何公开退出预期
      - - DARPA / 生态势头减弱
        - 技术里程碑滑坡，或关键合作伙伴 / 项目支持变弱，且没有商业胜利来抵消
        - 降低论点里内嵌的战略稀缺性溢价
        - 在势头重新建立前，把建议调整为仅研究
    notes: 每个触发因素都刻意设计成可通过融资、披露或广泛报道的市场信号监控。
    claimRefs:
      - CV005
      - CV019
      - CV020
      - CV041
      - CV046
      - CV049
      - CV052
      - CV053
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 当前客户数、合同数，以及从个位数百万美元到明年目标收入的桥接
        - 如果不知道哪些收入真正可重复、哪些只是愿景，估值争议无法收口
        - 管理层 / CFO / 数据室
      - - 毛利率路径
        - 计算服务、网络产品和项目资助工作的分流毛利率
        - 服务驱动的溢价取决于利润率方向，不只取决于技术叙事
        - 管理层 / 财务 / 经营模型审查
      - - 客户集中度
        - 头部客户收入占比，以及政府、合作伙伴和企业需求之间的拆分
        - 集中的收入基础应当不同于广泛商业平台来定价
        - 管理层 / 收入运营 / 合同审查
      - - 烧钱和现金续航
        - 月度烧钱、资本开支计划，以及当前招聘和设施建设节奏下的现金续航敏感性
        - 轮次或许很大，但投资者仍需要知道它真正买来多少时间
        - 管理层 / FP&A / 董事会材料
      - - 股权结构和优先权
        - 完全稀释后所有权、清算优先权、反稀释条款，以及任何投资者附函
        - 如果优先权悬置很重，标题投后估值可能高估普通股经济性
        - 财务 / 法务 / 股权结构清算瀑布
      - - 退出准备度
        - IPO 与继续私有之间的内部门槛，包括最低收入和披露里程碑
        - 流动性路径的时间点会影响回报预期和未来稀释风险
        - CEO / 董事会 / 投资者关系准备材料
    notes: 这些问题对估值至关重要，因为每一个都会改变分母、风险评级或可能的退出路径。
    claimRefs:
      - CV005
      - CV009
      - CV010
      - CV011
