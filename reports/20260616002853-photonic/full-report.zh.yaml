      - number: '5.4'
        title: 信任、质量、合规与依赖面
        blocks:
          - type: paragraph
            body: >-
              Photonic 平台当前的信任更多来自技术控制和外部审查，而不是成熟的企业保障披露。技术侧，论文展示了具体质量工作：线宽和谱扩散表征、共振检查收窄、存储保护方案、电学自旋初始化，以及让更多发射体进入相互共振的
              Stark tuning。外部审查侧，DARPA 的 Stage B 流程明确考察通向实用规模计算的路径是否技术可信；CQCP
              也用政府侧尽调压测路线图。这些都是有用信号，但不能替代面向客户的安全和可靠性控制。在审阅的公开来源中，Photonic 尚未披露 SOC 2、ISO
              27001、正常运行时间承诺、公共状态页面，或面向计算和网络服务的生产支持
              SLA。依赖风险也不小。扩展仍依赖低温硬件、纳米光子良率、探测器和腔性能、纠缠生成速率、控制软件，以及与电信和云伙伴的互操作性。因此，最重要的尽调姿态，是把 Photonic
              视为具备高潜力、拥有有意义实验室和系统证据的 deeptech 平台，而不是已经完全披露的企业基础设施产品。
