  - id: FI004
    title: 资本强度 / 现金流图谱
    type: matrix
    layout: wide
    summary: Photonic 可见的现金需求大多落在人、实验室和技术基础设施上；公开记录仍没有给出检验准确 runway 所需的资产负债表数据。
    data:
      columns:
        - 类别
        - 公开信号
        - 现金特征
        - 承销含义
      rows:
        - label: 人员
          values:
            - label: 150+ -> 160+ -> ~170，目标 >200
              tone: warning
              detail: 商业化招聘在广泛收入验证前扩大固定薪酬。
            - label: 经常性 opex
              tone: neutral
              detail: 若利用率不能快速提升，薪酬会持续推高月度 burn。
            - label: 执行有上行，但成本拖累
              tone: warning
              detail: 招聘支撑 GTM，也抬高盈亏平衡门槛。
            - label: 需要按职能披露 burn
              tone: neutral
              detail: 投资者需要工程 / 商业 / G&A 组合。
        - label: 设施和实验室
          values:
            - label: 英国设施 3 年投入 > £25M
              tone: warning
              detail: 增加国际 R&D 足迹，可能带来 capex 和运营成本。
            - label: Capex 加经常性开销
              tone: neutral
              detail: 实验室建设通常把一次性装修与持续租用和设备成本绑在一起。
            - label: 支撑规模化，但拉长现金需求
              tone: warning
              detail: 设施增长在战略上是正向的，在财务上也很昂贵。
            - label: 需要 capex / opex 拆分
              tone: neutral
              detail: 公开材料未把装修投入与经常性支出分开。
        - label: 技术基础设施
          values:
            - label: 低温硬件、光子交换机、电信光纤、控制软件
              tone: warning
              detail: 硬件加软件架构意味着交付和支持成本不低。
            - label: COGS 与 R&D 负担混合
              tone: neutral
              detail: 一些成本属于产品开发，另一些会变成服务成本。
            - label: 利润率路径取决于开销下降能否真正落地
              tone: warning
              detail: 只有降低每个客户的交付成本，效率主张才有帮助。
            - label: 需要毛利桥
              tone: neutral
              detail: 没有公开毛利披露。
        - label: 政府支持
          values:
            - label: CQCP 最高 CA$23M，加 IDEaS CA$1M
              tone: positive
              detail: 抵消部分工程支出，且不立即稀释。
            - label: 部分现金支持
              tone: neutral
              detail: 有用，但相对于股权融资和总建设成本偏小。
            - label: 有缓冲，但不能替代商业需求
              tone: warning
              detail: 项目可以降低里程碑风险，但重复性市场需求仍未验证。
            - label: 需要会计处理和里程碑节奏
              tone: neutral
              detail: 确认时点未披露。
        - label: 商业流入验证
          values:
            - label: 公开收入为个位数百万美元，未披露现金余额
              tone: warning
              detail: 已有销售，但外部无法观察准确自我供血能力。
            - label: 转化为自由现金流仍未知
              tone: neutral
              detail: 没有 burn，runway 无法建模。
            - label: 目前够用，但仍依赖融资
              tone: warning
              detail: 新资本降低近期风险，但没有消除未来资本需求。
            - label: 需要现金、burn、积压订单和利润率披露
              tone: neutral
              detail: 这些仍是核心承销阻碍。
    approximationNotes: 由于 Photonic 不发布预算或现金流量表，该矩阵定性映射成本和现金流驱动因素。它旨在凸显准确尽调请求应聚焦的位置。
