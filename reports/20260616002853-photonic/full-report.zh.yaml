  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most useful retained 2025-2026 public and private quantum valuation references for Photonic's current
        round; no perfect disclosed pure-play comparable exists.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Xanadu
        - 2026 年 6 月上市后的市值
        - $4.16B 市值；上市光子量子公司
        - 保留样本里最接近的光子架构上市估值分子
        - 市值是当前交易价格，不是稳定的私有轮次标记，完整经营经济性仍在演进
      - - Nord Quantique
        - 2026 年春季私有融资
        - $30M 成长股权轮后估值 $1.4B
        - 有用的加拿大私有可比对象，显示投资者仍在支持更早期规模的量子玩家
        - 轮次规模更小，公开经营细节少于 Photonic
      - - Quantinuum
        - 2025 年 9 月私有融资
        - 融资 $600M 后，投前估值 $10B
        - 规模化量子领导者和商业化叙事的私有市场上限参照
        - 平台、资金基础和成熟度都远高于 Photonic
      - - PsiQuantum
        - 2025 年 9 月私有融资
        - $1B Series E 轮后估值 $7B
        - 另一家光子量子私有市场标记，显示市场会多激进地给认知中的品类领导者定价
        - 融资规模和制造野心超过 Photonic 的公开披露范围
      - - IonQ
        - 2026 年 6 月市值对比 2026 年 Q1 收入
        - $22.83B 市值；Q1 收入 $64.7M；现金 $3.1B
        - 显示公开市场仍会给已披露的领先量子平台多高定价
        - 公开市场热情和一次性会计项目让该估值很难作为冷静的公允价值锚
      - - Rigetti
        - 2026 年 6 月市值对比 2026 年 Q1 收入
        - $7.54B 市值；Q1 收入 $4.4M；现金 $569M
        - 有用的警示可比对象：极小收入仍能支撑数十亿美元上市估值分子
        - 持续亏损和小收入基数表明，该倍数高度依赖叙事
      - - D-Wave
        - 2026 年 6 月市值对比 2026 年 Q1 收入和订单
        - $9.72B 市值；Q1 收入 $2.9M；订单 $33.4M；现金 $588M
        - 有助于说明，系统销售热度和订单仍可能跑在当期收入前面
        - 如果转化或利润率证据变弱，订单驱动的故事会很波动
      - - Quantum Computing Inc.
        - 2026 年 6 月市值对比 2026 年 Q1 收入
        - $2.50B 市值；Q1 收入 $3.7M；现金 $1.4B
        - 最接近 Photonic 当前 $2B 估值的已披露上市估值分子
        - 近期收购和现金充裕的资产负债表，让简单收入倍数比较变复杂
    notes: 上市和私有可比对象支持使用较宽估值带，而不是假装今天存在一个干净的 Photonic 同业倍数。
