            body: >-
              Photonic 的持久性案例目前是一个连续性故事，而不是披露过的留存故事。Microsoft 的连续性贯穿 2023 年 Azure 公告、2024 年技术里程碑，以及 2026 年融资材料中仍把
              Microsoft 描述为现有战略支持者。TELUS 的连续性也可见，因为 2026 年发布明确称工作建立在 2024 年伙伴关系之上。DARPA 以机构形式呈现同样模式，从初始参与推进到 Stage
              B。这些是公开记录中最佳可用的重复使用或重复验证代理，价值在于显示关系没有停留在发布会标题。但分析师不能把它转换成客户持久性的经济数据。公开资料没有客户数量、NRR、GRR、流失、合同期限、收入结构或头部客户集中度。主要扩张楔子也容易命名但难以量化：Azure
              分发、电信安全网络，以及公共部门采购转化。这留下了熟悉的 deep-tech 风险模式。少数旗舰关系主导披露，而生产收入广度仍不透明。BetaKit 2026 年 6
              月关于量子药物发现的文章提供了有用反向视角：标杆终端市场仍没有出现类似 ChatGPT
              的突破，因此不宜过早把技术里程碑解读成广泛客户采用。实际判断是建设性但谨慎：公开集合证明了严肃外部牵引力，但更清楚证明的是伙伴和项目可信度，而不是规模化商业需求。
