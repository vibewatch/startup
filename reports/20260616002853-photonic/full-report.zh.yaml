      - number: '1.4'
        title: 规模指标、阶段与明确披露缺口
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年，公开规模指标有所改善，但远没有达到后期融资可能暗示的披露深度。官方员工数从 2023 年的 120 多人，增加到 2025 年末和 2026 年初前后的 150 多人，再到 2026 年
              5 月最终关账时的 160 多人。BetaKit 的后续访谈称当前团队约 170 人，并表示管理层计划扩张到 200 人以上；这在方向上有用，但仍不是正式提交或审计过的数字。


              收入披露更薄。材料中最好的公开数字来自 2026 年 1 月 BetaKit 采访，Paul Terry 称公司已有初始 journey
              customers，收入为个位数百万美元，并希望次年达到数千万美元。这提供了有用背景，但仍是管理层访谈指引，不是独立佐证的收入、ARR
              或合同数据。公司也不公布当前客户数量。因此，本章可以有把握地把估值、累计融资、团队规模区间和公共项目支持带入后续章节，但应把客户数量留空，并只把收入作为带限定的管理层报告数字。同样的谨慎也适用于精确总部地点标签、控制权主张，或任何关于垂直行业成熟商业部署的说法。
