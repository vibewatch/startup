      - number: '7.2'
        title: 法律、监管与主权风险
        blocks:
          - type: paragraph
            body: >-
              Photonic 所处的政策领域，还没完全商业化就已经先进入更强监管。防御侧，NIST
              正要求机构现在就迁移到后量子密码，并按明确时间表移除易受量子攻击的算法；这有利于量子安全网络需求，但也把价值重心从近期实用级计算，转向安全迁移。限制侧，美国出口管制已经覆盖量子计算机、部件、软件和相关技术；加拿大指引则把量子视为双用途领域，要求围绕伙伴关系、关联方、物理访问、网络安全和知识产权共享收紧控制。Photonic
              自己的条款又补上一层更窄但仍有意义的法律信号：QRE、QNet 和 QaaS
              式应用界面，都受广泛的宕机、第三方服务和“不保证绝对安全”表述约束。这些对初创公司并不反常，但投资者应把监管和法律风险视为全球扩张、伙伴选择、托管服务保证和主权市场进入策略的运营约束，而不是遥远的合规附注。
