  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              分析 Photonic
              时，应把它看作量子计算基础设施和未来实用规模网络能力的卖方，而不是今天的大众市场软件供应商。官方技术页面围绕分布式量子计算、硅自旋量子比特、兼容电信的网络和纠错扩展展开，而不是自助式应用席位。这个边界重要，因为广义量子市场报告常把系统、服务、云访问和相邻类别混在一起；Photonic
              当前可触达需求则集中在愿意为架构验证、网络化原型和战略基础设施付费的买家。纳入支出因此应覆盖量子硬件、控制与纠错栈、暴露量子资源的云或平台集成，以及中继器、交换机、安全链路等量子网络产品。应排除普通高性能计算、通用网络安全、非量子半导体，以及不需要量子优势的主流
              SaaS 工作负载。替代集合也真实存在：IBM、IonQ、Quantinuum、PsiQuantum、Google 和 Microsoft 都显示，买家可以支持不同架构，或通过云平台消费量子能力，而不必专门选择
              Photonic。
