      - number: '5.3'
        title: 成熟度、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              Photonic 的差异化真实存在，但读者应把架构优势和已经出货的产品成熟度分开看。差异化核心，是硅中的电信波长 T centres、模块化光纤连接扩展，以及可支持 SHYPS QLDPC
              码的非局域连接。原则上，这让 Photonic 的架构比那些以后必须增加转导层或承担最近邻路由开销的系统，更适配分布式容错。公开里程碑也显示真实进展，而不是静态概念页：早期 T-centre 观测、SOI
              注入、波导集成、低温恒温器之间的分布式纠缠、电触发自旋-光子器件、SHYPS 纠错论文，以及 2026 年旨在提高可用器件良率的 Stark-tuning
              结果。但本章最强的限定是，最戏剧性的纠错和量子资源估算主张仍由模型和仿真驱动。SHYPS 也许确实能降低物理开销并加快逻辑时钟，分布式 QRE
              工作也有实质含量，但这不等于公开展示了大型逻辑量子比特系统，也不等于广泛可用的商业服务。DARPA Stage B 和 CQCP 有助于验证可信度和路线图纪律，但它们仍是尽调项目，不是市场证明。
