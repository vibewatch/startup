      - number: '7.3'
        title: 技术规模化与竞争替代
        blocks:
          - type: paragraph
            body: >-
              核心技术风险在于，Photonic 仍需要几个硬工程问题同时朝正确方向突破。2026 年 Stark 调谐论文令人鼓舞，因为它展示了本地控制和更高可用良率；但论文也明确指出，纳米光子集成会拓宽线宽，目前只有约
              55% 的片上 T
              中心能调到相互共振。更早的硅光子路线图论文说得更直接：通往容错计算的路径仍难捉摸，光子损耗仍是关键约束，有源开关是限制环节，拟议架构的容错阈值仍需识别。技术不确定性现在又叠上更吵的竞争背景。Google 称
              Willow 已跨过低于阈值的纠错里程碑；Microsoft 称 Majorana 1 在 DARPA 最终阶段工作中走的是“几年而非几十年”的路径；Quantinuum
              已经销售订阅并声称具备实时纠错；D-Wave 已经销售云访问和生产用例。即便这些平台与 Photonic 架构并不直接等价，它们仍在争夺预算、人才、伙伴注意力和投资者耐心。
