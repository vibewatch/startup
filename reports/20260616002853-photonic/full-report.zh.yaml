            body: >-
              最终财务判断是混合的，但在附带条件下可投资。收入质量仍为低到中等，因为公开证据止步于管理层报告的个位数百万美元、未具名 journey customers，以及间接渠道或项目证明。利润率路径在概念上有吸引力，因为
              Photonic 认为 QLDPC
              码和电信原生网络会降低量子比特开销和扩展成本，但这仍是工程主张，不是披露过的毛利润桥。资本充足性明显好于披露画像：公司显然拥有大额新股权垫和一些非稀释项目支持，但还没有给出现金、burn
              或跑道数据，无法证明这真是自我融资前最后一轮大型私募融资。公开量子同行强化了谨慎。即便流动性更深、报告更透明的公司，仍显示重度亏损或依赖新融资。因此，今天最佳承销姿态是：Photonic
              有足够资本继续执行，但公开透明度不足，若没有管理层级 data room 访问，无法承销耐久收入质量、利润率推进或精确的下一轮风险。
