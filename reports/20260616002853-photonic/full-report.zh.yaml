      - number: '1.5'
        title: 里程碑、外部验证与商业化风险
        blocks:
          - type: paragraph
            body: >-
              公开里程碑记录足以支撑报告后续分析。序列从 2016 年创立和 2021 年转向商业化开始，2023 年末以后变得清晰得多：Microsoft 合作与 $100M USD 融资、2024
              年分布式纠缠里程碑、2025 年进入加拿大 CQCP 和 DARPA QBI Stage B、2026 年 1 月首关融资、2 月董事会扩容、3 月 CEO 交接、5 月以 $2B USD 估值完成最终关账，以及
              TELUS 光纤传态演示。合起来看，这些里程碑显示公司正在把差异化架构转化为合作伙伴支持的商业化和公共部门验证。


              但验证不等于实用性证明。DARPA 对 QBI 的表述强调 2033 年的硬测试：计算价值必须超过成本，Stage B 只考察 R&D 计划的可信度。这一谨慎很重要，因为 Photonic
              的用例叙事仍重度依赖药物发现、材料、气候和安全领域的未来价值。独立反向报道也强化了承诺与证明之间的缺口：IEEE Spectrum 认为实用的容错量子计算可能仍要等十年；2026 年 6 月 BetaKit
              关于量子化学的文章称，真实药物发现流程中尚未出现类似 ChatGPT 的突破。可复用的正确结论是：作为一家私营量子公司，Photonic 在资本、合作伙伴和基准项目可见度上异常强，但广泛商业实用性仍未证明。
