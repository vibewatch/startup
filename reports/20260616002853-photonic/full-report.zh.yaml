      - number: '7.4'
        title: 伙伴依赖与渠道冲突
        blocks:
          - type: paragraph
            body: >-
              Photonic 公开的商业化路径异常集中在少数战略关系上。Microsoft 是最明显的例子：它参与融资、提供 Azure 基础设施，也是未来接入 Azure Quantum Elements
              的命名路径；但它同时也在独立推进 Majorana 1，并且更深地嵌在 DARPA 的实用级项目里。这种双重角色制造了典型的依赖冲突：Microsoft 可以是 Photonic
              触达企业最快的路径，也可以是让它被去中介化最快的路径。TELUS 也类似，只是范围更窄。电信关系证明了真实世界光纤兼容性，也给 Photonic
              一个部署环境，但它本身不能证明可重复的客户转化、定价权或利润率耐久性。政府项目引入第三层依赖。DARPA
              和加拿大主权安全项目带来有价值的验证和锚定支持，但也会提高审查强度，并可能把公司推向里程碑驱动、采购流程重的渠道。承销含义是，Photonic
              的伙伴版图强大但脆弱：每个主要盟友也都是一个集中点，条款不透明、战略分歧或客户交接慢于预期，都可能实质性削弱投资论点。
