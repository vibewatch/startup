      - number: '2.2'
        title: TAM、SAM、SOM 与时间不确定性
        blocks:
          - type: paragraph
            body: >-
              长期 TAM 很容易做得很大，但公开证据更适合作为一组视角，而不是一个精确数字。MarketsandMarkets 估计，全球量子计算市场 2025 年为 $3.52 billion，到 2030 年达到
              $20.20 billion，CAGR 为 41.8 percent；这可作为覆盖硬件、服务和云访问的广义自上而下边界。加拿大自身政策文件又提供了另一个外边界视角：预计国内量子行业到 2045 年贡献 $17.7
              billion GDP，同时承诺五年投入 $334.3 million，并在 Canadian Quantum Champions Program Phase 1 最高投入 $92
              million。但这些数字不能直接等同于 Photonic 的近期收入机会。更可辩护的 SAM，是买家已经为按里程碑推进付费的公共预算和战略项目子集：DARPA QBI、加拿大 CQCP 和 IDEaS
              项目、开放访问研究设施、Azure 等超大规模云集成，以及 TELUS 等电信安全试点。因此，当前 SOM
              最好用已获资助项目、平台集成和重复试点来近似，而不是假设大规模企业渗透。相互矛盾的时间信号必须保留：DARPA 明确测试到 2033
              年实用规模系统是否可信，而怀疑者和行业批评者仍认为，实际商业影响可能还要十年或更久。
