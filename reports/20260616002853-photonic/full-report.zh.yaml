      - number: '1.3'
        title: 融资历史、估值与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Photonic 的融资历史现在更像一家后期私营公司，而不是早期 deep-tech 风险项目。第一次公开台阶出现在 2023 年 11 月，公司宣布获得由 BCI、Microsoft、UK
              NSSIF、Inovia Capital 和 Amadeus Capital Partners 支持的 $100M USD 融资，累计融资达到 $140M USD。该轮也把 Microsoft
              关系正式化，既是战略资本，也是通向 Azure Quantum Elements 集成的路径。


              更大的拐点出现在 2026 年。1 月首关融资由 Planet First Partners 领投，RBC 和 TELUS 新参与，BCI 和 Microsoft 继续支持，金额为 $180M CAD（$130M
              USD）。官方材料随后把累计资本列为 $375M CAD（$271M USD）。2026 年 5 月，另一笔 $70M USD（$95M CAD）把该轮融资推高到超过 $200M USD（$275M
              CAD），并确定 $2B USD（$2.7B CAD）的投后估值，同时加入 BDC、EDC、Bell Ventures、Firgun Ventures、InBC，以及 Mubadala Capital
              的跟投支持。这让股东表具备明显战略含义：增长股权、电信、云、加拿大公共资本和主权风格投资人都在场。仍然不透明的是控制权——公开来源仍未披露持股比例、优先权结构、董事会委员会或否决权。
