      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动因素可信，但不足以抹平执行缺口。NIST 的后量子密码项目和 FIPS 203 给出了具体安全迁移时间线，抬高了量子安全网络和安全通信的战略价值。Quantum.gov 和加拿大 National
              Quantum Strategy
              显示，主权计算、安全通信、人才留存和国家安全目标已经在塑造预算；云访问和模块化架构也扩大了可测试量子系统的技术评估者池，而不要求他们拥有全栈。与此同时，约束栈仍然严峻。Photonic 自己也认为，更好的纠错和
              any-to-any
              连接必不可少，因为当今架构仍受物理量子比特到逻辑量子比特开销困扰。分析师和怀疑性报道强化了同一点：高错误率、昂贵基础设施、稀缺人才和不清晰的真实世界经济性，都会拖慢从科学承诺到耐久收入的路径。即便是常被视为早期胜利的药物发现，用例也面对买方怀疑，因为工作流瓶颈可能在湿实验室生物学，而不是分子仿真。实际承销结论是，Photonic
              暴露在一个具备战略重要性的类别中，但估值应更重视里程碑转化、采购可重复性和网络变现，而不是宽泛 TAM 叙事。
