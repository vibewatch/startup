      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              核心运营模型从设计上就是模块化的。Photonic 自己的架构材料描述了一颗冷却在 1 K 低温恒温器中的量子处理器芯片，芯片内有集成在光学腔中的硅 T
              centres、光子交换机和单光子探测器，并通过电信光纤输入输出端口连接室温光交换机和控制电子设备。T centre
              本身是关键，因为它把电信波段光接口和硅自旋量子比特结合起来，让同一平台处理计算、通信和存储，而不是事后再把网络能力螺栓式加上去。这就是 Photonic 不断强调跨相邻量子比特、芯片、机架和数据中心的
              any-to-any 连接的原因。工作流含义很直接：计算或网络任务可以在本地准备，纠缠通过光学层生成和路由，然后消耗这些纠缠，在模块之间执行非局域操作。这里的公开证明有意义。公司及相关论文从单自旋光学观测和
              SOI 注入，推进到波导集成和存储 / 转导设计，再到通过电信光纤连接的独立低温恒温器中的存储量子比特之间完成传态 CNOT 序列。距离生产级量子服务仍很远，但比纯单体路线图更像一个具体系统故事。
