      - number: '1.2'
        title: 创始人、领导层交接与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层现在分成创始科学声音和更偏商业化的新 CEO 两条线。Stephanie Simmons 仍是公司最可见的技术人物，身份是创始人兼 chief quantum officer；UNESCO Quantum
              100 等外部认可同时强化了 founder-market fit，也凸显关键人物集中度。Thewalt 在公开材料中仍是具名联合创始人，但 2023 年以来的公开运营叙事更多围绕 Simmons 和时任 CEO
              Paul Terry 展开。


              2026 年初，治理可见度明显提升。1 月融资之后，Photonic 公开披露董事会扩容：Alex van Someren 担任 executive chair，Don Mattrick 担任 vice
              chair，Nathan Medlock 和 Ashton Scordo 成为新董事。一个月后，公司把 Don Mattrick 调任 CEO，同时让 Paul Terry 转任 chief product
              officer，并把这次调整表述为给商业化和长期增长补充高管能力。这是一个有意义的信号：公司认为自己已经越过纯架构成形阶段，进入市场建设模式。即便如此，公开记录仍未披露董事会委员会、控制权或除新 CEO/CPO
              分工之外的详细继任框架，因此后续治理分析需要把这些问题视为未决。
