  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Photonic
              卖的不是许多早期硬件叙事暗示的单个孤立量子盒子。本次审阅的公开表面一致把公司描述为在构建统一的量子计算与网络平台：核心产品是一个模块化、电信连接的系统，既可作为云访问计算来消费，也可部署成专用私有系统，或延伸成中继器、交换机、量子密钥分发风格链路等安全网络产品。从工作流看，买家选择的是计算路径或安全网络路径，但两条路径都落在同一套底层资产栈上：T-centre
              硅自旋-光子量子比特、低温处理模块、片上光子学、室温光交换，以及调度纠缠、操作和纠错的软件层。这一点重要，因为 Photonic 的商业叙事不依赖单一
              SKU，而依赖一套可以服务多种运营场景的系统架构。强项是架构一致性。弱项是包装。公开来源把层级和目标结果说得清楚，但尚未披露一般可用的
              SKU、支持层级或清晰产品目录，企业买家无法据此区分今天可部署的产品与仍在前方的路线图。
