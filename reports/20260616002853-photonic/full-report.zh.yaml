      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Photonic 的买家图谱集中在能为战略预算而非纯运营预算找到理由的组织。政府 R&D
              机构、国防买家、国家实验室和公共资助的基准平台，是最清晰的近期付款方，因为它们可以用主权、安全和先发优势换取对技术风险的承销。超大规模云和量子平台运营商是另一个重要群体，因为在广泛终端用户需求出现前，它们就可以购买或集成硬件和网络能力；Microsoft
              的 Azure 合作是这一路径最清晰的公开信号。第三类是 pharma、材料、金融和先进工业中的大型企业研究团队，用户想要仿真或优化能力，但采购通常先来自探索性 R&D
              或创新预算，而不是生产线项目。第四类是电信和网络安全参与者；TELUS 与政府通信任务重要，是因为 Photonic
              的电信波段架构可以搭载既有光纤网络，并把量子计算叙事连接到安全基础设施预算。各类细分的采用路径相似：架构尽调、获得资助的基准或试点、集成与安全审查，然后才可能出现重复预算线或多年合同。
