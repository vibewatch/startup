            body: >-
              公开证据支持一个真实但仍早期的商业化故事。最强的变现信号来自 Paul Terry 2026 年 1 月的说法：公司卖的是面向数千家公司的量子计算服务，而不是少数昂贵盒子；这契合 Microsoft Azure
              Quantum Elements 集成路径，也契合 Photonic 自己关于商业规模分布式系统的产品语言。平台的网络侧提供第二个变现面，Photonic 明确描述了中继器、交换机和 QKD
              风格安全网络产品。政府支持的基准测试和国防项目提供第三条路径，但在公司披露多少被确认为销售、多少属于非稀释资助之前，最好把它们视为里程碑收入或支持收入。弱项不是叙事，而是披露。公开收入只是来自“journey
              customers”的“个位数百万美元”，没有客户数量披露，也没有本报告审阅来源公布标价、实际价格、合同期限或收入确认政策。这意味着收入模式可信，并与合作伙伴战略对齐，但仍过于不透明，不能当作成熟的经常性软件引擎。
