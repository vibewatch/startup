chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与平台模式
        blocks:
          - type: paragraph
            body: >-
              Photonic 把自己定位为商业规模的量子计算和网络公司，而不是纯研究实验室。创始记录扎实：官方和独立来源都指向 2016 年成立，Dr. Stephanie Simmons 和 Dr. Michael
              Thewalt 被列为联合创始人，原始技术命题来自硅 T-centre 研究。公司官方表述一直把 Photonic 放在 British Columbia 的 Vancouver，并称在 United
              States 和 United Kingdom 有业务；一篇 2025 年 BetaKit 关于 CQCP 的文章则称公司位于 Coquitlam。两种说法都落在同一个 Vancouver
              都市圈生态内，后续章节应把公司视为 Vancouver 都市圈或 British Columbia 公司，除非具体设施地址本身很重要。


              产品叙事有意铺得很宽，但逻辑一致。Photonic 称其会通过 Microsoft Azure
              上的云服务或专用私有系统提供量子计算，同时向电信、政府、金融等行业销售量子安全网络基础设施。核心技术主张足够简洁，可以反复使用：Photonic 的 Entanglement First 架构使用基于 T
              centres 的光学连接硅自旋量子比特，让计算、存储和通信在电信波长上集成。官方背景材料还称商业化工作始于 2021 年，这一点重要，因为公司现在把自己描述为从平台验证跨向 go-to-market 执行的
              scale-up。
