      - number: '7.5'
        title: 人才、资本与执行风险
        blocks:
          - type: paragraph
            body: >-
              领导层集中和 Photonic 同时推进的事项过宽，都会放大执行风险。2026 年 3 月，公司把 Don Mattrick 调任 CEO，把 Paul Terry
              调任首席产品官，并明确表示是为了强化商业化；Stephanie Simmons
              仍担任创始人兼首席量子官，也继续支撑很大一部分科学可信度、主权政策连接和架构叙事。如果产品化加速，这种组合可能是优势；但它也意味着关键人物风险没有消失，只是在技术领导力和市场进入执行之间变成了两条线。财务上，公司相对资金充足，但披露的业务仍很早期：已融资超过
              $350M，估值约 $2B，收入为个位数百万美元，员工超过 150 人，另有招聘计划，并新设英国设施。ResearchMoney 和 Means & Ways
              都把加拿大量子机会描述为资本密集、且对风险厌恶敏感。对投资者而言，本轮买来了时间，但没有买来免疫力。如果技术就绪度、付费部署或伙伴转化滞后，下一轮融资讨论可能会在市场愿意给 Photonic 疑点利益之前到来。
