              最干净的牵引力解读是：商业化真实存在，但仍很窄。Photonic 从 1 月首关时的 150 多名员工，增长到 5 月最终关账时的 160 多名；BetaKit 则描述了一个 170 人团队，以及扩张到 200
              人以上的计划。这样的招聘画像叠加个位数百万美元收入，指向一家仍在规模之前建设业务的公司，而不是已经收割经营杠杆的公司。由于 Photonic
              不公布毛利率、CAC、回本周期、留存、积压订单或客户集中度，最佳可用单位经济性视角来自公开量子同行。IonQ 已达到大得多的收入，但仍录得很大的调整后 EBITDA 亏损；Rigetti 和 D-Wave
              仍是低收入、亏损且依赖流动性的公司；Xanadu 首个公开季度也把温和收入、显著亏损和新的融资工具放在一起。这些同行不能证明 Photonic
              会走同一路径，但确实显示，资本强度和延迟的利润率兑现是该类别的常态。承销结论是，公开牵引力存在，但收入质量仍是通过伙伴、项目和招聘信号推断，而不是由直接披露的运营指标证明。
