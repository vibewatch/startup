            body: >-
              可见轨迹已经从战略公告推进到要求更高的技术和项目里程碑。Microsoft 在 2023 年末宣布与 Photonic 开展 co-innovation 合作，并把目标表述为把 Photonic
              的可扩展产品整合进 Azure Quantum Elements。到 2024 年 5 月，Microsoft 和 Photonic 公开描述了电信波长分布式纠缠，以及未来在 Photonic 硬件可用时让
              Azure 客户访问的路径。TELUS 提供了第二个重要证明面。2024 年独立报道称 TELUS 向 Photonic 开放其光纤网络用于测试；2026 年联合发布称两家公司扩大关系，并在已安装商用光纤上完成
              30-kilometre 传态结果。政府证据同样是连续推进，而不是一次性事件：DARPA QBI 先把 Photonic 列入初始队列，随后列入 11 家公司的更小 Stage B 集合；加拿大 CQCP 在
              Phase 1 中给予 Photonic 最高 $23 million，IDEaS 竞赛则增加首笔 $1 million
              国防导向赠款。这些都是真实外部验证，也显示后续动能。它们尚未显示的是具名生产买家名单、部署数量，或跨企业垂直行业的账户级扩张。
