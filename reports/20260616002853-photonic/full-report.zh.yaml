  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与定价纪律
        blocks:
          - type: paragraph
            body: >
              Photonic 的证据足以让它原则上仍可投资，但还不足以支撑按当前私人市场标记直接买入。最强的正面因素是真实的：公司 2026 年 5 月完成超过 $200M 的新融资，投后估值 $2.0B；累计融资已超过
              $350M；仍在 DARPA 的 B 阶段基准测试流程中；并继续受益于 Microsoft
              主导的生态叙事，以及一种面向广泛商业访问、而不是少量整机销售的服务模式。问题在于分母质量。公开收入披露仍只是个位数百万美元和初始旅程客户；准确现金、烧钱速度、毛利率、客户集中度和优先权结构细节仍未公开。也就是说，分子已知，但背后的经济引擎大多还靠推断。正确结论因此是跟踪
              / 继续研究，中等信心、高风险，估值偏紧但并非独一无二地不理性：这家公司也许值得继续关注，但有纪律的投资者应要求更多证据或更好的入场价格，而不是只凭叙事承销 $2.0B。
