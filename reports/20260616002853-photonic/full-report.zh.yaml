              Photonic 的架构指向一套更像 deep-tech 基础设施、而不是轻量软件的成本栈。公司强调低温量子处理硬件、集成光子交换机、电信光纤网络，以及管理纠缠、调度和纠错的软件与控制层。管理层还把 2026
              年融资投向里程碑、实验室、团队增长和伙伴关系，并另行宣布一个 UK R&D 设施，三年内将吸收超过 £25 million。非稀释支持有帮助，但相对于整体建设规模仍不大。CQCP 最高贡献 CA$23
              million，IDEaS 增加首笔 CA$1 million 赠款；而 2026 年股权轮本身超过 US$200 million，累计资本超过 US$350
              million。这套资金栈足以让近期资本充足性显得可信，尤其是管理层曾称 1
              月融资可能是达到现金流转正前所需的最后一轮，之后又表示最终关账让公司目前可以继续保持私有化。问题在于验证：审阅的公开来源都没有披露确切现金余额、月度 burn、跑道月数、capex
              承诺或营运资本状况，因此充足性仍是方向性判断，而不是完整承销结论。
