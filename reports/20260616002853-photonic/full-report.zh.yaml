        title: 客户表面：真实外部交易对手存在，但多数公开证明呈现为伙伴或项目形态
        blocks:
          - type: paragraph
            body: >-
              Photonic 确实拥有可见的外部交易对手，但公开材料比投资人名单或管理层声称量子最终可服务的行业集合窄得多。已披露表面分为五类：Microsoft 作为云和平台伙伴，TELUS
              作为电信网络运营商和部署环境，美国政府基准与国防项目，加拿大联邦量子项目，以及管理层访谈中提到的一组未具名早期企业或“journey”客户。这种组合重要，因为它把客户相邻牵引力和规模化付费客户证明区分开来。Microsoft
              和 TELUS 有意义，因为它们是具名外部机构，愿意把品牌、基础设施和技术团队放到关系背后。DARPA、CQCP 和 IDEaS 也有意义，因为它们在按里程碑推进的政府项目中点名
              Photonic，并给出真实的非稀释或合同式支持。但这些类别都不等于一份公开的经常性生产账户清单，更没有合同金额、使用增长或续约数据。即便 BetaKit
              最强的商业化访谈，也止步于未具名客户和个位数百万美元收入。正确分析边界因此应很严格：伙伴证明和项目证明真实存在，但它们不等同于广泛披露的生产客户基础。
