  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与传导
        blocks:
          - type: paragraph
            body: >-
              Photonic
              排名最高的风险来自时间错配，而不是技术想象力不足。架构仍有差异化，但公开记录显示，公司还在把一条技术上可信的分布式硅路线图，转成可重复销售的商业产品；与此同时，同业不断缩短买方等待时间。DARPA
              的基准测试项目有帮助，因为它能筛掉炒作，但 DARPA 自己的表述也很谨慎：多大规模、什么质量、什么配置的量子计算机才能打开承诺中的用例，仍不清楚；B
              阶段的存在，是为了逼出降险计划，而不是认证赢家。同时，Photonic 披露的收入仍只有个位数百万美元，公司却在扩团队、扩设施、扩伙伴项目。因此，技术滑坡、伙伴摩擦或市场怀疑，都可能直接传导为订单减少、与
              Microsoft 或 TELUS 的议价能力变弱、融资依赖加深，以及最终的估值压力。最关键的投资问题不是科学是否有趣，而是 Photonic 能否在更大或更成熟的平台吃掉需求窗口之前，变成商业上绕不开的公司。
