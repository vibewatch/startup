      - number: '8.2'
        title: 可比公司集合，以及当前轮次为何只在有条件下说得通
        blocks:
          - type: paragraph
            body: >
              可比公司集合两面都有证据。支持侧，2026 年量子估值在私募和公开市场都仍处高位：Xanadu 进入公开市场后筛选估值超过 $4B，Quantinuum 以 $10B 投前估值融资，PsiQuantum 达到
              $7B，即便 QCi、Rigetti、D-Wave 等规模更小或成熟度更低的上市公司，也仍有数十亿美元市值。这很重要，因为它说明 Photonic 的 $2B
              标记不是这个类别里最激进的分子。负面解读是，多数同业披露的运营证据远多于 Photonic；即便如此，它们的估值看起来仍由长期执行预期驱动。S&P 2026 年 5
              月市场简报明确显示，美国政策公告推动上市量子股票上涨，但收入预测仍相对较小；BetaKit 对 Xanadu 和其他上市同业的谨慎，也强调了热情可能多快跑到盈利前面。教训不是 Photonic
              必须便宜交易，而是任何溢价都需要比公司当前披露更锋利的商业证据来支撑。简言之，可比公司解释了为什么一家严肃的量子公司在 2026 年仍可值数十亿美元，但不能证明 Photonic
              在没有更强收入桥的情况下，已经挣得当前标记。
