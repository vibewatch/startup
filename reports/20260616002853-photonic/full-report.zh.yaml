      - number: '8.3'
        title: 情景区间、退出准备度与尽调关口
        blocks:
          - type: paragraph
            body: >
              情景分析应刻意保持宽区间，因为最大的缺失变量仍是私有信息。牛市情景假设 Photonic 把 DARPA、Azure
              和网络可信度转成可重复商业收入，明显越过个位数百万美元，并把倍数保持在更强光子量子公司附近。基准情景没那么激进：Photonic 继续保持私有状态，维持技术动能，但收入质量披露进展缓慢，使下一轮或最终 IPO
              窗口更接近当前标记，而非最高梯队估值。熊市情景并不离奇。如果商业化时点滑坡，公开市场量子倍数压缩，或下一轮融资低于今天估值完成，公司即便有真实技术前景，也可能重估到私人可比公司的低端。因此，今天的退出准备度应评为尚未准备好进入公开市场。公开市场准备度需要规模和披露，Photonic
              显然还没跨过这条线。Photonic 有战略故事和资金继续建设，但缺少公开运营证据，不能像已降险的 IPO 候选公司那样行动。最终尽调问题很直接：证明收入桥，证明毛利率方向，证明客户多元化，证明
              runway，并证明没有优先权悬挂让标题估值看起来好过经济现实。
