- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Telecom-native networking is unique
    - PsiQuantum and Xanadu also market photonic scaling and networking logic
    - High
    - Photonic, PsiQuantum, and Xanadu all lean on photonics to scale
    - Request head-to-head technical diligence on networking overhead and manufacturability
  - - Architectural novelty can outrun incumbents
    - IBM and Google have stronger public error-correction milestones and distribution
    - High
    - Willow below-threshold result; IBM partner and uptime scale
    - Ask for milestone map proving when Photonic beats incumbent access and credibility
  - - Government validation will compound
    - US2QC Stage C favored Microsoft and PsiQuantum while QBI remains crowded
    - High
    - DARPA narrowed underexplored-path validation to two rivals
    - Track QBI milestone conversion and explain why Stage B becomes a commercial wedge
  - - Commercial access can wait until later
    - IonQ, Quantinuum, D-Wave, QuEra, and Rigetti already let customers experiment today
    - High
    - Multiple rivals have cloud, subscription, or on-prem routes
    - Request productization timeline for cloud or private-system access
  - - Photonic can stay capital efficient
    - Quantinuum, PsiQuantum, IQM, and QuEra disclosed very large funding rounds
    - Medium
    - Disclosed funding ranges from $230M to $1B and valuations up to $10B
    - Pressure-test hiring, fab, and channel spend requirements against peer balance sheets
  - - Buyers will commit to one architecture early
    - Low switching costs and multi-homing can delay lock-in for years
    - Medium
    - Cloud and subscription access across modalities keeps evaluation open
    - Focus on use cases where telecom networking creates genuine system-level lock-in
  - - Optimization substitute is irrelevant
    - D-Wave sells present-day enterprise optimization outcomes
    - Medium
    - Leap and Advantage2 are already marketed for production workloads
    - Clarify which buyer problems truly require gate-model or networked quantum advantage
  - - Sector hype will support valuation
    - Timeline skepticism can quickly reset sentiment and procurement urgency
    - Medium
    - BetaKit showed public quantum shares falling after Jensen Huang comments
    - Anchor fundraising and GTM plans to milestone proof, not broad sector exuberance
  notes: Severity is the author's qualitative judgment based on technical maturity, commercialization posture, and capital asymmetry.
