- id: capability-pricing-gtm
  title: Capability, packaging, distribution, and trust posture
  body: 'Capability comparisons are really architecture-and-distribution comparisons. Photonic''s strongest product thesis is that networkable silicon-spin qubits and telecom-band photons can unify quantum computing and quantum networking. But that advantage is weighed against competitors that already expose usable procurement channels. IonQ markets a data-center product and major-cloud reach; Rigetti emphasizes sub-millisecond hybrid loops in QCS; Quantinuum sells subscriptions directly and through Azure; D-Wave offers production-grade Leap cloud access and on-prem systems; QuEra is already on Amazon Braket; and IQM focuses on sovereign on-prem HPC buyers. Public list pricing is often missing, so packaging and deployment model are more comparable than sticker price. Trust posture also varies: mega-cap incumbents win enterprise procurement by default, while startups differentiate with sovereign manufacturing, HPC integration, or sector-specific partnerships.'
