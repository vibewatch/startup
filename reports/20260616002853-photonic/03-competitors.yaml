- id: competitor-profiles
  title: Competitor profiles by modality, scale, and commercialization
  body: 'The strongest direct budget competitors are not identical in modality, but they all compete for the same strategic procurement pools. IBM already has a large partner base, multiple >100-qubit systems, and a mature roadmap narrative. Google has public error-correction credibility via Willow. IonQ and Quantinuum combine trapped-ion performance claims with commercial access routes and meaningfully disclosed scale. Rigetti, IQM, and QuEra pitch different deployment models ranging from low-latency cloud access to on-prem HPC integration. PsiQuantum and Xanadu are the most relevant photonic comparables: PsiQuantum is attacking million-qubit fault tolerance with foundry and capital scale, while Xanadu has demonstrated modular photonic networking but still frames performance and loss reduction as the next hurdle. D-Wave remains a substitute more than a modality twin, but its commercial posture matters because buyers can solve some optimization jobs today without waiting for gate-model fault
    tolerance.'
