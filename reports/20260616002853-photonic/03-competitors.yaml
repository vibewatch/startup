chapter:
  number: 3
  title: Competitors
  summary: Photonic competes against a layered field of superconducting incumbents, trapped-ion vendors, photonic peers, neutral-atom specialists, annealing substitutes, and topological adjacencies rather than against one clean peer set. Its telecom-native networking architecture is differentiated, but the immediate competitive pressure comes from rivals with clearer cloud access, stronger government validation, and far larger disclosed funding or enterprise distribution.
sections:
- id: landscape
  title: Competitive landscape and substitute set
  body: Photonic is not entering a greenfield category. Buyers evaluating utility-scale quantum systems can choose among superconducting incumbents such as IBM and Google, trapped-ion platforms such as IonQ and Quantinuum, photonic architectures from PsiQuantum and Xanadu, neutral-atom systems from QuEra, annealing hardware from D-Wave, and adjacent topological efforts from Microsoft. DARPA's QBI and US2QC programs reinforce that the field is being benchmarked across multiple modalities rather than converging on a single winner. That means direct peers, adjacent architectures, status-quo substitutes, and likely entrants all matter at once. The near-term substitute set is especially important because buyers can already test multiple competing systems through public clouds, subscriptions, or partner programs without committing to Photonic's telecom-networking thesis first.
