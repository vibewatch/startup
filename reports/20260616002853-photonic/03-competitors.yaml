- id: switching-distribution
  title: Switching cost, lock-in, and partner leverage
  body: Switching costs remain lower than many startup narratives imply. Quantum hardware is still procured mostly through evaluation programs, cloud credits, subscriptions, or bespoke enterprise relationships, so buyers can multi-home across modalities for years before settling on one system architecture. The more durable advantage sits in distribution, supply, and trusted deployment. IBM brings partner breadth and datacenter-grade reliability. IonQ and Quantinuum have clearer merchant and cloud motions. D-Wave and IQM each offer on-prem or tightly integrated paths for organizations that care about latency, sovereignty, or control. PsiQuantum, QuEra, and Quantinuum all lean on powerful manufacturing, cloud, or capital partners. Photonic's telecom-native architecture could create real lock-in if it becomes the preferred route for networked quantum systems, but today buyers still retain meaningful optionality because access and experimentation are available elsewhere.
  claimRefs:
  - CP022
  - CP031
  - CP032
  - CP033
  - CP036
  - CP037
  - CP038
- id: moat-durability
  title: Moat durability and adverse competitor evidence
  body: 'The adverse evidence is straightforward: the field already contains rivals with more mature public commercialization, more government validation, or much larger disclosed capitalization than Photonic. Google has already published a below-threshold error-correction result. Microsoft and PsiQuantum reached the validation stage of DARPA''s US2QC effort. Quantinuum and PsiQuantum disclosed multibillion-dollar valuations, while IQM and QuEra used large funding rounds to extend fault-tolerance and go-to-market roadmaps. Even D-Wave, though architecturally distinct, can point to real enterprise use today. Photonic''s moat is therefore architectural rather than commercial: if telecom-compatible networking, distributed entanglement, and silicon manufacturing really compress the path to scaled systems, the company can still win. If not, better-funded or better-distributed competitors can absorb buyer mindshare before Photonic reaches repeatable market access.'
