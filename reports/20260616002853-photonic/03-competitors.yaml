  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Public list pricing or normalized enterprise quote data for IBM, Rigetti, Quantinuum, IQM, and Photonic itself.
    whyItMatters: Without comparable prices, packaging and access model are easier to compare than buyer cost, which limits margin and switching-cost analysis.
    diligencePath: Request enterprise quote sheets, marketplace SKUs, and any pilot-to-production price transition terms from the core vendors and from Photonic management.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-adoption
    missingEvidence: Current customer counts, backlog, and production usage metrics for private competitors and for Photonic.
    whyItMatters: Commercial maturity is central to the threat assessment, but most private vendors disclose funding and roadmap far more readily than recurring usage.
    diligencePath: Ask management for customer-by-customer pipeline, renewal data, and cloud or on-prem utilization metrics benchmarked against the named peers.
    relatedQuestionRefs:
    - QP008
    - QP011
    - QP015
    - QP026
    relatedTableRefs:
    - TP001
  - type: conflicting-data
    severity: material
    topic: commercialization-timeline
    missingEvidence: Independent architecture-agnostic work reconciling D-Wave's “commercial today” posture, Google's fault-tolerance progress, and broader skepticism about when utility-scale quantum becomes very useful.
    whyItMatters: Timeline disagreement determines whether Photonic is competing for near-term budgets, strategic options, or a still-distant platform market.
    diligencePath: Commission third-party technical diligence that compares commercialization readiness by modality, not just by vendor marketing narrative.
    relatedQuestionRefs:
    - QP005
    - QP018
    - QP024
    - QP026
    relatedTableRefs:
    - TP004
