  topStrengths:
    - >-
      Differentiated T-centre / telecom-photonic architecture gives Photonic a clear technical narrative around
      distributed scaling.
    - Capital access is unusually strong for a private quantum company, with >$200M raised in 2026 at a $2.0B valuation.
