callouts:
  - calloutType: "insight"
    title: "Cleaning Automation as the True Commercial Growth Engine"
    body: "While food-service delivery established Pudu Robotics' initial global brand and fleet scale, commercial cleaning has rapidly transitioned into the company's financial core. Generating over 70% of total revenue in 2025 and achieving leading shipment volume according to Counterpoint Research, automated scrubber-dryers and sweepers benefit from less discretionary corporate facility management budgets compared to cyclic restaurant capital expenditures."
    claimRefs:
      - "CM003"
      - "CM006"
      - "CM010"
  - calloutType: "risk"
    title: "Commercialization Horizons for Humanoids Diverge from Marketing Hype"
    body: "Despite intense capital market excitement and aggressive corporate marketing around humanoid robotics and embodied AI, authoritative industry benchmarks from the International Federation of Robotics caution that real-world deployments remain confined to demonstration pilots. Practical mass enterprise adoption is projected toward the close of the 2026-2030 planning cycle, indicating that near-term cash generation must continue to rely on specialized wheeled form factors."
    claimRefs:
      - "CM011"
      - "CM012"
