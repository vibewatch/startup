        - Low / Absent (Hospitality delivery focus)
        - High (Manual mop/scrub flexibility)
      - - Outdoor & Industrial Scope
        - Moderate-High (GT mowers, MP2000 AMRs)
        - Low (Primarily indoor service)
        - Low (Indoor delivery only)
        - High (Manual labor across domains)
      - - Global Channel Infrastructure
        - High (130k+ units across 80+ countries)
        - Moderate-High (Dense Asia, growing West)
        - Moderate (Focused US and East Asia presence)
        - Universal (Local hiring markets)
      - - Unit Hardware Economics
        - Low-to-Medium (Shenzhen integrated supply)
        - Low-to-Medium (Domestic China supply)
        - Medium-to-High (Western/hybrid assembly)
        - High ongoing variable labor expense
    notes: Capabilities evaluated based on public product lines, deployment footprints, and comparative trade reviews. Individual performance varies by venue layout and facility type.
