  - calloutType: risk
    title: Hardware Commoditization and Category Saturation
    body: With hospitality service robot shipments declining 11% in 2024 and Chinese manufacturers representing over half the market, price competition and low hardware switching costs threaten long-term margins unless embodied AI and software layers create defensible lock-in.
