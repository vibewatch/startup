      - CP011
  - id: TP003
    title: Pricing, Packaging, and Monetization Models
    columns:
      - Model / Vendor
      - Contract & Pricing Mechanism
      - Included Capabilities
      - Discounts & Unknowns
      - Commercial Implication
    rows:
      - - Pudu Robotics (Direct & Partner)
        - Direct sale ($8k-$20k list) or RaaS subscription
        - Hardware, basic SLAM navigation, cloud scheduler
        - Volume distributor discounting undisclosed
        - Lowers barrier to entry but exposes fleet to renewal churn
      - - Keenon Robotics (Peer)
        - Direct purchase and regional lease packages
        - Delivery unit, docking station, dispatch software
        - Aggressive discounting in domestic Chinese market
        - Spurs price competition in high-density restaurant hubs
      - - Bear Robotics (Western Peer)
        - Turnkey RaaS lease ($800-$1,200/month typical)
        - Hardware, warranty, field service, cloud console
        - Enterprise restaurant chain customized tiers
        - Higher monthly outlay requires proven labor offset ROI
      - - Manual Operations (Status Quo)
        - Fully variable monthly payroll and staffing cost
        - Human staff across service, cleaning, and bussing
        - Overtime, turnover, and recruitment fees variable
        - Protects capital budget but faces acute wage inflation
    notes: Pricing reflects industry list benchmarks and Robot-as-a-Service (RaaS) market structures reported by IFR and trade analysts. Enterprise realized rates depend on dealer terms and service SLAs.
