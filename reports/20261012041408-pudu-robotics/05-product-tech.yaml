company:
  name: Pudu Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: Pudu Robotics has scaled commercial service robotics across dining, cleaning, and industrial logistics via its proprietary One Brain, Multiple Embodiments architecture and dual SLAM navigation. While cleaning robots now represent over 70% of revenue and industrial deliveries expand, technical diligence must probe proprietary software boundaries, elevator integration dependencies, and the commercial readiness of humanoid prototypes.
sections:
- id: product-portfolio-and-workflow
  title: Product Portfolio and Workflow Integration
  body: 'Pudu Robotics has structured its commercial hardware portfolio into four distinct functional product lines: service delivery, commercial cleaning, industrial delivery, and general embodied AI robotics. While the company''s early market visibility was established through restaurant table delivery platforms like BellaBot and KettyBot, commercial cleaning has rapidly expanded to generate over 70% of total revenue. The flagship PUDU CC1 Pro autonomous cleaning robot combines four primary functions—sweeping, scrubbing, vacuuming, and dust-mopping—engineered specifically for high-throughput commercial spaces spanning 5,000 to 8,000 square meters per cycle. In industrial environments, Pudu''s T300 and T150 autonomous mobile robots automate manufacturing line replenishment, surpassing 4,000 cumulative industrial shipments within twelve months. These automated workflows replace repetitive manual cart transit and custodial labor, providing facility operators with measurable throughput gains
    while introducing new requirements for physical aisle clearance and docking station maintenance.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE007
  tableRefs:
  - TE001
  - TE002
- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: Pudu Robotics organizes its hardware and software systems around a proprietary 'One Brain, Multiple Embodiments' architectural paradigm. The core computational layer integrates multi-robot dispatch, fleet traffic coordination, and cross-embodiment task routing managed across dedicated research and development centers in Shenzhen, Chengdu, and Hong Kong. At the edge device level, Pudu employs dual visual and laser SLAM navigation—designated PUDU VSLAM+—which fuses 3D LiDAR arrays and triple RGBD optical cameras to achieve high-precision indoor positioning and obstacle avoidance without requiring ceiling markers. On specialized cleaning platforms such as the CC1 Pro, the system incorporates a dedicated rear-facing AI inspection camera that continuously monitors floor cleanliness post-scrubbing. This camera automatically marks persistent stains on an operational heat map and initiates closed-loop spot recleaning routines without human intervention, balancing cleaning efficiency with
    battery endurance.
  claimRefs:
  - CE001
  - CE003
  - CE006
  - CE008
  - CE010
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: differentiation-and-compliance
  title: Technical Differentiation and Safety Standards
  body: Technical differentiation in Pudu's robotics ecosystem centers on autonomous perception, multi-sensor data fusion, and verified industrial safety standards. Unlike traditional automated guided vehicles that depend on magnetic floor strips or reflective ceiling markers, Pudu's hybrid LiDAR and visual SLAM pipeline adapts dynamically to floor plan changes, moving pedestrians, and transient obstacle clutter. Furthermore, the CC1 Pro platform features autonomous component self-monitoring that visually evaluates brush and squeegee contamination, preventing secondary water streaking or mechanical damage before it affects facility floors. From a compliance perspective, Pudu has secured formal IEC 63327 certification for its commercial floor cleaning hardware, verifying operational quality, electrical safety, and mechanical containment. These certifications are critical for procurement in regulated commercial environments including international airports, healthcare facilities, and multinational
    retail chains.
  claimRefs:
  - CE004
  - CE008
  - CE009
  - CE010
- id: deployment-and-technical-risks
  title: Deployment Integration and Technical Risks
  body: Despite substantial hardware scale and commercial deployments across more than 80 countries, technical diligence reveals several operational and integration constraints. Multifloor delivery models such as the FlashBot rely on elevator integration supported via either cloud software relays or physical IoT controller hardware. While cloud integration avoids elevator cab rewiring, real-world execution remains vulnerable to building Wi-Fi dead zones, elevator vendor protocol incompatibilities, and facility network latency. Additionally, Pudu's international expansion depends heavily on third-party regional distributor networks for site mapping, preventive maintenance, and spare parts fulfillment rather than direct engineering support. On the forward roadmap, newly unveiled humanoid concepts like the PUDU D7 and PUDU D9 represent early-stage embodied AI prototypes whose bill-of-materials economics, manipulation reliability, and commercial readiness require rigorous ongoing technical verification.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
