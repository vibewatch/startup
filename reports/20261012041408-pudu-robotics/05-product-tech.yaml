- id: TE003
  title: Technology Stack and Operating Architecture Analysis
  columns:
  - Architecture Layer
  - Core Component
  - System Role
  - Primary Dependency
  - Technical / Execution Risk
  rows:
  - - Autonomous Navigation
    - PUDU VSLAM+ Algorithm
    - Dual visual SLAM and laser LiDAR fusion for indoor positioning
    - Low-noise sensor feeds and environment feature stability
    - Feature degradation in featureless corridors or reflective glass surfaces
  - - Quality & Perception
    - Rear AI Cleaning Camera & Image Engine
    - Inspects cleaned floor in real time, marks residual dirt on heat map
    - Trained computer vision models for floor material and stain classification
    - False positives on specialized patterned tile or variable lighting
  - - Central Intelligence
    - One Brain Scheduling Kernel
    - Multi-robot dispatch, fleet traffic coordination, task routing
    - Cloud IoT backhaul and local facility server uptime
    - Network latency causing queue deadlocks at narrow hallway choke points
  - - Hardware & Actuation
    - Integrated Joint Modules & Suspension
    - Motion control, motor torque regulation, obstacle avoidance braking
    - Specialized mechanical supply chain and precision component assembly
    - Wear and tear on motors and suspension under continuous industrial use
  notes: Technical components reflect Pudu's full-stack architecture design; source code proprietary boundaries and network failover specifications require private diligence.
