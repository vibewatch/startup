    - Waitstaff walking back and forth between kitchen and tables
    - BellaBot meal tray transport with route dispatch
    - Reduces repetitive transit so staff focus on customer service
    - Constrained by narrow aisle clearance (<0.8m) and floor irregularities
  - - Large-Scale Floor Care
    - Manual custodial mopping and bulky walk-behind scrubbers
    - PUDU CC1 Pro autonomous 4-in-1 cleaning
    - Covers 5,000 to 8,000 sqm per cycle; rear AI camera automates spot recleaning
    - Requires dedicated water refill station or manual maintenance of squeegees
  - - Cross-Floor Facility Logistics
    - Human couriers or porters riding service elevators
    - FlashBot with cloud elevator control integration
    - Automates multi-floor delivery without elevator modification
    - Depends on stable building IoT connectivity and elevator vendor API support
  - - Factory Material Transport
    - Manual cart pushing by factory floor workers
    - PUDU T300 autonomous mobile material transport
    - Reported savings of 35-45 labor hours per month across production lines
    - High initial mapping setup required; sensitive to dynamic floor clutter
  notes: Workflow productivity figures reflect reported pilot and production case studies; net labor savings depend on site-specific physical constraints and staff adoption.
