callouts:
  - calloutType: insight
    title: Commercial Pivot to Cleaning and Industrial Platforms
    body: While Pudu Robotics initially captured global brand recognition through restaurant tabletop delivery robots like BellaBot, its recent growth is overwhelmingly powered by commercial cleaning robots (accounting for over 70% of revenue in 2025) and rapid adoption of industrial delivery units (shipping 4,000+ units in year one). This product diversification materially broadens its addressable customer budget pool.
    claimRefs:
      - CO002
      - CO008
      - CO014
  - calloutType: risk
    title: Private Valuation Premium vs Information Asymmetry
    body: The April 2026 Series D valuation exceeding USD 1.5 billion establishes Pudu Robotics as a premier hardware unicorn, yet critical financial indicators including absolute revenue run-rate, gross margins, and customer retention metrics remain private disclosures. Furthermore, database tracking indicates 309 employees against social profiles claiming thousands, emphasizing the need for direct operational verification.
    claimRefs:
      - CO005
      - CO006
      - CO012
