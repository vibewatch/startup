chapter:
  number: 1
  title: Company Overview
  summary: Pudu Robotics is a Shenzhen-founded commercial service robotics pioneer that achieved a USD 1.5 billion unicorn valuation in April 2026 on the back of 130,000+ global deployments and rapid revenue diversification from hospitality delivery into commercial cleaning and industrial mobile robotics.
sections:
  - id: company-identity-and-mission
    title: Corporate Identity, Operating Scale, and Business Model
    body: 'Founded in 2016 and headquartered in the high-tech hardware ecosystem of Shenzhen, China, Pudu Robotics (普渡科技) has evolved from an early restaurant service robotics provider into a scaled global enterprise in commercial autonomous mobile robotics. The company operates a multi-sector commercial model anchored around its ''One Brain, Multiple Embodiments'' platform. This framework supports four distinct product lines: hospitality service delivery, commercial facility cleaning, industrial logistics delivery, and general embodied artificial intelligence systems. Operating with dedicated research facilities across Shenzhen, Chengdu, and Hong Kong, Pudu has successfully expanded its footprint into more than 85 countries and regions, achieving over 130,000 cumulative unit shipments to enterprise clients such as Walmart, Carrefour, and EDEKA. This commercial evolution is underscored by a dramatic transformation in its revenue composition: while initial market adoption centered on food delivery robots, commercial cleaning robots surged to represent over 70% of total revenue during 2025, propelling a 100% year-over-year revenue surge. Pudu''s diversified product strategy mitigates single-sector hospitality exposure while positioning the firm as a full-suite automated facility service partner.'
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
      - CO011
      - CO014
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: founders-leadership-and-governance
    title: Executive Leadership, Technical Pedigree, and Governance Dynamics
    body: 'Pudu Robotics was conceived and continues to be led by its founder and Chief Executive Officer, Felix Zhang (张涛). Zhang possesses a deep academic and engineering pedigree in mechanical automation, having conducted specialized research in the Department of Mechanical and Aerospace Engineering at the Hong Kong University of Science and Technology (HKUST). Prior to founding Pudu Robotics, Zhang established the Chinese technology media platform Leiphone, blending technical expertise with market communication acumen. His technical stewardship is evidenced by over 350 robotics-related patents covering navigation algorithms, multi-robot coordination, and integrated joint modules. However, this engineering prominence creates significant key-person dependence: the enterprise''s technological vision, embodied AI roadmap (such as the proprietary PuduFM 1.0 foundation model), and commercial strategy remain deeply concentrated in Zhang''s personal leadership. The broader management structure operates across distributed engineering hubs in Shenzhen, Chengdu, and Hong Kong, yet formal board composition and independent governance disclosures remain strictly private, necessitating thorough diligence regarding minority shareholder rights and corporate governance controls.'
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO011
      - CO013
    tableRefs:
      - TO002
  - id: capital-structure-and-diligence-gaps
    title: Financing History, Valuation Benchmarks, and Critical Evidence Gaps
    body: In April 2026, Pudu Robotics achieved unicorn status following the completion of a Series D funding round that raised nearly USD 150 million, valuing the company at over USD 1.5 billion. This round brought cumulative equity funding to more than USD 300 million according to company disclosures, while private market intelligence provider Tracxn records a total of USD 342 million across nine lifetime rounds. Pudu's capitalization table features a syndicate of elite institutional investors and corporate strategists, including Sequoia Capital (红杉中国), local-services giant Meituan (美团), Silicon Valley's Sierra Ventures, regional state-backed Greater Bay Area Homeland Investments, and early growth backer Puhua Capital. Despite these robust capital access signals, prospective investors face notable information asymmetry. Crucial underwriting variables—such as audited revenue figures, gross margins, recurring software maintenance attach rates, and balance sheet cash burn—are entirely absent from public disclosure. Furthermore, third-party databases document 309 employees as of September 2026, contrasting sharply with self-reported employee ranges of 1,001 to 5,000 on professional networks. Bridging these discrepancies through primary audit documentation represents an indispensable prerequisite for validating the 2026 unicorn valuation.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO012
    tableRefs:
      - TO003
