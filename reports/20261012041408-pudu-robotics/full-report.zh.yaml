              - CV014
      - number: '8.2'
        title: 融资背景、倍数与立场
        blocks:
          - type: paragraph
            body: >-
              评估 2026 年 4 月投后估值 USD 1.5 billion，必须以现有经营证据为基础严格把控价格。由于 Pudu 未披露绝对营收金额、ARR 或毛利率，采用标准营收倍数或 EBITDA
              倍数进行投资判断会面临较高估算风险。SiliconANGLE 和 Gasgoo 证实，本轮融资超过 USD 1.5 billion（10 billion yuan），资金将用于具身 AI
              研发、供应链升级和制造扩张，为未来 IPO 做准备；但商用硬件与自动化同业的公开市场可比倍数已经压缩。若 Pudu 2025 年营收约为 USD 150 million 至 USD 200
              million——这一推算基于 100% 的年度增长率和累计出货 120,000 台——则 USD 1.5 billion 的入场估值对应约 7.5x 至 10.0x
              的历史营收倍数。对于以硬件为核心、软件订阅附加率尚未验证且保修义务沉重的企业，这一入场倍数偏高。此外，中国大陆地方引导基金支持的后期成长轮往往嵌入严格的清算优先权、赎回条款和目标 IPO
              里程碑。若无法看清股权结构表或清算分配顺序，新进入的少数股东可能面临优先权悬置。基于此，我们维持“继续研究”建议，置信度为中等、风险评级为高，并判断估值偏高。在正式 IPO
              前尽调拿到经核验的审计财务报表、毛利率结构和清晰的股权结构文件之前，应暂停投入资本。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV013
              - CV014
