            title: 关键车队劫持漏洞与事件响应滞后
            body: 白帽安全研究发现后端访问漏洞，可任意远程控制已部署机器人；公司最初没有响应，直到大型餐饮企业客户介入，事件才得到推动。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
          - type: callout
            title: 关税升级下的中国制造集中
            body: 三座主要工厂分别位于 Jiangsu、Zhejiang 和 Guangdong，Pudu 因此高度暴露于机器人硬件和精密零部件相关的国际贸易限制、出口管制与进口关税。
            calloutType: risk
            claimRefs:
              - CR002
              - CR009
          - type: callout
            title: 投资判断所需尽调事项
            body: 潜在投资人必须审计新设 Pudu Security Response Center 的第三方渗透测试报告，并评估在中国大陆以外进行制造双重采购的供应链应急方案。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR010
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics 把已验证的实体部署规模与商业机器人领域可观的私募资本支持结合起来。核心投资论点是：公司已从餐饮配送自动化转向高毛利商业清洁和工业物流。2026 年 4 月，Pudu 宣布完成接近
              USD 150 million 的融资，估值超过 USD 1.5 billion；公司披露及联合发布称累计融资超过 USD 300 million。商业清洁收入占比已超过 70%，推动 2025
              年收入据称同比增长 100%。Counterpoint Research 将其商业清洁机器人出货和收入均列全球第一，Frost & Sullivan 认为其占整体商业服务机器人市场 23% 至
              25%。公司文件还显示全球累计出货在 120,000 至 130,000 台之间，覆盖超过 80 至 85 个国家和地区，客户包括 Carrefour、Walmart 和
              EDEKA。反论点则是严重信息不透明和结构性执行风险：Pudu 是私营公司，没有公开审计财务、经审计 EBITDA 或自由现金流，也没有可验证的流失和 NRR。Gasgoo 称 EBITDA 在 2025
              年接近盈亏平衡，但硬件制造的毛利天然敏感于零部件通胀、国际物流和售后维护负担。Tracxn 记录截至 2026 年 9 月核心员工仅 309 人，而公司营销称员工达到数千，说明运营可见性存在差异。2026 年 4
              月融资的投资人明显偏向中国地方政府引导基金和 Longgang Financial Holding、Ya Capital、BAIC Industrial Investment、Lens Technology
              等国内产业集团，而非国际成长型风投联盟。这种资本结构会加剧西方市场的地缘摩擦和合规风险；针对摄像头和传感器自主机器人的数据安全审查，可能限制企业续约或推迟国际资本市场上市。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
