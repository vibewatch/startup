        title: 监管合规、出口管制与跨境法律风险
        blocks:
          - type: paragraph
            body: >-
              Pudu 在超过 60 个国际国家和地区运营，面临跨境贸易控制、监管认证和知识产权保护交织而成的复杂矩阵。公司拥有 1,684 项全球专利及待审申请和 1,304
              项商标注册，但国际扩张也让硬件暴露于日益加剧的地缘摩擦。美中贸易争端和 Section 301 关税尤其会抬高中国机器人硬件及进口精密子组件成本。北美和欧洲企业部署还须遵守无线电型号认证、CE Machinery
              Directives 和工作场所安全标准。制造没有在中国大陆以外分散，Pudu 直接暴露于突发关税调整、进口禁令和合规障碍，国际交付可能因此停滞。
