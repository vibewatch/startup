  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围、边界定义与替代关系
        blocks:
          - type: paragraph
            body: >-
              商业服务机器人覆盖专用于室内商业和轻工业环境、执行重复劳动任务的自主移动设备。它们不与通用企业软件或重型固定仓储设施正面竞争，而是解决地面清洁、餐饮配送和厂内物料转运等运营瓶颈。Pudu
              已从餐厅送餐车扩展到商业设施消毒和工厂搬运；商业清洁平台如今贡献公司收入的 70% 以上，在商场、医疗园区和交通枢纽替代外包保洁。工业配送在商业化首年出货超过 4,000
              台，成为资本密集型自动存取系统的低门槛替代方案。人工时薪劳动仍是主要替代方案；人口结构压力、员工高流动和法定最低工资上涨，推动企业从浮动人工成本转向可预测的自动化设备合同。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
      - number: '2.2'
        title: 行业规模、增长轨迹与市场份额集中度
        blocks:
          - type: paragraph
            body: >-
              Frost & Sullivan 的独立研究显示，全球商业服务机器人市场在 2021 至 2025 年的复合年增长率为 37.0%，预计到 2030 年仍以 31.2% CAGR
              扩张。中国设备制造商主导了增长：2025 年全球前五大供应商全部来自中国，合计供应全球需求的一半以上。Frost & Sullivan 的 2025 年独立研究将 Pudu 列为全球第一，收入份额约
              25%，出货量份额约 23%。BriefGlance 与 Frost & Sullivan 还指出，Pudu 是中国出口商中的领先者，海外市场份额为 44%，商业清洁机器人收入份额为
              29%。这说明其可服务且可获取的市场已明显转向商业清洁和工业厂内物流，并由硬件规模化和全球分销伙伴关系提供支撑。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM010
              - CM013
      - number: '2.3'
        title: 企业买方分层、预算归属与采用经济性
        blocks:
          - type: paragraph
            body: >-
              商业服务机器人的采购会随终端行业而变，销售周期、预算归属和 ROI
              预期各不相同。酒店和餐饮运营商把配送机器人视为高峰时段缓解服务员压力的前台人力倍增器；商业地产和交通基础设施则由设施管理负责人及物业高管采购自动洗地机和清扫机，以覆盖数百万平方英尺、稳定卫生合规并控制第三方人工通胀。Pudu
              已在 85 个国家和地区部署超过 130,000 台机器人，并进入 40 个国际枢纽机场，客户包括 Carrefour、Walmart 和
              EDEKA。大型客户在把多台试点扩展到全园区前，要求成熟的多机器人调度、电梯集成协议和可靠的区域维护 SLA。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 宏观催化剂、政策驱动与具身 AI 部署约束
        blocks:
          - type: paragraph
            body: >-
              中国激进的产业政策强化了商业机器人宏观扩张：工业和信息化部已将机器人列为第 15 个五年规划（2026-2030）的核心支柱，并启动持续至 2027 年的养老自动化试点。但尽调必须把近期商业可行性与具身 AI
              的投机性主张分开。Pudu 已累计融资 $342 million、达到 $1.5 billion 独角兽估值，用于下一代具身 AI
              和人形机器人；国际机器人联合会（IFR）则认为现实人形能力仍局限于演示原型，双足人形机器人在 2020 年代后期前大规模工业或商业采用并不可能。Pudu 截至 2026 年 9 月披露的 309
              人团队更适合精益商业执行，但仍需持续控制资本，在成熟清洁车队扩张与长期人形研究之间取得平衡。
            claimRefs:
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: 案例材料
        blocks:
          - type: callout
            title: 清洁自动化才是真正的商业增长引擎
            body: >-
              餐饮配送建立了 Pudu Robotics 最初的全球品牌和车队规模，但商业清洁已迅速成为财务核心。2025 年清洁业务贡献总收入的 70% 以上，Counterpoint Research
              也认为其出货量领先；自动洗地机和清扫机相比周期性餐饮资本开支，更受企业设施管理预算支持。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM010
          - type: callout
            title: 人形机器人商业化进程远离营销炒作
            body: 尽管资本市场和企业营销围绕人形机器人、具身 AI 高度兴奋，IFR 的权威基准仍警告现实部署局限于演示试点。大规模企业采用预计要到 2026-2030 规划周期末才会出现，近期现金创造仍须依靠专用轮式形态。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
