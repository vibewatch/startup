            title: 转向清洁与工业平台
            body: >-
              Pudu Robotics 最初凭 BellaBot 等餐厅桌面配送机器人建立全球知名度，近期增长却主要来自商业清洁机器人（2025 年收入占比超过 70%）以及工业配送设备（进入市场首年出货 4,000+
              台）。产品多元化显著扩大了可触达的客户预算池。
