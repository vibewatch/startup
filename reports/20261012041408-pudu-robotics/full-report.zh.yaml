      - number: '1.2'
        title: 高管团队、技术背景与治理动态
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics 由创始人兼首席执行官 Felix Zhang（张涛）创办并持续领导。Zhang 曾在香港科技大学（HKUST）机械与航空航天工程系从事研究，也创办了中国科技媒体平台
              Leiphone。他拥有覆盖导航算法、多机器人协同和一体化关节模块的 350 多项机器人相关专利。但技术愿景、具身 AI 路线（如 PuduFM 1.0
              基础模型）和商业战略高度依赖个人。深圳、成都和香港设有工程中心，但董事会构成及独立治理披露仍属私密，少数股东权利和公司治理控制需要深入核查。
            claimRefs:
