      - number: '3.3'
        title: 定价、产品组合与 RaaS 变现模式
        blocks:
          - type: paragraph
            body: >-
              商业机器人采购正从直接购买资本设备转向灵活的 Robot-as-a-Service（RaaS）租赁。IFR 数据显示，2024 年 RaaS 总体采用率增长 31%，交通和物流自动化领域增长
              42%，因为企业希望降低前期资本开支门槛。Pudu 及同业同时采用两种模式：授权区域分销商直销设备，以及按月订阅租赁。Bear Robotics
              把维护和现场支持打包进高价月度合同；中国厂商则用激进硬件定价和分销商利润，加速 Walmart、Carrefour 和 EDEKA 等大型零售客户的铺货。
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP003
