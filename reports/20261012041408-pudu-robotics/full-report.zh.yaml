      - number: '1.3'
        title: 融资历程、估值基准与关键证据缺口
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月，Pudu Robotics 完成 Series D，融资接近 USD 150 million，估值超过 USD 1.5 billion，成为独角兽。公司披露累计股权融资超过 USD 300
              million；私募市场数据商 Tracxn 则记录其 9 轮累计融资 USD 342 million。股东包括 Sequoia Capital（红杉中国）、Meituan（美团）、Sierra
              Ventures、Greater Bay Area Homeland Investments 和 Puhua
              Capital。尽管融资能力信号强，公开披露完全缺少经审计收入、毛利率、软件维护续费附着率和资产负债表现金消耗。第三方数据库显示截至 2026 年 9 月有 309 名员工，而职业网络自报区间为 1,001 至
              5,000 人；要验证 2026 年独角兽估值，首先必须取得一手审计材料。
            claimRefs:
