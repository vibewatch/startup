      - number: '3.2'
        title: 服务场景中的功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              商业服务机器人技术差异化已从基础自主导航转向多场景设施适应性、车队调度密度和硬件可靠性。Pudu 深度整合深圳电机、传感器和结构件供应链，能快速迭代硬件并保持相对西方竞争者的成本优势。其产品组合覆盖
              BellaBot Pro 配送机器人、CC1 与 BG1 系列商业清洁机，以及 MP2000 工业运输 AMR。Counterpoint Research 将 Pudu
              列为全球商业清洁出货量领先供应商，说明其能力已从餐厅延伸到物流枢纽、商场和医疗场景。
