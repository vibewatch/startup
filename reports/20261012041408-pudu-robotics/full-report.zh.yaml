        title: 护城河持久性、切换成本与定位图
        blocks:
          - type: paragraph
            body: >-
              尽管 Pudu 估计拥有商业服务机器人全球 23% 至 25% 的份额，护城河仍面临压力。IFR 报告专业酒店机器人销量在 2024 年下降 11%，说明餐厅早期的新奇性采用已进入受 ROI
              驱动的替换周期。传感器、LiDAR 和 SLAM 导航技术在亚洲供应链中普遍商品化，多年租赁到期后客户切换成本不高。商业买家经常在清洁、配送和仓储领域同时使用不同供应商，而非统一到单一操作系统。Pudu
              必须把硬件覆盖转化为持久的软件、设施分析和具身 AI 工作流锁定，才能抵御新挑战者和对工资敏感的人工替代方案。
