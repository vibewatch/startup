            body: >-
              商业服务机器人的运营完整性依赖安全云基础设施、多机器人调度算法和可靠硬件。2025 年 8 月，独立网络安全研究发现 Pudu
              后端车队管理存在严重架构漏洞，未认证或持有令牌的行为者可发出任意指令、改道机器、重置客户订单，甚至瘫痪整支餐厅机器人车队。公司技术和销售渠道在最初披露后超过一周未响应，研究人员最终直接通知主要日本餐饮客户，进一步放大事件严重性。Pudu
              随后修复漏洞、发放 10,000 美元奖金并设立 Security Response Center，但事件仍暴露治理风险。硬件可靠性还要求严格监测模块化锂离子电池包和拥挤商业场所中的多传感器感知系统。
