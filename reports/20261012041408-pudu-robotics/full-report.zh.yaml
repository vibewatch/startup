  - id: FE001
    title: Pudu Robotics “一脑多形”架构图
    type: stack
    summary: 六层架构，从高层云端协调延伸至实体机械模块与机器人本体。
    data:
      layers:
        - label: 应用与服务层
          modules:
            - Pudu 云管理门户
            - 实时污渍热力图与分析
            - 车队性能与在线率仪表盘
        - label: 调度与集成层
          modules:
            - 多机器人车队调度
            - 电梯 IoT 与访问控制 API
            - MES 工厂调度网关
        - label: 感知与 AI 决策层
          modules:
            - PUDU VSLAM+ 导航引擎
            - 后置 AI 摄像头实时检查清洁度
            - 地面材质与液体污渍分类器
        - label: 导航与运动控制层
          modules:
            - 双 LiDAR 与视觉 SLAM 融合
            - 动态避障制动
            - 高精度运动控制器
        - label: 传感器与硬件接口层
          modules:
            - 3D LiDAR 传感器套件
            - 三台 RGBD 障碍物检测摄像头
            - 轮式编码器与部件健康监测器
        - label: 实体本体层
          modules:
            - 汽车级悬挂底盘
            - 集成关节模块与执行器
            - 模块化四合一清洁组件
    approximationNotes: 架构层综合公开技术发布、产品文档与工程专利；内部固件和云端 API 接口仍属专有。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初始试点到多设施车队扩张与工业交叉销售的客户采用和生命周期阶段。
    claimRefs:
      - CU001
      - CU004
      - CU013
    approximationNotes: 生命周期进程综合公开的分销商合作模式、客户案例研究与公司运营发布。
    data:
      nodes:
        - label: 1. 初步发现与评估
          stage: Awareness
          touchpoints:
            - Trade show demos (Hannover Messe, ISSA Expo)
            - Distributor partner outreach and regional showrooms
        - label: 2. 单点试点部署
          stage: Trial
          touchpoints:
            - Single unit trial (e.g., BellaBot or CC1 cleaner)
            - Rapid map-and-go setup and staff orientation
        - label: 3. 车队规模化采用
          stage: Production
          touchpoints:
            - Multi-robot rollout across retail floor or dining area
            - Local distributor maintenance and parts supply
        - label: 4. 多设施区域推广
          stage: Expansion
          touchpoints:
            - Americas centralized support from Dallas hub
            - Centralized PUDUlink device fleet monitoring
        - label: 5. 跨品类增售
          stage: Diversification
          touchpoints:
            - Addition of industrial delivery (PUDU T300) in back-of-house
            - Deployment of commercial cleaning (PUDU BG1 / CC1)
        - label: 6. 长期合同续签
          stage: Durability
          touchpoints:
            - Ongoing hardware servicing and software fleet updates
            - Evaluation of total cost of ownership vs human labor
