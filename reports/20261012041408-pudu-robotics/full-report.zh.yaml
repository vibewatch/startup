              - CV012
      - number: '8.3'
        title: 情景分析与尽调要求
        blocks:
          - type: paragraph
            body: >-
              为界定回报预期和下行风险，我们围绕三年投资期限建立三种经营情景。乐观情景下，商用清洁的采用率继续快速上升，工业配送年出货超过 10,000 台，具身 AI 软件模块的经常性 SaaS 附加率超过
              25%，综合毛利率升至约 50%。在此条件下，未来若在香港或中国大陆以 6.0x 至 8.0x 营收倍数上市，将带来显著的倍数扩张和可观上行空间。基准情景下，Pudu
              在欧洲和亚太地区维持稳定的硬件交付量，但遭遇国内竞争者的价格竞争，EBITDA 接近盈亏平衡，毛利率被限制在 30% 至 35%。随着增长放缓，估值大致持平于投入资本的 1.0x 至
              1.3x。悲观情景下，针对中国自主机器人企业的地缘贸易限制加剧，国际零售客户因数据治理担忧暂停部署，人形机器人研发的高资本开支加速现金消耗，最终触发结构化下轮融资或执行清算优先权。明确的论点失效触发因素包括：一线国际客户流失率有记录地超过
              20%、出口管制制裁限制传感器或半导体供应、18 个月内未能实现经审计的经营盈利，或下轮融资低于 USD 1.0 billion。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 证据附件
        blocks:
          - type: callout
            title: 投资结论：估值偏高，继续研究
            body: >-
              Pudu Robotics 在商用清洁和配送机器人领域已展现真实的产品市场匹配度与规模，但在缺少经审计营收、单机毛利和股权结构表中的优先权安排的情况下，仍按 2026 年 4 月 USD 1.5 billion
              投后估值进行投资判断，会让投资者暴露于不对称下行风险。建议跟踪 IPO 前的流动性进展，并在投入成长资本前要求完成全面财务审计。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV013
          - type: callout
            title: 地方政府联合体带来的治理与流动性压力
            body: 中国地方政府引导基金和国内工业供应商共同领投 Pudu 的 USD 150 million 融资，可能附带严格的境内上市承诺和清算优先权，也会让敏感的西方企业环境中的合规和客户观感更复杂。
            calloutType: risk
            claimRefs:
              - CV008
              - CV014
