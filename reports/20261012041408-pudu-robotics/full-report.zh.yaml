    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与类别画像
        blocks:
          - type: paragraph
            body: >-
              商业服务机器人市场高度集中于中国硬件开发商，全球前五大制造商均来自中国，合计控制全球市场一半以上。Pudu 的竞争层次包括酒店配送的 Keenon Robotics、餐厅收台和送餐的 Bear
              Robotics、Segway-Ninebot 支持的多模态挑战者 EncoSmart，以及人工劳动这一既有替代方案。Tracxn 追踪到 20 多家活跃商业配送机器人竞争者，但 Pudu
              在累计风险投资和商业部署规模上领先。公司已从餐饮配送扩展到商业清洁、工业物料运输和户外维护，以避开单一品类拥挤。
