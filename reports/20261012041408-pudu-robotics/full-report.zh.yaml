chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics 成立于 2016 年，总部位于中国深圳的高科技硬件产业集群，已从早期的餐饮服务机器人供应商成长为具备规模的全球商用自主移动机器人企业。公司以“One Brain, Multiple
              Embodiments”平台为核心，覆盖酒店服务配送、商业设施清洁、工业物流配送和通用具身人工智能四条产品线。Pudu 在深圳、成都和香港设有专门研发设施，业务已拓展至 85 个以上国家和地区，累计出货超过
              130,000 台，客户包括 Walmart、Carrefour 和 EDEKA。其收入结构也发生了显著变化：早期市场采用主要集中在餐饮配送机器人，商业清洁机器人在 2025 年收入占比跃升至 70%
              以上，带动收入同比增长 100%。多元化产品策略降低了对酒店服务单一领域的暴露，也让 Pudu 有机会成为提供全套自动化设施服务的合作伙伴。
            claimRefs:
