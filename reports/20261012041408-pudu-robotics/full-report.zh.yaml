            body: >-
              综合 Pudu 的风险可以看到：商业进展有收入排名和累计融资超过 300 million USD 支撑，但下行风险集中在贸易政策、硬件利润率压缩和网络安全治理。若要在超过 1.5 billion USD
              的估值基准下做投资判断，尽调须监测三个明确的论点失效触发器：一是西方制裁、出口限制或针对中国商业机器人的惩罚性关税扩大，将打破国际增长预期；二是已部署车队反复出现未修补的远程执行漏洞并导致企业客户流失，将永久损害品牌；三是零部件成本和分销折扣上升而无法维持毛利率稳定，将削弱长期经营利润。持续核验供应链来源和安全审计是不可谈判的尽调条件。
