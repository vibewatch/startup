              - CR004
      - number: '7.3'
        title: Manufacturing Geographic Concentration, Component Sourcing, and Distributor Channel Risk
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics exhibits profound geographic concentration in its physical manufacturing operations. All
              three primary production facilities—located in Jianhu (Yancheng), Tongxiang (Jiaxing), and Dongguan—are
              situated within mainland China, collectively spanning over 100,000 square meters with an aggregate annual
              capacity designed for 150,000 units. While centralized domestic production yields significant economies of
              scale and direct access to the Pearl River Delta electronics supply chain, it leaves the company without
              international manufacturing redundancy. Furthermore, global market distribution relies heavily on an
              indirect channel model encompassing more than 700 third-party distributors. Should geopolitical export
              restrictions disrupt component flows or trade barriers raise distribution frictions, Pudu ability to
              service international accounts and support over 130,000 deployed robots could suffer severe operational
              impairment.
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR014
