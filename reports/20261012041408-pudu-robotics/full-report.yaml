chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Scale, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2016 and headquartered in the high-tech hardware ecosystem of Shenzhen, China, Pudu Robotics
              (普渡科技) has evolved from an early restaurant service robotics provider into a scaled global enterprise in
              commercial autonomous mobile robotics. The company operates a multi-sector commercial model anchored
              around its 'One Brain, Multiple Embodiments' platform. This framework supports four distinct product
              lines: hospitality service delivery, commercial facility cleaning, industrial logistics delivery, and
              general embodied artificial intelligence systems. Operating with dedicated research facilities across
              Shenzhen, Chengdu, and Hong Kong, Pudu has successfully expanded its footprint into more than 85 countries
              and regions, achieving over 130,000 cumulative unit shipments to enterprise clients such as Walmart,
              Carrefour, and EDEKA. This commercial evolution is underscored by a dramatic transformation in its revenue
              composition: while initial market adoption centered on food delivery robots, commercial cleaning robots
              surged to represent over 70% of total revenue during 2025, propelling a 100% year-over-year revenue surge.
              Pudu's diversified product strategy mitigates single-sector hospitality exposure while positioning the
              firm as a full-suite automated facility service partner.
            claimRefs:
