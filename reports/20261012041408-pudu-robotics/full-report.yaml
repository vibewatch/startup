  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Export Controls, and Cross-Border Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics operates across more than 60 international countries and regions, exposing its commercial
              robotics business to an increasingly intricate matrix of cross-border trade controls, regulatory
              certifications, and intellectual property protections. While the company maintains an extensive
              intellectual property portfolio spanning 1,684 global patents and pending applications alongside 1,304
              trademark registrations, international expansion exposes its hardware to escalating geopolitical friction.
              Most critically, ongoing US-China trade disputes and Section 301 tariffs impose substantial cost penalties
              on Chinese robotics hardware and imported precision sub-assemblies. Furthermore, commercial deployments in
              North American and European enterprise settings require strict adherence to evolving radio type approvals,
              CE Machinery Directives, and workplace safety standards. Without diversified manufacturing footprints
              outside mainland China, Pudu remains directly exposed to sudden tariff adjustments, import bans, or
              regulatory compliance hurdles that could stall international deliveries.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
