      - number: '7.2'
        title: Fleet Cybersecurity, Remote Control Vulnerabilities, and Operational Reliability
        blocks:
          - type: paragraph
            body: >-
              The operational integrity of commercial service robotics depends fundamentally upon secure cloud
              infrastructure, robust multi-robot dispatch algorithms, and resilient hardware engineering. In August
              2025, independent cybersecurity research revealed severe architectural vulnerabilities in Pudu backend
              fleet administration, where unauthenticated or token-holding actors could issue arbitrary commands,
              redirect machines, reset active customer orders, or take down entire restaurant robot fleets. The severity
              of this incident was compounded by organizational latency: corporate technical and sales channels failed
              to respond to initial vulnerability disclosures for over a week until the researcher notified major
              Japanese restaurant clients directly. Although Pudu subsequently remediated the vulnerability, awarded a
              10,000 dollar bounty, and created a formal Security Response Center, the episode underscores meaningful
              residual governance risks. Hardware reliability also requires strict monitoring of modular lithium-ion
              battery packs and multi-sensor perception systems operating in crowded commercial venues.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
