      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics organizes its hardware and software systems around a proprietary 'One Brain, Multiple
              Embodiments' architectural paradigm. The core computational layer integrates multi-robot dispatch, fleet
              traffic coordination, and cross-embodiment task routing managed across dedicated research and development
              centers in Shenzhen, Chengdu, and Hong Kong. At the edge device level, Pudu employs dual visual and laser
              SLAM navigation—designated PUDU VSLAM+—which fuses 3D LiDAR arrays and triple RGBD optical cameras to
              achieve high-precision indoor positioning and obstacle avoidance without requiring ceiling markers. On
              specialized cleaning platforms such as the CC1 Pro, the system incorporates a dedicated rear-facing AI
              inspection camera that continuously monitors floor cleanliness post-scrubbing. This camera automatically
              marks persistent stains on an operational heat map and initiates closed-loop spot recleaning routines
              without human intervention, balancing cleaning efficiency with battery endurance.
            claimRefs:
