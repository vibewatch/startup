      - number: '6.3'
        title: Enterprise Deployments and Named Customer Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Pudu's customer list includes notable global enterprise brands that provide commercial credibility across
              varied operating environments. In the retail and hypermarket segment, high-volume retail chains including
              Walmart, Carrefour, and EDEKA have deployed Pudu robotic systems for in-store logistics and
              customer-facing service workflows. In industrial logistics, enterprise clients including Honeywell have
              integrated Pudu autonomous mobile robots into warehousing and manufacturing workflows, validating the
              operational reliability of the T300 platform in complex discrete manufacturing facilities. Additional
              enterprise adopters in North America span technology services and public entities, including Accenture,
              Norwegian Cruise Line, and NASA. Nevertheless, public disclosures do not specify fleet size per enterprise
              location, contract length, or whether deployments represent comprehensive multi-year corporate agreements
              or localized regional pilot rollouts.
            claimRefs:
              - CU005
              - CU008
