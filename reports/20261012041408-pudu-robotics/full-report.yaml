      - number: '6.4'
        title: Retention Durability, Channel Dependence, and Competitive Rivalry
        blocks:
          - type: paragraph
            body: >-
              While Pudu's reported shipment velocity is impressive, significant diligence questions remain regarding
              revenue quality, subscription durability, and customer concentration. Pudu distributes the majority of its
              robots via third-party distributor networks and system integrators rather than direct enterprise leasing
              agreements, introducing intermediary dependence and insulating the company from direct customer retention
              feedback. Crucially, Pudu does not disclose net revenue retention (NRR), gross revenue retention (GRR), or
              customer churn percentages, leaving it unclear whether initial robot purchases lead to repeat fleet
              expansion or sit idle after initial novelty wanes. Furthermore, Pudu faces intense competitive rivalry
              from at least 20 active service robotics competitors, including specialized restaurant automation startups
              and established industrial AMR manufacturers. Diligence must verify whether Pudu's high-margin software
              and maintenance attach rates can offset commoditization pressures in competitive hardware markets.
            claimRefs:
              - CU007
              - CU011
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Revenue Pivot to Commercial Cleaning and Industrial Applications
            body: >-
              Pudu has successfully transformed from a restaurant-centric delivery robot vendor into a diversified
              commercial robotics manufacturer. Commercial cleaning now represents over 70% of total revenue, while
              industrial delivery robots (PUDU T300) surpassed 4,000 units in their first year of release, substantially
              widening Pudu's customer demographic.
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU004
          - type: callout
            title: Durability and Unit Economics Uncertainty
            body: >-
              Despite reporting over 130,000 cumulative shipments and prominent customer accounts such as Walmart and
              Carrefour, Pudu publishes zero data on customer renewal, churn rates, or net revenue retention (NRR).
              Diligence must probe whether units remain actively deployed or suffer high attrition once hardware
              warranties expire.
            calloutType: risk
