  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics has structured its commercial hardware portfolio into four distinct functional product
              lines: service delivery, commercial cleaning, industrial delivery, and general embodied AI robotics. While
              the company's early market visibility was established through restaurant table delivery platforms like
              BellaBot and KettyBot, commercial cleaning has rapidly expanded to generate over 70% of total revenue. The
              flagship PUDU CC1 Pro autonomous cleaning robot combines four primary functions—sweeping, scrubbing,
              vacuuming, and dust-mopping—engineered specifically for high-throughput commercial spaces spanning 5,000
              to 8,000 square meters per cycle. In industrial environments, Pudu's T300 and T150 autonomous mobile
              robots automate manufacturing line replenishment, surpassing 4,000 cumulative industrial shipments within
              twelve months. These automated workflows replace repetitive manual cart transit and custodial labor,
              providing facility operators with measurable throughput gains while introducing new requirements for
              physical aisle clearance and docking station maintenance.
            claimRefs:
              - CE001
              - CE002
