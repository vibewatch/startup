  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Scope, Boundary Definitions, and Substitution Dynamics
        blocks:
          - type: paragraph
            body: >-
              The commercial service robotics sector spans dedicated autonomous mobile machinery engineered to execute
              routine, labor-intensive tasks across indoor commercial and light-industrial environments. Rather than
              competing with general enterprise software or heavy fixed warehouse infrastructure, service robotics
              address direct operational bottlenecks in floor cleaning, hospitality food and beverage delivery, and
              intralogistics material transfer. Pudu Robotics has methodically broadened its operational boundaries
              beyond its founding focus on dining room food-running carts into commercial facility sanitization and
              factory floor haulage. Commercial cleaning automated platforms now constitute more than 70% of corporate
              revenue, replacing traditional outsourced contract janitorial crews in high-traffic shopping centers,
              healthcare complexes, and transit hubs. Meanwhile, industrial delivery solutions have achieved rapid
              adoption with over 4,000 automated units shipped within a year of commercial introduction, operating as
              low-barrier alternatives to capital-intensive automated storage and retrieval systems. The status-quo
              substitute across these domains remains manual hourly labor, where persistent demographic headwinds, high
              employee turnover rates, and rising statutory minimum wages accelerate corporate willingness to transition
              from variable operational payroll to predictable automated equipment contracts.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
      - number: '2.2'
        title: Industry Sizing, Growth Trajectories, and Market Share Concentration
        blocks:
          - type: paragraph
            body: >-
              Independent market research from Frost & Sullivan indicates that the global commercial service robotics
              market achieved a 37.0% compound annual growth rate between 2021 and 2025, with expansion projected to
              continue at a 31.2% CAGR through 2030. This expansion is increasingly dominated by Chinese equipment
              manufacturers; in 2025, the five largest commercial service robotics providers globally were all Chinese
              enterprises, collectively supplying over half of worldwide market demand. Within this competitive
              landscape, Frost & Sullivan's 2025 independent study ranked Pudu Robotics first worldwide across both
              revenue with approximately 25% global market share and shipment volume with approximately 23% global
              share. Furthermore, research from BriefGlance and Frost & Sullivan highlighted Pudu's preeminence among
              Chinese exporters, capturing a 44% overseas market share and a 29% market share in commercial cleaning
              robotics revenue. This revenue composition confirms that Pudu's serviceable obtainable market has pivoted
              heavily into commercial cleaning and industrial intralogistics, insulated by proprietary hardware scaling
              and global distribution channel partnerships that distinguish it from single-niche competitors.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
