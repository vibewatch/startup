      - number: '1.2'
        title: Executive Leadership, Technical Pedigree, and Governance Dynamics
        blocks:
          - type: paragraph
            body: >-
              Pudu Robotics was conceived and continues to be led by its founder and Chief Executive Officer, Felix
              Zhang (张涛). Zhang possesses a deep academic and engineering pedigree in mechanical automation, having
              conducted specialized research in the Department of Mechanical and Aerospace Engineering at the Hong Kong
              University of Science and Technology (HKUST). Prior to founding Pudu Robotics, Zhang established the
              Chinese technology media platform Leiphone, blending technical expertise with market communication acumen.
              His technical stewardship is evidenced by over 350 robotics-related patents covering navigation
              algorithms, multi-robot coordination, and integrated joint modules. However, this engineering prominence
              creates significant key-person dependence: the enterprise's technological vision, embodied AI roadmap
              (such as the proprietary PuduFM 1.0 foundation model), and commercial strategy remain deeply concentrated
              in Zhang's personal leadership. The broader management structure operates across distributed engineering
              hubs in Shenzhen, Chengdu, and Hong Kong, yet formal board composition and independent governance
              disclosures remain strictly private, necessitating thorough diligence regarding minority shareholder
              rights and corporate governance controls.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO011
              - CO013
