      - number: '4.3'
        title: Cost Structure and Unit-Economics Boundaries
        blocks:
          - type: paragraph
            body: >-
              Available evidence identifies several cost drivers but does not quantify their effect. ThinkChina reports
              that Pudu completed a Jianhu manufacturing facility with capacity for up to 100,000 robots annually, a
              capacity figure that cannot be translated into utilization or fixed-cost absorption without production
              data. The same interview says Pudu had reached break-even while management expected continued R&D
              investment to defer profits. A low-reputation supplier-authored profile adds directional evidence that
              robot power management and constrained electronic-component supply can limit scaling, but it does not
              measure Pudu-specific cost exposure. Gross margin by product, warranty and field-service expense,
              inventory turns, receivables, capex, customer acquisition cost, and payback therefore remain open
              diligence items.
            claimRefs:
