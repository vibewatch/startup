      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Pudu's April 2026 round supplied nearly $150 million of new financing at a reported valuation above $1.5
              billion. The announced uses include embodied-AI development, portfolio expansion, global expansion,
              manufacturing scale, and supply-chain strengthening, all of which imply continuing cash demands across
              R&D, inventory, production, and international support. The raise is evidence of financing access, not
              evidence of cash on hand or runway: the retained sources do not disclose closing cash, operating cash
              flow, monthly burn, debt, working-capital facilities, investor terms, or next-round triggers. Financially,
              the company shows strong reported growth and product diversification, but revenue quality, gross-profit
              conversion, and capital efficiency remain unverified. An investor should condition underwriting on audited
              statements and operating cohorts rather than headline funding or shipment totals.
            claimRefs:
