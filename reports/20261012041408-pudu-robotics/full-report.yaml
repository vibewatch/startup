      - number: '4.2'
        title: Pricing, Monetization, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a hardware-led international business, but not a precise pricing
              architecture. ThinkChina reports that overseas customers account for more than 80% of Pudu's business,
              while the company's LinkedIn page reports more than 130,000 robots shipped across over 85 countries and
              regions. A company-derived Americas update reports nearly 15,000 regional deployments and 285%
              year-over-year regional revenue growth. These are useful distribution and demand proxies, not evidence of
              list prices, realized discounts, channel take rates, software attach, maintenance revenue, renewal, or
              sales-cycle efficiency. The pricing table marks those fields unavailable rather than converting deployment
              scale into assumed recurring revenue or treating distributor growth as proof of attractive channel
              economics.
            claimRefs:
