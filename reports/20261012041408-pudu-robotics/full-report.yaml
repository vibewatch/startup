      - number: '6.2'
        title: Adoption Trajectory and Geographic Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              Pudu's commercial deployment trajectory demonstrates rapid international expansion, moving beyond East
              Asia to establish scaled operations across North America and Europe. In the Americas, Pudu deployed nearly
              15,000 robots by early 2026 across hospitality, retail, logistics, and healthcare venues, driving a
              reported 285% year-over-year surge in regional revenue. This growth has been supported by a 63.6% increase
              in local distributor partnerships and the opening of a centralized Americas headquarters and showroom in
              Dallas, Texas. Industry tracking from Frost & Sullivan places Pudu's global commercial service robotics
              market share at 23% to 25% across revenue and shipment metrics, while Counterpoint Research ranks Pudu
              first worldwide in both commercial cleaning robot shipments and revenue. However, because Pudu reports
              cumulative shipments rather than active fleet utilization, real-world customer retention and churn
              dynamics remain critical diligence uncertainties.
            claimRefs:
