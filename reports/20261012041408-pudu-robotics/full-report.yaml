              - CO011
      - number: '1.3'
        title: Financing History, Valuation Benchmarks, and Critical Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              In April 2026, Pudu Robotics achieved unicorn status following the completion of a Series D funding round
              that raised nearly USD 150 million, valuing the company at over USD 1.5 billion. This round brought
              cumulative equity funding to more than USD 300 million according to company disclosures, while private
              market intelligence provider Tracxn records a total of USD 342 million across nine lifetime rounds. Pudu's
              capitalization table features a syndicate of elite institutional investors and corporate strategists,
              including Sequoia Capital (红杉中国), local-services giant Meituan (美团), Silicon Valley's Sierra Ventures,
              regional state-backed Greater Bay Area Homeland Investments, and early growth backer Puhua Capital.
              Despite these robust capital access signals, prospective investors face notable information asymmetry.
              Crucial underwriting variables—such as audited revenue figures, gross margins, recurring software
              maintenance attach rates, and balance sheet cash burn—are entirely absent from public disclosure.
              Furthermore, third-party databases document 309 employees as of September 2026, contrasting sharply with
              self-reported employee ranges of 1,001 to 5,000 on professional networks. Bridging these discrepancies
              through primary audit documentation represents an indispensable prerequisite for validating the 2026
              unicorn valuation.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
