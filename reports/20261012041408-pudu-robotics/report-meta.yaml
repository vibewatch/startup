companyProfile:
  summary: >-
    Pudu Robotics is a late-stage private commercial robotics company headquartered in Shenzhen that sells service
    delivery, cleaning, industrial logistics, and embodied-AI platforms to enterprise operators worldwide. It built an
    early reputation in hospitality robots, then expanded into commercial cleaning and industrial AMRs, which now anchor
    the business's reported scale and growth.
