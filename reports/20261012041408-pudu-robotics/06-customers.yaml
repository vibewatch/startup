company:
  name: Pudu Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Pudu Robotics demonstrates substantial customer scale with over 130,000 cumulative shipments across 85 countries and
    prominent enterprise references including Walmart, Carrefour, and Honeywell. However, the commercial model relies
    heavily on third-party distributor channels, and the absence of disclosed retention, cohort churn, or recurring
    revenue attach figures leaves fleet durability and subscription renewal quality unverified.
sections:
  - id: customer-segments-and-market-breadth
    title: Customer Base Segmentation and Market Breadth
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU012
    tableRefs:
      - TU001
    body: >-
      Pudu Robotics has structured its customer base across four primary application verticals, transitioning from its
      initial concentration in food service delivery into commercial facility cleaning, discrete manufacturing
      logistics, and embodied-AI applications. While the company's early brand recognition was established through
      dining robots such as BellaBot and KettyBot, commercial facility cleaning has rapidly expanded to account for over
      70% of total company revenue in 2025. In parallel, Pudu has established a growing footprint in discrete
      manufacturing and supply chain logistics, delivering standardized mobile robots such as the PUDU T300 to
      industrial clients across electronics manufacturing, automotive components, and metalworking. Within just one year
      of launching its industrial delivery line, the company shipped more than 4,000 industrial units. Overall, Pudu
      reports cumulative global shipments exceeding 130,000 robots across 85 countries and regions, representing broad
      commercial market adoption across corporate, retail, healthcare, and hospitality buyers.
  - id: adoption-trajectory-and-deployment-scale
    title: Adoption Trajectory and Geographic Deployment Scale
    claimRefs:
      - CU002
      - CU006
      - CU007
      - CU009
      - CU010
      - CU013
    tableRefs:
      - TU002
    figureRefs:
      - FU001
    body: >-
      Pudu's commercial deployment trajectory demonstrates rapid international expansion, moving beyond East Asia to
      establish scaled operations across North America and Europe. In the Americas, Pudu deployed nearly 15,000 robots
      by early 2026 across hospitality, retail, logistics, and healthcare venues, driving a reported 285% year-over-year
      surge in regional revenue. This growth has been supported by a 63.6% increase in local distributor partnerships
      and the opening of a centralized Americas headquarters and showroom in Dallas, Texas. Industry tracking from Frost
      & Sullivan places Pudu's global commercial service robotics market share at 23% to 25% across revenue and shipment
      metrics, while Counterpoint Research ranks Pudu first worldwide in both commercial cleaning robot shipments and
      revenue. However, because Pudu reports cumulative shipments rather than active fleet utilization, real-world
      customer retention and churn dynamics remain critical diligence uncertainties.
  - id: enterprise-deployments-and-named-customer-proof
    title: Enterprise Deployments and Named Customer Reference Quality
    claimRefs:
      - CU005
      - CU008
      - CU012
    tableRefs:
      - TU003
    body: >-
      Pudu's customer list includes notable global enterprise brands that provide commercial credibility across varied
      operating environments. In the retail and hypermarket segment, high-volume retail chains including Walmart,
      Carrefour, and EDEKA have deployed Pudu robotic systems for in-store logistics and customer-facing service
      workflows. In industrial logistics, enterprise clients including Honeywell have integrated Pudu autonomous mobile
      robots into warehousing and manufacturing workflows, validating the operational reliability of the T300 platform
      in complex discrete manufacturing facilities. Additional enterprise adopters in North America span technology
      services and public entities, including Accenture, Norwegian Cruise Line, and NASA. Nevertheless, public
      disclosures do not specify fleet size per enterprise location, contract length, or whether deployments represent
      comprehensive multi-year corporate agreements or localized regional pilot rollouts.
  - id: retention-durability-and-concentration-risks
    title: Retention Durability, Channel Dependence, and Competitive Rivalry
    claimRefs:
      - CU007
      - CU011
      - CU013
      - CU014
    body: >-
      While Pudu's reported shipment velocity is impressive, significant diligence questions remain regarding revenue
      quality, subscription durability, and customer concentration. Pudu distributes the majority of its robots via
      third-party distributor networks and system integrators rather than direct enterprise leasing agreements,
      introducing intermediary dependence and insulating the company from direct customer retention feedback. Crucially,
      Pudu does not disclose net revenue retention (NRR), gross revenue retention (GRR), or customer churn percentages,
      leaving it unclear whether initial robot purchases lead to repeat fleet expansion or sit idle after initial
      novelty wanes. Furthermore, Pudu faces intense competitive rivalry from at least 20 active service robotics
      competitors, including specialized restaurant automation startups and established industrial AMR manufacturers.
      Diligence must verify whether Pudu's high-margin software and maintenance attach rates can offset commoditization
      pressures in competitive hardware markets.
