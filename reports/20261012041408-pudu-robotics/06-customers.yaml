figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Customer adoption and lifecycle stages from initial pilot to multi-facility fleet expansion and industrial
      cross-selling.
    claimRefs:
      - CU001
      - CU004
      - CU013
    approximationNotes: >-
      Lifecycle progression synthesized from published distributor partnership models, customer case studies, and
      corporate operational releases.
    data:
      nodes:
        - label: 1. Initial Discovery & Evaluation
          stage: Awareness
          touchpoints:
            - Trade show demos (Hannover Messe, ISSA Expo)
            - Distributor partner outreach and regional showrooms
        - label: 2. Single-Site Pilot Deployment
          stage: Trial
          touchpoints:
            - Single unit trial (e.g., BellaBot or CC1 cleaner)
            - Rapid map-and-go setup and staff orientation
        - label: 3. Fleet Production Adoption
          stage: Production
          touchpoints:
            - Multi-robot rollout across retail floor or dining area
            - Local distributor maintenance and parts supply
        - label: 4. Multi-Facility Regional Rollout
          stage: Expansion
          touchpoints:
            - Americas centralized support from Dallas hub
            - Centralized PUDUlink device fleet monitoring
        - label: 5. Cross-Category Upselling
          stage: Diversification
          touchpoints:
            - Addition of industrial delivery (PUDU T300) in back-of-house
            - Deployment of commercial cleaning (PUDU BG1 / CC1)
        - label: 6. Long-Term Contract Renewal
          stage: Durability
          touchpoints:
            - Ongoing hardware servicing and software fleet updates
            - Evaluation of total cost of ownership vs human labor
callouts:
  - calloutType: insight
    title: Strategic Revenue Pivot to Commercial Cleaning and Industrial Applications
    body: >-
      Pudu has successfully transformed from a restaurant-centric delivery robot vendor into a diversified commercial
      robotics manufacturer. Commercial cleaning now represents over 70% of total revenue, while industrial delivery
      robots (PUDU T300) surpassed 4,000 units in their first year of release, substantially widening Pudu's customer
      demographic.
    claimRefs:
      - CU001
      - CU003
      - CU004
  - calloutType: risk
    title: Durability and Unit Economics Uncertainty
    body: >-
      Despite reporting over 130,000 cumulative shipments and prominent customer accounts such as Walmart and Carrefour,
      Pudu publishes zero data on customer renewal, churn rates, or net revenue retention (NRR). Diligence must probe
      whether units remain actively deployed or suffer high attrition once hardware warranties expire.
    claimRefs:
      - CU002
      - CU005
      - CU014
