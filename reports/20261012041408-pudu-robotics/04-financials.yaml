company:
  name: "Pudu Robotics"
chapter:
  number: 4
  title: "Financials"
  summary: "Pudu reports rapid 2025 growth and a revenue mix now dominated by commercial cleaning, while independent and syndicated sources corroborate the direction of that growth but not absolute revenue, gross margin, or cash generation. The April 2026 financing expands investment capacity, yet funding raised is not cash available and the retained public evidence is insufficient to underwrite runway, unit economics, or realized pricing."
sections:
  - id: "revenue-mix-and-traction"
    title: "Revenue Mix and Commercial Traction"
    body: "Pudu's public financial evidence describes direction and mix rather than an auditable income statement. Company-issued disclosures report 100% year-over-year revenue growth in 2025, with commercial cleaning contributing more than 70% of total revenue and industrial delivery exceeding 4,000 units shipped during its first year on the market. A separate company-issued market-ranking release reports approximately 25% of global commercial-service-robot revenue and 23% of shipments in 2025. Those measures indicate scale and a potentially favorable revenue-versus-volume mix, but they do not disclose absolute revenue, average selling price, recurring-service contribution, returns, or recognized-versus-booked revenue. The revenue-stream table therefore separates reported operating signals from the private metrics still required for underwriting."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI010"
      - "CI012"
      - "CI016"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-go-to-market"
    title: "Pricing, Monetization, and Go-to-Market"
    body: "The retained sources support a hardware-led international business, but not a precise pricing architecture. ThinkChina reports that overseas customers account for more than 80% of Pudu's business, while the company's LinkedIn page reports more than 130,000 robots shipped across over 85 countries and regions. A company-derived Americas update reports nearly 15,000 regional deployments and 285% year-over-year regional revenue growth. These are useful distribution and demand proxies, not evidence of list prices, realized discounts, channel take rates, software attach, maintenance revenue, renewal, or sales-cycle efficiency. The pricing table marks those fields unavailable rather than converting deployment scale into assumed recurring revenue or treating distributor growth as proof of attractive channel economics."
    claimRefs:
      - "CI010"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
    tableRefs:
      - "TI002"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit-Economics Boundaries"
    body: "Available evidence identifies several cost drivers but does not quantify their effect. ThinkChina reports that Pudu completed a Jianhu manufacturing facility with capacity for up to 100,000 robots annually, a capacity figure that cannot be translated into utilization or fixed-cost absorption without production data. The same interview says Pudu had reached break-even while management expected continued R&D investment to defer profits. A low-reputation supplier-authored profile adds directional evidence that robot power management and constrained electronic-component supply can limit scaling, but it does not measure Pudu-specific cost exposure. Gross margin by product, warranty and field-service expense, inventory turns, receivables, capex, customer acquisition cost, and payback therefore remain open diligence items."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "Pudu's April 2026 round supplied nearly $150 million of new financing at a reported valuation above $1.5 billion. The announced uses include embodied-AI development, portfolio expansion, global expansion, manufacturing scale, and supply-chain strengthening, all of which imply continuing cash demands across R&D, inventory, production, and international support. The raise is evidence of financing access, not evidence of cash on hand or runway: the retained sources do not disclose closing cash, operating cash flow, monthly burn, debt, working-capital facilities, investor terms, or next-round triggers. Financially, the company shows strong reported growth and product diversification, but revenue quality, gross-profit conversion, and capital efficiency remain unverified. An investor should condition underwriting on audited statements and operating cohorts rather than headline funding or shipment totals."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI016"
