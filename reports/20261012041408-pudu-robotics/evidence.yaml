evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: equity-governance
    missingEvidence: >-
      Audited cap table, board composition details, voting rights distribution, and liquidation preferences for the
      Series D round.
    whyItMatters: >-
      Without primary cap table documentation, founder economic control versus institutional investor blocking rights
      cannot be verified.
    diligencePath: Request company register of members, shareholder agreements, and Series D investor rights documentation under NDA.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: operational-headcount
    missingEvidence: >-
      Audited corporate payroll records reconciling Tracxn's 309 registered employees against LinkedIn's 1,001-5,000
      employee profile.
    whyItMatters: >-
      Direct operational burn rate, revenue per employee, and organizational scaling capacity depend heavily on actual
      payroll size.
    diligencePath: >-
      Examine corporate social security contribution records and official organizational charts during financial
      diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-team-enumeration
    missingEvidence: >-
      Comprehensive executive officer roster and employment agreements for senior functional engineering and commercial
      department heads.
    whyItMatters: >-
      Public disclosures highlight founder Felix Zhang while senior officer appointments and functional succession plans
      remain largely undisclosed.
    diligencePath: >-
      Request full management organizational chart, executive employment contracts, and non-compete agreements during
      operational review.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-unit-economics
    missingEvidence: >-
      Audited 2025 revenue figures, recurring software revenue attach rates, gross margins, and international customer
      retention data.
    whyItMatters: >-
      Without audited segment revenue and customer cohort economics, market size estimates cannot be definitively
      converted into sustainable enterprise cash flows.
    diligencePath: >-
      Request audited financial statements, distributor commission agreements, and cohort retention reports during
      management diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-vendor-lock-in
    missingEvidence: >-
      Audited customer renewal rates, net revenue retention (NRR), and multi-homing incidence across enterprise
      accounts.
    whyItMatters: >-
      Determines whether Pudu's distribution lead translates into recurring software lock-in or commoditized hardware
      churn.
    diligencePath: Request customer cohort retention data, software attach rates, and contract renewal terms during diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited 2024-2025 income statements, balance sheets, cash-flow statements, revenue-recognition policy, and segment
      schedules.
    whyItMatters: >-
      Reported growth and mix cannot establish revenue scale, gross-profit conversion, accounting quality, or cash
      generation.
    diligencePath: >-
      Request audited statements, monthly management accounts, revenue-recognition memos, and product/channel/geography
      segment bridges under NDA.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized prices, discounts, software and service attach, warranty and field-service cost, retention, CAC, sales
      cycle, contribution margin, and payback by product and channel.
    whyItMatters: >-
      Shipment and regional-growth metrics do not show whether international customer acquisition and installed fleets
      produce durable contribution profit.
    diligencePath: >-
      Obtain SKU-level order data, customer and distributor cohorts, service tickets, warranty reserves, retention
      schedules, and contribution-margin reconciliations.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Closing cash, restricted cash, monthly burn, working-capital facilities, debt and project-finance obligations,
      financing terms, planned use-of-funds budget, and next-round trigger.
    whyItMatters: >-
      Funding raised cannot be converted into cash available or runway without obligations, burn, working-capital needs,
      and transaction terms.
    diligencePath: >-
      Request the closing funds-flow, current cap table, debt schedule, 24-month cash forecast, downside case, board
      budget, and financing covenants.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer SDK documentation, API references, and open developer-community activity for Pudu's cloud
      dispatch and elevator integration layer.
    whyItMatters: >-
      Building-level automation and elevator transit depend on seamless third-party software integration; lack of public
      developer documentation increases implementation friction.
    diligencePath: >-
      Review proprietary developer integration manuals, elevator dispatch protocol specifications, and partner API
      uptime SLAs during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: named-customer-retention-and-contract-values
    missingEvidence: >-
      Audited account-level customer contracts, renewal rates, annual contract values (ACV), and net revenue retention
      (NRR) across key enterprise accounts including Walmart and Carrefour.
    whyItMatters: >-
      Without contract duration and renewal data, investors cannot verify whether enterprise deployments are expanding
      recurring revenue streams or one-off hardware sales.
    diligencePath: >-
      Request customer cohort retention schedules, top-20 customer revenue concentration breakdown, and average contract
      duration in confirmatory diligence.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-and-cohort-durability
    missingEvidence: >-
      Historical cohort retention matrices, gross revenue retention (GRR), net revenue retention (NRR), and annualized
      churn figures across commercial cleaning and delivery customers.
    whyItMatters: >-
      Service robotics hardware deployments face wear-and-tear and churn risks; lack of retention metrics prevents
      verification of recurring fleet expansion economics.
    diligencePath: >-
      Request multi-year cohort retention tables and software maintenance renewal rates from Pudu management during
      confirmatory diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: supply-chain-bill-of-materials
    missingEvidence: >-
      Granular bill-of-materials identifying country of origin and sole-source vendor dependencies for critical sensors,
      lidar units, and drive actuators.
    whyItMatters: >-
      Concentrated component sourcing in single jurisdictions exposes production lines to sudden export embargoes,
      customs delays, and tariff cost shocks.
    diligencePath: Request an audited Tier-1 supplier manifest and component origin schedule during confidential data room diligence.
    relatedQuestionRefs:
      - QR010
  - type: missing-source
    severity: material
    topic: cross-border-regulatory-and-safety-compliance
    missingEvidence: >-
      Full jurisdictional audit of commercial robotics safety certifications, radio compliance, and local labor union
      approvals across European and North American enterprise client sites.
    whyItMatters: >-
      Non-compliance with evolving regional safety machinery directives or workplace robotics ordinances can result in
      stop-work orders or customer deployment cancellations.
    diligencePath: >-
      Inspect local market CE, FCC, UL, and safety compliance certificates for every commercial robot model deployed
      with enterprise accounts.
    relatedTableRefs:
      - TR001
