callouts:
  - calloutType: insight
    title: Vertical SaaS Monetization via Embedded Payments
    body: GlossGenius demonstrates how vertical software providers in appointment-based industries unlock substantial expansion economics by combining low-friction SaaS subscription tiers with transaction fees on card payments, capturing economic value from overall salon gross merchandise volume.
    claimRefs:
      - CM001
      - CM003
      - CM006
  - calloutType: risk
    title: Adoption Inertia and Competitive Entrenchment in Expansion Segments
    body: While organic word-of-mouth adoption enabled capital-efficient scaling among solo beauty operators, moving upmarket into multi-location franchises and medical spas forces the company to confront entrenched competitors like Mindbody and Boulevard alongside heightened HIPAA compliance overhead.
    claimRefs:
      - CM011
      - CM013
      - CM014
