    title: "Customer Adoption and Expansion Journey"
    type: "journey-map"
    summary: >-
      The product creates a conceptual path from solo-operator acquisition to repeat-client
      workflows and team or location expansion, without implying measured conversion rates.
    data:
      items:
        - label: "Discover"
          actor: "Solo service professional"
          action: "Evaluates an all-in-one booking and payments workflow"
          touchpoints:
            - "Official vertical page"
            - "Free trial"
        - label: "Set up"
          actor: "Owner-operator"
          action: "Imports client and appointment information and configures booking"
          touchpoints:
            - "Data transfer"
            - "Booking site"
        - label: "Operate"
          actor: "Business owner and staff"
          action: "Runs scheduling, client records, payments, and communications"
          touchpoints:
            - "Calendar"
            - "Client profiles"
            - "Point of sale"
        - label: "Rebook"
          actor: "Business and end client"
          action: "Uses reminders and checkout prompts to encourage repeat visits"
          touchpoints:
            - "Automated reminders"
            - "Rebooking prompt"
        - label: "Add team"
          actor: "Owner or manager"
          action: "Adds staff controls and operating workflows"
          touchpoints:
            - "Staff permissions"
            - "Team scheduling"
        - label: "Add locations or verticals"
          actor: "Multi-location or health-adjacent operator"
          action: "Uses shared customer and reporting infrastructure across a broader operation"
          touchpoints:
            - "One client list"
            - "Location reporting"
    approximationNotes: >-
      Conceptual sequence based on disclosed capabilities; no stage conversion, elapsed
      time, cohort survival, or causal product impact is publicly reported.
    claimRefs:
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU014"

callouts:
  - calloutType: "risk"
    title: "Scale is better evidenced than durability"
    body: >-
      The 125,000-active-business report, $7 billion in facilitated annual sales, and
      external review volume support real adoption. They do not reveal NRR, GRR, logo
      churn, customer concentration, cohort survival, or how many businesses are paid and
      actively transacting.
    claimRefs:
      - "CU004"
      - "CU006"
      - "CU007"

