  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: >-
        A current, independently corroborated roster of named customers with deployment
        status, start date, product scope, and measurable outcomes.
      whyItMatters: >-
        Company-curated handles and a success-story headline do not establish the breadth,
        tenure, or representativeness of production adoption.
      diligencePath: >-
        Request a customer reference list stratified by vertical, team size, plan, and
        tenure, then interview a sample of current and churned accounts.
      relatedQuestionRefs:
        - "QU003"
      relatedTableRefs:
        - "TU003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-retention"
      missingEvidence: >-
        NRR, GRR, logo churn, renewal rates, contract duration, cohort survival, and
        expansion by subscription tier and customer segment.
      whyItMatters: >-
        Aggregate active-business and facilitated-sales figures cannot distinguish durable
        recurring adoption from replacement of churned small-business accounts.
      diligencePath: >-
        Obtain monthly cohort tables, a logo and revenue retention bridge, and paid-active
        definitions from management, then reconcile them to billing and payment records.
      relatedQuestionRefs:
        - "QU005"
    - type: "missing-source"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Customer, vertical, channel, and geographic concentration together with payment
        volume and subscription revenue distributions.
      whyItMatters: >-
        The current evidence does not show whether adoption and payment volume are
        diversified or dependent on a narrow customer or segment cohort.
      diligencePath: >-
        Request top-customer and top-segment concentration schedules with geography,
        channel, payment volume, subscription revenue, and year-over-year movement.
