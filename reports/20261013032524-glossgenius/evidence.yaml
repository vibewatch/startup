evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current executive roster, board membership, founder ownership, investor voting rights, and financing preferences.
    whyItMatters: >-
      Governance concentration and preference seniority determine decision control, key-person exposure, and
      common-equity outcomes.
    diligencePath: >-
      Request the current board list, fully diluted cap table, charter documents, investor rights agreements, and
      succession plan under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financial-performance
    missingEvidence: Audited revenue, ARR, gross margin, net retention, burn, runway, debt, and cash balance.
    whyItMatters: Reported revenue and funding cannot establish recurring revenue quality, capital efficiency, or liquidity.
    diligencePath: >-
      Review audited statements, monthly management accounts, cohort retention, payment-volume reconciliation, debt
      documents, and bank statements.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, outage, security-incident, and complaint records responsive to the assigned adverse
      query.
    whyItMatters: >-
      The absence of retained adverse-event results does not establish that no incidents, claims, or enforcement matters
      exist.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, attorney-general, privacy, and status-page checks and request the
      company's incident register.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: capitalization
    missingEvidence: >-
      Complete investor list, ownership percentages, secondaries, option pool, debt or credit facilities, and
      round-by-round dilution.
    whyItMatters: The public stakeholder map cannot quantify control, preference overhang, or fully diluted ownership.
    diligencePath: >-
      Reconcile the cap table to financing documents, transfer records, option grants, and any secondary-sale
      documentation.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Detailed cohort-level logo retention, gross payment volume churn, and net revenue retention segmented by solo
      practitioners versus multi-chair salon establishments.
    whyItMatters: >-
      Without segmented retention data, evaluating the long-term lifetime value and durability of bottom-up SMB adoption
      remains speculative.
    diligencePath: >-
      Request audited cohort retention curves, gross churn reports, and revenue expansion metrics by customer size
      during management diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing-discrepancy
    missingEvidence: >-
      Third-party audited breakdowns reconciling gross $50B beauty industry consumer spend with software-addressable
      subscription and processing revenue.
    whyItMatters: >-
      Broad consumer service spend figures overstate software TAM unless filtered by software take-rates and
      appointment-based vendor penetration.
    diligencePath: >-
      Commission or review vertical SaaS market research isolating POS software and payment processing TAM from gross
      salon services spend.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: enterprise-retention-metrics
    missingEvidence: >-
      Direct quantitative disclosure of net revenue retention and logo churn for salon customers scaling beyond ten
      service providers or adding secondary locations.
    whyItMatters: >-
      Assessing upmarket expansion durability requires verification that mature salons do not systematically churn to
      enterprise suites like Zenoti or Boulevard.
    diligencePath: >-
      Request customer cohort retention and account expansion data broken down by provider headcount in confidential
      management diligence.
    relatedQuestionRefs:
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: >-
      Audited gross merchandise volume (GMV) and software revenue breakdowns for privately held venture competitors
      including Boulevard, Mangomint, and Squire.
    whyItMatters: >-
      Market share comparisons rely on self-reported funding and employee proxies rather than verifiable transaction
      volume shares across the beauty vertical.
    diligencePath: >-
      Review industry payment processor market share benchmarks and merchant acquirer disclosures for salon vertical
      SaaS.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: margins
    missingEvidence: >-
      Audited GAAP income statement detailing subscription gross margins, net payment take rates, and customer
      acquisition costs.
    whyItMatters: >-
      Without segmented gross margins, an underwriter cannot isolate core software unit economics from pass-through
      payment processing.
    diligencePath: Request confidential management financial model and audited trailing 24-month income statements.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash on hand, monthly net cash burn, and runway under the expanded Genius AI organizational scope.
    whyItMatters: >-
      Determines whether recent capitalization provides self-sustaining runway or necessitates near-term equity
      refinancing.
    diligencePath: Review balance sheet cash equivalents, debt obligations, and monthly operating cash flow statements.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: developer-platform-apis
    missingEvidence: >-
      Public developer API documentation, public software development kits, or webhook specifications for third-party
      developer integrations.
    whyItMatters: >-
      Without public APIs, GlossGenius operates as a closed garden system, restricting custom enterprise integrations
      and partner ecosystem development.
    diligencePath: Request developer documentation, API partner agreements, and integration roadmaps under management diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: ai-technical-architecture
    missingEvidence: >-
      Technical whitepapers, model evaluation benchmarks, and architecture documentation demonstrating proprietary
      machine learning infrastructure behind the Genius AI rebrand.
    whyItMatters: >-
      Determines whether the 2026 AI rebrand represents defensible algorithmic IP or a marketing wrapper over
      commoditized third-party foundation model APIs.
    diligencePath: >-
      Inspect proprietary model weights, fine-tuning datasets, prompt orchestration pipelines, and AI engineering
      headcount in technical diligence.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A current, independently corroborated roster of named customers with deployment status, start date, product scope,
      and measurable outcomes.
    whyItMatters: >-
      Company-curated handles and a success-story headline do not establish the breadth, tenure, or representativeness
      of production adoption.
    diligencePath: >-
      Request a customer reference list stratified by vertical, team size, plan, and tenure, then interview a sample of
      current and churned accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract duration, cohort survival, and expansion by subscription tier and
      customer segment.
    whyItMatters: >-
      Aggregate active-business and facilitated-sales figures cannot distinguish durable recurring adoption from
      replacement of churned small-business accounts.
    diligencePath: >-
      Obtain monthly cohort tables, a logo and revenue retention bridge, and paid-active definitions from management,
      then reconcile them to billing and payment records.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer, vertical, channel, and geographic concentration together with payment volume and subscription revenue
      distributions.
    whyItMatters: >-
      The current evidence does not show whether adoption and payment volume are diversified or dependent on a narrow
      customer or segment cohort.
    diligencePath: >-
      Request top-customer and top-segment concentration schedules with geography, channel, payment volume, subscription
      revenue, and year-over-year movement.
  - type: missing-source
    severity: material
    topic: regulatory-legal-enforcement
    missingEvidence: >-
      Direct state medical licensing board audits, court docket filings, or CFPB payment dispute records evaluating
      GlossGenius compliance.
    whyItMatters: >-
      Without independent legal docket verification, compliance in medical aesthetics and payment disputes cannot be
      fully confirmed.
    diligencePath: >-
      Execute targeted searches of PACER federal court dockets, state medical board administrative actions, and state
      attorney general consumer complaint databases.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: cohort-churn-and-rebrand-impact
    missingEvidence: >-
      Granular logo churn and net revenue retention figures segmented between solo stylists and multi-practitioner
      medspas following the 2026 rebrand.
    whyItMatters: >-
      Rebrand disorientation and software workflow mismatch could impair expansion into clinical aesthetics without
      showing up in top-line revenue.
    diligencePath: Request cohort retention schedules by vertical and customer size during private investor data room diligence.
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited breakdown of software subscription ARR versus payments gross transaction volume and gross margin by
      revenue stream.
    whyItMatters: >-
      A business generating $200M in gross payments-heavy revenue has radically different gross profit and valuation
      dynamics than one generating $200M in pure software subscription revenue.
    diligencePath: >-
      Request GAAP audited income statements and contribution margin analysis by product line in virtual data room
      diligence.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Net revenue retention (NRR), gross logo retention, and merchant churn rates by customer vintage and operator tier
      (solo stylist vs multi-chair salon).
    whyItMatters: >-
      High churn among solo beauty practitioners could create an unsustainable customer acquisition treadmill that
      impairs long-term equity returns.
    diligencePath: >-
      Request cohort retention tables and customer acquisition cost (CAC) payback analysis during confirmatory
      diligence.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV002
