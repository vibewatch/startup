figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公司从 2016 年推出美容软件起步，经过嵌入式支付和机构融资，最终在 2026 年据报道重塑为 Genius AI。
    data:
      items:
        - date: '2016'
          label: 纽约启动
          detail: Danielle Cohen-Shohet 亲身遇到美容业务工作流问题后创办了 GlossGenius。
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: '2021-11-16'
          label: Series A
          detail: 公司完成由 Bessemer Venture Partners 领投的 $16.4 million 融资，报告的种子轮加 Series A 累计融资达到 $19 million。
          tone: positive
          claimRefs:
            - CO012
        - date: '2021-11-16'
          label: 支付规模
          detail: TechCrunch 报道累计 GMV 超过 $1 billion，业务客户达数万家。
          tone: positive
          claimRefs:
            - CO015
        - date: '2023-07-28'
          label: Series C
          detail: 由 L Catterton 领投的 $28 million 轮融资将 GlossGenius 估值定为 $510 million，报告的累计融资约达 $70 million。
          tone: positive
          claimRefs:
            - CO013
        - date: '2023-07-28'
          label: 品类拥挤警示
          detail: 独立报道指出预约流量高度集中，脱颖而出颇具挑战。
          tone: negative
          claimRefs:
