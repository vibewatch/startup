          tone: neutral
          claimRefs:
            - CO004
        - date: '2026-07-21'
          label: 独角兽估值
          detail: AI Weekly 和公司发布的 Fortune 新闻稿报告估值为 $1.15 billion。
          tone: positive
          claimRefs:
            - CO005
