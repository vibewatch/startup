  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与服务范围
        blocks:
          - type: paragraph
            body: >-
              美容、健康和个人护理企业管理软件市场过去一直分散在横向单点工具、通用收银机和纸质预约本之间。GlossGenius
              将可服务市场界定为依靠预约、需要管理客户关系、治疗排期和现场财务交易的服务从业者。纳入支出包括核心排班软件、自动客户提醒、移动读卡器硬件、支付处理费和多服务商专用分账管理；排除实体沙龙商业地产租赁、批量后吧台化妆品批发，以及需要专用医疗
              ERP 的医院级临床系统。平台用移动优先应用直接触达服务从业者，把传统沙龙 POS 与消费级客户互动工具连接起来，从而同时获取订阅收入和促成交易量的持续抽成。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 市场规模视角、TAM 估算与 TAM/SAM/SOM 金字塔
        blocks:
          - type: paragraph
            body: >-
              评估垂直沙龙软件市场，必须把广义消费者个人护理支出与可提取的软件及金融科技收入池区分开。公司管理层曾称美国整体美容和个人护理市场超过 $50
              billion，但这代表消费者在理发、染发、护肤、美甲和按摩上的总支出，而非软件采购预算。将宏观数字收窄到基于预约的服务交易，可得到约 $15 billion 的可数字化处理卡交易额
              SAM。就平台业务看，GlossGenius 已达到实质商业规模：125,000 家活跃企业每年促成估计 $7 billion GMV。订阅每月起价 $24，另收 2.6%
              固定交易费，公司据称已将这一规模转化为超过 $100 million ARR 及接近 $200 million 的年收入运行率，支撑其 2026 年中 $1.15 billion 的 Series D 估值。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM012
              - CM013
      - number: '2.3'
        title: 买方分层、工作流需求与预算归属
        blocks:
          - type: paragraph
            body: >-
              个人护理和健康服务买方按工作流复杂度与预算归属分为三层。第一层是单人摊位租户、套间租户，以及美容师、美甲师等独立专家；对这些个体经营者而言，从业者同时是软件买方、用户和预算负责人，既要避免向沙龙老板支付高额分成，也要减少行政杂务。第二层是传统多工位沙龙和工作室老板，负责薪资、员工排班权限、库存补货，以及向不同银行账户的摊位租户直接付款。第三层是新兴的医美诊所、物理治疗工作室和健康诊所，需要
              HIPAA 合规的客户入组表和同意追踪。单人经营者可通过应用商店快速采用移动应用，而多服务商沙龙和医美诊所要求更深的行政管控、多门店报表和专门合规配置。
            claimRefs:
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: 采用驱动、结构约束与证伪风险
        blocks:
          - type: paragraph
            body: >-
              美容健康垂直领域的采用历来由口碑推荐、社交媒体展示曝光和契合独立服务从业者的移动优先设计推动。采用一体化支付和预约方案的服务商称，相比现金或独立终端，预约复购率更高、爽约定金造成的收入损失更少、报税更顺畅。但市场扩张受显著结构约束：许多小企业主几十年依赖纸笔预约本，担心迁移客户记录会打乱日常运营或造成收入损失。进入医美诊所和临床治疗后，还要面对
              Mindbody、Boulevard 以及专业电子病历厂商等成熟竞争者。由于私有报告没有公开队列级客户留存、支付 GMV 流失或 NRR，单人经营者与多工位团队之间获客的持久性仍是关键尽调问题。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 嵌入式支付撬动垂直 SaaS 变现
            body: GlossGenius 展示了预约型行业的垂直软件如何以低摩擦 SaaS 套餐叠加刷卡交易费，从整体沙龙 GMV 中获取经济价值并释放扩张经济性。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM006
          - type: callout
            title: 扩张领域的采用惯性与竞争壁垒
            body: 有机口碑让公司能以资本高效方式服务单人美容从业者；但向多门店连锁和医美诊所上探，会迫使其面对 Mindbody、Boulevard 等根深蒂固的竞争者及更高的 HIPAA 合规成本。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分层
        blocks:
          - type: paragraph
            body: >-
              美容健康软件行业呈现二元竞争结构：垂直与横向替代方案高度分散 [CP003, CP004]。行业研究识别出超过 130 家活跃软件供应商，但搜索和预约需求高度集中，前五大市场领导者占线上预约流量的 76%
              [CP003, CP004]。GlossGenius 面向独立美容从业者、单人摊位租户和小型美容机构，在复杂传统套件服务不足的细分市场占据专门位置 [CP003, CP011]。直接的风险投资竞争者包括
              Booksy（融资 $169 million）、Fresha（融资 $100 million）及理发店专业服务商 Squire（融资 $140 million），前两者强调消费者发现型市场 [CP003,
              CP012, CP013]。市场高端则由 Zenoti（融资 $331 million）和 Boulevard（融资 $188
              million）等成熟企业套件主导多门店水疗网络，单人软件与复杂企业管理系统之间分层清晰 [CP003, CP012]。
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP012
      - number: '3.2'
        title: 功能能力、架构与技术取舍
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 在应用中整合超过 100 项原生能力，包括客户自助排班、自动确认、营销自动化、库存管理和医美诊所专用病历 [CP008,
              CP010]。不同于横向预约引擎，它支持摊位租户独立银行账户、可定制佣金结构，以及带照片标注的 SOAP 笔记 [CP010, CP011]。但独立技术评估也指出明显架构取舍 [CP007,
              CP008]：平台没有公开 API，沙龙无法自行把它接入 ERP、外部 POS 硬件或定制报表仓库 [CP007,
              CP008]。独立市场分析师还提到报表不够灵活、软件偶有故障，说明移动优先的简洁性会给需要定制分析输出的运营者带来功能摩擦 [CP008, CP014]。
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: 定价结构、金融科技经济性与切换成本
        blocks:
          - type: paragraph
            body: >-
              定价透明是 GlossGenius 相比传统竞争者的主要商业差异之一 [CP001, CP005, CP006]。公司对所有交易收取透明的 2.6% 固定支付处理费，不另收卡存档扣款、移动 Tap to Pay
              或手动录入费用 [CP001, CP006]。Vagaro、Square 则以逐用户加价、更高的卡存档费或自动复购交易附加费抵消表面软件价格 [CP005, CP006]。Fresha 对首次客户预约采用 20%
              佣金的市场抽成模式，而 GlossGenius 的 Standard 至 Platinum 套餐为每月 $24 至 $148 的可预测订阅 [CP001,
              CP005]。针对纸笔记录或传统软件形成的高切换惯性，公司提供免费人工数据迁移和管家式上线服务，化解主要采用障碍 [CP009]。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
      - number: '3.4'
        title: 差异化持久性与长期护城河
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 已形成商业势头，Series B 融资 $25 million、Series C 融资 $28 million，用于扩展美容健康产品
              [CP002]。其核心护城河是工作流集中、高客户参与和专为独立从业者设计的金融科技经济性 [CP002, CP011]。不同于 Fresha、Booksy 等面向消费者的预约目录，GlossGenius 以白标
              商业一体机模式保护沙龙品牌，而不是切断客户关系 [CP011, CP013]。但长期防御力承受两方面结构压力 [CP008, CP012]：Zenoti、Boulevard
              等企业专家拥有更强资产负债表和多单元治理控制，GlossGenius 难以留住扩大的沙龙连锁 [CP008, CP012]；Square
              等横向平台又能以更低订阅费争夺价格敏感的单人经营者，公司必须持续创新垂直功能来证明软件费合理 [CP002, CP008, CP011]。
            claimRefs:
              - CP002
              - CP008
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 透明固定费率的金融科技打包
            body: GlossGenius 对卡存档或 Tap to Pay 交易收取固定 2.6% 且不加价，相比 Square、Vagaro 在客户留存工作流上不断加费，单位利润更可预测。
            calloutType: strength
            claimRefs:
              - CP001
