        - 按当前 $1.15B 的公开报价不投入新资金；继续跟踪运营披露。
      - - 信心等级
        - 中
        - 公开数据确认由 Lux Capital 领投的 $44M Series D 融资和历史资本效率，但详细 GAAP 财务数据及队列留存仍属非公开信息。
