            tableRef: TI003
            claimRefs:
              - CI001
              - CI006
              - CI011
              - CI012
      - number: '4.4'
        title: 资本充足性、估值与尽调结论
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 经多轮融资积累了大量股权资本，最终在 2026 年中以 Genius AI 名义完成据报道 $44 million Series D，估值 $1.15 billion [CI010,
              CI013]。此前机构轮披露股权融资 $72.2 million，投资人包括 Bessemer Venture Partners 及知名垂直 SaaS 天使 [CI013, CI014]。尽管年交易处理量超过
              $4 billion，当前准确 GAAP 收入、净利润率和运营现金消耗仍是未公开的私有数据 [CI006, CI012]。从投资判断看，支付驱动的扩张引擎已证明对单人美容创业者有效，但独立评估仍需经审计确认混合净
              抽成率、队列毛利率走势和资本消耗率 [CI011, CI012]。
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
