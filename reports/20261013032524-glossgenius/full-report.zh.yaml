        title: 展示项
        blocks:
          - type: callout
            title: 低抽成率支付量造成的毛利率压缩
            body: >-
              交易促成构成 GlossGenius 总处理规模的重要部分，支付交换费转嫁费会结构性限制混合毛利率，使其低于纯 SaaS 企业 [CI006, CI011]。Gold 档 0%
              平台处理费以支付利润换订阅留存，也让财务表现更集中于订阅客户的持久性 [CI003, CI011]。
