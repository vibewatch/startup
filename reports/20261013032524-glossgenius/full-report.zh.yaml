              融资记录从 2021 年 $16.4 million Series A、2023 年 $28 million Series C，发展到据报道于 2026 年完成的 $44 million Series
              D。Series C 当时据报道估值 $510 million，累计融资约 $70 million。加上后续轮次，可推算披露累计融资约 $114
