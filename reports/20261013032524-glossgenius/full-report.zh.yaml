      - number: '4.2'
        title: 市场进入经济性与客户获取
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 采用自下而上、产品驱动的获客引擎，历史上依靠高有机口碑和面向客户的病毒式触点 [CI008]。不同于需要自上而下直销团队的企业沙龙平台，它没有庞大地推成本就扩大到超过 100,000
              名活跃服务创业者 [CI006, CI008]。病毒式客户预约页、定制店铺网站和随附硬件进一步放大获客效率；免费品牌移动读卡器降低单人经营者采用门槛 [CI003, CI009]。但随着近期 Genius AI
              重塑品牌并上探多员工机构、医美诊所和诊所，获客成本及上线支持投入预计会高于纯自助式单人客户 [CI005, CI010]。
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: 单位经济与毛利率驱动因素
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 的成本结构分为交易量对应的支付交换费、网络处理成本，以及云原生软件托管和支持开销 [CI001, CI006]。交易费占毛现金收入很大比例，因此扣除通常为 1.5% 至 2.0%
              的网络交换费和 Stripe Connect 基础设施成本后，实际抽成率显著低于表面 GMV [CI003, CI006]。选择 Gold 0% 平台费的高交易量商户会进一步压缩支付毛利率，使订阅 SaaS
              留存成为维持混合毛利率的关键 [CI003, CI011]。尽调显示，软件毛利率通常超过 75%，但支付转嫁成本和硬件补贴会结构性压低混合毛利率 [CI011, CI012]。
            claimRefs:
              - CI001
              - CI003
              - CI006
              - CI011
              - CI012
