chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Danielle Cohen-Shohet 于 2016 年创办这家纽约公司，此前经营化妆艺术副业并参与数字收据 POS
              项目。产品逐渐发展为美容和健康企业的垂直运营软件，整合预约、客户管理、支付、营销、报表、库存、薪资等工作流。商业化明显是混合模式：核心美容健康套餐按年计费，每月列价 $24、$48 和 $148，刷卡处理费宣传为
              2.6%。官网还展示医美诊所套餐和多门店功能，说明业务已超出单人沙龙。历史来源称公司位于纽约，但现有证据没有更新其当前法定总部。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO011
