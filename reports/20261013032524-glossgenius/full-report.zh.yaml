  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 将美容与健康支出分层，从行业总支出逐级拆解至可服务的可寻址软件和支付收入。
    approximationNotes: 基于公司披露的 GMV 年化规模、行业市场边界和标准抽成率假设估算。
    claimRefs:
      - CM004
      - CM006
      - CM012
      - CM013
    data:
      items:
        - label: 美容与健康行业总支出
          value: 50
          unit: $B
          detail: 管理层提及的总市场规模，涵盖美国美容和个人护理消费者总支出。
          tone: neutral
        - label: 可服务的可寻址市场（SAM）
          value: 15
          unit: $B
          detail: 现代垂直软件可以触达的预约制个人护理、水疗、工作室和沙龙交易。
          tone: neutral
        - label: 促成的商品交易总额（GMV）
          value: 7
          unit: $B
          detail: 活跃沙龙和工作室经平台促成的年化交易量。
          tone: positive
        - label: 可服务的可获得市场（SOM）
          value: 2.5
          unit: $B
          detail: 独立经营者和医疗美容机构近期可触达的沙龙支付及订阅支出。
          tone: positive
        - label: 平台年度收入空间
          value: 0.2
          unit: $B
          detail: 报告称来自软件订阅和 2.6% 支付处理的收入运行率接近 $200M。
          tone: opportunity
        - label: 当前核心 ARR 基准
          value: 0.1
          unit: $B
          detail: Forbes 报道经确认的经常性收入基础已超过 $100M ARR 门槛。
          tone: opportunity
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按工作流专业化程度和团队规模展示美容与健康软件供应商的相对定位。
    data:
      points:
        - label: GlossGenius
          x: 4.5
          'y': 9
          detail: 个体经营者 / SMB 易用性高，具备专业美容工作流和固定费率金融科技
        - label: Square Appointments
          x: 2.5
          'y': 7.5
          detail: 覆盖面广的横向小企业工具，提供通用预约功能
        - label: Vagaro
          x: 5
          'y': 6.5
          detail: 面向中小型沙龙的中端功能密度，并配有消费者目录
        - label: Booksy
          x: 4
          'y': 7
          detail: 由市场驱动的排期网络，支持移动预约
        - label: Boulevard
          x: 8
          'y': 5
          detail: 面向前台人员密集型高端场所定制的高端沙龙工作流平台
        - label: Zenoti
          x: 9.5
          'y': 3
          detail: 面向企业多中心水疗机构和诊所的 ERP，治理控制完善
        - label: Mangomint
          x: 7
          'y': 6
          detail: 面向成长中沙龙和日间水疗团队的现代直观精品管理工具
    approximationNotes: 序数定位坐标按 1-10 分评分，依据为能力深度对比、移动端优化和目标团队规模细分。
    claimRefs:
      - CP003
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: GlossGenius 交易收入与利润率桥接
    type: waterfall
    summary: 用示例经济模型展示交易总额如何逐步转化为软件收入和净抽成。
    data:
      items:
        - label: 客户交易总额 GMV
          value: 100
        - label: 客户向商户付款
          value: -97.4
        - label: 交易总手续费（2.6%）
          value: 2.6
        - label: 网络交换费与处理成本
          value: -1.7
        - label: 支付净利润率
          value: 0.9
        - label: 平均软件订阅费
          value: 1.5
        - label: 平台综合毛贡献
          value: 2.4
    approximationNotes: 示例百分比桥接基于标准 2.6% 处理费和 $100 服务账单上通常 1.7% 的交换成本。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构概览，展示客户互动界面、专有工作流编排、支付通道和智能模块之间的分层。
    data:
      layers:
        - label: 客户触点与预约层
          description: 无需下载应用或创建密码的移动 Web 客户门户
          modules:
            - 定制预约网站构建器
            - 自动发送 SMS / 电子邮件预约确认
            - Google Maps 和 Search 直接预约集成
        - label: 前台工作流引擎
          description: 日历管理、排期规则和客户队列优化
          modules:
            - 带有重复预约和空档时间控制的日历引擎
            - 客户候补名单自动化
            - 自动结账再次预约提示
        - label: 后台管理与库存
          description: 多门店运营、薪资计算和供应管理
          modules:
            - 多门店合并报告
            - 工位租户直接分账出款
            - GeniusShop 自动库存同步
        - label: 金融科技与 POS 处理管线
          description: 全渠道支付处理硬件和网关集成
          modules:
            - 定制非接触式、芯片和刷卡读卡器
            - 固定 2.6% 交易处理费结构
            - 由 Stripe 支持的支付网关和结算通道
        - label: 合规与垂直健康控制
          description: 面向临床健康服务的专门文档和数据安全
          modules:
            - 符合 HIPAA 的治疗记录和 SOAP 病历记录
            - 数字接诊表和责任豁免书
            - 医疗总监（MD）治疗签字工作流
        - label: Genius AI 与智能层
          description: 分析型 copilot 和对话式营销自动化
          modules:
            - AI Growth Analyst 对话式业务报告
            - 生成式电子邮件和 SMS 营销文案创作
            - 在客户收据中自动加入评价提示
    approximationNotes: 架构层反映技术拆解和创始人访谈披露的功能服务边界，而不是物理微服务边界。
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE010
      - CE012
      - CE013
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 产品描绘了从获取个体经营者，到重复客户工作流，再到团队或门店扩张的概念路径，但不代表已测得转化率。
    data:
      items:
        - label: 发现
          actor: 个体服务专业人士
          action: Evaluates an all-in-one booking and payments workflow
          touchpoints:
            - 官方垂直页面
            - 免费试用
        - label: 设置
          actor: 经营者
          action: Imports client and appointment information and configures booking
          touchpoints:
            - 数据传输
            - 预订网站
        - label: 运营
          actor: 企业主与员工
          action: Runs scheduling, client records, payments, and communications
          touchpoints:
            - 日历
            - 客户档案
            - 销售点
        - label: 再次预订
          actor: 企业与终端客户
          action: Uses reminders and checkout prompts to encourage repeat visits
          touchpoints:
            - 自动提醒
            - 再次预订提示
        - label: 添加团队成员
          actor: 所有者或经理
          action: Adds staff controls and operating workflows
          touchpoints:
            - 员工权限
            - 团队排班
        - label: 增加地点或垂直领域
          actor: 多地点或邻近医疗领域的运营者
          action: Uses shared customer and reporting infrastructure across a broader operation
          touchpoints:
            - 统一客户列表
            - 地点报告
    approximationNotes: 这是基于已披露能力整理的概念性流程；公开信息没有报告各阶段转化率、耗时、队列留存或产品带来的因果影响。
    claimRefs:
      - CU009
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 通过可能性和剩余影响两个维度，映射 GlossGenius 运营、监管和商业层面的关键风险。
    claimRefs:
      - CR013
      - CR014
    data:
      columns:
        - 可能性：低
        - 可能性：中
        - 可能性：高
      rows:
        - label: 监管与医疗合规（HIPAA / Medspa）
          values:
            - label: 常规审计发现
              tone: low
              detail: 标准合规核查，仅存在轻微文档缺口
            - label: 州医疗委员会审查
              tone: warning
              detail: 围绕临床美容记录和 MD 监督流程的审查
            - label: HIPAA 不合规与执法
              tone: critical
              detail: 如果医美水疗机构的患者记录违反健康隐私标准，可能面临重罚或运营中止
        - label: 核心商户留存与品牌重塑迷失
          values:
            - label: 暂时性品牌混淆
              tone: low
              detail: 通过常规营销沟通解决的暂时命名摩擦
            - label: 前台 AI 附加功能的价格阻力
              tone: warning
              detail: 对价格敏感的单人执业者可能抵触每月 $50 的费用
            - label: 品牌重塑迷失与 Logo 频繁更换
              tone: risk
              detail: 转向企业级 AI 并进行公司品牌重塑，令核心单人美容运营者感到疏离
        - label: 垂直领域扩张的工作流错配
          values:
            - label: 预约格式的小缺口
              tone: low
              detail: 沙龙与健康诊所之间存在轻微的排班定制差异
            - label: 竞争性既有厂商根深蒂固
              tone: warning
              detail: 面对 Boulevard、Mindbody 等根基稳固的 EHR，切换成本很高
            - label: 临床工作流摩擦与流失
              tone: risk
              detail: 将沙龙工作流适配到医美水疗机构和物理治疗场景时摩擦很大
        - label: 销售点硬件与处理可靠性
          values:
            - label: 单点终端蓝牙故障
              tone: low
              detail: 偶发的本地配对失败，重启设备即可解决
            - label: 工作站读卡器硬件故障
              tone: warning
              detail: 高峰期终端故障时，可用移动应用手动录入缓解
            - label: 支付促成结算中断
              tone: risk
              detail: 支付网关宕机，导致工作站结账和商户现金流受阻
        - label: 自动取消费与拒付
          values:
            - label: 标准客户取消摩擦
              tone: low
              detail: 客户偶尔会对标准订金政策提出争议
            - label: 自动爽约费争议
              tone: warning
              detail: 客户争议已留存信用卡收取的费用，导致支付卡拒付
            - label: 商户拒付率升高
              tone: risk
              detail: 拒付量触发处理商罚款和准备金冻结
        - label: 第三方发现渠道与平台依赖
          values:
            - label: App Store 审核周转延迟
              tone: low
              detail: 移动应用商店更新的常规审核延迟
            - label: GeniusShop 供应物流积压
              tone: neutral
              detail: 零售补货延迟，可由多供应商专业用品替代方案缓解
            - label: Reserve with Google 集成中断
              tone: warning
              detail: 算法降权或 API 弃用，导致客户发现预约的能力下降
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将运营规模、估值定价、不利风险因素与最终投资建议串联起来的决策路径。
    data:
      nodes:
        - id: scale-assessment
          label: 1. 运营规模
          description: 覆盖美国 ZIP code 的 125,000 家活跃企业，收入运行率接近 $200M
        - id: capital-structure
          label: 2. 融资背景
          description: 2026 年 7 月完成 $44M D 轮融资，估值为 $1.15B，由 Lux Capital 领投
        - id: multiple-evaluation
          label: 3. 估值倍数
          description: 隐含的收入运行率倍数为 ~5.8x，相较上市垂直 SaaS 估值偏高
        - id: adverse-checks
          label: 4. 不利风险评估
          description: 独立分析对未经审计的 ARR、尚未证实的 AI 智能体以及激烈的既有厂商竞争持怀疑态度
        - id: downside-protection
          label: 5. 下行情景分析
          description: 基准情景估值为 $945M，意味着相较当前私募市场投后估值可能下行 18%
        - id: recommendation-decision
          label: 6. 投资决策
          description: 采取观察立场；在经审计的单位经济模型和 NRR 得到验证前，暂缓投入资本
    approximationNotes: 这些流程阶段把量化融资参数和定性风险指标合并为一套严谨的尽调决策树。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV012
