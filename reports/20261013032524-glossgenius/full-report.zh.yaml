  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 以两根支柱变现：经常性软件订阅费和按交易量计费的支付处理 [CI001, CI002]。核心 SaaS 分为两档：面向单人经营者的 Standard，每月
              $24（按年计费）；面向更高交易量服务商的 Gold，每月 $48 [CI002, CI003]。支付变现以银行卡交易 2.6% 固定处理费为基础，包含卡存档、移动 Tap to Pay 和手动录入，不另收附加费
              [CI001, CI004]。Gold 高交易量商户还可选择 0% 平台处理费，仅支付卡网络底层交换费；这强化平台锁定，同时把变现完全转向 SaaS 费 [CI003, CI005]。其他收入包括 Stripe
              Capital 融资，以及与 Affirm、Afterpay、Klarna 集成的 BNPL [CI006, CI007]。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
