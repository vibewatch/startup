      - number: '1.4'
        title: 品牌重塑、扩张与待解尽调
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月报道称，GlossGenius 将公司对外名称改为 Genius AI，并进入医美诊所、物理治疗师、健身企业、脊椎按摩师和按摩服务商的 HIPAA
              合规工作流。扩张扩大了可服务的工作流范围，也提高了执行负担：医疗相邻场景需要合规能力，并面对成熟的垂直软件竞争者。独立报道早在 2023 年就称预约是拥挤赛道，而 2026 年分析未披露客户流失
              数字，也未详细说明 AI 产品的日常表现。指定的监管、宕机、泄露和投诉检索没有找到可用的不利事件结果，因此本章将其记录为证据缺口，而不是把沉默解读为记录清白。
            claimRefs:
              - CO004
              - CO009
              - CO016
