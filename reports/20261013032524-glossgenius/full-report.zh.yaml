        - 等待倍数重估，或等经验证收入显著突破 $200M 后再入场。
    notes: 评估依据为 2026 年 7 月 Series D 条款（$1.15B 估值）、报告的运营规模和垂直 SaaS 可比指标；信心受限于缺少经审计的 SEC 文件。
