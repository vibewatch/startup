      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              在现有证据中，创始人兼 CEO Danielle Cohen-Shohet 始终是公开确认的领导者。她的经历横跨 Goldman
              Sachs、化妆艺术和早期数字收据项目，既接触金融服务，也熟悉产品要解决的运营工作流。独立的 2023 年报道还确认其双胞胎姐妹 Leah Cohen-Shohet
              为联合创始人。这说明创始人与市场契合度较高，但不能证明当前完整的高管名单、Leah 的运营职责、董事会席位或投资人控制权。管理层深度、继任安排和治理文件经直接审阅前，公开叙事过度集中于
              Danielle，构成关键人物尽调风险。
