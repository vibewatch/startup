  - id: TV002
    title: 正论 / 反论表
    columns:
      - 支柱
      - 正论
      - 反论
      - 哪些事实会改变判断
    rows:
      - - 核心工作流 SaaS
        - GlossGenius 已凭借移动优先预约、客户管理和低自然流失，在 125,000 名美容专业人士中建立深度工作流黏性。
        - 个体从业者和造型师的业务结构性死亡率高，会压低生命周期价值并推高客户 logo 流失率。
        - 经验证的净收入留存率高于 115%，以及按成立批次划分的年化 logo 留存数据。
      - - 嵌入式金融科技
        - 混合收入模式通过 2.6% 固定处理费和资本垫款实现交易变现，单客户收入高于纯软件模式。
        - 支付处理收入的毛利率（30-40%）低于纯 SaaS（75%+），因此表面收入倍数具有误导性。
        - 经审计的毛利率披露证明综合毛利率超过 65%。
      - - AI 与 TAM 扩张
        - 重塑为 Genius AI 并推出自主 agent，可将可服务市场从美容拓展到医疗美容机构、物理治疗等医疗邻近诊所。
        - Boulevard 等企业级、医疗级在位者及专业 EHR 拥有更强的合规护城河和防御性客户关系。
        - 非美容市场份额增长，以及客户采用自主 AI agent 产品层级的证据。
      - - 估值倍数
        - 2026 年 7 月的 $1.15B 融资体现高端定位，背后有顶级投资方 Lux Capital 和 Bessemer Venture Partners 支持。
        - 公开垂直 SaaS 可比公司按收入 3.5x 至 5.0x 交易，流动性事件中，私募价格面临严重下轮融资风险。
        - 增长率加速至同比超过 40%，同时实现 GAAP 口径运营盈利。
    notes: 正论反映报告的平台规模和软件—支付混合模式；反论纳入独立分析中的不利评论及垂直市场竞争态势。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 隐含倍数
      - 目标估值
      - 下行触发因素与概率
    rows:
      - - 乐观情景
        - 年收入加速超过 $250M，Genius AI 智能体成功推出；综合毛利率扩大至 70% 以上；NRR 超过 120%。
        - 7.0x ARR
        - $1,750M
        - 概率 20%。由医疗美容和医疗邻近垂直领域的突破性采用触发。
      - - 基准情景
        - 核心美容板块保持 15-20% 的稳定增长，收入达到 $210M；支付业务仍占收入的 60%；抽成率稳定在 2.6%。
        - 4.5x ARR
        - $945M
        - 概率 55%。渗透率逐步提升，但被 SMB 美容商户流失抵消。
      - - 悲观情景
        - 在 Mindbody 和 Fresha 的激烈竞争下，增长放缓至 10% 以下；重塑品牌使商户困惑；倍数压缩。
        - 2.5x ARR
        - $450M
        - 概率 25%。由宏观消费支出收缩和平台流失触发。
    notes: 预测以 2026 年中报告的 $200M 收入运行率为基准；倍数以公开 SMB 垂直软件可比公司为基准；估值代表投后股权价值。
