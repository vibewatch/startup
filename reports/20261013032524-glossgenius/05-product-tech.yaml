  - - Client Management & CRM
    - Aestheticians, stylists, and booth renters
    - Mature production deployment
    - Automated rebooking prompts at checkout achieving 75%+ rebooking rate
    - Client profile portability constrained to manual CSV export formats
  - - Medspa Clinical Suite
    - Medical spas, wellness clinics, and injectors
    - Recent production rollout
    - HIPAA-compliant charting, digital intake forms, SOAP notes, and MD sign-off
    - Unverified third-party audit of end-to-end protected health information isolation
  - - Genius AI Assistant Suite
    - Multi-service salon owners and managers
    - Early production / emerging rollout
    - Generative SMS/email marketing copy and AI Growth Analyst business reporting
    - Proprietary model architecture undisclosed; operates as wrapper over commercial LLMs
  notes: Module status verified against official product listings and third-party software evaluations; differentiation vectors
    and technical dependencies reflect comparative platform teardowns.
