- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Legacy Workflow
  - GlossGenius Solution
  - Measurable Benefit
  - Technical / Workflow Limitation
  rows:
  - - Client Appointment Booking
    - Phone calls, manual text messaging, paper appointment books
    - Custom mobile-responsive booking website requiring no client app download or password
    - Instant 24/7 self-service scheduling with automated SMS confirmations
    - Google booking integration requires higher-tier Gold subscription ($48/month)
  - - Service Checkout & Payments
    - External card terminals, separate cash transactions, manual tip math
    - Integrated card reader with flat 2.6% processing and automated tip calculations
    - Company claims teams using Payments earn 65% more revenue than cash/separate processors
    - Hardware tied to mobile app bluetooth pairing; no standalone offline cellular terminal
  - - Booth Renter Compensation
    - Owner manually calculates weekly cuts and writes physical paper checks
    - Automated booth renter payout splitting directly to independent bank accounts
    - Eliminates administrative reconciliation overhead under a unified booking interface
    - Complex multi-tier commission structures require top-tier Platinum plan ($148/month)
  - - Retail Product Management
    - Manual inventory counts and disconnected wholesale product ordering
    - GeniusShop automated inventory synchronization with point-of-sale barcode scanning
    - Purchases automatically upload into inventory counts and expense logs
    - Catalog constrained to GeniusShop partner brands without custom supplier EDI integration
  - - Clinical Treatment Charting
    - Paper intake binders and fragmented digital medical record software
    - Integrated HIPAA-compliant intake forms, photo markup, and medical director approvals
    - Consolidates clinical documentation directly with scheduling and payment records
    - No native integration with hospital electronic health record systems or health insurance billing
  notes: Legacy benchmarks and workflow improvements compiled from operator feedback and software reviews; financial and transaction
    benefits reflect company-reported statistics.
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE007
  - CE010
- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Architecture Layer
  - Platform Role
  - Technical Implementation
  - External Dependency
  - Systemic Risk / Bottleneck
  rows:
  - - Client Interface Layer
    - Cross-platform user interaction
    - Native iOS and Android mobile applications paired with responsive web booking portal
    - Apple App Store and Google Play distribution channels
    - App Store review delays or fee policy changes impacting mobile distribution
  - - Business Logic & Workflow Engine
    - Centralized operational orchestration
    - Proprietary in-house back-office microservices managing calendar, CRM, and inventory
    - Cloud hosting infrastructure and transactional SMS/email delivery providers
    - Carrier-level SMS filtering and delivery degradation for marketing and reminders
  - - Payment Processing & Hardware
    - Transaction execution and settlement
    - Custom contactless, chip, and swipe card readers integrated via mobile SDK
    - Stripe payment gateway rails and terminal firmware partners
    - Payment gateway outage or merchant account risk holds halting client checkouts
  - - Supply Chain Integration
    - Retail product restocking and inventory
    - Direct API integration between GeniusShop retail commerce engine and inventory ledger
    - GeniusShop fulfillment partners and wholesale distributor inventories
    - Supply chain stockouts and delivery delays impacting salon retail revenues
  - - Healthcare Compliance Layer
    - Protected health information storage
    - Encrypted document storage, audit logging, and role-based access for HIPAA records
    - HIPAA-compliant cloud storage containers and compliance auditing services
    - Regulatory scrutiny and breach liability exposure under HIPAA enforcement rules
  notes: Architecture components and dependencies derived from founder disclosures, software teardowns, and compliance documentation;
    proprietary backend services remain unaudited.
