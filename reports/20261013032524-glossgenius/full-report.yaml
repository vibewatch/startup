              - CU014
      - number: '6.4'
        title: Named Proof, Reference Quality, and Customer Risk
        blocks:
          - type: paragraph
            body: >-
              Named-customer evidence is mostly company curated. The esthetician page promotes a success-story headline
              in which Jaylee's Beauty Lounge scaled two locations and grew revenue 600%, but the retained page does not
              provide the measurement period, baseline, contribution of GlossGenius, or independent confirmation. The
              same page lists individual creator handles and follower counts, which establishes promotional association
              rather than production tenure or retained revenue. Independent review evidence is broader but mixed:
              Capterra reports strong booking and mobile ratings while also noting occasional app glitches and the need
              to use desktop for some advanced tasks. Portrait Care raises medspa-specific compliance concerns, but it
              is a competitor and therefore adverse positioning rather than an independent benchmark. Concentration by
              customer, channel, vertical, and geography remains undisclosed.
