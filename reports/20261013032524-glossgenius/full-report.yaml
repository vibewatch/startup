              tone: low
              detail: Standard compliance verification with minor documentation gaps
            - label: State Medical Board Scrutiny
              tone: warning
              detail: Scrutiny over clinical aesthetic charting and MD oversight workflows
            - label: HIPAA Non-Compliance & Enforcement
              tone: critical
              detail: Severe fines or operational halt if medspa patient charting breaches health privacy standards
        - label: Core Merchant Retention & Rebrand Disorientation
          values:
            - label: Transient Brand Confusion
              tone: low
              detail: Temporary naming friction resolved through standard marketing communication
            - label: Reception AI Add-On Price Resistance
              tone: warning
              detail: Friction around $50 monthly fee among price-sensitive solo practitioners
            - label: Rebrand Disorientation & Logo Churn
              tone: risk
              detail: Core solo beauty operators alienated by pivot to enterprise AI and corporate rebrand
        - label: Vertical Expansion Workflow Mismatch
          values:
