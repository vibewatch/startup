            title: Scale is better evidenced than durability
            body: >-
              The 125,000-active-business report, $7 billion in facilitated annual sales, and external review volume
              support real adoption. They do not reveal NRR, GRR, logo churn, customer concentration, cohort survival,
              or how many businesses are paid and actively transacting.
