chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Danielle Cohen-Shohet launched the New York-based company in 2016 after operating a makeup-artistry side
              business and working on a digital-receipts point-of-sale venture. The product developed into vertical
              operating software for beauty and wellness businesses, combining booking, client management, payments,
              marketing, reporting, inventory, payroll, and related workflows. Monetization is visibly hybrid: current
              annual-billed subscriptions are listed at $24, $48, and $148 per month for the core beauty-and-wellness
              tiers, while card processing is advertised at 2.6%. The official site also shows medspa plans and
              multi-location functionality, signaling movement beyond solo salon operators. Historical sources call the
              company New York-based, but the assigned evidence does not refresh its current legal headquarters.
