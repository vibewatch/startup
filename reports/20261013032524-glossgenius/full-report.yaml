      - number: '6.2'
        title: Adoption Scale and Usage Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest current scale disclosure is AI Weekly's July 2026 report that the company had 125,000 active
              businesses and facilitated $7 billion in annual sales. GlossGenius's esthetician page separately displays
              a lower-bound claim of more than 100,000 businesses; the two figures are compatible, but neither source
              defines activity, paid-account status, transaction frequency, or the reporting period behind the count.
              Capterra provides another adoption signal through 349 reviews and large feature-rating samples: Online
              Booking received 4.8 from 158 raters and Mobile Access received 4.8 from 170. Those review counts show
              meaningful product usage, but they are not a representative customer census and cannot be converted into
              market penetration or retention without a disclosed sampling frame.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
