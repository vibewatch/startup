  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: >-
      Six-layer architectural overview illustrating the separation between client engagement surfaces, proprietary
      workflow orchestration, payment rails, and intelligence modules.
    data:
      layers:
        - label: Client Touchpoint & Booking Layer
          description: Mobile web client portal requiring no app download or password creation
          modules:
            - Custom booking website builder
            - Automated SMS/email appointment confirmations
            - Google Maps and Search direct booking integration
        - label: Front-of-House Workflow Engine
          description: Calendar management, scheduling rules, and client queue optimization
          modules:
            - Calendar engine with double-booking and gap-time controls
            - Client waitlist automation
            - Automated checkout rebooking prompts
        - label: Back-Office Administration & Inventory
          description: Multi-location operations, payroll calculation, and supply management
          modules:
            - Multi-location consolidated reporting
            - Booth renter direct payout splitting
            - GeniusShop automated inventory synchronization
        - label: Fintech & POS Processing Pipeline
          description: Omnichannel payment processing hardware and gateway integration
          modules:
            - Custom contactless, chip, and swipe card readers
            - Flat 2.6% transaction processing fee structure
            - Stripe-backed payment gateway and settlement rails
        - label: Compliance & Vertical Health Controls
          description: Specialized documentation and data security for clinical wellness
          modules:
            - HIPAA-compliant treatment charting and SOAP notes
            - Digital intake forms and liability waivers
            - Medical director (MD) treatment sign-off workflows
        - label: Genius AI & Intelligence Layer
          description: Analytical copilots and conversational marketing automation
          modules:
            - AI Growth Analyst conversational business reporting
            - Generative email and SMS marketing copy creation
            - Automated review prompts in client receipts
    approximationNotes: >-
      Architectural layers reflect functional service boundaries disclosed in technical teardowns and founder interviews
      rather than physical microservice boundaries.
