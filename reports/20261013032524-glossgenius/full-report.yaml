              detail: Occasional client dispute over standard deposit policies
            - label: Automated No-Show Fee Contestation
              tone: warning
              detail: Disputed credit card on file fees causing payment card chargebacks
            - label: Elevated Merchant Chargeback Ratio
              tone: risk
