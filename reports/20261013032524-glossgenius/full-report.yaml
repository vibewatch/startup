  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Context
        blocks:
          - type: paragraph
            body: >-
              GlossGenius primarily serves owner-operated beauty and wellness businesses, then extends the same booking,
              payments, client-management, and administrative workflow into teams and multiple locations. Its official
              pages explicitly address estheticians and describe support for businesses of all sizes, while the current
              product overview says multi-location operators can use one client list, one booking site, and
              location-level reporting. AI Weekly also reports an expansion agenda that reaches medspas, physical
              therapists, fitness businesses, chiropractors, and massage therapists. That broadening increases the
              addressable customer set, but the public evidence does not quantify customer mix by vertical, team size,
              subscription tier, location count, or geography. As a result, the segment map is directional rather than a
              revenue-weighted view of the installed base.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
