              tone: low
              detail: Small scheduling customization differences between salon and wellness clinics
            - label: Competitive Incumbent Entrenchment
              tone: warning
              detail: High switching costs against entrenched EHRs like Boulevard and Mindbody
            - label: Clinical Workflow Friction & Churn
              tone: risk
              detail: High friction when adapting salon workflow to medical spas and physical therapy
        - label: Point-of-Sale Hardware & Processing Reliability
          values:
            - label: Isolated Terminal Bluetooth Glitch
              tone: low
              detail: Occasional local pairing failure resolved by device reboot
            - label: Station Card Reader Hardware Malfunction
              tone: warning
              detail: Terminal failure during peak hours mitigated by manual mobile app entry
            - label: Payment Facilitation Settlement Disruption
              tone: risk
              detail: Payment gateway outage disrupting station checkout and merchant cash flow
        - label: Automated Cancellation Fees & Chargebacks
