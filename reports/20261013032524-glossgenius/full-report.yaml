  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence & Drivers
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - >-
          SaaS scale is attractive ($200M reported run-rate), but private valuation of $1.15B leaves minimal margin of
          safety without audited churn and ARR metrics.
        - Do not write new capital at current $1.15B headline price; monitor operational disclosures.
      - - Confidence Level
        - Medium
        - >-
          Public data confirms $44M Series D funding led by Lux Capital and historical capital efficiency, but detailed
          GAAP financials and cohort retention remain private.
        - Require full virtual data room access before upgrading stance to Buy.
      - - Risk Rating
        - High
        - >-
          Downside risks include intense competitive pressure from Mindbody and Boulevard, execution hurdles in rebrand
          to Genius AI, and potential multiple compression.
        - Stress-test customer acquisition cost and payback periods across single-operator vs salon cohorts.
      - - Valuation Stance
        - Stretched
        - >-
          At $1.15B, implied multiple is ~5.8x reported run-rate, pricing in aggressive agentic AI adoption and
          successful TAM expansion into healthcare services.
        - Wait for multiple re-rating or substantial verified revenue inflection above $200M before entry.
    notes: >-
      Assessments derived from July 2026 Series D terms ($1.15B valuation), reported operational scale, and comparative
      vertical SaaS metrics; confidence reflects absence of audited SEC filings.
    claimRefs:
      - CV010
      - CV012
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Core Workflow SaaS
        - >-
          GlossGenius has built deep workflow stickiness across 125,000 beauty professionals with mobile-first booking,
          client management, and low organic churn.
        - >-
          Solo practitioners and stylists have high structural business mortality, capping lifetime value and driving
          high gross logo churn.
        - Verified net revenue retention above 115% and annualized logo retention data by vintage.
      - - Embedded Fintech
        - >-
          Hybrid revenue model monetizing transactions via 2.6% flat processing fee and capital advances generates
          superior revenue per customer versus pure software.
        - >-
          Payment processing revenue carries lower gross margins (30-40%) than pure SaaS (75%+), making headline revenue
          multiples misleading.
        - Audited gross margin disclosure demonstrating blended gross margins exceeding 65%.
      - - AI & TAM Expansion
        - >-
          Rebranding to Genius AI and launching autonomous agents expands the addressable market from beauty into
          healthcare-adjacent clinics like medspas and physical therapy.
        - >-
          Enterprise and medical-grade incumbents like Boulevard and specialized EHRs possess stronger compliance moats
          and defensive relationships.
        - Proof of non-beauty market share gains and customer adoption of autonomous AI agent tiers.
      - - Valuation Multiple
        - >-
          July 2026 round at $1.15B reflects premium tier status backed by top-tier sponsors Lux Capital and Bessemer
          Venture Partners.
        - >-
          Public vertical SaaS peers trade between 3.5x and 5.0x revenue, leaving the private price vulnerable to severe
          down-round risk in a liquidity event.
        - Acceleration of growth rate above 40% YoY alongside GAAP operating profitability.
    notes: >-
      Thesis arguments reflect reported platform scale and hybrid software-payments model; anti-thesis incorporates
      adverse commentary from independent analysis and vertical competitive dynamics.
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Implied Multiple
      - Target Valuation
      - Downside Triggers & Probability
    rows:
      - - Bull Case
        - >-
          Annual revenue accelerates past $250M with successful rollout of Genius AI agents; blended gross margin
          expands above 70%; NRR exceeds 120%.
        - 7.0x ARR
        - $1,750M
        - Probability 20%. Triggered by breakthrough adoption in medical spa and healthcare-adjacent verticals.
      - - Base Case
        - >-
          Revenue reaches $210M with steady 15-20% growth in core beauty segment; payments remain 60% of revenue;
          take-rate stable at 2.6%.
        - 4.5x ARR
        - $945M
        - Probability 55%. Triggered by gradual penetration offset by SMB beauty merchant attrition.
      - - Bear Case
        - >-
          Growth decelerates below 10% under intense competition from Mindbody and Fresha; rebrand causes merchant
          confusion; multiple compresses.
        - 2.5x ARR
        - $450M
        - Probability 25%. Triggered by macro consumer spending contraction and platform churn.
    notes: >-
      Projections assume $200M reported revenue run-rate baseline as of mid-2026; multiples benchmarked against public
      SMB vertical software peers; valuations represent post-money equity values.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV013
      - CV014
