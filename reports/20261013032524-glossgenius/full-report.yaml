              - CU007
              - CU012
      - number: '6.3'
        title: Durability and Expansion Mechanisms
        blocks:
          - type: paragraph
            body: >-
              GlossGenius's customer workflow is designed to create repeat use through booking, automated reminders,
              checkout, rebooking, client profiles, marketing, and multi-location administration. The company claims a
              75% or higher rebooking rate from automated prompts and separately advertises 40 hours saved per month on
              administration. These are useful hypotheses for customer value, not independently verified cohort
              outcomes: the pages provide no denominator, observation window, control group, or methodology. The move
              from an individual operator into a team or multi-location account is a plausible land-and-expand path
              because the platform adds staff controls and consolidated reporting. Public sources nevertheless omit NRR,
              GRR, logo churn, contract length, renewal rates, tier migration, and cohort survival, preventing a direct
              assessment of subscription durability.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU014
