      - number: '5.2'
        title: Modular Architecture and Operating Stack
        blocks:
          - type: paragraph
            body: >-
              The GlossGenius platform is built upon a hybrid architecture that pairs proprietary in-house workflow
              services with specialized third-party infrastructure. Front-end client and operator interactions are
              delivered through native iOS and Android mobile applications alongside a web booking portal, ensuring high
              responsiveness on mobile devices. The back-office engine centralizes calendar management, client notes,
              transaction history, and inventory tracking in a unified data store. Point-of-sale hardware is fully
              embedded, featuring custom contactless, chip, and swipe card readers that synchronize directly with the
              mobile application via Bluetooth. While proprietary algorithms govern scheduling logic and client
              communication, payment processing and financial settlement execute over Stripe underlying payment rails.
              Furthermore, the platform integrates with GeniusShop, an integrated retail ordering marketplace that
              automatically synchronizes inventory stock counts and supply expense records into the operator back-office
              ledger upon order fulfillment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
