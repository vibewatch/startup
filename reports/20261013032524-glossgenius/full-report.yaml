            body: >-
              Founder and CEO Danielle Cohen-Shohet remains the consistently identified public leader across the
              assigned evidence. Her experience spans Goldman Sachs, makeup artistry, and an earlier digital-receipts
              venture, giving her direct exposure to both financial services and the operator workflow the product
              addresses. Independent 2023 coverage also identifies her twin sister Leah Cohen-Shohet as a co-founder.
              That establishes meaningful founder-market fit, but it does not establish a complete current executive
              roster, Leah's present operating remit, board membership, or investor control rights. The public narrative
