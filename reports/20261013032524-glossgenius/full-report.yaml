      - number: '1.4'
        title: Rebrand, Expansion, and Open Diligence
        blocks:
          - type: paragraph
            body: >-
              July 2026 reporting says GlossGenius changed its corporate-facing name to Genius AI while moving into
              HIPAA-compliant workflows for medspas, physical therapists, fitness businesses, chiropractors, and massage
              providers. The expansion increases the addressable workflow set, but it also changes the execution burden:
              healthcare-adjacent use cases require compliance capability and face established vertical software
