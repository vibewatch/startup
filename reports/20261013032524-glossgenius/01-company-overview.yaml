company:
  name: "GlossGenius"
chapter:
  number: 1
  title: "Company Overview"
  summary: "GlossGenius launched in New York in 2016 as a vertical software and embedded-payments platform for beauty and wellness businesses. July 2026 reporting says the company rebranded to Genius AI, raised a $44 million Series D led by Lux Capital at a $1.15 billion valuation, and reported 125,000 active businesses; those scale figures remain company-reported rather than audited."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >-
      Danielle Cohen-Shohet launched the New York-based company in 2016 after
      operating a makeup-artistry side business and working on a digital-receipts
      point-of-sale venture. The product developed into vertical operating
      software for beauty and wellness businesses, combining booking, client
      management, payments, marketing, reporting, inventory, payroll, and
      related workflows. Monetization is visibly hybrid: current annual-billed
      subscriptions are listed at $24, $48, and $148 per month for the core
      beauty-and-wellness tiers, while card processing is advertised at 2.6%.
      The official site also shows medspa plans and multi-location functionality,
      signaling movement beyond solo salon operators. Historical sources call
      the company New York-based, but the assigned evidence does not refresh its
      current legal headquarters.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
  - id: "founders-and-governance"
    title: "Founders, Leadership, and Governance"
    body: >-
      Founder and CEO Danielle Cohen-Shohet remains the consistently identified
      public leader across the assigned evidence. Her experience spans Goldman
      Sachs, makeup artistry, and an earlier digital-receipts venture, giving her
      direct exposure to both financial services and the operator workflow the
      product addresses. Independent 2023 coverage also identifies her twin
      sister Leah Cohen-Shohet as a co-founder. That establishes meaningful
      founder-market fit, but it does not establish a complete current executive
      roster, Leah's present operating remit, board membership, or investor
      control rights. The public narrative is therefore highly Danielle-centric,
      creating a key-person diligence issue until management depth, succession
      planning, and governance documents are reviewed directly.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO002"
  - id: "capital-and-scale"
    title: "Capital Formation and Reported Scale"
    body: >-
      The financing record shows a progression from a $16.4 million Series A in
      2021 to a $28 million Series C in 2023 and a reported $44 million Series D
      in 2026. The Series C was reported at a $510 million valuation with roughly
      $70 million raised in total at that point. Adding the later reported round
      implies approximately $114 million of disclosed cumulative funding, but
      that arithmetic is not a statement of cash available, runway, or net debt.
      July 2026 coverage attributes 125,000 active businesses, revenue nearing
      $200 million, a 400-person workforce, and $7 billion in facilitated annual
      sales to the company. These figures describe different denominators and
      should not be treated as audited revenue, ARR, or payment volume retained
      by Genius AI.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "rebrand-and-open-diligence"
    title: "Rebrand, Expansion, and Open Diligence"
    body: >-
      July 2026 reporting says GlossGenius changed its corporate-facing name to
      Genius AI while moving into HIPAA-compliant workflows for medspas,
      physical therapists, fitness businesses, chiropractors, and massage
      providers. The expansion increases the addressable workflow set, but it
      also changes the execution burden: healthcare-adjacent use cases require
      compliance capability and face established vertical software competitors.
      Independent coverage already described appointment booking as a crowded
      category in 2023, while the 2026 analysis found no disclosed churn figure
      or detailed account of the AI product's day-to-day behavior. No usable
      adverse-event result emerged from the assigned regulatory, outage, breach,
      and complaint query, so the chapter records that as an evidence gap rather
      than interpreting silence as proof of a clean record.
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO016"
