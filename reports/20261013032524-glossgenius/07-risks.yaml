    body: "An investment thesis predicated on GlossGenius scaling into a horizontal operating system across high-touch service verticals breaks under three measurable conditions: (1) formal HIPAA or state medical board enforcement actions in medspa deployments, (2) accelerating solo beauty merchant logo churn following the Genius AI rebrand, or (3) gross margin contraction driven by payment facilitation losses and hardware terminal subsidies."
