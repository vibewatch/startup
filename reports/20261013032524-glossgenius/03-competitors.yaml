    body: "GlossGenius's flat 2.6% payment processing rate with zero surcharges for card-on-file or Tap to Pay transactions provides superior unit margin predictability compared to competitors like Square and Vagaro, which levy escalating fees on client retention workflows."
    claimRefs:
      - "CP001"
      - "CP006"
  - calloutType: "risk"
    title: "Integration Barriers at the Multi-Location Frontier"
    body: "The lack of an open API and limited enterprise customization create an upmarket ceiling, exposing GlossGenius to displacement by Zenoti or Boulevard whenever successful salons expand into multi-location franchise operations."
