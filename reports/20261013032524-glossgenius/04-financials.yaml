callouts:
  - calloutType: "risk"
    title: "Gross Margin Compression from Low-Take Payment Volume"
    body: "Because transaction facilitation forms a substantial part of GlossGenius's gross processed scale, payment interchange pass-through fees structurally limit blended gross margins compared to pure-play SaaS businesses [CI006, CI011]. Furthermore, offering 0% platform processing on the Gold tier trades payment margin for software subscription retention, concentrating financial performance on subscriber durability [CI003, CI011]."
    claimRefs:
      - "CI003"
      - "CI006"
      - "CI011"

