evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: leadership
    missingEvidence: A current authoritative executive and board roster with effective dates.
    whyItMatters: Conflicting CEO records affect key-person and governance assessment.
    diligencePath: Request the current board-approved leadership roster, officer appointments, and organizational chart.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited financial statements, current valuation, cash balance, runway, revenue bridge, and cap table.
    whyItMatters: Funding totals do not establish present liquidity, ownership dilution, or valuation support.
    diligencePath: Obtain the latest investor data room financial package, capitalization table, and priced-round documents.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: customers
    missingEvidence: Complete customer and deployment list with site-level operating and commercial performance.
    whyItMatters: A project pipeline and one flagship reference cannot establish concentration or repeatability.
    diligencePath: Request site scorecards, contract archetypes, deployment status, and revenue contribution by customer.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: disclosure
    missingEvidence: Independent current reporting on leadership changes, financing terms, and operating setbacks.
    whyItMatters: The available pool contains disclosure conflicts but little direct adverse reporting.
    diligencePath: Commission legal, registry, and customer-reference checks covering the current refresh period.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: addressable-market
    missingEvidence: >-
      Eligible mine-site count, amenable primary-sulfide tonnes, compatible SX-EW capacity, recovery distributions,
      pricing, and expected contract value by site.
    whyItMatters: >-
      Without these denominators, global copper demand and resource shares cannot be converted into defensible Jetti
      TAM, SAM, SOM, or revenue capture.
    diligencePath: >-
      Request Jetti's site-screening database and pipeline by qualification stage, reconcile ore and infrastructure
      filters with operator technical reports, and model annual spend from executed contract terms.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-economics
    missingEvidence: >-
      Executed contract structures, catalyst pricing, performance-fee mechanics, customer budget owners, gross margins,
      and renewal or termination terms.
    whyItMatters: >-
      Public operating-cost and capital-intensity claims describe customer economics but do not establish Jetti's
      revenue pool, margins, or switching costs.
    diligencePath: >-
      Review a representative contract set and customer invoices, then interview finance, commercial leadership, and at
      least three mine counterparties.
  - type: missing-source
    severity: material
    topic: deployment-performance
    missingEvidence: >-
      Independent, current site-level recovery distributions and counterfactual production data across all commercial
      deployments.
    whyItMatters: >-
      A historical flagship result and company claims cannot establish repeatability across heterogeneous ores,
      climates, and operating practices.
    diligencePath: >-
      Obtain operator-signed monthly mass-balance data, control-versus-catalyst results, downtime records, and
      third-party metallurgical audits for every commercial site.
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable signed commercial terms for Jetti, Nuton, conventional processing, and internal-build alternatives,
      including royalties, performance fees, discounts, and customer-paid operating costs.
    whyItMatters: >-
      A capability comparison without realized economics cannot establish whether Jetti's low-capex positioning
      translates into superior customer value or defensible margins.
    diligencePath: >-
      Request anonymized contract archetypes, unit economics, performance guarantees, and realized customer pricing from
      management and at least two mine operators.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent, site-level recovery and uptime comparisons between Jetti, Nuton, and conventional processing across
      multiple ore bodies.
    whyItMatters: >-
      The current evidence is concentrated in company materials, competitor releases, and selected reporting, so it
      cannot separate repeatable advantage from favorable site selection.
    diligencePath: >-
      Obtain third-party technical reports, operator references, and standardized recovery distributions for deployments
      and trials.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
      A complete list of emerging primary-sulfide leaching entrants, university spinouts, and mine-owner internal
      programs active in 2026.
    whyItMatters: >-
      The public assigned pool supports identification of Nuton and major substitutes but may omit early-stage or
      private alternatives.
    diligencePath: >-
      Refresh the competitor scan using technical conference proceedings, patent landscaping, mine procurement records,
      and specialist mining databases.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: blocking
    topic: pricing
    missingEvidence: >-
      Executed customer contracts showing fee formula, price escalators, guarantees, remedies, and revenue-recognition
      treatment.
    whyItMatters: >-
      Without contract economics, customer production upside cannot be converted into Jetti revenue, gross margin, or
      cash-flow forecasts.
    diligencePath: Request anonymized contracts and reconcile invoice samples to site KPI reports and the general ledger.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, debt and lease obligations, restricted cash, committed capex, and runway
      forecast.
    whyItMatters: >-
      Historical funding raised is not cash available and does not establish whether deployment expansion requires
      another financing.
    diligencePath: Request the latest management accounts, cash forecast, debt schedule, and board-approved operating plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Site-level cost bridge separating Jetti personnel, catalyst, equipment, maintenance, plating, customer-borne
      costs, and overhead.
    whyItMatters: >-
      Company-reported capex and operating-cost proxies cannot be translated into contribution margin without
      denominator and allocation detail.
    diligencePath: >-
      Obtain a cohort of deployed-site P&Ls and validate metrics against production, dosage, labor, and maintenance
      records.
    relatedQuestionRefs:
