    claimRefs: [CP008, CP009, CP012, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Jetti's public positioning combines high integration fit with a specialized primary-sulfide focus, while Nuton has comparable technical scope and greater disclosed project-financing capacity.
    data:
      points:
        - label: Jetti Resources
          x: 8
          y: 8
          note: "Ordinal assessment from public evidence: existing-infrastructure integration and primary-sulfide specialization are repeatedly described; scale and economics remain partly company-claimed."
        - label: Nuton / Rio Tinto
          x: 6
          y: 9
          note: "Ordinal assessment from public competitor releases: primary-sulfide technology and staged project funding are evidenced, while site-level integration comparability is not fully disclosed."
        - label: Conventional processing
          x: 3
          y: 7
          note: "Ordinal assessment: mature supply chain and operating familiarity, but lower fit for the specific low-capex incremental-recovery use case."
        - label: New mine development
          x: 2
          y: 4
          note: "Ordinal assessment: can add large capacity but has lower deployment fit and longer permitting, capital, and construction exposure."
        - label: Internal build
          x: 5
          y: 5
          note: "Ordinal assessment: potentially strong site control, but public evidence does not establish specialist catalyst capability or repeatable deployment know-how."
        - label: Status quo / defer
          x: 1
          y: 2
          note: "Ordinal assessment: highest implementation simplicity but no incremental recovery benefit is evidenced."
      xAxis:
        label: "Fit with existing mine infrastructure (ordinal, 0–10)"
      yAxis:
        label: "Specialized primary-sulfide recovery capability (ordinal, 0–10)"
    approximationNotes: "Coordinates are analyst ordinal scores from the cited evidence, not measured market-share, recovery-rate, or pricing data; no benchmark threshold or ranking zone is implied."
    claimRefs: [CP005, CP006, CP012, CP014]
callouts:
  - calloutType: strength
    title: Integration is the clearest differentiation signal
    body: Jetti's public materials consistently emphasize using existing leach and SX-EW infrastructure, modular dosing, reversibility, and limited site modification; this can shorten adoption relative to capital-heavy alternatives, although independent customer scorecards are sparse.
    claimRefs: [CP005, CP006, CP010]
  - calloutType: risk
    title: A well-funded technology peer is visible
    body: >-
      Nuton is not merely a conceptual competitor: assigned competitor
      disclosures describe proprietary primary-sulfide leaching, milestone-funded
      work programs, feasibility and permitting activity, and potential joint
      ventures. Jetti's durability case must therefore be tested against Nuton's
      project funding and mine-owner access.
    claimRefs: [CP012, CP013, CP014]
