company:
  name: Jetti Resources
chapter:
  number: 3
  title: Competitors
  summary: Jetti competes in a technically specialized copper-leaching niche where the closest alternatives are proprietary primary-sulfide leaching platforms, conventional processing, and mine-level capital projects. Public evidence supports a deployment and integration advantage, but competitor recovery rates, realized pricing, and contract economics remain insufficiently disclosed for a definitive moat ranking.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Jetti's relevant market is not generic copper mining software or all copper
      extraction. It is the narrower job of increasing copper recovery from
      primary-sulfide, legacy-dump, or otherwise uneconomic ore at an existing
      mine. Jetti describes its catalyst as working within existing heap-leach
      and SX-EW infrastructure, while Kitco reports deployments at Capstone
      Copper, Freeport-McMoRan, and El Abra. That makes the direct set unusually
      small: proprietary leaching platforms such as Rio Tinto's Nuton are the
      clearest technology peers; conventional sulfide processing, new mine
      development, and mine-owner internal engineering are substitutes rather
      than like-for-like products. The buyer is therefore a mine operator
      weighing incremental production and mine-life extension against permitting,
      construction, commodity-price, and operating risks.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-commercial-comparison
    title: Capability, integration, and commercial comparison
    body: >-
      The public comparison favors low-disruption deployment over a complete
      proof of superior economics. Jetti's own operations page says its
      solution requires no new permits, process changes, or major capital
      investment, and its technology page describes tie-ins to existing
      raffinate, power, and water connections. Its competitor evidence shows a
      different commercial posture: Nuton-backed projects use staged option
      agreements, milestone funding, feasibility work, permitting, and potential
      joint ventures. Those structures can provide the mine owner with project
      funding and a path to scale, but they also imply longer technical and
      regulatory programs. Public sources do not disclose comparable Jetti,
      Nuton, or conventional-processing realized prices, take rates, or
      customer-level margins; the pricing comparison therefore marks those cells
      unknown rather than treating list-like cost claims as contract prices.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: durability-and-displacement
    title: Switching costs, moat durability, and displacement risk
    body: >-
      Jetti's possible moat rests on accumulated site testwork, operating
      know-how, catalyst formulation, and the ability to integrate with a
      customer's existing circuit without a flowsheet redesign. The company
      says its Jetti in a Box equipment was shaped by more than six years of
      operating experience and that its technology has been applied to hundreds
      of millions of tonnes of ore. A 2020 industry interview also relayed
      Jetti's claim that cathode production per irrigated area at Pinto Valley
      doubled within one year; these remain company claims, not independent
      benchmarks. Switching is nevertheless not frictionless: site-specific
      ore qualification, column or reactor testing, operator approval, and
      performance KPIs create implementation knowledge that may favor an
      incumbent deployment. The same evidence shows displacement risk. Rio
      Tinto's Nuton is a well-capitalized alternative with proprietary
      technologies and the ability to fund multi-year work programs, while
      conventional processing remains the default where ore, permits, and
      economics support it. The durable differentiator is therefore deployment
      speed and reversibility, not publicly proven superiority on every recovery
      or cost metric.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015, CP016]
    figureRefs: [FP001]
