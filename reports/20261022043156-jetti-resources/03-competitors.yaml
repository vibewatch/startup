      - [Nuton / Rio Tinto, "No comparable public per-pound or per-tonne customer price in assigned sources", "Option and earn-in structures with milestone funding; possible joint venture", "Technology, engineering, project funding, and development support", "Funding capacity can compete with Jetti even without a published price"]
      - [Conventional processing, "No single comparable price; site-specific capital and operating budgets required", "Owner-funded project or engineering/procurement contracts", "Established processing route and supply chain", "May win when ore and permitting economics favor scale over speed"]
      - [Internal mine-owner build, "No public standalone price; engineering and opportunity cost are site-specific", "Internal capital project, potentially with external technology suppliers", "Control over integration and operating decisions", "Can pressure vendor pricing where internal technical capability is strong"]
