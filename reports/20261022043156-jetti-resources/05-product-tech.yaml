company:
  name: Jetti Resources
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Jetti's product combines catalyst chemistry, containerized dosing equipment,
    staged ore qualification, and process telemetry to fit existing heap-leach
    and SX-EW operations. The public evidence explains the operating model in
    unusual detail, but commercial performance, permitting, and reliability
    remain supported mainly by Jetti-issued material rather than current,
    mine-by-mine independent evidence.
sections:
  - id: product-and-customer-workflow
    title: Product definition and customer workflow
    body: >-
      Jetti sells an operating intervention for copper producers rather than a
      stand-alone mine or replacement processing plant. Its stated mechanism is
      to keep chalcopyrite leaching active by addressing passivation, then use
      the mine's existing heap, raffinate, bioleach, solvent-extraction, and
      electrowinning circuit to produce cathode. The current delivery model
      combines site diagnosis and ore qualification with proprietary catalyst,
      a containerized Jetti in a Box dosing unit, implementation support, and
      KPI monitoring. This is attractive where a mine already has usable
      leaching and SX-EW infrastructure, but it also makes value realization
      dependent on ore amenability, site hydraulics, instrumentation, and the
      operator's existing plant condition rather than catalyst chemistry alone.
    claimRefs: [CE001, CE002, CE003, CE016]
    tableRefs: [TE002]
  - id: architecture-and-maturity
    title: Architecture, modules, and maturity
    body: >-
      The public product stack is more developed than a single chemical
      formulation. Jetti describes a staged ladder from reactor tests to
      controlled column work, an optional industrial trial, and commercial
      deployment; its Rosetta digital twin is intended to forecast catalyzed
      and control recovery trajectories before full-scale operation. Jetti also
      says its catalyst has operated commercially at Pinto Valley since 2019,
      while a 2021 release reported five active pilots and three opportunities
      moving toward commercial status. Those dated pipeline numbers are useful
      maturity evidence, not a current roadmap. The company further says the
      system works on run-of-mine ore and both heap and dump leaches, but the
      available pool does not provide a current independently audited deployment
      roster or recovery distribution across sites.
    claimRefs: [CE004, CE006, CE007, CE008, CE014, CE015]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: operating-dependencies-and-controls
    title: Operating dependencies, reliability, and controls
    body: >-
      Jetti presents biocompatibility, reversibility, SX-EW compatibility, and
      continuous KPI monitoring as design controls. Its technical page reports
      no detrimental effect on extraction or cathode quality and cites an
      operating site's A-grade cathode record, but no laboratory names, reports,
      test protocols, or site-level datasets are included in the fetched text.
      Independent practitioner guidance reinforces the underlying operational
      challenge: ore variability, permeability, reagent distribution, sensor
      drift, temperature, and solution inventory can all change leach outcomes.
      Jetti's statement that no additional permits are required should therefore
      be treated as a site-specific diligence item, not a universal regulatory
      conclusion. Reliability underwriting needs mine-level baselines, controls,
      excursion logs, catalyst handling requirements, and independent cathode
      quality records.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: differentiation-and-diligence-verdict
    title: Differentiation and diligence verdict
    body: >-
      The strongest visible differentiation is the integrated combination of
      catalyst chemistry, a removable dosing module, a data-gated qualification
      process, and operation inside installed heap-leach and SX-EW assets.
      However, sulphide-leaching innovation is not unique to Jetti: CoTec
      reported that Ceibo commissioned a 2025 demonstration facility and
      produced first copper cathodes under mine conditions. Jetti's advantage
      must therefore be tested on recovery uplift, repeatability, installed
      capital, reagent economics, commissioning time, and contractual risk
      allocation rather than on category novelty. Public practitioner or
      developer signal is also thin: the assigned recruiting proxy listed no
      active public remote roles, which neither disproves technical depth nor
      substitutes for engineering talks, publications, repository activity, or
      named operator testimony.
    claimRefs: [CE005, CE013]
tables:
  - id: TE001
    title: Product module and maturity matrix
    columns: [Module or asset, Primary user, Public maturity signal, Differentiation, Diligence gap]
    rows:
      - [Catalyst chemistry, Mine metallurgist, "Company says commercially proven on multiple large stockpiles", "Targets chalcopyrite passivation within existing leach circuits", "Obtain composition controls, dose-response data, and independent recovery distributions"]
      - [Jetti in a Box, Site operations team, "Containerized equipment described from six years of operating experience", "Removable standardized dosing with limited tie-ins", "Review uptime, maintenance history, spares, and installation acceptance tests"]
      - [Rosetta digital twin, Technical evaluation team, "Company says trained on more than ten years of column testwork", "Produces catalyst and control trajectories with P20-P80 bands", "Validate holdout performance, calibration drift, and customer access to model outputs"]
      - [Qualification ladder, Project sponsor and metallurgist, "Reactor, duplicate-column, optional trial, and commercial stages described", "Sequential data gates before full deployment", "Request conversion rates, stop criteria, and failed-test population"]
      - [Commercial deployment base, Mine operator, "Pinto Valley operation since 2019; 2021 pipeline disclosed", "Uses existing heap, raffinate, and SX-EW assets", "Refresh the site roster, production status, and mine-by-mine KPI attainment"]
    notes: "Status signals are company-issued unless stated; pipeline counts are historical and not a current deployment inventory."
    claimRefs: [CE003, CE004, CE006, CE007, CE014, CE015]
  - id: TE002
    title: Evaluation-to-production workflow
    columns: [User job, Current workflow, Jetti intervention, Measurable output, Limitation]
    rows:
      - [Screen an ore body, "Mineralogy and site diagnosis", "Site questionnaire and ore qualification", "Go or no-go recommendation", "Company states most recommendations arrive within 12 weeks; external service-level evidence is absent"]
      - [Establish uplift, "Bench and column leach testing", "Matched control and catalyzed tests", "Recovery trajectories and monitored chemistry", "Representativeness depends on sampled ore and simulated heap conditions"]
      - [De-risk field use, "Pilot or industrial trial", "Jetti in a Box dosing and agreed KPIs", "ORP, copper, catalyst concentration, and flow telemetry", "No pooled public reliability or failure-rate dataset"]
      - [Operate commercially, "Existing heap-leach and SX-EW circuit", "Catalyst dosing into raffinate with field support", "Higher copper in pregnant leach solution and cathode output", "Economics depend on site baseline, ore variability, dose, and existing plant performance"]
    notes: "Workflow is reconstructed from Jetti's current technical and operating pages; outputs are not independently benchmarked service levels."
    claimRefs: [CE001, CE002, CE007, CE008, CE016]
  - id: TE003
    title: Technology and operating architecture dependencies
    columns: [Layer or process, Role, Critical dependency, Principal risk]
    rows:
      - [Ore and heap, "Provide chalcopyrite-bearing feed and permeability", "Representative mineralogy, particle size, and irrigation", "Variability or channeling can reduce recovery"]
      - [Catalyst dosing, "Add catalyst to the raffinate stream", "Reliable pumps, flow control, water, power, and site connections", "Under- or overdosing can impair economics or control"]
      - [Bioleach circuit, "Regenerate oxidant and circulate solution", "Bacterial activity, temperature, pH, and ORP", "Seasonality or chemistry changes can alter kinetics"]
      - [Monitoring and telemetry, "Track agreed KPIs and process state", "Calibrated sensors and available communications", "Sensor drift or fragmented data can hide underperformance"]
      - [SX-EW and cathode, "Recover copper from pregnant solution", "Compatibility with organic phase, electrolyte, and plating", "Company-reported compatibility lacks disclosed independent reports"]
    notes: "Risk framing combines Jetti's stated architecture with independent practitioner guidance on leach-control failure modes."
    claimRefs: [CE009, CE010, CE012, CE013]
figures:
  - id: FE001
    title: Jetti product architecture from ore assessment to cathode
    type: stack
    summary: "The stack shows the product's ordered operating layers, not a claim that every site uses identical equipment or achieves identical recovery."
    data:
      layers:
        - label: Ore qualification
          items: ["Site questionnaire", "Reactor amenability tests"]
          outputs: ["Go or no-go recommendation"]
        - label: Heap simulation
          items: ["Matched control columns", "Site-representative raffinate and ore"]
          outputs: ["Catalyzed and control recovery trajectories"]
        - label: Digital decision support
          items: ["Rosetta ensemble model", "P20-P80 confidence band"]
          outputs: ["Site-specific business-case input"]
        - label: Catalyst delivery
          items: ["Jetti in a Box", "Raffinate, water, power, and sewage tie-ins"]
          outputs: ["Controlled catalyst dose"]
        - label: Heap operation and telemetry
          items: ["Existing irrigation system", "ORP, copper, iron, catalyst, and flow monitoring"]
          outputs: ["Copper-bearing pregnant leach solution"]
        - label: Existing SX-EW circuit
          items: ["Solvent extraction", "Electrowinning"]
          outputs: ["Copper cathode"]
    approximationNotes: "Conceptual ordering based on company-described modules; it is not a scale drawing or a site-specific flowsheet."
    claimRefs: [CE001, CE006, CE011]
callouts:
  - calloutType: strength
    title: Brownfield integration is the core product thesis
    body: >-
      Jetti is designed around installed heap-leach and SX-EW assets, which can
      reduce new-plant scope where site conditions and ore amenability are
      suitable.
    claimRefs: [CE002, CE003]
  - calloutType: risk
    title: Public proof is deep in mechanism but narrow in independent outcomes
    body: >-
      The available sources describe chemistry, testing, and controls in detail,
      yet current multi-site performance, reliability, permitting, and failed
      deployments remain undisclosed.
    claimRefs: [CE009, CE012, CE013, CE014]
