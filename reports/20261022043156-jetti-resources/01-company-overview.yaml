company:
  name: Jetti Resources
chapter:
  number: 1
  title: Company Overview
  summary: Jetti Resources is a Boulder-founded private mining-technology company whose catalyst and modular dosing equipment are designed to recover copper from low-grade primary sulfide ores using existing heap-leach and SX-EW infrastructure. Public evidence supports a 2014 founding, more than $100 million raised by 2021, commercial deployment at Pinto Valley, and a still-limited disclosure record for current valuation, revenue, cap table, and customer concentration.
sections:
  - id: identity-and-model
    title: Identity and business model
    body: "Jetti Resources is consistently identified as a private mining-technology company founded in 2014, with Boulder, Colorado as its location in the Tracxn profile and the company presenting itself as a technology provider to copper producers. Its core product is a proprietary catalyst paired with modular dosing equipment that fits into existing heap-leach and solvent-extraction/electrowinning infrastructure. The company describes a customer-centered “Integral Solutions” approach: diagnose the mine system, identify an opportunity, deploy the catalyst where appropriate, and measure value. This is a site-specific industrial deployment model rather than a standalone software subscription, so commercial proof depends on mine-level performance and operator adoption."
    claimRefs: [CO001, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, board, and key-person dependence
    body: The public record identifies Andrew Perlman as a co-founder and Mike Outwin as CEO and co-founder in funding coverage; a current-looking employer profile instead names John Slaven as CEO. That discrepancy is material and should not be silently resolved from a secondary profile. Independent industry coverage reports that former BHP CEO Chip Goodyear and former Xstrata CFO Trevor Reid joined the board and management team in 2021, indicating an effort to add large-miner and finance experience. Public evidence does not provide a complete current executive roster, board composition, ownership allocation, or governance-rights detail. Leadership continuity, succession coverage, and the current authority of named directors therefore remain diligence questions.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-and-scale
    title: Funding, scale, and disclosure
    body: Jetti announced a $50 million Series C financing in June 2021 from Mitsubishi Corporation, BHP Group, Freeport-McMoRan, Orion Resource Partners, and T. Rowe Price-related funds; Reuters reported that this brought total funds available for development and deployment to $100 million. Tracxn separately lists $100 million across four rounds and a Series D, but its displayed round values and valuation fields are obfuscated or not interpretable as usable financial metrics. The current pool does not establish a reliable current valuation, revenue run-rate, ARR, gross margin, cash balance, runway, or customer count. One Tracxn snapshot says 50 employees as of June 30, 2026, while an IPO-tracker page says approximately 100 employees; the discrepancy makes headcount a verification item, not a cover fact.
    claimRefs: [CO009, CO010, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Commercial milestones and unresolved diligence
    body: The evidence trail shows a progression from company formation and early testing to commercial deployment. Jetti says testing with Capstone began in late 2017, commercial facilities at Pinto Valley began construction in mid-2019, and the company continued operating there. By June 2021, industry coverage described 23 projects at various stages, including five active pilots and three transitioning to commercial status. The company also reports a limited-period operation at Freeport-McMoRan’s Bagdad mine. These milestones support technical and strategic traction, but they do not disclose site-by-site economics, contract terms, performance guarantees, customer concentration, or the conversion rate from pilots to durable commercial revenue. Those gaps constrain confidence in scale claims.
    claimRefs: [CO014, CO015, CO018]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Strategic investor validation
    body: The 2021 financing included major mining operators and specialist investors, while independent reporting described a 23-project pipeline and commercial proof at Pinto Valley.
    claimRefs: [CO009, CO014, CO018]
  - calloutType: risk
    title: Current scale is not triangulated
    body: Conflicting public headcount estimates and the absence of current audited financial, valuation, cap-table, and customer-concentration disclosure make present scale difficult to verify.
    claimRefs: [CO012, CO013, CO019, CO020]
