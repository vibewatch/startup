      - Payer or budget owner
      - Workflow
      - Adoption trigger
    rows:
      - ["Operating mine with heap or dump leach and SX-EW", "Mine owner or site operator", "Metallurgists and process engineers", "Operating site or corporate mining organization", "Ore screen, reactor tests, columns or industrial trial, then deployment", "Verified incremental recovery and acceptable site economics"]
      - ["Underused brownfield processing asset", "Mine leadership and asset management", "Operations managers and site engineers", "Sustaining-capital or operational-improvement budget", "Tie dosing unit into raffinate, power, and water and define KPIs", "More cathode from installed infrastructure without major flowsheet change"]
      - ["Greenfield or life-extension project", "Project developer or mine owner", "Technical-services and project teams", "Project capital sponsor", "Early ore qualification followed by site-specific engineering", "Avoided or deferred conventional processing capital, subject to permits"]
      - ["Ongoing commercial operation", "Mine operator", "Control-room operators, metallurgists, and Jetti field team", "Operating expenditure tied to production value", "Monitor ORP, copper, catalyst concentration, flow, and agreed KPIs", "Repeatable recovery uplift without downstream-quality impairment"]
    notes: >-
      Buyer and budget ownership are evidence-based inferences from the described mine workflow; public sources do not disclose Jetti contract signatories, internal cost centers, or pricing authority.
    claimRefs: [CM010, CM011, CM012, CM013, CM015]
figures:
  - id: FM001
    title: Copper opportunity bounds and the missing Jetti denominator
    type: pyramid
    summary: >-
      Non-additive evidence layers move from global demand pressure toward the site-qualified subset Jetti can plausibly address.
    data:
      items:
        - label: Global copper demand in 2050
          value: ">50"
          unit: Mt per year
          detail: BHP forecast, approximately 70% above its present-demand baseline.
        - label: New mined supply needed
          value: "~10"
          unit: Mtpa
          detail: BHP estimate for the next decade from September 2024.
        - label: Existing-mine output pressure
          value: "-15%"
          unit: 2035 versus current output
          detail: BHP estimate for mines operating at the time of its analysis.
        - label: Historical average-grade decline
          value: "~40%"
          unit: decline since 1991
          detail: BHP estimate indicating increasing ore-processing pressure.
        - label: Primary-sulfide resource relevance
          value: "~70%"
          unit: share of global copper resources
          detail: Jetti estimate repeated in a 2020 trade interview, not independently reconciled here.
        - label: Jetti-addressable SAM or SOM
          value: "Not disclosed"
          unit: eligible sites or annual spend
          detail: Requires amenable ore, compatible infrastructure, pricing, recovery, and conversion denominators.
    approximationNotes: >-
      This is an evidence ladder, not a value-proportional or additive TAM/SAM/SOM pyramid. Metrics retain different denominators and vintages; "~" and ">" reproduce publisher precision, and no conversion to company revenue is made.
    claimRefs: [CM003, CM004, CM006, CM007, CM008]
