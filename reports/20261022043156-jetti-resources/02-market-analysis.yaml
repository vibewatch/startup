slug: jetti-resources
runDate: 2026-10-22
company:
  name: Jetti Resources
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Jetti addresses a narrow brownfield copper-recovery market inside a much larger copper supply challenge:
    low-grade primary sulfides at mines with compatible leach and SX-EW infrastructure. Public evidence supports
    strong demand and grade-decline drivers, but it does not disclose the eligible site count, ore inventory, pricing,
    or conversion rates needed to calculate a defensible company-level SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Jetti's evidenced market is not global copper production or all mine development. It is the subset of low-grade
      primary sulfide material, particularly chalcopyrite, that a mine operator can route through heap or stockpile
      leaching and an existing SX-EW circuit. Included spend therefore centers on ore qualification, catalyst dosing,
      monitoring, and site deployment; greenfield mine construction, conventional concentrator and smelter capacity,
      and oxide ores already amenable to standard acid leaching are outside the core boundary. Adjacent budgets include
      process-control and metallurgical optimization, but these are enabling services rather than automatically
      addressable catalyst revenue. The status quo is to leave marginal material stranded, process suitable ore through
      conventional concentration and pyrometallurgy, or optimize existing leach circuits without Jetti. This definition
      keeps the opportunity tied to compatible ore and infrastructure rather than treating broad copper demand as TAM.
    claimRefs: [CM001, CM002, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      The top-down demand signal is substantial: BHP projects global copper demand to rise roughly 70% to more than
      50 Mt per year by 2050 and estimates that about 10 Mtpa of new mined supply will be needed over the next decade.
      The brownfield pressure is also visible in BHP's estimates that average mine grade has fallen about 40% since 1991
      and that existing mines could produce roughly 15% less copper in 2035 than today. Jetti and a 2020 trade interview
      use an approximately 70% share of global copper resources in primary sulfides as a technology-relevance indicator.
      None of these figures is a Jetti revenue TAM: they use different denominators and vintages, do not isolate amenable
      ore, and do not reveal sites with usable leach pads, SX-EW capacity, permits, or commercial willingness to adopt.
    claimRefs: [CM003, CM004, CM005, CM006, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The mine owner or operator is the likely contracting party and economic payer because value depends on incremental
      cathode output and mine-life extension at a specific operation. Metallurgists, process engineers, site engineers,
      and operations managers are the day-to-day users and technical gatekeepers; their budgets and incentives span
      metallurgy, processing, sustaining capital, and operational improvement rather than a single software-style line
      item. Jetti describes a data-gated adoption path beginning with ore samples and reactor qualification, moving
      through columns or an industrial trial, and ending in commercial deployment. Its stated go/no-go recommendation
      can arrive within 12 weeks, but reactor work is described separately as typically taking 12-16 weeks. Commercial
      timing therefore remains site-specific and depends on mineralogy, infrastructure, agreed KPIs, and operator risk appetite.
    claimRefs: [CM010, CM011, CM012, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Demand growth, declining ore grades, aging mines, and the cost and delay of greenfield supply all favor technologies
      that can recover more copper from installed assets. Jetti claims a low-capital deployment profile, including less
      than $1,500 per annual tonne of additional production and operating costs of $1.50 per pound including cathode
      plating, while a 2020 trade interview reported doubled cathode production per irrigated area at Pinto Valley.
      These are useful adoption signals, not independent fleet-wide economics. The counterweight is operational
      heterogeneity: Mipac identifies ore variability, reagent distribution, temperature, permeability, instrumentation,
      solution control, and environmental compliance as recurring leach constraints. BHP likewise expects sulfide-leach
      adoption to remain tailored to individual ore bodies and not become widespread until at least the mid-2030s.
      Valuation should therefore depend on verified site conversion, repeatable recovery distributions, contract economics,
      and eligible inventory—not solely on copper scarcity.
    claimRefs: [CM007, CM009, CM013, CM014]
callouts:
  - calloutType: insight
    title: Copper demand is context, not Jetti TAM
    body: >-
      The global copper-demand forecast bounds industry urgency, while Jetti's addressable opportunity is limited by
      ore amenability, installed leach and SX-EW infrastructure, site economics, and operator adoption.
    claimRefs: [CM001, CM002, CM003]
  - calloutType: risk
    title: Site qualification is the gating variable
    body: >-
      Published evidence does not convert the large primary-sulfide resource base into an eligible site count or
      recoverable-tonnage denominator, leaving company-level SAM and SOM unresolved.
    claimRefs: [CM007, CM011, CM012, CM013]
