company:
  name: Jetti Resources
chapter:
  number: 7
  title: Risks
  summary: 'Jetti''s principal risk is execution at mine sites: the public record supports commercial deployment and a reversible,
    infrastructure-compatible process, but does not disclose enough site-level performance, contract, financial, or legal
    detail to underwrite residual exposure confidently.'
sections:
- id: risk-ranking
  title: Risk ranking and thesis-break triggers
  body: The highest-consequence exposure is scale-up and repeatability across different ore bodies and mine circuits. Jetti
    reports commercial operation at Pinto Valley and limited commercial operation at Bagdad, while its technical materials
    describe a staged qualification pathway; that is meaningful evidence of a de-risking process, not proof that every prospective
    site will meet the same recovery or economics. The public materials also state that testing is used to determine ore fit
    before deployment. An investment thesis breaks if site qualification repeatedly fails, performance KPIs are missed, or
    operators require unplanned flowsheet changes, permits, capex, or remediation. Monitoring should therefore track site-by-site
    recovery uplift, reagent consumption, uptime, cathode quality, commissioning time, and the share of deployments meeting
    pre-agreed KPIs.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  figureRefs:
  - FR001
- id: legal-regulatory
  title: Regulatory, environmental, and IP exposure
  body: Jetti's official positioning says its dosing equipment needs raffinate, water, power, and sewage connections and does
    not require additional permitting or flowsheet changes. That lowers integration friction but is not a substitute for site-specific
    environmental, water, mine-plan, occupational-safety, or community approvals controlled by mine operators and local authorities.
    The independent 2020 trade interview describes lower water and emissions intensity relative to pyrometallurgy, while also
    describing the technology as a patented catalyst. Publicly available material in this pool does not establish patent scope,
    freedom to operate, litigation status, permit determinations, or whether environmental benefits persist across ore types
    and jurisdictions. The diligence path is to obtain the patent family and legal-status report, site permits and environmental
    reviews, incident history, and written responsibility allocations in each deployment contract.
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
- id: operations-dependencies
  title: Operational, quality, and partner dependencies
  body: The operating model depends on mine-specific infrastructure, ore mineralogy, operator cooperation, and stable connections
    to existing leach and SX-EW systems. Jetti's modular 'Jetti in a Box' is designed to reduce site complexity, and the company
    states that the catalyst is reversible and compatible with existing processing. Those claims reduce, but do not eliminate,
    commissioning, supply, maintenance, safety, and reliability risk. The business also relies on large mining partners to
    provide samples, operating access, data, and decisions about deployment. A partner can delay a trial or change mine plans
    even if Jetti's chemistry performs. The monitoring set should include deployment cycle time, uptime, catalyst availability,
    operator acceptance, quality rejections, and the number of active sites by counterparty. No public source in the assigned
    pool quantifies customer concentration, contract duration, guarantees, termination rights, or liability caps.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  tableRefs:
  - TR002
- id: financial-disclosure
  title: Financial model, disclosure, and diligence path
  body: 'The public evidence is stronger on technology description than on financial resilience. Jetti publishes indicative
    capital-intensity and operating-cost figures for additional production, but the assigned evidence does not provide audited
    revenue, gross margin, cash burn, liquidity, working capital, customer-level economics, debt, or contract backlog. A private-company
    profile and pre-IPO page add context but are not substitutes for company financial statements; the pre-IPO page is explicitly
    a documentation-led context page rather than a filing. This creates model risk: an apparently attractive mine-level cost
    profile may not translate into durable corporate cash generation after deployment costs, support costs, partner concessions,
    and financing needs. Before investment, request monthly cash and revenue bridges, deployment-level contribution margins,
    cap table and preference terms, covenant schedules, insurance, customer concentration, and downside liquidity scenarios.
    Treat any unverified valuation or revenue number as a gap rather than an input.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR003
