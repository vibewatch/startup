companyProfile:
  summary: >-
    Jetti Resources is a private mining-technology company founded in 2014 that develops a proprietary catalyst and
    modular dosing equipment for copper producers with existing heap-leach or related infrastructure. Its public record
    includes commercial deployment at Capstone's Pinto Valley mine, a limited commercial operation at Freeport-McMoRan's
    Bagdad mine, and strategic investment from major mining and financial investors. Public disclosure remains
    insufficient to verify current scale, leadership, financial performance, or customer concentration.
  founders:
    - name: Andrew Perlman
      role: Co-founder
      background: Public third-party profiles identify Perlman as a Jetti co-founder.
      claimRefs:
        - CO005
    - name: Mike Outwin
      role: CEO and co-founder in 2021 financing coverage
      background: Reuters and International Mining identified Outwin in that role in June 2021.
      claimRefs:
        - CO006
  foundingLocation: Boulder, Colorado
  headquarters: null
  productSummary: >-
    A proprietary catalyst and modular dosing equipment, including the company's Jetti in a Box deployment approach,
    intended to unlock copper from low-grade primary sulfide ores using existing heap-leach and
    solvent-extraction/electrowinning infrastructure.
  customerFocus: Copper producers operating existing heap-leach or related leach systems
  businessModel: >-
