  topStrengths:
    - Commercial deployment evidence at Pinto Valley with an independently reported production-intensity improvement.
    - Strategic investor and partner base that includes major mining operators and specialist capital.
    - Modular, infrastructure-compatible deployment model aimed at unlocking copper from existing assets.
  topRisks:
    - Current financial, liquidity, pricing, margin, and cap-table disclosure is insufficient for underwriting.
    - Site-specific technical performance may not generalize across ore bodies, circuits, and operators.
    - Customer concentration, contract durability, and pilot-to-commercial conversion are not disclosed.
  unresolvedGaps:
    - Audited financials, revenue bridges, gross-margin data, cash runway, debt, and working-capital visibility.
    - Customer contract archetypes, pricing mechanics, performance guarantees, and recourse terms.
    - Site-by-site deployment scorecards and recovery distributions beyond flagship references.
    - Current leadership, headquarters, customer concentration, and broader pipeline conversion data.
    - Cap table, dilution, preference-stack, governance-rights, and current financing evidence.
