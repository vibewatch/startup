company:
  name: Jetti Resources
chapter:
  number: 6
  title: Customers
  summary: >-
    Jetti's public customer evidence is strongest at the deployment and pilot level: Capstone's Pinto Valley
    provides the clearest operating proof, while Teck and a wider project pipeline indicate enterprise demand.
    Public materials do not disclose customer-level revenue, retention, contract, or concentration data, so
    adoption quality is more supportable than durability or economics.
sections:
  - id: buyer-segments-and-adoption-model
    title: Buyer segments and adoption model
    body: >-
      Jetti sells into copper producers that already operate heap-leach or dump-leach systems and have underused
      infrastructure, low-grade ore, or stranded material. The buyer is therefore an operating mine owner or
      producer, while the users and implementation stakeholders are site metallurgists, process engineers,
      operations teams, and corporate technical leaders. Jetti describes its commercial motion as beginning with
      understanding each customer's system, then diagnosing opportunities, supporting implementation, and
      measuring value. This is an enterprise, site-by-site land motion rather than a self-serve product. The
      public record supports a mix of strategic investors and mine operators, but it does not identify contract
      prices, payment mechanics, or the share of value captured by Jetti.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory-and-proof
    title: Adoption trajectory and proof
    body: >-
      Adoption evidence spans one commercially operating reference, a limited commercial operation, active pilots,
      and earlier testing programs. Capstone's Pinto Valley is the most concrete reference: the company and
      independent trade coverage describe a 2019 deployment and a doubling of cathode production per irrigated
      area during the first year of the partnership. Teck's evidence is earlier-stage because the disclosed plan
      was to trial the catalyst and move to commercial scale only after satisfactory results and approvals. Reuters
      reported 23 projects at different stages in 2021, including five active pilots and three opportunities
      transitioning to commercial status; this is a pipeline indicator, not a current customer count or conversion
      rate. Later public materials do not provide a refreshed site-by-site scorecard.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-customer-quality
    title: Named customer proof and reference quality
    body: >-
      Named references are strategically credible because they include large mining operators, but reference quality
      differs materially by stage and source. Pinto Valley is the strongest production reference because Jetti says
      the technology continues to operate there and independent coverage reports a measured production outcome.
      Freeport-McMoRan's Bagdad operation is described by Jetti as a limited commercial operation, which demonstrates
      deployment but not disclosed durability or economics. Teck is a named strategic customer and investor, yet
      the available evidence describes a trial rather than a completed commercial rollout. The public record also
      mentions El Abra as an expansion target, but the assigned sources do not establish a completed deployment or
      a customer-reported outcome there.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-expansion-and-gaps
    title: Retention, expansion, and concentration gaps
    body: >-
      The available evidence supports expansion intent but not retention metrics. Jetti and its coverage describe
      discussions to expand the Capstone partnership, and the company frames its offering around extending mine life
      and increasing production from existing assets. Those signals are qualitatively positive, but they do not
      establish renewal rates, net or gross revenue retention, contract duration, customer payback, or repeat
      deployments across a representative cohort. Customer concentration is also unquantified: the record names
      strategic mining relationships but does not disclose revenue by customer, site, geography, or partner channel.
      A diligence process should therefore request a customer-level deployment ledger, signed contract archetypes,
      realized-versus-promised production outcomes, renewal and termination history, and concentration by revenue
      and gross profit.
    claimRefs: [CU013, CU014]
    figureRefs: [FU001]
