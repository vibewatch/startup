      - [Freeport-McMoRan / Bagdad, Copper producer, Limited commercial operation described by Jetti, Limited commercial period, Demonstrates a named deployment beyond Pinto Valley, "Duration, outcome, and reason for ending are undisclosed", "SU004; SU006"]
    notes: "Enumeration is partial: these are the named deployments or customer-stage references available in the assigned pool, not a complete customer list. A named logo or investor relationship is not treated as proof of retention."
    enumerationScope:
      coverage: partial
      basis: "Publicly named mine relationships and deployment stages located in the assigned October 2026 refresh source pool."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from mine opportunity to expansion
    type: journey-map
    summary: Jetti's disclosed customer path moves from site diagnosis through technical validation, implementation, measured value, and possible expansion.
    data:
      items:
        - label: Diagnose
          detail: Understand the mine system, objectives, and operational constraints.
          touchpoints: ["Customer system review", "Opportunity identification"]
        - label: Validate
          detail: Test ore amenability and select the deployment location.
          touchpoints: ["Ore sample and laboratory testing", "Site and infrastructure assessment"]
        - label: Implement
          detail: Install and operate catalyst dosing within the existing leach workflow.
          touchpoints: ["Jetti in a Box or catalyst addition facility", "Operational support"]
        - label: Measure value
          detail: Track recovery and production outcomes against the site's objectives.
          touchpoints: ["Performance measurement", "Value capture"]
        - label: Expand
          detail: Consider additional sites, leach areas, or commercial scale after results.
          touchpoints: ["Additional deployments", "Partnership expansion"]
        - label: Renew / repeat
          detail: Confirm renewal, repeat deployment, and customer economics before treating expansion as durable.
          touchpoints: ["Renewal and termination history", "Cohort and concentration review"]
    claimRefs: [CU002, CU003, CU013]
callouts:
  - calloutType: strength
    title: The customer proof is operational, not merely logo-based
    body: Pinto Valley supplies a disclosed production outcome and a continuing commercial reference, while the broader pool includes pilots and named mine-operator relationships.
    claimRefs: [CU005, CU009]
  - calloutType: risk
    title: Durability and concentration remain unmeasured
    body: No assigned source provides customer-level revenue, renewal, churn, contract duration, realized margin, or a current deployment scorecard; the strongest evidence is therefore not sufficient to underwrite retention.
    claimRefs: [CU013, CU014]
