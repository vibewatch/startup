company:
  name: Jetti Resources
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strategically differentiated copper-leaching technology with commercial deployment evidence, but the latest disclosed $2.5B valuation is a stale October 2022 mark and cannot be underwritten confidently without current financials, contract economics, and cap-table terms. The appropriate posture is research-more, with entry discipline tied to verified cash generation and deployment conversion.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Jetti has a credible strategic value proposition: its catalyst is designed to unlock
      low-grade primary sulfide copper using existing heap-leach and SX-EW infrastructure,
      avoiding a new mine, major process redesign, or large plant build. The strongest proof
      is operational rather than promotional: the company reports that its Pinto Valley
      deployment doubled cathode production per irrigated area in one year, while the
      independent Mine article reports the same commercial deployment and describes the
      technical passivation problem. The anti-thesis is that these are site-specific
      outcomes and company-reported economics, not a disclosed portfolio-wide revenue,
      margin, or cash-flow record. The value case therefore depends on repeatable conversion
      from ore qualification to commercial contracts and on customers sharing enough
      economics to support the disclosed price.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-and-entry
    title: Price, financing context, and entry discipline
    body: >-
      The latest public financing reference is a $100M Series D in October 2022 at a $2.5B
      post-money valuation, with T. Rowe Price identified as lead and strategic mining
      investors listed among participants. SetterVC labels its funding and valuation data
      as estimates that may be incomplete, stale, erroneous, or revised; Multiples likewise
      presents the $2.5B figure as the last valuation. That makes $2.5B a reference mark,
      not a current transaction price or verified enterprise value. Multiples reports $169M
      of cumulative funding, while SetterVC reports $168.67M, but neither supplies audited
      revenue, EBITDA, cash, debt, preference rights, dilution, or secondary liquidity.
      A disciplined entry would require a current financing or secondary price plus
      contract-level revenue and margin evidence; absent that, a valuation multiple or
      target return would be false precision.
    claimRefs: [CV005, CV006, CV007, CV008]
  - id: scenarios-and-comparables
    title: Scenarios and comparable evidence
    body: >-
      The bull case assumes Jetti converts its demonstrated deployment model into multiple
      repeatable installations, captures performance-linked economics, and expands the
      addressable installed base of underused leach assets. The base case assumes continued
      technical relevance but slower site conversion and limited disclosure, leaving the
      October 2022 mark difficult to validate. The bear case is a down-round or impaired
      liquidity event if deployment results do not generalize, copper prices weaken, or
      customers retain most of the incremental value. Public comparable evidence is weak:
      Multiples lists a mixed set of private and public companies and unrelated revenue
      multiples, while CoTec's Ceibo page shows another sulphide-leaching technology
      reaching a demonstration facility in 2025. These are context, not directly
      comparable valuation benchmarks, because business models, stage, ownership, and
      revenue disclosure differ.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and thesis breaks
    body: >-
      The recommendation is research-more with low confidence in the price conclusion and
      high risk. Jetti's technology and strategic investor base support continued diligence,
      but the public record does not establish current valuation, recurring revenue, gross
      margin, customer concentration, or investor preference terms. Exit readiness is also
      unproven: Jetti is privately held, and the assigned evidence contains no verified IPO,
      tender-offer, or secondary-liquidity timetable. The thesis should be upgraded only
      after management provides a current cap table, financing terms, site-by-site
      deployment scorecards, contract pricing and guarantees, audited or reviewed financials,
      and cash runway. Thesis-break triggers include a material failure to meet agreed site
      KPIs, inability to convert qualified trials into paid deployments, a financing below
      the 2022 mark without offsetting operating progress, or evidence that customers can
      substitute competing leach solutions at materially lower cost.
    claimRefs: [CV013, CV014, CV015, CV016]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Commercial deployment evidence is positive, but current price and financial disclosure are not verified.", "Do not underwrite a buy without refreshed terms and financials."]
      - [Confidence, low, "The latest valuation mark is from October 2022 and public operating KPIs are incomplete.", "Treat the recommendation as provisional."]
      - [Risk rating, high, "Private-company opacity, deployment concentration, and unverified liquidity increase downside uncertainty.", "Require downside protections and milestone diligence."]
      - [Valuation stance, stretched, "$2.5B is the latest disclosed mark, while current revenue and margin are not public.", "Seek a material price discount or stronger proof."]
    notes: "Assessment is an analyst synthesis of the cited public evidence; no current transaction price, audited financials, or cap-table terms were available in the assigned sources."
    claimRefs: [CV005, CV007, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Technology unlocks stranded copper", "Official materials describe primary-sulfide leaching through existing heap and SX-EW infrastructure.", "Independent site-level recovery and cost data across several deployments."]
      - ["Commercial proof exists", "Mine reports the Pinto Valley deployment and Jetti reports commercial operation at the site.", "A site-by-site deployment ledger showing paid, repeatable outcomes."]
      - ["Strategic demand is plausible", "Jetti describes work with major copper producers and advanced testing programs.", "Signed contracts, backlog, conversion rates, and customer concentration."]
      - ["The price may be ahead of proof", "The last disclosed mark is $2.5B from October 2022 and is flagged as estimated/stale.", "Current financing, audited revenue, margins, and cap-table rights."]
    notes: "The table separates evidence-supported thesis points from conditions that would falsify or strengthen them; it does not treat company forecasts as independent verification."
    claimRefs: [CV001, CV002, CV005, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Multiple mine deployments convert from testing to paid operation; site KPIs are repeatable; contract economics are disclosed.", "A current valuation can be supported only if verified revenue growth and margins justify the entry multiple.", "Low-to-medium: commercial proof exists but portfolio-wide data is absent.", "Failure to scale beyond flagship deployments."]
      - [Base, "Technology remains relevant, but deployment cadence and customer economics remain opaque.", "Hold or wait; no defensible target return can be calculated from the public record.", "Medium: consistent with disclosed evidence and gaps.", "No current financing or operating disclosure after diligence."]
      - [Bear, "Trials fail to convert, customers capture most value, or copper-market weakness delays deployments.", "Down-round, dilution, or impaired private liquidity risk; downside cannot be quantified without terms.", "Medium: plausible but not established by the assigned evidence.", "Material KPI miss, down-round, or substitution by lower-cost alternatives."]
      - [Entry discipline, "Acquire only with current price, cap table, preferences, cash runway, and contract-level unit economics.", "Require a margin of safety against the stale $2.5B reference mark.", "High as a diligence requirement, not a forecast probability.", "Any refusal to provide decision-critical terms."]
    notes: "Scenarios are conditional analytical cases, not forecasts. Valuation ranges and target returns remain unavailable because current price, revenue, margins, dilution, and preference terms were not disclosed in the assigned evidence."
    claimRefs: [CV005, CV006, CV008, CV013, CV015, CV016]

