callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: The strategic case is credible, but public evidence does not support underwriting the current price or calculating a target return. Require refreshed financing terms and operating disclosure before entry.
    claimRefs: [CV005, CV013, CV014]
  - calloutType: risk
    title: The central risk is evidence quality
    body: The latest valuation is a two-year-old private financing mark, and public sources do not disclose the financial and cap-table terms needed to judge dilution, preferences, or cash runway.
    claimRefs: [CV007, CV008, CV015]

