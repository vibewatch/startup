company:
  name: Jetti Resources
chapter:
  number: 4
  title: Financials
  summary: Jetti's public evidence supports an asset-light, performance-oriented deployment model that monetizes incremental copper from existing mine infrastructure, but it does not disclose realized pricing, revenue recognition, gross margin, cash balance, or runway. The economic case is therefore strongest at the customer-asset level and remains underwritable only after contract, site, and company-finance diligence.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      Jetti's commercial proposition is tied to mine operators' incremental copper production rather than to a conventional software subscription. The company describes a catalyst, dosing equipment, technical diagnosis, implementation support, and performance measurement delivered alongside the customer's heap-leach operation. Its public materials say commercial KPIs are agreed with the site operator before deployment and govern the commercial relationship, which is consistent with a performance-linked or project-specific monetization structure, but no public source states the fee formula, whether consideration is a fixed service fee, a per-pound royalty, a share of incremental cash flow, or a hybrid. This distinction matters because list-style claims about low capital intensity and operating cost describe the deployment economics, not Jetti's recognized revenue or gross margin. Public deployment evidence is concrete: the El Abra announcement targeted more than 20 million pounds of incremental cathode production per year after ramp-up, while the older Pinto Valley account reported doubled cathode production per irrigated area. Neither source discloses Jetti's realized revenue from those sites.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The disclosed operating model appears designed to minimize customer-side retrofit cost: Jetti says its containerized dosing unit needs raffinate, water, power, and sewage connections, does not require flow-sheet changes or additional permitting, and can be removed without legacy effects. The company also reports less than $1,500 of capital intensity per annual tonne of additional production and $1.50 per pound of operating cost including cathode plating; these are company-issued figures and should not be treated as independently audited unit economics. The external mining-technology interview provides a compatible mechanism for the customer value proposition, stating that the technology can integrate with existing SX-EW infrastructure and requires limited capex. The main underwriting uncertainty is allocation: the public material does not say which costs Jetti bears versus the mine operator, how much field labor is recurring, or how costs scale across ore mineralogy, site geography, ramp-up, and catalyst dosage.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Jetti has demonstrated access to strategic capital, but the public record does not establish current cash adequacy. Reuters reported a $50 million financing in June 2021 and said the company then had $100 million for development and deployment; a contemporaneous mining-industry report described the transaction as Series C and said total capital raised exceeded $100 million. Those are historical financing disclosures, not a current cash balance, burn rate, runway, debt schedule, or evidence that the proceeds remain available in 2026. The same reporting described a 23-project pipeline, five active pilots, and three opportunities transitioning to commercial status, which indicates financing needs could rise with deployment scale. Jetti's financial verdict is therefore conditional: customer-level economics look potentially attractive when excess leach capacity exists, but revenue quality, margin conversion, working-capital needs, financing dependency, and concentration cannot be assessed from public disclosures. The highest-value diligence is a site-by-site revenue bridge and contract schedule linked to audited or management accounts.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Current value or status, Quality, Diligence ask]
    rows:
      - [Catalyst deployment, "Catalyst and dosing solution integrated into an existing leach operation", "Site / deployment", "Commercial deployments disclosed; realized Jetti revenue not disclosed", "Observed commercial model; company-issued", "Obtain contract archetypes, fee formula, invoicing milestones, and revenue-recognition policy"]
      - [Performance-linked operating relationship, "Site KPIs agreed before deployment and monitored during commercial operation", "Site KPI / production outcome", "KPIs described; payment linkage not disclosed", "Company-described mechanism", "Confirm whether consideration is fixed, per-pound, royalty, or shared-savings"]
      - [Technical diagnosis and implementation support, "Diagnosis, operational insight, implementation support, and value measurement", "Engagement / site", "Public service components described; mix and price not disclosed", "Company-described offering", "Separate recurring service revenue from deployment revenue and reimbursable costs"]
      - [Incremental copper enablement, "Customer produces additional cathode from low-grade or stockpile material", "Pounds of cathode", ">20 million lb/year target at El Abra after ramp-up", "Third-party/company announcement; target not realized revenue", "Reconcile target, ramp, attribution, customer acceptance, and Jetti consideration"]
    notes: "Sources mix company materials, a company-originated deployment announcement, and independent trade reporting; public figures are targets or operating metrics, not Jetti revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Price or contract term, List versus realized, Public evidence, Underwriting interpretation, Diligence ask]
    rows:
      - ["Not disclosed", "No public list price", "No fee or royalty schedule found in the assigned fetched sources", "Revenue per site cannot be modeled from public evidence", "Obtain executed contract samples and price escalators"]
      - ["Not disclosed", "No realized price", "Public sources describe customer value and production targets, not Jetti consideration", "Customer value is not equivalent to Jetti revenue", "Obtain billing ledger by site and reconcile to production"]
      - ["Performance KPIs agreed before deployment", "Commercial framework described, payment terms unknown", "Jetti says KPIs govern the commercial relationship", "Potential exposure to ramp and performance variability", "Review KPI definitions, remedies, guarantees, and recourse"]
      - ["Capital intensity < $1,500 per annual tonne; operating cost $1.50/lb", "Company-reported cost metrics, not customer price", "Jetti in a Box page reports both metrics", "Useful cost proxy but not gross margin or price realization", "Validate denominator, site scope, period, and independent cost support"]
    notes: "The table intentionally separates unavailable price terms from disclosed deployment-cost proxies; no public source supports a precise revenue or gross-margin estimate."
    claimRefs: [CI006, CI007, CI008, CI009]
  - id: TI003
    title: Unit economics and capital-adequacy inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Incremental cathode target at El Abra, ">20 million lb/year after ramp-up", medium, "Shows customer-level production upside and potential basis for performance-linked economics", "Obtain actual ramp curve, realized pounds, and contract attribution"]
      - [Capital intensity, "<$1,500 per annual tonne of additional production", medium, "Indicates a potentially low-retrofit-capital deployment model", "Validate whether metric is Jetti or customer capex and test by site"]
      - [Operating cost, "$1.50/lb including cathode plating costs", medium, "Frames potential contribution economics but excludes price and corporate overhead", "Obtain cost build, catalyst dosage, labor, maintenance, and period"]
      - [Historical financing, "$50m Series C; >$100m total raised after close", medium, "Shows strategic funding access but not current liquidity", "Obtain current cash, debt, burn, runway, and restricted-cash schedule"]
      - [Pipeline, "23 projects; 5 active pilots; 3 transitioning to commercial status", medium, "Signals future deployment demand and potential working-capital needs", "Obtain pipeline stage definitions, conversion rates, concentration, and committed capex"]
    notes: "Values are period-specific public disclosures and company-reported proxies; nulls are not substituted for missing current financial statements, margins, cash, debt, or runway."
    claimRefs: [CI003, CI006, CI010, CI011, CI012]
