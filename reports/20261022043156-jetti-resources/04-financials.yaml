          to: diagnosis
        - from: diagnosis
          to: catalyst
        - from: catalyst
          to: ramp
        - from: ramp
          to: cathode
        - from: cathode
          to: monetization
    claimRefs: [CI001, CI002, CI005, CI008]
callouts:
  - calloutType: strength
    title: Customer-level economics are tangible
    body: "Jetti has public deployment evidence tied to existing mine assets, including an El Abra target of more than 20 million pounds of incremental cathode per year and a reported doubling of cathode production per irrigated area at Pinto Valley."
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Company-level underwriting remains disclosure-constrained
    body: "No assigned source provides current revenue, gross margin, cash, burn, runway, debt, realized pricing, or customer concentration; the historical financing record cannot substitute for a current liquidity schedule."
    claimRefs: [CI013, CI014, CI015]
  - calloutType: recommendation
    title: Require contract and site-level financial evidence
    body: "Advance diligence only after obtaining a site-by-site revenue bridge, contract economics, cost allocation, cash forecast, and reconciliation of production KPIs to invoices."
    claimRefs: [CI003, CI008, CI013, CI015]
