chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Jetti Resources is consistently identified as a private mining-technology company founded in 2014, with
              Boulder, Colorado as its location in the Tracxn profile and the company presenting itself as a technology
              provider to copper producers. Its core product is a proprietary catalyst paired with modular dosing
              equipment that fits into existing heap-leach and solvent-extraction/electrowinning infrastructure. The
              company describes a customer-centered “Integral Solutions” approach: diagnose the mine system, identify an
              opportunity, deploy the catalyst where appropriate, and measure value. This is a site-specific industrial
              deployment model rather than a standalone software subscription, so commercial proof depends on mine-level
              performance and operator adoption.
            claimRefs:
              - CO001
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
