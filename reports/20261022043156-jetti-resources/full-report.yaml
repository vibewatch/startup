  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Jetti's public positioning combines high integration fit with a specialized primary-sulfide focus, while Nuton has
      comparable technical scope and greater disclosed project-financing capacity.
    data:
      points:
        - label: Jetti Resources
          x: 8
          'y': 8
          note: >-
            Ordinal assessment from public evidence: existing-infrastructure integration and primary-sulfide
            specialization are repeatedly described; scale and economics remain partly company-claimed.
        - label: Nuton / Rio Tinto
          x: 6
          'y': 9
          note: >-
            Ordinal assessment from public competitor releases: primary-sulfide technology and staged project funding
            are evidenced, while site-level integration comparability is not fully disclosed.
        - label: Conventional processing
          x: 3
          'y': 7
          note: >-
            Ordinal assessment: mature supply chain and operating familiarity, but lower fit for the specific low-capex
            incremental-recovery use case.
        - label: New mine development
          x: 2
          'y': 4
          note: >-
            Ordinal assessment: can add large capacity but has lower deployment fit and longer permitting, capital, and
            construction exposure.
        - label: Internal build
          x: 5
          'y': 5
          note: >-
            Ordinal assessment: potentially strong site control, but public evidence does not establish specialist
            catalyst capability or repeatable deployment know-how.
        - label: Status quo / defer
          x: 1
          'y': 2
          note: 'Ordinal assessment: highest implementation simplicity but no incremental recovery benefit is evidenced.'
      xAxis:
        label: Fit with existing mine infrastructure (ordinal, 0–10)
      yAxis:
        label: Specialized primary-sulfide recovery capability (ordinal, 0–10)
    approximationNotes: >-
      Coordinates are analyst ordinal scores from the cited evidence, not measured market-share, recovery-rate, or
      pricing data; no benchmark threshold or ranking zone is implied.
    claimRefs:
      - CP005
      - CP006
      - CP012
      - CP014
  - id: FI001
    title: Revenue model bridge from mine asset to potential Jetti monetization
    type: flow
    summary: >-
      Existing mine infrastructure and site-specific technical work are intended to convert stranded ore into
      incremental cathode production, but the public record does not disclose Jetti's pricing or revenue share.
    data:
      nodes:
        - id: mine-asset
          label: Existing heap or dump leach asset
          value: Existing infrastructure
          unit: site
          note: Requires suitable ore and available SX-EW capacity.
        - id: diagnosis
          label: Site diagnosis and testwork
          value: Site-specific validation
          unit: phase
          note: Public materials describe staged, data-gated validation.
        - id: catalyst
          label: Catalyst and Jetti in a Box
          value: Dosing solution
          unit: deployment
          note: Company describes minimal tie-ins and modular deployment.
        - id: ramp
          label: Ramp-up and KPI measurement
          value: Performance-linked framework
          unit: phase
          note: KPIs are agreed with the operator; payment terms are not public.
        - id: cathode
          label: Incremental copper cathode
          value: '>20 million'
