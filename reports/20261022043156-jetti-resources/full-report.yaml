        title: Leadership, board, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The public record identifies Andrew Perlman as a co-founder and Mike Outwin as CEO and co-founder in
              funding coverage; a current-looking employer profile instead names John Slaven as CEO. That discrepancy is
              material and should not be silently resolved from a secondary profile. Independent industry coverage
              reports that former BHP CEO Chip Goodyear and former Xstrata CFO Trevor Reid joined the board and
              management team in 2021, indicating an effort to add large-miner and finance experience. Public evidence
              does not provide a complete current executive roster, board composition, ownership allocation, or
              governance-rights detail. Leadership continuity, succession coverage, and the current authority of named
