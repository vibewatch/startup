      - CI005
      - CI008
  - id: FE001
    title: Jetti product architecture from ore assessment to cathode
    type: stack
    summary: >-
      The stack shows the product's ordered operating layers, not a claim that every site uses identical equipment or
      achieves identical recovery.
    data:
      layers:
        - label: Ore qualification
          items:
            - Site questionnaire
            - Reactor amenability tests
          outputs:
            - Go or no-go recommendation
        - label: Heap simulation
          items:
            - Matched control columns
            - Site-representative raffinate and ore
          outputs:
            - Catalyzed and control recovery trajectories
        - label: Digital decision support
          items:
            - Rosetta ensemble model
            - P20-P80 confidence band
          outputs:
            - Site-specific business-case input
        - label: Catalyst delivery
          items:
            - Jetti in a Box
            - Raffinate, water, power, and sewage tie-ins
          outputs:
            - Controlled catalyst dose
        - label: Heap operation and telemetry
          items:
            - Existing irrigation system
            - ORP, copper, iron, catalyst, and flow monitoring
          outputs:
            - Copper-bearing pregnant leach solution
        - label: Existing SX-EW circuit
          items:
            - Solvent extraction
            - Electrowinning
          outputs:
            - Copper cathode
    approximationNotes: Conceptual ordering based on company-described modules; it is not a scale drawing or a site-specific flowsheet.
    claimRefs:
      - CE001
      - CE006
      - CE011
  - id: FU001
    title: Customer journey from mine opportunity to expansion
    type: journey-map
    summary: >-
      Jetti's disclosed customer path moves from site diagnosis through technical validation, implementation, measured
      value, and possible expansion.
    data:
      items:
        - label: Diagnose
          detail: Understand the mine system, objectives, and operational constraints.
          touchpoints:
            - Customer system review
            - Opportunity identification
        - label: Validate
          detail: Test ore amenability and select the deployment location.
          touchpoints:
            - Ore sample and laboratory testing
            - Site and infrastructure assessment
        - label: Implement
          detail: Install and operate catalyst dosing within the existing leach workflow.
          touchpoints:
            - Jetti in a Box or catalyst addition facility
            - Operational support
        - label: Measure value
          detail: Track recovery and production outcomes against the site's objectives.
          touchpoints:
            - Performance measurement
            - Value capture
        - label: Expand
          detail: Consider additional sites, leach areas, or commercial scale after results.
          touchpoints:
            - Additional deployments
            - Partnership expansion
        - label: Renew / repeat
          detail: Confirm renewal, repeat deployment, and customer economics before treating expansion as durable.
          touchpoints:
            - Renewal and termination history
            - Cohort and concentration review
    claimRefs:
      - CU002
      - CU003
      - CU013
