  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Jetti's evidenced market is not global copper production or all mine development. It is the subset of
              low-grade primary sulfide material, particularly chalcopyrite, that a mine operator can route through heap
              or stockpile leaching and an existing SX-EW circuit. Included spend therefore centers on ore
              qualification, catalyst dosing, monitoring, and site deployment; greenfield mine construction,
              conventional concentrator and smelter capacity, and oxide ores already amenable to standard acid leaching
              are outside the core boundary. Adjacent budgets include process-control and metallurgical optimization,
              but these are enabling services rather than automatically addressable catalyst revenue. The status quo is
              to leave marginal material stranded, process suitable ore through conventional concentration and
              pyrometallurgy, or optimize existing leach circuits without Jetti. This definition keeps the opportunity
              tied to compatible ore and infrastructure rather than treating broad copper demand as TAM.
            claimRefs:
              - CM001
              - CM002
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The top-down demand signal is substantial: BHP projects global copper demand to rise roughly 70% to more
              than 50 Mt per year by 2050 and estimates that about 10 Mtpa of new mined supply will be needed over the
              next decade. The brownfield pressure is also visible in BHP's estimates that average mine grade has fallen
              about 40% since 1991 and that existing mines could produce roughly 15% less copper in 2035 than today.
              Jetti and a 2020 trade interview use an approximately 70% share of global copper resources in primary
              sulfides as a technology-relevance indicator. None of these figures is a Jetti revenue TAM: they use
              different denominators and vintages, do not isolate amenable ore, and do not reveal sites with usable
              leach pads, SX-EW capacity, permits, or commercial willingness to adopt.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The mine owner or operator is the likely contracting party and economic payer because value depends on
              incremental cathode output and mine-life extension at a specific operation. Metallurgists, process
              engineers, site engineers, and operations managers are the day-to-day users and technical gatekeepers;
              their budgets and incentives span metallurgy, processing, sustaining capital, and operational improvement
              rather than a single software-style line item. Jetti describes a data-gated adoption path beginning with
              ore samples and reactor qualification, moving through columns or an industrial trial, and ending in
              commercial deployment. Its stated go/no-go recommendation can arrive within 12 weeks, but reactor work is
              described separately as typically taking 12-16 weeks. Commercial timing therefore remains site-specific
              and depends on mineralogy, infrastructure, agreed KPIs, and operator risk appetite.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand growth, declining ore grades, aging mines, and the cost and delay of greenfield supply all favor
              technologies that can recover more copper from installed assets. Jetti claims a low-capital deployment
              profile, including less than $1,500 per annual tonne of additional production and operating costs of $1.50
              per pound including cathode plating, while a 2020 trade interview reported doubled cathode production per
              irrigated area at Pinto Valley. These are useful adoption signals, not independent fleet-wide economics.
              The counterweight is operational heterogeneity: Mipac identifies ore variability, reagent distribution,
              temperature, permeability, instrumentation, solution control, and environmental compliance as recurring
              leach constraints. BHP likewise expects sulfide-leach adoption to remain tailored to individual ore bodies
              and not become widespread until at least the mid-2030s. Valuation should therefore depend on verified site
              conversion, repeatable recovery distributions, contract economics, and eligible inventory—not solely on
              copper scarcity.
            claimRefs:
              - CM007
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Copper demand is context, not Jetti TAM
            body: >-
              The global copper-demand forecast bounds industry urgency, while Jetti's addressable opportunity is
              limited by ore amenability, installed leach and SX-EW infrastructure, site economics, and operator
              adoption.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Site qualification is the gating variable
            body: >-
              Published evidence does not convert the large primary-sulfide resource base into an eligible site count or
              recoverable-tonnage denominator, leaving company-level SAM and SOM unresolved.
            calloutType: risk
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Jetti's relevant market is not generic copper mining software or all copper extraction. It is the narrower
              job of increasing copper recovery from primary-sulfide, legacy-dump, or otherwise uneconomic ore at an
              existing mine. Jetti describes its catalyst as working within existing heap-leach and SX-EW
              infrastructure, while Kitco reports deployments at Capstone Copper, Freeport-McMoRan, and El Abra. That
              makes the direct set unusually small: proprietary leaching platforms such as Rio Tinto's Nuton are the
              clearest technology peers; conventional sulfide processing, new mine development, and mine-owner internal
              engineering are substitutes rather than like-for-like products. The buyer is therefore a mine operator
              weighing incremental production and mine-life extension against permitting, construction, commodity-price,
              and operating risks.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP012
              - CP016
      - number: '3.2'
        title: Capability, integration, and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              The public comparison favors low-disruption deployment over a complete proof of superior economics.
              Jetti's own operations page says its solution requires no new permits, process changes, or major capital
              investment, and its technology page describes tie-ins to existing raffinate, power, and water connections.
              Its competitor evidence shows a different commercial posture: Nuton-backed projects use staged option
              agreements, milestone funding, feasibility work, permitting, and potential joint ventures. Those
              structures can provide the mine owner with project funding and a path to scale, but they also imply longer
              technical and regulatory programs. Public sources do not disclose comparable Jetti, Nuton, or
              conventional-processing realized prices, take rates, or customer-level margins; the pricing comparison
              therefore marks those cells unknown rather than treating list-like cost claims as contract prices.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP014
      - number: '3.3'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Jetti's possible moat rests on accumulated site testwork, operating know-how, catalyst formulation, and
              the ability to integrate with a customer's existing circuit without a flowsheet redesign. The company says
              its Jetti in a Box equipment was shaped by more than six years of operating experience and that its
              technology has been applied to hundreds of millions of tonnes of ore. A 2020 industry interview also
              relayed Jetti's claim that cathode production per irrigated area at Pinto Valley doubled within one year;
              these remain company claims, not independent benchmarks. Switching is nevertheless not frictionless:
              site-specific ore qualification, column or reactor testing, operator approval, and performance KPIs create
              implementation knowledge that may favor an incumbent deployment. The same evidence shows displacement
              risk. Rio Tinto's Nuton is a well-capitalized alternative with proprietary technologies and the ability to
              fund multi-year work programs, while conventional processing remains the default where ore, permits, and
              economics support it. The durable differentiator is therefore deployment speed and reversibility, not
              publicly proven superiority on every recovery or cost metric.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the clearest differentiation signal
            body: >-
              Jetti's public materials consistently emphasize using existing leach and SX-EW infrastructure, modular
              dosing, reversibility, and limited site modification; this can shorten adoption relative to capital-heavy
              alternatives, although independent customer scorecards are sparse.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP010
          - type: callout
            title: A well-funded technology peer is visible
            body: >-
              Nuton is not merely a conceptual competitor: assigned competitor disclosures describe proprietary
              primary-sulfide leaching, milestone-funded work programs, feasibility and permitting activity, and
              potential joint ventures. Jetti's durability case must therefore be tested against Nuton's project funding
              and mine-owner access.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Jetti's commercial proposition is tied to mine operators' incremental copper production rather than to a
              conventional software subscription. The company describes a catalyst, dosing equipment, technical
              diagnosis, implementation support, and performance measurement delivered alongside the customer's
              heap-leach operation. Its public materials say commercial KPIs are agreed with the site operator before
              deployment and govern the commercial relationship, which is consistent with a performance-linked or
              project-specific monetization structure, but no public source states the fee formula, whether
              consideration is a fixed service fee, a per-pound royalty, a share of incremental cash flow, or a hybrid.
              This distinction matters because list-style claims about low capital intensity and operating cost describe
              the deployment economics, not Jetti's recognized revenue or gross margin. Public deployment evidence is
              concrete: the El Abra announcement targeted more than 20 million pounds of incremental cathode production
              per year after ramp-up, while the older Pinto Valley account reported doubled cathode production per
              irrigated area. Neither source discloses Jetti's realized revenue from those sites.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model appears designed to minimize customer-side retrofit cost: Jetti says its
              containerized dosing unit needs raffinate, water, power, and sewage connections, does not require
              flow-sheet changes or additional permitting, and can be removed without legacy effects. The company also
              reports less than $1,500 of capital intensity per annual tonne of additional production and $1.50 per
              pound of operating cost including cathode plating; these are company-issued figures and should not be
              treated as independently audited unit economics. The external mining-technology interview provides a
              compatible mechanism for the customer value proposition, stating that the technology can integrate with
              existing SX-EW infrastructure and requires limited capex. The main underwriting uncertainty is allocation:
              the public material does not say which costs Jetti bears versus the mine operator, how much field labor is
              recurring, or how costs scale across ore mineralogy, site geography, ramp-up, and catalyst dosage.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI008
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Jetti has demonstrated access to strategic capital, but the public record does not establish current cash
              adequacy. Reuters reported a $50 million financing in June 2021 and said the company then had $100 million
              for development and deployment; a contemporaneous mining-industry report described the transaction as
              Series C and said total capital raised exceeded $100 million. Those are historical financing disclosures,
              not a current cash balance, burn rate, runway, debt schedule, or evidence that the proceeds remain
              available in 2026. The same reporting described a 23-project pipeline, five active pilots, and three
              opportunities transitioning to commercial status, which indicates financing needs could rise with
              deployment scale. Jetti's financial verdict is therefore conditional: customer-level economics look
              potentially attractive when excess leach capacity exists, but revenue quality, margin conversion,
              working-capital needs, financing dependency, and concentration cannot be assessed from public disclosures.
              The highest-value diligence is a site-by-site revenue bridge and contract schedule linked to audited or
              management accounts.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer-level economics are tangible
            body: >-
              Jetti has public deployment evidence tied to existing mine assets, including an El Abra target of more
              than 20 million pounds of incremental cathode per year and a reported doubling of cathode production per
              irrigated area at Pinto Valley.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
          - type: callout
            title: Company-level underwriting remains disclosure-constrained
            body: >-
              No assigned source provides current revenue, gross margin, cash, burn, runway, debt, realized pricing, or
              customer concentration; the historical financing record cannot substitute for a current liquidity
              schedule.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Require contract and site-level financial evidence
            body: >-
              Advance diligence only after obtaining a site-by-site revenue bridge, contract economics, cost allocation,
              cash forecast, and reconciliation of production KPIs to invoices.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI008
              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Jetti sells an operating intervention for copper producers rather than a stand-alone mine or replacement
              processing plant. Its stated mechanism is to keep chalcopyrite leaching active by addressing passivation,
              then use the mine's existing heap, raffinate, bioleach, solvent-extraction, and electrowinning circuit to
              produce cathode. The current delivery model combines site diagnosis and ore qualification with proprietary
              catalyst, a containerized Jetti in a Box dosing unit, implementation support, and KPI monitoring. This is
              attractive where a mine already has usable leaching and SX-EW infrastructure, but it also makes value
              realization dependent on ore amenability, site hydraulics, instrumentation, and the operator's existing
              plant condition rather than catalyst chemistry alone.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE016
      - number: '5.2'
        title: Architecture, modules, and maturity
        blocks:
          - type: paragraph
            body: >-
              The public product stack is more developed than a single chemical formulation. Jetti describes a staged
              ladder from reactor tests to controlled column work, an optional industrial trial, and commercial
              deployment; its Rosetta digital twin is intended to forecast catalyzed and control recovery trajectories
              before full-scale operation. Jetti also says its catalyst has operated commercially at Pinto Valley since
              2019, while a 2021 release reported five active pilots and three opportunities moving toward commercial
              status. Those dated pipeline numbers are useful maturity evidence, not a current roadmap. The company
              further says the system works on run-of-mine ore and both heap and dump leaches, but the available pool
              does not provide a current independently audited deployment roster or recovery distribution across sites.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE014
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE014
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE006
              - CE011
      - number: '5.3'
        title: Operating dependencies, reliability, and controls
        blocks:
          - type: paragraph
            body: >-
              Jetti presents biocompatibility, reversibility, SX-EW compatibility, and continuous KPI monitoring as
              design controls. Its technical page reports no detrimental effect on extraction or cathode quality and
              cites an operating site's A-grade cathode record, but no laboratory names, reports, test protocols, or
              site-level datasets are included in the fetched text. Independent practitioner guidance reinforces the
              underlying operational challenge: ore variability, permeability, reagent distribution, sensor drift,
              temperature, and solution inventory can all change leach outcomes. Jetti's statement that no additional
              permits are required should therefore be treated as a site-specific diligence item, not a universal
              regulatory conclusion. Reliability underwriting needs mine-level baselines, controls, excursion logs,
              catalyst handling requirements, and independent cathode quality records.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
      - number: '5.4'
        title: Differentiation and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest visible differentiation is the integrated combination of catalyst chemistry, a removable
              dosing module, a data-gated qualification process, and operation inside installed heap-leach and SX-EW
              assets. However, sulphide-leaching innovation is not unique to Jetti: CoTec reported that Ceibo
              commissioned a 2025 demonstration facility and produced first copper cathodes under mine conditions.
              Jetti's advantage must therefore be tested on recovery uplift, repeatability, installed capital, reagent
              economics, commissioning time, and contractual risk allocation rather than on category novelty. Public
              practitioner or developer signal is also thin: the assigned recruiting proxy listed no active public
              remote roles, which neither disproves technical depth nor substitutes for engineering talks, publications,
              repository activity, or named operator testimony.
            claimRefs:
              - CE005
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Brownfield integration is the core product thesis
            body: >-
              Jetti is designed around installed heap-leach and SX-EW assets, which can reduce new-plant scope where
              site conditions and ore amenability are suitable.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: Public proof is deep in mechanism but narrow in independent outcomes
            body: >-
              The available sources describe chemistry, testing, and controls in detail, yet current multi-site
              performance, reliability, permitting, and failed deployments remain undisclosed.
            calloutType: risk
            claimRefs:
              - CE009
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and adoption model
        blocks:
          - type: paragraph
            body: >-
              Jetti sells into copper producers that already operate heap-leach or dump-leach systems and have underused
              infrastructure, low-grade ore, or stranded material. The buyer is therefore an operating mine owner or
              producer, while the users and implementation stakeholders are site metallurgists, process engineers,
              operations teams, and corporate technical leaders. Jetti describes its commercial motion as beginning with
              understanding each customer's system, then diagnosing opportunities, supporting implementation, and
              measuring value. This is an enterprise, site-by-site land motion rather than a self-serve product. The
              public record supports a mix of strategic investors and mine operators, but it does not identify contract
              prices, payment mechanics, or the share of value captured by Jetti.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
      - number: '6.2'
        title: Adoption trajectory and proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence spans one commercially operating reference, a limited commercial operation, active
              pilots, and earlier testing programs. Capstone's Pinto Valley is the most concrete reference: the company
              and independent trade coverage describe a 2019 deployment and a doubling of cathode production per
              irrigated area during the first year of the partnership. Teck's evidence is earlier-stage because the
              disclosed plan was to trial the catalyst and move to commercial scale only after satisfactory results and
              approvals. Reuters reported 23 projects at different stages in 2021, including five active pilots and
              three opportunities transitioning to commercial status; this is a pipeline indicator, not a current
              customer count or conversion rate. Later public materials do not provide a refreshed site-by-site
              scorecard.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named customer proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Named references are strategically credible because they include large mining operators, but reference
              quality differs materially by stage and source. Pinto Valley is the strongest production reference because
              Jetti says the technology continues to operate there and independent coverage reports a measured
              production outcome. Freeport-McMoRan's Bagdad operation is described by Jetti as a limited commercial
              operation, which demonstrates deployment but not disclosed durability or economics. Teck is a named
              strategic customer and investor, yet the available evidence describes a trial rather than a completed
              commercial rollout. The public record also mentions El Abra as an expansion target, but the assigned
              sources do not establish a completed deployment or a customer-reported outcome there.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Retention, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports expansion intent but not retention metrics. Jetti and its coverage
              describe discussions to expand the Capstone partnership, and the company frames its offering around
              extending mine life and increasing production from existing assets. Those signals are qualitatively
              positive, but they do not establish renewal rates, net or gross revenue retention, contract duration,
              customer payback, or repeat deployments across a representative cohort. Customer concentration is also
              unquantified: the record names strategic mining relationships but does not disclose revenue by customer,
              site, geography, or partner channel. A diligence process should therefore request a customer-level
              deployment ledger, signed contract archetypes, realized-versus-promised production outcomes, renewal and
              termination history, and concentration by revenue and gross profit.
            claimRefs:
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The customer proof is operational, not merely logo-based
            body: >-
              Pinto Valley supplies a disclosed production outcome and a continuing commercial reference, while the
              broader pool includes pilots and named mine-operator relationships.
            calloutType: strength
            claimRefs:
              - CU005
              - CU009
          - type: callout
            title: Durability and concentration remain unmeasured
            body: >-
              No assigned source provides customer-level revenue, renewal, churn, contract duration, realized margin, or
              a current deployment scorecard; the strongest evidence is therefore not sufficient to underwrite
              retention.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence exposure is scale-up and repeatability across different ore bodies and mine
              circuits. Jetti reports commercial operation at Pinto Valley and limited commercial operation at Bagdad,
              while its technical materials describe a staged qualification pathway; that is meaningful evidence of a
              de-risking process, not proof that every prospective site will meet the same recovery or economics. The
              public materials also state that testing is used to determine ore fit before deployment. An investment
              thesis breaks if site qualification repeatedly fails, performance KPIs are missed, or operators require
              unplanned flowsheet changes, permits, capex, or remediation. Monitoring should therefore track
              site-by-site recovery uplift, reagent consumption, uptime, cathode quality, commissioning time, and the
              share of deployments meeting pre-agreed KPIs.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, environmental, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              Jetti's official positioning says its dosing equipment needs raffinate, water, power, and sewage
              connections and does not require additional permitting or flowsheet changes. That lowers integration
              friction but is not a substitute for site-specific environmental, water, mine-plan, occupational-safety,
              or community approvals controlled by mine operators and local authorities. The independent 2020 trade
              interview describes lower water and emissions intensity relative to pyrometallurgy, while also describing
              the technology as a patented catalyst. Publicly available material in this pool does not establish patent
              scope, freedom to operate, litigation status, permit determinations, or whether environmental benefits
              persist across ore types and jurisdictions. The diligence path is to obtain the patent family and
              legal-status report, site permits and environmental reviews, incident history, and written responsibility
              allocations in each deployment contract.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, quality, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating model depends on mine-specific infrastructure, ore mineralogy, operator cooperation, and
              stable connections to existing leach and SX-EW systems. Jetti's modular 'Jetti in a Box' is designed to
              reduce site complexity, and the company states that the catalyst is reversible and compatible with
              existing processing. Those claims reduce, but do not eliminate, commissioning, supply, maintenance,
              safety, and reliability risk. The business also relies on large mining partners to provide samples,
              operating access, data, and decisions about deployment. A partner can delay a trial or change mine plans
              even if Jetti's chemistry performs. The monitoring set should include deployment cycle time, uptime,
              catalyst availability, operator acceptance, quality rejections, and the number of active sites by
              counterparty. No public source in the assigned pool quantifies customer concentration, contract duration,
              guarantees, termination rights, or liability caps.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Financial model, disclosure, and diligence path
        blocks:
          - type: paragraph
            body: >-
              The public evidence is stronger on technology description than on financial resilience. Jetti publishes
              indicative capital-intensity and operating-cost figures for additional production, but the assigned
              evidence does not provide audited revenue, gross margin, cash burn, liquidity, working capital,
              customer-level economics, debt, or contract backlog. A private-company profile and pre-IPO page add
              context but are not substitutes for company financial statements; the pre-IPO page is explicitly a
              documentation-led context page rather than a filing. This creates model risk: an apparently attractive
              mine-level cost profile may not translate into durable corporate cash generation after deployment costs,
              support costs, partner concessions, and financing needs. Before investment, request monthly cash and
              revenue bridges, deployment-level contribution margins, cap table and preference terms, covenant
              schedules, insurance, customer concentration, and downside liquidity scenarios. Treat any unverified
              valuation or revenue number as a gap rather than an input.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Repeated failure to convert ore qualification into contracted, KPI-meeting commercial deployments would
              invalidate the scale-up thesis even if the chemistry remains technically promising.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: Evidence boundary
            body: >-
              No assigned source establishes audited corporate financials, customer concentration, patent freedom to
              operate, litigation status, or site-wide incident history; these remain diligence requirements.
            calloutType: assumption
            claimRefs:
              - CR007
              - CR012
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Jetti has a credible strategic value proposition: its catalyst is designed to unlock low-grade primary
              sulfide copper using existing heap-leach and SX-EW infrastructure, avoiding a new mine, major process
              redesign, or large plant build. The strongest proof is operational rather than promotional: the company
              reports that its Pinto Valley deployment doubled cathode production per irrigated area in one year, while
              the independent Mine article reports the same commercial deployment and describes the technical
              passivation problem. The anti-thesis is that these are site-specific outcomes and company-reported
              economics, not a disclosed portfolio-wide revenue, margin, or cash-flow record. The value case therefore
              depends on repeatable conversion from ore qualification to commercial contracts and on customers sharing
              enough economics to support the disclosed price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV010
      - number: '8.2'
        title: Price, financing context, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest public financing reference is a $100M Series D in October 2022 at a $2.5B post-money valuation,
              with T. Rowe Price identified as lead and strategic mining investors listed among participants. SetterVC
              labels its funding and valuation data as estimates that may be incomplete, stale, erroneous, or revised;
              Multiples likewise presents the $2.5B figure as the last valuation. That makes $2.5B a reference mark, not
              a current transaction price or verified enterprise value. Multiples reports $169M of cumulative funding,
              while SetterVC reports $168.67M, but neither supplies audited revenue, EBITDA, cash, debt, preference
              rights, dilution, or secondary liquidity. A disciplined entry would require a current financing or
              secondary price plus contract-level revenue and margin evidence; absent that, a valuation multiple or
              target return would be false precision.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Jetti converts its demonstrated deployment model into multiple repeatable
              installations, captures performance-linked economics, and expands the addressable installed base of
              underused leach assets. The base case assumes continued technical relevance but slower site conversion and
              limited disclosure, leaving the October 2022 mark difficult to validate. The bear case is a down-round or
              impaired liquidity event if deployment results do not generalize, copper prices weaken, or customers
              retain most of the incremental value. Public comparable evidence is weak: Multiples lists a mixed set of
              private and public companies and unrelated revenue multiples, while CoTec's Ceibo page shows another
              sulphide-leaching technology reaching a demonstration facility in 2025. These are context, not directly
              comparable valuation benchmarks, because business models, stage, ownership, and revenue disclosure differ.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
      - number: '8.4'
        title: Decision, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with low confidence in the price conclusion and high risk. Jetti's
              technology and strategic investor base support continued diligence, but the public record does not
              establish current valuation, recurring revenue, gross margin, customer concentration, or investor
              preference terms. Exit readiness is also unproven: Jetti is privately held, and the assigned evidence
              contains no verified IPO, tender-offer, or secondary-liquidity timetable. The thesis should be upgraded
              only after management provides a current cap table, financing terms, site-by-site deployment scorecards,
              contract pricing and guarantees, audited or reviewed financials, and cash runway. Thesis-break triggers
              include a material failure to meet agreed site KPIs, inability to convert qualified trials into paid
              deployments, a financing below the 2022 mark without offsetting operating progress, or evidence that
              customers can substitute competing leach solutions at materially lower cost.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The strategic case is credible, but public evidence does not support underwriting the current price or
              calculating a target return. Require refreshed financing terms and operating disclosure before entry.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV013
              - CV014
          - type: callout
            title: The central risk is evidence quality
            body: >-
              The latest valuation is a two-year-old private financing mark, and public sources do not disclose the
              financial and cap-table terms needed to judge dilution, preferences, or cash runway.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV015
