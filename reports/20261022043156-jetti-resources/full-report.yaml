        title: Funding, scale, and disclosure
        blocks:
          - type: paragraph
            body: >-
              Jetti announced a $50 million Series C financing in June 2021 from Mitsubishi Corporation, BHP Group,
              Freeport-McMoRan, Orion Resource Partners, and T. Rowe Price-related funds; Reuters reported that this
