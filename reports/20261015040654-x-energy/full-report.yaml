      - number: '3.3'
        title: Moat durability is real but still vulnerable to incumbent response and sector execution failures
        blocks:
          - type: paragraph
            body: >-
              The moat is directionally credible but not yet settled. X-energy can point to fuel verticalization, a
              reactor format aimed at process heat as well as electricity, and a long partner list, but the public
              evidence also shows why incumbents and peers can still blunt that edge. KoalaGains frames BWX Technologies
              and Westinghouse as established nuclear businesses with installed-base and revenue advantages, while
              Wikipedia records two reminders that the sector remains fragile: BWX beat X-energy in Project Pele, and
              the company's earlier SPAC plan was abandoned after market conditions worsened and a high-profile U.S. SMR
              project was canceled. Until X-energy converts early relationships into operating plants, its competitive
              narrative remains easier to describe than to verify.
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
