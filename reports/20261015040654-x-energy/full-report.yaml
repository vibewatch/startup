          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
              - CI013
      - number: '4.3'
        title: Liquidity and capital needs
        blocks:
          - type: paragraph
            body: >-
              Near-term liquidity improved substantially in 2026, but X-energy still looks like a financing-dependent
              infrastructure platform rather than a self-funding operating company. As of March 31, 2026, management
              reported $944.0 million of total liquidity and no debt outstanding, then disclosed roughly $1.1 billion of
              net IPO proceeds after the April listing. The IPO was first marketed at $16.00 to $19.00 per share and
              ultimately priced an upsized 44.25 million-share deal at $23 per share, which suggests capital market
              demand was stronger than the initial filing range implied. But the stated uses of that cash are
              broad—working capital, R&D, sales and marketing, G&A, capital expenditures, supply-chain activity, and
              future growth projects—so the raise relieves funding pressure without answering project-level economics or
              final funding needs for fleet deployment.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. X-energy now has a materially stronger balance-sheet cushion
              than it did before the IPO, and its intended business model can support attractive recurring economics if
              reactor, fuel, and services monetization eventually land as management has framed them. However, the
              current public evidence is still dominated by grant- and services-based revenue, widening historical
              losses, concentration in government-linked work, and a project pipeline that assumes contingent rights are
              fully exercised. Independent reporting also highlights that no reactor project had yet reached final
              investment decision at IPO time and that ARDP timing, HALEU availability, and Amazon contract terms could
              materially pressure economics or liquidity. Underwriting should therefore treat the current equity story
              as well-funded optionality rather than as a modelable contracted-cash-flow business.
            claimRefs:
              - CI001
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: IPO cash improved resilience, not revenue quality
            body: >-
              The April 2026 IPO materially improved near-term liquidity, but the reported income statement is still
              dominated by services revenue and grant income rather than by disclosed reactor, fuel, or recurring
              service sales.
            calloutType: insight
            claimRefs:
              - CI001
              - CI007
              - CI008
              - CI009
          - type: callout
            title: The real blocker is undisclosed project economics
            body: >-
              Public evidence still does not show reactor ASPs, TRISO-X fuel pricing, long-term service pricing, or
              customer-level backlog conversion, so the pipeline cannot yet be translated into underwritable gross
              profit or cash flow.
            calloutType: risk
            claimRefs:
