      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The clearest public unit-economics signal is still cost absorption rather than contribution margin.
              X-energy reported $109.5 million of total operating expense in 1Q 2026, including $65.4 million of direct
              costs, against only $43.4 million of reported revenue and grant income. Operating cash outflow was $67.3
              million and investing outflow was $166.0 million, including $43.0 million of capex, so the business
              remains highly dependent on external capital while it builds TX-1 and continues reactor-development work.
              Public third-party summaries also point to concentration risk: the only surfaced customer-mix disclosure
              attributes 92% of reported revenue and grant income to the U.S. Government and 4% to Dow. That is
              directionally useful for underwriting, but it is still far short of the pricing, backlog, and margin data
              required to model steady-state economics.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
