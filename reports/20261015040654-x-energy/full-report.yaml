              - CP009
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Pricing and win-loss evidence remain the biggest underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The retained pool is strong enough to identify the competitive set and X-energy's differentiation logic,
              but not strong enough to prove superior economics. CNBC and the company's own materials show how X-energy
              wants to sell, yet none of the assigned sources disclose reactor ASPs, long-term fuel pricing, customer
              tariff assumptions, or a verified win-loss record against Oklo, NuScale, TerraPower, Westinghouse, or the
              status quo. That means this chapter can defend a strategic positioning thesis, but not a hard claim that
              X-energy will win on cost, project returns, or conversion rates once first-of-a-kind deployments start
              competing for capital.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fuel verticalization is the clearest moat
            body: >-
              Among the retained sources, the most defensible reason X-energy can win is that it is not just selling a
              reactor concept. It is trying to control the fuel, the licensing story, and the customer relationship at
              the same time, which is a different posture from peers that depend more heavily on third-party fuel or a
              single deployment narrative.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP015
          - type: callout
            title: Competitive edge still depends on first deployment and disclosed economics
            body: >-
              The public evidence shows meaningful partner demand, but it also shows that customers want a demonstrated
              U.S. plant, that project cycles are measured in years, and that sector financing can reverse quickly after
              a high-profile cancellation. Until X-energy clears those milestones with visible economics, incumbents and
              better-proven peers can still frame it as a promising but unproven option.
            calloutType: risk
            claimRefs:
              - CP004
              - CP007
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public disclosure still shows X-energy in a pre-commercial phase for reactor deployment: reported revenue
              is coming from services performed and grant reimbursement, not from delivered reactors or disclosed
              long-term fuel contracts. In 1Q 2026, the company reported $43.4 million of total revenue and grant
              income, with $39.9 million from services revenue and $3.5 million from grant income, and management tied
              the growth primarily to higher ARDP activity. That mix matters because the company's older public-market
              materials described the intended monetization stack as technology licensing, fuel sales, and recurring
              services, yet the visible income statement still reflects development-stage project work. Public traction
              language around a 144-reactor / 11.5 GWe pipeline therefore signals demand interest, but it does not yet
              establish contracted, recurring commercial revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
