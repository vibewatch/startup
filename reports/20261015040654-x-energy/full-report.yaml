              - CM011
      - number: '2.4'
        title: Adoption drivers are real, but commercialization remains gated
        blocks:
          - type: paragraph
            body: >-
              The market case for X-energy is being pulled by AI-linked load growth, coal and fossil replacement, and
              the need for firm zero-carbon supply that can serve both grids and industrial processes. Those drivers
              matter for valuation because they create a path to larger project scopes than a power-only SMR offering
              would have. But the public evidence also shows why adoption timing remains uncertain: the company still
              discloses contingent-rights language on its pipeline, key deployments rely on regulatory milestones such
              as NRC and U.K. reviews, and public materials do not isolate reactor pricing, project-level tariffs, or a
              defensible public SOM. The opportunity is therefore better read as a deep but still gated infrastructure
              market, not a near-term contracted backlog story.
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans startups, incumbents, and status quo
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a narrow one-peer framing. Independent comparison sources place
              X-energy in a field that ranges from advanced-reactor startups such as Oklo, NuScale, TerraPower, and NANO
              Nuclear to incumbent suppliers such as Westinghouse and BWX Technologies, with additional adjacent vendors
              including GE Hitachi, Holtec, Kairos Power, and Mitsubishi Heavy Industries. The practical status quo
              alternative is also meaningful: CNBC notes the current U.S. operating fleet remains light-water based,
              while X-energy is pitching a high-temperature gas-cooled design for both grid power and industrial heat,
              so buyers can delay adoption, stay with incumbent formats, or select another advanced-reactor architecture
              instead of moving to Xe-100.
            claimRefs:
