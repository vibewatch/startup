  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered platform is reactor + fuel + support, not just a reactor box
        blocks:
          - type: paragraph
            body: >-
              X-energy’s deliverable is broader than a single reactor module. Across the official 2022 transaction
              materials, the 2026 investor surface, and public market profiles, the company is consistently framed
              around the Xe-100 high-temperature gas-cooled reactor, TRISO-X pebble fuel, and a service layer for
              planning, regulatory work, construction coordination, and long-term plant support. That matters because
              the customer workflow is not simply “buy power”; industrial and utility buyers need assured fuel,
              deployment support, and a path to run multi-decade assets. The evidence is strong on product definition
              and commercialization intent, but much weaker on realized operating proof, which means the commercial
              package is clearer than the field-validated delivery record.
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
