      - number: '1.3'
        title: Capital markets and stakeholders
        blocks:
          - type: paragraph
            body: >-
              X-energy's capital-markets path is much better supported than its private-round valuation history. The
              company formally launched its IPO roadshow on April 15, 2026, priced 44.3 million shares at $23 on April
              23, and began trading on Nasdaq under XE on April 24. Before that listing, X-energy closed an
              approximately $700 million Series D led by Jane Street in November 2025. Third-party tracker pages
              aggregate total funding at $2.7 billion across four reported rounds, but those same pages do not supply
              clean private-round post-money values, so they are useful for chronology and investor names rather than
              precise underwriting. The same evidence shows the commercial narrative is concentrated around a small set
              of strategic counterparties and financiers rather than a broad disclosed customer base.
