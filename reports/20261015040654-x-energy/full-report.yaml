      - number: '2.3'
        title: Buyers cluster into industrial, utility, and large-load ecosystems
        blocks:
          - type: paragraph
            body: >-
              The buyer map in the public record is more concrete than the SAM math. One lane is industrial
              self-generation, where Dow is evaluating a site that would use Xe-100 units for both electricity and
              high-temperature steam. A second lane is regulated-utility or merchant-power deployment, where X-energy
              has discussed Energy Northwest, Talen, and Kentucky utility pathways. A third lane is large-load or
              hyperscaler-linked demand, where Amazon-backed deployment appears as an offtake and ecosystem catalyst
              rather than a direct retail reactor sale. In each case, adoption depends on a buyer with long-duration
              infrastructure budgets, tolerance for licensing complexity, and a willingness to commit before reactor
              economics are broadly benchmarked in public markets.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
