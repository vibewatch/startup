  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what X-energy is actually selling
        blocks:
          - type: paragraph
            body: >-
              X-energy's served market is narrower than broad energy-transition rhetoric. Across its current
              investor-facing materials, the company presents itself as a developer of Xe-100 advanced small modular
              reactors plus TRISO-X fuel, with the reactor intended to supply firm electricity and, in certain
              configurations, high-temperature industrial steam. The strongest supported boundary therefore includes
              reactor deployments, fuel supply, licensing and regulatory support, project-planning support, construction
              coordination, and long-duration operations services tied to those plants. The public corpus does not
              support extending the boundary to all decarbonization spend, generic electricity trading, or the broader
              installed base of conventional nuclear assets; the evidence is specific to advanced-nuclear deployments
              where buyers need dispatchable zero-carbon power or process heat.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM012
      - number: '2.2'
        title: Sizing lenses are large, but not directly comparable
        blocks:
          - type: paragraph
            body: >-
              The best public sizing evidence is a constrained set of lenses rather than a clean TAM/SAM/SOM stack.
              X-energy's 2022 public-market transaction materials framed a 67-gigawatt SMR need across the U.S., Canada,
              and the U.K. by 2040, translating that into a roughly $500 billion revenue opportunity by 2040 and
              approximately $1 trillion by 2050. More current company disclosures shift from that market-opportunity
              framing toward contingent pipeline language: by March 31, 2026, X-energy said its project pipeline covered
              144 reactors and about 11.5 gigawatts electric, while a separate Amazon-linked program targeted more than
              5 gigawatts by 2039. Those numbers are useful, but they mix different denominators, time horizons, and
              certainty levels, so they should be treated as directional adoption lenses rather than a reconciled market
              model.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM012
              - CM013
