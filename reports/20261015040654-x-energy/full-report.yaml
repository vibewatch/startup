      - number: '3.2'
        title: Differentiation comes from fuel control, industrial heat fit, and partner-led routes to market
        blocks:
          - type: paragraph
            body: >-
              X-energy's most evidence-backed differentiator is not simply that it offers another small modular reactor.
              The company repeatedly describes a combined reactor-and-fuel package built around the Xe-100 and TRISO-X,
              and CNBC reports that it intends to license technology rather than own plants while also selling fuel from
              its Oak Ridge fabrication base. That combination matters because the House testimony says international
              buyers want a domestic first deployment and top-tier regulatory approval before committing, so control of
              fuel, licensing progress, and strong partners such as Amazon, Dow, and Centrica become part of the product
              itself rather than just marketing support.
