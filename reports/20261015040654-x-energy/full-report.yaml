      - number: '1.4'
        title: Milestone trajectory and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows real progress, but also why this remains an execution-led diligence story.
              Wikipedia captures the 2020 DOE ARDP selection, the abandoned 2022-2023 SPAC path, and the November 2023
              layoffs, preserving a non-linear capital-formation history before the successful 2026 IPO. The November
              2025 company financing release adds the strongest supported commercial milestone by tying X-energy's
              claimed orderbook to more than 11 GW and approximately 144 SMRs, but that orderbook remains a company
              statement rather than a contracted backlog schedule. Public-market monitoring also turns the chapter from
              pure company narrative into something more mixed: the IBD snapshot shows a multibillion-dollar market cap
              alongside sharp short-term share-price weakness and deeply negative pre-tax margin data, underscoring that
              public listing did not resolve the underlying execution-risk debate.
