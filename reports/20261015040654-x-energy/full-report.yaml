  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      X-energy’s public product story is a six-layer stack from customer workload through reactor, fuel, fabrication,
      operations tooling, and deployment partnerships.
    data:
      layers:
        - label: Customer workloads
          detail: >-
            Industrial steam and power, firm clean generation, and remote resilient-power use cases drive the
            commercialization narrative.
          modules:
            - Process heat and electricity for industrial sites
            - Firm clean generation for grid and large-load buyers
            - Remote / defense / emergency-backup resilience use cases
        - label: Reactor product
          detail: >-
            Xe-100 is the flagship HTGR module, publicly described as an 80-MWe design deployed as a four-unit 320-MWe
            plant.
          modules:
            - Helium-cooled high-temperature gas reactor
            - Modular four-pack plant architecture
          outputs:
            - Electricity
            - High-temperature heat / steam
        - label: Fuel system
          detail: >-
            TRISO-X pebble fuel is presented as the safety and performance enabler for every reactor path in the
            portfolio.
          modules:
            - TRISO particles
            - Graphite pebbles
            - HALEU-based fuel supply chain
        - label: Fabrication assets
          detail: >-
            TX-1 progress and TX-2 development show that commercial rollout depends on fuel-fabrication scale-up, not
            only reactor design.
          modules:
            - TX-1 construction path
            - TX-2 expansion path
          outputs:
            - Commercial fuel supply
        - label: Operations and support layer
          detail: >-
            Plant Support Centers and X-DATA are meant to convert the platform into a lifecycle service model with
            monitoring and training.
          modules:
            - Remote monitoring
            - Operator training
            - Maintenance planning
            - Outage support
        - label: Deployment envelope
          detail: >-
            The public roadmap depends on customers, regulators, and deployment partners to turn the technical stack
            into operating sites.
          modules:
            - Dow / industrial deployment path
            - Energy Northwest / Amazon-backed pathway
            - UK and Canada expansion pathways
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE013
  - id: FU001
    title: Customer journey from funded prototype to multi-site expansion
    type: journey-map
    summary: >-
      The disclosed path moves from government-funded prototype work to anchor industrial and utility projects, with
      expansion optionality arriving before operating-fleet proof.
    data:
      nodes:
        - label: Government-funded prototype
          touchpoints:
            - DoD Project Pele expands an existing relationship and funds prototype work.
        - label: Industrial anchor site
          touchpoints:
            - Dow becomes the named Long Mott host while licensing work continues.
        - label: Utility siting partner
          touchpoints:
            - Energy Northwest considers up to 12 Xe-100 modules in Washington.
        - label: Hyperscaler-backed scale-up
          touchpoints:
            - Amazon funds four Cascade reactors and holds a >5 GW option by 2039.
        - label: UK geography expansion
          touchpoints:
            - Centrica advances UK design review and broader deployment ambition.
        - label: Commercialization bottleneck
          touchpoints:
            - >-
              Most proof is still announcements, permitting, and option structures rather than operating plants or
              renewal metrics.
