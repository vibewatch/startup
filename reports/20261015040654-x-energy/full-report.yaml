      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is sufficient to establish founder and operating control, but not full governance
              quality. Kam Ghaffarian is consistently tied to the founding and still appeared as founder and executive
              chairman in the November 2025 Series D announcement, while Clay Sell is the current CEO and the only
              executive in the pool with a clearly supported pre-X-energy credential, namely his prior role as U.S.
              Deputy Secretary of Energy. Yahoo Finance provides the clearest named operating bench beneath Sell,
              including finance, operations, technology, science, and legal functions. What the pool does not provide is
              a board roster, committee structure, voting-control picture, or a clean read on whether public-company
              governance now meaningfully reduces key-person dependency at the founder/chair and CEO level.
