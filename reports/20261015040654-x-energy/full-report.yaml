              - CE004
              - CE005
              - CE013
      - number: '5.2'
        title: The core architecture is an integrated reactor-fuel system
        blocks:
          - type: paragraph
            body: >-
              The technical stack centers on a helium-cooled, graphite-moderated HTGR that uses TRISO particles embedded
              in graphite pebbles. Multiple retained sources converge on the same architecture: each Xe-100 module is
              described as an 80-MWe design, typically deployed in a four-unit 320-MWe configuration, with enough
              temperature capability to serve both electricity and industrial heat use cases. The key implication is
              that reactor and fuel are inseparable for commercialization. X-energy’s differentiation narrative depends
              on owning the TRISO-X supply chain and then wrapping that hardware with fleet support, training, and
              monitoring. That vertical integration is the clearest moat in the corpus, but it also concentrates risk
              into fuel availability, scale-up, and execution at the first sites.
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE013
      - number: '5.3'
        title: 2026 evidence shows active program motion, not operating maturity
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests meaningful motion across fuel, regulatory, and deployment workstreams. X-energy’s
              investor-relations page highlights 2026 milestones on UK design-review progress and TX-1 construction,
              while ANS coverage shows the company expanding international siting and deployment pathways and continuing
              to advance fuel-facility milestones. Those are real indicators that the program is moving beyond
              concept-stage messaging. However, the assigned corpus still does not show a commissioned Xe-100 unit,
              public uptime statistics, or a completed commercial fuel-fabrication ramp. The right maturity label is
              therefore advanced pre-commercialization: ahead of many concept-only peers on visible milestones, but
              still short of demonstrating repeatable operating proof.
            claimRefs:
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: Safety differentiation is legible; reliability, cyber, and scale-up proof is not
        blocks:
          - type: paragraph
            body: >-
              The main technical risk is not whether X-energy can describe a differentiated architecture; it is whether
              the company can convert a tightly coupled reactor-fuel-service design into repeatable delivery. The corpus
              contains repeated intrinsic-safety and modularity claims, plus partner commentary on centralized support
              tooling, but it does not expose public reliability metrics, cyber/compliance detail for the monitoring
              layer, or open developer signals that would let outside diligence test adoption or robustness the way
              software infrastructure can be tested. ANS’s broader warning that commercialization is harder than reactor
              design is therefore the right adverse lens here. The next material proof points should come from fuel
              qualification, construction execution, operating data, and regulatory acceptance—not from additional
              positioning language.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical integration is the clearest differentiator in the corpus
            body: >-
              The assigned evidence consistently shows X-energy trying to own reactor hardware, proprietary fuel, and
              lifecycle support simultaneously, which is a stronger moat than a reactor-only commercialization story.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE013
          - type: callout
            title: Public proof is still milestone-based rather than operating-data-based
            body: >-
              The program shows visible 2026 motion, but the corpus still lacks commissioned units, public uptime data,
              and direct commercial fuel-output proof, so execution risk remains concentrated in first-project and
              fuel-ramp delivery.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer segments are identifiable, but mostly through strategic counterparties rather than broad installed
          use
        blocks:
          - type: paragraph
            body: >-
              The assigned source set supports a segmented customer picture even though X-energy does not disclose a
              broad customer count. Official materials repeatedly frame the commercial offer as Xe-100 reactors plus
              TRISO-X fuel for clean-power customers, while third-party and partner sources attach that offer to a small
              set of named anchor counterparties. The clearest segment buckets are government-funded prototype work with
              the U.S. Department of Defense, industrial decarbonization with Dow, utility and hyperscaler-backed
              development with Energy Northwest and Amazon, and UK market-entry with Centrica. That is meaningful proof
              that real buyers, hosts, and strategic partners exist, but it is not yet the same thing as a diversified
              operating base with many live plants, repeat purchase behavior, or disclosed renewal evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
              - CU008
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.2'
        title: Pipeline claims are large, yet public customer proof remains pre-operational
        blocks:
          - type: paragraph
            body: >-
              Breadth is the strongest part of the customer story. Scanx says X-energy is advancing more than 11 GW of
              capacity with Dow, Amazon, and Centrica, while Siemens' case study goes further and describes an order
              book of 144 Xe-100 reactors tied to those names. Those are unusually strong strategic logos for an
              advanced-nuclear vendor and they suggest land-and-expand optionality, especially around Amazon's stated
              multi-gigawatt option. However, the same public record still places flagship programs in permitting,
              design review, or long-dated construction timelines: Dow's Long Mott project is in licensing, the Cascade
              project is still expected to come online only in the mid-2030s, and Centrica's latest visible step is UK
              design review. The commercial narrative is therefore substantial in scope but still thin on proof of
              current production deployment and operating utilization.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.3'
        title: Durability and concentration are the weakest verified surfaces
        blocks:
          - type: paragraph
            body: >-
              The chapter's most decision-useful negative datapoint is concentration. Silicon Valley Investclub reports
              that Q1 2026 revenue and grant income came from only two customers, with the U.S. Government contributing
              92% and Dow 4%, which implies disclosed monetization still depends heavily on government-backed work
              rather than a broad fleet of commercial plants. Just as important, the assigned pool does not provide NRR,
              GRR, churn, renewal-rate, customer-satisfaction, contract-length, or active-customer disclosures. Even
              X-energy's own current investor-relations surface continues to communicate traction mostly via milestone
              news rather than usage or cohort reporting. The result is a customer story that is strategically credible
              but still hard to underwrite for durability.
            claimRefs:
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic names are real, even if fleet utilization is not yet proven
            body: >-
              X-energy's public customer surface is unusually strong for an advanced-nuclear company at this stage: DoD,
              Dow, Amazon, Energy Northwest, and Centrica all appear in the assigned evidence.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU015
          - type: callout
            title: Durability is still an underwriting gap
            body: >-
              The customer story has logos and pipeline, but not disclosed retention metrics; the only hard revenue-mix
              datapoint in the pool shows high concentration in two customers during Q1 2026.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal gates remain on the critical path
        blocks:
          - type: paragraph
            body: >-
              The regulatory posture has advanced, but it is not equivalent to approval of a commercial Xe-100
              deployment. The NRC describes engagement with X-energy as pre-application activity dating to September
              2018 and still lists selected technical submissions as under review. X-energy reports a Part 70
              fuel-fabrication license and a favorable environmental finding for Dow's Seadrift proposal, while
              separately describing the construction-permit review as ongoing. The U.K. path also progressed from an
              application subject to acceptance to an investor-relations headline that regulators would begin design
              review. These are meaningful de-risking events, yet each leaves schedule, conditions, intervention, and
              site-specific approval exposure. Primary dockets, hearing records, and permit conditions should therefore
              govern underwriting rather than company milestone summaries.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.2'
        title: FOAK execution concentrates operational and supply-chain exposure
        blocks:
          - type: paragraph
            body: >-
              Operational risk is concentrated before repeat production exists. TX-1 must move from licensed
              construction to qualified commercial fuel output, while reactor deployment also depends on HALEU,
              graphite, nuclear-grade components, and customer-site execution. X-energy's ten-year graphite agreement is
              stronger than an uncommitted sourcing discussion, but the IHI relationship was described only as a
              memorandum to explore manufacturing opportunities. A Department of Energy environmental review involving
              an X-energy team facility illustrates the security, emergency-response, transport, waste, and
              licensed-disposal controls attached to an advanced-reactor demonstration; it is not Xe-100 evidence and is
              used only as a narrow process proxy. No assigned independent source establishes commercial-scale
              reliability, cybersecurity performance, recall history, or quality yield, so those remain diligence items
              rather than inferred strengths.
            claimRefs:
              - CR003
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR014
              - CR015
      - number: '7.3'
        title: Liquidity is substantial, but the commercial model is not yet self-funding
        blocks:
          - type: paragraph
            body: >-
              The IPO materially increased financing capacity, yet liquidity should not be confused with a self-funding
              model. X-energy reported $67.3 million of first-quarter operating cash use, $109.5 million of operating
              expenses, and $43.4 million of revenue and grant income; those accounting lines are not ARR and do not
              establish reactor economics. The company also framed its 144-reactor, 11.5-GWe pipeline on the assumption
              that customers exercise contingent rights in full. Independent analysis in the assigned corpus reports
              that no commercial Xe-100 had been delivered and no technology-fee agreement had been executed, while
              estimating heavy FY2025 dependence on DOE ARDP revenue. Public-market volatility adds financing risk
              despite successful IPO pricing. Underwriting should require signed economics, customer FIDs, and funding
              coverage through construction rather than treating pipeline capacity or proceeds as contracted backlog.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Monitor the linked gates, not isolated announcements
        blocks:
          - type: paragraph
            body: >-
              The investable thesis breaks if delays compound across licensing, customer commitment, fuel readiness, or
              capital. The most useful dashboard is therefore milestone-based: NRC review progress against published
              schedules; binding FIDs and technology-fee agreements rather than non-binding pipeline rights; TX-1
              completion and qualification against the first-half 2028 target; secured HALEU and critical-component
              volumes; and quarterly liquidity movement after separating operating cash use, capital expenditure, and
              investment purchases. A single favorable environmental finding or supplier memorandum does not close the
              chain. Escalate to a kill criterion if a lead project loses its customer commitment, a required license or
              fuel milestone slips without funded schedule recovery, or liquidity coverage no longer spans the next
              decisive regulatory and construction gates.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contingent pipeline is not contracted backlog
            body: >-
              The 144-reactor, 11.5-GWe pipeline assumes every customer exercises contingent rights in full. Investment
              underwriting should instead track binding FIDs, deposits, technology-fee agreements, and funded
              construction obligations.
            calloutType: risk
            claimRefs:
              - CR006
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays price-sensitive
        blocks:
          - type: paragraph
            body: >-
              The public record supports a research-more stance rather than a buy call. X-energy did complete a
              successful April 2026 IPO, and the capital raise materially strengthened its ability to keep funding
              reactor and fuel execution. But by October 2026 independent coverage still showed the stock trading below
              the IPO price, while the business remained pre-revenue from commercial reactor operations and still years
              away from first deployment. That combination means the market is underwriting strategic optionality, not
              proven operating cash flows. Unless entry price falls further or management discloses enough project-level
              economics to justify the multiple, the prudent stance is to keep the company on the diligence list rather
              than force precision the public evidence cannot yet support.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: What still supports upside
        blocks:
          - type: paragraph
            body: >-
              The bull case is not imaginary. X-energy has assembled a differentiated two-product platform: the Xe-100
              reactor plus TRISO-X fuel, rather than a single technology bet. Independent profiles also point to
              unusually deep funding support, including large private rounds before the IPO, and to a pipeline narrative
              tied to the Amazon-backed Cascade project and a broader 11.5 GW orderbook. Venture Atlas also credits the
              company with strong liquidity and expanded DOE support, which gives management time to keep advancing fuel
              manufacturing, licensing, and customer conversion. If that capital base converts into contracted reactor
              deployments and visible fuel margins, today's equity could eventually prove to have been an option on a
              larger platform than current revenue reflects.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
      - number: '8.3'
        title: Why the anti-thesis still dominates underwriting
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is that the public market still lacks the evidence needed to justify a premium valuation
              with confidence. Yahoo Finance described X-energy at about 19x expected 2026 sales despite projected net
              losses widening to roughly $430 million and first commercial reactors not expected until the early 2030s.
              Independent data providers also leave critical holes around the private-round marks and preference stack:
              Silicon Valley Investclub lists the Series C-1 and Series D raises, but not their pre-money or post-money
              values. That is important because a late- stage advanced-nuclear cap table can materially affect effective
              entry price, dilution, and downside protection. Weak October trading momentum reinforces the idea that
              strategic excitement has not yet translated into stable valuation support.
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Scenario discipline and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right way to underwrite X-energy is through scenario discipline, not a single-point target. In a bull
              case, disclosed reactor economics, fuel-margin visibility, and named project conversion could justify
              paying for a platform before reactors generate cash. In the base case, investors are still paying mainly
              for strategic scarcity and government-backed option value, which argues for patience and entry discipline.
              In the bear case, licensing delays, commercialization slippage, or multiple compression could force a
              sharp re-rating before reactor deployments arrive. The next diligence cycle should therefore focus on
              concrete missing evidence: project-level pricing, contracted backlog quality, and the actual late-stage
              cap-table and preference terms behind the pre-IPO financing stack.
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: research more'
            body: >-
              X-energy looks strategically important enough to keep on the investable watchlist, but the public record
              still leaves too many missing valuation inputs to defend an outright buy call.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV008
              - CV010
              - CV011
          - type: callout
            title: What would move the call
            body: >-
              The view improves with disclosed reactor and fuel economics, firmer conversion of the pipeline into
              contracted projects, and explicit private-round and preference-stack transparency.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV011
              - CV013
