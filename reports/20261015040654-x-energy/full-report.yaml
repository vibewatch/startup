    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating profile
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool supports a narrow but usable identity baseline. Across the company website, Yahoo
              Finance, Wikipedia, and two third-party tracker pages, X-energy is described as a Rockville, Maryland
              company founded in 2009 that develops advanced nuclear reactors and nuclear fuel rather than a
              software-style recurring-revenue business. The product identity is consistent: Xe-100 is the flagship
              reactor platform and TRISO-X is the associated fuel platform. The IPO materials also confirm the company
              has crossed into public-market stage, which matters because it improves comparability on leadership
              titles, stock-trading context, and capital-markets milestones but still leaves several diligence-critical
              economics unpublished in the assigned evidence.
