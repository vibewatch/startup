company:
  name: X-energy
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    X-energy is selling an integrated advanced-nuclear stack rather than a single
    reactor SKU: Xe-100 reactor modules, TRISO-X fuel, and lifecycle support
    services. The assigned corpus shows credible 2026 progress on fuel-fabrication
    and deployment milestones, but public proof remains pre-commercial, so the
    moat and the execution bottleneck are the same dependency chain—fuel scale-up,
    licensing, and first-project delivery.
sections:
  - id: delivered-platform
    title: Delivered platform is reactor + fuel + support, not just a reactor box
    body: >-
      X-energy’s deliverable is broader than a single reactor module. Across the
      official 2022 transaction materials, the 2026 investor surface, and public
      market profiles, the company is consistently framed around the Xe-100
      high-temperature gas-cooled reactor, TRISO-X pebble fuel, and a service
      layer for planning, regulatory work, construction coordination, and
      long-term plant support. That matters because the customer workflow is not
      simply “buy power”; industrial and utility buyers need assured fuel,
      deployment support, and a path to run multi-decade assets. The evidence is
      strong on product definition and commercialization intent, but much weaker on
      realized operating proof, which means the commercial package is clearer than
      the field-validated delivery record.
    claimRefs: [CE001, CE004, CE007, CE010]
    tableRefs: [TE001, TE002]
  - id: reactor-fuel-architecture
    title: The core architecture is an integrated reactor-fuel system
    body: >-
      The technical stack centers on a helium-cooled, graphite-moderated HTGR that
      uses TRISO particles embedded in graphite pebbles. Multiple retained sources
      converge on the same architecture: each Xe-100 module is described as an
      80-MWe design, typically deployed in a four-unit 320-MWe configuration, with
      enough temperature capability to serve both electricity and industrial heat
      use cases. The key implication is that reactor and fuel are inseparable for
      commercialization. X-energy’s differentiation narrative depends on owning the
      TRISO-X supply chain and then wrapping that hardware with fleet support,
      training, and monitoring. That vertical integration is the clearest moat in
      the corpus, but it also concentrates risk into fuel availability, scale-up,
      and execution at the first sites.
    claimRefs: [CE002, CE003, CE006, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-roadmap
    title: 2026 evidence shows active program motion, not operating maturity
    body: >-
      Public evidence suggests meaningful motion across fuel, regulatory, and
      deployment workstreams. X-energy’s investor-relations page highlights 2026
      milestones on UK design-review progress and TX-1 construction, while ANS
      coverage shows the company expanding international siting and deployment
      pathways and continuing to advance fuel-facility milestones. Those are real
      indicators that the program is moving beyond concept-stage messaging.
      However, the assigned corpus still does not show a commissioned Xe-100 unit,
      public uptime statistics, or a completed commercial fuel-fabrication ramp.
      The right maturity label is therefore advanced pre-commercialization: ahead
      of many concept-only peers on visible milestones, but still short of
      demonstrating repeatable operating proof.
    claimRefs: [CE008, CE009, CE010]
  - id: trust-safety-and-technical-risk
    title: Safety differentiation is legible; reliability, cyber, and scale-up proof is not
    body: >-
      The main technical risk is not whether X-energy can describe a differentiated
      architecture; it is whether the company can convert a tightly coupled
      reactor-fuel-service design into repeatable delivery. The corpus contains
      repeated intrinsic-safety and modularity claims, plus partner commentary on
      centralized support tooling, but it does not expose public reliability
      metrics, cyber/compliance detail for the monitoring layer, or open developer
      signals that would let outside diligence test adoption or robustness the way
      software infrastructure can be tested. ANS’s broader warning that
      commercialization is harder than reactor design is therefore the right
      adverse lens here. The next material proof points should come from fuel
      qualification, construction execution, operating data, and regulatory
      acceptance—not from additional positioning language.
    claimRefs: [CE011, CE012, CE013, CE014]
