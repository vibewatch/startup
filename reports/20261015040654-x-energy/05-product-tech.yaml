      - ["TX-1 / TX-2 fuel-fabrication assets", "Internal supply chain / future reactor fleet", "TX-1 progressing and TX-2 still developmental in public evidence", "Vertical integration is unusual among SMR peers and underpins the safety + supply case", "NRC-facing capacity and commissioning details are not directly disclosed in the assigned pool"]
      - ["XENITH microreactor path", "Remote / defense / resilient-power users", "Adjacent product path with use cases described but no deployment evidence in corpus", "Extends the platform into off-grid critical operations rather than only grid-scale sites", "Public schedule, customer conversion, and licensing path are unclear"]
      - ["Plant support centers and X-DATA operations layer", "Reactor owners / operators", "Planned lifecycle-service layer rather than proven fleet service", "Centralized monitoring, training, and outage support broaden the product beyond hardware sale", "No public SLA, cyber, or fleet-performance evidence"]
    notes: >-
      Mixes official product descriptions with partner and market-profile summaries;
      maturity labels distinguish disclosed milestones from demonstrated operations,
      and null-equivalent gaps indicate evidence absent from the assigned corpus.
    claimRefs: [CE001, CE005, CE006, CE007, CE010, CE013]
  - id: TE002
    title: Workflow and use-case table
    columns:
      - User job
      - Current workflow
      - X-energy solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Replace fossil heat and onsite power at industrial facilities", "Burn fossil fuel for steam while also buying grid power", "Xe-100 four-pack positioned for process heat plus electricity", "Official materials claim broader decarbonization use than conventional nuclear", "No disclosed achieved tariff, heat-delivery performance, or operating case study"]
      - ["Provide firm clean generation alongside intermittent resources", "Combine renewables with conventional firming resources", "Load-following Xe-100 modules for baseload and flexible support", "Official materials cite ramping and modular deployment format", "No public grid-operations or reliability proof"]
      - ["Supply resilient off-grid power for critical operations", "Diesel, fragile grids, or expeditionary backup systems", "XENITH concept for remote communities, military sites, and emergency backup", "Partner materials position 24/7 independent clean power as the benefit", "Product remains pre-deployment in assigned evidence"]
      - ["Assure advanced-fuel availability for reactor customers", "Depend on third-party fuel or government programs", "In-house TRISO-X plus TX-1 / TX-2 fabrication path", "Vertical control over fuel quality and timing is a strategic differentiator", "HALEU sourcing and commercial production ramp remain execution risks"]
    notes: >-
      “Measurable benefit” captures what the retained sources explicitly claim, not
      independent operating outcomes; where proof is not public, the limitation
      column records the missing denominator.
    claimRefs: [CE002, CE003, CE004, CE005, CE013]
  - id: TE003
    title: Technology and delivery-dependency architecture
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Main risk
    rows:
      - ["Xe-100 HTGR module", "Generate electricity and high-temperature heat from modular reactors", "Reactor licensing, EPC execution, and first-site construction", "First-of-a-kind build path remains unproven in operation"]
      - ["TRISO particle and pebble fuel", "Carry the fuel-integrity and safety proposition for the platform", "HALEU availability plus qualified fabrication scale-up", "Fuel bottlenecks would delay every downstream deployment"]
      - ["TX-1 / TX-2 fabrication footprint", "Convert fuel IP into commercial supply for fleet rollout", "NRC milestones, capex execution, and process yield at scale", "Corpus does not provide direct public proof of full commercial throughput"]
      - ["Plant support centers / X-DATA", "Centralize monitoring, training, maintenance planning, and outage support", "Installed base large enough to justify shared support infrastructure", "No public cyber/compliance pack or fleet KPI set"]
      - ["Deployment / partner ecosystem", "Translate product into operating projects and localized regulatory progress", "Customer commitment, permitting, and partner execution", "Announced partnerships can outrun physical delivery"]
    notes: >-
      This table focuses on dependencies and failure modes rather than repeating the
      product catalog; risk labels are sourced from retained evidence and from
      explicit corpus gaps, not from assumed reactor economics.
    claimRefs: [CE002, CE003, CE008, CE009, CE010, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      X-energy’s public product story is a six-layer stack from customer workload
      through reactor, fuel, fabrication, operations tooling, and deployment
      partnerships.
    data:
      layers:
        - label: Customer workloads
          detail: Industrial steam and power, firm clean generation, and remote resilient-power use cases drive the commercialization narrative.
          modules:
            - Process heat and electricity for industrial sites
            - Firm clean generation for grid and large-load buyers
            - Remote / defense / emergency-backup resilience use cases
        - label: Reactor product
          detail: Xe-100 is the flagship HTGR module, publicly described as an 80-MWe design deployed as a four-unit 320-MWe plant.
          modules:
            - Helium-cooled high-temperature gas reactor
            - Modular four-pack plant architecture
          outputs:
            - Electricity
            - High-temperature heat / steam
        - label: Fuel system
          detail: TRISO-X pebble fuel is presented as the safety and performance enabler for every reactor path in the portfolio.
          modules:
            - TRISO particles
            - Graphite pebbles
            - HALEU-based fuel supply chain
        - label: Fabrication assets
          detail: TX-1 progress and TX-2 development show that commercial rollout depends on fuel-fabrication scale-up, not only reactor design.
          modules:
            - TX-1 construction path
            - TX-2 expansion path
          outputs:
            - Commercial fuel supply
        - label: Operations and support layer
          detail: Plant Support Centers and X-DATA are meant to convert the platform into a lifecycle service model with monitoring and training.
          modules:
            - Remote monitoring
            - Operator training
            - Maintenance planning
            - Outage support
        - label: Deployment envelope
          detail: The public roadmap depends on customers, regulators, and deployment partners to turn the technical stack into operating sites.
          modules:
            - Dow / industrial deployment path
            - Energy Northwest / Amazon-backed pathway
            - UK and Canada expansion pathways
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE013]
callouts:
  - calloutType: strength
    title: Vertical integration is the clearest differentiator in the corpus
    body: >-
      The assigned evidence consistently shows X-energy trying to own reactor
      hardware, proprietary fuel, and lifecycle support simultaneously, which is a
      stronger moat than a reactor-only commercialization story.
    claimRefs: [CE001, CE006, CE007, CE013]
  - calloutType: risk
    title: Public proof is still milestone-based rather than operating-data-based
    body: >-
      The program shows visible 2026 motion, but the corpus still lacks commissioned
      units, public uptime data, and direct commercial fuel-output proof, so
      execution risk remains concentrated in first-project and fuel-ramp delivery.
    claimRefs: [CE009, CE010, CE014]
