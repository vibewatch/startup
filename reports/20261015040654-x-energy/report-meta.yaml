companyProfile:
  summary: >-
    X-energy is an advanced-nuclear developer headquartered in Rockville, Maryland, founded in 2009 by Kam Ghaffarian
    and led by CEO Clay Sell. The company is built around a two-product stack: the Xe-100 high-temperature gas-cooled
    SMR and the TRISO-X fuel platform. Its public materials and assigned evidence point to industrial heat,
    utility-scale generation, and AI/data- center power customers, but the business still lacks commercial reactor
    operating history and fully disclosed project economics.
