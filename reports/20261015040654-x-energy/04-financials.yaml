schemaVersion: report-v2
artifact: financials
slug: x-energy
runDate: 2026-10-15
company:
  name: X-energy
chapter:
  number: 4
  title: Financials
  summary: >-
    X-energy's public financials still describe a pre-commercial advanced-nuclear
    developer funded by services revenue, DOE grant income, and a step-change IPO
    rather than reactor deliveries. Q1 2026 revenue and grant income of $43.4
    million sat against $109.5 million of operating expense and heavy investing
    outflows tied to TX-1 and other buildout needs, although quarter-end
    liquidity of $944.0 million was later supplemented by about $1.1 billion of
    net IPO proceeds. The key underwriting blocker is not near-term liquidity
    alone, but the absence of public reactor, fuel, and long-term service pricing
    and the lack of final investment decisions behind the headline 144-reactor
    pipeline.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      Public disclosure still shows X-energy in a pre-commercial phase for reactor
      deployment: reported revenue is coming from services performed and grant
      reimbursement, not from delivered reactors or disclosed long-term fuel
      contracts. In 1Q 2026, the company reported $43.4 million of total revenue
      and grant income, with $39.9 million from services revenue and $3.5 million
      from grant income, and management tied the growth primarily to higher ARDP
      activity. That mix matters because the company's older public-market
      materials described the intended monetization stack as technology licensing,
      fuel sales, and recurring services, yet the visible income statement still
      reflects development-stage project work. Public traction language around a
      144-reactor / 11.5 GWe pipeline therefore signals demand interest, but it
      does not yet establish contracted, recurring commercial revenue.
    claimRefs: [CI001, CI002, CI003, CI011, CI014]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics proxies
    body: >-
      The clearest public unit-economics signal is still cost absorption rather
      than contribution margin. X-energy reported $109.5 million of total
      operating expense in 1Q 2026, including $65.4 million of direct costs,
      against only $43.4 million of reported revenue and grant income. Operating
      cash outflow was $67.3 million and investing outflow was $166.0 million,
      including $43.0 million of capex, so the business remains highly dependent
      on external capital while it builds TX-1 and continues reactor-development
      work. Public third-party summaries also point to concentration risk: the
      only surfaced customer-mix disclosure attributes 92% of reported revenue
      and grant income to the U.S. Government and 4% to Dow. That is directionally
      useful for underwriting, but it is still far short of the pricing, backlog,
      and margin data required to model steady-state economics.
    claimRefs: [CI002, CI004, CI005, CI006, CI013]
    tableRefs: [TI003]
  - id: liquidity-and-capital-needs
    title: Liquidity and capital needs
    body: >-
      Near-term liquidity improved substantially in 2026, but X-energy still
      looks like a financing-dependent infrastructure platform rather than a
      self-funding operating company. As of March 31, 2026, management reported
      $944.0 million of total liquidity and no debt outstanding, then disclosed
      roughly $1.1 billion of net IPO proceeds after the April listing. The IPO
      was first marketed at $16.00 to $19.00 per share and ultimately priced an
      upsized 44.25 million-share deal at $23 per share, which suggests capital
      market demand was stronger than the initial filing range implied. But the
      stated uses of that cash are broad—working capital, R&D, sales and
      marketing, G&A, capital expenditures, supply-chain activity, and future
      growth projects—so the raise relieves funding pressure without answering
      project-level economics or final funding needs for fleet deployment.
    claimRefs: [CI007, CI008, CI009, CI010]
    tableRefs: [TI002]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is therefore mixed. X-energy now has a materially
      stronger balance-sheet cushion than it did before the IPO, and its intended
      business model can support attractive recurring economics if reactor,
      fuel, and services monetization eventually land as management has framed
      them. However, the current public evidence is still dominated by grant- and
      services-based revenue, widening historical losses, concentration in
      government-linked work, and a project pipeline that assumes contingent
      rights are fully exercised. Independent reporting also highlights that no
      reactor project had yet reached final investment decision at IPO time and
      that ARDP timing, HALEU availability, and Amazon contract terms could
      materially pressure economics or liquidity. Underwriting should therefore
      treat the current equity story as well-funded optionality rather than as a
      modelable contracted-cash-flow business.
    claimRefs: [CI001, CI011, CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Development services
        - Cost-reimbursable and services revenue tied to funded reactor/fuel work
        - USD revenue
        - $39.9m in 1Q 2026
        - Officially reported, but still development-stage and not proof of fleet economics
        - Revenue recognition by program, customer, and milestone
      - - Grant income
        - DOE-linked grant reimbursement under ARDP activity
        - USD grant income
        - $3.5m in 1Q 2026
        - Officially reported, but non-recurring and tied to public support
        - Reimbursement timing, eligible spend, and continuation assumptions
      - - Technology licensing
        - Intended reactor monetization via license economics
        - License fee / royalty
        - Not publicly disclosed
        - Management-described future revenue stream, not yet visible in reported mix
        - Signed commercial terms, milestone schedule, and royalty mechanics
      - - TRISO-X fuel and long-term services
        - Fuel supply plus operations / maintenance / regulatory support
        - Fuel and service contract pricing
        - Not publicly disclosed
        - Part of stated target model, but no public price or margin data
        - Fuel price deck, supply agreement terms, service scope, and margin targets
    notes: >-
      Current values come from 1Q 2026 reporting; null or undisclosed rows mark
      future monetization streams for which public pricing and realized margin
      data are still unavailable.
    claimRefs: [CI001, CI002, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Mechanism
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Reactor technology licensing
        - Not publicly disclosed
        - No realized public pricing disclosed
        - Royalty rate, milestone timing, geography, and customer economics undisclosed
        - 2022 go-public materials
      - - TRISO-X fuel sales
        - Not publicly disclosed
        - No realized public pricing disclosed
        - Price per fuel load / pebble, enrichment pass-throughs, and customer commitments undisclosed
        - 2022 go-public materials plus 2026 risk review
      - - Long-term services
        - Not publicly disclosed
        - No realized public pricing disclosed
        - Scope, margin profile, and contract duration undisclosed
        - 2022 go-public materials
      - - Public equity financing benchmark
        - IPO marketed at $16.00-$19.00 per share and priced at $23.00 per share
        - Realized capital price exceeded the initial range
        - This is financing pricing, not customer revenue pricing
        - 2026 IPO launch and pricing releases
    notes: >-
      Customer-facing commercial pricing is largely absent from the public corpus,
      so the only hard price points are equity-financing disclosures rather than
      reactor, fuel, or service contract economics.
    claimRefs: [CI008, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 1Q 2026 total revenue and grant income
        - $43.4m
        - Medium
        - Sets the current scale of disclosed activity, but not recurring commercial revenue quality
        - Split by customer, contract, and recurring vs non-recurring mix
      - - 1Q 2026 total operating expenses
        - $109.5m
        - Medium
        - Shows the current cost base materially exceeds disclosed revenue
        - Functional opex bridge across R&D, SG&A, and deployment support
      - - 1Q 2026 operating cash outflow
        - $67.3m
        - Medium
        - Best public proxy for near-term cash burn before project-level cash inflows mature
        - Monthly burn bridge and expected working-capital swings
      - - 1Q 2026 investing cash outflow
        - $166.0m, including $43.0m of capex
        - Medium
        - Highlights capital intensity of TX-1 and related infrastructure buildout
        - Remaining capex, DOE reimbursement schedule, and TX-2 timing
      - - Publicly surfaced customer concentration
        - 2 customers; U.S. Government 92%, Dow 4%
        - Low
        - Indicates concentration and that reported revenue is not yet broadly diversified
        - Contracted backlog, cancellation rights, and concentration for the full pipeline
    notes: >-
      These are public proxies rather than full unit economics; X-energy does not
      publicly disclose reactor ASPs, fuel pricing, realized gross margin by
      product, CAC, or payback.
    claimRefs: [CI002, CI004, CI005, CI006, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Current public revenue is still a development-work bridge that converts funded activity into reported revenue, then into a cash draw rather than visible gross profit.
    data:
      nodes:
        - id: funded-activity
          label: Funded project activity
          value: DOE ARDP work plus partner development programs
          note: Current recognition still follows funded engineering, licensing, and fuel-development activity.
        - id: services-revenue
          label: Services revenue
          value: 39.9
          unit: USDm
          note: 1Q 2026 reported services revenue.
        - id: grant-income
          label: Grant income
          value: 3.5
          unit: USDm
          note: 1Q 2026 reported grant income.
        - id: total-revenue
          label: Total revenue + grant income
          value: 43.4
          unit: USDm
          note: 1Q 2026 reported total.
        - id: direct-costs
          label: Direct costs
          value: 65.4
          unit: USDm
          note: Direct costs exceeded current reported revenue and grant income.
        - id: operating-cash-draw
          label: Operating cash draw
          value: 67.3
          unit: USDm
          note: Quarterly operating cash outflow before post-quarter IPO proceeds.
      edges:
        - from: funded-activity
          to: services-revenue
          label: reimbursable work
        - from: services-revenue
          to: grant-income
          label: augmented by
        - from: grant-income
          to: total-revenue
          label: combines into
        - from: total-revenue
          to: direct-costs
          label: absorbed by
        - from: direct-costs
          to: operating-cash-draw
          label: still leaves
    approximationNotes: >-
      Sequence is conceptual rather than accounting-formal; it shows how current
      disclosed activity converts into reported revenue and cash usage using 1Q
      2026 public figures.
    claimRefs: [CI001, CI002, CI005, CI006]
callouts:
  - calloutType: insight
    title: IPO cash improved resilience, not revenue quality
    body: >-
      The April 2026 IPO materially improved near-term liquidity, but the
      reported income statement is still dominated by services revenue and grant
      income rather than by disclosed reactor, fuel, or recurring service sales.
    claimRefs: [CI001, CI007, CI008, CI009]
  - calloutType: risk
    title: The real blocker is undisclosed project economics
    body: >-
      Public evidence still does not show reactor ASPs, TRISO-X fuel pricing,
      long-term service pricing, or customer-level backlog conversion, so the
      pipeline cannot yet be translated into underwritable gross profit or cash
      flow.
    claimRefs: [CI011, CI014, CI015, CI016]
