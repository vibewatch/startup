figures:
  - id: FU001
    title: Customer journey from funded prototype to multi-site expansion
    type: journey-map
    summary: >-
      The disclosed path moves from government-funded prototype work to anchor industrial and
      utility projects, with expansion optionality arriving before operating-fleet proof.
    data:
      nodes:
        - label: Government-funded prototype
          touchpoints:
            - "DoD Project Pele expands an existing relationship and funds prototype work."
        - label: Industrial anchor site
          touchpoints:
            - "Dow becomes the named Long Mott host while licensing work continues."
        - label: Utility siting partner
          touchpoints:
            - "Energy Northwest considers up to 12 Xe-100 modules in Washington."
        - label: Hyperscaler-backed scale-up
          touchpoints:
            - "Amazon funds four Cascade reactors and holds a >5 GW option by 2039."
        - label: UK geography expansion
          touchpoints:
            - "Centrica advances UK design review and broader deployment ambition."
        - label: Commercialization bottleneck
          touchpoints:
            - "Most proof is still announcements, permitting, and option structures rather than operating plants or renewal metrics."
    approximationNotes: >-
      Sequence summarizes disclosed customer-development stages from the assigned pool and should not
      be read as a timed conversion funnel or as proof that every node converts into operations.
    claimRefs: [CU003, CU007, CU008, CU009, CU010, CU015]
callouts:
  - calloutType: strength
    title: Strategic names are real, even if fleet utilization is not yet proven
    body: >-
      X-energy's public customer surface is unusually strong for an advanced-nuclear company at this
      stage: DoD, Dow, Amazon, Energy Northwest, and Centrica all appear in the assigned evidence.
    claimRefs: [CU003, CU004, CU007, CU015]
  - calloutType: risk
    title: Durability is still an underwriting gap
    body: >-
      The customer story has logos and pipeline, but not disclosed retention metrics; the only hard
      revenue-mix datapoint in the pool shows high concentration in two customers during Q1 2026.
    claimRefs: [CU011, CU012, CU013]
