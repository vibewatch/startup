company:
  name: X-energy
chapter:
  number: 6
  title: Customers
  summary: >-
    X-energy has stronger named-customer surface area than most pre-deployment advanced-nuclear peers:
    the assigned evidence names the U.S. Department of Defense, Dow, Amazon, Energy Northwest,
    and Centrica across government, industrial, utility, hyperscale, and UK-market channels.
    The weakness is durability and maturity: the public proof is still dominated by contracts,
    permitting, design-review, and option structures, while the one hard monetization datapoint in
    the pool shows Q1 2026 concentration in just two disclosed customers.
sections:
  - id: customer-segments-and-anchor-counterparties
    title: Customer segments are identifiable, but mostly through strategic counterparties rather than broad installed use
    body: >-
      The assigned source set supports a segmented customer picture even though X-energy does not
      disclose a broad customer count. Official materials repeatedly frame the commercial offer as
      Xe-100 reactors plus TRISO-X fuel for clean-power customers, while third-party and partner
      sources attach that offer to a small set of named anchor counterparties. The clearest segment
      buckets are government-funded prototype work with the U.S. Department of Defense, industrial
      decarbonization with Dow, utility and hyperscaler-backed development with Energy Northwest and
      Amazon, and UK market-entry with Centrica. That is meaningful proof that real buyers, hosts,
      and strategic partners exist, but it is not yet the same thing as a diversified operating base
      with many live plants, repeat purchase behavior, or disclosed renewal evidence.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
    tableRefs: [TU001, TU003]
  - id: pipeline-breadth-versus-operating-proof
    title: Pipeline claims are large, yet public customer proof remains pre-operational
    body: >-
      Breadth is the strongest part of the customer story. Scanx says X-energy is advancing more
      than 11 GW of capacity with Dow, Amazon, and Centrica, while Siemens' case study goes
      further and describes an order book of 144 Xe-100 reactors tied to those names. Those are
      unusually strong strategic logos for an advanced-nuclear vendor and they suggest land-and-expand
      optionality, especially around Amazon's stated multi-gigawatt option. However, the same public
      record still places flagship programs in permitting, design review, or long-dated construction
      timelines: Dow's Long Mott project is in licensing, the Cascade project is still expected to
      come online only in the mid-2030s, and Centrica's latest visible step is UK design review.
      The commercial narrative is therefore substantial in scope but still thin on proof of current
      production deployment and operating utilization.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU014, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration-remain-the-main-gaps
    title: Durability and concentration are the weakest verified surfaces
    body: >-
      The chapter's most decision-useful negative datapoint is concentration. Silicon Valley
      Investclub reports that Q1 2026 revenue and grant income came from only two customers, with
      the U.S. Government contributing 92% and Dow 4%, which implies disclosed monetization still
      depends heavily on government-backed work rather than a broad fleet of commercial plants.
      Just as important, the assigned pool does not provide NRR, GRR, churn, renewal-rate,
      customer-satisfaction, contract-length, or active-customer disclosures. Even X-energy's own
      current investor-relations surface continues to communicate traction mostly via milestone news
      rather than usage or cohort reporting. The result is a customer story that is strategically
      credible but still hard to underwrite for durability.
    claimRefs: [CU011, CU012, CU013]
