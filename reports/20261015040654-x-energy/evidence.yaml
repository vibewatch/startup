evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: Full current board roster, committee assignments, and more complete executive biographies.
    whyItMatters: Governance quality and succession depth affect underwriting of key-person dependency and public-company readiness.
    diligencePath: Pull the latest proxy or annual report and map directors, committees, and voting/control rights.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Ownership percentages, customer contract values, and clearer separation between investors, counterparties, and
      pipeline partners.
    whyItMatters: The chapter can name important stakeholders, but not yet quantify economic dependence or control.
    diligencePath: >-
      Review the S-1/prospectus ownership tables, customer disclosures, and project agreements for concentration and
      governance rights.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Clean current valuation support, including private-round post-money values and a primary-source public-company
      capitalization reference.
    whyItMatters: >-
      The assigned pool supports chronology and proceeds but not a defensible valuation bridge from private rounds to
      current trading.
    diligencePath: >-
      Use the IPO prospectus, post-IPO cap table, and current share-count/exchange data to rebuild valuation from
      primary sources.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance disclosure
    missingEvidence: Board composition, committee charters, insider ownership, and any founder or insider voting-control mechanics.
    whyItMatters: >-
      Without governance detail, the chapter cannot conclude whether the IPO materially reduced founder and management
      concentration risk.
    diligencePath: Review SEC governance disclosures and investor-relations governance materials after the IPO.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: customer count and backlog economics
    missingEvidence: Active customer count, contracted backlog value, reactor pricing, and customer-level commercial terms.
    whyItMatters: >-
      The company cites strategic counterparties and a large pipeline, but those facts do not convert directly into
      underwritable revenue or margin expectations.
    diligencePath: Request customer schedules, project term sheets, and backlog-to-revenue bridge materials in diligence.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: reactor-pricing
    missingEvidence: Public reactor pricing, project-level tariffs, fuel pricing, and margin disclosure for Xe-100 deployments.
    whyItMatters: >-
      Without price and margin data, public market-size claims cannot be translated into revenue quality, payback, or
      valuation sensitivity.
    diligencePath: >-
      Request customer term sheets, pricing schedules, and unit-economics bridges for Dow, Energy Northwest,
      Amazon-linked projects, and any U.K. deployments.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Independent market research or customer-budget data that isolates X-energy's realistic near-to-medium-term SAM and
      SOM by geography and buyer segment.
    whyItMatters: The current public record supports a long-term opportunity narrative but not a defendable near-term capture model.
    diligencePath: >-
      Obtain third-party advanced-nuclear demand studies, project financing assumptions, and segment-specific buyer
      budgets for industrial heat, utility baseload, and hyperscaler-linked load growth.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: backlog-conversion
    missingEvidence: >-
      Contract terms showing how contingent rights in the 144-reactor pipeline convert into binding backlog, including
      cancellation rights and milestone dependencies.
    whyItMatters: >-
      The difference between contingent pipeline and contracted backlog determines how much of the opportunity deserves
      valuation credit today.
    diligencePath: >-
      Review MOUs, LOIs, framework agreements, and any board-approved project milestones for Dow, Amazon, Centrica,
      Talen, and Kentucky utility discussions.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Signed reactor pricing, fuel supply pricing, and customer tariff or returns data for Xe-100 and comparable peer
      projects.
    whyItMatters: >-
      Without price and unit-economics evidence, the chapter can compare commercial models but cannot prove cost
      leadership or buyer savings.
    diligencePath: >-
      Obtain S-1 economics appendices, utility filings, customer contracts, or project-finance materials that disclose
      reactor, fuel, and power-price assumptions.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-evidence
    missingEvidence: >-
      Independent customer interviews, procurement records, or filings showing named win-loss outcomes versus Oklo,
      NuScale, TerraPower, Westinghouse, or status-quo alternatives.
    whyItMatters: >-
      Current sources identify peers and partnerships but do not verify how often X-energy wins a real buying process or
      why buyers defect.
    diligencePath: >-
      Review procurement dockets, interconnection applications, utility board materials, and customer case studies for
      named reactor-selection decisions.
    relatedQuestionRefs:
      - QP001
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: reactor-and-fuel-pricing
    missingEvidence: >-
      Signed reactor pricing, technology-license economics, TRISO-X fuel pricing, and long-term service pricing by
      customer or project.
    whyItMatters: >-
      Without price and gross-margin inputs, the current services-and-grants revenue base cannot be translated into
      underwritable long-term revenue quality or contribution margin.
    diligencePath: >-
      Request signed customer contracts, board pricing assumptions, and project pro formas for Dow, Amazon-backed
      projects, Centrica, and other anchor customers.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback period, sales-cycle duration, proposal win rates, and business-development spend by vertical.
    whyItMatters: >-
      GTM efficiency cannot be underwritten from public services-and-grants revenue alone, especially for a
      capital-intensive deployment model.
    diligencePath: >-
      Request funnel data, customer-acquisition spend, signed-pipeline conversion, and commercial team productivity
      metrics.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: backlog-conversion
    missingEvidence: >-
      Contracted backlog value, cancellation terms, and final-investment-decision milestones behind the 144-reactor /
      11.5 GWe pipeline.
    whyItMatters: Pipeline volume does not equal contracted revenue, margin, or financing certainty.
    diligencePath: >-
      Request signed term sheets, option terms, milestone payment schedules, and project-finance / FID timetables for
      each anchor project.
    relatedQuestionRefs:
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: capital-program
    missingEvidence: Remaining TX-1 and TX-2 capex, DOE reimbursement cadence, and post-ARDP funding obligations by project.
    whyItMatters: >-
      Reported liquidity is substantial, but runway and future financing dependency still hinge on how much capital
      remains to be deployed.
    diligencePath: >-
      Request facility-level capex budgets, reimbursement schedules, covenant packages, and project-level financing
      plans.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability-security-proof
    missingEvidence: >-
      Public uptime, outage, refueling, cybersecurity, and compliance evidence for the operations layer and any deployed
      Xe-100 system.
    whyItMatters: >-
      Without field-performance and control evidence, the product can be judged on architecture and milestones but not
      on operating robustness.
    diligencePath: >-
      Request operating dashboards, security or quality certifications, incident logs, and any pilot or test-site
      performance packages from management.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal-gap
    missingEvidence: >-
      A genuine developer or practitioner adoption surface such as repositories, public API docs, package registries, or
      a documented substitute metric set.
    whyItMatters: >-
      Companies with software or control layers are easier to diligence when third parties can observe release cadence,
      integration surfaces, or community troubleshooting.
    diligencePath: >-
      Ask management for product docs, customer integration materials, or public practitioner references that validate
      the monitoring and support tooling.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: fuel-scale-up
    missingEvidence: >-
      Direct source proof for TX-1 or TX-2 commercial throughput, commissioning timing, HALEU sourcing, and cost or
      yield assumptions.
    whyItMatters: >-
      The reactor roadmap is tightly coupled to fuel availability, so uncertainty in fabrication scale-up is a
      company-level product risk rather than a back-office detail.
    diligencePath: >-
      Pull NRC and company technical filings, fuel-supply contracts, and project schedules tied specifically to TX-1 and
      TX-2.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Public disclosure of NRR, GRR, churn, renewal rates, contract length, cohort behavior, or customer satisfaction
      metrics.
    whyItMatters: >-
      Without durability metrics, the chapter cannot distinguish sticky long-cycle customer relationships from
      milestone-driven project announcements.
    diligencePath: >-
      Request board materials or investor diligence data that show contract duration, renewal mechanics, cohort
      retention, and customer satisfaction by program.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: backlog-conversion
    missingEvidence: >-
      Contract-by-contract backlog value, binding order count, cancellation rights, and stage split inside the >11 GW
      and 144-reactor claims.
    whyItMatters: >-
      Pipeline scale is central to the bullish customer thesis, but without conversion detail it is hard to convert
      headline volume into revenue confidence.
    diligencePath: >-
      Obtain the current backlog schedule, signed commercial agreements, option terms, and stage gates for each named
      project.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU002
      - TU003
  - type: missing-source
    severity: material
    topic: operating-base
    missingEvidence: >-
      Verified count of operating plants, active customer count, commercial fuel deliveries, and a
      production-versus-development split across named counterparties.
    whyItMatters: >-
      Named logos can overstate maturity when most projects are still in licensing or construction rather than
      generating recurring customer usage.
    diligencePath: >-
      Request plant-by-plant deployment status, active-site counts, and customer-operating milestones from management
