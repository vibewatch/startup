  rows:
  - - Fuel control
    - Own TRISO-X fuel program; company says fuel is pivotal to the business model
    - KoalaGains says Oklo relies on sourcing recycled nuclear fuel
    - No in-house advanced fuel moat shown in retained evidence
    - KoalaGains says TerraPower still faces HALEU supply-chain dependence
    - Large incumbent fuel and services base in retained evidence
    - X-energy's strongest differentiator is controlling a scarce fuel input instead of only the reactor design
  - - End-use fit
    - Electricity plus high-temperature industrial heat
    - Data-center and compact power narrative
    - Utility-scale light-water SMR deployment
    - Large utility / coal-transition deployment path
    - Incumbent utility fleet plus AP300 and eVinci options
    - X-energy competes on industrial heat and data-center adjacency, not only generic grid capacity
  - - Regulatory proof point
    - Foreign buyers still want a U.S. first deployment and top-tier approval
    - No equivalent retained evidence of a completed licensing proof point
    - KoalaGains cites first U.S. NRC-approved SMR design
    - House testimony and KoalaGains both place TerraPower in the ARDP / permit race
    - KoalaGains describes globally licensed incumbent reactor programs
    - Trust and permitting still let incumbents and better-proven peers slow X-energy adoption
  - - Distribution / buyer trust
    - Amazon, Dow, and Centrica partnerships but no operating plant yet
    - Tech-sector narrative and Meta relationship in retained evidence
    - Utility relationships but lingering execution baggage after UAMPS
    - PacifiCorp and Gates-backed credibility in retained evidence
    - Installed base and long utility relationships
    - Partner access helps X-energy, but incumbents still enter with stronger installed-base trust
