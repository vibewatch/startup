callouts:
- calloutType: insight
  title: Fuel verticalization is the clearest moat
  body: Among the retained sources, the most defensible reason X-energy can win is that it is not just selling a reactor concept. It is trying to control the fuel, the licensing story, and the customer relationship at the same time, which is a different posture from peers that depend more heavily on third-party fuel or a single deployment narrative.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP015
- calloutType: risk
  title: Competitive edge still depends on first deployment and disclosed economics
  body: The public evidence shows meaningful partner demand, but it also shows that customers want a demonstrated U.S. plant, that project cycles are measured in years, and that sector financing can reverse quickly after a high-profile cancellation. Until X-energy clears those milestones with visible economics, incumbents and better-proven peers can still frame it as a promising but unproven option.
  claimRefs:
  - CP004
  - CP007
  - CP010
  - CP012
