  rows:
  - - X-energy
    - Direct advanced-reactor developer plus fuel supplier
    - April 2026 IPO at $23/share; >11 GW order pipeline in CNBC coverage
    - Utilities, data centers, and industrial heat users
    - HTGR design paired with TRISO-X fuel and a licensing-plus-fuel commercial model
    - No reactor facility under construction yet in CNBC coverage
  - - Oklo
    - Direct startup peer
    - Public company; KoalaGains cites a 1.2 GW Meta agreement
    - Data centers and behind-the-meter power
    - Fast-fission microreactor narrative and Silicon Valley distribution story
    - Pre-revenue and still early on physical scale in retained evidence
  - - NuScale
    - Direct startup peer
    - Public company; KoalaGains cites ~6 GW pipeline and first U.S. NRC-approved SMR design
    - Utility-scale generation
    - Licensed light-water SMR approach with longer regulatory history
    - Flagship UAMPS project cancellation remains a visible sector warning
  - - TerraPower
    - Direct private peer
    - ARDP peer; KoalaGains highlights Kemmerer construction and large private capital backing
    - Utility and coal-site conversion projects
    - Natrium design plus deep sponsor capital
    - Depends on its own HALEU and first-plant execution path
  - - Westinghouse
    - Incumbent substitute / entrant
    - KoalaGains says it services roughly half the world's commercial nuclear fleet
    - Global utilities and nuclear operators
    - Installed base, fuel services, AP300 SMR, and eVinci microreactor programs
    - Competes from incumbent strength rather than X-energy's specific HTGR architecture
  - - BWX Technologies
    - Adjacent incumbent competitor
    - KoalaGains cites profitable recurring revenue and a dominant naval-reactor position
    - Defense, components, and advanced-reactor-adjacent supply
    - Established nuclear manufacturing and government relationships
    - Not the same commercial HTGR product as Xe-100
