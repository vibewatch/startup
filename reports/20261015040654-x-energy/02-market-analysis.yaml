  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Industrial heat + power
        - Dow / industrial site owner
        - Site operations consuming electricity and high-temperature steam
        - Industrial sponsor and project-finance stack
        - Permit, construct, and operate on or near a heavy-industrial site
        - Corporate capex and decarbonization leadership
        - Need to replace fossil steam and power with firm zero-carbon supply
      - - Utility-scale baseload generation
        - Utilities or power-development partners
        - Grid operators and utility customers
        - Utility balance sheet, rate base, or contracted project structure
        - Site selection, permitting, interconnection, and fleet rollout
        - Utility development and generation planning teams
        - Coal replacement, reliability, and load-growth needs
      - - Hyperscaler-enabled capacity
        - Utility/project developer with hyperscaler-backed demand signal
        - Data-center loads and associated grid demand
        - Utility/project vehicle, potentially de-risked by anchor offtake
        - Early feasibility and partnership structuring before reactor build
        - Utility development teams plus large-load customer strategy
        - AI/data-center load growth that needs firm clean power
      - - U.K. fleet entry
        - Energy partner / developer with regulator engagement
        - National grid and industrial/offtaker customers
        - Developer consortium and eventual project financing
        - Generic Design Assessment followed by site-specific deployment
        - Country entry team and strategic energy partner
        - New-market entry once design review opens a licensing path
    notes: Buyer, payer, and workflow roles are inferred from disclosed project structures; public sources identify the counterparties and use cases but not final contract structures.
    claimRefs: [CM006, CM007, CM009, CM010, CM011]
