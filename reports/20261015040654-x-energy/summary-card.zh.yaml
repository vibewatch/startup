  topStrengths:
    - Xe-100 反应堆加上 TRISO-X 燃料，让 X-energy 的商业化故事不止于押注单一 SMR 资产。
    - DOE 支持、后期私募融资和成功上市，显示出异常强的资本获取能力。
    - Dow、Amazon、Centrica 和 Energy Northwest 等明确列出的交易对手，证明战略需求牵引具备可信度。
  topRisks:
    - 商用反应堆尚无运营历史，项目经济性仍未经验证。
    - 管线和订单转化仍取决于后续条件，项目层面的定价也未披露。
    - 即使完成 IPO，治理、股权结构和估值透明度仍不完整。
  unresolvedGaps:
    - Series C-1 和 Series D 的投后估值尚未公开披露；广泛报道的 $2.0–2.5B（C-1）和 $3–5B（D）估值来自第三方报道，未经确认；抓取语料中没有 2026-06-14 运行日的 IPO 后市值。
    - >-
      Xe-100 反应堆 ASP、EPC 利润率、TRISO-X 燃料球单价、项目层面 PPA 电价，以及 Dow、Energy Northwest、Amazon 和 Dominion
      购电安排的客户定价均未披露，因此无法评估单位经济性。
    - 员工人数、薪酬费用明细、研发与 SG&A 的拆分，以及超出 GW 当量表述之外的反应堆项目订单金额，均未公开披露。
    - Long Mott（Dow Seadrift）和首个 Energy Northwest 项目尚无最终投资决定、已签署的 EPC 合同或项目融资结构；公开记录中的商业运营日期（2029–2032）只是目标，并非合同约定。
    - 除 Geiger Brothers 的 $40.8M 场地开发阶段外，TX-1 燃料设施的资本开支和调试进度，以及从 TRISO 原型生产爬坡至每年 700,000 个燃料球，仍是关键执行缺口。
    - 抓取的公开记录没有汇总 IPO 后的完整董事会构成和治理权利（委员会章程、投票协议、内部人锁定安排、创始人/CEO 投票权）。
    - 已披露的约 11 GW / 144 台 SMR 订单簿转化为带取消条款的签约订单的经济性尚未披露；该订单簿仍是定性信息。
