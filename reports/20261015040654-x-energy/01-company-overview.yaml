      - ["Martin van Staden", "Senior VP and CTO", "Yahoo Finance names van Staden as CTO, with Yahoo also listing chief scientist and legal/admin executives around him.", "Provides technical leadership coverage beyond founder/CEO roles.", "Medium: the pool shows role coverage, but not board oversight or succession depth."]
