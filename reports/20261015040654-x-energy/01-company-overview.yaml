artifact: company-overview
slug: x-energy
runDate: "2026-10-15"
company:
  name: X-energy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    X-energy enters the October 2026 refresh as a newly public advanced-nuclear company with a
    verified Rockville base, a reactor-plus-fuel product stack, and recent financing milestones
    culminating in its April 2026 Nasdaq IPO. The strongest supported positives are the $700
    million Series D, the IPO, and a company-stated >11 GW pipeline tied to Dow, Amazon, and
    Centrica, while the biggest remaining gaps are clean valuation support, full governance
    disclosure, and customer/backlog economics.
sections:
  - id: identity-and-operating-profile
    title: Identity and operating profile
    body: >-
      The assigned source pool supports a narrow but usable identity baseline. Across the company
      website, Yahoo Finance, Wikipedia, and two third-party tracker pages, X-energy is described
      as a Rockville, Maryland company founded in 2009 that develops advanced nuclear reactors and
      nuclear fuel rather than a software-style recurring-revenue business. The product identity is
      consistent: Xe-100 is the flagship reactor platform and TRISO-X is the associated fuel
      platform. The IPO materials also confirm the company has crossed into public-market stage,
      which matters because it improves comparability on leadership titles, stock-trading context,
      and capital-markets milestones but still leaves several diligence-critical economics
      unpublished in the assigned evidence.
    claimRefs: [CO001, CO002, CO003, CO008, CO011]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Leadership evidence is sufficient to establish founder and operating control, but not full
      governance quality. Kam Ghaffarian is consistently tied to the founding and still appeared as
      founder and executive chairman in the November 2025 Series D announcement, while Clay Sell is
      the current CEO and the only executive in the pool with a clearly supported pre-X-energy
      credential, namely his prior role as U.S. Deputy Secretary of Energy. Yahoo Finance provides
      the clearest named operating bench beneath Sell, including finance, operations, technology,
      science, and legal functions. What the pool does not provide is a board roster, committee
      structure, voting-control picture, or a clean read on whether public-company governance now
      meaningfully reduces key-person dependency at the founder/chair and CEO level.
    claimRefs: [CO004, CO005, CO006]
    tableRefs: [TO002]
  - id: capital-markets-and-stakeholders
    title: Capital markets and stakeholders
    body: >-
      X-energy's capital-markets path is much better supported than its private-round valuation
      history. The company formally launched its IPO roadshow on April 15, 2026, priced 44.3
      million shares at $23 on April 23, and began trading on Nasdaq under XE on April 24. Before
      that listing, X-energy closed an approximately $700 million Series D led by Jane Street in
      November 2025. Third-party tracker pages aggregate total funding at $2.7 billion across four
      reported rounds, but those same pages do not supply clean private-round post-money values, so
      they are useful for chronology and investor names rather than precise underwriting. The same
      evidence shows the commercial narrative is concentrated around a small set of strategic
      counterparties and financiers rather than a broad disclosed customer base.
    claimRefs: [CO007, CO008, CO009, CO010, CO012]
    tableRefs: [TO003]
  - id: milestone-trajectory-and-adverse-signals
    title: Milestone trajectory and adverse signals
    body: >-
      The milestone record shows real progress, but also why this remains an execution-led diligence
      story. Wikipedia captures the 2020 DOE ARDP selection, the abandoned 2022-2023 SPAC path,
      and the November 2023 layoffs, preserving a non-linear capital-formation history before the
      successful 2026 IPO. The November 2025 company financing release adds the strongest supported
      commercial milestone by tying X-energy's claimed orderbook to more than 11 GW and
      approximately 144 SMRs, but that orderbook remains a company statement rather than a
      contracted backlog schedule. Public-market monitoring also turns the chapter from pure company
      narrative into something more mixed: the IBD snapshot shows a multibillion-dollar market cap
      alongside sharp short-term share-price weakness and deeply negative pre-tax margin data,
      underscoring that public listing did not resolve the underlying execution-risk debate.
    claimRefs: [CO009, CO012, CO014, CO015, CO016]
    figureRefs: [FO001]
