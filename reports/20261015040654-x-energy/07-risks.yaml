        - Independent schedule, cost-to-complete, commissioning, and yield evidence.
      - - 2
        - HALEU availability or specification mismatch
        - Medium-high
        - Critical
        - Not established by assigned sources
        - Assigned sources identify HALEU-based fuel but not contracted volume coverage.
        - Feedstock scarcity could delay qualification and production.
        - Supplier contracts, quantities, delivery dates, and contingency inventory.
      - - 3
        - Specialized graphite and component interruption
        - Medium
        - High
        - Mixed
        - Ten-year graphite agreement; IHI relationship remains an exploratory MOU.
