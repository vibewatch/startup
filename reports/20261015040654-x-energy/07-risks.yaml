    rows:
      - - 1
        - Binding customer commitment
        - Dow, Amazon-backed Energy Northwest, Centrica
        - Contingent rights do not convert into FIDs or fee-bearing contracts.
        - Critical
        - Multiple named project pathways
        - No delivered commercial reactor or technology-fee agreement in assigned independent analysis.
        - Lead project loses commitment or misses FID after permit readiness.
      - - 2
        - DOE ARDP economics
        - U.S. Department of Energy
        - Funding timing, scope, or reimbursement no longer covers the development path.
        - Critical
        - IPO liquidity and other project relationships
        - Independent analysis estimates high FY2025 revenue concentration in ARDP.
        - Unfunded cost share or continuation gap before the next value milestone.
      - - 3
        - Capital-market access
        - Public equity investors
        - Share-price volatility raises dilution or funding cost before commercialization.
        - High
        - Approximately $1.1 billion reported IPO net proceeds
        - Operating and construction cash needs continue before commercial revenue.
        - Liquidity no longer covers the next licensing and construction gates.
      - - 4
        - Pipeline conversion
        - Prospective project customers
        - Customers defer or do not exercise contingent reactor rights.
        - High
        - 144-reactor multi-market pipeline
        - The entire 11.5-GWe figure assumes full exercise of contingent rights.
        - Pipeline growth without signed economics, deposits, or conversion evidence.
    notes: Pipeline capacity is company-reported and contingent, IPO proceeds are financing rather than revenue, and ARDP concentration is third-party reported from the assigned analyst source.
