  evidenceGaps:
    - type: missing-source
      severity: material
      topic: legal-and-regulatory-proceedings
      missingEvidence: Current primary dockets for admitted interventions, litigation, enforcement matters, permit conditions, and unresolved regulator questions.
      whyItMatters: A pending legal or adjudicatory matter could alter the licensing schedule, conditions, or cost of the first project.
      diligencePath: Pull the NRC adjudicatory and application dockets, PACER and relevant state court searches, and counsel's regulatory-claims schedule.
      relatedQuestionRefs:
        - QR002
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: customer-and-partner-commitment
      missingEvidence: Executed FIDs, technology-fee agreements, cancellation rights, deposits, project-finance commitments, and customer concentration schedules.
      whyItMatters: Contingent pipeline rights cannot establish contracted backlog, pricing, margin, or durability.
      diligencePath: Review executed agreements in the data room and obtain counterparty confirmations of obligations, milestones, and termination rights.
    - type: missing-source
      severity: material
      topic: operational-quality-and-security
      missingEvidence: Independent Xe-100 safety, cybersecurity, quality-yield, supplier-capacity, incident, recall, and commercial reliability evidence.
      whyItMatters: The absence of a recorded incident in the assigned pool is not evidence of absence, and no commercial operating history is available.
      diligencePath: Commission independent technical, cyber, and quality audits; inspect supplier qualification records, incident logs, and TX-1 commissioning evidence.
