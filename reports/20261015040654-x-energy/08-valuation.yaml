    claimRefs: ["CV005", "CV006", "CV007", "CV009", "CV011"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Pipeline converts into contracted reactor deployments, fuel capacity scales on schedule, and management discloses enough project economics to support platform underwriting.", "Multiple can stay premium because investors are buying scarce advanced-nuclear capacity plus recurring fuel exposure before full cash-flow maturity.", "Licensing, construction, and HALEU supply still have to hold.", "Would require named project conversion and better unit-economics disclosure."]
      - ["Base", "Capital markets keep rewarding strategic scarcity, but public disclosures still center on grants, services, and long-dated deployment milestones.", "Fair value remains difficult to pin down, so upside depends on buying below narrative peaks rather than assuming today's price is obviously cheap.", "Execution slippage can erase the option premium quickly.", "Best fit for the current evidence set."]
      - ["Bear", "Commercial timelines slip, late-stage economics disappoint, or market appetite for pre-cash-flow nuclear names compresses.", "The stock can re-rate on multiple compression before reactor revenues arrive because there is little current operating evidence to defend the valuation floor.", "Downside is amplified by cap-table opacity and limited public economics.", "Supported by weak October trading and the early-2030s deployment timeline."]
    notes: "Scenario ranges are qualitative because retained sources do not disclose reactor ASPs, EPC margins, PPA pricing, or preference-stack economics."
    claimRefs: ["CV003", "CV009", "CV010", "CV011", "CV012", "CV013"]
