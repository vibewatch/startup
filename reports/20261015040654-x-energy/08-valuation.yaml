company:
  name: "X-energy"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Public evidence still supports X-energy as a strategically important advanced-nuclear option,
    but not yet as a cleanly underwritable cash-flow story. The company reached the public market
    at $23 per share, yet independent market coverage still showed XE below that level in October
    2026 while reactor deployment, project economics, and private-round valuation terms remained
    only partially disclosed.
sections:
  - id: "recommendation"
    title: "Recommendation stays price-sensitive"
    body: >-
      The public record supports a research-more stance rather than a buy call. X-energy did complete
      a successful April 2026 IPO, and the capital raise materially strengthened its ability to keep
      funding reactor and fuel execution. But by October 2026 independent coverage still showed the
      stock trading below the IPO price, while the business remained pre-revenue from commercial
      reactor operations and still years away from first deployment. That combination means the market
      is underwriting strategic optionality, not proven operating cash flows. Unless entry price falls
      further or management discloses enough project-level economics to justify the multiple, the
      prudent stance is to keep the company on the diligence list rather than force precision the
      public evidence cannot yet support.
    claimRefs: ["CV002", "CV003", "CV004", "CV008", "CV010", "CV012"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "supporting-thesis"
    title: "What still supports upside"
    body: >-
      The bull case is not imaginary. X-energy has assembled a differentiated two-product platform:
      the Xe-100 reactor plus TRISO-X fuel, rather than a single technology bet. Independent profiles
      also point to unusually deep funding support, including large private rounds before the IPO, and
      to a pipeline narrative tied to the Amazon-backed Cascade project and a broader 11.5 GW orderbook.
      Venture Atlas also credits the company with strong liquidity and expanded DOE support, which gives
      management time to keep advancing fuel manufacturing, licensing, and customer conversion. If that
      capital base converts into contracted reactor deployments and visible fuel margins, today's equity
      could eventually prove to have been an option on a larger platform than current revenue reflects.
    claimRefs: ["CV005", "CV006", "CV007", "CV008", "CV013"]
    tableRefs: ["TV002"]
  - id: "anti-thesis"
    title: "Why the anti-thesis still dominates underwriting"
    body: >-
      The anti-thesis is that the public market still lacks the evidence needed to justify a premium
      valuation with confidence. Yahoo Finance described X-energy at about 19x expected 2026 sales
      despite projected net losses widening to roughly $430 million and first commercial reactors not
      expected until the early 2030s. Independent data providers also leave critical holes around the
      private-round marks and preference stack: Silicon Valley Investclub lists the Series C-1 and
      Series D raises, but not their pre-money or post-money values. That is important because a late-
      stage advanced-nuclear cap table can materially affect effective entry price, dilution, and
      downside protection. Weak October trading momentum reinforces the idea that strategic excitement
      has not yet translated into stable valuation support.
    claimRefs: ["CV003", "CV009", "CV010", "CV011", "CV012"]
  - id: "scenarios-and-diligence"
    title: "Scenario discipline and final diligence asks"
    body: >-
      The right way to underwrite X-energy is through scenario discipline, not a single-point target.
      In a bull case, disclosed reactor economics, fuel-margin visibility, and named project conversion
      could justify paying for a platform before reactors generate cash. In the base case, investors are
      still paying mainly for strategic scarcity and government-backed option value, which argues for
      patience and entry discipline. In the bear case, licensing delays, commercialization slippage, or
      multiple compression could force a sharp re-rating before reactor deployments arrive. The next
      diligence cycle should therefore focus on concrete missing evidence: project-level pricing,
      contracted backlog quality, and the actual late-stage cap-table and preference terms behind the
      pre-IPO financing stack.
    claimRefs: ["CV006", "CV008", "CV010", "CV011", "CV013"]
    tableRefs: ["TV003"]
