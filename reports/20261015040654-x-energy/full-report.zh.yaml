      - number: '3.3'
        title: 护城河真实存在，但仍易受 incumbent 反击和行业执行失败影响
        blocks:
          - type: paragraph
            body: >-
              护城河在方向上可信，但尚未定型。X-energy 可以强调燃料纵向一体化、同时面向工艺热和电力的反应堆格式，以及很长的伙伴名单；但公开证据也说明 incumbents 和同行仍能削弱这一优势。KoalaGains
              将 BWX Technologies 和 Westinghouse 描述为拥有存量基础与收入优势的成熟核能企业；Wikipedia 则记录了两点提醒：BWX 在 Project Pele 中击败
              X-energy，且公司早期 SPAC 计划在市场环境恶化、美国一个高知名度 SMR 项目取消后被放弃。在 X-energy 把早期关系转化为运营中的电站之前，其竞争叙事仍然比实际验证容易。
