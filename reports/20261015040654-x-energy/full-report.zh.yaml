      - number: '2.2'
        title: 规模测算视角很大，但不能直接比较
        blocks:
          - type: paragraph
            body: >-
              最好的公开规模证据是一组受约束的测算视角，而不是一套干净的 TAM / SAM / SOM。X-energy 的 2022 年公开市场交易材料预计，到 2040 年美国、加拿大和英国合计需要 67 GW 的
              SMR，并将其换算为 2040 年约 $500B、2050 年约 $1T 的收入机会。较新的公司披露则从市场机会叙事转向有条件的管线表述：截至 2026 年 3 月 31 日，X-energy 称项目管线覆盖
              144 座反应堆、约 11.5 GWe；另一个与 Amazon 相关的项目则目标是在 2039 年前超过 5
              GW。这些数字有参考价值，但混用了不同分母、时间跨度和确定性水平，因此应视为方向性的采用场景，而不是已经对齐的市场模型。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM012
              - CM013
