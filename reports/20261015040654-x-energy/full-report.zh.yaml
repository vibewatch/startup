      - number: '4.2'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开单位经济性信号仍是成本吸收，而不是贡献利润。X-energy 报告 2026 年第一季度总运营费用 $109.5M，其中直接成本 $65.4M；同期报告收入及补助收入只有 $43.4M。经营现金流出
              $67.3M，投资现金流出 $166.0M，其中包括 $43.0M 资本开支，因此公司在建设
              TX-1、继续反应堆开发期间仍高度依赖外部资本。第三方公开摘要还指向集中度风险：唯一出现的客户组合披露显示，美国政府贡献了已报告收入及补助收入的 92%，Dow 贡献
              4%。这对投资判断有方向性价值，但距离建模稳态经济性所需的定价、 backlog 和利润率数据仍相差甚远。
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
              - CI013
