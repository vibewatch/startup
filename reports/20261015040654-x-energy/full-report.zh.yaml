      - number: '3.4'
        title: 定价与胜负证据仍是最大的投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              保留的来源池足以识别竞争对手和 X-energy 的差异化逻辑，却不足以证明其经济性更优。CNBC 和公司自有材料展示了 X-energy 想如何销售，但分配到的来源没有披露反应堆
              ASP、长期燃料定价、客户电价假设，或相对于 Oklo、NuScale、TerraPower、Westinghouse 和现状方案的经验证胜负记录。因此，本章可以支持战略定位判断，却不能硬性断言 X-energy
              在成本、项目回报或转化率上会胜出，尤其是在首批商业化部署开始争夺资本之后。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
              - CP012
              - CP016
