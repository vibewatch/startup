            body: >-
              如果许可、客户承诺、燃料准备度或资本方面的延迟叠加，投资逻辑就会失效。因此，最有用的监测盘应以里程碑为核心：对照已发布时间表跟踪 NRC 审查进度；关注有约束力的 FID
              和技术费协议，而不是不具约束力的管线权利；跟踪 TX-1 完工和认证是否达到 2028 年上半年目标；确认 HALEU 和关键部件的 secured
              volume；并在拆分经营现金使用、资本开支和投资购买后，按季度跟踪流动性变化。单一有利环境结论或供应商备忘录并不能闭合整条链路。如果主导项目失去客户承诺、所需许可证或燃料里程碑在没有资金支持的进度恢复方案下延误，或流动性覆盖不再跨越下一组决定性监管和施工门槛，就应升级为
              kill criterion。
