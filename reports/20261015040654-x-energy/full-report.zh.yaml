      - number: '1.3'
        title: 资本市场与利益相关方
        blocks:
          - type: paragraph
            body: >-
              X-energy 的资本市场路径远比其私募轮估值历史更有证据支撑。公司于 2026 年 4 月 15 日正式启动 IPO 路演，4 月 23 日以每股 $23 发行 44.3m 股，并于 4 月 24 日以 XE
              代码在 Nasdaq 开始交易。在上市前，X-energy 于 2025 年 11 月完成由 Jane Street 领投的约 $700M Series D。第三方追踪页面将四轮已报告融资合计为
              $2.7B，但这些页面没有给出清晰的私募轮投后估值，因此更适合用来确认时间线和投资人，而不是做精确投资判断。同一批证据还显示，商业叙事集中在少数战略交易对手和融资方，而不是广泛披露的客户基础上。
