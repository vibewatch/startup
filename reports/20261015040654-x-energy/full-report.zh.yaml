  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：X-energy 实际在卖什么
        blocks:
          - type: paragraph
            body: >-
              X-energy 服务的市场比泛化的能源转型叙事更窄。在面向投资人的现有材料中，公司将自己定位为 Xe-100 先进小型模块化反应堆和 TRISO-X
              燃料开发商；反应堆用于提供稳定电力，在特定配置下也提供高温工业蒸汽。因此，最有证据支撑的市场边界包括反应堆部署、燃料供应、许可和监管支持、项目规划支持、施工协调，以及与这些电站配套的长期运营服务。公开资料不足以把边界扩展到全部脱碳支出、泛化电力交易，或传统核资产更广泛的存量市场；证据指向的是先进核能部署，即买方需要可调度的零碳电力或工艺热。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
