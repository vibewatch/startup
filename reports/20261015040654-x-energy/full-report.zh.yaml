  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 交付平台是反应堆 + 燃料 + 支持，而不只是一个反应堆盒子
        blocks:
          - type: paragraph
            body: >-
              X-energy 的交付范围不止一个反应堆模块。在官方 2022 年交易材料、2026 年投资者页面和公开市场资料中，公司始终围绕 Xe-100 高温气冷反应堆、TRISO-X
              球形燃料，以及规划、监管工作、施工协调和长期电站支持服务层来定位。这一点很重要，因为客户流程并不是简单地“买电”；工业和公用事业买方需要有保障的燃料、部署支持，以及运营数十年资产的路径。证据对产品定义和商业化意图支持很强，但对已实现的运营验证弱得多，因此商业组合比现场验证的交付记录更清晰。
            claimRefs:
              - CE001
