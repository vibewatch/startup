      - number: '2.3'
        title: 买方集中在工业、 utility 和大负荷生态
        blocks:
          - type: paragraph
            body: >-
              公开记录中的买方版图比 SAM 数学更具体。一条路径是工业自发电：Dow 正在评估一个使用 Xe-100 机组同时供电和提供高温蒸汽的场址。第二条路径是受监管公用事业或 merchant-power
              部署，X-energy 曾讨论 Energy Northwest、Talen 和 Kentucky 的公用事业路径。第三条路径是大负荷或 hyperscaler 相关需求，Amazon
              支持的部署更像购电方和生态催化剂，而非直接零售反应堆销售。无论哪条路径，采用都需要买方拥有长期基础设施预算、能够承受许可复杂度，并愿意在反应堆经济性尚未在公开市场形成广泛基准前作出承诺。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动因素真实存在，但商业化仍受门槛约束
        blocks:
          - type: paragraph
            body: >-
              X-energy 的市场逻辑受到 AI 相关负荷增长、煤电与化石能源替代，以及同时服务电网和工业流程的稳定零碳供给需求推动。这些驱动因素对估值很重要，因为它们为比单纯供电型 SMR
              更大的项目范围打开了空间。但公开证据也说明采用时间仍不确定：公司对管线仍披露有条件权利，关键部署依赖 NRC 和英国审查等监管里程碑，公开材料也没有拆分反应堆定价、项目层面的电价假设或有说服力的公开
              SOM。因此，这个机会更应被理解为深度很大但仍受门槛约束的基础设施市场，而不是近期已签约 backlog。
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争横跨初创公司、 incumbents 与现状方案
        blocks:
          - type: paragraph
            body: >-
              分配到的证据不支持只围绕一个同业对手比较。独立比较来源将 X-energy 放在一个横跨 Oklo、NuScale、TerraPower、NANO Nuclear
              等先进反应堆初创公司，Westinghouse、BWX Technologies 等 incumbent 供应商，以及 GE Hitachi、Holtec、Kairos Power、Mitsubishi
              Heavy Industries 等相邻厂商的竞争场中。现状方案同样重要：CNBC 指出美国现役机组仍以轻水堆为主，而 X-energy
              推销的是同时面向电网供电和工业热的高温气冷设计。因此，买方可以延后采用、继续使用 incumbent 格式，或选择另一种先进反应堆架构，而不一定转向 Xe-100。
            claimRefs:
