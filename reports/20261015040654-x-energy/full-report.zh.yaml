      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论因此是混合的。X-energy 现在的资产负债表缓冲明显强于 IPO
              前；如果反应堆、燃料和服务变现最终按管理层设想落地，其业务模式可以支撑有吸引力的经常性经济性。然而，当前公开证据仍由补助和服务收入、不断扩大的历史亏损、政府相关业务集中度，以及假设有条件权利全部行使的项目管线主导。独立报道还强调，IPO
              时仍没有任何反应堆项目达到最终投资决策，ARDP 时间表、HALEU 供应和 Amazon
              合同条款都可能显著挤压经济性或流动性。因此，投资判断应把当前股票故事视为资金充足的期权价值，而不是可建模的已签约现金流业务。
