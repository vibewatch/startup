      - number: '4.3'
        title: 流动性与资本需求
        blocks:
          - type: paragraph
            body: >-
              2026 年短期流动性大幅改善，但 X-energy 仍像一个依赖融资的基础设施平台，而不是能够自我造血的运营公司。截至 2026 年 3 月 31 日，管理层报告总流动性 $944.0M、无未偿债务；随后披露
              4 月上市后 IPO 净募资约 $1.1B。IPO 最初以每股 $16.00–$19.00 推介，最终将扩大后的 44.25m 股交易定价为每股
              $23，这说明资本市场需求强于初始申报区间所暗示的水平。但这笔现金的用途表述很宽泛——营运资金、研发、销售与营销、G&A、资本开支、供应链活动和未来增长项目——因此募资缓解了资金压力，却没有回答项目层面经济性或车队部署最终所需资金。
            claimRefs:
              - CI007
