      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              现有领导层证据足以确认创始人与运营控制，但不足以判断完整治理质量。Kam Ghaffarian 一直与公司创立相关，在 2025 年 11 月 Series D 公告中仍被列为创始人兼执行主席；Clay Sell
              是现任 CEO，也是来源池中唯一拥有清晰且有证据支持的 X-energy 任前履历的高管，即曾任美国能源部副部长。Yahoo Finance 提供了 Sell
              之下最清晰的具名运营团队，涵盖财务、运营、技术、科学和法务职能。但来源池没有提供董事会名单、委员会架构、投票控制情况，也无法清楚判断上市公司治理是否已实质降低创始人 / 主席与 CEO 层面的关键人依赖。
