        blocks:
          - type: paragraph
            body: >-
              监管状态已有进展，但不等于商业 Xe-100 部署获批。NRC 描述了自 2018 年 9 月起与 X-energy 开展的申请前接触，并仍将部分技术提交列为审查中。X-energy 报告已取得 Part 70
              燃料制造许可证，并称 Dow 的 Seadrift
              方案获得有利的环境结论；但公司另行说明施工许可证审查仍在进行。英国路径也从一份待受理的申请推进到投资者关系页面所称监管方将开始设计审查。这些都是有意义的去风险事件，但每一项都仍留下进度、条件、干预和场址特定批准风险。因此，投资判断应以原始案卷、听证记录和许可条件为准，而不是以公司里程碑摘要为准。
