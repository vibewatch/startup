  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开 traction
        blocks:
          - type: paragraph
            body: >-
              公开披露仍显示，X-energy 的反应堆部署处于商业化前阶段：已报告收入来自已完成的服务和补助报销，而不是交付反应堆或已披露的长期燃料合同。2026 年第一季度，公司报告总收入及补助收入
              $43.4M，其中服务收入 $39.9M、补助收入 $3.5M；管理层将增长主要归因于 ARDP
              活动增加。这一结构很重要，因为公司早期公开市场材料将预期变现组合描述为技术许可、燃料销售和经常性服务，但可见利润表仍反映开发阶段项目工作。因此，围绕 144 座反应堆 / 11.5 GWe 管线的公开
              traction 语言说明有需求兴趣，却尚未证明存在已签约、可重复的商业收入。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
