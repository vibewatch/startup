        - 官方及独立资料都将 X-energy 描述为 Xe-100 反应堆与 TRISO-X 燃料组成的平台。
        - 如果管理层披露燃料利润率和配套率，而不只是强调技术定位，这一论点会更有力。
      - - 论点：融资与流动性
        - 独立资料提到累计融资超过 $2.7B、2026 年第二季度收入及补助收入为 $54.6M，以及 $1.9B 的流动性。
        - 如果流动性最终转化为有明确名称、能够融资的项目，而不是支撑更长的商业化前消耗，判断会改善。
      - - 反方论点：倍数仍高
        - Yahoo Finance 称 XE 的预期 2026 年销售额倍数约为 19 倍；公司尚无商业反应堆，预期亏损还在扩大。
        - 如果收入质量从补助和服务转向签约反应堆及燃料经济性，这一担忧会缓解。
      - - 反方论点：股权结构表不透明
        - 独立数据库列出了 Series C-1 和 Series D 轮融资，但没有披露其投前或投后估值。
