  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 当前公开收入仍是开发阶段的工作桥接：把已获资金支持的活动转成已报告收入，随后转成现金消耗，而不是可见的毛利。
    data:
      nodes:
        - id: funded-activity
          label: 获资金支持的项目活动
          value: DOE ARDP work plus partner development programs
          note: 当前收入确认仍跟随已获资金支持的工程、许可和燃料开发活动。
        - id: services-revenue
          label: 服务收入
          value: 39.9
          unit: USDm
          note: 2026 年第一季度已报告的服务收入。
        - id: grant-income
          label: 补助收入
          value: 3.5
          unit: USDm
          note: 2026 年第一季度已报告的补助收入。
        - id: total-revenue
          label: 收入与补助收入合计
          value: 43.4
          unit: USDm
          note: 2026 年第一季度已报告的合计。
        - id: direct-costs
          label: 直接成本
          value: 65.4
          unit: USDm
          note: 直接成本超过当前已报告的收入和补助收入。
        - id: operating-cash-draw
          label: 经营现金消耗
          value: 67.3
          unit: USDm
          note: IPO 募资到账前的季度经营现金流出。
      edges:
        - from: funded-activity
          to: services-revenue
          label: 可报销工作
        - from: services-revenue
          to: grant-income
          label: 增量补充
        - from: grant-income
          to: total-revenue
          label: 合并为
        - from: total-revenue
          to: direct-costs
          label: 被吸收
        - from: direct-costs
          to: operating-cash-draw
          label: 仍留下
    approximationNotes: 该序列是概念性的，并非会计上的正式桥接；它使用 2026 年第一季度公开数据，展示当前披露的活动如何转为已报告收入和现金使用。
    claimRefs:
