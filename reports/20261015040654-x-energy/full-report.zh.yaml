              分配到的来源池足以支撑一个范围有限但可用的身份基线。在公司官网、Yahoo Finance、Wikipedia 和两家第三方追踪页面中，X-energy 均被描述为一家总部位于马里兰州罗克维尔、2009
              年成立的公司，主营先进核反应堆和核燃料，而不是软件式经常性收入业务。产品身份保持一致：Xe-100 是旗舰反应堆平台，TRISO-X 是配套燃料平台。IPO
              材料还确认公司已进入公开市场阶段，这有助于比较管理层头衔、股票交易背景和资本市场里程碑，但分配到的证据中仍有几项尽调关键经济数据未公开。
