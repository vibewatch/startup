        title: 2026 年证据显示项目持续推进，而不是运营成熟
        blocks:
          - type: paragraph
            body: >-
              公开证据显示燃料、监管和部署工作流均有实质推进。X-energy 的投资者关系页面突出 2026 年英国设计审查进展和 TX-1 建设里程碑；ANS
              报道显示公司正在扩展国际选址和部署路径，并继续推进燃料设施里程碑。这些都是项目已经超越概念阶段宣传的真实信号。不过，分配到的资料库仍未显示任何已投运的 Xe-100
              机组、公开可用率数据，或已完成的商业燃料制造爬坡。因此，恰当的成熟度标签是“先进的商业化前阶段”：在可见里程碑上领先许多只停留在概念阶段的同行，但仍未证明可重复的运营能力。
