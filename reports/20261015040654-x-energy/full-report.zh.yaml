        title: 里程碑轨迹与不利信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示公司确有进展，也解释了为什么这仍是一项以执行为核心的尽调故事。Wikipedia 记录了 2020 年 DOE ARDP 入选、被放弃的 2022–2023 年 SPAC 路径，以及 2023 年
              11 月裁员，保留了成功的 2026 年 IPO 之前并不线性的资本形成历史。2025 年 11 月公司的融资公告提供了最有力、且有证据支持的商业里程碑：X-energy 声称订单簿超过 11 GW、约 144
              座 SMR；但这份订单簿仍是公司口径，并非已签合同的 backlog 排期。公开市场监测也让本章不再只是公司叙事：IBD
              快照显示公司市值达数十亿美元，但短期股价明显走弱、税前利润率深度为负，说明上市并没有解决底层执行风险争议。
