      - number: '5.2'
        title: 核心架构是集成式反应堆—燃料系统
        blocks:
          - type: paragraph
            body: >-
              技术栈以氦冷、石墨慢化的 HTGR 为中心，使用嵌入石墨球中的 TRISO 颗粒。多份保留来源汇聚到同一架构：每个 Xe-100 模块均被描述为 80 MWe 设计，通常以四机组、320 MWe
              的配置部署，并具备同时服务发电和工业热场景的温度能力。关键含义是，反应堆和燃料对商业化不可分割。X-energy 的差异化叙事依赖于掌控 TRISO-X
              供应链，再用车队支持、培训和监测把硬件包起来。这种纵向一体化是资料库中最清晰的护城河，但也把风险集中到燃料可得性、规模化和首批场址执行上。
