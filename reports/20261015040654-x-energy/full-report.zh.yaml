          - type: callout
            title: 有条件管线不是已签约 backlog
            body: 144 座反应堆、11.5 GWe 的管线以每名客户都完整行使有条件权利为前提。投资判断应改为跟踪有约束力的 FID、定金、技术费协议和已获资金支持的施工义务。
            calloutType: risk
            claimRefs:
              - CR006
              - CR012
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议仍对价格敏感
        blocks:
          - type: paragraph
            body: >-
              公开记录支持“继续研究”，而不是直接买入。X-energy 确实完成了 2026 年 4 月的成功 IPO，募资也显著增强了其持续资助反应堆和燃料执行的能力。但截至 2026 年 10 月，独立报道仍显示股价低于
              IPO
              价格；公司商业反应堆运营尚无收入，距离首次部署也仍有数年。市场定价的是战略期权，而非运营现金流；后者尚未得到证明。除非入场价格进一步下降，或管理层披露足够的项目层面经济性来支撑这一倍数，否则稳妥做法是把公司留在尽调清单上，不要强行让公开证据无法支持的精确判断。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: 仍支持上行空间的因素
        blocks:
          - type: paragraph
            body: >-
              乐观情景并非凭空而来。X-energy 已搭建出差异化的双产品平台：Xe-100 反应堆加 TRISO-X 燃料，而不是押注单一技术。独立画像还指向异常深厚的资金支持，包括 IPO 前的大额私募轮，以及与
              Amazon 支持的 Cascade 项目和更广泛 11.5 GW 订单簿相连的管线叙事。Venture Atlas 还认可公司拥有强流动性和扩大的 DOE
              支持，使管理层有时间继续推进燃料制造、许可和客户转化。如果这笔资本基础最终转化为已签约反应堆部署和可见的燃料利润率，今天的股票可能最终证明是对一个远大于当前收入所反映平台的期权。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
      - number: '8.3'
        title: 反方逻辑仍主导投资判断
        blocks:
          - type: paragraph
            body: >-
              反方逻辑是，公开市场仍缺少足以有把握支撑溢价估值的证据。Yahoo Finance 将 X-energy 描述为约 19 倍预期 2026 年销售额，但预计净亏损扩大至约 $430M，首批商业反应堆也要到
              2030 年代初才可能出现。独立数据提供商还在私募轮估值和优先股堆叠上留下关键空白：Silicon Valley Investclub 列出了 Series C-1 和 Series D
              融资，但没有列出投前或投后估值。这很重要，因为后期先进核能公司的股权结构表会显著影响有效入场价格、稀释和下行保护。10 月交易动能疲弱进一步说明，战略热度尚未转化为稳定的估值支撑。
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 情景纪律与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              对 X-energy
              的投资判断应依靠情景纪律，而不是单点目标价。在乐观情景下，已披露的反应堆经济性、燃料利润率可见度和具名项目转化，可能足以让投资人在反应堆产生现金前为平台付费。基准情景下，投资人主要仍在为战略稀缺性和政府支持的期权价值付费，因此应保持耐心并严格控制入场。在悲观情景下，许可延误、商业化滑坡或倍数压缩，可能在反应堆部署前迫使估值大幅重估。因此，下一轮尽调应聚焦具体缺失证据：项目层面定价、已签约
              backlog 质量，以及 IPO 前融资结构背后的后期股权结构表和优先股堆叠条款。
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 当前判断：继续研究
            body: X-energy 在战略上足够重要，值得留在可投资观察名单上，但公开记录仍缺少太多估值输入，无法为直接买入提供依据。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV008
              - CV010
              - CV011
          - type: callout
            title: 哪些因素会改变判断
            body: 如果披露反应堆和燃料经济性、把管线更扎实地转化为已签约项目，并明确私募轮和优先股堆叠，判断会改善。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV011
              - CV013
