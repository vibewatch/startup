      - number: '3.2'
        title: 差异化来自燃料控制、工业热适配和伙伴驱动的市场路径
        blocks:
          - type: paragraph
            body: >-
              X-energy 最有证据支撑的差异化，并不只是再提供一种小型模块化反应堆。公司反复描述一个围绕 Xe-100 和 TRISO-X 打造的反应堆与燃料组合；CNBC 报道称，公司计划许可技术而不是持有电站，同时从
              Oak Ridge 的制造基地销售燃料。这种组合很关键，因为众议院证词显示，国际买方希望先看到国内首个部署项目和顶级监管批准后再作承诺。因此，燃料控制、许可进展，以及 Amazon、Dow、Centrica
              等强伙伴，都成为产品本身的一部分，而不只是营销支持。
