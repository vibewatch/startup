companyProfile:
  summary: >-
    X-energy 是一家总部位于马里兰州罗克维尔的先进核能开发商，由 Kam Ghaffarian 于 2009 年创立，现由 CEO Clay Sell 领导。公司围绕两款产品搭建业务：Xe-100 高温气冷小型模块化反应堆，以及
    TRISO-X 燃料平台。其公开材料和分配到的证据指向工业热、公用事业级发电以及 AI / 数据中心电力客户，但公司尚无商业反应堆运营记录，项目经济性也未完全披露。
