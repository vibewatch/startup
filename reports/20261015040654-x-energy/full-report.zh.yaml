figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: X-energy 披露的发展路径从成立和 DOE 支持开始，经历融资反复与资金恢复，最终走到 2026 年 4 月 IPO。
    data:
      items:
        - label: 2009 — 成立
          detail: 独立资料将 X-energy 的成立时间定为 2009 年。
        - label: 2016-01 — DOE 开发补助
          detail: Wikipedia 称 DOE 依据先进反应堆概念合作协议，授予一项为期五年、最高 $40M 的补助。
        - label: 2019 — Clay Sell 出任 CEO
          detail: Wikipedia 将 Sell 出任 CEO 的年份定为 2019 年。
        - label: 2020-10 — 入选 ARDP
          detail: Wikipedia 称 DOE 选中 X-energy 获得 ARDP 支持，5 至 7 年总额可能达到 $400M-$4B。
        - label: 2023-10 — 终止 SPAC 路线
          detail: Wikipedia 称原计划金额为 $2B 的 SPAC 交易于 2023 年 10 月取消。
        - label: 2023-11 — 裁员
          detail: Wikipedia 称公司于 2023 年 11 月裁减了部分员工。
        - label: 2025-11-24 — Series D 完成
          detail: 公司宣布完成约 $700M 的 Series D 轮融资，由 Jane Street 领投。
        - label: 2026-04-15 — IPO 启动
          detail: X-energy 启动 IPO 路演，给出的价格区间为 $16-$19。
        - label: 2026-04-23 — IPO 定价
          detail: 公司以每股 $23 的价格发行 44,254,659 股。
        - label: 2026-04-24 — 纳斯达克上市
          detail: Wikipedia 称 X-energy 于 2026 年 4 月 24 日以 XE 代码开始在纳斯达克交易。
    approximationNotes: null
    claimRefs:
      - CO001
      - CO005
      - CO007
      - CO008
      - CO009
      - CO014
      - CO015
