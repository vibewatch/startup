      - number: '5.4'
        title: 安全差异化清晰可见，但可靠性、网络安全和规模化证据不足
        blocks:
          - type: paragraph
            body: >-
              主要技术风险不在于 X-energy
              能否描述差异化架构，而在于能否把紧密耦合的反应堆—燃料—服务设计转化为可重复交付。资料库包含反复出现的固有安全和模块化主张，以及伙伴对集中式支持工具的评论，但没有公开可靠性指标、监测层的网络安全 /
              合规细节，也没有开放的开发者信号，让外部尽调能够像测试软件基础设施那样检验采用和稳健性。因此，ANS
              关于商业化难于反应堆设计的更广泛警告，正是这里最合适的不利视角。下一批重要证据应来自燃料认证、施工执行、运营数据和监管接受，而不是更多定位语言。
