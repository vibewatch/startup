            title: 燃料纵向一体化是最清晰的护城河
            body: 在保留的来源中，X-energy 最有说服力的胜出理由是它并非只在销售反应堆概念。公司试图同时控制燃料、许可叙事和客户关系，这与更依赖第三方燃料或单一部署叙事的同行不同。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP015
          - type: callout
            title: 竞争优势仍取决于首个部署项目和已披露经济性
            body: >-
              公开证据显示伙伴需求有分量，但也显示客户希望看到已验证的美国电站，项目周期按年计算，行业融资在高知名度项目取消后可能迅速逆转。在 X-energy 以可见的经济性跨过这些里程碑前，incumbents
              和验证更充分的同行仍可把它描述为一个有前景但未经证明的选项。
