      - CI002
      - CI005
      - CI006
  - id: FE001
    title: 产品架构图
    type: stack
    summary: X-energy 的公开产品叙事由六层组成：从客户工作负载延伸到反应堆、燃料、制造、运营工具和部署合作伙伴。
    data:
      layers:
        - label: 客户工作负载
          detail: 工业蒸汽与电力、稳定清洁发电，以及远程韧性供电场景，共同推动商业化叙事。
          modules:
            - 工业现场的工艺热与电力
            - 面向电网和大负载买方的稳定清洁发电
            - 远程 / 国防 / 应急备用韧性场景
        - label: 反应堆产品
          detail: Xe-100 是旗舰 HTGR 模块，公开描述为 80-MWe 设计，以四单元 320-MWe 电站形式部署。
          modules:
            - 氦冷高温气冷堆
            - 模块化四联装电站架构
          outputs:
            - 电力
            - 高温热 / 蒸汽
        - label: 燃料系统
          detail: TRISO-X 球形燃料被定位为组合中每条反应堆路径的安全与性能支撑。
          modules:
            - TRISO 颗粒
            - 石墨球
            - 基于 HALEU 的燃料供应链
        - label: 制造资产
          detail: TX-1 的进展和 TX-2 的开发表明，商业化落地取决于燃料制造规模扩大，而不只是反应堆设计。
          modules:
            - TX-1 建设路径
            - TX-2 扩建路径
          outputs:
            - 商业燃料供应
        - label: 运营与支持层
          detail: Plant Support Centers 和 X-DATA 旨在通过监控和培训，把平台转成全生命周期服务模式。
          modules:
            - 远程监控
            - 操作员培训
            - 维护规划
            - 停机支持
        - label: 部署边界
          detail: 公开路线图取决于客户、监管机构和部署合作伙伴，只有它们协力才能把技术栈变成运营中的站点。
          modules:
            - Dow / 工业部署路径
            - Energy Northwest / Amazon 支持路径
            - 英国和加拿大扩张路径
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE013
  - id: FU001
    title: 从获资金支持的原型到多站点扩张的客户旅程
    type: journey-map
    summary: 已披露路径从政府资助的原型工作，走向工业和公用事业锚点项目；在运营机组得到验证前，扩张选择权已经出现。
    data:
      nodes:
        - label: 政府资助的原型
          touchpoints:
            - DoD Project Pele expands an existing relationship and funds prototype work.
        - label: 工业锚点站点
          touchpoints:
            - Dow becomes the named Long Mott host while licensing work continues.
        - label: 公用事业选址合作伙伴
          touchpoints:
            - Energy Northwest considers up to 12 Xe-100 modules in Washington.
        - label: 超大规模客户支持的扩张
          touchpoints:
            - Amazon funds four Cascade reactors and holds a >5 GW option by 2039.
        - label: 英国地域扩张
          touchpoints:
            - Centrica advances UK design review and broader deployment ambition.
        - label: 商业化瓶颈
          touchpoints:
            - >-
              Most proof is still announcements, permitting, and option structures rather than operating plants or
              renewal metrics.
    approximationNotes: 该序列概括指定资料池中披露的客户开发阶段，不应理解为有时间安排的转化漏斗，也不能证明每个节点都会转化为运营。
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU009
      - CU010
      - CU015
  - id: FR001
    title: 当前缓释措施后的剩余风险热图
    type: matrix
    summary: 六道相互关联的关口仍处于高风险或关键风险等级，因为当前缓释措施主要是许可证、流动性、初步协议或进行中的工作，而非已完成的商业执行。
    data:
      columns:
        - key: likelihood
          label: 可能性
          detail: 分析师依据指定证据作出的判断。
        - key: impact
          label: 影响
          detail: 风险发生后对商业化的影响。
        - key: mitigation
          label: 缓释成熟度
          detail: 指定证据中可观察到的缓释措施状态。
      rows:
        - label: 反应堆许可进度
          note: 与 NRC 的长期沟通仍在进行，技术事项尚待审查。
          values:
            - value: High
              tone: negative
            - value: Critical
              tone: negative
            - value: Developing
              tone: warning
        - label: 客户 FID 与合同转化
          note: 项目管线权利带有或有条件，且独立分析称没有技术费协议。
          values:
            - value: High
              tone: negative
            - value: Critical
              tone: negative
            - value: Early
              tone: warning
        - label: TX-1 完工与认证
          note: 已取得许可证；完工目标仍为 2028 年上半年。
          values:
            - value: Medium-high
              tone: warning
            - value: Critical
              tone: negative
            - value: In progress
              tone: warning
        - label: HALEU 与部件供应
          note: 已有石墨协议，但完整原料和双来源覆盖尚未建立。
          values:
            - value: Medium-high
              tone: warning
            - value: High
              tone: negative
            - value: Mixed
              tone: warning
        - label: 商业化前的流动性
          note: IPO 募资增强了流动性，但经营现金使用仍在继续。
          values:
            - value: Medium
              tone: warning
            - value: High
              tone: negative
            - value: Funded near term
              tone: positive
        - label: 商业规模的安全与质量
          note: 指定证据尚未建立已交付商业 Xe-100 的运营记录。
          values:
            - value: Unknown
              tone: neutral
            - value: Critical
              tone: negative
            - value: Unverified
              tone: warning
    approximationNotes: 序数标签是分析师判断，不是实测概率；不代表存在数值间距或跨风险校准。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR007
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议仍受战略证明与已披露经济性之间缺口的约束。
    data:
      nodes:
        - id: proof
          label: 战略证明
          note: $23 IPO，加上 DOE、客户和私人资本的大额支持
        - id: platform
          label: 平台广度
          note: Xe-100 反应堆和 TRISO-X 燃料让价值叙事不局限于单一资产
        - id: revenue
          label: 当前经营基础
          note: $54.6M 第二季度收入及补助收入；商业反应堆运营仍未产生收入
        - id: multiple
          label: 市场投资评估
          note: IPO 后交易价格仍低于发行价，预期 2026 年销售额倍数约为 19 倍
        - id: gaps
          label: 缺失的估值输入
          note: 私募轮估值、优先股堆叠条款和项目层面的经济性仍仅部分披露
        - id: decision
          label: 建议
          note: 继续研究、守住价格纪律，并在经济性改善或出现更好入场点时重新评估
      edges:
        - from: proof
          to: platform
          label: 支持
        - from: platform
          to: revenue
          label: 但尚未转化为
        - from: revenue
          to: multiple
          label: 因而留下
        - from: multiple
          to: gaps
          label: 同时
        - from: gaps
          to: decision
          label: 因此
    approximationNotes: 流程表达的是投资评估逻辑，而非数学模型。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
