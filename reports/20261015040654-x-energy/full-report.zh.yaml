        - 执行延误可能迅速抹去期权溢价。
        - 最符合当前证据集。
      - - 悲观情景
        - 商业化时间线延后、后期经济性令人失望，或市场对尚未产生现金流的核能公司的兴趣减弱。
        - 在反应堆收入到来前，股票可能因倍数压缩而重估下行；目前几乎没有经营证据能够支撑估值底线。
