figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Yinwang appears to land through OEM strategic alignment, expand through joint development and software
      operations, and prove demand through downstream vehicle launches and usage, with regulation acting as a
      gating step rather than a growth proof point.
    data:
      items:
        - label: Strategic entry
          actor: OEM executive buyer
          channel: Equity stake or strategic cooperation
          touchpoints:
            - Minority stake purchase or investment negotiation
            - Access to intelligent driving and cockpit platform capability
          tone: neutral
        - label: Platform integration
          actor: Vehicle program and engineering teams
          channel: Joint development
          touchpoints:
            - Smart driving plus cockpit module integration
            - Product planning aligned with partner roadmaps
          tone: neutral
        - label: User-operations expansion
          actor: OEM software and operations teams
          channel: Consumer-facing software operations
          touchpoints:
            - Product planning to user operations
            - Marketing, promotion, and brand-standard collaboration
          tone: positive
        - label: Launch and rollout
          actor: Vehicle brands and dealers
          channel: Model launch cadence
          touchpoints:
            - Full-lineup deployment at Voyah
            - 17-model Avatr roadmap through 2030
          tone: positive
        - label: End-market validation
          actor: End drivers and passengers
          channel: Orders, deliveries, and feature usage
          touchpoints:
            - HIMA deliveries and order velocity
            - Qiankun installations and HarmonyOS voice usage
          tone: positive
        - label: Expansion gate
          actor: Regulators and procurement teams
          channel: Safety and compliance review
          touchpoints:
            - Hand-off detection and gaze-monitoring requirements
            - Longer customer validation and procurement cycles
          tone: risk
    claimRefs: [CU002, CU003, CU005, CU006, CU008, CU010, CU011, CU013]
