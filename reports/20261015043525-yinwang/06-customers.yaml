company:
  name: Yinwang
chapter:
  number: 6
  title: Customers
  summary: >-
    Yinwang's customer proof is strongest inside Huawei's OEM ecosystem: Avatr and Seres
    took minority stakes, Voyah deepened co-development into user-operations work, and
    Huawei's wider HIMA/Qiankun stack shows real downstream deployment scale. What remains
    unverified is durability economics—none of the retained public sources disclose Yinwang
    standalone renewal, contract-term, or OEM concentration by revenue—so adoption looks
    credible but stickiness is still not externally auditable.
sections:
  - id: customer-base
    title: Customer base is OEM-led, partner-heavy, and ecosystem-centric
    body: >-
      The retained evidence points to a B2B2C customer structure rather than a broad direct-sales
      motion. Yinwang is presented as an open platform for intelligent driving systems and components,
      and the named paying counterparties are automakers or Huawei-linked vehicle ventures rather than
      independent enterprise buyers. Avatr completed a 10% stake purchase, Seres separately disclosed
      its own 10% purchase, Voyah expanded from technical cooperation into joint software operations,
      and JAC was still in discussions about a minority investment as of April 2026. That combination
      suggests Yinwang wins accounts through strategic OEM alignment, embedded platform adoption, and
      downstream consumer-vehicle programs, but the disclosed customer set remains tightly clustered
      around Huawei's automotive ecosystem instead of showing diversified external OEM coverage.
    claimRefs: [CU001, CU002, CU003, CU005, CU014, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is real, but much of it is ecosystem-level rather than Yinwang-standalone
    body: >-
      Customer proof goes beyond logo slides. Avatr's capital commitment is matched by a long-dated
      17-model roadmap, while Voyah says it has already equipped its full lineup with Huawei Qiankun
      Intelligent Driving and HarmonyOS cockpit software. At the broader ecosystem level, HIMA reported
      46,122 May 2026 deliveries and about 192,000 deliveries in the first five months of 2026 across
      five automaker sub-brands. Huawei's Smart Car Solutions unit separately said Qiankun had surpassed
      one million installations across 28 vehicle models, and the HarmonyOS-based cockpit logged large
      usage counts. Together these signals show production deployment and end-user activity, but they
      measure Huawei-platform momentum more clearly than they isolate Yinwang's own take rate, revenue
      capture, or customer-specific economics.
    claimRefs: [CU003, CU004, CU005, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002]
  - id: durability-risks
    title: Durability, expansion economics, and concentration remain under-disclosed
    body: >-
      The biggest customer diligence gap is not whether Yinwang has credible named accounts—it does—but
      whether those accounts are durable, expanding, and economically attractive on a standalone basis.
      None of the retained sources disclose NRR, GRR, churn, renewal timing, contract duration, OEM-by-OEM
      revenue concentration, or module attach rates. That matters because the current proof base is still
      concentrated in a small group of Huawei-linked automakers and their associated brands. Expansion also
      faces a higher compliance bar: China's draft L2 safety standard adds functional-safety, cybersecurity,
      data-recording, hand-off-detection, and gaze-monitoring requirements, which can lengthen validation and
      procurement cycles for smart-driving suppliers. The commercial story is therefore credible but still
      incomplete on retention and concentration risk.
    claimRefs: [CU012, CU013, CU015, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Scale signal
      - Strategic value
      - Key gap
    rows:
      - - Strategic equity OEMs
        - Avatr and Seres are buyers/investors; vehicle owners are end users
        - Align intelligent-driving and cockpit platform adoption with OEM roadmaps
        - 10% stakes disclosed at 11.5 billion yuan each; Avatr payment completed
        - Equity alignment raises switching costs and creates named reference accounts
        - No public module revenue split, renewal cadence, or contract term
      - - Expansion candidate OEM
        - JAC as prospective shareholder and Maextro ecosystem partner
        - Potential access to additional intelligent vehicle programs
        - Investment talks initiated, but definitive amount and payment method still pending
        - Could widen the buyer base beyond already disclosed partners
        - No signed agreement or deployment metrics disclosed
      - - Software-ops co-development OEM
        - Voyah is the buyer; vehicle users consume smart-driving and cockpit features
        - Smart driving, cockpit, and consumer software operations
        - Joint team from product planning to user operations; full Voyah lineup equipped in 2025
        - Shows land-and-expand from component supply into lifecycle operations
        - No public software attach rate, renewal, or spending disclosure
      - - Broader Huawei alliance brands
        - Aito, Luxeed, Stelato, Maextro, and Shangjie via partner OEMs
        - Downstream deployment surface for Huawei smart-car stack
        - About 192,000 HIMA deliveries in Jan-May 2026; Qiankun above 1 million installs
        - Demonstrates multi-brand scale beyond one flagship account
        - Metrics are Huawei ecosystem-wide, not Yinwang-standalone
    notes: >-
      Scale signals mix equity commitments, delivery metrics, and installed-base indicators; they do not
      disclose Yinwang standalone revenue, contract duration, or renewal behavior.
    claimRefs: [CU002, CU003, CU005, CU008, CU010, CU014, CU015]
