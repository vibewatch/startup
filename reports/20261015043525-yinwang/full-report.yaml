companyProfile:
  summary: >-
    Yinwang is Huawei's automotive-systems spinout and operating platform for intelligent driving, smart cockpit,
    vehicle control, and vehicle-cloud systems sold into OEM programs. Public reporting shows the company was formed in
    January 2024, later sold 10% stakes to AVATR and Seres at an implied CNY 115 billion mark, and continued to add
    partner traction in 2026. The remaining diligence gap is not whether the platform matters strategically, but whether
    its standalone economics and minority-investor protections are strong enough to justify the mark.
