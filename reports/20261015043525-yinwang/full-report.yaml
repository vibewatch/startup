      - number: '7.2'
        title: Execution and technical dependence
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated because Yinwang's public roadmap asks several partner programs to land on
              overlapping timelines while the core autonomy stack still appears technically demanding. Huawei automotive
              leadership said matching one vehicle model still takes roughly 6-9 months, while the roadmap targets
              highway L3 capability and urban L4 pilots in 2026 before broader L4 commercialization goals in 2027-2028.
              In parallel, Voyah and Yinwang expanded from a component relationship into joint consumer-software
              operations across product planning through user operations, and Avatr and Huawei said they plan to
              co-develop 17 models by 2030 with five upgraded models due in 2026. Those signals are positive on
              engagement, but they also mean that missed launch dates, slower homologation, or integration slippage at
              even one anchor OEM can delay visible commercialization and weaken the credibility of the next milestone
              wave.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR014
      - number: '7.3'
        title: Legal, capital-markets, and diligence kill criteria
        blocks:
          - type: paragraph
            body: >-
              The legal and financing posture is notable less for a known enforcement event than for the amount of
              material information that remains private while expectations stay high. Yinwang publicly denied a
              second-half-2026 IPO timetable, yet the same January 2026 note still referenced a RMB 115 billion
              valuation, keeping external performance expectations elevated without adding balance-sheet, governance, or
              incident disclosure. Partner health also matters: JAC disclosed widening losses and lower vehicle sales in
              Q1 2026, while Light Reading reported that Avatr had accumulated sizeable deficits and underhit its sales
              target. The practical kill criteria are therefore measurable: if 2026-2027 autonomy milestones slip, if
              anchor OEM launches or volumes stall, or if diligence still cannot obtain the shareholder agreement,
              approval map, and incident record, then the investability case weakens faster than the strategic
              narrative.
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
