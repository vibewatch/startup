      - number: '1.2'
        title: Control, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              The financing history shows that Yinwang has opened equity to strategic OEMs without becoming financially
              independent from Huawei. Avatr and Seres each agreed to buy 10% stakes for RMB 11.5 billion, implying a
              roughly RMB 115 billion mark around the 2024-2025 transactions, while Huawei remained the controlling
              shareholder. Governance disclosure is much thinner than ownership disclosure. Publicly retained sources
              identify Zheng Liying and Song Liuping in entity-governance roles and record Xu Zhijun's statement that
              Yinwang wants strategic carmaker investors rather than financial investors. That combination suggests
              decision-making still sits inside Huawei's ecosystem, creating key-person and partner-alignment risk until
              a fuller board slate, reserved-matters schedule, and shareholder-rights package are public.
            claimRefs:
