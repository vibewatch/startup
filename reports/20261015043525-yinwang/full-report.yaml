        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual risk
            body: >-
              Governance opacity matters more than lack of partner demand: Yinwang has visible momentum, but the
              strongest public proof still runs through a small cluster of Huawei-linked OEMs while the control and
              minority-rights details remain private.
