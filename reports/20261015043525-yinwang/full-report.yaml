              - CU008
              - CU010
              - CU011
              - CU013
      - number: '6.2'
        title: Adoption proof is real, but much of it is ecosystem-level rather than Yinwang-standalone
        blocks:
          - type: paragraph
            body: >-
              Customer proof goes beyond logo slides. Avatr's capital commitment is matched by a long-dated 17-model
              roadmap, while Voyah says it has already equipped its full lineup with Huawei Qiankun Intelligent Driving
              and HarmonyOS cockpit software. At the broader ecosystem level, HIMA reported 46,122 May 2026 deliveries
              and about 192,000 deliveries in the first five months of 2026 across five automaker sub-brands. Huawei's
              Smart Car Solutions unit separately said Qiankun had surpassed one million installations across 28 vehicle
              models, and the HarmonyOS-based cockpit logged large usage counts. Together these signals show production
              deployment and end-user activity, but they measure Huawei-platform momentum more clearly than they isolate
              Yinwang's own take rate, revenue capture, or customer-specific economics.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
