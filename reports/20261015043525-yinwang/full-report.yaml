      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer is the automaker program owner, not the end driver. Yinwang's public demand signals come from
              strategic OEM partnerships and equity-linked alliances: AVATR completed payment for a 10% stake, Seres
              announced the same 10% stake purchase price, VOYAH expanded cooperation across smart driving, smart
              cockpit, and consumer software operations, and Chery widened its work with Yinwang into L3 and L4
              programs. KrASIA adds that Yinwang is expected to run a two-way supply model that serves both AVATR and
              existing Huawei partner brands such as Aito, Stelato, Luxeed, and Maextro. In practice, that means
              Yinwang's adoption path is OEM-led: product-planning teams and E/E architecture owners choose the stack,
              procurement and strategy teams fund it, and drivers/passengers are downstream users of the resulting
              software-defined cockpit and ADAS experience.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The external market reports and partner announcements point to the same adoption logic: automakers are
              trying to centralize infotainment, navigation, ADAS visualization, connectivity, and vehicle-control
              functions inside software-defined cockpit architectures, while Huawei-aligned OEMs are broadening model
              programs around those stacks. Global Market Insights highlights connected and software-defined vehicles,
              AI, and cloud computing as core drivers, and 6Wresearch says China demand is being pushed by advanced
              technology features, connected/autonomous vehicles, and government support for smart transportation. The
              same pool also identifies the main friction points: high implementation cost, privacy/security concerns,
              software-update complexity, semiconductor constraints, and the fact that public sources still do not
              disclose Yinwang's module-level pricing or attach-rate economics. That keeps the investable conclusion
              straightforward: the market backdrop is large and growing, but the evidence remains stronger on category
              momentum and partner adoption than on Yinwang's addressable share or monetization depth.
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM014
