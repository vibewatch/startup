      - number: '5.2'
        title: Deployment model centers on OEM integration and user-operations support
        blocks:
          - type: paragraph
            body: >-
              The operating model is explicitly supplier-led. Yinwang's September statement said it would support AITO
              as a supplier, not a competitor, and Huawei management later said Yinwang's investors must be strategic
              automakers already using its products. Partner evidence shows why that matters operationally: VOYAH and
              Yinwang created a joint consumer-software operations team covering the path from product planning to user
              operations, while Chery broadened cooperation from single-feature integration into vehicle-level
              collaboration for L3/L4 autonomy. The result is a workflow in which Yinwang is embedded in OEM launch,
              operations, and roadmap cycles instead of acting as a detached black-box component supplier.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE009
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
