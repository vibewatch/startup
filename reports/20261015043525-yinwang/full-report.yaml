      - number: '1.3'
        title: Scale signals and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence is stronger on ecosystem reach than on standalone operating performance. By 2026,
              retained partner-facing reporting shows Yinwang deepening strategic programs with Voyah and Chery around
              smart driving, smart cockpit, software operations, and L3/L4 deployment, which supports the thesis that
              the platform is broadening beyond a single anchor OEM. At the same time, the company-overview evidence
              remains thin on standalone revenue, customer count, audited financials, and a corroborated headcount; the
              only explicit headcount figure in this pool comes from Wikipedia and should not be treated as
              high-confidence operating proof. The resulting picture is a strategically important platform with visible
              commercial milestones but still-incomplete disclosure on the metrics that matter most for investment
              underwriting.
