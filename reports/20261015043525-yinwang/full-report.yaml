      - number: '5.4'
        title: Public control evidence is narrower than commercialization evidence
        blocks:
          - type: paragraph
            body: >-
              The core diligence problem is not whether Yinwang has product surface area; public partner evidence shows
              that it does. The gap is that the assigned evidence pool offers limited direct disclosure on safety cases,
              cyber and privacy controls, uptime commitments, incident handling, or module-level responsibilities
              between Yinwang, Huawei, and the OEM. The closest visible control signals are partner-reported testing
              mileage, road-testing preparation for L3/L4, and registry-defined business scope. A low-reputation
              directory also identifies two unrelated entities rendered under the same English company name, so
              directory-only product claims require identity verification. Commercialization is therefore ahead of the
              public assurance story: architecture boundaries, certification status, security processes, roadmap
              delivery, and post-launch defect accountability remain under-documented in the retained source set.
            claimRefs:
              - CE007
              - CE009
              - CE013
              - CE014
