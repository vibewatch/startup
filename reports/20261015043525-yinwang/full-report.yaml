  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans full-stack, component, and internal-build paths
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not show Yinwang facing one clean peer set. Instead, the buyer can choose among
              at least three solution paths: Yinwang's bundled stack, other full-stack intelligent-driving programs
              racing toward L3 certification, or a componentized stack assembled from cockpit and chip leaders. iEVChina
              says Yinwang expects meaningful L3 rollout in 2027 and L4 passenger-car scale in 2028, and names Xiaomi
              HAD, XPeng XNGP, and Nvidia Drive Thor-enabled programs as the relevant competitive read-across for that
              timetable. At the same time, the adjacent cockpit layer remains structurally open: Global Market Insights
              says the top five global cockpit-platform vendors held only 19% share in 2025, while China's Q1 2026
              cockpit-domain controller rankings still put Desay ahead of Bosch and Huawei. That means Yinwang is not
              just selling "smarter ADAS"; it is trying to win the OEM decision to buy an integrated vehicle stack
              instead of mixing separate leaders across cockpit, compute, and software.
            claimRefs:
