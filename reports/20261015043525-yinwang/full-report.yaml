      - number: '5.3'
        title: Maturity signals come from partner rollout breadth more than public technical disclosure
        blocks:
          - type: paragraph
            body: >-
              Yinwang's best public maturity signal is field adoption across multiple OEM ecosystems. HIMA delivered
              46,122 vehicles in May 2026 and about 192,000 in the first five months of the year across five partner
              brands, implying that Huawei- and Yinwang-linked software is already operating at meaningful production
              scale. VOYAH disclosed 110,000 km of road testing and 900,000 km of simulation around its L3 push, while
              Chery framed Yinwang as the manager and supplier of Huawei's full automotive suite and linked it to
              broader L3/L4 rollout. Avatr's completed 10% investment and a 17-model joint roadmap through 2030
              reinforce that differentiation is as much ecosystem access and OEM alignment as raw algorithm claims.
            claimRefs:
