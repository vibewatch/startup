              - CV004
              - CV005
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: What supports the thesis and what blocks conviction
        blocks:
          - type: paragraph
            body: >-
              The bullish case is that Yinwang is converting Huawei's automotive software and component stack into a
              broader OEM platform rather than a single-brand captive tool. Chery signed a deeper L3/L4 roadmap, VOYAH
              expanded cooperation into software operations and marketing, and the AVATR roadmap still points to 17
              co-developed models through 2030. Huawei's broader automotive stack also shows meaningful field presence,
              with material Q1 2026 shares in cockpit controllers and AR-HUD. The anti-thesis is that strategic demand
              can still coexist with poor minority economics: the current evidence set still lacks standalone Yinwang
              financial disclosure, public shareholder-agreement terms, and a market-tested exit path, while China's
              tighter ADAS marketing and safety posture can slow multiple expansion.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario framing and comparable signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to frame scenarios but not to justify false precision. The bull case
              requires Yinwang to turn today's strategic partnerships into repeatable multi-OEM software and component
              revenue while preserving Huawei-backed technology leadership as the cockpit and ADAS stack grows. The base
              case assumes the CNY 115 billion mark remains the relevant valuation reference because the ecosystem is
              scaling, but economic transparency and liquidity stay too weak for a higher external mark. The bear case
              centers on regulatory drag, delayed commercialization, or weak minority protections forcing a later
              down-round or a long holding period. Comparable signals are therefore milestone-based: strategic stake
              sales at CNY 115 billion, Huawei's field-share rankings in key cockpit modules, and market-growth studies
              that confirm a large prize but not Yinwang-specific margin capture.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Before treating Yinwang as investable at or above the current implied mark, diligence needs to close three
              gaps. First, investors need standalone financial statements or at least segment-level revenue, gross
              margin, and cash-consumption disclosure for Yinwang rather than Huawei's broader Car BU. Second, the
              shareholder agreement needs to show reserved matters, preference rights, dilution protections, transfer
              limits, and whether Huawei can continue to steer pricing and related-party economics. Third, the next
              financing or exit path has to become more concrete because Yinwang says no IPO timetable exists today. A
              thesis break would be any combination of weaker commercialization, tighter ADAS regulation, or a new
              financing done below the current strategic-round mark.
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Yinwang is strategically valuable and still scaling, but public evidence supports the existing
              strategic-round valuation anchor more clearly than it supports a premium follow-on price. Upgrade only if
              diligence closes economics and governance gaps or if entry terms compensate for them.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV015
