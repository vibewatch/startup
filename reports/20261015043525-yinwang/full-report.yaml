chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Yinwang's core identity is no longer ambiguous: retained sources show the company was incorporated in
              Shenzhen on January 16, 2024 as the vehicle through which Huawei would separate its intelligent
              automotive-systems activities into a more investable platform. The disclosed product scope is broad rather
              than single-module. Sources consistently describe intelligent driving, smart cockpit, vehicle control,
              vehicle cloud, and adjacent AI or system-integration work, which means later diligence should treat
              Yinwang as the operating wrapper around Huawei's automotive stack, not just a single ADAS supplier. The
              business model implied by the formation record and the Changan cooperation memo is business-to-business
              supply and co-development with automakers, with Huawei transferring technology and resources into the new
              company while retaining control at formation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
