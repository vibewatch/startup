  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and spend pools
        blocks:
          - type: paragraph
            body: >-
              Yinwang's public market boundary is defined by Huawei's automotive-systems carve-out, not by total EV
              revenue. Changan's November 2023 memorandum described a new company for "automotive intelligent systems
              and component solutions," while both CnEVPost and IT之家 list the initial business scope as intelligent
              driving, smart cockpit, smart car digital platform, smart car cloud, AR-HUD, and smart car lights. That
              makes the relevant spend pool a layered software + electronics stack sold into automakers and partner
              vehicle programs, with monetization tied to domain controllers, cockpit software, cloud services,
              displays, and related modules rather than batteries, chassis, or complete-vehicle ASPs. The KrASIA and
              Gasgoo partner reports also reinforce that Yinwang is intended as an open supply platform for multiple OEM
              brands instead of a vertically integrated carmaker.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM013
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports only broad market lenses, not a fully isolated SAM/SOM for Yinwang. Verified
              Market Reports places the global automotive intelligent cockpit market at USD 29.77 billion in 2026 and
              USD 57.69 billion by 2033, while Global Market Insights sizes the global intelligent cockpit platform
              market at USD 29.8 billion in 2026 and USD 80 billion by 2035. Those figures are directionally consistent
              about category growth, but they are not directly interchangeable because one source frames the category
              around the broader intelligent-cockpit market and the other around cockpit platforms. Global Market
              Insights also says Asia Pacific is the largest region and that China generated USD 4.3 billion of its
              automotive intelligent cockpit platform market in 2025, which is the cleanest China-specific number in the
              assigned pool. Even so, the sources do not separate the subset of Chinese cockpit/platform spend that maps
              specifically to Yinwang's mix of smart driving, cockpit, digital platform, cloud, HUD, and lighting
              modules, so the chapter keeps the sizing lens broad and records the missing bridge explicitly.
            claimRefs:
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM010
              - CM014
          - type: figure
