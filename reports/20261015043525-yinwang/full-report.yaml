  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The best-supported public valuation anchor is still the same strategic round pricing: AVATR completed an
              CNY 11.5 billion payment for 10% of Yinwang, and Seres agreed to pay the same amount for another 10%,
              which points to an implied equity value near CNY 115 billion. That pricing is not obviously irrational
              because partner expansion has continued, Huawei's automotive stack is scaling, and Yinwang remains the
              vehicle through which Huawei commercializes intelligent-driving, cockpit, control, and cloud systems. The
              problem is price validation, not strategic relevance: Yinwang says there is no IPO timetable, Huawei still
              controls 80% of the cap table, and the reviewed evidence still does not expose standalone margins, cash
              generation, or shareholder protections. That mix supports a research-more call, high risk, and stretched
              valuation stance rather than a clean invest recommendation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
