            title: Full-stack scope is the core product thesis
            body: >-
              Public evidence consistently places Yinwang above a single ADAS module: it is supplying driving, cockpit,
              control, optics, cloud, and even consumer-software operations into OEM programs.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE009
          - type: callout
            title: Validation evidence is real, but assurance evidence is still thin
            body: >-
              Partner-reported testing mileage and rollout breadth show execution, but the retained evidence still lacks
              public safety-case, cybersecurity, privacy, uptime, and defect-accountability detail for underwriting the
              stack like a mature independent platform.
            calloutType: risk
