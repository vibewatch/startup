      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Yinwang still cannot be modeled as a clean software business from public evidence. The source mix instead
              points to a blended cost structure that likely includes compute, sensors or domain hardware, integration
              labor, validation, safety engineering, and post-launch support. The Seres procurement disclosure matters
              here because it confirms that the visible bill reaching an OEM partner is a bundled goods-and-services
              line, not a pure software subscription. VOYAH's January cooperation update also indicates that Yinwang's
              commercialization can include consumer- software operations work across planning and user operations,
              which implies service delivery and program-management cost in addition to embedded-system content. Since
              Yinwang does not publish standalone gross margin, a public comparable is more useful as a range anchor
              than as a valuation shortcut: ECARX reported 2025 revenue of $847.9 million with a 19% gross margin and a
              backlog above $2.5 billion, showing that scaled intelligent-cockpit suppliers can still run at margins
              well below mature enterprise-software benchmarks. Regulatory burden also matters to cost structure.
              Sidley's April 2026 analysis says China's proposed ADS standard would require a formal safety management
              system, safety-case documentation, and an automated-driving data storage system, which would add ongoing
              compliance, validation, and data-governance overhead for any supplier pushing advanced driving capability.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The capital story is strategically strong but analytically incomplete. Minority investors have paid
              headline prices that imply strategic confidence in Yinwang: AVATR completed an RMB 11.5 billion payment
              for 10% of the company by October 2025, and Seres separately agreed to pay the same amount for another 10%
              stake in 2024. Those transactions show that major ecosystem partners were willing to fund the platform at
              scale, but they do not disclose how much of the proceeds stayed inside Yinwang, what cash remained at the
              run date, or what operating burn the business now carries. The same problem applies to traction proxies:
              HIMA deliveries, Aito pricing, and Seres procurement demonstrate commercial relevance, yet none of them
              reveals Yinwang's customer concentration, take rate per vehicle, collections cadence, or margin by product
              line. The prudent financial verdict is therefore mixed. Yinwang appears to have real partner demand,
              strategic funding access, and a large enough solution scope to support meaningful revenue, but outside
              readers still lack the standalone financial statements and contract-level evidence needed to underwrite
              revenue quality, margin path, and next-round or debt dependence with confidence.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI011
              - CI012
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broader than a single ADAS module
        blocks:
          - type: paragraph
            body: >-
              Public formation and registry reporting describe Yinwang as the Huawei auto stack carved into a standalone
              entity rather than a narrow feature vendor. The January 2024 registration record tied the company to smart
              vehicle equipment manufacturing, auto-parts R&D, AI system integration, AI software development, and
              data-processing support. Later partner coverage shows that commercial packaging has expanded that base
              into a named module suite: Qiankun intelligent driving, HarmonyOS cockpit, smart vehicle control,
              intelligent automotive optics, and smart vehicle cloud services. That breadth matters because Yinwang
              appears to be monetizing a higher-content system architecture spanning software, electronics, and
              post-sale support, not just a point ADAS SKU.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
