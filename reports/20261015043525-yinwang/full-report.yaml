        title: Exhibits
        blocks:
          - type: callout
            title: OEM budget owners matter more than consumer TAM rhetoric
            body: >-
              The assigned evidence repeatedly frames Yinwang as an automotive systems supplier and open platform. That
              makes automaker program wins, equity-linked OEM alignment, and module attach rates more decision-critical
              than any single headline TAM figure.
            calloutType: insight
