  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Yinwang's call depends on whether strategic proof can be translated into auditable economics and investable
      governance.
    data:
      nodes:
        - label: Strategic valuation anchor
          detail: AVATR and Seres both committed CNY 11.5 billion for 10% stakes, implying about CNY 115 billion.
        - label: Commercial proof is broadening
          detail: Chery, VOYAH, and AVATR roadmaps show OEM expansion across driving, cockpit, and software operations.
        - label: Market position is meaningful, not dominant
          detail: Huawei posted 6.8% cockpit-controller share and 13.8% AR-HUD share in Q1 2026 rankings.
        - label: Regulatory and timing risks remain
          detail: China is tightening ADAS marketing and safety rules, and Yinwang says there is no IPO timetable.
        - label: Economics and rights are still opaque
          detail: Public evidence still lacks standalone Yinwang margins, cash-flow disclosure, and minority-rights terms.
        - label: Recommendation
          detail: Research more; keep entry discipline until disclosure or price improves.
      edges:
        - from: Strategic valuation anchor
          to: Commercial proof is broadening
          label: supports strategic relevance
        - from: Commercial proof is broadening
          to: Market position is meaningful, not dominant
          label: shows proof, not inevitability
        - from: Market position is meaningful, not dominant
          to: Regulatory and timing risks remain
          label: limits multiple expansion
        - from: Regulatory and timing risks remain
          to: Economics and rights are still opaque
          label: raises diligence burden
        - from: Economics and rights are still opaque
          to: Recommendation
          label: drives research-more outcome
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV015
