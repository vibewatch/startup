  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk stack
        blocks:
          - type: paragraph
            body: >-
              The heaviest residual risk is not that Yinwang lacks market interest, but that its operating proof is
              concentrated inside a Huawei-shaped ecosystem whose governance terms are still mostly private. Huawei
              remained the controlling shareholder in the public ownership snapshots, while Avatr and Seres were the
              only disclosed outside equity holders and JAC said its own investment terms were still unfinished, leaving
              minority protections and reserved matters undisclosed in the assigned pool. At the same time, public
              demand evidence is real but alliance-centric: Voyah said it had rolled Huawei intelligence across its
              lineup, HIMA reported about 192,000 vehicles delivered in the first five months of 2026 across five
              partner brands, and Seres attached a one-million-AITO ambition to Yinwang's systems. That breadth lowers
              single-model risk, but it does not yet show broad non-Huawei ecosystem adoption. The result is a risk
              profile where governance opacity and partner concentration still outrank raw demand scarcity.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
