              - CU005
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability, expansion economics, and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The biggest customer diligence gap is not whether Yinwang has credible named accounts—it does—but whether
              those accounts are durable, expanding, and economically attractive on a standalone basis. None of the
              retained sources disclose NRR, GRR, churn, renewal timing, contract duration, OEM-by-OEM revenue
              concentration, or module attach rates. That matters because the current proof base is still concentrated
              in a small group of Huawei-linked automakers and their associated brands. Expansion also faces a higher
              compliance bar: China's draft L2 safety standard adds functional-safety, cybersecurity, data-recording,
              hand-off-detection, and gaze-monitoring requirements, which can lengthen validation and procurement cycles
              for smart-driving suppliers. The commercial story is therefore credible but still incomplete on retention
              and concentration risk.
            claimRefs:
              - CU012
              - CU013
              - CU015
              - CU016
