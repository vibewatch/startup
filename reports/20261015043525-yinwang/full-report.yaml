  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is OEM-led, partner-heavy, and ecosystem-centric
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a B2B2C customer structure rather than a broad direct-sales motion.
              Yinwang is presented as an open platform for intelligent driving systems and components, and the named
              paying counterparties are automakers or Huawei-linked vehicle ventures rather than independent enterprise
              buyers. Avatr completed a 10% stake purchase, Seres separately disclosed its own 10% purchase, Voyah
              expanded from technical cooperation into joint software operations, and JAC was still in discussions about
              a minority investment as of April 2026. That combination suggests Yinwang wins accounts through strategic
              OEM alignment, embedded platform adoption, and downstream consumer-vehicle programs, but the disclosed
              customer set remains tightly clustered around Huawei's automotive ecosystem instead of showing diversified
              external OEM coverage.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
