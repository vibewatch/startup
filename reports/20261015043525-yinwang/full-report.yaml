      - number: '3.2'
        title: Partner equity buys distribution but also concentrates demand
        blocks:
          - type: paragraph
            body: >-
              Yinwang's strongest distribution advantage is not a public price list or broad reseller channel; it is the
              way Huawei has embedded the platform into automaker relationships. Marqstats says Seres represented 49.6%
              of Yinwang's 2025 revenue while also holding a 10% equity stake, and Gasgoo documents Avatr's own RMB 11.5
              billion purchase of another 10% stake. The JAC and VOYAH evidence pushes the same pattern further: JAC is
              evaluating an investment while extending the MAEXTRO line, and VOYAH is deepening joint operations from
              intelligent driving and cockpit modules into software-service execution and optical subsystems. Those ties
              increase switching costs and give Yinwang program access that a stand-alone software vendor would envy,
              but they also make current scale harder to read as arm's-length share capture. If the equity-linked
              partners dominate the launch book, incumbents still have room to compete for the rest of the OEM market.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
      - number: '3.3'
        title: Durability depends on bundle proof, not roadmap headlines alone
        blocks:
          - type: paragraph
            body: >-
              The moat question is therefore two-sided. On the positive side, Yinwang is competing in a cockpit and
              intelligent-vehicle category that both Global Market Insights and 6WResearch describe as benefiting from
              connected-car demand, EV penetration, AI features, and higher ADAS content. On the negative side, the same
              sources and rankings show credible substitute paths: Bosch, Continental, Harman, Aptiv, and Desay remain
              viable cockpit paths, while Qualcomm still dominates cockpit-domain controller chips in China. Public deal
              disclosures also emphasize negotiated partnerships, equity stakes, and co-development rather than
              transparent module pricing, so the outside investor cannot yet test whether Yinwang wins because its
              bundle is cheaper, more performant, or simply more tightly tied to Huawei's OEM ecosystem. Finally,
              iEVChina notes that liability-transfer rules and matched insurance products are still necessary for L3
              rollout, so a technical roadmap alone does not guarantee a durable commercial lead.
            claimRefs:
              - CP009
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is currently Yinwang's clearest edge
            body: >-
              Equity-backed OEM relationships with Seres and Avatr, possible expansion to JAC, and deeper operating
              cooperation with VOYAH give Yinwang a distribution wedge that many software-only rivals do not have.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Concentration and regulation are the two fastest moat eroders
            body: >-
              The same partner structure that accelerates rollout also leaves Yinwang exposed to customer concentration
              and to any delay in liability and insurance frameworks needed for L3 commercialization.
            calloutType: risk
            claimRefs:
              - CP004
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The public record supports a B2B automotive-systems revenue model rather than a consumer software or
              pure-licensing one. Huawei's pre-spin automotive unit said it focused on supplying automotive components,
              especially autonomous-driving systems, through the HI model, and that it supplied software and hardware
              with a smart cockpit while leaving car design and marketing to automakers. EyeShenzhen's recap of the
              spinout adds that Yinwang's scope covers smart-car equipment manufacturing, AI system integration
              services, and AI software development, which implies a mixed hardware-software-services bill rather than a
              narrow SaaS contract. The strongest current monetization proxy is not a published Yinwang price card but
              Seres' related- party disclosure: Seres said it bought RMB 9.84 billion of Yinwang goods and services in
              the first half of 2026 against a RMB 26.0 billion full-year forecast. That figure is economically
              important because it shows real procurement flowing through a major ecosystem partner, yet the disclosure
              still does not separate hardware, software, and service content. Public traction is therefore visible
              mainly through partner channels. HIMA delivered about 192,000 vehicles in the first five months of 2026,
              and the new Aito M9 reportedly drew more than 20,000 firm orders within 24 hours at a starting price of
              RMB 479,800. Those signals support demand for the Huawei-aligned ecosystem, but they are not the same as
              Yinwang standalone revenue, ARR, or gross profit.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
