  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence ranks governance opacity, partner concentration, and roadmap execution as the highest residual
      exposures.
    data:
      columns:
        - label: Likelihood
          note: Near-term probability based on public disclosures and milestone timing.
        - label: Impact
          note: Effect on commercialization, financing flexibility, or governance leverage.
        - label: Mitigation maturity
          note: How developed the visible public mitigation appears today.
        - label: Residual exposure
          note: Net severity after visible mitigations and diversification signals.
      rows:
        - label: Governance / control opacity
          note: Public ownership is visible, but shareholder rights and reserved matters are not.
          values:
            - label: Medium
              note: Control is clear today, but future ownership changes are still active.
            - label: High
              note: Governance terms could affect financing, partner incentives, and downside protection.
            - label: Low-Medium
              note: Visible mitigation is mainly staged external ownership rather than disclosed governance rights.
            - label: High
        - label: Partner concentration inside Huawei-linked channels
          note: Current adoption proof is meaningful but still concentrated in the HIMA and Hongmeng partner set.
          values:
            - label: Medium
            - label: High
            - label: Medium
              note: Multi-brand coverage helps, but it remains ecosystem-internal diversification.
            - label: High
        - label: Roadmap and integration slippage
          note: 2026-2028 autonomy milestones require synchronized engineering and approvals.
          values:
            - label: High
            - label: High
            - label: Medium
              note: Joint teams and staged roadmap help, but public milestone proof is still limited.
            - label: High
        - label: Valuation and financing expectations
          note: The public denial of an IPO timeline did not reduce the headline valuation anchor.
          values:
            - label: Medium
            - label: Medium-High
            - label: Low-Medium
              note: Current mitigation is mostly messaging rather than added disclosure.
            - label: Medium-High
        - label: Partner financial health
          note: Public partner disclosures show commitment, but not uniformly strong balance sheets or sales attainment.
          values:
            - label: Medium
            - label: High
            - label: Medium
              note: Equity alignment helps, but it does not erase partner losses or weaker-than-target sales.
            - label: High
        - label: Security and incident blind spot
          note: >-
            The assigned pool does not provide direct recall, incident, or certification evidence for Yinwang's deployed
            systems.
          values:
            - label: Medium
            - label: Medium-High
            - label: Low
              note: Public mitigation is weak because core safety and incident artifacts are absent from the pool.
            - label: Medium-High
    approximationNotes: >-
      Ordinal ratings synthesize the assigned public evidence; they are not statistical probabilities and should be
      updated if direct diligence yields contract, approval, or incident data.
