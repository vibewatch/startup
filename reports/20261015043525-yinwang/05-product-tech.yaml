      whyItMatters: Without public or shared control evidence, diligence cannot separate a scaled commercial rollout from a mature independently underwritable platform.
      diligencePath: Obtain security and safety certifications, audit summaries, defect/recall history, and operational SLA documents from Yinwang and at least one OEM customer.
