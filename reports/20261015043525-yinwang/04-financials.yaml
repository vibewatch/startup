    title: Revenue streams table
    columns:
      - Revenue stream
      - Mechanism
      - Unit
      - Current public value or status
      - Revenue quality
      - Diligence ask
    rows:
      - - Intelligent driving and cockpit systems
        - OEM-facing supply of components, software, and technical solutions under Huawei's HI model
        - Vehicle program / OEM contract
        - Publicly disclosed as the operating model, but no Yinwang rate card or standalone mix
        - Embedded and strategic if awarded, but realized economics are opaque
        - Provide revenue mix by ADS, cockpit, control, cloud, and services
      - - Bundled goods and services to Seres
        - Related-party procurement for Yinwang goods and services
        - RMB purchases
        - RMB 9.84 billion in H1 2026; RMB 26.0 billion full-year forecast
        - Strongest realized billings proxy, but still bundled
        - Split hardware, software, and service content by contract
      - - Consumer software operations with OEM partners
        - Joint user-operations and commercialization work with partner brands
        - Partner program
        - VOYAH agreement confirms the model; pricing and revenue share undisclosed
        - Could create recurring service revenue, but monetization terms are unknown
        - Disclose fee model, attach rate, and renewal mechanics
      - - Pre-spin IAS baseline
        - Huawei automotive unit revenue before the carve-out into Yinwang
        - RMB revenue
        - About RMB 4.7 billion in 2023, up 128.1% year on year
        - Useful historical baseline only, not Yinwang standalone run rate
        - Provide 2023 IAS to 2024-2026 Yinwang bridge
    notes: >-
      Public evidence supports multiple revenue mechanisms, but only Seres' procurement disclosure
      gives a current realized billings proxy; no source breaks out Yinwang standalone revenue mix.
