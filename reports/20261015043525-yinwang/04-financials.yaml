  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: standalone-financial-statements
      missingEvidence: Audited Yinwang standalone income statement, cash-flow statement, and balance sheet for 2024-2026 year-to-date.
      whyItMatters: Without standalone statements, the chapter cannot underwrite revenue scale, margin, burn, working-capital drag, or true financing dependency.
      diligencePath: Obtain audited financial statements plus the latest monthly management accounts and variance commentary from finance.
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: OEM-by-OEM and product-line revenue split across ADS, cockpit, control, cloud, and software-service operations.
      whyItMatters: Public procurement and delivery proxies do not show which activities are recurring, which are pass-through hardware, and which carry software-like margins.
      diligencePath: Request customer and product revenue bridges, contract minimums, and renewal / support terms for the top programs.
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Realized content value per vehicle, BOM or supplier-cost split, support cost, and customer-acquisition or payback metrics.
      whyItMatters: These inputs determine whether growth expands contribution margin or merely scales working capital and delivery burden.
      diligencePath: Review sample OEM contracts, program P&Ls, gross-margin waterfalls, and management cohort analyses by model and customer.
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, runway, debt or guarantee obligations, and next-round trigger thresholds.
      whyItMatters: Minority stake prices do not prove liquidity sufficiency or reveal whether Yinwang needs additional capital to fund growth and compliance.
      diligencePath: Request treasury cash bridge, board budget, covenant schedule, and 12- to 24-month financing plan.
