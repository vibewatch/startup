  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Standalone revenue or ARR
        - null
        - Low
        - Without a disclosed revenue base, no public observer can translate procurement proxies into scale
        - Audited standalone income statement plus monthly revenue bridge
      - - Standalone gross margin
        - null
        - Low
        - Margin path determines whether Yinwang behaves like hardware, software, or a blended systems supplier
        - Gross margin by hardware, software, and services line
      - - Best public billings proxy
        - RMB 9.84 billion H1 2026 Seres procurement; RMB 26.0 billion FY forecast
        - Medium
        - Strongest current signal of realized commercial throughput
        - Customer-level revenue share and recurring vs one-off mix
      - - Ecosystem volume proxy
        - HIMA delivered about 192,000 vehicles in Jan-May 2026; Aito M9 logged 20,000+ firm orders in 24 hours
        - Medium
        - Partner deliveries indicate possible Yinwang content volume, but not take rate or collections
        - Content value per vehicle and attach rate by model
      - - Comparable margin benchmark
        - ECARX reported $847.9 million revenue and 19% gross margin in 2025
        - Medium
        - Suggests scaled cockpit suppliers can remain well below pure-software gross margins
        - Yinwang standalone gross margin and BOM / support-cost split
      - - Regulatory compliance burden
        - Proposed ADS standard would require safety management, safety-case inspection, and DSSAD
        - Medium
        - Compliance obligations can add validation, storage, and operational cost
        - 2026-2028 compliance opex / capex plan and regulatory readiness budget
    notes: >-
      Nulls mean unavailable public data, not zero values; public proxies describe throughput and
      comparable economics, but they do not close the underwriting gap on Yinwang's own unit economics.
