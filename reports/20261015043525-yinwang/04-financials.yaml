        - Realized partner procurement rather than list pricing
        - Hardware, software, and services are not separated
        - SI001
      - - AVATR strategic investment
        - RMB 11.5 billion for a 10% equity stake
        - Capital-market validation, not product pricing
        - No revenue multiple is knowable from public standalone financials
        - SI003
      - - Seres strategic investment
        - RMB 11.5 billion for a 10% equity stake
        - Capital-market validation, not product pricing
        - Does not reveal Yinwang cash balance, burn, or take rate
        - SI005
      - - Aito M9 end-customer pricing
        - Starting price RMB 479,800; over 20,000 firm orders within 24 hours
        - End-market vehicle price and demand signal
        - Yinwang content value per vehicle is undisclosed
        - SI006
    notes: >-
      Yinwang does not publish direct module or software list pricing, so public monetization evidence
      mixes realized procurement, strategic equity pricing, and end-vehicle price points.
