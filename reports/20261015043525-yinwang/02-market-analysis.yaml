  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow
      - Adoption trigger
    rows:
      - - Open-platform anchor OEMs
        - Huawei-aligned automaker strategy and architecture teams
        - Drivers and passengers using integrated ADAS + cockpit features
        - OEM product, sourcing, and strategic-investment budgets
        - Select a common systems supplier across intelligent driving, cockpit, and cloud layers
        - Faster launch cadence and access to Huawei-derived stack integration
      - - AVATR / Chang'an ecosystem
        - AVATR and Chang'an leadership
        - Premium EV buyers
        - Strategic investment plus vehicle-program budgets
        - Equity-linked cooperation with co-development roadmap
        - 10% equity stake and planned model expansion through 2030
      - - VOYAH
        - VOYAH product and software teams
        - VOYAH vehicle owners and in-car software users
        - Intelligent-vehicle R&D and commercialization budgets
        - Joint development of driving, cockpit, and consumer software operations
        - Full-lineup intelligence strategy and L3 commercialization push
      - - Chery
        - Chery ADAS and autonomous-driving program owners
        - Drivers, fleet operators, and later robotaxi / logistics users
        - Advanced-driving and platform budgets
        - L3 pilot to commercial L3 deployment, then L4 applications
        - Mass-production focus during the 2026-2030 planning period
      - - Broader HIMA partner network
        - Seres, JAC, and other partner-brand program teams
        - Buyers of Aito, Stelato, Luxeed, and Maextro vehicles
        - OEM sourcing budgets plus strategic alignment capital
        - Two-way supply model across multiple partner brands
        - Access to proven Huawei-aligned modules without Huawei becoming the OEM
    notes: >-
      Rows show the adoption path suggested by public partner announcements; they are indicative,
      not an exhaustive customer roster.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM012]
