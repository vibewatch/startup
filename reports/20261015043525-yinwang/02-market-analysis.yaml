      - - Smart cockpit and consumer software
        - Smart cockpit, HarmonyOS-style in-car software, and consumer software operations
        - Generic infotainment spend unrelated to Yinwang-integrated stacks
        - OEM software, UX, and digital-service budgets
        - Core scope; VOYAH agreement expands explicitly into cockpit and software operations
      - - Vehicle digital platform and cloud
        - Smart car digital platform and smart car cloud services
        - Dealer IT, generic enterprise SaaS, and non-vehicle back-office software
        - OEM platform, connectivity, and lifecycle-service budgets
        - In public business scope, but monetization details remain undisclosed
      - - AR-HUD, lighting, and display modules
        - AR-HUD, intelligent lighting, display systems, and related HMI modules
        - Interior trim and non-intelligent commodity components
        - Vehicle-line engineering and feature-package budgets
        - Relevant adjacent module layer that broadens Yinwang's attach surface
      - - Excluded revenue pools
        - null
        - Vehicle manufacturing revenue, financing income, and broad EV market GMV
        - null
        - Excluded to avoid overstating Yinwang's addressable spend
    notes: >-
      Boundary logic is derived from public business-scope descriptions and OEM cooperation
      announcements; null marks cells that do not apply to the exclusion row.
