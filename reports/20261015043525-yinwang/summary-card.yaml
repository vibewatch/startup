  topStrengths:
    - Strategic OEM demand is real, with AVATR, Seres, Chery, and Voyah all validating the platform in public reporting.
    - >-
      Yinwang has a broad product footprint across intelligent driving, cockpit, control, and cloud rather than a
      single-module dependency.
    - The implied CNY 115 billion mark is anchored by disclosed strategic share sales, not purely by speculation.
  topRisks:
    - Standalone financial statements, margins, cash flow, and customer concentration remain undisclosed.
    - Governance and minority-rights terms are still opaque despite the strategic share sales.
    - Regulatory timing, partner concentration, and an absent IPO timetable can delay or compress future exits.
  unresolvedGaps:
    - Audited standalone Yinwang income statement, cash-flow statement, and balance-sheet data.
    - Module-level revenue mix and gross margin split across ADS, cockpit, control, cloud, and launch-support services.
    - OEM-by-OEM customer concentration, contract duration, renewal behavior, and take rates.
    - Full shareholder agreement, reserved matters, and minority-protection terms after the Avatr and Seres investments.
    - Evidence that ecosystem breadth beyond the AITO core can sustain Huawei-scale economics.
