evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-metric-disclosure
    missingEvidence: Standalone Yinwang revenue, customer count, audited financial statements, and a corroborated employee count.
    whyItMatters: >-
      Without those metrics, the company-overview chapter can establish strategic relevance and valuation markers but
      not operating efficiency or scale quality.
    diligencePath: >-
      Request audited standalone financials, customer-count disclosure, and HR headcount confirmation from
      Huawei/Yinwang or strategic investors; cross-check future filings and investor presentations.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A complete board slate, executive roster, and shareholder-rights package for Yinwang.
    whyItMatters: >-
      Publicly named Huawei-linked managers are not enough to assess true decision rights, minority protections, or
      succession depth.
    diligencePath: >-
      Request current articles of association, board composition, and signed shareholder agreements from Huawei, Avatr,
      and Seres.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      An exhaustive shareholder register, customer roster, and concentration view linking each OEM program to revenue
      exposure.
    whyItMatters: >-
      The sample of disclosed partners does not reveal how dependent Yinwang is on any single OEM, program, or
      Huawei-led channel.
    diligencePath: >-
      Request cap-table detail, top-customer concentration, program-level revenue mix, and contract duration data from
      management or strategic investors.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Yinwang-specific China SAM/SOM by module, attach rate, and pricing assumptions across intelligent driving,
      cockpit, cloud, HUD, and lighting layers.
    whyItMatters: Public market totals are too broad to translate directly into revenue potential or valuation support for Yinwang.
    diligencePath: >-
      Request management or investor materials that break out module pricing, target OEM volumes, attach rates, and
      China segment priorities.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
