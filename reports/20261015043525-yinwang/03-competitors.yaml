      - ["Distribution access", "Huawei ecosystem plus existing HIMA / Avatr / GAC / BAIC / SAIC / Chery relationships", "Program-by-program OEM wins", "Broad industry access but less evidence of equity-linked launch access", "Strong where OEM has strategic control, weaker where integration burden is high"]
      - ["Trust / regulatory posture", "Large installed base and named 2027-2028 roadmap, but still needs liability and insurance scaffolding", "Also chasing L3 timing; certification speed remains open", "Incumbent production experience but not necessarily end-to-end autonomy differentiation", "OEM retains control of certification path but also bears more integration burden"]
      - ["Switching cost after launch", "High if software operations, cockpit, and optical modules are co-developed", "Medium until production commitments are signed", "Medium because OEM can multi-source around component boundaries", "High internal dependence once architecture is frozen, but requires more OEM capability upfront"]
    notes: >-
      Qualitative cells summarize what the retained public evidence supports. "Unknown" or narrower
      wording is used where the assigned pool does not provide direct proof on a specific capability
      layer or OEM decision criterion.
    claimRefs: [CP002, CP003, CP007, CP010, CP012, CP013, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Path
      - Price / unit / contract model
      - Included capabilities
      - Discount / unknowns
      - Implication
    rows:
      - ["Yinwang core platform", "Public retained sources do not disclose module list pricing; commercial evidence appears as negotiated OEM programs", "Intelligent driving, cockpit, control, cloud, sensors, ADCU", "Discounting and take rates undisclosed", "Bundle may win on integration, but outside readers cannot yet test economics directly"]
      - ["Equity-backed partner path (Seres / Avatr / possible JAC)", "Equity investment plus program sourcing rather than posted software SKU pricing", "Platform access plus strategic alignment and launch priority", "Realized transfer pricing not disclosed", "Commercial lock-in may matter more than sticker price in early adoption"]
      - ["VOYAH-style co-development path", "Strategic cooperation and joint operations disclosed; no public module price disclosed", "Driving, cockpit, software operations, optical modules", "Revenue share and software-service economics unknown", "Deep co-development can raise switching cost without clarifying margins"]
      - ["Componentized incumbent stack", "Component or subsystem sourcing by controller, chip, or cockpit layer", "OEM can mix cockpit controllers, chips, and HMI suppliers", "Cross-supplier integration cost is OEM-specific", "Best-of-breed sourcing remains a credible substitute to Yinwang's end-to-end bundle"]
    notes: >-
      "Undisclosed" means the retained sources describe investments, strategic cooperation, or category
      structure without publishing module-level Yinwang list prices or discount schedules. It should not
      be read as evidence that price is unimportant or absent.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP014]
figures:
