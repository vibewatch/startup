      - ["Continental / Harman / Aptiv / Panasonic", "Global cockpit-platform incumbents", "Top five global cockpit-platform vendors held 19% share in 2025; Bosch led at >9.15%", "Global OEM cockpit and in-vehicle experience programs", "Established relationships across infotainment, HMI, and cockpit integration", "Retained sources do not show them matching Yinwang's China-specific partner-equity distribution"]
