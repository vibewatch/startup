    notes: >-
      Mixes direct rivals with buyer substitute paths because the job-to-be-done is an OEM platform
      decision, not a single-software SKU purchase. Scale signals are reported exactly as surfaced in
      retained sources and are not normalized into comparable revenue metrics.
    claimRefs: [CP001, CP004, CP006, CP008, CP010, CP012, CP015]
