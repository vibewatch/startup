    title: Competitive positioning map
    type: quadrant
    summary: >-
      The strongest public contrast is between Yinwang's integration breadth and the distribution leverage
      created by partner-equity channels, versus substitute paths that remain narrower or less captive.
    data:
      xAxis:
        label: Integration breadth (ordinal 1-5)
        min: 1
        max: 5
        lowLabel: Narrow component scope
        highLabel: End-to-end vehicle stack
      yAxis:
        label: Distribution leverage / lock-in (ordinal 1-5)
        min: 1
        max: 5
        lowLabel: Program-by-program competition
        highLabel: Equity-backed or deeply embedded channel
      points:
        - label: Yinwang
          x: 5
          y: 5
          detail: Full-stack bundle plus Huawei-linked OEM channel access
          claimRefs: [CP002, CP003, CP004, CP005]
        - label: Full-stack challengers
          x: 4
          y: 2
          detail: Xiaomi / XPeng / Nvidia-linked programs compete on roadmap timing but with less equity-backed distribution proof in this source set
          claimRefs: [CP001, CP012]
        - label: Cockpit incumbents
          x: 3
          y: 4
          detail: Desay, Bosch, and global cockpit vendors have scale and relationships but narrower stack scope
          claimRefs: [CP008, CP010]
        - label: Chip-led path
          x: 2
          y: 3
          detail: Qualcomm-dominated cockpit-chip layer supports a best-of-breed substitute path
          claimRefs: [CP011, CP015]
        - label: Partner captive build
          x: 4
          y: 5
          detail: Seres / Avatr / JAC-style alignment raises switching cost even before public pricing is clear
          claimRefs: [CP004, CP005, CP006, CP014]
        - label: Internal best-of-breed sourcing
          x: 2
          y: 2
          detail: OEMs can still assemble their own stack across components, but with more integration burden
          claimRefs: [CP010, CP011, CP015]
    approximationNotes: >-
      Coordinates are ordinal synthesis scores derived from retained evidence on stack breadth and channel
      embedment, not normalized market-share or margin data.
    claimRefs: [CP003, CP004, CP005, CP010, CP011, CP012, CP015]
