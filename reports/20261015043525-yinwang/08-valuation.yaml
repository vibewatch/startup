callouts:
  - calloutType: "recommendation"
    title: "Current call"
    body: >-
      Yinwang is strategically valuable and still scaling, but public evidence supports the
      existing strategic-round valuation anchor more clearly than it supports a premium
      follow-on price. Upgrade only if diligence closes economics and governance gaps or if
      entry terms compensate for them.
    claimRefs: ["CV003", "CV005", "CV015"]
