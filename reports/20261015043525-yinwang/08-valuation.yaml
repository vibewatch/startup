  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Multi-OEM programs convert into recurring software and component revenue, Huawei-backed stack keeps gaining share, and governance/disclosure improves.", "Upside requires a financing or exit event above the CNY 115 billion strategic mark because public evidence would then support better liquidity and lower uncertainty.", "Execution slippage, partner concentration, and continued opacity on margins.", "Needs auditable standalone economics plus evidence that new OEM wins monetize beyond launch support."]
      - ["Base", "Partner expansion continues, but economics remain partly opaque and no near-term IPO path is opened.", "CNY 115 billion stays the practical reference point; holding return depends more on later diligence and entry price than on today’s public rerating case.", "Long holding period, governance asymmetry, and moderate regulatory drag.", "Most consistent with current evidence set: real traction, incomplete price proof."]
      - ["Bear", "ADAS regulation tightens, commercialization slips, or new investors demand tougher terms than the 2024-2025 strategic rounds.", "A later round below the implied CNY 115 billion mark or heavily structured terms would compress returns and expose that strategic investors paid for optionality more than standalone cash flow.", "Down-round risk, weak minority protections, delayed liquidity, and sector multiple compression.", "Supported by the lack of IPO timing and tighter safety/marketing posture around driving assistance."]
    notes: "Scenario ranges are milestone-based because the public evidence set lacks standalone Yinwang financial statements and a clean public-comp bridge."
    claimRefs: ["CV001", "CV002", "CV003", "CV005", "CV010", "CV011", "CV012", "CV015"]
