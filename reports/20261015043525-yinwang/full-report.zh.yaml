      - number: '4.2'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据仍不足以把 Yinwang 当作纯软件公司建模。现有来源更支持一种混合成本结构，可能包括算力、传感器或域硬件、集成劳动力、验证、安全工程和上市后支持。Seres 的采购披露很关键，因为它确认 OEM
              伙伴看到的是软硬件与服务打包的账单，而非纯软件订阅。VOYAH 1 月合作更新还显示，Yinwang
              的商业化可能包含覆盖规划和用户运营的消费者软件运营工作；因此，除嵌入式系统内容外，还会产生服务交付和项目管理成本。Yinwang 没有披露独立毛利率，所以公开可比公司更适合用作区间锚点，而非估值捷径：ECARX
              报告 2025 年收入为 $847.9 million、毛利率 19%、积压订单超过 $2.5 billion，说明规模化智能座舱供应商的利润率仍可能远低于成熟企业软件基准。监管负担也会影响成本结构。Sidley
              2026 年 4 月的分析称，中国拟议的 ADS 标准将要求正式的安全管理体系、安全案例文件和自动驾驶数据存储系统，这会给任何推进高阶驾驶能力的供应商增加持续的合规、验证和数据治理开销。
