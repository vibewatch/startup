        - 通常只在控制器、座舱平台或芯片中的某一层最强
        - 可以混用偏好的模块，但必须内部集成
      - - 分销渠道
        - Huawei 生态，以及现有的 HIMA / Avatr / GAC / BAIC / SAIC / Chery 关系
        - 按项目逐一赢得 OEM
        - 行业覆盖广，但股权绑定的上市渠道证据较少
        - OEM 具备战略控制时更强；集成负担重时更弱
      - - 信任 / 监管姿态
