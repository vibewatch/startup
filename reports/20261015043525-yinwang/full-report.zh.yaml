            body: >-
              看多逻辑是，Yinwang 正把华为汽车软件与零部件技术栈转成更广泛的 OEM 平台，而不是某个品牌专属的封闭工具。Chery 签署了更深入的 L3/L4 路线图，VOYAH
              将合作扩展到软件运营和营销，AVATR 路线图仍指向 2030 年前联合开发 17 款车型。华为更广泛的汽车技术栈也已在市场上形成明显存在感，2026 年第一季度在座舱控制器和 AR-HUD
              领域占有重要份额。反方逻辑是，战略需求仍可能与糟糕的少数股东经济性并存：现有资料缺少 Yinwang 独立财务披露、公开股东协议条款和经过市场检验的退出路径，而中国更严格的 ADAS
              营销与安全监管可能压低估值倍数扩张。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景框架与可比信号
        blocks:
          - type: paragraph
            body: >-
              公开证据足以搭建情景框架，但不足以支撑虚假的精确度。乐观情景要求 Yinwang 把当前战略合作转化为可重复的多 OEM 软件和零部件收入，同时在座舱和 ADAS
              技术栈增长时保持华为支持的技术领先地位。基准情景假定 CNY 115 billion
              仍是相关估值参考，因为生态正在扩大，但经济透明度和流动性仍太弱，无法支撑更高的外部估值。悲观情景则是监管拖累、商业化延期或少数股东保护薄弱，迫使公司日后折价融资或让投资者长期持有。因此，可比信号应围绕里程碑观察：以
              CNY 115 billion 估值完成的战略股权出售、华为在关键座舱模块中的市场份额排名，以及证明市场空间很大但不证明 Yinwang 能截留相应利润的市场增长研究。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              在把 Yinwang 视为当前隐含估值或更高估值上的可投资标的之前，尽调需要补上三项缺口。第一，投资者需要 Yinwang 的独立财务报表，或至少需要其分部收入、毛利率和现金消耗披露，而不是华为更大范围的车 BU
              数据。第二，股东协议需要说明保留事项、优先权、反稀释保护、转让限制，以及华为是否能继续主导定价和关联方经济安排。第三，下一轮融资或退出路径必须更具体，因为 Yinwang 表示目前没有 IPO
              时间表。商业化走弱、ADAS 监管收紧或新融资低于当前战略轮估值中的任一组合，都将使投资论点失效。
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 当前判断
            body: Yinwang 具有战略价值且仍在扩张，但公开证据更清楚地支持现有战略轮估值锚点，而不是溢价追加投资价格。只有在尽调补上经济性和治理缺口，或进入条款足以补偿这些缺口时，才应上调判断。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV015
