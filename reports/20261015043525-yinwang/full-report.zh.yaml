  - id: TV003
    title: 看多 / 基准 / 看空情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 看多
        - 多 OEM 项目转化为经常性软件和零部件收入，Huawei 支持的技术栈继续扩大份额，治理和披露改善。
        - 上行空间需要融资或退出事件价格高于 CNY 115 billion（约 1150 亿元人民币）的战略估值标记，因为届时公开证据应能支持更好的流动性和更低的不确定性。
        - 执行延误、合作伙伴集中，以及利润率持续不透明。
        - 需要可审计的单体经济性，并证明新 OEM 赢单的变现不止于上市支持。
      - - 基准
        - 合作伙伴继续扩张，但经济性仍部分不透明，近期也没有开启 IPO 路径。
        - CNY 115 billion（约 1150 亿元人民币）仍是实际参考点；持有回报更多取决于后续尽调和入场价格，而不是今天公开信息支持的重估逻辑。
        - 持有期长、治理不对称，以及中等程度的监管拖累。
        - 与当前证据集最一致：进展真实，但价格证明不完整。
      - - 看空
        - ADAS 监管收紧、商业化延误，或新投资者要求比 2024—2025 年战略轮更严苛的条款。
        - 后续融资若低于隐含的 CNY 115 billion（约 1150 亿元人民币）估值，或条款高度结构化，都会压缩回报，也会暴露出战略投资者买的是期权价值，而非独立现金流。
        - 下轮融资估值下调、少数股东保护薄弱、流动性延后，以及行业估值倍数压缩。
        - IPO 时间表尚未公布，且驾驶辅助的安全与营销监管趋严，这些因素共同支持该判断。
    notes: 由于公开证据中没有阴望独立财务报表，也没有清晰的公开可比估值桥接，情景区间按里程碑设定。
