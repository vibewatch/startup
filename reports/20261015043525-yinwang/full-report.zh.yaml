      - number: '1.2'
        title: 控制权、资本与治理
        blocks:
          - type: paragraph
            body: >-
              融资历史显示，Yinwang 已向战略车企开放股权，但在财务上仍未脱离华为。Avatr 和 Seres 均同意以 RMB 11.5 billion（约 115 亿元人民币）购买 10% 股权，意味着
              2024—2025 年交易对应的估值约为 RMB 115 billion（约 1150
              亿元人民币），而华为仍是控股股东。治理披露远少于所有权披露。公开留存来源显示，郑丽英和宋柳平担任实体治理职务，并记录了徐直军关于 Yinwang
              更希望引入战略车企投资者、而非财务投资者的表述。完整董事会名单、保留事项清单和股东权利安排公开前，决策仍处于华为生态内部，也带来关键人物和合作伙伴协同风险。
