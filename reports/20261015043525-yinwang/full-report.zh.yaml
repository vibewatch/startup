              表示自身投资条款尚未敲定，因此指定资料池没有披露少数股东保护和保留事项。与此同时，公开需求证据确实存在，但以联盟为中心：Voyah 称已将华为智能化方案覆盖全系车型，HIMA 报告 2026
              年前五个月五个合作品牌共交付约 19.2 万辆，Seres 还把百万辆 AITO 目标绑定到 Yinwang
