      - number: '3.3'
        title: 持久性取决于打包方案的证明，而不只是路线图标题
        blocks:
          - type: paragraph
            body: >-
              护城河问题有两面。积极的一面是，Yinwang 参与的是座舱和智能汽车品类，Global Market Insights 与 6WResearch 都认为该品类受益于联网汽车需求、EV 渗透、AI 功能和更高的
              ADAS 装配率。消极的一面是，同样的来源和排名显示，替代路径依然可信：Bosch、Continental、Harman、Aptiv 和 Desay 仍是可行的座舱方案，而 Qualcomm
              仍主导中国座舱域控制器芯片。公开交易披露也强调协商合作、股权投资和联合开发，而非透明的模块定价，因此外部投资者还无法判断 Yinwang 胜出是因为打包方案更便宜、性能更好，还是仅仅与华为 OEM
              生态绑定得更紧。最后，iEVChina 指出，L3 落地仍需要责任转移规则和配套保险产品，因此单有技术路线图并不能保证持久的商业领先。
            claimRefs:
              - CP009
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 分销目前是 Yinwang 最清晰的优势
            body: 与 Seres 和 Avatr 的股权绑定 OEM 关系、向 JAC 扩展的可能性，以及与 VOYAH 更深入的运营合作，为 Yinwang 提供了许多纯软件竞争者不具备的分销切口。
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: callout
            title: 集中度和监管是两大最快侵蚀护城河的因素
            body: 加速落地的同一套伙伴结构，也让 Yinwang 暴露于客户集中度风险，以及 L3 商业化所需责任和保险框架延迟的风险。
            calloutType: risk
            claimRefs:
              - CP004
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 B2B 汽车系统收入模式，而非消费者软件或纯授权模式。华为剥离前的汽车业务称，其 HI
              模式重点供应汽车部件，尤其是自动驾驶系统；同时提供智能座舱软硬件，把整车设计和营销留给车企。EyeShenzhen 对剥离的回顾补充称，Yinwang 覆盖智能汽车设备制造、AI 系统集成服务和 AI
              软件开发，意味着它收取的是软硬件与服务的混合费用，而非狭窄的 SaaS 合同。当前最强的变现代理指标不是 Yinwang 发布的价目表，而是 Seres 的关联方披露：Seres 称 2026 年上半年采购
              Yinwang 商品和服务 RMB 9.84 billion（约 98.4 亿元人民币），全年预测为 RMB 26.0 billion（约 260
              亿元）。该数字重要之处在于，它显示真实采购正通过主要生态伙伴流动，但披露仍未拆分硬件、软件和服务内容。因此，公开牵引力主要通过伙伴渠道可见。HIMA 在 2026 年前五个月交付约 192,000 辆汽车，新款
              Aito M9 据报道在 24 小时内获得超过 20,000 个确定订单，起售价为 RMB 479,800（约 47.98 万元人民币）。这些信号支持对华为生态的需求，但不等同于 Yinwang
              的独立收入、ARR 或毛利。
