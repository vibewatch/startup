  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出池
        blocks:
          - type: paragraph
            body: >-
              Yinwang 的公开市场边界由华为汽车系统业务的剥离范围定义，而不是由 EV 总收入定义。长安 2023 年 11 月备忘录将新公司描述为提供“汽车智能系统和部件解决方案”，CnEVPost 与
              IT之家均将初始业务范围列为智能驾驶、智能座舱、智能汽车数字平台、智能汽车云、AR-HUD
              和智能车灯。因此，相关支出池是面向车企及合作车型项目销售的分层软件与电子系统栈，变现依托域控制器、座舱软件、云服务、显示屏及相关模块，而不是电池、底盘或整车 ASP。KrASIA 和 Gasgoo
              的合作伙伴报道也进一步说明，Yinwang 的定位是面向多个 OEM 品牌的开放供应平台，而非垂直整合的车企。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM013
      - number: '2.2'
        title: 估值视角及其无法证明的事项
        blocks:
          - type: paragraph
            body: >-
              这组资料只能支持宽口径市场视角，无法为 Yinwang 单独拆出完整的 SAM/SOM。Verified Market Reports 预计全球汽车智能座舱市场 2026 年为 USD 29.77
              billion（约 297.7 亿美元）、2033 年为 USD 57.69 billion（约 576.9 亿美元）；Global Market Insights 则将全球智能座舱平台市场规模定为 2026 年
              USD 29.8 billion（约 298 亿美元）、2035 年 USD 80 billion（约 800
              亿美元）。两组数字对品类增长方向基本一致，但不能直接互换，因为前者指向更宽的智能座舱市场，后者指向座舱平台。Global Market Insights 还称亚太是最大区域，中国 2025
              年在其汽车智能座舱平台市场中贡献 USD 4.3 billion（约 43 亿美元），这是本组资料中最清晰的中国口径数字。即便如此，来源仍未拆出与 Yinwang 的智能驾驶、座舱、数字平台、云、HUD
              和车灯模块组合相对应的中国座舱/平台支出，因此本章保留宽口径估值视角，并明确记录缺失的映射桥梁。
            claimRefs:
              - CM009
              - CM010
              - CM014
