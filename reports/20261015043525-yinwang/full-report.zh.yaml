      - number: '4.3'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              资本故事在战略上很强，但分析上并不完整。少数股东支付的标志性价格说明市场对 Yinwang 有战略信心：AVATR 在 2025 年 10 月前已支付 RMB 11.5 billion（约 115
              亿元人民币）购买公司 10% 股权，Seres 也在 2024 年另行同意以同样金额购买 10%。这些交易说明主要生态伙伴愿意大规模为平台提供资金，但没有披露所得款项有多少留在
              Yinwang、截至报告日剩余多少现金，或公司当前承担多少运营消耗。同样的问题也存在于牵引力代理指标：HIMA 交付量、Aito 定价和 Seres 采购证明了商业相关性，却都没有揭示 Yinwang
              的客户集中度、每辆车的收入截留、回款节奏或产品线毛利。因此，审慎的财务判断是混合的。Yinwang
              似乎拥有真实的伙伴需求、战略融资渠道，以及足以支撑有意义收入的解决方案范围，但外部读者仍缺少独立财务报表和合同层面的证据，无法有把握地评估收入质量、利润路径以及对下一轮融资或债务的依赖。
