      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方是车企项目负责人，而不是终端驾驶者。Yinwang 的公开需求信号来自战略 OEM 合作和股权联盟：AVATR 已完成 10% 股权付款，Seres 宣布了同样的 10% 股权购买价，VOYAH
              将合作扩展到智能驾驶、智能座舱和消费者软件运营，Chery 则把与 Yinwang 的合作拓展到 L3 和 L4 项目。KrASIA 补充称，Yinwang 预计会运行双向供应模式，同时服务 AVATR 以及
              Aito、Stelato、Luxeed 和 Maextro 等华为现有合作品牌。实际而言，Yinwang 的采用路径由 OEM 主导：产品规划团队和 E/E
              架构负责人选择技术栈，采购和战略团队出资，驾驶员和乘客则是软件定义座舱及 ADAS 体验的下游用户。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              外部市场报告和合作伙伴公告指向同一套采用逻辑：车企正试图把信息娱乐、导航、ADAS 可视化、连接和整车控制功能集中到软件定义座舱架构中，而与华为合作的 OEM 正围绕这些技术栈扩大车型项目。Global
              Market Insights 将联网汽车、软件定义汽车、AI 和云计算列为核心驱动因素；6Wresearch
              则称，中国需求受到先进技术功能、联网/自动驾驶汽车及政府智慧交通支持推动。同一组资料也指出主要阻力：实施成本高、隐私与安全担忧、软件更新复杂、半导体约束，以及公开来源仍未披露 Yinwang
              的模块级定价或装配率经济性。因此投资结论很直接：市场背景庞大且仍在增长，但现有证据更能证明品类动能和伙伴采用，而非 Yinwang 的可服务份额或变现深度。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: OEM 预算负责人比消费者 TAM 口号更重要
            body: 这组证据反复将 Yinwang 定义为汽车系统供应商和开放平台。因此，车企项目胜利、股权绑定的 OEM 协同以及模块装配率，比任何单一醒目的 TAM 数字都更影响决策。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM012
          - type: callout
            title: 公开市场估算仍宽于 Yinwang 可变现范围
            body: 已发布的座舱市场报告支持增长方向，但没有拆出 Yinwang 精确产品组合对应的中国 SAM 或 SOM。因此，在取得管理层定价和销量披露前，估值应把这些公开数字仅作为外部边界参考。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局覆盖全栈、部件和自研路径
        blocks:
          - type: paragraph
            body: >-
              留存证据并未显示 Yinwang 面对一组清晰的同类竞争者。买方至少有三条路径可选：Yinwang 的打包技术栈、争取 L3 认证的其他全栈智能驾驶项目，或由座舱和芯片领先者拼装的模块化技术栈。iEVChina
              称，Yinwang 预计 2027 年实现有规模的 L3 部署、2028 年实现乘用车 L4 规模化，并将 Xiaomi HAD、XPeng XNGP 及采用 Nvidia Drive Thor
              的项目列为该时间表下的可比竞争对象。与此同时，相邻的座舱层仍高度开放：Global Market Insights 称，2025 年全球前五大座舱平台供应商合计份额仅 19%；中国 2026
              年第一季度座舱域控制器排名中，德赛仍领先于 Bosch 和华为。这说明 Yinwang 不只是销售“更聪明的 ADAS”，而是在争取 OEM 购买整合式整车技术栈，而不是分别混用座舱、算力和软件领域的领先者。
