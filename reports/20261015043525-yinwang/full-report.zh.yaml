chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位与平台范围
        blocks:
          - type: paragraph
            body: >-
              Yinwang 的定位已经明确：留存来源显示，公司于 2024 年 1 月 16
              日在深圳注册，是华为将智能汽车系统业务拆分为更适合投资平台的载体。公开产品范围并非单一模块，而是涵盖智能驾驶、智能座舱、整车控制、车云及相邻的 AI 和系统集成业务。因此，后续尽调应把 Yinwang
              看作华为汽车技术栈的运营载体，而非单一 ADAS 供应商。设立记录和长安合作备忘录所体现的模式，是向车企提供 B2B 供应和联合开发；华为在设立时向新公司转移技术与资源，同时保留控制权。
            claimRefs:
