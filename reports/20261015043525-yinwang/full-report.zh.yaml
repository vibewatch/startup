    summary: 公开材料最鲜明的对比在于：阴望拥有更宽的集成范围，合作伙伴股权渠道带来更强的分销杠杆；替代路径则更窄，或更难锁定客户。
    data:
      xAxis:
        label: 集成广度（序数 1-5）
        min: 1
        max: 5
        lowLabel: Narrow component scope
        highLabel: End-to-end vehicle stack
      yAxis:
        label: 分销杠杆 / 锁定程度（序数 1-5）
        min: 1
        max: 5
        lowLabel: Program-by-program competition
        highLabel: Equity-backed or deeply embedded channel
      points:
        - label: 阴望
          x: 5
          'y': 5
          detail: 全栈组合，加上华为关联 OEM 渠道入口
          claimRefs:
            - CP002
            - CP003
            - CP004
            - CP005
        - label: 全栈挑战者
          x: 4
          'y': 2
          detail: Xiaomi、XPeng、Nvidia 关联项目在路线图进度上展开竞争，但在这组来源中，股权支持的分销证据较少
          claimRefs:
            - CP001
            - CP012
        - label: 座舱既有厂商
          x: 3
          'y': 4
          detail: Desay、Bosch 及全球座舱供应商拥有规模和客户关系，但栈覆盖范围更窄
          claimRefs:
            - CP008
            - CP010
        - label: 芯片主导路径
          x: 2
          'y': 3
          detail: Qualcomm 主导的座舱芯片层支持按组件择优采购的替代路径
          claimRefs:
            - CP011
            - CP015
        - label: 合作伙伴专属构建
          x: 4
          'y': 5
          detail: 赛力斯、阿维塔、JAC 式的协同会提高切换成本，即使公开价格尚不清晰
          claimRefs:
            - CP004
            - CP005
            - CP006
            - CP014
        - label: 内部择优采购
          x: 2
          'y': 2
          detail: OEM 仍可跨组件自行组装技术栈，但集成负担更重
          claimRefs:
            - CP010
            - CP011
            - CP015
    approximationNotes: 坐标是根据留存证据对技术栈广度和渠道嵌入程度进行综合后得到的序数分数，不是标准化的市场份额或利润率数据。
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP010
      - CP011
      - CP012
      - CP015
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据显示，合作伙伴主导的桥梁将 OEM 项目和整车需求转化为阴望的打包计费，但独立毛利仍未公开。
    data:
      nodes:
        - id: oem-programs
          label: OEM 合作项目
        - id: yinwang-stack
          label: 阴望的驾驶、座舱与系统内容
        - id: vehicle-launches
          label: 车型上市与终端客户定价
        - id: hima-demand
          label: 订单与 HIMA 交付
        - id: software-ops
          label: 消费者软件运营服务
        - id: procurement
          label: 商品与服务打包采购
        - id: gross-profit
          label: 独立毛利未公开
      edges:
        - from: oem-programs
          to: yinwang-stack
          label: 嵌入供应商技术栈
        - from: yinwang-stack
          to: vehicle-launches
          label: 支撑车型功能
        - from: vehicle-launches
          to: hima-demand
          label: 转化为订单 / 交付
        - from: hima-demand
          to: procurement
          label: 带动零部件和服务需求
        - from: software-ops
          to: procurement
          label: 增加可变现服务
        - from: procurement
          to: gross-profit
          label: 构成公开计费代理指标
        - from: yinwang-stack
          to: gross-profit
          label: 组合决定利润率
    approximationNotes: 仅为定性桥接；公开来源显示了需求、采购和商业化信号，但没有披露阴望独立的收入结构或毛利率计算。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI010
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 阴望似乎处于一套多层供应商技术栈的核心，覆盖企业平台、车载软件、电子设备、云支持和 OEM 项目。
    data:
      layers:
        - label: 企业平台
          items:
            - 智能汽车事业部资产与研发团队
            - 智能汽车设备与 AI 软件业务范围
          outputs:
            - 独立实体，负责开发、生产、营销和服务智能汽车系统
        - label: 战略协同层
          items:
            - 华为控制权与战略车企股东
            - 供应商而非竞争对手的定位
          outputs:
            - 路线图激励绑定 OEM 采用，而不是直接参与整车竞争
        - label: 驾驶软件层
          items:
            - Qiankun 智能驾驶
            - L3 / L4 落地路径
          outputs:
            - 可复用于合作伙伴车型的高级驾驶技术栈
        - label: 座舱与控制层
          items:
            - HarmonyOS 座舱
            - 智能汽车控制
          outputs:
            - 共享的车内用户体验与车辆控制操作层
        - label: 扩展电子与云
          items:
            - 智能汽车光学
            - 智能汽车云服务
            - 消费者软件运营
          outputs:
            - 提高单车内容价值，并深入参与上市后的运营
        - label: OEM 部署层
          items:
            - Seres / AITO
            - VOYAH
          outputs:
            - 已点名的量产部署与联合运营流程
        - label: 规模与场景层
          items:
            - Chery / Luxeed / Jetour / FREELANDER
            - HIMA 五品牌联盟
          outputs:
            - 量产部署、测试里程积累和更广的场景覆盖
    approximationNotes: 这是一张根据公开报道绘制的定性分层图，而非供应商发布的系统图；具体模块边界、硬件 BOM 和数据流仍未公开。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 阴望似乎通过 OEM 战略协同切入，借助联合开发和软件运营扩大合作，再用下游车型上市和使用情况验证需求；监管是门槛，而不是增长证明。
    data:
      items:
        - label: 战略切入
          actor: OEM 高管买方
          channel: 股权投资或战略合作
          touchpoints:
            - 购买少数股权或协商投资
            - 获得智能驾驶和座舱平台能力
          tone: neutral
        - label: 平台集成
          actor: 车型项目与工程团队
          channel: 联合开发
          touchpoints:
            - 集成智能驾驶与座舱模块
            - 产品规划与合作伙伴路线图对齐
          tone: neutral
        - label: 用户运营扩张
          actor: OEM 软件与运营团队
          channel: 面向消费者的软件运营
          touchpoints:
            - 从产品规划延伸到用户运营
            - 市场营销、推广与品牌标准协作
          tone: positive
        - label: 上市与铺开
          actor: 汽车品牌与经销商
          channel: 车型上市节奏
          touchpoints:
            - 在 Voyah 实现全系车型部署
            - 阿维塔截至 2030 年的 17 款车型路线图
          tone: positive
        - label: 终端市场验证
          actor: 终端驾驶者与乘客
          channel: 订单、交付与功能使用
          touchpoints:
            - HIMA 交付与订单增速
            - Qiankun 安装量与 HarmonyOS 语音使用
          tone: positive
        - label: 扩张门槛
          actor: 监管机构与采购团队
          channel: 安全与合规审查
          touchpoints:
            - 接管检测与视线监测要求
            - 更长的客户验证与采购周期
          tone: risk
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU008
      - CU010
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，治理透明度不足、合作伙伴集中度高和路线图执行是最大的剩余风险敞口。
    data:
      columns:
        - label: 可能性
          note: 根据公开披露和里程碑时间判断的近期概率。
        - label: 影响
          note: 对商业化、融资灵活性或治理杠杆的影响。
        - label: 缓释成熟度
          note: 目前可见的公开缓释措施发展到什么程度。
        - label: 剩余敞口
          note: 扣除可见缓释措施和多元化信号后的净严重程度。
      rows:
        - label: 治理 / 控制权透明度不足
          note: 公开材料能看出股权结构，但看不出股东权利和保留事项。
          values:
            - label: 中
              note: 当前控制权清晰，但未来股权变动仍在进行。
            - label: 高
              note: 治理条款可能影响融资、合作伙伴激励和下行保护。
            - label: 低-中
              note: 可见的缓释措施主要是分阶段引入外部股东，而不是公开治理权利。
            - label: 高
        - label: 华为关联渠道内的合作伙伴集中度
          note: 当前采用证据有分量，但仍集中在 HIMA 和鸿蒙合作伙伴群体。
          values:
            - label: 中
            - label: 高
            - label: 中
              note: 多品牌覆盖有帮助，但仍属于生态内部多元化。
            - label: 高
        - label: 路线图与集成进度滞后
          note: 2026-2028 年自动驾驶里程碑需要工程和审批同步推进。
          values:
            - label: 高
            - label: 高
            - label: 中
              note: 联合团队和分阶段路线图有帮助，但公开里程碑证据仍有限。
            - label: 高
        - label: 估值与融资预期
          note: 公开否认 IPO 时间表，并未削弱市场关注的估值锚点。
          values:
            - label: 中
            - label: 中-高
            - label: 低-中
              note: 当前缓释措施主要是口径管理，而不是增加披露。
            - label: 中-高
        - label: 合作伙伴财务健康度
          note: 合作伙伴公开披露显示其有投入意愿，但资产负债表和销售达成情况并不都强。
          values:
            - label: 中
            - label: 高
            - label: 中
              note: 股权协同有帮助，但无法抹去合作伙伴的亏损或低于目标的销量。
            - label: 高
        - label: 安全与事故盲区
          note: 指定资料没有提供阴望已部署系统的直接召回、事故或认证证据。
          values:
            - label: 中
            - label: 中-高
            - label: 低
              note: 公开缓释措施较弱，因为资料中缺少核心安全和事故材料。
            - label: 中-高
    approximationNotes: 序数评级综合了指定公开证据；它们不是统计概率，若直接尽调获得合同、审批或事故数据，应及时更新。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 对阴望的判断取决于，战略证据能否落成可审计的经济数据和可投资的治理安排。
    data:
      nodes:
        - label: 战略估值锚点
          detail: AVATR 和赛力斯都承诺以 CNY 11.5 billion 认购 10% 股权，隐含估值约为 CNY 115 billion。
        - label: 商业化验证正在扩大
          detail: Chery、VOYAH 和 AVATR 的路线图显示，OEM 合作正扩展到驾驶、座舱和软件运营。
        - label: 市场地位有分量，但并非主导
          detail: 在 2026 年第一季度排名中，华为座舱控制器份额为 6.8%，AR-HUD 份额为 13.8%。
        - label: 监管与时间风险仍在
          detail: 中国正在收紧 ADAS 营销和安全规则，阴望称目前没有 IPO 时间表。
        - label: 经济数据与权利仍不透明
          detail: 公开证据仍缺少阴望独立利润率、现金流披露和少数股东权利条款。
        - label: 建议
          detail: 继续研究；在披露增加或价格改善前，保持进入纪律。
      edges:
        - from: Strategic valuation anchor
          to: Commercial proof is broadening
          label: 支持战略相关性
        - from: Commercial proof is broadening
          to: Market position is meaningful, not dominant
          label: 展示验证，而非必然成功
        - from: Market position is meaningful, not dominant
          to: Regulatory and timing risks remain
          label: 限制估值倍数扩张
        - from: Regulatory and timing risks remain
          to: Economics and rights are still opaque
          label: 提高尽调负担
        - from: Economics and rights are still opaque
          to: Recommendation
          label: 导向继续研究
    claimRefs:
      - CV003
      - CV005
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV015
