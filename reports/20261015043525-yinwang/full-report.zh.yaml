      - number: '1.3'
        title: 规模信号与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              公开规模证据更多体现生态覆盖，而非独立运营表现。到 2026 年，留存的伙伴侧报道显示，Yinwang 正与 Voyah、Chery 围绕智能驾驶、智能座舱、软件运营及 L3/L4
              部署深化战略项目，支持平台不再依赖单一锚定车企的判断。但公司概览证据对独立收入、客户数、审计财务数据和经核实员工数的披露仍很薄弱；这组资料中唯一明确的员工数来自
              Wikipedia，不应视为高置信度运营证明。整体来看，这是一个战略重要性明确、商业里程碑可见，但对投资判断最关键指标仍披露不完整的平台。
