      - number: '3.2'
        title: 伙伴入股带来分销，也集中需求
        blocks:
          - type: paragraph
            body: >-
              Yinwang 最强的分销优势不是公开价目表或广泛的经销商渠道，而是华为把平台嵌入车企关系的方式。Marqstats 称，Seres 贡献了 Yinwang 2025 年收入的 49.6%，同时持有 10%
              股权；Gasgoo 记录了 Avatr 以 RMB 11.5 billion（约 115 亿元人民币）收购另外 10% 股权。JAC 和 VOYAH 的证据进一步印证了这一模式：JAC 在延展 MAEXTRO
              产品线的同时评估投资，VOYAH 则把联合运营从智能驾驶和座舱模块深化到软件服务执行及光学子系统。这些关系提高了切换成本，也赋予 Yinwang
              独立软件供应商难以匹敌的项目准入，但也使当前规模更难被解读为公平交易下的份额获取。如果股权绑定的伙伴占据大部分新项目，现有厂商仍有机会争夺其余 OEM 市场。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
