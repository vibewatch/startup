      - ["Song Liuping", "Supervisor", "ITHome identifies Song as a Huawei executive serving as Yinwang supervisor", "Formal supervision and governance continuity from Huawei", "Low to medium - governance role is known, but scope of authority is not public"]
      - ["Xu Zhijun", "Huawei rotating chairman shaping investor-selection logic", "ITHome quotes Xu stating Yinwang wants strategic carmaker investors rather than financial investors", "Capital allocation, partner selection, and ecosystem positioning", "High - investor-admission criteria still appear to be set from Huawei's leadership layer"]
    notes: >-
      Public leadership disclosure is partial: the retained pool identifies a
      few Huawei-linked governance figures, not a complete operating-management
      or board roster.
    enumerationScope:
      coverage: partial
      basis: >-
