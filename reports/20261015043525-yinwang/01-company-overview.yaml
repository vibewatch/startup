company:
  name: Yinwang
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Yinwang is Huawei's automotive-technology spinout and still functions as a
    Huawei-controlled platform for intelligent driving, cockpit, vehicle-control,
    and cloud systems sold into Chinese OEM relationships. Public evidence is
    strongest on incorporation, share sales, and partnership milestones, but
    standalone operating metrics and full governance disclosure remain sparse.
sections:
  - id: identity-and-platform
    title: Identity and platform scope
    body: >-
      Yinwang's core identity is no longer ambiguous: retained sources show the
      company was incorporated in Shenzhen on January 16, 2024 as the vehicle
      through which Huawei would separate its intelligent automotive-systems
      activities into a more investable platform. The disclosed product scope is
      broad rather than single-module. Sources consistently describe intelligent
      driving, smart cockpit, vehicle control, vehicle cloud, and adjacent AI or
      system-integration work, which means later diligence should treat Yinwang
      as the operating wrapper around Huawei's automotive stack, not just a
      single ADAS supplier. The business model implied by the formation record
      and the Changan cooperation memo is business-to-business supply and
      co-development with automakers, with Huawei transferring technology and
      resources into the new company while retaining control at formation.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: control-capital-and-governance
    title: Control, capital, and governance
    body: >-
      The financing history shows that Yinwang has opened equity to strategic
      OEMs without becoming financially independent from Huawei. Avatr and
      Seres each agreed to buy 10% stakes for RMB 11.5 billion, implying a
      roughly RMB 115 billion mark around the 2024-2025 transactions, while
      Huawei remained the controlling shareholder. Governance disclosure is much
      thinner than ownership disclosure. Publicly retained sources identify
      Zheng Liying and Song Liuping in entity-governance roles and record Xu
      Zhijun's statement that Yinwang wants strategic carmaker investors rather
      than financial investors. That combination suggests decision-making still
      sits inside Huawei's ecosystem, creating key-person and partner-alignment
      risk until a fuller board slate, reserved-matters schedule, and
      shareholder-rights package are public.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO014, CO015]
    tableRefs: [TO002, TO003]
  - id: scale-signals-and-milestones
    title: Scale signals and milestone cadence
    body: >-
      Public scale evidence is stronger on ecosystem reach than on standalone
      operating performance. By 2026, retained partner-facing reporting shows
      Yinwang deepening strategic programs with Voyah and Chery around smart
      driving, smart cockpit, software operations, and L3/L4 deployment, which
      supports the thesis that the platform is broadening beyond a single anchor
      OEM. At the same time, the company-overview evidence remains thin on
      standalone revenue, customer count, audited financials, and a corroborated
      headcount; the only explicit headcount figure in this pool comes from
      Wikipedia and should not be treated as high-confidence operating proof.
      The resulting picture is a strategically important platform with visible
      commercial milestones but still-incomplete disclosure on the metrics that
      matter most for investment underwriting.
    claimRefs: [CO012, CO013, CO016]
    figureRefs: [FO001]
