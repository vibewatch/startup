        Yinwang governance figures or investor-selection sponsors; no complete
        board, executive committee, or shareholder-rights document is public in
        this pool.
    claimRefs: [CO005, CO010, CO011, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Huawei", "Controller, asset contributor, ecosystem sponsor", "Formed Yinwang, initially owned it outright, and still sets investor-selection logic", "Request transfer-pricing, IP-licensing, and reserved-matters terms between Huawei and Yinwang"]
      - ["Avatr", "Strategic investor and OEM partner", "Bought 10% for RMB 11.5 billion and is part of a long-term co-development roadmap", "Validate board rights, commercial exclusivity, and whether the 17-model roadmap is binding"]
      - ["Seres / AITO", "Strategic investor and anchor ecosystem partner", "Bought 10% for RMB 11.5 billion and remains tightly linked through the Huawei vehicle ecosystem", "Test customer-concentration risk, take rates, and whether AITO volumes drive Yinwang economics"]
      - ["Voyah", "Commercial technology partner", "Expanded into joint software operations plus smart-driving and cockpit collaboration in 2026", "Verify monetization model, rollout pace, and whether software-ops revenue accrues to Yinwang or the OEM"]
      - ["Chery", "Commercial technology partner", "Deepened cooperation on L3/L4 autonomous-driving development and mass-production deployment in 2026", "Check signed program economics, SOP timing, and whether deployments are pilot-scale or meaningful production"]
    notes: >-
      This is a strategic sample of disclosed stakeholders, not a complete
      customer or shareholder ledger; economic terms are largely undisclosed.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to retained public disclosures naming major investors or OEM
        cooperation counterparts; the pool does not contain an exhaustive
        shareholder register, full partner roster, or concentration schedule.
    claimRefs: [CO004, CO006, CO008, CO010, CO012, CO013, CO014]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show a fast sequence from Huawei spinout planning to
      OEM equity sales and broader 2026 partner expansion.
    data:
      items:
        - date: "2019-04"
          label: Huawei launches IAS unit
          detail: Huawei publicly launched its Intelligent Automotive Solution business at the Shanghai Auto Show.
          tone: neutral
          claimRefs: [CO003]
        - date: "2023-11-25"
          label: Changan-Huawei MoU
          detail: Changan and Huawei signed the cooperation memo for the planned open automotive-systems company.
          tone: neutral
          claimRefs: [CO004]
        - date: "2024-01-16"
          label: Yinwang incorporated
          detail: Shenzhen Yinwang Intelligent Technology Co., Ltd. was established in Shenzhen as Huawei's new auto-tech entity.
          tone: positive
          claimRefs: [CO001, CO005]
        - date: "2024-08-20"
          label: Avatr signs 10% deal
          detail: Avatr agreed to acquire 10% of Yinwang for RMB 11.5 billion.
          tone: positive
          claimRefs: [CO006, CO014]
        - date: "2024-08-25"
          label: Seres announces matching 10% purchase
          detail: Seres said its subsidiary would acquire 10% of Yinwang for RMB 11.5 billion.
          tone: positive
          claimRefs: [CO008, CO014]
        - date: "2025-02-28"
          label: Seres closing completed
          detail: Baidu Baike records the closing date for Seres' equity acquisition after the second payment.
          tone: positive
          claimRefs: [CO009]
        - date: "2025-10-09"
          label: Avatr final payment completed
          detail: Gasgoo reported Avatr's third and final payment, completing settlement of the 10% investment.
          tone: positive
          claimRefs: [CO007]
        - date: "2026-01-12"
          label: Voyah cooperation deepens
          detail: Voyah and Yinwang expanded cooperation to smart driving, smart cockpit, and consumer software operations.
          tone: positive
          claimRefs: [CO012]
        - date: "2026-06-11"
          label: Chery cooperation deepens
          detail: Chery and Yinwang moved to deeper L3/L4 autonomous-driving cooperation and mass-production deployment planning.
          tone: positive
          claimRefs: [CO013]
    approximationNotes: null
    claimRefs: [CO003, CO004, CO006, CO007, CO008, CO009, CO012, CO013, CO014]
