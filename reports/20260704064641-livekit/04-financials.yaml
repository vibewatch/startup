  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: ARR, revenue run-rate, bookings, paid customer count, customer concentration, and revenue by product
      meter.
    whyItMatters: The $1 billion valuation cannot be underwritten as a revenue multiple or growth multiple without actual
      revenue scale.
    diligencePath: Request monthly management accounts, ARR bridge, deferred revenue, invoices for top customers, and bookings-to-revenue
      reconciliation.
    relatedQuestionRefs:
    - QI004
    - QI011
    - QI018
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, runway months, debt, cloud commitments, and model-provider minimum commitments
      after the Series C.
    whyItMatters: Fresh funding does not reveal financing dependency or whether usage growth is cash-generative.
    diligencePath: Request latest balance sheet, 24-month cash forecast, vendor commitments, debt schedule, and board-approved
      hiring plan.
    relatedQuestionRefs:
    - QI005
    - QI012
    - QI023
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: customer-proof
    missingEvidence: Customer-by-customer revenue, active usage, renewal terms, and permissioned references for OpenAI, xAI,
      Salesforce, Tesla, Meta, Spotify, emergency services, and healthcare use cases.
    whyItMatters: Named logos are strong demand signals but do not show revenue concentration, churn risk, or gross margin
      by workload.
    diligencePath: Conduct reference calls, inspect contracts, and reconcile logo list to billings and current active usage.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI018
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: LiveKit-specific COGS by inference provider, SFU/TURN traffic, telephony carrier, region, support tier,
      and enterprise SLA.
    whyItMatters: Adjacent filings show bandwidth and infrastructure costs can be material, but LiveKit’s actual gross margin
      is undisclosed.
    diligencePath: Build a meter-level gross-margin waterfall using provider contracts, traffic logs, invoices, and customer
      price realization.
    relatedQuestionRefs:
    - QI006
    - QI009
    - QI013
    - QI015
    - QI024
    relatedTableRefs:
