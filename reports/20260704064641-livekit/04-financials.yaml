company:
  name: LiveKit
chapter:
  number: 4
  title: Financials
  summary: LiveKit discloses a credible monetization architecture—plans, agent-session minutes, inference credits, telephony,
    and enterprise commitments—but not the financial metrics needed for underwriting. The January 2026 Series C is well corroborated
    at $100 million and a $1 billion valuation, with one retained source reporting $183 million total raised. The financial
    verdict is constructive on demand signals and monetization pathways, but low-confidence on valuation until ARR, revenue
    mix, gross margin, burn, runway, customer concentration, and provider pass-through economics are disclosed.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model, Pricing, and Monetization Mechanics
  body: 'LiveKit’s public financial model is usage-sensitive infrastructure rather than a classic fixed-seat SaaS model. The
    official pricing page shows plan subscriptions from Build through Enterprise, but the economic engine is broader: agent-session
    minutes, inference/model usage, telephony, and higher enterprise limits all create consumption-based expansion paths.
    The pricing calculator is especially important because it displays minute-level agent economics and separate LLM, STT,
    TTS, telephony, and observability components, which means list revenue can scale with conversation volume and model intensity.
    Quotas and limits reinforce that upsell path: Build customers face concurrency and rate ceilings, while Enterprise customers
    can negotiate higher limits through annual commitments. The caveat is that list pricing is not realized revenue. Included
    credits, discounts, model pass-through, telephony costs, and egress can materially change gross margin, so the public
    pages prove monetization mechanics but not profitability.'
  claimRefs:
