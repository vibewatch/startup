- id: gtm-traction-and-private-metric-gaps
  title: GTM Signals, Public Traction, and Private-Metric Gaps
  body: The strongest public traction evidence is qualitative rather than financial. TechCrunch reported that LiveKit powers
    OpenAI’s ChatGPT voice mode and named xAI, Salesforce, Tesla, emergency service operators, and mental-health providers
    as customers; Salesforce Ventures separately cited xAI, Meta, and Spotify as demanding realtime AI workloads. Index’s
    investor essay describes bottom-up developer growth, and GitHub provides visible open-source developer signal. Those signals
    are commercially meaningful because infrastructure companies often convert developer adoption into cloud usage, enterprise
    controls, and support contracts. They are not, however, substitutes for revenue metrics. No retained source discloses
    ARR, revenue run-rate, net revenue retention, gross margin, active paid accounts, customer concentration, CAC, payback,
    or cohort expansion. The resulting GTM view is promising but not underwritable without management-provided invoices, retention
    cohorts, and customer-level gross margin.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI033
  - CI034
  - CI040
  tableRefs:
  - TI005
  figureRefs: []
- id: unit-economics-and-cost-drivers
  title: Unit Economics and Cost Drivers
  body: 'The public cost-driver evidence points to a stacked COGS model. LiveKit incurs or passes through realtime media infrastructure,
    cloud compute, model inference, telephony/SIP, observability, and support. LiveKit’s own docs show inference credits and
    multiple model providers; Deepgram, Cartesia, ElevenLabs, and OpenAI pages illustrate that speech and voice models have
    their own usage pricing; and Cloudflare’s Realtime pricing gives a transparent transport-cost reference for SFU/TURN egress.
    Public-company filings sharpen the risk: Agora says cost of revenue includes bandwidth from network operators and cloud
    providers, colocation, server depreciation, taxes, and support personnel, while Cloudflare reports colocation, network
    and bandwidth costs and equipment depreciation. Those are not LiveKit’s financial statements, but they identify the economic
    sensitivities a LiveKit underwriter must test: utilization, egress, inference mix, telephony minutes, enterprise support,
    and volume discounts. The most important diligence output is therefore a minute-level margin bridge that starts with the
    customer-facing meter and subtracts model, carrier, network, cloud, and support costs in the same period. Without that
    bridge, rapid usage growth could represent either attractive infrastructure leverage or expensive pass-through volume.'
  claimRefs:
