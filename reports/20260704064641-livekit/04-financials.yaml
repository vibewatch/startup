- id: TI005
  title: Public financial gaps table
  notes: This table separates public traction evidence from the private evidence needed to underwrite revenue quality.
  columns:
  - Missing private metric
  - Public proxy available
  - Impact
  - Exact diligence path
  rows:
  - - ARR / revenue run-rate
    - Pricing tiers and customer mentions
    - Cannot compute revenue multiple or scale
    - Management ARR bridge by month, product meter, and customer segment
  - - Gross margin by product
    - Adjacent filings identify network/model cost categories
    - Cannot judge quality of usage revenue
    - COGS waterfall by agent session, inference, telephony, egress, support
  - - Customer count / concentration
    - Named customers reported by TechCrunch and Salesforce Ventures
    - Logo proof may hide concentration risk
    - Top-20 customer revenue, usage minutes, churn, and contract terms
  - - NRR / cohort expansion
    - Usage-sensitive pricing suggests expansion potential
    - Cannot verify land-and-expand economics
    - Cohort NRR/GRR and expansion by product meter
  - - CAC / sales efficiency
    - Open-source and investor commentary support PLG signal
    - Cannot size enterprise sales cost
    - Pipeline source, sales headcount, payback by channel, and OSS-to-paid conversion
  - - Cash balance / burn / runway
    - Series C amount and total raised
    - Cannot assess next-round dependency
    - Monthly cash-flow statement, committed spend, runway plan, hiring plan
  - - Realized inference margin
    - Provider pricing pages and LiveKit credits
    - Could be pass-through rather than high-margin revenue
    - Provider rate cards, markup, credit utilization, model mix
  - - Enterprise contract quality
    - Enterprise custom and annual commitment language
    - Cannot assess durability or support burden
    - Review MSAs for term, SLA, overage, security, support, and termination rights
