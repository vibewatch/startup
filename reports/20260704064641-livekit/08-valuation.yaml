- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR near premium-implied $67M-$100M range, rapid growth, high gross margin, low concentration
    - At $1B, price can be fair-to-attractive if growth and retention support a premium multiple
    - Model costs and uptime must remain controlled
    - Private KPI package confirms growth and quality
  - - Base
    - Strategic proof strong but ARR/margin/concentration private
    - Track until denominator is known; negotiate price protection or milestone close
    - Denominator opacity and comp multiple volatility
    - Management provides partial but not complete KPIs
  - - Bear
    - ARR far below implied range or gross margin compressed by model/cloud costs
    - Valuation is expensive; avoid or reset price
    - Open-source substitution, competitor bundles, concentration
    - Private data misses implied revenue range
  - - Strategic exit upside
    - AI platform, cloud, or communications acquirer values LiveKit infrastructure
    - Could support premium if strategic scarcity is proven
    - No disclosed buyer process or audit readiness
    - Strategic partnership expansion and buyer references
  notes: Scenario revenue ranges are estimated denominators implied by public comp multiples, not reported LiveKit revenue.
