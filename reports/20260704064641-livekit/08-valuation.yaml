- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'Exit readiness is not evidenced in public sources. LiveKit has strategic relevance to communications, cloud, and
    AI-platform buyers, but no retained source discloses audited financials, IPO preparation, secondary liquidity, preference
    terms, or a buyer process. That makes the final diligence agenda decisive. The investment committee should ask for ARR
    bridge, cohort retention, gross margin after model and infrastructure costs, customer concentration, cloud versus self-host
    conversion, incident history, vulnerability-management SLA, and regulated-sector contract artifacts. The thesis-break
    triggers are equally concrete: weak ARR relative to the implied denominator, high flagship-customer exposure, repeated
    production incidents, unpatched security issues, inability to support HIPAA/CCPA/recording controls for target verticals,
    or evidence that competitor bundles force sustained discounting. Until those are cleared, public evidence supports tracking
    LiveKit closely rather than underwriting a broad price-insensitive buy.'
