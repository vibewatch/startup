- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR denominator miss
    - Revenue materially below $67M-$100M premium-implied range without extreme growth
    - $1B price becomes hard to support
    - Avoid or require lower price / milestone structure
  - - Gross margin compression
    - Model or cloud costs prevent software-like margin path
    - Premium AI-infra multiple fails
    - Require cost pass-through proof and margin bridge
  - - Customer concentration
    - Top customers dominate ARR or strategic logos are not paid production
    - Churn or renegotiation risk rises
    - Require customer calls and risk-adjust price
  - - Repeated incidents
    - Material production outages or weak incident postmortems
    - Mission-critical voice use cases lose trust
    - Make SLA and reliability evidence closing condition
  - - Security remediation weakness
    - CVE-class issues persist without rapid patching
    - Enterprise trust and regulated verticals weaken
    - Require vulnerability-management SLA
  - - Competitive discounting
    - TRTC/Twilio/Agora/Daily bundles force sustained price concessions
    - Open-source and API substitution compresses revenue quality
    - Lower valuation multiple or pass
  notes: Triggers are diligence thresholds and do not assert that the adverse condition already exists.
  claimRefs:
