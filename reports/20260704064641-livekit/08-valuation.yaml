  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR denominator
    missingEvidence: Current ARR, revenue growth, NRR, gross margin, burn, and cohort expansion data.
    whyItMatters: The $1B valuation cannot be verified against revenue multiples without a denominator.
    diligencePath: Request board KPI package, management model, and revenue cohort export.
    relatedQuestionRefs:
    - QV004
    - QV022
    - QV023
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap table and preferences
    missingEvidence: Full financing docs, preference stack, option pool, debt, secondary sales, and pro forma ownership.
    whyItMatters: Entry economics and downside protection depend on security terms, not only headline valuation.
    diligencePath: Review Series C financing documents and pro forma cap table.
    relatedQuestionRefs:
    - QV024
  - type: missing-source
    severity: material
    topic: customer concentration and retention
    missingEvidence: Top-customer share, paid-production status, contract length, renewal cohorts, and expansion metrics.
    whyItMatters: Named logos support strategic relevance but cannot establish revenue quality or downside risk.
    diligencePath: Obtain customer concentration schedule and conduct reference calls.
    relatedQuestionRefs:
    - QV021
    - QV030
  - type: private-evidence-only
    severity: material
    topic: security reliability regulated readiness
    missingEvidence: Incident postmortems, SLA credits, vulnerability-management SLA, SOC 2, BAA/DPA, and consent/retention
      workflows.
    whyItMatters: Operational and regulated-use risks can impair enterprise adoption and valuation multiple.
    diligencePath: Run security/legal diligence with SRE, compliance, and customer-success owners.
    relatedQuestionRefs:
    - QV016
    - QV030
