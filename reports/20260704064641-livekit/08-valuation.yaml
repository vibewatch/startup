company:
  name: LiveKit
chapter:
  number: 8
  title: Valuation
  summary: 'LiveKit’s January 2026 $1 billion valuation is strategically credible but not publicly underwritten: corroborated
    funding and OpenAI relevance support a premium lens, while absent ARR, margin, concentration, and security/reliability
    diligence keep the stance at stretched-to-fair and the recommendation at track / research-more.'
sections:
- id: recommendation-and-price-context
  title: Recommendation, confidence, and current price context
  body: The public evidence supports a strong strategic company but not a fully underwritten buy at any price. TechCrunch
    and SiliconANGLE both reported a January 2026 $100 million raise at a $1 billion valuation, with Index and Salesforce
    Ventures as notable backers and OpenAI voice-mode relevance as the marquee proof point. That is enough to justify continued
    diligence and a track recommendation, not enough to declare the entry attractive. The public record does not disclose
    ARR, revenue growth, gross margin, net retention, burn, dilution, liquidation preferences, or customer concentration.
    Therefore the valuation stance is stretched-to-fair pending private data. A buy recommendation would require evidence
    that LiveKit is already at, or quickly compounding toward, the revenue denominator implied by a $1 billion mark while
    maintaining strong uptime and defensible margins after model and cloud costs. The practical implication is that the headline
    round should be treated as a negotiation anchor, not a valuation conclusion. Public reports corroborate the amount and
    investor quality, but only company-provided schedules can show whether the post-money price maps to durable software revenue,
    usage growth, and renewal quality. Until that package is reviewed, a committee should protect downside through milestones,
    information rights, and explicit price sensitivity. This framing preserves upside while preventing a narrative premium
    from replacing verifiable underwriting evidence.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV021
  - CV022
  - CV027
