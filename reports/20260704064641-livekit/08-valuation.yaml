- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - ARR and revenue growth
    - Current ARR, revenue bridge, growth cohorts
    - Validates or rejects implied denominator
    - Request board KPI package and monthly ARR history
  - - Gross margin and model costs
    - Cloud, bandwidth, inference, support, and overage cost bridge
    - Determines whether AI infra deserves premium multiple
    - Review COGS by product and model-provider pass-through
  - - Retention and concentration
    - NRR/GRR, churn, top-ten customer share, contract terms
    - Tests logo quality and downside risk
    - Customer calls plus cohort schedules
  - - Cap table and preferences
    - Post-money ownership, preference stack, option pool, debt
    - Controls true entry economics and downside
    - Review financing docs and pro forma cap table
  - - Reliability and security
    - Incident history, SLA credits, CVE patch process, SOC 2
    - Protects mission-critical deployments
    - Trust center NDA review and SRE/security interviews
  - - Regulated vertical readiness
    - BAA/DPA, recording consent, data retention, subprocessor controls
    - Affects healthcare, emergency, and recorded-call use cases
    - Legal/security review against target customer workflows
  notes: Final asks are designed to convert public strategic proof into price-supporting underwriting evidence.
