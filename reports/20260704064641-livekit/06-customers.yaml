    {
      "id": "retention-concentration-and-adverse-evidence",
      "title": "Retention, concentration, and adverse evidence",
      "body": "The weakest customer dimension is durability. Public sources do not disclose NRR, GRR, churn, renewal cohorts, contract length, customer-count reconciliation, or top-customer concentration, and the highest-profile names may represent very large usage if true. That is a classic infrastructure diligence gap: a few marquee AI labs or enterprise platforms can validate technology while also creating concentration risk. Adverse evidence is not customer churn, but it matters for durability because realtime voice and media products expose outages immediately to end users. StatusGator and IsDown record 2026 incidents, including US East participant latency/errors and Cloud Agents deployment failures lasting several hours. Those incidents do not prove systemic weakness, yet they set the agenda for reference calls: ask whether customers experienced SLA credits, failed calls, fallback routing, delayed deployments, or manual workarounds. Until management supplies cohort and concentration data, the customer chapter should credit strong proof breadth but carry a material verification gap. The next diligence cycle should reconcile each public proof point to a named account owner, product surface, monthly usage trend, and renewal event so that anecdotal validation converts into underwriting evidence.",
      "claimRefs": [
