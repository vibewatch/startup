    {
      "id": "deployment-patterns-and-ecosystem",
      "title": "Deployment patterns and partner ecosystem",
      "body": "The public deployment pattern is consistent: teams use LiveKit to avoid rebuilding realtime media, then attach telephony, AI models, and business logic around the room. WebRTC.ventures’ IVR implementation uses LiveKit Voice AI with Deepgram, OpenAI, and Cartesia; the open GitHub voice-receptionist case study uses LiveKit Agents, Twilio SIP, Deepgram, and ElevenLabs and documents one room per call through LiveKit Cloud SIP ingress. These examples are not necessarily LiveKit revenue proof, but they are useful practitioner evidence that the platform can be embedded into customer-service and receptionist workflows. Telephony broadens the addressable customer set beyond app developers into phone-first operations, support, healthcare scheduling, insurance, roadside assistance, and other voice workflows. The partner ecosystem matters because LiveKit’s value increases when model vendors, SIP carriers, implementation shops, and customer backends can be composed without replacing the realtime layer.",
      "claimRefs": [
        "CU019",
        "CU020",
        "CU021",
        "CU022",
        "CU023",
