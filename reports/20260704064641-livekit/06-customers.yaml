    "number": 6,
    "title": "Customers",
    "summary": "LiveKit has credible public proof across AI voice, sports media, robotics, healthcare, IVR, and enterprise AI naming. The customer thesis is promising but not underwriteable without private retention, paid conversion, production-vs-pilot, and concentration data."
  },
  "sections": [
    {
      "id": "segments-and-demand",
      "title": "Customer segments and demand surfaces",
      "body": "LiveKit’s public customer evidence points to a horizontal infrastructure company with several vertical demand surfaces rather than a single buyer segment. The strongest segments are AI voice agents, realtime sports and media, robotics teleoperation, healthcare patient access, and developer-led communications applications. The buyer or champion is usually a technical team—AI engineers, infrastructure engineers, CTOs, robotics engineers, or contact-center builders—while the economic buyer may be an enterprise product, support, healthcare operations, or platform leader. Developer adoption is supported by third-party reporting of over 200,000 developers and LiveKit’s own claim of 300,000+ developers, billions of annual calls, and 300+ model integrations, but those metrics are not equivalent to paying customers. The main diligence framing is therefore funnel conversion: open-source usage and proofs of concept must be tied to LiveKit Cloud accounts, production minutes, renewal rates, and expansion. This is the central customer diligence bridge. Verified.",
      "claimRefs": [
        "CU015",
        "CU016",
