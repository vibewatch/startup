    },
    {
      "id": "named-customer-proof",
      "title": "Named customer proof and reference quality",
      "body": "The reference set has a clear quality hierarchy. Direct case-study proof exists for Playback, Polymath Robotics, Assort Health, and Cartesia-related LiveKit agent deployments, with customer or partner pages describing concrete workflows. Playback is sports-media proof with synchronized WebRTC viewing, staged migration, multistreaming, and recording. Polymath is robotics proof with live camera feeds, fleet monitoring, redirects, and emergency-stop workflows. Assort is healthcare proof through a 2026 HLTH session and the company’s own patient-interaction claims. Cartesia is best treated as partner ecosystem proof: its page describes Sonic as an integration for LiveKit Agents and explains how developers combine model, agent, and network layers. Enterprise names such as OpenAI, xAI, Meta, Spotify, Salesforce, Tesla, 911 operators, and mental health providers are important but should not be overstated without contracts, usage volumes, or reference calls because much of that evidence is investor or news naming.",
