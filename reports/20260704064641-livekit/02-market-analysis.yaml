chapter:
  number: 2
  title: Market Analysis
  summary: >-
    LiveKit sits at the intersection of WebRTC/realtime media infrastructure, voice-agent infrastructure, CPaaS
    telephony, and conversational AI. Market demand is supported by large WebRTC and conversational-AI estimates plus
    2026 agentic-AI adoption forecasts, but direct capturability is constrained by broad analyst definitions, open
    standards, incumbent CPaaS/cloud substitutes, and the need for LiveKit-specific pipeline and usage data.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary and substitutes
    body: >-
      The right market boundary for LiveKit is narrower than “AI” and broader than legacy video conferencing. It is
      realtime voice, video, and data infrastructure for AI agents and communication applications, with WebRTC as the
      transport substrate and live audio as the highest-urgency use case. W3C and MDN support the technical boundary by
      defining WebRTC as browser and application APIs for real-time media and data. OpenAI’s Realtime API validates the
      demand-side boundary: live audio sessions are distinct from request-based audio because they require low latency.
      The substitute set is layered. Daily, Agora, 100ms, and Cloudflare can replace media infrastructure; Twilio and
      Vonage can own phone-call workflows; Google and AWS contact-center suites can absorb buyers that prefer an
      integrated suite over developer primitives; internal self-hosting remains an option where teams have WebRTC
      expertise.
    claimRefs:
      - CM001
      - CM002
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM028
      - CM031
    tableRefs:
      - TM001
    figureRefs:
      - FM004
  - id: sizing-lenses
    title: Sizing lenses and estimate discipline
    body: >-
      The market is clearly large, but the evidence must be layered rather than averaged. The Business Research Company
      estimates WebRTC at $25.8 billion in 2026 and $116.42 billion in 2030, while Fortune Business Insights estimates
      $13.07 billion in 2026 and $122.08 billion by 2034. Grand View Research estimates conversational AI at $17.7
      billion in 2026 and $78.9 billion in 2033. Those numbers are useful as outer bounds and demand pools, not as
      LiveKit revenue forecasts. WebRTC estimates include conferencing, messaging, file sharing, and vertical
      communications well beyond voice agents; conversational AI includes chatbots, virtual assistants, services, and
      deployment models that may not use realtime media infrastructure. A more defensible stack treats broad WebRTC as
      TAM, conversational AI as an adjacent demand pool, realtime voice-agent infrastructure as SAM, and LiveKit’s won
      usage as SOM. This preserves comparability.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM016
      - CM017
      - CM018
      - CM023
      - CM030
      - CM035
      - CM036
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers-budgets-and-adoption
    title: Buyers, budgets, and adoption path
    body: >-
      Buyer segmentation matters because the same technology can be bought by different budget owners. AI-native
      application teams buy latency and developer control; enterprise product teams buy embedded agents for their own
      users; contact-center operations teams buy automation and call containment; healthcare or emergency-service
      workflows buy reliability and compliance; robotics teams buy low-latency media; platform teams buy global
      infrastructure and operational leverage. The adoption trigger is usually a workflow that breaks if turn-taking,
      interruption handling, live-call audio, or video context is poor. Gartner’s 2026 agentic-app forecast and OpenAI’s
      realtime product surface support timing, while Daily and Agora show that vendors are actively productizing the
      same need. Budget friction remains real because pricing units differ across the stack: minutes, sessions,
      AI-engine usage, model tokens, beta/free plans, and enterprise contracts do not map cleanly.
    claimRefs:
      - CM006
      - CM008
      - CM019
      - CM020
      - CM021
      - CM025
      - CM026
      - CM027
    tableRefs:
      - TM003
    figureRefs:
      - FM003
  - id: drivers-constraints-and-gaps
    title: Drivers, constraints, and diligence gaps
    body: >-
      The strongest growth drivers are agentic-AI adoption, AI infrastructure spending, demand for natural voice
      interfaces, and the need to avoid bespoke realtime-media operations. Gartner forecasts 40% of enterprise
      applications will include task-specific AI agents by the end of 2026, and separately forecasts $2.59 trillion of
      worldwide AI spending in 2026. Those are favorable timing signals for LiveKit, but constraints are equally
      material. WebRTC is open, so protocol access is not a moat by itself; managed differentiation must come from
      reliability, scale, developer experience, compliance, observability, and integrations. Incumbent CPaaS and cloud
      contact-center suites already own budgets and workflows. Trust-sensitive sectors add compliance, recording,
      privacy, and incident-response requirements. The McKinsey trust source was access-blocked during review, so trust
      claims here rely on substitute evidence and should be refreshed with accessible sources. The most important
      diligence implication is that category growth does not automatically translate into uniform willingness to pay. A
      developer building an AI-native application may value composability and speed; a contact-center buyer may value
      routing, reporting, and vendor consolidation; a platform team may compare LiveKit against self-hosting or
      Cloudflare-like infrastructure. The market model therefore needs separate conversion assumptions by buyer, not one
      blended penetration rate applied to broad WebRTC or conversational-AI spend.
    claimRefs:
      - CM007
      - CM022
      - CM024
      - CM029
      - CM032
      - CM033
      - CM034
      - CM036
    tableRefs:
      - TM004
