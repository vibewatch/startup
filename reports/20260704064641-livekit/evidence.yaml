evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-gaps
    missingEvidence: ARR, gross margin, NRR, burn, runway, customer count, and headcount from company data-room exports.
    whyItMatters: >-
      These metrics determine whether the reported valuation is supportable by operating quality rather than category
      momentum.
    diligencePath: >-
      Request board deck, audited or reviewed financials, CRM cohort exports, billing data, payroll roster, and
      management KPI definitions.
    relatedQuestionRefs:
      - QO009
      - QO028
  - type: private-evidence-only
    severity: material
    topic: governance-gaps
    missingEvidence: Board composition, investor rights, option pool, secondary sales, debt, and liquidation preferences.
    whyItMatters: Governance and preference stack affect control, downside protection, and effective entry valuation.
    diligencePath: Review charter, investor rights agreement, cap table, financing documents, debt agreements, and board minutes.
    relatedQuestionRefs:
      - QO010
      - QO013
  - type: missing-source
    severity: minor
    topic: milestone table completeness
    missingEvidence: Private chronology of enterprise contract wins, outages, leadership changes, and product launches.
    whyItMatters: The public chronology may miss material adverse or positive events that affect execution risk.
    diligencePath: >-
      Ask management for a dated milestone log and reconcile it against customer contracts, incident reviews, and
      release notes.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: sizing-limitation
    missingEvidence: >-
      A LiveKit-specific SAM/SOM model using pipeline, usage minutes, ACV, win rate, and vertical conversion rather than
      broad WebRTC and conversational-AI categories.
    whyItMatters: Broad analyst estimates are directionally useful but can materially overstate the portion LiveKit can capture.
    diligencePath: >-
      Request management pipeline by segment, usage cohorts, pricing exports, customer concentration, win/loss data, and
      vertical segmentation.
    relatedQuestionRefs:
      - QM014
      - QM015
      - QM020
      - QM029
      - QM030
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: trust
    missingEvidence: Accessible independent evidence on 2026 AI trust and regulated-workflow adoption barriers.
    whyItMatters: >-
      Trust constraints may slow adoption in healthcare, emergency services, finance, and recorded contact-center
      workflows.
    diligencePath: >-
      Replace the blocked McKinsey source with accessible survey data or customer procurement requirements during
      refresh.
    relatedQuestionRefs:
      - QM028
  - type: private-evidence-only
    severity: material
