  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: ARR by customer, top-ten customer share, renewal cohorts, and customer-contract duration.
    whyItMatters: Named logos do not quantify churn or concentration risk at a $1 billion valuation.
    diligencePath: Request ARR waterfall, top-customer schedule, renewal history, and three customer calls.
    relatedQuestionRefs:
    - QR014
    - QR020
  - type: private-evidence-only
    severity: material
    topic: compliance controls
    missingEvidence: SOC 2 report, HIPAA BAA terms, DPA, subprocessors, data-retention controls, and incident-response policy.
    whyItMatters: Healthcare, emergency, and recorded voice use cases require contractual and control evidence beyond public
      documentation.
    diligencePath: Obtain Trust Center access under NDA and review regulated-customer deployments.
    relatedQuestionRefs:
    - QR016
    - QR026
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: financial model risk
    missingEvidence: ARR, revenue growth, gross margin, model-cost pass-through, burn, and cloud conversion rate.
    whyItMatters: Open-source monetization and pricing pressure cannot be quantified without private KPIs.
    diligencePath: Request board deck, cohort revenue, gross margin bridge, and cloud/self-host conversion data.
    relatedQuestionRefs:
    - QR005
    - QR014
    - QR020
  - type: access-blocked
    severity: minor
    topic: community compliance discussions
    missingEvidence: Readable proprietary-data and HIPAA community-thread contents behind the Vercel checkpoint.
    whyItMatters: Community questions may reveal buyer objections or implementation misunderstandings.
    diligencePath: Ask company for support-ticket themes and access to community discussions or equivalent summaries.
    relatedQuestionRefs:
    - QR016
    - QR026
