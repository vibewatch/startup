chapter:
  number: 7
  title: Risks
  summary: 'LiveKit’s risk profile is medium-high: public evidence supports strong developer and enterprise momentum, but
    open-source monetization, model-provider dependency, realtime reliability, regulated-workload compliance, and missing
    customer/financial concentration data require private diligence.'
sections:
- id: ranked-risk-register
  title: Evidenced risk ranking and thesis-break posture
  body: 'The risk stack is medium-high, not because any single public source proves a fatal defect, but because several evidenced
    exposures compound around a young infrastructure company whose latest financing increased expectations. The highest-evidence
    risks are monetization pressure from open-source substitutes and competing API bundles, production reliability for realtime
    voice/video workloads, and regulated-workload compliance for healthcare, emergency, and recorded conversations. The unresolved
    gaps are equally important: public sources name prominent customers but do not disclose revenue concentration, ARR, gross
    margin, or contract terms. The chapter therefore separates evidenced risks from diligence gaps. Evidence supports monitoring
    LiveKit Status, StatusGator, model-provider status pages, NVD/Snyk, and legal/compliance artifacts; it does not support
    asserting an existing breach, enforcement action, or customer-concentration problem. The investment implication is to
    keep LiveKit investable only if private diligence confirms enterprise conversion, compliance readiness, and incident-response
    discipline. Two boundaries guide the ranking: evidenced items receive monitoring triggers, while unavailable private metrics
    become diligence asks rather than implied negatives. That distinction matters for LiveKit because public sources are unusually
    strong on product and ecosystem visibility but weak on financial, contractual, and concentration disclosure. The immediate
    IC action is therefore to translate every severe risk into a requested document, owner interview, or operating metric
    before assigning final valuation haircuts. This creates a measurable risk ledger that can be refreshed after management
    diligence, not a static list of hypothetical concerns.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR015
  - CR016
  - CR024
  - CR026
  - CR037
