- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Operational reliability
    - LiveKit Status and StatusGator incidents
    - Repeated material incidents or unresolved production-impacting outage
    - Pause investment or require SLA/credit protections
  - - Upstream model dependency
    - OpenAI / Anthropic incident and pricing changes
    - Production degradation without fallback or material model-cost spike
    - Require model diversification and margin sensitivity
  - - Security
    - NVD/Snyk/OpenCVE LiveKit vulnerabilities
    - High-severity unpatched production-path issue or slow remediation
    - Make patch SLA and SBOM a closing condition
  - - Regulated workloads
    - DPA, BAA, SOC 2, consent, and retention evidence
    - Failure to provide contracts/control reports for target verticals
    - Do not underwrite healthcare/emergency use cases
  - - Monetization
    - Cloud conversion, discounting, gross margin, self-hosting substitution
    - Evidence that paid cloud conversion or margins lag valuation assumptions
    - Lower entry price or move to track
  - - Customer concentration
    - ARR concentration and renewal data
    - Top-customer exposure materially above fund tolerance
    - Require customer calls or risk-adjust valuation
  notes: Kill criteria are diligence triggers, not claims that the adverse events have already occurred.
