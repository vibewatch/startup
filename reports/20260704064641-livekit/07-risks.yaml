- id: platform-and-operational-dependencies
  title: Platform, model-provider, cloud, and reliability dependencies
  body: LiveKit sells infrastructure for low-latency media and AI agents, so dependency risk transmits quickly from upstream
    model providers and network platforms into customer experience. OpenAI Realtime API availability can expand demand, but
    OpenAI and Anthropic pricing and status pages also become underwriting inputs because applications may rely on their APIs
    for speech, reasoning, or multimodal interactions. LiveKit official status pages and third-party StatusGator data show
    that operations are monitorable, including a reported June 22, 2026 outage, but they do not prove long-run SLA durability
    or incident root causes. Self-hosting can reduce cloud-vendor dependence for sophisticated customers, yet LiveKit documentation
    itself warns that WebRTC deployment is tricky. The residual exposure is therefore not binary platform lock-in; it is execution
    quality across LiveKit Cloud, customer self-hosted operations, model vendors, and internet infrastructure during live
    conversations.
  claimRefs:
  - CR004
  - CR005
  - CR015
