  topStrengths:
    - Open-source distribution and developer ecosystem are unusually visible, with large core and Agents repo communities plus broad SDK/package support.
    - Product scope spans WebRTC transport, agent orchestration, telephony, inference routing, and cloud observability, making LiveKit more than a commodity video API.
    - Marquee workload references around OpenAI voice mode and named enterprise logos show strong category relevance for realtime AI.
  topRisks:
    - ARR, gross margin, retention, customer concentration, and dilution terms remain undisclosed, limiting valuation underwriting.
    - Reliability, security, privacy, and compliance diligence is still incomplete for regulated or large-enterprise deployment.
    - Model-provider, cloud, and competitor-bundling dependencies can compress margins and weaken differentiation over time.
  unresolvedGaps:
    - Verified ARR or revenue bridge, gross margin, NRR, and top-customer concentration remain the primary blockers to underwriting the $1B mark.
    - Exact total funding, cap-table terms, liquidation preferences, and detailed headquarters or governance records remain unresolved in public evidence.
    - Incident-history depth, security-report scope, HIPAA or DPA artifacts, and failover architecture for enterprise workloads still require primary diligence.
