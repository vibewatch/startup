- id: TP004
  title: Moat durability / competitive risk register
  notes: Severity is an underwriting view as of 2026-07-04, not a prediction of contract loss or product failure.
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Open-source developer adoption creates default status
    - Open source also lets sophisticated teams inspect architecture and self-host or rebuild pieces
    - Medium
    - Measure conversion from OSS users to paid cloud accounts and expansion by cohort
  - - Agent platform breadth is hard to replicate
    - OpenAI, Twilio, Agora, Daily, and model vendors can bundle adjacent layers
    - High
    - Ask for win/loss data by competitor and attach rate of deployment/observability/telephony
  - - Realtime transport is differentiated
    - Cloudflare and WebRTC specialists can price transport as commodity egress or participant minutes
    - High
    - Benchmark unit costs for SFU, TURN, egress, and regional reliability at scale
  - - Model-provider relationships create pull
    - No retained source proves exclusive model-provider access or permanent OpenAI dependency
    - High
    - Review partner contracts and concentration in model-provider-originated workloads
  - - Enterprise compliance supports expansion
    - Twilio and Vonage have deeper incumbent enterprise communications distribution
    - Medium
    - Validate regulated-industry pipeline and procurement blockers against CPaaS incumbents
  - - Voice AI growth will expand the category
    - Growth attracts entrants and lets buyers multi-home model, transport, and telephony layers
    - High
    - Track product-led retention, gross margin after inference pass-through, and replacement cases
  - - Internal build is too hard for most teams
    - Large AI labs or communications platforms can internalize realtime media infrastructure
    - Medium
    - Segment customers by engineering sophistication and mission-critical latency requirements
