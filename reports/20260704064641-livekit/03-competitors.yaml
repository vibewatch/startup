- id: profiles-capabilities-and-pricing
  title: Profiles, Capabilities, and Pricing Transparency
  body: The profile and feature evidence separates LiveKit’s agent-centric stack from rivals that win on scale, channel breadth,
    or narrow unit economics. Agora discloses a very large self-reported RTE footprint, while Twilio brings enterprise communications
    distribution and a broad pricing catalog that starts with usage-based voice rates. Daily and 100ms look closer to developer-first
    WebRTC peers, but their public positioning is more video-SDK and Pipecat or video-first than LiveKit’s hosted agent operating
    model. Vonage remains a mature video API alternative with participant-minute pricing and enterprise support. Cloudflare
    is the most economically disruptive at the transport layer because it prices SFU/TURN as bandwidth egress rather than
    a full application runtime. OpenAI Realtime is not a complete LiveKit replacement, but for model-centric speech apps it
    can absorb part of the perceived value unless LiveKit owns the deployment, observability, telephony, and multi-model workflow
    around it.
