- id: TP003
  title: Pricing / packaging comparison
  notes: Published list prices are not realized contract prices; enterprise discounts, committed-use economics, and pass-through
    model costs may differ materially.
  columns:
  - Vendor
  - Published unit / package
  - Included capabilities
  - Unknowns
  - Implication
  rows:
  - - LiveKit
    - Build $0/mo, Ship $50/mo, Scale $500/mo, Enterprise custom; agent session shown at $0.0100/min
    - Agent deployment, observability, inference credits, telephony, metrics, enterprise controls
    - Realized enterprise discounts and gross margin undisclosed
    - Platform premium depends on bundling operations around usage
  - - Daily
    - 10,000 free Daily Video minutes/month; usage-based Daily Video and Pipecat Cloud
    - Video SDK, recording, prebuilt, audio-only, live streaming, Pipecat Cloud
    - Exact AI-agent unit economics not visible in fetched pricing text
    - A close developer alternative where video/WebRTC is the main job
  - - Agora
    - Flexible usage pricing; Conversational AI customized; free 10,000 RTC minutes/month on some products
    - Voice, video, live streaming, conversational AI, analytics, recording
    - Customized AI terms and realized volume discounts
    - Large RTE platform may compete aggressively for scaled accounts
  - - Twilio
    - Voice from $0.0085/min inbound and $0.014/min outbound; Conversation Relay starts at $0.07/min
    - Voice API, SIP, messaging, contact-center and AI products
    - Bundled enterprise pricing and video economics by use case
    - Incumbent pricing anchors voice and telephony substitution
  - - 100ms
    - After 10,000 free conferencing minutes, $0.004/min per participant in fetched pricing text
    - Video conferencing, streaming, recording, external streaming
    - AI-agent packaging and enterprise discounts
    - Transparent low video-unit prices pressure generic media transport
  - - Vonage
    - Video API $0.00410 per participant minute; 100,000 free minutes for new customers
    - Video, voice, signaling, chat, TURN, AI media processor, SDKs
    - Volume tiers and advanced feature attach
    - Mature participant-minute reference point for video buyers
  - - Cloudflare Realtime
    - SFU and TURN at $0.05/GB egress after 1,000 GB free
    - Transport-layer SFU/TURN on Cloudflare bill
    - No full agent-stack price in cited docs
    - Can undercut transport-only workloads
  - - OpenAI Realtime
    - Realtime API pricing not captured in fetched pricing page; model/session value in docs
    - Low-latency speech-to-speech model interface
    - Current model price schedule was inaccessible in retained pricing fetch
    - Competes more on capability collapse than transparent transport price
  - - Internal WebRTC build
    - No vendor list price; engineering and cloud infrastructure cost basis
    - Full control over WebRTC implementation
    - Build, reliability, TURN/SFU, observability, support cost
    - A rational option only for teams with strong realtime-infra capability
