  rows:
  - - LiveKit
    - Reference company
    - Open-source repos plus hosted cloud; public pricing tiers
    - Developers building voice, video, and physical AI agents
    - Agent framework, WebRTC transport, cloud deployment, observability
    - Private company; no public revenue, customer count, or retention data in this chapter
  - - Daily
    - Direct developer platform
    - 10,000 free minutes/month advertised for Daily Video
    - Developers building realtime video, voice, and Pipecat agents
    - Video SDK plus Pipecat Cloud orientation
    - Less public evidence in fetched pages for full hosted agent operations than LiveKit
  - - Agora
    - RTE incumbent / direct peer
    - Claims 80B communication minutes/month and 450,000 developers
    - Apps needing voice, video, streaming, IoT, conversational AI
    - Large realtime network and broad RTC portfolio
    - Scale claims are vendor-authored and Conversational AI pricing is customized
  - - Twilio
    - CPaaS incumbent
    - Public company with broad voice and customer-engagement catalog
    - Enterprises with multichannel communication workflows
    - Voice, SIP, messaging, contact-center distribution
    - Broader platform can be heavier and less specialized for open-source AI-agent development
  - - 100ms
    - Video infrastructure peer
    - 10,000 included conferencing minutes and participant-minute pricing
    - Video-first applications, classrooms, events, telehealth
    - Predictable video SDK pricing and prebuilt surfaces
    - AI-agent posture less prominent than LiveKit in fetched sources
  - - Vonage
    - Communications API incumbent
    - 100,000-minute Video API trial and participant-minute rate card
    - Programmable video / enterprise communications buyers
    - Mature Video API, recording, SIP, AI media processor
    - Enterprise communications focus rather than open-source agent platform
  - - Cloudflare Realtime
    - Edge-network transport substitute
    - SFU/TURN priced per GB egress with 1,000 GB free
    - Teams optimizing WebRTC transport economics
    - Global network and simple bandwidth price metric
    - Not a complete voice-agent runtime in fetched docs
  - - OpenAI Realtime
    - Model-layer partial substitute
    - OpenAI API surface for low-latency speech-to-speech apps
    - Developers building directly on OpenAI models
    - Can collapse speech interaction into model API
    - Does not replace full app transport, telephony, deployment, or multi-provider orchestration
  - - Internal WebRTC build
    - Status quo / build option
    - Browser-native API documented by MDN
    - Sophisticated engineering teams wanting full control
    - No vendor lock-in at protocol level
    - Requires in-house SFU/TURN, scaling, reliability, observability, and support
  - - Other video platforms
    - Adjacent substitutes
    - Dolby-style video/streaming docs exist, but current fetched communications surface was weak
    - Video-centric teams with existing vendor preferences
    - May satisfy narrow video workflows
    - Insufficient accessible evidence to score as a primary LiveKit peer
