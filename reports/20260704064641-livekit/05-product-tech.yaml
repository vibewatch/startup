  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "LiveKit is a developer infrastructure platform for realtime voice, video, data, and AI-agent applications. Public evidence supports a broad WebRTC/Agents/telephony/cloud stack with strong OSS activity, while enterprise trust depth, incident history, and model-provider dependency remain diligence gaps."
  },
  "sections": [
    {
      "id": "product-definition",
      "title": "Product definition and workflow fit",
      "body": "LiveKit should be underwritten as realtime communications infrastructure for applications that need people and AI systems to speak, see, stream, or exchange data with sub-second interaction loops. The public surface no longer reads like a narrow video SDK: the platform page emphasizes voice, video, physical AI, open-source SDKs, managed deployment, and realtime observability, while the documentation describes Agents as full realtime participants inside LiveKit rooms. In workflow terms, this means a builder can start with a room, add browser or mobile clients, attach a Python or Node agent, and route media through speech, language, and speech-synthesis providers without owning the entire WebRTC stack. The commercial packaging then turns that stack into cloud runtime, session analytics, telephony, model inference credits, and enterprise controls. The main diligence distinction is that LiveKit sells infrastructure and developer leverage, not an end-user vertical workflow; proof of value therefore comes from breadth of workloads and production references rather than a single application metric.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE003",
        "CE004",
        "CE014",
        "CE015"
      ],
      "tableRefs": [
        "TE001"
      ],
