    {
      "id": "developer-signal-and-open-source",
      "title": "Open source, SDK breadth, and developer signal",
      "body": "Developer signal is unusually visible because the LiveKit ecosystem is public across GitHub, PyPI, and npm. The core Go server had 19,559 stars and a push timestamp the day before the run date; the Agents framework had 11,227 stars, more than 3,000 forks, and was pushed on the run date. The visible SDK map spans JavaScript, Python, Node, React components, SIP, ingress, and egress, and package registries show current distribution through livekit-agents 1.6.4 and livekit-client. Those are not revenue metrics, but they are useful adoption proxies for an infrastructure company whose commercial wedge depends on developers choosing an open-source stack before graduating to managed cloud. The caution is that stars and releases measure awareness and activity, not production retention, enterprise security acceptance, or gross margin. For diligence, the most important follow-up is cohorting repository activity, package downloads, and cloud conversion by product surface.",
