companyProfile:
  summary: >-
    LiveKit is a private realtime AI infrastructure company founded in 2021 by Russ d’Sa and David Zhao. It began as an
    open-source WebRTC stack and now sells a broader managed platform that combines realtime transport, agent
    orchestration, telephony, inference routing, observability, and enterprise controls. Public evidence shows
    meaningful strategic relevance: investor coverage ties LiveKit to OpenAI’s ChatGPT voice mode, while customer and
    partner materials name workloads across xAI, Salesforce, Tesla, Meta, Spotify, healthcare, robotics, and telephony
    use cases. The central underwriting gap is not whether the product is real; it is whether private revenue quality,
    retention, concentration, and margin data justify the current headline valuation.
  foundedDate: '2021-01-01'
  founders:
