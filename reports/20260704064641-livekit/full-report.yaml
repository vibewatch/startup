            body: >-
              The strongest financing fact is well corroborated: TechCrunch, Fortune, and SiliconANGLE all reported a
              January 2026 $100 million raise at a $1 billion valuation. TechCrunch named Index Ventures as lead and
              Altimeter, Hanabi, and Redpoint as participating existing investors; Index and Salesforce Ventures also
