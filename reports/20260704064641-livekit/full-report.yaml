      - number: '1.4'
        title: Milestones, risks, and open items
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving from open-source WebRTC infrastructure into production
              AI-agent infrastructure at the same time voice AI became a priority for large platforms. That path creates
              upside but also concentrates diligence on reliability, compliance, and developer trust. LiveKit’s security
              page claims SOC 2 Type II, zero-retention posture for inference, and BAAs for covered healthcare use
              cases, while the status page was operational at review time. The adverse counterweight is that open GitHub
              issues remained active in July 2026, and LiveKit’s own self-hosting documentation warns that WebRTC
              deployments are operationally tricky because of UDP, TURN, public IP, and firewall requirements. Later
              chapters should therefore reuse the identity, product, financing, and customer facts here, but they should
              not infer revenue quality, production incident rates, or governance terms without private data-room
              evidence. This risk framing is deliberately not a negative verdict on product quality; it is a boundary on
              what public evidence can prove. The same sources that validate market pull also show that production
              realtime infrastructure has failure modes outside model quality, including network traversal, call
              routing, telemetry, incident response, and support. For investment work, those operating facts should be
              tested with customer references, uptime exports, postmortems, and support queues before later chapters
              convert customer names into durable revenue assumptions.
