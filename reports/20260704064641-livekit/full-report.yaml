      - number: '8.3'
        title: Bull, base, and bear scenario logic under explicit uncertainty
        blocks:
          - type: paragraph
            body: >-
              Scenario logic is possible without inventing LiveKit revenue, as long as the denominator is labeled
              estimated and inferred. At public communications-software multiples near Twilio’s roughly 5x to 6x sales
              reference, a $1 billion equity value would require roughly $167 million to $200 million of revenue. At a
              premium AI-infrastructure range of 10x to 15x, the required revenue falls to roughly $67 million to $100
              million. The bull case requires LiveKit to be near that premium-implied range, growing quickly, retaining
              customers, and preserving gross margin despite model and cloud pass-through costs. The base case is track
              because the market and product proof are real but denominators are private. The bear case is avoid if ARR
              is far below the implied range, customer concentration is high, or price pressure from open-source and
              bundled competitors compresses margins.
