      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Valuation
        blocks:
          - type: paragraph
            body: >-
              LiveKit’s January 2026 Series C gives the company a strong headline capital signal but not a full
              capital-adequacy answer. Company, press, and independent sources agree on a $100 million round at a $1
              billion valuation, and Unite.AI reported $183 million total raised. That supports a simple public math
              bridge: the latest round equals roughly 10% of the headline valuation if the valuation is post-money, and
              the headline valuation is about 5.5 times disclosed cumulative capital raised. Neither figure is a revenue
              multiple. Without ARR, burn, cash balance, or gross margin, the valuation cannot be benchmarked using
              normal SaaS or infrastructure revenue multiples, even though Twilio and Multiples.vc provide public-comp
              context. The adverse filing evidence matters here: adjacent communications and realtime infrastructure
              companies disclose intense competition, pricing pressure, and network cost exposure, so LiveKit’s private
              metrics must prove that voice-AI growth converts into durable, high-quality gross profit. The round likely
              extends operating flexibility, but it does not by itself prove capital efficiency; the next underwriting
              step is a use-of-proceeds schedule tied to hiring, infrastructure commitments, and customer expansion
              milestones.
