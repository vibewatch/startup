      - number: '3.3'
        title: Switching Costs, Multi-Homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              LiveKit has real but not absolute switching costs. A customer building on LiveKit is likely to wire in
              client SDKs, realtime rooms, agent-session orchestration, model plugins, deployment processes,
              observability, and potentially SIP or telephony. That makes a wholesale replacement more difficult than
              swapping one model endpoint. However, multi-homing remains practical because the architecture is layered:
              a buyer can use OpenAI Realtime for direct model audio, Twilio or Vonage for communications workflows,
              Cloudflare for transport primitives, or Daily/100ms for WebRTC rooms while keeping other components in
              house. Distribution power also varies by buyer. Enterprises already standardized on Twilio may prefer a
              broader engagement platform, while developer-led AI teams may value LiveKit’s open-source and agent-first
              ergonomics. The resulting moat is integration speed and developer trust, not contractual exclusivity or a
              permanent protocol monopoly.
