  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Substitutes, and Buyer Jobs
        blocks:
          - type: paragraph
            body: >-
              LiveKit’s competitive set is broader than “video API vendors.” The retained evidence points to five buyer
              alternatives: direct realtime developer platforms such as Daily, Agora, 100ms, and Vonage; communications
              incumbents led by Twilio; edge-network transport from Cloudflare Realtime; model-layer substitutes such as
              OpenAI Realtime; and internal WebRTC builds using browser-native APIs. LiveKit’s differentiation is that
              it packages media transport, open-source SDKs, LiveKit Cloud, and an agents framework around voice, video,
              and physical AI rather than selling only participant minutes or generic CPaaS channels. That breadth
              matters because the buyer job is usually not just a call: teams need low-latency media, orchestration,
              model access, observability, SIP or phone entry points, and deployment operations. The adverse read is
              equally clear: every layer has a specialist with transparent usage pricing, so LiveKit must keep proving
              that integration value is worth more than assembling cheaper primitives. This is why the landscape should
              be evaluated by workload layer rather than by vendor category labels alone.
            claimRefs:
