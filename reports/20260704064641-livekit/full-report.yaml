      - number: '2.2'
        title: Sizing lenses and estimate discipline
        blocks:
          - type: paragraph
            body: >-
              The market is clearly large, but the evidence must be layered rather than averaged. The Business Research
              Company estimates WebRTC at $25.8 billion in 2026 and $116.42 billion in 2030, while Fortune Business
              Insights estimates $13.07 billion in 2026 and $122.08 billion by 2034. Grand View Research estimates
              conversational AI at $17.7 billion in 2026 and $78.9 billion in 2033. Those numbers are useful as outer
              bounds and demand pools, not as LiveKit revenue forecasts. WebRTC estimates include conferencing,
              messaging, file sharing, and vertical communications well beyond voice agents; conversational AI includes
              chatbots, virtual assistants, services, and deployment models that may not use realtime media
              infrastructure. A more defensible stack treats broad WebRTC as TAM, conversational AI as an adjacent
              demand pool, realtime voice-agent infrastructure as SAM, and LiveKit’s won usage as SOM. This preserves
              comparability.
