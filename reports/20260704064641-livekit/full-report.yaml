      - number: '5.4'
        title: Trust, reliability, and technical diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public trust and reliability picture is adequate for a developer-led infrastructure company but not
              complete enough for enterprise underwriting on its own. LiveKit exposes a Trust Center, a status page,
              pricing tiers that mention security reports, HIPAA, SSO, support SLA, and region pinning, and external
              monitoring that reported the service operational at the run-date check. The adverse side is that
              third-party incident summaries describe 2026 regional disruptions, including a US East
              participant-connection incident lasting roughly five hours. That does not invalidate the product; realtime
              infrastructure inevitably has regional and vendor dependency risk. It does mean a diligence process should
              request actual SOC 2 or security reports, DPA and HIPAA scope, uptime SLA history, incident postmortems,
              customer-impact minutes, and model-provider failover design. Until those documents are reviewed, the
              product should be credited for public transparency and open-source maturity but not for fully proven
              enterprise resilience. This remains a management diligence item, not a disqualifying public finding.
