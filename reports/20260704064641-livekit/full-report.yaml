      - number: '2.3'
        title: Buyers, budgets, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation matters because the same technology can be bought by different budget owners. AI-native
              application teams buy latency and developer control; enterprise product teams buy embedded agents for
              their own users; contact-center operations teams buy automation and call containment; healthcare or
              emergency-service workflows buy reliability and compliance; robotics teams buy low-latency media; platform
              teams buy global infrastructure and operational leverage. The adoption trigger is usually a workflow that
              breaks if turn-taking, interruption handling, live-call audio, or video context is poor. Gartner’s 2026
              agentic-app forecast and OpenAI’s realtime product surface support timing, while Daily and Agora show that
              vendors are actively productizing the same need. Budget friction remains real because pricing units differ
              across the stack: minutes, sessions, AI-engine usage, model tokens, beta/free plans, and enterprise
              contracts do not map cleanly.
            claimRefs:
