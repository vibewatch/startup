      - number: '8.2'
        title: Comparable valuation frame and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The comp set should be triangulated rather than copied mechanically. Twilio is the cleanest
              communications-platform public reference because it sells programmable voice APIs and
              StockAnalysis/CompaniesMarketCap provide current market value, enterprise value, revenue, and PS data.
              Zoom, RingCentral, Five9, Agora, Cloudflare, and Multiples.vc broaden the range, while SEC submissions
              provide filing-grade confirmation that those issuers belong in software or technology categories. The
              comparison shows two things at once: multi-billion-dollar communications and infrastructure outcomes are
              plausible, but public-market multiples are disciplined by revenue scale, profitability, growth, and
              durability. LiveKit deserves a premium lens for realtime AI infrastructure and OpenAI relevance, yet the
              absence of ARR means the premium cannot be verified. Entry discipline should therefore anchor on implied
              revenue ranges and private KPI thresholds rather than founder quality or logos alone.
