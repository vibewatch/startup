  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workflow fit
        blocks:
          - type: paragraph
            body: >-
              LiveKit should be underwritten as realtime communications infrastructure for applications that need people
              and AI systems to speak, see, stream, or exchange data with sub-second interaction loops. The public
              surface no longer reads like a narrow video SDK: the platform page emphasizes voice, video, physical AI,
              open-source SDKs, managed deployment, and realtime observability, while the documentation describes Agents
              as full realtime participants inside LiveKit rooms. In workflow terms, this means a builder can start with
              a room, add browser or mobile clients, attach a Python or Node agent, and route media through speech,
              language, and speech-synthesis providers without owning the entire WebRTC stack. The commercial packaging
              then turns that stack into cloud runtime, session analytics, telephony, model inference credits, and
              enterprise controls. The main diligence distinction is that LiveKit sells infrastructure and developer
              leverage, not an end-user vertical workflow; proof of value therefore comes from breadth of workloads and
              production references rather than a single application metric.
