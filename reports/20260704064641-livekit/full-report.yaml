      - number: '7.3'
        title: Security, privacy, HIPAA, CCPA, and recording-consent exposure
        blocks:
          - type: paragraph
            body: >-
              Security and privacy risk is partially mitigated by documented controls, but the public record is not
              sufficient for a regulated-sector green light. LiveKit documents JWT authentication, end-to-end
              encryption, and Egress recording capabilities. Those controls matter: E2EE can limit server access to
              content, while Egress creates explicit recording and retention questions. Legal sources then widen the
              diligence surface: HIPAA safeguards can apply to healthcare use cases, CCPA can apply to California
              consumer data, and recording laws can limit audio capture depending on jurisdiction. The adverse security
              record is specific rather than speculative: Snyk, OpenCVE, and NVD all identify CVE-2026-46598 in
              livekit-cli versions before 2.16.4-r2. The unresolved gap is private evidence—SOC 2 reports, BAA terms,
              DPA detail, subprocessors, incident response, and customer-specific consent flows.
