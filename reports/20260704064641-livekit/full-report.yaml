  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              LiveKit’s public financial model is usage-sensitive infrastructure rather than a classic fixed-seat SaaS
              model. The official pricing page shows plan subscriptions from Build through Enterprise, but the economic
              engine is broader: agent-session minutes, inference/model usage, telephony, and higher enterprise limits
              all create consumption-based expansion paths. The pricing calculator is especially important because it
              displays minute-level agent economics and separate LLM, STT, TTS, telephony, and observability components,
              which means list revenue can scale with conversation volume and model intensity. Quotas and limits
              reinforce that upsell path: Build customers face concurrency and rate ceilings, while Enterprise customers
              can negotiate higher limits through annual commitments. The caveat is that list pricing is not realized
              revenue. Included credits, discounts, model pass-through, telephony costs, and egress can materially
              change gross margin, so the public pages prove monetization mechanics but not profitability.
