chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              LiveKit’s public identity is unusually clear for a private infrastructure company: it describes itself as
              an open-source framework and developer platform for building, testing, deploying, scaling, and observing
              voice, video, and physical AI agents. That definition is corroborated by the open-source server
              repository, which frames LiveKit as a WebRTC-based realtime stack, and by the agents documentation, which
              shows server-side programs joining realtime rooms as participants. The business-model transition is the
              important diligence point. LiveKit did not remain only a free developer project; reporting says the
              business accelerated when enterprises wanted a managed cloud version, and LiveKit’s own platform page now
              emphasizes cloud runtime, autoscaling, inference, telephony, and observability. The result is a company
              whose economic wedge is production infrastructure around realtime AI interactions, not ownership of the
              underlying foundation models.
