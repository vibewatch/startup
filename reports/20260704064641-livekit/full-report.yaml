      - number: '2.4'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are agentic-AI adoption, AI infrastructure spending, demand for natural voice
              interfaces, and the need to avoid bespoke realtime-media operations. Gartner forecasts 40% of enterprise
              applications will include task-specific AI agents by the end of 2026, and separately forecasts $2.59
              trillion of worldwide AI spending in 2026. Those are favorable timing signals for LiveKit, but constraints
              are equally material. WebRTC is open, so protocol access is not a moat by itself; managed differentiation
              must come from reliability, scale, developer experience, compliance, observability, and integrations.
              Incumbent CPaaS and cloud contact-center suites already own budgets and workflows. Trust-sensitive sectors
              add compliance, recording, privacy, and incident-response requirements. The McKinsey trust source was
              access-blocked during review, so trust claims here rely on substitute evidence and should be refreshed
              with accessible sources. The most important diligence implication is that category growth does not
              automatically translate into uniform willingness to pay. A developer building an AI-native application may
              value composability and speed; a contact-center buyer may value routing, reporting, and vendor
              consolidation; a platform team may compare LiveKit against self-hosting or Cloudflare-like infrastructure.
              The market model therefore needs separate conversion assumptions by buyer, not one blended penetration
              rate applied to broad WebRTC or conversational-AI spend.
            claimRefs:
              - CM007
              - CM022
              - CM024
              - CM029
              - CM032
              - CM033
              - CM034
