  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for LiveKit is narrower than “AI” and broader than legacy video conferencing. It
              is realtime voice, video, and data infrastructure for AI agents and communication applications, with
              WebRTC as the transport substrate and live audio as the highest-urgency use case. W3C and MDN support the
              technical boundary by defining WebRTC as browser and application APIs for real-time media and data.
              OpenAI’s Realtime API validates the demand-side boundary: live audio sessions are distinct from
              request-based audio because they require low latency. The substitute set is layered. Daily, Agora, 100ms,
              and Cloudflare can replace media infrastructure; Twilio and Vonage can own phone-call workflows; Google
              and AWS contact-center suites can absorb buyers that prefer an integrated suite over developer primitives;
              internal self-hosting remains an option where teams have WebRTC expertise.
            claimRefs:
