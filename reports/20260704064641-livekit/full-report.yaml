      - number: '7.4'
        title: Financial, customer-concentration, and competitive price-compression gaps
        blocks:
          - type: paragraph
            body: >-
              The financial/model risk is principally an evidence gap. Funding coverage supports LiveKit’s strategic
              relevance and names marquee users, but the retained public sources do not disclose ARR, revenue growth,
              gross margin, burn, NRR, or customer revenue concentration. That absence matters because a $1 billion
              valuation raises the burden of proof for paid-cloud conversion and margin durability. Competitive pressure
              is real: TRTC frames LiveKit’s bundles as less flexible for bursty or AI-heavy workloads, while Twilio,
              Agora, and Daily market overlapping voice, video, and AI infrastructure. Open-source adoption is a
              double-edged signal: it helps developer distribution but can weaken pricing power if enterprises self-host
              or negotiate against credible substitutes. The kill criteria are therefore measurable: missed enterprise
              conversion, repeated incidents, unpatched vulnerabilities, insufficient regulated-sector contracts, or
              private evidence of concentrated revenue.
            claimRefs:
              - CR001
              - CR002
              - CR021
