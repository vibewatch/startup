      - number: '4.2'
        title: GTM Signals, Public Traction, and Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction evidence is qualitative rather than financial. TechCrunch reported that
              LiveKit powers OpenAI’s ChatGPT voice mode and named xAI, Salesforce, Tesla, emergency service operators,
              and mental-health providers as customers; Salesforce Ventures separately cited xAI, Meta, and Spotify as
              demanding realtime AI workloads. Index’s investor essay describes bottom-up developer growth, and GitHub
              provides visible open-source developer signal. Those signals are commercially meaningful because
              infrastructure companies often convert developer adoption into cloud usage, enterprise controls, and
              support contracts. They are not, however, substitutes for revenue metrics. No retained source discloses
              ARR, revenue run-rate, net revenue retention, gross margin, active paid accounts, customer concentration,
              CAC, payback, or cohort expansion. The resulting GTM view is promising but not underwritable without
              management-provided invoices, retention cohorts, and customer-level gross margin.
