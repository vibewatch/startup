      - number: '5.2'
        title: Architecture, AI integrations, and telephony
        blocks:
          - type: paragraph
            body: >-
              The product architecture is best described as a WebRTC-centered realtime fabric with agent orchestration
              above it and model-provider plugins around it. LiveKit states that WebRTC carries realtime interaction
              between end users and agents, while agent code can use HTTP or WebSockets to reach backends and AI
              providers. The OpenAI integration is especially important because the docs explicitly place LiveKit
              between a WebRTC frontend and the OpenAI Realtime API over WebSockets; Anthropic, Deepgram, ElevenLabs,
              and Cartesia then show that the framework is intentionally provider-flexible. SIP and telephony expand the
              surface from browser and mobile sessions into phone calls, trunks, dispatch rules, DTMF, transfer, secure
              trunking, and LiveKit phone numbers. This breadth creates switching costs when teams use the stack
              end-to-end, but it also leaves dependency risk: many production experiences still rely on third-party STT,
              LLM, and TTS vendors whose latency, regions, limits, and outages are outside LiveKit’s direct control.
