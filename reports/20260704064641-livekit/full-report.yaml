      - number: '3.4'
        title: Moat Durability and Adverse Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              The durable-moat question is whether LiveKit can stay the default voice-AI application layer while the
              underlying primitives commoditize. Public evidence supports a strong developer wedge: open-source
              repositories, a hosted cloud platform, and an agents framework give LiveKit a credible bottom-up
              acquisition channel. But pricing evidence from 100ms, Vonage, Twilio, and Cloudflare shows buyers have
              transparent alternatives for participant minutes, voice minutes, and transport egress. OpenAI Realtime
              adds a separate adverse path: model providers can collapse more application logic into their own realtime
              APIs, leaving LiveKit to defend orchestration, telephony, reliability, and production observability. The
              highest-conviction diligence ask is therefore not whether LiveKit has product relevance; it clearly does.
              It is whether enterprise customers will pay a durable platform premium rather than continuously
              re-benchmarking each layer against lower-priced primitives and incumbent bundles. A second-order diligence
              concern is procurement behavior: once a realtime agent reaches production, finance and platform teams can
              benchmark every meter separately, forcing LiveKit to justify convenience, reliability, and speed against
              observable unit prices. That procurement dynamic favors a premium only if LiveKit can show lower total
              engineering cost and fewer production failures.
            claimRefs:
