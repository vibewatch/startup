      - number: '4.3'
        title: Unit Economics and Cost Drivers
        blocks:
          - type: paragraph
            body: >-
              The public cost-driver evidence points to a stacked COGS model. LiveKit incurs or passes through realtime
              media infrastructure, cloud compute, model inference, telephony/SIP, observability, and support. LiveKit’s
              own docs show inference credits and multiple model providers; Deepgram, Cartesia, ElevenLabs, and OpenAI
              pages illustrate that speech and voice models have their own usage pricing; and Cloudflare’s Realtime
              pricing gives a transparent transport-cost reference for SFU/TURN egress. Public-company filings sharpen
              the risk: Agora says cost of revenue includes bandwidth from network operators and cloud providers,
              colocation, server depreciation, taxes, and support personnel, while Cloudflare reports colocation,
              network and bandwidth costs and equipment depreciation. Those are not LiveKit’s financial statements, but
              they identify the economic sensitivities a LiveKit underwriter must test: utilization, egress, inference
              mix, telephony minutes, enterprise support, and volume discounts. The most important diligence output is
              therefore a minute-level margin bridge that starts with the customer-facing meter and subtracts model,
              carrier, network, cloud, and support costs in the same period. Without that bridge, rapid usage growth
              could represent either attractive infrastructure leverage or expensive pass-through volume.
