companyProfile:
  summary: >-
    LiveKit 是一家私营实时 AI 基础设施公司，由 Russ d’Sa 和 David Zhao 于 2021 年创立。公司起步于开源 WebRTC
    栈，现在销售更宽的托管平台，把实时传输、智能体编排、电话、推理路由、可观测性和企业控制合在一起。公开证据显示它具备实质战略相关性：投资人报道把 LiveKit 与 OpenAI 的 ChatGPT
    语音模式联系起来，客户和合作伙伴材料也点名
    xAI、Salesforce、Tesla、Meta、Spotify、医疗、机器人和电话场景中的工作负载。核心承销缺口不在于产品是否真实，而在于私有收入质量、留存、集中度和利润率数据能否支撑当前名义估值。
