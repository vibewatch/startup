  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              LiveKit 合适的市场边界比「AI」更窄，也比传统视频会议更宽。它面向 AI 智能体和通信应用，提供实时语音、视频和数据基础设施，以 WebRTC 为传输底座，以实时音频为最急迫用例。W3C 和 MDN 将
              WebRTC 定义为用于实时媒体和数据的浏览器及应用 API，支撑了这一技术边界。OpenAI 的 Realtime API
              验证了需求侧边界：实时音频会话不同于基于请求的音频，因为它要求低延迟。替代品是分层的。Daily、Agora、100ms 和 Cloudflare 可以替代媒体基础设施；Twilio 和 Vonage
              可以掌握电话呼叫工作流；Google 和 AWS 的联络中心套件可以吸收偏好一体化套件而非开发者原语的买方；团队具备 WebRTC 专长时，内部自托管仍是一个选项。
            claimRefs:
