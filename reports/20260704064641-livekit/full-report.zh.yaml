  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              对一家私营基础设施公司而言，LiveKit 的公开身份异常清晰：公司把自己定义为开源框架和开发者平台，用于构建、测试、部署、扩展和观测语音、视频及物理 AI 智能体。开源服务器仓库印证了这一定义，将
              LiveKit 描述为基于 WebRTC 的实时栈；Agents 文档也显示，服务端程序会作为参与者加入实时房间。商业模式转向才是重要尽调点。LiveKit
              没有停留在免费开发者项目；报道称，当企业需要托管云版本后，业务开始加速，LiveKit 自己的平台页面现在也强调云运行时、自动扩缩容、推理、电话和可观测性。结果是，这家公司用实时 AI
              交互周边的生产基础设施切入经济价值，而不是拥有底层基础模型。
