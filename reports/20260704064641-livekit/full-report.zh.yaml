      - number: '5.4'
        title: 信任、可靠性与技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              对一家开发者主导的基础设施公司而言，公开信任和可靠性图景足够，但单独支撑企业承销仍不完整。LiveKit 提供 Trust Center 和状态页；定价层提到安全报告、HIPAA、SSO、支持 SLA
              和区域固定；外部监测在运行日检查时也显示服务运营正常。反向一面是，第三方事故摘要描述了 2026 年区域中断，包括一次持续大约五小时的 US East
              参与者连接事故。这不会否定产品；实时基础设施不可避免有区域和供应商依赖风险。但它意味着尽调应索取实际 SOC 2 或安全报告、DPA 与 HIPAA 范围、正常运行时间 SLA
              历史、事故复盘、客户影响分钟数和模型提供商故障转移设计。在审阅这些文件前，应认可产品的公开透明度和开源成熟度，但不能把企业级韧性视为已充分证明。这仍是管理层尽调事项，不是公开层面的否决发现。
