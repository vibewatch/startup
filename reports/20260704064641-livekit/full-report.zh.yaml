      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开来源没有证明 LiveKit 已具备退出准备度。LiveKit 对通信、云和 AI 平台买家具备战略相关性，但留存来源都未披露经审计财务、IPO
              准备、老股流动性、优先权条款或买方流程。因此，最终尽调议程决定性很强。投委会应索取 ARR 桥、队列留存、扣除模型和基础设施成本后的毛利率、客户集中度、云与自托管转化、事故历史、漏洞管理
              SLA，以及受监管行业合同材料。投资逻辑破裂触发点同样具体：ARR 相对隐含分母偏弱、旗舰客户暴露过高、生产事故反复出现、存在未修补安全问题、无法为目标垂直行业支持
              HIPAA/CCPA/录音控制，或有证据显示竞争对手捆绑销售迫使公司长期打折。在这些问题清除之前，公开证据支持密切观察 LiveKit，而不是按不计价格的买入去承销。
