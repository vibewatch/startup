      - number: '8.2'
        title: 可比估值框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              可比集合应三角校准，而不是机械照搬。Twilio 是最干净的通信平台公开参照，因为它销售可编程语音 API，StockAnalysis / CompaniesMarketCap 提供当前市值、企业价值、收入和
              PS 数据。Zoom、RingCentral、Five9、Agora、Cloudflare 和 Multiples.vc 拓宽了区间，SEC
              提交文件则提供文件级确认，证明这些发行人属于软件或技术类别。比较同时说明两件事：数十亿美元级通信和基础设施结果是可能的，但公开市场倍数会被收入规模、盈利能力、增长和耐久性约束。LiveKit 因实时 AI
              基础设施和 OpenAI 相关性，值得用溢价视角看待，但缺少 ARR 意味着这份溢价无法验证。因此，入场纪律应锚定隐含收入区间和私有 KPI 门槛，而不是只看创始人质量或 logo。
