        title: 收入模型、定价与变现机制
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的公开财务模型是用量敏感型基础设施，而不是经典固定席位 SaaS。官方定价页展示了从 Build 到 Enterprise 的计划订阅，但经济引擎更宽：智能体会话分钟、推理 /
              模型用量、电话和更高企业上限都能形成基于消耗的扩张路径。定价计算器尤其重要，因为它展示了分钟级智能体经济性，并拆分
              LLM、STT、TTS、电话和可观测性组件，意味着标价收入可以随对话量和模型强度放大。配额和限制进一步强化了这条增购路径：Build 客户会遇到并发和速率上限，Enterprise
              客户则可通过年度承诺协商更高上限。需要警惕的是，标价不等于实际收入。内含额度、折扣、模型转售、电话成本和出站流量都会显著改变毛利率，因此公开页面证明的是变现机制，而不是盈利能力。
