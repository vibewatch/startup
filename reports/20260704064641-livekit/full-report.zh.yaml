  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、替代品与买方任务
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的竞争集合比「视频 API 供应商」更宽。保留证据指向五类买方替代方案：Daily、Agora、100ms 和 Vonage 等直接实时开发者平台；以 Twilio
              为首的通信既有厂商；Cloudflare Realtime 提供的边缘网络传输；OpenAI Realtime 等模型层替代品；以及使用浏览器原生 API 的内部 WebRTC 自建。LiveKit
              的差异化在于，它围绕语音、视频和物理 AI 打包媒体传输、开源 SDK、LiveKit Cloud 和智能体框架，而不是只卖参与者分钟或通用 CPaaS
              渠道。这种宽度很关键，因为买方任务通常不只是一次通话：团队需要低延迟媒体、编排、模型访问、可观测性、SIP 或电话入口，以及部署运营。反向解读也同样清楚：每一层都有定价透明的专业供应商，因此 LiveKit
              必须持续证明，集成价值高于组装更便宜的原语。这也是为什么应按工作负载层评估格局，而不是只看供应商品类标签。
