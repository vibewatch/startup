              和电话把产品范围从浏览器与移动会话扩展到电话呼叫、中继、调度规则、DTMF、转接、安全中继和 LiveKit 电话号码。团队端到端使用这套栈时，这种宽度会形成切换成本，但也留下依赖风险：许多生产体验仍依赖第三方
