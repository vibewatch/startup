      - number: '2.2'
        title: 规模测算口径与估算纪律
        blocks:
          - type: paragraph
            body: >-
              市场显然很大，但证据必须分层使用，不能简单平均。The Business Research Company 估计 WebRTC 市场在 2026 年为 $25.8B、2030 年为
              $116.42B；Fortune Business Insights 估计 2026 年为 $13.07B、到 2034 年为 $122.08B。Grand View Research 估计对话式 AI 在
              2026 年为 $17.7B、2033 年为 $78.9B。这些数字适合作为外沿边界和需求池，而不是 LiveKit 收入预测。WebRTC 估算包括会议、消息、文件共享和垂直通信，远超语音智能体；对话式 AI
              包括聊天机器人、虚拟助手、服务和部署模型，其中很多未必使用实时媒体基础设施。更可辩护的分层方式是：广义 WebRTC 作为 TAM，对话式 AI 作为相邻需求池，实时语音智能体基础设施作为 SAM，LiveKit
              已赢得的用量作为 SOM。这样可比性才不会丢。
