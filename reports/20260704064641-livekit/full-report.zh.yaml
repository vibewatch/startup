            body: >-
              LiveKit 2026 年 1 月的 Series C 给了公司很强的名义资本信号，但没有完整回答资本充足性。公司、媒体和独立来源都认同 $1B 估值下融资 $100M，Unite.AI 报道累计融资
              $183M。这支持一座简单的公开数学桥：如果估值为投后估值，最新轮次大约等于名义估值的 10%；名义估值约为已披露累计融资额的 5.5 倍。两个数字都不是收入倍数。没有
              ARR、烧钱、现金余额或毛利率，就无法用常规 SaaS 或基础设施收入倍数基准测试估值，尽管 Twilio 和 Multiples.vc
              提供了公开可比背景。这里的反向文件证据很重要：相邻通信和实时基础设施公司披露了激烈竞争、价格压力和网络成本敞口，因此 LiveKit 的私有指标必须证明语音 AI
