        title: 竞品画像、能力与定价透明度
        blocks:
          - type: paragraph
            body: >-
              画像和功能证据把 LiveKit 以智能体为中心的栈，与依靠规模、渠道宽度或狭窄单位经济取胜的对手区分开来。Agora 披露了一个很大的自报 RTE 版图；Twilio
              带来企业通信分发能力和宽泛定价目录，起点是按用量计费的语音费率。Daily 和 100ms 更接近开发者优先的 WebRTC 同行，但它们的公开定位比 LiveKit 的托管智能体运营模型更偏视频
              SDK、Pipecat 或视频优先。Vonage 仍是成熟的视频 API 替代品，按参与者分钟计价并提供企业支持。Cloudflare 在传输层最具经济破坏性，因为它把 SFU / TURN
              按带宽出站计价，而不是按完整应用运行时计价。OpenAI Realtime 不是 LiveKit 的完整替代品，但对以模型为中心的语音应用而言，如果 LiveKit
              不能掌握围绕它的部署、可观测性、电话和多模型工作流，OpenAI Realtime 会吸收一部分感知价值。
