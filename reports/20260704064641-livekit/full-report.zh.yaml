      - number: '3.3'
        title: 切换成本、多栖部署与分发能力
        blocks:
          - type: paragraph
            body: >-
              LiveKit 有真实切换成本，但并非绝对。基于 LiveKit 构建的客户很可能接入客户端 SDK、实时房间、智能体会话编排、模型插件、部署流程、可观测性，并可能接入 SIP
              或电话。这让整体替换比换一个模型端点更难。不过，多栖部署仍可行，因为架构是分层的：买方可以用 OpenAI Realtime 做直接模型音频，用 Twilio 或 Vonage 做通信工作流，用
              Cloudflare 做传输原语，或用 Daily / 100ms 做 WebRTC 房间，同时把其他组件留在内部。分发能力也因买方而异。已经标准化使用 Twilio 的企业可能偏好更宽的互动平台；由开发者主导的
              AI 团队可能看重 LiveKit 的开源和智能体优先体验。因此形成的护城河是集成速度和开发者信任，而不是合同排他性或永久协议垄断。
