  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流适配
        blocks:
          - type: paragraph
            body: >-
              应把 LiveKit 作为实时通信基础设施来承销，适用对象是需要人和 AI 系统以亚秒级交互循环说话、观看、流式传输或交换数据的应用。公开材料不再像狭窄的视频 SDK：平台页面强调语音、视频、物理 AI、开源
              SDK、托管部署和实时可观测性，文档则把 Agents 描述为 LiveKit 房间里的完整实时参与者。落到工作流上，构建者可以从一个房间开始，加入浏览器或移动客户端，挂接 Python 或 Node
              智能体，并通过语音、语言和语音合成提供商路由媒体，而不必拥有整套 WebRTC 栈。商业包装再把这套栈变成云运行时、会话分析、电话、模型推理额度和企业控制。关键尽调区分在于，LiveKit
              销售的是基础设施和开发者杠杆，而不是终端用户垂直工作流；价值证明因此来自工作负载宽度和生产引用，而不是单一应用指标。
