      - number: '2.4'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自智能体 AI 采用、AI 基础设施支出、对自然语音界面的需求，以及避免自建实时媒体运营的需求。Gartner 预测，到 2026 年底，40% 的企业应用将包含任务专用 AI 智能体；另有预测称
              2026 年全球 AI 支出为 $2.59T。这些都是有利于 LiveKit 的时间信号，但约束同样重要。WebRTC
              是开放的，因此协议访问本身不是护城河；托管差异化必须来自可靠性、规模、开发者体验、合规、可观测性和集成。既有 CPaaS
              和云联络中心套件已经掌握预算和工作流。信任敏感行业还会增加合规、录音、隐私和事故响应要求。审阅期间无法访问 McKinsey
              信任来源，因此这里的信任判断依赖替代证据，应在可访问来源出现后刷新。最重要的尽调含义是，品类增长不会自动转化为一致的付费意愿。构建 AI
              原生应用的开发者可能看重可组合性和速度；联络中心买方可能看重路由、报告和供应商整合；平台团队可能会拿 LiveKit 与自托管或 Cloudflare
              式基础设施比较。因此，市场模型需要按买方分别设置转化假设，而不是把一个混合渗透率套到广义 WebRTC 或对话式 AI 支出上。
