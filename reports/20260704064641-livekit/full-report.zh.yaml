        title: 客户分群与需求面
        blocks:
          - type: paragraph
            body: >-
              LiveKit 的公开客户证据指向一家横向基础设施公司，拥有多个垂直需求面，而非单一买方分群。最强分群是 AI
              语音智能体、实时体育与媒体、机器人远程操作、医疗患者接入，以及开发者主导的通信应用。买方或推动者通常是技术团队——AI
              工程师、基础设施工程师、CTO、机器人工程师或联络中心构建者——经济买方则可能是企业产品、支持、医疗运营或平台负责人。第三方报道超过 200,000 名开发者，LiveKit 自称拥有 300,000+
              名开发者、每年数十亿次通话和 300+ 模型集成，这些都支持开发者采用，但这些指标不等同于付费客户。因此，核心尽调框架是漏斗转化：开源使用和概念验证必须与 LiveKit Cloud
              账户、生产分钟、续约率和扩张绑定。这是客户尽调的核心桥梁。已验证。
