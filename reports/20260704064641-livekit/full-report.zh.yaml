      - number: '3.4'
        title: 护城河耐久性与反向竞争风险
        blocks:
          - type: paragraph
            body: >-
              护城河能否持久，取决于底层原语商品化时，LiveKit 能否继续成为默认的语音 AI 应用层。公开证据支撑了强开发者楔子：开源仓库、托管云平台和智能体框架给了 LiveKit 可信的自下而上获客渠道。但
              100ms、Vonage、Twilio 和 Cloudflare 的定价证据显示，买方在参与者分钟、语音分钟和传输出站上有透明替代方案。OpenAI Realtime
              又增加了另一条反向路径：模型提供商可以把更多应用逻辑收进自己的实时 API，让 LiveKit 只能防守编排、电话、可靠性和生产可观测性。因此，最高置信度的尽调问题不是 LiveKit
              是否具备产品相关性；答案显然是有。问题是，企业客户会不会支付持久的平台溢价，而不是持续按层与更低价原语和既有套件重新比价。二阶尽调担忧是采购行为：一旦实时智能体进入生产，财务和平台团队可以分别基准测试每一个计费表，迫使
              LiveKit 拿便利性、可靠性和速度去对照可观察的单位价格。只有 LiveKit 能证明总工程成本更低、生产故障更少，这种采购动态才支持溢价。
