  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与当前价格背景
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 LiveKit 是一家战略地位很强的公司，但还不足以支撑「不计价格买入」的完整承销。TechCrunch 和 SiliconANGLE 都报道，公司在 2026 年 1 月以 $1B 估值融资
              $100M，Index 和 Salesforce Ventures 是重要支持者，OpenAI 语音模式相关性是标杆证明点。这足以支持继续尽调和观察建议，不足以宣布入场价格有吸引力。公开记录没有披露
              ARR、收入增长、毛利率、净留存、烧钱、稀释、清算优先权或客户集中度。因此，在获得私有数据前，估值姿态介于偏高到合理之间。若要给出买入建议，需要证据显示 LiveKit 已经达到或正快速复合接近 $1B
              标记所隐含的收入分母，同时在扣除模型和云成本后维持强正常运行时间和可防守利润率。实际含义是，应把名义轮次视为谈判锚点，而不是估值结论。公开报道交叉印证了金额和投资人质量，但只有公司提供的明细表能说明投后价格是否对应可持续软件收入、用量增长和续约质量。在审阅这套资料前，委员会应通过里程碑、信息权和明确价格敏感性保护下行。这一框架保留上行，同时防止叙事溢价取代可验证承销证据。
