              自身文档展示了推理额度和多个模型提供商；Deepgram、Cartesia、ElevenLabs 和 OpenAI 页面说明语音与声音模型也有各自用量定价；Cloudflare 的 Realtime 定价则为
              SFU / TURN 出站给出透明传输成本参照。上市公司文件进一步凸显风险：Agora 称收入成本包括网络运营商和云提供商带宽、托管、服务器折旧、税费和支持人员；Cloudflare
              报告托管、网络与带宽成本以及设备折旧。这些不是 LiveKit 的财务报表，但它们指出 LiveKit
              承销人必须测试的经济敏感项：利用率、出站流量、推理组合、电话分钟、企业支持和量级折扣。因此，最重要的尽调输出是一座分钟级利润率桥，从面向客户的计量项出发，在同一期间扣除模型、运营商、网络、云和支持成本。没有这座桥，快速用量增长既可能代表有吸引力的基础设施杠杆，也可能只是昂贵的转嫁量。
