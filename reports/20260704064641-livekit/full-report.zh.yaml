        blocks:
          - type: paragraph
            body: >-
              已公开的控制措施部分缓解了安全与隐私风险，但公开记录不足以给受监管行业开绿灯。LiveKit 记录了 JWT 认证、端到端加密和 Egress 录制能力。这些控制很重要：E2EE
              可以限制服务器访问内容，Egress 则提出明确的录音和留存问题。法律来源随后扩大了尽调范围：HIPAA 保障措施可能适用于医疗用例，CCPA
              可能适用于加州消费者数据，录音法律可能因司法辖区限制音频捕获。反向安全记录是具体的，而非猜测：Snyk、OpenCVE 和 NVD 都指出，2.16.4-r2 之前的 livekit-cli 版本存在
              CVE-2026-46598。未解决缺口是私有证据——SOC 2 报告、BAA 条款、DPA 细节、子处理方、事故响应和客户特定同意流程。
