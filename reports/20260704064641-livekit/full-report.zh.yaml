      - number: '1.4'
        title: 里程碑、风险与开放问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司在语音 AI 成为大平台优先事项的同时，从开源 WebRTC 基础设施转向生产级 AI 智能体基础设施。这条路径带来上行空间，也把尽调重点集中到可靠性、合规和开发者信任上。LiveKit
              的安全页面声称具备 SOC 2 Type II、推理零留存姿态，并为需 BAA 覆盖的医疗场景提供 BAA；审阅时状态页处于运营状态。反向证据是，2026 年 7 月 GitHub 上仍有开放
              issue，LiveKit 自托管文档也警告，由于 UDP、TURN、公网 IP 和防火墙要求，WebRTC
              部署在运营上很棘手。后续章节应复用这里的身份、产品、融资和客户事实，但在没有私有数据室证据前，不应推断收入质量、生产事故率或治理条款。这一风险框架刻意不是对产品质量的负面裁决；它划定了公开证据能证明什么。同样验证市场拉力的来源也显示，生产级实时基础设施存在模型质量之外的失效模式，包括网络穿透、通话路由、遥测、事故响应和支持。投资工作中，应先用客户访谈、正常运行时间导出、复盘和支持队列检验这些运营事实，再让后续章节把客户名称转化为可持续收入假设。
