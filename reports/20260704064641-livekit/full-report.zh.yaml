      - number: '8.3'
        title: 乐观、基准与悲观情景：明确不确定性下的逻辑
        blocks:
          - type: paragraph
            body: >-
              不虚构 LiveKit 收入，也能做情景推演，前提是把分母明确标为估计和推断。按公开通信软件公司接近 Twilio 大约 5x 至 6x 销售额的参照倍数计算，$1 billion 股权价值需要大约 $167
              million 至 $200 million 收入。若按 10x 至 15x 的高溢价 AI 基础设施区间计算，所需收入降至大约 $67 million 至 $100 million。乐观情景要求 LiveKit
              接近这一高溢价隐含区间，增长要快，客户要留住，还要在模型和云成本转嫁压力下守住毛利率。基准情景是观察，因为市场和产品验证真实存在，但分母仍是私有数据。悲观情景下，如果 ARR
              远低于隐含区间、客户集中度高，或开源和捆绑竞争对手的价格压力挤压利润率，就应回避。
