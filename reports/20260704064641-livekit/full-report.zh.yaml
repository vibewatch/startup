      - number: '2.3'
        title: 买方、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方分群很重要，因为同一项技术可能由不同预算负责人采购。AI
              原生应用团队购买的是低延迟和开发者控制；企业产品团队为自己的用户购买嵌入式智能体；联络中心运营团队购买自动化和通话拦截；医疗或应急服务工作流购买可靠性和合规；机器人团队购买低延迟媒体；平台团队购买全球基础设施和运营杠杆。采用触发点通常是一个工作流：只要轮流发言、中断处理、实时通话音频或视频上下文不好，流程就会断。Gartner
              的 2026 年智能体应用预测和 OpenAI 的实时产品布局支撑了时间窗口，Daily 和 Agora 也显示供应商正在把同一需求产品化。预算摩擦仍然真实存在，因为栈内计价单位不同：分钟、会话、AI
              引擎用量、模型 token、beta / 免费计划和企业合同并不能干净映射。
