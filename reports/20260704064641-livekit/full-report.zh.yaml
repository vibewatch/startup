  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 分母不及预期
        - 收入大幅低于溢价隐含的 $67M-$100M 区间，且没有极高增长
        - $1B 价格难以支撑
        - 回避，或要求更低价格 / 里程碑结构
      - - 毛利率挤压
        - 模型或云成本阻断软件式利润率路径
        - 溢价 AI 基础设施倍数失效
        - 要求成本转嫁证明和利润率桥
      - - 客户集中度
        - 头部客户主导 ARR，或战略 logo 并非付费生产
        - 流失或重谈风险上升
        - 要求客户访谈和风险调整价格
      - - 事故反复
        - 重大生产中断或薄弱的事故复盘
        - 任务关键型语音用例失去信任
        - 把 SLA 和可靠性证据作为交割条件
      - - 安全修复薄弱
        - CVE 级问题持续存在，且没有快速修补
        - 企业信任和受监管垂直行业走弱
        - 要求漏洞管理 SLA
      - - 竞品折扣
        - TRTC/Twilio/Agora/Daily 捆绑包迫使持续价格让步
        - 开源和 API 替代压缩收入质量
        - 下调估值倍数或放弃
    notes: 触发项是尽调阈值，并不声称不利条件已经存在。
    claimRefs:
      - CV009
      - CV019
      - CV020
      - CV021
      - CV023
      - CV024
      - CV025
      - CV028
      - CV036
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 和收入增长
        - 当前 ARR、收入桥、增长队列
        - 验证或推翻隐含分母
        - 索取董事会 KPI 包和月度 ARR 历史
      - - 毛利率和模型成本
        - 云、带宽、推理、支持和超额使用成本桥
        - 判断 AI 基础设施是否配得上溢价倍数
        - 按产品审阅 COGS 和模型供应商成本转嫁
      - - 留存和集中度
        - NRR/GRR、流失、前十大客户占比、合同条款
        - 检验 logo 质量和下行风险
        - 客户访谈加队列明细
      - - 股权结构表和优先权
        - 投后所有权、优先股堆叠、期权池、债务
        - 控制真实入场经济性和下行
        - 审阅融资文件和备考股权结构表
      - - 可靠性和安全
        - 事故历史、SLA 抵扣、CVE 修补流程、SOC 2
        - 保护任务关键型部署
        - 在 NDA 下审阅信任中心，并访谈 SRE / 安全团队
      - - 受监管垂直行业准备度
        - BAA/DPA、录音同意、数据留存、分包处理方控制
        - 影响医疗、应急和录音通话用例
        - 按目标客户工作流进行法律 / 安全审查
    notes: 最终尽调事项要把公开战略证明转成支撑价格的承销证据。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV032
      - CV036
      - CV039
