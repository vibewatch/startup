  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 有证据的风险排序与破坏投资逻辑的姿态
        blocks:
          - type: paragraph
            body: >-
              风险栈为中高，并不是因为某个公开来源证明了致命缺陷，而是多项有证据的敞口叠加在一家年轻基础设施公司身上，而最新融资又抬高了预期。证据最强的风险包括：开源替代品和竞争性 API 套件带来的变现压力、实时语音 /
              视频工作负载的生产可靠性，以及医疗、应急和录音对话等受监管工作负载的合规。未解决缺口同样重要：公开来源点名了知名客户，但没有披露收入集中度、ARR、毛利率或合同条款。因此，本章把有证据的风险与尽调缺口分开。证据支持监测
              LiveKit Status、StatusGator、模型提供商状态页、NVD / Snyk 和法律 /
              合规材料；证据不支持断言已经存在泄露、执法行动或客户集中度问题。投资含义是，只有私有尽调确认企业转化、合规就绪和事故响应纪律后，LiveKit
              才应保持可投资。两个边界引导排序：有证据事项设置监测触发器，不可获得的私有指标变成尽调要求，而不是隐含负面。这一区分对 LiveKit
              很重要，因为公开来源在产品和生态可见度上异常强，在财务、合同和集中度披露上偏弱。因此，IC
              的即时动作是，在给最终估值折价前，把每个严重风险转化为要求提交的文件、负责人访谈或运营指标。这样形成的是一份可在管理层尽调后刷新的可衡量风险台账，而不是一张静态的假设担忧清单。
