              的投资人文章描述了自下而上的开发者增长，GitHub 则提供可见的开源开发者信号。这些信号具备商业意义，因为基础设施公司常把开发者采用转化为云用量、企业控制和支持合同。但它们不能替代收入指标。保留来源没有披露
