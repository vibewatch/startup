slug: livekit
runDate: "2026-07-04"
company:
  name: LiveKit
chapter:
  number: 1
  title: Company Overview
  summary: >-
    LiveKit is a private AI infrastructure company that began as open-source realtime audio/video infrastructure and now
    sells a managed platform for voice, video, and physical AI agents. The strongest public facts are the January 2026
    $100 million financing at a reported $1 billion valuation, founder identity, product scope, developer adoption
    claims, and named customer/workload references; ARR, retention, headcount, board composition, and incident history
    remain private diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      LiveKit’s public identity is unusually clear for a private infrastructure company: it describes itself as an
      open-source framework and developer platform for building, testing, deploying, scaling, and observing voice,
      video, and physical AI agents. That definition is corroborated by the open-source server repository, which frames
      LiveKit as a WebRTC-based realtime stack, and by the agents documentation, which shows server-side programs
      joining realtime rooms as participants. The business-model transition is the important diligence point. LiveKit
      did not remain only a free developer project; reporting says the business accelerated when enterprises wanted a
      managed cloud version, and LiveKit’s own platform page now emphasizes cloud runtime, autoscaling, inference,
      telephony, and observability. The result is a company whose economic wedge is production infrastructure around
      realtime AI interactions, not ownership of the underlying foundation models.
    claimRefs:
      - CO001
      - CO002
      - CO011
      - CO018
      - CO020
      - CO034
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003
  - id: leadership-governance-and-stakeholders
    title: Leadership, governance, and stakeholders
    body: >-
      Public sources consistently name Russ d’Sa and David Zhao as LiveKit’s founders and place the company in a
      late-venture profile after the January 2026 financing. However, the public leadership picture is sparse: investor
      materials highlight the founders and technical vision, while no reviewed source disclosed a complete executive
      bench, board composition, credit facility, or secondary-sale terms. There is also a location discrepancy:
      Salesforce Ventures labels the company San Francisco, while Tracxn lists Saratoga. That conflict is not
      thesis-breaking, but it is a reminder that company-profile databases should not be treated as definitive for legal
      headquarters, governance, or control. The stakeholder map therefore separates investors with financing importance
      from public proof of control, and it turns governance into a diligence ask rather than an asserted fact.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO031
      - CO036
      - CO037
      - CO038
    tableRefs:
      - TO002
      - TO003
  - id: funding-scale-and-traction
    title: Funding, scale, and traction proof
    body: >-
      The strongest financing fact is well corroborated: TechCrunch, Fortune, and SiliconANGLE all reported a January
      2026 $100 million raise at a $1 billion valuation. TechCrunch named Index Ventures as lead and Altimeter, Hanabi,
      and Redpoint as participating existing investors; Index and Salesforce Ventures also published investor
      perspectives. Tracxn reports $174 million of total funding, which is useful for context but should be reconciled
      against company cap-table documents before being used as a model input. Traction proof is compelling but still
      incomplete. LiveKit claims more than 300,000 developers, billions of annual calls, and 300-plus AI model
      integrations, while Index cited more than 200,000 developers and teams. Named workload and customer references
      include OpenAI voice mode, xAI, Salesforce, Tesla, Meta, Spotify, SAP, robotics companies, emergency operators,
      and mental-health providers. None of those sources discloses ARR, margin, retention, or verified customer count.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO032
      - CO033
      - CO035
    tableRefs:
      - TO004
  - id: milestones-risks-and-open-items
    title: Milestones, risks, and open items
    body: >-
      The milestone record shows a company moving from open-source WebRTC infrastructure into production AI-agent
      infrastructure at the same time voice AI became a priority for large platforms. That path creates upside but also
      concentrates diligence on reliability, compliance, and developer trust. LiveKit’s security page claims SOC 2 Type
      II, zero-retention posture for inference, and BAAs for covered healthcare use cases, while the status page was
      operational at review time. The adverse counterweight is that open GitHub issues remained active in July 2026, and
      LiveKit’s own self-hosting documentation warns that WebRTC deployments are operationally tricky because of UDP,
      TURN, public IP, and firewall requirements. Later chapters should therefore reuse the identity, product,
      financing, and customer facts here, but they should not infer revenue quality, production incident rates, or
      governance terms without private data-room evidence. This risk framing is deliberately not a negative verdict on
      product quality; it is a boundary on what public evidence can prove. The same sources that validate market pull
      also show that production realtime infrastructure has failure modes outside model quality, including network
      traversal, call routing, telemetry, incident response, and support. For investment work, those operating facts
      should be tested with customer references, uptime exports, postmortems, and support queues before later chapters
      convert customer names into durable revenue assumptions.
    claimRefs:
      - CO019
      - CO021
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO039
      - CO040
    figureRefs:
      - FO001
