evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: company-identity
    missingEvidence: >-
      Authoritative incorporation, founding, and headquarters records that reconcile the 2015–2017 founding dates and
      Dubai/Riyadh headquarters descriptions.
    whyItMatters: >-
      Identity and legal domicile determine which entity owns contracts, assets, licenses, and the financing
      obligations.
    diligencePath: >-
      Obtain current commercial-register extracts, group structure, registered-office details, and a
      management-confirmed headquarters statement.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: Current executive and board roster, decision rights, succession arrangements, and key-person coverage.
    whyItMatters: >-
      Public sources identify founders and the CEO but do not establish governance quality, functional coverage, or
      succession risk.
    diligencePath: Request the current organization chart, board composition and minutes, delegation matrix, and succession plans.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: company-scale
    missingEvidence: >-
      Dated, consistently defined current valuation, audited revenue, ARR, employee count, active customers, and
      cumulative equity proceeds.
    whyItMatters: >-
      Published profiles use different vintages and definitions; stale or incomparable values cannot support a current
      company-scale or investment judgment.
    diligencePath: >-
      Reconcile audited statements, monthly operating dashboards, active-customer definitions, employee roster, cap
      table, and latest priced-round documentation.
    relatedQuestionRefs:
      - QO007
      - QO010
  - type: private-evidence-only
    severity: material
    topic: securitisation
    missingEvidence: Facility utilization, recourse and covenant terms, receivables aging and loss rates, and servicing performance.
    whyItMatters: >-
      An announced facility ceiling is not equivalent to cash drawn or available and may create material collateral and
      liquidity dependencies.
    diligencePath: >-
      Review executed facility documents, borrowing-base certificates, collections history, arrears, covenant headroom,
      and trustee reports.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Independent confirmation and adoption metrics for the listed product launches and partnerships, plus current
      legal, regulatory, and material incident-status records.
    whyItMatters: >-
      A launch or announced collaboration does not establish deployment or financial contribution, and the assigned
      evidence does not establish the absence of adverse events.
    diligencePath: >-
      Request product deployment records, partner confirmations, active-lane volumes, legal and regulatory disclosures,
      incident records, and revenue attributable to each service line.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: company-specific-sizing
    missingEvidence: >-
      Current platform-intermediated GCC road-freight spend, addressable corridors, SAM, SOM, and the basis for the
      company's US$20B assertion.
    whyItMatters: >-
      Broad logistics totals include services and modes outside the core platform opportunity and cannot support a
      company-level valuation or penetration estimate.
    diligencePath: >-
      Obtain a dated market model with corridor and freight-mode definitions, transaction volumes, active shipper spend,
      platform-eligible share, take rate, and sensitivity cases.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: gcc-market-sizing
    missingEvidence: >-
      Reconciliation of Mordor Intelligence's and Business Focus's different 2026 and 2031 GCC freight-and-logistics
      forecasts despite their reported identical CAGR.
    whyItMatters: >-
      Differences in category definitions, base data or forecast methodology could materially change any top-down
      opportunity narrative.
    diligencePath: >-
      Review both publishers' full methodology, segment definitions, source data and forecast assumptions before using
      either estimate as a benchmark.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Verified budget owners, procurement cycles, customer-level adoption, contract payer, take rate and repeat usage by
      shipper segment.
    whyItMatters: >-
      Network size and regional freight demand do not show whether customers convert, pay for the platform, or generate
      attractive unit economics.
    diligencePath: >-
      Request anonymized customer cohorts, contracts, win/loss data, route-level transaction values, gross margin and
      renewal or repeat-booking metrics.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: corridor-adoption
    missingEvidence: >-
      Independent route-level evidence separating temporary disruption-driven demand from durable digital freight
      adoption attributable to TruKKer.
    whyItMatters: >-
      Emergency rerouting can raise volumes and prices without establishing normalized usage, customer retention or
      sustainable willingness to pay.
    diligencePath: >-
      Compare pre-disruption, disruption-period and normalized-period bookings, repeat shippers, service levels, truck
      availability and price realization by corridor.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Matched lane-level price quotes, units, surcharges, discounts, contract duration, service levels, and realized
      rather than advertised rates for TruKKer and alternatives.
    whyItMatters: >-
      Without comparable pricing and contract terms, the report cannot determine whether claimed price competitiveness
      is durable differentiation or a margin trade-off.
    diligencePath: >-
      Request dated quotes and executed contract schedules for the same shipment lanes, load types, volumes, and service
      requirements from TruKKer and named alternatives.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-multihoming
    missingEvidence: >-
      Customer-level retention, churn, multi-homing, switching costs, exclusive carrier access, and renewal evidence by
      shipper segment and lane.
    whyItMatters: >-
      A marketplace that permits buyers to onboard their own vendors may improve flexibility but may not create durable
      buyer or carrier lock-in.
    diligencePath: >-
      Interview current and former shippers and carriers; reconcile cohort retention and multi-homing data to contracts
      and transaction records.
    relatedQuestionRefs:
      - QP006
  - type: enumeration-incomplete
    severity: material
    topic: competitor-profile-table
    missingEvidence: >-
      A neutral and current enumeration of direct GCC road-freight marketplaces, incumbents, specialized operators, and
      buyer-side substitutes with comparable profile data.
    whyItMatters: >-
      The only named peer comparison is competitor-authored and cannot establish coverage, relative scale, or the full
      set of alternatives available to shippers.
    diligencePath: >-
      Obtain a neutral buyer procurement set or independently sourced operator directory, then validate lane coverage,
      scale definitions, and service scope with customers.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: stale
    severity: minor
    topic: current-competitor-scale
    missingEvidence: >-
      Current definitions and dated evidence for active customers, available trucks, fulfilled shipments, and competitor
      scale.
    whyItMatters: >-
      TruKKer's 2025 company-reported counts and peers' non-comparable disclosures do not establish current network
      liquidity or relative scale as of the report date.
    diligencePath: >-
      Request current active-vs-registered definitions and independently reconcile capacity, shipments, and customer
      counts for TruKKer and its principal competitors.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: fulfillment-and-network-quality
    missingEvidence: >-
      Matched delivery completion, on-time performance, claims, shipment visibility, carrier utilization, and driver
      payment outcomes across platforms.
    whyItMatters: >-
      Product descriptions do not show whether execution quality or network effects exceed incumbent and
      direct-procurement alternatives.
    diligencePath: >-
      Validate lane-level service records and customer references against dispatch, proof-of-delivery, claims, and
      carrier settlement data.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP008
  - type: private-evidence-only
    severity: material
    topic: audited-unit-economics
    missingEvidence: >-
