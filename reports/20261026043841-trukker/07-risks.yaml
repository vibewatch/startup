        - label: "Longer routes and capacity bottlenecks"
          values: ["Medium-high in rerouting scenarios", "High", "Partial", "High"]
        - label: "EV charging readiness"
          values: ["Medium for EV deployments", "Medium-high", "Proposed / pilot-stage", "Medium-high"]
        - label: "Receivables and facility performance"
          values: ["Unknown", "High", "Not evidenced", "High until reviewed"]
        - label: "Cybersecurity and incident readiness"
          values: ["Unknown", "High", "Not evidenced", "Unknown"]
    approximationNotes: "Qualitative analyst prioritization, not source-reported probabilities or measured scores; unknown likelihood is retained where the public evidence is insufficient."
    claimRefs: [CR005, CR013, CR014, CR015]
