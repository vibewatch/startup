company:
  name: TruKKer
chapter:
  number: 6
  title: Customers
  summary: Public evidence describes TruKKer as a two-sided freight marketplace and reports a growing truck network, but the reported counts are not a comparable active-customer series. The assigned sources do not establish named shipper deployments, retention, customer concentration, or attributable customer outcomes.
sections:
  - id: customer-segments
    title: Buyers, users, and supply participants
    body: >-
      The clearest segmentation is by marketplace role rather than by industry or
      company size. Sources describe business shippers as the demand side and
      truck owners, operators, or transporters as the capacity side; the
      available disclosures do not separate who signs, books, pays, and uses
      each service (CU005, CU010). The 2021 SME10X interview reported 500 B2B
      customers and more than 25,000 trucks, while a later DXBi profile refers
      to a 1,200-plus enterprise-client base without defining active status or
      the count's denominator (CU002, CU011). Regional and cross-border
      expansion is also visible in reported operating markets, but country
      presence does not establish customer density or repeat demand (CU004,
      CU008). Treat carriers as marketplace supply participants, not as proof
      of paying shipper accounts; no named shipper deployment is substantiated
      in the retained evidence (CU013).
    claimRefs: [CU002, CU004, CU005, CU008, CU010, CU011, CU013]
    tableRefs: [TU001]
  - id: adoption-and-workflow
    title: Adoption signals and service workflow
    body: >-
      The public adoption trail consists of snapshots: a 2021 interview gave
      B2B-customer and truck counts, Reuters later reported a 35,000-plus truck
      fleet, and another profile described more than 40,000 trucks across eight
      countries (CU002, CU004). A company media page lists a July 2026 story
      headline claiming 75,000 trucks use the platform, while DXBi reproduces
      a 1,200-plus enterprise-client figure with no current-account definition
      (CU009, CU011). These are publisher- or company-reported snapshots with
      different dates and denominators, not an independently verified growth
      curve or active-use series. Descriptions of the workflow include matching
      shipper demand to truck capacity, booking and tracking loads, and paying
      transporters; the cited CFO interview describes a per-trip spread between
      vendor cost and client invoice (CU005, CU006, CU007, CU010). Expansion
      announcements and a large network do not establish repeat usage or
      delivery outcomes (CU008, CU014, CU016).
    claimRefs: [CU002, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU014, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: proof-and-durability
    title: Customer proof, durability, and exposure
    body: >-
      The evidence is materially stronger on network scale and product
      description than on customer-level proof. Reuters reported TruKKer's
      acquisition of TruckSher in Pakistan, and the company's media page also
      lists the transaction, but neither source identifies a shipper account
      or its deployment status (CU003, CU013). The retained public texts do not
      supply a named customer reference, production-versus-pilot classification,
      quantified customer outcome, renewal cohort, churn rate, NRR, or
      concentration schedule (CU013, CU014, CU015, CU016). A Dubai Cargos
      article highlights truck and driver availability constraints and argues
      that road freight cannot replace sea capacity; it is a low-reputation
      market commentary, not evidence of a TruKKer-specific failure (CU012).
      No reported incident in this sample would not prove that none occurred.
      The table therefore records the evidence boundary rather than presenting
      logos, funding counterparties, or carrier counts as named customer
      deployments.
    claimRefs: [CU003, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation and disclosed scale
    columns: [Segment, Buyer / user / payer, Use case and reported scale, Strategic value, Diligence gap]
    rows:
      - [Business shippers, "Business clients; buyer and payer roles are not separated", "SME10X reported 500 B2B customers in its 16 Mar 2021 interview", "Demand aggregation and freight booking", "No named accounts, contract terms, or active-customer definition"]
      - [Truck owners and operators, "Carrier-side suppliers; ownership and driver roles may differ", "SME10X reported a fleet of over 25,000 trucks; Arab News describes matching demand to available capacity", "Load access and transporter payment workflow", "Participating, available, and active trucks are not distinguished"]
      - [Enterprise client base, "Enterprise segment; actual buyer and payer are not specified", "DXBi reproduces a 1,200-plus enterprise-client figure in a May 2024 launch entry", "Potential access to larger shipper relationships", "Underlying account list, count date, and active status are not given"]
      - [Cross-border freight users, "Shippers and carriers across reported regional corridors", "Arab News described operations in eight countries; WAYA reported planned Poland and Kazakhstan expansion", "Network reach across regional trade lanes", "Country presence and expansion plans do not show local customer adoption"]
    notes: "Reported network and client counts use different vintages and definitions. Carrier counts are not shipper-customer counts; no row establishes active usage, contracted revenue, or retention."
    claimRefs: [CU002, CU004, CU005, CU008, CU010, CU011]
  - id: TU002
    title: Public adoption and network snapshots
    columns: [Metric, Reported value, Source timing, Source and confidence, Interpretation / missing denominator]
    rows:
      - [B2B customers, "500", "Article published 16 Mar 2021", "SME10X interview with TruKKer CFO; medium confidence", "B2B customer definition and active status not stated"]
      - [Truck network, "Over 25,000 trucks", "Article published 16 Mar 2021", "SME10X interview with TruKKer CFO; medium confidence", "Fleet availability and active utilization not stated"]
      - [Truck fleet, "35,000+ trucks", "Reuters report dated 8 Sep 2021", "Reuters; high-reputation reporting", "Company-reported network count; utilization and unique-truck basis not stated"]
      - [Truck network and footprint, "Over 40,000 trucks in eight countries", "Arab News article; publication date not shown in fetched text", "Arab News interview with TruKKer CFO; medium confidence", "Country presence and truck count are not an active-customer measure"]
      - [Enterprise client base, "1,200+ clients", "DXBi profile entry associated with an Omnilog launch dated 8 May 2024", "DXBi company profile; low confidence", "Profile does not show account definition, vintage of the count, or active status"]
      - [Truck usage headline, "75,000 trucks", "Company media page lists a story dated 18 Jul 2026", "TruKKer media index; company-controlled headline", "Underlying article was not in the assigned pool; headline is not independent verification"]
    notes: "These are source-attributed snapshots, not a reconciled time series. Customer counts, enterprise-client references, and truck-network counts have different units and undisclosed denominators; they must not be interpreted as active customers, retention, or utilization."
    claimRefs: [CU002, CU004, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment / use case, Production vs. pilot, Outcome, Limitation]
    rows:
      - ["No named shipper account identified in retained sources", "Not disclosed", "Public material describes aggregate marketplace activity, not an attributable shipper deployment", "Not established", "No customer-specific outcome is reported", "A partial review of assigned sources is not a full customer census; obtain referenceable contracts and customer interviews"]
    notes: "Partial evidence sample. The retained sources do not name a shipper account with a verifiable production deployment or outcome; this absence is a diligence gap, not proof that such customers do not exist."
    enumerationScope:
      coverage: partial
      basis: "Partial review of ten successful sources assigned to this chapter; this public evidence sample is not a complete customer census."
    claimRefs: [CU013, CU016]
figures:
