    title: Shipper-to-carrier journey described in public sources
    type: journey-map
    summary: "Public descriptions support the marketplace workflow through shipment execution; repeat use and customer outcomes remain unverified."
    data:
      items:
        - label: Freight demand
          detail: "Business clients submit freight demand; the sources do not specify the booking interface or customer eligibility."
          touchpoints: ["CFO-described client demand intake"]
        - label: Load and price
          detail: "Loads are presented for carrier capacity matching; public descriptions mention bidding and standardized pricing."
          touchpoints: ["Load listing", "Pricing"]
        - label: Carrier match
          detail: "The platform is described as matching shipper demand with available truck capacity."
          touchpoints: ["Truck-owner and operator network"]
        - label: Booking and tracking
          detail: "Sources describe booking and real-time shipment tracking, without reporting a customer-level service metric."
          touchpoints: ["Digital booking", "Shipment tracking"]
        - label: Transporter payment
          detail: "A 2021 interview said funding supported working capital for instant payment to transporters."
          touchpoints: ["Transporter settlement"]
        - label: Corridor expansion
          detail: "Reports describe regional operations and expansion plans; they do not establish repeat use or retention."
          touchpoints: ["Cross-border lanes", "Retention evidence not disclosed"]
    claimRefs: [CU005, CU006, CU007, CU008, CU010]
