  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-reliability
      missingEvidence: Current architecture and integration documentation, security certifications or control reports, service-level and outage history, incident records, and privacy/data-retention details.
      whyItMatters: The public materials describe a large freight workflow and app data collection but do not establish whether the platform's operational, security, or privacy controls scale reliably.
      diligencePath: Obtain current architecture and integration diagrams, independent security assessment and certification evidence, uptime and incident logs, data-flow/retention schedules, and customer references for production deployments.
      relatedQuestionRefs:
        - QE008
    - type: stale
      severity: material
      topic: omnilog
      missingEvidence: Current Omnilog operating status, supported routes, and live air/sea/land service coverage after the May 2024 launch reporting.
      whyItMatters: A historical launch report does not establish current availability, scale, or service quality for this product extension.
      diligencePath: Request current service catalogs, route-level shipment volumes, country permissions, and customer references for active Omnilog lanes.
    - type: private-evidence-only
      severity: minor
      topic: product-outcomes
      missingEvidence: Independently measured marketplace fill rates, quote-to-book conversion, on-time performance, carrier utilization, cost savings, and app engagement with definitions and denominators.
      whyItMatters: Qualitative efficiency statements cannot demonstrate that the platform improves outcomes relative to conventional freight workflows.
      diligencePath: Request cohort-level operational dashboards with metric definitions, periods, denominators, and reconciliation to customer and carrier records.
      relatedQuestionRefs:
        - QE005
        - QE006
