company:
  name: TruKKer
chapter:
  number: 5
  title: Product & Technology
  summary: Public materials describe TruKKer as a digital freight marketplace with a cloud-based control layer and a carrier app covering load discovery, bids, trip tracking, fleet administration, documents, and earnings. The platform's technical architecture, measured performance, security controls, and current status of announced extensions remain unverified.
sections:
  - id: product-workflows
    title: Product surface and user workflows
    body: >-
      TruKKer describes its core service as a digital freight ecosystem connecting shippers to trucking capacity; Gulf News similarly characterized the model as booking cargo space on trucks through the company's platform (CE001). The company reports a network of 75,000+ verified trucks across three continents, a company claim rather than an independently audited utilization or active-capacity measure (CE002). Its public description says the platform spans freight procurement, execution, tracking, documentation, and payments (CE003). The carrier-facing TruKKer Partner listing describes finding loads, bidding, tracking trips, managing drivers and vehicles, uploading documents, and viewing earnings (CE004). These artifacts indicate a workflow that joins shipper procurement to carrier execution, but they do not quantify shipper or carrier outcomes or show the baseline process being replaced.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
      - TE002
  - id: operating-architecture
    title: Operating model, architecture, and maturity
    body: >-
      The company's description calls its platform cloud-native and AI-enabled, and says that procurement, execution, tracking, documentation, and payments are unified in a control layer (CE003). This is a product-level description, not a technical architecture disclosure: the assigned materials do not identify cloud providers, system boundaries, APIs, data models, model use, or service-level targets. The mobile listing adds a concrete carrier workflow, including a real-time load board, smart bidding, live trip tracking, document upload, driver and fleet management, and earnings summaries (CE004). Apple's listing specifies iOS compatibility and carries a privacy disclosure that location, identifiers, usage data, and diagnostics may be collected but are not linked to the user's identity (CE005, CE006); this is a platform disclosure, not an independent privacy audit. The app listing also mentions interface and bid-visibility updates, but the fetched excerpt does not date a release sequence (CE011).
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE011
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: extensions-and-control-risks
    title: Product extensions, differentiation, and diligence limits
    body: >-
      TruKKer's public differentiation rests on aggregating trucking capacity and presenting an integrated digital workflow (CE001). The company describes a cloud-native, AI-enabled control layer and a mission to provide cost-efficient freight, but the assigned public product description and Gulf News account do not quantify savings, load utilization, or driver outcomes (CE010). Gulf News reported that the Omnilog forwarding business was live in the UAE, Saudi Arabia, and Turkey in May 2024, while the associated launch material described air, sea, and land services and wider trade-lane ambitions (CE007, CE013). A 2024 TruKKer–Dubai RTA announcement described a planned unified commercial-transport platform, not evidence of production deployment or realized service levels (CE008). A May 2026 article attributed financing uses to scaling the digital freight network and carrier ecosystem (CE009), but does not establish implementation progress. Current Omnilog coverage, live RTA deployment, performance, integrations, security certifications, incident history, and reliability metrics remain diligence items; a directory profile itself says it has no technology or web-presence data on file (CE012).
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE010
      - CE012
      - CE013
tables:
  - id: TE001
    title: Product and module map
    columns:
      - Product or module
      - User
      - Publicly stated status or maturity
      - Function described
      - Differentiation and diligence gap
    rows:
      - - Shipper freight marketplace
        - Enterprise shippers
        - Company describes an operating digital freight ecosystem
        - Connects shipper demand with trucking capacity and freight procurement
        - Active capacity, match rates, and service levels are not independently established
      - - TruKKer Partner app
        - Fleet owners, brokers, and individual truck operators
        - App listings describe an available mobile product
        - Load discovery, bids, trip tracking, fleet and driver administration, documents, and earnings
        - Adoption, usage frequency, and realized carrier economics are not disclosed
      - - Freight execution control layer
        - Shippers and carriers
        - Company describes a unified platform
        - Procurement, execution, tracking, documentation, and payments
        - Technical components, integrations, uptime, and control ownership are not documented
      - - Omnilog freight forwarding
        - Freight-forwarding customers
        - Reported live in UAE, Saudi Arabia, and Turkey in May 2024
        - Air, sea, and land freight, with broader trade-lane ambitions
        - Current route coverage, service performance, and operating status need confirmation
      - - Dubai RTA commercial-transport platform
        - B2B and B2C transport users and registered providers
        - 2024 partnership announcement described a platform initiative
        - Intended unified access to fleet service providers and vehicles
        - Announcement does not demonstrate deployment, transactions, or service outcomes
      - - Mobile privacy and device surface
        - TruKKer Partner app users
        - Apple listing includes compatibility and privacy disclosures
        - Listing says location, identifiers, usage data, and diagnostics may be collected
        - Verify permissions, retention, access controls, and actual data flows
    notes: >-
      Product status and capabilities are based on the cited company, app-store, and news materials; announcements and company claims are not proof of current deployment or measured performance. Omnilog status is dated to May 2024.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE013
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Publicly visible current workflow
      - TruKKer solution described
      - Measurable benefit in assigned sources
      - Limitation or diligence ask
    rows:
      - - Source road-freight capacity
        - Shipper seeks truck capacity for a shipment
        - Digital marketplace and freight-procurement service
        - No independent booking-time, fill-rate, or price comparison
        - Request route-level conversion, quote-to-book, and service data
      - - Find and bid on loads
        - Carrier or broker identifies available work
        - Partner app load board and bid workflow
        - App listing makes no quantified earnings or utilization comparison
        - Request bid acceptance, load availability, and repeat-use cohorts
      - - Execute and monitor a trip
        - Fleet operator assigns a vehicle and follows a shipment
        - App listing describes trip tracking and fleet/driver management
        - No independently measured on-time, exception, or tracking-uptime result
        - Request event definitions, exception rates, and service-level history
      - - Handle documents and settlement information
        - Carrier manages shipment paperwork and earnings information
        - App lists document upload and earnings/payout summaries; company describes payments in its platform
        - No evidence establishes payout timing, reconciliation accuracy, or payment completion
        - Reconcile app-level summaries to carrier statements and payment records
    notes: >-
      The table compares public descriptions, not independently observed customer workflows. No source in the assigned pool supplies a comparable before-and-after outcome, denominator, or time series.
    claimRefs:
      - CE001
      - CE003
      - CE004
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Publicly described role
      - Dependency visible from the workflow
      - Risk or diligence gap
    rows:
      - - Procurement and load discovery
        - Shipper freight procurement and carrier load board
        - Available carrier capacity and accurate shipment/load information
        - Matching logic, inventory freshness, and fill rates are not disclosed
      - - Bidding and fleet assignment
        - Smart bidding and management of drivers and vehicles in the app listing
        - Carrier participation, fleet records, and bid-response processes
        - Bid rules, acceptance rates, and identity/vehicle controls are not independently documented
      - - Trip execution and visibility
        - Company describes execution and tracking; app lists live trip tracking
        - Device location, connectivity, and timely carrier updates
        - Availability targets, outage history, escalation, and location-data controls are not supplied
      - - Documentation and payment information
        - Company describes documentation and payments; app lists document upload and earnings summaries
        - Accurate shipment records and reconciliation among parties
        - Data integrity, payment settlement controls, and dispute handling are not evidenced
    notes: >-
      This is a bounded operating-model reconstruction from public product descriptions, not a verified software architecture. Dependencies are diligence questions implied by the described workflow, not claims about confirmed failures.
    claimRefs:
      - CE003
      - CE004
      - CE006
