      - Diligence implication
    rows:
      - - TruKKer
        - "Company claims competitive per-shipment pricing; no amount, billing unit, or contract terms"
        - "Land-freight booking, tracking, and vendor onboarding are advertised"
        - "Request lane-level list and realized quotes, take rate, discounts, and service tiers"
      - - Aramex
        - No comparable quote, tariff, or contract schedule in assigned sources
        - "Domestic Express, Freight Forwarding, Logistics, and broader transport portfolio"
        - "Compare equivalent lane, load, handling, and service-level terms"
      - - Agility Logistics
        - Unknown in assigned sources
        - "Large-format and specialized cargo described by competitor-authored comparison"
        - "Obtain current quotes for a matched shipment profile"
      - - Al-Futtaim Logistics
        - Unknown in assigned sources
