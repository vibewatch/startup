  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-pricing
      missingEvidence: >-
        Matched lane-level price quotes, units, surcharges, discounts, contract duration,
        service levels, and realized rather than advertised rates for TruKKer and alternatives.
      whyItMatters: >-
        Without comparable pricing and contract terms, the report cannot determine whether
        claimed price competitiveness is durable differentiation or a margin trade-off.
      diligencePath: >-
        Request dated quotes and executed contract schedules for the same shipment lanes,
        load types, volumes, and service requirements from TruKKer and named alternatives.
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
        - TP002
        - TP003
    - type: private-evidence-only
      severity: material
      topic: switching-and-multihoming
      missingEvidence: >-
        Customer-level retention, churn, multi-homing, switching costs, exclusive carrier
        access, and renewal evidence by shipper segment and lane.
      whyItMatters: >-
        A marketplace that permits buyers to onboard their own vendors may improve flexibility
        but may not create durable buyer or carrier lock-in.
      diligencePath: >-
        Interview current and former shippers and carriers; reconcile cohort retention and
        multi-homing data to contracts and transaction records.
      relatedQuestionRefs:
        - QP006
    - type: enumeration-incomplete
      severity: material
      topic: competitor-profile-table
      missingEvidence: >-
        A neutral and current enumeration of direct GCC road-freight marketplaces, incumbents,
        specialized operators, and buyer-side substitutes with comparable profile data.
      whyItMatters: >-
        The only named peer comparison is competitor-authored and cannot establish coverage,
        relative scale, or the full set of alternatives available to shippers.
      diligencePath: >-
        Obtain a neutral buyer procurement set or independently sourced operator directory,
        then validate lane coverage, scale definitions, and service scope with customers.
      relatedQuestionRefs:
        - QP001
        - QP002
      relatedTableRefs:
        - TP001
    - type: stale
      severity: minor
      topic: current-competitor-scale
      missingEvidence: >-
        Current definitions and dated evidence for active customers, available trucks,
        fulfilled shipments, and competitor scale.
      whyItMatters: >-
        TruKKer's 2025 company-reported counts and peers' non-comparable disclosures do not
        establish current network liquidity or relative scale as of the report date.
      diligencePath: >-
        Request current active-vs-registered definitions and independently reconcile
        capacity, shipments, and customer counts for TruKKer and its principal competitors.
      relatedQuestionRefs:
        - QP003
    - type: private-evidence-only
      severity: material
      topic: fulfillment-and-network-quality
      missingEvidence: >-
        Matched delivery completion, on-time performance, claims, shipment visibility,
        carrier utilization, and driver payment outcomes across platforms.
      whyItMatters: >-
        Product descriptions do not show whether execution quality or network effects exceed
        incumbent and direct-procurement alternatives.
      diligencePath: >-
        Validate lane-level service records and customer references against dispatch,
        proof-of-delivery, claims, and carrier settlement data.
      relatedQuestionRefs:
        - QP002
        - QP004
        - QP008
