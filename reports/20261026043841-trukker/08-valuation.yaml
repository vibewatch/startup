company:
  name: TruKKer
chapter:
  number: 8
  title: Valuation
  summary: >-
    The available evidence confirms material debt financing and an earlier private
    valuation range, but neither establishes current equity value or investor returns.
    A research-more stance is warranted until audited unit economics, current
    capitalization and financing terms are available.
sections:
  - id: investment-call
    title: Price-sensitive investment call
    body: >-
      TruKKer’s own site describes a digital freight network connecting shippers and
      carriers, and the 2025 Ruya announcement documents a USD 15 million private-credit
      investment (CV002, CV001). Those are evidence of a continuing operating platform
      and access to financing, not proof of sustainable margins, free cash generation,
      or an attractive entry price. The available materials do not establish a current
      company valuation (CV013) or audited current revenue, gross margin, EBITDA, and
      cash flow (CV014). Dealroom’s USD 500 million–USD 1 billion valuation is explicitly
      last recorded in 2022, while its revenue range has no stated fiscal year in the
      retrieved profile (CV004, CV005). On this record, the call is research-more, with
      high risk and unknown valuation stance: a buy decision or numerical target return
      would imply precision the evidence does not support. The committee should revisit
      only after a current price, fully diluted capitalization, audited economics, and
      financing priority are documented (CV012, CV016).
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV012
      - CV013
      - CV014
      - CV016
    tableRefs:
      - TV001
  - id: financing-and-mark
    title: Financing is not a current equity mark
    body: >-
      The disclosed financing instruments need to remain separate. Ruya’s July 2025
      announcement describes USD 15 million of private credit, while InforCapital
      reports USD 189 million of equity across nine rounds and separately describes a
      USD 300 million ADCB receivables-securitisation facility in May 2026 (CV001, CV003,
      CV011). The latter is a facility amount, not a statement of equity proceeds or
      cash freely available to shareholders; neither the profile nor the announcement
      reports drawdown, collateral performance, pricing, covenants, or servicing losses.
      Wamda reports a USD 96 million Series B financing as a mix of equity and debt, and
      Jawlah reports a USD 23 million Series A (CV007, CV008). These dated funding
      disclosures help trace capital access but cannot be added indiscriminately to
      produce cash on hand, total equity value, or a return multiple. Dealroom’s
      historical valuation and revenue ranges are not contemporaneous, audited inputs
      for an entry multiple (CV004, CV005). Until current financing terms and the
      preference stack are obtained, the table’s “not supportable” valuation fields are
      intentional gaps, not zeroes.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV011
      - CV012
    tableRefs:
      - TV002
  - id: comparables-and-scenarios
    title: Benchmarks do not yet support scenario values
    body: >-
      The available reference set is too thin for a defensible private-company multiple.
      CompaniesMarketCap reports Freightos at USD 38.53 million market capitalization
      on 25 October 2026; this is a public-market equity value for a separate business,
      not a direct TruKKer valuation benchmark (CV009). The SEC-hosted C.H. Robinson
      index identifies a 2024 Form 10-K filing and period end, but the retained index
      page contains no operating or valuation multiples (CV010). Dealroom’s broad
      historical ranges are not a current transaction mark (CV004, CV005). DXBi marks
      TruKKer’s “Growth Score” as “Trending down,” but gives no methodology or
      measurement period; this is a weak adverse signal to investigate, not a quantified
      forecast (CV006). Consequently, bull, base, and bear cases can be framed by
      diligence conditions and downside triggers, but the assigned evidence cannot
      justify numeric valuation ranges or probability estimates (CV015, CV016). The
      logic figure makes that evidence-to-decision bridge explicit.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
      - CV015
      - CV016
    tableRefs:
      - TV003
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Evidence threshold or implication
    rows:
      - - Recommendation
        - Research-more
        - Reassess after audited economics and current financing terms are reviewed.
      - - Confidence
        - Medium-low
        - Financing is documented; current price, profitability, dilution, and priority are not.
      - - Risk rating
        - High
        - Working-capital exposure and return terms cannot be quantified from this evidence.
      - - Valuation stance
        - Unknown
        - The only company valuation range located is marked last recorded in 2022.
      - - Decision implication
        - Do not price a new investment yet
        - Require a fully diluted cap table, current mark, audited accounts, and facility documents.
    notes: >-
      Analyst judgment based on the cited retrieved sources; missing valuation or financial
      inputs are not zero and are not estimates.
    claimRefs:
      - CV001
      - CV004
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-supported view
      - What would change the view
    rows:
      - - Thesis
        - A digital freight platform has attracted institutional equity and debt financing.
        - Audited repeat-load economics and customer retention show durable contribution profit.
      - - Anti-thesis
        - Public evidence does not establish audited current profitability or cash conversion.
        - Audited financials and receivables-loss data demonstrate resilient margins and collections.
      - - Entry-price constraint
        - A private valuation range is available only as a Dealroom mark last recorded in 2022.
        - A current priced transaction or independent mark is reconciled to fully diluted shares.
      - - Capital-structure constraint
        - Funding announcements do not disclose investor seniority or new-money return rights.
        - Executed facility and cap-table documents establish priority, dilution, and downside protection.
    notes: >-
      The table separates documented financing and platform evidence from unresolved economics,
      price, and capital-structure inputs; evidence does not imply a current valuation.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Conditional bull, base, and bear cases
    columns:
      - Case or reference
      - Explicit condition or observed figure
      - Valuation range
      - Probability signal and decision trigger
    rows:
      - - Bull
        - Audited positive contribution economics, repeat enterprise demand, and manageable receivables losses are demonstrated.
        - Not supportable from assigned evidence
        - Unquantified; consider only after audited evidence and a current price are supplied.
      - - Base
        - Platform activity and financing access continue, but unit economics and the preference stack remain unverified.
        - Not supportable from assigned evidence
        - Research-more; require current price, capitalization, audited economics, and debt terms.
      - - Bear
        - Receivables losses, working-capital needs, or senior debt claims impair cash conversion or equity recovery.
        - Not supportable from assigned evidence
        - Downside is unquantified; pause if collections, covenant headroom, or seniority cannot be verified.
      - - Public references
        - Freightos market capitalization was USD 38.53 million on 25 October 2026; Dealroom’s TruKKer valuation range was last recorded in 2022.
        - Not a direct or current TruKKer range
        - Use as context only; do not infer a private-company multiple without comparable financials.
    notes: >-
      Scenarios are conditional diligence cases, not forecasts. No numerical ranges or probabilities
      are assigned because current audited operating inputs, price, comparable multiples, and
      capitalization data are absent from the assigned evidence.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
