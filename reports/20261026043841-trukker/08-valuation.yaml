        - from: debt
          to: economics
        - from: economics
          to: capitalization
        - from: capitalization
          to: scenarios
        - from: scenarios
          to: decision
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
callouts:
  - calloutType: recommendation
    title: Hold valuation judgment
    body: >-
      Do not anchor a new-money price to historical marks, funding totals, or facility
      size. Obtain current audited economics, fully diluted capitalization, and financing
      priority before setting an entry range.
    claimRefs:
      - CV004
      - CV011
      - CV012
      - CV013
      - CV014
  - calloutType: risk
    title: Receivables finance needs diligence
    body: >-
      The reported securitisation facility makes drawdown, collateral quality, losses,
      covenants, and servicing performance material diligence questions; the reported
      facility ceiling is not cash raised or cash available to equity.
    claimRefs:
      - CV011
      - CV012
