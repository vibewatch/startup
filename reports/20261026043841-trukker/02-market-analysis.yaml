      - - Business Focus
        - 2026 forecast; 2031 forecast; published 2026-03-03
        - GCC freight and logistics
        - USD 86.32B (2026); USD 116.14B (2031)
        - 6.12% (2026–2031)
        - Not stated in retrieved article
        - Low
        - Estimates differ from Mordor despite the same CAGR; no calculation or primary dataset is cited in the retrieved text.
      - - TruKKer company page
        - Publication/vintage not stated
        - GCC road freight
        - US$20B (company assertion)
        - Not stated
        - Not disclosed
        - Low
        - Undated company claim, with no definition or calculation; not a current independently verified market value, SAM or SOM.
    notes: >-
      Forecasts preserve each source's metric, geography, year and period.
      Estimates are not added or treated as nested: the two published total-market
      forecasts conflict, while the company road-freight assertion has unknown
      vintage and methodology.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
  - id: TM003
    title: Buyer, user, payer and adoption map
    columns:
      - segment
      - buyer
      - user
      - payer
      - workflow
      - budget owner
      - adoption trigger
    rows:
      - - Enterprise shippers
        - Logistics or freight procurement function (role to verify)
        - Shipping operations and dispatch teams
        - Shipper is the likely contracting party; payment terms are not public
        - Source truck capacity, arrange loads and track deliveries
        - Not disclosed
        - Visibility, capacity access and reduced coordination burden; impact not quantified
      - - Cross-border traders
        - Import/export logistics buyer (role to verify)
        - Freight operations and customs coordinators
        - Not disclosed
        - Coordinate land routes, border processes and delivery milestones
        - Not disclosed
        - Route resilience and continuity; corridor-specific economics are unknown
      - - Industrial and manufacturing shippers
        - Plant or supply-chain logistics buyer (role to verify)
        - Site logistics, freight and receiving teams
        - Not disclosed
        - Move industrial inputs or equipment via road and alternatives
        - Not disclosed
        - Continuity when normal routes are disrupted; the reported examples do not establish TruKKer usage
      - - Retail, food and e-commerce shippers
        - Retailer, marketplace or logistics provider (role to verify)
        - Fulfillment, inventory and delivery operations
        - Not disclosed
        - Replenishment, parcel or specialized freight movement
        - Not disclosed
        - Delivery visibility and specialized handling; segment spend is not isolated
      - - Truck owners and operators
        - Supply-side participant, not established as the shipper-side buyer
        - Owner-operators and carrier dispatchers
        - May receive freight payments; platform fees and payment terms are undisclosed
        - Find loads, allocate trucks and complete deliveries
        - Carrier economics and any platform fee payer are not disclosed
        - Better utilization or reduced idle time is company-claimed, not independently measured here
    notes: >-
      Buyer roles are analytical hypotheses from the documented workflows, not
      verified organization charts or contract terms. Bloomberg's corridor
      examples evidence market activity but do not identify TruKKer customers.
    claimRefs:
