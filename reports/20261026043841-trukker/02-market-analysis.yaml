figures:
  - id: FM001
    title: Evidence-constrained market sizing layers
    type: pyramid
    summary: >-
      Public evidence narrows from broad GCC logistics forecasts to an unquantified
      company-serviceable road-freight market and obtainable share.
    data:
      items:
        - label: GCC freight and logistics
          displayValue: USD 89.32B (2026 forecast)
          detail: >-
            Mordor Intelligence's broad all-function, all-mode market estimate;
            not TruKKer's addressable market.
        - label: GCC road freight
          displayValue: US$20B (undated company estimate)
          detail: >-
            TruKKer's company page does not disclose the calculation or vintage.
        - label: Road-freight transport service
          displayValue: No independent segment value
          detail: >-
            The market definition includes domestic and cross-border trucking,
            FTL and LTL, and multiple cargo and haul types.
        - label: Digital truck-matching spend
          displayValue: Not quantified
          detail: >-
            Public sources describe load matching but not the digitally
            intermediated share of road-freight spend.
        - label: TruKKer serviceable corridors and buyers
          displayValue: Not quantified
          detail: >-
            Reported network reach is not a paying-customer or corridor-spend
            denominator.
        - label: TruKKer obtainable share (SOM)
          displayValue: Not supported
          detail: >-
            Public evidence does not disclose platform spend, penetration,
            pricing or repeat usage.
    approximationNotes: >-
      Layer order is conceptual, not magnitude. Mordor's 2026 estimate covers
      broad freight and logistics; TruKKer's US$20B road-freight assertion is
      undated and method-free. Business Focus reports different broad-market
      forecasts. No comparable TAM, SAM or SOM is established.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM011
