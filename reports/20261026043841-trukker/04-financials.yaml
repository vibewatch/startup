company:
  name: TruKKer
chapter:
  number: 4
  title: Financials
  summary: Public evidence describes TruKKer as a transaction-led freight platform and reports a receivables securitisation facility of up to US$300 million, but it does not establish realized revenue, margin, cash runway, or facility availability. The financial case therefore remains conditional on audited operating and receivables data.
sections:
  - id: revenue-model
    title: Revenue model and pricing visibility
    body: >-
      TruKKer’s current website describes a digital freight platform connecting shipper demand with carrier capacity; it presents land freight, cross-border service, and connected land, air, and sea offerings, but not audited revenue segments. The page says incoming requests become RFQs, verified vendors receive bid opportunities, and shipments are tracked. Dealroom characterizes the model as transaction-based and says it likely earns a commission or fee per booked load; that is an external estimate, not disclosed contract economics. The company advertises competitive pricing and a guaranteed 48-hour payment workflow but publishes no rate card, take rate, discounts, realized prices, or settlement distribution. Dealroom’s “instant” carrier-payment description is not measured and is not necessarily inconsistent with an up-to-48-hour workflow. The public evidence therefore supports a marketplace model, not an underwritten revenue-recognition policy or unit margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Traction and underwriting inputs
    body: >-
      Dealroom displays a US$100–500 million revenue range under “Latest reported FY,” without identifying the fiscal year, the underlying accounting measure, or whether the range represents recognized revenue rather than gross transaction value. DXBi displays US$189 million in total funding, while Dealroom separately shows a US$100–500 million range for disclosed equity funding; neither excerpt defines an as-of date or aligned scope, so the figures cannot be reconciled or treated as cash available. A Dubai Cargos article reports market-wide truck-rate increases during the May 2026 Hormuz crisis, but provides no method or sample and does not identify TruKKer’s realized prices. None of the assigned source pages quantifies gross margin, contribution per load, CAC or payback, customer acquisition, service costs, burn, or cash runway; official claims of cost or empty-mile efficiency are not measured. Margin and sales efficiency therefore remain un-underwritable, and nulls in the unit-economics table mean unavailable rather than zero.
    claimRefs: [CI006, CI007, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-and-working-capital
    title: Capital adequacy and working-capital risk
    body: >-
      TruKKer announced an inaugural trade-receivables securitisation facility of up to US$300 million; Paul Hastings, identified as transaction counsel, also describes the facility and its multi-jurisdictional structure. The company announcement says the portfolios of trade receivables across operating markets back the facility, names ADCB as sole arranger and lender, and describes non-recourse financing using Murabaha structures in the UAE and Saudi Arabia alongside conventional financing in Turkey. These sources establish an announced financing facility, not a US$300 million draw, remaining availability, or cash on hand. They do not provide drawn balances, tenor, pricing, advance rates, covenants, arrears, or servicing performance. A separate advocacy page alleges delayed driver payments and coercive terms, but its retrieved text supplies no named cases or transaction records; this is a diligence lead, not proof of company-wide payment failure. Underwriting requires audited statements, executed facility documents and utilization, receivables aging and loss data, and carrier settlement records before concluding that the financing improves runway or that payment performance is sound.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI016]
tables:
  - id: TI001
    title: Revenue streams and mechanisms
    columns: [Stream, Mechanism evidenced, Unit, Current value or status, Evidence quality, Diligence ask]
    rows:
      - ["Freight procurement marketplace", "Shippers submit requests and carriers bid for loads; Dealroom suggests a per-load commission or fee", "Shipment or load; financial unit not disclosed", "Revenue split and take rate undisclosed", "Dealroom labels the fee mechanism as likely; no company contract or ledger is supplied", "Obtain booked-load contracts, gross-to-net bridge, and revenue-recognition policy."]
      - ["Cross-border land freight", "Company lists domestic and cross-border freight", "Shipment or route; no unit definition disclosed", "No revenue mix or corridor economics disclosed", "Company product description only", "Obtain shipments and net revenue by corridor, service type, and customer."]
      - ["Multimodal freight", "Company lists movement across land, air, and sea", "Shipment or mode; no unit definition disclosed", "No forwarding revenue or margin disclosed", "Company product description only", "Separate forwarding revenue from marketplace commissions and any pass-through freight."]
      - ["Relocation and moving services", "Company lists a home-moving service", "Move or job; no unit definition disclosed", "No pricing or revenue contribution disclosed", "Company product description only", "Obtain service-level volumes, realized prices, and delivery costs."]
    notes: >-
      Service lines are drawn from the company website; the only explicit fee mechanism is Dealroom’s qualified estimate. No row represents a verified revenue segment or mix, and operational units are not financial units.
    claimRefs: [CI001, CI002, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing unit or term, Published/list evidence, Realized price or discount, Evidence quality, Diligence ask]
    rows:
      - ["Shipper price per load or route", "Website advertises competitive pricing", "No numeric rate card, discounts, or realized price disclosed", "Company marketing statement, not contracted or realized pricing", "Obtain tariffs, invoices, and realized prices by route and load type."]
      - ["Platform take rate or fee", "Dealroom says a commission or fee per booked load is likely", "No rate or fee schedule disclosed", "Third-party hypothesis, not confirmed by company terms", "Verify contract language and gross-versus-net revenue treatment."]
      - ["Carrier settlement timing", "Website says a guaranteed 48-hour workflow; Dealroom describes instant payment", "No observed timing distribution or contract term disclosed", "Different descriptions are not independently measured", "Reconcile contractual terms to carrier-level settlement records."]
      - ["Market freight-rate movement", "Dubai Cargos reports regional truck-rate increases during the May 2026 crisis", "15–25% reported for market routes; not a TruKKer price series", "Low-reputation commercial site; no sample or method provided", "Obtain company-specific price and carrier-payout time series; do not use this as a company benchmark."]
    notes: >-
      No company price list or realized transactions were present in the assigned text. Unavailable values are not zero; the market-rate report is not company pricing, and payment descriptions are not audited performance data.
    claimRefs: [CI003, CI004, CI005, CI007]
  - id: TI003
    title: Unit economics and financing inputs
    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Revenue", "Dealroom range: US$100–500 million; “Latest reported FY” with no year or accounting basis", "Low", "Cannot distinguish recognized revenue from gross transaction value or infer current performance.", "Obtain audited revenue by year and reconcile recognized revenue with GMV and pass-through freight."]
      - ["ARR", null, "Low", "No recurring subscription basis is evidenced; ARR should not be inferred from freight revenue.", "Request a company-defined recurring-revenue schedule only if subscription revenue exists."]
      - ["Gross margin", null, "Low", "A margin path cannot be assessed without carrier payouts and pass-through costs.", "Obtain gross margin by service and corridor, with a reconciliation to accounting records."]
      - ["Contribution per load", null, "Low", "Load-level economics determine whether growth produces positive contribution.", "Obtain booked and completed loads, realized take, incentives, claims, and variable fulfillment costs."]
      - ["CAC and payback", null, "Low", "No spend, conversion, or sales-cycle data supports an efficiency calculation.", "Obtain acquisition spend, cohort conversions, sales cycle, and gross-profit payback by channel."]
      - ["Cash, burn, and runway", null, "Low", "The facility announcement and funding databases do not establish unrestricted liquidity.", "Obtain current cash, monthly operating cash flow, debt service, and a reconciled runway calculation."]
      - ["Receivables quality and facility utilization", "Facility announced at up to US$300 million; draw amount and receivables performance not disclosed", "Low", "Facility capacity may depend on eligible receivables and collections; available size is not cash on hand.", "Obtain aging, dilution/default losses, eligibility rules, advance rates, covenants, and current utilization."]
      - ["Funding database totals", "DXBi: US$189 million total funding; Dealroom: US$100–500 million disclosed equity funding", "Low", "Definitions and as-of dates are not aligned; neither figure establishes cash available.", "Reconcile equity, debt, securitisation, and other financing to a dated cap-table and cash ledger."]
    notes: >-
      Dealroom’s revenue range has no identified fiscal year and is not ARR or audited revenue. Null means no supported amount in the assigned material. Funding database scopes are unclear; the facility headline is a maximum announced size, not cash available or cash raised.
    claimRefs: [CI006, CI008, CI009, CI011, CI012, CI014, CI015]
figures:
  - id: FI001
    title: "Freight activity to monetization: evidence and gaps"
    type: flow
    summary: Company materials describe a freight workflow and Dealroom estimates a possible fee mechanism, but the public record does not quantify recognized revenue or gross profit.
    data:
      nodes:
        - id: shipper-request
          label: Shipper submits a freight request
          detail: Company describes requests through messaging, calls, email, voice notes, or dashboard.
        - id: rfq
          label: Request is structured into an RFQ
          detail: The company says its system structures incoming requests.
        - id: carrier-bids
          label: Verified carriers bid
          detail: Company describes load opportunities sent to vendors for bidding.
        - id: capacity-match
          label: Demand is matched with carrier capacity
          detail: The company describes matching shipper requests with verified vendors.
        - id: shipment
          label: Shipment is tracked and delivered
          detail: Company describes real-time shipment updates.
        - id: fee-hypothesis
          label: Possible per-load fee or commission
          detail: Dealroom describes a commission or fee as likely; the company does not disclose a rate or contract term.
        - id: recognized-economics
          label: Recognized revenue and gross profit
          detail: The assigned sources do not establish the principal-versus-agent accounting basis, take rate, or gross margin.
    claimRefs: [CI002, CI003, CI004]
callouts:
  - calloutType: risk
    title: Facility size is not a runway measure
    body: The announced amount is “up to” US$300 million and is backed by receivables; absent utilization, cash, burn, maturity, and loss data, it cannot be treated as cash on hand or proof of adequate runway.
    claimRefs: [CI008, CI009, CI012]
