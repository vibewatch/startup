      severity: material
      topic: receivables-facility
      missingEvidence: Current facility utilization, drawn balance, availability, tenor, pricing, covenants, receivable eligibility, aging, dilution, defaults, and servicing performance.
      whyItMatters: A facility backed by receivables is not equivalent to equity or unrestricted cash and may depend on the quality and collection of those assets.
      diligencePath: Review executed facility documents, borrowing-base certificates, covenant reports, servicing data, and receivables aging reconciled to audited statements.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Contracted shipper tariffs, realized prices and discounts, carrier payout terms, platform fee schedules, and payment timing by customer and corridor.
      whyItMatters: Pricing and settlement determine take rate, cash-conversion timing, and exposure to carrier-payment disputes.
      diligencePath: Sample executed shipper and carrier contracts, invoices, payout records, and load-level unit economics across representative corridors.
      relatedQuestionRefs: [QI002]
