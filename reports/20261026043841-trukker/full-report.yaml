      - number: '6.3'
        title: Customer proof, durability, and exposure
        blocks:
          - type: paragraph
            body: >-
              The evidence is materially stronger on network scale and product description than on customer-level proof.
              Reuters reported TruKKer's acquisition of TruckSher in Pakistan, and the company's media page also lists
              the transaction, but neither source identifies a shipper account or its deployment status (CU003, CU013).
              The retained public texts do not supply a named customer reference, production-versus-pilot
              classification, quantified customer outcome, renewal cohort, churn rate, NRR, or concentration schedule
              (CU013, CU014, CU015, CU016). A Dubai Cargos article highlights truck and driver availability constraints
              and argues that road freight cannot replace sea capacity; it is a low-reputation market commentary, not
              evidence of a TruKKer-specific failure (CU012). No reported incident in this sample would not prove that
              none occurred. The table therefore records the evidence boundary rather than presenting logos, funding
              counterparties, or carrier counts as named customer deployments.
            claimRefs:
              - CU003
              - CU012
