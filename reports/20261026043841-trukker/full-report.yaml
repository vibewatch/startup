      - number: '6.2'
        title: Adoption signals and service workflow
        blocks:
          - type: paragraph
            body: >-
              The public adoption trail consists of snapshots: a 2021 interview gave B2B-customer and truck counts,
              Reuters later reported a 35,000-plus truck fleet, and another profile described more than 40,000 trucks
              across eight countries (CU002, CU004). A company media page lists a July 2026 story headline claiming
              75,000 trucks use the platform, while DXBi reproduces a 1,200-plus enterprise-client figure with no
              current-account definition (CU009, CU011). These are publisher- or company-reported snapshots with
              different dates and denominators, not an independently verified growth curve or active-use series.
              Descriptions of the workflow include matching shipper demand to truck capacity, booking and tracking
              loads, and paying transporters; the cited CFO interview describes a per-trip spread between vendor cost
              and client invoice (CU005, CU006, CU007, CU010). Expansion announcements and a large network do not
              establish repeat usage or delivery outcomes (CU008, CU014, CU016).
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
