  - id: FM001
    title: Evidence-constrained market sizing layers
    type: pyramid
    summary: >-
      Public evidence narrows from broad GCC logistics forecasts to an unquantified company-serviceable road-freight
      market and obtainable share.
    data:
      items:
        - label: GCC freight and logistics
          displayValue: USD 89.32B (2026 forecast)
          detail: Mordor Intelligence's broad all-function, all-mode market estimate; not TruKKer's addressable market.
        - label: GCC road freight
          displayValue: US$20B (undated company estimate)
          detail: TruKKer's company page does not disclose the calculation or vintage.
        - label: Road-freight transport service
          displayValue: No independent segment value
          detail: >-
            The market definition includes domestic and cross-border trucking, FTL and LTL, and multiple cargo and haul
            types.
        - label: Digital truck-matching spend
          displayValue: Not quantified
          detail: Public sources describe load matching but not the digitally intermediated share of road-freight spend.
        - label: TruKKer serviceable corridors and buyers
          displayValue: Not quantified
          detail: Reported network reach is not a paying-customer or corridor-spend denominator.
        - label: TruKKer obtainable share (SOM)
          displayValue: Not supported
          detail: Public evidence does not disclose platform spend, penetration, pricing or repeat usage.
    approximationNotes: >-
      Layer order is conceptual, not magnitude. Mordor's 2026 estimate covers broad freight and logistics; TruKKer's
      US$20B road-freight assertion is undated and method-free. Business Focus reports different broad-market forecasts.
      No comparable TAM, SAM or SOM is established.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM011
  - id: FP001
    title: Evidence-based competitive landscape map
    type: quadrant
    summary: >-
      Ordinal placement reflects only how directly and specifically the assigned sources describe each alternative, not
      market share, execution quality, or a verified ranking.
    approximationNotes: >-
      Ordinal 1–3 coding: x measures explicit fit to the GCC road-freight buyer job; y measures specificity and
      cross-source breadth in this assigned evidence set. Each point's detail records the rationale. These are
      evidence-coverage codes, not capability scores or benchmark thresholds.
    claimRefs:
      - CP001
      - CP002
      - CP007
      - CP011
      - CP015
    data:
      xAxis:
        label: Evidence of fit to GCC road-freight buyer job
        min: 1
        max: 3
        low: Adjacent or unclear
        high: Explicit direct fit
        description: Ordinal source coding; it does not measure market share or performance.
        scale: ordinal
      yAxis:
        label: Specificity and breadth of assigned public evidence
        min: 1
        max: 3
        low: Name or single brief description
        high: Multiple detailed source descriptions
        description: Issuer and relationship are considered; source count does not prove capability.
        scale: ordinal
      points:
        - label: TruKKer
          x: 3
          'y': 3
          detail: >-
            Direct land-freight positioning appears across company surfaces and profiles; sources remain mostly
            company-issued.
          claimRefs:
            - CP001
            - CP002
            - CP014
        - label: Aramex
          x: 3
          'y': 3
          detail: Company results describe freight/logistics and independent award coverage names it a 3PL/4PL winner.
          claimRefs:
            - CP008
            - CP009
            - CP011
        - label: Agility Logistics
          x: 3
          'y': 1
          detail: >-
            A competitor-authored comparison places it in GCC land freight and describes specialized cargo; no second
            detailed source.
          claimRefs:
            - CP007
        - label: Al-Futtaim Logistics
          x: 3
          'y': 1
          detail: A competitor-authored comparison gives UAE domestic/GCC focus only.
          claimRefs:
            - CP007
        - label: Specialist Saudi-UAE operators
          x: 3
          'y': 1
          detail: The source names an operator category but no firms or capabilities.
          claimRefs:
            - CP007
        - label: Sary / SILQ
          x: 1
          'y': 1
          detail: The source describes B2B commerce and fintech adjacency, not direct road-freight service.
          claimRefs:
            - CP012
        - label: Shipper-managed vendors
          x: 2
          'y': 1
          detail: TruKKer advertises vendor onboarding; assigned sources do not establish internal-build prevalence.
          claimRefs:
            - CP015
  - id: FI001
    title: 'Freight activity to monetization: evidence and gaps'
    type: flow
    summary: >-
      Company materials describe a freight workflow and Dealroom estimates a possible fee mechanism, but the public
      record does not quantify recognized revenue or gross profit.
    data:
      nodes:
        - id: shipper-request
          label: Shipper submits a freight request
          detail: Company describes requests through messaging, calls, email, voice notes, or dashboard.
        - id: rfq
          label: Request is structured into an RFQ
          detail: The company says its system structures incoming requests.
        - id: carrier-bids
          label: Verified carriers bid
          detail: Company describes load opportunities sent to vendors for bidding.
        - id: capacity-match
          label: Demand is matched with carrier capacity
          detail: The company describes matching shipper requests with verified vendors.
        - id: shipment
          label: Shipment is tracked and delivered
          detail: Company describes real-time shipment updates.
        - id: fee-hypothesis
          label: Possible per-load fee or commission
          detail: Dealroom describes a commission or fee as likely; the company does not disclose a rate or contract term.
        - id: recognized-economics
          label: Recognized revenue and gross profit
          detail: >-
            The assigned sources do not establish the principal-versus-agent accounting basis, take rate, or gross
            margin.
    claimRefs:
      - CI002
      - CI003
      - CI004
  - id: FE001
    title: Publicly described freight-platform layers
    type: stack
    summary: >-
      Company and app-store materials describe an operating sequence from procurement through execution and supporting
      records, while leaving technical implementation unspecified.
    data:
      layers:
        - name: Procurement
          label: Shipper freight procurement
          detail: Company materials describe a digital marketplace for shipper freight procurement.
        - name: Carrier access
          label: Carrier load board and bidding
          detail: The TruKKer Partner listing describes load discovery and bid workflows.
        - name: Fleet administration
          label: Driver and vehicle management
          detail: The carrier app listing describes fleet and driver administration.
        - name: Execution and visibility
          label: Trip execution and live tracking
          detail: Company and app materials describe execution and trip tracking.
        - name: Documentation
          label: Shipment document upload
          detail: The carrier app listing describes uploading and managing documents.
        - name: Payment information
          label: Payments and earnings summaries
          detail: Company materials describe payments; the app listing describes earnings summaries.
    claimRefs:
      - CE003
      - CE004
  - id: FU001
    title: Shipper-to-carrier journey described in public sources
    type: journey-map
    summary: >-
      Public descriptions support the marketplace workflow through shipment execution; repeat use and customer outcomes
      remain unverified.
    data:
      items:
        - label: Freight demand
          detail: >-
            Business clients submit freight demand; the sources do not specify the booking interface or customer
            eligibility.
          touchpoints:
            - CFO-described client demand intake
        - label: Load and price
          detail: >-
            Loads are presented for carrier capacity matching; public descriptions mention bidding and standardized
            pricing.
          touchpoints:
            - Load listing
            - Pricing
        - label: Carrier match
          detail: The platform is described as matching shipper demand with available truck capacity.
          touchpoints:
            - Truck-owner and operator network
        - label: Booking and tracking
          detail: Sources describe booking and real-time shipment tracking, without reporting a customer-level service metric.
          touchpoints:
            - Digital booking
            - Shipment tracking
        - label: Transporter payment
          detail: A 2021 interview said funding supported working capital for instant payment to transporters.
          touchpoints:
            - Transporter settlement
        - label: Corridor expansion
          detail: Reports describe regional operations and expansion plans; they do not establish repeat use or retention.
          touchpoints:
            - Cross-border lanes
            - Retention evidence not disclosed
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
