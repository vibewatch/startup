  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to cross-border operating rules as a concrete, rather than hypothetical,
              constraint: AGBI reports that restrictions on trucks carrying cargo across national borders remain in
              place and that TruKKer has worked with authorities to relax them. The National's 2021 report documents the
              company's TruckSher acquisition in Pakistan but says the deal value was not disclosed; neither source
              supplies an up-to-date route-by-route permit or integration record. Saudi Arabia's transport ministry
              lists road safety, sustainable mobility, and smart transport among sector objectives, not company-specific
              licensing requirements. The register is therefore partial: it ranks documented friction and compliance
              unknowns, not confirmed violations or litigation. Before entering or scaling a lane, verify carrier
              eligibility, insurance, customs documentation, and local operating permissions for each jurisdiction.
            claimRefs:
              - CR006
              - CR007
              - CR004
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR016
      - number: '7.2'
        title: Operational capacity and technology execution
        blocks:
          - type: paragraph
            body: >-
              The most immediate operating exposure in the retrieved reporting is a truck-and-driver shortage that AGBI
              says the 2026 disruption exacerbated. The same report describes rerouted loads taking longer and
              converting short-haul work into longer journeys, which can reduce usable daily truck capacity; it does not
              report TruKKer's own fill rate, on-time performance, or customer SLA breaches. For electric freight,
              TruKKer's ATOMIX feasibility report itself identifies charging availability as a potential bottleneck and
              proposes charging-provider partnerships and route optimization. Those are stated plans, not independently
              verified scaled mitigations. The matrix distinguishes these observed constraints from cyber and
              incident-history questions for which this source pool supplies no assurance artifacts.
            claimRefs:
              - CR005
              - CR003
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Partner, customer, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating model depends on third-party truck owners and on matching loads to qualified supply; AGBI
              describes reverse-auction pricing and reports a broad customer base, but no customer concentration or
              renewal data. Funding announcements also need careful interpretation. DXBi attributes a $300 million
              cross-border securitisation facility to a CEO interview, while a Ruya Partners release hosted by Wamda
              reports a $15 million private-credit investment. Neither figure establishes how much is drawn,
              unrestricted, available as corporate cash, or supported by performing receivables. Dealroom displays broad
              revenue and valuation ranges, with its valuation last recorded in 2022, rather than current audited
              accounts. Underwriting should therefore focus on receivables quality, covenants, servicing, counterparty
              concentration, and actual liquidity rather than headline financing amounts.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              Risk ratings below are directional because the assigned sources do not quantify incident frequencies,
              fulfillment baselines, or loss rates. Treat a lane as unready if current permits, insurance, or
              qualified-carrier capacity cannot be evidenced; escalate if realized fill and on-time delivery fall below
              the relevant customer contract or if route length pushes costs beyond the contracted economics. For
              financing, require current receivables aging, realized loss and dilution data, facility draw and covenant
              headroom, and servicing performance before treating a securitisation ceiling as usable capital. For
              technology and safety, request independent security testing, incident and recovery logs, carrier
              verification procedures, and vehicle/route charging validation. A confirmed material breach, repeat
              failure against contracted service levels, or inability to document legal eligibility should trigger a
              pause and explicit re-underwriting, not an assumption that no public report means no event.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity is the most directly evidenced near-term operating constraint
            body: >-
              AGBI reports a regional truck-and-driver shortage worsened by disruption and describes longer rerouted
              journeys; TruKKer's own fill rate and SLA performance remain unverified.
            calloutType: risk
            claimRefs:
              - CR005
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive investment call
        blocks:
          - type: paragraph
            body: >-
              TruKKer’s own site describes a digital freight network connecting shippers and carriers, and the 2025 Ruya
              announcement documents a USD 15 million private-credit investment (CV002, CV001). Those are evidence of a
              continuing operating platform and access to financing, not proof of sustainable margins, free cash
              generation, or an attractive entry price. The available materials do not establish a current company
              valuation (CV013) or audited current revenue, gross margin, EBITDA, and cash flow (CV014). Dealroom’s USD
              500 million–USD 1 billion valuation is explicitly last recorded in 2022, while its revenue range has no
              stated fiscal year in the retrieved profile (CV004, CV005). On this record, the call is research-more,
              with high risk and unknown valuation stance: a buy decision or numerical target return would imply
              precision the evidence does not support. The committee should revisit only after a current price, fully
              diluted capitalization, audited economics, and financing priority are documented (CV012, CV016).
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing is not a current equity mark
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing instruments need to remain separate. Ruya’s July 2025 announcement describes USD
              15 million of private credit, while InforCapital reports USD 189 million of equity across nine rounds and
              separately describes a USD 300 million ADCB receivables-securitisation facility in May 2026 (CV001, CV003,
              CV011). The latter is a facility amount, not a statement of equity proceeds or cash freely available to
              shareholders; neither the profile nor the announcement reports drawdown, collateral performance, pricing,
              covenants, or servicing losses. Wamda reports a USD 96 million Series B financing as a mix of equity and
              debt, and Jawlah reports a USD 23 million Series A (CV007, CV008). These dated funding disclosures help
              trace capital access but cannot be added indiscriminately to produce cash on hand, total equity value, or
              a return multiple. Dealroom’s historical valuation and revenue ranges are not contemporaneous, audited
              inputs for an entry multiple (CV004, CV005). Until current financing terms and the preference stack are
              obtained, the table’s “not supportable” valuation fields are intentional gaps, not zeroes.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Benchmarks do not yet support scenario values
        blocks:
          - type: paragraph
            body: >-
              The available reference set is too thin for a defensible private-company multiple. CompaniesMarketCap
              reports Freightos at USD 38.53 million market capitalization on 25 October 2026; this is a public-market
              equity value for a separate business, not a direct TruKKer valuation benchmark (CV009). The SEC-hosted
              C.H. Robinson index identifies a 2024 Form 10-K filing and period end, but the retained index page
              contains no operating or valuation multiples (CV010). Dealroom’s broad historical ranges are not a current
              transaction mark (CV004, CV005). DXBi marks TruKKer’s “Growth Score” as “Trending down,” but gives no
              methodology or measurement period; this is a weak adverse signal to investigate, not a quantified forecast
              (CV006). Consequently, bull, base, and bear cases can be framed by diligence conditions and downside
              triggers, but the assigned evidence cannot justify numeric valuation ranges or probability estimates
              (CV015, CV016). The logic figure makes that evidence-to-decision bridge explicit.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hold valuation judgment
            body: >-
              Do not anchor a new-money price to historical marks, funding totals, or facility size. Obtain current
              audited economics, fully diluted capitalization, and financing priority before setting an entry range.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
          - type: callout
            title: Receivables finance needs diligence
            body: >-
              The reported securitisation facility makes drawdown, collateral quality, losses, covenants, and servicing
              performance material diligence questions; the reported facility ceiling is not cash raised or cash
              available to equity.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
