      - [Funding raised, "Profiles report $150M+ (Emirates Startups), $189M total funding (DXBi), and $100M–$500M disclosed equity funding (Dealroom).", "Undated and differently scoped", low, "Reconcile equity proceeds, debt, secondary sales, and dates against filings and the cap table."]
      - [Debt or credit, "Company announcement describes up to $300M of receivables securitisation arranged and funded by ADCB.", "May 2026 announcement", high, "Verify utilization, recourse, covenants, eligible receivables, and cash actually available."]
      - [Employees and customers, "Profiles give 201–500 employees (DXBi), 500–1,000 team (Dealroom), and 900+ employees (Emirates Startups); AGBI reports more than 1,200 corporations while DXBi cites a 1,200+ enterprise-client base.", "Undated or historical profile snapshots; AGBI May 2026", low, "Request dated active-employee and active-customer definitions and concentration data."]
    notes: >-
      Profiled values are attributed to their publishers and are not audited or
      normalized. “Up to” facility size is not drawn equity or unrestricted
      cash; missing current values are diligence gaps, not zeroes.
    claimRefs: [CO008, CO009, CO014, CO015, CO016]
