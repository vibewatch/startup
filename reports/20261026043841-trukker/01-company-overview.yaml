      - [Abu Dhabi Commercial Bank, "Sole arranger and lender for the announced securitisation facility.", "Debt provider against trade-receivable portfolios; utilization and recourse details matter.", "Review facility agreement, collateral eligibility, covenants, and servicing performance."]
      - [Gaurav Biswas, "Founder and CEO; public spokesperson on operations and financing.", "Executive leadership and potential key-person exposure; decision rights are unknown.", "Review delegated authority, succession, incentives, and board oversight."]
      - [TruKKer operating entities, "Originator of receivables and operator of the freight network described in the facility announcement.", "Receivables quality and cross-jurisdiction operations underpin the financing.", "Map legal obligors, receivables aging, collections, and intercompany guarantees."]
    notes: >-
      The map records only roles explicitly reported in the assigned sources;
      it does not imply current ownership percentages or board control.
    enumerationScope:
      coverage: partial
      basis: "Selected named investors and counterparties appearing in the assigned funding and facility evidence."
    claimRefs: [CO011, CO013, CO014, CO015]

