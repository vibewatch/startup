    - type: conflicting-data
      severity: material
      topic: company-identity
      missingEvidence: "Authoritative incorporation, founding, and headquarters records that reconcile the 2015–2017 founding dates and Dubai/Riyadh headquarters descriptions."
      whyItMatters: "Identity and legal domicile determine which entity owns contracts, assets, licenses, and the financing obligations."
      diligencePath: "Obtain current commercial-register extracts, group structure, registered-office details, and a management-confirmed headquarters statement."
      relatedQuestionRefs: [QO001]
    - type: private-evidence-only
      severity: material
      topic: leadership-governance
      missingEvidence: "Current executive and board roster, decision rights, succession arrangements, and key-person coverage."
      whyItMatters: "Public sources identify founders and the CEO but do not establish governance quality, functional coverage, or succession risk."
      diligencePath: "Request the current organization chart, board composition and minutes, delegation matrix, and succession plans."
      relatedQuestionRefs: [QO003, QO009]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: company-scale
      missingEvidence: "Dated, consistently defined current valuation, audited revenue, ARR, employee count, active customers, and cumulative equity proceeds."
      whyItMatters: "Published profiles use different vintages and definitions; stale or incomparable values cannot support a current company-scale or investment judgment."
      diligencePath: "Reconcile audited statements, monthly operating dashboards, active-customer definitions, employee roster, cap table, and latest priced-round documentation."
      relatedQuestionRefs: [QO007, QO010]
    - type: private-evidence-only
      severity: material
      topic: securitisation
      missingEvidence: "Facility utilization, recourse and covenant terms, receivables aging and loss rates, and servicing performance."
      whyItMatters: "An announced facility ceiling is not equivalent to cash drawn or available and may create material collateral and liquidity dependencies."
      diligencePath: "Review executed facility documents, borrowing-base certificates, collections history, arrears, covenant headroom, and trustee reports."
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: minor
      topic: milestones
