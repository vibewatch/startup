      - [Valuation, "Dealroom reports $500M–$1B, marked last recorded in 2022.", "2022 last-recorded date", low, "No current valuation is established; obtain latest priced-round and preference-stack data."]
      - [Revenue, "Dealroom reports $100M–$500M for its latest reported FY, without naming the year in the retrieved profile.", "Fiscal year unspecified", low, "Obtain audited revenue, revenue recognition basis, take rate, gross margin, and EBITDA."]
