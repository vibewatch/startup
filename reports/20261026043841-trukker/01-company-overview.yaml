callouts:
  - calloutType: risk
    title: Funding headline is not equity proceeds
    body: >-
      The up-to-$300M May 2026 transaction is described as a receivables
      securitisation. It should not be added to equity raised or treated as
      unrestricted cash without utilization and covenant evidence.
    claimRefs: [CO014, CO015]
  - calloutType: assumption
    title: Current scale is not established
    body: >-
      Public profile figures have different dates and definitions; current
      valuation, audited revenue, ARR, customer activity, and headcount remain
      diligence items rather than verified cover metrics.
    claimRefs: [CO016]

