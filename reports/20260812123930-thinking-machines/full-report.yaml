      - number: '4.3'
        title: Capital adequacy, strategic financing, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The Temus transaction is the center of gravity for public capital analysis. Multiple sources describe it
              as a strategic late-stage investment intended to expand regional footprint and increase production-grade
              delivery capacity, while preserving leadership and operations. That is directionally favorable: it
              suggests outside capital is available and that the company is scaling from a position of relevance rather
              than appearing obviously distressed. At the same time, DealStreetAsia explicitly notes that financial
              details were not disclosed, and no public evidence reveals the size of the investment, cash on hand, burn,
              or runway.


              This chapter’s main conclusion is therefore about disclosure quality, not a hidden numeric answer.
              Registry sources show the company exists and is incorporated, but open-web access to detailed
              private-company filings is limited. By contrast, public-company portals for IBM and Accenture show how
              much more financial context exists for mature comparables. For Thinking Machines, the absence of revenue,
              margin, debt, and cash data leaves capital adequacy unproven. The fair verdict is that the business
              appears commercially credible and strategically financed, but financially impossible to underwrite tightly
              without management-room data.


              The underwriting consequence is simple: even a favorable strategic narrative cannot substitute for
              management accounts. Without them, investors are really underwriting founder reputation, customer proofs,
              and strategic-partner validation rather than a visible financial statement story.
