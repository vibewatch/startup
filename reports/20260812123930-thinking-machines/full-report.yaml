      - number: '3.2'
        title: Capability breadth, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines’ most defensible public positioning is its continuity from data foundations to governed
              AI deployment. Its official materials, OpenAI profile, and Temus announcement all emphasize designing,
              deploying, and adopting AI in real workflows. That is broader than Senti’s clearly productized
              conversational-AI lane and more AI-explicit than Stratpoint or Exist, which present data/AI inside wider
              software and cloud-delivery portfolios. It is narrower, however, than the enormous platform and alliance
              breadth of Accenture, IBM, AWS, Google, or NCS.


              Packaging reflects the same pattern. Most enterprise-facing rivals disclose capabilities rather than
              transparent prices, implying quote-based project work. Senti stands out as more visibly productized
              through named solutions, while hyperscaler services are usually sold as transformation accelerators around
              their own platforms. Distribution is similarly asymmetric. Global incumbents access larger budgets,
              broader alliances, and established procurement channels. Thinking Machines’ Temus combination narrows that
              gap, but it does not erase it. The practical result is that Thinking Machines likely competes best where
              buyers need hands-on integration, governance, and context rather than the cheapest labor or the broadest
              global SI footprint.
