  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio, modules, and customer workflow fit
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines’ product surface is best understood as a layered services-and-solutions portfolio. At
              the base are data foundations and cloud data platforms; on top of that sit applied modules for customer
              intelligence, document intelligence, and location intelligence; then a newer generative-AI layer wraps
              adoption, evaluation, and workflow integration around foundation-model ecosystems. This is not a single
              horizontal platform sold with a simple seat model. It is a family of repeatable solution patterns
              delivered through enterprise implementation.


              In customer workflow terms, the modules map to concrete jobs: unify and segment customer data, search and
              extract from large document sets, transform satellite or location data into decisions, and deploy GenAI
              into secure business workflows. That breadth matters because it lets Thinking Machines meet enterprises
              before and after model selection — often at the more valuable stages of data preparation, integration, and
              adoption. The trade-off is that public pages prove use-case versatility better than they prove
              standardized product economics.


              That operating shape matters for diligence because it explains why customer value and product economics
              can diverge. A repeatable workflow does not automatically mean a self-contained software SKU; in Thinking
              Machines' case, repeatability appears to live inside delivery playbooks, model libraries, and domain
              templates.
