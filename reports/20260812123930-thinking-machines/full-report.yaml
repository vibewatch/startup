  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation thesis, anti-thesis, and price discipline
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines looks valuable in the strategic sense before it looks legible in the underwriting sense.
              Chapters 1 through 7 showed a real Southeast Asian AI/data-services company with credible founders, an
              OpenAI partner badge, named enterprise and development-sector references, and a new Temus
              strategic-capital signal. Those are meaningful positives because they reduce the chance that this is
              merely a slideware AI story. They do not, however, solve the core valuation problem: public evidence still
              does not show revenue, gross margin, retention, pricing, cash, or cap-table terms.


              That gap matters because Thinking Machines is not being valued as a sleepy outsourcing shop in the user
              prompt; it was framed as a unicorn with a frontier-style financing narrative. Nothing retrieved in this
              run substantiates that framing for Thinking Machines Data Science, Inc. The supportable interpretation is
              narrower: a respected Philippines-rooted applied-AI company with partner optionality, but with operating
              disclosure far below what investors would need to justify a multi-billion-dollar price.


              The anti-thesis is therefore not “bad company”; it is “good company, unclear economics, and likely
              overextended narrative.” Price discipline should treat TM as a services-heavy applied-AI platform
              candidate with some product upside, not as a proven software compounder or model-lab scarcity asset. That
              framing still leaves room for upside, but it makes recommendation highly price-sensitive and
              evidence-sensitive.
            claimRefs:
              - CV001
