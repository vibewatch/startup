      - number: '4.2'
        title: Cost structure, unit economics, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Because the public offer is service-heavy, the economic engine is likely labor. Senior consultants, data
              engineers, ML practitioners, and client-facing change experts are probably the main cost center, with
              cloud/tool pass-through, pre-sales, travel, and internal enablement as secondary costs. That structure
              usually makes utilization, staff-mix leverage, and change-order discipline the most important gross-margin
              variables. It also means that public traction proxies such as client count or training reach matter less
              than backlog quality, average deal size, and the portion of work that becomes repeat business.


              The positive side of this model is relatively low fixed capex compared with infrastructure-heavy AI
              businesses. Thinking Machines does not appear to own data centers or compute fleets, so financial risk
              should come more from people-cost commitments and working-capital timing than from asset financing. The
              negative side is that project businesses can look strong externally while hiding margin volatility
              underneath if collections are slow, scopes drift, or expansion work fails to recur. Public evidence does
              not reveal the company’s actual utilization, DSO, or gross-margin profile, so unit-economics analysis
              remains mostly a driver map plus diligence asks.


              In other words, the business may have attractive intellectual leverage without having software-like
              financial leverage. Reusable accelerators can help, but unless they materially compress delivery hours or
              raise expansion rates, margins will still be governed mainly by staffing economics.
