      - number: '7.3'
        title: People, financial-model, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              People and disclosure risk are tightly linked in a services-heavy business. Thinking Machines appears
              meaningfully founder-shaped, and public scale signals are inconsistent enough that outsiders cannot easily
              tell how deep the broader leadership bench is. That matters because services businesses rarely fail
              because the models stop working; they fail because utilization cracks, hiring stalls, customer
              concentration bites, or the founder’s relationship capital proves hard to replicate.


              Financial-model risk is therefore mostly opacity risk. There is no clean public view into revenue quality,
              gross margin, retention, concentration, or runway. Investors are asked to trust credible partners, serious
              customers, and a compelling strategic narrative without seeing the operating dashboard underneath. The
              right response is not to reject the company outright, but to define kill criteria clearly: partner-status
              erosion, customer-concentration surprises, regulatory friction in BFSI, or inability to staff regional
              delivery at acceptable margins.


              The practical investment lesson is that this is not a company to underwrite on narrative alone. It is a
              company to underwrite with explicit red lines around concentration, partner economics, staffing
              resilience, and regulatory-operating evidence. Without fuller disclosure, downside scenarios should assume
              slower hiring, uneven collections, and delayed cross-border scaling rather than a smooth continuation of
              recent momentum.
            claimRefs:
