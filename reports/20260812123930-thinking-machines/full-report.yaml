      - number: '8.2'
        title: Comparable set and financing context
        blocks:
          - type: paragraph
            body: >-
              The most useful public comp lens is a blended one: AI/data implementation firms and digital-transformation
              platforms whose equity values still depend heavily on services revenue quality. The August 2026
              public-market read-through is sobering. Endava trades at roughly 0.15x revenue, Globant at about 0.65x,
              EPAM at about 0.90x, Genpact at about 1.08x, and Accenture at about 1.47x using the fetched market-cap and
              TTM-revenue pages. In other words, even credible global operators with far better disclosure do not
              command automatic software-like multiples in 2026.


              Thinking Machines deserves some premium to generic IT services because its category is narrower and
              faster-growing: enterprise AI adoption, governed data platforms, and geospatial analytics are more
              differentiated than standard staff augmentation. But it also deserves a discount to software or
              frontier-AI narratives because the retrieved record still looks services-led, partner-anchored, and opaque
              on recurring revenue.


              The Temus transaction sharpens rather than resolves that conclusion. It is a strong quality signal and a
              useful proof that a serious regional operator saw strategic value. Yet public evidence still frames it as
              a strategic investment, not a transparently priced benchmark round with disclosed economics. That means
              investors can cite the transaction as validation of relevance, but not as proof that any specific
              private-market valuation mark is justified.
