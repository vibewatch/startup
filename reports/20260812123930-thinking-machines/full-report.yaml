  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: incumbents, locals, platforms, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape around Thinking Machines should be grouped by job-to-be-done rather than by
              simplistic “AI company” labels. First are global incumbents such as Accenture and IBM, which can bundle AI
              into larger cloud, data, and enterprise-transformation programs. Second are platform-native services arms
              such as AWS Professional Services and Google Cloud Consulting, which compete directly for high-value
              deployments while also enabling partner ecosystems. Third are regional integrators such as NCS and now
              Temus, which bring Singapore-based scale, trust, and operating reach across Southeast Asia. Fourth are
              local Philippine overlaps such as Stratpoint, Exist, and Senti, each of which overlaps on a narrower slice
              of Thinking Machines’ offer. Finally, internal build remains a substitute for capable enterprise teams.


              This segmentation matters because no single rival dominates every layer. Buyers can procure strategy from
              an incumbent, cloud execution from a hyperscaler, language tooling from a niche specialist, and internal
              workflow integration from an in-house team or local partner. Thinking Machines therefore wins less by
              eliminating alternatives and more by occupying a useful middle position: more specialized and locally
              grounded than GSIs, but broader and more enterprise-ready than narrow AI boutiques.


              For diligence purposes, the key mistake would be to compare Thinking Machines only with other firms that
              look similar on paper. In practice the company is selling against bigger transformation programs,
              cloud-adjacent services, point-solution vendors, and the inertia of existing enterprise teams.
