              repositories, public-cloud document platforms, and data ingestion from structured and unstructured
              sources. The dependency map is therefore clear even without private diagrams: the company relies on
              public-cloud infrastructure, external foundation-model ecosystems such as OpenAI, customer data access,
              and domain-specific data partnerships. The model is not one of owning the deepest infrastructure; it is
              one of orchestrating multiple layers into production systems.


              Maturity is uneven but credible. Data-platform and classic analytics workflows appear to be the oldest and
              most stable layer. Geospatial AI looks unusually deep for a firm of this type, with long-running
              UNICEF-linked work, open-source tools, and sustainability applications. The GenAI offer is newer but more
              explicit than a generic consulting deck: educate, experiment, execute, implementation frameworks, and
              banking-use-case references. Public evidence therefore supports a real deployment stack, but not a formal
              proof of standardized reliability metrics or a public changelog discipline.


              The architecture therefore looks practical rather than vertically integrated. That can accelerate
              deployments and keep the company close to customer needs, but it also means the stack inherits cloud,
              partner-model, and data-access dependencies that are partly outside the company's direct control.
