      - number: '1.2'
        title: Founder, leadership, and governance posture
        blocks:
          - type: paragraph
            body: >-
              Stephanie Sy is the unmistakable center of gravity in every public description of Thinking Machines.
              Official and third-party profiles align on the basics: she founded the company, remains CEO in 2026,
              studied at Stanford, worked at Google, and returned from Silicon Valley to build in the Philippines.
              Harvard Business Publishing, Hustleshare, and Ignition all add a similar texture to her founder story: she
              came back because she saw both a family pull and a market gap, then built a company around careful
              problem-solving, client education, and storytelling. That background matters because the company still
              appears heavily founder-branded. Even after the Temus transaction, Stephanie Sy remains the primary named
              executive attached to Thinking Machines’ mission, public voice, and operating continuity.


              Governance transparency is weaker than founder visibility. Publicly retrieved materials do not list a
              board, a broader executive bench, or precise control rights following the Temus investment. Instead,
              outside readers mainly see Sy, plus Temus executives Sng Ren Yeong and Sutowo Wong in the context of the
              combined Applied AI & Data team. That is enough to understand the strategic direction, but not enough to
              fully diligence succession depth or post-deal decision rights. Founder dependence remains a real
              characteristic of the current public record.
                      
            claimRefs:
