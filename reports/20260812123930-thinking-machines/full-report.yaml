  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and market-formation risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is material because Thinking Machines works in customer-data, document, and
              financial-services-adjacent workflows. The Philippine privacy regime already applies to AI systems that
              process personal data, and the BSP has begun articulating voluntary supervisory expectations for AI in
              banking. Those frameworks are supportive of responsible adoption, but they also raise the bar for
              governance, documentation, human oversight, and bias control. For a company whose best customers are often
              regulated enterprises, the risk is less “AI gets banned” and more “deployment gets slower, more
              document-heavy, and more expensive.”


              Market-formation risk also remains real. Swarm and Trade.gov show a market with high interest but uneven
              institutionalization: widespread experimentation, limited firm-wide use, and large numbers of enterprises
              stuck in proof-of-concept. That is commercially favorable for an implementation partner in one sense, but
              it also means sales cycles, procurement friction, and budget conversion can stay volatile for longer than
              optimistic AI narratives imply.


              That makes regulatory timing risk especially important for investors. A company that wins because it can
              handle harder governance environments may still suffer if documentation burdens, approval gates, or
              customer caution rise faster than deal sizes do. Buyers in banking and government also tend to move slowly
              once governance standards change, so even well-positioned vendors can see pipeline conversion stretch
              materially over a few quarters.
            claimRefs:
              - CR001
