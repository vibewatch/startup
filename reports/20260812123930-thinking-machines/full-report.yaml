  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines’ public surfaces point to a revenue model built around enterprise services rather than
              product-led software. The company sells advisory and delivery work around data platforms, workflow AI,
              generative-AI adoption, and domainized solution packages such as customer, document, and location
              intelligence. The contact flow, solution descriptions, and deployment-oriented language all suggest
              consultative scoping and quote-based contracting. Public evidence does not support a classic self-serve
              SaaS motion or material usage-based monetization.


              The GTM motion also looks enterprise-native. The company markets credibility through referenceable
              deployments, thought leadership, and partner signaling. The free course on the homepage is best
              interpreted as demand generation, not direct revenue proof. OpenAI partner status and the Temus
              relationship likely expand lead flow and trust, while customer references such as EastWest Bank indicate
              the business can land regulated accounts where expansion revenue may follow successful implementation.
              This is a business that probably books revenue through projects, extensions, enablement, and possibly some
              ongoing support — not through transparent seat pricing.


              That also implies revenue recognition is probably milestone- or project-based more often than recurring by
              default. Financial quality will therefore depend on whether initial deployments reliably expand into
              broader platform, support, or follow-on implementation scopes.
