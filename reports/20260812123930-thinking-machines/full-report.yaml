      - number: '3.3'
        title: Switching cost, moat durability, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Adverse evidence is real and should not be minimized. Thinking Machines does not appear to own a hard
              technology monopoly, nor does it benefit from public pricing opacity that obviously favors premium
              capture. Hyperscalers can increasingly pair AI services with core cloud spend, and global consultancies
              can bundle AI into far larger transformation programs. OpenAI partner status is helpful, but because
              partner networks are expanding, the badge alone is unlikely to provide durable exclusion. Internal build
              is also a live substitute, especially for enterprises with sophisticated engineering teams.


              The mitigating point is that the hardest part of enterprise AI adoption in Southeast Asia is rarely model
              access alone. It is orchestration under messy conditions: fragmented data, governance checks, complex
              workflows, and organizational change. That is the layer where Temus explicitly says Thinking Machines is
              strong, and it is also the layer where switching costs rise once a system is embedded into a client’s
              pipelines and decision processes. The moat therefore looks executional and relationship-based, not
              platform-monopolistic. Durable advantage will depend on converting that execution reputation into
              repeatable regional distribution before large integrators and cloud ecosystems compress the category
              further.


              That means customer references and post-launch expansion matter more than slogan-level positioning. If
              Thinking Machines repeatedly becomes the team enterprises trust after pilots stall, its competitive
              posture is stronger than simple headcount comparisons imply; if not, the market can compress toward larger
              integrators or narrower tools.
            claimRefs:
              - CP022
