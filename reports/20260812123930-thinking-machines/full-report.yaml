      - number: '1.3'
        title: Capital base, partner map, and stakeholder importance
        blocks:
          - type: paragraph
            body: >-
              The most important 2026 corporate event is the Temus strategic investment announced on 30 July 2026. That
              announcement is highly significant operationally even though it is not yet financially transparent. Temus,
              itself established by Temasek, positioned the deal as a combination of Thinking Machines’ decade of
              delivery experience with a larger Singapore-based transformation platform. The announcement also made
              clear that Thinking Machines would continue under its own brand and that client engagements would not be
              disrupted, while Stephanie Sy would also assume a managing-director role inside Temus. What the public
              record still does not provide is the economics: no disclosed investment amount, no valuation, and no
              ownership or governance terms.


              Earlier external support appears to have come through the UNICEF Venture Fund and the broader UNICEF
              innovation ecosystem. Those sources anchor the company’s earlier geospatial and open-source period and
              provide the only directly retrieved public funding figure in this run. OpenAI is strategically important
              as a go-to-market and credibility partner rather than as a disclosed investor. EastWest Bank, meanwhile,
              functions as a meaningful customer proof-point because it shows production AI work inside a regulated
              industry. The stakeholder map therefore matters more than the incomplete cap table.
                      
