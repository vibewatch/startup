      - number: '7.2'
        title: Operational, dependency, and delivery risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Thinking Machines sits on several external dependencies. Public-cloud infrastructure,
              OpenAI-linked model ecosystems, customer data access, and geospatial data sources all matter to delivery.
              Some of these are ordinary for modern AI services firms, but they still create practical failure modes:
              rising cloud cost, vendor roadmap shifts, API dependency, data-rights disputes, or delayed customer data
              availability. The geospatial toolchain adds another wrinkle because some public developer artifacts are
              clearly community-style and best-effort, which is great for technical culture but not equivalent to
              enterprise support guarantees.


              Philippine operating conditions add a second layer of execution risk. Infrastructure sources emphasize
              power cost, power reliability, and the country’s relative immaturity versus Singapore or Thailand in
              data-center scale. Combined with talent scarcity, those constraints can raise delivery cost, slow model
              iteration, and make regional support harder unless the Temus combination materially expands bench depth
              and cross-border execution capacity.


              The Temus relationship partly offsets these risks by broadening delivery capacity, but it does not remove
              them. If anything, larger regional ambition raises the cost of dependency failure because more customers,
              geographies, and delivery teams can be affected at once. That matters because Thinking Machines markets
              sophisticated data and AI outcomes; when support, staffing, or integration assumptions break, remediation
              can consume high-value specialist time instead of creating incremental revenue.
