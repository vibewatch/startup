companyProfile:
  summary: >-
    Thinking Machines Data Science, Inc. is a Manila-founded applied-AI and data-engineering company established in 2015
    by Stephanie Sy. Public materials position it as a specialist in enterprise data platforms, customer intelligence,
    document intelligence, location intelligence, and generative-AI deployment for regulated and data-rich organizations
    across Southeast Asia. The company appears services-led rather than self-serve SaaS-led: it sells strategy,
    implementation, deployment, and enablement work, while increasingly packaging repeatable solution templates and
    open-source geospatial assets. Public customer proof is strongest around EastWest Bank and UNICEF-linked work, and
    external credibility was strengthened by OpenAI partner status plus a July 2026 strategic investment from Temus.
    Even so, revenue, margin, retention, and financing-term disclosure remain sparse.
  founders:
    - name: Stephanie Sy
      role: Founder and Chief Executive Officer
      background: >-
        Stanford alumna and former Google employee who returned from Silicon Valley to build an AI company in the
        Philippines.
      claimRefs:
        - CO009
        - CO010
        - CO011
  foundingLocation: Manila, Philippines
  headquarters: Manila, Philippines
  productSummary: >-
    Thinking Machines sells enterprise data platforms, customer-intelligence systems, document-intelligence workflows,
    geospatial/location-intelligence products, and generative-AI deployment services. The public offer emphasizes secure
    public-cloud data infrastructure, AI/ML implementation, analytics workflows, and change-management or training
    support rather than a self-serve software product.
  customerFocus: >-
    Large enterprises and institutions in financial services, retail, conglomerates, civic organisations, and
    development or public-interest use cases across the Philippines and Southeast Asia.
  businessModel: >-
    Primarily services-led monetization through strategy, implementation, deployment, and adoption work for enterprise
    AI and data-platform programs, with some evidence of productized solution templates but no public self-serve pricing
    or disclosed recurring-software revenue.
  stage: Private growth stage with regional expansion ambitions and disclosed strategic capital from Temus in July 2026.
  fundingStatus: >-
    A strategic investment from Temus was announced in July 2026. Public sources do not disclose transaction size,
    valuation, total capital raised, or financing terms.
