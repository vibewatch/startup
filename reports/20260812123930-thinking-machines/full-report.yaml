      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Because disclosed valuation inputs are weak, the right output is not false precision but bounded scenario
              discipline. The bear case assumes TM remains primarily an expert-services and implementation business,
              faces slower regional conversion, and is valued on public-market-style service multiples. The base case
              assumes the company proves repeatable AI delivery at better economics than ordinary consulting and earns a
              moderate premium for regional scarcity. The bull case assumes the company converts its Temus and OpenAI
              halo plus public customer proof into a more productized, repeatable regional platform story with stronger
              attach and better capital efficiency.


              These scenarios are best read as entry-discipline bands, not as a claim that management would accept those
              exact marks today. Public evidence does not give the inputs needed for a full DCF or software-style cohort
              model. It does, however, let us say something important: a supportable valuation range for TM is probably
              measured in tens to low hundreds of millions under conservative assumptions, and only stretches toward the
              low billions under a highly favorable strategic-premium case.


              That spread is wide, but it still produces a clear conclusion. The company may be good enough to grow into
              a much larger outcome; the public evidence is not good enough to underwrite a $10B-style narrative now.
              The right investor posture is to demand milestone-based proof before paying any frontier-style price.
            claimRefs:
              - CV024
              - CV025
              - CV026
