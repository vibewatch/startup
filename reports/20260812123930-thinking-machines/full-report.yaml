            title: The biggest near-term risk is not regulation alone — it is compound risk
            body: >-
              If partner dependence, talent scarcity, and customer opacity remain individually manageable, the thesis
              holds. If they compound at once, they can quickly turn a strong narrative into a weak underwriting case.
