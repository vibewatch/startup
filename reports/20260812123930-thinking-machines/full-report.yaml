      - number: '2.2'
        title: Buyer segments, workflow priorities, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is led by segments where data quality, compliance, and workflow redesign matter as much as
              model selection. In the Philippines, the most attractive verticals for Thinking Machines-style work are
              IT-BPM/BPO, financial services, retail and conglomerates, public sector, telco/logistics, and healthcare.
              Trade.gov, Swarm, and company evidence all point to these sectors as active adopters. Within them, the
              economic buyer is often the CEO, COO, CIO, CTO, or business-unit head; the daily users are operations,
              service, analytics, and frontline teams; and the real gatekeepers are data, security, and compliance
              functions.


              Swarm’s survey is especially useful because it shows what adoption looks like operationally rather than
              rhetorically. Organizations are already deploying AI for internal automation, content creation, and data
              analysis, and almost half say they are in AI application-development mode. Yet most are still consuming
              vendor tools rather than building proprietary stacks. That pattern favors implementation partners over
              pure model vendors: the hard work is less about inventing models and more about choosing tools,
              integrating them into systems, governing them safely, and helping organizations redesign workflows around
              them.


              This also explains why buyer maps look wider than immediate revenue realization. Many accounts may begin
              with training, policy, or narrow workflow automation before expanding into broader platform or
              managed-delivery scopes once trust, data readiness, and compliance comfort improve.
