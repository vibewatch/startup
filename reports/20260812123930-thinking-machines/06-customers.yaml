    {
      "id": "named-proof-and-adoption-depth",
      "title": "Named customer proof and adoption depth",
      "body": "EastWest Bank is the clearest public anchor for customer proof. Thinking Machines’ own homepage includes a direct EastWest testimonial about adopting and productionalizing AI, while EastWest’s official 2025-2026 releases show the bank continuing to invest in digital onboarding, customer-service AI, and advisory workflows. Those customer-side releases do not prove that Thinking Machines caused every disclosed outcome, but they do place TM’s work inside a live environment where digital usage, NPS, complaints reduction, and AI-enabled customer experience are board-relevant topics rather than innovation theater. That makes EastWest a high-quality reference even if attribution must remain careful.\n\nOutside EastWest, the evidence shifts from named logos to credible but thinner proof. The stories directory references dozens of custom GenAI apps; UNICEF-linked materials disclose a major Southeast Asian telecom contract and public/civic demand for geospatial work; and partner sources emphasize hundreds of systems deployed across sectors. The pattern is consistent with real adoption breadth, but the public record is still reference-light compared with the overall client-count claims.\n\nThe EastWest evidence also clarifies how to read customer outcomes in this chapter. Customer-side banking metrics can validate that the environment is real and expanding, even when they cannot be cleanly decomposed into TM-attributable ROI. For diligence, that is still useful because it distinguishes live enterprise programs from slideware.",
