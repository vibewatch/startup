  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Thinking Machines’ customer quality looks stronger than its customer disclosure depth. Public evidence supports a meaningful enterprise client base across financial services, retail, conglomerates, telecom, and civic work, with EastWest Bank as the clearest named production account. But the company does not publicly disclose retention, concentration, contract length, or revenue-by-customer, so durability can only be inferred indirectly."
  },
  "sections": [
    {
      "id": "customer-base-and-segmentation",
      "title": "Customer base, segments, and buyer map",
      "body": "The available evidence points to a customer base anchored in sizable organizations rather than small transactional buyers. OpenAI, Temus, and related press sources place Thinking Machines across financial services, retail, conglomerates, and civic organizations, while the broader market evidence suggests these are exactly the kinds of accounts where workflow integration, governance, and data cleanup are expensive enough to justify a specialist implementation partner. In practical terms, the likely economic buyers are senior transformation, operations, technology, or business-line leaders; the daily users are analysts, frontline staff, branch officers, and knowledge workers; and the payers are enterprise or program budgets rather than team-level card spend.\n\nGeographically, the customer story still reads Philippines-first with increasing Southeast Asian reach. That fits both the company’s office footprint and the Temus combination. The more important point is not simply geography but account quality: TM seems most relevant where customers have complex workflows, regulated data, or large-scale operations, which raises buyer quality even if public logo density remains limited.\n\nThat is an attractive customer profile for a services-led AI company because sophisticated buyers tend to have larger budgets and more follow-on use cases once trust is earned. It is also a harder segment to penetrate, which makes every public reference more valuable than a raw logo count would suggest.",
