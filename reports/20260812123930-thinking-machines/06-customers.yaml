    {
      "id": "retention-expansion-and-concentration",
      "title": "Retention, expansion, and concentration risk",
      "body": "This is the most under-disclosed part of the customer story. No public NRR, GRR, churn, renewal, contract-length, or top-customer concentration data were found. That means there is no rigorous way to quantify whether Thinking Machines is a sticky multi-year partner, a project shop with episodic follow-on work, or something in between. The best indirect evidence comes from production-style references, customer-side continued digital investment, and partner confidence that TM can scale with larger regional clients.\n\nThe upside case is plausible: land with data or AI adoption work, earn trust in messy enterprise workflows, and expand into adjacent use cases or regions. The downside risk is equally plausible: a few strong references may mask concentration or dependence on a narrow set of marquee accounts. The customer verdict is therefore positive on buyer quality and named proof quality, but explicitly incomplete on retention durability and concentration exposure.\n\nIn other words, the evidence supports a high-quality reference set but not a fully underwritten customer model. The next diligence step is not more marketing copy; it is account-level data on active customers, expansion history, concentration, and renewal behavior.",
