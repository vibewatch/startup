    "number": 2,
    "title": "Market Analysis",
    "summary": "Thinking Machines sells into a Philippine enterprise-AI market that is large enough to matter but still immature enough to reward implementation-led vendors. Public evidence supports a multi-lens view: headline AI spending is growing quickly, enterprise experimentation is widespread, but only a minority of organizations have moved beyond pilots, which makes governance, integration, data platforms, and change management more economically relevant than raw model access alone."
  },
  "sections": [
    {
      "id": "market-boundary-sizing",
      "title": "Market boundary and sizing lenses",
      "body": "The relevant market for Thinking Machines is not “all AI.” It is the narrower slice of enterprise spend tied to planning, governing, integrating, and operating AI and data systems inside organizations. Included spend covers data-platform modernization, workflow integration, responsible-AI design, model enablement, change management, and deployment support across regulated or data-intensive functions. Excluded spend includes frontier-model training, chip manufacturing, hyperscaler capex, and mass-market consumer AI apps. That distinction matters because the Philippine headline AI market can look large, but only a fraction is monetizable by an implementation-heavy consultancy.\n\nPublic sizing sources still provide useful top-down anchors. Trade.gov cites a Philippine AI market growing from about US$772 million in 2024 to about US$3.49 billion by 2030, while regional sources show Southeast Asia’s AI sector already above US$4 billion in 2024 and growing rapidly. Those numbers establish a meaningful TAM. But public evidence does not publish a precise Philippines-only SAM for governance-heavy enterprise AI services, so the more reliable lens is adoption maturity: widespread experimentation, uneven scaling, and strong demand for partners that can close the gap between proof-of-concept and production.\n\nA practical 2026 diligence takeaway is that market size should be read together with execution depth. In a market where many buyers are still converting experiments into governed workflows, the revenue pool available to a firm like Thinking Machines is shaped more by delivery complexity and organizational change than by the simple count of AI users.",
