  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Thinking Machines competes in a fragmented field rather than a winner-take-most market. Its strongest differentiation is not scale or proprietary models; it is the combination of Philippine-rooted enterprise delivery, data-platform depth, OpenAI partner signaling, and a now larger Southeast Asian route-to-market through Temus. That still leaves the company exposed to global integrators on breadth, hyperscalers on platform-native services, and local specialists on narrower use cases such as conversational AI."
  },
  "sections": [
    {
      "id": "landscape-and-classes",
      "title": "Landscape: incumbents, locals, platforms, and substitutes",
      "body": "The competitive landscape around Thinking Machines should be grouped by job-to-be-done rather than by simplistic “AI company” labels. First are global incumbents such as Accenture and IBM, which can bundle AI into larger cloud, data, and enterprise-transformation programs. Second are platform-native services arms such as AWS Professional Services and Google Cloud Consulting, which compete directly for high-value deployments while also enabling partner ecosystems. Third are regional integrators such as NCS and now Temus, which bring Singapore-based scale, trust, and operating reach across Southeast Asia. Fourth are local Philippine overlaps such as Stratpoint, Exist, and Senti, each of which overlaps on a narrower slice of Thinking Machines’ offer. Finally, internal build remains a substitute for capable enterprise teams.\n\nThis segmentation matters because no single rival dominates every layer. Buyers can procure strategy from an incumbent, cloud execution from a hyperscaler, language tooling from a niche specialist, and internal workflow integration from an in-house team or local partner. Thinking Machines therefore wins less by eliminating alternatives and more by occupying a useful middle position: more specialized and locally grounded than GSIs, but broader and more enterprise-ready than narrow AI boutiques.\n\nFor diligence purposes, the key mistake would be to compare Thinking Machines only with other firms that look similar on paper. In practice the company is selling against bigger transformation programs, cloud-adjacent services, point-solution vendors, and the inertia of existing enterprise teams.",
