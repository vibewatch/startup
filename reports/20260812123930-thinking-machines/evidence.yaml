evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: client-count
    missingEvidence: >-
      A management-defined methodology for the current customer count and the reconciliation between 110-plus and
      150-plus disclosures.
    whyItMatters: >-
      Customer count is a front-page scale metric and currently has source-to-source drift that weakens confidence in
      broader KPI reporting.
    diligencePath: >-
      Request a dated customer-count definition from management, including whether the number refers to cumulative
      logos, active accounts, or regional entities.
    relatedQuestionRefs:
      - QO008
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An official 2026 employee count by geography and function.
    whyItMatters: >-
      Leadership depth and delivery capacity cannot be judged from a 51-200 external band or an older UNICEF “80-plus
      team” profile.
    diligencePath: >-
      Obtain an org-level headcount summary from management or a current official company profile that states employee
      count directly.
    relatedQuestionRefs:
      - QO010
      - QO023
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: blocking
    topic: temus-deal-economics
    missingEvidence: Investment amount, ownership percentage, governance rights, and any implied valuation from the Temus transaction.
    whyItMatters: >-
      Without transaction economics, the company-overview chapter can describe strategic importance but cannot anchor
      valuation, dilution, or control analysis.
    diligencePath: >-
      Request the deal term sheet or an investor deck summarizing consideration, ownership, board rights, and any
      rollover or earn-out terms.
    relatedQuestionRefs:
      - QO014
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board list and a description of formal post-deal governance responsibilities between Thinking Machines
      and Temus.
    whyItMatters: >-
      Founder dependence appears high, but succession and control risk cannot be assessed without seeing the actual
      board and reserved matters.
    diligencePath: >-
      Request a board observer or governance memo covering directors, committees, reserved matters, and reporting lines
      after the strategic investment.
    relatedQuestionRefs:
      - QO021
      - QO022
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: A Philippines-specific services SAM and TM-relevant SOM for implementation-led AI and data-transformation work.
    whyItMatters: >-
      Headline AI-market figures are too broad to support a precise market-share or valuation model for Thinking
      Machines.
    diligencePath: >-
      Request bottom-up segment revenue splits, contract values, and pipeline by vertical from management, or use a paid
      market database with services-level segmentation.
    relatedQuestionRefs:
      - QM008
      - QM023
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: segment-budgets
    missingEvidence: >-
      Current procurement-budget ranges for BFSI, BPO, retail, public-sector, and telco AI modernization projects in the
      Philippines.
    whyItMatters: Without budget-band data, buyer maps remain strategically useful but financially loose.
    diligencePath: >-
      Collect recent RFPs, disclosed deal values, or channel checks from systems integrators and enterprise buyers by
      segment.
    relatedQuestionRefs:
      - QM010
      - QM024
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: adoption-maturity
    missingEvidence: >-
      A single methodology reconciling economy-wide 14.9% firm usage with Swarm’s 92% survey usage and EDB’s 46%
      beyond-pilot regional benchmark.
