  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Thinking Machines Data Science, Inc. is a Manila-founded AI and data transformation company founded by Stephanie Sy in 2015, with current operating footprint across Manila, Singapore, and Bangkok. Public evidence supports its position as a regional enterprise AI implementation partner with meaningful OpenAI and Temus relationships, but not the user-supplied unicorn narrative: the 2026 Temus investment is strategically important yet still lacks disclosed valuation, ownership, and exact headcount terms.\n    "
  },
  "sections": [
    {
      "id": "identity-footprint",
      "title": "Identity, positioning, and regional footprint",
      "body": "Thinking Machines Data Science, Inc. now presents itself as an AI and data transformation company rather than a narrow project shop. Its current public materials consistently emphasize enterprise AI deployment, cloud data platforms, document intelligence, customer intelligence, and generative-AI enablement across Southeast Asia. The company’s most stable geographic facts are also reasonably clear: multiple 2026 sources describe it as Manila-founded, with current operating presence in Manila, Singapore, and Bangkok, while OpenAI’s partner page lists the Philippines, Singapore, and Thailand as the countries served. The homepage adds public scale signals — 10,000-plus professionals trained, 150-plus global clients, and an 85 Net Promoter Score — but these numbers need care because partner-linked July 2026 disclosures cite only 110-plus clients served.\n\nThe synthesis is that Thinking Machines is best understood as a regional enterprise AI consultancy and build partner, rooted in the Philippines but selling a cross-border capability story. Its official site emphasizes human-AI collaboration and workflow adoption, while external coverage ties that message to concrete customer work in banking, civic technology, and climate-oriented geospatial analysis. The identity is coherent; the metrics are directionally impressive; the exact denominators behind those metrics remain partially opaque.\n        ",
