    {
      "id": "milestones-contradictions-gaps",
      "title": "Milestones, positioning shift, contradictions, and explicit diligence gaps",
      "body": "Over roughly a decade, Thinking Machines appears to have moved through three visible phases. The first was a Philippine data-science consultancy phase, already public by 2018, with work for corporates, government, NGOs, and startups. The second was a geospatial and social-impact phase, when UNICEF-linked materials highlighted wealth mapping, satellite-imagery analytics, open-source tools, and climate-oriented applications. The third is the present enterprise-transformation phase, where the public message centers on production-grade AI systems, governance, executive training, OpenAI-enabled adoption, and regional rollout through Manila, Singapore, and Bangkok.\n\nThat trajectory is credible, but the public record is noisier than the polished narrative suggests. Different sources disagree on whether the firm was founded in 2015 or 2016. Current sources also disagree on whether the relevant customer count is 110-plus or 150-plus, and external directories disagree with official materials on the company’s headcount band and even its home geography label. Those contradictions do not negate the business, but they do mean this chapter should carry explicit caution on unsupported private metrics such as exact headcount, board composition, revenue, and valuation. This is a solid identity chapter, not a complete ownership or financial disclosure package.\n        ",
