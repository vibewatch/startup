      - number: '1.4'
        title: 里程碑、定位变化、矛盾和明确尽调缺口
        blocks:
          - type: paragraph
            body: >-
              大约十年里，Thinking Machines 看起来经历了三个可见阶段。第一阶段是菲律宾数据科学咨询公司，2018 年已经公开露面， 服务企业、政府、NGO
              和创业公司。第二阶段是地理空间与社会影响，UNICEF 相关材料突出财富地图、卫星影像分析、开源工具和气候导向应用。 第三阶段是当下的企业转型，公开信息聚焦生产级 AI 系统、治理、高管培训、OpenAI
              赋能的采用，以及通过 Manila、Singapore 和 Bangkok 进行区域推出。


              这条轨迹可信，但公开记录比打磨后的叙事更嘈杂。不同来源对公司创立于 2015 年还是 2016 年说法不一。当前来源也不一致： 相关客户数究竟是超过 110 还是超过
              150；外部名录与官方材料在员工规模区间上不一致，甚至对公司本土地域标签也不一致。 这些矛盾并不否定业务，但意味着本章应对精确员工数、董事会构成、收入和估值等未获支持的私有指标明确保持谨慎。这是扎实的身份章节，
              不是完整的所有权或财务披露包。
