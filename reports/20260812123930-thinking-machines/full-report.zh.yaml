      - number: '2.3'
        title: 增长驱动、监管和基础设施约束
        blocks:
          - type: paragraph
            body: >-
              三股力量正在同时推动市场增长。第一，宏观需求上升：菲律宾组织想获得生产率提升，尤其是在 BPO、银行、客户运营和决策支持中。 第二，NAISR 2.0、CAIR
              和更广泛的数字基础设施推动，让国家政策更明确。第三，区域背景让 AI 现代化更难推迟： Singapore、Thailand 及邻近 ASEAN 市场正在快速增加云、数据中心和 AI 治理能力，足以重设竞争预期。


              约束同样真实。Trade.gov、OECD、NPC、BSP、Swarm 和 Nexdigm 都指出技术栈不同位置存在摩擦：人才短缺、隐私和安全担忧、
              法律不确定性、薄弱的内部数据战略能力、电力成本、供电可靠性，以及热情与制度化之间挥之不去的差距。Thinking Machines 会从中受益，但逻辑并不简单。如果市场已经具备完美的自助 AI
              成熟度，对实施伙伴的需求会下降。菲律宾不是这样的市场。拖慢采用的同一组条件——治理负担、 工作流重设计和基础设施脆弱性——也在为深度介入的交付模式创造付费需求。


              东南亚基准进一步强化这一点。Singapore 已经是更高成熟度部署的区域试验场；菲律宾作为服务主导的现代化市场，比作为独立基础设施枢纽更有吸引力。 这种不对称对 Thinking Machines
              有用，因为它的产品最强之处，正是在买家需要把可用模型转化为受治理企业工作流时提供帮助。
