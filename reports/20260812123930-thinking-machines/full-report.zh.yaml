      - number: '1.2'
        title: 创始人、领导层和治理姿态
        blocks:
          - type: paragraph
            body: >-
              在每一份关于 Thinking Machines 的公开描述里，Stephanie Sy 都是毫无疑问的重心。官方与第三方资料在基本事实上一致： 她创立公司，2026 年仍担任 CEO，曾就读
              Stanford、任职 Google，并从 Silicon Valley 回到菲律宾创业。 Harvard Business Publishing、Hustleshare 和 Ignition
              都为她的创始人故事补上类似纹理：她回国，是因为同时看到了家庭牵引和市场缺口； 随后围绕严谨解题、客户教育和叙事能力搭起公司。这段背景重要，因为公司看起来仍然高度创始人品牌化。即便 Temus 交易之后，
              Stephanie Sy 仍是 Thinking Machines 使命、公共声音和运营连续性中最主要的具名高管。


              治理透明度弱于创始人可见度。公开检索到的材料没有列出董事会、更完整的高管梯队，也没有说明 Temus 投资后的精确控制权。 外部读者主要看到 Sy，以及 Temus 高管 Sng Ren Yeong 和
              Sutowo Wong，后两者出现在合并后的 Applied AI & Data 团队语境中。 这足以理解战略方向，但不足以完整尽调接班人深度或交易后的决策权。创始人依赖仍是当前公开记录里的真实特征。
