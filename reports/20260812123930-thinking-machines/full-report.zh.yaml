      - number: '3.3'
        title: 切换成本、护城河持久性和反向证据
        blocks:
          - type: paragraph
            body: >-
              反向证据真实存在，不应低估。Thinking Machines 似乎没有硬技术垄断，也没有受益于明显有利于溢价捕获的公开定价不透明。 超大规模云厂商越来越能把 AI 服务与核心云支出绑定，全球咨询公司也能把 AI
              打包进规模大得多的转型项目。OpenAI 合作伙伴身份有帮助， 但随着伙伴网络扩张，仅凭徽章不太可能形成持久排他性。内部自建也是真实替代方案，尤其适用于工程能力强的企业。


              缓和这一点的是，东南亚企业采用 AI 最难的部分很少只是模型访问。真正难的是在混乱条件下编排：碎片化数据、治理检查、复杂工作流和组织变革。 Temus 明确称 Thinking Machines
              擅长这一层；系统一旦嵌入客户管线和决策流程，切换成本也正是在这一层上升。因此，护城河看起来是执行型和关系型，
              不是平台垄断型。持久优势取决于公司能否在大型集成商和云生态进一步压缩品类之前，把执行声誉转化为可复用的区域分销。


              因此，客户推荐和上线后的扩张，比口号式定位更重要。如果 Thinking Machines 反复成为企业在试点卡住后信任的团队，
              其竞争姿态会强于简单员工数比较所暗示的水平；如果不能，市场可能被压向更大的集成商或更窄的工具。
