      - number: '7.2'
        title: 运营、依赖和交付风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Thinking Machines 架在几类外部依赖上。公有云基础设施、OpenAI 相关模型生态、客户数据访问和地理空间数据来源， 都会影响交付。其中一些对现代 AI
              服务公司来说很普通，但仍会形成实际故障模式：云成本上升、供应商路线图变化、API 依赖、 数据权利争议或客户数据可用性延迟。地理空间工具链又多一层复杂性，因为一些公开开发者产物明显是社区型、尽力而为；
              这对技术文化很好，但不等同于企业支持保证。


              菲律宾运营条件又加上一层执行风险。基础设施来源强调电力成本、供电可靠性，以及菲律宾相对 Singapore 或 Thailand 在数据中心规模上的不成熟。
              这些约束与人才稀缺叠加，会抬高交付成本、拖慢模型迭代，并让区域支持更困难，除非 Temus 组合实质扩展团队深度和跨境执行能力。


              Temus 关系部分抵消了这些风险，因为它扩大了交付能力，但没有消除风险。甚至可以说，更大的区域雄心提高了依赖故障的成本， 因为更多客户、地区和交付团队可能一次性受影响。这一点重要，因为 Thinking
              Machines 销售的是复杂数据和 AI 成果； 当支持、人员或集成假设破裂时，补救会吃掉高价值专家时间，而不是创造增量收入。
