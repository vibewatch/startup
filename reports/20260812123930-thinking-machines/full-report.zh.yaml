      - number: '8.4'
        title: 退出准备度、尽调要求与最终结论
        blocks:
          - type: paragraph
            body: >-
              基于本轮可得证据，Thinking Machines 还没到公开市场就绪状态。没有公开经审计投资人材料，没有披露收入桥，也看不到股权结构，
              更无法由外部确认利用率、集中度或经常性软件占比。价值并非不存在；只是还不能清晰转化成可投资的公开市场式测算。 若 TM 证明自己已搭起有防御力的区域数据 / AI
              业务版图，战略买家或后期私募投资人仍可能支付明显高于公开可比公司的价格。


              今天最现实的正向退出更可能是战略退出或财务投资人支持的退出，而不是 IPO：区域 IT 服务整合者、希望获得东南亚企业 AI 产能的咨询 / 云合作伙伴，
              或想要本地市场入口的数据平台收购方，都比短期上市更合理。对外部资本而言，门槛问题不是公司是否亮眼，而是下一美元相对于不透明和服务式利润率压缩风险， 能否买到足够的证据调整后上行。


              结论：继续研究。置信度为中，因为公司质量证据真实存在，但估值支撑不足。风险评级为高，因为缺失信息正好集中在入场价格纪律最关键的位置：
              收入质量、留存、利润率和融资条款。只有这些缺口被披露并经得起审视，建议才可能改变。
