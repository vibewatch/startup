  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 组合、模块和客户工作流匹配
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines 的产品呈现最适合理解为分层的服务与解决方案组合。底层是数据基础和云数据平台；其上是客户智能、文档智能、 位置智能等应用模块；再往上，较新的生成式 AI
              层围绕基础模型生态做采用、评估和工作流集成。这不是一个用简单席位模式销售的单一横向平台， 而是一组通过企业实施交付的可复用解决方案模式。


              放到客户工作流里，这些模块对应具体任务：统一并细分客户数据，从大型文档集里搜索和抽取，把卫星或位置数据转化为决策， 并把 GenAI 部署进安全业务工作流。这种广度重要，因为它让 Thinking
              Machines 能在模型选择前后都接触企业——通常是在数据准备、 集成和采用这些更有价值的阶段。取舍在于，公开页面更能证明用例多样性，而不是标准化产品经济。


              这种运营形态对尽调重要，因为它解释了为什么客户价值和产品经济可能分叉。可复用工作流并不自动等于一个自洽的软件 SKU； 在 Thinking Machines
              这里，复用性看起来存在于交付打法、模型库和领域模板中。
