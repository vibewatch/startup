      - number: '3.2'
        title: 能力宽度、包装和分销力量
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines 最站得住脚的公开定位，是从数据基础到受治理 AI 部署之间的连续性。其官方材料、OpenAI 资料和 Temus 公告都强调在真实工作流中设计、部署和采用 AI。这比
              Senti 明确产品化的对话式 AI 赛道更宽，也比 Stratpoint 或 Exist 更明确地围绕 AI；后两者是在更宽的软件或工程组合里呈现数据 / AI。但 Thinking Machines
              的广度仍远不及 Accenture、 IBM、AWS、Google 或 NCS 的全球覆盖和多服务宽度。


              包装方式反映同一模式。多数面向企业的竞争者披露的是能力，而不是透明价格，暗示销售以报价制项目为主。Senti 通过具名解决方案更明显地产品化；
              超大规模云厂商服务通常围绕自家平台作为转型加速器出售。分销同样不对称。全球既有巨头能触达更大预算、更广泛联盟和成熟采购渠道。 Thinking Machines 与 Temus
              结合缩小了差距，但没有抹平差距。实务结果是，Thinking Machines 可能在买家需要动手集成、 治理和上下文理解，而不是最低成本人力或最广全球系统集成足迹时最有竞争力。
