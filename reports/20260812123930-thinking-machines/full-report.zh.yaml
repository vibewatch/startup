      - number: '6.3'
        title: 留存、扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              这是客户故事里披露最不足的部分。没有找到公开 NRR、GRR、流失、续约、合同期限或头部客户集中度数据。 也就是说，无法严谨量化 Thinking Machines
              究竟是黏性多年的伙伴、后续工作偶发的项目制服务商，还是两者之间。 最好的间接证据来自生产型引用、客户侧持续数字化投资，以及伙伴对 TM 能随更大区域客户扩张的信心。


              上行情景可信：通过数据或 AI 采用工作切入，在混乱企业工作流中赢得信任，再扩展到相邻用例或地区。下行风险同样可信：
              少数强引用可能掩盖集中度，或掩盖公司依赖少数旗舰账户的事实。因此，客户结论对买家质量和具名证明质量为正面， 但对留存持久性和集中度暴露明确不完整。


              换句话说，证据支持一组高质量引用，但不支持一个完全可承销的客户模型。下一步尽调不是看更多营销文案， 而是拿到账户级数据：活跃客户、扩张历史、集中度和续约行为。
