chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位和区域足迹
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines Data Science, Inc. 现在把自己呈现为 AI 和数据转型公司，而不是狭义项目工作室。 其当前公开材料持续强调东南亚范围内的企业 AI
              部署、云数据平台、文档智能、客户智能和生成式 AI 赋能。 公司最稳定的地理事实也相当清楚：多份 2026 年来源称其创立于 Manila，目前在 Manila、Singapore 和 Bangkok
              运营；OpenAI 合作伙伴页面则列出服务国家为 Philippines、Singapore 和 Thailand。 官网还给出公开规模信号——培训超过 10,000 名专业人士、服务超过 150
              个全球客户、净推荐值（Net Promoter Score）为 85——但这些数字需要谨慎使用，因为合作伙伴相关的 July 2026 披露只引用了超过 110 个已服务客户。


              综合来看，Thinking Machines 最适合理解为一家区域性企业 AI 咨询与构建伙伴，根在菲律宾，
              但销售的是跨境能力故事。官网强调人机协作和工作流采用，外部报道则把这套叙事连接到银行、公民技术和气候导向地理空间分析中的具体客户工作。 身份是连贯的；指标方向上亮眼；这些指标背后的精确分母仍有一部分不透明。
