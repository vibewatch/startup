      - number: '7.3'
        title: 人员、财务模型和投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              在服务占比高的业务里，人员风险和披露风险绑得很紧。Thinking Machines 明显带有创始人烙印，公开规模信号又不够一致，
              外部很难判断更宽的管理层梯队到底有多深。这一点关键，因为服务型公司很少死于模型失效；更常见的是利用率裂开、 招聘卡住、客户集中度反噬，或者创始人的关系资本难以复制。


              因此，财务模型风险本质上是信息不透明风险。外界看不到收入质量、毛利率、留存、集中度或现金跑道。投资人只能在看不到底层经营仪表盘的情况下，
              信任可靠伙伴、严肃客户和一套有吸引力的战略叙事。正确反应不是直接否定公司，而是把否决条件划清楚： 合作伙伴身份弱化、客户集中度意外暴露、BFSI 监管摩擦，或无法以可接受毛利率配齐区域交付团队。


              实际投资教训是，不能只靠叙事给这家公司做投资判断。投资测算必须围绕集中度、合作伙伴经济性、人员韧性和监管运营证据划出明确红线。 披露不足时，下行情景应假设招聘放慢、回款不均、跨境扩张延后，而不是近期势头顺滑延续。
