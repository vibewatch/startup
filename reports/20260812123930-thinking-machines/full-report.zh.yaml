  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和市场形成风险
        blocks:
          - type: paragraph
            body: >-
              监管风险具有实质性，因为 Thinking Machines 处理客户数据、文档，以及与金融服务相邻的工作流。菲律宾隐私制度已经适用于处理个人数据的 AI 系统， BSP 也开始阐明银行 AI
              的自愿监管预期。这些框架支持负责任采用，但也提高了治理、文档、人类监督和偏见控制的门槛。 公司最佳客户常常是受监管企业，风险不是「AI 被禁止」，而是「部署变慢、文档更多、成本更高」。


              市场形成风险仍然真实。Swarm 和 Trade.gov 展示的是一个兴趣高但制度化不均的市场：实验普遍、全公司使用有限，
              大量企业卡在概念验证阶段。从一个角度看，这对实施伙伴商业有利；但这也意味着销售周期、采购摩擦和预算转化，可能比乐观 AI 叙事暗示的更久保持波动。


              因此，监管节奏风险对投资者尤其重要。一家公司可能因为能处理更难的治理环境而胜出，但如果文档负担、审批关口或客户谨慎上升得比交易规模更快，
              仍会受损。银行和政府买家在治理标准变化后也往往行动缓慢，所以即便位置不错的供应商，也可能看到销售管线转化在几个季度里明显拉长。
