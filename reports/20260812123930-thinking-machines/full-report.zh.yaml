      - number: '2.2'
        title: 买家分层、工作流优先级和采用路径
        blocks:
          - type: paragraph
            body: >-
              买家地图由几类细分市场带头：这些市场里，数据质量、合规和工作流重设计与模型选择同样重要。在菲律宾，最适合 Thinking Machines 式工作的垂直行业是
              IT-BPM/BPO、金融服务、零售与企业集团、公共部门、电信 / 物流和医疗健康。Trade.gov、Swarm 和公司证据都指向这些行业已经在主动采用。其内部，经济买家通常是 CEO、COO、CIO、CTO
              或业务单元负责人；日常用户是运营、 服务、分析和一线团队；真正的守门人则是数据、安全和合规职能。


              Swarm 的调研尤其有用，因为它展示的是运营层面的采用，而不是口号。组织已经在用 AI 做内部自动化、内容生成和数据分析， 几乎一半表示自己处于 AI
              应用开发模式。但多数组织仍在消费供应商工具，而不是自建专有技术栈。这种模式更利好实施伙伴，而不是纯模型厂商： 难点不是发明模型，而是选择工具、把工具集成进系统、安全治理，并帮助组织围绕这些工具重设计工作流。


              这也解释了为什么买家地图看起来比即时收入兑现更宽。许多客户可能从培训、政策或狭窄工作流自动化开始；当信任、数据就绪度和合规舒适度提升后， 才扩展到更广的平台或托管交付范围。
