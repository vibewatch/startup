  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：既有巨头、本地公司、平台和替代方案
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines 周围的竞争格局，应按待完成任务来分组，而不是贴上简单的「AI 公司」标签。第一类是 Accenture 和 IBM 等全球既有巨头，它们能把 AI
              打包进更大的云、数据和企业转型项目。第二类是 AWS Professional Services 和 Google Cloud Consulting
              等平台原生服务部门，它们直接争夺高价值部署，同时也赋能伙伴生态。第三类是 NCS 以及现在的 Temus 等区域集成商， 它们带来新加坡规模、信任和东南亚运营覆盖。第四类是 Stratpoint、Exist 和
              Senti 等菲律宾本地重叠者，它们各自与 Thinking Machines 的产品在较窄切片上重合。最后，对有能力的企业团队而言，内部自建仍是替代方案。


              这套分层重要，因为没有单一竞争者主导所有层级。买家可以从既有巨头采购战略，从超大规模云厂商采购云执行，从小众专家采购语言工具， 再由内部团队或本地伙伴完成内部工作流集成。因此，Thinking Machines
              获胜不是靠消灭替代项，而是靠占住一个有用的中间位置： 比全球系统集成商更专注、更有本地根基；又比狭窄 AI 精品店更宽、更适合企业。


              尽调时的关键错误，是只拿 Thinking Machines 和纸面上看起来相似的公司比较。实践中，公司真正面对的是更大的转型项目、 云相邻服务、点解决方案供应商，以及既有企业团队的惯性。
