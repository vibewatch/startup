  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础、分层和买家地图
        blocks:
          - type: paragraph
            body: >-
              现有证据指向的客户基础，是大型组织，而不是小额交易型买家。OpenAI、Temus 及相关新闻来源把 Thinking Machines 放在金融服务、
              零售、企业集团和公民组织中；更广的市场证据也表明，这些正是工作流集成、治理和数据清理成本足够高、足以支撑专业实施伙伴的账户。
              实务上，可能的经济买家是资深转型、运营、技术或业务线负责人；日常用户是分析师、一线员工、网点员工和知识工作者；付款方则是企业或项目预算， 而不是团队级信用卡开支。


              从地理看，客户故事仍然先是菲律宾，再逐步扩大到东南亚。这既符合公司的办公室足迹，也符合 Temus 组合。更重要的不是单纯地理， 而是账户质量：TM
              在客户拥有复杂工作流、受监管数据或大规模运营的地方最相关。这提高了买家质量，即便公开客户标识密度仍然有限。


              服务主导的 AI 公司会喜欢这种客户画像，因为成熟买家往往预算更大；一旦建立信任，后续用例也更多。 这也是更难打入的细分市场，因此每一个公开引用都比原始客户标识数更有价值。
