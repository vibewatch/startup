companyProfile:
  summary: >-
    Thinking Machines Data Science, Inc. 是 Stephanie Sy 于 2015 年在 Manila 创立的应用 AI
    和数据工程公司。公开材料把它定位为服务东南亚受监管、数据密集型组织的专家，能力覆盖企业数据平台、 客户智能、文档智能、位置智能和生成式 AI 部署。公司看起来更像服务主导，而不是自助 SaaS 主导：它销售战略、
    实施、部署和赋能工作，同时越来越多地打包可复用解决方案模板和开源地理空间资产。公开客户证明最强的部分来自 EastWest Bank 和 UNICEF 相关工作；OpenAI 合作伙伴身份以及 Temus 在 July 2026
    的战略投资， 进一步增强了外部可信度。即便如此，收入、利润率、留存和融资条款披露仍然稀少。
