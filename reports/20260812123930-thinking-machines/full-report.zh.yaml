      - - 反向逻辑：服务收入占比限制软件式倍数潜力
        - 若能证明平台收入可经常性、可附加销售，或可按使用量变现，投资论证会改善
      - - 反向逻辑：公开记录不支持独角兽叙事
        - 需要披露定价轮或独立估值标记，才足以推翻这一点
