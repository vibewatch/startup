      - number: '8.2'
        title: 可比公司组与融资背景
        blocks:
          - type: paragraph
            body: >-
              最有用的公开可比视角是混合口径：AI / 数据实施公司，以及股权价值仍高度依赖服务收入质量的数字化转型平台。 2026 年 8 月的公开市场读数相当冷。按抓取到的市值和 TTM 收入页面，Endava 约为
              0.15x 收入，Globant 约为 0.65x， EPAM 约为 0.90x，Genpact 约为 1.08x，Accenture 约为 1.47x。换句话说，即便是披露远好得多的可信全球运营商， 2026
              年也不会自动拿到软件式倍数。


              Thinking Machines 理应比通用 IT 服务拿到一定溢价，因为类别更窄、增长更快：企业 AI 采用、受治理的数据平台、地理空间分析都比标准人员外包更有差异化。 但它也应低于软件或前沿 AI
              叙事，因为检索记录仍显示业务由服务牵引、锚定合作伙伴，且经常性收入不透明。


              Temus 交易强化了上述结论，而不是消除它。这是强质量信号，也证明一家严肃区域运营商看到了战略价值。但公开证据仍把它描述为战略投资，
              而不是披露经济条款、价格透明的基准轮融资。因此，投资人可以把这笔交易作为相关性验证，却不能把它当作任何具体私募估值标记合理的证明。
