      - number: '1.3'
        title: 资本基础、伙伴地图和利益相关方重要性
        blocks:
          - type: paragraph
            body: >-
              2026 年最重要的公司事件，是 Temus 于 30 July 2026 宣布的战略投资。尽管财务透明度仍不足，这一公告在运营层面高度重要。 Temus 本身由 Temasek 成立，它把这笔交易定位为：把
              Thinking Machines 十年的交付经验，与一个规模更大的新加坡转型平台结合起来。 公告也明确，Thinking Machines 将继续使用自有品牌，客户项目不会中断；Stephanie Sy
              同时会在 Temus 内担任董事总经理。 公开记录仍未给出经济条款：没有披露投资金额、估值，也没有披露所有权或治理条款。


              更早的外部支持似乎来自 UNICEF Venture Fund 和更广泛的 UNICEF 创新生态。这些来源锚定了公司早期的地理空间与开源阶段， 也提供了本轮检索唯一直接取得的公开融资数字。OpenAI
              的战略重要性在于获客和可信度伙伴，而不是已披露投资方。EastWest Bank 则是有意义的客户证明点，因为它显示了受监管行业内部的生产级 AI 工作。因此，利益相关方地图比不完整的股权结构表更重要。
