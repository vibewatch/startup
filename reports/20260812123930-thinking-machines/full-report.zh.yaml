  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines 的相关市场不是「全部 AI」，而是组织内部规划、治理、集成和运营 AI 与数据系统相关企业支出的更窄切片。 纳入的支出包括数据平台现代化、工作流集成、负责任 AI
              设计、模型赋能、变革管理，以及受监管或数据密集型职能中的部署支持。 排除的支出包括前沿模型训练、芯片制造、超大规模云厂商资本开支和大众消费级 AI 应用。这个区分重要，因为菲律宾标题级 AI
              市场看起来可能很大，但其中只有一小部分能被一家重实施的咨询公司变现。


              公开规模来源仍能提供有用的自上而下锚点。Trade.gov 引用菲律宾 AI 市场将从 2024 年约 US$772 million 增长到 2030 年约 US$3.49 billion，区域来源则显示东南亚
              AI 行业在 2024 年已经超过 US$4 billion，并且快速增长。这些数字确立了有意义的 总可用市场（TAM）。但公开证据没有给出治理密集型企业 AI
              服务在菲律宾的精确可服务市场（SAM）数字，因此更可靠的视角是采用成熟度： 实验普遍、规模化不均、强烈需要能打通概念验证与生产之间缺口的伙伴。


              2026 年实务尽调结论是，市场规模必须和执行深度一起读。在许多买家仍把实验转化为受治理工作流的市场里，像 Thinking Machines 这样的公司能拿到的收入池，更多由交付复杂度和组织变革决定，而不是由
              AI 用户数量简单相加决定。
