        - 没有条款结构，无法评估入场回报账
        - 法律尽调和融资数据室
      - - 伙伴经济性
        - OpenAI、Temus 和云关系的商业机制
        - 品牌光环不等于变现杠杆
        - 伙伴协议摘要和来源管线分析
