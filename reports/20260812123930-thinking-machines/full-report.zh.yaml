  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和市场打法
        blocks:
          - type: paragraph
            body: >-
              Thinking Machines 的公开信息指向一个围绕企业服务而非产品主导软件搭建的收入模式。公司销售数据平台、工作流 AI、生成式 AI
              采用，以及客户智能、文档智能、位置智能等领域化解决方案包周边的咨询与交付工作。联系流程、解决方案描述和面向部署的语言，都指向咨询式范围界定和报价制合同。 公开证据不支持经典自助 SaaS
              销售动作，也不支持规模可观的按用量变现。


              市场打法也看起来原生属于企业销售。公司靠可引用部署、思想领导力和伙伴信号来营销可信度。官网免费课程最适合理解为需求生成， 而不是直接收入证明。OpenAI 合作伙伴身份和 Temus 关系可能扩大线索流和信任，而
              EastWest Bank 等客户引用说明公司能拿下受监管客户； 成功实施后，扩张收入可能随之而来。这类业务大概率通过项目、扩展、赋能，以及可能存在的持续支持入账，而不是通过透明席位定价。


              这也意味着收入确认大概率更多按里程碑或项目发生，而不是默认经常性。财务质量因此取决于初始部署能否可靠扩展为更广的平台、支持或后续实施范围。
