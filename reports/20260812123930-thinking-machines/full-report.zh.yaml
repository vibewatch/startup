      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于披露的估值输入很弱，正确做法不是追求虚假精确，而是守住有边界的情景纪律。悲观情景假设 TM 仍主要是专家服务和实施业务， 区域转化更慢，并按公开市场服务倍数估值。基准情景假设公司能以优于普通咨询的经济性，证明
              AI 交付可以重复， 并因区域稀缺性获得适度溢价。乐观情景假设公司把 Temus 和 OpenAI 光环加上公开客户证明，转化成更产品化、 更可重复的区域平台故事，附着率更强、资本效率更好。


              这些情景最好被看作入场纪律区间，而不是断言管理层今天会接受这些精确标记。公开证据无法提供完整 DCF 或软件式队列模型所需的输入。 但仍能得出一个重要判断：保守假设下，TM
              可支撑估值大概率以数千万至低数亿美元计；只有在高度有利的战略溢价情景下， 才会延伸到低数十亿美元。


              估值区间很宽，但结论仍清晰。公司也许足够好，未来能长成大得多的结果；但公开证据还不足以支撑当下的 $10B 式叙事。 正确的投资姿态是，在支付任何前沿风格价格前，先要求公司按里程碑拿出证据。
