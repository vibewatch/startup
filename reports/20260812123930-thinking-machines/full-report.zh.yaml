      - number: '6.2'
        title: 具名客户证明和采用深度
        blocks:
          - type: paragraph
            body: >-
              EastWest Bank 是客户证明中最清楚的公开锚点。Thinking Machines 自家官网包含 EastWest 关于采用 AI 并将其生产化的直接推荐语； EastWest 官方 2025-2026
              发布也显示，该行继续投资数字开户、客服 AI 和咨询工作流。这些客户侧发布不能证明 Thinking Machines 导致了每一个披露结果，但它们确实把 TM
              的工作放进一个真实环境：数字使用、NPS、投诉减少和 AI 赋能客户体验都是董事会相关话题， 而不是创新剧场。因此，即使归因必须谨慎，EastWest 仍是高质量引用。


              EastWest 之外，证据从具名客户标识转向可信但更薄的证明。stories 名录提到数十个定制 GenAI 应用；UNICEF 相关材料披露了一个东南亚大型电信合同， 以及公共 /
              公民领域对地理空间工作的需求；伙伴来源强调跨行业部署了数百个系统。这个模式与真实采用广度一致，但与整体客户数主张相比， 公开记录仍然缺少足够多可引用案例。


              EastWest 证据也说明了本章该如何阅读客户成果。客户侧银行指标可以验证环境真实且在扩张，即便它们不能干净拆成可归因于 TM 的 ROI。 尽调仍然用得上这些信息，因为它把真实企业项目与幻灯片区分开来。
