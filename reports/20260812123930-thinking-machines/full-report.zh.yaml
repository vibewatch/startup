      - number: '4.2'
        title: 成本结构、单位经济和资本强度
        blocks:
          - type: paragraph
            body: >-
              由于公开产品服务占比高，经济引擎很可能是劳动力。高级顾问、数据工程师、ML 从业者和面向客户的变革专家，可能是主要成本中心； 云 /
              工具转嫁成本、售前、差旅和内部赋能是次要成本。这种结构通常让利用率、人员结构杠杆和变更单纪律成为最重要的毛利率变量。
              也就是说，客户数或培训覆盖等公开牵引代理指标，不如积压订单质量、平均交易规模和转为重复业务的工作占比重要。


              该模式的正面，是相对基础设施重型 AI 企业固定资本开支较低。Thinking Machines 似乎不拥有数据中心或算力集群，
              因此财务风险应更多来自人员成本承诺和营运资本节奏，而不是资产融资。负面在于，项目型业务外部看起来可能很强， 但如果回款慢、范围漂移或扩张工作未能复现，底层会隐藏利润率波动。公开证据没有揭示公司的实际利用率、DSO
              或毛利率画像， 因此单位经济分析仍主要是一张驱动因素地图加尽调问题清单。


              换句话说，业务可能有吸引人的智力杠杆，但没有软件式财务杠杆。可复用加速器能帮忙；但除非它们实质压缩交付工时或提高扩张率， 利润率仍主要由人员经济决定。
