chapter:
  number: 7
  title: Risks
  summary: Digital Edge’s risk profile is dominated by structural APAC data-center issues—power access, financing dependence, environmental scrutiny, and customer concentration—magnified by the company’s limited public disclosure. The most important diligence work is therefore not to discover exotic hidden risk, but to turn the existing structural risks into monitorable thresholds and confirm that management’s mitigations are real.
sections:
- id: risk-stack
  title: The top risks are structural, but disclosure gaps amplify them
  body: 'Digital Edge sits in a sector where several core risks are structural: power access, financing dependence, environmental scrutiny, and competition. What makes the platform harder to underwrite is not that these risks exist — every serious APAC data-center operator faces them — but that public disclosure is thin on the metrics that would let an investor separate manageable exposure from thesis-breaking exposure. The public record is strongest on capital-raising events, facility launches, and certifications. It is weaker on incidents, concentration, and legal contingency planning. That means the correct risk posture is not to assume the business is unusually fragile; it is to assume that structural infrastructure risks remain active until management proves otherwise with private data. This chapter therefore distinguishes sector-wide risk from company-specific opacity, and turns the remaining blind spots into concrete kill criteria and diligence asks rather than vague caution.'
  claimRefs:
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  tableRefs: []
  figureRefs:
  - FR001
- id: regulatory-power
  title: 'Regulatory and power risk: APAC rules can slow growth without shutting it down'
  body: 'Regulatory risk is best understood as a patchwork. In Singapore, IMDA and related agencies still treat data-center expansion as a managed capacity question, while EMA’s materials underline continued system dependence on gas. That does not make Singapore unusable, but it does mean market entry and expansion depend on compliance, efficiency, and policy timing. In the Philippines, EO 119 creates a more explicit domestic-residency framework for government-related data, which can increase local demand but also adds compliance complexity. Newsbytes’ CLOUD Act caveat shows why even a favorable localization rule does not fully solve legal-exposure questions. South Korea presents a different issue: Digital Edge’s own market guide says power approvals are difficult in the Seoul metro, so the gating factor is not customer demand alone. The overall lesson is that regulation mostly changes who can deploy where, how quickly, and under what controls. It rarely acts as a single binary ban, but
    it can still materially alter utilization timing and capex productivity.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR027
  - CR028
