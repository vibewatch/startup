  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: No public outage log, SLA exception history, or postmortem archive by site.
    whyItMatters: Operational risk cannot be calibrated confidently without real incident evidence.
    diligencePath: Request site-level incident history, SLA credits, and customer escalations.
    relatedQuestionRefs:
    - QR018
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: No public top-customer, committed-MW, or pre-lease concentration disclosures.
    whyItMatters: Large campus economics can be dominated by a few buyers.
    diligencePath: Request top-10 customer exposure and pre-lease schedule by campus.
    relatedQuestionRefs:
    - QR015
  - type: private-evidence-only
    severity: minor
    topic: legal-contingency-planning-TR001
    relatedTableRefs:
