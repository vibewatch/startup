- id: architecture
  title: Operating architecture is power, cooling, interconnection, and support
  body: 'The strongest public product evidence sits in Digital Edge’s operating-architecture materials. Interconnection is explicitly central: the company’s technical guides define it as the in-building combination of cross-connects, internet exchanges, cloud on-ramps, and partner ecosystems that determine architecture flexibility after a customer signs. Carrier neutrality is positioned as a design principle rather than a slogan because it affects resilience, cloud access, route diversity, and cost competition among providers. The facility pages then show how this translates physically. SEL2 is marketed as AI ready, while the Korea market guide says the campus can support cabinet density up to 130kW with liquid cooling. NARRA1’s efficiency materials show liquid-cooling innovation in a hot, humid climate, and the Donghwa partnership shows Digital Edge experimenting with alternative energy-storage architecture to lower cooling burden and improve safety. The result is a product stack where
    technical differentiation comes from engineering choices and deployment discipline rather than from software layers exposed to end users.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE009
  - CE010
  - CE011
  - CE018
  - CE019
  - CE028
  - CE029
  - CE039
