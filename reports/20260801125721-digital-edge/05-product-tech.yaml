  - FE003
- id: trust-controls
  title: Trust, quality, and compliance evidence is meaningful but incomplete
  body: Digital Edge has published more trust and quality evidence than many private infrastructure platforms, especially for a company founded in 2020. NARRA1 is the clearest example. The company says the facility achieved ANSI/TIA-942-C Rating-3 and EDGE certification, and it also cites LEED Gold status. The Philippines materials add ISO, SOC 2, and PCI DSS coverage at site level, while the earlier ESG update says all operational sites had ISO 27001, ISO 14001, and ISO 45001 certification and 100% uptime in 2022. The 2026 ESG release extends that narrative with 100% uptime in 2025 and higher renewable-electricity usage. These are meaningful signals, but they are not the same as a transparent incident history. The public record still lacks postmortems, service-level reports, and longitudinal outage data by site. For diligence, the trust stack is directionally strong but still filtered through company-authored materials.
  claimRefs:
  - CE016
  - CE017
  - CE026
  - CE024
  - CE025
  - CE023
  - CE037
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap-dependencies
  title: Roadmap and dependencies show where execution risk lives
  body: 'The facility roadmap is easier to see than the commercial roadmap. Public pages disclose first-phase timing for BOM1, additional Korea phases larger than SEL2, and continued infrastructure densification in Indonesia through Indonet. The Korea guide also shows how external constraints shape the roadmap: Digital Edge says it secured 180MW of utility power, implying that approvals and power rights are gating assets. The same is true in other markets where backhaul, cable landing access, land, water, or partner capabilities determine what can actually be delivered. Peak Energy matters because power cost and renewable sourcing affect long-run operating economics; Indonet matters because resilient local connectivity is part of the product; construction and certification bodies matter because design claims need to survive physical build-out. Public practitioner signal remains thin, however. There is no substantial code, API, or open developer ecosystem. The best external proxies are partner
    pages and local operator surfaces, which is appropriate for a physical-infrastructure business but still leaves investors dependent on management for deeper technical proof and validation directly.'
  claimRefs:
