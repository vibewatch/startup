  evidenceGaps:
  - type: missing-source
    severity: minor
    topic: developer-surface
    missingEvidence: No meaningful public code, package, or API-community footprint was found.
    whyItMatters: This limits third-party technical validation of how much of the product advantage is software versus operations.
    diligencePath: Ask for internal tooling overview, architecture diagrams, and any customer-facing APIs or portals.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: No public site-level outage history, postmortems, or SLA performance reports by facility.
    whyItMatters: Reliability is central to the product promise, so investors need evidence beyond marketing-level uptime claims.
    diligencePath: Request incident logs, SLA reports, and customer reference checks by site.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: minor
    topic: site-utilization
    missingEvidence: Facility-level occupancy, power utilization, and customer mix remain private.
    whyItMatters: These metrics determine whether technical advantages are actually monetized.
    diligencePath: Request a portfolio KPI pack by campus and phase.
    relatedQuestionRefs:
    - QE011
