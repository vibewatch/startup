  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Normalized pricing, cross-connect, and MW economics for Digital Edge versus peers by market and phase.
    whyItMatters: Without like-for-like pricing, the investor cannot judge whether Digital Edge is winning on price, product, or convenience.
    diligencePath: Collect live quotes or signed term sheets in at least India, Japan, and Korea.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: named-customer-overlap
    missingEvidence: Named customer overlap across Digital Edge and the major peers.
    whyItMatters: Knowing whether the same hyperscalers multi-home across these platforms helps estimate stickiness and bargaining power.
    diligencePath: Ask management for top-customer overlap and win/loss examples.
    relatedQuestionRefs:
    - QP017
  - type: private-evidence-only
    severity: minor
    topic: win-rate
    missingEvidence: Win/loss data showing when Digital Edge beats Equinix, Digital Realty, AirTrunk, STT GDC, or Keppel.
    whyItMatters: A differentiated narrative is stronger when paired with evidence that customers actually choose the platform.
    diligencePath: Request anonymized deal-comparison examples by workload and country.
