chapter:
  number: 3
  title: Competitors
  summary: Digital Edge competes in a fragmented APAC data-center field where no single rival dominates every workload. The biggest threats come from Equinix and Digital Realty on ecosystem and balance-sheet depth, and from AirTrunk, STT GDC, Keppel, and GDS on regional scale or local specialization, but there is still room for a sponsor-backed APAC operator that can execute in constrained markets.
sections:
- id: landscape-map
  title: Landscape map and competitive categories
  body: 'Digital Edge does not face one monolithic rival. The competitive map splits into at least four groups. First are global interconnection and platform leaders such as Equinix and Digital Realty, which combine ecosystem density, capital access, and broad metro coverage. Second are APAC hyperscale specialists such as AirTrunk that emphasize huge campus scale and customer-committed megawatts. Third are regional or country-rooted operators such as STT GDC, Keppel, and GDS that can win because of local operating depth, sovereign adjacency, or specific regulatory expertise. Fourth are the substitutes: hyperscaler self-build, direct preleases, and workload migration to public-cloud regions. This matters because Digital Edge’s position is not that of the category king on any single global metric. Instead, it is trying to win where regional APAC execution, interconnection-plus-colocation packaging, and sponsor-backed speed are more important than owning the world’s biggest customer ecosystem.
    That leaves room for Digital Edge, but only in segments where buyers still value local tailoring and project execution over sheer incumbent scale.'
  claimRefs:
  - CP001
  - CP023
  - CP024
  - CP034
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: global-platform-peers
  title: 'Global-platform peers: Equinix and Digital Realty'
  body: 'Equinix and Digital Realty set the scale benchmark. Equinix says it operates 281 data centers globally, 63 across nine APAC countries, more than 10,500 customers, and 513,000 interconnections. That combination creates a true ecosystem moat: customers colocate where counterparties, carriers, and cloud providers already exist. Digital Realty attacks the market from a related but slightly different angle. It says it has more than 300 data centers globally, while its APAC platform highlights 20-plus regional facilities, 230-plus connected customers, and 30-plus cloud providers. Its April 2026 results showed US$1.6 billion of quarterly revenue and a US$1.8 billion backlog, reminding investors that the company can self-fund a larger expansion agenda than most private rivals. For Digital Edge, these peers are both rivals and valuation anchors. They are difficult to match on ecosystem density or financial disclosure, but they also confirm that buyers will pay for operators who can combine
    scale, reliability, cloud adjacency, and AI-ready growth.'
  claimRefs:
