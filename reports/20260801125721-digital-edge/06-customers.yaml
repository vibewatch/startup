  - FU003
- id: durability
  title: 'Durability and expansion: the logic is visible, the metrics are not'
  body: 'The durability logic for a data-center platform is understandable even when the metrics are hidden. Once a customer migrates workloads, attaches carriers, configures cross-connects, and integrates remote-hands processes, switching costs rise. The public materials reinforce that support quality matters after the initial sale; both Dewaweb and VDCI highlight migration and after-sales support, not just facility specs. Digital Edge’s own technical guides also imply that multi-market expansion matters to many buyers, because site selection is partly about what the provider can offer next in the region. Still, the public record does not disclose the metrics investors actually need: no NRR, GRR, churn, renewals, top-customer exposure, or segment mix. Peer filings from Equinix, GDS, and Digital Realty show the missing template. Those companies publish repeat-booking, churn, backlog, or customer-concentration metrics, while Digital Edge does not. The consequence is that the durability thesis
    is directionally plausible but not yet auditable from public evidence alone.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU033
  - CU035
  - CU036
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: risks
  title: Customer concentration and procurement friction remain the key blind spots
  body: 'The main customer risks are concentration and delayed phase fill. Hyperscale and ISP customers can be large enough to shape an entire campus, so the absence of concentration disclosure is not a trivial omission. Public materials also show that expansion depends on customers proving out initial deployments before later phases get financed or built. W.Media’s reporting on the Philippines expansion made that link explicit: the next facility depended on filling the first and securing financing. Similar logic likely applies in Korea and India, where power approvals and campus readiness can become procurement friction even if demand exists. Pricing is another underappreciated issue. Dewaweb’s comments make clear that even satisfied customers still compare commercial value, not just certifications or engineering. The right underwriting conclusion is therefore restrained. Digital Edge has credible evidence of adoption and a customer mix that makes strategic sense, but it has not yet provided
    public breadth, retention, or concentration data sufficient to remove customer-model risk.'
  claimRefs:
  - CU014
  - CU026
  - CU027
  - CU034
