- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Digital Edge’s customer journey appears to move from site-selection diligence to deployment, interconnection attachment, and later-phase expansion.
  data:
    items:
    - label: A buyer chooses a market based on latency, regulation, and power availability.
    - label: Technical diligence tests facility fit, certifications, density, and support model.
    - label: Initial deployment starts as cabinets, a phase commitment, or a core workload migration.
    - label: The account deepens through interconnection, network adjacency, and operational support.
    - label: If the site performs, the customer can add density, extra phases, or adjacent APAC metros.
    - label: Public proof fades after this point because retention and expansion metrics are not disclosed.
