chapter:
  number: 6
  title: Customers
  summary: Digital Edge’s public customer evidence is credible but narrow. The platform clearly addresses real hyperscale, network, ISP, and enterprise demand, and it has a small amount of named proof in Indonesia plus clear early-booking proof in the Philippines, but retention, concentration, and breadth remain largely private.
sections:
- id: segments
  title: 'Customer segmentation: who appears to buy the platform'
  body: 'Digital Edge’s public materials point to a segmented customer base rather than one universal buyer profile. Korea materials emphasize global hyperscalers, cloud providers, local digital champions, conglomerates, and Chinese players. India materials frame the target as build-to-suit hyperscale demand. Philippines materials lean toward cloud, network, digital media, enterprise, and now some AI-ready local deployment logic. The Indonesia subsite adds another angle by showing why carriers, ISPs, and cloud operators might choose the platform for a hybrid mix of data-center and connectivity services. Put together, the public story suggests three economic layers: large hyperscale or AI buyers that anchor phases, network or ISP buyers that deepen ecosystem value, and enterprise or regulated local customers that need certifications, support, and in-country deployment. That is a sensible mix for a carrier-neutral APAC platform, but Digital Edge does not publicly quantify the revenue share
    or durability of each segment.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU015
  - CU028
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof
  title: Named proof is credible but narrow
  body: 'The best named customer proof comes from Indonesia. Multiple Digital Edge Indonesia industry pages carry consistent customer quotations from Dewaweb and VDCI. Dewaweb says it chose Digital Edge Indonesia as the core for Dewacloud because of the modern, well-connected infrastructure and competitive pricing. VDCI says it placed one of its customer core-system workloads at Digital Edge Indonesia because of the high SLA, security, network diversity, and migration support. Those are useful because they are more than logos; they reference concrete workloads and buying reasons. The weakness is breadth. The same two references recur across multiple pages, which suggests they are genuine but also suggests a limited public named-customer bench. In the Philippines, the evidence is real but lower quality: launch materials and BusinessWorld both say NARRA1 had bookings before service launch, including multiple major domestic ISPs, but the customers were not named. That is enough to prove early
    demand, not enough to prove diversified production usage.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU029
  - CU030
  tableRefs:
