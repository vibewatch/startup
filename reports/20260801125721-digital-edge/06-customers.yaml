  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: No public NRR, GRR, churn, renewal, or expansion-rate disclosure.
    whyItMatters: Without these metrics, the durability of the installed base cannot be underwritten directly.
    diligencePath: Request customer-cohort retention, renewals, and expansion data by major segment and metro.
    relatedQuestionRefs:
    - QU014
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: No public top-customer share, segment revenue mix, or committed-MW concentration data.
    whyItMatters: A few hyperscale or ISP accounts could materially shape the economics of an entire campus.
    diligencePath: Request top-10 customer exposure and committed-versus-utilized MW by account.
    relatedQuestionRefs:
    - QU016
  - type: missing-source
    severity: minor
    topic: named-customer-breadth-TU003
    relatedTableRefs:
    - TU003
    missingEvidence: Only two named Indonesia customer references and one unnamed Philippines booking cohort are visible publicly.
