- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and cloud capex boom
    - Positive
    - Now
    - Sustains multi-year demand for new capacity
    - Which markets can actually power dense AI loads?
  - - Power availability and grid delays
    - Negative
    - Now
    - Determines whether demand converts into live supply
    - What utility power is contractually secured by site?
  - - Construction and land inflation
    - Negative
    - Now
    - Raises build cost and can dilute project IRRs
    - How much contingency is embedded in current capex?
  - - Singapore policy tightening
    - Mixed
    - Now
    - Raises compliance bar and can push spillover to nearby markets
    - Which workloads still justify Singapore versus Johor/Thailand?
  - - India land, tariff, and policy support
    - Positive
    - Now
    - Improves odds of large-campus execution
    - Can BOM phases land on schedule and budget?
  - - Korean power scarcity
    - Negative
    - Now
    - Makes capacity highly valuable but harder to expand
    - How firm are approvals and next-phase assumptions?
  - - Philippines in-country demand
    - Positive
    - Now
    - Creates selective local demand for latency and sovereignty-sensitive workloads
    - How much demand is structural versus still optional?
  notes: Frames the market as power-first rather than demand-first, which is how buyers and operators increasingly have to underwrite APAC capacity.
