  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Current occupied MW, utilization, and share by city or corridor for Digital Edge.
    whyItMatters: Without city-level live utilization and leased MW, public TAM/SAM discussion cannot convert into market-share or saturation judgment.
    diligencePath: Request leased MW, live MW, and preleased pipeline by country and campus.
    relatedQuestionRefs:
    - QM022
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A management bridge showing how Digital Edge uses value, supply, and capital-intensity lenses internally when sizing markets.
    whyItMatters: Different analyst lenses can create false precision if they are merged into one headline TAM.
    diligencePath: Ask management for its own market-sizing deck and unit definitions.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: buyer-segmentation
    missingEvidence: Named customer segmentation by revenue or MW across hyperscalers, enterprises, and regulated verticals.
    whyItMatters: Buyer mix influences pricing power, lease structure, and concentration risk.
    diligencePath: Request customer mix by vertical and workload type.
    relatedQuestionRefs:
