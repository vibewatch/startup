companyProfile:
  summary: Digital Edge is a private APAC data-center and digital-infrastructure company founded in 2020 and headquartered in Singapore. Backed by Stonepeak, it develops and operates interconnection, colocation, hyperscale edge, and related fiber infrastructure across major Asia-Pacific markets including Japan, Korea, India, Malaysia, Indonesia, and the Philippines. Public evidence supports a platform that has scaled materially and remained financeable, but the company still discloses far less operating and cap-table detail than investors would need for conviction pricing.
  foundedDate: '2020-01-01'
  foundingLocation: Singapore
  headquarters: Singapore
  productSummary: Digital Edge sells multi-country data-center capacity, interconnection, carrier-neutral connectivity, and related campus infrastructure for hyperscale cloud, AI, and enterprise workloads.
  customerFocus: Hyperscale cloud, AI, network, and enterprise customers needing APAC capacity, interconnection, and regional campus coverage.
  businessModel: Develop, finance, and operate multi-phase APAC data-center campuses, monetizing space, power, interconnection, and related services while funding growth with sponsor equity, project debt, and HoldCo financing.
  stage: Late-stage private digital-infrastructure platform
  fundingStatus: January 2025 brought more than US$1.6 billion of new equity and debt capital, followed by a US$575 million HoldCo financing in May 2026; public sources still do not disclose a post-money valuation or preference stack.
