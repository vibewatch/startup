  topStrengths:
    - Stonepeak sponsorship, repeated lender support, and multi-country campus execution make Digital Edge more credible than a typical opaque private infrastructure company.
    - The platform's disclosed footprint and 1.8GW secured-power narrative align with the scarcity thesis driving APAC hyperscale and AI infrastructure valuations.
    - Digital Edge has shown continued financing access through both January 2025 equity-plus-debt funding and the May 2026 HoldCo facility.
    - The company is positioned across several important APAC demand corridors rather than depending on a single market.
  topRisks:
    - Revenue, EBITDA, utilization, backlog, and cap-table terms remain undisclosed, making valuation support weak relative to company quality.
    - Customer concentration and signed-versus-billed demand are still only partially visible in public sources.
    - Data-center campus economics remain highly sensitive to power access, construction timing, and refinancing conditions.
    - Competitive pressure from larger regional and global operators could compress returns if Digital Edge fails to convert scarcity into differentiated economics.
    - The public record does not show IPO-grade disclosure readiness, limiting exit-readiness confidence.
  unresolvedGaps:
    - Current post-money valuation, common-equity pricing, and liquidation-preference stack.
    - Audited revenue, EBITDA, utilization, and backlog by campus or phase.
    - Top-customer concentration, renewal behavior, and signed-versus-billed MW by market.
    - Evidence that 1.8GW secured IT power converts into economically attractive and timely campus fill.
    - Management-standard disclosure on capex intensity, returns, and timing for the largest future campuses.
