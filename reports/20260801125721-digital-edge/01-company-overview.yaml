callouts:
- calloutType: insight
  title: Why the overview matters for later chapters
  body: Digital Edge already looks like a scaled infrastructure platform, not a speculative greenfield concept. The core open question is not whether it exists or whether Stonepeak backs it; the real diligence challenge is reconciling changing scale definitions and understanding whether the financing stack, customer mix, and operating metrics justify treating the latest footprint claims as durable rather than promotional.
  claimRefs:
  - CO003
  - CO005
  - CO023
  - CO037
- calloutType: risk
  title: The biggest underwriting gap is still disclosure depth
  body: The public record gives strong evidence on funding access, country expansion, and leadership, but it remains thin on revenue quality, EBITDA, occupancy, customer concentration, and valuation mechanics. That means the company can clear an existence-and-scale test while still failing a price-discipline test if investors cannot get management-level financial detail.
  claimRefs:
  - CO034
  - CO035
  - CO038
