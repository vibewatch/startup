- id: current-scale-and-open-gaps
  title: Latest scale markers versus open underwriting gaps
  body: 'The most important nuance in the overview is that Digital Edge’s public scale counters have moved materially over time. The January 2025 raise framed the business as a 21-data-center platform with 500-plus megawatts of IT load and 300 megawatts held for future development across six countries. The April 2026 ESG release, by contrast, described a 31-data-center portfolio, 1.8 gigawatts of secured IT power, and operations across nine countries. That newer disclosure is directionally positive because it implies expansion continued after the big 2025 raise and was paired with operating signals such as 100% uptime in 2025 and growing renewable-electricity use. But the change also creates a diligence obligation: investors need management to explain exactly which assets, development stages, and geographies moved between those definitions. Public disclosure remains especially thin on revenue, EBITDA, utilization, customer concentration, headcount, and valuation mechanics. In other words,
    Digital Edge looks real, funded, and strategically relevant, but it is not yet fully underwritable from public information alone.'
