  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: scale-definition
    missingEvidence: Management reconciliation of how January 2025 and April-May 2026 platform counts map to operating assets, construction, secured power, and country scope.
    whyItMatters: A moving denominator can distort utilization, capital intensity, and valuation comparisons across time.
    diligencePath: Request a campus-by-campus asset list showing live MW, under-construction MW, secured power, and country inclusion rules for each public disclosure.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current valuation, preference stack, and any 2025-2026 equity pricing information.
    whyItMatters: Recommendation and dilution analysis remain incomplete without a price anchor and economic rights.
    diligencePath: Request cap-table summary, latest financing documents, and board-approved fair-value materials.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, EBITDA, occupancy, and customer concentration data for the live portfolio.
    whyItMatters: These are the core inputs required to turn infrastructure scale into an underwriting case.
    diligencePath: Ask for 2024-2026 management reporting by campus and customer concentration cut.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: executive-bios
    missingEvidence: Founder-by-founder origin narrative beyond the general statement that the business was founded by a seasoned management team.
    whyItMatters: Clear founder-market-fit evidence helps distinguish true operator DNA from sponsor assembly.
    diligencePath: Request a concise founding chronology and bios for the launch team.
    relatedQuestionRefs:
    - QO001
