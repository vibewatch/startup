company:
  name: Digital Edge
chapter:
  number: 1
  title: Company Overview
  summary: Digital Edge is a Singapore-headquartered, Stonepeak-backed APAC data-center platform that moved from a 21-site, 500+ MW historical snapshot in early 2025 to a 31-site, 1.8 GW secured-power narrative by spring 2026. Public evidence is strong on sponsor backing, financing access, and country expansion, but still weak on revenue quality, customer concentration, and valuation.
sections:
- id: identity-and-footprint
  title: Identity, product scope, and footprint
  body: 'Digital Edge is best understood as a sponsor-backed APAC digital-infrastructure platform rather than a software startup or a domestic retail-colocation business. Across its homepage, about page, and product pages, the company presents a combined offer spanning colocation, interconnection, hyperscale edge capacity, and related fiber solutions for hyperscale cloud and enterprise customers. The January 2025 capital-raise release gives the clearest historical operating snapshot: 21 data centers, more than 500 megawatts of critical IT load in service and under construction or development, and another 300 megawatts reserved for future projects across Japan, Korea, India, Malaysia, Indonesia, and the Philippines. Those disclosures establish that by early 2025 the company already had real regional scale, not merely signed land options. They also clarify the customer problem being solved: Digital Edge is trying to give sophisticated buyers a regional platform that combines deployment speed,
    local regulatory navigation, and interconnection choice across multiple Asian markets rather than a single-market point solution.'
  claimRefs:
  - CO001
  - CO002
  - CO004
  - CO008
  - CO009
  - CO010
  - CO011
  tableRefs:
  - TO001
  figureRefs:
