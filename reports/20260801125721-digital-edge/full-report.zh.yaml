  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：跟踪公司，不要押注未知价格
        blocks:
          - type: paragraph
            body: >-
              Digital Edge
              看起来是一个严肃平台。它有发起方支持、反复获得贷款方支持、庞大且仍在增长的亚太版图，以及一个已锁定电力叙事；这个叙事与稀缺数据中心资产为什么能拿到溢价估值方向一致。但这些都没有回答最重要的投资问题：你要付什么价格，这个价格下面是什么经济性？2025
              年 1 月融资披露了 US$640M 股权和 US$1.0B 债务，但没有披露投后估值。2026 年 HoldCo
              融资增加了贷款方信心，却仍没有解决普通股估值。因此一个简单建议无法回避：仅基于公开证据，正确姿态是跟踪或继续研究，而不是买入，也不是否定。公司可能值得认真关注，但在管理层开放 KPI
              和股权结构资料室、或带价格融资能与可比对象三角校验之前，价格纪律门槛无法被可靠确定。
