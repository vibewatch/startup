      - number: '2.2'
        title: 谁在购买，需求如何转化为部署
        blocks:
          - type: paragraph
            body: >-
              买家地图比“任何使用云的公司”具体得多。Digital Edge 自己的市场材料把超大规模厂商、全球云提供商、本地数字冠军、电信运营商、受监管企业和 AI
              密集型业务，列为印度、韩国和菲律宾的需求锚点。采购流程也不同于标准托管短名单。Digital Edge
              的超大规模指南把真正的承销问题放在多阶段可选性上：电力增量能否按时到位，相邻空间是否真的可预留，互联能否随部署演进，运营商能否持续扩容而不迫使客户重做设计。AI
              基础设施指南还补充说，单靠密度不够；买家会同时筛选冷却策略、互联、市场匹配和增长路径。因此预算负责人通常是基础设施、网络、云容量或平台团队，他们评估的是整体部署韧性，而不只是找最低价机柜。实际来看，Digital
              Edge 的市场是那些在意低摩擦扩展的客户，而不只是需要第一天有机架可用的买家。
