  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：谁看起来在购买这个平台
        blocks:
          - type: paragraph
            body: >-
              Digital Edge
              的公开材料指向分层客户群，而不是一个通用买家画像。韩国材料强调全球超大规模厂商、云提供商、本地数字冠军、财阀和中国玩家。印度材料把目标描述为定制建设型超大规模需求。菲律宾材料偏向云、网络、数字媒体、企业，以及现在部分
              AI 就绪本地部署逻辑。印度尼西亚子站则补充了另一个角度，说明运营商、ISP 和云运营商为什么可能为数据中心与连接服务的混合组合选择这个平台。合在一起，公开故事暗示三层经济结构：锚定各阶段的大型超大规模或 AI
              买家；加深生态价值的网络或 ISP 买家；以及需要认证、支持和本地部署的企业或受监管本地客户。对一个运营商中立的亚太平台来说，这个组合合理，但 Digital Edge 没有公开量化各细分的收入占比或耐久性。
