              设施路线图比商业路线图更容易看清。公开页面披露了 BOM1 的一期时间、韩国大于 SEL2 的后续阶段，以及通过 Indonet 在印度尼西亚继续加密基础设施。韩国指南也显示外部约束如何塑造路线图：Digital
              Edge 称已锁定 180MW 公用事业电力，意味着审批和电力权利是关口资产。其他市场也是如此，回传、海缆登陆接入、土地、水或合作伙伴能力决定了最终能交付什么。Peak Energy
