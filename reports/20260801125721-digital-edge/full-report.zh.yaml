      - number: '2.4'
        title: 什么会拖慢采用，对 Digital Edge 意味着什么
        blocks:
          - type: paragraph
            body: >-
              市场来源反复给出的最强信号是，需求不是瓶颈，执行投入才是。JLL 称电力可得性正在引导开发选择，电网接入延迟从新兴市场的 24 个月到核心市场的 8 年以上不等。CBRE
              又把土地成本、建设通胀、液冷要求和可持续合规加入压力清单。Cushman 从另一个角度讲述同一件事：管线巨大，空置率小幅下降，即使交付量很大，市场仍能吸收供给。Deloitte
              的结论是，电力必须被当成核心基础设施，因为亚太电力需求本来就在上升，而数据中心需求到 2030 年代中期可能增加五倍。Digital Edge
              自己的写法也与这个观点一致：可再生能源、冷却、互联和分阶段增长都在商业决策内部，而不是外部附加项。结果是一个有利但有纪律的市场判断：需求足以支持 Digital Edge
              继续扩张，但前提是每个项目都要匹配正确的本地电力、许可和客户背景。
            claimRefs:
