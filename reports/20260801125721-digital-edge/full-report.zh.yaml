      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 为什么概览会影响后续章节
            body: >-
              Digital Edge 已经像一个规模化基础设施平台，而不是投机性的绿地概念。核心未解问题不是它是否存在、Stonepeak
              是否支持它；真正的尽调难题，是把不断变化的规模定义对齐，并判断融资结构、客户组合和运营指标是否足以让最新足迹主张被视为耐久，而不只是宣传。
            calloutType: insight
            claimRefs:
