  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局地图和竞争类别
        blocks:
          - type: paragraph
            body: >-
              Digital Edge 面对的不是一个单一巨型对手。竞争地图至少分成四组。第一组是 Equinix、Digital Realty 等全球互联和平台领导者，它们把生态密度、资本获取和广泛城市覆盖结合起来。第二组是
              AirTrunk 等亚太超大规模专业公司，重点是巨型园区规模和已获客户承诺的兆瓦。第三组是 STT GDC、Keppel、GDS
              等区域或本国根基运营商，它们可能凭本地运营深度、主权邻近性或特定监管经验取胜。第四组是替代方案：超大规模厂商自建、直接预租，以及工作负载迁移到公有云区域。这一点重要，因为 Digital Edge
              的位置不是任何单一全球指标上的品类之王。它想赢的场景，是区域亚太执行、互联加托管打包和发起方支持的速度，比拥有全球最大客户生态更重要的场景。这给 Digital Edge
              留出了空间，但只限于买家仍把本地定制和项目执行看得比既有巨头规模更重要的细分市场。
            claimRefs:
