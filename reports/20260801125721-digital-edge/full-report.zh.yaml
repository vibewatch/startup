      - number: '1.2'
        title: 管理层、董事会变化和治理信号
        blocks:
          - type: paragraph
            body: >-
              管理层故事重要，因为基础设施执行高度依赖人，放贷方信心通常跟着运营者信誉走。Digital Edge 在 2025 年 2 月的交接中，让创始高管 John Freeman 出任 CEO，同时将 Samuel
              Lee 转为高级顾问，这更像有计划的接班，而不是危机式换帅。同一公告还新增 Maile Kaiser 和 Eanna Murphy 为非执行董事，在平台更强力押注面向 AI
              的增长时，为董事会补上更多数据中心运营深度。公开董事页面和关于页面也显示，管理梯队偏重资本、法律、商业和建设执行：Jonathan Walbridge 负责财务，Yaniv Ghitis 负责商业和投资，Joe
              Bauerschmidt 负责合规，Mervyn Chan 负责设计和建设，John Yung 负责 IT。Andrew Thomas 将治理直接连回
              Stonepeak，进一步说明发起方不是被动股东。这对执行支持是正面信号，但也意味着外部投资者应把发起方影响力视为治理的一阶变量。
