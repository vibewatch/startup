  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：变现对象较清楚，金额仍不清楚
        blocks:
          - type: paragraph
            body: >-
              公开材料足以理解 Digital Edge
              的变现形态，却不足以搭建真正预测。公司显然销售托管容量、互联和相关连接，而不只是无差异的空间和电力。菲律宾指南和互联指南描述了基于机柜的托管、交叉连接、云接入入口、互联网交换参与、运营商中立接入和运营支持。这支持一个工作判断：Digital
              Edge
              的收入结构可能类似其他运营商中立的数据中心平台，主要是与已安装容量和连接挂钩的经常性月费，再加较小的非经常性安装或专业服务部分。缺失的是价格披露。公司不发布标准化机架、机柜、交叉连接或每兆瓦价格表，也不披露实际折扣。因此，公开证据支持收入质量方向上较高，但不能证明已实现收益率、产品组合或各市场客户经济性。收入确认也只能从同业文件推断，而不是来自
              Digital Edge 自己的会计披露。
