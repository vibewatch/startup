      - number: '4.4'
        title: 财务结论，以及仍阻挡承销的缺口
        blocks:
          - type: paragraph
            body: >-
              Digital Edge
              的公开财务故事可信，但披露不足。可信，是因为公司反复吸引大额资本，拿到项目层面和公司层面债务，并在土地、电力和许可都难以拼齐的市场继续新增园区。披露不足，是因为真正决定价值的指标仍缺席：收入、EBITDA、利用率、流失率、客户集中度、已签约但未计费积压订单、每机架或每兆瓦实际价格、按产品划分的毛利率，以及账上现金。同业文件说明这些字段为什么重要。经常性收入模型看起来可以很强，但资本开支、能源或债务负担仍会侵蚀自由现金流。Digital
              Edge
              的公开材料支持把它归为后期私营基础设施平台，但不支持完整自下而上的模型。因此正确结论是两段式：底层合同和资产具备粘性，收入质量可能好于普通创业公司；但利润率质量、增量资本回报和真实跑道仍是尽调问题，管理层必须用私有
              KPI 包和设施级财务直接回答。
