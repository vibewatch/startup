      - number: '4.2'
        title: 资本结构和建设需求主导财务故事
        blocks:
          - type: paragraph
            body: >-
              Digital Edge 的财务叙事本质上围绕资本获取。公司在 2025 年 1 月宣布获得超过 US$1.6B 新资本，大致分为 US$640M 股权和 US$1.0B 债务；2026 年 5 月又完成
              US$575M HoldCo 信贷安排。这个顺序重要。它显示 Digital Edge
              并不是依赖单一发起方支票或一次性融资事件；随着版图扩张，公司正在叠加发起方股权、项目债务、绿色贷款、收购债和公司层面债务。项目案例凸显了需求有多大。2023 年印度 JV 描述了一个 US$2B、300MW、占地
              47 英亩的绿地项目；后来的印度页面在同一地块上营销 350MW 园区，意味着范围扩大或计数方式变化。仅 SEL2 一期就背负 KRW440B 绿色贷款，园区层面预计总项目成本约
              KRW1T。对投资者而言，偿付能力分析不是经典创业公司的烧钱问题，而是分阶段容量能否持续以可接受条款吸引债务和股权的问题。
