          - type: callout
            title: 最大的承销缺口仍是披露深度
            body: >-
              公开记录在融资能力、国家扩张和管理层上给出了强证据，但在收入质量、EBITDA、入住率、客户集中度和估值机制上仍然很薄。这意味着公司可以通过存在性和规模测试，但如果投资者拿不到管理层级别的财务细节，它仍可能过不了价格纪律测试。
