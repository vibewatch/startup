      - number: '7.4'
        title: 杀手条件应盯住可度量滑坡，而不是叙事变化
        blocks:
          - type: paragraph
            body: >-
              投后最有用的风险姿态，是可监控。韩国投资逻辑破裂的样子，可能是电力审批滑坡、阶段时间表大幅后移，或所谓优势站点没能落地高密度 AI
              需求。菲律宾投资逻辑破裂的样子，可能是首个设施填充太慢，无法支撑后续阶段，或监管顺风没能转化为真实客户需求。融资逻辑破裂会体现在贷款方参与变弱、再融资条款更苛刻，或增长需要用出乎意料、稀释严重的股权来支持。客户模型风险应通过已承诺兆瓦中的头部客户占比、已签约但未利用的积压订单，以及现有账户复购来监控。运营风险应通过实际事故日志、在线时间例外，以及新能源、冷却或支持系统是否如宣传那样运转来监控。公开记录今天不足以回答这些问题，但足以定义管理层在投资者有把握承销之前必须提供的仪表盘。
