      - number: '2.3'
        title: 增长走廊，以及为什么亚太不是一个市场
        blocks:
          - type: paragraph
            body: >-
              亚太不是单一运营环境，Digital Edge 自己的文章也强化了这一点。印度有吸引力，因为超大规模需求上升，支持性政策和较低工业电价可以让大型园区更容易融资，Navi Mumbai 又为面向 AI
              的增长提供了少见的电力、光纤和土地规模组合。韩国拥有来自超大规模厂商、本地平台和财阀的深度需求，但也是最难锁定电力的市场之一，首尔都会区尤其如此。菲律宾又不同：Digital Edge
              的材料把它描述为延迟和控制权决策，政府数据受 EO 119 的驻留规则约束，但私营部门没有一刀切本地化要求。与此同时，新加坡仍具战略重要性，但供给受限，因此 CBRE 明确指出需求会外溢到
              Johor、泰国等邻近市场。所以 Digital Edge
              的市场机会不在一个均匀的区域池子里，而在若干走廊中：印度和东南亚提供绿地规模，韩国和日本提供高端稀缺容量，菲律宾则服务那些延迟、主权和认证都重要的本地部署。
            claimRefs:
