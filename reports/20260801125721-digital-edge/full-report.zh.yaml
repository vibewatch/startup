      - number: '3.4'
        title: 切换成本、替代方案和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              即便数据中心供给受限，这仍是一个结构性竞争市场。大客户可以自建、预租整个园区，或按工作负载和地理位置在多家运营商之间多宿部署。这限制了绝对锁定。与此同时，切换成本并不低。互联密度、迁移复杂度、路由设计、冷却路径和未来阶段确定性，都会让关键任务部署一旦落地就很难更换运营商。这也是为什么
              Equinix 和 Digital Realty 在企业权重高的环境里维持强护城河，而 AirTrunk 在规模和园区跑道占主导的场景里获胜。Digital Edge
              的挑战，是建立足够的本地信誉和运营可靠性，让买家即便面对其更小的全球品牌和更低的披露水平，仍愿意选择它。机会真实存在，因为地理仍在切分市场；商品化风险也真实存在，因为上市巨头、私营超大规模专业公司和自建计划都在争夺同一批云和
              AI 预算。
