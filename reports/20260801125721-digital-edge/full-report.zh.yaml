    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围和覆盖版图
        blocks:
          - type: paragraph
            body: >-
              与其把 Digital Edge
              看成软件创业公司或单一国内零售托管商，不如把它理解为一个由发起方支持的亚太数字基础设施平台。公司在官网、关于页面和产品页中，把自身方案打包成托管、互联、超大规模边缘容量，以及面向超大规模云和企业客户的相关光纤解决方案。2025
              年 1 月融资公告给出了最清晰的历史运营快照：21 个数据中心，已投运、在建或开发中的关键 IT 负载超过 500 兆瓦，另有 300
              兆瓦为日本、韩国、印度、马来西亚、印度尼西亚和菲律宾的未来项目预留。这些披露说明，到 2025 年初，公司已经拥有真实的区域规模，而不只是签了土地期权。它们也厘清了公司要解决的客户问题：Digital Edge
              试图给成熟买家提供一个区域平台，在多个亚洲市场同时交付部署速度、本地监管穿透力和互联选择，而不是一个单一市场的点状方案。
