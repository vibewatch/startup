    summary: 公开证据显示，从市场需求到上线部署的路径清晰可见，但部署后扩张指标几乎不可见。
    data:
      nodes:
        - id: n1
          label: 锁定目标细分
        - id: n2
          label: 设施 / 市场尽调
        - id: n3
          label: 初始预订或迁移
        - id: n4
          label: 在线工作负载与支持
        - id: n5
          label: 分期扩张或重复使用
      edges:
        - from: n1
          to: n2
          label: 筛选
        - from: n2
          to: n3
          label: 签约
        - from: n3
          to: n4
          label: 部署
        - from: n4
          to: n5
          label: 成功后扩张
    claimRefs:
      - CU010
      - CU005
      - CU007
      - CU018
      - CU038
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    summary: 公开证据质量在两条印度尼西亚客户背书上最高；其他市场较弱，因为具名客户证据稀少。
    data:
      columns:
        - 证据质量
        - 留存可见度
        - 广度可见度
      rows:
        - label: Dewaweb
          values:
            - label: 高
              tone: positive
            - label: 低
              tone: warning
            - label: 低
              tone: warning
        - label: VDCI
          values:
            - label: 高
              tone: positive
            - label: 低
              tone: warning
            - label: 低
              tone: warning
        - label: 菲律宾 ISP 预订
          values:
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 中
              tone: neutral
        - label: 韩国 / 印度需求论点
          values:
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 中
              tone: neutral
    claimRefs:
      - CU029
      - CU030
      - CU031
      - CU032
  - id: FU004
    title: 采用与留存韧性路径
    type: flow
    summary: 关键缺口在于：可信的初始赢单还没有转化为透明、可重复、更多元的留存。
    data:
      nodes:
        - id: a1
          label: 首个具名或已预订客户
        - id: a2
          label: 成功迁移 / 上线运营
        - id: a3
          label: 互联与支持附加
        - id: a4
          label: 追加分期或都会区
        - id: a5
          label: 多元耐久客户底座
      edges:
        - from: a1
          to: a2
          label: 验证服务
        - from: a2
          to: a3
          label: 加深使用
        - from: a3
          to: a4
          label: 扩大版图
        - from: a4
          to: a5
          label: 降低集中度
    claimRefs:
      - CU033
      - CU027
      - CU037
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最重的残余风险集中在电力获取、融资和分期执行，而不是某一项单独法律禁令。
    data:
      columns:
        - 发生概率
        - 残余严重度
      rows:
        - label: 电力审批 / 容量权益
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: warning
        - label: 再融资 / 资本获取
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: warning
        - label: 客户集中度不透明
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: warning
        - label: 环保审查
          values:
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
        - label: 新技术落地
          values:
            - label: 中低
              tone: neutral
            - label: 中
              tone: neutral
    claimRefs:
      - CR009
      - CR012
      - CR017
      - CR004
      - CR020
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 大多数风险最终会传导到利用率节奏、融资成本、客户转化或估值。
    data:
      nodes:
        - id: d1
          label: 电力 / 监管约束
        - id: d2
          label: 分期延误或密度降低
        - id: d3
          label: 客户填充与留存
        - id: d4
          label: 融资成本 / 再融资
        - id: d5
          label: 估值与论点韧性
      edges:
        - from: d1
          to: d2
          label: 拖慢建设
        - from: d2
          to: d3
          label: 削弱供给匹配
        - from: d2
          to: d4
          label: 拉长资本需求
        - from: d3
          to: d4
          label: 削弱贷款人信心
        - from: d4
          to: d5
          label: 压缩回报
    claimRefs:
      - CR001
      - CR009
      - CR018
      - CR012
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: 这套平台同时依赖外部电力、资本、客户和本地伙伴。
    data:
      nodes:
        - id: p1
          label: 公用事业公司 / 监管机构
        - id: p2
          label: 贷款人 / 资本提供方
        - id: p3
          label: 本地伙伴 / 认证方
        - id: p4
          label: 锚定客户
        - id: p5
          label: 平台执行质量
      edges:
        - from: p1
          to: p5
          label: 核准容量
        - from: p2
          to: p5
          label: 为分期供资
        - from: p3
          to: p5
          label: 打通本地交付
        - from: p4
          to: p5
          label: 填满园区
    claimRefs:
      - CR025
      - CR012
      - CR017
      - CR018
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 建议维持在跟踪 / 继续研究，因为平台质量看得见，但价格支撑还看不见。
    data:
      nodes:
        - id: f1
          label: 平台真实亮点
          detail: APAC 版图、发起方背书、已锁定电力、贷款人支持
        - id: f2
          label: 可比稀缺信号
          detail: AirTrunk、NEXTDC、上市数据中心龙头
        - id: f3
          label: 缺失的估值输入
          detail: 缺少当前价格、股权结构、收入、EBITDA 或在手订单
        - id: f4
          label: 高残余风险
          detail: 重资本、集中度、监管、分期填充
        - id: f5
          label: 跟踪 / 继续研究
          detail: 只有守住价格纪律并拿到 KPI 数据才介入
      edges:
        - from: f1
          to: f5
        - from: f2
          to: f5
        - from: f3
          to: f5
        - from: f4
          to: f5
    claimRefs:
      - CV002
      - CV004
      - CV010
      - CV018
      - CV028
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 示意性敏感性表明，可支撑估值随验证状态抬升，而不是只靠叙事抬升。
    data:
      items:
        - label: 分期填充偏弱 / 资本更紧
          value: 4.5
          unit: USD B
        - label: 基准不透明折价
          value: 8.5
          unit: USD B
        - label: KPI 走强空间
          value: 11
          unit: USD B
        - label: 有验证支撑的 AirTrunk 式稀缺性
          value: 15
          unit: USD B
        - label: AirTrunk M&A 基准
          value: 15.6
          unit: USD B
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 区间视角把 Digital Edge 放到区域上市可比公司和私有市场稀缺基准旁边衡量。
    data:
      items:
        - label: 区域上市可比公司组
          low: 6.6
          mid: 7.15
          high: 8
          unit: USD B
        - label: 悲观情形
          low: 4
          mid: 5
          high: 6
          unit: USD B
        - label: 基准情形
          low: 7
          mid: 8.5
          high: 10
          unit: USD B
        - label: 乐观情形
          low: 12
          mid: 15
          high: 18
          unit: USD B
        - label: AirTrunk 私有市场基准
          low: 13
          mid: 15.6
          high: 18
          unit: USD B
    claimRefs:
      - CV007
      - CV009
      - CV024
      - CV025
      - CV026
      - CV010
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: IC 式评分卡把公司质量和估值支撑质量拆开看。
    data:
      items:
        - label: 市场 / 稀缺性
          value: 8
          unit: /10
          status: strong
        - label: 平台验证
          value: 7
          unit: /10
          status: strong
        - label: 经济性可见度
          value: 3
          unit: /10
          status: weak
        - label: 客户可见度
          value: 4
          unit: /10
          status: mixed
        - label: 资本获取
          value: 8
          unit: /10
          status: strong
        - label: 估值支撑
          value: 4
          unit: /10
          status: mixed
        - label: 退出准备度
          value: 5
          unit: /10
          status: mixed
    claimRefs:
      - CV004
      - CV002
      - CV018
      - CV035
      - CV036
      - CV038
      - CV045
