      - number: '6.3'
        title: 耐久性与扩张：逻辑看得见，指标看不见
        blocks:
          - type: paragraph
            body: >-
              即便指标被隐藏，数据中心平台的耐久性逻辑仍不难理解。客户一旦迁移工作负载、接入运营商、配置交叉连接并整合远程运维流程，切换成本就会上升。公开材料也强调初始销售之后的支持质量很重要；Dewaweb 和 VDCI
              都强调迁移和售后支持，而不只是设施规格。Digital Edge 自己的技术指南也暗示，多市场扩张对许多买家重要，因为选址部分取决于服务商接下来能在区域内提供什么。不过，公开记录没有披露投资者真正需要的指标：没有
              NRR、GRR、流失率、续约、头部客户敞口或细分组合。Equinix、GDS 和 Digital Realty 的同业文件展示了缺失模板。这些公司披露复购、流失、积压订单或客户集中度指标，Digital Edge
              没有。结果是，耐久性论点方向上可信，但仅靠公开证据还无法审计。
