  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最大风险是结构性的，但披露缺口会放大它们
        blocks:
          - type: paragraph
            body: >-
              Digital Edge
              所在行业有几类核心风险本来就是结构性的：电力获取、融资依赖、环境审查和竞争。让这个平台更难承销的，并不是这些风险存在——每个严肃的亚太数据中心运营商都要面对它们——而是公开披露缺少能让投资者区分可管理敞口和破坏投资逻辑敞口的指标。公开记录在融资事件、设施上线和认证上最强；在事故、集中度和法律应急计划上较弱。因此正确的风险姿态，不是假设业务异常脆弱，而是假设结构性基础设施风险仍在发挥作用，直到管理层用私有数据证明相反。本章因此区分行业共性风险和公司特有不透明度，并把剩余盲点转化为具体杀手条件和尽调问题，而不是泛泛谨慎。
            claimRefs:
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR009
              - CR012
              - CR017
              - CR004
              - CR020
      - number: '7.2'
        title: 监管和电力风险：亚太规则会拖慢增长，但不一定关上门
        blocks:
          - type: paragraph
            body: >-
              监管风险最好理解为拼布格局。在新加坡，IMDA 及相关机构仍把数据中心扩张视为受管理的容量问题，EMA
              材料则强调系统仍依赖天然气。这不意味着新加坡不能用，但市场进入和扩张取决于合规、效率和政策时点。在菲律宾，EO 119
              为政府相关数据建立了更明确的本地驻留框架，这可能增加本地需求，也会增加合规复杂度。Newsbytes 对 CLOUD Act
              的提醒说明，即使本地化规则有利，也不能完全解决法律敞口问题。韩国呈现另一个问题：Digital Edge
              自己的市场指南称首尔都会区电力审批困难，所以关口因素不只是客户需求。总体经验是，监管主要改变谁能在哪里部署、部署多快、需要哪些控制。它很少成为单一的二元禁令，但仍可能实质性改变利用率时点和资本开支效率。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
