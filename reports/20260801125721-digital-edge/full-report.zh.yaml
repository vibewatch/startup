            body: >-
              Digital Edge 的产品不是打包软件
              SKU，而是由多个运营模块拼成的区域基础设施服务：托管容量、运营商中立互联、远程运维支持，以及日益整合的光纤或本地网络能力。公开材料显示，公司会根据市场销售这个组合的不同形态。在日本，OSA1
              被营销为靠近核心网络中心的自建高功率密度设施，OSA2 则面向关键任务外包和灾备。菲律宾的 NARRA1 被定位为服务网络、云、数字内容和企业买家的大型运营商中立园区。印度 BOM
              园区则被包装成灵活的超大规模定制建设容量。这种组合说明，产品线的重点不是一个完全相同的建筑模板，而是一个可复制的区域运营模型，能够按市场、密度要求和客户细分调整。
