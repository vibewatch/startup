  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Digital Edge 争夺的不是全部“云”或“数字化转型”支出。相关市场是基础设施层：它承载、供电、冷却并互联超大规模云、AI 平台、网络和大型企业的工作负载。这个市场显然在扩张。CBRE
              将亚太数据中心描述为由 AI、云和数字化驱动的空前繁荣；ResearchAndMarkets 的口径则指向一个从 2023 年 US$24.66B 增至 2032 年 US$71.67B 的广义市场。JLL 和
              Cushman 从供给而非支出切入，预测到 2027 年新增 4.8GW 供给，2025—2030 年新增 24GW 容量，2026 年上半年管线达到
              26.5GW。这些数字方向一致，但不能互换：一个衡量类似收入的市场价值，一个衡量实物供给，另一个衡量规划管线。对尽调而言，Digital Edge 的真实机会集更窄：亚太一批城市，高密度云和 AI
              买家需要容量，而且电力、土地、监管和连接都能支撑分阶段扩张。
