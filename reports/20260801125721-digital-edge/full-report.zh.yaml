      - number: '8.4'
        title: 退出准备度，以及什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              退出路径是存在的：卖给基础设施资本、做资本重组或合资式资本结构，或在披露成熟后最终上市。但公开证据没有显示 Digital Edge 已经像 NEXTDC 的披露制度那样具备 IPO
              条件。这一点重要，因为退出可选性是估值支撑的一部分。现实结论是，真正投资决策前的最后一步非常清晰。投资者需要按园区拆分的经审计或管理层标准收入和
              EBITDA、按阶段拆分的利用率和积压订单、头部客户集中度，以及最新股权结构或条款清单。这四项比任何新增营销材料都更能改变建议。如果管理层提供这些材料，而隐含价格仍接近情景区间高端，判断大概率下调。如果条款相对基准情景区间有纪律，KPI
              资料室也干净，判断会上调。在此之前，投资逻辑仍是公司正面、价格不确定。
