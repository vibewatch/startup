      - number: '4.3'
        title: 成本结构：电力、设备和融资成本是关键驱动
        blocks:
          - type: paragraph
            body: >-
              Digital Edge 没有披露毛利率桥，但公开记录仍足以识别主要成本桶。电力最明显。公司与 Peak Energy 的可再生电力合作明确把目标放在降低电力成本、为最高 1GW 负载脱碳上；与 Donghwa
              的储能合作则强调更长更换周期、更少冷却需求和更低总体拥有成本。这些不是外围 ESG 说法，而是利润率杠杆。同业文件也强化了这一点。Digital Realty
              警告电力是重要运营费用，且并非所有通胀都能转嫁给客户；Equinix 和 GDS 则显示，经常性收入质量可以和沉重运营、资本需求并存。Iron Mountain 的资本开支拆分和 Digital Realty
              的债务披露进一步说明，规模化数据中心运营商会反复在增长和经常性维护上花钱。对 Digital Edge
              来说，可能的模型容易描述，却难以用公开信息量化：经常性基础设施收入压在大型固定资产、显著电力敞口和持续融资需求之上。
