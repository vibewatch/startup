      - number: '6.4'
        title: 客户集中度和采购摩擦仍是关键盲点
        blocks:
          - type: paragraph
            body: >-
              主要客户风险是集中度和后续阶段填充延迟。超大规模客户和 ISP 客户可能大到左右整个园区，因此不披露集中度不是小遗漏。公开材料也显示，扩张取决于客户先验证初始部署，后续阶段才会获得融资或建设。W.Media
              对菲律宾扩张的报道把这层关系说得很明白：下一座设施取决于第一座填满并拿到融资。韩国和印度很可能也适用类似逻辑，电力审批和园区准备度即便在有需求时也会变成采购摩擦。定价是另一个被低估的问题。Dewaweb
              的评论清楚表明，即使满意客户也仍在比较商业价值，而不只是认证或工程。正确的承销结论因此应当克制：Digital Edge
              拥有可信的采用证据和具备战略意义的客户组合，但尚未提供足够公开广度、留存或集中度数据来消除客户模型风险。
