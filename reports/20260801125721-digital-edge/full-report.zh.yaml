      - number: '8.3'
        title: 情景框架应明确、近似并保持谦逊
        blocks:
          - type: paragraph
            body: >-
              由于 Digital Edge 没有公开价格或利润表，情景分析应作为决策辅助，而不是假精确。牛市情景假设公司继续把已锁定电力管线转化为 AI
              和云需求，继续以有吸引力的条款筹集债务和股权，并开始更像一个稀缺亚太平台，而不是区域上市可比的折价私营代理。基准情景假设平台真实且可融资，但因收入、利用率、积压订单和优先权不公开，仍背负很大的不透明折价。熊市情景假设阶段填充慢于预期、资本市场收紧，或客户集中度比公开叙事暗示的更尖锐。在这些假设下，熊市
              US$4-6B、基准 US$7-10B、牛市 US$12-18B 的粗略参考区间在方向上有用，但只能当罗盘。这些不是市场标记，而是对照公开和 M&A 可比对象的合理性校验区间。
