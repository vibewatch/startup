  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Digital Edge 的公开记录从 2020 年由赞助方支持创立，走到 2025-2026 年债务融资、ESG 与多国规模表述同步抬升。
    data:
      items:
        - date: '2020'
          label: 创立
          detail: Digital Edge 成立，Stonepeak 担任创始赞助方。
          tone: positive
        - date: 2022-12
          label: NARRA1 启用
          detail: 菲律宾绿地设施上线，成为区域运营里程碑。
          tone: positive
        - date: 2023-03
          label: TYO7 合作
          detail: Hulic 合作加入东京市中心互联站点。
          tone: positive
        - date: 2023-11
          label: 首笔绿色贷款
          detail: SEL2 融资在韩国跑出绿色贷款模板。
          tone: positive
        - date: 2024-06
          label: Peak Energy 交易
          detail: 可再生能源合作目标是提供最高 1 GW 脱碳电力支持。
          tone: positive
        - date: 2024-10
          label: SEL2 投运
          detail: 韩国园区一期达到可服务状态。
          tone: positive
        - date: 2025-01
          label: US$1.6B 融资
          detail: 股权加债务融资，支持下一阶段面向 AI 的园区建设。
          tone: positive
        - date: 2025-02
          label: CEO 交接
          detail: John Freeman 出任候任 CEO，Samuel Lee 转为高级顾问。
          tone: neutral
        - date: 2026-04
          label: ESG 规模更新
          detail: 公司开始把 31 个数据中心和 1.8 GW 已锁定 IT 电力作为最新规模标尺。
