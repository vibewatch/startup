      - number: '3.2'
        title: 全球平台同业：Equinix 和 Digital Realty
        blocks:
          - type: paragraph
            body: >-
              Equinix 和 Digital Realty 设定了规模标尺。Equinix 称其在全球运营 281 个数据中心，在九个亚太国家拥有 63 个数据中心，服务超过 10,500 个客户，并拥有 513,000
              条互联。这组组合创造了真正的生态护城河：客户会选择交易对手、运营商和云提供商已经存在的地点托管。Digital Realty 以相近但略有不同的角度切入市场。公司称全球拥有超过 300 个数据中心，亚太平台则突出
              20 多个区域设施、230 多个已连接客户和 30 多家云提供商。其 2026 年 4 月业绩显示季度收入 US$1.6B、积压订单 US$1.8B，提醒投资者它能自筹比多数私营对手更大的扩张计划。对
              Digital Edge 来说，这些同业既是对手，也是估值锚。Digital Edge 很难在生态密度或财务披露上追平它们，但它们也证明，买家愿意为能同时交付规模、可靠性、云邻近性和面向 AI 增长的运营商付费。
