      - number: '7.3'
        title: 运营和融资风险集中在电力、分阶段推进和资本市场
        blocks:
          - type: paragraph
            body: >-
              运营模型有三个相互连着的脆弱点。第一是电力和冷却。Digital Edge
              自己的材料显示，可再生能源采购、液冷和新储能系统为什么重要；它们是对真实运营负担的回应，不是旁支项目。第二是阶段执行。菲律宾的公开报道以及印度、韩国披露都暗示，后续阶段取决于前期阶段填充、电力权利保持有效和资本持续可得。第三是再融资和杠杆。2025
              年融资、项目绿色贷款和 2026 年 HoldCo 信贷安排展示了亮眼的资本获取能力，但也证明增长依赖反复获得债务和股权。Digital Realty 和 GDS
              的同业文件进一步说明，电力成本转嫁、客户集中度和杠杆是行业特征，即便规模化运营商也会被反噬。对 Digital Edge
              来说，正确问题不是它能否筹到一次钱，而是它能否持续把资本转化为已利用、能产生收入的兆瓦，并且速度快过成本和竞争压力上升。
