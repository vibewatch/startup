      - number: '3.3'
        title: 亚太区域专业公司及其对 Digital Edge 的压力点
        blocks:
          - type: paragraph
            body: >-
              亚太专业公司带来的压力更直接。AirTrunk 的规模和发起方支持，使它成为最干净的超大规模可比对象：Blackstone 的 A$24B 收购公告称，已有超过 800 兆瓦向客户承诺，并拥有超过 1GW
              的未来增长容量。STT GDC 和 Keppel 的重要性来自不同原因。STT 的营销强调快速增长的区域版图，以及 360MW 印度尼西亚管线等大型 AI 就绪建设项目；Keppel 则突出 13 个国家的 35
              个数据中心和超过 400 万平方英尺的可出租面积。GDS 又不同。其 2025 年 20-F
              显示托管收入具备真实规模，但也标出了定价压力、对云提供商依赖、监管或牌照风险，因此是一条有用的反向竞争证据。这些同业说明，Digital Edge
              竞争的不只是技术。它竞争的是快速拼出土地、电力、资本和本地关系的能力，要在更大或更知名的对手之前赢下稀缺部署。
