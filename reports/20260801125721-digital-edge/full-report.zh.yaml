      - number: '8.2'
        title: 可比逻辑：稀缺性可以很值钱，但经济性仍要成立
        blocks:
          - type: paragraph
            body: >-
              合适的可比集合混合了全球上市龙头、区域上市增长平台和私营稀缺交易。Equinix 和 Digital Realty 定义了质量和规模的上沿，拥有数十亿美元级经常性收入和很大的市值。GDS
              是一个质量较低但仍具规模的上市参照，因为它把真实收入和积压订单与中国、监管和定价风险放在一起。NEXTDC
              可能是最重要的区域上市增长可比。它的市值更接近一个规模化亚太增长平台可交易的位置，同时仍背负巨大资本开支需求、大额流动性缓冲和明确订单簿动态。然后是 AirTrunk，其 A$24B
              交易显示私募资本愿意为稀缺亚太超大规模资产拉伸到多远。Digital Edge 合理位置可能落在区域上市可比集合和私营稀缺可比集合之间——但没有经审计经济性，投资者无法知道它在这条光谱上到底在哪里。
