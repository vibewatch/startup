          - type: paragraph
            body: >-
              最好的具名客户证明来自印度尼西亚。Digital Edge Indonesia 多个行业页面都刊载了 Dewaweb 和 VDCI 的一致客户引述。Dewaweb 称，其选择 Digital Edge
              Indonesia 作为 Dewacloud 核心，是因为基础设施现代、连接良好且定价有竞争力。VDCI 称，因高 SLA、安全性、网络多样性和迁移支持，它把一个客户核心系统工作负载放在 Digital Edge
              Indonesia。这些证据有用，因为它们不只是标识，还提到了具体工作负载和购买理由。弱点在广度。同样两条引用反复出现在多个页面，说明它们是真的，也说明公开具名客户储备有限。在菲律宾，证据真实但质量较低：发布材料和
              BusinessWorld 都称 NARRA1 在开服前已有预订，包括多家主要国内 ISP，但客户没有具名。这足以证明早期需求，不足以证明多元化生产使用。
