      - number: '1.4'
        title: 最新规模指标与仍未补齐的承销缺口
        blocks:
          - type: paragraph
            body: >-
              概览里最关键的细节，是 Digital Edge 公开披露的规模计数随时间显著变化。2025 年 1 月融资将公司描述为一个拥有 21 个数据中心、500 多兆瓦 IT 负载和 300
              兆瓦未来开发储备的平台，覆盖六个国家。相比之下，2026 年 4 月 ESG 公告称其组合包含 31 个数据中心、1.8GW 已锁定 IT 电力，并在九个国家运营。较新的披露在方向上是积极的，因为它暗示 2025
              年大额融资之后扩张仍在继续，并伴随 2025 年 100%
              在线时间、可再生电力使用增加等运营信号。但这个变化也带来尽调义务：投资者需要管理层逐项解释哪些资产、开发阶段和地理范围进入了不同定义。公开披露在收入、EBITDA、利用率、客户集中度、员工数和估值机制上尤其薄。换句话说，Digital
              Edge 看起来真实、有资金、具备战略相关性，但仅靠公开信息还无法完整承销。
