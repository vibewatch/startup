      - number: '1.3'
        title: 资本形成和里程碑推进
        blocks:
          - type: paragraph
            body: >-
              资本获取是 Digital Edge 故事里外部验证最强的部分之一。2025 年 1 月融资由约 US$640M 股权和 US$1.0B
              债务组成，并被描述为大幅超额认购，说明发起方内部人和外部机构都愿意支持下一波园区开发。来源也明确了资金用途：韩国 SEL2、雅加达 EDGE2、Navi Mumbai 园区一期，以及东京 TY07 设施。到
              2026 年 5 月，公司又获得 US$575M HoldCo 信贷安排，由一组蓝筹贷款方支持，并带有未来可持续发展挂钩贷款选项。这个推进节奏重要，因为它显示 Digital Edge
              正从逐项目融资升级为更分层的公司资本结构。与此同时，融资时间线也提示财务复杂度上升；投资逻辑现在不只取决于发起方愿不愿意继续开支票，也取决于平台能否高效把债务和绿色金融容量转化为已出租、能产生现金的基础设施。
