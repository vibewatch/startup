        - 需要区分稀缺性叙事与真实盈利能力
        - 管理层财务资料室 / 审计包
      - - 在手订单、利用率与已承诺 MW
        - 未公开按园区拆分的转化数据
        - 建模爬坡节奏与资本效率必需
        - 按站点划分的商业运营包
      - - 股权结构表与优先权条款
        - 未公开投后估值或优先权结构
        - 需要判断任何报价估值的真实含义
        - 律师 / 最新条款清单
      - - 头部客户集中度
        - 未公开账户份额
        - 需要量化分期出租与续约风险
        - 账户级尽调摘要
      - - 债务到期表与契约
        - 公开资料只有单次融资新闻稿
        - 需要理解再融资风险与下行情景韧性
        - 资金部排期与贷款方文件
    notes: 这些问题是足以实质改变建议的最低尽调包。
    claimRefs:
      - CV040
      - CV041
      - CV042
