companyProfile:
  summary: >-
    Digital Edge 是一家私营的亚太数据中心和数字基础设施公司，成立于 2020 年，总部位于新加坡。公司由 Stonepeak
    支持，在日本、韩国、印度、马来西亚、印度尼西亚、菲律宾等主要亚太市场开发并运营互联、托管、超大规模边缘和相关光纤基础设施。公开证据显示，这个平台已经显著放大规模，且仍能获得融资，但公司披露的运营和股权结构细节远少于投资者做出有把握定价所需的信息。
