      - number: '7.2'
        title: 'Regulatory and power risk: APAC rules can slow growth without shutting it down'
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is best understood as a patchwork. In Singapore, IMDA and related agencies still treat
              data-center expansion as a managed capacity question, while EMA’s materials underline continued system
              dependence on gas. That does not make Singapore unusable, but it does mean market entry and expansion
              depend on compliance, efficiency, and policy timing. In the Philippines, EO 119 creates a more explicit
              domestic-residency framework for government-related data, which can increase local demand but also adds
              compliance complexity. Newsbytes’ CLOUD Act caveat shows why even a favorable localization rule does not
              fully solve legal-exposure questions. South Korea presents a different issue: Digital Edge’s own market
              guide says power approvals are difficult in the Seoul metro, so the gating factor is not customer demand
              alone. The overall lesson is that regulation mostly changes who can deploy where, how quickly, and under
              what controls. It rarely acts as a single binary ban, but it can still materially alter utilization timing
              and capex productivity.
