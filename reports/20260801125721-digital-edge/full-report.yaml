      - number: '2.2'
        title: Who buys and how demand converts to deployments
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more specific than “any company using the cloud.” Digital Edge’s own market notes point
              to hyperscalers, global cloud providers, local digital champions, telecom operators, regulated
              enterprises, and AI-heavy businesses as the demand anchors in India, Korea, and the Philippines. The
              buying process is also different from standard colocation shortlists. Digital Edge’s hyperscale guide
              frames the real underwriting question as optionality across multiple phases: whether power increments
              arrive on time, whether adjacent space is truly reservable, whether interconnection can evolve with the
              deployment, and whether the operator can keep scaling without forcing redesign. The AI infrastructure
              guide adds that density alone is not enough; buyers are screening cooling strategy, interconnection,
              market fit, and growth paths together. That means the budget owner is usually an infrastructure, network,
              cloud-capacity, or platform team evaluating total deployment resilience rather than just a lowest-price
              cabinet buyer. In practice, Digital Edge’s market is the set of customers who care about low-friction
              scale, not merely day-one rack availability.
