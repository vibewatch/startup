  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Service definition and asset map
        blocks:
          - type: paragraph
            body: >-
              Digital Edge’s product is not a packaged software SKU. It is a regional infrastructure service assembled
              from multiple operational modules: colocation capacity, carrier-neutral interconnection, remote-hands
              support, and increasingly integrated fiber or local-network capabilities. The public materials show that
              the company sells different flavors of this bundle depending on market. In Japan, OSA1 is marketed as a
              self-built, high-power-density facility near a core network center, while OSA2 is positioned for
              mission-critical outsourcing and disaster recovery. In the Philippines, NARRA1 is framed as a large
              carrier-neutral campus for network, cloud, digital-content, and enterprise buyers. In India, the BOM
              campus is framed as flexible hyperscale build-to-suit capacity. This mix suggests the product line is less
              about one identical building template and more about a repeatable regional operating model that can be
