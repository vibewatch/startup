        title: Customer concentration and procurement friction remain the key blind spots
        blocks:
          - type: paragraph
            body: >-
              The main customer risks are concentration and delayed phase fill. Hyperscale and ISP customers can be
              large enough to shape an entire campus, so the absence of concentration disclosure is not a trivial
              omission. Public materials also show that expansion depends on customers proving out initial deployments
              before later phases get financed or built. W.Media’s reporting on the Philippines expansion made that link
              explicit: the next facility depended on filling the first and securing financing. Similar logic likely
              applies in Korea and India, where power approvals and campus readiness can become procurement friction
              even if demand exists. Pricing is another underappreciated issue. Dewaweb’s comments make clear that even
              satisfied customers still compare commercial value, not just certifications or engineering. The right
              underwriting conclusion is therefore restrained. Digital Edge has credible evidence of adoption and a
              customer mix that makes strategic sense, but it has not yet provided public breadth, retention, or
