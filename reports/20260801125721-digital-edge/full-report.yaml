        title: 'Comparable logic: scarcity can be worth a lot, but economics still matter'
        blocks:
          - type: paragraph
            body: >-
              The right comparable set mixes public global leaders, public regional growth platforms, and private
              scarcity transactions. Equinix and Digital Realty define the upper bound of quality and scale, with
              multibillion-dollar recurring revenue and very large market capitalizations. GDS is a useful lower-quality
              but still scaled public reference because it combines real revenue and backlog with China, regulatory, and
              pricing risks. NEXTDC is perhaps the most important public regional growth comp. Its market cap sits
              closer to where a scaled APAC growth platform can trade while still carrying huge capex needs, large
              liquidity buffers, and explicit order-book dynamics. Then there is AirTrunk, whose A$24 billion
              transaction shows how far private capital will stretch for scarce APAC hyperscale assets. Digital Edge
              plausibly belongs somewhere between the regional-public comp set and the private-scarcity comp set — but
              without audited economics, investors cannot know where on that spectrum it really sits.
