      - number: '8.3'
        title: Scenario framing should be explicit, approximate, and humble
        blocks:
          - type: paragraph
            body: >-
              Because there is no public price or income statement for Digital Edge, scenario analysis should be used as
              a decision aid, not as false precision. The bull case assumes the company keeps converting its
              secured-power pipeline into AI and cloud demand, continues raising debt and equity on attractive terms,
              and begins to look more like a scarce APAC platform than a discounted private proxy for public regional
              comps. The base case assumes the platform remains real and financeable, but still carries a large opacity
              discount because revenue, utilization, backlog, and preferences are not public. The bear case assumes
              phase fill is slower than expected, capital markets tighten, or customer concentration emerges more
              sharply than the public story suggests. Under those assumptions, a rough reference range of US$4-6 billion
              in bear, US$7-10 billion in base, and US$12-18 billion in bull is directionally useful, but only as a
              compass. These are not market marks. They are sanity-check ranges against public and M&A comparables.
