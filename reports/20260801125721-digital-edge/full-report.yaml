      - number: '1.3'
        title: Capital formation and milestone progression
        blocks:
          - type: paragraph
            body: >-
              Capital access is one of the strongest externally validated parts of the Digital Edge story. The January
              2025 financing combined approximately US$640 million of equity and US$1.0 billion of debt and was
              described as significantly oversubscribed, which indicates that both sponsor insiders and outside
              institutions were comfortable supporting the next wave of campus development. The sources also make clear
              where that money was meant to go: SEL2 in Korea, EDGE2 in Jakarta, the first phase of the Navi Mumbai
              campus, and the TY07 facility in Tokyo. By May 2026 the company had added a US$575 million HoldCo
              facility, supported by a blue-chip lender group and structured with a future sustainability-linked loan
              option. That progression matters because it shows Digital Edge graduating from project-by-project
              financing into a more layered corporate capital stack. At the same time, the funding chronology suggests
              rising financial complexity; the investment case now depends not just on sponsor willingness to write
              checks but also on how efficiently the platform converts debt and green-finance capacity into leased,
              cash-generating infrastructure.
