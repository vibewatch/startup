        title: 'Customer segmentation: who appears to buy the platform'
        blocks:
          - type: paragraph
            body: >-
              Digital Edge’s public materials point to a segmented customer base rather than one universal buyer
              profile. Korea materials emphasize global hyperscalers, cloud providers, local digital champions,
              conglomerates, and Chinese players. India materials frame the target as build-to-suit hyperscale demand.
              Philippines materials lean toward cloud, network, digital media, enterprise, and now some AI-ready local
              deployment logic. The Indonesia subsite adds another angle by showing why carriers, ISPs, and cloud
              operators might choose the platform for a hybrid mix of data-center and connectivity services. Put
              together, the public story suggests three economic layers: large hyperscale or AI buyers that anchor
              phases, network or ISP buyers that deepen ecosystem value, and enterprise or regulated local customers
              that need certifications, support, and in-country deployment. That is a sensible mix for a carrier-neutral
              APAC platform, but Digital Edge does not publicly quantify the revenue share or durability of each
