      - number: '3.4'
        title: Switching costs, substitutes, and moat durability
        blocks:
          - type: paragraph
            body: >-
              This remains a structurally competitive market even though data-center supply is constrained. Large
              customers can self-build, prelease entire campuses, or multi-home across operators by workload and
              geography. That caps absolute lock-in. At the same time, switching costs are not trivial. Interconnection
              density, migration complexity, route design, cooling path, and future phase certainty all make it costly
              to change operators once a deployment becomes mission critical. This is why Equinix and Digital Realty
              maintain strong moats in enterprise-heavy environments, while AirTrunk wins where scale and campus runway
              dominate. Digital Edge’s challenge is to build enough local credibility and operating reliability that
              buyers choose it despite its smaller global brand and lower disclosure level. The opportunity is real
              because geography still fragments the market, but commoditization risk is also real because public
              incumbents, private hyperscale specialists, and self-build programs are all converging on the same cloud
              and AI budgets.
