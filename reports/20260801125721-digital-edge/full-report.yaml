      - number: '1.4'
        title: Latest scale markers versus open underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The most important nuance in the overview is that Digital Edge’s public scale counters have moved
              materially over time. The January 2025 raise framed the business as a 21-data-center platform with
              500-plus megawatts of IT load and 300 megawatts held for future development across six countries. The
              April 2026 ESG release, by contrast, described a 31-data-center portfolio, 1.8 gigawatts of secured IT
              power, and operations across nine countries. That newer disclosure is directionally positive because it
              implies expansion continued after the big 2025 raise and was paired with operating signals such as 100%
              uptime in 2025 and growing renewable-electricity use. But the change also creates a diligence obligation:
              investors need management to explain exactly which assets, development stages, and geographies moved
              between those definitions. Public disclosure remains especially thin on revenue, EBITDA, utilization,
              customer concentration, headcount, and valuation mechanics. In other words, Digital Edge looks real,
              funded, and strategically relevant, but it is not yet fully underwritable from public information alone.
            claimRefs:
              - CO023
              - CO024
              - CO025
              - CO027
              - CO033
              - CO034
              - CO035
              - CO037
              - CO038
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why the overview matters for later chapters
            body: >-
              Digital Edge already looks like a scaled infrastructure platform, not a speculative greenfield concept.
              The core open question is not whether it exists or whether Stonepeak backs it; the real diligence
              challenge is reconciling changing scale definitions and understanding whether the financing stack,
              customer mix, and operating metrics justify treating the latest footprint claims as durable rather than
              promotional.
            calloutType: insight
            claimRefs:
              - CO003
              - CO005
              - CO023
              - CO037
          - type: callout
            title: The biggest underwriting gap is still disclosure depth
            body: >-
              The public record gives strong evidence on funding access, country expansion, and leadership, but it
              remains thin on revenue quality, EBITDA, occupancy, customer concentration, and valuation mechanics. That
              means the company can clear an existence-and-scale test while still failing a price-discipline test if
              investors cannot get management-level financial detail.
            calloutType: risk
            claimRefs:
