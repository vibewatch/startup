figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Digital Edge’s public record moves from a 2020 sponsor-backed founding to a 2025-2026 step-up in debt, ESG, and
      multi-country scale claims.
    data:
      items:
        - date: '2020'
          label: Founded
          detail: Digital Edge is established with Stonepeak as founding sponsor.
          tone: positive
        - date: 2022-12
          label: NARRA1 launch
          detail: Philippines greenfield facility comes online and marks a regional operating milestone.
          tone: positive
        - date: 2023-03
          label: TYO7 partnership
          detail: Hulic partnership adds a downtown Tokyo interconnection site.
          tone: positive
        - date: 2023-11
          label: First green loan
          detail: SEL2 financing establishes a green-loan template in South Korea.
          tone: positive
        - date: 2024-06
          label: Peak Energy deal
          detail: Renewables partnership targets up to 1 GW of decarbonized power support.
