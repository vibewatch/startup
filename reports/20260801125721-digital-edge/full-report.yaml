      - number: '8.4'
        title: Exit readiness and what would move the call
        blocks:
          - type: paragraph
            body: >-
              There are plausible exit paths: sale to infrastructure capital, a recap or JV-style capital structure, or
              eventual listing if disclosure matures. But public evidence does not show that Digital Edge is already
              IPO-ready in the way NEXTDC’s disclosure regime is. That matters because exit optionality is part of
              valuation support. The practical consequence is that the last step before a real investment decision is
              sharply defined. An investor needs audited or management-standard revenue and EBITDA by campus,
              utilization and backlog by phase, top-customer concentration, and the latest cap-table or term sheet.
              Those four items would do more to move the recommendation than any additional marketing material. If
              management provides them and the implied price still sits closer to the high end of the scenario range,
