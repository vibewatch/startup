        title: 'Durability and expansion: the logic is visible, the metrics are not'
        blocks:
          - type: paragraph
            body: >-
              The durability logic for a data-center platform is understandable even when the metrics are hidden. Once a
              customer migrates workloads, attaches carriers, configures cross-connects, and integrates remote-hands
              processes, switching costs rise. The public materials reinforce that support quality matters after the
              initial sale; both Dewaweb and VDCI highlight migration and after-sales support, not just facility specs.
              Digital Edge’s own technical guides also imply that multi-market expansion matters to many buyers, because
              site selection is partly about what the provider can offer next in the region. Still, the public record
              does not disclose the metrics investors actually need: no NRR, GRR, churn, renewals, top-customer
              exposure, or segment mix. Peer filings from Equinix, GDS, and Digital Realty show the missing template.
              Those companies publish repeat-booking, churn, backlog, or customer-concentration metrics, while Digital
              Edge does not. The consequence is that the durability thesis is directionally plausible but not yet
              auditable from public evidence alone.
