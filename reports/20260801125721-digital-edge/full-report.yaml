  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Digital Edge does not compete for all “cloud” or “digital transformation” spending. The relevant market is
              the infrastructure layer that houses, powers, cools, and interconnects the workloads of hyperscalers, AI
              platforms, networks, and large enterprises. That market is clearly expanding. CBRE describes APAC data
              centers as being in an unprecedented boom driven by AI, cloud, and digitalization, while the
              ResearchAndMarkets lens points to a broad market rising from US$24.66 billion in 2023 to US$71.67 billion
              by 2032. JLL and Cushman add a different lens by focusing on supply rather than spend, projecting 4.8 GW
              of new supply by 2027, 24 GW of added capacity between 2025 and 2030, and a 26.5 GW pipeline in H1 2026.
              These numbers are directionally consistent but not interchangeable. One measures revenue-like market
              value, one measures physical supply, and another measures planned pipeline. For diligence purposes,
              Digital Edge’s real opportunity set is narrower: the subset of APAC metros where high-density cloud and AI
              buyers need capacity and where power, land, regulation, and connectivity can all support phased expansion.
