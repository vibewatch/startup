      - number: '4.2'
        title: Capital stack and buildout needs dominate the financial story
        blocks:
          - type: paragraph
            body: >-
              Digital Edge’s financial narrative is fundamentally about capital access. The company announced more than
              US$1.6 billion of fresh capital in January 2025, split roughly between US$640 million of equity and US$1.0
              billion of debt, and followed it in May 2026 with a US$575 million HoldCo facility. The sequence matters.
              It shows that Digital Edge is not relying on a single sponsor cheque or a one-off financing event; it is
              layering sponsor equity, project debt, green loans, acquisition debt, and corporate-level debt as the
              footprint expands. The project examples underline how large the requirements are. The 2023 India JV
              described a US$2 billion, 300MW greenfield project on 47 acres; the later India page marketed a 350MW
              campus on the same footprint, implying either expanded scope or changed counting. SEL2 alone carried a
              KRW440 billion green loan for phase one and roughly KRW1 trillion of expected total project costs at
              campus level. For investors, that means solvency analysis is less about classic startup burn and more
              about whether phased capacity can keep attracting debt and equity at acceptable terms.
