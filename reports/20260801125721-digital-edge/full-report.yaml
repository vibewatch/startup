chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and footprint
        blocks:
          - type: paragraph
            body: >-
              Digital Edge is best understood as a sponsor-backed APAC digital-infrastructure platform rather than a
              software startup or a domestic retail-colocation business. Across its homepage, about page, and product
              pages, the company presents a combined offer spanning colocation, interconnection, hyperscale edge
              capacity, and related fiber solutions for hyperscale cloud and enterprise customers. The January 2025
              capital-raise release gives the clearest historical operating snapshot: 21 data centers, more than 500
              megawatts of critical IT load in service and under construction or development, and another 300 megawatts
              reserved for future projects across Japan, Korea, India, Malaysia, Indonesia, and the Philippines. Those
              disclosures establish that by early 2025 the company already had real regional scale, not merely signed
              land options. They also clarify the customer problem being solved: Digital Edge is trying to give
              sophisticated buyers a regional platform that combines deployment speed, local regulatory navigation, and
              interconnection choice across multiple Asian markets rather than a single-market point solution.
