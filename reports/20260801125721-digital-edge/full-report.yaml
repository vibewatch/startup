      - number: '1.2'
        title: Leadership, board change, and governance signal
        blocks:
          - type: paragraph
            body: >-
              The leadership story matters because infrastructure execution is people-heavy and lender confidence
              usually tracks operator credibility. Digital Edge’s February 2025 transition put founding executive John
              Freeman into the CEO seat while moving Samuel Lee into a Senior Advisor role, a change that suggests
              planned succession rather than crisis turnover. The same announcement added Maile Kaiser and Eanna Murphy
              as non-executive directors, giving the board additional data-center operating depth at a moment when the
              platform was leaning harder into AI-ready growth. Public director pages and the about page also show a
              bench weighted toward capital, legal, commercial, and construction execution: Jonathan Walbridge on
              finance, Yaniv Ghitis on commercial and investment work, Joe Bauerschmidt on compliance, Mervyn Chan on
              design and construction, and John Yung on IT. Andrew Thomas ties governance directly back to Stonepeak,
              reinforcing that the sponsor is not a passive shareholder. That is a positive signal for execution
              support, but it also means outside investors should assume sponsor influence is a first-order part of
              governance.
