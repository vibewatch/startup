        title: Operating and financing risk live in power, phasing, and capital markets
        blocks:
          - type: paragraph
            body: >-
              The operating model has three linked vulnerabilities. First, power and cooling. Digital Edge’s own
              materials show why renewable sourcing, liquid cooling, and new energy-storage systems matter; they are
              responses to a real operating burden, not side projects. Second, phase execution. Public reporting on the
              Philippines and disclosures in India and Korea all imply that later phases depend on earlier phases
              filling, power rights holding, and capital remaining available. Third, refinancing and leverage. The 2025
              raise, project green loans, and 2026 HoldCo facility demonstrate impressive access to capital, but they
              also prove that growth depends on repeated access to debt and equity. Peer filings from Digital Realty and
              GDS reinforce that power-cost pass-through, customer concentration, and leverage are industry features
              that can bite even scaled operators. For Digital Edge, the right question is not whether it can raise
              money once; it is whether it can keep converting capital into utilized, revenue-bearing megawatts faster
              than costs and competitive pressure rise.
