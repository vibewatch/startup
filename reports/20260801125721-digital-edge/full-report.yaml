      - number: '2.3'
        title: Growth corridors and why APAC is not one market
        blocks:
          - type: paragraph
            body: >-
              APAC is not a single operating environment, and Digital Edge’s own writing reinforces that point. India
              looks attractive because hyperscaler demand is rising, supportive policy and lower industrial tariffs can
              make large campuses more financeable, and Navi Mumbai offers a rare combination of power, fiber, and land
              scale for AI-oriented growth. South Korea offers deep demand from hyperscalers, local platforms, and
              conglomerates, but it is also one of the hardest markets in which to secure power, especially in the Seoul
              metro. The Philippines is different again: Digital Edge’s material frames it as a latency and control
              decision, with government-data residency rules under EO 119 but no blanket private-sector localization
              mandate. Meanwhile Singapore remains strategically important but supply constrained, which is why CBRE
              explicitly points to spillover into nearby markets such as Johor and Thailand. The market opportunity for
              Digital Edge therefore sits in corridors rather than a uniform regional pool: India and Southeast Asia for
              greenfield scale, Korea and Japan for premium constrained capacity, and the Philippines for local
              in-country deployments where latency, sovereignty, and certification matter.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
