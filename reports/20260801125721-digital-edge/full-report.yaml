  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The top risks are structural, but disclosure gaps amplify them
        blocks:
          - type: paragraph
            body: >-
              Digital Edge sits in a sector where several core risks are structural: power access, financing dependence,
              environmental scrutiny, and competition. What makes the platform harder to underwrite is not that these
              risks exist — every serious APAC data-center operator faces them — but that public disclosure is thin on
              the metrics that would let an investor separate manageable exposure from thesis-breaking exposure. The
              public record is strongest on capital-raising events, facility launches, and certifications. It is weaker
              on incidents, concentration, and legal contingency planning. That means the correct risk posture is not to
              assume the business is unusually fragile; it is to assume that structural infrastructure risks remain
              active until management proves otherwise with private data. This chapter therefore distinguishes
              sector-wide risk from company-specific opacity, and turns the remaining blind spots into concrete kill
              criteria and diligence asks rather than vague caution.
