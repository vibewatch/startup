      - number: '3.2'
        title: 'Global-platform peers: Equinix and Digital Realty'
        blocks:
          - type: paragraph
            body: >-
              Equinix and Digital Realty set the scale benchmark. Equinix says it operates 281 data centers globally, 63
              across nine APAC countries, more than 10,500 customers, and 513,000 interconnections. That combination
              creates a true ecosystem moat: customers colocate where counterparties, carriers, and cloud providers
              already exist. Digital Realty attacks the market from a related but slightly different angle. It says it
              has more than 300 data centers globally, while its APAC platform highlights 20-plus regional facilities,
              230-plus connected customers, and 30-plus cloud providers. Its April 2026 results showed US$1.6 billion of
              quarterly revenue and a US$1.8 billion backlog, reminding investors that the company can self-fund a
              larger expansion agenda than most private rivals. For Digital Edge, these peers are both rivals and
              valuation anchors. They are difficult to match on ecosystem density or financial disclosure, but they also
              confirm that buyers will pay for operators who can combine scale, reliability, cloud adjacency, and
              AI-ready growth.
