      - number: '7.4'
        title: Kill criteria should focus on measurable slippage, not narrative shifts
        blocks:
          - type: paragraph
            body: >-
              The most useful risk posture after investment is monitorable. A Korea thesis break would look like power
              approvals slipping, phase timing moving materially, or dense AI demand failing to land despite a
              supposedly advantaged site. A Philippines thesis break would look like the first facility filling too
              slowly to justify later phases or regulatory tailwinds failing to convert into real customer demand. A
              financing thesis break would show up in weaker lender participation, harsher refinancing terms, or a need
              to fund growth with unexpectedly dilutive equity. Customer-model risk should be monitored through
              top-customer share of committed megawatts, signed but unutilized backlog, and repeat buys by existing
              accounts. Operational risk should be monitored through actual incident logs, uptime exceptions, and
              evidence that new energy, cooling, or support systems perform as advertised. The public record is not
              strong enough to answer those questions today, but it is strong enough to define the dashboard management
              must provide before an investor can underwrite with confidence.
