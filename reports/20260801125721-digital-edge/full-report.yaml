  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape map and competitive categories
        blocks:
          - type: paragraph
            body: >-
              Digital Edge does not face one monolithic rival. The competitive map splits into at least four groups.
              First are global interconnection and platform leaders such as Equinix and Digital Realty, which combine
              ecosystem density, capital access, and broad metro coverage. Second are APAC hyperscale specialists such
              as AirTrunk that emphasize huge campus scale and customer-committed megawatts. Third are regional or
              country-rooted operators such as STT GDC, Keppel, and GDS that can win because of local operating depth,
              sovereign adjacency, or specific regulatory expertise. Fourth are the substitutes: hyperscaler self-build,
              direct preleases, and workload migration to public-cloud regions. This matters because Digital Edge’s
              position is not that of the category king on any single global metric. Instead, it is trying to win where
              regional APAC execution, interconnection-plus-colocation packaging, and sponsor-backed speed are more
              important than owning the world’s biggest customer ecosystem. That leaves room for Digital Edge, but only
              in segments where buyers still value local tailoring and project execution over sheer incumbent scale.
            claimRefs:
              - CP001
              - CP023
              - CP024
