companyProfile:
  summary: >-
    Digital Edge is a private APAC data-center and digital-infrastructure company founded in 2020 and headquartered in
    Singapore. Backed by Stonepeak, it develops and operates interconnection, colocation, hyperscale edge, and related
    fiber infrastructure across major Asia-Pacific markets including Japan, Korea, India, Malaysia, Indonesia, and the
    Philippines. Public evidence supports a platform that has scaled materially and remained financeable, but the
    company still discloses far less operating and cap-table detail than investors would need for conviction pricing.
