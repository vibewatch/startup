      - number: '3.3'
        title: Regional APAC specialists and where they pressure Digital Edge
        blocks:
          - type: paragraph
            body: >-
              The APAC specialists are where the pressure becomes more direct. AirTrunk’s scale and sponsor support make
              it the cleanest hyperscale comparator: Blackstone’s A$24 billion acquisition announcement described more
              than 800 megawatts already committed to customers and over 1 gigawatt of future growth capacity. STT GDC
              and Keppel matter for different reasons. STT’s marketing emphasizes a fast-growing regional footprint and
              major AI-ready builds such as its 360 MW Indonesia pipeline, while Keppel highlights 35 data centers
              across 13 countries and more than 4 million square feet of lettable area. GDS is different again. Its 2025
              20-F shows real scale in colocation revenue, but it also flags pricing pressure, cloud-provider
              dependence, and regulatory or licensing risk, which makes it a useful piece of adverse competitor
              evidence. These peers show that Digital Edge is not competing only on technology. It is competing on the
              ability to assemble land, power, capital, and local relationships quickly enough to win scarce deployments
              before larger or better-known rivals do.
