  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: what is monetized is clearer than how much'
        blocks:
          - type: paragraph
            body: >-
              Public materials are enough to understand the shape of Digital Edge’s monetization, even though they are
              not enough to build a real forecast. The company clearly sells colocation capacity, interconnection, and
              related connectivity rather than only undifferentiated space and power. The Philippines and
              interconnection guides describe cabinet-based colocation, cross-connects, cloud on-ramps,
              internet-exchange participation, carrier-neutral access, and operational support. This supports a working
              view that Digital Edge’s revenue stack likely resembles other carrier-neutral data-center platforms:
              mostly recurring monthly charges tied to installed capacity and connectivity, plus smaller non-recurring
              installation or professional-service components. What remains missing is price disclosure. The company
              does not publish normalized rack, cabinet, cross-connect, or per-megawatt price cards, nor does it
              disclose realized discounts. That means public evidence supports directionally high revenue quality but
              not realized yield, product mix, or customer economics by market. Revenue recognition also has to be
              inferred from peer filings rather than from Digital Edge’s own accounting disclosures.
