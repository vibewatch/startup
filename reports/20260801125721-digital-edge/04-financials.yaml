  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: income-statement
    missingEvidence: No public revenue, EBITDA, cash, or debt schedule for Digital Edge.
    whyItMatters: Without these figures, investors cannot test leverage tolerance, covenant headroom, or true runway.
    diligencePath: Request audited or management monthly financial statements plus debt schedule and covenant package.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: No site-level pricing, utilization, backlog, power pass-through, or gross-margin data.
    whyItMatters: These are the metrics that decide whether large capital deployments create value or simply absorb more financing.
    diligencePath: Request facility-level KPI pack covering pricing, utilization, backlog, churn, and gross margin by site.
    relatedQuestionRefs:
    - QI020
  - type: inconsistent-public-evidence
    severity: minor
    topic: india-campus-scope
    missingEvidence: Public India scope moved from 300MW to 350MW on the same 47-acre site.
    whyItMatters: A scope change alters capex, phase timing, and return assumptions.
    diligencePath: Ask management to reconcile project scope history and current phase plan.
    relatedQuestionRefs:
    - QI012
