- id: TI004
  title: Capital adequacy table
  columns:
  - Financing item
  - Public amount / status
  - What it funds
  - Underwriting implication
  - Remaining diligence ask
  rows:
  - - Jan 2025 equity + debt raise
    - '>US$1.6B total; ~US$640M equity + US$1.0B debt'
    - Multi-campus APAC expansion
    - Strong evidence of financing access
    - Provide use-of-funds and remaining availability
  - - May 2026 HoldCo facility
    - US$575M
    - Corporate flexibility for existing key markets
    - Suggests platform-level financing maturity
    - Provide maturity, pricing, covenants, and draw schedule
  - - SEL2 green loan
    - KRW440B phase-one financing
    - South Korea 100MW campus phase build
    - Project-level debt supports growth
    - Provide DSCR, amortization, and security package
  - - India Navi Mumbai campus
    - US$2B / 300MW in 2023; current page markets 350MW
    - One of the largest capex commitments in portfolio
    - Scope clarity is essential to underwriting
    - Reconcile 300MW vs 350MW and phase budget
  - - Green loans / green finance
    - Nearly US$1.25B by Apr 2026; management later cited >US$2B green financings in HoldCo release
    - Sustainable financing across projects
    - Shows lender appetite but also financing dependence
    - Provide project-by-project green debt schedule
  notes: Capital adequacy is the main forward-looking financial question because the asset base is built in phases.
