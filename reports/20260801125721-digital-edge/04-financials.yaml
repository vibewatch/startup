- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why public sources cannot answer it
  - Exact diligence path
  rows:
  - - Revenue and EBITDA
    - Blocks valuation and debt-service analysis
    - No public financial statements for Digital Edge
    - Request board pack or audited management accounts
  - - Cash, net debt, and liquidity headroom
    - Blocks runway view
    - Announcements state financings, not balances
    - Request treasury summary and debt schedule
  - - Backlog, commitment, and utilization by campus
    - Blocks conversion analysis
    - Only peers publish backlog / utilization detail
    - Request signed-versus-billed capacity by site
  - - Realized pricing and power pass-through
    - Blocks unit-economics modeling
    - Marketing guides describe units but not commercial terms
    - Request standard MSA, price cards, and recent wins
  - - Customer concentration and renewals
    - Blocks revenue durability analysis
    - No public customer revenue breakdown
    - Request top-10 customer exposure and renewal history
  notes: These gaps are the minimum private data needed to convert the public story into an investable underwriting model.
