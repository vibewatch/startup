tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit / contract cue
  - Current public visibility
  - Quality view
  - Diligence ask
  rows:
  - - Colocation
    - Recurring charge for cabinets, cages, or higher-density deployments
    - Cabinet kVA, MW, phase commitment
    - Visible conceptually; not priced
    - Likely sticky once deployed
    - Provide standard and realized pricing by market
  - - Interconnection / cross-connects
    - In-facility links between carriers, clouds, and counterparties
    - Cross-connect / metro link / IXP participation
    - Visible conceptually; not priced
    - Likely high-margin attachment revenue
    - Provide attach rates and monthly yield per connection
  - - Fiber / connectivity
    - Metro or on-campus connectivity and ecosystem access
    - Carrier-neutral and multi-site network services
    - Visible conceptually; not priced
    - Can deepen wallet share and reduce churn
    - Provide fiber revenue mix and gross margin
  - - Installation / professional services
    - Deployment, configuration, and support activity
    - Project-based or one-time services
    - Not directly disclosed for Digital Edge
    - Likely smaller than recurring core
    - Provide proportion of total revenue and recognition policy
  notes: Public sources make the monetization map clear, but not the pricing, mix, or realized yields.
