- id: cost-structure
  title: 'Cost structure: power, equipment, and financing cost are the key drivers'
  body: 'Digital Edge does not disclose a gross margin bridge, but the public record is still enough to identify the major cost buckets. Power is the most obvious. Its own renewable-power partnership with Peak Energy explicitly framed the objective around reducing power costs and decarbonizing up to 1GW of load, while the Donghwa energy-storage partnership emphasized longer replacement cycles, less cooling need, and lower total cost of ownership. Those are not peripheral ESG claims; they are margin levers. Peer filings reinforce the point. Digital Realty warns that electricity is a significant operating expense and that not all inflation can be passed through to customers, while Equinix and GDS show that recurring revenue quality coexists with heavy operating and capital demands. Iron Mountain’s capex breakdown, and Digital Realty’s debt disclosures, further show that scaled data-center operators repeatedly spend on both growth and recurring maintenance. For Digital Edge, the likely model
    is simple to describe but hard to quantify publicly: recurring infrastructure revenue sits on top of large fixed assets, meaningful electricity exposure, and constant financing needs.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI032
  - CI030
  - CI031
  - CI033
