    - Important attachment revenue likely exists
    - Monthly yield and attach rate
  - - Hyperscale campus capacity
    - 'No'
    - MW-scale campus pages and build-to-suit language
    - Commercial terms likely negotiated by phase and anchor commitment
    - Take-or-pay floors and escalation formulas
  - - Remote hands / support
    - 'No'
    - Operational-delivery and support language is present
    - May support service or install fees
    - Extent of pass-through versus margin contribution
  notes: This table intentionally records unit cues and unknowns instead of inventing synthetic pricing.
