- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue per MW / cabinet
    - Not disclosed
    - Low
    - Core monetization output
    - Provide realized yield by site and product
  - - Gross margin by product
    - Not disclosed
    - Low
    - Separates sticky infrastructure value from pass-through power cost
    - Provide product and site-level gross margins
  - - Power pass-through ratio
    - Not disclosed
    - Low
    - Determines inflation sensitivity
    - Provide contract pass-through mechanics and exceptions
  - - Build cost per MW
    - Partially visible via India / SEL2 disclosures
    - Medium
    - Core return-on-capital driver
    - Provide by-phase capex and contingency budgets
  - - Utilization / commitment
    - Not disclosed for Digital Edge; visible for peers
    - Low
    - Shows how fast signed capacity converts into billed revenue
    - Provide commitment, utilization, and backlog by facility
  - - Churn / renewal
    - Not disclosed for Digital Edge; peer proxy only
    - Low
    - Key test of revenue durability
    - Provide churn and renewal history by cohort
  notes: Peer filings help frame which fields matter, but Digital Edge does not disclose the answers.
