- id: underwriting-gaps
  title: Financial verdict and the gaps that still block underwriting
  body: 'The public case for Digital Edge is financially credible but under-disclosed. Credible, because the company has repeatedly attracted large pools of capital, secured project-level and corporate-level debt, and continued to add campuses in markets where land, power, and entitlement are hard to assemble. Under-disclosed, because the metrics that actually determine value are still absent: revenue, EBITDA, utilization, churn, customer concentration, signed-but-not-billed backlog, realized price per rack or megawatt, gross margin by product, and cash-on-hand. Peer filings make clear why these fields matter. Recurring revenue models can look strong even while capex, energy, or debt burdens undermine free cash flow. Digital Edge’s public materials support a late-stage private infrastructure-platform classification, but not a full bottom-up model. The right conclusion is therefore two-part: revenue quality is likely better than a generic startup’s because the underlying contracts and assets
    are sticky, but margin quality, return on incremental capital, and true runway remain diligence questions that management must answer directly with private KPI packs and facility-level financials.'
