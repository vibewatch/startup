  topStrengths:
    - Stonepeak 背书、贷款方多次支持、跨国园区落地，让 Digital Edge 比一般不透明的私营基础设施公司更可信。
    - 平台已披露版图和 1.8GW 已锁定电力叙事，贴合 APAC 超大规模与 AI 基础设施估值背后的稀缺逻辑。
    - 2025 年 1 月股权加债务融资、2026 年 5 月 HoldCo 融资工具，证明 Digital Edge 仍能持续拿到资金。
    - 公司卡位多个重要 APAC 需求走廊，而不是押注单一市场。
  topRisks:
    - 收入、EBITDA、利用率、积压订单和股权结构条款仍未披露；相对公司质量，估值支撑偏弱。
    - 客户集中度以及已签约与已计费需求之间的差距，公开资料仍只露出一部分。
    - 数据中心园区经济性对电力获取、建设节奏和再融资环境仍高度敏感。
    - 如果 Digital Edge 不能把稀缺资源转成差异化经济性，更大的区域和全球运营商会挤压回报。
    - 公开记录还看不出 IPO 级披露准备度，削弱了退出就绪度信心。
  unresolvedGaps:
    - 当前投后估值、普通股定价和清算优先权结构。
    - 经审计收入、EBITDA、利用率，以及按园区或阶段拆分的积压订单。
    - 头部客户集中度、续约行为，以及按市场拆分的已签约与已计费 MW。
    - 1.8GW 已锁定 IT 电力能否及时转成经济性有吸引力的园区填充。
    - 最大未来园区的资本开支强度、回报和时间表，是否达到管理层披露标准。
