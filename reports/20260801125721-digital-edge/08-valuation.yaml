company:
  name: Digital Edge
chapter:
  number: 8
  title: Valuation
  summary: Digital Edge looks strategically credible but publicly under-disclosed. Scarcity comps and lender support argue the platform could be worth a great deal, yet the absence of revenue, backlog, utilization, and cap-table terms means the only defendable public-evidence call is track / research-more with strict price discipline.
sections:
- id: recommendation
  title: 'Recommendation: track the company, not the unknown price'
  body: 'Digital Edge looks like a serious platform. It has sponsor backing, repeated lender support, a large and growing APAC footprint, and a secured-power narrative that is directionally consistent with why scarce data-center assets command premium valuations. But none of that answers the most important investment question: what price are you being asked to pay, and what economics sit under that price? The January 2025 financing disclosed US$640 million of equity and US$1.0 billion of debt but not the post-money. The 2026 HoldCo financing adds more lender confidence, but again does not solve common-equity valuation. That makes a simple recommendation unavoidable: the right stance on public evidence alone is track or research-more, not buy and not dismiss. The company may deserve serious attention, yet the price discipline threshold cannot be determined confidently until management opens a KPI and cap-table room or a priced financing can be triangulated to comparables.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV028
  - CV029
