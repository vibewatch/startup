    - Supportable only toward US$12-18B reference range
    - Execution still matters, but scarcity dominates
    - Needs strong KPI room and continued financing access
  - - Base
    - Platform remains credible but economics stay private
    - Supportable around US$7-10B reference range
    - Opacity discount persists
    - Most plausible on public evidence
  - - Bear
    - Phase fill, financing, or concentration disappoints
    - Supportable only around US$4-6B reference range
    - Regional-growth-comp framing replaces scarcity premium
    - Triggered by weak customer or refi evidence
  notes: Ranges are reference bands for decision-making, not observed fair values.
