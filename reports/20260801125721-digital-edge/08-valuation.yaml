- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: This table captures the most relevant public and private platform references visible from fetched sources; it is not an exhaustive global data-center comp set.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Equinix
    - Market cap / recurring revenue
    - ~US$100.6B mcap; >90% recurring revenue
    - Upper-bound quality and ecosystem leader
    - Far larger and more mature than Digital Edge
  - - Digital Realty
    - Market cap / backlog
    - ~US$70.9B mcap; US$1.8B backlog
    - Global scale and financing benchmark
    - REIT structure and disclosure depth differ materially
  - - GDS
    - Market cap / revenue
    - ~US$6.6B mcap; RMB11.43B revenue
    - Scaled Asian growth comp with real risk factors
    - China-specific exposure
  - - NEXTDC
    - Market cap / order book / capex
    - ~US$7.15B mcap; large order book and heavy capex
    - Best public APAC growth-platform analogue
    - Australia-led footprint and public-market disclosure
  - - AirTrunk
    - Private M&A transaction
    - ~A$24B acquisition value
    - Scarcity-value benchmark for APAC hyperscale assets
    - Control premium and deal-cycle conditions differ
  - - Iron Mountain Data Centers
    - Adjacency / capex context
    - ~US$52.3B parent mcap
    - Useful for capital-intensity framing
    - Broader business mix muddies comparability
  notes: The comparable set mixes public market cap references with one private M&A anchor to avoid false apples-to-apples precision.
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV009
  - CV010
  - CV008
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Capital access weakens
    - Meaningfully worse refi terms or delayed financings
    - Undercuts scarcity narrative and slows buildout
    - Move toward pass or require deeper discount
  - - Phase fill disappoints
    - Early campuses or later phases lag pre-lease expectations
    - Cuts utilization and revenue-conversion confidence
    - Rebase valuation toward bear range
  - - Customer opacity persists
    - No top-customer / backlog disclosure through diligence
    - Makes concentration and retention unpriceable
    - Do not pay premium multiple
  - - Operating proof breaks
    - Material incident or uptime contradiction emerges
    - Damages trust and exit-readiness case
    - Increase risk rating and lower range
  notes: These are monitorable thresholds rather than vague concerns.
  claimRefs:
  - CV039
  - CV036
  - CV035
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Campus-level revenue and EBITDA
    - No public income statement by campus or portfolio
    - Needed to distinguish scarcity from real earnings power
    - Management finance room / audited pack
  - - Backlog, utilization, and committed MW
    - No public conversion data by campus
    - Needed to model ramp timing and capital efficiency
    - Commercial ops pack by site
  - - Cap table and preference terms
    - No public post-money or preference stack
    - Needed to know what any quoted valuation really means
    - Counsel / latest term sheet
  - - Top-customer concentration
    - No public account-share disclosure
    - Needed to quantify phase-fill and renewal risk
    - Account-level diligence summary
  - - Debt schedule and covenants
    - Only event-level financing releases are public
    - Needed to understand refi risk and downside resilience
    - Treasury schedule and lender docs
  notes: These asks are the minimum set that can move the recommendation materially.
  claimRefs:
  - CV040
  - CV041
  - CV042
