  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Secured-power and APAC scarcity can create real platform value
    - Proof that secured power does not convert into billed demand would weaken the thesis
  - - Repeated debt and equity support imply bankability
    - Loss of lender appetite or materially worse refinancing terms would weaken the thesis
  - - Carrier-neutral, multi-country positioning can support strategic optionality
    - Evidence of thin customer breadth or low utilization would weaken the thesis
  - - Opacity on revenue, backlog, and cap table still warrants a discount
    - Clean KPI disclosure and disciplined terms would narrow the discount
  notes: Both thesis and anti-thesis are grounded in observable evidence gaps, not just qualitative impressions.
