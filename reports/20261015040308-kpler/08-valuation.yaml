    type: flow
    summary: >-
      Strategic product proof and fresh capital support continued diligence, but
      financing opacity keeps the price call unresolved.
    data:
      nodes:
        - id: breadth
          label: Broad commodity workflow
          note: "40+ commodities; 36k+ vessels; forecasts and refinery coverage."
        - id: integration
          label: Enterprise distribution
          note: "Kpler APIs plus ICE Connect / ICE Data API delivery."
        - id: validation
          label: Independent proof with caveats
          note: "Reviews call Kpler strong, but estimates remain probabilistic."
        - id: capital
          label: Fresh financing signal
          note: "$1.0bn June 2026 Sixth Street transaction."
        - id: opacity
          label: Economic opacity
          note: "No disclosed group ARR, retention, gross margin, post-money, or preference stack."
        - id: call
          label: Track; valuation unknown
          note: "Advance only after KPI pack and financing documents are shared."
      edges:
        - from: breadth
          to: integration
          label: "supports"
        - from: integration
          to: validation
          label: "reinforced by"
        - from: validation
          to: capital
          label: "makes financing signal plausible"
        - from: capital
          to: opacity
          label: "does not resolve"
        - from: opacity
          to: call
          label: "drives"
    approximationNotes: >-
      Flow states the logical chain only; it does not imply a numeric valuation
      range or probability weight beyond the cited claims.
    claimRefs: [CV006, CV007, CV008, CV011, CV012, CV014, CV015]
