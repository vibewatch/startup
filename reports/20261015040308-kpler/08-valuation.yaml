  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Exact post-money valuation, liquidation preferences, governance rights, and dilution terms for the June 2026 Sixth Street round.
      whyItMatters: The public $1.0bn transaction headline cannot be translated into investor entry price or downside protection without the financing stack.
      diligencePath: Request the signed financing summary, cap table, and board approval materials for the June 2026 transaction.
      relatedQuestionRefs: [QV003, QV008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Consolidated ARR or revenue run rate, gross margin, NRR/GRR, churn, and module-level expansion metrics.
      whyItMatters: Recommendation quality depends on whether workflow breadth converts into durable, efficient recurring revenue rather than expensive but shallow adoption.
      diligencePath: Request the last 24 months of board KPI packs, cohort retention cuts, and gross-margin bridge by product module.
      relatedQuestionRefs: [QV003, QV007, QV008]
    - type: private-evidence-only
      severity: material
      topic: growth-quality
      missingEvidence: Revenue bridge showing organic growth versus acquisition contribution, plus top-customer and module concentration.
      whyItMatters: Scenario underwriting changes materially if recent scale comes mainly from M&A or a narrow premium module base rather than broad durable customer expansion.
      diligencePath: Obtain acquisition revenue bridges, segment P&Ls, and top-20 customer concentration data before any investment committee decision.
      relatedQuestionRefs: [QV006, QV008]
