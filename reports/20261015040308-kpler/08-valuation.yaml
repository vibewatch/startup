schemaVersion: report-v2
artifact: valuation
slug: kpler
runDate: 2026-10-15
company:
  name: Kpler
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports Kpler as a strategically valuable,
    workflow-embedded commodity intelligence platform with fresh outside capital,
    but not yet as a price-cleared buy. The combination of a disclosed $1.0bn
    June 2026 Sixth Street transaction, strong product/distribution signals, and
    persistent opacity on consolidated ARR, retention, gross margin, post-money
    value, and preference terms supports a track recommendation with medium
    confidence, high risk, and an unknown valuation stance.
sections:
  - id: recommendation-and-public-price-support
    title: Recommendation and public price support
    body: >-
      The evidence set is strong enough to say Kpler matters strategically, but
      not strong enough to underwrite price. Official product pages and ICE's
      partner catalog show wide multi-commodity coverage, API delivery, and
      workflow integration that fit real trading, risk, and supply-chain use
      cases. Independent 2026 reviews also still describe Kpler as market
      leading, which supports the idea that the asset has real customer value.
      The valuation problem is disclosure, not strategic relevance: public
      sources in this pool confirm a $1.0bn June 2026 Sixth Street transaction,
      but they do not disclose consolidated ARR, gross margin, retention,
      post-money valuation, or preference terms. That keeps this chapter at
      track rather than buy, with risk remaining high until management provides
      direct underwriting evidence.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV013, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis-and-scenarios
    title: Thesis, anti-thesis, and scenarios
    body: >-
      The positive case rests on breadth plus entrenchment: Kpler says Cargo
      Analytics spans 40+ commodities and 36k+ vessels, its Trading &
      Commodities product adds forecast and refinery workflows, and ICE carries
      the data through its own API stack. That combination suggests customers
      can embed Kpler deeply enough for durable spend. The anti-thesis is that
      independent reviewers still describe the output as probabilistic in thin
      data regions and still warn that premium pricing, satellite AIS, and deep
      archives can raise procurement friction. In other words, the company can
      be strategically important while still failing to justify an aggressive
      private-market entry price if the eventual retention, margin, or contract
      data prove weaker than the product story implies.
    claimRefs: [CV004, CV005, CV006, CV007, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV002, TV003]
  - id: diligence-asks-and-thesis-breaks
    title: Diligence asks and thesis-break triggers
    body: >-
      The next diligence step is not another branding or product demo; it is a
      pricing file. To move from track to buy, management needs to show the
      actual economics behind the June 2026 financing: consolidated ARR or
      revenue run rate, gross margin, retention, logo churn, customer
      concentration, post-money valuation, and any investor protections that
      alter the effective entry price. A thesis break would appear if those
      materials show that recent growth is acquisition-dependent, that premium
      modules do not convert into durable subscription expansion, or that the
      financing stack gives new capital materially better downside protection
      than minority holders would receive. Until then, the right posture is to
      monitor, not to force false precision.
    claimRefs: [CV008, CV009, CV010, CV012, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Evidence signal
      - Decision implication
    rows:
      - [Recommendation, track, "Strategic asset; price not yet underwritten publicly.", "Keep in active coverage but do not underwrite a buy call yet."]
      - [Confidence, medium, "Independent product validation exists, but economic disclosure is thin.", "Use diligence milestones rather than conviction-weighted sizing."]
      - [Risk rating, high, "Opaque unit economics and financing terms can change downside sharply.", "Require direct KPI and cap-table evidence before advancing."]
      - [Valuation stance, unknown, "The pool confirms a 2026 financing event but not a public post-money or multiple.", "Avoid anchoring to an unsupported private-market price."]
      - [Entry discipline, data-gated, "Only proceed after ARR, retention, gross margin, and preference terms are evidenced.", "Treat missing values as blockers to a price-led recommendation."]
    notes: >-
      Synthesis of this chapter's cited claims only; blank public valuation
      fields reflect nondisclosure rather than zero values.
    claimRefs: [CV007, CV008, CV009, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - ["Product breadth", "40+ commodities, broad vessel coverage, and integrated forecasts can make Kpler a default workflow layer for commodity desks.", "Breadth does not guarantee accuracy in sparse AIS regions or specialist use cases.", "Independent win-rate, retention, and usage-expansion evidence by module."]
      - ["Distribution & integration", "ICE distribution, APIs, and Excel / workflow tooling raise switching costs for enterprise users.", "Integration value can be offset if pricing tiers or archive access force buyers to down-scope.", "Signed customer references and net retention by integrated accounts."]
      - ["Financing signal", "A fresh June 2026 Sixth Street transaction suggests external confidence in the category and the asset.", "The transaction alone does not reveal post-money valuation, governance rights, or downside protection.", "Cap table, liquidation preferences, and board/control terms."]
      - ["Public price support", "There is enough evidence to justify continued coverage and diligence.", "There is not enough public evidence to justify an attractive/fair/stretched call with precision.", "Consolidated ARR, gross margin, churn, and acquisition-to-organic growth bridge."]
    notes: >-
      Analytical framing table; rows combine official, partner, and independent
      sources to show where the thesis is evidenced versus where price proof is
      still missing.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "API-led workflows, broad commodity coverage, and forecast/refinery tools translate into durable expansion and premium renewal economics.", "Could support an attractive entry only if diligence proves premium recurring-revenue quality above current public evidence.", "Would require direct KPI disclosure that validates high retention and strong margins.", "Failure to convert breadth into measurable wallet expansion."]
      - ["Base", "Kpler remains strategically useful and commercially relevant, but public economics stay incomplete and pricing remains hard to underwrite.", "Supports continued tracking, selective engagement, and diligence without committing to a buy or clear valuation stance.", "Best match for today's mixed evidence: strong product proof, weak public price proof.", "Management withholds KPI pack or financing terms through diligence."]
      - ["Bear", "Premium modules, probabilistic estimates, and opaque terms limit willingness to pay and expose investors to asymmetric downside.", "Could make the current round look expensive ex post if retention, margins, or rights are weaker than the product narrative implies.", "Independent reviews already flag pricing friction and the need for corroboration in opaque regions.", "Evidence of weak retention, acquisition-dependent growth, or investor-favored preferences."]
    notes: >-
      Public sources do not disclose a reliable post-money valuation or enough
      unit economics for numeric ranges, so scenario rows state underwriting
      conditions instead of unsupported multiples.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV014, CV016]
figures:
