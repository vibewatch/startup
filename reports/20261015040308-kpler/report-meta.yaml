summary:
  headline: >-
    Kpler remains a category-defining physical trade intelligence platform with a hard-to-replicate AIS moat and broad
    enterprise traction, but the June 2026 Sixth Street entry still implies a stretched valuation and disclosure gaps
    around unit economics, growth quality, and regulatory overhang.
