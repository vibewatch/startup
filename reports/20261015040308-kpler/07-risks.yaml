      basis: >-
        Covers legal, privacy, sanctions, and certification risks visible in the eight assigned prefetched sources; it is not an exhaustive jurisdictional or docket review.
    claimRefs: [CR004, CR006, CR007, CR012, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor or kill criterion
    rows:
      - - Incorrect cargo, destination, or volume inference
        - Independent reviews call cargo estimates probabilistic and identify sparse AIS, spoofing, dark fleets, re-flagging, and ship-to-ship transfers as error sources.
        - Documented limitations; frequency is not disclosed.
        - High when used as definitive settlement or compliance proof.
        - Multi-source fusion and expert validation are described.
        - High until corridor-level precision, recall, and error costs are measured.
        - Kill the thesis for persistent material errors on priority routes or use cases after calibration.
      - - Terminal, API, or embedded-workflow disruption
        - Delivery spans a login terminal, APIs, Excel, Snowflake Data Share, and LiveDB; no allocated SLA or outage history is available.
        - Unknown.
        - High for customers whose trading or operations depend on continuous feeds.
        - Multiple channels exist, but redundancy and recovery performance are not evidenced.
        - Unknown to high depending on customer architecture.
        - Require SLA attainment, incident history, RTO/RPO, failover results, and customer-side continuity tests.
      - - Uneven coverage or model performance
        - Kpler describes continuous backtesting, while reviews report lower accuracy in sparse-AIS and complex-transfer settings.
        - Expected to vary by corridor and commodity; no quantified distribution is public here.
        - Medium to high for thin-data workflows.
        - Backtesting against official reporting organizations is company-described.
        - Medium until segmented error metrics are supplied.
        - Track error by commodity, geography, event type, and time-to-correction against desk confirmations.
      - - Scope and denominator ambiguity
        - Official pages cite both 36,000-plus commodity vessels and 300,000-plus vessels tracked daily without a shared population definition.
        - Current public disclosure issue.
        - Medium because scale claims can be misread and coverage gaps obscured.
        - No reconciliation is visible in the allocated pages.
        - Medium for underwriting coverage breadth.
        - Require a metric dictionary reconciling active, commodity, global, and daily-tracked vessel populations.
    notes: >-
      Likelihood and severity are qualitative because the assigned sources provide no incident frequency, error distribution, uptime history, or loss denominator; conditional ratings state the workflow in which impact becomes material.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR008, CR009, CR014]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or system
      - Role
      - Concentration disclosure
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Maritime and trade-data inputs
        - Satellite and terrestrial AIS, imagery, ports, terminals, customs, shipping records, pipelines, storage, government statistics, and commercial reporting
        - Feed vessel positions, cargo events, inventories, and model features.
        - Providers, contractual concentration, and substitution rights are not disclosed.
        - Loss, delay, licensing restriction, or manipulation of a critical input degrades coverage or inference quality.
        - High if a priority corridor depends on a non-substitutable feed.
        - Kpler describes multi-source fusion, machine learning, expert validation, and backtesting.
        - Unknown until source-level lineage, concentration, and fallback tests are reviewed.
      - - Product-delivery stack
        - Commodities Terminal, API, Excel Add-In, Snowflake Data Share, and LiveDB
        - Deliver data into user and machine workflows.
        - Hosting, cloud, and software-provider concentration are not disclosed.
        - Authentication, API, data-share, or integration failure interrupts customer workflows.
        - High for embedded operational or trading use.
        - Multiple delivery modes offer potential redundancy.
        - Unknown because uptime, recovery, and cross-channel independence are not evidenced.
      - - External pricing and benchmark inputs
        - Spark and Baltic Exchange
        - Overlay price and commodity fundamentals for contract analysis.
        - Data-rights terms and alternatives are not disclosed.
        - Feed loss, latency, or license change reduces integrated analysis.
        - Medium for workflows using those overlays.
        - The broader platform combines price and physical-flow data.
        - Medium pending contract, substitution, and lineage review.
    notes: >-
      Dependency names and roles come from company-issued pages; concentration, contract, uptime, and substitutability fields are explicitly gaps rather than inferred facts.
    claimRefs: [CR003, CR008, CR009, CR010, CR011, CR015, CR016]
figures:
  - id: FR001
    title: Residual-risk heatmap by evidence strength
    type: matrix
    summary: >-
      Qualitative matrix separates documented failure modes from exposures that remain unquantified in the assigned public evidence.
    data:
      columns:
        - label: Likelihood evidence
          detail: Whether the allocated sources quantify or merely identify the failure mode.
        - label: Conditional impact
          detail: Impact depends on the customer workflow stated in each row.
        - label: Mitigation maturity
          detail: Publicly described controls, not independently audited effectiveness.
        - label: Residual assessment
          detail: Current underwriting view after the disclosed mitigation.
      rows:
        - label: Cargo inference error
          note: Sparse AIS, spoofing, dark fleets, and transfers can impair estimates.
          values: [Documented; frequency unknown, High for settlement or compliance proof, Multi-source fusion described, High pending route tests]
        - label: Sanctions false negative
          note: Company controls are described without an effectiveness audit.
          values: [Unquantified, High for compliance decisions, Screening and daily updates claimed, High pending known-case benchmark]
        - label: Service or API disruption
          note: No allocated SLA, outage history, or recovery evidence.
          values: [Unknown, High for embedded workflows, Multiple channels described, Unknown to high]
        - label: Privacy or control deficiency
          note: Mobile telemetry disclosure is narrower than a full enterprise control review.
          values: [Unknown, Medium pending data map, Initial disclosure only, Medium]
        - label: Critical input loss
          note: Provider concentration and substitution rights are not disclosed.
          values: [Unknown, High if non-substitutable, Multi-source approach described, Unknown]
        - label: Integration and cost friction
          note: Reviews report weeks for custom integrations and scaling license costs.
          values: [Reported by reviewers, Medium for expansion, Trial and modular rollout available, Medium]
    approximationNotes: >-
      Qualitative labels only; the assigned sources do not provide probabilities, incident rates, loss magnitudes, or audited control-effectiveness scores.
    claimRefs: [CR004, CR006, CR009, CR011, CR012, CR013, CR015]
callouts:
  - calloutType: risk
    title: Kill criteria
    body: >-
      Re-underwrite or reject the thesis if route-level tests show persistent material inference error, known-case sanctions screening produces material false negatives, critical feeds lack substitution, repeated SLA failures disrupt embedded workflows, or integration and license economics prevent customer expansion.
    claimRefs: [CR004, CR005, CR006, CR009, CR011]
