company:
  name: Kpler
chapter:
  number: 7
  title: Risks
  summary: >-
    Kpler's central risk is that customers may embed probabilistic maritime intelligence in high-consequence trading, compliance, and operational workflows. Company-described backtesting, multi-source inputs, sanctions screening, and multiple delivery channels mitigate that exposure, but the allocated public evidence does not establish service levels, incident history, security certifications, legal posture, source concentration, or model-error rates.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture and thesis-break conditions
    body: >-
      The highest residual exposure is decision error when estimated cargo, destination, or sanctions signals are treated as definitive evidence. Two independent reviews describe cargo inference as probabilistic and identify sparse AIS, spoofing, dark fleets, re-flagging, and ship-to-ship transfers as failure modes; Kpler itself markets tools intended to detect several of those same behaviors. The second tier is service and integration continuity because customers can consume the product through a terminal, APIs, Excel, Snowflake Data Share, and LiveDB. Investment underwriting should therefore require route-level accuracy testing, documented incident and SLA performance, and evidence that no single data provider or delivery channel can disable critical workflows.
    claimRefs: [CR004, CR005, CR006, CR009, CR010, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-compliance
    title: Regulatory, legal, privacy, and compliance exposure
    body: >-
      Kpler says its platform provides daily sanctions updates, vessel and cargo screening, ownership-layer review, insurance and certification checks, and alerts for AIS gaps and spoofing. Those are mitigations, not independent proof of screening efficacy or regulatory compliance. The iOS listing also discloses that identifiers, usage data, and diagnostics may be collected without being linked to identity, but the allocated evidence does not include a complete privacy notice, DPA, audit report, security certification, litigation docket, or enforcement record. A false negative in sanctions screening could be severe for customers using the output in compliance decisions, while the likelihood and control effectiveness remain unquantified.
    claimRefs: [CR006, CR007, CR012, CR016]
    tableRefs: [TR001]
  - id: operational-model-and-quality
    title: Operational, model-quality, and reliability exposure
    body: >-
      Kpler combines satellite AIS, imagery, port and terminal intelligence, customs and shipping records, pipeline and storage information, government statistics, company disclosures, machine learning, and expert validation. This breadth reduces dependence on any single signal but creates a larger ingestion, licensing, reconciliation, and quality-control surface. Kpler says it backtests trade-flow data against organizations such as JODI and EIA; reviewers nevertheless caution that coverage weakens in thin-data regions and that inferred cargo cannot replace contract documents. Public scope labels also differ between 36,000-plus commodity vessels and 300,000-plus vessels tracked daily, so diligence must reconcile populations and test error rates by commodity, corridor, and use case.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR008, CR014]
    tableRefs: [TR002]
  - id: dependencies-and-execution
    title: Partner, platform, commercial, and execution dependencies
    body: >-
      The product depends on external data ecosystems as well as Kpler's own models and delivery stack. Official pages identify price inputs from Spark and Baltic Exchange and describe integrations through APIs, Excel, Snowflake Data Share, and LiveDB, but do not disclose supplier concentration, substitution rights, uptime commitments, or recovery objectives. Independent reviews report that custom API and enterprise deployments can require weeks, that license cost rises with modules, users, and API usage, and that customer calibration is necessary. The thesis should break if validation shows persistent high-value route errors, material sanctions false negatives, repeated SLA failures, loss of a critical feed without substitution, or integration economics that prevent expansion.
    claimRefs: [CR009, CR010, CR011, CR013, CR015, CR016]
    tableRefs: [TR003]
