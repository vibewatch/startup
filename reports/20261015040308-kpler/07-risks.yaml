        - The allocated evidence does not establish active proceedings, regulatory findings, required licenses, or current security certifications.
        - Corporate and operating jurisdictions
        - Unknown.
        - Unrated; evidence gap.
        - Not assessable from the assigned sources.
        - Unknown.
        - Run legal docket and regulator checks; obtain counsel letters, license register, SOC or ISO reports, penetration-test summary, and exceptions log.
    notes: >-
      Partial public-evidence register as of 2026-10-15; severity is conditional on the stated use case, "unknown" means the allocated source pool does not support a rating, and absence of an identified proceeding or incident is not evidence of absence.
