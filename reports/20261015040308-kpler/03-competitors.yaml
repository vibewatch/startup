      - ["Satellite AIS, historical archives, premium data layers", "Usually priced separately per independent review", "Deeper history, expanded visibility, higher-frequency intelligence", "No public side-by-side rate card in retained sources", "Advanced workflows can get expensive as use cases widen"]
      - ["Enterprise/API deployment", "Subscription plus API volume / delivery scope", "REST APIs, bulk delivery, Excel integration, data-share options", "Commercial terms and discounts not disclosed", "Best suited to teams that can operationalize the data in models and monitoring"]
