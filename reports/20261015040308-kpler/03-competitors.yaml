          claimRefs: [CP004, CP008]
        - label: Freight / news blends
          x: 4
          y: 4
          detail: Adjacent intelligence helps context, but retained evidence does not show Kpler-level telemetry depth.
          claimRefs: [CP004, CP008]
        - label: Broker / internal corroboration
          x: 3
