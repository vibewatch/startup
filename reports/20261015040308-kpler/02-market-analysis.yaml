schemaVersion: "report-v2"
artifact: "market-analysis"
slug: "kpler"
runDate: "2026-10-15"
company:
  name: "Kpler"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Kpler is selling into a narrow but economically meaningful layer of physical-trade intelligence rather than generic logistics software: desks that pay for earlier visibility on commodity flows, freight, inventories, and sanctions exposure. Public market sizing is therefore evidence-constrained, with Kpler disclosing coverage proxies such as 40+ commodities, 30,000+ to 36,000+ vessels, 12,000+ crude-oil tanks, and 900+ refineries instead of a clean TAM/SAM/SOM or a public price list."
sections:
  - id: "market-boundary"
    title: "Market boundary: physical-trade intelligence, not horizontal enterprise software"
    body: >
      The assigned evidence positions Kpler inside the operating layer where commodity traders, analysts,
      schedulers, and risk teams need earlier visibility on cargoes, vessels, inventories, and freight
      bottlenecks. Kpler's own product and industry pages frame the product around cargo tracking, trade-flow
      analytics, forecasts, and supply-chain visibility across 40+ commodities, while the World Economic Forum
      profile broadens that scope to energy, dry bulk, power, and maritime sectors. That boundary matters for
      valuation: the relevant budget is specialist market-intelligence and workflow tooling for physical trade,
      not generic ERP, procurement, or inland transport software. In practice, Kpler is sold as an accelerator
      for faster physical-market decisions and cross-checking, sitting on top of broker calls, customs and port
      data, and trader spreadsheets rather than replacing core execution systems outright.
    claimRefs: [CM001, CM002, CM010]
    tableRefs: [TM001]
  - id: "sizing-and-segmentation"
    title: "Sizing lens: public coverage proxies show scope, but not a disclosed TAM stack"
    body: >
      No source in the assigned pool publishes a conventional TAM/SAM/SOM for commodity-flow intelligence, so
      the usable market-sizing evidence is operational rather than spend-based. Kpler instead discloses coverage
      and workflow proxies: 40+ commodities, tens of thousands of vessels, 12,000+ crude-oil tanks, 900+
      refineries, long historical data archives, and high-frequency trade/event workflows. Those metrics imply
      a serviceable footprint centered on global physical commodity desks and adjacent risk, logistics, and
      research users, but they do not reveal segment revenue density, willingness to pay, or attach rates by
      module. The conflicting 30,000+ versus 36,000+ vessel disclosure and 9+ versus 10y+ history language
      reinforce that public sizing should be treated as a range of marketing proxies, not a precise market map.
    claimRefs: [CM001, CM003, CM006, CM007, CM008, CM009, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "drivers-and-constraints"
    title: "Adoption drivers and constraints"
    body: >
      Kpler's adoption case is strongest where minutes matter: arbitrage detection, route changes, congestion,
      sanctions screening, and operational confirmation for cargoes that can move prompt spreads or delivery
      windows. The public workflow evidence shows a clear integration path through APIs, Excel, alerts, and
      marketplace delivery, which can raise switching costs once a desk wires Kpler into recurring models and
      alerts. The same evidence also highlights the core limits of the category. Independent review text treats
      cargo estimates as probabilistic, especially in opaque regions, ship-to-ship transfers, and dark-fleet
      activity, and the company does not publish a list price or clean module waterfall. That means buyers can
      understand the problem and product fit from public sources, but still need live pricing, attach-rate, and
      ROI diligence before underwriting market depth or expansion efficiency.
    claimRefs: [CM004, CM005, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
