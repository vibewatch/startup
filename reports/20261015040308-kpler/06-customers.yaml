company:
  name: Kpler
chapter:
  number: 6
  title: Customers
  summary: >-
    The assigned evidence shows Kpler's strongest customer fit with commodity trading desks and adjacent
    maritime, industrial, financial, and government users that need real-time physical-trade visibility,
    while official case-study teasers support some real production deployments. What remains missing is the
    underwriting layer: public retention, churn, contract-length, and concentration disclosure are absent, so
    durability still rests on workflow fit and reference quality rather than measurable renewal data.
sections:
  - id: segment-and-persona-fit
    title: Segment coverage is broad, but the center of gravity is commodity trading and adjacent workflows
    body: >-
      Across the assigned pool, Kpler is consistently positioned as a subscription analytics product for
      professional users who act on physical-trade information rather than for casual market observers. The
      most repeated buyer and user groups are commodity traders, analysts, risk managers, shipping
      professionals, and adjacent industrial users who need vessel, cargo, and inventory visibility in time to
      change hedging, sourcing, logistics, or compliance decisions. Official product pages broaden that
      surface beyond core trading desks to refiners, utilities, financial institutions, governments, and risk
      teams, which implies Kpler sells into several budget owners but around a common workflow: using
      near-real-time physical-flow data to improve commercial or operational decisions. The breadth matters
      because it supports cross-sell across commodities and delivery modes, but the public evidence still does
      not break out how much revenue comes from each segment or from the MarineTraffic side of the business.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU011
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-and-reference-quality
    title: Public proof shows meaningful workflow adoption, but most named references are teaser-level
    body: >-
      Kpler's public customer proof is directionally useful but uneven in quality. On the adoption-surface
      side, the company claims thousands of users, 36,000+ vessels covered, and delivery through API, Excel,
      and data-share formats, all of which suggest enterprise usage patterns rather than a lightweight
      newsletter product. On the named-proof side, the strongest assigned evidence comes from official case
      study teasers: Unilever for a Virtual Ocean Control Tower use case, Renault for shipment management,
      and Johnasia for maritime communication workflow tooling. Those references are better than raw logos
      because they specify a use case and imply production usage, but they remain short-form teasers with no
      contract value, seat count, renewal history, or quantified ROI beyond the stated outcome. Independent
      reviews also reinforce that Kpler is most compelling where cargo events move price, freight, or delivery
      outcomes quickly, which is a stronger signal of mission-critical workflow fit than of measured customer
      stickiness.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU002
      - TU003
  - id: durability-expansion-and-concentration-risks
    title: Expansion logic is visible, but retention and concentration remain largely unverified
    body: >-
      The best evidence for expansion is commercial structure rather than disclosed cohort data. Independent
      reviews describe modular licensing, tiered access to APIs and historical archives, and the ability for
      desks to start with focused subscriptions before widening module or integration scope, which is
      consistent with a land-and-expand motion inside trading organizations. At the same time, the same
      reviews surface friction that can slow or narrow adoption: premium pricing for deep data, the need to
      calibrate estimated cargo signals against other confirmations, and implementation effort for API-heavy
      deployments. The weakest part of the public record is durability. The assigned sources do not disclose
      NRR, GRR, churn, average contract length, or top-customer concentration, so there is no direct public
      way to distinguish broad logo presence from durable net expansion or to assess whether a few large
      trading customers dominate economics.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Core use case
      - Evidence of fit or scale
      - Strategic value / gap
    rows:
      - - Commodity trading desks
        - Trading heads, analysts, risk managers; usually desk or market-data budgets
        - Monitor cargo flows, inventories, freight signals, and hedging triggers
        - Official and independent sources repeatedly position Kpler around real-time flow intelligence, APIs, alerts, and desk workflows
        - Strongest-fit segment in the assigned pool; no disclosed desk count, ACV, or renewal data
      - - Shipping and maritime operators
        - Operations, chartering, port, and communication teams
        - Vessel tracking, compliance screening, and high-volume communication workflows
        - MarineTraffic plus Inbox references show operational workflow fit, including Johnasia's communication use case
        - Good adjacency and cross-sell logic, but public mix between MarineTraffic and core commodity intelligence revenue is unclear
      - - Industrial producers and supply-chain users
        - Supply-chain, procurement, and operations teams
        - Shipment visibility, refinery/import-export monitoring, and JIT logistics support
        - Renault and Unilever references show non-trading workflow adoption beyond energy desks
        - Deployment depth, seat count, and ROI are not disclosed in the assigned evidence
      - - Financial institutions, governments, and risk teams
        - Research, risk, compliance, and policy users
        - Strategic flow intelligence, sanctions/risk screening, and macro market monitoring
        - Tracker, app-store, and official pages all mention banks, hedge funds, governments, and risk teams
        - Important for TAM breadth, but no public segmentation of paid users or revenue contribution
    notes: >-
      Synthesizes issuer and reviewer descriptions of buyer/user groups; public sources do not disclose segment
      revenue mix, seat counts, or retention by cohort.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU011
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Product breadth
        - 40+ commodity markets covered
        - 2026 public descriptions (LinkedIn, VentureCapitalTracker)
        - Medium
        - Broad coverage supports cross-sell across desks and adjacent user groups
        - No split by paying customers, active accounts, or module penetration
      - - User-base disclosure
        - Thousands of users across the globe
        - 2026 Kpler cargo analytics page
        - Medium
        - Indicates meaningful installed usage footprint
        - Users are not the same as paying organizations, seats, or retained customers
      - - Asset coverage
        - 36,000+ vessels worldwide
        - 2026 Kpler cargo analytics page
        - Medium
        - Suggests operational depth valued by maritime and trading workflows
        - Covered vessels do not disclose customer count, revenue, or renewal
      - - Commercial packaging
        - Tiered subscriptions, focused modules, separately priced API/archive features
        - 2026 independent reviews
        - Medium
        - Packaging supports piloting, modular adoption, and potential expansion
        - No public conversion funnel from trial to expanded enterprise contracts
    notes: >-
      These are adoption surfaces rather than audited customer metrics; public evidence does not disclose logo
      count, NRR, GRR, churn, or contract duration.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU013
      - CU014
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Stated outcome
      - Limitation
    rows:
      - - Unilever
        - Consumer-goods supply chain
        - Virtual Ocean Control Tower using advanced AIS data
        - Production case-study teaser
        - Powers its Virtual Ocean Control Tower with advanced AIS data
        - No disclosed contract scope, timing, seat count, or quantified ROI
      - - Renault
        - Manufacturing and logistics
        - Shipment visibility and just-in-time production support
        - Production case-study teaser
        - Optimises just-in-time production for 100k shipments with precise vessel data
        - No baseline comparison, contract value, or renewal history disclosed
      - - Johnasia
        - Maritime operations
        - MarineTraffic Inbox communication and coordination workflow
        - Production case-study teaser
        - Simplifies high-volume communication and coordination with MarineTraffic Inbox
        - No public rollout date, user count, or measured labor savings disclosed
    notes: >-
      The assigned pool includes only short teaser lines for these references, not the underlying PDFs or full
      case-study narratives, so the table is evidence of named deployment but not of quantified retention or ROI.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of named customer references exposed in the assigned public Kpler product page; not an exhaustive
        customer list for the platform or for MarineTraffic products.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public evidence implies a journey from focused desk need to broader multi-workflow adoption, with
      expansion constrained by pricing, data-validation, and integration effort.
    data:
      items:
        - label: Workflow trigger
          actor: Trading, risk, logistics, or operations teams
          touchpoints:
            - Need faster visibility into cargo, vessel, inventory, or sanctions events
            - Commodity-specific workflow urgency is highest where missed signals can move P&L or delivery timing
        - label: Focused evaluation
          actor: Desk leads and analysts
          touchpoints:
            - Demo or targeted module evaluation around a corridor, commodity, or workflow
            - Buyers compare breadth and timeliness against niche alternatives or existing spreadsheets
        - label: Initial deployment
          actor: Analysts, traders, and operations users
          touchpoints:
            - UI, watchlists, alerts, and saved searches provide first operational value
            - Fast onboarding is easiest for teams already used to maritime dashboards
        - label: Workflow integration
          actor: Quant, risk, and data teams
          touchpoints:
            - API, Excel, and data-share delivery extend Kpler into CTRM, models, and reporting workflows
            - Enterprise customers negotiate SLA and update-frequency expectations
        - label: Expansion loop
          actor: Multi-desk or multi-commodity organizations
          touchpoints:
            - Tiered subscriptions allow focused modules first, then broader commodity, archive, or API bundles
            - Cross-sell logic improves as more desks rely on shared physical-flow data
        - label: Renewal and concentration unknowns
          actor: Finance and procurement stakeholders
          touchpoints:
            - Premium pricing, probabilistic cargo estimates, and validation effort can narrow rollout
            - Public evidence does not disclose churn, NRR, contract length, or top-customer concentration
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU016
callouts:
  - calloutType: insight
    title: Workflow fit looks strongest where physical-trade data changes high-value decisions quickly
    body: >-
      The strongest repeated persona across official and independent sources is the commodity trading or
      maritime-risk desk that needs near-real-time signal for hedging, routing, or compliance, rather than a
      generalized information buyer.
    claimRefs:
      - CU001
      - CU003
      - CU011
  - calloutType: risk
    title: Public customer-quality evidence is still weaker than public customer-breadth evidence
    body: >-
      Kpler has enough assigned evidence to show named use cases and multi-channel workflow fit, but not
      enough to publicly underwrite retention, renewal economics, or concentration risk with the precision a
      $4B-scale data platform would usually warrant.
    claimRefs:
      - CU015
      - CU016
