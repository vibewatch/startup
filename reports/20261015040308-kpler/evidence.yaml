    severity: material
    topic: current-financial-scale
    missingEvidence: 2025-2026 ARR, revenue, growth, retention, and module-mix disclosures.
    whyItMatters: >-
      The only hard revenue datapoint in the assigned pool is the January 2024 $100M ARR milestone, which is too stale
      to support a current scale or valuation conclusion on its own.
    diligencePath: >-
      Obtain monthly recurring revenue bridge, audited financials, cohort retention, and module-level expansion data for
      2025-2026.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
