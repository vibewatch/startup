evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Post-money valuation, instrument type, and cap-table math for the 2026 Sixth Street transaction.
    whyItMatters: >-
      A current valuation stance cannot be underwritten without knowing how much primary vs. secondary capital was
      involved and what ownership / governance rights were granted.
    diligencePath: >-
      Request the June 2026 term sheet, board approvals, cap table, and any investor presentation prepared for the Sixth
      Street process.
    relatedQuestionRefs:
