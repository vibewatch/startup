schemaVersion: report-v2
artifact: financials
slug: kpler
runDate: 2026-10-15
company:
  name: Kpler
chapter:
  number: 4
  title: Financials
  summary: >
    Kpler's public evidence points to a premium, modular subscription business built around
    multi-commodity intelligence, workflow integrations, and analyst research, but realized
    pricing and unit economics remain largely private. The June 2026 Sixth Street growth
    round appears to reinforce capital availability, yet missing consolidated ARR, gross
    margin, retention, and runway data still block a clean underwriting case.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and monetization surface
    body: >
      Kpler's public product surfaces describe a broad commercial package rather than a
      single-screen vessel tracker. The company markets cargo tracking, freight, compliance,
      inventories, refineries, research, supply-demand, chartering, arbitrage, and
      financial-flows workflows across 40+ commodities, with delivery through a web terminal,
      alerts, API, Excel Add-In, Snowflake Data Share, and LiveDB access. Independent review
      evidence says the business sells modular subscriptions by commodity and feature set,
      with pricing varying by module mix, user counts, API volume, and add-on services. The
      public gap is that Kpler does not expose official list prices, realized discounting,
      contract duration, or module attach rates in the assigned evidence, so public pricing
      should be treated as directional rather than underwritten revenue truth.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: delivery-economics-and-revenue-quality
    title: Delivery economics and revenue-quality proxies
    body: >
      The best public operating proxies point to an enterprise data product with meaningful
      expansion paths but limited disclosed efficiency metrics. Kpler's integration surface
      supports embedded workflows, and the independent review says standard Excel or
      watchlist deployments can be live within days while bespoke API or enterprise data-lake
      onboarding can take weeks and require sales and engineering coordination. Official
      pages also market proprietary data scale, expert analyst coverage, and thousands of
      organizational users, while the About page says Kpler has remained profitable from the
      start. Even so, none of the reviewed sources disclose consolidated ARR, gross margin,
      CAC, payback, NRR, churn, or cash conversion, and the only public revenue datapoint in
      the assigned pool is a UK legal-entity range that is not a group P&L.
    claimRefs: [CI002, CI005, CI006, CI007, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-diligence-blockers
    title: Capital adequacy and remaining diligence blockers
    body: >
      The strongest public capital signal is the June 2026 Sixth Street transaction.
      Business Wire, syndicated via Yahoo Finance, says Kpler secured over $1 billion of
      minority strategic growth equity, and the same release says management remains majority
      owners; Kpler's About page separately says the company remains primarily owned by its
      founders and team members. That combination suggests the round was positioned as growth
      capital for expansion and product development rather than a change-of-control rescue.
      However, the assigned pool still does not disclose current cash on hand, debt terms,
      burn, runway, or a use-of-funds bridge, and the independent review flags probabilistic
      cargo inference and scaling enterprise costs as real limitations. Financially, the new
      capital reduces immediate funding stress but does not remove the need for private
      diligence before underwriting valuation or downside risk.
    claimRefs: [CI007, CI008, CI009, CI011, CI014]
