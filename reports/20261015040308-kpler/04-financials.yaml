figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows how Kpler converts proprietary trade data and analyst workflows into modular subscription revenue, but not the realized unit economics of that model.
    data:
      nodes:
        - id: data-inputs
          label: Proprietary data inputs
          detail: "1.3bn+ AIS signals per day, 255k+ proprietary sources, 245k+ human contributors, and 15+ years of time-series data."
        - id: analytics-products
          label: Multi-commodity analytics products
          detail: "Cargo, freight, compliance, inventories, refineries, research, supply-demand, chartering, arbitrage, and financial-flows workflows across 40+ commodities."
        - id: workflow-delivery
          label: Workflow delivery
          detail: "Web terminal, live map, alerts, API, Excel Add-In, Snowflake Data Share, and LiveDB access embed Kpler inside trading workflows."
        - id: commercial-packaging
          label: Commercial packaging
          detail: "Independent review describes modular subscriptions priced by commodity coverage, user counts, API volume, and add-on services."
        - id: customer-outcome
          label: Customer adoption and expansion
          detail: "Kpler claims thousands of organizational users and sells research, forecasts, and analyst access alongside data workflows."
        - id: financial-outcome
          label: Financial outcome
          detail: "About page claims profitability from the start; June 2026 growth equity adds expansion capital, but public ARR and margin remain undisclosed."
      edges:
        - from: data-inputs
          to: analytics-products
          label: Data fusion and model building
        - from: analytics-products
          to: workflow-delivery
          label: Productized into user and API workflows
        - from: workflow-delivery
          to: commercial-packaging
          label: Monetized via modular subscription packaging
        - from: commercial-packaging
          to: customer-outcome
          label: Seat, module, and research upsell potential
        - from: customer-outcome
          to: financial-outcome
          label: Supports revenue growth, but public unit economics stay opaque
    approximationNotes: The flow describes the evidenced commercial path, not a quantified conversion funnel.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI008, CI013]
callouts:
  - calloutType: insight
    title: Premium data-and-research packaging is the public monetization signal
    body: >
      The assigned evidence supports a modular enterprise subscription model with data,
      workflow integrations, and analyst research layered together, which is a stronger
      revenue-quality signal than generic ship-tracking alone.
    claimRefs: [CI001, CI002, CI003, CI006]
  - calloutType: risk
    title: Public underwriting still stops at the dashboard edge
    body: >
      Even after a $1B+ growth round, the assigned pool does not disclose consolidated ARR,
      gross margin, CAC, retention, debt, cash, or runway, so valuation work still requires
      management-only financial diligence.
    claimRefs: [CI008, CI009, CI011]
