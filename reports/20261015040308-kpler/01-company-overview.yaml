      - ["Five Arrows Principal Investments", "2022 minority investor", "Official and external profile sources place Five Arrows alongside Insight in the April 2022 financing.", "Confirm remaining ownership, information rights, and expected exit timeline."]
      - ["Enterprise trading / risk users", "Core economic constituency", "Official pages and independent reviews both frame traders, analysts, and risk teams as the users that anchor product value and workflow stickiness.", "Request cohort retention, seat expansion, and revenue concentration by commodity module / user segment."]
    notes: >-
      Partial stakeholder map anchored on named financing counterparties and the core buyer base; debt terms and full
      ownership percentages remain outside the assigned evidence set.
    enumerationScope:
      coverage: partial
      basis: >-
