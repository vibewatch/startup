      - ["Total capital raised", null, "2026-10-15", "gap", "Assigned sources show $200M disclosed 2022 equity plus undisclosed 2023 debt and a 2026 Series D / Sixth Street event, so no precise current total can be stated."]
      - ["Current valuation", null, "2026-10-15", "gap", "No assigned source discloses a post-money valuation or reconciles the reported $1B+ investment with round structure."]
      - ["Customers", "Thousands of organisations worldwide", "2026-10-15", "medium", "Official product pages market broad adoption but do not disclose a precise current customer count here."]
      - ["Headcount", "850+ to 906", "2026-08 to 2026-09", "low", "MineListings and Tracxn conflict, so current headcount should be treated as a range pending management proof."]
      - ["Locations", "17 listed office locations across Europe, North America, the Middle East, and Singapore", "2026-08", "low", "Location count comes from a company-controlled supplier profile rather than an audited facilities list."]
    notes: >-
      Mixes official, company-controlled, and independent sources; null cells mark unsupported current metrics and the
      headcount row preserves a live external conflict rather than normalizing it away.
