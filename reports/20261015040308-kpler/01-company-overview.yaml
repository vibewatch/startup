        identifies explicitly, without claiming a complete cap table.
    claimRefs: [CO005, CO006, CO007, CO011, CO014]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Assigned sources show Kpler moving from LNG cargo tracking into a broader commodity and maritime intelligence
      platform through launches, acquisitions, a 2024 ARR milestone, and a new 2026 financing event.
    data:
      items:
        - date: "2014"
          label: Founded with an LNG cargo-tracking focus
          detail: >-
            MineListings dates Kpler's founding to 2014, and Kpler's ARR release says the original product was a
            cargo-tracking solution tailored to the LNG market.
          tone: positive
          claimRefs: [CO001, CO016]
        - date: "2022-04"
          label: First outside minority equity round
          detail: >-
            Kpler says Five Arrows and Insight Partners acquired a minority stake in April 2022 to help strengthen the
            board.
          tone: opportunity
          claimRefs: [CO005]
        - date: "2022"
          label: COR-e acquisition opens European power
          detail: >-
            The 2024 ARR announcement says the integration of COR-e in 2022 facilitated entry into the European power
            market.
          tone: positive
          claimRefs: [CO016]
        - date: "2023-02"
          label: MarineTraffic and FleetMon acquired
          detail: >-
            Kpler says the February 2023 acquisitions of MarineTraffic and FleetMon expanded ship-tracking and maritime
            analytics coverage.
          tone: opportunity
          claimRefs: [CO016]
        - date: "2023-09"
          label: ChartDesk added to shipping workflow stack
          detail: >-
            Kpler says it acquired ChartDesk (MarineTraffic Inbox) in September 2023 to facilitate shipping
            communication.
          tone: positive
          claimRefs: [CO016]
        - date: "2024-01-09"
          label: $100M ARR milestone announced
          detail: >-
            Kpler announced it had hit $100 million annual recurring revenue and described 2023 as a record year.
          tone: positive
          claimRefs: [CO004]
        - date: "2025"
          label: Product set marketed into natural gas and containers
          detail: >-
            MineListings' chronology lists Natural Gas and Containers launches in 2025, indicating continued category
            expansion after the maritime buildout.
          tone: positive
          claimRefs: [CO016]
        - date: "2026-06"
          label: Sixth Street financing surfaces publicly
          detail: >-
            External 2026 profiles record a Sixth Street-backed Series D / $1B+ investment event, but not a reconciled
            valuation or fully disclosed deal structure.
          tone: warning
          claimRefs: [CO006, CO007, CO008]
        - date: "2026-10-15"
          label: Sydney event spotlights market intelligence and AI
          detail: >-
            The Energy Intelligence Day agenda pairs energy-market outlooks, freight / mining sessions, and an explicit
            AI segment, showing active 2026 customer engagement.
          tone: neutral
          claimRefs: [CO013]
    approximationNotes: null
    claimRefs: [CO001, CO004, CO005, CO006, CO007, CO008, CO013, CO016]
