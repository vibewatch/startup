schemaVersion: report-v2
artifact: company-overview
slug: kpler
runDate: 2026-10-15
company:
  name: Kpler
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Assigned sources support Kpler as a Brussels-rooted, late-stage private trade-intelligence company that has expanded
    from LNG cargo tracking into a broader commodity and maritime data platform. The strongest current signals are the
    January 2024 $100 million ARR milestone, the June 2026 Sixth Street financing event, and continued 2026
    go-to-market activity, while current valuation, exact customer count, and a fully reconciled executive/capital
    picture remain unresolved.
sections:
  - id: identity-and-product-model
    title: Identity, positioning, and cover metrics
    body: >-
      The assigned pool consistently frames Kpler as a physical-trade intelligence business rather than a generic
      software vendor. Official pages describe a platform built around real-time market visibility, cargo and vessel
      tracking, analytics workflows, and integrations, while independent profiles align on a 2014 founding and
      Brussels-centered identity. The product proposition appears workflow-embedded for commodity traders, risk teams,
      and analysts, but the cover-metric surface is uneven: the company publicly promotes scale claims such as
      thousands of organisations served and very large vessel / signal counts, yet it does not provide a precise,
      current customer count or a normalized company-wide operating metric pack in this assigned evidence set. That
      forces later chapters to treat several headline KPIs as marketing-adjacent unless management provides an
      authoritative data room extract. The snapshot table therefore preserves what is supportable today and marks the
      rest as diligence gaps rather than filling them with inherited assumptions.
    claimRefs: [CO001, CO002, CO003, CO004, CO011, CO012, CO015]
    tableRefs: [TO001]
  - id: leadership-governance-and-capital
    title: Leadership, governance, and capital formation
    body: >-
      Kpler still reads as founder-shaped, but the current leadership picture is incomplete in the assigned pool.
      Jean Maynier is consistently surfaced as co-founder and CTO, while François Cazor remains the public voice in
      Kpler's January 2024 ARR announcement but appears as a former co-founder in Tracxn's 2026 profile. That leaves
      open whether the company has already completed a founder-role transition or simply has inconsistent third-party
      metadata. Governance visibility is also thin: Tracxn identifies Anna Favarin and Axelle Steurs as the active
      board members it tracks, including one independent board member, but the full board, committee structure, and
      investor control rights are not disclosed here. Capital formation is easier to bound directionally than exactly:
      Kpler says Five Arrows and Insight Partners bought a minority stake in 2022, while 2026 external sources tie
      Sixth Street to the latest financing event without giving a reconciled valuation or fully disclosed terms.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: scale-signals-milestones-and-caveats
    title: Scale signals, milestones, and evidence limits
    body: >-
      Scale signals are strong but not clean enough to overstate. Official and company-controlled materials present
      Kpler as a very large data operation spanning commodities, maritime intelligence, and workflow tooling, and the
      milestone chronology shows deliberate expansion through product launches, acquisitions, and client-facing
      programming. The January 2024 ARR announcement provides the clearest hard financial datapoint in the pool, while
      the October 2026 Sydney event shows the company still marketing expert insights and AI-enabled workflows to
      senior market participants. Independent product reviews reinforce that Kpler matters operationally for traders,
      but they also warn that cargo inference is probabilistic, premium capabilities can be expensive, and opaque
      regions still require corroboration. Just as important, the assigned pool does not surface a verified litigation,
      sanction, outage, or regulatory timeline item; that absence should be treated as an evidence gap, not as proof
      of no adverse history.
    claimRefs: [CO004, CO008, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
