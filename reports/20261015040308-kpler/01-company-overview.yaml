      - ["Founders & team", "Primary insider owners/operators", "MineListings says Kpler remains primarily owned by founders and team members, implying insider alignment still matters.", "Obtain the current cap table, voting rights, and any founder transfer or lock-up restrictions."]
      - ["Sixth Street", "Latest disclosed 2026 financing counterparty", "Independent 2026 sources tie Sixth Street to the most recent round, but amount, instrument, and governance rights remain unclear.", "Request the term sheet, liquidation preferences, governance rights, and use-of-proceeds detail."]
