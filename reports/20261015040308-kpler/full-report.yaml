  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow fit and product surface
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Kpler sells an operating cockpit for commodity traders, analysts, chartering
              desks, and compliance teams rather than a single data feed. Public product pages show a layered surface:
              the flagship commodities terminal markets breadth across 40+ commodities and millions of trades; Cargo
              Analytics adds vessel, cargo, port-call, fixture, and floating-storage workflows; Trading Commodities adds
              alerts, freight and inventory monitoring, sanctions screening, and due-diligence checks; the mobile app
              extends maps, news, and analytics into an on-the-go client. The result is a workflow that starts with
              locating physical cargoes and then moves into monitoring events, filtering by route or player, and
              triggering actions when freight, sanctions, or supply conditions change.
