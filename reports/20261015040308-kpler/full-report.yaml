      - number: '5.3'
        title: Maturity, dependencies, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Product maturity looks strongest where Kpler can exploit standardized seaborne datasets: independent
              reviews repeatedly position it as market-leading for vessel coverage, flexible workflow tooling, and
              integration depth in crude, LNG, LPG, and related maritime use cases. The same reviews are clear that this
              is still a probabilistic intelligence system, not definitive proof of physical reality: cargo estimates
              weaken in opaque regions, ship-to-ship transfers, dark-fleet contexts, or other low-visibility
              environments, and traders still need desk-level confirmation for settlement or minute-sensitive actions.
              Public evidence is also notably thinner on the trust layer than on the product layer: the assigned pool
              does not provide public uptime commitments, incident history, audited security certifications, or
              quantified API service-level terms, so diligence should treat operational resilience and controls as a
              live underwriting item rather than an already-proven strength.
