        title: Capital adequacy and remaining diligence blockers
        blocks:
          - type: paragraph
            body: >
              The strongest public capital signal is the June 2026 Sixth Street transaction. Business Wire, syndicated
              via Yahoo Finance, says Kpler secured over $1 billion of minority strategic growth equity, and the same
              release says management remains majority owners; Kpler's About page separately says the company remains
              primarily owned by its founders and team members. That combination suggests the round was positioned as
              growth capital for expansion and product development rather than a change-of-control rescue. However, the
              assigned pool still does not disclose current cash on hand, debt terms, burn, runway, or a use-of-funds
              bridge, and the independent review flags probabilistic cargo inference and scaling enterprise costs as
              real limitations. Financially, the new capital reduces immediate funding stress but does not remove the
