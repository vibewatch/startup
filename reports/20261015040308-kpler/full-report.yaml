  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternatives
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a broad competitive map rather than a single one-to-one rival set. Independent
              reviews position Kpler against Vortexa, Windward, ClipperData, and FreightWaves, while Tracxn frames the
              broader category as crowded, with hundreds of active competitors and a mix of direct cargo-intelligence
              products and adjacent maritime-intelligence vendors. That matters because the buyer's core job is not "buy
              Kpler" but "see physical commodity flows early enough to trade, hedge, schedule, and screen
              counterparties." In practice, desks can approximate parts of the workflow with brokers, customs records,
              manifests, and internal models, but those substitutes are slower and less standardized than an integrated
              platform.
