  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment coverage is broad, but the center of gravity is commodity trading and adjacent workflows
        blocks:
          - type: paragraph
            body: >-
              Across the assigned pool, Kpler is consistently positioned as a subscription analytics product for
              professional users who act on physical-trade information rather than for casual market observers. The most
              repeated buyer and user groups are commodity traders, analysts, risk managers, shipping professionals, and
              adjacent industrial users who need vessel, cargo, and inventory visibility in time to change hedging,
              sourcing, logistics, or compliance decisions. Official product pages broaden that surface beyond core
              trading desks to refiners, utilities, financial institutions, governments, and risk teams, which implies
              Kpler sells into several budget owners but around a common workflow: using near-real-time physical-flow
              data to improve commercial or operational decisions. The breadth matters because it supports cross-sell
              across commodities and delivery modes, but the public evidence still does not break out how much revenue
              comes from each segment or from the MarineTraffic side of the business.
