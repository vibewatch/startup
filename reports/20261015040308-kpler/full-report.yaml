  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how Kpler converts proprietary trade data and analyst workflows into modular subscription
      revenue, but not the realized unit economics of that model.
    data:
      nodes:
        - id: data-inputs
          label: Proprietary data inputs
          detail: >-
            1.3bn+ AIS signals per day, 255k+ proprietary sources, 245k+ human contributors, and 15+ years of
            time-series data.
        - id: analytics-products
          label: Multi-commodity analytics products
          detail: >-
            Cargo, freight, compliance, inventories, refineries, research, supply-demand, chartering, arbitrage, and
            financial-flows workflows across 40+ commodities.
        - id: workflow-delivery
          label: Workflow delivery
          detail: >-
            Web terminal, live map, alerts, API, Excel Add-In, Snowflake Data Share, and LiveDB access embed Kpler
            inside trading workflows.
        - id: commercial-packaging
          label: Commercial packaging
          detail: >-
            Independent review describes modular subscriptions priced by commodity coverage, user counts, API volume,
            and add-on services.
        - id: customer-outcome
          label: Customer adoption and expansion
          detail: >-
            Kpler claims thousands of organizational users and sells research, forecasts, and analyst access alongside
            data workflows.
        - id: financial-outcome
          label: Financial outcome
          detail: >-
            About page claims profitability from the start; June 2026 growth equity adds expansion capital, but public
            ARR and margin remain undisclosed.
      edges:
        - from: data-inputs
          to: analytics-products
          label: Data fusion and model building
        - from: analytics-products
          to: workflow-delivery
          label: Productized into user and API workflows
        - from: workflow-delivery
          to: commercial-packaging
          label: Monetized via modular subscription packaging
        - from: commercial-packaging
          to: customer-outcome
          label: Seat, module, and research upsell potential
        - from: customer-outcome
          to: financial-outcome
          label: Supports revenue growth, but public unit economics stay opaque
    approximationNotes: The flow describes the evidenced commercial path, not a quantified conversion funnel.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI008
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a four-layer stack from signal ingestion through trader-facing workflows and machine
      interfaces.
    data:
      layers:
        - label: Signal ingestion
          detail: >-
            AIS/satellite telemetry, port and terminal events, customs/shipping records, pipeline/storage data,
            government statistics
          modules:
            - label: Maritime telemetry
              detail: Terrestrial and satellite AIS, voyage history, draught, ETA, vessel positions
            - label: Trade records
              detail: Port calls, customs filings, manifests, bills of lading, fixtures, shipping data
        - label: Fusion and inference
          detail: Machine-learning models and analyst validation translate raw signals into operational commodity intelligence
          modules:
            - label: Cargo inference
              detail: Estimated loaded/unloaded volumes, floating storage, origin/destination, destination forecasts
            - label: Behavioral detection
              detail: Ship-to-ship transfers, AIS spoofing, route deviations, sanctions-related monitoring
        - label: Intelligence applications
          detail: Commodity modules and Derived Insights package data into trader, analyst, and compliance workflows
          modules:
            - label: Commodity workspaces
              detail: Cargo analytics, price overlays, freight views, alerts, watchlists
            - label: Research and risk outputs
              detail: Forecasts, market calls, due-diligence checks, compliance intelligence
        - label: Human delivery surfaces
          detail: Interactive interfaces for traders, analysts, and mobile users
          outputs:
            - label: Interactive interfaces
              detail: Terminal UI, maps, bookmarks, alerts, reports/webinars, iPhone app
        - label: Operational control layer
          detail: >-
            Workflow controls are embedded inside the product surface rather than exposed as a separate external
            assurance layer
          outputs:
            - label: Embedded controls
              detail: Sanctions screening, ownership checks, route-deviation alerts, and due-diligence workflows
        - label: Machine delivery surfaces
          detail: Outputs are also structured for downstream workflow and data-pipeline integration
          outputs:
            - label: Machine interfaces
              detail: Excel Add-In, REST and streaming APIs, Snowflake Data Share, Kpler LiveDB
    approximationNotes: >-
      This figure is a synthesis of product and review text from the assigned pool rather than an officially published
      architecture diagram.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public evidence implies a journey from focused desk need to broader multi-workflow adoption, with expansion
      constrained by pricing, data-validation, and integration effort.
    data:
      items:
        - label: Workflow trigger
          actor: Trading, risk, logistics, or operations teams
          touchpoints:
            - Need faster visibility into cargo, vessel, inventory, or sanctions events
            - Commodity-specific workflow urgency is highest where missed signals can move P&L or delivery timing
        - label: Focused evaluation
          actor: Desk leads and analysts
          touchpoints:
            - Demo or targeted module evaluation around a corridor, commodity, or workflow
            - Buyers compare breadth and timeliness against niche alternatives or existing spreadsheets
        - label: Initial deployment
          actor: Analysts, traders, and operations users
          touchpoints:
            - UI, watchlists, alerts, and saved searches provide first operational value
            - Fast onboarding is easiest for teams already used to maritime dashboards
        - label: Workflow integration
          actor: Quant, risk, and data teams
          touchpoints:
            - API, Excel, and data-share delivery extend Kpler into CTRM, models, and reporting workflows
            - Enterprise customers negotiate SLA and update-frequency expectations
        - label: Expansion loop
          actor: Multi-desk or multi-commodity organizations
          touchpoints:
            - Tiered subscriptions allow focused modules first, then broader commodity, archive, or API bundles
            - Cross-sell logic improves as more desks rely on shared physical-flow data
        - label: Renewal and concentration unknowns
          actor: Finance and procurement stakeholders
          touchpoints:
            - Premium pricing, probabilistic cargo estimates, and validation effort can narrow rollout
            - Public evidence does not disclose churn, NRR, contract length, or top-customer concentration
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU016
  - id: FR001
    title: Residual-risk heatmap by evidence strength
    type: matrix
    summary: >-
      Qualitative matrix separates documented failure modes from exposures that remain unquantified in the assigned
      public evidence.
    data:
      columns:
        - label: Likelihood evidence
          detail: Whether the allocated sources quantify or merely identify the failure mode.
        - label: Conditional impact
          detail: Impact depends on the customer workflow stated in each row.
        - label: Mitigation maturity
          detail: Publicly described controls, not independently audited effectiveness.
        - label: Residual assessment
          detail: Current underwriting view after the disclosed mitigation.
      rows:
        - label: Cargo inference error
          note: Sparse AIS, spoofing, dark fleets, and transfers can impair estimates.
          values:
            - Documented; frequency unknown
            - High for settlement or compliance proof
            - Multi-source fusion described
            - High pending route tests
        - label: Sanctions false negative
          note: Company controls are described without an effectiveness audit.
          values:
            - Unquantified
            - High for compliance decisions
            - Screening and daily updates claimed
            - High pending known-case benchmark
        - label: Service or API disruption
          note: No allocated SLA, outage history, or recovery evidence.
          values:
            - Unknown
            - High for embedded workflows
            - Multiple channels described
            - Unknown to high
        - label: Privacy or control deficiency
          note: Mobile telemetry disclosure is narrower than a full enterprise control review.
          values:
            - Unknown
            - Medium pending data map
            - Initial disclosure only
            - Medium
        - label: Critical input loss
          note: Provider concentration and substitution rights are not disclosed.
          values:
            - Unknown
            - High if non-substitutable
            - Multi-source approach described
            - Unknown
        - label: Integration and cost friction
          note: Reviews report weeks for custom integrations and scaling license costs.
          values:
            - Reported by reviewers
            - Medium for expansion
            - Trial and modular rollout available
            - Medium
    approximationNotes: >-
      Qualitative labels only; the assigned sources do not provide probabilities, incident rates, loss magnitudes, or
      audited control-effectiveness scores.
    claimRefs:
      - CR004
      - CR006
      - CR009
      - CR011
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic product proof and fresh capital support continued diligence, but financing opacity keeps the price call
      unresolved.
    data:
      nodes:
        - id: breadth
          label: Broad commodity workflow
          note: 40+ commodities; 36k+ vessels; forecasts and refinery coverage.
        - id: integration
          label: Enterprise distribution
          note: Kpler APIs plus ICE Connect / ICE Data API delivery.
        - id: validation
          label: Independent proof with caveats
          note: Reviews call Kpler strong, but estimates remain probabilistic.
        - id: capital
          label: Fresh financing signal
          note: $1.0bn June 2026 Sixth Street transaction.
        - id: opacity
          label: Economic opacity
          note: No disclosed group ARR, retention, gross margin, post-money, or preference stack.
        - id: call
          label: Track; valuation unknown
          note: Advance only after KPI pack and financing documents are shared.
      edges:
        - from: breadth
          to: integration
          label: supports
        - from: integration
          to: validation
          label: reinforced by
        - from: validation
          to: capital
          label: makes financing signal plausible
        - from: capital
          to: opacity
          label: does not resolve
        - from: opacity
          to: call
          label: drives
    approximationNotes: >-
      Flow states the logical chain only; it does not imply a numeric valuation range or probability weight beyond the
      cited claims.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV014
      - CV015
