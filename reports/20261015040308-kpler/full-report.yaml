        title: Delivery economics and revenue-quality proxies
        blocks:
          - type: paragraph
            body: >
              The best public operating proxies point to an enterprise data product with meaningful expansion paths but
              limited disclosed efficiency metrics. Kpler's integration surface supports embedded workflows, and the
              independent review says standard Excel or watchlist deployments can be live within days while bespoke API
              or enterprise data-lake onboarding can take weeks and require sales and engineering coordination. Official
              pages also market proprietary data scale, expert analyst coverage, and thousands of organizational users,
              while the About page says Kpler has remained profitable from the start. Even so, none of the reviewed
              sources disclose consolidated ARR, gross margin, CAC, payback, NRR, churn, or cash conversion, and the
              only public revenue datapoint in the assigned pool is a UK legal-entity range that is not a group P&L.
