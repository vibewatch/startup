      - number: '6.3'
        title: Expansion logic is visible, but retention and concentration remain largely unverified
        blocks:
          - type: paragraph
            body: >-
              The best evidence for expansion is commercial structure rather than disclosed cohort data. Independent
              reviews describe modular licensing, tiered access to APIs and historical archives, and the ability for
              desks to start with focused subscriptions before widening module or integration scope, which is consistent
              with a land-and-expand motion inside trading organizations. At the same time, the same reviews surface
              friction that can slow or narrow adoption: premium pricing for deep data, the need to calibrate estimated
              cargo signals against other confirmations, and implementation effort for API-heavy deployments. The
              weakest part of the public record is durability. The assigned sources do not disclose NRR, GRR, churn,
              average contract length, or top-customer concentration, so there is no direct public way to distinguish
              broad logo presence from durable net expansion or to assess whether a few large trading customers dominate
              economics.
