        title: Pricing and go-to-market favor enterprise buyers
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to an enterprise, sales-led commercial model rather than transparent
              self-serve pricing. Independent review coverage describes Kpler as modular by commodity and feature set,
              with API volume, historical exports, and satellite AIS typically priced separately; one review estimates
              annual spend can range from tens of thousands of dollars for a limited deployment to low hundreds of
              thousands for broader enterprise use. That pushes Kpler toward professional trading, risk, and operations
              teams that can monetize better flow visibility. Sixth Street's June 2026 investment also signals that
              Kpler is still expanding into adjacent product surfaces, which can strengthen bundling but also indicates
              the company is competing for a larger wallet share than a narrow LNG-only tool.
