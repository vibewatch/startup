      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow fit looks strongest where physical-trade data changes high-value decisions quickly
            body: >-
              The strongest repeated persona across official and independent sources is the commodity trading or
              maritime-risk desk that needs near-real-time signal for hedging, routing, or compliance, rather than a
              generalized information buyer.
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU011
          - type: callout
            title: Public customer-quality evidence is still weaker than public customer-breadth evidence
            body: >-
              Kpler has enough assigned evidence to show named use cases and multi-channel workflow fit, but not enough
              to publicly underwrite retention, renewal economics, or concentration risk with the precision a $4B-scale
              data platform would usually warrant.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is decision error when estimated cargo, destination, or sanctions signals
              are treated as definitive evidence. Two independent reviews describe cargo inference as probabilistic and
              identify sparse AIS, spoofing, dark fleets, re-flagging, and ship-to-ship transfers as failure modes;
              Kpler itself markets tools intended to detect several of those same behaviors. The second tier is service
              and integration continuity because customers can consume the product through a terminal, APIs, Excel,
              Snowflake Data Share, and LiveDB. Investment underwriting should therefore require route-level accuracy
              testing, documented incident and SLA performance, and evidence that no single data provider or delivery
              channel can disable critical workflows.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, privacy, and compliance exposure
        blocks:
          - type: paragraph
            body: >-
              Kpler says its platform provides daily sanctions updates, vessel and cargo screening, ownership-layer
              review, insurance and certification checks, and alerts for AIS gaps and spoofing. Those are mitigations,
              not independent proof of screening efficacy or regulatory compliance. The iOS listing also discloses that
              identifiers, usage data, and diagnostics may be collected without being linked to identity, but the
              allocated evidence does not include a complete privacy notice, DPA, audit report, security certification,
              litigation docket, or enforcement record. A false negative in sanctions screening could be severe for
              customers using the output in compliance decisions, while the likelihood and control effectiveness remain
              unquantified.
            claimRefs:
              - CR006
              - CR007
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR012
              - CR016
      - number: '7.3'
        title: Operational, model-quality, and reliability exposure
        blocks:
          - type: paragraph
            body: >-
              Kpler combines satellite AIS, imagery, port and terminal intelligence, customs and shipping records,
              pipeline and storage information, government statistics, company disclosures, machine learning, and expert
              validation. This breadth reduces dependence on any single signal but creates a larger ingestion,
              licensing, reconciliation, and quality-control surface. Kpler says it backtests trade-flow data against
              organizations such as JODI and EIA; reviewers nevertheless caution that coverage weakens in thin-data
              regions and that inferred cargo cannot replace contract documents. Public scope labels also differ between
              36,000-plus commodity vessels and 300,000-plus vessels tracked daily, so diligence must reconcile
              populations and test error rates by commodity, corridor, and use case.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR014
      - number: '7.4'
        title: Partner, platform, commercial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              The product depends on external data ecosystems as well as Kpler's own models and delivery stack. Official
              pages identify price inputs from Spark and Baltic Exchange and describe integrations through APIs, Excel,
              Snowflake Data Share, and LiveDB, but do not disclose supplier concentration, substitution rights, uptime
              commitments, or recovery objectives. Independent reviews report that custom API and enterprise deployments
              can require weeks, that license cost rises with modules, users, and API usage, and that customer
              calibration is necessary. The thesis should break if validation shows persistent high-value route errors,
              material sanctions false negatives, repeated SLA failures, loss of a critical feed without substitution,
              or integration economics that prevent expansion.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria
            body: >-
              Re-underwrite or reject the thesis if route-level tests show persistent material inference error,
              known-case sanctions screening produces material false negatives, critical feeds lack substitution,
              repeated SLA failures disrupt embedded workflows, or integration and license economics prevent customer
              expansion.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and public price support
        blocks:
          - type: paragraph
            body: >-
              The evidence set is strong enough to say Kpler matters strategically, but not strong enough to underwrite
              price. Official product pages and ICE's partner catalog show wide multi-commodity coverage, API delivery,
              and workflow integration that fit real trading, risk, and supply-chain use cases. Independent 2026 reviews
              also still describe Kpler as market leading, which supports the idea that the asset has real customer
              value. The valuation problem is disclosure, not strategic relevance: public sources in this pool confirm a
              $1.0bn June 2026 Sixth Street transaction, but they do not disclose consolidated ARR, gross margin,
              retention, post-money valuation, or preference terms. That keeps this chapter at track rather than buy,
              with risk remaining high until management provides direct underwriting evidence.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on breadth plus entrenchment: Kpler says Cargo Analytics spans 40+ commodities and
              36k+ vessels, its Trading & Commodities product adds forecast and refinery workflows, and ICE carries the
              data through its own API stack. That combination suggests customers can embed Kpler deeply enough for
              durable spend. The anti-thesis is that independent reviewers still describe the output as probabilistic in
              thin data regions and still warn that premium pricing, satellite AIS, and deep archives can raise
              procurement friction. In other words, the company can be strategically important while still failing to
              justify an aggressive private-market entry price if the eventual retention, margin, or contract data prove
              weaker than the product story implies.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not another branding or product demo; it is a pricing file. To move from track
              to buy, management needs to show the actual economics behind the June 2026 financing: consolidated ARR or
              revenue run rate, gross margin, retention, logo churn, customer concentration, post-money valuation, and
              any investor protections that alter the effective entry price. A thesis break would appear if those
              materials show that recent growth is acquisition-dependent, that premium modules do not convert into
              durable subscription expansion, or that the financing stack gives new capital materially better downside
              protection than minority holders would receive. Until then, the right posture is to monitor, not to force
              false precision.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
