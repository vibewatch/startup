      - number: '3.4'
        title: Moat durability depends on data breadth, not unquestioned accuracy
        blocks:
          - type: paragraph
            body: >-
              The main adverse evidence in the pool is about where Kpler is strong but not final. Independent reviews
              say its cargo estimates are most reliable in standardized LNG and VLCC crude use cases, but need more
              scrutiny in opaque regions, breakbulk or parcel cargoes, ship-to-ship transfers, and dark-fleet behavior.
              Those same reviews position peers around adjacent strengths such as flow modeling or maritime risk, which
              means Kpler's moat is best understood as a broad workflow and telemetry platform rather than a vendor that
              eliminates the need for other data or human confirmation. That keeps the platform strategically important,
              but it also caps how far official or investor claims of category leadership can be taken without external
              benchmark proof.
