  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >
              Kpler's public product surfaces describe a broad commercial package rather than a single-screen vessel
              tracker. The company markets cargo tracking, freight, compliance, inventories, refineries, research,
              supply-demand, chartering, arbitrage, and financial-flows workflows across 40+ commodities, with delivery
