      - number: '1.3'
        title: Scale signals, milestones, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Scale signals are strong but not clean enough to overstate. Official and company-controlled materials
              present Kpler as a very large data operation spanning commodities, maritime intelligence, and workflow
              tooling, and the milestone chronology shows deliberate expansion through product launches, acquisitions,
              and client-facing programming. The January 2024 ARR announcement provides the clearest hard financial
              datapoint in the pool, while the October 2026 Sydney event shows the company still marketing expert
              insights and AI-enabled workflows to senior market participants. Independent product reviews reinforce
              that Kpler matters operationally for traders, but they also warn that cargo inference is probabilistic,
              premium capabilities can be expensive, and opaque regions still require corroboration. Just as important,
              the assigned pool does not surface a verified litigation, sanction, outage, or regulatory timeline item;
              that absence should be treated as an evidence gap, not as proof of no adverse history.
