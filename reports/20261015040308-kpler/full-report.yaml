    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and cover metrics
        blocks:
          - type: paragraph
            body: >-
              The assigned pool consistently frames Kpler as a physical-trade intelligence business rather than a
              generic software vendor. Official pages describe a platform built around real-time market visibility,
              cargo and vessel tracking, analytics workflows, and integrations, while independent profiles align on a
              2014 founding and Brussels-centered identity. The product proposition appears workflow-embedded for
              commodity traders, risk teams, and analysts, but the cover-metric surface is uneven: the company publicly
              promotes scale claims such as thousands of organisations served and very large vessel / signal counts, yet
              it does not provide a precise, current customer count or a normalized company-wide operating metric pack
              in this assigned evidence set. That forces later chapters to treat several headline KPIs as
              marketing-adjacent unless management provides an authoritative data room extract. The snapshot table
              therefore preserves what is supportable today and marks the rest as diligence gaps rather than filling
              them with inherited assumptions.
