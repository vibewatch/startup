      - number: '1.2'
        title: Leadership, governance, and capital formation
        blocks:
          - type: paragraph
            body: >-
              Kpler still reads as founder-shaped, but the current leadership picture is incomplete in the assigned
              pool. Jean Maynier is consistently surfaced as co-founder and CTO, while François Cazor remains the public
              voice in Kpler's January 2024 ARR announcement but appears as a former co-founder in Tracxn's 2026
              profile. That leaves open whether the company has already completed a founder-role transition or simply
              has inconsistent third-party metadata. Governance visibility is also thin: Tracxn identifies Anna Favarin
              and Axelle Steurs as the active board members it tracks, including one independent board member, but the
              full board, committee structure, and investor control rights are not disclosed here. Capital formation is
              easier to bound directionally than exactly: Kpler says Five Arrows and Insight Partners bought a minority
              stake in 2022, while 2026 external sources tie Sixth Street to the latest financing event without giving a
              reconciled valuation or fully disclosed terms.
