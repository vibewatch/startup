        title: Data architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The technical architecture described in the assigned pool is a data-fusion stack. Kpler's own product copy
              and independent profiles both describe ingestion of satellite and terrestrial AIS, port and terminal
              intelligence, customs and shipping records, pipeline or storage information, and other market data, with
              machine-learning models and analyst review translating those inputs into inferred cargoes, route changes,
              destination forecasts, and supply-demand views. Delivery is intentionally dual-track: traders can work
              through map-first terminals, watchlists, alerts, and research, while quant or risk teams can integrate via
              REST APIs, streaming feeds, Excel, and shared analytics tables. That architecture supports Kpler's
              positioning as a system-of-work for physical-flow intelligence instead of a dashboard-only point solution.
