      - number: '3.2'
        title: Workflow stickiness comes from breadth plus delivery
        blocks:
          - type: paragraph
            body: >-
              Kpler's strongest defensible angle in the assigned evidence is not a single isolated feature; it is the
              combination of cross-commodity coverage, cargo and fleet analytics, ship-to-ship monitoring, sanctions
              screening, and delivery into analyst workflows through APIs, Excel, Snowflake-style data access,
              watchlists, and alerts. That makes Kpler harder to displace once a desk has wired the platform into
              day-to-day monitoring and quantitative models. At the same time, the independent reviews do not describe
              the platform as an exclusive source of truth. They instead describe it as a strong backbone for
              physical-flow intelligence that still benefits from trader judgment and corroboration on high-value
              decisions.
