        - label: 聚焦评估
          actor: 交易台负责人和分析师
          touchpoints:
            - 围绕某条航线、某种商品或某个工作流进行演示或定向模块评估
            - 买方会把覆盖广度和时效性与细分替代方案或现有电子表格比较
        - label: 初始部署
          actor: 分析师、交易员和运营用户
          touchpoints:
            - UI、观察列表、提醒和保存的搜索带来第一波运营价值
            - 已经习惯海事仪表盘的团队最容易快速上手
        - label: 工作流集成
          actor: 量化、风险和数据团队
          touchpoints:
            - API、Excel 和数据共享交付让 Kpler 进入 CTRM、模型和报告工作流
            - 企业客户会协商 SLA 和更新频率要求
        - label: 扩张循环
          actor: 多交易台或多商品机构
          touchpoints:
            - 分层订阅允许客户先买聚焦模块，再扩展到更广的商品、存档或 API 套餐
            - 越来越多交易台依赖共享的实物流数据后，交叉销售逻辑会更顺
        - label: 续约与集中度未知
          actor: 财务和采购相关方
          touchpoints:
            - 高价、概率性货物估算和验证投入可能限制推广范围
            - 公开证据未披露流失率、NRR、合同期限或头部客户集中度
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU016
  - id: FR001
    title: 按证据强度划分的剩余风险热力图
    type: matrix
    summary: 定性矩阵把有记录的失效模式，与指定公开证据中仍未量化的风险敞口区分开来。
    data:
      columns:
        - label: 可能性证据
          detail: 指定来源是量化了失效模式，还是仅仅指出其存在。
        - label: 条件性影响
          detail: 影响取决于每一行所述的客户工作流。
        - label: 缓释成熟度
          detail: 公开描述的控制措施，未经独立审计验证其有效性。
        - label: 剩余风险判断
          detail: 根据已披露缓释措施形成的当前投资判断。
      rows:
        - label: 货物推断错误
          note: AIS 稀疏、信号欺骗、暗船队和转运都可能影响估算。
          values:
            - 已有记录；频率未知
            - 对结算或合规证明影响高
            - 已描述多源融合
            - 在完成航线测试前为高
        - label: 制裁误报阴性
          note: 已描述公司控制措施，但没有有效性审计。
          values:
            - 未量化
            - 对合规决策影响高
            - 自称有筛查和每日更新
            - 在完成已知案例基准测试前为高
        - label: 服务或 API 中断
          note: 没有指定 SLA、宕机历史或恢复证据。
          values:
            - Unknown
            - 对嵌入式工作流影响高
            - 已描述多种渠道
            - 未知至高
        - label: 隐私或控制缺陷
          note: 移动遥测披露的范围窄于完整的企业控制审查。
          values:
            - Unknown
            - 在完成数据映射前为中
            - 仅有初步披露
            - 中
        - label: 关键输入丢失
          note: 未披露供应商集中度和替代权利。
          values:
            - Unknown
            - 若不可替代则为高
            - 已描述多源方案
            - Unknown
        - label: 集成与成本摩擦
          note: 评测称定制集成需要数周，许可证成本会随规模上升。
          values:
            - 评测者报告
            - 对扩张影响中
            - 可试用并分模块推广
            - 中
    approximationNotes: 仅为定性标签；指定来源没有提供概率、事故率、损失规模或经审计的控制有效性评分。
    claimRefs:
      - CR004
      - CR006
      - CR009
      - CR011
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 产品的战略性验证和新资金支持继续尽调，但融资信息不透明，估值判断仍未解决。
    data:
      nodes:
        - id: breadth
          label: 广泛的商品工作流
          note: 40+ 种商品；36k+ 艘船；覆盖预测和炼厂。
        - id: integration
          label: 企业分发
          note: Kpler API 加上 ICE Connect / ICE Data API 交付。
        - id: validation
          label: 有保留的独立验证
          note: 评测称 Kpler 表现强劲，但估算仍具有概率性。
        - id: capital
          label: 新融资信号
          note: 2026 年 6 月 Sixth Street 的 $1.0bn 交易。
        - id: opacity
          label: 经济信息不透明
          note: 未披露集团 ARR、留存率、毛利率、投后估值或优先股堆叠。
        - id: call
          label: 持续跟踪；估值未知
          note: 只有在对方分享 KPI 数据包和融资文件后才推进。
      edges:
        - from: breadth
          to: integration
          label: 支持
        - from: integration
          to: validation
          label: 得到强化
        - from: validation
          to: capital
          label: 使融资信号更可信
        - from: capital
          to: opacity
          label: 无法解决
        - from: opacity
          to: call
          label: 驱动
    approximationNotes: 流程图仅表达逻辑链条；除引用的主张外，不代表任何数值估值区间或概率权重。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV014
      - CV015
