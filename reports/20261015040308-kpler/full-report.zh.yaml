              页面另称公司主要仍由创始人和团队成员持有。这一组合说明该轮融资定位为扩张和产品开发的成长资本，而不是控制权变更式纾困。但本批证据仍未披露当前现金、债务条款、烧钱速度、现金跑道或资金用途桥接；独立评测也将概率性货物推断和企业扩张成本列为真实限制。财务上，新资本缓解了短期融资压力，却不能替代在评估估值或下行风险前进行私下尽调。
