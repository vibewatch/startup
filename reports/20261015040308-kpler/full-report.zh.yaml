        title: 规模信号、里程碑与证据边界
        blocks:
          - type: paragraph
            body: >-
              规模信号很强，但还不够干净，不能过度解读。官网和公司控制的材料将 Kpler 描绘为覆盖大宗商品、海事情报和工作流工具的大型数据业务；里程碑时间线也显示，公司通过产品发布、收购和面向客户的活动持续扩张。2024
              年 1 月 ARR 公告是本批证据中最清晰的硬财务数据点；2026 年 10 月悉尼活动则表明，公司仍在向资深市场参与者营销专家洞察和 AI 工作流。独立产品评测进一步证明 Kpler
              对交易员具有运营价值，但也提醒：货物推断带有概率性，高级功能可能价格昂贵，信息不透明地区仍需交叉验证。同样重要的是，本批证据没有出现经核实的诉讼、制裁、宕机或监管时间线事项；这应被视为证据缺口，而不是没有不利历史的证明。
