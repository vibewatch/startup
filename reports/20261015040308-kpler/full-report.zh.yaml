chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与核心指标
        blocks:
          - type: paragraph
            body: >-
              本批证据始终将 Kpler 定位为实物贸易情报业务，而非通用软件供应商。官网将其描述为围绕实时市场可见性、货物与船舶追踪、分析工作流和集成构建的平台；独立资料也一致认可其 2014
              年成立、以布鲁塞尔为中心。产品似乎已嵌入大宗商品交易员、风险团队和分析师的工作流，但核心指标披露不完整：公司自述的规模口径包括服务数千家机构及庞大的船舶和信号数量，却没有在本批证据中给出精确的当前客户数或统一的全公司运营指标包。因此，除非管理层提供权威数据室摘录，后续章节只能把若干核心
              KPI 视为接近营销口径。快照表保留当前可支持的内容，其余标为尽调缺口，不用沿袭的假设填补。
