              AIS、港口和码头情报、海关与航运记录、管道或储罐信息及其他市场数据，再由机器学习模型和分析师审核，将输入转化为推断货物、航线变化、目的地预测和供需视图。交付有意采用双轨：交易员通过地图优先的终端、关注列表、提醒和研究工作；量化或风险团队则通过
