        title: 成熟度、依赖与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Kpler 的产品成熟度在能够利用标准化海运数据集的地方最强：独立评测反复将其在原油、LNG、LPG
              及相关海事场景的船舶覆盖、灵活工作流工具和集成深度评为市场领先。同样的评测也明确指出，这仍是概率性情报系统，而不是物理现实的决定性证明：在信息不透明地区、船对船转运、暗船队场景或其他低可见性环境中，货物估算会变弱；交易员在结算或分秒必争的行动前仍需交易台确认。信任层面的公开证据也明显少于产品层面：本批证据没有提供公开可用性承诺、事故历史、经审计的安全认证或量化
              API 服务级别条款，因此尽调应把运营韧性和控制视为待承保项目，而不是已证明的优势。
