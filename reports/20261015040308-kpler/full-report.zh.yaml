            body: >-
              最大剩余风险是决策错误：把估算货物、目的地或制裁信号当成决定性证据。两篇独立评测都称货物推断具有概率性，并将 AIS 稀疏、欺骗、暗船队、重新挂旗和船对船转运列为失效模式；Kpler
              自己也在营销用于识别其中若干行为的工具。第二层风险是服务与集成连续性，因为客户可通过终端、API、Excel、Snowflake Data Share 和 LiveDB
              使用产品。因此，投资承保应要求进行航线级准确性测试、提供有记录的事故和 SLA 表现，并证明没有任何单一数据供应商或交付渠道能够令关键工作流失效。
