  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              留存证据支持的是广泛竞争地图，而不是单一的一对一竞品集合。独立评测将 Kpler 与 Vortexa、Windward、ClipperData 和 FreightWaves 对比；Tracxn
              则认为更大的品类竞争拥挤，有数百家活跃竞争者，既有直接货物情报产品，也有相邻的海事情报供应商。这一点很重要，因为买家的核心任务不是“购买
              Kpler”，而是“尽早看见实物商品流，以便交易、对冲、调度和筛查交易对手”。实际上，交易台可以用经纪商、海关记录、舱单和内部模型拼出部分工作流，但这些替代方案比集成平台更慢，也更缺乏标准化。
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP013
