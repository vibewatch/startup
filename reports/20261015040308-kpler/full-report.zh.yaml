      - 缓释措施
      - 剩余风险
    rows:
      - - 海事与贸易数据输入
        - 卫星与地面 AIS、影像、港口、码头、海关、航运记录、管道、储存设施、政府统计和商业报告
        - 提供船舶位置、货运事件、库存和模型特征。
        - 未披露供应商、合同集中度和替代权利。
        - 关键输入丢失、延迟、许可受限或遭操纵，会削弱覆盖范围或推断质量。
        - 重点航线依赖不可替代的数据流时较高。
        - Kpler 描述多源融合、机器学习、专家验证和回测。
        - 在审查来源级血缘、集中度和备用方案测试前为未知。
      - - 产品交付栈
        - Commodities Terminal、API、Excel Add-In、Snowflake Data Share 和 LiveDB
        - 将数据交付至用户及机器工作流。
        - 未披露托管、云和软件供应商集中度。
        - 身份验证、API、数据共享或集成故障会中断客户工作流。
        - 对嵌入式运营或交易使用为高。
        - 多种交付方式带来潜在冗余。
        - 正常运行、恢复和跨渠道独立性均无证据，因此为未知。
      - - 外部定价与基准输入
        - Spark 与 Baltic Exchange
        - 为合同分析叠加价格和大宗商品基本面。
        - 未披露数据权利条款和替代方案。
        - 数据流丢失、延迟或许可变更会降低整合分析能力。
        - 对使用这些叠加数据的工作流为中等。
        - 更广泛的平台结合价格与实体流量数据。
        - 待完成合同、替代性和血缘审查，暂为中等。
    notes: 依赖项名称和角色来自公司发布的页面；集中度、合同、正常运行时间和可替代性字段明确属于缺口，而非推断事实。
