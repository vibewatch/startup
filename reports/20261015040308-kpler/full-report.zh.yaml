      - number: '3.2'
        title: 工作流黏性来自覆盖广度与交付方式
        blocks:
          - type: paragraph
            body: >-
              本批证据中 Kpler 最有防守力的地方不是某个孤立功能，而是跨商品覆盖、货物和船队分析、船对船监控、制裁筛查，以及通过 API、Excel、类似 Snowflake
              的数据访问、关注列表和提醒进入分析师工作流的组合。交易台一旦把平台接入日常监控和量化模型，Kpler
              就更难被替换。但独立评测并未把平台描述为唯一真相来源，而是将其视为实物流情报的坚实骨架；在高价值决策上仍需要交易员判断和交叉核验。
            claimRefs:
