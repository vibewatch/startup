      - number: '1.2'
        title: 领导层、治理与资本形成
        blocks:
          - type: paragraph
            body: >-
              Kpler 仍带有明显的创始人色彩，但本批证据中的现任领导层图景并不完整。Jean Maynier 一贯被列为联合创始人兼 CTO；François Cazor 仍是 Kpler 在 2024 年 1 月 ARR
              公告中的公开发言人，但 Tracxn 2026 年资料将其列为前联合创始人。公司是否已经完成创始人角色交接，还是只是第三方元数据不一致，目前无法判断。治理信息同样有限：Tracxn 将其追踪到的现任董事列为
              Anna Favarin 和 Axelle Steurs，其中一人为独立董事，但完整董事会、委员会结构和投资人控制权在此均未披露。资本形成可以判断方向，却难以精确还原：Kpler 表示 Five Arrows 和
              Insight Partners 于 2022 年购入少数股权，而 2026 年外部来源将 Sixth Street 与最新融资事件联系起来，却未给出可核对的估值或完整条款。
