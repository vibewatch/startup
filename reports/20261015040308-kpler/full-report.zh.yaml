      - number: '3.3'
        title: 定价与 go-to-market 更偏向企业买家
        blocks:
          - type: paragraph
            body: >-
              留存证据指向企业级、销售驱动的商业模式，而非透明的自助定价。独立评测称 Kpler 按商品和功能模块化，API 用量、历史导出和卫星 AIS
              通常单独定价；一篇评测估计，有限部署的年度支出从数万美元到更广泛企业使用的十几万美元不等。因此 Kpler 更适合能将更高流向可见性变现的专业交易、风险和运营团队。Sixth Street 于 2026 年 6
              月的投资也表明 Kpler 仍在拓展相邻产品面，这有利于打包销售，但也说明它争夺的钱包份额大于单一 LNG 工具。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河的持久性取决于数据广度，而非绝对准确
        blocks:
          - type: paragraph
            body: >-
              本批主要反向证据说明了 Kpler 哪些地方很强、但还不是最终答案。独立评测称，其货物估算在标准化 LNG 和 VLCC
              原油场景最可靠，但在信息不透明地区、散杂货或小批量货物、船对船转运和暗船队行为上需要更多审查。这些评测也将同行定位在流量建模或海事风险等相邻优势上，因此 Kpler
              的护城河更适合理解为广泛的工作流和遥测平台，而非消除其他数据或人工确认需求的供应商。平台因此具有战略重要性，但在缺少外部基准证明时，官方或投资人关于品类领导地位的说法仍有上限。
            claimRefs:
              - CP006
              - CP008
              - CP010
              - CP012
              - CP013
              - CP014
