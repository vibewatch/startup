  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：实物贸易情报，而非横向企业软件
        blocks:
          - type: paragraph
            body: >
              本批证据将 Kpler 放在这样一层运营系统中：大宗商品交易员、分析师、调度员和风险团队需要更早看见货物、船舶、库存和运费瓶颈。Kpler 自己的产品和行业页面围绕货物追踪、贸易流分析、预测以及 40
              多种大宗商品的供应链可见性来定义产品；世界经济论坛资料则将范围扩展到能源、干散货、电力和海事领域。这一边界直接影响估值：相关预算是实物贸易的专业市场情报和工作流工具，而不是通用
              ERP、采购或内陆运输软件。实际上，Kpler 被作为加速器出售，用于更快做出实物市场决策和交叉核验；它叠加在经纪商电话、海关与港口数据和交易员表格之上，并不直接替代核心执行系统。
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: 规模视角：公开覆盖代理指标展现范围，但没有披露 TAM 体系
        blocks:
          - type: paragraph
            body: >
              本批没有来源公布大宗商品流情报的常规 TAM/SAM/SOM，因此可用的市场规模证据是运营覆盖，而非支出规模。Kpler 披露的是覆盖和工作流代理指标：40 多种大宗商品、数万艘船舶、12,000
              多个原油储罐、900
              多家炼厂、长期历史数据档案，以及高频贸易和事件工作流。这些指标意味着服务范围以全球实物商品交易台为中心，并延伸到风险、物流和研究用户，但无法说明各细分市场的收入密度、支付意愿或模块附加率。30,000+ 与
              36,000+ 船舶披露不一致，历史数据 9+ 与 10y+ 的表述也不同，这进一步说明公开规模应视为营销代理指标的区间，而非精确市场地图。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >
              Kpler
              最容易被采用的场景是每分钟都重要的场合：套利发现、航线变化、拥堵、制裁筛查，以及可能影响即期价差或交付窗口的货物运营确认。公开工作流证据显示，API、Excel、提醒和市场交付构成清晰的集成路径；交易台一旦把
              Kpler
              接入日常模型和提醒，转换成本就会上升。同一批证据也揭示了品类的核心局限。独立评测认为货物估算具有概率性，尤其是在信息不透明地区、船对船转运和暗船队活动中；公司也没有公布目录价或清晰的模块价格阶梯。因此，买家可以从公开资料理解问题和产品匹配度，但在评估市场深度或扩张效率前，仍需核实实际价格、模块附加率和
              ROI。
