  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - API 驱动的工作流、广泛大宗商品覆盖及预测 / 炼厂工具，转化为持久扩张和高价续约经济。
        - 只有当尽调证明经常性收入质量高于当前公开证据时，才可能支持有吸引力的入场。
        - 需要直接披露 KPI，验证高留存率和强劲利润率。
        - 无法把广度转化为可量化的钱包扩张。
      - - 基准
        - Kpler 仍具战略用途和商业相关性，但公开经济数据仍不完整，价格也难以纳入投资判断。
        - 支持继续跟踪、选择性接触和尽调，但不承诺买入或明确估值立场。
        - “最符合当前混合证据：产品证明强，公开价格证明弱。”
        - 尽调期间管理层不提供 KPI 包或融资条款。
      - - 悲观
        - 高价模块、概率性估算和不透明条款限制付费意愿，并使投资者暴露于不对称下行。
        - 如果留存率、利润率或权利弱于产品叙事暗示，事后看当前轮次可能定价过高。
        - 独立评测已指出定价摩擦，以及在不透明地区需要交叉验证。
        - 出现留存率疲弱、依赖获客的增长或偏向投资人的优先权安排。
    notes: 公开来源未披露可靠的投后估值，也没有足够单位经济数据支持数值区间，因此情景行陈述的是投资判断条件，而不是无依据的倍数。
    claimRefs:
