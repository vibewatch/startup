  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >
              Kpler 的公开产品面展示的是完整商业套餐，而不是单屏船舶追踪器。公司围绕 40 多种大宗商品营销货物追踪、运费、合规、库存、炼厂、研究、供需、租船、套利和金融流工作流，并通过网页终端、提醒、API、Excel
              Add-In、Snowflake Data Share 和 LiveDB 交付。独立评测称，公司按商品和功能模块销售订阅，价格随模块组合、用户数、API 用量和增值服务变化。公开缺口在于，Kpler
              没有在本批证据中披露官方目录价、实际折扣、合同期限或模块附加率，因此公开价格只能作为方向性信息，不能当作可用于承保的收入真相。
