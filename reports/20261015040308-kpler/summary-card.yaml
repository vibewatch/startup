  topStrengths:
    - >-
      Broad, differentiated physical trade intelligence coverage across commodities and maritime flows with proprietary
      AIS and satellite-data fusion.
    - >-
      Large enterprise customer base and clear workflow embedding across terminal, APIs, Excel, and data-distribution
      channels.
    - Recent Sixth Street minority growth investment validates commercial momentum and investor demand.
  topRisks:
    - No disclosed ARR, gross margin, NRR, churn, or audited group financials to underwrite the implied valuation.
    - UK CMA review and potential remedies could affect the business model and asset footprint.
    - Commodity-flow accuracy and inference degrade in opaque, sparse-AIS, or ship-to-ship transfer environments.
  unresolvedGaps:
    - >-
      Audited consolidated financials for Kpler UK Holdco (FY2023 and FY2024 group accounts) were not obtained; these
      are the primary input needed to underwrite organic ARR growth, gross margin, and the 13–20x implied multiple.
    - >-
      NRR, GRR, churn, cohort retention, and average contract length are entirely absent—critical for a subscription
      platform at $4B valuation and prerequisite for underwriting the land-and-expand motion across 12,000+ customers.
    - >-
      CMA review outcome and potential remedies are unknown; a divestiture order covering AIS assets would require a
      complete re-underwriting of the business model, data moat, and valuation.
    - >-
      Mark Cunningham's full professional background, leadership team composition, and any founder lock-in or vesting
      provisions tied to the Sixth Street investment are not publicly disclosed.
    - >-
      Organic versus acquisition-driven ARR growth split is unknown; given six acquisitions since 2021, the quality and
      durability of ARR growth cannot be assessed without a bridge from inorganic revenue at time of acquisition to
      current organic growth rate.
    - >-
      Credit facility quantum and terms for the August 2025 new charges at Kpler UK Holdco (charges 146491260002 and
      146491260003) are not publicly available; leverage load and covenant structure are material inputs to the
      post-Sixth Street capital structure.
