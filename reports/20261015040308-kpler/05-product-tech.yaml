        - label: "Signal ingestion"
          detail: "AIS/satellite telemetry, port and terminal events, customs/shipping records, pipeline/storage data, government statistics"
          modules:
            - label: "Maritime telemetry"
              detail: "Terrestrial and satellite AIS, voyage history, draught, ETA, vessel positions"
            - label: "Trade records"
              detail: "Port calls, customs filings, manifests, bills of lading, fixtures, shipping data"
        - label: "Fusion and inference"
          detail: "Machine-learning models and analyst validation translate raw signals into operational commodity intelligence"
          modules:
            - label: "Cargo inference"
              detail: "Estimated loaded/unloaded volumes, floating storage, origin/destination, destination forecasts"
            - label: "Behavioral detection"
              detail: "Ship-to-ship transfers, AIS spoofing, route deviations, sanctions-related monitoring"
        - label: "Intelligence applications"
          detail: "Commodity modules and Derived Insights package data into trader, analyst, and compliance workflows"
          modules:
            - label: "Commodity workspaces"
              detail: "Cargo analytics, price overlays, freight views, alerts, watchlists"
            - label: "Research and risk outputs"
              detail: "Forecasts, market calls, due-diligence checks, compliance intelligence"
        - label: "Human delivery surfaces"
          detail: "Interactive interfaces for traders, analysts, and mobile users"
          outputs:
            - label: "Interactive interfaces"
              detail: "Terminal UI, maps, bookmarks, alerts, reports/webinars, iPhone app"
        - label: "Operational control layer"
          detail: "Workflow controls are embedded inside the product surface rather than exposed as a separate external assurance layer"
          outputs:
            - label: "Embedded controls"
              detail: "Sanctions screening, ownership checks, route-deviation alerts, and due-diligence workflows"
        - label: "Machine delivery surfaces"
          detail: "Outputs are also structured for downstream workflow and data-pipeline integration"
          outputs:
            - label: "Machine interfaces"
              detail: "Excel Add-In, REST and streaming APIs, Snowflake Data Share, Kpler LiveDB"
    approximationNotes: "This figure is a synthesis of product and review text from the assigned pool rather than an officially published architecture diagram."
    claimRefs: ["CE001", "CE002", "CE003", "CE006", "CE011"]
callouts:
  - calloutType: "strength"
    title: "Differentiation is workflow-deep, not just data-deep"
    body: "The public moat case is strongest where Kpler couples physical-flow data with trader workflows such as alerts, sanctions checks, analytics, and integrated delivery surfaces."
    claimRefs: ["CE002", "CE003", "CE007", "CE011"]
  - calloutType: "risk"
    title: "Outputs remain decision support, not ground truth"
    body: "Independent reviews consistently frame Kpler as high-value visibility infrastructure whose cargo estimates and event inferences still require corroboration in opaque markets or high-stakes decisions."
    claimRefs: ["CE008", "CE009", "CE013"]
  - calloutType: "recommendation"
    title: "Diligence should focus on controls and implementation economics"
    body: "The remaining underwriting gap is not whether Kpler has a real product, but whether its service levels, control posture, and integration cost profile match the buyer's intended operating dependence."
    claimRefs: ["CE010", "CE013"]
