company:
  name: "Kpler"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Kpler's public product surface is broader than a vessel-tracking terminal: it combines
    commodity-flow data, cargo analytics, sanctions/compliance tooling, and derived research
    across trader-oriented delivery surfaces such as APIs, Excel, and alerting workflows.
    The technical edge appears to come from multi-signal data fusion and AIS-network scale,
    but public diligence still lacks strong third-party evidence on service levels, security
    certifications, and benchmarked accuracy in the hardest-to-observe corridors.
sections:
  - id: "workflow-fit"
    title: "Workflow fit and product surface"
    body: >-
      In customer workflow terms, Kpler sells an operating cockpit for commodity traders,
      analysts, chartering desks, and compliance teams rather than a single data feed.
      Public product pages show a layered surface: the flagship commodities terminal markets
      breadth across 40+ commodities and millions of trades; Cargo Analytics adds vessel,
      cargo, port-call, fixture, and floating-storage workflows; Trading Commodities adds
      alerts, freight and inventory monitoring, sanctions screening, and due-diligence
      checks; the mobile app extends maps, news, and analytics into an on-the-go client.
      The result is a workflow that starts with locating physical cargoes and then moves
      into monitoring events, filtering by route or player, and triggering actions when
      freight, sanctions, or supply conditions change.
    claimRefs: ["CE002", "CE004", "CE005", "CE006", "CE012"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-delivery"
    title: "Data architecture and delivery model"
    body: >-
      The technical architecture described in the assigned pool is a data-fusion stack.
      Kpler's own product copy and independent profiles both describe ingestion of satellite
      and terrestrial AIS, port and terminal intelligence, customs and shipping records,
      pipeline or storage information, and other market data, with machine-learning models
      and analyst review translating those inputs into inferred cargoes, route changes,
      destination forecasts, and supply-demand views. Delivery is intentionally dual-track:
      traders can work through map-first terminals, watchlists, alerts, and research, while
      quant or risk teams can integrate via REST APIs, streaming feeds, Excel, and shared
      analytics tables. That architecture supports Kpler's positioning as a system-of-work
      for physical-flow intelligence instead of a dashboard-only point solution.
    claimRefs: ["CE001", "CE003", "CE007", "CE011"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-risks"
    title: "Maturity, dependencies, and diligence gaps"
    body: >-
      Product maturity looks strongest where Kpler can exploit standardized seaborne
      datasets: independent reviews repeatedly position it as market-leading for vessel
      coverage, flexible workflow tooling, and integration depth in crude, LNG, LPG, and
      related maritime use cases. The same reviews are clear that this is still a
      probabilistic intelligence system, not definitive proof of physical reality: cargo
      estimates weaken in opaque regions, ship-to-ship transfers, dark-fleet contexts, or
      other low-visibility environments, and traders still need desk-level confirmation for
      settlement or minute-sensitive actions. Public evidence is also notably thinner on the
      trust layer than on the product layer: the assigned pool does not provide public uptime
      commitments, incident history, audited security certifications, or quantified API
      service-level terms, so diligence should treat operational resilience and controls as a
      live underwriting item rather than an already-proven strength.
    claimRefs: ["CE008", "CE009", "CE010", "CE013"]
