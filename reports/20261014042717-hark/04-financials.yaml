callouts:
  - calloutType: risk
    title: Down-Round Vulnerability at $6B Pre-Product Valuation
    body: Securing a $6 billion valuation prior to commercial revenue or hardware deployment establishes an aggressive benchmark. If model performance or user retention falters, the substantial burn rate required to develop bespoke hardware and train foundation models exposes Hark to severe down-round risk within 18 months.
    claimRefs:
      - CI007
      - CI011
  - calloutType: insight
    title: Gross Margin Asymmetry in Agentic Cloud Execution
    body: Unlike traditional SaaS interfaces that serve lightweight static pages, Hark Handoff deploys full dedicated virtual machines and multi-browser sessions for each complex errand. Fixed $20/month subscription pricing faces structural gross margin compression if power users run continuous, token-heavy browsing workflows without usage caps.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
