            title: 平台去中介化与在位者防御风险
            body: Hark 在 2027 年硬件上线前依赖云浏览器和移动应用，Apple、Google 等操作系统守门人可以把原生 AI 嵌入手机系统，将助手工作流商品化。
            calloutType: risk
