        title: 买方、用户与付款方分层及采用机制
        blocks:
          - type: paragraph
            body: >-
              Hark 初期依靠个人消费者而非企业采购。主要用户是科技早期采用者和高频 prosumer，通过聊天或仪表盘把旅行、续费等事务交给云端虚拟机。消费套餐中付款人就是终端用户；2027
              年硬件则瞄准家庭场景，由主要订阅者集中购买。
