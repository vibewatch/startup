  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与变现层级
        blocks:
          - type: paragraph
            body: >-
              Hark 通过 2026 年 10 月发布 Hark Pro，以免费增值模式商业化个人智能平台。基础层免费；Hark Pro² 每月 $20、Pro³ 每月 $100，执行能力分别是 2× 和 10×。App
              Store 内购价为 $26.00 和 $129.99，另有未宣传的 $200.00 顶级套餐。公司计划 2027 年用 AI 原生硬件补充订阅。
