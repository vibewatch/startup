  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 多模态模型顺利上线；旗舰设备出货并售出 1M+ 台；高毛利经常性订阅
        - $15B+ 扩张轮或 IPO 资金续航；A 轮入场价获得 2.5x-3.0x 回报
        - 零部件供应链瓶颈，以及 Apple/Meta 的激烈巨头反击
        - 15%（要求基础 AI 模型与硬件制造两条线都完美执行）
      - - 基准情景
        - 软件平台采用获得细分市场牵引力；硬件发布延迟至 2027 年末；算力持续高消耗
        - $3.0B-$4.5B 平价或下轮融资重组；通过转向企业市场保全资本
        - 客户采用放缓、模型商品化，以及联合投资 VC 的投资者疲劳
        - 50%（反映深科技常见的时间表滑延和持续的九位数研发消耗）
      - - 悲观情景
        - 模型性能缺乏差异化；硬件开发中止；现金严重枯竭
        - $500M-$1.0B 困境资产出售或清算；80%-90% 资本损失
        - 无法以 $6B 基准估值筹集后续融资；技术人才流向超大规模云厂商
        - 30%（符合独立 AI 设备初创公司发布后失败的历史先例）
      - - 清算 / 终止情景
        - 核心架构不可行；芯片合作联盟退出；IP 按残值出售
        - <$200M IP 出售（专利、GPU 合同、残值资产）；股权几乎全部损失
        - 投资者信心完全丧失，芯片竞争赞助方之间治理陷入僵局
        - 5%（鉴于 GPU 配额和工程 IP 的剩余价值，这是下行边界）
    notes: 情景建模基于典型消费级硬件开发周期、GPU 算力支出模式和可比风险投资回报画像。
