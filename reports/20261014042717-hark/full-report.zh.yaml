      - number: '4.2'
        title: 单位经济、推理成本与虚拟机开销
        blocks:
          - type: paragraph
            body: >-
              Hark Handoff 依靠专为计算机交互训练的专用模型。据报道，每百万输入 token 的推理价格为 $0.18、每百万输出 token 为 $2.37，明显低于 GPT 5.5 的 $5 输入 / $30
              输出；但 token 推理只占 Hark 运营成本的一部分。每个用户会话都要在云端配置一台专用虚拟电脑，配备隔离浏览器、安全文件系统和执行环境；Handoff
              还可同时驱动最多六个浏览器，以并行比价、搜索预约和核验时段。随着任务复杂度和时长线性增加，这种持续的基础设施占用会带来明显算力开销。              因此，在固定 $20 /
              月的订阅下，重度用户大量执行事务可能严重压缩毛利率，除非 Hark 大幅优化推理缓存和虚拟机容器效率。
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
      - number: '4.3'
        title: 商业 traction 代理指标、销售路径与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Hark 从 2025 年末至 2026 年初一直隐身，直到 2026 年 10 月才推出消费软件，因此财务 traction 不透明。没有披露收入、ARR、付费订阅数、流失率或净留存；前 100,000
              名注册用户免费使用高级套餐，也掩盖了付费意愿。必须审阅 cohort 留存和账单记录，才能验证商业成熟度。
            claimRefs:
              - CI001
              - CI008
              - CI012
      - number: '4.4'
        title: 资本充足度、硬件资本开支消耗与投资结论
        blocks:
          - type: paragraph
            body: >-
              Hark 从 Brett Adcock 获得 $100 million 创始人种子资金，随后于 2026 年 5 月以 $6 billion 投后估值完成 $700 million Series A，由
              Parkway Venture Capital 领投，Nvidia、AMD Ventures、Intel Capital 和 Qualcomm Ventures 等半导体战略投资者参与。储备预计可支撑 24 至
              36 个月的资金续航，但资本密集度很高：配备数千张 Nvidia B200 GPU 的专用数据中心用于多模态基础模型训练，2027
              年设备制造前还要连续多年投入硬件原型和零部件工装，因此每季度都将消耗数千万美元现金。$6 billion
              估值早于可验证的商业收入或硬件销售；独立分析师警告，任何执行失误或模型延期都会显著增加下轮降价融资风险。Hark
              资金雄厚，又有一线芯片厂商支持，但单位利润不透明、硬件尚未产生收入且资本需求高，仍是典型的风险投资级财务风险。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
      - number: '4.5'
        title: 案例要点
        blocks:
