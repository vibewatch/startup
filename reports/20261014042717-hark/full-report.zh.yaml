    type: stack
    summary: 将 Hark 的产品架构拆解为界面编排、云虚拟化、安全治理和实体硬件路线图。
    data:
      layers:
        - label: 1. 客户端用户界面层
          detail: 全屏主动式画布，结合文本编辑器、主动式卡片和可定制面板小组件。
