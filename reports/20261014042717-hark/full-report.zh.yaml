              可延伸前沿模型；Humane、Rabbit 代表专用设备路线，手动浏览器仍是替代品。Hark 所宣称的独立品类，仍取决于跨服务跑通一个真正有用的界面，并在后续证明独立设备优于手机、浏览器和成熟生态中已有的助手。
