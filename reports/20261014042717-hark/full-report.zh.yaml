        title: 资本结构与战略投资者联盟
        blocks:
          - type: paragraph
            body: >-
              Hark 累计募资 8 亿美元。继 Adcock 投入 1 亿美元种子资金后，公司于 2026 年 5 月以 60 亿美元投后估值完成超额认购的 7 亿美元 A 轮，由 Parkway Venture
