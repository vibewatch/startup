      - number: '2.2'
        title: 可触达市场规模：口径、估算与结构性约束
        blocks:
          - type: paragraph
            body: >-
              评估 Hark 的可触达机会，必须把数字消费注意力与尚未验证的硬件设备采用拆开。调查显示，用户电脑时间的 74.9% 直接发生在网页浏览器中；但对于缺少原生 API 的网页服务，用户是否愿意每月支付 $20 至
              $100 来自动完成任务，仍构成明显约束。相邻硬件市场已有早期验证：Meta 的 Ray-Ban 销量超过 2 million 台；但独立 AI 硬件有过惨痛失败，Humane 融资 $230 million
              后仅以 $116 million 售出。Hark 的 $6 billion Series A 投后估值更像激进的平台级定价，而不是经审计的商业收入。
