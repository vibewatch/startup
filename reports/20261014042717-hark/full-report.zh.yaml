      - number: '8.4'
        title: 分析建议逻辑与关键尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合尽调评估明确建议规避该项目，同时将估值定性为昂贵、风险评级为高、分析信心为中等。Hark 当前入场价格几乎没有容错空间：投资人要为一款尚未发布、且所在品类充斥资本减记的产品承保 60
              亿美元估值。创始人履历和战略芯片供应商的支持虽带来初步可信度，但资本承诺无法替代用户留存、软件毛利率和客户付费意愿。在任何资本配置者考虑参与二级交易或未来扩张轮之前，必须解决四项不可妥协的尽调要求。第一，获取
              Hark 自研多模态模型经验证的测试指标，证明其达到领先基准的前沿水平。第二，管理层须披露详细的硬件物料清单成本预测和制造合作伙伴。第三，Hark
              须提供经验证的预购需求、企业管线承诺和用户参与留存曲线。最后，投资人需要完整了解资本表清算优先权、GPU 基础设施债务义务，以及全量硬件生产消耗下的现金续航。
            claimRefs:
