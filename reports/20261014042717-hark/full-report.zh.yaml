  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、战略定位与市场反命题
        blocks:
          - type: paragraph
            body: >-
              Hark 完成了风险投资史上最激进的融资之一：2026 年 5 月以 60 亿美元投后估值完成 7 亿美元 A 轮融资。创始人 Brett Adcock 在 2025 年末投入 1
              亿美元个人资金启动公司，此前他已成功做大 Figure AI 和 Archer
              Aviation。核心投资逻辑是：智能手机和屏幕属于不适合代理式人工智能的过时计算范式，因此需要把多模态模型与定制物理硬件垂直整合。Hark 的融资银团高度集中，既有传统竞争者 Nvidia、AMD
              Ventures、Intel Capital、Qualcomm Ventures，也有 Parkway Venture Capital、Salesforce Ventures 和 ARK
              Invest。然而，运营层面的反论同样尖锐：消费级 AI 硬件的历史表现惨淡。Humane AI Pin 等前代产品融资 2.3 亿美元后以 1.16 亿美元卖给 HP，Rabbit R1
              等设备则遭遇灾难性产品评价。在基本验证产品市场匹配之前，同时开发基础模型和定制硬件，会带来巨大的运营复杂度和前所未有的资本密集度。
