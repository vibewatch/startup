      - number: '8.3'
        title: 情景分析：乐观、基准与悲观回报预测
        blocks:
          - type: paragraph
            body: >-
              为量化 Hark 当前资本结构的风险收益，尽调模型在 18 至 36 个月期限内设定四种运营情景。乐观情景（15% 概率）下，Hark 在 2026 年夏季成功推出具备竞争力的多模态模型，并在 2027
              年前推出个人硬件系列，销量超过 1 million 台，同时建立高毛利软件订阅绑定率；这一路径将支撑 $15 billion 后续估值，相比 Series A 入场价格带来 2.5x 回报。基准情景（50%
              概率）下，Hark 的模型发布遭遇 OpenAI、Google 和 Meta 的激烈竞争，硬件交付推迟到 2027 年末；持续算力消耗迫使公司以 $3.0 to $4.5 billion
              进行平价或结构化重组，倍数压缩并大幅稀释 Series A 股东。悲观情景（30% 概率）下，初代多模态模型无法形成商业差异化，硬件制造出现致命散热或元件缺陷，公司被迫以 $500 million to $1.0
              billion 进行困境资产出售。严重清算情景（5% 概率）下，IP 残值低于 $200 million，股权几乎全部损失。
