        - id: n5
          label: 不利的不对称风险收益
          description: 以 $6B 入场基准计算，估值上行空间有限，但下行风险严重
        - id: n6
          label: 最终投资立场：回避
          description: 在独立的商业化证据出现前，暂缓投入成长型股权资本
      edges:
        - from: n1
          to: n2
          label: 造成估值与证据不匹配
        - to: n3
          from: n2
          label: 没有现金流入却加剧持续消耗
        - from: n3
          to: n4
          label: 加剧时间压力
        - from: n4
          to: n5
          label: 摧毁风险调整后回报
        - from: n5
          to: n6
          label: 支持回避投资的建议
