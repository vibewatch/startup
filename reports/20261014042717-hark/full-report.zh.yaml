        title: 市场定义、边界范围与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Hark 将类别定义为个人人工智能和通用人机界面，横跨基础模型、智能体云软件和专有设备，而非现有移动系统上的应用。市场包括消费订阅软件、多模态个人助手和 2027 年环境计算硬件；不包括企业开发者智能体、后端
              RPA 和 Figure AI 负责的工业机器人。智能手机、免费聊天应用及 Apple Intelligence、Google Gemini 是现状替代品。
            claimRefs:
