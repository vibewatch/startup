            - 主动式建议操作卡片
            - 可定制面板小组件
        - label: 2. 客户端执行视口层
          detail: 实时视觉回放窗口，展示自动化浏览器导航，让用户看清执行过程。
          modules:
            - 实时 DOM 执行流
            - 交互式审批触发器
            - 任务状态指示器
        - label: 3. 代理编排层（Handoff）
          detail: 专有计算机操作模型，将自然语言指令转化为多步骤浏览器操作。
