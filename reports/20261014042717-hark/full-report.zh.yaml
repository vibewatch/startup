        title: 增长驱动、采用摩擦与市场尽调缺口
        blocks:
          - type: paragraph
            body: >-
              个人 AI 增长来自消费者厌倦手工网页流程；每千项服务中不足一项公开 API。信任、隐私和延迟阻碍普及：智能体需访问邮箱、日历和支付凭证，多分钟自动化也会消磨耐心。公开客户数、留存 cohort 和 ARR
              均缺失，使 60 亿美元估值下的市场获取尚未验证。
