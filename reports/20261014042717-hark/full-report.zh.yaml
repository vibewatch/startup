      - number: '1.4'
        title: 商业化轨迹与尽调现实
        blocks:
          - type: paragraph
            body: >-
              Hark 于 2026 年 10 月 6 日在网页、iOS 和 Android 平台公开推出 Hark
              Pro，把它定位成处理日常认知任务的操作系统。产品配备自主网页浏览智能体，能登录用户服务、执行多步骤交易并自动处理行政流程；这次发布让 Hark 走出纯实验室隐身阶段，但公司规划的原生硬件家族仍计划于 2027
              年交付。从投资尽调角度看，Hark 的 $6 billion 估值带来不对称下行风险。公司目前披露的商业收入微乎其微；基础模型训练成本与硬件供应链工具投入同时发生，长期现金消耗将很高。Humane AI Pin
              和 Rabbit R1 的商业困境说明，替代成熟的手机界面极其困难。在 Hark 证明付费订阅用户能长期留存、并推出可上市硬件前，这一溢价估值体现的仍是平台战略潜力，而非已验证的单位经济。
            claimRefs:
              - CO004
              - CO010
              - CO012
              - CO013
              - CO015
