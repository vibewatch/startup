      - number: '8.2'
        title: 估值分析、股权结构表与同业可比
        blocks:
          - type: paragraph
            body: >-
              在 60 亿美元投后估值下，Hark 的定价已接近成熟上市科技公司的水平，但公司仍完全没有收入。7 亿美元 A 轮意味着本轮稀释约 11.7% 至 12.0%；Adcock
              仍保有大量创始人股权控制，同时早期机构也持有股份。由于 Hark 报告的商业收入、客户账户和经常性账单均为零，企业价值 / 收入、EV/ARR 等传统倍数无法计算。将 Hark
              与上市硬件和消费平台同业比较，会凸显其极端估值溢价。Apple 和 Meta 的预期收入交易倍数为 7 倍至 9 倍，同时创造数千亿美元全球硬件现金流。即使是 Anthropic、OpenAI 等前沿 AI
              模型开发商，也是在证明开发者广泛采用、API 变现和 ARR 快速增长后，才获得数十亿美元估值。此外，Hark 运营着由 Nvidia B200 GPU 驱动的专用数据中心，员工已超过 70
              人，年化现金消耗直奔九位数。在毛利率和硬件物料清单成本均未披露的情况下，60 亿美元估值完全依赖创始人势能和平台期权价值，而非基本现金流。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV014
