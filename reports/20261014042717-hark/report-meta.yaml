companyProfile:
  summary: >-
    Hark is a San Jose-based consumer AI startup founded by Brett Adcock to build a vertically integrated
    personal-intelligence platform spanning proprietary models, Hark Pro software, and planned AI-native hardware. The
    company emerged from stealth with substantial founder capital, a large Series A syndicate, and a recruited team
    drawn from leading consumer hardware and AI organizations, but it still has not disclosed revenue, retention, or
    other durable operating metrics.
