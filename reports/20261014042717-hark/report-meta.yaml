  topStrengths:
    - Elite founder pedigree and a well-capitalized balance sheet.
    - Strategic semiconductor backing plus unusually strong hardware and AI recruiting.
    - Public launch of Hark Pro establishes an initial commercial foothold.
  topRisks:
    - $6 billion valuation precedes disclosed revenue, retention, and gross-margin proof.
    - Hardware execution, platform substitution, and compute burn remain major downside drivers.
    - Customer adoption and pricing durability are still largely unverified.
  unresolvedGaps:
    - >-
      Named paying customers, deployment metrics, retention indicators, and proof that Hark’s buyer segment extends
      beyond early curiosity.
    - >-
      Product specifications, launch-market details, pricing, and the exact role of hardware versus software in the
      first commercial release.
    - Recognized revenue, burn, runway, gross margin, compute commitments, and cap-table terms behind the Series A.
    - >-
      Independent valuation evidence such as secondary trades, customer-backed KPIs, or comparables that close the gap
      between Hark’s $6 billion price and better-evidenced peers.
