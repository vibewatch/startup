callouts:
  - calloutType: "risk"
    title: "Platform Disintermediation and Incumbent Defense Risk"
    body: "Because Hark relies on cloud browsers and mobile apps before its 2027 hardware launch, major operating system gatekeepers like Apple and Google can commoditize assistant workflows by embedding native AI directly into smartphone system software."
    claimRefs:
      - "CM007"
      - "CM009"
  - calloutType: "insight"
    title: "The Friction of Full Digital Delegation"
    body: "Transitioning consumers from conversational query-and-response tools to autonomous web-browsing agents requires overcoming acute privacy hurdles, as handing over live credentials, payment authority, and ambient context demands unprecedented user trust."
    claimRefs:
      - "CM008"
      - "CM011"
      - "CM014"
