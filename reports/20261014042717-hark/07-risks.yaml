callouts:
  - calloutType: "risk"
    title: "Pre-Product Valuation Downside Asymmetry"
    body: "Securing a $6 billion valuation without verified commercial revenue or shipping hardware creates an acute down-round hazard. If user retention falters or the 2027 hardware launch faces supply chain setbacks, Hark will face severe valuation compression when seeking follow-on growth equity."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR007"
  - calloutType: "insight"
    title: "The Agentic Credential Vulnerability Trap"
    body: "Hark Pro's reliance on cloud-hosted virtual browsers to navigate consumer websites exposes users to systemic credential vulnerability. While framing its architecture around privacy, the platform requires extensive password, cookie, and card delegation, creating an attractive target for security breaches and regulatory scrutiny."
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
