      - TM003
  - type: private-evidence-only
    severity: material
    topic: hardware-specifications
    missingEvidence: >-
      Technical specifications, bill of materials (BOM), manufacturing unit economics, and launch pricing for Hark's
      planned 2027 hardware devices.
