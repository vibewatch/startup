  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming recognized revenue, annual recurring revenue (ARR), gross margin, and
      monthly operating cash burn.
    whyItMatters: >-
      Without recognized revenue or burn rates, evaluating the sustainability of Hark's $6 billion post-money valuation
      rests entirely on narrative momentum and semiconductor syndicate support.
    diligencePath: >-
      Request confidential financial disclosures, compute expense commitments, and current cash runway figures during
      investor diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Full organizational roster covering secondary engineering management, board of directors composition, and voting
      control provisions.
    whyItMatters: >-
      Identifies whether corporate governance includes independent oversight or grants concentrated unilateral control
      to the founder.
    diligencePath: >-
      Inspect certificate of incorporation, board voting agreements, and complete corporate filings via private data
      room.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Exact equity percentage allocations, liquidation preferences, and board representation rights across Series A
      syndicate members.
    whyItMatters: >-
      Reveals potential governance deadlocks among rival semiconductor investors and clarifies downside protection
      structures.
    diligencePath: Review Series A term sheet, investor rights agreement, and cap table capitalization waterfall model.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-metrics
    missingEvidence: >-
      Independent audit or verified customer deployment data indicating paying user volume, retention cohorts, or
      commercial ARR for Hark Pro.
    whyItMatters: >-
      Valuation at $6 billion requires significant commercial traction, but Hark has not yet disclosed customer counts,
      recognized revenue, or churn rates.
    diligencePath: >-
      Review post-launch user telemetry, customer case studies, App Store grossing ranks, and audited financial
      statements during Series B due diligence.
    relatedQuestionRefs:
