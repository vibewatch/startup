chapter:
  number: 5
  title: "Product & Technology"
  summary: "Hark Labs launched Hark Pro in October 2026, transitioning beyond conventional chat assistants to a computer-use system powered by its proprietary Handoff model. While the platform offers innovative multi-sandbox automation and plans 2027 AI-native hardware, early adoption faces significant operational and legal friction due to unverified benchmarks and a unilateral liability shift onto end users."
sections:
  - id: "hark-pro-definition-and-interface"
    title: "Hark Pro Product Definition and Interface Architecture"
    body: "On October 6, 2026, Hark Labs launched its flagship personal assistant Hark Pro across iOS, Android, and web platforms, shifting the primary user interaction paradigm away from reactive conversational chatboxes toward an active graphical user interface. Designed by former Apple design director Abidur Chowdhury, Hark Pro combines a central text composer with an array of proactive action cards, one-tap execution buttons, and customizable dashboard widgets designated as panels. Rather than requiring users to manually navigate multiple disconnected web applications, the platform attempts to function as an orchestration layer for digital consumer errands such as expense approvals, flight check-ins, and online order placements. Commercial access is structured around a baseline free tier alongside paid subscriptions priced at $20 monthly for Hark Pro² and $100 monthly for Hark Pro³, which expand compute quotas by factors of two and ten rather than gating proprietary interface features. To cultivate user trust during automated workflows, the client interface renders an active execution viewport that visually replays the agent's browser interactions, establishing operational transparency while exposing early execution latency."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE007"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "handoff-computer-use-architecture"
    title: "Handoff Computer-Use Model and Execution Engine"
    body: "The core computational intelligence powering Hark Pro is Handoff, a specialized computer-use model trained via post-training supervision and reinforcement learning to perceive web viewports and manipulate interface elements. Operating on the premise that fewer than one in a thousand consumer web services provide programmatic APIs, Hark bypasses traditional API integration bottlenecks by spinning up dedicated cloud virtual machines equipped with isolated browsers, terminal shells, and local file systems. The infrastructure is capable of driving up to six concurrent browser sessions simultaneously, allowing the agent to perform multi-tab cross-site price comparisons, appointment scheduling, and form completion across services lacking official developer interfaces. Hark integrates the Model Context Protocol to manage tool bindings and context delivery during execution loops. While Hark asserts that Handoff achieved a top score of 97.7 on the third-party Online-Mind2Web benchmark, the evaluation compared against older model baselines and was supplemented by proprietary internal benchmarks that lack external auditing, leaving real-world robustness on complex production workflows unproven."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE007"
      - "CE009"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "infrastructure-and-hardware-roadmap"
    title: "Infrastructure Scaling, Partnerships, and Hardware Roadmap"
    body: "To support intensive model training and multi-session browser virtualization, Hark operates a dedicated data center populated with Nvidia B200 GPUs, funded by its $100 million initial capitalization and May 2026 Series A round. On August 27, 2026, Hark announced a multi-year strategic partnership with Nvidia to co-develop personalized agent technology targeting deployment across gigawatt-scale compute clusters on Nvidia's next-generation Vera Rubin architecture. Founder Brett Adcock has positioned Hark as a vertically integrated computing platform that designs models, software, and physical consumer devices in tandem, aiming to launch a family of AI-native hardware devices for home and personal environments in 2027. Hark's hardware and industrial design efforts are anchored by Abidur Chowdhury and an engineering roster recruited from Apple, Tesla, Meta, and Google. Furthermore, Hark trains foundation models in operational and geographical proximity to sister robotics venture Figure AI, establishing potential data-sharing synergies where embodied real-world perception feeds digital reasoning, although both corporate entities maintain distinct balance sheets and ownership structures."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE003"
  - id: "security-privacy-and-governance-controls"
    title: "Security Controls, Data Retention, and Liability Governance"
    body: "Hark markets Hark Pro as a privacy-first alternative to ad-supported technology giants, asserting that it does not monetize consumer telemetry or construct behavioural advertising profiles. The company maintains zero-data-retention and anti-training commercial agreements with foundation model providers OpenAI and Anthropic, injecting session tokens through an encrypted credential vault to navigate third-party web services. However, independent diligence reveals material governance and compliance discrepancies. Hark retains service data, session cookies, authentication tokens, and execution logs across the entire user account lifecycle without disclosing encryption standards, key management policies, or SOC 2 Type II compliance audits. Crucially, Hark's service terms enforce standing authorization clauses that assign full legal, operational, and financial responsibility to the user for all automated transactions, purchases, and system modifications performed by the agent. In the absence of an operational escrow or error reimbursement mechanism, enterprise and consumer adoption remains constrained by this substantial asymmetry between agent autonomy and user liability."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE013"
      - "CE014"
