callouts:
  - calloutType: "risk"
    title: "Standing Permissions and Unilateral Liability Shift"
    body: "Although Hark Pro provides visual transparency via a real-time browser execution window, its legal terms shift 100% of the financial and legal liability for agent actions onto the user under broad standing permissions. In the absence of SOC 2 compliance documentation, independent penetration tests, or an escrow reimbursement policy for erroneous purchases, enterprise and risk-averse consumers face unmitigated exposure."
    claimRefs:
      - "CE008"
      - "CE014"
