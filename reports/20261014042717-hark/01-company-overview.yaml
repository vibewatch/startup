    title: Unprecedented Semiconductor Syndicate Validation
    body: Securing simultaneous co-investments from Nvidia, AMD Ventures, Intel Capital, and Qualcomm Ventures in a single Series A round provides Hark with unparalleled hardware optionality and compute credibility, signaling broad industry conviction in custom personal intelligence interfaces.
    claimRefs:
      - CO006
  - calloutType: risk
    title: Asymmetric Down-Round Vulnerability
    body: Carrying a $6 billion valuation prior to demonstrating significant commercial revenue or proprietary hardware mass-production creates an acute sensitivity to early software adoption metrics and execution delays.
    claimRefs:
      - CO004
      - CO013
