callouts:
  - calloutType: "risk"
    title: "The Hardware Thesis Is Not Yet Testable"
    body: "Hark's announced AT&T relationship supports a connectivity route, but the device form, price, battery life, service terms, and measured user benefit remain undisclosed. Capital and vertical integration do not resolve that product-market evidence gap."
    claimRefs:
      - "CP004"
      - "CP006"
      - "CP015"
  - calloutType: "insight"
    title: "Software Launch Turns the Moat Question Into a Retention Test"
    body: "Free web and mobile access can seed routines before hardware arrives, but it also permits easy multi-homing. Retention, repeat task completion, and reduced user effort are more probative than the breadth of the announced device roadmap."
    claimRefs:
      - "CP001"
      - "CP010"
      - "CP011"
      - "CP016"
