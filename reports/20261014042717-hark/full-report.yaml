      - number: '5.4'
        title: Security Controls, Data Retention, and Liability Governance
        blocks:
          - type: paragraph
            body: >-
              Hark markets Hark Pro as a privacy-first alternative to ad-supported technology giants, asserting that it
              does not monetize consumer telemetry or construct behavioural advertising profiles. The company maintains
              zero-data-retention and anti-training commercial agreements with foundation model providers OpenAI and
              Anthropic, injecting session tokens through an encrypted credential vault to navigate third-party web
              services. However, independent diligence reveals material governance and compliance discrepancies. Hark
              retains service data, session cookies, authentication tokens, and execution logs across the entire user
              account lifecycle without disclosing encryption standards, key management policies, or SOC 2 Type II
              compliance audits. Crucially, Hark's service terms enforce standing authorization clauses that assign full
              legal, operational, and financial responsibility to the user for all automated transactions, purchases,
              and system modifications performed by the agent. In the absence of an operational escrow or error
              reimbursement mechanism, enterprise and consumer adoption remains constrained by this substantial
              asymmetry between agent autonomy and user liability.
            claimRefs:
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Standing Permissions and Unilateral Liability Shift
            body: >-
              Although Hark Pro provides visual transparency via a real-time browser execution window, its legal terms
              shift 100% of the financial and legal liability for agent actions onto the user under broad standing
              permissions. In the absence of SOC 2 compliance documentation, independent penetration tests, or an escrow
              reimbursement policy for erroneous purchases, enterprise and risk-averse consumers face unmitigated
              exposure.
            calloutType: risk
            claimRefs:
              - CE008
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Target Personas
        blocks:
          - type: paragraph
            body: >-
              Hark positions its core product as a universal personal intelligence platform rather than an enterprise
              business-to-business solution. With the public release of Hark Pro on October 6, 2026, the company
              established three distinct consumer tiers: a baseline free plan, Hark Pro² at 0 per month (granting a 2x
              usage multiplier), and Hark Pro³ at 00 per month (granting a 10x usage multiplier), with an unannounced 00
              tier appearing in App Store listings. Rather than restricting features across tiers, Hark provides full
              computer-use capabilities across all plans, monetizing solely on execution volume and compute capacity.
              The primary user persona encompasses knowledge workers, digital prosumers, and executive operators seeking
              to delegate repetitive digital errands—including food ordering, travel bookings, calendar coordination,
              and form submissions—to an autonomous cloud-based agent. While this freemium consumer orientation enables
              rapid top-of-funnel customer acquisition, it contrasts sharply with traditional enterprise SaaS software,
              offering no disclosed seat-based licensing, dedicated support SLAs, or institutional compliance frameworks
              as of October 2026.
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU013
              - CU014
