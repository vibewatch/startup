  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Category
      - Core Thesis (Bull Perspective)
      - Anti-Thesis (Diligence Concern)
      - What Would Change The View
    rows:
      - - Platform Ambition
        - Vertically integrated models and custom hardware create proprietary ecosystem
        - Hardware manufacturing and custom silicon development impose extreme capital burn
        - Demonstration of mass-manufacturable hardware prototype with sustained consumer utility
      - - Founder Pedigree
        - Brett Adcock demonstrated multi-billion scaling at Figure AI and Archer
        - Serial founder reputation drives momentum pricing detached from operating traction
        - Delivery of proprietary frontier-class multimodal models competitive with leading labs
      - - Strategic Syndicate
        - Nvidia, AMD, Intel, and Qualcomm provide unparalleled compute and silicon access
        - Four competing chip vendors create conflicting architectural incentives
        - Formal silicon delivery roadmap with single-architecture hardware optimization commitments
      - - Market Opportunity
        - Post-smartphone AI interface represents a multi-trillion-dollar personal platform
        - Consumer AI hardware track record shows high failure rates (Humane, Rabbit)
        - Verified paid pre-orders or enterprise software licensing traction demonstrating product-market fit
    notes: >-
      Comparative analysis of core investment thesis and disconfirming anti-thesis factors across operational,
      technical, and market dimensions.
