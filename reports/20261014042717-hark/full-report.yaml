        - label: Target Agentic Early Adopters (Narrow SAM)
          detail: Active prosumers willing to delegate personal credentials, calendar, and payments to cloud agents
        - label: Hark Pro Tiered Subscription Base (Software SOM)
          detail: Paying subscribers on $20/month ($240/yr) and $100/month ($1,200/yr) usage tiers
        - label: Initial Dedicated Hardware Device Buyers (Hardware SOM)
          detail: First-wave purchasers of Hark proprietary native devices planned for 2027 release
    approximationNotes: >-
