  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Multimodal models launch smoothly; flagship device ships with 1M+ units sold; high-margin recurring
          subscriptions
        - $15B+ expansion round or IPO runway; 2.5x-3.0x return on Series A entry price
        - Component supply chain bottlenecks and aggressive incumbent retaliation from Apple/Meta
        - 15% (Requires flawless dual execution across foundational AI models and hardware manufacturing)
      - - Base Case
        - >-
          Software platform adoption gains niche traction; hardware release delayed to late 2027; ongoing heavy compute
          burn
        - $3.0B-$4.5B flat or down-round restructuring; capital preservation via enterprise pivots
        - Slower customer adoption, model commoditization, and investor fatigue across syndicated VCs
        - 50% (Reflects typical deep-tech timeline slippage and sustained nine-figure research burn)
      - - Bear Case
        - Model performance fails to differentiate; hardware development aborted; severe cash depletion
        - $500M-$1.0B distressed asset sale or liquidation; 80%-90% capital impairment
        - Inability to raise follow-on financing at $6B benchmark; tech talent attrition to hyperscalers
        - 30% (Consistent with historical precedent of standalone AI device startups failing post-launch)
      - - Liquidation / Kill Scenario
        - Core architecture unviable; partner silicon syndicate disengages; IP sold for salvage value
        - <$200M IP sale (patents, GPU contracts, salvage assets); near-total equity loss
        - Complete loss of investor confidence and governance deadlocks among rival chip sponsors
        - 5% (Downside bound given residual value of GPU allocations and engineering IP)
    notes: >-
      Scenario modeling based on typical consumer hardware development timelines, GPU compute expenditure patterns, and
      comparative venture return profiles.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV012
