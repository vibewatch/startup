      - number: '5.3'
        title: Infrastructure Scaling, Partnerships, and Hardware Roadmap
        blocks:
          - type: paragraph
            body: >-
              To support intensive model training and multi-session browser virtualization, Hark operates a dedicated
              data center populated with Nvidia B200 GPUs, funded by its $100 million initial capitalization and May
              2026 Series A round. On August 27, 2026, Hark announced a multi-year strategic partnership with Nvidia to
              co-develop personalized agent technology targeting deployment across gigawatt-scale compute clusters on
              Nvidia's next-generation Vera Rubin architecture. Founder Brett Adcock has positioned Hark as a vertically
              integrated computing platform that designs models, software, and physical consumer devices in tandem,
              aiming to launch a family of AI-native hardware devices for home and personal environments in 2027. Hark's
              hardware and industrial design efforts are anchored by Abidur Chowdhury and an engineering roster
              recruited from Apple, Tesla, Meta, and Google. Furthermore, Hark trains foundation models in operational
              and geographical proximity to sister robotics venture Figure AI, establishing potential data-sharing
              synergies where embodied real-world perception feeds digital reasoning, although both corporate entities
              maintain distinct balance sheets and ownership structures.
