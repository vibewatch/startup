  - id: FP001
    title: 'Competitive Positioning: Distribution Reach vs. Stack Integration'
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning shows Hark's unusually high integration ambition but lower proven distribution
      than platform incumbents.
    data:
      points:
        - label: Hark
          x: 3
          'y': 5
          detail: >-
            Web and mobile distribution today; reported ambition spans proprietary models, interfaces, and connected
            hardware.
        - label: OS incumbents
          x: 5
          'y': 4
          detail: >-
            Existing platform distribution and integrated device/software stacks; no like-for-like task benchmark
            retained.
        - label: Frontier model labs
          x: 4
          'y': 3
          detail: Broad application and developer reach with agent-platform competition; hardware integration varies.
        - label: New assistant apps
          x: 2
          'y': 2
