chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Founding Thesis
        blocks:
          - type: paragraph
            body: >-
              Founded in late 2025 in San Jose, California, Hark operates at the intersection of foundation model
              development and purpose-built hardware engineering. The venture was conceived by serial entrepreneur Brett
              Adcock, who previously co-founded electric vertical takeoff and landing pioneer Archer Aviation and
              humanoid robotics firm Figure AI. Operating from an initial eight-month stealth period supported by $100
              million in personal founder funding, Hark established a founding thesis centered on full-stack vertical
              integration. Rather than treating artificial intelligence as an application layer grafted onto legacy
              smartphones or desktop operating systems, Hark is designing multimodal foundation models, agent software
              runtimes, and proprietary hardware devices in tandem. The company contends that prevailing large language
              models remain fundamentally constrained by pre-AI device architectures and disjointed user interfaces. To
              power its research initiatives, Hark secured and deployed a dedicated data center infrastructure equipped
              with thousands of Nvidia B200 GPUs. This infrastructure enables internal pre-training and post-training of
              models designed to observe, listen, retain context, and execute multi-step user workflows across disparate
              digital environments.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO011
