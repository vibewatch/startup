      - - Post-money Series A valuation overhang ($6B on unproven traction)
        - Capital Markets
        - High
        - High
        - Nascent
        - Severe down-round dilution risk if commercial adoption slows
        - Monitor private secondary market marks and follow-on round pricing multiples
    notes: >-
