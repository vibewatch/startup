      - number: '6.3'
        title: Customer Proof, Referenceability, and Workflow Performance
        blocks:
          - type: paragraph
            body: >-
              Verifiable customer evidence for Hark remains confined to initial consumer trials and public product
              demonstrations. In benchmark demonstrations conducted during the October 2026 launch, Hark Pro's
              underlying Handoff computer-use agent successfully completed real-world web transactions—such as ordering
              food via DoorDash and renewing vehicle registrations on government DMV portals—by controlling a
              cloud-hosted browser. However, early reviewer experiences highlighted meaningful workflow latency:
              multi-step website navigation through cloud virtual machines took several minutes to complete, leading
              reviewers to note that manual execution was noticeably faster than agent delegation. To mitigate user
              anxiety and establish credibility, Hark incorporates a visible execution window that displays the agent's
              real-time browser actions to the user. Nevertheless, Hark discloses zero named enterprise production
              customers, zero commercial design partnerships, and zero B2B reference accounts. All public adoption
              consists of individual consumer sign-ups interacting with early software interfaces.
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU009
