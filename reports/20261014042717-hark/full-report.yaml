  - id: FM001
    title: Constrained addressable market pyramid
    type: pyramid
    summary: Hierarchical market sizing layers from total digital browser attention down to near-term paying subscriber base.
    data:
      items:
        - label: Global Digital Consumer Attention (TAM)
          detail: Billions of desktop and mobile users spending 74.9% of screen time in web browsers
        - label: Addressable Web Task Automation (Broad SAM)
          detail: Routine web errands across services lacking consumer APIs (food, travel, registrations)
        - label: AI Hardware & Smart Wearables Ecosystem (Hardware SAM)
