  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: End-to-end conversion bridge from user task request to gross margin contribution in Hark Handoff.
    data:
      nodes:
        - id: n1
          label: User Task Request
          detail: Consumer asks Hark Pro for multi-step errand (travel, food, DMV, billing)
        - id: n2
          label: Top-of-Funnel Freemium
          detail: Baseline usage provided at zero subscription charge to drive consumer trial
        - id: n3
          label: Subscription Upgrade
          detail: Heavy errand frequency converts users to $20/mo or $100/mo usage tiers
        - id: n4
          label: Inference Execution
          detail: Handoff model consumes input ($0.18/M tokens) and output ($2.37/M tokens)
        - id: n5
          label: Cloud VM Operating Cost
          detail: Dedicated virtual machine runs isolated browser, file system, and terminal per task
        - id: n6
          label: Net Unit Contribution
          detail: Gross margin realized after deducting cloud compute and platform fees
      edges:
        - from: n1
          to: n2
          label: initiates
        - from: n2
          to: n3
          label: drives volume
        - from: n3
          to: n4
          label: generates revenue
        - from: n4
          to: n5
          label: incurs inference
        - from: n5
          to: n6
          label: deducts hosting
    approximationNotes: >-
