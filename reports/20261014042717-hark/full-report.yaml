      - number: '7.2'
        title: Hardware Execution, Supply Chain Friction, and Form Factor Uncertainty
        blocks:
          - type: paragraph
            body: >-
              Hark's core strategic differentiation hinges on pairing proprietary multimodal models with custom
              AI-native hardware devices planned for rollout in 2027. However, the historical record for standalone
              consumer AI hardware ventures—exemplified by the commercial collapse of the Humane AI Pin following $230
              million in raised capital and its subsequent fire-sale acquisition by HP for $116 million, alongside the
              critical panning of Rabbit R1—highlights intense consumer skepticism and product failure rates. Founding
              teams routinely underestimate manufacturing tooling costs, supply chain bottlenecks, component yield
              losses, and quality control complexities at scale. Moreover, Hark has deliberately kept its physical
              device form factors undisclosed, describing only a planned family of devices for both individuals and the
              home that aims to be distinct from existing handsets, wearables, and smart glasses. This ambiguity
              conceals critical unanswered diligence questions regarding thermal envelope constraints, battery
              longevity, bill-of-materials costs, retail pricing, and carrier certification. In addition, founder Brett
              Adcock concurrently serves as chief executive officer of Figure AI, dividing leadership attention and
              technical bandwidth between scaling bipedal humanoid robotics and executing Hark's hardware-software
              product launches.
            claimRefs:
              - CR006
              - CR007
