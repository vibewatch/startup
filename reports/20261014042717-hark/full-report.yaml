      - number: '6.2'
        title: Product Launch and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Hark's transition from stealth to commercial availability accelerated rapidly throughout 2026. After
              operating in stealth for eight months and raising a 00 million Series A at a  billion valuation in May
              2026, the company quietly deployed version 1.0 of its native iOS mobile client on September 17, 2026 to a
              closed testing group before rolling out public web, iOS, and Android clients on October 6, 2026. To
              stimulate immediate adoption, founder Brett Adcock announced a promotional incentive offering a paid
              subscription free of charge to the first 100,000 sign-ups, though the exact duration and subscription tier
              were not publicly specified. Public usage metrics remain strictly qualitative; Hark's pricing page
              illustrates consumption allowances through whimsical lifestyle examples—such as completing 40 organic
              produce deliveries on the 0 tier or coordinating 50 weddings on the 00 tier—without publishing explicit
              token, API call, or cloud virtual machine compute quotas. As a result, genuine customer adoption velocity,
              active daily account counts, and repeat usage durability cannot be audited from public records alone.
            claimRefs:
              - CU002
              - CU003
