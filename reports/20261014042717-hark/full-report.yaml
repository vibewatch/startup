  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Structural decomposition of Hark's product architecture across interface orchestration, cloud virtualization,
      security governance, and physical hardware roadmap.
    data:
      layers:
        - label: 1. Client User Interface Layer
          detail: Full-screen proactive canvas combining text composer, proactive cards, and customizable panels widgets.
          modules:
            - Composer text prompt input
            - Proactive suggested action cards
            - Customizable Panels widgets
        - label: 2. Client Execution Viewport Layer
          detail: Real-time visual playback window displaying automated browser navigation to build user transparency.
          modules:
            - Live DOM execution stream
            - Interactive approval triggers
            - Task status indicator
        - label: 3. Agent Orchestration Layer (Handoff)
          detail: Proprietary computer-use model translating natural language instructions into multi-step browser actions.
          modules:
            - Visual DOM parsing engine
            - Cursor positioning and typing
            - Model Context Protocol bindings
        - label: 4. Cloud Virtualization & Browser Layer
          detail: >-
            Isolated virtual machines running dedicated file systems, terminals, and up to six concurrent browser
            sandboxes.
          modules:
            - Cloud virtual machines
            - Concurrent browser sessions
            - Cross-site task parallelization
        - label: 5. Identity, Credential & Memory Layer
          detail: Longitudinal context memory and encrypted credential vault with zero data retention partner agreements.
          modules:
            - Encrypted credential storage
            - Token injection mechanism
            - Longitudinal memory profile
        - label: 6. Physical Intelligence & Hardware Layer (Roadmap)
          detail: Planned 2027 AI-native hardware family and embodied physical intelligence synergies with Figure AI.
          modules:
            - AI-native personal devices
            - Ambient home hardware concepts
            - Figure AI training synergies
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end user journey across discovery, freemium onboarding, agent task delegation, paid tier expansion, and
      upcoming hardware integration.
    data:
      nodes:
        - id: j1
          label: 'Stage 1: Public Discovery and Awareness'
          detail: Consumers encounter Hark via founder announcements on X, tech press reviews, and mobile app store listings.
        - id: j2
          label: 'Stage 2: Freemium Account Provisioning'
          detail: Users sign up on web or mobile via Google or Apple accounts, entering the baseline free tier.
        - id: j3
          label: 'Stage 3: Personal Context Integration'
          detail: User connects email, calendar, and browser credentials, allowing Handoff to map user digital routines.
        - id: j4
          label: 'Stage 4: Autonomous Task Delegation'
          detail: >-
            Handoff agent navigates cloud browsers to execute web errands like food ordering while displaying a live
            execution window.
        - id: j5
          label: 'Stage 5: Paid Tier Conversion'
          detail: >-
            Frequent operators upgrade to Hark Pro² (0/mo) or Hark Pro³ (00/mo) to unlock higher monthly errand
            multipliers.
        - id: j6
          label: 'Stage 6: Hardware Ecosystem Expansion'
          detail: >-
            Planned 2027 personal and home hardware devices establish multi-surface lock-in beyond standard smartphone
            operating systems.
    approximationNotes: Journey stages synthesize public Hark Pro workflows, pricing tiers, and announced 2027 hardware roadmap.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU014
      - CU016
  - id: FR001
    title: Hark Enterprise Risk Severity vs. Likelihood Heatmap
    type: matrix
    summary: >-
      Matrix mapping Hark's primary operational, financial, regulatory, and technical risks across likelihood and impact
      dimensions.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: Near-Certain Likelihood
          values:
            - Routine software patch cycles
            - Ongoing consumer tier churn
            - Persistent compute GPU cash drain
            - Series A valuation down-round ceiling
        - label: High Likelihood
          values:
            - Minor user interface latency
            - Consumer software pricing compression
            - Post-money valuation overhang friction
            - Autonomous payment regulatory barriers (PSD2)
        - label: Moderate Likelihood
          values:
            - Minor third-party API deprecations
            - Cloud browser IP throttling
            - Dual-CEO leadership bandwidth stretch
            - EU AI Act High-Risk system compliance mandates
        - label: Medium Likelihood
          values:
            - Search provider indexing changes
            - Non-API scraping litigation threats
            - Extreme compute infrastructure burn
            - Hardware commercial failure / delivery delays
        - label: Low Likelihood
          values:
            - Routine employee attrition
            - Basic cloud host failover incidents
            - Loss of core Apple design leadership
            - Direct semiconductor partner conflict
        - label: Remote Likelihood
          values:
            - Minor DNS resolution outages
            - Ephemeral sandbox memory leaks
            - Catastrophic cloud credential breach
            - Total mobile OS ecosystem preemption
    approximationNotes: >-
      Risk placements represent analytical synthesis of verified Series A financial commitments, competitive dynamics,
      and historical AI hardware precedents.
    claimRefs:
