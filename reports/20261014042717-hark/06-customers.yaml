callouts:
- calloutType: risk
  title: Execution Latency and Trust Barriers in Autonomous Web Errands
  body: Early public demonstrations of Hark Pro illustrate that multi-step browser automation (such as ordering food via DoorDash) can take several minutes to complete, creating friction where users could perform the task faster manually. While the transparent execution window builds trust, sustained consumer willingness to pay 0 to 00 per month will require near-instantaneous execution speed and zero payment confirmation errors.
  claimRefs:
  - CU001
  - CU009
- calloutType: insight
  title: Freemium Data Flywheel Versus Hardware Commercialization
  body: Hark's distribution strategy mirrors consumer software land grabs by offering free tiers and initial sign-up promotions to amass conversational and workflow data. However, the ultimate commercial defense rests on hardware ecosystem lock-in planned for 2027, bridging personal digital agency into physical-world utility without relying on third-party mobile operating systems.
  claimRefs:
  - CU002
  - CU003
  - CU011
