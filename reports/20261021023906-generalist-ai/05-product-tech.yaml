      - ["GEN-1", "Industrial robotics teams and early-access partners", "Announced April 2, 2026; early access offered", "Real-time multimodal action system with company-reported reliability, speed, and improvisation", "No independent benchmark or named production deployment"]
      - ["GEN-1.5", "Robotics teams seeking rapid task teaching", "Listed by a specialist directory with an August 2026 release date", "Directory claims learning from 3-12 second demonstrations without code or fine-tuning", "No retained first-party release, evaluation protocol, or customer proof"]
      - ["Physical data engine", "Internal model-training organization", "Company says more than 500,000 hours of interaction data support GEN-1", "Wearable-derived human activity data reduces dependence on robot teleoperation for base pretraining", "Dataset composition, rights, quality controls, and leakage tests are undisclosed"]
    notes: "Statuses and performance are based on company material or attributed secondary descriptions; they do not establish general availability or production validation."
    claimRefs: [CE003, CE005, CE010, CE011, CE012]
  - id: TE002
    title: "Demonstrated workflow and use-case evidence"
    columns:
      - "User job"
      - "Demonstrated workflow"
      - "Company-reported evidence"
      - "Potential benefit"
      - "Limitation"
    rows:
      - ["Automotive kitting", "Pick and place parts over a long horizon", "One hour without intervention across 50 cycles", "Reduced intervention for repetitive mixed-part handling", "No independent observation or facility-level throughput baseline"]
      - ["T-shirt folding", "Manipulate deformable fabric", "86 consecutive folds without intervention", "Evidence of repeatability on a deformable object", "Selected task; garment variation and failure handling are undisclosed"]
      - ["Robot-vacuum servicing", "Handle and service a consumer device", "More than 200 repetitions; 99% reported success", "Potential service-work automation", "No customer deployment, safety record, or total-cycle-time disclosure"]
      - ["Box and phone packing", "Fold packaging and place a phone into a case", "12.1-second box fold and 15.5-second phone packing", "Company reports about 2.8x speed versus GEN-0 or cited prior systems", "Benchmark ownership, task boundaries, and economics are not independently verified"]
    notes: "All repetitions, success rates, and speeds are company-reported on selected tasks; benefits are analytical implications, not measured customer outcomes."
    claimRefs: [CE005, CE006, CE007, CE008]
  - id: TE003
    title: "Technology architecture, dependency, and risk matrix"
    columns:
      - "Layer or component"
      - "Disclosed role"
      - "Key dependency"
      - "Technical or operating risk"
    rows:
      - ["Wearable data collection", "Captures high-fidelity human physical interaction", "Distributed proprietary hardware and participant operations", "Rights, representativeness, calibration, and quality assurance are undisclosed"]
      - ["Base pretraining", "Learns from more than 500,000 hours of physical-interaction data without robot data", "Petabyte-scale data and distributed compute", "No external reproducibility, ablation, or compute-efficiency evidence"]
      - ["Task and embodiment adaptation", "Uses about one hour of robot data in disclosed results", "Access to target robot, task environment, and adaptation process", "Transfer cost and performance outside selected embodiments are unknown"]
      - ["Post-training and experience learning", "Raises task performance and speed", "Reinforcement-learning and multimodal-guidance pipeline", "Reward design and unsafe exploration controls are not public"]
      - ["Inference and harnessing", "Emits real-time actions and uses Harmonic Reasoning", "Low-latency compute, model harnesses, sensors, and robot controls", "Latency distribution, failover behavior, and hardware support matrix are undisclosed"]
      - ["Deployment control plane", "Would connect model behavior to workflow-specific constraints", "Monitoring, human override, rollback, and safety integration", "No public architecture, certification, service-level, or incident-response documentation"]
    notes: "The first five layers reflect company disclosures; the deployment-control row identifies the necessary but publicly undocumented operating boundary."
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE014]
figures:
  - id: FE001
    title: "Evidence-backed learning and deployment stack"
    type: "stack"
    summary: "The disclosed system moves from human-interaction data to robot adaptation and real-time action, while deployment controls remain an unverified boundary."
    data:
      layers:
        - label: "Physical interaction collection"
          detail: "Low-cost wearable devices capture humans performing physical activities."
          items: ["High-fidelity human interaction data", "Distributed collection hardware"]
        - label: "Foundation pretraining"
          detail: "The company reports more than 500,000 hours of data and no robot data in the base pretraining set."
          items: ["Multimodal architecture", "Petabyte-scale training infrastructure"]
        - label: "Post-training"
          detail: "Post-training techniques, reinforcement learning, and multimodal human guidance improve task behavior."
          items: ["Learning from experience", "Human guidance"]
        - label: "Robot and task adaptation"
          detail: "Disclosed results use approximately one hour of robot data to adapt to an embodiment and task."
          items: ["Target robot data", "Task-specific adaptation"]
        - label: "Real-time inference"
          detail: "The multimodal system emits actions in real time with model-harness and Harmonic Reasoning components."
          items: ["Action generation", "System-level harnessing"]
        - label: "Deployment controls"
          detail: "Monitoring, safety interlocks, human override, and rollback are required diligence items rather than disclosed capabilities."
          items: ["Workflow constraints", "Operational assurance gap"]
    approximationNotes: "The layer sequence is synthesized from disclosed components; it is not a company-published reference architecture, and the deployment-control layer is an explicit diligence gap."
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE010]
callouts:
  - calloutType: "strength"
    title: "Specific internal evaluation, not generic demo copy"
    body: >-
      Generalist publishes task definitions, repetition counts, comparative baselines, and
      speed measurements that can be tested in diligence; the evidence is still
      company-operated and should not be treated as independent validation.
    claimRefs: [CE005, CE006, CE007, CE015]
  - calloutType: "risk"
    title: "Control and production evidence trails the capability narrative"
    body: >-
      Public sources do not establish production fleet breadth, safety certification,
      security controls, support commitments, or incident handling, while the company
      acknowledges both task-specific limits and potential liability from improvisation.
    claimRefs: [CE008, CE009, CE016]
