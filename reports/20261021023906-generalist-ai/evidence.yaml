evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      Audited or management-supported revenue, ARR, pricing, gross margin, burn, runway, customer count, and cash
      balance.
    whyItMatters: Without these metrics, funding scale cannot be translated into commercial traction or financing durability.
    diligencePath: >-
      Request current management accounts, bank statements, revenue cohort schedules, customer contracts, and the
      board-approved operating plan.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board roster, observer rights, voting controls, preference stack, founder ownership, and succession
      plans.
    whyItMatters: Public investor participation does not reveal control, dilution, or resilience to loss of a founder.
    diligencePath: >-
      Review the charter, voting agreements, investor-rights agreement, capitalization table, board minutes, and
      key-person succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Standardized third-party benchmarking and named production deployments across multiple robot bodies with measured
      reliability and ROI.
    whyItMatters: >-
      Company-run task results do not establish generalization, safety, economics, or customer willingness to pay in
      production.
    diligencePath: >-
      Obtain customer references, deployment logs, incident reports, benchmark protocols, raw trial results, and an
      independent replication.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: company-profile
    missingEvidence: Company-confirmed legal headquarters and current full-time employee count.
    whyItMatters: Conflicting location labels and estimated headcount reduce precision in operating-footprint and hiring analysis.
    diligencePath: >-
      Confirm the legal entity address, office roster, payroll headcount, contractor count, and location breakdown with
      management.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A bottom-up count of compatible robots and workflows, model pricing, attach rate, and reachable geography.
    whyItMatters: >-
      Without these inputs, broad robotics forecasts cannot be converted into a defensible company-specific TAM, SAM, or
      SOM.
    diligencePath: >-
      Obtain management's sizing model and reconcile every input to customer contracts, installed-base data, and
      third-party industry statistics.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: deployment-traction
    missingEvidence: >-
      Named paid production deployments, deployment dates, robot types, task volumes, renewal status, and measured
      customer ROI.
    whyItMatters: Production evidence is required to distinguish market demand from internally demonstrated technical capability.
    diligencePath: Review customer contracts and references, then sample production telemetry and renewal or expansion records.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: pricing-and-economics
    missingEvidence: GEN-1 pricing, integration fees, inference costs, support obligations, gross margin, and customer payback periods.
    whyItMatters: Buyer budget ownership and switching economics cannot be validated without a disclosed commercial model.
    diligencePath: >-
      Request current price books, pilot statements of work, deployment cost build-ups, and cohort-level contribution
      margins.
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: Independent head-to-head tests across identical robots, tasks, safety conditions, and production tolerances.
    whyItMatters: Company-reported reliability and speed do not establish comparative performance or deployment safety.
    diligencePath: Commission a third-party benchmark using representative customer workflows and pre-agreed failure definitions.
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Executed customer contracts covering model portability, data ownership, exclusivity, termination rights, and
      migration assistance.
    whyItMatters: >-
      These terms determine whether hardware portability creates buyer freedom or merely shifts lock-in into the model
      and data layer.
    diligencePath: >-
      Review at least two customer agreements and interview customers that evaluated multiple robot-intelligence
      vendors.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      A controlled third-party benchmark comparing GEN-1 with peer models on identical hardware, tasks, failure classes,
      and intervention rules.
    whyItMatters: Vendor-selected success rates cannot establish relative reliability, safety, or operating cost.
    diligencePath: >-
      Commission a blinded evaluation with common hardware and publish trial counts, confidence intervals, failure
      severity, and intervention time.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP009
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current list or realized pricing, deployment fees, compute requirements, support terms, discounts, and
      gross-margin allocation.
    whyItMatters: >-
      Without contract economics, buyers cannot compare Generalist with internal build, conventional automation, or
      vertically integrated alternatives.
    diligencePath: >-
      Obtain anonymized proposals, invoices, and a fully burdened deployment model for at least two hardware
      configurations.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: private-evidence-only
    severity: material
    topic: production-deployment
    missingEvidence: >-
      Named production customers with operating hours, throughput, incident rates, human interventions, and measurable
      return on investment.
    whyItMatters: >-
      A technical data advantage becomes durable only if deployment creates recurring revenue and proprietary operating
      feedback.
    diligencePath: Conduct customer reference calls and reconcile deployment logs to invoiced production usage.
    relatedQuestionRefs:
      - QP002
      - QP005
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current price book, signed customer contracts, realized discounts, billing unit, renewal terms, and
      revenue-recognition policy for each commercial offer.
    whyItMatters: >-
      Without contract economics, diligence cannot distinguish recurring model revenue from unpaid pilots or
      service-heavy deployment work.
    diligencePath: >-
      Review a contract-level revenue export, a representative sample of executed agreements, invoices, deferred-revenue
      schedules, and the approved price book.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Customer-level revenue, compute and data costs, deployment labor, hardware pass-through, support expense, CAC,
      payback, and gross-margin cohorts.
    whyItMatters: >-
      The disclosed technical inputs imply cost intensity but do not establish whether deployments can produce
      software-like contribution margins.
    diligencePath: >-
      Reconcile the general ledger to deployment P&Ls and customer cohorts, including accelerator usage, labor hours,
      hardware ownership, and support obligations.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Bank-supported cash balance, monthly net burn, committed cloud spend, debt, working-capital needs, runway
      scenarios, and the next financing trigger.
    whyItMatters: >-
      Cumulative funding cannot be translated into current liquidity or runway without cash uses, timing, and
      contractual obligations.
    diligencePath: >-
      Obtain monthly cash statements, a 24-month operating plan, cloud and facility commitments, debt schedules, and
      base/downside financing scenarios.
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Independent customer references, paid production-deployment counts, utilization, retention, realized ROI, and a
      standardized third-party benchmark.
    whyItMatters: >-
      Company-generated task results do not prove customer willingness to pay, deployment durability, or economic value
      in production.
    diligencePath: >-
      Interview named paying customers, inspect deployment telemetry and renewal records, and commission a
      hardware-matched third-party benchmark.
  - type: missing-source
    severity: material
    topic: independent-benchmark-gap
    missingEvidence: >-
      A standardized third-party test of GEN-1 and successor models on identical robots, tasks, disturbances, and safety
      criteria.
    whyItMatters: >-
      Internal selected-task results cannot establish cross-embodiment reliability, generalization, or production
      readiness.
    diligencePath: >-
      Commission a witnessed benchmark against at least two relevant alternative policies using preregistered tasks and
      failure definitions.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: deployment-readiness
    missingEvidence: >-
      Named production deployments, hardware support matrix, integration documentation, service levels, support
      staffing, and field incident data.
    whyItMatters: >-
      Early access and laboratory repetitions do not show that customers can integrate, operate, and support the system
      economically.
    diligencePath: >-
      Review deployment contracts and architecture with two design partners and inspect fleet telemetry, interventions,
      uptime, and support tickets.
    relatedQuestionRefs:
      - QE001
      - QE006
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: trust-safety-security
    missingEvidence: >-
      Public or diligence-room evidence for safety cases, red-team testing, security controls, privacy and data
      governance, certifications, monitoring, rollback, and incident response.
    whyItMatters: >-
      Embodied model errors can create physical harm, and company-described improvisation increases the importance of
      explicit control boundaries.
    diligencePath: >-
      Request the safety case, threat model, control architecture, audit reports, incident register, data-rights
      documentation, and regulatory mapping.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A direct developer surface such as public API documentation, SDK repositories, release notes, package telemetry,
      or practitioner implementation discussions.
    whyItMatters: >-
      The retained specialist directory is only a practitioner-community proxy and does not reveal integration activity
      or ecosystem maturity.
    diligencePath: >-
      Request private API and SDK documentation, version history, integration metrics, and references from engineers
      implementing the system.
    relatedQuestionRefs:
      - QE006
  - type: conflicting-data
    severity: material
    topic: GEN-1.5
    missingEvidence: >-
      A first-party GEN-1.5 release, model card, evaluation protocol, and clarification of the relationship between
      demonstration-only learning and task adaptation.
    whyItMatters: >-
      A secondary product listing makes stronger adaptation claims than the retained first-party GEN-1 materials
      establish.
    diligencePath: >-
      Obtain the GEN-1.5 model card and reproduce its 3-12 second demonstration results on representative target
      hardware.
    relatedQuestionRefs:
      - QE002
      - QE006
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: GRR, NRR, churn, renewal rates, contract lengths, customer cohorts, satisfaction, and reasons for non-renewal.
    whyItMatters: Without cohort and contract evidence, technical progress cannot establish durable recurring demand.
    diligencePath: >-
      Review customer-level cohort schedules and executed agreements; reconcile beginning, renewal, churn, and expansion
      values to billing records.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
