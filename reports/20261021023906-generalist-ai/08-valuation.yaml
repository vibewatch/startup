    title: Recommendation logic
    type: flow
    summary: >-
      Observable financing and company-reported technical proof are filtered
      through independent-validation and private-economics gaps before reaching
      the track/research-more recommendation.
    data:
      nodes:
        - id: june-mark
          label: June financing reference
          detail: "$400M raised at an approximately $2B valuation, reported by multiple independent sources."
        - id: august-mark
          label: August reported extension
          detail: "~$200M at approximately $3B, explicitly pending primary verification."
        - id: technical-proof
          label: Company-reported GEN-1 proof
          detail: "Selected-task reliability and speed improved, with stated limitations."
        - id: benchmark-gap
          label: Independent benchmark gap
          detail: "No retained source independently reproduces the reported GEN-1 results."
        - id: deployment-gap
          label: Deployment proof gap
          detail: "Early access is disclosed, but named paying production customers are not."
        - id: economics-gap
          label: Economics and terms gap
          detail: "Revenue, pricing, burn, runway, ownership, and preference terms are undisclosed."
        - id: recommendation
          label: Track / research more
          detail: "Do not assign intrinsic value or target returns until the evidence gaps close."
      edges:
        - from: june-mark
          to: technical-proof
        - from: august-mark
          to: technical-proof
        - from: technical-proof
          to: benchmark-gap
        - from: benchmark-gap
          to: deployment-gap
        - from: deployment-gap
          to: economics-gap
        - from: economics-gap
          to: recommendation
    approximationNotes: >-
      Dollar amounts are reported transaction references; the diagram does not
      imply a probability, conversion rate, or value-proportional scale.
    claimRefs:
