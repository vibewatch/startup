company:
  name: Generalist AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Generalist AI's June 2026 financing provides a multi-source reference of
    $400 million raised at an approximately $2 billion valuation, while an
    August extension at roughly $3 billion remains secondary-reported and
    explicitly unconfirmed by a primary announcement. The appropriate stance
    is track/research more: product evidence is company-reported, commercial
    and unit-economic disclosures are absent from the retained source set, and
    no supportable target-return model can yet be built.
sections:
  - id: recommendation-and-evidence-boundary
    title: Recommendation and evidence boundary
    body: >-
      The recommendation is to track Generalist AI and require substantially
      more diligence before underwriting an entry price. Multiple independent
      sources report the June 2026 $400 million financing at an approximately
      $2 billion valuation, but the later roughly $200 million extension at an
      approximately $3 billion valuation appears only in secondary coverage
      that itself calls for primary verification. Product progress is
      directionally encouraging: Generalist reports materially higher
      reliability and speed for selected GEN-1 tasks. Those results are not an
      independent production benchmark, however, and the company also states
      that not every attempted task reaches the reported reliability level.
      This evidence mix supports a high-risk, low-confidence valuation view
      rather than a company-quality verdict or a precise fair-value estimate.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV010
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The June mark is the strongest observable financing anchor; the August
      mark should be treated as a reported signal, not a verified current
      valuation. Funding is intended for the physical-data engine, compute,
      real-world testing, and commercial deployment, all of which are
      capital-intensive activities. The retained evidence does not disclose
      revenue or ARR, pricing or paying-customer count, or burn, runway, debt,
      liquidation preferences, and other cap-table terms. As a result,
      funding raised cannot be treated as cash available, and a round valuation
      cannot be translated into ownership economics or return potential.
      Entry discipline should therefore be conditional on primary financing
      documents, fully diluted capitalization, preference terms, cash balance,
      committed spend, and a bottom-up operating plan rather than on the
      headline valuation alone.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV012
      - CV013
      - CV014
      - CV016
    tableRefs:
      - TV002
  - id: scenario-framework
    title: Evidence-bounded bull, base, and bear cases
    body: >-
      Scenario analysis must remain relational because the public record does
      not support an intrinsic valuation. A bull case requires independent
      replication of GEN-1 performance, production deployments across more
      than one hardware platform, and economics capable of supporting a value
      above the reported August mark. The base case treats the approximately
      $2 billion June mark and the unconfirmed approximately $3 billion August
      mark as a financing-reference band, not as fair value. The bear case is
      a re-rating below the June reference if deployment evidence stalls,
      reliability fails outside selected tasks, or capital consumption proves
      structurally high. Reported valuations for Physical Intelligence and
      Figure AI provide category context only; their different strategies and
      unnormalized secondary figures are not independent performance
      benchmarks or directly comparable transaction multiples.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV010
      - CV011
      - CV015
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence
    title: Exit readiness, decision triggers, and diligence asks
    body: >-
      Public exit readiness is limited. Generalist announced early-access
      availability, while independent coverage warns that demonstrations
      should not be confused with OEM deployment contracts. No retained source
      identifies paying customers, recurring revenue, pricing, or audited
      economics. A favorable decision would require independently measured
      production reliability and throughput, signed customer evidence,
      deployment-level gross-margin and support-cost data, and financing terms
      that preserve a plausible target return after dilution. Thesis-break
      triggers include failure to reproduce the selected-task results in
      customer environments, dependence on repeated large raises without
      commercial milestones, or a price above the reported financing marks
      without corresponding revenue and deployment evidence. The immediate
      diligence path is a technical benchmark, customer-reference calls,
      model-level operating data, and a complete capitalization and liquidity
      package.
    claimRefs:
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - June financing is corroborated, but the later valuation is secondary-reported and operating economics are undisclosed.
        - Do not underwrite an entry until primary financing, customer, and unit-economic evidence is available.
      - - Confidence
        - Low
        - Product metrics are company-reported and the retained sources provide no independent production benchmark.
        - Size exposure, if any, as an option on verification rather than as a validated scale thesis.
      - - Risk rating
        - High
        - Selected-task performance does not establish cross-task production reliability, and capital requirements appear substantial.
        - Require milestone-based financing and technical acceptance criteria.
      - - Valuation stance
        - Unsupported / price-sensitive
        - Approximately $2B is the strongest financing reference; approximately $3B is reported but not primary-confirmed.
        - Treat both as transaction references, not intrinsic fair value.
      - - Return view
        - Not supportable from public evidence
        - Revenue, pricing, burn, runway, ownership, dilution, preferences, and exit timing are not disclosed.
        - Obtain the capitalization and operating model before setting a target return or hold period.
    notes: >-
      Assessments distinguish reported financing marks from intrinsic value;
      no revenue, cash-burn, ownership, or return figures are estimated.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - A hardware-agnostic intelligence layer could capture value across multiple robot platforms.
        - Generalist reports GEN-1 selected-task reliability materially above its prior model and early-access availability.
        - Independent deployments across multiple hardware platforms with repeatable customer economics.
      - - Thesis
        - A proprietary physical-interaction dataset may improve task adaptation and data efficiency.
        - Generalist reports more than 500,000 hours of physical-interaction data and approximately one hour of robot data for selected task adaptation.
        - Third-party replication showing transfer, cost, and performance advantages against matched baselines.
      - - Anti-thesis
        - Laboratory or selected-task success may not generalize to production environments.
        - The company says not every attempted task reaches 99%+, while independent coverage calls the headline result an internal benchmark.
        - Customer-site results with incident rates, intervention frequency, uptime, and throughput over sustained periods.
      - - Anti-thesis
        - Capital intensity may outrun commercialization and increase dilution risk.
        - Funding is directed toward data infrastructure, compute, testing, and deployment, but revenue, burn, runway, and preferences are not public.
        - Audited financials, contracted revenue, a fully diluted cap table, and a milestone-linked financing plan.
    notes: >-
      Company product claims are labeled as such; independent sources provide
      context and caveats but do not independently reproduce GEN-1 results.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Evidence-bounded assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Independent GEN-1 replication, multiple production customers, cross-hardware deployment, and disclosed software-like economics.
        - A value above the reported ~$3B August mark is conceivable only after these milestones; no intrinsic range is supportable today.
        - Directionally improves only when third-party deployment and economic evidence appears; no numeric probability assigned.
        - Independent results fail to reproduce selected-task reliability or customers do not convert from early access.
      - - Base
        - Technical promise continues, but commercial proof and operating economics remain limited.
        - The ~$2B June mark to reported ~$3B August mark is a financing-reference band, not a fair-value estimate or target-return range.
        - Current evidence best fits this case because financing is visible while customer and financial evidence is not.
        - Another major financing is required before disclosed production or revenue milestones.
      - - Bear
        - Performance does not generalize, deployment remains bespoke, or capital consumption stays structurally high.
        - Re-rating below the ~$2B June reference is plausible, but the public evidence cannot quantify a floor or loss distribution.
        - Becomes more likely with missed deployment milestones, adverse benchmark results, or unfavorable financing terms.
        - Reliability, safety, customer ROI, or liquidity evidence fails investment-committee thresholds.
    notes: >-
      Scenario bounds are directional references to reported financing marks,
      not probability-weighted intrinsic values; probabilities and target
      returns remain unquantified because required private inputs are absent.
    claimRefs:
