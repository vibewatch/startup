  topStrengths:
    - >-
      A hardware-agnostic embodied-model thesis addresses a broad range of robot platforms rather than tying the company
      to one body.
    - >-
      The founding team brings reported frontier-model and robotics experience from DeepMind, OpenAI, and Boston
      Dynamics.
    - >-
      More than $500 million of reported cumulative financing provides capacity to invest in physical data, compute,
      testing, and deployment.
  topRisks:
    - >-
      Selected-task company benchmarks have not been independently reproduced across sustained production environments,
      tasks, and robot bodies.
    - Revenue, pricing, named paying customers, gross margin, burn, and runway remain undisclosed.
    - >-
      Public evidence does not establish third-party safety certification, incident controls, data rights, insurance, or
      liability allocation.
    - >-
      Data collection, training infrastructure, hardware integration, and field support may create material capital
      intensity and dilution risk.
    - >-
      A roughly $2 billion confirmed financing reference is difficult to underwrite without customer economics or a
      supportable return model.
  unresolvedGaps:
