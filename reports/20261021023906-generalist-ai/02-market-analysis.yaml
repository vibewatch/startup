figures:
  - id: FM001
    title: Evidence narrowing from robotics growth to obtainable market
    type: pyramid
    summary: >-
      Broad category growth narrows to a cross-embodiment software wedge and then to validated
      tasks, while a company-specific obtainable market remains unquantified.
    data:
      items:
        - label: Broad humanoid adjacency
          value: "$38B by 2035"
          detail: Second-hand projection that includes hardware and is not a Generalist TAM.
        - label: AI-in-robotics growth context
          value: "Above 30% CAGR through 2033"
          detail: Broad forecast with no retained starting value or software-layer allocation.
        - label: Service-robot demand proxy
          value: "Above 70% growth in 2025"
          detail: Secondary category signal with an unspecified denominator.
        - label: Cross-embodiment software wedge
          value: Hardware-agnostic intelligence
          detail: Generalist's core proposition excludes the robot body and manufacturing stack.
        - label: Demonstrated task beachhead
          value: Six disclosed workflows
          detail: Kitting, folding, packing, and servicing examples define the near-term evidence base.
        - label: Company-specific SAM and SOM
          value: Not publicly established
          detail: Requires pricing, compatible installed base, deployment evidence, and win-rate data.
    approximationNotes: "Layers show progressive evidence narrowing only; widths are not proportional, and the cited market proxies must not be summed."
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: insight
    title: Fund the layer, not the entire robot
    body: >-
      Generalist's market thesis depends on capturing software-like value across multiple robot
      bodies without absorbing the manufacturing economics of those bodies.
    claimRefs: [CM001, CM014]
  - calloutType: risk
    title: Category growth is not company demand
    body: >-
      Broad robotics forecasts and large financing rounds do not establish Generalist's price,
      eligible installed base, paid deployments, or obtainable revenue.
    claimRefs: [CM010, CM011, CM012, CM013, CM016]
