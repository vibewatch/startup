company:
  name: Generalist AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Generalist AI has substantial reported financing and a clearly capital-intensive
    data-and-compute program, but the reviewed public record does not disclose revenue,
    pricing, gross margin, burn, cash, or runway. The underwriting case therefore rests
    on technical progress and financing capacity rather than demonstrated revenue quality
    or unit economics.
sections:
  - id: revenue-model-and-gtm
    title: Revenue model and go-to-market remain unpriced
    body: >-
      Generalist AI positions GEN-1 and GEN-1.5 as hardware-agnostic robot foundation
      models, but none of the eight allocated sources discloses a list price, realized
      contract value, revenue, ARR, or recognized revenue stream. The clearest commercial
      signal is the company's April statement that early-access partners could begin
      using GEN-1 and should contact its partnerships team. That supports an enterprise,
      partner-led motion rather than self-serve software, but it does not establish
      whether monetization will be a model license, usage fee, deployment project,
      fine-tuning service, or revenue share. Public materials also omit paying-customer
      counts, contract terms, sales-cycle duration, channel economics, and production
      deployment volume. Consequently, each plausible stream below is a diligence
      hypothesis or unavailable field, not recorded revenue.
    claimRefs: [CI004, CI005, CI006, CI016]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: The disclosed operating model is compute- and data-intensive
    body: >-
      The public cost signals are much stronger than the revenue signals. Generalist says
      GEN-1 used more than 500,000 hours of physical-interaction data and required
      distributed training infrastructure capable of handling petabytes, while GEN-1.5
      trained continuously for more than eight months. A third-party description of
      embodied deployments also highlights robot hardware, cell integration, safety
      review, insurance, and maintenance as costs that do not exist in an API-only
      rollout. These disclosures indicate substantial fixed research infrastructure and
      potentially meaningful deployment support costs, but they provide no dollar cost,
      utilization, inference-cost, service-labor, capex, working-capital, or gross-margin
      data. The company-reported reliability and speed improvements may eventually support
      customer ROI, yet they cannot be converted into pricing power or margin without
      deployment-level economics.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Financing capacity is visible; runway is not
    body: >-
      Multiple independent pages report a $400 million June 2026 financing at an
      approximately $2 billion valuation, taking total capital raised above $500 million.
      A separate August report describes an additional roughly $200 million led by 8VC at
      about a $3 billion valuation, but explicitly notes the absence of a broad company
      announcement, so that extension should remain provisional until primary documents
      are reviewed. Reported uses of the June proceeds include the physical data engine,
      cloud compute, real-world testing, model development, and commercial deployments.
      Those uses align with the disclosed technical cost base, but funding raised is not
      cash available. No source provides cash on hand, monthly burn, debt, project-finance
      obligations, runway, planned allocation by year, or a next-round trigger.
    claimRefs: [CI001, CI002, CI003, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The financial profile is best treated as well-financed research-stage execution
      rather than a demonstrated software business. Reported financing appears large
      relative to a robotics directory's undated estimate of roughly 50 employees, but
      headcount alone cannot establish burn because compute, data collection, robot
      hardware, and deployment support may dominate expenses. Revenue quality is
      unassessable: there is no evidence of recurring contracts, customer concentration,
      renewal behavior, or revenue recognition. Margin progression is likewise
      unmodellable without inference cost, service content, support obligations, and
      hardware pass-through terms. The strongest public proof is technical and
      company-generated; one independent analysis explicitly flags the 99% result as an
      internal benchmark rather than an independent standard. Investment underwriting
      should require a cash bridge, customer-level cohort economics, and deployment P&Ls
      before assigning a revenue multiple or a durable gross-margin path.
    claimRefs: [CI004, CI005, CI007, CI009, CI010, CI012, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism, Unit, Current value or status, Revenue quality, Diligence ask]
    rows:
      - [Foundation-model access, "Enterprise access to GEN-1 or GEN-1.5", null, "Early access disclosed; monetization not disclosed", "No public revenue evidence", "Provide signed contracts, billing unit, recognized revenue, and renewal terms"]
      - [Task adaptation, "Physical prompting or fine-tuning for customer tasks", null, "Technical capability demonstrated; commercial packaging unavailable", "Potentially service-heavy", "Separate setup fees, recurring fees, compute, and labor per deployment"]
      - [Deployment integration, "Integration into customer robot fleets and workflows", null, "Commercial deployments named as a use of funds; volume unavailable", "Unknown mix of software and services", "Provide deployment SOWs, acceptance criteria, and contribution margin"]
      - [Support and maintenance, "Ongoing model, safety, and fleet support", null, "Not publicly described", "Unknown recurring content", "Disclose support SLAs, staffing ratios, warranty exposure, and attach rate"]
      - [Hardware-independent licensing, "License one intelligence layer across robot types", null, "Strategic positioning only", "Potentially scalable but unproven", "Show price architecture, hardware portability, and revenue recognized per robot or site"]
    notes: >-
      Partial public-coverage table: null means no commercial unit was disclosed, and the
      listed mechanisms are diligence hypotheses unless the status column says otherwise.
    claimRefs: [CI004, CI005, CI006, CI013, CI014, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns: [Offer or contract element, List price, Realized price, Discounts or unknowns, Source-backed conclusion]
    rows:
      - [GEN-1 early access, null, null, "Eligibility, term, and payment status unavailable", "Partner access was announced without pricing"]
      - [GEN-1.5 model access, null, null, "No public packaging or contract model", "Research release does not establish a commercial SKU"]
      - [Task-specific adaptation, null, null, "No fee per demonstration, task, or training step", "Lower adaptation effort is a technical result, not a disclosed price"]
      - [Deployment and support, null, null, "No integration, support, or hardware pass-through terms", "Realized gross margin cannot be derived"]
    notes: >-
      All price cells are null because the assigned public sources disclose neither list
      nor realized pricing; null must not be interpreted as free access or zero revenue.
    claimRefs: [CI004, CI006, CI012, CI013]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Public value or proxy, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue or ARR, null, Low, "Sets the scale for any revenue multiple", "Provide monthly revenue by stream, ARR bridge, and recognition policy"]
      - [Gross margin, null, Low, "Tests whether the intelligence layer can earn software-like margins", "Provide deployment-level revenue, compute, hardware, labor, and support COGS"]
      - [CAC and payback, null, Low, "Measures the efficiency of the partner-led enterprise motion", "Provide sales-cycle length, fully loaded CAC, ACV, and payback by cohort"]
      - [Training-cost proxy, "More than eight months of continuous GEN-1.5 pretraining; dollar cost unavailable", Medium, "Signals material compute duration but not cash expense", "Provide accelerator hours, cloud commitments, data-collection spend, and capitalization policy"]
      - [Deployment-cost proxy, "Robot, integration, safety, insurance, and maintenance inputs; company-specific amounts unavailable", Low, "Determines service intensity and contribution margin", "Provide site-level implementation hours, hardware ownership, support load, and incident cost"]
      - [Cash burn and runway, null, Low, "Determines when another financing may be required", "Provide cash balance, monthly net burn, debt, committed cloud spend, and base/downside runway"]
    notes: >-
      Public values are directional operating proxies, not accounting measures; every null
      indicates that the metric is unavailable in the assigned evidence rather than zero.
    claimRefs: [CI004, CI007, CI008, CI009, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes the technical path from physical data to early access, but
      the conversion from deployment activity to revenue and gross profit is undisclosed.
    data:
      nodes:
        - id: physical-data
          label: Physical interaction data
          detail: "Company reports more than 500,000 hours for GEN-1 pretraining."
        - id: pretraining
          label: Pretraining engine
          detail: "Petabyte-scale infrastructure and prolonged compute are disclosed, but cost is not."
        - id: foundation-model
          label: GEN-1 / GEN-1.5
          detail: "Company-generated technical results support capability, not a financial metric."
        - id: task-adaptation
          label: Customer task adaptation
          detail: "Physical prompts or limited fine-tuning may reduce adaptation effort."
        - id: early-access
          label: Early-access deployment
          detail: "Partner access is disclosed; paid status and deployment volume are not."
        - id: revenue-and-gross-profit
          label: Revenue and gross profit
          detail: "Pricing, recognized revenue, COGS, and gross margin remain unavailable."
    approximationNotes: >-
      Conceptual sequence only; it contains no inferred conversion rate, revenue amount, or
      margin and does not imply that every early-access deployment is paid.
    claimRefs: [CI006, CI007, CI008, CI009]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      More than $500 million of reported cumulative funding does not establish current cash
      availability because burn, cloud commitments, debt, deployment costs, and timing of
      proceeds are undisclosed.
    claimRefs: [CI002, CI004, CI014]
  - calloutType: recommendation
    title: Gate valuation work on private financial evidence
    body: >-
      Require bank-supported cash, monthly burn, contract-level revenue, deployment COGS,
      and customer cohort data before applying a revenue multiple or underwriting a
      software-like gross-margin path.
    claimRefs: [CI004, CI005, CI013, CI016]
