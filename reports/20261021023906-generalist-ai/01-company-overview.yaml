      diligencePath: Request current management accounts, bank statements, revenue cohort schedules, customer contracts, and the board-approved operating plan.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: governance
      missingEvidence: Complete board roster, observer rights, voting controls, preference stack, founder ownership, and succession plans.
      whyItMatters: Public investor participation does not reveal control, dilution, or resilience to loss of a founder.
      diligencePath: Review the charter, voting agreements, investor-rights agreement, capitalization table, board minutes, and key-person succession plan.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: Standardized third-party benchmarking and named production deployments across multiple robot bodies with measured reliability and ROI.
      whyItMatters: Company-run task results do not establish generalization, safety, economics, or customer willingness to pay in production.
      diligencePath: Obtain customer references, deployment logs, incident reports, benchmark protocols, raw trial results, and an independent replication.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: minor
      topic: company-profile
      missingEvidence: Company-confirmed legal headquarters and current full-time employee count.
      whyItMatters: Conflicting location labels and estimated headcount reduce precision in operating-footprint and hiring analysis.
      diligencePath: Confirm the legal entity address, office roster, payroll headcount, contractor count, and location breakdown with management.
      relatedQuestionRefs: [QO002, QO007]
      relatedTableRefs: [TO001, TO002]
