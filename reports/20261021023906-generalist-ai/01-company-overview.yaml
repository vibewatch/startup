callouts:
  - calloutType: strength
    title: Capital and founder coverage
    body: >-
      More than $500 million of reported funding and a founder team spanning
      frontier models and deployed robotics provide resources and functional
      coverage for an unusually capital-intensive technical program.
    claimRefs: [CO006, CO007, CO011, CO013]
  - calloutType: risk
    title: Proof remains company-led
    body: >-
      Public evidence does not yet connect the reported model results to named
      paying customers, heterogeneous production deployments, or a standardized
      independent benchmark.
    claimRefs: [CO010, CO016]
