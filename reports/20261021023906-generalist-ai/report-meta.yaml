companyProfile:
  summary: >-
    Founded in 2024, Generalist AI is a private embodied-AI company developing foundation models intended to transfer
    across robot bodies and physical tasks. The founding team combines reported experience from DeepMind, OpenAI, and
    Boston Dynamics. Public evidence supports a June 2026 $400 million financing at an approximately $2 billion
    valuation and more than $500 million of cumulative capital, but it does not establish paying customers, revenue,
    production-scale deployments, or independently benchmarked reliability.
