figures:
  - id: "FR001"
    title: "Residual risk heatmap"
    type: "matrix"
    summary: >-
      Directional residual-risk view based on public evidence, with unknowns retained as
      diligence gaps rather than converted into numerical probabilities.
    data:
      columns:
        - id: "likelihood"
          label: "Likelihood"
          detail: "Qualitative evidence-based assessment, not a measured probability."
        - id: "impact"
          label: "Impact"
          detail: "Potential investment impact if the risk materializes."
        - id: "mitigation"
          label: "Public mitigation maturity"
          detail: "Maturity visible in assigned public evidence."
      rows:
        - id: "deployment-reliability"
          label: "Cross-task deployment reliability"
          note: "Selected-task GEN-1 results coexist with acknowledged limitations and lower GEN-1.5 one-shot averages."
          values:
            - value: "Medium-high"
              detail: "Evidence shows uneven results across task and adaptation modes."
            - value: "Critical"
              detail: "Reliability failure can block production deployment."
            - value: "Early"
              detail: "Independent standardized production evidence is absent."
        - id: "embodied-safety"
          label: "Embodied safety and alignment"
          note: "The company acknowledges that emergent physical actions can be liabilities."
          values:
            - value: "Medium"
              detail: "Capability creates exposure, but no incident is established here."
            - value: "Critical"
              detail: "Unsafe action can cause physical harm or operational loss."
            - value: "Early"
              detail: "The public evidence states an aim to improve alignment, not a complete control system."
        - id: "infrastructure"
          label: "Training and inference infrastructure"
          note: "Petabyte-scale data and real-time inference require substantial engineering and compute."
          values:
            - value: "Medium"
              detail: "Complexity is disclosed; outage and cost histories are not."
            - value: "High"
              detail: "Capacity or economics can slow model and deployment cadence."
            - value: "Developing"
              detail: "Custom infrastructure work is disclosed without service-level evidence."
        - id: "hardware-partners"
          label: "Hardware and partner dependency"
          note: "Elite's cobot supported data collection and validation in the named collaboration."
          values:
            - value: "Medium"
              detail: "A dependency is demonstrated, while total concentration is unknown."
            - value: "High"
              detail: "Hardware compatibility or support failure can delay deployment."
            - value: "Developing"
              detail: "Global support is partner-claimed; redundancy is not shown."
        - id: "regulatory-data-rights"
          label: "Regulatory and data-rights readiness"
          note: "Certification, approval, privacy, and data-rights evidence is not present in the assigned pool."
          values:
            - value: "Unknown"
              detail: "No violation or enforcement event is inferred from missing evidence."
            - value: "High"
              detail: "A control or rights defect could stop a deployment."
            - value: "Not established"
              detail: "Requires direct documentary diligence."
        - id: "capital-runway"
          label: "Capital efficiency and runway"
          note: "Funding announcements do not disclose cash available, burn, runway, or gross margin."
          values:
            - value: "Unknown"
              detail: "No operating cash-flow evidence is available in the assigned pool."
            - value: "High"
              detail: "Data, compute, hardware, and testing needs can be capital intensive."
            - value: "Not established"
              detail: "Budget, commitments, and board-approved runway plan are required."
    approximationNotes: >-
      Qualitative cells synthesize cited evidence and explicit gaps; they are not
      quantitative probabilities, incident rates, or independent benchmark scores.
