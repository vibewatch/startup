company:
  name: "Generalist AI"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Generalist AI's principal disclosed risk is the gap between strong, selected-task
    demonstrations and repeatable production performance across tasks, bodies, and
    environments. The company acknowledges uneven task performance and the physical
    consequences of emergent behavior, while public evidence remains incomplete on
    certification, legal controls, burn, runway, customer concentration, and
    independently standardized benchmarks.
sections:
  - id: "ranked-risk-view"
    title: "Ranked risk view"
    body: >-
      Deployment reliability is the highest residual risk because Generalist reports
      99% success on selected GEN-1 tasks, yet also says not every attempted task
      reaches that level and that some applications require still higher reliability
      or speed. GEN-1.5 sharpens the distinction: its company-reported one-shot average
      was 59% with a 10-point standard deviation, versus 83% after limited fine-tuning,
      and the company calls the tested tasks simple and short-horizon. The next tier is
      embodied-safety and alignment risk, followed by infrastructure, partner, and
      financing dependencies. These rankings are directional judgments from disclosed
      evidence, not incident frequencies or quantified loss estimates.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR012"
      - "CR014"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-safety"
    title: "Regulatory, legal, and embodied-safety exposure"
    body: >-
      The strongest public warning comes from Generalist itself: emergent robot actions
      have real-world consequences, task success is user-specific, and improvisation
      can be a liability as well as a strength. That admission supports a high-impact
      safety risk, but it does not establish that an accident, enforcement action, or
      legal breach has occurred. None of the assigned sources establishes third-party
      safety certification, jurisdiction-specific approval status, privacy controls,
      insurance coverage, incident reporting, or ownership rights for collected
      physical-interaction data. Those items therefore remain diligence gaps rather
      than negative factual findings. The investment case should require auditable
      controls before broad production use.
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR012"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-model-and-quality"
    title: "Operational, model, and quality risk"
    body: >-
      Generalist's reported results indicate progress but are not yet a substitute for
      heterogeneous, third-party production testing. GEN-1's 99% figures apply to
      selected demonstrations, while GEN-1.5's lower one-shot average and the company's
      description of in-context skills as more brittle show that rapid adaptation and
      robust deployment are different claims. The operating burden is also substantial:
      Generalist describes infrastructure for petabytes of interaction data, custom
      kernels, real-time inference work, and thousands of robot hands. Monitor success
      rates by task and embodiment, intervention frequency, near misses, cycle time,
      drift after adaptation, and recovery behavior under out-of-distribution events.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "partners-capital-and-execution"
    title: "Partner, capital, and execution dependencies"
    body: >-
      Elite Robots says its cobot platform supported Generalist's real-world data
      collection and algorithm validation, illustrating that model progress still
      depends on external hardware, controls, maintenance, and field support. A separate
      account says new financing is intended for the physical data engine, cloud
      compute, and real-world testing, which makes infrastructure execution a continuing
      dependency even after a large round. Funding raised is not cash availability:
      the assigned evidence does not disclose burn, runway, committed compute spend,
      margin, insurance cost, customer concentration, or contractual allocation of
      liability. The small-team profile also warrants key-person and hiring diligence,
      but its approximate headcount should not be treated as audited.
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "mitigations-and-kill-criteria"
    title: "Mitigations, monitoring, and thesis-break triggers"
    body: >-
      Mitigation maturity cannot be rated above early without a safety case, independent
      benchmark protocol, incident log, deployment-level service data, and contractual
      evidence. Near-term mitigations should include bounded operating domains, human
      override, pre-deployment hazard analysis, per-task acceptance thresholds, hardware
      qualification, staged rollouts, and explicit responsibility across Generalist,
      robot vendors, and customers. Thesis-break triggers are measurable: repeated
      failure to reproduce disclosed performance on independent hardware; a material
      safety incident without transparent remediation; inability to document required
      approvals or data rights; dependence on one hardware or compute provider without
      continuity plans; or financing consumption that leaves less than an agreed runway
      before commercial proof.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR007"
      - "CR009"
      - "CR010"
      - "CR012"
      - "CR015"
      - "CR016"
