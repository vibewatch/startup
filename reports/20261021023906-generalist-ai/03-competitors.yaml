company:
  name: Generalist AI
chapter:
  number: 3
  title: Competitors
  summary: >-
    Generalist AI is pursuing the horizontal robot-intelligence layer, placing it against
    Physical Intelligence and Skild AI directly, incumbent AI and robotics platforms
    indirectly, and vertically integrated robot makers or conventional automation as buyer
    substitutes. Its claimed cross-embodiment data engine is differentiated, but public pricing,
    named production deployments, and independent benchmark replication remain unavailable.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Generalist AI is best analyzed as a horizontal intelligence supplier rather than as a
      humanoid manufacturer. The retained evidence identifies Physical Intelligence as the
      closest horizontal peer, with Skild AI and FieldAI competing through broader robot brains
      or field autonomy. Google DeepMind and NVIDIA are incumbent threats because they can pair
      models with compute, simulation, developer tooling, and existing distribution. Figure AI
      and Tesla represent the vertically integrated alternative: they can co-optimize body and
      brain, while Generalist must make one model work across heterogeneous hardware. Buyers can
      also retain conventional task-specific automation or build a proprietary control stack.
      Those substitutes sacrifice some promised generality but preserve control, known safety
      envelopes, or existing integration investments.
    claimRefs: [CP001, CP009, CP010, CP011, CP012]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-differentiation
    title: Capability differentiation and proof quality
    body: >-
      Generalist's strongest claimed differentiation is the combination of cross-embodiment
      transfer, a large proprietary physical-interaction corpus, and fast task adaptation. Its
      April 2026 GEN-1 release reports an average 99% success rate on selected tasks versus 64%
      for GEN-0, alongside roughly three-times-faster execution on cited examples and about one
      hour of robot data per task. These are meaningful product hypotheses, not independent
      benchmarks. Generalist itself says some attempted tasks did not reach the headline success
      rates and that some applications require still higher reliability or speed. The absence of
      common third-party trials makes capability rankings directional; it also prevents a buyer
      from converting a research result into a deployment-grade failure-rate comparison.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP016]
    tableRefs: [TP002]
  - id: packaging-and-distribution
    title: Packaging, pricing, and distribution power
    body: >-
      The available commercial surface is early access rather than a standardized product
      catalog. Generalist invited early-access partners to contact it when GEN-1 launched, while
      a directory still characterized the company as pre-commercial with no public product or
      API. A later third-party account describes two possible delivery routes: Generalist can
      provide a model-plus-hardware package, or a robotics-capable customer can run the model on
      its own arm. That flexibility could widen distribution, but there is no public price list
      or settled billing model in the retained evidence. The company's more than $500 million
      reported total funding raised supports continued model and integration work; it is not
      revenue, ARR, cash available, or evidence of repeatable customer economics.
    claimRefs: [CP007, CP008, CP013, CP014, CP015]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      Generalist's potential moat is its physical-data flywheel: a model trained on more than
      half a million hours of company-reported interaction data may adapt across bodies and tasks
      without rebuilding every policy from scratch. Durability depends on converting that corpus
      into independently verified reliability and deployments that return proprietary operating
      data. The same horizontal posture creates exposure. Robot OEMs may vertically integrate,
      incumbents may bundle models with compute and simulation, and customers may prefer internal
      control where safety certification or data rights dominate. With no independent replication
      in the retained pool, the present advantage is best treated as a well-financed technical
      lead hypothesis rather than proven lock-in. Switching costs, data ownership, multi-homing,
      and partner exclusivity remain diligence items.
    claimRefs: [CP001, CP005, CP006, CP010, CP011, CP016]
tables:
