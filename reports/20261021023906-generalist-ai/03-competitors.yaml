    title: Competitor and substitute profile
    columns:
      - Competitor or alternative
      - Category
      - Scale or funding signal
      - Target and product scope
      - Differentiation
      - Evidence limitation
    rows:
      - [Generalist AI, "Horizontal robot-intelligence layer", "More than $500M total funding raised, third-party reported", "Dexterous manipulation across robot embodiments", "Proprietary physical-data engine and cross-embodiment model", "No public pricing, named production fleet, or independent benchmark in retained sources"]
      - [Physical Intelligence, "Direct horizontal peer", "About $1B cumulative funding reported by one retained article", "General-purpose policies across robots and tasks", "Public model lineage and broad generalist-policy thesis", "Comparative performance is not established by a common retained benchmark"]
      - [Skild AI, "Direct / adjacent robot-brain peer", "About $2B cumulative funding reported by one retained article", "Mobility and manipulation across multiple robot types", "Commercial channels and OEM or factory deployment emphasis", "Deployment and funding figures are not corroborated by a second retained source"]
      - [FieldAI, "Adjacent autonomy platform", "About $300M cumulative funding reported by one retained article", "Unknown or hazardous field environments", "Mobility and field adaptation rather than tabletop dexterity", "Not an apples-to-apples manipulation benchmark"]
      - ["Google DeepMind / NVIDIA", "Incumbent platform threats", "Large incumbent resources; no comparable standalone funding figure", "Models plus compute, simulation, tooling, or edge infrastructure", "Distribution and ecosystem breadth", "Retained evidence does not compare products on identical tasks"]
      - ["Figure AI / Tesla", "Vertically integrated competitors", "Valuations cited by commentary are not deployment metrics", "Owned humanoid body plus proprietary intelligence", "Body-model co-optimization and direct hardware control", "Capital intensity and cross-hardware portability are not compared consistently"]
      - ["Conventional automation", "Status-quo substitute", "Existing installed-base economics not quantified", "Repeatable tasks in controlled environments", "Known process constraints and mature reliability practices", "Less adaptable; buyer-specific ROI is unavailable"]
      - ["Customer internal build", "Build substitute", "Private engineering cost and data requirements", "Customer-specific perception, controls, and task policies", "Control of data, safety case, and integration roadmap", "No public total-cost or time-to-deployment comparison"]
    notes: >-
      Partial landscape assembled only from the assigned source pool. Funding raised is not
      revenue, ARR, valuation, or cash available; peer figures rely on one secondary article and
      are included as scale signals rather than audited comparisons.
    claimRefs: [CP001, CP009, CP010, CP011, CP012, CP015]
  - id: TP002
    title: Evidence-constrained feature and capability matrix
    columns:
      - Buying criterion
      - Generalist AI evidence
      - Competitive implication
      - Confidence / unknown
    rows:
      - ["Cross-embodiment scope", "Company and third-party descriptions position one model across heterogeneous robot platforms", "Potential portability advantage over body-specific stacks", "Medium; production breadth is not independently audited"]
      - ["Dexterous task reliability", "Company reports 99% average success on selected GEN-1 tasks versus 64% for GEN-0", "Could reduce task-specific programming if reproduced", "Low-to-medium; internal selected-task evaluation"]
      - ["Task speed", "Company reports roughly 3x faster execution on cited dexterous tasks", "Cycle-time improvement could matter in packaging and kitting", "Low-to-medium; no common external benchmark"]
      - ["Task-specific data", "Company reports about one hour of robot data for cited GEN-1 results", "Suggests faster adaptation than traditional bespoke automation", "Low-to-medium; task selection and full integration time are unknown"]
      - ["Physical-data asset", "Company reports more than 500,000 hours of real-world interaction data", "A proprietary corpus may compound through further deployment", "Medium as a company disclosure; diversity and rights are unaudited"]
      - ["Validation and safety", "Company discloses that not all attempted tasks reached 99% and some require higher performance", "Transparent limitation, but not a deployment safety case", "Low; no independent replication or common failure taxonomy"]
    notes: >-
      Unsupported cells are stated as unknown rather than scored. Generalist performance and
      dataset figures are company claims; retained third-party pages summarize but do not
      independently reproduce the experiments.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Route
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Buyer implication
    rows:
      - ["GEN-1 early access", "Not publicly disclosed", "Access to the model through a partnership process", "No public API tariff, term, service level, or volume discount", "Suitable only for negotiated evaluation"]
      - ["Generalist full package", "Undecided / private", "Third-party account says model and hardware can be provided together", "Hardware bill, integration fee, support, and liability allocation unknown", "Lower customer integration burden but potentially greater vendor dependence"]
      - ["Model on customer-owned robot", "Undecided / private", "Third-party account says robotics-capable customers can use existing arms", "Runtime fee, edge-compute requirement, certification, and data rights unknown", "Preserves installed hardware but leaves integration risk"]
      - ["Internal build or conventional automation", "Customer-specific capex and engineering cost", "Owned controls, safety case, and task-specific stack", "No retained total-cost benchmark against Generalist", "More control and potentially more switching freedom, with slower adaptation risk"]
    notes: >-
      No retained source provides a public Generalist price list or realized contract economics.
      Every commercial term is therefore marked private, undecided, or unknown rather than
      estimated.
    claimRefs: [CP007, CP008, CP012, CP013, CP014]
figures:
  - id: FP001
    title: "Ordinal competitive positioning: portability versus public deployment proof"
    type: quadrant
    summary: >-
      Directional 1-5 analyst scoring separates the breadth of the portability thesis from the
      strength of public deployment evidence; it is not a performance benchmark.
    data:
      xAxis:
        label: "Hardware portability thesis (1=narrow, 5=broad)"
        min: 1
        max: 5
      yAxis:
        label: "Public deployment proof in retained pool (1=limited, 5=stronger)"
        min: 1
        max: 5
      points:
        - label: Generalist AI
          name: Generalist AI
          x: 5
          y: 2
          detail: "Broad cross-embodiment claim; retained proof remains largely company-evaluated."
        - label: Physical Intelligence
          name: Physical Intelligence
          x: 4
          y: 2
          detail: "Direct horizontal peer; no common deployment benchmark in the retained pool."
        - label: Skild AI
          name: Skild AI
          x: 4
          y: 4
          detail: "Third-party source emphasizes OEM and factory channel progress."
        - label: FieldAI
          name: FieldAI
          x: 3
          y: 4
          detail: "Field-autonomy focus offers adjacent deployment evidence rather than a direct dexterity test."
        - label: Google DeepMind / NVIDIA
          name: Google DeepMind / NVIDIA
          x: 5
          y: 4
          detail: "Broad model and infrastructure ecosystems, with no identical-task comparison."
        - label: Figure AI / Tesla
          name: Figure AI / Tesla
          x: 1
          y: 3
          detail: "Body-specific vertical integration trades portability for co-optimization."
    approximationNotes: >-
      Coordinates are qualitative ordinal judgments derived from the retained source descriptions,
      not measured market shares, standardized benchmarks, or valuation ranks. One-point
      differences are not statistically meaningful.
    claimRefs: [CP001, CP004, CP006, CP009, CP010, CP011, CP013, CP016]
callouts:
  - calloutType: risk
    title: The missing comparison is operational, not architectural
    body: >-
      Public evidence can distinguish horizontal, vertical, incumbent, and status-quo strategies,
      but it cannot yet compare failure severity, human interventions, integration time, or total
      cost on the same production task.
    claimRefs: [CP004, CP014, CP016]
