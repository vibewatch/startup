              - CI012
              - CI013
      - number: '4.2'
        title: The disclosed operating model is compute- and data-intensive
        blocks:
          - type: paragraph
            body: >-
              The public cost signals are much stronger than the revenue signals. Generalist says GEN-1 used more than
              500,000 hours of physical-interaction data and required distributed training infrastructure capable of
              handling petabytes, while GEN-1.5 trained continuously for more than eight months. A third-party
              description of embodied deployments also highlights robot hardware, cell integration, safety review,
              insurance, and maintenance as costs that do not exist in an API-only rollout. These disclosures indicate
              substantial fixed research infrastructure and potentially meaningful deployment support costs, but they
              provide no dollar cost, utilization, inference-cost, service-labor, capex, working-capital, or
              gross-margin data. The company-reported reliability and speed improvements may eventually support customer
              ROI, yet they cannot be converted into pricing power or margin without deployment-level economics.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
