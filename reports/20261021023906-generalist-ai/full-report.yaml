  - id: FE001
    title: Evidence-backed learning and deployment stack
    type: stack
    summary: >-
      The disclosed system moves from human-interaction data to robot adaptation and real-time action, while deployment
      controls remain an unverified boundary.
    data:
      layers:
        - label: Physical interaction collection
          detail: Low-cost wearable devices capture humans performing physical activities.
          items:
            - High-fidelity human interaction data
            - Distributed collection hardware
        - label: Foundation pretraining
          detail: The company reports more than 500,000 hours of data and no robot data in the base pretraining set.
          items:
            - Multimodal architecture
            - Petabyte-scale training infrastructure
        - label: Post-training
          detail: Post-training techniques, reinforcement learning, and multimodal human guidance improve task behavior.
          items:
            - Learning from experience
            - Human guidance
        - label: Robot and task adaptation
          detail: Disclosed results use approximately one hour of robot data to adapt to an embodiment and task.
          items:
            - Target robot data
            - Task-specific adaptation
        - label: Real-time inference
          detail: The multimodal system emits actions in real time with model-harness and Harmonic Reasoning components.
          items:
            - Action generation
            - System-level harnessing
        - label: Deployment controls
          detail: >-
            Monitoring, safety interlocks, human override, and rollback are required diligence items rather than
            disclosed capabilities.
          items:
            - Workflow constraints
