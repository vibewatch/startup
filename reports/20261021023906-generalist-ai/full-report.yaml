        - label: Service-robot demand proxy
          value: Above 70% growth in 2025
          detail: Secondary category signal with an unspecified denominator.
        - label: Cross-embodiment software wedge
          value: Hardware-agnostic intelligence
          detail: Generalist's core proposition excludes the robot body and manufacturing stack.
        - label: Demonstrated task beachhead
          value: Six disclosed workflows
