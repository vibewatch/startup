    title: Evidence narrowing from robotics growth to obtainable market
    type: pyramid
    summary: >-
      Broad category growth narrows to a cross-embodiment software wedge and then to validated tasks, while a
      company-specific obtainable market remains unquantified.
    data:
      items:
        - label: Broad humanoid adjacency
