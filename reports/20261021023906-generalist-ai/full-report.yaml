              - CI009
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Financing capacity is visible; runway is not
        blocks:
          - type: paragraph
            body: >-
              Multiple independent pages report a $400 million June 2026 financing at an approximately $2 billion
              valuation, taking total capital raised above $500 million. A separate August report describes an
              additional roughly $200 million led by 8VC at about a $3 billion valuation, but explicitly notes the
              absence of a broad company announcement, so that extension should remain provisional until primary
              documents are reviewed. Reported uses of the June proceeds include the physical data engine, cloud
              compute, real-world testing, model development, and commercial deployments. Those uses align with the
              disclosed technical cost base, but funding raised is not cash available. No source provides cash on hand,
              monthly burn, debt, project-finance obligations, runway, planned allocation by year, or a next-round
              trigger.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is best treated as well-financed research-stage execution rather than a demonstrated
              software business. Reported financing appears large relative to a robotics directory's undated estimate of
              roughly 50 employees, but headcount alone cannot establish burn because compute, data collection, robot
              hardware, and deployment support may dominate expenses. Revenue quality is unassessable: there is no
              evidence of recurring contracts, customer concentration, renewal behavior, or revenue recognition. Margin
              progression is likewise unmodellable without inference cost, service content, support obligations, and
              hardware pass-through terms. The strongest public proof is technical and company-generated; one
              independent analysis explicitly flags the 99% result as an internal benchmark rather than an independent
              standard. Investment underwriting should require a cash bridge, customer-level cohort economics, and
              deployment P&Ls before assigning a revenue multiple or a durable gross-margin path.
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI009
              - CI010
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              More than $500 million of reported cumulative funding does not establish current cash availability because
              burn, cloud commitments, debt, deployment costs, and timing of proceeds are undisclosed.
            calloutType: risk
            claimRefs:
              - CI002
              - CI004
              - CI014
          - type: callout
            title: Gate valuation work on private financial evidence
            body: >-
              Require bank-supported cash, monthly burn, contract-level revenue, deployment COGS, and customer cohort
              data before applying a revenue multiple or underwriting a software-like gross-margin path.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI005
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Generalist AI positions GEN-1 as a large multimodal system that emits robot actions in real time rather
              than as a robot body or a conventional deterministic automation package. The public workflow is train
              broadly on physical-interaction data, adapt the system to a new robot and task with roughly one hour of
              robot data, and then run autonomous manipulation. Company demonstrations cover automotive kitting, garment
              folding, vacuum servicing, box folding, block packing, and phone packing. This is evidence of a
              potentially reusable manipulation layer, not proof of a complete customer product: public material does
              not specify packaging, pricing, integration interfaces, operator tooling, service levels, or the boundary
              between Generalist's software and a customer's robot, safety system, and workcell.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE005
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Architecture and data engine
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is more system than model weights. Generalist describes pretraining,
              post-training, reinforcement learning from experience, multimodal human guidance, Harmonic Reasoning at
              inference time, and system-level harnessing. The base model is trained on more than half a million hours
              of high-fidelity physical interaction data gathered largely through low-cost wearable devices; the company
              says that base pretraining contains no robot data. Task-specific robot data is then used to adapt the
              model to both a new embodiment and a task. This design could make data acquisition and cross-embodiment
              transfer defensible, but the retained evidence does not expose model size, compute efficiency, interfaces,
              latency distributions, hardware compatibility tests, or reproducibility artifacts.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE010
      - number: '5.3'
        title: Maturity, differentiation, and deployment readiness
        blocks:
          - type: paragraph
            body: >-
              GEN-1's strongest evidence is the company's own repeated-task evaluation. Generalist reports average
              success of 99% across selected tasks versus 64% for GEN-0, and it reports long autonomous runs ranging
              from 50 automotive-kitting cycles to more than 1,800 block-packing cycles. It also reports a 12.1-second
              box fold, 2.8 times faster than cited prior systems on identical boxes. Those results are specific enough
              to guide diligence, yet they remain internally selected and measured. A specialist directory repeats the
              headline metrics, while an analyst site explicitly calls the 99% figure an internal benchmark rather than
              an independent standard. Early-access availability and a third-party GEN-1.5 listing indicate iteration,
              but neither establishes paid production use, fleet breadth, support readiness, or standardized
              cross-vendor performance.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
              - CE015
      - number: '5.4'
        title: Trust, safety, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Generalist itself identifies an important control problem: improvisational physical actions can help
              recovery but can also create liability because success and prohibited behavior are workflow-specific. The
              company also states that not every attempted task reaches 99% reliability and that some use cases require
              higher reliability or speed. These admissions are more decision-useful than the broad commercial-viability
              language, but they do not substitute for external validation. The assigned evidence set contains no public
              safety case, red-team report, certification, privacy or data-governance description, incident history,
              status page, or customer acceptance test. One allocated news URL yielded only publisher boilerplate,
              further limiting corroboration. Investment diligence should therefore treat safety controls, deployment
              monitoring, rollback, human override, and regulatory readiness as open evidence requests rather than
              inferred capabilities.
            claimRefs:
              - CE008
              - CE009
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specific internal evaluation, not generic demo copy
            body: >-
              Generalist publishes task definitions, repetition counts, comparative baselines, and speed measurements
              that can be tested in diligence; the evidence is still company-operated and should not be treated as
              independent validation.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE015
          - type: callout
            title: Control and production evidence trails the capability narrative
            body: >-
              Public sources do not establish production fleet breadth, safety certification, security controls, support
              commitments, or incident handling, while the company acknowledges both task-specific limits and potential
              liability from improvisation.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and access model
        blocks:
          - type: paragraph
            body: >-
              Generalist AI's disclosed demonstrations point toward industrial operators whose workflows combine
              repetitive manipulation with enough variation to make conventional task-specific programming expensive.
              Auto-parts kitting, phone packing, box folding, appliance servicing, and related manipulation tasks imply
              potential users in light manufacturing, electronics, logistics, and service or returns operations. The
              buyer, payer, contract structure, and revenue value of those segments are not public. The company made
              GEN-1 available to early-access partners and directs prospective users to a partnerships email, which
              indicates a high-touch evaluation motion rather than a self-serve product. GEN-1.5's demonstration-based
              adaptation may reduce setup work, but public evidence does not establish who pays, how deployments are
              priced, or which segment has converted from evaluation to production.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU014
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The public adoption record remains pre-commercial in evidentiary quality. Generalist reports high
              reliability on selected post-trained tasks and much faster adaptation through GEN-1.5, but these are
              company-run technical tests rather than customer outcomes. A September 2026 independent profile reported a
              handful of unnamed customers and described early-access and design-partner programs, yet it also found no
              named customer, deployment count, revenue figure, or case study. One identifiable external relationship is
              Elite Robots' reported role as hardware used in demonstrations and validation; the available evidence
              identifies a supplier or validation relationship, not a paying customer. The distinction is material
              because partner access, hardware compatibility, and laboratory task success do not establish production
              uptime, ROI, renewal, or repeatable procurement.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU008
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Retention, durability, and production readiness
        blocks:
          - type: paragraph
            body: >-
              No public source in the assigned evidence set discloses gross retention, net revenue retention, churn,
              renewals, contract length, expansion revenue, satisfaction, or cohort behavior. Technical durability is
              only a partial proxy: GEN-1 reportedly ran selected repetitive tasks for long sequences, but the company
              also states that not every attempted task reaches the reported reliability threshold. GEN-1.5 reports 59%
              average one-shot success across ten simple, short-horizon tasks and describes in-context skills as more
              brittle than fine-tuned models. Those limitations make workflow-specific acceptance testing, safety
              controls, human intervention rates, and post-deployment support central to customer retention. Until
              cohort and contract data are available, durable adoption should be treated as unverified rather than
              inferred from model benchmark progress.
            claimRefs:
              - CU002
              - CU006
              - CU008
              - CU013
      - number: '6.4'
        title: Expansion, concentration, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The product architecture suggests a plausible land-and-expand path: qualify one robot and task, adapt with
              limited task-specific data, harden reliability, then extend the model to adjacent tasks or embodiments.
              That path remains a hypothesis because no customer-level expansion example is public. A third-party
              article said the company planned manufacturer partnerships, developer APIs, and commercial deployments,
              but the source offered no named counterparty or completed deployment and should not be treated as verified
              demand. Customer concentration and channel dependence are also unknowable without bookings, pipeline, and
              contract data. Investment diligence should therefore request a customer roster reconciled to revenue,
              pilot-to-production conversion, deployment uptime, intervention rates, renewal history, pricing, sales
              cycle, and top-customer and top-partner shares before assigning commercial value to the access programs.
            claimRefs:
              - CU005
              - CU008
              - CU011
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical evidence is not customer evidence
            body: >-
              Generalist's public record supports controlled partner access and selected technical performance, but it
              does not support a claim of paying production adoption, retention, expansion, or diversified customer
              demand.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Deployment reliability is the highest residual risk because Generalist reports 99% success on selected
              GEN-1 tasks, yet also says not every attempted task reaches that level and that some applications require
              still higher reliability or speed. GEN-1.5 sharpens the distinction: its company-reported one-shot average
              was 59% with a 10-point standard deviation, versus 83% after limited fine-tuning, and the company calls
              the tested tasks simple and short-horizon. The next tier is embodied-safety and alignment risk, followed
              by infrastructure, partner, and financing dependencies. These rankings are directional judgments from
              disclosed evidence, not incident frequencies or quantified loss estimates.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
