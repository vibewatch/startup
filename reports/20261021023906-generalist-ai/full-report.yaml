              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and embodied-safety exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest public warning comes from Generalist itself: emergent robot actions have real-world
              consequences, task success is user-specific, and improvisation can be a liability as well as a strength.
              That admission supports a high-impact safety risk, but it does not establish that an accident, enforcement
              action, or legal breach has occurred. None of the assigned sources establishes third-party safety
              certification, jurisdiction-specific approval status, privacy controls, insurance coverage, incident
              reporting, or ownership rights for collected physical-interaction data. Those items therefore remain
              diligence gaps rather than negative factual findings. The investment case should require auditable
              controls before broad production use.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR015
      - number: '7.3'
        title: Operational, model, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Generalist's reported results indicate progress but are not yet a substitute for heterogeneous,
              third-party production testing. GEN-1's 99% figures apply to selected demonstrations, while GEN-1.5's
              lower one-shot average and the company's description of in-context skills as more brittle show that rapid
              adaptation and robust deployment are different claims. The operating burden is also substantial:
              Generalist describes infrastructure for petabytes of interaction data, custom kernels, real-time inference
              work, and thousands of robot hands. Monitor success rates by task and embodiment, intervention frequency,
              near misses, cycle time, drift after adaptation, and recovery behavior under out-of-distribution events.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR012
              - CR014
      - number: '7.4'
        title: Partner, capital, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Elite Robots says its cobot platform supported Generalist's real-world data collection and algorithm
              validation, illustrating that model progress still depends on external hardware, controls, maintenance,
              and field support. A separate account says new financing is intended for the physical data engine, cloud
              compute, and real-world testing, which makes infrastructure execution a continuing dependency even after a
              large round. Funding raised is not cash availability: the assigned evidence does not disclose burn,
              runway, committed compute spend, margin, insurance cost, customer concentration, or contractual allocation
              of liability. The small-team profile also warrants key-person and hiring diligence, but its approximate
              headcount should not be treated as audited.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity cannot be rated above early without a safety case, independent benchmark protocol,
              incident log, deployment-level service data, and contractual evidence. Near-term mitigations should
              include bounded operating domains, human override, pre-deployment hazard analysis, per-task acceptance
              thresholds, hardware qualification, staged rollouts, and explicit responsibility across Generalist, robot
              vendors, and customers. Thesis-break triggers are measurable: repeated failure to reproduce disclosed
              performance on independent hardware; a material safety incident without transparent remediation; inability
              to document required approvals or data rights; dependence on one hardware or compute provider without
              continuity plans; or financing consumption that leaves less than an agreed runway before commercial proof.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR009
              - CR010
              - CR012
              - CR015
              - CR016
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criterion
            body: >-
              Stop or materially reprice the thesis if independent tests cannot reproduce deployment-grade performance
              across multiple robot bodies and real facilities, or if safety, data-rights, and incident controls cannot
              be documented before scale.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              The recommendation is to track Generalist AI and require substantially more diligence before underwriting
              an entry price. Multiple independent sources report the June 2026 $400 million financing at an
              approximately $2 billion valuation, but the later roughly $200 million extension at an approximately $3
              billion valuation appears only in secondary coverage that itself calls for primary verification. Product
              progress is directionally encouraging: Generalist reports materially higher reliability and speed for
              selected GEN-1 tasks. Those results are not an independent production benchmark, however, and the company
              also states that not every attempted task reaches the reported reliability level. This evidence mix
              supports a high-risk, low-confidence valuation view rather than a company-quality verdict or a precise
              fair-value estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
