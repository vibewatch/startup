        - label: 2. Early access
          detail: Prospect enters a controlled partner engagement; partner count and commercial terms are undisclosed.
          status: disclosed
        - label: 3. Task demonstration
          detail: Customer or operator supplies task examples and workflow constraints.
          status: inferred
        - label: 4. Model adaptation
          detail: GEN-1 or GEN-1.5 is adapted or prompted with limited task-specific data.
          status: company-claimed
        - label: 5. Reliability hardening
          detail: Performance, safety, intervention rate, speed, and uptime must meet site-specific acceptance criteria.
          status: unverified
        - label: 6. Production expansion
          detail: >-
            A successful task could expand to adjacent tasks, robots, or sites, but no public example establishes this
