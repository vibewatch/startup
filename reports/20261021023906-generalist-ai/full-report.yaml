  - id: FU001
    title: Inferred customer adoption and expansion path
    type: journey-map
    summary: >-
      A diligence framing for how technical access could become production adoption; only early access and model
      adaptation are publicly evidenced, while later stages remain unverified.
    data:
      nodes:
        - label: 1. Segment qualification
          detail: Identify variable manipulation work where bespoke robot programming is uneconomic.
