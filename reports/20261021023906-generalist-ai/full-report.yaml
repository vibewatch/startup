chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Generalist AI describes itself as a frontier AI research and product company building intelligence for the
              physical world. Its product thesis is an embodied foundation model that can transfer across robot bodies
              rather than a vertically integrated robot. The company says it begins with dexterity and trains on
              large-scale physical experience; its October 2026 homepage promotes GEN-1.5 access through a waitlist.
              Multiple independent profiles agree that the company was founded in 2024 and remains private, but they do
              not resolve a single headquarters city: San Mateo, Palo Alto, and San Francisco all appear, while the
              official company page states only Bay Area and Boston locations. The broad footprint is supportable; the
              precise legal headquarters and current operating headcount require company confirmation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO011
              - CO012
              - CO013
              - CO015
      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Independent profiles identify Peter "Pete" Florence, Andy Zeng, and Andrew "Andy" Barry as the founding
              team, with Florence as CEO, Zeng as chief scientist, and Barry as CTO. Their reported backgrounds span
              DeepMind, OpenAI, and Boston Dynamics, while the official team page also cites work on PaLM-E, RT-2,
              ChatGPT, GPT-4, autonomous driving, Atlas, Spot, and Stretch. That mix provides model, robotics, and
              company-building coverage, but public materials also concentrate technical and strategic credibility in
              the three founders. No assigned source names directors, independent board members, or succession
              arrangements. Governance quality and key-person mitigation therefore remain diligence questions rather
              than verified strengths.
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO016
      - number: '1.3'
        title: Financing, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest current scale signal is financing rather than commercial disclosure. Multiple independent
              sources report that Generalist AI raised $400 million on June 4, 2026 at a $2 billion valuation, taking
              cumulative funding above $500 million. NeuronFeed separately reports a $12.5 million seed and a $128
              million Series A in early 2025. Radical Ventures led the June round, joined by new and existing
              institutional investors including 8VC, Union Square Ventures, Hanabi Capital, Norwest, NVIDIA, Boldstart,
              Spark Capital, Bezos Expeditions, and NFDG. Funding raised is not cash available, and none of the assigned
              evidence discloses burn, runway, debt, revenue, ARR, pricing, or customer count. Those omissions prevent a
              supportable commercial-stage or liquidity assessment.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Milestones and validation boundary
        blocks:
          - type: paragraph
            body: >-
              The public milestone sequence runs from the 2024 founding through reported early-2025 financings, GEN-0 in
              November 2025, GEN-1 in April 2026, the June financing, cross-end-effector work in July, and GEN-1.5 in
              August. Generalist reports that GEN-1 reached roughly 99% average success on selected tasks, versus 64%
              for GEN-0, completed some tasks about three times faster than prior approaches, and used about one hour of
              robot data per task. These are company-run results, not an independent benchmark. An independent analyst
              explicitly flags that limitation and identifies standardized third-party evaluation and disclosed
              heterogeneous production deployments as the next proof points. The timeline therefore shows research and
              capital velocity, not independently verified commercial adoption.
            claimRefs:
