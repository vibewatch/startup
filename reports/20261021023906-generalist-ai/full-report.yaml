  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Evidence-bounded assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Independent GEN-1 replication, multiple production customers, cross-hardware deployment, and disclosed
          software-like economics.
        - >-
          A value above the reported ~$3B August mark is conceivable only after these milestones; no intrinsic range is
          supportable today.
        - >-
          Directionally improves only when third-party deployment and economic evidence appears; no numeric probability
          assigned.
        - Independent results fail to reproduce selected-task reliability or customers do not convert from early access.
      - - Base
        - Technical promise continues, but commercial proof and operating economics remain limited.
        - >-
          The ~$2B June mark to reported ~$3B August mark is a financing-reference band, not a fair-value estimate or
          target-return range.
        - >-
          Current evidence best fits this case because financing is visible while customer and financial evidence is
          not.
        - Another major financing is required before disclosed production or revenue milestones.
      - - Bear
        - Performance does not generalize, deployment remains bespoke, or capital consumption stays structurally high.
        - >-
          Re-rating below the ~$2B June reference is plausible, but the public evidence cannot quantify a floor or loss
          distribution.
        - >-
          Becomes more likely with missed deployment milestones, adverse benchmark results, or unfavorable financing
          terms.
        - Reliability, safety, customer ROI, or liquidity evidence fails investment-committee thresholds.
    notes: >-
      Scenario bounds are directional references to reported financing marks, not probability-weighted intrinsic values;
      probabilities and target returns remain unquantified because required private inputs are absent.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
