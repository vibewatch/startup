              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The June mark is the strongest observable financing anchor; the August mark should be treated as a
              reported signal, not a verified current valuation. Funding is intended for the physical-data engine,
              compute, real-world testing, and commercial deployment, all of which are capital-intensive activities. The
              retained evidence does not disclose revenue or ARR, pricing or paying-customer count, or burn, runway,
              debt, liquidation preferences, and other cap-table terms. As a result, funding raised cannot be treated as
              cash available, and a round valuation cannot be translated into ownership economics or return potential.
              Entry discipline should therefore be conditional on primary financing documents, fully diluted
              capitalization, preference terms, cash balance, committed spend, and a bottom-up operating plan rather
              than on the headline valuation alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Evidence-bounded bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain relational because the public record does not support an intrinsic
              valuation. A bull case requires independent replication of GEN-1 performance, production deployments
              across more than one hardware platform, and economics capable of supporting a value above the reported
              August mark. The base case treats the approximately $2 billion June mark and the unconfirmed approximately
              $3 billion August mark as a financing-reference band, not as fair value. The bear case is a re-rating
              below the June reference if deployment evidence stalls, reliability fails outside selected tasks, or
              capital consumption proves structurally high. Reported valuations for Physical Intelligence and Figure AI
              provide category context only; their different strategies and unnormalized secondary figures are not
              independent performance benchmarks or directly comparable transaction multiples.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, decision triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public exit readiness is limited. Generalist announced early-access availability, while independent
              coverage warns that demonstrations should not be confused with OEM deployment contracts. No retained
              source identifies paying customers, recurring revenue, pricing, or audited economics. A favorable decision
              would require independently measured production reliability and throughput, signed customer evidence,
              deployment-level gross-margin and support-cost data, and financing terms that preserve a plausible target
              return after dilution. Thesis-break triggers include failure to reproduce the selected-task results in
              customer environments, dependence on repeated large raises without commercial milestones, or a price above
              the reported financing marks without corresponding revenue and deployment evidence. The immediate
              diligence path is a technical benchmark, customer-reference calls, model-level operating data, and a
              complete capitalization and liquidity package.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision rule
            body: >-
              Move from track to underwrite only after independent production benchmarking, signed customer evidence,
              unit economics, and complete financing terms support a price-specific target return.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Do not equate funding with liquidity
            body: >-
              The retained sources report financing amounts, not current cash, burn, runway, ownership, or preference
              overhang; those inputs remain direct diligence requirements.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV014
              - CV016
