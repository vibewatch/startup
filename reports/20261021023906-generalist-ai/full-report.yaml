  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market boundary is narrower than "robotics" and broader than a single robot form factor.
              Generalist AI describes GEN-1 as a hardware-agnostic physical-intelligence system trained for dexterous
              work, so the relevant core is the software and data layer that enables robots to perform variable physical
              tasks. Robot bodies, actuators, factory cells, and system integration are complementary spend rather than
              Generalist's disclosed product scope. The initial use cases shown publicly are kitting, folding, packing,
              and equipment servicing; these support an industrial-manipulation wedge, not an assumption that every
              humanoid or service-robot dollar is addressable. Status-quo substitutes include fixed automation,
              task-specific control stacks, internal robotics teams, and human labor where flexibility or exception
              handling still outweighs automation economics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM014
      - number: '2.2'
        title: Sizing evidence and its limits
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence offers three broad indicators but no bottom-up market size for Generalist. A
              secondary market analysis cites a $38 billion humanoid-robot projection for 2035, an above-30% CAGR for AI
              in robotics through 2033, and greater-than-70% growth in service-robot categories during 2025. These
              measures cover different products, periods, and denominators, and none identifies the share accruing to
              cross-embodiment model providers. The $400 million financing round and more than $500 million of reported
              total capital are evidence of investor willingness to fund the category, not customer spend or market
              demand. Accordingly, the sizing view below narrows broad adjacencies toward the company-specific
              opportunity without adding the proxies together or converting them into unsupported revenue potential.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public materials point first to manufacturing, logistics, warehousing, and laboratories, where operations
              or automation leaders can sponsor a deployment and frontline workers or technicians interact with the
              system. Robot manufacturers and integrators are another plausible buyer class because a portable model
              could reduce the cost of building a separate intelligence stack for each embodiment. This payer mapping is
              analytical rather than a disclosed Generalist packaging model: no public price, contract structure, or
              budget line appears in the assigned evidence. The likely adoption sequence is task qualification, limited
              integration and safety review, measured pilot performance, then broader rollout. Buyers therefore need
              workflow-level reliability, speed, recovery behavior, and integration economics rather than an
              undifferentiated claim of general intelligence.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal growth driver is a potential data flywheel: larger physical-interaction datasets improve
              models, deployments create additional edge-case data, and cross-hardware reuse can spread
              model-development cost across more applications. Generalist reports more than half a million hours of
              pretraining data and approximately one hour of robot data for each disclosed task result, which, if
              independently repeatable, could lower task-onboarding friction. The constraints remain material. The
              company says not every attempted task reaches 99% success and some workflows need still higher reliability
              or speed; independent standardized tests, production deployment counts, pricing, switching costs, safety
              approvals, and customer ROI are absent from the pool. Valuation should therefore reward the horizontal
              software option while discounting the unproven conversion from internal task demonstrations to repeatable
              enterprise budgets.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fund the layer, not the entire robot
            body: >-
              Generalist's market thesis depends on capturing software-like value across multiple robot bodies without
              absorbing the manufacturing economics of those bodies.
            calloutType: insight
            claimRefs:
              - CM001
              - CM014
          - type: callout
            title: Category growth is not company demand
            body: >-
              Broad robotics forecasts and large financing rounds do not establish Generalist's price, eligible
              installed base, paid deployments, or obtainable revenue.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Generalist AI is best analyzed as a horizontal intelligence supplier rather than as a humanoid
              manufacturer. The retained evidence identifies Physical Intelligence as the closest horizontal peer, with
              Skild AI and FieldAI competing through broader robot brains or field autonomy. Google DeepMind and NVIDIA
              are incumbent threats because they can pair models with compute, simulation, developer tooling, and
              existing distribution. Figure AI and Tesla represent the vertically integrated alternative: they can
              co-optimize body and brain, while Generalist must make one model work across heterogeneous hardware.
              Buyers can also retain conventional task-specific automation or build a proprietary control stack. Those
              substitutes sacrifice some promised generality but preserve control, known safety envelopes, or existing
              integration investments.
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
      - number: '3.2'
        title: Capability differentiation and proof quality
        blocks:
          - type: paragraph
            body: >-
              Generalist's strongest claimed differentiation is the combination of cross-embodiment transfer, a large
              proprietary physical-interaction corpus, and fast task adaptation. Its April 2026 GEN-1 release reports an
              average 99% success rate on selected tasks versus 64% for GEN-0, alongside roughly three-times-faster
              execution on cited examples and about one hour of robot data per task. These are meaningful product
              hypotheses, not independent benchmarks. Generalist itself says some attempted tasks did not reach the
              headline success rates and that some applications require still higher reliability or speed. The absence
              of common third-party trials makes capability rankings directional; it also prevents a buyer from
              converting a research result into a deployment-grade failure-rate comparison.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
      - number: '3.3'
        title: Packaging, pricing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The available commercial surface is early access rather than a standardized product catalog. Generalist
              invited early-access partners to contact it when GEN-1 launched, while a directory still characterized the
              company as pre-commercial with no public product or API. A later third-party account describes two
              possible delivery routes: Generalist can provide a model-plus-hardware package, or a robotics-capable
              customer can run the model on its own arm. That flexibility could widen distribution, but there is no
              public price list or settled billing model in the retained evidence. The company's more than $500 million
              reported total funding raised supports continued model and integration work; it is not revenue, ARR, cash
              available, or evidence of repeatable customer economics.
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Generalist's potential moat is its physical-data flywheel: a model trained on more than half a million
              hours of company-reported interaction data may adapt across bodies and tasks without rebuilding every
              policy from scratch. Durability depends on converting that corpus into independently verified reliability
              and deployments that return proprietary operating data. The same horizontal posture creates exposure.
              Robot OEMs may vertically integrate, incumbents may bundle models with compute and simulation, and
              customers may prefer internal control where safety certification or data rights dominate. With no
              independent replication in the retained pool, the present advantage is best treated as a well-financed
              technical lead hypothesis rather than proven lock-in. Switching costs, data ownership, multi-homing, and
              partner exclusivity remain diligence items.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP011
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The missing comparison is operational, not architectural
            body: >-
              Public evidence can distinguish horizontal, vertical, incumbent, and status-quo strategies, but it cannot
              yet compare failure severity, human interventions, integration time, or total cost on the same production
              task.
            calloutType: risk
            claimRefs:
              - CP004
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and go-to-market remain unpriced
        blocks:
          - type: paragraph
            body: >-
              Generalist AI positions GEN-1 and GEN-1.5 as hardware-agnostic robot foundation models, but none of the
              eight allocated sources discloses a list price, realized contract value, revenue, ARR, or recognized
              revenue stream. The clearest commercial signal is the company's April statement that early-access partners
              could begin using GEN-1 and should contact its partnerships team. That supports an enterprise, partner-led
              motion rather than self-serve software, but it does not establish whether monetization will be a model
              license, usage fee, deployment project, fine-tuning service, or revenue share. Public materials also omit
              paying-customer counts, contract terms, sales-cycle duration, channel economics, and production deployment
              volume. Consequently, each plausible stream below is a diligence hypothesis or unavailable field, not
              recorded revenue.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI016
          - type: table
