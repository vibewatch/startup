  topStrengths:
    - 不绑定特定硬件的具身模型逻辑覆盖广泛的机器人平台，不会把公司押在单一机型上。
    - 据报道，创始团队拥有来自 DeepMind、OpenAI 和 Boston Dynamics 的前沿模型与机器人经验。
    - 据报道，超过 $500 million 的累计融资为投入实体数据、算力、测试和部署提供了资金空间。
  topRisks:
    - 公司在选定任务上的基准结果尚未在持续生产环境、不同任务和不同机器人机体上得到独立复现。
    - 收入、定价、具名付费客户、毛利率、烧钱速度和现金跑道仍未披露。
    - 公开证据尚不足以证明公司具备第三方安全认证、事故控制、数据权利、保险或责任分配安排。
    - 数据采集、训练基础设施、硬件集成和现场支持可能带来较高的资本强度与稀释风险。
    - 在缺乏客户经济性或可支撑的回报模型时，一笔约 $2 billion 的已确认融资参考难以纳入估值判断。
  unresolvedGaps:
    - 覆盖可靠性、人工干预频率、吞吐量和持续运行能力的独立多机体生产基准。
    - 具名付费客户、已签合同条款、部署量、定价、收入确认和客户层面的留存证据。
    - 现金余额、月度烧钱速度、已承诺的算力和硬件支出、债务、现金跑道及部署层面的毛利率。
    - 安全论证、认证状态、事故与险情历史、实体数据权利、隐私控制、保险和责任条款。
    - 完全摊薄后的资本结构、清算优先权、董事会构成、投资者权利和继任规划。
