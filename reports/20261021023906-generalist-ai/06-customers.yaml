figures:
  - id: FU001
    title: Inferred customer adoption and expansion path
    type: journey-map
    summary: >-
      A diligence framing for how technical access could become production adoption; only
      early access and model adaptation are publicly evidenced, while later stages remain unverified.
    data:
      nodes:
        - label: "1. Segment qualification"
          detail: "Identify variable manipulation work where bespoke robot programming is uneconomic."
          status: inferred
        - label: "2. Early access"
          detail: "Prospect enters a controlled partner engagement; partner count and commercial terms are undisclosed."
          status: disclosed
        - label: "3. Task demonstration"
          detail: "Customer or operator supplies task examples and workflow constraints."
          status: inferred
        - label: "4. Model adaptation"
          detail: "GEN-1 or GEN-1.5 is adapted or prompted with limited task-specific data."
          status: company-claimed
        - label: "5. Reliability hardening"
          detail: "Performance, safety, intervention rate, speed, and uptime must meet site-specific acceptance criteria."
          status: unverified
        - label: "6. Production expansion"
          detail: "A successful task could expand to adjacent tasks, robots, or sites, but no public example establishes this loop."
          status: unverified
    approximationNotes: "This is an inferred diligence journey, not a disclosed sales funnel; no conversion rates, customer counts, or stage durations are available."
    claimRefs: [CU004, CU005, CU006, CU014]
callouts:
  - calloutType: risk
    title: Technical evidence is not customer evidence
    body: >-
      Generalist's public record supports controlled partner access and selected technical
      performance, but it does not support a claim of paying production adoption, retention,
      expansion, or diversified customer demand.
    claimRefs: [CU001, CU002, CU008, CU012]
