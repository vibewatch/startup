company:
  name: Generalist AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Generalist AI has disclosed early-access and design-partner engagement but no named
    paying customer, production deployment, pricing, retention metric, or customer
    concentration data. Its strongest adoption signal is therefore technical readiness
    for selected industrial tasks, not independently verified commercial traction.
sections:
  - id: customer-segments-and-access
    title: Customer segments and access model
    body: >-
      Generalist AI's disclosed demonstrations point toward industrial operators whose
      workflows combine repetitive manipulation with enough variation to make conventional
      task-specific programming expensive. Auto-parts kitting, phone packing, box folding,
      appliance servicing, and related manipulation tasks imply potential users in light
      manufacturing, electronics, logistics, and service or returns operations. The buyer,
      payer, contract structure, and revenue value of those segments are not public. The
      company made GEN-1 available to early-access partners and directs prospective users
      to a partnerships email, which indicates a high-touch evaluation motion rather than
      a self-serve product. GEN-1.5's demonstration-based adaptation may reduce setup work,
      but public evidence does not establish who pays, how deployments are priced, or which
      segment has converted from evaluation to production.
    claimRefs: [CU001, CU003, CU004, CU005, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-proof-quality
    title: Adoption trajectory and proof quality
    body: >-
      The public adoption record remains pre-commercial in evidentiary quality. Generalist
      reports high reliability on selected post-trained tasks and much faster adaptation
      through GEN-1.5, but these are company-run technical tests rather than customer
      outcomes. A September 2026 independent profile reported a handful of unnamed
      customers and described early-access and design-partner programs, yet it also found
      no named customer, deployment count, revenue figure, or case study. One identifiable
      external relationship is Elite Robots' reported role as hardware used in demonstrations
      and validation; the available evidence identifies a supplier or validation relationship,
      not a paying customer. The distinction is material because partner access, hardware
      compatibility, and laboratory task success do not establish production uptime, ROI,
      renewal, or repeatable procurement.
    claimRefs: [CU001, CU002, CU005, CU007, CU008, CU010, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-and-retention
    title: Retention, durability, and production readiness
    body: >-
      No public source in the assigned evidence set discloses gross retention, net revenue
      retention, churn, renewals, contract length, expansion revenue, satisfaction, or
      cohort behavior. Technical durability is only a partial proxy: GEN-1 reportedly ran
      selected repetitive tasks for long sequences, but the company also states that not
      every attempted task reaches the reported reliability threshold. GEN-1.5 reports
      59% average one-shot success across ten simple, short-horizon tasks and describes
      in-context skills as more brittle than fine-tuned models. Those limitations make
      workflow-specific acceptance testing, safety controls, human intervention rates, and
      post-deployment support central to customer retention. Until cohort and contract data
      are available, durable adoption should be treated as unverified rather than inferred
      from model benchmark progress.
    claimRefs: [CU002, CU006, CU008, CU013]
  - id: expansion-concentration-and-diligence
    title: Expansion, concentration, and diligence implications
    body: >-
      The product architecture suggests a plausible land-and-expand path: qualify one robot
      and task, adapt with limited task-specific data, harden reliability, then extend the
      model to adjacent tasks or embodiments. That path remains a hypothesis because no
      customer-level expansion example is public. A third-party article said the company
      planned manufacturer partnerships, developer APIs, and commercial deployments, but
      the source offered no named counterparty or completed deployment and should not be
      treated as verified demand. Customer concentration and channel dependence are also
      unknowable without bookings, pipeline, and contract data. Investment diligence should
      therefore request a customer roster reconciled to revenue, pilot-to-production
      conversion, deployment uptime, intervention rates, renewal history, pricing, sales
      cycle, and top-customer and top-partner shares before assigning commercial value to
      the access programs.
    claimRefs: [CU005, CU008, CU011, CU014, CU015]
