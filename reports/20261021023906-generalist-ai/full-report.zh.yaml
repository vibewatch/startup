      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              独立简介将 Peter "Pete" Florence、Andy Zeng 和 Andrew "Andy" Barry 认定为创始团队成员，分别担任 CEO、首席科学家和 CTO。据报道，他们的经历横跨
              DeepMind、OpenAI 和 Boston Dynamics；官方团队页面还提到 PaLM-E、RT-2、ChatGPT、GPT-4、自动驾驶、Atlas、Spot 和 Stretch
              项目。这种组合覆盖了模型、机器人和公司建设能力，但公开材料也把技术与战略可信度高度集中在三位创始人身上。现有来源没有一项列出董事、独立董事或继任安排。因此，治理质量和关键人物风险缓释仍是尽调问题，而非已验证的优势。
