              Elite Robots 称其协作机器人平台支持 Generalist
              的真实世界数据采集和算法验证，这说明模型进展仍依赖外部硬件、控制系统、维护和现场支持。另一份报道称，新融资将用于物理数据引擎、云算力和真实世界测试，因此即使完成大额融资，基础设施执行仍是持续依赖。已募集资金不等于可用现金：现有证据没有披露烧钱、现金跑道、已承诺算力支出、利润率、保险成本、客户集中度或责任的合同分配。小团队画像也值得开展关键人物和招聘尽调，但其估计员工数不应视为审计数据。
            claimRefs:
              - CR007
              - CR008
              - CR009
