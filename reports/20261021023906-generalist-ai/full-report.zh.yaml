companyProfile:
  summary: >-
    Generalist AI 成立于 2024 年，是一家私营具身 AI 公司，开发可跨不同机器人本体和物理任务迁移的基础模型。创始团队据报道拥有 DeepMind、OpenAI 和 Boston Dynamics
    的从业经验。公开证据支持其于 2026 年 6 月完成 $400 million 融资、估值约 $2 billion，累计融资超过 $500
    million；但尚不足以证明其拥有付费客户、收入、生产规模部署或经过独立基准测试的可靠性。
