  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              与其把 Generalist AI 看作人形机器人制造商，不如将其视为横向智能供应商。留存证据将 Physical Intelligence 认定为最接近的横向同行，Skild AI 和 FieldAI
              则通过更广泛的机器人“大脑”或现场自主能力展开竞争。Google DeepMind 和 NVIDIA 是在位威胁，因为它们能够把模型与算力、仿真、开发者工具和既有分销结合起来。Figure AI 和 Tesla
              代表垂直整合替代方案：它们可以协同优化本体和“大脑”，而 Generalist
              必须让一个模型适配异构硬件。买方也可以继续使用传统任务专用自动化，或自建专有控制栈。这些替代方案牺牲部分承诺的通用性，但保留控制权、已知安全边界或既有集成投入。
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
