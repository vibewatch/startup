        title: 里程碑与验证边界
        blocks:
          - type: paragraph
            body: >-
              公开里程碑从 2024 年成立开始，经过据报道发生在 2025 年初的融资、2025 年 11 月的 GEN-0、2026 年 4 月的 GEN-1、6 月融资、7 月跨末端执行器工作，以及 8 月的
              GEN-1.5。Generalist 报告称，GEN-1 在选定任务上的平均成功率约为 99%，而 GEN-0 为
              64%；部分任务完成速度约为此前方法的三倍，并且每项任务使用约一小时机器人数据。这些是公司自行运行的结果，不是独立基准测试。一名独立分析师明确指出这一局限，并将标准化第三方评估和披露异构生产部署列为下一步证明点。因此，这条时间线体现的是研发和资本推进速度，而非经过独立验证的商业采用。
