          detail: 直接的横向同行；保留来源中没有共同部署基准。
        - label: Skild AI
          name: Skild AI
          x: 4
          'y': 4
          detail: 第三方来源强调 OEM 和工厂渠道进展。
        - label: FieldAI
          name: FieldAI
          x: 3
          'y': 4
          detail: 聚焦现场自主性，提供相邻部署证据，而非直接的灵巧性测试。
        - label: Google DeepMind / NVIDIA
          name: Google DeepMind / NVIDIA
          x: 5
          'y': 4
          detail: 广泛的模型和基础设施生态，但没有相同任务比较。
        - label: Figure AI / Tesla
          name: Figure AI / Tesla
          x: 1
          'y': 3
          detail: 面向本体的垂直整合以可移植性换取协同优化。
    approximationNotes: 坐标是根据保留来源描述作出的定性序数判断，不是测量所得的市场份额、标准化基准或估值排名。相差一分不具统计意义。
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP009
      - CP010
      - CP011
      - CP013
      - CP016
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据描述了从物理数据到早期访问的技术路径，但从部署活动到收入和毛利的转化仍未披露。
    data:
      nodes:
        - id: physical-data
          label: 物理交互数据
          detail: 公司报告称 GEN-1 预训练使用了超过 500,000 小时的数据。
        - id: pretraining
          label: 预训练引擎
          detail: 已披露 PB 级基础设施和长期算力投入，但成本未披露。
        - id: foundation-model
          label: GEN-1 / GEN-1.5
          detail: 公司生成的技术结果支持能力判断，不是财务指标。
        - id: task-adaptation
          label: 客户任务适配
          detail: 物理提示或有限微调可能降低适配工作量。
        - id: early-access
          label: 早期访问部署
          detail: 已披露合作伙伴访问，但付费状态和部署规模未披露。
        - id: revenue-and-gross-profit
          label: 收入和毛利
          detail: 定价、确认收入、COGS 和毛利率仍不可得。
    approximationNotes: 仅为概念性顺序；不包含推断的转化率、收入金额或利润率，也不意味着每次早期访问部署都已付费。
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
  - id: FE001
    title: 有证据支持的学习与部署栈
    type: stack
    summary: 已披露系统从人类交互数据推进到机器人适配和实时动作，而部署控制仍是未经验证的边界。
    data:
      layers:
        - label: 物理交互采集
          detail: 低成本可穿戴设备采集人类执行物理活动的数据。
          items:
            - 高保真人类交互数据
            - 分布式采集硬件
        - label: 基础预训练
          detail: 公司报告称拥有超过 500,000 小时数据，基础预训练集不含机器人数据。
          items:
            - 多模态架构
            - PB 级训练基础设施
        - label: 后训练
          detail: 后训练技术、强化学习和多模态人类引导改善任务行为。
          items:
            - 从经验中学习
            - 人类引导
        - label: 机器人与任务适配
          detail: 已披露结果显示，适配一个具身形态和任务约需一小时机器人数据。
          items:
            - 目标机器人数据
            - 任务特定适配
        - label: 实时推理
          detail: 多模态系统结合 model-harness 和 Harmonic Reasoning 组件实时输出动作。
          items:
            - 动作生成
            - 系统级编排
        - label: 部署控制
          detail: 监控、安全联锁、人工接管和回滚是必须核查的尽调事项，而非已披露能力。
          items:
            - 工作流约束
            - 运营保障缺口
    approximationNotes: 各层顺序由已披露组件综合而来，不是公司发布的参考架构；部署控制层是明确的尽调证据缺口。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE009
      - CE010
  - id: FU001
    title: 推断的客户采用与扩张路径
    type: journey-map
    summary: 这是对技术访问如何转为生产采用的尽调框架；目前只有早期访问和模型适配有公开证据，后续阶段仍未验证。
    data:
      nodes:
        - label: 1. 细分市场筛选
          detail: 找出变量操作工作中定制机器人编程不具经济性的场景。
          status: inferred
        - label: 2. 早期访问
          detail: 潜在客户进入受控的合作伙伴合作；合作伙伴数量和商业条款未披露。
          status: disclosed
        - label: 3. 任务演示
          detail: 客户或操作员提供任务示例和工作流约束。
          status: inferred
        - label: 4. 模型适配
          detail: 使用有限的任务特定数据适配或提示 GEN-1 或 GEN-1.5。
          status: company-claimed
        - label: 5. 可靠性强化
          detail: 性能、安全性、干预率、速度和正常运行时间必须达到现场特定的验收标准。
          status: unverified
        - label: 6. 生产扩张
          detail: 一项成功任务可能扩展到相邻任务、机器人或站点，但没有公开案例证明这一循环。
          status: unverified
    approximationNotes: 这是推断的尽调路径，不是已披露的销售漏斗；转化率、客户数量和阶段持续时间均不可得。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 基于公开证据的方向性剩余风险视图；未知项保留为尽调缺口，而不是转换成数值概率。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 基于定性证据的评估，不是测量所得的概率。
        - id: impact
          label: 影响
          detail: 风险兑现时可能产生的投资影响。
        - id: mitigation
          label: 公开缓释成熟度
          detail: 指定公开证据中可见的成熟度。
      rows:
        - id: deployment-reliability
          label: 跨任务部署可靠性
          note: GEN-1 的单项任务结果与已承认的局限并存，GEN-1.5 的一次性平均值也更低。
          values:
            - value: Medium-high
              detail: 证据显示不同任务和适配模式的结果不均衡。
            - value: Critical
              detail: 可靠性失败可能阻断生产部署。
            - value: Early
              detail: 缺少独立、标准化的生产证据。
        - id: embodied-safety
          label: 具身安全与对齐
          note: 公司承认涌现的物理动作可能带来责任风险。
          values:
            - value: Medium
              detail: 能力会带来风险敞口，但这里没有确认任何事故。
            - value: Critical
              detail: 不安全的动作可能造成身体伤害或运营损失。
            - value: Early
              detail: 公开证据表明目标是改善对齐，而不是已有完整控制系统。
        - id: infrastructure
          label: 训练与推理基础设施
          note: PB 级数据和实时推理需要大量工程投入与算力。
          values:
            - value: Medium
              detail: 已披露复杂性，但没有故障和成本历史。
            - value: High
              detail: 容量或经济性可能拖慢模型和部署节奏。
            - value: Developing
              detail: 已披露定制基础设施工作，但没有服务级证据。
        - id: hardware-partners
          label: 硬件与合作伙伴依赖
          note: 在所述合作中，Elite 的协作机器人支持了数据采集和验证。
          values:
            - value: Medium
              detail: 已证明存在依赖，但总体集中度未知。
            - value: High
              detail: 硬件兼容性或支持失败可能延误部署。
            - value: Developing
              detail: 全球支持来自合作伙伴自述；未显示冗余能力。
        - id: regulatory-data-rights
          label: 监管与数据权利准备度
          note: 指定来源池中没有认证、批准、隐私和数据权利证据。
          values:
            - value: Unknown
              detail: 不能从缺少证据推断存在违规或执法事件。
            - value: High
              detail: 控制或权利缺陷可能叫停部署。
            - value: Not established
              detail: 需要直接核查文件。
        - id: capital-runway
          label: 资本效率与现金跑道
          note: 融资公告没有披露可用现金、烧钱速度、现金跑道或毛利率。
          values:
            - value: Unknown
              detail: 指定来源池中没有可用的经营现金流证据。
            - value: High
              detail: 数据、算力、硬件和测试需求可能高度资本密集。
            - value: Not established
              detail: 需要预算、承诺事项和经董事会批准的现金跑道计划。
    approximationNotes: 定性单元格综合引用证据和明确缺口；它们不是数值概率、事故率或独立基准分数。
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR012
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 可观察的融资和公司自报技术证明，在形成“观察 / 继续研究”建议前，还要经过独立验证和私有经济性缺口的筛选。
    data:
      nodes:
        - id: june-mark
          label: 6 月融资参考
          detail: 多个独立来源报道以约 $2B 估值融资 $400M。
        - id: august-mark
          label: 8 月据报道的追加融资
          detail: 约 $200M、估值约 $3B，明确仍待一手来源验证。
        - id: technical-proof
          label: 公司自报的 GEN-1 证明
          detail: 单项任务可靠性和速度有所改善，但存在已声明的局限。
        - id: benchmark-gap
          label: 独立基准缺口
          detail: 没有保留来源独立复现报道中的 GEN-1 结果。
        - id: deployment-gap
          label: 部署证明缺口
          detail: 已披露早期访问，但未披露具名的付费生产客户。
        - id: economics-gap
          label: 经济性与条款缺口
          detail: 收入、定价、烧钱速度、现金跑道、持股和优先权条款均未披露。
        - id: recommendation
          label: 观察 / 继续研究
          detail: 在证据缺口补齐前，不要赋予内在价值或目标回报。
      edges:
        - from: june-mark
          to: technical-proof
        - from: august-mark
          to: technical-proof
        - from: technical-proof
          to: benchmark-gap
        - from: benchmark-gap
          to: deployment-gap
        - from: deployment-gap
          to: economics-gap
        - from: economics-gap
          to: recommendation
    approximationNotes: 美元金额是报道中的交易参考；该图不代表概率、转化率或与价值成比例的规模。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
