        title: 展示项
        blocks:
          - type: callout
            title: 投资这一层，而不是整台机器人
            body: Generalist 的市场逻辑取决于在多个机器人本体之间获取软件式价值，同时不承担这些本体的制造经济性。
            calloutType: insight
            claimRefs:
              - CM001
              - CM014
