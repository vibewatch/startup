chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >-
              Generalist AI 将自己描述为一家面向物理世界、研发并提供产品的前沿 AI
              公司。其产品逻辑是打造可跨机器人本体迁移的具身基础模型，而非垂直整合的机器人。公司称从灵巧操作切入，并基于大规模物理经验训练；其 2026 年 10 月官网通过候补名单推广 GEN-1.5
              访问。多个独立简介一致认为公司成立于 2024 年且仍为私营企业，但无法确定唯一总部城市：San Mateo、Palo Alto 和 San Francisco 均有出现，官方公司页面只写明湾区和
              Boston。大致运营版图可以确认；准确的法定总部和当前运营员工数仍需公司确认。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO015
