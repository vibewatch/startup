      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开材料首先指向制造、物流、仓储和实验室场景：运营或自动化负责人可以发起部署，一线员工或技术人员与系统交互。机器人制造商和集成商也是合理的买方类别，因为可移植模型可能降低为每种本体单独搭建智能栈的成本。这一付费方映射是分析判断，而非
              Generalist
              已披露的产品包装模式；现有证据中没有公开价格、合同结构或预算科目。可能的采用顺序是任务验证、有限集成与安全审查、测量试点表现，然后扩大部署。因此，买方需要的是工作流层面的可靠性、速度、恢复行为和集成经济性，而不是笼统的通用智能主张。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动是潜在的数据飞轮：更大的物理交互数据集改善模型，部署产生更多边缘案例数据，跨硬件复用则能把模型开发成本摊到更多应用上。Generalist 报告称拥有超过 50
              万小时的预训练数据，每项披露任务约使用一小时机器人数据；如果能够独立复现，这可能降低任务接入摩擦。约束仍然显著。公司称并非每个尝试任务都达到 99%
              成功率，部分工作流还需要更高可靠性或速度；证据池中没有独立标准化测试、生产部署数量、定价、切换成本、安全批准或客户
              ROI。估值因此应奖励其横向软件选择权，同时对从内部任务演示转化为可重复企业预算这一尚未验证的过程进行折价。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
