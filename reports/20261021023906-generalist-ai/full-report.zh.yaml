  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 受证据约束的假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 独立复现 GEN-1、拥有多个生产客户、实现跨硬件部署，并披露类似软件的经济性。
        - 只有在这些里程碑实现后，价值才可能高于报道中的约 $3B 8 月估值；目前无法支持任何内在价值区间。
        - 只有在出现第三方部署和经济性证据后，方向性判断才会改善；未赋予数值概率。
        - 独立结果无法复现单项任务可靠性，或客户未能从早期访问转化。
      - - 基准
        - 技术潜力仍在，但商业证明和经营经济性依然有限。
        - 约 $2B 的 6 月估值到报道中的约 $3B 8 月估值构成融资参考区间，不是公允价值估计，也不是目标回报区间。
        - 当前证据最符合这一情景：融资信息可见，但客户和财务证据不可得。
        - 在披露生产或收入里程碑前，还需要另一轮大额融资。
      - - 悲观
        - 性能无法泛化，部署仍需定制，或资本消耗长期维持高位。
        - 重新定价至低于约 $2B 的 6 月参考值是可能的，但公开证据无法量化下限或损失分布。
        - 若错过部署里程碑、基准结果不利或融资条款不利，这一情景的可能性会上升。
        - 可靠性、安全性、客户 ROI 或流动性证据无法达到投资委员会门槛。
    notes: 情景边界是对报道融资估值的方向性参考，不是概率加权的内在价值；由于缺少必要的私有数据，概率和目标回报仍未量化。
    claimRefs:
