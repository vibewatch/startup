              - CO007
              - CO016
      - number: '1.3'
        title: 融资、估值与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的规模信号来自融资，而非商业披露。多个独立来源称 Generalist AI 于 2026 年 6 月 4 日以 $2 billion 估值融资 $400 million，累计融资超过 $500
              million。NeuronFeed 另称，公司在 2025 年初完成了 $12.5 million 种子轮和 $128 million A 轮。6 月轮由 Radical Ventures
              领投，新老机构投资者共同参与，包括 8VC、Union Square Ventures、Hanabi Capital、Norwest、NVIDIA、Boldstart、Spark Capital、Bezos
              Expeditions 和 NFDG。已募集资金不等于可用现金，现有证据也没有披露烧钱速度、现金跑道、债务、收入、ARR、定价或客户数。这些缺口使商业阶段或流动性评估无法得到充分支持。
