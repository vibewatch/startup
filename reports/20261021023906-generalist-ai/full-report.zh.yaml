  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 当前证据
      - 哪些情况会改变判断
    rows:
      - - 投资逻辑
        - 与硬件无关的智能层有机会在多个机器人平台上捕获价值。
        - Generalist 报告称，GEN-1 的单项任务可靠性明显高于上一代模型，并已提供早期访问。
        - 在多个硬件平台上独立部署，并证明可重复的客户经济性。
      - - 投资逻辑
        - 自研的物理交互数据集可能改善任务适配和数据效率。
        - Generalist 报告称拥有超过 500,000 小时的物理交互数据，单项任务适配约需一小时机器人数据。
        - 第三方复现显示，相比匹配基线，其迁移、成本和性能更具优势。
      - - 反向逻辑
        - 实验室或单项任务的成功可能无法泛化到生产环境。
        - 公司称并非所有尝试的任务都能达到 99%+，而独立报道将这一头条结果称为内部基准。
        - 提供持续一段时间的客户现场结果，包括事故率、干预频率、正常运行时间和吞吐量。
      - - 反向逻辑
        - 资本密集度可能超过商业化进度，并增加稀释风险。
        - 资金投向数据基础设施、算力、测试和部署，但收入、烧钱速度、现金跑道和优先权均未公开。
        - 经审计财务报表、签约收入、完全稀释股权结构表，以及与里程碑挂钩的融资计划。
    notes: 公司产品主张均明确标注；独立来源提供背景和限定，但没有独立复现 GEN-1 结果。
