      - number: '7.5'
        title: 缓释、监控与投资逻辑破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              在没有安全论证、独立基准测试协议、事故日志、部署层面服务数据和合同证据之前，缓释成熟度不能评为早期以上。近期缓释措施应包括限定运营范围、人工接管、部署前危害分析、逐任务验收阈值、硬件认证、分阶段上线，以及明确
              Generalist、机器人供应商和客户之间的责任。投资逻辑破坏触发条件是可衡量的：在独立硬件上反复无法复现已披露表现；发生重大安全事故却没有透明补救；无法证明所需批准或数据权利；在没有连续性计划的情况下依赖单一硬件或算力供应商；或者在商业证明前消耗融资，使剩余现金跑道低于约定水平。
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR009
              - CR010
              - CR012
              - CR015
              - CR016
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 首要退出标准
            body: 如果独立测试无法在多个机器人本体和真实设施中复现部署级表现，或在规模化前无法记录安全、数据权利和事故控制，就应停止该投资逻辑或大幅重估价格。
            calloutType: risk
            claimRefs:
