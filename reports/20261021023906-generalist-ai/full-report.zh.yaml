      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Generalist 的潜在护城河是物理数据飞轮：基于公司报告的超过 50
              万小时交互数据训练的模型，可能无需从头重建每项策略，就能适配不同本体和任务。持久性取决于能否把这套语料转化为经独立验证的可靠性，以及能否通过部署持续回收专有运营数据。同样的横向定位也带来暴露。机器人 OEM
              可能垂直整合，在位厂商可能把模型与算力和仿真捆绑，客户在安全认证或数据权利占主导时也可能偏好内部控制。由于留存证据池中没有独立复现，当前优势最好视为资金充足的技术领先假设，而非已证明的锁定效应。切换成本、数据所有权、多归属和合作伙伴排他性仍需尽调。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP011
              - CP016
