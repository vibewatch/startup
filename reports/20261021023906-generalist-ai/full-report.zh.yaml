  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场的边界比“机器人”更窄，又比单一机器人形态更宽。Generalist AI 将 GEN-1
              描述为一种不依赖特定硬件、面向灵巧工作的物理智能系统，因此相关核心是让机器人完成多变物理任务的软件和数据层。机器人本体、执行器、工厂单元和系统集成属于配套支出，而不是 Generalist
              已披露的产品范围。公开展示的初始用例包括装配、折叠、包装和设备维护；这些支持工业操作这一切入点，但不能据此假定所有人形机器人或服务机器人支出都可触达。现有替代方案包括固定自动化、任务专用控制栈、内部机器人团队，以及在灵活性或异常处理价值仍超过自动化经济性的场景中使用人工。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM014
      - number: '2.2'
        title: 规模证据及其局限
        blocks:
          - type: paragraph
            body: >-
              现有证据提供了三个宽泛指标，但没有 Generalist 的自下而上市场规模。一份二级市场分析引用了 2035 年 $38 billion 的人形机器人预测、截至 2033 年机器人领域 AI 超过 30% 的
              CAGR，以及 2025 年服务机器人类别超过 70% 的增长。这些指标覆盖不同产品、时期和分母，均未说明跨本体模型提供商可获得的份额。$400 million 融资轮和超过 $500 million
              的据报道累计融资，说明投资者愿意为这一类别提供资金，但不代表客户支出或市场需求。因此，下面的规模判断会把宽泛的相邻市场收窄到公司具体机会，不会把这些代理指标相加，也不会将其转化为没有依据的收入潜力。
            claimRefs:
