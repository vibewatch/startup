  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与证据边界
        blocks:
          - type: paragraph
            body: >-
              建议观察 Generalist AI，在判断入场价格前要求大幅增加尽调。多个独立来源报告 2026 年 6 月完成 $400 million 融资、估值约 $2 billion，但后续约 $200
              million、估值约 $3 billion 的扩展融资只见于二手报道，而该报道本身也要求进行一手验证。产品进展在方向上令人鼓舞：Generalist 报告 GEN-1
              在选定任务上的可靠性和速度显著提高。然而这些结果不是独立的生产基准，公司也称并非每个尝试任务都达到报告的可靠性水平。这样的证据组合支持高风险、低置信度的估值判断，而不是公司质量结论或精确的公允价值估计。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
