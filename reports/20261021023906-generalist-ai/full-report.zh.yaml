      - number: '3.2'
        title: 能力差异化与证明质量
        blocks:
          - type: paragraph
            body: >-
              Generalist 声称最强的差异化在于跨本体迁移、大规模专有物理交互语料库和快速任务适配的组合。其 2026 年 4 月发布的 GEN-1 报告称，在选定任务上的平均成功率为 99%，GEN-0 为
              64%；引用案例的执行速度约快三倍，每项任务约使用一小时机器人数据。这些是有意义的产品假设，而非独立基准测试。Generalist
              自己也称部分尝试任务未达到上述成功率，部分应用需要更高可靠性或速度。缺乏共同的第三方试验，使能力排名只能作为方向性判断；这也阻止买方将研究结果转化为部署级失败率比较。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
      - number: '3.3'
        title: 产品包装、定价与分销能力
        blocks:
          - type: paragraph
            body: >-
              当前可见的商业形态是早期访问，而非标准化产品目录。Generalist 在 GEN-1 发布时邀请早期访问合作伙伴联系公司，但一家目录仍将其描述为商业化前公司，没有公开产品或
              API。后续第三方报道描述了两条可能的交付路径：Generalist
              可以提供模型加硬件的组合，或者具备机器人能力的客户可以在自己的机械臂上运行模型。这种灵活性可能扩大分销，但留存证据中没有公开价目表或确定的计费模式。公司据报道超过 $500 million
              的累计融资支持持续进行模型和集成工作；这不是收入、ARR、可用现金，也不是可重复客户经济性的证据。
            claimRefs:
