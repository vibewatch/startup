              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              6 月估值是最强的可观察融资锚点；8 月估值应视为据报道的信号，而非经验证的当前估值。融资将用于物理数据引擎、算力、真实世界测试和商业部署，这些都是资本密集型活动。留存证据没有披露收入或
              ARR、定价或付费客户数，也没有披露烧钱、现金跑道、债务、清算优先权和其他股权结构条款。因此，已募集资金不能视为可用现金，轮次估值也不能直接转化为所有权经济性或回报潜力。入场纪律应以一手融资文件、完全摊薄后的资本结构、优先权条款、现金余额、已承诺支出和自下而上的运营计划为条件，而不是只看
              headline valuation。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 以证据为边界的乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于公开记录不足以支持内在估值，情景分析必须保持相对性。乐观情景要求独立复现 GEN-1 表现、在不止一个硬件平台上实现生产部署，并形成足以支撑高于据报道 8 月估值的经济性。基准情景将约 $2 billion
              的 6 月估值和未经确认的约 $3 billion 8 月估值视为融资参考区间，而非公允价值。悲观情景是：如果部署证据停滞、可靠性在选定任务之外失效，或资本消耗被证明结构性偏高，估值将低于 6
              月参考值。Physical Intelligence 和 Figure AI 的报告估值只能提供类别背景；它们的策略不同，二手数据也未经标准化，不能视为独立表现基准或直接可比交易倍数。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、决策触发与尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开退出准备度有限。Generalist 宣布提供早期访问，而独立报道警告不应把演示与 OEM
              部署合同混为一谈。留存来源没有一项确认付费客户、经常性收入、定价或经审计的经济性。要作出有利决策，必须有独立测量的生产可靠性和吞吐量、签署的客户证据、部署层面的毛利率和支持成本数据，以及在摊薄后仍能保留合理目标回报的融资条款。投资逻辑破坏触发条件包括：无法在客户环境中复现选定任务结果；在没有商业里程碑的情况下反复依赖大额融资；或在没有相应收入和部署证据时，价格高于据报道的融资估值。眼下的尽调路径是技术基准测试、客户推荐访谈、模型层面的运营数据，以及完整的资本结构和流动性资料包。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决策规则
            body: 只有在独立生产基准测试、签署的客户证据、单位经济性和完整融资条款支持特定价格下的目标回报后，才从观察转为投资判断。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: callout
            title: 不要把融资等同于流动性
            body: 留存来源报告的是融资金额，而非当前现金、烧钱、现金跑道、所有权或优先权悬垂；这些输入仍是直接的尽调要求。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV014
              - CV016
