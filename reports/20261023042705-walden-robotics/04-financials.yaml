      - [Robots as a service, "Fees to use robots rather than an outright sale", "Per robot, site, task, or hour; undisclosed", "Direction reported from a founder interview; no public rate", "Third-party reported direction, not a rate card", "Obtain price schedules, minimum commitments, service scope, and renewal terms"]
      - [Hardware sale, "Possible alternative to service delivery", "Per robot; undisclosed", "No reviewed evidence supports a Walden hardware list price or sale contract", "Unsupported as a current Walden stream", "Confirm whether hardware is sold, financed, leased, or bundled"]
      - [Software or AI layer, "Large Behavior Models and the application layer support the robot", "Per robot, site, API, or usage; undisclosed", "No separately disclosed software revenue", "Company-described architecture, not a revenue stream", "Request software allocation, recurring fees, usage measures, and margin treatment"]
    notes: "Public sources distinguish deployment claims and a reported RaaS direction from realized revenue; undisclosed values are evidence gaps, not zero."
    claimRefs: [CI004, CI005, CI006, CI007, CI010]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Item, Price or contract evidence, Comparability, Confidence, Required evidence]
    rows:
      - [Walden list price, "No public rate card in the reviewed evidence", "Direct Walden input, but unavailable", low, "Request current list and realized price by configuration"]
      - [Walden RaaS fee, "Fee-for-use direction reported; billing basis and amount unavailable", "Direct Walden direction, not an executed-contract sample", medium, "Obtain contract schedule, minimum term, service inclusions, and overage rules"]
      - [1X NEO purchase, "$20,000 reported by Sacra", "Consumer home robot; not a Walden industrial benchmark", medium, "Do not extrapolate; use only to test alternative hardware-sale structures"]
      - [1X NEO rental, "$499 per month with a six-month minimum reported by Sacra", "Consumer home robot; not a Walden industrial benchmark", medium, "Do not extrapolate; request Walden-specific realized RaaS pricing"]
    notes: "Competitor pricing is shown only as an alternative monetization structure and is not an independent benchmark for Walden's industrial contract economics."
    claimRefs: [CI005, CI006, CI010, CI015]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Recognized revenue and ARR, null, low, "Scale and revenue quality cannot be tested without accounting-period data", "Monthly revenue by customer, product, geography, and accounting basis"]
      - [Gross margin, null, low, "Hardware, service labor, compute, and support may determine scalability", "Contribution margin per deployed robot and fully loaded service cost"]
      - [CAC and payback, null, low, "Enterprise robotics sales can require long cycles and deployment work", "Sales funnel, cycle length, acquisition cost, implementation cost, and payback"]
      - ["Cash balance, burn, and runway", null, low, "Funding raised does not reveal cash duration", "Monthly cash burn, cash balance, committed spend, hiring, capex, and financing trigger"]
      - [Capex per deployment, null, low, "Site infrastructure and fleet support can shift economics", "Hardware, tooling, installation, safety, charging, spares, and working-capital schedule"]
      - [Utilization and uptime, null, low, "Revenue capacity depends on productive hours and intervention burden", "Robot-level uptime, productive utilization, remote-assistance minutes, and incident logs"]
    notes: "All null values are unavailable in the reviewed public evidence; each row identifies the private evidence required rather than treating missing values as zero."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI014, CI016]
