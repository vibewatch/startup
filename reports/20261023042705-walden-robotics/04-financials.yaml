    title: Financial disclosure gap
    body: Public evidence does not disclose realized revenue, pricing, gross margin, burn, runway, debt, or customer-level unit economics; the valuation therefore cannot be tested with a conventional operating model.
    claimRefs: [CI002, CI010, CI011, CI014]
  - calloutType: strength
    title: Strategic financing and deployment signal
    body: The seed round is substantial and paired with a Toyota production reference, but financing and deployment evidence are not substitutes for recurring revenue and margin proof.
    claimRefs: [CI001, CI003, CI004]
