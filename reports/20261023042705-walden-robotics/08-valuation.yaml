- id: TV002
  title: Thesis / anti-thesis
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - Learning-based full-stack platform can expand task coverage
    - Full-stack architecture and Large Behavior Models are described by Walden
    - Measured task-transfer, uptime, and gross-margin evidence
  - - Toyota-linked production proof reduces commercialization uncertainty
    - Production work at a Toyota plant is reported since February 2026
    - Repeat-site deployments and paid customer references beyond Toyota
  - - Strategic syndicate validates financing access
    - Toyota and Deviation Capital co-led the announced round
    - Independent customer ROI and arm's-length financing terms
  - - Valuation may outrun proof
    - Independent coverage says success is not assured and unit economics need thought
    - Disclosed revenue, pricing, retention, burn, and preference terms
  notes: The evidence base contains company-issued and syndicated launch claims plus independent coverage; strategic investor
    participation is not treated as customer validation.
  claimRefs:
  - CV001
  - CV003
  - CV005
  - CV008
  - CV014
- id: TV003
  title: Bull / base / bear scenario
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signal
  rows:
  - - Bull
    - Production deployment expands across multiple industries; repeatable task learning and customer ROI are disclosed
    - Current financing mark could be defended or exceeded; no numerical target is supportable
    - Low without revenue, margin, and deployment-count evidence
  - - Base
    - Toyota proof remains genuine but customer breadth and economics stay opaque
    - Track / research-more; require a price or evidence improvement before entry
    - Most supportable from current public record
  - - Bear
    - Commercialization stalls, unit economics disappoint, or concentrated proof fails to generalize
    - Down-round or impaired exit value is plausible; range cannot be quantified from assigned data
    - Material downside risk; trigger diligence on paid deployments and cash
  notes: Scenarios are qualitative because the assigned sources do not disclose revenue, pricing, margin, burn, runway, cap-table
    terms, or preference structure.
  claimRefs:
  - CV003
  - CV007
  - CV008
  - CV014
