callouts:
  - calloutType: strength
    title: Early production proof
    body: A Toyota North America deployment reportedly progressed from first pilot to useful production work in under two months, providing stronger maturity evidence than a lab demonstration while leaving scale and economics unverified.
    claimRefs: [CE003, CE004]
  - calloutType: risk
    title: Evidence gap is operational, not conceptual
    body: Public materials explain the product thesis and research lineage but omit the reliability, safety, integration, and intervention metrics needed to distinguish a repeatable industrial system from a promising pilot.
    claimRefs: [CE009, CE012, CE013, CE014]
  - calloutType: recommendation
    title: Underwrite the deployment system, not only the model thesis
    body: |
      The next diligence step should test repeatability at the task and site level: uptime, intervention frequency, safety events, integration effort, update governance, and customer economics.
    claimRefs: [CE003, CE009, CE012, CE013, CE014]
