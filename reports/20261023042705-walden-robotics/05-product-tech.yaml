  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: deployment-gap
      missingEvidence: Task-level uptime, intervention frequency, throughput, failure recovery, and customer ROI for the Toyota deployment.
      whyItMatters: A pilot-to-production transition does not establish repeatability, economics, or operational criticality without denominators and time-series performance.
      diligencePath: Obtain a customer-approved deployment scorecard covering task mix, robot-hours, uptime, interventions, safety events, throughput, and labor or quality outcomes.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: architecture-gap
      missingEvidence: Production architecture, sensors, compute, APIs, fleet learning controls, and rollback procedures.
      whyItMatters: These details determine integration burden, scaling constraints, cyber exposure, and whether continuous learning can be safely governed.
      diligencePath: Request an architecture review, deployment interface documentation, change-control policy, and representative update or rollback records.
      relatedQuestionRefs: [QE002, QE003, QE005, QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: safety-gap
      missingEvidence: Safety case, certifications, incident history, human override design, and cybersecurity controls.
      whyItMatters: Industrial robots operate around people and equipment, so missing assurance evidence is a deployment and liability risk rather than a cosmetic disclosure gap.
      diligencePath: Request applicable conformity assessments, hazard analyses, incident logs, penetration-test summaries, and site acceptance criteria.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: roadmap-gap
      missingEvidence: A dated product roadmap covering capabilities, deployment milestones, integrations, and release criteria.
      whyItMatters: Without dated milestones, investors cannot distinguish committed delivery sequencing from a broad long-term product vision.
      diligencePath: Request the board-approved product roadmap with milestone owners, target dates, validation gates, and customer dependencies.
      relatedQuestionRefs: [QE009]
