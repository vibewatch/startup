              - CI007
              - CI008
              - CI010
              - CI014
      - number: '4.2'
        title: Cost structure and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The operating model is likely capital and service intensive, but the public record does not quantify
              Walden's cost stack. Walden says it is building the full stack across hardware, software, Physical AI, and
              applications. That scope creates potential exposure to hardware production, deployment engineering, field
              service, fleet operations, compute, safety processes, and ongoing model improvement, although public
              sources do not quantify any of those Walden-specific costs. Bain's industry analysis is an external risk
              benchmark rather than a Walden estimate: early humanoid deployments commonly remain in pilots with
              substantial human supervision, and most systems operate for only about two hours before charging. Those
              constraints make gross margin, labor substitution, uptime, remote-assistance burden, maintenance, battery
              operations, and customer payback central diligence items. No reviewed source provides Walden's CAC, sales
              cycle, contribution margin, cash cost per deployed robot, or capex per site.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Walden announced $300 million of seed funding at a $1.1 billion valuation, with Toyota and Deviation
              Capital co-leading and a broad strategic and financial syndicate. That amount is funding raised, not a
              disclosed cash balance or assurance of runway. The reviewed evidence provides no closing-condition detail,
              cash on hand, monthly burn, debt, project-finance obligation, committed capex, hiring plan, or next-round
              trigger. Competitive financing illustrates the category's appetite for capital without supplying a direct
              Walden benchmark: Reuters reported that Apptronik raised $520 million for product development, production
              expansion, facilities, and hiring, while TechCrunch reported that Physical Intelligence had already raised
              more than $1 billion and was discussing another roughly $1 billion despite having no commercialization
              timeline. These competitor examples are context only; they do not establish Walden's costs, valuation, or
              financing needs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is research-more. Walden appears well financed for an early build phase, and the
              Toyota production reference is a meaningful demand signal, but neither demonstrates revenue quality,
              positive unit economics, or durable capital adequacy. The central underwriting test is whether recurring
              service fees and fleet learning can increase productive utilization faster than hardware, deployment,
              intervention, compute, and support costs. Public evidence cannot currently answer that test. Diligence
              should bridge executed customer contracts to recognized revenue, robot-level utilization, customer ROI,
              gross profit, cash burn, and runway. It should also separate list or contracted pricing from realized
              pricing and distinguish financing proceeds from cash available. Until those records are produced, a
              conventional revenue or margin model would manufacture precision rather than reduce uncertainty.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial disclosure gap
            body: >-
              Public evidence does not disclose realized revenue, pricing, gross margin, burn, runway, debt, or
              customer-level unit economics; the valuation therefore cannot be tested with a conventional operating
              model.
            calloutType: risk
            claimRefs:
              - CI002
              - CI010
              - CI011
              - CI014
          - type: callout
            title: Strategic financing and deployment signal
            body: >-
              The seed round is substantial and paired with a Toyota production reference, but financing and deployment
              evidence are not substitutes for recurring revenue and margin proof.
            calloutType: strength
            claimRefs:
