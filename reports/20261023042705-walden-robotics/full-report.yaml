chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Walden Robotics launched from Toyota Research Institute in January 2026 and presents itself as a
              full-stack Physical AI company. Its public company page describes a product ambition spanning hardware,
              software, frontier-class Physical AI, and the application layer, with an initial focus on manufacturing
              and logistics. Third-party launch coverage describes general-purpose wheeled robots intended to learn
              physical tasks rather than rely only on hard-coded instructions. This gives Walden a coherent identity: a
              research-origin company attempting to commercialize an integrated industrial robotics system rather than a
              standalone robot chassis or software module. The evidence is still mostly launch-period disclosure, so the
              operating model should be treated as a stated strategy rather than proven recurring revenue or deployment
              scale.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO012
      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Russ Tedrake is publicly identified as co-founder and CEO, while MIT independently identifies him as a
              Toyota Professor, Director of the Center for Robotics at CSAIL, and a robotics researcher. The combination
              of academic standing, Toyota Research Institute experience, and direct leadership of the company supports
              founder-market fit for technically difficult physical-AI work. The assigned public evidence does not
              enumerate a board, executive bench, or governance controls, and it does not document material leadership
              changes. That absence is not evidence that governance is weak; it is a disclosure gap that matters because
              industrial deployments require safety, reliability, customer escalation, and capital-allocation
              accountability beyond a founder-centric narrative.
            claimRefs:
              - CO010
              - CO011
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO010
              - CO011
              - CO016
      - number: '1.3'
        title: Capitalization, stakeholders, and strategic leverage
        blocks:
          - type: paragraph
            body: >-
              The launch announcement reports a $300 million seed round at a $1.1 billion valuation, co-led by Toyota
              and Deviation Capital. The investor list spans automotive, AI compute, aerospace, electronics, logistics,
              and financial investors, which could provide strategic access to industrial settings as well as capital.
              Toyota is both the company’s origin and the reported production site, creating unusually strong initial
              alignment but also concentration in the public proof set. The evidence supports funding and strategic
              participation; it does not disclose ownership percentages, liquidation preferences, debt, cash balance,
              burn rate, or runway. Those omissions prevent a financing-risk conclusion from being reduced to the
              headline amount raised.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO014
      - number: '1.4'
        title: Milestones, traction, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Walden’s reported path from January founding to February production work and July public launch is
              unusually compressed. Coverage says robots were performing tasks such as parts movement, machine cleaning,
              kitting, machine tending, and tool setting at a Toyota plant in North America. This is meaningful
              deployment evidence, but it is not the same as disclosed paid revenue, repeat-site expansion, uptime,
              safety certification, gross margin, or customer ROI. The Next Web also quotes Tedrake warning that success
              is not assured and that unit economics require deliberate consideration. The central diligence question is
              therefore not whether Walden has a credible launch narrative, but whether the Toyota-linked deployment can
              generalize into independently evidenced, economically durable industrial scale.
            claimRefs:
              - CO006
              - CO007
              - CO012
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO014
              - CO015
              - CO016
