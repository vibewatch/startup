    title: Publicly evidenced product architecture
    type: stack
    summary: >-
      Walden's disclosed product spans hardware, behavior models, application integration, and human-operated industrial
      deployment, with several implementation details still unreported.
    data:
      layers:
        - label: Industrial deployment
          detail: >-
            Public materials describe an initial focus on production deployments and report useful work at a Toyota
            plant in North America.
          modules:
            - Manufacturing and logistics production work
        - label: Human operations
          detail: >-
            The stated workflow keeps people at the center and uses expert collaboration to improve industrial
            deployment.
          modules:
            - Skilled workers and expert deployment teams
        - label: Application layer
          detail: >-
            Walden says it is building an application layer, but public interfaces and acceptance criteria are not
            disclosed.
          modules:
            - Customer task and site integration
        - label: Physical AI
          detail: >-
            The company describes LBMs as the model class powering robots that learn new tasks and improve through
            practice.
          modules:
            - Large Behavior Models
        - label: Robot hardware
          detail: Public materials describe a full-stack robot but do not specify model, payload, sensors, or fleet size.
          modules:
            - General-purpose industrial robot
        - label: Research lineage
          detail: >-
            Academic sources describe visuomotor diffusion policies and benchmarks; this is technical lineage, not a
            Walden production specification.
          modules:
            - Diffusion Policy and related robotics research
