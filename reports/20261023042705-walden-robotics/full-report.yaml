          detail: Investor-customer relationship creates factory access but also concentration.
        - id: pilot
          label: Pilot
          title: North American Toyota plant
          touchpoints:
            - First pilot reported in February 2026
            - Controlled industrial environment
          detail: The public record does not disclose robot count or paid status.
        - id: production
          label: Production work
          title: Live factory operation
          touchpoints:
            - Useful work in production in under two months
            - Eight-hour shifts beside human teams reported
          detail: Task-level economics, uptime, and intervention rates are not disclosed.
        - id: workflow-expansion
          label: Workflow expansion
          title: More tasks or sites
          touchpoints:
