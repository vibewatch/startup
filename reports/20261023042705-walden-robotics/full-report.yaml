  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and current workflow
        blocks:
          - type: paragraph
            body: >
              Walden's customer-facing product is a general-purpose robot deployed into manufacturing and logistics work
              rather than a software-only tool. The company says it combines hardware, software, frontier-class Physical
              AI, and an application layer, while The Next Web describes a humanoid upper body on a wheeled base rather
              than a walking platform. The launch announcement describes robots working side-by-side with people and
              helping skilled workers delegate difficult-to-automate tasks. The strongest public deployment signal is a
              Toyota plant in North America: the company and contemporaneous coverage say robots moved from a first
              pilot to useful production work in under two months, beginning in February 2026; The Next Web further
              reported one robot working eight-hour shifts on parts handling, machinery cleaning, and kitting. That is
              meaningful evidence of an operating customer workflow, but it does not establish fleet size, uptime,
              intervention rate, economics, or repeatability across sites.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE010
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
