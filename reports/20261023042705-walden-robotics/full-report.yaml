    title: Customer journey from anchor deployment to repeatable expansion
    type: journey-map
    summary: >-
      The evidence supports a Toyota-anchored path from strategic relationship to pilot and initial production, while
      repeatable multi-customer expansion remains an open diligence step.
    data:
      nodes:
