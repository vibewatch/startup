        - date: January 2026
          label: Spinout
          details: Walden launches from Toyota Research Institute as a general-purpose Physical AI company.
          tone: positive
        - date: February 2026
          label: Production work begins
          details: Walden says its robots begin useful work at a Toyota plant in North America.
          tone: positive
        - date: July 15, 2026
          label: Public launch
          details: Company emerges from stealth with reported $300 million seed funding.
          tone: positive
        - date: July 15, 2026
          label: Valuation disclosed
          details: Launch coverage reports a $1.1 billion post-money valuation.
          tone: positive
        - date: July 15, 2026
          label: Industrial task set described
          details: >-
            Coverage reports parts movement, machine cleaning, kitting, machine tending, tool setting, and parts
            preparation.
          tone: positive
        - date: '2026'
          label: Strategic partner base presented
          details: >-
            Launch materials name participants across automotive, aerospace, semiconductors, electronics, logistics, and
            infrastructure.
          tone: neutral
        - date: '2026'
          label: Scale question remains
          details: Public evidence does not establish repeat-site expansion, revenue, uptime, or unit economics.
          tone: warning
        - date: '2026'
          label: Governance question remains
          details: Public sources do not enumerate a complete board or executive roster.
          tone: warning
