              - CE004
              - CE005
              - CE010
              - CE016
      - number: '5.2'
        title: Architecture, learning loop, and maturity
        blocks:
          - type: paragraph
            body: >
              The disclosed architecture is intentionally broad: Walden says it is building the full stack and
              identifies Large Behavior Models as the model class powering robots that learn new tasks and improve
              through real-world practice. The underlying Diffusion Policy research provides a concrete technical
              lineage rather than evidence that Walden's production system is identical to the published implementation.
              The paper describes conditional denoising diffusion for visuomotor policy generation, receding-horizon
              control, visual conditioning, and high-dimensional action spaces, with a reported average success-rate
              improvement of 46.9% across 12 tasks and four benchmarks. That benchmark result belongs to the academic
              work and should not be transferred to Walden's customer deployment. The architecture remains only
              partially observable because public materials do not specify sensors, compute, control stack, fleet
              learning controls, deployment interfaces, or rollback behavior.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
