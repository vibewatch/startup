evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Paid deployment pricing, gross margin, support burden, customer ROI, and cash conversion for the Toyota work.
    whyItMatters: >-
      A production deployment can still be uneconomic; these measures determine whether the launch narrative can support
      durable industrial scale and the reported valuation.
    diligencePath: >-
      Request customer contract economics, deployment P&L, uptime-linked service costs, and a reference call with the
      Toyota operating team.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: customers
    missingEvidence: A complete list of pilots, production customers, sites, and repeat deployments beyond Toyota.
    whyItMatters: >-
      The public proof set may represent strategic concentration rather than repeatable demand across independent
      buyers.
    diligencePath: >-
      Obtain a dated customer/site roster with deployment stage, paid status, task scope, and renewal or expansion
      evidence.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete founder and executive roster, board composition, decision rights, and safety-accountability structure.
    whyItMatters: >-
      Industrial robotics requires operational and safety governance that cannot be inferred from one highly qualified
      technical founder.
    diligencePath: >-
      Request the current board and leadership roster, committee responsibilities, and safety incident escalation
      policy.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: scale-metrics
    missingEvidence: Current headcount, revenue or ARR, cash balance, burn rate, runway, debt, and valuation terms.
    whyItMatters: >-
      The reported funding amount is not equivalent to cash available or operating durability, and the valuation is not
      testable without financial context.
    diligencePath: Request management financials, capitalization table, financing documents, and a current operating plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A bottom-up market model with target-site counts, workflow-level pricing, deployment costs, and realistic
      penetration assumptions.
    whyItMatters: Installed units and workforce counts do not establish Walden's serviceable revenue pool or valuation support.
    diligencePath: Obtain management's site-level pipeline, pricing, implementation assumptions, and a reconciled TAM/SAM/SOM model.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: Paid contract terms, utilization, uptime, labor substitution, integration hours, support burden, and customer ROI.
    whyItMatters: A single reported production deployment can prove access without proving repeatable unit economics.
    diligencePath: Request redacted Toyota and other customer deployment scorecards, invoices, SLA metrics, and expansion history.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: safety
    missingEvidence: Deployment-specific risk assessments, certifications, incident records, and rollback governance.
    whyItMatters: General standards guidance does not establish that Walden's deployed system meets site-specific requirements.
    diligencePath: Review customer safety cases, third-party assessments, incident logs, and change-control procedures.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Industrial list and realized pricing, service fees, consumables, and contract structure for Walden and comparable
      peers.
    whyItMatters: >-
      Pricing and service burden determine whether full-stack deployment can scale and whether visible peer prices are
      economically comparable.
    diligencePath: Request anonymized customer quotes, contract schedules, implementation invoices, and renewal or expansion terms.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: deployment
    missingEvidence: Matched task-level uptime, throughput, intervention, safety, and ROI data across Walden and peer deployments.
    whyItMatters: >-
      Public deployment anecdotes cannot establish a performance or cost advantage over humanoids, fixed automation, or
      labor.
    diligencePath: Obtain site logs, safety records, acceptance tests, and customer references for comparable workflows.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Customer contract duration, exclusivity, data rights, and expansion history for Walden's production deployment.
    whyItMatters: These terms determine whether the claimed learning loop creates durable switching costs or only supports a pilot.
    diligencePath: Review executed customer agreements, data-processing terms, and renewal or multi-site expansion evidence.
    relatedQuestionRefs:
      - QP007
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: Comparable independently verified capitalization and valuation data for private physical-AI peers.
    whyItMatters: >-
