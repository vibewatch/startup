      - ["Factory deployment", "Toyota North America production work claimed since February 2026", "Agility reports 65,000+ hours across nine facilities", "Walden has an early proof point but less disclosed duration", "Site-level uptime, intervention rate, and expansion history"]
      - ["Safety and human interaction", "Walden release says robots work side-by-side with people", "Agility positions cooperative safety as a critical adoption requirement", "Safety posture is not independently comparable", "Certifications, incident logs, rollback controls, and insurance requirements"]
      - ["Pricing and packaging", "No public list or realized industrial price found in assigned sources", "1X reports $20,000 purchase or $499/month rental for NEO", "Industrial pricing and service burden are unknown", "Quote, contract, service, and consumables economics"]
      - ["Distribution and integration", "Full-stack application layer and strategic partners claimed", "Agility Arc integrates fleet deployment and operations; openpi offers developer tooling", "Walden may control more of the deployment stack but scale could be slower", "Integration time, channel ownership, and partner exclusivity"]
      - ["Manufacturing scale", "Walden manufacturing scale not disclosed", "Agility says RoboFab is designed for up to 10,000 units annually", "Walden scale is an unresolved constraint", "Production yield, supplier concentration, lead times, and capex"]
      - ["Data flywheel", "Real-world operation and continuous improvement are company-described", "Agility says deployment data improves embodied-AI systems; Physical Intelligence uses robot data and open experimentation", "Potential moat is conditional on data rights and measurable learning gains", "Data ownership, retention, and improvement per deployment"]
    notes: The comparison separates published facts from interpretation; unknown cells are explicit gaps rather than estimates.
    claimRefs: [CP010, CP011, CP012, CP013, CP014, CP015]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    summary: Walden is positioned as factory-first and full-stack, while peers show stronger public evidence on scale, open distribution, or visible pricing.
    type: quadrant
    data:
      points:
        - {label: Walden Robotics, x: 4, y: 4, detail: "Factory-first and full-stack; public scale and pricing remain limited"}
        - {label: Agility Robotics, x: 5, y: 5, detail: "Commercial deployments, reported operating hours, and manufacturing infrastructure"}
        - {label: Apptronik, x: 4, y: 3, detail: "Industrial target and strategic customer agreements; comparative operating data limited"}
        - {label: Physical Intelligence, x: 3, y: 4, detail: "General-purpose model and openpi distribution; commercialization timing remains uncertain"}
        - {label: 1X Technologies, x: 3, y: 2, detail: "Visible consumer pricing and teleoperation path; industrial comparability limited"}
        - {label: "Conventional fixed automation", x: 5, y: 2, detail: "Established workflow validation; flexibility and generalization are limited"}
    approximationNotes: >-
      The x coordinate is ordinal public deployment evidence and the y coordinate is ordinal
      integration and platform breadth, each scored from 1 to 5 using only the cited public evidence.
      These are not performance benchmarks, market shares, or independent rankings; missing evidence
      is treated as a diligence limitation rather than a zero capability.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010, CP011]
callouts:
  - calloutType: strength
    title: Factory-first positioning
    body: Walden's strongest public differentiator is the combination of a Toyota production deployment claim and a full-stack architecture aimed at manufacturing and logistics.
    claimRefs: [CP001, CP005, CP010]
  - calloutType: risk
    title: Moat remains unmeasured
    body: No assigned source supplies comparable pricing, uptime, intervention, safety, or customer-ROI data, so a durable advantage cannot yet be separated from category-wide positioning.
    claimRefs: [CP014, CP015, CP017]
  - calloutType: recommendation
    title: Underwrite against deployment economics
    body: The next competitive diligence step should compare matched task performance and total deployment cost across Walden, humanoid peers, fixed automation, and the staffed status quo.
    claimRefs: [CP015, CP017]
