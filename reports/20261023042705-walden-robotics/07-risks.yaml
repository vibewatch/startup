      - [Machinery conformity and market access, European Union, "Regulation (EU) 2023/1230 sets health and safety requirements for machinery and related products", medium, high, "No Walden conformity assessment or responsible economic operator is public", high, "Map product scope, technical file, conformity route, and Union economic operator"]
      - [AI safety-component obligations, European Union, "AI Act identifies AI-based safety components of products as high-risk and requires post-market monitoring for high-risk systems", medium, high, "Applicability and transition treatment are not established", high, "Obtain legal classification, monitoring plan, incident-reporting process, and deployment geography"]
      - [Product and software liability allocation, multi-jurisdiction, "Connected-robot guidance highlights shared responsibility across manufacturer, developer, owner, and user", medium, high, "Contractual allocation is not public", high, "Review indemnities, insurance, update authority, and customer acceptance criteria"]
    notes: "This is a partial public-source register, not an exhaustive legal opinion. Applicability depends on product configuration, deployment geography, customer role, and final regulatory classification."
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and legal materials reviewed for United States, European Union, and connected-robot liability issues as of 2026-10-23"
    claimRefs: [CR005, CR006, CR007, CR008, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Strategic capital and first production proof, Toyota, "Co-lead investor and named North American production customer", "One publicly identified production customer", "Strategic relationship does not translate to independent customer expansion", high, "Disclose independent deployments and customer-level economics", high]
      - [Model and deployment data, customer sites and operators, "Demonstrations and real-world practice improve task behavior", "Data rights and coverage are undisclosed", "Insufficient or non-transferable data slows generalization", high, "Document consent, ownership, reuse rights, and validation coverage", medium-high]
      - [Cloud and networked operations, enterprise and cloud platforms, "Connected systems can affect safety and cybersecurity", "Architecture and segmentation are undisclosed", "Compromise or outage changes physical behavior or stops production", critical, "Provide threat model, segmentation, update controls, and recovery tests", high]
      - [Specialized manufacturing and robotics talent, Walden team and vendors, "Full-stack hardware, software, and application delivery", "Young company with concentrated execution scope", "Hiring, supplier, or integration bottleneck delays deployment", high, "Show staffing plan, supplier redundancy, and service capacity", medium-high]
    notes: "Dependency concentration is assessed from public disclosures and explicit unknowns; no revenue concentration, supplier share, or staffing denominator is publicly established."
    claimRefs: [CR002, CR003, CR009, CR013, CR014]
