callouts:
  - calloutType: strength
    title: Practical entry point
    body: "Walden's wheeled, production-oriented approach is aligned with an existing industrial-robot safety and workflow context, while its Toyota relationship provides unusually direct access to a manufacturing environment."
    claimRefs: [CM002, CM012, CM015]
  - calloutType: risk
    title: Market size is not yet underwriting size
    body: "The available numbers describe robotics installations, workforce scale, funding, and valuation; none establishes Walden's revenue opportunity, pricing, utilization, or repeatable customer economics."
    claimRefs: [CM005, CM006, CM008, CM013]
  - calloutType: recommendation
    title: Obtain deployment economics
    body: "Prioritize customer-level evidence on paid status, utilization, uptime, labor substitution, integration hours, gross margin, safety approvals, and expansion beyond Toyota before treating the broad robotics market as Walden's serviceable market."
    claimRefs: [CM013, CM016, CM017]
