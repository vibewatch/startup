    notes: "Values use the source's own units and periods. The lenses are not additive and do not create a TAM/SAM/SOM conversion."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Automotive manufacturing, "Plant operations or corporate automation", "Skilled production workers", "Plant or capital budget", "Repetitive tasks not friendly to conveyors or fixed arms", "Operations and automation", "High utilization and production proof"]
      - [Aerospace and electronics, "Manufacturing engineering", "Technicians and craftspeople", "Business-unit capital or operations", "Variable work requiring human-space access", "Engineering and quality", "Labor scarcity plus task flexibility"]
      - [Logistics, "Warehouse or network operations", "Warehouse workers", "Distribution-center operations", "Material movement and manipulation", "Site or network automation", "Throughput and labor-cost pressure"]
      - [Life sciences and other advanced manufacturing, "Site operations and safety", "Operators and technicians", "Site or corporate capital", "Tasks requiring adaptable handling", "Operations and compliance", "Safety case and integration readiness"]
    notes: "Buyer and payer roles are an evidence-constrained operating model, not disclosed Walden contracts; validate with customer interviews and proposals."
    claimRefs: [CM003, CM010, CM011, CM012]
