  topStrengths:
    - Early production proof at a Toyota plant and a rapid reported pilot-to-production transition.
    - Full-stack Physical AI positioning grounded in a deep robotics research lineage.
    - Significant strategic and financial backing for a seed-stage industrial robotics company.
  topRisks:
    - Customer concentration and limited disclosed evidence of repeatable deployments beyond Toyota.
    - Missing pricing, margin, burn, runway, reliability, safety, and ROI metrics.
    - A $1.1 billion reported valuation is difficult to underwrite without commercial-scale evidence.
  unresolvedGaps:
    - Paid deployment economics, including pricing, gross margin, support burden, and customer ROI.
    - Customer breadth beyond Toyota, including pilots, production customers, and repeat-site expansion.
    - Reliability, safety, certification, incident history, and rollback governance.
    - Burn rate, capex plan, cash management, and future financing requirements.
    - Governance depth beyond the publicly visible founder-centric narrative.
