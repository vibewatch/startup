  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Paid deployment pricing, gross margin, support burden, customer ROI, and cash conversion for the Toyota
      work.
    whyItMatters: A production deployment can still be uneconomic; these measures determine whether the launch narrative can
      support durable industrial scale and the reported valuation.
    diligencePath: Request customer contract economics, deployment P&L, uptime-linked service costs, and a reference call
      with the Toyota operating team.
    relatedQuestionRefs:
    - QO005
    - QO008
  - type: enumeration-incomplete
    severity: material
    topic: customers
    missingEvidence: A complete list of pilots, production customers, sites, and repeat deployments beyond Toyota.
    whyItMatters: The public proof set may represent strategic concentration rather than repeatable demand across independent
      buyers.
    diligencePath: Obtain a dated customer/site roster with deployment stage, paid status, task scope, and renewal or expansion
      evidence.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete founder and executive roster, board composition, decision rights, and safety-accountability
      structure.
    whyItMatters: Industrial robotics requires operational and safety governance that cannot be inferred from one highly qualified
      technical founder.
    diligencePath: Request the current board and leadership roster, committee responsibilities, and safety incident escalation
      policy.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: scale-metrics
    missingEvidence: Current headcount, revenue or ARR, cash balance, burn rate, runway, debt, and valuation terms.
    whyItMatters: The reported funding amount is not equivalent to cash available or operating durability, and the valuation
      is not testable without financial context.
    diligencePath: Request management financials, capitalization table, financing documents, and a current operating plan.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO001
