  - CO014
  - CO015
  - CO016
- calloutType: recommendation
  title: Treat scale as an open diligence question
  body: The launch is credible enough to merit continued diligence, but the reported valuation cannot be underwritten from
    public evidence without independent customer and unit-economic proof.
