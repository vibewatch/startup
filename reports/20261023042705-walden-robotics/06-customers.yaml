        - id: customer-diversification
          label: Customer diversification
          title: Non-investor production customers
          touchpoints: ["Aerospace, semiconductor, electronics, logistics, and life-sciences targets named", "No non-Toyota production customer disclosed"]
          detail: "This is the key evidence milestone for reducing concentration risk."
        - id: durable-expansion
          label: Durable expansion
          title: Repeatable economics
          touchpoints: ["Retention, ROI, pricing, and contract durability requested", "No NRR, GRR, churn, or renewal data disclosed"]
          detail: "This stage cannot be treated as achieved on current public evidence."
    claimRefs: [CU005, CU006, CU007, CU013, CU014]
