company:
  name: Walden Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Walden has one publicly identified production customer, Toyota, with reported work
    beginning in February 2026 and moving from pilot to production in under two months. The
    customer evidence is promising but concentrated: strategic investors in aerospace,
    semiconductors, and logistics are described as potential channels rather than disclosed
    deployments, while retention, pricing, ROI, and customer breadth remain unverified.
sections:
  - id: customer-segments
    title: Buyer, user, and customer segmentation
    body: >-
      Walden's disclosed customer motion is concentrated in industrial environments where
      work is structured enough to support a wheeled general-purpose robot. The launch
      announcement identifies manufacturing and logistics as initial operating settings and
      names automotive, aerospace, semiconductors, electronics, logistics, and life sciences
      as relevant industries. The buyer is likely an industrial operator or manufacturing
      organization, while the day-to-day users are skilled teams working beside the robots;
      however, the public materials do not identify procurement owners, contracting entities,
      site counts, or whether Walden or the customer owns the equipment. Toyota is the only
      named production customer in the assigned evidence. Boeing, Samsung Ventures, and
      Prologis Ventures are strategic backers, but their investment participation does not
      establish a customer deployment. The ARM Institute separately reports that advanced
      manufacturing adoption is changing workforce skill requirements; this supports the
      customer problem context, not evidence that Walden has won additional accounts.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and operating proof
    body: >-
      The strongest adoption signal is a specific sequence: Walden spun out of Toyota
      Research Institute in January 2026, began a first pilot at a North American Toyota
      plant in February, and the company says the robots reached useful production work in
      under two months. Independent coverage adds that a robot worked eight-hour shifts
      beside human teams and performed loading and unloading of car parts, machinery
      cleaning, and parts kitting. These are meaningful workflow and duration indicators,
      but they do not disclose the number of robots, number of sites, paid contract value,
      uptime, task completion rate, labor savings, or customer ROI. Industry evidence also
      cautions that many humanoid deployments remain pilot-stage and reliant on human
      supervision, so Walden's single-site production claim should not be generalized to
      scaled autonomous adoption.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-retention
    title: Named proof, durability, and expansion
    body: >-
      Toyota provides a credible anchor reference because the evidence ties the name to a
      North American production site and describes work performed alongside human teams.
      The relationship is also structurally concentrated: Toyota is both the first disclosed
      customer and a co-lead investor through multiple entities. Public materials describe
      other strategic investors and target industries, but they do not disclose a Boeing,
      Samsung, Prologis, aerospace, semiconductor, electronics, logistics, or life-sciences
      deployment. No source in the assigned pool provides NRR, GRR, churn, renewal rate,
      contract length, cohort behavior, repeat-site expansion, or customer satisfaction.
      The absence of those metrics is an evidence gap, not evidence that retention or
      expansion is weak. The immediate diligence question is whether Toyota has converted
      the initial site into a paid, repeatable rollout and whether any non-investor customer
      has reached production. Reuters reports that Apptronik has publicly named commercial
      agreements with Mercedes-Benz and GXO Logistics; that competitor disclosure is context
      for the evidence investors can request, not proof of Walden's customer traction.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU016]
    tableRefs: [TU003]
  - id: customer-journey-and-gaps
    title: Adoption loop and diligence implications
    body: >-
      The public customer journey runs from a strategic-industrial relationship to a
      controlled pilot, then to production work in a live factory, with a possible future
      expansion path across tasks, sites, and adjacent verticals. Walden's full-stack
      positioning and continuous-learning claims could support expansion if the robot can
      transfer performance across workflows without excessive integration or supervision.
      That transfer is not yet demonstrated publicly. The customer case should therefore be
      underwritten as an early production reference rather than as proof of a repeatable
      multi-customer revenue engine. Before relying on customer breadth or durability,
      request paid-versus-pilot status, contract terms, task-level economics, uptime and
      intervention logs, safety sign-off, deployment headcount, renewal or expansion
      evidence, and references from customers that are not also investors.
    claimRefs: [CU006, CU008, CU011, CU013, CU014]
    figureRefs: [FU001]
