companyProfile:
  summary: >-
    1KOMMA5° is a Hamburg-based home electrification company that sells bundled residential energy systems spanning
    rooftop solar, battery storage, heat pumps, EV charging, smart metering, and Heartbeat AI software. It scales by
    acquiring regional installation businesses, then routes those local crews into a unified operating model that
    combines hardware delivery with virtual power plant optimization and dynamic tariff management. The result is a rare
    mix of physical rollout scale, software optionality, and consumer financing infrastructure, but the public record
    still leaves the exact economics of the software layer and the latest pre-IPO terms incomplete.
