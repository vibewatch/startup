              - CR013
      - number: '7.2'
        title: Supply Chain Volatility, Tariffs, and Operational Execution
        blocks:
          - type: paragraph
            body: >-
              On the operational front, 1KOMMA5° faces significant headwinds from global hardware supply chain
              realignments and escalating trade disputes among the United States, the European Union, and China.
              Following years of severe manufacturer overcapacities and deflationary pricing across Asian solar module
              and battery producers, manufacturer output curtailments and newly imposed tariffs prompted 1KOMMA5° to
              institute a 2.5% to 5.0% price increase across its equipment price lists. Management has characterized the
              spiraling web of retaliatory import tariffs as a systemic operational disruption comparable to major
              geopolitical maritime blockades. Domestically, the company's installation velocity is constrained by acute
              shortages of certified electrical and plumbing craftsmen. While 1KOMMA5° has assembled a distributed
              network across more than 50 German branch locations, installation execution relies heavily on licensed
              regional master craftsmen. Meeting heightened statutory installation standards while absorbing skilled
              trade wage increases threatens branch gross margins unless premium turnkey pricing and software recurring
              fees can be reliably sustained.
            claimRefs:
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
