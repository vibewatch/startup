      - number: '4.4'
        title: Capital Adequacy, Financing Facilities, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capitalization and balance-sheet standpoint, 1KOMMA5° maintains an uncommon liquidity structure for
              a high-growth cleantech operator. Since its founding in 2021, the company has raised nearly 400 million
              euros in equity capital while maintaining zero corporate debt. A 100 million euro revolving bank credit
              line established in 2023 remains completely undrawn. To finance massive hardware installations without
              levering its corporate balance sheet, 1KOMMA5° secured structured project facilities with leading banks,
              including up to 500 million euros dedicated to B2G public contracts and up to 1.0 billion euros for
              residential consumer project financing. Secondary market transactions through platforms like EquityZen
              provide modest pre-IPO shareholder liquidity. From an underwriting perspective, while top-line revenue
              scale and debt-free status provide near-term solvency, institutional diligence must examine unverified
              branch-level gross margins, post-acquisition installer working capital turnover, and stand-alone Heartbeat
              AI unit retention before ratifying pre-IPO valuation multiples.
            claimRefs:
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software Attach and Platform Diversification
            body: >-
              Heartbeat AI's annualized revenue run rate reaching approximately €30 million in August 2026 marks a
              meaningful transition from pure low-margin hardware installation toward recurring, high-margin software
              revenues that monetize power-grid flexibility.
            calloutType: strength
            claimRefs:
