      - number: '1.4'
        title: Chronological Milestones and Strategic Outlook
        blocks:
          - type: paragraph
            body: >-
              The historical evolution of 1KOMMA5° reflects rapid institutional scaling within the European CleanTech
              ecosystem across four distinct phases: founding and initial roll-up (2021–2022), unicorn scaling and
              software expansion (2023), pre-IPO capitalization and product diversification (2024–2025), and customer
              financing expansion ahead of public listing (2026). Incorporating in Hamburg in July 2021, the venture
              launched its Heartbeat AI energy intelligence engine in April 2022 to unify disparate distributed energy
              resources into an active residential virtual power plant. After crossing the €1 billion valuation mark in
              June 2023, the enterprise fortified its capital base with a €150 million pre-IPO injection in December
              2024 and an extension with Sabanci in July 2025, targeting an IPO window in 2026. Hardware offerings
              evolved from standard solar packages to dedicated heat pump scaling—surpassing 10,000 German units by
              January 2026—and the PowerHarvester standalone battery system. With its €1 billion bank-backed installment
              financing vehicle mobilized in mid-2026, 1KOMMA5° seeks to insulate its order pipeline from regulatory
              subsidy volatility while positioning Heartbeat AI direct marketing as a long-term recurring revenue
              driver.
