              - CM008
              - CM014
      - number: '2.3'
        title: Buyer Segmentation, Budget Allocation, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Adoption within 1KOMMA5°'s target customer base spans three core residential segments alongside an
              operational B2B acquisition channel. Suburban single-family homeowners represent the largest volume
              category, typically evaluating rooftop solar and battery storage to insulate household operating budgets
              from grid retail electricity prices that exceed 35 cents per kWh. A second distinct cohort comprises
              heating transition switchers, who are replacing aging oil or gas boilers with heat pumps motivated by
              federal replacement subsidies and operating cost parity achieved through 10-cent electricity guarantees. A
              third, tech-forward prosumer segment actively optimizes electric mobility and home battery charging via
              dynamic tariffs to exploit negative power exchange pricing. On the commercial supply side, regional master
              craftsmen and electrical installation business owners represent an essential partner cohort, joining
              1KOMMA5°'s roll-up network to secure growth financing, enterprise IT systems, and consolidated hardware
              procurement.
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
      - number: '2.4'
        title: Growth Drivers, Regulatory Headwinds, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Market acceleration is supported by macro decarbonization mandates, falling heat pump hardware costs, and
              expanding renewable generation that frequently drives daytime spot electricity prices into negative
              territory. However, near-term growth faces material regulatory and operational headwinds. The German Solar
              Association (BSW-Solar) warned that draft provisions in the Renewable Energy Sources Act (EEG) proposing
              to eliminate grid feed-in compensation for new PV installations up to 25 kW from 2027 create acute
              uncertainty. While fixed feed-in compensation of 7.78 cents per kWh remains locked for existing 20-year
              contracts, eliminating future feed-in tariffs compresses standalone rooftop solar returns. Although
              pull-forward purchasing may temporarily bolster 2026 demand, sustainable economics require intelligent
              self-consumption and battery cycling. Material diligence gaps persist regarding whether 1KOMMA5° can
              convert its acquired hardware customer base into durable, high-margin software subscribers once initial
              hardware installation subsidies expire.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Residential Solar Contraction and EEG Feed-in Elimination
            body: >-
              The 21% year-on-year drop in German residential solar PV installations in Q1 2026, coupled with the draft
              Renewable Energy Sources Act provision eliminating feed-in compensation for systems under 25 kW starting
              in 2027, poses a significant near-term demand headwind for hardware installations.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM007
          - type: callout
            title: Decoupling Hardware Delivery from Solar Cycles via Heartbeat AI
            body: >-
              By bundling battery storage and heat pumps with dynamic spot-market electricity trading, 1KOMMA5° attempts
              to protect customer economics from midday solar value deflation and negative wholesale power prices.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Challengers, Retail Partnerships, and Status Quo'
        blocks:
          - type: paragraph
            body: >-
              The European residential electrification and solar transition is characterized by three distinct
              competitive cohorts: direct vertically integrated technology providers, mass-market retail partnerships,
              and traditional fragmented craft installers. As single-family homeowners seek to hedge elevated retail
              power tariffs and electrify residential heating and transport, the competitive perimeter has expanded
              beyond standalone rooftop photovoltaic modules into fully synchronized home energy management systems
              combining PV panels, lithium-iron-phosphate batteries, heat pumps, and electric vehicle wallboxes. In this
              market, German clean-tech unicorn Enpal represents the most direct integrated peer, having pioneered
              zero-down solar rental contracts and scaled an asset-backed securitization financing engine. Concurrently,
              big-box retailer IKEA has entered the German market in commercial collaboration with Swedish installer
              Svea Solar, leveraging consumer retail footfall to market standardized dynamic electricity tariffs and
              hardware packages. Meanwhile, thousands of independent local electrical and heating contractors constitute
              the status-quo incumbent base. While these traditional craftsmen enjoy established local consumer trust
              and geographic proximity, they lack proprietary software platforms, dynamic wholesale electricity market
              access, and bulk procurement economies of scale.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 'Direct Peer Profiles: Capital Scale, Financing Structures, and Asset Delivery'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the relative scale and capital structures of primary peers reveals distinct operational
              philosophies regarding asset ownership, balance-sheet exposure, and installation delivery. 1KOMMA5° has
              accumulated approximately €400 million in cumulative equity financing, recently commanding a $1.35 billion
              post-money valuation while targeting approximately $750 million in fiscal year 2026 top-line revenue
              across seven international markets. Unlike pure software orchestrators or asset-light marketplaces,
              1KOMMA5° pursues an acquisitive roll-up model, purchasing operational equity stakes in established
              regional trade enterprises (Meisterbetriebe) to secure scarce installation labor capacity. In direct
              contrast, chief rival Enpal has integrated approximately 250,000 distributed energy resources across more
              than 80,000 households, anchored by a consumer loan and rental engine that securitizes solar payment
              receivables. Enpal's landmark €100 million public asset-backed securitization backed by the European
              Investment Bank and European Investment Fund demonstrates institutional debt market validation but also
              highlights significant capital intensity and refinancing sensitivity. Meanwhile, Svea Solar leverages
              IKEA's global brand visibility and customer loyalty program to minimize client acquisition expenses
              without bearing direct corporate craft payroll obligations.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Differentiation Mechanisms, Dynamic Tariffs, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Commercial differentiation in residential energy technology is pivoting decisively from hardware
              installation toward software optimization and dynamic wholesale energy trading. 1KOMMA5° positions
              Heartbeat AI as its core technological asset, committing over €100 million in planned software research
              and development in 2027 to automate electricity trading, real-time metering, and automated home balancing.
              Through its Dynamic Pulse tariff and mandatory bundled smart meter installations, 1KOMMA5° enables
              residential batteries to charge from the grid during low-cost or negative price intervals and dispatch
              stored energy during peak wholesale price spikes. IKEA and Svea Solar have responded with the Svea Strom
              tariff, offering spot-market pricing plus a 2 cent per kilowatt-hour procurement charge and a modest
              monthly administrative fee. However, retail referral models offer limited automated multi-asset
              orchestration compared to dedicated energy gateways. Switching costs for homeowners are fundamentally
              driven by physical asset lock-in: once a customer installs a proprietary inverter, battery storage unit,
              and control gateway, transitioning to an alternative virtual power plant provider entails software
              incompatibility and multi-homing friction, effectively insulating the primary installer's ongoing software
              relationship.
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 'Moat Durability: VPP Aggregation, Regulatory Shifts, and Margin Risks'
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of competitive moats in European residential clean tech faces severe headwinds
              from hardware commoditization, regulatory evolution, and incumbent utility resistance. Standard
              photovoltaic modules and residential storage cells face persistent global supply surpluses, eroding gross
              margins on unbundled equipment sales and rendering standalone installation businesses increasingly
              fragile. Furthermore, a draft law by the German Federal Ministry for Economic Affairs proposes terminating
              guaranteed EEG feed-in tariffs for new solar systems under 25 kilowatts beginning in 2027. Under existing
              regulations, a 10 kWp system receives a guaranteed 7.78 cents per kilowatt-hour over 20 years,
              representing up to €12,500 in lifetime subsidized revenue. The impending elimination of this baseline
              subsidy forces homeowners to maximize local self-consumption through intelligent battery storage, dynamic
              heat pump operation, and virtual power plant flexibility trading. To protect its decentralized model,
              1KOMMA5° lodged a formal competition complaint with the European Commission against German subsidies for
              20 gigawatts of gas-fired peaker plants, asserting that centralized fossil subsidies distort power markets
              at the expense of distributed virtual power plant capacity.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP010
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software Layer as the Long-Term Differentiator
            body: >-
              While hardware components (PV modules, heat pumps, batteries) face severe price deflation and
              commoditization, software orchestration platforms like Heartbeat AI and Enpal.One capture value through
              dynamic tariff arbitrage and virtual power plant flexibility trading.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP007
          - type: callout
            title: Impending Elimination of EEG Feed-In Tariffs Reshapes Unit Economics
            body: >-
              The German government's planned 2027 elimination of feed-in tariffs for residential PV under 25 kW will
              erode guaranteed export income, accelerating the shift toward full self-consumption, battery storage, and
              dynamic trading, while increasing competitive pressure on installers without software integration.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Software Monetization
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° generates revenue through a hybrid commercial model combining decentralized hardware installation
              with software-driven energy orchestration. The primary revenue engine comprises turnkey residential
              installations across rooftop solar photovoltaic systems, battery storage units, heat pumps, air
              conditioning, and EV charging wallboxes. In parallel, the company has built out its proprietary energy
              management software under the Heartbeat AI brand. Heartbeat AI connects installed residential assets to
              wholesale electricity exchanges, aggregating over 1 GW of flexibility capacity into a unified residential
              virtual power plant. The software monetizes through flat-rate subscriptions and dynamic electricity tariff
              optimization under the Dynamic Pulse brand. In August 2026, the AI software division attained an
              annualized revenue run rate of approximately 30 million euros, nearly doubling year-over-year. Beyond
              residential consumers, the company has expanded into business-to-government (B2G) and municipal real
              estate contracts, diversifying revenue across institutional buyers.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
