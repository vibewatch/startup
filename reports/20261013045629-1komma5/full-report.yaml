              - CV016
      - number: '8.2'
        title: Operating Proof and Valuation Quality
        blocks:
          - type: paragraph
            body: >
              Management's current case combines a €700 million 2026 revenue forecast, 35% to 40% growth, roughly €40
              million of hardware EBITDA, and about €30 million of annualized Heartbeat AI revenue. This is meaningful
              operating evidence, but it mixes a forward hardware forecast with a software run-rate and does not
              disclose audited segment gross margin, retention, or cash conversion. The company also says annual
              software research and development of about €35 million will be funded from operating cash flow and that
              customer-segment financing facilities leave the corporate balance sheet debt-free. Those claims improve
              the thesis, but do not by themselves justify a software multiple for the consolidated installer-heavy
              business.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Bull, Base, and Bear Cases Without False Precision
        blocks:
          - type: paragraph
            body: >
              Scenario work should use the latest reported $1.35 billion to $1.4 billion financing mark as a reference,
              not as proof of fair value. A bull case requires delivery of the revenue and EBITDA guidance plus
              independently verified recurring software economics; only then would a premium to the reference mark be
              analytically supportable. The base case is execution near guidance with limited evidence for multiple
              expansion. The bear case is another material target miss, delayed liquidity, or weak Heartbeat conversion,
              with downside magnified by unknown preferences. Public inputs cannot support probability percentages, a
              valuation floor, or target returns, so the table records signals and decision rules instead of invented
              precision.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
