  - id: TV001
    title: Recommendation Summary
    columns:
      - Decision field
      - Current assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research-more
        - A reported financing mark exists, but security terms and audited current results do not.
        - Do not underwrite an entry until the data-room evidence is available.
      - - Confidence
        - Medium
        - Two independent sources describe the latest round; operating guidance remains company-supplied.
        - Treat the mark as a reference rather than independently verified fair value.
      - - Risk rating
        - High
        - The IPO is on hold, a prior revenue target was missed, and the preference stack is unavailable.
        - Require downside waterfall and cash-conversion diligence.
      - - Valuation stance
        - Stretched / not underwritten
        - The latest reported mark is $1.35B-$1.4B, while software economics needed for a premium are undisclosed.
        - No premium multiple should be paid on the public record alone.
      - - Entry discipline
        - Terms-first
        - Headline valuation does not reveal ownership, dilution, or liquidation priority.
        - Price only after a fully diluted cap table and preference waterfall are verified.
    notes: >-
      Assessments use the latest allocated financing reports and company guidance; no current share price, cap table,
      preference waterfall, or audited 2026 financial statements were publicly available in the retained evidence.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV013
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Side
      - Argument
      - Public evidence
      - What would change the view
    rows:
      - - Thesis
        - The integrated hardware and Heartbeat stack creates multiple monetization surfaces.
        - The product set includes expandable storage and Heartbeat-ready control.
        - Verify attach rate, cohort retention, recurring gross margin, and customer savings.
      - - Thesis
        - Management guides to material 2026 growth and positive hardware EBITDA.
        - €700M revenue and €40M hardware EBITDA are forecast for 2026.
        - Confirm with audited results and cash conversion after software R&D.
      - - Thesis
        - The operating model can deploy capital and operational support through local businesses.
        - The B2B page describes equity investment, growth financing, and operating projects.
        - Show acquisition-level returns and organic performance by cohort.
      - - Anti-thesis
        - Execution credibility is weakened by a prior material target miss.
        - Independent reports place 2024 revenue at €520M-€540M versus a plan as high as €750M.
        - Two clean reporting periods at or above guidance would reduce this concern.
      - - Anti-thesis
        - The software premium is not yet supported by disclosed unit economics.
        - Annualized software revenue is about €30M, but margin and retention are not disclosed.
        - Provide audited segment revenue, gross margin, churn, and cash contribution.
    notes: >-
      Company metrics are explicitly treated as management claims; the 2024 figures are reported from preliminary
      company results and differ by €20M across retained publications.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks and downside trigger
      - Probability signal
    rows:
      - - Bull
        - >-
          Revenue and €40M hardware EBITDA guidance are met; Heartbeat grows beyond its €30M run-rate with verified
          recurring margins.
        - >-
          A premium above the $1.35B-$1.4B reference mark is supportable only after software quality and fully diluted
          terms are verified.
        - Trigger fails if reported growth does not convert into cash or software retention.
        - 'Unscored: public evidence is insufficient for a defensible probability.'
      - - Base
        - >-
          Revenue approaches €700M, hardware EBITDA is near guidance, and software grows without demonstrated premium
          economics.
        - >-
          The latest $1.35B-$1.4B mark remains the reference; no reliable upside range or target return can be
          calculated.
        - Another guidance miss or prolonged listing delay removes the limited execution premium.
        - Best aligned with current guidance, but not assigned a numeric probability.
      - - Bear
        - Revenue or EBITDA misses guidance, Heartbeat conversion stalls, or liquidity remains unavailable.
        - >-
          Value falls below the latest reference mark; the floor and common-equity recovery are indeterminate without
          preference terms.
        - A down round or senior preference overhang becomes the thesis-break event.
        - Material downside case; no probability estimate is supported.
    notes: >-
      Scenario boundaries use the latest reported financing mark and management guidance. Numeric probabilities, target
      returns, and a downside valuation floor are omitted because ownership, net debt, and preference terms are
      unavailable.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
      - CV012
      - CV016
