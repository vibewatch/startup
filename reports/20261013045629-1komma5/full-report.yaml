  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Hardware Portfolio and Edge Electrification Infrastructure
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° delivers residential home electrification through a bundled hardware stack comprising rooftop
              photovoltaic (PV) modules, modular lithium iron phosphate (LFP) battery storage systems, heat pumps,
              wallbox electric vehicle chargers, and mandatory smart meter gateways. In its core German market, the
              company installs full-black glass-glass bifacial solar modules featuring TOPCon N-type cells rated up to
              470 Wp with 23.5% module efficiency, backed by a 30-year performance warranty. On the storage layer,
              1KOMMA5° markets a proprietary modular battery architecture expandable up to 41.9 kWh using prismatic LFP
              chemistry, capable of continuous charge and discharge rates up to 20.16 kW. The battery firmware
              incorporates Micro-Cycle technology designed to execute high-frequency micro-charges and micro-discharges
              that mitigate thermal stress during wholesale market price arbitrage. Unlike pure software aggregators,
              1KOMMA5° mandates smart meter installations with every solar installation, directly bypassing German
              distribution system operator (DSO) rollout delays and establishing a low-latency edge measurement baseline
              necessary for dynamic tariff execution.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
