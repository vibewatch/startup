  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Policy, and Subsidy Transition Risks
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5°'s residential electrification growth model operates in close proximity to national
              decarbonization subsidies and German energy legislation. A pivotal legislative exposure is an active draft
              law from the Federal Ministry for Economic Affairs (BMWK) proposing the complete abolition of state
              feed-in tariffs (EEG-Vergütung) for new residential photovoltaic systems under 25 kilowatts starting in
              2027. For a standard single-family home installation, this reform represents a potential financial loss of
              up to €12,500 in guaranteed feed-in revenue over the statutory 20-year operational period. Furthermore,
              ongoing political disputes and revisions surrounding the Building Energy Act (GEG) have injected
              substantial consumer hesitation into the German heating market, where industry bodies such as the German
              Heat Pump Association (BWP) warn that erratic political signals risk becoming an investment brake despite
              55% market unit growth in 2025. Additionally, persistent national delays in Germany's statutory smart
              meter gateway rollout force 1KOMMA5° to bundle its own metering infrastructure to enable Heartbeat AI
              wholesale market participation.
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR010
