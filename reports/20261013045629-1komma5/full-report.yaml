            title: Headline Valuation Is Not Common-Equity Value
            body: >-
              The retained public sources do not disclose the fully diluted ownership, liquidation preferences,
              participation rights, or anti-dilution terms needed to translate the reported round valuation into
              investor returns.
            calloutType: risk
            claimRefs:
              - CV013
              - CV016
