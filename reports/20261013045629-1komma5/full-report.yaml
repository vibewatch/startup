              - CI005
              - CI011
      - number: '4.2'
        title: Turnkey Pricing, Monetization Structure, and Customer Payback
        blocks:
          - type: paragraph
            body: >-
              Residential electrification pricing follows a capital-intensive turnkey project model. In Germany, a
              standard residential 10 kWp photovoltaic system combined with battery storage commands a turnkey list
              price of approximately 25,000 euros, translating to 1,000 to 1,800 euros per kilowatt-peak installed.
              Customer economics rely heavily on energy bill savings achieved by displacing grid electricity costing
              over 35 cents per kWh with on-site solar generation produced at an effective cost from 5 cents per kWh.
              Surplus solar power fed into the grid captures a guaranteed 20-year statutory EEG tariff of 7.78 cents per
              kWh for sub-10 kWp systems, resulting in an estimated customer payback horizon of 7 to 12 years. Heartbeat
              AI enhances these payback dynamics by automatically purchasing power during negative or low-cost pricing
              windows and discharging storage during peak tariff periods. However, because feed-in subsidies face
              legislative phase-out proposals for post-2026 systems, long-term consumer adoption will increasingly hinge
              on algorithmic market arbitrage rather than guaranteed public feed-in revenue.
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Commercial Scaling, Margin Structure, and Operating Profitability
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° has demonstrated resilient revenue growth across fluctuating European clean-energy cycles. In
              2024, the company recorded 520 million euros in total revenue, driven by organic sales expansion of 36
              percent to 490 million euros amidst broader sector contraction. Through the first nine months of 2026,
              organic revenue grew 30 percent year-on-year, positioning the firm toward full-year guidance of
              approximately 750 million US dollars (700 million euros). In its core hardware business, management
              projects full-year 2026 operating profit (EBITDA) of approximately 40 million euros. Nonetheless, cost
              pressures persist: 1KOMMA5° sources European polysilicon from German manufacturers at a significant cost
              premium over Asian commodity supply, while localized sales expenses and regional installer integration
              require sustained operational discipline. The company supports ongoing technology differentiation by
              reinvesting around 35 million euros annually into Heartbeat AI research and development entirely out of
              operating cash flow.
            claimRefs:
