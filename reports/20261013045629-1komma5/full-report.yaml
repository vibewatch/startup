chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founders, and Business Model
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° is a Hamburg-based clean technology enterprise established in 2021 by clean energy executives
              Philipp Schröder, Micha Grüber, and Jannik Schall. The venture was formed with the explicit commercial
              mandate of accelerating residential decarbonization by creating an integrated one-stop-shop for household
              electrification. Rather than acting purely as a digital software platform or a conventional regional
              subcontractor, 1KOMMA5° pairs localized hardware installation—encompassing rooftop photovoltaics, battery
              storage systems, heat pumps, and electric vehicle wallboxes—with its proprietary Heartbeat AI energy
              intelligence engine. This software connects distributed residential assets into a cohesive virtual power
              plant that interacts dynamically with wholesale electricity exchanges. Central to 1KOMMA5°’s operational
              strategy is the programmatic acquisition and consolidation of regional electrical and heating master craft
              businesses (Meisterbetriebe), providing the enterprise with direct execution capacity across Germany,
              Scandinavia, Spain, the Netherlands, and Australia. Executive leadership is steered by CEO Philipp
              Schröder, who previously led Sonnen and Tesla Germany, CFO Micha Grüber, and CPO Jannik Schall, creating
              deep founder-market alignment across clean energy hardware rollout and software optimization.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO011
              - CO012
      - number: '1.2'
        title: Capitalization, Financing History, and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° has executed an aggressive capital mobilization strategy since its 2021 inception, raising
              approximately €400 million in direct equity capital and over €500 million in cumulative financing while
              maintaining a debt-free holding corporate structure. Following rapid revenue expansion across 2022 and
              2023, the enterprise attained unicorn status in June 2023 at a post-money valuation exceeding €1 billion.
              In December 2024, the company secured a €150 million pre-IPO financing round backed by US institutional
              investor CalSTRS, Hamilton Lane, G2 Venture Partners, Norrsken VC, 2150, Eurazeo, and existing family
              office backers. In July 2025, 1KOMMA5° extended this pre-IPO round by bringing Sabanci Climate Ventures on
              board as an additional strategic shareholder to support expansion across Southern Europe and global
              markets. The corporate cap table exhibits a stable core of industrial and institutional stakeholders,
              including the Haniel family office (holding approximately 12%), Porsche Ventures (6%), Eurazeo (5%), and
              G2 Venture Partners (5%). Nevertheless, commercial reporting indicates that the firm’s valuation step-up
              in the late 2024 round was minimal, reflecting broader market headwinds across the European solar sector
              and tempering pre-IPO valuation multiples. Liquidity for early stakeholders has concurrently been
              established through accredited pre-IPO marketplaces such as EquityZen.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Scale Metrics, Revenue Performance, and Financing Vehicles
        blocks:
          - type: paragraph
            body: >-
              Operational scale at 1KOMMA5° is characterized by substantial physical deployment capacity paired with
              growing software connectivity. As of July 2025, the enterprise deployed nearly 2,500 employees globally
              and managed an active customer installation base of more than 120,000 households. The company achieved
              €540 million in revenue for fiscal year 2024, maintaining profitability in its underlying hardware
              installation division despite a sharp cyclical downturn across European residential solar and heat pump
              markets; this outturn nonetheless represented a shortfall against management’s initial target of up to
              €750 million. To combat upfront capital friction for prospective residential buyers, 1KOMMA5° structured a
              €1 billion installment purchase vehicle with European banks in June 2026, enabling households to acquire
              solar and heat pump systems without initial equity outlays and linking payments to dynamic electricity
              savings generated by Heartbeat AI. Product-level commercial traction is demonstrated by heat pump
              installations, which surpassed 10,000 cumulative units in Germany by January 2026 after quadrupling
              year-over-year in 2025. In contrast, the company’s launch of the PowerHarvester standalone battery system
              in April 2025 highlights economic constraints: independent trade reviews note that while the system
              enables dynamic power arbitrage, it requires exceptionally high annual household electricity consumption
              (>10,000 kWh) to achieve an acceptable six-year payback.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
