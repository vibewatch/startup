              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV016
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >
              The company has pre-IPO positioning and an EquityZen page describing potential shareholder liquidity, but
              neither proves an active executable market at a disclosed price. Trending Topics reports that the planned
              listing remains on hold and depends on future performance. Final diligence should obtain the October 2026
              financing documents, a fully diluted cap table, liquidation and participation terms, audited 2025 results,
              current 2026 management accounts, and Heartbeat cohort economics. Thesis-break triggers are a repeat
              material miss against the €700 million guide, failure to substantiate hardware EBITDA and operating cash
              flow, or financing terms that leave common equity with poor recovery near the latest reported mark.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
              - CV016
