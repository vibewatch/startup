  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Product Architecture, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The residential decarbonization market addressed by 1KOMMA5° encompasses decentralized energy generation,
              stationary battery storage, heat transition equipment, and residential electric vehicle charging. Rather
              than treating photovoltaic panels, home batteries, and heat pumps as isolated consumer purchases, the
              sector increasingly demands unified home electrification packages. Status-quo alternatives remain
              fragmented: traditional fossil fuel heating systems (natural gas and heating oil boilers), unmanaged grid
              electricity consumption subject to volatile retail tariffs, and standalone solar installations delivered
              by local trades without smart energy coordination. By coupling physical asset deployment with the
              proprietary Heartbeat AI energy management platform, 1KOMMA5° links distributed residential hardware into
              coordinated virtual power plants. This software architecture differentiates the offering from pure-play
              hardware distributors by monetizing wholesale price volatility, enabling automated electricity arbitrage
              during low or negative pricing intervals, and providing dynamic tariff guarantees to homeowners.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing, TAM/SAM/SOM Hierarchy, and Segment Growth
        blocks:
          - type: paragraph
            body: >-
              Sizing the European residential clean energy transition requires separating unconstrained policy targets
              from near-term installation capacity. While the theoretical Total Addressable Market spans tens of
              millions of single-family dwellings across Europe, Serviceable Addressable Market dynamics in 2026 reflect
              diverging segment trends. In Germany, the company's foundational geography, total solar PV additions
              reached 3.51 GW in Q1 2026, marking a 6% year-on-year contraction. Crucially, the residential rooftop
              segment contracted by 21% year-on-year to 850 MW, reflecting saturation among early adopters, rising
              interest rates, and consumer hesitation. Commercial rooftop solar similarly dropped 33% to 600 MW, with
              only ground-mounted utility solar growing. Conversely, residential heat pump adoption expanded rapidly,
              with 1KOMMA5° reporting a 1,300% sales increase in 2024 to approximately 4,000 units. Stationary storage
              also surged across Germany to 2 GWh commissioned in Q1 2026, though large-scale systems drove the majority
              of expansion. Addressable SOM remains gated by undisclosed Heartbeat software attach rates.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
