      - number: '6.3'
        title: Customer Proof, Review Track Record, and Deployment Friction
        blocks:
          - type: paragraph
            body: >-
              Evidence of end-user adoption and operational reliability exhibits marked divergence across standardized
              enterprise infrastructure and localized consumer installation workflows. At the enterprise technology
              layer, 1KOMMA5° leverages Google Cloud BigQuery and Cloud Run to ingest live IoT telemetry across its
              fleet of connected inverters, batteries, and heat pumps, centralizing disparate acquired regional
              businesses into a common operating system. In consumer retail markets, third-party ratings demonstrate
              moderate-to-strong initial customer satisfaction coupled with recognizable operational friction. On the
              independent Australian platform SolarQuotes, 1KOMMA5° (incorporating its acquired Solaray Energy branches
              in Sydney and Melbourne) holds an aggregate rating of 4.2 out of 5 across 742 customer reviews. Sub-scores
              reveal high marks for system quality (4.5/5) and installation (4.3/5), but lower satisfaction for customer
              service (4.2/5) and value for money (4.2/5), with 139 reviews registering at 3 stars or below. Customer
              feedback reveals recurring post-installation friction points, including protracted service response
              windows, delays in post-installation subsidy or rebate paperwork, and communication handoff gaps between
              central sales representatives and decentralized installation teams.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
          - type: table
            tableRef: TU003
