      - number: '5.2'
        title: Heartbeat AI Platform and Virtual Power Plant Aggregation
        blocks:
          - type: paragraph
            body: >-
              The core technological differentiator claimed by 1KOMMA5° is Heartbeat AI, an energy management and market
              optimization platform developed and maintained by its spun-out software subsidiary, Heartbeat AI GmbH.
              Heartbeat operates a hybrid edge-cloud architecture: local edge controllers (the proprietary Heartbeat box
              and embedded gateway firmware) interface with residential inverters, battery management systems, heat pump
              controllers, and EV wallboxes over local protocols while maintaining secure telemetric links to the
              central cloud platform. According to technical disclosures, Heartbeat executes approximately 4.8 million
              automated optimization decisions daily, ingesting numerical weather predictions, historical consumption
              profiles, and day-ahead as well as intraday electricity spot prices to schedule battery charging, thermal
              storage pre-heating, and EV charging cycles. Aggregated residential endpoints are pooled into a
              residential virtual power plant (VPP), which the company claims reached 1 GW of flexible capacity in May
              2026 with a long-term roadmap targeting 20 GW by 2030. In markets like Sweden, Heartbeat has secured
              regulatory qualification to deliver Fast Frequency Reserve (FCR-D) ancillary grid services, illustrating
              the software's capability to participate in high-speed frequency stabilization.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
